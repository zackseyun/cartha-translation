  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: pt
  text: 'Fez das trevas o seu esconderijo[a]; ao redor de si, o seu abrigo[b]: águas escuras[c], nuvens espessas dos céus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu lugar oculto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua tenda”, “sua cabana” ou “sua cobertura”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “escuridão de águas”.
    reason: literal_rendering
lexical_decisions:
- source_word: יָשֶׁת
  choice: Fez
  rationale: O qal imperfeito de שׁית, em narrativa poética, descreve o ato de estabelecer algo; “fez” é natural em português e preserva a ideia de constituir as trevas como esconderijo.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Equivalente corrente que mantém a imagem atmosférica e a obscuridade da manifestação divina, sem lhe atribuir sentido moral.
- source_word: סִתְרוֹ
  choice: o seu esconderijo
  rationale: O termo derivado de סתר indica um lugar de ocultação; “esconderijo” é concreto, claro e natural.
- source_word: סְבִיבוֹתָיו
  choice: ao redor de si
  rationale: Expressa de modo conciso a relação espacial e deixa claro que o abrigo circunda o próprio Deus.
- source_word: סֻכָּתוֹ
  choice: o seu abrigo
  rationale: סֻכָּה pode designar cabana, tenda ou cobertura temporária; “abrigo” comunica sua função no contexto sem introduzir linguagem cultual.
- source_word: חֶשְׁכַת מַיִם
  choice: águas escuras
  rationale: Expressão natural em português para a cadeia construta hebraica, preservando a imagem de águas envoltas em escuridão; a forma mais literal consta em nota.
- source_word: עָבֵי שְׁחָקִים
  choice: nuvens espessas dos céus
  rationale: עָבִים são nuvens densas ou espessas, e שְׁחָקִים é uma designação poética dos céus; a tradução conserva esse registro.
theological_decisions:
- issue: As trevas descrevem a ocultação divina numa manifestação em meio à tempestade, sem explicitação de sentido moral ou metafísico.
  choice: Conservar diretamente a imagem poética de Deus oculto por trevas, águas e nuvens.
  alternative: Interpretar as trevas como símbolo de juízo ou entender o abrigo como referência específica ao tabernáculo.
  rationale: O hebraico apresenta imagens paralelas de tempestade e ocultação. A tradução preserva essa tensão poética sem acrescentar uma interpretação doutrinária ou cultual.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. O paralelismo e as imagens concretas da tempestade foram preservados; evitou-se tanto o arcaísmo quanto uma interpretação teológica acrescentada ao texto.
