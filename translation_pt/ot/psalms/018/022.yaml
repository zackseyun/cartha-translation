  rationale: Preserva o sentido abrangente do quantificador hebraico.
- source_word: מִשְׁפָּטָיו
  choice: os seus juízos
  rationale: Mantém a dimensão judicial e pactual de מִשְׁפָּט e corresponde ao uso frequente do termo nos Salmos.
- source_word: לְנֶגְדִּי
  choice: diante de mim
  rationale: Conserva a imagem espacial do hebraico, aqui com o sentido de manter os juízos presentes à vista e à consciência.
- source_word: וְחֻקֹּתָיו
  choice: e os seus decretos
  rationale: Expressa normas fixadas ou prescrições estabelecidas; 'decretos' é corrente, solene e compreensível no português moderno.
- source_word: לֹא אָסִיר
  choice: não afastei
  rationale: 'Representa o valor causativo e transitivo do Hifil de סור: o salmista não removeu nem pôs longe de si os decretos divinos.'
- source_word: מֶנִּי
  choice: de mim
  rationale: Traduz explicitamente o complemento preposicional hebraico e sustenta a leitura transitiva 'afastei de mim'.
