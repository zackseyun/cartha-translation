  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: pt
  text: Invoco Yahweh[b], que é digno de louvor, e sou salvo dos meus inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei salvo dos meus inimigos”. O verbo hebraico também pode ser entendido com sentido futuro.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino YHWH, aqui transliterado como “Yahweh” e tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: מְהֻלָּל
  choice: digno de louvor
  rationale: O particípio passivo de הלל, empregado em relação a Yahweh, tem aqui força avaliativa. “Digno de louvor” expressa essa ideia com clareza e naturalidade em português.
- source_word: אֶקְרָא
  choice: invoco
  rationale: קרא seguido do nome divino pode indicar chamar por Deus ou apelar a ele. “Invoco” preserva de modo conciso o sentido de apelo dirigido a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: וּמִן
  choice: e ... dos
  rationale: A conjunção e a preposição ligam a invocação de Yahweh ao livramento dos inimigos sem tornar explícita uma relação causal além do hebraico.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Tradução direta e transparente de אֹיְבַי, substantivo com sufixo de primeira pessoa do singular.
- source_word: אִוָּשֵׁעַ
  choice: sou salvo
  rationale: O imperfeito nifal de ישׁע pode exprimir aqui uma afirmação geral ou confiante sobre o resultado da invocação. A nota preserva a possível leitura futura.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Valor aspectual de אִוָּשֵׁעַ
  choice: 'presente de sentido geral ou resultativo: “sou salvo”'
  alternative: 'futuro: “serei salvo”'
  rationale: O imperfeito hebraico admite ambas as leituras no contexto poético. O texto principal expressa a confiança do salmista sem eliminar a leitura futura, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. “Invoco” mantém o tom de oração sem soar excessivamente arcaico; “digno de louvor” torna explícita a força predicativa do particípio.
