source:
  edition: WLC
  text: לַ/מְנַצֵּ֤חַ לְ/עֶ֥בֶד יְהוָ֗ה לְ/דָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר לַ/יהוָ֗ה אֶת דִּ֭בְרֵי הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/י֤וֹם הִֽצִּיל יְהוָ֘ה אוֹת֥/וֹ מִ/כַּ֥ף כָּל אֹ֝יְבָ֗י/ו וּ/מִ/יַּ֥ד שָׁאֽוּל׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: pt
  text: Ao regente. De Davi, servo[a] de Yahweh, que falou a Yahweh as palavras deste cântico, no dia em que Yahweh o livrou da mão[b] de todos os seus inimigos e da mão de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escravo». O termo hebraico pode designar tanto um servo como um escravo; aqui, «servo» reflete seu uso como título honorífico de Davi.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, «da mão de» é uma expressão que indica libertação do poder ou controle de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Fórmula dos títulos dos Salmos dirigida ao responsável pela execução musical; «regente» é conciso e mantém a função litúrgico-musical.
- source_word: לְעֶבֶד
  choice: servo
  rationale: Embora עֶבֶד também possa significar «escravo», aqui funciona como título honorífico que expressa a relação de Davi com Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, sem substituí-lo por um título.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a fórmula tradicional dos títulos sem definir de maneira mais estreita se a preposição indica autoria, pertença ou associação.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה
  choice: que falou a Yahweh
  rationale: Mantém Davi como antecedente da oração relativa e conserva a direção do discurso a Yahweh.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: as palavras deste cântico
  rationale: Reproduz o objeto da fala e usa «cântico» para שִׁירָה no contexto poético e musical do Saltério.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Preserva a construção temporal hebraica em português natural.
- source_word: הִצִּיל
  choice: livrou
  rationale: Expressa resgate de perigo e domínio hostil sem acrescentar uma interpretação soteriológica mais ampla.
- source_word: מִכַּף / מִיַּד
  choice: da mão de
  rationale: Mantém a metáfora hebraica de estar sob o poder ou controle de alguém, bem como o paralelismo entre os dois segmentos.
- source_word: כָּל אֹיְבָיו
  choice: todos os seus inimigos
  rationale: Equivalência direta e natural da expressão coletiva hebraica.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido contextual de עֶבֶד
  choice: servo
  alternative: escravo
  rationale: O termo admite ambos os sentidos, mas neste título real identifica honrosamente Davi por sua submissão e serviço a Yahweh, sem pôr em primeiro plano sua condição jurídica.
- issue: Amplitude de לְדָוִד no título
  choice: De Davi
  alternative: Para Davi; pertencente a Davi
  rationale: A formulação portuguesa mantém aberta a relação exata entre Davi e o salmo, em vez de tornar explícita apenas a autoria.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a concisão própria de um título de salmo. A metáfora da «mão» e a possível amplitude de «De Davi» foram preservadas; as notas esclarecem os pontos lexicais sem resolver além do que o hebraico permite.
