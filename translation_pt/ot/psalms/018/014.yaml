revisions:
- from: Ele lançou suas flechas e os dispersou; enviou muitos relâmpagos e os deixou em confusão.[a]
  to: Ele lançou suas flechas e os dispersou; com muitos relâmpagos, os confundiu.[a]
  rationale: A revisão evita introduzir um verbo explícito na segunda cola, preserva a função possivelmente adverbial ou quantitativa de רָב e torna mais direta a causação expressa por וַיְהֻמֵּם. A nota conserva a leitura verbal alternativa (“multiplicou”).
