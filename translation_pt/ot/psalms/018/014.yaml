  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: pt
  text: Ele lançou suas flechas e os dispersou; com muitos relâmpagos, os confundiu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele lançou suas flechas e os dispersou; com relâmpagos em abundância, os confundiu.” O hebraico também pode ser entendido como: “multiplicou os relâmpagos”.'
    reason: Alternativa lexical e sintática para רָב, preservando a ambiguidade do hebraico.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: lançou
  rationale: No contexto da imagem do guerreiro divino, שׁלח descreve o disparo das flechas; “lançou” é natural em português e mantém a ideia de fazê-las partir contra o alvo.
- source_word: חִצָּיו
  choice: suas flechas
  rationale: חֵץ significa “flecha”, e o sufixo masculino singular indica que elas pertencem ao guerreiro divino.
- source_word: וַיְפִיצֵם
  choice: e os dispersou
  rationale: O verbo expressa espalhar ou dispersar. O sufixo plural refere-se mais naturalmente aos inimigos pressupostos pelo contexto, sem nomeá-los explicitamente.
- source_word: וּבְרָקִים רָב
  choice: enviou muitos relâmpagos
  rationale: בְּרָקִים é o plural de “relâmpago”. O difícil רָב indica abundância e pode ser entendido verbal ou adverbialmente; a formulação portuguesa comunica naturalmente que Deus lançou relâmpagos em grande número.
- source_word: וַיְהֻמֵּם
  choice: e os deixou em confusão
  rationale: המם descreve causar confusão, pânico ou tumulto, especialmente em combate. A escolha preserva essa força sem afirmar mais do que o hebraico.
theological_decisions:
- issue: Referente dos sufixos plurais em וַיְפִיצֵם e וַיְהֻמֵּם
  choice: Os inimigos de Davi, pressupostos pelo contexto
  alternative: As flechas e os relâmpagos, espalhados em várias direções
  rationale: Na teofania guerreira do salmo, flechas e relâmpagos são os meios pelos quais Deus dispersa e confunde os adversários. A semântica de המם favorece pessoas como objeto.
- issue: Função de רָב
  choice: 'Indicador de grande quantidade: “muitos”'
  alternative: 'Leitura mais explicitamente verbal: “multiplicou os relâmpagos”; ou adverbial: “com relâmpagos em abundância”'
  rationale: A forma é sintaticamente difícil e admite mais de uma análise. O texto principal exprime a abundância em português natural, enquanto a nota conserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético, a imagem do guerreiro divino e os objetos plurais implícitos do hebraico.
