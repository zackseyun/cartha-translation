  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: pt
  text: Tu me deste o escudo da tua salvação, e a tua mão direita me sustentou; a tua humildade[a] me engrandeceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua brandura”. A palavra hebraica pode indicar humildade, mansidão ou brandura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Tu me deste
  rationale: O wayyiqtol de נתן tem sentido passado no relato poético de gratidão. A colocação pronominal é natural e digna em português.
- source_word: מָגֵן יִשְׁעֶךָ
  choice: o escudo da tua salvação
  rationale: Mantém a imagem concreta de מָגֵן e a relação construta com יִשְׁעֶךָ, preservando também o alcance amplo de “salvação”.
- source_word: וִימִינְךָ
  choice: e a tua mão direita
  rationale: Conserva literalmente a imagem bíblica da mão direita como expressão de força e auxílio ativo.
- source_word: תִסְעָדֵנִי
  choice: me sustentou
  rationale: סעד significa apoiar ou sustentar; “me sustentou” é claro, corrente e adequado ao paralelismo poético.
- source_word: וְעַנְוַתְךָ
  choice: a tua humildade
  rationale: O termo pode indicar humildade, mansidão ou brandura. “Humildade” preserva a formulação surpreendente aplicada a Deus, sem eliminar sua tensão teológica.
- source_word: תַרְבֵּנִי
  choice: me engrandeceu
  rationale: O hifil de רבה expressa fazer crescer ou tornar grande. “Me engrandeceu” comunica isso com concisão e dignidade poética.
theological_decisions:
- issue: A qualidade divina expressa por וְעַנְוַתְךָ
  choice: a tua humildade
  alternative: a tua brandura
  rationale: O hebraico admite humildade, mansidão ou brandura. A tradução principal mantém “humildade” para preservar a força e a tensão da imagem de Deus que se abaixa para ajudar, enquanto a nota registra uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” em concordância gramatical consistente. A estrutura paralela e as imagens do hebraico foram preservadas sem recorrer a vocabulário arcaico.
