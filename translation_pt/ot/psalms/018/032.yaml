  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: pt
  text: O Deus que me cinge de força e torna íntegro o meu caminho[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que me equipa com poder”. O hebraico emprega literalmente a imagem de “cingir” alguém com חַיִל, termo que pode significar força, poder ou valentia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “torna perfeito/completo o meu caminho”. O termo hebraico תָּמִים pode indicar inteireza, integridade ou condição irrepreensível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: O Deus
  rationale: Preserva o artigo hebraico e a força descritiva da expressão, que identifica o Deus de Israel no contexto.
- source_word: הַמְאַזְּרֵנִי
  choice: que me cinge
  rationale: Mantém a metáfora concreta de אזר, isto é, prender um cinto e assim equipar ou preparar alguém para agir.
- source_word: חָיִל
  choice: de força
  rationale: חיל pode indicar força, poder ou valentia; aqui, ligado ao ato de cingir, comunica capacitação concedida por Deus.
- source_word: וַיִּתֵּן
  choice: e torna
  rationale: Embora נתן normalmente signifique “dar”, nesta construção expressa o resultado produzido no caminho do salmista; “torna” é natural em português.
- source_word: תָּמִים
  choice: íntegro
  rationale: תמים denota inteireza, integridade ou irrepreensibilidade, sem necessariamente afirmar perfeição absoluta. “Íntegro” se aplica naturalmente ao caminho ou conduta.
- source_word: דַּרְכִּי
  choice: o meu caminho
  rationale: Preserva a metáfora comum de דרך para o curso da vida ou da conduta.
theological_decisions:
- issue: Sentido de תמים aplicado ao caminho do salmista
  choice: íntegro
  alternative: perfeito, completo ou irrepreensível
  rationale: “Íntegro” preserva a ideia de inteireza moral sem resolver o texto como uma afirmação explícita de impecabilidade; a nota mantém as demais possibilidades lexicais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cinge” foi mantido por preservar a imagem poética e marcial do hebraico; as notas esclarecem seu sentido e registram a ambiguidade lexical.
