id: PSA.18.30
reference: Psalms 18:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: pt
  text: Quanto a Deus, seu caminho é íntegro; a palavra de Yahweh é refinada[a]; ele é escudo para todos os que nele se refugiam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provada” ou “purificada”; o hebraico evoca o metal refinado no fogo e enfatiza a pureza comprovada da palavra de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou “confiam nele”; mais literalmente, o hebraico diz “nele se refugiam”, preservando a imagem de Deus como abrigo protetor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Quanto a Deus
  rationale: O artigo e a posição inicial conferem destaque tópico à expressão; “Quanto a Deus” reproduz essa ênfase de modo natural.
- source_word: תָּמִים
  choice: íntegro
  rationale: No contexto do caminho de Deus, indica aquilo que é completo e sem defeito; “íntegro” preserva tanto a ideia de inteireza quanto a retidão.
- source_word: דַּרְכּוֹ
  choice: seu caminho
  rationale: Mantém a imagem hebraica de דרך e abrange a maneira de Deus agir.
- source_word: אִמְרַת יְהוָה
  choice: a palavra de Yahweh
  rationale: אִמְרָה designa palavra ou declaração, e o nome divino é transliterado como “Yahweh”.
- source_word: צְרוּפָה
  choice: refinada
  rationale: Preserva a metáfora metalúrgica de algo submetido ao fogo e comprovado puro.
- source_word: מָגֵן
  choice: escudo
  rationale: Traduz literalmente a imagem de proteção, sem reduzi-la ao conceito abstrato de protetor.
- source_word: הַחֹסִים בּוֹ
  choice: os que nele se refugiam
  rationale: Conserva a imagem concreta de buscar abrigo e proteção em Deus, embora confiança esteja implícita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem poética e as metáforas do hebraico foram preservadas sem rigidez excessiva.
