  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: pt
  text: Os filhos de estrangeiros definham[a] e saem tremendo de suas fortalezas[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de estrangeiro” ou “filhos da condição estrangeira”; também se pode traduzir simplesmente por “estrangeiros”.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “saem tremendo” é raro e de sentido incerto; também pode significar “saem encolhidos de medo” ou “saem mancando”.
    reason: lexical_alternative
  - marker: c
    text: “Fortalezas” também pode ser traduzido por “lugares fortificados” ou, em sentido mais geral, “recintos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: os filhos de estrangeiros
  rationale: Preserva o idioma filial explícito do hebraico e soa mais natural em português do que uma formulação como “filhos estrangeiros”; a nota registra a possibilidade de simplificar para “estrangeiros”.
- source_word: יִבֹּלוּ
  choice: definham
  rationale: O qal de נבל expressa murchar, perder o vigor ou definhar. “Definham” comunica o enfraquecimento gradual sem transferir para este verbo a ideia de tremor do verbo seguinte.
- source_word: וְיַחְרְגוּ
  choice: saem tremendo
  rationale: חרג é raro e seu sentido exato é incerto. No contexto militar, provavelmente descreve inimigos que saem em estado de medo ou agitação; a nota preserva outras possibilidades.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: de suas fortalezas
  rationale: O substantivo indica lugares fechados ou cercados. “Fortalezas” se ajusta ao cenário militar, embora “recintos” seja lexicalmente mais geral.
