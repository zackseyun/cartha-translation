base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: pt
  text: 'Ele treina minhas mãos para a batalha,

    e meus braços podem vergar um arco de bronze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “e um arco de bronze é vergado por meus braços”. A oração hebraica é difícil e pode ser entendida em sentido passivo mais literal.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: treina
  rationale: O particípio de למד pode significar “ensina” ou “instrui”. No contexto militar, “treina” comunica naturalmente o preparo prático para o combate.
- source_word: יָדַי
  choice: minhas mãos
  rationale: Mantém o plural concreto do hebraico e a imagem corporal do preparo para lutar.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מלחמה pode designar guerra ou batalha; aqui, “batalha” combina de modo natural com o treinamento das mãos e preserva o sentido militar.
- source_word: וְנִחֲתָה
  choice: podem vergar
  rationale: A forma verbal e a construção são difíceis. Em contexto, a tradução expressa a capacidade concedida ao salmista, enquanto a nota preserva a possibilidade de uma construção passiva mais formal.
- source_word: קֶשֶׁת
  choice: um arco
  rationale: Tradução comum e direta do nome da arma, conservando o singular.
- source_word: נְחוּשָׁה
  choice: de bronze
  rationale: O termo pode referir-se a cobre ou bronze; “bronze” é a designação tradicional e apropriada para a imagem de uma arma extremamente resistente.
- source_word: זְרוֹעֹתָי
  choice: meus braços
  rationale: Conserva o plural e a imagem física do hebraico, associada ao ato de vergar o arco.
theological_decisions:
- issue: Interpretação da oração difícil וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: 'A oração exprime capacidade concedida: “meus braços podem vergar um arco de bronze”.'
  alternative: “um arco de bronze é vergado por meus braços”
  rationale: A sintaxe hebraica é comprimida e admite traduções diferentes. A opção principal produz português natural e corresponde ao paralelismo sobre o preparo e a força recebidos, sem eliminar a leitura passiva mais formal, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vergar” preserva a imagem de dobrar um arco rígido sem recorrer a formulação excessivamente coloquial. O pronome referente a Deus permanece implícito em “Ele”, conforme o contexto imediato do salmo.
