  text: וָ/אֱהִ֣י תָמִ֣ים עִמּ֑/וֹ וָ֝/אֶשְׁתַּמֵּ֗ר מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: pt
  text: Fui íntegro com ele[a][b] e me guardei da minha iniquidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irrepreensível” ou “de coração inteiro”; aqui, “íntegro” indica inteireza moral, não necessariamente ausência absoluta de pecado.
    reason: lexical_alternative
  - marker: b
    text: O pronome “ele” se refere ao SENHOR no contexto.
    reason: cross_reference
  - marker: c
    text: Ou “da minha culpa” ou “do meu pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Fui
  rationale: O wayyiqtol de היה exprime aqui estado no passado dentro da sequência poética; “fui” é direto e natural em português.
- source_word: תָמִים
  choice: íntegro
  rationale: Em contexto moral, o termo indica inteireza de caráter e conduta irrepreensível, sem exigir a ideia de impecabilidade absoluta.
- source_word: עִמּוֹ
  choice: diante dele
  rationale: Embora עִם signifique literalmente “com”, neste contexto relacional “diante dele” comunica de modo natural a integridade do salmista perante Deus, preservando o pronome hebraico.
- source_word: וָאֶשְׁתַּמֵּר
  choice: me guardei
  rationale: A forma reflexiva de שמר expressa vigilância ou preservação de si; “me guardei” mantém esse valor reflexivo com linguagem clara.
- source_word: מֵעֲוֺנִי
  choice: da minha iniquidade
  rationale: עָוֹן pode designar iniquidade, culpa ou pecado. “Iniquidade” conserva o peso moral, o sufixo de primeira pessoa e a preposição de afastamento.
theological_decisions:
- issue: A integridade declarada pelo salmista e a condição moral humana
  choice: “Íntegro” expressa inteireza e fidelidade moral diante de Deus, sem definir a afirmação como impecabilidade absoluta.
  alternative: Entender תָמִים como declaração de perfeição sem pecado.
  rationale: O hebraico faz uma afirmação moral forte, mas o campo semântico de תָמִים permite integridade ou conduta irrepreensível. A tradução preserva essa tensão sem acrescentar uma conclusão doutrinária.
- issue: O sentido de “minha iniquidade”
  choice: Manter a formulação possessiva e ambígua do hebraico.
  alternative: Explicitar como “o pecado ao qual sou inclinado” ou “a culpa que me cabia”.
  rationale: O texto não esclarece se a expressão aponta para uma transgressão característica, uma inclinação pessoal, culpa ou pecado em sentido geral; explicá-la no corpo do versículo resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A colocação pronominal “me guardei” favorece a fluidez contemporânea. A expressão menos comum “minha iniquidade” foi mantida por corresponder à formulação marcada e ambígua do hebraico.
