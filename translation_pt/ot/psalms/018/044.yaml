base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: pt
  text: 'Assim que me ouvem, obedecem-me;[a]

    os estrangeiros fingem submeter-se a mim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «ao ouvir do ouvido, obedecem-me»; ou: «mal ouvem, obedecem-me».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os estrangeiros submetem-se a mim, acovardados»; mais literalmente, «mentem para mim». A expressão pode indicar submissão relutante ou insincera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Assim que ouvem falar de mim
  rationale: A expressão idiomática, literalmente «ao ouvir do ouvido», indica uma reação imediata ao que se ouve. A formulação natural em português comunica esse valor temporal sem conservar uma construção pouco inteligível.
- source_word: יִשָּׁמְעוּ לִי
  choice: eles me obedecem
  rationale: O verbo שׁמע com ל frequentemente significa dar ouvidos e, por extensão, obedecer. No contexto de vitória régia, trata-se de acatamento, não apenas de percepção auditiva.
- source_word: בְּנֵי נֵכָר
  choice: os estrangeiros
  rationale: A expressão, literalmente «filhos do estrangeiro» ou «filhos de terra estrangeira», é um idiomatismo para pessoas ou povos estrangeiros. «Os estrangeiros» é claro e natural.
- source_word: יְכַחֲשׁוּ לִי
  choice: fingem submeter-se a mim
  rationale: No piel, כחש pode expressar engano, negação ou submissão insincera. Aqui a formulação preserva o contraste com a obediência do primeiro membro e explicita a possível falta de sinceridade sem apagar a ambiguidade lexical, registrada em nota.
