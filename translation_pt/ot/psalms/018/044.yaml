  terminology: «Estrangeiros» é equivalente adequado de בְּנֵי נֵכָר. «Fingem submeter-se a mim» comunica bem a nuance contextual de יְכַחֲשׁוּ לִי, sem alegar uma submissão interiormente sincera.
