base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: pt
  text: Tu me livras das contendas do povo[a]; tu me estabeleces como cabeça das nações[b]; um povo que eu não conheci me serve[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos conflitos do povo” ou “das disputas do povo”. O termo hebraico pode indicar contenda, conflito, disputa ou litígio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como chefe das nações”. “Cabeça” é uma metáfora hebraica de liderança.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “me servirá”. O imperfeito hebraico pode ter sentido futuro neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Tu me livras
  rationale: O piel de פלט expressa ação ativa de livrar ou resgatar. “Livras” é natural, digno e adequado ao paralelismo poético.
- source_word: מֵרִיבֵי עָם
  choice: das contendas do povo
  rationale: רִיב pode indicar contenda, conflito, disputa ou litígio. “Contendas” preserva a amplitude do plural hebraico, e “povo” mantém o substantivo coletivo singular.
- source_word: תְּשִׂימֵנִי
  choice: tu me estabeleces
  rationale: שׂים significa pôr ou colocar; neste contexto de elevação à liderança, “estabeleces” comunica naturalmente a colocação numa posição, sem tornar explícita uma nomeação formal.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: como cabeça das nações
  rationale: A tradução conserva a metáfora de רֹאשׁ, “cabeça”, com sentido de liderança, e verte גּוֹיִם em seu sentido político-coletivo de “nações”.
- source_word: עַם לֹא יָדַעְתִּי
  choice: um povo que eu não conhecia
  rationale: “Um povo” representa o coletivo singular indefinido. O imperfeito português “não conhecia” expressa de modo natural a ausência anterior de relação ou familiaridade indicada por ידע.
- source_word: יַעַבְדוּנִי
  choice: me serve
  rationale: עבד significa “servir”. O imperfeito hebraico pode descrever ação presente ou característica neste contexto poético; a nota preserva a leitura futura possível.
theological_decisions:
- issue: Alcance de גּוֹיִם e עַם num salmo régio
  choice: 'Traduzir em termos político-coletivos: “nações” e “um povo”.'
  alternative: Traduzir גּוֹיִם como “gentios”.
  rationale: O contexto descreve a elevação do rei sobre grupos estrangeiros. “Nações” corresponde ao sentido contextual sem introduzir distinções étnico-teológicas posteriores que o verso não explicita.
- issue: Valor temporal de יַעַבְדוּנִי
  choice: Usar o presente “me serve”.
  alternative: Usar o futuro “me servirá”.
  rationale: O imperfeito hebraico admite valor continuativo, característico ou futuro. O presente se harmoniza com os verbos anteriores e mantém a afirmação poética, enquanto a alternativa futura é registrada em nota.
translation_notes:
  register: Português moderno, de leitura ampla e com cadência poética. O tratamento por “tu” acompanha a oração direta a Deus. A formulação preserva a metáfora “cabeça”, a ambiguidade temporal do último verbo por meio de nota e o caráter coletivo de “povo” e “nações”.
