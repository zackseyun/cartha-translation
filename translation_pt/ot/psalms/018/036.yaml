base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/036.yaml
  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: pt
  text: Alargas os meus passos debaixo de mim[a], e meus tornozelos não cedem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tornas largo o meu passo sob mim”. A expressão hebraica retrata Deus dando espaço e firmeza para que o salmista avance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não vacilam” ou “não escorregam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Alargas
  rationale: O hifil de רחב expressa a ação causativa de tornar largo ou ampliar. O presente poético mantém o aspecto verbal aberto do hebraico e se encaixa no discurso dirigido a Deus.
- source_word: צַעֲדִי
  choice: os meus passos
  rationale: O substantivo singular com sufixo significa literalmente “meu passo”, mas pode ter sentido coletivo. O plural é mais natural em português e preserva a imagem hebraica do caminhar, sem substituí-la por “o chão” ou “o caminho”.
- source_word: תַחְתָּי
  choice: debaixo de mim
  rationale: Reproduz o sentido espacial de “sob/debaixo de mim” e conserva a imagem compacta do hebraico.
- source_word: וְלֹא
  choice: e ... não
  rationale: Mantém a coordenação simples e a negação do texto hebraico, sem explicitar uma relação de finalidade ou consequência.
- source_word: מָעֲדוּ
  choice: não cedem
  rationale: O verbo מעד pode indicar escorregar, vacilar ou perder a firmeza. “Não cedem” combina naturalmente com “tornozelos” e comunica estabilidade, sem restringir o sentido apenas a um escorregão.
- source_word: קַרְסֻלָּי
  choice: meus tornozelos
  rationale: O termo designa especificamente os tornozelos ou ossos dos tornozelos. A tradução específica preserva a imagem corporal vívida do original.
