  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: pt
  text: Ele torna os meus pés como os das corças[a] e me faz ficar de pé nas minhas alturas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os das cervas”. O hebraico emprega a forma feminina plural e evoca movimentos ágeis e passos firmes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e me coloca nas minhas alturas”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: torna
  rationale: O particípio piel de שׁוה exprime aqui a ação de tornar ou fazer semelhante; “torna” introduz naturalmente a comparação em português.
- source_word: רַגְלַי
  choice: os meus pés
  rationale: רֶגֶל significa normalmente “pé”; o plural com sufixo de primeira pessoa é preservado de modo direto.
- source_word: כָּאַיָּלוֹת
  choice: como os das corças
  rationale: אַיָּלוֹת é feminino plural e designa corças. A elipse “os [pés] das corças” comunica claramente a comparação e preserva a referência feminina sem linguagem arcaica.
- source_word: בָּמוֹתַי
  choice: nas minhas alturas
  rationale: A tradução mantém tanto o sentido espacial de lugares elevados quanto o sufixo possessivo de primeira pessoa, sem introduzir uma referência cultual.
- source_word: יַעֲמִידֵנִי
  choice: me faz ficar de pé
  rationale: O hifil de עמד significa causar alguém a ficar de pé ou fazê-lo permanecer. Esta formulação preserva explicitamente o valor causativo, sem acrescentar “seguro”, ideia sugerida pelo quadro, mas não expressa lexicalmente.
theological_decisions:
- issue: Imagem metafórica de agilidade e permanência nas alturas
  choice: Preservar as imagens concretas dos pés das corças e de ficar de pé nas alturas.
  alternative: Explicitar a ideia como agilidade, firmeza ou segurança, possivelmente em contexto militar.
  rationale: Embora o contexto do salmo seja de combate e livramento, o versículo apresenta essas ideias por imagens poéticas. A tradução evita espiritualizá-las ou restringi-las a uma interpretação militar.
- issue: Sentido de “minhas alturas”
  choice: Manter o possessivo e a referência espacial ambígua.
  alternative: Traduzir “lugares altos”, “alturas” sem possessivo ou entender a expressão como posições de vitória/domínio.
  rationale: O hebraico contém o sufixo de primeira pessoa, mas não explica em que sentido as alturas pertencem ao salmista. Preservar a formulação deixa aberta a tensão poética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Corças” preserva a precisão zoológica e o gênero do hebraico; “me faz ficar de pé” mantém o causativo sem inserir a segurança apenas implícita na imagem.
