base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: pt
  text: Trouxe-me para um lugar espaçoso[a]; resgatou-me[b], porque se agradou de mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um lugar amplo” ou “para um espaço aberto”. A imagem hebraica contrasta o aperto com a liberdade e a segurança.
    reason: lexical_alternative
  - marker: b
    text: Ou “livrou-me”.
    reason: lexical_alternative
  - marker: c
    text: Ou “porque teve prazer em mim” ou “porque se deleitou em mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Ele me levou
  rationale: O hifil de יצא tem sentido causativo, “fazer sair” ou “levar para fora”. “Levou” é natural em português e, junto do destino expresso, conserva a imagem de libertação.
- source_word: לַמֶּרְחָב
  choice: para um lugar espaçoso
  rationale: מֶרְחָב denota amplidão ou espaço aberto, em contraste figurado com aperto e perigo. “Lugar espaçoso” mantém a imagem hebraica em português claro.
- source_word: יְחַלְּצֵנִי
  choice: resgatou-me
  rationale: O piel de חלץ pode significar retirar, livrar ou resgatar. “Resgatou-me” comunica de modo atual a libertação e preserva o paralelismo.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão declarada para o resgate e mantém claramente o valor causal.
- source_word: חָפֵץ בִּי
  choice: se agradou de mim
  rationale: חפץ com ב expressa prazer, agrado ou disposição favorável em relação a alguém. “Agradar-se de” é idiomático, digno e não acrescenta uma causa doutrinária não explicitada.
theological_decisions:
- issue: Natureza do favor divino na oração final
  choice: porque se agradou de mim
  alternative: porque teve prazer em mim; porque se deleitou em mim
  rationale: O hebraico apresenta o agrado divino como razão do livramento, mas não explica se esse agrado decorre de mérito, eleição pactual ou graça. A formulação preserva essa abertura teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “resgatou-me” mantém um tom literário moderado apropriado aos Salmos; “lugar espaçoso” conserva a metáfora concreta sem soar obscuro.
