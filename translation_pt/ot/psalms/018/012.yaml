translation:
  language: pt
  text: Do brilho diante dele, suas nuvens passaram — granizo e brasas de fogo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas nuvens densas passaram; granizo e brasas ardentes”. O hebraico é compacto e altamente poético, permitindo pequenas diferenças na maneira de expressar as imagens da tempestade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Do brilho
  rationale: נֹגַהּ designa brilho, claridade ou resplendor. A preposição מִן indica origem; “do brilho” é conciso, natural e adequado à imagem da manifestação divina na tempestade.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: נֶגֶד com sufixo de terceira pessoa masculina singular expressa a posição “diante dele”. A formulação preserva o sentido espacial sem convertê-lo em uma noção abstrata de presença.
- source_word: עָבָיו
  choice: suas nuvens
  rationale: O substantivo pode indicar nuvens densas ou uma massa de nuvens. “Suas nuvens” reproduz diretamente o sufixo e mantém a concisão poética; “suas nuvens densas” também é possível.
- source_word: עָבְרוּ
  choice: avançaram
  rationale: O Qal plural de עבר pode significar passar, atravessar ou seguir adiante. “Avançaram” comunica o movimento das nuvens que procedem do brilho diante dele, sem sugerir necessariamente que desapareceram.
- source_word: בָּרָד
  choice: granizo
  rationale: Equivalente meteorológico direto e inequívoco do termo hebraico.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: e brasas de fogo
  rationale: A construção em estado construto significa literalmente “brasas de fogo”. A expressão conserva a imagem poética intensa e permanece compreensível em português; “brasas ardentes” seria uma alternativa mais idiomática.
theological_decisions:
- issue: Imagens poéticas da manifestação divina na tempestade
  choice: Manter as imagens como descrição da manifestação divina, sem reduzi-las a mera metáfora nem ampliá-las em afirmação doutrinária.
  alternative: Interpretar a linha exclusivamente como figura de vitória militar ou explicá-la como milagre meteorológico estritamente literal.
  rationale: O verso retrata a aparição do SENHOR por meio de imagens de tempestade. A tradução preserva a vivacidade e a tensão do hebraico sem decidir se cada elemento deve ser entendido de modo estritamente literal ou figurado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem poética foi preservada, e o travessão apresenta “granizo e brasas de fogo” como continuação vívida da imagem sem impor uma relação sintática mais precisa do que o hebraico permite.
