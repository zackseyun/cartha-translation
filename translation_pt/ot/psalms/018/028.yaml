  text: 'Pois tu acendes a minha lâmpada[a];

    Yahweh, meu Deus, ilumina a minha escuridão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazes a minha lâmpada brilhar”.'
