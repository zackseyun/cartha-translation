lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da confiança expressa no contexto e mantém a concisão poética.
- source_word: תָּאִיר
  choice: acendes
  rationale: O hifil de אור tem sentido causativo, “dar luz” ou “fazer brilhar”. Com “lâmpada”, “acendes” é natural em português e preserva a imagem concreta.
- source_word: נֵרִי
  choice: a minha lâmpada
  rationale: נֵר designa literalmente uma lâmpada. A tradução conserva a metáfora concreta em vez de reduzi-la ao abstrato “luz”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz diretamente a construção possessiva e o caráter pessoal da declaração.
- source_word: יַגִּיהַּ
  choice: ilumina
  rationale: Expressa o sentido causativo de tornar claro ou fazer resplandecer, mantendo o paralelismo com o primeiro verso sem repetir o mesmo verbo português.
- source_word: חָשְׁכִּי
  choice: as minhas trevas
  rationale: Mantém o substantivo com sufixo de primeira pessoa e preserva a amplitude da metáfora, que pode abranger aflição, perigo ou desalento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. “Acendes a minha lâmpada” soa natural e concreto; “as minhas trevas” conserva a metáfora e sua ambiguidade. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
