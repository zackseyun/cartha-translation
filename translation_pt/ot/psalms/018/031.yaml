base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: pt
  text: Pois quem é Deus além de Yahweh? E quem é uma rocha, senão o nosso Deus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “à parte de Yahweh” na primeira pergunta e “além do nosso Deus” na segunda; as duas expressões hebraicas indicam exclusividade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento retórico do louvor anterior e mantém a ligação discursiva em português natural.
- source_word: מִי
  choice: quem
  rationale: Pronome interrogativo empregado em pergunta retórica; a tradução direta preserva a força do hebraico.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: O singular refere-se ao Deus verdadeiro no contraste exclusivo com Yahweh; a inicial maiúscula identifica o referente sem acrescentar conteúdo.
- source_word: מִבַּלְעֲדֵי
  choice: além de
  rationale: 'Expressa exclusão: não há Deus além de Yahweh. A formulação é clara e idiomática em português.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמִי
  choice: E quem
  rationale: Preserva a conjunção e o paralelismo entre as duas perguntas retóricas.
- source_word: צוּר
  choice: rocha
  rationale: Mantém diretamente a metáfora hebraica de estabilidade, força e proteção.
- source_word: זוּלָתִי
  choice: senão
  rationale: Termo de exclusão paralelo a מִבַּלְעֲדֵי; nesta construção interrogativa, “senão” é natural e preciso.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Preserva o sufixo pronominal e sua dimensão comunitária e pactual; o artigo é idiomático em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Metáfora צוּר aplicada a Deus
  choice: rocha
  alternative: Rocha; refúgio
  rationale: “Rocha” conserva a imagem concreta do hebraico sem interpretá-la apenas como “refúgio”; a minúscula corresponde ao uso predicativo, não necessariamente a um título fixo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a conexão argumentativa; “quem é rocha” conserva o paralelismo compacto e a metáfora do original.
