  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: pt
  text: Na minha aflição, invoco Yahweh e clamo ao meu Deus por socorro. Do seu templo[a], ele ouve a minha voz, e o meu clamor diante dele chega aos seus ouvidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Templo” também pode ser traduzido por “palácio” ou “santuário”; o termo hebraico pode designar a morada de um rei ou de Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Do seu templo, ele ouvirá a minha voz, e o meu clamor diante dele chegará aos seus ouvidos.” Os imperfeitos hebraicos podem ter valor futuro.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Na minha aflição
  rationale: A construção expressa uma situação pessoal de aperto ou angústia; “na minha aflição” é natural, clara e digna em português.
- source_word: אֶקְרָא יְהוָה
  choice: invoco Yahweh
  rationale: Com o nome divino como complemento, קרא indica invocação. “Invoco” comunica isso de forma concisa, evitando a possível leitura de simplesmente chamar alguém.
- source_word: וְאֶל־אֱלֹהַי אֲשַׁוֵּעַ
  choice: e clamo ao meu Deus por socorro
  rationale: שׁוע no Piel designa um clamor por ajuda; explicitar “por socorro” preserva essa força sem perder a naturalidade.
- source_word: יִשְׁמַע
  choice: ele ouve
  rationale: O imperfeito hebraico poético admite valor presente, habitual ou futuro. O presente vívido combina com תָּבוֹא e exprime a certeza da resposta, sem excluir a alternativa futura indicada em nota.
- source_word: מֵהֵיכָלוֹ
  choice: Do seu templo
  rationale: הֵיכָל pode designar templo, palácio ou santuário. Em referência à morada de Deus, “templo” é claro e tradicional, enquanto a amplitude lexical é preservada em nota.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: e o meu clamor diante dele
  rationale: “Clamor” mantém o vínculo com o verbo anterior e לְפָנָיו é preservado como “diante dele”, sem transformar a imagem em uma interpretação abstrata.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: chega aos seus ouvidos
  rationale: A formulação conserva a imagem antropomórfica do hebraico e soa mais idiomática em português do que “entra em seus ouvidos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título; “Jeová” é uma forma tradicional secundária.
- issue: Valor temporal dos imperfeitos יִשְׁמַע e תָּבוֹא
  choice: 'presente vívido: “ouve” e “chega”'
  alternative: 'futuro: “ouvirá” e “chegará”'
  rationale: A poesia hebraica permite ambos os valores. O presente oferece uma afirmação vívida da resposta divina, e a alternativa futura é registrada para não eliminar a ambiguidade real.
- issue: Local de onde Deus ouve
  choice: “templo”, sem definir se terreno ou celestial
  alternative: “palácio” ou “santuário”
  rationale: הֵיכָל é semanticamente amplo. A tradução não especifica que se trate necessariamente do templo terreno, preservando a possível referência à morada celestial de Deus.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O registro é poético e digno, mas acessível. “Invoco” expressa com precisão a oração dirigida a Yahweh; “clamo ... por socorro” torna explícito o pedido de ajuda presente no verbo hebraico. A ordem foi ajustada com moderação para fluidez em português, preservando o paralelismo e as imagens do original.
