base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: pt
  text: Pois, contigo corro contra uma tropa[a]; com o meu Deus salto uma muralha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contigo corro contra um bando de invasores”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com o meu Deus salto uma fortificação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do testemunho de louvor no contexto, com valor causal natural em português.
- source_word: בְךָ
  choice: contigo
  rationale: A preposição ב pode indicar meio, auxílio ou associação. “Contigo” comunica de modo natural que Deus capacita o salmista, sem tornar a formulação excessivamente abstrata.
- source_word: אָרֻץ
  choice: avanço contra
  rationale: O verbo רוץ significa literalmente “correr”; no contexto militar, descreve investir ou avançar contra um grupo inimigo. A escolha conserva o movimento e torna claro o sentido contextual.
- source_word: גְּדוּד
  choice: uma tropa
  rationale: גְּדוּד pode designar tropa, bando ou grupo de incursão. “Tropa” mantém a imagem militar sem pressupor um exército inteiro.
- source_word: וּבֵאלֹהַי
  choice: com o meu Deus
  rationale: Preserva a confissão pessoal “meu Deus” e o paralelismo com a primeira oração; em português, “com” expressa naturalmente o auxílio divino.
- source_word: אֲדַלֶּג
  choice: salto
  rationale: O verbo דלג significa saltar ou transpor com um salto. O presente poético reproduz a forma hebraica e sua imagem vívida sem acrescentar explicitamente “posso”.
- source_word: שׁוּר
  choice: uma muralha
  rationale: שׁוּר designa um muro, especialmente como barreira defensiva. “Muralha” explicita adequadamente o cenário militar e continua acessível ao leitor comum.
theological_decisions:
- issue: Natureza da imagem militar do versículo
  choice: Manter a imagem concreta de avançar contra uma tropa e saltar uma muralha como testemunho do auxílio divino.
  alternative: Generalizar a linguagem para a superação de dificuldades da vida.
  rationale: O hebraico emprega termos militares concretos. A tradução não espiritualiza a cena nem restringe possíveis aplicações posteriores.
- issue: Valor da preposição ב nas duas orações
  choice: Traduzir por “contigo” e “com o meu Deus”, preservando a ideia de auxílio ou capacitação sem definir rigidamente a relação como agência instrumental.
  alternative: “Por ti” e “por meu Deus”, com sentido mais explicitamente instrumental.
  rationale: A preposição hebraica admite nuances de meio, auxílio e associação. A formulação escolhida é idiomática em português e conserva essa abertura sem negar que a capacidade procede de Deus.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética concisa. O presente verbal mantém a vivacidade do hebraico. “Muralha” e “tropa” preservam o cenário militar; as notas registram alternativas lexicais genuínas.
