id: PSA.18.20
reference: Psalms 18:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִגְמְלֵ֣/נִי יְהוָ֣ה כְּ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: pt
  text: Yahweh me tratou conforme a minha justiça[a]; conforme a pureza das minhas mãos[b], ele me retribuiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh me recompensou conforme a minha justiça”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “pureza das minhas mãos” representa conduta inocente ou íntegra.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: me tratou
  rationale: O verbo גמל pode indicar tratar alguém de modo correspondente à sua conduta. “Me tratou” preserva essa amplitude, enquanto o paralelo “me retribuiu” esclarece o sentido positivo de recompensa neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּצִדְקִי
  choice: conforme a minha justiça
  rationale: צדק designa aqui a retidão ou conduta justa do salmista. A formulação conserva a afirmação explícita e a relação de correspondência expressa por כְּ.
- source_word: כְּבֹר
  choice: conforme a pureza
  rationale: בֹּר denota pureza ou limpeza. “Pureza” combina naturalmente com “mãos” em português e mantém a imagem concreta do hebraico.
- source_word: יָדַי
  choice: das minhas mãos
  rationale: Preserva a imagem corporal do idioma hebraico, no qual mãos puras representam conduta inocente ou íntegra.
- source_word: יָשִׁיב לִי
  choice: ele me retribuiu
  rationale: O hifil de שוב, nesta construção, comunica retribuição correspondente. “Retribuiu” preserva o paralelismo sem necessariamente sugerir pagamento comercial.
theological_decisions:
- issue: Possível interpretação de “minha justiça” como perfeição sem pecado ou salvação por mérito
  choice: Manter literalmente “a minha justiça” como afirmação de integridade ou retidão no contexto.
  alternative: minha inocência; minha causa justa
  rationale: O hebraico traz de modo explícito צדק com sufixo de primeira pessoa. A tradução não deve atenuar essa afirmação para eliminar a tensão teológica; o contexto permite entendê-la como integridade relativa à questão tratada, sem transformá-la numa declaração abstrata de impecabilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. Conserva o paralelismo poético, o nome divino Yahweh e a imagem hebraica das mãos puras.
