  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: pt
  text: Eles me confrontaram no dia da minha calamidade[a], mas Yahweh foi o meu amparo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eles vieram sobre mim” ou “Eles vieram ao meu encontro” no dia da minha calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Eles me confrontaram
  rationale: O piel de קדם com sufixo de primeira pessoa singular indica que vieram ao encontro do salmista ou se puseram diante dele. No contexto hostil, “confrontaram” comunica oposição sem especificar além do hebraico que o atacaram.
- source_word: בְיוֹם אֵידִי
  choice: no dia da minha calamidade
  rationale: Preserva a expressão temporal e traduz אֵיד como desastre ou ruína. “Calamidade” mantém o registro poético e não reduz a ideia a sofrimento interior.
- source_word: וַיְהִי
  choice: mas ... foi
  rationale: Embora o waw possa ser vertido por “e”, a segunda oração contrasta o encontro hostil com o sustento recebido de Yahweh; “mas” torna essa relação natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמִשְׁעָן לִי
  choice: o meu amparo
  rationale: מִשְׁעָן designa aquilo em que alguém se apoia. “Amparo” expressa de modo natural a sustentação e a segurança metafóricas, enquanto לִי é representado idiomaticamente pelo possessivo “meu”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” conserva o nome pessoal e não o substitui pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação preserva o paralelismo e o contraste do verso sem tornar a hostilidade mais específica do que o hebraico permite.
