source:
  edition: WLC
  text: יִשְׁלַ֣ח מִ֭/מָּרוֹם יִקָּחֵ֑/נִי יַֽ֝מְשֵׁ֗/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: pt
  text: Do alto, ele estendeu a mão[a] e me tomou; tirou-me de muitas águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “enviou” ou “estendeu”; o objeto, provavelmente “a mão”, está implícito.'
    reason: Esclarece que “a mão” foi suprida para tornar natural em português uma construção cujo complemento não está expresso no hebraico.
lexical_decisions:
- source_word: יִשְׁלַח
  choice: estendeu a mão
  rationale: O verbo significa literalmente “enviar” ou “estender”, mas seu complemento está implícito. No contexto do resgate, “estendeu a mão” expressa em português natural a ação indicada, sem acrescentar a ideia de que Deus desceu.
- source_word: מִמָּרוֹם
  choice: do alto
  rationale: Preserva a imagem de uma posição elevada, possivelmente celestial, sem tornar explícito “do céu”, que não aparece no hebraico.
- source_word: יִקָּחֵנִי
  choice: me tomou
  rationale: Reproduz de modo direto o verbo comum “tomar”, mantendo a ideia de que Deus segura o salmista para resgatá-lo sem intensificá-la para “agarrou” ou “arrebatou”.
- source_word: יַמְשֵׁנִי
  choice: tirou-me
  rationale: Neste contexto, o verbo no Hifil descreve tirar alguém da água. A formulação é clara e natural, além de conservar a possível ressonância com Êxodo 2:10.
- source_word: מִמַּיִם רַבִּים
  choice: de muitas águas
  rationale: Segue de perto a expressão hebraica e preserva a imagem poética de águas numerosas como perigo avassalador, sem substituí-la por uma interpretação como “águas profundas”.
theological_decisions:
- issue: Se a origem da intervenção divina deve ser identificada explicitamente como o céu
  choice: do alto
  alternative: do céu
  rationale: O hebraico menciona “o alto” ou “a altura”, não nomeia explicitamente o céu. A tradução mantém a transcendência sugerida sem tornar a afirmação mais específica.
- issue: Se “muitas águas” deve ser explicado no texto como uma metáfora de perigos
  choice: manter a imagem poética sem explicá-la no corpo do versículo
  alternative: tirou-me de perigos avassaladores
  rationale: A imagem é inteligível e sua abertura poética deve ser preservada, sem resolver no texto se ela representa inimigos, morte, caos ou perigos em sentido mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e leve elevação poética. “Do alto” conserva a concisão do original; “muitas águas” mantém sua imagem concreta e sua ambiguidade metafórica.
