base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: pt
  text: Ele me livrou do meu inimigo poderoso[a] e dos que me odeiam[b], pois eram mais fortes do que eu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ele me livra”, caso o imperfeito poético seja entendido com valor semelhante ao presente.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “meu inimigo” está no singular; a expressão seguinte, “os que me odeiam”, está no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Ele me livrou
  rationale: O hifil de נצל significa “livrar, resgatar”. Embora o imperfeito poético possa, em certos contextos, ter valor semelhante ao presente, o contexto narra uma intervenção divina passada.
- source_word: מֵאֹיְבִי
  choice: do meu forte inimigo
  rationale: O substantivo está no singular com sufixo de primeira pessoa; mantém-se o singular em português, ligado ao adjetivo עָז.
- source_word: עָז
  choice: forte
  rationale: Equivalente direto e natural do adjetivo hebraico “forte, poderoso” ao qualificar o inimigo.
- source_word: וּמִשֹּׂנְאַי
  choice: e dos que me odiavam
  rationale: O particípio plural de שׂנא com sufixo de primeira pessoa é expresso naturalmente por uma oração relativa, preservando o plural e a hostilidade contínua.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do livramento de forma concisa e adequada ao registro poético.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: eram mais fortes do que eu
  rationale: A construção com מן indica comparação ou superioridade; esta formulação reproduz explicitamente o fato de os adversários excederem a força do salmista.
theological_decisions:
- issue: Aspecto temporal do verbo inicial na poesia hebraica
  choice: 'Passado narrativo: “Ele me livrou”'
  alternative: 'Valor presente ou habitual: “Ele me livra”'
  rationale: A seção do salmo relata atos passados de intervenção divina. O passado preserva esse fluxo narrativo, enquanto a nota registra a ambiguidade aspectual genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre o inimigo singular e os odiadores no plural, bem como a comparação explícita de forças.
