  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: pt
  text: Então os canais das águas tornaram-se visíveis[a], e os fundamentos do mundo ficaram expostos, à tua repreensão, ó Yahweh[b], ao sopro do vento das tuas narinas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os leitos dos rios” ou “os cursos de água”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os fundamentos da terra”.
    reason: lexical_alternative
  - marker: c
    text: Hebraico, literalmente, “do alento do sopro/vento das tuas narinas”; a expressão apresenta de forma antropomórfica a força do sopro de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: apareceram
  rationale: O nifal de ראה indica que os leitos se tornaram visíveis. “Apareceram” preserva a súbita revelação da cena e soa mais natural em português do que uma passiva literal.
- source_word: אֲפִיקֵי מַיִם
  choice: os leitos das águas
  rationale: אֲפִיקִים pode designar canais, leitos ou cursos de água. “Leitos das águas” comunica a topografia submersa que se torna visível sem transformar מַיִם, “águas”, em “mar”.
- source_word: וַיִּגָּלוּ
  choice: ficaram expostos
  rationale: O nifal de גלה expressa descobrimento ou exposição. “Ficaram expostos” transmite com naturalidade a força da imagem cósmica.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: os fundamentos do mundo
  rationale: מוֹסְדוֹת são fundamentos ou bases, e תֵּבֵל designa o mundo ou a terra ordenada e habitável. “Mundo” mantém a amplitude poética do termo.
- source_word: מִגַּעֲרָתְךָ
  choice: à tua repreensão
  rationale: A preposição מִן pode indicar origem ou causa. A construção “à tua repreensão” expressa que a repreensão divina ocasionou a exposição descrita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio, em vez de ser substituído por um título. A partícula “ó” explicita o vocativo em português.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: ao sopro do alento das tuas narinas
  rationale: A formulação retém נְשָׁמָה, “alento/sopro”, רוּחַ, “vento/sopro/espírito”, e a imagem corporal de אַף, “nariz/narinas”. A combinação deliberadamente intensa preserva a imagem poética sem reduzi-la apenas a “ira”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico emprega diretamente o tetragrama como nome próprio. “Yahweh” conserva essa função e evita substituí-lo por um título; “Javé” é uma forma aportuguesada possível.
- issue: Antropomorfismo em אַפֶּךָ
  choice: tuas narinas
  alternative: tua ira
  rationale: Embora אַף também possa significar “ira”, a associação com alento e sopro cria uma imagem corporal vívida. Mantê-la preserva a tensão poética e não converte a figura em uma abstração teológica.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. “Leitos das águas” e “ficaram expostos” favorecem a legibilidade brasileira sem perder a imagem hebraica; “tuas” mantém o discurso direto e elevado sem arcaísmo excessivo.
