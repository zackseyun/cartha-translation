  text: וַ/יִּרְכַּ֣ב עַל כְּ֭רוּב וַ/יָּעֹ֑ף וַ֝/יֵּ֗דֶא עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: pt
  text: Montou num querubim e voou; avançou veloz[a] sobre as asas do vento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disparou” ou “mergulhou”. O verbo hebraico é raro e parece descrever movimento rápido pelo ar; alguns também o relacionam à ideia de aparecer ou ser visto.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode significar “sopro” ou “espírito”; neste contexto de tempestade, “vento” é o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: montou
  rationale: O verbo רכב descreve montar ou cavalgar. “Montou num querubim” é natural em português e conserva a imagem concreta do querubim como montaria.
- source_word: עַל כְּרוּב
  choice: num querubim
  rationale: A preposição עַל indica aqui posição ou apoio. A contração “num” expressa de modo idiomático que ele montou sobre um querubim.
- source_word: וַיָּעֹף
  choice: voou
  rationale: Tradução direta de עוף, preservando o movimento aéreo da poesia.
- source_word: וַיֵּדֶא
  choice: avançou veloz
  rationale: O verbo raro parece indicar movimento rápido pelo ar, em paralelo com “voou”. A expressão comunica velocidade sem definir excessivamente se o movimento foi um mergulho ou uma arrancada.
- source_word: כַּנְפֵי
  choice: asas de
  rationale: Mantém literalmente a figura poética formada pelo plural construto de כָּנָף.
- source_word: רוּחַ
  choice: vento
  rationale: Embora רוּחַ também possa significar “sopro” ou “espírito”, “vento” se ajusta melhor à teofania em meio à tempestade e à imagem das asas.
theological_decisions:
- issue: Natureza da imagem do querubim
  choice: Conservar a imagem concreta de Deus montando num querubim.
  alternative: Explicar o querubim como metáfora de nuvens de tempestade ou de um exército angelical.
  rationale: O hebraico apresenta a imagem poética sem explicá-la. Mantê-la evita impor ao texto uma cosmologia ou interpretação específica.
- issue: Sentido de רוּחַ na frase final
  choice: Traduzir como “vento” no texto principal.
  alternative: “espírito” ou “sopro”.
  rationale: O contexto imediato descreve uma manifestação divina em meio à tempestade, favorecendo “vento”, enquanto a nota preserva a amplitude semântica do termo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o paralelismo e a vivacidade da poesia hebraica sem arcaísmos nem explicações inseridas no verso.
