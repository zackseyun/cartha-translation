  yaml_path: translation/ot/psalms/018/039.yaml
  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: pt
  text: Tu me equipaste com força para a batalha[a]; fizeste que os que se levantaram contra mim se curvassem debaixo de mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “cingiste-me de força para a batalha”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais formalmente: “fizeste curvar, debaixo de mim, os que se levantaram contra mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: tu me equipaste
  rationale: O verbo אזר evoca cingir alguém e, por extensão, prepará-lo ou equipá-lo. “Equipaste” comunica com clareza a preparação recebida, enquanto a nota preserva a imagem concreta do hebraico.
- source_word: חַיִל
  choice: força
  rationale: Neste contexto militar, חַיִל indica força ou capacidade para o combate, não necessariamente um exército nem apenas valor moral.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: A expressão aponta para a finalidade da força concedida. “Batalha” é natural no contexto imediato de combate e mais específico que “guerra”.
- source_word: תַּכְרִיעַ
  choice: fizeste ... curvarem-se
  rationale: O hifil de כרע expressa fazer dobrar, curvar ou cair. A formulação conserva a imagem corporal de derrota e submissão sem reduzi-la apenas ao conceito abstrato de subjugação.
- source_word: קָמַי
  choice: os que se levantaram contra mim
  rationale: Preserva a forma participial e a imagem dinâmica de adversários que se erguem hostilmente contra o salmista.
- source_word: תַּחְתָּי
  choice: debaixo de mim
  rationale: Mantém a metáfora espacial de inimigos vencidos e postos sob o domínio do salmista.
