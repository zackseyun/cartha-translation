id: PSA.18.48
reference: Psalms 18:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: pt
  text: tu que me livras dos meus inimigos[a]; sim, tu me elevas acima dos que se levantam contra mim[b]; tu me resgatas do homem violento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «meu libertador dos meus inimigos». No hebraico, a expressão inicial é um particípio usado como designação de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou «tu me exaltas acima dos que se levantam contra mim».
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «de um homem de violência».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: tu que me livras
  rationale: O particípio com sufixo de primeira pessoa caracteriza Deus como aquele que habitualmente livra o salmista. A construção vocativa «tu que me livras» preserva essa força e se liga naturalmente aos verbos na segunda pessoa.
- source_word: מֵאֹיְבַי
  choice: dos meus inimigos
  rationale: Expressa diretamente a origem ou esfera da qual o salmista é libertado.
- source_word: אַף
  choice: sim
  rationale: Marca reforço e progressão enfática para a oração seguinte, mais do que simples adição.
- source_word: מִן קָמַי
  choice: acima dos que se levantam contra mim
  rationale: 'O particípio plural de קום descreve adversários que se insurgem contra o salmista; com o verbo de elevação, מן assume naturalmente valor comparativo: «acima de».'
- source_word: תְּרוֹמְמֵנִי
  choice: tu me elevas
  rationale: Preserva a imagem vertical e o sentido causativo de fazer o salmista ficar em posição elevada ou segura.
- source_word: מֵאִישׁ חָמָס
  choice: do homem violento
  rationale: Mantém o singular masculino de אִישׁ e traduz חָמָס de forma idiomática como caracterização do opressor.
- source_word: תַּצִּילֵנִי
  choice: tu me resgatas
  rationale: Comunica libertação de perigo e mantém alguma distinção lexical em relação ao primeiro verbo, traduzido por «livras».
theological_decisions:
- issue: Função e referente do particípio inicial
  choice: 'Entendê-lo como descrição vocativa de Deus: «tu que me livras».'
  alternative: 'Ligá-lo ao versículo anterior como oração relativa ou vertê-lo como título nominal: «meu libertador».'
  rationale: A passagem natural do particípio substantivado para verbos na segunda pessoa sustenta a leitura como discurso dirigido diretamente a Deus, sem eliminar a força descritiva do particípio.
- issue: Representação do gênero de אִישׁ
  choice: homem
  alternative: pessoa
  rationale: O hebraico emprega um substantivo singular masculino para o opressor; «homem violento» conserva essa especificidade sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com forma de tratamento «tu» apropriada ao discurso poético dirigido a Deus. A tradução conserva o paralelismo, a progressão enfática e a metáfora vertical do hebraico.
