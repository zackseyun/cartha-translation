  text: וַ/יֵּ֣ט שָׁ֭מַיִם וַ/יֵּרַ֑ד וַ֝/עֲרָפֶ֗ל תַּ֣חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: pt
  text: Ele curvou os céus e desceu; escuridão espessa[a] estava debaixo dos seus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nuvem escura” ou “escuridão densa”.
    reason: Alternativas lexicais possíveis para עֲרָפֶל, cujo campo semântico pode abranger escuridão profunda e uma massa de nuvens escuras.
lexical_decisions:
- source_word: וַיֵּט
  choice: curvou
  rationale: O verbo נטה pode significar estender, inclinar ou curvar. Neste contexto teofânico, “curvou” preserva a imagem vívida de Deus fazendo os céus se dobrarem para a sua descida.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural português mantém o alcance cósmico e o registro poético do hebraico שָׁמַיִם.
- source_word: וַיֵּרַד
  choice: desceu
  rationale: Tradução direta e natural de ירד, preservando o movimento do alto para baixo sem acrescentar interpretação.
- source_word: וַעֲרָפֶל
  choice: escuridão espessa
  rationale: עֲרָפֶל descreve escuridão profunda ou densa, por vezes associada a uma nuvem escura em manifestações divinas. “Escuridão espessa” mantém a densidade e evita especificar indevidamente que se trata de uma nuvem.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Equivalente espacial claro e corrente para תַּחַת neste contexto.
- source_word: רַגְלָיו
  choice: seus pés
  rationale: Mantém o sentido concreto e plural do hebraico, sem substituir a imagem por uma interpretação como “passos” ou “escabelo”.
theological_decisions:
- issue: Imagem teofânica antropomórfica
  choice: Manter a imagem concreta de Deus curvando os céus, descendo e tendo escuridão debaixo dos pés.
  alternative: Atenuar a linguagem com uma paráfrase abstrata sobre a intervenção divina.
  rationale: A poesia apresenta deliberadamente Deus em linguagem antropomórfica. A tradução preserva essa tensão e não reduz a cena a uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com dicção poética. “Curvou os céus” conserva a força visual do original; “escuridão espessa” é compreensível e mantém a ambiguidade atmosférica do termo hebraico.
