source:
  edition: WLC
  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: pt
  text: o Deus que me concede vingança[a] e submete[b] povos debaixo de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atos de vingança”; o hebraico emprega uma forma plural com sentido abstrato ou intensivo.
    reason: lexical_alternative
  - marker: b
    text: Aqui, o verbo é tradicionalmente entendido como “submete” ou “põe em sujeição”, e não “fala”, apesar de sua relação com o verbo hebraico comum que significa “falar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: o Deus
  rationale: O artigo definido hebraico foi preservado, e a expressão continua poeticamente a descrição de Deus no contexto.
- source_word: הַנּוֹתֵן
  choice: que me concede
  rationale: O particípio caracteriza Deus por sua ação contínua; “concede” expressa com naturalidade a ideia de dar ao beneficiário indicada também por לִי.
- source_word: נְקָמוֹת
  choice: vingança
  rationale: O plural hebraico tem valor abstrato ou intensivo; o singular coletivo é mais natural em português sem enfraquecer o sentido de retribuição.
- source_word: לִי
  choice: me
  rationale: O pronome oblíquo apresenta o salmista como destinatário ou beneficiário da ação, de modo conciso e idiomático.
- source_word: וַיַּדְבֵּר
  choice: submete
  rationale: Neste contexto de vitória régia, a forma verbal tem o sentido reconhecido de sujeitar ou pôr sob domínio, não o sentido comum de “falar”. O presente acompanha a descrição de Deus como aquele que age em favor do salmista.
- source_word: עַמִּים
  choice: povos
  rationale: Preserva a pluralidade étnica e política do substantivo hebraico sem restringi-lo a Estados nacionais.
- source_word: תַּחְתָּי
  choice: debaixo de mim
  rationale: Mantém a metáfora espacial hebraica de domínio e sujeição, cujo sentido político é esclarecido pelo verbo “submete”.
theological_decisions:
- issue: Linguagem de vingança divina
  choice: Manter “vingança” como referência à retribuição executada por Deus em favor do salmista.
  alternative: Usar “livramento” ou “vindicação”.
  rationale: נְקָמוֹת designa diretamente vingança ou atos de vingança. Termos mais brandos reduziriam a força lexical e resolveriam interpretativamente uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva-se a metáfora “debaixo de mim” e a forte linguagem de “vingança”, enquanto as notas registram as principais questões lexicais.
