base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: pt
  text: Yahweh trovejou nos céus, e o Altíssimo fez ouvir a sua voz[a] — pedras de granizo e brasas de fogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “deu a sua voz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “granizo e brasas de fogo”. O hebraico não apresenta aqui um verbo explícito para esses elementos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: trovejou
  rationale: No contexto desta teofania em meio à tempestade, רעם indica o som do trovão; “trovejou” é natural em português e mantém o paralelismo com a voz divina.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: O plural “céus” preserva a forma e o registro poético do hebraico, sem reduzir a imagem apenas ao céu atmosférico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה em vez de substituí-lo por um título.
- source_word: וְעֶלְיוֹן
  choice: o Altíssimo
  rationale: É o título divino consagrado e semanticamente preciso em português para עֶלְיוֹן.
- source_word: יִתֵּן קֹלוֹ
  choice: fez ouvir a sua voz
  rationale: Expressa em português natural o idiomatismo hebraico literalmente traduzido por “deu a sua voz”, preservando a imagem da manifestação sonora divina.
- source_word: בָּרָד
  choice: pedras de granizo
  rationale: O singular coletivo hebraico designa o granizo; a forma concreta “pedras de granizo” combina com a vívida imagem da tempestade.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: e brasas de fogo
  rationale: Mantém de perto a imagem poética hebraica sem decidir se ela descreve relâmpagos, fogo literal ou juízo figurado.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação de “pedras de granizo e brasas de fogo” com a oração anterior
  choice: Sequência elíptica introduzida por travessão, sem acrescentar verbo
  alternative: Suprir “enviou”, “lançou” ou “houve”
  rationale: O hebraico não contém verbo finito para esses elementos neste ponto. O travessão conserva a abrupta sequência poética e evita inserir uma relação sintática não explicitada.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. “Trovejou” e “nos céus” preservam a linguagem elevada sem arcaísmo; “fez ouvir a sua voz” comunica naturalmente o idiomatismo hebraico, cuja forma literal é registrada em nota.
