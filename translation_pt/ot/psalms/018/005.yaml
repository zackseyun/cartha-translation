  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: pt
  text: As cordas do Sheol[a] me cercaram; as armadilhas da morte vieram ao meu encontro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o mundo dos mortos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “me confrontaram” ou “surgiram diante de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: as cordas de
  rationale: Mantém a imagem poética de cordas que prendem ou envolvem, sem reinterpretar o termo como dores de parto.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva a amplitude do conceito hebraico e evita reduzi-lo a uma doutrina específica sobre o além.
- source_word: סְבָבוּנִי
  choice: me cercaram
  rationale: Expressa de modo natural e direto a ideia de rodear ou envolver.
- source_word: קִדְּמוּנִי
  choice: vieram ao meu encontro
  rationale: Preserva o sentido básico de vir diante de alguém ou encontrá-lo, enquanto o contexto comunica a ameaça sem explicitá-la além do hebraico.
- source_word: מוֹקְשֵׁי
  choice: as armadilhas da
  rationale: Termo atual e claro para laços ou dispositivos destinados a capturar; mantém a imagem ameaçadora.
- source_word: מָוֶת
  choice: morte
  rationale: Equivalente direto que conserva a força poética da morte como ameaça.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: Mantém o termo hebraico, sua amplitude semântica e a distinção poética entre Sheol e morte, sem impor um modelo doutrinário posterior.
- issue: Força contextual de קִדְּמוּנִי
  choice: vieram ao meu encontro
  alternative: me confrontaram; surgiram diante de mim
  rationale: A opção escolhida preserva a ambiguidade do verbo entre encontrar e vir diante, deixando que o caráter hostil seja indicado pelas armadilhas da morte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com paralelismo poético preservado. “Sheol” é mantido como termo transliterado e explicado em nota; “vieram ao meu encontro” evita intensificar indevidamente o verbo hebraico.
