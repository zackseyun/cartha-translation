  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: pt
  text: Assim, Yahweh me retribuiu conforme a minha justiça, conforme a pureza das minhas mãos diante dos seus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “pureza das minhas mãos” é uma imagem hebraica para uma conduta inocente ou íntegra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: retribuiu
  rationale: O hifil de שוב com לִי expressa aqui dar de volta ou recompensar segundo a conduta. “Retribuiu” preserva a ideia de correspondência sem limitar o sentido a uma recompensa positiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי
  choice: me
  rationale: Com “retribuiu”, o pronome átono é a formulação natural em português e transmite adequadamente o beneficiário da ação.
- source_word: כְצִדְקִי
  choice: conforme a minha justiça
  rationale: כְּ indica correspondência ou medida, e צֶדֶק descreve aqui a retidão do salmista. “Justiça” mantém a terminologia teológica tradicional e a afirmação direta do hebraico.
- source_word: כְּבֹר יָדַי
  choice: conforme a pureza das minhas mãos
  rationale: בֹּר denota pureza ou limpeza. “Pureza das minhas mãos” conserva a imagem concreta hebraica de conduta inocente ou íntegra.
- source_word: לְנֶגֶד עֵינָיו
  choice: diante dos seus olhos
  rationale: Mantém tanto o sentido espacial e avaliativo de לְנֶגֶד quanto a imagem antropomórfica explícita de “seus olhos”.
theological_decisions:
- issue: Se a afirmação do salmista sobre sua própria justiça deve ser suavizada
  choice: Manter a declaração direta de retribuição conforme “a minha justiça” e “a pureza das minhas mãos”
  alternative: Parafrasear como fidelidade à aliança, inocência relativa ou boa conduta
  rationale: O hebraico atribui explicitamente a retribuição divina à justiça e à pureza das mãos do salmista. A tradução preserva essa tensão teológica sem reinterpretá-la ou atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim” torna natural a conexão narrativa do wayyiqtol; “retribuiu” conserva a amplitude do verbo hebraico. A imagem das mãos e a referência aos olhos de Yahweh foram mantidas.
