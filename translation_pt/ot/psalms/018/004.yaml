  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: pt
  text: 'Cordas da morte me cercaram,

    e torrentes de destruição[a] me aterrorizaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa beliyya‘al, termo que pode indicar ruína, perversidade ou inutilidade. Também poderia ser lido como o nome próprio “Belial”, mas isso é menos provável neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: me cercaram
  rationale: O verbo אפף indica cercar ou envolver. “Me cercaram” é natural em português e preserva a imagem de perigos que rodeiam o salmista.
- source_word: חֶבְלֵי
  choice: cordas
  rationale: חבל designa literalmente cordas ou laços e, em poesia, pode também sugerir dores ou angústias. “Cordas” mantém a imagem concreta do texto hebraico sem eliminar suas possíveis associações.
- source_word: מָוֶת
  choice: morte
  rationale: Equivalente direto e adequado ao contexto.
- source_word: נַחֲלֵי
  choice: torrentes
  rationale: נחל pode designar um riacho, vale de corrente sazonal ou, poeticamente, uma torrente impetuosa. “Torrentes” comunica com clareza a força ameaçadora da imagem.
- source_word: בְלִיַּעַל
  choice: destruição
  rationale: Neste contexto, בְלִיַּעַל funciona mais provavelmente como substantivo comum associado à ruína, perversidade ou inutilidade, não como nome próprio. “Destruição” expressa naturalmente o efeito ameaçador das torrentes, enquanto a nota preserva a amplitude e a ambiguidade do termo.
- source_word: יְבַעֲתוּנִי
  choice: me aterrorizaram
  rationale: O verbo בעת expressa pavor ou terror súbito. “Me aterrorizaram” conserva a intensidade da forma hebraica e soa natural em português.
theological_decisions:
- issue: Se בְלִיַּעַל deve ser entendido como nome próprio (“Belial”) ou como substantivo comum
  choice: Substantivo comum traduzido por “destruição”
  alternative: “ruína”, “perversidade”, “inutilidade” ou “Belial”
  rationale: O contexto poético descreve forças ameaçadoras e não exige a personificação posterior de Belial. A tradução evita introduzir essa identificação teológica, mas registra a alternativa em nota.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Cordas” e “torrentes” mantêm as duas imagens concretas do hebraico; a quebra de linha realça o paralelismo.
