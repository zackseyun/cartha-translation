base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: pt
  text: Pois tu salvas um povo aflito[a], mas rebaixas os olhos altivos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «povo pobre» ou «povo humilde». O termo hebraico pode indicar pobreza, aflição ou condição humilde.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «olhos elevados», expressão hebraica que indica orgulho ou arrogância.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do que precede, preservando a força causal e o fluxo poético.
- source_word: אַתָּה
  choice: tu
  rationale: Pronome masculino singular dirigido a Deus; «tu» mantém o tratamento direto e solene, natural no registro poético bíblico.
- source_word: עַם
  choice: povo
  rationale: O substantivo coletivo singular designa um grupo de pessoas, sem exigir o sentido político de «nação».
- source_word: עָנִי
  choice: aflito
  rationale: O termo pode indicar pobreza, aflição ou condição humilde. «Aflito» se ajusta ao contexto de livramento sem restringir o sentido à pobreza econômica.
- source_word: תוֹשִׁיעַ
  choice: salvas
  rationale: O hifil de ישׁע significa salvar ou livrar; «salvas» é claro, conciso e conserva a amplitude da ação divina.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção seja formalmente aditiva, o paralelismo estabelece contraste entre salvar os aflitos e rebaixar os altivos.
- source_word: עֵינַיִם רָמוֹת
  choice: olhos altivos
  rationale: Mantém a imagem hebraica de olhos elevados como expressão de orgulho, usando uma formulação compreensível em português.
- source_word: תַּשְׁפִּיל
  choice: rebaixas
  rationale: O hifil de שׁפל significa fazer baixar ou humilhar. «Rebaixas» conserva a imagem espacial e a oposição aos olhos elevados.
theological_decisions:
- issue: Sentido de עָנִי neste versículo
  choice: povo aflito
  alternative: povo pobre; povo humilde
  rationale: A tradução preserva o tema do socorro divino em meio à angústia sem reduzir o termo à situação econômica nem transformá-lo apenas em qualidade moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O paralelismo antitético foi preservado; «tu» sustenta o tom poético de fala direta a Deus, e «olhos altivos» conserva a imagem do original.
