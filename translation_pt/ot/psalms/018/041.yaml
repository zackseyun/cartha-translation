  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: pt
  text: Clamaram por socorro, mas não houve salvador; clamaram ao SENHOR, mas ele não lhes respondeu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: Clamaram por socorro
  rationale: Expressa o clamor urgente por auxílio ou libertação indicado pelo verbo, em português natural e digno.
- source_word: מוֹשִׁיעַ
  choice: salvador
  rationale: Preserva o particípio substantivado hebraico e a formulação teologicamente significativa, sem reduzi-lo a uma paráfrase como “ninguém que os salvasse”.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção bíblica portuguesa de representar o nome divino por SENHOR em versaletes.
- source_word: עָנָם
  choice: lhes respondeu
  rationale: Reproduz diretamente o verbo “responder” e explicita de modo natural em português o objeto pronominal plural.
theological_decisions:
- issue: Sentido de מוֹשִׁיעַ
  choice: salvador
  alternative: quem os salvasse / alguém para salvar
  rationale: “Salvador” mantém a forma nominal do hebraico e sua tensão no contexto, sem impor que o termo seja apenas uma descrição funcional.
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma tradicional facilita a leitura pública e mantém reconhecível a distinção do nome divino por meio das versaletes.
- issue: Sujeito de “não respondeu”
  choice: ele
  alternative: o SENHOR
  rationale: O pronome retoma naturalmente o SENHOR e preserva a estrutura concisa do hebraico sem acrescentar conteúdo.
translation_notes:
  register: 'Português moderno, claro e solene, com paralelismo preservado pela repetição de “clamaram”. A pontuação mantém as duas etapas do verso: ausência de salvador e ausência de resposta divina.'
