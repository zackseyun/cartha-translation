  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: pt
  text: Ele concede grandes vitórias[c] ao seu rei e demonstra amor leal ao seu ungido[a], a Davi e à sua descendência[b], para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seu ungido” também pode ser traduzido por “seu Messias”. Aqui, a expressão se refere de modo imediato a Davi, ou ao rei davídico, mas também possui ressonância messiânica mais ampla.
    reason: alternative_reading
  - marker: b
    text: “Descendência” traduz um substantivo coletivo singular, que pode se referir à linhagem de Davi como um todo e, no contexto canônico, também permite uma leitura messiânica.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Ele é uma torre de livramentos para o seu rei”. A forma hebraica no início do versículo é textual e sintaticamente difícil; 2 Samuel 22:51 traz uma leitura estreitamente relacionada: “Ele engrandece os livramentos do seu rei”.'
    reason: textual_variant
lexical_decisions:
- source_word: מגדל
  choice: concede grandes
  rationale: A forma hebraica é textual e sintaticamente difícil. À luz do paralelo de 2 Samuel 22:51, a tradução comunica de modo natural que Deus engrandece ou concede grandes atos de livramento ao rei, sem impor no texto principal a imagem problemática de uma torre.
- source_word: יְשׁוּעוֹת
  choice: vitórias
  rationale: O plural pode indicar atos de salvação ou livramento. No contexto régio e militar, “vitórias” expressa naturalmente esses livramentos concedidos por Deus.
- source_word: מַלְכּוֹ
  choice: ao seu rei
  rationale: Mantém a relação possessiva e pactual expressa pelo hebraico.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: e demonstra amor leal
  rationale: “Amor leal” é claro em português atual e preserva o peso relacional e pactual de חֶסֶד melhor do que o termo mais genérico “bondade”.
- source_word: לִמְשִׁיחוֹ
  choice: ao seu ungido
  rationale: O referente imediato é Davi, apresentado como rei ungido. “Ungido” conserva o sentido contextual, enquanto a possível tradução titular “Messias” é registrada em nota.
- source_word: לְדָוִד
  choice: a Davi
  rationale: Transliteração corrente do nome próprio em português.
- source_word: וּלְזַרְעוֹ
  choice: e à sua descendência
  rationale: “Descendência” funciona em português como coletivo singular e evita restringir o termo apenas a vários descendentes ou apenas a um descendente individual.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente idiomático, conciso e natural para uma duração permanente.
theological_decisions:
- issue: Ressonância messiânica de מְשִׁיחוֹ em um salmo régio davídico
  choice: Traduzir por “seu ungido” no texto principal e registrar “seu Messias” em nota.
  alternative: seu Messias
  rationale: Davi é o referente histórico imediato, mas o termo também possui ressonância messiânica. A opção mantém ambas as dimensões sem transformar a leitura canônica mais ampla no único sentido explícito do verso.
- issue: Alcance de זַרְעוֹ
  choice: Manter o coletivo singular “descendência”.
  alternative: seus descendentes; sua semente
  rationale: O hebraico pode abranger a linhagem davídica como um todo e, no contexto canônico, também admitir uma leitura messiânica. “Descendência” preserva essa abertura sem especificação indevida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Demonstra amor leal” preserva o valor pactual sem soar arcaico; “descendência” mantém o coletivo singular de forma natural. A ordem das notas acompanha os termos a que se referem no texto.
