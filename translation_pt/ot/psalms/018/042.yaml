  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
translation:
  language: pt
  text: Eu os triturei como pó diante do vento[a]; como lama nas ruas, eu os derramei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre a face do vento”; a expressão retrata o pó levado ou espalhado pelo vento.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu os esvaziei”. O verbo hebraico pode significar tanto derramar como esvaziar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Eu os triturei
  rationale: O verbo שׁחק no qal, com sufixo de terceira pessoa masculina plural, expressa triturar ou reduzir a partículas. “Triturei” preserva a imagem de pulverização sem acrescentar uma interpretação.
- source_word: כְּעָפָר
  choice: como pó
  rationale: עָפָר pode designar pó ou terra solta. “Pó” combina naturalmente com o verbo “triturar” e mantém a comparação hebraica.
- source_word: עַל־פְּנֵי רוּחַ
  choice: diante do vento
  rationale: A expressão significa literalmente “sobre a face do vento”. “Diante do vento” conserva algo da forma poética hebraica e comunica a imagem do pó exposto ao vento, sem explicitar no corpo do texto que ele é espalhado.
- source_word: כְּטִיט חוּצוֹת
  choice: como lama nas ruas
  rationale: טִיט significa lama ou lodo, e חוּצוֹת, ruas ou espaços públicos. A formulação é clara e mantém a imagem de humilhação.
- source_word: אֲרִיקֵם
  choice: eu os derramei
  rationale: O hifil de ריק pode significar esvaziar ou derramar. “Derramei” preserva a imagem concreta associada à lama e a referência pronominal aos inimigos.
