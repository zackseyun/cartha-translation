  naturalness: A redação é poética e compreensível, mas “dele irromperam brasas ardentes” é mais explicativa e menos diretamente ligada à sintaxe verbal hebraica. “Dele se inflamaram brasas” mantém um português poético, moderno e claro, preservando tanto a origem quanto a ação das brasas.
