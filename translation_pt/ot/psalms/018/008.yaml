base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: pt
  text: Fumaça subiu das suas narinas[a], e fogo de sua boca consumia; dele se inflamaram brasas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua ira”. A palavra hebraica pode significar “nariz/narina” ou, em sentido figurado, “ira”. Aqui, o paralelo com “da sua boca” favorece a imagem concreta.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: subiu fumaça
  rationale: Reproduz diretamente o movimento ascendente expresso por עָלָה e mantém a concisão poética do hebraico.
- source_word: בְּאַפּוֹ
  choice: das suas narinas
  rationale: Embora אַף também possa indicar ira, o paralelo concreto com “da sua boca” favorece aqui a imagem antropomórfica das narinas; a preposição é expressa naturalmente em português como origem.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: e da sua boca saiu fogo consumidor
  rationale: Mantém a origem do fogo na boca e representa a ação de תֹּאכֵל, literalmente “devorava/consumia”, por uma formulação portuguesa natural e vigorosa. “Saiu” é suprido pela elipse poética do segundo membro.
- source_word: גֶּחָלִים בָּעֲרוּ מִמֶּנּוּ
  choice: dele irromperam brasas ardentes
  rationale: “Dele” preserva a origem indicada por מִמֶּנּוּ; “irromperam” comunica vividamente a emissão no contexto, enquanto “ardentes” explicita o sentido de בָּעֲרוּ sem tornar a linha pesada.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus na teofania
  choice: Conservar literalmente “narinas” e “boca”
  alternative: Traduzir אַף de modo abstrato como “ira” e suavizar a imagem corporal
  rationale: O paralelismo entre narinas, boca, fumaça e fogo sustenta uma representação teofânica deliberadamente corporal. Preservá-la mantém a força poética e evita resolver a imagem em uma abstração teológica.
- issue: Valor verbal de תֹּאכֵל
  choice: “fogo consumidor”
  alternative: “fogo que consumia” ou “fogo devorava”
  rationale: A escolha conserva a atividade destrutiva do verbo e produz uma linha idiomática em português, sem especificar um objeto que o hebraico deixa implícito.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão internacional. A ordem inicial ligeiramente marcada preserva o movimento e o paralelismo da poesia hebraica.
