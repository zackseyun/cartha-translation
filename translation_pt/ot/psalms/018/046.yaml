  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: pt
  text: Yahweh vive, bendita seja a minha rocha, e exaltado seja o Deus da minha salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que o Deus da minha salvação seja exaltado”; ou: “e o Deus da minha salvação é exaltado”.'
    reason: O imperfeito hebraico וְיָרוּם admite, neste contexto poético, força volitiva ou declarativa.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh vive
  rationale: חַי funciona de modo predicativo e declara que Yahweh é o Deus vivo. “Yahweh vive” é natural em português e não introduz o sentido de juramento de “Tão certo como Yahweh vive”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וּבָרוּךְ
  choice: bendita seja
  rationale: A formulação expressa uma aclamação de louvor e preserva o tom doxológico, concordando em português com “rocha”.
- source_word: צוּרִי
  choice: a minha rocha
  rationale: Preserva diretamente a metáfora hebraica de estabilidade, proteção e segurança, sem explicá-la por paráfrase.
- source_word: וְיָרוּם
  choice: e exaltado seja
  rationale: O imperfeito pode ter aqui força volitiva ou aclamativa, em paralelo com “bendita seja”; a tradução mantém essa leitura sem ocultar a possibilidade declarativa.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: o Deus da minha salvação
  rationale: Reproduz naturalmente a construção hebraica e apresenta Deus como fonte da salvação ou do livramento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome pessoal divino; “Yahweh” o conserva como nome, sem substituí-lo por um título.
- issue: Força de וְיָרוּם no contexto de louvor
  choice: 'aclamação volitiva: “exaltado seja”'
  alternative: 'declaração: “é exaltado”; exortação: “seja exaltado”'
  rationale: O paralelismo com “bendita seja” favorece a leitura doxológica, mas a nota registra a ambiguidade real do imperfeito hebraico.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. A metáfora “minha rocha” e a expressão “Deus da minha salvação” foram preservadas; o marcador da nota aparece no texto principal.
