  text: עִם חָסִ֥יד תִּתְחַסָּ֑ד עִם גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: pt
  text: Com o fiel, tu te mostras fiel[a]; com o homem íntegro, tu te mostras íntegro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com o leal, tu te mostras leal”. O hebraico emprega palavras da mesma raiz (חסד), ressaltando a lealdade recíproca própria da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: fiel
  rationale: Designa aquele que se caracteriza por lealdade, devoção e fidelidade no relacionamento de aliança. “Fiel” é natural em português e permite conservar a correspondência com o verbo da mesma raiz.
- source_word: תִּתְחַסָּד
  choice: tu te mostras fiel
  rationale: O hitpael apresenta Deus mostrando-se caracterizado por חסד diante do חָסִיד. A formulação reflexiva preserva tanto a reciprocidade poética quanto o vínculo lexical.
- source_word: גְּבַר
  choice: homem
  rationale: O substantivo masculino singular significa “homem”, por vezes com nuance de força; aqui essa nuance não é central, por isso não se acrescenta “forte”.
- source_word: תָּמִים
  choice: íntegro
  rationale: No contexto ético, expressa inteireza e integridade. “Íntegro” é corrente e digno em português, sem sugerir impecabilidade absoluta.
- source_word: תִּתַּמָּם
  choice: tu te mostras íntegro
  rationale: O verbo espelha תָּמִים. Repetir “íntegro” conserva o jogo de palavras e o sentido reflexivo do hebraico.
theological_decisions:
- issue: Descrição recíproca do modo como Deus se manifesta em relação ao caráter humano
  choice: Traduzir com “tu te mostras”, apresentando Deus como fiel e íntegro em sua relação correspondente com o fiel e o íntegro.
  alternative: “És misericordioso com o misericordioso” / “ages com integridade para com o íntegro”.
  rationale: As formas reflexivas hebraicas favorecem “tu te mostras”. Isso preserva a tensão poética da reciprocidade sem afirmar que a natureza de Deus muda ou passa a ser moralmente determinada pelos seres humanos.
translation_notes:
  register: Português moderno, claro e solene, com uso de “tu” coerente com a invocação poética direta a Deus. A repetição de “fiel” e “íntegro” reproduz, na medida do possível, os pares cognatos do hebraico.
