base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: pt
  text: 'Yahweh é meu rochedo[a], minha fortaleza e meu libertador;

    meu Deus, minha rocha, nele me refugio[b];

    meu escudo, o chifre da minha salvação[c] e meu alto refúgio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega aqui dois termos relacionados, mas distintos: סֶלַע, traduzido por “rochedo”, e צוּר, traduzido depois por “rocha”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em quem busco refúgio”.'
    reason: lexical_alternative
  - marker: c
    text: “Chifre” é uma metáfora de força e poder vitorioso que traz salvação.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: סַלְעִי
  choice: meu rochedo
  rationale: Expressa uma grande formação rochosa e mantém distinção em relação a צוּרִי, traduzido depois por “minha rocha”.
- source_word: מְצוּדָתִי
  choice: minha fortaleza
  rationale: Comunica de modo natural a imagem de um lugar fortificado e protetor.
- source_word: מְפַלְטִי
  choice: meu libertador
  rationale: O particípio substantivado designa aquele que proporciona escape ou livramento.
- source_word: אֵלִי
  choice: meu Deus
  rationale: Neste contexto, אֵל funciona como designação divina com sufixo de primeira pessoa.
- source_word: צוּרִי
  choice: minha rocha
  rationale: Preserva a metáfora de estabilidade e proteção sem confundi-la inteiramente com סַלְעִי.
- source_word: אֶחֱסֶה בּוֹ
  choice: nele me refugio
  rationale: Segue de perto a construção hebraica e conserva a imagem concreta de buscar proteção.
- source_word: מָגִנִּי
  choice: meu escudo
  rationale: Equivalente direto e natural da metáfora militar.
- source_word: קֶרֶן יִשְׁעִי
  choice: o chifre da minha salvação
  rationale: Mantém a metáfora hebraica do chifre como símbolo de força e poder vitorioso, sem substituí-la por uma interpretação.
- source_word: מִשְׂגַּבִּי
  choice: meu alto refúgio
  rationale: Expressa um lugar elevado e inacessível de segurança, distinguindo-o da fortaleza mencionada antes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico apresenta o nome próprio divino; a transliteração preserva essa função sem o substituir por um título.
- issue: Preservação das imagens distintas de proteção
  choice: rochedo, fortaleza, rocha e alto refúgio
  alternative: Uniformizar as imagens com repetições de “rocha” ou “fortaleza”
  rationale: O hebraico acumula termos relacionados, mas distintos. A variedade lexical conserva a textura poética e evita reduzir suas imagens a uma só.
- issue: Metáfora do chifre
  choice: o chifre da minha salvação
  alternative: minha força salvadora
  rationale: A tradução mantém a imagem concreta e sua tensão poética; a nota esclarece seu sentido cultural sem inseri-lo como paráfrase no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo e a sequência de metáforas do hebraico foram preservados; o ponto e vírgula organiza os grupos poéticos sem acrescentar relações ausentes do original.
