base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: pt
  text: 'E ele disse: “Eu te amo[a], Yahweh, minha força.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tenho profunda ternura por ti” ou “tenho compaixão de ti”; o verbo traz uma nuance de afeto terno e compaixão, aqui expressa idiomaticamente por “amo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: Preserva explicitamente a fórmula narrativa com waw consecutivo presente no texto da WLC, sem ajustá-la às tradições de numeração que a associam ao cabeçalho.
- source_word: אֶרְחָמְךָ
  choice: Eu te amo
  rationale: O verbo רחם traz a ideia de compaixão e afeto terno. Dirigido a Deus, “eu te amo” comunica de modo natural a devoção afetuosa, enquanto a nota preserva a nuance lexical incomum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: חִזְקִי
  choice: minha força
  rationale: Expressa de maneira direta, natural e tradicional a forma nominal com sufixo de primeira pessoa, apresentando Yahweh como a força do salmista.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por “SENHOR”.
- issue: Sentido de רחם quando dirigido a Deus
  choice: Eu te amo
  alternative: Tenho compaixão de ti / Eu te quero profundamente
  rationale: A tradução principal evita sugerir que o salmista sente pena de Deus e comunica o afeto devocional; a nota registra a nuance de ternura e compaixão do verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A colocação pronominal em “Eu te amo” é natural no português brasileiro, e “minha força” mantém a concisão poética do hebraico.
