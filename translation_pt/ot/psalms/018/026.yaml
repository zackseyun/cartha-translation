  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: pt
  text: Com o puro, tu te mostras puro; com o perverso, tu te mostras tortuoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “tu te mostras astuto” ou “superas em astúcia o perverso”. O hebraico emprega um jogo de palavras de reciprocidade: Deus lida com o perverso de modo correspondente à sua perversidade e a vence; isso não significa que Deus se torne moralmente perverso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: puro
  rationale: O adjetivo expressa pureza ou integridade moral; “puro” é claro e permite preservar a repetição da raiz no verbo seguinte.
- source_word: תִּתְבָּרָר
  choice: tu te mostras puro
  rationale: A forma hitpael tem valor reflexivo ou resultativo e descreve como Deus se manifesta em relação ao puro; a formulação também conserva o jogo de palavras hebraico.
- source_word: עִקֵּשׁ
  choice: perverso
  rationale: O termo caracteriza quem é moralmente desviado ou torto. “Perverso” comunica esse sentido pessoal e moral com naturalidade em português.
- source_word: תִּתְפַּתָּל
  choice: tu te mostras tortuoso
  rationale: A forma verbal evoca agir de maneira torcida ou sinuosa e corresponde poeticamente ao caráter do perverso. “Tortuoso” preserva a força e a tensão da imagem sem explicá-la dentro do verso.
theological_decisions:
- issue: Descrição antropomórfica da resposta de Deus ao perverso
  choice: Manter no texto principal a formulação forte “tu te mostras tortuoso”.
  alternative: “tu te mostras astuto” ou “tu frustras o perverso”
  rationale: 'O paralelismo apresenta uma reciprocidade poética: Deus trata as pessoas de modo correspondente ao caráter delas. A nota esclarece que isso não atribui perversidade moral a Deus, sem eliminar a tensão deliberada do hebraico.'
translation_notes:
  register: Português moderno, claro e digno, com construção paralela adequada à poesia. O tratamento por “tu” preserva a fala direta a Deus; “tortuoso” mantém a imagem incisiva e a ambiguidade controlada do original.
