  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: pt
  text: Persegui meus inimigos e os alcancei; não voltei atrás até que fossem destruídos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «até sua completa destruição».'
    reason: A construção hebraica exprime a consumação ou destruição dos inimigos sem explicitar o agente.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Persegui
  rationale: O imperfeito qal na narrativa poética descreve aqui uma ação passada no contexto da vitória; “persegui” é natural e preserva a imagem militar.
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: Equivalente direto e corrente de אֹיֵב com sufixo de primeira pessoa.
- source_word: וְאַשִּׂיגֵם
  choice: e os alcancei
  rationale: O hifil de נשׂג, no contexto de perseguição, significa alcançar quem foge; a formulação é clara e idiomática em português.
- source_word: וְלֹא אָשׁוּב
  choice: não voltei atrás
  rationale: No contexto, שוב indica interromper a perseguição e retroceder, não apenas retornar a um lugar.
- source_word: עַד כַּלּוֹתָם
  choice: até acabar com eles
  rationale: O infinitivo construto de כלה com sufixo pronominal marca a derrota completa dos inimigos. A expressão portuguesa comunica o sentido de modo natural, sem amenizar a violência do contexto.
theological_decisions:
- issue: Violência e agente na cláusula final
  choice: até acabar com eles
  alternative: até que fossem consumidos
  rationale: A forma hebraica pode ser entendida literalmente como “até a consumação deles”, enquanto o sujeito implícito do infinitivo pode ser associado ao salmista. A tradução escolhida expressa naturalmente a vitória total no encadeamento em primeira pessoa, sem acrescentar uma causa teológica não declarada pelo versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a concisão da poesia militar foram preservados; o ponto e vírgula organiza as duas etapas da ação sem tornar o verso excessivamente literal.
