base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: pt
  text: Fizeste os meus inimigos virar as costas[a], e destruí os que me odiavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Deste-me a nuca dos meus inimigos”, expressão que retrata os inimigos virando-se para fugir ou sendo entregues à derrota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: Equivalente corrente de אֹיֵב com sufixo de primeira pessoa, preservando claramente a relação de hostilidade.
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: Fizeste os meus inimigos virar as costas
  rationale: A expressão hebraica é literalmente «deste-me a nuca/o pescoço dos meus inimigos» e retrata inimigos postos em fuga. A formulação portuguesa comunica naturalmente a imagem e o sentido do idioma.
- source_word: וּמְשַׂנְאַי
  choice: os que me odiavam
  rationale: Reproduz com naturalidade o particípio de שׂנא e seu sufixo de primeira pessoa.
- source_word: אַצְמִיתֵם
  choice: destruí
  rationale: O hifil de צמת indica fazer perecer ou exterminar. «Destruí» conserva a força do verbo sem exagero adicional; o objeto é expresso pela oração seguinte.
theological_decisions:
- issue: Imagem idiomática de עֹרֶף na derrota dos inimigos
  choice: Fizeste os meus inimigos virar as costas
  alternative: Deste-me a nuca dos meus inimigos
  rationale: A tradução explicita a ação figurada de pôr os inimigos em fuga, sem acrescentar uma interpretação doutrinária. A nota preserva a imagem corporal concreta do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura ampla no contexto brasileiro. Emprega-se «fizeste» para manter a segunda pessoa singular presente no hebraico e comum no registro bíblico em português.
