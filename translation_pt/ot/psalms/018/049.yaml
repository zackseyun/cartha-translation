  text: עַל כֵּ֤ן אוֹדְ/ךָ֖ בַ/גּוֹיִ֥ם יְהוָ֑ה וּ/לְ/שִׁמְ/ךָ֥ אֲזַמֵּֽרָה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: pt
  text: Por isso, eu te darei graças entre as nações[a], ó Yahweh, e cantarei louvores ao teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as nações”; também pode ser traduzido como “entre os gentios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural em português a conclusão ou consequência do contexto anterior.
- source_word: אוֹדְךָ
  choice: eu te darei graças
  rationale: O hifil de ידה, neste contexto de salmo, comunica ação de graças dirigida pessoalmente a Deus; a formulação preserva o sufixo de segunda pessoa.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa nações ou povos e, aqui, destaca o âmbito internacional da proclamação; “gentios” também é lexicalmente possível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּלְשִׁמְךָ
  choice: e ao teu nome
  rationale: A preposição ל com שֵׁם liga naturalmente o nome divino ao ato de cantar louvores.
- source_word: אֲזַמֵּרָה
  choice: cantarei louvores
  rationale: O piel de זמר denota cantar ou fazer música em louvor; esta formulação explicita o sentido cultual e mantém o paralelismo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de גּוֹיִם
  choice: nações
  alternative: gentios
  rationale: No contexto hebraico do salmo, “nações” conserva melhor o sentido amplo e internacional, enquanto “gentios” pode sugerir uma moldura posterior ou uma distinção religiosa mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Ó Yahweh” mantém o vocativo poético; “darei graças” e “cantarei louvores” preservam o paralelismo do verso.
