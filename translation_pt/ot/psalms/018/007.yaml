base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: pt
  text: Então a terra se agitou e tremeu, e os fundamentos dos montes estremeceram e se abalaram, porque ele estava irado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “porque a ira dele se acendeu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: se agitou
  rationale: Expressa o movimento violento e revolto de געשׁ sem confundi-lo com o tremor sísmico indicado pelo verbo seguinte.
- source_word: וַתִּרְעַשׁ
  choice: tremeu
  rationale: רעשׁ descreve tremor ou abalo, e “a terra tremeu” é uma formulação natural e clara em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto teofânico e cósmico favorece “a terra”, em vez do sentido mais localizado de “a região” ou “o país”.
- source_word: מוֹסְדֵי הָרִים
  choice: os fundamentos dos montes
  rationale: Mantém a imagem poética das bases que sustentam os montes e reproduz a definição presente no hebraico.
- source_word: יִרְגָּזוּ
  choice: estremeceram
  rationale: רגז comunica tremor e agitação; “estremeceram” distingue este verbo dos demais sem enfraquecer o paralelismo.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: se abalaram
  rationale: A forma intensiva-reflexiva retoma a agitação de געשׁ. “Se abalaram” preserva a força e o movimento da imagem em português natural.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa da convulsão da terra e dos montes.
- source_word: חָרָה לוֹ
  choice: ele estava irado
  rationale: Traduz com clareza o sentido do idioma hebraico de ira ardente; a imagem mais literal é preservada em nota.
theological_decisions:
- issue: Descrição antropopática da ira divina
  choice: porque ele estava irado
  alternative: porque a ira dele se acendeu
  rationale: A tradução afirma sem atenuação a ira divina, mas comunica em português corrente o sentido do idioma hebraico. A alternativa mais imagética e literal permanece disponível na nota.
translation_notes:
  register: Português moderno, poético e digno, com vocabulário amplamente compreensível. A sequência de verbos distintos conserva o paralelismo e a intensidade crescente do hebraico sem produzir repetição artificial.
