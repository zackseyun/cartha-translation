  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: pt
  text: Pois guardei os caminhos de Javé e não me afastei perversamente do meu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não agi perversamente, afastando-me do meu Deus”. O verbo hebraico significa “agir perversamente”, e a expressão seguinte indica afastamento de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e preserva o encadeamento argumentativo do salmo.
- source_word: שָׁמַרְתִּי
  choice: guardei
  rationale: O verbo שׁמר expressa guardar, observar ou cumprir. O pretérito perfeito comunica de modo natural a ação apresentada pelo perfeito hebraico neste testemunho retrospectivo.
- source_word: דַּרְכֵי
  choice: os caminhos
  rationale: Em contexto moral e pactual, דֶּרֶךְ designa a maneira de viver determinada por Deus, e não estradas literais.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa amplamente reconhecida do nome divino, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: e não me afastei perversamente do meu Deus
  rationale: Reproduz de modo conciso a combinação de רשע, agir perversamente, com מִן, desde ou para longe de, mantendo tanto a maldade do ato quanto a ideia relacional de afastamento.
theological_decisions:
- issue: A forte declaração de integridade do salmista e sua relação com a pecaminosidade humana
  choice: Conservar a afirmação de que ele guardou os caminhos de Javé e não se afastou perversamente de Deus
  alternative: Enfraquecer a declaração, tratando-a apenas como aspiração, ou ampliá-la para uma alegação explícita de impecabilidade absoluta
  rationale: O hebraico faz uma afirmação enfática de fidelidade concreta, especialmente quanto a não abandonar Deus, mas não formula diretamente uma doutrina de impecabilidade. A tradução mantém essa tensão sem resolvê-la.
- issue: Relação sintática entre רָשַׁעְתִּי e מֵאֱלֹהָי
  choice: Entender a expressão como afastar-se perversamente de Deus
  alternative: Traduzir mais literalmente como agir perversamente, com o afastamento de Deus expresso em uma construção separada
  rationale: A construção admite uma formulação integrada e idiomática, mas a nota registra a alternativa mais transparente quanto à forma hebraica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. “Javé” preserva o nome divino; “guardei os caminhos” mantém a imagem moral e pactual do hebraico. A colocação de “perversamente” evita linguagem arcaica sem suavizar a gravidade da afirmação.
