  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: pt
  text: Eu os esmago[a], e eles não conseguem se levantar[b]; caem debaixo dos meus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu os despedaço” ou “Eu os golpeio até derrubá-los”; o verbo hebraico transmite a ideia de esmagamento violento em batalha.
    reason: lexical_alternative
  - marker: b
    text: Ou “não conseguem ficar de pé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Eu os esmago
  rationale: O verbo מחץ comunica um golpe violento, esmagamento ou despedaçamento em contexto de batalha. “Esmago” preserva a força da imagem e é natural em português.
- source_word: וְלֹא
  choice: e ... não
  rationale: Mantém a coordenação simples seguida de negação presente no hebraico.
- source_word: יֻכְלוּ
  choice: não conseguem
  rationale: יכל expressa capacidade; “não conseguem” é uma formulação corrente e concisa em português.
- source_word: קוּם
  choice: se levantar
  rationale: Após o verbo de capacidade, קום descreve levantar-se depois de cair. A forma pronominal é idiomática em português e preserva a imagem concreta.
- source_word: יִפְּלוּ
  choice: caem
  rationale: נפל significa diretamente “cair”. O presente poético acompanha com naturalidade a ação verbal do verso.
- source_word: תחת רגלי
  choice: debaixo dos meus pés
  rationale: Reproduz a expressão espacial e a imagem de derrota completa em linguagem clara e natural.
theological_decisions:
- issue: Imagens violentas de batalha em um salmo régio
  choice: Manter em primeira pessoa a linguagem marcial explícita, “Eu os esmago”
  alternative: Suavizar para “Eu os derroto” ou “Eu os venço”
  rationale: O hebraico emprega explicitamente uma imagem de esmagamento, seguida da incapacidade de levantar-se e da queda sob os pés. Suavizá-la reduziria indevidamente a força do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação conserva o paralelismo poético e a intensidade marcial do hebraico sem acrescentar interpretação denominacional.
