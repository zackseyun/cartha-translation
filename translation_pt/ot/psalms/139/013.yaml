source:
  edition: WLC
  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: pt
  text: Pois tu formaste o meu íntimo[a]; entreteceste-me no ventre de minha mãe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «os meus rins», expressão figurada para as partes mais profundas do ser.'
    reason: cultural_note
  - marker: b
    text: 'Ou: «tu me cobriste»; também pode ser entendido como «tu me teceste».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e preserva com naturalidade o nexo causal do hebraico.
- source_word: קָנִיתָ
  choice: formaste
  rationale: Embora קנה possa significar adquirir ou possuir, neste contexto de formação pré-natal, «formaste» comunica de modo claro a ação criadora de Deus sem sugerir uma transação comercial.
- source_word: כִלְיֹתָי
  choice: o meu íntimo
  rationale: O hebraico diz literalmente «meus rins», expressão concreta usada para as dimensões mais profundas do ser interior. «O meu íntimo» transmite o sentido idiomático em português atual; a imagem literal é registrada em nota.
- source_word: תְּסֻכֵּנִי
  choice: entreteceste-me
  rationale: O verbo deriva de uma raiz associada a cobrir ou resguardar. No contexto do ventre, «entreteceste-me» expressa a formação cuidadosa e intrincada, sem ocultar em nota a alternativa mais literal.
- source_word: בְּבֶטֶן אִמִּי
  choice: no ventre de minha mãe
  rationale: Formulação natural e digna em português, preservando tanto a localização quanto a referência materna.
theological_decisions:
- issue: Linguagem sobre a formação pré-natal sem acrescentar formulações doutrinárias posteriores
  choice: Traduzir o verso como afirmação poética da participação direta de Deus na formação do salmista no ventre materno.
  alternative: 'Adotar uma tradução mais literal: «tu adquiriste/possuíste os meus rins; tu me cobriste no ventre de minha mãe».'
  rationale: A redação conserva a forte agência divina declarada pelo texto, mas não a amplia com conclusões doutrinárias que o próprio verso não explicita.
translation_notes:
  register: Português moderno, amplo e dignificado, com boa legibilidade brasileira. «Entreteceste-me» mantém o tom poético e a imagem de formação cuidadosa; as notas preservam a concretude e a ambiguidade lexical do hebraico.
