lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Eu te louvo
  rationale: O hifil de ידה pode significar agradecer ou louvar. Neste contexto poético, em resposta à obra criadora de Deus, “louvo” comunica melhor a força doxológica.
- source_word: עַל כִּי
  choice: porque
  rationale: A expressão introduz a razão do louvor e é traduzida de modo causal claro e natural.
- source_word: נוֹרָאוֹת
  choice: de modo assombroso
  rationale: O termo deriva de ירא e descreve aquilo que desperta temor reverente ou admiração profunda, não mero terror. “Assombroso” conserva essa intensidade, esclarecida em nota.
- source_word: נִפְלֵיתִי
  choice: fui feito ... maravilhoso
  rationale: O nifal de פלא indica ser extraordinário ou maravilhoso. À luz do contexto imediato sobre a formação do salmista, “fui feito” explicita naturalmente em português a ideia implícita, sem atribuir ao verbo uma forma ativa.
- source_word: נִפְלָאִים
  choice: Maravilhosas
  rationale: Descreve as obras de Deus como extraordinárias e mantém a ligação lexical e poética com “maravilhoso” na oração anterior.
- source_word: מַעֲשֶׂיךָ
  choice: as tuas obras
  rationale: מעשה abrange obras, feitos e coisas produzidas; aqui a expressão inclui adequadamente a formação do próprio salmista.
- source_word: וְנַפְשִׁי
  choice: e a minha alma
  rationale: נפש pode designar alma, vida, pessoa ou ser interior. “Minha alma” preserva a imagem poética, enquanto a nota evita impor um dualismo estrito.
- source_word: יֹדַעַת מְאֹד
  choice: sabe disso muito bem
  rationale: O verbo feminino concorda com נפש. “Disso” explicita o objeto implícito, e “muito bem” expressa com naturalidade a intensidade de מְאֹד.
theological_decisions:
- issue: Nuance antropológica de נֶפֶשׁ
  choice: a minha alma
  alternative: eu mesmo; o meu íntimo; todo o meu ser
  rationale: A expressão tradicional conserva a linguagem poética, mas o hebraico não exige uma concepção estritamente dualista da pessoa; por isso, a amplitude semântica é registrada em nota.
- issue: Agente e sentido de נִפְלֵיתִי
  choice: fui feito de modo ... maravilhoso
  alternative: sou assombrosamente maravilhoso; fui distinguido de modo maravilhoso
  rationale: O contexto dos versículos próximos favorece a formação do salmista por Deus, mas a construção hebraica é compacta e não contém explicitamente o verbo “fazer”; a nota preserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem “Maravilhosas são as tuas obras” conserva a ênfase poética do hebraico sem soar arcaica. “Assombroso” é mantido por sua força reverencial e esclarecido em nota para evitar a leitura de mero medo.
