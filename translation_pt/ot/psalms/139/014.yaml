  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: pt
  text: Eu te louvo, porque fui feito de modo admirável e maravilhoso[a]; maravilhosas são as tuas obras, e a minha alma[b] sabe disso muito bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sou extraordinário de modo que inspira reverência”. O hebraico é compacto e expressa admiração reverente, não simples terror; “fui feito” é explicitado com base no contexto da formação do salmista.'
