  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: pt
  text: E como são preciosos para mim os teus pensamentos[a], ó Deus! Como é imensa a soma deles[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus amigos” ou “os que te são queridos”. A forma hebraica רֵעֶיךָ pode ser entendida assim, mas o contexto da contagem e da enorme quantidade nos versículos 17–18 favorece “os teus pensamentos”.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “as cabeças deles”. Aqui, a expressão provavelmente significa “a soma deles” ou “o total deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: E, para mim
  rationale: Preserva tanto a ligação com o contexto quanto a perspectiva pessoal enfática do hebraico, em português natural.
- source_word: מַה ... יָּקְרוּ
  choice: como são preciosos
  rationale: מַה tem valor exclamativo, e יקר expressa aqui valor e preciosidade.
- source_word: רֵעֶיךָ
  choice: os teus pensamentos
  rationale: Embora a forma admita uma leitura ligada a amigos ou pessoas queridas, o contexto imediato de contar e da grande quantidade em 139:17–18 favorece 'pensamentos'.
- source_word: אֵל
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; a forma portuguesa conserva a invocação poética direta.
- source_word: מֶה עָצְמוּ
  choice: Como é imensa
  rationale: A expressão é exclamativa, e o verbo comunica grandeza ou numerosidade; com o coletivo 'soma', o singular é natural em português.
- source_word: רָאשֵׁיהֶם
  choice: a soma deles
  rationale: Literalmente 'as cabeças deles', expressão entendida no contexto como o total ou a soma, especialmente à luz da contagem mencionada no versículo seguinte.
theological_decisions:
- issue: Sentido de רֵעֶיךָ
  choice: os teus pensamentos
  alternative: os teus amigos; os que te são queridos
  rationale: A referência à soma e à impossibilidade de contar no contexto favorece os pensamentos de Deus. A alternativa genuína é registrada em nota, sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de boa legibilidade brasileira. Mantêm-se o paralelismo exclamativo, o vocativo poético e notas concisas para a ambiguidade e o idioma hebraicos.
