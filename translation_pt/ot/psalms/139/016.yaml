source:
  edition: WLC
  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: pt
  text: Teus olhos viram meu corpo ainda informe[a], e no teu livro todos eles foram escritos — os dias que foram formados[b][c] — quando ainda nenhum deles existia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu embrião” ou “minha forma inacabada”. A palavra hebraica se refere a algo que ainda não está plenamente formado.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos eles foram escritos no teu livro; os dias foram formados”. A sintaxe hebraica é condensada e difícil.'
    reason: alternative_reading
  - marker: c
    text: “Foram formados” também pode ser traduzido por “foram modelados”. Algumas traduções dizem “foram ordenados”, mas isso é mais interpretativo do que o sentido básico do verbo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: meu corpo ainda informe
  rationale: גֹּלֶם designa algo ainda não plenamente formado. “Corpo ainda informe” comunica a imagem no contexto do desenvolvimento pré-natal sem impor o termo biológico moderno “embrião”; a nota preserva outras possibilidades.
- source_word: רָאוּ עֵינֶיךָ
  choice: Teus olhos viram
  rationale: Tradução direta do verbo no qatal e do sujeito poético “teus olhos”; o pretérito perfeito é natural no contexto.
- source_word: וְעַל סִפְרְךָ
  choice: e no teu livro
  rationale: Embora עַל frequentemente signifique “sobre”, “no teu livro” expressa de modo idiomático o registro escrito.
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: todos eles foram escritos
  rationale: Mantém o pronome plural e a imagem concreta da escrita, sem eliminar a construção comprimida do hebraico.
- source_word: יָמִים יֻצָּרוּ
  choice: os dias que foram formados
  rationale: יצר significa formar ou modelar. A formulação preserva essa imagem básica e evita o termo teologicamente mais específico “ordenados”.
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: quando ainda nenhum deles existia
  rationale: O hebraico é elíptico; a tradução explicita de modo mínimo e natural que nenhum dos dias ainda havia chegado a existir.
theological_decisions:
- issue: Se יֻצָּרוּ deve ser traduzido com linguagem que afirme explicitamente predestinação
  choice: foram formados
  alternative: foram ordenados; foram destinados
  rationale: O verbo hebraico tem o sentido básico de formar ou modelar. A tradução conserva a anterioridade do conhecimento e da ação divina sem transformar a imagem em uma formulação doutrinária mais específica.
- issue: Identificação do referente de כֻּלָּם, “todos eles”
  choice: 'Aposição explicativa: “todos eles... — os dias...”'
  alternative: “todos os meus dias foram escritos”
  rationale: A aposição torna inteligível o referente mais provável, mas conserva algo da sintaxe comprimida e não acrescenta “meus”, que não está expresso nessa oração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa coerentes (“teus”). “Corpo ainda informe” é claro para leitores comuns, enquanto as notas conservam a amplitude lexical e a dificuldade sintática do hebraico.
