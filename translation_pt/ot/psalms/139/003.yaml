  yaml_path: translation/ot/psalms/139/003.yaml
  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: pt
  text: Tu examinas cuidadosamente meu caminho e meu deitar[a] e conheces bem todos os meus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “peneiras meu caminho e meu deitar”. O verbo hebraico evoca o ato de joeirar ou peneirar e, assim, sugere um exame cuidadoso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: o meu caminho
  rationale: Preserva a metáfora concreta de uma rota percorrida e mantém o singular do hebraico.
- source_word: רִבְעִי
  choice: o meu deitar
  rationale: Expressa de modo conciso o ato de deitar-se ou repousar, em paralelo com o caminho.
- source_word: זֵרִיתָ
  choice: peneiras
  rationale: Conserva a imagem hebraica de joeirar ou peneirar, que no contexto comunica exame cuidadoso.
- source_word: כָל
  choice: todos
  rationale: Mantém a ideia de totalidade no conhecimento divino.
- source_word: דְּרָכַי
  choice: os meus caminhos
  rationale: Preserva tanto a imagem de caminhos concretos quanto o possível sentido mais amplo de conduta.
- source_word: הִסְכַּנְתָּה
  choice: conheces bem
  rationale: Comunica familiaridade profunda em português atual, sem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Imagem antropomórfica do conhecimento divino
  choice: Manter a imagem concreta de peneirar e a metáfora dos caminhos.
  alternative: Traduzir de modo mais abstrato como “examinas” ou “conheces”.
  rationale: O verso apresenta poeticamente o conhecimento minucioso de Deus por meio de imagens da vida comum; preservá-las evita reduzir a força poética a uma formulação doutrinária abstrata.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a forma verbal e vocabulário compreensível em diferentes regiões; a repetição de “caminho/caminhos” preserva o paralelismo e a imagem do hebraico.
