  text: Mesmo ali a tua mão me guiará, e a tua mão direita me segurará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: Mesmo ali
  rationale: Preserva a força inclusiva e enfática de גַּם com o advérbio locativo שָׁם, ligando o versículo aos lugares extremos mencionados no contexto.
- source_word: תַנְחֵנִי
  choice: me guiará
  rationale: Traduz o hifil de נחה de modo direto e natural, mantendo o sentido de conduzir ou guiar.
- source_word: וְתֹאחֲזֵנִי
  choice: e ... me segurará
  rationale: אחז expressa agarrar, sustentar ou segurar. A formulação mantém a imagem concreta sem acrescentar uma intensidade que não está explicitamente marcada no hebraico.
- source_word: יְמִינֶךָ
  choice: a tua mão direita
  rationale: Explicita em português o referente corporal natural de 'tua direita', preservando o paralelismo com 'a tua mão' no primeiro membro.
theological_decisions:
- issue: Valor da mão direita divina
  choice: 'Manter a imagem concreta: “a tua mão direita me segurará”'
  alternative: Interpretar como símbolo explícito de poder, proteção ou favor
  rationale: O texto poético permite essas associações, mas não as formula diretamente; a tradução preserva a imagem e deixa sua riqueza teológica aberta ao leitor.
translation_notes:
  register: Português moderno, claro e digno, com construção poética natural. O futuro verbal acompanha as formas hebraicas no contexto da afirmação do salmista.
