base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/011.yaml
  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: pt
  text: 'E eu disse: “Certamente as trevas me encobrirão[a], e a noite será luz ao meu redor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as trevas me dominarão”, ou “as trevas me ferirão”. O verbo hebraico é raro, e sua nuance exata aqui é discutida.
    reason: lexical_alternative
  - marker: b
    text: Ou “e a noite é luz ao meu redor”. A oração hebraica não tem verbo expresso; pode ser traduzida no presente ou no futuro, conforme sua relação com a declaração do salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: A forma hebraica é waw + qatal na primeira pessoa do singular e expressa naturalmente uma reflexão no passado. Evita-se transformá-la numa condição, embora o contexto possa levar algumas traduções a dizer “Se eu disser”.
- source_word: אַךְ
  choice: Certamente
  rationale: Aqui a partícula enfatiza a afirmação do salmista, em vez de impor uma restrição como “somente”.
- source_word: חֹשֶׁךְ
  choice: as trevas
  rationale: Tradução corrente e natural do substantivo no contexto poético; o artigo em português torna a expressão idiomática sem alterar o sentido.
- source_word: יְשׁוּפֵנִי
  choice: me encobrirão
  rationale: O verbo שׁוּף é raro e sua nuance exata é discutida. Com “trevas” como sujeito, “encobrir” comunica adequadamente a imagem de ocultação e prepara o contraste do versículo seguinte, sem eliminar as alternativas possíveis.
- source_word: וְלַיְלָה
  choice: e a noite
  rationale: Preserva a coordenação simples e o paralelismo entre as duas partes do verso.
- source_word: אוֹר
  choice: será luz
  rationale: A oração hebraica não contém verbo expresso. O futuro acompanha a projeção iniciada na primeira parte, enquanto o substantivo “luz” conserva a concisão e o contraste poético do hebraico.
- source_word: בַּעֲדֵנִי
  choice: ao meu redor
  rationale: Neste contexto, a preposição indica de modo mais natural uma relação espacial envolvente; a expressão é clara e idiomática em português.
