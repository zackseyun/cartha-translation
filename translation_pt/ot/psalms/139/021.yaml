  text: הֲ/לֽוֹא מְשַׂנְאֶ֖י/ךָ יְהוָ֥ה אֶשְׂנָ֑א וּ֝/בִ/תְקוֹמְמֶ֗י/ךָ אֶתְקוֹטָֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: pt
  text: Não odeio eu, SENHOR, os que te odeiam? Não abomino os que se levantam contra ti?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: os que te odeiam / odeio
  rationale: Preserva a repetição enfática da raiz שׂנא e a forma retórica da pergunta.
- source_word: אֶתְקוֹטָט
  choice: abomino
  rationale: O verbo hitpolel de קוט expressa forte repulsa ou aversão; “abomino” comunica essa intensidade de modo natural e digno, sem reduzi-lo a mero conflito.
- source_word: מִתְקוֹמְמֶיךָ
  choice: os que se levantam contra ti
  rationale: Reproduz a imagem de oposição ativa presente no particípio hebraico.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes/maiúsculas.
theological_decisions:
- issue: A intensidade da reação do salmista aos inimigos de Deus
  choice: “odeio” e “abomino”
  alternative: “rejeito” e “detesto”
  rationale: Mantém sem atenuação a linguagem forte do hebraico e não resolve a tensão teológica ou ética do versículo.
translation_notes:
  register: Português moderno, claro e solene, com estrutura interrogativa retórica e paralelismo poético preservados. A colocação de “SENHOR” após o verbo soa natural em português e mantém o vocativo.
