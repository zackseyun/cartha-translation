  yaml_path: translation/ot/psalms/139/007.yaml
  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: pt
  text: Para onde posso ir para longe do teu Espírito? Ou para onde posso fugir da tua presença?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica rúach também pode significar “vento” ou “sopro”; aqui, o contexto favorece “Espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה
  choice: Para onde
  rationale: O advérbio interrogativo pergunta pelo destino; “para onde” expressa com naturalidade o movimento indicado pelo verbo.
- source_word: אֵלֵךְ
  choice: posso ir
  rationale: O imperfeito qal na pergunta retórica trata da possibilidade de ir a algum lugar fora do alcance divino, não apenas de uma ação futura.
- source_word: מֵ/רוּחֶךָ
  choice: longe do teu Espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. O paralelismo com “tua presença” e o contexto favorecem a referência ao Espírito de Deus. “Longe de” torna natural em português a ideia de afastamento expressa pela preposição מִן.
- source_word: וְאָ֗נָה
  choice: Para onde
  rationale: A repetição mantém o paralelismo poético. Em português, duas perguntas justapostas soam naturais sem a necessidade de traduzir a conjunção por “e” ou “ou”.
- source_word: מִפָּנֶיךָ
  choice: da tua presença
  rationale: Embora פָּנִים signifique literalmente “face”, nesta construção designa a presença pessoal de Deus.
- source_word: אֶבְרָח
  choice: posso fugir
  rationale: O imperfeito qal de ברח significa “fugir”. Na pergunta retórica paralela, “posso fugir” comunica a impossibilidade de escapar.
theological_decisions:
- issue: Se רוּחַ deve ser entendido de modo impessoal (“vento” ou “sopro”) ou como referência pessoal ao Espírito de Deus
  choice: teu Espírito
  alternative: teu vento; teu sopro
  rationale: O tema da presença divina da qual ninguém pode escapar e o paralelismo com “tua presença” favorecem uma referência ao Espírito de Deus, sem eliminar em nota a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Para onde” preserva o paralelismo hebraico; “longe do” evita a formulação pouco natural “ir do teu Espírito”.
