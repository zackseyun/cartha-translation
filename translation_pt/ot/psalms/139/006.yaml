  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: pt
  text: Esse conhecimento é maravilhoso demais para mim[a]; é elevado demais — não consigo alcançá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esse conhecimento está além de mim; é sublime; não consigo atingi-lo.”'
    reason: Alternativa lexical que torna explícita a ideia de estar além da capacidade do salmista e traduz נִשְׂגְּבָה por “sublime”.
lexical_decisions:
- source_word: פלאיה
  choice: maravilhoso demais
  rationale: Expressa algo extraordinário, que ultrapassa a compreensão comum; com מִמֶּנִּי, a formulação indica que excede a capacidade do salmista.
- source_word: דַעַת
  choice: conhecimento
  rationale: É o sentido direto do substantivo e retoma o conhecimento divino descrito nos versículos anteriores.
- source_word: מִמֶּנִּי
  choice: para mim
  rationale: Embora literalmente possa ser entendido como 'de mim' ou 'mais do que eu', aqui assinala que esse conhecimento está além da capacidade pessoal do salmista.
- source_word: נִשְׂגְּבָה
  choice: é elevado demais
  rationale: Preserva a metáfora de altura e a ideia de inacessibilidade, em paralelo com a incapacidade de alcançá-lo.
- source_word: לֹא אוּכַל
  choice: não consigo
  rationale: Traduz de modo natural a negação da capacidade expressa pela forma de יכל na primeira pessoa.
- source_word: לָהּ
  choice: alcançá-lo
  rationale: O hebraico diz literalmente 'a ele/a ela'; o verbo é completado pelo contexto. 'Alcançá-lo' conserva a imagem de algo elevado e fora de alcance.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “demais” comunica a incapacidade do salmista, enquanto “elevado” preserva a metáfora hebraica.
