  text: חָקְרֵ֣/נִי אֵ֭ל וְ/דַ֣ע לְבָבִ֑/י בְּ֝חָנֵ֗/נִי וְ/דַ֣ע שַׂרְעַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: pt
  text: Sonda-me, ó Deus, e conhece o meu coração; prova-me e conhece os meus pensamentos inquietos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus pensamentos ansiosos” ou “meus pensamentos divididos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: Sonda-me
  rationale: O verbo חקר expressa uma investigação profunda. “Sonda-me” é natural no registro poético e devocional, preserva a imagem de examinar o íntimo e evita a conotação menos adequada de procurar alguém perdido.
- source_word: אֵל
  choice: ó Deus
  rationale: אֵל é aqui um título divino em vocativo. “Ó Deus” explicita de modo natural e digno a invocação direta.
- source_word: וְדַע
  choice: e conhece
  rationale: ידע pede que Deus conheça ou perceba plenamente. A repetição de “conhece” nas duas linhas conserva o paralelismo hebraico.
- source_word: לְבָבִי
  choice: o meu coração
  rationale: לֵבָב abrange o interior da pessoa, incluindo pensamento e vontade. “Coração” mantém a imagem bíblica tradicional sem reduzi-la a uma categoria psicológica moderna.
- source_word: בְּחָנֵנִי
  choice: prova-me
  rationale: בחן denota testar ou verificar a qualidade, como no ensaio de metais. “Prova-me” distingue este verbo de “sonda-me” e soa digno no contexto poético.
- source_word: שַׂרְעַפָּי
  choice: os meus pensamentos inquietos
  rationale: שַׂרְעַפִּים pode designar pensamentos perturbadores, ansiosos ou divididos. “Pensamentos inquietos” comunica a perturbação interior sem restringir o termo ao sentido clínico moderno de ansiedade.
theological_decisions:
- issue: Linguagem antropológica da vida interior
  choice: Manter “coração” e “pensamentos inquietos” como expressões distintas.
  alternative: Substituí-los por “mente” e “pensamentos”, ou reuni-los em “meu íntimo”.
  rationale: O hebraico emprega dois termos distintos em paralelismo. Preservá-los mantém a riqueza poética e evita impor uma divisão moderna ou uma simplificação da antropologia bíblica.
- issue: Amplitude semântica de שַׂרְעַפָּי
  choice: Usar “pensamentos inquietos” e registrar alternativas em nota.
  alternative: “pensamentos ansiosos” ou “pensamentos divididos”.
  rationale: O termo admite nuances de inquietação, ansiedade e divisão interior. A tradução principal conserva o sentido amplo, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português atual, claro e digno, com cadência poética. O vocativo “ó Deus” e os imperativos pronominais preservam o tom de oração; a repetição de “conhece” conserva o paralelismo do original.
