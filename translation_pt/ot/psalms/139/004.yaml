  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: pt
  text: Pois não há uma palavra na minha língua — eis que[a], ó Yahweh, tu a conheces por inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não há uma palavra na minha língua; de fato, ó Yahweh, tu a conheces por inteiro.”'
    reason: A partícula הֵן também pode introduzir uma confirmação, como “de fato”, em vez de um chamamento de atenção, como “eis que”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do pensamento anterior e preserva de modo natural a ligação discursiva.
- source_word: אֵין
  choice: ainda não há
  rationale: Representa a negação existencial; “ainda” torna explícito o valor contextual de uma palavra que não chegou a ser pronunciada, sem alterar a imagem hebraica.
- source_word: מִלָּה
  choice: uma palavra
  rationale: É o equivalente direto no contexto da fala e mantém o singular do hebraico.
- source_word: בִּלְשׁוֹנִי
  choice: na minha língua
  rationale: Preserva a metáfora corporal do hebraico e soa natural em português, referindo-se à palavra prestes a ser dita.
- source_word: הֵן
  choice: eis que
  rationale: 'Mantém a força enfática e solene da partícula de atenção, embora ela também possa funcionar como confirmação: “de fato”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יָדַעְתָּ
  choice: tu a conheces
  rationale: O perfeito hebraico comunica aqui conhecimento pleno e presente; o pronome retoma “palavra”.
- source_word: כֻלָּהּ
  choice: por inteiro
  rationale: Expressa conhecimento exaustivo da palavra, preservando a referência singular e feminina do sufixo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem convertê-lo em título.
- issue: Alcance do conhecimento expresso por כֻּלָּהּ
  choice: tu a conheces por inteiro
  alternative: tu sabes tudo
  rationale: A opção escolhida mantém a referência gramatical à “palavra” e não amplia silenciosamente o objeto para tudo em sentido irrestrito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento poético em segunda pessoa do singular. A construção mantém a imagem da língua e a ênfase da partícula hebraica; a nota registra a ambiguidade sem sobrecarregar o verso.
