  text: אִם תִּקְטֹ֖ל אֱל֥וֹהַּ רָשָׁ֑ע וְ/אַנְשֵׁ֥י דָ֝מִ֗ים ס֣וּרוּ מֶֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: pt
  text: Se ao menos matasses o ímpio, ó Deus! E vocês, homens sanguinários,[a] afastem-se de mim!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homens de sangues”, expressão hebraica que designa homens violentos ou homicidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se ao menos
  rationale: No início desta exclamação, אִם tem valor optativo, expressando um desejo, e não uma condição simples.
- source_word: תִּקְטֹל
  choice: matasses
  rationale: O imperfeito qal, unido à expressão optativa, indica a ação desejada. O pretérito imperfeito do subjuntivo comunica esse desejo naturalmente em português.
- source_word: אֱלוֹהַּ
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; “ó Deus” preserva a invocação direta e o registro solene da oração.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado está no singular e pode ter sentido genérico ou coletivo. A tradução mantém o singular sem restringi-lo necessariamente a um indivíduo específico.
- source_word: וְאַנְשֵׁי דָמִים
  choice: E vocês, homens sanguinários
  rationale: A expressão hebraica, literalmente “homens de sangues”, designa pessoas violentas ou homicidas. “Homens sanguinários” comunica o idioma com clareza, enquanto a nota preserva sua imagem literal.
- source_word: סוּרוּ
  choice: afastem-se
  rationale: O imperativo plural ordena aos homens violentos que se retirem da presença do salmista. “Afastem-se” é direto e natural em português atual.
- source_word: מֶנִּי
  choice: de mim
  rationale: 'A preposição com sufixo de primeira pessoa singular indica separação: “de mim”.'
theological_decisions:
- issue: Se o desejo imprecatório deve ser suavizado
  choice: Manter o pedido explícito para que Deus mate o perverso
  alternative: Suavizar como “castigasses”, “tratasses com o perverso” ou transformar o desejo em mera previsão de juízo
  rationale: O hebraico emprega diretamente o verbo “matar” em uma formulação optativa. A tradução preserva a tensão teológica da oração imprecatória sem atenuá-la nem explicá-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Se ao menos” expressa o desejo de modo corrente; o vocativo “ó Deus” conserva o tom de oração. A coordenação com “E vocês” deixa clara a mudança do pedido dirigido a Deus para a ordem dirigida aos homens sanguinários.
