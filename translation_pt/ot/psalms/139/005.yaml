  text: אָח֣וֹר וָ/קֶ֣דֶם צַרְתָּ֑/נִי וַ/תָּ֖שֶׁת עָלַ֣/י כַּפֶּֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/005.yaml
  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: pt
  text: Tu me cercas por trás e pela frente[a] e pões a tua mão sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Tu me envolves» ou «Tu me sitias»; o verbo hebraico pode ter, conforme o contexto, sentido neutro ou protetor, ou sugerir maior pressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: por trás
  rationale: Expressa naturalmente a posição posterior e preserva o contraste espacial com קֶדֶם.
- source_word: קֶדֶם
  choice: pela frente
  rationale: No paralelismo com אָחוֹר, tem sentido espacial, não temporal nem geográfico; a expressão é clara em português moderno.
- source_word: צַרְתָּנִי
  choice: me cercas
  rationale: O verbo indica cercar ou encerrar, podendo sugerir proteção ou pressão. «Cercas» preserva essa ambivalência melhor que opções explicitamente protetoras ou hostis.
- source_word: וַתָּשֶׁת
  choice: pões
  rationale: Verbo comum para pôr ou colocar; «pões a tua mão» é uma construção natural e digna em português.
- source_word: עָלַי
  choice: sobre mim
  rationale: Representa diretamente a posição expressa pela preposição עַל e mantém a imagem poética.
- source_word: כַּפֶּךָ
  choice: a tua mão
  rationale: Embora כַּף possa designar especificamente a palma, «mão» é a forma idiomática adequada neste contexto e conserva a imagem antropomórfica.
theological_decisions:
- issue: Se o cerco divino deve soar protetor, restritivo ou ambos
  choice: Manter a imagem ambivalente do cerco e do toque divinos.
  alternative: Traduzir de modo exclusivamente protetor («tu me guardas») ou exclusivamente opressivo («tu me sitias»).
  rationale: O hebraico permite tanto uma nuance de proteção quanto de pressão. «Me cercas» mantém a tensão entre a presença íntima e a presença incontornável de Deus sem impor uma interpretação emocional ou doutrinária estreita.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com uso de «tu» coerente com a segunda pessoa singular hebraica. A formulação evita arcaísmos e conserva a concisão e a ambiguidade do original.
