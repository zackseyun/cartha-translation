  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: pt
  text: Tu sabes quando me sento e quando me levanto; discernes o meu pensamento[a] de longe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a minha intenção» ou «o meu propósito».
    reason: lexical_alternative
  - marker: b
    text: «De longe» pode indicar distância espacial ou que Deus discerne o pensamento muito antes de ele ser expresso.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: sabes
  rationale: O qal perfeito, na descrição poética do conhecimento contínuo de Deus, tem valor estativo; o presente em português comunica isso com naturalidade.
- source_word: שִׁבְתִּי
  choice: quando me sento
  rationale: Expressa de modo corrente o ato de sentar-se e preserva o paralelismo com o ato de levantar-se.
- source_word: וְקוּמִי
  choice: quando me levanto
  rationale: Mantém o par poético com «quando me sento», provavelmente um merismo que abrange as atividades comuns da vida.
- source_word: בַּנְתָּה
  choice: discernes
  rationale: בין indica percepção penetrante; «discernes» distingue essa ideia do simples «sabes» e continua claro em português moderno.
- source_word: לְרֵעִי
  choice: o meu pensamento
  rationale: No contexto, o substantivo pode indicar pensamento, intenção ou propósito. «Pensamento» é a opção mais direta, sem excluir os demais matizes.
- source_word: מֵרָחוֹק
  choice: de longe
  rationale: Reproduz concisamente a imagem hebraica e preserva a possibilidade de distância espacial ou de percepção antecipada.
theological_decisions:
- issue: Alcance do conhecimento divino neste versículo
  choice: O texto apresenta Deus como conhecedor tanto dos atos cotidianos do salmista quanto de seu pensamento íntimo, sem definir um modelo filosófico de onisciência.
  alternative: Explicitar que Deus conhece o pensamento antes que ele surja, ou restringir «de longe» exclusivamente à distância espacial.
  rationale: O hebraico afirma conhecimento pessoal e profundo, mas deixa «de longe» semanticamente aberto; a tradução preserva essa tensão em vez de transformá-la numa formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção verbal «quando me sento e quando me levanto» soa natural sem perder o paralelismo hebraico; «discernes» conserva o tom poético e a distinção lexical em relação a «sabes».
