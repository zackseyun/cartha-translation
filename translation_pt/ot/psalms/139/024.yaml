  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: pt
  text: Vê se há em mim algum caminho que causa dor[a] e guia-me pelo caminho eterno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algum caminho nocivo”, “algum caminho ofensivo”; possivelmente, “algum caminho idólatra”.
