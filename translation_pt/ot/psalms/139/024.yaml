    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Vê
  rationale: O imperativo dá continuidade à súplica dirigida a Deus. “Vê” é direto, natural e preserva a imagem do exame divino.
- source_word: אִם
  choice: se há algum
  rationale: Neste contexto, introduz uma pergunta indireta. A formulação portuguesa expressa com naturalidade a ideia de verificar a existência de tal caminho.
- source_word: דֶּרֶךְ עֹצֶב
  choice: algum caminho que causa dor
  rationale: A expressão pode designar um modo de vida doloroso, nocivo ou ofensivo. A formulação mantém a metáfora de “caminho” e a relação lexical de עֹצֶב com dor, sem restringi-la indevidamente à idolatria.
- source_word: בִּי
  choice: em mim
  rationale: Tradução direta da expressão preposicional com sufixo de primeira pessoa, indicando algo presente no íntimo do salmista.
- source_word: וּנְחֵנִי
  choice: e guia-me
  rationale: O verbo נחה significa conduzir ou guiar. “Guia-me” soa natural como petição e combina com a metáfora do caminho.
- source_word: בְּדֶרֶךְ עוֹלָם
  choice: pelo caminho eterno
  rationale: “Pelo caminho” é a construção portuguesa natural para o percurso em que alguém é guiado. “Eterno” preserva o sentido de duração indefinida ou permanente de עוֹלָם, sem eliminar sua possível referência à antiguidade.
theological_decisions:
- issue: Sentido de דֶּרֶךְ עֹצֶב
  choice: algum caminho que causa dor
  alternative: algum caminho nocivo, ofensivo ou idólatra
  rationale: A expressão é semanticamente difícil. O texto principal conserva o amplo sentido de um modo de vida que produz dor ou dano; a nota registra outras possibilidades, inclusive a interpretação idólatra, sem torná-la exclusiva.
- issue: Sentido de דֶּרֶךְ עוֹלָם
  choice: o caminho eterno
  alternative: o caminho antigo ou o caminho de sempre
  rationale: עוֹלָם pode indicar perpetuidade ou antiguidade. “Eterno” comunica a duração permanente e o contraste com o caminho doloroso, enquanto a nota preserva a ambiguidade temporal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A metáfora repetida de “caminho” foi preservada. A colocação pronominal em “guia-me” mantém o tom elevado sem recorrer a linguagem arcaica.
