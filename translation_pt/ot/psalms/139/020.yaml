  text: who speak of you with evil intent[a]; your enemies take your name in vain.
translation:
  language: pt
  text: os que falam de ti com má intenção[a]; teus inimigos usam o teu nome em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles levantam os teus adversários para a falsidade”; ou: “teus adversários te levantam falsamente”. O hebraico da oração final é difícil, e a palavra “nome” está implícita, não expressa no texto.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: os que
  rationale: Introduz uma oração relativa que descreve os perversos mencionados no contexto; “os que” é natural em português e mantém a ligação com o versículo anterior.
- source_word: יֹאמְרֻךָ
  choice: falam de ti
  rationale: O verbo אמר com sufixo de segunda pessoa masculina singular pode significar aqui falar a respeito de Deus, não necessariamente dirigir-lhe a palavra. “Falam de ti” preserva o referente e se ajusta ao contexto hostil.
- source_word: לִמְזִמָּה
  choice: com má intenção
  rationale: מְזִמָּה pode indicar plano, trama ou propósito perverso. A expressão escolhida comunica de modo claro tanto a deliberação quanto a malícia.
- source_word: נָשֻׂא
  choice: usam
  rationale: נשׂא significa literalmente levantar, levar ou tomar. Nesta construção difícil, “usam” expressa em português corrente a ideia provável de empregar indevidamente o nome de Deus, sem reproduzir um decalque pouco natural.
- source_word: לַשָּׁוְא
  choice: em vão
  rationale: שָׁוְא abrange vazio, falsidade e vaidade. “Em vão” preserva a formulação bíblica reconhecível e sugere uso falso ou indevido.
- source_word: עָרֶיךָ
  choice: teus inimigos
  rationale: Embora a forma consonantal também possa ser lida de outra maneira, o paralelismo e o contexto favorecem o sentido de adversários de Deus. “Teus inimigos” é claro e corresponde à leitura contextual comum.
theological_decisions:
- issue: Objeto e sentido da oração final
  choice: teus inimigos usam o teu nome em vão
  alternative: 'teus adversários te levantam para a falsidade; ou: eles levantam para a falsidade os teus adversários'
  rationale: A sintaxe hebraica é difícil, e “nome” não aparece expressamente. A tradução principal entende נשׂא + שׁוא como uma expressão de uso irreverente ou falso ligado ao falar sobre Deus, em harmonia com o contexto dos que se opõem a ele. A nota explicita a complementação interpretativa e conserva leituras alternativas.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa (“ti”, “teu”) adequadas ao discurso poético dirigido a Deus. A tradução evita um decalque rígido de נשׂא, mas mantém em nota a incerteza sintática e lexical do hebraico.
