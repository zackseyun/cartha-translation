  text: אֶשָּׂ֥א כַנְפֵי שָׁ֑חַר אֶ֝שְׁכְּנָ֗ה בְּ/אַחֲרִ֥ית יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/009.yaml
  text: If I take up the wings of the dawn[a], if I dwell in the farthest part of the sea,
translation:
  language: pt
  text: Se eu tomar as asas da alvorada[a] e habitar nos confins do mar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o ocidente mais remoto”; na geografia poética hebraica, “mar” pode ter sentido de oeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: tomar
  rationale: O verbo נשׂא pode significar “levantar”, “carregar” ou, neste contexto poético, “tomar”. A escolha mantém a ideia de assumir as asas para deslocar-se, sem tornar a expressão artificial.
- source_word: כַנְפֵי
  choice: as asas de
  rationale: כָּנָף significa primariamente “asa” e também pode indicar “extremidade”. Com “alvorada”, “asas” preserva a metáfora poética.
- source_word: שָׁחַר
  choice: a alvorada
  rationale: שַׁחַר designa o amanhecer. “Alvorada” é clara, digna e combina naturalmente com a imagem das asas.
- source_word: אֶשְׁכְּנָה
  choice: habitar
  rationale: שכן expressa habitar, residir ou estabelecer-se. “Habitar” preserva o aspecto duradouro e o registro poético.
- source_word: בְּאַחֲרִית
  choice: nos confins de
  rationale: אַחֲרִית pode indicar o fim ou a extremidade mais distante. “Nos confins” comunica de modo natural o sentido espacial remoto.
- source_word: יָם
  choice: o mar
  rationale: יָם significa literalmente “mar”, embora possa adquirir sentido ocidental na geografia poética hebraica. O texto principal conserva a imagem concreta; a possível nuance direcional aparece em nota.
