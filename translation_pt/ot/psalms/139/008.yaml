  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: pt
  text: Se eu subir aos céus, lá estás; se fizer minha cama no Sheol[a], eis que estás ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o mundo dos mortos”. O termo hebraico “Sheol” refere-se ao domínio ou lugar dos mortos, não necessariamente ao “inferno” no sentido posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a construção condicional e hipotética dos dois membros paralelos, sem transformá-la em afirmação temporal.
- source_word: אֶסַּק
  choice: subir
  rationale: Expressa de modo natural o movimento ascendente e mantém o contraste vertical com o Sheol.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural é natural em português bíblico e corresponde à forma hebraica, evocando a região mais elevada em contraste com o Sheol.
- source_word: שָׁם אָתָּה
  choice: lá estás
  rationale: Mantém o advérbio locativo e a referência direta a Deus com concisão poética.
- source_word: וְאַצִּיעָה
  choice: se fizer a minha cama
  rationale: Conserva a imagem concreta de estender ou preparar um leito, em vez de reduzi-la ao sentido interpretativo de simplesmente deitar-se.
- source_word: שְּׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem importar automaticamente o sentido posterior de inferno como lugar de castigo final.
- source_word: הִנֶּךָּ
  choice: eis-te ali
  rationale: Reproduz a força enfática e de reconhecimento de הִנֵּה com o sufixo de segunda pessoa, ao mesmo tempo que retoma naturalmente a localização expressa no primeiro membro.
theological_decisions:
- issue: Tradução de שְּׁאוֹל na afirmação poética sobre a presença de Deus nas profundezas
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos; inferno
  rationale: O termo hebraico não designa necessariamente o lugar escatológico de punição final. Mantê-lo transliterado preserva a amplitude do conceito e a afirmação de que nem mesmo o domínio da morte está fora da presença de Deus.
translation_notes:
  register: Português atual, digno e poético, com sintaxe clara para leitores brasileiros e de outras regiões lusófonas. “Eis-te ali” preserva a ênfase do hebraico sem acrescentar uma explicação teológica ao verso.
