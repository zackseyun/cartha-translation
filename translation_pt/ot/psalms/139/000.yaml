base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: pt
  text: Ao regente[a]. De Davi[b]. Salmo. Yahweh, tu me sondaste e me conheceste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Para o regente»; a preposição hebraica pode indicar direção ou dedicação nos cabeçalhos dos salmos.
    reason: lexical_alternative
  - marker: b
    text: Ou «Por Davi»; «De Davi» preserva a ambiguidade do hebraico quanto a autoria, dedicação ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Expressa de modo natural a função indicada pelo particípio hebraico no cabeçalho, preservando na nota a possível nuance de direção ou dedicação.
- source_word: חֲקַרְתַּנִי
  choice: tu me sondaste
  rationale: O verbo חקר comunica investigação profunda; «sondar» preserva essa força e é corrente em português.
- source_word: וַתֵּדָע
  choice: e me conheceste
  rationale: Mantém o paralelismo verbal e o aspecto concluído dos dois verbos hebraicos, sem reduzir o sentido a mera obtenção de informação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome pessoal divino do texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Relação de לְדָוִד com Davi
  choice: De Davi
  alternative: Por Davi / Para Davi
  rationale: «De Davi» conserva a ambiguidade do cabeçalho hebraico quanto a autoria, dedicação ou associação, sem impor uma conclusão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular foi mantida na oração dirigida a Yahweh. Os marcadores foram ligados às expressões que suas notas efetivamente explicam.
