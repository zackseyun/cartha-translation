  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: pt
  text: Eu os odeio com ódio absoluto[a]; eles se tornaram meus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com ódio total” ou “com ódio perfeito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית
  choice: completo
  rationale: O substantivo denota fim, totalidade ou grau máximo. Na construção com שִׂנְאָה, intensifica o ódio; “completo” preserva essa força em português atual.
- source_word: שִׂנְאָה
  choice: ódio
  rationale: O substantivo forma com תַּכְלִית a expressão enfática “ódio completo”, preservando a repetição da raiz hebraica de odiar.
- source_word: שְׂנֵאתִים
  choice: Eu os odeio
  rationale: O perfeito qal com sufixo de terceira pessoa masculina plural expressa aqui uma postura vigente; o presente é natural em português e mantém a força direta do hebraico.
- source_word: לְאוֹיְבִים
  choice: inimigos
  rationale: Com היה e a preposição ל, indica estado ou condição resultante; “tornaram-se meus inimigos” comunica esse valor de modo idiomático.
- source_word: הָיוּ לִי
  choice: tornaram-se meus inimigos
  rationale: A construção היה + ל pode indicar que alguém veio a estar em determinada relação com outro. A formulação mantém a nuance resultativa sem excluir a condição presente.
theological_decisions:
- issue: Força da denúncia do salmista
  choice: Manter a linguagem explícita e intensa de ódio pessoal.
  alternative: “Eu me oponho totalmente a eles” ou “considero-os inimigos”.
  rationale: O hebraico emprega duas vezes palavras da raiz “odiar”. Suavizá-las apagaria a tensão e a força teológica do texto; a tradução não deve substituir essa linguagem por uma interpretação menos contundente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “odeio/ódio” é intencional e reproduz a ênfase do hebraico. “Meus inimigos” expressa naturalmente לִי, literalmente “inimigos para mim”.
