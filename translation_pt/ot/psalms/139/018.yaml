  text: אֶ֭סְפְּרֵ/ם מֵ/ח֣וֹל יִרְבּ֑וּ/ן הֱ֝קִיצֹ֗תִי וְ/עוֹדִ֥/י עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: pt
  text: Se eu os contasse[a], seriam mais numerosos que a areia. Quando desperto[b], ainda estou contigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda que eu os contasse, seriam mais numerosos que a areia”. O hebraico é conciso e permite pequenas variações na construção da condição e da comparação.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “Despertei, e ainda estou contigo”. O hebraico não especifica de modo inequívoco se o despertar é habitual, passado imediato ou figurado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: Se eu os contasse
  rationale: O Qal imperfeito de ספר com sufixo de terceira pessoa masculina plural significa literalmente “eu os conto”. No contexto, funciona naturalmente como uma condição hipotética, expressa em português pelo imperfeito do subjuntivo.
- source_word: מֵחוֹל יִרְבּוּן
  choice: seriam mais numerosos que a areia
  rationale: חול significa “areia”, e o מ comparativo indica superioridade numérica; רבה comunica serem muitos ou excederem em número. A formulação preserva a comparação e soa natural em português.
- source_word: הֱקִיצֹתִי
  choice: Quando desperto
  rationale: O verbo indica despertar, mas o hebraico poético não determina inequivocamente se a ação é habitual, passada imediata ou figurada. O presente conserva essa abertura no texto principal.
- source_word: וְעוֹדִי עִמָּךְ
  choice: ainda estou contigo
  rationale: עוד com o sufixo de primeira pessoa expressa continuidade, e עם significa “com”. “Ainda estou contigo” reproduz de modo claro e conciso a permanência junto de Deus.
theological_decisions:
- issue: Referente de “os”
  choice: Manter o pronome, que retoma mais naturalmente os pensamentos de Deus mencionados no versículo anterior.
  alternative: Explicitar “teus pensamentos” ou entender o pronome de forma mais ampla como obras ou propósitos de Deus.
  rationale: O antecedente imediato favorece os pensamentos de Deus, mas repetir o substantivo no texto resolveria mais do que o hebraico expressa neste versículo.
- issue: Sentido da oração final
  choice: Apresentar o salmista ainda com Deus ao despertar.
  alternative: Entender o despertar como o fim do sono após a meditação ou, de modo figurado, como despertar além da morte.
  rationale: O texto afirma a continuidade da presença junto de Deus, mas não torna explícita uma referência à ressurreição; por isso, essa leitura não deve ser introduzida na tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Contigo” preserva o tom poético e reverente sem soar excessivamente arcaico; “mais numerosos que a areia” mantém a imagem coletiva do hebraico.
