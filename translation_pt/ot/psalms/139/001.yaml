  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: pt
  text: 'Ao regente[a]. De Davi[b]. Salmo.


    Yahweh, tu me sondaste e me conheceste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Para o regente”; a preposição hebraica pode indicar direção ou dedicação nos títulos dos salmos.
    reason: lexical_alternative
  - marker: b
    text: Ou “Por Davi”; “De Davi” preserva a possível ambiguidade entre autoria, dedicação e associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Em títulos de salmos, o termo designa o responsável pela execução musical. “Ao regente” é conciso e preserva o valor direcional ou dedicatório da preposição לְ.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A construção pode indicar autoria, dedicação ou associação. “De Davi” mantém essa amplitude melhor do que a formulação mais específica “Por Davi”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente corrente e claro para uma composição poético-musical, possivelmente acompanhada por instrumentos de cordas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֲקַרְתַּנִי
  choice: tu me sondaste
  rationale: “Sondar” comunica o exame profundo expresso pelo verbo חקר e conserva a forma verbal concluída do hebraico.
- source_word: וַתֵּדָע
  choice: e me conheceste
  rationale: Traduz diretamente ידע e mantém a sequência verbal passada do texto hebraico, sem convertê-la silenciosamente em uma afirmação no presente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; “Yahweh” o preserva em transliteração, enquanto “SENHOR” o substituiria por um título.
- issue: Alcance da expressão לְדָוִד no título
  choice: De Davi
  alternative: Por Davi
  rationale: “De Davi” evita decidir se o cabeçalho declara autoria, dedicação ou associação davídica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais na segunda pessoa do singular por se tratar de discurso direto a Deus. O cabeçalho foi mantido breve e segmentado, como no hebraico.
