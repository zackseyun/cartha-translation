  text: לֹא נִכְחַ֥ד עָצְמִ֗/י מִ֫מֶּ֥/ךָּ אֲשֶׁר עֻשֵּׂ֥יתִי בַ/סֵּ֑תֶר רֻ֝קַּ֗מְתִּי בְּֽ/תַחְתִּיּ֥וֹת אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/015.yaml
  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: pt
  text: Minha estrutura não estava oculta de ti quando fui feito em segredo,[b] tecido nas profundezas da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas partes mais baixas da terra”. A expressão hebraica é uma metáfora poética de formação oculta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando fui tecido nas profundezas da terra”.'
    reason: previous_rendering
lexical_decisions:
- source_word: נִכְחַד
  choice: não estava oculta
  rationale: Preserva o sentido passivo de algo que não foi escondido nem encoberto, com formulação natural em português.
- source_word: עָצְמִי
  choice: minha estrutura
  rationale: Neste contexto poético, o termo vai além do sentido anatômico estrito de “osso” e designa a constituição corporal do salmista.
- source_word: מִמֶּךָּ
  choice: de ti
  rationale: Com o verbo de ocultação, a preposição hebraica corresponde naturalmente a “de ti” em português.
- source_word: אֲשֶׁר
  choice: quando
  rationale: A partícula relativa introduz aqui a circunstância temporal da formação do salmista.
- source_word: עֻשֵּׂיתִי
  choice: fui feito
  rationale: Reproduz o passivo amplo de עשה sem antecipar a metáfora têxtil do verbo seguinte.
- source_word: בַסֵּתֶר
  choice: em segredo
  rationale: Expressa a formação oculta e mantém o paralelismo poético com “nas profundezas da terra”.
- source_word: רֻקַּמְתִּי
  choice: tecido
  rationale: Conserva de modo acessível a imagem de tecelagem ou bordado minucioso evocada pelo verbo hebraico.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: nas profundezas da terra
  rationale: Mantém a forte imagem poética hebraica sem transformá-la numa explicação literalista; a alternativa mais formal aparece em nota.
theological_decisions:
- issue: Sentido de “as profundezas da terra”
  choice: Preservar a expressão como metáfora poética ligada à formação oculta e misteriosa do salmista
  alternative: Entender a frase como referência cosmológica ou subterrânea literal
  rationale: No contexto da afirmação sobre o conhecimento total de Deus, a expressão está em paralelo com “em segredo”. A tradução conserva a imagem e sua tensão sem impor uma explicação doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “De ti” preserva o tom poético e a referência singular a Deus; “minha estrutura” evita restringir עָצְמִי a ossos literais.
