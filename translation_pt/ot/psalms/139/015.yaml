  source_fidelity: 'O texto transmite com precisão o paralelismo hebraico: a estrutura corporal do salmista não estava escondida de Deus, enquanto ele era feito em segredo e tecido nas profundezas da terra. “Minha estrutura” é uma solução apropriada para עָצְמִי no contexto poético, sem restringi-lo indevidamente a ossos literais. A imagem de “tecido” preserva a força de רֻקַּמְתִּי, e “nas profundezas da terra” mantém a metáfora sem a explicar no corpo do versículo.'
