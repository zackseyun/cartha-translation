  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: pt
  text: Nem mesmo as trevas são escuras para ti; a noite brilha como o dia; para ti, as trevas e a luz são iguais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como as trevas, assim a luz”, isto é, ambas são iguais para Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Nem mesmo
  rationale: 'Expressa de modo natural em português a força enfática e concessiva: até as trevas falham diante de Deus.'
- source_word: חֹשֶׁךְ
  choice: as trevas
  rationale: É a equivalência corrente e digna para o substantivo, preservando o contraste poético com a luz.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: não são escuras para ti
  rationale: Embora o verbo hebraico tenha forma causativa, esta formulação idiomática conserva a relação das trevas com Deus sem introduzir explicitamente a ideia interpretativa de ocultação.
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: a noite brilha como o dia
  rationale: Reproduz com clareza a comparação e o sentido de אור no hifil, 'brilhar/dar luz'.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: para ti, as trevas e a luz são iguais
  rationale: Torna natural em português a construção comparativa condensada do hebraico e explicita apenas a relação já indicada pelo contexto.
theological_decisions:
- issue: Se a primeira oração deve explicitar que as trevas não podem ocultar nada de Deus
  choice: 'Manter a imagem: “as trevas não são escuras para ti”'
  alternative: “as trevas nada escondem de ti”
  rationale: A alternativa comunica uma implicação legítima, mas resolve a metáfora em uma afirmação direta sobre a percepção divina; o texto preserva a imagem hebraica.
- issue: Sentido da oração comparativa final
  choice: “para ti, as trevas e a luz são iguais”
  alternative: “como são as trevas, assim é a luz”
  rationale: A sintaxe hebraica é concisa e pode ser representada literalmente pela alternativa; a redação escolhida comunica sua equivalência perante Deus sem acrescentar uma distinção doutrinária.
translation_notes:
  register: Português moderno, poético e amplamente inteligível, com uso de “ti” para manter o tom direto e solene do salmo. A pontuação preserva as três unidades paralelas do verso.
