id: PSA.101.2
reference: Psalms 101:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: pt
  text: Darei atenção ao caminho íntegro — quando virás a mim? Andarei com coração íntegro dentro da minha casa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “quando virás a mim?”. O sujeito não é expresso; muitos entendem que estas palavras são dirigidas a Deus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Considerarei o caminho da integridade” ou “Agirei com sabedoria no caminho íntegro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Darei atenção
  rationale: O hifil de שׂכל pode expressar agir com prudência ou prestar cuidadosa atenção. Aqui, a formulação comunica dedicação deliberada a uma conduta íntegra sem reduzir o verbo a mera reflexão intelectual.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: ao caminho íntegro
  rationale: דֶּרֶךְ conserva a metáfora ética do caminho, enquanto תָּמִים indica inteireza e irrepreensibilidade moral, não perfeição absoluta.
- source_word: מָתַי תָּבוֹא אֵלַי
  choice: quando virás a mim?
  rationale: O verbo está na segunda pessoa masculina singular, mas o sujeito não é expresso. A tradução direta preserva essa característica sem inserir explicitamente 'Deus'.
- source_word: אֶתְהַלֵּךְ
  choice: Andarei
  rationale: O hitpael de הלך pode indicar a maneira de viver. 'Andarei' mantém a metáfora ética bíblica e é compreensível em português atual.
- source_word: בְּתָם לְבָבִי
  choice: com coração íntegro
  rationale: תֹּם denota integridade, inteireza ou inocência; ligado a 'coração', aponta para sinceridade moral interior. A expressão escolhida é natural e concisa.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: dentro da minha casa
  rationale: בְּקֶרֶב tem o sentido de 'no interior de' ou 'no meio de'. Aqui, a tradução comunica naturalmente tanto o espaço doméstico quanto a esfera da vida privada.
theological_decisions:
- issue: Sujeito implícito de “quando virás a mim?”
  choice: Manter a segunda pessoa sem explicitar o sujeito no texto principal.
  alternative: Identificar o sujeito como Deus ou relacionar a oração, de modo mais impessoal, ao caminho íntegro.
  rationale: Embora muitos entendam a frase como dirigida a Deus, o hebraico não nomeia o sujeito. A tradução conserva a interpelação direta e evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a metáfora bíblica do caminho e a ambiguidade do sujeito implícito; o futuro em 'virás' dá à interpelação um tom elevado sem arcaísmo excessivo.
