  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: pt
  text: Não porei diante dos meus olhos coisa alguma perversa[a]. Odeio a prática dos que se desviam[b]; isso não se apegará a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coisa alguma vil”, “coisa alguma indigna” ou “coisa alguma de Belial”. Aqui, o hebraico בְּלִיָּעַל provavelmente indica perversidade ou indignidade moral, e não um nome próprio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as obras dos que se afastam”, “a prática dos apóstatas” ou “os atos dos perversos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: porei
  rationale: O imperfeito qal na primeira pessoa singular de שׂים expressa aqui uma decisão ou compromisso. “Porei” é natural e mantém o sentido de colocar algo intencionalmente diante de si.
- source_word: לְנֶגֶד עֵינַי
  choice: diante dos meus olhos
  rationale: Preserva a imagem concreta do hebraico e comunica tanto exposição visual quanto atenção deliberada.
- source_word: דְּבַר בְּלִיָּעַל
  choice: coisa alguma indigna
  rationale: דָּבָר pode designar coisa, assunto ou ação; בְּלִיָּעַל indica aqui, com maior probabilidade, algo sem valor moral, vil ou perverso, não um nome próprio. “Indigna” comunica a reprovação moral sem introduzir a figura posterior de Belial.
- source_word: עֲשֹׂה סֵטִים
  choice: o que fazem os que se desviam
  rationale: A expressão combina a ideia de fazer/praticar com um termo para os que se desviam. Esta formulação é corrente em português e conserva a imagem moral do afastamento.
- source_word: שָׂנֵאתִי
  choice: odeio
  rationale: Embora a forma hebraica seja perfeita, no contexto expressa uma postura firme e contínua; o presente português transmite bem esse valor.
- source_word: לֹא יִדְבַּק בִּי
  choice: isso não se apegará a mim
  rationale: דבק significa aderir, apegar-se ou ficar ligado. “Apegar-se” preserva a metáfora de uma prática corrupta que procura vincular-se ao falante; “isso” retoma de modo deliberadamente amplo a conduta mencionada.
theological_decisions:
- issue: Sentido de בְּלִיָּעַל
  choice: termo comum de reprovação moral (“indigna”)
  alternative: nome próprio (“Belial”) ou formulações como “vil” e “perversa”
  rationale: Neste contexto, a construção דְּבַר בְּלִיָּעַל aponta mais naturalmente para algo moralmente indigno ou perverso. Não há necessidade textual de personificar o termo como Belial.
- issue: Referente de לֹא יִדְבַּק בִּי
  choice: “isso”, retomando de forma ampla a ação ou conduta condenada
  alternative: “ela”, referindo-se especificamente à obra/prática, ou “eles”, mediante outra análise do referente
  rationale: O sujeito implícito do verbo admite alguma incerteza contextual. “Isso” mantém a referência abrangente e evita especificar além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção “diante dos meus olhos” conserva o paralelismo e a imagem hebraica; “coisa alguma indigna” evita linguagem arcaica e não reduz בְּלִיָּעַל à mera inutilidade. Os marcadores [a] e [b] aparecem no texto principal.
