  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: pt
  text: De Davi[a]. Salmo. Cantarei o amor leal e a justiça; a ti, ó Yahweh, cantarei louvores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “para Davi” ou como indicação de associação a Davi; o cabeçalho não determina sozinho se se trata de autoria, dedicação ou pertencimento.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ no cabeçalho pode indicar autoria, dedicação ou associação. A forma tradicional e natural «De Davi» mantém essa amplitude melhor que «Por Davi».
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Equivalente consagrado e claro para o termo técnico de um cântico musical.
- source_word: חֶסֶד
  choice: amor leal
  rationale: חֶסֶד reúne amor, fidelidade, misericórdia e compromisso relacional; «amor leal» exprime de modo corrente seu caráter duradouro sem restringi-lo apenas à misericórdia.
- source_word: וּמִשְׁפָּט
  choice: e a justiça
  rationale: מִשְׁפָּט pode significar justiça, juízo ou decisão judicial. Nesta associação com חֶסֶד e no contexto ético do salmo, «justiça» é o equivalente mais natural.
- source_word: אָשִׁירָה
  choice: Cantarei
  rationale: O coortativo expressa intenção ou resolução; o futuro português comunica isso de modo natural.
- source_word: לְךָ
  choice: a ti
  rationale: Indica o destinatário do louvor e preserva a ênfase causada pela posição da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֲזַמֵּרָה
  choice: cantarei louvores
  rationale: זמר designa cantar ou fazer música em louvor. A expressão distingue o verbo de אָשִׁירָה sem sugerir obrigatoriamente acompanhamento instrumental.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
- issue: Amplitude semântica de חֶסֶד e מִשְׁפָּט
  choice: amor leal e justiça
  alternative: misericórdia e juízo
  rationale: A opção principal comunica o sentido relacional e ético amplo dos termos; a alternativa mais estreita é preservada em nota, sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética concisa. «Ó» marca naturalmente o vocativo; «cantarei louvores» mantém o paralelismo sem repetir exatamente o primeiro verbo.
