  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: pt
  text: Quem calunia às escondidas o seu próximo, eu o destruirei; quem tem olhos arrogantes e coração orgulhoso[a], não o tolerarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “elevado de olhos e largo de coração”, expressão hebraica que descreve um olhar arrogante e uma disposição interior orgulhosa.
    reason: cultural_note
lexical_decisions:
- source_word: מלושני בַסֵּתֶר
  choice: Quem calunia às escondidas
  rationale: O particípio substantivado da raiz לשׁן descreve quem difama maliciosamente; בַסֵּתֶר indica que isso é feito de modo oculto. A formulação é natural em português e mantém a força genérica do singular.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ designa uma pessoa próxima no âmbito social, não necessariamente um amigo íntimo. “Próximo” é amplo e consagrado no registro bíblico sem ser obscuro.
- source_word: אַצְמִית
  choice: eu o destruirei
  rationale: O hifil de צמת expressa fazer perecer ou destruir. “Destruirei” conserva a severidade da declaração sem especificar um mecanismo de punição que o hebraico não explicita.
- source_word: גְּבַהּ עֵינַיִם
  choice: olhos arrogantes
  rationale: Literalmente, “elevado de olhos”; a imagem hebraica descreve arrogância manifesta no olhar e na atitude. “Olhos arrogantes” preserva tanto a imagem quanto seu sentido moral.
- source_word: וּרְחַב לֵבָב
  choice: coração orgulhoso
  rationale: Literalmente, “largo de coração”; neste contexto, a expressão indica soberba ou presunção, e não generosidade. “Coração orgulhoso” comunica claramente a disposição interior.
- source_word: לֹא אוּכָל
  choice: não o tolerarei
  rationale: A expressão significa literalmente “não posso”, com a ideia implícita de suportar ou admitir essa pessoa. O futuro em português harmoniza-se com a declaração de propósito do verso e expressa a recusa moral sem sugerir mera incapacidade física.
theological_decisions:
- issue: Alcance do juízo na declaração régia e ética
  choice: O falante declara que eliminará o caluniador e não admitirá a pessoa arrogante, preservando a linguagem forte sem definir o procedimento concreto.
  alternative: Entender “destruirei” especificamente como execução literal, ou reduzir toda a declaração a uma hipérbole sobre evitar convivência.
  rationale: אַצְמִית é severo, mas o verso não informa o mecanismo da punição; לֹא אוּכָל expressa intolerância ou recusa. A tradução mantém essa tensão sem ampliar nem atenuar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Às escondidas” comunica naturalmente o caráter secreto da calúnia; “próximo” mantém a amplitude relacional do hebraico. A estrutura paralela e a primeira pessoa régia foram preservadas.
