  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: pt
  text: 'De Davi.[a] Salmo.


    Cantarei o amor leal e a justiça;

    a ti, Yahweh,[b] cantarei louvores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “De Davi” também pode indicar dedicação ou associação com Davi, não necessariamente autoria.
    reason: alternative_reading
  - marker: b
    text: Yahweh representa o nome divino escrito em hebraico com as quatro consoantes YHWH, tradicionalmente traduzido como “SENHOR”.
    reason: divine_name
lexical_decisions:
- source_word: חֶסֶד (ḥésed)
  choice: amor leal
  rationale: Expressa de modo natural o amor fiel e comprometido indicado pelo termo hebraico, sem reduzi-lo apenas a “misericórdia”.
- source_word: מִשְׁפָּט (mishpát)
  choice: justiça
  rationale: Neste contexto, o termo aponta para o que é justo e para a prática da justiça; “julgamento” seria possível, mas estreitaria o sentido.
- source_word: אֲזַמֵּרָה (’azammerah)
  choice: cantarei louvores
  rationale: O verbo denota cantar ou fazer música em louvor; esta formulação preserva o sentido cultual e soa natural em português.
- source_word: יהוה (YHWH)
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da expressão לְדָוִד na inscrição
  choice: De Davi
  alternative: Para Davi / referente a Davi
  rationale: A tradução formal preserva a concisão e a ambiguidade da construção hebraica, que pode indicar autoria, dedicação ou associação.
- issue: Amplitude semântica de חֶסֶד וּמִשְׁפָּט
  choice: amor leal e justiça
  alternative: misericórdia e julgamento
  rationale: A escolha conserva as dimensões relacional, pactual e ética dos termos sem impor uma leitura teológica mais estreita.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Amor leal” comunica o alcance de ḥésed de modo acessível; “Yahweh” mantém o nome próprio do texto-fonte.
