  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: pt
  text: Um coração perverso se afastará de mim; não conhecerei o mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não terei nada a ver com o mal”. O hebraico diz literalmente: “não conhecerei o mal”.'
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: לֵבָב
  choice: coração
  rationale: No uso antropológico hebraico, designa a pessoa interior, incluindo pensamento e vontade. “Coração” é natural em português e preserva a ênfase moral.
- source_word: עִקֵּשׁ
  choice: perverso
  rationale: O adjetivo indica desvio ou torção moral. “Perverso” expressa claramente esse sentido em português atual, embora torne menos explícita a metáfora espacial de algo torto.
- source_word: יָסוּר מִמֶּנִּי
  choice: se afastará de mim
  rationale: סור com מִן indica afastamento ou separação. A forma reflexiva é idiomática em português e permanece próxima do hebraico.
- source_word: רָע
  choice: o mal
  rationale: O termo tem sentido moral amplo; “o mal” conserva sua generalidade sem especificá-lo como ato, pessoa ou perversidade.
- source_word: לֹא אֵדָע
  choice: não conhecerei
  rationale: Mantém o verbo concreto “conhecer” e sua ambiguidade entre conhecimento, reconhecimento e envolvimento relacional ou prático.
theological_decisions:
- issue: Sentido de “conhecer” em relação ao mal
  choice: Conservar no texto a expressão literal e ambígua “não conhecerei o mal”.
  alternative: Traduzir explicitamente “não terei nada a ver com o mal”.
  rationale: No contexto ético do salmo, a frase provavelmente expressa recusa de associação ou participação no mal. A tradução literal, acompanhada de nota, preserva a força e a tensão do idioma hebraico sem reduzir o sentido a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Coração perverso” é corrente e moralmente preciso; “não conhecerei” preserva deliberadamente o caráter literário e a ambiguidade do original.
