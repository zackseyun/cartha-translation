  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: pt
  text: Meus olhos estão sobre os fiéis da terra, para que habitem comigo[a]; quem anda por um caminho íntegro[b], esse me servirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se assentem comigo”. O verbo hebraico pode significar “sentar-se” ou “habitar”; aqui provavelmente sugere convivência contínua na presença do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “num caminho irrepreensível”. A expressão se refere à integridade e retidão da conduta, não à ausência absoluta de pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Meus olhos estarão sobre
  rationale: Preserva a imagem concreta do hebraico e comunica atenção favorável. O valor futuro combina com o caráter programático do salmo, sem eliminar a concisão do original.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: os fiéis da terra
  rationale: נֶאֱמָן designa pessoas fiéis ou dignas de confiança; אֶרֶץ, neste contexto régio, refere-se naturalmente ao território ou país.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: para que habitem comigo
  rationale: ישׁב pode significar sentar-se ou habitar. Aqui, a formulação expressa associação contínua na presença do rei, enquanto a nota preserva a alternativa mais literal.
- source_word: הֹלֵךְ
  choice: quem anda
  rationale: O particípio descreve uma conduta habitual. 'Quem anda' é natural em português e mantém a metáfora bíblica do modo de viver.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: em caminho íntegro
  rationale: דֶּרֶךְ funciona como metáfora da conduta, e תָּמִים indica inteireza moral ou irrepreensibilidade, não ausência absoluta de pecado.
- source_word: הוּא
  choice: esse
  rationale: O pronome hebraico é enfático; 'esse' destaca que justamente a pessoa assim caracterizada está apta a servir.
- source_word: יְשָׁרְתֵנִי
  choice: me servirá
  rationale: שׁרת denota serviço pessoal, muitas vezes no âmbito oficial ou cortesão. 'Me servirá' é amplo, natural e não introduz conotação eclesiástica.
theological_decisions:
- issue: Qualificação moral dos associados do rei
  choice: O texto apresenta o olhar favorável do salmista para os fiéis e declara apto a servi-lo quem vive com integridade.
  alternative: A passagem pode ser entendida mais especificamente como seleção de oficiais da corte, ou mais amplamente como escolha de companheiros próximos.
  rationale: O hebraico comporta tanto convivência próxima quanto serviço oficial. A tradução mantém ambas as dimensões sem restringir o sentido a uma só.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem poética e as imagens hebraicas foram mantidas quando naturais; as notas registram alternativas lexicais relevantes.
