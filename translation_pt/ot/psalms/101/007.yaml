  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: pt
  text: Quem pratica o engano não habitará dentro da minha casa; quem profere mentiras não permanecerá diante dos meus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficará firme diante dos meus olhos” ou “não será estabelecido diante dos meus olhos”. O verbo hebraico pode significar ser estabelecido, ficar firme ou permanecer; neste contexto, indica que tal pessoa não continuará na presença do salmista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: habitará
  rationale: No contexto de בְּקֶרֶב בֵּיתִי, o verbo ישׁב indica habitar ou permanecer como membro admitido da casa, e não apenas sentar-se.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: dentro da minha casa
  rationale: Expressa de modo natural o sentido de estar no interior ou no âmbito da casa do salmista, preservando a primeira pessoa.
- source_word: עֹשֵׂה רְמִיָּה
  choice: quem pratica o engano
  rationale: O particípio com רְמִיָּה descreve conduta habitual caracterizada pelo engano; “pratica” conserva esse aspecto sem reduzir a expressão a um simples rótulo.
- source_word: דֹּבֵר שְׁקָרִים
  choice: quem profere mentiras
  rationale: Mantém a construção verbal habitual e o plural שְׁקָרִים, além do paralelismo com a primeira oração.
- source_word: יִכּוֹן
  choice: permanecerá
  rationale: O nifal de כון pode significar ser estabelecido, ficar firme ou permanecer. Aqui, diante dos olhos do rei, “permanecerá” comunica naturalmente que a pessoa não será mantida em sua presença, sem eliminar a alternativa lexical.
- source_word: לְנֶגֶד עֵינַי
  choice: diante dos meus olhos
  rationale: Preserva a imagem hebraica literal e o sentido pessoal e avaliativo de estar na presença do salmista.
theological_decisions:
- issue: Alcance da exclusão declarada pelo salmista
  choice: Compromisso pessoal e régio sobre quem pode habitar em sua casa e permanecer em sua presença
  alternative: Declaração geral sobre a casa de Deus ou metáfora sobre pureza interior
  rationale: As expressões “minha casa” e “meus olhos” são mantidas como referências em primeira pessoa no contexto do compromisso do rei com a ordem justa, sem espiritualização ou ampliação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre os dois particípios hebraicos foi preservado por meio de “quem pratica” e “quem profere”. Foi acrescentada apenas uma nota, no ponto de ambiguidade lexical genuína de יִכּוֹן.
