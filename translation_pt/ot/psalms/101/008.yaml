base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: pt
  text: Manhã após manhã, destruirei todos os perversos da terra[a], eliminando da cidade de Yahweh[b] todos os que praticam a maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os perversos do mundo”. O hebraico אֶרֶץ pode significar “terra”, “território”, “país” ou, em sentido amplo, “mundo”; aqui, o contexto régio favorece a terra governada pelo rei.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome divino tradicionalmente representado por “SENHOR”. Outras formas incluem “Javé” e “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Manhã após manhã
  rationale: O plural com preposição tem sentido distributivo e indica uma ação repetida a cada manhã. A expressão portuguesa preserva essa força iterativa.
- source_word: אַצְמִית
  choice: destruirei
  rationale: O hifil de צמת comunica aqui fazer perecer ou destruir, em contexto régio e judicial. “Destruirei” preserva diretamente a gravidade do verbo.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: todos os perversos da terra
  rationale: רִשְׁעֵי é um adjetivo substantivado no plural, “os perversos”. אֶרֶץ pode designar a terra, um território ou um país; o contexto régio favorece o domínio governado pelo rei, sem eliminar a ambiguidade lexical.
- source_word: לְהַכְרִית
  choice: eliminando
  rationale: O infinitivo hifil expressa o propósito ou resultado da ação anterior. “Eliminando” é natural em português e mantém a ideia judicial de remover por completo.
- source_word: מֵעִיר יְהוָה
  choice: da cidade de Yahweh
  rationale: A formulação conserva a relação expressa no hebraico entre a cidade e o nome divino, bem como o tom solene da frase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: todos os que praticam a maldade
  rationale: A expressão reproduz em português corrente a ideia literal de pessoas que fazem ou praticam אָוֶן, termo que pode indicar maldade, perversidade ou injustiça.
theological_decisions:
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: país; mundo
  rationale: O cenário régio e a referência à cidade de Yahweh apontam para o território sob o governo do rei. “Terra” mantém em português parte da amplitude do termo hebraico, e a nota registra a leitura mais abrangente.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não o título אֲדֹנָי. A transliteração conserva essa distinção, enquanto a nota informa a tradição de substituição e outras formas conhecidas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Manhã após manhã” conserva o aspecto iterativo; “todos os que praticam a maldade” evita o arcaísmo de “obreiros da iniquidade” sem enfraquecer seu sentido moral.
