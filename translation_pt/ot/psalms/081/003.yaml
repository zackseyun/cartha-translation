source:
  edition: WLC
  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: pt
  text: Toquem a trombeta na lua nova, na lua cheia[a], no dia da nossa festa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na lua encoberta” ou “no tempo determinado”. O sentido do termo hebraico כֵּסֶה é discutido; adota-se “lua cheia” porque se ajusta ao paralelo calendárico com “lua nova” e ao contexto da festa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Toquem
  rationale: O qal imperativo plural de תקע, tendo שׁוֹפָר como objeto, ordena que se toque ou soe o instrumento. “Toquem” preserva a força imperativa e é natural em português.
- source_word: בַחֹדֶשׁ
  choice: na lua nova
  rationale: חֹדֶשׁ pode significar “mês” ou “lua nova”. No contexto litúrgico e calendárico, em paralelo com כֵּסֶה, “lua nova” é o sentido mais adequado.
- source_word: שׁוֹפָר
  choice: trombeta
  rationale: שׁוֹפָר designa o instrumento de chifre usado para sinais e cerimônias. “Trombeta” é claro e corrente; evita uma transliteração desnecessária, embora não explicite o material do instrumento.
- source_word: בַּכֵּסֶה
  choice: na lua cheia
  rationale: כֵּסֶה é lexicalmente discutido. “Lua cheia” forma um paralelo calendárico coerente com “lua nova” e se ajusta ao contexto da festa, sem ocultar as alternativas, registradas em nota.
- source_word: לְיוֹם
  choice: no dia da
  rationale: Neste contexto, לְ com יוֹם expressa a relação temporal com o dia festivo. “No dia da” é a formulação portuguesa mais natural.
- source_word: חַגֵּנוּ
  choice: nossa festa
  rationale: חַג designa uma festa religiosa, frequentemente de peregrinação. “Nossa festa” conserva de modo conciso o caráter celebrativo e comunitário.
theological_decisions:
- issue: Sentido de בַּכֵּסֶה na referência ao calendário festivo
  choice: na lua cheia
  alternative: na lua encoberta; no tempo determinado
  rationale: A questão é sobretudo lexical e contextual. Em paralelo com “lua nova” e ligada ao dia da festa, “lua cheia” oferece a leitura calendárica mais provável. Como o termo hebraico é raro e discutido, as outras leituras permanecem explícitas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “Toquem” representa diretamente o imperativo hebraico dirigido à comunidade. A ordem poética e o paralelismo temporal foram preservados.
