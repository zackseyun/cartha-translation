  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: pt
  text: Cantem com alegria a Deus, nossa força; aclamem o Deus de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deem um brado ao Deus de Jacó”. O verbo pode indicar uma aclamação forte ou um brado semelhante ao toque de trombeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Cantem com alegria
  rationale: O imperativo plural de רנן expressa louvor vocal jubiloso. A formulação preserva tanto a dimensão musical quanto a alegria e soa natural em português atual.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição ל indica o destinatário do louvor; neste contexto, אֱלֹהִים se refere inequivocamente ao Deus de Israel.
- source_word: עוּזֵּנוּ
  choice: nossa força
  rationale: Tradução direta de עֹז/עוֹז, que denota força ou poder, sem acrescentar a ideia mais interpretativa de refúgio.
- source_word: הָרִיעוּ
  choice: aclamem
  rationale: O imperativo hifil de רוע/ריע descreve uma manifestação vocal forte e pública, muitas vezes jubilosa. “Aclamem” comunica isso de modo natural e digno.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: o Deus de Jacó
  rationale: A construção ligada a יַעֲקֹב identifica o destinatário como o Deus de Jacó; em português, o artigo definido produz a expressão idiomática natural.
theological_decisions:
- issue: Sentido de אֱלֹהִים nas duas linhas paralelas
  choice: Deus / o Deus de Jacó
  alternative: deuses
  rationale: Embora אֱלֹהִים tenha forma plural, a referência é singular neste salmo da aliança, como confirma o paralelo “Deus de Jacó”.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Cantem com alegria” mantém o caráter musical e jubiloso; “aclamem” evita uma formulação excessivamente coloquial e preserva a intensidade pública do segundo verbo.
