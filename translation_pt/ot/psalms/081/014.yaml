source:
  edition: WLC
  text: כִּ֭/מְעַט אוֹיְבֵי/הֶ֣ם אַכְנִ֑יעַ וְ/עַ֥ל צָ֝רֵי/הֶ֗ם אָשִׁ֥יב יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: pt
  text: Em pouco tempo[a], eu subjugaria os seus inimigos e voltaria a minha mão contra os seus adversários.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Logo eu subjugaria os seus inimigos”. O hebraico כִּמְעַט pode indicar um breve intervalo de tempo ou proximidade temporal; menos provavelmente aqui, pode significar “quase”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “voltaria a minha mão sobre os seus adversários”, expressão que retrata Deus dirigindo contra eles o seu poder em juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Em pouco tempo
  rationale: Neste contexto, a expressão indica proximidade temporal ou um intervalo breve. A tradução preserva essa nuance sem adotar o sentido menos provável de “quase”.
- source_word: אוֹיְבֵיהֶם
  choice: os seus inimigos
  rationale: Equivalente claro e corrente para אויב no contexto de oposição hostil.
- source_word: אַכְנִיעַ
  choice: eu subjugaria
  rationale: O hifil de כנע expressa fazer alguém se sujeitar, ser humilhado ou derrotado. “Subjugaria” comunica a derrota dos inimigos sem especificar indevidamente o meio.
- source_word: צָרֵיהֶם
  choice: os seus adversários
  rationale: Mantém a ideia de oposição hostil e preserva, em português, a variação lexical em relação a “inimigos”.
- source_word: אָשִׁיב יָדִי
  choice: voltaria a minha mão contra
  rationale: Preserva a metáfora hebraica de voltar ou fazer retornar a mão, aqui dirigida em ação hostil e julgadora contra os adversários.
theological_decisions:
- issue: Modalidade da ação divina no contexto
  choice: eu subjugaria ... voltaria
  alternative: eu subjugarei ... voltarei
  rationale: Embora os imperfeitos hebraicos possam ter valor futuro, o contexto anterior apresenta aquilo que Deus faria em favor de Israel caso o povo lhe desse ouvidos. O condicional preserva essa força contingente sem transformá-la em promessa incondicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo entre “inimigos” e “adversários” foi mantido, assim como a metáfora da mão divina. O artigo antes dos possessivos favorece a naturalidade ampla sem regionalismo marcado.
