  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: pt
  text: 'Ao regente: conforme a Gitite[a]. De Asafe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Gitite. O termo provavelmente indica um arranjo musical, um instrumento ou o nome de uma melodia, mas seu sentido exato é incerto; talvez se refira a um instrumento associado a Gate ou a uma melodia específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, a forma com ל aponta para quem supervisiona a execução musical. “Ao regente” é conciso, natural e não restringe indevidamente a função à direção de um coro.
- source_word: עַל
  choice: conforme
  rationale: Neste contexto musical, עַל provavelmente introduz uma designação de melodia, instrumento ou arranjo; “conforme” comunica essa relação sem impor uma identificação específica.
- source_word: הַגִּתִּית
  choice: a Gitite
  rationale: O referente exato é incerto. A transliteração preserva o termo técnico hebraico, evitando decidir entre instrumento, melodia ou associação com Gate.
- source_word: לְאָסָף
  choice: De Asafe
  rationale: A preposição ל com o nome pode indicar autoria, pertença, associação ou coleção. “De Asafe” mantém essa amplitude melhor do que “por Asafe” ou “para Asafe”.
theological_decisions: []
translation_notes:
  register: Título breve em português moderno, claro e digno. A formulação conserva a incerteza dos termos musicais e da relação do salmo com Asafe.
