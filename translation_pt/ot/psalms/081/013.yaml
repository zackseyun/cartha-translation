  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: pt
  text: Ah, se o meu povo me escutasse, se Israel andasse nos meus caminhos![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem dera o meu povo me escutasse, e Israel andasse nos meus caminhos!”'
    reason: Registra uma forma portuguesa alternativa de exprimir com clareza a força optativa de לוּ.
lexical_decisions:
- source_word: לוּ
  choice: Ah, se
  rationale: Introduz aqui um desejo intenso e pesaroso. “Ah, se” comunica em português tanto a força optativa quanto a possível forma condicional da expressão.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva diretamente a relação possessiva e pactual expressa pelo sufixo de primeira pessoa.
- source_word: שֹׁמֵעַ לִי
  choice: me escutasse
  rationale: O verbo com לִי implica dar ouvidos e atender, não apenas perceber um som. “Escutasse” é natural e permite essa dimensão de obediência.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a forma tradicional do nome próprio em português.
- source_word: בִּדְרָכַי
  choice: nos meus caminhos
  rationale: Conserva a metáfora hebraica dos caminhos como modo de viver e agir.
- source_word: יְהַלֵּכוּ
  choice: andasse
  rationale: Mantém a metáfora de caminhar como conduta contínua e concorda naturalmente com o desejo introduzido por “Ah, se”.
theological_decisions:
- issue: Desejo optativo ou condição
  choice: 'O versículo é apresentado como lamento e desejo divino: “Ah, se...”.'
  alternative: “Se o meu povo me escutasse, se Israel andasse nos meus caminhos...”
  rationale: No contexto, לוּ expressa sobretudo um desejo pesaroso diante da desobediência de Israel. A formulação escolhida preserva essa força emocional sem eliminar por completo a nuance formalmente condicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ah, se” conserva a emoção do lamento; “me escutasse” e “andasse nos meus caminhos” mantêm o paralelismo e a metáfora do hebraico.
