base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/012.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
translation:
  language: pt
  text: Então, entreguei-o à obstinação do coração deles[a]; eles seguiram os seus próprios planos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz um pronome no singular em “entreguei-o”, referindo-se a Israel como povo coletivo; em seguida, passa ao plural: “deles; eles”. Também se pode traduzir “à dureza” ou “à vontade obstinada do coração deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles andaram segundo os seus próprios conselhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: Por isso, entreguei-o
  rationale: O hifil de שלח com sufixo masculino singular exprime aqui deixar ou abandonar alguém às consequências de sua atitude. “Entreguei-o” preserva tanto o sentido judicial no contexto quanto o singular coletivo referente a Israel.
- source_word: בִּשְׁרִירוּת לִבָּם
  choice: à obstinação do coração deles
  rationale: שְׁרִירוּת indica obstinação, dureza ou vontade própria persistente. O singular “coração” com possuidor plural reproduz de modo compreensível a expressão coletiva hebraica.
- source_word: יֵלְכוּ
  choice: eles seguiram
  rationale: Embora הלך signifique literalmente “andar”, neste contexto comportamental “seguiram” comunica naturalmente a ideia de conduzir-se segundo determinados planos.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: os seus próprios planos
  rationale: מוֹעֵצָה pode designar conselho, propósito ou plano. “Seus próprios planos” é claro em português moderno e ressalta o contraste implícito com a orientação de Deus.
theological_decisions:
- issue: Alternância entre o singular coletivo e o plural na referência a Israel
  choice: Manter “entreguei-o” e depois usar “deles/eles”
  alternative: 'Harmonizar toda a referência no plural: “entreguei-os... deles; eles”'
  rationale: O hebraico traz um sufixo masculino singular na primeira oração e passa ao plural. A tradução conserva essa alternância genuína, tratando Israel primeiro como unidade coletiva e depois como pluralidade, sem corrigi-la silenciosamente.
- issue: Caráter judicial da ação divina
  choice: “entreguei-o à obstinação”
  alternative: “deixei-o seguir a obstinação” ou “mandei-o embora”
  rationale: No contexto, Deus abandona Israel às consequências de sua própria resistência. “Entreguei-o” mantém essa força sem acrescentar uma formulação doutrinária alheia ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se no texto a mudança hebraica do singular coletivo para o plural; as alternativas lexicais relevantes são registradas em notas.
