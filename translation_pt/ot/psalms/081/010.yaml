  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: pt
  text: Eu sou Yahweh, seu Deus, que o fez subir da terra do Egito. Abra bem a boca, e eu a encherei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abra bem a boca, para que eu a encha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי יְהוָה אֱלֹהֶיךָ
  choice: Eu sou Yahweh, seu Deus
  rationale: A oração nominal hebraica requer a cópula em português; o pronome independente אָנֹכִי mantém sua força identificadora. O nome divino é transliterado como Yahweh, e o sufixo de segunda pessoa masculina singular é expresso por “seu”.
- source_word: הַמַּעַלְךָ
  choice: que o fez subir
  rationale: O particípio hifil de עלה apresenta Yahweh como aquele que fez Israel subir do Egito. “Fez subir” preserva mais diretamente a forma causativa e o conhecido motivo do êxodo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: A preposição מִן indica a origem ou saída; “da terra do Egito” é natural em português e conserva a fórmula do êxodo.
- source_word: הַרְחֶב פִּיךָ
  choice: Abra bem a boca
  rationale: O imperativo hifil de רחב, com “boca”, é expresso idiomaticamente por “abra bem”. A ordem continua dirigida ao interlocutor singular.
- source_word: וַאֲמַלְאֵהוּ
  choice: e eu a encherei
  rationale: O sufixo masculino hebraico retoma פֶּה, mas em português o pronome é feminino por concordar com “boca”. O futuro apresenta naturalmente a promessa ou consequência da ordem, sem eliminar a possível nuance volitiva.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
- issue: Nuance de וַאֲמַלְאֵהוּ após o imperativo
  choice: e eu a encherei
  alternative: para que eu a encha
  rationale: A coordenação pode ser entendida como promessa ou resultado ligado ao imperativo. O futuro conserva bem a promessa divina, enquanto a nota registra a leitura final/volitiva possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantém-se o tratamento singular por “seu/o”, evitando formas excessivamente regionais. A construção “fez subir” conserva a imagem hebraica do êxodo.
