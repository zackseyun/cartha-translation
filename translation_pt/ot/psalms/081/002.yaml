  source_fidelity: 'A tradução mantém adequadamente os três imperativos/convites poéticos do hebraico: levantar/entoar uma canção, fazer soar o תֹף e apresentar a כִּנּוֹר com o נָבֶל. “Entoem” comunica bem o uso musical idiomático de שְׂאוּ, e “façam soar” é uma representação fiel e natural de וּתְנוּ em relação ao instrumento de percussão. A qualificação de נָעִים aplicada à lira e a relação de acompanhamento expressa por עִם foram preservadas.'
