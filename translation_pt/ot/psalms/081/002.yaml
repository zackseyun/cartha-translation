source:
  edition: WLC
  text: שְֽׂאוּ זִ֭מְרָה וּ/תְנוּ תֹ֑ף כִּנּ֖וֹר נָעִ֣ים עִם נָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/002.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: pt
  text: Entoem uma canção[a] e façam soar o tamborim[b], a agradável lira, junto com a harpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Elevem uma melodia” ou “Comecem uma canção”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico תֹף designa um instrumento de percussão, provavelmente um tambor de moldura; tradicionalmente, “adufe”.
    reason: cultural_note
  - marker: c
    text: Não se sabe ao certo a diferença exata entre os instrumentos de cordas hebraicos traduzidos por “lira” (כִּנּוֹר) e “harpa” (נָבֶל); também se propõem equivalentes como “harpa” e “alaúde”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Entoem
  rationale: O imperativo plural de נשׂא, com זִמְרָה, convida a iniciar ou elevar o canto. “Entoem” expressa essa ideia de modo natural em português.
- source_word: זִמְרָה
  choice: uma canção
  rationale: Designa canto ou música, especialmente de louvor. “Canção” é claro e amplo, sem especificar indevidamente um salmo formal.
- source_word: וּתְנוּ
  choice: façam soar
  rationale: Embora o verbo signifique literalmente “deem”, com um instrumento de percussão indica produzir seu som. “Façam soar” preserva a construção sem definir de modo excessivo a técnica de execução.
- source_word: תֹף
  choice: tamborim
  rationale: Refere-se a um instrumento de percussão do tipo tambor de moldura. “Tamborim” é uma equivalência moderna compreensível, embora o instrumento antigo não corresponda necessariamente em todos os detalhes ao moderno.
- source_word: כִּנּוֹר
  choice: lira
  rationale: Provavelmente indica um instrumento antigo de cordas semelhante à lira, distinto do נָבֶל.
- source_word: נָעִים
  choice: agradável
  rationale: O adjetivo significa agradável ou deleitoso e aqui qualifica naturalmente a lira, possivelmente também com a nuance de som agradável.
- source_word: עִם
  choice: junto com
  rationale: Expressa acompanhamento ou associação entre os instrumentos.
- source_word: נָבֶל
  choice: harpa
  rationale: Designa um instrumento de cordas distinto do כִּנּוֹר. “Harpa” oferece uma diferenciação tradicional e natural, com a incerteza organológica registrada em nota.
