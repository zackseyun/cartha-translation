  text: שְׁמַ֣ע עַ֭מִּ/י וְ/אָעִ֣ידָה בָּ֑/ךְ יִ֝שְׂרָאֵ֗ל אִם תִּֽשְׁמַֽע לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/008.yaml
  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: pt
  text: Escute, meu povo, e testemunharei contra você[a]; ó Israel, se você me escutasse![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o advertirei solenemente”; ou: “e darei testemunho a você”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase hebraica também pode ser expressa mais explicitamente como um desejo: “Ah, se você me escutasse!”'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Escute
  rationale: Imperativo singular de שׁמע. “Escute” é natural no português atual e introduz a convocação direta, permitindo ecoar a mesma raiz no fim do verso.
- source_word: עַמִּי
  choice: meu povo
  rationale: Preserva a forma relacional e pactual do tratamento, de modo natural em português.
- source_word: וְאָעִידָה בָּךְ
  choice: e testemunharei contra você
  rationale: O hifil de עוד pode significar testemunhar, advertir solenemente ou dar testemunho. Com בְּ neste contexto de admoestação divina, “contra você” preserva a possível força forense e adversativa sem ocultar as alternativas, registradas em nota.
- source_word: יִשְׂרָאֵל
  choice: ó Israel
  rationale: O nome está em função vocativa; “ó” conserva o tratamento direto e o tom poético.
- source_word: אִם תִּשְׁמַע לִי
  choice: se você me escutasse!
  rationale: אִם pode introduzir aqui uma condição de forma elíptica ou uma exclamação de desejo. O imperfeito “escutasse” transmite em português o apelo desejoso e mantém a forma condicional, enquanto “me escutasse” expressa o sentido de dar ouvidos.
theological_decisions:
- issue: Força de אִם תִּשְׁמַע לִי
  choice: se você me escutasse!
  alternative: Ah, se você me escutasse!; se você me ouvir
  rationale: A formulação principal conserva a partícula condicional e, ao mesmo tempo, comunica o tom de desejo ou apelo sugerido pelo contexto. A nota explicita a leitura optativa sem transformar uma possibilidade interpretativa em certeza.
- issue: Sentido de וְאָעִידָה בָּךְ
  choice: testemunharei contra você
  alternative: advertirei você solenemente; darei testemunho a você
  rationale: A construção admite matiz judicial ou de advertência. O texto principal mantém a leitura adversativa plausível de בָּךְ, e a nota preserva a amplitude lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O tratamento por “você” evita a mistura de paradigmas verbais e pronominais; a repetição de “escute/escutasse” reproduz o eco da raiz hebraica שׁמע.
