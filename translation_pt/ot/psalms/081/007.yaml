base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: pt
  text: Na angústia, você clamou, e eu o livrei; eu lhe respondi no esconderijo do trovão[a]; eu o pus à prova junto às águas de Meribá[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “no lugar secreto do trovão” ou “a partir do esconderijo do trovão”. A imagem hebraica provavelmente evoca a presença oculta de Deus na tempestade.
    reason: lexical_alternative
  - marker: b
    text: Meribá recorda o episódio no deserto em que Deus pôs Israel à prova e Israel discutiu por causa da falta de água (Êx 17.1–7; Nm 20.1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: Na angústia
  rationale: צָרָה indica angústia, aflição ou adversidade. “Na angústia” é conciso, natural e mantém a força circunstancial da expressão hebraica.
- source_word: קָרָאתָ
  choice: você clamou
  rationale: Neste contexto, קרא descreve um chamado por socorro. “Clamou” torna essa força explícita sem acrescentar um objeto ausente no hebraico.
- source_word: וָאֲחַלְּצֶךָּ
  choice: e eu o livrei
  rationale: No hifil, חלץ pode significar retirar, libertar ou resgatar. “Livrei” é corrente no registro bíblico moderno e adequado ao contexto do êxodo e do deserto.
- source_word: אֶעֶנְךָ
  choice: eu lhe respondi
  rationale: ענה tem aqui o sentido comum de responder. A formulação reproduz diretamente a fala divina e mantém o destinatário singular.
- source_word: בְּסֵתֶר רַעַם
  choice: no esconderijo do trovão
  rationale: סֵתֶר designa esconderijo, abrigo ou lugar secreto. A tradução preserva a imagem incomum da presença divina encoberta na tempestade e representa בְּ por “em”, sem decidir se a resposta veio de dentro desse lugar.
- source_word: אֶבְחָנְךָ
  choice: eu o pus à prova
  rationale: בחן significa testar, examinar ou comprovar. “Pus à prova” é idiomático em português e conserva o caráter probatório sem defini-lo como exclusivamente punitivo.
- source_word: עַל מֵי מְרִיבָה
  choice: junto às águas de Meribá
  rationale: עַל admite valor locativo neste contexto. “Junto às águas” é natural em português, enquanto “Meribá” preserva o nome próprio e a alusão ao episódio do deserto.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo litúrgico é incerta, ele é transliterado segundo o uso português, em vez de receber uma tradução conjectural.
theological_decisions:
- issue: Natureza da fala divina e das alusões ao deserto
  choice: O versículo é apresentado como fala direta de Deus, recordando o clamor, o livramento, a resposta ligada ao trovão e a prova em Meribá, sem ampliar as alusões além do texto.
  alternative: Entender “esconderijo do trovão” como referência exclusiva ao Sinai ou interpretar a prova como exclusivamente punitiva.
  rationale: 'A primeira pessoa divina é inequívoca, mas o referente histórico exato da imagem do trovão permanece aberto: ela pode evocar o Sinai, uma teofania em tempestade ou, de modo mais geral, a presença oculta de Deus. A redação mantém essa tensão.'
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “você” para o destinatário singular coletivo e formas oblíquas correntes (“o”, “lhe”), preservando o paralelismo da fala divina e a imagem poética incomum do hebraico.
