  text: וַֽ֭/יַּאֲכִילֵ/הוּ מֵ/חֵ֣לֶב חִטָּ֑ה וּ֝/מִ/צּ֗וּר דְּבַ֣שׁ אַשְׂבִּיעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/016.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: pt
  text: Mas ele o alimentaria com o melhor do trigo[a][b], e eu te satisfaria com mel da rocha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com a gordura do trigo”; o idiomatismo hebraico indica o trigo mais rico ou de melhor qualidade.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico muda de pessoa: “ele o alimentaria ... eu te satisfaria”. Os pronomes no singular provavelmente se referem a Israel como povo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: ele o alimentaria
  rationale: O hifil de אכל significa “fazer comer, alimentar”. O condicional expressa a provisão que ocorreria no contexto da condição não cumprida no versículo anterior, mantendo o sujeito e o objeto na terceira pessoa masculina singular.
- source_word: מֵחֵלֶב חִטָּה
  choice: com o melhor do trigo
  rationale: חֵלֶב significa literalmente “gordura”, mas, aplicado a produtos agrícolas, indica a parte mais rica ou escolhida. “O melhor do trigo” comunica naturalmente esse idiomatismo.
- source_word: וּמִצּוּר
  choice: com mel da rocha
  rationale: צוּר designa uma rocha ou penhasco. A expressão preserva a imagem concreta e surpreendente de abundância proveniente de um lugar árido.
- source_word: דְּבַשׁ
  choice: mel
  rationale: Tradução comum e adequada do substantivo neste contexto poético.
- source_word: אַשְׂבִּיעֶךָ
  choice: eu te satisfaria
  rationale: O hifil de שבע significa “satisfazer, saciar”. Mantêm-se tanto o sujeito explícito na primeira pessoa quanto o destinatário singular na segunda pessoa.
theological_decisions:
- issue: Mudança de pessoa dentro do versículo
  choice: Preservar “ele o alimentaria ... eu te satisfaria”.
  alternative: Uniformizar como “eu te alimentaria ... e te satisfaria”.
  rationale: O texto massorético passa da terceira pessoa com objeto na terceira pessoa para a primeira pessoa dirigindo-se à segunda pessoa. A tradução conserva essa tensão poética sem harmonizá-la; os pronomes singulares provavelmente se referem a Israel como povo.
- issue: Imagens de abundância
  choice: Manter concretamente “o melhor do trigo” e “mel da rocha”.
  alternative: Interpretar a rocha como referência metafórica explícita a Deus.
  rationale: O texto apresenta imagens poéticas da provisão divina, mas não exige que sua possível significação teológica seja explicitada na tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o condicional do contexto, a imagem poética concreta e a mudança incomum de pessoa do hebraico.
