base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: pt
  text: 'Ele o estabeleceu como testemunho em José[b], quando ele saiu pela terra do Egito[a]. Ouvi uma língua que eu não conhecia[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra a terra do Egito”. A preposição hebraica pode ter sentido espacial ou indicar ação dirigida contra o Egito.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “José” provavelmente representa o povo de Israel no contexto do êxodo; também pode aludir de modo mais específico às tribos ligadas a José.
    reason: cross_reference
  - marker: c
    text: 'Ou: “Ouço uma língua que eu não conhecia”. Em linguagem poética, o verbo hebraico pode ser entendido no presente ou no passado.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: testemunho
  rationale: Preserva o sentido básico de testemunho ou atestação, sem excluir a possível nuance de ordenança no contexto litúrgico e legal.
- source_word: בִּיהוֹסֵף
  choice: em José
  rationale: Mantém tanto a preposição hebraica quanto o nome explícito, evitando substituir a referência metonímica por uma interpretação como “Israel”.
- source_word: שָׂמוֹ
  choice: ele o estabeleceu
  rationale: O verbo significa pôr, colocar ou instituir; “estabeleceu” expressa naturalmente a instituição do testemunho e o pronome retoma o elemento do contexto anterior.
- source_word: בְּצֵאתוֹ
  choice: quando ele saiu
  rationale: Reproduz o valor temporal do infinitivo e conserva a ambiguidade do referente do sufixo masculino singular.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sobre a terra do Egito
  rationale: “Sobre” mantém o valor espacial amplo de עַל sem decidir se a ação foi simplesmente realizada por toda a terra ou dirigida contra ela.
- source_word: שְׂפַת
  choice: uma língua
  rationale: Embora o sentido literal seja “lábio”, o uso idiomático denota idioma ou fala; “língua” conserva essa associação de modo natural em português.
- source_word: לֹא יָדַעְתִּי
  choice: que eu não conhecia
  rationale: Expressa a falta de conhecimento anterior em português corrente, sem a rigidez de “não tinha conhecido”.
- source_word: אֶשְׁמָע
  choice: ouvi
  rationale: O imperfeito hebraico pode funcionar poeticamente em uma narração passada; “ouvi” se ajusta à recordação do contexto, embora o presente continue possível.
theological_decisions:
- issue: Referente de “José”
  choice: Manter “José” como nome representativo do povo da aliança no texto principal.
  alternative: Interpretar diretamente como “Israel” ou restringir a referência às tribos do norte/Efraim.
  rationale: O hebraico nomeia José; preservar o nome evita resolver no texto uma metonímia cuja extensão exata permanece discutível.
- issue: Referente de “ele” em “quando ele saiu”
  choice: Conservar o pronome masculino sem identificar seu referente.
  alternative: Explicitar Deus, José ou Israel como aquele que saiu.
  rationale: A forma hebraica permite mais de uma ligação contextual; explicitar o sujeito eliminaria uma ambiguidade genuína.
- issue: Mudança de voz na segunda oração
  choice: Manter a primeira pessoa sem acrescentar identificação do falante.
  alternative: Identificar expressamente Deus ou o salmista como falante.
  rationale: A mudança poética para a primeira pessoa deve permanecer perceptível sem uma harmonização interpretativa inserida na tradução.
- issue: Valor temporal de אֶשְׁמָע
  choice: 'Traduzir no passado: “Ouvi”.'
  alternative: 'Traduzir no presente: “Ouço”.'
  rationale: O passado oferece uma leitura coerente com a rememoração do êxodo, mas a morfologia poética também admite compreensão presente, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva as ambiguidades do hebraico quanto ao referente de “ele”, ao alcance de “José”, ao valor de עַל e ao tempo de אֶשְׁמָע. Todos os marcadores de nota aparecem junto ao trecho pertinente.
