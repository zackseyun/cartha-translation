  yaml_path: translation/ot/psalms/081/009.yaml
  text: There shall not be in you any foreign god[a], and you shall not bow down to a foreign god.
translation:
  language: pt
  text: Não haja entre vocês nenhum deus estrangeiro[a], nem se curvem diante de um deus estranho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “deus estranho”. O hebraico emprega em paralelo duas expressões de sentido próximo: “deus estrangeiro” e “deus estranho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: Não haja
  rationale: O jussivo português exprime com naturalidade a força proibitiva de לֹא com היה neste contexto de aliança.
- source_word: בְּךָ
  choice: entre vocês
  rationale: Embora a forma hebraica seja literalmente singular, “em/contigo”, Israel é interpelado coletivamente; “entre vocês” comunica a presença no meio da comunidade sem individualizar o sentido.
- source_word: אֵל זָר
  choice: deus estrangeiro
  rationale: “Deus” identifica uma divindade, e “estrangeiro” expressa aquilo que é alheio à aliança.
- source_word: תִשְׁתַּחֲוֶה
  choice: se curvem diante de
  rationale: Preserva tanto o gesto corporal de prostração quanto sua função cultual, sem reduzi-lo ao termo mais amplo “adorar”.
- source_word: אֵל נֵכָר
  choice: deus de fora
  rationale: Mantém a variação lexical do paralelismo hebraico entre זָר e נֵכָר, com uma expressão portuguesa natural para uma divindade alheia.
theological_decisions:
- issue: O destinatário é gramaticalmente singular, mas representa Israel coletivamente
  choice: Usar “vocês” e “entre vocês”
  alternative: Usar o singular “você” e a formulação literal “em você”
  rationale: O hebraico dirige-se a Israel como unidade coletiva. O plural explícito evita uma leitura exclusivamente individual e soa natural em português.
- issue: Relação entre os dois qualificativos hebraicos para a divindade alheia
  choice: Preservar a nuance poética com “estrangeiro” e “de fora”
  alternative: Repetir “estrangeiro” nos dois membros
  rationale: זָר e נֵכָר são termos próximos, mas distintos. A variação conserva o paralelismo sem sugerir duas categorias teológicas diferentes.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A coordenação com “nem” apresenta as duas proibições de modo fluente.
