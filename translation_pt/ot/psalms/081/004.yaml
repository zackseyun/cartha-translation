base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: pt
  text: Pois isso é um estatuto para Israel, uma ordenança do Deus de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma ordenança para o Deus de Jacó». A preposição hebraica também pode ser traduzida dessa maneira; o texto principal expressa o provável sentido de origem ou autoridade no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da convocação à celebração nos versos anteriores; “Pois” expressa com naturalidade essa força explicativa.
- source_word: חֹק
  choice: estatuto
  rationale: Designa algo prescrito ou estabelecido por autoridade e preserva o tom jurídico-aliancista do hebraico.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: 'A preposição לְ indica aqui relação ou aplicação: a observância foi prescrita para Israel.'
- source_word: הוּא
  choice: este é
  rationale: O pronome retoma, no contexto, o rito ou mandamento de celebração mencionado anteriormente; a forma masculina “este” também concorda naturalmente com “estatuto” em português.
- source_word: מִשְׁפָּט
  choice: ordenança
  rationale: No paralelismo com חֹק, refere-se a uma determinação autorizada, e não a um ato de julgamento condenatório.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: do Deus de Jacó
  rationale: 'Expressa de modo idiomático a relação de origem ou autoridade: a ordenança procede do Deus de Jacó ou lhe pertence, sem eliminar em nota a possibilidade formal de entender a preposição como “para”.'
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Relação entre os termos jurídicos חֹק e מִשְׁפָּט
  choice: 'Manter termos distintos: “estatuto” e “ordenança”'
  alternative: Traduzir ambos por quase sinônimos, como “lei” e “decreto”, ou condensá-los numa só ideia
  rationale: O hebraico usa dois termos jurídicos relacionados, mas distintos, em paralelismo poético. Preservar ambos mantém a força pactual e litúrgica sem impor uma diferenciação técnica excessiva.
- issue: Valor da preposição לְ em לֵאלֹהֵי יַעֲקֹב
  choice: 'Relação possessiva ou de origem: “do Deus de Jacó”'
  alternative: “para o Deus de Jacó”
  rationale: “Do Deus de Jacó” comunica melhor, no contexto, que a ordenança tem nele sua fonte ou autoridade. A tradução mais formal “para o Deus de Jacó” permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém o paralelismo jurídico do original e usa “Pois” para conectar o verso à convocação precedente.
