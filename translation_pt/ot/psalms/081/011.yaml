base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: pt
  text: 'Mas o meu povo não ouviu a minha voz,[a]

    e Israel não quis obedecer-me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu povo não deu ouvidos à minha voz, e Israel não consentiu em obedecer-me”. O verbo hebraico do segundo membro expressa vontade ou consentimento e também pode ser traduzido por “recusou obedecer-me”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção com a negação contrasta a resposta de Israel com o apelo divino anterior; “Mas” expressa naturalmente esse valor adversativo.
- source_word: שָׁמַע
  choice: ouviu
  rationale: Com “a minha voz”, o verbo denota ouvir com atenção ou dar ouvidos. “Ouviu” preserva a imagem da voz sem antecipar toda a ideia de obediência.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Reproduz diretamente o substantivo com sufixo de primeira pessoa e mantém a linguagem relacional da aliança.
- source_word: לְקוֹלִי
  choice: a minha voz
  rationale: Mantém o sentido concreto e pessoal de קוֹל e forma uma expressão portuguesa natural com “ouvir”.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Preserva a coordenação e o paralelismo entre “o meu povo” e “Israel”.
- source_word: לֹא אָבָה
  choice: não quis
  rationale: אבה exprime vontade ou consentimento. “Não quis” é claro, corrente e preserva a recusa volitiva sem a tornar mais categórica do que o hebraico.
- source_word: לִי
  choice: atender-me
  rationale: Após אבה, o pronome preposicionado é elíptico em português. “Atender-me” comunica consentir com Deus ou dar-lhe ouvidos, preservando a ligação com o primeiro membro sem especificar indevidamente apenas “obedecer”.
theological_decisions:
- issue: Identificação pactual de Israel como povo de Deus
  choice: Manter “o meu povo” e “Israel” em membros paralelos.
  alternative: 'Fundir as expressões: “O meu povo, Israel, não ouviu a minha voz”.'
  rationale: O hebraico apresenta duas designações paralelas; mantê-las conserva a estrutura poética e a ênfase relacional.
- issue: Natureza da resposta de Israel
  choice: Traduzir אבה por “quis”, preservando a dimensão de vontade ou consentimento.
  alternative: Traduzir de modo explicitamente interpretativo por “obedeceu” ou “rejeitou”.
  rationale: A formulação escolhida mantém a tensão lexical entre não ouvir e não estar disposto, sem reduzir ambos os membros à obediência nem intensificar a expressão para rejeição absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em dois versos conserva o paralelismo hebraico; “atender-me” evita uma explicitação excessiva, enquanto a nota registra alternativas legítimas.
