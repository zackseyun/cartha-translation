  terminology: “Yahweh” está consistente com a política indicada. “Os que odeiam” é uma boa representação do particípio substantivado. “Fingiriam submeter-se” comunica a falsa sujeição sem escolher exclusivamente a nuance alternativa de medo ou encolhimento.
