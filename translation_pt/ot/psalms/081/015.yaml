  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: pt
  text: Os que odeiam Yahweh fingiriam submeter-se a ele[a], e o tempo deles seria para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fingiriam obedecer-lhe”, “se acovardariam diante dele” ou “se encolheriam diante dele”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o tempo deles para sempre”. Isso pode se referir ao período que lhes foi determinado, ao destino deles ou ao seu castigo, que duraria indefinidamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: os que odeiam
  rationale: O particípio é usado como substantivo; esta formulação é natural em português e preserva a caracterização contínua do grupo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme a forma hebraica e a prática do projeto.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: se submeteriam a ele fingidamente
  rationale: No piel com ל, כחש pode expressar submissão falsa ou obediência simulada. A tradução explicita a falta de sinceridade sem reduzir o sentido apenas a medo físico.
- source_word: וִיהִי
  choice: duraria
  rationale: A forma verbal na sequência poética é vertida de modo modal e natural, em concordância com a construção condicional do contexto.
- source_word: עִתָּם
  choice: o tempo deles
  rationale: עת significa primariamente tempo ou período. A tradução mantém a expressão temporal e sua ambiguidade, sem defini-la como destino, prosperidade ou castigo.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente e digno para a duração indefinida ou perpétua expressa pelo hebraico.
theological_decisions:
- issue: Sentido da oração final וִיהִי עִתָּם לְעוֹלָם
  choice: o tempo deles duraria para sempre
  alternative: o castigo deles duraria para sempre; a prosperidade deles duraria para sempre
  rationale: O hebraico é breve e ambíguo. Embora o contexto de juízo favoreça uma leitura negativa, o substantivo significa literalmente “tempo”; por isso, o texto principal não introduz uma afirmação doutrinária mais específica do que a fonte.
- issue: Nuance de יְכַחֲשׁוּ לוֹ
  choice: submissão fingida
  alternative: encolher-se ou acovardar-se diante dele
  rationale: A construção pode reunir as ideias de sujeição forçada e falsidade. A redação principal preserva explicitamente a insinceridade, enquanto a nota registra a possível nuance de temor humilhante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a concisão poéticas foram mantidas na medida do possível; as duas ambiguidades centrais do hebraico são preservadas no texto e esclarecidas em notas.
