lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: Tirei
  rationale: O hifil perfeito na primeira pessoa do singular expressa a ação causativa de remover; “tirei” é natural em português e preserva a fala divina.
- source_word: מִסֵּבֶל
  choice: o peso
  rationale: סֵבֶל designa carga ou fardo. “Peso” forma uma expressão portuguesa natural com “do seu ombro” e mantém a imagem do trabalho forçado.
- source_word: שִׁכְמוֹ
  choice: do seu ombro
  rationale: שׁכם significa literalmente “ombro”; mantém-se o singular do hebraico.
- source_word: כַּפָּיו
  choice: suas mãos
  rationale: Embora כף possa significar “palma”, “mãos” é o equivalente idiomático no contexto de trabalho manual.
- source_word: מִדּוּד
  choice: do cesto
  rationale: דּוּד pode indicar um recipiente como panela ou caldeirão, mas “cesto” se ajusta ao paralelismo de trabalho pesado. A incerteza lexical é preservada em nota.
- source_word: תַּעֲבֹרְנָה
  choice: ficaram livres de
  rationale: O qal imperfeito feminino plural de עבר, com “mãos” como sujeito, indica que elas deixaram de lidar com o recipiente. A formulação comunica em português o afastamento da tarefa sem a estranheza de uma tradução mecanicamente literal.
