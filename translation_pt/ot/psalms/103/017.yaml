  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: pt
  text: Mas o amor leal de Yahweh permanece de eternidade a eternidade sobre os que o temem, e a sua justiça alcança os filhos dos filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O termo hebraico pode expressar ambos os sentidos neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Mas o amor leal
  rationale: חֶסֶד expressa amor fiel, leal e comprometido. “Amor leal” é claro em português moderno e preserva a dimensão de fidelidade; “Mas” explicita o contraste com a brevidade da vida humana no versículo anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: de eternidade a eternidade
  rationale: Reproduz o paralelismo hebraico e comunica duração sem limites em ambas as direções, com linguagem poética natural.
- source_word: עַל
  choice: sobre
  rationale: Mantém a imagem do amor de Yahweh repousando sobre aqueles que o temem.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: Preserva o sentido direto de temor reverente sem reduzi-lo a mero respeito.
- source_word: וְצִדְקָתוֹ
  choice: e a sua justiça
  rationale: צְדָקָה pode abranger justiça e retidão. “Justiça” é natural neste contexto e conserva a ideia da ação e do caráter justos de Deus; a alternativa “retidão” é registrada em nota.
- source_word: לִבְנֵי בָנִים
  choice: até os filhos dos filhos
  rationale: Preserva a imagem geracional concreta do hebraico. “Até” comunica naturalmente a extensão dessa justiça às gerações seguintes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome pessoal divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de צִדְקָה neste contexto poético
  choice: justiça
  alternative: retidão
  rationale: O termo hebraico comporta ambos os sentidos. “Justiça” funciona naturalmente em português e mantém a dimensão moral e relacional, enquanto “retidão” permanece uma alternativa legítima indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e a imagem de continuidade entre gerações foram preservadas sem arcaísmos desnecessários.
