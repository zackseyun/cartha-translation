  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: pt
  text: Bendigam Yahweh, todas as suas hostes[a], seus ministros[b], que fazem a sua vontade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus exércitos” ou “seu exército celestial”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus servos” ou “os que o servem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Bendigam
  rationale: O imperativo plural mantém o chamado dirigido aos seres celestiais e preserva o refrão com o verbo 'bendizer' nos versículos 20–22.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כָּל
  choice: todos
  rationale: Expressa diretamente o quantificador que modifica o substantivo masculino plural.
- source_word: צְבָאָיו
  choice: seus exércitos
  rationale: Traduz o sentido básico de צָבָא de modo natural em português e preserva a possibilidade contextual de exércitos celestiais sem explicitá-la no texto principal.
- source_word: מְשָׁרְתָיו
  choice: seus ministros
  rationale: Preserva o sentido de serviço formal e o registro elevado do termo derivado de שׁרת.
- source_word: עֹשֵׂי
  choice: que fazem
  rationale: A oração relativa traduz naturalmente o particípio em aposição aos grupos mencionados.
- source_word: רְצוֹנוֹ
  choice: a sua vontade
  rationale: Expressa de modo idiomático aquilo que Deus quer ou deseja.
theological_decisions:
- issue: Referente de 'seus exércitos' e 'seus ministros'
  choice: A redação sugere seres celestiais pelo contexto, mas não os identifica explicitamente.
  alternative: Entender a expressão de maneira mais ampla, incluindo servos de Deus na terra.
  rationale: O versículo 20 menciona os anjos, favorecendo a referência à corte celestial; contudo, os termos hebraicos permitem formulação mais ampla, que foi preservada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. 'Bendigam' mantém a repetição poética do salmo; 'exércitos' é mais corrente que 'hostes', cuja alternativa consta em nota.
