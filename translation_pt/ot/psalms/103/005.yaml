  text: que satisfaz você com coisas boas[a], de modo que a sua juventude se renova como a da águia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu adorno”. A expressão é difícil; muitos entendem o sentido como “que satisfaz você com coisas boas enquanto você vive”; outra tradição interpretativa traz “que satisfaz a sua boca com coisas boas”.'
    reason: alternative_reading
