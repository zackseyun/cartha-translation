lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: que enche
  rationale: O particípio hifil de שׂבע descreve o SENHOR como aquele que provê plenamente. “Enche” é natural em português e, com “de coisas boas”, comunica satisfação abundante sem o tom excessivamente físico de “sacia”.
- source_word: בַּטּוֹב
  choice: de coisas boas
  rationale: טוֹב funciona substantivamente. O plural idiomático “coisas boas” expressa seu valor coletivo e soa mais natural em português do que “do bem” neste contexto.
- source_word: עֶדְיֵךְ
  choice: a sua vida
  rationale: A forma massorética significa normalmente “seu adorno”, mas a expressão é difícil. “A sua vida” apresenta no texto o sentido contextual provável sem adotar como certa a tradição interpretativa “sua boca”; a nota conserva a dificuldade textual e semântica.
- source_word: תִּתְחַדֵּשׁ
  choice: se renova
  rationale: O hitpael imperfeito de חדש admite nuance reflexiva ou passivo-reflexiva. “Se renova” preserva essa forma e é poético e natural em português.
- source_word: כַּנֶּשֶׁר
  choice: como a da águia
  rationale: נֶשֶׁר designa uma grande ave de rapina tradicionalmente traduzida por “águia”. A construção “como a da águia” deixa claro que a comparação recai sobre a juventude.
- source_word: נְעוּרָיִכִי
  choice: a sua juventude
  rationale: O substantivo abstrato plural com sufixo de segunda pessoa expressa juventude ou vigor juvenil. “A sua juventude” mantém a imagem poética sem reduzi-la apenas a idade cronológica.
