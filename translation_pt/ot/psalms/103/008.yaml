  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: pt
  text: Yahweh é compassivo e bondoso, demora a irar-se e é rico em amor leal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode ser traduzido como “amor fiel” ou “lealdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: compassivo
  rationale: Expressa profunda compaixão e misericórdia em português atual, mantendo-se distinto de חַנּוּן.
- source_word: חַנּוּן
  choice: bondoso
  rationale: Comunica a disposição de conceder favor imerecido em linguagem clara; evita a forma menos corrente «gracioso», que no português brasileiro pode sugerir comicidade ou encanto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֶרֶךְ אַפַּיִם
  choice: demora a irar-se
  rationale: Traduz naturalmente o idioma hebraico que indica que a ira tarda a manifestar-se.
- source_word: רַב
  choice: rico em
  rationale: Expressa abundância de modo natural e digno em português.
- source_word: חָסֶד
  choice: amor leal
  rationale: Preserva conjuntamente as ideias de amor, fidelidade e lealdade relacional próprias do termo, sem restringi-lo apenas a uma formulação técnica de aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino; «Yahweh» procura preservá-lo, sem o substituir por um título.
- issue: Sentido de חָסֶד
  choice: amor leal
  alternative: amor fiel; misericórdia; lealdade à aliança
  rationale: «Amor leal» mantém a tensão entre afeição e fidelidade duradoura, sem reduzir o termo a uma única categoria doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação e o paralelismo do hebraico foram preservados sem literalizar o idioma אֶרֶךְ אַפַּיִם.
