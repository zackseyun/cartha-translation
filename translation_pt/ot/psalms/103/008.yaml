  source_fidelity: 'A tradução representa adequadamente cada elemento do hebraico: רַחוּם como «compassivo», חַנּוּן como «bondoso», o nome divino como «Yahweh», o idiomático אֶרֶךְ אַפַּיִם como «demora a irar-se», e רַב־חָסֶד como «rico em amor leal». A formulação conserva o paralelismo descritivo e não introduz conteúdo interpretativo externo.'
