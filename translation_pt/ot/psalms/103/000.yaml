base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: pt
  text: 'De Davi.


    Bendiga o SENHOR, ó minha alma! Que tudo o que há em mim[a] bendiga o seu santo nome!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todas as minhas partes interiores” ou “todo o meu ser interior”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ no título pode indicar autoria, associação ou dedicação; a formulação tradicional e concisa preserva essa amplitude melhor que uma explicitação.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Bendiga o SENHOR, ó minha alma
  rationale: O imperativo feminino singular se dirige à נֶפֶשׁ do salmista. A construção com vocativo é natural e digna em português.
- source_word: כָל־קְרָבַי
  choice: tudo o que há em mim
  rationale: O hebraico significa literalmente 'todas as minhas partes interiores'; a expressão escolhida comunica naturalmente a totalidade do ser interior, sem restringi-la a órgãos físicos.
- source_word: שֵׁם קָדְשׁוֹ
  choice: seu santo nome
  rationale: Mantém a expressão hebraica e seu sentido de louvor ao próprio Deus tal como revelado e reconhecido por seu nome.
theological_decisions:
- issue: Referente de 'bendiga' na segunda oração
  choice: 'Explicitar novamente o SENHOR por meio da coordenação: ''Que tudo o que há em mim bendiga o seu santo nome'''
  alternative: 'Manter a elipse mais rígida: ''e tudo o que há em mim, o seu santo nome'''
  rationale: O objeto hebraico é 'seu santo nome'; a formulação portuguesa explicita apenas o verbo subentendido e não acrescenta interpretação teológica.
- issue: Sentido do título לְדָוִד
  choice: De Davi
  alternative: Para Davi / A respeito de Davi
  rationale: A tradução conserva a fórmula titular tradicional sem fechar completamente a possível relação semântica indicada pela preposição.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. O tetragrama é representado por SENHOR em versaletes convencionais. A pontuação dá ao autoexortativo hebraico força poética natural.
