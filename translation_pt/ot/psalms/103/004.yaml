lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: que resgata
  rationale: O particípio de גאל expressa a ação de redimir ou recuperar. “Resgata” é natural em português e conserva, neste contexto poético, a ideia de livramento sem restringi-la a uma transação legal.
- source_word: מִשַּׁחַת
  choice: da cova
  rationale: שַׁחַת pode indicar cova, sepultura ou destruição. “Cova” preserva a imagem concreta e deixa aberta sua referência poética à morte ou à ruína.
- source_word: חַיָּיְכִי
  choice: sua vida
  rationale: O substantivo חַיִּים, embora formalmente plural em hebraico, designa aqui a vida da pessoa. O singular é a forma idiomática em português, sem introduzir a noção mais restrita de uma alma imaterial.
- source_word: הַמְעַטְּרֵכִי
  choice: e coroa você
  rationale: עטר significa coroar ou cercar como com uma coroa. A tradução mantém a metáfora de honra e dádiva, enquanto “você” torna explícito e natural o objeto em português.
- source_word: חֶסֶד
  choice: amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso constante. “Amor leal” comunica esses aspectos em linguagem atual sem impor uma formulação doutrinária mais específica.
- source_word: וְרַחֲמִים
  choice: e compaixão
  rationale: רַחֲמִים é morfologicamente plural, mas frequentemente funciona como substantivo abstrato de abundante ternura ou misericórdia. “Compaixão” é a expressão mais natural ao lado de “amor leal”; “misericórdias” permanece como alternativa em nota.
theological_decisions:
- issue: Alcance da imagem de resgate
  choice: Livramento da ruína mortal expresso de modo poético, sem limitá-lo ao socorro físico nem à salvação final.
  alternative: Entender a expressão especificamente como livramento da sepultura, ou exclusivamente como salvação espiritual.
  rationale: A amplitude semântica de שַׁחַת e a linguagem poética permitem mais de uma dimensão. “Da cova”, acompanhada de nota, preserva essa tensão em vez de decidir uma categoria doutrinária não explicitada pelo texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição hebraica do artigo participial é representada por duas ações coordenadas (“resgata” e “coroa”), evitando rigidez desnecessária. O feminino dos sufixos hebraicos decorre do destinatário contextual, “minha alma”, mas não precisa ser marcado nesta linha em português.
