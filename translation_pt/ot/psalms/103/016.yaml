  text: כִּ֤י ר֣וּחַ עָֽבְרָה בּ֣/וֹ וְ/אֵינֶ֑/נּוּ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: pt
  text: pois o vento passa sobre ela[a], e ela desaparece[b]; seu lugar já não a reconhece[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sopro” ou “espírito”; o contexto poético de erva e flor favorece “vento”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e ela não existe” ou “e ela não está”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico personifica o lugar como alguém que “reconhece” aquilo que desapareceu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da comparação anterior entre a brevidade da vida humana e a flor do campo.
- source_word: רוּחַ
  choice: vento
  rationale: No contexto poético de erva e flor, o sentido mais natural é o vento que passa e faz a flor desaparecer; “sopro” e “espírito” continuam sendo possibilidades lexicais.
- source_word: עָבְרָה בּוֹ
  choice: passa sobre ela
  rationale: Reproduz de modo natural a imagem simples de algo que passa sobre a flor; o presente expressa uma verdade geral. O pronome feminino em português concorda com “flor”, o referente imediato do versículo anterior.
- source_word: וְאֵינֶנּוּ
  choice: e ela desaparece
  rationale: A expressão hebraica significa literalmente “e ela não existe/não está”; “desaparece” comunica naturalmente o resultado no contexto.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד
  choice: seu lugar já não a reconhece
  rationale: Mantém a personificação poética hebraica do lugar como capaz de reconhecer a flor que sumiu.
- source_word: מְקוֹמוֹ
  choice: seu lugar
  rationale: Preserva a concisão e a personificação do original, com o possessivo retomando a flor.
