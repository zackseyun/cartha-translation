  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: pt
  text: Ele deu a conhecer a Moisés os seus caminhos, aos filhos de Israel os seus feitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao povo de Israel”.
    reason: Alternativa lexical mais idiomática para a expressão hebraica “filhos de Israel”.
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: revelou
  rationale: O hifil de ידע expressa fazer saber ou dar a conhecer. “Revelou” comunica naturalmente em português a ação causativa de tornar conhecido, sem alterar o objeto da revelação.
- source_word: דְּרָכָיו
  choice: seus caminhos
  rationale: Preserva a metáfora hebraica de דֶּרֶךְ e o conhecido sentido figurado das maneiras de Deus agir.
- source_word: לְמֹשֶׁה
  choice: a Moisés
  rationale: Expressa de modo direto o destinatário a quem os caminhos foram dados a conhecer.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a forma masculina plural do etnônimo hebraico e continua sendo uma expressão bíblica compreensível em português; a alternativa coletiva mais idiomática é indicada em nota.
- source_word: עֲלִילוֹתָיו
  choice: seus feitos
  rationale: עֲלִילוֹת designa ações ou obras realizadas. “Feitos” é natural e não acrescenta explicitamente a qualificação “poderosos”, ausente do substantivo.
theological_decisions:
- issue: Expressão coletiva marcada pelo masculino בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel
  rationale: A tradução principal conserva a forma masculina do hebraico e seu caráter de etnônimo da aliança, sem negar que a expressão se refira coletivamente ao povo inteiro. A nota oferece a formulação coletiva corrente.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo conciso. “Revelou” favorece fluidez e explicita naturalmente o ato de tornar conhecido; “caminhos” conserva a metáfora hebraica.
