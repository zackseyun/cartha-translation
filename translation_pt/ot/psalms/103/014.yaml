  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: pt
  text: Pois ele conhece a nossa formação[a]; lembra-se de que somos pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como fomos formados” ou “nossa constituição”. O termo hebraico se refere ao que foi formado ou moldado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do versículo anterior e preserva de modo natural a força causal do hebraico.
- source_word: הוּא
  choice: ele
  rationale: Mantém o pronome explícito e sua leve ênfase; no contexto, o referente é Deus.
- source_word: יָדַע
  choice: conhece
  rationale: O perfeito hebraico expressa aqui conhecimento estabelecido e contínuo; o presente é natural em português.
- source_word: יִצְרֵנוּ
  choice: como fomos formados
  rationale: Expressa o sentido de algo formado ou moldado e comunica com clareza a constituição humana, sem restringir o termo à estrutura física.
- source_word: זָכוּר
  choice: lembra-se
  rationale: Embora a forma hebraica seja participial/adjetival, no contexto indica a lembrança contínua de Deus e forma um paralelo natural com 'conhece'.
- source_word: כִּי
  choice: de que
  rationale: Introduz em português o conteúdo daquilo de que Deus se lembra.
- source_word: עָפָר
  choice: pó
  rationale: Preserva literalmente a imagem bíblica da criação, mortalidade e fragilidade humanas.
- source_word: אֲנָחְנוּ
  choice: somos
  rationale: Fornece a cópula exigida pelo português para representar fielmente a oração nominal hebraica.
theological_decisions:
- issue: Imagem antropológica da fragilidade humana
  choice: somos pó
  alternative: não passamos de pó
  rationale: A formulação simples preserva a imagem hebraica da condição criada e mortal sem acrescentar uma ênfase depreciativa ausente do texto.
- issue: Amplitude de יִצְרֵנוּ
  choice: como fomos formados
  alternative: nossa estrutura
  rationale: A escolha mantém a referência ao ato ou modo de formar e evita reduzir a ideia apenas à anatomia, preservando a conexão entre constituição criada e fragilidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem paralela das duas orações foi preservada, assim como a imagem concisa do pó.
