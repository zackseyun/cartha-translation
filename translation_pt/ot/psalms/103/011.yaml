  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: pt
  text: Pois, tão alto quanto os céus estão acima da terra, tão poderoso é o seu amor leal[a] para com os que o temem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua misericórdia”, “seu amor constante” ou “sua lealdade à aliança”. O hebraico חֶסֶד expressa amor fiel, constante e leal no contexto de uma relação de aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta o louvor anterior, com fluência natural em português.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל הָאָרֶץ
  choice: assim como os céus estão elevados acima da terra
  rationale: Preserva a comparação de altura, o plural poético de שָׁמַיִם e a relação espacial expressa por עַל.
- source_word: גָּבַר
  choice: é poderoso
  rationale: Mantém mais diretamente a ideia verbal de ser forte ou prevalecer, sem transformar a imagem apenas em uma afirmação genérica de grandeza.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Expressa tanto o afeto quanto a constância e lealdade relacional de חֶסֶד, em linguagem moderna e compreensível.
- source_word: עַל יְרֵאָיו
  choice: para com os que o temem
  rationale: Comunica a orientação do amor divino e conserva o sentido direto de temor reverente sem o suavizar para mera admiração.
theological_decisions:
- issue: Sentido de חֶסֶד no contexto da compaixão e fidelidade do SENHOR
  choice: amor leal
  alternative: misericórdia; amor constante; lealdade à aliança
  rationale: “Amor leal” preserva conjuntamente a dimensão afetiva e a fidelidade duradoura do termo, sem restringi-lo a uma única formulação doutrinária.
- issue: Força de גָּבַר aplicada ao amor divino
  choice: é poderoso
  alternative: é grande; prevalece
  rationale: A tradução conserva a noção hebraica de força predominante, ao mesmo tempo que evita sugerir necessariamente um conflito explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “assim como... assim...” conserva a estrutura comparativa da poesia hebraica; “os céus” mantém o tom elevado do original.
