  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: pt
  text: Quanto ao mortal, seus dias são como a relva; como a flor do campo, assim ele floresce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: mortal
  rationale: O substantivo singular אֱנוֹשׁ designa o ser humano, frequentemente ressaltando sua fragilidade e mortalidade. “Mortal” preserva essa nuance e mantém a figura poética individual sem a expansão de “ser humano mortal”.
- source_word: כֶּחָצִיר
  choice: como a relva
  rationale: O prefixo כְּ marca comparação. “Relva” comunica naturalmente a vegetação rasteira e passageira evocada por חָצִיר no contexto poético.
- source_word: יָמָיו
  choice: seus dias
  rationale: Reproduz diretamente o plural com sufixo de terceira pessoa masculina singular e conserva a expressão hebraica para a duração da vida.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: como a flor do campo
  rationale: צִיץ significa flor ou broto; “flor do campo” preserva a imagem e a construção hebraica sem especificar indevidamente uma espécie silvestre.
- source_word: כֵּן
  choice: assim
  rationale: Mantém explicitamente o valor correlativo de כֵּן, ligando o florescer do mortal à flor do campo.
- source_word: יָצִיץ
  choice: ele floresce
  rationale: O verbo צוץ descreve o brotar ou florescer. “Floresce” conserva a metáfora botânica e é natural em português, inclusive quando aplicada poeticamente à pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com sintaxe digna. “Mortal” torna perceptível a fragilidade inerente a אֱנוֹשׁ; “relva” e “flor do campo” mantêm a unidade da imagem vegetal. A repetição comparativa e o advérbio “assim” preservam o paralelismo hebraico.
