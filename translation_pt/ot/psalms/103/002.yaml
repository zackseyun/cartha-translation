  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: pt
  text: 'Bendiga a Yahweh, ó minha alma,

    e não se esqueça de nenhum de seus benefícios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “de nenhum de seus feitos” ou “de nenhuma de suas retribuições”. O termo hebraico pode referir-se, de modo amplo, ao que alguém recebe de outro, mas aqui o contexto favorece o sentido positivo: “benefícios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Bendiga
  rationale: Imperativo feminino singular de ברך, dirigido à alma do salmista. “Bendiga” preserva o sentido religioso e a ligação lexical tradicional, sem ampliar o termo para o sentido mais geral de “louvar”.
- source_word: נַפְשִׁי
  choice: ó minha alma
  rationale: נפש designa aqui o próprio ser do salmista, ao qual ele se dirige. A construção vocativa conserva o caráter poético e é natural em português bíblico atual.
- source_word: אֶת יְהוָה
  choice: a Yahweh
  rationale: O marcador de objeto direto introduz o nome divino יהוה. A transliteração “Yahweh” preserva explicitamente o nome da aliança.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: e não se esqueça
  rationale: A conjunção seguida da partícula negativa e do verbo na segunda pessoa feminina expressa uma proibição coordenada. A forma reflexiva é idiomática em português.
- source_word: כָּל גְּמוּלָיו
  choice: nenhum de seus benefícios
  rationale: Após uma negação, “nenhum de” expressa naturalmente em português a força abrangente de כָּל. גמול pode indicar trato, retribuição ou benefício; o contexto de ações graciosas enumeradas nos versos seguintes favorece “benefícios”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio, sem substituí-lo por um título, e evita a forma híbrida tradicional “Jeová”.
- issue: Amplitude de גְּמוּלָיו
  choice: seus benefícios
  alternative: seus tratos; suas retribuições; tudo o que ele fez por você
  rationale: O termo admite uma amplitude maior do que “benefícios”, mas o contexto imediato de gratidão favorece o sentido positivo. A nota preserva a ambiguidade lexical sem impor ao verso uma leitura transacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O paralelismo poético foi mantido em duas linhas. “Ó minha alma” preserva o vocativo solene sem tornar a frase arcaica; “não se esqueça de nenhum” soa mais natural em português do que uma reprodução rígida de “não esqueça todos”.
