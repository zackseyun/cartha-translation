  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: pt
  text: Como um pai tem compaixão de seus filhos[a], assim Yahweh tem compaixão dos que o temem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um pai se compadece de seus filhos, assim Yahweh se compadece dos que o temem.”'
    reason: Alternativa lexical que reproduz רחם com o verbo pronominal “compadecer-se”, preservando a mesma repetição poética.
lexical_decisions:
- source_word: כְּ/רַחֵם
  choice: Como ... tem compaixão
  rationale: A preposição כְּ introduz uma comparação, e רחם expressa compaixão profunda e terna. A formulação é natural em português e mantém o caráter proverbial do verso.
- source_word: אָב
  choice: um pai
  rationale: O singular é genérico e indefinido, descrevendo a atitude característica de um pai, não um pai específico.
- source_word: עַל
  choice: de
  rationale: Com a expressão portuguesa “ter compaixão”, a regência idiomática é “ter compaixão de”, comunicando naturalmente a relação marcada por עַל no hebraico.
- source_word: בָּנִים
  choice: seus filhos
  rationale: Embora a forma hebraica seja masculina plural, neste contexto familiar designa a descendência de modo coletivo. Em português, “filhos” pode incluir naturalmente filhos e filhas; “seus” explicita a relação implícita com “um pai”.
- source_word: רִחַם
  choice: tem compaixão
  rationale: A repetição da mesma expressão preserva o paralelismo com a primeira ocorrência de רחם. O presente expressa adequadamente a verdade geral comunicada pelo perfeito hebraico neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: A expressão descreve pessoas caracterizadas pelo temor a Yahweh. “Temem” mantém a força e a reconhecibilidade bíblica do hebraico, sem reduzi-lo interpretativamente a mera reverência.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por “SENHOR”.
- issue: Alcance da linguagem familiar em בָּנִים
  choice: filhos, em sentido coletivo
  alternative: filhos e filhas
  rationale: No contexto da relação entre pai e descendência, o masculino plural hebraico tem alcance genérico. O português “filhos” conserva a forma concisa e pode designar coletivamente ambos os sexos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo e a repetição do verbo hebraico foram preservados; a ordem comparativa do original também foi mantida.
