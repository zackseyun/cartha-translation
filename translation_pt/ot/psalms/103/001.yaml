  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: pt
  text: De Davi. Ó minha alma, bendiga Yahweh; e tudo o que há dentro de mim[a] bendiga o seu santo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todas as minhas partes interiores” ou “todo o meu ser interior”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva de modo idiomático a associação davídica indicada por לְ, sem definir se significa autoria, pertencimento ou dedicação.
- source_word: בָּרֲכִי
  choice: bendiga
  rationale: Mantém o sentido próprio do piel de ברך, no imperativo feminino singular dirigido a נַפְשִׁי, em vez de substituí-lo pelo mais interpretativo “louve”.
- source_word: נַפְשִׁי
  choice: Minha alma
  rationale: Expressa a autoadmoestação poética e conserva a amplitude de נפש, que aqui designa o próprio ser interior do salmista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְכָל קְרָבַי
  choice: e tudo o que há dentro de mim
  rationale: Comunica naturalmente a totalidade do ser interior evocada pelo plural קְרָבַי, cujo sentido literal é “minhas partes interiores”.
- source_word: שֵׁם קָדְשׁוֹ
  choice: o seu santo nome
  rationale: Verte de modo natural o construto hebraico “nome de sua santidade”, preservando tanto “nome” quanto a qualidade de santidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; ou a substituição tradicional SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita trocá-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada para marcar a autoadmoestação; o paralelismo e o imperativo “bendiga” foram preservados. O marcador [a] foi colocado após a frase à qual explica.
