lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: que perdoa
  rationale: O particípio com artigo descreve uma ação característica do SENHOR. “Que perdoa” é natural em português e mantém o paralelismo da sequência.
- source_word: לְכָל
  choice: toda / todas
  rationale: A concordância portuguesa exige variação de gênero e número; a tradução preserva em ambos os casos o alcance abrangente do hebraico.
- source_word: עֲוֺנֵכִי
  choice: a sua iniquidade
  rationale: עָוֹן pode designar iniquidade, culpa ou pecado. O singular coletivo foi preservado, assim como o peso moral do termo.
- source_word: הָרֹפֵא
  choice: cura
  rationale: O particípio com artigo é paralelo ao anterior e apresenta a cura como ação característica do SENHOR.
- source_word: תַּחֲלֻאָיִכִי
  choice: as suas doenças
  rationale: O substantivo denota doenças ou enfermidades. “Doenças” conserva de modo claro o sentido concreto, sem excluir possíveis ressonâncias poéticas mais amplas.
theological_decisions:
- issue: Se a linguagem de cura deve ser espiritualizada na tradução
  choice: Manter “cura todas as suas doenças” sem limitar a referência à cura exclusivamente física ou espiritual.
  alternative: “cura todas as suas doenças espirituais” ou uma formulação interpretativamente mais ampla
  rationale: O hebraico denota naturalmente doença ou enfermidade, enquanto o contexto poético pode comportar reflexão mais ampla. A tradução conserva tanto o sentido lexical quanto a abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “toda/todas” preserva o alcance abrangente e o paralelismo hebraico; “sua” acompanha o tratamento usual dirigido à própria alma no contexto do salmo.
