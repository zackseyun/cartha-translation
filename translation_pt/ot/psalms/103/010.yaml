source:
  edition: WLC
  text: לֹ֣א כַ֭/חֲטָאֵי/נוּ עָ֣שָׂה לָ֑/נוּ וְ/לֹ֥א כַ֝/עֲוֺנֹתֵ֗י/נוּ גָּמַ֥ל עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: pt
  text: Ele não nos tratou segundo os nossos pecados[a], nem nos retribuiu segundo as nossas iniquidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não fez conosco o que os nossos pecados mereciam, nem nos retribuiu o que as nossas iniquidades mereciam.”'
    reason: Alternativa lexical que explicita a ideia de proporção ou merecimento contida no כ comparativo.
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: segundo os nossos pecados
  rationale: 'O כ comparativo indica medida ou proporção: “segundo, em conformidade com”. חֲטָאֵינוּ refere-se aqui aos atos pecaminosos do povo.'
- source_word: עָשָׂה לָנוּ
  choice: nos tratou
  rationale: Embora עשה seja amplo (“fazer, agir”), com לָנוּ e neste contexto exprime a maneira como Deus agiu para conosco. “Nos tratou” é natural e conserva o sentido sem especificar uma ação não expressa no hebraico.
- source_word: וְלֹא
  choice: nem
  rationale: A conjunção com a negação introduz o segundo membro paralelo e mantém unidas as duas negações.
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: segundo as nossas iniquidades
  rationale: עָוֹן pode designar iniquidade, culpa ou suas consequências. “Iniquidades” preserva sua amplitude e a distinção lexical em relação a חטא.
- source_word: גָּמַל עָלֵינוּ
  choice: nos retribuiu
  rationale: גמל pode indicar dar a alguém em retorno aquilo que lhe corresponde. No contexto negativo, “retribuiu” comunica que Deus não impôs a retribuição proporcional às iniquidades, sem sugerir recompensa positiva.
theological_decisions:
- issue: Expressar a misericórdia divina sem importar uma teoria específica da expiação nem definir o momento do juízo
  choice: Declaração geral de que Deus não trata seu povo nem lhe retribui na proporção de seus pecados e iniquidades
  alternative: Restringir a afirmação aos juízos temporais, ou entendê-la como negação absoluta de qualquer juízo divino
  rationale: O hebraico afirma amplamente a contenção misericordiosa de Deus, mas não especifica aqui o âmbito, o mecanismo ou o momento do juízo. A formulação conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Iniquidades” mantém a distinção lexical do segundo membro sem tornar a frase excessivamente técnica.
