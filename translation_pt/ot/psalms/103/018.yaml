  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: pt
  text: aos que guardam a sua aliança[a] e aos que se lembram dos seus preceitos[b] para os cumprir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observam a sua aliança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “das suas instruções” ou “das suas determinações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: os que guardam
  rationale: O particípio de שׁמר pode indicar guardar, conservar ou observar. “Guardam” preserva a imagem lexical e, no contexto da aliança, comunica observância fiel em português natural.
- source_word: בְרִיתוֹ
  choice: a sua aliança
  rationale: בְּרִית designa aqui a aliança de Deus, termo bíblico corrente que mantém o peso relacional e teológico do hebraico.
- source_word: וּלְזֹכְרֵי
  choice: e aos que se lembram
  rationale: זכר expressa lembrança atenta, não mera recordação mental; a frase final explicita que essa lembrança conduz à prática.
- source_word: פִקֻּדָיו
  choice: dos seus preceitos
  rationale: פִּקּוּדִים refere-se às determinações ou instruções estabelecidas por Deus. “Preceitos” é preciso e ajuda a distingui-lo de outros termos hebraicos da linguagem legal e sapiencial.
- source_word: לַעֲשׂוֹתָם
  choice: para os cumprir
  rationale: O infinitivo com לְ apresenta a prática dos preceitos como finalidade ou resultado da lembrança. “Para os cumprir” transmite essa relação com fluência e dignidade.
theological_decisions:
- issue: Força ética de “lembrar” em relação aos preceitos de Deus
  choice: “se lembram dos seus preceitos para os cumprir”
  alternative: “se lembram dos seus preceitos, para os praticar”
  rationale: A formulação conserva a ligação sintática entre lembrança e ação, mostrando que a lembrança bíblica é obediente e prática, sem acrescentar ao texto qualquer esquema de mérito salvífico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o paralelismo do hebraico; “guardam” conserva a imagem original, enquanto “cumprir” comunica naturalmente a realização prática dos preceitos.
