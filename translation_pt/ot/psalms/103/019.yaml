  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: pt
  text: Yahweh estabeleceu o seu trono nos céus, e o seu reino[a] domina sobre tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua realeza”; ou: “o seu reinado domina sobre tudo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando seu caráter pessoal em vez de substituí-lo por um título.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: Conserva o plural hebraico e soa natural no registro poético português.
- source_word: הֵכִין
  choice: estabeleceu
  rationale: Expressa o sentido causativo de firmar ou estabelecer e se ajusta ao contexto do trono real.
- source_word: כִּסְאוֹ
  choice: o seu trono
  rationale: Equivalente direto e natural no contexto de soberania real.
- source_word: וּמַלְכוּתוֹ
  choice: e o seu reino
  rationale: מַלְכוּת pode indicar reino, realeza ou reinado; “reino” é claro e natural, sem excluir a ideia de domínio real.
- source_word: בַּכֹּל
  choice: sobre tudo
  rationale: Com o verbo משל, indica a extensão universal do domínio.
- source_word: מָשָׁלָה
  choice: domina
  rationale: O perfeito hebraico apresenta aqui uma realidade duradoura; o presente comunica naturalmente essa afirmação geral em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Valor aspectual de מָשָׁלָה
  choice: domina
  alternative: dominou; tem dominado
  rationale: Embora a forma hebraica seja qatal, o contexto poético permite uma declaração gnômica ou estativa sobre a soberania contínua de Deus; o presente conserva melhor essa força em português.
- issue: Amplitude semântica de מַלְכוּת
  choice: reino
  alternative: realeza; reinado
  rationale: “Reino” é a formulação mais corrente, enquanto a nota preserva as alternativas que destacam o exercício da soberania.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética concisa. O plural “céus” preserva diretamente a forma hebraica, por isso não requer nota específica em português.
