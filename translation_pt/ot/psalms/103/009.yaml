  text: לֹֽא לָ/נֶ֥צַח יָרִ֑יב וְ/לֹ֖א לְ/עוֹלָ֣ם יִטּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: pt
  text: Ele não contenderá para sempre[a], nem guardará sua ira perpetuamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não acusará” ou “não pleiteará para sempre”. O verbo hebraico pode indicar contender, disputar ou apresentar uma causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Lit.: “nem guardará perpetuamente”. O objeto não está expresso no hebraico; pelo contexto, entende-se “sua ira”. O verbo também pode ter o sentido de guardar ressentimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: para sempre
  rationale: A expressão indica duração contínua ou indefinida e forma o primeiro membro do paralelismo poético.
- source_word: יָרִיב
  choice: contenderá
  rationale: O verbo ריב pode descrever disputar, acusar ou pleitear uma causa; “contender” preserva essa amplitude sem impor um cenário estritamente judicial.
- source_word: לְעוֹלָם
  choice: perpetuamente
  rationale: Expressa duração indefinida ou permanente; a escolha evita repetir “para sempre” e mantém o paralelismo.
- source_word: יִטּוֹר
  choice: guardará sua ira
  rationale: נטר significa guardar ou conservar e, neste contexto, refere-se idiomaticamente a reter a ira ou guardar ressentimento; “sua ira” torna o sentido natural em português, embora o objeto esteja implícito no hebraico.
theological_decisions:
- issue: Explicitação do objeto implícito de יִטּוֹר
  choice: Traduzir idiomaticamente como “guardará sua ira”, indicando em nota que “sua ira” não aparece de forma expressa no hebraico.
  alternative: “nem guardará perpetuamente” ou “nem conservará ressentimento para sempre”
  rationale: O contexto imediato trata da compaixão divina em contraste com sua ira, e o idioma hebraico admite o sentido de reter ira ou ressentimento. A nota conserva a concisão e a ambiguidade formal do original.
translation_notes:
  register: Português atual, claro e digno, com paralelismo poético. “Contenderá” conserva a nuance judicial e relacional do hebraico; “guardará sua ira” comunica naturalmente o idioma contextual, enquanto a nota registra que o objeto é implícito.
