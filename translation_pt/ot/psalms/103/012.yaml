  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: pt
  text: Tão longe quanto o leste está do oeste, ele afastou de nós as nossas transgressões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs nossas transgressões bem longe de nós”. “Transgressões” também pode ser traduzido por “rebeliões” ou “ofensas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Quanto ... está longe
  rationale: A construção introduz uma comparação de distância ou extensão; esta formulação preserva a força comparativa e soa natural em português.
- source_word: מִזְרָח מִמַּעֲרָב
  choice: o leste ... do oeste
  rationale: Os termos designam as direções do nascer e do pôr do sol e, em conjunto, expressam uma distância extrema.
- source_word: הִרְחִיק
  choice: afastou
  rationale: O hifil de רחק significa fazer ficar longe, afastar ou remover. “Afastou” mantém tanto o sentido causativo quanto a imagem espacial do hebraico.
- source_word: מִמֶּנּוּ
  choice: de nós
  rationale: O sufixo pronominal é da primeira pessoa do plural e explicita a separação entre a comunidade e suas transgressões.
- source_word: פְּשָׁעֵינוּ
  choice: as nossas transgressões
  rationale: פשע pode indicar transgressão, rebelião ou ofensa deliberada. “Transgressões” preserva seu peso moral e pactual sem reduzi-lo ao termo mais amplo “pecados”.
theological_decisions:
- issue: Metáfora espacial do perdão
  choice: Conservar a imagem de Deus afastando para muito longe as transgressões de seu povo.
  alternative: Explicitar apenas que Deus perdoou completamente os pecados.
  rationale: O hebraico aplica diretamente a distância entre leste e oeste ao afastamento das transgressões. Preservar a metáfora comunica a plenitude do perdão sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo comparativo e a metáfora espacial do original.
