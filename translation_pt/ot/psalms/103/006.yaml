source:
  edition: WLC
  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: pt
  text: Yahweh pratica atos de justiça e faz justiça a todos os oprimidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh realiza atos justos e julgamentos em favor de todos os oprimidos.”'
    reason: Alternativa lexical que torna mais explícitos o plural e a dimensão judicial dos termos hebraicos.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: pratica / faz
  rationale: O particípio qal descreve a ação habitual e característica de Yahweh. As duas formas verbais dão fluidez ao português e mantêm o sentido contínuo do hebraico.
- source_word: צְדָקוֹת
  choice: atos de justiça
  rationale: O plural pode indicar ações justas ou manifestações concretas de justiça. Esta formulação preserva o caráter ativo e plural sem recorrer ao pouco natural “justiças”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמִשְׁפָּטִים
  choice: e faz justiça
  rationale: מִשְׁפָּטִים pode designar julgamentos ou atos judiciais. “Faz justiça” é claro e corrente em português, conserva a dimensão judicial e evita a rigidez de “executa julgamentos”.
- source_word: לְכָל
  choice: a todos
  rationale: A preposição לְ indica aqui os beneficiários da ação; “a todos” é a construção portuguesa natural com “faz justiça”.
- source_word: עֲשׁוּקִים
  choice: os oprimidos
  rationale: O particípio passivo de עשׁק identifica aqueles que sofrem opressão, exploração ou injustiça. “Os oprimidos” é conciso e mantém o sentido passivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Relação entre צְדָקוֹת e מִשְׁפָּטִים
  choice: atos de justiça e faz justiça
  alternative: justiça e julgamentos
  rationale: 'A tradução conserva os dois elementos coordenados, sem fundi-los completamente: o primeiro aponta para ações justas em sentido amplo, e o segundo, para decisões ou intervenções que estabelecem o direito.'
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “justiça” é deliberada: soa natural no contexto e reflete a proximidade semântica, mas não a identidade completa, dos dois substantivos hebraicos.'
