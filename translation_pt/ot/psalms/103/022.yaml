  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: pt
  text: Todas as suas obras, em todos os lugares de seu domínio[b], bendigam Yahweh[a]. Bendiga Yahweh, ó minha alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Louvem Yahweh”. O verbo hebraico repetido significa literalmente “bendizer”, mas, quando Deus é seu objeto, também pode ter o sentido de “louvar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em todos os lugares de seu domínio”; isto é, em todo lugar ao qual seu governo se estende.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Bendigam / Bendiga
  rationale: Preserva o verbo hebraico repetido ברך e a moldura litúrgica do salmo. As flexões distinguem o chamado plural dirigido às obras de Deus e o singular dirigido à própria alma do salmista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל מַעֲשָׂיו
  choice: todas as suas obras
  rationale: Abrange tanto aquilo que Deus fez quanto aquilo que ele realizou, mantendo a amplitude do substantivo hebraico e o chamado dirigido a toda a criação.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: em todos os lugares onde ele governa
  rationale: Expressa em português natural a extensão espacial de sua autoridade, sem restringi-la a um reino geográfico.
- source_word: נַפְשִׁי
  choice: ó minha alma
  rationale: Mantém a apóstrofe poética em que o salmista se dirige a si mesmo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o nome da aliança. “Yahweh” o representa como nome próprio, enquanto “SENHOR” refletiria a tradição reverencial de substituição.
- issue: Alcance de מֶמְשַׁלְתּוֹ
  choice: onde ele governa
  alternative: do seu domínio
  rationale: A formulação verbal comunica que o chamado vale em todo lugar alcançado pelo governo de Deus, sem converter a expressão necessariamente em território ou reino.
translation_notes:
  register: Português moderno, poético e acessível. A repetição de “Bendigam/Bendiga Yahweh” conserva o refrão do salmo; “ó minha alma” mantém a solenidade da autoexortação sem recorrer a linguagem arcaica.
