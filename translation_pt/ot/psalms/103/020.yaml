  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: pt
  text: Bendigam Yahweh, seus anjos, poderosos em força, que cumprem sua palavra ao ouvirem a voz de sua palavra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Bendigam
  rationale: Imperativo plural de ברך. “Bendigam” preserva a convocação repetida do salmo e é a formulação tradicional e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַלְאָכָיו
  choice: seus anjos
  rationale: No contexto celestial, מַלְאָך designa seres celestiais, não mensageiros humanos.
- source_word: גִּבֹּרֵי כֹחַ
  choice: poderosos em força
  rationale: Reproduz a ideia da construção hebraica sem acrescentar uma imagem militar ausente do texto.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: que cumprem a sua palavra
  rationale: “Cumprem” comunica naturalmente a execução do que Deus diz, enquanto “palavra” conserva o termo repetido דְבָרוֹ.
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: obedecendo à voz da sua palavra
  rationale: A construção שמע בקול pode significar escutar com resposta obediente. A tradução mantém tanto o sentido de obediência quanto a imagem auditiva de קול.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido de שׁמע na descrição dos anjos
  choice: obedecendo
  alternative: escutando; dando ouvidos
  rationale: O contexto apresenta os anjos como executores da palavra divina, e שמע בקול frequentemente inclui a resposta obediente. A nota registra a possibilidade mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O vocativo explícito “vocês” esclarece que os anjos são os destinatários do imperativo plural. A repetição de “palavra” preserva o paralelismo lexical hebraico.
