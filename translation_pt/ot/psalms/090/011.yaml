  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: pt
  text: Quem conhece o poder da tua ira[a] e a tua fúria, segundo o temor que te é devido?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E a tua fúria é conforme o temor de ti”; ou: “Como é o temor de ti, assim é a tua fúria”. A expressão hebraica é compacta e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; a forma simples preserva diretamente a força do hebraico.
- source_word: יוֹדֵעַ
  choice: conhece
  rationale: O particípio de ידע expressa conhecer ou reconhecer. “Conhece” é natural em português e mantém a pergunta sem explicitação indevida.
- source_word: עֹז
  choice: poder
  rationale: עֹז denota força ou poder; “poder” comunica aqui a força efetiva da ira divina.
- source_word: אַפֶּךָ
  choice: tua ira
  rationale: Embora אַף possa designar literalmente nariz, neste uso idiomático significa ira. A tradução evita um antropomorfismo lexical obscuro.
- source_word: וּכְיִרְאָתְךָ
  choice: e ... segundo o temor que te é devido
  rationale: A expressão compacta combina a conjunção com כְּ e “teu temor”. Esta formulação conserva a ideia de correspondência e explicita de modo idiomático que Deus é aquele a quem se deve temor reverente, sem eliminar a ambiguidade, registrada em nota.
- source_word: עֶבְרָתֶךָ
  choice: tua fúria
  rationale: עֶבְרָה indica ira intensa. “Fúria” mantém o tom elevado e distingue o termo do אַף anterior, apesar da sobreposição semântica.
theological_decisions:
- issue: Relação entre a fúria divina e o temor em וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: a tua fúria, segundo o temor que te é devido
  alternative: “E a tua fúria é conforme o temor de ti” ou “Como é o temor de ti, assim é a tua fúria”
  rationale: A sintaxe hebraica é condensada e admite mais de uma relação entre “temor” e “fúria”. O texto principal preserva a comparação ou correspondência sem convertê-la numa afirmação teológica mais específica; a nota apresenta as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. “Ira” e “fúria” preservam o paralelismo semântico e o tom poético; a construção algo solene “temor que te é devido” mantém a reverência e a ambiguidade essencial do original.
