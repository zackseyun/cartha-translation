base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: pt
  text: Oração de Moisés[a], homem de Deus. Senhor, tu tens sido a nossa morada[b] de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Moisés” ou “para Moisés” no título; a preposição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: b
    text: Ou “refúgio” ou “habitação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Oração
  rationale: Equivalente direto e natural para o substantivo hebraico que designa uma prece.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico tradicional, seu sentido de pertencimento e serviço a Deus e sua dignidade.
- source_word: מָעוֹן
  choice: morada
  rationale: Expressa o sentido principal de lugar de habitação; a nota conserva as alternativas contextualmente possíveis.
- source_word: בְּדֹר וָדֹר
  choice: de geração em geração
  rationale: Reproduz de modo idiomático a expressão distributiva hebraica e seu sentido de continuidade através das gerações.
theological_decisions:
- issue: Relação indicada por לְ em לְמֹשֶׁה
  choice: de Moisés
  alternative: por Moisés; para Moisés
  rationale: A formulação tradicional e natural pode indicar autoria ou associação, enquanto a nota preserva a amplitude semântica da preposição hebraica.
- issue: Metáfora de Deus como מָעוֹן
  choice: nossa morada
  alternative: nosso refúgio; nossa habitação
  rationale: Mantém a imagem espacial do hebraico sem restringi-la exclusivamente à ideia de proteção.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Emprega “tu” para refletir a segunda pessoa singular do hebraico e conserva a concisão poética do título e da declaração.
