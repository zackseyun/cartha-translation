  text: כִּ֣י כָל יָ֭מֵי/נוּ פָּנ֣וּ בְ/עֶבְרָתֶ֑/ךָ כִּלִּ֖ינוּ שָׁנֵ֣י/נוּ כְמוֹ הֶֽגֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: pt
  text: Pois todos os nossos dias passam sob a tua ira; acabamos os nossos anos como um suspiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um murmúrio” ou “como um gemido”. O termo hebraico designa um som baixo; no texto, “suspiro” ressalta, neste contexto, o caráter breve e fugaz da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa do conectivo e soa natural na poesia em português.
- source_word: כָל יָמֵינוּ
  choice: todos os nossos dias
  rationale: Preserva o plural concreto e o paralelismo poético com “os nossos anos”.
- source_word: פָּנוּ
  choice: passam
  rationale: No contexto temporal, o verbo indica que os dias se vão ou chegam ao fim; “passam” é claro e idiomático sem acrescentar a ideia de aniquilação.
- source_word: בְעֶבְרָתֶךָ
  choice: sob a tua ira
  rationale: עֶבְרָה expressa ira intensa. “Sob” comunica naturalmente em português a circunstância ou domínio dessa ira, correspondente à preposição בְּ.
- source_word: כִּלִּינוּ
  choice: acabamos
  rationale: O Piel de כלה aqui comunica levar ao fim ou completar; “acabamos” preserva a concisão e admite tanto o término quanto o desgaste da vida.
- source_word: שָׁנֵינוּ
  choice: os nossos anos
  rationale: Tradução direta que conserva o plural e o paralelismo com “dias”.
- source_word: כְמוֹ
  choice: como
  rationale: Equivalente comparativo simples e natural em português.
- source_word: הֶגֶה
  choice: um suspiro
  rationale: O termo pode designar um som baixo, como murmúrio, gemido ou suspiro. No contexto da brevidade e fragilidade da vida, “suspiro” transmite de modo natural a imagem fugaz, enquanto as alternativas são registradas em nota.
theological_decisions:
- issue: Terminologia da ira divina
  choice: sob a tua ira
  alternative: sob a tua indignação; sob o teu furor
  rationale: O texto atribui explicitamente o transcorrer da vida humana à עֶבְרָה de Deus. “Ira” conserva a intensidade e a tensão teológica sem suavizar nem ampliar a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura paralela entre “dias” e “anos” foi preservada; o marcador da nota foi colocado junto de “suspiro”, termo ao qual a nota se refere.
