  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: pt
  text: Antes que os montes nascessem e antes que desses à luz a terra e o mundo,[a] de eternidade a eternidade, tu és Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizesses nascer a terra e o mundo”; o verbo hebraico contém uma imagem de trabalho de parto e nascimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Antes que
  rationale: Introduz naturalmente em português o tempo anterior à criação e rege adequadamente as duas formas verbais seguintes.
- source_word: הָרִים
  choice: os montes
  rationale: Preserva o artigo definido e o cenário poético; “montes” é corrente, digno e tradicional sem ser arcaico.
- source_word: יֻלָּדוּ
  choice: nascessem
  rationale: Mantém a metáfora de nascimento do passivo de ילד e concorda com a construção temporal iniciada por “Antes que”.
- source_word: וַתְּחוֹלֵל
  choice: fizesses nascer
  rationale: Conserva a imagem de parto ou geração expressa pelo verbo hebraico e atribui a ação diretamente a Deus, sem reduzi-la ao genérico “criasses”.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No paralelismo cósmico com תֵבֵל, refere-se à terra como parte da criação, não a uma região localizada.
- source_word: וְתֵבֵל
  choice: e o mundo
  rationale: Traduz de modo claro e conciso o mundo habitado ou ordenado, preservando o paralelismo.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: de eternidade a eternidade
  rationale: Reproduz a estrutura do idioma hebraico e comunica duração sem limites em ambas as direções em português natural.
- source_word: אַתָּה
  choice: tu
  rationale: Retém o pronome explícito e enfático. “Tu” combina com a oração direta a Deus e é amplamente inteligível no português bíblico internacional.
- source_word: אֵל
  choice: Deus
  rationale: É a designação divina clara e natural exigida pelo contexto, sem acrescentar qualificações não explícitas.
theological_decisions:
- issue: A imagem antropomórfica de nascimento na criação
  choice: Preservar a imagem tanto no nascimento dos montes quanto no ato divino de fazer nascer a terra e o mundo.
  alternative: Achatar a metáfora com “criados”, “formados” ou “fizeste”.
  rationale: O hebraico emprega linguagem de nascimento e parto para realçar que Deus antecede toda a criação. A tradução conserva a força poética sem definir um mecanismo de criação nem importar uma doutrina adicional.
- issue: A eternidade de Deus
  choice: “de eternidade a eternidade, tu és Deus”
  alternative: “desde sempre e para sempre, tu és Deus” ou “de era em era, tu és Deus”
  rationale: A formulação mantém o idioma bilateral do hebraico e sua afirmação de que Deus existe antes e além do mundo criado, sem transformar a expressão poética em definição filosófica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe no subjuntivo é natural após “Antes que”. Mantém-se “tu” por corresponder ao pronome hebraico enfático e à fala dirigida diretamente a Deus; evita-se vocabulário excessivamente arcaico. O marcador [a] aparece no texto após a unidade a que a nota se refere.
