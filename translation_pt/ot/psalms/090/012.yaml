  text: לִ/מְנ֣וֹת יָ֭מֵי/נוּ כֵּ֣ן הוֹדַ֑ע וְ֝/נָבִ֗א לְבַ֣ב חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: pt
  text: Ensina-nos a contar os nossos dias de tal modo que alcancemos um coração sábio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ensina-nos assim a contar os nossos dias, e traremos um coração de sabedoria”. O hebraico da oração final é difícil; muitos o entendem no sentido de “para que alcancemos um coração sábio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: contar
  rationale: O infinitivo de מנה denota contar ou enumerar. “Contar” conserva a metáfora concreta e é a formulação mais natural no português atual.
- source_word: יָמֵינוּ
  choice: os nossos dias
  rationale: Reproduz diretamente a construção com sufixo de primeira pessoa do plural e, no contexto, aponta para a duração limitada da vida humana.
- source_word: כֵּן
  choice: não expresso separadamente no texto principal
  rationale: O termo significa literalmente “assim/desse modo”, mas sua função exata na sintaxe é discutida. Acrescentar “corretamente” poderia explicitar uma interpretação não inequívoca; a nota preserva o valor mais literal.
- source_word: הוֹדַע
  choice: Ensina-nos
  rationale: O imperativo causativo de ידע significa “faz-nos saber” ou “dá-nos a conhecer”. “Ensina-nos” expressa naturalmente, em linguagem de oração, o pedido de entendimento concedido por Deus.
- source_word: וְנָבִא
  choice: para que alcancemos
  rationale: A cláusula é difícil. “Alcancemos” comunica a interpretação contextual comum de adquirir ou atingir sabedoria, sem tornar a frase artificial; a tradução mais literal, “e traremos”, é registrada na nota.
- source_word: לְבַב חָכְמָה
  choice: um coração sábio
  rationale: A expressão literal é “coração de sabedoria”. “Um coração sábio” é natural em português e preserva o coração como centro da compreensão, da vontade e da disposição interior.
theological_decisions:
- issue: Interpretação da cláusula final de propósito ou resultado
  choice: O pedido é que Deus ensine o povo a reconhecer a brevidade da vida, para que alcance uma disposição interior sábia.
  alternative: “Ensina-nos assim a contar os nossos dias, e traremos um coração de sabedoria.”
  rationale: O hebraico é sintaticamente condensado e admite mais de uma análise. A leitura adotada se ajusta ao contexto do salmo e produz português claro, enquanto a nota conserva a alternativa mais literal e a genuína dificuldade do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém a metáfora de contar os dias e evita inserir “corretamente”, que não está explicitamente no hebraico. A ambiguidade da última oração é preservada em nota.
