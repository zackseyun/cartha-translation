  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: pt
  text: Tu os arrastas; eles são como um sonho.[a] Pela manhã, são como a relva que brota de novo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «eles são como o sono». O hebraico é muito condensado.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «Pela manhã, como a relva, ela passa/muda-se». O verbo hebraico está no singular e concorda formalmente com «relva»; pode referir-se a passar, mudar-se ou renovar-se. No contexto do versículo seguinte, «brota de novo» é uma interpretação plausível.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Tu os varres para longe
  rationale: O verbo descreve ser levado por uma corrente impetuosa. A formulação preserva a ideia de remoção súbita e irresistível sem tornar obrigatória a imagem explícita de uma inundação.
- source_word: שֵׁנָה
  choice: como um sonho
  rationale: O substantivo significa literalmente «sono». No paralelismo poético muito condensado, «como um sonho» comunica de modo natural a brevidade e a natureza fugaz da vida, enquanto a leitura literal é preservada em nota.
- source_word: יִהְיוּ
  choice: eles são
  rationale: Embora a forma seja imperfeita, aqui tem valor descritivo ou proverbial. O presente é natural em português e mantém o referente humano no plural.
- source_word: בַּבֹּקֶר
  choice: Pela manhã
  rationale: Expressa naturalmente o momento em que a relva aparece renovada, preparando o contraste com seu murchar no versículo seguinte.
- source_word: כֶּחָצִיר
  choice: como a relva
  rationale: «Relva» representa com clareza a vegetação baixa e passageira evocada por חָצִיר e funciona em português internacional de registro poético digno.
- source_word: יַחֲלֹף
  choice: que brota de novo
  rationale: O verbo pode indicar passar, mudar ou renovar-se. O contexto imediato, especialmente o florescer da relva no versículo 6 antes de murchar à tarde, favorece aqui a ideia de renovação ou novo crescimento. O singular concorda formalmente com «relva».
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com tratamento por «tu» adequado à oração do salmo. A redação principal privilegia a progressão contextual da relva que brota pela manhã e murcha à tarde, sem ocultar em nota a ambiguidade lexical e sintática do hebraico.
