    issue: Pontuação e ligação da pergunta de lamento
    rationale: O hebraico liga «Volta, Yahweh» à pergunta «até quando?». O travessão, em vez de uma exclamação seguida de frase autônoma, representa melhor essa unidade.
  - severity: medium
    issue: Formulação pouco natural da nota lexical
    rationale: «Volta atrás quanto aos teus servos» soa pouco idiomático e é semanticamente impreciso em português. «Volta atrás em relação aos teus servos» comunica de forma clara a alternativa «relenta/cede» sem introduzir um objeto ou castigo não expresso.
  revised_text: Volta, ó Yahweh — até quando? Tem compaixão dos teus servos.[a]
