  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: pt
  text: Volta, ó Yahweh — até quando? Tem compaixão dos teus servos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “volta atrás em relação aos teus servos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Volta
  rationale: O imperativo dirigido a Yahweh conserva a força direta, relacional e possivelmente espacial de שוב na linguagem de lamento, sem antecipar a nuance de mudança de atitude expressa pelo verbo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד מָתָי
  choice: Até quando?
  rationale: É a forma idiomática consagrada e natural em português para a fórmula hebraica de lamento, preservando sua urgência.
- source_word: וְהִנָּחֵם
  choice: Tem compaixão
  rationale: O imperativo nifal de נחם pode comunicar compaixão, pesar ou mudança de atitude. Aqui, a formulação expressa naturalmente o apelo em favor dos servos, sem sugerir correção moral em Deus.
- source_word: עַל
  choice: dos
  rationale: Com נחם, a preposição assinala aqueles em favor de quem se pede compaixão; em português, a construção idiomática é 'ter compaixão de'.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: No contexto de oração dirigida a Deus, 'servos' é natural e apropriado, mantendo a relação de submissão e pertencimento sem destacar especificamente a condição de escravidão.
theological_decisions:
- issue: Tradução de נחם quando o sujeito é Deus
  choice: Tem compaixão
  alternative: Desiste do castigo contra os teus servos / volta atrás quanto aos teus servos
  rationale: O hebraico admite tanto a ideia de ser movido à compaixão quanto a de mudar de curso ou desistir de uma ação. O texto principal preserva a dimensão afetiva de modo natural, enquanto a nota registra a possível nuance de mudança de curso, sem atribuir erro moral a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O vocativo mantém o nome divino; a frase curta e a pergunta preservam a urgência do lamento hebraico.
