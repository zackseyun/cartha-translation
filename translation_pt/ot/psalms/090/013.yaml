  verdict: revise
  source_fidelity: 'O texto principal transmite adequadamente os dois imperativos hebraicos: שובָה, dirigido a Yahweh, e הִנָּחֵם, apelo para que ele se compadeça/volte atrás em favor de seus servos. A pergunta עַד־מָתָי é preservada. A alternativa da nota, porém, é pouco idiomática em português e pode ser formulada de modo mais claro sem especificar indevidamente uma ação divina.'
  naturalness: «Volta, ó Yahweh — até quando?» preserva melhor a unidade interrogativa e a cadência do lamento do que separar «Até quando?» como frase independente após exclamação. «Tem compaixão dos teus servos» é natural e digno.
  terminology: «Yahweh» segue a decisão de transliterar o Tetragrama. «Servos» é apropriado para עֲבָדֶיךָ. «Tem compaixão» é uma boa tradução contextual de נחם; a nota deve conservar a alternativa de mudança de curso.
  issues:
