source:
  edition: WLC
  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: pt
  text: Pois mil anos, aos teus olhos, são como o dia de ontem, que passou,[a] ou como uma vigília da noite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando passa”. A oração hebraica admite essa nuance temporal.'
    reason: lexical_alternative
  - marker: b
    text: Uma “vigília” era uma divisão da noite durante a qual se montava guarda.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e expressa naturalmente o valor causal do hebraico.
- source_word: אֶלֶף שָׁנִים
  choice: mil anos
  rationale: Mantém de forma direta a expressão numérica e o contraste poético entre o tempo humano e a perspectiva divina.
- source_word: בְּעֵינֶיךָ
  choice: aos teus olhos
  rationale: Preserva a metáfora hebraica de perspectiva ou avaliação em linguagem portuguesa natural e digna.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: como o dia de ontem
  rationale: Reproduz explicitamente יוֹם, 'dia', e comunica com clareza a imagem de um dia recente que já se foi.
- source_word: כִּי יַעֲבֹר
  choice: que passou
  rationale: Qualifica o dia de ontem como já transcorrido; o pretérito evita a estranheza temporal de dizer que ontem ainda passa, sem eliminar a alternativa aspectual possível.
- source_word: וְאַשְׁמוּרָה
  choice: ou como uma vigília
  rationale: A conjunção acrescenta uma segunda comparação. Em português, 'ou como' explicita naturalmente o paralelismo sem alterar o sentido.
- source_word: בַלָּיְלָה
  choice: da noite
  rationale: A construção 'vigília da noite' é idiomática e identifica o período noturno em que se mantinha guarda.
theological_decisions:
- issue: Linguagem antropomórfica sobre a perspectiva de Deus diante do tempo
  choice: Manter “aos teus olhos” e as duas comparações temporais sem expansão filosófica.
  alternative: Explicitar que mil anos nada representam para Deus ou formular uma doutrina de atemporalidade.
  rationale: O versículo contrasta poeticamente a perspectiva divina e a experiência humana do tempo. A tradução conserva a metáfora e a tensão do texto sem importar uma formulação teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento na segunda pessoa do singular preserva o discurso direto a Deus e o tom poético. A redação busca dignidade sem arcaísmo excessivo.
