base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: pt
  text: Pois somos consumidos pela tua ira[a] e, pelo teu furor, ficamos aterrorizados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegamos ao fim por causa da tua ira”. O verbo hebraico pode indicar acabar, ser consumido ou ser levado ao fim.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficamos consternados” ou “ficamos perturbados”. O verbo hebraico expressa alarme, perturbação ou terror.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi afirmado anteriormente e preserva o fluxo argumentativo e poético do salmo.
- source_word: כָלִינוּ
  choice: somos consumidos
  rationale: O verbo כלה pode expressar chegar ao fim, acabar ou ser consumido. A formulação escolhida comunica a gravidade do efeito da ira divina sem excluir a ideia de sermos levados ao fim.
- source_word: בְאַפֶּךָ
  choice: pela tua ira
  rationale: 'A preposição ב é entendida aqui em sentido causal ou instrumental: a ira de Deus é aquilo por que o povo é consumido.'
- source_word: חֲמָתְךָ
  choice: teu furor
  rationale: חֵמָה denota ira intensa ou ardente. “Furor” mantém a intensificação poética e distingue o termo de אַף, traduzido por “ira”.
- source_word: נִבְהָלְנוּ
  choice: ficamos aterrorizados
  rationale: O verbo בהל transmite perturbação súbita, alarme ou terror. No paralelismo com o furor divino, “ficamos aterrorizados” expressa naturalmente sua intensidade e o aspecto resultante da forma hebraica.
theological_decisions:
- issue: Tradução dos dois termos paralelos para a ira divina
  choice: 'Manter termos distintos: “ira” e “furor”'
  alternative: Traduzir ambos pelo mesmo termo, ou usar “indignação” e “ira”
  rationale: O hebraico emprega אַף e חֵמָה, termos relacionados, mas distintos. Preservar a diferença mantém a intensificação poética sem acrescentar uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tua” preserva o tratamento singular presente no hebraico e combina com o registro poético dos Salmos. A ordem foi mantida próxima do paralelismo hebraico, com pontuação natural em português.
