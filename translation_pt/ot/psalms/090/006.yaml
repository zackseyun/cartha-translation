  text: בַּ֭/בֹּקֶר יָצִ֣יץ וְ/חָלָ֑ף לָ֝/עֶ֗רֶב יְמוֹלֵ֥ל וְ/יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/006.yaml
  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: pt
  text: De manhã, brota[a] e viceja[b]; ao entardecer, murcha[c] e seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “floresce”. O verbo hebraico também pode destacar o florescimento.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “e passa” ou “e muda”. Aqui, a tradução “viceja” reflete o provável sentido da expressão na imagem da vegetação.
    reason: lexical_alternative
  - marker: c
    text: Ou “é cortada”. Neste contexto, o verbo hebraico pode indicar tanto ser cortada como murchar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: De manhã
  rationale: Expressa de modo natural a indicação temporal e estabelece o contraste com o fim do dia.
- source_word: יָצִיץ
  choice: brota
  rationale: O verbo pode indicar tanto brotar como florescer. “Brota” retrata com clareza o início do breve ciclo da vegetação, sem excluir a alternativa registrada em nota.
- source_word: וְחָלָף
  choice: e viceja
  rationale: Embora חלף costume exprimir passagem ou mudança, no paralelismo vegetal provavelmente descreve a relva seguindo seu curso em pleno viço. “Viceja” comunica esse sentido contextual sem alongar o verso.
- source_word: לָעֶרֶב
  choice: ao entardecer
  rationale: Marca a chegada do fim do dia e ressalta a rapidez da transição iniciada pela expressão “De manhã”.
- source_word: יְמוֹלֵל
  choice: murcha
  rationale: No contexto vegetal, o verbo pode descrever o definhar da planta, embora também admita a ideia de ser cortada. “Murcha” mantém o paralelismo natural com “seca” sem introduzir explicitamente um agente.
- source_word: וְיָבֵשׁ
  choice: e seca
  rationale: Tradução direta e idiomática da etapa final de ressecamento da vegetação.
