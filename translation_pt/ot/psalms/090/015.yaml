base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: pt
  text: 'Alegra-nos por tantos dias quantos nos afligiste,

    por tantos anos quantos vimos a desgraça.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a calamidade”, “a adversidade” ou “o mal”. O termo hebraico tem uma ampla gama de sentidos e, aqui, refere-se ao sofrimento experimentado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Alegra-nos
  rationale: 'O imperativo piel com sufixo de primeira pessoa do plural expressa um pedido causativo: que Deus faça a comunidade alegrar-se. “Alegra-nos” é direto, natural e digno.'
- source_word: כִּימוֹת
  choice: por tantos dias quantos
  rationale: A preposição כְּ introduz aqui uma correspondência de medida. A formulação comunica que a duração da alegria pedida deve corresponder à duração da aflição.
- source_word: עִנִּיתָנוּ
  choice: nos afligiste
  rationale: O piel de ענה pode significar afligir ou humilhar. Neste lamento e em paralelo com a desgraça experimentada, “afligiste” preserva melhor o sentido amplo sem o restringir à opressão humana ou à humildade interior.
- source_word: שְׁנוֹת
  choice: por tantos anos quantos
  rationale: O plural construto é paralelo a “dias”. A repetição da construção proporcional em português mantém o paralelismo poético e a medida solicitada.
- source_word: רָאִינוּ
  choice: vimos
  rationale: A tradução literal conserva a metáfora hebraica de “ver” no sentido de vivenciar, que também é compreensível em português.
- source_word: רָעָה
  choice: desgraça
  rationale: Neste contexto, רָעָה indica adversidade ou calamidade sofrida, não necessariamente mal moral. “Desgraça” preserva a gravidade do lamento, e a nota registra a amplitude lexical.
theological_decisions:
- issue: Sentido de רָעָה em relação à ação de Deus
  choice: desgraça, como adversidade experimentada
  alternative: mal; calamidade; adversidade
  rationale: O paralelismo relaciona רָעָה à aflição vivida pela comunidade. A tradução evita afirmar que os orantes praticaram mal moral, sem suavizar a atribuição explícita da aflição a Deus.
- issue: Agência divina em עִנִּיתָנוּ
  choice: nos afligiste
  alternative: fomos afligidos; nos humilhaste
  rationale: A segunda pessoa do verbo atribui diretamente a ação a Deus. Mantê-la preserva a tensão teológica do lamento, em vez de ocultá-la por meio de uma construção passiva.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo e a concisão poética do hebraico foram preservados; a construção “por tantos... quantos” explicita a correspondência proporcional sem acrescentar uma equivalência matemática rígida.
