  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: pt
  text: 'Tu fazes o ser humano voltar ao pó[a] e dizes: “Voltem, filhos dos homens[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao que foi esmagado” ou “à condição de esmagamento”. O termo hebraico indica algo esmagado ou reduzido a pó; “pó” expressa o sentido no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “filhos de Adão” ou “seres humanos”. O hebraico diz literalmente “filhos de אדם”, expressão que pode designar a humanidade em geral.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: fazes ... voltar
  rationale: 'O hifil de שוב tem sentido causativo: Deus faz o ser humano retornar. A formulação é natural em português e mantém o vínculo verbal com o imperativo seguinte.'
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: אֱנוֹשׁ designa a humanidade frágil e mortal. “O ser humano” conserva o valor coletivo singular sem restringir a referência aos homens do sexo masculino.
- source_word: עַד דַּכָּא
  choice: ao pó
  rationale: דַּכָּא refere-se ao que foi esmagado ou reduzido a pó; no contexto da mortalidade humana, “ao pó” expressa de modo claro e poético o estado final, enquanto a nota preserva a amplitude lexical.
- source_word: וַתֹּאמֶר
  choice: e dizes
  rationale: O presente dá expressão proverbial à ação divina e concorda com o tratamento direto de Deus no salmo.
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: Imperativo plural de שוב. “Voltem” preserva a repetição da raiz usada em תָּשֵׁב e a força da ordem divina.
- source_word: בְנֵי אָדָם
  choice: filhos de Adão
  rationale: A tradução formal conserva אָדָם e a possível ressonância de Adão como ancestral da humanidade, além de manter o paralelismo antropológico do verso.
theological_decisions:
- issue: Sentido de בְנֵי אָדָם
  choice: filhos de Adão
  alternative: seres humanos / filhos dos homens
  rationale: “Filhos de Adão” preserva a forma hebraica e a possível alusão à origem e mortalidade da humanidade, sem tornar explícita uma interpretação que o original apenas sugere.
- issue: Destino expresso por דַּכָּא
  choice: pó
  alternative: estado de esmagamento / destruição
  rationale: O contexto favorece a imagem da redução do mortal ao pó, mas a nota registra que o termo hebraico não é o vocábulo comum para “pó” e admite formulações mais literais.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento de Deus por “tu” para acompanhar a oração direta do salmo. A repetição “voltar/Voltem” reproduz o jogo com a mesma raiz hebraica. “Filhos de Adão” é deliberadamente formal para conservar a ambiguidade entre descendência de Adão e designação da humanidade.
