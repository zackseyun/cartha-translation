source:
  edition: WLC
  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: pt
  text: Sacia-nos pela manhã com o teu amor leal[a], e cantaremos de alegria e nos alegraremos todos os nossos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “amor de aliança”, “amor constante” ou “misericórdia”. O termo hebraico חֶסֶד expressa amor e bondade leais e duradouros.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Sacia-nos
  rationale: O imperativo piel de שבע, com sufixo da primeira pessoa do plural, pede que Deus os satisfaça plenamente. “Sacia-nos” preserva a ideia de plenitude e é natural em linguagem poética portuguesa.
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: Representa o sentido temporal simples do hebraico sem transformá-lo em “cada manhã” nem em “até a manhã”.
- source_word: חַסְדֶּךָ
  choice: com o teu amor leal
  rationale: חֶסֶד reúne amor, bondade, lealdade e constância. “Amor leal” conserva essa riqueza sem restringir o termo apenas à misericórdia nem explicitar no texto uma referência à aliança.
- source_word: וּנְרַנְּנָה
  choice: e cantaremos de alegria
  rationale: רנן indica uma expressão vocal e jubilosa, que pode ser canto ou grito de alegria. “Cantaremos de alegria” comunica de modo natural o júbilo audível.
- source_word: וְנִשְׂמְחָה
  choice: e nos alegraremos
  rationale: שמח significa alegrar-se ou regozijar-se. A tradução mantém o segundo verbo e, assim, preserva o paralelismo cumulativo do hebraico.
- source_word: בְּכָל יָמֵינוּ
  choice: todos os nossos dias
  rationale: Expressa a totalidade dos dias da comunidade orante, isto é, toda a sua vida, de forma concisa e idiomática.
theological_decisions:
- issue: Sentido de חֶסֶד na súplica pelo favor divino
  choice: amor leal
  alternative: amor de aliança; misericórdia; amor constante
  rationale: O termo evoca o amor bondoso, duradouro e fiel de Deus. “Amor leal” preserva essa amplitude e evita converter uma conotação de aliança em formulação mais explícita do que o próprio verso.
- issue: Relação entre o imperativo e os dois cohortativos
  choice: 'resultado ou resposta: “e cantaremos... e nos alegraremos”'
  alternative: 'propósito: “para que cantemos... e nos alegremos”'
  rationale: Os cohortativos após a petição podem exprimir propósito ou resultado esperado. A coordenação com “e” conserva a forma e a abertura do hebraico, sem eliminar essa proximidade semântica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A segunda pessoa singular foi mantida em “teu”, comum na linguagem bíblica e poética; a construção evita regionalismos marcados.
