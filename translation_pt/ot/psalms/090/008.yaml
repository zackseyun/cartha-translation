  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שת עֲוֺנֹתֵ֣י/נוּ לְ/נֶגְדֶּ֑/ךָ עֲ֝לֻמֵ֗/נוּ לִ/מְא֥וֹר פָּנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: pt
  text: Puseste diante de ti as nossas iniquidades, os nossos pecados ocultos[a] à luz do teu rosto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os nossos pecados secretos”. O termo hebraico se refere ao que está escondido ou encoberto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “à luz do teu rosto”, imagem de plena exposição diante da presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת
  choice: Puseste
  rationale: O perfeito de שִׁית descreve Deus como quem colocou ou expôs as iniquidades diante de si. O pretérito perfeito é natural em português e preserva a ação divina já realizada.
- source_word: עֲוֺנֹתֵינוּ
  choice: as nossas iniquidades
  rationale: עָוֹן pode indicar perversidade, culpa ou delito. “Iniquidades” mantém o peso moral e o plural concreto do hebraico.
- source_word: לְנֶגְדֶּךָ
  choice: diante de ti
  rationale: A expressão significa estar diante de alguém, sob sua vista. A formulação é idiomática e conserva a ideia de plena exposição a Deus.
- source_word: עֲלֻמֵנוּ
  choice: os nossos pecados ocultos
  rationale: O termo designa aquilo que está escondido ou encoberto. O paralelismo com “as nossas iniquidades” permite explicitar “pecados”, implícito no hebraico.
- source_word: לִמְאוֹר
  choice: à luz de
  rationale: A construção apresenta o que estava oculto como exposto à iluminação; “à luz de” preserva essa imagem de modo natural.
- source_word: פָּנֶיךָ
  choice: teu rosto
  rationale: A tradução concreta conserva a imagem hebraica do rosto de Deus, que aqui comunica sua presença e seu olhar perscrutador.
theological_decisions:
- issue: Explicitação do referente de עֲלֻמֵנוּ
  choice: os nossos pecados ocultos
  alternative: as nossas coisas ocultas; os nossos segredos
  rationale: O paralelismo imediato com “as nossas iniquidades” indica transgressões encobertas, não coisas ocultas em sentido neutro. A explicitação esclarece a elipse poética sem acrescentar uma ideia estranha ao texto.
- issue: Preservação da imagem do rosto de Deus
  choice: à luz do teu rosto
  alternative: à luz da tua presença
  rationale: “Rosto” mantém a metáfora concreta do hebraico e sua tensão poética, enquanto o contexto torna perceptível a noção de exposição diante da presença divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa coerentes (“ti”, “teu”). Mantém o paralelismo poético e a imagem concreta do hebraico, esclarecendo apenas a elipse de “pecados”.
