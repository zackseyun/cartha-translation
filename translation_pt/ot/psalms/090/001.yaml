source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: pt
  text: 'Oração de Moisés[a], homem de Deus.


    Senhor, tu tens sido a nossa morada[b] de geração em geração.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Moisés” ou “para Moisés”; no título, a preposição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: b
    text: Ou “refúgio” ou “habitação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Oração
  rationale: Como rótulo de gênero no título do salmo, “Oração” comunica de modo natural e direto o sentido do substantivo hebraico.
- source_word: לְמֹשֶׁה
  choice: de Moisés
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, associação ou dedicação. “De Moisés” é a formulação portuguesa mais concisa e relativamente aberta, com a amplitude esclarecida em nota.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva a designação hebraica tradicional aplicada a Moisés. Em português, após o nome próprio, a ausência de artigo é idiomática e não torna a expressão indefinida.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Trata-se do título divino usado em vocativo. “Senhor” é a tradução portuguesa natural e consagrada, sem enfatizar indevidamente a forma histórica do sufixo.
- source_word: מָעוֹן
  choice: morada
  rationale: “Morada” preserva a metáfora espacial de Deus como habitação permanente do seu povo, além de ser digna, clara e mais concisa que “lugar de habitação”.
- source_word: הָיִיתָ לָּנוּ
  choice: tu tens sido a nossa
  rationale: O perfeito hebraico, no contexto da continuidade entre gerações, aponta para uma relação que se estende até o presente. A construção possessiva produz português natural sem perder o sentido de “tens sido para nós”.
- source_word: בְּדֹר וָדֹר
  choice: de geração em geração
  rationale: É a expressão idiomática portuguesa que comunica continuidade através de gerações sucessivas e reproduz o caráter iterativo do hebraico.
theological_decisions:
- issue: Sentido de לְמֹשֶׁה no título
  choice: “de Moisés”, com nota que mantém abertas autoria, associação e dedicação
  alternative: “por Moisés” ou “para Moisés”
  rationale: A preposição hebraica é semanticamente ampla nos títulos dos salmos. A tradução não deve transformar essa relação em uma afirmação histórica mais específica do que o texto exige.
- issue: Metáfora de Deus como מָעוֹן
  choice: “morada”
  alternative: “refúgio” ou “habitação”
  rationale: “Morada” conserva a imagem primária de habitação e permite que a segurança implícita surja da metáfora, sem reduzi-la antecipadamente ao conceito de refúgio.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O título foi mantido como superscrição, e o tratamento “tu” preserva o discurso direto a Deus sem soar excessivamente coloquial.
