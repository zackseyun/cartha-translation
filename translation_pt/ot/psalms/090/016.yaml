  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: pt
  text: Que a tua obra se revele aos teus servos, e o teu esplendor sobre os filhos deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: se revele
  rationale: O nifal de ראה expressa que a obra seja vista ou se torne manifesta; “se revele” preserva essa ideia em português natural.
- source_word: פָעֳלֶךָ
  choice: a tua obra
  rationale: פֹּעַל designa obra, feito ou ação; “obra” mantém a formulação ampla do hebraico.
- source_word: וַהֲדָרְךָ
  choice: e o teu esplendor
  rationale: הָדָר pode indicar esplendor, majestade ou glória; “esplendor” comunica a manifestação visível da grandeza divina sem estreitar o sentido.
- source_word: עַל־בְּנֵיהֶם
  choice: sobre os filhos deles
  rationale: Mantém a preposição עַל (“sobre”) e traduz בנים literalmente como “filhos”, preservando a possível dimensão geracional.
theological_decisions:
- issue: Relação do esplendor divino com a geração seguinte
  choice: sobre os filhos deles
  alternative: aos filhos deles
  rationale: A tradução retém literalmente עַל, sem decidir se o esplendor é apenas mostrado a eles ou repousa/se manifesta sobre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção paralela e a preposição “sobre” preservam a concisão poética e a tensão do hebraico.
