  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: pt
  text: Os dias dos nossos anos chegam a setenta anos e, se houver vigor, a oitenta; mas o seu orgulho é trabalho e sofrimento[a], pois logo passa[b], e nós voamos para longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas o melhor deles é trabalho e sofrimento”. O termo hebraico traduzido por “orgulho” também pode indicar aquilo que há de mais impressionante ou vigoroso nesses anos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois passa depressa” ou “pois é rapidamente cortado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Os dias dos nossos anos
  rationale: Preserva o idiomatismo hebraico e seu tom poético, permanecendo compreensível em português.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: chegam a setenta anos
  rationale: Expressa naturalmente em português a duração total indicada pela construção hebraica.
- source_word: וְאִם בִּגְבוּרֹת
  choice: e, se houver vigor
  rationale: Mantém a condição e apresenta o vigor como aquilo que pode prolongar excepcionalmente a vida.
- source_word: שְׁמֹונִים שָׁנָה
  choice: a oitenta
  rationale: Evita repetição desnecessária de “anos” sem perder o sentido numérico.
- source_word: וְרָהְבָּם
  choice: aquilo que neles é motivo de orgulho
  rationale: Conserva a ideia lexical de orgulho ou ostentação e, ao mesmo tempo, torna clara a referência aos anos; a nota registra a possível acepção de “o melhor deles”.
- source_word: עָמָל וָאָוֶן
  choice: fadiga e sofrimento
  rationale: No contexto da brevidade da vida, os termos descrevem esforço penoso e aflição, não necessariamente maldade moral.
- source_word: כִּי גָז חִישׁ
  choice: pois logo passa
  rationale: Comunica a rapidez com que a vida, ou aquilo que nela se destaca, desaparece, sem decidir entre os matizes de passar e ser cortado.
- source_word: וַנָּעֻפָה
  choice: e nós voamos para longe
  rationale: Preserva a vívida imagem poética do verbo hebraico e a primeira pessoa do plural.
