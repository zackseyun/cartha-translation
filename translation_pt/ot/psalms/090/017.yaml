source:
  edition: WLC
  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: pt
  text: Que o favor do Senhor, nosso Deus, esteja sobre nós[a]. Firma para nós a obra das nossas mãos; sim, firma a obra das nossas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a beleza”, “o agrado” ou “o encanto do Senhor, nosso Deus”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a petição para dar ênfase: “e a obra das nossas mãos, firma-a”.'
    reason: source_form
lexical_decisions:
- source_word: וִיהִי
  choice: Que ... esteja
  rationale: O jussivo de היה expressa desejo ou oração; esta construção comunica naturalmente essa força em português.
- source_word: נֹעַם
  choice: favor
  rationale: O substantivo pode indicar agrado, beleza ou encanto. No contexto da súplica pela estabilidade do trabalho humano, “favor” expressa melhor a benevolência divina, sem eliminar as demais nuances, registradas em nota.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: o Senhor, nosso Deus
  rationale: Preserva os dois títulos divinos e usa uma formulação reverente e corrente em português.
- source_word: עָלֵינוּ
  choice: sobre nós / para nós
  rationale: Na primeira ocorrência, “sobre nós” preserva a imagem do favor divino repousando sobre o povo. Na segunda, ligada a כּוֹנְנָה, “para nós” comunica naturalmente o sentido benefactivo da preposição, evitando a formulação obscura “firma ... sobre nós”.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: a obra das nossas mãos
  rationale: Mantém a imagem concreta do hebraico para o trabalho e as realizações humanas, em linguagem bíblica ainda compreensível.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: firma
  rationale: O verbo כון pede que Deus torne a obra firme, estável e duradoura. “Firma” conserva esse núcleo sem acrescentar a ideia mais estreita de prosperidade.
theological_decisions:
- issue: Sentido de נֹעַם como atributo ou ação favorável de Deus
  choice: favor
  alternative: beleza, agrado ou encanto
  rationale: O contexto favorece a ideia relacional da benevolência de Deus sobre o povo, mas a nota preserva a amplitude estética e afetiva do termo hebraico.
- issue: Relação da segunda ocorrência de עָלֵינוּ com a obra humana
  choice: para nós
  alternative: sobre nós
  rationale: A leitura benefactiva produz português claro e plausível sem transformar o pedido em mera prosperidade. A repetição hebraica de עָלֵינוּ permanece refletida conceitualmente, embora não por uma correspondência portuguesa idêntica.
- issue: Repetição final da petição
  choice: sim, firma a obra das nossas mãos
  alternative: e a obra das nossas mãos, firma-a
  rationale: A repetição enfática foi preservada; “sim” torna sua função retórica natural em português, sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, reverente e poético, com ampla legibilidade brasileira. Mantém “obra das nossas mãos” como imagem concreta e usa “firma” no sentido corrente de tornar firme ou duradouro. Todos os marcadores de nota aparecem no texto.
