  text: מַשְׂכִּ֥יל לְ/דָוִ֑ד בִּ/הְיוֹת֖/וֹ בַ/מְּעָרָ֣ה תְפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/000.yaml
  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: pt
  text: Um masquil[a] de Davi[b], quando ele estava na caverna. Uma oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico masquil, termo técnico usado nos títulos dos salmos; talvez indique uma composição contemplativa ou instrutiva.
    reason: lexical_alternative
  - marker: b
    text: Ou «para Davi» ou «por Davi»; neste título, a expressão hebraica pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: masquil
  rationale: Termo técnico dos títulos dos salmos, de sentido exato incerto. A transliteração preserva o rótulo hebraico sem escolher indevidamente entre sentidos propostos como composição contemplativa ou instrutiva.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, dedicação ou associação. «De Davi» é natural em português e conserva melhor essa amplitude do que «por Davi».
- source_word: בִּהְיוֹתוֹ
  choice: quando ele estava
  rationale: A construção com בְּ e o infinitivo de היה tem valor temporal; esta formulação é clara e natural em português moderno.
- source_word: בַמְּעָרָה
  choice: na caverna
  rationale: O artigo definido do hebraico é preservado. O título parece aludir a um episódio conhecido, mas não identifica qual caverna.
- source_word: תְפִלָּה
  choice: Uma oração
  rationale: O substantivo funciona como indicação de gênero no título; a frase nominal separada preserva sua força titular.
theological_decisions:
- issue: Relação de Davi com o salmo expressa por לְ
  choice: de Davi
  alternative: para Davi; por Davi
  rationale: A formulação evita limitar a expressão hebraica exclusivamente à autoria e mantém abertas as possibilidades de autoria, dedicação ou associação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se «masquil» em minúscula como nome comum transliterado e preserva-se a estrutura breve do título hebraico.
