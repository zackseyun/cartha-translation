base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: pt
  text: Com a minha voz clamo a Yahweh; com a minha voz suplico a Yahweh por misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “imploro o favor de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי
  choice: com a minha voz
  rationale: Preserva a expressão concreta, sua posição enfática e a repetição exata nos dois membros do paralelismo. Embora “em voz alta” seja mais idiomático, poderia acentuar uma ideia de volume que o substantivo hebraico, por si só, não exige.
- source_word: אֶל
  choice: a
  rationale: Expressa a direção do clamor e da súplica para Yahweh de maneira natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶזְעָק
  choice: clamo
  rationale: O verbo זעק indica um apelo vocal intenso. “Clamo” é corrente no registro poético e mantém a força do hebraico sem acrescentar conteúdo.
- source_word: אֶתְחַנָּן
  choice: suplico ... por misericórdia
  rationale: O hitpael de חנן descreve um pedido insistente por favor ou misericórdia. Esta formulação é clara e digna em português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo pelo título tradicional.
- issue: Sentido de אֶתְחַנָּן
  choice: suplico ... por misericórdia
  alternative: imploro favor
  rationale: O verbo comporta as ideias relacionadas de buscar favor e pedir misericórdia. O texto principal explicita “misericórdia”, enquanto a nota conserva a alternativa lexical sem impor uma distinção teológica rígida.
translation_notes:
  register: Português moderno, claro e de tom poético. A repetição “com a minha voz” foi mantida para reproduzir a ênfase e o paralelismo hebraicos; “clamo” e “suplico” conservam dignidade sem recorrer a linguagem arcaica.
