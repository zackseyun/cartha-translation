  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: pt
  text: 'Olha para a minha direita e vê: não há quem me reconheça; não me resta nenhum refúgio[a]; ninguém se importa com a minha vida[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não tenho nenhuma saída”; o termo hebraico pode indicar um lugar ou um meio de fuga.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ninguém busca a minha alma”. Aqui, “alma” (hebraico néfesh) provavelmente significa “vida” ou a própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט
  choice: Olha
  rationale: O imperativo de נבט faz um apelo direto e urgente para observar; “olha” é natural e fiel.
- source_word: יָמִין
  choice: para a minha direita
  rationale: O substantivo indica o lado direito, lugar associado no contexto à presença de um defensor ou apoiador. O possessivo é explicitado naturalmente em português a partir da perspectiva do salmista.
- source_word: וּרְאֵה
  choice: e vê
  rationale: Mantém o segundo imperativo e a ênfase do paralelismo hebraico.
- source_word: מַכִּיר
  choice: me reconheça
  rationale: O particípio de נכר pode expressar reconhecer ou admitir vínculo com alguém; “reconheça” preserva o sentido de abandono social.
- source_word: אָבַד
  choice: não me resta
  rationale: O perfeito de אבד declara que o refúgio desapareceu ou deixou de estar disponível. A formulação portuguesa comunica esse resultado com naturalidade, sem enfraquecer a perda.
- source_word: מָנוֹס
  choice: nenhum refúgio
  rationale: מָנוֹס pode designar lugar ou meio de fuga. “Refúgio” se ajusta ao lamento, enquanto a nota conserva a alternativa “saída”.
- source_word: מִמֶּנִּי
  choice: me resta
  rationale: Embora מן seja literalmente “de mim”, nesta construção indica que o refúgio desapareceu do alcance do salmista; “não me resta” é a equivalência idiomática em português.
- source_word: דּוֹרֵשׁ
  choice: se importa com
  rationale: דרש significa literalmente buscar ou procurar saber; com לְנַפְשִׁי, no contexto de abandono, exprime interesse e cuidado pelo bem-estar da pessoa.
- source_word: לְנַפְשִׁי
  choice: com a minha vida
  rationale: נפש aqui provavelmente designa a vida ou a própria pessoa, não necessariamente uma alma imaterial. “Minha vida” preserva o contexto de perigo e sobrevivência.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto do lamento
  choice: minha vida
  alternative: minha alma; comigo
  rationale: O contexto trata de abandono, proteção e sobrevivência; “vida” representa bem a pessoa viva sem impor uma distinção antropológica posterior. A nota registra a forma tradicional possível.
- issue: Força de דּוֹרֵשׁ לְנַפְשִׁי
  choice: ninguém se importa com a minha vida
  alternative: ninguém busca a minha vida; ninguém procura saber de mim
  rationale: A expressão pode indicar procurar saber da pessoa e, por extensão, cuidar dela. A tradução contextual evita que “busca a minha vida” seja entendida equivocadamente como tentativa de matá-lo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura poética e os dois imperativos foram preservados; formulações excessivamente literais que produziriam ambiguidade enganosa em português foram esclarecidas, com as alternativas relevantes registradas em notas.
