  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: pt
  text: 'Clamei a ti, ó Yahweh;

    disse: “Tu és o meu refúgio,

    a minha porção na terra dos viventes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: Clamei
  rationale: Expressa um grito intenso por socorro e, em português bíblico atual, mantém dignidade e naturalidade.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: Reproduz diretamente a direção do clamor e combina naturalmente com o tratamento por “tu”.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino presente no hebraico; “ó” marca de modo idiomático o vocativo.
- source_word: אָמַרְתִּי
  choice: disse
  rationale: O pretérito perfeito acompanha a sequência narrativa de “clamei” sem intensificar indevidamente o verbo comum אמר.
- source_word: אַתָּה
  choice: Tu és
  rationale: Preserva o pronome explícito e enfático do hebraico; a cópula é necessária em português.
- source_word: מַחְסִי
  choice: o meu refúgio
  rationale: “Refúgio” comunica proteção e é a equivalência corrente do substantivo neste contexto dos Salmos.
- source_word: חֶלְקִי
  choice: a minha porção
  rationale: Mantém a metáfora da parte que cabe a alguém, sem restringi-la interpretativamente a “herança”.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: na terra dos viventes
  rationale: Conserva a expressão hebraica para o âmbito da vida terrena em contraste com a morte ou o Sheol.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio em vocativo. A transliteração preserva esse caráter, em vez de substituí-lo por um título.
- issue: Sentido de חֶלְקִי aplicado a Deus
  choice: minha porção
  alternative: minha herança
  rationale: “Porção” preserva a metáfora e sua amplitude devocional e pactual; “herança” explicitaria apenas uma possível nuance.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento coerente por “tu”. A ordem poética e o paralelismo hebraico foram preservados sem produzir sintaxe artificial. Não há notas, portanto não há marcadores no texto.
