  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: pt
  text: Dá atenção ao meu clamor[a], pois estou muito abatido[b]. Livra-me dos que me perseguem[c], pois são mais fortes do que eu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Escuta atentamente o meu clamor”. O verbo hebraico expressa uma escuta atenta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estou muito fraco” ou “fui reduzido a uma condição muito baixa”. O hebraico expressa abatimento, redução ou fraqueza intensa.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dos meus perseguidores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Dá atenção
  rationale: O imperativo de קשׁב pede uma escuta atenta. A expressão é natural em português e conserva a intensidade da súplica.
- source_word: רִנָּתִי
  choice: ao meu clamor
  rationale: רִנָּה pode indicar um brado intenso; no contexto de lamento, “clamor” comunica adequadamente um grito de socorro.
- source_word: דַלּוֹתִי מְאֹד
  choice: estou muito abatido
  rationale: A forma de דלל expressa redução, fraqueza ou condição rebaixada. “Muito abatido” preserva essa amplitude sem limitar o sentido à pobreza material.
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: נצַל aqui descreve libertação concreta diante de perseguidores. “Livra-me” é corrente na linguagem dos Salmos e não amplia indevidamente o sentido para uma formulação doutrinária de salvação.
- source_word: מֵרֹדְפַי
  choice: dos que me perseguem
  rationale: O particípio de רדף designa aqueles que perseguem ou vão no encalço do salmista. A oração relativa soa mais natural e clara que “meus perseguidores” em português comum.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: são mais fortes do que eu
  rationale: אמץ indica força, e מן estabelece aqui a comparação. A tradução conserva diretamente a desvantagem do salmista diante dos perseguidores.
theological_decisions:
- issue: Possível ampliação teológica do verbo de libertação
  choice: Livra-me
  alternative: Salva-me
  rationale: O pedido se refere especificamente ao livramento diante de perseguidores humanos. “Livra-me” mantém o referente concreto sem excluir, nem introduzir, um sentido soteriológico mais amplo.
- issue: Sentido de דַלּוֹתִי
  choice: estou muito abatido
  alternative: estou muito fraco / fui reduzido a uma condição muito baixa
  rationale: O hebraico admite fraqueza, redução ou rebaixamento. A opção escolhida preserva a condição extrema sem resolver de modo excessivamente estreito sua natureza física, emocional ou social.
translation_notes:
  register: Português moderno, digno e acessível, com cadência própria de oração. “Dá atenção” evita o arcaísmo de “inclina os ouvidos”; “dos que me perseguem” favorece clareza ampla, inclusive para leitores brasileiros.
