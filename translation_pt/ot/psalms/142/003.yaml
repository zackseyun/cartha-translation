  text: בְּ/הִתְעַטֵּ֬ף עָלַ֨/י רוּחִ֗/י וְ/אַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥/י בְּ/אֹֽרַח ז֥וּ אֲהַלֵּ֑ךְ טָמְנ֖וּ פַ֣ח לִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: pt
  text: Quando o meu espírito desfalece dentro de mim[a], tu conheces o meu caminho. Na vereda por onde ando, esconderam uma armadilha para mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando o meu espírito fica abatido dentro de mim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esconderam um laço para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: Quando ... desfalece
  rationale: A preposição בְּ com o infinitivo construto forma uma oração temporal. O verbo pode indicar fraqueza, desfalecimento ou abatimento; “desfalece” preserva a imagem sem a explicar em excesso.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: רוּחַ designa aqui a vida interior do salmista em aflição, e “espírito” é uma tradução direta e natural.
- source_word: עָלַי
  choice: dentro de mim
  rationale: Embora a expressão seja literalmente “sobre mim”, neste idioma relativo ao espírito que desfalece o português natural indica o colapso interior com “dentro de mim”.
- source_word: יָדַעְתָּ
  choice: tu conheces
  rationale: O qatal poético pode ter sentido estativo presente. O presente se ajusta à invocação e expressa o conhecimento atual de Deus.
- source_word: נְתִיבָתִי
  choice: o meu caminho
  rationale: O substantivo indica caminho, trilha ou curso; “caminho” preserva de modo claro a metáfora.
- source_word: בְּאֹרַח
  choice: Na vereda
  rationale: אֹרַח indica caminho ou trilha. “Vereda” evita repetição imediata de “caminho” e mantém a imagem de percurso.
- source_word: זוּ
  choice: por onde
  rationale: זוּ funciona aqui como partícula relativa que introduz a oração modificadora de “vereda”; “por onde” é idiomático em português.
- source_word: אֲהַלֵּךְ
  choice: ando
  rationale: הלך expressa o movimento ou percurso contínuo; “ando” conserva a metáfora e combina naturalmente com “por onde”.
- source_word: טָמְנוּ
  choice: esconderam
  rationale: O verbo significa esconder ou ocultar, especialmente uma armadilha. O pretérito perfeito comunica a ação hostil já realizada.
- source_word: פַח
  choice: uma armadilha
  rationale: פַח designa uma armadilha ou laço. “Armadilha” é claro no português atual, enquanto “laço” permanece como alternativa lexical em nota.
- source_word: לִי
  choice: para mim
  rationale: A preposição marca o salmista como alvo da armadilha; “para mim” conserva a formulação concisa do hebraico.
theological_decisions:
- issue: Conhecimento divino do caminho do salmista
  choice: tu conheces o meu caminho
  alternative: tu conheceste o meu caminho
  rationale: O qatal pode ser vertido como presente estativo neste contexto poético. A tradução mantém o foco no conhecimento de Deus em meio à aflição, sem acrescentar uma afirmação doutrinária além do texto.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a oração dirigida a Deus. A tradução mantém as metáforas do caminho e da armadilha e conserva em notas as principais alternativas lexicais.
