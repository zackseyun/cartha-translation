  text: אֶשְׁפֹּ֣ךְ לְ/פָנָ֣י/ו שִׂיחִ֑/י צָ֝רָתִ֗/י לְ/פָנָ֥י/ו אַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/002.yaml
  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: pt
  text: Derramo diante dele a minha queixa[a]; diante dele exponho a minha aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha meditação” ou “o meu pensamento”. O termo hebraico שִׂיחִי pode ter esses sentidos; neste contexto de lamento, provavelmente se refere a uma queixa expressa em palavras.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha angústia”, “a minha dificuldade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: Derramo
  rationale: Preserva a imagem concreta do qal de שׁפך, “derramar”, e soa natural no contexto de oração e lamento.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Expressa literalmente a ideia de estar perante a face ou presença de Deus. A repetição nos dois membros foi mantida para refletir o paralelismo hebraico.
- source_word: שִׂיחִי
  choice: a minha queixa
  rationale: שִׂיחַ pode indicar reflexão, meditação ou queixa. Neste lamento, em paralelo com “minha aflição”, “queixa” comunica melhor a expressão verbal da dor sem eliminar a alternativa lexical, registrada em nota.
- source_word: צָרָתִי
  choice: a minha aflição
  rationale: צָרָה abrange aflição, angústia e dificuldade. “Aflição” conserva tanto o sofrimento vivido quanto seu peso emocional.
- source_word: אַגִּיד
  choice: exponho
  rationale: O hifil de נגד significa contar, declarar ou tornar conhecido. “Exponho” é natural em português para apresentar abertamente a Deus uma situação angustiante e mantém o paralelismo com “derramo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservou-se a repetição de “diante dele”, característica do paralelismo hebraico, e a metáfora de derramar a queixa.
