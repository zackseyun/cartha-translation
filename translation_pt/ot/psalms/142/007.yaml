source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: pt
  text: Tira a minha alma da prisão, para que eu dê graças ao teu nome; os justos se reunirão ao meu redor[a], pois tu me tratarás com generosidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os justos me cercarão”. A expressão hebraica também pode ser entendida, de modo menos comum, como “os justos se coroarão por minha causa” ou “se gloriarão por minha causa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Tira
  rationale: O imperativo hifil de יצא pede que Deus faça sair. “Tira” é direto e natural em português, sem ampliar o sentido para uma ideia genérica de libertação.
- source_word: מִמַּסְגֵּר
  choice: da prisão
  rationale: מַסְגֵּר designa um lugar ou estado de confinamento. “Prisão” é o equivalente moderno mais claro e mantém aberta a relação entre confinamento concreto e angústia figurada.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode indicar alma, vida ou a própria pessoa. “A minha alma” preserva a expressão hebraica e sua intensidade, sem reduzi-la apenas ao corpo nem definir rigidamente uma antropologia.
- source_word: לְהוֹדוֹת
  choice: para que eu dê graças
  rationale: O infinitivo hifil de ידה expressa aqui propósito e pode significar agradecer ou louvar. “Dar graças” é idiomático com “ao teu nome” e se ajusta ao contexto de livramento esperado.
- source_word: אֶת שְׁמֶךָ
  choice: ao teu nome
  rationale: Mantém a formulação hebraica, na qual o nome representa a identidade e a manifestação pessoal de Deus, sem substituí-lo simplesmente por “a ti”.
- source_word: בִּי יַכְתִּרוּ
  choice: se reunirão ao meu redor
  rationale: A combinação é incomum. O hifil de כתר pode descrever o ato de cercar, e בִּי pode ser entendido em relação ao salmista. “Se reunirão ao meu redor” produz uma imagem natural da comunidade que participa de sua gratidão, enquanto as alternativas são registradas em nota.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo substantivado refere-se a pessoas justas. “Os justos” é conciso, digno e corrente na linguagem bíblica portuguesa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da resposta dos justos e da gratidão do salmista. “Pois” mantém claramente essa ligação lógica.
- source_word: תִגְמֹל עָלַי
  choice: tu me tratarás com generosidade
  rationale: גמל com על pode indicar a maneira como alguém trata outra pessoa, inclusive com recompensa ou benefício. No contexto da súplica por livramento, “tratarás com generosidade” comunica a ação benéfica esperada sem afirmar que ela foi merecida.
theological_decisions:
- issue: Se a frase final ensina uma recompensa baseada em mérito
  choice: A ação generosa de Deus em favor do salmista
  alternative: Deus me recompensará segundo o meu mérito
  rationale: O contexto é de lamento e expectativa de livramento. Como גמל pode denotar tanto retribuição quanto tratamento benéfico, a tradução preserva a expectativa positiva sem introduzir uma doutrina de mérito que o versículo não exige.
- issue: Sentido da resposta dos justos
  choice: Os justos se reunirão ao redor do salmista
  alternative: Os justos o cercarão; ou se gloriarão por causa dele
  rationale: A construção hebraica admite mais de uma análise. O texto principal apresenta a leitura contextual mais natural, e a nota conserva as alternativas reais sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a progressão da súplica para a gratidão comunitária foram preservados; evitou-se linguagem excessivamente técnica ou denominacional.
