  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: pt
  text: 'Bens e riquezas há em sua casa,

    e sua justiça permanece para sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua retidão permanece para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: bens
  rationale: הוֹן designa patrimônio, posses ou riqueza material. “Bens” preserva essa ideia e mantém distinção natural em relação a עֹשֶׁר.
- source_word: וָעֹשֶׁר
  choice: e riquezas
  rationale: עֹשֶׁר costuma indicar riqueza ou abundância. “Riquezas” forma com “bens” um par poético claro, sem fundir os dois substantivos.
- source_word: בְּבֵיתוֹ
  choice: há em sua casa
  rationale: בַּיִת pode significar casa ou família doméstica. “Em sua casa” conserva a imagem concreta do hebraico e permite que o sentido mais amplo de âmbito doméstico permaneça implícito.
- source_word: וְצִדְקָתוֹ
  choice: e sua justiça
  rationale: צְדָקָה abrange justiça, retidão e conduta justa. “Justiça” é natural em português e preserva a dimensão ética do termo; “retidão” continua sendo uma alternativa legítima, indicada em nota.
- source_word: עֹמֶדֶת
  choice: permanece
  rationale: O particípio de עמד traz a ideia de estar firme ou continuar. “Permanece” comunica com naturalidade a duração e a estabilidade expressas pela metáfora hebraica.
- source_word: לָעַד
  choice: para sempre
  rationale: לָעַד expressa continuidade duradoura. “Para sempre” é a formulação corrente e digna em português.
theological_decisions:
- issue: Sentido de “sua justiça” no contexto de bênção material
  choice: A expressão descreve a justiça ou retidão duradoura da pessoa temente a Deus, sem definir tecnicamente como essa qualidade se manifesta.
  alternative: Entendê-la especificamente como generosidade duradoura, vindicação pactual por Deus ou referência a uma doutrina posterior de justiça imputada.
  rationale: O sujeito do salmo é a pessoa que teme o SENHOR, e o possessivo hebraico deve ser mantido sem introduzir categorias doutrinárias não explicitadas. O campo semântico de צְדָקָה também permite a nuance de retidão, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Bens e riquezas” evita repetição pouco natural, enquanto “permanece para sempre” transmite de modo idiomático a permanência de עֹמֶדֶת לָעַד.
