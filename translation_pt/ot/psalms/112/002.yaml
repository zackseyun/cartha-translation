  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: pt
  text: Sua descendência[b] será poderosa na terra[a]; a geração dos íntegros será abençoada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país”. O hebraico אֶרֶץ pode significar “terra” ou “país/território”; o contexto não exige uma escolha mais específica.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus descendentes”. O termo hebraico traduzido por “descendência” tem sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: poderosa
  rationale: Aqui, o termo predica força, influência ou destaque da descendência, sem defini-la especificamente como guerreira. “Poderosa” conserva o tom elevado e a amplitude semântica.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar tanto a terra habitada em sentido amplo quanto uma terra ou território específico. “Na terra” é natural em português e preserva essa abertura contextual.
- source_word: יִהְיֶה
  choice: será
  rationale: Expressa de modo simples e atual o valor futuro da forma verbal, adequado ao caráter de promessa ou bênção do versículo.
- source_word: זַרְעוֹ
  choice: sua descendência
  rationale: זֶרַע é um coletivo que se refere aos descendentes. “Descendência” comunica naturalmente esse sentido coletivo e evita o arcaísmo de “semente”.
- source_word: דּוֹר
  choice: a geração
  rationale: No sintagma construto דּוֹר יְשָׁרִים, “a geração dos íntegros” apresenta o grupo como uma classe, de forma clara em português.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: יָשָׁר enfatiza retidão e integridade moral. “Íntegros” preserva a distinção lexical em relação a termos hebraicos mais diretamente vertidos por “justos”.
- source_word: יְבֹרָךְ
  choice: será abençoada
  rationale: Mantém explicitamente a linguagem de bênção de ברך e sua voz passiva, sem reduzi-la apenas a prosperidade material.
theological_decisions:
- issue: Alcance da linguagem de bênção em um salmo de sabedoria
  choice: Manter a afirmação ampla de força e bênção sobre a descendência ou geração, sem restringi-la à prosperidade material nem à salvação espiritual garantida.
  alternative: Entender a bênção exclusivamente como prosperidade material ou, no outro extremo, como garantia de salvação espiritual dos descendentes.
  rationale: O hebraico emprega linguagem ampla de força e bênção no horizonte sapiencial. A tradução deve conservar essa abrangência e a tensão teológica, sem introduzir uma definição doutrinária mais estreita do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e evita linguagem arcaica. Os marcadores seguem a ordem em que aparecem no texto.
