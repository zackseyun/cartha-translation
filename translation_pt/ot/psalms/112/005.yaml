lexical_decisions:
- source_word: טוֹב
  choice: Feliz é
  rationale: O adjetivo predicativo inicial descreve a condição favorável do homem, com tom semelhante ao de uma bem-aventurança; “Feliz é” comunica isso naturalmente em português.
- source_word: אִישׁ
  choice: o homem
  rationale: Preserva o substantivo masculino singular representativo do hebraico, sem impedir seu sentido geral.
- source_word: חוֹנֵן
  choice: é bondoso
  rationale: Expressa a ação habitual de mostrar favor ou benevolência; “bondoso” é corrente e não restringe o sentido apenas à generosidade material.
- source_word: וּמַלְוֶה
  choice: e empresta
  rationale: Traduz diretamente o particípio causativo de לוה, mantendo a ação econômica sem acrescentar a ideia não explícita de gratuidade.
- source_word: יְכַלְכֵּל
  choice: conduz
  rationale: Neste contexto, o verbo indica administrar ou conduzir os próprios assuntos; a escolha forma uma expressão portuguesa clara e digna.
- source_word: דְּבָרָיו
  choice: seus negócios
  rationale: דבר pode designar palavras, coisas ou assuntos. Aqui, junto de “conduz” e no contexto de empréstimos, “negócios” comunica naturalmente os assuntos e transações da pessoa, sem se limitar a atividade comercial.
- source_word: בְּמִשְׁפָּט
  choice: com justiça
  rationale: Preserva a força ética e jurídica de מִשְׁפָּט de modo conciso e natural.
