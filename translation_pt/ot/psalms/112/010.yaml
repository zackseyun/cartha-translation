id: PSA.112.10
reference: Psalms 112:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: pt
  text: O perverso verá e ficará irado[a]; rangerá os dentes e se desfará. O desejo dos perversos perecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os perversos verão e ficarão irados”. No hebraico, “o perverso” está no singular, mas representa toda essa classe de pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado masculino singular é preservado em português por uma expressão natural e representativa, sem acrescentar um substantivo ausente no hebraico.
- source_word: יִרְאֶה
  choice: verá
  rationale: 'O imperfeito qal tem aqui sentido futuro/resultativo no contexto poético: o perverso verá o destino próspero do justo descrito anteriormente.'
- source_word: וְכָעָס
  choice: e ficará irado
  rationale: O perfeito ligado por conjunção dá continuidade à sequência verbal; a formulação comunica de modo claro a ira ou irritação indicada por כעס.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: rangerá os dentes
  rationale: Mantém a imagem hebraica e sua força idiomática de raiva e frustração, sendo também natural em português.
- source_word: וְנָמָס
  choice: e se desfará
  rationale: Preserva a metáfora de dissolver-se ou derreter-se sem impor uma interpretação física específica; em português, expressa poeticamente o colapso do perverso.
- source_word: תַּאֲוַת
  choice: o desejo
  rationale: Termo amplo e natural que abrange desejo, anseio ou cobiça, preservando a formulação concisa do hebraico.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Reproduz o plural substantivado em construção com תַּאֲוַת e mantém o vínculo lexical com o singular do início do versículo.
- source_word: תֹּאבֵד
  choice: perecerá
  rationale: Expressa o fracasso completo e definitivo do desejo dos perversos, concordando com o substantivo singular 'desejo'.
theological_decisions:
- issue: Caráter representativo do masculino singular רָשָׁע
  choice: o perverso
  alternative: os perversos
  rationale: O texto principal conserva o masculino singular gramatical do hebraico, que funciona como representante de uma classe. A nota registra uma tradução coletiva possível sem restringir a referência exclusivamente a homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva o paralelismo poético, a alternância entre o singular representativo e o plural coletivo, e a imagem vívida de alguém que se desfaz em frustração.
