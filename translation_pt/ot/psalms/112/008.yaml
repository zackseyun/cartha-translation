  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: pt
  text: Seu coração está firme; ele não terá medo até que veja seus adversários.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica, literalmente “até que veja os seus adversários”, pode, neste contexto, referir-se a contemplar sua vindicação diante deles ou sobre eles. Não implica que ele passe a ter medo depois desse momento.
    reason: Esclarece o sentido contextual da expressão hebraica e evita que “até” seja entendido como uma reversão posterior da confiança, sem acrescentar ao texto uma derrota explicitamente não enunciada.
lexical_decisions:
- source_word: סָמוּךְ
  choice: está firme
  rationale: O particípio passivo de סמך descreve algo sustentado, seguro ou firmemente estabelecido. No contexto do coração, “está firme” expressa estabilidade interior em português natural.
- source_word: לִבּוֹ
  choice: seu coração
  rationale: לֵב designa o centro da reflexão, da vontade e da disposição interior. “Coração” mantém a imagem poética e sua amplitude semântica.
- source_word: לֹא יִירָא
  choice: ele não terá medo
  rationale: O imperfeito de ירא admite valor futuro ou durativo. O futuro comunica aqui a confiança constante do justo e se ajusta à oração temporal seguinte.
- source_word: עַד אֲשֶׁר
  choice: até
  rationale: A locução introduz normalmente um limite ou ponto culminante temporal. “Até” é seu equivalente direto e natural, embora a construção não implique necessariamente que o medo comece depois desse momento.
- source_word: יִרְאֶה בְצָרָיו
  choice: ver a derrota de seus adversários
  rationale: ראה com ב diante de inimigos pode indicar presenciar com satisfação a vindicação contra eles. Como uma tradução estritamente literal seria enganosa em português, “ver a derrota” explicita o resultado hostil implícito no idioma; a nota registra a forma literal e sua ambiguidade.
- source_word: צָרָיו
  choice: seus adversários
  rationale: צַר pode designar inimigos, oponentes ou pessoas hostis. “Adversários” preserva essa abrangência em registro poético digno.
theological_decisions:
- issue: Natureza da vindicação sobre os adversários
  choice: Traduzir a expressão como “ver a derrota de seus adversários” sem especificar como isso ocorre
  alternative: Traduzir literalmente “ver seus adversários” ou acrescentar que Deus os destrói
  rationale: O contexto aponta para a vindicação do justo diante de seus oponentes, mas o versículo não descreve o meio nem atribui explicitamente a ação nesta linha. A tradução evita tanto uma leitura portuguesa enganosa quanto a importação de detalhes teológicos ausentes.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Está firme” e “não terá medo” são acessíveis em diferentes variedades do português; “adversários” conserva o tom poético sem soar arcaico.
