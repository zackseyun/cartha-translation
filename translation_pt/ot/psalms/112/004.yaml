  text: זָ֘רַ֤ח בַּ/חֹ֣שֶׁךְ א֭וֹר לַ/יְשָׁרִ֑ים חַנּ֖וּן וְ/רַח֣וּם וְ/צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: pt
  text: Na escuridão, a luz nasce para os íntegros[a]; ele é bondoso, compassivo e justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na escuridão, a luz nasce para os íntegros, bondosa, compassiva e justa”. Os adjetivos finais também podem ecoar o caráter do SENHOR em Salmo 111:4.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  choice: nasce
  rationale: O verbo descreve o despontar da luz. O presente poético expressa de modo natural em português uma realidade característica, sem perder a força perfectiva do hebraico no contexto.
- source_word: בַּחֹשֶׁךְ
  choice: na escuridão
  rationale: Representa a preposição e o artigo hebraicos e conserva o possível valor tanto literal quanto metafórico.
- source_word: אוֹר
  choice: a luz
  rationale: É o sujeito gramatical da oração. Em português, o artigo definido produz uma formulação poética e natural sem exigir que o substantivo hebraico seja definido.
- source_word: לַיְשָׁרִים
  choice: para os íntegros
  rationale: Íntegros comunica retidão moral e mantém distinção lexical em relação a צַדִּיק, traduzido como justo.
- source_word: חַנּוּן
  choice: bondoso
  rationale: Expressa a disposição de conceder favor e fazer o bem. É claro ao leitor moderno e se aplica naturalmente ao possível referente humano, embora 'cheio de graça' também seja possível.
- source_word: רַחוּם
  choice: compassivo
  rationale: Preserva a ideia de compaixão ou terna misericórdia e distingue o termo de חַנּוּן.
- source_word: צַדִּיק
  choice: justo
  rationale: Transmite a qualidade moral de quem age retamente e mantém uma distinção natural em português em relação a 'íntegros'.
theological_decisions:
- issue: Referente dos três adjetivos finais (חַנּוּן וְרַחוּם וְצַדִּיק)
  choice: São apresentados como descrição do homem justo singular do Salmo 112, mediante o pronome explícito 'ele'.
  alternative: Os adjetivos podem qualificar poeticamente a luz ou ecoar o caráter do SENHOR em Salmo 111:4.
  rationale: Embora 'os íntegros' esteja no plural, os adjetivos estão no singular, e o salmo descreve repetidamente o justo no singular. Ao mesmo tempo, a formulação ecoa atributos divinos de Salmo 111:4; por isso, a ambiguidade e a tensão intertextual são registradas em nota, sem serem resolvidas dogmaticamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A inversão inicial preserva o movimento poético do hebraico. O marcador [a] aparece no texto principal.
