  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: pt
  text: Não terá medo de más notícias[a]; seu coração está firme[b], confiante em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma notícia ruim” ou “de um relato de desgraça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está seguro” ou “está estabelecido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: de más notícias
  rationale: A combinação de מִן com שְׁמוּעָה רָעָה indica aquilo diante do qual ele não teme; “más notícias” é natural em português e expressa conteúdo adverso, não maldade moral.
- source_word: לֹא יִירָא
  choice: não terá medo
  rationale: O imperfeito, neste salmo sapiencial, pode exprimir conduta característica ou projeção futura; “não terá medo” preserva essa força.
- source_word: נָכוֹן
  choice: está firme
  rationale: O termo descreve o coração como estabelecido, estável ou resoluto; “firme” é claro, digno e idiomático.
- source_word: לִבּוֹ
  choice: seu coração
  rationale: “Coração” preserva a imagem hebraica da interioridade, incluindo disposição, vontade e confiança.
- source_word: בָּטֻחַ
  choice: confiante
  rationale: A forma descreve um estado de segurança ou confiança. “Confiante” liga-se naturalmente ao complemento introduzido por בְּ.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição marca aquele em quem se deposita a confiança, e o nome divino יְהוָה é representado diretamente como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva no texto o caráter de nome próprio sem substituí-lo por um título.
- issue: Relação entre firmeza interior e confiança em Deus
  choice: “seu coração está firme, confiante em Yahweh”
  alternative: “seu coração está seguro porque confia em Yahweh”
  rationale: Mantém a justaposição do hebraico sem tornar explicitamente causal uma relação que o verso apresenta de modo compacto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém o paralelismo compacto do hebraico, a metáfora do coração e o nome divino transliterado.
