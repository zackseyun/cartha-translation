  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: pt
  text: Pois nunca será abalado; o justo[a] será lembrado para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui o masculino singular, referindo-se de modo representativo à pessoa justa em geral.
    reason: Esclarecer o uso genérico do masculino singular sem apagar a forma do texto-fonte.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a função explicativa do conectivo em relação ao contexto anterior, com fluência natural em português.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: nunca será abalado
  rationale: A combinação de לְעוֹלָם com a negação expressa permanência enfática; o nifal de מוט comunica a ideia de ser abalado ou perder a estabilidade.
- source_word: לְזֵכֶר עוֹלָם
  choice: será lembrado para sempre
  rationale: Expressa de modo natural a ideia hebraica de permanecer em memória duradoura.
- source_word: צַדִּיק
  choice: o justo
  rationale: Mantém o substantivo adjetival masculino singular do hebraico sem acrescentar a palavra 'homem'; no gênero sapiencial, representa a pessoa justa em geral.
- source_word: יִהְיֶה
  choice: será
  rationale: Reproduz o valor copular e prospectivo da forma verbal no contexto.
theological_decisions:
- issue: Masculino singular representativo em צַדִּיק
  choice: o justo
  alternative: a pessoa justa
  rationale: A tradução conserva a forma masculina singular do hebraico e sua figura individual representativa, enquanto a nota esclarece que a afirmação se aplica genericamente à pessoa justa.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Abalado” preserva a imagem poética de estabilidade, e “lembrado para sempre” comunica naturalmente a memória duradoura.
