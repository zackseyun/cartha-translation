source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: pt
  text: Louvem Yah![a] Feliz é o homem[b] que teme a Yahweh e tem grande prazer em seus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, tradicionalmente: “Aleluia!”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o homem”; nesta máxima sapiencial, a forma masculina singular é usada em sentido genérico.'
    reason: cultural_note
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz de modo transparente o imperativo plural הַלְלוּ e preserva a forma breve do nome divino, יָהּ, como “Yah”. A forma tradicional “Aleluia” é registrada em nota.
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Introduz uma declaração sapiencial sobre a condição digna de admiração daquele que teme a Deus. “Feliz” é claro e natural em português atual, sem reduzir a expressão a uma emoção passageira.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o substantivo masculino singular do hebraico, usado aqui com valor representativo numa máxima sapiencial; a nota esclarece esse uso genérico.
- source_word: יָרֵא אֶת יְהוָה
  choice: que teme Yahweh
  rationale: “Teme” conserva o sentido primário de יָרֵא e a tensão entre temor, reverência e assombro diante de Deus, sem suavizá-lo para mero respeito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּמִצְוֺתָיו
  choice: em seus mandamentos
  rationale: Preserva tanto o valor da preposição ב, que indica o objeto ou âmbito do prazer, quanto o peso formal de מִצְוֺתָיו, “seus mandamentos”.
- source_word: חָפֵץ מְאֹד
  choice: tem grande prazer
  rationale: Expressa de maneira idiomática em português o prazer intenso indicado pelo verbo חָפֵץ e pelo intensificador מְאֹד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título ou adotar outra forma tradicional.
- issue: Forma masculina singular אִישׁ em sentido representativo
  choice: o homem
  alternative: a pessoa
  rationale: A tradução mantém a forma gramatical da máxima sapiencial hebraica, enquanto a nota informa que seu alcance é genérico.
- issue: Sentido de יָרֵא diante de Yahweh
  choice: teme
  alternative: reverencia
  rationale: “Teme” preserva a amplitude e a tensão teológica do termo hebraico, que inclui temor reverente, sem restringi-lo a simples respeito.
translation_notes:
  register: Português moderno, claro e digno, com cadência sapiencial. A formulação conserva o paralelismo conceitual entre temer Yahweh e ter grande prazer em seus mandamentos, bem como a distinção entre a forma breve “Yah” e o nome “Yahweh”.
