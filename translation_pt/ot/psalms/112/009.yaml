id: PSA.112.9
reference: Psalms 112:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: pt
  text: Ele distribuiu generosamente[a] e deu aos pobres. Sua justiça[b] permanece para sempre; seu chifre[c] será erguido com honra.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “espalhou” ou “dispersou”; aqui, no sentido de repartir com liberalidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”. O termo hebraico pode abranger tanto justiça quanto conduta reta.
    reason: lexical_alternative
  - marker: c
    text: “Chifre” é uma metáfora hebraica de força, dignidade ou posição exaltada.
    reason: cultural_note
  - marker: d
    text: Ou “será exaltado em glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: distribuiu generosamente
  rationale: O verbo descreve espalhar ou dispersar. No contexto da generosidade para com os necessitados, a expressão comunica uma distribuição ampla e liberal, sem perder inteiramente a imagem de espalhar.
- source_word: נָתַן
  choice: deu
  rationale: Tradução direta do perfeito hebraico, preservando o paralelismo poético com “distribuiu generosamente”.
- source_word: לָאֶבְיוֹנִים
  choice: aos pobres
  rationale: אֶבְיוֹן designa pessoas pobres ou necessitadas; “aos pobres” é claro, conciso e natural em português.
- source_word: צִדְקָתוֹ
  choice: sua justiça
  rationale: צְדָקָה abrange justiça e retidão. “Justiça” preserva a dimensão ética e teológica sem restringir a expressão apenas à esmola.
- source_word: עֹמֶדֶת לָעַד
  choice: permanece para sempre
  rationale: A construção expressa duração permanente. “Permanece para sempre” é natural em português e conserva o sentido da imagem hebraica de algo que continua firme.
- source_word: קַרְנוֹ
  choice: seu chifre
  rationale: A metáfora hebraica do chifre representa força, dignidade ou posição exaltada. Mantê-la no texto preserva a imagem poética da fonte, com explicação em nota.
- source_word: תָּרוּם
  choice: será erguido
  rationale: O verbo indica elevação ou exaltação. “Será erguido” preserva tanto a imagem concreta do chifre quanto o sentido figurado de exaltação.
- source_word: בְּכָבוֹד
  choice: com honra
  rationale: כָּבוֹד pode significar honra ou glória. Neste salmo sapiencial, “com honra” comunica dignidade e reconhecimento público sem excluir a nuance de glória.
theological_decisions:
- issue: Sentido de “sua justiça” em relação à generosidade
  choice: A expressão designa a justiça ou retidão duradoura da pessoa generosa, incluindo sua conduta para com os pobres sem reduzi-la exclusivamente à esmola.
  alternative: Entender a expressão especificamente como suas obras de caridade ou, de modo mais restrito, como justiça pactual.
  rationale: O contexto liga a generosidade à justiça, mas o substantivo hebraico tem alcance moral e teológico mais amplo. A tradução evita tanto uma afirmação sobre mérito salvífico quanto a redução do texto à filantropia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo foi mantido, e a metáfora hebraica do chifre foi preservada em vez de ser substituída silenciosamente por sua interpretação.
