  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: pt
  text: Minha alma tem sede de Deus, do Deus vivo. Quando irei e comparecerei diante de Deus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a face de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: tem sede
  rationale: Preserva a metáfora concreta da sede e, em português natural, comunica o desejo contínuo expresso no contexto poético.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Mantém o idioma hebraico e a ênfase na pessoa interior, sem reduzi-lo simplesmente a “eu”.
- source_word: לֵאלֹהִים
  choice: de Deus
  rationale: Com “ter sede”, a preposição portuguesa “de” indica naturalmente aquilo que se deseja intensamente.
- source_word: לְאֵל חָי
  choice: do Deus vivo
  rationale: É a forma definida, natural e tradicional de expressar אֵל חָי em português.
- source_word: מָתַי
  choice: Quando
  rationale: Traduz diretamente a pergunta temporal, sem acrescentar a nuance mais interpretativa de “Até quando”.
- source_word: אָבוֹא
  choice: irei
  rationale: No contexto da ida à presença divina, o futuro de “ir” soa natural em português e expressa a expectativa de acesso.
- source_word: וְאֵרָאֶה
  choice: comparecerei
  rationale: Representa a forma nifal como “aparecer/comparecer” perante Deus e se ajusta à linguagem de peregrinação e culto.
- source_word: פְּנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: Comunica de modo idiomático a presença de Deus, preservando a força relacional e cultual da expressão.
theological_decisions:
- issue: Tradução do idioma פְּנֵי אֱלֹהִים
  choice: diante de Deus
  alternative: a face de Deus; diante da face de Deus
  rationale: O verso expressa o anseio de entrar na presença de Deus, provavelmente no contexto do culto. “Diante de Deus” transmite esse sentido sem resolver a expressão como uma afirmação sobre ver fisicamente a essência divina; a forma literal é conservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Minha alma tem sede” conserva a imagem poética; “comparecerei diante de Deus” mantém o sentido cultual e a ambiguidade legítima da expressão hebraica.
