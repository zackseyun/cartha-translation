base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: pt
  text: Meu Deus, minha alma está abatida dentro de mim; por isso me lembro de ti[b], da terra do Jordão, dos Hermons[a] e do monte Mizar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Hermons”, no plural; pode referir-se ao maciço ou aos picos do Hermom.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por isso me lembrarei de ti”. O verbo hebraico pode expressar uma resolução presente ou uma ação futura neste contexto.'
    reason: lexical_alternative
  - marker: c
    text: “Monte Mizar” pode ser um nome de lugar; alternativamente, “monte pequeno” ou “colina Mizar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: A forma com sufixo de primeira pessoa significa “meu Deus” e pode funcionar como invocação direta, sem necessidade de acrescentar uma interjeição.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: minha alma está abatida dentro de mim
  rationale: Preserva “minha alma” e expressa em português natural a imagem de ela estar curvada ou prostrada no íntimo do salmista.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: Marca de modo claro e natural a relação entre o abatimento e o ato de se lembrar de Deus.
- source_word: אֶזְכָּרְךָ
  choice: me lembro de ti
  rationale: O imperfeito poético admite ação presente ou resolução futura; o presente é natural no contexto, e a alternativa futura é registrada em nota.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: desde a terra do Jordão
  rationale: Mantém o sentido geográfico da região associada ao Jordão; “desde” comunica que o salmista se lembra de Deus a partir desse lugar.
- source_word: וְחֶרְמוֹנִים
  choice: e dos Hermons
  rationale: Reproduz o plural incomum do hebraico, provavelmente referente ao maciço, às elevações ou aos picos do Hermom.
- source_word: מֵהַר מִצְעָר
  choice: desde o monte Mizar
  rationale: Trata Mizar como topônimo, opção adequada no paralelismo geográfico, sem apagar a possível associação lexical com pequenez.
theological_decisions: []
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. Mantém “alma” e o plural hebraico “Hermons”; emprega “ti” em coerência com a invocação direta e “desde” no sentido de localização de onde parte a lembrança.
