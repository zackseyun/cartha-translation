source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: pt
  text: Como um cervo anseia[a] por correntes de água[b], assim a minha alma[c] anseia por ti, ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofega por”; o verbo hebraico pode evocar o ofegar causado por sede intensa.
    reason: lexical_alternative
  - marker: b
    text: Ou “cursos de água” ou “canais de água”.
    reason: lexical_alternative
  - marker: c
    text: “Minha alma” também pode ser entendido como “minha vida”, “todo o meu ser” ou “eu mesmo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Como a corça
  rationale: O substantivo אַיָּל designa um cervídeo e pode referir-se especificamente ao veado macho; porém, o feminino “corça” é tradicional, natural e poeticamente expressivo em português, sem alterar o núcleo da comparação.
- source_word: תַּעֲרֹג
  choice: anseia
  rationale: O verbo ערג expressa desejo intenso, possivelmente evocando a respiração ofegante causada pela sede. “Anseia” comunica essa intensidade em português atual e funciona naturalmente tanto com a corça quanto com a alma.
- source_word: עַל
  choice: pelas
  rationale: Com “anseia” e o objeto desejado, a preposição hebraica é representada idiomaticamente por “por”, contraída com o artigo plural.
- source_word: אֲפִיקֵי מָיִם
  choice: correntes de água
  rationale: A expressão pode designar canais, leitos ou cursos por onde corre água. “Correntes de água” preserva a imagem aquática plural em linguagem poética e compreensível.
- source_word: כֵּן
  choice: assim
  rationale: Marca de modo claro e conciso a segunda parte da comparação.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode denotar alma, vida ou o próprio ser. “A minha alma” conserva o registro devocional e poético sem exigir, por si só, uma antropologia dualista.
- source_word: אֵלֶיךָ
  choice: por ti
  rationale: Embora אֶל indique direção, o português idiomático exige “ansiar por”; a escolha preserva a orientação pessoal do desejo para Deus.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O vocativo é indicado naturalmente pela interjeição “ó”, adequada ao tom poético e orante.
theological_decisions:
- issue: Amplitude antropológica de נַפְשִׁי
  choice: a minha alma
  alternative: a minha vida; todo o meu ser; eu mesmo
  rationale: O termo hebraico pode abranger a pessoa inteira, sua vida ou seu ser interior, e não impõe uma separação rígida entre corpo e alma. A tradução mantém a formulação bíblica consagrada, enquanto a nota registra a amplitude semântica.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. O paralelismo hebraico foi preservado mediante “Como... assim...”. Preferiu-se “ti” no discurso direto a Deus, forma corrente no registro bíblico e compatível com o singular hebraico.
