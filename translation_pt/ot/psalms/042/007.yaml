  source_fidelity: 'O sentido central está bem preservado: תְּהוֹם é mantido na repetição poética, קוֹרֵא no presente vívido, e as águas continuam explicitamente como «tuas». «Ao som de» representa adequadamente לְקוֹל, e «passaram sobre mim» traduz de modo direto עָבָרוּ עָלַי. A distinção entre מִשְׁבָּרִים (ondas que se quebram/breakers) e גַּלִּים (ondas, vagas) deve, porém, ser expressa sem a repetição pouco natural de «ondas».'
  naturalness: «Um abismo chama outro abismo» é claro e conserva a força proverbial e poética da formulação. Na segunda oração, «ondas revoltas e as tuas ondas» soa repetitivo em português e não diferencia com suficiente elegância os dois termos hebraicos. «Ondas revoltas e vagas» é mais fluente e mantém a dupla imagem marítima.
  terminology: «Abismo» e «cataratas» são escolhas aceitáveis no registro poético moderno. «Cataratas» comunica bem a força das quedas de água no contexto, sem exigir uma identificação técnica única para צִנּוֹרֶיךָ. «Vagas» é uma alternativa poética ainda compreensível para גַּלִּים e permite distinguir o termo de «ondas revoltas», para מִשְׁבָּרֶיךָ.
