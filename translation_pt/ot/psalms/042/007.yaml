    rationale: A formulação «todas as tuas ondas revoltas e as tuas ondas» tenta refletir dois substantivos hebraicos distintos, mas em português fica desajeitada. Substituir o segundo por «vagas» preserva tanto a distinção lexical quanto o paralelismo poético.
  - severity: low
