  text: תְּהֽוֹם אֶל תְּה֣וֹם ק֭וֹרֵא לְ/ק֣וֹל צִנּוֹרֶ֑י/ךָ כָּֽל מִשְׁבָּרֶ֥י/ךָ וְ֝/גַלֶּ֗י/ךָ עָלַ֥/י עָבָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: pt
  text: Um abismo chama outro abismo ao som das tuas cataratas[a]; todas as tuas ondas revoltas e vagas[b] passaram sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «das tuas torrentes»; o termo hebraico também pode indicar canais ou condutos de água.
    reason: lexical_alternative
  - marker: b
    text: Ou «todas as tuas ondas que se quebram e as tuas ondas passaram por cima de mim».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: um abismo ... outro abismo
  rationale: Preserva a repetição poética e a imagem das profundezas aquáticas, enquanto a construção portuguesa expressa naturalmente a relação entre os dois termos.
- source_word: קוֹרֵא
  choice: chama
  rationale: Reproduz diretamente o particípio verbal e mantém o presente vívido da poesia.
- source_word: לְקוֹל
  choice: ao som de
  rationale: Expressa de modo idiomático o contexto auditivo ou a ocasião do chamado sem definir com excessiva precisão a função da preposição.
- source_word: צִנּוֹרֶיךָ
  choice: tuas cataratas
  rationale: No contexto de águas estrondosas e avassaladoras, «cataratas» comunica tanto a queda de água quanto seu forte ruído; o termo hebraico também pode designar canais ou torrentes.
- source_word: כָּל
  choice: todas
  rationale: Mantém a força totalizante do hebraico.
- source_word: מִשְׁבָּרֶיךָ
  choice: tuas ondas revoltas
  rationale: Comunica as ondas que se quebram com violência de modo claro em português, distinguindo-as do termo seguinte.
- source_word: וְגַלֶּיךָ
  choice: e as tuas ondas
  rationale: É a tradução simples e corrente de גַּל e preserva o paralelismo aquático.
- source_word: עָלַי
  choice: sobre mim
  rationale: Mantém a imagem das águas cobrindo e vencendo o salmista.
- source_word: עָבָרוּ
  choice: passaram
  rationale: Representa diretamente o perfeito hebraico como ação experimentada pelo salmista, sem acrescentar ao verbo a ideia interpretativa de arrastar.
theological_decisions:
- issue: As águas são atribuídas a Deus pelos sufixos de segunda pessoa.
  choice: Manter «tuas» em ambos os membros.
  alternative: Neutralizar como fenômenos naturais sem referência explícita a Deus.
  rationale: O hebraico atribui diretamente a Deus as cataratas e as ondas, criando uma tensão teológica entre o sofrimento do salmista e a soberania divina; essa tensão não deve ser suavizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Abismo» conserva a intensidade poética; «cataratas» é corrente no sentido de grandes quedas de água. A repetição de «ondas» reflete dois vocábulos hebraicos próximos, mas «ondas revoltas» diferencia o primeiro como ondas que se quebram.
