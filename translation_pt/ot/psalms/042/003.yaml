  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: pt
  text: 'Minhas lágrimas têm sido o meu pão de dia e de noite[a], enquanto me dizem o dia inteiro: “Onde está o seu Deus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha lágrima tem sido o meu pão”; em hebraico, o singular pode ter sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: têm sido o meu
  rationale: A construção היה + ל indica aquilo em que algo se tornou ou a função que passou a exercer para o falante. “Têm sido o meu” preserva esse sentido resultativo e é natural em português.
- source_word: דִמְעָתִי
  choice: minhas lágrimas
  rationale: Embora a forma hebraica seja morfologicamente singular, o substantivo pode ter sentido coletivo. O plural em português expressa naturalmente o contexto de lamento.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém a imagem concreta e vigorosa do hebraico, sem generalizá-la como “alimento”.
- source_word: יוֹמָם וָלָיְלָה
  choice: de dia e de noite
  rationale: Expressão portuguesa corrente que conserva o merismo hebraico de duração contínua.
- source_word: בֶּאֱמֹר
  choice: enquanto me dizem
  rationale: A preposição ב com o infinitivo construto indica ação contemporânea; “enquanto” comunica que a provocação acompanha o choro contínuo.
- source_word: אֵלַי
  choice: me
  rationale: O pronome oblíquo em “me dizem” expressa de modo natural a direção da fala para o salmista.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressa em português moderno a repetição ou continuidade da provocação ao longo de todo o dia.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Reproduz diretamente a pergunta provocadora, sem explicar além do que o hebraico afirma.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: A forma é masculina singular de segunda pessoa. “Seu Deus” tem ampla legibilidade brasileira e identifica o Deus do salmista.
theological_decisions:
- issue: Natureza da pergunta dos provocadores
  choice: “Onde está o seu Deus?” como provocação sobre a aparente ausência de Deus.
  alternative: “O que aconteceu com o seu Deus?”
  rationale: O hebraico pergunta literalmente onde Deus está. A formulação direta preserva a tensão da aparente ausência divina sem desenvolver uma interpretação que o texto não explicita.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade e legibilidade brasileira. A metáfora concreta do pão e a provocação direta foram preservadas.
