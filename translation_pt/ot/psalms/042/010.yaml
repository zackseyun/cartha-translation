  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: pt
  text: 'Como uma ferida mortal nos meus ossos[a], meus adversários me insultam, dizendo-me o dia inteiro: “Onde está o seu Deus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um esmagamento nos meus ossos”. Literalmente, “com morte” ou “com homicídio nos meus ossos”. A imagem hebraica é difícil e pode indicar uma ferida mortal ou uma dor profunda e esmagadora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: Como uma fratura
  rationale: רֶצַח normalmente se refere a homicídio ou matança, mas, ligado a “nos meus ossos” nesta imagem poética difícil, comunica um dano violento e profundo. “Como uma fratura” preserva a força corporal da metáfora sem sugerir necessariamente um homicídio literal.
- source_word: בְּעַצְמוֹתַי
  choice: nos meus ossos
  rationale: Mantém a imagem hebraica da dor penetrante e interior em uma expressão natural em português.
- source_word: חֵרְפוּנִי
  choice: me insultam
  rationale: חרף denota afrontar, censurar ou escarnecer. “Insultam” é claro e se ajusta à provocação verbal citada logo depois.
- source_word: צוֹרְרָי
  choice: meus adversários
  rationale: O termo designa os que hostilizam o salmista. “Adversários” conserva essa amplitude sem intensificá-la desnecessariamente.
- source_word: בְּאָמְרָם אֵלַי
  choice: dizendo-me
  rationale: Expressa de modo conciso e natural a direção e a circunstância da fala hostil.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Reproduz o valor durativo da expressão hebraica em português corrente.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Onde está o seu Deus?
  rationale: Preserva diretamente a provocação e sua força retórica, sem acrescentar explicações sobre a aparente ausência de Deus.
theological_decisions:
- issue: A provocação dos adversários a respeito de Deus
  choice: Onde está o seu Deus?
  alternative: Onde, então, está o seu Deus?
  rationale: A formulação direta mantém a tensão do lamento e não introduz uma explicação teológica ausente do texto.
- issue: A imagem ambígua de רֶצַח nos ossos
  choice: Como uma fratura nos meus ossos
  alternative: Como morte nos meus ossos / Com um golpe mortal nos meus ossos
  rationale: O texto hebraico permite uma imagem de morte, ferida mortal ou esmagamento. A tradução principal oferece uma imagem corporal inteligível, enquanto a nota preserva a dificuldade e as alternativas sem resolver em excesso a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha a progressão poética do hebraico; a nota registra a incerteza lexical central.
