id: PSA.42.8
reference: Psalms 42:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: pt
  text: De dia, Yahweh ordena o seu amor leal; e, de noite, seu cântico está comigo[a] — uma oração ao Deus da minha vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cântico a ele está comigo”. A forma hebraica também admite essa análise; o texto principal segue a leitura “seu cântico”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “ao Deus que me dá vida”. Mais literalmente, o hebraico diz “ao Deus da minha vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: De dia
  rationale: Expressa de modo conciso o acusativo adverbial de tempo e mantém o paralelismo com “de noite”.
- source_word: יְצַוֶּה
  choice: ordena
  rationale: 'Preserva a força vívida do piel de צוה: Yahweh determina ou comissiona poeticamente seu amor leal.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חסד reúne as ideias de amor, misericórdia, fidelidade e lealdade relacional; “amor leal” é claro e conciso em português.
- source_word: וּבַלַּיְלָה
  choice: e, de noite
  rationale: Mantém a conjunção simples e o paralelismo temporal, sem introduzir contraste adversativo.
- source_word: שיר/ה
  choice: seu cântico
  rationale: Segue a leitura tradicional “seu cântico”, embora a forma consonantal também possa ser entendida como “um cântico a ele”; a ambiguidade é registrada em nota.
- source_word: עִמִּי
  choice: está comigo
  rationale: Acrescenta a cópula exigida pelo português e conserva a ideia de presença ou acompanhamento.
- source_word: תְּפִלָּה
  choice: uma oração
  rationale: Entende o termo em aposição ao cântico, caracterizando-o como oração.
- source_word: לְאֵל
  choice: ao Deus
  rationale: A preposição ל indica a direção ou o destinatário da oração.
- source_word: חַיָּי
  choice: da minha vida
  rationale: Preserva a construção genitiva hebraica e não a harmoniza com a expressão distinta “Deus vivo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de חַיָּי em לְאֵל חַיָּי
  choice: ao Deus da minha vida
  alternative: ao Deus que me dá vida
  rationale: A forma é “minha vida”, não o adjetivo “vivo”. A formulação principal conserva a relação genitiva e deixa sua nuance aberta.
- issue: Análise de שיר/ה
  choice: seu cântico
  alternative: um cântico a ele
  rationale: A vocalização massorética favorece “seu cântico”, mas a grafia permite outra análise; a nota mantém essa incerteza textual e sintática.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético claro. “Cântico” mantém registro apropriado aos Salmos sem soar arcaico; “amor leal” comunica a constância relacional de חסד.
