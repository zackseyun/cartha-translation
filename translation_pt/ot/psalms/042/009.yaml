  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: pt
  text: 'Digo a Deus, minha rocha: “Por que te esqueceste de mim? Por que ando de luto sob a opressão do inimigo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Digo
  rationale: A forma coortativa de אמר pode expressar resolução (“direi”) ou introduzir a fala imediata. “Digo” é natural no lamento e mantém o ato presente de dirigir-se a Deus.
- source_word: לְאֵל
  choice: a Deus
  rationale: אֵל funciona aqui como designação comum de Deus, não como nome próprio.
- source_word: סַלְעִי
  choice: minha rocha
  rationale: Preserva a metáfora de Deus como estabilidade e proteção, sem substituí-la por uma interpretação explicativa.
- source_word: שְׁכַחְתָּנִי
  choice: te esqueceste de mim
  rationale: O perfeito hebraico descreve uma situação percebida como já estabelecida e ainda relevante. A formulação preserva a acusação direta do lamento sem ampliá-la para “abandonaste”.
- source_word: קֹדֵר
  choice: de luto
  rationale: O particípio pode indicar escuridão, abatimento ou luto. No contexto, “de luto” comunica de modo natural o estado doloroso do salmista.
- source_word: אֵלֵךְ
  choice: ando
  rationale: הלך significa ir ou andar; no contexto, “ando” expressa uma condição contínua sem acrescentar ideia de obrigação.
- source_word: בְּלַחַץ
  choice: sob a opressão
  rationale: לַחַץ denota pressão ou opressão, e a preposição בְּ permite entender a circunstância sob a qual o salmista vive.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: O singular poético pode ser genérico ou coletivo; “o inimigo” mantém a forma singular e soa natural em português.
theological_decisions:
- issue: Título divino metafórico סַלְעִי
  choice: minha rocha
  alternative: meu rochedo; meu refúgio
  rationale: Mantém a imagem concreta do hebraico, em vez de interpretá-la ou reduzi-la a uma função abstrata.
- issue: Queixa de aparente esquecimento divino
  choice: Por que te esqueceste de mim?
  alternative: Por que me abandonaste?; Por que te esqueces de mim?
  rationale: Preserva a ousadia e a tensão teológica do lamento. “Abandonaste” seria mais forte que o verbo hebraico, enquanto o pretérito perfeito português reflete adequadamente o estado resultante expresso pelo perfeito hebraico.
- issue: Sentido de קֹדֵר
  choice: de luto
  alternative: abatido; na escuridão
  rationale: Escolhe o sentido emocional apropriado ao lamento sem eliminar completamente a imagem sombria associada ao termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as perguntas diretas preservam a força poética do lamento; não há marcadores de nota porque nenhuma nota foi julgada necessária para esta redação.
