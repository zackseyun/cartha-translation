base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: pt
  text: Por que você está abatida, minha alma, e por que se agita dentro de mim? Espere em Deus, pois ainda o louvarei, aquele que salva e ergue o meu rosto, o meu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “salvações do meu rosto”. A expressão também pode ser entendida como “o auxílio do meu semblante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: está abatida
  rationale: Expressa o estar encurvado ou prostrado e, no contexto da autoexortação, comunica de modo natural o abatimento profundo sem eliminar a imagem poética.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva a forma poética de o salmista dirigir-se ao próprio ser interior; é corrente e compreensível em português.
- source_word: תֶּהֱמִי
  choice: se agita
  rationale: O verbo sugere tumulto, ruído ou inquietação intensa. A forma reflexiva transmite com naturalidade a agitação interior.
- source_word: עָלָי
  choice: dentro de mim
  rationale: Embora a preposição seja literalmente 'sobre mim', neste contexto idiomático indica a perturbação que toma o íntimo do salmista.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Espere em Deus
  rationale: O verbo reúne espera e expectativa confiante. 'Espere em Deus' conserva a dimensão temporal sem excluir a esperança.
- source_word: עוֹד אוֹדֶנּוּ
  choice: ainda o louvarei
  rationale: Mantém o contraste entre a aflição presente e a confiança de que o louvor será retomado.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: a salvação do meu rosto
  rationale: Conserva a formulação hebraica densa e sua imagem concreta, sem decidir silenciosamente se a expressão significa auxílio que ergue o semblante, libertação pessoal ou ação salvadora refletida no rosto.
- source_word: וֵאלֹהָי
  choice: e o meu Deus
  rationale: Mantém a conjunção e a confissão pessoal climática do hebraico.
theological_decisions:
- issue: Sentido de יְשׁוּעוֹת פָּנַי
  choice: a salvação do meu rosto
  alternative: o auxílio do meu semblante; aquele que salva e ergue o meu rosto
  rationale: A expressão hebraica é compacta, literalmente plural e semanticamente aberta. O texto principal preserva sua imagem e tensão; a nota oferece possibilidades idiomáticas sem transformar uma delas em interpretação exclusiva.
- issue: Valor de הוֹחִילִי
  choice: Espere em Deus
  alternative: Ponha a esperança em Deus
  rationale: A escolha preserva mais diretamente a ideia de espera expectante, ao passo que a alternativa explicita sobretudo a confiança. Nenhuma especificação doutrinária é acrescentada.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe poética natural. O travessão esclarece que a expressão final se refere a Deus, sem apagar a formulação incomum do hebraico.
