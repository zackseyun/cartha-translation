lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente quem dirige a execução musical. “Regente” é natural e conciso em português; a preposição hebraica ל pode ter sentido de destinação, daí “Ao”, sem excluir a alternativa “Para o regente”.
- source_word: מַשְׂכִּיל
  choice: Um masquil
  rationale: Trata-se de um termo técnico dos títulos dos salmos cujo sentido exato é incerto. A transliteração evita impor interpretações discutidas, como “salmo didático”, “contemplativo” ou “cântico habilidoso”.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: A preposição ל nos títulos pode indicar autoria, vínculo, pertença ou destinação. A formulação tradicional e abrangente “dos filhos de” conserva parte dessa abertura, explicitada em nota.
- source_word: קֹרַח
  choice: Corá
  rationale: Emprega-se a forma portuguesa consagrada do nome bíblico.
