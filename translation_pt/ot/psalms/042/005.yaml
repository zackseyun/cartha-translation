  terminology: «Alma», «Deus», «louvarei» e «salvação» são escolhas estáveis e adequadas ao registro dos Salmos. «Sua presença» é uma explicitação contextual legítima de פָּנָיו, enquanto a nota mantém «rosto» e evita eliminar a imagem hebraica.
