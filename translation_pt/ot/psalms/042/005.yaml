source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: pt
  text: Por que você está abatida, ó minha alma, e por que se agita dentro de mim? Espere em Deus, pois ainda o louvarei pela salvação que vem de sua presença.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as salvações de seu rosto”. Em hebraico, “rosto” frequentemente indica a presença pessoal de alguém.
    reason: Preserva o plural e a imagem literal da expressão יְשׁוּעוֹת פָּנָיו, cuja construção admite formulações diferentes em português.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: está abatida
  rationale: O verbo descreve alguém encurvado ou posto para baixo; “abatida” conserva a imagem e expressa naturalmente o desânimo no contexto do lamento.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Na autoexortação poética, נֶפֶשׁ designa o próprio ser interior. “Minha alma” preserva a força introspectiva sem impor uma antropologia técnica.
- source_word: וַתֶּהֱמִי
  choice: se agita
  rationale: O verbo pode indicar tumulto, ruído ou inquietação. “Se agita” comunica de modo claro a perturbação interior e mantém o paralelismo poético.
- source_word: עָלָי
  choice: dentro de mim
  rationale: Embora a preposição signifique literalmente “sobre mim”, neste contexto descreve a agitação que toma o salmista; a formulação idiomática em português é “dentro de mim”.
- source_word: הוֹחִילִי
  choice: Espere
  rationale: O imperativo convoca a alma a esperar com confiança e expectativa. “Espere em Deus” expressa essa esperança perseverante em português corrente.
- source_word: לֵאלֹהִים
  choice: em Deus
  rationale: Com o verbo de espera confiante, a preposição aponta para Deus como fundamento e objeto dessa expectativa.
- source_word: עוֹד
  choice: ainda
  rationale: O advérbio projeta o louvor para além da aflição presente e preserva o tom confiante do salmista.
- source_word: אוֹדֶנּוּ
  choice: o louvarei
  rationale: A forma verbal de ידה pode significar agradecer ou louvar; no contexto cultual do salmo, “louvar” é a opção mais abrangente e natural.
- source_word: יְשׁוּעוֹת
  choice: salvação
  rationale: O plural hebraico pode ter valor intensivo ou abstrato. O singular coletivo “salvação” comunica de modo idiomático a ideia de livramento.
- source_word: פָּנָיו
  choice: sua presença
  rationale: Literalmente “seu rosto”, expressão que em hebraico frequentemente representa a presença pessoal. “Sua presença” torna o sentido acessível sem perder a dimensão relacional; a imagem literal é registrada na nota.
theological_decisions:
- issue: Sentido da expressão final יְשׁוּעוֹת פָּנָיו
  choice: a salvação que vem de sua presença
  alternative: as salvações de seu rosto; o auxílio de sua face
  rationale: O texto hebraico fornecido termina com o pronome de terceira pessoa, “seu rosto”, e não inclui “meu Deus” neste versículo. A tradução mantém a salvação ligada à presença de Deus, enquanto a nota preserva o plural e a metáfora literal, sem resolver além do necessário a construção hebraica concisa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” na autoexortação. A linguagem conserva o tom poético sem recorrer a formas arcaicas. O marcador da nota foi colocado junto à expressão que ela explica.
