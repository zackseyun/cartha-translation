base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: pt
  text: 'Eu me lembro destas coisas e, dentro de mim, derramo a minha alma: como eu seguia com a multidão[a], conduzindo-os[b] até a casa de Deus, ao som de gritos de alegria e ações de graças — uma multidão em festa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na procissão”. O substantivo hebraico בַּסָּךְ é difícil e pode designar a multidão reunida para a festa ou a própria companhia processional.
    reason: lexical_alternative
  - marker: b
    text: Ou “indo com eles” ou “guiando-os”. O verbo hebraico אֶדַּדֵּם é raro, e sua nuance exata é incerta; o contexto indica movimento com outras pessoas em direção à casa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Eu me lembro destas coisas
  rationale: O demonstrativo plural אֵלֶּה é preservado como “estas coisas”, e o imperfeito poético אֶזְכְּרָה recebe valor presente e reflexivo no contexto do lamento.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: e, dentro de mim, derramo a minha alma
  rationale: Mantém a imagem hebraica de derramar a alma e comunica de modo compreensível o movimento emocional interior expresso por עָלַי, sem reduzir נֶפֶשׁ a mero sentimento.
- source_word: כִּי אֶעֱבֹר
  choice: como eu passava
  rationale: כִּי introduz o conteúdo da lembrança; o imperfeito, nesse contexto retrospectivo, sugere uma ação habitual no passado.
- source_word: בַּסָּךְ
  choice: com a multidão
  rationale: O substantivo é difícil, mas o contexto de peregrinação coletiva favorece uma multidão ou companhia processional. A incerteza é preservada em nota.
- source_word: אֶדַּדֵּם
  choice: conduzindo-os
  rationale: O verbo raro, com sufixo de terceira pessoa do plural, indica algum tipo de movimento com o grupo, possivelmente à sua frente ou guiando-o. A alternativa é registrada em nota.
- source_word: עַד בֵּית אֱלֹהִים
  choice: até a casa de Deus
  rationale: “Até” representa diretamente o limite ou destino indicado por עַד e preserva a designação cultual “casa de Deus”.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: ao som de gritos de alegria e ações de graças
  rationale: קוֹל destaca o caráter audível; רִנָּה indica aclamações jubilosas, e תּוֹדָה expressa agradecimento ou louvor agradecido.
- source_word: הָמוֹן חוֹגֵג
  choice: uma multidão em festa
  rationale: A expressão descreve uma coletividade que celebra uma festa, provavelmente de peregrinação; a formulação é natural e conserva o cenário festivo.
