  terminology: «Gordura» mantém a imagem corpórea e metafórica de חֵלֶב. «Imaginações» conserva adequadamente a abertura de מַשְׂכִּיּוֹת, sem antecipar «planos» ou «desejos». «Coração» preserva לֵבָב e seu valor hebraico de centro interior.
