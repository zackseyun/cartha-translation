lexical_decisions:
- source_word: יָצָא
  choice: saltam
  rationale: O verbo significa literalmente “sair”. Com “olhos” e “gordura”, “saltam” expressa em português a imagem concreta de olhos protuberantes sem eliminar a força poética.
- source_word: מֵחֵלֶב
  choice: de tanta gordura
  rationale: חֵלֶב denota literalmente “gordura”. A formulação mantém a imagem corporal ligada ao excesso e à prosperidade, sem reduzi-la apenas à riqueza.
- source_word: עֵינֵימוֹ
  choice: os olhos deles
  rationale: Representa diretamente o plural com sufixo de terceira pessoa masculina plural, em formulação natural e clara.
- source_word: עָבְרוּ
  choice: transbordam
  rationale: O verbo tem o sentido básico de passar ou ultrapassar. “Transbordam” comunica excesso para além dos limites e preserva o paralelismo poético.
- source_word: מַשְׂכִּיּוֹת
  choice: imaginações
  rationale: O substantivo pode indicar imagens, concepções, pensamentos ou projetos. “Imaginações” preserva a amplitude mental do termo sem restringi-lo a ídolos visuais ou planos malignos.
- source_word: לֵבָב
  choice: do seu coração
  rationale: Mantém o singular coletivo hebraico e relaciona naturalmente o coração aos ímpios mencionados no contexto.
