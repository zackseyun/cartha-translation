  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: pt
  text: Eles não passam pelas aflições dos mortais[a], nem são atingidos como os demais seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não enfrentam a penúria dos mortais, nem são afligidos com os demais seres humanos.”'
    reason: Alternativa lexical que preserva os sentidos possíveis de עָמָל (“penúria”, “fadiga”, “aflição”) e de נגע no passivo (“ser afligido”, “ser atingido”).
lexical_decisions:
- source_word: בַּעֲמַל
  choice: pelas aflições
  rationale: עָמָל pode indicar sofrimento, fadiga ou penúria. No contexto da aparente tranquilidade dos perversos, “aflições” expressa melhor os males penosos da vida do que simples trabalho.
- source_word: אֱנוֹשׁ
  choice: dos mortais
  rationale: אֱנוֹשׁ ressalta a fragilidade e mortalidade humana. “Mortais” preserva essa nuance e é natural em português.
- source_word: אֵינֵמוֹ
  choice: não passam
  rationale: A construção existencial negativa com sufixo indica que eles não participam dessas aflições. “Não passam pelas” comunica esse sentido de modo idiomático.
- source_word: וְעִם
  choice: como os demais
  rationale: Embora עִם signifique literalmente “com”, neste paralelismo indica que os perversos não compartilham a condição comum da humanidade; “como os demais” explicita naturalmente essa associação sem alterar o contraste.
- source_word: אָדָם
  choice: seres humanos
  rationale: אָדָם tem referência coletiva à humanidade. “Seres humanos” é abrangente, corrente e distingue este termo de אֱנוֹשׁ no primeiro membro.
- source_word: יְנֻגָּעוּ
  choice: são atingidos
  rationale: A forma passiva de נגע pode significar ser tocado, golpeado ou afligido. “Atingidos” conserva a imagem verbal e permite que o contexto indique a aflição.
theological_decisions: []
