  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: pt
  text: até que entrei nos santuários de Deus[a]; então compreendi o fim deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no santuário de Deus». O hebraico emprega a forma plural, «santuários», que pode referir-se coletivamente aos recintos santos de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou «o destino final deles» ou «o desfecho deles». O hebraico aponta para seu destino ou resultado último.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Marca o limite da perplexidade do salmista e introduz o momento decisivo em que sua compreensão muda.
- source_word: אָבוֹא
  choice: entrei
  rationale: Embora a forma hebraica seja imperfeita, após עַד e neste contexto narrativo ela aponta para o momento decisivo da entrada; o pretérito é natural em português.
- source_word: אֶל
  choice: nos
  rationale: Com o verbo «entrar», a regência portuguesa «entrar em» expressa naturalmente o movimento para dentro do espaço sagrado.
- source_word: מִקְדְּשֵׁי אֵל
  choice: nos santuários de Deus
  rationale: O substantivo hebraico está no plural construto. Preservar «santuários» mantém transparência à forma da fonte, podendo designar coletivamente os recintos santos de Deus.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל é uma designação divina traduzida de modo claro e natural por «Deus».
- source_word: אָבִינָה
  choice: então compreendi
  rationale: O verbo בין comunica percepção ou discernimento; «compreendi» é corrente e claro, e «então» explicita a sequência implícita entre as orações.
- source_word: לְאַחֲרִיתָם
  choice: o fim deles
  rationale: אַחֲרִית aponta para o desfecho, destino final ou resultado último. «O fim deles» é conciso e conserva a força e a ambiguidade do hebraico.
theological_decisions:
- issue: Se מִקְדְּשֵׁי deve ser vertido no plural hebraico ou no singular tradicional
  choice: nos santuários de Deus
  alternative: no santuário de Deus
  rationale: A tradução principal preserva o plural da fonte sem impor uma interpretação doutrinária específica; ele pode referir-se coletivamente aos recintos santos de Deus.
- issue: Sentido de לְאַחֲרִיתָם
  choice: o fim deles
  alternative: o destino final deles; o desfecho deles
  rationale: A formulação mantém aberta a referência ao fim, ao destino último ou ao resultado final dos ímpios, sem resolver além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das notas segue os respectivos marcadores no texto, e o plural hebraico é preservado na tradução principal.
