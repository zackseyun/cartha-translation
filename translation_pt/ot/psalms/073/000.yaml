  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: pt
  text: 'Salmo de Asafe.[a]


    Certamente Deus é bom para Israel,

    para os que têm o coração puro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Asafe”. O título pode indicar autoria, pertença, associação ou dedicação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo tradicional e claro para uma composição poética cantada ou acompanhada por instrumentos.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A forma natural em português preserva a associação do salmo com Asafe sem exigir que ele seja necessariamente o autor.
- source_word: אַךְ
  choice: Certamente
  rationale: Expressa a afirmação enfática que abre o salmo; evita reduzir a partícula a mero contraste.
- source_word: לְבָרֵי לֵבָב
  choice: para os que têm o coração puro
  rationale: Reproduz de modo natural o sentido idiomático de pureza interior, mantendo a imagem bíblica do coração.
theological_decisions:
- issue: Natureza da relação indicada por לְ em לְאָסָף
  choice: de Asafe
  alternative: para Asafe
  rationale: O לְ dos títulos dos salmos pode indicar autoria, pertença, associação ou dedicação. A tradução corrente não define de modo rígido qual dessas relações está em vista; a nota registra a ambiguidade.
- issue: Identificação entre Israel e os puros de coração
  choice: Manter os dois complementos em paralelo
  alternative: 'Explicitar: “Deus é bom para Israel, isto é, para os que têm o coração puro”'
  rationale: O hebraico permite entender a segunda expressão como especificação ou como complemento paralelo, mas não contém um equivalente explícito de “isto é”; por isso, a tradução não resolve a relação.
translation_notes:
  register: Português moderno, claro e digno, com disposição poética. “Certamente” conserva a ênfase inicial; “os que têm o coração puro” é mais natural e acessível do que uma formulação nominal rígida.
