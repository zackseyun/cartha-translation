  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: pt
  text: Como um sonho ao despertar[a], Senhor, quando te levantares, desprezarás a imagem deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “Senhor, na cidade desprezarás a imagem deles”. As consoantes hebraicas permitem essa leitura, mas o contexto favorece fortemente o sentido “quando te levantares/despertares”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Como um sonho
  rationale: O prefixo כ marca comparação, e חֲלוֹם significa “sonho”; a formulação preserva naturalmente a imagem poética.
- source_word: מֵהָקִיץ
  choice: ao despertar
  rationale: 'O infinitivo de קיץ/יקץ, com מֵ, admite valor temporal: “ao despertar”. A expressão descreve o desaparecimento do sonho quando alguém acorda.'
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino usado como forma de tratamento; “Senhor” é a tradução corrente, digna e não introduz posse não enfatizada no contexto.
- source_word: בָּעִיר
  choice: quando te levantares
  rationale: Embora as consoantes também permitam “na cidade”, o sentido verbal ligado a עור, “despertar-se, levantar-se”, corresponde melhor ao paralelismo com o despertar de um sonho. “Te levantares” conserva tanto a ideia de despertar quanto a de pôr-se em ação.
- source_word: צַלְמָם
  choice: a imagem deles
  rationale: צֶלֶם significa “imagem, forma, figura”. A tradução mantém o termo concreto e a possível ideia contextual de aparência insubstancial, sem explicá-la em excesso.
- source_word: תִּבְזֶה
  choice: desprezarás
  rationale: O verbo בזה significa “desprezar, tratar com desdém”; o imperfeito assume aqui valor futuro no quadro temporal introduzido por “quando”.
theological_decisions:
- issue: Interpretação de בָּעִיר
  choice: 'Leitura verbal: “quando te levantares”'
  alternative: 'Leitura locativa: “na cidade”'
  rationale: A comparação imediata com o despertar de um sonho favorece uma segunda referência ao despertar ou levantar-se, agora do Senhor para agir. A alternativa textual legítima é preservada em nota, sem apagar a ambiguidade consonantal.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A sintaxe concisa conserva o paralelismo poético e a ambiguidade relevante é registrada em nota.
