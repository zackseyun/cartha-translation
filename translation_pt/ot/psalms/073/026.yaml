base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: pt
  text: Minha carne e meu coração podem desfalecer[a], mas Deus é a rocha do meu coração[b] e a minha porção para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha carne e meu coração desfalecem”. O verbo hebraico pode indicar falhar, consumir-se ou chegar ao fim.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Deus é a força do meu coração”. O hebraico diz mais literalmente: “Deus é a rocha do meu coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: podem desfalecer
  rationale: O verbo pode indicar chegar ao fim, consumir-se ou falhar. “Podem desfalecer” comunica em português natural a fraqueza física e interior, sem impor ao aspecto hebraico uma referência temporal excessivamente precisa.
- source_word: שְׁאֵרִי
  choice: minha carne
  rationale: Em paralelo com “meu coração”, refere-se ao ser físico do salmista. “Carne” preserva a imagem hebraica e o contraste poético entre a dimensão exterior e a interior.
- source_word: לְבָבִי
  choice: meu coração
  rationale: O termo abrange o íntimo da pessoa, incluindo pensamento e vontade. “Coração” é claro, tradicional e permite conservar sua repetição enfática no verso.
- source_word: צוּר
  choice: a rocha
  rationale: A tradução mantém a metáfora concreta de estabilidade, segurança e firmeza, em vez de reduzi-la à interpretação abstrata “força”.
- source_word: חֶלְקִי
  choice: minha porção
  rationale: “Porção” preserva a imagem da parte que cabe a alguém, com suas possíveis ressonâncias de herança e suficiência, sem explicitar mais do que o hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o termo designa o Deus de Israel na confissão direta do salmista.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa permanência duradoura em linguagem portuguesa corrente e apropriada ao tom poético.
theological_decisions:
- issue: Linguagem antropológica na primeira oração
  choice: Minha carne e meu coração podem desfalecer
  alternative: Meu corpo e minha mente podem falhar
  rationale: “Carne” e “coração” conservam as categorias e imagens do texto hebraico, sem convertê-las em uma divisão moderna entre corpo e mente. A forma “podem desfalecer” preserva a abertura aspectual do verbo no contexto.
- issue: Metáfora aplicada a Deus em צוּר
  choice: Deus é a rocha do meu coração
  alternative: Deus é a força do meu coração
  rationale: O hebraico emprega a imagem concreta de uma rocha. Mantê-la preserva sua riqueza sem restringir o sentido apenas à força, embora essa seja uma interpretação legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a repetição poéticas foram preservadas; “rocha do meu coração” mantém deliberadamente a imagem incomum do original.
