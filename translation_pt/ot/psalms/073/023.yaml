  text: וַ/אֲנִ֣י תָמִ֣יד עִמָּ֑/ךְ אָ֝חַ֗זְתָּ בְּ/יַד יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: pt
  text: Mas eu estou sempre contigo; tu seguraste a minha mão direita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu me tomaste pela mão direita”. O verbo hebraico pode enfatizar tanto o ato de agarrar como o apoio resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome marca contraste com a confusão anterior do salmista; “Mas eu” transmite de modo natural essa força adversativa.
- source_word: תָמִיד
  choice: sempre
  rationale: Expressa continuidade duradoura em português corrente, sem perder o tom reflexivo do salmo.
- source_word: עִמָּךְ
  choice: contigo
  rationale: Representa diretamente a ideia de companhia e proximidade expressa pela preposição hebraica.
- source_word: אָחַזְתָּ
  choice: me tomaste
  rationale: O verbo significa agarrar, segurar ou tomar; com a expressão da mão, esta formulação preserva o ato de Deus tomar o salmista pela mão e sua implicação de amparo.
- source_word: בְּיַד יְמִינִי
  choice: pela mão direita
  rationale: A construção indica a mão pela qual o salmista foi tomado; “pela mão direita” mantém a imagem concreta e é idiomática em português.
theological_decisions:
- issue: Aspecto e nuance do apoio divino no verbo perfeito
  choice: tu me tomaste pela mão direita
  alternative: tu seguras a minha mão direita
  rationale: O perfeito hebraico apresenta o ato de Deus tomar a mão do salmista, enquanto o contexto permite entender seus efeitos contínuos. A tradução conserva o ato sem limitar nem explicitar em excesso a duração do amparo.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. O paralelismo breve e a imagem concreta da mão foram preservados.
