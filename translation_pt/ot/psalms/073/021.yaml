  text: For my heart was embittered[a], and my kidneys were pierced.
translation:
  language: pt
  text: Pois meu coração se amargurava, e eu era trespassado nos rins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu era ferido no íntimo”. Literalmente, “nos rins”; no hebraico, os rins podem representar as emoções mais profundas ou o íntimo da pessoa.
