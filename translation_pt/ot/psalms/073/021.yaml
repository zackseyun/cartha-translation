lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da confissão do salmista no contexto anterior, preservando de modo natural o valor causal ou explicativo.
- source_word: יִתְחַמֵּץ
  choice: estava amargurado
  rationale: O hitpael de חמץ descreve o coração tornando-se azedo ou amargurado; a formulação comunica o estado interior sem apagar por completo a metáfora.
- source_word: לְבָבִי
  choice: meu coração
  rationale: Mantém a imagem hebraica convencional para o centro da vida interior, dos pensamentos e dos afetos.
- source_word: וְכִלְיוֹתַי
  choice: meus rins
  rationale: Preserva o termo corporal concreto do hebraico, que figuradamente designa as emoções ou o íntimo mais profundo; a nota esclarece o uso.
- source_word: אֶשְׁתּוֹנָן
  choice: estavam feridos
  rationale: O verbo raro expressa ser agudamente atingido, ferido ou trespassado. 'Feridos' soa natural em português com 'rins' como sujeito e conserva a metáfora de dor interior.
