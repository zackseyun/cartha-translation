  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: pt
  text: 'Se eu tivesse dito: “Falarei desse modo”, eis que teria traído[a] a geração dos teus filhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teria sido infiel à geração dos teus filhos”.'
    reason: Alternativa lexical para בגד, que pode indicar traição ou infidelidade.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Se eu tivesse dito
  rationale: A construção condicional, no contexto reflexivo, expressa uma hipótese contrária ao que de fato ocorreu; o mais-que-perfeito do subjuntivo é natural e preciso em português.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Falarei desse modo
  rationale: ספר pode significar contar ou relatar, mas, com כְמוֹ e neste contexto, refere-se a expressar publicamente o raciocínio anterior. “Falarei desse modo” comunica isso sem restringir o verbo a uma narração.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a ênfase e a percepção súbita assinaladas pela partícula hebraica, em registro digno e corrente na linguagem bíblica portuguesa.
- source_word: דּוֹר בָּנֶיךָ
  choice: a geração dos teus filhos
  rationale: Mantém o substantivo coletivo “geração” e traduz o masculino plural hebraico literalmente, sem impedir o sentido contextual mais amplo de povo pertencente a Deus.
- source_word: בָגָדְתִּי
  choice: teria traído
  rationale: O verbo denota agir com deslealdade ou perfídia. “Teria traído” é conciso, natural e se ajusta à consequência hipotética da oração condicional.
theological_decisions:
- issue: Referente e alcance de “teus filhos”
  choice: A expressão é dirigida a Deus e designa a geração de seu povo; conserva-se “filhos”, conforme a forma masculina do hebraico.
  alternative: “teus filhos e filhas” ou “teus descendentes”, explicitando um sentido comunitário abrangente.
  rationale: O sufixo de segunda pessoa masculina singular aponta naturalmente para Deus. A tradução formal “teus filhos” preserva a imagem e deixa que o contexto determine seu alcance representativo, sem restringi-lo doutrinariamente.
- issue: Natureza da deslealdade do salmista
  choice: “teria traído” expressa que tornar público esse raciocínio seria uma deslealdade para com o povo de Deus.
  alternative: “teria sido infiel”, destacando a quebra de fidelidade mais que o ato de traição.
  rationale: O hebraico בגד admite ambas as nuances. A tradução principal escolhe a formulação relacional mais direta, enquanto a nota conserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis que” preserva a força retórica do hebraico; “desse modo” soa natural sem perder a referência ao raciocínio dos versículos anteriores.
