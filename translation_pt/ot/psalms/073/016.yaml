translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima ao hebraico. “Pensei em compreender” preserva a deliberação expressa por חשב sem transformar explicitamente o verbo em “tentei”; “aos meus olhos” conserva a imagem original.
