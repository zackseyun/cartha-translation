  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: pt
  text: Mas, quando pensei em compreender isso[a], era um esforço penoso para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, quando pensei em conhecer isso, era um trabalho árduo aos meus olhos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: quando pensei
  rationale: O verbo חשב expressa pensar ou considerar. Com o infinitivo seguinte, descreve a reflexão dirigida a compreender a questão; o waw recebe valor adversativo pelo contexto e é traduzido por “Mas”.
- source_word: לָדַעַת
  choice: em compreender
  rationale: Embora ידע tenha como sentido básico “saber/conhecer”, aqui se refere a apreender intelectualmente a questão, para o que “compreender” é natural em português.
- source_word: זֹאת
  choice: isso
  rationale: O demonstrativo retoma a questão discutida nos versículos anteriores sem explicitar seu referente, como no hebraico.
- source_word: עָמָל
  choice: penoso
  rationale: עמל pode indicar fadiga, trabalho árduo, aflição ou dificuldade. Como predicado da tentativa de compreender, “penoso” preserva a ideia de esforço aflitivo e funciona naturalmente em português.
- source_word: הִיא
  choice: foi
  rationale: O pronome feminino funciona na oração nominal ligando o assunto retomado por זֹאת ao predicado; em português, a cópula no passado comunica essa relação naturalmente.
- source_word: בְּעֵינַי
  choice: aos meus olhos
  rationale: Mantém a imagem literal do idioma hebraico, compreensível em português, com o sentido contextual de “para mim” ou “segundo minha percepção”.
