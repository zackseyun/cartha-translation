  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
translation:
  language: pt
  text: Eis que estes são os perversos, tranquilos para sempre[a]; aumentam sua riqueza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seguros para sempre” ou “tranquilos perpetuamente”. A expressão hebraica é literalmente algo como “tranquilos de eternidade” e descreve prosperidade ou segurança duradoura.
    reason: lexical_alternative
  - marker: b
    text: Ou “adquiriram riqueza” ou “alcançaram riqueza”. O verbo pode enfatizar tanto a obtenção quanto o aumento dos bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz a constatação com ênfase dêitica. “Vejam” comunica essa força em português atual, sem o tom arcaizante de “eis que”.
- source_word: אֵלֶּה
  choice: estes
  rationale: Demonstrativo que retoma as pessoas descritas no contexto imediato.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa uma categoria moral. “Os perversos” é claro e corrente no registro poético dos Salmos, sem acrescentar uma qualificação religiosa ausente do termo.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: sempre tranquilos
  rationale: A expressão combina a ideia de tranquilidade ou segurança com duração prolongada. No contexto, descreve a prosperidade aparentemente contínua dos perversos sem exigir perpetuidade metafísica.
- source_word: הִשְׂגּוּ
  choice: aumentaram
  rationale: O verbo pode indicar alcançar, obter ou fazer crescer. Com חָיִל no contexto da prosperidade, “aumentaram” preserva adequadamente a ideia de crescimento de recursos, enquanto a nota registra a alternativa de aquisição.
- source_word: חָיִל
  choice: riqueza
  rationale: Embora o substantivo também possa significar força, capacidade ou exército, neste contexto a referência mais provável é aos bens ou recursos materiais.
