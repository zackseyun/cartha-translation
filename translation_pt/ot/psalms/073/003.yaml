  text: כִּֽי קִ֭נֵּאתִי בַּֽ/הוֹלְלִ֑ים שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/003.yaml
  text: For I was envious of the arrogant when I saw the peace of the wicked[a].
translation:
  language: pt
  text: Pois tive inveja dos arrogantes, ao ver a prosperidade dos perversos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a paz dos perversos». A palavra hebraica também pode indicar bem-estar, segurança ou uma vida próspera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e preserva o nexo explicativo do hebraico.
- source_word: קִנֵּאתִי
  choice: tive inveja
  rationale: Expressa naturalmente o sentido de invejar, evitando a possível ideia de possessividade associada a 'ciúme'.
- source_word: בַּהוֹלְלִים
  choice: dos arrogantes
  rationale: O termo designa pessoas presunçosas ou jactanciosas; 'arrogantes' comunica de modo claro sua postura moral.
- source_word: שְׁלוֹם
  choice: prosperidade
  rationale: Neste contexto, o termo se refere ao aparente bem-estar e sucesso dos perversos, e não somente à ausência de conflito.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Mantém a categoria moral do hebraico em linguagem corrente e dignificada.
- source_word: אֶרְאֶה
  choice: ao ver
  rationale: Representa o imperfectivo hebraico como a circunstância que despertou a inveja, sem impor uma marca temporal além da necessária.
