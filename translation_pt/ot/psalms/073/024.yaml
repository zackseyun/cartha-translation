  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: pt
  text: Tu me guias com o teu conselho e, depois, me receberás em glória[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, depois, me receberás com honra”.'
    reason: Leitura alternativa de כָּבוֹד, que pode indicar tanto “glória” quanto “honra”; a relação sintática com o verbo é compacta no hebraico.
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: com o teu conselho
  rationale: עֵצָה designa conselho, orientação ou plano; o prefixo בְּ indica aqui o meio pelo qual Deus guia. A formulação é natural em português e mantém essa relação instrumental.
- source_word: תַנְחֵנִי
  choice: tu me guias
  rationale: O hifil de נחה significa conduzir ou guiar. “Guias” combina naturalmente com “conselho” e expressa direção contínua sem acrescentar uma imagem ausente do hebraico.
- source_word: וְאַחַר
  choice: e, depois
  rationale: אַחַר tem valor temporal neste contexto. “Depois” preserva de modo claro e corrente a sequência entre a orientação presente e a ação subsequente de Deus.
- source_word: כָּבוֹד
  choice: na glória
  rationale: כָּבוֹד pode significar glória ou honra. “Na glória” preserva a leitura elevada e possivelmente escatológica do contexto, enquanto a nota registra a alternativa instrumental ou modal, “com honra”.
- source_word: תִּקָּחֵנִי
  choice: me receberás
  rationale: לקח pode significar tomar, levar ou receber. Neste contexto, “receberás” é idiomático em português e comunica acolhimento por Deus sem especificar indevidamente o modo dessa ação.
theological_decisions:
- issue: Sentido de וְאַחַר כָּבוֹד תִּקָּחֵנִי
  choice: “e, depois, me receberás na glória”
  alternative: “e, depois, me receberás com honra”
  rationale: A construção hebraica é compacta e admite tanto uma leitura em que o salmista é recebido na glória quanto uma leitura modal, em que é recebido com honra. O texto principal mantém a possível dimensão escatológica sugerida pela proximidade divina no contexto, e a nota preserva a alternativa sem resolver à força a ambiguidade.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem direta favorece a naturalidade sem perder os dois movimentos do verso: orientação presente e recepção posterior.'
