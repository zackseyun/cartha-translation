source:
  edition: WLC
  text: וַ/אֲנִי בַ֭עַר וְ/לֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: pt
  text: Então eu era insensato e não entendia; era como um animal junto de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “animais”; provavelmente uma expressão coletiva ou intensiva, com o sentido de “como um animal” ou “como um bruto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Então eu
  rationale: O waw liga a confissão à percepção anterior. “Então eu” expressa naturalmente esse nexo reflexivo no contexto.
- source_word: בַעַר
  choice: insensato
  rationale: O termo descreve alguém embrutecido ou sem entendimento. “Insensato” conserva a censura moral e intelectual em português digno e corrente.
- source_word: וְלֹא אֵדָע
  choice: e não entendia
  rationale: Embora ידע signifique normalmente “saber/conhecer”, aqui, em paralelo com בַעַר, “não entendia” comunica com naturalidade a falta de discernimento confessada pelo salmista.
- source_word: בְּהֵמוֹת
  choice: como um animal
  rationale: A forma é morfologicamente plural, mas pode ter valor coletivo ou intensivo. A comparação no singular é idiomática em português e preserva a imagem de irracionalidade.
- source_word: הָיִיתִי
  choice: era
  rationale: O qatal de היה descreve o estado anterior do salmista, não necessariamente um processo de tornar-se.
- source_word: עִמָּךְ
  choice: junto de ti
  rationale: עם significa primariamente “com”. “Junto de ti” preserva essa proximidade e soa natural, sem substituir a relação expressa no hebraico pela ideia interpretativa de estar “diante” de Deus.
theological_decisions:
- issue: Força da imagem animal na autodescrição perante Deus
  choice: 'Comparação com a falta de entendimento de um animal: “era como um animal junto de ti”'
  alternative: “era como animais contigo” ou “era como um animal diante de ti”
  rationale: A frase é uma confissão de falta de discernimento, não uma definição doutrinária da natureza humana. A tradução mantém a aspereza e a humildade da metáfora sem ampliá-la teologicamente.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira. “Insensato” mantém dignidade poética; “junto de ti” conserva o valor relacional de עִמָּךְ. O marcador [a] aparece após a expressão explicada.
