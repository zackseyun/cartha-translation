  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: pt
  text: Pois eis que os que estão longe de ti perecerão; tu destróis todos os que te são infiéis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “todos os que se prostituem, afastando-se de ti”, metáfora hebraica para a infidelidade espiritual ou à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a ligação causal com o contexto.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função enfática e de chamada de atenção da partícula hebraica em registro solene, mas compreensível.
- source_word: רְחֵקֶיךָ
  choice: os que estão longe de ti
  rationale: Expressa naturalmente a distância relacional em relação a Deus, sem reduzir a imagem a distância meramente física.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Reproduz o sentido de אבד, chegar à ruína ou perecer, e conserva o valor futuro da forma verbal.
- source_word: הִצְמַתָּה
  choice: tu destróis
  rationale: O hifil de צמת indica causar destruição ou pôr fim. O presente comunica aqui uma realidade característica e certa, em paralelo poético com o primeiro verso.
- source_word: כָּל
  choice: todos os que
  rationale: Preserva o alcance abrangente do hebraico e produz construção natural em português.
- source_word: זוֹנֶה
  choice: são infiéis
  rationale: No contexto, o particípio de זנה funciona metaforicamente para infidelidade espiritual ou de aliança, não necessariamente para prostituição literal.
- source_word: מִמֶּךָּ
  choice: te
  rationale: Com זנה, a preposição assinala aquele de quem a pessoa se afasta em infidelidade; 'te são infiéis' é a expressão idiomática correspondente em português.
theological_decisions:
- issue: Sentido metafórico de זנה em relação a Deus
  choice: infidelidade espiritual ou de aliança
  alternative: prostituir-se, afastando-se de Deus
  rationale: O contexto contrasta estar longe de Deus com aproximar-se dele. Assim, a linguagem sexual funciona como metáfora de apostasia ou quebra de fidelidade, sem que sua força concreta seja apagada; a nota registra a imagem hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a solenidade poética em “eis que” e o paralelismo entre “perecerão” e “tu destróis”.
