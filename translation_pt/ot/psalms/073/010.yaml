  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: pt
  text: Por isso, seu povo volta para cá[a], e águas em abundância[b] são drenadas para eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por isso, ele traz seu povo de volta para cá». O verbo pode ser entendido como intransitivo («volta») ou como transitivo/causativo («faz voltar», «traz de volta»).'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «águas de plenitude»; a expressão provavelmente indica água abundante, embora a imagem seja difícil.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «águas em plena medida são espremidas por eles». Tanto o verbo quanto o pronome final são difíceis; a linha também pode descrever uma porção abundante oferecida a eles, em vez de águas drenadas para eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a relação de consequência com a descrição anterior, sem tornar a conexão mais rígida do que o hebraico.
- source_word: ישיב
  choice: volta
  rationale: O hifil de שוב pode ser entendido transitivamente, «faz voltar/traz de volta», ou, neste contexto difícil, com sentido intransitivo, «volta». A opção principal produz uma frase clara sem acrescentar um objeto não expresso.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Mantém tanto o sufixo masculino singular quanto a ambiguidade contextual sobre a pessoa a quem o povo pertence.
- source_word: הֲלֹם
  choice: para cá
  rationale: Reproduz o valor direcional do advérbio, «até aqui/para este lugar», em português corrente.
- source_word: וּמֵי מָלֵא
  choice: e águas em abundância
  rationale: Comunica naturalmente a ideia de águas plenas ou abundantes, preservando no plural a imagem poética hebraica; a formulação mais literal é registrada em nota.
- source_word: יִמָּצוּ
  choice: são esgotadas
  rationale: Preserva a voz passiva e a noção de extrair, drenar ou consumir completamente, embora a imagem permaneça difícil.
- source_word: לָמוֹ
  choice: por eles
  rationale: Entende a preposição com o pronome como indicação do agente da forma passiva; a leitura dativa, «para eles», permanece possível e aparece em nota.
theological_decisions:
- issue: Referente de «seu» em «seu povo»
  choice: Mantido ambíguo no texto principal
  alternative: Entender «seu povo» como o povo do perverso ou como o povo de Deus
  rationale: O sufixo hebraico não identifica inequivocamente o antecedente, e a sintaxe do versículo é obscura. Especificar o referente resolveria uma questão interpretativa que o texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Para cá» conserva a direção de הֲלֹם; «águas em abundância» evita a artificialidade de «águas de plenitude», que fica documentada em nota. A obscuridade sintática e imagética do hebraico é preservada por notas, sem impor uma identificação teológica ao pronome.
