  register: Português moderno, claro e digno, com leitura natural no Brasil. “Zombam” é corrente e compreensível; “do alto” conserva a imagem concisa e a ambiguidade do hebraico. O marcador [a] foi colocado imediatamente após a expressão à qual se refere.
