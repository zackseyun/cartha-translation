base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/008.yaml
  text: They scoff and speak with malice[a]; from on high they speak oppression.
translation:
  language: pt
  text: Eles zombam e falam com maldade[a]; do alto, proferem opressão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles escarnecem e falam maldosamente; com arrogância, proferem opressão.” O sentido do primeiro verbo hebraico é incerto, e “do alto” também pode descrever a maneira arrogante de falar (“com arrogância”), em vez de uma posição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: zombam
  rationale: O hifil de מוק é difícil neste contexto. “Zombam” comunica desprezo hostil e se ajusta ao discurso arrogante descrito no paralelismo, sem adotar a interpretação mais conjectural “corrompem-se”.
- source_word: וִידַבְּרוּ
  choice: e falam
  rationale: A conjunção seguida do imperfeito dá continuidade à descrição da conduta dos ímpios; a formulação é natural em português e mantém o verbo explícito.
- source_word: בְרָע
  choice: com maldade
  rationale: A construção com בְּ e רַע pode indicar o modo ou o conteúdo da fala. “Com maldade” preserva essa amplitude e expressa sua qualidade moral hostil.
- source_word: עֹשֶׁק
  choice: opressão
  rationale: O substantivo designa opressão ou exploração. “Opressão” preserva sua força social e ética sem restringi-lo à extorsão financeira.
- source_word: מִמָּרוֹם
  choice: do alto
  rationale: A expressão significa literalmente “de uma altura/do alto” e pode retratar tanto uma posição figuradamente elevada quanto um modo arrogante de falar. A tradução mantém essa imagem e sua ambiguidade.
- source_word: יְדַבֵּרוּ
  choice: falam
  rationale: A repetição do verbo é preservada para refletir a ênfase e a estrutura paralela do hebraico.
theological_decisions: []
