  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: pt
  text: Quem tenho eu no céu além de ti? Além de ti[a], nada desejo na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E contigo não desejei [coisa alguma] na terra”. O hebraico é elíptico; no contexto, a expressão tem o sentido de que, além de Deus, o salmista nada deseja na terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Quem tenho eu
  rationale: A construção interrogativa com לִי expressa relação de posse ou pertencimento; esta formulação é natural em português e preserva a pergunta retórica.
- source_word: בַשָּׁמָיִם
  choice: no céu
  rationale: O plural hebraico designa coletivamente o âmbito celestial; o singular é a forma idiomática em português e mantém o contraste com a terra.
- source_word: וְעִמְּךָ
  choice: E, contigo
  rationale: Mantém de perto o sentido literal de 'e com você/contigo' e deixa que a nota explique a elipse e a possível força exclusiva, sem resolver silenciosamente a ambiguidade.
- source_word: לֹא חָפַצְתִּי
  choice: nada desejo
  rationale: A negação e o verbo formam em português uma expressão idiomática de desejo totalmente negado. O perfeito hebraico comunica aqui uma disposição firme e atual.
- source_word: בָאָרֶץ
  choice: na terra
  rationale: Refere-se ao âmbito terreno em contraste poético com o céu; 'na terra' é corrente e preserva o paralelismo.
theological_decisions:
- issue: Sentido do segundo hemistíquio
  choice: Preservar no texto a formulação elíptica 'contigo' e explicar sua provável força exclusiva em nota
  alternative: Além de ti, nada desejo na terra
  rationale: O hebraico diz literalmente 'e contigo não desejei [coisa alguma] na terra'. A tradução principal conserva a tensão entre companhia com Deus e exclusividade do desejo; a nota apresenta a leitura contextual provável sem impor uma paráfrase como única possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “ti/contigo” coerente no trato dirigido a Deus. A sintaxe poética permanece concisa, e a nota conserva a ambiguidade genuína do hebraico.
