base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: pt
  text: Quanto a mim, porém[a], meus pés quase tropeçaram; meus passos por pouco não escorregaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quanto a mim, porém, meus pés quase escorregaram; meus passos quase perderam a firmeza.” O paralelismo poético hebraico permite imagens ligeiramente diferentes, mas sobrepostas, de instabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim, porém
  rationale: A conjunção e o pronome independente marcam contraste com o contexto anterior e dão ênfase ao salmista. A formulação preserva ambos em português natural.
- source_word: כִּמְעַט
  choice: quase
  rationale: O advérbio indica que algo esteve muito perto de acontecer; “quase” é a equivalência portuguesa mais direta.
- source_word: נטוי
  choice: tropeçaram
  rationale: No contexto dos pés e em paralelismo com a perda de firmeza do segundo membro, o verbo descreve vacilação ou desvio iminente. “Tropeçaram” conserva a imagem concreta sem explicitar uma aplicação moral ou espiritual.
- source_word: רַגְלָי
  choice: meus pés
  rationale: Mantém a imagem corporal literal, que também pode representar figuradamente a estabilidade ou o curso de vida do salmista.
- source_word: כְּאַיִן
  choice: por pouco não
  rationale: A expressão comunica que o resultado quase ocorreu. Esta construção é idiomática em português e evita repetição mecânica de “quase”.
- source_word: שפכה
  choice: escorregaram
  rationale: Embora a raiz tenha o sentido básico de derramar ou entornar, aplicada aos passos transmite a ideia de perder a firmeza ou deslizar.
- source_word: אֲשֻׁרָי
  choice: meus passos
  rationale: O substantivo designa passos ou passadas; “meus passos” preserva naturalmente a metáfora do percurso de vida.
theological_decisions:
- issue: Linguagem metafórica de instabilidade
  choice: Manter as imagens corporais e de caminhada — “pés”, “tropeçaram”, “passos” e “escorregaram” — sem explicitar sua aplicação.
  alternative: Traduzir interpretativamente como “quase perdi a fé” ou “quase caí espiritualmente”.
  rationale: O versículo sugere instabilidade espiritual ou moral no contexto do salmo, mas não a define de modo explícito. Preservar a metáfora mantém a abertura e a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem “Quanto a mim, porém” preserva a ênfase contrastiva sem soar excessivamente arcaica; a variação entre “quase” e “por pouco não” torna o paralelismo fluente.
