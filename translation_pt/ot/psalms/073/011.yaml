  text: וְֽ/אָמְר֗וּ אֵיכָ֥ה יָדַֽע אֵ֑ל וְ/יֵ֖שׁ דֵּעָ֣ה בְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: pt
  text: 'E eles dizem[a]: “Como Deus sabe? Acaso há conhecimento no Altíssimo[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “E eles disseram”, se o perfeito hebraico for entendido como passado simples, e não como descrição de uma fala habitual.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no Altíssimo”; a expressão pergunta se o Altíssimo possui conhecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: E eles dizem
  rationale: O perfeito hebraico pode descrever, no discurso poético, uma fala habitual ou recorrente. O presente se ajusta ao retrato contínuo dos ímpios no salmo; a leitura no passado é preservada em nota.
- source_word: אֵיכָה יָדַע אֵל
  choice: Como Deus pode saber?
  rationale: אֵיכָה significa “como?”, e יָדַע expressa “saber”. Em português, “pode saber” comunica naturalmente o tom retórico e desafiador da pergunta, embora a modalidade não esteja expressa separadamente no hebraico.
- source_word: וְיֵשׁ דֵּעָה
  choice: Acaso há conhecimento
  rationale: A partícula existencial יֵשׁ é vertida por “há”. “Acaso” sinaliza com naturalidade a força interrogativa retórica, enquanto “conhecimento” preserva a ligação lexical com “saber” na frase anterior.
- source_word: בְעֶלְיוֹן
  choice: no Altíssimo
  rationale: A tradução mantém de perto a preposição בְּ, “em/no”, e verte עֶלְיוֹן pelo título divino português consagrado “Altíssimo”. Uma nota esclarece o sentido possessivo possível da expressão.
theological_decisions:
- issue: Tradução do título divino עֶלְיוֹן
  choice: o Altíssimo
  alternative: o Excelso
  rationale: “O Altíssimo” é o título divino consagrado, claro e amplamente compreendido em português, preservando a ênfase na supremacia de Deus sem acrescentar interpretação denominacional.
- issue: Força da pergunta sobre o conhecimento divino
  choice: Acaso há conhecimento no Altíssimo?
  alternative: Acaso o Altíssimo tem conhecimento?
  rationale: A redação escolhida conserva a construção incomum do hebraico e sua tensão retórica. A alternativa explicita a posse, mas interpreta a função da preposição.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e o paralelismo das duas perguntas foram preservados; as notas retêm as ambiguidades verbal e preposicional do hebraico.
