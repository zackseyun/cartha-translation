  text: כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְ/מוֹתָ֗/ם וּ/בָרִ֥יא אוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: pt
  text: Pois não têm dores na morte,[a] e seu corpo é saudável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não têm dores até a morte deles». O hebraico desta expressão é difícil.'
    reason: Registra a leitura temporal possível de לְמוֹתָם sem torná-la a afirmação principal.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: dores
  rationale: O termo raro pode designar dores, tormentos ou amarras. “Dores” se ajusta ao contexto da aparente tranquilidade dos ímpios sem restringir demais a imagem.
- source_word: לְמוֹתָם
  choice: até a morte
  rationale: A preposição לְ com o substantivo e o sufixo admite aqui a leitura temporal refletida pela tradição textual consultada; a construção hebraica, porém, também pode ser entendida como referência à morte deles.
- source_word: בָרִיא
  choice: gordo
  rationale: O adjetivo indica gordura, boa nutrição e vigor. “Gordo” preserva a imagem concreta hebraica e o sinal antigo de prosperidade.
- source_word: אוּלָם
  choice: seu corpo
  rationale: Neste contexto, a forma rara é entendida como referência ao corpo físico, conforme a leitura lexical tradicional do verso.
theological_decisions:
- issue: A aparente ausência de sofrimento dos ímpios
  choice: Manter a afirmação direta do salmista
  alternative: Atenuar para indicar apenas que eles parecem não sofrer
  rationale: O verso exprime a percepção perplexa do salmista nesta etapa do poema; inserir “parecem” resolveria antecipadamente a tensão teológica desenvolvida no restante do salmo.
translation_notes:
  register: Português atual, claro e digno, com construção direta. A imagem concreta de um corpo “gordo” foi mantida por seu valor cultural no texto antigo como sinal de abundância e bem-estar.
