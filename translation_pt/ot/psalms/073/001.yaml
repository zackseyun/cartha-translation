  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: pt
  text: Salmo de Asafe. Deus é verdadeiramente bom para Israel, para os puros de coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para os que têm o coração puro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo consagrado e exato para este tipo de composição e cabeçalho.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: Em cabeçalhos de salmos, לְ pode indicar autoria, associação ou destinação; “de Asafe” mantém essa amplitude de modo idiomático.
- source_word: אַךְ
  choice: verdadeiramente
  rationale: Aqui funciona como partícula enfática que introduz a tese do salmo; “verdadeiramente” expressa afirmação segura sem recorrer a uma formulação arcaica.
- source_word: טוֹב
  choice: bom
  rationale: Preserva a amplitude do termo, que pode abranger tanto o caráter quanto a ação benéfica de Deus.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: A preposição indica relação ou benefício; “bom para Israel” é natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O substantivo tem sentido singular e designa o Deus de Israel.
- source_word: לְבָרֵי לֵבָב
  choice: para os puros de coração
  rationale: Expressa a pureza ética e interior de maneira corrente e digna; a repetição de “para” conserva a estrutura paralela e sua possível relação explicativa com Israel.
theological_decisions:
- issue: Relação entre “Israel” e “os puros de coração”
  choice: Manter as duas expressões em paralelo, permitindo que a segunda especifique a primeira
  alternative: Entendê-las como dois grupos coordenados e distintos
  rationale: As duas expressões hebraicas introduzidas por לְ podem ser lidas como reformulação ou especificação poética, mas a tradução não impõe essa interpretação e preserva a tensão sintática.
translation_notes:
  register: Português moderno, amplamente internacional e natural para leitores brasileiros. O cabeçalho foi mantido separado da afirmação principal. Optou-se por “verdadeiramente” para אַךְ e por “puros de coração” como formulação concisa e tradicional, sem linguagem arcaica.
