base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: pt
  text: Por isso, o orgulho é o colar deles[a]; a violência os envolve como uma veste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por isso, o orgulho os adorna como um colar; a violência os envolve como uma veste.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a consequência do retrato dos ímpios nos versículos anteriores e preserva a ligação discursiva de modo natural em português.
- source_word: עֲנָקַתְמוֹ
  choice: é o colar deles
  rationale: O termo deriva de ענק e apresenta o orgulho como adorno usado no pescoço; a formulação mantém a metáfora de maneira concisa.
- source_word: גַאֲוָה
  choice: orgulho
  rationale: Neste contexto, designa exaltação própria em sentido moral negativo; “orgulho” é claro, corrente e não restringe indevidamente o campo semântico.
- source_word: יַעֲטָף
  choice: envolve
  rationale: O verbo expressa a ideia de envolver ou cobrir; “envolve” preserva a imagem de algo que cerca o corpo como roupa.
- source_word: שִׁית
  choice: como uma veste
  rationale: O substantivo raro indica vestimenta ou cobertura. A introdução de “como” explicita naturalmente em português a comparação implícita na imagem poética.
- source_word: חָמָס
  choice: violência
  rationale: É o equivalente direto e usual para a violência associada à injustiça e à crueldade neste contexto.
- source_word: לָמוֹ
  choice: os
  rationale: O pronome refere-se aos ímpios e, na construção portuguesa, funciona naturalmente como objeto de “envolve”.
