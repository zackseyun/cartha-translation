  text: אֵ֤יךְ הָי֣וּ לְ/שַׁמָּ֣ה כְ/רָ֑גַע סָ֥פוּ תַ֝֗מּוּ מִן בַּלָּהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/019.yaml
  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: pt
  text: Como, num instante, se tornaram uma desolação[a]! Chegaram ao fim; foram consumidos por terrores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Desolação» também pode indicar algo que causa horror ou assombro por causa da ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de espanto diante da súbita reversão, e não uma pergunta informativa.
- source_word: הָיוּ לְשַׁמָּה
  choice: ficaram reduzidos à desolação
  rationale: Expressa naturalmente em português a passagem resultante para um estado de ruína, preservando o valor de שַׁמָּה.
- source_word: כְרָגַע
  choice: num instante
  rationale: O כְּ tem aqui valor temporal idiomático; a formulação comunica a extrema rapidez da ruína.
- source_word: סָפוּ
  choice: Chegaram ao fim
  rationale: Mantém o sentido de cessar ou perecer sem especificar indevidamente o modo da destruição.
- source_word: תַמּוּ
  choice: foram consumidos
  rationale: Preserva a intensificação paralela e a ideia de término completo em registro digno e natural.
- source_word: מִן בַּלָּהוֹת
  choice: por terrores
  rationale: Entende מִן como causa ou agente eficaz do fim; בַּלָּהוֹת designa experiências terríveis ou horrores.
theological_decisions: []
translation_notes:
