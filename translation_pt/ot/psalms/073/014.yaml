  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: pt
  text: Pois fui afligido[a] o dia inteiro, e era corrigido[b] a cada manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atingido” ou “ferido”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e minha correção/repreensão [era] a cada manhã”; o sentido é de correção ou disciplina recorrente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Pois fui
  rationale: O waw introduz aqui a continuação explicativa do argumento do salmista; “Pois” expressa naturalmente esse valor no contexto, enquanto “fui” preserva a primeira pessoa e o sentido passado de היה.
- source_word: נָגוּעַ
  choice: afligido
  rationale: O particípio passivo de נגע descreve alguém atingido ou afligido. “Afligido” é claro e abrangente, sem limitar o sofrimento a doença física.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressa de modo natural em português a duração ao longo de todo o dia e conserva a ênfase do hebraico.
- source_word: וְתוֹכַחְתִּי
  choice: e ... recebia correção
  rationale: O substantivo com sufixo significa literalmente “e minha correção/repreensão”. A formulação verbal explicita de maneira idiomática que o salmista experimentava essa correção, preservando a relação paralela com sua aflição.
- source_word: לַבְּקָרִים
  choice: cada manhã
  rationale: O plural hebraico tem valor distributivo e recorrente; “cada manhã” comunica com clareza a repetição.
theological_decisions:
- issue: Natureza do sofrimento descrito
  choice: Linguagem geral de aflição e correção, sem identificar expressamente o agente nem especificar doença ou ira punitiva
  alternative: Sofrimento físico semelhante a uma praga, ou repreensão predominantemente verbal
  rationale: Os termos hebraicos são abrangentes. Embora o contexto possa sugerir disciplina procedente de Deus, o versículo não nomeia o agente; a tradução preserva essa abertura e não reduz a experiência a doença nem a uma repreensão apenas verbal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “O dia inteiro” e “cada manhã” são expressões correntes; “recebia correção” evita o tom arcaico de “era castigado” e mantém a amplitude semântica do original.
