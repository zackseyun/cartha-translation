  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: pt
  text: Certamente, tu os colocas em lugares escorregadios[a]; tu os fazes cair na ruína[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre terreno escorregadio”; literalmente, “em lugares lisos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para a ruína” ou “em desolações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: A partícula tem aqui força enfática, introduzindo com convicção a percepção corretiva do salmista, e não uma ideia restritiva.
- source_word: בַּחֲלָקוֹת
  choice: em lugares escorregadios
  rationale: O termo significa literalmente algo como “lugares lisos”; no contexto da queda iminente, “lugares escorregadios” preserva a imagem e expressa naturalmente a precariedade.
- source_word: תָּשִׁית לָמוֹ
  choice: tu os colocas
  rationale: Mantém o sentido comum de שׁית, “pôr/colocar”, bem como a ação divina direta e o objeto plural.
- source_word: הִפַּלְתָּם
  choice: tu os fazes cair
  rationale: O hifil de נפל é causativo, “fazer cair”. Esta formulação conserva explicitamente a causalidade sem acrescentar a imagem mais forte de arremessar.
- source_word: לְמַשּׁוּאוֹת
  choice: na ruína
  rationale: O substantivo denota ruína ou desolação. “Na ruína” é corrente em português e apresenta a ruína como o resultado ou destino da queda.
theological_decisions:
- issue: Ação divina na queda dos ímpios
  choice: 'Atribuir diretamente a Deus tanto a colocação em terreno precário quanto a queda: “tu os colocas... tu os fazes cair”.'
  alternative: Atenuar a causalidade, apresentando a queda como simples consequência das circunstâncias.
  rationale: Os dois verbos hebraicos estão na segunda pessoa do singular e se dirigem a Deus; o segundo tem forma causativa. A tradução mantém essa atribuição explícita e a tensão teológica do salmo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O paralelismo poético e a referência direta a Deus foram preservados; “tu” mantém a forma singular explícita do hebraico.
