id: PSA.73.28
reference: Psalms 73:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: pt
  text: Mas, quanto a mim, a proximidade de Deus é boa para mim[a]; fiz do Senhor Yahweh o meu refúgio, para contar todas as tuas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aproximar-me de Deus é bom para mim”. O substantivo hebraico pode indicar a proximidade relacional com Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas, quanto a mim
  rationale: A conjunção e o pronome independente exprimem contraste enfático com o destino dos ímpios descrito anteriormente.
- source_word: קִרֲבַת אֱלֹהִים
  choice: a proximidade de Deus
  rationale: Preserva a forma nominal e a ambiguidade relacional do construto hebraico, que pode apontar tanto para a proximidade de Deus quanto para aproximar-se dele.
- source_word: לִי טוֹב
  choice: é boa para mim
  rationale: Expressa de modo natural o benefício pessoal indicado pela construção hebraica, mantendo a concordância com o substantivo feminino 'proximidade'.
- source_word: שַׁתִּי
  choice: fiz
  rationale: No idioma com 'refúgio', comunica uma escolha deliberada de confiança sem a estranheza de uma tradução mecânica como 'pus'.
- source_word: בַּאדֹנָי יְהוִה
  choice: do Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יהוה e evita a repetição artificial 'Senhor SENHOR'.
- source_word: מַחְסִי
  choice: o meu refúgio
  rationale: '''Refúgio'' é a equivalência direta e corrente para um lugar de proteção e segurança.'
- source_word: לְסַפֵּר
  choice: para contar
  rationale: O infinitivo com ל pode indicar propósito; 'contar' traduz naturalmente a ideia de narrar ou proclamar os feitos de Deus.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: todas as tuas obras
  rationale: Mantém o quantificador e traduz מְלָאכָה de forma ampla, sem acrescentar a noção interpretativa de feitos necessariamente poderosos.
theological_decisions:
- issue: Forma de representar יהוה na combinação אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: Mantém distintamente o título e o nome próprio divino presentes no hebraico, sem produzir a duplicação 'Senhor SENHOR'.
- issue: Sentido de קִרֲבַת אֱלֹהִים
  choice: a proximidade de Deus é boa para mim
  alternative: aproximar-me de Deus é bom para mim
  rationale: A redação principal preserva a forma nominal e a tensão entre a proximidade de Deus e a proximidade do salmista em relação a Deus; a leitura verbal mais explícita fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo e a ambiguidade significativa do hebraico sem recorrer a linguagem excessivamente arcaica.
