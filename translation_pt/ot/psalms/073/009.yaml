base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/009.yaml
  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: pt
  text: Põem a boca contra os céus[a], e sua língua desfila pela terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Põem a boca nos céus”. A preposição hebraica significa literalmente “em”, mas o contexto sugere palavras dirigidas desafiadoramente contra os céus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua língua anda pela terra”. O verbo hebraico significa literalmente “andar” ou “ir”; “desfila” expressa de modo mais vívido o tom arrogante do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: põem
  rationale: O verbo significa basicamente pôr ou colocar. “Põem” preserva esse sentido, enquanto a ideia de oposição é expressa pela frase completa.
- source_word: בַשָּׁמַיִם
  choice: contra os céus
  rationale: A preposição hebraica é literalmente “em/nos”, mas, neste contexto de fala arrogante, a expressão indica que eles dirigem a boca desafiadoramente contra os céus. O plural poético “céus” foi preservado.
- source_word: פִּיהֶם
  choice: a boca
  rationale: O hebraico emprega o singular representativo com possuidor plural. O português pode conservar naturalmente essa imagem coletiva na construção “põem a boca”.
- source_word: וּלְשׁוֹנָם
  choice: e sua língua
  rationale: Mantém o singular representativo do hebraico e o paralelismo poético entre “boca” e “língua”.
- source_word: תִּהֲלַךְ
  choice: desfila
  rationale: O verbo significa literalmente andar ou ir. “Desfila” comunica, de modo vívido e natural, o tom arrogante sugerido pelo contexto, sem eliminar a imagem de movimento.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: Com um verbo de movimento, “pela terra” é idiomático em português. “Terra” preserva o contraste de alcance cósmico com “os céus”.
