  text: אַךְ רִ֭יק זִכִּ֣יתִי לְבָבִ֑/י וָ/אֶרְחַ֖ץ בְּ/נִקָּי֣וֹן כַּפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: pt
  text: De fato, foi em vão que mantive puro o meu coração[a] e lavei as mãos em inocência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “purifiquei o meu coração”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “lavei as minhas mãos em limpeza”; a imagem comunica inocência moral, não apenas lavagem física.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: Introduz com ênfase a conclusão amarga do salmista, sem o sentido restritivo estreito de “somente”.
- source_word: רִיק
  choice: em vão
  rationale: Expressa inutilidade ou ausência de resultado e é uma formulação idiomática e digna em português.
- source_word: זִכִּיתִי
  choice: mantive puro
  rationale: Com “meu coração” como objeto, comunica de modo natural a ideia de conservar ou tornar moralmente puro, mantendo a relevância presente da ação concluída.
- source_word: לְבָבִי
  choice: o meu coração
  rationale: Preserva a imagem hebraica do centro interior, moral e volitivo da pessoa.
- source_word: וָאֶרְחַץ
  choice: e lavei
  rationale: Mantém a ação paralela da segunda oração e a imagem concreta do hebraico.
- source_word: בְּנִקָּיוֹן
  choice: em inocência
  rationale: Conserva a formulação poética de lavar as mãos em inocência e seu sentido ético, não apenas físico.
- source_word: כַּפָּי
  choice: as mãos
  rationale: Embora o termo possa designar literalmente as palmas, “mãos” é o equivalente natural na expressão portuguesa.
theological_decisions:
- issue: Pureza moral versus pureza ritual
  choice: Conservar a linguagem de purificação como imagem de inocência moral.
  alternative: Entender a expressão principalmente como referência à pureza ritual.
  rationale: O paralelismo entre “coração” e “mãos”, no contexto da queixa, aponta para integridade interior e conduta inocente; a tradução mantém a metáfora sem excluir suas ressonâncias cultuais.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. “De fato” preserva a ênfase reflexiva; “em vão” mantém a concisão poética. Os marcadores seguem a ordem em que aparecem no texto.
