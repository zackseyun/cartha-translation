base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: pt
  text: Pois, por tua causa[a], somos mortos o dia inteiro; somos considerados como ovelhas para o abate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por amor de ti» ou «por causa de ti». O hebraico pode indicar sofrimento suportado em relação a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «somos contados como ovelhas para o abate».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ligada à queixa anterior e preserva com naturalidade o fluxo argumentativo do poema.
- source_word: עָלֶיךָ
  choice: por tua causa
  rationale: Expressa a relação causal ou referencial com Deus sem determinar se ele é o agente direto do sofrimento; em português, é mais transparente que «por amor de ti».
- source_word: הֹרַגְנוּ
  choice: somos mortos
  rationale: Embora a forma hebraica seja perfeita, o contexto poético e «o dia inteiro» indicam uma experiência contínua ou repetida; o presente passivo comunica isso adequadamente.
- source_word: כָל הַיּוֹם
  choice: o dia inteiro
  rationale: Forma idiomática e corrente de exprimir duração contínua em português.
- source_word: נֶחְשַׁבְנוּ
  choice: somos considerados
  rationale: Preserva o sentido passivo e avaliativo do verbo חשׁב em linguagem moderna e clara.
- source_word: כְּצֹאן
  choice: como ovelhas
  rationale: Reproduz diretamente a comparação introduzida por כְּ.
- source_word: טִבְחָה
  choice: destinadas ao abate
  rationale: Comunica de modo natural que as ovelhas são vistas como reservadas para serem abatidas, mantendo o tom digno do lamento.
theological_decisions:
- issue: Se o sofrimento é causado por Deus ou suportado em razão da relação e lealdade a Deus
  choice: por tua causa
  alternative: por amor de ti; por causa de ti; por tua conta
  rationale: 'A expressão mantém a tensão do hebraico: o sofrimento ocorre em relação a Deus, sem afirmar explicitamente que Deus seja o agente direto da morte nem restringir a causa exclusivamente à fidelidade humana.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Tua» acompanha a referência direta a Deus sem acrescentar tratamento denominacional; «abate» evita linguagem excessivamente técnica ou gráfica.
