base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: pt
  text: 'Nosso coração não voltou atrás,[a]

    nem nossos passos se desviaram do teu caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Nosso coração não recuou, nem nossos passos se afastaram da tua vereda».'
    reason: Alternativas lexicais para נָסוֹג אָחוֹר, נטה e אֹרַח, preservando a mesma imagem de recuo e desvio.
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: voltou atrás
  rationale: A expressão combina o verbo de recuar ou retroceder com o advérbio «atrás». «Voltou atrás» é natural em português e preserva a imagem de abandono ou retirada.
- source_word: לִבֵּנוּ
  choice: Nosso coração
  rationale: Mantém a metáfora hebraica do coração como o ser interior, incluindo vontade e lealdade, sem restringi-la à mente ou às emoções.
- source_word: וַתֵּט
  choice: se desviaram
  rationale: No contexto da imagem de caminho, expressa com naturalidade a ideia de inclinar-se ou afastar-se da rota.
- source_word: אֲשֻׁרֵינוּ
  choice: nossos passos
  rationale: O substantivo designa passos ou marcha; «passos» conserva a metáfora poética e combina naturalmente com «caminho».
- source_word: מִנִּי אָרְחֶךָ
  choice: do teu caminho
  rationale: A preposição indica afastamento, e אֹרַח designa caminho ou vereda, aqui com sentido também moral. A formulação é clara e fiel em português.
theological_decisions:
- issue: Metáfora antropológica do coração
  choice: Conservar literalmente «coração».
  alternative: Traduzir interpretativamente como «lealdade», «mente» ou «íntimo».
  rationale: «Coração» preserva a amplitude do conceito hebraico do ser interior e evita reduzir o sentido a uma única faculdade.
- issue: Sentido moral da imagem do caminho
  choice: Preservar a imagem concreta de passos que não se desviam do caminho de Deus.
  alternative: Explicitar como desobediência ou abandono da vontade de Deus.
  rationale: O texto comunica essa dimensão por metáfora; torná-la explícita resolveria além do necessário a tensão poética e teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O paralelismo hebraico e as imagens de coração, passos e caminho foram preservados.
