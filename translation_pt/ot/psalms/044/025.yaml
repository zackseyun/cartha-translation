base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: pt
  text: Pois a nossa alma se abateu até o pó[b][a]; o nosso ventre se apega à terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nossa vida” ou “nós mesmos”, em vez de “a nossa alma”.
    reason: lexical_alternative
  - marker: b
    text: Ou “afundou até o pó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e conserva a força causal com naturalidade poética em português.
- source_word: שָׁחָה
  choice: se abateu
  rationale: Expressa o movimento ou estado de curvar-se e ser reduzido a uma posição baixa, preservando a possível leitura postural sem limitar a imagem a ela.
- source_word: לֶעָפָר
  choice: até o pó
  rationale: Mantém a imagem hebraica de extrema humilhação e proximidade da morte; 'até' comunica o rebaixamento ao limite do pó.
- source_word: נַפְשֵׁנוּ
  choice: a nossa alma
  rationale: Preserva a linguagem antropológica e poética do hebraico sem decidir se נֶפֶשׁ designa especificamente alma, vida ou a própria pessoa.
- source_word: דָּבְקָה
  choice: está colado
  rationale: Comunica contato firme e contínuo com a terra; a concordância no masculino acompanha 'ventre' em português.
- source_word: לָאָרֶץ
  choice: à terra
  rationale: Conserva o paralelismo poético com 'pó' e a imagem de prostração completa.
- source_word: בִּטְנֵנוּ
  choice: nosso ventre
  rationale: É a tradução concreta mais direta e mantém a figura corporal vívida, sem suavizá-la para 'corpo' nem torná-la excessivamente clínica.
theological_decisions:
- issue: Sentido antropológico de נַפְשֵׁנוּ
  choice: a nossa alma
  alternative: a nossa vida; nós mesmos
  rationale: O termo hebraico pode indicar alma, vida ou a própria pessoa. A tradução principal preserva a formulação poética tradicional, enquanto a nota registra a amplitude sem impor uma antropologia mais específica que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A repetição concreta de 'pó', 'ventre' e 'terra' preserva o paralelismo e a intensidade física do lamento.
