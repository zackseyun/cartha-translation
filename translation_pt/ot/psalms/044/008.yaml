  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים הִלַּלְ֣נוּ כָל הַ/יּ֑וֹם וְ/שִׁמְ/ךָ֓ לְ/עוֹלָ֖ם נוֹדֶ֣ה סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: pt
  text: Em Deus nos gloriamos o dia todo[a] e daremos graças ao teu nome para sempre[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “louvamos a Deus o dia todo” ou “exultamos em Deus o dia todo”. O verbo hebraico pode indicar louvor ou uma exultação comparável a gloriar-se, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao teu nome”, modo bíblico de se referir ao caráter e à reputação revelados de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Em Deus
  rationale: A preposição בְּ indica aqui mais naturalmente a esfera, o fundamento ou o objeto da exultação. “Em Deus” preserva essa relação sem reduzi-la a mero instrumento.
- source_word: הִלַּלְנוּ
  choice: nos gloriamos
  rationale: No piel, com בֵּאלֹהִים, הלל pode expressar louvor ou exultação confiante. “Nos gloriamos” comunica que Deus, e não o próprio povo, é o motivo de orgulho.
- source_word: כָל הַיּוֹם
  choice: o dia todo
  rationale: Expressão natural em português atual que conserva a duração concreta indicada pelo hebraico.
- source_word: וְשִׁמְךָ
  choice: e ... ao teu nome
  rationale: Mantém “teu nome” como objeto do agradecimento e preserva a linguagem bíblica referente ao caráter e à reputação revelados de Deus.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente claro e idiomático para a duração indefinida ou permanente expressa pelo hebraico.
- source_word: נוֹדֶה
  choice: daremos graças
  rationale: O hiphil de ידה costuma indicar agradecimento ou louvor reconhecido. O futuro traduz adequadamente o imperfeito como declaração contínua e prospectiva.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo litúrgico é incerto, ele é transliterado, sem tradução conjectural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nos gloriamos” preserva a ambiguidade entre louvor e exultação sem sugerir orgulho autônomo; “Selá” mantém o marcador litúrgico hebraico.
