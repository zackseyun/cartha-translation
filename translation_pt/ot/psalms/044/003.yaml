source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: pt
  text: 'Pois não foi com a sua espada que tomaram posse da terra,

    nem foi o seu braço que os salvou,

    mas a tua mão direita, o teu braço

    e a luz do teu rosto[a],

    porque te agradaste deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a luz da tua presença»; em hebraico, literalmente, «a luz do teu rosto», imagem do favor divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: tomaram posse
  rationale: No contexto da conquista, o verbo indica obter a posse da terra; a expressão preserva o sentido ativo sem reduzi-lo a uma herança passiva.
- source_word: אָרֶץ
  choice: da terra
  rationale: O contexto aponta para a terra conquistada, não para a terra ou o mundo em sentido universal.
- source_word: זְרוֹעָם
  choice: o seu braço
  rationale: Mantém a metáfora corporal e o contraste poético com o braço de Deus.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: os salvou
  rationale: Preserva o sentido básico do hifil de ישׁע e continua natural no contexto militar.
- source_word: יְמִינְךָ
  choice: a tua mão direita
  rationale: Conserva a imagem hebraica tradicional da ação poderosa de Deus.
- source_word: זְרוֹעֲךָ
  choice: o teu braço
  rationale: Mantém o paralelismo e o contraste direto com o braço humano.
- source_word: אוֹר פָּנֶיךָ
  choice: a luz do teu rosto
  rationale: Preserva a imagem concreta hebraica da presença favorável de Deus, sem substituí-la por uma interpretação.
- source_word: רְצִיתָם
  choice: te agradaste deles
  rationale: Expressa favor e prazer divinos de modo natural, pessoal e semanticamente próximo do hebraico.
- source_word: כִּי ... כִּי
  choice: Pois ... porque
  rationale: O primeiro conector introduz a explicação do contexto anterior; o último apresenta a razão da ação favorável de Deus.
theological_decisions:
- issue: Ação divina em contraste com o poder militar humano
  choice: A posse da terra e a salvação são atribuídas à mão, ao braço e ao favor de Deus, não à espada ou à força do povo.
  alternative: Ler o verso apenas como uma afirmação geral de dependência de Deus.
  rationale: O paralelismo hebraico estabelece explicitamente o contraste entre os recursos deles e a ação de Deus; a tradução o mantém sem ampliar a afirmação para além do verso.
- issue: אוֹר פָּנֶיךָ como imagem de favor ou presença
  choice: Manter no texto principal «a luz do teu rosto».
  alternative: «a luz da tua presença» ou «o teu favor».
  rationale: A formulação literal conserva a riqueza e a ambiguidade da imagem poética; a nota esclarece seu sentido provável sem substituir a metáfora.
- issue: Elipse verbal na oração positiva
  choice: Conservar a coordenação elíptica depois de «mas», deixando que os elementos divinos contrastem com as ações negadas anteriormente.
  alternative: Acrescentar «é que fizeram isso» ou reestruturar como «foi... que lhes deu a terra e os salvou».
  rationale: O português poético admite a elipse, e assim se evita impor um único verbo a duas ações anteriores distintas ou acrescentar material explicativo ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular para preservar a oração direta a Deus. A disposição em versos evidencia o paralelismo hebraico. «Seu» refere-se ao povo pelo contexto; «teu» refere-se inequivocamente a Deus.
