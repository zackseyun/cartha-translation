base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: pt
  text: Tu nos fazes recuar para longe do adversário[a], e os que nos odeiam saqueiam para si.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu nos fazes recuar diante do adversário”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e os que nos odeiam tomaram despojos para si”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ
  choice: Tu nos fazes recuar
  rationale: O hifil de שוב tem sentido causativo, «fazer voltar/recuar». No contexto militar, «fazes recuar» expressa de modo natural uma retirada imposta.
- source_word: אָחוֹר
  choice: recuar
  rationale: Embora literalmente indique «para trás», seu valor adverbial está incorporado naturalmente no verbo português «recuar».
- source_word: מִנִּי צָר
  choice: diante do adversário
  rationale: A construção pode descrever o recuo para longe do oponente ou diante dele. «Diante do adversário» preserva o cenário militar sem tornar a direção excessivamente explícita.
- source_word: מְשַׂנְאֵינוּ
  choice: os que nos odeiam
  rationale: Mantém a força verbal do particípio e não o reduz ao termo mais genérico «inimigos».
- source_word: שָׁסוּ
  choice: saqueiam
  rationale: O verbo denota tomar despojos. O presente dá vivacidade à lamentação e corresponde ao valor contextual da forma hebraica.
- source_word: לָמוֹ
  choice: para si mesmos
  rationale: O pronome pode funcionar como dativo de vantagem, indicando que os adversários tomam o saque em benefício próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. O tratamento por «Tu» mantém a oração direta a Deus; «adversário» distingue צָר de «os que nos odeiam».
