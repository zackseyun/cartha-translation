source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: pt
  text: Tu, com a tua mão, expulsaste nações e os plantaste; afligiste povos e os dispersaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afligiste povos e fizeste que eles se espalhassem”, entendendo o último pronome como referência aos antepassados de Israel, e não aos povos.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: com a tua mão
  rationale: Expressa naturalmente em português o valor instrumental da mão como imagem concreta do poder e da ação de Deus.
- source_word: גּוֹיִם
  choice: nações
  rationale: Designa os grupos nacionais estrangeiros que ocupavam a terra; evita o sentido posterior e mais específico de “gentios”.
- source_word: הוֹרַשְׁתָּ
  choice: expulsaste
  rationale: O hifil de ירשׁ indica aqui fazer perder a posse e retirar da terra; “expulsaste” comunica isso com clareza.
- source_word: וַתִּטָּעֵם
  choice: e os plantaste
  rationale: Preserva a metáfora agrícola de estabelecer um povo na terra e mantém implícito, como no hebraico, o referente do pronome.
- source_word: תָּרַע
  choice: afligiste
  rationale: Comunica o dano imposto aos povos sem especificar indevidamente a forma dessa ação.
- source_word: לְאֻמִּים
  choice: povos
  rationale: Mantém a variação poética em relação a “nações” e representa adequadamente o termo hebraico.
- source_word: וַתְּשַׁלְּחֵם
  choice: e os dispersaste
  rationale: No paralelismo da conquista, שלח descreve o envio para fora ou dispersão dos povos; a escolha evita o sentido excessivamente neutro de simplesmente deixá-los partir.
theological_decisions:
- issue: Referente dos sufixos pronominais em “os plantaste” e “os dispersaste”
  choice: O primeiro se refere aos antepassados de Israel, e o último, aos povos ou nações.
  alternative: Ambos podem ser entendidos como referentes aos antepassados de Israel, de modo que a última expressão seria “os fizeste se espalhar”.
  rationale: O contexto celebra tanto a expulsão das nações como o estabelecimento de Israel. A compressão poética hebraica permite mais de uma identificação do último referente; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa coerentes com “tu”. A ordem poética e as metáforas do hebraico foram preservadas sem explicitar no corpo do versículo os referentes pronominais implícitos.
