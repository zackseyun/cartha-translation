  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: pt
  text: Tu és o meu Rei, ó Deus; ordena vitórias[a] para Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ordena livramentos para Jacó»; ou «decreta salvações para Jacó».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Tu és
  rationale: A combinação pronominal é enfática. Em português, «Tu és» mantém a declaração direta e solene; a ênfase mais explícita («Tu mesmo és») seria possível, mas tornaria o verso mais pesado.
- source_word: מַלְכִּי
  choice: o meu Rei
  rationale: O substantivo com sufixo de primeira pessoa singular significa «meu rei». O artigo antes do possessivo é natural em português, e a maiúscula assinala o título usado para Deus sem acrescentar conteúdo teológico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O termo funciona como vocativo depois de «o meu Rei». A partícula «ó» preserva de modo natural o caráter de invocação poética.
- source_word: צַוֵּה
  choice: ordena
  rationale: O imperativo piel de צוה significa «ordenar, mandar». «Ordena» é direto e preserva a imagem de Deus determinando os atos de livramento.
- source_word: יְשׁוּעוֹת
  choice: vitórias
  rationale: O plural pode designar salvações ou livramentos. No contexto militar e coletivo do salmo, «vitórias» comunica de forma concreta esses atos salvadores, enquanto a nota conserva as alternativas lexicais.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome poético e pactual empregado pelo hebraico para o povo, sem substituí-lo interpretativamente por «Israel».
theological_decisions:
- issue: Sentido de יְשׁוּעוֹת em um salmo de contexto militar
  choice: vitórias
  alternative: livramentos; salvações
  rationale: O contexto próximo trata de inimigos e combate, favorecendo atos históricos e coletivos de libertação. «Vitórias» expressa essa concretude sem eliminar o sentido mais amplo de salvação, registrado na nota.
- issue: Estrutura da referência direta a Deus
  choice: «ó Deus» como vocativo
  alternative: «meu Rei, Deus» como aposição; «meu rei é Deus» como declaração
  rationale: 'A sintaxe se lê mais naturalmente como oração dirigida a Deus: «Tu és o meu Rei, ó Deus». Isso preserva a força devocional e poética sem resolver a frase como uma proposição diferente.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega-se «Tu» por sua naturalidade no registro bíblico-poético e por corresponder ao singular direto do hebraico. «Jacó» conserva a referência coletiva em sua forma poética original.
