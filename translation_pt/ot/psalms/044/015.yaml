base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: pt
  text: O dia todo, minha desonra está diante de mim, e a vergonha do meu rosto me cobre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a vergonha em meu rosto me cobre”. O hebraico diz mais literalmente: “e a vergonha do meu rosto me cobre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: O dia todo
  rationale: Expressão temporal idiomática que preserva a ideia de duração ao longo de todo o dia.
- source_word: כְּלִמָּתִי
  choice: minha desonra
  rationale: O substantivo denota desonra pública ou humilhação; “desonra” mantém essa dimensão social e evita repetir “vergonha” no segundo membro.
- source_word: נֶגְדִּי
  choice: está diante de mim
  rationale: Reproduz de modo natural a ideia de algo continuamente presente perante o olhar do falante.
- source_word: וּבֹשֶׁת פָּנַי
  choice: e a vergonha do meu rosto
  rationale: Mantém a construção hebraica e sua imagem deliberadamente ambígua, sem decidir se a vergonha pertence ao rosto ou aparece sobre ele.
- source_word: כִּסָּתְנִי
  choice: me cobre
  rationale: Preserva a metáfora concreta de a vergonha envolver o salmista; o presente comunica com naturalidade o estado vigente no contexto poético.
