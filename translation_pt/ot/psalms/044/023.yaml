base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: pt
  text: Desperta! Por que dormes, Senhor? Acorda! Não nos rejeites para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֤וּרָה
  choice: Desperta!
  rationale: Imperativo de עור. Preserva a convocação direta, vigorosa e digna dirigida a Deus.
- source_word: לָמָּה
  choice: Por que
  rationale: Forma interrogativa natural em português para introduzir a queixa.
- source_word: תִישַׁן
  choice: dormes
  rationale: O presente simples mantém a pergunta retórica e a metáfora ousada do sono divino.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Título divino em vocativo, traduzido pela forma corrente e reverente em português.
- source_word: הָקִיצָה
  choice: Acorda!
  rationale: Segundo imperativo ligado ao despertar. A escolha distingue os dois verbos hebraicos sem perder o paralelismo intensificador.
- source_word: אַל תִּזְנַח
  choice: Não nos rejeites
  rationale: זנח denota rejeitar, repudiar ou abandonar. “Rejeitar” é claro, atual e conserva a força da súplica.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressão portuguesa natural para a ideia de duração indefinida ou permanente.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus dormir e despertar
  choice: Manter diretamente as imagens de dormir, despertar e acordar
  alternative: Atenuar como “Por que pareces inativo, Senhor?”
  rationale: O hebraico emprega deliberadamente essa linguagem ousada no lamento. A tradução preserva a tensão poética e teológica, sem convertê-la em uma afirmação de que Deus dorme literalmente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa do singular preserva a solenidade poética e a concordância tradicional da oração dirigida a Deus. Não se acrescentou nota, pois a alternativa lexical “abandonar-nos” não é necessária para compreender o hebraico.
