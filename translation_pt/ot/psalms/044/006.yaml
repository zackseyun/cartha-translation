  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: pt
  text: Pois não confio no meu arco,[a] e a minha espada não me salva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois não confiarei no meu arco, e a minha espada não me salvará». Os verbos hebraicos também podem ter nuance futura.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto militar, «salva» também pode ser traduzido por «dá a vitória» ou «livra».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da afirmação no contexto e mantém com naturalidade o fluxo poético.
- source_word: בְקַשְׁתִּי
  choice: no meu arco
  rationale: קֶשֶׁת designa o arco como arma, e a preposição ב é exigida pelo verbo בטח, formando a expressão natural «confiar no meu arco».
- source_word: אֶבְטָח
  choice: não confio
  rationale: O qal de בטח significa «confiar» ou «apoiar-se». O presente exprime bem a atitude geral do salmista, embora o imperfeito hebraico também admita nuance futura.
- source_word: וְחַרְבִּי
  choice: e a minha espada
  rationale: Tradução direta de חֶרֶב com sufixo de primeira pessoa; a conjunção preserva o paralelismo entre arco e espada.
- source_word: תוֹשִׁיעֵנִי
  choice: não me salva
  rationale: O hifil de ישׁע pode significar «salvar», «livrar» ou «dar vitória». «Salvar» conserva a amplitude semântica e permanece natural no contexto militar.
theological_decisions:
- issue: Sentido da linguagem de livramento em contexto militar
  choice: «não me salva»
  alternative: «não me dá a vitória» ou «não me livra»
  rationale: Embora a vitória militar esteja em vista, «salva» preserva o alcance mais amplo da raiz hebraica e o tema da dependência de Deus, sem limitar indevidamente a declaração ao êxito no campo de batalha.
- issue: Valor temporal dos verbos no imperfeito hebraico
  choice: 'Presente geral: «não confio» e «não me salva»'
  alternative: 'Futuro ou volitivo contextual: «não confiarei» e «não me salvará»'
  rationale: O paralelismo e o contexto favorecem uma declaração geral sobre a fonte da confiança e do livramento, mas a nota conserva a nuance futura legítima.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi mantido, e as ambiguidades temporal e lexical do hebraico foram registradas em notas.
