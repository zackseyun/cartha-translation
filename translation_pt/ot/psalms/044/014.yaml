  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: pt
  text: Fazes de nós um provérbio entre as nações[a], um balançar de cabeça entre os povos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dito de desprezo entre as nações”. O hebraico מָשָׁל pode indicar um provérbio ou uma expressão proverbial de escárnio.
    reason: lexical_alternative
  - marker: b
    text: O balançar da cabeça era um gesto de zombaria ou desprezo.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Fazes de nós
  rationale: O verbo שׂים pode significar pôr, estabelecer ou fazer. Aqui, a construção resultativa é expressa naturalmente por “fazes de nós”, mantendo a referência direta a Deus na segunda pessoa do singular.
- source_word: מָשָׁל
  choice: um provérbio
  rationale: מָשָׁל pode designar provérbio, dito proverbial ou expressão de desprezo. “Provérbio” preserva o equivalente lexical direto, enquanto a nota registra a nuance possível de escárnio.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם indica aqui nações ou povos estrangeiros em geral; “nações” evita uma leitura técnica posterior de “gentios”.
- source_word: מְנוֹד רֹאשׁ
  choice: motivo de balançarem a cabeça
  rationale: A expressão descreve o gesto concreto de mover a cabeça em sinal de zombaria ou desprezo. A formulação portuguesa preserva a imagem e torna clara sua relação sintática com “nós”.
- source_word: בַּל אֻמִּים
  choice: entre os povos
  rationale: A expressão é paralela a בַּגּוֹיִם. “Entre os povos” mantém o paralelismo poético sem repetição desnecessária de “nações”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O presente “fazes” acompanha a forma verbal hebraica e sustenta a queixa dirigida diretamente a Deus; a imagem poética do movimento da cabeça foi preservada.
