base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: pt
  text: 'Tu nos entregas como ovelhas para servir de alimento[a]

    e nos dispersaste entre as nações[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu nos entregas como ovelhas para alimento”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “nações” se refere aos povos estrangeiros entre os quais Israel foi disperso.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Tu nos entregas
  rationale: O verbo נתן significa basicamente “dar, pôr”, mas, neste lamento, o contexto exige o sentido natural de entregar alguém a um destino hostil. “Entregas” comunica isso sem acrescentar a ideia específica de abate.
- source_word: כְּצֹאן
  choice: como ovelhas
  rationale: A preposição כְּ introduz uma comparação; “como ovelhas” preserva de modo claro e natural a imagem hebraica.
- source_word: מַאֲכָל
  choice: para alimento
  rationale: O substantivo significa “alimento” ou aquilo que se come. A formulação mantém a imagem severa do povo tratado como presa, sem tornar o termo mais específico do que o hebraico.
- source_word: וּבַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui os povos estrangeiros entre os quais Israel foi disperso. “Nações” é uma tradução ampla e adequada ao contexto do salmo.
- source_word: זֵרִיתָנוּ
  choice: nos dispersaste
  rationale: זרה pode significar espalhar ou joeirar. Neste contexto de dispersão entre povos estrangeiros, “dispersaste” expressa com clareza o sentido contextual e mantém o aspecto concluído da forma verbal hebraica.
theological_decisions:
- issue: Metáfora do povo como ovelhas destinadas a alimento
  choice: como ovelhas para alimento
  alternative: como ovelhas para o abate; como ovelhas para serem devoradas
  rationale: A tradução conserva a dureza do lamento e a imagem do povo entregue como presa, sem introduzir “abate”, ideia mais específica que não está expressa em מַאֲכָל.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. O paralelismo poético foi mantido em dois versos; empregou-se “Tu” para preservar a interpelação direta a Deus. A combinação do presente “entregas” com o pretérito “dispersaste” acompanha as formas verbais hebraicas sem apagar a tensão temporal do lamento.
