  register: Português moderno, claro e digno, com cadência poética. Mantém o tratamento divino na segunda pessoa do singular (“tu”), comum na linguagem bíblica em português, e preserva o paralelismo entre o livramento dos adversários e a vergonha dos que odeiam o povo.
