  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: pt
  text: Pois tu nos salvaste dos nossos adversários e envergonhaste os que nos odeiam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração anterior, preservando de modo natural a força explicativa do hebraico.
- source_word: הוֹשַׁעְתָּנוּ
  choice: tu nos salvaste
  rationale: O hifil de יָשַׁע expressa salvar ou livrar; o pretérito perfeito comunica a ação divina concluída sem restringi-la à ideia de vitória militar.
- source_word: מִצָּרֵינוּ
  choice: dos nossos adversários
  rationale: צַר designa quem se opõe hostilmente; “adversários” mantém a amplitude semântica e combina com o registro poético do salmo.
- source_word: וּמְשַׂנְאֵינוּ
  choice: e os que nos odeiam
  rationale: A forma participial de שָׂנֵא refere-se literalmente aos que odeiam; esta formulação é clara e natural em português.
- source_word: הֱבִישׁוֹתָ
  choice: envergonhaste
  rationale: 'O hifil de בּוֹשׁ tem sentido causativo: fazer passar vergonha ou cobrir de vergonha. “Envergonhaste” preserva isso de forma concisa e digna.'
theological_decisions: []
