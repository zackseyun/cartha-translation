lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente o responsável pela execução musical. “Ao regente” é conciso, natural em português e mantém aberta a possibilidade de direção ou dedicatória.
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: A preposição hebraica pode indicar autoria, pertença, associação ou destinação. “Dos filhos de” conserva essa associação sem determinar em excesso sua natureza.
- source_word: קֹרַח
  choice: Corá
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מַשְׂכִּיל
  choice: Um maskil
  rationale: O sentido técnico do termo nos títulos dos salmos é incerto. A transliteração evita defini-lo indevidamente como gênero instrutivo, contemplativo ou musical.
