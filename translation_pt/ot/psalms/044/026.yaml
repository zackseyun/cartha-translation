  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: pt
  text: Levanta-te para nos ajudar[a] e redime-nos[b] por causa do teu amor leal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levanta-te como nossa ajuda”. O hebraico emprega literalmente o substantivo “ajuda”, e não o verbo “ajudar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “resgata-nos” ou “liberta-nos”. O verbo hebraico pode indicar libertação mediante resgate ou por intervenção decisiva.'
    reason: lexical_alternative
  - marker: c
    text: “Amor leal” traduz o hebraico hesed, que muitas vezes se refere ao amor fiel e constante de Deus em sua relação de aliança.
    reason: cultural_note
lexical_decisions:
- source_word: ק֭וּמָֽה
  choice: Levanta-te
  rationale: O imperativo qal masculino singular de קום é um apelo urgente para que Deus entre em ação. “Levanta-te” conserva a imagem e a força do hebraico em português digno e corrente.
- source_word: עֶזְרָ֣תָה לָּ֑נוּ
  choice: para nos ajudar
  rationale: Embora o hebraico empregue o substantivo “ajuda”, a construção indica ajuda em nosso favor. A formulação verbal é mais natural em português, enquanto a nota preserva a forma nominal e sua alternativa mais literal.
- source_word: וּ֝פְדֵ֗נוּ
  choice: e redime-nos
  rationale: O imperativo de פדה com sufixo de primeira pessoa do plural pode indicar libertar, resgatar ou remir. “Redime-nos” preserva a densidade de libertação e vínculo pactual sem especificar um mecanismo de pagamento.
- source_word: לְמַ֣עַן
  choice: por causa de
  rationale: A expressão introduz o fundamento ou motivo do apelo. “Por causa de” é natural em português e deixa claro que a ação divina é solicitada com base no amor leal de Deus.
- source_word: חַסְדֶּֽךָ
  choice: teu amor leal
  rationale: חסד reúne as ideias de amor, lealdade e fidelidade relacional, frequentemente no contexto da aliança. “Amor leal” comunica essas dimensões de modo claro sem reduzir o termo apenas a misericórdia.
theological_decisions:
- issue: Se פדה deve receber uma tradução especificamente teológica
  choice: redime-nos
  alternative: resgata-nos; liberta-nos
  rationale: “Redime-nos” conserva a profundidade pactual e libertadora do verbo, mas não importa para o verso detalhes doutrinários posteriores nem exige que haja pagamento em vista.
- issue: Como preservar a amplitude pactual de חסד
  choice: teu amor leal
  alternative: teu amor constante; tua misericórdia; teu amor de aliança
  rationale: “Amor leal” mantém em tensão afeto, fidelidade e compromisso, sem tornar explícita a palavra “aliança”, que não aparece neste verso, nem estreitar o sentido a “misericórdia”.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O verso mantém o apelo urgente e poético; usa colocação pronominal compatível com registro bíblico digno, sem arcaísmo excessivo. As notas conservam a construção nominal incomum e a amplitude semântica dos termos פדה e חסד.
