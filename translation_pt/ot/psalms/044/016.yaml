  text: מִ֭/קּוֹל מְחָרֵ֣ף וּ/מְגַדֵּ֑ף מִ/פְּנֵ֥י א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: pt
  text: por causa da voz de quem insulta e blasfema, por causa do inimigo e do vingador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: por causa da voz de
  rationale: A preposição מִן com קוֹל tem aqui valor causal. A formulação preserva a imagem concreta da voz e explicita naturalmente a causa em português.
- source_word: מְחָרֵף
  choice: de quem insulta
  rationale: O particípio de חרף descreve quem lança afrontas ou insultos. “Quem insulta” é atual, claro e mantém a força verbal do particípio.
- source_word: וּמְגַדֵּף
  choice: e blasfema
  rationale: גדף pode indicar fala injuriosa, com frequência dotada de nuance ímpia. “Blasfema” conserva essa força possível sem acrescentar um objeto não expresso.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Embora a expressão signifique literalmente “da face/presença de”, aqui funciona idiomaticamente como indicação de causa, em paralelo com מִקּוֹל.
- source_word: אֹיֵב
  choice: o inimigo
  rationale: Mantém o singular definido hebraico e pode ser entendido de modo representativo ou coletivo, sem explicitação interpretativa.
- source_word: וּמִתְנַקֵּם
  choice: e o vingador
  rationale: O particípio hitpael de נקם designa aquele que busca ou executa vingança. “O vingador” é conciso e preserva a forma pessoal substantivada.
theological_decisions:
- issue: A fala hostil pode ser tanto insulto contra o povo quanto afronta de caráter ímpio.
  choice: blasfema
  alternative: difama / profere injúrias
  rationale: “Blasfema” preserva a carga religiosa possível de גדף no uso bíblico, sem definir explicitamente se a afronta se dirige a Deus ou ao seu povo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “por causa” reproduz o paralelismo causal do hebraico; “voz” mantém sua imagem concreta. Não foram necessárias notas.
