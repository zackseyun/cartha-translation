id: PSA.44.5
reference: Psalms 44:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: pt
  text: Por meio de ti, rechaçamos os nossos adversários[a]; por meio do teu nome[b], pisoteamos os que se levantam contra nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode significar literalmente “golpear com os chifres” ou “dar chifradas”; aqui é uma metáfora para repelir com força os adversários.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “em teu nome”. Aqui, “nome” se refere à identidade, autoridade e poder revelados de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: por meio de ti
  rationale: A preposição בְּ com sufixo pessoal expressa aqui meio ou agência. A formulação atribui a Deus a capacidade decisiva para a vitória, sem apagar a ação humana descrita pelos verbos.
- source_word: צָרֵינוּ
  choice: os nossos adversários
  rationale: צָרֵינוּ designa opositores hostis. “Adversários” é claro, digno e adequado ao paralelismo poético.
- source_word: נְנַגֵּחַ
  choice: rechaçamos
  rationale: O verbo נָגַח evoca literalmente golpear ou dar chifradas e, neste contexto militar, comunica repelir os inimigos com força. “Rechaçamos” preserva o movimento de fazê-los recuar sem introduzir no texto principal uma imagem animal potencialmente obscura.
- source_word: בְּשִׁמְךָ
  choice: por meio do teu nome
  rationale: Mantém o paralelismo instrumental com בְּךָ. “Nome” representa a identidade, autoridade e poder revelados de Deus, não uma fórmula verbal autônoma.
- source_word: נָבוּס
  choice: pisoteamos
  rationale: בּוּס significa calcar ou pisotear. A escolha conserva a imagem marcial vívida e a ação verbal do hebraico.
- source_word: קָמֵינוּ
  choice: os que se levantam contra nós
  rationale: O particípio derivado de קוּם descreve aqueles que se erguem em oposição. A oração relativa preserva essa nuance verbal.
theological_decisions:
- issue: Agência da vitória na imagem de batalha
  choice: Deus é apresentado como o meio e a fonte decisiva da vitória, enquanto o povo continua sendo o sujeito das ações de rechaçar e pisotear.
  alternative: Enfatizar apenas a ação militar humana, ou entender “teu nome” como uma invocação de efeito automático.
  rationale: As expressões paralelas בְּךָ e בְּשִׁמְךָ atribuem instrumentalmente a vitória a Deus, ao passo que os verbos na primeira pessoa do plural preservam a participação humana. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Rechaçamos” e “pisoteamos” preservam o vigor poético e militar; a repetição de “por meio de” reproduz o paralelismo e explicita a agência divina sem interpretação denominacional.
