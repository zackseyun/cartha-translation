source:
  edition: WLC
  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: pt
  text: Tudo isso veio sobre nós, mas não nos esquecemos de ti nem fomos infiéis[a] à tua aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem agimos com falsidade para com a tua aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹאת
  choice: Tudo isso
  rationale: Expressa naturalmente a referência coletiva e abrangente às aflições mencionadas anteriormente.
- source_word: בָּאַתְנוּ
  choice: veio sobre nós
  rationale: Preserva a imagem do verbo בוא, segundo a qual a adversidade chega ou sobrevém ao povo.
- source_word: וְלֹא
  choice: mas não ... nem
  rationale: Torna explícito, de modo idiomático, o contraste entre as calamidades sofridas e a fidelidade que o povo afirma ter mantido.
- source_word: שְׁכַחֲנוּךָ
  choice: não nos esquecemos de ti
  rationale: Conserva o sentido direto do verbo e o pronome de segunda pessoa dirigido a Deus.
- source_word: שִׁקַּרְנוּ
  choice: fomos infiéis
  rationale: No contexto da aliança, o verbo indica agir com falsidade ou deslealdade; “fomos infiéis” comunica essa ideia com clareza sem reduzi-la ao ato de dizer uma mentira.
- source_word: בִּבְרִיתֶךָ
  choice: à tua aliança
  rationale: A preposição ב, ligada a שקר, assinala aquilo em relação ao qual se teria agido falsamente; em português, “infiel à tua aliança” é a construção natural.
theological_decisions:
- issue: Alcance da alegação de inocência de Israel em meio ao sofrimento
  choice: A tradução apresenta uma declaração específica de fidelidade a Deus e à sua aliança.
  alternative: Entender o versículo como uma alegação geral de absoluta ausência de pecado.
  rationale: O hebraico nega especificamente que o povo tenha esquecido Deus ou agido falsamente em relação à aliança; não amplia a afirmação para uma inocência total.
translation_notes:
  register: Português moderno, claro e digno, com formas pronominais tradicionais amplamente compreensíveis (“ti”, “tua”). A coordenação “mas ... nem” mantém o contraste e evita repetição pesada.
