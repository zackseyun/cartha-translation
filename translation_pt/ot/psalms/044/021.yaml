lexical_decisions:
- source_word: הֲלֹא
  choice: Não ...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a formulação interrogativa preserva essa força sem convertê-la em afirmação.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, aqui funciona como título divino singular e se refere ao Deus de Israel.
- source_word: יַחֲקָר
  choice: investigaria
  rationale: O verbo denota examinar ou esquadrinhar a fundo. “Investigaria” comunica naturalmente em português a ideia de apuração cuidadosa, adequada ao contexto.
- source_word: זֹאת
  choice: isso
  rationale: O demonstrativo retoma de modo compacto a questão mencionada no contexto anterior.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a pergunta retórica, preservando a lógica concisa do hebraico.
- source_word: יֹדֵעַ
  choice: conhece
  rationale: O particípio exprime o conhecimento constante e característico de Deus; o presente simples transmite essa realidade.
- source_word: תַּעֲלֻמוֹת
  choice: as coisas ocultas
  rationale: O substantivo designa coisas escondidas ou segredos. A expressão mantém o sentido lexical amplo sem especificar indevidamente sua natureza.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica, que abrange pensamentos, intenções, vontade e afetos.
theological_decisions:
- issue: Expressão antropológica לֵב
  choice: coração
  alternative: mente; íntimo
  rationale: “Coração” conserva a amplitude e a imagem do hebraico, sem restringir o termo apenas ao intelecto ou aos sentimentos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pergunta retórica e o paralelismo lógico foram preservados; “investigaria” evita uma formulação excessivamente coloquial.
