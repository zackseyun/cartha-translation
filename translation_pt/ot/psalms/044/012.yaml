base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: pt
  text: Vendes o teu povo por nada[a] e não lucras com o preço deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vendes o teu povo sem obter riqueza”. Também é possível traduzir o verbo no passado: “Vendeste”.'
    reason: A expressão בְּלֹא הוֹן contém o substantivo “riqueza, bens” e, no contexto comercial, pode ser entendida como ausência de ganho. O imperfeito hebraico pode ser entendido como presente vívido ou como ação passada no contexto.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Vendes
  rationale: O Qal imperfeito na segunda pessoa masculina singular dirige-se a Deus. O presente conserva a vivacidade da queixa poética; o passado também seria possível pelo contexto.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Preserva tanto o sentido coletivo de עַם como a relação entre Deus e o povo que lhe pertence.
- source_word: בְלֹא הוֹן
  choice: por quase nada
  rationale: הוֹן denota riqueza ou bens. No contexto de uma venda, a expressão indica ausência de retorno valioso; 'por quase nada' é natural em português e evita sugerir literalmente uma transação sem preço, visto que a segunda oração menciona o preço.
- source_word: רִבִּיתָ
  choice: não aumentas a tua riqueza
  rationale: O Piel de רבה comunica fazer aumentar ou multiplicar. O complemento 'a tua riqueza', implícito no contexto e apoiado por הוֹן na primeira oração, torna a frase natural sem reduzir o verbo simplesmente a 'lucrar'.
- source_word: בִּמְחִירֵיהֶם
  choice: com o preço deles
  rationale: מְחִיר significa preço, e בְּ pode indicar meio. 'Com o preço deles' conserva a imagem comercial e a ligação instrumental.
theological_decisions:
- issue: Atribuição direta da venda do povo a Deus
  choice: 'Manter a segunda pessoa direta: ''Vendes o teu povo'''
  alternative: 'Amenizar como permissão divina: ''Deixas que o teu povo seja vendido'''
  rationale: O hebraico atribui diretamente a ação a Deus no lamento. A tradução não deve resolver ou suavizar a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se 'tu' de modo coerente com a oração dirigida diretamente a Deus. A formulação mantém o paralelismo e a metáfora comercial do hebraico.
