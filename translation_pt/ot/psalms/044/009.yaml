base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: pt
  text: Contudo, tu nos rejeitaste e nos envergonhaste, e não sais com os nossos exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não sais em nossos exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Contudo
  rationale: A partícula introduz um contraste forte com as afirmações anteriores sobre a ajuda de Deus; “Contudo” expressa essa virada de modo natural e digno.
- source_word: זָנַחְתָּ
  choice: tu nos rejeitaste
  rationale: O verbo זנח comunica rejeição ou abandono. O pretérito perfeito preserva a forma verbal hebraica e, no contexto, mantém relevância para a situação presente do lamento.
- source_word: וַתַּכְלִימֵנוּ
  choice: e nos envergonhaste
  rationale: 'O hifil de כלם tem sentido causativo: fazer passar vergonha ou cobrir de desonra. “Nos envergonhaste” é conciso, claro e próximo da forma hebraica.'
- source_word: וְלֹא תֵצֵא
  choice: e já não sais
  rationale: יצא significa literalmente “sair”. O presente português comunica a retirada atual da presença divina; “já não” torna explícita a mudança contrastante implícita no contexto, sem transformar o verbo em “marchar”.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: com os nossos exércitos
  rationale: צְבָאוֹת designa aqui forças militares. A preposição בְּ pode indicar associação ou presença no meio de algo; “com” produz português natural, enquanto a alternativa mais literal é preservada em nota.
theological_decisions:
- issue: Retirada da presença divina na batalha
  choice: O verso é traduzido como lamento por Deus já não acompanhar os exércitos de Israel.
  alternative: “não sais no meio dos nossos exércitos”
  rationale: A tradução conserva a tensão do salmista ao atribuir a Deus a rejeição e a ausência militar, sem explicar a causa nem harmonizar a afirmação com uma doutrina externa ao texto.
translation_notes:
  register: Português moderno, claro e solene, com segunda pessoa singular para representar diretamente as formas hebraicas dirigidas a Deus. A nota registra a amplitude da preposição בְּ. O marcador foi colocado após a oração a que se refere.
