lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do que foi dito antes e mantém com naturalidade a ligação discursiva do hebraico.
- source_word: דִכִּיתָנוּ
  choice: tu nos esmagaste
  rationale: Preserva a força do verbo דכה, que comunica esmagar, quebrantar ou humilhar, sem reduzi-lo a mero sofrimento emocional.
- source_word: בִּמְקוֹם
  choice: numa terra de
  rationale: No contexto poético de desolação, “numa terra de” soa natural em português e expressa um lugar caracterizado pela presença de chacais, sem exigir que se trate de um local definido.
- source_word: תַּנִּים
  choice: chacais
  rationale: Neste cenário terrestre de desolação, o referente mais provável são chacais; traduções como “dragões” refletem uma tradição antiga, mas são zoologicamente menos prováveis no contexto.
- source_word: וַתְּכַס עָלֵינוּ
  choice: e nos cobriste
  rationale: Mantém a metáfora concreta de algo que recobre o povo e explicita naturalmente em português que Deus continua sendo o sujeito.
- source_word: בְצַלְמָוֶת
  choice: de profunda escuridão
  rationale: Comunica o provável sentido lexicalizado de trevas intensas e se ajusta à regência de “cobrir”; a leitura tradicional “sombra da morte” é preservada em nota.
theological_decisions:
- issue: Sentido de בְצַלְמָוֶת
  choice: profunda escuridão
  alternative: sombra da morte
  rationale: A expressão pode designar trevas densas ou ser entendida tradicionalmente como “sombra da morte”. O texto principal adota o sentido contextual provável sem transformar o verso numa referência inequívoca à morte, enquanto a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com a oração dirigida diretamente a Deus. “Terra de chacais” é idiomático e mantém a imagem poética de um lugar desolado. Os marcadores foram colocados junto às expressões a que cada nota se refere.
