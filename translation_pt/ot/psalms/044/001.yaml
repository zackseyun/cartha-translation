base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: pt
  text: Ó Deus, ouvimos com nossos ouvidos; nossos pais[a] nos contaram a obra que realizaste nos dias deles, em tempos antigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nossos antepassados”. Hebraico: “nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo está em emprego vocativo. Em português, «Ó Deus» expressa de modo natural e digno o chamamento direto, sem confundi-lo com uma simples afirmação.
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: ouvimos com os nossos próprios ouvidos
  rationale: Preserva a imagem corporal enfática do hebraico; «próprios» torna idiomática em português a força da expressão sem alterar seu sentido.
- source_word: אֲבוֹתֵינוּ
  choice: nossos pais
  rationale: Mantém o termo familiar masculino do hebraico e a ideia de transmissão entre gerações. «Nossos antepassados» é uma alternativa contextual possível.
- source_word: סִפְּרוּ לָנוּ
  choice: nos contaram
  rationale: Expressa naturalmente a narração e transmissão oral dos atos divinos.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: a obra que realizaste
  rationale: A combinação de substantivo e verbo cognatos descreve o feito de Deus. Esta formulação conserva a ideia de obra realizada sem produzir uma repetição artificial em português.
- source_word: בִּימֵיהֶם
  choice: nos dias deles
  rationale: Reproduz diretamente a referência ao período em que viveram os pais mencionados.
- source_word: בִּימֵי קֶדֶם
  choice: nos tempos antigos
  rationale: Comunica antiguidade remota em português atual e mantém o paralelismo temporal do verso.
theological_decisions:
- issue: Forma do vocativo inicial
  choice: Ó Deus
  alternative: Deus
  rationale: Embora o hebraico não tenha uma partícula vocativa correspondente a «ó», a função sintática é de chamamento direto. Em português, «Ó Deus» explicita essa função com naturalidade poética, sem acrescentar conteúdo doutrinário.
- issue: Identidade dos transmissores da tradição
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A tradução mantém o gênero e a relação familiar expressos por אֲבוֹתֵינוּ, sem decidir além do texto quais gerações específicas estão em vista; a alternativa mais abrangente é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. A expressão «com os nossos próprios ouvidos» conserva a ênfase concreta do hebraico, e «nos tempos antigos» evita tanto o arcaísmo excessivo quanto a linguagem coloquial.
