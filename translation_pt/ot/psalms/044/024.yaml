  text: לָֽ/מָּה פָנֶ֥י/ךָ תַסְתִּ֑יר תִּשְׁכַּ֖ח עָנְיֵ֣/נוּ וְֽ/לַחֲצֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: pt
  text: Por que escondes o teu rosto e te esqueces da nossa aflição e da opressão que sofremos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua presença”. O hebraico diz literalmente “o teu rosto”, expressão comum para indicar atenção favorável ou proximidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo natural de causa em português, preservando a queixa direta dirigida a Deus.
- source_word: פָנֶיךָ
  choice: o teu rosto
  rationale: Mantém a imagem hebraica literal, que expressa poeticamente a presença, a atenção e o favor de Deus.
- source_word: תַסְתִּיר
  choice: escondes
  rationale: Equivalente direto e idiomático do hifil de סתר no contexto da expressão 'esconder o rosto'.
- source_word: תִּשְׁכַּח
  choice: te esqueces
  rationale: Preserva a linguagem ousada e literal da lamentação; 'ignoras' reduziria a força e alteraria a imagem verbal.
- source_word: עָנְיֵנוּ
  choice: nossa aflição
  rationale: Termo corrente e digno para sofrimento ou miséria, adequado ao registro de lamentação.
- source_word: וְלַחֲצֵנוּ
  choice: e da opressão que sofremos
  rationale: Comunica a pressão hostil externa indicada por לַחַץ e evita a construção menos natural 'nossa opressão', que poderia sugerir opressão praticada por nós.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus em 'o teu rosto'
  choice: Conservar literalmente a expressão 'o teu rosto'.
  alternative: tua presença
  rationale: O hebraico emprega linguagem corporal e relacional para falar da atenção, proximidade e favor divinos. A imagem poética é preservada sem transformar a metáfora em abstração.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes ('teu', 'escondes', 'te esqueces'). A formulação conserva o paralelismo da lamentação e esclarece naturalmente que a opressão é sofrida pela comunidade.
