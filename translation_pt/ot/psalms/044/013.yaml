  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: pt
  text: Tu nos fizeste objeto de desprezo para nossos vizinhos, de zombaria e escárnio para os que nos rodeiam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Tu nos fizeste
  rationale: O verbo שׂים significa “pôr, colocar, fazer”. No contexto do lamento, o perfeito dirigido a Deus expressa a condição resultante; “Tu nos fizeste” a comunica naturalmente.
- source_word: חֶרְפָּה
  choice: motivo de humilhação
  rationale: חֶרְפָּה abrange afronta, desonra e opróbrio público. “Motivo de humilhação” mantém o sentido relacional de ser exposto ao desprezo alheio em português corrente.
- source_word: לִשְׁכֵנֵינוּ
  choice: para os nossos vizinhos
  rationale: 'A preposição ל marca relação ou referência: o povo se tornou objeto de desonra perante os povos vizinhos. “Para os nossos vizinhos” preserva essa relação sem estreitar indevidamente o referente.'
- source_word: לַעַג
  choice: zombaria
  rationale: לַעַג designa zombaria ou riso depreciativo. “Zombaria” é natural e distingue o primeiro termo da dupla intensificadora.
- source_word: קֶלֶס
  choice: escárnio
  rationale: קֶלֶס indica ridicularização e desprezo público. “Escárnio” preserva a força do termo e forma uma dupla idiomática com “zombaria”.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: para os que nos rodeiam
  rationale: A expressão significa literalmente “para os que estão ao nosso redor” e, no contexto, aponta para povos circundantes. A tradução mantém o referente amplo e a formulação natural.
theological_decisions:
- issue: Deus como agente da humilhação do povo
  choice: 'Manter a atribuição direta: “Tu nos fizeste”'
  alternative: Empregar uma formulação permissiva, como “Tu permitiste que nos tornássemos”
  rationale: O hebraico atribui diretamente a ação a Deus. Uma formulação apenas permissiva resolveria a tensão teológica que o lamento deliberadamente preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento divino por “Tu” e paralelismo poético preservado. “Motivo de humilhação” evita o caráter excessivamente técnico ou arcaizante de “opróbrio”, enquanto “zombaria e escárnio” conserva a intensificação dos substantivos hebraicos.
