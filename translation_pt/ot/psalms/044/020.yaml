  text: אִם שָׁ֭כַחְנוּ שֵׁ֣ם אֱלֹהֵ֑י/נוּ וַ/נִּפְרֹ֥שׂ כַּ֝פֵּ֗י/נוּ לְ/אֵ֣ל זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: pt
  text: Se tivéssemos esquecido o nome do nosso Deus e estendido as mãos a um deus estrangeiro—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus estranho”. O adjetivo hebraico pode significar “estrangeiro”, “estranho” ou “alheio”, no sentido de um deus que não pertence à adoração da aliança de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição hipotética; a forma simples e natural em português preserva a construção hebraica.
- source_word: שָׁכַחְנוּ
  choice: tivéssemos esquecido
  rationale: O perfeito qal, neste contexto condicional e retrospectivo, é bem expresso pelo pretérito mais-que-perfeito composto do subjuntivo.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: o nome do nosso Deus
  rationale: Mantém a formulação concreta e solene do hebraico; “nome” representa a identidade de Deus tal como conhecida e invocada.
- source_word: וַנִּפְרֹשׂ
  choice: e estendido
  rationale: Com “mãos”, o verbo descreve o gesto de estendê-las em oração ou súplica, sem substituir a imagem pela interpretação “adorado”.
- source_word: כַּפֵּינוּ
  choice: as mãos
  rationale: Embora כַּף possa designar a palma, “mãos” é a expressão idiomática natural em português para esse gesto de oração.
- source_word: לְאֵל זָר
  choice: a um deus estrangeiro
  rationale: A preposição indica a direção do gesto, e זָר caracteriza uma divindade alheia à adoração de Israel; “estrangeiro” é claro e preserva a referência cultual.
theological_decisions:
- issue: Gesto dirigido a outra divindade
  choice: estendido as mãos a um deus estrangeiro
  alternative: erguido as mãos a um deus estranho; adorado um deus estrangeiro
  rationale: A tradução conserva o gesto concreto de oração ou súplica e identifica seu objeto idólatra, sem explicitar além do hebraico que o ato equivaleria a “adorar”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A prótase hipotética foi mantida aberta com travessão, acompanhando a continuação sintática do contexto. O marcador [a] aparece no texto principal.
