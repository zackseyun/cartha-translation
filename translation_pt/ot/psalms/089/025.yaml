  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: pt
  text: Porei a mão dele sobre o mar[a], e a sua mão direita sobre os rios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porei a mão dele no mar, e a sua mão direita nos rios”. A imagem provavelmente expressa domínio ou alcance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Porei
  rationale: O perfeito qal na primeira pessoa do singular, ligado por conjunção e inserido em contexto promissório, é expresso naturalmente pelo futuro. “Porei” conserva a imagem concreta.
- source_word: בַיָּם
  choice: sobre o mar
  rationale: A preposição ב, nesta imagem de domínio, admite valor espacial que pode ser traduzido por “sobre”. A escolha mantém a metáfora sem explicitar diretamente a ideia de governo.
- source_word: יָדוֹ
  choice: a mão dele
  rationale: Preserva a imagem corporal concreta do hebraico e sua possível conotação de poder ou alcance.
- source_word: וּבַנְּהָרוֹת
  choice: e ... sobre os rios
  rationale: “Rios” é o sentido comum do plural נְהָרוֹת e forma o paralelo poético com “mar”; a repetição de “sobre” torna a estrutura clara em português.
- source_word: יְמִינוֹ
  choice: a sua mão direita
  rationale: A tradução literal mantém o paralelismo e as associações da mão direita com força e autoridade.
theological_decisions:
- issue: Imagem régia e de domínio
  choice: Manter a imagem concreta das mãos colocadas sobre o mar e os rios, deixando implícitos o domínio e o alcance concedidos por Deus.
  alternative: Estenderei o poder dele sobre o mar, e a sua mão direita sobre os rios.
  rationale: O verso emprega linguagem poética e metafórica. Preservar a metáfora evita reduzir sua riqueza a uma paráfrase política ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural e paralelismo poético. “A mão dele” evita a possível ambiguidade de “sua mão” na primeira linha; a segunda usa “a sua mão direita” sem prejuízo de clareza.
