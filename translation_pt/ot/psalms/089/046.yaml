  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: pt
  text: Até quando, ó Yahweh[a]? Tu te esconderás para sempre? Tua ira arderá como fogo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional do nome divino.
lexical_decisions:
- source_word: עַד מָה
  choice: Até quando
  rationale: Fórmula idiomática de lamento que expressa a duração angustiante da aflição; “Até quando” é natural em português e conserva a urgência da pergunta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando a forma pessoal de invocação no hebraico.
- source_word: תִּסָּתֵר
  choice: tu te esconderás
  rationale: O nifal de סתר admite sentido reflexivo ou passivo; no contexto, “te esconderás” expressa naturalmente a percepção de que Deus permanece oculto.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa duração indefinida ou permanente e mantém a força retórica do lamento.
- source_word: תִּבְעַר
  choice: arderá
  rationale: Verbo de combustão que preserva a metáfora do fogo sem acrescentar a ideia específica de consumir.
- source_word: כְּמוֹ אֵשׁ
  choice: como fogo
  rationale: Reproduz de modo direto e idiomático a comparação simples do hebraico.
- source_word: חֲמָתֶךָ
  choice: tua ira
  rationale: “Ira” mantém o sentido de indignação intensa e o registro elevado do salmo, sem exagerá-lo como “fúria” ou “raiva”.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto dirige-se diretamente ao Deus de Israel pelo tetragrama. “Yahweh” preserva o nome próprio na forma principal, enquanto a nota registra a tradição de substituí-lo por “SENHOR”.
- issue: Caráter interrogativo da última oração
  choice: Tua ira arderá como fogo?
  alternative: Até quando tua ira arderá como fogo?
  rationale: A sintaxe hebraica permite entender a oração final como pergunta própria ou como continuação do “até quando”. A tradução mantém a divisão interrogativa refletida pela pontuação massorética e evita inserir palavras não repetidas no texto.
translation_notes:
  register: Português moderno, digno e direto, com formas de segunda pessoa do singular coerentes com a invocação poética. A construção conserva as três perguntas incisivas e a metáfora da ira que arde como fogo.
