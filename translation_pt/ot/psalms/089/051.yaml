base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: pt
  text: com que teus inimigos te insultaram, ó Yahweh, com que insultaram os passos[a] do teu ungido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os calcanhares”, “as pegadas” ou “os rastros”. A imagem pode se referir aos movimentos, ao percurso ou à vinda do ungido de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou “do teu Messias”. O hebraico מְשִׁיחֶךָ significa “teu ungido” e, neste contexto, provavelmente se refere ao rei davídico, embora também tenha ressonância messiânica.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרְפוּ
  choice: insultaram
  rationale: O verbo expressa afronta, escárnio ou censura hostil. “Insultaram” é natural em português e conserva a força ofensiva do termo; o pretérito perfeito traduz adequadamente a forma verbal hebraica no contexto.
- source_word: אוֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa masculina singular.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino como nome próprio e usa “ó” para marcar o vocativo.
- source_word: אֲשֶׁר
  choice: com que
  rationale: A expressão retoma a afronta mencionada no contexto anterior e preserva a repetição enfática do hebraico.
- source_word: עִקְּבוֹת
  choice: os passos
  rationale: O termo pode designar calcanhares, pegadas, passos ou rastros. “Passos” conserva a imagem concreta e permite a referência metafórica aos movimentos ou à vinda do ungido.
- source_word: מְשִׁיחֶךָ
  choice: o teu ungido
  rationale: No contexto do salmo real, a expressão aponta imediatamente para o rei davídico consagrado por Deus. “Ungido” preserva o sentido lexical sem transformar de modo prematuro o termo em título técnico.
theological_decisions:
- issue: Sentido de מְשִׁיחֶךָ em um salmo real com ressonância messiânica
  choice: o teu ungido
  alternative: o teu Messias
  rationale: O contexto imediato favorece o rei davídico ungido por Yahweh, enquanto o mesmo termo possui ressonância messiânica mais ampla. A tradução principal mantém a referência histórica aberta, e a nota registra a leitura titular possível.
- issue: Interpretação da imagem עִקְּבוֹת מְשִׁיחֶךָ
  choice: os passos do teu ungido
  alternative: os calcanhares, as pegadas ou os rastros do teu ungido
  rationale: A formulação concreta do hebraico é mantida sem definir se a imagem se refere aos movimentos, ao percurso, às marcas deixadas ou à chegada do ungido.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “com que insultaram” reproduz a ênfase estrutural do hebraico; “teu” mantém um registro bíblico corrente sem arcaísmo excessivo.
