  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: pt
  text: Pois o nosso escudo pertence a Yahweh[a], e o nosso rei, ao Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o nosso escudo é de Yahweh, e o nosso rei pertence ao Santo de Israel”. O hebraico é elíptico e fortemente paralelo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da confiança e do louvor expressos no contexto anterior, preservando o valor conectivo sem intensificá-lo.
- source_word: לַיהוָה
  choice: pertence a Yahweh
  rationale: A preposição לְ expressa aqui posse ou relação. A formulação explicita naturalmente a elipse hebraica. O nome divino é transliterado como Yahweh.
- source_word: מָגִנֵּנוּ
  choice: o nosso escudo
  rationale: Mantém a metáfora concreta e recorrente dos Salmos, sem reduzi-la à paráfrase interpretativa 'protetor'.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: e o nosso rei, ao Santo de Israel
  rationale: O segundo לְ é paralelo ao primeiro e indica a mesma relação de pertença; a elipse do verbo é preservada de modo natural em português.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva o título divino reconhecido, sua solenidade e sua forma tradicional em português.
- source_word: מַלְכֵּנוּ
  choice: o nosso rei
  rationale: Traduz diretamente o substantivo real e conserva tanto a imagem régia quanto a possível referência ao representante davídico de Israel.
theological_decisions:
- issue: Referente de 'nosso escudo' e 'nosso rei'
  choice: A tradução apresenta ambos como pertencentes a Yahweh/o Santo de Israel, sem identificar explicitamente o escudo com o rei.
  alternative: '''Nosso escudo'' refere-se diretamente a Deus, enquanto ''nosso rei'' se refere ao rei humano; ou ''escudo'' e ''rei'' designam paralelamente o governante humano.'
  rationale: Os dois membros empregam construções paralelas com לְ. A redação conserva essa relação e a imagem poética, sem resolver uma ambiguidade real do hebraico por meio de paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural e paralelismo poético preservado. A vírgula no segundo membro marca a elipse de “pertence”.
