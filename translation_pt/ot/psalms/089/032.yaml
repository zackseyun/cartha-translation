  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: pt
  text: Então castigarei com a vara a transgressão deles, e com golpes a sua iniquidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visitarei com a vara a transgressão deles, e com flagelos a sua iniquidade”. O verbo hebraico pode significar “visitar” no sentido de ocupar-se de algo ou puni-lo; “flagelos” é uma alternativa mais formal para “golpes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Então castigarei
  rationale: פקד tem uma ampla gama de sentidos, incluindo visitar, ocupar-se de e punir. Neste contexto de disciplina, o sentido punitivo é predominante. “Então” expressa naturalmente a sequência decorrente da condição do versículo anterior.
- source_word: בְשֵׁבֶט
  choice: com a vara
  rationale: שֵׁבֶט pode designar vara, cajado ou cetro. Aqui funciona como instrumento de disciplina, por isso “vara” preserva a imagem concreta sem sugerir primariamente autoridade régia.
- source_word: פִּשְׁעָם
  choice: a transgressão deles
  rationale: פֶּשַׁע pode significar transgressão ou rebelião. “Transgressão” mantém o peso moral e o paralelismo poético sem especificar uma rebelião política.
- source_word: וּבִנְגָעִים
  choice: e com golpes
  rationale: נֶגַע pode indicar praga, aflição, golpe ou ferida. Em paralelo com “vara”, “golpes” comunica de modo claro o castigo infligido sem restringir a referência a uma doença.
- source_word: עֲוֹנָם
  choice: a sua iniquidade
  rationale: עָוֹן pode denotar iniquidade, culpa ou consequência da culpa. “Iniquidade” preserva o peso moral e o paralelo com “transgressão”.
theological_decisions:
- issue: Natureza da resposta divina ao pecado dos membros da aliança
  choice: O texto anuncia castigo disciplinar real por meio de imagens concretas, sem acrescentar que isso implique rejeição definitiva.
  alternative: A linguagem poderia ser suavizada como mera correção ou visitação, ou interpretada explicitamente como rejeição final.
  rationale: A vara e os golpes exigem que a força punitiva seja preservada. O contexto mais amplo distingue disciplina de abandono definitivo, mas este versículo não deve receber uma conclusão doutrinária além do que afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo hebraico e a imagem disciplinar concreta. O marcador [a] aparece no texto principal.
