id: PSA.89.8
reference: Psalms 89:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: pt
  text: 'Ó Yahweh, Deus dos Exércitos,

    quem é poderoso como tu, ó Yah[a]?

    Tua fidelidade te cerca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Yah», forma breve do nome divino; muitas traduções trazem aqui «SENHOR».'
    reason: Explica a forma abreviada do nome e registra a alternativa tradicional de tradução.
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título; a interjeição «Ó» explicita o valor vocativo no início do verso.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva a ideia de Deus sobre as hostes ou exércitos sem restringi-los apenas ao âmbito terreno ou celestial; é uma formulação clara e reconhecível em português.
- source_word: מִי כָמוֹךָ
  choice: quem é ... como tu
  rationale: Mantém a pergunta retórica de incomparabilidade e sua expressão poética direta.
- source_word: חֲסִין
  choice: poderoso
  rationale: Expressa força e poder em linguagem atual e digna; no contexto, funciona como predicativo na pergunta dirigida a Yah.
- source_word: יָהּ
  choice: ó Yah
  rationale: Conserva a forma breve e distinta do nome divino e comunica seu uso vocativo.
- source_word: וֶאֱמוּנָתְךָ
  choice: Tua fidelidade
  rationale: אֱמוּנָה designa aqui firmeza, confiabilidade ou fidelidade; «fidelidade» comunica naturalmente o caráter digno de confiança de Deus.
- source_word: סְבִיבוֹתֶיךָ
  choice: te cerca
  rationale: Traduz de modo idiomático a expressão locativa «ao teu redor», preservando a imagem da fidelidade que envolve Deus.
theological_decisions:
- issue: Distinção entre יְהוָה e a forma breve יָהּ no mesmo verso
  choice: Verter יְהוָה como «Yahweh» e יָהּ como «Yah»
  alternative: Traduzir ambas as formas como «SENHOR» ou uniformizá-las como «Yahweh»
  rationale: O hebraico emprega deliberadamente duas formas do nome divino. Preservar essa diferença respeita os dados do texto sem substituir o nome por um título.
- issue: Relação sintática de חֲסִין com יָהּ
  choice: «quem é poderoso como tu, ó Yah?»
  alternative: «quem é como tu? Poderoso é Yah»
  rationale: A acentuação massorética reúne חֲסִין יָהּ antes da pausa principal, favorecendo a leitura em que «poderoso» integra a pergunta e «Yah» é vocativo, embora a sequência hebraica seja poeticamente compacta.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com legibilidade brasileira. «Exércitos» evita o arcaísmo de «hostes»; os pronomes «tu/te/tua» preservam a invocação direta e solene. A disposição em três linhas acompanha o movimento poético do verso.
