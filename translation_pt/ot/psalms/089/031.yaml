  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: pt
  text: Se profanarem os meus estatutos e não guardarem os meus mandamentos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “violarem os meus estatutos”. O verbo hebraico pode indicar profanar ou tratar como comum aquilo que é consagrado; “profanarem” preserva sua força mais intensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: A partícula introduz diretamente a condição; “se” preserva esse valor sem sugerir que a ação certamente ocorrerá.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: חֻקָּה designa prescrições estabelecidas. “Estatutos” mantém o sentido jurídico e distingue o termo de “mandamentos” no paralelismo.
- source_word: יְחַלֵּלוּ
  choice: profanarem
  rationale: O piel de חלל expressa profanar ou dessacralizar. “Profanarem” preserva a força religiosa e pactual do verbo, embora “violarem” seja uma alternativa contextual possível.
- source_word: וּמִצְוֺתַי
  choice: e os meus mandamentos
  rationale: מִצְוָה refere-se a uma ordem ou mandamento. A formulação conserva o registro digno e a distinção lexical em relação a חֻקּוֹת.
- source_word: לֹא יִשְׁמֹרוּ
  choice: não guardarem
  rationale: Em contexto legal e pactual, שׁמר significa guardar ou observar. “Guardar os mandamentos” é natural e tradicionalmente inteligível em português.
theological_decisions:
- issue: Força da linguagem de violação da aliança em חלל quando os estatutos são o objeto
  choice: “profanarem os meus estatutos”
  alternative: “violarem os meus estatutos”
  rationale: “Profanarem” reflete a ideia forte de tratar como comum ou desonrar aquilo que pertence a Deus, sem reduzir o verbo à mera desobediência nem acrescentar uma interpretação doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem verbal no futuro do subjuntivo decorre naturalmente da condição introduzida por “se”. Mantém-se o paralelismo entre “estatutos” e “mandamentos”.
