  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: pt
  text: Pois quem, nos céus, pode ser comparado ao SENHOR? Quem, entre os filhos de Deus, é semelhante ao SENHOR?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os seres celestiais”, “entre os seres divinos” ou “entre os filhos dos poderosos”. A expressão hebraica diz literalmente “entre os filhos de Deus/deuses”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e conduz naturalmente às perguntas retóricas.
- source_word: מִי
  choice: quem
  rationale: Equivalente interrogativo direto, adequado à força retórica dos dois membros do versículo.
- source_word: בַשַּׁחַק
  choice: nos céus
  rationale: שׁחק pode designar céu, céus ou nuvens; “nos céus” comunica com naturalidade o cenário celestial sem impor uma cosmologia técnica.
- source_word: יַעֲרֹךְ
  choice: pode ser comparado
  rationale: O verbo ערך expressa aqui a ideia de colocar alguém ao lado de outro para comparação; a formulação portuguesa transmite claramente essa força.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Traduz o nome divino יהוה pela forma reverencial tradicional “SENHOR”, distinguida tipograficamente.
- source_word: יִדְמֶה
  choice: é semelhante
  rationale: דמה indica semelhança; a escolha mantém o paralelismo com “pode ser comparado” sem repetir exatamente a mesma expressão.
- source_word: בִּבְנֵי אֵלִים
  choice: entre os filhos de Deus
  rationale: Preserva de perto a imagem hebraica e sua ambiguidade, em vez de substituir no texto principal a expressão por uma identificação interpretativa dos seres celestiais.
theological_decisions:
- issue: Tradução de יהוה
  choice: SENHOR
  alternative: Yahweh; Jeová
  rationale: A forma segue a tradição reverencial judaica e a prática antiga refletida na Septuaginta, sem adotar uma vocalização portuguesa específica do tetragrama.
- issue: Sentido de בִּבְנֵי אֵלִים
  choice: filhos de Deus
  alternative: seres celestiais; seres divinos; filhos dos poderosos
  rationale: A tradução principal conserva a expressão concreta e teologicamente carregada do hebraico. A nota registra as principais leituras possíveis sem reduzir a tensão ou definir além do que o verso afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas retóricas e o paralelismo poético foram preservados; as vírgulas destacam os complementos sem tornar a frase artificial.
