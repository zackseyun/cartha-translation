  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: pt
  text: Rompeste todas as suas muralhas[a]; reduziste a ruínas as suas fortalezas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas barreiras”, “cercas” ou “sebes”. O termo hebraico pode designar diversos tipos de proteção ou cercamento.
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser entendido como “fizeste das suas fortalezas destruição”, “terror” ou “consternação”. Neste contexto, “ruínas” se ajusta ao paralelismo com as defesas rompidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: Rompeste
  rationale: O verbo פרץ expressa romper, abrir uma brecha ou derrubar uma defesa. “Rompeste” preserva a força destrutiva e combina naturalmente com “muralhas”.
- source_word: כָל
  choice: todas
  rationale: Mantém de modo direto a totalidade da devastação expressa no hebraico.
- source_word: גְּדֵרֹתָיו
  choice: as suas muralhas
  rationale: גְּדֵרָה pode designar muro, cerca, sebe ou barreira. O paralelismo com “fortalezas” favorece aqui a ideia de estruturas defensivas; “muralhas” é clara e natural em português.
- source_word: שַׂמְתָּ
  choice: reduziste
  rationale: Embora שׂים tenha o sentido amplo de pôr ou fazer, a construção predicativa com מְחִתָּה é vertida naturalmente por “reduziste a ruínas”.
- source_word: מִבְצָרָיו
  choice: as suas fortalezas
  rationale: מִבְצָר designa um lugar fortificado. “Fortalezas” conserva o sentido defensivo sem especificar além do hebraico.
- source_word: מְחִתָּה
  choice: a ruínas
  rationale: Neste contexto, o substantivo aponta provavelmente para ruína ou destruição. A expressão “reduziste a ruínas” é idiomática e mantém o paralelismo com as defesas rompidas, embora também sejam possíveis sentidos como terror ou consternação.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em גְּדֵרֹתָיו e מִבְצָרָיו
  choice: Manter “suas” sem explicitar o referente no texto principal.
  alternative: Traduzir de modo interpretativo como “as muralhas do rei” ou entender as defesas corporativamente como as de Sião/Jerusalém.
  rationale: O hebraico emprega sufixos de terceira pessoa masculina singular, e o contexto imediato lamenta a queda do ungido davídico. Manter o pronome preserva a ambiguidade poética e evita inserir uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado por meio de dois verbos fortes no pretérito perfeito. Os possessivos mantêm o referente implícito do hebraico.
