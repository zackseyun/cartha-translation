  text: הִשְׁבַּ֥תָּ מִ/טְּהָר֑/וֹ וְ֝/כִסְא֗/וֹ לָ/אָ֥רֶץ מִגַּֽרְתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: pt
  text: Puseste fim ao seu esplendor[a] e lançaste o seu trono ao chão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeste cessar o seu brilho” ou “a sua pureza”. O termo hebraico pode indicar brilho, pureza ou esplendor; “esplendor” se ajusta melhor ao contexto régio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Puseste fim
  rationale: O hifil de שׁבת expressa fazer cessar ou levar ao fim. “Puseste fim” conserva o valor causativo de modo natural e digno em português.
- source_word: מִטְּהָרוֹ
  choice: ao seu esplendor
  rationale: טֹהַר pode indicar brilho, pureza ou esplendor. Neste contexto régio, “esplendor” comunica melhor a majestade real perdida; a preposição מִן é incorporada naturalmente à construção “pôr fim a”.
- source_word: וְכִסְאוֹ
  choice: e ... o seu trono
  rationale: כִּסֵּא significa diretamente “trono”; a conjunção e o sufixo possessivo foram preservados.
- source_word: לָאָרֶץ
  choice: ao chão
  rationale: Embora אֶרֶץ possa significar “terra”, nesta imagem de derrubada e humilhação “ao chão” é a formulação mais natural em português.
- source_word: מִגַּרְתָּה
  choice: lançaste
  rationale: O verbo descreve lançar ou derrubar. “Lançaste ... ao chão” mantém a força da imagem poética sem acrescentar uma explicação interpretativa.
theological_decisions:
- issue: Referente dos sufixos de terceira pessoa
  choice: Mantido como “seu”, sem explicitar o referente.
  alternative: Identificar o referente como o rei davídico ou como o ungido da aliança.
  rationale: O hebraico emprega sufixos de terceira pessoa do singular sem repetir o antecedente neste versículo. Preservar “seu” mantém a continuidade poética e não resolve no texto uma referência que permanece implícita.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais na segunda pessoa do singular para corresponder ao discurso dirigido a Deus. A formulação preserva o paralelismo poético e mantém implícito o referente régio.
