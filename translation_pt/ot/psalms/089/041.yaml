  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: pt
  text: Todos os que passam pelo caminho o saquearam[a]; ele se tornou objeto de desprezo para seus vizinhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todos os transeuntes o despojaram”. Em hebraico, a expressão é literalmente “todos os que passam pelo caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: o saquearam
  rationale: O verbo שסה indica saquear ou despojar. “Saquearam” preserva a ação hostil e concreta, com linguagem natural no português moderno.
- source_word: כָּל
  choice: Todos
  rationale: כָּל tem sentido abrangente diante da expressão participial seguinte; “Todos os que” comunica naturalmente esse alcance.
- source_word: עֹבְרֵי דָרֶךְ
  choice: os que passam pelo caminho
  rationale: A expressão significa literalmente “os que passam pelo caminho/estrada”. A formulação mantém a imagem do caminho sem restringi-la necessariamente a viajantes.
- source_word: הָיָה
  choice: se tornou
  rationale: O perfeito descreve a condição resultante da humilhação anterior. “Se tornou” expressa a passagem ao estado agora lamentado.
- source_word: חֶרְפָּה
  choice: motivo de vergonha
  rationale: חֶרְפָּה pode indicar vergonha, opróbrio ou objeto de desprezo. “Motivo de vergonha” é claro e natural, preservando a humilhação pública.
- source_word: לִשְׁכֵנָיו
  choice: para os seus vizinhos
  rationale: 'שָׁכֵן designa quem mora perto, isto é, um vizinho. A preposição ל marca a relação: ele se tornou motivo de vergonha diante de ou para seus vizinhos.'
theological_decisions:
- issue: Referente dos pronomes na terceira pessoa do singular
  choice: Manter “o/ele” sem identificar explicitamente o referente.
  alternative: Especificar o rei davídico, o ungido ou o povo representado pelo rei.
  rationale: O contexto imediato trata da queda do rei ou ungido davídico, mas o versículo emprega apenas formas pronominais masculinas no singular. A tradução preserva essa indeterminação e não resolve a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto o paralelismo hebraico sem soar arcaica.
