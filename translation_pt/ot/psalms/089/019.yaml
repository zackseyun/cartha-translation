base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: pt
  text: 'Então falaste numa visão aos teus fiéis e disseste[a]: “Concedi auxílio a um valente[b]; exaltei um escolhido dentre o povo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Outra leitura, refletida em algumas versões, traz “ao teu fiel”.
    reason: textual_variant
  - marker: b
    text: “Valente” também pode ser traduzido por “guerreiro”, “herói” ou “homem poderoso”.
    reason: lexical_alternative
  - marker: c
    text: “Escolhido” também pode ser entendido como “jovem”; neste contexto, porém, a escolha divina favorece “escolhido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Introduz naturalmente a fala divina na sequência poética e narrativa.
- source_word: דִּבַּרְתָּ
  choice: falaste
  rationale: Preserva a distinção em relação a וַתֹּאמֶר, traduzido depois por “disseste”.
- source_word: בְחָזוֹן
  choice: numa visão
  rationale: Expressa de modo natural o meio ou contexto da revelação.
- source_word: לַחֲסִידֶיךָ
  choice: aos teus fiéis
  rationale: Segue o plural do texto fornecido e comunica lealdade e devoção sem conotações eclesiásticas posteriores.
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: Coloquei socorro sobre
  rationale: Mantém a imagem incomum, mas inteligível, de auxílio colocado sobre alguém, sem reduzir o sentido a simplesmente ajudar.
- source_word: גִּבּוֹר
  choice: um valente
  rationale: Termo português de registro digno que pode indicar homem forte, guerreiro ou herói sem restringir totalmente o campo semântico.
- source_word: הֲרִימוֹתִי
  choice: exaltei
  rationale: Convém ao contexto de elevação régia e corresponde ao causativo de רום.
- source_word: בָחוּר
  choice: um escolhido
  rationale: No paralelismo e no contexto da escolha de Davi, o sentido de alguém escolhido é mais provável, embora “jovem” seja lexicalmente possível.
- source_word: מֵעָם
  choice: dentre o povo
  rationale: Indica com clareza que a pessoa foi escolhida do meio do povo.
theological_decisions:
- issue: Referente no contexto da aliança davídica
  choice: A tradução permanece no nível do referente davídico imediato.
  alternative: Tornar explícita uma leitura tipológica ou messiânica.
  rationale: O contexto trata da escolha e exaltação de Davi; possíveis desenvolvimentos tipológicos não devem ser inseridos no texto traduzido.
- issue: Número de לַחֲסִידֶיךָ
  choice: 'Plural: “aos teus fiéis”.'
  alternative: 'Singular: “ao teu fiel”.'
  rationale: O texto WLC fornecido apresenta a forma plural; a leitura singular, refletida em algumas versões, é preservada em nota.
- issue: Sentido de בָחוּר
  choice: “um escolhido”.
  alternative: “um jovem”.
  rationale: A seleção e exaltação divina no contexto favorecem “escolhido”, sem ocultar a possibilidade lexical alternativa.
translation_notes:
  register: Português atual, digno e poético, com formas de segunda pessoa coerentes com o discurso dirigido a Deus. A formulação deliberadamente incomum “coloquei socorro sobre” conserva a imagem hebraica e sua ambiguidade sem a suavizar para uma paráfrase.
