  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: pt
  text: Onde estão as tuas antigas demonstrações de amor leal[a], Senhor, que juraste a Davi em tua fidelidade[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tuas antigas misericórdias” ou “teus antigos atos de amor constante”. O hebraico emprega o plural, literalmente “teus antigos amores leais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por tua fidelidade”. A expressão pode indicar a maneira ou o fundamento do juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Onde estão
  rationale: O interrogativo pergunta pela localização ou existência; o plural em português concorda com “demonstrações”.
- source_word: חֲסָדֶיךָ
  choice: tuas demonstrações de amor leal
  rationale: חֶסֶד expressa amor, bondade e lealdade, frequentemente em contexto de aliança. O acréscimo de “demonstrações” torna natural o plural hebraico sem perder a ideia de atos concretos.
- source_word: הָרִאשֹׁנִים
  choice: antigas
  rationale: No contexto do lamento, refere-se às demonstrações de amor leal conhecidas no passado, em contraste com a aflição presente.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino usado aqui em vocativo; “Senhor” é sua tradução portuguesa corrente.
- source_word: נִשְׁבַּעְתָּ
  choice: juraste
  rationale: O pretérito perfeito remete naturalmente ao juramento anteriormente feito por Deus.
- source_word: לְדָוִד
  choice: a Davi
  rationale: A preposição marca Davi como destinatário do juramento.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: em tua fidelidade
  rationale: אֱמוּנָה denota firmeza, confiabilidade e fidelidade. A preposição ב pode indicar a maneira, esfera ou base em que o juramento foi feito; a formulação preserva essa abertura.
theological_decisions:
- issue: Tradução de חֶסֶד no contexto do lamento sobre a aliança davídica
  choice: amor leal
  alternative: misericórdia; bondade constante
  rationale: “Amor leal” comunica tanto o amor quanto a lealdade duradoura evocada pelo contexto da aliança, sem restringir o termo apenas à compaixão.
- issue: Representação do plural חֲסָדֶיךָ
  choice: demonstrações de amor leal
  alternative: atos de amor leal; misericórdias
  rationale: A formulação preserva o plural hebraico e aponta para manifestações concretas da lealdade divina, mantendo naturalidade em português.
- issue: Valor da preposição ב em בֶּאֱמוּנָתֶךָ
  choice: em tua fidelidade
  alternative: por tua fidelidade
  rationale: “Em” deixa aberta a possibilidade de a expressão indicar maneira, esfera ou fundamento do juramento, evitando resolver uma ambiguidade real do hebraico.
