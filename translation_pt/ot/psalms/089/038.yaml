  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: pt
  text: Mas tu rejeitaste e repudiaste; enfureceste-te contra o teu ungido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “teu ungido” ou “teu Messias”. É a mesma palavra posteriormente traduzida por “Messias”, mas aqui se refere de modo imediato ao rei davídico sob a aliança de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente introduz uma forte virada adversativa em relação às afirmações anteriores sobre a fidelidade de Deus à aliança.
- source_word: זָנַחְתָּ
  choice: rejeitaste
  rationale: O verbo expressa rejeitar ou lançar fora; “rejeitaste” é claro e natural em português.
- source_word: וַ/תִּמְאָס
  choice: e repudiaste
  rationale: O verbo acrescenta à rejeição a ideia de recusa marcada por desagrado; o par preserva a intensificação hebraica sem redundância excessiva.
- source_word: הִתְעַבַּרְתָּ
  choice: indignaste-te
  rationale: O hitpael exprime ira intensa ou o ato de enfurecer-se; “indignaste-te” mantém força e dignidade no registro do salmo.
- source_word: עִם
  choice: contra
  rationale: Embora a preposição signifique literalmente “com”, em português a construção natural com ira dirigida a alguém pede “contra”.
- source_word: מְשִׁיחֶךָ
  choice: o teu ungido
  rationale: O termo significa “ungido” e, no contexto imediato, designa o rei davídico ligado à aliança, sem eliminar sua ressonância messiânica.
theological_decisions:
- issue: Tradução de מְשִׁיחֶךָ numa lamentação régia com ressonância messiânica
  choice: o teu ungido
  alternative: o teu Messias
  rationale: O vocábulo hebraico está na origem do título “Messias”, mas neste salmo refere-se imediatamente ao rei davídico como ungido de Deus. O texto principal evita tornar explícita uma identificação cristológica que o versículo não formula, enquanto a nota preserva a relação lexical e teológica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética concisa. O uso de “tu” acompanha a interpelação direta e solene do hebraico; “rejeitaste e repudiaste” preserva o paralelismo intensificador.
