  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: pt
  text: De fato, eu o farei primogênito,[a] o mais elevado entre os reis da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o preeminente”. Aqui, “primogênito” indica a posição mais elevada e seus privilégios, não necessariamente a ordem literal de nascimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Sim
  rationale: A partícula tem força enfática e introduz mais um compromisso divino; “Sim” comunica essa ênfase de modo natural em português.
- source_word: אָ֭נִי
  choice: eu
  rationale: O pronome independente está expresso no hebraico e enfatiza o próprio Deus como agente; por isso, é mantido.
- source_word: בְּכוֹר
  choice: primogênito
  rationale: Preserva o termo hebraico e sua conotação de posição, privilégio e precedência, sem reduzi-lo a uma paráfrase interpretativa.
- source_word: אֶתְּנֵהוּ
  choice: o farei
  rationale: Neste uso, נתן com predicativo significa constituir ou fazer alguém ocupar determinada posição; “o farei” expressa naturalmente o resultado.
- source_word: עֶלְיוֹן
  choice: o mais elevado
  rationale: Aqui o adjetivo indica supremacia de posição em relação aos reis terrenos. “O mais elevado” evita confusão com “Altíssimo” como título divino.
- source_word: לְמַלְכֵי אָרֶץ
  choice: entre os reis da terra
  rationale: O לְ marca relação ou comparação. “Entre os reis da terra” expressa que ele ocupa a posição suprema no conjunto, sem tornar a frase excessivamente interpretativa.
theological_decisions:
- issue: Força régia e potencialmente messiânica de “primogênito”
  choice: Manter “primogênito” como termo de posição e privilégio régios, explicando sua força contextual em nota.
  alternative: Traduzir diretamente como “herdeiro”, “principal” ou “o que ocupa a posição mais elevada”.
  rationale: O contexto imediato trata do rei davídico e permite uma leitura messiânica no âmbito canônico cristão, mas o hebraico não explicita essa aplicação no versículo. Preservar “primogênito” mantém tanto a imagem original quanto a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o paralelismo entre “primogênito” e “o mais elevado”, enquanto a nota esclarece o sentido de posição sem apagar a imagem hebraica.
