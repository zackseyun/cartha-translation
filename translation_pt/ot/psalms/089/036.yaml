  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: pt
  text: Sua descendência permanecerá para sempre, e seu trono será como o sol diante de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na minha presença”. O hebraico diz literalmente “diante de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: sua descendência
  rationale: זֶרַע é um substantivo coletivo que, neste contexto de aliança real, designa a posteridade dinástica. “Descendência” preserva naturalmente esse valor coletivo em português.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração permanente no contexto poético e pactual; “para sempre” é claro, corrente e solene.
- source_word: יִהְיֶה
  choice: permanecerá
  rationale: Embora o verbo seja literalmente “será”, com “descendência” a formulação “permanecerá para sempre” comunica de modo idiomático sua força existencial e continuativa.
- source_word: וְכִסְאוֹ
  choice: e seu trono
  rationale: Mantém a imagem concreta do trono, que representa a realeza e o governo, sem substituí-la por uma abstração.
- source_word: כַשֶּׁמֶשׁ
  choice: como o sol
  rationale: Reproduz diretamente a comparação marcada pelo prefixo כ.
- source_word: נֶגְדִּי
  choice: diante de mim
  rationale: Preserva a referência divina em primeira pessoa e traduz de modo direto e natural o sentido de “perante mim/na minha presença”.
theological_decisions:
- issue: Referência do sufixo de primeira pessoa em נֶגְדִּי
  choice: diante de mim, como fala direta de Deus
  alternative: na minha presença
  rationale: O contexto apresenta o SENHOR falando sobre Davi e sua linhagem. A primeira pessoa é mantida sem paráfrase, preservando a força pactual.
- issue: Permanência da descendência e do trono
  choice: Não explicitar além do hebraico como a promessa se cumpre
  alternative: Interpretar diretamente a descendência ou o trono em termos cristológicos, históricos ou institucionais
  rationale: O versículo afirma a continuidade da descendência e compara o trono ao sol diante de Deus, mas não resolve neste ponto as questões teológicas sobre a forma de seu cumprimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sua descendência” mantém o coletivo hebraico; “permanecerá” evita a construção pouco natural “será para sempre”. O segundo verbo, ausente formalmente na oração hebraica, é suprido como “será” a partir do paralelismo, sem sugerir indevidamente que o texto diz “perdurará como o sol”.
