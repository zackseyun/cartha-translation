lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: com quem
  rationale: A expressão introduz uma oração relativa que retoma o rei escolhido no versículo anterior; combinar o relativo com עִמּוֹ produz português natural e preserva o sentido de companhia e apoio.
- source_word: יָדִי
  choice: a minha mão
  rationale: Mantém a imagem poética concreta da ação e do poder sustentador de Deus.
- source_word: תִּכּוֹן
  choice: permanecerá firme
  rationale: O nifal de כון comunica a ideia de estar firmemente estabelecido. Esta formulação é idiomática em português e, no contexto, expressa apoio duradouro sem eliminar a nuance resultativa.
- source_word: אַף
  choice: sim
  rationale: Marca a continuação enfática do paralelismo de modo natural e digno.
- source_word: זְרוֹעִי
  choice: o meu braço
  rationale: Preserva a metáfora corporal hebraica de força e poder.
- source_word: תְאַמְּצֶנּוּ
  choice: o fortalecerá
  rationale: O piel de אמץ com sufixo masculino singular significa fortalecer ou tornar forte; a escolha é direta e idiomática.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Conservar “a minha mão” e “o meu braço” como imagens poéticas.
  alternative: Substituir as imagens por “o meu poder” e “a minha força”.
  rationale: O hebraico descreve o apoio de Deus ao rei davídico por meio de imagens corporais. Preservá-las mantém a força poética e não impõe uma interpretação abstrata.
- issue: A mão de Deus como sujeito de תִּכּוֹן
  choice: Traduzir como “a minha mão permanecerá firme”.
  alternative: “a minha mão será estabelecida”.
  rationale: As duas leituras refletem o nifal de כון, mas “permanecerá firme” comunica com mais naturalidade em português a estabilidade duradoura da mão de Deus com o rei, sem inverter a relação para dizer que o rei é sustentado pela mão.
- issue: Força futura da promessa
  choice: 'Usar o futuro: “permanecerá” e “fortalecerá”.'
  alternative: 'Usar o presente habitual: “permanece” e “fortalece”.'
  rationale: Neste contexto de aliança, os imperfeitos exprimem adequadamente o compromisso prometido de Deus para com o rei.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo hebraico e as metáforas corporais foram preservados; “sim” transmite a ênfase de אַף sem tornar a frase pesada.
