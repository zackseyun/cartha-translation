  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: pt
  text: Como a lua, ele será estabelecido para sempre; e a testemunha no céu é fiel.[a] Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A «testemunha no céu» é frequentemente entendida como a lua, que funciona como testemunha celeste confiável da permanência da aliança.
    reason: leitura_alternativa
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Como a lua
  rationale: O prefixo כְּ marca comparação, e יָרֵחַ significa “lua”. A formulação preserva naturalmente o símile em português.
- source_word: יִכּוֹן
  choice: ele permanecerá
  rationale: O nifal imperfeito de כון expressa firmeza ou estabilidade. “Permanecerá” comunica duração estável sem introduzir um sujeito nominal ausente no hebraico.
- source_word: עוֹלָם
  choice: para sempre
  rationale: No contexto poético da aliança, indica permanência duradoura; “para sempre” é claro, digno e idiomático.
- source_word: וְעֵד
  choice: e a testemunha
  rationale: עֵד significa “testemunha”. O artigo em português apresenta o provável referente celeste definido pelo contexto, sem identificá-lo explicitamente.
- source_word: בַּשַּׁחַק
  choice: no céu
  rationale: שַׁחַק pode designar céu, firmamento ou nuvens em poesia. “No céu” preserva a imagem celeste e corresponde naturalmente ao singular.
- source_word: נֶאֱמָן
  choice: é fiel
  rationale: O adjetivo denota confiabilidade, firmeza e fidelidade; “fiel” mantém tanto o sentido comum quanto a ressonância da aliança.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo é incerta, ele é transliterado segundo o uso bíblico corrente em português.
theological_decisions:
- issue: Referente do sujeito implícito de יִכּוֹן
  choice: Mantém-se apenas o pronome “ele”, remetendo ao contexto anterior.
  alternative: Explicitar “o seu trono” ou “a sua descendência”.
  rationale: O hebraico não repete o sujeito, que deve ser recuperado do contexto imediato. O pronome evita restringir interpretativamente o referente.
- issue: Identidade da “testemunha no céu”
  choice: A expressão permanece sem identificação explícita.
  alternative: Identificá-la como a lua, um sinal celeste ou outro fenômeno.
  rationale: O hebraico não nomeia a testemunha. Preservar essa ambiguidade evita resolver no texto uma questão interpretativa debatida.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A concisão e o paralelismo poético do hebraico foram preservados.
