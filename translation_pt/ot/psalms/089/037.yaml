  terminology: «Testemunha no céu» preserva corretamente a indefinição interpretativa de עֵד בַּשַּׁחַק. A nota sobre o provável referente lunar deve ser mantida; a nota inglesa sobre «Like/As» não produz uma alternativa lexical distinta em português e não é necessária.
