  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: pt
  text: Cantarei para sempre os atos de amor leal de Yahweh[a]; de geração em geração, com a minha boca, tornarei conhecida a tua fidelidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as misericórdias” ou “as manifestações de amor leal”. O hebraico pode indicar o amor leal de Yahweh conforme se manifesta em repetidos atos de misericórdia.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: atos de amor leal
  rationale: O plural construto pode indicar as repetidas manifestações da bondade, misericórdia e lealdade pactual de Yahweh. “Atos de amor leal” preserva o plural e explicita seu caráter concreto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עוֹלָם
  choice: para sempre
  rationale: Usado adverbialmente com “cantarei”, comunica duração contínua em português natural.
- source_word: אָשִׁירָה
  choice: cantarei
  rationale: A forma cohortativa expressa aqui intenção ou resolução; o futuro português transmite de modo natural essa determinação.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Expressão portuguesa corrente que conserva a continuidade através das gerações sucessivas.
- source_word: אוֹדִיעַ
  choice: tornarei conhecida
  rationale: Reproduz o sentido causativo do hifil de ידע, “fazer saber”, e concorda naturalmente com “fidelidade”.
- source_word: אֱמוּנָתְךָ
  choice: a tua fidelidade
  rationale: Neste paralelo com חֶסֶד, designa a constância, confiabilidade e lealdade de Deus.
- source_word: בְּפִי
  choice: com a minha boca
  rationale: Mantém a imagem concreta hebraica da proclamação vocal, sem perder naturalidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome pessoal divino. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por um título.
- issue: Nuance de חַסְדֵי
  choice: atos de amor leal
  alternative: misericórdias; amor leal
  rationale: A escolha conserva tanto o plural morfológico quanto a combinação de bondade e lealdade associada ao termo, sem limitar seu sentido a uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, preservando o paralelismo poético e a imagem concreta de falar “com a minha boca”.
