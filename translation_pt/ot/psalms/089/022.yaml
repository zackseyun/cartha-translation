  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: pt
  text: Nenhum inimigo lhe cobrará tributo[a], e nenhum filho da perversidade[b] o afligirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nenhum inimigo o enganará”, “se aproveitará dele” ou “o oprimirá”. O verbo hebraico admite vários sentidos relacionados; aqui foi traduzido segundo o contexto de exploração hostil.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “filho da perversidade”, expressão idiomática que designa uma pessoa perversa ou um malfeitor.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: imporá tributo
  rationale: O hifil de נשׁא admite sentidos relacionados, como enganar ou impor uma cobrança. Neste contexto de proteção régia, em paralelo com “afligirá”, a ideia de exploração política ou econômica é a mais provável.
- source_word: אוֹיֵב
  choice: inimigo
  rationale: Equivalente corrente e claro para o substantivo singular, adequado ao contexto régio e hostil do salmo.
- source_word: בּוֹ
  choice: lhe
  rationale: Com “impor tributo”, o pronome indireto produz uma formulação portuguesa natural sem perder a referência à pessoa protegida.
- source_word: בֶן עַוְלָה
  choice: filho da perversidade
  rationale: Preserva a imagem idiomática e a força poética do hebraico; a nota esclarece que se refere a uma pessoa perversa.
- source_word: עַוְלָה
  choice: perversidade
  rationale: Abrange injustiça, maldade e conduta moralmente tortuosa, mantendo o registro poético.
- source_word: יְעַנֶּנּוּ
  choice: o afligirá
  rationale: O piel de ענה aqui indica afligir ou oprimir. “Afligirá” conserva a amplitude semântica e acompanha naturalmente a promessa de proteção.
theological_decisions:
- issue: Referente da pessoa protegida
  choice: Manter os pronomes singulares “lhe” e “o”, sem identificação interpretativa.
  alternative: Explicitar Davi, o rei davídico ou o Messias.
  rationale: O hebraico aponta para uma figura régia singular no contexto da aliança, mas o versículo não a identifica de modo mais específico; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem paralela do verso e a imagem hebraica “filho da perversidade” foram preservadas; as ambiguidades lexicais relevantes são apresentadas em nota.
