  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: pt
  text: O norte e o sul[a] — tu os criaste; o Tabor e o Hermom cantam de alegria[b] em teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “o norte e o lado direito”. Aqui, “lado direito” é provavelmente uma expressão geográfica para “sul”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dão gritos de alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: o norte
  rationale: O substantivo designa normalmente o norte ou a região norte e, em paralelo com יָמִין, integra uma expressão abrangente dos pontos geográficos.
- source_word: יָמִין
  choice: o sul
  rationale: Embora signifique literalmente “mão direita” ou “lado direito”, em orientação geográfica pode indicar o sul; aqui, em par com “norte”, essa leitura comunica naturalmente o merismo.
- source_word: בְרָאתָם
  choice: tu os criaste
  rationale: O qal perfeito na segunda pessoa masculina singular, com sufixo plural, afirma de modo direto a ação criadora de Deus.
- source_word: תָּבוֹר
  choice: o Tabor
  rationale: Nome geográfico tradicionalmente transliterado em português; o artigo torna natural a referência ao monte.
- source_word: חֶרְמוֹן
  choice: o Hermom
  rationale: Nome geográfico em sua forma portuguesa tradicional; o artigo explicita naturalmente a referência ao monte.
- source_word: בְּשִׁמְךָ
  choice: em teu nome
  rationale: Preserva a amplitude da preposição ב, podendo indicar esfera, fundamento ou ocasião, e associa o louvor à identidade e à fama de Deus.
- source_word: יְרַנֵּנוּ
  choice: cantam de alegria
  rationale: O piel de רנן exprime uma manifestação sonora e jubilosa. “Cantam de alegria” mantém a personificação poética dos montes e soa natural em português.
theological_decisions:
- issue: Sentido de יָמִין em paralelo com צָפוֹן
  choice: 'merismo geográfico: “o norte e o sul”'
  alternative: 'sentido espacial literal: “o norte e o lado direito”'
  rationale: O contexto celebra a criação divina em toda a sua extensão. A leitura geográfica preserva o paralelismo poético, enquanto a nota registra a forma literal sem impor uma interpretação rígida.
- issue: Personificação do Tabor e do Hermom
  choice: os montes são apresentados poeticamente como cantando de alegria
  alternative: os habitantes dessas regiões cantam de alegria
  rationale: O verbo plural concorda com os dois nomes e a personificação da criação é natural na poesia dos Salmos; não é necessário substituir a imagem por uma referência interpretativa aos habitantes.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a fala dirigida a Deus. A formulação conserva o paralelismo, a concisão e a personificação do hebraico.
