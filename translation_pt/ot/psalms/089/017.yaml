id: PSA.89.17
reference: Psalms 89:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: pt
  text: Pois tu és a glória da força deles[a], e, por teu favor, exaltas o nosso chifre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o esplendor” ou “a beleza da força deles”.
    reason: lexical_alternative
  - marker: b
    text: “Chifre” é uma metáfora hebraica para força, poder ou posição elevada.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e mantém com naturalidade o encadeamento explicativo do salmo.
- source_word: תִפְאֶרֶת
  choice: a glória
  rationale: O substantivo pode indicar glória, esplendor ou beleza; “glória” exprime aqui a honra e o esplendor associados à força sem restringir indevidamente o sentido.
- source_word: עֻזָּמוֹ
  choice: da força deles
  rationale: Preserva o substantivo “força” e o sufixo pronominal hebraico de terceira pessoa do plural, sem harmonizá-lo com a primeira pessoa da oração seguinte.
- source_word: אָתָּה
  choice: tu és
  rationale: Reproduz o pronome enfático e explicita a cópula exigida pelo português.
- source_word: וּבִרְצֹנְךָ
  choice: e, por teu favor
  rationale: “Favor” comunica a boa vontade ou aceitação divina, e “por” expressa adequadamente o valor instrumental da preposição.
- source_word: תרים
  choice: exaltas
  rationale: O hifil de רוּם significa erguer ou exaltar; “exaltas” oferece registro digno e combina com a metáfora preservada.
- source_word: קַרְנֵנוּ
  choice: o nosso chifre
  rationale: Mantém literalmente a imagem poética hebraica, em vez de substituí-la por uma única interpretação como força, poder ou honra.
theological_decisions:
- issue: Sentido metafórico de “chifre”
  choice: Manter “o nosso chifre” no texto principal.
  alternative: nossa força; nosso poder; nossa honra
  rationale: A metáfora hebraica reúne ideias de força, poder e posição elevada. Preservá-la evita escolher silenciosamente apenas uma dessas dimensões; a nota esclarece seu uso cultural.
- issue: Mudança de referente entre terceira e primeira pessoas
  choice: Preservar “deles” e “nosso”.
  alternative: Harmonizar ambos como “nosso”.
  rationale: O hebraico apresenta uma mudança real de “força deles” para “nosso chifre”. Mantê-la conserva a forma e a possível tensão interpretativa do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “tu” acompanha o registro poético e permite reproduzir com concisão a referência direta a Deus. As vírgulas destacam naturalmente o adjunto “por teu favor”.
