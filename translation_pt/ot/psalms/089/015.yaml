  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: pt
  text: Como é feliz o povo que conhece a aclamação jubilosa[a]! Ó Yahweh, eles caminham à luz do teu rosto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a aclamação festiva”; o termo também pode incluir o som de trombetas usadas na adoração.
    reason: lexical_alternative
  - marker: b
    text: “Teu rosto” pode indicar aqui tua presença ou teu favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Como é feliz
  rationale: A forma exclamativa introduz uma bem-aventurança. “Como é feliz” soa natural em português, mantém a força celebrativa e evita reduzir a expressão a um estado psicológico passageiro.
- source_word: הָעָם
  choice: o povo
  rationale: Neste contexto, עָם designa a comunidade reunida como povo, sem a ênfase política que “nação” poderia sugerir.
- source_word: יוֹדְעֵי
  choice: que conhece
  rationale: O particípio caracteriza o povo por esse conhecimento reconhecível e contínuo; a oração relativa é idiomática em português.
- source_word: תְרוּעָה
  choice: a aclamação jubilosa
  rationale: O termo pode indicar um brado, uma aclamação festiva ou um toque de trombeta. “Aclamação jubilosa” comunica o provável cenário litúrgico sem restringir o sentido somente à voz ou a um instrumento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאוֹר
  choice: à luz
  rationale: Expressa de modo natural em português a esfera em que o povo caminha, mantendo a imagem hebraica da luz.
- source_word: פָּנֶיךָ
  choice: do teu rosto
  rationale: Mantém a imagem concreta do hebraico. “Presença” ou “favor” explicam possíveis sentidos da metáfora, mas não a substituem no texto principal.
- source_word: יְהַלֵּכוּן
  choice: eles caminham
  rationale: Conserva a metáfora bíblica de caminhar como conduta ou modo de vida e também o aspecto contínuo da forma verbal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: 'Yahweh, em vocativo: “Ó Yahweh”'
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome da aliança. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de פָּנֶיךָ
  choice: teu rosto
  alternative: tua presença; teu favor
  rationale: O hebraico diz literalmente “teu rosto”, imagem que pode comunicar tanto a presença quanto o favor divino. O texto principal preserva essa amplitude, e a nota apresenta os sentidos idiomáticos possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura exclamativa reproduz o tom da bem-aventurança; “aclamação jubilosa” preserva a amplitude litúrgica de תְרוּעָה, e “teu rosto” conserva a imagem relacional do original.
