  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: pt
  text: Uma vez[a] jurei pela minha santidade; não mentirei a Davi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De uma vez por todas, jurei pela minha santidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “se eu mentir a Davi”, fórmula de juramento que significa “não mentirei a Davi” ou “certamente não serei falso com Davi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Uma vez
  rationale: No contexto do juramento, o termo funciona adverbialmente e indica um ato único e decisivo; “uma vez” preserva a concisão e permite explicitar em nota a possível força de “uma vez por todas”.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: O nifal de שׁבע significa prestar juramento. O pretérito perfeito é natural em português para um juramento já feito e ainda válido no contexto.
- source_word: בְקָדְשִׁי
  choice: pela minha santidade
  rationale: A preposição בְּ apresenta a santidade divina como garantia invocada no juramento. Esta leitura é mais provável aqui do que “pelo meu santuário” ou “pelo meu santo”.
- source_word: אִם
  choice: não
  rationale: 'Depois de uma declaração de juramento, אִם introduz uma fórmula elíptica cuja força é negativa: literalmente, “se eu mentir...”, isto é, “certamente não mentirei”.'
- source_word: לְדָוִד
  choice: a Davi
  rationale: A preposição לְ marca a pessoa a quem a falsidade seria dirigida; “mentir a Davi” é claro e idiomático em português.
- source_word: אֲכַזֵּב
  choice: mentirei
  rationale: O piel de כזב pode significar mentir ou mostrar-se falso. “Mentirei” conserva a força pessoal e moral da expressão diante de Davi.
theological_decisions:
- issue: Como traduzir a fórmula divina de juramento sem acrescentar conteúdo ao hebraico
  choice: Uma vez jurei pela minha santidade; não mentirei a Davi.
  alternative: Uma vez por todas jurei pela minha santidade; se eu mentir a Davi...
  rationale: A tradução explicita a negação inerente à fórmula hebraica com אִם, evitando em português uma condição incompleta, mas sem ampliar a promessa. “Pela minha santidade” mantém a autoatestação divina e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à leitura pública. O ponto e vírgula preserva a relação entre o juramento e a declaração solene que se segue.
