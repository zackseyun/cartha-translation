lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: maskil
  rationale: O termo hebraico funciona como designação musical ou literária no título do salmo, mas seu sentido exato é incerto. A transliteração preserva o rótulo hebraico sem impor uma interpretação discutível.
- source_word: לְ
  choice: de
  rationale: Nos títulos dos salmos, a preposição pode indicar autoria, associação, dedicação ou pertencimento. “De” é breve e natural em português e mantém essa relação relativamente aberta.
- source_word: אֵיתָן
  choice: Etã
  rationale: Forma portuguesa tradicional e fonologicamente adequada do nome hebraico.
- source_word: הָאֶזְרָחִי
  choice: o ezraíta
  rationale: Reproduz diretamente a forma gentílica ou clânica do texto massorético. A possível identificação como descendente de Zerá é preservada em nota.
