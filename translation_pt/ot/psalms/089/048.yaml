source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: pt
  text: Que homem pode viver sem ver a morte[a]? Pode ele livrar sua alma[b] da mão do Sheol[c]? Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “experimentar a morte”. Literalmente, “ver a morte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua vida” ou “a si mesmo”, em lugar de “sua alma”.
    reason: lexical_alternative
  - marker: c
    text: Sheol é o termo hebraico para o mundo dos mortos; outra tradução possível é “a sepultura”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Que homem
  rationale: Introduz a pergunta retórica e preserva o substantivo masculino גֶבֶר, aqui empregado de modo representativo a respeito da mortalidade humana.
- source_word: יִחְיֶה
  choice: pode viver
  rationale: No contexto da pergunta retórica, o imperfeito exprime possibilidade; em português, “pode viver” comunica essa força com naturalidade.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: sem ver a morte
  rationale: Preserva a imagem hebraica “ver a morte”, enquanto “sem” expressa de modo natural em português a relação entre viver e não morrer.
- source_word: יְמַלֵּט
  choice: Poderá ele livrar
  rationale: O piel indica fazer escapar ou pôr a salvo. “Livrar” mantém o tom poético e a ideia de escapar ao poder da morte.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. “Alma” conserva a linguagem poética e a amplitude teológica, com as demais possibilidades registradas em nota.
- source_word: מִיַּד
  choice: da mão
  rationale: Mantém a metáfora hebraica da mão como poder ou domínio, compreensível no contexto poético português.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva a categoria hebraica sem reduzi-la à sepultura nem identificá-la indevidamente com concepções posteriores de inferno.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, pois a função precisa do termo permanece incerta.
theological_decisions:
- issue: Sentido de שְׁאוֹל no contexto poético
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração conserva a ambiguidade e a categoria própria do hebraico, evitando tanto uma redução à sepultura física quanto a importação da noção posterior de inferno.
- issue: Linguagem masculina representativa em גֶבֶר
  choice: homem
  alternative: pessoa; ser humano
  rationale: O substantivo hebraico é masculino e, nesta pergunta retórica, representa a humanidade mortal. “Homem” preserva essa forma sem restringir a afirmação apenas aos homens.
- issue: Amplitude antropológica de נַפְשׁוֹ
  choice: sua alma
  alternative: sua vida; a si mesmo
  rationale: O termo hebraico pode referir-se à vida ou à própria pessoa, não apenas a uma entidade imaterial. A tradução principal retém a formulação poética, e a nota impede uma leitura indevidamente estreita.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira e compreensão internacional. A estrutura em duas perguntas retóricas preserva o paralelismo. As metáforas “ver a morte” e “mão do Sheol” foram mantidas por serem claras no contexto, e “Selá” recebeu a acentuação usual em português.
