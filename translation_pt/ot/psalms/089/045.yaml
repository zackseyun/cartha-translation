source:
  edition: WLC
  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: pt
  text: Encurtaste os dias da juventude dele; cobriste-o de vergonha.[a] Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “envolveste-o em vergonha” ou “vestiste-o de vergonha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: Encurtaste
  rationale: O hifil de קצר significa tornar curto, encurtar. O perfeito hebraico é expresso naturalmente pelo pretérito perfeito em português, sem perder o resultado presente no contexto.
- source_word: יְמֵי
  choice: os dias da
  rationale: O plural construto significa literalmente “os dias de” e pode indicar a duração de uma fase da vida. A tradução preserva a expressão poética hebraica.
- source_word: עֲלוּמָיו
  choice: juventude dele
  rationale: O substantivo designa a juventude ou o período juvenil. “Juventude dele” mantém o sufixo masculino singular sem identificar explicitamente seu referente.
- source_word: הֶעֱטִיתָ
  choice: cobriste
  rationale: O hifil de עטה pode significar cobrir, envolver ou vestir. Com “vergonha”, “cobrir” forma uma imagem clara e natural em português.
- source_word: עָלָיו
  choice: -o
  rationale: 'A preposição com sufixo significa literalmente “sobre ele”. Em português, o objeto de “cobrir” incorpora essa relação de modo idiomático: “cobriste-o de vergonha”.'
- source_word: בּוּשָׁה
  choice: vergonha
  rationale: O substantivo denota vergonha, desonra ou humilhação. “Vergonha” é o equivalente mais direto e preserva a concisão poética.
- source_word: סֶלָה
  choice: Selá
  rationale: O termo litúrgico ou musical tem sentido preciso incerto; por isso, é transliterado, com acento para orientar a pronúncia em português, sem interpretação indevida.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “sua juventude” e “sobre ele”
  choice: Manter o pronome masculino singular por meio de “dele” e “-o”, sem nomear o referente.
  alternative: Interpretar explicitamente o referente como o rei davídico ou como a dinastia davídica/o ungido personificado.
  rationale: O contexto aponta para o rei ungido humilhado ou para a dinastia davídica, mas o versículo emprega apenas sufixos masculinos singulares. A formulação escolhida preserva a ambiguidade poética e teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com concisão poética. Emprega-se “dele” em vez de “sua” para deixar inequívoco o gênero masculino do referente e evitar uma possível leitura de segunda pessoa. “Selá” segue a transliteração tradicional adaptada à ortografia portuguesa.
