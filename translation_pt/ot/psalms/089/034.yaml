  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: pt
  text: Não violarei a minha aliança[a], nem alterarei o que saiu dos meus lábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não profanarei a minha aliança” ou “não quebrarei a minha aliança”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a saída dos meus lábios”; isto é, aquilo que pronunciei.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: violarei
  rationale: O piel de חלל expressa aqui a ideia de profanar ou violar a aliança. “Violar” é natural em português no contexto de uma aliança e preserva a gravidade do ato sem restringir o sentido à esfera ritual.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: בְּרִית é o termo hebraico habitual para uma relação pactuada e solene; “aliança” mantém essa linguagem bíblica, e o sufixo de primeira pessoa é expresso por “minha”.
- source_word: מוֹצָא שְׂפָתַי
  choice: o que saiu dos meus lábios
  rationale: A expressão significa literalmente “a saída dos meus lábios” e designa aquilo que foi pronunciado. A formulação preserva a imagem hebraica e continua compreensível em português.
- source_word: אֲשַׁנֶּה
  choice: alterarei
  rationale: O piel de שנה significa mudar ou alterar. “Alterar” combina naturalmente com uma declaração solene já proferida.
- source_word: לֹא ... לֹא
  choice: Não ... nem ...
  rationale: A construção portuguesa com “nem” conserva as duas negações paralelas sem tornar a frase pesada.
theological_decisions:
- issue: Natureza do compromisso divino
  choice: Manter a linguagem concreta de aliança e da palavra pronunciada por Deus
  alternative: Parafrasear como “não quebrarei minha promessa” ou expandir em uma afirmação doutrinária sobre a imutabilidade divina
  rationale: O hebraico fala especificamente da aliança de Deus e daquilo que saiu de seus lábios. A tradução preserva esses elementos sem impor uma formulação teológica mais ampla do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi mantido por meio de “Não... nem...”, e a imagem dos lábios foi preservada sem sacrificar a clareza.
