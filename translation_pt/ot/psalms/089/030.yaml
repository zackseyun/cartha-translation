base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: pt
  text: Se os filhos dele abandonarem a minha lei[a] e não andarem segundo os meus decretos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha instrução”. O hebraico torá pode designar ensino ou instrução, além de lei.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não andarem nos meus juízos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição de modo direto, sem afirmar que ela necessariamente se cumprirá.
- source_word: יַעַזְבוּ
  choice: abandonarem
  rationale: Expressa naturalmente a ideia de deixar ou rejeitar e comunica a deslealdade pactual sugerida pelo contexto.
- source_word: בָנָיו
  choice: os filhos dele
  rationale: Preserva o masculino plural explícito e evita a possível ambiguidade de 'seus filhos' em português.
- source_word: תּוֹרָתִי
  choice: a minha lei
  rationale: Embora תּוֹרָה também possa significar instrução, o paralelismo com מִשְׁפָּטַי favorece aqui a nuance jurídica.
- source_word: וּבְמִשְׁפָּטַי
  choice: segundo os meus decretos
  rationale: A preposição בְּ com o verbo 'andar' é expressa idiomaticamente por 'segundo'; 'decretos' mantém o registro jurídico de מִשְׁפָּטִים.
- source_word: לֹא יֵלֵכוּן
  choice: não andarem
  rationale: Conserva a metáfora bíblica de andar como modo de viver ou conduzir-se.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: a minha lei
  alternative: a minha instrução
  rationale: O termo comporta ambos os sentidos, mas seu paralelismo imediato com 'meus decretos' ressalta a dimensão jurídico-pactual; a alternativa é preservada em nota.
- issue: Referência masculina de בָנָיו
  choice: os filhos dele
  alternative: os descendentes dele
  rationale: O hebraico diz literalmente 'filhos dele'; manter a forma masculina preserva o referente textual no contexto da aliança davídica sem ampliar silenciosamente o termo.
- issue: Relação expressa por בְּ em וּבְמִשְׁפָּטַי
  choice: segundo os meus decretos
  alternative: nos meus juízos
  rationale: A formulação escolhida explicita em português idiomático a ideia de orientar a conduta pelas determinações divinas, sem eliminar a alternativa mais formal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das notas segue sua ocorrência no texto. 'Os filhos dele' evita a ambiguidade possessiva de 'seus filhos'; 'andarem' preserva a metáfora hebraica, enquanto 'segundo' torna idiomática a relação com os decretos.
