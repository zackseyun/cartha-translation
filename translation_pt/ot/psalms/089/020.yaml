  text: מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑/י בְּ/שֶׁ֖מֶן קָדְשִׁ֣/י מְשַׁחְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: pt
  text: Encontrei Davi, meu servo[a]; com meu óleo santo, eu o ungi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Achei Davi, meu servo; com meu óleo santo, eu o ungi.”'
    reason: Alternativa lexical para מָצָאתִי; “achei” também traduz literalmente o verbo מצא, embora “encontrei” seja mais claro e digno neste contexto.
lexical_decisions:
- source_word: מָצָאתִי
  choice: Encontrei
  rationale: O qal perfeito na primeira pessoa do singular descreve um ato divino concluído. Em português, o pretérito perfeito simples é a forma natural para esta declaração retrospectiva; a relevância contínua decorre do contexto da aliança.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Embora עבד também possa designar um escravo, aqui funciona como designação honrosa de Davi a serviço de Deus no contexto régio e da aliança.
- source_word: בְּשֶׁמֶן
  choice: com ... óleo
  rationale: A preposição ב, com o verbo משׁח no contexto de unção, indica o meio ou instrumento e é expressa naturalmente por “com” em português.
- source_word: קָדְשִׁי
  choice: meu óleo santo
  rationale: קדשׁ expressa santidade ou separação para uso divino. “Santo” preserva o sentido cultual e teológico, e a ordem é natural em português.
- source_word: מְשַׁחְתִּיו
  choice: eu o ungi
  rationale: O qal perfeito com sufixo masculino singular descreve a unção concluída de Davi. O pronome sujeito explícito realça, com naturalidade poética, que o próprio Deus realizou o ato.
theological_decisions:
- issue: Linguagem de unção régia e possível ressonância messiânica
  choice: Manter a referência histórica direta à unção de Davi, sem acrescentar um título messiânico.
  alternative: Explicitar na tradução uma leitura tipológica de Davi como Messias ou Ungido.
  rationale: O hebraico nomeia Davi e declara que Deus o ungiu. Possíveis ressonâncias messiânicas pertencem à leitura do contexto canônico, mas não devem ser inseridas no texto deste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo e a concisão da fala divina foram preservados; o pretérito perfeito simples soa mais natural em português do que uma construção equivalente ao present perfect inglês.
