base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: pt
  text: Minha fidelidade e meu amor leal estarão com ele, e, em meu nome, seu chifre será elevado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na poesia hebraica, o chifre simboliza força, dignidade ou poder real.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: minha fidelidade
  rationale: Neste contexto, אֱמוּנָה expressa a constância e confiabilidade de Deus, em paralelo com חֶסֶד.
- source_word: חַסְדִּי
  choice: meu amor leal
  rationale: A expressão comunica amor constante e lealdade pactual em português atual, sem recorrer a uma forma arcaica.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a ideia de presença e apoio que o hebraico expressa.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Preserva o idioma hebraico e a ideia de que a autoridade e a posição do rei procedem de Deus.
- source_word: תָּרוּם
  choice: será exaltado
  rationale: Expressa naturalmente o sentido de elevar ou exaltar, adequado à imagem poética.
- source_word: קַרְנוֹ
  choice: seu poder
  rationale: Embora o hebraico diga literalmente “seu chifre”, em português a imagem isolada tende a ser opaca ou mal compreendida; o sentido metafórico de força e poder real é comunicado no texto, com a imagem literal preservada em nota.
theological_decisions:
- issue: Imagem régia do chifre
  choice: seu poder será exaltado
  alternative: seu chifre será elevado
  rationale: A tradução comunica o valor simbólico da metáfora hebraica sem introduzir uma leitura doutrinária específica; a nota preserva a forma e a amplitude da imagem original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amor leal” mantém a dimensão afetiva e a constância de חֶסֶד; a metáfora do chifre é explicada em nota para evitar uma leitura equivocada no texto corrente.
