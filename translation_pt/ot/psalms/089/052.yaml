lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo integra uma fórmula litúrgica de bênção e louvor. “Bendito seja” transmite de modo natural em português sua força doxológica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa corrente que comunica adequadamente a duração ilimitada indicada pela locução hebraica.
- source_word: אָמֵן וְאָמֵן
  choice: Amém e amém
  rationale: Mantém a fórmula litúrgica e sua repetição enfática, inclusive a conjunção do texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e solene, com cadência litúrgica natural. Não se incluiu a nota da camada inglesa porque ela apenas repete a mesma leitura e não representa uma variante real do texto hebraico.
