  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: pt
  text: Estabelecerei para sempre a tua descendência[a] e edificarei o teu trono de geração em geração. Selá[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua semente”; o substantivo hebraico está no singular, mas pode ter sentido coletivo e referir-se aos descendentes.
    reason: lexical_alternative
  - marker: b
    text: “Selá” provavelmente é uma indicação musical ou litúrgica; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua e preserva de modo natural em português o sentido perpétuo da promessa da aliança.
- source_word: אָכִין
  choice: Estabelecerei
  rationale: O hifil de כון significa tornar firme ou estabelecer; esta escolha é natural no contexto de uma dinastia.
- source_word: זַרְעֶךָ
  choice: a sua descendência
  rationale: זֶרַע é singular coletivo e pode designar os descendentes. “Descendência” preserva essa força coletiva e a ressonância da aliança sem soar arcaico.
- source_word: וּבָנִיתִי
  choice: e edificarei
  rationale: Embora a forma seja perfeita, o paralelismo com o verbo anterior lhe dá valor futuro. “Edificarei” conserva a metáfora arquitetônica aplicada ao trono.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Formulação corrente e digna em português que comunica continuidade através de gerações sucessivas.
- source_word: כִּסְאֲךָ
  choice: o seu trono
  rationale: Equivalente normal no contexto régio; aqui representa também a continuidade do reinado dinástico.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, a transliteração evita impor uma interpretação específica.
theological_decisions:
- issue: Linguagem de promessa dinástica no contexto da aliança régia
  choice: Manter a referência direta à descendência e ao trono do rei davídico
  alternative: Explicitar no versículo o cumprimento messiânico ou reduzir a promessa a uma posteridade genérica
  rationale: O hebraico formula uma promessa régia e dinástica direta. A tradução preserva seu sentido histórico e sua abertura canônica sem inserir conclusões doutrinárias na redação do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A forma “sua” mantém a referência em terceira pessoa do contexto do salmo; “edificarei” preserva a imagem poética, e “Selá” recebe acento para orientar a pronúncia em português.
