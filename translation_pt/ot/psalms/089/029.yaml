  text: וְ/שַׂמְתִּ֣י לָ/עַ֣ד זַרְע֑/וֹ וְ֝/כִסְא֗/וֹ כִּ/ימֵ֥י שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: pt
  text: Estabelecerei para sempre a sua descendência[a] e o seu trono, como os dias dos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: «enquanto os céus durarem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Estabelecerei
  rationale: שׂים significa literalmente pôr ou colocar, mas, no contexto da promessa da aliança referente à descendência e ao trono, «estabelecer» comunica de modo natural a ideia de assegurar sua permanência.
- source_word: לָעַד
  choice: para sempre
  rationale: A expressão indica duração perpétua; «para sempre» é a equivalência moderna mais clara e preserva a força da promessa.
- source_word: זַרְעוֹ
  choice: a sua descendência
  rationale: זֶרַע é um substantivo coletivo que pode designar prole ou descendentes. «Descendência» preserva o sentido coletivo e a ressonância da aliança sem o arcaísmo de «semente».
- source_word: וְכִסְאוֹ
  choice: e o seu trono
  rationale: כִּסֵּא significa diretamente «trono»; o possessivo retoma o rei davídico do contexto.
- source_word: כִּימֵי
  choice: como os dias de
  rationale: O prefixo כ marca comparação, e a tradução mantém a imagem hebraica «dias de» em vez de substituí-la no texto por uma explicação interpretativa.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: A forma plural hebraica normalmente designa «os céus»; aqui, a expressão cósmica preserva melhor a imagem poética do que «céu» ou «firmamento».
theological_decisions:
- issue: A linguagem de duração na promessa da aliança davídica
  choice: 'Manter a linguagem direta de perpetuidade: «para sempre» e «como os dias dos céus».'
  alternative: Interpretar a comparação como «enquanto os céus durarem» ou reformulá-la como «por todas as gerações».
  rationale: O versículo apresenta uma promessa enfática em linguagem poética de perpetuidade. A tradução preserva essa força e sua tensão teológica sem impor uma explicação dinástica ou escatológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Descendência» é natural e conserva o valor coletivo; a formulação «como os dias dos céus» mantém deliberadamente o paralelismo e a imagem do hebraico, esclarecidos pela nota.
