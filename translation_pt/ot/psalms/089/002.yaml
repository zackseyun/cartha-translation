  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: pt
  text: 'Pois eu disse: “O amor leal será edificado para sempre[a]; nos céus estabelecerás a tua fidelidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O amor leal será estabelecido para sempre”. O verbo hebraico pode significar “edificar” ou, em sentido mais geral, “estabelecer”; o texto mantém a metáfora poética de construção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou afirmação do salmista, preservando a força discursiva sem tornar a relação mais específica do que o hebraico permite.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: O perfeito qal na primeira pessoa do singular é traduzido de modo direto e natural, sem ampliá-lo para ‘declaro’.
- source_word: עוֹלָם
  choice: para sempre
  rationale: Expressa duração ilimitada em português corrente e conserva a função adverbial do termo no verso.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Reúne as ideias de amor e lealdade duradoura sem limitar o termo apenas a misericórdia nem explicitar ‘aliança’ onde ela não é nomeada.
- source_word: יִבָּנֶה
  choice: será edificado
  rationale: Preserva a voz passiva do nifal, a projeção futura e a metáfora arquitetônica do verbo בנה.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Reflete a forma plural hebraica e mantém o registro poético tradicional sem recorrer a linguagem arcaica.
- source_word: תָּכִן
  choice: estabelecerás
  rationale: O hifil na segunda pessoa masculina singular comunica a ação de tornar firme ou estabelecer, em endereço direto a Deus.
- source_word: אֱמוּנָתְךָ
  choice: a tua fidelidade
  rationale: ‘Fidelidade’ expressa adequadamente firmeza e confiabilidade e distingue este termo de חֶסֶד no paralelismo.
- source_word: בָהֶם
  choice: nos céus
  rationale: Explicita de forma natural em português o antecedente do pronome hebraico, שָׁמַיִם, evitando um ‘neles’ potencialmente pouco claro.
theological_decisions:
- issue: Sentido de חֶסֶד no contexto poético ligado à aliança
  choice: amor leal
  alternative: misericórdia; amor de aliança; amor fiel
  rationale: A escolha conserva tanto o afeto quanto a lealdade duradoura, sem reduzir o termo à compaixão nem inserir explicitamente uma referência à aliança.
- issue: Endereço direto a Deus no segundo membro do verso
  choice: “estabelecerás a tua fidelidade”
  alternative: formulação impessoal, como “a fidelidade será estabelecida”
  rationale: A forma verbal na segunda pessoa masculina singular e o sufixo possessivo correspondente sustentam claramente o endereço direto a Deus.
- issue: Metáfora de construção aplicada ao amor leal
  choice: “será edificado”
  alternative: “será estabelecido”
  rationale: A tradução mantém a imagem concreta do hebraico, embora o sentido mais geral de estabelecimento permaneça possível e seja registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular conserva o endereço poético direto a Deus; ‘será edificado’ mantém deliberadamente a imagem do original.
