base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: pt
  text: Esmagarei diante dele os seus adversários[a] e golpearei[b] os que o odeiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de diante dele”; literalmente, “de diante de sua face/presença”. A expressão hebraica pode descrever a remoção dos inimigos de sua presença.
    reason: lexical_alternative
  - marker: b
    text: Ou “ferirei” ou “abaterei”; o verbo hebraico pode indicar um golpe contundente em juízo ou batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: Esmagarei
  rationale: O verbo כתת expressa esmagar ou despedaçar. No encadeamento poético da promessa divina, a forma com conjunção tem sentido futuro; “esmagarei” conserva a força da imagem marcial.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: A expressão significa literalmente “de diante de sua face/presença”. “Diante dele” preserva o idioma espacial hebraico de modo natural, embora também possa sugerir que os inimigos são removidos de sua presença.
- source_word: צָרָיו
  choice: os seus adversários
  rationale: צָרָיו designa aqueles que se opõem hostilmente a ele. “Adversários” mantém essa oposição ativa e evita repetir a formulação do segundo membro.
- source_word: וּמְשַׂנְאָיו
  choice: e os que o odeiam
  rationale: O particípio de שׂנא indica pessoas caracterizadas por odiá-lo; a construção verbal é clara e corrente em português.
- source_word: אֶגּוֹף
  choice: golpearei
  rationale: נגף pode significar golpear, ferir ou causar derrota em juízo ou batalha. “Golpearei” mantém a ação forte sem restringi-la à ideia específica de praga.
theological_decisions:
- issue: Linguagem do guerreiro divino na promessa da aliança ao rei davídico
  choice: Manter a imagem marcial forte como ação direta de Deus em favor do rei.
  alternative: Generalizar como “derrotarei” ou “vencerei”.
  rationale: Os dois verbos hebraicos retratam uma intervenção divina contundente contra os inimigos. A tradução conserva essa tensão e a teologia régia do texto sem acrescentar uma identificação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e a intensidade da linguagem de combate foram preservados; evitou-se o arcaísmo “ferirei de praga” e não se explicitou além do hebraico o modo da derrota.
