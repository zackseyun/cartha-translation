  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: pt
  text: Para sempre lhe conservarei o meu amor leal, e a minha aliança permanecerá firme para ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a minha aliança será fiel a ele» ou «a minha aliança será segura para ele».'
    reason: A forma נֶאֱמֶנֶת pode salientar fidelidade, firmeza ou segurança; a nota preserva essas alternativas sem desfazer a formulação principal.
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Para sempre
  rationale: Expressa duração permanente de modo natural e digno em português.
- source_word: אֶשְׁמֹר
  choice: conservarei
  rationale: No contexto da aliança, שׁמר indica manter ou preservar; “conservarei” comunica a ação contínua de Deus sem sugerir mera posse.
- source_word: לוֹ
  choice: por ele / para ele
  rationale: A preposição ל marca relação ou benefício. A variação idiomática evita rigidez sem alterar o referente masculino singular.
- source_word: חַסְדִּי
  choice: o meu amor leal
  rationale: חסד reúne amor, fidelidade e compromisso; “amor leal” preserva essa riqueza pactual em linguagem atual.
- source_word: וּבְרִיתִי
  choice: e a minha aliança
  rationale: “Aliança” é o equivalente consagrado e preciso de בְּרִית neste contexto davídico.
- source_word: נֶאֱמֶנֶת
  choice: permanecerá firme
  rationale: O particípio nifal de אמן comunica confiabilidade, segurança e estabilidade. A forma verbal portuguesa se harmoniza com a promessa futura do primeiro hemistíquio.
theological_decisions:
- issue: Linguagem da aliança sem explicitar o cumprimento messiânico
  choice: Manter o pronome “ele” como referência direta ao rei davídico mencionado no contexto.
  alternative: Inserir no texto uma referência explícita ao Messias ou a Cristo.
  rationale: O hebraico fala simplesmente de “ele”. A tradução preserva o referente imediato e não antecipa no texto a interpretação canônica ou cristológica.
- issue: Agente semântico da fidelidade na segunda oração
  choice: Apresentar a aliança como aquilo que permanecerá firme para ele.
  alternative: Traduzir que a aliança “será fiel a ele”.
  rationale: נֶאֱמֶנֶת admite as ideias de fidelidade, firmeza e segurança. “Permanecerá firme” é natural em português e preserva a confiabilidade objetiva da aliança sem resolver excessivamente a tensão semântica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém o paralelismo poético e a linguagem pactual sem arcaísmos.
