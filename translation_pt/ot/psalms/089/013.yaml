  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: pt
  text: Teu é o braço poderoso; tua mão é forte; tua mão direita está erguida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: Teu é
  rationale: A construção preposicional com sufixo pronominal expressa posse e aparece em posição enfática. “Teu é” preserva essa ênfase e soa digna em poesia portuguesa.
- source_word: זְרוֹעַ
  choice: braço
  rationale: Mantém a imagem concreta hebraica do braço como expressão de poder, sem reduzi-la a um conceito abstrato.
- source_word: עִם גְּבוּרָה
  choice: poderoso
  rationale: O sintagma caracteriza o braço como dotado de força ou poder. A forma adjetival produz português natural sem perder o sentido.
- source_word: תָּעֹז
  choice: é forte
  rationale: O verbo predica força da mão. “É forte” comunica de modo claro e direto o valor contextual.
- source_word: יָדְךָ
  choice: tua mão
  rationale: A tradução literal conserva a imagem antropomórfica e o paralelismo poético.
- source_word: תָּרוּם
  choice: está erguida
  rationale: O verbo רום pode indicar estar elevada ou ser exaltada. “Está erguida” preserva a imagem espacial e a possível ideia de poder manifesto.
- source_word: יְמִינֶךָ
  choice: tua mão direita
  rationale: Mantém a expressão concreta e seu simbolismo bíblico de força e vitória.
theological_decisions:
- issue: Linguagem antropomórfica sobre o poder de Deus
  choice: Conservar “braço”, “mão” e “mão direita”.
  alternative: Substituir as imagens por termos abstratos como “poder” e “força”.
  rationale: O hebraico descreve poeticamente o poder divino por imagens corporais; conservá-las respeita a forma e a tensão metafórica do texto.
- issue: Sentido de תָּרוּם
  choice: “está erguida”
  alternative: “é exaltada”
  rationale: Ambas as leituras são lexicalmente possíveis. A opção principal preserva a imagem concreta de elevação sem excluir a conotação de majestade ou supremacia.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com formas possessivas “teu/tua” adequadas ao discurso dirigido a Deus. O paralelismo em três membros e as imagens concretas do hebraico foram preservados.
