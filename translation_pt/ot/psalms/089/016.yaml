  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: pt
  text: Em teu nome eles se alegram o dia inteiro, e em tua justiça são elevados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e por tua retidão eles se elevam”.'
    reason: Preserva as alternativas lexicais de צְדָקָה (“retidão”) e בְּ (“por”), bem como a possibilidade de entender יָרוּמוּ de modo intransitivo.
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: Em teu nome
  rationale: O בְּ indica aqui a esfera ou o fundamento da alegria. “Nome” representa o caráter revelado e a reputação de Deus, não apenas uma designação verbal.
- source_word: יְגִילוּן
  choice: eles se alegram
  rationale: O verbo גיל expressa alegria intensa ou exultação. “Alegram-se” comunica essa força em português atual sem elevar desnecessariamente o registro.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: A expressão indica duração ao longo de todo o dia; “o dia inteiro” é idiomático e conserva a ênfase temporal.
- source_word: וּבְצִדְקָתְךָ
  choice: e em tua justiça
  rationale: צְדָקָה abrange tanto retidão quanto justiça e, neste contexto de louvor, aponta amplamente para o caráter justo e a ação fiel de Deus. A preposição foi mantida como “em” para preservar o paralelismo com a primeira oração.
- source_word: יָרוּמוּ
  choice: são elevados
  rationale: O verbo רום significa estar ou tornar-se alto, elevar-se. A formulação comunica que a justiça de Deus é o fundamento da elevação do povo, sem sugerir que eles se vangloriam ou se engrandecem por conta própria.
theological_decisions:
- issue: Sentido de צְדָקָה aplicado a Deus neste contexto de louvor
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude do termo hebraico, que pode incluir caráter reto, fidelidade à aliança e ação justa. “Retidão” é possível, mas estreita um pouco o campo semântico.
- issue: Agente ou fundamento da elevação do povo
  choice: são elevados em tua justiça
  alternative: elevam-se em tua justiça
  rationale: O hebraico não declara explicitamente um agente, mas a construção contextual apresenta a justiça de Deus como esfera ou fundamento da elevação. A forma passiva evita a conotação moderna de autoexaltação, enquanto a nota preserva a forma intransitiva possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo hebraico é preservado pela repetição de “em”; “teu” mantém o tratamento singular e direto dirigido a Deus.
