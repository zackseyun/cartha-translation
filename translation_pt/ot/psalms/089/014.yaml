source:
  edition: WLC
  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: pt
  text: Retidão e justiça são o fundamento do teu trono; amor leal e fidelidade vão adiante de ti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «diante do teu rosto»; ou seja, «diante da tua presença».
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: justiça
  rationale: Expressa retidão e ordem justa; embora a distinção em relação a מִשְׁפָּט seja mais sutil em português, a coordenação tradicional e natural «justiça e juízo» preserva os dois termos hebraicos.
- source_word: מִשְׁפָּט
  choice: juízo
  rationale: Conserva a dimensão judicial do governo divino e evita traduzir os dois substantivos hebraicos pela mesma palavra portuguesa.
- source_word: מְכוֹן
  choice: fundamento
  rationale: No contexto do trono, designa sua base firme ou estabelecida; «fundamento» comunica a metáfora com clareza.
- source_word: כִּסְאֶךָ
  choice: teu trono
  rationale: Reproduz diretamente a metáfora régia e o sufixo de segunda pessoa masculina singular.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Comunica amor constante, comprometido e fiel, sem recorrer a expressão arcaica nem limitar explicitamente o termo a uma formulação teológica denominacional.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: Neste par relacional, destaca confiabilidade e constância; «verdade» continua sendo uma alternativa lexical possível.
- source_word: יְקַדְּמוּ
  choice: vão adiante
  rationale: Preserva o movimento poético de ir à frente ou preceder, em linguagem portuguesa natural.
- source_word: פָנֶיךָ
  choice: de ti
  rationale: Traduz idiomaticamente a ideia de ir diante da pessoa; a imagem hebraica literal, «do teu rosto», é mantida em nota.
theological_decisions:
- issue: Tradução do par חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  alternative: misericórdia e verdade
  rationale: A escolha mantém o caráter relacional de amor constante e confiabilidade sem reduzir אֱמֶת apenas à verdade proposicional; a alternativa continua lexicalmente possível.
- issue: Tradução de פָנֶיךָ
  choice: de ti
  alternative: do teu rosto
  rationale: «Vão adiante de ti» é idiomático e inteligível em português, enquanto a nota conserva a concretude da expressão hebraica e sua possível equivalência com «tua presença».
translation_notes:
  register: Português moderno, poético e digno, com formas de segunda pessoa coerentes («teu», «ti»). «Justiça e juízo» preserva o paralelismo lexical; «amor leal» torna חֶסֶד acessível sem linguagem arcaica.
