source:
  edition: WLC
  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: pt
  text: Lembra-te, Senhor, da afronta dos teus servos, que carrego junto ao peito[b], vinda de muitos povos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a afronta de todos os muitos povos”. A sintaxe hebraica depois de “junto ao peito” é condensada: os povos podem ser entendidos como a origem da afronta (“vinda de muitos povos”) ou como indicação do conteúdo ou da extensão da afronta carregada.'
    reason: alternative_reading
  - marker: b
    text: “Junto ao peito” é uma expressão hebraica que comunica carregar algo de modo pessoal e íntimo, não apenas em sentido físico.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo masculino singular de זכר, dirigido diretamente a Deus. “Lembra-te” é natural no registro de oração e lamento.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino fixo אֲדֹנָי em vocativo; “Senhor” preserva o uso convencional sem acrescentar a ideia possessiva de “meu Senhor”.
- source_word: חֶרְפַּת
  choice: afronta sofrida
  rationale: חֶרְפָּה abrange afronta, opróbrio, escárnio e desonra. “Afronta” conserva o tom de lamento; “sofrida” esclarece em português que os servos são alvo dela, não seus autores.
- source_word: עֲבָדֶיךָ
  choice: pelos teus servos
  rationale: No contexto de oração sobre o povo de Deus, “servos” é mais apropriado que “escravos”. A preposição integra a expressão portuguesa “sofrida pelos teus servos”.
- source_word: שְׂאֵתִי
  choice: que carrego
  rationale: Forma de נשׂא, “levantar, levar, carregar”. A oração relativa produz português natural e apresenta a afronta como peso pessoal suportado pelo salmista.
- source_word: בְּחֵיקִי
  choice: junto ao peito
  rationale: חֵיק designa o colo ou seio. “Junto ao peito” mantém a imagem concreta hebraica em linguagem atual e compreensível.
- source_word: כָּל רַבִּים עַמִּים
  choice: vinda de muitos povos
  rationale: A construção é comprimida e difícil. Esta leitura entende os muitos povos como fonte da afronta; “povos” preserva o plural עַמִּים e sua possível dimensão nacional ou étnica.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: Aqui אֲדֹנָי funciona como título divino convencional em invocação direta. “Senhor” preserva esse uso sem impor uma nuance possessiva desnecessária.
- issue: Relação sintática da expressão final com a afronta
  choice: a afronta vem de muitos povos
  alternative: a afronta de todos os muitos povos é o conteúdo ou a extensão daquilo que o salmista carrega
  rationale: A sintaxe hebraica depois de “junto ao peito” é condensada. O texto principal adota a leitura de origem, mas a nota conserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Afronta” mantém o tom poético do lamento sem soar excessivamente arcaico; “junto ao peito” conserva a imagem hebraica de forma mais atual que “no seio”.
