base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: pt
  text: 'Também fazes recuar o fio da sua espada[a]

    e não o fazes manter-se de pé na batalha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Também embotas o fio da sua espada”. O hebraico diz literalmente “fazes recuar o fio da sua espada”, expressando que ela se torna ineficaz.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não o sustentas na batalha” ou “não o capacitas a resistir na batalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Também
  rationale: Aqui a partícula acrescenta mais uma acusação à sequência do lamento. “Também” preserva com naturalidade esse valor aditivo, sem excluir uma nuance enfática.
- source_word: תָּשִׁיב
  choice: fizeste recuar
  rationale: O hifil de שׁוב exprime fazer voltar ou recuar. A tradução mantém a imagem concreta do hebraico, em vez de explicitar apenas o efeito como “embotaste”.
- source_word: צוּר חַרְבּוֹ
  choice: o fio da espada dele
  rationale: Neste contexto, צוּר designa o fio ou gume da espada, não seu sentido comum de “rocha”. “Fio da espada” é claro e idiomático em português.
- source_word: וְלֹא הֲקֵימֹתוֹ
  choice: e não o sustentaste
  rationale: O hifil de קום pode significar fazer ficar de pé, manter ou sustentar. No contexto militar, “sustentaste” comunica que Deus não o capacitou a resistir, preservando a possibilidade da imagem literal.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: A expressão portuguesa corresponde naturalmente ao hebraico definido e mantém o cenário militar específico do lamento.
theological_decisions:
- issue: Atribuição direta a Deus da derrota do rei davídico
  choice: 'Manter a segunda pessoa e a agência divina explícita: “fizeste... não o sustentaste”.'
  alternative: Empregar formulação impessoal ou passiva que amenize a agência divina.
  rationale: O lamento atribui diretamente a Deus tanto a ineficácia da espada quanto a incapacidade do rei de resistir. Essa tensão teológica pertence ao texto e não deve ser suavizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético, a imagem incomum do fio da espada que recua e a acusação direta dirigida a Deus.
