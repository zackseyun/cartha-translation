base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: pt
  text: Rejeitaste[a] a aliança com o teu servo; profanaste a sua coroa[b], lançando-a por terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Repudiaste a aliança com o teu servo»; ou: «Desprezaste a aliança com o teu servo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «profanaste o seu diadema, lançando-o por terra». A palavra hebraica traduzida por «coroa» também está associada à consagração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: Rejeitaste
  rationale: O piel de נאר expressa repúdio ou rejeição ativa. «Rejeitaste» é natural em português e preserva a força da acusação no lamento sem acrescentar a conotação específica de renúncia formal.
- source_word: בְּרִית
  choice: aliança
  rationale: É o equivalente consagrado e contextualmente adequado para a aliança régia davídica, preservando seu peso formal e teológico.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: No contexto régio, designa o rei davídico como subordinado e representante de Deus; «servo» é claro e evita a inadequada especificidade social de «escravo».
- source_word: חִלַּלְתָּ
  choice: profanaste
  rationale: O piel de חלל indica profanar, dessacralizar ou desonrar aquilo que possui caráter santo. «Profanaste» mantém a ligação semântica com a consagração evocada por נזר.
- source_word: לָאָרֶץ
  choice: até o chão
  rationale: Reproduz de modo idiomático a imagem hebraica de rebaixamento e humilhação, embora o sentido literal seja «à terra».
- source_word: נִזְרוֹ
  choice: a sua coroa
  rationale: No salmo régio, refere-se naturalmente à coroa ou ao diadema do rei. «Coroa» é imediatamente compreensível, enquanto a nota preserva a nuance de consagração.
theological_decisions:
- issue: Aparente rejeição da aliança davídica por Deus
  choice: 'Manter a acusação direta do salmista: «Rejeitaste a aliança»'
  alternative: Atenuar para uma impressão subjetiva, como «parece que rejeitaste», ou explicar a continuidade posterior da aliança
  rationale: O hebraico formula uma acusação direta dentro do lamento. A tradução deve preservar essa tensão teológica sem solucioná-la antecipadamente.
- issue: Imagem régia e caráter consagrado da coroa
  choice: Usar «profanaste a sua coroa» e explicar a nuance em nota
  alternative: Traduzir apenas como derrota política ou interpretar explicitamente em sentido messiânico
  rationale: A combinação de חלל e נזר une humilhação régia e dessacralização. A formulação mantém ambas sem importar uma leitura doutrinária posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de «tu» coerente com a fala direta a Deus. O pretérito perfeito traduz as ações concluídas do hebraico. «Até o chão» comunica a humilhação de forma natural; a nota registra a alternativa mais literal e a nuance cultual.
