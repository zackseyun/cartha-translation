  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: pt
  text: 'Ele clamará a mim[a]: “Tu és meu Pai, meu Deus e a rocha da minha salvação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me chamará”. O verbo hebraico pode significar “chamar” ou “clamar”; neste contexto, pode referir-se à invocação de Deus em oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ele
  rationale: O pronome independente masculino singular é mantido para preservar a ênfase explícita do hebraico.
- source_word: יִקְרָאֵנִי
  choice: me chamará
  rationale: קרא pode significar chamar ou clamar. Com o sufixo de primeira pessoa, “me chamará” reproduz de perto a construção hebraica e permanece natural em português; a possibilidade de clamor dirigido a Deus é registrada em nota.
- source_word: אָבִי
  choice: meu Pai
  rationale: O substantivo com sufixo de primeira pessoa expressa relação direta. A inicial maiúscula sinaliza o uso como forma de tratamento dirigida a Deus, sem acrescentar uma conclusão doutrinária posterior.
- source_word: אָתָּה
  choice: Tu és
  rationale: O pronome independente explícito é preservado, e a cópula implícita é expressa para formar uma declaração natural em português.
- source_word: אֵלִי
  choice: meu Deus
  rationale: No paralelismo com “meu Pai” e “a rocha da minha salvação”, אֵל designa claramente Deus.
- source_word: וְצוּר
  choice: e a rocha
  rationale: Mantém a conjunção e a metáfora literal do hebraico, sem inserir um possessivo que não aparece junto a צוּר.
- source_word: יְשׁוּעָתִי
  choice: da minha salvação
  rationale: Preserva a relação construta com “rocha” e o campo semântico de salvação ou livramento.
theological_decisions:
- issue: Tratamento divino no contexto régio e messiânico
  choice: 'Traduzir diretamente a fala como tratamento dirigido a Deus: “Tu és meu Pai, meu Deus e a rocha da minha salvação.”'
  alternative: Empregar “pai” em minúscula ou interpretar a linguagem apenas como hipérbole régia.
  rationale: O salmo trata do rei davídico e da aliança, mas o versículo apresenta uma invocação direta a Deus em linguagem relacional e pactual. A tradução conserva essa textura sem impor conclusões doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tu” foi mantido por corresponder naturalmente ao pronome enfático em uma fala direta solene; a sintaxe evita arcaísmos. A formulação conserva a ambiguidade lexical de יִקְרָאֵנִי por meio da nota.
