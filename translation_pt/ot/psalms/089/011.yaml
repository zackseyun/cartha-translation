  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: pt
  text: Os céus são teus; a terra também é tua. O mundo e tudo o que nele há — tu os fundaste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: são teus / é tua
  rationale: A preposição לְ com o sufixo de segunda pessoa masculina singular expressa posse. Em português, a construção com cópula e predicativo possessivo é direta e preserva o paralelismo.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural português conserva a forma hebraica e o registro poético elevado, sem restringir o termo ao céu visível.
- source_word: אַף
  choice: também
  rationale: 'Aqui a partícula amplia enfaticamente a afirmação: não apenas os céus, mas também a terra.'
- source_word: אָרֶץ
  choice: a terra
  rationale: O paralelismo com 'os céus' e a menção subsequente ao mundo indicam o sentido cósmico, não uma terra ou território particular.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: O termo designa o mundo ordenado e habitado; 'o mundo' é natural, claro e adequado ao contexto poético.
- source_word: מְלֹאָהּ
  choice: tudo o que nele há
  rationale: Literalmente, 'sua plenitude'. A expressão escolhida comunica de modo natural tudo quanto o mundo contém, sem a possível obscuridade de 'sua plenitude' em português corrente.
- source_word: יְסַדְתָּם
  choice: tu os fundaste
  rationale: O verbo יסד traz a imagem de lançar fundamentos ou estabelecer. 'Fundaste' preserva essa imagem, e o pronome plural reproduz o sufixo masculino plural hebraico, retomando 'o mundo e tudo o que nele há' como conjunto coordenado.
theological_decisions:
- issue: Posse divina e linguagem de criação
  choice: Afirmar que os céus e a terra pertencem a Deus e que ele fundou o mundo e tudo o que nele há.
  alternative: Explicitar a criação a partir do nada ou reduzir a linguagem a mero governo soberano.
  rationale: O hebraico afirma tanto a posse por meio de לְךָ quanto a ação fundadora por meio de יסד. A tradução mantém ambas sem acrescentar formulações teológicas não expressas no versículo.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. O pronome 'tu' foi mantido por corresponder ao tratamento singular direto do hebraico e combinar naturalmente com 'teus/tua' e 'fundaste'. O travessão destaca a conclusão enfática da segunda metade.
