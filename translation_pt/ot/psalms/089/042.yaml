id: PSA.89.42
reference: Psalms 89:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: pt
  text: Tu exaltaste a mão direita dos seus adversários[a]; fizeste todos os seus inimigos se alegrarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ergueste a mão direita dos seus adversários”.'
    reason: Alternativa lexical que representa mais literalmente o sentido de fazer subir ou levantar em הֲרִימוֹתָ.
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: exaltaste
  rationale: O hifil perfeito, segunda pessoa masculina singular, de רום indica fazer subir ou elevar. Com “mão direita” como objeto, “exaltaste” comunica elevação de poder ou vantagem, preservando também a imagem hebraica.
- source_word: יְמִין
  choice: a mão direita
  rationale: O substantivo designa normalmente a mão direita e, neste contexto, simboliza poder ou força. A manutenção da expressão conserva a metáfora do hebraico.
- source_word: צָרָיו
  choice: dos seus adversários
  rationale: O termo צָרָיו indica oponentes hostis. “Adversários” é natural e permite distingui-lo do quase sinônimo אוֹיְבָיו na segunda oração sem exagerar a diferença.
- source_word: הִשְׂמַחְתָּ
  choice: fizeste ... se alegrarem
  rationale: O hifil perfeito de שׂמח tem força causativa. A formulação expressa claramente que Deus fez com que os inimigos se alegrassem.
- source_word: כָּל
  choice: todos
  rationale: Com o substantivo plural seguinte, “todos” transmite naturalmente a abrangência do hebraico.
- source_word: אוֹיְבָיו
  choice: os seus inimigos
  rationale: Este substantivo comum para inimigos é traduzido diretamente. O termo distinto na primeira oração ajuda a refletir os dois quase sinônimos hebraicos.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares de terceira pessoa
  choice: Traduzidos por “seus”, em referência ao rei davídico/ungido no contexto imediato do salmo.
  alternative: Evitar explicitar o referente na tradução.
  rationale: Os sufixos das duas orações são masculinos singulares de terceira pessoa. No contexto de Salmo 89, a lamentação trata da aparente reversão das promessas de Deus ao rei ungido da linhagem de Davi. “Seus” preserva a referência gramatical sem resolver a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo poético e a imagem hebraica da mão direita foram preservados; emprega-se “tu” na fala dirigida a Deus, em continuidade com o discurso direto do salmo.
