  text: וְ֭/חַסְדִּ/י לֹֽא אָפִ֣יר מֵֽ/עִמּ֑/וֹ וְ/לֹֽא אֲ֝שַׁקֵּ֗ר בֶּ/אֱמוּנָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: pt
  text: Mas não lhe retirarei o meu amor leal[a], nem faltarei à minha fidelidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu amor constante”, “meu amor de aliança” ou “minha misericórdia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nem agirei falsamente quanto à minha fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Mas
  rationale: No contexto, a conjunção contrasta a disciplina mencionada antes com a permanência do compromisso divino.
- source_word: חַסְדִּי
  choice: o meu amor leal
  rationale: חֶסֶד expressa amor firme e leal, especialmente no contexto de uma aliança; “amor leal” comunica afeto e compromisso duradouro em português atual.
- source_word: לֹא אָפִיר
  choice: não retirarei
  rationale: O hifil de פור, construído com מֵעִמּוֹ, indica fazer algo afastar-se ou ser retirado; a formulação portuguesa preserva a ideia de não suprimir o favor concedido.
- source_word: מֵעִמּוֹ
  choice: lhe
  rationale: 'O pronome oblíquo em “não lhe retirarei” expressa de modo natural em português a separação indicada por מֵעִם: não retirar dele ou não tirar de junto dele.'
- source_word: וְלֹא אֲשַׁקֵּר
  choice: nem faltarei
  rationale: O piel de שׁקר denota agir com falsidade ou mostrar-se falso. Com “fidelidade”, a expressão idiomática “faltar à” comunica não agir em desacordo com o próprio compromisso, sem reduzir o sentido a uma mentira verbal.
- source_word: בֶּאֱמוּנָתִי
  choice: à minha fidelidade
  rationale: אֱמוּנָה aqui indica constância e confiabilidade. A construção “faltar à minha fidelidade” verte idiomaticamente a relação algo incomum expressa pela preposição ב.
theological_decisions:
- issue: Linguagem da aliança acerca do compromisso de Deus com o rei davídico
  choice: “amor leal” e “fidelidade”
  alternative: “misericórdia” e “verdade”
  rationale: 'A tradução mantém a tensão do contexto: a disciplina divina não implica a retirada do amor comprometido nem a quebra da fidelidade, sem introduzir categorias sistemáticas posteriores.'
- issue: Relação entre a ação divina e sua própria fidelidade na segunda oração
  choice: “nem faltarei à minha fidelidade”
  alternative: “nem agirei falsamente quanto à minha fidelidade”
  rationale: A opção principal é idiomática em português e conserva a afirmação de que Deus não agirá de maneira incompatível com sua fidelidade; a nota registra uma formulação mais próxima da estrutura hebraica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem sintática natural. “Amor leal” preserva a dimensão afetiva e pactual de חֶסֶד; “faltarei à minha fidelidade” evita uma construção excessivamente literal e pouco idiomática, enquanto a nota oferece acesso à forma mais próxima do hebraico.
