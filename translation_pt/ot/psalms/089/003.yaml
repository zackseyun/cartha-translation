base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/003.yaml
  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: pt
  text: “Fiz uma aliança com o meu escolhido[a]; jurei a Davi, meu servo:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cortei uma aliança com o meu escolhido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: Fiz
  rationale: Na expressão idiomática כּרת ברית, o sentido é estabelecer ou fazer uma aliança. “Fiz” comunica isso naturalmente em português; o perfeito hebraico apresenta o ato como realizado e vigente no contexto do juramento.
- source_word: בְּרִית
  choice: uma aliança
  rationale: “Aliança” preserva o peso relacional e teológico de בְּרִית sem reduzi-lo a mero acordo ou tratado.
- source_word: לִבְחִירִי
  choice: com o meu escolhido
  rationale: Depois de “fazer uma aliança”, a preposição ל é expressa idiomaticamente por “com”. “Meu escolhido” preserva a designação pessoal e corresponde naturalmente a בְחִירִי.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: O nifal de שׁבע indica prestar juramento. “Jurei” é direto, solene e natural; o contexto deixa claro o caráter vinculante e duradouro do juramento.
- source_word: לְדָוִד
  choice: a Davi
  rationale: A preposição ל marca aqui o destinatário do juramento; “a Davi” é a construção portuguesa mais direta.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto régio e pactual, עֶבֶד funciona como título de serviço e lealdade a Deus. “Servo” é mais adequado do que “escravo” neste contexto.
theological_decisions:
- issue: Identidade de “meu escolhido”
  choice: Manter a expressão como referência imediata a Davi, conforme o paralelismo do versículo.
  alternative: Explicitar uma identificação messiânica ou tipológica que vá além de Davi.
  rationale: O próprio verso põe “meu escolhido” em paralelo com “Davi, meu servo”. Possíveis implicações messiânicas pertencem à interpretação e não devem ser inseridas na redação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético e os dois-pontos finais, que introduzem o conteúdo do juramento no versículo seguinte.
