base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: pt
  text: Tu esmagaste Raabe como alguém que foi morto[a]; com o teu braço poderoso, dispersaste os teus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raabe é um nome poético que pode se referir ao Egito ou a uma criatura ou potência do caos derrotada por Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: esmagaste
  rationale: O verbo expressa a ação vigorosa de despedaçar ou esmagar; “esmagaste” preserva a força da imagem marcial.
- source_word: כֶחָלָל
  choice: como alguém morto
  rationale: A preposição כ marca comparação, e חָלָל designa com frequência alguém traspassado ou morto em combate. A formulação mantém o símile sem especificar além do hebraico.
- source_word: רָהַב
  choice: Raabe
  rationale: Mantém-se o nome ou título poético, que pode evocar tanto o Egito quanto uma figura ou potência do caos, sem resolver a ambiguidade no texto principal.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: com teu braço poderoso
  rationale: Expressa naturalmente o valor instrumental da frase e conserva a imagem antropomórfica do braço divino como símbolo de poder.
- source_word: פִּזַּרְתָּ
  choice: dispersaste
  rationale: Verte diretamente a ideia de espalhar ou dispersar, sem acrescentar uma nuance militar mais específica do que a forma verbal exige.
- source_word: אוֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Tradução direta e natural do substantivo plural com sufixo possessivo.
theological_decisions:
- issue: Identidade de רָהַב no contexto poético
  choice: Conservar “Raabe” no texto principal como nome poético do adversário vencido.
  alternative: Traduzir por “Egito” ou explicitar uma criatura/potência do caos.
  rationale: O termo pode funcionar como nome poético do Egito e também evocar a imagem de uma criatura ou potência caótica derrotada por Deus. A transliteração preserva essa tensão literária e teológica; a nota apresenta as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com a linguagem poética dos Salmos. A ordem das orações e as imagens do hebraico foram preservadas com fluidez natural.
