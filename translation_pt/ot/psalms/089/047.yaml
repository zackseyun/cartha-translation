  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: pt
  text: Lembra-te de quão breve é a minha vida! Foi para a futilidade que criaste todos os filhos do homem?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a humanidade” ou “todos os seres humanos”. O hebraico diz literalmente “todos os filhos do homem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Para que futilidade criaste todos os filhos do homem?”'
    reason: previous_rendering
lexical_decisions:
- source_word: זְכָר
  choice: Lembra-te
  rationale: Imperativo masculino singular dirigido a Deus; a forma pronominal é natural e digna em português.
- source_word: אֲנִי מֶה חָלֶד
  choice: de como é breve a minha vida
  rationale: A construção hebraica é compacta e difícil; חֶלֶד indica duração ou tempo de vida, e מֶה, no contexto do lamento, comunica sua brevidade. A primeira pessoa é expressa naturalmente pelo possessivo.
- source_word: עַל מַה
  choice: Para que
  rationale: Preserva a nuance de finalidade da pergunta retórica, em vez de reduzi-la simplesmente a uma pergunta causal.
- source_word: שָּׁוְא
  choice: futilidade
  rationale: Expressa vazio, inutilidade ou falta de propósito; é claro em português atual e mantém a força existencial do lamento.
- source_word: בָּרָאתָ
  choice: criaste
  rationale: Perfeito hebraico, segunda pessoa masculina singular, com Deus como sujeito; o pretérito perfeito é idiomático em português.
- source_word: כָל בְּנֵי אָדָם
  choice: todos os filhos do homem
  rationale: Mantém no texto principal o idioma hebraico masculino e coletivo, ao mesmo tempo que uma nota esclarece seu referente humano universal.
theological_decisions:
- issue: Referência humana genérica em בְּנֵי אָדָם
  choice: todos os filhos do homem
  alternative: toda a humanidade / todos os seres humanos
  rationale: A expressão hebraica é masculina e idiomática, mas inclui genericamente os seres humanos; a tradução principal conserva sua forma poética sem limitar o referente aos homens.
- issue: Valor interrogativo de עַל מַה־שָּׁוְא
  choice: Para que futilidade criaste...?
  alternative: Foi para a futilidade que criaste...
  rationale: O contexto favorece uma pergunta retórica dirigida a Deus, mas a sintaxe hebraica também pode ser reproduzida como formulação mais próxima de uma afirmação interrogativa; a nota preserva essa possibilidade de expressão sem resolver excessivamente a tensão.
translation_notes:
  register: Português moderno, poético e acessível, com tratamento reverente por meio de “tu”. “Futilidade” comunica melhor ao leitor comum a ideia de שָׁוְא do que “vaidade”, que hoje pode sugerir sobretudo presunção ou cuidado excessivo com a aparência.
