  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: pt
  text: Os céus louvarão as tuas maravilhas, ó Yahweh, e também a tua fidelidade, na assembleia dos seres santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos santos”; neste contexto, provavelmente se refere a seres celestiais.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: louvarão
  rationale: O hifil de ידה pode significar louvar ou dar graças. Como os céus são o sujeito e as maravilhas de Deus, “louvarão” é a formulação mais natural; o imperfeito recebe aqui valor futuro.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Preserva a forma plural hebraica e o registro poético bíblico.
- source_word: פִּלְאֲךָ
  choice: as tuas maravilhas
  rationale: פלא designa aquilo que é extraordinário ou maravilhoso; o plural em português expressa adequadamente o sentido coletivo das obras admiráveis de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אַף
  choice: sim
  rationale: Expressa de modo natural a força aditiva e enfática da partícula neste paralelismo poético.
- source_word: אֱמוּנָתְךָ
  choice: a tua fidelidade
  rationale: Neste contexto, אֱמוּנָה denota a confiabilidade e constância de Deus.
- source_word: בִּקְהַל
  choice: na assembleia
  rationale: Mantém a imagem concreta de um grupo reunido, própria de קהל.
- source_word: קְדֹשִׁים
  choice: dos santos
  rationale: “Santos” é uma expressão portuguesa clara e digna para seres caracterizados pela santidade; a nota preserva a possível identificação contextual como seres celestiais sem inserir “anjos” no texto.
theological_decisions:
- issue: Referente de קְדֹשִׁים (“santos”)
  choice: Manter a designação ampla “santos”, observando em nota que provavelmente se trata de seres celestiais.
  alternative: Traduzir explicitamente como “anjos” ou entender como pessoas santas.
  rationale: O contexto dos céus e do conselho celestial favorece seres celestiais, mas o termo hebraico não os identifica especificamente como anjos. A tradução conserva essa amplitude sem apagar a orientação do contexto.
translation_notes:
  register: Português moderno, poético e dignificado, com leitura natural no Brasil e compreensão internacional. Emprega “tuas” em concordância com a invocação direta “ó Yahweh” e preserva o paralelismo do hebraico.
