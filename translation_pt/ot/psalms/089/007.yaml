  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: pt
  text: Deus é grandemente temido no conselho[a] dos seres santos[b] e inspira temor acima de todos os que o cercam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assembleia»; o termo hebraico pode indicar um conselho íntimo ou uma reunião deliberativa.
    reason: lexical_alternative
  - marker: b
    text: Os «seres santos» provavelmente se referem aqui a seres celestiais, e não a pessoas santas.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto poético, refere-se ao Deus de Israel; «Deus» é a forma natural e direta em português.
- source_word: נַעֲרָץ ... רַבָּה
  choice: é grandemente temido
  rationale: O particípio nifal, intensificado por רַבָּה, indica que Deus é considerado com profundo temor reverente. A formulação preserva tanto a intensidade quanto o paralelismo do verso.
- source_word: בְּסוֹד
  choice: no conselho
  rationale: סוֹד pode indicar um círculo íntimo ou uma reunião deliberativa. No contexto dos «santos», «conselho» comunica bem o provável cenário celestial sem eliminar a alternativa «assembleia».
- source_word: קְדֹשִׁים
  choice: dos santos
  rationale: A expressão significa literalmente «santos» ou «seres santos». O contexto favorece seres celestiais, mas a forma mais aberta no texto principal preserva a extensão semântica do hebraico; a nota esclarece o referente provável.
- source_word: וְנוֹרָא
  choice: e inspira temor
  rationale: נוֹרָא descreve aquele que causa reverência e temor. «Inspira temor» é natural e dignificado em português, evitando o sentido moderno frequentemente banal de «impressionante».
- source_word: עַל כָּל סְבִיבָיו
  choice: acima de todos os que o cercam
  rationale: A construção expressa a superioridade de Deus em majestade temível sobre os seres ao seu redor, provavelmente seus assistentes celestiais.
theological_decisions:
- issue: Identidade dos «santos» e dos que cercam Deus
  choice: Manter «santos» no texto e indicar em nota que provavelmente são seres celestiais do conselho divino.
  alternative: Entender a expressão como santos humanos ou como uma assembleia mista de adoradores.
  rationale: O contexto próximo do Salmo 89 fala dos céus e de uma assembleia celestial. Ainda assim, o hebraico não explicita «anjos»; por isso, o texto principal preserva a expressão mais ampla.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. «Inspira temor» conserva a solenidade sem recorrer a «terrível», que poderia sugerir maldade ou qualidade negativa. Os marcadores aparecem no texto na ordem [a], [b].
