source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: pt
  text: Tu governas a agitação do mar[a]; quando suas ondas se levantam, tu as acalmas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a soberba” ou “a majestade do mar”. O termo hebraico pode indicar exaltação, majestade ou a elevação impetuosa das águas.
    reason: lexical_alternative
  - marker: b
    text: Ou “tu as aquietas” ou “tu as subjugas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: governas
  rationale: O particípio expressa domínio contínuo. “Governas” é natural e mantém a ideia de autoridade soberana exercida sobre o mar.
- source_word: בְּגֵאוּת
  choice: a agitação
  rationale: גֵּאוּת pode indicar exaltação, majestade ou elevação; em relação ao mar, “agitação” comunica de modo concreto seu movimento impetuoso, sem excluir em nota as alternativas lexicais.
- source_word: הַיָּם
  choice: do mar
  rationale: “Mar” é o equivalente português comum e adequado ao registro poético de יָם.
- source_word: בְּשׂוֹא
  choice: quando ... se levantam
  rationale: O infinitivo construto apresenta a circunstância em que as ondas se erguem; a oração temporal é clara e fiel em português.
- source_word: גַלָּיו
  choice: suas ondas
  rationale: O sufixo retoma “mar”; “suas ondas” reproduz naturalmente essa relação em português.
- source_word: תְשַׁבְּחֵם
  choice: tu as acalmas
  rationale: No piel, שׁבח neste contexto significa aquietar ou subjugar águas turbulentas. “Acalmas” é corrente, vívido e preserva a imagem poética.
theological_decisions:
- issue: A soberania divina sobre as águas caóticas
  choice: Afirmação direta de que Deus governa o mar e acalma suas ondas.
  alternative: Alusão mitopoética à vitória de Deus sobre o caos cósmico.
  rationale: O versículo apresenta concretamente o domínio de Deus sobre o mar. A tradução conserva essa imagem sem introduzir no texto principal uma estrutura mitológica mais ampla que permanece interpretativa.
translation_notes:
  register: Português moderno, poético e acessível, com tratamento direto por “tu” para acompanhar a segunda pessoa singular hebraica. A formulação preserva o paralelismo e a imagem do mar revolto sob o governo divino.
