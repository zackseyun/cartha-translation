  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: pt
  text: As obras das suas mãos são verdade e justiça[a]; todos os seus preceitos são dignos de confiança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fidelidade e justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas as suas instruções são confiáveis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: obras
  rationale: O plural construto designa aquilo que Deus faz; “obras” é natural no registro poético e preserva a formulação tradicional sem perder clareza.
- source_word: יָדָיו
  choice: das suas mãos
  rationale: Mantém a imagem hebraica das mãos como expressão da ação e do poder de Deus.
- source_word: אֱמֶת
  choice: verdade
  rationale: Preserva o campo semântico de verdade, firmeza e confiabilidade, bem como o paralelismo nominal com “justiça”; “fidelidade” permanece uma alternativa legítima.
- source_word: וּמִשְׁפָּט
  choice: e justiça
  rationale: Neste par de qualidades, “justiça” é mais idiomático do que “julgamento” e expressa adequadamente o caráter justo das obras de Deus.
- source_word: נֶאֱמָנִים
  choice: são dignos de confiança
  rationale: Expressa de modo corrente a firmeza e confiabilidade dos preceitos, concordando no plural com eles.
- source_word: כָּל
  choice: todos
  rationale: Reproduz sem atenuação o quantificador universal hebraico.
- source_word: פִּקּוּדָיו
  choice: os seus preceitos
  rationale: “Preceitos” conserva a força normativa e ético-legal do termo recorrente nos Salmos, sem reduzi-lo à noção mais geral de instruções.
theological_decisions:
- issue: Sentido de אֱמֶת ao caracterizar as obras de Deus
  choice: verdade
  alternative: fidelidade; confiabilidade
  rationale: “Verdade” preserva a forma lexical e o equilíbrio poético com “justiça”, enquanto o segundo hemistíquio já explicita a confiabilidade por meio de נֶאֱמָנִים. A nota mantém a alternativa genuína “fidelidade”.
- issue: Grau de especificidade de פִּקּוּדָיו
  choice: os seus preceitos
  alternative: as suas instruções; os seus estatutos
  rationale: “Preceitos” retém melhor a dimensão normativa do hebraico. A alternativa mais ampla “instruções” é registrada em nota para não ocultar a extensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe paralela e a imagem concreta das “mãos” foram preservadas; “dignos de confiança” evita a possível ambiguidade moderna de “fiéis” aplicado a preceitos.
