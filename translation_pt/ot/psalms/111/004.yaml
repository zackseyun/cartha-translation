source:
  edition: WLC
  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: pt
  text: Ele fez com que suas maravilhas fossem lembradas[a]; Yahweh é bondoso e compassivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele fez um memorial de suas maravilhas”.'
    reason: Alternativa lexical que preserva o sentido concreto possível de זֵכֶר como “memorial”.
lexical_decisions:
- source_word: זֵכֶר
  choice: fossem lembradas
  rationale: O substantivo pode significar “lembrança” ou “memorial”. Com עָשָׂה e לְנִפְלְאֹתָיו, a formulação verbal comunica naturalmente que Yahweh assegurou a recordação duradoura de seus atos, sem eliminar a alternativa concreta “memorial”.
- source_word: עָשָׂה
  choice: fez que
  rationale: Embora o verbo signifique literalmente “fez”, nesta construção “fez que ... fossem lembradas” expressa em português o valor efetivo da locução hebraica.
- source_word: לְנִפְלְאֹתָיו
  choice: suas maravilhas
  rationale: נִפְלָאוֹת designa os atos extraordinários de Deus. “Maravilhas” é corrente, digna e suficientemente concreta no contexto poético.
- source_word: חַנּוּן
  choice: bondoso
  rationale: O adjetivo descreve a disposição favorável e generosa de Deus. “Bondoso” é claro em português moderno e se distingue de “compassivo”; “cheio de graça” seria menos natural neste predicado.
- source_word: וְרַחוּם
  choice: e compassivo
  rationale: רַחוּם denota misericórdia e profunda compaixão. “Compassivo” preserva essa nuance afetiva e forma um par natural com “bondoso”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sujeito de עָשָׂה
  choice: Yahweh é entendido como sujeito da primeira oração, expresso pelo pronome “Ele”
  alternative: 'Leitura impessoal: “Fez-se um memorial de suas maravilhas”'
  rationale: O verbo está na terceira pessoa masculina singular, e o nome Yahweh, apresentado ao fim do verso, identifica naturalmente o sujeito no paralelismo poético. O pronome em português torna essa continuidade clara sem acrescentar outro agente.
- issue: Sentido de זֵכֶר עָשָׂה
  choice: “fez que suas maravilhas fossem lembradas”
  alternative: “fez um memorial de suas maravilhas”
  rationale: A construção admite tanto o resultado de produzir recordação quanto a noção concreta de estabelecer um memorial. O texto principal usa a formulação mais natural em português, e a nota conserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das orações acompanha o hebraico; o ponto e vírgula preserva a estreita relação poética entre o ato de Yahweh e seu caráter.
