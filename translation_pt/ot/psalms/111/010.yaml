id: PSA.111.10
reference: Psalms 111:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: pt
  text: O temor de Yahweh é o princípio da sabedoria; todos os que os põem em prática têm bom entendimento.[a] Seu louvor permanece para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “bom entendimento para todos os que os fazem”. O objeto plural fica implícito no hebraico e pode se referir aos preceitos de Yahweh mencionados anteriormente no salmo ou às ações que expressam o temor a ele.
    reason: ambiguity
  - marker: b
    text: 'Ou: “Seu louvor subsiste para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: princípio
  rationale: Expressa o ponto inicial ou fundamento da sabedoria sem restringir o termo a uma sequência meramente temporal.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente usual no contexto sapiencial e abrange discernimento moral e vida habilidosa.
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Mantém a força de יִרְאָה, que inclui reverência, assombro e temor, e translitera o nome divino יְהוָה como Yahweh.
- source_word: שֵׂכֶל טוֹב
  choice: bom entendimento
  rationale: Conserva tanto o aspecto cognitivo e moral de שֵׂכֶל quanto a avaliação ampla expressa por טוֹב.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: todos os que os põem em prática
  rationale: Preserva o sufixo masculino plural sem impor no texto um antecedente que o hebraico deixa implícito; 'põem em prática' comunica naturalmente a ideia de fazer ou cumprir.
- source_word: תְּהִלָּתוֹ
  choice: Seu louvor
  rationale: O sufixo masculino singular remete mais naturalmente a Yahweh, mantendo aberta a nuance entre o louvor que lhe é dado e sua fama ou dignidade de louvor.
- source_word: עֹמֶדֶת לָעַד
  choice: permanece para sempre
  rationale: Reproduz de modo natural a ideia idiomática de duração permanente contida no verbo 'estar firme, permanecer'.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de יִרְאַת em relação a Yahweh
  choice: temor
  alternative: reverência
  rationale: Embora inclua reverência, o termo hebraico é mais forte do que simples respeito; 'temor' conserva a tensão e a ressonância da fórmula sapiencial.
- issue: Referente do objeto plural em עֹשֵׂיהֶם
  choice: 'manter o plural implícito: ''os põem em prática'''
  alternative: singularizar como 'o põem em prática', referindo-se ao temor de Yahweh
  rationale: O hebraico apresenta explicitamente um sufixo plural, embora seu antecedente não apareça neste versículo. A tradução não resolve silenciosamente essa dificuldade em favor do referente singular.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura sapiencial concisa. Conservou-se o pronome objeto plural, apesar de seu antecedente implícito, para não apagar uma ambiguidade real do hebraico.
