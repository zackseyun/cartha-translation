  text: הוֹד וְ/הָדָ֥ר פָּֽעֳל֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: pt
  text: Esplendor e majestade são a sua obra, e a sua justiça permanece para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua retidão permanece para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: esplendor
  rationale: O termo denota esplendor, glória ou honra. “Esplendor” preserva a ideia de magnificência radiante e forma um par poético natural com “majestade”.
- source_word: הָדָר
  choice: majestade
  rationale: No paralelismo poético com הוֹד, indica magnificência imponente ou majestade. A escolha mantém o tom elevado sem fundir os dois quase sinônimos.
- source_word: פָּעֳלוֹ
  choice: a sua obra
  rationale: O substantivo singular pode significar obra, feito ou atividade. “A sua obra” reproduz o singular hebraico e pode ter sentido coletivo em português.
- source_word: צִדְקָתוֹ
  choice: a sua justiça
  rationale: O termo abrange tanto justiça quanto retidão. Neste contexto, “justiça” é natural em português e expressa a qualidade moral de Deus, sem excluir a noção mais ampla de retidão, registrada em nota.
- source_word: עֹמֶדֶת
  choice: permanece
  rationale: Embora o particípio de עמד tenha a imagem literal de estar de pé, aqui comunica continuidade. “Permanece” é idiomático em português e preserva esse sentido duradouro.
- source_word: לָעַד
  choice: para sempre
  rationale: A expressão indica duração perpétua; “para sempre” é a formulação portuguesa clara e corrente.
theological_decisions:
- issue: Sentido de צִדְקָתוֹ ao descrever a qualidade duradoura de Deus
  choice: a sua justiça
  alternative: a sua retidão
  rationale: O hebraico permite ambos os sentidos. “Justiça” funciona naturalmente no louvor às obras e ao caráter moral de Deus, enquanto “retidão” explicita a dimensão ética mais ampla e é preservada como alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O par “esplendor e majestade” conserva a elevação poética; “permanece” evita uma tradução excessivamente literal do particípio hebraico.
