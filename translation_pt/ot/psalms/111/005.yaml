  text: טֶ֭רֶף נָתַ֣ן לִֽ/ירֵאָ֑י/ו יִזְכֹּ֖ר לְ/עוֹלָ֣ם בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/005.yaml
  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: pt
  text: Deu alimento aos que o temem[a]; para sempre se lembrará de sua aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presa”; o termo hebraico pode indicar alimento obtido como presa, mas aqui provavelmente significa alimento ou provisão em sentido geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: alimento
  rationale: O substantivo pode significar “presa” ou alimento obtido como presa. Neste contexto, que celebra a bondade providencial de Deus, “alimento” comunica naturalmente o sentido concreto sem introduzir uma imagem predatória indevida.
- source_word: נָתַן
  choice: deu
  rationale: O perfeito hebraico apresenta a ação como realizada. O pretérito perfeito é direto e natural em português e preserva a forma poética concisa.
- source_word: לִירֵאָיו
  choice: aos que o temem
  rationale: Expressa de modo idiomático as pessoas caracterizadas pelo temor reverente a Deus, sem atenuar o peso de ירא.
- source_word: יִזְכֹּר
  choice: se lembrará
  rationale: O imperfeito admite valor futuro, reforçado por “para sempre”. Mantém-se o verbo bíblico “lembrar”, que no contexto da aliança implica agir em conformidade com ela.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a forma portuguesa moderna e natural para duração contínua ou perpétua neste contexto de fidelidade à aliança.
- source_word: בְּרִיתוֹ
  choice: sua aliança
  rationale: “Aliança” é o equivalente consagrado e semanticamente apropriado para בְּרִית no âmbito dos compromissos de Deus.
theological_decisions:
- issue: Sentido de Deus “lembrar-se” da aliança
  choice: “se lembrará de sua aliança”, com a ideia bíblica de fidelidade manifestada em ação
  alternative: “se lembra de sua aliança”, como presente habitual ou atemporal
  rationale: 'A tradução conserva o idioma hebraico e sua tensão: não reduz “lembrar” a mera recordação mental nem o substitui interpretativamente por “cumprir” ou “ser fiel”. O futuro preserva a força possível do imperfeito junto de “para sempre”.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A inversão “para sempre se lembrará” mantém o destaque poético de “para sempre” e evita a possível leitura de que “sua aliança para sempre” seja uma única unidade nominal.
