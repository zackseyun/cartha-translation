base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: pt
  text: Louvem a Yah![a] Darei graças a Yahweh de todo o coração, no conselho dos íntegros[b] e na congregação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Aleluia” ou “Louvem o SENHOR”. O texto diz literalmente “Louvem Yah”, empregando a forma abreviada do nome divino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na assembleia dos íntegros”. A palavra hebraica pode designar um conselho, um círculo íntimo ou um grupo reunido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: Louvem a Yah!
  rationale: O imperativo plural seguido da forma abreviada do nome divino funciona como aclamação inicial. A tradução explicita o sentido e preserva a distinção entre יָהּ e יְהוָה no mesmo versículo.
- source_word: אוֹדֶ֣ה
  choice: Darei graças
  rationale: O hifil de ידה, neste contexto de culto, expressa ação de graças e também conserva a nuance volitiva ou promissiva da forma hebraica.
- source_word: יְ֭הוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue tanto de um título quanto da forma abreviada Yah usada na abertura.
- source_word: בְּ/כָל לֵבָ֑ב
  choice: de todo o coração
  rationale: Expressão portuguesa natural para dedicação interior completa; o possessivo pode permanecer implícito, como no hebraico.
- source_word: בְּ/ס֖וֹד
  choice: no conselho
  rationale: סוֹד pode indicar conselho, círculo íntimo ou grupo reunido. “Conselho” preserva sua distinção lexical em relação a עֵדָה.
- source_word: יְשָׁרִ֣ים
  choice: dos íntegros
  rationale: Designa pessoas moralmente retas. “Íntegros” é corrente, claro e dignificado em português.
- source_word: וְ/עֵדָֽה
  choice: e na congregação
  rationale: עֵדָה indica a comunidade reunida. “Congregação” convém ao contexto de culto e mantém a distinção em relação a “conselho”.
theological_decisions:
- issue: Representação de יָהּ e יְהוָה no mesmo versículo
  choice: Traduzir יָהּ como “Yah” e transliterar יְהוָה como “Yahweh”
  alternative: Empregar “Aleluia” na primeira ocorrência e “SENHOR” na segunda, ou traduzir ambas por “SENHOR”
  rationale: O hebraico usa duas formas distintas do nome divino. Mantê-las torna essa diferença visível sem substituir o nome por um título.
- issue: Relação entre סוֹד e עֵדָה
  choice: 'Manter dois termos: “conselho” e “congregação”'
  alternative: Traduzir ambos como “assembleia”
  rationale: Embora os campos semânticos possam se sobrepor, o paralelismo emprega palavras diferentes. A tradução conserva essa tensão e evita nivelá-las.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “Louvem” dirige a aclamação à comunidade; “Darei graças” mantém a voz pessoal do salmista. A redação é dignificada sem arcaísmos e preserva a distinção entre os nomes divinos e entre os dois termos de reunião.
