id: PSA.111.9
reference: Psalms 111:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: pt
  text: Ele enviou redenção ao seu povo; ordenou para sempre a sua aliança[b]. Santo e temível é o seu nome[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inspirador de temor”. O hebraico expressa tanto reverência quanto assombro diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “estabeleceu para sempre a sua aliança”.
    reason: interpretive_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: redenção
  rationale: O substantivo indica libertação ou resgate realizado por intervenção; “redenção” preserva a amplitude do termo e seu peso no contexto de louvor.
- source_word: שָׁלַח
  choice: enviou
  rationale: Mantém o sentido direto do verbo e a imagem concreta de Deus fazendo chegar a redenção ao seu povo.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: A preposição לְ marca naturalmente o destinatário; “ao seu povo” é direto e idiomático em português.
- source_word: צִוָּה
  choice: ordenou
  rationale: Preserva a força lexical de mandar, decretar ou dispor com autoridade, sem substituí-la silenciosamente pela interpretação “estabeleceu”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa de modo natural a duração permanente ou indefinidamente contínua indicada pelo hebraico.
- source_word: בְּרִיתוֹ
  choice: a sua aliança
  rationale: “Aliança” é o equivalente bíblico corrente e conserva as dimensões relacional e compromissiva de בְּרִית.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: É o equivalente consagrado e exato quando o termo é predicado do nome de Deus.
- source_word: וְנוֹרָא
  choice: e temível
  rationale: “Temível” comunica que o nome de Deus inspira temor reverente, sem reduzir o termo a mera admiração; a nota registra outra formulação possível.
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: Conserva a linguagem hebraica, na qual o nome representa o caráter revelado e a reputação de Deus.
theological_decisions:
- issue: Força de צִוָּה em relação à aliança
  choice: ordenou para sempre a sua aliança
  alternative: estabeleceu para sempre a sua aliança
  rationale: A tradução principal mantém o sentido explícito de ordem ou decreto autoritativo. A alternativa torna mais claro o resultado dessa ação, mas é um pouco mais interpretativa.
- issue: Sentido de וְנוֹרָא aplicado ao nome de Deus
  choice: temível
  alternative: inspirador de temor
  rationale: “Temível” preserva tanto a majestade quanto o temor reverente provocado pela santidade divina, evitando o sentido enfraquecido que “impressionante” pode ter no uso cotidiano.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem predicativa “Santo e temível é o seu nome” conserva a ênfase poética do hebraico. A formulação menos comum “ordenou... a sua aliança” foi mantida por fidelidade lexical, com alternativa natural na nota.
