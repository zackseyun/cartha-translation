source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: pt
  text: Ele revelou ao seu povo o poder de suas obras[a], dando-lhes a herança das nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele revelou ao seu povo o poder de suas obras, para dar-lhes a herança das nações”. O infinitivo hebraico pode indicar finalidade, em vez de meio ou resultado.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: poder
  rationale: Expressa força ou poder e, neste contexto, aponta para a potência manifesta nos atos de Deus.
- source_word: מַעֲשָׂיו
  choice: suas obras
  rationale: Preserva o sentido amplo de atos ou feitos e mantém o registro poético e digno do salmo.
- source_word: הִגִּיד
  choice: revelou
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer; “revelou” comunica naturalmente que Deus tornou conhecido o seu poder.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: A preposição marca o destinatário da revelação.
- source_word: לָתֵת
  choice: dando-lhes
  rationale: 'O gerúndio expressa com naturalidade a provável relação de meio ou manifestação: Deus mostrou seu poder ao conceder a herança, sem apagar a alternativa de finalidade registrada em nota.'
- source_word: לָהֶם
  choice: -lhes
  rationale: Retoma explicitamente “seu povo” de maneira concisa e idiomática em português.
- source_word: נַחֲלַת
  choice: a herança
  rationale: Mantém a ideia de herança, propriedade ou território recebido por concessão, adequada ao contexto da terra.
- source_word: גּוֹיִם
  choice: das nações
  rationale: Refere-se às nações estrangeiras cuja terra foi dada ao povo; evita a conotação neotestamentária mais específica de “gentios”.
theological_decisions:
- issue: Relação da oração infinitiva לָתֵת לָהֶם נַחֲלַת גּוֹיִם com a oração principal
  choice: 'Nuance instrumental ou de manifestação: Deus revelou o poder de suas obras dando-lhes a herança das nações.'
  alternative: 'Nuance de finalidade: Deus revelou ao seu povo o poder de suas obras para dar-lhes a herança das nações.'
  rationale: O infinitivo hebraico com ל pode indicar finalidade, resultado ou meio. O contexto favorece entender a concessão da terra como demonstração do poder divino, mas a ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Revelou” é natural sem perder o sentido declarativo; “dando-lhes” mantém a frase fluente, enquanto a nota preserva a ambiguidade sintática do hebraico.
