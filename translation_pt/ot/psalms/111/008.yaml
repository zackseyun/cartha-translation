  text: סְמוּכִ֣ים לָ/עַ֣ד לְ/עוֹלָ֑ם עֲ֝שׂוּיִ֗ם בֶּ/אֱמֶ֥ת וְ/יָשָֽׁר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/008.yaml
  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: pt
  text: Estão firmados para todo o sempre[a], feitos em verdade[b] e retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sustentados para todo o sempre”; o particípio hebraico pode enfatizar que são apoiados ou mantidos firmes.
    reason: lexical_alternative
  - marker: b
    text: “Em verdade” também pode ser traduzido por “em fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: firmados
  rationale: O particípio passivo de סמך expressa aquilo que é sustentado ou tornado firme. “Firmados” conserva a forma passiva e comunica a estabilidade duradoura dos preceitos de Deus.
- source_word: לָעַד לְעוֹלָם
  choice: para todo o sempre
  rationale: Os dois termos temporais se reforçam mutuamente. A expressão portuguesa é natural e preserva a ênfase hebraica na permanência.
- source_word: עֲשׂוּיִם
  choice: feitos
  rationale: O particípio passivo de עשה significa literalmente “feitos”. A escolha evita especificar indevidamente se os preceitos foram formulados, executados ou constituídos.
- source_word: בֶּאֱמֶת
  choice: com verdade
  rationale: אֱמֶת pode indicar verdade, confiabilidade ou fidelidade. “Com verdade” mantém o núcleo lexical e deixa a alternativa contextual explícita em nota.
- source_word: וְיָשָׁר
  choice: e retidão
  rationale: 'Embora יָשָׁר seja formalmente adjetival, aqui funciona em paralelo com אֱמֶת. “Retidão” produz em português uma coordenação clara e natural: “com verdade e retidão”.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção concisa que acompanha o paralelismo hebraico. “Firmados” preserva a voz passiva; “para todo o sempre” reproduz idiomaticamente a intensificação temporal.
