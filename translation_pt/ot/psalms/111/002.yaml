lexical_decisions:
- source_word: גְּדֹלִים
  choice: Grandes
  rationale: Preserva de modo direto o predicativo enfático colocado no início do verso.
- source_word: מַעֲשֵׂי
  choice: obras
  rationale: Equivalente natural e abrangente para os feitos e ações do SENHOR.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino com SENHOR em versaletes/maiúsculas.
- source_word: דְּרוּשִׁים
  choice: estudadas
  rationale: O particípio passivo de דרש pode expressar aquilo que é buscado, investigado ou examinado; “estudadas” comunica aqui a atenção diligente dedicada às obras divinas.
- source_word: לְכָל חֶפְצֵיהֶם
  choice: por todos os que nelas têm prazer
  rationale: Entende o sufixo plural como referência às obras e verte חפץ pelo prazer ou deleite que motiva seu estudo.
theological_decisions:
- issue: Referente do sufixo em חֶפְצֵיהֶם
  choice: “nelas”, referindo-se às obras do SENHOR
  alternative: “em tudo o que desejam” ou “para todos os seus propósitos”
  rationale: A leitura contextual e tradicional liga o deleite às obras mencionadas na primeira linha, embora a forma hebraica permita alguma discussão sintática.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Têm prazer” é amplamente compreensível no português brasileiro e internacional; “estudadas” conserva a ideia de investigação atenta.
