source:
  edition: WLC
  text: נִשְׁמְט֣וּ בִֽ/ידֵי סֶ֭לַע שֹׁפְטֵי/הֶ֑ם וְ/שָׁמְע֥וּ אֲ֝מָרַ֗/י כִּ֣י נָעֵֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: pt
  text: Seus juízes são lançados pelas encostas do rochedo[a], e eles ouvem as minhas palavras, pois são agradáveis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelos lados do penhasco”. A expressão hebraica é difícil; tradicionalmente também tem sido entendida de modo mais literal como “nas mãos do rochedo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “doces” ou “encantadoras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: são lançados
  rationale: O nifal de שׁמט expressa ser solto, derrubado ou lançado. O presente poético mantém a vivacidade e evita fixar indevidamente uma referência temporal discutível.
- source_word: בִידֵי סֶלַע
  choice: pelas encostas do rochedo
  rationale: A expressão hebraica é difícil. A formulação espacial comunica de modo natural a provável imagem topográfica, sem ocultar em nota a leitura mais literal.
- source_word: שֹׁפְטֵיהֶם
  choice: seus juízes
  rationale: O particípio de שׁפט designa diretamente aqueles que julgam, embora por extensão também possa significar governantes.
- source_word: וְשָׁמְעוּ
  choice: e eles ouvem
  rationale: O qatal na poesia hebraica admite força presente, passada ou futura conforme o contexto. O presente preserva a vivacidade e a abertura temporal do verso.
- source_word: אֲמָרַי
  choice: as minhas palavras
  rationale: Tradução direta e natural do substantivo plural com sufixo de primeira pessoa.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a explicação para a acolhida das palavras.
- source_word: נָעֵמוּ
  choice: são agradáveis
  rationale: O verbo נעם exprime agrado, deleite ou doçura; “agradáveis” preserva o sentido sem intensificá-lo.
theological_decisions:
- issue: Interpretação da expressão difícil בידי סלע
  choice: 'leitura espacial: “pelas encostas do rochedo”'
  alternative: 'leitura mais literal: “nas mãos do rochedo”; também “pelos lados do penhasco”'
  rationale: A sintaxe e a imagem são incertas. O texto principal adota a leitura topográfica provável, enquanto a nota conserva a alternativa literal sem impor uma interpretação teológica.
- issue: Valor temporal de וְשָׁמְעוּ
  choice: 'presente poético: “e eles ouvem”'
  alternative: 'passado: “e eles ouviram”; futuro: “e eles ouvirão”'
  rationale: A forma verbal hebraica em poesia não determina aqui de modo inequívoco um único tempo português. O presente oferece uma leitura natural sem resolver excessivamente a sequência temporal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Rochedo” preserva a imagem de סֶלַע e combina naturalmente com “encostas”. Os marcadores de todas as notas aparecem no texto principal.
