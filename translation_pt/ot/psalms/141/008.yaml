base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: pt
  text: Pois os meus olhos estão voltados para ti, ó Yahweh, meu Senhor; em ti me refugio. Não derrames[a] a minha vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser entendido como “deixar exposto” ou “deixar indefeso”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “alma”, “pessoa” ou “eu”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou fundamentadora da conjunção em relação à súplica do contexto anterior, com fluência natural em português.
- source_word: אֵלֶיךָ ... עֵינַי
  choice: os meus olhos estão voltados para ti
  rationale: Preserva a imagem hebraica dos olhos dirigidos a Deus, expressão de atenção, esperança e dependência.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue do título אֲדֹנָי que vem em seguida.
- source_word: אֲדֹנָי
  choice: meu Senhor
  rationale: Representa o título de senhorio e conserva o valor possessivo da forma no contexto da invocação.
- source_word: בְּךָ חָסִיתִי
  choice: em ti me refugio
  rationale: Expressa em português corrente a confiança contínua confessada pelo perfeito hebraico no contexto da oração.
- source_word: תְּעַר
  choice: derrames
  rationale: Conserva o sentido direto de esvaziar ou verter, sem ocultar que o verbo também pode sugerir deixar exposto ou desamparado.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste pedido de preservação, נֶפֶשׁ se refere naturalmente à vida ou à própria pessoa; 'vida' evita restringir o termo à ideia posterior de uma alma imaterial.
theological_decisions:
- issue: A dupla invocação יְהֹוָה אֲדֹנָי
  choice: ó Yahweh, meu Senhor
  alternative: ó SENHOR Deus; ó Senhor SOBERANO
  rationale: Mantém distintos o nome próprio divino e o título de senhorio, inclusive sua nuance pessoal, sem fundi-los numa fórmula tradicional.
- issue: O sentido de נֶפֶשׁ na súplica por livramento
  choice: minha vida
  alternative: minha alma; a mim mesmo
  rationale: O contexto aponta para a vida ou pessoa ameaçada. A escolha preserva o sentido antropológico amplo do hebraico sem impor uma dicotomia entre corpo e alma.
- issue: A imagem final formada por תְּעַר נַפְשִׁי
  choice: Não derrames a minha vida
  alternative: Não me deixes exposto; não me deixes indefeso
  rationale: A tradução principal conserva a imagem concreta e lexicalmente direta do verbo, enquanto a nota registra a possível extensão contextual para abandono ou exposição ao perigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. O paralelismo e as imagens hebraicas são preservados sem rigidez excessiva; a segunda frase mantém a súplica incisiva do original.
