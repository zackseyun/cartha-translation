base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: pt
  text: Que um justo me golpeie — isso é uma bondade[a]; que ele me repreenda — isso é óleo para a cabeça. Que a minha cabeça não o recuse[b]. Pois ainda a minha oração é contra as maldades deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que um justo me golpeie com amor leal”, caso חֶסֶד seja entendido mais fortemente como lealdade, misericórdia ou amor fiel.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico é difícil. A frase também pode ser entendida como “que a minha cabeça não o rejeite” ou “não se esquive dele”.
    reason: lexical_alternative
  - marker: c
    text: 'A oração final é incerta. Também pode significar: “pois ainda a minha oração é durante as calamidades deles” ou “pois mesmo então oro por eles em suas aflições”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: Que ... me golpeie
  rationale: O verbo הלם indica um golpe forte. “Golpeie” conserva a metáfora concreta, enquanto a construção com “que” expressa naturalmente o valor volitivo em português.
- source_word: צַדִּיק
  choice: um justo
  rationale: O adjetivo masculino singular está substantivado e designa representativamente um homem justo; “um justo” é natural, conciso e mantém a forma gramatical.
- source_word: חֶסֶד
  choice: isso é bondade
  rationale: Neste contexto, חֶסֶד caracteriza o golpe corretivo como ato benevolente. “Bondade” preserva a amplitude lexical, incluindo a possível nuance de amor leal indicada em nota.
- source_word: וְיוֹכִיחֵנִי
  choice: que ele me repreenda
  rationale: O hifil de יכח expressa repreensão ou correção; “repreenda” mantém a força moral do verbo.
- source_word: שֶׁמֶן רֹאשׁ
  choice: óleo para a cabeça
  rationale: Mantém a imagem hebraica sem especificar indevidamente uma unção cerimonial.
- source_word: אַל יָנִי רֹאשִׁי
  choice: Que a minha cabeça não o recuse
  rationale: A forma verbal e a construção são difíceis. Esta tradução conserva “minha cabeça” como sujeito e entende o óleo corretivo como aquilo que não deve ser recusado.
- source_word: כִּי עוֹד
  choice: Pois ainda
  rationale: Reproduz de modo conciso a relação explicativa ou continuativa da expressão.
- source_word: וּתְפִלָּתִי
  choice: a minha oração
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa; o waw é acomodado pela sintaxe portuguesa.
- source_word: בְּרָעוֹתֵיהֶם
  choice: contra as maldades deles
  rationale: A preposição בְּ é sintaticamente ambígua. No contexto, a leitura adversativa relaciona a oração do salmista às más ações dos ímpios; as alternativas permanecem registradas em nota.
theological_decisions:
- issue: Representação do masculino singular צַדִּיק
  choice: um justo
  alternative: uma pessoa justa; os justos
  rationale: A tradução mantém o masculino singular representativo do hebraico sem ampliar o número nem neutralizar a forma.
- issue: Sentido da oração final difícil
  choice: Pois ainda a minha oração é contra as maldades deles
  alternative: Pois ainda a minha oração é durante as calamidades deles; pois mesmo então oro por eles em suas aflições
  rationale: A construção hebraica permite mais de uma relação para בְּ e mais de um entendimento de רָעוֹת. A leitura principal se ajusta ao contraste contextual com as obras dos ímpios, mas a incerteza genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura poética e as imagens concretas do hebraico foram mantidas; as incertezas textuais e sintáticas foram explicitadas sem resolver silenciosamente a ambiguidade.
