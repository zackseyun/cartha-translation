base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: pt
  text: 'Salmo de Davi.


    SENHOR[a], eu clamo a ti; apressa-te a vir a mim. Dá ouvidos à minha voz quando clamo a ti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”; alternativamente, “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Salmo de Davi
  rationale: Reproduz de modo natural o título hebraico, preservando a relação ampla expressa por לְ, tradicionalmente entendida como autoria ou associação.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a tradição portuguesa de representar o nome divino YHWH por SENHOR em versaletes, com nota que explicita o hebraico e a alternativa 'Yahweh'.
- source_word: חוּשָׁה לִּי
  choice: vem depressa me socorrer
  rationale: A expressão pede ação urgente em favor do salmista; esta formulação comunica naturalmente tanto a pressa quanto a orientação benefativa de לִי.
- source_word: הַאֲזִינָה קוֹלִי
  choice: Escuta a minha voz
  rationale: Expressa em português atual o pedido enfático de prestar atenção à voz do orante.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR, com nota textual
  alternative: Yahweh
  rationale: Mantém uma convenção bíblica amplamente reconhecida em português sem ocultar a forma do nome presente no texto hebraico.
- issue: Sentido de חוּשָׁה לִּי
  choice: vem depressa me socorrer
  alternative: apressa-te para mim
  rationale: A tradução escolhida torna explícito, sem acréscimo doutrinário, o sentido contextual de uma intervenção urgente em favor do suplicante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo da súplica foi preservado, e a repetição de “clamo a ti” reflete a repetição do hebraico.
