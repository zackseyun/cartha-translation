translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência poética. Evitou-se acrescentar «em segurança», pois isso é inferido do contraste, não declarado no hebraico; as ambiguidades do possessivo e de עַד foram preservadas em notas.
