translation:
  language: pt
  text: Que os perversos caiam todos juntos nas próprias redes[a], até que eu passe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «nas redes dele». O substantivo «redes» está no plural, mas o possessivo está no singular e pode ter sentido distributivo: cada perverso cai nas redes que ele mesmo armou.'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: «até que eu passe» ou «até que eu atravesse». Outra tradução possível: «Que os perversos caiam, todos juntos, nas próprias redes; quanto a mim, que eu passe adiante».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: Caiam
  rationale: O imperfeito qal, no contexto de súplica, tem força volitiva; o subjuntivo português expressa naturalmente o desejo ou pedido do salmista.
- source_word: בְמַכְמֹרָיו
  choice: nas próprias redes
  rationale: מַכְמֹר significa rede ou armadilha, e a forma aqui é plural com sufixo de terceira pessoa masculina singular, literalmente «nas redes dele». Com o sujeito plural «os perversos», o possessivo singular pode ter valor distributivo; «nas próprias redes» comunica com clareza que eles caem nas redes que armaram, sem apresentar a morfologia como singular.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente más. «Os perversos» é conciso, corrente e não especifica gênero além do exigido pela gramática portuguesa.
- source_word: יַחַד
  choice: juntos
  rationale: O advérbio indica ação coletiva ou simultânea. «Juntos» preserva essa ideia e se liga naturalmente ao verbo.
- source_word: אָנֹכִי
  choice: eu
  rationale: O pronome independente é enfático. A presença explícita de «eu» mantém o contraste entre o salmista e os perversos.
- source_word: עַד
  choice: enquanto
  rationale: Embora עַד costume significar «até», nesta frase poética comprimida pode delimitar o período em que o salmista passa. «Enquanto» exprime naturalmente a simultaneidade contrastante; a leitura mais literal fica registrada em nota.
- source_word: אֶעֱבוֹר
  choice: passo adiante
  rationale: O verbo עבר significa passar, atravessar ou seguir além. «Passo adiante» conserva o movimento sem acrescentar explicitamente «em segurança», ideia apenas implícita no contexto.
