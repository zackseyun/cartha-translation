  terminology: «Perversos» é apropriado para רְשָׁעִים neste registro. «Redes» conserva o plural de מַכְמֹרָיו; «próprias» explicita uma leitura distributiva/reflexiva que deve permanecer qualificada pela nota. Não se deve acrescentar «em segurança».
