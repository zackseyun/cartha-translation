source:
  edition: WLC
  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: pt
  text: Como quem lavra e rompe a terra[a], nossos ossos foram espalhados à boca do Sheol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como quem corta e abre o solo”. Os particípios hebraicos apresentam a ação de modo vívido, e os dois verbos podem ser traduzidos por diferentes termos ligados a cortar, sulcar ou fender a terra.'
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o domínio dos mortos; tradicionalmente também é traduzido por “sepultura” e, com menor precisão em alguns contextos, por “inferno”.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Como quem
  rationale: Introduz naturalmente a comparação e permite representar os particípios hebraicos como ações realizadas por uma pessoa.
- source_word: פֹלֵחַ
  choice: lavra
  rationale: No contexto agrícola, comunica de modo claro o ato de cortar ou sulcar o solo, sem eliminar a ideia de abertura da terra reforçada pelo verbo seguinte.
- source_word: וּבֹקֵעַ
  choice: e rompe
  rationale: Preserva a imagem vigorosa de fender ou abrir o solo e forma um paralelo natural com “lavra”.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: Refere-se aqui ao solo trabalhado; “terra” mantém a formulação concreta e poética do hebraico.
- source_word: נִפְזְרוּ
  choice: foram espalhados
  rationale: Expressa o sentido passivo do nifal e mantém em primeiro plano a imagem do resultado violento.
- source_word: עֲצָמֵינוּ
  choice: nossos ossos
  rationale: Tradução direta que conserva sem atenuação a imagem abrupta do texto.
- source_word: לְפִי
  choice: à boca de
  rationale: Mantém a expressão concreta do hebraico e sua personificação do Sheol como um domínio que se abre para receber os mortos.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o termo hebraico para o domínio dos mortos, sem reduzi-lo à sepultura nem importar a noção teológica posterior de inferno.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos; o inferno
  rationale: “Sheol” conserva o conceito e a imagem do texto hebraico. “Inferno” pode introduzir associações doutrinárias posteriores, enquanto “sepultura” pode estreitar demais o sentido; a nota explica o termo sem resolver indevidamente sua amplitude.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. “Como quem” dá fluidez à comparação; “lavra e rompe” conserva tanto o cenário agrícola quanto a força da imagem. A expressão deliberadamente incomum “à boca do Sheol” retém a metáfora concreta do hebraico.
