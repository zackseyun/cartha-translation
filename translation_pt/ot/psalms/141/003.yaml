base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: pt
  text: Põe uma sentinela, Yahweh, diante da minha boca; vigia a porta dos meus lábios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantém guarda sobre a abertura dos meus lábios”. Literalmente: “a porta dos meus lábios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתָה
  choice: Põe
  rationale: O pedido imperativo de שׁית é expresso de modo natural e direto em português, com o sentido de colocar ou estabelecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: שָׁמְרָה
  choice: uma sentinela
  rationale: O substantivo ligado a שמר designa guarda ou vigilância; “sentinela” preserva a imagem concreta de alguém postado para controlar o acesso.
- source_word: לְפִי
  choice: diante da minha boca
  rationale: A preposição לְ indica aqui a posição ou relação da sentinela com a boca; “diante de” combina naturalmente com a imagem de alguém postado à entrada.
- source_word: נִצְּרָה
  choice: vigia
  rationale: O imperativo de נצר pede vigilância protetora e forma um paralelo natural com a sentinela do primeiro membro.
- source_word: עַל
  choice: sobre (expresso idiomaticamente pelo objeto direto de “vigia”)
  rationale: Com o verbo português “vigiar”, a relação de controle indicada por עַל é transmitida naturalmente sem preposição.
- source_word: דַּל שְׂפָתָי
  choice: a porta dos meus lábios
  rationale: Preserva a metáfora hebraica concreta da boca como entrada fechada ou controlada por uma porta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e claro, com cadência de oração. “Sentinela” e “porta dos meus lábios” mantêm a imagem concreta e poética do hebraico; o marcador de nota aparece no texto principal.
