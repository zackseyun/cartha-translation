  text: אַל תַּט לִבִּ֨/י לְ/דָבָ֪ר רָ֡ע לְ/הִתְע֘וֹלֵ֤ל עֲלִל֨וֹת בְּ/רֶ֗שַׁע אֶת אִישִׁ֥ים פֹּֽעֲלֵי אָ֑וֶן וּ/בַל אֶ֝לְחַ֗ם בְּ/מַנְעַמֵּי/הֶֽם־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: pt
  text: Não inclines meu coração para nenhuma coisa má[a], para praticar atos perversos com homens que fazem o mal[b]; e que eu não coma das iguarias deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um assunto mau” ou “para uma palavra má”; o termo hebraico pode significar “coisa”, “assunto” ou “palavra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com malfeitores”. Literalmente, “com homens que praticam o mal”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, dos alimentos especiais ou das coisas agradáveis deles; a expressão também pode sugerir participação em seus prazeres pecaminosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: inclines
  rationale: Preserva a imagem causativa de נטה aplicada ao coração e o tom de súplica, sem atenuar a ação pedida a Deus.
- source_word: לִבִּי
  choice: meu coração
  rationale: Mantém a imagem hebraica do centro interior da vontade, dos desejos e dos pensamentos.
- source_word: לְדָבָר רָע
  choice: para coisa alguma má
  rationale: דבר pode designar coisa, assunto ou palavra. Aqui, a formulação geral se ajusta ao contexto de conduta perversa; a nota conserva as alternativas legítimas.
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: para praticar atos perversos
  rationale: Expressa envolvimento deliberado em ações marcadas pela perversidade, em português natural e digno.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: com homens que fazem o mal
  rationale: Conserva o substantivo masculino plural e a construção verbal que caracteriza esses homens por suas ações más, evitando o arcaísmo pouco transparente de 'praticam iniquidade'.
- source_word: וּבַל אֶלְחַם
  choice: e que eu não coma
  rationale: Mantém a continuação negativa da súplica e a imagem concreta de comer, sem explicitar no corpo do texto uma possível participação moral figurada.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: das iguarias deles
  rationale: No contexto do verbo 'comer', designa naturalmente alimentos especiais ou agradáveis; a nota registra o alcance mais amplo e a possível implicação figurada.
theological_decisions:
- issue: Ação divina e responsabilidade moral em אַל תַּט לִבִּי
  choice: Não inclines meu coração
  alternative: Não deixes meu coração inclinar-se
  rationale: O hebraico dirige diretamente a Deus o pedido relativo à inclinação do coração do salmista. A tradução preserva essa tensão teológica em vez de trocar a formulação causativa por mera permissão.
- issue: Possível sentido figurado de comer das iguarias
  choice: Manter a imagem concreta no texto e explicar a possível implicação na nota
  alternative: Não me deixes participar dos prazeres pecaminosos deles
  rationale: O texto hebraico fala em comer; tornar explícito apenas o sentido figurado eliminaria a imagem e resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua ocorrência no texto. 'Inclines' preserva solenidade sem ser arcaico; 'atos perversos' e 'fazem o mal' comunicam claramente o peso moral sem recorrer a vocabulário excessivamente eclesiástico.
