base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: pt
  text: 'Salmo de Davi.


    Ó Yahweh[a], clamo a ti; vem depressa até mim. Escuta a minha voz quando clamo a ti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”; “Yahweh” é uma transliteração do nome divino.
    reason: Explica a forma hebraica do nome divino e a tradução tradicional, em conformidade com a forma adotada no texto.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo consagrado e adequado para este gênero poético e para a fórmula do título.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Preserva a associação expressa por לְ sem limitar o sentido exclusivamente à autoria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: קְרָאתִיךָ
  choice: clamo a ti
  rationale: O perfeito, no contexto imediato de oração, admite valor presente ou de apelo já iniciado; esta formulação é natural e mantém o paralelismo com a oração seguinte.
- source_word: חוּשָׁה לִּי
  choice: vem depressa ao meu encontro
  rationale: Comunica com naturalidade a urgência do imperativo e o direcionamento indicado por לִי, sem sugerir apenas rapidez abstrata.
- source_word: הַאֲזִינָה
  choice: Escuta
  rationale: Expressa o pedido de atenção auditiva em português atual, com dignidade e clareza.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Mantém o sentido direto do substantivo hebraico, sem interpretá-lo mais especificamente como 'grito'.
- source_word: בְּקָרְאִי לָךְ
  choice: quando clamo a ti
  rationale: Traduz o infinitivo construto com בְּ em seu valor temporal natural neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio; a transliteração o preserva, enquanto a alternativa tradicional o substitui por um título.
- issue: Relação de Davi com o salmo em לְדָוִד
  choice: de Davi
  alternative: por Davi
  rationale: '''De Davi'' conserva a possível autoria sem eliminar outros sentidos de associação, pertença ou dedicação permitidos pela preposição hebraica.'
translation_notes:
  register: Português moderno, claro e poético, de ampla compreensão internacional e boa legibilidade brasileira. O vocativo 'Ó' preserva a solenidade da oração; 'vem depressa ao meu encontro' transmite sua urgência sem arcaísmo.
