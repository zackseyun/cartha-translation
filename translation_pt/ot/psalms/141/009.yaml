  text: שָׁמְרֵ֗/נִי מִ֣/ידֵי פַ֭ח יָ֣קְשׁוּ לִ֑/י וּ֝/מֹקְשׁ֗וֹת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: pt
  text: Guarda-me do alcance da armadilha que armaram para mim[a] e dos laços dos que praticam a maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “das mãos da armadilha”. No hebraico, “mão” pode expressar poder, domínio ou alcance.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Guarda-me
  rationale: O imperativo de שׁמר exprime um pedido de proteção ou preservação; “Guarda-me” é natural no contexto de oração e mantém a forma direta do hebraico.
- source_word: מִידֵי
  choice: do alcance de
  rationale: Literalmente, “das mãos de”. Com uma armadilha como complemento, a imagem comunica poder, domínio ou capacidade de apanhar; “do alcance de” conserva essa força concreta em português natural.
- source_word: פַח
  choice: a armadilha
  rationale: פח designa uma armadilha ou laço. “Armadilha” permite distingui-lo de מֹקְשׁוֹת, traduzido em seguida por “laços”.
- source_word: יָקְשׁוּ לִי
  choice: que armaram para mim
  rationale: O verbo יקשׁ se refere a preparar ou armar uma cilada. A formulação mantém o valor de לִי, “para mim”, sem identificar explicitamente o sujeito plural implícito.
- source_word: וּמֹקְשׁוֹת
  choice: e dos laços
  rationale: O plural מֹקְשׁוֹת significa “laços” ou “armadilhas”. A preposição “de” é retomada do primeiro membro para tornar claro o paralelismo em português.
- source_word: פֹּעֲלֵי אָוֶן
  choice: dos que praticam a maldade
  rationale: A expressão significa literalmente “os que fazem/praticam maldade, perversidade ou iniquidade”. A escolha preserva a construção verbal e o sentido moral sem recorrer a vocabulário excessivamente arcaico.
theological_decisions: []
