source:
  edition: WLC
  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: pt
  text: Que a minha oração seja estabelecida[a] diante de ti como incenso, e o levantar das minhas mãos, como a oferta da tarde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja preparada” ou “seja posta em ordem” diante de ti; o hebraico expressa o desejo de que a oração seja firmemente disposta na presença de Deus.
    reason: lexical_alternative
  - marker: b
    text: A “oferta da tarde” era a oferta regular apresentada ao entardecer; o termo hebraico pode designar mais especificamente uma oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: seja preparada
  rationale: O nifal de כון expressa o desejo de que a oração seja firmemente disposta ou estabelecida na presença de Deus. “Seja preparada” é natural em português e conserva a linguagem cultual sem explicitar a ideia de aceitação.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa do singular.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Equivalente usual para a substância aromática queimada como oferta; mantém a comparação cultual explícita.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Expressão portuguesa natural que preserva a linguagem espacial e relacional da presença de Deus.
- source_word: מַשְׂאַת
  choice: o levantar
  rationale: Designa o ato de erguer; em combinação com “minhas mãos”, retrata o gesto corporal de oração.
- source_word: כַּפַּי
  choice: das minhas mãos
  rationale: Embora כף possa designar a palma, “mãos” é o equivalente idiomático neste gesto de oração.
- source_word: מִנְחַת עָרֶב
  choice: a oferta da tarde
  rationale: מִנְחָה pode designar uma dádiva ou, em contexto ritual, uma oferta de cereal. A formulação concisa preserva a referência sacrificial, deixando a especificidade lexical para a nota.
theological_decisions:
- issue: Imagens cultuais aplicadas à oração
  choice: Preservar a comparação da oração e das mãos erguidas com o incenso e a oferta vespertina.
  alternative: Explicitar que a oração substitui ou equivale espiritualmente ao sacrifício.
  rationale: O hebraico emprega imagens sacrificiais em uma comparação poética, mas não formula aqui uma doutrina de substituição dos sacrifícios pela oração.
translation_notes:
  register: Português moderno, digno e acessível, com construção poética equilibrada. “Diante de ti” mantém o tratamento singular dirigido a Deus; as duas comparações conservam o paralelismo hebraico.
