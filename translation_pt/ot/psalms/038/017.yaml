lexical_decisions:
- source_word: לְצֶלַע
  choice: prestes a cair
  rationale: A expressão indica estar destinado ou pronto para claudicar, tropeçar ou cair. No contexto de fragilidade e sofrimento, “prestes a cair” comunica de modo natural a iminência do colapso sem acrescentar uma interpretação específica.
- source_word: מַכְאוֹבִי
  choice: minha dor
  rationale: O substantivo מַכְאוֹב pode designar dor ou sofrimento; o singular “minha dor” preserva a forma e a concisão do hebraico.
- source_word: נֶגְדִּי תָמִיד
  choice: está sempre diante de mim
  rationale: Reproduz de perto a imagem hebraica de uma dor continuamente presente perante o salmista.
theological_decisions:
- issue: Natureza da queda em לְצֶלַע
  choice: cair
  alternative: tropeçar; mancar
  rationale: O hebraico permite a imagem de claudicar ou tropeçar. “Cair” preserva a vulnerabilidade iminente indicada pelo contexto e acompanha a revisão adjudicada, sem definir a queda como exclusivamente física, moral ou espiritual.
