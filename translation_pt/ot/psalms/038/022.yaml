lexical_decisions:
- source_word: חוּשָׁה
  choice: Apressa-te
  rationale: O imperativo expressa urgência. “Apressa-te” é natural, digno e mantém a força do apelo hebraico.
- source_word: לְעֶזְרָתִי
  choice: em ajudar-me
  rationale: Representa de modo idiomático a expressão literal “para o meu auxílio”, sem perder a ideia de socorro pessoal.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino padrão no contexto; “Senhor” preserva seu uso como forma direta de tratamento.
- source_word: תְּשׁוּעָתִי
  choice: minha salvação
  rationale: Mantém o substantivo abstrato, a relação possessiva e a amplitude de salvação ou livramento do termo hebraico.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: Neste uso, אֲדֹנָי funciona como título divino convencional. A tradução “Senhor” evita destacar uma posse que não é enfatizada pela forma em seu emprego habitual.
- issue: Sentido de תְּשׁוּעָתִי
  choice: minha salvação
  alternative: meu livramento
  rationale: “Minha salvação” preserva a formulação nominal e a amplitude semântica do hebraico, sem limitar a referência a um único tipo de resgate.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem final conserva o impacto da invocação e da declaração hebraicas.
