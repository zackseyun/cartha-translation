translation:
  language: pt
  text: Pois confesso a minha iniquidade[a]; estou angustiado por causa do meu pecado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «declaro a minha iniquidade». O verbo hebraico significa literalmente «declarar» ou «dar a conhecer»; «confesso» reflete o contexto penitencial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «estou preocupado com o meu pecado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que precede e preserva com naturalidade a força conectiva do hebraico.
- source_word: עֲוֺנִי
  choice: a minha iniquidade
  rationale: עָוֹן pode indicar tanto o ato perverso quanto a culpa decorrente; «iniquidade» mantém o peso moral e a linguagem bíblica em português.
- source_word: אַגִּיד
  choice: confessarei
  rationale: O hifil de נגד significa literalmente «declarar» ou «dar a conhecer». No contexto penitencial, «confessarei» expressa naturalmente a declaração da própria iniquidade, sem ocultar a alternativa lexical na nota.
- source_word: אֶדְאַג
  choice: estou angustiado
  rationale: דאג expressa inquietação, preocupação ou aflição. «Estou angustiado» comunica aqui sofrimento interior intenso em português corrente.
- source_word: מֵחַטָּאתִי
  choice: por causa do meu pecado
  rationale: A preposição מִן indica causa ou motivo neste contexto; a formulação explicita de modo natural que o pecado provoca a angústia.
- source_word: חַטָּאתִי
  choice: meu pecado
  rationale: חַטָּאת é o termo comum para pecado, e esta é a correspondência mais direta e transparente.
theological_decisions:
- issue: Relação entre a declaração da iniquidade e a aflição interior no salmo penitencial
  choice: Apresentar o versículo como confissão pessoal da iniquidade acompanhada de angústia causada pelo pecado.
  alternative: Traduzir אַגִּיד de modo mais lexical como «declararei», sem explicitar a nuance de confissão, e אֶדְאַג como «estou preocupado».
  rationale: O hebraico afirma que o salmista dá a conhecer sua iniquidade e se aflige por seu pecado. «Confessarei» corresponde ao contexto penitencial, mas a nota conserva o sentido lexical mais amplo; não se acrescenta uma doutrina da penitência além do que o texto diz.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. O futuro «confessarei» preserva a forma verbal hebraica no contexto, e «iniquidade» mantém o peso moral sem introduzir uma interpretação denominacional.
