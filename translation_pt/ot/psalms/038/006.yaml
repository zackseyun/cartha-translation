base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/006.yaml
  text: I am bent and bowed down very low[a]; all day long I go about mourning.
translation:
  language: pt
  text: Estou curvado e muito abatido; ando de luto o dia todo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sombrio” ou “em trevas”; o particípio hebraico evoca tanto a escuridão quanto o luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Estou encurvado
  rationale: O verbo עוה expressa a ideia de ficar torto, curvado ou deformado. “Estou encurvado” preserva a imagem corporal e, em paralelo com o verbo seguinte, comunica o colapso físico e emocional sem especificar sua causa.
- source_word: שַׁחֹתִי
  choice: profundamente abatido
  rationale: De שׁחח, “abaixar-se, ficar baixo”. “Abatido” mantém tanto a postura rebaixada quanto a dimensão emocional; “profundamente” incorpora a intensificação de עַד מְאֹד de modo natural em português.
- source_word: עַד מְאֹד
  choice: profundamente
  rationale: A expressão intensifica o estado descrito pelos verbos anteriores. Em português corrente, “profundamente” transmite a intensidade e combina naturalmente com “abatido”.
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: Forma idiomática, clara e contemporânea de expressar duração contínua.
- source_word: קֹדֵר
  choice: de luto
  rationale: O particípio de קדר pode indicar escuridão, aspecto sombrio ou luto. No contexto do lamento, “de luto” comunica naturalmente a aflição, enquanto a nota preserva a imagem de escuridão e as alternativas lexicais.
- source_word: הִלָּכְתִּי
  choice: passo
  rationale: Embora o verbo seja literalmente “andei” ou “caminhei”, aqui descreve como o salmista atravessa o dia. “Passo o dia todo” é idiomático e preserva o sentido durativo sem exigir uma caminhada literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo corporal e emocional do primeiro hemistíquio e conserva em nota a ambiguidade de קֹדֵר. O marcador [a] aparece no texto principal.
