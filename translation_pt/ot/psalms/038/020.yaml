  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: pt
  text: Os que retribuem o mal pelo bem se opõem a mim[a], porque busco o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “opõem-se a mim em retribuição por eu buscar o bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: Os que retribuem
  rationale: O particípio de שׁלם descreve os que dão algo em troca; “retribuem” preserva naturalmente a ideia de reciprocidade.
- source_word: רָעָה
  choice: o mal
  rationale: Mantém a força moral do termo e o contraste direto com “bem”.
- source_word: תַּחַת
  choice: pelo / porque
  rationale: Na primeira ocorrência, marca troca ou substituição e é expresso idiomaticamente por “pelo”. Na segunda, a relação de retribuição é vertida como causa em português corrente, sem perder a formulação mais literal registrada na nota.
- source_word: טוֹבָה
  choice: bem
  rationale: Designa o bem feito ou recebido e preserva a concisão da antítese “mal pelo bem”.
- source_word: יִשְׂטְנוּנִי
  choice: se opõem a mim
  rationale: O verbo שׂטן indica agir como adversário ou opor-se; esta escolha evita restringir o sentido a uma acusação judicial ou ampliá-lo para “odiar”.
- source_word: רְדֹפִי
  choice: busco
  rationale: Embora רדף signifique literalmente “perseguir”, neste contexto indica empenho ativo em seguir o bem; “busco” comunica isso de modo natural em português.
- source_word: טוֹב
  choice: o que é bom
  rationale: O adjetivo substantivado funciona como objeto da ação; a expressão é clara e idiomática em português.
theological_decisions:
- issue: Força da segunda oração com תַּחַת
  choice: porque busco o que é bom
  alternative: em troca de eu buscar o bem
  rationale: A construção hebraica pode ser conservada mais literalmente como uma relação de retribuição. No fluxo do português, ela comunica que a oposição ocorre por causa da busca do salmista pelo bem; a nota preserva a forma e a nuance alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A antítese tradicional “mal pelo bem” foi mantida; “busco” evita a possível conotação negativa de “persigo” sem enfraquecer a ação deliberada expressa pelo hebraico.
