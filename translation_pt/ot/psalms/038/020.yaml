    issue: A expressão «o que é bom» reduz a repetição direta de «bem» entre as duas metades do versículo.
    rationale: O hebraico contrasta רָעָה («mal») com טוֹבָה («bem») e conclui com טוֹב substantivado («bem»). «Busco o bem» é fiel, conciso e idiomático.
  - severity: low
    issue: A redação da nota, «em troca de eu buscar o bem», é algo pesada em português.
    rationale: «Em retribuição por eu buscar o bem» preserva de modo mais claro e natural a força de troca/retribuição de תַּחַת, sem alegar resolver definitivamente sua nuance.
  revised_text: Os que retribuem o mal pelo bem se opõem a mim[a], porque busco o bem.
