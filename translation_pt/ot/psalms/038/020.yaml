review_pass:
  verdict: revise
  source_fidelity: O texto principal transmite corretamente a antítese hebraica («retribuem o mal pelo bem»), a hostilidade dirigida ao salmista e a motivação ligada à sua busca do bem. «Porque» é uma explicitação idiomática defensável da segunda ocorrência de תַּחַת, desde que a nota preserve a formulação de retribuição.
  naturalness: «Os que retribuem o mal pelo bem se opõem a mim» é claro e natural. «Busco o bem» é mais conciso, mantém a repetição lexical de «bem» do hebraico e soa mais natural do que «busco o que é bom» neste paralelismo. A nota atual, «em troca de eu buscar», é compreensível, mas pouco fluente; «em retribuição por eu buscar» exprime melhor a relação.
  terminology: «Mal», «bem», «retribuem» e «se opõem a mim» são escolhas adequadas e não introduzem especificações teológicas ou jurídicas indevidas. A nota deve conservar «bem», em correspondência com as duas ocorrências hebraicas de טוב.
  issues:
