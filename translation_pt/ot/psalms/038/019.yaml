    rationale: «Injustamente» desloca o sentido para injustiça/ilegitimidade e não representa de modo suficientemente direto o campo semântico de «falsidade/mentira». «Falsamente» preserva melhor a formulação aberta do hebraico; a alternativa «sem motivo» permanece na nota.
  - severity: low
    issue: Posição da âncora da nota
    rationale: A nota explica «falsamente»; a âncora deve seguir essa expressão, e não a pontuação final de toda a frase.
