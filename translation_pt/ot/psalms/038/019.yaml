  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: pt
  text: Mas os meus inimigos estão vivos e são fortes, e são muitos os que me odeiam falsamente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que me odeiam sem motivo”. A palavra hebraica significa literalmente “falsidade” ou “mentira” e pode indicar tanto que o ódio deles é falso quanto que não tem fundamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: O substantivo designa adversários pessoais; “os meus inimigos” é direto, natural e preciso em português.
- source_word: חַיִּים
  choice: estão vivos
  rationale: Preserva o sentido básico do adjetivo e o provável contraste entre a vitalidade dos inimigos e a condição debilitada do salmista.
- source_word: עָצֵמוּ
  choice: fortes
  rationale: O verbo indica que se tornaram fortes ou poderosos; em conjunto com “estão”, a formulação expressa naturalmente a força presente deles.
- source_word: רַבּוּ
  choice: são muitos
  rationale: Comunica de modo idiomático o aumento ou grande número dos que odeiam o salmista.
- source_word: שֹׂנְאַי
  choice: os que me odeiam
  rationale: Mantém a força verbal do particípio substantivado, sem reduzi-lo simplesmente a outro termo para “inimigos”.
- source_word: שָׁקֶר
  choice: injustamente
  rationale: O substantivo “falsidade/mentira” tem função adverbial. “Injustamente” expressa em português natural que esse ódio é falso, indevido ou sem fundamento, enquanto a nota preserva a ambiguidade lexical.
