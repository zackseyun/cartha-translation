  verdict: revise
  source_fidelity: 'O hebraico contrasta a vitalidade e a força dos inimigos com a debilidade do salmista: «meus inimigos estão vivos; הם/eles se tornaram fortes», seguido de «muitos são os que me odeiam [com/em] falsidade». A redação proposta preserva a coordenação e o valor presente dos verbos. «Mas» é uma explicitação contextual legítima do waw adversativo neste contexto.'
  naturalness: «Estão vivos e são fortes» é claro e natural em português moderno, além de evitar que «fortes» pareça simplesmente um segundo adjetivo regido por «estão». «São muitos os que...» é idiomático e mantém a ênfase na quantidade.
  terminology: «Falsamente» corresponde mais diretamente a שָׁקֶר («falsidade, mentira») do que «injustamente». Embora a construção hebraica admita a implicação «sem motivo», também pode caracterizar o ódio como falso ou enganoso; a nota mantém essa ambiguidade sem fixar uma interpretação.
