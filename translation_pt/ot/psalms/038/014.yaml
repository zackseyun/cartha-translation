base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: pt
  text: E fiquei como um homem que não ouve e em cuja boca não há réplicas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repreensões”, “argumentos” ou “respostas”. O termo hebraico pode indicar correções verbais ou respostas que contestam uma acusação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: E fiquei
  rationale: O wayyiqtol de היה dá continuidade ao discurso. Em português, “fiquei” expressa naturalmente o estado assumido na comparação, sem impor um contraste que a conjunção não explicita.
- source_word: כְּאִישׁ
  choice: como um homem
  rationale: Mantém a comparação singular e o substantivo masculino אִישׁ, em linguagem portuguesa corrente.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: que não ouve
  rationale: Traduz diretamente o particípio de שׁמע e não acrescenta incapacidade (“não pode ouvir”), ausente do hebraico.
- source_word: וְאֵין בְּפִיו
  choice: e em cuja boca não há
  rationale: Preserva a construção existencial com אֵין, a conjunção e a imagem corporal da boca como lugar da fala.
- source_word: תּוֹכָחוֹת
  choice: réplicas
  rationale: No contexto de silêncio diante de opositores, “réplicas” comunica respostas verbais de contestação. Uma nota preserva a amplitude lexical do termo, que também pode indicar repreensões, argumentos ou respostas.
