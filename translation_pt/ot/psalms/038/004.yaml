  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: pt
  text: Pois as minhas iniquidades passaram por cima da minha cabeça; como uma carga pesada[a], pesam demais para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha culpa”; a palavra hebraica pode indicar tanto a iniquidade como a culpa que dela resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da lamentação e preserva a força explicativa do hebraico em linguagem poética natural.
- source_word: עֲוֺנֹתַי
  choice: as minhas iniquidades
  rationale: Mantém o peso moral de עָוֹן e seu sentido primário de transgressões neste contexto penitencial, sem excluir a noção associada de culpa.
- source_word: עָבְרוּ רֹאשִׁי
  choice: passaram por cima da minha cabeça
  rationale: Preserva a imagem concreta de algo que sobe e ultrapassa a cabeça, sugerindo que o salmista foi submerso ou sobrepujado.
- source_word: כְּמַשָּׂא כָבֵד
  choice: como uma carga pesada
  rationale: Reproduz diretamente a metáfora física de uma carga de grande peso em português corrente.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: pesam demais para mim
  rationale: Conserva o jogo lexical com כָבֵד e expressa de modo natural que o peso excede a capacidade do falante.
theological_decisions:
- issue: Amplitude semântica de עָוֹן no contexto penitencial
  choice: “iniquidades”, com referência principal às transgressões morais do salmista
  alternative: “culpa”, enfatizando a condição de culpado ou a consequência das transgressões
  rationale: O contexto apresenta aquilo que pertence ao salmista como uma carga opressora. “Iniquidades” preserva no texto principal o aspecto moral dos atos, enquanto a nota registra a possibilidade genuína de o termo também denotar a culpa resultante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva as duas imagens hebraicas — águas acima da cabeça e carga excessivamente pesada — e mantém a repetição semântica entre “pesada” e “pesam”.
