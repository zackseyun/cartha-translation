lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: Não me abandones
  rationale: A partícula negativa אַל com a forma verbal expressa uma súplica direta. עזב significa deixar ou abandonar; “não me abandones” conserva a força do lamento e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa do singular significa diretamente “meu Deus”.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: não fiques longe de mim
  rationale: Mantém o sentido estativo de רחק, “estar/ficar longe”, sem interpretar a expressão mais especificamente como uma ação deliberada de afastar-se.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o nome divino. A transliteração preserva sua função como nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso próprio de uma súplica nos Salmos. “Abandones” comunica melhor o peso do lamento do que o mais neutro “deixes”; “fiques longe” preserva a formulação hebraica sem explicá-la em excesso.
