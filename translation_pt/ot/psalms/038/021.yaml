  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: pt
  text: Não me abandones, Yahweh[a], meu Deus; não fiques longe de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui transliterado como “Yahweh”.'
