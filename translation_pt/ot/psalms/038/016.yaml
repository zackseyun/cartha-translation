  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: pt
  text: 'Pois eu disse: “Do contrário, eles se alegrariam às minhas custas; quando meu pé vacila, eles se exaltam contra mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ לִי
  choice: se alegrariam com a minha desgraça
  rationale: A construção expressa alegria maliciosa dirigida ao salmista. A explicitação idiomática evita que “se alegrar comigo” seja entendida positivamente.
- source_word: בְּמוֹט רַגְלִי
  choice: quando meu pé vacila
  rationale: Preserva a imagem concreta do hebraico e seu sentido figurado de fraqueza, tropeço ou queda.
- source_word: עָלַי הִגְדִּילוּ
  choice: eles se exaltam contra mim
  rationale: O verbo significa literalmente tornar-se grande; neste contexto, descreve a atitude triunfante e arrogante dos adversários, sem limitar o sentido apenas a palavras de jactância.
- source_word: פֶּן
  choice: do contrário
  rationale: No contexto de אָמַרְתִּי, introduz o resultado temido que fundamenta a fala ou súplica anterior.
theological_decisions:
- issue: Natureza da reação dos inimigos
  choice: Manter a linguagem de alegria maliciosa e exaltação hostil
  alternative: Interpretar como vitória objetiva dos inimigos
  rationale: O texto descreve a reação e postura dos adversários, sem afirmar necessariamente que eles obtenham uma vitória definitiva.
translation_notes:
  register: Português moderno, digno e acessível. A repetição de “eles” conserva a clareza do paralelismo; “meu pé vacila” mantém a metáfora corporal do original.
