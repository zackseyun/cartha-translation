  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: pt
  text: Meu coração palpita[a]; minha força me abandonou, e nem mesmo a luz dos meus olhos está comigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu coração está agitado” ou “meu coração cambaleia”. O termo hebraico sugere agitação ou movimento giratório e, neste contexto, pode descrever uma palpitação perturbada.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão “a luz dos meus olhos” pode se referir à própria visão ou ao brilho e à vitalidade refletidos nos olhos. O hebraico diz literalmente: “também eles não estão comigo”, provavelmente retomando “meus olhos”.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לִבִּי סְחַרְחַר
  choice: Meu coração bate descompassado
  rationale: סְחַרְחַר transmite agitação ou movimento giratório. No contexto de sofrimento físico e perda de forças, a expressão portuguesa comunica de modo natural a pulsação perturbada do coração, sem excluir totalmente a ideia mais ampla de agitação.
- source_word: עֲזָבַנִי כֹחִי
  choice: minha força me abandonou
  rationale: A construção hebraica tem כֹחִי, “minha força”, como sujeito de עֲזָבַנִי, “me deixou/abandonou”. A tradução conserva a personificação e expressa claramente o esgotamento físico.
- source_word: וְאוֹר עֵינַי
  choice: e a luz dos meus olhos
  rationale: A formulação mantém a imagem poética hebraica e sua possível referência tanto à visão quanto ao brilho ou vitalidade percebidos nos olhos.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: até ela já não está comigo
  rationale: O hebraico diz literalmente “também eles não estão comigo”, com pronome plural que provavelmente retoma “olhos”. Em português, “ela” concorda naturalmente com o núcleo singular “luz”; “até” preserva a ênfase de גַּם, e “já não está comigo” conserva a imagem de perda sem explicá-la em excesso.
theological_decisions: []
