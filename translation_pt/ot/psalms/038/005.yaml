  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: pt
  text: Minhas feridas cheiram mal e apodrecem por causa da minha insensatez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minhas contusões ficaram repugnantes e se decompõem por causa da minha loucura.”'
    reason: Alternativas lexicais possíveis para חַבּוּרֹתַי, הִבְאִישׁוּ, נָמַקּוּ e אִוַּלְתִּי.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: cheiram mal
  rationale: O hifil de באש expressa tornar-se repugnante pelo cheiro ou exalar mau odor. “Cheiram mal” é claro, natural e mantém a repulsa física do hebraico.
- source_word: נָמַקּוּ
  choice: apodrecem
  rationale: O verbo descreve deterioração, decomposição ou definhamento. No contexto de feridas, “apodrecem” comunica diretamente a corrupção física sem restringir o sentido ao processo mais específico sugerido por “supuram”.
- source_word: חַבּוּרֹתַי
  choice: minhas feridas
  rationale: חַבּוּרָה pode indicar contusão, marca de golpe ou ferida. Os verbos relacionados a mau cheiro e decomposição favorecem “feridas”, termo natural e suficientemente amplo em português.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição introduz aqui a causa da condição descrita, sentido expresso com clareza por “por causa de”.
- source_word: אִוַּלְתִּי
  choice: minha insensatez
  rationale: O substantivo denota insensatez ou loucura com possível dimensão moral. “Insensatez” preserva a autorresponsabilização do salmista sem reduzir o termo a simples ignorância.
theological_decisions:
- issue: Relação causal entre o sofrimento e a insensatez do salmista
  choice: por causa da minha insensatez
  alternative: em consequência da minha loucura
  rationale: O versículo relaciona explicitamente a condição física do salmista à sua própria insensatez. A tradução mantém essa relação causal sem transformá-la numa afirmação geral sobre a causa de todo sofrimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação dos dois verbos reproduz de modo natural o paralelismo verbal hebraico; a nota preserva alternativas lexicais genuínas.
