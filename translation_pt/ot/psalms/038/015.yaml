  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: pt
  text: Pois por ti, Yahweh, espero[a]; tu responderás, Senhor, meu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido como “aguardo com esperança” ou “ponho minha esperança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação no contexto e mantém aberta a nuance entre explicação e ênfase.
- source_word: לְךָ
  choice: por ti
  rationale: Com יחל, indica aquele por quem se espera; esta formulação é natural em português e evita interpretar o sentido como simples confiança 'em' alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, distinguindo-o do título אֲדֹנָי na segunda metade do verso.
- source_word: הוֹחָלְתִּי
  choice: espero
  rationale: O verbo no Hifil expressa esperar com esperança. O presente português comunica uma atitude contínua e estabelecida, adequada ao perfeito hebraico neste contexto poético.
- source_word: אַתָּה
  choice: tu
  rationale: Preserva o pronome independente e sua ênfase, além de manter a linguagem direta da oração.
- source_word: תַעֲנֶה
  choice: responderás
  rationale: Traduz diretamente o sentido de responder sem acrescentar o objeto 'me', que não está explícito no hebraico.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o equivalente corrente e digno do título divino em vocativo.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Preserva explicitamente o sufixo possessivo de primeira pessoa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino e, no mesmo verso, o título אֲדֹנָי. A transliteração preserva essa distinção textual sem substituir o nome por um título.
- issue: Certeza ou pedido na forma תַעֲנֶה
  choice: responderás
  alternative: que respondas
  rationale: A forma verbal é indicativa e pode expressar a expectativa confiante do salmista; não há marca formal que exija convertê-la em súplica.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A inversão breve “por ti, Yahweh, espero” conserva o foco dado pelo hebraico ao destinatário da esperança e mantém cadência poética sem soar arcaica.
