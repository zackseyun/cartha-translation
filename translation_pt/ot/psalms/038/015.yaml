  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: כִּי como introdução causal («Pois»), לְךָ com o destinatário da espera («por ti»), o nome divino «Yahweh», o sentido de esperar esperançosamente em הוֹחָלְתִּי, o pronome enfático «tu», o futuro de תַעֲנֶה sem inserir objeto, e a dupla invocação «Senhor, meu Deus».'
