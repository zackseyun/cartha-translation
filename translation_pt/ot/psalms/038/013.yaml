base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: pt
  text: Mas eu, como um surdo, não ouço; sou como um mudo, que não abre a boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e, como um mudo, ele não abre a boca”. O texto passa da primeira pessoa (“não ouço”) para a terceira pessoa, que provavelmente descreve o mudo da comparação. Também se pode entender: “e, como um mudo, não abro a boca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção e o pronome destacado introduzem um contraste com os adversários que falam no contexto; “Mas eu” expressa isso naturalmente.
- source_word: כְחֵרֵשׁ
  choice: como um surdo
  rationale: O prefixo כְּ marca comparação, e חֵרֵשׁ designa uma pessoa surda. A formulação conserva a imagem concreta e singular.
- source_word: לֹא אֶשְׁמָע
  choice: não ouço
  rationale: O verbo שׁמע significa primariamente “ouvir”. O presente português comunica bem a atitude descrita no contexto sem transformar a expressão em incapacidade (“não posso ouvir”).
- source_word: וּכְאִלֵּם
  choice: sou como um mudo
  rationale: אִלֵּם designa uma pessoa muda. A repetição de “sou” torna a comparação natural em português, sem eliminar o paralelismo com “surdo”.
- source_word: לֹא יִפְתַּח פִּיו
  choice: que não abre a boca
  rationale: A expressão preserva o idioma hebraico “abrir a boca” e mantém a terceira pessoa gramatical, vinculando-a ao mudo da comparação.
theological_decisions: []
