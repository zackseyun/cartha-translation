  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: pt
  text: Senhor, todo o meu anseio[a] está diante de ti, e o meu gemido[b] não está oculto de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desejo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “suspiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: O título divino está em vocativo e não é o nome YHWH; “Senhor” é a forma portuguesa natural e preserva essa distinção.
- source_word: נֶגְדְּךָ
  choice: diante de ti
  rationale: Expressa presença e exposição à vista de Deus; “diante de ti” é idiomático, digno e fiel à imagem hebraica.
- source_word: כָל
  choice: todo
  rationale: 'Mantém explicitamente a totalidade: nada do anseio do salmista fica fora da percepção de Deus.'
- source_word: תַּאֲוָתִי
  choice: meu anseio
  rationale: No contexto de lamento, indica um desejo intenso ou uma aspiração profunda, não uma cobiça sensual. “Anseio” comunica bem essa força afetiva.
- source_word: וְאַנְחָתִי
  choice: e o meu gemido
  rationale: O substantivo denota uma expressão de aflição, audível ou interior. “Gemido” preserva a intensidade do sofrimento e o registro do lamento.
- source_word: מִמְּךָ
  choice: de ti
  rationale: Com o verbo passivo, identifica aquele de quem algo poderia estar oculto; a construção “oculto de ti” conserva diretamente essa relação.
- source_word: לֹא נִסְתָּרָה
  choice: não está oculto
  rationale: 'O nifal descreve um estado passivo: o gemido não se encontra escondido de Deus. O presente é natural em português e adequado à confissão imediata do salmo.'
theological_decisions:
- issue: Forma de tratar Deus com אֲדֹנָי, e não com o nome divino YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O hebraico traz אֲדֹנָי, título de senhorio, não o tetragrama. Portanto, “Senhor” evita atribuir ao texto o nome divino que não aparece aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “ti” coerente com a linguagem bíblica de oração. Os marcadores foram posicionados junto aos termos a que suas alternativas lexicais efetivamente se referem.
