lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: Estou exausto
  rationale: O verbo expressa perda de vigor, entorpecimento ou desfalecimento; “exausto” comunica naturalmente o abatimento físico e interior sem restringir demais o sentido.
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: e completamente esmagado
  rationale: Mantém a imagem forte de ser esmagado e representa עַד־מְאֹד como intensidade extrema.
- source_word: שָׁאַגְתִּי
  choice: rugi
  rationale: O verbo denota um rugido ou brado intenso, mais forte que um simples gemido; preserva a contundência da imagem hebraica.
- source_word: מִנַּהֲמַת לִבִּי
  choice: por causa do gemido do meu coração
  rationale: Representa נַהֲמָה como gemido ou som profundo e mantém “coração” como o centro da aflição interior.
