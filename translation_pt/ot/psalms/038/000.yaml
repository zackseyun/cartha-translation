lexical_decisions:
- source_word: מִזְמוֹר
  choice: salmo
  rationale: É o termo tradicional e exato para esse gênero poético-musical nos títulos dos Salmos; “cântico” seria mais amplo.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica com לְ pode indicar autoria, associação, dedicação ou pertencimento. “De Davi” mantém essa abertura melhor do que “por Davi” ou “para Davi”.
- source_word: לְהַזְכִּיר
  choice: para rememoração
  rationale: O infinitivo causativo funciona como indicação de finalidade. “Para rememoração” é conciso e preserva a possível função memorial ou litúrgica sem definir quem deve lembrar ou ser lembrado.
