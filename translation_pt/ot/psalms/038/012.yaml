  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: pt
  text: Os que procuram tirar-me a vida armam ciladas[a]; os que desejam o meu mal proferem palavras destrutivas[b] e meditam em enganos o dia inteiro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “põem armadilhas”. O verbo hebraico evoca a ação de armar um laço para capturar alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “falam de ruína” ou “proferem coisas destrutivas”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode significar “murmuram” ou “resmungam”; aqui pode indicar fala baixa ou cogitação enganosa contínua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: armam ciladas
  rationale: Expressa de modo natural em português a ação de preparar uma armadilha, preservando a imagem hostil de emboscada do verbo נקשׁ.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: os que procuram tirar-me a vida
  rationale: Neste contexto hostil, נֶפֶשׁ indica a vida da pessoa; a formulação explicita com naturalidade a intenção letal sem traduzir literalmente por 'alma'.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: os que desejam o meu mal
  rationale: Reproduz a procura intencional do dano do salmista em português corrente e digno.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: falam de destruição
  rationale: Mantém a força ampla de הַוּוֹת — ruína, calamidade ou ações destrutivas — sem restringi-la indevidamente a planos secretos.
- source_word: וּמִרְמוֹת
  choice: enganos
  rationale: O plural corresponde à forma hebraica e abrange palavras ou maquinações enganosas.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Equivalente idiomático moderno que preserva a ideia de atividade contínua.
- source_word: יֶהְגּוּ
  choice: murmuram
  rationale: Preserva a noção de fala baixa e reiterada de הגה e sua possível nuance de cogitação, sem tornar explícito o interpretativo 'tramam'.
