  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: pt
  text: Pois meus lombos estão cheios de ardor[a], e não há saúde em minha carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é difícil; também pode indicar inflamação ou queimadura.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do sofrimento descrito no contexto e preserva a relação causal de modo natural em português.
- source_word: כְסָלַי
  choice: meus lombos
  rationale: Designa a região dos lombos ou flancos. “Lombos” mantém a concretude corporal e a precisão tradicional sem restringir indevidamente o sentido.
- source_word: מָלְאוּ
  choice: estão cheios
  rationale: Expressa o estado resultante indicado pelo qal de מלא e se combina naturalmente com “de ardor”.
- source_word: נִקְלֶה
  choice: ardor
  rationale: O termo é difícil, mas neste contexto de sofrimento físico provavelmente descreve ardência, queimadura ou inflamação. “Ardor” preserva o caráter físico sem acrescentar feridas que o hebraico não menciona explicitamente.
- source_word: וְאֵין מְתֹם
  choice: e não há parte sadia
  rationale: מְתֹם indica integridade ou saúde corporal. A expressão idiomática comunica que nenhuma parte do corpo permanece saudável.
- source_word: בִּבְשָׂרִי
  choice: em minha carne
  rationale: Refere-se concretamente ao corpo físico do salmista; “carne” conserva a imagem corporal do hebraico.
theological_decisions:
- issue: Sentido de בְּשָׂרִי em um contexto de sofrimento
  choice: carne física
  alternative: corpo
  rationale: O paralelismo com os lombos e a ausência de saúde indica sofrimento corporal literal, sem exigir uma leitura antropológica ou moral especializada.
- issue: Natureza da aflição expressa por נִקְלֶה
  choice: ardor físico, mantendo a descrição aberta
  alternative: feridas inflamadas ou indignidade
  rationale: O contexto favorece uma condição corporal ardente ou inflamada, mas o termo raro não permite definir com segurança uma lesão específica; por isso, evita-se acrescentar “feridas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura explicativa e a concretude corporal do hebraico, mas usa “parte sadia” para transmitir naturalmente a ausência completa de saúde.
