translation:
  language: pt
  text: Pois as tuas flechas se cravaram em mim[a], e a tua mão desceu sobre mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desceram em mim”, “me atravessaram” ou “me atingiram”. O verbo hebraico significa mais literalmente “descer” e, neste contexto, descreve as flechas alojando-se no salmista.'
    reason: lexical_alternative
  - marker: b
    text: A “mão” é uma imagem hebraica da ação e do poder de Deus, aqui experimentados como aflição ou disciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a causa ou fundamento do lamento e mantém de modo natural a força causal em português.
- source_word: חִצֶּיךָ
  choice: as tuas flechas
  rationale: Preserva literalmente o plural com sufixo de segunda pessoa e a metáfora bélica da aflição divina.
- source_word: נִחֲתוּ בִי
  choice: se cravaram em mim
  rationale: O verbo נחת denota descer; no contexto de flechas, a expressão comunica naturalmente que elas desceram e ficaram alojadas no salmista, sem reduzir a imagem a um simples golpe.
- source_word: וַתִּנְחַת עָלַי
  choice: desceu sobre mim
  rationale: Conserva a repetição da raiz נחת e a imagem de movimento descendente e pressão, com formulação digna e clara.
- source_word: יָדֶךָ
  choice: a tua mão
  rationale: Mantém o antropomorfismo concreto do hebraico sem substituí-lo interpretativamente por poder, juízo ou disciplina.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter literalmente «a tua mão»
  alternative: o teu poder; o teu juízo
  rationale: O hebraico apresenta uma imagem corporal concreta da atuação de Deus. Preservá-la evita impor uma explicação doutrinária não explicitada no verso.
- issue: Sentido da ação das flechas
  choice: «se cravaram em mim»
  alternative: desceram em mim; me atravessaram; me atingiram
  rationale: A escolha expressa em português o efeito contextual de flechas que descem e ficam alojadas, enquanto a nota registra o sentido mais literal e outras possibilidades sem eliminar a ambiguidade lexical.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A repetição da ideia de descida presente no hebraico é parcialmente preservada: de modo contextual em «se cravaram» e literalmente em «desceu». Os marcadores aparecem junto às respectivas imagens no texto.'
