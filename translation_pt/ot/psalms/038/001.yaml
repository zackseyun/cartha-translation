  text: יְֽהוָ֗ה אַל בְּ/קֶצְפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וּֽ/בַ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: pt
  text: Ó Yahweh,[a] não me repreendas[b] na tua ira, nem me disciplines[c] no teu furor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino; também transliterado «Javé» ou «Jeová» e tradicionalmente traduzido por «SENHOR».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «me corrijas».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «me castigues».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama e acrescenta a interjeição vocativa natural em português.
- source_word: אַל
  choice: não
  rationale: Introduz naturalmente a súplica negativa que rege as duas formas verbais paralelas.
- source_word: בְּקֶצְפְּךָ
  choice: na tua ira
  rationale: קֶצֶף denota ira ou indignação; a formulação mantém a preposição hebraica e distingue este termo do חֵמָה do segundo membro.
- source_word: תוֹכִיחֵנִי
  choice: me repreendas
  rationale: O hifil de יכח pode significar repreender, censurar ou corrigir; «repreender» é claro, atual e apropriado ao paralelismo.
- source_word: וּבַחֲמָתְךָ
  choice: nem ... no teu furor
  rationale: A conjunção continua a súplica negativa e, por isso, é vertida idiomaticamente por «nem». חֵמָה expressa ira intensa ou furor.
- source_word: תְיַסְּרֵנִי
  choice: me disciplines
  rationale: O piel de יסר comunica disciplina ou correção, muitas vezes com dimensão punitiva; «disciplinar» preserva essa amplitude sem decidir que se trata apenas de castigo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio YHWH. «Yahweh» procura representá-lo diretamente, em vez de substituí-lo por um título; a nota esclarece a forma hebraica.
- issue: Natureza da disciplina pedida pelo salmista
  choice: disciplinar
  alternative: castigar; corrigir
  rationale: O verbo יסר pode abranger correção formativa e punição. «Disciplinar» conserva essa tensão sem limitar antecipadamente o sentido teológico.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular para conservar a oração direta e o paralelismo poético. «Ira» e «furor» distinguem os dois termos hebraicos sem exagerar sua diferença semântica.
