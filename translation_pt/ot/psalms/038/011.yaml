  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: pt
  text: Os que me amam e os meus amigos mantêm-se afastados da minha aflição[a], e os meus parentes[b] ficam longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «meu golpe», «minha doença» ou «minha ferida». O termo hebraico pode indicar um golpe físico, uma afecção semelhante a uma doença ou uma ferida. A expressão também pode ser traduzida mais literalmente: «mantêm-se diante da minha aflição» ou «mantêm-se à distância da minha aflição».'
    reason: lexical_alternative
  - marker: b
    text: Ou «os que me são próximos».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: os que me amam
  rationale: Traduz diretamente o particípio com sufixo de primeira pessoa e evita que «meus amados» sugira apenas pessoas amadas pelo salmista, em vez de pessoas que o amam.
- source_word: וְרֵעַי
  choice: e os meus amigos
  rationale: «Amigos» expressa com clareza a relação pessoal indicada por רֵעַ e corresponde ao paralelismo do verso.
- source_word: מִנֶּגֶד נִגְעִי יַעֲמֹדוּ
  choice: mantêm-se afastados por causa da minha aflição
  rationale: No contexto, a imagem espacial de ficar diante ou à distância da aflição comunica afastamento social. «Por causa de» explicita a relação contextual sem restringir a natureza do sofrimento; a alternativa mais formal é preservada em nota.
- source_word: נִגְעִי
  choice: minha aflição
  rationale: O substantivo pode designar golpe, ferida ou afecção. «Aflição» mantém deliberadamente amplo o tipo de sofrimento corporal descrito.
- source_word: וּקְרוֹבַי
  choice: e os meus parentes
  rationale: קָרוֹב pode referir-se aos que são próximos e, em particular, a parentes. Aqui «parentes» oferece leitura natural e preserva a provável nuance familiar.
- source_word: מֵרָחֹק עָמָדוּ
  choice: ficam longe
  rationale: Expressa em português atual a posição continuada de distância e conserva o contraste com a proximidade relacional esperada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético é mantido por «mantêm-se afastados» e «ficam longe», sem identificar de modo excessivamente específico a aflição.
