base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: pt
  text: Não há parte sadia em minha carne por causa da tua indignação[a]; não há paz[b] em meus ossos por causa do meu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tua ira”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “bem-estar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: parte sadia
  rationale: O substantivo indica integridade ou condição íntegra. Na expressão negativa, “não há parte sadia” comunica naturalmente a ausência completa de saúde física.
- source_word: בִּבְשָׂרִי
  choice: em minha carne
  rationale: Preserva a imagem corporal concreta do hebraico e o paralelismo com “em meus ossos”.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição tem valor causal nas duas ocorrências, expresso com clareza no português atual.
- source_word: זַעְמֶךָ
  choice: tua indignação
  rationale: Expressa a forte ira ou desaprovação divina sem tornar o termo mais técnico do que o hebraico exige.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Mantém o equivalente mais direto e reconhecível, enquanto uma nota registra o sentido contextual mais amplo de bem-estar.
- source_word: בַּעֲצָמַי
  choice: em meus ossos
  rationale: Traduz literalmente a imagem hebraica de sofrimento profundo e preserva sua força poética.
- source_word: חַטָּאתִי
  choice: meu pecado
  rationale: É a tradução direta e natural do termo no contexto da confissão do salmista.
theological_decisions:
- issue: Relação entre a indignação divina, o pecado e o sofrimento do salmista
  choice: 'Manter explicitamente as duas relações causais: o sofrimento corporal ocorre por causa da indignação de Deus e por causa do pecado do salmista.'
  alternative: Entender a linguagem apenas como descrição poética de alienação sentida, sem afirmar diretamente uma relação causal.
  rationale: O hebraico apresenta ambas as causas sem explicar o mecanismo nem formular uma doutrina geral sobre todo sofrimento; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva o paralelismo poético e as imagens concretas de carne e ossos.
