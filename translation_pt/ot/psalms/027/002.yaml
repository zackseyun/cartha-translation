  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: pt
  text: Quando malfeitores se aproximaram de mim para devorar minha carne,[a] meus adversários e meus inimigos — foram eles que tropeçaram e caíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para comer minha carne”. A expressão hebraica é uma imagem vívida de ataque violento.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: Quando ... se aproximaram
  rationale: O infinitivo construto com בְּ introduz uma circunstância temporal. A formulação é natural em português e preserva o sentido de aproximação.
- source_word: מְרֵעִים
  choice: malfeitores
  rationale: O particípio designa pessoas que praticam o mal; “malfeitores” conserva de modo conciso sua força moral.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: para devorar minha carne
  rationale: “Devorar” comunica naturalmente a violência da imagem, enquanto “carne” preserva sua expressão concreta e visceral.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: meus adversários e meus inimigos
  rationale: Mantém os dois substantivos paralelos. Os possessivos já exprimem em português a relação hostil indicada por לִי, evitando a redundância de “contra mim”.
- source_word: הֵמָּה
  choice: foram eles que
  rationale: A construção clivada reproduz a ênfase do pronome independente hebraico sem recorrer a uma formulação artificial.
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: tropeçaram e caíram
  rationale: Preserva a sequência vívida dos dois verbos e não especifica indevidamente se a derrota é física, militar ou figurada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, e a ênfase de הֵמָּה foi preservada por meio de “foram eles que”. O travessão mantém a pausa enfática do verso.
