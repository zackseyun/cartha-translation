reference: Psalms 27:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: pt
  text: E agora a minha cabeça se erguerá acima dos inimigos que me cercam. Em sua tenda[a], oferecerei sacrifícios de aclamação[b]; cantarei e farei música a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “sua” refere-se mais naturalmente a Yahweh.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sacrifícios acompanhados de gritos de alegria”. A expressão hebraica pode destacar tanto o caráter dos sacrifícios quanto a aclamação que os acompanha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o contexto anterior quanto a mudança para a expectativa presente ou iminente.
- source_word: יָרוּם רֹאשִׁי
  choice: a minha cabeça se erguerá
  rationale: Mantém a imagem hebraica da cabeça erguida como sinal de honra, confiança e vitória, em português natural.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: acima dos inimigos que me cercam
  rationale: Conserva a ideia simultânea de exaltação sobre os inimigos e de inimigos ao redor do salmista.
- source_word: וְאֶזְבְּחָה
  choice: oferecerei
  rationale: A forma coortativa expressa determinação; com o objeto 'sacrifícios', 'oferecerei' evita uma repetição pouco natural sem perder o sentido cultual.
- source_word: בְּאָהֳלוֹ
  choice: em sua tenda
  rationale: Traduz literalmente a imagem do santuário e mantém o pronome do texto hebraico.
- source_word: זִבְחֵי תְרוּעָה
  choice: sacrifícios de aclamação
  rationale: A expressão preserva o vínculo construto e o caráter sonoro e celebrativo de תְרוּעָה, sem definir de modo excessivo se a aclamação caracteriza ou acompanha os sacrifícios.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: cantarei e farei música
  rationale: Representa os dois verbos paralelos e a determinação enfática de louvar, evitando reduzi-los a um único ato.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de traduzir o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Referente do pronome em בְּאָהֳלוֹ
  choice: a tenda de Yahweh
  alternative: a tenda do salmista
  rationale: O contexto de sacrifício e louvor, junto com a linguagem de santuário no salmo, torna Yahweh o referente mais natural, embora o pronome isolado seja gramaticalmente capaz de outra referência.
- issue: Relação entre os sacrifícios e a aclamação em זִבְחֵי תְרוּעָה
  choice: sacrifícios de aclamação
  alternative: sacrifícios acompanhados de gritos de alegria
  rationale: O construto hebraico permite entender a aclamação como característica dos sacrifícios ou como som que os acompanha; a tradução principal mantém a formulação compacta e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A imagem concreta da cabeça erguida e a linguagem do santuário foram preservadas; evitou-se vocabulário eclesiástico desnecessariamente tradicional.
