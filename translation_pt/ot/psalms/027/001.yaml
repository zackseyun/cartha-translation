  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: pt
  text: 'De Davi.[a]


    Yahweh é a minha luz e a minha salvação; de quem terei medo? Yahweh é a fortaleza da minha vida; de quem terei pavor?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por Davi” ou “Para Davi”. No sobrescrito, o hebraico לְדָוִד pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a formulação tradicional e a ambiguidade da preposição לְ, que pode indicar autoria, associação ou dedicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אוֹרִי
  choice: a minha luz
  rationale: Mantém diretamente a metáfora transparente do hebraico אוֹר.
- source_word: וְיִשְׁעִי
  choice: e a minha salvação
  rationale: Expressa o sentido de livramento ou salvação e conserva o termo teológico amplo e corrente.
- source_word: מִמִּי אִירָא
  choice: de quem terei medo?
  rationale: O português admite naturalmente a preposição presente no hebraico; o futuro expressa bem a força modal da pergunta retórica.
- source_word: מָעוֹז חַיַּי
  choice: a fortaleza da minha vida
  rationale: Fortaleza preserva a imagem de força defensiva e proteção; da minha vida reproduz a relação construta sem explicá-la em excesso.
- source_word: מִמִּי אֶפְחָד
  choice: de quem terei pavor?
  rationale: Pavor distingue פָּחַד de יָרֵא e comunica sua possível intensidade, ao mesmo tempo que mantém o paralelismo poético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. A transliteração Yahweh o preserva sem substituí-lo por um título nem adotar a forma híbrida tradicional Jeová.
- issue: Relação indicada por לְדָוִד no sobrescrito
  choice: De Davi
  alternative: Por Davi; Para Davi
  rationale: De Davi conserva em português a possível autoria ou associação sem decidir além do que permite a expressão hebraica.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. Os artigos em “a minha luz” e construções semelhantes são naturais na leitura brasileira e amplamente compreensíveis. “Pavor” mantém uma variação lexical que reflete os dois verbos hebraicos para temer.
