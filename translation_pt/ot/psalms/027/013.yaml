  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: pt
  text: Eu teria perdido a coragem, se não tivesse crido que veria a bondade de Yahweh na terra dos viventes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deixa a frase suspensa: literalmente, “Se não tivesse crido que veria a bondade de Yahweh na terra dos viventes...”. A oração “Eu teria perdido a coragem” está implícita e foi completada conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵא
  choice: se não
  rationale: Introduz uma condição contrária ao fato. Em português, “se não tivesse” expressa naturalmente essa força e permite completar a oração principal que está elíptica no hebraico.
- source_word: הֶאֱמַנְתִּי
  choice: tivesse crido
  rationale: O hifil de אמן significa aqui “crer” ou “confiar”. O pretérito mais-que-perfeito composto do subjuntivo concorda com a condição contrafactual introduzida por לוּלֵא.
- source_word: לִרְאוֹת
  choice: que veria
  rationale: Embora a forma hebraica seja um infinitivo, a oração completiva com “que veria” comunica em português corrente o conteúdo prospectivo da fé.
- source_word: בְּטוּב
  choice: a bondade
  rationale: טוּב pode indicar bondade, benefícios ou abundância. “Bondade” conserva a amplitude do termo sem restringi-lo a bênçãos materiais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Reproduz o conhecido idiomatismo hebraico que designa o domínio dos que estão vivos, em contraste com a morte ou o Sheol.
- source_word: '[apódose implícita após לוּלֵא]'
  choice: Eu teria perdido a coragem
  rationale: O hebraico omite a oração principal. A expressão explicita com cautela o resultado sugerido pelo contexto, especialmente pela exortação à coragem no versículo seguinte.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Explicitação da apódose omitida
  choice: Eu teria perdido a coragem
  alternative: 'Deixar a frase suspensa: “Se não tivesse crido...”'
  rationale: A construção hebraica é deliberadamente elíptica, mas uma reprodução fragmentária seria pouco natural em português. A complementação escolhida é marcada em nota e se apoia no contexto imediato, sem apresentar como expresso no hebraico aquilo que está apenas implícito.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe natural para uma condição contrafactual. “Terra dos viventes” mantém o idiomatismo bíblico ainda inteligível. A única explicitação interpretativa é assinalada em nota.
