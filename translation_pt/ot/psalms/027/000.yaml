base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: pt
  text: 'De Davi.[a]


    Yahweh é minha luz e minha salvação; de quem terei medo? Yahweh é a fortaleza da minha vida; de quem terei medo?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Por Davi» ou «Para Davi». No sobrescrito, o hebraico לְדָוִד pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A expressão do sobrescrito pode indicar autoria ou associação; «De Davi» é natural em português e mantém a leitura tradicional sem excluir totalmente outras relações possíveis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אוֹרִי
  choice: minha luz
  rationale: Preserva diretamente a metáfora hebraica.
- source_word: יִשְׁעִי
  choice: minha salvação
  rationale: Reproduz o substantivo hebraico e conserva sua amplitude, que pode envolver livramento e segurança.
- source_word: מָעוֹז חַיַּי
  choice: a fortaleza da minha vida
  rationale: «Fortaleza» comunica um lugar ou fonte de proteção segura; a construção mantém a formulação metafórica e a relação com «minha vida».
- source_word: אִירָא / אֶפְחָד
  choice: terei medo / tremerei
  rationale: A variação evita uma repetição rígida e reflete os dois verbos hebraicos relacionados ao medo; «tremerei» expressa temor intenso sem ampliar indevidamente o sentido.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: O original traz o tetragrama; usar «Yahweh» torna explícito que se trata do nome pessoal divino e segue a camada inglesa fornecida.
- issue: Sentido do sobrescrito לְדָוִד
  choice: De Davi
  alternative: Por Davi / Para Davi
  rationale: A preposição לְ pode marcar autoria, pertencimento, dedicação ou associação. A tradução principal adota a formulação portuguesa mais tradicional, enquanto a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético e as perguntas retóricas foram preservados. O sobrescrito foi separado do corpo do salmo, e não se acrescentou nota indevida à expressão «minha vida».
