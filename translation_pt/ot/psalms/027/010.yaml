base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: pt
  text: Pois meu pai e minha mãe me abandonaram, mas Yahweh me acolherá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me recolherá”. O verbo hebraico significa literalmente “reunir, recolher” e, aqui, comunica a ideia de receber alguém sob cuidado e proteção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva o valor explicativo ou fundamentador da conjunção no contexto, sem impor uma leitura concessiva como “ainda que”.
- source_word: אָבִי וְאִמִּי
  choice: meu pai e minha mãe
  rationale: Tradução direta e natural da construção possessiva coordenada.
- source_word: עֲזָבוּנִי
  choice: me abandonaram
  rationale: עזב pode significar deixar ou abandonar; “abandonaram” comunica com clareza o peso afetivo do verbo. O perfeito hebraico é mantido como passado, preservando a forma da afirmação sem decidir se a situação é real, hipotética ou proverbial.
- source_word: וַיהוָה
  choice: mas Yahweh
  rationale: A conjunção é formalmente aditiva, porém aqui marca o forte contraste entre o abandono humano e o acolhimento divino; “mas” expressa essa relação naturalmente.
- source_word: יַאַסְפֵנִי
  choice: me acolherá
  rationale: אסף significa literalmente reunir ou recolher e, neste contexto pessoal, transmite receber sob cuidado e proteção. “Acolherá” é idiomático em português e conserva esse sentido sem restringi-lo à hospedagem.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome da aliança de forma transparente, em conformidade com a camada de consulta fornecida, sem substituí-lo por um título.
- issue: Natureza do abandono pelos pais
  choice: 'afirmação não qualificada: “me abandonaram”'
  alternative: 'leitura concessiva ou hipotética: “ainda que me abandonem”'
  rationale: O hebraico emprega o perfeito עֲזָבוּנִי e כִּי não exige valor concessivo. A tradução preserva a tensão do enunciado sem convertê-lo em hipótese.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acolherá” oferece naturalidade sem perder a imagem de recepção protetora; a alternativa literal é preservada em nota.
