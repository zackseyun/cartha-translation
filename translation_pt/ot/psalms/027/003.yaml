  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: pt
  text: Ainda que um exército acampe contra mim[a], meu coração não terá medo; ainda que a guerra se levante contra mim, mesmo nisso confio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se um exército acampar contra mim... se a guerra se levantar contra mim”. O hebraico pode ser entendido de modo condicional (“se”) ou concessivo (“ainda que”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “apesar disso, estou confiante”. A expressão hebraica é concisa e pode enfatizar tanto a confiança quanto a segurança diante da ameaça.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ainda que
  rationale: Neste paralelismo poético, a partícula pode ser condicional (“se”) ou concessiva. “Ainda que” comunica naturalmente que nem mesmo a ameaça descrita abalará o salmista.
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: um exército acampe
  rationale: O verbo significa “acampar”, e o substantivo, literalmente “acampamento”, designa aqui, por metonímia e em paralelo com “guerra”, uma força armada.
- source_word: לֹא יִירָא לִבִּי
  choice: meu coração não terá medo
  rationale: Preserva “meu coração” como sujeito explícito e mantém a expressão antropológica do hebraico em português claro.
- source_word: תָּקוּם ... מִלְחָמָה
  choice: a guerra se levante
  rationale: Mantém a imagem vívida do verbo קום, “levantar-se/surgir”, sem reduzir a expressão a uma paráfrase.
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: mesmo nessa situação continuarei confiante
  rationale: A formulação associa o demonstrativo à ameaça recém-descrita, mas não acrescenta um objeto explícito para a confiança. “Confiante” representa o campo semântico de בטח e soa natural em português.
theological_decisions:
- issue: Referência e sentido de בְּזֹאת
  choice: “mesmo nessa situação continuarei confiante”, apontando para as circunstâncias ameaçadoras descritas
  alternative: “nisso confio”, possivelmente remetendo ao SENHOR no contexto anterior, ou “apesar disso, estou confiante”
  rationale: O antecedente imediato mais natural é o cenário de exército e guerra. A tradução conserva a concisão e não introduz explicitamente Deus como objeto quando o versículo não o nomeia.
- issue: Valor de אִם nas duas orações
  choice: 'concessivo: “ainda que”'
  alternative: 'condicional: “se”'
  rationale: O movimento poético enfatiza confiança mesmo diante da ameaça; contudo, a possibilidade gramatical condicional é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “ainda que” conserva o paralelismo, e “meu coração” mantém a imagem hebraica. A tradução evita explicitar um objeto para a confiança que o verso deixa implícito.
