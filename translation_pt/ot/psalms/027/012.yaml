source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: pt
  text: Não me entregues ao desejo dos meus adversários,[a] pois falsas testemunhas se levantaram contra mim e respiram violência.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vontade dos meus adversários”. Aqui, o substantivo hebraico traduzido por “desejo” pode significar desejo, apetite ou vontade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e alguém que respira violência”. A expressão final está no singular em hebraico e pode destacar cada falsa testemunha ou acrescentar uma figura singular.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: me entregues
  rationale: Com אַל, נתן exprime a súplica negativa para não ser entregue ao poder de outros; “não me entregues” é natural e fiel em português.
- source_word: בְּנֶפֶשׁ
  choice: ao desejo de
  rationale: נֶפֶשׁ, nesta construção, indica desejo, apetite ou vontade, não “alma” em sentido estrito.
- source_word: צָרָי
  choice: meus adversários
  rationale: Designa opositores hostis; “adversários” preserva tanto o conflito pessoal quanto a possível ambientação judicial.
- source_word: קָמוּ בִי
  choice: se levantaram contra mim
  rationale: קום com בְּ indica levantar-se contra alguém; a formulação mantém a imagem e é idiomática.
- source_word: עֵדֵי שֶׁקֶר
  choice: falsas testemunhas
  rationale: Equivalente jurídico natural para testemunhas caracterizadas pela falsidade.
- source_word: וִיפֵחַ חָמָס
  choice: e respiram violência
  rationale: Mantém a vívida metáfora de expelir ou proferir violência. Embora a forma hebraica seja singular, pode caracterizar coletivamente as testemunhas plurais no contexto.
- source_word: חָמָס
  choice: violência
  rationale: Abrange violência, injustiça cruel e dano opressivo; “violência” preserva a força do termo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva o paralelismo da súplica e a imagem concreta de “respirar violência”, sem reduzir נֶפֶשׁ a “alma” nem eliminar a oscilação de número na cláusula final.
