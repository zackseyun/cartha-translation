  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: pt
  text: Pois ele me esconderá em seu abrigo[a] no dia da adversidade[b]; ele me ocultará no esconderijo de sua tenda; sobre uma rocha me elevará[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua cabana”, “em seu pavilhão” ou “em seu tabernáculo”. O termo hebraico designa uma estrutura que oferece proteção e pode ter ressonâncias do santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “no dia do mal” ou “no dia da calamidade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “me colocará no alto, sobre uma rocha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da confiança expressa no contexto anterior, preservando o valor explicativo da conjunção.
- source_word: יִצְפְּנֵנִי
  choice: ele me esconderá
  rationale: O verbo צפן comunica ocultação com finalidade protetora; esta formulação é natural e mantém a imagem concreta.
- source_word: בְּסֻכּוֹ
  choice: em seu abrigo
  rationale: סֻכָּה designa uma estrutura de proteção, como cabana ou cobertura. “Abrigo” transmite a função protetora sem excluir possíveis ressonâncias do santuário.
- source_word: בְּיוֹם רָעָה
  choice: no dia da adversidade
  rationale: Neste contexto, רָעָה indica aflição, desgraça ou calamidade, e não necessariamente mal moral. “Adversidade” conserva essa amplitude.
- source_word: יַסְתִּרֵנִי
  choice: ele me ocultará
  rationale: סתר é outro verbo de esconder ou encobrir. “Ocultará” preserva o paralelismo sem repetir exatamente “esconderá”.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: no esconderijo de sua tenda
  rationale: סֵתֶר denota um lugar oculto, e אֹהֶל significa literalmente “tenda”. A expressão mantém tanto a localização protegida quanto a imagem concreta.
- source_word: בְּצוּר
  choice: sobre uma rocha
  rationale: צוּר denota rocha ou penhasco e, aqui, evoca firmeza, segurança e uma posição inacessível aos inimigos.
- source_word: יְרוֹמְמֵנִי
  choice: me elevará
  rationale: O verbo רום significa levantar ou colocar no alto. “Elevará” preserva o movimento vertical e a ideia de proteção sem impor o sentido teológico de exaltação honorífica.
theological_decisions:
- issue: Possíveis ressonâncias do santuário em סֻכּוֹ e אָהֳלוֹ
  choice: Manter as imagens concretas de “abrigo” e “tenda”, sem tornar explícita uma referência ao tabernáculo.
  alternative: Traduzir com linguagem cultual, como “tabernáculo”, “santuário” ou “pavilhão”.
  rationale: Os substantivos hebraicos podem evocar o santuário no contexto do salmo, mas continuam sendo termos concretos comuns. A tradução preserva essa possível ressonância sem restringir a imagem a uma interpretação cultual.
- issue: Sentido de רָעָה em בְּיוֹם רָעָה
  choice: Entender como adversidade ou calamidade.
  alternative: Traduzir como “mal”, com possível sentido moral.
  rationale: O contexto trata de perigo e necessidade de proteção. Assim, o sentido circunstancial de aflição ou calamidade é o mais provável, embora o termo hebraico seja mais amplo.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final “sobre uma rocha me elevará” conserva a ênfase poética do hebraico na rocha e o paralelismo, sem soar arcaica. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
