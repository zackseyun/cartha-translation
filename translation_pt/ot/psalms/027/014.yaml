  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: pt
  text: Espere por Yahweh[a]; seja forte, e que seu coração se fortaleça[b]. Sim, espere por Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Espere por” também pode ser traduzido como “ponha a esperança em”, ressaltando a confiança expectante além da espera paciente.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ele fortalecerá seu coração”. A forma verbal hebraica também pode ser entendida com valor preditivo, em vez de exortativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: Espere por / espere por
  rationale: O imperativo piel de קוה expressa espera confiante e cheia de expectativa. “Espere por” mantém tanto a dimensão temporal quanto a confiança dirigida a Yahweh, e a repetição hebraica é preservada.
- source_word: אֶל
  choice: por
  rationale: Com קוה, a preposição indica aquele em quem se concentra a espera. Em português, “esperar por Yahweh” é uma construção natural e conserva a expectativa dirigida a ele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: חֲזַק
  choice: seja forte
  rationale: Conserva a força imperativa de חזק sem especificar indevidamente se a força é emocional, moral ou espiritual.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: e que o seu coração se fortaleça
  rationale: No contexto de imperativos, a forma verbal pode ter valor volitivo ou exortativo. A formulação mantém “seu coração” como sujeito explícito e produz uma exortação natural em português.
- source_word: לִבֶּךָ
  choice: seu coração
  rationale: Preserva a imagem hebraica do coração como centro da disposição interior, da firmeza e da coragem.
- source_word: וְקַוֵּה
  choice: Sim, espere por
  rationale: “Sim” comunica a retomada enfática do imperativo final, preservando a repetição poética sem torná-la pesada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Valor sintático de וְיַאֲמֵץ
  choice: 'exortativo/volitivo: “que o seu coração se fortaleça”'
  alternative: 'preditivo: “ele fortalecerá o seu coração”'
  rationale: A sequência de imperativos favorece a continuação da exortação, mas a morfologia também permite entender a forma como uma declaração sobre o que Yahweh fará. A alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. A estrutura breve e paralela do hebraico foi mantida; “seu coração” preserva a imagem original, e “Sim” marca naturalmente a repetição enfática final.
