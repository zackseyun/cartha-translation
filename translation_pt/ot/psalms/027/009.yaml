source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: pt
  text: Não escondas de mim o teu rosto; não afastes com ira o teu servo.[a] Tu tens sido o meu auxílio. Não me rejeites nem me abandones, ó Deus da minha salvação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não desvies com ira o teu servo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Deus do meu livramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: escondas
  rationale: סתר significa esconder ou ocultar. “Esconder” preserva de modo natural a imagem relacional do rosto de Deus.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: Mantém a imagem antropomórfica explícita do hebraico, sem reduzi-la à ideia abstrata de presença.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Equivalência direta e idiomática dentro da expressão “esconder de mim o teu rosto”.
- source_word: תַּט בְּאַף
  choice: afastes com ira
  rationale: נטה pode significar inclinar, desviar ou afastar. Com “teu servo” como objeto e בְאַף, a frase expressa afastamento motivado por ira, sem explicitar além do hebraico a ideia de rejeição.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: No contexto da oração, designa humildade e devoção diante de Deus; “servo” comunica isso melhor do que “escravo” aqui.
- source_word: עֶזְרָתִי
  choice: o meu auxílio
  rationale: עזרה denota ajuda ou auxílio. “Meu auxílio” funciona naturalmente como predicativo e conserva a formulação nominal.
- source_word: הָיִיתָ
  choice: tens sido
  rationale: O perfeito aponta para a ajuda já experimentada de Deus e ainda relevante no presente.
- source_word: תִּטְּשֵׁנִי
  choice: me rejeites
  rationale: נטש pode indicar deixar, abandonar ou rejeitar. “Rejeitar” transmite a força relacional e permite distingui-lo do verbo seguinte.
- source_word: תַּעַזְבֵנִי
  choice: me abandones
  rationale: עזב significa deixar ou abandonar. “Abandonar” é atual, forte e claramente distinto de “rejeitar”.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: ó Deus da minha salvação
  rationale: Preserva a construção nominal e o peso teológico de ישע; “ó” assinala naturalmente o vocativo.
theological_decisions:
- issue: Linguagem antropomórfica em “o teu rosto”
  choice: Manter “o teu rosto” no texto principal
  alternative: a tua presença
  rationale: O hebraico usa explicitamente “rosto”, imagem bíblica da presença e do favor divinos. Preservá-la mantém a textura poética e a tensão própria do texto.
- issue: Sentido de עבד na relação com Deus
  choice: servo
  alternative: escravo
  rationale: Neste apelo do salmo, o termo enfatiza devoção humilde e relação com Deus, não a condição jurídica de escravidão.
- issue: Relação entre נטש e עזב
  choice: Distinguir como “rejeites” e “abandones”
  alternative: Traduzir ambos por formas de “abandonar”
  rationale: Os verbos têm campos semânticos sobrepostos, mas a diferenciação em português conserva o paralelismo cumulativo sem criar uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com o discurso direto a Deus. Mantém o paralelismo hebraico, a imagem do rosto e a construção “Deus da minha salvação”, evitando arcaísmos desnecessários.
