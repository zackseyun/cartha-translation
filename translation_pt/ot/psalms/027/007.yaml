  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: pt
  text: Ouve, Yahweh, a minha voz quando clamo[a]; sê bondoso comigo[b] e responde-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Ouve, Yahweh, a minha voz; eu clamo”. A justaposição poética também pode ser expressa em português como “Ouve, Yahweh, a minha voz, pois clamo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mostra-me teu favor”; tradicionalmente, “tem misericórdia de mim”. O verbo hebraico חנן expressa a concessão bondosa de favor ou graça.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouve
  rationale: Imperativo direto de שׁמע, que pede atenção efetiva. “Ouve” preserva a forma concisa e solene da súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Mantém a expressão concreta do hebraico, em vez de reduzi-la simplesmente a “a mim”.
- source_word: אֶקְרָא
  choice: quando clamo
  rationale: O imperfeito de קרא descreve aqui o ato de invocar Deus em voz alta. “Quando clamo” é natural em português e conserva o caráter urgente da oração.
- source_word: וְחָנֵּנִי
  choice: sê bondoso comigo
  rationale: חנן pede favor gracioso. A formulação é clara e natural, sem restringir o sentido apenas a piedade diante do sofrimento.
- source_word: וַעֲנֵנִי
  choice: responde-me
  rationale: Equivalente direto e idiomático de ענה no contexto de uma oração dirigida a Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; “Yahweh” preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Sentido de חנן na súplica
  choice: sê bondoso comigo
  alternative: tem misericórdia de mim
  rationale: A escolha mantém a ideia de favor concedido por graça, ao passo que a alternativa tradicional pode enfatizar mais especificamente compaixão ou misericórdia. O texto não exige que essas nuances sejam separadas rigidamente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe própria da oração poética. A colocação pronominal em “responde-me” e o imperativo “sê” mantêm solenidade sem recorrer a linguagem arcaica. A repetição concreta de “voz” preserva a imagem hebraica.
