  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: pt
  text: 'Da tua parte, meu coração diz[a]: “Busquem a minha face.” Tua face[b], Yahweh, eu busco[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O início hebraico é difícil. Também pode ser entendido como: “A ti, meu coração diz”; ou, com outra análise da construção: “Meu coração diz a teu respeito: ‘Busquem a face dele’”.'
    reason: alternative_reading
  - marker: b
    text: Ou “Tua presença”. Em hebraico, “face” muitas vezes tem o sentido de presença pessoal.
    reason: lexical_alternative
  - marker: c
    text: Ou “buscarei”. O verbo hebraico pode expressar resolução presente ou intenção futura.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Em teu nome
  rationale: A construção com אָמַר לִבִּי é sintaticamente difícil. “Em teu nome” expressa a possibilidade de o coração falar da parte de Yahweh, sem alterar o texto massorético; outras construções possíveis são registradas em nota.
- source_word: אָמַר לִבִּי
  choice: meu coração diz
  rationale: Embora אָמַר seja formalmente perfeito, no discurso poético pode apresentar como atual a voz interior do salmista. O presente é natural em português e combina com a resolução expressa no segundo membro.
- source_word: בַּקְּשׁוּ
  choice: Busquem
  rationale: O imperativo é plural. “Busquem” preserva tanto o número quanto a força direta da exortação.
- source_word: פָנָי
  choice: a minha face
  rationale: Mantém o sentido literal e a repetição de “face” no segundo membro. Embora o termo possa designar presença pessoal, a imagem relacional é importante no paralelismo.
- source_word: אֶת פָּנֶיךָ
  choice: Tua face
  rationale: Preserva a repetição lexical do hebraico e a imagem de procurar acesso pessoal a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֲבַקֵּשׁ
  choice: eu busco
  rationale: O imperfeito na primeira pessoa pode expressar resolução presente ou intenção futura. O presente traduz bem a resposta imediata do salmista; a possibilidade futura é mantida em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da oração difícil לְךָ אָמַר לִבִּי
  choice: 'O coração fala em nome de Yahweh: “Em teu nome, meu coração diz: ‘Busquem a minha face’”'
  alternative: '“A ti diz o meu coração” ou “Meu coração diz a teu respeito: ‘Busquem a face dele’”'
  rationale: A sintaxe hebraica é elíptica e admite mais de uma análise. A leitura adotada conserva o texto massorético e entende que o coração ecoa o convite divino, mas a nota mantém as alternativas genuínas.
- issue: Valor temporal de אֲבַקֵּשׁ
  choice: eu busco
  alternative: buscarei
  rationale: A forma pode indicar busca presente e resoluta ou intenção futura; o corpo do texto adota o presente sem excluir o futuro, registrado em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa (“teu”, “tua”) coerentes com a fala dirigida a Deus. Conservou-se “face” nas duas ocorrências para manter a repetição poética e a imagem hebraica; a pontuação explicita a fala citada sem eliminar a dificuldade sintática, documentada em nota.
