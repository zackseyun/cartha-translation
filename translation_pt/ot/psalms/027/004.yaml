source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: pt
  text: 'Uma coisa pedi a Yahweh[a], e é isto que buscarei: habitar na casa de Yahweh todos os dias da minha vida, para contemplar a beleza[b] de Yahweh e indagar em seu templo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, o nome divino; tradicionalmente traduzido como “SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Ou “a agradabilidade”, “o encanto” ou “o favor”.
    reason: lexical_alternative
  - marker: c
    text: Ou “buscar em seu templo” ou “meditar em seu templo”. O verbo hebraico é difícil neste contexto e pode transmitir a ideia de investigação atenta, busca de orientação ou contemplação no santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Uma coisa
  rationale: O numeral feminino singular funciona como substantivo e enfatiza o único desejo do salmista; “uma coisa” é natural e fiel em português.
- source_word: שָׁאַלְתִּי
  choice: pedi
  rationale: O perfeito hebraico apresenta um pedido já feito, cuja relevância continua no propósito expresso em seguida.
- source_word: מֵאֵת יְהוָה
  choice: a Yahweh
  rationale: Em português, “pedir algo a alguém” expressa naturalmente a pessoa a quem o pedido é dirigido, correspondendo à relação indicada pela preposição hebraica.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: e é isto que buscarei
  rationale: O pronome retoma enfaticamente a única coisa pedida, e o imperfeito comunica propósito ou busca contínua.
- source_word: שִׁבְתִּי
  choice: habitar
  rationale: Neste contexto, o termo indica permanência na casa de Deus, não meramente o ato físico de sentar-se.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva de modo direto a imagem da habitação e do santuário divinos.
- source_word: כָּל יְמֵי חַיַּי
  choice: todos os dias da minha vida
  rationale: Reproduz a extensão temporal completa da expressão hebraica em português corrente.
- source_word: לַחֲזוֹת
  choice: para contemplar
  rationale: Comunica uma visão atenta e reverente, mais adequada ao contexto do que o simples “ver”.
- source_word: בְּנֹעַם יְהוָה
  choice: a beleza de Yahweh
  rationale: נֹעַם pode indicar beleza, encanto, agradabilidade ou favor; “beleza” é natural no contexto contemplativo, sem eliminar as alternativas, registradas em nota.
- source_word: וּלְבַקֵּר
  choice: e indagar
  rationale: O verbo é semanticamente difícil neste contexto. “Indagar” preserva a ideia de busca atenta no santuário sem definir de modo indevido se se trata de consulta, procura ou meditação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio divino, não um título. “Yahweh” o representa por transliteração, enquanto a nota informa a convenção tradicional sem substituir silenciosamente o nome.
- issue: Sentido de נֹעַם יְהוָה
  choice: a beleza de Yahweh
  alternative: a agradabilidade de Yahweh; o encanto de Yahweh; o favor de Yahweh
  rationale: O substantivo admite nuances estéticas, afetivas e favoráveis. A tradução escolhe a formulação mais natural no contexto de contemplação, e a nota preserva a amplitude lexical.
- issue: Sentido cultual de וּלְבַקֵּר
  choice: indagar em seu templo
  alternative: buscar em seu templo; meditar em seu templo; procurar orientação em seu templo
  rationale: A forma verbal é discutida e pode apontar para investigação, busca ou contemplação no santuário. A redação principal evita especificar um objeto não expresso, e a nota mantém as leituras plausíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção mantém o paralelismo entre o pedido já feito e a busca resoluta, preserva a imagem da casa/templo e sinaliza em notas as ambiguidades reais de נֹעַם e בּקר.
