base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: pt
  text: Ensina-me o teu caminho, ó Yahweh, e guia-me por uma vereda plana, por causa dos meus inimigos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa dos que me observam com hostilidade”. O termo hebraico pode designar inimigos, inclusive adversários que espreitam ou aguardam uma oportunidade para agir contra o salmista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ensina-me
  rationale: O hifil de ירה tem aqui o sentido de ensinar ou instruir. “Ensina-me” preserva o caráter pedagógico da oração e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: דֶּרֶךְ pode designar caminho, conduta ou modo de agir. A formulação conserva tanto a imagem concreta quanto a possível dimensão moral.
- source_word: וּנְחֵנִי
  choice: e guia-me
  rationale: נחה significa conduzir ou guiar. “Guia-me” é idiomático em oração e mantém a metáfora de percurso.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: por uma vereda plana
  rationale: אֹרַח é uma vereda ou senda, e מִישׁוֹר denota terreno plano ou nivelado, podendo sugerir também retidão. A tradução preserva primeiramente a imagem concreta sem excluir sua ressonância moral.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Neste contexto, introduz a circunstância ou razão ligada à presença de adversários. “Por causa de” é claro e natural, sem especificar além do hebraico como a situação deles motiva o pedido.
- source_word: שׁוֹרְרָי
  choice: meus inimigos
  rationale: O termo designa adversários hostis e pode evocar pessoas que observam ou espreitam em busca de uma oportunidade. “Meus inimigos” comunica o sentido principal; a nuance mais específica é mantida em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no hebraico e evita substituí-lo silenciosamente por um título.
- issue: Sentido moral ou topográfico de מִישׁוֹר
  choice: plana
  alternative: reta; segura
  rationale: “Plana” mantém o sentido concreto primário de terreno nivelado e deixa que a ideia figurada de retidão permaneça implícita, sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O paralelismo e a imagem de caminho foram preservados. O marcador da nota foi colocado após “inimigos”, termo ao qual a alternativa lexical se refere.
