  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: pt
  text: 'Cântico das subidas.[a]


    Na minha angústia, clamei a Yahweh,

    e ele me respondeu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Título hebraico tradicional dos Salmos 120–134. A expressão também pode ser traduzida como «Cântico das ascensões»; sua referência exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz diretamente o substantivo hebraico como uma composição cantada e mantém o registro tradicional e digno dos títulos dos salmos.
- source_word: הַמַּעֲלוֹת
  choice: das subidas
  rationale: Preserva o sentido concreto de movimento para cima e a ambiguidade da expressão tradicional, sem determinar se se trata de peregrinações, degraus ou outra espécie de subida.
- source_word: אֶל
  choice: a
  rationale: Com o verbo «clamar», a preposição portuguesa «a» expressa naturalmente a direção do apelo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּצָּרָתָה לִּי
  choice: Na minha angústia
  rationale: Expressa de modo natural o idiomatismo hebraico «na angústia para mim», conservando sua intensidade.
- source_word: קָרָאתִי
  choice: clamei
  rationale: No contexto de angústia e oração dirigida a Deus, «clamei» comunica de forma concisa o ato de chamar, sem a expansão de «gritei por socorro».
- source_word: וַיַּעֲנֵנִי
  choice: e ele me respondeu
  rationale: Mantém a sequência narrativa marcada pela conjunção e explicita em português o sujeito implícito, identificado pelo contexto como Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino. «Yahweh» o representa diretamente, enquanto «SENHOR» o substitui por um título e «Jeová» reflete uma forma híbrida posterior.
- issue: Sentido do título הַמַּעֲלוֹת
  choice: das subidas
  alternative: de peregrinação; dos degraus
  rationale: A origem ou referência precisa desse título é incerta. A tradução mantém a imagem de movimento ascendente sem adotar como certa uma explicação histórica ou litúrgica específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Cântico» preserva o tom dos títulos dos salmos; «das subidas» evita uma interpretação histórica excessivamente específica. A disposição em linhas poéticas distingue o título do versículo.
