  text: מַה יִּתֵּ֣ן לְ֭/ךָ וּ/מַה יֹּסִ֥יף לָ֗/ךְ לָשׁ֥וֹן רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: pt
  text: O que ele dará a você[a], e o que mais acrescentará a você, ó língua enganosa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que ele fará a você, e o que mais fará a você, ó língua enganosa?” O sujeito implícito pode ser entendido de modo geral, embora muitos intérpretes considerem que, no contexto, se refira ao juízo de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: O que
  rationale: Mantém a pergunta retórica direta do hebraico.
- source_word: יִתֵּן
  choice: ele dará
  rationale: O imperfeito qal de נתן admite valor futuro; o sujeito implícito é preservado sem ser identificado.
- source_word: לְךָ / לָךְ
  choice: a você
  rationale: Traduz naturalmente a preposição ל com sufixo de segunda pessoa e conserva a mudança de referência para a língua personificada.
- source_word: וּמַה יֹּסִיף
  choice: e o que mais acrescentará
  rationale: Conserva o paralelismo e o sentido aditivo de יסף; “mais” torna essa força clara em português.
- source_word: לָשׁוֹן רְמִיָּה
  choice: ó língua enganosa
  rationale: Mantém a apóstrofe poética, a metáfora concreta de “língua” e o sentido moral de רְמִיָּה.
theological_decisions:
- issue: Identidade do sujeito implícito dos verbos
  choice: Mantê-lo como “ele”, sem identificar o referente
  alternative: Explicitar Deus como sujeito, em referência ao juízo divino
  rationale: O hebraico traz verbos na terceira pessoa masculina singular, mas não nomeia o sujeito. A tradução preserva essa ambiguidade, enquanto a nota registra a leitura contextual comum.
- issue: Sentido idiomático de נתן...יסף com ל
  choice: Traduzir lexicalmente como “dará... acrescentará”
  alternative: Traduzir idiomaticamente como “fará... fará ainda mais”
  rationale: A formulação literal preserva o paralelismo e a tensão retórica; a alternativa idiomática é apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção mantém a imagem poética e a ambiguidade do sujeito hebraico; “ó” sinaliza de modo conciso o vocativo.
