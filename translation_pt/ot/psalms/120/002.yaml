  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: pt
  text: Yahweh, livra-me[a] de lábios mentirosos, de uma língua enganosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “minha néfesh”; o termo também pode significar “me”, “minha vida” ou “minha alma”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de lábio de falsidade, de língua de engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: הַצִּילָה
  choice: livra-me
  rationale: O imperativo de נצל expressa um pedido urgente de resgate. “Livra-me” é natural na linguagem portuguesa de oração e se ajusta ao perigo causado pela fala falsa.
- source_word: נַפְשִׁי
  choice: -me
  rationale: Neste contexto, נֶפֶשׁ designa a própria pessoa ameaçada. O pronome produz português natural, enquanto a nota registra as alternativas mais formais “minha vida” e “minha alma”.
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: de lábios mentirosos
  rationale: Mantém a imagem corporal e verte idiomaticamente a construção “lábio de falsidade”; o plural é natural em português.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: de uma língua enganosa
  rationale: Preserva o paralelismo poético entre “lábios” e “língua”. “Enganosa” comunica o sentido de fraude ou dolo sem restringi-lo a uma modalidade específica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no hebraico, sem substituí-lo por um título nem adotar outra vocalização tradicional.
- issue: Sentido antropológico de נַפְשִׁי
  choice: livra-me
  alternative: livra a minha alma; livra a minha vida
  rationale: O termo pode indicar a pessoa, a vida ou a alma. O contexto pede o livramento do próprio salmista; a tradução evita impor uma distinção metafísica que o hebraico não exige, e a nota conserva a amplitude lexical.
translation_notes:
  register: Português atual, digno e acessível, com cadência de oração. O paralelismo hebraico entre “lábios” e “língua” foi mantido, e o vocativo foi pontuado naturalmente sem acrescentar uma interjeição ausente do hebraico.
