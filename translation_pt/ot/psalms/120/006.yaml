  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: pt
  text: Há muito tempo minha alma vive com quem odeia a paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha alma vive há tempo demais com quem odeia a paz”. A expressão hebraica inicial enfatiza uma duração prolongada e também pode sugerir que essa duração é excessiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: Há muito tempo
  rationale: Em combinação idiomática com o verbo seguinte, expressa longa duração. A formulação portuguesa comunica isso com naturalidade, sem tornar explícita no texto principal a possível ideia de duração excessiva.
- source_word: שָׁכְנָה
  choice: vive
  rationale: O verbo שכן significa habitar ou residir. “Vive” é atual, claro e preserva a ideia de convivência ou residência continuada.
- source_word: לָּהּ
  choice: não traduzido separadamente; “minha alma” funciona como sujeito explícito
  rationale: O sufixo pronominal feminino singular é sintaticamente difícil e costuma ser entendido como resumptivo ou pleonástico em relação a נַפְשִׁי. Traduzi-lo à parte produziria uma construção artificial em português.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Mantém a linguagem poética e a textura antropológica do hebraico, em vez de reduzir a expressão simplesmente a “eu”.
- source_word: עִם
  choice: com
  rationale: Expressa diretamente associação e convivência, de modo natural em português.
- source_word: שׂוֹנֵא
  choice: quem odeia
  rationale: Preserva a força verbal do particípio e descreve uma disposição característica, sem impor gênero ou número não explicitados na tradução.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: Neste contexto de hostilidade e convivência conflituosa, “paz” é o equivalente mais claro e direto.
theological_decisions: []
