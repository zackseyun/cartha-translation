  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/000.yaml
  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: pt
  text: 'Cântico das subidas.[a]


    Ao SENHOR clamei em minha angústia,

    e ele me respondeu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Título hebraico tradicional dos Salmos 120–134. A expressão também pode ser traduzida como “Cântico de peregrinação” ou “Cântico dos degraus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Mantém a imagem concreta e a ambiguidade da expressão hebraica tradicional que encabeça os Salmos 120–134, podendo aludir a peregrinações, ascensões ou degraus.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa amplamente reconhecida para representar o tetragrama divino, sem acrescentar uma vocalização disputada ao texto principal.
- source_word: בַּצָּרָתָה לִּי
  choice: em minha angústia
  rationale: Expressa de modo natural a aflição pessoal indicada literalmente por 'na angústia para mim'.
- source_word: קָרָאתִי
  choice: clamei
  rationale: No contexto de aflição e oração dirigida ao SENHOR, 'clamei' comunica melhor que o genérico 'chamei' a intensidade do verbo.
- source_word: וַיַּעֲנֵנִי
  choice: e ele me respondeu
  rationale: Reproduz diretamente a sequência narrativa e o sufixo de primeira pessoa do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versalete segue uma convenção bíblica portuguesa consolidada e identifica o nome divino sem tratar uma reconstrução de sua pronúncia como indiscutível.
- issue: Valor temporal de קָרָאתִי e וַיַּעֲנֵנִי
  choice: 'Ambos no pretérito perfeito: ''clamei'' e ''respondeu'''
  alternative: '''Quando clamo... ele me responde'' ou leitura do primeiro verbo como presente performativo'
  rationale: As formas verbais favorecem a apresentação de uma experiência concluída; a tradução preserva a declaração direta sem generalizá-la.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. O título foi mantido literalmente no texto, e alternativas interpretativas foram registradas em nota.
