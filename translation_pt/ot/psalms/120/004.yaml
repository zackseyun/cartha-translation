lexical_decisions:
- source_word: חִצֵּי
  choice: Flechas de
  rationale: Plural em estado construto de חֵץ; a relação com גִבּוֹר é expressa naturalmente em português por «flechas de um guerreiro».
- source_word: גִבּוֹר
  choice: um guerreiro
  rationale: Neste quadro de força e juízo, «guerreiro» comunica de modo claro o sentido marcial de alguém forte ou valente.
- source_word: שְׁנוּנִים
  choice: afiadas
  rationale: A forma descreve flechas aguçadas; «afiadas» é natural em português e conserva o valor passivo/resultativo.
- source_word: עִם
  choice: com
  rationale: Mantém a ligação simples entre as duas imagens poéticas, sem explicitar uma relação que o hebraico deixa aberta.
- source_word: גַּחֲלֵי
  choice: brasas de
  rationale: «Brasas» traduz de forma direta e idiomática os carvões incandescentes designados pelo substantivo, sem acrescentar um adjetivo ausente no hebraico.
- source_word: רְתָמִים
  choice: giesta
  rationale: Designa o retém, arbusto do deserto cuja madeira produzia carvão de calor duradouro. «Giesta» é uma designação portuguesa compreensível, esclarecida em nota.
