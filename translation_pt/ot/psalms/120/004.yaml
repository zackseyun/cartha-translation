translation:
  language: pt
  text: Flechas afiadas de um guerreiro, com brasas de giesta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A «giesta» aqui mencionada é um arbusto do deserto cuja madeira produz carvão que conserva o calor por muito tempo.
