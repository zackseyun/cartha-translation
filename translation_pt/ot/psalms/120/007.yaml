  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: pt
  text: Eu sou pela paz[a]; mas, quando falo[b], eles são pela guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Eu — paz”; a tradução expressa o sentido idiomático como “Eu sou pela paz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e, quando falo”; a conjunção hebraica pode ser entendida de modo mais simples, mas o contexto favorece o sentido de contraste.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי שָׁלוֹם
  choice: Eu sou pela paz
  rationale: A oração nominal hebraica diz literalmente “eu — paz”. A formulação portuguesa expressa de modo natural a disposição do salmista em favor da paz, sem transformar a frase numa afirmação ontológica.
- source_word: וְכִי
  choice: mas, quando
  rationale: Embora a conjunção possa ser traduzida mais simplesmente por “e”, o contexto estabelece contraste entre a disposição pacífica do falante e a inclinação dos adversários para a guerra.
- source_word: אֲדַבֵּר
  choice: falo
  rationale: O imperfeito piel na declaração poética admite o presente habitual. Não se acrescenta “de paz”, pois o objeto não está explícito no hebraico.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome masculino plural retoma enfaticamente os adversários; o contraste da frase comunica essa ênfase em português.
- source_word: לַמִּלְחָמָה
  choice: pela guerra
  rationale: A preposição indica orientação ou disposição. “Pela guerra” preserva o paralelismo conciso com “pela paz”.
