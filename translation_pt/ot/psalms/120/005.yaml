  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: pt
  text: Ai de mim, pois tenho vivido como estrangeiro em Meseque[a]; tenho habitado entre[b] as tendas de Quedar!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meseque e Quedar podem funcionar poeticamente como nomes de povos distantes e hostis, sem indicar necessariamente que o salmista tenha residido literalmente e ao mesmo tempo entre ambos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “com”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Ai de mim
  rationale: Expressão portuguesa natural e enfática de lamento pessoal, preservando a concisão e o peso do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa do lamento e mantém uma cadência poética natural.
- source_word: גַרְתִּי
  choice: tenho vivido como estrangeiro
  rationale: O verbo גור indica residir como forasteiro, sem pertencimento pleno; a forma composta comunica uma situação passada que se prolonga até o presente do lamento.
- source_word: מֶשֶׁךְ
  choice: Meseque
  rationale: Mantém o nome próprio em sua forma tradicional e reconhecível em português, sem substituir a imagem geográfica por uma interpretação.
- source_word: שָׁכַנְתִּי
  choice: habitado
  rationale: Preserva o sentido de residir ou morar e evita repetir o verbo “viver”, distinguindo-o da condição de estrangeiro expressa na oração anterior.
- source_word: עִם
  choice: entre
  rationale: Embora signifique literalmente “com”, neste contexto “entre” expressa de modo natural a residência no meio do povo representado por suas tendas.
- source_word: אָהֳלֵי קֵדָר
  choice: as tendas de Quedar
  rationale: Conserva a imagem concreta e metonímica do hebraico, bem como o nome próprio em forma tradicional portuguesa.
theological_decisions:
- issue: Se Meseque e Quedar devem ser interpretados genericamente no texto principal ou mantidos como nomes próprios.
  choice: Manter “Meseque” e “Quedar” no texto principal.
  alternative: Traduzir de forma interpretativa como povos distantes e hostis.
  rationale: O hebraico nomeia diretamente Meseque e Quedar. Preservar os nomes mantém a imagem histórico-poética e não resolve indevidamente se a referência é geográfica, figurada ou ambas.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação poética. “Ai de mim” preserva o lamento enfático; “tenho vivido como estrangeiro” explicita de maneira natural a condição de forasteiro inerente a גור. Os marcadores foram posicionados junto aos termos que esclarecem.
