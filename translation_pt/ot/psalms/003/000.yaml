lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo tradicional e preciso para o gênero desta composição poética e musical no contexto do Saltério.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, dedicação ou associação. “De Davi” mantém essa amplitude melhor do que “por Davi” ou “para Davi”.
- source_word: בְּבָרְחוֹ
  choice: quando fugiu
  rationale: A construção com בְּ, infinitivo construto e sufixo pronominal tem sentido temporal e é expressa de modo natural em português por “quando fugiu”.
- source_word: מִפְּנֵי
  choice: de
  rationale: Embora a expressão signifique literalmente “da presença de”, neste contexto indica de quem Davi fugia; “de” comunica o sentido idiomático com clareza.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Traduz diretamente o substantivo com sufixo masculino singular e preserva a relação familiar enfatizada no título.
theological_decisions:
- issue: Sentido do título davídico
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não obriga a entender a expressão exclusivamente como declaração de autoria; ela também pode indicar dedicação ou associação. A tradução conserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem “Absalão, seu filho” mantém a ênfase relacional do hebraico sem soar artificial.
