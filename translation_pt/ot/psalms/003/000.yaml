  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: pt
  text: Salmo de Davi[a], quando fugiu de Absalão, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; o título hebraico pode indicar autoria, dedicação ou associação.
