  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: pt
  text: Levanta-te, ó Yahweh! Salva-me, meu Deus! Pois feriste todos os meus inimigos na bochecha[a]; quebraste os dentes dos ímpios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no maxilar». O termo hebraico pode significar «bochecha» ou «maxilar».'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: Imperativo de קום dirigido a Deus. A forma pronominal é natural e digna em português e preserva o apelo vívido por intervenção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹשִׁיעֵנִי
  choice: Salva-me
  rationale: O hifil imperativo de ישׁע com sufixo de primeira pessoa pede resgate; «salva-me» conserva tanto o sentido imediato quanto sua ressonância mais ampla.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Tradução direta da forma com sufixo possessivo, preservando o caráter pessoal do apelo.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a súplica e soa natural no registro poético português.
- source_word: הִכִּיתָ
  choice: feriste
  rationale: O perfeito hebraico é traduzido como ação concluída, sem excluir que o salmista invoque atos divinos passados como fundamento de sua confiança.
- source_word: אֶת כָּל אֹיְבַי
  choice: todos os meus inimigos
  rationale: Tradução transparente do objeto direto, preservando a totalidade expressa por כָּל.
- source_word: לֶחִי
  choice: no rosto
  rationale: לֶחִי pode designar face, bochecha ou maxilar. «No rosto» é idiomático e preserva a imagem de golpe e humilhação; «no maxilar» é registrado em nota.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: os dentes dos perversos
  rationale: Mantém a imagem corporal concreta e traduz o adjetivo plural substantivado como um grupo caracterizado pela perversidade.
- source_word: שִׁבַּרְתָּ
  choice: quebraste
  rationale: Traduz o perfeito hebraico como ação concluída e mantém o paralelismo com «feriste».
theological_decisions:
- issue: Valor dos perfeitos hebraicos הִכִּיתָ e שִׁבַּרְתָּ no contexto da oração
  choice: 'Passado perfeito simples em português: «feriste ... quebraste»'
  alternative: 'Valor de ação característica ou certeza profética: «feres ... quebras» ou «ferirás ... quebrarás»'
  rationale: A morfologia apresenta verbos no perfeito, e o passado português oferece a correspondência mais direta. A linguagem poética ainda permite que atos passados fundamentem a expectativa atual, sem converter silenciosamente os verbos em presente ou futuro.
- issue: Imagens violentas dirigidas contra os inimigos
  choice: Preservar o golpe no rosto e os dentes quebrados
  alternative: Atenuar para uma formulação abstrata, como «derrotaste os perversos»
  rationale: O hebraico emprega imagens corporais deliberadamente concretas que comunicam humilhação e perda de poder; suavizá-las apagaria a força poética e teológica do texto.
translation_notes:
  register: Português moderno, claro e solene, com pontuação exclamativa para refletir a urgência dos imperativos. Emprega «Yahweh» como nome próprio e evita vocabulário arcaico, salvo a colocação pronominal consagrada e ainda amplamente compreensível em «levanta-te» e «salva-me».
