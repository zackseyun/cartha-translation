lexical_decisions:
- source_word: לֹא אִירָא
  choice: Não terei medo
  rationale: A negação com o imperfeito de ירא expressa naturalmente confiança ou determinação voltada ao presente/futuro; a formulação é clara e preserva a força do hebraico.
- source_word: מֵרִבְבוֹת
  choice: de miríades
  rationale: O substantivo רבבות indica números imensos, literalmente dezenas de milhares ou miríades; após 'ter medo', o מִן é expresso naturalmente por 'de' em português.
- source_word: עָם
  choice: pessoas
  rationale: עם designa aqui uma multidão de adversários humanos, não necessariamente uma nação como entidade política.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz a oração relativa que caracteriza a multidão.
- source_word: סָבִיב שָׁתוּ עָלָי
  choice: se posicionaram ao meu redor
  rationale: שָׁתוּ descreve os adversários tomando posição, enquanto סָבִיב mantém a imagem espacial de cerco; o reflexivo produz português natural. A força hostil possível de עָלָי é preservada na nota.
