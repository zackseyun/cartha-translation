  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: pt
  text: Não terei medo de miríades de pessoas que se posicionaram ao meu redor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se posicionaram contra mim por todos os lados”.'
