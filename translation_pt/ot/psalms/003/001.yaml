  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: pt
  text: Ó Yahweh, como são numerosos os meus adversários! Muitos se levantam contra mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e preserva o vocativo marcado no hebraico, sem substituí-lo por um título.
- source_word: מָה רַבּוּ
  choice: como são numerosos
  rationale: מָה tem valor exclamativo neste contexto; a formulação comunica naturalmente a grande quantidade de adversários.
- source_word: צָרָי
  choice: os meus adversários
  rationale: Expressa pessoas que se opõem ativamente ao salmista, sem restringir o sentido a um contexto estritamente militar.
- source_word: רַבִּים
  choice: Muitos
  rationale: Mantém a posição enfática e o uso substantivado do adjetivo no início da segunda oração.
- source_word: קָמִים עָלָי
  choice: se levantam contra mim
  rationale: Reproduz a construção idiomática de קום com עַל para oposição hostil e conserva o aspecto contínuo do particípio de modo natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A exclamação preserva a intensidade do lamento, e “adversários” mantém o paralelismo sem acrescentar especificidade militar.
