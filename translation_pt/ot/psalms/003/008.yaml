  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: pt
  text: A salvação pertence a Yahweh; que a tua bênção esteja sobre o teu povo. Selá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase hebraica não tem verbo expresso e também pode ser entendida como declaração: “A tua bênção está sobre o teu povo”. “Selá” provavelmente é uma indicação litúrgica ou musical, mas seu significado exato é incerto.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: pertence a Yahweh
  rationale: 'O לְ indica posse ou atribuição na oração nominal: a salvação pertence a Yahweh ou procede dele. O nome divino é transliterado como “Yahweh”.'
- source_word: הַיְשׁוּעָה
  choice: a salvação
  rationale: O substantivo designa livramento ou resgate; “salvação” é natural em português e conserva tanto o sentido imediato quanto sua ressonância teológica.
- source_word: עַל
  choice: sobre
  rationale: Expressa a bênção repousando sobre o povo; “sobre” é uma formulação corrente e digna em português.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Preserva a relação comunitária e pactual indicada pelo hebraico.
- source_word: בִרְכָתֶךָ
  choice: a tua bênção
  rationale: É a correspondência direta e natural de בְּרָכָה, sem restringir o sentido a mero favor.
- source_word: סֶּלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto e provavelmente litúrgico ou musical, ele é transliterado segundo o uso português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente explicitamente no texto hebraico, sem substituí-lo por um título.
- issue: Valor da segunda oração nominal
  choice: que a tua bênção esteja sobre o teu povo
  alternative: a tua bênção está sobre o teu povo
  rationale: O hebraico não contém verbo expresso e permite entender a frase como pedido ou declaração. No contexto de oração, o texto principal adota naturalmente o valor de súplica, enquanto a leitura declarativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. Emprega “teu/tua” em registro bíblico corrente sem arcaísmo excessivo. A pontuação mantém unidas as duas afirmações centrais e separa Selá como notação final.
