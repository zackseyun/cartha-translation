  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: pt
  text: 'Muitos estão dizendo a meu respeito[a]: “Não há salvação[b] para ele em Deus.” Selá.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “à minha alma”; a expressão se refere à própria pessoa e, neste contexto, significa “a meu respeito” ou “sobre mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “livramento”.
    reason: lexical_alternative
  - marker: c
    text: “Selá” provavelmente é um termo musical ou litúrgico; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Muitos
  rationale: O adjetivo é usado como substantivo e se refere a um número indefinido e elevado de pessoas. “Muitos” é conciso e natural.
- source_word: אֹמְרִים
  choice: estão dizendo
  rationale: O particípio expressa uma ação em curso ou repetida; a locução verbal preserva esse aspecto.
- source_word: לְנַפְשִׁי
  choice: a meu respeito
  rationale: Literalmente, “à minha alma”; aqui נֶפֶשׁ representa a própria pessoa. “A meu respeito” comunica o sentido idiomático sem sugerir indevidamente uma distinção entre alma e pessoa.
- source_word: אֵין
  choice: Não há
  rationale: Equivalente português natural para a negação existencial hebraica.
- source_word: יְשׁוּעָתָה
  choice: salvação
  rationale: O termo designa resgate ou livramento. “Salvação” preserva tanto a referência ao socorro concreto quanto a ressonância teológica do vocábulo nos Salmos.
- source_word: לּוֹ
  choice: para ele
  rationale: O sufixo pronominal se refere ao salmista na terceira pessoa dentro da fala de seus adversários.
- source_word: בֵאלֹהִים
  choice: em Deus
  rationale: Mantém o valor mais direto da preposição ב e a ideia de que, segundo os adversários, ele não encontra em Deus salvação.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, ele é transliterado em vez de receber uma interpretação conjectural.
theological_decisions:
- issue: Traduzir יְשׁוּעָה por um termo mais geral ou por “salvação”
  choice: salvação
  alternative: livramento; socorro
  rationale: No contexto, trata-se do resgate concreto do salmista, mas “salvação” também preserva a amplitude teológica do termo sem ultrapassar o que o hebraico permite.
- issue: Traduzir לְנַפְשִׁי literalmente ou como expressão referente à pessoa inteira
  choice: a meu respeito
  alternative: à minha alma; para mim
  rationale: Neste uso, נֶפֶשׁ representa a pessoa. A tradução idiomática evita criar uma ênfase antropológica ou psicológica que o contexto não exige.
- issue: Interpretar a relação expressa por בֵאלֹהִים
  choice: em Deus
  alternative: da parte de Deus; por Deus
  rationale: “Em Deus” conserva de modo transparente a preposição hebraica e a possível ideia de que Deus é a esfera ou fonte em que se busca salvação; “da parte de Deus” tornaria explícita apenas uma das interpretações possíveis.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem da frase é natural, enquanto “em Deus” preserva a formulação e a ambiguidade relacional do hebraico. A transliteração “Selá” segue o uso bíblico consolidado em português.
