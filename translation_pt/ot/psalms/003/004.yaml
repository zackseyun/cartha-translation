source:
  edition: WLC
  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: pt
  text: Com a minha voz clamo a Yahweh, e ele me responde[a] do seu santo monte[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele me respondeu”. Neste contexto, o verbo hebraico também pode ser traduzido no passado.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico significa mais basicamente “monte” ou “montanha” e provavelmente se refere a Sião.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: Com a minha voz
  rationale: Preserva o substantivo hebraico com sufixo de primeira pessoa e sua posição de destaque, ao mesmo tempo que expressa de modo natural o valor instrumental da frase.
- source_word: אֶל
  choice: a
  rationale: A preposição indica a direção do clamor dirigido a Yahweh; “a” é conciso e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando o caráter pessoal do Tetragrama.
- source_word: אֶקְרָא
  choice: clamo
  rationale: No contexto de oração em meio à aflição, קרא significa chamar ou clamar. “Clamo” transmite adequadamente a intensidade sem exagerá-la.
- source_word: וַיַּעֲנֵנִי
  choice: e ele me responde
  rationale: O presente mantém a vivacidade poética e pode expressar a confiança característica do salmista. Como a forma também admite tradução no passado neste contexto, essa possibilidade é registrada em nota.
- source_word: מֵהַר קָדְשׁוֹ
  choice: do seu santo monte
  rationale: הַר designa fundamentalmente um monte ou montanha. “Santo monte” é natural em português, conserva a imagem topográfica e provavelmente alude a Sião sem explicitar no texto o que permanece implícito.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo é incerto, a transliteração evita impor uma interpretação específica; o acento torna a pronúncia natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome divino e evita substituí-lo silenciosamente por um título.
- issue: Valor temporal e aspectual de וַיַּעֲנֵנִי na poesia
  choice: 'presente: “ele me responde”'
  alternative: 'passado: “ele me respondeu”'
  rationale: O presente comunica a vivacidade e a confiança do salmista, mas a forma hebraica pode legitimamente ser entendida como ação passada. A nota preserva essa ambiguidade sem resolvê-la de maneira dogmática.
- issue: Identificação do “santo monte”
  choice: manter a expressão sem identificar explicitamente o lugar
  alternative: explicitar “Sião”
  rationale: A referência provavelmente é a Sião, mas o hebraico diz apenas “seu santo monte”. Manter a formulação preserva tanto a imagem quanto o grau de explicitude do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem inicial marcada do hebraico foi preservada em “Com a minha voz”; “santo monte” mantém uma formulação bíblica ainda corrente sem soar arcaica.
