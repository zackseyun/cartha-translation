  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: pt
  text: Eu me deitei e dormi; acordei, porque Yahweh me sustenta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Eu me deitei
  rationale: O verbo שׁכב expressa deitar-se; a forma pronominal é natural em português e inicia com clareza a sequência de ações.
- source_word: וָאִישָׁנָה
  choice: e dormi
  rationale: O verbo ישׁן significa “dormir”. A formulação concisa preserva o movimento poético do hebraico.
- source_word: הֱקִיצוֹתִי
  choice: acordei
  rationale: A forma de קיץ é intransitiva neste contexto e indica que o salmista despertou. “Acordei” é corrente, claro e digno em português moderno.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão pela qual o salmista pôde despertar em segurança, preservando a força causal mais provável.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִסְמְכֵנִי
  choice: me sustenta
  rationale: O verbo סמך pode significar sustentar, apoiar ou amparar. “Me sustenta” comunica de modo natural o apoio contínuo de Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; “Javé” é uma forma portuguesa possível, mas menos próxima da transliteração adotada.
- issue: Aspecto de יִסְמְכֵנִי
  choice: me sustenta
  alternative: me sustentou; me ampara
  rationale: O imperfeito hebraico permite valor contínuo ou habitual. O presente mantém a declaração de confiança permanente sem limitar o apoio divino apenas ao despertar passado.
translation_notes:
  register: 'Português moderno, claro e poeticamente conciso, com ampla legibilidade brasileira. A repetição da primeira pessoa reproduz a progressão do hebraico: deitar-se, dormir e acordar. Não foram mantidas as notas inglesas porque seus marcadores estão deslocados e as alternativas não exigem nota para uma tradução portuguesa fiel.'
