source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: pt
  text: Mas tu, ó Yahweh, és um escudo ao meu redor[a], minha glória e aquele que levanta a minha cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um escudo para mim” ou “um escudo em meu favor”. A preposição hebraica pode indicar proteção em favor de alguém; neste contexto, porém, provavelmente sugere proteção ao redor.
    reason: lexical_alternative
  - marker: b
    text: “Levantar a cabeça” é uma expressão hebraica que pode indicar a restauração da dignidade, da confiança ou a vindicação.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente cria forte contraste com a aflição descrita antes; “Mas tu” preserva tanto o valor adversativo quanto a ênfase no pronome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָגֵן
  choice: um escudo
  rationale: O substantivo designa um escudo defensivo; em português, o predicativo pede naturalmente o artigo indefinido.
- source_word: בַּעֲדִי
  choice: ao meu redor
  rationale: A preposição pode indicar proteção em favor de alguém, mas, associada a “escudo”, permite aqui a imagem de proteção circundante.
- source_word: כְּבוֹדִי
  choice: minha glória
  rationale: Preserva a expressão hebraica concisa e sua amplitude poética, que pode abranger glória, honra e dignidade.
- source_word: וּ/מֵרִים
  choice: e aquele que levanta
  rationale: A construção com particípio descreve uma ação característica ou contínua; “aquele que levanta” conserva essa força e soa natural em português.
- source_word: רֹאשִׁי
  choice: a minha cabeça
  rationale: Mantém a imagem concreta do hebraico, sem reduzir o idioma a apenas uma de suas possíveis implicações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino em forma transliterada, sem substituí-lo por um título.
- issue: Interpretação da expressão “levanta a minha cabeça”
  choice: Manter a imagem literal no texto principal
  alternative: restaura a minha honra; dá-me coragem; reabilita-me
  rationale: A imagem hebraica admite ideias relacionadas de dignidade, confiança e vindicação. Mantê-la evita resolver sua riqueza poética em um único sentido.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservam-se o paralelismo poético, o pronome enfático, o nome divino transliterado e a imagem concreta do idioma hebraico.
