lexical_decisions:
- source_word: סֹבּוּ
  choice: Deem uma volta em torno de
  rationale: O imperativo plural de סבב convoca os ouvintes a mover-se ao redor de Sião. A formulação é natural em português e preserva a ação espacial concreta.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém o nome próprio tradicional em português; o hebraico diz simplesmente «Sião», sem «monte».
- source_word: וְהַקִּיפוּהָ
  choice: e percorram o seu contorno
  rationale: O segundo imperativo pede que se dê a volta em torno da cidade. Esta formulação preserva a ação sem sugerir o cerco hostil que «cerquem-na» poderia comunicar.
- source_word: סִפְרוּ
  choice: contem
  rationale: No contexto da observação das defesas da cidade, o imperativo significa enumerar, e «contem» expressa isso diretamente.
- source_word: מִגְדָּלֶיהָ
  choice: as suas torres
  rationale: O sufixo feminino singular remete a Sião, concebida como cidade. Em português, «suas» é a referência possessiva mais natural e evita personificação forçada.
