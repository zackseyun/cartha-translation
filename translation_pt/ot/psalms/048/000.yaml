lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Termo hebraico comum para uma composição cantada; «cântico» é natural e digno em um cabeçalho de salmo.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Designação convencional do gênero nos títulos dos Salmos, mantendo-a distinta de שִׁיר.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: A preposição ל nos cabeçalhos pode indicar autoria, associação, dedicação ou contexto de execução. «Dos» oferece uma formulação concisa sem definir de modo rígido essa relação.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
theological_decisions:
- issue: Função da expressão לִבְנֵי קֹרַח no cabeçalho
  choice: dos filhos de Corá
  alternative: para os filhos de Corá
  rationale: A preposição hebraica é semanticamente ampla. O texto principal segue a forma tradicional e concisa, enquanto a nota preserva a possibilidade de destinação, sem impor autoria ou função litúrgica.
translation_notes:
  register: Português moderno, claro e solene. A pontuação separa as duas designações de gênero presentes no hebraico, sem fundi-las; o marcador foi colocado junto à expressão cuja relação é ambígua.
