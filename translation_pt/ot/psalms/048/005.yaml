  text: הֵ֣מָּה רָ֭אוּ כֵּ֣ן תָּמָ֑הוּ נִבְהֲל֥וּ נֶחְפָּֽזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/005.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: pt
  text: Eles viram e ficaram espantados; ficaram aterrorizados e fugiram às pressas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fugiram apressadamente”. O verbo hebraico descreve uma retirada precipitada e urgente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome independente masculino plural dá certa ênfase ao sujeito; em português, “Eles” a preserva de modo natural sem acrescentar uma expressão enfática artificial.
- source_word: רָאוּ
  choice: viram
  rationale: Forma do verbo comum ראה, “ver”; “viram” é a tradução direta e adequada ao contexto.
- source_word: כֵּן
  choice: e
  rationale: Aqui a partícula pode retomar aquilo que foi visto (“assim”) ou ligar a visão à reação subsequente. A coordenação natural em português preserva a progressão sem impor uma relação lógica excessivamente definida.
- source_word: תָּמָהוּ
  choice: ficaram espantados
  rationale: Expressa assombro ou perplexidade repentinos; “ficaram espantados” é claro, digno e não determina se a admiração é positiva ou negativa.
- source_word: נִבְהֲלוּ
  choice: ficaram aterrorizados
  rationale: O nifal de בהל indica perturbação, pavor ou consternação; no crescendo do verso, “aterrorizados” comunica adequadamente a intensidade.
- source_word: נֶחְפָּזוּ
  choice: fugiram às pressas
  rationale: O verbo transmite movimento urgente e precipitado sob pressão. No contexto dos reis hostis, “fugiram às pressas” exprime tanto a retirada quanto a urgência, sem tornar “pânico” o sentido lexical principal.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e solene, com paralelismo verbal e progressão rápida. A pontuação reúne as duas últimas reações sem suavizar o crescendo: visão, espanto, terror e retirada precipitada.'
