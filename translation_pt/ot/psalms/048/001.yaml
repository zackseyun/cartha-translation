  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: pt
  text: Grande é Yahweh e muito digno de louvor[a], na cidade do nosso Deus, seu santo monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e muito louvado”. O particípio passivo hebraico pode ser traduzido mais literalmente como “louvado” ou, de modo mais idiomático, como “digno de louvor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grande
  rationale: Adjetivo predicativo no início do versículo; preserva a ordem enfática do hebraico e seu sentido avaliativo sem restringi-lo à ideia de poder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמְהֻלָּל מְאֹד
  choice: e muito digno de louvor
  rationale: Expressa em português natural a força predicativa do particípio passivo intensificado por מְאֹד, sem perder de vista a alternativa mais literal indicada em nota.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: na cidade do nosso Deus
  rationale: Traduz a preposição locativa e preserva de modo claro a relação construta e o possessivo comunitário.
- source_word: הַר קָדְשׁוֹ
  choice: seu santo monte
  rationale: Mantém a formulação compacta e dignificada do hebraico; a expressão funciona em aposição à cidade de Deus e identifica Sião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração Yahweh preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força do particípio מְהֻלָּל
  choice: digno de louvor
  alternative: louvado
  rationale: A leitura principal comunica naturalmente o sentido de merecimento implicado no contexto, enquanto a nota preserva a forma passiva mais literal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva a abertura enfática do hebraico e usa “monte”, termo bíblico corrente e adequado para Sião.
