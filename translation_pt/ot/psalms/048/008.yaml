  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: pt
  text: 'Assim como ouvimos, também vimos

    na cidade de Yahweh dos Exércitos,

    na cidade do nosso Deus:

    Deus a estabelecerá para sempre.[a]

    Selá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, estabelecerá a cidade. O hebraico usa um sufixo feminino singular, que retoma “cidade” e pode apresentá-la de modo poeticamente personificado.
    reason: Esclarece o referente gramatical e preserva a possibilidade de personificação poética.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... também
  rationale: Preserva a correlação comparativa entre o que foi ouvido e o que foi visto, em português natural.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: ouvimos ... vimos
  rationale: Os perfeitos hebraicos expressam experiências já realizadas; o pretérito perfeito é direto e idiomático em português.
- source_word: בְּעִיר
  choice: na cidade de
  rationale: Reproduz de modo claro o uso locativo da preposição בְּ com עִיר.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um termo amplo, capaz de abranger as hostes ou forças celestes sem restringir indevidamente o sentido.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Expressa diretamente o substantivo com o sufixo de primeira pessoa do plural.
- source_word: יְכוֹנְנֶהָ
  choice: a estabelecerá
  rationale: O verbo כון indica estabelecer, firmar ou tornar estável; o pronome átono feminino retoma naturalmente 'cidade'.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente para a duração indefinida e permanente indicada pela expressão hebraica.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo litúrgico ou musical hebraico, cuja função exata permanece incerta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: Preserva o nome pessoal representado pelo Tetragrama, sem substituí-lo por um título.
- issue: Referente do sufixo feminino em יְכוֹנְנֶהָ
  choice: 'a cidade: “Deus a estabelecerá”'
  alternative: “Deus estabelecerá isso” ou uma formulação sem referente explícito
  rationale: O sufixo hebraico está no feminino singular e retoma mais naturalmente עִיר, 'cidade', também permitindo sua personificação poética sem exigir que ela seja explicitada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A disposição em linhas conserva o paralelismo poético. “Yahweh dos Exércitos” mantém o nome divino e evita reduzir צְבָאוֹת especificamente a exércitos humanos.
