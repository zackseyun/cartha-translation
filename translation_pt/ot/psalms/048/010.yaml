base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: pt
  text: Como o teu nome, ó Deus, assim o teu louvor se estende[a] até os confins da terra; a tua mão direita está cheia de justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu louvor está sobre os confins da terra”. A preposição hebraica significa literalmente “sobre” e também pode indicar extensão por toda a terra.'
    reason: alternativa_lexical
  - marker: b
    text: 'Ou: “retidão”. O termo hebraico pode denotar tanto justiça quanto retidão.'
    reason: leitura_alternativa
lexical_decisions:
- source_word: כְּשִׁמְךָ
  choice: Como o teu nome
  rationale: O prefixo כְּ marca comparação, e “como” mantém a correlação poética com כֵּן (“assim”). “Nome” preserva a imagem concreta do hebraico, embora também possa evocar reputação ou renome.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto indica discurso direto; “ó Deus” expressa naturalmente o vocativo em português.
- source_word: כֵּן
  choice: assim
  rationale: Forma, com “como”, a construção correlativa “como... assim”, preservando o paralelismo hebraico.
- source_word: תְּהִלָּתְךָ
  choice: o teu louvor
  rationale: Traduz diretamente o substantivo hebraico, que pode referir-se tanto ao louvor dirigido a Deus quanto ao seu renome digno de louvor.
- source_word: עַל
  choice: se estende até
  rationale: Embora a preposição signifique literalmente “sobre”, neste contexto espacial a expressão comunica que o louvor alcança os limites da terra. A tradução adotada é natural sem eliminar a alternativa mais formal, registrada em nota.
- source_word: קַצְוֵי אֶרֶץ
  choice: os confins da terra
  rationale: Expressão portuguesa corrente e digna para as extremidades ou regiões mais distantes do mundo.
- source_word: צֶדֶק
  choice: justiça
  rationale: O termo abrange justiça, retidão e conformidade moral. “Justiça” é conciso, natural e adequado ao agir poderoso simbolizado pela mão direita; “retidão” é preservada em nota.
- source_word: מָלְאָה
  choice: está cheia
  rationale: O perfeito hebraico descreve um estado resultante presente. “Está cheia” reproduz a imagem de modo direto e idiomático.
- source_word: יְמִינֶךָ
  choice: a tua mão direita
  rationale: A tradução literal conserva a imagem bíblica de poder e ação sem acrescentar uma interpretação ao texto.
theological_decisions:
- issue: Sentido de צֶדֶק na descrição da mão direita de Deus
  choice: justiça
  alternative: retidão
  rationale: O hebraico reúne dimensões judiciais e morais que o português pode expressar por “justiça” ou “retidão”. O texto principal usa “justiça”, enquanto a nota conserva a nuance moral alternativa sem restringir o alcance do termo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção correlativa “Como... assim” preserva o paralelismo poético, e “confins da terra” mantém o tom elevado sem soar arcaico.
