  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: pt
  text: Meditamos, ó Deus, em teu amor leal[a], no interior do teu templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “refletimos sobre” ou “consideramos”. O verbo hebraico pode transmitir a ideia de ponderar ou meditar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: Meditamos
  rationale: O piel perfeito na primeira pessoa do plural expressa aqui reflexão ou consideração atenta. “Meditamos” é natural no contexto de culto e preserva o aspecto contemplativo sem recorrer ao sentido menos provável de “comparamos”.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona naturalmente como vocativo. A partícula “ó” e as vírgulas deixam clara a fala dirigida a Deus.
- source_word: חַסְדֶּךָ
  choice: teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, fidelidade e compromisso constante. “Amor leal” comunica essa riqueza em português atual sem restringi-la apenas à misericórdia nem introduzir terminologia técnica.
- source_word: בְּקֶרֶב
  choice: no interior de
  rationale: A expressão indica localização dentro ou no meio de algo. “No interior de” mantém claramente o sentido espacial e soa natural em português.
- source_word: הֵיכָלֶךָ
  choice: teu templo
  rationale: Embora הֵיכָל também possa significar “palácio”, o contexto de adoração do salmo favorece “templo”.
theological_decisions:
- issue: Sentido de חֶסֶד como atributo e ação de Deus
  choice: amor leal
  alternative: misericórdia; bondade; amor da aliança
  rationale: A tradução preserva tanto o afeto quanto a constância e fidelidade implicados no termo hebraico, sem reduzi-lo à compaixão nem explicitar na linha principal uma formulação teológica mais técnica.
- issue: Função de אֱלֹהִים
  choice: 'vocativo: “ó Deus”'
  alternative: 'referência não vocativa: “Deus”'
  rationale: A sintaxe e o caráter oracional do verso favorecem a leitura como fala direta dirigida a Deus; a pontuação torna essa função explícita sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal e os possessivos em segunda pessoa preservam o tom direto da oração. O marcador [a] está ligado à expressão cujo campo semântico a nota esclarece.
