  text: יִשְׂמַ֤ח הַר צִיּ֗וֹן תָּ֭גֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְ֝מַ֗עַן מִשְׁפָּטֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: pt
  text: Alegre-se o monte Sião; exultem as filhas de Judá[a] por causa dos teus julgamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as cidades/os povoados de Judá», pois «filhas» pode designar poeticamente cidades ou assentamentos dependentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Alegre-se
  rationale: O imperfeito qal, no paralelismo poético, admite força volitiva. A forma em português expressa a convocação celebrativa sem transformá-la em simples futuro.
- source_word: הַר צִיּוֹן
  choice: o monte Sião
  rationale: Preserva a construção hebraica e a imagem topográfica em português natural.
- source_word: תָּגֵלְנָה
  choice: exultem
  rationale: O verbo גיל comunica alegria intensa. «Exultem» mantém a força poética e distingue este verbo do anterior.
- source_word: בְּנוֹת יְהוּדָה
  choice: as filhas de Judá
  rationale: Mantém a expressão literal e sua personificação poética, sem eliminar a possibilidade de que designe cidades ou povoados dependentes de Judá.
- source_word: לְמַעַן
  choice: por causa de
  rationale: No contexto, introduz naturalmente o motivo da alegria.
- source_word: מִשְׁפָּטֶיךָ
  choice: teus julgamentos
  rationale: Preserva a amplitude de מִשְׁפָּט e, neste salmo, sugere os atos judiciais de Deus sem reduzi-los a leis ou estatutos.
theological_decisions:
- issue: Sentido de מִשְׁפָּטֶיךָ no contexto
  choice: teus julgamentos
  alternative: tua justiça; teus atos de julgamento; tuas ordenanças
  rationale: O contexto celebra a atuação decisiva de Deus como rei e juiz. «Julgamentos» conserva essa ênfase e também a tensão lexical do termo hebraico, sem especificar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi preservado por dois verbos de alegria no modo exortativo, e a imagem literal «filhas de Judá» foi mantida no texto com esclarecimento em nota.
