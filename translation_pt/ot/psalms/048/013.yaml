base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: pt
  text: Fixem o coração na muralha dela[a]; percorram suas cidadelas[b], para que contem à geração futura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortificação exterior”. O termo hebraico designa de modo amplo uma estrutura defensiva da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “palácios”. O termo hebraico pode designar edifícios palacianos ou fortalezas; o contexto de inspeção das defesas da cidade favorece “cidadelas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Voltem o coração
  rationale: A expressão hebraica significa dirigir ou aplicar atentamente o coração. A formulação mantém a imagem antropológica do original e soa natural em português.
- source_word: לְחֵילָה
  choice: para a muralha dela
  rationale: חֵיל, na descrição de uma cidade, designa sua fortificação, possivelmente a muralha exterior ou baluarte. “Muralha” é claro e arquitetonicamente apropriado.
- source_word: פַּסְּגוּ
  choice: percorram
  rationale: O verbo raro, no contexto de inspecionar Sião, sugere deslocar-se por entre suas construções para observá-las. “Percorram” preserva tanto o movimento quanto a finalidade de exame.
- source_word: אַרְמְנוֹתֶיהָ
  choice: suas cidadelas
  rationale: אַרְמוֹן pode indicar palácios ou edifícios fortificados. O contexto militar e topográfico favorece “cidadelas”, sem eliminar a alternativa lexical em nota.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: para que contem
  rationale: לְמַעַן introduz finalidade, e o piel de ספר significa contar ou relatar. A tradução é direta e corrente.
- source_word: לְדוֹר אַחֲרוֹן
  choice: à geração futura
  rationale: A expressão significa literalmente uma geração posterior. “Geração futura” conserva a referência ampla, sem restringi-la necessariamente à geração imediatamente seguinte.
