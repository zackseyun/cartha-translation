  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: pt
  text: Belo em sua elevação, alegria de toda a terra, é o monte Sião, nos confins do norte[a], a cidade do grande Rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas encostas do norte”; literalmente, “nas partes extremas ou nos lados do norte”. A expressão também pode evocar Zafom, a montanha divina associada ao norte no imaginário do antigo Oriente Próximo.
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: Belo em sua elevação
  rationale: A expressão descreve poeticamente a beleza de Sião em relação à sua altura ou posição elevada. A formulação conserva o sentido espacial do substantivo raro נוֹף sem o reduzir a uma interpretação topográfica excessivamente específica.
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: alegria de toda a terra
  rationale: Mantém a relação nominal e a abrangência universal do hebraico; “terra” é preferível a “país” neste contexto de louvor de alcance amplo.
- source_word: הַר צִיּוֹן
  choice: o monte Sião
  rationale: Forma consagrada e clara em português para o nome geográfico, com o artigo exigido pelo uso natural.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: nos confins do norte
  rationale: “Confins” expressa as partes extremas ou remotas indicadas por יַרְכְּתֵי, preservando tanto a leitura geográfica quanto a possível ressonância poética ligada ao norte/Zafom.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: a cidade do grande Rei
  rationale: Reproduz a cadeia construta e a aposição a Sião. A maiúscula em “Rei” sinaliza a referência contextual ao Deus de Israel sem acrescentar uma identificação ausente das palavras hebraicas.
theological_decisions:
- issue: Sentido de יַרְכְּתֵי צָפוֹן em relação ao monte Sião
  choice: nos confins do norte
  alternative: nas encostas do norte; nas extremidades de Zafom
  rationale: O hebraico permite uma descrição geográfica e também pode evocar a imagem antiga de Zafom como montanha divina. O texto principal mantém essa tensão, e a nota apresenta as possibilidades sem impor uma leitura mitológica ou estritamente topográfica.
- issue: Identidade de מֶלֶךְ רָב
  choice: grande Rei
  alternative: um grande rei
  rationale: O contexto do salmo favorece a referência definida ao Deus de Israel como soberano de Sião. A tradução preserva essa leitura contextual sem inserir o nome divino no versículo.
translation_notes:
  register: Português moderno, poético e digno, com sintaxe clara para leitores brasileiros e compreensão internacional. Conserva o paralelismo nominal e a estrutura apositiva do hebraico, evitando arcaísmos como “formoso” e explicações interpretativas no corpo do versículo.
