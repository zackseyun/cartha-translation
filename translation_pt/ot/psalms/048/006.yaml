  text: Trembling seized them there[a], anguish like a woman in labor.
translation:
  language: pt
  text: 'Ali, o tremor os tomou,

    uma angústia como a de uma mulher em trabalho de parto.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contorções como as de uma mulher em trabalho de parto”; o substantivo hebraico חִיל pode destacar tanto as dores convulsivas em si como a angústia que elas causam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: um tremor
  rationale: Mantém a imagem concreta de estremecimento ou tremedeira e funciona naturalmente como sujeito da oração em português.
- source_word: אֲחָזָתַם
  choice: os dominou
  rationale: O verbo אחז significa agarrar ou apoderar-se. “Dominou” comunica de modo idiomático a força súbita e irresistível do tremor, sem tornar a formulação artificial.
- source_word: שָׁם
  choice: Ali
  rationale: Reproduz diretamente o advérbio de lugar e preserva a vivacidade da cena; a posição inicial é natural em português.
- source_word: חִיל
  choice: angústia
  rationale: O substantivo pode indicar contorção, dor de parto ou angústia. “Angústia” preserva a aflição física e emocional, enquanto a comparação seguinte explicita o parto.
- source_word: כַּיּוֹלֵדָה
  choice: como a da mulher em trabalho de parto
  rationale: Expressa com clareza atual a comparação com uma mulher que está dando à luz; “a da” liga naturalmente a angústia à comparação.
