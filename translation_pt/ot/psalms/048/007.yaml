  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: pt
  text: Com um vento leste, despedaças os navios de Társis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “navios com destino a Társis” ou “navios do tipo Társis”; a expressão pode designar grandes navios mercantes de alto-mar associados a Társis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: Com um vento leste
  rationale: רוּחַ, em combinação com קָדִים e no contexto marítimo, significa “vento”; a preposição בְּ indica o meio empregado. “Vento leste” é natural em português e mantém a força destrutiva associada à expressão.
- source_word: תְּשַׁבֵּר
  choice: despedaças
  rationale: O piel de שׁבר expressa uma ação intensa de quebrar. “Despedaças” comunica a violência da destruição e preserva a segunda pessoa masculina singular, entendida no contexto como referência direta a Deus.
- source_word: אֳנִיּוֹת
  choice: os navios
  rationale: O substantivo plural designa navios. O artigo definido torna a expressão idiomática em português diante da locução “de Társis”, sem alterar seu referente.
- source_word: תַּרְשִׁישׁ
  choice: Társis
  rationale: O nome próprio é transliterado segundo a forma consagrada em português. A expressão pode indicar navios associados a Társis ou, por extensão, grandes embarcações mercantes de alto-mar; essa amplitude é preservada por nota.
theological_decisions:
- issue: Referente do verbo na segunda pessoa
  choice: 'Discurso direto a Deus: “despedaças”'
  alternative: Construção impessoal ou declaração generalizada
  rationale: A forma verbal hebraica está na segunda pessoa masculina singular e, no contexto do salmo, dirige-se naturalmente a Deus. A tradução mantém essa forma sem explicitar além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Despedaças” conserva a intensidade poética do hebraico; “vento leste” evita uma formulação excessivamente técnica. A nota mantém a ambiguidade histórica e lexical de “navios de Társis”.
