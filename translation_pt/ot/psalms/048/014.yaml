- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: é o nosso Deus para todo o sempre
  rationale: Reproduz a afirmação pactual e a expressão hebraica intensificada de duração sem tornar a frase artificial.
- source_word: יְנַהֲגֵנוּ
  choice: nos guiará
  rationale: 'Expressa o sentido habitual do verbo נהג neste contexto: conduzir ou guiar.'
- source_word: עַל־מוּת
  choice: para além da morte
  rationale: Segue uma leitura antiga e contextualmente possível da expressão final, mas sua forma hebraica é difícil e admite outra interpretação, registrada em nota.
theological_decisions:
- issue: Alcance da orientação divina em עַל־מוּת
  choice: para além da morte
  alternative: até a morte
  rationale: A escolha preserva a declaração de confiança que ultrapassa a morte, conforme uma interpretação possível do hebraico. Como a expressão é textualmente e semanticamente incerta, a alternativa temporal não é excluída e aparece na nota.
