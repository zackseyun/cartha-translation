  text: אֱלֹהִ֥ים בְּ/אַרְמְנוֹתֶ֗י/הָ נוֹדַ֥ע לְ/מִשְׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: pt
  text: Deus é conhecido em suas cidadelas[a] como fortaleza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seus palácios”. O termo hebraico pode indicar residências grandiosas ou estruturas fortificadas; neste contexto, “cidadelas” ressalta a segurança da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “como refúgio” ou “como lugar seguro”. A palavra hebraica designa um lugar elevado e protegido.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto do salmo, a forma plural funciona como título singular do Deus de Israel; “Deus” é a tradução natural em português.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: em suas cidadelas
  rationale: O termo pode designar palácios ou estruturas fortificadas. No contexto de Sião e de sua segurança, “cidadelas” preserva tanto a imponência quanto a dimensão defensiva. O sufixo feminino singular refere-se à cidade.
- source_word: נוֹדַע
  choice: é conhecido
  rationale: O nifal de ידע admite aqui o sentido estativo ou passivo de “ser conhecido”, preservando a formulação breve e a possível nuance do hebraico sem acrescentar explicitamente “se deu a conhecer”.
- source_word: לְמִשְׂגָּב
  choice: como fortaleza
  rationale: מִשְׂגָּב indica um lugar elevado e seguro de proteção. “Como fortaleza” é idiomático em português e conserva a imagem de segurança e defesa.
theological_decisions:
- issue: Referente do sufixo feminino em “suas cidadelas”
  choice: O sufixo refere-se a Sião, a cidade celebrada no salmo.
  alternative: Referência mais geral à terra ou à comunidade.
  rationale: O contexto imediato do Salmo 48 se concentra no monte Sião e na cidade de Deus; por isso, o possessivo feminino singular é mais bem entendido como referência à cidade personificada.
- issue: Nuance de נוֹדַע
  choice: Manter “é conhecido”, sem explicitar o agente ou um ato reflexivo de revelação.
  alternative: “Deus se deu a conhecer” ou “Deus tornou-se conhecido”.
  rationale: A forma hebraica permite uma leitura estativa/passiva. A tradução escolhida preserva essa abertura e evita decidir se a ênfase recai no reconhecimento de Deus ou em sua auto-revelação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha a concisão poética do hebraico, enquanto “cidadelas” e “fortaleza” mantêm a imagem defensiva sem excluir as alternativas registradas nas notas.
