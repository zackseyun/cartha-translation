lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a ligação explicativa ou causal com o contexto anterior.
- source_word: הִנֵּה
  choice: vejam
  rationale: Reproduz o chamado enfático à atenção em linguagem portuguesa natural e atual.
- source_word: הַמְּלָכִים נוֹעֲדוּ
  choice: os reis se reuniram
  rationale: Expressa diretamente a ação coletiva do verbo יעד no nifal.
- source_word: עָבְרוּ יַחְדָּו
  choice: avançaram juntos
  rationale: Neste contexto militar, עבר sugere movimento conjunto em direção ao alvo; “avançaram” comunica isso sem especificar além do hebraico.
theological_decisions:
- issue: Direção e finalidade do movimento dos reis
  choice: avançaram juntos
  alternative: passaram juntos
  rationale: O hebraico não declara explicitamente o destino nem a intenção; a tradução conserva essa indeterminação, embora comunique o provável movimento militar do contexto.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla compreensão. O dois-pontos após “vejam” preserva a função apresentativa de הִנֵּה, e o ponto e vírgula mantém a progressão compacta do verso.
