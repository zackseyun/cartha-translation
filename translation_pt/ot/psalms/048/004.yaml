review_pass:
  verdict: revise
  source_fidelity: O hebraico diz literalmente que os reis se reuniram e «passaram juntos». O verbo עָבְרוּ («passaram, atravessaram») não especifica avanço militar nem direção ao alvo; «avançaram» introduz uma nuance contextual que o texto não afirma.
  naturalness: «Pois eis que» é uma formulação natural e solene em português bíblico moderno, preservando a força apresentativa de כִּי הִנֵּה sem o imperativo conversacional «vejam».
  terminology: «Reis», «se reuniram» e «juntos» representam adequadamente הַמְּלָכִים, נוֹעֲדוּ e יַחְדָּו. «Passaram» preserva a amplitude semântica de עבר.
  issues:
  - severity: medium
    issue: «avançaram juntos» é interpretativo
    rationale: Embora o contexto possa sugerir uma ação coordenada de reis hostis, עָבְרוּ significa primariamente «passaram/atravessaram» e não declara que avançaram contra um alvo. A revisão preserva a indeterminação do hebraico.
  - severity: low
    issue: «vejam» explicita um destinatário no imperativo
    rationale: הִנֵּה é uma partícula de apresentação («eis que», «vejam») e não exige formalmente um imperativo plural. «Eis que» é mais próximo da construção hebraica e mantém registro digno.
  revised_text: Pois eis que os reis se reuniram; passaram juntos.
  revised_footnotes: []
  revision_rationale: A revisão elimina a especificação indevida de movimento ofensivo e reproduz de modo mais direto a partícula apresentativa e a concisão da frase hebraica.
