base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: pt
  text: Venham, filhos[a], escutem-me; eu lhes ensinarei o temor de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos”. Na linguagem de sabedoria, o termo pode dirigir-se aos aprendizes em geral, não necessariamente apenas a filhos biológicos ou a pessoas do sexo masculino.
    reason: lexical_alternative
  - marker: b
    text: “O temor de Yahweh” é uma expressão da literatura de sabedoria que abrange assombro reverente, obediência e o devido medo diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: Embora venha do verbo “ir/andar”, aqui o imperativo funciona idiomaticamente como um convite para que os ouvintes se aproximem e prestem atenção. “Venham” expressa isso com naturalidade em português.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo hebraico significa literalmente “filhos” e é uma forma típica de um mestre de sabedoria dirigir-se a seus aprendizes. A tradução conserva a imagem pedagógica, com nota explicando seu possível alcance geral.
- source_word: שִׁמְעוּ לִי
  choice: escutem-me
  rationale: A construção pede atenção e acolhimento do ensino, não apenas percepção auditiva. “Escutem-me” transmite essa exortação de modo direto e atual.
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: “Temor” preserva a amplitude e a tensão da expressão sapiencial hebraica, que inclui reverência, obediência, assombro e o devido medo diante de Deus; “Yahweh” representa diretamente o nome divino.
- source_word: אֲלַמֶּדְכֶם
  choice: eu lhes ensinarei
  rationale: O imperfeito piel expressa naturalmente, neste contexto, a intenção ou promessa do salmista. “Eu lhes ensinarei” mantém o sujeito enfático e é claro em português amplamente compreensível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de יִרְאַת יְהוָה
  choice: o temor de Yahweh
  alternative: a reverência por Yahweh
  rationale: A tradução retém “temor” para não reduzir a expressão somente à reverência. No vocabulário sapiencial, ela abrange assombro reverente, obediência e a consciência apropriada da gravidade de estar diante de Deus.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. “Escutem-me” evita formalidade excessiva; “lhes” mantém referência plural sem regionalismo marcado. A estrutura breve e exortativa do hebraico foi preservada.
