  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: pt
  text: Afaste-se do mal e faça o bem; busque a paz[a] e empenhe-se em alcançá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plenitude” ou “bem-estar”. O termo hebraico shalom expressa mais do que a ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Afaste-se
  rationale: O imperativo expressa afastamento deliberado. “Afaste-se” é natural em português moderno e preserva a ideia de reorientação moral.
- source_word: מֵרָע
  choice: do mal
  rationale: Neste contexto de exortação sapiencial, רַע designa o mal em sentido moral; a preposição מִן indica separação.
- source_word: וַעֲשֵׂה טוֹב
  choice: e faça o bem
  rationale: Mantém de forma clara e concisa o paralelismo contrastante entre afastar-se do mal e praticar o bem.
- source_word: בַּקֵּשׁ
  choice: busque
  rationale: O imperativo piel comunica uma procura intencional e diligente; “busque” preserva essa força com linguagem corrente e digna.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: “Paz” é a tradução principal mais natural neste contexto, embora שָׁלוֹם também possa incluir integridade, plenitude e bem-estar, sentido registrado em nota.
- source_word: וְרָדְפֵהוּ
  choice: e empenhe-se em alcançá-la
  rationale: O verbo רדף evoca perseguição ativa e persistente, e o sufixo masculino singular retoma שָׁלוֹם. A formulação escolhida comunica em português natural uma busca resoluta, sem sugerir perseguição hostil.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso conserva a concisão, o paralelismo imperativo e a progressão entre abandonar o mal, praticar o bem e buscar ativamente a paz.
