source:
  edition: WLC
  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: pt
  text: 'Provem e vejam que Yahweh é bom;

    bem-aventurado é o homem[a] que se refugia nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “o homem”; aqui, o masculino singular é usado em sentido representativo para qualquer pessoa que se refugie em Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Provem
  rationale: Imperativo plural de טעם, literalmente “provar” pelo paladar. A escolha preserva a imagem sensorial e sua extensão poética para o conhecimento pela experiência.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Imperativo plural de ראה. “Vejam” mantém o paralelismo sensorial com “provem” e permite também o sentido figurado de reconhecer pela experiência.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo daquilo que os ouvintes são exortados a provar e ver.
- source_word: טוֹב
  choice: bom
  rationale: Preserva o sentido amplo do adjetivo, que abrange tanto o caráter de Yahweh quanto sua ação benéfica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: אַשְׁרֵי
  choice: feliz é
  rationale: Expressa a exclamação de bem-aventurança e condição invejável indicada por אַשְׁרֵי, em português natural e digno.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Reproduz o substantivo masculino singular do hebraico. Neste contexto, ele tem força representativa, esclarecida em nota.
- source_word: יֶחֱסֶה
  choice: se refugia
  rationale: Preserva a imagem de buscar abrigo e proteção, mais específica do que uma tradução genérica como “confia”.
- source_word: בּוֹ
  choice: nele
  rationale: Retoma naturalmente Yahweh e mantém a coesão pronominal do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração conserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido representativo de הַגֶּבֶר
  choice: o homem
  alternative: a pessoa
  rationale: A tradução principal conserva a forma masculina singular da fonte, enquanto a nota explicita que a declaração se aplica representativamente a qualquer pessoa que se refugie em Yahweh.
- issue: Valor de אַשְׁרֵי
  choice: feliz é
  alternative: bem-aventurado
  rationale: “Feliz é” comunica a declaração de florescimento e condição digna de admiração sem limitar o termo a uma fórmula religiosa técnica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo poético e as imagens concretas de provar, ver e refugiar-se foram preservados.
