source:
  edition: WLC
  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: pt
  text: Ele guarda todos os seus ossos[a]; nenhum deles é quebrado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “protege” ou “preserva” todos os seus ossos.
    reason: lexical_alternative
  - marker: b
    text: Esta linha é citada em João 19:36 em relação à crucificação de Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: guarda
  rationale: O particípio de שׁמר expressa a ação de guardar, proteger ou preservar. “Guarda” é natural, conciso e mantém a ideia de cuidado protetor.
- source_word: כָּל עַצְמוֹתָיו
  choice: todos os seus ossos
  rationale: Representa tanto a totalidade indicada por כָּל quanto o substantivo com sufixo masculino singular, “seus ossos”.
- source_word: אַחַת מֵהֵנָּה
  choice: nenhum deles
  rationale: A construção partitiva significa literalmente “uma delas”; sob a negação, o português idiomático pede “nenhum deles”, retomando “ossos” no masculino plural.
- source_word: לֹא נִשְׁבָּרָה
  choice: é quebrado
  rationale: O perfeito nifal de שׁבר indica que algo é quebrado. O presente comunica adequadamente o valor geral da afirmação poética, sem forçar uma referência exclusivamente passada ou futura.
theological_decisions:
- issue: Referente dos sufixos pronominais no singular
  choice: “seus”, referindo-se à pessoa justa no contexto imediato do salmo
  alternative: Explicitar “os ossos do justo” ou tornar cristológica a referência no texto principal
  rationale: O hebraico usa sufixos no singular, e o contexto imediato trata do justo sofredor que o SENHOR livra. A tradução conserva esse sentido direto sem inserir no texto principal a aplicação cristológica posterior, registrada em nota.
- issue: Relação com João 19:36
  choice: Manter a formulação do salmo no texto principal e indicar a citação no Novo Testamento em nota
  alternative: Adaptar o texto principal à redação ou à aplicação cristológica de João 19:36
  rationale: Isso respeita a primazia do texto hebraico e, ao mesmo tempo, informa seu uso canônico posterior sem apagar a tensão entre o contexto original e a aplicação neotestamentária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Guarda” preserva a imagem concreta e protetora do hebraico; “nenhum deles” evita a forma menos natural “nem um deles”. Os marcadores foram colocados junto às afirmações que explicam.
