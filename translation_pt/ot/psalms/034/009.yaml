  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: pt
  text: Temam a Yahweh, seus santos[a], pois nada falta[b] aos que o temem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus consagrados”. Hebraico: “seus santos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não passam necessidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְר֣אוּ
  choice: Temam
  rationale: Imperativo masculino plural de ירא. “Temer” preserva de modo direto a força devocional e sapiencial do hebraico e mantém a ligação lexical com ליראיו no fim do verso.
- source_word: אֶת יְהוָה
  choice: a Yahweh
  rationale: O marcador de objeto direto אֶת não é traduzido lexicalmente; o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no texto hebraico.
- source_word: קְדֹשָׁיו
  choice: seus santos
  rationale: Adjetivo substantivado plural com sufixo de terceira pessoa masculina singular. “Seus santos” é natural e compreensível em português e designa os que pertencem a Deus como consagrados a ele; a alternativa mais literal consta em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação e mantém com naturalidade a relação explicativa.
- source_word: אֵין מַחְסוֹר
  choice: nada falta
  rationale: Expressão idiomática que indica ausência de carência. “Nada falta” é corrente em português e não transforma a afirmação em linguagem excessivamente abstrata.
- source_word: לִירֵאָיו
  choice: aos que o temem
  rationale: A preposição ל com o particípio plural e sufixo pronominal é vertida por uma oração substantivada natural. A repetição de “temer” preserva o elo verbal deliberado com o imperativo inicial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de קְדֹשָׁיו
  choice: seus santos
  alternative: seus consagrados; seus santos seres
  rationale: No contexto da exortação comunitária, a expressão se refere de modo mais natural ao povo fiel pertencente a Yahweh. A tradução não explicita além do hebraico quem integra esse grupo, preservando a concisão do original.
- issue: Alcance de אֵין מַחְסוֹר
  choice: nada falta
  alternative: não passam necessidade
  rationale: A formulação ampla do hebraico é mantida, sem acrescentar uma limitação material ou prometer explicitamente a satisfação de todo desejo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O vocativo “vocês, seus santos” torna explícito em português que קְדֹשָׁיו se dirige aos ouvintes, sem alterar sua referência a Yahweh. Mantiveram-se tanto a repetição de “temer” quanto a afirmação abrangente do hebraico.
