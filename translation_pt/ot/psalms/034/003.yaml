  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: pt
  text: Engrandeçam Yahweh[a] comigo, e juntos exaltemos o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido como “SENHOR” em muitas versões portuguesas.'
    reason: Identifica a forma hebraica e informa a tradução tradicional alternativa.
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Engrandeçam
  rationale: O imperativo plural de גדל convida os ouvintes a proclamar a grandeza de Deus em louvor; “engrandeçam” preserva essa força sem sugerir aumento literal.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino יהוה, em vez de substituí-lo por um título.
- source_word: אִתִּי
  choice: comigo
  rationale: Expressa de modo direto a participação conjunta com o salmista.
- source_word: וּנְרוֹמְמָה
  choice: exaltemos
  rationale: A forma coortativa na primeira pessoa do plural comunica convite e exortação compartilhada, não simples ação futura.
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: Mantém a expressão hebraica, na qual o nome representa a identidade revelada e a reputação da pessoa.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Transmite com naturalidade a ideia de ação unida ou simultânea.
theological_decisions:
- issue: Tradução do nome divino יהוה (YHWH)
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega explicitamente o Tetragrama. “Yahweh” preserva o nome divino, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A colocação de “juntos” antes de “exaltemos” torna explícito o caráter comunitário do convite, sem alterar o sentido do hebraico.
