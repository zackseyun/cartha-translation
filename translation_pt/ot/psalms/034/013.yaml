  language: pt
  text: Guarde a sua língua do mal e os seus lábios de falar engano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Proteja a sua língua do mal e os seus lábios de dizer falsidades.”'
