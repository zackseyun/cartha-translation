lexical_decisions:
- source_word: נְצֹר
  choice: Guarde
  rationale: O imperativo de נצר expressa guardar, vigiar ou preservar. “Guarde” é natural, conciso e mantém a exortação ética do hebraico.
- source_word: לְשׁוֹנְךָ
  choice: a sua língua
  rationale: A tradução concreta preserva a imagem corporal hebraica, facilmente compreendida como referência à fala.
- source_word: מֵרָע
  choice: do mal
  rationale: רַע possui aqui força moral; “mal” preserva melhor essa dimensão do que uma formulação limitada a dano ou prejuízo.
- source_word: וּשְׂפָתֶיךָ
  choice: e os seus lábios
  rationale: Mantém o paralelismo poético concreto entre “língua” e “lábios”.
- source_word: מִדַּבֵּר
  choice: de falar
  rationale: A preposição com o infinitivo é vertida naturalmente como “de falar”, em paralelo com “do mal”.
- source_word: מִרְמָה
  choice: engano
  rationale: מִרְמָה denota engano, fraude ou fala enganosa. “Engano” é claro, atual e adequado ao contexto verbal.
