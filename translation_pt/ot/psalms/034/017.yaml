  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: pt
  text: Clamaram, e Yahweh[a] ouviu; de todas as suas angústias ele os livrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Clamaram
  rationale: O qal perfeito de צעק descreve um clamor urgente por socorro. “Clamaram” é natural no registro dos Salmos e conserva essa força sem acrescentar um objeto ausente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שָׁמֵעַ
  choice: ouviu
  rationale: Embora seja formalmente um particípio, no encadeamento poético com formas perfeitas tem sentido passado e expressa a resposta de Yahweh ao clamor.
- source_word: מִכָּל
  choice: de todas
  rationale: A combinação de מן com כָּל indica livramento para fora da totalidade das angústias.
- source_word: צָרוֹתָם
  choice: suas angústias
  rationale: צרה designa aflição, aperto ou angústia. “Angústias” comunica tanto a adversidade quanto o sofrimento vivido e é corrente em português.
- source_word: הִצִּילָם
  choice: ele os livrou
  rationale: O hifil de נצל significa arrancar do perigo, resgatar ou livrar. “Livrou” preserva a amplitude do termo e o registro bíblico sem impor uma especificação ausente no texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A ordem “de todas as suas angústias ele os livrou” acompanha a ênfase do hebraico sem soar artificial. O ponto e vírgula organiza as duas ações divinas sem apagar a coordenação poética.
