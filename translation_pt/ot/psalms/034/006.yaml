id: PSA.34.6
reference: Psalms 34:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: pt
  text: Este pobre[a] clamou, e Yahweh ouviu e o salvou[b] de todas as suas aflições.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este aflito” ou “este humilde”. O termo hebraico pode indicar pobreza, aflição ou condição humilde.
    reason: lexical_alternative
  - marker: b
    text: Ou “o livrou” ou “o resgatou”. O verbo expressa a ação de salvar alguém do perigo ou da angústia.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Este
  rationale: O demonstrativo aponta para o indivíduo que dá testemunho; “Este” preserva de modo natural a força apresentativa do hebraico.
- source_word: עָנִי
  choice: pobre
  rationale: O termo pode indicar pobreza, aflição ou condição humilde. “Pobre” mantém o sentido concreto e representativo, enquanto a nota registra a amplitude lexical.
- source_word: קָרָא
  choice: clamou
  rationale: No contexto de angústia e resposta divina, o verbo descreve um apelo urgente; “clamou” é natural e digno em português.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שָׁמֵעַ
  choice: ouviu
  rationale: A forma verbal relata a resposta de Deus ao clamor; o pretérito perfeito corresponde naturalmente ao testemunho narrativo.
- source_word: מִכָּל צָרוֹתָיו
  choice: de todas as suas aflições
  rationale: A expressão comunica libertação da totalidade das situações de angústia. “Aflições” preserva o tom poético sem obscurecer o sentido.
- source_word: הוֹשִׁיעוֹ
  choice: o salvou
  rationale: O hifil de ישׁע significa salvar ou livrar de perigo. “Salvou” mantém a ligação com o vocabulário bíblico de salvação e funciona no contexto de socorro imediato.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio da aliança; “Yahweh” o preserva explicitamente, sem convertê-lo em título.
- issue: Masculino singular de עָנִי
  choice: Este pobre
  alternative: Esta pessoa aflita
  rationale: A forma hebraica é masculina singular e se refere diretamente ao salmista, embora sua experiência também possa ser representativa. A tradução mantém essa forma sem excluir a aplicação mais ampla.
translation_notes:
  register: Português atual, claro e reverente, com cadência poética simples. “Clamou” e “aflições” conservam o tom do salmo sem recorrer a linguagem arcaica.
