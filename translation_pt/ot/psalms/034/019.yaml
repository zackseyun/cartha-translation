source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: pt
  text: Muitas são as aflições do justo[a], mas de todas elas Yahweh o livra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitos são os males (ou as dificuldades) do justo”. A palavra hebraica pode designar males, dificuldades ou calamidades; aqui se refere às adversidades que sobrevêm ao justo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Muitas são
  rationale: Preserva a ênfase inicial e a construção predicativa do hebraico, com ordem natural e digna em português.
- source_word: רָעוֹת
  choice: aflições
  rationale: No contexto, designa adversidades sofridas pelo justo. “Aflições” comunica esse sentido sem sugerir que se trate de males morais praticados por ele.
- source_word: צַדִּיק
  choice: o justo
  rationale: Reproduz o substantivo adjetival masculino singular e permite sua função representativa, além de ser uma formulação bíblica clara e corrente em português.
- source_word: וּמִכֻּלָּם
  choice: mas de todas elas
  rationale: “Mas” explicita o contraste contextual entre a multiplicidade das aflições e o livramento abrangente; “de todas elas” preserva a força de כֻּלָּם.
- source_word: יַצִּילֶנּוּ
  choice: o livra
  rationale: O hifil de נצל significa livrar ou resgatar. “Livrar” é natural no contexto e mantém a referência pronominal masculina singular.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Masculino singular representativo em צַדִּיק
  choice: o justo
  alternative: a pessoa justa; os justos
  rationale: A tradução conserva o singular masculino gramatical do hebraico sem negar seu provável alcance representativo.
- issue: Sentido de רָעוֹת aplicado ao justo
  choice: aflições
  alternative: males; dificuldades; calamidades
  rationale: O contexto fala das adversidades das quais Yahweh livra o justo. A escolha evita restringir o termo ao mal moral, mas a nota preserva sua amplitude lexical.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: Mantém no texto o nome pessoal presente no hebraico, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção “Muitas são” conserva a ênfase poética do original; “o justo” mantém o singular representativo sem acrescentar “homem”, que não é lexicalmente explícito.
