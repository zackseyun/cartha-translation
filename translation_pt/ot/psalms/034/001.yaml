  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: pt
  text: Bendirei a Yahweh[a] em todo tempo; seu louvor estará continuamente em minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também tradicionalmente transliterado “Jeová”.'
    reason: Registra a forma consonantal hebraica e uma transliteração alternativa conhecida, enquanto o texto principal usa “Yahweh”.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Bendirei
  rationale: A forma verbal na primeira pessoa do singular, com he paragógico, expressa aqui uma resolução ou compromisso contínuo; o futuro em português comunica naturalmente essa determinação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל עֵת
  choice: em todo tempo
  rationale: Preserva a abrangência temporal do idioma hebraico e mantém uma formulação poética, clara e corrente em português bíblico.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Reforça a constância do louvor sem eliminar a intensificação poética em relação à expressão anterior.
- source_word: תְּהִלָּתוֹ
  choice: seu louvor
  rationale: Traduz diretamente o substantivo 'louvor' com o sufixo masculino singular; no contexto, refere-se ao louvor dirigido a Yahweh.
- source_word: בְּפִי
  choice: em minha boca
  rationale: Mantém a imagem corporal concreta do hebraico para o louvor proferido verbalmente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A repetição semântica entre “em todo tempo” e “continuamente” foi mantida por refletir a intensificação do original.
