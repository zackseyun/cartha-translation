base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: pt
  text: A face de Yahweh está contra os que praticam o mal, para apagar da terra a memória deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para apagar do país a memória deles”, se אֶרֶץ for entendido em sentido local, e não como “a terra” em sentido amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: A face de
  rationale: Mantém a imagem antropomórfica concreta do hebraico. No contexto, a face voltada contra alguém expressa a presença e a oposição ativa de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּעֹשֵׂי רָע
  choice: está contra os que praticam o mal
  rationale: A preposição, neste contexto, indica orientação hostil. A expressão preserva o sentido participial e é natural em português atual.
- source_word: לְהַכְרִית
  choice: para apagar
  rationale: O infinitivo causativo indica propósito ou resultado. Com “memória”, “apagar” comunica de modo idiomático a ideia de eliminar completamente a lembrança, sem enfraquecer o juízo expresso pelo hebraico.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região específica; o contexto sapiencial favorece aqui o sentido geral, mantendo-se a alternativa em nota.
- source_word: זִכְרָם
  choice: a memória deles
  rationale: Reproduz claramente o substantivo “memória/lembrança” e explicita o sufixo pronominal hebraico de modo natural em português.
theological_decisions:
- issue: A imagem da “face de Yahweh” como expressão de oposição divina
  choice: Preservar a formulação concreta “A face de Yahweh está contra...”
  alternative: 'Tornar a expressão abstrata: “A presença de Yahweh está contra...” ou simplesmente “Yahweh está contra...”'
  rationale: A redação conserva a força poética e teológica da linguagem antropomórfica hebraica, apresentando a oposição pessoal e ativa de Deus sem exigir uma interpretação corporal literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem hebraica “face de Yahweh” foi preservada; “praticam o mal” evita transformar o particípio apenas em um rótulo. O marcador de nota aparece no texto principal.
