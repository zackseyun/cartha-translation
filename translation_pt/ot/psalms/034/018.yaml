  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: pt
  text: Yahweh está perto dos que têm o coração partido e salva os de espírito esmagado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os de espírito contrito”. O hebraico pode descrever os que estão interiormente esmagados ou humilhados.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: está perto
  rationale: O adjetivo predicativo significa “perto, próximo”. “Está perto” soa natural em português e preserva tanto a proximidade quanto a dimensão relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: dos que têm o coração quebrantado
  rationale: Reproduz de modo natural a imagem hebraica dos “quebrados de coração”, indicando profunda dor interior.
- source_word: דַּכְּאֵי רוּחַ
  choice: os de espírito esmagado
  rationale: דַּכְּאֵי comunica a ideia intensa de estar esmagado, abatido ou interiormente quebrado. A formulação preserva essa força sem restringir o sentido à contrição penitencial.
- source_word: יוֹשִׁיעַ
  choice: salva
  rationale: O hifil de ישׁע significa salvar, livrar ou resgatar. “Salva” mantém a ligação com o vocabulário bíblico mais amplo de salvação e cabe no sentido imediato de livramento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama. A tradução conserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance de דַּכְּאֵי רוּחַ
  choice: os de espírito esmagado
  alternative: os de espírito contrito
  rationale: O hebraico pode indicar pessoas interiormente esmagadas ou humilhadas, mas o contexto não exige que a expressão seja entendida especificamente como arrependimento penitencial. O texto principal mantém o sentido mais amplo, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura paralela do verso e suas metáforas interiores foram preservadas sem rigidez excessiva.
