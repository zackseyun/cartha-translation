  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: pt
  text: Os leões jovens passam necessidade e fome[a], mas os que buscam Yahweh não carecem de bem algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Os leões jovens empobrecem e passam fome». O verbo hebraico pode indicar estar em necessidade ou tornar-se pobre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: os leões jovens
  rationale: O substantivo designa leões jovens e vigorosos, não meramente filhotes indefesos. A expressão preserva a imagem de predadores fortes que, apesar disso, podem sofrer privação.
- source_word: רָשׁוּ
  choice: passam necessidade
  rationale: O verbo pode indicar estar em necessidade ou tornar-se pobre. A formulação é natural em português e permanece distinta da fome mencionada em seguida.
- source_word: וְרָעֵבוּ
  choice: e fome
  rationale: Em combinação com «passam», expressa de modo conciso que ficam ou passam fome, conservando o paralelismo poético.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: mas os que buscam a Yahweh
  rationale: O particípio descreve pessoas caracterizadas por buscar Yahweh. «Os que buscam» é atual e natural, enquanto «a Yahweh» marca adequadamente o nome como objeto direto referente a pessoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא יַחְסְרוּ
  choice: não carecem
  rationale: O imperfeito comunica aqui uma verdade geral ou garantia proverbial. O presente português transmite naturalmente esse valor.
- source_word: כָל טוֹב
  choice: de bem algum
  rationale: A expressão hebraica abrange qualquer coisa boa. Com a negação, «não carecem de bem algum» preserva seu alcance abrangente sem rigidez.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e segue uma transliteração acadêmica amplamente reconhecida, sem substituí-lo por «SENHOR».
- issue: Alcance da promessa «não carecem de bem algum»
  choice: Preservar a afirmação abrangente sem explicá-la no corpo do versículo
  alternative: Qualificar como «nada do que realmente necessitam»
  rationale: O hebraico afirma de maneira proverbial que os que buscam Yahweh não carecem de qualquer bem. Acrescentar uma qualificação interpretativa resolveria uma tensão que o próprio verso deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com concisão poética. «Passam necessidade e fome» mantém os dois aspectos da privação, e «bem algum» preserva o caráter abrangente da declaração proverbial.
