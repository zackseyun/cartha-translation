base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: pt
  text: Busquei Yahweh, e ele me respondeu; livrou-me de todos os meus temores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todas as coisas que eu temia” ou “de todos os meus terrores”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Busquei
  rationale: Neste contexto, דרשׁ descreve buscar Yahweh em oração e dependência, não apenas fazer uma pergunta. “Busquei” é natural, conciso e adequado ao testemunho do salmo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעָנָנִי
  choice: e ele me respondeu
  rationale: O verbo ענה com o sufixo de primeira pessoa significa naturalmente “respondeu-me”; o pronome “ele” explicita em português o sujeito retomado, Yahweh.
- source_word: מִכָּל
  choice: de todos
  rationale: A combinação de מן com כל expressa livramento abrangente de tudo o que pertence à categoria mencionada.
- source_word: מְגוּרוֹתַי
  choice: meus temores
  rationale: Aqui, מְגוּרוֹתַי se refere aos medos ou às coisas temidas pelo salmista. “Meus temores” preserva a amplitude da expressão e soa natural em português.
- source_word: הִצִּילָנִי
  choice: livrou-me
  rationale: O hifil de נצל comunica retirar do perigo ou livrar. “Livrou-me” mantém o sentido amplo sem restringi-lo a um resgate exclusivamente físico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto e corresponde à transliteração adotada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com construção testemunhal concisa. A forma “livrou-me” conserva fluidez e registro bíblico natural sem arcaísmo excessivo.
