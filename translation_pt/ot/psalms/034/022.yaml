  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: pt
  text: Javé resgata a vida de seus servos[a], e nenhum dos que nele se refugiam será considerado culpado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alma de seus servos”. O hebraico néfesh refere-se aqui à vida ou ao ser vivente como um todo.
    reason: lexical_alternative
  - marker: b
    text: Ou “incorrerá em culpa” ou “será condenado”. O verbo hebraico emprega linguagem de culpa em sentido forense.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: resgata
  rationale: O particípio de פדה expressa ação habitual ou característica de redimir, resgatar ou libertar. “Resgata” comunica com naturalidade o livramento, sem excluir a dimensão redentora do termo.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino, em vez de substituí-lo por um título; “Javé” é uma forma corrente e legível em português.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou o ser vivente como um todo, não necessariamente uma parte imaterial da pessoa.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: “Servos” é a forma natural e contextualmente adequada para os que pertencem a Javé e o servem no contexto do salmo.
- source_word: יֶאְשְׁמוּ
  choice: será considerado culpado
  rationale: Preserva a linguagem forense de אשם, que pode indicar incorrer em culpa, ser declarado culpado ou sofrer condenação, sem especificar além do hebraico.
- source_word: הַחֹסִים בּוֹ
  choice: os que nele se refugiam
  rationale: Mantém a imagem concreta de buscar abrigo ou proteção em Deus, mais precisamente do que o sentido geral de “confiar”.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de salvação
  choice: “vida”
  alternative: “alma”
  rationale: O termo hebraico pode referir-se à pessoa viva ou à própria vida. “Vida” evita impor uma antropologia dualista que o verso não exige; a alternativa legítima é registrada em nota.
- issue: Força de יֶאְשְׁמוּ
  choice: “será considerado culpado”
  alternative: “incorrerá em culpa” ou “será condenado”
  rationale: A tradução conserva o caráter judicial do verbo sem restringi-lo necessariamente à condenação final nem reduzi-lo a sofrimento genérico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético, o nome divino e a linguagem forense do hebraico.
