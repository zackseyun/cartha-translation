source:
  edition: WLC
  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: pt
  text: Em Yahweh minha alma se gloriará; os humildes[a] ouvirão e se alegrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os aflitos” ou “os mansos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: Em Yahweh
  rationale: A preposição בְּ indica aqui a esfera ou o fundamento da exultação. A forma “Em Yahweh” preserva a construção hebraica e representa diretamente o nome divino.
- source_word: תִּתְהַלֵּל
  choice: se gloriará
  rationale: O hitpael de הלל tem aqui o sentido de gloriar-se ou orgulhar-se. “Se gloriará” é natural, poético e mantém o foco de toda exultação em Yahweh.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Embora נֶפֶשׁ possa designar a própria pessoa, “minha alma” conserva a expressão antropológica e poética do hebraico.
- source_word: יִשְׁמְעוּ
  choice: ouvirão
  rationale: O imperfeito qal de שמע acompanha os demais verbos da declaração e admite naturalmente valor futuro neste contexto.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar humildes, mansos ou aflitos. “Os humildes” preserva sua dimensão moral e espiritual sem excluir a condição social de abatimento.
- source_word: וְיִשְׂמָחוּ
  choice: e se alegrarão
  rationale: שמח expressa alegria. “Se alegrarão” é corrente em português e preserva a sequência em que ouvir conduz à alegria.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de gloriar-se em Yahweh
  choice: se gloriará
  alternative: se orgulhará; louvará
  rationale: A forma reflexiva de הלל exprime exultação ou glória fundada em Yahweh, não simples autopromoção nem apenas o ato de louvar. A formulação mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética próxima do hebraico. Emprega-se “Yahweh” para o nome divino e mantém-se “minha alma” em vez de reduzir a expressão a “eu”.
