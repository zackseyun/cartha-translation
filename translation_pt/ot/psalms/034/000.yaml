  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: pt
  text: De Davi[a], quando mudou o seu comportamento diante de Abimeleque, e este o expulsou, e ele foi embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em 1 Samuel 21:10–15, o rei é chamado Aquis; “Abimeleque” aqui pode ser outro nome dele ou um título régio.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, pertencimento, associação ou dedicação. “De Davi” conserva melhor essa amplitude do que “Por Davi” ou “Para Davi”.
- source_word: בְּשַׁנּוֹתוֹ
  choice: quando mudou
  rationale: O infinitivo construto com בְּ tem valor temporal neste contexto; “quando mudou” é natural e fiel.
- source_word: טַעְמוֹ
  choice: o seu comportamento
  rationale: Embora o substantivo possa significar literalmente “gosto”, “discernimento” ou “juízo”, aqui designa a conduta ou aparência exterior assumida por Davi. “Comportamento” comunica o sentido contextual sem impor a interpretação clínica de “sanidade”.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: diante de Abimeleque
  rationale: Tradução direta e idiomática da expressão preposicional, preservando o nome presente no texto hebraico.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: e este o expulsou
  rationale: O verbo significa “expulsar” ou “mandar embora”. “Este” retoma naturalmente Abimeleque e evita que a sequência de pronomes se torne obscura, sem acrescentar uma relação de finalidade ausente do hebraico.
- source_word: וַיֵּלַךְ
  choice: e ele foi embora
  rationale: A forma verbal significa simplesmente “foi”; “foi embora” expressa com naturalidade a partida de Davi depois de ser expulso.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Mantém no texto principal o nome que consta do hebraico; a relação com Aquis é registrada em nota, sem harmonização silenciosa.
theological_decisions:
- issue: Identificação histórica de Abimeleque
  choice: Manter “Abimeleque” no texto principal, conforme o hebraico.
  alternative: Entender “Abimeleque” como outro nome ou como título régio de Aquis, rei de Gate.
  rationale: A primazia do texto na língua original exige preservar o nome hebraico. A tensão com o relato de 1 Samuel é relevante, mas não deve ser resolvida por substituição no texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva o caráter de título do salmo e esclarece discretamente os referentes pronominais sem transformar a sequência narrativa em relação de finalidade.
