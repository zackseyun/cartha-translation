  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: pt
  text: Quem é o homem[a] que deseja a vida e ama dias para ver o bem?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa” ou “alguém”; o hebraico diz “o homem”, em sentido genérico.
    reason: lexical_alternative
  - marker: b
    text: Ou “experimentar o bem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Quem é o homem
  rationale: Mantém a pergunta retórica e o substantivo masculino singular do hebraico, que aqui tem força representativa ou genérica.
- source_word: הֶחָפֵץ חַיִּים
  choice: que deseja a vida
  rationale: חפץ pode indicar desejo, prazer ou agrado. “Deseja a vida” é natural em português e preserva o sentido volitivo sem reduzir a expressão a mero prazer.
- source_word: אֹהֵב יָמִים
  choice: e ama ... dias
  rationale: Preserva o particípio coordenado e o paralelismo entre “vida” e “dias”; em português, o infinitivo complementar é colocado depois do verbo para dar fluidez à frase.
- source_word: לִרְאוֹת טוֹב
  choice: ver dias felizes
  rationale: A expressão hebraica significa literalmente “ver o bem”. No contexto, “ver dias felizes” comunica naturalmente a experiência de dias bons, sem limitar o bem à prosperidade material.
theological_decisions:
- issue: Expressão masculina genérica
  choice: o homem
  alternative: a pessoa; quem
  rationale: O hebraico traz o masculino singular definido הָאִישׁ. A tradução mantém sua forma explícita, enquanto a nota esclarece que a pergunta se aplica genericamente a qualquer pessoa.
- issue: Sentido de “ver o bem”
  choice: ver dias felizes
  alternative: ver o bem; experimentar o bem
  rationale: A ordem portuguesa integra “dias” ao complemento e expressa o valor idiomático da frase. A nota conserva a formulação mais literal e sua amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a pergunta sapiencial e o paralelismo do hebraico, mas reorganiza levemente os elementos finais para soar natural.
