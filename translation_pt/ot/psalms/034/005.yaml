base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: pt
  text: Eles olharam para ele[a] e ficaram radiantes[b], e seus rostos não serão envergonhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradição de leitura hebraica se divide aqui entre “para ele” e “para mim”. O texto principal segue “para ele” por causa do contexto; “para mim” é uma alternativa preservada.
    reason: textual_variant
  - marker: b
    text: Ou “resplandeceram”. O verbo hebraico pode comunicar brilho ou radiância neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: Olharam
  rationale: O hifil de נבט indica voltar o olhar para alguém ou algo. “Olharam” é natural e preserva a concisão poética sem acrescentar intensidade não explicitada.
- source_word: אֵלָי/ו
  choice: para ele
  rationale: A notação testemunha a variação entre a leitura em terceira pessoa, “para ele”, e a forma em primeira pessoa, “para mim”. O contexto favorece “para ele”, enquanto a alternativa é preservada em nota.
- source_word: וְנָהָרוּ
  choice: e ficaram radiantes
  rationale: Neste paralelismo com rosto e vergonha, o verbo comunica brilho ou aspecto radiante, não o sentido literal de fluir. “Ficaram radiantes” expressa naturalmente o resultado.
- source_word: וּפְנֵיהֶם
  choice: o rosto deles
  rationale: O hebraico usa o plural idiomático “seus rostos”. Em português, “o rosto deles” mantém a imagem concreta e soa mais natural.
- source_word: אַל יֶחְפָּרוּ
  choice: não ficou coberto de vergonha
  rationale: Aqui אַל com o imperfeito é entendido no contexto poético como negação do resultado, não como proibição. A expressão preserva a dimensão visível e pública da vergonha e acompanha a imagem do rosto.
theological_decisions:
- issue: Variação de leitura em אֵלָי/ו
  choice: para ele
  alternative: para mim
  rationale: A terceira pessoa se encaixa naturalmente no contexto de pessoas que olham para o SENHOR; a primeira pessoa, preservada pela tradição consonantal representada na fonte, altera a perspectiva do locutor e por isso aparece em nota, sem ser apagada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas acompanha os termos a que se referem. O ponto e vírgula conserva o paralelismo entre radiância e ausência de vergonha.
