  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: pt
  text: Os olhos de Yahweh estão voltados para os justos, e seus ouvidos para o clamor deles por socorro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pedido deles por socorro”. O termo hebraico se refere a um clamor que nasce da aflição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Os olhos de
  rationale: Preserva literalmente a construção hebraica e sua imagem antropomórfica, que comunica a atenção vigilante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: estão voltados para / para
  rationale: Expressa a orientação atenta indicada pela preposição hebraica; no segundo membro, a elipse do verbo conserva o paralelismo poético com naturalidade em português.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Traduz o adjetivo plural substantivado de modo corrente, preservando seu sentido moral e pactual.
- source_word: וְאָזְנָיו
  choice: e os seus ouvidos
  rationale: Mantém o plural e a imagem antropomórfica, em paralelo com “os olhos”.
- source_word: שַׁוְעָתָם
  choice: seu clamor por socorro
  rationale: O substantivo designa um clamor nascido da aflição e dirigido em busca de ajuda; a formulação explicita esse valor sem eliminar a imagem do clamor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem antropomórfica sobre a percepção de Deus
  choice: Preservar literalmente “olhos” e “ouvidos”
  alternative: Parafrasear como “Yahweh cuida” e “Yahweh escuta”
  rationale: As imagens corporais constituem a expressão poética do hebraico e comunicam a atenção e a resposta divinas sem que a tradução dissolva a metáfora.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O paralelismo hebraico foi preservado mediante elipse verbal no segundo membro; o marcador [a] aparece imediatamente após a expressão anotada.
