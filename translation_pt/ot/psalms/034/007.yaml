  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: pt
  text: O anjo de Yahweh acampa ao redor dos que o temem[a] e os livra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”. O termo hebraico מַלְאַךְ pode significar tanto “mensageiro” como “anjo”, embora “anjo” seja o sentido mais provável aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: acampa
  rationale: O particípio qal de חנה descreve a ação habitual ou característica de acampar; “acampa” preserva a imagem concreta e protetora.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode designar mensageiro ou anjo; nesta expressão, o sentido sobrenatural é o mais provável, sem definir mais precisamente a identidade da figura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa naturalmente em português a posição circundante e mantém a imagem de proteção.
- source_word: לִירֵאָיו
  choice: dos que o temem
  rationale: Mantém a expressão bíblica de temor reverente, sem reduzi-la apenas a respeito ou devoção.
- source_word: וַיְחַלְּצֵם
  choice: e os livra
  rationale: Neste contexto, חלץ indica tirar do perigo ou libertar; “livra” é claro, corrente e adequado ao paralelismo protetor.
theological_decisions:
- issue: A identidade e o sentido de מַלְאַךְ יְהוָה
  choice: Traduzir como “o anjo de Yahweh”, sem identificar explicitamente a figura como teofania ou cristofania.
  alternative: “o mensageiro de Yahweh” ou uma identificação teofânica/cristofânica explícita.
  rationale: O contexto favorece o sentido sobrenatural de “anjo”, mas o versículo não resolve a identidade ulterior da figura; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a metáfora militar/protetora de alguém que arma acampamento em torno dos fiéis.
