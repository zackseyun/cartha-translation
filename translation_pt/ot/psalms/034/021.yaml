  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: pt
  text: O mal levará o perverso à morte[a], e os que odeiam o justo serão considerados culpados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A calamidade matará o perverso”. A palavra hebraica também pode significar “dano”, “desgraça” ou “calamidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: levará ... à morte
  rationale: O hifil imperfeito de מות é causativo, tendo רָעָה como sujeito feminino; a expressão preserva a ideia de causar a morte e soa natural em português.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Adjetivo singular substantivado que representa genericamente a pessoa moralmente má, sem explicitar gênero no substantivo escolhido.
- source_word: רָעָה
  choice: o mal
  rationale: O termo pode indicar mal moral, dano ou calamidade. “O mal” conserva a concisão, a personificação e a possível duplicidade semântica do hebraico.
- source_word: שֹׂנְאֵי
  choice: os que odeiam
  rationale: O particípio qal plural em construção é expresso naturalmente por uma oração relativa, preservando seu sentido característico ou contínuo.
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo singular substantivado, empregado aqui como figura representativa; “o justo” é corrente e mantém o singular hebraico.
- source_word: יֶאְשָׁמוּ
  choice: serão considerados culpados
  rationale: O qal imperfeito de אשם comunica culpa ou responsabilidade contraída; a formulação conserva a dimensão forense sem explicitar uma pena além do texto.
theological_decisions:
- issue: Se רָעָה deve ser entendido como mal moral ou como calamidade circunstancial
  choice: o mal
  alternative: a calamidade
  rationale: “O mal” preserva a formulação hebraica, sua personificação e a ironia moral de que o mal destrói o perverso. Como “calamidade” também é contextualmente possível, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e o paralelismo poético foram preservados, evitando linguagem denominacional.
