  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: pt
  text: Pois defendeste o meu direito[a] e a minha causa; sentaste-te no trono, julgando com justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu julgamento e minha causa” ou “meu direito e minha reivindicação”. O hebraico emprega dois termos jurídicos paralelos para a reivindicação vindicada do salmista.
    reason: lexical_alternative
  - marker: b
    text: Ou “julgando justamente”. O substantivo hebraico “justiça” expressa aqui o modo ou o padrão do julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do louvor precedente e mantém de modo natural a ligação causal em português.
- source_word: עָשִׂיתָ מִשְׁפָּטִי וְדִינִי
  choice: defendeste o meu direito e a minha causa
  rationale: O verbo עשה com os dois termos jurídicos comunica a ideia de fazer valer ou sustentar a reivindicação do salmista. “Direito” e “causa” preservam tanto o paralelismo quanto o cenário forense.
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: sentaste no trono
  rationale: Reproduz de modo claro e digno a imagem de Deus tomando seu assento real e judicial.
- source_word: שׁוֹפֵט צֶדֶק
  choice: como justo juiz
  rationale: Entende שׁוֹפֵט como particípio substantivado e צֶדֶק como qualificação da atuação judicial. A formulação é natural em português e preserva a imagem explícita do juiz.
theological_decisions:
- issue: Imagem judicial divina
  choice: Deus aparece entronizado como juiz que faz valer o direito e a causa do salmista.
  alternative: Uma afirmação mais genérica de que Deus agiu em favor do salmista.
  rationale: Os termos jurídicos מִשְׁפָּט e דִּין, unidos ao trono e ao ato de julgar, exigem que a imagem forense permaneça explícita, sem acrescentar categorias doutrinárias posteriores.
- issue: Relação de צֶדֶק com שׁוֹפֵט
  choice: “como justo juiz”
  alternative: “julgando com justiça” ou “julgando justamente”
  rationale: O hebraico permite expressar צֶדֶק como a qualidade ou o modo do julgamento. A nota preserva essa variação legítima sem alterar o sentido central.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a linguagem judicial do hebraico e sua concisão poética.
