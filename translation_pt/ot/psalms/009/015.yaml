base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: pt
  text: As nações afundaram na cova que fizeram; na rede que esconderam, o pé delas ficou preso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “o pé delas” no singular, provavelmente como singular coletivo referente às nações.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: afundaram
  rationale: O qal perfeito indica que as nações afundaram ou foram tragadas; “afundaram” preserva de modo natural a imagem concreta.
- source_word: גּוֹיִם
  choice: as nações
  rationale: O substantivo designa povos ou nações e, neste contexto poético, refere-se coletivamente às nações hostis.
- source_word: בְּשַׁחַת
  choice: na cova
  rationale: שַׁחַת denota uma cova, muitas vezes preparada como armadilha. Com “afundaram”, a preposição portuguesa expressa naturalmente o lugar em que caíram.
- source_word: עָשׂוּ
  choice: que fizeram
  rationale: Mantém o sentido comum de “fazer” e ressalta a ironia de as nações sofrerem na cova produzida por elas mesmas.
- source_word: בְּרֶשֶׁת
  choice: na rede
  rationale: רֶשֶׁת significa “rede”; a expressão locativa corresponde ao paralelismo com a cova e à ideia posterior de ficar preso.
- source_word: זוּ טָמָנוּ
  choice: que esconderam
  rationale: זוּ funciona como partícula relativa, e טָמָנוּ descreve o ato de esconder ou ocultar a rede. A formulação é clara sem acrescentar que ela foi armada.
- source_word: נִלְכְּדָה
  choice: ficou preso
  rationale: O nifal perfeito comunica que o pé foi apanhado. “Ficou preso” conserva a passividade e soa natural em português.
- source_word: רַגְלָם
  choice: o pé delas
  rationale: Preserva o singular coletivo do hebraico e ajusta o pronome ao gênero gramatical de “nações” em português.
