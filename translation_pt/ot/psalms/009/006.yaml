source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: pt
  text: O inimigo foi reduzido a ruínas para sempre[a]; arrancaste cidades pela raiz; até a lembrança delas desapareceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ó inimigo, as destruições terminaram para sempre”. O início hebraico também pode ser entendido como uma fala dirigida diretamente ao inimigo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: O inimigo
  rationale: O artigo definido favorece a leitura como sujeito, “o inimigo”, embora a forma também possa ser entendida como vocativo.
- source_word: תַּמּוּ
  choice: chegou ao fim
  rationale: O verbo תמם expressa conclusão ou término; a formulação comunica com naturalidade a finalidade do juízo.
- source_word: חֳרָבוֹת
  choice: em ruínas
  rationale: O substantivo pode indicar ruínas, devastações ou destruições. “Em ruínas” forma uma expressão portuguesa natural sem perder a imagem de devastação.
- source_word: לָנֶצַח
  choice: eternas
  rationale: Transmite a permanência das ruínas e a ideia de finalidade duradoura.
- source_word: וְעָרִים
  choice: cidades
  rationale: É o sentido comum de עִיר e corresponde diretamente ao contexto.
- source_word: נָתַשְׁתָּ
  choice: arrancaste ... pela raiz
  rationale: Preserva a metáfora forte de נתשׁ, que descreve retirar ou arrancar completamente, como uma planta pela raiz.
- source_word: אָבַד
  choice: desapareceu
  rationale: Neste contexto, o verbo indica que a lembrança deixou de existir; “desapareceu” é natural e solene em português.
- source_word: זִכְרָם
  choice: a lembrança delas
  rationale: Explicita que se trata da recordação das cidades mencionadas imediatamente antes.
- source_word: הֵמָּה
  choice: até
  rationale: O pronome independente final é enfático. “Até” transfere idiomaticamente essa ênfase para a própria lembrança, evitando um pronome final artificial em português.
theological_decisions:
- issue: Construção sintática da oração inicial
  choice: Declaração sobre o fim do inimigo
  alternative: 'Apóstrofe direta: “Ó inimigo, as destruições terminaram para sempre”'
  rationale: O hebraico permite a leitura vocativa, mas o artigo e o fluxo sintático favorecem entender “o inimigo” como sujeito. A alternativa genuína é preservada em nota, sem fazer dela uma questão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito perfeito simples (“arrancaste”) mantém a segunda pessoa singular do hebraico e o tom poético. A tradução conserva a imagem de arrancar pela raiz e registra em nota a ambiguidade sintática real da abertura.
