  yaml_path: translation/ot/psalms/009/014.yaml
  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: pt
  text: para que eu anuncie todos os teus louvores nas portas da Filha de Sião; exultarei na tua salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento”. O termo hebraico pode referir-se tanto ao resgate de um perigo presente quanto à salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade do pedido do salmista e conserva de modo natural a força intencional da expressão hebraica.
- source_word: אֲסַפְּרָה
  choice: eu anuncie
  rationale: O piel de ספר indica contar, narrar ou proclamar. “Anuncie” comunica aqui a declaração pública dos feitos e louvores de Deus.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: todos os teus louvores
  rationale: Mantém o quantificador e o plural hebraicos, abrangendo tanto os louvores dirigidos a Deus quanto aquilo que nele é digno de louvor.
- source_word: בְּשַׁעֲרֵי
  choice: às portas
  rationale: Em português, “às portas” expressa naturalmente o local público associado às entradas da cidade, sem eliminar a imagem hebraica.
- source_word: בַת צִיּוֹן
  choice: Filha de Sião
  rationale: Preserva a personificação poética de Sião/Jerusalém e a forma tradicionalmente inteligível do título em português.
- source_word: אָגִילָה
  choice: exultarei
  rationale: O verbo גיל denota alegria intensa e jubilosa; “exultarei” conserva essa força e o registro poético.
- source_word: בִּישׁוּעָתֶךָ
  choice: na tua salvação
  rationale: ישועה pode indicar livramento concreto ou salvação em sentido amplo. “Salvação” mantém essa amplitude, enquanto a nota registra a alternativa contextual.
theological_decisions:
- issue: Sentido de ישועה
  choice: salvação
  alternative: livramento
  rationale: O contexto envolve resgate diante de inimigos, mas o termo hebraico possui alcance mais amplo. “Salvação” preserva essa tensão e continuidade lexical sem excluir o sentido imediato de livramento.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Emprega “teus/tua” de modo coerente na referência direta a Deus e conserva a personificação “Filha de Sião”.
