base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/000.yaml
  text: 'For the choirmaster: according to “Death of the Son.”[a] A psalm of David.'
translation:
  language: pt
  text: 'Ao mestre de música: segundo “A Morte do Filho”.[a] Salmo de Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica עַלְמוּת לַבֵּן (‘almut labben’, em transliteração) é incerta. Provavelmente se trata de uma orientação musical ou do título de uma melodia; tradicionalmente, também tem sido deixada sem tradução, como se fosse um nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: Nas inscrições dos salmos, a forma com ל funciona normalmente como orientação ao responsável pela execução musical. “Mestre de música” é claro e atual, sem limitar indevidamente sua função à regência de um coro.
- source_word: עַלְמוּת לַבֵּן
  choice: segundo “A Morte do Filho”
  rationale: A expressão é muito incerta, mas provavelmente indica uma melodia ou orientação musical. A tradução como título entre aspas comunica essa função e representa uma análise possível de מות e בן, enquanto a nota preserva a incerteza e a transliteração.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: O substantivo designa regularmente um salmo ou cântico nas inscrições, e “Salmo” preserva de modo natural a indicação de gênero.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição ל pode indicar autoria, associação, dedicação ou pertencimento a uma coleção. “De Davi” conserva melhor essa amplitude do que a formulação mais específica “escrito por Davi”.
