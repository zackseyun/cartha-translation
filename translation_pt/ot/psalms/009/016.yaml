  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: pt
  text: Yahweh se deu a conhecer[a]; fez justiça. O perverso fica enredado pela obra de suas próprias mãos. Higaiom[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh é conhecido; fez justiça”. O hebraico pode indicar tanto um estado passivo (“é conhecido”) quanto o resultado de uma manifestação (“se deu a conhecer”).'
    reason: alternative_reading
  - marker: b
    text: “Higaiom” provavelmente é um termo musical ou litúrgico; também pode significar “meditação” ou indicar música ressonante.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדַע
  choice: se deu a conhecer
  rationale: O nifal de ידע admite sentido passivo ou reflexivo/resultativo. “Se deu a conhecer” expressa a manifestação de Yahweh por meio de seu ato judicial, sem ocultar em nota a leitura alternativa “é conhecido”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: מִשְׁפָּט עָשָׂה
  choice: fez justiça
  rationale: A locução descreve a realização de uma ação judicial. “Fez justiça” é natural em português, conserva o sentido forense e evita a possível conotação moderna de execução penal de “executou juízo”.
- source_word: בְּפֹעַל כַּפָּיו
  choice: na obra de suas próprias mãos
  rationale: Mantém a imagem hebraica e apresenta os próprios atos do perverso como esfera ou meio de sua queda. “Próprias” torna inequívoca a referência reflexiva contextual.
- source_word: נוֹקֵשׁ
  choice: ficou preso
  rationale: Expressa o resultado de cair numa armadilha em português corrente. Embora menos imagético que “foi enlaçado”, permanece fiel à metáfora de aprisionamento.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Preserva o singular substantivado e representativo, usando uma designação natural e digna em português.
- source_word: הִגָּיוֹן
  choice: Higaiom
  rationale: O termo provavelmente é uma indicação musical ou litúrgica, mas seu significado exato é incerto; a transliteração evita uma interpretação indevidamente definitiva.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém transliterado o termo litúrgico ou musical de sentido incerto, conforme o uso bíblico consagrado em português.
theological_decisions:
- issue: Autorrevelação divina por meio do juízo
  choice: Yahweh se deu a conhecer ao fazer justiça
  alternative: Yahweh é conhecido; fez justiça
  rationale: A formulação principal representa נודע com valor reflexivo/resultativo e liga a manifestação de Yahweh à ação judicial narrada. A nota conserva a leitura passiva/estativa legítima, sem ampliar o verso para uma afirmação doutrinária alheia ao contexto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das frases acompanha a progressão poética hebraica. Os termos técnicos incertos são transliterados, e as ambiguidades relevantes são preservadas em notas.
