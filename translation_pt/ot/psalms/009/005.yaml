  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: pt
  text: Repreendeste as nações; destruíste os ímpios[a]; apagaste o nome deles[b] para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ímpio”; o singular hebraico pode referir-se a um indivíduo ou representar coletivamente os ímpios.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “o nome deles”; no contexto, a expressão pode incluir sua memória ou seu renome.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: repreendeste
  rationale: O verbo expressa uma repreensão enérgica e eficaz. “Repreendeste” conserva a ação verbal direta e o tom de juízo.
- source_word: גּוֹיִם
  choice: as nações
  rationale: No contexto do salmo, o termo designa povos organizados coletivamente. “As nações” é natural em português e evita a conotação religiosa posterior de “gentios”.
- source_word: אִבַּדְתָּ
  choice: destruíste
  rationale: A forma intensiva/causativa indica fazer perecer ou destruir; “destruíste” reproduz com clareza a força do verbo.
- source_word: רָשָׁע
  choice: o ímpio
  rationale: O hebraico está no singular e pode designar genericamente uma classe. “O ímpio” preserva essa forma e sua possível leitura representativa, sem excluir a leitura coletiva.
- source_word: שְׁמָם
  choice: o nome deles
  rationale: A expressão significa literalmente “o nome deles”. O pronome plural é preservado, e as implicações de memória ou renome são explicadas em nota.
- source_word: מָחִיתָ
  choice: apagaste
  rationale: O verbo descreve o ato de apagar ou eliminar. “Apagaste” mantém a imagem de remover um nome da memória ou do registro.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão composta intensifica a duração. “Para todo o sempre” é idiomático, solene e conserva essa ênfase.
theological_decisions:
- issue: Sentido coletivo ou individual de רָשָׁע
  choice: 'singular genérico: “o ímpio”'
  alternative: 'coletivo explícito: “os ímpios”'
  rationale: O substantivo/adjetivo hebraico é singular, mas pode representar uma classe. O contexto das nações e o pronome plural em “nome deles” favorecem uma dimensão coletiva; ainda assim, o texto principal conserva o singular e a nota registra a alternativa, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na segunda pessoa do singular para acompanhar o discurso direto a Deus. “Ímpio” mantém o registro bíblico sem ser excessivamente arcaico; a sintaxe concisa preserva o paralelismo poético hebraico.
