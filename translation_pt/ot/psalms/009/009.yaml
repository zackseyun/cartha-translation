source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: pt
  text: E Yahweh será uma fortaleza[a] para o oprimido[b], uma fortaleza em tempos de angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “refúgio” ou “refúgio elevado”; o termo hebraico indica um lugar alto e seguro de proteção.
    reason: lexical_alternative
  - marker: b
    text: Ou “abatido”, “esmagado” ou “humilhado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: E ... será
  rationale: A forma verbal, ligada pela conjunção, é entendida aqui em sentido declarativo e prospectivo. “Será” preserva esse valor sem transformar a afirmação em pedido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִשְׂגָּב
  choice: fortaleza
  rationale: O substantivo designa um lugar alto, seguro e inacessível de proteção. “Fortaleza” comunica naturalmente em português tanto segurança quanto defesa; sua repetição preserva a ênfase poética.
- source_word: לַדָּךְ
  choice: para o oprimido
  rationale: דך descreve alguém abatido, esmagado ou socialmente oprimido. “O oprimido” é claro e idiomático, sem limitar o sentido à pobreza material.
- source_word: לְעִתּוֹת
  choice: em tempos de
  rationale: A expressão preposicional tem sentido temporal e distributivo, indicando ocasiões recorrentes.
- source_word: בַּצָּרָה
  choice: angústia
  rationale: צרה denota aflição, aperto ou dificuldade intensa. “Angústia” mantém a força da imagem e forma uma expressão natural com “tempos de”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, sem substituí-lo pelo título “SENHOR”.
- issue: Valor verbal de וִיהִי
  choice: 'declaração futura: “será”'
  alternative: 'pedido: “seja”; afirmação presente: “é”'
  rationale: Embora a forma possa admitir outros valores conforme a leitura poética, o contexto e a sequência favorecem aqui uma afirmação declarativa. “Será” conserva a orientação prospectiva sem converter o verso numa oração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “uma fortaleza” reproduz o paralelismo e a ênfase do hebraico.
