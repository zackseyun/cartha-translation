  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: pt
  text: Impõe-lhes temor, ó SENHOR; que as nações saibam que são apenas mortais[a]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que são apenas humanos». O hebraico ʼenôsh frequentemente ressalta a condição humana mortal e frágil.'
    reason: Explicita a nuance de אֱנוֹשׁ sem tornar a tradução principal excessivamente interpretativa.
lexical_decisions:
- source_word: שִׁיתָה
  choice: Infunde
  rationale: O imperativo de שׁית significa pôr, colocar ou estabelecer. Em português, “infunde-lhes temor” expressa naturalmente a ideia de fazer o temor tomar conta deles sem alterar a força do pedido.
- source_word: מוֹרָה
  choice: temor
  rationale: Neste contexto, o substantivo é melhor entendido como “temor” ou “terror”. “Temor” preserva a amplitude do hebraico e se ajusta ao pedido para que as nações reconheçam sua condição limitada.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Equivalente corrente de גוים no contexto coletivo dos povos que se opõem ao SENHOR.
- source_word: אֱנוֹשׁ
  choice: seres humanos
  rationale: אֱנוֹשׁ destaca o ser humano em sua fragilidade e mortalidade. O plural natural em português concorda com “eles” e evita o masculino genérico singular pouco idiomático.
- source_word: סֶּלָה
  choice: Selá
  rationale: Transliteração tradicional de um termo litúrgico ou musical cujo sentido exato permanece incerto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Mantém a convenção portuguesa amplamente reconhecida, com versaletes representados por maiúsculas, sem afirmar como certa uma vocalização reconstruída.
- issue: Ênfase antropológica de אֱנוֹשׁ
  choice: não passam de seres humanos
  alternative: são apenas homens
  rationale: Comunica a limitação e fragilidade humana diante de Deus sem introduzir uma afirmação sobre sexo ou resolver além do texto a natureza exata dessa limitação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A formulação preserva o paralelismo do verso e mantém “Selá” sem explicação inserida no corpo do texto.
