id: PSA.9.10
reference: Psalms 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: pt
  text: Os que conhecem o teu nome confiarão em ti[a], pois tu, Yahweh[b], não abandonaste os que te buscam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “conhecem o teu nome”. Aqui, “nome” inclui o caráter e a reputação que Deus revelou, não apenas a forma de chamá-lo.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “não desamparaste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: confiarão em ti
  rationale: O imperfeito qal de בטח expressa confiança segura e, neste contexto poético, admite naturalmente valor futuro. A preposição ב marca aquele em quem se deposita a confiança.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: os que conhecem o teu nome
  rationale: A construção participial caracteriza um grupo por conhecer o nome de Deus. A formulação literal preserva a ressonância relacional e pactual, enquanto a nota esclarece que 'nome' inclui caráter e reputação revelados.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da confiança afirmada na primeira linha e mantém uma ligação poética natural em português.
- source_word: לֹא עָזַבְתָּ
  choice: não abandonaste
  rationale: עזב pode significar deixar, abandonar ou desamparar. 'Não abandonaste' é corrente, forte e preserva o aspecto perfeito hebraico sem exigir uma resolução temporal excessivamente específica.
- source_word: דֹּרְשֶׁיךָ
  choice: os que te buscam
  rationale: דרש, tendo Deus por objeto, descreve buscá-lo com devoção, oração ou desejo de encontrá-lo; 'buscar' é o equivalente português mais amplo e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, distinguindo-o de um título como 'Senhor'.
theological_decisions:
- issue: Sentido de 'conhecer o teu nome'
  choice: manter a expressão no texto e explicar em nota
  alternative: explicitar no texto como 'conhecem quem tu és'
  rationale: A expressão hebraica abrange o caráter e a reputação revelados de Deus, mas substituí-la eliminaria a imagem teologicamente significativa do 'nome'.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino, não o título אֲדֹנָי. A transliteração preserva essa distinção, e a nota registra a tradição de substituí-lo por 'SENHOR'.
- issue: Valor temporal de לֹא עָזַבְתָּ
  choice: não abandonaste
  alternative: não abandonas
  rationale: O perfeito hebraico apresenta a fidelidade de Yahweh como fato constatado. O pretérito perfeito português mantém essa forma sem impedir a relevância contínua da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e paralelismo poético. Usa-se 'teu/ti' de modo coerente para a segunda pessoa singular dirigida a Deus. 'Yahweh' preserva o nome próprio; as notas mantêm alternativas relevantes sem sobrecarregar o versículo.
