  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: pt
  text: Pois aquele que pede contas pelo sangue derramado lembra-se deles; não se esquece do clamor dos aflitos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos pobres”. O termo hebraico pode se referir aos pobres, aflitos, humildes ou oprimidos; neste contexto de violência e apelo por justiça, “aflitos” expressa o sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a afirmação anterior e mantém com naturalidade o encadeamento explicativo do salmo.
- source_word: דֹרֵשׁ דָּמִים
  choice: aquele que pede contas pelo sangue derramado
  rationale: A expressão retrata Deus investigando e exigindo justiça por mortes violentas. A formulação comunica responsabilização judicial sem sugerir mera procura literal por sangue nem impor o cargo técnico de vingador do sangue.
- source_word: אוֹתָם
  choice: deles
  rationale: Mantém o objeto plural indicado pela tradição textual, remetendo ao grupo dos que sofrem.
- source_word: זָכָר
  choice: lembra-se
  rationale: Embora a forma hebraica seja perfeita, o paralelismo poético apresenta uma ação característica e contínua de Deus; o presente soa natural em português.
- source_word: לֹא שָׁכַח
  choice: não se esquece
  rationale: O presente, em paralelo com “lembra-se”, expressa a verdade contínua afirmada pelo salmista.
- source_word: צַעֲקַת
  choice: clamor
  rationale: Expressa de modo digno e corrente um grito de aflição e apelo por socorro e justiça.
- source_word: עניים
  choice: aflitos
  rationale: O termo pode designar pobres, aflitos, humildes ou oprimidos. No contexto de sangue derramado e pedido de justiça, “aflitos” abrange adequadamente os que sofrem sem limitar o sentido à pobreza econômica.
theological_decisions:
- issue: A justiça divina implícita em דֹרֵשׁ דָּמִים
  choice: Deus pede contas pelo sangue derramado, responsabilizando os autores da violência.
  alternative: Deus apenas observa o derramamento de sangue ou procura sangue em sentido literal.
  rationale: O idioma hebraico comunica investigação e retribuição judicial pelo sangue injustamente derramado. A tradução preserva a justiça divina sem identificar Deus com um cargo jurídico humano específico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. “Pede contas” conserva a dimensão judicial do hebraico em linguagem comum; “sangue derramado” explicita o valor idiomático do plural דָּמִים. A colocação pronominal em “lembra-se” e “não se esquece” mantém um registro bíblico natural sem arcaísmo excessivo.
