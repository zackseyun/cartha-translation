source:
  edition: WLC
  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: pt
  text: Eu me alegrarei e exultarei em ti; cantarei louvores ao teu nome, ó Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Altíssimo” é um título divino aplicado a Deus no texto hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Eu me alegrarei
  rationale: O verbo שׂמח expressa alegria. O futuro em português comunica naturalmente, neste contexto poético, a determinação ou intenção da forma hebraica de primeira pessoa.
- source_word: וְאֶעֶלְצָה
  choice: e exultarei
  rationale: עלץ indica alegria intensa e jubilosa. “Exultarei” preserva essa intensidade e mantém a distinção em relação ao verbo anterior.
- source_word: בָךְ
  choice: em ti
  rationale: A preposição ב com o sufixo de segunda pessoa apresenta Deus como o centro ou objeto da alegria. “Em ti” é direto, tradicional e semanticamente adequado.
- source_word: אֲזַמְּרָה
  choice: cantarei louvores
  rationale: No piel, זמר costuma designar o ato de cantar ou fazer música em louvor. “Cantarei louvores” explicita naturalmente o sentido doxológico.
- source_word: שִׁמְךָ
  choice: ao teu nome
  rationale: Com o verbo de louvor, “ao teu nome” é idiomático em português e preserva o termo hebraico “nome”, que representa a pessoa e a reputação revelada de Deus.
- source_word: עֶלְיוֹן
  choice: ó Altíssimo
  rationale: עֶלְיוֹן funciona como título divino e, aqui, como vocativo. A partícula “ó” deixa clara a invocação direta sem acrescentar conteúdo interpretativo.
theological_decisions:
- issue: Tradução do título divino עֶלְיוֹן
  choice: ó Altíssimo
  alternative: Altíssimo; o Altíssimo
  rationale: O hebraico emprega o adjetivo como título divino em discurso dirigido a Deus. “Ó Altíssimo” preserva o título e explicita sua função vocativa apenas por meio da sintaxe natural do português.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. “Exultarei” mantém a intensidade distinta do segundo verbo, e “em ti” conserva a formulação teologicamente significativa do hebraico.
