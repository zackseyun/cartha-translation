  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: pt
  text: Os perversos voltarão ao Sheol[a][b] — todas as nações que se esquecem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recuarão para o Sheol”. O verbo hebraico pode significar “voltar” ou “voltar-se para trás”.'
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o mundo dos mortos; seu sentido não é idêntico ao conceito posterior e mais específico de inferno.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: voltarão
  rationale: O qal imperfeito de שוב pode significar “voltar” ou “retornar”. “Voltarão” preserva o movimento em direção ao Sheol sem reduzir a expressão a uma metáfora de destruição.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente perversas. A forma é concisa, natural e mantém a categoria moral do hebraico.
- source_word: לִשְׁאוֹלָה
  choice: ao Sheol
  rationale: A forma com ה direcional indica movimento para o Sheol. A transliteração preserva o conceito hebraico, mais amplo que “sepultura” e não necessariamente idêntico ao conceito posterior e mais específico de inferno.
- source_word: כָּל גּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם significa “nações” ou “povos”; com כָּל, a expressão é abrangente. “Nações” evita introduzir um contraste específico entre judeus e gentios que não está explicitado.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: que se esquecem de Deus
  rationale: O particípio em construção caracteriza essas nações. A oração relativa é natural em português e conserva o sentido habitual ou característico da expressão.
theological_decisions:
- issue: Sentido de שְׁאוֹל em contexto de juízo
  choice: Manter “Sheol” por transliteração
  alternative: sepultura; mundo dos mortos; inferno
  rationale: Embora o contexto trate do destino dos perversos, o termo hebraico não exige o sentido doutrinário posterior e mais específico de “inferno”. A transliteração preserva a precisão e a tensão teológica do texto.
- issue: Ambiguidade de יָשׁוּבוּ
  choice: “voltarão” no texto, com alternativa em nota
  alternative: “retornarão” ou “recuarão”
  rationale: O verbo pode expressar voltar ou retornar. A tradução principal mantém o sentido mais direto, enquanto a nota reconhece a alternativa lexical genuína sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Perversos” comunica com clareza a avaliação moral; “Sheol” é preservado como termo cultural e teologicamente preciso. Os marcadores aparecem junto aos elementos que explicam.
