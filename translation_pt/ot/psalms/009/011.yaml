  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: pt
  text: Cantem louvores a Yahweh, que habita em Sião;[a] anunciem entre os povos os seus feitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que está entronizado em Sião”.'
    reason: A expressão hebraica יֹשֵׁב צִיּוֹן pode indicar tanto que Yahweh habita em Sião quanto que ali está entronizado.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Cantem louvores
  rationale: O imperativo plural de זמר, neste contexto de adoração, reúne o sentido musical e o de louvor; a expressão é natural e clara em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יְהוָה como nome próprio, preservando o nome da aliança presente no texto hebraico.
- source_word: יֹשֵׁב צִיּוֹן
  choice: que habita em Sião
  rationale: O particípio יֹשֵׁב pode expressar habitação ou entronização. A tradução principal preserva a ideia da presença divina sem explicitar além do texto a imagem régia.
- source_word: הַגִּידוּ
  choice: anunciem
  rationale: O imperativo hifil de נגד indica tornar conhecido ou proclamar publicamente; “anunciem” conserva essa força e soa natural no registro poético.
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: A preposição ב indica o âmbito da proclamação, e o plural “povos” preserva o caráter coletivo e étnico de עַמִּים.
- source_word: עֲלִילוֹתָיו
  choice: os seus feitos
  rationale: עֲלִילוֹתָיו designa suas ações ou obras; “feitos” é conciso e não acrescenta a qualificação “poderosos”, ausente do substantivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Nuance de יֹשֵׁב צִיּוֹן
  choice: que habita em Sião
  alternative: que está entronizado em Sião
  rationale: A forma יֹשֵׁב admite tanto a noção de residência quanto a de entronização. O texto principal mantém a leitura mais ampla, enquanto a nota registra a imagem régia plausível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural e paralelismo poético preservado. O ponto e vírgula mantém a relação estreita entre o chamado ao louvor e o chamado à proclamação.
