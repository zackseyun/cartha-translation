translation:
  language: pt
  text: 'Quando os meus inimigos recuam,

    tropeçam e perecem diante de ti.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na tua presença”. Literalmente: “de diante da tua face/presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quando ... recuam
  rationale: A preposição בְּ com o infinitivo construto de שׁוב introduz uma oração temporal. “Quando ... recuam” é natural em português e, com אָחוֹר, expressa o movimento de voltar para trás ou bater em retirada.
- source_word: אוֹיְבַי
  choice: os meus inimigos
  rationale: O substantivo אֹיֵב com sufixo de primeira pessoa do singular significa diretamente “meus inimigos”.
- source_word: אָחוֹר
  choice: recuam
  rationale: O advérbio אָחוֹר, combinado com שׁוב, indica movimento para trás. Em português, “recuam” comunica idiomaticamente a ideia conjunta, sem exigir a expressão redundante “voltam para trás”.
- source_word: יִכָּשְׁלוּ
  choice: tropeçam
  rationale: O nifal de כשל preserva a imagem de perder o equilíbrio ou falhar, sem antecipar a destruição expressa pelo verbo seguinte.
- source_word: וְיֹאבְדוּ
  choice: e perecem
  rationale: O qal de אבד pode significar perecer ou ser destruído. “Perecem” mantém a concisão poética e não especifica além do hebraico o modo da ruína.
- source_word: מִפָּנֶיךָ
  choice: diante de ti
  rationale: A expressão significa literalmente “de diante da tua face/presença”. “Diante de ti” preserva de modo natural a força espacial e relacional; a possível nuance causal ligada à presença divina é indicada em nota.
theological_decisions:
- issue: A ação divina na queda dos inimigos
  choice: O texto afirma que os inimigos tropeçam e perecem diante de Deus, sem explicar o mecanismo de sua queda.
  alternative: Explicitar que Deus os destrói diretamente ou que eles caem apenas por causa de sua presença.
  rationale: O hebraico מִפָּנֶיךָ permite a ideia de estar diante de Deus e pode sugerir que a queda ocorre por causa de sua presença. A tradução principal conserva a formulação sem resolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com fluidez poética. “Recuam” traduz de forma idiomática a combinação שׁוב + אָחוֹר. O pronome “ti” mantém o tratamento singular tradicional e amplamente compreensível dirigido a Deus.
