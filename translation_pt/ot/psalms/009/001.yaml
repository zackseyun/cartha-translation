  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: pt
  text: Darei graças a Yahweh de todo o coração; contarei todas as tuas maravilhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teus feitos maravilhosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Darei graças
  rationale: O hifil de ידה frequentemente expressa gratidão ou louvor no culto. “Darei graças” comunica de modo natural a ação de agradecer diretamente a Yahweh, sem excluir a dimensão de louvor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: בְּכָל לִבִּי
  choice: de todo o coração
  rationale: Expressão idiomática portuguesa natural que preserva a ideia hebraica de devoção interior plena.
- source_word: אֲסַפְּרָה
  choice: contarei
  rationale: O verbo ספר aqui indica narrar ou relatar; “contarei” é claro, atual e adequado ao testemunho dos atos de Deus.
- source_word: כָּל
  choice: todo / todas
  rationale: 'A totalidade é mantida nos dois membros do verso: “todo o coração” e “todas as tuas maravilhas”.'
- source_word: נִפְלְאוֹתֶיךָ
  choice: tuas maravilhas
  rationale: O substantivo derivado de פלא designa maravilhas ou atos extraordinários, especialmente intervenções divinas. “Tuas maravilhas” preserva a forma nominal e a amplitude do hebraico; a possível ênfase nos atos é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino por transliteração, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e solene, com construção paralela natural. Emprega “de todo o coração”, expressão amplamente compreensível, e mantém “Yahweh” como nome próprio.
