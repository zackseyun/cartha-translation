  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: pt
  text: Levanta-te, ó Yahweh! Não deixes que o ser humano[a] prevaleça; sejam as nações julgadas diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mortal” ou “o homem mortal”. O termo hebraico אֱנוֹשׁ pode destacar a fragilidade e a mortalidade humanas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: Imperativo de קום dirigido a Deus. A forma pronominal é natural em português e preserva o apelo enfático por intervenção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַל יָעֹז
  choice: Não deixes que ... prevaleça
  rationale: A partícula negativa com a forma verbal de sentido volitivo expressa uma súplica para que Deus não permita o triunfo humano. “Prevaleça” comunica bem o sentido contextual de mostrar-se forte ou sair vitorioso.
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: Preserva o singular representativo e o contraste entre a humanidade e Deus, em linguagem portuguesa atual. A nuance de fragilidade e mortalidade é registrada em nota.
- source_word: יִשָּׁפְטוּ
  choice: sejam ... julgadas
  rationale: 'A forma nifal plural de שׁפט é entendida aqui em sentido judicial passivo: as nações comparecem sob o julgamento divino.'
- source_word: גּוֹיִם
  choice: as nações
  rationale: Equivalente comum e contextualmente adequado para os povos coletivamente.
- source_word: עַל־פָּנֶיךָ
  choice: diante de ti
  rationale: Expressão idiomática que preserva o sentido de estar na presença de Deus para julgamento, sem reproduzir literalmente “diante da tua face”.
theological_decisions:
- issue: Nuance antropológica de אֱנוֹשׁ
  choice: o ser humano
  alternative: o mortal; o homem mortal
  rationale: O termo pode enfatizar a fragilidade ou mortalidade humana. O texto principal mantém a referência singular e representativa, enquanto a nota conserva explicitamente essa nuance sem restringir a referência a uma pessoa do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levanta-te” mantém o tom poético e solene do apelo, enquanto “não deixes que” expressa naturalmente a força volitiva da construção hebraica.
