  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: pt
  text: Pois o necessitado não será esquecido para sempre, nem a esperança dos aflitos[a] perecerá para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “humildes” ou “mansos” (hebraico ענוים).
    reason: lexical_alternative
  - marker: b
    text: No hebraico, duas expressões quase paralelas, ambas traduzidas aqui por “para sempre”, enfatizam que o necessitado não será abandonado definitivamente.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém de modo natural a força explicativa ou fundamentadora da conjunção no contexto.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa o sentido temporal duradouro e preserva o paralelismo com a expressão final.
- source_word: יִשָּׁכַח
  choice: será esquecido
  rationale: Reproduz a forma passiva do hebraico sem explicitar Deus como sujeito, embora o contexto o implique.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Designa quem vive em necessidade ou pobreza, preservando tanto a vulnerabilidade econômica quanto a social.
- source_word: תִּקְוַת
  choice: a esperança dos
  rationale: Traduz naturalmente a forma construta e sua ligação com o substantivo seguinte.
- source_word: ענוים
  choice: os aflitos
  rationale: No paralelismo com אֶבְיוֹן, destaca a condição de sofrimento e vulnerabilidade, sem eliminar os possíveis matizes de humildade ou mansidão.
- source_word: תֹּאבַד
  choice: não perecerá
  rationale: O verbo significa perecer ou desaparecer; a negação é suprida em português pela elipse poética derivada da primeira oração.
- source_word: לָעַד
  choice: para sempre
  rationale: É quase sinônimo de לָנֶצַח e a repetição conserva a ênfase do paralelismo hebraico.
theological_decisions:
- issue: Referente implícito de “será esquecido”
  choice: Manter a construção passiva, sem nomear Deus como sujeito.
  alternative: “Deus não se esquecerá do necessitado para sempre.”
  rationale: O hebraico não explicita o agente. A forma passiva preserva a poesia e evita acrescentar um sujeito gramatical, embora o contexto indique a ação divina.
- issue: Sentido de ענוים
  choice: “aflitos”
  alternative: “humildes” ou “mansos”
  rationale: O termo admite dimensões sociais e morais. O paralelismo com “necessitado” favorece aqui a condição de sofrimento, mas a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “para sempre” foi mantida para reproduzir a ênfase poética; “necessitado” e “aflitos” preservam a vulnerabilidade social sem restringir o sentido apenas à pobreza econômica.
