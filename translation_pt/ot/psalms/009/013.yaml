id: PSA.9.13
reference: Psalms 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: pt
  text: Tem compaixão de mim[a], ó Yahweh; vê a minha aflição causada pelos que me odeiam, tu que me ergues das portas da morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sê bondoso comigo” ou “Concede-me teu favor”.'
    reason: lexical_alternative
  - marker: b
    text: “As portas da morte” são uma imagem hebraica que representa o limiar ou o poder da morte.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Tem compaixão de mim
  rationale: O imperativo de חנן com sufixo de primeira pessoa pede favor gracioso. “Tem compaixão de mim” é uma formulação natural e digna em português, sem limitar o pedido apenas ao alívio emocional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רְאֵה
  choice: vê
  rationale: Reproduz diretamente o imperativo de ראה e preserva o apelo para que Deus atente à situação do salmista.
- source_word: עָנְיִי
  choice: a minha aflição
  rationale: עֳנִי denota aflição, miséria ou sofrimento; “aflição” mantém a abrangência do termo sem especificar indevidamente sua natureza.
- source_word: מִשֹּׂנְאַי
  choice: causada pelos que me odeiam
  rationale: 'Torna natural em português a relação mais provável de מִן com “minha aflição”: o sofrimento procede daqueles que odeiam o salmista.'
- source_word: מְרוֹמְמִי
  choice: tu que me ergues
  rationale: O particípio polel com sufixo de primeira pessoa funciona como aposto vocativo dirigido a Yahweh; a formulação conserva tanto a ação contínua quanto o endereço pessoal.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: das portas da morte
  rationale: Preserva literalmente a imagem hebraica do limiar ou domínio da morte, sem introduzir “Sheol”, termo ausente neste versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome em transliteração, em vez de substituí-lo por um título.
- issue: Relação sintática de מִשֹּׂנְאַי
  choice: 'Ligado a “minha aflição”: “aflição causada pelos que me odeiam”'
  alternative: 'Ligação mais solta: “vê a minha aflição; [vê] os que me odeiam”'
  rationale: A leitura causal ou de origem é a relação sintática mais natural, embora o hebraico compacto permita uma associação mais solta. Não se acrescenta um segundo imperativo ao texto principal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O vocativo “ó Yahweh” conserva o tom de oração; “tu que me ergues” mantém a construção participial e o tratamento direto. Os marcadores [a] e [b] aparecem junto às expressões que explicam.
