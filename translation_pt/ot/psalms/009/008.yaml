  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: pt
  text: E ele julgará o mundo com justiça; julgará os povos com equidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּא
  choice: E ele
  rationale: A conjunção com o pronome dá continuidade ao pensamento e confere leve ênfase ao sujeito, sem exigir a forma mais marcada “ele mesmo”.
- source_word: יִשְׁפֹּט
  choice: julgará
  rationale: שׁפט designa julgar ou exercer autoridade judicial; o futuro expressa naturalmente a declaração poética sem excluir a ideia de ação característica.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תבל costuma indicar o mundo habitado ou a ordem humana, e “o mundo” comunica esse alcance universal de modo natural em português.
- source_word: בְּצֶדֶק
  choice: com justiça
  rationale: A expressão indica o padrão ou modo do julgamento. “Com justiça” preserva o substantivo e soa mais natural em português atual do que “em justiça”.
- source_word: יָדִין
  choice: julgará
  rationale: דין tem sentido judicial direto neste paralelismo. A repetição é retoricamente natural em português bíblico e mantém a correspondência sem ampliar o verbo para “governar”.
- source_word: לְאֻמִּים
  choice: os povos
  rationale: לאמים refere-se coletivamente a povos ou nações; “os povos” evita restringir o sentido a Estados nacionais modernos.
- source_word: בְּמֵישָׁרִים
  choice: com equidade
  rationale: מישרים denota retidão, imparcialidade ou equidade. “Com equidade” conserva o valor judicial e forma um paralelo claro com “com justiça”.
theological_decisions:
- issue: O julgamento divino universal
  choice: Empregar verbos no futuro, afirmando que Deus julgará o mundo e os povos com justiça e equidade, sem definir um calendário escatológico.
  alternative: 'Entender os verbos como ação presente ou habitual: “julga o mundo” e “julga os povos”.'
  rationale: No hebraico poético, as formas yiqtol podem apontar para ação futura ou característica. O futuro se ajusta ao contexto declarativo, mas a tradução não acrescenta uma especificação doutrinária que o verso não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo hebraico foi preservado por meio da repetição de “julgará” e da correspondência entre “com justiça” e “com equidade”.
