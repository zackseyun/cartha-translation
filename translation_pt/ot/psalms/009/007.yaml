  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: pt
  text: Mas Yahweh está entronizado[a] para sempre; estabeleceu o seu trono para o julgamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “está sentado”. A tradução “está entronizado” explicita o sentido régio no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “preparou o seu trono para exercer justiça”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Mas Yahweh
  rationale: A conjunção é entendida em sentido adversativo pelo contraste com a ruína dos ímpios no contexto anterior; o nome divino é transliterado como “Yahweh”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração perpétua em português corrente e natural.
- source_word: יֵשֵׁב
  choice: permanece entronizado
  rationale: O sentido básico é “senta-se/está sentado”; no contexto real e judicial, “permanece entronizado” comunica tanto a continuidade quanto a imagem régia, explicitada pelo trono no segundo membro.
- source_word: כּוֹנֵן
  choice: firmou
  rationale: O polel comunica a ação de tornar firme, estabelecer ou preparar; “firmou” preserva de modo conciso a ideia de estabilidade.
- source_word: לַמִּשְׁפָּט
  choice: para julgar
  rationale: A construção indica a finalidade judicial do trono. A forma verbal é idiomática em português, embora “para o julgamento” e “para exercer justiça” também sejam possíveis.
- source_word: כִּסְאוֹ
  choice: seu trono
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo de terceira pessoa masculina singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Nuance régia de יֵשֵׁב
  choice: permanece entronizado
  alternative: está sentado; reina
  rationale: A formulação explicita a imagem real sugerida pelo contexto de trono sem substituir o verbo pela interpretação mais ampla “reina”.
- issue: Amplitude semântica de מִשְׁפָּט
  choice: julgar
  alternative: exercer justiça
  rationale: O contexto apresenta o trono como sede da ação judicial divina. A alternativa ressalta o resultado justo dessa ação, mas o texto permite manter em primeiro plano o ato de julgar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Entronizado” conserva a imagem régia; “firmou” é conciso e solene sem soar arcaico.
