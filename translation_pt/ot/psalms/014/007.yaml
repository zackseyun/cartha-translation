id: PSA.14.7
reference: Psalms 14:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: pt
  text: Quem dera viesse de Sião a salvação de Israel! Quando Yahweh restaurar a sorte de seu povo,[a] Jacó exultará, Israel se alegrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “trouxer de volta o cativeiro de seu povo”. O idioma hebraico muitas vezes significa restaurar a condição de um povo ou reverter seu infortúnio.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática introduz um desejo intenso, não uma pergunta literal. “Quem dera” é natural em português e preserva o tom optativo.
- source_word: מִצִּיּוֹן
  choice: de Sião
  rationale: A preposição מן indica origem ou procedência; “Sião” é a forma portuguesa consagrada do topônimo.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: a salvação de Israel
  rationale: A cadeia construta indica a salvação pertencente ou destinada a Israel. “Salvação” mantém tanto o sentido de livramento quanto sua amplitude teológica.
- source_word: בְּשׁוּב יְהוָה
  choice: Quando Yahweh restaurar
  rationale: A construção temporal com שוב e o objeto seguinte exprime a reversão da condição do povo; o futuro do subjuntivo é idiomático após “quando” em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: שְׁבוּת עַמּוֹ
  choice: a sorte de seu povo
  rationale: No idioma שׁוּב שְׁבוּת, a expressão costuma indicar restauração da condição ou reversão do infortúnio, não necessariamente retorno de um cativeiro literal.
- source_word: יָגֵל
  choice: exultará
  rationale: גיל denota alegria intensa; “exultará” preserva essa força e distingue o verbo do paralelo seguinte.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma portuguesa tradicional do nome, usado poeticamente para designar o povo da aliança.
- source_word: יִשְׂמַח
  choice: se alegrará
  rationale: Expressa a alegria de שמח em linguagem natural e mantém a variação lexical do paralelismo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada em português; aqui funciona coletivamente em paralelo com “Jacó”.
theological_decisions:
- issue: Sentido do idioma שׁוּב שְׁבוּת
  choice: restaurar a sorte de seu povo
  alternative: trazer de volta o cativeiro de seu povo / trazer de volta os cativos de seu povo
  rationale: O contexto não identifica explicitamente um exílio histórico, e o idioma hebraico frequentemente descreve de modo mais amplo a reversão do infortúnio. A tradução principal mantém essa amplitude, enquanto a nota registra a formulação mais literal e a possível referência ao cativeiro.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A inversão “viesse de Sião a salvação” conserva o foco poético na origem da salvação sem soar excessivamente arcaica. “Jacó” e “Israel” permanecem distintos para preservar o paralelismo hebraico.
