base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: pt
  text: 'Ao regente[a]. De Davi[b].


    O insensato diz no coração:


    “Não há Deus.”


    Eles se corromperam; praticaram atos abomináveis[c];


    não há quem faça o bem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao diretor musical” ou “Ao mestre de canto”.
    reason: lexical_alternative
  - marker: b
    text: “De Davi” também pode significar “por Davi” ou “para Davi” no cabeçalho do salmo.
    reason: lexical_alternative
  - marker: c
    text: O hebraico passa do singular (“o insensato”) para o plural (“eles se corromperam”), indo do indivíduo representativo para o grupo que ele representa.
    reason: source_ambiguity
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Designa a pessoa responsável pela execução musical; preserva a concisão do cabeçalho e evita especificar indevidamente coro ou instrumento.
- source_word: נָבָל
  choice: insensato
  rationale: No contexto sapiencial, indica alguém moral e espiritualmente tolo, não apenas alguém com pouca inteligência.
- source_word: בְּלִבּוֹ
  choice: no coração
  rationale: Mantém a imagem hebraica do coração como centro do pensamento, da vontade e da disposição interior.
- source_word: הִשְׁחִיתוּ
  choice: se corromperam
  rationale: Reproduz o sentido de degradação moral expresso pela forma verbal hebraica.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: cometeram atos abomináveis
  rationale: Expressa de modo natural a ideia de tornar abominável a conduta ou praticar ações repugnantes.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: não há quem faça o bem
  rationale: Conserva a afirmação universal e a formulação simples do hebraico.
theological_decisions:
- issue: Sentido de אֵין אֱלֹהִים
  choice: “Deus não existe”
  alternative: “Não há Deus”
  rationale: Torna explícito em português o sentido natural da negação da existência de Deus, sem acrescentar uma explicação teológica.
- issue: Mudança do singular para o plural
  choice: Manter “o insensato” no singular e “eles” no plural
  alternative: Uniformizar todo o trecho no singular ou no plural
  rationale: Preserva a mudança gramatical do hebraico, em que o indivíduo representativo dá lugar ao grupo caracterizado pela mesma atitude.
- issue: Relação de לְדָוִד com o salmo
  choice: De Davi
  alternative: Por Davi; para Davi
  rationale: Mantém a fórmula tradicional e a ambiguidade possível do cabeçalho hebraico, esclarecida em nota.
translation_notes:
  register: Português atual, claro e digno, com estrutura poética concisa. O cabeçalho foi separado do corpo do salmo, e o paralelismo hebraico foi preservado sem rigidez artificial.
