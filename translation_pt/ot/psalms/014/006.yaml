  naturalness: A redação é clara, concisa e apropriada para português moderno. “Vocês envergonham o conselho do pobre” conserva a formulação figurada e algo abrupta do original, adequada ao registro poético do salmo. “Yahweh é seu refúgio” é mais fluente que “Yahweh é o seu refúgio”, sem alterar o referente pretendido.
  terminology: “Yahweh”, “pobre”, “conselho” e “refúgio” são escolhas consistentes com o texto hebraico e com o audit trail em inglês. A nota, porém, deve conservar o sentido de ‘pôr em vergonha’, não substituí-lo por “frustrar”, que é mais interpretativo e desloca o foco semântico do verbo.
