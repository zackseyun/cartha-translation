  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: pt
  text: Vocês envergonham o conselho do pobre[a], porque Yahweh é seu refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês envergonham o plano do pobre”. O hebraico pode significar “conselho” ou “plano” do pobre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: o conselho de
  rationale: O substantivo em estado construto עֲצַת pode indicar conselho, plano ou propósito. “Conselho” conserva essa amplitude sem restringir o sentido a um plano interior ou a uma recomendação falada.
- source_word: עָנִי
  choice: o pobre
  rationale: עָנִי pode designar alguém pobre, aflito ou oprimido. “O pobre” é claro e natural em português e, no contexto, ainda sugere sua condição vulnerável.
- source_word: תָבִישׁוּ
  choice: Vocês envergonham
  rationale: A forma hifil na segunda pessoa do plural significa causar vergonha ou expor à vergonha. A tradução explicita o sujeito plural e mantém a acusação direta.
- source_word: כִּי
  choice: porque
  rationale: 'A conjunção introduz aqui a razão pela qual a tentativa de envergonhar o pobre e seu conselho é indevida: Yahweh o protege.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַחְסֵהוּ
  choice: o seu refúgio
  rationale: מַחְסֶה denota refúgio ou abrigo, e o sufixo masculino singular remete ao pobre. “O seu refúgio” preserva de modo natural a metáfora de proteção.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
- issue: Referente do sufixo em מַחְסֵהוּ
  choice: o pobre
  alternative: o conselho do pobre
  rationale: O sufixo masculino singular refere-se naturalmente à pessoa pobre mencionada imediatamente antes, apresentando Yahweh como seu refúgio.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para tornar explícita a segunda pessoa do plural hebraica. A formulação mantém a concisão e a ambiguidade lexical de עֲצָה tanto quanto possível.
