source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: pt
  text: Acaso não sabem todos os que praticam a maldade, os que devoram o meu povo como quem come pão[a] e não invocam Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “comem o meu povo; comem pão” — expressão que compara o modo como consomem o povo de Deus ao ato corriqueiro de comer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso não... ?
  rationale: Expressa a pergunta retórica hebraica, que espera resposta afirmativa, de modo natural em português.
- source_word: יָדְעוּ
  choice: sabem
  rationale: O presente comunica bem a caracterização geral e retórica do hebraico; o verbo pode denotar saber, conhecer ou reconhecer.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: todos os que praticam a maldade
  rationale: Reproduz o sentido da construção participial em linguagem atual e mantém seu peso moral sem recorrer ao termo mais arcaico “iniquidade”.
- source_word: אֹכְלֵי עַמִּי
  choice: os que devoram o meu povo
  rationale: “Devoram” comunica com clareza a violência da metáfora, enquanto a nota registra a forma literal “comem”.
- source_word: אָכְלוּ לֶחֶם
  choice: como quem come pão
  rationale: Torna explícita em português a comparação idiomática criada pela justaposição hebraica, sem alterar sua imagem cotidiana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֹא קָרָאוּ
  choice: não invocam
  rationale: No contexto do nome divino, קרא descreve invocar a Deus em oração ou culto; o presente acompanha a caracterização geral dos malfeitores.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva a referência ao nome pessoal de Deus sem substituí-lo por um título.
- issue: Sentido de “não invocam”
  choice: referência ampla à oração ou ao culto dirigido a Yahweh
  alternative: “não clamam a Yahweh”, com ênfase específica em pedido de socorro
  rationale: קרא com o nome divino pode abranger invocação religiosa em geral; a tradução evita restringir indevidamente o sentido a um clamor por auxílio.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica natural e legibilidade ampla, inclusive no Brasil. “Praticam a maldade” evita arcaísmo; “devoram” conserva a força da imagem, e a nota documenta a formulação hebraica literal.
