source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: pt
  text: 'Ao regente[a]. De Davi[b]. O insensato diz em seu coração: “Deus não existe”. Eles se corromperam e praticaram atos detestáveis[c]. Não há quem faça o bem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao diretor de música” ou “Ao mestre de canto”.
    reason: lexical_alternative
  - marker: b
    text: “De Davi” também pode significar “por Davi”, “para Davi” ou indicar associação com Davi.
    reason: lexical_alternative
  - marker: c
    text: O hebraico passa do singular (“o insensato”) ao plural (“eles se corromperam”), indo do indivíduo representativo para o grupo que ele representa.
    reason: source_text_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: O termo do cabeçalho designa quem dirige a execução musical. “Ao regente” é conciso, natural em português e não restringe indevidamente a função a um coro.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição ל nos títulos dos salmos pode indicar autoria, associação ou dedicação. “De Davi” conserva melhor essa abertura do que “escrito por Davi”.
- source_word: נָבָל
  choice: o insensato
  rationale: O termo caracteriza insensatez moral e espiritual, não simples deficiência intelectual. “O insensato” preserva a figura representativa no singular.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: No uso hebraico, o coração abrange pensamento, intenção e vontade; a expressão literal continua clara e natural em português.
- source_word: אֵין אֱלֹהִים
  choice: Deus não existe
  rationale: Expressa diretamente a negação existencial e soa mais natural em português atual do que “Não há Deus”, sem substituir a afirmação por uma interpretação de suas consequências.
- source_word: הִשְׁחִיתוּ
  choice: Eles se corromperam
  rationale: O hifil pode transmitir corrupção ou ruína moral. A forma pronominal portuguesa comunica naturalmente que o grupo se tornou corrupto.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: praticaram atos detestáveis
  rationale: A combinação verbal e nominal descreve conduta tornada abominável. “Atos detestáveis” é atual, digna e semanticamente direta.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Não há quem faça o bem
  rationale: Mantém de perto a construção existencial hebraica e expressa com clareza a ausência de alguém que pratique o bem.
theological_decisions:
- issue: Alcance de אֵין אֱלֹהִים
  choice: 'Negação existencial: “Deus não existe”.'
  alternative: Paráfrases de ateísmo prático, como “Deus não importa” ou “não haverá juízo”.
  rationale: Embora o contexto exponha uma vida de impiedade prática, a formulação hebraica declara diretamente a inexistência ou ausência de Deus; a tradução não deve trocar a declaração por uma consequência interpretativa.
- issue: Mudança do singular נָבָל para verbos no plural
  choice: Preservar “O insensato...” e depois “Eles se corromperam...”.
  alternative: Uniformizar tudo no singular ou pluralizar a frase inicial.
  rationale: A mudança apresenta primeiro uma figura representativa e depois a classe que ela representa. Mantê-la conserva uma tensão gramatical e retórica genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O cabeçalho permanece conciso; a mudança deliberada de número é preservada, e as notas registram ambiguidades reais sem sobrecarregar o versículo.
