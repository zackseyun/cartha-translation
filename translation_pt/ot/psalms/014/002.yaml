  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: pt
  text: Yahweh olha do céu para os filhos dos homens[a], para ver se há alguém que tenha entendimento, alguém que busque a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos do homem”, expressão representativa que se refere aos seres humanos em geral.'
