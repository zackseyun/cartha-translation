lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִשָּׁמַיִם הִשְׁקִיף
  choice: olha do céu
  rationale: Expressa de modo natural a ação de observar a partir de um lugar elevado; o presente mantém a vivacidade poética.
- source_word: בְּנֵי אָדָם
  choice: os filhos dos homens
  rationale: Conserva a expressão hebraica representativa, esclarecendo em nota que ela abrange os seres humanos em geral.
- source_word: מַשְׂכִּיל
  choice: alguém que tenha entendimento
  rationale: Reproduz a ideia de discernimento ou compreensão sem restringi-la indevidamente à sabedoria técnica.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: alguém que busque a Deus
  rationale: Mantém o particípio ativo e o paralelismo com a descrição anterior.
theological_decisions:
- issue: Linguagem masculina representativa em בְּנֵי אָדָם
  choice: os filhos dos homens
  alternative: a humanidade
  rationale: A expressão se refere à humanidade em geral, mas sua forma masculina representativa é preservada no texto e seu alcance é explicado em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A formulação mantém o paralelismo poético e preserva a imagem hebraica sem perder clareza.
