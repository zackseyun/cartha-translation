base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: pt
  text: Todos se desviaram; juntos se corromperam.[a] Não há quem faça o bem, nem sequer um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juntos se contaminaram” ou “juntos se tornaram imundos”. O verbo hebraico transmite a ideia de tornar-se estragado ou corrupto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Todos
  rationale: O termo com artigo tem sentido abrangente, “todos”. No contexto, refere-se coletivamente às pessoas e preserva o alcance universal da afirmação.
- source_word: סָר
  choice: se desviaram
  rationale: O verbo סור significa “desviar-se, afastar-se”. Embora esteja morfologicamente no singular por concordar com um sujeito coletivo, o plural é natural em português.
- source_word: יַחְדָּו
  choice: juntos
  rationale: O advérbio expressa ação coletiva; “juntos” conserva esse sentido de participação comum sem acrescentar interpretação.
- source_word: נֶאֱלָחוּ
  choice: se corromperam
  rationale: A forma nifal indica que se tornaram estragados ou corruptos. “Se corromperam” comunica de modo natural tanto o processo quanto o estado resultante.
- source_word: אֵין
  choice: Não há
  rationale: A partícula de inexistência introduz uma negação enfática, expressa com naturalidade em português por “Não há”.
- source_word: עֹשֵׂה טוֹב
  choice: quem faça o bem
  rationale: O particípio com טוֹב descreve a prática característica de fazer o bem. A formulação é clara, idiomática e fiel.
- source_word: גַּם אֶחָד
  choice: nem sequer um
  rationale: A combinação intensifica a negação. “Nem sequer um” reproduz sua força enfática em português corrente.
theological_decisions:
- issue: Alcance da afirmação universal sobre a corrupção humana
  choice: Manter a acusação universal, sem atenuá-la nem restringi-la.
  alternative: Apresentar a frase apenas como uma descrição geral de muitas pessoas.
  rationale: 'O hebraico emprega linguagem abrangente e reiterada: “todos”, “não há” e “nem sequer um”. A tradução conserva essa força retórica e teológica sem importar formulações doutrinárias posteriores.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados, e o marcador [a] aparece imediatamente após a expressão a que se refere.
