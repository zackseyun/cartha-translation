source:
  edition: WLC
  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: pt
  text: Ali ficaram tomados de grande pavor[a], pois Deus está com a geração dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «temeram um temor», expressão enfática que indica que foram tomados de grande pavor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Deus está entre a geração dos justos».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: Mantém a concisão e a força dêitica do advérbio hebraico, apontando para a cena em que o terror irrompe.
- source_word: פָּחֲדוּ פָחַד
  choice: ficaram tomados de grande pavor
  rationale: Reproduz de modo natural a ênfase da construção cognata hebraica, literalmente «temeram um temor», sem conservar uma repetição pouco idiomática em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão do pavor e preserva o tom poético.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O plural morfológico tem referência singular ao Deus de Israel neste contexto.
- source_word: בְּדוֹר
  choice: com a geração
  rationale: A preposição ב pode indicar presença no meio de ou junto a um grupo; «com» expressa com clareza a presença de Deus sem eliminar a alternativa «entre».
- source_word: צַדִּיק
  choice: dos justos
  rationale: Embora formalmente singular, o adjetivo caracteriza coletivamente a geração; esta formulação é natural em português e preserva a categoria moral.
theological_decisions:
- issue: Relação de Deus com os justos em בְּדוֹר צַדִּיק
  choice: Deus está com a geração dos justos
  alternative: Deus está entre a geração dos justos
  rationale: «Com» comunica presença e solidariedade divina no contexto, enquanto a nota preserva o valor locativo possível da preposição hebraica sem acrescentar uma definição doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. «Ali» conserva a brevidade do hebraico; «ficaram tomados de grande pavor» comunica sua intensificação idiomática. Os marcadores seguem imediatamente as expressões às quais se referem.
