  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: pt
  text: Pois o teu amor leal está diante dos meus olhos[a], e tenho andado na tua verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua lealdade à aliança”, em vez de “o teu amor leal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na tua fidelidade”, em vez de “na tua verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a afirmação do salmista no contexto e conserva naturalmente a função explicativa do hebraico.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade duradoura, muitas vezes em contexto de aliança. “Amor leal” preserva tanto a dimensão afetiva quanto a constância relacional sem limitar o termo à misericórdia.
- source_word: לְנֶגֶד עֵינַי
  choice: diante dos meus olhos
  rationale: Mantém a imagem hebraica e comunica de modo idiomático algo que o salmista conserva conscientemente à vista.
- source_word: וְהִתְהַלַּכְתִּי
  choice: e tenho andado
  rationale: Preserva a metáfora hebraica do andar como modo de vida. O pretérito perfeito composto expressa uma conduta mantida até o presente.
- source_word: בַּאֲמִתֶּךָ
  choice: na tua verdade
  rationale: אֱמֶת pode indicar verdade, fidelidade ou confiabilidade. “Na tua verdade” mantém a amplitude do termo e a formulação metafórica do hebraico, enquanto a nota registra a alternativa contextual.
theological_decisions:
- issue: Amplitude semântica dos termos divinos חֶסֶד e אֱמֶת
  choice: Traduzir חֶסֶד por “amor leal” e אֱמֶת por “verdade”, sem restringir nenhum deles a uma única nuance teológica.
  alternative: Traduzir חֶסֶד por “lealdade à aliança” e אֱמֶת por “fidelidade”.
  rationale: O versículo apresenta o caráter relacional e confiável de Deus como referência para a conduta do salmista. A tradução conserva a riqueza dos dois termos e as notas tornam explícitas suas principais alternativas sem impor uma interpretação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural tanto no Brasil quanto em outros contextos lusófonos. A imagem bíblica de “andar” foi preservada por ser clara em contexto, e os pronomes de segunda pessoa mantêm o tom direto da oração.
