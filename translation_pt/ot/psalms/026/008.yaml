  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: pt
  text: Ó Yahweh, eu amo a morada da tua casa e o lugar onde habita a tua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Ó Yahweh, amei a morada da tua casa e o lugar da habitação da tua glória.”'
    reason: Registra o valor formal possível do perfeito אָהַבְתִּי e a estrutura nominal mais literal da segunda metade.
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título; a interjeição corresponde ao vocativo poético.
- source_word: אָהַבְתִּי
  choice: eu amo
  rationale: Embora seja uma forma perfeita, no contexto da confissão poética expressa uma disposição firme e presente; esta formulação é natural em português.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: a morada da tua casa
  rationale: Mantém tanto o sentido concreto de מְעוֹן como a imagem hebraica de 'tua casa', sem especificá-la interpretativamente como 'templo'.
- source_word: וּמְקוֹם מִשְׁכַּן
  choice: o lugar onde habita
  rationale: Expressa em português corrente a construção nominal hebraica, literalmente próxima de 'o lugar da habitação', sem perder a imagem de residência.
- source_word: כְּבוֹדֶךָ
  choice: a tua glória
  rationale: '''Glória'' é a correspondência usual e adequada para כָּבוֹד quando se refere à presença manifesta de Deus.'
theological_decisions:
- issue: Identificação do santuário
  choice: tua casa
  alternative: teu templo
  rationale: O hebraico diz literalmente 'tua casa'. A tradução conserva essa imagem e evita restringir o referente além do que o verso declara.
- issue: Relação da glória divina com o lugar
  choice: onde habita a tua glória
  alternative: onde a tua glória está entronizada
  rationale: A construção fala de habitação, não explicitamente de entronização; a opção escolhida preserva a linguagem espacial e a tensão própria da presença divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo e as imagens concretas do hebraico; o pronome possessivo informal-solene 'tua' harmoniza com o vocativo dos Salmos.
