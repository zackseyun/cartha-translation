source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: pt
  text: De Davi. Faz-me justiça, ó Yahweh, pois tenho andado em minha integridade e tenho confiado em Yahweh; não vacilarei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não escorregarei” ou “não cambalearei”. O hebraico retrata a perda de firmeza dos pés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ no título pode indicar autoria, associação ou dedicação. “De Davi” é natural em português e mantém essa amplitude.
- source_word: שָׁפְטֵנִי
  choice: Faz-me justiça
  rationale: O imperativo de שׁפט é literalmente “julga-me”, mas neste apelo forense pede uma sentença favorável ou vindicação. “Faz-me justiça” comunica esse sentido sem apagar a dimensão judicial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּתֻמִּי
  choice: em minha integridade
  rationale: תֹּם/תֻּמָּה expressa inteireza, integridade ou conduta irrepreensível. “Integridade” preserva a reivindicação moral sem necessariamente sugerir perfeição sem pecado.
- source_word: הָלַכְתִּי
  choice: tenho andado
  rationale: Mantém a metáfora hebraica do andar como modo de vida, compreensível no registro bíblico moderno.
- source_word: בָּטַחְתִּי
  choice: tenho confiado
  rationale: בטח indica confiança e dependência segura; a forma composta acompanha naturalmente o valor retrospectivo dos perfeitos hebraicos.
- source_word: לֹא אֶמְעָד
  choice: não vacilarei
  rationale: מעד descreve perder a firmeza, cambalear ou escorregar. “Não vacilarei” preserva a imagem de estabilidade e soa natural em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino; “Yahweh” o conserva de modo direto.
- issue: Natureza da afirmação בְּתֻמִּי
  choice: em minha integridade
  alternative: em minha irrepreensibilidade
  rationale: A expressão sustenta um apelo moral e judicial, mas não exige que o salmista esteja afirmando perfeição absoluta.
- issue: Valor de לֹא אֶמְעָד
  choice: não vacilarei
  alternative: não escorrego; não tenho vacilado
  rationale: O imperfeito pode expressar confiança futura ou estabilidade resultante da confiança. A tradução mantém a declaração de confiança sem convertê-la em garantia teológica mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a metáfora bíblica “andar” e usa-se “Faz-me justiça” para exprimir naturalmente o apelo judicial. O único marcador de nota aparece no texto e corresponde à nota fornecida.
