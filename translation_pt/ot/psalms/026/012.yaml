source:
  edition: WLC
  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: pt
  text: Meu pé está firme em terreno plano[a]; nas assembleias, bendirei Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num lugar plano”; o hebraico também pode sugerir retidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: Meu pé
  rationale: O substantivo hebraico está no singular com sufixo de primeira pessoa; o singular é natural em português e preserva a imagem pessoal de estabilidade.
- source_word: עָמְדָה
  choice: está firme
  rationale: 'O perfeito qal, concordando com o sujeito feminino singular, pode descrever um estado presente resultante: o pé se encontra estabelecido. “Está firme” comunica essa estabilidade sem impor uma referência temporal passada.'
- source_word: בְּמִישׁוֹר
  choice: em terreno plano
  rationale: מִישׁוֹר designa terreno nivelado ou lugar plano e pode sugerir retidão. A escolha mantém em primeiro plano a imagem concreta, deixando a possível nuance moral para a nota.
- source_word: בְּמַקְהֵלִים
  choice: nas assembleias
  rationale: O plural de קהל indica reuniões ou grupos reunidos. “Assembleias” preserva o plural e evita restringir a expressão a uma instituição religiosa específica.
- source_word: אֲבָרֵךְ
  choice: bendirei
  rationale: O piel de ברך significa literalmente “abençoar” ou “bendizer”. Referido a Deus, “bendirei” é idiomático e conserva mais diretamente o verbo hebraico do que “louvarei”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome divino diretamente. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Possível dimensão moral de מִישׁוֹר
  choice: Manter a imagem concreta no texto e registrar a nuance de retidão em nota
  alternative: Traduzir diretamente como “em retidão”
  rationale: O termo admite a imagem de um lugar plano e também uma conotação de retidão. Traduzir apenas a leitura moral eliminaria a metáfora espacial e resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção mantém o paralelismo poético e o singular concreto “meu pé”. “Bendirei” preserva o sentido lexical de ברך em registro bíblico ainda compreensível.
