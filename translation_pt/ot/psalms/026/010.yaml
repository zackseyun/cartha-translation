lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: em cujas mãos
  rationale: A expressão retoma os homens perversos do versículo anterior e preserva de modo natural em português a imagem hebraica das mãos como esfera ou instrumento de suas ações.
- source_word: זִמָּה
  choice: maldade
  rationale: Neste contexto, em paralelo com subornos, o termo indica corrupção moral ou intenção perversa em sentido amplo, sem exigir a conotação sexual que pode ter em outros contextos.
- source_word: וִימִינָם
  choice: e cuja mão direita
  rationale: Mantém o singular coletivo do hebraico e a imagem da mão direita como instrumento de ação e poder.
- source_word: מָלְאָה
  choice: está cheia de
  rationale: Expressa naturalmente o sentido estativo do verbo hebraico.
- source_word: שֹׁחַד
  choice: subornos
  rationale: Embora o substantivo hebraico esteja no singular, ele tem valor genérico; o plural em português comunica com naturalidade a prática habitual de corrupção.
