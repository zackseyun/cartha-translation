source:
  edition: WLC
  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: pt
  text: 'Não recolhas a minha alma com os pecadores,

    nem a minha vida com homens sanguinários.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homens de sangues”, expressão hebraica para homens violentos ou culpados de derramamento de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: recolhas
  rationale: אָסַף significa fundamentalmente reunir ou recolher; neste contexto de juízo, pode também sugerir levar alguém junto com outros. “Recolhas” conserva a imagem hebraica e permite essa implicação contextual.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode indicar alma, vida ou a própria pessoa. “A minha alma” mantém a distinção poética em relação a חַיָּי, sem impor aqui uma definição antropológica técnica.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: O substantivo designa pessoas caracterizadas pelo pecado; “pecadores” é direto, corrente e fiel à categoria moral do hebraico.
- source_word: אַנְשֵׁי דָמִים
  choice: homens sanguinários
  rationale: A expressão, literalmente “homens de sangues”, é um idioma hebraico para pessoas violentas ou culpadas de derramamento de sangue. “Homens sanguinários” comunica essa ideia sem restringi-la apenas a assassinos.
- source_word: חַיָּי
  choice: a minha vida
  rationale: Em paralelo com נַפְשִׁי, o plural formal חַיָּי é naturalmente traduzido como “a minha vida”, preservando a intensificação poética.
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל introduz uma súplica negativa. “Não recolhas” é uma formulação natural e digna em português.
theological_decisions:
- issue: Nuance antropológica de נַפְשִׁי e חַיָּי
  choice: 'Manter os termos poéticos distintos: “a minha alma” e “a minha vida”.'
  alternative: Traduzir de modo mais genérico, como “a mim” e “a minha vida”, ou empregar “vida” nos dois membros.
  rationale: O paralelismo usa termos relacionados, mas distintos. Preservá-los mantém o peso poético e teológico sem transformar o verso numa afirmação técnica sobre a constituição humana.
- issue: Sentido judicial de אָסַף
  choice: Conservar a imagem básica de “recolher”, deixando o contexto comunicar a ideia de compartilhar o destino dos ímpios.
  alternative: Explicitar como “não me leves junto” ou “não me arrastes”.
  rationale: O verbo admite uma conotação de ser levado junto no juízo, mas o sentido lexical básico é reunir ou recolher. A formulação escolhida preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem paralela do hebraico foi preservada. “Homens sanguinários” mantém a linguagem masculina do texto e comunica o idioma hebraico com naturalidade; a nota registra sua forma literal.
