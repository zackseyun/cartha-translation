  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: pt
  text: Eu, porém, andarei na minha integridade; resgata-me e concede-me tua graça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tem misericórdia de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Eu, porém
  rationale: A conjunção e o pronome independente marcam contraste e ênfase; a ordem natural em português preserva ambos.
- source_word: בְּתֻמִּי
  choice: na minha integridade
  rationale: תֻּם denota inteireza, integridade ou conduta irrepreensível. “Integridade” mantém a força moral sem necessariamente afirmar impecabilidade absoluta.
- source_word: אֵלֵךְ
  choice: andarei
  rationale: Preserva a metáfora hebraica de andar como modo de viver e a forma verbal prospectiva do contexto.
- source_word: פְּדֵנִי
  choice: resgata-me
  rationale: פדה expressa resgatar ou redimir alguém de perigo ou aflição. “Resgata-me” é direto e natural em português, mantendo a imagem de libertação.
- source_word: וְחָנֵּנִי
  choice: e concede-me tua graça
  rationale: חנן significa mostrar favor ou graça. Esta formulação comunica o pedido de favor imerecido com naturalidade e preserva sua distinção em relação à mera compaixão.
theological_decisions:
- issue: Sentido da afirmação do salmista sobre תֻּם
  choice: A expressão descreve integridade ou retidão de conduta.
  alternative: Uma alegação mais forte de irrepreensibilidade ou inocência.
  rationale: O contexto contrasta a vida do salmista com a dos perversos, mas o próprio pedido por resgate e graça impede que a tradução resolva a tensão como uma afirmação inequívoca de impecabilidade absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora de “andar” foi preservada. A colocação pronominal em “resgata-me” e “concede-me” mantém um tom poético e solene sem recorrer a linguagem arcaica.
