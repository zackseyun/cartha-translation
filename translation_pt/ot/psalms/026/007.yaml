  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: pt
  text: para proclamar com voz de gratidão[a] e contar todas as tuas maravilhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fazer ouvir uma voz de gratidão”. O verbo hebraico está na forma causativa (“fazer ouvir”); “proclamar” expressa esse sentido de maneira idiomática.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os teus feitos maravilhosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: para proclamar
  rationale: O infinitivo hifil de שׁמע significa literalmente “fazer ouvir”. “Proclamar” expressa de modo natural em português esse sentido causativo e público.
- source_word: בְּקוֹל
  choice: com voz
  rationale: Preserva a imagem concreta do hebraico, literalmente “com/em voz”, sem ampliar o texto com um possessivo ausente.
- source_word: תּוֹדָה
  choice: gratidão
  rationale: Neste contexto de expressão vocal, תּוֹדָה designa agradecimento ou ação de graças. “Gratidão” forma uma expressão clara e natural com “voz”.
- source_word: וּלְסַפֵּר
  choice: e contar
  rationale: O piel de ספר indica narrar ou relatar. “Contar” é corrente, mantém o paralelismo poético e evita repetir “proclamar”.
- source_word: כָּל
  choice: todas
  rationale: Transmite diretamente o sentido abrangente do hebraico e concorda com “maravilhas”.
- source_word: נִפְלְאוֹתֶיךָ
  choice: as tuas maravilhas
  rationale: O substantivo plural pode designar as maravilhas de Deus ou seus feitos extraordinários. A formulação conserva a concisão e a amplitude do hebraico, sem explicitar “feitos” no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. Mantém-se a segunda pessoa singular (“tuas”), comum no registro bíblico e fiel ao sufixo hebraico singular.
