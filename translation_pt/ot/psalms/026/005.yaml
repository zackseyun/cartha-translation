  rationale: O perfeito qal na primeira pessoa do singular expressa aqui uma postura firme e duradoura; o presente é natural em português e evita restringir a afirmação ao passado.
- source_word: קְהַל
  choice: a reunião
  rationale: Designa um grupo reunido. “Reunião” preserva o sentido coletivo sem sugerir necessariamente uma congregação de culto.
- source_word: מְרֵעִים
  choice: dos que praticam o mal
  rationale: O particípio substantivado caracteriza pessoas por sua prática do mal; a construção é clara e corrente em português.
- source_word: וְעִם
  choice: e ... com
  rationale: A conjunção e a preposição ligam diretamente o segundo membro ao primeiro; em português, “com” integra naturalmente a expressão “sentar-se com”.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado indica pessoas moralmente perversas e mantém o paralelismo poético com “os que praticam o mal”.
- source_word: לֹא אֵשֵׁב
  choice: não me sentarei
  rationale: O imperfeito negado comunica decisão ou recusa persistente. A forma futura preserva tanto a imagem de sentar-se quanto o tom de resolução.
