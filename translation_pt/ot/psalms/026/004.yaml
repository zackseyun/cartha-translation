  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: pt
  text: 'Não me sentei com homens falsos,

    nem entrarei com os que se ocultam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem vou com os que se ocultam”. O hebraico pode designar pessoas que escondem sua verdadeira índole, isto é, pessoas dissimuladas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: me sentei
  rationale: O verbo significa literalmente “sentar-se, habitar, permanecer”; com עִם (“com”), também sugere manter convivência. “Me sentei” preserva a imagem concreta do hebraico.
- source_word: מְתֵי שָׁוְא
  choice: homens falsos
  rationale: A expressão construta significa literalmente “homens de falsidade”; em português corrente, “homens falsos” comunica de modo natural a ideia moral de mentira, fraude ou engano associada a שָׁוְא.
- source_word: נַעֲלָמִים
  choice: os que escondem quem são
  rationale: O termo deriva de עלם, “ocultar”, e provavelmente descreve pessoas dissimuladas, cuja verdadeira índole permanece escondida. A formulação mantém a noção de ocultação sem impor o termo mais interpretativo “hipócritas”.
- source_word: אָבוֹא
  choice: me junto
  rationale: בוא significa “vir, ir, entrar”. Aqui, com עִם e em paralelo com “sentar-se com”, indica entrar na companhia dessas pessoas. “Me junto” expressa naturalmente essa relação em português, embora torne implícita a imagem espacial.
- source_word: וְעִם
  choice: nem ... aos
  rationale: A conjunção e a preposição ligam a segunda declaração negativa à primeira. “Nem” reproduz com naturalidade a coordenação negativa portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. A primeira linha conserva a imagem hebraica de sentar-se com alguém; a segunda usa uma expressão idiomática natural para a ideia de entrar em sua companhia. O marcador foi colocado junto ao termo efetivamente explicado pela nota.
