  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: pt
  text: Lavo as mãos em inocência[a] e ando ao redor do teu altar[b], ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em pureza” ou “em limpeza”. O termo hebraico pode indicar tanto inocência moral quanto pureza ritual.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e andarei ao redor do teu altar”. A forma hebraica também pode expressar resolução ou intenção.'
    reason: verbal_ambiguity
lexical_decisions:
- source_word: אֶרְחַץ
  choice: Lavo
  rationale: O imperfeito qal na primeira pessoa do singular pode descrever uma ação habitual ou vividamente presente no contexto poético. “Lavo” é natural em português e evita impor um sentido estritamente futuro.
- source_word: בְּנִקָּיוֹן
  choice: em inocência
  rationale: נִקָּיוֹן abrange limpeza, pureza e inocência. “Em inocência” conserva aqui a dimensão moral sem excluir por completo a imagem de purificação ritual.
- source_word: כַּפָּי
  choice: as mãos
  rationale: Embora כף designe literalmente a palma, o plural dual nesta expressão corresponde naturalmente a “as mãos” em português.
- source_word: וַאֲסֹבְבָה
  choice: e rodeio
  rationale: O verbo סבב significa ir ao redor, circundar. A forma com terminação cohortativa pode sugerir intenção ou resolução, mas, em sequência com אֶרְחַץ, o presente “rodeio” produz uma leitura poética natural sem tornar a ação exclusivamente futura.
- source_word: מִזְבַּחֲךָ
  choice: o teu altar
  rationale: Tradução direta de מִזְבֵּחַ com sufixo de segunda pessoa masculina singular. “Teu” mantém a interpelação direta e o registro poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando-o como nome próprio em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido moral e ritual de בְּנִקָּיוֹן
  choice: em inocência
  alternative: em pureza; em limpeza
  rationale: O contexto associa o gesto de lavar as mãos à integridade alegada pelo salmista, mas a linguagem também evoca purificação ritual. A tradução principal destaca o aspecto moral, e a nota preserva a amplitude lexical.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração mantém o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Força verbal de וַאֲסֹבְבָה
  choice: e rodeio
  alternative: e rodearei; para rodear
  rationale: A forma pode ser entendida como ação presente/habitual ou como expressão de intenção e propósito. O texto principal acompanha a sequência verbal de modo natural, enquanto a nota registra a possibilidade volitiva ou final.
translation_notes:
  register: Português moderno, claro e poético, com formas de segunda pessoa (“teu”) adequadas à oração dirigida a Deus. “Rodeio o teu altar” preserva a imagem concreta do movimento ao redor do altar; as notas mantêm as ambiguidades lexical e verbal do hebraico.
