  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: pt
  text: 'De Davi.


    Faz-me justiça, Yahweh,[a]

    pois tenho andado com integridade[b]

    e tenho confiado em Yahweh;

    não vacilarei.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Julga-me, Yahweh”. Aqui, o verbo provavelmente significa “decide a meu favor” ou “vindica-me”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em minha inteireza” ou “de modo irrepreensível”. O termo hebraico denota integridade, inteireza e conduta sem culpa.
    reason: lexical_alternative
  - marker: c
    text: Ou “não escorregarei” ou “não perderei a firmeza”. A imagem hebraica é a de perder o apoio dos pés.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Faz-me justiça
  rationale: No contexto, o imperativo de שׁפט pede que Yahweh julgue a causa do salmista e o vindique; esta formulação comunica esse sentido sem excluir a imagem judicial.
- source_word: בְּתֻמִּי
  choice: com integridade
  rationale: תֹּם expressa inteireza moral, integridade ou conduta irrepreensível. “Integridade” preserva bem a amplitude do termo em português atual.
- source_word: הָלַכְתִּי
  choice: tenho andado
  rationale: Mantém a metáfora hebraica de andar como modo de viver e apresenta a conduta como mantida até o presente.
- source_word: בָּטַחְתִּי
  choice: tenho confiado
  rationale: Expressa confiança mantida em Yahweh, em paralelo com “tenho andado”.
- source_word: לֹא אֶמְעָד
  choice: não vacilarei
  rationale: מעד retrata perder a firmeza ou escorregar. “Vacilarei” conserva a ideia de instabilidade sem tornar a linha excessivamente literal.
theological_decisions:
- issue: A afirmação de integridade do salmista
  choice: 'Preservar a declaração direta: “tenho andado com integridade”'
  alternative: Atenuar como mera intenção ou alegação subjetiva
  rationale: O hebraico faz uma afirmação franca de integridade no âmbito da causa apresentada a Yahweh. A tradução não deve transformá-la numa reivindicação de impecabilidade absoluta nem enfraquecê-la.
- issue: Relação entre confiança e estabilidade
  choice: Manter “não vacilarei” como declaração de confiança
  alternative: Traduzir como “sem vacilar”, ligando a expressão ao ato passado de confiar
  rationale: A acentuação e a forma verbal favorecem uma oração própria voltada ao futuro, embora a imagem também possa exprimir firmeza presente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva o nome divino “Yahweh”, a metáfora bíblica de “andar” como modo de viver e a disposição poética em linhas. O título foi mantido como “De Davi”, sem explicitar uma relação autoral que o hebraico não especifica.
