base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: pt
  text: Examina-me, ó Yahweh, e põe-me à prova; refina meus rins[a] e meu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “rins”, imagem antiga para os pensamentos, sentimentos ou afetos mais íntimos.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Examina-me
  rationale: בחן indica examinar ou verificar a autenticidade. “Examina-me” é natural em português e mantém distinção em relação ao verbo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְנַסֵּנִי
  choice: e põe-me à prova
  rationale: נסה expressa provar ou testar. A locução portuguesa preserva o paralelismo e evita repetir “examinar”.
- source_word: צרופה
  choice: refina
  rationale: צרף pertence à linguagem metalúrgica de refinar ou purificar metais; “refina” conserva essa imagem concreta.
- source_word: כִלְיוֹתַי
  choice: meus rins
  rationale: Mantém a imagem antropológica literal do hebraico, na qual os rins representam o íntimo da pessoa; a nota esclarece o sentido cultural.
- source_word: וְלִבִּי
  choice: e meu coração
  rationale: לב designa o coração e, figuradamente, o centro do pensamento, da vontade e da vida interior. “Coração” preserva a imagem poética tradicional.
theological_decisions:
- issue: Imagem antropológica da poesia hebraica
  choice: Conservar “meus rins” e “meu coração” no texto principal.
  alternative: Substituir por “meu íntimo e meu coração” ou “minha mente e meu coração”.
  rationale: Os dois órgãos formam uma imagem concreta da interioridade humana. Mantê-los preserva a força poética e evita reduzir a amplitude da metáfora; a nota explica ao leitor moderno o uso figurado de “rins”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com colocação pronominal natural em registro bíblico-literário. “Ó Yahweh” preserva o vocativo, e o ponto e vírgula mantém o paralelismo poético.
