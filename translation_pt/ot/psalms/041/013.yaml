  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: pt
  text: Bendito seja Yahweh, o Deus de Israel, de eternidade a eternidade. Amém e amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: A fórmula doxológica com particípio passivo é expressa de modo natural e solene em português, preservando seu valor litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Representa diretamente a construção hebraica e soa natural em português.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: desde a eternidade e para sempre
  rationale: Comunica os dois limites temporais sem fim da expressão hebraica e mantém um registro doxológico natural; literalmente, a construção repete o termo עוֹלָם.
- source_word: אָמֵן וְאָמֵן
  choice: Amém e amém
  rationale: Preserva a repetição enfática e a fórmula litúrgica de assentimento.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega o Tetragrama como nome próprio; a transliteração preserva isso sem substituir o nome por um título.
- issue: Alcance temporal de מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: desde a eternidade e para sempre
  alternative: de eternidade a eternidade
  rationale: A formulação escolhida expressa duração ilimitada sem definir filosoficamente a natureza da eternidade; a alternativa mais formal permanece possível.
translation_notes:
  register: Português moderno, claro e digno, com cadência litúrgica. A repetição final foi mantida, e o nome Yahweh foi preservado como nome próprio.
