lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para o regente
  rationale: Nos títulos dos Salmos, a forma participial com ל provavelmente indica a pessoa encarregada de dirigir a execução musical. “Regente” é uma expressão atual, clara e suficientemente abrangente, sem recorrer a formulações arcaicas.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e preciso para esse gênero de composição poético-musical, especialmente nos títulos do Saltério.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição ל nos títulos dos Salmos pode indicar autoria, associação, pertencimento ou dedicatória. “De Davi” conserva melhor essa amplitude do que opções mais específicas.
theological_decisions:
- issue: Sentido da atribuição davídica no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não determina inequivocamente se a expressão indica autoria, associação ou dedicatória. O texto principal mantém a formulação tradicional e semanticamente aberta, enquanto a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação breve preserva o caráter técnico do título hebraico e posiciona corretamente a nota após “Davi”, expressão à qual ela se refere.
