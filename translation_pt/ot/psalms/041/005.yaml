  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: pt
  text: 'Meus inimigos falam mal de mim: “Quando ele morrerá e seu nome desaparecerá?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dizem coisas prejudiciais contra mim”. A expressão hebraica fala literalmente de dizer “mal” contra o salmista.'
    reason: lexical_alternative
  - marker: b
    text: O desaparecimento do “nome” pode indicar o fim da reputação ou da lembrança da pessoa, não apenas a perda do nome falado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: Meus inimigos
  rationale: O substantivo plural com sufixo de primeira pessoa significa diretamente “meus inimigos”; a expressão é natural e preserva a força adversativa.
- source_word: יֹאמְרוּ
  choice: falam
  rationale: O imperfeito poético pode indicar ação presente ou habitual. “Falam” comunica com naturalidade a fala hostil recorrente.
- source_word: רַע לִי
  choice: mal de mim
  rationale: A construção expressa fala maliciosa dirigida contra o salmista. “Falam mal de mim” é idiomático em português, sem eliminar o sentido de dano ou maldade.
- source_word: מָתַי יָמוּת
  choice: Quando ele morrerá
  rationale: מָתַי é “quando”, e o imperfeito de מות tem aqui sentido futuro. A tradução conserva a pergunta hostil sem transformá-la explicitamente em desejo.
- source_word: וְאָבַד שְׁמוֹ
  choice: e seu nome desaparecerá
  rationale: Mantém “nome” no texto principal e expressa o sentido coordenado futuro de אבד. “Desaparecerá” é português corrente e pode abranger o fim da reputação ou da lembrança.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva a imagem hebraica do “nome” e a ambiguidade entre reputação e memória.
