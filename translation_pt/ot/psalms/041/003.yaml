  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: pt
  text: Yahweh o sustentará em seu leito de enfermidade; em sua enfermidade, tu restauras todo o seu leito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua enfermidade, tu viras todo o seu leito”. O verbo hebraico significa literalmente “virar” ou “revirar”, mas aqui provavelmente se refere, de modo idiomático, ao cuidado com o enfermo ou à sua restauração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִסְעָדֶנּוּ
  choice: o sustentará
  rationale: O verbo סעד expressa apoio e sustento, especialmente em situação de fraqueza; a formulação é natural e mantém o objeto pronominal.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: no leito de enfermidade
  rationale: Expressa de modo digno e claro o sentido locativo de עַל e a combinação de cama ou leito com enfermidade.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: por completo a sua cama
  rationale: Mantém a força totalizante de כָּל e o paralelismo com o primeiro hemistíquio, embora em ordem natural no português.
- source_word: הָפַכְתָּ
  choice: tu restauras
  rationale: הפך significa literalmente virar ou revirar, mas neste contexto pode descrever, de modo idiomático, o cuidado restaurador prestado ao enfermo; a alternativa literal é preservada em nota.
- source_word: בְחָלְיוֹ
  choice: durante a doença
  rationale: Apresenta com clareza a circunstância temporal ou situacional indicada por בְּ, sem acrescentar uma interpretação causal.
theological_decisions:
- issue: Mudança de pessoa no tratamento de Deus
  choice: Manter a passagem da terceira pessoa, “Yahweh... sustentará”, para a segunda pessoa, “tu restauras”.
  alternative: 'Uniformizar tudo na terceira pessoa: “Yahweh o sustentará... restaurará”.'
  rationale: O hebraico muda explicitamente da referência a Yahweh na terceira pessoa para a invocação direta na segunda; preservar essa tensão respeita o caráter poético e orante do texto.
- issue: Sentido da ação sobre a cama do enfermo
  choice: Traduzir הָפַכְתָּ como “restauras”, mantendo o sentido literal em nota.
  alternative: “tu viras/reviras toda a sua cama durante a doença”.
  rationale: O contexto é benéfico e provavelmente alude ao cuidado ou à restauração do enfermo, mas o hebraico permanece semanticamente aberto; por isso, a tradução principal é idiomática e a nota conserva a leitura formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Leito de enfermidade” conserva o tom poético sem soar arcaico. A mudança da terceira para a segunda pessoa foi mantida deliberadamente.
