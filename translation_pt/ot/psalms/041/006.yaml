base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: pt
  text: E, se ele vem me ver[a], fala falsidades; seu coração acumula maldade para si. Quando sai[b], fala disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «vem para ver»; o objeto «me» está implícito no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «para fora» ou «ao exterior». A expressão indica que ele deixa o lugar antes de falar do que acumulou em seu coração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com o versículo anterior quanto o valor condicional.
- source_word: בָּא לִרְאוֹת
  choice: vem me ver
  rationale: O hebraico diz literalmente «vem para ver»; o objeto «me» é fornecido pelo contexto e torna a frase natural em português.
- source_word: שָׁוְא יְדַבֵּר
  choice: fala falsidades
  rationale: שָׁוְא pode indicar falsidade, engano ou vacuidade; no contexto da fala insincera do inimigo, «falsidades» exprime bem o sentido sem excluir sua amplitude.
- source_word: לִבּוֹ
  choice: seu coração
  rationale: Mantém a imagem hebraica do coração como centro dos pensamentos e das intenções.
- source_word: יִקְבָּץ אָוֶן לּוֹ
  choice: acumula maldade para si
  rationale: Preserva o ato de juntar ou acumular אָוֶן e mantém a referência pronominal ambígua entre benefício/interiorização, sem transferi-la explicitamente ao coração.
- source_word: יֵצֵא לַחוּץ
  choice: sai para fora
  rationale: Reproduz diretamente a ideia hebraica de sair ao espaço exterior, sem especificar indevidamente «rua» ou «público».
- source_word: יְדַבֵּר
  choice: espalha isso
  rationale: No segundo uso, o contexto sugere que ele comunica fora o conteúdo malicioso reunido interiormente; «espalha» expressa essa função em português natural, e «isso» torna explícito o objeto implícito.
