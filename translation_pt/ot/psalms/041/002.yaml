  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: pt
  text: Yahweh o guardará e lhe preservará a vida[a]; ele será considerado feliz na terra[b]. Que não o entregues ao desejo de seus inimigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o manterá vivo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele será abençoado na terra”. O verbo hebraico pode significar que alguém é considerado feliz ou, de modo mais geral, que é abençoado.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “ao desejo de seus inimigos”; também pode ser traduzido por “à vontade de seus inimigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יִשְׁמְרֵהוּ
  choice: o protegerá
  rationale: שׁמר significa guardar, proteger ou velar por alguém; esta opção é natural em português e distingue o verbo da preservação da vida na oração seguinte.
- source_word: וִיחַיֵּהוּ
  choice: e conservará sua vida
  rationale: O piel de חיה tem sentido causativo de manter vivo ou preservar a vida.
- source_word: יאשר
  choice: ele será considerado feliz
  rationale: A forma de אשר pode indicar que alguém é declarado ou considerado feliz; a tradução conserva essa nuance sem impor a ideia distinta de bênção divina direta.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar terra, país ou território; o contexto não exige uma especificação maior.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: e que não o entregues
  rationale: אַל com a forma jussiva expressa uma súplica negativa dirigida diretamente a Yahweh; a segunda pessoa preserva a mudança de pessoa do hebraico.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: ao desejo de seus inimigos
  rationale: נֶפֶשׁ, nesta construção, significa desejo ou vontade, e não necessariamente 'alma'.
theological_decisions:
- issue: Mudança de declaração na terceira pessoa para súplica na segunda pessoa
  choice: 'Manter a mudança: “Yahweh... ele...” e depois “que não o entregues”.'
  alternative: 'Uniformizar em terceira pessoa: “e não o entregará”.'
  rationale: תִּתְּנֵהוּ é segunda pessoa masculina singular e se dirige a Yahweh. A tradução preserva a tensão sintática do texto em vez de suavizá-la.
- issue: Sentido de יאשר
  choice: “será considerado feliz”
  alternative: “será abençoado”
  rationale: O verbo pode indicar declarar ou considerar alguém feliz. A opção escolhida conserva essa nuance, enquanto a alternativa pode sugerir mais diretamente um ato divino de abençoar.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por formas de boa legibilidade brasileira. Emprega-se “tu” apenas na forma verbal da súplica (“entregues”) para preservar a mudança para a segunda pessoa no hebraico; o sujeito permanece implícito. Todos os marcadores de nota aparecem no texto.
