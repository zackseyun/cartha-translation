  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: pt
  text: Algo perverso foi derramado sobre ele[a]; agora que está deitado, não se levantará mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma coisa desprezível se fixou nele”, ou: “Uma acusação maligna foi lançada contra ele”. A expressão hebraica é difícil e pode referir-se tanto a uma aflição grave quanto a uma acusação destrutiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: uma coisa perversa
  rationale: A expressão hebraica é compacta e difícil, podendo indicar tanto um mal destrutivo quanto uma acusação maligna. Esta formulação preserva a ambiguidade sem personificar Belial.
- source_word: יָצוּק
  choice: foi derramada
  rationale: Conserva a imagem concreta do verbo passivo hebraico, embora também possa ter o sentido metafórico de algo fixado ou imposto.
- source_word: בּוֹ
  choice: sobre ele
  rationale: Com o passivo, expressa naturalmente em português aquilo que foi lançado ou derramado sobre a pessoa.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: agora que está deitado
  rationale: Reproduz a ligação com o estado presente e mantém a imagem literal de estar deitado, sem decidir se se trata de enfermidade, prostração ou morte iminente.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: não se levantará mais
  rationale: Expressa com gravidade e naturalidade o idioma hebraico de não voltar a levantar-se ou recuperar-se.
theological_decisions:
- issue: Sentido da imagem na primeira oração
  choice: Preservar a ambiguidade entre uma aflição maligna e uma acusação destrutiva.
  alternative: Explicitar “uma doença terrível se apoderou dele” ou “uma acusação maligna foi lançada contra ele”.
  rationale: A construção hebraica admite mais de uma leitura, e o contexto não justifica escolher definitivamente entre enfermidade e acusação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara e tom poético sóbrio. A tradução mantém deliberadamente a imagem e a ambiguidade do hebraico.
