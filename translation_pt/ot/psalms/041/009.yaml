source:
  edition: WLC
  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: pt
  text: Até o meu amigo íntimo[a], em quem eu confiava, aquele que comia do meu pão[b], levantou contra mim o calcanhar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o homem da minha paz”, expressão que indica alguém que vivia em paz comigo, isto é, um amigo próximo ou aliado de confiança.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquele que partilhava o meu pão”. O hebraico diz literalmente “aquele que comia do meu pão”, evocando comunhão à mesa e confiança.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “engrandeceu contra mim o calcanhar”, expressão hebraica que retrata uma ação traiçoeira ou hostil. Este trecho é citado em João 13:18 em relação à traição de Judas contra Jesus.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Introduz com ênfase o caso mais doloroso e inesperado: não apenas adversários, mas até alguém próximo.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: meu amigo íntimo
  rationale: A expressão literal, “homem da minha paz”, designa alguém que vivia em paz com o salmista, um amigo próximo ou aliado de confiança. A formulação comunica naturalmente a proximidade sem eliminar o valor idiomático, registrado em nota.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: em quem eu confiava
  rationale: Preserva a construção com ב e expressa confiança pessoal depositada nesse amigo. O imperfeito é adequadamente apresentado como situação passada de fundo.
- source_word: אוֹכֵל לַחְמִי
  choice: aquele que comia do meu pão
  rationale: Mantém a imagem concreta do hebraico e o particípio como relação habitual, evocando comunhão à mesa, hospitalidade e confiança.
- source_word: הִגְדִּיל ... עָקֵב
  choice: levantou ... o calcanhar
  rationale: Evita a tradução ininteligível “engrandeceu o calcanhar” e conserva a imagem corporal do idioma hebraico, cujo sentido contextual é uma ação hostil ou traiçoeira.
- source_word: עָלַי
  choice: contra mim
  rationale: Transmite a força adversativa da preposição dentro da expressão hostil.
theological_decisions:
- issue: Ressonância messiânica ou tipológica da linguagem de traição em João 13:18
  choice: Traduzir segundo o sentido imediato do salmo e registrar a citação joanina em nota.
  alternative: Moldar o texto principal mais diretamente pela formulação tradicional da citação no Novo Testamento.
  rationale: O texto hebraico descreve primeiramente a traição sofrida pelo salmista. A nota permite reconhecer seu uso posterior a respeito de Judas e Jesus sem inserir essa interpretação explicitamente no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Até” dá naturalidade à ênfase inicial; “amigo íntimo” comunica a proximidade relacional. A imagem do pão e a do calcanhar foram preservadas, enquanto as notas esclarecem os dois idiomas hebraicos e a ressonância canônica.
