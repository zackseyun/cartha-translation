  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: pt
  text: 'Quanto a mim, eu disse: “Ó Yahweh, tem misericórdia de mim; cura a minha alma[a], pois pequei contra ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cura a minha vida” ou “cura-me”. A palavra hebraica traduzida como “alma” também pode significar “vida” ou a própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Quanto a mim
  rationale: O pronome independente está expresso e recebe leve ênfase discursiva; “Quanto a mim” preserva essa ênfase de modo natural em português.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: O perfeito qal na primeira pessoa do singular relata a oração feita pelo salmista e é traduzido naturalmente pelo pretérito perfeito.
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Preserva o nome divino do texto hebraico, com “Ó” marcando naturalmente o vocativo em português.
- source_word: חָנֵּנִי
  choice: tem misericórdia de mim
  rationale: O imperativo de חנן pede favor benevolente ou misericórdia; esta formulação é clara, natural e digna em uma oração, sem limitar o pedido à mera compaixão emocional.
- source_word: רְפָאָה
  choice: cura
  rationale: Mantém o sentido direto e concreto do imperativo de רפא, sem decidir se a cura pedida é física, interior ou abrange ambas.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נפש pode designar alma, vida, pessoa ou o próprio eu. A tradução formal preserva a expressão hebraica, enquanto a nota registra sua amplitude sem restringi-la a uma dimensão exclusivamente espiritual.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão do pedido; “pois” é conciso e apropriado ao registro de oração.
- source_word: חָטָאתִי
  choice: pequei
  rationale: O perfeito hebraico expressa uma confissão de pecado consumado. O pretérito perfeito é idiomático e mantém a relevância presente indicada pelo contexto.
- source_word: לָךְ
  choice: contra ti
  rationale: Com o verbo חטא, a preposição identifica a pessoa ofendida; “pecar contra” expressa claramente essa relação em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Ó Yahweh
  alternative: Ó SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título.
- issue: Alcance de “cura a minha alma”
  choice: cura a minha alma
  alternative: cura-me; cura a minha vida
  rationale: O hebraico נַפְשִׁי permite referência à vida, ao próprio indivíduo ou à dimensão interior. O texto principal conserva a expressão, e a nota mantém aberta sua amplitude antropológica e teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O vocativo e a estrutura paralela preservam o tom de oração e confissão do hebraico.
