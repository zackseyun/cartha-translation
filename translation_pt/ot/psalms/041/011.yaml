source:
  edition: WLC
  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: pt
  text: 'Nisto sei que tens prazer em mim[a]: o meu inimigo não dá gritos de triunfo sobre mim[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te agradas de mim” ou “me favoreces”. O verbo hebraico expressa ter prazer ou deleitar-se.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não triunfa sobre mim”. O verbo hebraico se refere mais literalmente a levantar um grito, provavelmente um grito de vitória neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Nisto
  rationale: A preposição בְּ com o demonstrativo זֹאת indica a evidência pela qual o salmista chega ao conhecimento; “Nisto” preserva esse sentido de maneira natural em português.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: Embora seja uma forma perfeita, no contexto expressa conhecimento presente baseado na evidência mencionada.
- source_word: חָפַצְתָּ בִּי
  choice: tens prazer em mim
  rationale: חפץ denota ter prazer ou deleitar-se em alguém ou algo. A formulação é clara, digna e não acrescenta uma noção mais específica de aprovação moral ou salvífica.
- source_word: כִּי ... כִּי
  choice: que ... [relação explicativa indicada pelos dois-pontos]
  rationale: O primeiro כִּי introduz o conteúdo conhecido. O segundo apresenta a evidência ou razão; em português, os dois-pontos exprimem essa relação com naturalidade e evitam a repetição pesada de “porque”.
- source_word: לֹא יָרִיעַ
  choice: não dá gritos de triunfo
  rationale: O hifil de רוע evoca levantar um grito, aqui provavelmente um grito de vitória. A tradução conserva a imagem sonora, em vez de reduzi-la simplesmente a “triunfar”.
- source_word: אֹיְבִי עָלָי
  choice: o meu inimigo ... sobre mim
  rationale: Mantém o inimigo no singular e traduz עַל segundo o contexto de exultação vitoriosa sobre alguém.
theological_decisions:
- issue: Se a ausência do triunfo do inimigo constitui prova de aprovação divina em sentido amplo
  choice: O salmista entende que o fracasso do inimigo em celebrar vitória sobre ele é evidência de que Deus tem prazer nele.
  alternative: Interpretar o versículo como declaração mais abrangente de justiça, mérito ou justificação do salmista diante de Deus.
  rationale: O hebraico relaciona o prazer de Deus com a impossibilidade de o inimigo exultar sobre o salmista, mas não explicita a base nem o alcance doutrinário desse prazer. A tradução mantém a afirmação sem ampliá-la.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão internacional. “Nisto sei” conserva a concisão poética; “dá gritos de triunfo” retém a imagem concreta do hebraico.
