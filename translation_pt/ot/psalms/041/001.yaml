source:
  edition: WLC
  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: pt
  text: Feliz aquele que age com sabedoria para com o necessitado[a][b]; no dia da adversidade[c], Yahweh o livrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que dedica atenção cuidadosa ao necessitado”. O verbo hebraico pode indicar consideração perspicaz que leva a uma ação sábia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pobre”, “fraco” ou “vulnerável”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “no dia do mal”. Aqui, “mal” significa calamidade ou aflição, não maldade moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz aquele
  rationale: A forma hebraica introduz uma declaração sapiencial de bem-aventurança. “Feliz aquele” é natural no português moderno e mantém o tom solene sem sugerir apenas uma emoção passageira.
- source_word: מַשְׂכִּיל אֶל
  choice: que age com sabedoria para com
  rationale: O hifil de שׂכל, seguido de אֶל, indica atenção perspicaz que se expressa em conduta sábia dirigida a alguém. A tradução preserva tanto a reflexão quanto sua dimensão prática.
- source_word: דָּל
  choice: o necessitado
  rationale: דָּל pode designar quem é pobre, fraco ou socialmente vulnerável. “Necessitado” comunica de modo abrangente essa condição sem restringi-la apenas à falta de dinheiro.
- source_word: בְּיוֹם רָעָה
  choice: no dia da adversidade
  rationale: Neste contexto, רָעָה se refere a calamidade ou aflição, não ao mal moral. “Adversidade” preserva a ideia de um período de perigo ou sofrimento.
- source_word: יְמַלְּטֵהוּ
  choice: o livrará
  rationale: O piel de מלט expressa livramento ou resgate diante do perigo. “O livrará” é direto, digno e mantém o objeto singular masculino do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando sua função como nome pessoal no texto hebraico.
theological_decisions:
- issue: Referência masculina genérica no sujeito e no sufixo da promessa
  choice: Manter o singular representativo em “aquele” e “o livrará”
  alternative: Usar uma formulação plural inclusiva, como “Felizes os que... ele os livrará”
  rationale: O hebraico apresenta uma figura representativa no singular e retoma essa pessoa com um sufixo masculino singular. A tradução conserva essa forma sem afirmar que o princípio se aplique exclusivamente a homens.
- issue: Natureza da promessa de livramento
  choice: Traduzir a afirmação diretamente, sem qualificá-la
  alternative: Explicitar que se trata apenas de um princípio geral ou, no outro extremo, de uma garantia absoluta e mecânica
  rationale: O verso formula a promessa com a força própria da poesia sapiencial. A tradução preserva essa tensão sem impor uma leitura de prosperidade nem enfraquecer a declaração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Para com” conserva a orientação expressa pela preposição hebraica e se ajusta ao tom sapiencial, embora seja ligeiramente mais formal que a fala cotidiana.
