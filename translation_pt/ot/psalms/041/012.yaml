  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: pt
  text: Mas, quanto a mim, tu me sustentaste em minha integridade[a] e me colocaste diante de ti[b] para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da minha integridade” ou “em minha conduta irrepreensível”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da tua face”, isto é, “na tua presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas, quanto a mim
  rationale: A conjunção seguida do pronome independente assinala uma mudança contrastiva em relação ao contexto anterior; esta formulação expressa o contraste com naturalidade.
- source_word: בְּתֻמִּי
  choice: na minha integridade
  rationale: תֻּם denota inteireza moral, integridade ou conduta irrepreensível. A tradução preserva a preposição ב e evita sugerir ausência absoluta de pecado.
- source_word: תָּמַכְתָּ בִּי
  choice: tu me susténs
  rationale: תמך com ב comunica apoio firme ou sustentação. “Susténs” é natural em português e conserva o sentido estabilizador e relacional.
- source_word: וַתַּצִּיבֵנִי
  choice: e me estabeleces
  rationale: O hifil de נצב significa colocar, firmar ou estabelecer. “Estabeleces” comunica mais naturalmente em português a ideia de fazer alguém permanecer em determinada posição.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: A expressão significa literalmente “diante da tua face” e idiomaticamente “na tua presença”. “Diante de ti” preserva a imagem espacial sem soar artificial.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: עוֹלָם indica duração contínua ou indefinida; “para sempre” é o equivalente corrente e adequado ao registro poético.
theological_decisions:
- issue: Sentido da alegação de תֻּם pelo salmista
  choice: A integridade do salmista é afirmada sem implicar impecabilidade absoluta nem mérito que obrigue o favor divino.
  alternative: Entender o termo como inocência absoluta ou perfeição moral meritória.
  rationale: O termo hebraico admite integridade, inteireza ou irrepreensibilidade de conduta. A tradução mantém a afirmação moral e a tensão teológica do texto sem impor uma doutrina de perfeição sem pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo hebraicos foram preservados quando naturais; a expressão concreta “tua face” foi mantida em nota para evitar artificialidade no texto principal.
