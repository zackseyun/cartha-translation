  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: pt
  text: Juntos, todos os que me odeiam cochicham contra mim[a]; contra mim, planejam o mal para mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, nas duas ocorrências, “a meu respeito”. A preposição hebraica pode indicar tanto direção hostil quanto o assunto da conversa ou do pensamento; o contexto favorece “contra mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “planejam o mal contra mim” ou “planejam me fazer mal”. Literalmente, “planejam o mal para mim”. O hebraico combina um verbo de pensar ou planejar com “mal”, expressando intenção hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Juntos
  rationale: Expressa de modo conciso a ação coletiva e coordenada dos adversários.
- source_word: עָלַי
  choice: contra mim
  rationale: No contexto de ódio, cochichos e planos malignos, a preposição tem naturalmente sentido hostil, embora também possa indicar o assunto da fala ou do pensamento.
- source_word: יִתְלַחֲשׁוּ
  choice: cochicham
  rationale: Preserva a imagem de falar em voz baixa entre si, sugerida pela forma verbal, sem explicitar demais a ideia de conspiração.
- source_word: כָּל שֹׂנְאַי
  choice: todos os que me odeiam
  rationale: Mantém a força verbal do particípio e soa natural no português moderno.
- source_word: יַחְשְׁבוּ
  choice: tramam
  rationale: Neste contexto hostil, o verbo de pensar ou planejar indica elaboração intencional; “tramam” comunica isso com naturalidade.
- source_word: רָעָה
  choice: o mal
  rationale: Conserva a amplitude moral e prática do termo, que pode designar tanto maldade quanto dano ou desgraça.
- source_word: לִי
  choice: contra mim
  rationale: Embora literalmente possa ser “para mim”, em português a expressão “tramam o mal contra mim” comunica com clareza o alvo da intenção hostil e evita uma formulação pouco natural.
