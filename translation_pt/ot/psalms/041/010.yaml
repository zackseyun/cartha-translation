  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: pt
  text: Mas tu, ó Yahweh, concede-me teu favor e levanta-me, para que eu lhes retribua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu lhes retribuirei”. O cohortativo hebraico pode indicar propósito ou resultado (“para que eu lhes retribua”) ou uma resolução que segue os pedidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente estabelece contraste com os inimigos e o amigo mencionados antes; “Mas tu” expressa isso naturalmente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: חָנֵּנִי
  choice: tem compaixão de mim
  rationale: O verbo חנן pede favor gracioso. Esta formulação é clara e idiomática em português e não limita a súplica ao perdão.
- source_word: וַהֲקִימֵנִי
  choice: e levanta-me
  rationale: O hifil de קום significa fazer levantar-se ou pôr de pé. A tradução conserva a imagem concreta, que no contexto pode abranger recuperação e restauração.
- source_word: וַאֲשַׁלְּמָה
  choice: para que eu lhes retribua
  rationale: O piel de שלם aqui indica retribuir ou dar a paga. Depois dos pedidos, o cohortativo pode exprimir propósito ou resultado; a formulação preserva essa leitura.
- source_word: לָהֶם
  choice: lhes
  rationale: A preposição ל marca o objeto indireto; “lhes retribua” é uma construção natural e concisa em português.
theological_decisions:
- issue: Se a retribuição pretendida pelo salmista deve ser suavizada para evitar o sentido imprecatório
  choice: manter “lhes retribua”
  alternative: “faça justiça contra eles” ou “trate-os como merecem”
  rationale: שלם denota diretamente retribuição. Suavizar a expressão importaria uma interpretação e apagaria a tensão judicial ou imprecatória do texto, que não especifica como ocorrerá a retribuição.
- issue: Valor do cohortativo וַאֲשַׁלְּמָה
  choice: 'propósito ou resultado: “para que eu lhes retribua”'
  alternative: 'resolução subsequente: “e eu lhes retribuirei”'
  rationale: A forma hebraica admite ambas as relações. A leitura de propósito ou resultado se integra bem às petições anteriores, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Ó” conserva o vocativo solene sem arcaísmo excessivo; os pronomes átonos mantêm fluidez e concisão.
