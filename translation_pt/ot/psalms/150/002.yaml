source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ בִ/גְבוּרֹתָ֑י/ו הַֽ֝לְל֗וּ/הוּ כְּ/רֹ֣ב גֻּדְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: pt
  text: Louvem-no por seus feitos poderosos[a]; louvem-no segundo a imensidão de sua grandeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seus feitos poderosos” ou “com seus feitos poderosos”; a preposição hebraica também admite essas traduções mais formais, embora aqui provavelmente indique o motivo do louvor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de acordo com sua imensa grandeza” ou “na proporção de sua grandeza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל com sufixo de objeto masculino singular dirige uma exortação direta à comunidade; “Louvem-no” é natural, atual e preserva o número plural.
- source_word: בִגְבוּרֹתָיו
  choice: por seus feitos poderosos
  rationale: גְּבוּרוֹת designa feitos que manifestam força ou poder. Neste contexto, ב provavelmente indica o fundamento do louvor; “por” exprime isso com naturalidade, enquanto a nota preserva a possibilidade mais formal de “em/com”.
- source_word: כְּרֹב
  choice: segundo a imensidão de
  rationale: כְּ com רֹב apresenta medida ou proporção. “Segundo a imensidão de” conserva essa força e soa digna em português, sem reduzir o segundo membro a mero motivo causal.
- source_word: גֻּדְלוֹ
  choice: sua grandeza
  rationale: O substantivo derivado de גדל indica grandeza ou magnitude. “Grandeza” é a equivalência mais direta e evita especificar interpretativamente “majestade”.
theological_decisions:
- issue: Fundamento e medida do louvor
  choice: O primeiro membro chama ao louvor por causa dos feitos poderosos de Deus; o segundo relaciona o louvor à imensidão de sua grandeza.
  alternative: O segundo membro também pode ser entendido mais livremente como outro motivo para louvar, sem ênfase explícita em proporção.
  rationale: 'As preposições ב e כ sugerem nuances distintas: fundamento no primeiro membro e correspondência ou medida no segundo. A tradução mantém essa tensão poética.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. O paralelismo foi preservado pela repetição de “louvem-no”; “feitos poderosos” mantém o caráter concreto do plural hebraico.
