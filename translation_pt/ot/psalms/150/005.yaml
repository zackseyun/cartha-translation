  text: הַֽלְל֥וּ/הוּ בְ/צִלְצְלֵי שָׁ֑מַע הַֽ֝לְל֗וּ/הוּ בְּֽ/צִלְצְלֵ֥י תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/005.yaml
  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
translation:
  language: pt
  text: 'Louvem-no com címbalos sonoros;

    louvem-no com címbalos retumbantes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “címbalos de teruá”. A palavra teruá pode indicar um grito, um toque forte ou uma aclamação jubilosa; aqui, aplicada aos címbalos, provavelmente descreve seu som intenso e estrondoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל com sufixo de terceira pessoa masculina singular dirige à comunidade um chamado direto para louvar a Deus. “Louvem-no” é atual, claro e preserva a repetição enfática.
- source_word: בְצִלְצְלֵי
  choice: com címbalos
  rationale: A preposição ב tem valor instrumental neste contexto, indicando o meio pelo qual se louva. “Com címbalos” é a formulação natural em português.
- source_word: שָׁמַע
  choice: sonoros
  rationale: O termo está ligado à ideia de som ou de algo que se faz ouvir. Em combinação com “címbalos”, “sonoros” expressa de modo conciso instrumentos de som claro e perceptível, sem impor necessariamente a ideia de volume extremo.
- source_word: תְרוּעָה
  choice: retumbantes
  rationale: תְּרוּעָה pode designar clamor, grito jubiloso ou toque forte. Aplicado aos címbalos, caracteriza o impacto sonoro intenso; “retumbantes” comunica esse efeito instrumental e conserva a atmosfera celebrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “Louvem-no” e o paralelismo poético foram preservados; “sonoros” e “retumbantes” distinguem os dois qualificadores hebraicos sem tornar a linha artificialmente literal.
