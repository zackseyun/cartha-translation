  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: pt
  text: Tudo o que respira louve Yah. Louvem Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Aleluia!» A expressão hebraica הַלְלוּ־יָהּ deu origem à forma litúrgica «Aleluia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: Tudo o que respira
  rationale: Expressa de modo natural e abrangente a construção hebraica compacta, cujo sentido é tudo aquilo que possui fôlego, sem reduzi-la apenas à ideia abstrata de «respiração» nem introduzir «alma».
- source_word: תְּהַלֵּל
  choice: louve
  rationale: 'O imperfeito tem força volitiva neste chamado conclusivo; o presente do subjuntivo português comunica naturalmente a exortação: «louve».'
- source_word: יָהּ
  choice: Yah
  rationale: Preserva a forma poética abreviada do nome divino que aparece no hebraico, distinguindo-a da forma plena יהוה.
- source_word: הַלְלוּ יָהּ
  choice: Louvem Yah!
  rationale: Traduz diretamente o imperativo hebraico no plural e seu objeto, em vez de apenas transliterar a expressão litúrgica.
theological_decisions:
- issue: Forma poética abreviada do nome divino יָהּ
  choice: Yah
  alternative: o SENHOR
  rationale: A tradução mantém a forma efetivamente presente no texto hebraico e evita apagar a distinção lexical entre יָהּ e o nome divino em sua forma plena.
- issue: Tradução ou transliteração de הַלְלוּ־יָהּ
  choice: Louvem Yah!
  alternative: Aleluia!
  rationale: Traduzir torna inteligível o chamado congregacional; a forma litúrgica tradicional é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. «Tudo o que respira» preserva o alcance universal e a imagem do fôlego; «Louvem» mantém o imperativo plural dirigido à comunidade.
