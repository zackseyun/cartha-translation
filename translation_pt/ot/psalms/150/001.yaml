  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: pt
  text: Aleluia![a] Louvem a Deus no seu santuário;[b] louvem-no na expansão do seu poder.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aleluia” significa “Louvem Yah”; Yah é a forma abreviada do nome divino. Algumas traduções vertem o nome divino por “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “na sua santidade” ou “no seu lugar santo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “no firmamento do seu poder” ou “na sua poderosa expansão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Aleluia!
  rationale: A expressão litúrgica portuguesa translitera o hebraico halĕlû-yāh, uma convocação plural para louvar Yah. É natural, reconhecível e preserva a forma tradicional do clamor.
- source_word: הַלְלוּ אֵל
  choice: Louvem a Deus
  rationale: O imperativo plural mantém a convocação dirigida à comunidade; אֵל é vertido simplesmente como “Deus”, sem acrescentar qualificações ausentes do texto.
- source_word: בְּקָדְשׁוֹ
  choice: no seu santuário
  rationale: קֹדֶשׁ pode indicar santidade ou lugar santo. O paralelismo locativo favorece “santuário”, embora a ambiguidade seja preservada em nota.
- source_word: הַלְלוּהוּ
  choice: louvem-no
  rationale: O sufixo masculino singular é expresso pelo pronome objeto, e a repetição do imperativo conserva a força exhortativa do hebraico.
- source_word: בִּרְקִיעַ
  choice: na expansão
  rationale: רָקִיעַ designa algo estendido, a expansão celeste. “Expansão” conserva a imagem hebraica sem o caráter arcaico de “firmamento”.
- source_word: עֻזּוֹ
  choice: do seu poder
  rationale: עֹז denota força, poder ou vigor. “Poder” produz uma expressão portuguesa natural e mantém a referência à potência divina.
theological_decisions:
- issue: Representação do nome divino abreviado יָהּ
  choice: Aleluia, com nota explicativa sobre Yah
  alternative: Louvem a Yah / Louvem o SENHOR
  rationale: A forma portuguesa consagrada “Aleluia” preserva dentro da transliteração o nome abreviado Yah e a função litúrgica da expressão. A nota torna explícito seu sentido sem equipará-la silenciosamente à forma plena יהוה.
- issue: Sentido de בְּקָדְשׁוֹ
  choice: no seu santuário
  alternative: na sua santidade / no seu lugar santo
  rationale: O paralelismo com uma expressão espacial favorece o sentido locativo, mas o substantivo hebraico permite também a noção abstrata de santidade; essa tensão lexical é registrada em nota.
- issue: Referência de בִּרְקִיעַ עֻזּוֹ
  choice: na expansão do seu poder
  alternative: no firmamento do seu poder / na sua poderosa expansão
  rationale: A construção hebraica pode ser entendida como uma expansão que manifesta ou pertence ao poder de Deus. A tradução conserva o genitivo sem definir de modo excessivo a relação.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Aleluia” mantém a expressão litúrgica amplamente reconhecida; “expansão” retém a imagem cosmológica do hebraico sem recorrer a vocabulário excessivamente arcaico.
