base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: pt
  text: Louvem-no ao som do shofar[a]; louvem-no com harpa e lira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao som da trombeta”. O shofar era um chifre, geralmente de carneiro, usado no culto e para emitir sinais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל com sufixo de terceira pessoa masculina singular dirige à comunidade um chamado direto. “Louvem-no” é conciso, natural e preserva a repetição poética.
- source_word: בְּ/תֵקַע שׁוֹפָר
  choice: ao toque do shofar
  rationale: תֵּקַע designa o toque ou sonido produzido, enquanto שׁוֹפָר nomeia o instrumento. “Ao toque do shofar” expressa tanto o evento sonoro quanto o instrumento e soa natural em português.
- source_word: בְּ/נֵבֶל
  choice: com harpa
  rationale: נֵבֶל designa um instrumento de cordas antigo. “Harpa” é uma equivalência tradicional, clara e acessível, embora a identificação organológica exata seja incerta.
- source_word: וְ/כִנּוֹר
  choice: e lira
  rationale: כִּנּוֹר é outro instrumento de cordas. “Lira” o distingue de נֵבֶל e preserva no português a menção a dois instrumentos diferentes.
