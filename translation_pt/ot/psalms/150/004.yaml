base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: pt
  text: Louvem-no com tamborim e dança; louvem-no com instrumentos de cordas e instrumento de sopro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa um instrumento de sopro, provavelmente uma flauta ou um instrumento de cana; tradicionalmente, “órgão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל, com sufixo de terceira pessoa masculina singular, dirige à comunidade o chamado para louvar a Deus; a forma portuguesa preserva tanto o plural quanto o objeto pronominal.
- source_word: בְתֹף
  choice: ao som do tamborim
  rationale: תֹף designa um instrumento de percussão manual, provavelmente um tambor de moldura ou tamborim. A expressão é natural em português e evita sugerir que o instrumento seja apenas um acompanhamento incidental.
- source_word: וּמָחוֹל
  choice: e com danças
  rationale: מָחוֹל refere-se a dança ou ao ato de dançar. O plural idiomático 'danças' comunica de modo claro que a dança é uma forma de louvor.
- source_word: בְּמִנִּים
  choice: com instrumentos de cordas
  rationale: מִנִּים indica de modo amplo instrumentos de cordas. A formulação explícita é clara para leitores modernos e evita a possível ambiguidade de 'cordas' isoladamente.
- source_word: וְעוּגָב
  choice: e flauta
  rationale: עוּגָב designa algum tipo de instrumento de sopro, provavelmente um tubo ou instrumento de palheta. 'Flauta' é uma equivalência acessível, enquanto a nota preserva a incerteza quanto ao instrumento exato.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo do verso foi preservado, bem como a repetição de “Louvem-no”. A tradução evita o arcaísmo “adufe” e não identifica o antigo instrumento de sopro com o órgão moderno.
