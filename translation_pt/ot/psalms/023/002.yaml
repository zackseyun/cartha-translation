  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: pt
  text: Em pastagens verdejantes, ele faz-me repousar; junto a águas tranquilas, ele me conduz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “águas serenas”. Literalmente, “águas de descanso” ou “águas de repouso”; a expressão hebraica enfatiza águas associadas ao descanso ou repouso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: Em pastagens verdejantes
  rationale: נְאוֹת designa lugares de pastagem ou repouso para rebanhos, e דֶּשֶׁא indica erva ou vegetação fresca. A expressão mantém a imagem pastoril em português natural.
- source_word: יַרְבִּיצֵנִי
  choice: ele me faz repousar
  rationale: 'O hifil de רבץ é causativo: fazer alguém deitar-se ou repousar. Esta formulação conserva a ação do pastor sem sugerir coerção indevida.'
- source_word: עַל מֵי מְנֻחוֹת
  choice: junto a águas de descanso
  rationale: עַל expressa aqui proximidade, e מְנֻחוֹת está ligado a descanso e repouso. A tradução preserva essa associação sem reduzir a expressão apenas à ausência de movimento na água.
- source_word: יְנַהֲלֵנִי
  choice: ele me conduz
  rationale: O piel de נהל comunica condução ou orientação cuidadosa. “Conduz” é digno, corrente e adequado à imagem do pastor.
theological_decisions:
- issue: Sentido de מְנֻחוֹת na descrição das águas
  choice: águas de descanso
  alternative: águas tranquilas; águas serenas
  rationale: O substantivo hebraico enfatiza descanso ou repouso, não necessariamente águas imóveis. A tradução principal conserva essa relação lexical, enquanto a nota registra alternativas idiomáticas plausíveis.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. “Pastagens verdejantes” preserva a imagem concreta; “águas de descanso” mantém a particularidade semântica do hebraico, esclarecida por nota.
