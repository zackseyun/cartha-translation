  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: pt
  text: Certamente, a bondade e o amor leal me perseguirão[a] todos os dias da minha vida, e voltarei à casa de Yahweh[b] por longos dias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me seguirão”. O verbo hebraico significa mais vividamente “perseguir” e retrata a bondade e o amor leal de Deus indo ativamente ao encalço do salmista.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “habitarei na casa de Yahweh”. A leitura “habitarei” é antiga e tradicional; contudo, o texto massorético vocalizado é normalmente entendido como “voltarei”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “para sempre”. Em hebraico, literalmente, “por extensão de dias”, expressão que indica duração prolongada.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: Neste contexto, a partícula expressa uma afirmação confiante, não uma restrição; “certamente” comunica de modo natural a segurança que encerra o salmo.
- source_word: טוֹב
  choice: a bondade
  rationale: Em paralelo com חֶסֶד, o termo designa o bem que Deus concede e sua ação benéfica, não apenas algo genericamente “bom”.
- source_word: חֶסֶד
  choice: o amor leal
  rationale: A expressão comunica amor duradouro, fidelidade e compromisso, sem limitar o termo a “misericórdia” nem inserir explicitamente “aliança” no texto.
- source_word: יִרְדְּפוּנִי
  choice: me perseguirão
  rationale: 'Preserva a imagem forte do verbo hebraico: em vez de inimigos perseguirem o salmista, a bondade e o amor leal de Deus vão ativamente ao seu encalço.'
- source_word: כָּל יְמֵי חַיָּי
  choice: todos os dias da minha vida
  rationale: Reproduz de forma clara e natural a totalidade temporal e o caráter pessoal da expressão hebraica.
- source_word: וְשַׁבְתִּי
  choice: e habitarei
  rationale: A vocalização massorética remete naturalmente a ישׁב, “habitar”; a leitura tradicional alternativa, “voltarei”, é registrada em nota.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a imagem concreta da casa ou santuário e translitera o nome divino יְהוָה como “Yahweh”.
- source_word: לְאֹרֶךְ יָמִים
  choice: por longos dias
  rationale: Expressa em português corrente o sentido literal de duração prolongada, sem determinar no texto principal que a frase signifique necessariamente “para sempre”.
theological_decisions:
- issue: Duração indicada por לְאֹרֶךְ יָמִים
  choice: por longos dias
  alternative: para sempre
  rationale: A expressão pode comunicar comunhão duradoura ou vitalícia e muitas vezes é entendida como “para sempre”. O texto principal preserva sua abertura poética, enquanto a nota apresenta a interpretação mais forte.
- issue: Sentido de וְשַׁבְתִּי
  choice: habitarei
  alternative: voltarei
  rationale: A vocalização massorética favorece “habitarei”, mas “voltarei” é uma leitura antiga e relevante que altera a imagem do verso; por isso, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo poético, a imagem vigorosa de “perseguir”, o nome divino “Yahweh” e a abertura semântica da expressão final, sem recorrer a linguagem arcaica.
