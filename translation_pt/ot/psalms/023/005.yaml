base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: pt
  text: Preparas uma mesa diante de mim, na presença dos meus inimigos; unges a minha cabeça com óleo[a]; o meu cálice transborda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «tornas farta (ou rica) a minha cabeça com óleo». O verbo retrata tratamento abundante e honroso; «unges a minha cabeça com óleo» expressa o sentido provável no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: Preparas
  rationale: O verbo ערך significa pôr em ordem, dispor ou preparar. Com «mesa», «preparas» é natural em português e preserva a imagem de uma refeição providenciada.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Equivale literalmente a «perante mim» ou «na minha presença»; «diante de mim» é claro, poético e corrente.
- source_word: שֻׁלְחָן
  choice: uma mesa
  rationale: Designa uma mesa, aqui no contexto de refeição e hospitalidade.
- source_word: נֶגֶד צֹרְרָי
  choice: na presença dos meus inimigos
  rationale: נֶגֶד indica proximidade visível, diante de ou em frente a, e צֹרְרָי são os que se mostram hostis. A expressão comunica que os inimigos presenciam a honra concedida ao salmista.
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: derramas óleo generosamente sobre a minha cabeça
  rationale: דשׁן traz a ideia de tornar rico, farto ou viçoso. A formulação conserva a ação concreta ligada ao óleo e à cabeça, tornando explícita a generosidade implícita no verbo sem impor um sentido ritual ou régio.
- source_word: כּוֹסִי רְוָיָה
  choice: o meu cálice transborda
  rationale: רְוָיָה expressa saturação ou abundância. «Transborda» reproduz naturalmente a imagem de plenitude abundante; «cálice» mantém o registro poético e a continuidade da cena de hospitalidade.
theological_decisions:
- issue: Imagem de hospitalidade em דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: derramas óleo generosamente sobre a minha cabeça
  alternative: unges a minha cabeça com óleo
  rationale: O contexto apresenta Deus como anfitrião que honra e trata o salmista com abundância. Embora «unges» seja tradicional e possível, pode sugerir especificamente consagração régia, sacerdotal ou sacramental; o hebraico usa דשׁן, e não o verbo habitual para ungir. A tradução escolhida preserva a ação e a riqueza da hospitalidade.
- issue: Aspecto e tempo verbal
  choice: 'presente: «Preparas... derramas... transborda»'
  alternative: 'perfeito/passado: «Preparaste... enriqueceste...»'
  rationale: Na poesia, as formas hebraicas podem apresentar vividamente o cuidado de Deus sem fixar uma única relação temporal. O presente comunica cuidado atual e contínuo, em harmonia com o contexto do salmo, sem converter isso numa afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Preparas» e «na presença» são naturais; «cálice» conserva o tom poético. A tradução evita que «unges» resolva prematuramente a imagem como unção ritual e inclui a alternativa em nota. O marcador [a] aparece no texto principal.
