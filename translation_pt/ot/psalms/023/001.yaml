id: PSA.23.1
reference: Psalms 23:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: pt
  text: 'Salmo de Davi[a].


    Yahweh[b] é o meu pastor; nada me faltará[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por Davi» ou «para Davi»; o hebraico לְדָוִד pode indicar autoria, dedicação, pertencimento ou associação.
    reason: alternative_reading
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido por «SENHOR» em muitas versões.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por «nada me falta»; o verbo hebraico pode expressar confiança futura ou uma realidade presente e habitual.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo convencional e claro para o gênero indicado no sobrescrito.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, pertencimento, dedicação ou associação; «de Davi» mantém essa amplitude melhor do que opções mais específicas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: רֹעִי
  choice: o meu pastor
  rationale: Preserva de modo natural a metáfora pessoal daquele que cuida e guia o rebanho.
- source_word: לֹא אֶחְסָר
  choice: nada me faltará
  rationale: Expressa em português corrente o sentido de não sofrer falta ou necessidade, mantendo a orientação futura possível do imperfeito hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido do sobrescrito לְדָוִד
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica permite mais de uma relação com Davi; a escolha evita limitar indevidamente o sentido à autoria ou à dedicação.
- issue: Força temporal de אֶחְסָר
  choice: nada me faltará
  alternative: nada me falta
  rationale: O imperfeito pode projetar confiança para o futuro, embora, no contexto poético, também possa descrever uma realidade habitual ou presente.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A formulação «nada me faltará» conserva a cadência tradicional sem vocabulário arcaico; as notas preservam as ambiguidades reais do sobrescrito e do aspecto verbal.
