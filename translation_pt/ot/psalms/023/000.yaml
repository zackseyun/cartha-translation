    text: Ou “não terei falta de nada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente português tradicional e preciso para uma composição poética cantada ou acompanhada por instrumentos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: רֹעִי
  choice: meu pastor
  rationale: Preserva diretamente a metáfora pastoral e o sufixo de primeira pessoa.
- source_word: לֹא אֶחְסָר
  choice: nada me faltará
  rationale: Expressa em português natural a negação do verbo חָסֵר, que denota ter falta ou carecer de algo.
theological_decisions:
- issue: Relação indicada por לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi; referente a Davi
  rationale: A formulação tradicional é natural em português, enquanto a nota preserva a amplitude semântica da preposição hebraica e não impõe exclusivamente autoria.
- issue: Valor temporal ou modal de אֶחְסָר
  choice: nada me faltará
  alternative: não tenho falta de nada; não terei falta de nada
  rationale: O imperfeito hebraico admite leitura prospectiva ou habitual. A tradução escolhida é idiomática e mantém a declaração de confiança sem limitar indevidamente seu alcance.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A conhecida imagem do pastor foi mantida literalmente; o nome divino foi transliterado, e a ambiguidade do título hebraico foi preservada em nota.
