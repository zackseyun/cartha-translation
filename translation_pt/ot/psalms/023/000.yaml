  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: pt
  text: 'Salmo de Davi[a].


    Yahweh[b] é o meu pastor; nada me faltará[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; a expressão hebraica לְדָוִד pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
  - marker: b
    text: Hebraico YHWH, o nome divino, tradicionalmente traduzido como “SENHOR” em muitas versões.
