source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: pt
  text: Ele restaura a minha alma[a]; guia-me por caminhos de justiça[b], por amor do seu nome[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “reanima a minha vida”, “renova-me” ou “faz-me voltar”. O hebraico diz literalmente “a minha alma”, mas o termo pode indicar a vida ou a pessoa inteira, não apenas uma parte imaterial do ser humano.
    reason: lexical_alternative
  - marker: b
    text: Ou “caminhos certos” ou “caminhos de retidão”.
    reason: lexical_alternative
  - marker: c
    text: “Por amor do seu nome” significa em consideração à honra do seu caráter e da sua reputação.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode designar a vida, a pessoa inteira ou o ser interior. “A minha alma” preserva a forma poética e tradicional, enquanto a nota impede que o termo seja entendido apenas como uma parte imaterial da pessoa.
- source_word: יְשׁוֹבֵב
  choice: restaura
  rationale: A forma verbal derivada de שׁוב pode comunicar fazer voltar, restaurar ou reanimar. “Restaura” conserva essa amplitude e combina naturalmente com a imagem do cuidado do pastor.
- source_word: יַנְחֵנִי
  choice: guia-me
  rationale: O hifil de נחה significa conduzir ou guiar. “Guia-me” é natural em português e mantém a ação concreta do pastor.
- source_word: בְמַעְגְּלֵי
  choice: por caminhos de
  rationale: מַעְגָּל denota trilha, caminho ou percurso. A preposição “por” expressa de modo idiomático o percurso ao longo do qual o salmista é guiado.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange justiça, retidão e aquilo que é correto. “Justiça” é corrente em português e preserva a dimensão moral da expressão, sem excluir o sentido de caminhos certos.
- source_word: לְמַעַן
  choice: por amor de
  rationale: לְמַעַן indica propósito ou motivo. A expressão portuguesa “por amor de” comunica que Deus age em consideração ao seu próprio nome.
- source_word: שְׁמוֹ
  choice: seu nome
  rationale: שֵׁם significa literalmente “nome” e também pode envolver caráter, honra e reputação. A tradução literal preserva sua ressonância bíblica, esclarecida em nota.
theological_decisions:
- issue: Sentido de “restaura a minha alma”
  choice: Restauração ou renovação integral da vida do salmista sob o cuidado do pastor, mantendo a expressão poética “a minha alma”.
  alternative: “Reanima a minha vida”, “renova-me” ou “faz-me voltar”.
  rationale: נֶפֶשׁ não se limita necessariamente a uma alma imaterial, e יְשׁוֹבֵב pode sugerir tanto restauração e reanimação como retorno. A formulação principal conserva a linguagem poética sem eliminar essa amplitude semântica.
- issue: Sentido de “caminhos de justiça”
  choice: Caminhos caracterizados pela justiça ou retidão, isto é, modos corretos de viver sob a direção de Deus.
  alternative: “Caminhos certos” ou “caminhos de retidão”.
  rationale: צֶדֶק permite tanto a ideia do que é correto quanto a dimensão ética da justiça. “Caminhos de justiça” mantém essa tensão em vez de reduzir a imagem apenas a trajetos seguros.
- issue: Sentido de “por amor do seu nome”
  choice: Deus guia de modo coerente com a honra, o caráter e a reputação associados ao seu nome.
  alternative: “Por causa do seu nome” ou “para a honra do seu nome”.
  rationale: A expressão hebraica apresenta o nome de Deus como motivo ou finalidade de sua ação, sem precisar limitar o sentido a uma única paráfrase.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A sintaxe concisa preserva o paralelismo poético. “Alma”, “justiça” e “nome” mantêm a densidade tradicional do salmo, enquanto as notas esclarecem a amplitude do hebraico sem impor uma leitura denominacional.
