  terminology: A terminologia está consistente com a imagem pastoral e com o registro do salmo. “Vara” e “cajado” distinguem adequadamente os dois termos hebraicos sem introduzir imagem régia. A nota lexical é fiel, equilibrada e conserva a alternativa tradicional “sombra da morte” sem tratá-la como o único sentido possível.
