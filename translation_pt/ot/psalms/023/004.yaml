id: PSA.23.4
reference: Psalms 23:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: pt
  text: Mesmo que eu ande pelo vale de densas trevas[a], não temerei mal algum, pois tu estás comigo; a tua vara e o teu cajado — eles me consolam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo vale da sombra da morte”. O termo hebraico pode indicar trevas profundas, possivelmente com conotações de morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Mesmo que
  rationale: Introduz naturalmente a oração concessiva em português, preservando a ideia de que nem mesmo essa circunstância muda a confiança do salmista.
- source_word: אֵלֵךְ
  choice: eu ande
  rationale: O subjuntivo é exigido pela construção concessiva portuguesa e expressa adequadamente o movimento vívido e não limitado a uma única ocasião.
- source_word: בְּגֵיא
  choice: pelo vale
  rationale: Com verbo de movimento, “pelo vale” é natural em português e preserva a imagem geográfica sem especificá-la indevidamente como desfiladeiro ou ravina.
- source_word: צַלְמָוֶת
  choice: densas trevas
  rationale: Comunica escuridão profunda e ameaçadora sem restringir o termo à morte; a tradução tradicional e suas possíveis conotações mortais são preservadas em nota.
- source_word: לֹא אִירָא רָע
  choice: não temerei mal algum
  rationale: Mantém a amplitude de רָע, que pode abranger mal, dano, perigo ou calamidade, e soa digna e natural em português.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: pois tu estás comigo
  rationale: Apresenta claramente a razão da ausência de medo e conserva a mudança íntima para a segunda pessoa.
- source_word: שִׁבְטְךָ
  choice: a tua vara
  rationale: “Vara” é apropriado ao instrumento de proteção e disciplina do pastor, sem deslocar a imagem para o cetro régio.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: o teu cajado
  rationale: “Cajado” é o termo português mais claro para o bastão de apoio do pastor e forma um par natural com “vara”.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente hebraico é enfático; sua explicitação depois do travessão preserva essa ênfase em português.
- source_word: יְנַחֲמֻנִי
  choice: me consolam
  rationale: Expressa diretamente o alívio, encorajamento e segurança proporcionados pela presença e pelos instrumentos do pastor.
theological_decisions:
- issue: Sentido de צַלְמָוֶת na conhecida expressão tradicional
  choice: densas trevas
  alternative: sombra da morte
  rationale: O texto principal representa o sentido lexical provável de escuridão profunda, sem fazer da morte o único referente. A alternativa tradicional permanece em nota porque reflete antigas interpretações do termo e preserva sua possível ressonância mortal.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. Mantém “tu” por ser natural no registro bíblico e por preservar o contraste enfático com a fala sobre Deus nos versículos anteriores. O travessão destaca o pronome enfático hebraico sem tornar a frase artificial.
