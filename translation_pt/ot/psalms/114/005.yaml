  text: What is with you[a], O sea, that you flee—O Jordan, that you turn back?
translation:
  language: pt
  text: Que há com você[a], ó mar, que foge? E com você, ó Jordão, que volta para trás?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que aflige você, mar, que foge; Jordão, que volta para trás?” A expressão hebraica traduzida por “Que há com você?” é uma interpelação de espanto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לְּךָ
  choice: Que há com você
  rationale: Preserva a forma idiomática hebraica, literalmente próxima de “que há com você?”, e sua força de interpelação admirada, sem reduzi-la ao simples “por quê?”.
- source_word: הַיָּם
  choice: ó mar
  rationale: O substantivo é empregado em apóstrofe; “ó mar” explicita de modo natural e poético o valor vocativo.
- source_word: כִּי
  choice: para que
  rationale: Na construção interrogativa, introduz aquilo que provoca a interpelação. “Para que” produz português corrente sem impor aqui uma explicação causal plena.
- source_word: תָנוּס
  choice: fuja
  rationale: O verbo נוּס significa fugir. O subjuntivo decorre naturalmente da construção portuguesa “para que”, mantendo a personificação do mar.
- source_word: הַיַּרְדֵּן
  choice: ó Jordão
  rationale: O nome próprio também está em interpelação direta; o vocativo preserva o paralelismo com “ó mar”.
- source_word: תִּסֹּב לְאָחוֹר
  choice: volte para trás
  rationale: Expressa diretamente a inversão de curso indicada pelo verbo e pelo advérbio hebraicos, preservando a ênfase espacial do original.
