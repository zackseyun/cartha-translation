base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: pt
  text: 'Quando Israel saiu do Egito,

    a casa de Jacó, de um povo de língua estrangeira,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de um povo que falava uma língua incompreensível”. O hebraico descreve o povo do Egito por sua fala, estrangeira ou ininteligível para Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: Quando ... saiu
  rationale: A preposição בְּ com o infinitivo construto de יצא forma uma oração temporal; esta tradução é natural e preserva o sentido do hebraico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome do povo da aliança.
- source_word: מִ/מִּצְרָיִם
  choice: do Egito
  rationale: A preposição מִן indica origem ou separação; com “saiu”, “do Egito” expressa naturalmente o movimento do êxodo.
- source_word: בֵּית יַעֲקֹב
  choice: a casa de Jacó
  rationale: Mantém a designação poética e pactual dos descendentes de Jacó, em paralelo com “Israel”.
- source_word: מֵ/עַם
  choice: do meio de um povo
  rationale: Expressa a separação indicada por מִן e torna clara, em português natural, a saída de Israel dentre esse povo.
- source_word: לֹעֵז
  choice: de língua estrangeira
  rationale: O termo caracteriza um povo cuja fala era estrangeira ou ininteligível para Israel, sem acrescentar hostilidade étnica.
theological_decisions:
- issue: Relação entre os dois membros paralelos
  choice: 'Conservar o segundo membro como uma reformulação poética elíptica do êxodo: “a casa de Jacó” corresponde a “Israel”, e “do meio de um povo de língua estrangeira” corresponde a “do Egito”.'
  alternative: 'Explicitar novamente o verbo no segundo membro: “quando a casa de Jacó saiu...”'
  rationale: O paralelismo sinonímico e a elipse verbal são claros em português e preservam a estrutura e a tensão poética do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. “Casa de Jacó” preserva a linguagem bíblica tradicional; “de língua estrangeira” comunica com clareza o valor de לֹעֵז. O marcador [a] aparece no texto principal.
