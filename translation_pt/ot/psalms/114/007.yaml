  text: מִ/לִּ/פְנֵ֣י אָ֭דוֹן ח֣וּלִי אָ֑רֶץ מִ֝/לִּ/פְנֵ֗י אֱל֣וֹהַּ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: pt
  text: 'Estremeça[a], ó terra, diante do Senhor,

    diante do Deus de Jacó!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contorça-se, ó terra”, preservando a imagem mais forte de abalo convulsivo que o verbo hebraico também pode transmitir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: A expressão indica estar perante a face ou presença de alguém. “Diante de” é natural em português e comunica que a terra reage à presença divina.
- source_word: אָדוֹן
  choice: o Senhor
  rationale: אָדוֹן significa “senhor” ou “soberano”. O título “Senhor” é adequado ao referente divino, sem confundi-lo com o nome יהוה, que não aparece neste versículo.
- source_word: חוּלִי
  choice: Estremeça
  rationale: O imperativo feminino singular dirige-se à terra e pode descrever tremor, contorção ou convulsão. “Estremeça” conserva a ordem poética e sugere forte abalo, em linguagem portuguesa natural.
- source_word: אָרֶץ
  choice: ó terra
  rationale: Embora o substantivo também possa significar “terra” no sentido de território, o contexto poético e a personificação favorecem a terra em sentido amplo. “Ó” explicita a interpelação direta.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: o Deus de Jacó
  rationale: A expressão identifica Deus por sua relação com Jacó; o artigo produz uma formulação portuguesa fluente após a repetição de “diante de”.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Distinguir אָדוֹן do nome divino יהוה
  choice: Senhor
  alternative: SENHOR
  rationale: O texto hebraico traz o título אָדוֹן, não o nome יהוה. Por isso, usa-se “Senhor” com capitalização normal, evitando importar a convenção tipográfica reservada ao nome divino.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. A repetição de “diante de” preserva o paralelismo hebraico; a exclamação representa a força do imperativo dirigido à terra.
