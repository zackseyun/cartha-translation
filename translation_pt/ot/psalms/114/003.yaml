  yaml_path: translation/ot/psalms/114/003.yaml
  text: The sea saw and fled[b][a]; the Jordan turned back.
translation:
  language: pt
  text: O mar viu e fugiu[b]; o Jordão voltou para trás[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “virou para trás”. A expressão hebraica significa literalmente “voltou-se para trás”.'
    reason: lexical_alternative
  - marker: b
    text: O verso alude poeticamente à travessia do mar no êxodo e à interrupção das águas do Jordão nos dias de Josué.
    reason: cross_reference
lexical_decisions:
- source_word: הַיָּם
  choice: o mar
  rationale: Substantivo definido; a forma genérica preserva o hebraico, que não especifica aqui o mar Vermelho.
- source_word: רָאָה
  choice: viu
  rationale: Equivalente direto e natural, mantendo a personificação poética e sem acrescentar um objeto ausente no hebraico.
- source_word: וַיָּנֹס
  choice: e fugiu
  rationale: O verbo נוס significa fugir; a escolha é concisa e conserva a imagem vívida do mar recuando.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma corrente em português para o nome do rio, em correspondência com o nome hebraico acompanhado de artigo.
- source_word: יִסֹּב לְאָחוֹר
  choice: voltou para trás
  rationale: Expressa de modo natural o movimento para trás indicado pela combinação de סבב com לְאָחוֹר, sem afirmar além do texto que as águas se inverteram.
theological_decisions:
- issue: Alusão histórico-poética
  choice: Manter a personificação do mar e do Jordão sem explicitar no texto principal os episódios históricos aludidos.
  alternative: Acrescentar um objeto a “viu” ou identificar diretamente a travessia do mar e a interrupção do Jordão.
  rationale: O hebraico deixa sem expressão o objeto de “viu” e comunica os acontecimentos por meio de personificação poética; acrescentar “isso”, “o Senhor” ou referências históricas resolveria uma abertura deliberada do verso.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Voltou para trás” é amplamente compreensível e mantém explícito o elemento לְאָחוֹר; os marcadores seguem imediatamente as expressões a que se referem.
