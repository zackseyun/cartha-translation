  text: who turned the rock into a pool of water[a], the flint into a spring of water.
translation:
  language: pt
  text: que transformou a rocha em um lago de água[a], a pederneira em uma fonte de água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que transforma a rocha em um lago de água”; o hebraico usa um particípio, mas o sentido passado combina com a recordação, no salmo, dos atos de Deus no deserto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: que transformou
  rationale: O particípio hifil de הפך funciona como oração relativa ligada ao sujeito divino implícito no versículo anterior. O passado se ajusta à recordação dos atos de Deus no deserto, enquanto a nota preserva o possível valor presente do particípio.
- source_word: הַצּוּר
  choice: a rocha
  rationale: צוּר designa uma rocha ou massa rochosa; “rocha” é natural, claro e adequado à alusão à água no deserto.
- source_word: אֲגַם
  choice: um açude
  rationale: אֲגַם indica uma extensão de água parada. “Açude” comunica uma reserva ou poço amplo de água e mantém o contraste poético com a rocha, embora “lago” também seja possível.
- source_word: מָיִם
  choice: de águas
  rationale: A repetição de מָיִם nos dois membros é preservada como “de águas”, forma poética e compreensível em português.
- source_word: חַלָּמִישׁ
  choice: a pederneira
  rationale: חַלָּמִישׁ refere-se à pederneira ou rocha extremamente dura. “Pederneira” preserva a imagem concreta e realça o caráter extraordinário do ato.
- source_word: לְמַעְיְנוֹ
  choice: numa fonte
  rationale: מַעְיָן significa nascente ou fonte; o לְ marca o resultado da transformação, em paralelo com o primeiro membro. O singular corresponde à forma hebraica.
theological_decisions:
- issue: Sujeito divino implícito retomado do versículo anterior
  choice: Manter a oração relativa “que transformou”, sem repetir “Deus”
  alternative: “Ele transformou a rocha...”
  rationale: O hebraico continua a descrição do Senhor, o Deus de Jacó, iniciada no versículo 7. A oração relativa conserva a ligação poética e sintática sem explicitar além do texto.
- issue: Valor temporal do particípio הַהֹפְכִי
  choice: Usar o passado no texto e registrar na nota a possível tradução no presente
  alternative: “que transforma”
  rationale: O contexto do salmo relembra a ação divina no êxodo e no deserto, favorecendo o passado; contudo, o particípio hebraico permite uma caracterização mais geral ou presente, que não deve ser apagada.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “Pederneira” conserva a imagem específica da rocha duríssima; “açude de águas” mantém a ideia de água acumulada e o paralelismo com “fonte de águas”.
