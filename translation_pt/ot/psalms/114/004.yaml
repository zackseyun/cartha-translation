lexical_decisions:
- source_word: הֶהָרִים
  choice: os montes
  rationale: O substantivo traz o artigo definido. “Montes” é natural e preserva a referência coletiva da cena poética.
- source_word: רָקְדוּ
  choice: saltaram
  rationale: O verbo descreve movimento vivo, como dançar ou dar saltos. “Saltaram” combina naturalmente com a comparação animal e mantém a personificação poética.
- source_word: כְאֵילִים
  choice: como carneiros
  rationale: אֵילִים designa aqui carneiros, imagem que se articula com os animais jovens do segundo membro.
- source_word: גְּבָעוֹת
  choice: as colinas
  rationale: Embora o substantivo não tenha artigo no hebraico, o paralelismo com “os montes” pede o artigo em português corrente.
- source_word: כִּבְנֵי צֹאן
  choice: como cordeiros do rebanho
  rationale: A expressão significa literalmente “como filhos do rebanho” e designa animais jovens; “cordeiros do rebanho” comunica o sentido com clareza e preserva a textura da imagem.
