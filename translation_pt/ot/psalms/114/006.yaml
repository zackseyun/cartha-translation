  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: pt
  text: Ó montes, por que saltam como carneiros? Ó colinas, como cordeiros do rebanho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “como filhos do rebanho”, expressão que se refere a ovelhas jovens ou cordeiros.
