lexical_decisions:
- source_word: הֶהָרִים
  choice: Ó montes
  rationale: O substantivo significa “montes”. A forma interrogativa retoma a pergunta do versículo anterior, e “ó” comunica naturalmente o vocativo poético.
- source_word: תִּרְקְדוּ
  choice: saltam
  rationale: O verbo רָקַד pode significar saltar, pular ou dançar. “Saltar” combina com a comparação animal e mantém o movimento vívido da poesia.
- source_word: כְאֵילִים
  choice: como carneiros
  rationale: אֵילִים designa aqui carneiros, sentido direto que também corresponde à imagem de rebanho no segundo membro.
- source_word: גְּבָעוֹת
  choice: Ó colinas
  rationale: O substantivo significa “colinas”; o vocativo prossegue o tratamento poético dirigido à criação.
- source_word: כִּבְנֵי צֹאן
  choice: como cordeiros do rebanho
  rationale: A expressão significa literalmente “como filhos do rebanho” e funciona como modo idiomático de indicar animais jovens, aqui vertidos naturalmente como “cordeiros” sem perder a referência ao rebanho.
