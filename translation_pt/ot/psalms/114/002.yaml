  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: pt
  text: 'Judá se tornou o seu santuário[a][b],

    Israel, o seu domínio[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Judá era o seu santuário”. O verbo hebraico pode descrever tanto um estado (“era”) como uma transição (“se tornou”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o seu lugar santo”. O termo hebraico pode significar “santidade” ou designar um lugar santo, um santuário.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a esfera do seu governo” ou “o seu governo”. A palavra hebraica está formalmente no plural, mas aqui provavelmente expressa uma ideia abstrata ou abrangente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: se tornou
  rationale: No contexto da saída do Egito, o verbo היה pode indicar uma transição ou resultado. “Se tornou” expressa esse valor eventivo, embora “era/foi” também seja possível.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo e território.
- source_word: לְקָדְשׁוֹ
  choice: o seu santuário
  rationale: קֹדֶשׁ pode designar santidade ou um lugar santo. Aqui, o sentido concreto “santuário” forma um paralelo natural com “domínio” e preserva a ideia de Judá como esfera santa pertencente a Deus.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo.
- source_word: מַמְשְׁלוֹתָיו
  choice: o seu domínio
  rationale: O substantivo designa governo, domínio ou esfera de governo. Embora a forma hebraica seja plural, provavelmente tem valor abstrato ou extensivo neste verso; o singular idiomático mantém o paralelismo.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “seu santuário” e “seu domínio”
  choice: Os possessivos referem-se a Deus, sem nomeá-lo explicitamente no verso.
  alternative: Explicitar “do SENHOR” ou deixar a referência apenas subentendida.
  rationale: O contexto do salmo identifica Deus como referente. O pronome possessivo preserva a concisão e a forma implícita do hebraico, sem acrescentar um nome divino ausente neste verso.
- issue: Paralelismo entre Judá e Israel
  choice: Manter os dois nomes distintamente.
  alternative: Harmonizá-los em uma única expressão coletiva ou interpretá-los como “povo santo” e “reino”.
  rationale: O paralelismo poético hebraico nomeia Judá e Israel separadamente. Preservar ambos evita reduzir a estrutura literária ou impor uma interpretação histórica ou teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse verbal no segundo membro preserva o paralelismo conciso do hebraico. Os marcadores seguem imediatamente os termos aos quais se referem.
