source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: pt
  text: Levanta-te, ó Deus; defende a tua causa.[a] Lembra-te da tua afronta, vinda do insensato, o dia inteiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pleiteia a tua causa”. O hebraico emprega linguagem de disputa judicial.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “insensato” designa uma pessoa moralmente corrupta ou irreverente, não apenas alguém de pouca inteligência.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: O imperativo de קום, com ה paragógico, expressa um apelo urgente para que Deus se disponha a agir. “Levanta-te” preserva tanto a imagem quanto o tom de súplica.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo exerce função vocativa. A forma “ó Deus” é natural na linguagem digna de oração.
- source_word: רִיבָה רִיבֶךָ
  choice: defende a tua causa
  rationale: O verbo e o substantivo cognatos pertencem à linguagem de disputa ou processo judicial. A formulação comunica com clareza a convocação para que Deus sustente a causa que lhe pertence.
- source_word: זְכֹר
  choice: Lembra-te
  rationale: O imperativo pede que Deus tenha a afronta em consideração e aja, sem explicitar na tradução a ação implícita.
- source_word: חֶרְפָּתְךָ
  choice: da afronta ... contra ti
  rationale: 'חֶרְפָּה pode designar afronta, insulto ou escárnio. A construção portuguesa torna natural o sentido mais provável do sufixo: uma afronta dirigida contra Deus.'
- source_word: מִנִּי
  choice: que vem do
  rationale: A preposição indica a origem da afronta, isto é, o insensato.
- source_word: נָבָל
  choice: insensato
  rationale: No contexto dos Salmos, o termo caracteriza alguém moralmente corrupto e irreverente, não apenas uma pessoa sem capacidade intelectual. “Insensato” preserva a categoria bíblica sem acrescentar explicitamente “ímpio” ao texto.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão temporal idiomática que indica duração contínua ao longo de todo o dia.
theological_decisions:
- issue: Referente da afronta expressa por חֶרְפָּתְךָ
  choice: afronta dirigida contra Deus
  alternative: afronta sofrida pelo povo de Deus e considerada dele por sua identificação pactual com o povo
  rationale: O sufixo de segunda pessoa e o paralelo com “tua causa” favorecem uma afronta dirigida ao próprio Deus. O contexto mais amplo permite associação com os ataques ao povo e ao santuário, mas a tradução não introduz essa interpretação secundária no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa do singular coerentes com o discurso direto a Deus. “Defende a tua causa” comunica naturalmente a metáfora jurídica; “o dia inteiro” preserva a duração contínua da afronta.
