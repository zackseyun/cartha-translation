  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: pt
  text: Olha para a aliança[a], pois os lugares escuros da terra[b] estão cheios de moradas de violência[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua aliança”. O hebraico diz literalmente “a aliança”, embora o contexto se refira à aliança de Deus com seu povo.
    reason: alternative_reading
  - marker: b
    text: Ou “do país”. O termo hebraico pode significar “terra”, “país” ou, em certos contextos, “mundo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “habitações de violência”. O termo hebraico traduzido por “moradas” também pode designar pastagens ou lugares habitados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Olha para
  rationale: O imperativo de נבט pede que Deus dirija sua atenção à aliança. “Olha para” conserva a imagem e o tom de súplica sem acrescentar a ideia explícita de recordar ou cumprir.
- source_word: לַבְּרִית
  choice: para a aliança
  rationale: בְּרִית designa uma aliança solene. O artigo definido foi mantido, sem introduzir na tradução principal o possessivo “tua”, ausente no hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a súplica e mantém uma ligação causal clara e digna.
- source_word: מָלְאוּ
  choice: estão cheios de
  rationale: 'O perfeito qal descreve aqui um estado presente resultante: esses lugares se encontram repletos de moradas associadas à violência.'
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: os lugares escuros da terra
  rationale: A expressão construta significa literalmente “lugares escuros da terra/país”. “Terra” preserva em português parte da amplitude do hebraico e se ajusta ao cenário territorial do salmo.
- source_word: נְאוֹת
  choice: moradas
  rationale: נָוֶה pode indicar morada, habitação ou pastagem. Neste contexto, “moradas” conserva o sentido locativo e a imagem incomum do original sem identificar explicitamente seus ocupantes.
- source_word: חָמָס
  choice: violência
  rationale: חָמָס abrange violência e injustiça violenta; “violência” é o equivalente direto e adequado neste contexto.
theological_decisions:
- issue: Se a aliança deve receber um possessivo explícito
  choice: a aliança
  alternative: tua aliança
  rationale: O contexto aponta para a aliança de Deus com seu povo, mas o hebraico traz artigo definido, não sufixo possessivo. A tradução principal preserva essa forma e registra a explicitação contextual em nota.
- issue: Se as “moradas” devem ser identificadas como lugares de pessoas violentas
  choice: moradas de violência
  alternative: redutos de gente violenta
  rationale: A formulação hebraica liga diretamente “moradas” a “violência” e deixa implícita a identidade dos ocupantes. A tradução evita resolver essa imagem mediante uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção “moradas de violência” mantém deliberadamente a imagem compacta e algo incomum do hebraico; as notas registram as principais alternativas sem sobrecarregar o versículo.
