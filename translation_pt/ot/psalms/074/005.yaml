  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: pt
  text: Era reconhecido como quem levanta machados num emaranhado de árvores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Era reconhecido como quem leva machados para o alto, em um emaranhado de árvores.” O hebraico é conciso e de interpretação difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: Era reconhecido
  rationale: O nifal imperfeito, no contexto poético narrativo, descreve uma situação passada. A forma masculina singular é preservada sem explicitar além do necessário quem é o referente.
- source_word: כְּמֵבִיא
  choice: como quem ergue
  rationale: כְּ introduz a comparação, e o particípio hifil de בוא exprime fazer subir ou levar para cima. Com machados, “ergue” comunica naturalmente o movimento sem acrescentar a ideia mais específica de golpear.
- source_word: לְמָעְלָה
  choice: ergue
  rationale: A direção para cima foi incorporada ao verbo português “ergue”, evitando a redundância pouco natural de “ergue para cima”.
- source_word: בִּסֲבָךְ
  choice: no meio de um bosque cerrado
  rationale: סְבָךְ designa vegetação densa ou um emaranhado de árvores. A preposição בְּ é entendida aqui em sentido locativo, e não direcional.
- source_word: עֵץ
  choice: bosque
  rationale: עֵץ pode indicar árvore ou madeira. Em associação com סְבָךְ, “bosque cerrado” transmite de modo claro e natural a imagem de árvores densamente agrupadas.
- source_word: קַרְדֻּמּוֹת
  choice: machados
  rationale: O substantivo plural designa ferramentas de corte; “machados” é a opção mais provável e acessível neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a comparação abrupta e a dificuldade do hebraico, mas evita uma construção artificial. “Bosque cerrado” é usado no sentido de mata densa, não como nome de bioma.
