id: PSA.74.17
reference: Psalms 74:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: pt
  text: Tu estabeleceste todos os limites da terra[a]; verão e inverno — tu os formaste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fixaste” todos os limites da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou “tu os modelaste”. O pronome “os” se refere a “verão e inverno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: estabeleceste
  rationale: O hifil de נצב expressa fazer ficar firme ou pôr no lugar. “Estabeleceste” comunica tanto a ação de fixar quanto a estabilidade resultante.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: todos os limites da terra
  rationale: גְּבוּלוֹת designa limites ou fronteiras. Neste contexto de ordem criada, “limites da terra” evita a conotação principalmente política de “fronteiras” e preserva o plural e כָּל.
- source_word: קַיִץ וָחֹרֶף
  choice: verão e inverno
  rationale: São os equivalentes portugueses comuns para o par de estações, que aqui representa a ordenação do ciclo anual.
- source_word: יְצַרְתָּם
  choice: tu os formaste
  rationale: יצר tem o sentido concreto de formar ou modelar. O sufixo masculino plural remete naturalmente a “verão e inverno”, ambos masculinos em português.
- source_word: אַתָּה ... אַתָּה
  choice: Tu ... tu
  rationale: A repetição do pronome explícito preserva a ênfase hebraica na ação direta de Deus.
theological_decisions:
- issue: Alcance da linguagem da criação nos “limites da terra”
  choice: Declaração cósmica sobre Deus ordenar o mundo
  alternative: Referência às fronteiras territoriais de terras ou nações
  rationale: A associação imediata com “verão e inverno” favorece o contexto da ordem criada, embora “limites” preserve a amplitude da expressão hebraica sem definir quais limites estão em vista.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das palavras mantém a repetição enfática de “tu”, e o travessão realça o segundo par sem tornar a frase artificial.
