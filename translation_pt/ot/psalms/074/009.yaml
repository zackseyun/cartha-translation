source:
  edition: WLC
  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: pt
  text: Não vemos os nossos sinais[a]; já não há profeta, e ninguém entre nós sabe até quando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nossas bandeiras” ou “os nossos emblemas”; o termo hebraico pode indicar sinais visíveis ou emblemas, mas o referente exato não está explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: os nossos sinais
  rationale: Mantém o sentido amplo de אוֹת como sinal, marca ou emblema visível, sem especificar um referente que o hebraico não explicita.
- source_word: לֹא רָאִינוּ
  choice: não vemos
  rationale: Expressa naturalmente, em português, o estado presente e contínuo lamentado pelo salmista.
- source_word: אֵין עוֹד
  choice: já não há
  rationale: Indica cessação ou ausência continuada de algo anteriormente presente.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente corrente e exato; o singular tem valor genérico, indicando que não há profeta algum.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: e ninguém entre nós sabe
  rationale: Reproduz de modo idiomático a construção elíptica hebraica e conserva o sentido comunitário de אִתָּנוּ.
- source_word: עַד מָה
  choice: até quando
  rationale: É a expressão idiomática natural em lamentos para perguntar pela duração de uma situação.
theological_decisions:
- issue: Referente de “os nossos sinais”
  choice: A expressão foi mantida ampla, como “os nossos sinais”.
  alternative: “as nossas bandeiras”, “os nossos emblemas” ou uma explicitação como “os sinais da presença de Deus entre nós”
  rationale: O hebraico não identifica precisamente esses sinais. A formulação ampla preserva a ambiguidade textual e evita impor uma reconstrução cultual, militar ou histórica específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Já não há” preserva a força lamentosa da cessação, e “até quando” mantém o idioma poético corrente sem resolver a duração indeterminada.
