base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: pt
  text: 'Masquil de Asafe.[a]


    Por que, ó Deus, nos rejeitaste para sempre? Por que a tua ira fumega contra as ovelhas do teu pasto?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Masquil” é um termo técnico usado no título de alguns salmos; pode indicar uma composição contemplativa ou instrutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Masquil
  rationale: Termo técnico e de sentido preciso incerto no título do salmo. A transliteração evita defini-lo indevidamente como composição contemplativa ou instrutiva; a nota registra essas possibilidades.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: O prefixo לְ pode indicar autoria, associação ou dedicação. A formulação portuguesa natural «de Asafe» mantém essa relação sem especificá-la além do texto.
- source_word: לָמָה
  choice: Por que
  rationale: Interrogativo direto e idiomático, adequado ao tom de lamento.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto apresenta um vocativo em oração; «ó Deus» explicita naturalmente esse valor em português.
- source_word: זָנַחְתָּ
  choice: nos rejeitaste
  rationale: O verbo expressa rejeição ou repúdio. O pretérito perfeito preserva a ação passada apresentada como realidade presente no lamento.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa duração indefinida ou aparentemente interminável e conserva a força emocional do lamento.
- source_word: יֶעְשַׁן
  choice: fumega
  rationale: Preserva a imagem concreta da ira que solta fumaça, sem reduzi-la ao sentido mais genérico de arder.
- source_word: אַפְּךָ
  choice: a tua ira
  rationale: Embora o substantivo signifique literalmente «nariz» ou «narina», é um idioma hebraico para ira. «Ira» combina com a imagem forte de «fumega» e mantém registro digno.
- source_word: בְּצֹאן
  choice: contra as ovelhas
  rationale: «Contra» comunica a direção hostil da ira, enquanto «ovelhas» conserva a metáfora pastoral concreta.
- source_word: מַרְעִיתֶךָ
  choice: do teu pasto
  rationale: O termo designa pastagem ou lugar de apascentar. A expressão conserva a imagem hebraica de Israel como ovelhas alimentadas no pasto de Deus.
theological_decisions:
- issue: Objeto de primeira pessoa do plural na forma verbal
  choice: nos rejeitaste
  alternative: rejeitaste [o teu povo]
  rationale: A leitura textual tradicional e o contexto de lamento comunitário sustentam o objeto «nos». A tradução evita substituir esse pronome pela expansão interpretativa «o teu povo».
- issue: Relação de Asafe com o salmo
  choice: de Asafe
  alternative: para Asafe
  rationale: A preposição hebraica permite autoria, associação ou dedicação. A tradução mantém uma formulação convencional sem decidir dogmaticamente qual relação está em vista.
- issue: Metáfora da ira divina
  choice: a tua ira fumega
  alternative: a tua ira arde
  rationale: A opção conserva a imagem antropomórfica e poética do hebraico, sem explicar ou suavizar a tensão teológica do lamento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. Mantêm-se o título técnico transliterado, o vocativo poético «ó Deus» e a imagem vívida da ira que «fumega». O pronome de segunda pessoa singular segue o tom direto e pessoal da oração.
