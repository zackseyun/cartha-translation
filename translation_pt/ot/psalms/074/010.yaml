source:
  edition: WLC
  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: pt
  text: Até quando, ó Deus, o adversário continuará insultando? O inimigo ultrajará o teu nome para sempre?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O inimigo blasfemará contra o teu nome para sempre?”'
    reason: Alternativa lexical para יְנָאֵץ, que pode denotar desprezo ofensivo ou blasfêmia quando dirigido a Deus ou ao seu nome.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressão interrogativa idiomática de lamento diante de uma situação que se prolonga; “Até quando” é natural em português e mantém o tom de súplica.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto é de invocação direta; “ó Deus” preserva com clareza o vocativo e o tom de oração.
- source_word: יְחָרֶף
  choice: continuará insultando
  rationale: O piel de חרף indica insultar, afrontar ou lançar escárnio. “Continuará insultando” produz uma construção natural sem acrescentar um objeto que não está expresso no hebraico; a ideia de continuidade decorre de עַד מָתַי.
- source_word: צָר
  choice: o adversário
  rationale: צָר designa quem se opõe ou hostiliza. “Adversário” mantém o sentido e permite distingui-lo de אוֹיֵב no paralelismo seguinte.
- source_word: יְנָאֵץ
  choice: ultrajará
  rationale: O piel de נאץ comunica desprezo ofensivo dirigido a Deus ou ao seu nome. “Ultrajará” abrange desonra e insulto sem tornar obrigatória a interpretação mais específica “blasfemará”.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: Equivalente corrente de אוֹיֵב e distinto de “adversário”, preservando a variação lexical do paralelismo hebraico.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém a expressão explícita do hebraico, com suas ressonâncias de honra, reputação e identidade revelada de Deus.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Equivalente temporal natural que expressa a angústia diante de uma afronta aparentemente interminável.
theological_decisions:
- issue: Se a afronta ao nome de Deus deve ser explicitada como blasfêmia contra o próprio Deus
  choice: Manter “o teu nome” no texto principal e traduzir נאץ de modo mais amplo como “ultrajará”
  alternative: “O inimigo blasfemará contra o teu nome para sempre?”
  rationale: O hebraico menciona expressamente o nome de Deus, linguagem teologicamente rica que inclui sua honra e identidade revelada. “Ultrajará” preserva a amplitude lexical, enquanto a nota registra a leitura mais especificamente cultual ou religiosa “blasfemará”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição semântica entre “adversário” e “inimigo” e a progressão entre “insultando” e “ultrajará” preservam o paralelismo sem o achatar.
