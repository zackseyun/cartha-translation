  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: pt
  text: 'Lembra-te disto: o inimigo insultou Yahweh[a], e um povo insensato desprezou o teu nome[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afrontou”, “zombou de” ou “provocou Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tratou o teu nome com desprezo”; possivelmente, “blasfemou contra o teu nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר
  choice: Lembra-te
  rationale: Imperativo qal masculino singular de זכר, dirigido a Deus em forma de súplica. “Lembra-te” é natural no registro de oração e preserva o apelo enfático.
- source_word: זֹאת
  choice: disto
  rationale: O demonstrativo feminino singular aponta para a afronta apresentada no próprio versículo; “disto” produz uma ligação idiomática com “lembra-te”.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: Embora o substantivo esteja formalmente no singular e sem artigo, no contexto funciona como designação genérica ou coletiva do adversário.
- source_word: חֵרֵף
  choice: insultou
  rationale: חרף expressa afronta, escárnio ou provocação verbal. “Insultou” comunica claramente a desonra dirigida a Deus sem restringir o sentido apenas à zombaria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעַם
  choice: e um povo
  rationale: עם tem sentido coletivo de “povo”; a forma indefinida evita identificar além do que o hebraico explicita.
- source_word: נָבָל
  choice: insensato
  rationale: No uso poético e sapiencial, נבל indica insensatez de caráter moral e espiritual, não simples deficiência intelectual. “Insensato” preserva essa nuance em português corrente.
- source_word: נִאֲצוּ
  choice: desprezou
  rationale: נאץ denota tratar com desprezo, rejeitar com desdém ou ultrajar. O singular concorda naturalmente em português com o coletivo “um povo”.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: Conserva a imagem hebraica do nome como expressão da identidade, honra e caráter revelado de Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Nuance moral de נָבָל
  choice: insensato
  alternative: tolo; ímpio; vil
  rationale: “Insensato” permite a leitura moral e espiritual característica do termo sem explicitar “ímpio”, interpretação mais estreita do que a forma hebraica exige.
- issue: Alcance semântico de נאץ
  choice: desprezou
  alternative: tratou com desprezo; blasfemou contra
  rationale: “Desprezou” mantém o sentido amplo de afronta e desdém. “Blasfemou” é possível no contexto do nome divino, mas resolve de modo mais específico uma ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e acessível, com formas pronominais amplamente reconhecíveis no registro bíblico. O paralelismo poético foi preservado, assim como o contraste entre a afronta do inimigo e o desprezo de um povo moralmente insensato.
