source:
  edition: WLC
  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: pt
  text: Tu esmagaste as cabeças do Leviatã; e o deste como alimento ao povo do deserto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos habitantes do deserto” ou “às criaturas selvagens do deserto”. O termo hebraico é difícil e pode se referir a habitantes ou animais de regiões áridas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה רִצַּצְתָּ
  choice: Tu esmagaste
  rationale: O pronome explícito אַתָּה recebe destaque, e רִצַּצְתָּ expressa a ideia vigorosa de despedaçar ou esmagar. A formulação preserva a força poética do hebraico.
- source_word: רָאשֵׁי
  choice: as cabeças de
  rationale: O substantivo está no plural construto. Manter “cabeças” reproduz diretamente a imagem de um Leviatã com múltiplas cabeças.
- source_word: לִוְיָתָן
  choice: Leviatã
  rationale: A transliteração tradicional portuguesa preserva o nome poético e suas ressonâncias em outras passagens bíblicas, sem reduzi-lo a uma interpretação específica.
- source_word: תִּתְּנֶנּוּ
  choice: e o deste
  rationale: O verbo נתן significa normalmente “dar”, e o sufixo masculino singular retoma Leviatã. A conjunção torna natural em português a progressão entre as duas ações poéticas.
- source_word: מַאֲכָל
  choice: como alimento
  rationale: מַאֲכָל denota alimento ou comida. “Como alimento” se encaixa naturalmente depois de “deste”.
- source_word: לְעָם לְצִיִּים
  choice: ao povo do deserto
  rationale: A tradução mantém o sentido comum de עַם, “povo”, e entende צִיִּים como relacionado a habitantes de regiões áridas. Como a expressão é difícil e pode designar criaturas selvagens do deserto, essa alternativa é registrada em nota.
theological_decisions:
- issue: Natureza da imagem do Leviatã
  choice: Manter “Leviatã” como imagem poético-cósmica sem definir sua natureza exata.
  alternative: Identificá-lo exclusivamente como monstro marinho literal, símbolo do Egito ou representação dos poderes do caos.
  rationale: O verso celebra a vitória divina por meio de linguagem poética conhecida, mas não explicita aqui uma única identificação do Leviatã. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível. O uso de “Tu” conserva a ênfase do pronome hebraico e o tom de oração do salmo. A pontuação mantém o paralelismo compacto do verso, e a nota é colocada junto à expressão lexicalmente ambígua.
