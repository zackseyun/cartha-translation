  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: pt
  text: Lembra-te da tua comunidade, que adquiriste há muito tempo[a] e resgataste, a tribo da tua herança[b]; deste monte Sião[c], onde habitaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Adquiriste” também pode ser traduzido por “compraste” ou “tomaste para ti” e, em outros contextos, por “criaste”.
    reason: lexical_alternative
  - marker: b
    text: “Tribo da tua herança” também pode ser traduzido por “cetro da tua herança” ou “vara da tua herança”; aqui, “tribo” se ajusta melhor ao povo resgatado.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “este”, referindo-se ao monte Sião.
    reason: translation_clarity
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo masculino singular dirigido a Deus. A forma pronominal é natural em português e preserva o tom de súplica.
- source_word: עֲדָתְךָ
  choice: tua comunidade
  rationale: עֵדָה designa o povo reunido ou a coletividade. “Comunidade” comunica o sentido corporativo em português atual sem exigir uma reunião litúrgica específica.
- source_word: קָנִיתָ קֶּדֶם
  choice: adquiriste há muito tempo
  rationale: קנה pode significar adquirir, comprar, possuir e, em certos contextos, criar. Aqui, em paralelo com a redenção do povo, “adquiriste” preserva a ideia de Deus tê-lo tomado para si sem impor uma metáfora comercial; קדם indica um passado remoto.
- source_word: גָּאַלְתָּ
  choice: resgataste
  rationale: גאל descreve a ação de libertar ou reivindicar como resgatador. “Resgataste” é claro e mantém tanto o sentido histórico de libertação quanto o peso teológico do termo.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: tribo da tua herança
  rationale: שֵׁבֶט pode significar tribo, vara ou cetro. A referência paralela à comunidade resgatada favorece “tribo”, enquanto “da tua herança” conserva a linguagem de pertencimento.
- source_word: הַר צִיּוֹן זֶה
  choice: deste monte Sião
  rationale: O demonstrativo זֶה aponta para o monte Sião. A contração “deste” integra naturalmente em português o segundo objeto do pedido “lembra-te” e mantém a força dêitica do hebraico.
- source_word: שָׁכַנְתָּ בוֹ
  choice: onde habitaste
  rationale: שׁכן expressa habitar ou estabelecer morada, frequentemente associado à presença divina. “Onde habitaste” reproduz com naturalidade a referência passada e o pronome locativo.
theological_decisions:
- issue: Se קָנִיתָ deve indicar criação ou aquisição do povo da aliança
  choice: aquisição do povo por Deus
  alternative: criação ou formação do povo
  rationale: Embora קנה possa significar “criar” em alguns contextos, o objeto “tua comunidade” e o paralelo com “resgataste” favorecem a ação histórica de Deus ao tomar Israel como seu povo. “Adquiriste” mantém a amplitude do verbo sem afirmar uma compra literal.
- issue: Se שֵׁבֶט deve ser entendido como tribo, cetro ou vara
  choice: tribo
  alternative: cetro ou vara
  rationale: O contexto trata da comunidade que Deus adquiriu e resgatou. Por isso, o sentido de grupo humano é mais coerente, embora a polissemia seja registrada em nota.
- issue: Relação sintática do monte Sião com o restante do versículo
  choice: segundo objeto do apelo “Lembra-te”
  alternative: aposição direta à “tribo da tua herança”
  rationale: A pausa massorética depois de נַחֲלָתֶךָ favorece a leitura em que o salmista pede que Deus se lembre também do monte Sião. O demonstrativo זֶה retoma o monte como o lugar onde Deus habitou.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A ordem foi ajustada para tornar claros os dois complementos de “Lembra-te”, sem eliminar a pausa nem a ambiguidade lexical do hebraico.
