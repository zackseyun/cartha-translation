  source_fidelity: A tradução transmite corretamente a pergunta de lamento, a duplicação enfática de «mão / mão direita», a imagem da mão recolhida junto ao peito e o imperativo final com objeto contextual implícito. Contudo, «retrais» está na segunda pessoa do plural, enquanto «tua» e os verbos imperativos do restante do versículo estão na segunda pessoa do singular; essa discordância precisa ser corrigida.
  naturalness: «Por que reténs a tua mão» é português moderno, claro e apropriado ao registro poético. «Do meio do teu peito» explicita com naturalidade moderada o valor de «do interior/do meio do teu seio/colo», sem perder a imagem corporal e da veste. «Acaba com eles» é claro e preserva a força do pedido.
  terminology: «Mão direita» preserva a expressão hebraica concreta. «Reténs» representa adequadamente o hifil de שוב neste contexto, com o sentido de reter ou manter afastada a mão. A nota continua distinguindo o objeto implícito do hebraico da complementação «eles» em português.
