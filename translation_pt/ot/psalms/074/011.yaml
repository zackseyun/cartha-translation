  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: pt
  text: Por que reténs a tua mão, a tua mão direita? Tira-a do meio do teu peito e acaba com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “do meio do teu peito, acaba”. O verbo final não tem objeto explícito; “com eles” é suprido com base no contexto, que fala dos inimigos no salmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo causal que introduz a queixa do salmista.
- source_word: תָשִׁיב
  choice: retrais
  rationale: O hifil de שוב, tendo “mão” como objeto e estando em paralelo com a imagem da mão junto ao peito, expressa a ideia de fazê-la recuar ou retê-la, isto é, abster-se de agir.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Mantém a imagem concreta e o paralelismo poético com “a tua mão direita”.
- source_word: וִימִינֶךָ
  choice: a tua mão direita
  rationale: Tradução direta que preserva a imagem bíblica de força e ação decisiva.
- source_word: מִקֶּרֶב חֵיקֶךָ
  choice: do peito
  rationale: A expressão indica o interior do peito, colo ou dobra da roupa, onde a mão permanece recolhida. “Do peito” é natural em português e conserva a imagem essencial.
- source_word: כַלֵּה
  choice: acaba com eles
  rationale: O imperativo piel de כלה significa levar ao fim, consumir ou destruir. “Acaba com eles” transmite com clareza a ação decisiva pedida, enquanto o pronome explicita o objeto subentendido pelo contexto.
theological_decisions:
- issue: Objeto implícito do imperativo final
  choice: “acaba com eles”, referindo-se aos inimigos
  alternative: Manter o verbo sem objeto explícito (“põe fim”) ou entender a ordem de modo mais geral, referente à ameaça ou à afronta
  rationale: O hebraico não explicita o objeto, mas o contexto do salmo trata dos inimigos que devastam o santuário e zombam de Deus. O pronome “eles” é uma complementação contextual mínima; a nota preserva a ambiguidade formal do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Retrais” preserva o valor poético sem soar excessivamente arcaico; “do peito” comunica de modo natural a imagem da mão recolhida na dobra da roupa. A repetição de “mão” mantém o paralelismo hebraico.
