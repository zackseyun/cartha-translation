  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: pt
  text: Tu dividiste o mar com a tua força; quebraste as cabeças dos monstros marinhos[a] sobre as águas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dragões” ou “grandes criaturas marinhas”. O termo hebraico pode designar criaturas grandes, serpentinas e monstruosas associadas às águas.
    reason: lexical_alternative
  - marker: b
    text: Este versículo pode evocar tanto a vitória de Deus sobre o mar caótico, em linguagem poética, quanto sua libertação histórica junto ao mar no êxodo.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: dividiste
  rationale: O verbo expressa partir ou separar em partes; “dividiste o mar” é natural em português e mantém tanto a força poética quanto a possível evocação do êxodo.
- source_word: בְעָזְּךָ
  choice: com a tua força
  rationale: עֹז significa força ou poder, e a preposição בְּ tem aqui valor instrumental.
- source_word: יָם
  choice: o mar
  rationale: O artigo é idiomático em português para o mar em vista, sem decidir se a referência é primordialmente cósmica ou histórica.
- source_word: שִׁבַּרְתָּ
  choice: quebraste
  rationale: Traduz diretamente a ação violenta de שׁבר e preserva o paralelismo sem acrescentar a ideia mais específica de esmagamento.
- source_word: רָאשֵׁי
  choice: as cabeças de
  rationale: Mantém a imagem anatômica e o plural do hebraico.
- source_word: תַנִּינִים
  choice: monstros marinhos
  rationale: Comunica de modo acessível as grandes criaturas serpentinas associadas às águas, preservando o caráter poético-cósmico do termo.
- source_word: עַל הַמָּיִם
  choice: sobre as águas
  rationale: Preserva o sentido mais direto de עַל e a imagem poética, sem substituí-lo interpretativamente por “nas águas”.
theological_decisions:
- issue: Natureza da imagem do mar e dos תַנִּינִים
  choice: Manter no texto a imagem poético-cósmica, permitindo também uma evocação da libertação no êxodo.
  alternative: Interpretar exclusivamente como referência histórica ao êxodo ou exclusivamente como linguagem de combate cósmico.
  rationale: O hebraico comporta ambas as ressonâncias; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o discurso direto a Deus. A sintaxe paralela e as imagens concretas do hebraico foram preservadas.
