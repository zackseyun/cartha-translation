base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: pt
  text: Não te esqueças da voz dos teus inimigos[a]; o tumulto dos que se levantam contra ti sobe continuamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do som dos teus inimigos”. A palavra hebraica pode indicar tanto voz como som ou ruído, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Também seria possível entender: “o tumulto dos que se levantam contra ti aumenta continuamente”. O verbo hebraico significa literalmente “sobe”, mas, neste contexto, pode sugerir que o tumulto se intensifica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: Não te esqueças
  rationale: Expressa naturalmente em português a súplica ou proibição hebraica, preservando o sentido direto de שׁכח, “esquecer”.
- source_word: קוֹל
  choice: voz
  rationale: קוֹל pode designar voz ou som; “voz” conserva o valor lexical concreto e mantém distinção em relação a שְׁאוֹן, “tumulto”.
- source_word: צֹרְרֶיךָ
  choice: dos teus inimigos
  rationale: Forma participial plural que designa adversários; “inimigos” é direto, claro e natural.
- source_word: שְׁאוֹן
  choice: tumulto
  rationale: Denota ruído intenso e agitação; “tumulto” comunica tanto o barulho quanto a desordem.
- source_word: קָמֶיךָ
  choice: dos que se levantam contra ti
  rationale: Preserva a imagem verbal de קום e explicita o sentido hostil contextual do particípio.
- source_word: עֹלֶה
  choice: sobe
  rationale: Reproduz de modo conciso a imagem de algo que ascende, tendo “tumulto” como sujeito.
- source_word: תָמִיד
  choice: continuamente
  rationale: Transmite a continuidade persistente indicada pelo advérbio hebraico.
