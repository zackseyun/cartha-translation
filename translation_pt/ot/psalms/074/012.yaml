  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: pt
  text: 'Mas Deus é o meu Rei desde os tempos antigos,

    realizando atos de salvação no meio da terra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o país” ou “uma região específica”. O hebraico pode referir-se tanto à terra inteira como a uma terra determinada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Mas Deus
  rationale: A conjunção assume valor adversativo no contexto, contrapondo a devastação descrita à confiança duradoura em Deus. “Mas” expressa essa transição com naturalidade.
- source_word: מַלְכִּי
  choice: o meu Rei
  rationale: O substantivo com sufixo de primeira pessoa singular significa “meu rei”. A maiúscula indica seu uso como título divino sem eliminar a força possessiva.
- source_word: מִקֶּדֶם
  choice: desde os tempos antigos
  rationale: A expressão aponta para um passado remoto e para a longa duração do reinado de Deus, sem necessariamente afirmar o começo absoluto de todas as coisas.
- source_word: פֹּעֵל
  choice: realizando
  rationale: O particípio apresenta Deus em ação característica ou contínua. “Realizando” comunica a execução efetiva dos feitos mencionados.
- source_word: יְשׁוּעוֹת
  choice: atos de salvação
  rationale: O plural hebraico pode significar “salvações”, “livramentos” ou “vitórias”. “Atos de salvação” preserva a ideia de feitos salvadores repetidos em português natural.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: A expressão denota o meio ou interior de algo e mantém aqui o sentido espacial e poético.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O hebraico אֶרֶץ pode designar tanto toda a terra como uma terra ou região específica. No texto principal, “a terra” permite a leitura abrangente favorecida pelo contexto.
theological_decisions:
- issue: Alcance dos atos salvadores de Deus
  choice: a terra
  alternative: a terra de Israel / o país
  rationale: אֶרֶץ permanece lexicalmente ambíguo entre o mundo habitado e uma terra específica. O contexto dos grandes feitos e do reinado divino favorece a leitura ampla, mas a alternativa local é preservada em nota.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. O paralelismo foi preservado em duas linhas; evitou-se linguagem excessivamente arcaica.
