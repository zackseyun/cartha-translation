  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: pt
  text: O dia é teu; a noite também é tua. Tu estabeleceste a luz[a] e o sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “luzeiro”. Alguns entendem que o termo se refere à lua por causa do paralelo entre dia e noite, mas o texto hebraico não diz explicitamente “lua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: é teu / é tua
  rationale: A preposição לְ com o sufixo de segunda pessoa masculina singular expressa posse. A construção copulativa em português é natural e mantém a repetição enfática do hebraico.
- source_word: יוֹם
  choice: dia
  rationale: Equivalente comum de יוֹם, aqui em contraste direto com “noite”.
- source_word: אַף
  choice: também
  rationale: 'Acrescenta enfaticamente o segundo elemento: não só o dia, mas também a noite.'
- source_word: לָיְלָה
  choice: noite
  rationale: Equivalente comum de לָיְלָה e contraponto poético de “dia”.
- source_word: אַתָּה
  choice: Tu
  rationale: O pronome explícito foi preservado para reproduzir a ênfase do texto hebraico antes do verbo.
- source_word: הֲכִינוֹתָ
  choice: estabeleceste
  rationale: O hifil de כון comunica a ideia de pôr em ordem, firmar ou estabelecer. “Estabeleceste” se ajusta ao contexto da ordenação cósmica.
- source_word: מָאוֹר
  choice: luz
  rationale: מָאוֹר pode designar luz ou um corpo que emite luz. Como “sol” vem em seguida como elemento distinto, “luz” evita uma redundância pouco natural sem transformar por inferência o termo em “lua”.
- source_word: וָשָׁמֶשׁ
  choice: e o sol
  rationale: Tradução direta da conjunção seguida do substantivo; o artigo torna a expressão natural em português.
theological_decisions:
- issue: Sentido de מָאוֹר em relação a שֶׁמֶשׁ
  choice: Traduzir מָאוֹר como “luz”, distinguindo-o de “o sol”.
  alternative: Traduzir como “luzeiro” ou, por inferência do paralelismo entre dia e noite, como “lua”.
  rationale: O hebraico diz “luz/luzeiro e sol” e não menciona explicitamente a lua. “Luz” preserva a amplitude lexical e a imagem poética sem resolver além do texto a identidade do primeiro elemento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição possessiva e o pronome “Tu” preservam a ênfase poética do hebraico.
