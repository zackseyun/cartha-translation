  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: pt
  text: Dirige os teus passos às ruínas perpétuas[a]; o inimigo devastou tudo no santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ergue os teus passos para as desolações duradouras”. O hebraico conserva a imagem vívida de Deus avançando para o santuário em ruínas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִימָה
  choice: Ergue
  rationale: Imperativo dirigido a Deus. “Ergue” conserva a imagem concreta e poética do hebraico, sem reduzi-la à paráfrase interpretativa “vem”.
- source_word: פְעָמֶיךָ
  choice: os teus passos
  rationale: O substantivo pode indicar passos ou pés. “Os teus passos” mantém a imagem antropomórfica de Deus avançando até o lugar devastado.
- source_word: לְמַשֻּׁאוֹת
  choice: rumo às ruínas
  rationale: A expressão designa lugares ou resultados de devastação. “Rumo às ruínas” é natural em português e comunica movimento em direção ao santuário destruído.
- source_word: נֶצַח
  choice: perpétuas
  rationale: Aqui caracteriza as ruínas como persistentes ou duradouras. “Perpétuas” preserva a força temporal e a intensidade poética do lamento.
- source_word: כָּל
  choice: tudo
  rationale: Expressa de modo abrangente a extensão da destruição causada pelo inimigo.
- source_word: הֵרַע
  choice: devastou
  rationale: O hifil de רעע pode significar causar dano, arruinar ou devastar. No contexto da destruição do templo, “devastou” comunica adequadamente a gravidade.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: O singular representa o adversário de Israel de maneira coletiva ou representativa.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: קֹדֶשׁ refere-se aqui ao recinto sagrado, provavelmente o santuário do templo; “santuário” conserva o sentido cultual.
theological_decisions:
- issue: Apelo antropomórfico a Deus no imperativo inicial
  choice: Conservar a imagem concreta em “Ergue os teus passos”
  alternative: “Vem” ou “Avança”
  rationale: O salmista descreve poeticamente Deus encaminhando-se ao santuário arruinado. A formulação mantém essa tensão e vivacidade sem acrescentar ideias de rapidez ou de inspeção que não estão explícitas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com dicção poética deliberada em “Ergue os teus passos”. “Rumo às” evita uma construção excessivamente rígida, preservando o movimento indicado pela preposição hebraica.
