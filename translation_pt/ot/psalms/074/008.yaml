base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: pt
  text: 'Disseram em seus corações: “Vamos destruí-los todos de uma vez!”[a] Queimaram todos os lugares de encontro de Deus na terra.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico נִינָם é difícil. Também pode ter o sentido de “Vamos oprimi-los” ou “Vamos subjugá-los”, ou expressar de outra maneira uma intenção destrutiva.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os lugares determinados por Deus”. Tradicionalmente, algumas versões trazem “todas as sinagogas de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ בְלִבָּם
  choice: Disseram no coração
  rationale: Preserva a imagem hebraica da fala interior e expressa a intenção íntima dos inimigos em português natural e digno.
- source_word: נִינָם יָחַד
  choice: Vamos destruí-los todos de uma vez
  rationale: A forma נִינָם é lexicalmente difícil. Pelo contexto, comunica intenção hostil e destrutiva; יָחַד acrescenta a ideia de totalidade conjunta. A nota mantém explícita a incerteza.
- source_word: שָׂרְפוּ
  choice: Queimaram
  rationale: Tradução direta do qal perfeito, adequada à sequência narrativa poética.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: todos os lugares de encontro de Deus
  rationale: Embora מוֹעֵד possa designar tempo marcado, festa ou lugar de reunião, o verbo 'queimar' e a expressão locativa favorecem aqui lugares físicos de reunião, sem introduzir anacronicamente 'sinagogas'.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto, refere-se naturalmente à terra de Israel; a formulação preserva a concisão e a possível amplitude do hebraico.
theological_decisions:
- issue: Sentido da forma difícil נִינָם
  choice: 'expressão de intenção destrutiva: “Vamos destruí-los”'
  alternative: “Vamos oprimi-los”, “Vamos subjugá-los” ou uma análise nominal com sintaxe diferente
  rationale: O contexto do salmo favorece uma ameaça de destruição total, mas a forma hebraica permanece incerta; por isso, a tradução contextual é acompanhada de nota.
- issue: Sentido de מוֹעֲדֵי אֵל
  choice: lugares físicos de encontro dedicados a Deus
  alternative: tempos/festas determinados por Deus; assembleias de Deus; sinagogas de Deus
  rationale: Como esses מוֹעֲדִים são queimados e estão 'na terra', o sentido espacial é o mais provável. 'Lugares de encontro' evita especificar uma instituição posterior e preserva a relação com a reunião cultual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém a imagem semítica do coração e registra em notas as duas ambiguidades lexicais relevantes.
