  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: pt
  text: Teus adversários rugiram no meio do teu lugar de encontro[a]; puseram seus próprios sinais como sinais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio do teu lugar designado” ou “dentro do teu lugar de reunião”. O hebraico também pode se referir a um tempo determinado, a uma assembleia ou a uma festividade; aqui, o contexto favorece um lugar sagrado de encontro.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete “sinais”: literalmente, “puseram os seus sinais como sinais”. Talvez se refira a emblemas ou estandartes instalados como marcas de domínio ou triunfo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: rugiram
  rationale: Preserva a imagem ameaçadora do rugido de um animal e a intensidade do verbo hebraico, em vez do mais neutro “gritaram”.
- source_word: צֹרְרֶיךָ
  choice: teus adversários
  rationale: Expressa opositores hostis e se ajusta ao contexto de profanação do espaço sagrado.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Conserva o sentido espacial de interior ou centro do lugar.
- source_word: מוֹעֲדֶךָ
  choice: teu lugar de encontro
  rationale: No contexto, o sentido espacial e cultual é o mais provável. A formulação evita restringir o termo a uma construção específica, embora não explicite em português a nuance de algo designado ou marcado.
- source_word: שָׂמוּ
  choice: ali fincaram
  rationale: No contexto de sinais hostis instalados como marcas de domínio ou triunfo, “fincaram” comunica uma colocação pública e deliberada. “Ali” torna natural em português a ligação com o local mencionado na primeira oração.
- source_word: אוֹתֹתָם אֹתוֹת
  choice: seus próprios sinais como sinais
  rationale: Mantém a repetição enfática do substantivo hebraico e torna explícita a posse marcada pelo sufixo. A estranheza deliberada preserva a construção concisa e ambígua do original.
theological_decisions:
- issue: Sentido de מוֹעֵד no lamento sobre a profanação
  choice: 'sentido espacial e cultual: “lugar de encontro”'
  alternative: tempo determinado, assembleia ou festividade
  rationale: O contexto imediato descreve inimigos dentro de um espaço sagrado. Ainda assim, a nota conserva a amplitude semântica do hebraico, sem identificar dogmaticamente uma estrutura específica.
- issue: Função dos sinais inimigos
  choice: preservar “seus próprios sinais como sinais”
  alternative: interpretar como estandartes, emblemas de vitória ou marcas de posse
  rationale: O hebraico repete “sinais” sem declarar de modo inequívoco a função deles; a tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes com o registro poético dos Salmos. A ordem e a repetição hebraicas foram preservadas quando comunicativamente viáveis; notas registram as ambiguidades lexicais relevantes.
