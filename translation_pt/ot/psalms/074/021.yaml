source:
  edition: WLC
  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: pt
  text: Não deixes que o oprimido[a] volte humilhado[b]; que o pobre e o necessitado louvem o teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o esmagado”, “o abatido”.
    reason: lexical_alternative
  - marker: b
    text: Ou “envergonhado”, “desonrado”. O hebraico pode incluir a ideia de humilhação pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: Não deixes que ... volte
  rationale: A partícula negativa com a forma verbal expressa uma súplica. Esta construção preserva tanto o pedido dirigido a Deus quanto o sentido básico de שוב, “voltar”.
- source_word: דַּךְ
  choice: o oprimido
  rationale: O termo designa alguém esmagado, abatido ou oprimido. “O oprimido” comunica com naturalidade sua condição social e existencial, enquanto a nota preserva alternativas mais literais.
- source_word: נִכְלָם
  choice: humilhado
  rationale: O particípio passivo de כלם pode indicar vergonha, desonra ou humilhação pública. “Humilhado” expressa bem o caráter sofrido e potencialmente público da condição.
- source_word: עָנִי
  choice: o pobre
  rationale: Embora possa significar também “afligido” ou “humilde”, a associação com אֶבְיוֹן põe em primeiro plano a vulnerabilidade material e social.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Preserva a distinção em relação a עָנִי e reproduz em português a dupla hebraica tradicional referente a pessoas vulneráveis.
- source_word: יְהַלְלוּ
  choice: que ... louvem
  rationale: A forma verbal tem força volitiva no contexto da oração. “Que ... louvem” é uma formulação natural e digna para a petição.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: Mantém a expressão hebraica teologicamente significativa, que remete ao caráter e à reputação revelados de Deus sem os reduzir a uma paráfrase.
theological_decisions:
- issue: Relação da última oração com o pedido anterior
  choice: 'Manter duas petições coordenadas: que o oprimido não volte humilhado e que o pobre e o necessitado louvem o nome de Deus.'
  alternative: Explicitar que o louvor é resultado direto do livramento concedido por Deus.
  rationale: A sequência de formas volitivas permite entender o louvor como resultado esperado do socorro, mas não formula explicitamente uma relação causal. A tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes na oração dirigida a Deus. A sintaxe mantém o paralelismo hebraico sem soar artificial.
