  text: Tu abriste fonte e ribeiro; tu secaste rios perenes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּקַעְתָּ (bāqaʿtā)
  choice: abriste
  rationale: O verbo descreve abrir ou fender. Com fontes e cursos de água como objetos, “abriste” conserva a imagem de fazer surgir uma passagem sem produzir em português a expressão pouco natural “fendeste fontes”.
- source_word: מַעְיָן (maʿyān)
  choice: fontes
  rationale: Designa uma nascente ou fonte. O plural português expressa naturalmente o valor coletivo do singular hebraico neste paralelismo poético.
- source_word: נַחַל (naḥal)
  choice: torrentes
  rationale: Pode indicar um vale de corrente sazonal ou a própria corrente. “Torrentes” é claro em português, preserva a força poética do termo e evita o estrangeirismo “uádis”.
- source_word: נַהֲרוֹת אֵיתָן (nahărôt ʾêtān)
  choice: rios perenes
  rationale: A combinação refere-se a rios de fluxo constante ou duradouro. “Perenes” comunica de modo conciso que não eram cursos temporários.
theological_decisions:
- issue: Relação da imagem com atos divinos de criação ou êxodo
  choice: Manter a formulação poética sem identificar um episódio específico
  alternative: Explicitar uma alusão à criação, ao êxodo ou à travessia do Jordão
  rationale: O versículo pode evocar mais de um ato divino sobre as águas; a tradução não deve resolver uma referência que o texto hebraico deixa aberta.
translation_notes:
  register: Linguagem poética, clara e digna, com paralelismo preservado. O pronome “Tu” mantém a invocação direta a Deus e é amplamente compreensível em português.
