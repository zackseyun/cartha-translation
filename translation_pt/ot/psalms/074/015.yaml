review_pass:
  verdict: revise
  source_fidelity: O hebraico emprega os singulares genéricos “fonte” e “ribeiro/corrente” (מַעְיָן וָנָחַל), seguidos de “rios perenes” (נַהֲרוֹת אֵיתָן). “Torrentes” pode designar cursos impetuosos e não reproduz com precisão suficiente o sentido mais amplo de naḥal, que pode ser uma corrente ou leito sazonal.
  naturalness: “Tu abriste fonte e ribeiro; tu secaste rios perenes” é poético, claro e natural em português moderno. A repetição de “tu” preserva o paralelismo enfático do hebraico.
  terminology: “Fonte” e “ribeiro” são equivalentes portugueses idiomáticos para os termos hídricos hebraicos sem introduzir o tecnicismo “uádi”. “Perenes” transmite adequadamente o caráter duradouro/constante de איתן.
  issues:
