    issue: “Torrentes” para נַחַל
    rationale: “Torrente” tende a sugerir uma corrente violenta ou impetuosa; o hebraico naḥal é mais abrangente, podendo referir-se a um ribeiro, curso de água ou leito sazonal. “Ribeiro” preserva melhor a imagem sem estreitar o sentido.
  - severity: low
    issue: Plural “fontes” e “torrentes”
    rationale: Os substantivos hebraicos estão no singular, provavelmente com valor genérico. Manter o singular conserva mais de perto a forma e o paralelismo do original, sem prejudicar a naturalidade portuguesa.
  revised_text: Tu abriste fonte e ribeiro; tu secaste rios perenes.
