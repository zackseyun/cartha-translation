  text: אַל תִּתֵּ֣ן לְ֭/חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑/ךָ חַיַּ֥ת עֲ֝נִיֶּ֗י/ךָ אַל תִּשְׁכַּ֥ח לָ/נֶֽצַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: pt
  text: Não entregues tua pomba[a] à fera; não te esqueças para sempre da vida dos teus aflitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a vida da tua pomba”. O termo traduzido por “pomba” designa mais especificamente uma rola.
    reason: Preserva a presença de נֶפֶשׁ (“vida”) e a especificidade zoológica de תּוֹר, sem tornar o texto principal pouco natural ou sujeito a uma associação vulgar no português brasileiro.
lexical_decisions:
- source_word: תּוֹרֶךָ (torecha)
  choice: tua pomba
  rationale: O termo designa mais especificamente uma rola, mas “pomba” é natural, claro e digno no português internacional, evitando uma associação vulgar possível no uso brasileiro de “rola”.
- source_word: לְחַיַּת (lechayyat)
  choice: à fera
  rationale: A forma vocalizada pelo texto massorético significa “animal” ou “fera”. “Fera” comunica de modo conciso a ameaça de um animal selvagem, sem acrescentar explicitamente um adjetivo ausente do hebraico.
- source_word: חַיַּת עֲנִיֶּיךָ (chayyat aniyyecha)
  choice: da vida dos teus aflitos
  rationale: Neste segundo uso, a mesma forma consonantal é vocalizada no sentido de “vida”. O plural “dos teus aflitos” representa o coletivo plural hebraico com clareza em português.
- source_word: לָנֶצַח (lanetsach)
  choice: para sempre
  rationale: Equivalente corrente e direto para a duração indefinida ou perpétua expressa pelo hebraico.
theological_decisions:
- issue: Identidade figurada da pomba
  choice: Preservar a imagem sem identificar explicitamente a pomba com Israel ou com outra comunidade.
  alternative: Explicitar “teu povo” no corpo do versículo.
  rationale: O hebraico emprega a metáfora e deixa sua referência implícita; a tradução mantém essa abertura interpretativa.
- issue: Relação entre “vida” e “pomba” na primeira oração
  choice: Traduzir idiomaticamente “Não entregues tua pomba”, registrando a formulação literal em nota.
  alternative: “Não entregues à fera a vida da tua pomba.”
  rationale: נֶפֶשׁ pode marcar a própria criatura viva, e a formulação direta soa mais natural em português; a nota conserva a estrutura e a nuance do original.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa coerentes com o registro poético dos Salmos. A repetição semântica de “vida” é mantida na segunda oração, enquanto a primeira é vertida de maneira idiomática e esclarecida em nota.
