base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: pt
  text: Puseram fogo no teu santuário[a]; profanaram, lançando por terra, a morada do teu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Enviaram fogo ao teu santuário”. A expressão hebraica significa que o incendiaram.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a morada do teu nome”. É uma maneira de falar do lugar escolhido por Deus para tornar conhecida a sua presença.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: Puseram fogo
  rationale: A expressão hebraica, literalmente próxima de “enviaram com/no fogo”, descreve o ato de incendiar. “Puseram fogo” comunica isso de modo natural e atual em português.
- source_word: מִקְדָּשֶׁךָ
  choice: no teu santuário
  rationale: “Santuário” preserva o sentido de lugar santo sem restringir indevidamente o termo a uma designação arquitetônica mais específica.
- source_word: לָאָרֶץ
  choice: até o chão
  rationale: A expressão indica a extensão extrema da profanação e possivelmente se liga à ideia de arrasar o lugar; “até o chão” mantém a imagem concreta e a ambiguidade sintática.
- source_word: חִלְּלוּ
  choice: profanaram
  rationale: O piel de חלל indica tratar como profano aquilo que é santo. “Profanaram” preserva diretamente esse contraste cultual.
- source_word: מִשְׁכַּן
  choice: o lugar onde habita
  rationale: A formulação comunica com clareza a imagem de morada presente no substantivo, evitando “tabernáculo”, que seria técnico e potencialmente enganoso neste contexto.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: Mantém a significativa linguagem veterotestamentária do nome divino, em vez de reduzi-la simplesmente à habitação do próprio Deus.
theological_decisions:
- issue: Relação entre מִקְדָּשׁ e מִשְׁכַּן
  choice: “santuário” e “lugar onde habita”
  alternative: “templo” e “morada”
  rationale: Dois termos distintos preservam o paralelismo e apresentam o local tanto como santo quanto como lugar associado à habitação do nome de Deus.
- issue: Linguagem da habitação do nome divino
  choice: “o lugar onde habita o teu nome”
  alternative: “a morada do teu nome”
  rationale: A opção preserva a ideia de que é o nome de Deus que habita no lugar, sem identificar de maneira simplista Deus com o edifício, e soa mais clara em português corrente.
- issue: Ligação sintática de לָאָרֶץ
  choice: 'Mantida junto à segunda oração: “profanaram até o chão”'
  alternative: Ligá-la semanticamente ao incêndio ou traduzir como destruição explícita
  rationale: A ordem massorética favorece sua ligação com “profanaram”, mas a formulação hebraica é compacta e incomum. A tradução conserva a imagem sem explicitar “arrasaram”, conclusão mais forte do que o verbo por si só exige.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes (“teu”). A redação evita tecnicismo excessivo, preserva a imagem do nome divino que habita no local e mantém, tanto quanto possível, a tensão da expressão “até o chão”.
