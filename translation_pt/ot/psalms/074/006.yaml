  text: E agora despedaçam de uma vez todos os seus entalhes, com machado e martelos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com machado e malhos”. O hebraico menciona ferramentas específicas de corte e percussão, mas a equivalência moderna exata de cada termo é incerta.'
