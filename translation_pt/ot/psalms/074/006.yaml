lexical_decisions:
- source_word: וְעַת
  choice: E agora
  rationale: Mantém a conjunção e a mudança temporal para a cena presente de destruição.
- source_word: פִּתּוּחֶיהָ
  choice: toda a obra entalhada
  rationale: Expressa o sentido coletivo da ornamentação esculpida e preserva o sufixo feminino referente à estrutura mencionada no contexto.
- source_word: יַחַד
  choice: de uma vez
  rationale: Neste contexto, comunica a ação abrangente e conjunta sem criar a ambiguidade sintática de 'junto com' diante dos instrumentos.
- source_word: בְּכַשִּׁיל
  choice: a golpes de machado
  rationale: O termo designa uma ferramenta de corte, provavelmente um machado ou instrumento semelhante; a construção é idiomática em português.
- source_word: וְכֵילַפּוֹת
  choice: e martelos
  rationale: Representa naturalmente o plural de ferramentas de percussão, embora a identificação moderna exata seja incerta.
- source_word: יַהֲלֹמוּן
  choice: despedaçam
  rationale: Transmite a força destrutiva do verbo 'golpear/bater' no contexto da devastação dos entalhes.
