  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: pt
  text: Masquil[a] de Asafe. Por que, ó Deus, nos rejeitaste para sempre? Por que a tua ira fumega contra o rebanho da tua pastagem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Masquil” é um termo técnico usado em títulos de salmos; pode indicar uma composição contemplativa ou instrutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Masquil
  rationale: Mantém transliterado o termo técnico do título, cujo sentido exato é incerto, em vez de fixá-lo como um gênero específico.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A preposição hebraica pode indicar autoria, associação ou pertencimento a uma coleção; a formulação portuguesa preserva essa abertura.
- source_word: זָנַחְתָּ לָנֶצַח
  choice: nos rejeitaste para sempre
  rationale: Reproduz diretamente o lamento e a perspectiva temporal extrema expressa pelo salmista.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: fumega a tua ira
  rationale: Preserva a forte metáfora hebraica da ira que solta fumaça, sem substituí-la por uma expressão mais abstrata.
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: contra o rebanho do teu pasto
  rationale: Conserva a imagem pastoral do texto e entende a preposição como direção hostil no contexto da ira.
theological_decisions:
- issue: Sentido do título מַשְׂכִּיל
  choice: Manter «Masquil» e explicar em nota
  alternative: Traduzir como «poema contemplativo» ou «cântico instrutivo»
  rationale: O termo é técnico e seu significado preciso permanece discutido; a transliteração evita resolver indevidamente a ambiguidade.
- issue: Relação de Asafe com o salmo
  choice: «de Asafe»
  alternative: «composto por Asafe»
  rationale: O hebraico não exige que a expressão seja entendida exclusivamente como atribuição direta de autoria.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A invocação «ó Deus» explicita o vocativo, e a metáfora incomum «fumega a tua ira» foi preservada por sua força poética e fidelidade ao hebraico.
