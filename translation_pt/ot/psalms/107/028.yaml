  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: pt
  text: Então clamaram a Yahweh em sua angústia, e ele os tirou de suas aflições.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de seus apertos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Então clamaram
  rationale: O wayyiqtol faz avançar a sequência narrativa; “então” expressa esse movimento, e “clamaram” comunica um pedido urgente de socorro.
- source_word: אֶל־יְהוָה
  choice: a Yahweh
  rationale: A preposição indica a direção do clamor, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio no texto hebraico.
- source_word: בַּצַּר לָהֶם
  choice: em sua angústia
  rationale: A construção descreve a situação angustiante em que eles se encontravam. A forma singular foi preservada em português natural.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: de suas aflições
  rationale: O substantivo plural מְצוּקוֹת descreve pressões, apertos ou situações aflitivas. “Aflições” mantém o plural e soa natural no registro poético.
- source_word: יוֹצִיאֵם
  choice: ele os tirou
  rationale: O hifil de יצא significa fazer sair ou tirar. O passado acompanha naturalmente a sequência poética em português, preservando a imagem concreta em vez de substituí-la por “livrou”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Valor temporal de יוֹצִיאֵם
  choice: ele os tirou
  alternative: ele os tira
  rationale: Embora a forma hebraica seja yiqtol, o contexto do refrão relata a resposta de Yahweh ao clamor. O passado produz uma sequência natural sem eliminar a força habitual que o padrão repetido do salmo pode sugerir.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Clamaram” conserva a intensidade do pedido, e “tirou” mantém a imagem concreta do hebraico.
