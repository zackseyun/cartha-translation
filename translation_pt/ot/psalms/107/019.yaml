base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/019.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: pt
  text: Então clamaram a Javé[a] na sua aflição; ele os salvou das suas angústias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «YHWH» (o nome divino), tradicionalmente traduzido por «SENHOR»; também transliterado «Iahweh».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Então clamaram
  rationale: O waw consecutivo faz avançar a sequência do refrão, e זעק indica um clamor urgente por socorro; «Então clamaram» é natural e mantém essa intensidade.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa em português o nome divino יהוה, em vez de substituí-lo silenciosamente por um título.
- source_word: בַּצַּר לָהֶם
  choice: na sua aflição
  rationale: A construção exprime a situação aflitiva em que eles se encontravam. O singular coletivo do hebraico é preservado numa formulação idiomática em português.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: das suas angústias
  rationale: Mantém o plural e distingue מְצוּקוֹת do termo anterior צַר, comunicando apertos ou aflições severas em linguagem corrente.
- source_word: יוֹשִׁיעֵם
  choice: ele os salvou
  rationale: O hifil de ישׁע significa salvar ou livrar. «Salvou» é conciso, claro e conserva a ressonância teológica do resgate divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Iahweh
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Javé» preserva o caráter de nome próprio e é uma forma reconhecível em português; a nota registra a substituição tradicional e uma transliteração alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva o paralelismo entre a aflição singular e as angústias plurais, sem tornar os dois termos hebraicos artificialmente idênticos.
