  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֽוּקוֹתֵי/הֶ֗ם יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/006.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: pt
  text: Então clamaram a Yahweh em sua aflição[a], e ele os livrou de suas angústias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu aperto” ou “em sua adversidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Então clamaram
  rationale: O wayyiqtol dá sequência à narrativa; “clamaram” comunica um apelo urgente e mantém um registro bíblico natural em português.
- source_word: אֶל
  choice: a
  rationale: A preposição direcional é expressa de modo idiomático na construção “clamar a”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּצַּר לָהֶם
  choice: em sua aflição
  rationale: צַר designa aqui uma situação de aperto ou aflição. O singular português preserva o singular coletivo hebraico e se refere naturalmente ao grupo.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: de suas angústias
  rationale: “Angústias” preserva o plural hebraico e expressa as diversas pressões ou situações aflitivas das quais foram libertos.
- source_word: יַצִּילֵם
  choice: ele os livrou
  rationale: O hifil de נצל significa livrar ou resgatar. O pretérito acompanha naturalmente a sequência narrativa, e “livrou” mantém dignidade sem soar arcaico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamaram” e “livrou” conservam o tom poético-bíblico sem arcaísmo excessivo; “aflição” e “angústias” refletem a variação lexical e a passagem do singular ao plural no hebraico.
