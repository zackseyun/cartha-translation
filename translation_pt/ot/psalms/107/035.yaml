  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: pt
  text: Ele transforma o deserto numa lagoa e a terra seca em fontes de água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֵׂם
  choice: transforma
  rationale: O verbo שׂים pode significar «pôr», «fazer» ou, neste contexto de mudança de estado, «transformar». A escolha exprime com naturalidade o contraste poético sem ampliar o sentido.
- source_word: מִדְבָּר
  choice: o deserto
  rationale: מִדְבָּר designa uma região desabitada, árida ou desértica. «Deserto» é claro, corrente e combina com o contraste entre terra seca e água abundante.
- source_word: לַאֲגַם מַיִם
  choice: em açude
  rationale: אֲגַם pode designar uma lagoa, charco ou corpo de água represada. «Açude» comunica de modo conciso uma extensão de água acumulada e mantém a imagem poética.
- source_word: וְאֶרֶץ צִיָּה
  choice: e a terra seca
  rationale: A expressão indica terra seca ou ressequida. «Terra seca» é natural, direta e preserva o paralelismo.
- source_word: לְמֹצָאֵי מָיִם
  choice: em fontes de água
  rationale: מוֹצָאֵי מָיִם refere-se aos lugares de onde a água brota, isto é, nascentes ou fontes. «Fontes de água» preserva o plural e a imagem do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético conciso. «Açude» tem ampla legibilidade brasileira; nenhuma nota foi considerada necessária, pois as alternativas lexicais não alteram de modo relevante o sentido do versículo.
