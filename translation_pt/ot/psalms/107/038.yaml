  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: pt
  text: Ele os abençoou, e eles se multiplicaram muito; e não deixou que o gado deles diminuísse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o gado deles não diminuiu”. O verbo hebraico está no singular e pode ser entendido com Deus como sujeito contínuo (“não deixou que...”) ou, pelo sentido, como uma oração de resultado.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Ele os abençoou
  rationale: O piel de ברך com sufixo de terceira pessoa masculina plural indica a concessão de bênção e prosperidade. O sujeito singular, Deus, é mantido pelo contexto do salmo.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: eles se multiplicaram muito
  rationale: רבה descreve aqui aumento numérico, e מְאֹד intensifica esse crescimento. A formulação é natural em português e preserva a relação entre bênção e multiplicação.
- source_word: וּבְהֶמְתָּם
  choice: o gado deles
  rationale: בְּהֵמָה funciona coletivamente para os animais domésticos pertencentes ao povo. “Gado” é corrente e abrangente no português bíblico moderno, sem se restringir apenas a bovinos neste contexto.
- source_word: לֹא יַמְעִיט
  choice: não deixou que ... diminuísse
  rationale: O hifil singular de מעט tem sentido causativo, “reduzir, fazer diminuir”. A redação mantém Deus como sujeito e expressa de modo idiomático sua ação de impedir a diminuição.
theological_decisions:
- issue: Continuidade do sujeito na oração final
  choice: 'Deus continua sendo o sujeito: “não deixou que o gado deles diminuísse”'
  alternative: “e o gado deles não diminuiu”
  rationale: O verbo hebraico está no singular e pode continuar o sujeito divino de “Ele os abençoou”. Essa leitura preserva a ênfase na ação divina, enquanto a nota registra a possibilidade de entender a última oração como resultado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “e” preserva a coordenação do hebraico sem tornar a frase artificial.
