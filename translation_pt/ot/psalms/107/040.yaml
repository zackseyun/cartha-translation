source:
  edition: WLC
  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: pt
  text: Ele derrama desprezo sobre os nobres[a] e os faz andar sem rumo num lugar desolado, onde não há caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «príncipes» ou «líderes». O termo hebraico pode designar nobres, príncipes ou pessoas de posição elevada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «numa desolação, sem caminho». A expressão descreve um lugar ermo onde não há rota nem trilha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: derrama
  rationale: Preserva a metáfora vívida de שׁפך e o aspecto descritivo do particípio, natural em português no presente.
- source_word: בּוּז
  choice: desprezo
  rationale: Expressa o sentido de desdém e humilhação pública e forma uma combinação poética natural com «derrama».
- source_word: נְדִיבִים
  choice: nobres
  rationale: Neste contexto, designa pessoas de posição elevada ou dirigentes. «Nobres» mantém essa amplitude sem especificar indevidamente príncipes hereditários.
- source_word: וַיַּתְעֵם
  choice: os faz andar sem rumo
  rationale: Reproduz o causativo do hifil de תעה e conserva a imagem concreta de perambulação, em vez de sugerir primariamente engano moral.
- source_word: בְּתֹהוּ
  choice: num lugar desolado
  rationale: No contexto espacial, תֹהוּ indica uma região vazia, erma ou desolada. A formulação é clara e natural para leitores modernos.
- source_word: לֹא דָרֶךְ
  choice: onde não há caminho
  rationale: Mantém de perto a expressão hebraica, inclusive sua imagem de ausência de rota, sem comprimi-la em um adjetivo interpretativo.
theological_decisions:
- issue: Sujeito implícito
  choice: «Ele», entendido como Deus
  alternative: Sujeito impessoal ou genérico
  rationale: O contexto literário atribui essas inversões a Deus. O português requer que o sujeito seja explicitado, e «Ele» conserva a referência contextual sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados; «andar sem rumo» comunica de modo natural a ação causativa, e a segunda oração mantém explicitamente a imagem hebraica de um lugar sem caminho.
