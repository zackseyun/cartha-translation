  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: pt
  text: Que deem graças a Yahweh por seu amor leal e por suas maravilhas em favor dos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para os filhos do homem” ou “para os filhos do ser humano”; expressão hebraica comum para os seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Que deem graças
  rationale: O hifil de ידה, neste refrão, expressa agradecimento ou louvor; a construção exortativa com “que” reproduz naturalmente o valor do imperfeito hebraico no contexto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca aquele a quem se dirigem as graças, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e fidelidade duradoura; “amor leal” conserva essa densidade sem restringir o termo exclusivamente à aliança.
- source_word: וְנִפְלְאוֹתָיו
  choice: e por suas maravilhas
  rationale: נִפְלָאוֹת designa atos extraordinários e admiráveis. A repetição de “por” torna explícita em português a relação com a ação de graças.
- source_word: לִבְנֵי אָדָם
  choice: em favor dos seres humanos
  rationale: A expressão idiomática בני אדם refere-se coletivamente à humanidade. “Em favor dos seres humanos” comunica com naturalidade tanto o referente genérico quanto a direção benéfica dos atos divinos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança. “Yahweh” preserva sua função como nome, em vez de substituí-lo por um título.
- issue: Sentido de חסד
  choice: amor leal
  alternative: misericórdia; amor constante; bondade
  rationale: “Amor leal” mantém juntas a afeição e a fidelidade persistente do termo, sem impor uma formulação denominacional.
- issue: Forma da expressão בני אדם
  choice: seres humanos
  alternative: filhos do homem; humanidade
  rationale: Embora literalmente seja “filhos de אדם”, a expressão hebraica é um modo comum de designar os humanos em geral. A tradução evita que uma reprodução formal seja confundida com um grupo exclusivamente masculino ou com um título cristológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo do refrão é preservado, e a nota registra a imagem literal da expressão hebraica.
