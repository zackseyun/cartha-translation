source:
  edition: WLC
  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: pt
  text: Que o digam os redimidos de Yahweh, aqueles que ele redimiu da mão do adversário[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inimigo” ou “opressor”. O substantivo hebraico pode designar um adversário, opressor ou inimigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Que o digam
  rationale: Neste contexto de exortação, o imperfeito tem força volitiva. O pronome “o” retoma naturalmente, em português, a declaração anterior do salmo sem explicitar além do hebraico.
- source_word: גְּאוּלֵי
  choice: os redimidos
  rationale: A forma derivada de גאל designa as pessoas que foram redimidas. “Os redimidos” preserva tanto a ideia de libertação quanto a repetição com o verbo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר
  choice: aqueles que
  rationale: Introduz com clareza a oração relativa que identifica os redimidos, ajustando de modo natural a construção ao português.
- source_word: גְּאָלָם
  choice: ele redimiu
  rationale: O perfeito apresenta a ação divina como realizada. A repetição de “redimiu” preserva a correspondência lexical com “redimidos” no hebraico.
- source_word: מִיַּד
  choice: da mão do
  rationale: Conserva a metáfora hebraica de livramento do poder ou domínio de alguém e permanece compreensível em português.
- source_word: צָר
  choice: adversário
  rationale: O substantivo singular pode designar quem se opõe, oprime ou trata alguém como inimigo. “Adversário” mantém essa amplitude e combina com o registro poético.
theological_decisions:
- issue: Forma do nome divino YHWH
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Sentido da linguagem de גאל
  choice: redimidos / redimiu
  alternative: resgatados / resgatou
  rationale: “Redimir” conserva a repetição do radical hebraico e sua ressonância de libertação por parte de Deus, sem limitar a imagem a uma transação comercial.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A construção “Que o digam” comunica a exortação sem rigidez, enquanto “da mão do adversário” preserva a imagem concreta do hebraico.
