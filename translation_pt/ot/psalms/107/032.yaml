  text: וִֽ֭/ירֹמְמוּ/הוּ בִּ/קְהַל עָ֑ם וּ/בְ/מוֹשַׁ֖ב זְקֵנִ֣ים יְהַלְלֽוּ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: pt
  text: Exaltem-no na assembleia do povo[a] e louvem-no no conselho dos anciãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na congregação do povo”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na sessão dos anciãos”; a expressão indica uma reunião em que os anciãos estavam sentados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Exaltem-no
  rationale: O polel de רומם expressa elevar em honra ou exaltar; a forma exhortativa portuguesa transmite naturalmente o valor volitivo do hebraico.
- source_word: בִּקְהַל עָם
  choice: na assembleia do povo
  rationale: קהל designa uma reunião convocada, e עָם refere-se ao povo reunido; “assembleia” é claro e evita restringir o contexto a uma comunidade eclesiástica.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: e no conselho dos anciãos
  rationale: מוֹשָׁב pode indicar assento ou sessão; com זְקֵנִים, aponta para a reunião deliberativa dos líderes reconhecidos da comunidade.
- source_word: יְהַלְלוּהוּ
  choice: louvem-no
  rationale: O piel de הלל tem aqui o sentido direto e cultualmente apropriado de louvar.
