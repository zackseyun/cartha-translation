  text: Alguns viviam nas trevas e na escuridão profunda[a], prisioneiros na aflição e em ferros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sombra da morte”. Essa é a tradução tradicional de צַלְמָוֶת; provavelmente, o termo se refere de modo mais amplo a trevas profundas ou à escuridão sombria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Alguns viviam
  rationale: O particípio de ישׁב descreve pessoas que permaneciam ou habitavam numa condição. “Alguns viviam” soa natural em português e se ajusta à sequência do salmo, que apresenta diferentes grupos socorridos por Deus.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Tradução direta e poeticamente apropriada para a escuridão literal ou figurada.
- source_word: צַלְמָוֶת
  choice: escuridão profunda
  rationale: O termo provavelmente indica trevas densas ou profunda escuridão. A escolha preserva a força poética sem introduzir explicitamente a morte; a tradução tradicional consta em nota.
- source_word: אֲסִירֵי
  choice: prisioneiros
  rationale: O plural em estado construto designa pessoas presas ou acorrentadas. “Prisioneiros” é claro e combina com a imagem dos ferros.
- source_word: עֳנִי
  choice: aflição
  rationale: O substantivo pode indicar aflição, miséria ou pobreza. Neste contexto de aprisionamento, “aflição” mantém o sentido amplo de sofrimento sem restringi-lo à carência econômica.
- source_word: בַרְזֶל
  choice: ferros
  rationale: Embora o hebraico use o singular “ferro”, trata-se de um uso coletivo ou metonímico para instrumentos de contenção. Em português, “ferros” comunica de modo conciso a ideia de grilhões.
