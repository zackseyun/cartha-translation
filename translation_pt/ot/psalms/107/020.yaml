  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: pt
  text: Enviou a sua palavra e os curou; livrou-os das suas covas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode indicar covas, sepulturas ou situações de destruição e ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Enviou
  rationale: O imperfeito qal, no relato poético das ações do SENHOR, é expresso naturalmente pelo pretérito perfeito em português.
- source_word: דְּבָרוֹ
  choice: a sua palavra
  rationale: Preserva a expressão hebraica concisa e a ideia da fala eficaz de Deus, sem restringi-la a “ordem” ou “mensagem”.
- source_word: וְיִרְפָּאֵם
  choice: e os curou
  rationale: רפא no qal significa diretamente “curar”; o pronome retoma os aflitos mencionados no contexto.
- source_word: וִימַלֵּט
  choice: livrou-os
  rationale: O piel de מלט indica fazer escapar ou livrar; “livrou-os” é claro, conciso e adequado ao registro dos Salmos.
- source_word: מִשְּׁחִיתוֹתָם
  choice: das suas covas
  rationale: A forma plural com sufixo de terceira pessoa masculina plural admite o sentido de “covas” e se ajusta ao contexto de perigo mortal; a nota preserva a amplitude lexical, que também pode apontar para sepulturas ou ruína.
theological_decisions:
- issue: Possível interpretação teológica excessiva de “a sua palavra”
  choice: Manter “a sua palavra” como a fala eficaz de Deus, sem identificar explicitamente um referente pessoal ou messiânico.
  alternative: Traduzir por “a sua ordem” ou entender como referência explícita a uma Palavra personificada.
  rationale: O hebraico afirma que Deus enviou sua palavra para curar e livrar, mas não explicita neste versículo uma identificação cristológica; a tradução preserva sua ressonância sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O semicolon mantém a progressão poética entre cura e livramento, e o plural “covas” reproduz a forma hebraica sem eliminar sua ambiguidade lexical.
