  naturalness: «Semearam campos e plantaram vinhedos» é natural e claro. «Produziram fruto da colheita» mantém uma formulação um pouco concentrada, correspondente ao hebraico, mas é compreensível em registro bíblico moderno. A coordenação sem a vírgula antes de «e» flui melhor.
  terminology: «Campos» e «vinhedos» são escolhas adequadas. «Fruto da colheita» transmite פְּרִי תְבוּאָה sem impor uma interpretação teológica ou reduzir indevidamente o campo semântico de תְבוּאָה. A nota esclarece a construção literal e sua possível leitura como produção/rendimento agrícola.
