  yaml_path: translation/ot/psalms/107/037.yaml
  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: pt
  text: Semearam campos, plantaram vinhedos e produziram fruto da colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “fizeram fruto de produção”. A expressão também pode referir-se ao fruto, produto ou rendimento agrícola.'
    reason: A expressão hebraica פְּרִי תְבוּאָה é compacta; a nota registra sua formulação literal e seu campo semântico sem tornar o texto principal artificial.
lexical_decisions:
- source_word: וַיִּזְרְעוּ
  choice: Semearam
  rationale: O verbo זרע, no qal, é o termo comum para lançar sementes. “Semearam” é a equivalência agrícola direta e natural em português.
- source_word: שָׂדוֹת
  choice: campos
  rationale: O plural de שָׂדֶה designa campos ou terras cultiváveis. “Campos” preserva o sentido amplo e concreto.
- source_word: וַיִּטְּעוּ
  choice: plantaram
  rationale: נטע é empregado para plantar, especialmente árvores e vinhedos. “Plantaram” mantém a ação agrícola concreta.
- source_word: כְרָמִים
  choice: vinhedos
  rationale: O plural de כֶּרֶם refere-se a áreas cultivadas com videiras, não apenas às videiras individuais. “Vinhedos” é claro e corrente no português internacional, com boa legibilidade brasileira.
- source_word: וַיַּעֲשׂוּ
  choice: obtiveram
  rationale: Embora עשה signifique literalmente “fazer”, neste contexto agrícola indica alcançar ou produzir um resultado. “Obtiveram” evita a construção pouco natural “fizeram fruto” sem apagar o papel dos cultivadores.
- source_word: פְּרִי
  choice: o fruto
  rationale: פְּרִי significa “fruto” ou “produto”. O singular coletivo “o fruto” conserva a forma hebraica e expressa o resultado da atividade agrícola.
- source_word: תְבוּאָה
  choice: da colheita
  rationale: תְבוּאָה pode designar produção, rendimento agrícola ou colheita. “Da colheita” forma uma expressão compreensível e mantém a relação genitiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com coordenação simples que acompanha o paralelismo hebraico. Optou-se por “vinhedos”, amplamente inteligível no Brasil e em outras variedades do português. A nota preserva a forma incomum da cláusula final sem tornar o texto principal artificial.
