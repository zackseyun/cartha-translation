  - marker: b
    text: 'Ou: “com cânticos de alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Ofereçam
  rationale: O imperfeito hebraico tem aqui força exortativa. “Ofereçam” soa natural em português e preserva o contexto sacrificial.
- source_word: זִבְחֵי תוֹדָה
  choice: sacrifícios de gratidão
  rationale: A construção designa sacrifícios caracterizados pela gratidão ou ação de graças; esta formulação é clara e próxima do hebraico.
- source_word: וִיסַפְּרוּ
  choice: e contem
  rationale: No piel, ספר significa contar ou relatar. “Contem” comunica de modo simples e natural a proclamação narrativa dos atos de Deus.
- source_word: מַעֲשָׂיו
  choice: os seus feitos
  rationale: O termo se refere aos atos ou obras realizados por Deus. “Feitos” destaca suas ações sem acrescentar interpretação.
- source_word: בְּרִנָּה
  choice: com gritos de alegria
  rationale: רִנָּה pode indicar um clamor jubiloso, por vezes musical. “Gritos de alegria” preserva de forma direta tanto a expressão vocal quanto o júbilo.
