  yaml_path: translation/ot/psalms/107/022.yaml
  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: pt
  text: Ofereçam sacrifícios de gratidão[a] e contem os seus feitos com gritos de alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios de ação de graças”.'
