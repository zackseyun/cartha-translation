  text: כָּל אֹ֭כֶל תְּתַעֵ֣ב נַפְשָׁ֑/ם וַ֝/יַּגִּ֗יעוּ עַד שַׁ֥עֲרֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: pt
  text: A alma deles sentia repulsa por todo alimento[a], e eles se aproximaram das portas da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o apetite deles rejeitava todo alimento”, ou simplesmente “eles rejeitavam todo alimento”. O hebraico traduzido por “a alma deles” (נַפְשָׁם) pode designar a pessoa interior, a vida ou o apetite, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: todo alimento
  rationale: A combinação de כָּל com אֹכֶל tem sentido coletivo e abrangente. “Todo alimento” é natural em português e preserva a totalidade da expressão hebraica.
- source_word: תְּתַעֵב
  choice: sentia repulsa
  rationale: O Piel de תעב expressa forte aversão. “Sentia repulsa” comunica essa intensidade em português atual e se liga naturalmente ao sujeito “a alma deles”.
- source_word: נַפְשָׁם
  choice: a alma deles
  rationale: נֶפֶשׁ pode indicar alma, pessoa, vida ou apetite. A tradução preserva a imagem e a textura antropológica do hebraico, enquanto a nota registra as alternativas contextuais.
- source_word: וַיַּגִּיעוּ עַד
  choice: eles se aproximaram
  rationale: Neste contexto, נגע no Hifil com עַד descreve a chegada até um limite ameaçador. “Se aproximaram” expressa a iminência da morte sem sugerir que já atravessaram suas portas.
- source_word: שַׁעֲרֵי מָוֶת
  choice: as portas da morte
  rationale: Tradução direta da construção hebraica, que apresenta a morte como um domínio com portas, isto é, como um limiar prestes a ser alcançado.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de enfermidade grave
  choice: a alma deles
  alternative: eles; o apetite deles; a vida deles
  rationale: Embora o contexto físico permita entender נֶפֶשׁ como “apetite” ou como referência à pessoa inteira, manter “a alma deles” conserva a formulação hebraica sem reduzir o termo a uma função corporal específica. A nota reconhece a amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com imagem poética preservada. “Sentia repulsa” evita tanto uma formulação arcaica quanto a redução do hebraico a mera falta de apetite; “portas da morte” mantém a metáfora original.
