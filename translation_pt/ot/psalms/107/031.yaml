  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: pt
  text: Que deem graças a Yahweh[b] por seu amor leal e por suas maravilhas para com os seres humanos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do homem”; isto é, à humanidade.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: Que deem graças
  rationale: O hifil imperfeito, com força exortativa neste refrão, é expresso naturalmente em português por “Que deem graças”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da gratidão, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: חַסְדּוֹ
  choice: por seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e fidelidade constante; “amor leal” preserva essa densidade sem restringir o termo a uma formulação técnica.
- source_word: וְנִפְלְאוֹתָיו
  choice: e por suas maravilhas
  rationale: נִפְלָאוֹת designa atos extraordinários que causam admiração. A repetição de “por” torna explícita em português a relação com a ação de graças.
- source_word: לִבְנֵי אָדָם
  choice: em favor dos seres humanos
  rationale: A expressão hebraica, literalmente “aos filhos de אדם”, tem aqui sentido coletivo de humanidade; “em favor dos seres humanos” comunica tanto o referente quanto a direção benéfica das maravilhas.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto principal o nome pessoal divino presente no hebraico; a forma tradicional é indicada em nota.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia
  rationale: “Amor leal” mantém conjuntamente as dimensões de bondade, fidelidade e constância, sem reduzir o termo apenas à compaixão.
- issue: Alcance de בְּנֵי אָדָם
  choice: os seres humanos
  alternative: os filhos do homem
  rationale: A construção masculina hebraica funciona coletivamente e se refere à humanidade; a tradução natural evita sugerir apenas indivíduos do sexo masculino, enquanto a forma literal permanece documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva o paralelismo do refrão e usa uma equivalência ótima, recorrendo a notas para a expressão hebraica literal e para a tradição de representar o nome divino.
