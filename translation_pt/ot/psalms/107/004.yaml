  text: תָּע֣וּ בַ֭/מִּדְבָּר בִּ/ישִׁימ֣וֹן דָּ֑רֶךְ עִ֥יר מ֝וֹשָׁ֗ב לֹ֣א מָצָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: pt
  text: Vagaram pelo deserto, por um caminho desolado[a]; não encontraram cidade onde morar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vagaram pelo deserto, por uma região desolada; não encontraram cidade habitada.”'
    reason: A relação entre יְשִׁימוֹן (“região desolada”) e דֶּרֶךְ (“caminho”) é sintaticamente compacta e pode ser entendida como um caminho desolado ou como uma região desolada pela qual vagavam; עִיר מוֹשָׁב também pode ser vertido por “cidade habitada”.
lexical_decisions:
- source_word: תָּעוּ
  choice: Vagaram
  rationale: O verbo תעה expressa vaguear ou andar sem rumo. “Vagaram” comunica movimento e desorientação sem introduzir necessariamente a ideia de erro moral.
- source_word: בַמִּדְבָּר
  choice: pelo deserto
  rationale: מִדְבָּר designa uma região desértica ou não habitada. “Deserto” é claro, natural e adequado ao cenário do salmo.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: por um caminho desolado
  rationale: יְשִׁימוֹן indica um lugar ermo ou devastado, e דֶּרֶךְ significa caminho, estrada ou rota. A expressão compacta mantém ambos os elementos e produz português natural, embora a relação sintática admita outra leitura, registrada em nota.
- source_word: עִיר מוֹשָׁב
  choice: cidade onde morar
  rationale: A expressão indica uma cidade ou povoação apropriada para habitação. “Cidade onde morar” preserva a busca por um lugar estabelecido sem recorrer a uma construção artificial.
- source_word: לֹא מָצָאוּ
  choice: não encontraram
  rationale: Reproduz de modo direto e natural o perfeito hebraico negado.
