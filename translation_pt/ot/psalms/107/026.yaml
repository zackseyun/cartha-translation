  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: pt
  text: Subiam aos céus e desciam às profundezas; a alma deles se desfazia na aflição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vida deles se desfazia por causa da calamidade”. O termo hebraico נֶפֶשׁ pode significar “alma”, “vida” ou “a própria pessoa”, e רָעָה pode indicar “aflição”, “desgraça” ou “calamidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: Subiam
  rationale: O qal imperfeito de עלה expressa movimento ascendente. O imperfeito português retrata vividamente o movimento repetido provocado pelo mar revolto, sem explicitar um sujeito que o hebraico deixa implícito.
- source_word: שָׁמַיִם
  choice: aos céus
  rationale: “Céus” conserva a forma e a elevação poética do hebraico, sendo natural em português neste contraste vertical.
- source_word: יֵרְדוּ
  choice: desciam
  rationale: Mantém o paralelismo antitético com “subiam” e não acrescenta a ideia mais específica de afundar.
- source_word: תְהוֹמוֹת
  choice: às profundezas
  rationale: O plural designa as regiões profundas ou os vales profundos do mar; “profundezas” é poético, claro e adequado à cena marítima.
- source_word: נַפְשָׁם
  choice: a alma deles
  rationale: נֶפֶשׁ pode designar alma, vida, pessoa ou ser interior. “A alma deles” preserva a imagem hebraica do íntimo humano que perde toda firmeza, sem reduzir o termo apenas a coragem.
- source_word: בְּרָעָה
  choice: na aflição
  rationale: Neste contexto, רָעָה indica sofrimento, perigo ou calamidade, e não mal moral. “Na aflição” comunica naturalmente a angústia causada pela tempestade.
- source_word: תִתְמוֹגָג
  choice: se desfazia
  rationale: A forma verbal de מוג retrata algo que derrete ou perde a consistência. “Se desfazia” conserva a metáfora e soa natural em relação à alma tomada de aflição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poeticamente digno. A omissão do pronome antes de “subiam” preserva a referência implícita do hebraico, enquanto o paralelismo “subiam aos céus / desciam às profundezas” mantém o movimento dramático do verso.
