  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: pt
  text: Pois ele sacia a alma[a] sedenta e enche de coisas boas a alma faminta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pessoa”, “ser” ou “vida”. O termo hebraico néfesh muitas vezes se refere ao ser vivo inteiro, não apenas a uma parte imaterial.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enche a alma faminta com o que é bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor e a gratidão no contexto, preservando a força explicativa do hebraico.
- source_word: הִשְׂבִּיעַ
  choice: sacia
  rationale: O hifil de שבע expressa fazer alguém ficar satisfeito ou plenamente suprido; “sacia” é direto, poético e natural em português.
- source_word: נֶפֶשׁ
  choice: alma
  rationale: Preserva o peso poético do termo hebraico, que aqui pode designar a pessoa inteira em sua necessidade, não apenas uma parte imaterial.
- source_word: שֹׁקֵקָה
  choice: sedenta
  rationale: No contexto de pessoas famintas e sedentas no deserto, expressa concretamente a ânsia por água e mantém o paralelismo com “faminta”.
- source_word: רְעֵבָה
  choice: faminta
  rationale: Representa de modo claro o adjetivo hebraico e forma um paralelo poético natural com “sedenta”.
- source_word: מִלֵּא
  choice: enche
  rationale: Traduz diretamente o piel de מלא e, no presente, apresenta a ação de Deus como verdade geral, em paralelo com “sacia”.
- source_word: טוֹב
  choice: coisas boas
  rationale: No contexto da provisão divina, o singular substantivado hebraico pode indicar aquilo que é bom; “coisas boas” comunica isso de modo natural sem limitar a provisão a um único bem.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: alma
  alternative: pessoa, ser ou vida
  rationale: “Alma” mantém a ressonância poética e teológica do hebraico, enquanto a nota esclarece que נֶפֶשׁ frequentemente se refere ao ser vivo inteiro, evitando impor uma leitura dualista técnica.
- issue: Sentido de טוֹב como provisão divina
  choice: coisas boas
  alternative: o que é bom; o bem
  rationale: A formulação concreta combina com fome e saciedade e comunica a provisão beneficente de Deus, sem excluir a possibilidade de o hebraico ser entendido de modo mais coletivo ou abstrato.
translation_notes:
  register: Português moderno, claro e digno, com ritmo poético e paralelismo entre “alma sedenta” e “alma faminta”. A ordem da segunda oração foi ajustada à sintaxe natural do português sem alterar seu conteúdo.
