  text: Pois ele despedaçou as portas de bronze e cortou as barras de ferro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa do hebraico, apresentando a razão para o chamado à gratidão no contexto anterior.
- source_word: שִׁבַּר
  choice: despedaçou
  rationale: Expressa a ação intensa e decisiva de quebrar, preservando a força da forma verbal hebraica.
- source_word: דַּלְתוֹת
  choice: portas
  rationale: É o sentido lexical direto do substantivo; no contexto, podem ser as portas de uma entrada fortificada.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a designação moderna usual e historicamente adequada para o metal ou liga metálica em vista.
- source_word: בְרִיחֵי
  choice: trancas
  rationale: Designa naturalmente, em português, as barras resistentes usadas para fechar e reforçar portas.
- source_word: בַרְזֶל
  choice: ferro
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: גִּדֵּעַ
  choice: partiu
  rationale: Comunica de modo natural a ruptura violenta das trancas; evita sugerir necessariamente o uso de uma ferramenta cortante, não explicitada no texto.
theological_decisions:
- issue: Referência ao sujeito divino
  choice: ele
  alternative: o SENHOR
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, sem sujeito expresso neste versículo, e retomam o SENHOR no contexto. O pronome preserva o fluxo discursivo e não acrescenta um nome ausente no verso.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Portas de bronze” preserva a imagem lexical hebraica, enquanto “trancas de ferro” soa natural para os elementos que reforçam e fecham essas portas.
