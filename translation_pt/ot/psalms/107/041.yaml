  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: pt
  text: Mas ele põe o necessitado em lugar seguro, longe da aflição, e torna suas famílias como um rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eleva o pobre para longe da miséria”; ou, mais literalmente na última oração: “estabelece famílias como um rebanho”.'
    reason: Registra alternativas lexicais para שׂגב, אֶבְיוֹן e עֹנִי e preserva a concisão da construção hebraica referente a famílias e rebanho.
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: põe ... em lugar seguro
  rationale: O verbo שׂגב combina a ideia de colocar no alto com a de tornar inacessível e protegido. Em português corrente, “põe em lugar seguro” comunica com clareza o efeito protetor sem reduzir o verbo à exaltação honorífica.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: אֶבְיוֹן designa quem vive em necessidade ou pobreza. “O necessitado” preserva essa amplitude e é natural em português moderno.
- source_word: מֵעֹנִי
  choice: longe da aflição
  rationale: עֹנִי pode indicar aflição, miséria ou pobreza; a preposição מִן exprime aqui afastamento. “Longe da aflição” mantém esse sentido separativo e se ajusta ao contexto de livramento do salmo.
- source_word: וַיָּשֶׂם
  choice: faz
  rationale: שׂים é um verbo amplo, “pôr/estabelecer/fazer”. Com a comparação introduzida por כ, “faz” expressa naturalmente o resultado produzido.
- source_word: כַּצֹּאן
  choice: como um rebanho
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras. “Como um rebanho” preserva a imagem pastoral e, no contexto, sugere multiplicação.
- source_word: מִשְׁפָּחוֹת
  choice: suas famílias numerosas
  rationale: O hebraico diz literalmente “famílias”, sem possessivo e sem adjetivo explícito. “Suas” explicita a relação contextual com o necessitado, enquanto “numerosas” torna inteligível a força da comparação com um rebanho; a nota registra a forma mais literal.
theological_decisions:
- issue: Possessivo implícito em “famílias”
  choice: suas famílias
  alternative: famílias
  rationale: Embora o hebraico não tenha sufixo possessivo, o contexto liga naturalmente as famílias ao necessitado. O possessivo torna a frase idiomática sem acrescentar uma afirmação doutrinária.
- issue: Sentido da comparação entre famílias e rebanho
  choice: faz suas famílias numerosas como um rebanho
  alternative: põe famílias como um rebanho
  rationale: A construção hebraica é concisa e admite tradução mais formal. A formulação escolhida explicita a provável ideia contextual de multiplicação, sem eliminar a imagem do rebanho; a nota conserva a alternativa literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por clareza idiomática. A imagem pastoral foi preservada, e a nota mantém a formulação mais literal onde o hebraico é conciso.
