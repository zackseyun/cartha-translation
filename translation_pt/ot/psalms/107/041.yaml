  naturalness: «Põe o necessitado em lugar seguro, longe da aflição» é português moderno e claro. «Torna suas famílias como um rebanho» é uma formulação poética, mas natural e inteligível no registro dos Salmos.
  terminology: «Necessitado», «aflição», «famílias» e «rebanho» correspondem bem aos termos hebraicos. O possessivo «suas» é uma explicitação contextual aceitável, embora não esteja marcado no hebraico.
