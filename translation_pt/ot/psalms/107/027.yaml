  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: pt
  text: Cambaleiam e vacilam como um bêbado, e toda a sua sabedoria é tragada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: toda a sua perícia é tragada. Neste contexto, “sabedoria” pode referir-se ao conhecimento prático, inclusive à habilidade de navegação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחוֹגּוּ
  choice: Cambaleiam
  rationale: No contexto da tempestade no mar, o verbo descreve movimento instável. “Cambaleiam” é vívido e natural, sem impor o sentido mais específico de andar em círculos.
- source_word: וְיָנוּעוּ
  choice: e vacilam
  rationale: O verbo expressa oscilação, tremor ou perda de firmeza. “Vacilam” complementa “cambaleiam” e preserva o paralelismo poético entre dois movimentos instáveis.
- source_word: כַּשִּׁכּוֹר
  choice: como um bêbado
  rationale: Reproduz de modo conciso e corrente a comparação com uma pessoa embriagada, mantendo a imagem de instabilidade física.
- source_word: וְכָל חָכְמָתָם
  choice: e toda a sua sabedoria
  rationale: Mantém o sentido lexical básico de חָכְמָה e a abrangência de כָּל, sem eliminar a possibilidade contextual de se tratar de conhecimento prático ou perícia náutica.
- source_word: תִּתְבַּלָּע
  choice: é tragada
  rationale: Preserva a metáfora concreta de ser engolido ou absorvido e comunica que, diante da tempestade, a capacidade humana deixa de oferecer saída.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. A expressão “é tragada” conserva a imagem hebraica, enquanto a nota preserva a nuance contextual de perícia prática sem estreitar indevidamente o texto à navegação.
