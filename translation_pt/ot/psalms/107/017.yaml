id: PSA.107.17
reference: Psalms 107:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: pt
  text: Os insensatos, por causa[a] de seu caminho de rebeldia[b] e por causa de suas iniquidades[c], foram afligidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente, “de”. Aqui, as preposições hebraicas provavelmente expressam causa: “por causa de”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “transgressão”. A palavra hebraica também pode transmitir a ideia de rebelião.
    reason: lexical_alternative
  - marker: c
    text: Ou “pecados”; o termo hebraico também pode indicar culpa ou as consequências da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: os insensatos
  rationale: Designa pessoas moralmente insensatas, não pessoas com deficiência intelectual. “Insensatos” conserva a categoria moral própria da literatura de sabedoria e soa natural em português.
- source_word: מִדֶּרֶךְ
  choice: por causa de seu caminho
  rationale: A preposição מִן é entendida em sentido causal, e “caminho” preserva a imagem hebraica de um modo ou curso de vida.
- source_word: פִּשְׁעָם
  choice: sua rebeldia
  rationale: פֶּשַׁע frequentemente indica rebelião ou transgressão contra a autoridade legítima. “Rebeldia” comunica esse elemento volitivo e mantém distinção em relação a עָוֹן.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: e por causa de suas iniquidades
  rationale: O segundo מִן também é causal. “Iniquidades” preserva o peso moral do plural עֲוֹנוֹת e sua distinção lexical de פֶּשַׁע.
- source_word: יִתְעַנּוּ
  choice: foram afligidos
  rationale: O Hitpael de ענה descreve a experiência de aflição ou humilhação. O passado se ajusta à apresentação narrativa do grupo no contexto do salmo.
theological_decisions:
- issue: Relação causal entre pecado e sofrimento
  choice: A aflição deste grupo ocorreu por causa de seu caminho de rebeldia e de suas iniquidades.
  alternative: As preposições poderiam ser vertidas mais formalmente por “de”, deixando a relação causal menos explícita.
  rationale: Neste contexto poético, as duas ocorrências de מִן são mais bem entendidas como causais. A tradução afirma a relação no caso descrito pelo versículo sem transformá-la em uma doutrina universal de que todo sofrimento resulta de pecado pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por causa de” reflete as duas construções preposicionais do hebraico; “caminho” mantém a metáfora do modo de vida.
