base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: pt
  text: Então clamaram a Yahweh em sua aflição; ele os salvou de suas angústias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de seus apertos” ou “de suas aflições”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Então clamaram
  rationale: O waw consecutivo faz a narrativa avançar, e זעק expressa um clamor intenso por socorro. “Então” também preserva o refrão recorrente do salmo.
- source_word: אֶל
  choice: a
  rationale: A preposição indica a direção do clamor; em português, “clamar a Yahweh” é natural e mantém essa relação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּצַּר לָהֶם
  choice: em sua aflição
  rationale: A expressão descreve a situação angustiante em que eles se encontravam. O singular coletivo é preservado, e “aflição” soa natural no refrão.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: de suas angústias
  rationale: O substantivo plural denota apertos, situações opressivas ou angústias. “Angústias” preserva o plural e comunica a intensidade sem recorrer a uma expressão pouco natural.
- source_word: יוֹשִׁיעֵם
  choice: ele os salvou
  rationale: O hifil de ישׁע significa salvar ou livrar. “Salvou” é direto, natural e preserva a ligação lexical com a ideia de salvação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Sentido de יוֹשִׁיעֵם
  choice: ele os salvou
  alternative: ele os livrou
  rationale: Ambas as opções são possíveis, mas “salvou” representa de modo direto o verbo ישׁע e não restringe a ação a um tipo específico de libertação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela e concisa do hebraico foi mantida. O marcador da nota foi colocado junto a “angústias”, termo ao qual a alternativa lexical se refere.
