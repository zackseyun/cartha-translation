  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: pt
  text: Que eles deem graças a Yahweh por seu amor leal e por suas maravilhas em favor dos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos filhos dos homens”; também pode ser traduzido como “à humanidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Que eles deem graças
  rationale: O hifil plural de ידה tem aqui força exortativa no refrão do salmo; a formulação preserva essa força e soa natural em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da gratidão, e o nome divino יהוה é transliterado como Yahweh.
- source_word: חַסְדּוֹ
  choice: por seu amor leal
  rationale: חסד expressa amor, bondade e fidelidade constantes; “amor leal” preserva de modo conciso essa combinação sem restringi-la exclusivamente à ideia de misericórdia.
- source_word: וְנִפְלְאוֹתָיו
  choice: e por suas maravilhas
  rationale: O substantivo derivado de פלא designa atos extraordinários; “maravilhas” é uma expressão natural e tradicional que, no contexto, se refere aos feitos de Yahweh.
- source_word: לִבְנֵי אָדָם
  choice: em favor dos seres humanos
  rationale: Literalmente, “para/aos filhos de אדם”; aqui a expressão designa coletivamente a humanidade como beneficiária dos feitos maravilhosos. “Seres humanos” comunica o sentido representativo sem sugerir apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. A transliteração preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido de חסד
  choice: amor leal
  alternative: misericórdia
  rationale: “Amor leal” mantém juntas as dimensões de bondade, compromisso e constância presentes em חסד, sem impor uma definição denominacional estreita.
- issue: Referente de בני אדם
  choice: seres humanos
  alternative: filhos do homem
  rationale: A locução hebraica é masculina em sua forma, mas coletiva e representativa em sentido. A escolha torna explícita a referência à humanidade, enquanto a nota registra a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura exortativa do refrão foi preservada; “em favor de” explicita naturalmente a relação benefativa de לִבְנֵי אָדָם, e a forma mais literal é mantida em nota.
