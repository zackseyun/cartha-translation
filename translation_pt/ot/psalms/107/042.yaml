base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: pt
  text: Os íntegros veem e se alegram, e toda injustiça fecha a boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e toda iniquidade fecha a sua boca”. O hebraico usa um substantivo feminino singular (“injustiça” ou “iniquidade”) com um sufixo feminino, personificando o mal que fecha a própria boca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: veem
  rationale: O imperfeito qal, em uma afirmação poética de caráter geral, pode ser expresso naturalmente pelo presente em português.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O adjetivo plural substantivado descreve pessoas moralmente retas. “Íntegros” preserva essa nuance sem substituir o termo pelo vocábulo hebraico mais específico normalmente traduzido por “justos”.
- source_word: וְיִשְׂמָחוּ
  choice: e se alegram
  rationale: O presente acompanha o valor geral de “veem” e comunica de modo natural a alegria ativa expressa pelo verbo hebraico.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O substantivo abstrato feminino denota injustiça, perversidade ou iniquidade; “injustiça” preserva a referência abstrata e permite manter sua personificação poética.
- source_word: קָפְצָה פִּיהָ
  choice: fecha a boca
  rationale: A expressão idiomática significa fechar a própria boca, isto é, ficar silenciada. Em português, “fecha a boca” é direto e mantém a imagem personificada.
theological_decisions:
- issue: Personificação da injustiça
  choice: Manter “injustiça” como sujeito abstrato personificado que fecha a boca.
  alternative: Traduzir o sujeito como “os perversos” ou empregar o termo mais teológico “iniquidade”.
  rationale: O hebraico traz um substantivo abstrato feminino, não uma designação explícita de pessoas. Preservar a personificação evita alterar o sujeito e conserva a imagem do mal sendo silenciado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela do hebraico foi preservada, e o presente verbal comunica o caráter geral e conclusivo da declaração poética.
