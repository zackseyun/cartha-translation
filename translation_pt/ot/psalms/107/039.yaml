  yaml_path: translation/ot/psalms/107/039.yaml
  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: pt
  text: Então se tornaram poucos e foram abatidos pela opressão[a], pela calamidade e pela tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então se tornaram poucos e se encurvaram por causa da restrição, do mal e da aflição.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: diminuíram
  rationale: O qal wayyiqtol plural de מעט indica que se tornaram poucos ou foram reduzidos. “Diminuíram” mantém a concisão poética e deixa em aberto se a redução é numérica ou de condição.
- source_word: וַיָּשֹׁחוּ
  choice: foram abatidos
  rationale: O verbo שחח/שׁחח comunica ser encurvado ou rebaixado. “Foram abatidos” é natural em português e abrange humilhação e aflição sem limitar a expressão a uma postura física.
- source_word: מֵעֹצֶר
  choice: pela opressão
  rationale: עֹצֶר pode designar restrição, pressão aflitiva ou opressão; a preposição מִן tem aqui sentido causal. “Pela opressão” expressa de modo claro essa força constrangedora.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto, רָעָה aponta para adversidade ou desgraça, não necessariamente para mal moral. “Calamidade” comunica a gravidade da situação.
- source_word: וְיָגוֹן
  choice: e pela tristeza
  rationale: יָגוֹן designa pesar, tristeza ou aflição emocional. “Tristeza” é claro, digno e acessível.
theological_decisions: []
