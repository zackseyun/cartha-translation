  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: pt
  text: Que deem graças a Yahweh por seu amor leal e por seus feitos maravilhosos em favor dos seres humanos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do homem”, expressão hebraica genérica para os seres humanos.
    reason: lexical_alternative
  - marker: b
    text: Ou “por suas maravilhas” ou “por suas obras maravilhosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Que deem graças
  rationale: O hifil de ידה, neste refrão do salmo, expressa a resposta agradecida e pública à libertação realizada por Deus. A construção exortativa portuguesa preserva o valor volitivo da forma hebraica.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da ação de graças, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: חַסְדּוֹ
  choice: por seu amor leal
  rationale: חסד reúne as ideias de amor, bondade e lealdade duradoura. “Amor leal” conserva essa combinação sem restringir o termo apenas a misericórdia.
- source_word: וְנִפְלְאוֹתָיו
  choice: e pelos feitos maravilhosos que realiza
  rationale: נפלאות designa atos extraordinários que despertam admiração. “Feitos maravilhosos” deixa claro que se trata de ações concretas; “que realiza” explicita em português a relação desses feitos com seus beneficiários.
- source_word: לִבְנֵי אָדָם
  choice: em favor dos seres humanos
  rationale: A expressão hebraica literal, “aos filhos do homem”, é uma designação genérica da humanidade. A formulação escolhida comunica naturalmente em português tanto o sentido coletivo quanto a relação beneficente indicada por ל.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido de חסד
  choice: amor leal
  alternative: amor constante; misericórdia; bondade
  rationale: “Amor leal” preserva a combinação de afeto, bondade e fidelidade relacional do termo, sem impor que toda ocorrência seja uma referência técnica e exclusiva à aliança.
- issue: Valor genérico de בני אדם
  choice: seres humanos
  alternative: filhos do homem; humanidade
  rationale: Embora a expressão seja formalmente masculina, ela se refere genericamente às pessoas. A tradução comunica essa abrangência, enquanto a nota registra o idioma hebraico literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e o paralelismo do refrão hebraico foram preservados, enquanto a expressão idiomática בני אדם foi vertida naturalmente e documentada em nota.
