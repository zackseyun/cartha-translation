lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: uma terra fértil
  rationale: A construção hebraica descreve uma região produtiva. “Terra fértil” é natural em português e conserva o sentido agrícola.
- source_word: לִמְלֵחָה
  choice: em terreno salgado
  rationale: O לְ indica o resultado da transformação, e מְלֵחָה designa uma condição salina que implica improdutividade. “Terreno salgado” mantém a imagem concreta sem reduzi-la apenas à ideia abstrata de esterilidade.
- source_word: מֵרָעַת
  choice: por causa da maldade de
  rationale: A preposição מִן tem valor causal neste contexto, e רָעָה expressa maldade ou perversidade moral.
- source_word: יֹשְׁבֵי בָהּ
  choice: dos que nela habitam
  rationale: Preserva a nuance verbal do particípio hebraico e sua relação explícita com a terra.
theological_decisions:
- issue: Causa da desolação da terra
  choice: A transformação da terra fértil em terreno salgado ocorre por causa da maldade de seus habitantes.
  alternative: Tratar a mudança como fenômeno meramente ambiental ou histórico, sem causalidade moral.
  rationale: O hebraico liga explicitamente a reversão à maldade dos habitantes; a tradução conserva essa relação moral e causal sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A formulação mantém o paralelismo fragmentário do contexto e a imagem concreta do sal.
