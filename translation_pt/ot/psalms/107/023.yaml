  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: pt
  text: Os que descem ao mar em navios, trabalhando[a] em vastas águas—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazendo trabalho em muitas águas” ou “comerciando em águas poderosas”. A expressão hebraica pode indicar trabalho, ocupação ou comércio realizado no mar aberto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: os que descem
  rationale: O particípio qal masculino plural funciona como substantivo e descreve uma classe de pessoas; a formulação preserva tanto o aspecto participial quanto a imagem hebraica de descer ao mar.
- source_word: הַיָּם
  choice: ao mar
  rationale: O substantivo com artigo tem aqui sentido marítimo comum, sem indicar necessariamente um mar específico.
- source_word: בָּאֳנִיּוֹת
  choice: em navios
  rationale: A preposição בְּ com o plural de אֳנִיָּה expressa o meio ou âmbito da viagem; “em navios” é natural e mantém a imagem concreta.
- source_word: עֹשֵׂי מְלָאכָה
  choice: fazendo seu trabalho
  rationale: A expressão pode designar trabalho, ocupação ou atividade comercial. “Fazendo seu trabalho” preserva a amplitude lexical sem limitar indevidamente os navegantes ao comércio.
- source_word: בְּמַיִם רַבִּים
  choice: em águas imensas
  rationale: A expressão poética refere-se às vastas águas do mar aberto. “Águas imensas” comunica extensão e força com naturalidade poética em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Conserva a imagem de “descer ao mar” e evita especificar como comércio uma expressão hebraica que também pode significar trabalho ou ocupação.
