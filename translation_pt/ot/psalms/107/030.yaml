source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כִֽי יִשְׁתֹּ֑קוּ וַ֝/יַּנְחֵ֗/ם אֶל מְח֥וֹז חֶפְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/030.yaml
  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: pt
  text: Então eles se alegraram porque as águas se aquietaram[a], e ele os conduziu ao porto que desejavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “elas se aquietaram”; o sujeito não é expresso, mas provavelmente são as ondas ou as águas mencionadas no contexto.'
    reason: lexical_alternative
  - marker: b
    text: Ou “ao lugar de chegada que desejavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Então eles se alegraram
  rationale: O verbo שׂמח expressa alegria. “Então” comunica naturalmente o avanço narrativo do wayyiqtol, e “se alegraram” mantém o tom poético sem soar arcaico.
- source_word: כִּי
  choice: porque
  rationale: Aqui כִּי introduz a causa da alegria. Em português, “porque” exprime essa relação com clareza e naturalidade.
- source_word: יִשְׁתֹּקוּ
  choice: as águas se aquietaram
  rationale: שׁתק significa ficar quieto ou imóvel. O verbo está no plural, sem sujeito expresso; o contexto marítimo, especialmente as ondas do versículo anterior, favorece a explicitação “as águas”. A nota preserva a forma menos explícita do hebraico.
- source_word: וַיַּנְחֵם
  choice: e ele os conduziu
  rationale: נחה significa conduzir ou guiar. O sujeito masculino singular implícito é Deus no contexto, e “conduziu” preserva sua ação pessoal.
- source_word: אֶל מְחוֹז
  choice: ao porto
  rationale: מְחוֹז designa um lugar de chegada, especialmente um porto no presente contexto marítimo. “Porto” é corrente, claro e digno em português.
- source_word: חֶפְצָם
  choice: que desejavam
  rationale: O sufixo plural e o campo semântico de חפץ indicam o destino desejado por eles. A oração relativa é mais natural em português do que “seu porto desejado” e conserva a ideia de anseio realizado.
theological_decisions:
- issue: Sujeito divino implícito de וַיַּנְחֵם
  choice: “ele”, referindo-se a Deus no contexto
  alternative: 'Construção impessoal: “foram conduzidos”'
  rationale: O hebraico emprega um verbo na terceira pessoa masculina singular cujo sujeito é retomado do contexto, no qual o SENHOR age em resposta ao clamor dos navegantes. Manter “ele” preserva essa agência pessoal sem acrescentar uma identificação nominal ausente do versículo.
- issue: Sujeito não expresso de יִשְׁתֹּקוּ
  choice: Explicitação contextual como “as águas”
  alternative: “elas se aquietaram” ou “tudo se acalmou”
  rationale: A forma verbal plural permite retomar as ondas ou águas do contexto imediato. A explicitação torna o versículo inteligível isoladamente, enquanto a nota registra que o substantivo não está expresso no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Porto” mantém o cenário marítimo; a oração “que desejavam” evita uma formulação rígida e conserva o sentido de חֶפְצָם.
