  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: pt
  text: Pois ele falou e fez surgir um vento de tempestade[a], que levantou as ondas do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou e levantou um vento de tempestade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ele falou
  rationale: אמר significa normalmente “dizer/falar”. “Falou” preserva a ação eficaz da palavra divina no contexto sem explicitar além do hebraico a ideia de uma ordem.
- source_word: וַיַּעֲמֵד
  choice: fez surgir
  rationale: O hifil de עמד tem força causativa. “Fez surgir” comunica naturalmente em português que ele causou o aparecimento do vento, evitando o literalismo pouco idiomático “fez ficar de pé”.
- source_word: רוּחַ סְעָרָה
  choice: um vento de tempestade
  rationale: A expressão designa um vento caracterizado pela tempestade. A escolha conserva o elemento explícito “vento” e soa clara e digna em português moderno.
- source_word: וַתְּרוֹמֵם
  choice: que levantou
  rationale: A forma feminina singular concorda com רוּחַ, de modo que o vento é o sujeito da ação. “Levantou” expressa de maneira natural o altear das ondas.
- source_word: גַּלָּיו
  choice: as ondas do mar
  rationale: O sufixo masculino singular remete mais naturalmente ao mar, presente no contexto imediato. Como “suas ondas” poderia parecer referir-se ao vento em português, “as ondas do mar” torna a referência clara sem mudar a imagem.
theological_decisions:
- issue: Sujeito divino implícito
  choice: “ele”, referindo-se a Deus no contexto
  alternative: Uma formulação impessoal
  rationale: As formas verbais e o fluxo do salmo apresentam o SENHOR como agente. O pronome preserva essa continuidade sem acrescentar uma identificação que o versículo hebraico não repete nominalmente.
- issue: Relação entre a palavra divina e a tempestade
  choice: “falou e fez surgir”
  alternative: “ordenou”
  rationale: “Ordenou” tornaria explícita uma nuance possível no contexto, mas não lexicalmente necessária em אמר. A tradução mantém a ação soberana de Deus e a formulação mais aberta do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A redação evita “suscitou”, mais formal, e esclarece o referente das ondas sem perder a concisão poética.
