  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: pt
  text: Eles viram as obras de Yahweh e as suas maravilhas nas profundezas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no profundo». O termo hebraico se refere às águas profundas, o que se ajusta ao contexto marítimo do salmo.'
    reason: Alternativa lexical; esclarece o sentido aquático sem inserir «mar» no texto principal.
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome independente de terceira pessoa do plural dá destaque aos marinheiros; em português, o sujeito explícito «Eles» preserva essa ênfase de modo natural.
- source_word: רָאוּ
  choice: viram
  rationale: O qal perfeito descreve a experiência passada dos navegantes no relato poético.
- source_word: מַעֲשֵׂי
  choice: as obras
  rationale: Mantém o sentido amplo das ações realizadas por Deus e forma um paralelismo natural com «maravilhas».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְנִפְלְאוֹתָיו
  choice: e as suas maravilhas
  rationale: Preserva tanto o sentido de feitos extraordinários e assombrosos quanto o sufixo possessivo de terceira pessoa.
- source_word: בִּמְצוּלָה
  choice: nas profundezas do mar
  rationale: O substantivo designa águas profundas ou profundezas marítimas; a explicitação «do mar» é natural e se ajusta ao contexto imediato dos navegantes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e explicita o referente marítimo já presente no contexto, sem acrescentar interpretação teológica.
