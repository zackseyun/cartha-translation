  text: He led them by a straight way to go to a city to dwell in[a].
translation:
  language: pt
  text: 'Ele os guiou por um caminho reto,

    para irem a uma cidade onde morar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “para irem a uma cidade de habitação”.'
