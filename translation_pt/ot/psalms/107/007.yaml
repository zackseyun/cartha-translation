lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Ele os guiou
  rationale: O hifil de דרך significa conduzir ou guiar por um caminho. “Guiou” expressa com naturalidade a ação orientadora no contexto.
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: por um caminho reto
  rationale: דֶּרֶךְ designa caminho, estrada ou rota, e יָשָׁר significa reto ou direito. No contexto de viajantes perdidos, a expressão descreve uma rota direta e correta.
- source_word: לָלֶכֶת אֶל
  choice: para chegarem a
  rationale: O infinitivo לָלֶכֶת indica propósito, literalmente “para ir”. Em português, “para chegarem a” torna explícito o destino pretendido sem alterar o sentido contextual.
- source_word: עִיר מוֹשָׁב
  choice: uma cidade onde pudessem morar
  rationale: A construção nominal significa literalmente “cidade de habitação”. A formulação escolhida é natural em português e preserva a ideia de um lugar adequado para residência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem poética em duas linhas. A tradução mantém a imagem concreta do caminho reto e apresenta a construção hebraica final de modo idiomático, registrando a forma mais literal em nota.
