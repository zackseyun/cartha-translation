  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: pt
  text: Ali, ele fez os famintos se estabelecerem, e eles estabeleceram uma cidade para morarem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: fez ... morar
  rationale: 'O hifil de ישׁב expressa causação: fazer alguém morar ou estabelecer-se. A formulação é natural em português e conserva esse valor causativo.'
- source_word: שָׁם
  choice: Ali
  rationale: Equivalente direto e idiomático do advérbio de lugar, retomando o local mencionado no contexto.
- source_word: רְעֵבִים
  choice: os famintos
  rationale: O adjetivo substantivado designa coletivamente pessoas que sofriam fome; “os famintos” é conciso e digno.
- source_word: וַיְכוֹנְנוּ
  choice: estabeleceram
  rationale: O verbo כון nesta forma comunica preparar, firmar ou estabelecer; aplicado a uma cidade, “estabeleceram” preserva a amplitude sem especificar demais o ato de fundação.
- source_word: עִיר
  choice: uma cidade
  rationale: É o sentido comum do substantivo hebraico e mantém o uso bíblico, sem reduzi-lo a “aldeia” ou ao genérico “povoado”.
- source_word: מוֹשָׁב
  choice: para habitar
  rationale: O substantivo indica habitação ou lugar de moradia. Na construção עִיר מוֹשָׁב, “uma cidade para habitar” comunica naturalmente a finalidade ou função da cidade.
theological_decisions:
- issue: Sujeito implícito do verbo singular וַיּוֹשֶׁב
  choice: O sujeito é Deus, retomado do contexto e representado pelo pronome “ele”.
  alternative: 'Um sujeito impessoal ou não especificado: “alguém fez morar”.'
  rationale: Os versículos ao redor narram as ações do SENHOR, de modo que o verbo singular continua naturalmente esse sujeito. Mantém-se, porém, o estilo pronominal do hebraico, sem inserir aqui um título divino explícito.
translation_notes:
  register: 'Português atual, claro e digno, com legibilidade brasileira e alcance internacional. A ordem da frase acompanha de perto o hebraico sem produzir construção artificial. Não se acrescentou nota porque a alternativa inglesa indicada para מוֹשָׁב parece estar desalinhada com o texto principal: ambas expressam a ideia de uma cidade destinada à habitação.'
