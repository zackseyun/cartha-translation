  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: pt
  text: Assim, ele humilhou o coração deles com trabalho penoso[a]; eles tropeçaram[b], e não havia quem os ajudasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por meio da fadiga» ou «com sofrimento»; o termo hebraico pode indicar trabalho penoso, fadiga, aflição ou miséria.
    reason: lexical_alternative
  - marker: b
    text: Ou «caíram»; o verbo pode indicar tanto tropeço quanto queda ou colapso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: ele humilhou
  rationale: O hifil de כנע expressa ação causativa. O sujeito implícito é Deus, conforme o contexto, e «humilhou» preserva essa ação sem explicitar novamente o nome divino.
- source_word: בֶּעָמָל
  choice: com trabalho penoso
  rationale: עָמָל pode indicar trabalho árduo, fadiga, sofrimento ou aflição. «Trabalho penoso» é natural em português e se ajusta ao contexto de prisão e opressão, sem eliminar as demais nuances.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém o singular coletivo hebraico e comunica o íntimo, o ânimo ou a disposição interior do grupo.
- source_word: כָּשְׁלוּ
  choice: eles tropeçaram
  rationale: כשל descreve tropeçar ou cambalear, podendo chegar à queda. «Tropeçaram» conserva a imagem sem tornar explícito um resultado mais forte.
- source_word: וְאֵין עֹזֵר
  choice: e não havia quem os ajudasse
  rationale: Formulação corrente e clara que preserva a construção existencial e a ausência total de auxílio.
theological_decisions:
- issue: Sujeito implícito de וַיַּכְנַע
  choice: 'Deus como sujeito implícito: «ele humilhou»'
  alternative: 'Construção impessoal: «o coração deles foi humilhado»'
  rationale: O contexto atribui ao SENHOR tanto a disciplina quanto o livramento. A forma ativa com sujeito pronominal implícito preserva essa conexão sem inserir «o SENHOR» onde não aparece no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase permanece próxima do hebraico, enquanto «não havia quem os ajudasse» oferece naturalidade idiomática. O singular coletivo «o coração deles» foi mantido por ser compreensível em português e relevante para a imagem do texto.
