  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: pt
  text: 'Ele transforma rios em deserto

    e fontes de água em terra sedenta.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֵׂם
  choice: transforma ... em
  rationale: O verbo שׂים significa literalmente “pôr, colocar, fazer”; neste paralelismo, “transforma ... em” expressa naturalmente a mudança de estado indicada pelo contexto.
- source_word: נְהָרוֹת
  choice: rios
  rationale: É a tradução direta e usual do substantivo plural, preservando o contraste poético com o deserto.
- source_word: לְמִדְבָּר
  choice: em deserto
  rationale: מִדְבָּר pode designar deserto ou região erma. “Deserto” comunica com clareza uma terra árida e desolada, e a preposição לְ indica aqui o estado resultante.
- source_word: וּמֹצָאֵי מַיִם
  choice: e fontes de água
  rationale: מֹצָאֵי significa literalmente “saídas” ou “nascentes”; em associação com água, refere-se aos lugares de onde ela brota. “Fontes de água” é natural e mantém a imagem.
- source_word: לְצִמָּאוֹן
  choice: em terra sedenta
  rationale: צִמָּאוֹן denota literalmente “sede” ou uma condição ressequida. “Terra sedenta” conserva a personificação poética e explicita de modo natural o lugar árido pressuposto.
