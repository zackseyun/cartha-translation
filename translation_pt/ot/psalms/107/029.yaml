translation_notes:
  register: Português moderno, claro e digno, com leve expressão poética em “as ondas deles se calaram”. A formulação causativa da primeira oração acompanha de perto o hebraico, enquanto as notas preservam as alternativas lexicais e a ambiguidade do sufixo.
