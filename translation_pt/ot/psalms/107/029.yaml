base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/029.yaml
  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: pt
  text: Ele fez a tempestade se aquietar[a], e as ondas deles se calaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “transformou a tempestade em calmaria”. A expressão hebraica indica literalmente que ele fez a tempestade passar à quietude ou ao silêncio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “suas ondas”, caso o sufixo se refira ao mar ou às águas, e não às pessoas no barco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: fez ... se aquietar
  rationale: 'O hifil de קום tem aqui sentido causativo: Deus fez a tempestade passar a um estado de quietude. A construção portuguesa preserva essa força sem sugerir que ele levantou a tempestade.'
- source_word: סְעָרָה
  choice: a tempestade
  rationale: O substantivo designa uma tempestade ou tormenta; “tempestade” é corrente, claro e apropriado ao contexto marítimo.
- source_word: לִדְמָמָה
  choice: se aquietar
  rationale: A preposição לְ com דְּמָמָה indica o estado resultante de quietude ou silêncio. “Se aquietar” comunica naturalmente a cessação da tempestade.
- source_word: וַיֶּחֱשׁוּ
  choice: se calaram
  rationale: O verbo expressa ficar quieto ou silencioso. Aplicado às ondas, “se calaram” preserva a imagem poética e indica a passagem do tumulto ao silêncio.
- source_word: גַּלֵּיהֶם
  choice: as ondas deles
  rationale: O sufixo hebraico é masculino plural, literalmente “deles”. A tradução mantém essa forma, embora seu referente contextual possa ser entendido como o mar ou as águas associados aos navegantes.
