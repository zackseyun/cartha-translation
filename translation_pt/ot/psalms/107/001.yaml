  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças a Yahweh[a], porque ele é bom, porque o seu amor leal[b] dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao SENHOR”. “Yahweh” representa o nome divino יהוה.
    reason: alternative_reading
  - marker: b
    text: Ou “a sua fidelidade à aliança dura para sempre”. O hebraico חֶסֶד inclui as ideias de amor, lealdade e fidelidade relacional.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Deem graças
  rationale: O imperativo plural hiphil de ידה, neste contexto litúrgico, convoca a comunidade a expressar gratidão e louvor; “Deem graças” é natural e preciso.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário, e o nome divino יהוה é transliterado como “Yahweh”, preservando sua função de nome próprio.
- source_word: כִּי
  choice: porque
  rationale: Nas duas ocorrências, introduz a razão para a exortação; “porque” mantém claramente a relação causal.
- source_word: טוֹב
  choice: bom
  rationale: Preserva o sentido amplo da bondade moral e beneficente de Yahweh sem restringi-lo a apenas bondade ou benevolência.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica permanência indefinida; com “amor leal”, a formulação verbal é idiomática em português e explicita a duração implícita na oração nominal hebraica.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne amor, misericórdia e lealdade relacional; “amor leal” preserva essa amplitude melhor do que termos que enfatizem apenas compaixão ou obrigação pactual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio revelado, sem substituí-lo por um título.
- issue: Tradução de חֶסֶד
  choice: amor leal
  alternative: fidelidade à aliança; misericórdia; amor constante
  rationale: “Amor leal” mantém juntas as dimensões afetiva, relacional e fiel do termo, sem reduzi-lo exclusivamente a uma categoria jurídica de aliança nem apenas à compaixão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “porque” acompanha a estrutura causal do hebraico; “dura para sempre” comunica naturalmente a oração nominal לְעוֹלָם חַסְדּוֹ.
