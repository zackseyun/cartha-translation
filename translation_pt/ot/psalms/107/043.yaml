  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: pt
  text: Quem é sábio? Que ele atente para estas coisas, e que eles considerem[a] os atos de amor leal[b] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular (“que ele atente”) para o plural (“que eles considerem”).
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, no plural: “amores leais”; isto pode se referir às muitas manifestações do amor leal e misericordioso de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Quem é sábio?
  rationale: Mantém a força interrogativa direta da pergunta retórica sapiencial, sem transformá-la em uma oração condicional com “quem for sábio”.
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Que atente para estas coisas
  rationale: Neste contexto, שׁמר indica guardar na mente, observar ou levar em consideração o que foi narrado. “Atente para” comunica essa exortação com naturalidade em português.
- source_word: וְיִתְבּוֹנְנוּ
  choice: e considerem
  rationale: O verbo expressa reflexão cuidadosa e discernimento. A forma plural é preservada, apesar da abertura no singular.
- source_word: חַסְדֵי
  choice: os atos de amor leal
  rationale: O plural de חֶסֶד aponta aqui para as diversas manifestações da lealdade amorosa e misericordiosa de Deus. “Atos de amor leal” preserva essa pluralidade com clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Mudança do singular para o plural
  choice: Que atente... e considerem
  alternative: Que atente... e considere
  rationale: O hebraico passa de uma referência singular ao sábio para um verbo no plural. A tradução mantém essa tensão gramatical e retórica em vez de uniformizá-la silenciosamente.
- issue: Sentido e número de חַסְדֵי
  choice: os atos de amor leal
  alternative: o amor leal
  rationale: A forma hebraica é plural e pode designar as muitas demonstrações da fidelidade misericordiosa de Yahweh ao longo do salmo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega o nome pessoal de Deus; a transliteração preserva essa distinção.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Atente para” evita o pouco natural “guarde estas coisas”, enquanto “atos de amor leal” torna explícito o plural hebraico sem impor terminologia denominacional.
