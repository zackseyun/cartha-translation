  text: רְעֵבִ֥ים גַּם צְמֵאִ֑ים נַ֝פְשָׁ֗/ם בָּ/הֶ֥ם תִּתְעַטָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: pt
  text: Famintos e sedentos, sua alma desfalecia dentro deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua vida desfalecia dentro deles” ou “eles próprios desfaleciam”; o hebraico néfesh pode significar alma, vida ou a própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: Famintos
  rationale: Expressa diretamente o adjetivo hebraico sem intensificá-lo para “morrendo de fome”.
- source_word: גַּם
  choice: e
  rationale: No contexto, liga naturalmente os dois estados concomitantes; o valor aditivo está presente na coordenação portuguesa, sem a rigidez de “e também”.
- source_word: צְמֵאִים
  choice: sedentos
  rationale: Equivalente corrente e digno do adjetivo hebraico, adequado ao registro poético.
- source_word: נַפְשָׁם
  choice: sua alma
  rationale: Preserva a imagem antropológica de נֶפֶשׁ e sua possível referência à alma, vida ou ao próprio ser, sem reduzir silenciosamente a ambiguidade a um simples pronome pessoal.
- source_word: בָּהֶם
  choice: dentro deles
  rationale: Representa a localização interior indicada pela preposição e soa natural em português.
- source_word: תִּתְעַטָּף
  choice: desfalecia
  rationale: Comunica a perda progressiva das forças interiores causada pela fome e pela sede; o aspecto verbal no contexto favorece a forma durativa.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: sua alma
  alternative: sua vida; eles próprios
  rationale: A tradução principal conserva a imagem hebraica, enquanto a nota reconhece a amplitude semântica sem impor uma definição doutrinária específica de “alma”.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. “Famintos e sedentos” mantém concisão e paralelismo; “desfalecia dentro deles” preserva a imagem interior do hebraico. O marcador foi colocado após a oração à qual a nota se aplica.
