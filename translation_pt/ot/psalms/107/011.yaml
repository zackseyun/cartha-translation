lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da condição descrita no contexto anterior e mantém o fluxo explicativo e poético do salmo.
- source_word: הִמְרוּ
  choice: se rebelaram contra
  rationale: Expressa a ideia de rebeldia e desafio, bem como a ruptura relacional diante da palavra divina.
- source_word: אִמְרֵי
  choice: as palavras de
  rationale: É a forma mais natural e abrangente em português para o plural construto, sem restringi-lo a ditos específicos.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל funciona como designação divina comum; “Deus” é claro e preserva o paralelismo com “Altíssimo”.
- source_word: וַעֲצַת
  choice: e o conselho do
  rationale: “Conselho” preserva a amplitude de עֵצָה, que pode envolver orientação, desígnio ou propósito, sem decidir além do texto.
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: Equivalente tradicional, claro e digno do título divino, preservando sua força teológica.
- source_word: נָאָצוּ
  choice: desprezaram
  rationale: Comunica de modo conciso o forte sentido de desdenhar ou tratar com desprezo.
theological_decisions:
- issue: Tradução dos títulos divinos אֵל e עֶלְיוֹן em paralelo
  choice: Deus ... o Altíssimo
  alternative: o Poderoso ... o Excelso
  rationale: Mantém distintos os dois títulos no paralelismo poético sem acrescentar nuances doutrinárias não exigidas pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Pois” mantém o nexo explicativo; “se rebelaram contra” e “desprezaram” conservam a intensidade do hebraico.
