  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: pt
  text: Ele os tirou das trevas e da sombra da morte[a] e rompeu as suas correntes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das trevas profundas”. O termo hebraico pode indicar tanto a sombra da morte como uma escuridão profunda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Ele os tirou
  rationale: O hifil de יצא expressa fazer sair ou tirar. O passado traduz naturalmente a ação divina relembrada nesta seção do salmo.
- source_word: מֵחֹשֶׁךְ
  choice: das trevas
  rationale: חֹשֶׁךְ é o termo comum para escuridão; “das trevas” é idiomático em português e mantém a preposição de origem מִן.
- source_word: וְצַלְמָוֶת
  choice: e da sombra da morte
  rationale: צַלְמָוֶת admite a leitura tradicional “sombra da morte” e também pode significar “trevas profundas”. A primeira preserva a imagem de perigo mortal; a alternativa aparece em nota.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: as suas correntes
  rationale: מוֹסְרוֹת designa laços, grilhões ou outras amarras. “Correntes” é claro, vívido e adequado ao cenário de prisão.
- source_word: יְנַתֵּק
  choice: rompeu
  rationale: O piel de נתק indica separar ou arrancar com força. Com “correntes”, “rompeu” forma uma expressão natural em português e comunica libertação violenta.
theological_decisions:
- issue: Sentido de צַלְמָוֶת
  choice: sombra da morte
  alternative: trevas profundas
  rationale: As duas análises são lexicalmente possíveis. O texto principal mantém a imagem tradicional e contextualmente apropriada de perigo mortal, enquanto a nota preserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é natural sem perder o paralelismo entre trevas, sombra da morte e correntes.
