  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: pt
  text: Entregaram os cadáveres dos teus servos como alimento às aves dos céus[a], e a carne dos que te são fiéis[b] aos animais selvagens da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às aves do céu”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que te são fiéis” também pode ser traduzida por “teus fiéis”, “os que te são leais” ou “teus santos”; o termo hebraico descreve os que são devotados a Deus com lealdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Entregaram
  rationale: O qal perfeito descreve uma ação hostil consumada. “Entregaram” expressa naturalmente que os corpos foram deixados à mercê dos animais.
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: os cadáveres dos teus servos
  rationale: “Cadáveres” preserva a referência explícita a corpos mortos e a indignidade de permanecerem insepultos; “servos” é adequado para os que pertencem e servem a Deus no contexto dos Salmos.
- source_word: מַאֲכָל
  choice: como alimento
  rationale: 'Expressa de modo claro a função predicativa: os cadáveres foram entregues para servir de alimento.'
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves dos céus
  rationale: “Aves” traduz naturalmente o coletivo עוֹף, enquanto “dos céus” conserva a formulação poética hebraica e o contraste com “da terra”.
- source_word: בְּשַׂר
  choice: a carne
  rationale: Mantém a imagem física e brutal do hebraico, além do paralelismo com “cadáveres”.
- source_word: חֲסִידֶיךָ
  choice: dos que te são fiéis
  rationale: Comunica pessoas caracterizadas por devoção e lealdade pactual a Deus sem impor o sentido técnico posterior de “santos”.
- source_word: לְחַיְתוֹ אָרֶץ
  choice: aos animais selvagens da terra
  rationale: חיה designa aqui animais terrestres, provavelmente feras necrófagas. “Animais selvagens” é claro em português moderno e preserva o paralelismo cósmico entre céus e terra.
theological_decisions:
- issue: Sentido da designação pactual חֲסִידֶיךָ
  choice: os que te são fiéis
  alternative: teus fiéis; teus santos; os que te são leais
  rationale: A expressão inclui devoção e lealdade no relacionamento com Deus. A formulação escolhida preserva esse sentido sem restringi-lo a uma categoria eclesiástica posterior.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. “Céus” mantém a forma elevada do hebraico, enquanto “animais selvagens” evita o tom arcaico de “feras” sem atenuar a violência da cena.
