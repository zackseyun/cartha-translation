  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: pt
  text: 'Pois devoraram Jacó

    e devastaram a sua morada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque consumiram Jacó e deixaram desolada a sua habitação”.'
    reason: Alternativas lexicais legítimas para כִּי, אָכַל, נָוֵהוּ e הֵשַׁמּוּ.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica ou do pedido de juízo no contexto anterior, com força explicativa natural em português poético.
- source_word: אָכַל
  choice: devoraram
  rationale: Embora o sentido básico seja “comer”, aqui a imagem de agressão contra um povo pede “devorar”, que preserva sua força e violência.
- source_word: אֶת יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome poético e pactual do texto hebraico, sem explicitá-lo como “Israel” ou “os descendentes de Jacó”.
- source_word: נָוֵהוּ
  choice: a sua morada
  rationale: נָוֶה pode indicar morada, habitação ou pastagem. “Sua morada” conserva a referência ampla ao lugar onde Jacó/Israel habita, sem restringi-la ao templo.
- source_word: הֵשַׁמּוּ
  choice: devastaram
  rationale: O hifil expressa causar desolação. “Devastaram” é atual, vívido e natural em português.
theological_decisions:
- issue: Referente de “sua morada”
  choice: A morada de Jacó/Israel em sentido coletivo
  alternative: O templo ou santuário especificamente; ou a terra em geral
  rationale: O sufixo de נָוֵהוּ remete naturalmente a Jacó no paralelismo. O contexto mais amplo permite associação com o templo, mas esta oração não exige essa delimitação; por isso, a tradução preserva a amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido em duas linhas; “morada” evita tanto coloquialismo excessivo quanto especificação teológica indevida.
