  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: pt
  text: Derrama a tua ira sobre as nações que não te conhecem[a] e sobre os reinos que não invocam o teu nome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que não te reconhecem”. O verbo hebraico traduzido por “conhecer” pode indicar reconhecimento relacional, e não apenas conhecimento intelectual.
    reason: lexical_alternative
  - marker: b
    text: Ou “que não apelam ao teu nome”. A expressão hebraica se refere a recorrer a Deus em oração ou culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Derrama
  rationale: O imperativo preserva a metáfora vívida de verter a ira sobre seus alvos e é natural em português.
- source_word: חֲמָתְךָ
  choice: a tua ira
  rationale: חֵמָה designa ira intensa, muitas vezes com a ideia de ardor; “ira” mantém o tom elevado e compreensível do contexto imprecatório.
- source_word: אֶל
  choice: sobre
  rationale: Embora a preposição possa significar “para” ou “contra”, “derramar ... sobre” é a construção idiomática em português.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros em contraste com Israel; “nações” evita associações posteriores que “gentios” poderia introduzir.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: que não te conhecem
  rationale: Mantém a formulação direta do hebraico e sua possível dimensão relacional, sem reduzi-la a mero conhecimento intelectual nem explicitá-la como reconhecimento ou culto.
- source_word: וְעַל
  choice: e sobre
  rationale: Coordena o segundo alvo da petição e conserva o paralelismo com a primeira oração.
- source_word: מַמְלָכוֹת
  choice: os reinos
  rationale: Equivalente direto que preserva o paralelismo poético e a referência a entidades políticas.
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: que não invocam o teu nome
  rationale: קרא בשם é uma expressão para apelo em oração ou culto. “Invocar o teu nome” comunica naturalmente esse sentido religioso em português.
- source_word: בְּשִׁמְךָ
  choice: o teu nome
  rationale: A preposição hebraica está incorporada naturalmente à expressão portuguesa “invocar o teu nome”, preservando a importância do nome divino.
theological_decisions:
- issue: A natureza de “conhecer” Deus em relação às nações
  choice: que não te conhecem
  alternative: que não te reconhecem
  rationale: O verbo יָדַע pode envolver reconhecimento relacional, mas a tradução direta conserva a amplitude e a tensão teológica do hebraico; a oração seguinte já explicita a dimensão de invocação e culto.
- issue: O sentido de chamar pelo nome de Deus
  choice: que não invocam o teu nome
  alternative: que não clamam pelo teu nome
  rationale: A expressão hebraica pode apontar para apelo em oração ou adoração. “Invocam” mantém essa amplitude sem limitar a ação a um clamor motivado por aflição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O paralelismo hebraico entre “nações” e “reinos” foi preservado; os pronomes de segunda pessoa mantêm a linguagem direta da oração.
