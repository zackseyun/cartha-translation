  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: pt
  text: Derramaram o sangue deles como água ao redor de Jerusalém[a], e não há quem os sepulte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Verteram o sangue deles como água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: Derramaram
  rationale: O qal perfeito na 3ª pessoa do plural descreve uma ação consumada. “Derramaram” preserva tanto o sentido de verter sangue quanto a imagem explícita da água.
- source_word: דָמָם
  choice: o sangue deles
  rationale: Tradução direta do substantivo דָּם com sufixo masculino plural; evita a interpretação adicional de “sangue vital”.
- source_word: כמים
  choice: como água
  rationale: A preposição כ marca comparação, expressa naturalmente em português por “como”.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: ao redor de Jerusalém
  rationale: Expressa a área circundante da cidade em linguagem natural e preserva a amplitude espacial da cena.
- source_word: וְאֵין
  choice: e não há quem
  rationale: Reproduz a construção existencial negativa hebraica e introduz de modo idiomático o particípio seguinte.
- source_word: קוֹבֵר
  choice: os sepulte
  rationale: O particípio significa literalmente “alguém que enterre”. O pronome retoma naturalmente os mortos mencionados pelo sangue derramado; “sepultar” mantém o registro poético e digno.
