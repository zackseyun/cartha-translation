  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: pt
  text: Até quando, Yahweh? Ficarás irado para sempre? Teu ciúme arderá como fogo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Teu zelo arderá como fogo?” O hebraico קִנְאָה pode significar “ciúme” ou “zelo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: Até quando
  rationale: Fórmula idiomática de lamento que pergunta pela duração; é natural em português e preserva a urgência da súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: תֶּאֱנַף
  choice: ficarás indignado
  rationale: O verbo אנף expressa ira. “Ficarás indignado” comunica essa ideia com clareza e dignidade no contexto de uma pergunta sobre sua duração.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: No lamento, pergunta se a indignação divina continuará sem fim; esta é a expressão portuguesa mais natural.
- source_word: תִּבְעַר
  choice: arderá
  rationale: O verbo בער denota queimar ou arder; “arderá” combina naturalmente com a comparação ao fogo sem acrescentar a ideia de consumir.
- source_word: כְּמוֹ אֵשׁ
  choice: como fogo
  rationale: Preserva de modo direto e natural a comparação do hebraico.
- source_word: קִנְאָתֶךָ
  choice: teu ciúme
  rationale: קִנְאָה pode indicar ciúme ou zelo. “Ciúme” mantém aqui a força relacional e pactual do termo, enquanto a alternativa “zelo” é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de קִנְאָה como atributo de Deus
  choice: ciúme
  alternative: zelo
  rationale: O contexto de ira e a linguagem de fogo favorecem o sentido forte de “ciúme”, mas “zelo” continua lexicalmente possível e é mantido em nota para não eliminar a ambiguidade teológica genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura em três perguntas preserva o movimento urgente do lamento hebraico.
