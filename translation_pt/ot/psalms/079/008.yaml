id: PSA.79.8
reference: Psalms 79:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: pt
  text: Não te lembres contra nós das iniquidades de tempos passados; que as tuas misericórdias venham depressa ao nosso encontro[a], pois fomos muito abatidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as iniquidades dos nossos antepassados”; alternativamente, “as nossas iniquidades passadas”. A expressão hebraica é temporalmente ambígua.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Não te lembres contra nós
  rationale: Preserva o verbo זכר, “lembrar”, e explicita o valor adverso/judicial de לָנוּ neste contexto, em português natural.
- source_word: עֲוֺנֹת
  choice: iniquidades
  rationale: Mantém tanto o peso moral quanto a dimensão de culpa de עָוֹן, em vez de reduzi-lo ao termo mais genérico “pecados”.
- source_word: רִאשֹׁנִים
  choice: de tempos passados
  rationale: Expressa a referência temporal sem decidir se estão em vista as iniquidades dos antepassados ou as iniquidades anteriores do próprio povo.
- source_word: מַהֵר
  choice: depressa
  rationale: Comunica com clareza e naturalidade a urgência do advérbio hebraico.
- source_word: יְקַדְּמוּנוּ
  choice: venham ... ao nosso encontro
  rationale: Conserva a imagem de קדם, segundo a qual as misericórdias de Deus chegam adiante e encontram os suplicantes.
- source_word: רַחֲמֶיךָ
  choice: as tuas misericórdias
  rationale: Preserva o plural hebraico e emprega linguagem bíblica digna, ainda corrente e compreensível.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em estilo de oração, a razão do pedido.
- source_word: דַלּוֹנוּ מְאֹד
  choice: fomos muito abatidos
  rationale: Traduz o estado resultante expresso pelo perfeito de דלל e sua forte intensificação, sem restringir o sentido à pobreza material ou à fraqueza física.
theological_decisions:
- issue: Referência de “iniquidades de tempos passados”
  choice: Formulação temporal sem identificar os autores das iniquidades.
  alternative: “as iniquidades dos nossos antepassados” ou “as nossas iniquidades passadas”.
  rationale: O hebraico é temporalmente ambíguo e pode apontar para culpas ancestrais ou para iniquidades anteriores. A tradução principal preserva essa tensão, e a nota registra as leituras possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Não te lembres contra nós” conserva deliberadamente a nuance judicial do original, enquanto “de tempos passados” evita resolver uma ambiguidade genuína.
