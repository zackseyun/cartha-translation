base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: pt
  text: 'Salmo de Asafe.


    Ó Deus, as nações entraram na tua herança, profanaram o teu santo templo e reduziram Jerusalém a um monte de ruínas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reduziram Jerusalém a montões de ruínas”.'
    reason: O hebraico usa um substantivo plural que pode ser representado mais literalmente por “montões de ruínas”.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Salmo de Asafe
  rationale: A construção pode indicar autoria, associação ou pertencimento; a forma tradicional e natural preserva essa concisão sem especificar além do hebraico.
- source_word: בָּאוּ גוֹיִם בְּנַחֲלָתֶךָ
  choice: as nações invadiram a tua herança
  rationale: Literalmente, 'nações entraram na tua herança'. No contexto hostil de profanação e destruição, 'invadiram' comunica naturalmente a força pragmática, enquanto 'tua herança' preserva a imagem teológica do texto.
- source_word: טִמְּאוּ
  choice: profanaram
  rationale: O verbo denota tornar ritualmente impuro ou contaminar. Em relação ao templo, 'profanaram' é corrente, digno e adequado ao contexto cultual.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: teu santo templo
  rationale: '''Templo'' expressa com clareza הֵיכָל neste contexto, e ''santo'' mantém a qualificação possessiva e sacra do hebraico.'
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: reduziram Jerusalém a um monte de ruínas
  rationale: A expressão indica transformar Jerusalém em montões ou amontoados de ruínas. O singular coletivo 'um monte de ruínas' produz português natural e conserva a imagem concreta.
theological_decisions:
- issue: Sentido de 'tua herança'
  choice: Manter a metáfora sem identificar explicitamente terra, povo ou cidade
  alternative: Traduzir como 'tua terra' ou explicar a referência no corpo do texto
  rationale: O hebraico deixa o referente abrangente, e o paralelismo pode envolver terra, cidade e santuário; explicitar apenas um deles resolveria indevidamente a ambiguidade.
- issue: Impureza ritual do templo
  choice: profanaram
  alternative: tornaram impuro / contaminaram
  rationale: '''Profanaram'' transmite a violação da santidade do templo sem exigir uma teoria específica sobre o modo da impureza.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A invocação 'Ó Deus' reproduz o vocativo. A sequência hebraica de invasão, profanação e destruição foi mantida; a nota registra o plural concreto da expressão final.
