  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: pt
  text: Chegue à tua presença o gemido do prisioneiro; conforme a grandeza do teu braço, preserva os destinados à morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos da morte”; expressão hebraica para pessoas destinadas ou condenadas a morrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Chegue
  rationale: O imperfeito qal tem força volitiva no contexto da oração. A forma portuguesa no subjuntivo expressa naturalmente o pedido dirigido a Deus.
- source_word: לְפָנֶיךָ
  choice: à tua presença
  rationale: Traduz de modo natural a expressão hebraica literalmente ligada a estar 'diante da face' de alguém, preservando a ideia de o clamor chegar perante Deus.
- source_word: אֶנְקַת
  choice: o gemido
  rationale: Designa um gemido ou suspiro audível de aflição. 'Gemido' é claro e apropriado ao contexto de lamento.
- source_word: אָסִיר
  choice: do prisioneiro
  rationale: O substantivo singular refere-se a quem está preso ou confinado; o singular coletivo do hebraico foi mantido.
- source_word: כְּגֹדֶל
  choice: conforme a grandeza
  rationale: 'A preposição כ com גֹּדֶל indica medida ou padrão: o pedido é proporcional à grandeza do poder divino.'
- source_word: זְרוֹעֲךָ
  choice: do teu braço
  rationale: Mantém a metáfora concreta hebraica do braço como expressão de força e poder, sem a reduzir a uma abstração.
- source_word: הוֹתֵר
  choice: preserva
  rationale: O imperativo hifil de יתר pede que Deus faça essas pessoas permanecerem, isto é, que as conserve vivas. 'Preserva' mantém tanto a ação salvadora quanto a formulação concisa.
- source_word: בְּנֵי תְמוּתָה
  choice: os destinados à morte
  rationale: A expressão idiomática, literalmente 'filhos da morte', descreve pessoas sob ameaça, sentença ou destino de morte. A tradução comunica o sentido sem decidir além do texto se a morte é judicial ou iminente.
