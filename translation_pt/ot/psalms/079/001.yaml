  terminology: «Salmo de Asafe», «Ó Deus», «tua herança», «teu santo templo» e «profanaram» são escolhas adequadas, estáveis e teologicamente não interpretativas. «Montões de ruínas» representa de modo apropriado o plural לְעִיִּים.
