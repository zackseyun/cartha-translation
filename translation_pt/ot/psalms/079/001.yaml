base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: pt
  text: Salmo de Asafe. Ó Deus, as nações entraram na tua herança; profanaram o teu santo templo; reduziram Jerusalém a montões de ruínas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «transformaram Jerusalém em ruínas».'
    reason: Alternativa lexical mais concisa para לְעִיִּים, cujo plural pode ser entendido como ruínas ou montões de ruínas.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo convencional e exato para o gênero indicado no título.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: Preserva a associação expressa por ל sem definir de modo excessivo se se trata de autoria, pertencimento ou destinação.
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo; «Ó» torna a invocação clara e digna em português.
- source_word: בָּאוּ גוֹיִם
  choice: as nações invadiram
  rationale: Embora בוא signifique literalmente «entrar/vir», no contexto de povos hostis entrando no território de Deus, «invadiram» expressa naturalmente a ação contextual sem recorrer ao termo teológico posterior «gentios».
- source_word: בְּנַחֲלָתֶךָ
  choice: a tua herança
  rationale: Mantém a amplitude pactual de נחלה, que pode evocar a terra e o povo pertencentes a Deus, sem especificar apenas um deles.
- source_word: טִמְּאוּ
  choice: profanaram
  rationale: Comunica a violação cultual do espaço sagrado em português corrente; «tornaram impuro» seria mais literal, porém menos natural.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: o teu santo templo
  rationale: Forma idiomática que preserva tanto a referência ao templo quanto seu caráter sagrado.
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: reduziram Jerusalém a montões de ruínas
  rationale: A construção שׂים ... ל indica resultado, e o plural עִיִּים pode denotar montões ou amontoados de ruínas.
theological_decisions:
- issue: Amplitude de «tua herança»
  choice: Conservar «a tua herança»
  alternative: a tua terra; o teu povo
  rationale: O hebraico não limita explicitamente a herança à terra ou ao povo; a tradução conserva essa tensão e ressonância pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O título permanece conciso; a lamentação usa paralelismo verbal natural. O marcador [a] aparece no texto principal e corresponde à nota.
