  source_fidelity: 'A tradução preserva bem a estrutura da lamentação, a linguagem cultual de טִמְּאוּ («profanaram»), a amplitude de «tua herança» e o resultado expresso por שָׂמוּ ... לְעִיִּים. Contudo, «invadiram» interpreta e intensifica בָּאוּ («vieram/entraram»): embora a hostilidade esteja no contexto, o verbo hebraico em si não afirma uma invasão. «Entraram na tua herança» conserva melhor o sentido direcional sem acrescentar essa especificação.'
