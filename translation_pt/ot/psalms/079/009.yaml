  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: pt
  text: Ajuda-nos, ó Deus da nossa salvação, por causa da glória do teu nome[a]; livra-nos e faz expiação pelos nossos pecados[b], por amor do teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em favor da glória do teu nome».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «expia os nossos pecados». O verbo hebraico pertence à linguagem da expiação e não significa apenas perdoar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Ajuda-nos
  rationale: Imperativo direto de עזר com sufixo de primeira pessoa do plural; expressão natural, urgente e fiel em português.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: ó Deus da nossa salvação
  rationale: Preserva a cadeia construta hebraica e apresenta Deus como a fonte da salvação; o vocativo com «ó» mantém o tom solene da oração.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: por causa da glória do teu nome
  rationale: A expressão indica base ou motivo para a intervenção divina. «Por causa de» preserva essa relação sem decidir de modo rígido entre causa e finalidade.
- source_word: וְהַצִּילֵנוּ
  choice: livra-nos
  rationale: O hifil de נצל denota resgatar ou livrar. «Livra-nos» é corrente no registro bíblico e evita repetir «salvação».
- source_word: וְכַפֵּר עַל
  choice: faz expiação por
  rationale: Preserva a linguagem própria de כפר e sua dimensão de remoção da culpa, sem a reduzir ao simples perdão nem especificar um mecanismo doutrinário posterior.
- source_word: חַטֹּאתֵינוּ
  choice: nossos pecados
  rationale: Representa diretamente o substantivo plural com sufixo de primeira pessoa do plural.
- source_word: לְמַעַן שְׁמֶךָ
  choice: por amor do teu nome
  rationale: Expressão portuguesa digna e inteligível que comunica o nome, caráter e honra de Deus como motivo da súplica.
theological_decisions:
- issue: Sentido de כפר numa súplica penitencial
  choice: faz expiação pelos nossos pecados
  alternative: perdoa os nossos pecados
  rationale: «Faz expiação» conserva o peso cultual e teológico do verbo hebraico. «Perdoa» expressaria parte do resultado, mas reduziria sua amplitude semântica.
- issue: Motivação da intervenção divina ligada ao nome de Deus
  choice: por causa da glória do teu nome ... por amor do teu nome
  alternative: para a glória do teu nome ... por causa do teu nome
  rationale: A formulação mantém os dois apelos do texto e não os fundamenta no mérito de Israel. A primeira expressão preserva a possível nuance causal ou motivacional; a segunda traduz o propósito expresso por לְמַעַן.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O tratamento na segunda pessoa do singular preserva o caráter direto da oração. «Faz expiação» é menos coloquial, mas necessário para conservar a carga específica do hebraico.
