    issue: Preposição da imagem «no colo»
    rationale: אֶל חֵיקָם significa literalmente «para/em seu colo» na imagem de retribuição. «No colo dos nossos vizinhos» é a realização idiomática portuguesa mais natural de «fazer recair [algo] no colo de alguém», enquanto «sobre o colo» soa mais literal e menos fluente.
  - severity: low
    issue: Formulação da nota alternativa
    rationale: «Devolve aos nossos vizinhos, sete vezes, no colo deles» tem encadeamento pouco natural em português. Uma formulação com «faze voltar ... para o colo deles» preserva o valor alternativo e a imagem hebraica com maior clareza.
