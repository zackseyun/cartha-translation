  source_fidelity: A tradução preserva adequadamente a petição imperativa, os «nossos vizinhos», a intensidade de «sete vezes», a afronta e o vocativo divino. Contudo, «sobre o colo» não é a forma idiomática mais natural para a imagem hebraica de algo que retorna ao receptáculo pessoal de alguém; em português, «no colo» transmite melhor essa construção sem alterar a metáfora.
  naturalness: «Faze recair ... sobre o colo» soa menos idiomático do que «faze recair ... no colo», especialmente porque «recair no colo de alguém» é uma expressão natural e mantém o efeito poético. A nota também deve apresentar uma alternativa portuguesa fluente.
  terminology: «Afronta / afrontaram» reproduz bem a ligação cognata entre חֶרְפָּה e חרף. «Senhor» e o vocativo «ó» são adequados. «Colo» é compreensível internacionalmente e apropriado aqui.
