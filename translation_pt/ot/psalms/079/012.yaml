  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: pt
  text: E faze recair sete vezes no colo dos nossos vizinhos a afronta com que te afrontaram, ó Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E faze voltar aos nossos vizinhos, sete vezes, para o colo deles, a afronta”. A imagem hebraica apresenta o insulto voltando sobre quem o proferiu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: E faze recair
  rationale: O hifil imperativo de שׁוב pede que Deus faça a afronta voltar sobre os ofensores. “Faze recair” preserva tanto a ideia de retorno quanto a retribuição, sem reduzir a expressão a uma abstração.
- source_word: לִשְׁכֵנֵינוּ
  choice: sobre o colo dos nossos vizinhos
  rationale: שׁכן designa quem mora nas proximidades. “Nossos vizinhos” conserva a formulação do hebraico sem explicitar como “povos vizinhos” aquilo que o contexto apenas sugere.
- source_word: שִׁבְעָתַיִם
  choice: sete vezes
  rationale: A forma adverbial significa “sete vezes” ou “sete por um”. “Sete vezes” é clara em português e mantém a intensidade poética da retribuição pedida.
- source_word: אֶל חֵיקָם
  choice: sobre o colo deles
  rationale: חֵיק refere-se literalmente ao colo ou regaço. A construção retrata figuradamente a afronta retornando aos próprios ofensores; na frase, o possessivo é expresso por “dos nossos vizinhos”.
- source_word: חֶרְפָּתָם
  choice: a afronta
  rationale: חֶרְפָּה pode indicar afronta, insulto ou desonra. “Afronta” permite reproduzir em português a ligação lexical com o verbo seguinte.
- source_word: אֲשֶׁר חֵרְפוּךָ
  choice: com que te afrontaram
  rationale: A redação mantém a oração relativa e reproduz a relação cognata entre חֶרְפָּה e חרף por meio de “afronta/afrontaram”.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: אֲדֹנָי é o título divino “Senhor”; “ó” marca naturalmente o vocativo na oração poética.
theological_decisions:
- issue: Petição imprecatória e grau de literalidade
  choice: Manter diretamente o pedido para que Deus faça a afronta recair sete vezes sobre os ofensores.
  alternative: Converter o verso em um pedido geral de justiça ou suavizar a retribuição.
  rationale: O hebraico formula uma petição imprecatória explícita. A tradução conserva essa tensão teológica sem endossá-la por explicação nem diluí-la em linguagem abstrata.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla inteligibilidade internacional. “Colo” preserva a imagem concreta sem recorrer ao mais arcaizante “regaço”; a ordem da frase foi ajustada para evitar uma sequência pouco natural de complementos.
