base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: pt
  text: Tornamo-nos objeto de desprezo para os nossos vizinhos, alvo de zombaria e escárnio para os que nos rodeiam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “objeto de ridículo e insulto para os que estão ao nosso redor”.'
    reason: Alternativa lexical para לַעַג וָקֶלֶס e para a expressão לִסְבִיבוֹתֵינוּ.
lexical_decisions:
- source_word: הָיִינוּ
  choice: Tornamo-nos
  rationale: O qal perfeito na primeira pessoa do plural expressa uma mudança que resultou na condição presente; “tornamo-nos” conserva tanto o acontecimento quanto seu resultado.
- source_word: חֶרְפָּה
  choice: motivo de vergonha
  rationale: O substantivo designa vergonha pública ou alguém exposto ao desprezo. A expressão é natural em português e mantém o sentido relacional do lamento.
- source_word: לִשְׁכֵנֵינוּ
  choice: para os nossos vizinhos
  rationale: 'A preposição ל indica aqui relação ou referência: o povo tornou-se motivo de vergonha perante os povos vizinhos.'
- source_word: לַעַג
  choice: alvo de zombaria
  rationale: O termo denota ridicularização hostil. “Alvo de zombaria” comunica naturalmente que o povo é objeto dessa ação e preserva a estrutura nominal.
- source_word: קֶלֶס
  choice: escárnio
  rationale: O termo se sobrepõe a לַעַג, mas acrescenta a ideia de desprezo expresso em insultos ou provocações. “Escárnio” mantém o acúmulo poético sem repetir “zombaria”.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: para os que nos rodeiam
  rationale: A expressão se refere aos povos ou pessoas ao redor, um círculo potencialmente mais amplo que os “vizinhos” do primeiro segmento.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com paralelismo poético preservado. “Tornamo-nos” evita reduzir o perfeito hebraico a um simples estado presente, enquanto “zombaria e escárnio” conserva os dois termos próximos, mas não idênticos, do original.
