  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: pt
  text: 'Por que as nações haveriam de dizer: “Onde está o Deus deles?” Seja conhecida entre as nações, diante dos nossos olhos, a vingança pelo sangue derramado dos teus servos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a vingança pelo sangue derramado dos teus servos se torne conhecida entre as nações, diante dos nossos olhos.”'
    reason: A ordem hebraica permite apresentar “a vingança” depois do verbo, como no texto, ou antecipá-la como sujeito da oração, sem mudança substancial de sentido.
lexical_decisions:
- source_word: לָמָּה
  choice: Por que ... haveriam de
  rationale: Introduz um protesto retórico; a construção idiomática comunica que não se deve permitir que as nações continuem zombando.
- source_word: יֹאמְרוּ
  choice: dizer
  rationale: É o equivalente corrente e natural para o verbo comum de fala.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: No contexto dos Salmos, designa os povos estrangeiros; evita a conotação étnico-religiosa posterior que “gentios” pode adquirir.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Preserva diretamente a pergunta locativa usada como provocação.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: O referente é o Deus de Israel, sobre quem as nações lançam sua provocação.
- source_word: יִוָּדַע
  choice: Seja conhecida
  rationale: Mantém a forma passiva do nifal e, no contexto da oração, expressa o pedido para que a ação vingadora de Deus se torne publicamente evidente.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: A preposição indica o âmbito humano no qual a vingança deve tornar-se conhecida.
- source_word: לְעֵינֵינוּ
  choice: diante dos nossos olhos
  rationale: Reproduz a imagem hebraica de algo realizado de maneira visível e testemunhado pelos suplicantes.
- source_word: נִקְמַת
  choice: a vingança
  rationale: Preserva a força explícita do substantivo hebraico, sem suavizá-lo como mera “justiça”.
- source_word: דַּם
  choice: sangue
  rationale: A tradução literal conserva as ideias de morte violenta e culpa de sangue.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: No discurso dirigido a Deus, “servos” é natural e adequado para seu povo, sem destacar indevidamente a condição social de escravo.
- source_word: הַשָּׁפוּךְ
  choice: derramado
  rationale: O particípio passivo modifica “sangue”; “sangue derramado” é a expressão portuguesa tradicional e corrente para morte violenta.
theological_decisions:
- issue: Pedido imprecatório de vingança divina
  choice: Manter “a vingança” como pedido explícito de retribuição divina e vindicação pública.
  alternative: Substituir por “justiça” ou parafrasear como “mostra que defendes os teus servos”.
  rationale: O hebraico emprega diretamente נִקְמַת, “vingança/ato de vingar”. Suavizar o termo eliminaria a tensão teológica própria da oração.
- issue: Relação sintática de “diante dos nossos olhos”
  choice: Associar a expressão ao ato de a vingança tornar-se conhecida entre as nações, mantendo-a entre vírgulas.
  alternative: 'Ligá-la mais estreitamente à própria vingança: “a vingança, diante dos nossos olhos, pelo sangue...”'
  rationale: A sequência hebraica admite alguma flexibilidade. A redação escolhida comunica com clareza que os suplicantes pedem testemunhar a vindicação, sem excluir seu caráter público entre as nações.
- issue: Valor do passivo יִוָּדַע
  choice: 'Preservar a formulação passiva: “Seja conhecida”.'
  alternative: 'Explicitar Deus como agente: “Faze as nações conhecerem” ou “Mostra às nações”.'
  rationale: O texto hebraico deixa o agente implícito. A forma passiva preserva essa característica e evita acrescentar uma especificação não expressa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Haveriam de dizer” comunica o protesto retórico de modo natural; “teus” mantém o tratamento singular dirigido a Deus. A ordem verbal “Seja conhecida” conserva o tom de oração e a estrutura passiva do hebraico.
