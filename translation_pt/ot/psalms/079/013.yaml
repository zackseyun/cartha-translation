  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: pt
  text: Mas nós, teu povo e o rebanho[a] do teu pasto, daremos graças a ti para sempre; de geração em geração anunciaremos[b] o teu louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ovelhas do teu pasto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “relataremos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mas nós
  rationale: A conjunção ligada ao pronome independente introduz um contraste com as nações e a devastação mencionadas antes; “Mas nós” expressa esse valor adversativo com naturalidade.
- source_word: עַמְּךָ
  choice: teu povo
  rationale: Expressão direta que identifica a comunidade da aliança em sua relação com Deus.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: e o rebanho do teu pasto
  rationale: Preserva a metáfora pastoril. “Rebanho” representa naturalmente o substantivo coletivo צֹאן, e “pasto” mantém a imagem de מַרְעִית.
- source_word: נוֹדֶה לְּךָ
  choice: daremos graças a ti
  rationale: O Hifil de ידה pode significar agradecer ou louvar. “Daremos graças” preserva a distinção em relação a תְּהִלָּתֶךָ, “o teu louvor”, no segundo membro.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Forma corrente e clara de expressar duração contínua ou ilimitada no contexto da promessa comunitária.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Equivalente idiomático que comunica continuidade através de gerações sucessivas.
- source_word: נְסַפֵּר
  choice: anunciaremos
  rationale: No Piel, ספר pode indicar contar, relatar ou proclamar. “Anunciaremos” soa natural com “louvor” em português e conserva a ideia de torná-lo conhecido.
- source_word: תְּהִלָּתֶךָ
  choice: o teu louvor
  rationale: Mantém o singular do hebraico e sua ambiguidade entre o louvor dirigido a Deus e aquilo que nele é digno de louvor.
theological_decisions:
- issue: Metáfora pastoril aplicada ao povo de Deus
  choice: Manter explicitamente “o rebanho do teu pasto”
  alternative: as ovelhas do teu pasto
  rationale: A imagem apresenta a comunidade como pertencente a Deus e sustentada sob seu cuidado, sem acrescentar desenvolvimentos doutrinários posteriores.
- issue: Sentido de תְּהִלָּתֶךָ
  choice: Preservar a formulação “o teu louvor”
  alternative: os teus feitos dignos de louvor
  rationale: O substantivo hebraico permite referência tanto ao louvor prestado a Deus quanto ao conteúdo digno de louvor. A tradução escolhida conserva essa abertura sem explicá-la em excesso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “teu” mantém a referência direta a Deus sem a possível ambiguidade de “seu”. O paralelismo e a metáfora pastoril do hebraico foram preservados.
