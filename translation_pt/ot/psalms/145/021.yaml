base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: pt
  text: Minha boca falará o louvor de Yahweh, e toda carne[a] bendirá o seu santo nome para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as pessoas” ou “todo ser vivo”. Em hebraico, “toda carne”, expressão poética que se refere aos seres mortais.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת
  choice: o louvor de
  rationale: Preserva a relação construta com יְהוָה e indica o louvor dirigido a Yahweh, em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יְדַבֶּר
  choice: proclamará
  rationale: O imperfeito poético exprime aqui uma declaração ou resolução; “proclamará” comunica fala pública de louvor sem perder a imagem concreta do sujeito “minha boca”.
- source_word: פִּי
  choice: Minha boca
  rationale: Mantém a expressão concreta do hebraico, com o sufixo de primeira pessoa, em vez de reduzi-la simplesmente a “eu”.
- source_word: וִיבָרֵךְ
  choice: bendirá
  rationale: Mantém a coordenação futura com o primeiro verbo e expressa louvor dirigido a Deus; “bendizer” é claro e digno neste contexto.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Conserva a expressão poética hebraica e sua abrangência universal, sem decidir no corpo do texto se o referente é apenas a humanidade ou todos os seres mortais.
- source_word: שֵׁם קָדְשׁוֹ
  choice: o seu santo nome
  rationale: Expressão portuguesa natural que preserva a referência à identidade e reputação divinas caracterizadas pela santidade.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Reproduz de modo idiomático e enfático a duração sem fim indicada pela fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal, sem o substituir por um título.
- issue: Abrangência de כָּל בָּשָׂר
  choice: toda carne
  alternative: todas as pessoas; todo ser vivo
  rationale: A formulação literal preserva a possível abrangência da expressão poética hebraica e evita restringi-la silenciosamente à humanidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo poético, a imagem concreta de “minha boca” e a ambiguidade de “toda carne”.
