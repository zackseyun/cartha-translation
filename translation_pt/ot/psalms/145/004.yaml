    text: 'Ou: “Uma geração louvará as tuas obras à outra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os teus atos de poder” ou “as tuas proezas”.'
    reason: lexical_alternative
  revision_rationale: 'A reformulação resolve a discordância singular/plural e preserva o sentido distributivo e transmissivo de דור לדור: sucessivas gerações louvam as obras de Deus e tornam conhecidos os seus feitos poderosos. As alternativas lexicais e os respectivos marcadores foram mantidos.'
