  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: pt
  text: De geração em geração, louvarão as tuas obras[a] e anunciarão os teus feitos poderosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma geração louvará as tuas obras à outra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os teus atos de poder” ou “as tuas proezas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: Uma geração ... à outra
  rationale: Reproduz a relação expressa pela repetição de דּוֹר com a preposição לְ, indicando que uma geração transmite o louvor à seguinte, sem transformar a expressão em mera duração temporal.
- source_word: יְשַׁבַּח
  choice: louvará
  rationale: O piel de שׁבח exprime louvor enfático. O futuro é natural em português e mantém o valor geral ou prospectivo do imperfeito hebraico no contexto do salmo.
- source_word: מַעֲשֶׂיךָ
  choice: as tuas obras
  rationale: Mantém a forma nominal e o sentido amplo de מַעֲשֶׂה, que pode abranger tudo o que Deus fez.
- source_word: וּגְבוּרֹתֶיךָ
  choice: os teus feitos poderosos
  rationale: Comunica tanto as ações quanto a manifestação de força contida em גְּבוּרוֹת, em linguagem clara e digna.
- source_word: יַגִּידוּ
  choice: anunciarão
  rationale: O hifil de נגד significa tornar conhecido, contar ou declarar. “Anunciarão” conserva o plural hebraico e combina com o registro público e poético do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A mudança do singular em “louvará” para o plural em “anunciarão” preserva a concordância variável do texto hebraico, no qual “geração” funciona coletivamente.
