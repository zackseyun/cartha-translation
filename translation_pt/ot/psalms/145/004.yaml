review_pass:
  verdict: revise
  source_fidelity: O hebraico expressa a transmissão do louvor e da notícia dos atos poderosos de Deus entre gerações. A redação proposta preserva esse sentido, mas a alternância entre o singular «Uma geração» e o plural «anunciarão» fica sintaticamente problemática em português.
  naturalness: «Uma geração louvará à outra as tuas obras» é possível, mas de leitura algo marcada e a sequência com «anunciarão» sem sujeito plural expresso soa discordante. «De geração em geração, louvarão ... e anunciarão ...» é natural, poético e mantém o caráter iterativo e intergeracional da expressão hebraica.
  terminology: «Obras» traduz adequadamente מַעֲשֶׂיךָ; «feitos poderosos» traduz bem גְּבוּרוֹתֶיךָ; e «anunciarão» é apropriado para o hifil de נגד. As formas «tuas» mantêm registro bíblico moderno e são amplamente compreensíveis.
  issues:
  - severity: medium
    issue: Concordância e referência do segundo verbo
    rationale: O sujeito expresso «Uma geração» é singular, enquanto «anunciarão» está no plural. Embora o hebraico passe de um coletivo singular para um verbo plural, a reprodução literal dessa alternância não resulta natural nem clara em português.
  - severity: low
    issue: Ordem marcada em «louvará à outra as tuas obras»
    rationale: A construção pode ser entendida, mas em português contemporâneo a posição do objeto indireto antes do objeto direto torna a relação «louvar as obras a outra geração» menos imediata.
  revised_text: De geração em geração, louvarão as tuas obras[a] e anunciarão os teus feitos poderosos[b].
  revised_footnotes:
