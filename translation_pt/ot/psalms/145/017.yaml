  text: צַדִּ֣יק יְ֭הוָה בְּ/כָל דְּרָכָ֑י/ו וְ֝/חָסִ֗יד בְּ/כָל מַעֲשָֽׂי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: pt
  text: Yahweh é justo em todos os seus caminhos e fiel em todas as suas obras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondoso” ou “misericordioso”. Algumas traduções trazem “santo” neste versículo, seguindo uma tradição textual diferente da leitura do Texto Massorético, cujo sentido é “fiel, de amor constante”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa retidão moral e justiça; em português, “justo” é natural e teologicamente adequado neste contexto de louvor.
- source_word: בְּכָל
  choice: em todos/todas
  rationale: A preposição marca a esfera em que a afirmação se aplica, e a formulação portuguesa acompanha naturalmente os dois paralelos.
- source_word: דְּרָכָיו
  choice: seus caminhos
  rationale: Mantém a metáfora hebraica para a maneira de Deus agir, sem explicá-la em excesso.
- source_word: חָסִיד
  choice: fiel
  rationale: Comunica a lealdade e a bondade constante associadas a חֶסֶד, preservando o paralelismo com “justo”; “bondoso” e “misericordioso” também são possíveis.
- source_word: מַעֲשָׂיו
  choice: suas obras
  rationale: Conserva o paralelismo poético com “caminhos” e designa de modo digno os atos de Deus.
theological_decisions:
- issue: Sentido de חָסִיד aplicado ao caráter de Deus
  choice: fiel
  alternative: bondoso, misericordioso ou santo
  rationale: O Texto Massorético traz חָסִיד, termo ligado à lealdade e bondade constante. “Fiel” preserva esse sentido sem reduzi-lo a simples amabilidade. “Santo” reflete outra tradição textual e, por isso, é registrado na nota, não adotado no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A escolha “justo” tem ampla legibilidade brasileira; “obras” mantém o registro elevado sem soar arcaico.
