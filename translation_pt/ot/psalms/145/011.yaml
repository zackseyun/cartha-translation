  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: pt
  text: Falarão da glória do teu reino[a] e falarão do teu poder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do teu reinado» ou «da tua realeza».
    reason: lexical_alternative
  - marker: b
    text: Ou «a tua força»; o termo também pode referir-se a feitos poderosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: glória
  rationale: Preserva o sentido de majestade, honra e esplendor no contexto de louvor e forma uma expressão natural com «reino».
- source_word: מַלְכוּתְךָ
  choice: teu reino
  rationale: מַלְכוּת pode indicar reino, reinado ou realeza. «Teu reino» é claro e tradicional em português, sem excluir a ideia do governo exercido por Deus.
- source_word: יֹאמֵרוּ
  choice: falarão
  rationale: Expressa naturalmente o imperfeito hebraico neste contexto e mantém o primeiro membro do paralelismo poético.
- source_word: גְבוּרָתְךָ
  choice: teu poder
  rationale: גְּבוּרָה designa força ou poder e, às vezes, feitos poderosos. «Teu poder» conserva o substantivo abstrato singular e é corrente em português.
- source_word: יְדַבֵּרוּ
  choice: contarão
  rationale: No contexto de louvor, «contarão» comunica falar a respeito ou relatar, ao mesmo tempo que evita uma repetição pouco expressiva de «falarão»; não acrescenta necessariamente a força formal de «proclamarão».
theological_decisions:
- issue: Sentido de מַלְכוּת aplicado a Deus
  choice: teu reino
  alternative: teu reinado; tua realeza
  rationale: O termo hebraico pode apontar tanto para o domínio real quanto para o exercício da soberania. A tradução principal mantém a formulação concreta e familiar, enquanto a nota preserva a amplitude lexical sem impor uma leitura doutrinária mais estreita.
- issue: Sentido de גְּבוּרָה
  choice: teu poder
  alternative: tua força; teus feitos poderosos
  rationale: O singular hebraico favorece uma qualidade abstrata, mas o contexto também pode permitir a manifestação desse poder em atos. A tradução evita tornar explícitos «feitos» quando o texto não o faz.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa coerentes («teu»). O paralelismo foi preservado com verbos distintos e naturais. As notas mantêm abertas as nuances de governo, realeza, força e feitos poderosos.
