  text: רְצוֹן יְרֵאָ֥י/ו יַעֲשֶׂ֑ה וְֽ/אֶת שַׁוְעָתָ֥/ם יִ֝שְׁמַ֗ע וְ/יוֹשִׁיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: pt
  text: Ele realiza o desejo dos que o temem; ouve o seu clamor por socorro e os salva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os livra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: desejo
  rationale: Neste contexto, designa aquilo que os que temem a Deus desejam ou anseiam, e funciona naturalmente como objeto de יַעֲשֶׂה.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: Preserva a linguagem hebraica de temor a Deus e expressa de modo natural as pessoas caracterizadas por esse temor reverente.
- source_word: יַעֲשֶׂה
  choice: realiza
  rationale: Embora o verbo signifique literalmente “faz”, com “desejo” o português idiomático pede “realiza”, sem alterar o sentido.
- source_word: שַׁוְעָתָם
  choice: seu clamor por socorro
  rationale: O substantivo indica um clamor angustiado que apela por ajuda ou livramento; “clamor por socorro” explicita essa força contextual.
- source_word: יִשְׁמַע
  choice: ouve
  rationale: Mantém o sentido lexical básico do verbo, enquanto o contexto comunica que se trata de uma escuta atenta e responsiva.
- source_word: וְיוֹשִׁיעֵם
  choice: e os salva
  rationale: A forma causativa de יָשַׁע denota salvar ou livrar. “Salva” preserva a amplitude do termo, sem excluir o livramento concreto da aflição.
theological_decisions:
- issue: Tradução da linguagem de ירא para caracterizar os fiéis
  choice: os que o temem
  alternative: os que o reverenciam
  rationale: “Temem” conserva a terminologia explícita do hebraico e sua tensão entre temor, reverência e fidelidade, sem suavizá-la interpretativamente.
- issue: Alcance da ação divina em וְיוֹשִׁיעֵם
  choice: e os salva
  alternative: e os livra
  rationale: “Salva” mantém a amplitude e a ressonância teológica do verbo, enquanto a nota registra “livra” como alternativa contextual legítima ligada ao socorro na aflição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem poética e o paralelismo do hebraico foram preservados sem literalismo rígido.
