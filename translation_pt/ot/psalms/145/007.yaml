base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: pt
  text: Farão jorrar a lembrança da tua imensa bondade[a] e cantarão de alegria por tua justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Proclamarão a memória da tua grande bondade”.'
    reason: Alternativa lexical que torna explícito o sentido verbal da imagem hebraica e traduz רַב por “grande”.
  - marker: b
    text: 'Ou: “a tua retidão”.'
    reason: Alternativa legítima para צדקה, destacando a retidão moral em vez do aspecto mais diretamente associado à justiça.
lexical_decisions:
- source_word: זֵכֶר
  choice: a lembrança
  rationale: O substantivo pode indicar lembrança, memória ou menção comemorativa. “Lembrança” preserva a ideia de trazer à fala aquilo que se recorda da bondade de Deus, sem substituí-la pela noção mais interpretativa de “fama”.
- source_word: רַב טוּבְךָ
  choice: tua imensa bondade
  rationale: רַב expressa grandeza ou abundância, e טוּב designa bondade, inclusive a bondade manifestada em benefícios. “Imensa bondade” é natural em português e conserva a amplitude da expressão.
- source_word: יַבִּיעוּ
  choice: farão jorrar
  rationale: A forma verbal de נבע evoca algo que brota ou jorra. A tradução mantém a metáfora vívida de louvor abundante, em vez de reduzi-la ao sentido mais genérico de “dirão” ou “proclamarão”.
- source_word: וְצִדְקָתְךָ
  choice: a tua justiça
  rationale: צדקה abrange justiça e retidão, podendo referir-se tanto ao caráter moralmente reto de Deus quanto aos seus atos justos. “Justiça” é o correspondente bíblico mais amplo e reconhecível em português; “retidão” é mantida como alternativa.
- source_word: יְרַנֵּנוּ
  choice: cantarão com alegria
  rationale: O verbo רנן denota uma expressão sonora e jubilosa, cantada ou aclamada. “Cantarão com alegria” é idiomático no contexto dos Salmos e se ajusta ao paralelismo de louvor verbal.
theological_decisions:
- issue: Amplitude de צדקה no contexto de louvor
  choice: a tua justiça
  alternative: a tua retidão
  rationale: O termo hebraico reúne dimensões morais e judiciais. “Justiça” preserva essa amplitude no uso bíblico português, enquanto “retidão” destaca mais diretamente o caráter reto de Deus; a alternativa é registrada para não eliminar essa tensão semântica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A imagem poética de algo que “jorra” foi preservada, bem como o paralelismo entre proclamação abundante e canto jubiloso.
