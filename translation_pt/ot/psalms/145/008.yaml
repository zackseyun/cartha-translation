source:
  edition: WLC
  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: pt
  text: Yahweh é gracioso e compassivo, lento para irar-se e grande em amor leal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abundante em amor leal”. A expressão hebraica pode destacar tanto a grandeza quanto a abundância desse amor leal.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: cheio de graça
  rationale: Expressa aquele que concede favor e graça. Evita a possível ambiguidade de “gracioso” no português moderno e mantém a distinção em relação a רַחוּם.
- source_word: רַחוּם
  choice: compassivo
  rationale: Comunica compaixão profunda e misericordiosa em linguagem clara e atual, sem fundir o termo com חַנּוּן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lento para irar-se
  rationale: Equivalente idiomático natural da expressão hebraica, literalmente ligada à demora da ira, preservando a ideia de paciência diante da provocação.
- source_word: גְדָל
  choice: grande
  rationale: Preserva diretamente a noção de magnitude; “abundante” também é possível e fica registrada em nota.
- source_word: חָסֶד
  choice: amor leal
  rationale: Representa de modo conciso o amor bondoso, duradouro e fiel associado ao termo, sem restringi-lo apenas a misericórdia ou a uma formulação doutrinária específica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Amplitude semântica de חָסֶד
  choice: amor leal
  alternative: misericórdia; bondade fiel
  rationale: “Amor leal” conserva tanto a dimensão afetiva quanto a constância e fidelidade do termo, sem resolver de forma estreita sua riqueza semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cheio de graça” evita o sentido secular ambíguo de “gracioso”; “lento para irar-se” mantém o conhecido paralelismo bíblico sem soar arcaico.
