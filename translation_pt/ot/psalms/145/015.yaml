source:
  edition: WLC
  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: pt
  text: Os olhos de todos esperam em ti,[a] e tu lhes dás o alimento no tempo certo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «olham para ti com expectativa», «aguardam por ti» ou «põem a esperança em ti». O verbo hebraico indica espera confiante.
    reason: lexical_alternative
  - marker: b
    text: Ou «no devido tempo» ou «na ocasião própria».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Os olhos de todos
  rationale: Preserva a imagem poética do hebraico e mantém amplo o referente de כֹל, sem acrescentar «pessoas» ou «criaturas».
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: esperam em ti
  rationale: O verbo יְשַׂבֵּרוּ expressa espera confiante ou expectativa. Em português, «os olhos... esperam em ti» conserva a imagem e comunica dependência esperançosa sem explicá-la em excesso.
- source_word: וְאַתָּה נֹתֵן
  choice: e tu lhes dás
  rationale: O particípio נֹתֵן descreve a ação habitual ou contínua de Deus; o presente simples é natural em português. Mantém-se a conjunção coordenativa simples.
- source_word: אָכְלָם
  choice: o alimento
  rationale: O termo indica comida ou alimento em sentido geral, não especificamente pão. O pronome «lhes» já identifica os beneficiários, evitando a formulação menos fluida «o alimento deles».
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: Expressa de modo natural o momento apropriado ou devido. O sufixo singular hebraico admite relação com o alimento, sua provisão ou o tempo designado, sem exigir a expressão pouco idiomática «em seu tempo».
theological_decisions:
- issue: Alcance de «todos» na provisão divina
  choice: Manter «todos» sem explicitar o referente
  alternative: todos os seres vivos; todas as pessoas
  rationale: O hebraico deixa implícito o referente. Embora o contexto favoreça uma abrangência ampla da criação vivente, especificá-la no versículo resolveria o que o texto mantém aberto.
- issue: Nuance da espera dirigida a Deus
  choice: esperam em ti
  alternative: olham para ti; aguardam por ti; põem a esperança em ti
  rationale: A escolha conserva a expectativa confiante do verbo sem transformar a metáfora dos olhos numa afirmação doutrinária mais explícita do que o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome «ti» preserva o tratamento singular dirigido a Deus e combina com o tom poético. As notas mantêm as principais alternativas lexicais sem sobrecarregar o texto.
