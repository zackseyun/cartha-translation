base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: pt
  text: Abres a tua mão e satisfazes o desejo de todo ser vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “satisfazes todo ser vivo com favor” ou “com boa vontade”. O substantivo hebraico pode significar “desejo”, “favor” ou “boa vontade”; neste contexto, “desejo” se ajusta melhor ao cuidado de Deus por todas as criaturas.'
    reason: Alternativa lexical e sintática de רָצוֹן.
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: Abres
  rationale: O particípio qal descreve poeticamente uma ação contínua ou habitual de Deus; o presente simples é natural em português e preserva esse valor.
- source_word: יָדֶךָ
  choice: a tua mão
  rationale: Mantém a imagem corporal concreta do hebraico, clara e poética em português.
- source_word: וּמַשְׂבִּיעַ
  choice: e satisfazes
  rationale: O hifil de שׂבע expressa fazer ficar satisfeito ou saciado; “satisfazes” preserva o sentido causativo e combina naturalmente com “desejo”.
- source_word: לְכָל חַי
  choice: de todo ser vivo
  rationale: O adjetivo חַי é substantivado e abrange toda criatura viva; “todo ser vivo” comunica naturalmente esse alcance universal.
- source_word: רָצוֹן
  choice: desejo
  rationale: No contexto do cuidado providencial de Deus por todas as criaturas, o termo provavelmente indica aquilo de que elas têm desejo; contudo, sua amplitude lexical é preservada em nota.
theological_decisions:
- issue: Descrição antropomórfica de Deus
  choice: Conservar a imagem literal “a tua mão”.
  alternative: Tu provês generosamente.
  rationale: O hebraico emprega uma imagem corporal concreta para retratar o cuidado sustentador de Deus. Mantê-la preserva a força poética sem acrescentar uma afirmação doutrinária sobre corporeidade.
- issue: Sentido de רָצוֹן
  choice: “desejo” como objeto satisfeito em cada ser vivo.
  alternative: “favor” ou “boa vontade” como aquilo com que Deus satisfaz cada ser vivo.
  rationale: A sintaxe e o contexto permitem mais de uma relação semântica. “Desejo” se ajusta bem ao tema da provisão divina, mas a alternativa genuína é registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “tu” para corresponder à segunda pessoa singular do hebraico e manter o paralelismo verbal “abres... satisfazes”. A formulação conserva a concisão e a imagem poética do original.
