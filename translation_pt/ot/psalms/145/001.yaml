id: PSA.145.1
reference: Psalms 145:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: pt
  text: Louvor de Davi[a]. Eu te exaltarei, meu Deus, o Rei[b], e bendirei o teu nome para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi”; nos títulos dos salmos, לְדָוִד pode indicar autoria ou associação.
    reason: alternative_reading
  - marker: b
    text: Ou “meu Deus e Rei”. O hebraico diz mais literalmente “meu Deus, o Rei”.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Louvor
  rationale: Mantém a forma nominal singular do título e soa natural como cabeçalho de um salmo.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria ou associação; “de Davi” preserva melhor essa abertura do que “por Davi”.
- source_word: אֲרוֹמִמְךָ
  choice: Eu te exaltarei
  rationale: Expressa a ideia de elevar ou engrandecer em linguagem de adoração, com naturalidade e dignidade em português.
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: meu Deus, o Rei
  rationale: Preserva a aposição hebraica e o artigo definido em “o Rei”, sem acrescentar a conjunção ou um segundo possessivo.
- source_word: וַאֲבָרֲכָה
  choice: e bendirei
  rationale: Conserva o sentido cultual de ברך dirigido a Deus e acompanha adequadamente a força volitiva/futura da forma verbal.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém o importante idioma bíblico do nome como expressão da identidade e reputação reveladas.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente e solene que comunica a duração intensificada da fórmula hebraica.
theological_decisions:
- issue: Relação entre “meu Deus” e “o Rei” no vocativo
  choice: meu Deus, o Rei
  alternative: meu Deus e Rei; meu Deus Rei
  rationale: O hebraico apresenta “o Rei” em aposição a “meu Deus”. A tradução mantém essa identificação sem inserir uma coordenação ausente nem eliminar o artigo.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. “Bendirei” preserva a linguagem bíblica cultual sem recorrer a formulação arcaizante; “para todo o sempre” mantém a solenidade poética.
