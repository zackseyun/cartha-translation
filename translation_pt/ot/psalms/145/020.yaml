  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: pt
  text: Yahweh guarda todos os que o amam, mas destruirá todos os perversos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e destruirá todos os perversos”. A conjunção hebraica é simplesmente “e”, mas aqui tem sentido contrastivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: guarda
  rationale: O particípio de שׁמר expressa uma ação contínua de guardar, proteger e conservar. “Guarda” é natural em português, comunica cuidado protetor e mantém a concisão poética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: todos os que o amam
  rationale: A forma participial significa literalmente os que o amam; a oração relativa é a expressão mais natural e clara em português.
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: mas todos os perversos
  rationale: Embora ו seja formalmente “e”, a relação entre as duas orações é de contraste. “Mas” torna explícita a antítese poética sem alterar seu conteúdo.
- source_word: יַשְׁמִיד
  choice: destruirá
  rationale: O hifil de שׁמד indica causar destruição. “Destruirá” conserva a força do verbo sem especificar um modo ou alcance além do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, em vez de substituí-lo por um título.
- issue: Valor da conjunção antes da segunda oração
  choice: contraste adversativo (“mas”)
  alternative: coordenação simples (“e”)
  rationale: 'A conjunção hebraica é literalmente “e”, mas aqui liga ações opostas: guardar os que amam Yahweh e destruir os perversos. A nota preserva a alternativa formal.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada na segunda oração para soar natural sem perder a ênfase abrangente de “todos”.
