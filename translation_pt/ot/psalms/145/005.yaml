lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: o esplendor glorioso da tua majestade
  rationale: A sequência enfática reúne termos de esplendor, glória e majestade. A formulação portuguesa preserva sua intensidade e seu caráter régio sem produzir uma cadeia nominal pesada.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: e nas tuas obras maravilhosas
  rationale: דִבְרֵי pode significar palavras, assuntos ou relatos; ligado a נִפְלְאוֹתֶיךָ, aponta para os feitos extraordinários de Deus como tema da meditação ou fala. A tradução direta é natural e mantém a concretude das ações divinas.
- source_word: אָשִׂיחָה
  choice: Meditarei
  rationale: O verbo שׂיח pode denotar meditar, refletir, falar ou discorrer. “Meditarei” combina com os temas sobre os quais o salmista se concentra, enquanto a possível nuance verbal é preservada em nota.
