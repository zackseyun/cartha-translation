  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: pt
  text: Todas as tuas obras te darão graças, ó Yahweh[a], e os teus fiéis te abençoarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Ou “os que te são leais”. O termo hebraico se refere aos que demonstram fidelidade e devoção no âmbito da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: te darão graças
  rationale: O hifil de ידה expressa dar graças ou louvar. “Dar graças” mantém a distinção em relação a “bendizer” no segundo segmento e preserva o sufixo de segunda pessoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: כָּל מַעֲשֶׂיךָ
  choice: todas as tuas obras
  rationale: Reproduz naturalmente em português o alcance coletivo de כָּל e o sentido amplo de מַעֲשֶׂיךָ, que pode abranger aquilo que Deus fez e suas realizações.
- source_word: וַחֲסִידֶיךָ
  choice: os teus fiéis
  rationale: חסידים designa pessoas caracterizadas por lealdade, devoção e fidelidade no âmbito da aliança. “Fiéis” é claro e evita associações eclesiásticas mais específicas de “santos”.
- source_word: יְבָרֲכוּכָה
  choice: te bendirão
  rationale: O piel de ברך significa bendizer neste contexto. “Bendizer” comunica de modo digno a atribuição de louvor a Deus e mantém o paralelismo verbal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal, enquanto “SENHOR” representa a leitura substitutiva tradicional.
- issue: Sentido de חֲסִידֶיךָ
  choice: os teus fiéis
  alternative: os teus santos; os que te são leais
  rationale: A escolha conserva a ideia de devoção e lealdade da aliança sem impor ao termo uma definição eclesiológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal é natural, e “ó Yahweh” preserva o vocativo explícito pela forma poética, embora o hebraico não use uma partícula vocativa separada.
