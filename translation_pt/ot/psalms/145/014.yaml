  source_fidelity: 'O texto transmite com precisão o paralelismo hebraico: Yahweh é apresentado como aquele que ampara/sustenta os que caem ou estão caindo e levanta os que estão encurvados. «Estão caindo» preserva legitimamente o valor aspectual possível do particípio הַנֹּפְלִים, sem reduzir o sentido a pessoas que já caíram. «Encurvados» mantém a imagem concreta e sua possível extensão figurada, sem interpretar a causa como opressão.'
