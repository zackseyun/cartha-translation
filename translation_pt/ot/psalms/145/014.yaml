  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: pt
  text: Yahweh ampara todos os que estão caindo e levanta todos os que estão encurvados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sustém todos os que caem”. O particípio hebraico pode ser entendido em sentido mais geral ou como uma ação em curso.'
    reason: alternativa lexical e aspectual
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: סוֹמֵךְ
  choice: ampara
  rationale: O particípio indica a ação contínua de dar apoio ou sustentação; “ampara” é natural em português e combina com pessoas que estão caindo.
- source_word: לְכָל
  choice: todos
  rationale: A preposição introduz o conjunto alcançado pela ação verbal; em português idiomático, o objeto direto transmite adequadamente essa relação.
- source_word: הַנֹּפְלִים
  choice: os que estão caindo
  rationale: A forma participial pode retratar uma ação em curso. Esta tradução preserva essa nuance sem limitar o sentido aos que já caíram.
- source_word: זוֹקֵף
  choice: levanta
  rationale: O verbo expressa fazer alguém ficar ereto ou pô-lo de pé; “levanta” comunica com naturalidade a restauração em paralelo com “encurvados”.
- source_word: הַכְּפוּפִים
  choice: os que estão encurvados
  rationale: Mantém a imagem de pessoas dobradas para baixo e permite tanto uma leitura física quanto figurada, sem especificar indevidamente a causa dessa condição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Aspecto do particípio הַנֹּפְלִים
  choice: os que estão caindo
  alternative: os que caem
  rationale: A formulação principal destaca a possível ação em curso, enquanto a alternativa permite o sentido geral ou habitual. A nota preserva essa ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A imagem concreta do paralelismo hebraico foi preservada.
