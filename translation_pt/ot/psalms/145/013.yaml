  - marker: b
    text: 'Ou: “de geração em geração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתְךָ
  choice: O teu reino
  rationale: מַלְכוּת pode indicar reino, realeza ou reinado. “Reino” é natural em português, mantém tanto a ideia do governo real quanto a sua esfera e forma um paralelo adequado com “domínio”.
- source_word: מַלְכוּת
  choice: é reino
  rationale: A repetição de מַלְכוּת dá ênfase ao verso. Preservá-la — “O teu reino é reino” — reproduz melhor a força poética do hebraico do que reduzi-la a “O teu reino é eterno”.
- source_word: כָּל עֹלָמִים
  choice: de todos os tempos
  rationale: O plural עֹלָמִים expressa duração ilimitada, abrangendo todas as eras. “De todos os tempos” conserva a construção e a amplitude temporal do hebraico, sem perder a naturalidade em português.
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: e o teu domínio
  rationale: מֶמְשָׁלָה designa autoridade governante ou domínio. “Domínio” mantém o registro poético elevado e faz bom paralelo com “reino”, sem sugerir apenas uma estrutura administrativa.
- source_word: בְּכָל דּוֹר וָדֹר
  choice: por todas as gerações
  rationale: A expressão significa literalmente “em toda geração e geração” e indica continuidade ao longo de gerações sucessivas. “Por todas as gerações” comunica essa duração e permite manter o paralelismo sem acrescentar um verbo ausente no hebraico.
theological_decisions:
- issue: A duração do reinado de Deus
  choice: A tradução afirma que o reino e o domínio de Deus abrangem todos os tempos e todas as gerações, preservando a repetição e o paralelismo do poema hebraico.
  alternative: O teu reino é um reino eterno, e o teu domínio permanece de geração em geração.
  rationale: O hebraico declara a duração ilimitada do governo de Deus, mas o faz por meio de expressões temporais e de uma oração nominal. A redação escolhida evita substituir essa textura poética por uma formulação teológica mais convencional ou acrescentar um verbo não expresso.
translation_notes:
  register: Português moderno, claro e poético, com formas amplamente compreensíveis no Brasil e em outras comunidades lusófonas. O pronome “teu” conserva a segunda pessoa singular do hebraico. A elipse verbal no segundo verso reflete o paralelismo nominal da fonte sem soar artificial.
