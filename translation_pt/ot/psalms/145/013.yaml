  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: pt
  text: 'O teu reino é um reino de todos os tempos[a],

    e o teu domínio estende-se por todas as gerações[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O teu reino é um reino eterno”. O hebraico diz literalmente: “O teu reino é reino de todos os tempos”.'
