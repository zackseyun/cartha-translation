source:
  edition: WLC
  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: pt
  text: Yahweh é bom para todos, e suas misericórdias[a] estão sobre todas as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua compaixão” ou “sua terna misericórdia”. O hebraico emprega uma forma plural, ressaltando a abundância de seus atos de compaixão.
    reason: alternativa lexical
lexical_decisions:
- source_word: טוֹב
  choice: bom
  rationale: Reproduz diretamente a bondade moral e beneficente expressa pelo adjetivo, sem restringi-la apenas à bondade prática ou à gentileza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לַכֹּל
  choice: para todos
  rationale: Expressa de modo natural em português a relação e o alcance universal da bondade de Yahweh.
- source_word: רַחֲמָיו
  choice: suas misericórdias
  rationale: Preserva o plural hebraico e comunica as abundantes manifestações de compaixão, sem reduzir o termo a um único sentimento abstrato.
- source_word: עַל
  choice: sobre
  rationale: Mantém a imagem espacial do hebraico, segundo a qual as misericórdias de Yahweh se estendem sobre tudo o que ele fez.
- source_word: כָּל
  choice: todas
  rationale: Conserva a força universal e a repetição poética de כֹּל na primeira metade do verso.
- source_word: מַעֲשָׂיו
  choice: suas obras
  rationale: É conciso, preserva o registro poético e, neste contexto, abrange naturalmente tudo o que Yahweh criou.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. A transliteração “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Alcance de כֹּל nas duas metades do verso
  choice: todos / todas as suas obras
  alternative: alguns grupos específicos / apenas certas obras
  rationale: A repetição hebraica de כֹּל apresenta uma afirmação de alcance universal. A tradução conserva esse alcance sem definir aqui como ele se relaciona com outras afirmações teológicas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “estão sobre” conserva deliberadamente a imagem poética do hebraico; o plural “misericórdias” preserva uma nuance relevante do texto-fonte.
