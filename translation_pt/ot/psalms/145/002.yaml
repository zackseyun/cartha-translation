  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: pt
  text: Todos os dias[a] eu te bendirei e louvarei o teu nome[b] para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A cada dia” ou “Dia após dia”.
    reason: lexical_alternative
  - marker: b
    text: Na linguagem bíblica, o “nome” de Deus representa também seu caráter revelado e sua reputação.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/כָל יוֹם
  choice: Todos os dias
  rationale: A expressão significa literalmente “em cada dia” e, de modo idiomático, indica repetição diária. “Todos os dias” é natural em português e preserva esse sentido habitual.
- source_word: אֲבָרֲכֶךָּ
  choice: eu te bendirei
  rationale: O verbo ברך no piel significa “abençoar” ou, quando dirigido a Deus, “bendizer”. “Bendirei” comunica com clareza o ato de louvar e honrar Deus, mantendo a força futura-volitiva da forma poética.
- source_word: וַאֲהַלְלָה
  choice: e louvarei
  rationale: O verbo הלל no piel significa “louvar”. Em paralelo com “bendirei”, a forma tem força futura-volitiva; “louvarei” é corrente, claro e fiel.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: A tradução conserva o substantivo concreto “nome”, que na linguagem bíblica também abrange o caráter revelado e a reputação de Deus, sem reduzir a expressão a uma simples referência pronominal.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão hebraica combinada intensifica a duração ilimitada. “Para todo o sempre” é uma formulação portuguesa estabelecida, natural e enfática.
theological_decisions:
- issue: Referência direta a Deus sem acrescentar um título
  choice: te
  alternative: a ti, ó Deus; a ti, meu Deus e Rei
  rationale: O sufixo hebraico se dirige diretamente a Deus, mas o versículo não repete nenhum título. A tradução preserva a segunda pessoa sem importar palavras do versículo anterior.
- issue: Linguagem relativa ao “nome” de Deus
  choice: o teu nome
  alternative: a ti; a tua fama
  rationale: O texto fala de louvar o “nome” de Deus, expressão biblicamente rica que remete à sua pessoa, ao seu caráter revelado e à sua reputação. Preservar “nome” mantém essa amplitude e evita interpretar demais.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e ampla compreensão internacional. O uso de “te” e “teu” mantém a oração direta e evita a ambiguidade que “você” poderia introduzir no registro devocional. A coordenação enxuta de “bendirei e louvarei” reproduz o paralelismo poético hebraico.
