  text: לְ/הוֹדִ֤יעַ לִ/בְנֵ֣י הָ֭/אָדָם גְּבוּרֹתָ֑י/ו וּ֝/כְב֗וֹד הֲדַ֣ר מַלְכוּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: pt
  text: para dar a conhecer aos filhos do homem[a] os seus atos poderosos e o glorioso esplendor do seu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à humanidade” ou “aos seres humanos”. O hebraico diz literalmente “aos filhos do homem”, expressão genérica para os seres humanos.
    reason: Alternativa lexical que esclarece o sentido inclusivo da expressão hebraica.
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: para dar a conhecer
  rationale: O infinitivo hifil de ידע tem sentido causativo, “fazer saber”. “Dar a conhecer” preserva essa força e soa natural e digna em português.
- source_word: לִבְנֵי הָאָדָם
  choice: aos filhos do homem
  rationale: Conserva no texto a forma hebraica, uma expressão masculina representativa que aqui designa os seres humanos em geral; a nota esclarece o sentido inclusivo.
- source_word: גְּבוּרֹתָיו
  choice: os seus atos poderosos
  rationale: גְּבוּרוֹת denota feitos ou manifestações de poder. “Atos poderosos” é claro, preciso e adequado ao contexto de louvor.
- source_word: וּכְבוֹד הֲדַר
  choice: e o esplendor glorioso
  rationale: A formulação preserva os elementos semânticos de כָּבוֹד, “glória”, e הָדָר, “esplendor/majestade”, evitando a construção pouco natural “a glória do esplendor”.
- source_word: מַלְכוּתוֹ
  choice: do seu reino
  rationale: מַלְכוּת pode indicar reino, realeza ou reinado. “Reino” é natural no contexto régio do salmo e pode abranger tanto o domínio quanto o governo de Deus.
theological_decisions:
- issue: Expressão humana genérica em לִבְנֵי הָאָדָם
  choice: Manter “aos filhos do homem” no texto principal
  alternative: “à humanidade” ou “aos seres humanos”
  rationale: A expressão hebraica emprega linguagem masculina representativa, mas refere-se genericamente a toda a humanidade. A tradução conserva sua forma e deixa explícito em nota o alcance inclusivo, sem restringi-la aos homens.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e preserva tanto a imagem régia quanto a expressão antropológica do hebraico.
