  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: pt
  text: Falarão do poder dos teus feitos temíveis[a], e eu contarei a tua grandeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «teus feitos que inspiram temor» ou «teus feitos impressionantes». O hebraico se refere a atos que despertam temor reverente e assombro.
    reason: lexical_alternative
  - marker: b
    text: Ou «teus grandes feitos». O termo hebraico pode indicar tanto a grandeza em sentido abstrato quanto as grandes coisas que Deus fez.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶעֱזוּז
  choice: do poder
  rationale: עֱזוּז expressa força, poder ou vigor; a construção «o poder dos» preserva sua relação com os feitos que seguem e soa natural em português.
- source_word: נוֹרְאֹתֶיךָ
  choice: dos teus feitos temíveis
  rationale: A forma derivada de ירא designa atos que despertam temor, reverência e assombro. «Feitos temíveis» conserva essa intensidade sem reduzir o sentido apenas a maravilhas.
- source_word: יֹאמֵרוּ
  choice: Falarão
  rationale: O imperfeito na sequência poética pode expressar ação futura ou habitual. «Falarão» acomoda naturalmente o assunto introduzido por «do» e mantém o paralelismo verbal.
- source_word: וּגְדוּלָּתְךָ
  choice: a tua grandeza
  rationale: גְּדוּלָּה pode indicar grandeza ou grandes feitos. O substantivo abstrato preserva a leitura direta e a tensão lexical do hebraico; a alternativa é registrada em nota.
- source_word: אֲסַפְּרֶנָּה
  choice: eu contarei
  rationale: No piel, ספר significa contar, narrar ou proclamar. «Contarei» é claro, digno e mantém o sentido de relatar publicamente.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com colocação pronominal de ampla legibilidade. «Temíveis» preserva o temor reverente do hebraico; as notas mantêm abertas as ambiguidades genuínas de נוֹרָאוֹת e גְּדוּלָּה.
