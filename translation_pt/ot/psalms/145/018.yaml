  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: pt
  text: Yahweh está perto de todos os que o invocam, de todos os que o invocam em verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sinceridade”, “fielmente” ou “de verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: está perto
  rationale: O adjetivo predicativo significa “perto/próximo”. “Está perto” é natural em português e preserva tanto a ideia de proximidade quanto sua dimensão relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְכָל
  choice: de todos
  rationale: Com “estar perto”, o português idiomático pede “perto de”; a repetição de “todos” conserva a abrangência e o paralelismo hebraicos.
- source_word: קֹרְאָיו
  choice: os que o invocam
  rationale: Neste contexto de oração e apelo a Deus, “invocar” expressa com naturalidade o sentido religioso de קרא e representa o sufixo pronominal “o”.
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: os que o invocam
  rationale: A repetição mantém o paralelismo poético e a intensificação do segundo membro.
- source_word: בֶאֱמֶת
  choice: de verdade
  rationale: Expressão portuguesa natural que mantém a abertura semântica entre veracidade, sinceridade e fidelidade, sem restringir o texto a apenas uma dessas nuances.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance da proximidade divina
  choice: Manter “todos os que o invocam”, qualificado por “de verdade”
  alternative: Restringir implicitamente o grupo aos membros da aliança; ou universalizar a afirmação sem a condição expressa
  rationale: O próprio verso define o alcance e sua qualificação. A tradução preserva essa tensão sem impor um sistema teológico mais estreito ou mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Invocam” conserva o sentido devocional sem soar excessivamente técnico; “de verdade” é corrente e permite que a nota explicite as demais nuances de אֱמֶת.
