  terminology: “Yahweh” segue adequadamente a decisão de transliterar o Tetragrama. “Invocam” mantém o sentido de apelo religioso sem introduzir interpretação doutrinária. “Em verdade” preserva a ambiguidade entre verdade, sinceridade e fidelidade, explicitável em nota.
