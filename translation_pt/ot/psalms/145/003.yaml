  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד וְ֝/לִ/גְדֻלָּת֗/וֹ אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: pt
  text: Grande é Yahweh e muito digno de louvor; sua grandeza é insondável.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e não há como sondar a sua grandeza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grande
  rationale: Adjetivo predicativo em posição inicial; “Grande” preserva de modo direto tanto a magnitude quanto a majestade expressas no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do Tetragrama, em vez de substituí-lo por um título.
- source_word: מְהֻלָּל מְאֹד
  choice: muito digno de louvor
  rationale: Expressa naturalmente em português a força predicativa do particípio passivo intensificado por מְאֹד, evitando que “muito louvado” sugira apenas o fato de receber louvores.
- source_word: לִגְדֻלָּתוֹ
  choice: sua grandeza
  rationale: Reproduz o substantivo גדלה com o sufixo de terceira pessoa; a preposição ל é acomodada à sintaxe natural da oração portuguesa.
- source_word: אֵין חֵקֶר
  choice: é insondável
  rationale: Forma concisa e idiomática de dizer que a grandeza de Yahweh não pode ser plenamente investigada ou perscrutada; a formulação mais literal é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo pelo título “SENHOR”.
- issue: Alcance de אֵין חֵקֶר
  choice: sua grandeza é insondável
  alternative: não há como sondar a sua grandeza
  rationale: A tradução conserva a afirmação de que a grandeza divina está além da investigação plena, sem explicá-la como uma tese filosófica mais específica sobre infinitude.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O paralelismo foi mantido, e o ponto e vírgula distingue as duas afirmações coordenadas sem apagar sua ligação.
