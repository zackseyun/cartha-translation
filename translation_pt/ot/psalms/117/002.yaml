source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: pt
  text: Pois o seu amor leal prevaleceu sobre nós, e a fidelidade[a] de Yahweh dura para sempre. Louvem Yah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “verdade”.
    reason: אֱמֶת pode significar tanto “fidelidade” quanto “verdade”; neste contexto, os dois sentidos permanecem pertinentes.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado universal ao louvor no versículo anterior e mantém o encadeamento poético.
- source_word: גָבַר עָלֵינוּ
  choice: prevaleceu sobre nós
  rationale: Preserva a força verbal de גבר, que comunica poder, superioridade ou prevalência, e mantém a construção com על, sem reduzi-la simplesmente a “é grande para conosco”.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: Expressa tanto o afeto quanto a lealdade duradoura de חֶסֶד em linguagem portuguesa atual e acessível.
- source_word: וֶאֱמֶת
  choice: e a fidelidade[a]
  rationale: No par com חֶסֶד, אֱמֶת ressalta especialmente a confiabilidade e constância de Yahweh. A alternativa mais formal “verdade” é preservada em nota para não eliminar a amplitude lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Comunica naturalmente em português a permanência contínua expressa pela locução hebraica.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz o imperativo plural e preserva a forma abreviada do nome divino, Yah.
theological_decisions:
- issue: Sentido de אֱמֶת no par חֶסֶד וֶאֱמֶת
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” torna clara a confiabilidade pactual sugerida pelo contexto, enquanto a nota conserva o sentido literal igualmente possível de “verdade”.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto usa o nome próprio divino; preservá-lo evita substituí-lo por um título e mantém a distinção em relação à forma abreviada יָהּ no fim do versículo.
- issue: Força da expressão גָבַר עָלֵינוּ
  choice: prevaleceu sobre nós
  alternative: é grande para conosco
  rationale: A tradução escolhida conserva a imagem hebraica de força vitoriosa ou predominante, embora a formulação alternativa seja mais tradicional e explicite uma orientação benéfica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amor leal” comunica o valor relacional de חֶסֶד sem recorrer a terminologia confessional. A formulação “prevaleceu sobre nós” mantém deliberadamente a imagem forte e pouco domesticada do hebraico.
