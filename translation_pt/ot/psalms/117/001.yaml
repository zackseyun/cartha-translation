  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: pt
  text: 'Louvem a Yahweh[a], todas as nações;

    exaltem-no, todos os povos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yahweh”; tradicionalmente traduzido por “SENHOR”. O nome divino é YHWH.'
    reason: Explicar a forma do nome divino e registrar a tradução tradicional.
lexical_decisions:
- source_word: הַֽלְל֣וּ
  choice: Louvem
  rationale: Imperativo plural piel de הלל, uma convocação direta ao louvor. “Louvem” é natural, claro e mantém a força exortativa.
- source_word: אֶת יְ֭הוָה
  choice: a Yahweh
  rationale: O marcador de objeto direto introduz o nome divino YHWH. A transliteração “Yahweh” preserva o nome próprio presente no hebraico.
- source_word: כָּל גּוֹיִ֑ם
  choice: todas as nações
  rationale: גּוֹיִם designa nações ou grupos nacionais. “Todas as nações” expressa a convocação universal e mantém alguma distinção em relação a אֻמִּים no segundo membro.
- source_word: שַׁ֝בְּח֗וּהוּ
  choice: exaltem-no
  rationale: Imperativo plural de שבח com sufixo masculino singular. “Exaltem-no” comunica louvor enfático e reproduz a variação verbal do paralelismo hebraico.
- source_word: כָּל הָאֻמִּֽים
  choice: todos os povos
  rationale: אֻמִּים refere-se a povos ou comunidades étnicas. “Todos os povos” forma um paralelo natural com “todas as nações” sem apagar a diferença lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio; a nota registra a convenção tradicional “SENHOR” e identifica YHWH.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético é preservado por “nações/povos” e pela variação “louvem/exaltem”.
