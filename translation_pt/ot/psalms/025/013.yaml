base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: pt
  text: 'Sua alma permanecerá no bem[b],

    e sua descendência herdará a terra[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Terra”. O hebraico אֶרֶץ pode significar “terra”, “país” ou “a Terra”; neste contexto, “a terra” combina melhor com a linguagem da aliança de herdar.
    reason: alternative_reading
  - marker: b
    text: Ou “passará a noite” ou “se alojará”. O verbo hebraico apresenta a imagem de alguém que se hospeda ou permanece em algum lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: Preserva a expressão hebraica e sua textura poética. Embora נֶפֶשׁ também possa indicar a própria pessoa ou a vida, o equivalente formal é natural e inteligível em português.
- source_word: בְּטוֹב
  choice: no bem
  rationale: Mantém a amplitude de טוֹב, que pode abranger bem, bem-estar e prosperidade, sem restringir o sentido apenas à riqueza material.
- source_word: תָלִין
  choice: permanecerá
  rationale: O verbo לון evoca alojar-se ou passar a noite e, por extensão, permanecer. 'Permanecerá' comunica continuidade de modo natural, enquanto a nota conserva a imagem concreta.
- source_word: וְזַרְעוֹ
  choice: e sua descendência
  rationale: Neste contexto, זֶרַע designa os descendentes. 'Descendência' é conciso, coletivo e natural em português.
- source_word: יִירַשׁ
  choice: herdará
  rationale: Expressa adequadamente o sentido de receber por herança ou tomar posse e preserva a ressonância pactual da expressão.
- source_word: אָרֶץ
  choice: a terra
  rationale: Com ירשׁ, a expressão provavelmente evoca a herança da terra prometida. Em português, 'terra' também preserva parte da ambiguidade entre território e mundo habitado.
theological_decisions:
- issue: Alcance de אָרֶץ com יִירַשׁ
  choice: a terra
  alternative: a Terra
  rationale: O contexto favorece a ressonância pactual de herdar a terra, mas o hebraico também pode ter alcance mais amplo. A alternativa é mantida em nota, sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi disposto em dois versos. 'No bem' preserva deliberadamente a amplitude semântica do hebraico, e as notas mantêm as alternativas relevantes.
