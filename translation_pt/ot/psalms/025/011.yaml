id: PSA.25.11
reference: Psalms 25:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: pt
  text: Por causa do teu nome[a], ó Yahweh, perdoa a minha iniquidade[b], pois ela é grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Por causa do teu nome” é um apelo ao caráter, à reputação e à honra da aliança de Deus, não apenas ao nome falado.
    reason: cultural_note
  - marker: b
    text: Ou “a minha culpa” ou “o meu pecado”. O hebraico עָוֹן pode indicar a transgressão, a culpa ou o peso e as consequências da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Por causa de
  rationale: Introduz a base ou o motivo do pedido. Em português, “por causa do teu nome” expressa naturalmente o apelo à honra e ao caráter de Deus.
- source_word: שִׁמְךָ
  choice: teu nome
  rationale: Preserva a expressão concreta hebraica, que neste contexto abrange reputação, caráter e honra pactual.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino pessoal e explicita o vocativo da oração.
- source_word: וְסָלַחְתָּ
  choice: perdoa
  rationale: Embora a forma seja perfeita com waw, o contexto de súplica favorece em português uma petição direta no imperativo.
- source_word: לַעֲוֺנִי
  choice: a minha iniquidade
  rationale: עָוֹן pode designar perversidade, culpa ou sua consequência. “Iniquidade” conserva o peso moral sem restringir indevidamente o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada pelo salmista para o pedido e mantém o tom elevado e natural da oração.
- source_word: רַב הוּא
  choice: ela é grande
  rationale: O adjetivo singular indica grandeza ou gravidade, não quantidade; o pronome feminino retoma naturalmente “iniquidade” em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Amplitude semântica de עָוֹן
  choice: iniquidade
  alternative: culpa ou pecado
  rationale: A escolha preserva a gravidade moral do termo, enquanto a nota registra sentidos legítimos que o contexto não exclui.
- issue: Relação entre o nome de Deus e o perdão
  choice: Preservar “por causa do teu nome”
  alternative: Parafrasear como “por causa do teu caráter”
  rationale: A expressão hebraica deve permanecer visível, sem reduzir o “nome” apenas à designação falada nem resolver toda a sua densidade teológica na tradução.
translation_notes:
  register: Português moderno, claro e digno, com forma de tratamento em segunda pessoa singular para conservar a linguagem direta da oração. “Ó” marca naturalmente o vocativo; “pois” mantém a relação causal e o registro poético.
