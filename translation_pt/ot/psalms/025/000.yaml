  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: pt
  text: 'De Davi.


    A ti, SENHOR, elevo a minha alma.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha vida” ou “meu próprio ser”. O hebraico traduzido por “alma” (néfesh) pode designar a pessoa inteira, e não apenas seu aspecto imaterial.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A fórmula breve preserva a concisão do cabeçalho hebraico e sua ambiguidade possível de autoria, associação ou dedicação.
- source_word: יְהוָה
  choice: SENHOR
  rationale: A forma em versaletes segue a convenção portuguesa amplamente reconhecida para o nome divino YHWH, sem introduzir no texto uma vocalização discutida.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Mantém a imagem tradicional e formal do hebraico nephesh; a nota esclarece que o termo também pode abranger a vida ou a pessoa inteira.
- source_word: אֶשָּׂא
  choice: elevo
  rationale: Reproduz naturalmente a metáfora hebraica de erguer ou elevar a própria alma a Deus.
theological_decisions:
- issue: Sentido do cabeçalho לְדָוִד
  choice: De Davi
  alternative: Para Davi / referente a Davi
  rationale: A tradução tradicional é natural e concisa, mas não resolve dogmaticamente toda a amplitude semântica da preposição hebraica.
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: A convenção em versaletes é clara para leitores de língua portuguesa e assinala o nome divino sem tratar uma reconstrução de pronúncia como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe poética simples. O cabeçalho foi separado do primeiro verso, e a ordem inicial “A ti” preserva a ênfase do hebraico.
