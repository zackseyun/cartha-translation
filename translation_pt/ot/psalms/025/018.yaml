base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: pt
  text: Olha para a minha aflição e o meu sofrimento e perdoa todos os meus pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “leva embora todos os meus pecados”. O verbo hebraico pode significar “carregar” ou “tirar”; aqui é uma expressão idiomática para perdoar pecados.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Olha para
  rationale: O imperativo dirigido a Deus pede atenção compassiva. “Olha para” é natural em português e preserva a força da súplica.
- source_word: עָנְיִי
  choice: a minha aflição
  rationale: O termo designa aflição, miséria ou sofrimento; “aflição” mantém o sentido amplo adequado à oração de lamento.
- source_word: וַעֲמָלִי
  choice: e o meu sofrimento
  rationale: עָמָל pode indicar fadiga, dificuldade ou sofrimento penoso. Em paralelo com “aflição”, “sofrimento” comunica claramente a experiência dolorosa sem restringi-la ao trabalho.
- source_word: וְשָׂא
  choice: e perdoa
  rationale: Embora נשׂא signifique literalmente levantar, carregar ou tirar, quando tem pecados por objeto expressa idiomaticamente sua remoção, isto é, o perdão.
- source_word: לְכָל
  choice: todos
  rationale: A preposição integra a construção idiomática com נשׂא; em português, o objeto é expresso naturalmente sem reproduzi-la de modo literal.
- source_word: חַטֹּאותָי
  choice: os meus pecados
  rationale: O plural de חַטָּאת tem aqui sentido moral; “pecados” é a tradução corrente, clara e precisa.
theological_decisions:
- issue: Tradução idiomática de נשׂא tendo pecados como objeto
  choice: “perdoa todos os meus pecados”
  alternative: “tira todos os meus pecados” ou “leva embora todos os meus pecados”
  rationale: A formulação com “perdoa” comunica em português atual o sentido estabelecido do idioma hebraico — a remoção da culpa — sem acrescentar conteúdo doutrinário. A nota conserva a imagem concreta do original.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A coordenação simples reproduz o movimento direto da súplica hebraica.
