id: PSA.25.10
reference: Psalms 25:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: pt
  text: Todos os caminhos de Yahweh são amor leal e fidelidade para os que guardam sua aliança e seus testemunhos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “verdade”, em vez de “fidelidade”. Nesta associação ligada à aliança (“amor leal e fidelidade”), o hebraico frequentemente comunica a ideia de lealdade confiável, e não apenas de verdade abstrata.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “em relação aos que guardam”. A preposição hebraica admite mais de uma forma natural de expressar essa relação em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Expressa a totalidade dos caminhos de Yahweh e concorda naturalmente com o substantivo plural em português.
- source_word: אָרְחוֹת
  choice: caminhos
  rationale: Preserva a metáfora hebraica de trajetos ou modos de agir e é idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Comunica o amor bondoso, constante e comprometido que o termo frequentemente expressa no contexto da aliança.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: Na associação com חֶסֶד, destaca confiabilidade e constância, sem excluir a ideia de verdade.
- source_word: לְנֹצְרֵי
  choice: para os que guardam
  rationale: O particípio de נצר sugere conservar e observar cuidadosamente; 'guardam' mantém essa força, e 'para' representa de modo natural a relação marcada por לְ.
- source_word: בְרִיתוֹ
  choice: sua aliança
  rationale: É a expressão portuguesa corrente para o vínculo solene indicado por בְּרִית.
- source_word: וְעֵדֹתָיו
  choice: e seus testemunhos
  rationale: Mantém proximidade formal com עֵדוֹת e o vocabulário jurídico-revelacional do Saltério.
theological_decisions:
- issue: Relação predicativa entre os caminhos de Yahweh e חֶסֶד וֶאֱמֶת
  choice: Os caminhos de Yahweh 'são amor leal e fidelidade'.
  alternative: Os caminhos de Yahweh conduzem ao amor leal e à fidelidade.
  rationale: A oração nominal hebraica predica essas qualidades dos caminhos de Yahweh; não explicita apenas um destino ao qual eles conduzem.
- issue: Relação de לְנֹצְרֵי com a afirmação principal
  choice: para os que guardam
  alternative: em relação aos que guardam
  rationale: A formulação conserva a relação indicada pela preposição hebraica sem explicar se ela indica benefício, direção ou esfera relacional, preservando a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a metáfora dos caminhos, o nome Yahweh e a linguagem da aliança, evitando paráfrase doutrinária.
