  source_fidelity: 'A tradução reproduz adequadamente a estrutura nominal do hebraico: todos os caminhos de Yahweh são caracterizados por חֶסֶד וֶאֱמֶת. “Amor leal e fidelidade” comunica bem o par pactual sem reduzir אֱמֶת a verdade proposicional. “Para os que guardam” conserva de modo legítimo a relação indicada por לְ com os guardadores da aliança e dos testemunhos, sem resolver em excesso sua nuance.'
