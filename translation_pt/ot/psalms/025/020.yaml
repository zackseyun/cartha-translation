  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: pt
  text: Guarda a minha vida e livra-me; não permitas que eu seja envergonhado, pois em ti me refugio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste pedido de preservação, נֶפֶשׁ designa a própria vida ou pessoa do salmista; “vida” comunica o sentido contextual com naturalidade, sem impor a ideia moderna de uma alma separada do corpo.
- source_word: וְהַצִּילֵנִי
  choice: e livra-me
  rationale: O verbo נצל no hifil expressa retirar do perigo ou salvar; “livra-me” preserva a linguagem direta de súplica.
- source_word: אַל אֵבוֹשׁ
  choice: não permitas que eu seja envergonhado
  rationale: A construção volitiva negativa pede que o orante não venha a sofrer vergonha ou desonra; a formulação mantém tanto a dimensão pública quanto a pessoal.
- source_word: חָסִיתִי בָךְ
  choice: em ti me refugio
  rationale: חסה com ב indica buscar proteção em alguém; o presente português expressa a confiança vigente implicada pelo perfeito hebraico no contexto da oração.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: a minha vida
  alternative: a minha alma
  rationale: “Vida” evita introduzir uma antropologia dualista que o termo hebraico não exige aqui e corresponde ao pedido concreto de preservação.
- issue: Valor temporal de חָסִיתִי
  choice: em ti me refugio
  alternative: em ti me refugiei
  rationale: O perfeito pode apresentar uma confiança já assumida e ainda válida; em português, o presente comunica naturalmente essa postura contínua sem eliminar seu fundamento anterior.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com colocação pronominal natural ao registro bíblico. Mantém o paralelismo conciso da súplica hebraica e não acrescenta explicações ao texto.
