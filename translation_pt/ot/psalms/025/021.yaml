source:
  edition: WLC
  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: pt
  text: Que a integridade e a retidão me preservem[a], pois espero em ti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A integridade e a retidão me preservarão”; neste contexto, o verbo hebraico pode expressar tanto uma expectativa confiante quanto um desejo ou uma oração.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aguardo por ti”; o verbo hebraico inclui a ideia de esperar com esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: integridade
  rationale: Expressa inteireza de caráter e conduta moral íntegra, sem sugerir necessariamente ausência absoluta de pecado; forma um par poético natural com “retidão”.
- source_word: וָיֹשֶׁר
  choice: e a retidão
  rationale: יֹשֶׁר denota o que é reto em sentido ético. “Retidão” preserva a imagem moral e o paralelismo com תֹּם.
- source_word: יִצְּרוּנִי
  choice: que ... me preservem
  rationale: O verbo נצר significa guardar, proteger ou preservar. A forma yiqtol pode, neste contexto de oração, exprimir tanto um pedido quanto uma expectativa confiante; a construção com “que” representa bem o tom de súplica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para o pedido ou a confiança expressos na primeira linha e mantém a concisão poética.
- source_word: קִוִּיתִיךָ
  choice: espero em ti
  rationale: קוה comunica espera acompanhada de esperança e expectativa. “Espero em ti” é idiomático em português e preserva a dimensão de confiança, enquanto a nota registra explicitamente o sentido de aguardar.
theological_decisions:
- issue: Se as qualidades morais do salmista são apresentadas como mérito autônomo ou como virtudes invocadas no contexto de sua confiança em Deus
  choice: Manter a integridade e a retidão como agentes poéticos da preservação, em forma de oração, sem acrescentar uma explicação de mérito próprio.
  alternative: Explicitar que o salmista reivindica sua própria justiça como fundamento meritório do livramento.
  rationale: O hebraico associa diretamente essas qualidades à preservação do salmista e, ao mesmo tempo, fundamenta o pedido em sua espera confiante em Deus. A tradução conserva essa tensão sem atenuar a linguagem ética nem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Integridade” e “retidão” conservam o paralelismo ético; “espero em ti” mantém o tom poético e devocional sem linguagem arcaica.
