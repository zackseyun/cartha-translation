  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: pt
  text: Ele guia os humildes no que é justo[a] e ensina aos humildes o seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na justiça” ou “no juízo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: guia
  rationale: O hifil de דרך significa conduzir ou fazer alguém trilhar um caminho. “Guia” é natural em português e conserva o sentido causativo.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar os humildes, mansos, abatidos ou aflitos. Neste contexto de receptividade à instrução divina, “os humildes” comunica bem a postura moral e espiritual; a repetição do hebraico foi preservada.
- source_word: בַּמִּשְׁפָּט
  choice: no que é justo
  rationale: מִשְׁפָּט pode significar juízo, justiça ou aquilo que é correto. Aqui, a expressão indica provavelmente a esfera ou o padrão da orientação de Deus. “No que é justo” soa natural e preserva a amplitude ética do termo.
- source_word: וִילַמֵּד
  choice: e ensina
  rationale: O piel de למד significa ensinar ou instruir. “Ensina” é claro, corrente e mantém a coordenação entre as duas orações.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: O substantivo está no singular com sufixo masculino singular. “O seu caminho” reproduz diretamente a forma hebraica e conserva o uso bíblico de caminho como conduta ou orientação.
theological_decisions:
- issue: Sentido de עֲנָוִים em relação à orientação e à instrução divinas
  choice: os humildes
  alternative: os mansos; os abatidos; os aflitos
  rationale: O contexto do salmo destaca pessoas receptivas à direção de Deus. “Os humildes” exprime essa postura sem excluir as possíveis conotações sociais de pequenez ou aflição.
- issue: Sentido de בַּמִּשְׁפָּט
  choice: no que é justo
  alternative: na justiça; no juízo
  rationale: A formulação mantém aberta a ideia de Deus guiar segundo a justiça ou naquilo que é correto, sem restringir o termo a uma decisão judicial específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “os humildes” foi mantida por corresponder à ênfase do paralelismo hebraico.
