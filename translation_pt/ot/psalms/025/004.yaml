  text: דְּרָכֶ֣י/ךָ יְ֭הוָה הוֹדִיעֵ֑/נִי אֹ֖רְחוֹתֶ֣י/ךָ לַמְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: pt
  text: Faz-me conhecer os teus caminhos[a], ó Yahweh; ensina-me as tuas veredas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “faz que eu conheça”; tradicionalmente, “mostra-me”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: os teus caminhos
  rationale: דֶּרֶךְ pode designar caminho ou estrada e, metaforicamente, modo de agir. “Caminhos” preserva a imagem hebraica e sua amplitude no contexto da oração.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título; “ó” marca naturalmente o vocativo em português.
- source_word: הוֹדִיעֵנִי
  choice: Faze-me conhecer
  rationale: O hifil de ידע tem sentido causativo, literalmente “faz que eu conheça”. A formulação escolhida conserva esse valor e permanece digna e compreensível em português.
- source_word: אֹרְחוֹתֶיךָ
  choice: as tuas veredas
  rationale: אֹרַח significa caminho, trilha ou vereda. “Veredas” distingue o termo de דֶּרֶךְ e preserva o paralelismo poético sem eliminar a sobreposição semântica.
- source_word: לַמְּדֵנִי
  choice: ensina-me
  rationale: O piel imperativo de למד com sufixo da primeira pessoa significa diretamente “ensina-me”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal, enquanto o vocativo português reproduz a invocação do salmista.
translation_notes:
  register: Português atual, digno e de leitura natural, com formas pronominais amplamente reconhecíveis. “Faze-me” conserva com precisão o causativo hebraico; “veredas” mantém a variedade lexical e o paralelismo poético.
