  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: pt
  text: Quem é o homem que teme Yahweh? Ele o instruirá no caminho que deve escolher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele lhe ensinará no caminho que ele escolhe” ou “no caminho que ele escolherá”. O hebraico permite nuances ligeiramente diferentes para o verbo final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é
  rationale: A combinação do interrogativo com o demonstrativo forma aqui uma pergunta retórica idiomática; “Quem é” soa natural em português sem exagerar o valor do demonstrativo.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O hebraico está no masculino singular e apresenta um indivíduo representativo; “o homem” preserva a forma e a força genérica do original.
- source_word: יְרֵא יְהוָה
  choice: teme Yahweh
  rationale: Neste contexto sapiencial e devocional, ירא expressa temor reverente. “Teme” conserva tanto o peso teológico quanto a formulação tradicional do conceito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: יוֹרֶנּוּ
  choice: Ele o instruirá
  rationale: O hifil de ירה pode significar ensinar, instruir ou dirigir. “Instruirá” abrange ensino e orientação; o pronome “o” retoma “o homem”.
- source_word: בְּדֶרֶךְ
  choice: no caminho
  rationale: דרך pode indicar tanto um caminho quanto um modo de viver. “No caminho” preserva a metáfora e é natural neste contexto.
- source_word: יִבְחָר
  choice: deve escolher
  rationale: O imperfeito admite nuances como “escolhe”, “escolherá” ou, no contexto da instrução, “deve escolher”. A opção principal comunica a orientação moral sem ocultar as alternativas, registradas em nota.
theological_decisions:
- issue: Sujeito de “Ele o instruirá”
  choice: Yahweh é o sujeito implícito que instrui o homem que o teme.
  alternative: Um sujeito indefinido o instrui, ou o próprio homem é entendido como sujeito.
  rationale: Embora o verbo não expresse explicitamente o sujeito, o antecedente imediato e o contexto do salmo favorecem fortemente Yahweh como aquele que instrui. A tradução mantém o pronome, sem inserir novamente o nome no texto.
- issue: Nuance de יִבְחָר
  choice: O caminho que o homem deve escolher.
  alternative: O caminho que ele escolhe ou escolherá; também é gramaticalmente possível entender que Yahweh escolhe o caminho.
  rationale: A forma verbal e o pronome implícito permitem mais de uma nuance. A leitura principal se ajusta à instrução moral do contexto, enquanto a nota preserva a ambiguidade real do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a linguagem poética concisa, o masculino singular do hebraico e o nome divino Yahweh.
