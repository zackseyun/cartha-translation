id: PSA.25.7
reference: Psalms 25:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: pt
  text: Não te lembres dos pecados da minha juventude nem das minhas transgressões; lembra-te de mim segundo o teu amor leal[a], por causa da tua bondade, ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “misericórdia” ou “amor da aliança”. O hebraico ḥésed expressa amor, bondade e fidelidade duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: os pecados da minha juventude
  rationale: Expressa de modo direto e natural os atos pecaminosos associados à juventude, preservando a relação construtiva do hebraico.
- source_word: וּפְשָׁעַי
  choice: nem das minhas transgressões
  rationale: No paralelismo sob a mesma proibição, “nem” é natural em português. “Transgressões” mantém a ideia moral de violação ou rebeldia presente em פשע.
- source_word: אַל תִּזְכֹּר
  choice: Não te lembres
  rationale: 'Reproduz o pedido negativo e mantém a linguagem de memória com possível nuance judicial: não levar os pecados em conta.'
- source_word: כְּחַסְדְּךָ
  choice: segundo o teu amor leal
  rationale: “Segundo” reflete כְ como medida ou fundamento da ação; “amor leal” comunica tanto afeto quanto fidelidade duradoura em חסד.
- source_word: זְכָר לִי אַתָּה
  choice: lembra-te de mim
  rationale: Preserva o contraste intencional entre não se lembrar dos pecados e lembrar-se favoravelmente da pessoa. O pronome enfático hebraico não exige expressão separada em português.
- source_word: לְמַעַן טוּבְךָ
  choice: por causa da tua bondade
  rationale: Comunica naturalmente que a bondade de Deus é o fundamento ou motivo do pedido, sem excluir por completo a nuance de finalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חסד
  choice: amor leal
  alternative: misericórdia; amor da aliança
  rationale: “Amor leal” preserva a amplitude do termo, incluindo benevolência, fidelidade e compromisso, sem limitá-lo apenas à compaixão nem inserir explicitamente “aliança” onde ela não aparece no verso.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Contraste entre recordar pecados e recordar a pessoa
  choice: manter o verbo “lembrar” nas duas orações
  alternative: não leves em conta os pecados... lembra-te de mim com favor
  rationale: 'A repetição preserva o jogo retórico do hebraico e sua tensão: pede-se que Deus não recorde os delitos, mas recorde favoravelmente o suplicante.'
translation_notes:
  register: Português moderno, digno e acessível, com construção pronominal natural. “Juventude” é amplamente compreensível; “transgressões” conserva o peso moral do hebraico. A pontuação destaca o contraste central entre os dois usos de “lembrar”.
