  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: pt
  text: 'De Davi.


    A ti, Yahweh, elevo a minha alma.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha vida” ou “a mim mesmo”. O termo hebraico traduzido como “alma” (néfesh) pode indicar a pessoa inteira, não apenas seu aspecto imaterial.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: O לְ diante do nome pessoal, nos títulos dos salmos, indica associação davídica. “De Davi” é conciso e preserva melhor a possível amplitude entre autoria, dedicação e associação; não se acrescenta “salmo”, ausente do hebraico.
- source_word: אֵלֶיךָ
  choice: A ti
  rationale: 'A preposição אֶל com sufixo de segunda pessoa masculina singular expressa direção: “a ti”. A formulação é natural em português e mantém a ênfase inicial do hebraico.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode designar alma, vida, ser ou a própria pessoa. “A minha alma” preserva a imagem e a amplitude tradicional do termo, enquanto a nota esclarece que não se limita necessariamente ao aspecto imaterial.
- source_word: אֶשָּׂא
  choice: elevo
  rationale: A forma Qal de נָשָׂא significa levantar ou erguer. No idioma “elevar a alma a”, “elevo” comunica de modo digno e natural o movimento metafórico de dirigir todo o ser a Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, conserva-se o nome próprio “Yahweh”, sem substituí-lo pelo título “SENHOR”.
- issue: Amplitude antropológica de נֶפֶשׁ
  choice: a minha alma, com nota explicativa
  alternative: a minha vida; a mim mesmo; todo o meu ser
  rationale: A tradução mantém a metáfora hebraica sem definir נֶפֶשׁ como exclusivamente imaterial; a nota preserva sua possível referência à vida ou à pessoa inteira.
translation_notes:
  register: Português moderno, claro e digno, com ordem marcada (“A ti”) para preservar a ênfase do hebraico. O vocativo dispensa “ó”, evitando solenidade desnecessariamente arcaizante sem perder reverência.
