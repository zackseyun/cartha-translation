  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כִּֽי יָחִ֖יד וְ/עָנִ֣י אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: pt
  text: Volta-te para mim e concede-me tua graça, pois estou só[a] e aflito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “solitário”. O termo hebraico pode indicar alguém que está só ou que se sente isolado.
    reason: lexical_alternative
  - marker: b
    text: Ou “pobre” ou “oprimido”. O termo hebraico pode se referir à pobreza econômica, à opressão social ou à aflição em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Volta-te para mim
  rationale: O imperativo de פנה seguido de אֵלַי expressa um pedido para que Deus volte sua atenção ao salmista. A formulação é natural, digna e mantém a imagem direcional do hebraico.
- source_word: וְחָנֵּנִי
  choice: e concede-me tua graça
  rationale: O verbo חנן pede favor benevolente. Esta formulação comunica a ação divina solicitada e preserva a ideia de graça, sem reduzi-la apenas a compaixão.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta o pedido e se ajusta naturalmente ao registro de oração.
- source_word: יָחִיד
  choice: só
  rationale: Neste lamento, יָחִיד indica isolamento ou solidão. “Só” preserva a possibilidade de uma condição objetiva de estar sem companhia e também pode sugerir solidão, sem decidir entre elas.
- source_word: וְעָנִי
  choice: e aflito
  rationale: עָנִי pode indicar pobreza, opressão ou aflição. “Aflito” oferece o sentido amplo mais adequado ao lamento, enquanto a nota registra as alternativas legítimas.
- source_word: אָנִי
  choice: estou
  rationale: O pronome independente enfatiza a condição pessoal do salmista. Em português, a construção predicativa natural requer o verbo “estar”.
