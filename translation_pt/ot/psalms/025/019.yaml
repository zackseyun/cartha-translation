  text: רְאֵֽה אוֹיְבַ֥/י כִּי רָ֑בּוּ וְ/שִׂנְאַ֖ת חָמָ֣ס שְׂנֵאֽוּ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: pt
  text: Olha para os meus inimigos, pois são muitos e me odeiam com ódio violento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e com ódio de violência me odeiam”. A expressão hebraica enfatiza o caráter violento e brutal do ódio deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Olha para
  rationale: Imperativo masculino singular de ראה, dirigido a Deus em oração. “Olha para” preserva de modo natural a força do pedido.
- source_word: אוֹיְבַי
  choice: os meus inimigos
  rationale: Forma com sufixo de primeira pessoa do singular; “os meus inimigos” é clara e direta.
- source_word: כִּי
  choice: pois
  rationale: 'Introduz a razão do pedido: Deus deve olhar para os inimigos porque são numerosos.'
- source_word: רָבּוּ
  choice: são muitos
  rationale: O perfeito qal de רבה descreve aqui o grande número dos inimigos; a formulação é concisa e idiomática.
- source_word: וְשִׂנְאַת חָמָס
  choice: com ódio violento
  rationale: A construção nominal associa o ódio a חָמָס, termo que pode indicar violência, brutalidade ou injustiça. A expressão preserva o caráter violento desse ódio em português natural.
- source_word: שְׂנֵאוּנִי
  choice: me odeiam
  rationale: O perfeito qal com objeto de primeira pessoa descreve, no contexto do lamento, uma hostilidade vigente; o presente comunica naturalmente esse estado contínuo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura acessível no Brasil. A tradução mantém a repetição semântica do hebraico em “odeiam com ódio” para conservar sua ênfase.
