  text: ס֣וֹד יְ֭הוָה לִ/ירֵאָ֑י/ו וּ֝/בְרִית֗/וֹ לְ/הוֹדִיעָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: pt
  text: O conselho íntimo do SENHOR é para os que o temem, e ele lhes dá a conhecer sua aliança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A segunda oração é concisa no hebraico e pode ser entendida mais literalmente como: “e sua aliança, para fazê-los conhecê-la”.'
    reason: Preserva a ambiguidade sintática e a nuance de finalidade do infinitivo hebraico.
lexical_decisions:
- source_word: סוֹד (sôd)
  choice: conselho íntimo
  rationale: O termo pode designar uma conversa ou deliberação confidencial, um segredo compartilhado ou a intimidade de um círculo próximo. “Conselho íntimo” preserva tanto a ideia de revelação reservada quanto a de proximidade, sem reduzi-la apenas a amizade.
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por “SENHOR” em maiúsculas.
- source_word: יְרֵאָיו (yere'av)
  choice: os que o temem
  rationale: Mantém o sentido religioso de reverência obediente, sem enfraquecer “temer” para mera admiração ou respeito.
- source_word: בְּרִיתוֹ (berito)
  choice: sua aliança
  rationale: “Aliança” é o equivalente corrente e teologicamente amplo para o compromisso pactual expresso por בְּרִית.
- source_word: לְהוֹדִיעָם (lehodi'am)
  choice: ele lhes dá a conhecer
  rationale: O infinitivo causativo significa literalmente “fazer que eles conheçam”. A formulação portuguesa explicita o agente naturalmente inferido no contexto e evita uma construção elíptica pouco clara.
theological_decisions:
- issue: Agente e objeto implícitos na segunda oração
  choice: “ele lhes dá a conhecer sua aliança”
  alternative: “e sua aliança, para fazê-los conhecê-la” ou “e sua aliança é para torná-la conhecida a eles”
  rationale: O hebraico põe “sua aliança” antes do infinitivo “fazer que eles conheçam”, numa construção concisa cujo agente e conteúdo conhecido são inferidos. A tradução principal expressa a leitura contextual mais natural, enquanto a nota preserva a forma e a possível nuance final do original.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão internacional. “Conselho íntimo” evita tanto o arcaísmo quanto uma paráfrase excessivamente afetiva; a nota registra a concisão ambígua do hebraico.
