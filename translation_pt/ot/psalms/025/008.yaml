base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: pt
  text: Bom e reto é Yahweh; por isso, ele instrui os pecadores no caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ensina aos pecadores o caminho”. O verbo também pode significar “ensinar” ou “dirigir”.'
    reason: Alternativa lexical e sintática para יוֹרֶה e בַּדָּרֶךְ.
lexical_decisions:
- source_word: טוֹב
  choice: Bom
  rationale: Expressa bondade moral e forma um paralelo direto e natural com “reto”.
- source_word: וְיָשָׁר
  choice: e reto
  rationale: Preserva a ideia de retidão moral e a metáfora de algo direito, sem restringi-la apenas ao sentido jurídico de “justo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua força pessoal e pactual.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Indica de modo claro e idiomático a consequência lógica da bondade e retidão de Yahweh.
- source_word: יוֹרֶה
  choice: instrui
  rationale: O hifil de ירה pode significar ensinar, instruir ou dirigir; “instrui” conserva tanto o aspecto pedagógico quanto o de orientação.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: Traduz diretamente o substantivo plural, mantendo explícita a categoria moral do texto.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: Mantém a metáfora hebraica sem acrescentar qualificações como “certo”, que não estão expressas no original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: A transliteração preserva o nome pessoal divino e evita substituí-lo por um título; “Yahweh” também mantém continuidade com a política lexical fornecida pelo projeto.
- issue: Sentido de בַּדָּרֶךְ
  choice: no caminho
  alternative: no caminho certo; o caminho
  rationale: O hebraico não explicita “certo” nem define um objeto mais específico. A formulação escolhida preserva a imagem moral do caminho e sua abertura interpretativa.
- issue: Alcance semântico de יוֹרֶה
  choice: instrui
  alternative: ensina; dirige
  rationale: “Instrui” preserva a dimensão de ensino e orientação sem decidir exclusivamente entre os sentidos pedagógico e direcional do verbo.
translation_notes:
  register: Português moderno, claro e solene, com ordem poética próxima do hebraico. O pronome “ele” explicita naturalmente em português o sujeito da segunda oração, já indicado pelo contexto hebraico.
