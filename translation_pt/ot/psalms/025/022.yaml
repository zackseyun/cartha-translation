  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: pt
  text: Resgata Israel, ó Deus, de todas as suas aflições.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das aflições deles”, entendendo “Israel” como o conjunto do povo, em vez de conservar a forma gramatical singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: Resgata
  rationale: O imperativo de פדה expressa resgate, redenção ou livramento mediante libertação. “Resgata” conserva esse peso e soa natural como súplica dirigida a Deus.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; “ó Deus” representa de modo claro e digno a invocação.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O nome próprio designa aqui o povo da aliança considerado coletivamente.
- source_word: מִכֹּל
  choice: de todas
  rationale: A preposição מִן com כֹּל indica libertação da totalidade das aflições e é expressa naturalmente por “de todas”.
- source_word: צָרוֹתָיו
  choice: suas aflições
  rationale: צָרוֹת abrange angústias, adversidades e aflições. “Aflições” é atual, digna e adequada ao registro poético. Em português, “suas” pode retomar Israel como coletivo sem impor explicitamente gênero ou número ao referente.
theological_decisions:
- issue: Israel como singular coletivo e o sufixo masculino singular
  choice: Traduzir por “suas aflições”, preservando na formulação principal a referência gramatical a Israel sem explicitar “dele”
  alternative: “as aflições deles”, entendendo Israel diretamente como o conjunto de seus integrantes
  rationale: O hebraico emprega sufixo de terceira pessoa masculina singular, tratando Israel como unidade coletiva. O possessivo português “suas” mantém essa ligação e também conserva a ambiguidade natural entre a unidade coletiva e o povo que a compõe; a nota esclarece a alternativa plural.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Resgata” mantém o teor redentor de פדה; “aflições” preserva a amplitude poética de צָרוֹת. O marcador da nota aparece no texto principal.
