lexical_decisions:
- source_word: צָרוֹת
  choice: aflições
  rationale: O substantivo designa adversidades, aflições ou circunstâncias angustiosas. “Aflições” é natural em português e se distingue adequadamente do termo seguinte.
- source_word: לְבָבִי
  choice: do meu coração
  rationale: לֵבָב abrange a vida interior, incluindo sentimentos e pensamentos. “Coração” conserva a imagem antropológica hebraica e é imediatamente compreensível.
- source_word: הִרְחִיבוּ
  choice: aumentaram
  rationale: O verbo significa literalmente “alargaram-se” ou “tornaram-se amplas”. Com “aflições” como sujeito, “aumentaram” comunica com clareza que elas cresceram em extensão ou intensidade, enquanto a nota preserva a imagem literal.
- source_word: מִמְּצוּקוֹתַי
  choice: das minhas angústias
  rationale: O substantivo pode indicar apertos, situações opressivas ou angústias. “Angústias” exprime naturalmente a aflição causada por tais circunstâncias; a alternativa concreta é registrada em nota.
- source_word: הוֹצִיאֵנִי
  choice: tira-me
  rationale: O verbo significa “fazer sair” ou “tirar para fora”. “Tira-me” conserva a metáfora concreta de ser retirado de uma situação opressiva e soa natural na súplica.
