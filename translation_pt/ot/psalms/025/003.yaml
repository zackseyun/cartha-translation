base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: pt
  text: De fato, nenhum dos que esperam em ti será envergonhado[a]; serão envergonhados os que agem traiçoeiramente sem motivo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará decepcionado”. O verbo hebraico pode indicar vergonha, desonra ou o fracasso da expectativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em vão” ou “por nada”. O hebraico permite mais de uma relação de sentido neste trecho; no texto, foi entendido como “sem motivo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De fato
  rationale: Neste contexto, a partícula reforça a afirmação, mais do que simplesmente acrescentar uma ideia.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: nenhum dos que esperam em ti será envergonhado
  rationale: A construção hebraica, literalmente próxima de 'todos os que esperam em ti não serão envergonhados', é expressa naturalmente em português como uma negação universal.
- source_word: קֹוֶיךָ
  choice: os que esperam em ti
  rationale: O verbo קוה indica esperar com expectativa e pode incluir a nuance de esperança confiante.
- source_word: יֵבֹשׁוּ
  choice: serão envergonhados
  rationale: Preserva a repetição do mesmo verbo nos dois membros do verso e comunica a experiência pública de vergonha ou desonra.
- source_word: הַבּוֹגְדִים
  choice: os que agem traiçoeiramente
  rationale: Mantém o caráter ativo do particípio, que descreve pessoas que procedem com deslealdade ou traição.
- source_word: רֵיקָם
  choice: sem motivo
  rationale: Entende o advérbio como ausência de causa ou justificativa, sem eliminar as possibilidades de 'em vão' ou 'por nada'.
