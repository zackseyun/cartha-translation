source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: pt
  text: Meu Deus, em ti confio. Não deixes que eu seja humilhado[a], nem que meus inimigos triunfem sobre mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não deixes que eu sinta vergonha” ou “seja envergonhado”. O verbo hebraico pode indicar tanto a vergonha interior como a humilhação ou desonra pública.
    reason: lexical_alternative
  - marker: b
    text: Ou “exultem sobre mim” ou “se alegrem às minhas custas”. O verbo hebraico descreve alegria exultante, aqui a alegria hostil dos inimigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: A forma com sufixo de primeira pessoa do singular significa “meu Deus” e funciona aqui como invocação direta, sem exigir uma interjeição adicional.
- source_word: בְּךָ
  choice: em ti
  rationale: Com o verbo בטח, a preposição ב indica aquele em quem se deposita confiança; “em ti” é a expressão portuguesa natural e tradicional.
- source_word: בָטַחְתִּי
  choice: confio
  rationale: O perfeito qal pode expressar uma confiança firmada e ainda vigente. O presente comunica naturalmente essa atitude contínua na oração.
- source_word: אַל אֵבוֹשָׁה
  choice: Não deixes que eu seja humilhado
  rationale: A partícula אַל introduz um pedido negativo, e בושׁ pode indicar tanto sentir vergonha como sofrer vergonha ou desonra pública. Diante da menção dos inimigos, “seja humilhado” destaca a dimensão pública sem eliminar a alternativa, registrada em nota.
- source_word: אַל יַעַלְצוּ
  choice: nem que ... triunfem
  rationale: A segunda partícula אַל coordena outro pedido negativo. עלץ descreve alegria exultante; no contexto de inimigos, “triunfem” comunica em português natural a exultação hostil, enquanto a alternativa mais literal é preservada em nota.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa do singular.
- source_word: לִי
  choice: sobre mim
  rationale: Com um verbo de exultação hostil, לִי marca a pessoa às custas de quem os inimigos se alegram; “sobre mim” combina naturalmente com “triunfem”.
theological_decisions:
- issue: O pedido do salmista a respeito da vergonha
  choice: Não deixes que eu seja humilhado
  alternative: Não deixes que eu sinta vergonha
  rationale: O contexto de confronto com inimigos favorece a ideia de desonra ou humilhação pública, mas o hebraico também admite a experiência interior de vergonha. A nota conserva essa ambiguidade sem determinar de que modo Deus vindicará o salmista.
- issue: A alegria hostil dos inimigos
  choice: triunfem sobre mim
  alternative: exultem sobre mim; alegrem-se às minhas custas
  rationale: “Triunfem” expressa com naturalidade a alegria vitoriosa dos inimigos, sem afirmar que eles realmente obtiveram uma vitória definitiva. A nota preserva o componente explícito de exultação presente no verbo hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez especialmente natural para leitores brasileiros. “Em ti” e a construção de oração direta preservam o tom poético sem arcaísmo excessivo. A pontuação separa a invocação da petição e torna claro o paralelismo dos dois pedidos negativos.
