  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: pt
  text: Lembra-te das tuas misericórdias[a], ó Yahweh, e do teu amor leal[b], pois existem desde os tempos antigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da tua compaixão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos teus amores leais”; o hebraico emprega aqui uma forma plural.
    reason: lexical_alternative
  - marker: c
    text: Ou “desde a eternidade” ou “desde sempre”. A expressão hebraica pode indicar tanto a antiguidade remota quanto uma duração eterna.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo qal masculino singular de זכר. Em uma oração dirigida a Deus, “Lembra-te” é direto, natural e preserva a forma reflexiva idiomática do português.
- source_word: רַחֲמֶיךָ
  choice: das tuas misericórdias
  rationale: O substantivo plural רַחֲמִים, com sufixo de segunda pessoa masculina singular, denota compaixão profunda e suas manifestações. “Misericórdias” preserva o plural e se ajusta ao registro de oração do salmo.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: O tetragrama é representado pelo nome pessoal “Yahweh”, em vez de ser substituído por um título; “ó” marca naturalmente o vocativo em português.
- source_word: וַחֲסָדֶיךָ
  choice: e dos teus atos de amor leal
  rationale: חֶסֶד comunica amor firme, lealdade e bondade comprometida. Como a forma hebraica é plural, “atos de amor leal” preserva a multiplicidade de suas manifestações sem recorrer ao pouco natural “amores leais”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da súplica; “pois” é conciso e natural neste registro.
- source_word: מֵעוֹלָם
  choice: desde os tempos antigos
  rationale: עוֹלָם pode indicar antiguidade remota ou duração eterna. A tradução principal expressa o passado remoto sem eliminar a possibilidade mais forte, registrada em nota.
- source_word: הֵמָּה
  choice: vêm
  rationale: O pronome independente masculino plural retoma as misericórdias e os atos de amor leal. “Vêm desde” comunica de modo idiomático em português que eles remontam ao passado distante.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. “Yahweh” preserva essa distinção e representa de maneira amplamente reconhecida o tetragrama.
- issue: Força temporal de מֵעוֹלָם
  choice: desde os tempos antigos
  alternative: desde a eternidade; desde sempre
  rationale: A expressão pode apontar tanto para a antiguidade remota quanto para duração eterna. O texto principal evita transformar a frase em uma afirmação metafísica mais específica do que o contexto exige, enquanto a nota preserva a leitura mais forte.
- issue: Plural de חֲסָדֶיךָ
  choice: atos de amor leal
  alternative: teu amor leal
  rationale: A formulação escolhida conserva a forma plural hebraica e expressa manifestações concretas da lealdade amorosa de Deus, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O vocativo conserva solenidade sem arcaísmo excessivo; “atos de amor leal” torna natural o plural hebraico.
