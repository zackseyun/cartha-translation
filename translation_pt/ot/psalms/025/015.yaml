  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: pt
  text: Meus olhos estão sempre voltados para Yahweh, pois ele tirará meus pés da rede.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַי
  choice: Meus olhos
  rationale: Preserva a imagem concreta do plural hebraico com sufixo de primeira pessoa, sem substituí-la pela interpretação mais abstrata «meu olhar».
- source_word: תָּמִיד
  choice: sempre
  rationale: Expressa de modo natural e poético a orientação contínua e habitual indicada pelo advérbio hebraico.
- source_word: אֶל
  choice: voltados para
  rationale: Com «olhos», esta formulação comunica em português atual a atenção dirigida a alguém, tornando explícita a relação idiomática sem perder a imagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa a razão pela qual o salmista mantém os olhos voltados para Yahweh.
- source_word: הוּא
  choice: ele
  rationale: Representa o pronome independente hebraico; o contexto já lhe confere a ênfase necessária, sem precisar acrescentar «ele mesmo».
- source_word: יוֹצִיא
  choice: tirará
  rationale: O hifil de יצא indica fazer sair ou retirar. «Tirará» preserva a ação concreta de libertar os pés presos, com maior naturalidade em português do que «fará sair».
- source_word: מֵרֶשֶׁת
  choice: da rede
  rationale: «Rede» conserva a imagem direta de uma armadilha que enreda, e a contração «da» expressa naturalmente em português a saída para fora dela.
- source_word: רַגְלָי
  choice: meus pés
  rationale: Mantém a imagem corporal concreta do plural hebraico e sua ligação com o enredamento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o tetragrama. «Yahweh» preserva o nome pessoal no texto, sem convertê-lo em título.
- issue: Natureza da libertação descrita
  choice: tirará meus pés da rede
  alternative: me livrará da armadilha
  rationale: A tradução mantém a metáfora concreta dos pés presos numa rede e não a reduz a uma declaração abstrata de livramento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à expressão idiomática portuguesa, mantendo o paralelismo conceitual, a metáfora concreta e a confiança futura do hebraico.
