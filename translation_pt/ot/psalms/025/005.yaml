base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: pt
  text: Guia-me na tua verdade[a] e ensina-me, pois tu és o Deus da minha salvação; espero por ti todo o dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Guia-me por tua fidelidade”. A palavra hebraica pode significar “verdade” ou “fidelidade”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido como “espero” também transmite a ideia de aguardar com esperança e expectativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Guia-me
  rationale: O hifil imperativo de דרך expressa dirigir alguém por um caminho. “Guia-me” é natural em português e preserva a imagem de direção.
- source_word: בַאֲמִתֶּךָ
  choice: na tua verdade
  rationale: אֱמֶת pode significar verdade, confiabilidade ou fidelidade. No contexto de orientação e ensino, “na tua verdade” preserva bem tanto a imagem do caminho quanto o conteúdo que deve ser aprendido.
- source_word: וְלַמְּדֵנִי
  choice: e ensina-me
  rationale: O piel imperativo de למד significa diretamente “ensinar”; esta formulação é clara, corrente e digna.
- source_word: כִּי
  choice: pois
  rationale: A conjunção apresenta a razão do pedido. “Pois” conserva essa relação explicativa de modo conciso.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: o Deus da minha salvação
  rationale: A tradução mantém a estrutura nominal hebraica e apresenta Deus como a fonte da salvação ou libertação do salmista.
- source_word: אוֹתְךָ קִוִּיתִי
  choice: por ti espero
  rationale: קוה expressa espera acompanhada de esperança ou expectativa, e אוֹתְךָ assinala Deus como seu objeto. “Por ti espero” conserva a imagem da espera sem eliminar sua dimensão confiante.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: A expressão indica a duração de todo o dia. “O dia inteiro” é idiomático no português moderno e preserva o sentido durativo.
theological_decisions:
- issue: Sentido de אֱמֶת na orientação divina
  choice: verdade
  alternative: fidelidade
  rationale: A associação entre guiar e ensinar favorece “verdade” como âmbito ou padrão da orientação pedida. “Fidelidade” continua lexicalmente possível e é preservada em nota.
- issue: Nuance de קוה
  choice: espero
  alternative: aguardo com esperança
  rationale: O verbo reúne as ideias de esperar e ter esperança. “Espero” mantém essa abertura sem explicitar em excesso uma das nuances; a expectativa confiante é indicada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. Mantêm-se o paralelismo poético, a metáfora de orientação e a ambiguidade lexical relevante de אֱמֶת e קוה.
