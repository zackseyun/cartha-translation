  text: There he shattered the arrows of the bow[a], shield and sword and battle[c][b]. Selah
translation:
  language: pt
  text: Ali ele despedaçou as flechas flamejantes do arco[a], o escudo, a espada e a guerra[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as flechas do arco”. A expressão hebraica evoca literalmente chamas ou clarões, uma imagem poética aplicada às flechas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e a batalha” ou “e o combate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Ali
  rationale: Advérbio de lugar que retoma o local mencionado no contexto anterior, sem repetir seu nome.
- source_word: שִׁבַּר
  choice: ele despedaçou
  rationale: O piel perfeito de שבר expressa uma ação enérgica e decisiva de quebrar ou destruir.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: as flechas flamejantes do arco
  rationale: No contexto bélico, רִשְׁפֵי designa flechas, mas conserva imagens de chama ou clarão; “flamejantes” mantém essa vivacidade sem deixar de identificar o projétil.
- source_word: מָגֵן
  choice: o escudo
  rationale: Equivalente corrente e preciso para o instrumento defensivo.
- source_word: וְחֶרֶב
  choice: a espada
  rationale: Tradução natural do substantivo na enumeração de armas e guerra; a conjunção hebraica é representada pela coordenação portuguesa.
- source_word: וּמִלְחָמָה
  choice: e a guerra
  rationale: מִלְחָמָה pode significar guerra, batalha ou combate. “Guerra” funciona naturalmente como clímax abrangente após as armas específicas.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional, pois a função exata do termo, provavelmente litúrgica ou musical, permanece incerta.
theological_decisions:
- issue: Sujeito implícito do verbo masculino singular
  choice: Deus, retomado pelo pronome “ele” e identificado pelo contexto do salmo
  alternative: Um sujeito masculino não especificado
  rationale: O hebraico não traz sujeito expresso neste versículo, mas o contexto imediato identifica Deus como agente; o pronome apenas reproduz a referência contextual sem inserir o nome no texto.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A repetição dos artigos dá naturalidade à enumeração em português. “Selá” é preservado sem explicação no corpo do versículo.
