source:
  edition: WLC
  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: pt
  text: Ele abate o espírito dos príncipes[a]; ele é temível para os reis da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contém o espírito dos governantes”. “Espírito” também pode significar “sopro”, “coragem”, “ânimo” ou “temperamento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele é temido pelos reis da terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: abate
  rationale: O Qal imperfeito de בצר pode comunicar cortar, reduzir ou conter. “Abate” expressa de modo natural a ação decisiva de Deus contra a força interior dos governantes, sem restringir o sentido à morte física.
- source_word: רוּחַ
  choice: espírito
  rationale: רוּחַ pode significar espírito, sopro, ânimo, coragem ou disposição. “Espírito” conserva melhor essa amplitude no texto principal.
- source_word: נְגִידִים
  choice: príncipes
  rationale: נָגִיד designa um líder, governante ou príncipe. “Príncipes” mantém o registro poético e o paralelismo com “reis”.
- source_word: נוֹרָא
  choice: temível
  rationale: נוֹרָא descreve alguém que inspira temor. “Temível” preserva a força reverente e ameaçadora do hebraico, sem a possível banalização moderna de termos equivalentes a “impressionante”.
- source_word: לְמַלְכֵי אָרֶץ
  choice: para os reis da terra
  rationale: A preposição ל marca aqui a relação entre aquele que inspira temor e os reis que o encaram. “Para os reis da terra” segue de perto essa construção e soa natural em português.
theological_decisions:
- issue: Natureza da ação divina contra os governantes
  choice: O versículo apresenta Deus abatendo decisivamente o espírito, a coragem ou a altivez dos governantes terrenos.
  alternative: A expressão pode indicar mais especificamente que Deus lhes tira o sopro ou a vida, ou que contém seu ímpeto e temperamento.
  rationale: A combinação de בצר com רוּחַ admite mais de uma nuance. O texto principal mantém a ideia ampla de humilhação e domínio divino, enquanto a nota registra as alternativas sem definir indevidamente se a ação é morte, perda de coragem ou contenção.
- issue: Relação de נוֹרָא com os reis
  choice: Deus é temível para os reis da terra.
  alternative: Deus é temido pelos reis da terra.
  rationale: A formulação escolhida preserva mais diretamente o valor adjetival de נוֹרָא e a relação indicada por ל; a alternativa explicita a reação dos reis.
translation_notes:
  register: Português moderno, claro e solene, com vocabulário poético acessível. A repetição de “ele” preserva a estrutura das duas orações e deixa explícito que Deus é o sujeito de ambas.
