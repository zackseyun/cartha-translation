  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: pt
  text: Do céu, fizeste ouvir o juízo;[a] a terra[b] temeu e ficou quieta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dos céus, fizeste ouvir o juízo.”'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode designar a terra no sentido de território ou país; o contraste com o céu favorece aqui o sentido mais abrangente.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ficou em silêncio” ou “se aquietou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Do céu
  rationale: A preposição מִן indica a origem, e שָׁמַיִם, embora tenha forma plural em hebraico, é naturalmente expresso pelo coletivo singular “céu” em português.
- source_word: הִשְׁמַעְתָּ
  choice: fizeste ouvir
  rationale: Preserva a força causativa do hifil de שׁמע sem substituí-la pela interpretação mais específica “proclamaste”.
- source_word: דִּין
  choice: o juízo
  rationale: No contexto, refere-se à decisão ou ação judicial de Deus. “Juízo” mantém a concisão e o teor judicial do hebraico.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Embora possa significar um território ou país, o contraste poético com o céu favorece aqui o sentido abrangente de “terra”.
- source_word: יָרְאָה
  choice: teve medo
  rationale: Comunica de modo claro e atual o sentido direto de temor diante do juízo divino, sem restringi-lo ao sentido mais interpretativo de reverência.
- source_word: וְשָׁקָטָה
  choice: e ficou em silêncio
  rationale: Expressa o estado de quietude ou cessação sugerido por שׁקט e forma uma sequência natural em português após “teve medo”.
theological_decisions:
- issue: Alcance de אֶרֶץ no contraste poético com o céu
  choice: a terra, em sentido abrangente
  alternative: a terra como território ou país
  rationale: O contraste entre a origem celestial do juízo e a reação da terra sustenta uma moldura cósmica, sem exigir uma referência nacional mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o paralelismo poético e a força causativa do hebraico, usando “teve medo” para maior naturalidade contemporânea.
