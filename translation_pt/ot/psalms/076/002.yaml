  yaml_path: translation/ot/psalms/076/002.yaml
  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: pt
  text: 'Em Salém[a] estava o seu abrigo[b],

    e em Sião, a sua morada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salém é tradicionalmente identificada com Jerusalém; o versículo põe Salém e Sião em paralelo como nomes do lugar onde Deus habita.
    reason: cross_reference
  - marker: b
    text: Ou “cabana”, “tenda” ou “pavilhão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: estava
  rationale: O wayyiqtol de היה funciona aqui como verbo copulativo, situando o abrigo de Deus; “estava” é natural em português e combina com o paralelismo locativo.
- source_word: בְשָׁלֵם
  choice: em Salém
  rationale: Preserva o topônimo hebraico שָׁלֵם, sem substituí-lo interpretativamente por Jerusalém.
- source_word: סֻכּוֹ
  choice: o seu abrigo
  rationale: סֻכָּה designa uma cabana, cobertura ou abrigo. “Abrigo” comunica o sentido básico em linguagem atual sem impor conotação cúltica técnica.
- source_word: וּמְעוֹנָתוֹ
  choice: e ... a sua morada
  rationale: מְעוֹנָה indica lugar de habitação. “Morada” é corrente, digna e adequada ao paralelismo poético.
- source_word: בְצִיּוֹן
  choice: em Sião
  rationale: Mantém o nome próprio צִיּוֹן em sua forma portuguesa consagrada.
theological_decisions:
- issue: Relação entre Salém e Sião
  choice: Manter os dois topônimos distintos no texto principal.
  alternative: Traduzir “Salém” como “Jerusalém”, tornando explícita a identificação tradicional.
  rationale: O hebraico apresenta Salém e Sião em paralelismo. Preservar ambos conserva a forma poética e evita resolver no texto uma identificação que convém explicar em nota.
translation_notes:
  register: Português moderno, claro e digno, com ordem levemente poética. A elipse verbal no segundo verso reproduz naturalmente o paralelismo hebraico. Todos os marcadores de nota aparecem no texto principal.
