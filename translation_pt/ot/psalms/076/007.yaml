  text: אַתָּ֤ה נ֥וֹרָא אַ֗תָּה וּ/מִֽי יַעֲמֹ֥ד לְ/פָנֶ֗י/ךָ מֵ/אָ֥ז אַפֶּֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: pt
  text: Tu — tu és temível[a]; e quem pode permanecer diante de ti desde o momento da tua ira[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “digno de temor” ou “aterrador”.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde a tua ira” ou “quando a tua ira começou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: temível
  rationale: O adjetivo derivado de ירא descreve aquele que inspira temor e reverência. “Temível” conserva a força predicativa e a gravidade do termo sem limitá-lo a mero terror.
- source_word: וּמִי
  choice: e quem
  rationale: 'A conjunção seguida do interrogativo introduz naturalmente a consequência retórica: ninguém é capaz de resistir diante de Deus.'
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: pode permanecer diante de ti
  rationale: Na pergunta retórica, o imperfeito expressa capacidade ou possibilidade. “Permanecer diante de ti” preserva a imagem hebraica e sugere não conseguir resistir ou subsistir em sua presença.
- source_word: מֵאָז
  choice: desde o momento de
  rationale: מֵאָז marca um ponto temporal, “desde então” ou “desde o momento em que”. A formulação conserva essa nuance sem convertê-la apenas em simultaneidade.
- source_word: אַפֶּךָ
  choice: tua ira
  rationale: Embora אַף signifique literalmente “nariz”, aqui é a metonímia convencional para ira. “Ira” corresponde ao contexto solene e intenso do salmo.
- source_word: אַתָּה ... אַתָּה
  choice: Tu — tu
  rationale: A repetição explícita do pronome é enfática. Mantê-la reproduz a força poética sem acrescentar a ideia não expressa de exclusividade.
theological_decisions:
- issue: Natureza do temor diante de Deus
  choice: temível
  alternative: digno de temor; aterrador
  rationale: “Temível” permite tanto o assombro reverente quanto o pavor provocado pelo juízo divino, preservando a tensão do hebraico no contexto da ira de Deus.
- issue: Relação temporal entre permanecer diante de Deus e sua ira
  choice: desde o momento da tua ira
  alternative: quando se acende a tua ira; desde que te iraste
  rationale: A tradução mantém o valor temporal de מֵאָז e evita decidir se o texto enfatiza o início, o despertar ou simplesmente a manifestação da ira.
translation_notes:
  register: Português moderno, solene e poético, com uso de “tu” em harmonia com a segunda pessoa singular do hebraico. A repetição enfática do pronome e a pergunta retórica foram preservadas; a redação busca legibilidade ampla, inclusive para leitores brasileiros.
