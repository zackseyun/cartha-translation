  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: pt
  text: Deus é conhecido em Judá[a]; em Israel, grande é o seu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Deus se deu a conhecer em Judá»; a forma hebraica pode indicar tanto um estado («é conhecido») quanto, neste contexto, uma ação («se deu a conhecer»).'
    reason: lexical_alternative
  - marker: b
    text: «Seu nome» pode indicar sua identidade revelada, sua reputação ou seu renome, e não apenas o nome pronunciado.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: é conhecido
  rationale: O nifal de ידע admite naturalmente o sentido estativo ou passivo de «ser conhecido». A formulação preserva a concisão poética e não explicita indevidamente uma nuance reflexiva.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: A preposição ב com o nome Judá é naturalmente vertida por «em», preservando tanto a ressonância territorial quanto a comunitária.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui tem sentido singular e designa o Deus de Israel.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A tradução «em Israel» mantém o paralelismo preposicional com «em Judá».
- source_word: גָּדוֹל
  choice: grande
  rationale: O adjetivo significa diretamente «grande»; mantê-lo evita transformar a predicação em uma ideia verbal como «exaltado».
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: A expressão traduz literalmente o hebraico e preserva a densidade bíblica de «nome» como identidade revelada, reputação e renome.
theological_decisions:
- issue: Sentido do «nome» divino
  choice: Manter «grande é o seu nome».
  alternative: «grande é a sua fama» ou «ele é muito honrado»
  rationale: A tradução concreta conserva o peso teológico do nome de Deus como sua identidade revelada e reputação, sem reduzi-lo apenas a fama ou honra.
- issue: Valor de נוֹדָע
  choice: «Deus é conhecido»
  alternative: «Deus se deu a conhecer»
  rationale: A forma hebraica pode ter valor estativo/passivo ou, no contexto, uma nuance mais eventiva. O texto principal mantém a leitura mais direta, e a nota registra a alternativa sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A inversão «grande é o seu nome» conserva o paralelismo e o relevo poético do predicado hebraico sem soar arcaica.
