  text: when God rises for judgment[a], to save all the humble of the earth[b]. Selah
translation:
  language: pt
  text: 'quando Deus se levanta para julgar,

    para salvar todos os humildes da terra.[a]

    Selá'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os mansos da terra» ou «todos os aflitos da terra». «Terra» também pode significar «país» ou «território».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/קוּם
  choice: quando Deus se levanta
  rationale: A preposição בְּ com o infinitivo construto de קום tem sentido temporal. O presente poético comunica de modo natural a intervenção divina.
- source_word: לַ/מִּשְׁפָּט
  choice: para julgar
  rationale: A construção indica a finalidade judicial da ação de Deus. A forma verbal é mais natural em português e preserva o sentido de exercer julgamento, sem o reduzir à ideia abstrata de justiça.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa, com referência singular, o Deus de Israel.
- source_word: לְ/הוֹשִׁיעַ
  choice: para salvar
  rationale: O infinitivo hifil de ישׁע expressa salvar ou livrar; «salvar» é direto, corrente e mantém o sentido concreto de resgate.
- source_word: כָּל
  choice: todos
  rationale: Com o substantivo seguinte no plural, expressa a totalidade coletiva do grupo.
- source_word: עַנְוֵי
  choice: os humildes
  rationale: עָנָו pode descrever os humildes, mansos ou aflitos. «Os humildes» preserva bem a possível dimensão ética e social sem restringir o termo apenas ao sofrimento.
- source_word: אֶרֶץ
  choice: terra
  rationale: אֶרֶץ pode significar «terra» no sentido amplo ou «país/território». Neste contexto poético, «terra» preserva naturalmente essa ambiguidade em português.
- source_word: סֶלָה
  choice: Selá
  rationale: A transliteração tradicional conserva o marcador litúrgico ou musical hebraico, cuja função exata permanece incerta.
theological_decisions:
- issue: Nuance semântica de עַנְוֵי
  choice: os humildes
  alternative: os mansos; os aflitos
  rationale: O texto apresenta Deus intervindo judicialmente para salvar um grupo socialmente rebaixado e/ou interiormente humilde. A tradução principal não força apenas uma dessas dimensões; a nota preserva as alternativas legítimas.
- issue: Extensão de אֶרֶץ
  choice: terra
  alternative: país; território
  rationale: O substantivo pode indicar o mundo habitado ou uma terra específica. «Terra» mantém em português a amplitude possível do hebraico sem definir indevidamente o alcance geográfico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético em três linhas. «Para julgar» soa mais natural do que «para o julgamento», sem perder a ação judicial. O acento em «Selá» orienta a pronúncia portuguesa. O marcador [a] aparece no texto e reúne as ambiguidades lexicais genuínas do hemistíquio final.
