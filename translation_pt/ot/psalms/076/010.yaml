  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: pt
  text: Pois a fúria humana te louvará[b]; com o restante da fúria te cingirás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conterás o restante da fúria”. O hebraico da oração final é difícil; o texto principal acompanha mais de perto a formulação massorética e preserva sua metáfora.'
    reason: alternative_reading
  - marker: b
    text: 'Lit.: “a fúria do ser humano”; o termo hebraico אָדָם (adam) refere-se aqui à humanidade em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Conserva a função causal ou explicativa da conjunção no contexto e soa natural em poesia portuguesa.
- source_word: חֲמַת אָדָם
  choice: a fúria humana
  rationale: חֵמָה expressa ira, furor ou ardor, e אָדָם designa aqui a humanidade em geral. A formulação evita que o singular português seja entendido apenas como masculino individual.
- source_word: תּוֹדֶךָּ
  choice: te louvará
  rationale: O hifil de ידה pode significar dar graças ou louvar; no contexto, a fúria humana acaba redundando em louvor a Deus.
- source_word: שְׁאֵרִית
  choice: o restante
  rationale: Expressa de modo claro aquilo que sobra, sem acrescentar conotações técnicas à imagem.
- source_word: חֵמֹת
  choice: da fúria
  rationale: Embora a forma hebraica seja plural, o substantivo coletivo no singular é mais idiomático em português e pode preservar o valor intensivo ou coletivo.
- source_word: תַּחְגֹּר
  choice: te cingirás
  rationale: Mantém a metáfora do verbo חגר, isto é, cingir ou prender algo ao redor de si, sem decidir se a imagem implica vestir, armar-se ou conter.
theological_decisions:
- issue: Interpretação da oração final שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Deus é o sujeito e se cinge metaforicamente com a fúria restante.
  alternative: Conterás o restante da fúria; ou o restante da fúria te rodeará festivamente.
  rationale: A forma verbal na segunda pessoa masculina singular aponta naturalmente para Deus como sujeito. Como o hebraico é difícil, a tradução principal acompanha a vocalização massorética e preserva a metáfora, enquanto a nota registra a interpretação comum de contenção.
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. “Fúria humana” comunica o sentido genérico de אָדָם; “te cingirás” conserva deliberadamente a metáfora difícil do texto massorético.
