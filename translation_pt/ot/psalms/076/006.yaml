    rationale: A preposição hebraica pode ser vertida conforme o contexto por relações de causa ou procedência, mas “a partir de” sugere mais frequentemente um ponto temporal ou espacial. “Por tua repreensão” oferece uma alternativa portuguesa mais pertinente.
