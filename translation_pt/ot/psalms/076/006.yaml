  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: pt
  text: À tua repreensão[a], ó Deus de Jacó, tanto o carro de guerra como o cavalo[b] caíram em sono profundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “Por tua repreensão” ou “Por causa da tua repreensão”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “carro e cavalo”, uma forma poética de representar a força militar; alguns entendem que a imagem inclui também os seus condutores.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: Diante da tua repreensão
  rationale: A preposição מִן pode indicar origem ou causa. “Diante da tua repreensão” expressa de modo natural o efeito imediato da palavra ameaçadora de Deus, sem restringir a relação a uma única nuance causal.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: ó Deus de Jacó
  rationale: A expressão construta é um título divino e, no contexto poético, funciona como vocativo; “ó” torna clara essa interpelação direta.
- source_word: נִרְדָּם
  choice: caíram em sono profundo
  rationale: O nifal de רדם indica sono profundo ou torpor, e não mero repouso. A expressão preserva a imagem poética de incapacitação repentina, sem explicá-la como morte de forma explícita.
- source_word: וְרֶכֶב וָסוּס
  choice: tanto o carro de guerra como o cavalo
  rationale: O hebraico nomeia literalmente o carro e o cavalo. “Carro de guerra” esclarece o sentido militar de רֶכֶב, enquanto a construção correlativa apresenta os dois elementos como uma unidade de poder bélico, sem substituir “carro” por “cavaleiro”.
theological_decisions:
- issue: Natureza da derrota descrita
  choice: A repreensão de Deus deixa impotente a força militar inimiga, por meio da imagem de um sono profundo ou torpor.
  alternative: Entender o verso como sono literal dos animais e do equipamento, ou tornar explícita a morte ou destruição total.
  rationale: O hebraico emprega נִרְדָּם como imagem poética. No contexto da vitória divina, ela comunica incapacitação completa, mas o texto não exige que a tradução resolva a imagem como simples sono literal nem que a converta diretamente em morte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Carro de guerra” evita a possível leitura moderna de automóvel. A concordância no plural trata “o carro de guerra” e “o cavalo” como sujeito composto, e “sono profundo” conserva a força da imagem hebraica.
