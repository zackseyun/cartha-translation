reference: Psalms 76:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: pt
  text: Façam votos a Yahweh, seu Deus, e cumpram-nos; todos os que estão ao redor dele tragam tributo[a] ao Temível[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma dádiva” ou “presentes”. O hebraico שַׁי pode indicar um presente oferecido a um superior honrado; “tributo” ressalta a nuance reverente e possivelmente política.
    reason: lexical_alternative
  - marker: b
    text: Ou “àquele que deve ser temido”. O título hebraico ressalta que Deus é aquele a quem se deve temer e reverenciar.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Façam votos
  rationale: O imperativo plural de נדר convoca os ouvintes a fazer votos; esta é a formulação natural e clara em português moderno.
- source_word: וְשַׁלְּמוּ
  choice: e cumpram-nos
  rationale: שלם, neste contexto, significa pagar ou completar os votos. O pronome retoma explicitamente “votos”, e “cumprir votos” é idiomático em português.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: a Yahweh, seu Deus
  rationale: Preserva o nome divino יהוה e traduz o sufixo plural de אֱלֹהֵיכֶם pelo possessivo português abrangente “seu”.
- source_word: כָּל סְבִיבָיו
  choice: todos os que estão ao redor dele
  rationale: O verbo no plural mostra que a expressão se refere a pessoas ou povos circundantes, não apenas a lugares.
- source_word: יוֹבִילוּ
  choice: tragam
  rationale: O hifil de יבל expressa aqui levar ou trazer uma oferta a um superior; “tragam” é direto e natural.
- source_word: שַׁי
  choice: tributo
  rationale: O termo designa uma dádiva apresentada a alguém honrado ou superior; “tributo” conserva a possível nuance régia e política.
- source_word: לַמּוֹרָא
  choice: ao Temível
  rationale: מורא envolve medo, terror e reverência. Como título divino, “o Temível” mantém a força de Deus como aquele que deve ser temido, sem reduzir a expressão a mera admiração.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Interpretação de לַמּוֹרָא como título divino
  choice: ao Temível
  alternative: àquele que deve ser temido; ao Terrível
  rationale: A escolha conserva a tensão entre temor e reverência presente no salmo e evita suavizar a majestade aterradora de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção exortativa mantém o paralelismo poético; “seu Deus” é naturalmente entendido como plural pelo contexto de “façam” e “cumpram”.
