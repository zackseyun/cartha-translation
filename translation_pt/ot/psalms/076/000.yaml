base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: pt
  text: Ao regente[a]; com instrumentos de cordas. Salmo de Asafe[b], um cântico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao diretor”. O termo hebraico se refere a quem supervisiona a execução musical.'
    reason: alternative_rendering
  - marker: b
    text: A expressão “de Asafe” pode indicar autoria, associação ao grupo de Asafe ou dedicação a Asafe, sem necessariamente atribuir a ele a autoria pessoal.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente quem dirige ou supervisiona a execução musical. “Ao regente” é conciso, natural em português e preserva o contexto litúrgico-musical.
- source_word: בִּנְגִינֹת
  choice: com instrumentos de cordas
  rationale: O substantivo se refere à música ou a instrumentos de cordas. A formulação mantém o sentido instrumental sem especificar indevidamente a técnica de execução.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o rótulo convencional do gênero e, em português, funciona naturalmente sem artigo nos cabeçalhos, distinguindo-se do termo seguinte, “cântico”.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A preposição ל nos títulos pode indicar autoria, associação ou dedicação. A expressão tradicional “de Asafe” mantém essa ambiguidade de modo conciso, esclarecida em nota.
- source_word: שִׁיר
  choice: um cântico
  rationale: Trata-se de um segundo rótulo de gênero, em aposição a “Salmo”. “Um cântico” conserva a dupla classificação do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula apresenta as duas instruções musicais como relacionadas, mas distintas. Os marcadores [a] e [b] aparecem no texto principal junto às expressões que esclarecem.
