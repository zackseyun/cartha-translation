  text: נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽ/הַרְרֵי טָֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: pt
  text: Tu és radiante, mais majestoso que os montes de presa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais majestoso que os montes de despojo (ou saque)». A palavra hebraica pode significar «presa» e, por extensão, «despojo» ou «saque».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: radiante
  rationale: Expressa brilho e esplendor de modo natural e poético em português, sem sugerir que a luz seja recebida de outra fonte.
- source_word: אַתָּה
  choice: tu és
  rationale: A cópula, implícita na oração nominal hebraica, é necessária em português. O pronome «tu» preserva o tratamento direto e solene, com ampla inteligibilidade.
- source_word: אַדִּיר
  choice: mais majestoso
  rationale: O adjetivo abrange majestade, nobreza e poder; a construção com מִן favorece aqui o sentido comparativo.
- source_word: מֵהַרְרֵי
  choice: que os montes de
  rationale: O מִן prefixado pode indicar comparação ou separação. Com אַדִּיר, «mais majestoso que» é a leitura sintática mais natural, preservando a relação construta com «montes».
- source_word: טָרֶף
  choice: presa
  rationale: O substantivo designa normalmente a presa de um predador e, por extensão, despojo ou saque. «Presa» conserva a imagem vívida e a ambiguidade poética.
theological_decisions:
- issue: Sentido da expressão comparativa מֵהַרְרֵי טָרֶף
  choice: 'Comparação: Deus é mais majestoso que «os montes de presa».'
  alternative: 'Sentido separativo ou locativo: Deus resplandece desde os montes de presa; ou leitura de טָרֶף como «despojo/saque».'
  rationale: A sintaxe imediata com אַדִּיר favorece a comparação, mas a nota conserva a alternativa lexical de טָרֶף. A tradução não identifica os montes com um referente histórico ou teológico específico.
translation_notes:
  register: Português moderno, poético e digno, com legibilidade brasileira. «Montes» foi preferido a «montanhas» por concisão poética e uso bíblico corrente; a imagem incomum do hebraico foi mantida sem explicação dentro do versículo.
