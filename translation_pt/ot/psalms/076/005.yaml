  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: pt
  text: Os valentes de coração foram despojados; dormiram o seu sono, e nenhum dos guerreiros encontrou as próprias mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum dos guerreiros conseguiu usar as mãos”, isto é, todos ficaram sem poder agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: foram despojados
  rationale: O verbo, derivado de שלל em forma reflexiva/passiva, indica que os próprios guerreiros valentes foram privados de seus despojos ou recursos. “Foram despojados” preserva o cenário militar e o tom poético.
- source_word: אַבִּירֵי לֵב
  choice: os valentes de coração
  rationale: Traduz de modo próximo a expressão literal “poderosos/valentes de coração”, conservando tanto a coragem quanto a determinação interior, sem reduzi-la simplesmente a “guerreiros”.
- source_word: נָמוּ שְׁנָתָם
  choice: dormiram o seu sono
  rationale: Mantém a construção cognata e a imagem poética do hebraico, sem decidir explicitamente se se trata de sono literal, sono semelhante à morte ou morte.
- source_word: אַנְשֵׁי חַיִל
  choice: guerreiros
  rationale: No contexto bélico, “guerreiros” comunica de maneira natural a ideia de homens fortes e valentes, evitando uma formulação portuguesa excessivamente arcaica.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: nenhum dos guerreiros encontrou as próprias mãos
  rationale: Preserva no texto principal a imagem hebraica incomum de “não encontrar as mãos”, enquanto a nota esclarece seu provável sentido idiomático de incapacidade para agir.
theological_decisions:
- issue: A natureza do “sono” dos derrotados
  choice: Manter “dormiram o seu sono” sem explicitar morte
  alternative: “Dormiram o sono da morte”
  rationale: Embora o contexto sugira derrota mortal, a expressão hebraica não inclui a palavra “morte”. A tradução conserva a ambiguidade e a força poética.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A ordem e as imagens hebraicas foram preservadas quando compreensíveis; a expressão mais obscura é esclarecida em nota.
