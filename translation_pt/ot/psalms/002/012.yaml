  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: pt
  text: Beijem o filho[a][b], para que ele não fique irado e vocês pereçam no caminho, pois sua ira se acende depressa.[c] Felizes são todos os que nele se refugiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Prestem homenagem ao filho”. O verbo significa literalmente “beijem” e, num contexto régio, pode indicar um ato de submissão ou homenagem.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica bar é incomum aqui. Geralmente é entendida como “filho”, em harmonia com o Salmo 2:7, mas também foram propostas traduções como “pureza” ou “puramente”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “pois sua ira se acenderá dentro de pouco tempo” ou “pois sua ira se acende por pouco tempo”. A expressão hebraica é concisa e pode enfatizar a rapidez ou iminência, ou uma breve duração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Beijem
  rationale: O imperativo plural de נשׁק significa literalmente “beijem”. No contexto régio, o gesto expressa submissão ou homenagem, mas a imagem concreta do hebraico é mantida no texto, com a explicação interpretativa em nota.
- source_word: בַר
  choice: o filho
  rationale: Embora בר seja incomum neste contexto hebraico, “filho” se ajusta à linguagem régia e filial do salmo, especialmente ao versículo 7. A dificuldade lexical e outras propostas são registradas em nota.
- source_word: פֶּן יֶאֱנַף
  choice: para que ele não fique irado
  rationale: פן introduz uma consequência negativa a ser evitada, e אנף denota ira. A formulação é clara e natural em português atual, sem tornar explícita uma identidade que o pronome hebraico deixa implícita.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: e vocês pereçam no caminho
  rationale: אבד expressa perecer, e דרך aparece numa construção poética comprimida, sem preposição. “No caminho” conserva tanto a concisão quanto a imagem do percurso.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: pois sua ira se acende depressa
  rationale: יבער preserva a metáfora de fogo ou combustão, enquanto כמעט pode sugerir rapidez, iminência ou pequena medida. A tradução principal comunica o súbito acender da ira; outras nuances permanecem em nota.
- source_word: אַשְׁרֵי
  choice: Felizes são
  rationale: Fórmula de bem-aventurança característica dos Salmos. “Felizes são” é digna, clara e natural, sem reduzir a declaração a um estado emocional passageiro.
- source_word: חֹסֵי בוֹ
  choice: todos os que nele se refugiam
  rationale: חסה descreve buscar abrigo ou proteção. “Refugiam-se nele” preserva diretamente a imagem de Deus ou do rei como refúgio, sem substituí-la apenas pela ideia mais abstrata de confiar.
theological_decisions:
- issue: Identidade de בַר no Salmo 2:12
  choice: Traduzido como “o filho”, em continuidade com a linguagem do filho régio no Salmo 2:7.
  alternative: Entender בר como “pureza”, “puramente” ou tratá-lo como um problema textual sem referência filial.
  rationale: O contexto literário favorece um referente filial e régio, sem exigir que o versículo explicite desenvolvimentos doutrinários posteriores. Como a palavra é disputada, as alternativas são reconhecidas em nota.
- issue: Referente de “sua ira” e de “nele”
  choice: Mantidos por meio de pronomes, sem identificação explicativa acrescentada.
  alternative: Explicitar no texto se cada pronome se refere ao SENHOR ou ao filho régio.
  rationale: Os sufixos hebraicos são masculinos singulares, mas a passagem compacta permite discussão quanto ao referente. A tradução conserva essa tensão em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e as imagens poéticas do hebraico foram preservadas quando naturais; ambiguidades lexicais e referenciais genuínas não foram eliminadas.
