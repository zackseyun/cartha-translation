source:
  edition: WLC
  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: pt
  text: Por que as nações se agitam, e os povos tramam algo vão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “murmuram sobre o vazio”, “meditam no que é vazio” ou, tradicionalmente, “tramam em vão”. O verbo hebraico pode indicar murmurar ou meditar, além de maquinar; o substantivo significa vazio, vaidade ou aquilo que é inútil.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo natural em português, preservando a força retórica da pergunta.
- source_word: רָגְשׁוּ
  choice: se agitam
  rationale: Expressa o tumulto e a inquietação coletiva do verbo hebraico sem restringi-lo ao sentido emocional de ira nem antecipar a ideia mais interpretativa de conspiração.
- source_word: גוֹיִם
  choice: as nações
  rationale: Refere-se aqui a coletividades políticas; evita a conotação posterior que 'gentios' poderia introduzir.
- source_word: לְאֻמִּים
  choice: os povos
  rationale: Preserva o paralelismo hebraico e a distinção aproximada em relação a 'nações'.
- source_word: יֶהְגּוּ
  choice: tramam
  rationale: No contexto de rebelião política, comunica a ideia de conceber ou maquinar, embora o verbo também possa indicar murmurar ou meditar.
- source_word: רִיק
  choice: algo vão
  rationale: Mantém o substantivo como objeto do verbo e transmite a ideia de vazio, inutilidade ou futilidade, em vez de convertê-lo apenas em expressão adverbial.
theological_decisions: []
