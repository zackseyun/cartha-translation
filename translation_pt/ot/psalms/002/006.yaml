id: PSA.2.6
reference: Psalms 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: pt
  text: Mas eu estabeleci o meu rei em Sião, meu santo monte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coloquei o meu rei”; alguns entendem o verbo como “ungi o meu rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente é enfática e adversativa no contexto, contrastando a ação do SENHOR com a rebelião das nações. “Mas eu” expressa isso com naturalidade em português.
- source_word: נָסַכְתִּי
  choice: estabeleci
  rationale: Neste contexto, o verbo indica a designação ou entronização do rei. “Estabeleci” comunica a nomeação régia sem confundir o termo com o verbo hebraico usual para ungir; a nota preserva alternativas lexicais genuínas.
- source_word: מַלְכִּי
  choice: o meu rei
  rationale: Reproduz o substantivo com o sufixo possessivo de primeira pessoa. A minúscula evita acrescentar ao verso uma conclusão interpretativa, embora o contexto canônico permita leitura messiânica.
- source_word: עַל
  choice: em
  rationale: Diante do topônimo Sião, “em” é a forma locativa mais natural em português; não sugere domínio sobre Sião, mas o lugar onde o rei foi estabelecido.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: הַר קָדְשִׁי
  choice: meu santo monte
  rationale: Tradução idiomática e formalmente próxima da expressão hebraica, preservando הַר como “monte” e o sufixo possessivo como “meu”.
theological_decisions:
- issue: Se נָסַכְתִּי deve ser traduzido de modo a indicar unção ritual ou entronização régia
  choice: designação/entronização régia (“estabeleci o meu rei”)
  alternative: unção ritual (“ungi o meu rei”) ou simples colocação (“coloquei o meu rei”)
  rationale: O contexto apresenta a resposta do SENHOR aos reis rebeldes por meio da instituição do seu próprio rei em Sião. “Estabeleci” preserva a força régia sem identificar o verbo com משׁח, normalmente usado para “ungir”, nem impor uma leitura ritual mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem “meu santo monte” mantém a fluidez poética; “Sião” segue o uso bíblico consolidado.
