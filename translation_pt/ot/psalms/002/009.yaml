base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: pt
  text: Tu os quebrarás com um cetro de ferro[a][b]; como um vaso de oleiro, tu os despedaçarás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma tradição textual alternativa refletida em algumas versões antigas e nas citações de Apocalipse: “Tu os apascentarás com um cetro de ferro” ou “Tu os governarás com um cetro de ferro”.'
    reason: alternative_reading
  - marker: b
    text: “Cetro” também pode ser traduzido por “vara”; o termo hebraico pode designar uma vara de autoridade ou um instrumento de disciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: tu os quebrarás
  rationale: A vocalização do Texto Massorético e o paralelismo com תְּנַפְּצֵם favorecem o sentido de quebrar, exprimindo juízo destrutivo. A tradição alternativa, “apascentar/governar”, é preservada em nota.
- source_word: בְּשֵׁבֶט
  choice: com um cetro
  rationale: שֵׁבֶט pode significar vara, bastão ou cetro. No contexto régio do Salmo 2, “cetro” comunica com naturalidade a autoridade real e continua adequado como instrumento de juízo.
- source_word: בַּרְזֶל
  choice: de ferro
  rationale: Tradução direta do material, destacando força e severidade.
- source_word: כִּכְלִי יוֹצֵר
  choice: como um vaso de oleiro
  rationale: כְּלִי é um recipiente ou utensílio; em associação com יוֹצֵר, a expressão designa naturalmente uma peça de cerâmica produzida por um oleiro.
- source_word: תְּנַפְּצֵם
  choice: tu os despedaçarás
  rationale: O verbo descreve esmagar ou partir violentamente. “Despedaçarás” é claro, vívido e mantém a imagem do vaso reduzido a pedaços.
theological_decisions:
- issue: Se o primeiro verbo descreve governo régio ou juízo destrutivo
  choice: 'Juízo destrutivo: “tu os quebrarás”'
  alternative: 'Governo régio: “tu os apascentarás” ou “tu os governarás”'
  rationale: A vocalização massorética e o paralelismo sinonímico com “tu os despedaçarás” favorecem o juízo destrutivo. Como algumas versões antigas e as citações em Apocalipse refletem a leitura ligada a apascentar ou governar, essa alternativa relevante é registrada em nota, sem substituir o texto hebraico vocalizado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “tu” preserva a forma direta e solene do discurso ao rei ungido; as formas verbais explicitam o sujeito sem acrescentar interpretação. Os marcadores seguem a ordem de aparecimento no texto.
