  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: pt
  text: Aquele que está entronizado nos céus ri[a]; o Senhor zomba deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que se assenta nos céus ri; o Senhor escarnece deles.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: aquele que está entronizado
  rationale: O particípio de ישׁב significa literalmente “sentado” ou “habitando”, mas, neste salmo real, a posição de Deus nos céus sugere governo soberano. “Está entronizado” comunica essa nuance sem eliminar a alternativa mais literal, registrada em nota.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: Mantém o plural morfológico do hebraico e o registro elevado da poesia, evitando o sentido físico mais estreito de “céu” como firmamento.
- source_word: יִשְׂחָק
  choice: ri
  rationale: O yiqtol tem aqui valor poético presente ou durativo. O presente português é vívido e natural; a força de desprezo emerge do contexto e do verbo paralelo.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Trata-se do título אֲדֹנָי, não do nome divino YHWH. “O Senhor” é a tradução portuguesa corrente e digna para esse título.
- source_word: יִלְעַג
  choice: zomba
  rationale: לעג expressa zombaria ou escárnio. “Zomba” é claro, atual e vigoroso, preservando o paralelismo com “ri”.
- source_word: לָמוֹ
  choice: deles
  rationale: 'O pronome retoma as nações e os governantes rebeldes dos versos anteriores. Com “zombar”, o português idiomático exige a preposição “de”: “zomba deles”.'
theological_decisions:
- issue: Retrato régio e antropomórfico de Deus
  choice: Traduzir o particípio com força régia (“está entronizado”), preservando literalmente os verbos antropomórficos “ri” e “zomba”.
  alternative: “Aquele que se assenta nos céus ri; o Senhor escarnece deles.”
  rationale: O verso retrata o desprezo soberano de Deus diante dos governantes rebeldes. A tradução mantém tanto a imagem de realeza sugerida pelo contexto quanto a linguagem antropomórfica vívida, sem explicá-la ou suavizá-la teologicamente.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. O plural “céus” conserva o tom elevado; “está entronizado” explicita com moderação a imagem régia contextual. A alternativa mais formal e literal foi preservada em nota.
