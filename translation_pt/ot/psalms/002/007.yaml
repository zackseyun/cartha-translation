  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: pt
  text: 'Proclamarei o decreto de Yahweh: Ele me disse: “Você é meu Filho[a]; hoje eu o gerei[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu filho”. O hebraico não distingue letras maiúsculas de minúsculas; o texto principal usa “Filho” para refletir o significado régio-messiânico do versículo em seu contexto e em seu uso canônico posterior.
    reason: alternative_reading
  - marker: b
    text: Ou “hoje me tornei seu pai”. Mais literalmente, o hebraico emprega linguagem de geração, que pode evocar entronização ou adoção régia; essa imagem é preservada no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Proclamarei
  rationale: A forma volitiva introduz uma declaração solene. “Proclamarei” é natural em português e conserva o tom régio e público do enunciado.
- source_word: אֶל־חֹק
  choice: o decreto
  rationale: Com o verbo ספר, אֶל introduz aqui o conteúdo ou objeto da proclamação. חֹק, no contexto de entronização, designa uma determinação régia autorizada; “decreto” comunica isso melhor que “estatuto” ou “ordenança”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: אָמַר אֵלַי
  choice: Ele me disse
  rationale: O sujeito é Yahweh, mencionado imediatamente antes. O pronome retoma esse referente com clareza e fluidez em português.
- source_word: בְּנִי אַתָּה
  choice: Você é meu Filho
  rationale: Reproduz naturalmente a construção hebraica “meu filho és tu”. A inicial maiúscula sinaliza a relevância régio-messiânica reconhecida no contexto canônico, sem alterar o sentido lexical; a ausência de distinção gráfica no hebraico é registrada em nota.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto, preservando a ênfase temporal.
- source_word: יְלִדְתִּיךָ
  choice: eu o gerei
  rationale: O verbo ילד emprega linguagem de geração ou nascimento. “Gerei” preserva essa imagem e seu peso intertextual sem decidir se ela descreve entronização, adoção régia ou outro aspecto do cumprimento messiânico.
theological_decisions:
- issue: Filiação régia e significado messiânico de בְּנִי
  choice: “Você é meu Filho” no texto principal
  alternative: “Você é meu filho”
  rationale: O contexto imediato trata do rei davídico, e o uso canônico posterior recebe o versículo como messiânico. A maiúscula torna visível essa dimensão em português, enquanto a nota reconhece que o hebraico não marca capitalização.
- issue: Sentido de “hoje eu o gerei”
  choice: Manter a linguagem de geração
  alternative: “hoje me tornei seu pai”
  rationale: A formulação hebraica usa explicitamente a imagem de gerar. A tradução não resolve de modo indevido a tensão entre entronização régia, adoção pactual e cumprimento messiânico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita o caráter regional ou arcaizante de “tu” para parte do público; “Proclamarei” sustenta a solenidade poética. Os dois marcadores de nota aparecem no texto principal e correspondem às notas.
