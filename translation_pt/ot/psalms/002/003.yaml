lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Rompamos
  rationale: O coortativo na primeira pessoa do plural expressa resolução ou exortação. “Rompamos” comunica de modo natural e vigoroso a ação de partir ou soltar à força.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: as correntes deles
  rationale: O substantivo plural designa meios de restrição, vínculos ou grilhões. “Correntes” mantém concreta e acessível a metáfora, sem explicá-la teologicamente.
- source_word: וְנַשְׁלִיכָה
  choice: e livremo-nos
  rationale: O segundo coortativo, unido à expressão “de nós”, indica rejeição e afastamento. Em português, “livremo-nos de” exprime naturalmente o gesto de lançar para longe, embora a nota preserve uma tradução mais formal.
- source_word: מִמֶּנּוּ
  choice: -nos ... das
  rationale: A preposição com o sufixo da primeira pessoa do plural indica remoção para longe dos próprios falantes; a construção portuguesa “livremo-nos das” incorpora esse sentido com clareza.
- source_word: עֲבֹתֵימוֹ
  choice: suas cordas
  rationale: O termo denota cordas ou cabos, possivelmente grossos. “Cordas” é corrente em português e conserva o paralelismo concreto com “correntes”.
theological_decisions:
- issue: Metáfora da restrição divina e régia
  choice: Manter imagens físicas concretas — “correntes” e “cordas” — sem caracterizá-las como opressivas ou benéficas.
  alternative: Empregar termos mais abstratos, como “laços” e “vínculos”.
  rationale: No contexto, as nações rejeitam o SENHOR e seu Ungido, mas o próprio verso apenas reproduz metaforicamente a fala delas. A formulação concreta preserva a força poética e a tensão teológica sem endossar a perspectiva dos rebeldes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta recebe aspas por continuar as palavras dos reis e governantes do versículo anterior. Os coortativos são reproduzidos pelo presente do subjuntivo com valor exortativo. Evitou-se linguagem arcaica e também uma paráfrase que explicasse a metáfora.
