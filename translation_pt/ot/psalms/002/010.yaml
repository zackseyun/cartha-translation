  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: pt
  text: Agora, pois, ó reis, ajam com sabedoria; aceitem a correção[a], ó juízes da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «deixem-se instruir» ou «aceitem a advertência». O verbo hebraico pode se referir a receber disciplina, instrução, correção ou admoestação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Preserva tanto a ligação inferencial com os versículos anteriores quanto a força temporal, em português claro e natural.
- source_word: מְלָכִים
  choice: ó reis
  rationale: O contexto exige vocativo; «ó» conserva o tom elevado da poesia sem obscurecer o sentido.
- source_word: הַשְׂכִּילוּ
  choice: ajam com sabedoria
  rationale: O imperativo hifil de שכל envolve discernimento prudente que se manifesta na conduta; esta formulação comunica melhor essa dimensão ativa do que apenas «sejam sábios».
- source_word: הִוָּסְרוּ
  choice: aceitem a correção
  rationale: O imperativo nifal de יסר pode indicar receber disciplina, instrução ou advertência. «Aceitem a correção» preserva a receptividade exigida sem limitar o verbo à ideia de aviso.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: ó juízes da terra
  rationale: Mantém o sentido específico de autoridades que julgam e, no horizonte internacional do salmo, traduz אֶרֶץ por «terra», não por «país».
