source:
  edition: WLC
  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: pt
  text: Os reis da terra tomam posição, e os governantes se unem contra Yahweh e contra o seu Ungido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o SENHOR e contra o seu Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: tomam posição
  rationale: O hitpael de יצב indica que eles se colocam deliberadamente em posição; no contexto, trata-se de uma postura de oposição. “Tomam posição” preserva essa nuance reflexiva e intencional em português natural.
- source_word: מַלְכֵי אֶרֶץ
  choice: os reis da terra
  rationale: A construção designa os reis do mundo habitado em perspectiva ampla, não apenas os reis de uma região específica.
- source_word: רוֹזְנִים
  choice: os governantes
  rationale: O termo se refere a autoridades ou dirigentes políticos de alta posição. “Governantes” é claro, atual e suficientemente abrangente.
- source_word: נוֹסְדוּ יָחַד
  choice: se unem
  rationale: Neste contexto, a expressão comunica ação conjunta e coordenada. “Se unem” preserva a ideia de associação em oposição sem explicitar além do hebraico se houve reunião física ou deliberação formal.
- source_word: עַל
  choice: contra
  rationale: O contexto hostil dá à preposição sentido adversativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: מְשִׁיחוֹ
  choice: o seu Ungido
  rationale: A expressão significa literalmente “seu ungido” e pode referir-se imediatamente ao rei davídico, conservando ao mesmo tempo a relevância messiânica do salmo sem resolver essa tensão no texto principal.
theological_decisions:
- issue: Alcance régio e messiânico de מְשִׁיחוֹ
  choice: o seu Ungido
  alternative: o seu Messias
  rationale: “Ungido” representa diretamente o substantivo hebraico e mantém aberto tanto o referente régio imediato quanto o desenvolvimento messiânico canônico. “Messias” tornaria esse último aspecto mais explícito, mas seria mais interpretativo neste ponto.
- issue: Representação do tetragrama יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto fonte contém o nome próprio divino. “Yahweh” o representa diretamente; a forma tradicional com título é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e evita arcaísmos; “se unem” exprime a ação coordenada de נוֹסְדוּ יָחַד sem impor a interpretação mais forte “conspiram”.
