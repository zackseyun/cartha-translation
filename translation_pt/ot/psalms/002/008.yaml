revisions:
- from: Pede-me, e eu te darei as nações como tua herança e os confins da terra como tua possessão.[a]
  to: Pede-me, e eu te darei as nações como tua herança e os confins da terra[a] como tua propriedade.
  rationale: A revisão substitui «possessão» por «propriedade», equivalente semântico mais natural para o português moderno neste paralelismo, e reposiciona o marcador para ancorá-lo diretamente em «os confins da terra». O sentido, o registro e a abertura interpretativa do hebraico permanecem inalterados.
