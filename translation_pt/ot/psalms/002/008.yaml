    rationale: Como a nota oferece uma alternativa apenas para «os confins da terra», convém inserir o marcador logo após essa expressão para tornar o vínculo inequívoco.
  revised_text: Pede-me, e eu te darei as nações como tua herança e os confins da terra[a] como tua propriedade.
