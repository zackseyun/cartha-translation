  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: pt
  text: Pede-me, e eu te darei as nações como tua herança e os confins da terra[a] como tua propriedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as regiões mais distantes da terra”.'
    reason: Alternativa lexical para אַפְסֵי אָרֶץ, expressão que pode ressaltar os pontos mais remotos da terra.
lexical_decisions:
- source_word: שְׁאַל
  choice: Pede
  rationale: Imperativo masculino singular de שאל. “Pede” expressa de modo direto e natural a ordem para apresentar um pedido.
- source_word: מִמֶּנִּי
  choice: me
  rationale: Com שאל, a preposição מן e o sufixo da primeira pessoa indicam aquele a quem se dirige o pedido. A construção portuguesa “pede-me” comunica isso de forma idiomática e concisa.
- source_word: וְאֶתְּנָה
  choice: e eu te darei
  rationale: A forma volitiva de נתן após o imperativo funciona como resposta promissória. O futuro “darei” preserva a força do compromisso sem ampliar o valor da conjunção.
- source_word: גּוֹיִם
  choice: as nações
  rationale: גּוֹיִם designa povos ou nações. “As nações” corresponde ao alcance internacional do verso sem introduzir a distinção posterior sugerida por “gentios”.
- source_word: נַחֲלָתֶךָ
  choice: como tua herança
  rationale: נַחֲלָה indica herança, patrimônio ou porção recebida. “Como tua herança” explicita naturalmente em português a relação predicativa entre as nações e a herança.
- source_word: וַאֲחֻזָּתְךָ
  choice: como tua possessão
  rationale: אֲחֻזָּה é aquilo que alguém possui ou detém. “Possessão” mantém o paralelismo com “herança” e distingue os dois substantivos.
- source_word: אַפְסֵי אָרֶץ
  choice: os confins da terra
  rationale: A expressão designa os extremos ou limites mais remotos da terra. “Os confins da terra” é uma formulação portuguesa clara, digna e consolidada, preservando sua dimensão geográfica abrangente.
theological_decisions:
- issue: Alcance régio ou messiânico da promessa
  choice: Apresentar o verso diretamente como promessa divina ao rei/filho a quem Deus se dirige, sem explicitar uma identificação messiânica no texto.
  alternative: Empregar uma paráfrase explicitamente messiânica.
  rationale: O hebraico promete domínio de alcance mundial ao rei/filho interpelado. Embora o Salmo 2 tenha leitura messiânica e cristológica na tradição cristã, o verso não explicita essa identificação; a tradução mantém aberta a relação entre o contexto régio e sua leitura canônica.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade no Brasil e compreensão internacional. O tratamento por “tu” conserva com clareza os sufixos de segunda pessoa singular dirigidos ao rei/filho. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
