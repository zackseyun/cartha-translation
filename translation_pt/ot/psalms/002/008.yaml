  naturalness: «Pede-me, e eu te darei» é natural, solene sem ser arcaico, e o tratamento por «tu» mantém claramente a segunda pessoa do singular. «Possessão», embora possível, é menos idiomático no português atual e pode sugerir sentidos alheios ao contexto; «propriedade» é mais claro e natural aqui.
  terminology: «Nações», «herança» e «confins da terra» são escolhas adequadas e preservam o paralelismo régio-territorial. «Propriedade» traduz bem אֲחֻזָּה como bem possuído/território detido, sem apagar sua distinção de נַחֲלָה («herança»).
  issues:
