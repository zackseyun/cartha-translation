base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: pt
  text: Então ele lhes falará em sua ira e, em seu furor ardente, os aterrorizará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, no calor de sua ira, os deixará consternados”.'
    reason: Alternativa lexical que preserva a metáfora térmica de חָרוֹן e o possível sentido de consternação em בהל.
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a ação seguinte na sequência do salmo e preserva com naturalidade a progressão narrativa.
- source_word: יְדַבֵּר
  choice: falará
  rationale: O imperfeito piel apresenta aqui a resposta subsequente de Deus; o futuro é natural no contexto.
- source_word: אֵלֵימוֹ
  choice: lhes
  rationale: Retoma de maneira concisa os reis e governantes rebeldes mencionados nos versículos anteriores.
- source_word: בְאַפּוֹ
  choice: em sua ira
  rationale: אַף designa idiomaticamente ira; a formulação mantém a força do hebraico sem reproduzir literalmente a imagem obscura do nariz.
- source_word: וּבַחֲרוֹנוֹ
  choice: e, em seu furor ardente
  rationale: חָרוֹן expressa ira intensa e conserva a imagem de calor; “furor ardente” distingue a expressão do termo anterior.
- source_word: יְבַהֲלֵמוֹ
  choice: os aterrorizará
  rationale: O piel de בהל indica causar pavor repentino, perturbação ou consternação; “aterrorizará” comunica adequadamente sua intensidade neste contexto.
theological_decisions:
- issue: Linguagem antropopática sobre a ira divina
  choice: Manter explicitamente “sua ira” e “seu furor ardente”.
  alternative: Abrandar como “seu desagrado” ou reformular apenas como juízo.
  rationale: O hebraico apresenta com força a oposição pessoal de Deus à rebelião; a tradução preserva essa tensão teológica sem explicá-la nem suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo, a intensidade crescente entre “ira” e “furor ardente” e a força futura/sequencial dos verbos.
