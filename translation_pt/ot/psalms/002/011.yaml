source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: pt
  text: Sirvam a Yahweh com temor[a] e alegrem-se[b] com tremor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com reverência”; a palavra hebraica traduzida como “temor” também pode expressar assombro reverente diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “exultem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Sirvam
  rationale: O imperativo plural de עבד expressa serviço e lealdade prestados a Yahweh; “sirvam” preserva essa amplitude sem restringir o sentido ao culto ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: בְּיִרְאָה
  choice: com temor
  rationale: יִרְאָה pode indicar medo, assombro ou reverência. “Com temor” é direto e mantém o tom forte de submissão à autoridade divina.
- source_word: וְגִילוּ
  choice: e alegrem-se
  rationale: גיל denota alegrar-se ou exultar. “Alegrem-se” é claro e natural, mantendo a força do imperativo.
- source_word: בִּרְעָדָה
  choice: com tremor
  rationale: רְעָדָה designa tremor ou estremecimento, frequentemente diante do medo ou assombro; “com tremor” preserva a justaposição paradoxal com a alegria.
theological_decisions:
- issue: A justaposição entre serviço temeroso e alegria trêmula
  choice: 'Manter os dois imperativos em tensão: “Sirvam a Yahweh com temor e alegrem-se com tremor.”'
  alternative: Suavizar para “Adorem Yahweh com reverência e celebrem respeitosamente.”
  rationale: O hebraico associa temor e alegria sem explicar nem resolver a tensão; a tradução conserva ambos os elementos.
- issue: Forma de verter יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com concordância no plural. A colocação dos marcadores segue imediatamente os termos a que as notas se referem. A formulação preserva o paralelismo e a tensão do hebraico.
