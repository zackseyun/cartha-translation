base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: pt
  text: Eu te darei graças[a] entre os povos, ó Yahweh[b], e cantarei louvores a ti entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu te louvarei”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, aqui representado como “Yahweh”.'
    reason: divine_name
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Eu te darei graças
  rationale: O hifil de ידה, em contextos de culto nos Salmos, expressa agradecimento ou louvor mediante reconhecimento público. “Darei graças” preserva o sentido de gratidão e a referência direta a Deus.
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: O plural de עַם designa aqui diversos povos e comunica o alcance internacional do louvor.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama; “ó” marca naturalmente o vocativo em português.
- source_word: וַאֲזַמֶּרְךָ
  choice: e cantarei louvores a ti
  rationale: O piel de זמר denota cantar ou fazer música em louvor. A formulação conserva tanto o aspecto musical quanto o caráter de adoração.
- source_word: בַּל
  choice: entre
  rationale: Neste uso poético, a forma funciona como preposição paralela a בָּ no primeiro membro do verso.
- source_word: אֻמִּים
  choice: as nações
  rationale: O termo se refere a comunidades ou nações. “Nações” distingue-o de עַמִּים sem apagar o paralelismo semântico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de ידה no hifil
  choice: darei graças
  alternative: louvarei
  rationale: Os dois sentidos são possíveis no contexto salmódico. O texto principal expressa agradecimento, enquanto a nota preserva a possibilidade de louvor.
translation_notes:
  register: Português moderno, claro e solene, com ordem sintática natural. O paralelismo “entre os povos... entre as nações” foi mantido, assim como a repetição do destinatário divino nas duas linhas poéticas.
