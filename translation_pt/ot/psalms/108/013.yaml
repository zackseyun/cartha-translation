  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: pt
  text: Com Deus, faremos proezas[a], e ele pisoteará os nossos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiremos com valentia” ou “realizaremos feitos poderosos”; a expressão hebraica pode enfatizar força, valor ou ação vitoriosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Com Deus
  rationale: A preposição בְּ pode indicar associação ou meio. “Com Deus” soa natural em português e expressa dependência da ajuda divina sem restringir o sentido apenas à instrumentalidade.
- source_word: נַעֲשֶׂה חָיִל
  choice: faremos proezas
  rationale: A expressão idiomática combina o verbo עשה com חַיִל, termo que pode indicar força, valor, capacidade militar ou feitos poderosos. “Faremos proezas” preserva a ação coletiva e se ajusta ao contexto de vitória.
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém a coordenação simples e o pronome explícito, destacando a passagem da ação do povo para a ação decisiva de Deus.
- source_word: יָבוּס
  choice: pisoteará
  rationale: O verbo בוס significa calcar ou pisotear. A escolha conserva a imagem forte e concreta de derrota militar.
- source_word: צָרֵינוּ
  choice: os nossos inimigos
  rationale: O substantivo designa pessoas hostis ou adversários. “Inimigos” é claro, corrente e adequado ao registro poético.
theological_decisions:
- issue: Agência na vitória
  choice: Preservar tanto a atuação humana dependente de Deus (“faremos proezas”) quanto a ação divina decisiva (“ele pisoteará”).
  alternative: Traduzir de modo a atribuir toda a ação exclusivamente a Deus, ou reduzir Deus a mero apoio à iniciativa humana.
  rationale: O hebraico afirma a ação corajosa da comunidade em relação de dependência de Deus e, em seguida, atribui ao próprio Deus a derrota dos inimigos. A tradução mantém essa tensão sem dissolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Faremos proezas” reproduz naturalmente o idioma hebraico, enquanto “pisoteará” conserva sua imagem militar vívida.
