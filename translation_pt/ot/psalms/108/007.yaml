source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: pt
  text: 'Deus falou em sua santidade[a]: “Eu exultarei[b]; repartirei Siquém e medirei o vale de Sucote.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu lugar santo” ou “por sua santidade”. A expressão hebraica pode indicar a santidade de Deus ou um lugar santo associado a ele.
    reason: lexical_alternative
  - marker: b
    text: Ou “me alegrarei”. O verbo hebraico expressa alegria jubilosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo no singular identifica o Deus de Israel, não uma referência plural a deuses.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta uma declaração divina concluída; em português, o pretérito perfeito é natural e preserva sua força no contexto.
- source_word: בְּקָדְשׁוֹ
  choice: em sua santidade
  rationale: Conserva a leitura atributiva mais provável e também a formulação poética, sem ocultar que קֹדֶשׁ pode designar um lugar santo ou que a preposição pode ter valor instrumental.
- source_word: אֶעְלֹזָה
  choice: exultarei
  rationale: Expressa alegria intensa e triunfante em registro elevado, mas compreensível.
- source_word: אֲחַלְּקָה
  choice: repartirei
  rationale: No contexto territorial, comunica a divisão ou distribuição da terra de forma concisa e natural.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo hebraico.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: e o vale de Sucote
  rationale: Representa naturalmente a relação construta entre o vale e o topônimo, usando uma forma portuguesa corrente do nome.
- source_word: אֲמַדֵּד
  choice: medirei
  rationale: Mantém a imagem concreta de medir território; o contexto já sugere domínio e distribuição, sem precisar explicitá-los no verbo.
theological_decisions:
- issue: Identidade do falante e extensão da citação
  choice: Os verbos na primeira pessoa são apresentados como palavras do próprio Deus sobre sua autoridade territorial.
  alternative: O salmista começa a falar em primeira pessoa depois de relatar que Deus falou.
  rationale: A leitura contínua como discurso direto divino é sintaticamente natural após “Deus falou” e corresponde melhor às declarações de domínio sobre Siquém e o vale de Sucote.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem da frase e o paralelismo poético foram preservados; “exultarei” mantém o tom jubiloso, enquanto as notas registram ambiguidades reais do hebraico.
