  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: pt
  text: Quem me levará à cidade fortificada? Quem me conduzirá até Edom?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica do segundo verbo é, literalmente, “me conduziu”, mas no paralelismo poético pode assumir o sentido futuro da primeira pergunta.
    reason: lexical_alternative
  - marker: b
    text: “A cidade fortificada” talvez designe uma fortaleza específica de Edom, tradicionalmente identificada por muitos como Sela/Petra; o texto hebraico, porém, não dá o nome da cidade.
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz as duas perguntas retóricas; “Quem” é direto e natural em português.
- source_word: יֹבִלֵנִי
  choice: me levará
  rationale: O hifil de יבל expressa fazer ir, levar ou conduzir alguém. “Me levará” comunica naturalmente o movimento em direção ao destino.
- source_word: עִיר מִבְצָר
  choice: a cidade fortificada
  rationale: A cadeia construta significa literalmente “cidade de fortificação/fortaleza”. O artigo definido é adequado porque o contexto parece apontar para uma cidade estratégica específica, embora ela não seja nomeada.
- source_word: נָחַנִי
  choice: me conduzirá
  rationale: Embora a forma hebraica seja formalmente perfeita, o paralelismo poético com יֹבִלֵנִי favorece aqui o valor futuro/modal. “Conduzirá” preserva a ideia de guiar sem criar uma mudança temporal confusa.
- source_word: עַד אֱדוֹם
  choice: até Edom
  rationale: עַד indica extensão ou limite. “Até Edom” conserva essa nuance e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo das duas perguntas foi preservado, assim como a distinção lexical entre “levar” e “conduzir”. “Até Edom” mantém a força delimitadora de עַד.
