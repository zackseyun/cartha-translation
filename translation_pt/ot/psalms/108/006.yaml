  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: pt
  text: Para que os teus amados sejam libertos[a], salva com a tua mão direita e responde-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam resgatados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Para que
  rationale: Introduz a finalidade ou o resultado e mantém de modo natural a ligação com o contexto.
- source_word: יֵחָלְצוּן
  choice: sejam libertos
  rationale: O nifal de חלץ exprime aqui ser liberto ou resgatado; “sejam libertos” é claro e preserva o sentido passivo.
- source_word: יְדִידֶיךָ
  choice: os teus amados
  rationale: O plural com sufixo de segunda pessoa refere-se àqueles que são amados por Deus; a formulação conserva a nuance afetiva do hebraico.
- source_word: הוֹשִׁיעָה
  choice: salva
  rationale: O imperativo de ישׁע pede diretamente salvação e corresponde à linguagem concisa de oração.
- source_word: יְמִינְךָ
  choice: com a tua mão direita
  rationale: A expressão indica o meio da ação e conserva a imagem bíblica do poder divino.
- source_word: וַעֲנֵנִי
  choice: e responde-me
  rationale: O imperativo traz sufixo de primeira pessoa singular; a tradução mantém “me” sem harmonizá-lo com o plural anterior.
theological_decisions:
- issue: Mudança dos beneficiários no plural para o suplicante no singular
  choice: Manter “os teus amados” e “responde-me”
  alternative: 'Harmonizar para o plural: “responde-nos”'
  rationale: O hebraico passa deliberadamente da comunidade para o orante individual. Preservar essa tensão evita resolver ou uniformizar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção mantém o paralelismo, a imagem da mão direita e a alternância entre plural e singular do hebraico.
