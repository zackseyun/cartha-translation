  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: pt
  text: Despertem, harpa e lira; despertarei a alvorada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «acordarei a alvorada» ou «despertarei a manhã». O hebraico apresenta a imagem poética vívida de alguém que se levanta antes do amanhecer para louvar a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  choice: Despertem
  rationale: Imperativo poético dirigido aos dois instrumentos coordenados. O plural é natural em português, embora o hebraico empregue uma forma singular.
- source_word: הַנֵּבֶל
  choice: harpa
  rationale: Designa um instrumento de cordas; «harpa» é um equivalente moderno, acessível e tradicional.
- source_word: וְכִנּוֹר
  choice: lira
  rationale: Designa provavelmente uma lira. A tradução distinta de «harpa» preserva a referência a dois instrumentos diferentes.
- source_word: אָעִירָה
  choice: despertarei
  rationale: A forma de primeira pessoa expressa a determinação do salmista e repete em português a raiz verbal usada no chamado inicial.
- source_word: שָּׁחַר
  choice: a alvorada
  rationale: Refere-se ao romper do dia. «Alvorada» preserva de modo natural e poético a personificação do amanhecer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A repetição «Despertem/despertarei» conserva o jogo com a mesma raiz hebraica; «alvorada» mantém a imagem personificada sem soar excessivamente coloquial.
