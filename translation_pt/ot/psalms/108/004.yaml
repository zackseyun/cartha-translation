  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: pt
  text: Pois o teu amor leal é grande acima dos céus, e a tua fidelidade chega até as nuvens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a tua verdade chega até as nuvens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do louvor no contexto e mantém, de modo conciso e poético, a relação lógica do hebraico.
- source_word: גָדוֹל
  choice: é grande
  rationale: Preserva a ideia ampla de grandeza ou magnitude sem restringi-la a uma interpretação mais específica.
- source_word: מֵעַל שָׁמַיִם
  choice: acima dos céus
  rationale: Mantém a metáfora espacial de elevação e possível superação expressa pela preposição hebraica.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: Comunica o caráter amoroso, constante e fiel de חֶסֶד em linguagem portuguesa atual, sem explicitar excessivamente a dimensão de aliança.
- source_word: וְעַד
  choice: e ... chega até
  rationale: Explicita naturalmente em português a ideia verbal implícita de extensão no paralelismo poético.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: Conserva a imagem concreta das regiões elevadas do céu presente no substantivo poético hebraico.
- source_word: אֲמִתֶּךָ
  choice: a tua fidelidade
  rationale: No paralelismo com חֶסֶד, exprime adequadamente a confiabilidade e constância de Deus, embora 'verdade' também seja lexicalmente possível.
theological_decisions:
- issue: Tradução dos atributos divinos חֶסֶד e אֱמֶת no paralelismo poético
  choice: amor leal e fidelidade
  alternative: misericórdia e verdade; amor de aliança e verdade
  rationale: A combinação escolhida comunica a constância relacional dos dois termos em português moderno sem impor terminologia confessional. A alternativa 'verdade' permanece indicada em nota para preservar a amplitude lexical de אֱמֶת.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva o paralelismo e a imagem vertical do original. O pronome de segunda pessoa singular mantém o tom direto da oração poética.
