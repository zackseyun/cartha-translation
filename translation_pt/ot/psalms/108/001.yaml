  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: pt
  text: Meu coração está firme, ó Deus; cantarei e farei música, até com a minha glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com todo o meu ser”. A expressão hebraica traduzida literalmente por “minha glória” pode se referir ao íntimo do salmista ou à sua língua como instrumento de louvor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: está firme
  rationale: O termo descreve algo estabelecido, seguro ou resoluto. No contexto, “está firme” comunica tanto estabilidade interior quanto a decisão de louvar.
- source_word: לִבִּי
  choice: meu coração
  rationale: No hebraico bíblico, “coração” pode representar o íntimo, a vontade e os afetos; a expressão portuguesa preserva naturalmente essa amplitude.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; “ó Deus” deixa claro que o salmista se dirige diretamente a Deus.
- source_word: אָשִׁירָה
  choice: cantarei
  rationale: A forma coortativa expressa intenção e determinação pessoal; o futuro em português transmite essa resolução de modo natural.
- source_word: וַאֲזַמְּרָה
  choice: e farei música
  rationale: O verbo זמר no piel pode indicar cantar louvores ou produzir música, possivelmente com acompanhamento instrumental. “Farei música” evita repetição excessiva e mantém o paralelismo poético.
- source_word: אַף
  choice: até
  rationale: Aqui a partícula acrescenta ênfase ou extensão à declaração; “até” introduz de modo conciso a expressão final e preserva seu caráter enfático.
- source_word: כְּבוֹדִי
  choice: minha glória
  rationale: Esta é a correspondência lexical direta e conserva a imagem poética ambígua do hebraico, sem reduzi-la no texto principal a “todo o meu ser”, “minha alma” ou “minha língua”.
theological_decisions:
- issue: Sentido de כְּבוֹדִי na linguagem poética de louvor
  choice: minha glória
  alternative: todo o meu ser; minha alma; minha língua
  rationale: A expressão hebraica é metafórica e admite mais de uma interpretação. O texto principal mantém a formulação poética, enquanto a nota apresenta leituras interpretativas comuns sem impor uma delas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com vocativo poético tradicional sem arcaísmo excessivo. A construção “até com a minha glória” mantém deliberadamente a estranheza e a ambiguidade da imagem hebraica; a nota oferece equivalentes interpretativos.
