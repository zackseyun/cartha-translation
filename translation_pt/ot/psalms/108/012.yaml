  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: pt
  text: Dá-nos ajuda contra o adversário[a], pois vã é a salvação do homem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Dá-nos ajuda na angústia», se צַר for entendido de modo impessoal como «angústia» ou «aflição», e não como «adversário».
    reason: lexical_alternative
  - marker: b
    text: Ou «a salvação da humanidade é vã». Aqui, «homem» tem sentido genérico e se refere à ajuda humana em geral.
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה לָּנוּ
  choice: Dá-nos
  rationale: A forma de súplica pede que Deus conceda algo; «Dá-nos» é direta, natural e preserva a força do imperativo hebraico.
- source_word: עֶזְרַת
  choice: ajuda
  rationale: O substantivo designa auxílio ou socorro. «Ajuda» é claro e corrente, além de manter a expressão concisa.
- source_word: מִצָּר
  choice: contra o adversário
  rationale: צַר pode designar um adversário ou uma situação angustiante. O contexto militar do salmo favorece o sentido pessoal, e a preposição é expressa idiomaticamente por «contra».
- source_word: וְשָׁוְא
  choice: pois vã é
  rationale: שָׁוְא comunica vacuidade, inutilidade ou falta de eficácia. «Vã» preserva a concisão poética, enquanto «pois» explicita a relação causal sugerida pelo contexto.
- source_word: תְּשׁוּעַת
  choice: a salvação
  rationale: O termo pode significar salvação, livramento ou vitória. «Salvação» mantém a correspondência lexical sem restringir indevidamente seu sentido contextual.
- source_word: אָדָם
  choice: do homem
  rationale: Aqui אָדָם tem sentido genérico, referindo-se ao ser humano e à ajuda humana em contraste com a divina. «Do homem» conserva a forma poética tradicional, com esclarecimento inclusivo em nota.
theological_decisions:
- issue: Sentido genérico de אָדָם numa afirmação sobre a incapacidade humana
  choice: do homem
  alternative: da humanidade / humana
  rationale: O hebraico usa אָדָם genericamente, não para um indivíduo masculino específico. A formulação principal preserva a expressão concisa do original, e a nota deixa explícito seu alcance universal sem inserir uma interpretação denominacional.
- issue: Alcance de תְּשׁוּעַת no contexto
  choice: salvação
  alternative: livramento / vitória
  rationale: Embora o contexto possa apontar especialmente para livramento ou vitória militar, o termo hebraico permite a formulação mais ampla «salvação». A tradução não limita nem amplia doutrinariamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem «vã é» conserva a concisão e o tom poético do verso sem soar arcaica; as ambiguidades lexicais relevantes são preservadas em notas.
