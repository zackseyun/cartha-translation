  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עֲלֵֽי פְ֝לֶ֗שֶׁת אֶתְרוֹעָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: pt
  text: Moabe é a minha bacia de lavar[a]; sobre Edom lanço a minha sandália[b]; sobre a Filístia dou um grito de triunfo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu recipiente para lavar”. A imagem hebraica é a de uma vasilha usada para lavagem e expressa a humilhação ou sujeição de Moabe.
    reason: lexical_alternative
  - marker: b
    text: Ou “atiro o meu calçado”. O gesto provavelmente simboliza domínio sobre Edom ou reivindicação de posse.
    reason: lexical_alternative
  - marker: c
    text: Ou “levanto um grito sobre a Filístia” ou “dou um grito de guerra sobre a Filístia”. O verbo hebraico pode indicar um grito jubiloso ou marcial.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: minha bacia de lavar
  rationale: סִיר designa um recipiente, e רַחְצִי especifica seu uso para lavagem. “Bacia de lavar” preserva a imagem concreta e é clara em português atual.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: lanço a minha sandália
  rationale: O hifil de שלך significa lançar ou atirar, e נַעַל designa um calçado. “Sandália” é historicamente apropriado e mantém a imagem física sem explicar o símbolo no corpo do texto.
- source_word: עַל / עֲלֵי
  choice: sobre / sobre
  rationale: A preposição עַל admite nuances espaciais e hostis. “Sobre” funciona naturalmente tanto com o lançamento da sandália sobre Edom quanto com o grito dirigido sobre a Filístia, sem eliminar a ambiguidade poética.
- source_word: אֶתְרוֹעָע
  choice: dou um grito de triunfo
  rationale: A forma verbal de רוע/רועע indica levantar um grito, possivelmente jubiloso ou marcial. A formulação comunica a ação vocal e o contexto vitorioso, sem reduzi-la tecnicamente a um grito de guerra.
- source_word: פְלֶשֶׁת
  choice: Filístia
  rationale: O termo hebraico é o nome da terra ou região, e não uma designação direta do povo; “Filístia” corresponde à forma da fonte.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moabe / Edom
  rationale: São as formas correntes em português bíblico moderno para esses nomes próprios.
theological_decisions:
- issue: Linguagem metafórica de domínio sobre nações inimigas
  choice: Manter as imagens concretas da bacia, da sandália lançada e do grito de triunfo.
  alternative: Parafrasear como servidão, reivindicação de posse e conquista política.
  rationale: O hebraico emprega poesia vívida de humilhação, domínio e vitória. Preservar as metáforas evita transformar uma imagem aberta em interpretação política explícita; as possíveis implicações ficam nas notas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela do hebraico e suas metáforas concretas foram preservadas; as interpretações simbólicas foram reservadas às notas.
