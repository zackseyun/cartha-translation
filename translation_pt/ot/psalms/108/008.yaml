  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: pt
  text: Gileade é meu; Manassés é meu; Efraim é a fortaleza da minha cabeça[a]; Judá é o meu cetro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Efraim é a fortaleza da minha cabeça”, imagem poética de força protetora.
    reason: lexical_alternative
  - marker: b
    text: Ou “Judá é o meu legislador” ou “Judá é o meu bastão de governante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: é meu
  rationale: A preposição ל com sufixo de primeira pessoa singular expressa posse; “é meu” preserva de modo direto e natural a declaração territorial e régia.
- source_word: גִלְעָד
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome tribal e regional em português.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: מָעוֹז
  choice: fortaleza
  rationale: O termo designa lugar ou fonte de força e proteção; “fortaleza” conserva a imagem defensiva e político-militar.
- source_word: רֹאשִׁי
  choice: da minha cabeça
  rationale: Tradução formal da expressão hebraica, mantendo a imagem poética sem substituí-la interpretativamente por “capacete” ou por uma abstração.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: מְחֹקְקִי
  choice: o meu bastão de governante
  rationale: O substantivo pode indicar quem decreta ou o bastão que simboliza sua autoridade. A escolha preserva tanto a concretude da imagem quanto sua relação com o governo, sem reduzi-la ao sentido mais genérico de “cetro”.
theological_decisions:
- issue: Imagem régia de Judá em מְחֹקְקִי
  choice: Judá é o meu bastão de governante
  alternative: Judá é o meu legislador
  rationale: O contexto apresenta as tribos e regiões como possessões ou instrumentos do governo divino. “Bastão de governante” conserva a possível metonímia de autoridade régia; como o hebraico também pode designar aquele que decreta ou legisla, essa leitura é mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas tradicionais dos nomes próprios. A sintaxe paralela e as imagens concretas do hebraico foram preservadas; notas registram ambiguidades lexicais genuínas.
