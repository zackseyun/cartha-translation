base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/000.yaml
  text: A song, a psalm of David[a].
translation:
  language: pt
  text: Cântico, salmo de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; o hebraico pode indicar autoria, dedicação, pertencimento ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: cântico
  rationale: O substantivo designa de modo amplo uma canção; em um título de salmo, “cântico” é natural, digno e preserva sua distinção em relação a מִזְמוֹר sem especificar indevidamente que seja um cântico de louvor.
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Nos títulos do Saltério, “salmo” é a equivalência tradicional e precisa para uma composição lírica ligada à música.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ pode indicar autoria, dedicação, pertencimento ou associação. “De Davi” mantém em português uma amplitude semelhante, sem impor uma interpretação mais específica.
theological_decisions:
- issue: Sentido da referência davídica no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não exige que o título seja entendido exclusivamente como declaração de autoria ou de dedicação; a formulação escolhida preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene. “Cântico” harmoniza com o registro dos títulos dos Salmos e evita a coloquialidade relativa de “canção”. A pontuação apresenta שִׁיר e מִזְמוֹר como dois rótulos de gênero coordenados.
