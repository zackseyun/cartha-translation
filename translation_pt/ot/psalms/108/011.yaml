  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: pt
  text: Não nos rejeitaste, ó Deus, e não sais com os nossos exércitos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: Não foste tu... que
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. A construção portuguesa preserva tanto a força interrogativa quanto a ênfase contextual.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa o Deus de Israel no singular, como mostram as formas verbais singulares.
- source_word: זְנַחְתָּנוּ
  choice: nos rejeitaste
  rationale: O verbo זנח expressa rejeitar ou repudiar. «Nos rejeitaste» é claro e atual, além de conservar a força da queixa sem atenuá-la.
- source_word: וְלֹא
  choice: e que não
  rationale: Preserva a coordenação e a negação hebraicas, ligando naturalmente a segunda oração à pergunta retórica iniciada na primeira.
- source_word: תֵצֵא
  choice: sais
  rationale: O imperfeito pode expressar ação presente ou habitual neste contexto de lamento. «Sais» mantém o sentido básico do verbo sem acrescentar explicitamente a ideia de marchar.
- source_word: בְּצִבְאֹתֵינוּ
  choice: com os nossos exércitos
  rationale: 'צָבָא designa forças militares neste contexto, e a preposição ב indica aqui acompanhamento ou apoio: Deus saindo com os exércitos de seu povo.'
theological_decisions:
- issue: A linguagem de rejeição divina no lamento
  choice: Conservar a declaração direta de que Deus rejeitou o povo e não sai com seus exércitos.
  alternative: Suavizar para «nos deixaste» ou «não tens estado conosco».
  rationale: O hebraico emprega a forte linguagem de זנח. A tradução mantém a tensão teológica própria do lamento, sem atenuar a acusação nem explicá-la além do texto.
- issue: Extensão da pergunta retórica
  choice: Tratar as duas orações coordenadas como uma única pergunta retórica.
  alternative: Encerrar a pergunta após «nos rejeitaste» e apresentar a segunda oração como declaração.
  rationale: הֲלֹא abre a construção, e a segunda oração coordenada por וְלֹא participa naturalmente da mesma força interrogativa. A formulação portuguesa torna esse alcance claro sem repetir uma partícula interrogativa inexistente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito «rejeitaste» reflete o perfeito hebraico; «sais» conserva o aspecto presente ou habitual do imperfeito. A colocação de «ó Deus» marca com naturalidade o vocativo.
