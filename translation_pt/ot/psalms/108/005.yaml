  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים וְ/עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: pt
  text: Sê exaltado acima dos céus, ó Deus, e sobre toda a terra esteja a tua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ergue-te acima dos céus, ó Deus, e sobre toda a terra, a tua glória”. No segundo membro, o hebraico não apresenta verbo; “esteja” é inferido do paralelismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Sê exaltado
  rationale: O imperativo de רום, dirigido a Deus, expressa uma súplica ou aclamação por sua exaltação; esta formulação conserva o tom elevado e a possível dimensão de honra, sem eliminar por completo a imagem espacial.
- source_word: עַל שָׁמַ֣יִם
  choice: acima dos céus
  rationale: No contexto de exaltação, עַל indica elevação acima dos céus; o plural 'céus' corresponde ao hebraico e é natural no registro poético bíblico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; 'ó' marca de modo claro e digno a invocação direta.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: e sobre toda a terra
  rationale: A expressão forma o segundo membro do paralelismo cósmico, em contraste complementar com 'os céus'; aqui הָאָרֶץ significa o mundo terrestre, não uma região específica.
- source_word: כְּבוֹדֶךָ
  choice: a tua glória
  rationale: Em contexto de louvor, כָּבוֹד denota a glória, majestade e honra manifestas de Deus; 'glória' é a equivalência portuguesa mais direta e reconhecível.
theological_decisions:
- issue: Verbo subentendido no segundo membro poético
  choice: e sobre toda a terra esteja a tua glória
  alternative: e sobre toda a terra, a tua glória
  rationale: O hebraico não traz verbo no segundo membro. 'Esteja' explicita a leitura volitiva sugerida pelo paralelismo com o imperativo inicial, mas a nota preserva a construção nominal e sua ambiguidade formal.
- issue: Sentido de רום aplicado a Deus
  choice: Sê exaltado
  alternative: Ergue-te
  rationale: A forma pode evocar elevação espacial ou exaltação em honra. 'Sê exaltado' se ajusta melhor à linguagem doxológica, enquanto a nota registra a alternativa mais espacial.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. Conserva o vocativo tradicional 'ó Deus' e o paralelismo entre céus e terra; explicita com moderação o verbo elíptico, registrando em nota tanto a elipse quanto a alternativa lexical.
