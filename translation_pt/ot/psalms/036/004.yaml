  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: pt
  text: Em sua cama, planeja a maldade[a]; firma-se num caminho que não é bom; não rejeita o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em sua cama, trama a iniquidade [...] não abomina o mal”.'
    reason: Alternativas lexicais para אָוֶן, יַחְשֹׁב e יִמְאָס, que podem respectivamente ser vertidas por “iniquidade”, “trama” e “abomina”.
lexical_decisions:
- source_word: אָוֶן
  choice: maldade
  rationale: Neste contexto, o termo indica perversidade ou iniquidade deliberada. “Maldade” é natural em português atual e mantém o sentido ético.
- source_word: יַחְשֹׁב
  choice: planeja
  rationale: O verbo pode significar pensar, calcular ou planejar. Com “maldade” como objeto e a cama como cenário, comunica uma intenção deliberadamente concebida.
- source_word: עַל מִשְׁכָּבוֹ
  choice: na cama
  rationale: Reproduz de modo natural a expressão locativa e preserva a imagem de alguém tramando enquanto está deitado.
- source_word: יִתְיַצֵּב
  choice: firma-se
  rationale: O hitpael exprime posicionar-se ou tomar posição. “Firma-se” preserva a nuance reflexiva e a adesão deliberada ao caminho descrito.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: num caminho que não é bom
  rationale: Mantém a metáfora hebraica do caminho como conduta e preserva a formulação negativa do original, sem convertê-la simplesmente em “caminho mau”.
- source_word: רָע
  choice: o mal
  rationale: O termo designa aqui o mal em sentido moral; o artigo torna substantivado e natural em português aquilo que o hebraico expressa diretamente.
- source_word: לֹא יִמְאָס
  choice: não rejeita
  rationale: O verbo pode significar rejeitar, desprezar ou abominar. “Não rejeita” expressa com clareza a recusa de repudiar o mal sem intensificar indevidamente o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “Na cama” soa natural e mantém o cenário enfático do hebraico. A repetição de “mal/maldade” reflete termos hebraicos distintos sem recorrer a vocabulário arcaico.
