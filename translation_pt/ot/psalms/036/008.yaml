  text: יִ֭רְוְיֻ/ן מִ/דֶּ֣שֶׁן בֵּיתֶ֑/ךָ וְ/נַ֖חַל עֲדָנֶ֣י/ךָ תַשְׁקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: pt
  text: Eles se saciam da fartura da tua casa[a], e tu lhes dás de beber do rio das tuas delícias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles bebem até se saciarem da abundância da tua casa”.'
    reason: lexical_alternative
  - marker: b
    text: “Delícias” também pode ser traduzido por “prazeres”; o termo hebraico pode ainda evocar o Éden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: Eles se saciam
  rationale: O Qal imperfeito de רוה expressa ficar plenamente saciado ou satisfeito. “Se saciam” é natural em português e, junto da imagem de beber na segunda linha, preserva a ideia de abundância.
- source_word: מִדֶּשֶׁן
  choice: da fartura
  rationale: דֶּשֶׁן significa literalmente gordura e, em sentido figurado, riqueza ou abundância. “Fartura” comunica essa provisão generosa sem produzir a estranheza de uma tradução literal.
- source_word: בֵּיתֶךָ
  choice: da tua casa
  rationale: Mantém a imagem hebraica de “casa” sem restringi-la ao templo, à família ou à habitação celestial.
- source_word: וְנַחַל
  choice: do rio
  rationale: נַחַל pode designar riacho, corrente ou rio. “Rio” condiz com a imagem poética de provisão abundante e vivificante.
- source_word: עֲדָנֶיךָ
  choice: das tuas delícias
  rationale: O termo denota delícias, prazeres ou deleites. “Delícias” preserva tanto a força poética quanto a possível ressonância lexical com Éden, sem torná-la explícita no texto.
- source_word: תַשְׁקֵם
  choice: tu lhes dás de beber
  rationale: O Hifil de שקה indica fazer alguém beber ou dar-lhe de beber. Esta formulação preserva a ação divina e soa natural em português.
theological_decisions:
- issue: Imagem da “casa” de Deus
  choice: Manter “tua casa” sem especificar o referente
  alternative: “teu templo”, “tua família” ou “tua morada”
  rationale: O hebraico não exige que a imagem seja identificada exclusivamente com o templo, a comunidade ou a habitação celestial; a tradução conserva sua abertura poética e teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo poético e as imagens concretas de casa, fartura, bebida e rio foram preservados; evitou-se especificar além do hebraico.
