source:
  edition: WLC
  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: pt
  text: Como é precioso o teu amor fiel[a], ó Deus! Os seres humanos se refugiam à sombra das tuas asas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amor fiel” traduz o hebraico hésed, termo que também pode incluir amor leal, misericórdia, bondade e fidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: Como é precioso
  rationale: A construção é exclamativa, não interrogativa, e expressa admiração pelo grande valor do amor de Deus.
- source_word: חַסְדְּךָ
  choice: o teu amor fiel
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e fidelidade relacional; “amor fiel” é claro e preserva essa amplitude melhor que “misericórdia” isoladamente.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; “ó” conserva de modo natural o tom poético da invocação.
- source_word: וּבְנֵי אָדָם
  choice: Os seres humanos
  rationale: A expressão idiomática hebraica, literalmente “filhos de Adão/do homem”, designa coletivamente os seres humanos; a tradução comunica sua abrangência sem sugerir somente pessoas do sexo masculino.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: à sombra das tuas asas
  rationale: Mantém intacta a metáfora poética de proximidade, abrigo e proteção sob asas.
- source_word: יֶחֱסָיוּן
  choice: se refugiam
  rationale: O verbo חסה descreve buscar ou tomar refúgio; a forma pronominal é natural em português e não acrescenta uma ideia de resultado além do hebraico.
theological_decisions:
- issue: Amplitude semântica de חֶסֶד
  choice: amor fiel
  alternative: amor leal; misericórdia; bondade
  rationale: “Amor fiel” preserva tanto a dimensão afetiva quanto a constância e lealdade do termo, sem restringi-lo exclusivamente a uma formulação pactual.
- issue: Sentido coletivo de בְּנֵי אָדָם
  choice: os seres humanos
  alternative: os filhos do homem; os filhos de Adão
  rationale: A expressão abrange a humanidade em geral. A tradução escolhida torna explícito esse referente coletivo, enquanto a nota conserva a forma concreta do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo e as metáforas poéticas foram preservados; omitiu-se o conectivo hebraico antes da segunda oração por não ser necessário em português natural.
