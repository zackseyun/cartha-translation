  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: pt
  text: Estende[a] o teu amor leal aos que te conhecem e a tua justiça[b] aos íntegros de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Continua a mostrar”; literalmente, “Puxa” ou “prolonga”.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Estende
  rationale: O imperativo significa literalmente “puxa”, “prolonga” ou “estende”. Com “amor leal” como objeto abstrato, “estende” expressa naturalmente o pedido para que Deus faça seu amor alcançar continuamente os fiéis.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: חֶסֶד designa amor fiel, constante e comprometido. “Amor leal” preserva essa dimensão relacional sem limitar o sentido a compaixão ou introduzir terminologia doutrinária específica.
- source_word: לְיֹדְעֶיךָ
  choice: aos que te conhecem
  rationale: A forma participial refere-se aos que conhecem Deus. A tradução mantém tanto o sentido direto quanto a possível profundidade relacional desse conhecimento.
- source_word: וְצִדְקָתְךָ
  choice: e a tua justiça
  rationale: צְדָקָה abrange retidão, justiça e fidelidade ao que é correto. “Justiça” é clara em português e preserva a qualidade moral da ação divina, enquanto a nota registra a alternativa “retidão”.
- source_word: לְיִשְׁרֵי לֵב
  choice: aos íntegros de coração
  rationale: A expressão hebraica descreve pessoas interiormente retas ou íntegras. “Íntegros de coração” comunica o idioma com naturalidade e mantém a ênfase na integridade interior.
theological_decisions:
- issue: Atributos divinos em paralelismo poético
  choice: Traduzir חֶסֶד por “amor leal” e צְדָקָה por “justiça”, mantendo-os como qualidades divinas paralelas.
  alternative: Traduzir חֶסֶד por “misericórdia” e צְדָקָה por “retidão”.
  rationale: A formulação conserva o pedido por amor fiel e ação moralmente justa sem restringir os termos a categorias forenses ou sistemático-teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a oração dirigida diretamente a Deus. A ordem e o paralelismo do hebraico foram preservados sem produzir uma construção artificial.
