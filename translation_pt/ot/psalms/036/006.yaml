  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: pt
  text: A tua justiça é como os montes de Deus[a]; os teus juízos são um grande abismo. Ó Yahweh, tu salvas o ser humano e os animais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é “os montes de Deus” e também pode significar “montes imponentes” ou “os montes mais altos”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “homem e animal”; isto é, a humanidade e os animais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: a tua justiça
  rationale: O substantivo abrange retidão e justiça. “Justiça” é natural em português e conserva aqui tanto a dimensão moral quanto a judicial, sem se confundir com os “juízos” do membro paralelo.
- source_word: כְּהַרְרֵי אֵל
  choice: como os montes de Deus
  rationale: Mantém de modo transparente a construção hebraica e sua imagem poética, enquanto a nota registra a possível função superlativa de אֵל.
- source_word: מִשְׁפָּטֶךָ
  choice: os teus juízos
  rationale: Preserva a referência às decisões ou ações judiciais de Deus e mantém a distinção lexical em relação a צִדְקָה, “justiça”.
- source_word: תְּהוֹם רַבָּה
  choice: um grande abismo
  rationale: Expressa profundidade imensurável e conserva a imagem poética das águas profundas sem restringi-la por interpretação adicional.
- source_word: אָדָם וּבְהֵמָה
  choice: o ser humano e os animais
  rationale: Comunica naturalmente em português o contraste abrangente entre humanidade e mundo animal. A nota preserva a forma singular mais literal do hebraico.
- source_word: תוֹשִׁיעַ
  choice: tu salvas
  rationale: O verbo pode significar salvar, livrar ou preservar. “Salvas” mantém sua amplitude e ressonância teológica, incluindo neste contexto o cuidado providencial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título; a partícula vocativa portuguesa “Ó” reflete a função do nome no fim da oração hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Ó Yahweh
  alternative: Ó SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal do Deus de Israel, e “Ó” torna explícito o vocativo indicado pela estrutura poética.
- issue: Sentido genérico de אָדָם
  choice: o ser humano
  alternative: o homem
  rationale: Neste paralelismo com os animais, אָדָם designa representativamente a humanidade, não apenas indivíduos do sexo masculino. “O ser humano” preserva o singular genérico sem criar ambiguidade de gênero.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção poética concisa. Mantém-se a imagem formal “montes de Deus”, explicada em nota, e empregam-se “ser humano” e “animais” para clareza moderna.
