  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: pt
  text: Pois contigo está a fonte da vida[a]; na tua luz vemos a luz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nascente da vida» ou «origem da vida».
    reason: lexical_alternative
  - marker: b
    text: Ou «pela tua luz vemos a luz».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o louvor e a oração anteriores, preservando de modo natural a força conectiva do hebraico.
- source_word: עִמְּךָ
  choice: contigo
  rationale: Reproduz diretamente a ideia relacional de que a fonte da vida está com Deus, sem explicá-la como mera localização ou experiência.
- source_word: מְקוֹר
  choice: fonte
  rationale: Mantém a imagem concreta de uma nascente ou manancial e, em português, também comunica naturalmente a ideia de origem.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja morfologicamente plural, o termo funciona aqui como substantivo abstrato e corresponde idiomaticamente ao singular em português.
- source_word: בְּאוֹרְךָ
  choice: na tua luz
  rationale: Preserva a imagem e a ambiguidade da preposição hebraica, sem restringi-la ao sentido exclusivamente instrumental de «por meio da tua luz».
- source_word: נִרְאֶה
  choice: vemos
  rationale: O imperfeito hebraico exprime neste contexto poético uma verdade geral; «vemos» é direto e natural.
- source_word: אוֹר
  choice: luz
  rationale: A repetição de «luz» conserva o jogo verbal e a ênfase poética do hebraico.
theological_decisions:
- issue: Força metafórica das imagens divinas de vida e luz
  choice: Manter «fonte da vida» e «na tua luz vemos a luz» sem expansão interpretativa.
  alternative: Parafrasear como «tu és a origem de toda a vida» ou «por tua verdade compreendemos».
  rationale: As metáforas apresentam Deus como aquele com quem se encontra a vida e em cuja luz há visão. Preservá-las evita reduzir a riqueza e a tensão teológica do verso a uma explicação doutrinária mais estreita.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. «Tua» acompanha o tratamento bíblico direto e mantém concisão lírica; a ordem «contigo está» conserva a ênfase do hebraico sem soar arcaica.
