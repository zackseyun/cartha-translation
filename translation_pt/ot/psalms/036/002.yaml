  text: כִּֽי הֶחֱלִ֣יק אֵלָ֣י/ו בְּ/עֵינָ֑י/ו לִ/מְצֹ֖א עֲוֺנ֣/וֹ לִ/שְׂנֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: pt
  text: Pois ele se lisonjeia aos seus próprios olhos, a ponto de não descobrir sua iniquidade nem odiá-la.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois ele torna as coisas lisas para si aos seus olhos, para encontrar sua iniquidade, para odiar”. O hebraico é difícil; o sentido parece ser que a autolisonja o impede de reconhecer e rejeitar seu pecado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva o encadeamento argumentativo do salmo.
- source_word: הֶחֱלִיק אֵלָיו
  choice: ele se lisonjeia
  rationale: O sentido básico de חלק no hifil é “tornar liso”; neste contexto, com a ação voltada para o próprio indivíduo, a expressão comunica lisonja ou autoengano.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Preserva o idiomatismo hebraico relativo à avaliação que a pessoa faz de si mesma.
- source_word: לִמְצֹא
  choice: descobrir
  rationale: Expressa de modo natural o reconhecimento de uma falta que o autoengano impede a pessoa de perceber.
- source_word: עֲוֺנוֹ
  choice: sua iniquidade
  rationale: Mantém o peso moral de עָוֹן, que pode envolver tanto perversidade quanto culpa.
- source_word: לִשְׂנֹא
  choice: nem odiá-la
  rationale: O pronome retoma “iniquidade”; “nem” coordena os dois resultados impedidos pela autolisonja na leitura adotada.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: a ponto de não descobrir sua iniquidade nem odiá-la
  rationale: A sintaxe hebraica é difícil. Esta formulação transmite com clareza a leitura contextual de que a autolisonja impede reconhecer e rejeitar o próprio pecado, sem esconder a dificuldade por trás do texto.
theological_decisions:
- issue: Sentido moral e psicológico do versículo
  choice: A autolisonja impede o perverso de reconhecer e odiar a própria iniquidade.
  alternative: Ele se lisonjeia até que sua iniquidade seja descoberta como odiosa; ou torna as coisas suaves para si ao encontrar sua iniquidade e odiá-la.
  rationale: O contexto imediato favorece a ideia de autoengano e corrupção interior, mas a construção hebraica comprimida permite outras análises; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico acessível. “Iniquidade” preserva o peso moral do hebraico; a nota mantém a ambiguidade sintática genuína.
