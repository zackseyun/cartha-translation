  text: אַל תְּ֭בוֹאֵ/נִי רֶ֣גֶל גַּאֲוָ֑ה וְ/יַד רְ֝שָׁעִ֗ים אַל תְּנִדֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/011.yaml
  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: pt
  text: Não permitas que o pé do orgulho venha contra mim[a], nem que a mão dos perversos me expulse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “venha sobre mim”. A expressão hebraica diz literalmente: “venha a mim o pé do orgulho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me faça vaguear” ou “me ponha em fuga”. O verbo pode indicar que alguém é forçado a sair do seu lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: venha contra mim
  rationale: O verbo בוא significa literalmente “vir/chegar”, mas, tendo como sujeito o “pé do orgulho” e em paralelo com a ação hostil da mão dos perversos, expressa aqui uma aproximação ameaçadora. “Venha contra mim” conserva o movimento da imagem e explicita naturalmente o caráter adverso.
- source_word: רֶגֶל גַּאֲוָה
  choice: o pé do orgulho
  rationale: A tradução mantém a construção hebraica concreta e poética, sem substituir o substantivo abstrato por “os orgulhosos”. Em português, “orgulho” preserva de modo direto a personificação presente no verso.
- source_word: יַד רְשָׁעִים
  choice: a mão dos perversos
  rationale: “Mão” conserva a metáfora hebraica de poder ou ação, enquanto “dos perversos” representa naturalmente o substantivo adjetival masculino plural sem acrescentar “homens”.
- source_word: תְּנִדֵנִי
  choice: me expulse
  rationale: A forma causativa comunica ser removido à força do próprio lugar. “Me expulse” é clara e concisa em português, preservando a coerção sem decidir se o resultado específico é vaguear ou fugir.
- source_word: אַל
  choice: Não permitas... nem
  rationale: A partícula negativa com formas volitivas exprime uma súplica. “Não permitas... nem” produz em português moderno um pedido dirigido a Deus, com registro poético digno e natural.
