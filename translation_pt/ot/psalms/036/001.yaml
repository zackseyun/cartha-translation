  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: pt
  text: 'No íntimo do meu coração, a transgressão fala ao perverso: “Não há temor de Deus diante dos seus olhos”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no íntimo do meu coração”. Algumas versões antigas e traduções modernas trazem “no íntimo do coração dele” ou parafraseiam: “Tenho no coração uma mensagem a respeito do perverso”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: fala
  rationale: O substantivo introduz uma declaração solene ou oracular. A formulação verbal “fala” é natural em português e preserva a personificação da transgressão.
- source_word: פֶּשַׁע
  choice: transgressão
  rationale: Expressa rebeldia ou violação deliberada. “Transgressão” conserva o peso moral e religioso sem restringir o sentido a um crime jurídico.
- source_word: לָרָשָׁע
  choice: ao perverso
  rationale: A preposição לְ é entendida como marcando o destinatário da fala. “Perverso” representa o singular substantivado e descreve quem age de modo moralmente mau.
- source_word: בְּקֶרֶב לִבִּי
  choice: no íntimo do meu coração
  rationale: Mantém o sufixo de primeira pessoa do Texto Massorético, embora a construção seja difícil. A anteposição do sintagma evita sugerir que o perverso esteja dentro do coração do salmista.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: não há temor de Deus
  rationale: “Temor de Deus” pode incluir reverência e reconhecimento da autoridade divina; “pavor” enfatizaria excessivamente o terror.
- source_word: לְנֶגֶד עֵינָיו
  choice: diante dos seus olhos
  rationale: Preserva a imagem hebraica daquilo que alguém mantém diante da vista e, por extensão, leva em consideração.
theological_decisions:
- issue: A perspectiva na difícil leitura לִבִּי (“meu coração”)
  choice: 'Conservar a primeira pessoa do Texto Massorético: “no íntimo do meu coração”'
  alternative: Ler “no íntimo do coração dele” ou parafrasear “tenho no coração uma mensagem a respeito do perverso”
  rationale: O texto hebraico vocalizado traz inequivocamente o sufixo de primeira pessoa. A tradução mantém essa tensão textual sem emendar o texto, mas reorganiza a oração para indicar que o sintagma se refere ao lugar da percepção do salmista.
- issue: Identificação do sujeito implícito em “seus olhos”
  choice: O perverso permanece como referente
  alternative: Entender os olhos como os do salmista
  rationale: O sufixo masculino singular em עֵינָיו retoma naturalmente לָרָשָׁע, “o perverso”, e descreve sua falta de temor de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial foi ajustada para esclarecer a relação sintática sem eliminar a dificuldade do hebraico. As aspas apresentam a segunda oração como o conteúdo da fala personificada da transgressão.
