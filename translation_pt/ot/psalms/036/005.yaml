  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: pt
  text: Ó Yahweh, o teu amor leal está nos céus[a]; a tua fidelidade chega até as nuvens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o teu amor leal chega até os céus»; o hebraico também pode indicar extensão, e não apenas localização.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama e usa «Ó» para exprimir de modo natural o chamado vocativo no início da fala direta.
- source_word: בְּהַשָּׁמַיִם
  choice: está nos céus
  rationale: A preposição בְּ é entendida primeiramente em sentido locativo. «Céus» conserva o plural hebraico, e «está» explicita a cópula subentendida.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: חֶסֶד designa aqui o amor firme e confiável de Deus. «Amor leal» é claro em português atual e preserva sua dimensão relacional sem acrescentar explicitamente «aliança».
- source_word: אֱמוּנָתְךָ
  choice: a tua fidelidade
  rationale: No paralelismo com חֶסֶד, אֱמוּנָה expressa confiabilidade e constância; «fidelidade» comunica naturalmente esse sentido.
- source_word: עַד
  choice: chega até
  rationale: A expressão indica extensão até um limite; «chega até» reproduz essa ideia de maneira idiomática e mantém o paralelismo poético.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: O termo poético pode referir-se às nuvens ou às alturas celestes. «Nuvens» preserva a imagem concreta e corresponde bem ao paralelismo com «céus».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio sem o substituir por um título.
- issue: Sentido de בְּהַשָּׁמַיִם
  choice: 'localização: «está nos céus»'
  alternative: 'extensão: «chega até os céus»'
  rationale: O valor locativo de בְּ é a leitura mais direta, mas o paralelismo com עַד no segundo membro permite entender a expressão como extensão. A ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantêm-se o paralelismo poético, o plural «céus» e a ambiguidade da primeira expressão por meio de nota.
