  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: pt
  text: As palavras da sua boca são maldade e engano; ele deixou de agir com sabedoria[a] e de fazer o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou de ser sábio ao fazer o bem”. Os dois infinitivos hebraicos também podem ser entendidos em estreita ligação entre si.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: As palavras da sua boca
  rationale: Preserva a imagem concreta e o plural do hebraico, em formulação natural e digna em português.
- source_word: אָוֶן
  choice: maldade
  rationale: No paralelismo com מִרְמָה e como caracterização das palavras, o termo tem sentido moral; “maldade” comunica isso com clareza sem restringi-lo a uma categoria jurídica.
- source_word: וּמִרְמָה
  choice: e engano
  rationale: “Engano” expressa naturalmente a falsidade ou fraude indicada por מִרְמָה no contexto da fala.
- source_word: חָדַל
  choice: deixou de
  rationale: Reproduz o sentido de cessação do perfeito qal e rege naturalmente os dois infinitivos seguintes.
- source_word: לְהַשְׂכִּיל
  choice: agir com sabedoria
  rationale: O hifil de שכל pode indicar compreensão ou conduta prudente; aqui, sua proximidade com “fazer o bem” favorece o sentido prático.
- source_word: לְהֵיטִיב
  choice: fazer o bem
  rationale: Expressa de modo direto o sentido moral e ativo do hifil de יטב.
theological_decisions:
- issue: Relação sintática entre לְהַשְׂכִּיל e לְהֵיטִיב
  choice: Tratar os dois infinitivos como complementos paralelos de “deixou de”
  alternative: 'Entender o segundo como ligado ao primeiro: “deixou de ser sábio ao fazer o bem”'
  rationale: A construção hebraica admite as duas relações. O texto principal conserva distintamente as ideias de conduta sábia e prática do bem, enquanto a nota registra a leitura mais estreitamente integrada sem resolver de modo indevido a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo conciso e o tom moral do salmo, evitando vocabulário excessivamente arcaico.
