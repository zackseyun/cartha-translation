  yaml_path: translation/ot/psalms/036/012.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: pt
  text: Ali caíram os que praticam a maldade[a]; foram derrubados e não puderam se levantar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os malfeitores”.
