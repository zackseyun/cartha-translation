lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: O advérbio é locativo e aponta para a cena da queda dos perversos; “ali” é natural em português neste contexto.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O qal perfeito apresenta a queda como fato consumado; o pretérito perfeito comunica isso com clareza e naturalidade.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a maldade
  rationale: A expressão preserva a ideia hebraica de pessoas ativamente dedicadas ao mal, com maior naturalidade do que o literalismo “os trabalhadores da maldade”.
- source_word: אָוֶן
  choice: maldade
  rationale: Neste contexto, o termo caracteriza moralmente as ações dessas pessoas, embora também possa ter nuances de iniquidade ou desgraça.
- source_word: דֹּחוּ
  choice: foram derrubados
  rationale: Expressa a forma passiva e a ideia de uma queda provocada à força, adequada ao paralelismo com “caíram”.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: e não conseguem se levantar
  rationale: Traduz de maneira natural a incapacidade de voltar a ficar de pé após a derrota, preservando a imagem de uma queda irreversível.
