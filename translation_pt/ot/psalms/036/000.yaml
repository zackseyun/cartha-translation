  text: לַ/מְנַצֵּ֬חַ לְ/עֶֽבֶד יְהוָ֬ה לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: pt
  text: Ao regente[a]. De Davi[b], servo de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao diretor de música”. O termo hebraico designa o responsável pela música na execução litúrgica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Do servo de Yahweh, Davi”. A preposição hebraica pode indicar atribuição de modo amplo; “De Davi” não determina, por si só, se o título indica autoria, dedicação ou associação.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: A fórmula dos títulos dos Salmos se dirige ao responsável pela execução musical. “Regente” é conciso e natural em português, sem limitar necessariamente a função a um coro.
- source_word: לְעֶבֶד
  choice: servo
  rationale: Neste título, עֶבֶד funciona como designação honrosa da relação de Davi com Deus; “servo” preserva esse registro melhor que “escravo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Nos títulos dos Salmos, a preposição לְ pode indicar autoria, pertencimento, dedicação ou associação. “De Davi” mantém essa atribuição ampla sem decidir exclusivamente por autoria.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, e “Yahweh” o preserva como nome próprio sem substituí-lo por um título.
- issue: Sentido de עֶבֶד no título
  choice: servo
  alternative: escravo
  rationale: O contexto apresenta עֶבֶד como título honorífico e relacional, não como ênfase na condição jurídica de escravidão.
- issue: Natureza da atribuição לְדָוִד
  choice: De Davi
  alternative: Por Davi; para Davi
  rationale: A formulação escolhida conserva a amplitude semântica da preposição hebraica e não resolve indevidamente se se trata especificamente de autoria, dedicação ou associação.
translation_notes:
  register: Título breve, digno e natural em português contemporâneo. A ordem “De Davi, servo de Yahweh” identifica claramente Davi como o servo e evita uma construção pesada, enquanto as notas preservam as alternativas sintáticas e a ambiguidade da atribuição hebraica.
