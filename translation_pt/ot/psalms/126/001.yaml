source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: pt
  text: Cântico das Subidas. Quando Yahweh restaurou a sorte de Sião[a], éramos como os que sonham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trouxe de volta os cativos de Sião” ou “restaurou o cativeiro de Sião”. A expressão hebraica pode referir-se especificamente ao retorno do exílio ou, de modo mais amplo, à restauração da sorte de Sião.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Preserva o sentido literal do título tradicional da coleção, sem restringi-lo interpretativamente a peregrinações.
- source_word: בְּשׁוּב
  choice: Quando ... restaurou
  rationale: A preposição בְּ com o infinitivo construto introduz aqui uma oração temporal; neste contexto, שׁוב integra uma expressão de restauração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שִׁיבַת צִיּוֹן
  choice: a sorte de Sião
  rationale: A expressão hebraica pode indicar de modo amplo uma reversão da situação ou, mais especificamente, a volta do cativeiro. A formulação principal é idiomática em português e a alternativa ligada ao exílio é preservada em nota.
- source_word: הָיִינוּ
  choice: éramos
  rationale: Traduz naturalmente o perfeito qal de היה como estado passado no contexto.
- source_word: כְּחֹלְמִים
  choice: como os que sonham
  rationale: Mantém a comparação e o valor participial plural, com linguagem clara e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de שִׁיבַת צִיּוֹן
  choice: restaurou a sorte de Sião
  alternative: trouxe de volta os cativos de Sião / restaurou o cativeiro de Sião
  rationale: A expressão admite tanto uma restauração ampla da situação de Sião quanto uma referência específica ao retorno do exílio. O texto principal mantém o sentido idiomático abrangente, e a nota conserva a leitura ligada ao cativeiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cântico” conserva o registro poético do sobrescrito; “Subidas” evita impor uma identificação específica dessas subidas. A sintaxe permanece próxima do hebraico sem soar artificial.
