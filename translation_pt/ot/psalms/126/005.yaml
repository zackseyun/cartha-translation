lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Os que semeiam
  rationale: O particípio com artigo é substantivado e designa genericamente as pessoas que semeiam; esta formulação é natural e preserva o plural.
- source_word: בְּדִמְעָה
  choice: em lágrimas
  rationale: A preposição בְּ com o substantivo singular expressa a circunstância ou o modo da ação; «em lágrimas» é idiomático e mantém a imagem do pranto.
- source_word: בְּרִנָּה
  choice: com gritos de alegria
  rationale: רִנָּה indica um clamor jubiloso e pode abranger canto exultante; a escolha preserva tanto a expressão audível quanto a alegria intensa.
- source_word: יִקְצֹרוּ
  choice: colherão
  rationale: O imperfeito expressa aqui o resultado futuro. «Colherão» mantém de modo conciso o paralelismo agrícola com «semeiam».
