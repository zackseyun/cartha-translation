  source_fidelity: 'A tradução preserva adequadamente o paralelismo do hebraico: a saída/ida em choro, levando a semente para a semeadura, contrasta com a volta certa e jubilosa, trazendo os feixes. «Quem sai, vai chorando» comunica de modo aceitável a intensificação/progressão de הָלוֹךְ יֵלֵךְ, e «certamente voltará» representa bem a ênfase de בֹּא יָבוֹא sem especificar indevidamente um destino. A dificuldade de מֶשֶׁךְ הַזָּרַע é mantida na tradução principal e devidamente assinalada em nota.'
