  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: pt
  text: Quem sai, vai chorando[a], levando a semente para semear; certamente voltará com gritos de alegria[b], trazendo os seus feixes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem segue o seu caminho chorando, levando a provisão de sementes”. A expressão hebraica traduzida como “a semente para semear” é difícil; alguns a entendem de modo mais concreto como um saco de sementes ou uma provisão de sementes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com cânticos” ou “com júbilo”. O termo hebraico indica um grito ou uma expressão vibrante de alegria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: Quem sai, vai
  rationale: A construção com infinitivo absoluto e verbo finito intensifica ou prolonga a ação. A formulação portuguesa preserva a repetição expressiva de movimento sem soar excessivamente literal e prepara o contraste com a volta.
- source_word: וּבָכֹה
  choice: chorando
  rationale: O infinitivo absoluto ligado por conjunção descreve a maneira como a pessoa vai; o gerúndio é natural e claro em português.
- source_word: נֹשֵׂא
  choice: levando / trazendo
  rationale: O particípio indica uma ação concomitante. Verbos distintos e naturais em português acompanham respectivamente a saída com a semente e a volta com os feixes.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: a semente para semear
  rationale: A expressão hebraica é difícil. No contexto agrícola, esta tradução comunica a semente levada para a semeadura sem definir de modo indevido מֶשֶׁךְ como saco, medida ou provisão.
- source_word: בֹּא יָבוֹא
  choice: certamente voltará
  rationale: O infinitivo absoluto com o imperfeito enfatiza a certeza da ação. 'Voltará' torna explícito o movimento de retorno sugerido pelo contraste contextual, sem acrescentar uma localização não expressa.
- source_word: בְרִנָּה
  choice: com gritos de alegria
  rationale: רִנָּה denota uma manifestação audível e vibrante de alegria; a expressão mantém tanto o júbilo quanto seu caráter vocal.
- source_word: אֲלֻמֹּתָיו
  choice: os seus feixes
  rationale: O termo designa feixes da colheita. É uma tradução agrícola precisa e tradicional, ainda compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo claro entre a saída em lágrimas e a volta jubilosa. A tradução conserva a dificuldade lexical em מֶשֶׁךְ הַזָּרַע por meio de nota e evita tornar obrigatória uma interpretação concreta debatida.
