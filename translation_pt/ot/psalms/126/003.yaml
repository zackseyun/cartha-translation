lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: fez grandes coisas
  rationale: A construção idiomática hebraica significa “fazer grandes coisas”. A tradução comunica o sentido com naturalidade, sem reproduzir de modo rígido a estrutura do infinitivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמָּנוּ
  choice: por nós
  rationale: Embora עִם signifique literalmente “com”, neste contexto a expressão tem sentido benefativo; “por nós” é natural em português. A alternativa mais literal é preservada em nota.
- source_word: הָיִינוּ שְׂמֵחִים
  choice: ficamos alegres
  rationale: A combinação de היה com o adjetivo descreve o estado resultante. “Ficamos alegres” é corrente em português e preserva a perspectiva passada e a resposta de alegria.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o nome divino. “Yahweh” preserva esse nome pessoal sem o substituir por um título ou adotar outra forma tradicional.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética concisa. A formulação mantém o paralelismo e registra em nota a ambiguidade da preposição hebraica.
