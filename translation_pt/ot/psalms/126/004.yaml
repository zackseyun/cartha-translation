  text: שׁוּבָ֣/ה יְ֭הוָה אֶת שבות/נו כַּ/אֲפִיקִ֥ים בַּ/נֶּֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: pt
  text: Restaura a nossa sorte[a], ó Yahweh, como as torrentes no Neguebe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Traz de volta os nossos cativos” ou “Restaura o nosso cativeiro”. A expressão hebraica pode referir-se especificamente ao retorno de exilados ou, de modo mais amplo, à restauração da condição de um povo.
    reason: alternative_reading
  - marker: b
    text: A imagem é a dos cursos de água normalmente secos do Neguebe, que se enchem de repente quando chegam as chuvas.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: Restaura
  rationale: Imperativo dirigido a Yahweh. Com אֶת + שְׁבוּת, integra a expressão que pede a reversão da condição adversa da comunidade; “Restaura” é natural em português e não restringe o sentido ao retorno físico de exilados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando seu caráter de nome pessoal.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Partícula gramatical sem significado lexical independente; sua função é expressa pela sintaxe portuguesa.
- source_word: שבותנו
  choice: a nossa sorte
  rationale: Na expressão שׁוב את־שבות, pode indicar a restauração da condição ou sorte de um povo, embora também possa aludir ao retorno de cativos. A formulação escolhida mantém o sentido amplo e idiomático.
- source_word: כַּאֲפִיקִים
  choice: como as torrentes
  rationale: אֲפִיקִים designa canais ou cursos de água. “Torrentes” comunica de modo conciso a imagem dos leitos normalmente secos que se enchem subitamente com as chuvas.
- source_word: בַּנֶּגֶב
  choice: no Neguebe
  rationale: Aqui נֶגֶב aponta concretamente para a região árida ao sul de Judá, cuja geografia dá força à comparação.
theological_decisions:
- issue: Sentido da expressão שׁוב את־שבות
  choice: pedido pela restauração da condição ou sorte da comunidade
  alternative: pedido específico pelo retorno de cativos ou exilados
  rationale: A expressão hebraica admite ambos os sentidos. O contexto de restauração nacional mantém viva a ressonância do exílio, mas o texto principal deve conservar a abrangência da súplica sem limitá-la a um retorno físico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Sorte” é usada no sentido de condição ou situação, não de acaso; a nota explicita a ambiguidade do idioma hebraico. “Neguebe” segue a forma geográfica corrente em português.
