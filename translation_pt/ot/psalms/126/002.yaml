base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: pt
  text: 'Então nossa boca se encheu de riso, e nossa língua, de gritos de alegria[a]. Então disseram entre as nações: “Yahweh fez grandes coisas por eles”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de um clamor jubiloso” ou “de gritos de alegria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Yahweh agiu grandemente com estes”; expressão hebraica que significa que Yahweh fez grandes coisas em favor deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência e o resultado da restauração mencionada no versículo anterior, com naturalidade em português.
- source_word: יִמָּלֵא
  choice: se encheu
  rationale: Embora seja morfologicamente uma forma prefixal passiva, o contexto poético retrospectivo favorece o passado; a construção pronominal comunica bem o sentido resultativo.
- source_word: שְׂחוֹק
  choice: riso
  rationale: No paralelismo com רִנָּה e no contexto de restauração, indica riso jubiloso, não zombaria.
- source_word: פִּינוּ
  choice: nossa boca
  rationale: Preserva o singular coletivo hebraico, que também é natural como expressão poética em português.
- source_word: וּלְשׁוֹנֵנוּ
  choice: e nossa língua
  rationale: Mantém o singular coletivo e o paralelismo poético com “nossa boca”.
- source_word: רִנָּה
  choice: gritos de alegria
  rationale: Expressa o clamor sonoro e jubiloso do termo sem restringi-lo necessariamente ao canto.
- source_word: יֹאמְרוּ
  choice: se dizia
  rationale: A forma impessoal é natural com “entre as nações” e conserva a referência coletiva sem introduzir um sujeito explícito ausente no português.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: Representa os povos circundantes de modo transparente e sem a carga religiosa que “gentios” poderia acrescentar.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: fez grandes coisas
  rationale: Traduz idiomaticamente a construção hebraica “tornar grande ao fazer”, isto é, realizar grandes feitos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִם אֵלֶּה
  choice: por eles
  rationale: Comunica em português o sentido benefactivo contextual de “com estes”, identificando Israel como destinatário dos grandes feitos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva, enquanto “SENHOR” o substitui por um título.
- issue: Referência temporal de יִמָּלֵא
  choice: passado retrospectivo (“se encheu”)
  alternative: futuro (“se encherá”)
  rationale: O salmo recorda a restauração como experiência celebrada; o passado corresponde ao fluxo discursivo sem negar a forma verbal hebraica, cuja referência temporal depende do contexto.
- issue: Valor de עִם אֵלֶּה
  choice: benefactivo (“por eles”)
  alternative: literal (“com estes”)
  rationale: A construção integra a expressão idiomática sobre os grandes feitos de Yahweh em favor do povo; a nota conserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A elipse do verbo após “nossa língua” preserva o paralelismo poético sem soar artificial. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
