  naturalness: O português é moderno, claro e poeticamente apropriado. “Então disseram entre as nações” é mais direto e fiel que “Então se dizia entre as nações”, preservando ao mesmo tempo a fluência. A elipse em “nossa língua, de gritos de alegria” é natural.
  terminology: “Yahweh”, “nações”, “riso” e “gritos de alegria” são escolhas adequadas. A nota a deve evitar “cânticos de alegria”, pois רִנָּה pode incluir canto, mas designa mais amplamente um grito ou clamor jubiloso; uma alternativa não restrita ao canto é preferível.
