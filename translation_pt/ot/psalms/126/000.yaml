  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: pt
  text: Cântico de peregrinação. Quando Yahweh restaurou a sorte de Sião[a], parecíamos estar sonhando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trouxe de volta os cativos de Sião” / “restaurou o cativeiro de Sião”. A expressão hebraica pode se referir especificamente ao retorno do exílio ou, de modo mais amplo, à restauração da sorte.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: O título designa os cânticos associados às subidas, provavelmente às peregrinações a Jerusalém. A formulação natural em português comunica essa função sem exigir uma tradução espacial rígida.
- source_word: בְּשׁוּב יְהוָה
  choice: Quando Yahweh restaurou
  rationale: A construção temporal é vertida naturalmente; o nome divino é transliterado como Yahweh, preservando sua distinção em relação ao título 'Senhor'.
- source_word: אֶת שִׁיבַת צִיּוֹן
  choice: a sorte de Sião
  rationale: A expressão idiomática pode indicar restauração da situação ou retorno dos exilados. O texto principal mantém o sentido mais amplo, e a nota registra a leitura específica.
- source_word: הָיִינוּ כְּחֹלְמִים
  choice: parecíamos estar sonhando
  rationale: Reproduz a comparação hebraica em português corrente e preserva a ideia de uma experiência tão extraordinária que parecia um sonho.
theological_decisions:
- issue: Amplitude da restauração de Sião
  choice: restaurou a sorte de Sião
  alternative: trouxe de volta os cativos de Sião / restaurou o cativeiro de Sião
  rationale: O hebraico admite tanto uma restauração ampla quanto uma referência concreta ao retorno do exílio; a tradução não restringe indevidamente o sentido, e a nota conserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se “Yahweh” como representação do nome divino e usa-se um título tradicionalmente inteligível para o gênero do salmo.
