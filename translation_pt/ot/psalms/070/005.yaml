source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: pt
  text: Quanto a mim, sou pobre e necessitado; ó Deus, apressa-te em vir a mim[a]. Tu és o meu auxílio e o meu libertador; ó Javé[b], não demores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «apressa-te a mim»; também pode ser entendido como «apressa-te por mim».'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH; tradicionalmente traduzido como «SENHOR».
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: A conjunção com o pronome marca uma mudança contrastiva para a situação do salmista; a formulação é natural em português e não acrescenta uma oposição mais forte do que o contexto permite.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pobre e necessitado
  rationale: Preserva a dupla expressão hebraica de pobreza, aflição e dependência, distinguindo os dois termos sem reduzi-los à humildade espiritual.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; «ó» expressa com dignidade o apelo direto.
- source_word: חוּשָׁה לִי
  choice: apressa-te em vir a mim
  rationale: O imperativo pede ação urgente, e לִי pode indicar o salmista como alvo dessa ação. A explicitação de «vir» produz português natural sem ocultar a alternativa «por mim».
- source_word: עֶזְרִי
  choice: o meu auxílio
  rationale: Traduz o substantivo עֵזֶר como ajuda ou socorro, mantendo a construção predicativa e distinguindo-o de um substantivo de agente.
- source_word: וּמְפַלְטִי
  choice: e o meu libertador
  rationale: O particípio da raiz פלט designa aquele que proporciona escape ou livramento; «libertador» conserva essa dimensão pessoal.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa em português o nome divino YHWH, em vez de substituí-lo silenciosamente por um título; a tradição alternativa é indicada em nota.
- source_word: אַל תְּאַחַר
  choice: não demores
  rationale: Reproduz de forma direta e atual o pedido negativo para que Deus não adie sua intervenção.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio YHWH. «Javé» torna visível esse dado textual, enquanto a nota registra a convenção tradicional «SENHOR», sem transformar a questão em afirmação doutrinária.
- issue: Sentido social e existencial de עָנִי וְאֶבְיוֹן
  choice: pobre e necessitado
  alternative: afligido e carente
  rationale: A tradução mantém a condição concreta de privação e dependência, sem restringir a expressão à pobreza econômica nem reinterpretá-la como virtude espiritual.
translation_notes:
  register: Português atual, claro e digno, com sintaxe facilmente compreensível tanto no Brasil quanto em outros contextos lusófonos. O tom urgente da súplica é preservado por «apressa-te» e «não demores», sem recorrer a vocabulário arcaico.
