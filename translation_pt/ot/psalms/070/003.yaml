lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Que recuem
  rationale: O qal imperfeito na sequência imprecatória tem força volitiva. “Que recuem” expressa de modo natural o desejo de que os adversários retrocedam, sem introduzir uma voz passiva ausente da forma hebraica.
- source_word: עַל עֵקֶב
  choice: por causa de
  rationale: A expressão funciona idiomaticamente com sentido causal ou consequencial. “Por causa de” é clara e preserva a relação com a vergonha sem recorrer a uma tradução literal obscura.
- source_word: בָּשְׁתָּם
  choice: sua vergonha
  rationale: O termo pertence ao campo semântico de vergonha e desonra. “Sua vergonha” é conciso, digno e mantém aberta a possibilidade de vergonha sentida ou desgraça pública.
- source_word: הָאֹמְרִים
  choice: os que dizem
  rationale: O particípio substantivado com artigo identifica os adversários por sua fala característica. A formulação é corrente e conserva esse valor descritivo.
- source_word: הֶאָח הֶאָח
  choice: Ahá! Ahá!
  rationale: A interjeição exprime escárnio e satisfação maliciosa. “Ahá!” reproduz em português a provocação triunfante sem explicá-la em excesso.
