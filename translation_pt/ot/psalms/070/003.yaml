  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: pt
  text: 'Que recuem por causa de sua vergonha[a] os que dizem: “Ahá! Ahá!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que recuem por causa de sua desonra.”'
