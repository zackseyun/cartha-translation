  text: For the choirmaster. Of David. For remembrance[a].
translation:
  language: pt
  text: Ao regente. De Davi. Para lembrança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para servir de memorial” ou “Para trazer à memória”; possivelmente, trata-se de uma indicação litúrgica relacionada à lembrança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Em títulos de salmos, o termo designa convencionalmente o responsável pela execução musical. “Ao regente” é conciso, natural em português e reflete o prefixo ל sem especificar indevidamente coro ou instrumentos.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A construção pode indicar autoria, associação, dedicação ou pertencimento a uma coleção. “De Davi” conserva melhor essa amplitude do que “Por Davi” ou “Para Davi”.
- source_word: לְהַזְכִּיר
  choice: Para lembrança
  rationale: O infinitivo causativo de זכר pode significar “fazer lembrar” ou “trazer à memória”. No título, a formulação breve mantém o valor de finalidade e não determina quem deve lembrar nem a função litúrgica exata.
theological_decisions:
- issue: Função de לְהַזְכִּיר no título
  choice: Indicação de finalidade traduzida de modo neutro como “Para lembrança”
  alternative: Uma fórmula de oferta memorial; um pedido para que Deus se lembre; ou uma indicação para a recordação do adorador
  rationale: O hebraico não identifica quem se lembra nem define com certeza a prática litúrgica em vista. A tradução preserva essa ambiguidade em vez de impor uma interpretação cultual ou teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa própria de um título de salmo. O marcador [a] foi colocado após “lembrança”, termo ao qual a nota se refere.
