  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: pt
  text: Ó Deus, livra-me; ó Yahweh[a], apressa-te a ajudar-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente traduzido por «SENHOR».'
    reason: Esclarece a forma hebraica por trás de «Yahweh» e registra a tradução tradicional sem substituir o nome no texto principal.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo numa oração. A partícula «ó» torna explícita em português a invocação direta.
- source_word: לְהַצִּילֵנִי
  choice: livra-me
  rationale: O infinitivo hifil de נצל com sufixo de primeira pessoa expressa o pedido para ser posto a salvo. «Livra-me» preserva o sentido amplo, sem restringi-lo à salvação eterna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֶזְרָתִי
  choice: em ajudar-me
  rationale: A construção com לְ e o substantivo עֶזְרָה indica auxílio dirigido ao salmista; em conjunto com o verbo seguinte, «apressa-te em ajudar-me» é natural em português.
- source_word: חוּשָׁה
  choice: apressa-te
  rationale: A forma imperativa de חושׁ comunica um apelo por ação urgente. «Apressa-te» mantém a urgência e o tom digno da oração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo silenciosamente pelo título «SENHOR»; a nota informa a tradição alternativa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada para formar uma súplica idiomática, preservando o paralelismo e a urgência do hebraico.
