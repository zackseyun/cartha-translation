  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: pt
  text: Sejam envergonhados e humilhados os que procuram tirar-me a vida[a]; recuem e sejam desonrados os que se alegram com a minha desgraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os que procuram a minha alma”. Aqui, “alma” (נפשׁ) refere-se à vida ou à própria pessoa, num contexto de ameaça de morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: Expressa o desejo ou pedido imprecatório de que os adversários sofram vergonha, preservando o valor de בוש e a forma volitiva do contexto.
- source_word: וְיַחְפְּרוּ
  choice: e humilhados
  rationale: חפר intensifica o campo semântico da vergonha; “humilhados” distingue o segundo verbo sem apagar o paralelismo.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: os que procuram tirar-me a vida
  rationale: Neste contexto hostil, נפשׁ designa a vida ou a própria pessoa. A expressão escolhida torna explícita, em português natural, a intenção de matar sugerida pelo idioma hebraico.
- source_word: יִסֹּגוּ אָחוֹר
  choice: recuem
  rationale: סוג אחור descreve voltar para trás ou bater em retirada; “recuem” é conciso e natural.
- source_word: וְיִכָּלְמוּ
  choice: e sejam desonrados
  rationale: כלם pertence ao campo da vergonha e da desonra pública. “Desonrados” evita repetição mecânica e mantém a distinção lexical.
- source_word: חֲפֵצֵי רָעָתִי
  choice: os que se alegram com a minha desgraça
  rationale: חפץ pode indicar prazer ou satisfação, e רעה aqui é a calamidade sofrida pelo salmista, não sua maldade moral. A tradução comunica prazer malicioso diante de seu infortúnio.
theological_decisions:
- issue: Força imprecatória dos verbos no imperfeito
  choice: 'Traduzir como pedido ou desejo: “Sejam...; recuem e sejam...”'
  alternative: 'Traduzir como futuro declarativo: “Serão...; recuarão...”'
  rationale: No contexto de oração do salmo, as formas têm força volitiva ou jussiva. O subjuntivo português preserva o pedido sem transformá-lo em previsão categórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão inicial preserva o tom poético e imprecatório sem soar arcaica; o ponto e vírgula mantém o paralelismo hebraico.
