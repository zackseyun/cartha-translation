  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל אֱלֹהִ֑ים אֹ֝הֲבֵ֗י יְשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: pt
  text: 'Exultem e alegrem-se em ti todos os que te buscam; os que amam a tua salvação[a] digam sempre: “Deus seja engrandecido!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu livramento”. A palavra hebraica pode referir-se ao resgate de uma aflição ou à salvação em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “Deus seja exaltado!” ou “Deus seja reconhecido como grande!”. O hebraico expressa um desejo ou uma aclamação a respeito da grandeza de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ
  choice: Exultem
  rationale: O qal imperfeito de שׂוּשׂ expressa alegria intensa. “Exultem” preserva essa força e permite distingui-lo do verbo seguinte.
- source_word: וְיִשְׂמְחוּ
  choice: e alegrem-se
  rationale: שׂמח denota alegria ou contentamento; “alegrem-se” é natural e mantém o paralelismo com “exultem” sem fundir os dois verbos.
- source_word: בְּךָ
  choice: em ti
  rationale: A preposição בְּ indica aqui a esfera ou o fundamento da alegria. “Em ti” conserva o foco devocional e a formulação bíblica natural em português.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: todos os que te buscam
  rationale: A construção participial com כָּל descreve o conjunto das pessoas caracterizadas por buscar Deus; esta formulação é clara e idiomática.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: digam sempre
  rationale: O imperfeito com תָמִיד comunica fala habitual ou contínua. “Digam sempre” expressa isso de modo conciso e corrente.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Deus seja engrandecido
  rationale: O imperfeito tem força volitiva ou de aclamação. O subjuntivo português preserva o desejo de que a grandeza de Deus seja proclamada, em vez de transformar a frase numa simples afirmação.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: os que amam a tua salvação
  rationale: יְשׁוּעָה pode designar livramento de uma aflição concreta ou salvação em sentido mais amplo. “Salvação” conserva essa amplitude, e “os que amam” verte naturalmente o particípio.
theological_decisions:
- issue: Sentido de יְשׁוּעָה
  choice: salvação
  alternative: livramento
  rationale: O termo hebraico abrange tanto o resgate em meio à aflição quanto a salvação em sentido amplo. “Salvação” mantém a ressonância teológica sem excluir o livramento concreto.
- issue: Força volitiva de יִגְדַּל אֱלֹהִים
  choice: Deus seja engrandecido
  alternative: Deus seja exaltado / Deus seja reconhecido como grande
  rationale: A oração funciona como desejo ou aclamação repetida, não apenas como declaração de um fato. O subjuntivo preserva esse ato de fala e a tensão entre a grandeza própria de Deus e seu reconhecimento público.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A ordem poética do hebraico foi preservada em grande parte; “exultem” e “alegrem-se” mantêm os dois verbos paralelos, enquanto o subjuntivo em “seja engrandecido” conserva a força de aclamação.
