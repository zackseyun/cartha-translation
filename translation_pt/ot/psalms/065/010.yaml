  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: pt
  text: Regas abundantemente os seus sulcos; aplanas as suas elevações. Com chuvas abundantes, amoleces a terra; abençoas o que nela brota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: os seus sulcos
  rationale: O termo designa os sulcos da terra arada; o pronome feminino retoma a terra do contexto anterior.
- source_word: רַוֵּה
  choice: Encharcas
  rationale: O piel expressa regar até deixar plenamente saturado; “encharcas” comunica essa intensidade com naturalidade.
- source_word: נַחֵת
  choice: aplanas
  rationale: Neste contexto agrícola, o imperativo verbal descreve fazer baixar ou assentar as elevações do solo.
- source_word: גְּדוּדֶיהָ
  choice: os seus torrões
  rationale: Embora o substantivo normalmente possa indicar tropas ou grupos, aqui o paralelismo agrícola aponta para as saliências ou torrões entre os sulcos.
- source_word: בִּרְבִיבִים
  choice: Com chuvas abundantes
  rationale: רְבִיבִים refere-se a aguaceiros ou chuvas copiosas; a formulação preserva a ideia de abundância.
- source_word: תְּמֹגְגֶנָּה
  choice: amoleces a terra
  rationale: A forma verbal significa fazer derreter, dissolver ou amolecer; o objeto pronominal é explicitado como “a terra” para clareza em português.
- source_word: צִמְחָהּ
  choice: o que nela brota
  rationale: O substantivo com sufixo pode indicar seu broto, crescimento ou produto; esta expressão preserva o sentido abrangente sem restringi-lo prematuramente à colheita.
- source_word: תְּבָרֵךְ
  choice: abençoas
  rationale: Tradução direta do piel de ברך, mantendo a ação divina de favorecer e fazer prosperar.
