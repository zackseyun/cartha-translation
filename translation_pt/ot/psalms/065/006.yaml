  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: pt
  text: que firma os montes com seu poder[a], cingido de força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que firma os montes com sua força, cingido de poder”.'
    reason: 'Alternativa lexical: tanto כֹּחַ como גְּבוּרָה podem ser traduzidos por “força” ou “poder”; a nota registra a possível inversão sem alterar o sentido básico.'
lexical_decisions:
- source_word: מֵכִין
  choice: firma
  rationale: O particípio hifil de כון indica fazer ficar firme ou estável. “Firma” comunica de modo natural a estabilidade dos montes e mantém o caráter descritivo da ação divina, sem especificar além do hebraico o modo de sua origem.
- source_word: הָרִים
  choice: os montes
  rationale: הָרִים designa montes ou montanhas. “Os montes” é corrente na linguagem poética bíblica em português e preserva o artigo definido.
- source_word: בְּכֹחוֹ
  choice: com seu poder
  rationale: כֹּחַ pode significar poder ou força; a preposição בְּ exprime aqui o meio pelo qual Deus firma os montes. “Com seu poder” é natural em português.
- source_word: נֶאְזָר
  choice: cingido
  rationale: O particípio nifal de אזר significa estar cingido ou equipado. “Cingido” preserva a imagem corporal e poética de alguém que se prepara ou se reveste para agir.
- source_word: בִּגְבוּרָה
  choice: de força
  rationale: גְּבוּרָה denota força ou poder vigoroso. Com “cingido”, a construção idiomática “cingido de força” mantém a metáfora e evita repetir “poder” no texto principal.
theological_decisions:
- issue: Relação entre os dois particípios
  choice: 'Manter ambos como descrições coordenadas de Deus: “que firma... cingido...”'
  alternative: 'Explicitar o segundo como oração relativa: “que firma... e que está cingido...”'
  rationale: O hebraico apresenta dois particípios em sequência. A formulação escolhida conserva o fluxo poético e deixa implícita a relação sintática, sem transformá-la desnecessariamente em duas afirmações finitas.
- issue: Metáfora da força divina
  choice: Preservar a imagem “cingido de força”
  alternative: Interpretar como “armado de poder” ou abstrair como “cheio de força”
  rationale: A linguagem de estar cingido retrata poeticamente a prontidão e o vigor de Deus. Preservar a metáfora evita reduzir a imagem a uma afirmação abstrata.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira. “Firma” é mais concreto e natural com “montes” do que “estabelece”; “cingido” conserva deliberadamente a metáfora hebraica. A inicial minúscula reflete que o segmento continua a sintaxe e o pensamento do contexto imediato.
