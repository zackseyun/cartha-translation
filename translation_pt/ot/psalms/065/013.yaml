  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: pt
  text: Os pastos se vestem de rebanhos[a], e os vales se cobrem de cereal; dão gritos de alegria, sim, cantam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «As campinas se vestem de rebanhos». Neste contexto, o substantivo hebraico pode designar pastagens ou campinas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: se vestem
  rationale: Preserva a metáfora ativa do hebraico, na qual os pastos aparecem como quem veste uma cobertura de rebanhos.
- source_word: כָרִים
  choice: pastos
  rationale: No paralelismo com os vales e na relação com הַצֹּאן, designa terras de pastagem, não carneiros.
- source_word: הַצֹּאן
  choice: rebanhos
  rationale: Expressa naturalmente em português o coletivo de animais de pequeno porte, sobretudo ovelhas e cabras.
- source_word: וַעֲמָקִים
  choice: e os vales
  rationale: Equivalente direto e natural que mantém a paisagem poética e o paralelismo.
- source_word: יַעַטְפוּ
  choice: se cobrem
  rationale: Comunica a ideia de envolver ou cobrir e mantém os vales como sujeito ativo da personificação, sem tornar a frase artificial.
- source_word: בָר
  choice: cereal
  rationale: O termo hebraico é geral para grão ou produção cerealífera; «cereal» evita especificá-lo indevidamente como trigo ou milho.
- source_word: יִתְרוֹעֲעוּ
  choice: dão gritos de alegria
  rationale: Reproduz o brado jubiloso indicado pelo verbo e sua ligação poética com o canto.
- source_word: אַף
  choice: sim
  rationale: Representa a força enfática da partícula na progressão entre gritar de alegria e cantar.
- source_word: יָשִׁירוּ
  choice: cantam
  rationale: Tradução simples e direta que preserva o clímax do paralelismo poético.
theological_decisions: []
