translation:
  language: pt
  text: Ao regente[a]. Salmo de Davi[b]; cântico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao diretor musical”.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica “de Davi” pode indicar autoria, dedicação, pertença ou associação; a tradução preserva essa ambiguidade, sem especificar “por Davi”.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente quem dirige a execução musical. “Regente” é natural em português moderno, e a preposição לַ é representada por “Ao”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo usual para uma composição musical desse tipo e, em títulos, corresponde naturalmente a “salmo”.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos pode indicar autoria, pertença, associação ou dedicação. “De Davi” preserva melhor essa amplitude do que “por Davi” ou “para Davi”.
- source_word: שִׁיר
  choice: cântico
  rationale: Mantém este termo distinto de מִזְמוֹר sem reduzir ambos à mesma palavra. “Cântico” é claro, digno e adequado ao registro poético.
theological_decisions:
- issue: Relação de Davi com o salmo
  choice: de Davi
  alternative: por Davi / para Davi
  rationale: O hebraico não determina sozinho se a expressão indica autoria, dedicação ou associação; a tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com concisão própria de um título de salmo. O ponto e vírgula liga “cântico” ao restante da inscrição sem fundir os dois termos hebraicos.
