  text: יִ֭רְעֲפוּ נְא֣וֹת מִדְבָּ֑ר וְ֝/גִ֗יל גְּבָע֥וֹת תַּחְגֹּֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: pt
  text: 'As pastagens do deserto gotejam[a],

    e as colinas se cingem de alegria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “transbordam”; o verbo hebraico pode retratar umidade abundante que goteja, se destila ou se derrama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: gotejam
  rationale: O verbo רָעַף descreve o gotejar ou destilar de umidade abundante. “Gotejam” conserva a imagem poética sem acrescentar um objeto que não está expresso no hebraico.
- source_word: נְאוֹת
  choice: pastagens
  rationale: נָוֶה pode designar morada ou lugar de pasto; neste contexto de fertilidade da terra, “pastagens” expressa com clareza o sentido paisagístico.
- source_word: מִדְבָּר
  choice: deserto
  rationale: מִדְבָּר designa uma região inculta ou estepe, não necessariamente um deserto arenoso. “Deserto” é a forma portuguesa corrente, enquanto “pastagens” impede que a imagem seja entendida como terreno inteiramente estéril.
- source_word: גִיל
  choice: alegria
  rationale: O substantivo indica júbilo ou exultação. “Alegria” é natural em português e mantém a personificação poética das colinas.
- source_word: גְּבָעוֹת
  choice: colinas
  rationale: Tradução direta do substantivo feminino plural, adequada à paisagem poética.
- source_word: תַּחְגֹּרְנָה
  choice: se cingem de
  rationale: חָגַר significa cingir ou prender ao redor do corpo. A forma reflexiva preserva a metáfora em que as colinas vestem a alegria como um cinturão.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com sintaxe simples. “Cingem” conserva a metáfora corporal do hebraico; embora menos coloquial, é amplamente compreensível no registro poético. A quebra de linha acompanha o paralelismo do verso.
