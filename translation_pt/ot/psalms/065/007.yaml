  yaml_path: translation/ot/psalms/065/007.yaml
  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: pt
  text: 'que aquieta[a] o rugido dos mares,

    o rugido de suas ondas

    e o tumulto dos povos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “silencia”, “acalma” ou “domina”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a agitação ruidosa dos povos”. O termo hebraico pode indicar comoção barulhenta e, em certos contextos, uma multidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: que aquieta
  rationale: O particípio hifil descreve aquele que faz cessar ou diminuir o ruído. “Que aquieta” mantém a força descritiva e se liga naturalmente ao contexto da frase.
- source_word: שְׁאוֹן
  choice: rugido
  rationale: O substantivo indica ruído forte ou estrondo tumultuoso. “Rugido” preserva a imagem sonora dos mares e das ondas; a repetição foi mantida como no hebraico.
- source_word: יַמִּים
  choice: os mares
  rationale: Mantém o plural hebraico e a amplitude poética da referência às águas.
- source_word: גַּלֵּיהֶם
  choice: suas ondas
  rationale: O sufixo masculino plural retoma naturalmente “os mares”, preservando a ligação pronominal do hebraico.
- source_word: הֲמוֹן
  choice: tumulto
  rationale: No paralelismo com o rugido das águas, designa agitação ruidosa, embora o termo também possa, em outros contextos, referir-se a uma multidão.
- source_word: לְאֻמִּים
  choice: os povos
  rationale: “Povos” expressa o coletivo humano sem restringir a referência a Estados nacionais modernos.
theological_decisions:
- issue: Alcance do paralelo entre a desordem natural e a humana
  choice: O versículo apresenta Deus como aquele que aquieta tanto os mares revoltos quanto o tumulto dos povos.
  alternative: Entender a linha apenas como descrição de fenômenos naturais ou acentuar especificamente a subjugação política das nações.
  rationale: O paralelismo poético hebraico une o rugido dos mares ao tumulto dos povos. A tradução conserva essa amplitude sem impor uma interpretação política ou escatológica específica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A disposição em três linhas preserva o paralelismo poético e a repetição enfática de “rugido”.
