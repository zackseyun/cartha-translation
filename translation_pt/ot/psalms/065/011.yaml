  text: עִ֭טַּרְתָּ שְׁנַ֣ת טוֹבָתֶ֑/ךָ וּ֝/מַעְגָּלֶ֗י/ךָ יִרְעֲפ֥וּ/ן דָּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/011.yaml
  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: pt
  text: 'Coroas o ano com a tua bondade[a],

    e as tuas veredas gotejam de fartura[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com a tua generosidade» ou «com a tua abundância». O termo hebraico pode expressar bondade, benefício e prosperidade.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «riqueza» ou «gordura», imagem hebraica de fertilidade e provisão abundante. «Veredas» também pode ser traduzido por «rastros»; a imagem pode evocar o percurso de Deus deixando fertilidade por onde passa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Coroas
  rationale: Preserva a metáfora hebraica de pôr uma coroa ou adornar, usando um presente poético natural em português.
- source_word: שְׁנַת
  choice: o ano
  rationale: A forma construta designa o ano como objeto da ação divina; o artigo definido produz uma expressão natural no contexto do ciclo anual.
- source_word: טוֹבָתֶךָ
  choice: com a tua bondade
  rationale: טוֹבָה pode indicar bondade, benefício, prosperidade ou generosidade. «Bondade» conserva a amplitude do termo, enquanto a preposição «com» explicita em português a relação implícita na construção hebraica.
- source_word: וּמַעְגָּלֶיךָ
  choice: e as tuas veredas
  rationale: מַעְגָּל designa caminho, trilha, curso ou rastro. «Veredas» mantém a imagem poética do percurso de Deus sem restringi-la necessariamente a sulcos de rodas.
- source_word: יִרְעֲפוּן
  choice: gotejam
  rationale: O verbo descreve o ato de destilar, deixar cair gotas ou fazer transbordar. «Gotejam» preserva a imagem concreta e agrícola.
- source_word: דָּשֶׁן
  choice: fartura
  rationale: Literalmente ligado a gordura ou riqueza, o substantivo funciona aqui como imagem de fertilidade, abundância e provisão generosa. «Fartura» comunica isso de modo claro e poético.
theological_decisions:
- issue: Preservação da imagem da bênção divina sobre o ciclo agrícola
  choice: Manter Deus coroando o ano e suas veredas gotejando fartura
  alternative: Explicitar em prosa que Deus abençoa abundantemente a colheita
  rationale: A formulação metafórica atribui a fertilidade e a provisão à ação benéfica de Deus sem reduzir a poesia a uma explicação interpretativa.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. «Veredas» dá dignidade ao verso sem ser obscuro; «fartura» evita o sentido corporal potencialmente enganoso de uma tradução literal de דָּשֶׁן.
