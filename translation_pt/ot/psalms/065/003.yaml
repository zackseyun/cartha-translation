lexical_decisions:
- source_word: דִּבְרֵי
  choice: As palavras de
  rationale: Preserva de modo transparente o plural construto דִּבְרֵי e a formulação comprimida do hebraico; a nota registra a alternativa portuguesa mais idiomática.
- source_word: עֲוֺנֹת
  choice: iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou suas consequências. O singular coletivo em português soa natural após 'palavras de' sem eliminar a pluralidade conceitual do hebraico.
- source_word: גָּבְרוּ
  choice: prevaleceram
  rationale: Expressa o sentido de גבר, 'ser forte, prevalecer', e conserva a imagem dos pecados dominando o salmista.
- source_word: מֶנִּי
  choice: contra mim
  rationale: A preposição מן com o verbo גבר pode indicar superioridade sobre alguém; 'contra mim' comunica aqui o valor adversativo.
- source_word: פְּשָׁעֵינוּ
  choice: nossas transgressões
  rationale: Mantém o plural e o peso moral de פֶּשַׁע, que pode designar transgressão ou rebelião.
- source_word: אַתָּה
  choice: tu
  rationale: O pronome explícito é enfático no hebraico; sua posição antes do objeto retomado preserva essa ênfase em português.
- source_word: תְכַפְּרֵם
  choice: tu as expiarás
  rationale: O piel de כפר com sufixo plural denota fazer expiação pelas transgressões ou removê-las. 'Expiar' conserva o peso cultual e teológico sem especificar uma teoria particular.
theological_decisions:
- issue: Tradução de כפר no contexto da remoção do pecado
  choice: tu as expiarás
  alternative: tu as cobrirás; tu as purificarás; farás expiação por elas
  rationale: '''Expiar'' preserva a força expiatória do verbo e evita reduzi-lo à simples ocultação. Ao mesmo tempo, não define o mecanismo da expiação além do que o verso afirma.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção deliberadamente solene conserva a compressão poética do hebraico. O travessão destaca o pronome enfático אַתָּה e a mudança do lamento individual para a confissão comunitária.
