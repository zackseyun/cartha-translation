  text: As palavras de iniquidade prevaleceram contra mim[a]; nossas transgressões — tu farás expiação por elas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As questões de iniquidade são fortes demais para mim”. O início hebraico é condensado e admite uma formulação mais idiomática.'
