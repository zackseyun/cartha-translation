  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: pt
  text: Tu visitas a terra e a regas; tu a enriqueces abundantemente. O rio de Deus[a] está cheio de água; preparas o cereal deles[b], pois assim preparas a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a corrente de Deus” ou “o canal de Deus”. A expressão hebraica é poética e pode evocar a fonte celestial da chuva e da fertilidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “providencias o cereal deles” ou “estabeleces o cereal deles”. O verbo hebraico pode significar “preparar”, “deixar pronto” ou “estabelecer”; o pronome “deles” provavelmente se refere às pessoas beneficiadas pela produção da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: visitas
  rationale: Preserva a imagem concreta do hebraico פקד, que aqui expressa a atenção divina benéfica à terra.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: e a regas
  rationale: No contexto de fertilidade agrícola, comunica naturalmente o suprimento de água à terra.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: tu a enriqueces abundantemente
  rationale: Reproduz tanto a força causativa de עשר quanto a intensificação de רַבַּת em português corrente e poético.
- source_word: פֶּלֶג אֱלֹהִים
  choice: O rio de Deus
  rationale: Mantém de forma direta a expressão poética elevada, sem reduzir sua possível evocação da fonte divina das águas.
- source_word: מָלֵא מָיִם
  choice: está cheio de água
  rationale: Expressão simples e natural que preserva a imagem de abundância.
- source_word: תָּכִין דְּגָנָם
  choice: preparas o cereal deles
  rationale: Mantém o sentido básico de כון no hifil e conserva o sufixo masculino plural, distinto da terra, que é feminino singular.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: pois assim preparas a terra
  rationale: Repete 'preparas' para conservar o elo lexical com a oração anterior e explicita o referente feminino singular do sufixo.
theological_decisions:
- issue: Referente do sufixo plural em דְּגָנָם ('o cereal deles')
  choice: Conservar o pronome plural, provavelmente referente às pessoas que recebem o produto da terra.
  alternative: Traduzir de modo geral como 'produzes o cereal', sem exprimir um referente humano.
  rationale: O sufixo hebraico é masculino plural e não corresponde gramaticalmente a 'terra', que é feminino singular. 'Deles' preserva essa distinção e a ambiguidade quanto ao grupo humano pressuposto.
- issue: Sentido da expressão פֶּלֶג אֱלֹהִים
  choice: Traduzir literalmente como 'o rio de Deus'.
  alternative: Traduzir como 'a corrente de Deus' ou interpretar como uma referência explícita à fonte celestial da chuva.
  rationale: A formulação literal preserva a poesia e não decide se a expressão indica posse, origem divina ou intensidade superlativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'tu' para conservar a interpelação poética direta. 'Cereal' representa דגן de maneira abrangente; 'grão' seria possível, mas pode sugerir uma unidade ou semente individual. A repetição de 'preparas' é deliberada para refletir a repetição do verbo hebraico.
