  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: pt
  text: Bem-aventurado aquele a quem escolhes e aproximas para habitar nos teus átrios[a]! Seremos saciados com a bondade da tua casa[b], do teu santo templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado aquele a quem escolhes e aproximas; ele habitará nos teus átrios”.'
    reason: A forma verbal hebraica pode ser entendida como resultado ou declaração, e não apenas como finalidade.
  - marker: b
    text: “Bondade” também pode ser traduzida por “coisas boas”, “bens” ou “abundância”.
    reason: O substantivo hebraico טוּב abrange tanto bondade quanto os benefícios ou a fartura que ela proporciona.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz aquele
  rationale: A forma plural idiomática introduz uma bem-aventurança. “Feliz aquele” é clara e natural em português, sem reduzir a expressão a um estado emocional passageiro.
- source_word: תִּבְחַר
  choice: escolhes
  rationale: Preserva de modo direto a iniciativa divina expressa por בחר, sem introduzir terminologia teológica posterior como “eleges”.
- source_word: וּתְקָרֵב
  choice: e trazes para perto
  rationale: 'O hifil de קרב é causativo: Deus faz a pessoa aproximar-se. A formulação mantém essa força e soa mais natural do que “fazes aproximar”.'
- source_word: יִשְׁכֹּן
  choice: para que habite
  rationale: O imperfeito de terceira pessoa pode indicar o resultado ou propósito da escolha e aproximação. A oração final preserva essa relação sem eliminar a nuance indicada na nota.
- source_word: חֲצֵרֶיךָ
  choice: nos teus átrios
  rationale: No contexto do santuário, חצר designa os pátios ou átrios do templo. “Átrios” conserva a imagem cultual concreta e é reconhecível em português bíblico.
- source_word: נִשְׂבְּעָה
  choice: Seremos saciados
  rationale: A forma coortativa pode exprimir desejo, confiança ou expectativa resoluta. O futuro comunica aqui uma expectativa confiante e mantém a mudança do singular para a primeira pessoa do plural.
- source_word: בְּטוּב
  choice: com a bondade
  rationale: טוּב pode referir-se tanto à qualidade da bondade quanto aos bens e à abundância que dela procedem. A escolha preserva essa amplitude, explicitada em nota.
- source_word: בֵּיתֶךָ
  choice: da tua casa
  rationale: Em paralelo com átrios e templo, “casa” se refere concretamente ao santuário de Deus e conserva a relação genitiva do hebraico.
- source_word: קְדֹשׁ
  choice: com a santidade
  rationale: A forma pode ser entendida como referência à qualidade sagrada do templo ou ao que nele é santo. “Santidade” produz uma frase portuguesa inteligível, enquanto a ambiguidade é registrada em nota.
- source_word: הֵיכָלֶךָ
  choice: do teu templo
  rationale: Embora היכל também possa significar palácio, o contexto de culto e o paralelismo com casa e átrios favorecem claramente “templo”.
theological_decisions:
- issue: A escolha divina e a aproximação para o culto
  choice: Mantida a afirmação direta de que Deus escolhe e traz a pessoa para perto.
  alternative: Empregar linguagem técnica de eleição predestinária ou restringir a frase explicitamente à seleção ritual de sacerdotes.
  rationale: O hebraico atribui a iniciativa a Deus, mas não define neste versículo o alcance doutrinário ou a identidade institucional da pessoa escolhida. A tradução preserva essa tensão sem impor um sistema denominacional.
- issue: A linguagem concreta de acesso ao templo
  choice: Mantidas as imagens de átrios, casa e templo.
  alternative: Espiritualizar todas as referências como “presença” ou “morada”.
  rationale: O versículo está enraizado no culto de Israel. A formulação concreta preserva o cenário original e deixa eventuais aplicações teológicas surgirem do próprio texto.
- issue: A mudança de “aquele” para “nós”
  choice: Preservada a passagem do indivíduo escolhido para a confissão comunitária “seremos saciados”.
  alternative: Uniformizar todo o versículo no singular ou no plural.
  rationale: A mudança de pessoa está no texto hebraico e pode ser literária e teologicamente significativa; não deve ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Teu/tua” mantém coerência poética e proximidade reverente; “átrios” conserva a imagem arquitetônica do santuário sem paráfrase. A pontuação evidencia a bem-aventurança inicial e a resposta comunitária.
