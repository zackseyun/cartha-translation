  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: pt
  text: Para ti, o silêncio é louvor, ó Deus, em Sião, e a ti se cumprirá o voto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O louvor te aguarda em silêncio, ó Deus, em Sião»; ou: «A ti pertence o louvor silencioso, ó Deus, em Sião». A expressão hebraica é elíptica e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: silêncio
  rationale: O substantivo designa silêncio ou quietude. Mantê-lo como «silêncio» preserva a expressão poética marcante e evita transformá-lo numa paráfrase interpretativa.
- source_word: תְהִלָּה
  choice: louvor
  rationale: É o sentido comum do termo e, na oração nominal, forma com «silêncio» a ideia paradoxal de que o silêncio é louvor.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Para ti, o silêncio é louvor
  rationale: O hebraico é elíptico e não contém verbo expresso. Esta formulação mantém ambos os substantivos e preserva a ambiguidade e a tensão poética sem acrescentar «espera».
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui designa claramente o único Deus de Israel.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Reproduz de modo natural o valor locativo da preposição ב.
- source_word: יְשֻׁלַּם
  choice: se cumprirá
  rationale: O Pual de שלם indica que o voto será cumprido ou pago. «Cumprir um voto» é a combinação mais natural e amplamente inteligível em português, sem perder a ideia de entregar a Deus o que foi prometido.
- source_word: נֶדֶר
  choice: o voto
  rationale: O substantivo denota um voto feito a Deus. O artigo definido soa natural com a construção passiva e não limita o termo a uma oferta votiva.
theological_decisions:
- issue: Interpretação da frase elíptica לְךָ דֻמִיָּה תְהִלָּה
  choice: O próprio silêncio é apresentado como louvor dirigido a Deus.
  alternative: «O louvor te aguarda em silêncio, ó Deus, em Sião» ou «A ti pertence o louvor silencioso, ó Deus, em Sião».
  rationale: Como não há verbo expresso no hebraico, são possíveis várias relações entre «silêncio» e «louvor». A tradução principal preserva a tensão poética, enquanto a nota registra as principais leituras sem impor uma solução teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Conserva-se a formulação concisa e paradoxal do hebraico; «Sião» segue a forma bíblica consagrada, e «cumprir o voto» é idiomático sem apagar o sentido de prestar a Deus o que foi prometido.
