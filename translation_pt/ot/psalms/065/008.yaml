base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: pt
  text: Os que habitam nos confins da terra temem por causa dos teus sinais[a]; fazes a aurora e o anoitecer cantarem de alegria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficam tomados de temor diante dos teus sinais”. O verbo hebraico pode expressar medo, temor ou assombro reverente.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as saídas da manhã e da tarde”. A expressão poética pode referir-se à aurora e ao anoitecer, ou aos lugares e momentos de onde parecem surgir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: temem
  rationale: O verbo ירא pode expressar medo, temor ou reverente assombro. “Temem” preserva essa amplitude sem reduzir a reação a terror nem defini-la exclusivamente como reverência.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: os que habitam nos confins da terra
  rationale: A expressão designa os habitantes das regiões mais remotas. “Confins da terra” mantém a imagem das extremidades e comunica naturalmente o alcance universal.
- source_word: מֵאוֹתֹתֶיךָ
  choice: por causa dos teus sinais
  rationale: Depois de um verbo de temor, a preposição מִן pode indicar causa. A formulação deixa claro que os sinais de Deus provocam essa reação.
- source_word: אוֹתֹתֶיךָ
  choice: teus sinais
  rationale: אוֹת significa normalmente “sinal” e pode designar atos que revelam o poder divino. “Sinais” é mais direto que o interpretativo “maravilhas”.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: as manifestações da manhã e da tarde
  rationale: מוֹצָאֵי significa literalmente “saídas” ou “surgimentos”. A escolha conserva a imagem poética do aparecimento da manhã e da tarde sem a reduzir simplesmente a dois períodos do dia.
- source_word: תַּרְנִין
  choice: fazes ... exultarem
  rationale: A forma causativa de רנן indica fazer gritar, cantar ou exultar de alegria. “Fazes ... exultarem” mantém Deus como sujeito causador e transmite júbilo com dignidade poética.
theological_decisions:
- issue: Natureza da reação humana aos sinais de Deus
  choice: temem
  alternative: ficam maravilhados; ficam aterrorizados
  rationale: O hebraico admite medo, temor e assombro reverente. A tradução mantém essa tensão, sem determinar se a reação é terror ou reverência cultual.
- issue: Referente de מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: as manifestações da manhã e da tarde
  alternative: as saídas da manhã e da tarde; os lugares onde surgem a manhã e a tarde
  rationale: A expressão pode evocar tanto o surgimento temporal da manhã e da tarde quanto seus pontos extremos no horizonte. O texto principal conserva a imagem de aparecimento, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Confins” e “exultarem” preservam o registro poético sem recorrer a construções arcaicas. Os marcadores aparecem no texto em ordem de ocorrência.
