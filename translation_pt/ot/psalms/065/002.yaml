  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: pt
  text: 'Tu, que ouves a oração: toda a humanidade virá a ti.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «toda carne»; também pode ser traduzido por «todas as pessoas». É uma expressão poética hebraica para a humanidade em sua totalidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: tu que ouves
  rationale: 'O particípio qal funciona como designação vocativa de Deus. A oração relativa é natural em português e preserva o sentido contínuo ou característico: aquele que ouve.'
- source_word: תְּפִלָּה
  choice: a oração
  rationale: O singular é genérico e designa a oração como categoria, não uma oração específica.
- source_word: עָדֶיךָ
  choice: a ti
  rationale: A preposição com sufixo de segunda pessoa masculina singular indica movimento em direção ao destinatário; «a ti» combina naturalmente com «virá» e mantém o tom poético.
- source_word: כָּל בָּשָׂר
  choice: toda a humanidade
  rationale: Literalmente, «toda carne»; no contexto, a expressão poética abrange o conjunto dos seres humanos. A formulação no texto principal comunica o sentido com clareza em português moderno, enquanto a nota preserva a imagem hebraica.
- source_word: יָבֹאוּ
  choice: virá
  rationale: O imperfeito qal de terceira pessoa plural exprime aqui ação futura. Em português, o sujeito coletivo singular «toda a humanidade» pede «virá».
theological_decisions:
- issue: Alcance de כָּל בָּשָׂר
  choice: alcance humano universal, expresso por «toda a humanidade»
  alternative: «toda carne» ou «todas as pessoas»
  rationale: A expressão se refere amplamente aos seres humanos que vêm a Deus. «Toda a humanidade» não restringe esse alcance; a nota registra a metáfora original e as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla inteligibilidade internacional. O vocativo «Ó tu» conserva a invocação solene sem recorrer a linguagem arcaica excessiva.
