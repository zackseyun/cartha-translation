base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: pt
  text: Com feitos assombrosos, em retidão, tu nos respondes[a], ó Deus da nossa salvação, a confiança de todos os confins da terra e dos mares distantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com feitos assombrosos, em justiça, tu nos respondes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “mar”; o singular pode ter sentido coletivo aqui, enquanto o adjetivo correspondente está no plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: feitos assombrosos
  rationale: A forma substantivada, derivada de ירא, descreve atos que inspiram temor reverente ou espanto. “Feitos assombrosos” explicita naturalmente em português o substantivo implícito no hebraico.
- source_word: בְּצֶ֣דֶק
  choice: em retidão
  rationale: A preposição בְּ indica aqui o modo ou a esfera em que Deus responde. “Em retidão” preserva a dimensão moral de צֶדֶק sem excluir a possível nuance de justiça, registrada em nota.
- source_word: תַּ֭עֲנֵנוּ
  choice: tu nos respondes
  rationale: O verbo ענה no qal significa “responder”, e o sufixo exige a primeira pessoa do plural. A colocação pronominal escolhida é natural no português moderno e brasileiro.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: ó Deus da nossa salvação
  rationale: Mantém a construção genitiva do hebraico e o sentido amplo de יֶשַׁע como salvação ou livramento; “ó” marca o vocativo.
- source_word: מִבְטָ֥ח
  choice: aquele em quem confiam
  rationale: מִבְטָח designa aquilo ou aquele em que se deposita confiança. A formulação verbal evita a construção pouco natural “a confiança dos confins” sem transformar o termo em “refúgio” ou “esperança”.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: todos os confins da terra
  rationale: Expressão hebraica convencional para as regiões mais remotas do mundo; “confins da terra” é fiel, corrente e digna em português.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: e os mares distantes
  rationale: Embora יָם esteja no singular, o adjetivo plural רְחֹקִים favorece uma leitura coletiva ou distributiva. “Mares distantes” comunica naturalmente as regiões marítimas remotas; a forma singular é preservada em nota.
theological_decisions:
- issue: Amplitude semântica de צֶדֶק
  choice: retidão
  alternative: justiça
  rationale: “Retidão” destaca que Deus responde de modo moralmente reto e fiel, enquanto “justiça” continua sendo uma leitura legítima. A nota conserva a tensão lexical sem impor uma distinção doutrinária rígida.
- issue: Referente universal de מִבְטָח
  choice: aquele em quem confiam todos os confins da terra e os mares distantes
  alternative: a confiança de todos os confins da terra e do mar distante
  rationale: A tradução entende Deus como o objeto da confiança universal, conforme o valor lexical de מִבְטָח, sem acrescentar uma doutrina além da afirmação poética do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. A formulação mantém o paralelismo poético e explicita apenas o necessário para que מִבְטָח funcione idiomaticamente.
