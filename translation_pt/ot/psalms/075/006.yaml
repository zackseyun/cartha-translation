  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: pt
  text: Pois a elevação não vem do leste nem do oeste, nem do deserto.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exaltação” ou, em linguagem mais idiomática, “promoção”. A expressão hebraica é elíptica; o versículo seguinte esclarece o sentido ao dizer que Deus rebaixa um e eleva outro.
    reason: lexical_alternative
  - marker: b
    text: A última palavra hebraica também pode ser entendida como “montanhas”, resultando em algo como “nem do deserto de montanhas”. O contexto, porém, favorece o sentido de “elevação”.
    reason: alternative_reading
  - marker: c
    text: 'O hebraico coordena literalmente: “do leste e do oeste, e não do deserto”. Aqui a série negativa foi expressa com “nem” para maior naturalidade em português.'
    reason: translation_form
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém o encadeamento argumentativo do salmo.
- source_word: מִמּוֹצָא
  choice: do leste
  rationale: O substantivo designa literalmente a saída ou o nascer do sol e, por extensão, o leste; a forma direcional é natural em português.
- source_word: וּמִמַּעֲרָב
  choice: nem do oeste
  rationale: מַעֲרָב designa o pôr do sol ou o oeste. Na série negativa, “nem” exprime naturalmente a coordenação em português.
- source_word: מִמִּדְבַּר
  choice: do deserto
  rationale: מִדְבָּר pode indicar deserto ou região erma; “deserto” é claro, corrente e adequado ao contraste geográfico.
- source_word: הָרִים
  choice: vem a elevação
  rationale: No contexto, a forma é entendida em relação com רום, “erguer, elevar”, e não como o substantivo “montanhas”. O predicado “vem” explicita com naturalidade a elipse hebraica, enquanto “elevação” conserva a ligação com o ato de Deus elevar alguém no versículo seguinte.
theological_decisions:
- issue: Interpretação da forma final הָרִים numa oração hebraica elíptica e difícil
  choice: A elevação não vem de nenhuma direção ou fonte terrena.
  alternative: Ler הָרִים como “montanhas”, produzindo algo semelhante a “nem do deserto de montanhas”.
  rationale: O versículo seguinte declara que Deus rebaixa um e eleva outro, favorecendo aqui o sentido de elevação. A nota conserva a leitura nominal possível sem fazê-la dominar o texto.
- issue: Explicitação do predicado implícito
  choice: Empregar “que vem a elevação”.
  alternative: 'Traduzir de modo mais literal e abrupto: “não do leste... elevação”.'
  rationale: O hebraico é elíptico; a explicitação mínima produz português inteligível sem identificar indevidamente a elevação com sucesso político, promoção profissional ou outra aplicação específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem marcada da frase preserva parcialmente a progressão do hebraico, enquanto a construção “não é... que vem” torna explícita a elipse sem resolver além do necessário a tensão interpretativa.
