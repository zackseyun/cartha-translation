  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: pt
  text: Pois Deus é o juiz:[a] a um ele rebaixa, e a outro eleva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus julga”. O particípio hebraico pode ser entendido verbalmente ou como uma expressão predicativa semelhante a um substantivo.'
