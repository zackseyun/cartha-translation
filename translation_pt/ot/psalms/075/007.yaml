lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação anterior e mantém com naturalidade a conexão argumentativa em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto e a predicação no singular exigem a referência ao Deus de Israel no singular.
- source_word: שֹׁפֵט
  choice: é o juiz
  rationale: O particípio admite valor predicativo nominal, destacando o papel de Deus como juiz; a alternativa verbal é preservada em nota.
- source_word: זֶה ... וְזֶה
  choice: a um ... e a outro
  rationale: A repetição dos demonstrativos tem sentido distributivo; esta formulação é natural em português e preserva o contraste entre duas pessoas ou partes.
- source_word: יַשְׁפִּיל
  choice: rebaixa
  rationale: Expressa o causativo de tornar baixo ou humilhar e conserva o contraste vertical com 'eleva'.
- source_word: יָרִים
  choice: eleva
  rationale: Preserva o sentido causativo de erguer ou exaltar e forma um paralelo conciso com 'rebaixa'.
theological_decisions:
- issue: Função judicial divina em אֱלֹהִים שֹׁפֵט
  choice: Deus é o juiz
  alternative: Deus julga
  rationale: A construção hebraica permite nuance nominal ou verbal. O texto principal conserva a leitura nominal, que enfatiza o papel judicial de Deus, sem excluir a leitura verbal indicada em nota.
