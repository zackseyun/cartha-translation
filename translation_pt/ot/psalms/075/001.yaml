base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: pt
  text: Nós te damos graças, ó Deus; damos graças, pois o teu nome está perto[a]; contam as tuas maravilhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «O teu nome está perto» pode aludir à proximidade de Deus, à sua presença manifesta ou ao seu caráter revelado. A expressão idiomática hebraica foi preservada sem limitar a formulação a apenas um desses sentidos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «eles contam as tuas maravilhas» ou «proclamam os teus feitos maravilhosos». O hebraico emprega a terceira pessoa do plural sem indicar expressamente o sujeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: damos graças
  rationale: O hifil de ידה, neste contexto poético dirigido a Deus, expressa ação de graças e louvor. A repetição hebraica é mantida.
- source_word: לְּךָ אֱלֹהִים
  choice: te, ó Deus
  rationale: O pronome com preposição é expresso naturalmente pelo clítico «te», e אֱלֹהִים é entendido como vocativo. «Ó Deus» conserva o tom digno da oração sem soar arcaico.
- source_word: וְקָרוֹב
  choice: pois ... está perto
  rationale: Embora וְ possa ser traduzido simplesmente por «e», aqui a oração funciona naturalmente como fundamento da ação de graças. «Pois» explicita essa relação provável sem alterar o conteúdo da afirmação.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: Mantém-se o idioma hebraico, sem reduzi-lo interpretativamente a «presença», «fama» ou «caráter».
- source_word: סִפְּרוּ
  choice: contam
  rationale: A forma verbal é terceira pessoa do plural sem sujeito expresso. O português permite conservar essa indeterminação com o sujeito oculto, sem acrescentar «as pessoas» nem transformar a oração em passiva.
- source_word: נִפְלְאוֹתֶיךָ
  choice: as tuas maravilhas
  rationale: O substantivo designa atos extraordinários de Deus que despertam admiração. «Maravilhas» é natural, conciso e tradicionalmente inteligível em português.
theological_decisions:
- issue: Sentido de «o teu nome está perto»
  choice: Conservar literalmente o idioma «o teu nome está perto».
  alternative: «A tua presença está perto» ou «a tua fama está próxima».
  rationale: Nos Salmos, o «nome» de Deus pode envolver sua presença manifesta, seu caráter revelado e sua reputação. O hebraico não obriga a escolher apenas um desses sentidos; a formulação preserva sua riqueza e tensão teológica.
- issue: Sujeito de «contam»
  choice: Deixar o sujeito sem expressão, como no hebraico.
  alternative: «As pessoas contam», «eles contam» ou a passiva «são contadas».
  rationale: A terceira pessoa plural hebraica não identifica quem conta. O português admite sujeito oculto e, assim, preserva a indeterminação sem introduzir um referente nem mudar a voz verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta e o clítico «te» dão naturalidade; a repetição poética, o idioma «teu nome está perto» e o sujeito indeterminado de «contam» preservam aspectos essenciais do hebraico.
