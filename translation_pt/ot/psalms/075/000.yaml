lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos Salmos, o termo designa convencionalmente quem dirige a execução musical. “Ao regente” é conciso, natural e preserva a função litúrgico-musical sem especificar necessariamente um coro.
- source_word: אַל תַּשְׁחֵת
  choice: “Não destruas”
  rationale: A expressão é provavelmente o título de uma melodia ou uma instrução musical. As aspas assinalam essa função, enquanto “destruas” preserva o sentido direto do verbo שׁחת.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o rótulo convencional do gênero e permanece distinto do termo שִׁיר, que aparece em seguida.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A preposição לְ nos títulos pode indicar autoria, vínculo ou pertencimento a uma coleção; a formulação tradicional “de Asafe” mantém essa amplitude, esclarecida em nota.
- source_word: שִׁיר
  choice: Cântico
  rationale: Preserva o segundo rótulo de gênero do hebraico, sem fundi-lo com מִזְמוֹר, e soa digno e natural em um título litúrgico.
