  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: pt
  text: 'Ao regente: “Não destrua”.[a] Salmo de Asafe.[b] Cântico.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Possivelmente o nome de uma melodia ou uma instrução musical: “Não destrua”.'
    reason: cultural_note
  - marker: b
    text: A expressão “de Asafe” pode indicar autoria, associação ou pertencimento à coleção asafita.
