  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: pt
  text: A terra e todos os que nela habitam se desfazem[a]; eu mesmo firmei seus pilares[b]. Selá[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cambaleiam”, “se dissolvem” ou “são abalados”. A imagem hebraica é de instabilidade ou colapso.
    reason: lexical_alternative
  - marker: b
    text: Ou “estabeleci seus pilares”.
    reason: lexical_alternative
  - marker: c
    text: “Selá” é tradicionalmente transliterado; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: se desfazem
  rationale: O particípio de מוג retrata derretimento, dissolução ou colapso. “Se desfazem” preserva a imagem poética de perda de estabilidade sem reduzi-la a uma formulação abstrata.
- source_word: אֶרֶץ
  choice: a terra
  rationale: A referência a todos os seus habitantes e às suas colunas favorece o sentido cósmico e abrangente, não o de uma região específica.
- source_word: יֹשְׁבֶיהָ
  choice: todos os que nela habitam
  rationale: Conserva a força verbal do particípio de ישב e soa natural no português moderno.
- source_word: אָנֹכִי
  choice: eu mesmo
  rationale: Expressa a ênfase do pronome independente sem acrescentar a ideia mais forte de exclusividade.
- source_word: תִכַּנְתִּי
  choice: firmei
  rationale: No piel, כון pode significar estabelecer, firmar ou pôr em posição estável. “Firmei” comunica de modo conciso a ação estabilizadora no contexto das colunas.
- source_word: עַמּוּדֶיהָ
  choice: suas colunas
  rationale: Mantém literalmente a imagem cosmológica do texto hebraico. “Colunas” é claro e natural em português, além de evitar transformar a metáfora em explicação.
- source_word: סֶּלָה
  choice: Selá
  rationale: Como o sentido preciso do termo é incerto, conserva-se a transliteração tradicional adaptada à acentuação portuguesa.
theological_decisions:
- issue: Imagem cosmológica das colunas da terra
  choice: Preservar literalmente “suas colunas” como imagem poética antiga.
  alternative: suas fundações; seus sustentáculos
  rationale: O verso emprega essa imagem para expressar a ação estabilizadora de Deus. Mantê-la respeita o sentido textual sem reinterpretá-la segundo categorias científicas modernas.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A sintaxe direta segue o hebraico sem inserir uma conjunção temporal ausente. Os marcadores foram colocados imediatamente após os termos a que se referem.
