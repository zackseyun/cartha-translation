base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: pt
  text: 'Eu disse aos arrogantes: “Não se vangloriem”; e aos perversos: “Não levantem seu chifre[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chifre”. O chifre é uma metáfora de força, poder, posição elevada ou autoexaltação orgulhosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: O qal perfeito na primeira pessoa do singular é vertido naturalmente pelo pretérito perfeito, preservando o aspecto concluído do hebraico.
- source_word: הוֹלְלִים
  choice: aos arrogantes
  rationale: Neste contexto, o particípio designa pessoas que se gloriam ou agem com arrogância. “Arrogantes” é natural em português e mantém a ligação semântica com a ordem seguinte.
- source_word: אַל תָּהֹלּוּ
  choice: Não se vangloriem
  rationale: A construção com אַל expressa proibição. “Vangloriar-se” comunica diretamente a ação de gloriar-se com orgulho.
- source_word: רְשָׁעִים
  choice: aos perversos
  rationale: “Perversos” expressa a categoria moral de רְשָׁעִים no uso dos Salmos, sem restringi-la a uma acepção estritamente jurídica.
- source_word: אַל תָּרִימוּ
  choice: Não levantem
  rationale: Tradução direta do hifil com valor proibitivo, conservando o movimento ascendente da imagem hebraica.
- source_word: קָרֶן
  choice: a sua força
  rationale: Literalmente “chifre”, metáfora hebraica de força, poder ou exaltação orgulhosa. No português corrente, “levantar o chifre” pode produzir associações estranhas ou involuntariamente cômicas; a expressão metafórica é por isso comunicada no texto, e a imagem original é preservada em nota.
theological_decisions:
- issue: Força metafórica de קָרֶן (“chifre”)
  choice: Traduzir no texto como “a sua força”, com nota que registra a imagem literal e sua amplitude
  alternative: “Não levantem o seu chifre” ou “não ergam o seu orgulho”
  rationale: “Força” representa um sentido central da metáfora sem reduzi-la exclusivamente a orgulho. A nota conserva a imagem hebraica e reconhece que ela também pode sugerir poder e autoexaltação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético foi preservado. Empregou-se “sua” com referência inequívoca ao plural “perversos”; a nota retém a metáfora concreta do hebraico.
