  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: pt
  text: Pois, quando eu escolher o momento determinado[a], eu mesmo julgarei com retidão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quando eu tomar um tempo determinado». O verbo hebraico significa literalmente «tomar», e o substantivo designa um tempo marcado ou determinado.
    reason: lexical_alternative
  - marker: b
    text: Ou «com equidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior; a ideia temporal é expressa pela oração iniciada por «quando».
- source_word: אֶקַּח מוֹעֵד
  choice: quando eu determinar o momento
  rationale: A expressão combina o verbo «tomar» com «tempo determinado/designado». Em português, «determinar o momento» comunica naturalmente a ideia de selecionar ou fixar a ocasião, enquanto a nota preserva a forma mais literal e outra leitura possível.
- source_word: אֲנִי
  choice: eu mesmo
  rationale: O pronome independente é enfático, pois a forma verbal já indica a primeira pessoa; «eu mesmo» conserva essa ênfase.
- source_word: מֵישָׁרִים
  choice: com retidão
  rationale: O substantivo plural expressa retidão, equidade ou correção no exercício do juízo. «Com retidão» mantém a forma nominal e o sentido moral e judicial.
- source_word: אֶשְׁפֹּט
  choice: julgarei
  rationale: O verbo descreve ação judicial, e o futuro se ajusta à referência ao momento determinado.
theological_decisions:
- issue: Identidade do falante e reivindicação judicial
  choice: Manter a declaração divina em primeira pessoa sem inserir explicitamente «Deus» no versículo.
  alternative: Identificar o falante no próprio texto como Deus ou deixar a primeira pessoa inteiramente genérica.
  rationale: O contexto do salmo aponta para uma declaração de Deus, mas o hebraico deste versículo não nomeia o falante. A tradução conserva a voz soberana e judicial sem acrescentar uma identificação ausente da linha.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. «Momento» evita a combinação pouco idiomática «tempo determinado» no texto principal, enquanto a nota registra a formulação mais próxima da expressão hebraica.
