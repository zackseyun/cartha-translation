  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: pt
  text: Pois há um cálice na mão de Yahweh, e o vinho espuma, bem misturado; ele derrama o vinho do cálice, mas todos os perversos da terra certamente esgotarão e beberão as suas borras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bem misturado” também pode ser traduzido como “cheio de mistura”. A expressão hebraica descreve vinho preparado por mistura, possivelmente com especiarias. “Borras” são o sedimento no fundo do cálice; a imagem é que os perversos terão de consumi-lo por completo.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva o encadeamento argumentativo do salmo.
- source_word: כּוֹס
  choice: cálice
  rationale: Mantém a imagem concreta e tradicional do recipiente associado ao juízo divino, em registro poético digno.
- source_word: בְּיַד יְהוָה
  choice: na mão de Yahweh
  rationale: Preserva o idioma hebraico concreto de posse e controle, bem como o nome divino.
- source_word: חָמַר
  choice: espuma
  rationale: Expressa o vinho efervescente ou fermentado, uma imagem mais provável aqui do que a alternativa 'é tinto'.
- source_word: מָלֵא מֶסֶךְ
  choice: cheio de mistura aromática
  rationale: Comunica que o vinho foi preparado por mistura, possivelmente com especiarias, sem afirmar como certa a composição exata.
- source_word: וַיַּגֵּר מִזֶּה
  choice: ele o derrama
  rationale: Representa naturalmente o ato de verter do cálice; o pronome retoma o vinho ou conteúdo do recipiente sem tornar explícita uma referência ausente.
- source_word: אַךְ
  choice: mas ... certamente
  rationale: Preserva tanto a transição enfática quanto a certeza de que os perversos não escaparão do conteúdo restante.
- source_word: שְׁמָרֶיהָ
  choice: a borra
  rationale: Designa o sedimento depositado no fundo do vinho em linguagem portuguesa clara.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: sorverão até a borra e beberão
  rationale: Retém os dois verbos hebraicos e a ideia de extrair e consumir completamente o conteúdo do cálice.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome próprio representado pelo tetragrama; não o substitui por um título.
- issue: Imagem do cálice
  choice: Manter a metáfora sem acrescentar 'da ira' ou 'do juízo'
  alternative: cálice da ira
  rationale: O contexto indica juízo divino, mas o versículo apresenta isso por imagem e não emprega explicitamente esses substantivos.
- issue: Referente de 'ele'
  choice: Yahweh é o sujeito implícito de 'derrama'
  alternative: o cálice derrama
  rationale: A forma verbal masculina singular e o contexto tornam Yahweh o referente natural, sem necessidade de repeti-lo.
translation_notes:
  register: Português atual, poético e acessível, com sintaxe próxima do paralelismo hebraico. A formulação preserva a intensidade da cena e a ambiguidade quanto à composição exata da mistura, sem explicitar no texto principal que o cálice representa ira ou juízo.
