source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: pt
  text: E cortarei todos os chifres dos perversos[a], mas os chifres do justo serão exaltados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “chifres” é uma metáfora de força, poder ou posição elevada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E ... todos
  rationale: A conjunção liga o encerramento ao contexto anterior, e כָּל abrange a totalidade dos chifres dos perversos.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: chifres
  rationale: Mantém a imagem concreta e poética do hebraico, na qual o chifre representa força, poder ou posição elevada, em vez de reduzi-la a um único conceito abstrato.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O plural substantivado designa coletivamente pessoas moralmente perversas; a formulação é natural e clara em português.
- source_word: אֲגַדֵּעַ
  choice: cortarei
  rationale: O verbo גדע indica cortar ou decepar; “cortarei” comunica a remoção decisiva dos chifres sem tornar a expressão excessivamente gráfica.
- source_word: תְּרוֹמַמְנָה
  choice: serão exaltados
  rationale: O verbo רום expressa elevação ou exaltação. A forma portuguesa preserva o contraste entre o rebaixamento dos perversos e a elevação do justo.
- source_word: צַדִּיק
  choice: do justo
  rationale: Preserva o singular genérico do hebraico e o paralelo poético com a classe coletiva dos perversos.
theological_decisions:
- issue: A metáfora dos chifres como imagem de poder e honra
  choice: Conservar “chifres” no texto principal.
  alternative: “Cortarei todo o poder dos perversos, mas a força do justo será exaltada.”
  rationale: A imagem do chifre é um elemento estabelecido da poesia bíblica e pode abranger força, poder e posição honrosa. Mantê-la evita limitar indevidamente seu sentido.
- issue: O singular צַדִּיק em contraste com o plural רְשָׁעִים
  choice: Traduzir como “do justo”, no singular genérico.
  alternative: “dos justos”
  rationale: O singular hebraico pode representar a categoria do justo. Preservá-lo mantém a forma poética sem impedir a leitura coletiva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A metáfora hebraica central foi preservada e explicada em nota; “mas” explicita o contraste poético entre os dois membros do verso.
