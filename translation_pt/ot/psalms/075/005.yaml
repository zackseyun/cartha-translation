base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: pt
  text: Não levantem o seu chifre ao alto[a]; não falem com o pescoço altivo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o seu chifre”, metáfora de força, poder ou autoexaltação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não falem com pescoço insolente” ou “não falem de modo obstinado”. O hebraico preserva uma imagem corporal de orgulho desafiador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: A partícula negativa com o imperfeito expressa uma proibição direta, naturalmente vertida pelo imperativo negativo em português.
- source_word: תָּרִימוּ לַמָּרוֹם
  choice: ergam ao alto
  rationale: Preserva a imagem espacial e a ênfase de elevar-se, sem substituí-la por uma interpretação abstrata como 'exaltar'.
- source_word: קַרְנְכֶם
  choice: o seu poder
  rationale: Embora קֶרֶן signifique literalmente 'chifre', aqui funciona como metáfora de força, poder e autoexaltação. Em português corrente, 'erguer o seu chifre ao alto' seria opaco e poderia soar estranho; 'poder' comunica o sentido contextual, com a imagem original registrada em nota.
- source_word: תְּדַבְּרוּ
  choice: falem
  rationale: Equivalente comum e digno para o verbo hebraico de falar.
- source_word: בְצַוָּאר עָתָק
  choice: com arrogância, de pescoço erguido
  rationale: Expressa a arrogância ou insolência de עָתָק e conserva a metáfora corporal de צַוָּאר. A formulação portuguesa liga de modo natural a fala arrogante à postura de desafio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas plurais de terceira pessoa amplamente compreensíveis. A metáfora opaca do “chifre” é explicitada no texto como “poder”, enquanto a nota preserva a forma hebraica; a imagem corporal do pescoço erguido é mantida de maneira idiomática.
