source:
  edition: WLC
  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: pt
  text: Mas eu[a] anunciarei para sempre; cantarei louvores ao Deus de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eu anunciarei para sempre”. A conjunção hebraica pode ser traduzida como “e” ou, neste contexto, como “mas”, indicando contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente dá ênfase ao sujeito e, no contexto, pode indicar contraste. “Mas eu” expressa isso com naturalidade, sem ampliar o hebraico.
- source_word: אַגִּיד
  choice: anunciarei
  rationale: O hifil de נגד significa declarar ou dar a conhecer. “Anunciarei” conserva o sentido de manifestação pública e soa natural no registro poético.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão indica duração contínua ou ilimitada e, neste voto de louvor, “para sempre” é a formulação portuguesa mais clara e corrente.
- source_word: אֲזַמְּרָה
  choice: cantarei louvores
  rationale: O piel de זמר designa cantar ou fazer música em louvor. “Cantarei louvores” comunica tanto o aspecto musical quanto o devocional.
- source_word: לֵאלֹהֵי
  choice: ao Deus de
  rationale: A preposição ל marca aqui o destinatário do canto; “ao Deus de” é idiomático e semanticamente preciso em português.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome, preservando a designação pactual “Deus de Jacó”.
theological_decisions:
- issue: Contraste enfático do orador com os ímpios no contexto
  choice: Traduzir a abertura como “Mas eu”
  alternative: “E eu”
  rationale: O pronome independente enfatiza o orador, e o contexto favorece contraste entre seu louvor contínuo e o destino dos ímpios. Como a conjunção hebraica também pode ser aditiva, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem das duas declarações e o paralelismo poético do hebraico foram preservados; “cantarei louvores” evita o pouco natural “salmodiarei”.
