base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/008.yaml
  text: Let the rivers clap their hands[a]; let the mountains sing for joy together,
translation:
  language: pt
  text: Que os rios batam palmas; juntos, os montes cantem de alegria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “gritem de alegria”. O verbo hebraico pode indicar tanto um grito jubiloso como um canto de alegria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהָרוֹת
  choice: os rios
  rationale: O substantivo plural designa rios e preserva de modo direto a imagem da criação louvando a Deus.
- source_word: יִמְחֲאוּ כָף
  choice: batam palmas
  rationale: A expressão hebraica descreve o ato de bater a palma da mão; “bater palmas” é o equivalente idiomático natural em português e mantém a personificação poética.
- source_word: יַחַד
  choice: juntos
  rationale: O advérbio expressa ação conjunta. Sua posição antes de “os montes” torna clara em português a unidade do louvor sem alterar a referência.
- source_word: הָרִים
  choice: os montes
  rationale: “Montes” traduz naturalmente o plural hebraico e conserva a grandiosidade da imagem poética.
- source_word: יְרַנֵּנוּ
  choice: cantem de alegria
  rationale: O verbo pode indicar canto jubiloso ou grito de júbilo. “Cantem de alegria” é natural no paralelismo poético, enquanto a alternativa legítima é registrada em nota.
theological_decisions:
- issue: Personificação poética da criação no louvor
  choice: Manter diretamente os rios batendo palmas e os montes cantando
  alternative: Explicar a imagem como metáfora do louvor humano inspirado pela criação
  rationale: O hebraico apresenta rios e montes como participantes personificados do louvor cósmico. A tradução preserva essa imagem sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com construção exortativa (“Que...”) para representar naturalmente a força volitiva dos verbos. “Bater palmas” preserva o idioma hebraico em forma corrente no português brasileiro e amplamente compreensível.
