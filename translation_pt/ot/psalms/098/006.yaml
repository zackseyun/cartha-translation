  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: pt
  text: Com trombetas e ao som da trompa[a], aclamem diante do Rei, Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ao som do chifre de carneiro”. O hebraico שׁוֹפָר muitas vezes se refere especificamente a um chifre de carneiro usado como instrumento, distinto das trombetas mencionadas antes no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Com trombetas
  rationale: חֲצֹצְרוֹת designa trombetas, provavelmente instrumentos metálicos retos, distintos do שׁוֹפָר. A preposição בְּ é instrumental e se traduz naturalmente por “com”. Não se acrescenta “de prata”, pois essa especificação não aparece no texto.
- source_word: וְקוֹל שׁוֹפָר
  choice: e ao som da trompa
  rationale: קוֹל significa “som”, e שׁוֹפָר designa uma trompa feita de chifre, muitas vezes de carneiro. “Trompa” mantém a distinção em relação às “trombetas” e soa natural em português; a identificação mais específica é registrada em nota.
- source_word: הָרִיעוּ
  choice: aclamem
  rationale: O imperativo plural no hifil de רוע pede uma manifestação sonora forte e festiva. “Acl amem” comunica uma saudação pública e jubilosa dirigida ao Rei sem acrescentar explicitamente “de alegria”, ausente no verbo.
- source_word: לִפְנֵי
  choice: diante de
  rationale: לִפְנֵי expressa a ideia de estar perante alguém ou em sua presença. “Diante de” é conciso e idiomático.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: O substantivo definido significa “o rei”. A inicial maiúscula sinaliza seu uso como título divino, pois o nome seguinte identifica o Rei como Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado pelo nome próprio “Yahweh”, em vez de ser substituído por um título, preservando a distinção entre “o Rei” e o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o tetragrama. “Yahweh” representa o nome pessoal divino sem substituí-lo por “SENHOR”.
- issue: Relação entre הַמֶּלֶךְ e יְהוָה
  choice: 'Aposição: “o Rei, Yahweh”'
  alternative: “Yahweh, o Rei”
  rationale: A ordem hebraica identifica Yahweh como “o Rei”. A tradução conserva essa ordem e a força apositiva, sem transformar o nome em mero vocativo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Acl amem” foi escolhido para a ordem coletiva de aclamação festiva; a distinção entre “trombetas” e “trompa” reproduz a distinção lexical do hebraico.
