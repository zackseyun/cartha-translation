  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: pt
  text: Salmo. Cantem a Yahweh um cântico novo, pois ele fez maravilhas; sua mão direita e seu braço santo lhe trouxeram salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o salvaram” ou “lhe deram a vitória”. A expressão hebraica atribui à própria mão direita e ao braço santo de Yahweh a realização da salvação; no contexto, ela também pode denotar vitória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Reproduz de modo natural e tradicional o título hebraico.
- source_word: שִׁירוּ
  choice: Cantem
  rationale: O imperativo está no plural; a forma brasileira corrente comunica diretamente o chamado coletivo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Mantém a expressão hebraica e um registro poético digno e compreensível.
- source_word: נִפְלָאוֹת
  choice: maravilhas
  rationale: Expressa atos extraordinários e admiráveis de Deus sem restringir indevidamente o sentido.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: lhe deram a vitória
  rationale: Comunica idiomaticamente que o próprio poder de Yahweh alcançou salvação ou vitória para ele, preservando em nota a forma e a amplitude da expressão hebraica.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: sua mão direita e seu braço santo
  rationale: Conserva o paralelismo antropomórfico e a imagem da força divina do original.
theological_decisions:
- issue: A salvação é descrita como alcançada para o próprio Yahweh
  choice: lhe deram a vitória
  alternative: o salvaram; alcançaram salvação para ele
  rationale: O dativo לוֹ deve permanecer perceptível. A formulação evita sugerir que Yahweh precisasse ser resgatado e comunica o sentido provável de vitória conquistada pelo seu próprio poder, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural sobretudo no Brasil e compreensão internacional. O plural “Cantem” evita uma forma regionalmente marcada; “Yahweh” preserva explicitamente o nome divino.
