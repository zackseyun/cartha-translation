  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: pt
  text: 'Diante de Yahweh[a], pois ele vem[b] julgar a terra; julgará o mundo[c] com justiça, e os povos com equidade[d].


    [a] O hebraico traz YHWH, o nome pessoal de Deus; tradicionalmente traduzido como “o SENHOR”. “Diante de Yahweh” também pode ser entendido como “na presença de Yahweh”.


    [b] Ou: “está vindo”. A forma hebraica pode apresentar poeticamente uma ação iminente ou certa.


    [c] Ou: “o mundo habitado”.


    [d] Ou: “com retidão” ou “com imparcialidade”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz YHWH, o nome pessoal de Deus; tradicionalmente traduzido como “o SENHOR”. “Diante de Yahweh” também pode ser entendido como “na presença de Yahweh”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “está vindo”. A forma hebraica pode apresentar poeticamente uma ação iminente ou certa.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o mundo habitado”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “com retidão” ou “com imparcialidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: diante de
  rationale: A locução hebraica significa “diante de” ou “na presença de”. “Diante de” é natural, concisa e mantém o sentido espacial e relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo por um título; a convenção tradicional é indicada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a celebração descrita no contexto anterior e mantém clara a relação causal.
- source_word: בָא
  choice: vem
  rationale: A forma verbal, em contexto poético, pode apresentar a vinda como iminente ou certa. “Vem” conserva a vivacidade sem fixá-la estritamente no passado ou no futuro.
- source_word: לִשְׁפֹּט
  choice: julgar
  rationale: Mantém o sentido judicial central de שׁפט sem restringi-lo apenas a condenar, governar ou vindicar.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelismo com “mundo” e “povos” indica alcance universal, não apenas uma terra ou região específica.
- source_word: יִשְׁפֹּט
  choice: julgará
  rationale: O futuro comunica naturalmente a ação judicial esperada daquele que vem.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: É a forma portuguesa mais idiomática; a nuance de “mundo habitado” é preservada em nota.
- source_word: בְּצֶדֶק
  choice: com justiça
  rationale: O ב indica modo, e “com justiça” expressa de maneira clara a qualidade moral do julgamento divino.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva a referência plural a diferentes grupos humanos e o paralelismo poético.
- source_word: בְּמֵישָׁרִים
  choice: com equidade
  rationale: No contexto judicial, “equidade” comunica julgamento reto e imparcial, mantendo distinção estilística em relação a “justiça”.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto a substituição tradicional por “o SENHOR” é registrada em nota.
- issue: Amplitude do julgamento divino em שׁפט
  choice: julgar
  alternative: governar ou vindicar
  rationale: “Julgar” mantém conjuntamente as ideias possíveis de avaliação, responsabilização e estabelecimento da ordem justa, sem reduzir o ato a condenação nem a mera administração.
- issue: Valor temporal de בָא
  choice: vem
  alternative: está vindo
  rationale: A formulação conserva a tensão poética entre ação presente, iminente e certa, sem impor uma precisão temporal ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem poética e o paralelismo hebraico foram preservados sem produzir sintaxe artificial.
