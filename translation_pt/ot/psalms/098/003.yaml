reference: Psalms 98:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: pt
  text: Ele se lembrou do seu amor leal e da sua fidelidade para com a casa de Israel; todos os confins da terra viram a salvação do nosso Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o livramento do nosso Deus”; neste contexto dos Salmos, o hebraico também pode transmitir a ideia de uma ação salvadora vitoriosa.
    reason: Alternativa lexical para יְשׁוּעָה, preservando sua possível nuance de livramento ou vitória.
lexical_decisions:
- source_word: זָכַר
  choice: se lembrou
  rationale: O qal perfeito indica uma ação realizada. “Lembrou-se” preserva o sentido verbal simples sem sugerir que Deus anteriormente tivesse esquecido; no contexto, lembrar implica agir de acordo com seu compromisso.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד expressa amor firme e lealdade relacional, frequentemente em contexto de aliança. “Amor leal” é atual, claro e mais preciso do que apenas “misericórdia”.
- source_word: וֶאֱמוּנָתוֹ
  choice: e da sua fidelidade
  rationale: אֱמוּנָה, em paralelo com חֶסֶד, denota confiabilidade e fidelidade, não apenas verdade em sentido abstrato.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para com a casa de Israel
  rationale: A expressão “para com” comunica naturalmente a relação indicada por לְ, enquanto “casa de Israel” preserva a designação coletiva hebraica.
- source_word: רָאוּ
  choice: viram
  rationale: O qal perfeito é vertido pelo pretérito perfeito, adequado à declaração de que o ato salvador já se tornou visível.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: todos os confins da terra
  rationale: Expressão portuguesa consagrada e compreensível para as regiões mais distantes do mundo, preservando a imagem hebraica.
- source_word: אֵת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador acusativo hebraico não possui equivalente lexical em português; sua função aparece na sintaxe da oração.
- source_word: יְשׁוּעַת
  choice: a salvação
  rationale: יְשׁוּעָה abrange salvação e livramento, podendo incluir vitória. “Salvação” mantém a amplitude sem restringir o sentido a uma vitória militar.
- source_word: אֱלֹהֵינוּ
  choice: do nosso Deus
  rationale: Preserva a relação da cadeia construta יְשׁוּעַת אֱלֹהֵינוּ sem definir em excesso se a salvação pertence a Deus ou é realizada por ele.
theological_decisions:
- issue: Nuance pactual de חֶסֶד e אֱמוּנָה
  choice: “amor leal” e “fidelidade”
  alternative: “misericórdia” e “verdade”
  rationale: A dupla ressalta a confiabilidade relacional de Deus para com Israel. A tradução escolhida preserva essa textura sem linguagem arcaica nem imposição de uma formulação confessional específica.
- issue: Amplitude de יְשׁוּעַת אֱלֹהֵינוּ
  choice: “a salvação do nosso Deus”
  alternative: “o livramento do nosso Deus” ou “a vitória do nosso Deus”
  rationale: O hebraico admite o sentido amplo de ação salvadora e pode conter uma nuance de vitória. “Salvação” evita restringir indevidamente a referência, enquanto a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Casa de Israel” e “confins da terra” mantêm imagens bíblicas transparentes. O marcador [a] foi colocado junto de “salvação do nosso Deus”, expressão à qual a nota se refere.
