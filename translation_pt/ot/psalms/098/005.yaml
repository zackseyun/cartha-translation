  text: זַמְּר֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ֝/כִנּ֗וֹר וְ/ק֣וֹל זִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: pt
  text: Cantem louvores a Yahweh com a lira[a], com a lira e com o som do cântico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico kinnor, antigo instrumento de cordas; tradicionalmente traduzido por «harpa».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e com a voz da melodia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Cantem louvores
  rationale: O imperativo plural intensivo de זמר convoca o povo a louvar por meio de música. «Cantem louvores» conserva tanto o aspecto vocal quanto a orientação de louvor.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário do louvor, e o nome divino יהוה é transliterado como «Yahweh».
- source_word: בְּכִנּוֹר
  choice: com a lira
  rationale: כִּנּוֹר designa um antigo instrumento de cordas, mais precisamente identificado como lira do que pela tradução tradicional «harpa». A preposição ב tem sentido instrumental.
- source_word: בְּכִנּוֹר
  choice: com a lira
  rationale: A repetição do hebraico é mantida para preservar o paralelismo e a ênfase rítmica do verso.
- source_word: וְקוֹל זִמְרָה
  choice: e com o som do cântico
  rationale: קוֹל significa «som» ou «voz», e זִמְרָה pode indicar «cântico», «melodia» ou «música». A formulação conserva a imagem sonora e torna explícita, de modo natural em português, a relação instrumental com o chamado inicial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» preserva o nome divino pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com imperativo no plural. A repetição de «com a lira» reproduz deliberadamente a estrutura poética hebraica; «cântico» mantém um registro apropriado à poesia de louvor sem soar excessivamente arcaico.
