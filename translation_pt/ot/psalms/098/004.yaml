base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: pt
  text: Aclame Yahweh com júbilo, toda a terra; irrompa em canto de alegria e faça música.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Celebrem
  rationale: O imperativo hiphil de רוע pede uma aclamação jubilosa. “Celebrem” comunica naturalmente essa aclamação coletiva em português, embora explicite menos a ideia de grito.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da aclamação, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Embora a expressão diga literalmente “toda a terra”, a terra é personificada e convocada a louvar; a formulação explicita os habitantes sem restringir o alcance universal.
- source_word: פִּצְחוּ
  choice: irrompam
  rationale: פצח descreve o ato de romper ou explodir em expressão vocal e preserva a imagem poética de começar subitamente o louvor.
- source_word: וְרַנְּנוּ
  choice: em canto alegre
  rationale: O piel de רנן denota canto ou clamor jubiloso; “canto alegre” se ajusta à sequência poética.
- source_word: וְזַמֵּרוּ
  choice: façam música
  rationale: זמר em contexto de louvor pode abranger canto e execução musical; “façam música” preserva essa amplitude.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural e cadência poética. A formulação mantém o convite universal e distingue aclamação, canto jubiloso e música.
