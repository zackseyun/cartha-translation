  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: pt
  text: Ruja o mar e tudo o que o enche; o mundo e os que nele habitam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: Ruja
  rationale: O verbo רעם expressa um som forte, como rugido ou trovão. O imperfeito tem aqui valor volitivo no contexto de convocação ao louvor; “Ruja” comunica isso de modo natural e poético.
- source_word: הַיָּם
  choice: o mar
  rationale: Equivalente padrão e natural de יָם, adequado ao paralelismo poético.
- source_word: וּמְלֹאוֹ
  choice: e tudo o que o enche
  rationale: A expressão significa literalmente “e sua plenitude”; o sufixo masculino singular retoma “o mar”. A formulação escolhida transmite em português tudo o que há no mar sem perder a imagem de plenitude.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תֵּבֵל designa o mundo como terra ordenada e habitada. “O mundo” é conciso e natural, e a oração seguinte explicita seus habitantes.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: e os que nele habitam
  rationale: Preserva a força verbal do particípio, literalmente “os que habitam nela”, e mantém o estilo poético. Em português, “nele” concorda com “mundo”.
