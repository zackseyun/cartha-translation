id: PSA.98.1
reference: Psalms 98:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: pt
  text: Salmo. Cantem a Yahweh um cântico novo, pois ele fez maravilhas; sua mão direita e seu braço santo lhe deram a vitória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o salvaram” ou “realizaram salvação para ele”. A expressão hebraica indica que o próprio poder de Yahweh alcançou libertação ou vitória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Título ou indicação de gênero; “Salmo” é a forma consagrada, clara e natural em português.
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo qal no plural, preservado como ordem direta aos ouvintes, sem acrescentar a ideia de louvor que não está expressa no verbo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário do cântico; o nome divino é transliterado como “Yahweh”, conforme a orientação do projeto.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Expressão poética recorrente nos Salmos; “cântico” mantém o registro bíblico digno e permanece amplamente compreensível.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do imperativo e mantém fluidez poética em português.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: ele fez maravilhas
  rationale: Traduz de modo natural os atos extraordinários que despertam admiração, sem enfraquecer o caráter poético.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: lhe deram a vitória
  rationale: No contexto poético de ação divina, a expressão indica que o próprio poder de Yahweh realizou para ele salvação ou vitória. A formulação portuguesa é idiomática e conserva o resultado da ação, enquanto a nota registra a tradução mais literal.
- source_word: יְמִינוֹ
  choice: sua mão direita
  rationale: Preserva literalmente a imagem antropomórfica do poder e da ação divina.
- source_word: וּזְרוֹעַ קָדְשׁוֹ
  choice: e seu braço santo
  rationale: Mantém a imagem poética paralela à mão direita e traduz naturalmente a construção hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio no texto e segue a orientação fornecida para o projeto, sem substituir o nome por um título.
- issue: Sentido de הוֹשִׁיעָה לּוֹ aplicado à mão e ao braço de Yahweh
  choice: sua mão direita e seu braço santo lhe deram a vitória
  alternative: sua mão direita e seu braço santo o salvaram; sua mão direita e seu braço santo realizaram salvação para ele
  rationale: O hebraico admite uma expressão mais literal ligada a salvar, mas o contexto comunica que o próprio poder de Deus alcançou libertação ou vitória. A nota preserva a ambiguidade lexical e evita sugerir que Yahweh necessitasse ser resgatado por outro.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve elevação poética. O plural “Cantem” torna explícito o número do imperativo hebraico. A construção final mantém as imagens concretas da mão direita e do braço santo, e a nota conserva as alternativas legítimas de tradução.
