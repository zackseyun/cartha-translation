source:
  edition: WLC
  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: pt
  text: Yahweh deu a conhecer a sua salvação; diante dos olhos das nações[a], revelou a sua justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à vista das nações».
    reason: lexical_alternative
  - marker: b
    text: Ou «retidão». O termo hebraico pode indicar justiça, retidão ou ação vindicadora, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: הוֹדִיעַ
  choice: deu a conhecer
  rationale: O hifil de ידע tem sentido causativo, «fazer saber»; «deu a conhecer» é natural em português e conserva esse valor.
- source_word: יְשׁוּעָתוֹ
  choice: a sua salvação
  rationale: יְשׁוּעָה pode expressar salvação, livramento ou vitória; «salvação» mantém a amplitude do termo e se ajusta ao contexto de louvor.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem concreta da expressão hebraica, que também pode ser vertida de modo mais idiomático por «à vista de».
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se amplamente aos povos não israelitas; «as nações» evita a conotação mais especificamente neotestamentária de «os gentios».
- source_word: גִּלָּה
  choice: revelou
  rationale: O piel de גלה significa aqui revelar ou tornar manifesto e mantém o paralelismo com «deu a conhecer».
- source_word: צִדְקָתוֹ
  choice: a sua justiça
  rationale: צְדָקָה abrange justiça, retidão e, em certos contextos, ação vindicadora. «Justiça» é natural no contexto da ação salvadora de Yahweh sem limitar o sentido à justiça punitiva.
theological_decisions:
- issue: Sentido da justiça divina em contexto de salvação
  choice: a sua justiça
  alternative: a sua retidão; a sua ação vindicadora
  rationale: A formulação conserva a ligação hebraica entre a salvação e a manifestação pública da צְדָקָה de Yahweh. A nota registra a amplitude sem reduzir o termo a uma única teoria de justiça.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Deu a conhecer» mantém o aspecto verbal passado de forma idiomática; «diante dos olhos» conserva a vividez poética do hebraico.
