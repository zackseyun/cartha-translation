  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ֭/עֲבוּר דָּוִ֣ד עַבְדֶּ֑/ךָ אַל תָּ֝שֵׁ֗ב פְּנֵ֣י מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: pt
  text: Por amor de Davi, teu servo, não rejeites o teu ungido.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não faças voltar o rosto do teu ungido”.'
    reason: literal_rendering
  - marker: b
    text: “O teu ungido” também pode ser traduzido por “o teu Messias”, especialmente à luz do contexto davídico e messiânico do conjunto das Escrituras.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Por amor de
  rationale: Expressa de modo natural em português a ideia de apelo em consideração a alguém, aqui Davi, sem reduzir a expressão a uma causalidade meramente factual.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: No contexto régio e pactual, “servo” comunica adequadamente submissão e serviço a Deus; “escravo” daria destaque indevido à condição jurídica.
- source_word: אַל
  choice: não
  rationale: Introduz naturalmente em português a súplica negativa expressa pelo hebraico.
- source_word: תָּשֵׁב פְּנֵי
  choice: não rejeites
  rationale: A expressão hebraica é literalmente “não faças voltar o rosto de”, mas idiomaticamente pede que Deus não recuse nem rejeite o seu ungido. A imagem literal é preservada em nota.
- source_word: מְשִׁיחֶךָ
  choice: o teu ungido
  rationale: Traduz o substantivo hebraico sem restringi-lo antecipadamente nem ao rei histórico nem ao título messiânico plenamente desenvolvido, preservando sua ressonância régia e canônica.
theological_decisions:
- issue: Se מְשִׁיחֶךָ deve ser apresentado diretamente como título messiânico
  choice: o teu ungido
  alternative: o teu Messias
  rationale: No contexto imediato, a referência é ao governante davídico ungido. “Teu ungido” mantém esse sentido histórico e, ao mesmo tempo, deixa aberta a ressonância messiânica no contexto canônico; a alternativa é registrada em nota.
- issue: Se a expressão idiomática com “rosto” deve ser mantida no texto principal
  choice: não rejeites
  alternative: não faças voltar o rosto do teu ungido
  rationale: “Não rejeites” comunica com clareza o valor idiomático da súplica em português. Como a metáfora hebraica é teologicamente e poeticamente relevante, sua forma literal é oferecida em nota, sem fingir que a construção literal seria igualmente natural em português.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A segunda pessoa singular (“teu”, “rejeites”) preserva o tom tradicional da oração sem recorrer a formas excessivamente arcaicas. Os marcadores seguem imediatamente a expressão a que se referem.
