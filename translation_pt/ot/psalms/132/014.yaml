  text: זֹאת מְנוּחָתִ֥/י עֲדֵי עַ֑ד פֹּֽה אֵ֝שֵׁ֗ב כִּ֣י אִוִּתִֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: pt
  text: Este é o meu lugar de descanso para sempre; aqui habitarei, pois a desejei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desejei este lugar», tomando o sufixo feminino como referência ao lugar de descanso, e não a Sião personificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Este
  rationale: O demonstrativo feminino singular aponta para Sião ou para o lugar de descanso mencionado no contexto; em português, «Este» concorda naturalmente com «lugar».
- source_word: מְנוּחָתִי
  choice: o meu lugar de descanso
  rationale: Embora מְנוּחָה possa indicar «descanso», o advérbio locativo «aqui» favorece o sentido concreto de um lugar onde se repousa e permanece.
- source_word: עֲדֵי עַד
  choice: para sempre
  rationale: Expressão portuguesa corrente que transmite a duração perpétua do idioma hebraico.
- source_word: פֹּה
  choice: aqui
  rationale: Preserva de modo direto a força locativa e imediata do advérbio hebraico.
- source_word: אֵשֵׁב
  choice: habitarei
  rationale: Neste contexto de estabelecimento divino em Sião, ישׁב significa habitar ou permanecer estabelecido, não apenas sentar-se.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão da habitação divina no lugar.
- source_word: אִוִּתִיהָ
  choice: a desejei
  rationale: O verbo expressa desejo ou anseio. O pronome feminino «a» preserva a referência mais natural a Sião personificada, sem introduzir a ideia mais forte de escolha.
theological_decisions:
- issue: Referente e gênero do sufixo feminino singular em אִוִּתִיהָ
  choice: «a desejei», entendendo o objeto como Sião personificada
  alternative: «desejei este lugar», entendendo o sufixo como referência ao lugar de descanso
  rationale: O sufixo feminino aponta naturalmente para Sião, frequentemente personificada no feminino na poesia hebraica. A tradução principal conserva essa personificação, enquanto a nota registra a leitura locativa possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe poética concisa. «Habitarei» mantém o tom elevado do salmo sem soar arcaico; a ambiguidade do referente feminino é preservada por meio de nota.
