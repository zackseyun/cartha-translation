id: PSA.132.5
reference: Psalms 132:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַד אֶמְצָ֣א מָ֭קוֹם לַ/יהוָ֑ה מִ֝שְׁכָּנ֗וֹת לַ/אֲבִ֥יר יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/005.yaml
  text: until I find a place for Yahweh[a], a dwelling place for the Mighty One of Jacob.
translation:
  language: pt
  text: 'até que eu encontre um lugar para Yahweh,

    moradas[a] para o Poderoso de Jacó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma morada”; mais tradicionalmente, “tabernáculos”. O substantivo hebraico está no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Introduz o ponto final do juramento iniciado nos versículos anteriores e é a construção mais natural em português.
- source_word: אֶמְצָא
  choice: eu encontre
  rationale: O imperfeito qal na oração introduzida por “até que” indica a ação futura pretendida pelo falante; o subjuntivo é idiomático em português.
- source_word: מָקוֹם
  choice: um lugar
  rationale: Mantém o sentido amplo de um local destinado a Yahweh, sem especificá-lo indevidamente como templo ou santuário.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Representa a preposição ל e preserva o nome divino יהוה como nome próprio.
- source_word: מִשְׁכָּנוֹת
  choice: moradas
  rationale: Conserva o plural do substantivo hebraico e usa uma palavra atual e digna, menos tecnicamente carregada que “tabernáculos”.
- source_word: לַאֲבִיר
  choice: para o Poderoso
  rationale: Traduz o epíteto divino אֲבִיר, que denota aquele que é forte ou poderoso.
- source_word: יַעֲקֹב
  choice: de Jacó
  rationale: Reproduz naturalmente em português a relação construta do título “o Poderoso de Jacó”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva seu caráter de nome próprio sem substituí-lo por um título.
- issue: Número de מִשְׁכָּנוֹת
  choice: moradas, no plural
  alternative: uma morada
  rationale: A forma hebraica é plural. Embora o paralelismo com “um lugar” permita entendê-la coletivamente ou vertê-la como singular em português, manter o plural preserva a forma e a tensão do original.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. O paralelismo poético foi mantido em duas linhas; o plural incomum “moradas” conserva a forma hebraica e recebe nota explicativa.
