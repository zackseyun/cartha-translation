base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: pt
  text: Levanta-te, Yahweh, para o teu lugar de descanso[a], tu e a arca da tua força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o teu descanso”. O termo hebraico pode indicar tanto o descanso como o lugar de descanso; neste contexto, provavelmente se refere ao lugar onde Yahweh estabelece a sua presença.
    reason: lexical_alternative
  - marker: b
    text: Ou “a arca do teu poder” ou “a arca que representa o teu poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: O imperativo de קום é uma convocação dirigida a Yahweh para que se erga e aja ou tome o seu lugar. “Levanta-te” conserva o tom poético e litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לִמְנוּחָתֶךָ
  choice: e vem para o teu lugar de descanso
  rationale: A preposição לְ indica direção, e מְנוּחָה pode designar tanto descanso como lugar de descanso. “E vem” explicita em português natural o movimento implícito na convocação “levanta-te para”, sem alterar o destino expresso no hebraico.
- source_word: אַתָּה
  choice: tu
  rationale: Mantém o pronome independente e sua ênfase, além da coordenação explícita com a arca.
- source_word: וַאֲרוֹן
  choice: e a arca
  rationale: No contexto do santuário, אֲרוֹן designa a arca associada à presença de Yahweh.
- source_word: עֻזֶּךָ
  choice: da tua força
  rationale: Reproduz diretamente a construção genitiva hebraica, sem transformar a relação entre a arca e a força divina em uma explicação interpretativa.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome pessoal יהוה. A transliteração preserva esse nome e evita substituí-lo por um título.
- issue: Sentido de “arca da tua força”
  choice: Manter a expressão genitiva “a arca da tua força”
  alternative: a arca do teu poder; a arca que representa o teu poder
  rationale: A formulação hebraica é compacta e poética. Mantê-la preserva a possível associação da arca com a presença poderosa de Yahweh sem definir de modo excessivo como essa relação deve ser entendida.
translation_notes:
  register: Português moderno, claro e solene, com forma litúrgica concisa. O uso de “tu” acompanha a linguagem poética e permite conservar os pronomes possessivos singulares do hebraico. A inserção de “e vem” evita a construção pouco natural “levanta-te para” e torna explícito o movimento já sugerido pelo original.
