  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: pt
  text: Pois Yahweh escolheu Sião; desejou-a como morada para si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e mantém de modo natural a função explicativa do conectivo hebraico.
- source_word: בָחַר
  choice: escolheu
  rationale: Expressa diretamente o sentido de escolher ou selecionar; o pretérito perfeito é natural em português e não exclui a relevância contínua da escolha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּצִיּוֹן
  choice: Sião
  rationale: Com בחר, a preposição introduz aquilo que foi escolhido; em português, o objeto direto sem preposição é a formulação idiomática.
- source_word: אִוָּהּ
  choice: desejou-a
  rationale: Preserva o sentido de desejar e também o sufixo feminino que retoma Sião, sem transformar o verbo em mero sinônimo de escolher.
- source_word: לְמוֹשָׁב
  choice: para sua morada
  rationale: מוֹשָׁב designa lugar de habitação; 'morada' é conciso, digno e claro no contexto.
- source_word: לוֹ
  choice: sua
  rationale: No sintagma português, o possessivo comunica naturalmente que Sião seria a morada de Yahweh, correspondendo ao interesse reflexivo expresso por לוֹ.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração 'Yahweh' o preserva sem substituí-lo por um título.
- issue: Referência feminina a Sião
  choice: desejou-a
  alternative: desejou que fosse sua morada
  rationale: O sufixo hebraico é feminino e retoma Sião. A forma pronominal portuguesa conserva discretamente essa referência poética sem acrescentar personificação além do que o texto permite.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção é concisa e mantém o paralelismo poético entre a escolha de Sião e o desejo de Yahweh de tê-la como morada.
