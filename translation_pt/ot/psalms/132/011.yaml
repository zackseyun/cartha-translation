  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: pt
  text: 'Yahweh jurou a Davi um juramento seguro[a]; não voltará atrás dele: “Do fruto do teu ventre, colocarei um descendente[b] sobre o teu trono.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma promessa verdadeira” ou “a verdade”. O hebraico usa “verdade” para enfatizar a certeza do juramento.
    reason: lexical_alternative
  - marker: b
    text: Isto é, um dos descendentes de Davi. Compare 2 Samuel 7:12 e Atos 2:30 quanto ao uso pactual e, posteriormente, messiânico dessa promessa.
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal de שבע indica prestar juramento; o pretérito perfeito apresenta de modo natural a afirmação poético-histórica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֱמֶת
  choice: um juramento seguro
  rationale: Embora אֱמֶת signifique literalmente “verdade”, aqui enfatiza a veracidade e a certeza do juramento, em aposição à ideia verbal precedente.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: não voltará atrás
  rationale: שוב com מן expressa recuar ou retirar-se de algo. Em português, a expressão idiomática comunica a irrevogabilidade sem exigir a repetição do referente pronominal.
- source_word: מִפְּרִי בִטְנְךָ
  choice: Do fruto do seu ventre
  rationale: Preserva a imagem concreta hebraica para um descendente físico; a nota explicita o sentido sem apagar a metáfora.
- source_word: אָשִׁית
  choice: colocarei
  rationale: שׁית significa pôr ou colocar e, neste contexto, descreve a instalação régia.
- source_word: לְכִסֵּא לָךְ
  choice: no seu trono
  rationale: A combinação de לְכִסֵּא com לָךְ é naturalmente entendida, no contexto da promessa davídica, como colocação sobre o trono pertencente a Davi; evita o português pouco natural “num trono para você”.
theological_decisions:
- issue: Alcance messiânico e pactual da promessa feita a Davi
  choice: Traduzir a promessa no seu nível histórico-dinástico, como referente a um descendente físico de Davi, sem tornar explícito no texto principal o cumprimento messiânico posterior.
  alternative: Redigir o versículo como uma profecia diretamente messiânica.
  rationale: O texto afirma primeiramente o juramento de Yahweh a Davi acerca de sua descendência e de seu trono. A nota remete ao desenvolvimento canônico sem inserir no corpo do versículo uma identificação que o hebraico não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se “Yahweh” como nome próprio. “Seu” retoma Davi sem ambiguidade prática no contexto imediato; “um descendente” é acrescentado para tornar explícito em português o objeto elíptico de אָשִׁית, já implícito em “fruto do seu ventre”. Os marcadores seguem os trechos a que cada nota se refere.
