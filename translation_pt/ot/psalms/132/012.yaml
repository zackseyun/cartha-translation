source:
  edition: WLC
  text: אִֽם יִשְׁמְר֬וּ בָנֶ֨י/ךָ בְּרִיתִ/י֮ וְ/עֵדֹתִ֥/י ז֗וֹ אֲלַ֫מְּדֵ֥/ם גַּם בְּנֵי/הֶ֥ם עֲדֵי עַ֑ד יֵ֝שְׁב֗וּ לְ/כִסֵּא לָֽ/ךְ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: pt
  text: Se os seus filhos guardarem a minha aliança e os meus testemunhos[a], que eu lhes ensinarei, também os filhos deles se assentarão para sempre no seu trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os meus preceitos” ou “os meus estatutos”.
    reason: Alternativas lexicais para וְעֵדֹתַי; “testemunhos” preserva mais diretamente a particularidade do termo hebraico.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força de uma condição real, sem sugerir que seu cumprimento seja certo.
- source_word: יִשְׁמְרוּ
  choice: guardarem
  rationale: Com objetos relacionados à aliança, expressa observância fiel e é natural em português.
- source_word: בָנֶיךָ
  choice: os seus filhos
  rationale: O hebraico emprega o masculino plural e o contexto trata da sucessão dinástica.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Equivalente consagrado e claro para בְּרִית neste contexto.
- source_word: וְעֵדֹתַי
  choice: e os meus testemunhos
  rationale: Mantém a distinção lexical do termo hebraico, que designa estipulações divinas que dão testemunho da vontade de Deus.
- source_word: זוֹ אֲלַמְּדֵם
  choice: que eu lhes ensinarei
  rationale: A oração relativa liga os testemunhos ao ensino divino; o futuro se ajusta naturalmente à construção condicional.
- source_word: גַּם
  choice: também
  rationale: 'Expressa a força aditiva: além dos filhos mencionados, os filhos deles ocuparão o trono.'
- source_word: בְּנֵיהֶם
  choice: os filhos deles
  rationale: Preserva o masculino plural e a referência aos herdeiros da dinastia.
- source_word: עֲדֵי עַד
  choice: para sempre
  rationale: Equivalente idiomático da expressão hebraica de duração perpétua.
- source_word: יֵשְׁבוּ
  choice: se assentarão
  rationale: Com “trono”, conserva a imagem hebraica de sentar-se nele e comunica a ideia de reinar.
- source_word: לְכִסֵּא לָךְ
  choice: no seu trono
  rationale: Expressa de modo natural em português a ocupação do trono pertencente ao destinatário, Davi.
theological_decisions:
- issue: Condicionalidade da promessa davídica neste versículo
  choice: A permanência dos descendentes no trono é apresentada sob a condição explícita de os filhos de Davi guardarem a aliança e os testemunhos divinos.
  alternative: Entender a promessa como incondicional e a condição como apenas retórica ou temporária.
  rationale: A construção hebraica começa claramente com אִם, “se”. A tradução preserva essa condição e a tensão teológica do texto, sem harmonizá-la com outras formulações da promessa davídica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se assentarem no trono” conserva a imagem régia sem acrescentar explicitamente “reinar”. O pronome “seu” segue o tratamento corrente do contexto dirigido a Davi.
