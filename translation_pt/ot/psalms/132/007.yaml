  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: pt
  text: Vamos às suas moradas[a]; prostremo-nos diante do estrado de seus pés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entremos em suas moradas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “adoremos diante do estrado de seus pés”. O hebraico se refere mais literalmente ao ato de prostrar-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹאָה
  choice: Vamos
  rationale: O coortativo qal na primeira pessoa do plural expressa uma exortação conjunta. “Vamos” comunica naturalmente tanto a ideia de movimento quanto a força volitiva.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: aos seus lugares de habitação
  rationale: Preserva o plural hebraico מִשְׁכְּנוֹת e evita o caráter potencialmente técnico ou arcaico de “tabernáculos”. A preposição “a” expressa o movimento em direção aos lugares de habitação.
- source_word: נִשְׁתַּחֲוֶה
  choice: prostremo-nos
  rationale: Mantém a imagem física de inclinar-se ou prostrar-se em reverência, em vez de substituí-la diretamente pelo conceito mais amplo de adoração.
- source_word: לַהֲדֹם רַגְלָיו
  choice: diante do estrado de seus pés
  rationale: “Estrado de seus pés” reproduz com clareza a construção hebraica, enquanto “diante de” exprime naturalmente a posição ou direção do ato reverente.
theological_decisions:
- issue: Referente dos pronomes possessivos
  choice: Manter “seus” sem identificar explicitamente o referente
  alternative: Explicitar “do SENHOR” ou relacionar o referente especificamente à arca
  rationale: O contexto entrelaça a habitação do SENHOR, a arca e Sião. Como o hebraico emprega pronomes sem esclarecer o referente neste versículo, a tradução preserva essa tensão literária e teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural do texto hebraico foi preservado; “prostremo-nos” conserva a postura corporal reverente explicitada pelo verbo.
