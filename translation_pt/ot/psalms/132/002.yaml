  yaml_path: translation/ot/psalms/132/002.yaml
  text: who swore to Yahweh and vowed to the Mighty One of Jacob:[a]
translation:
  language: pt
  text: 'que jurou a Yahweh e fez um voto ao Poderoso de Jacó:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa cujo antecedente é Davi, mencionado no versículo anterior; “que” é natural em português.
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal de שׁבע significa “jurar” ou “prestar juramento”; “jurou” preserva de modo conciso a solenidade do ato.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica a quem o juramento foi feito, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: נָדַר
  choice: fez um voto
  rationale: נדר designa o ato de fazer um voto. A locução é mais natural em português do que o pouco corrente “votou” neste sentido.
- source_word: לַאֲבִיר
  choice: ao Poderoso
  rationale: אֲבִיר é um título divino que significa “Poderoso” ou “Forte”; “Poderoso” mantém o tom elevado.
- source_word: יַעֲקֹב
  choice: de Jacó
  rationale: Completa o título divino tradicional “o Poderoso de Jacó”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre juramento e voto
  choice: jurou ... e fez um voto
  alternative: jurou, isto é, fez um voto
  rationale: O paralelismo hebraico permite proximidade semântica, mas não exige que o segundo verbo seja tratado como mera explicação do primeiro; a coordenação preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com estrutura que mantém o paralelismo hebraico. O dois-pontos final foi preservado porque o pensamento continua no versículo seguinte.
