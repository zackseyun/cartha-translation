base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: pt
  text: Não entrarei na tenda da minha casa; não subirei ao leito do meu repouso—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega duas vezes a palavra “se” numa fórmula de juramento: literalmente, “Se eu entrar... se eu subir...”. No contexto, o sentido é: “Certamente não entrarei... não subirei...”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... אִם
  choice: não ... não
  rationale: No contexto do voto iniciado no versículo anterior, a repetição de אִם integra uma fórmula de juramento elíptica e autoinvocatória. Em português, a negação direta comunica naturalmente o compromisso solene, enquanto a nota preserva a forma hebraica literal.
- source_word: אָבֹא
  choice: entrarei
  rationale: O qal imperfeito na primeira pessoa do singular expressa a ação futura que o salmista se compromete a não realizar; “entrar” é natural com “tenda”.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: na tenda da minha casa
  rationale: Mantém as imagens concretas de אֹהֶל, “tenda”, e בַּיִת, “casa”, sem reduzir a expressão simplesmente a “lar” ou “quarto”.
- source_word: אֶעֱלֶה עַל
  choice: subirei ao
  rationale: Preserva o sentido espacial de עלה, “subir”, com a preposição direcional, numa formulação portuguesa concisa.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: ao leito onde me deito
  rationale: עֶרֶשׂ designa leito ou cama, e יְצוּעַ, formado a partir da ideia de deitar-se ou estender-se, indica o lugar de repouso. A formulação conserva a duplicação poética sem produzir a pouco natural expressão “leito da minha cama”.
theological_decisions:
- issue: Força da fórmula de juramento com אִם
  choice: 'Negação direta: “Não entrarei ... não subirei”'
  alternative: 'Forma literal condicionada: “Se eu entrar ... se eu subir”'
  rationale: O versículo depende do voto introduzido em Salmos 132:2. A negação direta transmite a força pragmática da fórmula sem completar de modo especulativo a imprecação omitida; a nota registra a ambiguidade formal do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Leito” sustenta o registro poético sem ser arcaico; “onde me deito” torna inteligível a relação entre os dois termos hebraicos próximos para lugar de dormir. O travessão final conserva a continuidade sintática e poética com o versículo seguinte.
