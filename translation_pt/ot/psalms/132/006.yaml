source:
  edition: WLC
  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: pt
  text: Vejam! Ouvimos falar dela em Efrata; nós a encontramos nos campos de Jaar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Interjeição de chamada de atenção, vertida de modo natural e direto no português moderno.
- source_word: שְׁמַעֲנוּהָ
  choice: Ouvimos falar dela
  rationale: O sufixo feminino singular é preservado por “dela”; a expressão evita definir explicitamente o referente, que permanece implícito no hebraico.
- source_word: בְאֶפְרָתָה
  choice: em Efrata
  rationale: Transliteração tradicional e reconhecível do topônimo אֶפְרָתָה.
- source_word: מְצָאנוּהָ
  choice: nós a encontramos
  rationale: Mantém o objeto feminino singular expresso pelo sufixo hebraico e explicita o sujeito apenas para dar equilíbrio poético.
- source_word: בִּשְׂדֵי־יָעַר
  choice: nos campos de Jaar
  rationale: Preserva a construção nominal e trata יָעַר como topônimo, em consonância com a evidência massorética e o paralelismo geográfico.
theological_decisions:
- issue: Referente dos sufixos femininos em שְׁמַעֲנוּהָ e מְצָאנוּהָ
  choice: Preservar o referente implícito com “dela” e “a”
  alternative: Identificá-lo expressamente como “a arca”
  rationale: Embora o contexto possa apontar para a arca, o versículo hebraico não nomeia o referente; explicitá-lo eliminaria uma ambiguidade textual genuína.
- issue: Interpretação de יָעַר
  choice: Jaar, como nome de lugar
  alternative: “bosque”, como substantivo comum
  rationale: A vocalização massorética e o paralelismo com Efrata favorecem aqui a leitura toponímica, sem excluir associações contextuais com Quiriate-Jearim.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A forma plural “Vejam!” reproduz a chamada pública de atenção e evita o tom arcaizante de “Eis”. O referente feminino continua deliberadamente não identificado.
