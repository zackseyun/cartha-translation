  text: א֭וֹיְבָי/ו אַלְבִּ֣ישׁ בֹּ֑שֶׁת וְ֝/עָלָ֗י/ו יָצִ֥יץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: pt
  text: Vestirei de vergonha os inimigos dele, mas sobre ele florescerá a sua coroa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu diadema brotará”. O verbo hebraico sugere brotar ou florescer, e o substantivo pode designar uma coroa real ou um diadema.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: os inimigos dele
  rationale: O substantivo plural com sufixo de terceira pessoa masculina singular significa naturalmente “os inimigos dele”; a forma evita possível ambiguidade de referência de “seus” em português.
- source_word: אַלְבִּישׁ
  choice: Vestirei
  rationale: O hifil de לבשׁ expressa fazer vestir ou revestir. “Vestirei” preserva a primeira pessoa explícita e a metáfora do hebraico.
- source_word: בֹּשֶׁת
  choice: de vergonha
  rationale: O substantivo denota vergonha ou desonra. A construção “vestir de vergonha” é clara, natural e mantém a imagem poética.
- source_word: וְעָלָיו
  choice: mas sobre ele
  rationale: A conjunção tem valor contrastivo entre o destino dos inimigos e o do rei; “sobre ele” conserva a imagem espacial ligada à coroa.
- source_word: יָצִיץ
  choice: florescerá
  rationale: O verbo evoca brotar ou florescer. “Florescerá” preserva essa imagem viva e também comunica prosperidade e continuidade régias.
- source_word: נִזְרוֹ
  choice: a sua coroa
  rationale: נֵזֶר pode designar diadema, coroa ou consagração. Neste salmo davídico, a referência régia favorece “coroa”, sem eliminar a alternativa lexical, registrada em nota.
theological_decisions:
- issue: Sentido régio de נִזְרוֹ no contexto davídico e de Sião
  choice: a sua coroa
  alternative: a sua consagração
  rationale: O contexto da promessa à dinastia de Davi sustenta a imagem de uma coroa real. A tradução não explicita uma identificação messiânica além do que o próprio versículo afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A metáfora de vestir de vergonha e a imagem botânica aplicada à coroa foram preservadas.
