  text: צֵ֭ידָ/הּ בָּרֵ֣ךְ אֲבָרֵ֑ךְ אֶ֝בְיוֹנֶ֗י/הָ אַשְׂבִּ֥יעַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/015.yaml
  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: pt
  text: Abençoarei abundantemente as provisões dela[a]; saciarei de pão os seus pobres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o alimento dela” ou “o seu sustento”; o termo hebraico pode referir-se ao suprimento de provisões de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵידָהּ
  choice: as provisões dela
  rationale: O substantivo צֵיד pode indicar provisão ou suprimento de alimento. No contexto de Sião, “provisões” comunica o abastecimento da cidade sem sugerir indevidamente a ideia de caça; o sufixo feminino singular retoma Sião.
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: Abençoarei abundantemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Abençoarei abundantemente” expressa essa ênfase em português natural e solene.
- source_word: אֶבְיוֹנֶיהָ
  choice: os seus pobres
  rationale: אֶבְיוֹן designa o pobre ou necessitado. “Os seus pobres” mantém o sentido socioeconômico e o vínculo do sufixo com Sião.
- source_word: אַשְׂבִּיעַ
  choice: saciarei
  rationale: O hifil de שׂבע significa fazer ficar saciado ou plenamente alimentado. “Saciarei” preserva de modo conciso a ideia de provisão suficiente.
- source_word: לָחֶם
  choice: de pão
  rationale: O hebraico menciona concretamente pão. A construção “saciar de pão” conserva essa imagem e é compreensível em português.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Os sufixos em “as provisões dela” e “os seus pobres” retomam Sião/Jerusalém.
  alternative: Referência mais geral ao lugar de habitação do SENHOR.
  rationale: Os sufixos femininos singulares retomam mais naturalmente Sião no contexto imediato de Salmos 132:13–14. A formulação conserva a personificação poética sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem poética foi mantida sem rigidez excessiva; “dela” evita a possível ambiguidade de “suas provisões”, e “abundantemente” transmite a intensificação hebraica.
