base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/004.yaml
  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: pt
  text: não darei sono aos meus olhos[a], nem sono às minhas pálpebras—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “Se eu der sono aos meus olhos, sono às minhas pálpebras”. Trata-se de uma fórmula de juramento com uma maldição implícita, cujo sentido é: “não darei...”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: não
  rationale: Nesta fórmula de juramento, אִם introduz uma imprecação elíptica, e não uma condição comum. A negação direta comunica naturalmente em português a força do voto, enquanto a nota preserva a forma hebraica.
- source_word: אֶתֵּן
  choice: darei
  rationale: נתן significa normalmente “dar”. Com a força negativa da fórmula de juramento, “não darei” preserva tanto o sentido resoluto como a imagem do hebraico.
- source_word: שְׁנַת
  choice: sono
  rationale: O substantivo denota sono; “dar sono aos meus olhos” mantém a construção e a imagem poética do original.
- source_word: לְעֵינַי
  choice: aos meus olhos
  rationale: A preposição ל marca aqui o objeto indireto de “dar”; “aos meus olhos” reproduz essa relação com naturalidade.
- source_word: לְעַפְעַפַּי
  choice: às minhas pálpebras
  rationale: עפעף designa as pálpebras. A tradução conserva o paralelismo corporal com “meus olhos”.
- source_word: תְּנוּמָה
  choice: descanso
  rationale: O termo indica sono leve ou sonolência. “Descanso” evita a repetição de “sono” e produz um paralelismo poético natural, sem perder a ideia de repouso adormecido.
theological_decisions: []
