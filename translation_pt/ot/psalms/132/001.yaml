  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: pt
  text: Cântico das Subidas.[a] Lembra-te, Yahweh, em favor de Davi, de toda a sua aflição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cântico de peregrinações”. O hebraico diz literalmente “Cântico das Subidas”; a referência exata da expressão é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas as suas dificuldades” ou “toda a sua humilhação”. O termo hebraico pode abranger sofrimento, adversidade e o estado de ser humilhado.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinações
  rationale: A expressão identifica a coleção dos cânticos ligados às subidas ou peregrinações. “Peregrinações” comunica em português corrente o provável contexto sem perder a ideia de subida a Jerusalém.
- source_word: זְכוֹר
  choice: Lembra-te
  rationale: Mantém a forma imperativa da oração dirigida a Deus e sua força de apelo para que ele tenha Davi em consideração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְדָוִד
  choice: em favor de Davi
  rationale: Expressa naturalmente o valor benefactivo ou referencial da preposição ל neste pedido; a formulação literal “para Davi” seria pouco clara em português.
- source_word: עֻנּוֹתוֹ
  choice: suas aflições
  rationale: Abrange sofrimento, dificuldades e humilhação sem restringir o termo a uma única espécie de experiência.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega o nome próprio divino; a transliteração o preserva explicitamente.
- issue: Natureza da experiência de Davi em עֻנּוֹתוֹ
  choice: todas as suas aflições
  alternative: todas as suas dificuldades / toda a sua humilhação
  rationale: “Aflições” preserva a amplitude sem decidir se estão em foco sofrimento, privações, humilhação ou esforço penoso.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Lembra-te” conserva o tom poético da oração; “em favor de Davi” evita a ambiguidade pouco natural de “para Davi”.
