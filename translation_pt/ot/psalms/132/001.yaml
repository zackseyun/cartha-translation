    rationale: O substantivo significa primariamente “subidas/ascensões”. Embora peregrinações possa refletir um possível enquadramento histórico, esse enquadramento não é explicitado pelo hebraico e deve ficar, quando necessário, em nota.
  - severity: low
    issue: O plural “suas aflições” afasta-se desnecessariamente do singular עֻנּוֹתוֹ.
    rationale: “Toda a sua aflição” reproduz de modo idiomático o singular hebraico após כָּל e ainda permite que a aflição seja entendida coletivamente.
