  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: pt
  text: 'Cântico das subidas.[a]


    Lembra-te, Javé, em favor de Davi, de todo o seu sofrimento.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cântico de peregrinação”. O termo hebraico significa literalmente “subidas”, mas seu sentido preciso neste título é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “de toda a sua aflição”, “de todas as suas dificuldades” ou “de toda a sua humilhação”. O termo hebraico pode abranger sofrimento, adversidade e a condição de ser abatido.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Mantém a designação tradicional desta coleção de salmos e o sentido concreto de מַעֲלוֹת, sem decidir se as subidas são geográficas, litúrgicas ou musicais.
- source_word: זְכוֹר
  choice: Lembra-te
  rationale: Reproduz o imperativo hebraico dirigido a Deus em linguagem portuguesa natural e solene.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: לְדָוִד
  choice: em favor de Davi
  rationale: Expressa o valor benefativo provável da preposição לְ neste pedido, evitando a possível leitura equivocada de que Deus deveria simplesmente recordar a pessoa de Davi.
- source_word: כָּל־עֻנּוֹתוֹ
  choice: todo o seu sofrimento
  rationale: Conserva o singular coletivo com כָּל e traduz עֻנּוֹתוֹ por um termo amplo que pode abranger aflição, adversidade e humilhação.
theological_decisions:
- issue: Sentido de לְדָוִד na petição
  choice: em favor de Davi
  alternative: a respeito de Davi / de Davi
  rationale: O benefativo se ajusta bem à oração, mas a formulação não especifica de que maneira a lembrança divina beneficiará Davi.
- issue: Natureza das מַעֲלוֹת
  choice: subidas
  alternative: peregrinações / degraus
  rationale: A tradução literal preserva a conhecida incerteza sobre a referência a peregrinações a Jerusalém, degraus ou algum uso litúrgico-musical.
translation_notes:
  register: Português atual, claro e reverente, com legibilidade brasileira e vocabulário amplamente compreensível. O título foi mantido em sua forma tradicional, e a petição conserva concisão poética sem suavizar a amplitude semântica do sofrimento de Davi.
