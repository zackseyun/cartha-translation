  text: שָׁ֤ם אַצְמִ֣יחַ קֶ֣רֶן לְ/דָוִ֑ד עָרַ֥כְתִּי נֵ֝֗ר לִ/מְשִׁיחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: pt
  text: Ali farei brotar um chifre para Davi[a]; preparei uma lâmpada para o meu ungido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «farei crescer um chifre para Davi». “Chifre” é uma imagem hebraica de força ou poder régio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para o meu Messias». O hebraico diz «meu ungido» e aqui se refere, em primeiro lugar, ao rei davídico, embora possa ter uma ressonância messiânica mais ampla.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: Retoma Sião/Jerusalém no contexto imediato e preserva a ênfase espacial com naturalidade em português.
- source_word: אַצְמִיחַ
  choice: farei brotar
  rationale: O hifil de צמח é causativo. A formulação preserva a metáfora vegetal sem recorrer ao mais interpretativo «levantarei».
- source_word: קֶרֶן
  choice: chifre
  rationale: Mantém a imagem concreta hebraica, que simboliza força e poder régio; a nota esclarece o sentido figurado.
- source_word: לְדָוִד
  choice: para Davi
  rationale: Reproduz de modo direto a preposição ל e permite que a ressonância da aliança davídica surja do contexto, sem acrescentar «linhagem».
- source_word: עָרַכְתִּי
  choice: preparei
  rationale: O perfeito qal de ערך pode significar dispor, pôr em ordem ou preparar. «Preparei» é natural com «lâmpada» e conserva o aspecto verbal do hebraico.
- source_word: נֵר
  choice: lâmpada
  rationale: Preserva o substantivo concreto e sua imagem de continuidade dinástica ou governo duradouro, sem substituí-lo pela interpretação «luz».
- source_word: לִמְשִׁיחִי
  choice: para o meu ungido
  rationale: Traduz o sentido lexical de מָשִׁיחַ e, no contexto imediato, designa o rei davídico, sem eliminar uma possível ressonância messiânica mais ampla.
theological_decisions:
- issue: Tradução de מְשִׁיחִי no contexto régio davídico
  choice: o meu ungido
  alternative: o meu Messias
  rationale: O referente imediato é o rei da linhagem de Davi como ungido do SENHOR. A tradução lexical evita impor ao texto o uso posterior de «Messias» como título, enquanto a nota preserva essa possível ressonância.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Conservam-se as imagens concretas «chifre» e «lâmpada»; as notas explicam a metáfora régia e a possível extensão messiânica sem resolver indevidamente a tensão do texto.
