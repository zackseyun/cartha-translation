  text: וְֽ֭/כֹהֲנֶי/הָ אַלְבִּ֣ישׁ יֶ֑שַׁע וַ֝/חֲסִידֶ֗י/הָ רַנֵּ֥ן יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: pt
  text: Vestirei os seus sacerdotes de salvação, e os seus fiéis exultarão de alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica intensifica o verbo: literalmente, «exultando, exultarão»; também pode ser traduzida por «gritarão de alegria» ou «cantarão de alegria».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: os seus sacerdotes
  rationale: O substantivo com sufixo feminino singular retoma Sião, personificada no contexto. Em português, «os seus sacerdotes» expressa naturalmente essa relação.
- source_word: אַלְבִּישׁ
  choice: Vestirei
  rationale: O hifil de לבשׁ significa «fazer vestir, vestir». A primeira pessoa do singular corresponde ao locutor divino e preserva a metáfora.
- source_word: יֶשַׁע
  choice: de salvação
  rationale: O termo abrange salvação, livramento e vitória. «Salvação» conserva a amplitude teológica e funciona naturalmente na metáfora de vestir alguém de algo.
- source_word: חֲסִידֶיהָ
  choice: os seus fiéis
  rationale: חסיד designa pessoas caracterizadas por lealdade, devoção e fidelidade à aliança. «Fiéis» é claro e atual, sem introduzir as possíveis conotações eclesiásticas de «santos».
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: exultarão de alegria
  rationale: A construção com infinitivo absoluto seguido do verbo finito intensifica uma manifestação vocal de alegria. «Exultarão de alegria» comunica essa ênfase de modo natural e digno.
theological_decisions:
- issue: Sentido de חֲסִידֶיהָ no contexto da aliança e do culto
  choice: os seus fiéis
  alternative: os seus santos; os que lhe são leais; os seus devotos
  rationale: A escolha preserva a ideia de lealdade e devoção próprias da aliança, evitando restringir o termo a uma categoria eclesiástica posterior.
- issue: Amplitude semântica de יֶשַׁע
  choice: salvação
  alternative: livramento; vitória
  rationale: «Salvação» mantém o sentido amplo do hebraico sem excluir as dimensões concretas de livramento e vitória.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a personificação feminina de Sião por meio de «seus», forma não marcada em português, e preserva-se a metáfora de vestir os sacerdotes de salvação.
