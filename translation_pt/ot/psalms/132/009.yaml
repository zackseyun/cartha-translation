  text: כֹּהֲנֶ֥י/ךָ יִלְבְּשׁוּ צֶ֑דֶק וַ/חֲסִידֶ֥י/ךָ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: pt
  text: Que os teus sacerdotes se vistam de justiça[a], e os teus fiéis exultem de alegria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O termo hebraico pode ter sentido tanto moral como judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “gritem de alegria” ou “cantem de alegria”. O verbo hebraico indica uma jubilosa expressão vocal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: os teus sacerdotes
  rationale: כֹּהֵן designa diretamente o sacerdote; a escolha preserva o contexto cultual e o sufixo de segunda pessoa do singular.
- source_word: יִלְבְּשׁוּ
  choice: se vistam
  rationale: Mantém de modo natural em português a metáfora concreta de vestir-se, em vez de reduzi-la a uma qualidade abstrata.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange retidão moral e justiça. “Justiça” é clara e idiomática, enquanto a nota preserva a alternativa “retidão”.
- source_word: וַחֲסִידֶיךָ
  choice: os teus fiéis
  rationale: חָסִיד descreve pessoas marcadas por lealdade e devoção; “fiéis” comunica isso sem impor conotações eclesiásticas posteriores de “santos”.
- source_word: יְרַנֵּנוּ
  choice: exultem de alegria
  rationale: O Piel de רנן indica manifestação vocal jubilosa. “Exultem de alegria” transmite a intensidade sem decidir indevidamente entre cantar e gritar.
theological_decisions:
- issue: Força volitiva dos verbos no imperfeito em contexto de oração
  choice: Que ... se vistam ... e ... exultem
  alternative: Os teus sacerdotes se vestirão ... e os teus fiéis exultarão
  rationale: No contexto, os imperfeitos expressam uma petição ou desejo, não mera previsão; a construção portuguesa com “Que” preserva essa força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural e paralelismo poético preservado. Os marcadores [a] e [b] aparecem no texto na posição correspondente.
