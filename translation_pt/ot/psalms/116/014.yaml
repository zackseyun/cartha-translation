  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: pt
  text: Cumprirei meus votos[a] a Yahweh, sim,[b] diante de todo o seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pagarei meus votos”. O verbo hebraico pode ter o sentido de “pagar”, isto é, levar a termo aquilo que foi prometido em voto.'
    reason: lexical_alternative
  - marker: b
    text: A partícula hebraica também pode ser entendida como “agora” ou “de fato”; aqui, “sim” expressa sua força enfática.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: meus votos
  rationale: O plural de נֶדֶר com sufixo de primeira pessoa singular significa naturalmente “meus votos”, isto é, as promessas solenes feitas pelo salmista.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ indica aquele a quem os votos devem ser cumpridos; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אֲשַׁלֵּם
  choice: cumprirei
  rationale: O piel de שׁלם pode significar pagar ou completar uma obrigação, especialmente um voto. “Cumprirei” expressa com naturalidade o sentido idiomático em português.
- source_word: נֶגְדָה
  choice: diante de
  rationale: A forma comunica presença ou cenário público. “Diante de” conserva a ideia de que o cumprimento ocorrerá perante testemunhas.
- source_word: נָא
  choice: sim
  rationale: Neste contexto poético, a partícula reforça a declaração. “Sim” preserva essa ênfase sem impor exclusivamente uma leitura temporal.
- source_word: לְכָל עַמּוֹ
  choice: todo o seu povo
  rationale: Ligada a נֶגְדָה, a expressão identifica o público diante do qual os votos serão cumpridos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega explicitamente o tetragrama. “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. O travessão destaca a partícula enfática sem eliminar a possível leitura alternativa indicada em nota.
