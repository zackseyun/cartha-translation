  yaml_path: translation/ot/psalms/116/006.yaml
  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: pt
  text: Yahweh guarda os simples[a]; eu estava enfraquecido[b], e ele me salvou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os inexperientes”, “os ingênuos” ou “os desprotegidos”. O hebraico se refere a pessoas simples ou pouco precavidas, não necessariamente a quem é moralmente insensato.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu estava abatido” ou “fui reduzido a uma condição humilde”. O hebraico pode descrever alguém debilitado, rebaixado ou reduzido.
    reason: lexical_alternative
  - marker: c
    text: Ou “me livrou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: protege
  rationale: O particípio de שׁמר expressa uma ação contínua de guardar, cuidar ou preservar. “Protege” comunica isso de modo claro e natural no contexto de livramento.
- source_word: פְּתָאיִם
  choice: os inexperientes
  rationale: O termo designa pessoas simples, ingênuas ou sem experiência, não necessariamente pessoas moralmente insensatas. “Os inexperientes” evita a possível conotação depreciativa de “os simplórios”.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso diretamente pelo Tetragrama no texto hebraico.
- source_word: דַּלּוֹתִי
  choice: eu estava enfraquecido
  rationale: A forma de דלל pode indicar estar reduzido, debilitado ou abatido. “Estava enfraquecido” preserva o sentido amplo sem limitá-lo à pobreza material.
- source_word: וְלִי
  choice: e ele me
  rationale: A construção com a preposição ל e o pronome de primeira pessoa é incorporada naturalmente à oração portuguesa, indicando que Yahweh agiu em favor do salmista.
- source_word: יְהוֹשִׁיעַ
  choice: salvou
  rationale: O hifil de ישׁע significa salvar ou livrar. “Salvou” é direto, pessoal e adequado ao contexto.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva essa identificação, enquanto “SENHOR” segue a tradição de substituí-lo por um título.
- issue: Condição dos פְּתָאיִם
  choice: inexperientes
  alternative: simples
  rationale: A escolha não atribui culpa moral nem virtude especial ao grupo; mantém a referência a pessoas sem experiência ou desprotegidas, conforme a amplitude lexical do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso do hebraico e evita tanto linguagem excessivamente arcaica quanto interpretações moralizantes.
