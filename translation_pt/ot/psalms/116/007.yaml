  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: pt
  text: Volte, minha alma, ao seu descanso, pois Yahweh tem sido generoso com você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tem feito o bem a você” ou “tem tratado você com generosidade”. O verbo hebraico pode significar tratar alguém ou retribuir-lhe; neste contexto, o sentido é positivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: Volte
  rationale: Imperativo qal feminino singular de שוב, dirigido à alma do salmista. “Volte” expressa naturalmente o retorno a uma condição anterior de repouso.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נפשׁ pode significar alma, vida ou o próprio ser. Neste autoendereçamento poético, “minha alma” preserva a força introspectiva e é natural em português.
- source_word: לִמְנוּחָיְכִי
  choice: ao seu descanso
  rationale: A preposição ל com מנוחה e sufixo de segunda pessoa feminina indica o destino do retorno. “Ao seu descanso” mantém de modo conciso a imagem de repouso seguro.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação. “Pois” liga naturalmente as duas orações e preserva o registro poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גָּמַל עָלָיְכִי
  choice: tem sido generoso com você
  rationale: גמל com על descreve como alguém trata outra pessoa e pode ter sentido positivo ou negativo. O contexto de ação de graças exige aqui o sentido benéfico; esta formulação é clara, natural e não reduz a expressão ao simples verbo “ser bom”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal em vez de o substituir por um título.
- issue: Sentido positivo de גָּמַל
  choice: tem sido generoso com você
  alternative: tem recompensado você; tem feito o bem a você
  rationale: O verbo pode descrever retribuição ou trato tanto favorável quanto desfavorável. O contexto imediato de gratidão indica benefício, mas a tradução evita impor a ideia mais específica de recompensa meritória.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O autoendereçamento poético foi preservado, assim como o nome divino e a metáfora do retorno ao descanso.
