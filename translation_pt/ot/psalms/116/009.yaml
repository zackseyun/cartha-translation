  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: pt
  text: Andarei diante de Yahweh nas terras dos vivos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Viverei diante de Yahweh na terra dos vivos”. A expressão hebraica “andar diante de” também pode indicar o modo de viver, e “terras” pode ser entendida de maneira mais geral como “terra” ou “domínio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: Andarei
  rationale: O hitpael imperfeito na primeira pessoa do singular de הלך pode indicar movimento futuro e também modo de viver. “Andarei” preserva a imagem concreta e deixa aberta a nuance existencial ou ética.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa tanto a posição perante alguém quanto a vida em sua presença, de modo natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאַרְצוֹת
  choice: nas terras
  rationale: Mantém o plural morfológico do hebraico. No contexto, pode designar regiões ou, de modo mais geral, o âmbito onde vivem os seres humanos.
- source_word: הַחַיִּים
  choice: dos viventes
  rationale: Reproduz o substantivo plural “os que vivem” e conserva o caráter poético da expressão hebraica.
theological_decisions:
- issue: Sobrevivência física ou conduta de vida na presença de Deus
  choice: Manter a imagem “andarei diante de Yahweh”
  alternative: “Viverei diante de Yahweh na terra dos vivos”
  rationale: O hebraico permite ouvir tanto a continuação da vida após o livramento quanto uma vida conduzida na presença de Deus. A formulação escolhida não elimina essa tensão.
- issue: Plural de בְּאַרְצוֹת na expressão sobre os vivos
  choice: “nas terras dos viventes”
  alternative: “na terra dos vivos”
  rationale: O plural é a forma textual do WLC, embora a expressão possa referir-se coletivamente ao mundo ou domínio dos vivos; a nota registra a alternativa idiomática singular.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira e alcance internacional. “Viventes” foi preferido a “vivos” no texto principal para conservar a forma substantivada e a solenidade poética, enquanto a alternativa mais tradicional aparece na nota.
