  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: pt
  text: Os laços da morte me cercaram, e as angústias do Sheol[a] me encontraram; encontrei aflição e tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a sepultura” ou “o mundo dos mortos”. Hebraico: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: me cercaram
  rationale: O verbo descreve algo que rodeia ou fecha o cerco. “Me cercaram” conserva a imagem concreta e soa natural em português.
- source_word: חֶבְלֵי מָוֶת
  choice: os laços da morte
  rationale: חֶבֶל pode designar corda ou laço. “Laços da morte” mantém a metáfora da força aprisionadora da morte e corresponde ao registro poético corrente em português.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: e as angústias do Sheol
  rationale: מֵצַר expressa estreiteza, aperto ou aflição. “Angústias” comunica de modo natural a pressão opressiva associada ao Sheol e preserva o plural.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico, que pode indicar a sepultura ou o mundo dos mortos, sem reduzi-lo antecipadamente a uma única interpretação.
- source_word: מְצָאוּנִי
  choice: me encontraram
  rationale: A tradução literal preserva a repetição poética com אֶמְצָא, traduzido na oração seguinte por “encontrei”.
- source_word: צָרָה
  choice: aflição
  rationale: צָרָה indica aflição, angústia ou adversidade. “Aflição” é clara, concisa e adequada ao paralelismo com “tristeza”.
- source_word: וְיָגוֹן
  choice: e tristeza
  rationale: יָגוֹן denota tristeza ou pesar. “Tristeza” é compreensível, digna e não intensifica indevidamente o termo.
- source_word: אֶמְצָא
  choice: encontrei
  rationale: 'Repete a mesma raiz de מְצָאוּנִי e, assim, mantém o jogo verbal hebraico: as angústias “me encontraram”; eu “encontrei” aflição e tristeza.'
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: “Sheol” preserva a amplitude cosmológica e teológica do termo hebraico, sem restringi-lo a uma sepultura individual nem definir além do texto a condição dos mortos.
translation_notes:
  register: Português moderno, poético e acessível, com paralelismo compacto. A repetição “me encontraram; encontrei” foi mantida deliberadamente para refletir o recurso verbal do hebraico.
