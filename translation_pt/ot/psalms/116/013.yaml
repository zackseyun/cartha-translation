id: PSA.116.13
reference: Psalms 116:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/013.yaml
  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: pt
  text: Erguerei o cálice das salvações[a] e invocarei o nome de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “salvações” ou “livramentos”, no plural; talvez um plural intensivo ou poético.'
    reason: alternativa lexical e nuance de número
lexical_decisions:
- source_word: כּוֹס
  choice: cálice
  rationale: Designa um recipiente para beber. “Cálice” preserva com naturalidade, em português bíblico atual, a imagem poética de erguer uma bebida em ação de graças; aqui não pretende impor um sentido litúrgico técnico.
- source_word: יְשׁוּעוֹת
  choice: salvações
  rationale: Mantém o plural morfológico do hebraico e permite que a expressão evoque os diversos atos salvadores de Deus, sem excluir a possibilidade de um plural poético ou intensivo.
- source_word: אֶשָּׂא
  choice: erguerei
  rationale: O verbo נשׂא pode significar levantar, erguer ou carregar. Com “cálice”, “erguerei” expressa de modo natural o gesto poético pretendido.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: e invocarei o nome
  rationale: A construção קרא בשם é uma expressão de invocação. “Invocarei o nome” comunica diretamente esse sentido em português, sem a rigidez de uma tradução palavra por palavra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva como nome e evita substituí-lo silenciosamente por um título.
- issue: Número de יְשׁוּעוֹת
  choice: salvações
  alternative: salvação; livramentos
  rationale: O plural hebraico foi preservado no texto para conservar sua forma e possível referência a repetidos atos de resgate. A nota registra que ele também pode funcionar poeticamente ou com valor intensivo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Erguerei” e “invocarei” mantêm a concisão poética. O plural incomum “salvações” é deliberadamente preservado e explicado em nota.
