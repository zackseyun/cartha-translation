  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: pt
  text: Eu amo[a], porque o SENHOR ouve a minha voz, as minhas súplicas por misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não expressa o objeto de «amo». Também pode ser entendido como «Amo o SENHOR, porque ele ouve» ou «Amo o fato de que o SENHOR ouve».
    reason: Preservar a ambiguidade sintática de אָהַבְתִּי כִּי sem impor uma única interpretação.
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Eu amo
  rationale: O verbo aparece sem objeto expresso. A formulação conserva essa abertura, em vez de inserir silenciosamente “o SENHOR” ou transformar a oração seguinte de modo inequívoco no objeto do amor.
- source_word: יִשְׁמַע
  choice: ouve
  rationale: 'Embora a forma hebraica seja imperfeita, no contexto expressa ação habitual ou característica: o SENHOR atende a voz do salmista.'
- source_word: תַּחֲנוּנָי
  choice: minhas súplicas por misericórdia
  rationale: O termo designa pedidos insistentes de favor, graça ou compaixão; a expressão comunica tanto a súplica quanto seu caráter de apelo misericordioso.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Emprega a convenção portuguesa amplamente reconhecida para o nome divino, em versaletes tipográficos representados aqui por maiúsculas.
theological_decisions:
- issue: Objeto não expresso de “amo”
  choice: Manter “Eu amo” sem objeto explícito e registrar a ambiguidade em nota
  alternative: “Amo o SENHOR” ou “Amo que o SENHOR ouve”
  rationale: 'O hebraico não declara gramaticalmente o objeto. As duas leituras são possíveis: o salmista pode afirmar amor pelo SENHOR e apresentar a razão, ou amar o fato de que o SENHOR o ouve. Preservar a elipse evita decidir uma tensão legítima do texto.'
translation_notes:
  register: Português moderno, claro e reverente. A repetição possessiva (“minha voz, minhas súplicas”) acompanha o paralelismo compacto do hebraico; a vírgula permite que o segundo elemento esclareça o primeiro sem tornar a relação excessivamente explícita.
