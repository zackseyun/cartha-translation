  text: חַנּ֣וּן יְהֹוָ֣ה וְ/צַדִּ֑יק וֵ֖/אלֹהֵ֣י/נוּ מְרַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: pt
  text: Yahweh é bondoso e justo; o nosso Deus é compassivo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַנּוּן
  choice: bondoso
  rationale: Como predicativo, descreve a disposição favorável e generosa de Yahweh. “Bondoso” é natural e claro em português moderno, sem reduzir o termo à simples cordialidade.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico e preserva sua função de nome pessoal da aliança.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa retidão moral e justiça; “justo” é a correspondência mais natural e abrangente em português neste contexto de louvor.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Preserva o sufixo da primeira pessoa do plural e sua dimensão de confissão comunitária.
- source_word: מְרַחֵם
  choice: é compassivo
  rationale: O particípio de רחם caracteriza Deus como alguém que manifesta compaixão de modo constante; a construção predicativa é natural e conserva esse valor caracterizador.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “SENHOR” é uma tradição reverencial e “Jeová” uma forma portuguesa histórica, mas nenhuma delas reproduz tão diretamente a forma indicada pela evidência hebraica.
- issue: Relação entre צַדִּיק e מְרַחֵם
  choice: manter lado a lado “justo” e “compassivo”
  alternative: harmonizar um atributo com o outro por paráfrase
  rationale: O verso afirma simultaneamente a justiça e a compaixão de Deus. A tradução conserva essa tensão teológica positiva sem explicar ou subordinar um atributo ao outro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe concisa que acompanha o paralelismo hebraico. O artigo em “o nosso Deus” soa natural em português brasileiro e não altera o sentido do construto hebraico.
