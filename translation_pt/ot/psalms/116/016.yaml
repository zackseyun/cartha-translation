reference: Psalms 116:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: pt
  text: Por favor, Yahweh, pois eu sou teu servo[a]; sou teu servo, filho da tua serva[b]. Soltaste as minhas amarras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teu escravo”; o termo hebraico pode indicar serviço sob sujeição, mas aqui expressa naturalmente a pertença devotada a Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filho da tua serva”. A expressão pode enfatizar uma condição de serviço recebida desde o nascimento.
    reason: literal_rendering
  - marker: c
    text: Ou “libertaste-me”, de modo mais interpretativo; a imagem hebraica é a de soltar as amarras.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: Por favor
  rationale: Partícula de súplica insistente. “Por favor” comunica o apelo com linguagem atual, sem acrescentar um verbo ausente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Preserva a relação explicativa ou causal entre o apelo e a declaração de que o salmista pertence a Yahweh, embora o termo também possa ter valor enfático neste contexto.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: teu servo
  rationale: “Servo” expressa naturalmente a humilde pertença e o serviço dedicado a Deus; a possível nuance mais forte de sujeição é registrada em nota.
- source_word: בֶּן אֲמָתֶךָ
  choice: filho da tua serva
  rationale: Reproduz de modo claro e conciso a expressão genealógica hebraica, incluindo a referência feminina de אמה.
- source_word: פִּתַּחְתָּ
  choice: Soltaste
  rationale: Embora o verbo tenha o sentido básico de “abrir”, junto de “amarras” indica desfazer ou soltar aquilo que prendia.
- source_word: לְמוֹסֵרָי
  choice: as minhas amarras
  rationale: “Amarras” conserva a imagem concreta de restrições que são soltas e soa natural em português contemporâneo.
theological_decisions:
- issue: Termo que descreve a condição do salmista diante de Deus
  choice: servo
  alternative: escravo
  rationale: O contexto destaca pertença humilde e serviço devotado. “Servo” comunica isso adequadamente sem eliminar a nuance de sujeição, indicada em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: A forma escolhida preserva explicitamente o nome próprio do texto hebraico, em vez de substituí-lo por “Senhor”.
- issue: Força de כִּי depois da súplica
  choice: pois
  alternative: sim; de fato
  rationale: A leitura explicativa é possível e preserva a tensão da frase, cujo pedido não contém verbo expresso. A alternativa enfática também é gramaticalmente possível.
translation_notes:
  register: Português atual, digno e direto, com formas compreensíveis tanto no Brasil como em outros contextos lusófonos. A repetição de “sou teu servo” foi mantida por seu valor poético e enfático. A construção inicial conserva a súplica sem suprir silenciosamente um pedido que não aparece no hebraico.
