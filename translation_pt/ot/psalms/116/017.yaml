  text: לְֽ/ךָ אֶ֭זְבַּח זֶ֣בַח תּוֹדָ֑ה וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: pt
  text: A ti oferecerei um sacrifício de gratidão e invocarei o nome de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente substituído por “o SENHOR”. “Yahweh” e “Jeová” são formas de representar o nome.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ
  choice: A ti
  rationale: A preposição לְ com o sufixo de segunda pessoa masculina singular indica o destinatário do sacrifício; “A ti” mantém a referência direta a Deus e soa digna e natural.
- source_word: אֶזְבַּח
  choice: oferecerei
  rationale: Embora o verbo זבח possa significar literalmente sacrificar, no contexto cultual “oferecerei” comunica de modo natural a ação sacrificial, explicitada pelo objeto seguinte.
- source_word: זֶבַח תּוֹדָה
  choice: um sacrifício de gratidão
  rationale: A expressão construta designa um sacrifício de ação de graças. “Sacrifício de gratidão” preserva tanto o elemento sacrificial quanto o sentido de agradecimento, em linguagem corrente.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: e invocarei o nome de
  rationale: A construção קרא בשם é uma expressão idiomática para invocar ou clamar pelo nome de alguém; “invocarei o nome de” transmite com clareza o sentido devocional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz o nome divino YHWH. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o Tetragrama. A forma “Yahweh” preserva sua função de nome próprio; a nota registra a tradição de substituí-lo por “SENHOR” e a alternativa “Jeová” sem impor uma interpretação denominacional.
- issue: Sentido de זֶבַח תּוֹדָה
  choice: sacrifício de gratidão
  alternative: oferta de ação de graças
  rationale: A opção escolhida conserva explicitamente a linguagem sacrificial e o caráter de agradecimento, sem reduzir a expressão a louvor verbal nem especificar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A colocação “A ti” mantém a ênfase inicial do hebraico; “invocarei” expressa de forma concisa o idioma hebraico קרא בשם. O marcador [a] foi colocado imediatamente após o nome divino, ao qual a nota se refere.
