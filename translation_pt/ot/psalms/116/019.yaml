  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: pt
  text: nos átrios[a] da casa de Yahweh, em teu meio, Jerusalém. Louvem Yah[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos pátios”.'
