    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: nos átrios
  rationale: O plural חֲצֵרוֹת designa os espaços cercados do complexo do templo. “Átrios” conserva a referência cultual e é uma expressão bíblica reconhecível em português, enquanto “pátios” é uma alternativa mais cotidiana.
- source_word: בֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Mantém a expressão hebraica literal “casa de YHWH”, que neste contexto se refere ao templo, sem substituir a metáfora por uma explicação interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּתוֹכֵכִי
  choice: no meio de ti
  rationale: Preserva a segunda pessoa feminina singular, pois Jerusalém é diretamente interpelada e personificada. A formulação é clara e digna em português.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Emprega a forma tradicional e corrente do nome próprio em português.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz o imperativo plural הַלְלוּ e conserva יָהּ como “Yah”, a forma abreviada do nome divino que está na origem da expressão “Aleluia”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” conserva o nome pessoal, sem substituí-lo pelo título tradicional “SENHOR” nem adotar a forma híbrida “Jeová”.
- issue: Tradução de יָהּ na aclamação final
  choice: Yah
  alternative: SENHOR; Aleluia
  rationale: יָהּ é a forma curta do nome divino. “Louvem a Yah” torna transparentes tanto o imperativo quanto o nome, preservando a relação com a expressão hebraica que deu origem a “Aleluia”.
- issue: Pessoa gramatical na referência a Jerusalém
  choice: no meio de ti
  alternative: em seu meio; dentro de você
  rationale: A forma hebraica é feminina singular e trata Jerusalém como interlocutora. A tradução mantém essa personificação sem explicar ou eliminar a tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cultual acessível. “No meio de ti” preserva a interpelação poética a Jerusalém; “átrios” mantém o contexto do templo sem recorrer a linguagem excessivamente arcaica.
