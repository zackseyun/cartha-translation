  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: pt
  text: 'Então invoquei o nome do SENHOR: “Por favor, SENHOR, salva a minha vida!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Então invoquei o nome do SENHOR
  rationale: A expressão idiomática קרא בשם significa invocar ou chamar pelo nome. O valor narrativo do imperfeito é bem expresso pelo passado em português; “Então” preserva a progressão do contexto. A forma tradicional “SENHOR” representa o nome divino יהוה com ampla legibilidade.
- source_word: אָנָּה
  choice: Por favor
  rationale: Partícula de súplica enfática, aqui traduzida de modo natural e reverente.
- source_word: מַלְּטָה נַפְשִׁי
  choice: salva a minha vida
  rationale: O imperativo intensivo pede livramento ou resgate. נֶפֶשׁ neste contexto designa a própria vida ou pessoa, não necessariamente uma “alma” separável; “salva a minha vida” comunica o sentido com clareza.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida sem acrescentar uma vocalização ao texto consonantal; as maiúsculas distinguem o nome divino.
- issue: Sentido de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma
  rationale: No pedido de livramento da morte, o termo se refere naturalmente à vida do salmista. A tradução evita impor uma leitura antropológica dualista que o hebraico não exige.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para leitores brasileiros e compreensão ampla no mundo lusófono. A súplica mantém concisão e urgência.
