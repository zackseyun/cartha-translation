base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: pt
  text: O que devolverei a Yahweh por todos os benefícios que ele me concedeu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que retribuirei a Yahweh por tudo o que ele fez por mim?” O termo hebraico pode indicar benefício, retribuição ou modo de tratar alguém; neste contexto de ação de graças, tem sentido positivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: O que
  rationale: Traduz diretamente o pronome interrogativo e introduz com naturalidade a pergunta do salmista.
- source_word: אָשִׁיב
  choice: darei em retribuição
  rationale: O hifil de שוב tem o sentido básico de fazer voltar ou devolver. Aqui indica a resposta do salmista à bondade divina; esta formulação preserva a ideia de reciprocidade sem sugerir que seja possível quitar uma dívida com Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário, e o nome divino יהוה é transliterado como Yahweh.
- source_word: כָּל תַּגְמוּלוֹהִי
  choice: todos os benefícios que me concedeu
  rationale: תַּגְמוּל pode designar retribuição, trato ou benefício. No contexto de ação de graças, refere-se aos atos benéficos de Yahweh; a oração relativa produz português claro e explicita a relação indicada pelo sufixo possessivo.
- source_word: עָלָי
  choice: me
  rationale: Com תַּגְמוּל, על indica que os atos ou benefícios de Yahweh recaíram sobre o salmista. Em português, o pronome em 'me concedeu' expressa isso naturalmente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Possibilidade de retribuir a bondade divina
  choice: darei em retribuição
  alternative: devolverei; pagarei
  rationale: A pergunta exprime a resposta agradecida do salmista, mas o hebraico não exige a noção estrita de pagamento integral. Evita-se, portanto, resolver a tensão como se os benefícios divinos pudessem ser quitados.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. 'Dar em retribuição' comunica a reciprocidade presente no verbo sem o tom comercial mais forte de 'pagar'. O nome Yahweh segue a decisão terminológica indicada.
