  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: pt
  text: Preciosa aos olhos de Yahweh é a morte dos que lhe são fiéis[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Custosa aos olhos de Yahweh é a morte dos que lhe são fiéis.”'
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que lhe são fiéis” também pode ser traduzida por “seus santos” ou “seus devotos”; o hebraico refere-se aos que demonstram lealdade a Deus no âmbito da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: Preciosa
  rationale: O adjetivo pode significar algo precioso, valioso ou custoso. “Preciosa” preserva o sentido lexical e tradicional, comunicando o grande valor ou peso dessa morte para Yahweh sem sugerir que ele se alegra com a morte.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém de modo natural em português a metáfora hebraica que expressa avaliação segundo a perspectiva de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַמָּוְתָה
  choice: a morte
  rationale: Reflete o substantivo hebraico com artigo; a terminação adicional não altera materialmente o sentido neste contexto.
- source_word: לַחֲסִידָיו
  choice: dos que lhe são fiéis
  rationale: חָסִיד designa pessoas caracterizadas por lealdade, piedade e dedicação fiel no âmbito da aliança. A formulação é clara em português moderno e evita possíveis conotações eclesiásticas posteriores de “santos”.
theological_decisions:
- issue: O sentido da morte dos fiéis diante de Deus
  choice: A morte dos fiéis é preciosa e de grande significado aos olhos de Yahweh, sem implicar prazer na morte.
  alternative: A morte dos seus fiéis custa caro a Yahweh ou tem grande peso diante dele.
  rationale: יָקָר admite tanto a ideia de preciosidade quanto a de alto custo. O texto principal preserva a formulação tradicional, enquanto a nota mantém aberta a nuance de custo, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase conserva a ênfase poética do hebraico, e as notas registram as alternativas lexicais relevantes.
