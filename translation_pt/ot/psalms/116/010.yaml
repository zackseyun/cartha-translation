  text: הֶ֭אֱמַנְתִּי כִּ֣י אֲדַבֵּ֑ר אֲ֝נִ֗י עָנִ֥יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: pt
  text: 'Cri, por isso falei: “Estou muito aflito”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois falei”; a partícula hebraica כִּי pode indicar relações diferentes, como consequência, explicação ou causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Outra leitura possível: “Cri mesmo quando disse: ‘Estava muito aflito’”. A sintaxe hebraica é condensada e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: Cri
  rationale: O hifil de אמן expressa crer ou confiar. “Cri” é direto, natural e mantém a formulação tradicional sem acrescentar um objeto ausente no hebraico.
- source_word: כִּי
  choice: por isso
  rationale: A partícula é semanticamente flexível. Aqui, “por isso” apresenta a fala como decorrência da fé, mas outras relações sintáticas legítimas são preservadas nas notas.
- source_word: אֲדַבֵּר
  choice: falei
  rationale: Embora a forma seja imperfeita, o contexto poético permite referência passada; “falei” se articula naturalmente com “cri” e com a recepção antiga do versículo.
- source_word: אֲנִי
  choice: eu, expresso na forma verbal “estou”
  rationale: O pronome independente dá ênfase ao sujeito. Em português, essa ênfase pode ser sustentada pela oração direta completa sem exigir um “eu” separado, que soaria menos natural aqui.
- source_word: עָנִיתִי
  choice: estou aflito
  rationale: O verbo descreve aflição ou abatimento. O presente funciona naturalmente como conteúdo da fala citada, embora o perfeito hebraico também admita “estava aflito” ou “fui muito afligido”.
- source_word: מְאֹד
  choice: muito
  rationale: Advérbio de intensidade; “muito” é claro, atual e idiomático em português.
theological_decisions:
- issue: Relação sintática entre fé e fala
  choice: 'A fé conduz à fala, e a última oração é apresentada como o conteúdo falado: “Cri, por isso falei: ‘Estou muito aflito’.”'
  alternative: '“Cri, pois falei: ‘Estava muito aflito’” ou “Cri mesmo quando disse: ‘Estou muito aflito’.”'
  rationale: A sintaxe hebraica é condensada, e כִּי comporta mais de uma relação. O texto principal oferece uma leitura fluente e bem atestada, enquanto as notas preservam a ambiguidade real sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cri” conserva a concisão poética; “muito aflito” é natural e mantém o sentido de sofrimento. As duas notas registram, sem eliminar, a ambiguidade lexical e sintática do hebraico.
