  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: pt
  text: Cumprirei meus votos a Yahweh, na presença de todo o seu povo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pagarei meus votos a Yahweh».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «diante de todo o seu povo». A partícula נָא provavelmente acrescenta ênfase poética; o sentido é cumprir os votos publicamente, à vista da comunidade reunida para adorar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: meus votos
  rationale: O plural נְדָרַי, com sufixo de primeira pessoa, significa naturalmente «meus votos»; «ofertas votivas» especificaria mais do que o hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca aquele a quem os votos serão cumpridos, e o nome divino יהוה é transliterado como «Yahweh».
- source_word: אֲשַׁלֵּם
  choice: cumprirei
  rationale: O piel de שׁלם, no contexto de votos, significa pagar ou cumprir. «Cumprirei» é natural em português e evita sugerir uma transação exclusivamente monetária.
- source_word: נֶגְדָה־נָּא
  choice: na presença de
  rationale: נֶגֶד indica estar diante de alguém ou em sua presença. נָא provavelmente acrescenta ênfase poética, sem exigir aqui uma tradução temporal distinta.
- source_word: לְכָל עַמּוֹ
  choice: de todo o seu povo
  rationale: Completa naturalmente a expressão «na presença de» e preserva a referência do sufixo a Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; «Yahweh» preserva o nome divino e segue a decisão editorial indicada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo conciso do hebraico e a ambiguidade lexical de אֲשַׁלֵּם por meio de nota.
