    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Eu
  rationale: Mantém o pronome de primeira pessoa expresso no hebraico, preservando sua ênfase.
- source_word: אָמַרְתִּי
  choice: disse
  rationale: Equivalente corrente e natural do verbo comum de fala, adequado ao tom reflexivo do salmo.
- source_word: בְחָפְזִי
  choice: em meu desespero
  rationale: A expressão descreve uma condição de perturbação urgente, que pode envolver afobação, alarme ou pânico. “Desespero” comunica com naturalidade a intensidade emocional do contexto, sem limitar o sentido à pressa física.
- source_word: כָּל הָאָדָם
  choice: Todo ser humano
  rationale: Reproduz o alcance universal da construção com כָּל e entende אָדָם em sentido coletivo e genérico, com linguagem portuguesa clara e inclusiva.
- source_word: כֹּזֵב
  choice: é mentiroso
  rationale: Preserva a força predicativa do particípio e seu juízo contundente sobre quem se caracteriza pela falsidade.
theological_decisions:
- issue: Alcance de כָּל הָאָדָם
  choice: Todo ser humano
  alternative: Todo homem
  rationale: A expressão hebraica é genericamente coletiva e abrange a humanidade; a tradução evita restringi-la ao sexo masculino, sem reduzir sua universalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter abrupto e proverbial da declaração, enquanto as notas preservam a amplitude semântica e as alternativas formais do hebraico.
