translation:
  language: pt
  text: 'Eu disse, na minha afobação[a]: “Todo ser humano é mentiroso.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na minha pressa” ou “no meu pânico”. O hebraico pode indicar pressa agitada, alarme ou pânico.'
