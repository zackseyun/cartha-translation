  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: pt
  text: Pois livraste a minha alma[a] da morte, os meus olhos das lágrimas e os meus pés de tropeçar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha vida”. O hebraico néfesh pode designar a alma, a vida ou a própria pessoa.
    reason: lexical_alternative
  - marker: b
    text: Lit. “o meu pé de tropeço”; o singular hebraico pode ter sentido representativo, e o substantivo também pode indicar uma queda.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento do louvor no contexto e conserva de modo natural a força explicativa da conjunção hebraica.
- source_word: חִלַּצְתָּ
  choice: livraste
  rationale: O piel de חלץ expressa resgate ou libertação de um perigo. “Livraste” é claro, digno e rege por elipse os três elementos da sequência poética.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. “A minha alma” preserva a amplitude antropológica e poética do hebraico, enquanto a nota registra a alternativa contextual “a minha vida”.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: Traduz diretamente a preposição e o substantivo, indicando libertação para longe da morte.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: os meus olhos das lágrimas
  rationale: Mantém a concisão e o paralelismo do original. O plural “lágrimas” é idiomático em português para o singular coletivo hebraico.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: os meus pés de tropeçar
  rationale: Expressa em português natural a preservação do tropeço ou da queda. O singular hebraico “meu pé” tem sentido representativo, para o qual o plural é idiomático em português.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי
  choice: a minha alma
  alternative: a minha vida; a mim
  rationale: A poesia não limita necessariamente נֶפֶשׁ à vida física. “A minha alma” conserva a amplitude e a ressonância teológico-poética do termo sem negar que o livramento inclui a preservação da vida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A segunda pessoa singular preserva o discurso direto a Deus e o paralelismo compacto do verso.
