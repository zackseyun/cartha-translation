lexical_decisions:
- source_word: כִּי
  choice: Porque
  rationale: Introduz a causa do amor declarado no versículo anterior e expressa com clareza a relação causal.
- source_word: הִטָּה
  choice: inclinou
  rationale: Preserva a metáfora hebraica de voltar ou inclinar o ouvido para escutar atentamente.
- source_word: אָזְנוֹ לִי
  choice: inclinou para mim o seu ouvido
  rationale: Mantém o singular concreto 'ouvido' e a direção indicada pela preposição, numa formulação digna e compreensível em português.
- source_word: וּבְיָמַי
  choice: enquanto eu viver
  rationale: A expressão literalmente 'em meus dias' indica, no contexto, a duração da vida do salmista; a formulação escolhida comunica naturalmente esse valor temporal.
- source_word: אֶקְרָא
  choice: eu o invocarei
  rationale: Em contexto de oração, קרא denota chamar ou invocar o SENHOR. O pronome retoma naturalmente Deus, embora o objeto esteja implícito no hebraico.
