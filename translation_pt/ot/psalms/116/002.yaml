  text: 'Porque ele inclinou o ouvido para mim,

    eu o invocarei enquanto viver.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “e em meus dias invocarei”. A expressão indica que o salmista continuará a invocá-lo durante toda a vida.'
