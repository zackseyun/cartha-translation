  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: pt
  text: De Davi[a]. Eu te darei graças de todo o coração; diante dos deuses cantarei louvores a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dos seres celestiais” ou “diante dos anjos”. A palavra hebraica pode referir-se a deuses, a Deus ou a seres celestiais, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ pode indicar autoria, associação ou dedicação. “De Davi” mantém essa ambiguidade e corresponde ao uso tradicional e natural dos títulos dos salmos em português.
- source_word: אוֹדְךָ
  choice: Eu te darei graças
  rationale: O hifil de ידה pode significar agradecer, louvar ou confessar. Neste contexto de culto, “darei graças” preserva a nuance de gratidão e explicita o destinatário indicado pelo sufixo.
- source_word: בְכָל לִבִּי
  choice: de todo o coração
  rationale: Expressão portuguesa natural que comunica integralidade e devoção sem reservas, correspondendo literalmente a “com todo o meu coração”.
- source_word: נֶגֶד
  choice: diante de
  rationale: Reproduz de modo conciso e poético a ideia de estar perante ou na presença de alguém.
- source_word: אֱלֹהִים
  choice: os deuses
  rationale: Embora אֱלֹהִים possa designar Deus, deuses ou seres celestiais conforme o contexto, aqui a leitura plural preserva mais diretamente a forma hebraica e a tensão retórica do verso.
- source_word: אֲזַמְּרֶךָ
  choice: cantarei louvores a ti
  rationale: O piel de זמר denota cantar ou fazer música em louvor. A formulação mantém tanto o aspecto musical quanto o caráter cultual e representa o sufixo de segunda pessoa.
theological_decisions:
- issue: Referente de אֱלֹהִים em נֶגֶד אֱלֹהִים
  choice: os deuses
  alternative: os seres celestiais; os anjos; Deus
  rationale: A forma admite mais de um referente, mas a leitura plural é a mais direta neste contexto. O texto principal não reduz a expressão ao singular nem decide se se trata especificamente de divindades das nações ou de membros da corte celestial; a nota conserva as alternativas relevantes.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “De todo o coração” favorece naturalidade ampla, e “cantarei louvores a ti” mantém explícito o destinatário sem sacrificar o tom litúrgico.
