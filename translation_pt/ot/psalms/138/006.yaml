  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: pt
  text: Pois Yahweh é elevado, mas vê o humilde; o arrogante, porém, ele conhece de longe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhece de longe”. O hebraico diz literalmente “conhece de longe”, expressão que pode sugerir distância relacional sem afirmá-la de maneira mais explícita.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor anterior e mantém o fluxo explicativo do poema.
- source_word: רָם
  choice: é elevado
  rationale: Expressa a posição exaltada de Yahweh e conserva a imagem vertical do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: שָׁפָל
  choice: o humilde
  rationale: Preserva a ideia de alguém baixo em condição ou atitude, sem restringi-la apenas à posição social.
- source_word: יִרְאֶה
  choice: vê
  rationale: Mantém o sentido básico do verbo hebraico, permitindo que o contexto comunique a ideia de atenção e consideração.
- source_word: גָבֹהַּ
  choice: o arrogante
  rationale: Embora signifique literalmente 'alto', o contraste com o humilde lhe confere aqui sentido moral negativo.
- source_word: מִמֶּרְחָק
  choice: de longe
  rationale: Reproduz de modo natural a imagem espacial e sua possível conotação relacional.
- source_word: יְיֵדָע
  choice: conhece
  rationale: Conserva o núcleo lexical do verbo sem explicitar rejeição, afastamento deliberado ou juízo além do que o texto afirma.
theological_decisions:
- issue: A relação de Yahweh com o arrogante expressa por 'conhece de longe'
  choice: ele conhece de longe
  alternative: ele reconhece de longe / ele mantém à distância
  rationale: O hebraico afirma literalmente que Yahweh 'conhece' o arrogante 'de longe'. A formulação pode sugerir distância relacional, mas não declara explicitamente rejeição ou condenação; por isso, a tradução preserva a tensão.
- issue: Relação concessiva entre a exaltação de Yahweh e sua atenção ao humilde
  choice: é elevado, mas vê o humilde
  alternative: embora seja elevado, vê o humilde
  rationale: O conectivo hebraico permite que o contraste seja percebido pelo contexto. 'Mas' torna natural em português a surpresa poética de que o Deus exaltado atenta para o humilde, sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético claro. Os substantivos no singular — “o humilde” e “o arrogante” — preservam as formas genéricas singulares do hebraico. A repetição de “ele” na última oração favorece a clareza e a cadência.
