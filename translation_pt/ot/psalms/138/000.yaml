  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: pt
  text: De Davi. Eu te darei graças de todo o coração; diante dos deuses[a] cantarei louvores a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dos seres celestiais” ou “diante dos anjos”. A palavra hebraica pode se referir a deuses, a Deus ou a seres celestiais, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Mantém a concisão do cabeçalho hebraico e sua ambiguidade convencional de relação/autoria.
- source_word: אוֹדְךָ
  choice: Eu te darei graças
  rationale: Expressa o sentido volitivo/futuro da forma verbal e o valor de reconhecer e agradecer publicamente.
- source_word: בְכָל־לִבִּי
  choice: de todo o coração
  rationale: Equivalente idiomático natural que preserva a ideia de entrega interior integral.
- source_word: נֶגֶד אֱלֹהִים
  choice: diante dos deuses
  rationale: Traduz diretamente o plural contextualmente possível de אֱלֹהִים, sem eliminar a ambiguidade lexical; as alternativas são registradas em nota.
- source_word: אֲזַמְּרֶךָּ
  choice: cantarei louvores a ti
  rationale: Comunica o sentido de cantar louvor dirigido a Deus em português claro e digno.
theological_decisions:
- issue: Referente de אֱלֹהִים no plural
  choice: deuses
  alternative: seres celestiais; anjos
  rationale: A forma e o contexto permitem mais de um referente. O texto principal conserva a leitura formal mais direta, enquanto a nota apresenta possibilidades legítimas sem impor uma identificação teológica.
translation_notes:
  register: Português moderno, claro e solene, com construção natural tanto no Brasil quanto em outros contextos lusófonos. O marcador [a] aparece junto ao termo relevante no texto principal.
