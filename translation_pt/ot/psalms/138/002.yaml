  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do hebraico: a orientação em direção ao templo, a ação corporal de prostrar-se, a ação de graças ao nome, e o paralelismo entre חסד e אמת. Também conserva, de modo apropriadamente pouco explicativo, a dificuldade sintática da cláusula final. Contudo, os futuros “me prostrarei” e “darei graças” apresentam as ações como futuras, enquanto, neste contexto de louvor, o imperfeito hebraico é mais naturalmente expresso em português por presente com valor habitual/performativo.'
  naturalness: O texto é claro, digno e amplamente compreensível. “Eu me prostro” e “dou graças” soam mais naturais para uma declaração de adoração no salmo e evitam uma mudança temporal desnecessária. A formulação difícil “acima de todo o teu nome” deve permanecer, pois reflete a dificuldade do texto massorético.
  terminology: “Santo templo”, “amor leal”, “fidelidade”, “nome” e “palavra” são escolhas adequadas e não impõem interpretação doutrinária. “Amor leal” comunica bem חסד no paralelismo com “fidelidade”.
