  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: pt
  text: Eu me prostro em direção ao teu santo templo e dou graças ao teu nome por teu amor leal e por tua fidelidade, pois engrandeceste tua palavra acima de todo o teu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois engrandeceste tua promessa acima de tudo”. O hebraico da frase final é difícil; alguns a entendem como: “pois engrandeceste teu nome e tua palavra acima de todas as coisas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: Eu me prostrarei
  rationale: Preserva o gesto corporal de inclinar-se profundamente em adoração, sem reduzi-lo ao sentido mais geral de 'adorar'.
- source_word: אֶל
  choice: em direção a
  rationale: Expressa a orientação espacial do ato sem sugerir que o salmista esteja entrando no templo.
- source_word: הֵיכַל קָדְשְׁךָ
  choice: teu santo templo
  rationale: Embora הֵיכָל também possa significar 'palácio', o contexto de culto favorece 'templo'; a formulação é natural em português.
- source_word: וְאוֹדֶה אֶת שִׁמְךָ
  choice: e darei graças ao teu nome
  rationale: O hifil de ידה pode indicar agradecer ou louvar; as expressões seguintes apresentam os motivos da gratidão, favorecendo 'darei graças'.
- source_word: עַל חַסְדְּךָ
  choice: por teu amor leal
  rationale: חסד reúne amor, bondade e lealdade relacional; 'amor leal' é claro, corrente e mantém essa riqueza sem explicitação confessional excessiva.
- source_word: וְעַל אֲמִתֶּךָ
  choice: e por tua fidelidade
  rationale: Em paralelo com חסד, אֱמֶת destaca a firmeza e confiabilidade de Deus; 'fidelidade' se ajusta melhor ao contexto que o sentido mais abstrato de 'verdade'.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural em português a razão para a ação de graças.
- source_word: הִגְדַּלְתָּ
  choice: engrandeceste
  rationale: Traduz diretamente o hifil de גדל, 'tornar grande, magnificar', e preserva a linguagem elevada do salmo.
- source_word: עַל כָּל שִׁמְךָ
  choice: acima de todo o teu nome
  rationale: Mantém de perto a sequência e a dificuldade do texto massorético, sem substituir a expressão por uma interpretação mais fluida.
- source_word: אִמְרָתֶךָ
  choice: tua palavra
  rationale: אִמְרָה pode designar palavra, declaração ou promessa; 'palavra' conserva a amplitude do termo hebraico.
theological_decisions:
- issue: Interpretação da cláusula difícil כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: pois engrandeceste tua palavra acima de todo o teu nome
  alternative: 'pois engrandeceste tua promessa acima de tudo; ou: pois engrandeceste teu nome e tua palavra acima de todas as coisas'
  rationale: A redação massorética é sintaticamente difícil e admite interpretações distintas. O texto principal acompanha de perto a ordem hebraica e preserva a tensão entre 'palavra' e 'nome', sem explicar que um diminua o outro; as leituras interpretativas mais fluidas ficam registradas em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes ('teu', 'tua'). 'Eu me prostrarei' mantém a concretude do gesto cultual; a frase final conserva deliberadamente a dificuldade do hebraico. O marcador [a] aparece no texto principal.
