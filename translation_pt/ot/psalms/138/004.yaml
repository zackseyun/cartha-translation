  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: pt
  text: Todos os reis da terra te darão graças, ó Yahweh,[a] pois ouviram as palavras da tua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino; aqui transliterado «Yahweh».'
    reason: Esclarecer a representação do Tetragrama e a opção de tradução.
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: te darão graças
  rationale: O hifil de ידה pode significar agradecer ou louvar. Com o sufixo de objeto «a ti», «te darão graças» preserva a direção pessoal da ação e se ajusta ao contexto de ação de graças do salmo.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, com o vocativo indicado naturalmente em português.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: todos os reis da terra
  rationale: Tradução direta e idiomática da expressão coletiva, sem generalizar o termo específico «reis».
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em registro digno, a razão pela qual os reis darão graças.
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: O qatal apresenta a audição como ação completa que fundamenta a resposta futura. O pretérito perfeito é natural e mantém essa sequência.
- source_word: אִמְרֵי פִיךָ
  choice: as palavras da tua boca
  rationale: Preserva a imagem hebraica e o sentido de palavras proferidas, mantendo uma formulação clara em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome próprio e evita substituí-lo por um título; a nota informa a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro «darão» e o passado «ouviram» preservam a sequência verbal do hebraico. A imagem concreta «palavras da tua boca» foi mantida.
