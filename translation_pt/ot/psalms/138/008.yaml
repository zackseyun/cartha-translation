id: PSA.138.8
reference: Psalms 138:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: pt
  text: Yahweh levará a bom termo o que me diz respeito[a]. Yahweh, o teu amor leal dura para sempre. Não abandones as obras das tuas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh cumprirá seu propósito para mim”.'
    reason: Leitura alternativa que explicita como “propósito” o objeto deixado implícito no hebraico.
  - marker: b
    text: 'Ou: “a obra das tuas mãos”.'
    reason: Alternativa coletiva idiomática para o plural hebraico “obras”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função de nome pessoal no hebraico.
- source_word: יִגְמֹר בַּעֲדִי
  choice: levará a bom termo o que me diz respeito
  rationale: גמר expressa completar ou concluir, enquanto בעדי pode significar “por mim”, “em meu favor” ou “a meu respeito”. A formulação portuguesa é natural e não acrescenta explicitamente o objeto “propósito”, ausente no hebraico.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: חסד designa amor fiel, constante e comprometido. “Amor leal” comunica tanto o afeto quanto a fidelidade, sem restringir o termo a uma formulação doutrinária específica.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Expressa a permanência do amor leal de Yahweh em português corrente e digno.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: as obras das tuas mãos
  rationale: 'Mantém o plural do hebraico e conserva aberta a abrangência da expressão: pode incluir o que Deus realizou no salmista ou, de modo mais amplo, aquilo que ele fez.'
- source_word: אַל תֶּרֶף
  choice: Não abandones
  rationale: רפה pode significar afrouxar, soltar, deixar ou desistir. Neste pedido dirigido a Deus, “não abandones” transmite com naturalidade a súplica para que ele não deixe inacabado aquilo que fez.
theological_decisions:
- issue: Objeto implícito em יִגְמֹר בַּעֲדִי
  choice: Yahweh levará a bom termo o que me diz respeito
  alternative: Yahweh cumprirá seu propósito para mim
  rationale: O hebraico não traz a palavra “propósito”. A tradução principal preserva a amplitude da expressão, que pode indicar completar o que diz respeito ao salmista ou agir em seu favor até a conclusão; a leitura interpretativa com “propósito” fica na nota.
- issue: Alcance de מַעֲשֵׂי יָדֶיךָ
  choice: as obras das tuas mãos
  alternative: a obra das tuas mãos
  rationale: O plural hebraico é mantido para não limitar a súplica apenas à obra de Deus na vida do salmista. A alternativa coletiva, comum em português, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular coerentes com a oração dirigida a Yahweh. A tradução conserva o paralelismo e a concisão poética do verso, sem explicitar além do necessário o objeto da ação divina.
