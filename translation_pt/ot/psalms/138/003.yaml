  yaml_path: translation/ot/psalms/138/003.yaml
  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: pt
  text: No dia em que clamei, tu me respondeste; encorajaste-me no íntimo, dando-me força.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “engrandeceste a minha alma com força”; mais livremente: “deste força ao meu íntimo”. O verbo hebraico é difícil e pode indicar dar coragem, ampliar ou fortalecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: No dia em que
  rationale: Preserva a expressão temporal concreta do hebraico e a liga naturalmente ao verbo em português.
- source_word: קָרָאתִי
  choice: clamei
  rationale: No contexto de oração, קרא expressa chamar ou clamar a Deus. “Clamei” é corrente e digno, sem necessariamente acrescentar desespero.
- source_word: וַתַּעֲנֵנִי
  choice: tu me respondeste
  rationale: Reproduz explicitamente o sufixo de primeira pessoa e mantém a reciprocidade pessoal da frase.
- source_word: תַּרְהִבֵנִי
  choice: tornaste-me corajoso
  rationale: O hifil de רהב é difícil neste contexto; a escolha conserva seu valor causativo e comunica a ideia provável de infundir coragem, sem apresentar a interpretação como totalmente indiscutível.
- source_word: בְנַפְשִׁי
  choice: a minha alma
  rationale: Mantém visível o termo נפש como referência ao ser interior, em vez de reduzi-lo silenciosamente a uma paráfrase.
- source_word: עֹז
  choice: fortalecendo
  rationale: Expressa a força concedida por Deus de maneira natural em português e evita a construção pouco idiomática “com força”, embora envolva uma relação sintática interpretativa.
theological_decisions:
- issue: Sentido da cláusula difícil תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: tornaste-me corajoso, fortalecendo a minha alma
  alternative: engrandeceste a minha alma com força; deste força ao meu íntimo
  rationale: A tradução principal comunica fortalecimento interior e conserva tanto a ação causativa de Deus quanto a menção explícita da alma. A nota registra que o verbo pode também sugerir alargamento ou engrandecimento, preservando a incerteza lexical sem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a oração dirigida diretamente a Deus. A formulação busca legibilidade ampla, inclusive brasileira, sem apagar a imagem hebraica da alma nem a dificuldade do verbo.
