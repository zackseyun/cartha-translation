language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: pt
  text: Se eu andar em meio à angústia,[a] tu me conservarás com vida;[b] contra a ira dos meus inimigos estenderás a mão, e a tua mão direita me salvará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda que eu ande em meio à angústia”. A palavra hebraica pode introduzir aqui uma condição ou uma concessão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tu me reanimarás” ou “tu me manterás vivo”. O verbo hebraico pode indicar tanto reanimar como preservar a vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Representa diretamente a partícula condicional hebraica, sem excluir o possível valor concessivo no contexto, registrado em nota.
- source_word: אֵלֵךְ
  choice: eu andar
  rationale: Preserva a imagem concreta de הלך e soa natural na poesia portuguesa.
- source_word: בְּקֶרֶב צָרָה
  choice: em meio à angústia
  rationale: Mantém a noção espacial de קֶרֶב e traduz צָרָה por um termo corrente que expressa aflição e perigo.
- source_word: תְּחַיֵּנִי
  choice: tu me conservarás com vida
  rationale: No contexto de perigo e inimigos, comunica a preservação da vida sem eliminar os sentidos possíveis de reanimar ou manter vivo.
- source_word: עַל אַף אֹיְבַי
  choice: contra a ira dos meus inimigos
  rationale: Preserva אַף em seu sentido idiomático de ira, em vez de reduzir a expressão aos inimigos em si.
- source_word: תִּשְׁלַח יָדֶךָ
  choice: estenderás a mão
  rationale: Expressa naturalmente a intervenção ativa de Deus e conserva a imagem antropomórfica hebraica.
- source_word: וְתוֹשִׁיעֵנִי
  choice: e ... me salvará
  rationale: Traduz ישע em seu sentido amplo e usual de salvar ou livrar, sem especificar indevidamente o modo do resgate.
- source_word: יְמִינֶךָ
  choice: a tua mão direita
  rationale: Mantém a imagem hebraica tradicional de força e poder salvador.
theological_decisions:
- issue: Nuance da ação divina em תְּחַיֵּנִי
  choice: preservação da vida em meio ao perigo presente
  alternative: reanimar ou restaurar
  rationale: A menção da angústia e dos inimigos favorece a ideia de Deus manter o salmista vivo, sem impor um sentido especificamente espiritual.
- issue: Força de עַל אַף אֹיְבַי
  choice: Deus age contra a ira dos inimigos
  alternative: Deus age contra os próprios inimigos
  rationale: Como אַף significa idiomaticamente “ira”, a redação conserva o objeto explícito da oposição divina e a tensão poética do hebraico.
- issue: Valor de אִם
  choice: 'condicional: “Se”'
  alternative: 'concessivo: “Ainda que”'
  rationale: A partícula admite ambos os valores contextuais; o texto principal preserva a forma condicional mais direta, e a nota registra a leitura concessiva genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a poesia bíblica. A ordem da última oração foi mantida próxima do hebraico para destacar “a tua mão direita” como sujeito do ato salvador.
