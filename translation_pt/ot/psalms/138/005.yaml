  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: pt
  text: 'E cantarão sobre os caminhos de Yahweh,[a]

    pois grande é a glória de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «nos caminhos de Yahweh»; a expressão provavelmente significa cantar sobre os caminhos de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: E cantarão
  rationale: O imperfeito qal na terceira pessoa do plural dá continuidade ao futuro do contexto. «Cantarão» é natural e preserva essa progressão sem impor valor exortativo.
- source_word: בְּדַרְכֵי
  choice: sobre os caminhos
  rationale: Embora בְּ possa ser traduzido literalmente por «nos», depois de «cantar» a expressão provavelmente indica o tema do cântico. «Sobre» comunica isso com clareza em português, enquanto a nota preserva a formulação literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração conserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão pela qual os reis cantarão, mantendo a concisão poética.
- source_word: גָדוֹל
  choice: grande
  rationale: Equivalente direto que preserva a construção enfática do hebraico, na qual o predicativo precede o sujeito.
- source_word: כְּבוֹד
  choice: glória
  rationale: É o equivalente tradicional e semanticamente adequado para כָּבוֹד quando se refere a Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. «Yahweh» o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de בְּדַרְכֵי após «cantar»
  choice: sobre os caminhos
  alternative: nos caminhos
  rationale: A preposição admite a leitura literal «nos», que poderia sugerir âmbito ou modo; no contexto, porém, é provável que os caminhos de Yahweh sejam o assunto do cântico. A nota mantém visível a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. O nome «Yahweh» é mantido nas duas ocorrências; a inversão «grande é a glória» conserva a ênfase do hebraico.
