base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/018.yaml
  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: pt
  text: Repartem entre si as minhas vestes[a] e lançam sortes sobre a minha roupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta linha ecoa nos relatos da crucificação de Jesus; veja Mateus 27:35; Marcos 15:24; Lucas 23:34; João 19:24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: Repartem
  rationale: O piel imperfeito de חלק descreve a distribuição das vestes entre os adversários. O presente dá vivacidade à cena poética e é natural em português.
- source_word: בְגָדַי
  choice: as minhas vestes
  rationale: בגד designa roupas ou vestes. “Vestes” mantém o registro digno do salmo e permite alguma distinção em relação ao segundo termo de vestuário.
- source_word: לָהֶם
  choice: entre si
  rationale: Embora a expressão seja literalmente “para eles”, com o verbo “repartir” indica de modo idiomático a distribuição dentro do próprio grupo.
- source_word: לְבוּשִׁי
  choice: a minha roupa
  rationale: לבוש refere-se a roupa ou vestuário sem exigir uma peça específica. “Roupa” preserva o paralelismo sem introduzir “manto” ou outra especificação ausente do hebraico.
- source_word: יַפִּילוּ גוֹרָל
  choice: lançam sortes
  rationale: A combinação do hifil de נפל com גורל é uma expressão idiomática para decidir ou distribuir algo mediante sortes. “Lançar sortes” é a formulação portuguesa estabelecida e fiel.
theological_decisions:
- issue: Ressonância messiânica e uso nos relatos da crucificação
  choice: Traduzir diretamente a descrição poética hebraica e registrar a relação com a crucificação em nota.
  alternative: Inserir na tradução linguagem mais explicitamente associada à crucificação de Jesus.
  rationale: O texto hebraico fala da repartição das vestes e do lançamento de sortes sem mencionar explicitamente a crucificação. A conexão canônica é significativa, mas não deve alterar o sentido lexical do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vestes” conserva o tom poético, enquanto “roupa” evita repetição rígida e reflete a variação lexical do hebraico.
