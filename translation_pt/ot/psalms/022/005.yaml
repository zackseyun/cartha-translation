source:
  edition: WLC
  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: pt
  text: A ti clamaram e foram libertados[a]; em ti confiaram e não foram envergonhados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escaparam” ou “foram resgatados”. O verbo hebraico pode indicar escape ou libertação; aqui, o contexto é o socorro que se segue ao clamor dirigido a Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se envergonharam” ou “não ficaram decepcionados”. A expressão hebraica pode transmitir a ideia de não sofrer desonra depois de confiar em Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: A ti
  rationale: A preposição אֶל com o sufixo de segunda pessoa indica a direção do clamor para Deus. “A ti” é direto, natural e preserva a ênfase inicial do hebraico.
- source_word: זָעֲקוּ
  choice: clamaram
  rationale: זעק descreve um clamor intenso por socorro. “Clamaram” comunica essa força em português atual e mantém o tom elevado do salmo.
- source_word: וְנִמְלָטוּ
  choice: e foram libertados
  rationale: O nifal de מלט pode indicar escapar ou ser resgatado. Neste contexto, “foram libertados” expressa o livramento que sucede ao clamor sem especificar além do texto a forma desse livramento.
- source_word: בְּךָ
  choice: em ti
  rationale: Com בטח, a preposição בְּ marca aquele em quem se deposita confiança. “Em ti” é a construção portuguesa adequada e conserva a repetição enfática dirigida a Deus.
- source_word: בָטְחוּ
  choice: confiaram
  rationale: בטח significa confiar ou apoiar-se com segurança. “Confiaram” é conciso e natural.
- source_word: וְלֹא בֹשׁוּ
  choice: e não foram envergonhados
  rationale: בוש, neste contexto de confiança, pode indicar sofrer vergonha, desonra ou frustração pública. A formulação passiva preserva a dimensão de não acabar desonrado, em vez de reduzir a expressão a um sentimento interior.
theological_decisions:
- issue: Natureza do livramento expresso por נִמְלָטוּ
  choice: foram libertados em resposta ao clamor dirigido a Deus
  alternative: escaparam, sem explicitar a ideia de libertação
  rationale: A sequência poética associa o clamor a Deus ao livramento. A tradução conserva essa lógica sem acrescentar detalhes sobre os meios ou as circunstâncias da ação divina.
- issue: Dimensão de honra e vergonha em בֹשׁוּ
  choice: não foram envergonhados
  alternative: não se envergonharam; não ficaram decepcionados
  rationale: A escolha mantém a possibilidade de desonra resultante de uma confiança frustrada e evita limitar o sentido a uma emoção subjetiva ou à simples decepção.
translation_notes:
  register: 'Português moderno, claro e solene, com legibilidade brasileira e ampla compreensão internacional. A ordem paralela do hebraico foi preservada, assim como a repetição de “a ti/em ti”. Os marcadores foram posicionados junto às expressões correspondentes: [a] após “libertados” e [b] após “envergonhados”.'
