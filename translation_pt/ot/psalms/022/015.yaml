  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: pt
  text: Minha força secou como um caco de barro, e minha língua está colada aos meus maxilares[a]; tu me deitas no pó da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao meu céu da boca” ou “às minhas gengivas”. O termo hebraico para essa parte da boca é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: secou
  rationale: O verbo descreve o ressecamento ou definhamento. O perfeito português expressa naturalmente o estado resultante e preserva a imagem de extrema dessecação.
- source_word: כַּחֶרֶשׂ
  choice: como um caco de barro
  rationale: חֶרֶשׂ pode designar cerâmica ou um fragmento de cerâmica. “Caco de barro” é claro e vívido em português, evocando algo seco, duro e quebradiço.
- source_word: כֹּחִי
  choice: minha força
  rationale: Neste contexto, כֹּחַ se refere à força ou vitalidade física, não à autoridade abstrata.
- source_word: וּלְשׁוֹנִי
  choice: e minha língua
  rationale: Tradução anatômica direta, sem necessidade de paráfrase.
- source_word: מֻדְבָּק
  choice: se cola
  rationale: O particípio passivo indica que a língua fica aderida. “Se cola” transmite a condição de modo natural e mantém a imagem física.
- source_word: מַלְקוֹחָי
  choice: aos meus maxilares
  rationale: O termo anatômico é raro e incerto. “Maxilares” representa a provável referência às mandíbulas ou partes laterais da boca; outras possibilidades são registradas em nota.
- source_word: וְלַעֲפַר
  choice: no pó
  rationale: A preposição ל pode indicar movimento para um lugar ou colocação nele. “Deitar no pó” é idiomático e corresponde ao verbo da oração.
- source_word: מָוֶת
  choice: da morte
  rationale: Preserva-se a construção poética “o pó da morte”, sem interpretá-la mais especificamente como sepultura.
- source_word: תִּשְׁפְּתֵנִי
  choice: tu me deitas
  rationale: A forma verbal significa pôr ou colocar e traz sujeito na segunda pessoa masculina singular e objeto na primeira pessoa. “Tu me deitas” mantém tanto a ação quanto o tom poético da súplica.
theological_decisions:
- issue: Agência na oração final
  choice: 'Discurso direto dirigido a Deus: “tu me deitas no pó da morte”'
  alternative: 'Formulação impessoal ou resultativa: “sou deitado no pó da morte”'
  rationale: A forma hebraica é segunda pessoa masculina singular com objeto de primeira pessoa singular e, no contexto da oração, refere-se naturalmente a Deus. A tradução conserva a tensão teológica de o sofredor atribuir sua condição extrema à ação divina, sem explicar ou harmonizar essa agência com a atuação de inimigos humanos.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. “Caco de barro” favorece a compreensão ampla sem perder a imagem concreta; o pronome “tu” preserva o discurso direto solene e continua natural no registro bíblico.
