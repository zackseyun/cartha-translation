source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: pt
  text: Pois ele não desprezou nem abominou a aflição do aflito[a], nem lhe escondeu o rosto; quando o aflito clamou a ele, ele o ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a miséria do pobre” ou “a humilhação do aflito”.
    reason: Alternativas lexicais para עֱנוּת עָנִי, expressão que pode destacar sofrimento, pobreza ou humilhação.
lexical_decisions:
- source_word: בָזָה
  choice: desprezou
  rationale: Expressa tratar com desdém ou menosprezo e forma uma progressão natural com o verbo mais forte que vem em seguida.
- source_word: שִׁקַּץ
  choice: abominou
  rationale: Preserva a intensidade do verbo, que comunica repulsa ou aversão, sem reduzir seu sentido a uma simples rejeição.
- source_word: עֱנוּת
  choice: aflição
  rationale: Abrange sofrimento, opressão e condição humilhante sem limitar o termo a uma dimensão exclusivamente interior, social ou econômica.
- source_word: עָנִי
  choice: o aflito
  rationale: Mantém o sentido amplo de alguém abatido ou oprimido e se ajusta ao contexto de sofrimento do salmo, sem restringir a referência à pobreza material.
- source_word: הִסְתִּיר פָּנָיו
  choice: escondeu dele o seu rosto
  rationale: Conserva a imagem hebraica de retirar a atenção ou presença favorável, numa formulação compreensível em português.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: O sufixo singular retoma naturalmente o aflito e mantém a coesão do hebraico.
- source_word: בְשַׁוְּעוֹ
  choice: quando o aflito clamou
  rationale: Comunica de modo natural e conciso um clamor urgente por socorro; a repetição de “o aflito” evita ambiguidade pronominal excessiva em português.
- source_word: אֵלָיו
  choice: a ele
  rationale: Mantém a forma pronominal do hebraico, cujo referente é Deus no contexto, sem inserir um título divino ausente do versículo.
- source_word: שָׁמֵעַ
  choice: ele o ouviu
  rationale: Preserva o sentido básico de ouvir; traduzir por “respondeu” acrescentaria uma inferência não explicitada pelo verbo.
theological_decisions:
- issue: Referente do aflito
  choice: O versículo fala do cuidado de Deus pelo aflito em forma singular, compatível tanto com a experiência imediata do salmista quanto com uma afirmação mais ampla.
  alternative: Entender o aflito exclusivamente como referência messiânica ou, no outro extremo, como qualquer pobre em sentido apenas econômico.
  rationale: As formas singulares hebraicas permitem uma referência contextual ao sofredor do salmo sem impedir aplicação mais ampla. A tradução não força uma interpretação exclusivamente messiânica nem puramente genérica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de “o aflito” esclarece os referentes, enquanto “escondeu dele o seu rosto” preserva a imagem bíblica hebraica.
