  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: pt
  text: Mas tu, ó Yahweh, não fiques longe; força minha,[a] apressa-te em me ajudar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha força”. O termo também tem sido entendido como “meu auxílio” ou, menos provavelmente aqui, em sentido literal relacionado a uma corça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente estabelece forte contraste com a aflição anterior; “Mas tu” reproduz isso com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אַל תִּרְחָק
  choice: não fiques longe
  rationale: Preserva a súplica negativa direta e expressa de modo idiomático o sentido de estar distante.
- source_word: אֱיָלוּתִי
  choice: força minha
  rationale: No contexto, o substantivo funciona melhor como uma invocação metafórica a Deus como a força do salmista; a forma admite outras interpretações, registradas em nota.
- source_word: לְעֶזְרָתִי
  choice: em me ajudar
  rationale: Expressa naturalmente em português a direção ou finalidade do pedido de socorro.
- source_word: חוּשָׁה
  choice: apressa-te
  rationale: Comunica a urgência do imperativo sem recorrer a formulação excessivamente arcaica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Sentido de אֱיָלוּתִי
  choice: força minha
  alternative: meu auxílio; minha corça
  rationale: “Força minha” se ajusta à invocação e ao paralelismo contextual, mas a dificuldade lexical genuína é preservada em nota, sem excluir totalmente as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem “força minha” conserva o tom poético de invocação. Não se acrescentou nota a “não fiques longe”, pois a alternativa “não estejas distante” não altera substancialmente o sentido.
