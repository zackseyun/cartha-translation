  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: pt
  text: Mas tu és santo, entronizado entre os louvores de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas tu és santo, habitando entre os louvores de Israel”. O particípio hebraico pode significar “sentado” ou “habitando”; “entronizado” explicita a possível imagem régia do contexto poético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção, seguida do pronome independente, estabelece contraste com o lamento anterior. “Mas tu” expressa naturalmente essa força adversativa e mantém a interpelação direta.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: É a tradução corrente e plena do atributo divino, sem reduzi-lo apenas à ideia de separação.
- source_word: יֹשֵׁב
  choice: entronizado
  rationale: Embora o particípio possa significar literalmente “sentado” ou “habitando”, quando aplicado a Deus pode evocar sua realeza. “Entronizado” preserva essa imagem poética, enquanto a nota registra a alternativa genuína.
- source_word: תְּהִלּוֹת
  choice: louvores
  rationale: Mantém o plural hebraico e designa as diversas expressões de louvor.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Emprega a forma consagrada do nome próprio em português.
theological_decisions:
- issue: Sentido de יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Deus é retratado, em imagem régia e poética, como entronizado sobre os louvores de Israel.
  alternative: Deus habita nos louvores de Israel.
  rationale: A construção liga naturalmente o particípio a “louvores de Israel”. A tradução principal conserva a possível imagem régia sem eliminar a leitura locativa, registrada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “tu” para conservar a interpelação poética direta. A formulação mantém o paralelismo compacto e a metáfora hebraica.
