source:
  edition: WLC
  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: pt
  text: De ti vem o meu louvor na grande assembleia; cumprirei os meus votos diante dos que o temem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os que o temem”. Algumas traduções regularizam a mudança de pronome para “os que te temem”, em harmonia com o início do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: De ti vem
  rationale: A preposição com sufixo de segunda pessoa masculina singular indica fonte ou origem. O verbo “vem”, suprido em português, produz uma frase natural e preserva essa ideia.
- source_word: תְהִלָּתִי
  choice: o meu louvor
  rationale: O substantivo significa louvor ou ação de graças. “O meu louvor” é direto e não acrescenta uma nuance sacrificial ausente do termo.
- source_word: בְּקָהָל רָב
  choice: na grande assembleia
  rationale: קָהָל designa uma comunidade reunida, e רָב qualifica a assembleia como grande ou numerosa. A formulação é clara e digna em português atual.
- source_word: נְדָרַי
  choice: os meus votos
  rationale: O plural se refere a compromissos solenes assumidos diante de Deus. “Os meus votos” conserva a expressão bíblica sem explicitação indevida.
- source_word: אֲשַׁלֵּם
  choice: cumprirei
  rationale: No piel, שׁלם pode significar pagar ou cumprir. Com “votos”, “cumprirei” é a colocação mais natural no português moderno e comunica a realização do prometido.
- source_word: נֶגֶד
  choice: diante de
  rationale: A preposição expressa presença ou visibilidade perante outras pessoas. “Diante de” é natural no contexto de culto público.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: A forma participial com sufixo de terceira pessoa masculina singular significa literalmente os que o temem. A tradução mantém tanto a linguagem reverencial quanto a mudança pronominal do hebraico.
theological_decisions:
- issue: Mudança de referente gramatical da segunda pessoa (“ti”) para a terceira pessoa (“o”)
  choice: 'Preservar a leitura massorética: “De ti ... os que o temem”'
  alternative: 'Harmonizar para a segunda pessoa: “os que te temem”'
  rationale: O texto hebraico passa do discurso direto dirigido a Deus para uma referência a ele na terceira pessoa. Preservar a mudança respeita a forma do texto e sua tensão estilística; no contexto, o referente continua sendo Deus.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é poético e digno, sem arcaísmos desnecessários; mantém-se “temem” para conservar a linguagem bíblica de temor reverente.
