  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: pt
  text: Pois o reino pertence a Yahweh[a], e ele governa as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH; tradicionalmente traduzido por «o SENHOR». A expressão «o reino» também pode ser traduzida por «a realeza» ou «o domínio real».
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o contexto anterior, preservando a força causal com fluidez poética em português.
- source_word: לַיהוָה
  choice: pertence a Yahweh
  rationale: A preposição לְ marca aqui uma relação de posse; em português, «pertence a» explicita naturalmente essa relação sem alterar o sentido.
- source_word: הַמְּלוּכָה
  choice: o reino
  rationale: מְלוּכָה pode indicar reino, realeza ou domínio real. «O reino» é claro, tradicional e acessível, enquanto a nota preserva as nuances alternativas.
- source_word: וּמֹשֵׁל
  choice: e ele governa
  rationale: O particípio qal de משל expressa uma realidade contínua ou geral. «Governa» comunica essa ação duradoura em português natural.
- source_word: בַּגּוֹיִם
  choice: sobre as nações
  rationale: Com משל, בְּ indica o âmbito ou os objetos do governo. «Sobre as nações» expressa idiomaticamente o domínio universal, sem restringir גּוֹיִם ao sentido posterior de «gentios».
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome divino pessoal e distingue-o de um título, enquanto a nota registra a forma tradicional.
- issue: Nuance de מְלוּכָה
  choice: o reino pertence a Yahweh
  alternative: a realeza pertence a Yahweh; o domínio real pertence a Yahweh
  rationale: «Reino» oferece a formulação mais clara e corrente, mas o substantivo hebraico também pode designar realeza ou exercício do poder régio; essa amplitude é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e a afirmação direta do governo universal de Yahweh.
