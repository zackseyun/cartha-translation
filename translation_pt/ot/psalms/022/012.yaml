  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: pt
  text: 'Muitos touros me cercam[a];

    touros poderosos de Basã me rodeiam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Basã era uma região a leste do Jordão, conhecida por suas pastagens férteis e por seu gado forte e bem alimentado; a imagem evoca adversários poderosos e ameaçadores.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: me cercam
  rationale: O verbo סבב significa cercar ou rodear. O presente dá vivacidade poética à situação já estabelecida pelo perfeito hebraico.
- source_word: פָּרִים רַבִּים
  choice: muitos touros
  rationale: פַּר designa um touro ou novilho; no contexto da metáfora hostil, “touros” é claro e natural. רַבִּים expressa a grande quantidade.
- source_word: אַבִּירֵי בָשָׁן
  choice: touros poderosos de Basã
  rationale: אַבִּירֵי pode significar fortes ou poderosos. Como retoma os touros do primeiro membro, explicitar “touros” preserva a imagem bovina e a força do paralelismo.
- source_word: כִּתְּרוּנִי
  choice: me rodeiam
  rationale: O verbo כתר significa cercar ou rodear. “Rodeiam” mantém o paralelismo com “cercam” sem repetição exata.
theological_decisions:
- issue: Metáfora animal para adversários hostis
  choice: Manter diretamente a imagem dos “touros”
  alternative: Interpretar a metáfora como “inimigos”
  rationale: O hebraico apresenta os adversários por meio de uma imagem animal vívida. Preservá-la evita transformar a tradução em explicação e conserva a tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. “Basã” segue a forma tradicional e amplamente reconhecida em português.
