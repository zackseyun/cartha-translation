source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: pt
  text: Os aflitos comerão e ficarão satisfeitos[b]; os que o buscam louvarão a Yahweh. Que o coração de vocês viva para sempre!
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O ato de comer pode aludir, no contexto do salmo, a uma refeição sacrificial ou ligada ao cumprimento de um voto, embora isso não seja explícito neste versículo.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: os aflitos
  rationale: O termo pode designar os humildes, pobres, mansos ou afligidos. No movimento do salmo, que vai do sofrimento à restauração e ao louvor comunitário, “os aflitos” preserva bem a condição daqueles que foram abatidos e agora recebem provisão.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: comerão e ficarão satisfeitos
  rationale: Os imperfeitos têm sentido futuro no contexto. A formulação é natural em português e mantém tanto o ato concreto de comer quanto a ideia de plena satisfação.
- source_word: יְהַלְלוּ
  choice: louvarão
  rationale: Expressa diretamente a resposta de culto daqueles que buscam a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal do Deus de Israel.
- source_word: דֹּרְשָׁיו
  choice: os que o buscam
  rationale: Mantém o sufixo pronominal que remete a Yahweh e expressa de modo corrente a orientação contínua dos adoradores para Deus.
- source_word: יְחִי
  choice: Que ... viva
  rationale: O imperfeito funciona aqui de modo jussivo, como desejo ou bênção, e não simplesmente como declaração futura.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: O hebraico traz “coração” no singular com sufixo de segunda pessoa do plural. A tradução conserva tanto o singular coletivo quanto o grupo plural a quem a bênção é dirigida.
- source_word: לָעַד
  choice: para sempre
  rationale: É a expressão portuguesa corrente para duração contínua ou ilimitada neste contexto de bênção.
theological_decisions:
- issue: Mudança de referente e destinatário na oração final
  choice: 'Manter a segunda pessoa do plural e o singular coletivo: “Que o coração de vocês viva para sempre!”'
  alternative: “Que os corações de vocês vivam para sempre!” ou “O coração deles viverá para sempre.”
  rationale: לְבַבְכֶם combina o substantivo singular “coração” com um sufixo plural, provavelmente coletivo. A formulação escolhida preserva a passagem para uma bênção dirigida diretamente à comunidade sem apagar a forma singular do hebraico.
- issue: Natureza da refeição
  choice: Traduzir literalmente o comer e o ficar satisfeito, sem identificar a refeição no texto principal.
  alternative: “Os aflitos comerão do sacrifício e ficarão satisfeitos.”
  rationale: O contexto pode sugerir uma refeição sacrificial ou ligada ao cumprimento de um voto, mas este versículo não a identifica explicitamente; especificá-la no texto resolveria uma inferência contextual como se fosse afirmação expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “O coração de vocês” conserva deliberadamente o singular coletivo hebraico e torna explícito, de modo natural, o destinatário plural. O ponto de exclamação reforça o caráter de bênção sem alterar o conteúdo.
