base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: pt
  text: Meu Deus, clamo de dia, mas não me respondes; e, de noite, não tenho sossego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “e não há silêncio para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: O substantivo com sufixo de primeira pessoa singular funciona como vocativo direto; “Meu Deus” expressa isso sem acrescentar uma interjeição.
- source_word: אֶקְרָא
  choice: clamo
  rationale: No contexto de lamento, o qal imperfeito de קרא indica um apelo urgente dirigido a Deus; “clamo” é natural, digno e mais intenso que o neutro “chamo”.
- source_word: יוֹמָם
  choice: de dia
  rationale: Uso adverbial que designa o período diurno e forma o paralelismo temporal com “de noite”.
- source_word: וְלֹא תַעֲנֶה
  choice: mas não me respondes
  rationale: A conjunção assume força adversativa no contexto da queixa. O objeto “me” está implícito no sentido do verbo e torna a frase idiomática em português.
- source_word: וְלַיְלָה
  choice: de noite também
  rationale: Preserva a coordenação com “de dia”; “também” explicita naturalmente em português a extensão contínua do clamor ao período noturno.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: e não tenho sossego
  rationale: דומיה significa silêncio, quietude ou repouso. Neste enunciado elíptico, “não tenho sossego” comunica a ausência de quietude pessoal sem transformar o termo em “resposta”; a nota conserva a imagem literal.
theological_decisions:
- issue: Sentido da cláusula final וְלֹא דֽוּמִיָּה לִי
  choice: O salmista não tem sossego durante a noite.
  alternative: “Não há silêncio para mim” ou “não encontro descanso”.
  rationale: A tradução mantém a tensão entre a ausência de resposta divina durante o dia e a ausência de quietude do salmista à noite. Não interpreta דומיה como se significasse diretamente “resposta”.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa singular coerentes com a oração direta a Deus. O ponto e vírgula evidencia o paralelismo poético. A formulação evita a expressão pouco natural “não há silêncio para mim” no corpo do verso, mas a preserva na nota.
