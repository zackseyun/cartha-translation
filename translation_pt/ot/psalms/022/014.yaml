  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: pt
  text: 'Sou derramado como água,

    e todos os meus ossos se desconjuntam;

    meu coração se tornou como cera,

    derreteu-se dentro das minhas entranhas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “derreteu-se dentro de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: como água
  rationale: O prefixo כְּ marca comparação; “como água” preserva de modo natural a imagem poética.
- source_word: נִשְׁפַּכְתִּי
  choice: sou derramado
  rationale: O nifal de שׁפך descreve vividamente o salmista como alguém vertido ou esvaziado, sem exigir que se determine além do necessário o valor temporal da forma.
- source_word: וְהִתְפָּרְדוּ כָּל עַצְמוֹתַי
  choice: e todos os meus ossos se desconjuntam
  rationale: O hitpael de פרד indica separação ou afastamento mútuo; aplicado aos ossos, “se desconjuntam” transmite naturalmente a imagem corporal, sem tornar a expressão meramente abstrata.
- source_word: הָיָה לִבִּי כַּדּוֹנָג
  choice: meu coração se tornou como cera
  rationale: “Se tornou” expressa a passagem a um estado, e “como cera” conserva diretamente a comparação hebraica.
- source_word: נָמֵס
  choice: derreteu-se
  rationale: O verbo מסס significa derreter ou dissolver; “derreteu-se” prolonga com clareza a imagem da cera.
- source_word: בְּתוֹךְ מֵעָי
  choice: dentro das minhas entranhas
  rationale: מֵעִים designa literalmente as partes internas ou entranhas e pode representar o centro visceral das emoções; a formulação portuguesa é compreensível e mantém a corporeidade do hebraico.
theological_decisions:
- issue: Expressão antropológica da aflição interior
  choice: dentro das minhas entranhas
  alternative: dentro de mim
  rationale: A tradução principal preserva o termo corporal e visceral do hebraico, evitando convertê-lo silenciosamente numa categoria abstrata ou exclusivamente espiritual; a nota oferece a forma idiomática mais ampla.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira. O paralelismo foi disposto em versos; manteve-se a imagem visceral de “entranhas”, enquanto a nota registra uma alternativa corrente.
