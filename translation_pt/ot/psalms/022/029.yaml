  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: pt
  text: Todos os prósperos[a] da terra comerão e se prostrarão; diante dele se ajoelharão todos os que descem ao pó[b] — até mesmo aquele que não pôde conservar a própria vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todos os gordos da terra”. A expressão provavelmente se refere aos prósperos ou aos bem-alimentados.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os que descem ao pó”. O pó é uma imagem hebraica da mortalidade e da morte.
    reason: lexical_alternative
  - marker: c
    text: A oração hebraica final é difícil; de modo mais literal, “e sua vida ele não manteve viva”. Costuma ser entendida como referência àquele que não pôde conservar a própria vida.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: comerão
  rationale: Embora seja uma forma perfeita, o contexto poético e sua coordenação com ações seguintes permitem valor prospectivo; o futuro exprime naturalmente a visão abrangente do salmo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: e se prostrarão
  rationale: Preserva a imagem corporal de curvar-se até o chão, sem substituir o gesto pelo sentido interpretativo mais amplo de 'adorar'.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: todos os prósperos da terra
  rationale: דִּשְׁנֵי significa literalmente os 'gordos' ou bem alimentados e, por extensão, os prósperos; a escolha comunica o sentido social sem perder o contraste com os mortais da linha seguinte.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente direto, conciso e idiomático da expressão preposicional hebraica.
- source_word: יִכְרְעוּ
  choice: se ajoelharão
  rationale: כרע designa dobrar os joelhos ou ajoelhar-se; a tradução mantém uma imagem corporal distinta de 'se prostrarão'.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: todos os que descem ao pó
  rationale: Mantém a imagem hebraica do pó como destino dos mortais, em vez de interpretá-la diretamente como 'sepultura'.
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: até aquele que não pôde conservar a própria vida
  rationale: A oração é sintaticamente difícil. Esta formulação entende נֶפֶשׁ como 'vida' e o sujeito como alguém incapaz de preservar a si mesmo, mas registra em nota a literalidade e a incerteza do hebraico.
theological_decisions:
- issue: Sentido da oração final וְנַפְשׁוֹ לֹא חִיָּה
  choice: Referência a alguém que não pôde conservar a própria vida, incluído entre os que prestam homenagem.
  alternative: “e não conservou viva a sua vida” ou, de modo mais impessoal, “cuja vida não foi conservada”.
  rationale: O hebraico é condensado e discutido. A leitura escolhida acompanha o contraste poético entre os prósperos e os que se aproximam da morte, sem acrescentar uma afirmação doutrinária mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Prostrar-se”, “ajoelhar-se” e “descer ao pó” preservam o paralelismo e as imagens corporais do hebraico. Os marcadores foram colocados junto às expressões que explicam.
