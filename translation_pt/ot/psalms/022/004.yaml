  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: pt
  text: Em ti confiaram nossos pais; confiaram, e tu os livraste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ
  choice: Em ti
  rationale: A preposição ב com o sufixo de segunda pessoa marca o objeto pessoal da confiança. “Em ti” é natural em português e não acrescenta a ideia de exclusividade.
- source_word: בָּטְחוּ
  choice: confiaram
  rationale: בטח expressa confiança ou dependência segura. A repetição de “confiaram” nas duas orações preserva a ênfase do hebraico.
- source_word: אֲבֹתֵינוּ
  choice: nossos pais
  rationale: O substantivo hebraico é masculino e significa literalmente “nossos pais”; no contexto, pode designar as gerações anteriores do povo, mas a formulação concreta do original é mantida.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: e tu os livraste
  rationale: פלט significa livrar, resgatar ou fazer escapar. “Livraste” mantém o registro poético e religioso sem especificar além do texto a forma do resgate.
theological_decisions:
- issue: Sentido histórico e representativo de אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: “Nossos pais” conserva a forma masculina e a imagem de parentesco do hebraico, enquanto “nossos antepassados” explicita o sentido coletivo mais amplo. O texto principal mantém a expressão original sem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. A repetição verbal do hebraico foi preservada por seu valor enfático; a pontuação reproduz o paralelismo do verso.
