  text: כִּֽי אַתָּ֣ה גֹחִ֣/י מִ/בָּ֑טֶן מַ֝בְטִיחִ֗/י עַל שְׁדֵ֥י אִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: pt
  text: Pois tu és quem me tirou do ventre, quem me fez sentir seguro junto aos seios de minha mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem me fez confiar junto aos seios de minha mãe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o apelo e o louvor anteriores, preservando o fluxo argumentativo do salmo.
- source_word: אַתָּה
  choice: tu
  rationale: Mantém o pronome explícito e sua ênfase em Deus como aquele que age; “tu” também combina com o registro poético e com as formas verbais escolhidas.
- source_word: גֹחִי
  choice: quem me tirou
  rationale: Expressa naturalmente a ação de fazer sair no contexto do nascimento, sem transformar a imagem concreta em uma ideia mais interpretativa de livramento.
- source_word: מִבָּטֶן
  choice: do ventre
  rationale: Tradução direta da preposição e do substantivo no contexto do parto.
- source_word: מַבְטִיחִי
  choice: quem me fez sentir seguro
  rationale: O hifil de בטח pode indicar causar segurança ou confiança. No contexto da primeira infância, esta formulação comunica segurança sem exigir a ideia de confiança consciente e desenvolvida.
- source_word: עַל
  choice: junto aos
  rationale: Em português, exprime com naturalidade a proximidade própria da amamentação, correspondente à cena indicada pela preposição hebraica.
- source_word: שְׁדֵי
  choice: seios
  rationale: Traduz com precisão a referência anatômica do hebraico em linguagem atual e digna.
- source_word: אִמִּי
  choice: de minha mãe
  rationale: Preserva claramente o sufixo de primeira pessoa em construção possessiva natural em português.
theological_decisions:
- issue: Se מַבְטִיחִי deve indicar confiança explícita do bebê ou segurança mais ampla
  choice: quem me fez sentir seguro
  alternative: quem me fez confiar
  rationale: A segurança corresponde bem ao cuidado divino desde o nascimento e evita impor ao recém-nascido uma confiança conscientemente formulada. Como o sentido causativo de confiar continua lexicalmente plausível e tradicional, ele é preservado em nota.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. O paralelismo “quem... quem...” explicita naturalmente a relação dos dois particípios com o “tu” enfático. A nota preserva a ambiguidade lexical e teológica de מַבְטִיחִי.
