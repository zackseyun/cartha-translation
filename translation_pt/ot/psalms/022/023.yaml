  - severity: medium
    issue: Imperativos singulares «honre-o» e «trema»
    rationale: Embora a concordância formal com «descendência» seja possível em português, os imperativos hebraicos são plurais e se dirigem às pessoas abrangidas pelo coletivo. O plural mantém mais claramente essa força apelativa e o paralelismo das três linhas.
  - severity: low
