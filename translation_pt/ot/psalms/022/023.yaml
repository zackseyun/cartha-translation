base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: pt
  text: 'Vocês que temem Yahweh, louvem-no!


    Toda a descendência de Jacó, honrem-no!


    Temam-no[a], toda a descendência de Israel!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenham reverência por ele” ou “temam-no”. O verbo hebraico expressa temor reverente e pode incluir a ideia de tremor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Vocês que temem a Yahweh
  rationale: A construção designa aqueles que se caracterizam pelo temor de Yahweh. O pronome explicita em português a interpelação direta indicada pelos imperativos seguintes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַלְלוּהוּ
  choice: louvem-no
  rationale: O imperativo plural com sufixo masculino singular significa literalmente 'louvem-no'; o pronome retoma Yahweh.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: Toda a descendência de Jacó
  rationale: זֶרַע tem sentido coletivo. 'Descendência' é natural em português, conserva essa coletividade e mantém a abrangência de כָּל.
- source_word: כַּבְּדֻהוּ
  choice: honre-o
  rationale: O imperativo de כבד pede que se atribua a Deus a honra devida. A concordância no singular acompanha o coletivo 'descendência' em português.
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: Trema diante dele
  rationale: '''Tremer diante dele'' comunica temor intenso e reverente sem reduzir o verbo a simples repetição de ''temer'' no primeiro verso. ''Diante dele'' é uma construção portuguesa natural para o objeto desse temor.'
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: toda a descendência de Israel
  rationale: Mantém o sentido coletivo de זֶרַע e o paralelismo poético com 'toda a descendência de Jacó'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance de וְגוּרוּ מִמֶּנּוּ
  choice: Trema diante dele
  alternative: Tema-o; reverencie-o
  rationale: A formulação preserva a tensão entre reverência e temor, bem como a força crescente da convocação poética, sem interpretar o verbo como mero respeito abstrato.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. As formas singulares 'honre-o' e 'trema' fazem concordância com o substantivo coletivo singular 'descendência', embora os imperativos hebraicos sejam plurais por se dirigirem às pessoas que compõem essa descendência.
