  text: All who see me mock me[a]; they open wide the lip[b]; they shake the head.
translation:
  language: pt
  text: Todos os que me veem zombam de mim; abrem os lábios em escárnio[a] e balançam a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “abrem o lábio”. A expressão retrata um gesto de desprezo e pode também sugerir fala zombeteira.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, em gesto de desprezo. Compare Mateus 27:39 e Marcos 15:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Todos os que me veem
  rationale: O quantificador כָּל abrange a totalidade dos observadores, e o particípio רֹאַי, com sufixo de primeira pessoa, é expresso naturalmente em português por uma oração relativa.
- source_word: יַלְעִגוּ לִי
  choice: zombam de mim
  rationale: לעג no hifil comunica escárnio dirigido ao salmista; “zombam de mim” é claro, corrente e preserva a força do hebraico.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: fazem um gesto de desprezo com os lábios
  rationale: A construção é literalmente ligada a abrir ou mover o lábio, mas funciona como gesto de escárnio. A tradução comunica o sentido sem perder a imagem corporal; a nota preserva a forma mais literal e a possível dimensão verbal.
- source_word: יָנִיעוּ רֹאשׁ
  choice: balançam a cabeça
  rationale: A expressão descreve um movimento da cabeça como gesto de desprezo. “Balançam a cabeça” é natural em português e mantém a imagem concreta.
theological_decisions:
- issue: Uso messiânico na interpretação cristã posterior
  choice: Traduzir o versículo em primeiro lugar como fala do salmista sofredor, sem inserir linguagem cristológica explícita.
  alternative: Explicitar no texto a associação com a paixão de Jesus.
  rationale: A redação segue o texto hebraico em seu contexto salmódico. A nota pode indicar o eco posterior nos relatos da paixão sem transformar essa recepção em conteúdo explícito do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo dos gestos de escárnio e usa notas para preservar a imagem literal e a recepção posterior do versículo.
