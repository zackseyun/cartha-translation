source:
  edition: WLC
  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: pt
  text: Eles virão e anunciarão a sua justiça[a] a um povo ainda por nascer[b], que ele o fez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua retidão”. O termo hebraico pode designar a justiça em sentido amplo, inclusive a ação justa e salvadora.
    reason: lexical_alternative
  - marker: b
    text: Ou “a um povo que nascerá”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pois ele o fez”. A breve oração final hebraica pode ser entendida como o conteúdo anunciado ou como a razão do anúncio.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Eles virão
  rationale: O qal imperfeito na terceira pessoa do plural indica ação futura; esta formulação é natural e preserva a perspectiva futura.
- source_word: וְיַגִּידוּ
  choice: e anunciarão
  rationale: O hifil imperfeito de נגד expressa tornar conhecido ou proclamar; “anunciarão” mantém o tom público e testemunhal.
- source_word: צִדְקָתוֹ
  choice: a sua justiça
  rationale: צדקה abrange retidão, justiça e ação justa ou salvadora. Em português corrente, “justiça” preserva melhor essa amplitude; a alternativa “retidão” consta em nota.
- source_word: לְעַם
  choice: a um povo
  rationale: A preposição לְ marca o destinatário do anúncio, e o substantivo é indefinido.
- source_word: נוֹלָד
  choice: que ainda nascerá
  rationale: O particípio passivo de ילד modifica “povo” e, no contexto, aponta para uma geração futura. A locução é natural em português.
- source_word: כִּי
  choice: ': que'
  rationale: כִּי pode introduzir o conteúdo da proclamação. Os dois-pontos tornam clara a relação sem eliminar a possível leitura causal, registrada em nota.
- source_word: עָשָׂה
  choice: ele o fez
  rationale: O qal perfeito de עשה é deliberadamente breve, e seu objeto não está expresso. “Ele o fez” conserva o caráter conciso e culminante.
theological_decisions:
- issue: Sentido de צִדְקָה neste salmo
  choice: “justiça” no texto principal
  alternative: “retidão” ou “justiça salvadora”
  rationale: O termo pode abranger o caráter justo e a ação justa e salvadora de Deus. “Justiça” mantém essa amplitude sem inserir no texto principal uma explicação interpretativa.
- issue: Função da oração final כִּי עָשָׂה
  choice: 'conteúdo anunciado: “que ele o fez”'
  alternative: 'causa da proclamação: “pois ele o fez”'
  rationale: A construção hebraica é concisa e admite ambas as relações. A leitura como conteúdo se ajusta bem ao verbo “anunciarão”, enquanto a alternativa causal é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Anunciarão” preserva o tom público do salmo; a frase final permanece breve e enfática.
