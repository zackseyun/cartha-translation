base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: pt
  text: Livra da espada a minha vida[a]; do poder[b] do cão, a minha única[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha alma”. O hebraico נֶפֶשׁ pode indicar a vida, o próprio ser ou a alma, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da mão”. Aqui, “mão” é uma expressão que indica poder ou domínio.
    reason: lexical_alternative
  - marker: c
    text: Ou “a minha vida preciosa”. O hebraico significa literalmente “minha única”; a forma feminina pode retomar poeticamente “vida” na linha anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Livra
  rationale: O imperativo de נצל expressa um apelo direto e urgente por resgate. “Livra” é natural na linguagem de oração e não acrescenta detalhes interpretativos.
- source_word: מֵחֶרֶב
  choice: da espada
  rationale: A preposição מן indica afastamento de uma ameaça. O artigo definido mantém a imagem da espada como representação concreta do perigo mortal.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste lamento, נפש designa mais naturalmente a vida ou o ser vivente do salmista, ameaçado de morte, e não exige a noção técnica de uma alma imaterial.
- source_word: מִיַּד
  choice: do poder
  rationale: Embora יד signifique literalmente “mão”, a expressão idiomática indica poder, domínio ou controle. “Do poder” comunica esse sentido com clareza em português atual.
- source_word: כֶּלֶב
  choice: do cão
  rationale: O hebraico usa o singular e apresenta uma imagem vívida do inimigo. O singular foi preservado sem explicitar a metáfora.
- source_word: יְחִידָתִי
  choice: a minha única vida
  rationale: O termo feminino significa literalmente “minha única” e retoma poeticamente נַפְשִׁי. A repetição de “vida” torna a referência inteligível em português, preservando a ideia de unicidade sem substituí-la silenciosamente por “preciosa”.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי no contexto do lamento
  choice: “a minha vida”
  alternative: “a minha alma”
  rationale: O contexto trata de livramento diante de armas e inimigos, portanto o termo aponta para a vida ou o próprio ser do salmista. Essa escolha evita impor ao texto uma antropologia dualista mais técnica.
- issue: Referência de יְחִידָתִי
  choice: “a minha única vida”
  alternative: “a minha única” ou “a minha vida preciosa”
  rationale: A forma feminina substantivada provavelmente retoma “minha vida” na linha anterior. A tradução mantém tanto a ligação paralela quanto a ideia explícita de unicidade; “preciosa” é possível por extensão, mas acrescenta uma nuance avaliativa.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal amplamente compreensível no Brasil e em outras comunidades lusófonas. O paralelismo hebraico e o singular metafórico “cão” foram preservados. A ordem “Livra da espada a minha vida” mantém a progressão poética da fonte sem soar arcaica em excesso.
