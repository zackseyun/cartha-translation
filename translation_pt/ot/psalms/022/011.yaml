lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Não fiques longe de mim
  rationale: Preserva a metáfora espacial e a força de súplica da construção hebraica, sem ampliá-la para a ideia mais forte de abandono.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da súplica. A repetição de “pois” nas duas ocorrências conserva a estrutura e o paralelismo do hebraico.
- source_word: צָרָה קְרוֹבָה
  choice: a aflição está perto
  rationale: “Aflição” expressa adversidade ou sofrimento sem restringir o referente a um perigo específico; “está perto” mantém a imagem espacial e a urgência do texto.
- source_word: אֵין עוֹזֵר
  choice: não há quem ajude
  rationale: Traduz de modo natural a partícula de inexistência e o particípio substantivado, preservando o sentido pessoal de alguém que preste ajuda.
theological_decisions:
- issue: Linguagem da distância divina no lamento
  choice: Não fiques longe de mim
  alternative: Não me abandones
  rationale: O hebraico emprega linguagem espacial. Traduzir por “abandones” acrescentaria uma afirmação teológica mais forte do que o texto faz; a opção escolhida preserva a tensão do lamento.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal amplamente compreensível. A disposição em três linhas acompanha as unidades poéticas e mantém a repetição deliberada de “pois”.
