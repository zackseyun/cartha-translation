  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: pt
  text: 'Não fiques longe de mim,

    pois a aflição[a] está perto,

    pois não há quem ajude.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a angústia”. O substantivo hebraico pode indicar aflição, angústia ou adversidade.
