  text: אֲסַפְּרָ֣ה שִׁמְ/ךָ֣ לְ/אֶחָ֑/י בְּ/ת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: pt
  text: Proclamarei o teu nome aos meus irmãos[a]; no meio da assembleia, eu te louvarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos meus irmãos e às minhas irmãs”, caso o tratamento familiar seja entendido de modo inclusivo neste contexto; literalmente, o hebraico diz “aos meus irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Proclamarei
  rationale: O piel de ספר expressa contar, narrar ou declarar. “Proclamarei” comunica aqui o testemunho público e forma um paralelo natural com o louvor na assembleia.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém o idioma hebraico, no qual o “nome” representa a identidade, o caráter revelado e a reputação de Deus, sem reduzir seu alcance.
- source_word: לְאֶחָי
  choice: aos meus irmãos
  rationale: Preserva o substantivo masculino plural com sufixo de primeira pessoa. A possível abrangência comunitária inclusiva é indicada em nota, sem substituir a forma explícita do hebraico no texto principal.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Conserva a imagem espacial e pública do hebraico em português natural e digno.
- source_word: קָהָל
  choice: assembleia
  rationale: קָהָל designa o grupo reunido. “Assembleia” preserva esse sentido coletivo sem impor uma associação eclesiástica posterior.
- source_word: אֲהַלְלֶךָּ
  choice: eu te louvarei
  rationale: Traduz diretamente o piel de הלל e conserva o objeto pronominal. O pronome “eu” explicita o sujeito e sustenta o paralelismo poético sem acrescentar conteúdo.
theological_decisions:
- issue: Termo de parentesco masculino em contexto de culto comunitário
  choice: aos meus irmãos
  alternative: aos meus irmãos e às minhas irmãs
  rationale: O hebraico traz literalmente um substantivo masculino plural. A tradução principal preserva essa forma; a possível referência inclusiva à comunidade é registrada em nota, mantendo a ambiguidade contextual sem ampliá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A colocação pronominal em “eu te louvarei” é natural no português brasileiro, enquanto “assembleia” evita tanto arcaísmo quanto especificidade denominacional.
