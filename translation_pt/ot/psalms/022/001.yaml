base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: pt
  text: Meu Deus, meu Deus, por que me abandonaste? Longe da minha salvação[a] estão as palavras do meu rugido[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do meu livramento” ou “do meu socorro”. O hebraico יְשׁוּעָה pode indicar salvação, livramento ou ajuda salvadora.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do meu gemido” ou “do meu clamor”. O hebraico diz literalmente “do meu rugido”, imagem vívida de angústia intensa.'
    reason: lexical_alternative
  - marker: c
    text: 'Outra possível leitura da construção hebraica: “Por que estás longe de me salvar, longe das palavras do meu rugido?”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: Meu Deus, meu Deus
  rationale: Preserva a repetição, o sufixo possessivo e a força da invocação direta, sem acrescentar uma interpretação.
- source_word: לָמָה
  choice: por que
  rationale: É a forma interrogativa natural em português e mantém a força da lamentação.
- source_word: עֲזַבְתָּנִי
  choice: me abandonaste
  rationale: Expressa com clareza o sentido de deixar ou desamparar. O pretérito perfeito reproduz naturalmente o perfeito hebraico neste clamor.
- source_word: רָחוֹק מִישׁוּעָתִי
  choice: Longe da minha salvação
  rationale: Mantém a estrutura nominal comprimida do hebraico e conserva a amplitude de יְשׁוּעָה, que pode indicar salvação, livramento ou socorro.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: as palavras do meu rugido
  rationale: Preserva tanto a relação construta de דִּבְרֵי quanto a imagem intensa de שַׁאֲגָה, termo associado literalmente a um rugido e, por extensão, a um grito de profunda angústia.
theological_decisions:
- issue: Sentido de יְשׁוּעָה em um salmo de relevância messiânica
  choice: minha salvação
  alternative: meu livramento; meu socorro
  rationale: “Salvação” preserva a amplitude lexical do hebraico sem restringir o termo a uma formulação doutrinária posterior. As alternativas concretas permanecem registradas em nota.
- issue: Construção sintática do segundo hemistíquio
  choice: Longe da minha salvação estão as palavras do meu rugido
  alternative: Por que estás longe de me salvar, longe das palavras do meu rugido?
  rationale: O hebraico é comprimido e admite mais de uma análise. O texto principal conserva de perto sua forma nominal e sua tensão, enquanto a nota registra a leitura que entende o segundo hemistíquio como continuação da pergunta dirigida a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação deliberadamente incomum do segundo período acompanha a expressão comprimida do hebraico; as notas esclarecem as principais alternativas sem eliminar a ambiguidade do original.
