  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: pt
  text: “Entregue-se a Yahweh[a]! Que ele o salve; que ele o livre, pois tem prazer nele!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Role para Yahweh”. A expressão idiomática significa entregar-se a ele ou entregar-lhe a própria causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Entregue-se
  rationale: O imperativo significa literalmente “role”, mas, nesta construção com a preposição אֶל e o nome divino, funciona como expressão idiomática para confiar ou entregar a Deus a si mesmo ou a própria causa. “Entregue-se” comunica o sentido em português natural sem apagar a imagem literal, registrada em nota.
- source_word: אֶל
  choice: a
  rationale: A preposição indica direção para Yahweh; “entregar-se a Yahweh” é a construção corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְפַלְּטֵהוּ
  choice: Que ele o salve
  rationale: O piel de פלט expressa fazer escapar ou pôr a salvo. “Salve” é claro e natural no desafio irônico, mantendo distinção vocabular em relação ao verbo seguinte.
- source_word: יַצִּילֵהוּ
  choice: que ele o livre
  rationale: O hiphil de נצל significa livrar, retirar do perigo ou arrebatar. “Livre” preserva o paralelismo sem tornar os dois verbos idênticos.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão alegada pelos zombadores e conserva de modo conciso a força causal.
- source_word: חָפֵץ בּוֹ
  choice: tem prazer nele
  rationale: A construção denota ter prazer ou deleitar-se em alguém. A formulação é natural e conserva o caráter relacional da expressão.
theological_decisions:
- issue: Zombaria citada e mudança de pessoa gramatical
  choice: Manter o imperativo dirigido ao sofredor — “Entregue-se” — seguido das referências na terceira pessoa — “o salve”, “o livre”.
  alternative: Converter a primeira expressão em terceira pessoa, como “Entregue-o a Yahweh”, para uniformizar os pronomes.
  rationale: O texto massorético traz um imperativo sem objeto expresso, seguido por verbos com sufixo masculino de terceira pessoa. Preservar essa mudança mantém a forma e a tensão retórica do hebraico, entendida no contexto como fala zombeteira, sem inserir no primeiro membro um objeto que o texto não explicita.
- issue: Motivo atribuído a Yahweh
  choice: “pois tem prazer nele”
  alternative: “se é que tem prazer nele”
  rationale: O hebraico apresenta uma oração causal, não uma condição explícita. A ironia decorre do contexto da zombaria e não precisa ser acrescentada lexicalmente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com ritmo de provocação poética. A repetição de “que ele” torna claros os sujeitos e preserva o paralelismo enfático do hebraico.
