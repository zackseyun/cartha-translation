  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: pt
  text: Mas eu sou um verme, e não um homem, alvo de desprezo da humanidade e desprezado pelo povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Mas eu
  rationale: O pronome enfático אָנֹכִי é “eu”; a conjunção marca aqui forte contraste com a confiança expressa anteriormente, bem representado por “Mas”.
- source_word: תוֹלַעַת
  choice: um verme
  rationale: Preserva a imagem hebraica de extrema humilhação e baixeza sem especificar indevidamente a espécie.
- source_word: וְ/לֹא אִישׁ
  choice: e não um homem
  rationale: Mantém a contraposição direta e contundente entre “verme” e אִישׁ, aqui um indivíduo humano, além da forma singular do original.
- source_word: חֶרְפַּת אָדָם
  choice: desprezado pela humanidade
  rationale: Expressa de modo natural que o falante é objeto de afronta ou desprezo humano; אָדָם tem sentido coletivo neste contexto.
- source_word: וּ/בְזוּי
  choice: e rejeitado
  rationale: O particípio passivo indica alguém tido em desprezo. “Rejeitado” evita a repetição pouco elegante de “desprezado” e conserva a ideia de repúdio público.
- source_word: עָם
  choice: pelo povo
  rationale: Representa o substantivo coletivo עָם e preserva o paralelismo referente ao desprezo público.
theological_decisions:
- issue: Uso messiânico/prototipológico na interpretação cristã
  choice: Traduzir segundo o sentido poético hebraico de humilhação, sem acrescentar linguagem messiânica explícita.
  alternative: Empregar uma formulação interpretativa que destaque diretamente o cumprimento cristológico.
  rationale: Embora o Salmo 22 tenha grande relevância cristológica no Novo Testamento e na tradição cristã, o versículo fala na voz do salmista por meio de imagens de humilhação. A tradução deve permitir que as conexões canônicas surjam do contexto, sem inseri-las no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o forte contraste inicial e o paralelismo poético, usando “humanidade” para o sentido coletivo de אָדָם e “povo” para עָם.
