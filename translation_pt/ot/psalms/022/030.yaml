  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: pt
  text: Uma descendência o servirá; será proclamado a respeito do Senhor à geração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: descendência
  rationale: O substantivo coletivo pode significar semente ou descendência. Neste contexto humano e geracional, “descendência” é natural sem perder o sentido coletivo do hebraico.
- source_word: יַעַבְדֶנּוּ
  choice: o servirá
  rationale: Preserva o singular coletivo do sujeito זֶרַע e o sufixo pronominal masculino, cujo referente contextual é Deus.
- source_word: יְסֻפַּר
  choice: falarão
  rationale: O pual impessoal de ספר significa literalmente “será contado/relatado”. A construção impessoal portuguesa “falarão” comunica naturalmente que algo será anunciado, sem inserir um agente específico.
- source_word: לַאדֹנָי
  choice: do Senhor
  rationale: A preposição ל pode marcar o assunto (“acerca de”). “Do Senhor” mantém essa relação e segue a leitura massorética אֲדֹנָי.
- source_word: לַדּוֹר
  choice: à geração futura
  rationale: O hebraico diz literalmente “à geração”. No fluxo para o versículo seguinte, trata-se da geração que virá; “futura” torna explícita essa referência contextual.
theological_decisions:
- issue: Referente do pronome em “o servirá”
  choice: Manter o pronome sem substituir por um nome divino
  alternative: “servirá ao Senhor”
  rationale: O hebraico usa um sufixo pronominal. Preservá-lo evita resolver além do texto a referência pelo contexto.
- issue: Conteúdo do anúncio
  choice: “falarão do Senhor”
  alternative: “isso será relatado ao Senhor”
  rationale: לַאדֹנָי admite formalmente mais de uma relação, mas aqui é mais plausível entendê-lo como assunto do relato. A alternativa dativa permanece uma possibilidade gramatical.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Descendência” evita o literalismo pouco natural de “uma semente”; o singular coletivo é mantido em “servirá”. A formulação conecta naturalmente o versículo ao anúncio dirigido à geração vindoura no versículo seguinte.
