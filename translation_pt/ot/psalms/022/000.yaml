base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/000.yaml
  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: pt
  text: 'Ao regente: conforme “A Corça da Alvorada”[a]. Salmo de Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A Cerva da Alvorada”. A expressão hebraica provavelmente é o nome de uma melodia ou de um arranjo musical.
    reason: lexical_alternative
  - marker: b
    text: “De Davi” pode indicar autoria, associação, coleção ou dedicação; o hebraico não especifica uma dessas possibilidades.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa o responsável pela execução musical. “Ao regente” é conciso, natural em português e mantém a função musical sem especificá-la além do hebraico.
- source_word: עַל
  choice: conforme
  rationale: Neste contexto musical, a preposição provavelmente introduz uma melodia, estilo ou indicação de execução. “Conforme” preserva essa relação sem tornar explícito demais “para ser cantado com a melodia de”.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: A Corça da Alvorada
  rationale: “Corça” representa o substantivo feminino singular, e “alvorada” comunica naturalmente o romper do dia. As maiúsculas e aspas apresentam a expressão como provável título musical.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação portuguesa tradicional e clara para uma composição poético-musical deste tipo.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A formulação mantém a amplitude da preposição hebraica, que pode indicar autoria, associação, pertencimento a uma coleção ou dedicação, sem restringi-la a “por Davi”.
theological_decisions:
- issue: Função de אַיֶּלֶת הַשַּׁחַר no título
  choice: Apresentar como provável título de uma melodia ou indicação musical
  alternative: Entender a expressão como título simbólico ou temático ligado ao conteúdo do salmo
  rationale: A construção com עַל nos títulos dos salmos favorece uma função musical. As aspas sinalizam um título, enquanto a nota preserva a incerteza.
- issue: Sentido de לְדָוִד
  choice: Traduzir de modo amplo como “de Davi”
  alternative: Especificar autoria (“por Davi”) ou dedicação (“para Davi”)
  rationale: O hebraico não determina aqui uma única relação. A tradução evita resolver uma ambiguidade real do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Ao regente” evita formulações excessivamente técnicas; “corça” é corrente e preserva o gênero feminino do hebraico.
