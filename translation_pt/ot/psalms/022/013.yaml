lexical_decisions:
- source_word: פָּצ֣וּ
  choice: escancaram
  rationale: O verbo פצה significa abrir bem ou escancarar. O presente transmite a vivacidade poética do perfeito hebraico e expressa naturalmente a abertura ameaçadora da boca.
- source_word: עָלַי
  choice: contra mim
  rationale: Neste contexto hostil, עַל indica direção adversa; “contra mim” comunica essa força com clareza.
- source_word: פִּיהֶם
  choice: a boca
  rationale: Mantém o substantivo singular do hebraico com sujeito plural, uso coletivo compreensível em português.
- source_word: אַרְיֵה
  choice: como um leão
  rationale: Embora não haja partícula comparativa explícita, a imagem em aposição funciona naturalmente como comparação em português.
- source_word: טֹרֵף
  choice: que dilacera
  rationale: O particípio de טרף descreve a ação violenta do predador; “dilacera” preserva a força da imagem sem arcaísmo.
- source_word: וְשֹׁאֵג
  choice: e ruge
  rationale: שׁאג é o verbo habitual para o rugido do leão; “ruge” é a correspondência direta e natural.
