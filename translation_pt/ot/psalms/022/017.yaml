lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Posso contar
  rationale: O piel de ספר pode significar “contar” ou “narrar”. Com “todos os meus ossos” como objeto, o sentido mais provável é enumerá-los; “posso contar” expressa naturalmente que eles estão visíveis ou perceptíveis um a um.
- source_word: כָּל
  choice: todos
  rationale: Preserva diretamente a ideia de totalidade do hebraico.
- source_word: עַצְמוֹתַי
  choice: meus ossos
  rationale: A tradução literal conserva a imagem física vívida sem acrescentar uma explicação interpretativa.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente e enfático refere-se aos observadores hostis; o pronome explícito em português preserva essa mudança de sujeito.
- source_word: יַבִּיטוּ
  choice: olham
  rationale: O verbo indica olhar com atenção. “Olham” é atual e natural, enquanto o verbo seguinte intensifica a ação.
- source_word: יִרְאוּ
  choice: ficam me encarando
  rationale: Embora ראה normalmente signifique “ver”, sua combinação com יַבִּיטוּ produz ênfase. “Ficam me encarando” comunica o olhar demorado e hostil sem recorrer a linguagem arcaica.
- source_word: בִי
  choice: me
  rationale: Com “encarar”, o objeto direto é a construção idiomática natural em português e mantém o sofredor como alvo do olhar.
theological_decisions:
- issue: Uso messiânico na tradição cristã
  choice: Traduzir de acordo com o sentido poético hebraico, sem inserir na linha principal linguagem específica da crucificação.
  alternative: Empregar uma formulação moldada pela tradição que ressalte mais explicitamente a ressonância cristológica.
  rationale: O Salmo 22 tem grande importância na interpretação cristã, mas este versículo descreve, em seus próprios termos, sofrimento corporal visível e espectadores hostis. A tradução deixa que as relações canônicas e cristológicas surjam do contexto, sem acrescentá-las ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficam me encarando” é coloquial sem ser informal demais e reproduz a intensificação dos dois verbos hebraicos; a próclise é natural no português brasileiro. A ordem das duas orações e a imagem concreta dos ossos foram preservadas.
