  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: pt
  text: Salva-me da boca do leão e dos chifres dos bois selvagens[a] — tu me respondeste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “touros selvagens” ou “auroques”; o hebraico se refere a um bovino selvagem poderoso.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final pode ser entendida como uma declaração repentina de que a oração foi atendida: “tu me respondeste”, marcando a passagem da súplica para a confiança.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Salva-me
  rationale: O imperativo hifil com sufixo de primeira pessoa expressa um pedido direto e urgente de livramento; “Salva-me” conserva a amplitude do verbo e é natural em português bíblico atual.
- source_word: מִפִּי
  choice: da boca do
  rationale: Reproduz literalmente a imagem hebraica sem causar estranheza em português; “das fauces” seria mais interpretativo.
- source_word: אַרְיֵה
  choice: leão
  rationale: A expressão “da boca do leão” soa natural e mantém a imagem poética singular, usada genericamente.
- source_word: וּמִקַּרְנֵי
  choice: e dos chifres dos
  rationale: Mantém tanto a coordenação do segundo perigo quanto a imagem concreta dos chifres.
- source_word: רֵמִים
  choice: bois selvagens
  rationale: O termo designa bovinos selvagens poderosos, provavelmente auroques; “bois selvagens” é claro ao leitor comum e evita a tradução tradicional inexata “unicórnios”.
- source_word: עֲנִיתָנִי
  choice: tu me respondeste
  rationale: O perfeito qal de segunda pessoa masculina singular é uma declaração abrupta. O pretérito perfeito preserva naturalmente em português a passagem súbita da súplica à certeza de que Deus respondeu.
theological_decisions:
- issue: Se עֲנִיתָנִי continua a súplica ou declara que a oração foi respondida
  choice: 'Declaração: “tu me respondeste”'
  alternative: Entender a frase no fluxo da petição, como “responde-me” ou associá-la ao livramento dos chifres
  rationale: A forma hebraica é perfeita, não imperativa, e a declaração abrupta assinala adequadamente a virada literária que conduz ao louvor no versículo seguinte. A nota registra a questão sem converter o texto principal numa súplica contínua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto à expressão que explica. O travessão conserva a ruptura sintática e tonal do hebraico.
