  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: pt
  text: Sobre ti fui lançado desde o útero[a]; desde o ventre de minha mãe tu és o meu Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o ventre”. O hebraico usa aqui רֶחֶם, termo que designa o útero ou ventre materno; na linha seguinte aparece בֶּטֶן, “ventre”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tu tens sido o meu Deus”. A oração hebraica é literalmente “meu Deus [és] tu” e não traz verbo expresso; o contexto pode indicar uma relação contínua desde o nascimento.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Sobre ti
  rationale: Preserva a imagem de ser colocado sobre Deus, isto é, sob seu cuidado, sem substituí-la por uma explicação interpretativa.
- source_word: הָשְׁלַכְתִּי
  choice: fui lançado
  rationale: Reproduz a forma passiva e a imagem vívida do verbo hebraico; opções como “fui entregue aos teus cuidados” explicitariam mais do que o texto diz.
- source_word: מֵרָחֶם
  choice: desde o útero
  rationale: Traduz concretamente רֶחֶם e permite conservar a variação lexical em relação a בֶּטֶן na linha seguinte.
- source_word: מִבֶּטֶן אִמִּי
  choice: desde o ventre de minha mãe
  rationale: Mantém o sentido concreto de בֶּטֶן e distingue o termo do anterior, ao mesmo tempo que soa natural em português poético.
- source_word: אֵלִי
  choice: o meu Deus
  rationale: Expressa diretamente o substantivo אֵל com o sufixo possessivo de primeira pessoa.
- source_word: אָתָּה
  choice: tu és
  rationale: A oração hebraica não contém verbo expresso. O presente em português preserva melhor essa forma e pode comunicar uma relação que começou no nascimento e continua.
theological_decisions:
- issue: Tempo verbal da oração nominal final
  choice: tu és o meu Deus
  alternative: tu tens sido o meu Deus
  rationale: O hebraico אֵלִי אָתָּה significa literalmente “meu Deus [és] tu” e não especifica o tempo verbal. O presente preserva essa ambiguidade e, em português, pode naturalmente incluir a continuidade da relação desde o ventre; a alternativa explicita essa continuidade.
translation_notes:
  register: Português moderno, digno e poético, com uso de “tu” coerente com a fala dirigida a Deus. A ordem inicial “Sobre ti” conserva a ênfase do hebraico. A distinção entre “útero” e “ventre” procura refletir os dois substantivos hebraicos sem apagar a variação poética.
