  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: pt
  text: Todos os confins da terra se lembrarão e voltarão para Yahweh[b], e todas as famílias das nações se prostrarão diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorarão diante de ti”. O verbo hebraico significa literalmente curvar-se ou prostrar-se, muitas vezes como ato de adoração.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “o SENHOR”; aqui se traduz pelo nome divino Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: se lembrarão
  rationale: O Qal imperfeito de זכר tem aqui força futura e conserva o sentido direto de trazer à memória.
- source_word: וְיָשֻׁבוּ
  choice: e voltarão
  rationale: שוב com אֶל expressa movimento de retorno ou conversão em direção a Yahweh; “voltarão” preserva isso sem explicitar além do texto a ideia de arrependimento.
- source_word: אֶל יְהוָה
  choice: para Yahweh
  rationale: אֶל indica direção, e o nome divino יהוה é transliterado como “Yahweh” para preservar o nome próprio do texto hebraico.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: todos os confins da terra
  rationale: A expressão designa as extremidades ou regiões mais distantes da terra; “confins da terra” é natural, digna e mantém o alcance universal.
- source_word: וְיִשְׁתַּחֲווּ
  choice: e ... se prostrarão
  rationale: A forma verbal de שחה descreve curvar-se ou prostrar-se em reverência. “Se prostrarão” preserva a ação corporal e deixa que o contexto comunique seu caráter de adoração.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Equivalente idiomático de “diante da tua face”, preservando a segunda pessoa masculina singular e a mudança para o discurso direto.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: todas as famílias das nações
  rationale: מִשְׁפְּחוֹת indica famílias ou clãs, e גּוֹיִם refere-se amplamente às nações; a formulação mantém ambas as dimensões.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; a convenção tradicional é indicada em nota.
- issue: Sentido cultual de וְיִשְׁתַּחֲווּ
  choice: se prostrarão
  alternative: adorarão
  rationale: O verbo retrata concretamente o ato de prostrar-se, frequentemente como adoração. A escolha conserva a imagem sem eliminar nem impor de modo explícito a nuance cultual.
- issue: Mudança da terceira pessoa para a segunda pessoa em לְפָנֶיךָ
  choice: diante de ti
  alternative: diante dele
  rationale: O sufixo hebraico é inequivocamente de segunda pessoa singular. A tradução mantém a mudança retórica do nome “Yahweh” para o discurso dirigido diretamente a Deus.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo poético, o alcance universal e a mudança do discurso sobre Yahweh para o discurso direto a ele. Os marcadores aparecem junto aos elementos que esclarecem.
