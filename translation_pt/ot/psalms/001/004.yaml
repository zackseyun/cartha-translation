  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: pt
  text: Não é assim com os perversos; pelo contrário, são como a palha que o vento leva embora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Não é assim com
  rationale: Preserva a negação abrupta e o contraste com o justo do versículo anterior, ao mesmo tempo que completa a elipse de modo natural em português.
- source_word: הָרְשָׁעִים
  choice: os perversos
  rationale: Expressa pessoas moralmente corrompidas no contexto sapiencial, sem reduzir o termo ao sentido meramente jurídico de culpados.
- source_word: כִּי אִם
  choice: pelo contrário
  rationale: 'Transmite a forte correção adversativa: eles não são como a árvore antes descrita, mas como a palha.'
- source_word: כַּמֹּץ
  choice: como a palha
  rationale: Refere-se ao resíduo leve separado do cereal; 'palha' é uma forma clara e consagrada de preservar a imagem agrícola em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo simples e natural para introduzir a ação sofrida pela palha.
- source_word: תִּדְּפֶנּוּ
  choice: leva embora
  rationale: Representa o movimento de ser impelido e removido pelo vento em português corrente; a nota registra uma alternativa que explicita o sopro.
- source_word: רוּחַ
  choice: o vento
  rationale: Na imagem da debulha, o sentido concreto de vento é inequívoco, e o artigo definido soa natural em português.
