source:
  edition: WLC
  text: כִּ֤י אִ֥ם בְּ/תוֹרַ֥ת יְהוָ֗ה חֶ֫פְצ֥/וֹ וּֽ/בְ/תוֹרָת֥/וֹ יֶהְגֶּ֗ה יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: pt
  text: Pelo contrário, seu prazer está na lei de Yahweh[a], e na sua lei medita[b] dia e noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode sugerir murmurar ou recitar em voz baixa enquanto se medita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pelo contrário
  rationale: Após as negações do versículo 1, a expressão introduz um contraste enfático, não uma causa. “Pelo contrário” comunica com naturalidade a oposição entre a conduta rejeitada e a disposição do justo.
- source_word: בְּתוֹרַת
  choice: na lei de
  rationale: תּוֹרָה pode significar “instrução”, mas aqui também carrega o sentido da revelação normativa e pactual de Deus. “Lei” preserva esse peso tradicional, com a alternativa registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֶפְצוֹ
  choice: seu prazer
  rationale: O substantivo indica aquilo em que alguém encontra prazer ou satisfação. A expressão é clara e conserva a orientação afetiva do justo para a lei de Yahweh.
- source_word: וּבְתוֹרָתוֹ
  choice: e na sua lei
  rationale: O sufixo remete naturalmente a Yahweh. A repetição de “lei” preserva o paralelismo hebraico, enquanto “na” é idiomático em português com “meditar”.
- source_word: יֶהְגֶּה
  choice: medita
  rationale: הגה abrange meditar, refletir e também murmurar ou recitar em voz baixa. “Medita” expressa adequadamente o envolvimento reflexivo contínuo; a nuance vocal é preservada em nota.
- source_word: יוֹמָם וָלָיְלָה
  choice: dia e noite
  rationale: Mantém o merismo hebraico que exprime constância e preserva a concisão poética.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto de um salmo sapiencial
  choice: lei
  alternative: instrução
  rationale: “Lei” conserva a dimensão normativa, pactual e escriturística do ensino de Yahweh, sem negar o sentido mais amplo de “instrução”, apresentado em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino pessoal. A transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Amplitude semântica de הגה
  choice: medita
  alternative: murmura; recita em voz baixa
  rationale: O contexto sapiencial favorece a ideia de reflexão perseverante, mas o verbo pode envolver enunciação audível; essa tensão lexical é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e explicita em notas as amplitudes semânticas de תּוֹרָה e הגה.
