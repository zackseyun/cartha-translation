id: PSA.1.3
reference: Psalms 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: pt
  text: Ele será como uma árvore plantada junto a canais de água, que dá seu fruto na estação própria e cuja folha não murcha; em tudo o que faz, ele prospera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que ele faz prospera”. O hebraico também pode ser entendido fazendo de “tudo o que ele faz” o sujeito do verbo final.'
    reason: Leitura alternativa da sintaxe hebraica no fim do versículo.
lexical_decisions:
- source_word: וְהָיָה
  choice: Ele será
  rationale: O perfeito qal com a conjunção, neste contexto poético, exprime o resultado da descrição anterior do homem feliz. O futuro mantém esse desenvolvimento e introduz naturalmente a comparação.
- source_word: כְּעֵץ
  choice: como uma árvore
  rationale: A preposição כְּ marca comparação; esta é a formulação natural e direta em português.
- source_word: שָׁתוּל
  choice: plantada
  rationale: O particípio passivo descreve uma árvore colocada intencionalmente em determinado lugar. “Plantada” é claro e fiel, sem tornar explícita a possibilidade mais específica de transplante.
- source_word: עַל פַלְגֵי מָיִם
  choice: junto a canais de água
  rationale: פַלְגֵי designa divisões, canais ou cursos de água. “Canais de água” preserva melhor a possibilidade de irrigação dirigida, enquanto “junto a” comunica a relação espacial de modo natural.
- source_word: פִּרְיוֹ יִתֵּן
  choice: dá seu fruto
  rationale: Reproduz de perto a expressão hebraica, literalmente “dá seu fruto”, e soa natural no contexto da produtividade de uma árvore.
- source_word: בְּעִתּוֹ
  choice: na estação própria
  rationale: A expressão indica o tempo apropriado ou determinado; no contexto agrícola, “estação própria” conserva tanto a dimensão temporal quanto a sazonal.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: e cuja folha não murcha
  rationale: “Folha” mantém o singular coletivo hebraico, e “não murcha” traduz diretamente o verbo usado para o definhamento da vegetação. “Cuja” liga com clareza a folha à árvore.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: em tudo o que faz, ele prospera
  rationale: A formulação toma o homem descrito no salmo como sujeito retomado do verbo final e mantém o sentido abrangente de כֹל. A sintaxe hebraica também permite entender “tudo o que ele faz” como sujeito, possibilidade registrada em nota.
theological_decisions:
- issue: Sujeito do verbo final יַצְלִיחַ
  choice: 'O homem é retomado como sujeito: “em tudo o que faz, ele prospera”.'
  alternative: 'A atividade do homem é o sujeito: “tudo o que ele faz prospera”.'
  rationale: A construção hebraica admite tanto a retomada do homem justo como sujeito implícito quanto a leitura de “tudo o que ele faz” como sujeito do verbo. A leitura principal conserva o foco pessoal do salmo, e a alternativa plausível é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Canais de água” mantém a imagem concreta dos cursos possivelmente destinados à irrigação; “estação própria” evita linguagem excessivamente arcaica. O marcador da nota foi colocado junto à oração final a que a variante se refere.
