id: PSA.1.5
reference: Psalms 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: pt
  text: Por isso, os ímpios não permanecerão de pé no julgamento[a], nem os pecadores na assembleia dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em juízo”. O hebraico pode referir-se de maneira ampla a uma prestação de contas judicial, seja na ordem presente, seja no juízo final.
    reason: lexical_alternative
  - marker: b
    text: Ou “na congregação dos justos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão lógica decorrente da descrição anterior dos ímpios.
- source_word: יָקֻמוּ
  choice: permanecerão de pé
  rationale: Preserva a imagem hebraica de ficar em pé e comunica, no contexto judicial, a incapacidade de resistir ou manter-se quando submetidos a julgamento.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Equivalente tradicional e ainda compreensível em português, preservando a categoria moral característica da literatura sapiencial.
- source_word: בַּמִּשְׁפָּט
  choice: no julgamento
  rationale: Mantém o sentido judicial de מִשְׁפָּט sem definir se se trata de uma prestação de contas histórica, final ou abrangente.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: Tradução direta que designa pessoas caracterizadas pelo pecado e mantém o paralelismo com 'os ímpios'.
- source_word: בַּעֲדַת
  choice: na assembleia de
  rationale: Representa עֵדָה como comunidade reunida; 'assembleia' é atual, clara e preserva a dimensão coletiva.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Equivalente conciso que preserva a categoria moral e relacional do hebraico no contexto sapiencial.
theological_decisions:
- issue: Alcance de 'o julgamento'
  choice: Formulação genérica, 'no julgamento', sem determinar um único momento judicial.
  alternative: Entender exclusivamente como um julgamento jurídico nesta vida ou exclusivamente como o juízo final.
  rationale: O hebraico admite um acerto de contas judicial amplo, e o contexto sapiencial pode abranger tanto manifestações presentes da justiça como o julgamento último; a tradução conserva essa tensão.
- issue: Sentido de 'permanecer de pé'
  choice: Conservar a metáfora de estar de pé, com possível nuance forense de não resistir ao julgamento.
  alternative: Explicitar como 'não serão absolvidos', 'não subsistirão' ou 'serão condenados'.
  rationale: As explicitações restringiriam a imagem e poderiam acrescentar um resultado jurídico mais específico do que o verbo hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'permanecerão de pé' preserva a imagem hebraica com naturalidade suficiente; 'assembleia' evita restringir o referente a uma instituição religiosa específica.
