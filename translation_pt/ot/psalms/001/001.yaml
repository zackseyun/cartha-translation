id: PSA.1.1
reference: Psalms 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: pt
  text: Feliz o homem[a] que não anda segundo o conselho dos perversos, nem se detém no caminho dos pecadores, nem se senta no assento dos zombadores.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «o homem», no masculino singular; aqui ele representa de modo exemplar a pessoa justa, e não somente os homens.
    reason: cultural_note
  - marker: b
    text: 'Ou: «na reunião dos zombadores». O termo hebraico pode indicar o lugar onde alguém se senta ou o grupo ali reunido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança declara uma condição profundamente favorável, e não apenas uma emoção passageira. Em português atual, «Feliz» introduz essa declaração de modo natural e digno.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o masculino singular do hebraico e sua figura exemplar na literatura sapiencial; uma nota esclarece que a aplicação é geral.
- source_word: הָלַךְ
  choice: anda
  rationale: Preserva a metáfora de conduta e a progressão poética concreta andar–deter-se–sentar-se.
- source_word: בַּעֲצַת
  choice: segundo o conselho
  rationale: Expressa tanto a orientação recebida quanto o princípio que governa a conduta, com sintaxe natural em português.
- source_word: רְשָׁעִים
  choice: perversos
  rationale: Designa pessoas moralmente culpáveis ou injustas sem introduzir a nuance religiosa mais específica de «ímpios».
- source_word: דֶרֶךְ
  choice: caminho
  rationale: Conserva a imagem sapiencial de uma via que também representa um modo de viver.
- source_word: חַטָּאִים
  choice: pecadores
  rationale: Equivalente direto, convencional e inteligível do substantivo plural hebraico.
- source_word: עָמָד
  choice: se detém
  rationale: Comunica a ideia de parar e permanecer no caminho, preservando a progressão para uma associação mais estabelecida sem sugerir apenas postura física.
- source_word: מוֹשָׁב
  choice: roda
  rationale: O substantivo pode indicar assento, reunião ou lugar onde um grupo se senta. «Roda» comunica naturalmente em português uma companhia reunida, embora «assento» seja a alternativa mais formal.
- source_word: לֵצִים
  choice: zombadores
  rationale: Traduz de forma atual aqueles que ridicularizam e tratam com desprezo.
- source_word: יָשָׁב
  choice: se senta
  rationale: Mantém a imagem concreta final e completa a progressão andar–deter-se–sentar-se.
theological_decisions:
- issue: Masculino singular representativo na literatura sapiencial
  choice: o homem
  alternative: a pessoa; aquele
  rationale: O hebraico apresenta uma figura masculina singular como exemplo do justo. A tradução conserva essa forma, enquanto a nota evita a leitura indevida de que a afirmação se limite aos homens.
- issue: Sentido da fórmula de bem-aventurança
  choice: Feliz
  alternative: Bem-aventurado
  rationale: «Feliz» é corrente e compreensível, mas aqui declara uma condição favorecida e plena, não mero estado emocional. «Bem-aventurado» conserva essa densidade de modo mais explícito, porém é menos corrente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação preserva o paralelismo e a progressão poética do hebraico. «Feliz» evita arcaísmo, e «roda» oferece uma imagem social corrente; as notas registram o alcance genérico de «homem» e a ambiguidade de מוֹשָׁב.
