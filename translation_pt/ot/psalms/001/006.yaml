  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: pt
  text: Pois Yahweh conhece o caminho dos justos[a], mas o caminho dos ímpios perecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vela pelo”. O hebraico traduzido por “conhece” pode indicar cuidado relacional ou aprovação, e não apenas conhecimento de um fato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o contraste anterior e preserva com naturalidade a força explicativa do hebraico.
- source_word: יֹדֵעַ
  choice: conhece
  rationale: Mantém o sentido lexical direto de ידע, sem excluir sua possível dimensão relacional de cuidado, reconhecimento ou aprovação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua referência pactual, em vez de substituí-lo por um título.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Abrange tanto o modo de viver quanto o rumo e o destino resultantes, além de preservar a repetição poética nas duas orações.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Traduz naturalmente o adjetivo plural substantivado e conserva a categoria moral do texto sapiencial.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção seja formalmente aditiva, o paralelismo estabelece um contraste claro entre os dois caminhos.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Expressa de modo corrente e digno a categoria moral contrastada com os justos no contexto sapiencial.
- source_word: תֹּאבֵד
  choice: perecerá
  rationale: Preserva o valor intransitivo de אבד e apresenta o caminho dos ímpios como destinado à ruína.
theological_decisions:
- issue: Sentido do conhecimento de Yahweh
  choice: O texto principal mantém «conhece», deixando implícita a possível ideia de conhecimento relacional, cuidado e aprovação.
  alternative: Yahweh vela pelo caminho dos justos.
  rationale: O verbo hebraico pode indicar mais do que simples percepção, especialmente em contextos relacionais; porém, explicitar «vela por» no texto principal resolveria uma nuance que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «caminho» conserva o paralelismo do hebraico; «perecerá» mantém o tom poético e a personificação do caminho.
