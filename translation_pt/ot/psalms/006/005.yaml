  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: pt
  text: Pois na morte não há lembrança de ti; no Sheol[a], quem te dará graças?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na sepultura” ou “no mundo dos mortos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica anterior e preserva com naturalidade a força explicativa do hebraico.
- source_word: אֵין
  choice: não há
  rationale: Expressa de modo idiomático em português a negação existencial hebraica.
- source_word: בַּמָּוֶת
  choice: na morte
  rationale: Mantém o sentido locativo e o paralelismo poético com “no Sheol”.
- source_word: זִכְרֶךָ
  choice: lembrança de ti
  rationale: Preserva a amplitude de זֵכֶר, que pode envolver lembrança ou menção memorial, sem restringi-lo apenas à fala.
- source_word: בִּשְׁאוֹל
  choice: no Sheol
  rationale: A transliteração conserva o conceito hebraico e evita reduzi-lo simplesmente à sepultura ou identificá-lo com uma concepção posterior mais específica.
- source_word: מִי
  choice: quem
  rationale: Reproduz diretamente o pronome interrogativo da pergunta retórica.
- source_word: יוֹדֶה לָּךְ
  choice: te dará graças
  rationale: Representa o uso comum de ידה no hifil, mantendo tanto o sentido de gratidão quanto sua dimensão de louvor dirigido a Deus.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração preserva a especificidade cultural e teológica do termo hebraico e a tensão do texto, sem impor uma interpretação mais estreita. As equivalências explicativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. Emprega-se “ti/te” para uma invocação fluida e reverente, sem arcaísmo excessivo.
