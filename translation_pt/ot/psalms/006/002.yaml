  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: pt
  text: Sê bondoso comigo[a], ó Yahweh, pois estou fraco; cura-me, ó Yahweh, pois meus ossos estão abalados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Concede-me teu favor» ou «Tem graça de mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «meus ossos estão aterrorizados» ou «meus ossos tremem». A imagem pode expressar profundo sofrimento físico e interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Tem compaixão de mim
  rationale: O imperativo de חנן pede favor ou graça. Em português, «tem compaixão de mim» expressa de modo natural e digno a súplica, sem perder a ideia de uma benevolência que o suplicante não pode exigir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz, nas duas ocorrências, o fundamento de cada súplica e preserva com fluidez a relação causal.
- source_word: אֻמְלַל
  choice: estou enfraquecido
  rationale: A forma descreve alguém debilitado, definhando ou sem vigor. «Estou enfraquecido» é corrente e conserva a ideia de uma condição de debilidade, não apenas uma característica permanente.
- source_word: רְפָאֵנִי
  choice: cura-me
  rationale: Reproduz diretamente o pedido de cura, que no contexto pode abranger sofrimento físico e profundo sofrimento pessoal.
- source_word: נִבְהֲלוּ
  choice: estão abalados
  rationale: O verbo pode indicar perturbação, terror ou consternação. Com «ossos» como sujeito, «estão abalados» preserva a intensidade e permite tanto uma dimensão corporal quanto interior, sem restringir o sentido a tremores físicos.
- source_word: עֲצָמָי
  choice: meus ossos
  rationale: Mantém a imagem concreta do hebraico, que pode representar a estrutura física e o íntimo da pessoa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome divino. «Yahweh» o representa como nome próprio, sem substituí-lo por um título.
- issue: Alcance do sofrimento expresso por «meus ossos estão abalados»
  choice: Preservar a imagem e sua ambiguidade corporal e interior
  alternative: Explicitar apenas «meu corpo treme» ou apenas «estou profundamente angustiado»
  rationale: O hebraico atribui o estado de perturbação aos ossos. A formulação escolhida conserva a tensão entre sofrimento físico, medo e aflição interior, sem resolver indevidamente a imagem.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em «cura-me» preserva o tom poético sem soar arcaica. O paralelismo das duas súplicas e de suas razões foi mantido.
