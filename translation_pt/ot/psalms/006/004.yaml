base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: pt
  text: Volta, SENHOR; resgata a minha vida; salva-me por causa do teu amor leal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Volta
  rationale: Preserva o imperativo direto do hebraico e o apelo para que o SENHOR volte sua presença e atenção ao suplicante, sem explicitar além do texto.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: חַלְּצָה נַפְשִׁי
  choice: livra a minha vida
  rationale: Aqui נֶפֶשׁ designa a vida ou a própria pessoa em perigo; 'vida' comunica melhor o sentido contextual do que a leitura mais restrita de 'alma'.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: Reproduz de modo direto o pedido de libertação ou salvação.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: por causa do teu amor leal
  rationale: חֶסֶד expressa amor fiel, lealdade e benevolência no âmbito da relação; 'amor leal' conserva esses componentes sem impor uma formulação confessional específica.
theological_decisions:
- issue: Fundamento do pedido de salvação
  choice: por causa do teu amor leal
  alternative: por causa da tua misericórdia
  rationale: A tradução mantém o fundamento do apelo no caráter fiel e amoroso de Deus, ao mesmo tempo que preserva a amplitude semântica de חֶסֶד melhor que uma equivalência limitada apenas à compaixão.
- issue: Sentido de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma
  rationale: O contexto é um pedido de resgate da pessoa ameaçada; 'vida' evita importar uma dicotomia corpo-alma que o termo hebraico não exige neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. O vocativo permanece direto, e os três imperativos conservam a urgência da oração hebraica.
