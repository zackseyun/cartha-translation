  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: pt
  text: 'Ó Yahweh, não me repreendas na tua ira,

    nem me disciplines no teu furor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino e usa «Ó» para marcar de modo natural e solene a invocação direta.
- source_word: אַל ... תוֹכִיחֵנִי
  choice: não me repreendas
  rationale: A partícula negativa com a forma verbal expressa uma súplica proibitiva; «repreender» comunica o sentido causativo de יכח neste contexto.
- source_word: בְּאַפְּךָ
  choice: na tua ira
  rationale: אַף, literalmente associado ao nariz, denota idiomaticamente ira; a preposição בְּ é bem representada por «em/na».
- source_word: וְאַל
  choice: nem
  rationale: «Nem» liga com concisão as duas súplicas negativas e preserva o paralelismo poético.
- source_word: בַּחֲמָתְךָ
  choice: no teu furor
  rationale: חֵמָה sugere ardor ou fúria intensa; «furor» mantém o registro poético e distingue o termo de אַף, traduzido por «ira».
- source_word: תְיַסְּרֵנִי
  choice: me disciplines
  rationale: O piel de יסר designa disciplinar ou corrigir mediante disciplina; «disciplinar» é atual e não reduz o sentido a punição meramente retributiva.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Distinção entre os termos paralelos אַף e חֵמָה
  choice: ira / furor
  alternative: ira / indignação; cólera / furor
  rationale: Termos portugueses distintos preservam tanto a proximidade semântica quanto a variação deliberada do paralelismo hebraico.
- issue: Natureza da ação expressa por יסר
  choice: disciplines
  alternative: castigues; corrijas
  rationale: «Disciplines» mantém aberta a dimensão corretiva e potencialmente punitiva do verbo, sem restringi-lo a castigo nem enfraquecê-lo como simples orientação.
translation_notes:
  register: Português moderno, digno e poético, com formas de segunda pessoa do singular («tua», «repreendas», «disciplines») coerentes com a oração dirigida diretamente a Deus. A disposição em dois versos reflete o paralelismo hebraico.
