  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: pt
  text: Yahweh ouviu a minha súplica; Yahweh receberá[a] a minha oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aceitará”; o verbo hebraico significa literalmente “tomará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, e mantém a opção editorial indicada no material de consulta.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O qatal apresenta a ação como realizada; em português, o pretérito perfeito expressa naturalmente a convicção de que Deus já ouviu.
- source_word: תְּחִנָּה
  choice: súplica
  rationale: Expressa um pedido insistente por favor ou misericórdia e distingue este termo de תְּפִלָּה.
- source_word: תְּפִלָּה
  choice: oração
  rationale: É o termo português comum e adequado para oração, preservando a variação lexical do paralelismo hebraico.
- source_word: לָקַח
  choice: receberá
  rationale: Embora o sentido básico seja “tomar”, com “oração” o verbo comunica idiomaticamente receber ou acolher; o futuro preserva a confiança expressa pelo yiqtol.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz explicitamente o Tetragrama. A transliteração conserva o nome próprio e segue a convenção editorial fornecida, sem substituí-lo por um título.
- issue: Sentido de לָקַח aplicado à oração
  choice: receberá
  alternative: aceitará; tomará
  rationale: “Receberá” preserva a imagem verbal sem definir além do necessário como Deus responderá à oração; a nota registra tanto a alternativa contextual quanto o sentido literal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Súplica” preserva a intensidade do primeiro substantivo, enquanto “oração” mantém a distinção do paralelismo. O artigo possessivo (“a minha”) soa natural em ampla variedade de usos lusófonos e conserva a ênfase pessoal.
