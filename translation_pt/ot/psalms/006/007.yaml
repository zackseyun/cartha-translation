  text: עָֽשְׁשָׁ֣ה מִ/כַּ֣עַס עֵינִ֑/י עָֽ֝תְקָ֗ה בְּ/כָל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: pt
  text: Meu olho se consome de tristeza[a]; envelheceu por causa de todos os meus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu olho perdeu o brilho de aflição; ficou gasto por causa de todos os meus adversários”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: se consome
  rationale: O verbo expressa definhamento, desgaste ou perda de vigor. Com “olho” como sujeito, “se consome” preserva a imagem corporal sem restringi-la apenas à perda de visão.
- source_word: מִכַּעַס
  choice: de tristeza
  rationale: כַּעַס pode indicar desgosto, irritação, aflição ou tristeza. No contexto deste lamento, “tristeza” comunica naturalmente a dor emocional que causa o desgaste físico, sem eliminar a alternativa de “aflição”.
- source_word: עֵינִי
  choice: Meu olho
  rationale: O hebraico emprega o singular com sufixo de primeira pessoa. O singular é mantido para preservar a imagem poética do texto-fonte.
- source_word: עָתְקָה
  choice: envelheceu
  rationale: O verbo pode descrever aquilo que envelheceu ou ficou gasto. “Envelheceu” conserva a metáfora marcante de deterioração aplicada ao olho.
- source_word: בְּכָל
  choice: por causa de todos
  rationale: Neste contexto, a preposição apresenta os inimigos como a ocasião ou causa do desgaste; “por causa de todos” expressa essa relação com clareza.
- source_word: צוֹרְרָי
  choice: meus inimigos
  rationale: A forma participial designa os que se opõem hostilmente ou oprimem. “Meus inimigos” é uma tradução natural e suficientemente forte no contexto do lamento.
