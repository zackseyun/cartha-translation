  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: pt
  text: Que todos os meus inimigos fiquem envergonhados e profundamente aterrorizados[a]; que voltem e fiquem envergonhados num instante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sejam envergonhados [...] voltem e sejam envergonhados de repente».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: fiquem envergonhados
  rationale: O imperfeito Qal, neste contexto poético de desejo ou pedido, é bem expresso por «que ... fiquem». «Envergonhados» preserva o sentido de vergonha e desonra sem especificar indevidamente como isso ocorre.
- source_word: וְיִבָּהֲלוּ
  choice: e profundamente aterrorizados
  rationale: O verbo בהל comunica terror ou consternação súbita. «Aterrorizados» mantém a força emocional, e «profundamente» expressa o intensificador מְאֹד com naturalidade em português.
- source_word: מְאֹד
  choice: profundamente
  rationale: Funciona como intensificador. «Profundamente» combina naturalmente com «aterrorizados» e preserva a intensidade do hebraico.
- source_word: כָּל אֹיְבָי
  choice: todos os meus inimigos
  rationale: Tradução direta e natural da construção hebraica com sufixo de primeira pessoa.
- source_word: יָשֻׁבוּ
  choice: que recuem
  rationale: שׁוב significa voltar ou retornar. No contexto de inimigos, «recuem» comunica a reversão pretendida de modo conciso, sem desenvolver uma cena militar além do texto.
- source_word: יֵבֹשׁוּ
  choice: fiquem envergonhados
  rationale: A repetição do verbo בוש é mantida para preservar a ênfase poética hebraica.
- source_word: רָגַע
  choice: num instante
  rationale: Usado adverbialmente, indica rapidez ou subitaneidade. «Num instante» preserva a ideia de uma reversão abrupta e soa natural em português.
