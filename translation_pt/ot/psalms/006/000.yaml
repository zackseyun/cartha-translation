base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: pt
  text: 'Ao regente: com instrumentos de cordas, segundo a Sheminith[a]. Salmo de Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Sheminith; possivelmente “a oitava”, uma configuração em oitava ou um instrumento de oito cordas.'
    reason: lexical_alternative
  - marker: b
    text: Ou “por Davi” ou “para Davi”; o hebraico pode indicar autoria ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa quem dirige a execução musical. “Regente” é claro, atual e adequado ao contexto, sem restringir a função necessariamente a um coro.
- source_word: בִּנְגִינוֹת
  choice: com instrumentos de cordas
  rationale: O termo se refere a música ou instrumentos de cordas; esta formulação preserva o sentido instrumental de modo natural em português.
- source_word: עַל
  choice: segundo
  rationale: Em títulos musicais, pode introduzir a melodia, o estilo ou o arranjo da execução. “Segundo” evita decidir indevidamente entre essas possibilidades.
- source_word: הַשְּׁמִינִית
  choice: a Sheminith
  rationale: O referente técnico é incerto; a transliteração preserva o termo hebraico sem impor uma identificação especulativa.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Equivalente tradicional, preciso e amplamente compreensível para a composição musical designada pelo hebraico.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição hebraica pode indicar autoria, associação, pertencimento ou dedicação. “De Davi” conserva melhor essa abertura do que uma formulação inequivocamente autoral.
theological_decisions:
- issue: Autoria ou associação expressa por לְדָוִד
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O título hebraico não exige que se determine exclusivamente autoria direta; a tradução mantém a ambiguidade histórica e literária.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com concisão própria de um título litúrgico-musical. Os marcadores aparecem imediatamente após os termos que explicam.
