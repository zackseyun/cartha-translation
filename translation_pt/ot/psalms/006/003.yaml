source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: pt
  text: E a minha alma[a] está profundamente abalada[b]. Mas tu[c], Yahweh[d] — até quando?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Minha alma” também pode ser entendido como “minha vida” ou “eu mesmo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “está aterrorizada” ou “está consternada”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “e tu”; traduzido como “mas tu” para expressar a virada no lamento.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “SENHOR”. Alternativa: “Javé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: E a minha alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. “Minha alma” preserva a linguagem poética e a dimensão interior do sofrimento, enquanto וְ é mantido como “E”.
- source_word: נִבְהֲלָה מְאֹד
  choice: está profundamente abalada
  rationale: O verbo בהל expressa perturbação intensa, consternação ou terror; מְאֹד intensifica essa condição. A formulação escolhida é natural em português e mantém a intensidade sem restringir o sentido exclusivamente ao medo.
- source_word: וְאַתָּה
  choice: Mas tu
  rationale: Embora וְ signifique formalmente “e”, aqui introduz uma virada incisiva da descrição da aflição para a interpelação direta a Deus. “Mas tu” comunica essa força adversativa, sem completar a frase interrompida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַד מָתָי
  choice: até quando?
  rationale: Equivalente idiomático da fórmula hebraica de lamento, preservando sua urgência e sua forma interrogativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino YHWH. “Yahweh” o representa diretamente; a nota informa a substituição tradicional por “SENHOR”.
- issue: Frase interrompida após וְאַתָּה
  choice: Mas tu, Yahweh — até quando?
  alternative: Mas tu, Yahweh, até quando demorarás?
  rationale: O hebraico não fornece um verbo depois de “tu”. O travessão preserva a elipse, a tensão e a emoção do lamento, sem inserir uma ação específica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Profundamente abalada” transmite intensidade emocional sem soar arcaico. O travessão conserva a interrupção dramática e a ambiguidade verbal do hebraico.
