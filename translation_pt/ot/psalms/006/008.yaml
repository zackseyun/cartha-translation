  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: pt
  text: Afastem-se de mim, todos vocês que praticam o mal, pois Yahweh ouviu o som do meu choro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Afastem-se de mim
  rationale: O imperativo plural de סור, seguido de מִמֶּנִּי, exige que os destinatários se retirem da presença do salmista. “Afastem-se de mim” é direto, vigoroso e natural em português.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: todos vocês que praticam o mal
  rationale: A construção designa pessoas que fazem ou praticam o mal. A forma verbal preserva a ideia de ação habitual e soa mais natural no português atual do que “obreiros da iniquidade”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior e mantém um registro poético digno sem perder clareza.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O perfeito hebraico apresenta a escuta como fato consumado. O pretérito perfeito é natural em português e, no contexto, sustenta a confiança presente do salmista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קוֹל בִּכְיִי
  choice: o som do meu choro
  rationale: קוֹל pode significar “voz” ou “som”; associado ao choro, “o som do meu choro” comunica de modo natural a lamentação audível e preserva a formulação hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva sua função como nome, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem inicial mantém a força do imperativo plural, e a segunda oração conserva o tom confiante da virada do salmo.
