  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: pt
  text: Estou exausto de tanto gemer; todas as noites inundo[a] a minha cama; com as minhas lágrimas encharco o meu leito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “faço a minha cama nadar”; trata-se de uma hipérbole poética para inundá-la de lágrimas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Estou exausto
  rationale: O verbo expressa o estado de esgotamento resultante de sofrimento prolongado; o presente comunica naturalmente esse estado em português.
- source_word: בְּאַנְחָתִי
  choice: de tanto gemer
  rationale: אַנְחָה pode indicar gemido ou suspiro. A construção portuguesa exprime de modo natural a causa ou circunstância do esgotamento, sem perder o caráter físico do lamento.
- source_word: אַשְׂחֶה
  choice: inundo
  rationale: O hifil descreve literalmente fazer a cama nadar; “inundo” conserva a hipérbole poética e soa natural em português.
- source_word: בְכָל לַיְלָה
  choice: todas as noites
  rationale: A expressão indica repetição noite após noite, mais provavelmente do que a duração de uma única noite.
- source_word: מִטָּתִי
  choice: a minha cama
  rationale: מִטָּה é o termo comum para cama ou lugar onde alguém se deita.
- source_word: בְּדִמְעָתִי
  choice: com as minhas lágrimas
  rationale: A preposição indica o meio pelo qual o leito é encharcado.
- source_word: עַרְשִׂי
  choice: o meu leito
  rationale: “Leito” preserva a variação lexical em relação a מִטָּה e mantém um registro poético compreensível.
- source_word: אַמְסֶה
  choice: encharco
  rationale: No contexto, o hifil de מסס apresenta figuradamente o leito como dissolvido ou completamente molhado pelas lágrimas; “encharco” comunica claramente essa intensidade.
theological_decisions: []
