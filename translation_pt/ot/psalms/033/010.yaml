source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: pt
  text: Yahweh[a] anula o conselho das nações; frustra os planos dos povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH; o nome também é transliterado como “Javé” ou “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, em vez de substituí-lo por um título, preservando seu caráter de nome pessoal.
- source_word: הֵפִיר
  choice: anula
  rationale: O hifil de פרר indica fazer com que um conselho ou propósito seja rompido ou perca seu efeito; “anula” expressa isso de modo claro e direto.
- source_word: עֲצַת
  choice: o conselho
  rationale: עֵצָה pode significar conselho, plano ou propósito. “Conselho” preserva a imagem de deliberação coletiva e mantém a distinção poética em relação a “planos” no segundo membro.
- source_word: גּוֹיִם
  choice: das nações
  rationale: Neste contexto, גּוֹיִם designa coletivamente as nações, sem exigir o sentido religioso mais específico de “gentios”.
- source_word: הֵנִיא
  choice: frustra
  rationale: O verbo comunica impedir que uma intenção se realize ou fazê-la fracassar. “Frustra” mantém a força ativa e o paralelismo com “anula”.
- source_word: מַחְשְׁבוֹת
  choice: os planos
  rationale: Embora possa significar pensamentos ou intenções, o paralelismo com עֲצַת favorece aqui o sentido de planos concebidos pelos povos.
- source_word: עַמִּים
  choice: dos povos
  rationale: “Povos” preserva a distinção lexical entre עַמִּים e גּוֹיִם e seu sentido coletivo plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome divino, em vez de substituí-lo pelo título “SENHOR”; a nota reconhece formas alternativas correntes em português.
translation_notes:
  register: Português atual, claro e digno, com paralelismo poético conciso. O presente verbal apresenta a ação como característica de Yahweh, em consonância com o valor proverbial do contexto, embora as formas hebraicas sejam perfeitas.
