id: PSA.33.1
reference: Psalms 33:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: pt
  text: Cantem de alegria em Yahweh[a], ó justos; o louvor fica bem aos íntegros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Exultem em Yahweh” ou “Deem gritos de alegria em Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o louvor é belo para os retos” ou “o louvor convém aos retos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: Cantem de alegria
  rationale: O imperativo plural de רנן expressa uma manifestação vocal e jubilosa. “Cantem de alegria” conserva tanto o caráter audível quanto a exultação, em português natural.
- source_word: צַדִּיקִים
  choice: ó justos
  rationale: O termo funciona aqui como vocativo. “Ó justos” explicita o chamado dirigido às pessoas caracterizadas pela justiça.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: 'A preposição ב indica aqui a esfera ou o objeto da alegria: cantar ou exultar em Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino. A transliteração “Yahweh” preserva esse nome em vez de substituí-lo por um título.
- source_word: לַיְשָׁרִים
  choice: aos íntegros
  rationale: 'A preposição ל marca a relação de adequação: o louvor convém aos que são retos ou íntegros. “Íntegros” comunica com naturalidade a retidão moral indicada pelo hebraico.'
- source_word: נָאוָה
  choice: fica bem
  rationale: O adjetivo denota aquilo que é apropriado, belo ou conveniente. “Fica bem” expressa de modo corrente e digno essa ideia de adequação.
- source_word: תְהִלָּה
  choice: o louvor
  rationale: O substantivo pode indicar louvor ou uma expressão de louvor. O termo simples preserva a formulação geral sem especificar indevidamente a forma.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ó justos” mantém o vocativo solene sem arcaísmo excessivo; “fica bem” comunica naturalmente a combinação hebraica de beleza e conveniência.
