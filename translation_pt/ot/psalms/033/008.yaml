id: PSA.33.8
reference: Psalms 33:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: pt
  text: Que toda a terra tema Yahweh; que todos os habitantes do mundo tremam diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fiquem tomados de temor por causa dele». O verbo hebraico pode indicar pavor, temor reverente ou estremecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: Que ... tema
  rationale: O imperfeito qal na abertura funciona como exortação. A construção com «que» comunica naturalmente essa força volitiva e «temer» preserva tanto o medo quanto a reverência.
- source_word: מֵיְהוָה
  choice: tema Yahweh
  rationale: Com o verbo ירא, a preposição מִן introduz idiomaticamente aquele que inspira temor; em português, o objeto direto é a forma natural.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O paralelismo com «todos os habitantes do mundo» indica alcance universal, não uma terra ou região específica.
- source_word: מִמֶּנּוּ יָגוּרוּ
  choice: tremam diante dele
  rationale: גור pode expressar pavor, temor ou estremecimento. «Tremam diante dele» conserva a intensidade e evita repetir simplesmente «temam», mantendo o paralelismo poético.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: todos os habitantes do mundo
  rationale: A expressão designa todos os que habitam o mundo povoado; esta formulação é clara, natural e universal em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não o título אֲדֹנָי. A transliteração «Yahweh» preserva essa distinção e o caráter pessoal do nome da aliança sem substituir o nome por um título.
- issue: Natureza do temor exigido
  choice: Manter a amplitude de temor reverente e medo
  alternative: Reduzir a «reverenciem» ou intensificar exclusivamente para «aterrorizem-se»
  rationale: Os dois verbos hebraicos abrangem temor, reverência e tremor. A tradução mantém essa tensão sem restringi-la a respeito sereno nem a puro terror.
translation_notes:
  register: Português moderno, claro e solene, com construção exortativa natural. «Terra» e «mundo» preservam o paralelismo universal; «temer» e «tremer diante de» mantêm a variação e a progressão poéticas.
