base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: pt
  text: Ele ajunta as águas do mar como um montão[a]; põe os abismos em armazéns[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma pilha”; alguns entendem “como uma muralha”, à luz de imagens semelhantes de águas em outros textos.
    reason: lexical_alternative
  - marker: b
    text: Ou “as profundezas” ou “as águas profundas”. O plural hebraico pode referir-se às grandes profundezas do oceano ou às águas do abismo primordial.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: ajunta
  rationale: O particípio qal de כנס descreve reunir ou juntar. “Ajunta” é natural em português, conserva a imagem concreta e combina poeticamente com “põe” no segundo verso.
- source_word: כַּנֵּד
  choice: como num montão
  rationale: נֵד designa uma massa amontoada, inclusive de águas. A formulação preserva a comparação do hebraico e evita explicá-la de modo abstrato.
- source_word: מֵי הַיָּם
  choice: as águas do mar
  rationale: Reproduz de modo direto e idiomático a construção hebraica, mantendo a linguagem poética concreta.
- source_word: נֹתֵן
  choice: põe
  rationale: O particípio qal de נתן tem sentido amplo de pôr ou colocar. “Põe” é simples, atual e mantém o paralelismo verbal com “ajunta”.
- source_word: בְּאֹצָרוֹת
  choice: em depósitos
  rationale: אֹצָר pode indicar depósito, armazém ou tesouro. “Depósitos” comunica claramente lugares onde algo é guardado e preserva a imagem cosmológica sem sugerir principalmente riquezas.
- source_word: תְּהוֹמוֹת
  choice: os abismos
  rationale: O plural de תְּהוֹם refere-se às profundezas aquáticas ou às águas profundas primordiais. “Os abismos” preserva o plural e a força poética em português.
theological_decisions:
- issue: Imagem cosmológica da soberania de Deus sobre o mar
  choice: Manter literalmente as imagens do montão e dos depósitos.
  alternative: Parafrasear como “Ele controla o mar” ou “guarda os oceanos”.
  rationale: O texto apresenta o domínio divino sobre as águas por meio de imagens poéticas concretas. Mantê-las evita reduzir a tensão e a força cosmológica do verso a uma afirmação abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e as imagens concretas do hebraico foram preservadas; “num montão” soa mais natural do que “como um montão” depois de “ajunta”, sem alterar a comparação.
