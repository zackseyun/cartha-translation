id: PSA.33.12
reference: Psalms 33:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: pt
  text: Feliz[a] é a nação cujo Deus é Yahweh[b], o povo[c] que ele escolheu como sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “Bem-aventurada” ou “Afortunada”. A expressão hebraica descreve uma condição de favor e plenitude, não apenas um sentimento de alegria.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” representa o nome divino יהוה, tradicionalmente vertido por “SENHOR” em muitas traduções.
    reason: divine_name
  - marker: c
    text: A segunda linha provavelmente se refere de modo especial a Israel, o povo que Yahweh escolheu para si; contudo, o hebraico mantém a expressão poética “o povo”.
    reason: referent_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz é
  rationale: A fórmula hebraica de bem-aventurança descreve uma condição favorável e plena, não apenas uma emoção passageira. “Feliz é” é clara e natural no português moderno, preservando o tom declarativo do salmo.
- source_word: הַגּוֹי
  choice: a nação
  rationale: גּוֹי designa aqui uma coletividade nacional e corresponde poeticamente a הָעָם, “o povo”.
- source_word: אֲשֶׁר
  choice: cujo
  rationale: 'O pronome relativo expressa naturalmente em português a relação possessiva: Yahweh é o Deus da nação.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: O substantivo com sufixo de terceira pessoa masculina singular significa “seu Deus”, referindo-se à nação.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o paralelismo poético com “a nação” sem inserir explicitamente “Israel” no texto.
- source_word: בָּחַר
  choice: escolheu
  rationale: O perfeito hebraico apresenta a escolha como um ato realizado; o pretérito perfeito é direto e natural em português.
- source_word: לְנַחֲלָה לוֹ
  choice: como sua herança
  rationale: Expressa de modo conciso e idiomático a ideia de um povo escolhido para pertencer a Deus como sua porção ou herança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva sua função como nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Identidade da “nação” e do “povo”
  choice: Manter os termos poéticos sem acrescentar “Israel”
  alternative: Explicitar Israel no texto principal; generalizar a afirmação a qualquer nação
  rationale: Israel provavelmente está especialmente em vista, sobretudo como o povo escolhido por herança, mas o hebraico conserva a formulação poética “nação” e “povo”. A tradução não resolve além do texto essa tensão entre a forma geral da primeira linha e o contexto eletivo da segunda.
- issue: Sentido de נַחֲלָה aplicado ao povo
  choice: herança
  alternative: propriedade; porção; patrimônio
  rationale: “Herança” conserva a linguagem bíblica da porção pertencente a Deus, sem explicar de maneira excessiva como Deus pode receber uma herança.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Feliz é” evita arcaísmo excessivo, enquanto “Yahweh” e “herança” preservam o caráter pactual e litúrgico do verso. O paralelismo entre “nação” e “povo” foi mantido.
