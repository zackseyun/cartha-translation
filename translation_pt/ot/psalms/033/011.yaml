  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: pt
  text: O conselho[a] de Yahweh permanece para sempre; os planos do seu coração, de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “propósito” em vez de “conselho”; “planos” também pode ser traduzido como “pensamentos” ou “propósitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: conselho
  rationale: O substantivo pode indicar conselho, desígnio ou propósito. “Conselho” conserva tanto a nuance deliberativa quanto a intencional e forma um paralelismo natural com “planos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa permanência duradoura em português moderno e natural.
- source_word: תַּעֲמֹד
  choice: permanece
  rationale: O imperfeito apresenta uma verdade geral e contínua; “permanece” transmite estabilidade duradoura de modo idiomático.
- source_word: מַחְשְׁבוֹת
  choice: planos
  rationale: No paralelismo e em referência à intenção divina, “planos” comunica melhor a ideia de pensamentos intencionais, sem excluir totalmente a amplitude do termo hebraico.
- source_word: לִבּוֹ
  choice: seu coração
  rationale: Mantém a expressão antropológica hebraica, na qual o coração é o centro do pensamento e da vontade.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Reproduz com clareza a continuidade distributiva através das gerações sucessivas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino e representa de modo mais provável sua vocalização antiga.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e o paralelismo hebraico foram preservados sem rigidez excessiva.
