  text: the one who forms the hearts of them all[a], who understands all their deeds.
translation:
  language: pt
  text: aquele que forma o coração de todos eles[a] e compreende todos os seus atos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que forma juntos os corações deles”. O hebraico יחד pode ser entendido como “juntos” ou “em conjunto”; alguns o entendem, neste contexto, como “igualmente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: aquele que forma
  rationale: O particípio qal com artigo funciona como substantivo e caracteriza Deus por sua ação de formar; esta formulação é natural e preserva esse valor.
- source_word: יַחַד
  choice: de todos eles
  rationale: No contexto, indica que Deus forma o coração de cada um dentre todos os habitantes da terra. A formulação evita sugerir necessariamente simultaneidade, sem apagar a alternativa literal “juntos”.
- source_word: לִבָּם
  choice: o coração
  rationale: 'Mantém o singular hebraico, entendido distributivamente: o coração de cada pessoa abrangida por “todos eles”.'
- source_word: הַמֵּבִין
  choice: compreende
  rationale: O particípio hifil de בין expressa compreender ou discernir; “compreende” é claro, atual e apropriado ao paralelismo.
- source_word: אֶל כָּל מַעֲשֵׂיהֶם
  choice: todos os seus atos
  rationale: Com בין, אֶל introduz aquilo a que se dirige o entendimento e é absorvido naturalmente em português. “Atos” preserva a referência concreta às ações humanas.
theological_decisions:
- issue: Alcance dos referentes humanos
  choice: A redação abrange todas as pessoas mencionadas no contexto anterior.
  alternative: Restringir os referentes aos reis ou às nações do contexto mais próximo.
  rationale: Os versículos 13–15 passam por “todos os filhos dos homens” e “todos os habitantes da terra”; a tradução conserva esse alcance amplo sem acrescentar uma delimitação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “o coração” acompanha a forma hebraica e funciona distributivamente; a nota preserva a ambiguidade de יַחַד.
