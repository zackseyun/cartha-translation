  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: pt
  text: Dos céus, Yahweh olha; ele vê todos os filhos dos homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade” ou “todos os seres humanos”; em hebraico, “todos os filhos do ser humano”, expressão poética que se refere coletivamente aos seres humanos.
    reason: alternativa lexical e esclarecimento do sentido coletivo
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Dos céus
  rationale: A preposição מִן indica o ponto de onde se olha, e שָׁמַיִם tem forma plural. “Dos céus” é natural em português e preserva a perspectiva celestial.
- source_word: הִבִּיט
  choice: olha
  rationale: O hifil de נבט expressa olhar atentamente ou dirigir o olhar. O presente comunica adequadamente a verdade geral enunciada no poema.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רָאָה
  choice: ele vê
  rationale: ראה significa normalmente “ver”. O presente acompanha o paralelismo e apresenta a observação de Yahweh como verdade contínua ou geral.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: todos os filhos dos homens
  rationale: Preserva a imagem poética e a linguagem masculina representativa do hebraico, enquanto a nota esclarece que a expressão abrange coletivamente todos os seres humanos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido coletivo de בְּנֵי הָאָדָם
  choice: todos os filhos dos homens
  alternative: toda a humanidade ou todos os seres humanos
  rationale: A redação principal conserva a expressão poética hebraica, e a nota explicita seu alcance coletivo sem restringi-la ao sexo masculino.
translation_notes:
  register: Português atual, digno e de leitura ampla. O paralelismo verbal foi mantido com “olha” e “vê”, e a expressão figurada hebraica foi preservada no texto com esclarecimento em nota.
