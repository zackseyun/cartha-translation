  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: pt
  text: Pois ele falou[a], e veio a ser; ele ordenou[b], e ficou firme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e foi”. O hebraico é muito conciso; também pode ser entendido como “e veio a existir”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e permaneceu de pé” ou “e foi estabelecido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a exortação do contexto anterior e preserva naturalmente o valor causal em português.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente dá certa ênfase ao agente; em português, a expressão explícita de “ele” a preserva sem tornar o verso pesado.
- source_word: אָמַר
  choice: falou
  rationale: Tradução direta e digna, adequada ao paralelismo poético com “ordenou”.
- source_word: וַיְהִי
  choice: e tudo veio a existir
  rationale: Expressa o resultado imediato da fala divina. “Tudo” explicita em português o referente implícito no hebraico conciso, à luz do contexto da criação, sem acrescentar uma entidade específica.
- source_word: צִוָּה
  choice: ordenou
  rationale: Comunica diretamente a emissão de uma ordem e mantém o paralelo com “falou”.
- source_word: וַיַּעֲמֹד
  choice: e tudo ficou firme
  rationale: Preserva a imagem de permanência e estabilidade de עמד em português natural, comunicando que a ordem teve efeito duradouro.
theological_decisions:
- issue: Linguagem de criação e resultado após a fala divina
  choice: “tudo veio a existir” / “tudo ficou firme”
  alternative: “existiu” / “permaneceu de pé” ou “foi estabelecido”
  rationale: A formulação apresenta a eficácia imediata e duradoura da palavra de Deus sem desenvolver o verso em uma afirmação doutrinária mais específica do que o hebraico permite. As notas preservam a concisão e as alternativas lexicais do original.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. A repetição de “ele” reflete a estrutura enfática do hebraico; “tudo” torna explícito o referente contextual implícito e produz uma frase natural para leitores contemporâneos.
