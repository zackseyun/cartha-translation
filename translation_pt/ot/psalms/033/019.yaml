  yaml_path: translation/ot/psalms/033/019.yaml
  text: to deliver their soul from death and to keep them alive in famine[a].
translation:
  language: pt
  text: 'para livrar da morte a vida deles[a]

    e mantê-los vivos durante a fome.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alma deles” ou “as vidas deles”. O hebraico néfesh pode designar a alma, a própria pessoa ou a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: livrar
  rationale: O infinitivo hifil de נצל expressa fazer escapar ou livrar; “livrar da morte” é natural, conciso e mantém o tom poético.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: A preposição מן tem sentido separativo; “da morte” preserva diretamente a construção hebraica.
- source_word: נַפְשָׁם
  choice: a vida deles
  rationale: נֶפֶשׁ pode designar alma, pessoa ou vida. Neste contexto de preservação da morte e da fome, “vida” comunica naturalmente o sentido, enquanto a nota conserva as alternativas lexicais.
- source_word: וּלְחַיּוֹתָם
  choice: e mantê-los vivos
  rationale: A forma verbal de חיה significa conservar ou manter vivos; esta expressão é clara e idiomática em português moderno.
- source_word: בָּרָעָב
  choice: durante a fome
  rationale: רָעָב frequentemente indica fome generalizada ou escassez. “Durante a fome” expressa com naturalidade a circunstância temporal sem restringir indevidamente o alcance.
