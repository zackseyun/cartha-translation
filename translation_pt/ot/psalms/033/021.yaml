base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: pt
  text: Pois nele se alegra[a] o nosso coração[b], porque confiamos no seu santo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se alegrará”. O imperfeito hebraico também pode indicar um futuro confiante.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “nosso coração” está no singular e funciona como expressão coletiva da vida interior do povo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e mantém com naturalidade o nexo causal no fluxo poético.
- source_word: בּוֹ
  choice: nele
  rationale: O sufixo masculino singular remete pessoalmente ao SENHOR no contexto, sem inserir no versículo o nome divino que não aparece nele.
- source_word: יִשְׂמַח
  choice: se alegra
  rationale: O imperfeito pode exprimir disposição presente ou futuro confiante; o presente comunica bem a confissão atual, preservando a alternativa em nota.
- source_word: לִבֵּנוּ
  choice: o nosso coração
  rationale: Conserva o singular coletivo hebraico e expressa a vida interior unificada do povo.
- source_word: כִּי
  choice: porque
  rationale: Explicita que a confiança no santo nome é a razão da alegria.
- source_word: בְשֵׁם קָדְשׁוֹ
  choice: no seu santo nome
  rationale: Com o verbo confiar, a preposição indica o objeto da confiança; 'santo nome' preserva a formulação teológica e poética do hebraico.
- source_word: בָטָחְנוּ
  choice: confiamos
  rationale: O perfeito indica confiança assumida e ainda relevante. Em português, o pretérito perfeito composto sugeriria repetição ou continuidade reiterada, por isso o presente comunica com mais naturalidade o estado resultante.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares em בּוֹ e קָדְשׁוֹ
  choice: Os pronomes remetem ao SENHOR mencionado no contexto imediato.
  alternative: Referência genérica a Deus, sem vínculo explícito com o nome da aliança.
  rationale: O contexto circundante fala repetidamente do SENHOR. Contudo, como o nome divino não ocorre neste versículo, a tradução mantém 'nele' e 'seu', sem acrescentá-lo.
- issue: Valor temporal de יִשְׂמַח
  choice: 'Presente: ''se alegra''.'
  alternative: 'Futuro: ''se alegrará''.'
  rationale: O imperfeito hebraico admite ambas as nuances. O presente se ajusta à confissão atual do salmo, enquanto a possibilidade futura é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem das notas foi ajustada para que cada marcador apareça junto à expressão que explica.
