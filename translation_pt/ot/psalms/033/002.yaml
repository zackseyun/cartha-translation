  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: pt
  text: Deem graças a Yahweh com a lira; façam música para ele com a harpa de dez cordas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com um nébel de dez cordas”. A identificação exata desse antigo instrumento é incerta; ele também é traduzido como “alaúde” ou “lira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה, no hifil, tem aqui o sentido litúrgico de agradecer ou louvar; “deem graças” preserva essa nuance específica.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título.
- source_word: בְּכִנּוֹר
  choice: com a lira
  rationale: כִּנּוֹר designa um antigo instrumento de cordas geralmente identificado como lira; esta opção também o distingue de נֵבֶל.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: com a harpa de dez cordas
  rationale: עָשׂוֹר indica dez cordas, enquanto נֵבֶל é um instrumento antigo cuja identificação exata é incerta; “harpa” oferece uma tradução clara e tradicional, com nota explicativa.
- source_word: זַמְּרוּ לוֹ
  choice: façam música para ele
  rationale: O piel de זמר pode envolver cantar louvores ou executar música; a referência imediata a instrumentos favorece a formulação abrangente “façam música”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. A repetição de “com” acompanha o paralelismo hebraico; “façam música” preserva a amplitude de זמר no contexto instrumental.
