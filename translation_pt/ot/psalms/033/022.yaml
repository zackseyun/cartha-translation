  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: pt
  text: Que o teu amor leal esteja sobre nós, SENHOR, assim como esperamos em ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (ḥésed)
  choice: amor leal
  rationale: Expressa tanto amor quanto fidelidade constante à aliança, sem reduzir o termo apenas a misericórdia ou bondade.
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino pelo título em versaletes.
- source_word: יִחַלְנוּ (yiḥálnu)
  choice: esperamos
  rationale: O verbo יחל neste contexto comunica espera confiante ou esperança dirigida a Deus; “esperamos” preserva a forma verbal e o sentido contextual.
- source_word: כַּאֲשֶׁר (kaʾăšer)
  choice: assim como
  rationale: Preserva a relação comparativa ou correspondente entre o pedido pelo amor leal de Deus e a esperança nele.
theological_decisions:
- issue: Relação entre o amor leal de Deus e a esperança humana
  choice: assim como esperamos em ti
  alternative: na medida em que esperamos em ti
  rationale: “Assim como” mantém a ambiguidade do hebraico entre comparação e correspondência, evitando sugerir de modo categórico que o amor divino seja proporcional ou condicionado pela intensidade da esperança humana.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe próxima do paralelismo hebraico. A colocação inicial “Esteja sobre nós” preserva a força do pedido e a imagem espacial do original.
