base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: pt
  text: Pela palavra de Yahweh os céus foram feitos e, pelo sopro de sua boca, todo o exército dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, pelo espírito de sua boca, todo o exército dos céus”. A palavra hebraica pode significar “sopro”, “vento” ou “espírito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: Pela palavra de
  rationale: A preposição בְּ tem valor instrumental neste contexto. “Pela palavra de” expressa naturalmente o meio pelo qual os céus foram feitos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Preserva a forma plural hebraica e se ajusta ao contexto da criação.
- source_word: נַעֲשׂוּ
  choice: foram feitos
  rationale: Traduz diretamente o verbo עשה sem introduzir a formulação mais específica “foram criados”.
- source_word: וּבְרוּחַ
  choice: e, pelo sopro de
  rationale: רוּחַ pode significar sopro, vento ou espírito. No paralelismo com “sua boca”, “sopro” comunica melhor a imagem poética imediata.
- source_word: פִּיו
  choice: sua boca
  rationale: Mantém o antropomorfismo poético e o paralelo entre a palavra e o sopro.
- source_word: כָּל־צְבָאָם
  choice: todo o seu exército
  rationale: צָבָא designa aqui o conjunto organizado dos corpos ou seres celestes. “Exército” preserva a metáfora hebraica, enquanto o pronome retoma “os céus” coletivamente.
theological_decisions:
- issue: רוּחַ na criação e sua possível ressonância trinitária
  choice: sopro
  alternative: Espírito
  rationale: O paralelo imediato entre “a palavra de Yahweh” e “o sopro de sua boca” favorece “sopro”, sem tornar explícita uma referência pessoal ao Espírito que o hebraico não exige. A alternativa teologicamente significativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética natural. “Exército” conserva a imagem tradicional de צָבָא; “Yahweh” preserva o nome divino.
