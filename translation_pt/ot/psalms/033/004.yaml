base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: pt
  text: 'Pois a palavra de Yahweh é reta,

    e toda a sua obra é feita com fidelidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do chamado ao louvor nos versículos anteriores e mantém com naturalidade o valor causal do hebraico.
- source_word: יָשָׁר
  choice: reta
  rationale: Expressa retidão, correção e integridade; concorda naturalmente com “palavra” e preserva a imagem hebraica.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” é a tradução corrente e adequada de דָּבָר neste contexto, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: e tudo o que ele faz
  rationale: O singular hebraico pode ter sentido coletivo. Esta formulação natural em português comunica a totalidade da atuação divina sem exigir o pouco idiomático “toda a sua obra” neste paralelismo.
- source_word: בֶּאֱמוּנָה
  choice: com fidelidade
  rationale: אֱמוּנָה denota firmeza, confiabilidade e fidelidade. “Com fidelidade” preserva o substantivo e exprime de modo natural a maneira que caracteriza toda a ação de Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama; a forma “Yahweh” preserva explicitamente o nome divino em vez de substituí-lo por um título.
- issue: Relação sintática de בֶּאֱמוּנָה com מַעֲשֵׂהוּ
  choice: tudo o que ele faz é com fidelidade
  alternative: toda a sua obra está em fidelidade
  rationale: A oração hebraica não contém verbo expresso. A tradução fornece a cópula exigida pelo português e entende a locução como caracterização do agir de Yahweh, sem alterar a afirmação de sua confiabilidade.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético em duas linhas. “Reta” conserva a imagem e o teor moral de יָשָׁר; “tudo o que ele faz” evita rigidez e comunica naturalmente o singular coletivo hebraico.
