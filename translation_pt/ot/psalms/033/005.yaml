  - severity: low
    issue: A chamada da nota está no fim da frase, embora a nota explique especificamente «amor leal».
    rationale: A chamada deve seguir o termo anotado para tornar seu referente inequívoco.
  revised_text: Ele ama a retidão e a justiça; a terra está cheia do amor leal[a] de Yahweh.
