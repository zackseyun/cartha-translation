  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: pt
  text: Ele ama a retidão e a justiça; a terra está cheia do amor leal[a] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor fiel”. O hebraico חֶסֶד expressa amor marcado por lealdade e fidelidade duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Ele ama
  rationale: O particípio qal masculino singular descreve de modo habitual Yahweh; a forma verbal finita é natural em português e preserva esse sentido.
- source_word: צְדָקָה
  choice: justiça
  rationale: No par com מִשְׁפָּט, indica retidão moral. “Justiça” é corrente e digna, enquanto o segundo termo é diferenciado como “o que é direito”.
- source_word: מִשְׁפָּט
  choice: o que é direito
  rationale: Expressa juízo, direito ou ordem justa. Esta formulação evita a repetição de “justiça” e preserva a distinção entre os termos hebraicos.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Reúne as ideias de amor, fidelidade e lealdade duradoura, sem exigir do leitor terminologia técnica de aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָלְאָה
  choice: está cheia
  rationale: O perfeito feminino singular tem aqui valor resultativo ou estativo presente e concorda com “a terra”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto cósmico do salmo favorece a referência ao mundo inteiro, não a uma terra ou região específica.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: amor fiel
  rationale: “Amor leal” preserva conjuntamente afeto e compromisso duradouro; a nota registra uma alternativa legítima sem restringir o termo a uma formulação denominacional.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: “Yahweh” representa diretamente o nome pessoal presente no texto hebraico; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensão internacional. A coordenação poética foi mantida; “justiça e o que é direito” evita uma repetição pouco informativa e conserva a distinção lexical do hebraico.
