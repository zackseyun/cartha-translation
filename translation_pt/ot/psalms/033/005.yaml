  naturalness: «Ele ama a retidão e a justiça; a terra está cheia do amor leal de Yahweh» é natural, claro e digno em português moderno de ampla compreensão. A construção preserva o paralelismo do versículo.
  terminology: «Yahweh» representa corretamente o Tetragrama. «Amor leal» é uma opção defensável para חֶסֶד; a nota «amor fiel» oferece uma alternativa legítima. «Retidão e justiça» mantém os termos ético-jurídicos distintos sem recorrer a formulação explicativa no corpo do texto.
  issues:
