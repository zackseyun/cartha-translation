  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: pt
  text: Nossa alma espera por Yahweh[a]; ele é o nosso auxílio e o nosso escudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Nossa alma espera por Yahweh”. Aqui, “alma” expressa todo o ser interior da comunidade, não apenas uma parte imaterial.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Nossa alma
  rationale: Preserva a imagem hebraica da נֶפֶשׁ singular com sufixo da primeira pessoa do plural, que expressa corporativamente todo o ser interior da comunidade, e não apenas uma parte imaterial.
- source_word: חִכְּתָה
  choice: espera
  rationale: O verbo חכה indica espera confiante ou expectante. O presente português é natural no contexto poético e comunica uma disposição contínua sem impor uma leitura temporal rígida do perfeito hebraico.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição ל marca aquele por quem se espera; em português, a construção idiomática é “esperar por”. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: עֶזְרֵנוּ
  choice: o nosso auxílio
  rationale: Mantém o substantivo עֵזֶר como auxílio ou ajuda, em vez de convertê-lo no substantivo pessoal “ajudador”. O artigo torna a oração nominal natural em português.
- source_word: וּמָגִנֵּנוּ
  choice: e o nosso escudo
  rationale: Conserva a metáfora concreta e transparente de מָגֵן, sem interpretá-la de modo redutivo como “protetor”.
- source_word: הוּא
  choice: ele é
  rationale: O pronome independente tem valor enfático na oração hebraica sem cópula. A tradução fornece o verbo exigido pelo português, sem acrescentar “somente”, que não está explícito.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama, nome divino da aliança. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A expressão coletiva singular “Nossa alma” foi mantida por fidelidade à imagem hebraica; “auxílio” evita a possível ambiguidade verbal de “ajuda” e preserva o substantivo abstrato.
