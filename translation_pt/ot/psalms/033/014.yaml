  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: pt
  text: Do lugar onde habita, ele observa todos os habitantes da terra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contempla” ou “vigia”. O verbo hebraico indica observação atenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “da terra”, entendida como uma região ou país; aqui, “da terra” é preferível porque o contexto é universal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Do lugar
  rationale: מָכוֹן designa um lugar estabelecido ou fixo. Com שִׁבְתּוֹ, a expressão natural em português é “do lugar onde habita”.
- source_word: שִׁבְתּוֹ
  choice: onde habita
  rationale: A forma derivada de ישׁב com sufixo significa “sua habitação” ou “o lugar onde ele habita”; a oração relativa evita uma construção nominal pesada em português.
- source_word: הִשְׁגִּיחַ
  choice: ele observa
  rationale: O hifil de שׁגח comunica olhar atento, contemplar ou vigiar. “Observa” preserva a atenção deliberada sem acrescentar necessariamente a ideia de proteção.
- source_word: אֶל
  choice: objeto direto em “observa”
  rationale: Embora אֶל costume indicar direção, o verbo português “observar” rege objeto direto e expressa naturalmente o olhar dirigido aos habitantes.
- source_word: כָּל
  choice: todos
  rationale: כָּל tem força abrangente sobre o grupo plural seguinte; “todos” conserva essa totalidade.
- source_word: יֹשְׁבֵי
  choice: os habitantes
  rationale: O particípio substantivado de ישׁב significa literalmente “os que habitam”; “os habitantes” é claro, corrente e coletivo.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: No contexto universal do salmo, הָאָרֶץ se refere ao mundo habitado, não apenas a uma região específica.
theological_decisions:
- issue: Alcance da observação divina
  choice: 'alcance universal: Deus observa todos os habitantes da terra'
  alternative: 'alcance regional: os habitantes da terra ou do território em questão'
  rationale: O contexto do salmo e o uso de כָּל favorecem a abrangência universal. A nota preserva a possibilidade lexical de “terra” como território sem impor uma conclusão doutrinária externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Do lugar onde habita” soa mais natural do que o nominal “do lugar de sua habitação”, e “observa” conserva a atenção expressa pelo verbo hebraico.
