base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: pt
  text: O cavalo é uma esperança enganosa de livramento[a]; com toda a sua força, não pode salvar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, literalmente, “O cavalo é uma mentira para o livramento”. “Livramento” também pode ser traduzido como “salvação” ou “vitória”. A expressão indica que o cavalo se mostra enganoso ou inútil como meio de livrar.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: esperança enganosa
  rationale: O substantivo denota falsidade ou engano. Nesta construção compacta, a expressão comunica que confiar no cavalo como meio de livramento é uma esperança que decepciona.
- source_word: הַסּוּס
  choice: o cavalo
  rationale: O artigo hebraico foi preservado; em português, o singular definido pode representar genericamente toda a classe e mantém o tom proverbial.
- source_word: לִתְשׁוּעָה
  choice: de livramento
  rationale: תְּשׁוּעָה pode significar salvação, livramento ou vitória. O contexto militar favorece 'livramento', sem excluir em nota as demais possibilidades.
- source_word: וּבְרֹב חֵילוֹ
  choice: apesar de toda a sua força
  rationale: Literalmente, a expressão é 'e em/pela abundância de sua força'. No contexto, a grande força do cavalo é apresentada como insuficiente; 'apesar de' torna natural em português essa relação concessiva implícita.
- source_word: לֹא יְמַלֵּט
  choice: não pode salvar
  rationale: O piel de מלט significa fazer escapar, livrar ou salvar. A negação, no contexto sapiencial, exprime incapacidade efetiva, e 'salvar' evita a repetição pouco natural de 'livramento/livrar'.
theological_decisions:
- issue: Sentido de תְּשׁוּעָה no contexto
  choice: livramento
  alternative: salvação; vitória
  rationale: O cenário de poder militar torna 'livramento' a opção contextual mais direta, enquanto a nota preserva a amplitude lexical sem impor um sentido teológico mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação mantém o paralelismo poético e o caráter proverbial, esclarecendo sem apagar a concisão e a amplitude lexical do hebraico.
