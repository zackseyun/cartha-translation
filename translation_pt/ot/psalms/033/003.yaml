  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: pt
  text: Cantem-lhe um cântico novo; toquem com habilidade, com brados de alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com forte aclamação”. O termo hebraico pode indicar um brado jubiloso, uma aclamação sonora ou, em certos contextos, um toque semelhante ao de trombeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” é a forma direta, natural e adequada ao chamado coletivo do salmo.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com sufixo masculino singular indica aqui o destinatário do cântico; “lhe” preserva de modo conciso a orientação a Deus.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Reproduz diretamente a expressão hebraica e mantém sua ressonância poética e litúrgica em português bíblico corrente.
- source_word: הֵיטִיבוּ
  choice: com habilidade
  rationale: O hifil de יטב modifica idiomaticamente o ato de tocar, exprimindo que ele deve ser bem executado; “com habilidade” comunica excelência musical sem rigidez literal.
- source_word: נַגֵּן
  choice: toquem
  rationale: O verbo נגן costuma designar a execução de música instrumental, especialmente em instrumentos de cordas. “Toquem” é claro e idiomático no contexto.
- source_word: בִּתְרוּעָה
  choice: com brados de alegria
  rationale: תְּרוּעָה pode indicar clamor forte, aclamação jubilosa ou toque estridente. No contexto de louvor, “brados de alegria” preserva tanto a intensidade sonora quanto o caráter festivo.
theological_decisions:
- issue: Referente do sufixo masculino singular em לוֹ
  choice: O pronome se refere a Deus, destinatário do louvor.
  alternative: Traduzir de modo menos explícito como “para ele”.
  rationale: O contexto imediato do salmo identifica o SENHOR como destinatário. “Cantem-lhe” mantém essa referência sem acrescentar uma identificação que não esteja expressa no próprio versículo.
- issue: Natureza de תְּרוּעָה
  choice: Aclamação humana jubilosa, sem excluir totalmente sua amplitude lexical.
  alternative: “Ao som de trombeta” ou “com toque estridente”.
  rationale: O contexto favorece uma aclamação de alegria, mas o termo hebraico também pode designar um toque semelhante ao de trombeta; a nota preserva essa abertura sem impor um instrumento ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cântico” conserva a tonalidade poética e litúrgica; “toquem com habilidade” soa natural e explicita corretamente o valor idiomático da construção hebraica. A nota é colocada após a expressão a que se refere.
