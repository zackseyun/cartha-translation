  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: pt
  text: Eis que o olhar de Yahweh está sobre os que o temem, sobre os que esperam[a] por seu amor leal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “põem a esperança em seu amor leal”. O verbo hebraico pode expressar tanto esperar quanto ter esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e dar ênfase, com tom poético e digno em português.
- source_word: עֵין
  choice: o olhar
  rationale: Expressa naturalmente em português a metáfora do olho como atenção vigilante, sem acrescentar uma interpretação além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: está sobre
  rationale: No idioma formado com עֵין, indica que a atenção vigilante de Yahweh se dirige a essas pessoas; “está sobre” preserva a imagem e soa natural.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: Preserva a linguagem bíblica do temor de Yahweh, que inclui reverência e submissão, sem reduzi-la apenas a respeito.
- source_word: לַמְיַחֲלִים
  choice: os que esperam
  rationale: O verbo יחל abrange espera confiante e esperança. “Esperam” conserva a dimensão durativa, enquanto a nota registra a alternativa legítima.
- source_word: לְחַסְדּוֹ
  choice: por seu amor leal
  rationale: A preposição é entendida como complemento do verbo “esperar”. “Amor leal” comunica a benevolência fiel e comprometida de חֶסֶד sem restringi-la somente à misericórdia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. A transliteração “Yahweh” preserva esse nome em vez de substituí-lo por um título.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: amor constante; misericórdia
  rationale: “Amor leal” conserva tanto a bondade quanto a fidelidade relacional do termo, sem limitá-lo à compaixão.
- issue: Amplitude semântica de יחל
  choice: esperam, com nota indicando “põem a esperança”
  alternative: põem a esperança
  rationale: O hebraico permite as ideias interligadas de aguardar e esperar com confiança. O texto principal mantém a espera, e a nota preserva explicitamente a outra nuance.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Eis que” mantém o relevo poético; “o olhar” evita a estranheza de “o olho” em português sem eliminar a imagem de atenção vigilante.
