  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: pt
  text: O rei não é salvo por um grande exército[a]; o guerreiro[b] não é livrado por grande força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por muita força militar»; o termo hebraico também pode indicar poder, recursos ou capacidade militar de modo mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou «o homem valente».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: não é
  rationale: Com o sujeito e o particípio seguintes, expressa de modo natural a negação da possibilidade de salvação por meios militares.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Preserva o artigo definido hebraico e a formulação proverbial com o singular definido.
- source_word: נוֹשָׁע
  choice: é salvo
  rationale: O nifal de ישׁע indica ser salvo ou libertado; «salvo» mantém a amplitude do termo bíblico no contexto militar.
- source_word: בְּרָב חָיִל
  choice: por um grande exército
  rationale: A preposição indica meio, רָב expressa grandeza ou abundância, e חָיִל, neste contexto régio e militar, designa naturalmente forças armadas.
- source_word: גִּבּוֹר
  choice: o guerreiro
  rationale: Designa um homem forte ou valente, especialmente no combate; «guerreiro» é claro e natural em português moderno.
- source_word: לֹא יִנָּצֵל
  choice: não é livrado
  rationale: O nifal de נצל significa ser libertado ou resgatado; «livrado» distingue o verbo daquele do primeiro hemistíquio sem apagar o paralelismo.
- source_word: בְּרָב כֹּחַ
  choice: por sua grande força
  rationale: כֹּחַ denota força ou poder; o possessivo explicita em português a relação natural entre o guerreiro e a força mencionada, sem alterar o sentido.
theological_decisions:
- issue: Fonte da salvação ou vitória
  choice: Manter apenas a negação de que recursos militares garantam livramento
  alternative: Explicitar que somente Deus salva
  rationale: O contexto do salmo associa a libertação ao SENHOR, mas este versículo formula somente a insuficiência do exército e da força; a tradução não deve acrescentar a conclusão teológica ao próprio verso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo poético foi preservado por meio de «salvo/livrado» e «rei/guerreiro». Os marcadores seguem imediatamente os termos aos quais se referem.
