  text: חָנֵּ֣/נוּ יְהוָ֣ה חָנֵּ֑/נוּ כִּֽי רַ֝֗ב שָׂבַ֥עְנוּ בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: pt
  text: Mostra-nos favor[a], Yahweh; mostra-nos favor, pois estamos mais que fartos de desprezo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tem compaixão de nós” ou “Sê gracioso conosco”. O verbo hebraico pode expressar a concessão de favor, graça ou compaixão.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pois muito estamos saciados de desprezo”. A expressão indica que eles receberam ou suportaram desprezo em excesso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Tem compaixão de nós
  rationale: O imperativo de חנן com sufixo de primeira pessoa do plural pede que Deus mostre favor, graça ou misericórdia. Em português corrente, “tem compaixão de nós” expressa naturalmente a súplica sem exigir a formulação menos idiomática “sê gracioso conosco”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso e natural a razão da súplica.
- source_word: רַב שָׂבַעְנוּ
  choice: já estamos fartos
  rationale: A combinação intensiva significa literalmente que os orantes estão muito saciados ou cheios; “já estamos fartos” comunica em português a experiência de excesso e saturação.
- source_word: בּוּז
  choice: desprezo
  rationale: Designa desprezo ou tratamento desdenhoso; “desprezo” preserva o sentido abstrato e o tom do lamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Amplitude semântica de חנן
  choice: Tem compaixão de nós
  alternative: Sê gracioso conosco
  rationale: A expressão portuguesa escolhida torna a súplica clara e natural, enquanto a nota conserva explicitamente a possibilidade de entender o verbo como pedido de favor ou graça.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A repetição da súplica foi preservada como recurso poético. O vocativo não recebeu “ó”, desnecessário em português corrente.
