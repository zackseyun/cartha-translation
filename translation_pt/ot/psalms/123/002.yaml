id: PSA.123.2
reference: Psalms 123:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: pt
  text: 'Vejam[a]: assim como os olhos dos servos estão voltados para a mão de seus senhores, e os olhos da serva, para a mão de sua senhora, assim também os nossos olhos estão voltados para Yahweh, nosso Deus, até que ele nos conceda seu favor.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos”; a imagem é a de dependentes atentos à mão de seu superior, à espera de um sinal, ação ou provisão.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que seja bondoso conosco” ou “até que tenha misericórdia de nós”.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Partícula que chama a atenção e introduz a comparação. O plural é natural em português ao dirigir-se à comunidade, sem recorrer ao arcaico “eis”.
- source_word: כְעֵינֵי
  choice: assim como os olhos de
  rationale: Preserva explicitamente a comparação marcada por כְּ e sustenta o paralelismo poético.
- source_word: עֲבָדִים
  choice: servos
  rationale: O termo pode designar servos ou escravos; aqui a imagem destaca dependência e atenção à mão do superior. “Servos” é claro e digno, enquanto a alternativa lexical é registrada em nota.
- source_word: יַד
  choice: mão
  rationale: Mantém a imagem concreta do hebraico, que pode sugerir tanto um sinal quanto a ação ou provisão do superior.
- source_word: אֲדֹנֵיהֶם
  choice: seus senhores
  rationale: Reproduz o plural com sufixo possessivo e corresponde ao contexto doméstico da comparação.
- source_word: שִׁפְחָה
  choice: a serva
  rationale: Preserva de modo conciso a distinção feminina expressa pelo substantivo hebraico.
- source_word: גְּבִרְתָּהּ
  choice: sua senhora
  rationale: Equivalente corrente para a superior feminina no contexto doméstico, evitando sentidos modernos indesejados de “mestra”.
- source_word: כֵּן
  choice: assim também
  rationale: Assinala com clareza a conclusão da comparação e torna explícita sua correspondência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a convenção do projeto.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo da primeira pessoa do plural.
- source_word: עַד שֶׁיְּחָנֵּנוּ
  choice: até que ele nos conceda seu favor
  rationale: Expressa a ação graciosa de חנן em português natural, preservando em nota as nuances igualmente possíveis de graça e misericórdia.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Nuance de חנן na oração final
  choice: nos conceda seu favor
  alternative: seja bondoso conosco; tenha misericórdia de nós
  rationale: O verbo denota agir graciosamente ou mostrar favor. A redação principal conserva esse núcleo sem excluir as nuances tradicionais, registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi preservado; a elipse da segunda oração foi reproduzida por meio de vírgula, e “assim também” marca naturalmente a conclusão da comparação.
