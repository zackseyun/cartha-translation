base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/000.yaml
  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
translation:
  language: pt
  text: 'Cântico das subidas.


    A ti levantei os meus olhos,


    ó tu que estás sentado nos céus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habitas nos céus” ou “que estás entronizado nos céus”. O verbo hebraico pode significar sentar-se ou habitar e, neste contexto, pode ter conotação régia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Mantém a imagem concreta do título hebraico e a forma tradicional do saltério, sem decidir se as subidas são peregrinações, degraus ou outra referência.
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: levanto os meus olhos
  rationale: Expressa de modo natural em português o gesto hebraico de erguer os olhos; o presente dá vivacidade à declaração poética, embora a forma hebraica também possa ser traduzida no passado.
- source_word: הַיֹּשְׁבִי
  choice: que estás sentado
  rationale: Reproduz o sentido básico de ישׁב e preserva possíveis conotações de residência e soberania sem explicitar 'entronizado' no texto.
- source_word: בַּשָּׁמָיִם
  choice: nos céus
  rationale: Conserva o plural formal do hebraico, em vez de simplificá-lo para 'no céu'.
theological_decisions:
- issue: Possível conotação régia de הַיֹּשְׁבִי
  choice: que estás sentado nos céus
  alternative: que estás entronizado nos céus
  rationale: A tradução principal preserva o valor lexical direto e deixa implícita a imagem de soberania, evitando resolver uma nuance que o hebraico não torna explícita.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. A repetição de “a ti” explicita naturalmente o destinatário retomado pela oração seguinte. O título foi mantido separado do corpo do salmo.
