lexical_decisions:
- source_word: רַבַּת שָׂבְעָה
  choice: já está mais que farta
  rationale: A combinação do intensificador רַבַּת com שָׂבְעָה expressa saturação excessiva. A formulação portuguesa comunica naturalmente que se suportou algo desagradável além do limite.
- source_word: נַפְשֵׁנוּ
  choice: Nossa alma
  rationale: Preserva a imagem coletiva e poética do hebraico, em vez de reduzi-la simplesmente a “nós”.
- source_word: הַלַּעַג
  choice: a zombaria
  rationale: Expressa a ridicularização ou escárnio verbal indicado por לעג em linguagem atual e clara.
- source_word: הַשַּׁאֲנַנִּים
  choice: os que vivem despreocupados
  rationale: O termo descreve pessoas tranquilas, seguras e potencialmente complacentes. A escolha mantém a ideia de uma vida sem perturbação sem impor como única a nuance moral de complacência.
- source_word: הַבּוּז
  choice: o desprezo
  rationale: Traduz diretamente a atitude de desdém e forma um paralelo claro com “zombaria”.
- source_word: לִגְאֵיוֹנִים
  choice: dos orgulhosos
  rationale: O termo designa pessoas altivas ou arrogantes; “orgulhosos” é conciso, digno e preserva a carga negativa no contexto.
