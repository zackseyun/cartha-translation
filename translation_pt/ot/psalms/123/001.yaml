source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: pt
  text: 'Cântico das subidas.[a]


    A ti levanto os meus olhos,

    ó tu que habitas nos céus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título hebraico também pode ser traduzido como “Cântico das ascensões” ou “Cântico dos degraus”. Não está claro se as “subidas” se referem a peregrinações, a degraus litúrgicos ou a outra imagem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que estás sentado nos céus”. O verbo hebraico pode significar “sentar-se” ou “habitar” e, neste contexto, talvez tenha a conotação régia de estar entronizado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz diretamente o substantivo hebraico e mantém o registro poético e litúrgico do cabeçalho.
- source_word: הַמַּעֲלוֹת
  choice: das subidas
  rationale: Preserva a imagem hebraica de subir sem decidir se o título se refere a peregrinações, degraus litúrgicos ou outra forma de elevação.
- source_word: אֵלֶיךָ
  choice: A ti
  rationale: Mantém a direção da oração e a ênfase inicial do hebraico, em português natural e solene.
- source_word: נָשָׂאתִי
  choice: levanto
  rationale: O perfeito hebraico descreve aqui o ato de oração do salmista; o presente comunica esse valor de modo natural em português.
- source_word: אֶת עֵינַי
  choice: os meus olhos
  rationale: Conserva a imagem concreta do hebraico, em vez de substituí-la pela ideia mais abstrata de olhar ou atenção.
- source_word: הַיֹּשְׁבִי
  choice: que habitas
  rationale: O particípio de ישׁב pode expressar sentar-se ou habitar. “Habitas” é natural na invocação portuguesa, enquanto a nota preserva o sentido literal e a possível conotação régia.
- source_word: בַּשָּׁמָיִם
  choice: nos céus
  rationale: Reproduz o plural formal do hebraico e mantém o registro elevado do salmo.
theological_decisions:
- issue: Sentido da descrição divina הַיֹּשְׁבִי בַּשָּׁמָיִם
  choice: ó tu que habitas nos céus
  alternative: ó tu que estás sentado nos céus; ó tu que estás entronizado nos céus
  rationale: A tradução mantém a interpelação direta a Deus sem acrescentar um título divino. O texto principal conserva o sentido de habitação, e a nota registra tanto a imagem literal de estar sentado quanto sua possível conotação de realeza, sem impor essa interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com ordem poética que preserva a ênfase do hebraico. “Cântico” e “nos céus” mantêm o tom elevado sem recorrer a formas arcaicas; as notas conservam as ambiguidades reais do título e do verbo ישׁב.
