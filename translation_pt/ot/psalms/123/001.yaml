  source_fidelity: 'O texto preserva adequadamente todos os elementos do hebraico: o cabeçalho שִׁיר הַמַּעֲלוֹת, a direção enfática de אֵלֶיךָ, o gesto poético de levantar os olhos e a descrição do destinatário como aquele que está/habita nos céus. «Das subidas» conserva deliberadamente a indeterminação de הַמַּעֲלוֹת, e «habitas» é uma opção semanticamente possível para יָשַׁב sem tornar obrigatória a nuance régia.'
