base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: pt
  text: Eles têm boca[a], mas não falam; têm olhos, mas não veem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “boca para eles ... olhos para eles”, uma construção possessiva com o sentido de “Eles têm boca ... olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: boca
  rationale: 'Embora o substantivo hebraico esteja no singular, ele tem sentido distributivo com o pronome plural: cada ídolo tem boca. O singular distributivo também é natural em português.'
- source_word: לָהֶם
  choice: eles têm / têm
  rationale: A construção hebraica com ל e sufixo pronominal expressa posse; em português corrente, traduz-se naturalmente pelo verbo “ter”.
- source_word: יְדַבֵּרוּ
  choice: não falam
  rationale: O piel de דבר significa “falar”. A tradução conserva a negação simples do hebraico, sem explicitar “não podem falar”.
- source_word: עֵינַיִם
  choice: olhos
  rationale: Correspondência lexical direta, mantendo o plural do hebraico.
- source_word: יִרְאוּ
  choice: não veem
  rationale: O qal de ראה significa normalmente “ver”. A formulação preserva a negação simples, sem acrescentar uma modalidade de incapacidade.
theological_decisions:
- issue: Descrição antropomórfica dos ídolos
  choice: Manter a imagem concreta de órgãos que não exercem suas funções, sem explicação interpretativa adicional.
  alternative: “Eles têm boca, mas não podem falar; têm olhos, mas não podem ver.”
  rationale: O versículo ridiculariza os ídolos mediante contrastes concretos. “Não falam” e “não veem” reproduzem mais precisamente a forma hebraica e deixam que o contexto comunique a impotência deles.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. O singular “boca” preserva o singular distributivo hebraico; “olhos” mantém o plural do original.
