  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: pt
  text: E deu a terra deles como herança[a], uma herança para Israel, seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como patrimônio”; o hebraico repete “herança” para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: E deu
  rationale: O verbo no qal com a conjunção dá continuidade à sequência de louvor e tem sentido passado; em português, o sujeito pode permanecer implícito, como no hebraico.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: אֶרֶץ pode significar terra, país ou território; aqui o sufixo se refere às nações e aos reis derrotados no contexto anterior, e “a terra deles” é direto e natural.
- source_word: נַחֲלָה
  choice: como herança
  rationale: A primeira ocorrência funciona predicativamente depois de נתן; “herança” preserva o sentido de patrimônio recebido e repartido.
- source_word: נַחֲלָה
  choice: como herança
  rationale: A segunda ocorrência é uma repetição enfática. Repetir a mesma expressão conserva o paralelismo e a ênfase do hebraico.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: A preposição לְ marca o destinatário ou beneficiário; “a Israel” expressa isso de modo conciso.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עַם designa um povo e, neste contexto, Israel como povo pertencente a Deus; “seu povo” é natural e fiel.
theological_decisions:
- issue: Repetição poética de נַחֲלָה
  choice: 'Preservar no texto principal: “como herança, como herança”'
  alternative: Reduzir a uma só ocorrência para tornar a frase mais fluida
  rationale: A repetição hebraica é intencional e enfática. Mantê-la conserva o peso poético e pactual do texto sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção concisa. A repetição incomum foi mantida para refletir a forma poética hebraica; a nota registra uma alternativa lexical.
