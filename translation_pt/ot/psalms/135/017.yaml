  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: pt
  text: Têm ouvidos, mas não escutam; de fato, não há sopro[a] em suas bocas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito”. O termo hebraico רוּחַ pode significar “sopro”, “espírito” ou “vento”; aqui, o contexto de ídolos sem vida e a expressão “em suas bocas” favorecem “sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: Têm ouvidos
  rationale: A construção hebraica de posse, literalmente “ouvidos para eles”, é expressa de modo natural em português por “têm ouvidos”.
- source_word: וְלֹא יַאֲזִינוּ
  choice: mas não escutam
  rationale: A conjunção introduz contraste, e o hifil de אזן indica escutar ou dar ouvidos; “escutam” preserva essa nuance atentiva e soa natural em português.
- source_word: אַף
  choice: de fato
  rationale: Neste contexto, a partícula reforça e faz progredir a afirmação, mais do que apenas acrescentar outra incapacidade.
- source_word: אֵין יֶשׁ רוּחַ
  choice: não há sopro
  rationale: A expressão nega a existência de רוּחַ; no contexto de ídolos inertes e da referência à boca, “sopro” comunica concretamente a ausência de vida.
- source_word: בְּפִיהֶם
  choice: em sua boca
  rationale: O hebraico emprega o substantivo “boca” no singular com sufixo plural, distributivamente. “Em sua boca” preserva essa forma e é idiomático em português.
theological_decisions:
- issue: Sentido de רוּחַ na polêmica contra os ídolos
  choice: sopro
  alternative: espírito
  rationale: A sequência descreve órgãos que os ídolos possuem sem que funcionem e culmina na ausência de sopro em sua boca. “Sopro” mantém a imagem concreta de seres sem vida, enquanto a nota preserva a alternativa lexical genuína “espírito”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Escutam” reproduz a nuance de atenção do verbo hebraico; “de fato” conserva a intensificação de אַף.
