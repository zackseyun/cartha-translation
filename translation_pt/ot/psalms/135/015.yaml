  text: עֲצַבֵּ֣י הַ֭/גּוֹיִם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: pt
  text: Os ídolos[a] das nações são prata e ouro, obra de mãos humanas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imagens”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “obra das mãos do ser humano”.
    reason: literal_rendering
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: ídolos
  rationale: O substantivo designa aqui objetos de culto em um contexto de crítica religiosa; “ídolos” expressa melhor essa força do que o termo mais neutro “imagens”.
- source_word: הַגּוֹיִם
  choice: das nações
  rationale: No contexto dos Salmos, o termo se refere aos povos ou nações; “das nações” é claro, natural e não introduz uma conotação posterior de “gentios”.
- source_word: כֶּסֶף וְזָהָב
  choice: prata e ouro
  rationale: Tradução direta dos materiais de que os ídolos são feitos.
- source_word: מַעֲשֵׂה יְדֵי
  choice: obra de mãos
  rationale: Preserva a imagem concreta do hebraico e ressalta que os ídolos são produtos da fabricação humana.
- source_word: אָדָם
  choice: humanas
  rationale: O termo é genérico neste contexto. Em “mãos humanas”, o português comunica com naturalidade a origem meramente humana dos ídolos, sem restringir a referência ao sexo masculino.
theological_decisions:
- issue: Sentido antropológico genérico de אָדָם
  choice: mãos humanas
  alternative: mãos do homem / mãos do ser humano
  rationale: O contraste é entre os ídolos fabricados e o Deus vivo, não entre homens e mulheres. “Mãos humanas” conserva esse contraste e é idiomático em português.
- issue: Caracterização dos objetos religiosos como עֲצַבִּים
  choice: ídolos
  alternative: imagens
  rationale: O contexto é polemicamente contrário ao culto desses objetos; “ídolos” preserva essa avaliação sem transformar toda imagem em objeto de culto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação concisa acompanha o paralelismo e a força direta do hebraico.
