  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: pt
  text: Casa de Israel, bendigam Yahweh[a]; casa de Arão, bendigam Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido como “SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional do nome divino.
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: Casa de Israel
  rationale: Preserva a expressão coletiva e pactual do hebraico, bem como o paralelismo poético com “casa de Arão”.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: Traduz o imperativo masculino plural de ברך com precisão, mantendo o sentido doxológico e usando uma forma corrente e compreensível em português moderno.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: O marcador de objeto direto אֶת introduz o nome divino יהוה; a transliteração preserva no texto o nome pactual em vez de substituí-lo por um título.
- source_word: בֵּית אַהֲרֹן
  choice: casa de Arão
  rationale: Mantém a construção hebraica e o paralelismo com “Casa de Israel”, sem explicitar além do texto que se trata da linhagem sacerdotal de Arão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome divino na tradução, enquanto a nota registra a forma tradicional baseada na substituição reverencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “bendigam” evita o tom excessivamente arcaico de “bendizei” e preserva a exortação dirigida aos dois grupos. A repetição e o paralelismo do hebraico foram mantidos.
