lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: que matou
  rationale: A partícula relativa seguida do hifil perfeito de נכה dá continuidade à descrição do SENHOR. No contexto da morte dos primogênitos, “matou” comunica de modo natural e explícito o sentido letal, sem recorrer ao menos corrente “feriu de morte”.
- source_word: בְּכוֹרֵי מִצְרָיִם
  choice: os primogênitos do Egito
  rationale: O plural construto de בכור designa coletivamente os que tinham a condição de primogênitos; “do Egito” preserva o nome geográfico hebraico e a formulação bíblica corrente.
- source_word: מֵ/אָדָם עַד בְּהֵמָה
  choice: desde os seres humanos até os animais
  rationale: A construção correlativa מִן...עַד expressa toda a extensão, de humanos a animais. A formulação inclusiva e atual evita que “homem” seja entendido apenas como adulto do sexo masculino, e “animais” reflete a categoria ampla de בְּהֵמָה neste resumo poético.
