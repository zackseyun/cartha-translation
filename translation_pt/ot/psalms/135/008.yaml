translation:
  language: pt
  text: que matou os primogênitos do Egito,[a] desde os seres humanos até os animais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que feriu os primogênitos do Egito”. “Matou” explicita o sentido letal indicado pelo contexto.'
