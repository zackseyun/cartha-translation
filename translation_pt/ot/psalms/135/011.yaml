base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: pt
  text: a Seom, rei dos amorreus, e a Ogue, rei de Basã, e a todos os reinos de Canaã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/סִיחוֹן
  choice: a Seom
  rationale: O לְ inicial liga este item ao verbo do versículo anterior e marca Seom como alvo da ação; o nome segue a forma portuguesa tradicional e reconhecível.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: A construção hebraica com o gentílico definido designa o povo amorreu; o plural português é a expressão natural.
- source_word: וּ/לְ/עוֹג
  choice: a Ogue
  rationale: A conjunção é representada na coordenação final da lista em português, e a preposição mantém o paralelismo sintático; Ogue é a forma portuguesa tradicional do nome.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: rei de Basã
  rationale: Tradução direta e idiomática da construção de título e topônimo.
- source_word: וּ/לְ/כֹל
  choice: e a todos
  rationale: Preserva tanto a conjunção quanto a preposição repetida, mantendo a ligação com a ação do versículo anterior.
- source_word: מַמְלְכוֹת
  choice: reinos
  rationale: Designa reinos ou domínios reais e é a opção mais clara neste contexto histórico-geográfico.
- source_word: כְּנָעַן
  choice: Canaã
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O versículo é um fragmento que continua a lista e a sintaxe do versículo anterior; por isso, as preposições iniciais foram preservadas. A conjunção antes de Ogue foi acomodada à coordenação portuguesa, evitando a sequência pouco natural «a Seom, e a Ogue, e a todos» sem perda de conteúdo.
