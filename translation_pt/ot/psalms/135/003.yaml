id: PSA.135.3
reference: Psalms 135:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: pt
  text: Louvem a Yah[a], pois Yahweh é bom; cantem louvores ao seu nome, pois é agradável[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “Yah”, forma abreviada do nome divino, distinta de “Yahweh” na frase seguinte.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois ele é agradável/amável”, entendendo que o adjetivo descreve Yahweh, e não seu nome ou o ato de louvá-lo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louvem
  rationale: Imperativo plural de הלל, empregado como convocação litúrgica. “Louvem” é direto, atual e preserva a exortação coletiva.
- source_word: יָהּ
  choice: Yah
  rationale: Forma abreviada do nome divino, mantida distinta do יְהוָה que aparece em seguida.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para o louvor; “pois” é conciso e adequado ao registro poético.
- source_word: טוֹב
  choice: bom
  rationale: Expressa de modo amplo a bondade de Yahweh, sem restringi-la apenas à benevolência ou à amabilidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva a distinção em relação à forma abreviada Yah.
- source_word: זַמְּרוּ
  choice: cantem louvores
  rationale: O imperativo de זמר indica louvor musical; a expressão comunica tanto o canto quanto seu caráter de adoração.
- source_word: לִשְׁמוֹ
  choice: ao seu nome
  rationale: Reproduz naturalmente em português a expressão hebraica de louvor dirigido ao nome, isto é, à identidade e reputação reveladas de Deus.
- source_word: נָעִים
  choice: agradável
  rationale: Equivalente direto para aquilo que é aprazível, deleitoso ou amável. A ausência de sujeito explícito em português ajuda a conservar a ambiguidade do hebraico.
theological_decisions:
- issue: Distinção entre os nomes divinos יָהּ e יְהוָה
  choice: Yah e Yahweh
  alternative: Senhor em ambos os casos, ou Senhor para יְהוָה
  rationale: O hebraico emprega duas formas distintas no mesmo verso. Mantê-las como “Yah” e “Yahweh” preserva esse efeito e apresenta o nome pessoal em vez de substituí-lo por um título.
- issue: Referente de נָעִים (“agradável”)
  choice: 'Manter o sujeito implícito: “pois é agradável”'
  alternative: “Pois ele é agradável/amável”, referindo-se explicitamente a Yahweh
  rationale: A sintaxe permite relacionar o adjetivo ao nome, ao ato de louvar/cantar ou ao próprio Yahweh. A tradução principal evita eliminar essa tensão, e a nota registra a leitura pessoal.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Os imperativos plurais são inclusivos e naturais. Os nomes divinos são transliterados de modo consistente, e a formulação final conserva a ambiguidade genuína do hebraico.
