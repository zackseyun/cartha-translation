  text: כֹּ֤ל אֲשֶׁר חָפֵ֥ץ יְהוָ֗ה עָ֫שָׂ֥ה בַּ/שָּׁמַ֥יִם וּ/בָ/אָ֑רֶץ בַּ֝/יַּמִּ֗ים וְ/כָל תְּהוֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: pt
  text: Tudo o que Yahweh deseja, ele faz, nos céus e na terra, nos mares e em todas as profundezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tudo o que
  rationale: Expressa naturalmente em português a totalidade abrangida pela construção hebraica, sem perder seu caráter inclusivo.
- source_word: חָפֵץ
  choice: deseja
  rationale: Preserva o campo semântico de ter prazer, desejar ou querer; neste contexto, evita tornar explícita uma nuance de arbitrariedade que o hebraico não exige.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עָשָׂה
  choice: faz
  rationale: Embora seja uma forma qatal, no contexto proverbial ou gnômico apresenta uma verdade geral sobre a atuação de Yahweh; o presente é natural em português.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: Mantém o plural formal do hebraico e soa natural no paralelismo cósmico com a terra.
- source_word: וּבָאָרֶץ
  choice: e na terra
  rationale: Reproduz de modo idiomático o par abrangente céus-terra.
- source_word: בַּיַּמִּים
  choice: nos mares
  rationale: Conserva o plural hebraico e a linguagem poética referente às grandes extensões de água.
- source_word: וְכָל תְּהוֹמוֹת
  choice: e em todas as profundezas
  rationale: Mantém a abrangência e a possível referência às profundezas aquáticas ou abissais, sem especificá-la além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino; sua transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Valor aspectual de עָשָׂה
  choice: 'presente gnômico: “faz”'
  alternative: 'pretérito perfeito: “fez”'
  rationale: O contexto louva a soberania divina como verdade geral. O presente comunica isso naturalmente, embora a forma hebraica também possa ser vertida no passado.
- issue: Nuance de חָפֵץ
  choice: “deseja”
  alternative: “quer”; “lhe agrada”
  rationale: “Deseja” preserva a dimensão volitiva sem resolver indevidamente se o verbo enfatiza vontade, prazer ou deleite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética e a enumeração cósmica do hebraico foram preservadas; não foram acrescentadas notas porque a tradução principal mantém as ambiguidades relevantes de modo inteligível.
