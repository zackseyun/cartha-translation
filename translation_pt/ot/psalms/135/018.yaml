  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: pt
  text: Os que os fazem se tornarão semelhantes a eles[a], assim também todos os que neles confiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão semelhantes a eles”. O verbo hebraico pode indicar tanto “ser” quanto “tornar-se”; no texto, foi adotado o sentido de resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: semelhantes a eles
  rationale: A preposição comparativa com sufixo masculino plural expressa semelhança com os ídolos descritos nos versículos anteriores. A formulação é natural em português e não especifica em que consiste essa semelhança.
- source_word: יִהְיוּ
  choice: se tornarão
  rationale: O verbo היה pode indicar tanto estado ('serão') quanto resultado ('se tornarão'). Neste contexto, a leitura resultativa comunica naturalmente que os fabricantes e os que confiam nos ídolos vêm a assemelhar-se a eles.
- source_word: עֹשֵׂיהֶם
  choice: os que os fazem
  rationale: O particípio de עשה com sufixo designa aqueles que fazem os ídolos. A expressão preserva o sentido agentivo e é clara em português corrente.
- source_word: כֹּל אֲשֶׁר
  choice: assim como todos os que
  rationale: A construção abrange universalmente todos os que confiam nos ídolos. 'Assim como' explicita de modo natural que este segundo grupo compartilha o mesmo destino, sem acrescentar conteúdo teológico.
- source_word: בֹּטֵחַ בָּהֶם
  choice: neles confiam
  rationale: בטח com a preposição ב expressa confiança depositada em alguém ou algo. 'Confiar em' é a correspondência idiomática direta em português.
theological_decisions:
- issue: Natureza da semelhança com os ídolos
  choice: O versículo afirma que tanto os fabricantes quanto todos os que confiam nos ídolos se tornarão semelhantes a eles, sem definir a natureza exata dessa semelhança.
  alternative: Explicitar que eles se tornam espiritualmente insensíveis, impotentes ou sem vida como os ídolos.
  rationale: O hebraico afirma a semelhança, mas não explica seu mecanismo nem sua dimensão precisa. A tradução preserva essa tensão e evita impor uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos pronomes mantém claros os referentes aos ídolos, e a construção paralela conserva o caráter proverbial e solene do hebraico.
