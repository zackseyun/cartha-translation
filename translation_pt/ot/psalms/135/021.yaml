base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: pt
  text: Bendito seja Yahweh de Sião, que habita em Jerusalém. Aleluia![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Louvem Yah!” “Aleluia” é a forma tradicionalmente usada em português para esta expressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo integra uma fórmula doxológica; “Bendito seja” conserva tanto o valor de bênção quanto a força litúrgica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מִצִּיּוֹן
  choice: desde Sião
  rationale: Preserva o sentido básico de origem da preposição מִן e apresenta Sião como o lugar de onde se eleva a bênção, sem reduzi-la à mera localização de Yahweh.
- source_word: שֹׁכֵן
  choice: ele que habita
  rationale: O particípio qal de שכן descreve Yahweh como aquele que habita em Jerusalém. A formulação evita acrescentar a ideia de entronização, não expressa pelo verbo.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: הַלְלוּ יָהּ
  choice: Aleluia!
  rationale: A forma litúrgica tradicional em português reproduz a expressão hebraica formada pelo imperativo plural “louvem” e pela forma abreviada do nome divino, “Yah”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal e corresponde melhor à vocalização historicamente reconstruída.
- issue: Relação sintática de “desde Sião”
  choice: Lugar de onde Yahweh é bendito
  alternative: Local onde Yahweh está
  rationale: O valor normal de מִן é “de/desde”. A tradução mantém essa relação, enquanto a oração seguinte identifica Jerusalém como o lugar onde ele habita.
translation_notes:
  register: Português moderno, claro e solene, com cadência litúrgica. “Ele que habita” conserva a função apositiva do particípio hebraico; “Aleluia” mantém a fórmula tradicional, explicada em nota.
