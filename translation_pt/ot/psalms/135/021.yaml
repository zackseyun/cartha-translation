revisions:
- from: Bendito seja Yahweh desde Sião, ele que habita em Jerusalém. Aleluia![a]
  to: Bendito seja Yahweh de Sião, que habita em Jerusalém. Aleluia![a]
  rationale: A revisão substitui «desde Sião» por «de Sião», mais idiomático para a procedência espacial, e simplifica a oração apositiva para «que habita». A nota é ajustada para explicar com precisão a relação entre a expressão hebraica e a fórmula litúrgica portuguesa. Não há alteração de sentido.
