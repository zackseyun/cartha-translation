  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: pt
  text: vocês que estão de pé na casa de Yahweh[a], nos pátios da casa do nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa de Yahweh” é o templo, incluindo o santuário e suas dependências.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: vocês que estão
  rationale: A partícula relativa com o particípio dá continuidade ao chamado do versículo anterior. Em português, “vocês que estão” expressa naturalmente a condição durativa sem tornar o texto rígido.
- source_word: בְּבֵית
  choice: na casa de
  rationale: Mantém a imagem hebraica de “casa”, que neste contexto designa o santuário e suas dependências, sem substituí-la no texto por uma explicação interpretativa como “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּחַצְרוֹת
  choice: nos pátios
  rationale: O plural de חָצֵר refere-se aos pátios ou átrios do complexo do templo. “Pátios” é claro e corrente em português.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: casa do nosso Deus
  rationale: Preserva a repetição poética de “casa” e traduz diretamente o possessivo comunitário “nosso Deus”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome explícito “vocês” retoma naturalmente os “servos de Yahweh” do versículo anterior. “Pátios” foi preferido a “átrios” por ser mais corrente, mantendo o cenário do templo.
