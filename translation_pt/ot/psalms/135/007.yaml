id: PSA.135.7
reference: Psalms 135:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: pt
  text: Ele faz subir as nuvens[a] dos confins da terra[b]; produz relâmpagos para a chuva e faz sair o vento de seus depósitos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapores” ou “névoas”. O termo hebraico pode indicar umidade que se eleva, mas “nuvens” se ajusta melhor ao contexto de tempestade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do confim da terra”. A forma singular hebraica pode representar coletivamente as regiões mais distantes da terra.
    reason: lexical_alternative
  - marker: c
    text: Ou “de seus tesouros”. A imagem apresenta Deus guardando os ventos e liberando-os segundo sua vontade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: faz subir
  rationale: O particípio hifil de עלה expressa ação causativa. “Faz subir” conserva esse valor e soa natural em português.
- source_word: נְשִׂאִים
  choice: nuvens
  rationale: Embora o termo possa designar vapores ou névoas que se elevam, o contexto meteorológico de chuva, relâmpagos e vento favorece “nuvens”.
- source_word: מִקְצֵה הָאָרֶץ
  choice: dos confins da terra
  rationale: A expressão hebraica está no singular, mas pode ter sentido coletivo. “Dos confins da terra” comunica de modo idiomático as regiões mais distantes.
- source_word: בְּרָקִים
  choice: relâmpagos
  rationale: O plural português corresponde diretamente ao plural hebraico e é natural neste contexto de tempestade.
- source_word: לַמָּטָר
  choice: para a chuva
  rationale: Mantém de perto a preposição ל e preserva a relação poética, não totalmente especificada, entre os relâmpagos e a chuva.
- source_word: עָשָׂה
  choice: produz
  rationale: Embora seja formalmente uma forma perfeita, tem aqui valor geral ou habitual na descrição poética da atuação divina. “Produz” evita uma repetição pesada de “faz”.
- source_word: מוֹצֵא
  choice: faz sair
  rationale: O particípio hifil de יצא é causativo. “Faz sair” preserva esse sentido e a imagem de retirar ou liberar algo guardado.
- source_word: רוּחַ
  choice: vento
  rationale: A sequência de nuvens, chuva e relâmpagos exige o sentido meteorológico do termo, e não “espírito” ou “sopro”.
- source_word: מֵאֹצְרוֹתָיו
  choice: de seus depósitos
  rationale: O substantivo designa lugares onde bens são armazenados. “Depósitos” mantém a imagem concreta de ventos guardados e liberados por Deus.
theological_decisions:
- issue: Ação divina descrita no presente poético ou no passado
  choice: Empregar verbos no presente para descrever a atuação característica de Deus sobre a criação.
  alternative: 'Traduzir עָשָׂה no passado: “produziu” ou “fez”.'
  rationale: O contexto hínico celebra o governo contínuo de Deus sobre a criação; o presente também harmoniza o verbo finito com os particípios que o cercam, sem transformar a afirmação em referência exclusiva a um ato passado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das imagens e o paralelismo hebraico foram preservados; “para a chuva” conserva deliberadamente a relação concisa e aberta expressa pela preposição hebraica.
