  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: pt
  text: Pois Yahweh fará justiça ao seu povo[a] e terá compaixão dos seus servos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “julgará o seu povo”. O verbo hebraico pode significar “julgar”, mas aqui provavelmente indica julgar em favor do povo, isto é, fazer-lhe justiça.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltará atrás a respeito dos seus servos”. O verbo hebraico também pode expressar voltar atrás ou ser movido à compaixão.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação do que precede e preserva com naturalidade o encadeamento argumentativo do salmo.
- source_word: יָדִין
  choice: fará justiça a
  rationale: O verbo pode significar literalmente “julgar”, mas, nesta construção e no paralelo de Deuteronômio 32:36, indica agir judicialmente em favor do povo. “Fará justiça a” conserva a imagem jurídica e comunica a ideia de vindicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Equivalente natural para a designação coletiva e pactual.
- source_word: וְעַל
  choice: e ... dos
  rationale: A relação expressa por עַל é incorporada de modo idiomático à construção portuguesa “ter compaixão de”.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto dos Salmos, “servos” é a designação natural dos que pertencem e servem a Yahweh, sem realçar aqui a condição social de escravo.
- source_word: יִתְנֶחָם
  choice: terá compaixão
  rationale: O nifal de נחם pode expressar compadecer-se ou voltar atrás. Neste contexto, a expressão comunica a disposição misericordiosa de Yahweh para com seus servos, enquanto a nota preserva a alternativa lexical genuína.
theological_decisions:
- issue: Linguagem antropopática aplicada a Deus em יִתְנֶחָם
  choice: terá compaixão
  alternative: voltará atrás a respeito dos seus servos
  rationale: A tradução principal expressa a misericórdia divina sem sugerir arrependimento por erro moral. A nota mantém a tensão do verbo hebraico, que também pode indicar mudança de ação ou desistência de um juízo anunciado.
- issue: Sentido judicial de יָדִין
  choice: fará justiça ao seu povo
  alternative: julgará o seu povo
  rationale: O contexto favorece uma decisão em benefício do povo, mas a nota preserva o sentido mais formal e potencialmente ambíguo de “julgar”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Fará justiça a” mantém a dimensão judicial com maior naturalidade que “vindicar”, e as notas preservam as ambiguidades lexicais do hebraico.
