  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: pt
  text: Pois eu sei que Yahweh é grande e que o nosso Senhor está acima de todos os deuses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que o nosso Senhor é maior do que todos os deuses”. A expressão hebraica literalmente diz “de todos os deuses”, com sentido comparativo de superioridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: A primeira ocorrência introduz a razão para o louvor no contexto; “Pois” conserva essa função explicativa em português natural.
- source_word: יָדַעְתִּי
  choice: eu sei
  rationale: O perfeito hebraico expressa conhecimento estabelecido; o presente “sei” comunica naturalmente esse sentido resultante e estável.
- source_word: כִּי
  choice: que
  rationale: A segunda ocorrência introduz o conteúdo do conhecimento do salmista.
- source_word: גָדוֹל
  choice: é grande
  rationale: Mantém o predicado absoluto do hebraico sem antecipar na primeira oração a comparação expressa na segunda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título אֲדֹנֵינוּ na oração seguinte.
- source_word: אֲדֹנֵינוּ
  choice: o nosso Senhor
  rationale: Traduz o substantivo “senhor/dono” com o sufixo de primeira pessoa do plural e preserva a distinção em relação ao nome Yahweh.
- source_word: מִכָּל
  choice: acima de todos
  rationale: Expressa idiomaticamente a comparação ou superioridade marcada pela preposição מִן.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: É a tradução direta do plural e preserva a tensão retórica do texto quanto às divindades rivais, sem explicá-la além do que o verso afirma.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega o Tetragrama como nome próprio. “Yahweh” o preserva em transliteração e deixa clara a diferença entre o nome divino e o título “nosso Senhor”.
- issue: Sentido de אֱלֹהִים na frase final
  choice: deuses
  alternative: seres divinos
  rationale: “Deuses” reproduz diretamente a formulação comparativa e polêmica do hebraico, sem decidir no texto principal a condição ontológica desses referentes.
- issue: Relação entre גָדוֹל e מִכָּל אֱלֹהִים
  choice: “Yahweh é grande” seguido de “está acima de todos os deuses”
  alternative: “Yahweh é maior do que todos os deuses”
  rationale: 'A redação principal respeita a divisão sintática mais direta: grandeza absoluta na primeira oração e supremacia comparativa na segunda. A alternativa reúne as ideias numa comparação explícita e é registrada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Yahweh” preserva o nome próprio; “o nosso Senhor” traduz um título diferente. A repetição de “que” torna explícita em português a coordenação dos dois conteúdos conhecidos pelo salmista.
