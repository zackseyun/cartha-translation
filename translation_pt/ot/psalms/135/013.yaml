  text: יְ֭הוָה שִׁמְ/ךָ֣ לְ/עוֹלָ֑ם יְ֝הוָ֗ה זִכְרְ/ךָ֥ לְ/דֹר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: pt
  text: Yahweh, o teu nome permanece para sempre; Yahweh, a tua memória[a] permanece de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua fama” ou “o teu memorial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama e preserva a repetição enfática do hebraico.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém a amplitude do hebraico, que pode abranger tanto o nome divino como a reputação ligada a ele.
- source_word: לְעוֹלָם
  choice: permanece para sempre
  rationale: Embora a oração hebraica não tenha verbo expresso, o português natural pede um verbo; “permanece” comunica a continuidade indicada pela expressão temporal.
- source_word: זִכְרְךָ
  choice: a tua memória
  rationale: Conserva o sentido básico de lembrança ou memória duradoura, sem reduzir o termo apenas a fama; uma alternativa contextual aparece na nota.
- source_word: לְדֹר וָדֹר
  choice: permanece de geração em geração
  rationale: Repete o verbo suprido na primeira oração, preservando o paralelismo e expressando a continuidade através das gerações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título.
- issue: Sentido de זִכְרְךָ
  choice: a tua memória
  alternative: a tua fama; o teu memorial
  rationale: “Memória” preserva a ambiguidade entre aquilo pelo qual Yahweh é lembrado, sua reputação duradoura e a recordação ou memorial de seu nome.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa coerentes (“teu”, “tua”). A pontuação e a repetição de “Yahweh” preservam o paralelismo poético. O verbo “permanece”, suprido nas duas orações nominais, torna explícita em português a continuidade temporal implícita no hebraico.
