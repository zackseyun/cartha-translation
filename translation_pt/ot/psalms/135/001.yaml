  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: pt
  text: Louvem a Yah! Louvem o nome de Yahweh; louvem, ó servos de Yahweh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louvem
  rationale: Imperativo plural piel de הלל. “Louvem” transmite de modo natural e direto a convocação dirigida à comunidade.
- source_word: יָהּ
  choice: Yah
  rationale: Forma poética abreviada do nome divino. Mantê-la distingue essa forma de יְהוָה e evidencia a composição da expressão litúrgica “Aleluia”.
- source_word: אֶת שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Preserva explicitamente “o nome” como objeto do louvor e verte o nome divino pessoal por transliteração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliteração amplamente reconhecível do tetragrama, preservando no texto o nome divino em vez de substituí-lo por um título.
- source_word: עַבְדֵי
  choice: servos
  rationale: No contexto litúrgico, “servos” é natural e mantém a ideia de pessoas que pertencem a Yahweh e o servem, sem realçar indevidamente a condição jurídica de escravidão.
theological_decisions:
- issue: Distinção entre as formas do nome divino יָהּ e יְהוָה
  choice: Verter יָהּ como “Yah” e יְהוָה como “Yahweh”
  alternative: Verter ambas por “SENHOR” ou uniformizá-las como “Yahweh”
  rationale: O hebraico emprega deliberadamente a forma abreviada poética no início e o tetragrama completo nas duas ocorrências seguintes. A tradução conserva essa distinção sem substituir o nome por um título.
- issue: Objeto do terceiro imperativo הַלְלוּ
  choice: Não acrescentar um objeto, entendendo “servos de Yahweh” como vocativo
  alternative: Acrescentar “a ele” ou entender “servos de Yahweh” como objeto
  rationale: A construção hebraica não fornece objeto explícito para o terceiro imperativo; עַבְדֵי יְהוָה identifica naturalmente os destinatários da convocação. Não se deve preencher a elipse de maneira interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural. A ordem e a repetição do hebraico foram preservadas. A vírgula final reflete que o versículo continua sintaticamente no verso seguinte.
