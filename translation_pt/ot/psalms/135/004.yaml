  text: כִּֽי יַעֲקֹ֗ב בָּחַ֣ר ל֣/וֹ יָ֑הּ יִ֝שְׂרָאֵ֗ל לִ/סְגֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: pt
  text: Pois Yah[a] escolheu Jacó para si, Israel como sua propriedade preciosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yah”, forma abreviada do nome divino.'
    reason: Esclarece a forma incomum e abreviada do nome divino usada no original.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor e a exortação do contexto, com concisão e naturalidade no estilo poético.
- source_word: בָּחַר
  choice: escolheu
  rationale: Expressa diretamente o ato divino de escolher; o pretérito perfeito é natural em português e não elimina a validade contínua dessa escolha.
- source_word: לּוֹ
  choice: para si
  rationale: 'Preserva o sentido reflexivo de interesse e pertencimento: Jacó foi escolhido para pertencer especialmente a Yah.'
- source_word: יָהּ
  choice: Yah
  rationale: Reproduz a forma abreviada do nome divino presente no texto hebraico, sem substituí-la silenciosamente pela forma completa ou por um título.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome, aqui também representando o povo da aliança.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa estabelecida; está em paralelismo com Jacó e designa o mesmo povo.
- source_word: סְגֻלָּה
  choice: propriedade preciosa
  rationale: Comunica tanto o pertencimento particular quanto o alto valor expresso pelo termo hebraico, preservando sua ressonância de aliança.
- source_word: לִסְגֻלָּתוֹ
  choice: como sua propriedade preciosa
  rationale: A construção com “como” expressa de modo natural a condição para a qual Israel foi escolhido, sem tornar excessivamente explícita a relação sintática.
theological_decisions:
- issue: Tradução da forma abreviada do nome divino יָהּ
  choice: Yah
  alternative: o SENHOR
  rationale: O hebraico traz especificamente a forma curta do nome divino. Mantê-la no texto principal preserva a precisão lexical e a particularidade poética; a nota esclarece sua relação com o nome divino.
- issue: Sentido de סְגֻלָּה aplicado a Israel
  choice: propriedade preciosa
  alternative: propriedade especial
  rationale: “Propriedade preciosa” conserva simultaneamente as ideias de posse particular e de valor, sem acrescentar uma interpretação denominacional ao vínculo de aliança.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Yah” é mantido por precisão em relação ao hebraico e explicado em nota; “propriedade preciosa” equilibra naturalidade, pertencimento e valor.
