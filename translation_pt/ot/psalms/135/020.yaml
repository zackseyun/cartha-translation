base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: pt
  text: Casa de Levi[a], bendigam a Yahweh; vocês que temem Yahweh[b], bendigam a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Casa de Levi”, uma designação coletiva da linhagem ou comunidade levítica.
    reason: cultural_note
  - marker: b
    text: 'Ou: “os que temem Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: Casa de Levi
  rationale: Preserva literalmente a expressão coletiva hebraica e o paralelismo litúrgico com as casas de Israel e de Arão nos versículos próximos.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: Traduz diretamente o imperativo plural de ברך e mantém a força solene da convocação litúrgica; neste contexto, o sentido se aproxima de louvar, sem se limitar a ele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יִרְאֵי יְהוָה
  choice: vocês que temem a Yahweh
  rationale: A expressão participial designa pessoas caracterizadas pelo temor de Yahweh. A formulação com vocativo explícito harmoniza-se naturalmente com o imperativo plural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. A transliteração preserva essa distinção e evita substituí-lo silenciosamente por um título.
- issue: Sentido de temer em יִרְאֵי יְהוָה
  choice: temem
  alternative: reverenciam
  rationale: Temer conserva a amplitude da expressão bíblica, que pode abranger reverência, lealdade e temor genuíno, sem reduzir antecipadamente sua tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantém a repetição litúrgica, o nome Yahweh e a expressão coletiva “Casa de Levi”.
