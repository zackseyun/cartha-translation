base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: pt
  text: Enviou sinais e maravilhas no meio de você, ó Egito,[a] contra o faraó e contra todos os seus servos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico dirige-se ao Egito com um sufixo feminino singular, personificando a nação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobre o faraó e sobre todos os seus servos”. A preposição hebraica pode ser traduzida mais literalmente por “sobre”, mas aqui provavelmente indica o efeito hostil das pragas contra eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Enviou
  rationale: O qal perfeito na terceira pessoa masculina singular tem Deus como sujeito implícito pelo contexto. Em português, a omissão do pronome mantém o verso natural e claro.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: sinais e maravilhas
  rationale: Preserva a conhecida combinação hebraica e distingue os atos significativos de seus efeitos extraordinários sem restringi-los à categoria de milagres.
- source_word: בְּתוֹכֵכִי מִצְרָיִם
  choice: no meio de você, ó Egito
  rationale: O sufixo feminino singular dirige-se diretamente ao Egito personificado. A expressão conserva essa personificação e a força locativa de בְּתוֹךְ; a nota registra a possível nuance direcional.
- source_word: בְּפַרְעֹה
  choice: contra o faraó
  rationale: Neste contexto, a preposição בְּ marca o alvo sobre o qual recaem os sinais e as maravilhas. 'Contra' comunica naturalmente seu efeito hostil.
- source_word: וּבְכָל עֲבָדָיו
  choice: e contra todos os seus servos
  rationale: עֲבָדִים pode designar servos, escravos ou oficiais. 'Servos' mantém a amplitude lexical e se ajusta ao contexto da casa e da corte do faraó.
