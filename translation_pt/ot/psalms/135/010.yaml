lexical_decisions:
- source_word: שֶֽׁ/הִכָּה
  choice: que feriu
  rationale: A partícula relativa שֶׁ liga o versículo ao antecedente do versículo anterior; הִכָּה, de נכה, significa “ferir, golpear”. “Que feriu” preserva tanto a dependência sintática quanto o sentido militar sem acrescentar explicitamente a ideia de derrubar.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: גּוֹיִם designa nações ou povos, e רַבִּים as caracteriza como numerosas. “Muitas nações” é direto, natural e adequado ao contexto histórico-militar.
- source_word: וְהָרַג
  choice: e matou
  rationale: הרג significa matar. “Matou” é claro e atual, além de manter o paralelismo conciso do hebraico.
- source_word: מְלָכִים עֲצוּמִים
  choice: reis poderosos
  rationale: מְלָכִים significa “reis”, e עֲצוּמִים expressa força ou poder. “Reis poderosos” é idiomático em português e comunica com precisão a grande força desses governantes.
theological_decisions:
- issue: Continuidade da oração relativa com o versículo anterior
  choice: Manter a oração dependente iniciada por “que”.
  alternative: 'Transformar em oração independente: “Ele feriu muitas nações...”'
  rationale: O שֶׁ prefixado marca uma oração relativa que continua a descrição dos atos do SENHOR no versículo anterior. Preservar essa ligação reflete a sintaxe hebraica e a estrutura cumulativa do salmo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa adequada à poesia. A formulação começa com minúscula e com “que” por continuar a frase do versículo anterior.
