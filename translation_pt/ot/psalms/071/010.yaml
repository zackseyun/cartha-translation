  text: כִּֽי אָמְר֣וּ אוֹיְבַ֣/י לִ֑/י וְ/שֹׁמְרֵ֥י נַ֝פְשִׁ֗/י נוֹעֲצ֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: pt
  text: 'Pois os meus inimigos falam contra mim,

    e os que estão à espreita para tirar-me a vida tomam conselho juntos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consultam-se juntos”. O verbo também pode ter, neste contexto, o sentido hostil de “conspiram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica anterior e preserva com naturalidade a força explicativa do hebraico.
- source_word: אָמְרוּ
  choice: falam
  rationale: O perfeito hebraico pode descrever, no discurso poético, uma ação hostil vigente; o presente comunica isso naturalmente em português.
- source_word: אֹיְבַי לִי
  choice: os meus inimigos falam contra mim
  rationale: לִי é literalmente “a mim/para mim”, mas, neste contexto hostil, “contra mim” expressa o sentido idiomático sem enfraquecê-lo.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: os que espreitam a minha vida
  rationale: שׁמר aqui indica vigilância hostil, não proteção; נֶפֶשׁ designa a vida ou a própria pessoa ameaçada. “Espreitam a minha vida” mantém a imagem e a intenção adversa.
- source_word: נוֹעֲצוּ יַחְדָּו
  choice: conspiram juntos
  rationale: O verbo denota deliberar ou tomar conselho; no contexto de inimigos que espreitam a vida do salmista, “conspiram” comunica naturalmente o caráter hostil, enquanto a nota preserva a alternativa lexical menos interpretativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética natural. “Espreitam” conserva a vigilância hostil sem transformar o verso em linguagem excessivamente coloquial; “a minha vida” evita a leitura moderna indevidamente restrita de “alma”.
