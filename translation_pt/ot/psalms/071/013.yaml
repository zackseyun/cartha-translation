id: PSA.71.13
reference: Psalms 71:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: pt
  text: Sejam envergonhados e cheguem ao fim[b] os que são hostis à minha vida[a]; cubram-se de afronta e humilhação os que procuram o meu mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à minha alma”; aqui, a palavra hebraica frequentemente se refere à vida ou à própria pessoa, não especificamente à alma imaterial.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam consumidos” ou “pereçam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O imperfeito qal tem força volitiva neste contexto de oração. A formulação expressa o desejo de que os adversários sofram vergonha pública, em vez de apenas sentirem vergonha interior.
- source_word: יִכְלוּ
  choice: cheguem ao fim
  rationale: O verbo כלה pode indicar ser consumido, acabar ou perecer. A expressão preserva essa amplitude sem especificar necessariamente morte física.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: os que são hostis à minha vida
  rationale: O particípio de שטן indica oposição hostil; נֶפֶשׁ refere-se aqui de modo natural à vida ou ao próprio ser do salmista.
- source_word: יַעֲטוּ
  choice: cubram-se de
  rationale: Preserva a metáfora de envolver-se ou vestir-se com algo e mantém a forma volitiva do hebraico.
- source_word: חֶרְפָּה
  choice: afronta
  rationale: Comunica desonra e censura públicas em linguagem portuguesa atual e digna.
- source_word: וּכְלִמָּה
  choice: e humilhação
  rationale: Mantém a intensificação por termos próximos, distinguindo este substantivo da vergonha expressa anteriormente pelo verbo בוש.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: os que procuram o meu mal
  rationale: Expressa de forma concisa a intenção ativa de causar dano, sem reduzir רָעָה a mero desconforto.
theological_decisions:
- issue: Força imprecatória dos imperfeitos
  choice: 'Traduzir os verbos como desejo ou petição: “Sejam... cheguem... cubram-se”.'
  alternative: 'Traduzir como previsão futura: “serão envergonhados... chegarão ao fim”.'
  rationale: No contexto poético de oração, os imperfeitos têm melhor leitura volitiva ou jussiva. A tradução conserva a tensão do pedido do salmista sem convertê-lo em previsão neutra.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem poética foi mantida, e as expressões volitivas preservam o caráter de oração imprecatória do verso.
