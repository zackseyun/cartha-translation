id: PSA.71.20
reference: Psalms 71:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: pt
  text: Tu, que nos fizeste ver[a] muitas aflições e calamidades[b], voltarás a nos dar vida[c]; e, das profundezas da terra[d], voltarás a me fazer subir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos mostraste”. O verbo hebraico é causativo e pode significar “fizeste-nos ver” ou “mostraste-nos”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, também pode ser traduzido por “e muitos males”. Aqui, “males” significa calamidades ou sofrimentos, não maldade moral.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico passa de “nos” para “me”: “nos dar vida... me fazer subir”.'
    reason: textual_variant
  - marker: d
    text: “As profundezas da terra” podem representar humilhação extrema ou proximidade da morte e também podem evocar a descida à sepultura.
    reason: cultural_note
lexical_decisions:
- source_word: הראיתנו
  choice: nos fizeste ver
  rationale: 'Preserva de modo natural a força causativa do hifil de ראה: Deus fez o povo experimentar ou contemplar as aflições, sem reduzir a expressão a uma simples percepção visual.'
- source_word: צָרוֹת רַבּוֹת
  choice: muitas aflições
  rationale: צָרוֹת designa apertos, adversidades ou sofrimentos, e רַבּוֹת aqui indica quantidade. “Muitas aflições” é claro, atual e não especifica além do texto.
- source_word: וְרָעוֹת
  choice: e calamidades
  rationale: Neste contexto, רָעוֹת se refere a males sofridos, e não necessariamente ao mal moral. “Calamidades” comunica adversidade grave sem atribuir perversidade moral a Deus.
- source_word: תָּשׁוּב תְּחַיֵּנוּ
  choice: voltarás a nos dar vida
  rationale: A construção com שוב exprime renovação da ação. “Voltarás a” conserva o verbo repetido no verso, enquanto “dar vida” comunica a restauração de vida ou vigor expressa pelo piel de חיה.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: e, das profundezas da terra
  rationale: Mantém a imagem espacial intensa de תְּהֹמוֹת sem a transformar explicitamente em sepultura ou ressurreição.
- source_word: תָּשׁוּב תַּעֲלֵנִי
  choice: voltarás a me fazer subir
  rationale: Preserva a repetição de שוב e a força causativa do hifil de עלה. “Fazer subir” mantém a direção da imagem sem impor uma interpretação exclusivamente ressuscitadora.
- source_word: נו ... ני
  choice: nos ... me
  rationale: Mantém a mudança do plural para o singular presente no texto massorético, sem harmonizá-la.
theological_decisions:
- issue: Se רָעוֹת deve ser entendido como males morais ou calamidades experimentadas
  choice: calamidades experimentadas
  alternative: males; desastres
  rationale: O contexto trata das adversidades que o salmista e a comunidade sofreram. “Calamidades” preserva a gravidade sem declarar que Deus pratica o mal moral.
- issue: Se “das profundezas da terra” deve ser explicitado como ressurreição corporal
  choice: manter a imagem sem explicitação doutrinária
  alternative: da sepultura me ressuscitarás; me ressuscitarás
  rationale: A expressão pode evocar humilhação extrema, proximidade da morte ou a esfera da sepultura. O texto não exige que uma dessas possibilidades seja isolada na tradução.
- issue: Mudança de número entre “nos” e “me”
  choice: preservar a mudança do plural para o singular
  alternative: harmonizar tudo como “nos” ou tudo como “me”
  rationale: A forma recebida passa da experiência comunitária para a confissão pessoal. Preservar essa tensão evita corrigir silenciosamente o texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A repetição de “voltarás a” reflete a repetição de שוב, e a alternância “nos... me” foi mantida deliberadamente.
