  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: pt
  text: Também eu te louvarei com a harpa por tua fidelidade[a], meu Deus; a ti cantarei ao som da lira[b], ó Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua verdade”. O termo hebraico pode significar tanto verdade como fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Não se sabe ao certo qual era a diferença entre os dois instrumentos mencionados neste versículo (nével e quinor); “harpa” e “lira” são traduções tradicionais.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Também eu
  rationale: Preserva a ideia de continuação e a ênfase do pronome independente, em ordem natural e poética em português.
- source_word: אוֹדְךָ
  choice: te louvarei
  rationale: No contexto de culto acompanhado por instrumentos, o hifil de ידה expressa louvor ou ação de graças; “te louvarei” se harmoniza com o paralelismo musical.
- source_word: בִכְלִי נֶבֶל
  choice: com a harpa
  rationale: כְּלִי designa genericamente um instrumento, especificado aqui por נֶבֶל. “Harpa” é a tradução tradicional, embora a identificação exata do instrumento antigo seja incerta.
- source_word: אֲמִתְּךָ
  choice: por tua fidelidade
  rationale: אֱמֶת pode significar verdade, fidelidade ou confiabilidade. Referindo-se ao caráter de Deus como motivo do louvor, “fidelidade” comunica naturalmente sua constância, sem excluir a alternativa “verdade”, registrada em nota.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz diretamente a forma possessiva e mantém a expressão como vocativo.
- source_word: אֲזַמְּרָה לְךָ
  choice: a ti cantarei
  rationale: O piel de זמר denota cantar ou fazer música em louvor. “Cantarei” é natural em português e, com “ao som da lira”, mantém explícito o contexto instrumental.
- source_word: בְכִנּוֹר
  choice: ao som da lira
  rationale: כִּנּוֹר é tradicionalmente vertido como “lira”. A formulação idiomática indica o acompanhamento instrumental e distingue o termo de נֶבֶל.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: ó Santo de Israel
  rationale: Mantém o título divino e torna explícita, de modo digno e natural, sua função vocativa.
theological_decisions:
- issue: Sentido de אֱמֶת aplicado a Deus no louvor
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” realça a constância e confiabilidade de Deus no contexto dos seus atos salvadores. Como “verdade” também é um sentido legítimo do hebraico, a nota preserva a amplitude sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética própria dos Salmos. O paralelismo foi preservado por “te louvarei” e “a ti cantarei”, evitando linguagem excessivamente arcaica. Os nomes tradicionais dos instrumentos permanecem no texto, com a incerteza histórica indicada em nota.
