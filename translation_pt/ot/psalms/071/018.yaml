base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: pt
  text: Mesmo na velhice e com os cabelos brancos, ó Deus, não me abandones, até que eu anuncie o teu braço[a] à geração seguinte, o teu poder a todos os que hão de vir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua força” ou “o teu poder”. O hebraico mantém a imagem do braço de Deus como expressão de seu poder em ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “a todas as gerações futuras”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: Mesmo na velhice e com os cabelos brancos
  rationale: Expressa de modo natural a continuidade enfática até a idade avançada, preservando a imagem concreta dos cabelos brancos.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: Mantém o vocativo da oração em registro digno e corrente.
- source_word: אַל תַּעַזְבֵנִי
  choice: não me abandones
  rationale: Traduz diretamente o pedido para que Deus não deixe o salmista, em português moderno e natural.
- source_word: עַד אַגִּיד
  choice: até que eu anuncie
  rationale: Conserva a ideia de sustentação divina até que o salmista possa tornar pública sua proclamação.
- source_word: זְרוֹעֲךָ
  choice: o teu braço
  rationale: Preserva a metáfora hebraica do braço como manifestação do poder atuante de Deus.
- source_word: לְדוֹר
  choice: à geração seguinte
  rationale: No contexto, indica a geração que sucede ao salmista; a formulação explicita essa direção temporal sem eliminar o paralelismo.
- source_word: לְכָל יָבוֹא
  choice: a todos os que hão de vir
  rationale: Mantém o sentido coletivo e voltado para o futuro da expressão hebraica.
- source_word: גְּבוּרָתֶךָ
  choice: o teu poder
  rationale: Abrange tanto força quanto manifestação poderosa e evita uma formulação pouco natural em português.
theological_decisions:
- issue: Preservar ou explicar a metáfora do braço de Deus
  choice: 'Preservar no texto principal: “o teu braço”'
  alternative: “a tua força” ou “o teu poder”
  rationale: A imagem corporal comunica o poder eficaz de Deus e faz parte da textura poética e teológica do hebraico; a nota esclarece seu sentido sem desfazer a metáfora.
- issue: Alcance do público futuro em לְדוֹר ... לְכָל יָבוֹא
  choice: Distinguir “a geração seguinte” de “todos os que hão de vir”
  alternative: Traduzir o conjunto como “a todas as gerações futuras”
  rationale: A redação conserva o movimento do público sucessor imediato para um horizonte futuro mais amplo, sem fundir as duas expressões.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é reverente e poético sem recorrer a vocabulário excessivamente arcaico; emprega-se “teu” em coerência com a segunda pessoa singular presente no hebraico.
