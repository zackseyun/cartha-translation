base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: pt
  text: Mas eu esperarei continuamente e acrescentarei ainda mais a todo o teu louvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuarei esperando e aumentarei cada vez mais o teu louvor”. Literalmente, “acrescentarei a todo o teu louvor”; a expressão hebraica indica aumento ou ampliação do louvor dirigido a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente marca contraste e dá ênfase ao salmista; “Mas eu” reproduz isso de modo natural em português.
- source_word: תָּמִיד
  choice: continuamente
  rationale: O advérbio indica constância ou continuidade e combina com a resolução expressa pelo verbo seguinte.
- source_word: אֲיַחֵל
  choice: esperarei
  rationale: O piel de יחל pode significar esperar com expectativa ou ter esperança. “Esperarei” conserva a ideia de expectativa sem explicitar indevidamente o objeto da esperança.
- source_word: וְהוֹסַפְתִּי
  choice: e acrescentarei ainda mais
  rationale: יסף expressa acrescentar ou aumentar. A formulação torna natural em português o sentido idiomático de continuar ou intensificar o louvor.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: ao teu louvor
  rationale: Após יסף, עַל indica aquilo a que se acrescenta. תְּהִלָּתֶךָ refere-se ao louvor pertencente a Deus ou dirigido a ele; o sentido de כָּל é refletido idiomaticamente pela ideia de acréscimo contínuo, evitando a expressão pouco natural “a todo o teu louvor”.
