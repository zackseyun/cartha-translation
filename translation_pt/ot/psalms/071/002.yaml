base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: pt
  text: Em tua justiça, resgata-me e livra-me.[a] Inclina o teu ouvido para mim e salva-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por tua justiça”. “Justiça” também pode ser entendida como “retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: Em tua justiça
  rationale: A preposição ב pode indicar esfera ou base (“em”) e também meio (“por”). “Em tua justiça” conserva a concisão hebraica e apela ao caráter justo e fiel de Deus; a nota registra a possibilidade instrumental.
- source_word: תַּצִּילֵנִי
  choice: resgata-me
  rationale: O hifil de נצל significa resgatar ou livrar. “Resgata-me” mantém a força de retirada do perigo e distingue este verbo do seguinte.
- source_word: וּתְפַלְּטֵנִי
  choice: e livra-me
  rationale: O piel de פלט expressa fazer escapar ou pôr em segurança. “Livra-me” é natural em português e preserva o paralelismo sem repetir “resgata”.
- source_word: הַטֵּה
  choice: Inclina
  rationale: O imperativo de נטה com “ouvido” forma uma metáfora de atenção. “Inclina” preserva a imagem poética em registro digno e compreensível.
- source_word: אָזְנְךָ
  choice: o teu ouvido
  rationale: Mantém a imagem corporal concreta do hebraico, em vez de substituí-la pela ideia abstrata de ouvir.
- source_word: וְהוֹשִׁיעֵנִי
  choice: e salva-me
  rationale: O hifil de ישׁע é o verbo habitual para salvar. A escolha preserva tanto o livramento do perigo imediato quanto a ressonância mais ampla do termo.
theological_decisions:
- issue: Sentido de צְדָקָה no apelo dirigido a Deus
  choice: justiça
  alternative: retidão
  rationale: Em português, “justiça” pode abranger a ação justa e o caráter reto e fiel de Deus, sem limitar a expressão a um ato judicial. “Retidão” explicita mais diretamente a qualidade moral, mas pode enfraquecer a dimensão ativa; a construção com ב também permanece ambígua entre esfera/base e instrumento.
translation_notes:
  register: Português moderno, poético e digno, com formas pronominais amplamente inteligíveis. A metáfora de inclinar o ouvido e os três verbos distintos de livramento foram preservados.
