  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: pt
  text: 'dizendo[a]: “Deus o abandonou; persigam-no e agarrem-no, pois não há quem o livre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para dizer”.'
    reason: alternativa sintática para o infinitivo hebraico que introduz a fala citada
lexical_decisions:
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto de אמר introduz idiomaticamente o discurso direto; “dizendo” preserva essa função e a ligação com o contexto anterior.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo singular עֲזָבוֹ mostra que aqui se trata do título divino singular.
- source_word: עֲזָבוֹ
  choice: o abandonou
  rationale: O qal perfeito com sufixo masculino singular descreve uma ação considerada consumada. “Abandonou” é natural no português atual e mantém a força da acusação dos inimigos.
- source_word: רִדְפוּ
  choice: persigam-no
  rationale: O imperativo plural de רדף ordena uma perseguição hostil; “persigam-no” expressa diretamente essa ação.
- source_word: וְתִפְשׂוּהוּ
  choice: e agarrem-no
  rationale: O imperativo de תפשׂ significa agarrar ou apoderar-se. “Agarrem-no” preserva a ação física sem especificar além do hebraico uma captura formal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada para perseguir e agarrar o salmista.
- source_word: אֵין מַצִּיל
  choice: não há quem o livre
  rationale: אֵין nega a existência de alguém, e o particípio hifil de נצל designa quem livra ou resgata. A formulação é idiomática e preserva o sentido pessoal de um libertador ausente.
theological_decisions:
- issue: A afirmação dos inimigos sobre o abandono divino
  choice: Deus o abandonou
  alternative: Deus o desamparou
  rationale: A frase permanece claramente dentro da fala dos adversários, não como afirmação teológica do narrador. “Abandonou” comunica a gravidade da provocação sem decidir se a alegação deles é verdadeira.
translation_notes:
  register: Português moderno, claro e digno, com formas imperativas plurais de ampla compreensão. “Livre” conserva o vocabulário bíblico sem soar arcaico; “agarrem-no” é vívido e não restringe indevidamente o alcance de תפשׂ.
