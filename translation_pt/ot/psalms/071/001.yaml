  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: pt
  text: Em ti, Yahweh[a], busquei refúgio; que eu jamais seja envergonhado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional de representar o nome divino: “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּךָ
  choice: Em ti
  rationale: A preposição ב com o sufixo de segunda pessoa introduz aqui, de modo metafórico, aquele em quem o salmista deposita sua confiança. “Em ti” conserva a imagem e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz o nome divino יהוה, não um título. A transliteração “Yahweh” preserva essa distinção; a nota registra a convenção tradicional de substituí-lo por “SENHOR”.
- source_word: חָסִיתִי
  choice: busquei refúgio
  rationale: O verbo חסה expressa a ação de procurar ou encontrar proteção. O pretérito perfeito traduz a forma hebraica e mantém a imagem concreta de refúgio, sem reduzi-la ao sentido mais geral de confiar.
- source_word: אַל אֵבוֹשָׁה
  choice: que eu jamais seja envergonhado
  rationale: אַל com a forma volitiva de primeira pessoa exprime uma súplica ou desejo negativo. A formulação com “que” é idiomática em português e “seja envergonhado” abrange desonra pública ou frustração da esperança, não apenas constrangimento interior.
- source_word: לְעוֹלָם
  choice: jamais
  rationale: No âmbito da negação, לְעוֹלָם tem naturalmente o sentido de “nunca” ou “jamais”. “Jamais” combina com o registro poético e solene do salmo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Como o hebraico emprega explicitamente o nome próprio divino, a tradução o conserva por transliteração. A alternativa “SENHOR” reflete a tradição de leitura, mas substitui o nome por um título; por isso, aparece apenas na nota.
- issue: Natureza da vergonha pedida em oração
  choice: seja envergonhado
  alternative: fique decepcionado
  rationale: O verbo בושׁ pode envolver vergonha, desonra e o fracasso público da esperança. “Seja envergonhado” mantém essa amplitude e evita limitar o sentido a uma emoção privada ou a mera decepção.
translation_notes:
  register: Português atual, poético e reverente, com sintaxe acessível. “Busquei refúgio” preserva a metáfora hebraica, e “jamais” mantém a concisão e a solenidade do paralelismo.
