  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: pt
  text: Pois tu és a minha esperança, ó Senhor Yahweh, a minha confiança desde a minha juventude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração ou súplica no contexto; “Pois” preserva a força explicativa e soa natural em linguagem poética.
- source_word: אַתָּה
  choice: tu
  rationale: Mantém o pronome explícito e enfático do hebraico, numa forma de tratamento reverente e amplamente compreensível em português.
- source_word: תִקְוָתִי
  choice: a minha esperança
  rationale: Expressa diretamente a ideia de esperança ou expectativa depositada em Deus.
- source_word: אֲדֹנָי יְהוִה
  choice: ó Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה; o vocativo com “ó” produz uma formulação clara e digna em português.
- source_word: מִבְטַחִי
  choice: a minha confiança
  rationale: O substantivo indica aquilo em que se confia, ou a segurança daí resultante; “a minha confiança” mantém o paralelismo com “a minha esperança” sem reduzir o termo a um lugar físico de refúgio.
- source_word: מִנְּעוּרָי
  choice: desde a minha juventude
  rationale: A preposição מן assinala o ponto inicial de uma confiança contínua; “desde” comunica essa dimensão temporal naturalmente.
theological_decisions:
- issue: Representação do nome divino יהוה junto ao título אֲדֹנָי
  choice: ó Senhor Yahweh
  alternative: ó Soberano SENHOR / ó Senhor Deus
  rationale: A tradução conserva separadamente o título e o nome próprio presentes no hebraico, evitando ocultar יהוה sob um título substitutivo. O acréscimo vocativo de “ó” esclarece que ambos se dirigem a Deus, sem resolver além do texto qualquer questão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “tu” para refletir o pronome hebraico explícito e preservar o tom direto da oração; evita construções excessivamente arcaicas.
