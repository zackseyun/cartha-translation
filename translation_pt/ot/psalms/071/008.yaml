  text: יִמָּ֣לֵא פִ֭/י תְּהִלָּתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם תִּפְאַרְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: pt
  text: Minha boca se encherá do teu louvor[a] e, durante todo o dia, do teu esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Minha boca está cheia do teu louvor»; possivelmente: «Que minha boca se encha do teu louvor». Neste contexto poético, o imperfeito hebraico pode ter sentido futuro, presente ou volitivo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «da tua glória», «da tua beleza» ou «da tua majestade».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: se encherá
  rationale: O nifal imperfeito de מלא admite valor futuro, presente ou volitivo no contexto poético. O futuro é natural no fluxo do salmo, sem excluir as outras nuances, registradas em nota.
- source_word: פִי
  choice: minha boca
  rationale: Preserva a imagem hebraica concreta e natural da boca como meio pelo qual o salmista expressa louvor.
- source_word: תְּהִלָּתֶךָ
  choice: do teu louvor
  rationale: Expressa de modo idiomático o louvor dirigido a Deus ou que proclama seus feitos, preservando a construção com sufixo de segunda pessoa.
- source_word: כָּל הַיּוֹם
  choice: durante todo o dia
  rationale: Formulação corrente em português que mantém o sentido durativo da expressão hebraica.
- source_word: תִּפְאַרְתֶּךָ
  choice: do teu esplendor
  rationale: תפארת pode designar esplendor, glória, beleza ou majestade. «Esplendor» preserva a força poética e distingue o termo do vocabulário mais amplo de glória.
theological_decisions:
- issue: Nuance temporal ou volitiva de יִמָּלֵא
  choice: 'Futuro: «se encherá»'
  alternative: 'Presente: «está cheia»; ou pedido/desejo: «encha-se» / «que se encha»'
  rationale: O imperfeito hebraico poético permite essas leituras. O texto principal adota o futuro como leitura contextual natural, enquanto a nota preserva a ambiguidade sem transformar a declaração inequivocamente em oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar a impressão de que «durante todo o dia» modifica apenas «esplendor», sem perder o paralelismo poético. Todos os marcadores de nota aparecem no texto principal.
