  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: pt
  text: 'Que aumentes a minha grandeza[a][b]

    e te voltes para me consolar[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aumentarás a minha grandeza e te voltarás para me consolar”. Em contexto poético, os imperfeitos hebraicos podem ser entendidos tanto como declarações futuras quanto como formas de desejo ou oração.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a minha grandeza”; a expressão também pode indicar honra ou dignidade, não apenas dimensão ou extensão.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e te voltes”; a ideia provável é voltar-se para o salmista a fim de consolá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Que aumentes
  rationale: O hifil de רבה significa “tornar grande, aumentar”. Em contexto poético de oração, o imperfeito pode ter valor optativo; “Que aumentes” preserva essa força sem excluir, em nota, a leitura como futuro.
- source_word: גְּדֻלָּתִי
  choice: a minha grandeza
  rationale: Tradução direta de גְּדוּלָּה com sufixo de primeira pessoa. O termo pode abranger grandeza, honra, dignidade ou posição, e “grandeza” mantém a amplitude lexical e a ligação verbal com “aumentar”.
- source_word: וְתִסֹּב
  choice: e te voltes
  rationale: O qal de סבב expressa a ideia de virar-se ou voltar-se. A forma reflexiva idiomática em português conserva a imagem de Deus voltar-se para o salmista, sem reduzir o verbo simplesmente a “novamente”.
- source_word: תְּנַחֲמֵנִי
  choice: para me consolar
  rationale: O piel de נחם significa “consolar, confortar”. “Consolar” é natural e digno em português, e a construção final “para me consolar” explicita a relação contextual com o ato de voltar-se.
theological_decisions:
- issue: Valor modal dos imperfeitos hebraicos
  choice: 'Oração ou desejo: “Que aumentes... e te voltes...”'
  alternative: 'Declaração de confiança futura: “Aumentarás... e te voltarás...”'
  rationale: Os imperfeitos hebraicos na poesia podem expressar tanto futuro quanto desejo ou pedido. O contexto de oração favorece a leitura optativa, enquanto a nota preserva a ambiguidade legítima.
- issue: Sentido da grandeza do salmista
  choice: Manter “minha grandeza” sem defini-la teologicamente
  alternative: Interpretar como “minha honra” ou “minha dignidade”
  rationale: O hebraico permite referência à grandeza, honra, dignidade ou posição. A tradução direta evita impor uma interpretação específica.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A formulação optativa “Que aumentes” preserva o tom de oração; “te voltes para me consolar” mantém a imagem concreta do hebraico. A quebra de linha acompanha o paralelismo poético.
