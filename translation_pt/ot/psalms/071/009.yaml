  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: pt
  text: Não me rejeites no tempo da velhice[a]; quando minhas forças se esgotarem[b], não me abandones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não me lances fora”. O verbo hebraico pode transmitir a ideia de descartar ou rejeitar alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “quando minha força chegar ao fim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: não me rejeites
  rationale: O hifil de שלך traz a imagem de lançar alguém fora e, por extensão, rejeitá-lo. “Não me rejeites” é natural em português, preserva a força da súplica e evita uma formulação excessivamente física.
- source_word: לְעֵת זִקְנָה
  choice: no tempo da velhice
  rationale: Mantém tanto o elemento temporal de עֵת quanto o sentido concreto de זִקְנָה, em linguagem clara e digna.
- source_word: כִּכְלוֹת
  choice: quando ... se esgotarem
  rationale: A construção com כִּ e o infinitivo de כלה apresenta a circunstância temporal em que algo chega ao fim ou se exaure. “Quando ... se esgotarem” expressa naturalmente esse processo de diminuição.
- source_word: כֹּחִי
  choice: minhas forças
  rationale: Embora o hebraico use o singular, o plural idiomático “minhas forças” é a forma mais natural em português para o vigor físico que declina com a idade.
- source_word: תַּעַזְבֵנִי
  choice: não me abandones
  rationale: עזב pode significar deixar, abandonar ou desamparar. “Não me abandones” é corrente, solene e adequado à oração de lamentação.
- source_word: אַל
  choice: não
  rationale: Com a forma verbal volitiva, אַל expressa uma proibição ou súplica negativa urgente, vertida naturalmente pelo imperativo negativo em português.
theological_decisions:
- issue: Natureza da súplica em relação à velhice e à presença divina
  choice: Uma petição direta para que Deus não rejeite nem abandone o salmista quando suas forças diminuírem na velhice
  alternative: Uma queixa geral sobre sofrimento, sem ênfase específica na velhice
  rationale: O texto menciona explicitamente a velhice e o esgotamento das forças. A tradução conserva essa dependência concreta de Deus sem acrescentar afirmações doutrinárias além do verso.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O imperativo negativo na segunda pessoa singular preserva o tom direto e reverente da oração. A redação mantém o paralelismo entre “não me rejeites” e “não me abandones”.
