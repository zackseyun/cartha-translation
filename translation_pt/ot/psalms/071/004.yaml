base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: pt
  text: Meu Deus, livra-me[a] da mão do perverso, do poder[b] de quem é injusto e violento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «resgata-me».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «da palma da mão»; aqui, a expressão indica poder ou controle.'
    reason: lexical_alternative
  - marker: c
    text: Ou «opressor».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: Vocativo com sufixo de primeira pessoa do singular; «Meu Deus» é direto, natural e digno em português contemporâneo.
- source_word: פַּלְּטֵנִי
  choice: livra-me
  rationale: O imperativo de פלט pede libertação de um perigo concreto. «Livra-me» preserva esse sentido e soa natural no registro de oração.
- source_word: מִיַּד רָשָׁע
  choice: da mão do perverso
  rationale: Mantém a imagem hebraica da mão como poder ou controle. O adjetivo substantivado singular רָשָׁע é expresso naturalmente por «o perverso».
- source_word: מִכַּף
  choice: do domínio
  rationale: כף significa literalmente «palma da mão», mas, nesta expressão paralela, representa posse ou controle. «Domínio» comunica o sentido idiomático sem repetir «mão».
- source_word: מְעַוֵּל
  choice: de quem pratica injustiça
  rationale: O particípio descreve alguém que age de maneira injusta. A formulação verbal preserva a ação contínua e evita uma expressão portuguesa rígida.
- source_word: וְחוֹמֵץ
  choice: e violência
  rationale: O particípio raro חוֹמֵץ caracteriza a mesma pessoa como violenta, cruel ou opressora. A coordenação «pratica injustiça e violência» é clara e mantém a força ética do paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A tradução conserva a imagem da «mão» no primeiro membro e comunica idiomaticamente a imagem paralela da «palma» no segundo. Os dois particípios finais são entendidos como características de uma mesma pessoa, sem acrescentar uma especificação de gênero ausente do hebraico.
