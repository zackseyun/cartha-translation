  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: pt
  text: Tornei-me como um portento para muitos[a], mas tu és o meu forte refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um prodígio”, “um sinal” ou “motivo de espanto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: como um portento
  rationale: מוֹפֵת pode designar um sinal, prodígio ou presságio que causa assombro. “Portento” conserva essa amplitude e o prefixo כְּ é expresso por “como”, sem definir se a reação dos observadores é positiva ou negativa.
- source_word: הָיִיתִי
  choice: tornei-me
  rationale: O qatal de היה na primeira pessoa pode indicar a chegada a um estado que permanece relevante no presente. “Tornei-me” é natural em português e se ajusta à situação contínua do salmista.
- source_word: לְרַבִּים
  choice: para muitos
  rationale: Representa diretamente a preposição לְ e identifica aqueles diante dos quais o salmista se tornou um portento.
- source_word: מַחֲסִי
  choice: o meu refúgio
  rationale: מַחֲסֶה denota abrigo ou lugar de proteção; “refúgio” preserva de modo conciso e natural a metáfora.
- source_word: עֹז
  choice: forte
  rationale: עֹז significa força ou poder. A expressão hebraica, literalmente próxima de “meu refúgio de força”, é vertida idiomaticamente como “meu forte refúgio”.
theological_decisions:
- issue: Nuance de מוֹפֵת na condição pública do salmista
  choice: O salmista é apresentado como algo extraordinário e assombroso aos olhos de muitos, sem determinar se isso é principalmente um presságio, um prodígio positivo ou apenas motivo de espanto.
  alternative: Entender o salmista especificamente como um prodígio positivo, como um presságio ameaçador ou apenas como objeto de assombro.
  rationale: O termo hebraico admite essas nuances. “Portento”, acompanhado de nota, mantém aberta a tensão sem impor uma avaliação positiva ou negativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe direta. “Portento” é menos cotidiano, mas preserva melhor a ambiguidade do hebraico; a nota oferece equivalentes mais familiares.
