base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: pt
  text: Meus lábios gritarão de alegria[a] quando eu cantar louvores a ti, e minha alma[b], que resgataste[c], também gritará de alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cantarão de alegria”; o verbo hebraico pode indicar tanto canto jubiloso quanto um brado de alegria.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha vida” ou “todo o meu ser”; o termo hebraico pode se referir à alma, à vida ou à própria pessoa.
    reason: lexical_alternative
  - marker: c
    text: Ou “redimiste” ou “libertaste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: gritarão de alegria
  rationale: O piel de רנן pode indicar tanto um brado jubiloso quanto canto exultante. A escolha preserva a intensidade vocal sem confundi-lo com o verbo seguinte, que expressa cantar louvores.
- source_word: שְׂפָתַי
  choice: meus lábios
  rationale: Mantém a imagem poética concreta do hebraico, na qual os lábios representam a expressão vocal do salmista.
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, pode introduzir a ocasião em que os lábios exultam. “Quando” produz uma relação natural entre as duas ações, sem excluir totalmente a nuance explicativa possível.
- source_word: אֲזַמְּרָה
  choice: eu cantar louvores
  rationale: O piel de זמר é empregado com frequência para o louvor musical. A formulação é clara e idiomática em português.
- source_word: לָּךְ
  choice: a ti
  rationale: A preposição indica o destinatário do louvor. “A ti” conserva o tratamento direto e o registro poético.
- source_word: וְנַפְשִׁי
  choice: também a minha alma
  rationale: נפשׁ pode designar alma, vida ou a própria pessoa. “Alma” preserva o paralelismo entre a expressão exterior dos lábios e o ser interior, enquanto “também” explicita naturalmente a coordenação.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo simples que liga “minha alma” à ação redentora de Deus.
- source_word: פָּדִיתָ
  choice: resgataste
  rationale: פדה denota libertar mediante resgate ou redimir. “Resgataste” é corrente, expressa a ação salvadora e evita restringi-la a uma formulação doutrinária posterior.
theological_decisions:
- issue: Sentido de פדה no contexto de louvor
  choice: resgataste
  alternative: redimiste; libertaste
  rationale: O verso fundamenta o louvor na ação salvadora de Deus. “Resgataste” conserva a ideia de liberação própria de פדה, enquanto a nota registra alternativas legítimas sem impor um mecanismo específico.
translation_notes:
  register: Português moderno, claro e poético, com boa legibilidade brasileira. O futuro “gritarão” acompanha a forma hebraica, e “a ti” preserva a solenidade do discurso dirigido a Deus. O ponto e vírgula mantém o paralelismo sem transformar a segunda oração em frase incompleta.
