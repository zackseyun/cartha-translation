  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: pt
  text: Minha boca contará a tua justiça[a] e a tua salvação o dia inteiro, pois não sei o número delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a tua retidão» ou «os teus atos justos».
    reason: lexical_alternative
  - marker: b
    text: Isto é, o salmista fala das manifestações da justiça e da salvação de Deus como numerosas demais para serem contadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Minha boca
  rationale: Mantém a imagem concreta do hebraico, que destaca a boca como instrumento do louvor, em vez de simplificá-la para «eu».
- source_word: יְסַפֵּר
  choice: contará
  rationale: O piel de ספר expressa narrar ou relatar. «Contará» é natural em português e conserva a ligação verbal com a ideia de número no fim do versículo.
- source_word: צִדְקָתֶךָ
  choice: a tua justiça
  rationale: Preserva o substantivo abstrato singular e sua amplitude moral, relacional e judicial; no contexto, pode também abranger os atos justos de Deus.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão corrente e clara para duração contínua ao longo de todo o dia.
- source_word: תְּשׁוּעָתֶךָ
  choice: a tua salvação
  rationale: Equivalente amplo e tradicional que preserva tanto a ação salvadora de Deus como seu resultado, sem restringi-la a um livramento específico.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão da proclamação contínua.
- source_word: לֹא יָדַעְתִּי
  choice: não sei
  rationale: Embora a forma hebraica seja perfeita, o contexto comunica uma falta presente de conhecimento ou capacidade de determinar a quantidade.
- source_word: סְפֹרוֹת
  choice: o número delas
  rationale: O plural hebraico remete a números ou contagens. A formulação portuguesa expressa de modo natural que a justiça e a salvação de Deus, manifestadas em seus atos, não podem ser quantificadas pelo salmista.
theological_decisions:
- issue: Se צִדְקָתֶךָ deve ser entendido como atributo abstrato de Deus ou concretamente como seus atos justos e salvadores.
  choice: «a tua justiça» no texto principal
  alternative: «os teus atos justos» ou «a tua retidão»
  rationale: O substantivo hebraico singular favorece «justiça», que mantém a tensão entre o caráter justo de Deus e sua atuação fiel e salvadora. A nota registra as leituras concretas possíveis sem restringir o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se «Minha boca» para reproduzir a imagem hebraica e usa-se «contará» para manter a relação lexical com «número». A conjunção «e» explicita em português a coordenação implícita entre os dois objetos, sem eliminar a ambiguidade entre atributos divinos e atos concretos.
