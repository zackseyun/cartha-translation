  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: pt
  text: Ó Deus, tu me ensinaste desde a minha juventude, e até agora anuncio os teus feitos maravilhosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as tuas maravilhas» ou «as tuas obras admiráveis».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona naturalmente como vocativo. A forma «Ó Deus» deixa clara a oração dirigida a Deus e mantém um registro digno em português.
- source_word: לִמַּדְתַּנִי
  choice: tu me ensinas
  rationale: O piel de למד com sufixo de primeira pessoa significa «tu me ensinaste/ensinas». O presente, junto de «desde», expressa de modo natural em português uma ação iniciada na juventude e ainda relevante ou contínua.
- source_word: מִנְּעוּרָי
  choice: desde a minha juventude
  rationale: נְעוּרִים designa a juventude ou os anos de jovem. «Desde a minha juventude» comunica idiomaticamente o ponto inicial da ação.
- source_word: וְעַד הֵנָּה
  choice: e até agora
  rationale: A expressão indica continuidade até o momento presente; «até agora» é direta, atual e próxima da formulação hebraica.
- source_word: אַגִּיד
  choice: anuncio
  rationale: O hifil de נגד pode significar contar, declarar ou tornar conhecido. «Anuncio» preserva o caráter público e testemunhal sem intensificar indevidamente o verbo.
- source_word: נִפְלְאוֹתֶיךָ
  choice: os teus feitos maravilhosos
  rationale: נִפְלָאוֹת refere-se com frequência aos atos extraordinários de Deus. «Feitos maravilhosos» explicita naturalmente em português a dimensão ativa do termo, sem excluir o sentido mais conciso de «maravilhas».
theological_decisions:
- issue: Preservação da interpelação direta a Deus
  choice: 'Vocativo explícito: «Ó Deus, tu me ensinas...»'
  alternative: Ler «Deus» como parte de uma afirmação a respeito dele
  rationale: As formas verbais e pronominais de segunda pessoa favorecem claramente a leitura como oração dirigida a Deus. O vocativo preserva essa postura devocional sem acrescentar conteúdo doutrinário.
- issue: Aspecto temporal de לִמַּדְתַּנִי no contexto
  choice: «tu me ensinas desde a minha juventude»
  alternative: «tu me ensinaste desde a minha juventude»
  rationale: A forma hebraica pode apresentar o ensino como realizado, mas a sequência «desde a minha juventude... até agora» permite perceber relevância ou continuidade até o presente. O presente composto com «desde» é mais natural em português, sem negar o ensino recebido no passado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém o paralelismo temporal do hebraico e a forma de oração direta.
