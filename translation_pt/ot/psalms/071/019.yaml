id: PSA.71.19
reference: Psalms 71:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: pt
  text: E a tua justiça[a], ó Deus, chega às alturas[b] — tu que fizeste grandes coisas. Ó Deus, quem é como tu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O termo hebraico pode indicar tanto a retidão moral quanto a justiça manifestada em ações.
    reason: lexical_alternative
  - marker: b
    text: Ou “até o alto” ou “até o céu”. A expressão hebraica significa literalmente “até a altura/o alto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: E a tua justiça
  rationale: צְדָקָה pode expressar justiça, retidão ou conformidade moral. Em português corrente, “justiça” comunica de modo natural tanto o caráter justo de Deus quanto sua atuação, enquanto “retidão” permanece uma alternativa legítima.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: Nas duas ocorrências, o contexto favorece a leitura vocativa. A partícula “ó” preserva claramente o discurso direto e combina com o registro poético.
- source_word: עַד מָרוֹם
  choice: chega às alturas
  rationale: A expressão significa literalmente “até a altura/o alto”. A tradução mantém a metáfora espacial e evita identificar מָרוֹם de forma excessivamente específica com o céu.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: tu que fizeste grandes coisas
  rationale: Mantém אֲשֶׁר como introdutor de uma oração relativa e conserva o destaque poético nas ações grandiosas de Deus, sem transformá-la numa oração causal.
- source_word: גְדֹלוֹת
  choice: grandes coisas
  rationale: O adjetivo feminino plural é usado substantivamente. “Grandes coisas” preserva sua amplitude, podendo abranger feitos e obras poderosas.
- source_word: מִי כָמוֹךָ
  choice: quem é como tu?
  rationale: Reproduz com clareza e naturalidade a pergunta retórica hebraica que afirma a incomparabilidade de Deus.
theological_decisions:
- issue: Sentido de צְדָקָה aplicado a Deus
  choice: justiça
  alternative: retidão
  rationale: O termo abrange o caráter moralmente reto de Deus e sua ação justa. “Justiça” é natural e abrangente no português moderno; a nota preserva “retidão” para não restringir a amplitude semântica.
- issue: Referente espacial de מָרוֹם
  choice: às alturas
  alternative: até o céu
  rationale: O hebraico indica o alto ou uma altura elevada, mas não exige que o referente seja especificamente o céu. A formulação escolhida conserva essa abertura poética.
translation_notes:
  register: Português moderno, claro e dignificado, com cadência poética. O travessão marca a passagem para a oração relativa sem eliminar a tensão sintática do hebraico. Os pronomes de segunda pessoa preservam a oração dirigida diretamente a Deus.
