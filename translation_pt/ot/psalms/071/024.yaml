  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: pt
  text: Também a minha língua falará da tua justiça o dia todo[a], pois foram envergonhados e humilhados os que procuram o meu mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da tua retidão». O termo hebraico pode indicar tanto retidão como justiça, especialmente quando Deus age para salvar e vindicar.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Mantém a continuidade com o louvor do versículo anterior e inclui a língua entre as formas de louvar.
- source_word: לְשׁוֹנִי
  choice: a minha língua
  rationale: Conserva a imagem poética concreta do órgão da fala, sem substituí-la pela abstração «minha fala».
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: Expressão corrente e amplamente compreensível que preserva a duração contínua enfatizada no hebraico.
- source_word: תֶּהְגֶּה
  choice: falará
  rationale: הגה pode indicar meditar, murmurar ou proferir em voz baixa. Como «minha língua» é o sujeito, o contexto favorece expressão audível; «falará» comunica isso naturalmente sem acrescentar uma intensidade ausente.
- source_word: צִדְקָתֶךָ
  choice: da tua justiça
  rationale: «Justiça» em português abrange adequadamente, neste contexto, a retidão divina manifestada em vindicação e ação salvadora, embora «retidão» também seja possível.
- source_word: כִּי בֹשׁוּ כִּי חָפְרוּ
  choice: pois foram envergonhados e humilhados
  rationale: O primeiro כִּי introduz a razão do louvor. O segundo reforça ou coordena o resultado paralelo e não precisa ser repetido mecanicamente em português. Os perfeitos são apresentados como resultados já alcançados.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: os que procuram o meu mal
  rationale: Preserva a construção participial, a hostilidade contínua e a amplitude de רָעָה, que pode indicar mal, dano ou desgraça.
theological_decisions:
- issue: Amplitude semântica de צִדְקָתֶךָ no contexto dos Salmos
  choice: tua justiça
  alternative: tua retidão
  rationale: O termo hebraico pode expressar tanto a retidão de Deus como sua justiça ativa e salvadora. «Justiça» é natural em português e preserva melhor, aqui, a dimensão de vindicação indicada pela vergonha dos adversários; a alternativa é registrada para não apagar a amplitude do termo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com colocação pronominal e vocabulário naturais no Brasil sem regionalismos marcados. A ordem foi levemente ajustada no final para evitar uma sequência pesada de orações, preservando o paralelismo hebraico entre vergonha e humilhação.
