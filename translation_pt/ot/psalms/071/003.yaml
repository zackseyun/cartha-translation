base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: pt
  text: Sê para mim uma rocha de refúgio[a], para onde eu possa ir sempre; ordenaste que eu fosse salvo[b], pois tu és o meu rochedo e a minha fortaleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma rocha, uma morada».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «ordenaste salvar-me»; também pode ser entendido como «determinaste salvar-me».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Sê para mim
  rationale: O imperativo expressa uma súplica direta a Deus, e לִי indica relação ou benefício. A formulação mantém a força da oração e soa natural em português.
- source_word: לְצוּר מָעוֹן
  choice: uma rocha de refúgio
  rationale: צוּר preserva a metáfora divina da rocha. Embora מָעוֹן signifique normalmente «morada» ou «habitação», no contexto de proteção a expressão «rocha de refúgio» comunica de modo claro o sentido provável; a leitura mais literal fica na nota.
- source_word: לָבוֹא תָּמִיד
  choice: à qual eu possa sempre recorrer
  rationale: O infinitivo בוא indica ir ou entrar no lugar protetor. «Recorrer» expressa naturalmente em português a ideia de buscar repetidamente esse refúgio, enquanto «sempre» representa תָּמִיד.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: ordenaste que me salvassem
  rationale: צוה mantém seu sentido concreto de ordenar, e o infinitivo causativo com sufixo significa literalmente «salvar-me». A oração subordinada portuguesa preserva a ambiguidade quanto ao agente implícito encarregado de executar a ordem.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a súplica, com registro poético digno e corrente.
- source_word: סַלְעִי
  choice: o meu rochedo
  rationale: סלע pode designar rochedo ou penhasco. «Rochedo» distingue o termo de צוּר, já traduzido como «rocha», sem perder a imagem de proteção sólida.
- source_word: וּמְצוּדָתִי
  choice: e a minha fortaleza
  rationale: מצודה designa uma fortaleza ou lugar fortificado; «fortaleza» é claro, vívido e tradicional sem ser arcaico.
theological_decisions:
- issue: Se צִוִּיתָ לְהוֹשִׁיעֵנִי deve ser interpretado como decreto divino ou traduzido com a força verbal de «ordenar»
  choice: ordenaste que me salvassem
  alternative: determinaste salvar-me
  rationale: O hebraico emprega explicitamente o verbo «ordenar». A tradução conserva essa força e evita reduzir a expressão a uma formulação doutrinária específica. A alternativa mais direta e sua possível nuance são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. Emprega «tu» em consonância com a oração hebraica e evita construções excessivamente arcaicas.
