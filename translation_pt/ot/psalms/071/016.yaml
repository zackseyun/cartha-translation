  text: אָב֗וֹא בִּ֭/גְבֻרוֹת אֲדֹנָ֣/י יְהוִ֑ה אַזְכִּ֖יר צִדְקָתְ/ךָ֣ לְ/בַדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/016.yaml
  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: pt
  text: Virei com os feitos poderosos do Senhor Yahweh[a]; proclamarei a tua justiça[b][c], somente a tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Virei nos feitos poderosos do Senhor Yahweh”. A preposição hebraica pode ser entendida em sentido instrumental (“com”) ou mais locativo (“em”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mencionarei” ou “relatarei”. O verbo hebraico pode significar mencionar, recordar, relatar ou proclamar.'
    reason: lexical_alternative
  - marker: c
    text: “A tua justiça” também pode ser entendida como “a tua retidão” ou, neste contexto, “os teus atos de justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Virei
  rationale: O qal imperfeito de בוא pode significar vir, ir ou entrar. “Virei” conserva o sentido básico e deixa em aberto a natureza exata desse movimento no contexto poético.
- source_word: בִּגְבֻרוֹת
  choice: com os feitos poderosos
  rationale: O plural גְּבוּרוֹת pode designar manifestações de poder, isto é, feitos poderosos. A preposição ב pode ter valor instrumental (“com”) ou ser entendida de modo mais locativo; a alternativa é registrada em nota.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: “Senhor” representa אֲדֹנָי, e “Yahweh” translitera o nome divino יהוה, distinguindo os dois elementos do título composto sem produzir a repetição “Senhor SENHOR”.
- source_word: אַזְכִּיר
  choice: proclamarei
  rationale: O hifil de זכר pode significar fazer lembrar, mencionar, relatar ou proclamar. “Proclamarei” expressa naturalmente a declaração pública sugerida pelo contexto, sem excluir a alternativa mais literal registrada em nota.
- source_word: צִדְקָתְךָ
  choice: a tua justiça
  rationale: צְדָקָה abrange justiça, retidão e ações justas. “Justiça” é corrente e digna em português, preservando a amplitude teológica do termo; outros matizes são indicados em nota.
- source_word: לְבַדֶּךָ
  choice: somente a tua
  rationale: A expressão enfatiza exclusividade. “Somente a tua” liga naturalmente essa ênfase à justiça de Deus, sem acrescentar outro objeto ao verbo.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano Senhor; Senhor DEUS
  rationale: A forma escolhida representa separadamente אֲדֹנָי e o nome próprio יהוה, preservando a identificação pessoal do Deus de Israel sem fundir os dois termos.
- issue: Amplitude de צִדְקָתְךָ
  choice: a tua justiça
  alternative: a tua retidão; os teus atos de justiça
  rationale: O substantivo pode apontar tanto para o caráter justo de Deus quanto para suas ações justas. A tradução principal mantém essa tensão em vez de restringi-la a um único aspecto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa singular foi mantida por refletir a interpelação direta a Deus e por ser amplamente reconhecível no registro bíblico. A ordem dos marcadores acompanha a sequência das expressões a que se referem.
