  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: pt
  text: Em ti tenho me apoiado desde o ventre materno; desde as entranhas de minha mãe, foste tu quem me tirou.[a] Em ti está o meu louvor continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluente: “desde o ventre de minha mãe, foste tu quem me tirou”. O hebraico usa aqui um termo diferente do empregado na frase anterior; literalmente, “desde as entranhas de minha mãe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: Em ti me apoio
  rationale: Expressa dependência de Deus e preserva a imagem concreta de apoiar-se nele. O presente em português comunica uma confiança iniciada no ventre e ainda vigente no contexto do salmo.
- source_word: מִבֶּטֶן
  choice: desde o ventre materno
  rationale: בטן designa o ventre ou útero. A inclusão de “materno” torna a imagem natural e inequívoca em português.
- source_word: מִמְּעֵי אִמִּי
  choice: desde as entranhas de minha mãe
  rationale: Preserva a variação lexical do hebraico, que emprega aqui מֵעֶה, “entranhas/partes interiores”, depois de בטן na frase anterior.
- source_word: אַתָּה גוֹזִי
  choice: foste tu quem me tirou de lá
  rationale: O pronome independente אַתָּה recebe a ênfase “foste tu”. A formulação atribui a Deus a saída do ventre sem recorrer à tradução excessivamente literal “cortou” nem ampliar o termo para “libertador”.
- source_word: בְּךָ תְהִלָּתִי
  choice: Em ti está o meu louvor
  rationale: Mantém a expressão compacta com בְּךָ e entende Deus como referência ou objeto do louvor, sem explicitar além do hebraico se o sentido é “por ti”, “em ti” ou “dirigido a ti”.
- source_word: תָמִיד
  choice: continuamente
  rationale: Comunica a continuidade indicada pelo advérbio e mantém um registro poético digno.
theological_decisions:
- issue: Ação de Deus na imagem do nascimento
  choice: Deus é apresentado como aquele que tirou o salmista das entranhas maternas.
  alternative: Entender a expressão de modo mais geral, como Deus sustentando o salmista desde o nascimento.
  rationale: A imagem hebraica atribui diretamente a Deus a saída do ventre. A tradução conserva essa ação providencial sem acrescentar uma formulação doutrinária que ultrapasse o verso.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo e a variação entre “ventre materno” e “entranhas de minha mãe”; a construção “foste tu quem” reproduz a ênfase do pronome hebraico.
