  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: pt
  text: Ó Deus, não fiques longe de mim; meu Deus, apressa-te em me ajudar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo. Em português, «Ó Deus» expressa de modo natural e digno o chamamento direto da oração.
- source_word: אַל תִּרְחַק
  choice: não fiques longe
  rationale: A partícula negativa com o verbo comunica uma súplica para que Deus não permaneça nem se torne distante; a formulação preserva a metáfora espacial e relacional.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Representa diretamente a preposição de separação com o sufixo de primeira pessoa.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Preserva o sufixo de primeira pessoa e a relação pessoal expressa no apelo.
- source_word: לְעֶזְרָתִי
  choice: em me ajudar
  rationale: O hebraico significa literalmente «para o meu auxílio». Depois de «apressa-te», esta construção é corrente em português e comunica claramente a finalidade.
- source_word: חִישָׁה
  choice: apressa-te
  rationale: Traduz o imperativo de urgência sem acrescentar um verbo de movimento ausente do hebraico.
theological_decisions:
- issue: Repetição dos títulos divinos em discurso direto
  choice: Ó Deus ... meu Deus
  alternative: Deus ... meu Deus
  rationale: A primeira ocorrência recebe a marca vocativa natural em português, enquanto a repetição e o pronome possessivo são preservados sem introduzir uma interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Apressa-te» mantém a solenidade poética sem recorrer a linguagem excessivamente arcaica.
