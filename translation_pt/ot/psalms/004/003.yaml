source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: pt
  text: E saibam que Yahweh separou para si aquele que lhe é fiel[a]; Yahweh me ouve quando clamo a ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “distinguiu para si o piedoso”. O termo hebraico pode destacar devoção ou fidelidade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh me ouvirá quando eu clamar a ele”. O verbo hebraico pode indicar tanto uma ação habitual no presente quanto um futuro expresso com confiança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: E saibam
  rationale: O imperativo é plural e convoca os ouvintes a reconhecer um fato. A conjunção foi mantida sem impor um contraste que o hebraico não exige.
- source_word: כִּי
  choice: que
  rationale: Introduz naturalmente, em português, o conteúdo do verbo “saibam”.
- source_word: הִפְלָה
  choice: separou
  rationale: O hifil de פלא, neste contexto e com לוֹ, indica distinguir ou reservar alguém de modo especial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: חָסִיד
  choice: aquele que lhe é fiel
  rationale: Expressa uma pessoa marcada por fidelidade, devoção e lealdade pactual, preservando o singular do hebraico sem recorrer ao menos corrente “piedoso”.
- source_word: לוֹ
  choice: para si
  rationale: 'Comunica de modo natural o valor reflexivo: Yahweh reserva essa pessoa para si mesmo.'
- source_word: יִשְׁמַע
  choice: me ouve
  rationale: O imperfeito pode descrever ação habitual ou expressar certeza. O presente comunica a confiança do salmista sem excluir a leitura futura, registrada em nota.
- source_word: בְּקָרְאִי
  choice: quando clamo
  rationale: A construção com infinitivo expressa circunstância temporal; “quando clamo” é natural e mantém o aspecto de oração intensa.
- source_word: אֵלָיו
  choice: a ele
  rationale: Preserva a direção do clamor dirigido a Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de חָסִיד
  choice: aquele que lhe é fiel
  alternative: o piedoso
  rationale: A escolha preserva a amplitude ética e pactual do termo sem restringi-lo a uma definição denominacional.
- issue: Valor temporal de יִשְׁמַע
  choice: me ouve
  alternative: me ouvirá
  rationale: O imperfeito hebraico admite tanto uma afirmação habitual quanto um futuro de confiança; o texto principal adota o presente e a nota conserva a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Aquele que lhe é fiel” preserva o singular e evita tanto linguagem arcaica quanto uma especificação doutrinária excessiva.
