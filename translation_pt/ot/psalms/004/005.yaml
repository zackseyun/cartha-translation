source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: pt
  text: Ofereçam sacrifícios de justiça[a] e confiem em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios justos”, “sacrifícios legítimos” ou “sacrifícios de retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Ofereçam sacrifícios
  rationale: O verbo e o substantivo cognatos descrevem a ação sacrificial. Em português, “ofereçam sacrifícios” é natural, mantém o sentido cultual e evita a formulação pouco idiomática “sacrifiquem sacrifícios”.
- source_word: צֶדֶק
  choice: de justiça
  rationale: O substantivo pode abranger justiça, retidão e conformidade com o que é correto. “De justiça” preserva a construção nominal e deixa em aberto se os sacrifícios são caracterizados pela conduta justa, pela legitimidade cultual ou por ambas.
- source_word: וּבִטְחוּ
  choice: e confiem
  rationale: Imperativo masculino plural de בטח. “Confiem” traduz diretamente a exortação e corresponde ao número plural do hebraico.
- source_word: אֶל
  choice: em
  rationale: Embora a preposição indique literalmente direção, com o verbo “confiar” o português idiomático exige “em”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de זִבְחֵי צֶדֶק
  choice: “sacrifícios de justiça”, sem restringir a expressão à sinceridade moral ou à correção ritual
  alternative: “sacrifícios justos”, “sacrifícios legítimos” ou “sacrifícios oferecidos com retidão”
  rationale: A construção hebraica comporta tanto uma dimensão ética e relacional quanto a ideia de sacrifícios corretos ou legítimos. A formulação escolhida preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Ofereçam sacrifícios” é a formulação cultual mais natural; “de justiça” conserva a concisão e a ambiguidade genuína do hebraico.
