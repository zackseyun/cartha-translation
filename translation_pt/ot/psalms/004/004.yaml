  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: pt
  text: Tremam[a] e não pequem; falem em seus corações, quando estiverem em suas camas, e fiquem em silêncio[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Irai-vos e não pequem”. O verbo hebraico pode indicar agitação, tremor ou ira.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “fiquem quietos”.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רִגְזוּ
  choice: Tremam
  rationale: O verbo רגז pode expressar tremor, agitação ou ira. “Tremam” preserva a perturbação emocional sem restringir o sentido à ira e combina com o movimento do verso em direção ao recolhimento e ao silêncio.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: e não pequem
  rationale: Reproduz de modo direto e natural a proibição hebraica.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: falem em seus corações
  rationale: Mantém o sentido verbal de אמר e a imagem hebraica do coração como centro da reflexão interior, sem substituir explicitamente a fala interior por uma interpretação como “reflitam”.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: em suas camas
  rationale: Expressa naturalmente em português o lugar de recolhimento indicado pelo hebraico, preservando a referência plural.
- source_word: וְדֹמּוּ
  choice: e fiquem em silêncio
  rationale: דמם pode indicar silêncio ou imobilidade. “Fiquem em silêncio” é claro no contexto e conserva, em nota, a possibilidade mais ampla de quietude.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo litúrgico é incerto, a transliteração tradicional evita uma tradução especulativa.
theological_decisions:
- issue: Sentido de רגז na exortação moral
  choice: Tremam e não pequem
  alternative: Irem-se e não pequem
  rationale: O hebraico permite tremor, agitação ou ira. O contexto de exame interior e silêncio favorece “Tremam”, mas a leitura ligada à ira é antiga, semanticamente possível e deve permanecer visível em nota.
- issue: Natureza da fala no coração
  choice: Preservar a imagem de fala interior
  alternative: Reflitam ou meditem
  rationale: A expressão aponta para reflexão íntima, mas o verbo hebraico significa literalmente dizer ou falar. A tradução conserva essa tensão em vez de explicá-la no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural para representar os imperativos dirigidos à comunidade. A formulação “falem em seus corações” conserva deliberadamente a imagem hebraica, ainda compreensível em português, e “Selá” permanece sem tradução por causa de seu sentido incerto.
