source:
  edition: WLC
  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: pt
  text: Puseste alegria no meu coração, mais do que quando o cereal e o vinho novo deles se multiplicaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais literal: “Desde o tempo em que o cereal e o vinho novo deles se multiplicaram”. A expressão hebraica é geralmente entendida como uma comparação: a alegria dada por Deus supera a alegria da abundância material.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Puseste
  rationale: O qal perfeito na segunda pessoa masculina singular dirige-se a Deus e expressa uma ação realizada cujo efeito permanece; “puseste” é natural na linguagem de oração e combina bem com “no meu coração”.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: O substantivo designa alegria ou contentamento; “alegria” é claro, corrente e adequado ao sentido interior do contexto.
- source_word: בְלִבִּי
  choice: no meu coração
  rationale: A expressão refere-se ao íntimo da pessoa. A formulação preserva a imagem hebraica sem explicá-la em excesso.
- source_word: מֵעֵת
  choice: mais do que quando
  rationale: 'Entende-se מִן com עֵת como introdução do termo de comparação: a alegria concedida por Deus supera a associada à abundância agrícola. A nota registra a leitura sintaticamente mais literal.'
- source_word: דְּגָנָם
  choice: o cereal deles
  rationale: דָּגָן denota grãos ou produção cerealífera. “Cereal” é amplamente compreensível em português internacional e evita restringir o termo a uma espécie específica.
- source_word: וְתִירוֹשָׁם
  choice: e o vinho novo deles
  rationale: תִּירוֹשׁ designa o produto recente da videira, frequentemente traduzido como “vinho novo”; a escolha preserva a imagem da colheita e não reduz o termo a vinho em geral.
- source_word: רָבּוּ
  choice: se multiplicaram
  rationale: O qal perfeito plural de רבה indica aumento ou abundância. “Se multiplicaram” conserva o aspecto verbal e concorda naturalmente com os dois produtos mencionados.
theological_decisions:
- issue: Sintaxe comparativa do versículo
  choice: A alegria interior dada por Deus é maior do que a alegria ligada à abundância de cereal e vinho novo.
  alternative: “Desde o tempo em que o cereal e o vinho novo deles se multiplicaram, puseste alegria no meu coração.”
  rationale: A construção מֵעֵת é geralmente entendida como termo de comparação e combina com o contraste do salmo entre a alegria recebida de Deus e a prosperidade material. Como a sintaxe hebraica também admite uma leitura temporal mais literal, essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Mantém a imagem bíblica do coração e a expressão agrícola “vinho novo”; a ambiguidade entre leitura comparativa e temporal é preservada por meio da nota.
