base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: pt
  text: Quando clamo, responde-me, ó Deus da minha justiça[a]. Na angústia, abriste espaço para mim[b]. Concede-me graça e ouve a minha oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu Deus justo” ou “Deus que me faz justiça”. O hebraico diz literalmente “Deus da minha justiça”.
    reason: alternative_reading
  - marker: b
    text: 'Ou “me deste alívio”. A imagem hebraica é espacial: “abriste espaço para mim”, em meio à angústia ou ao aperto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Quando eu clamar
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de primeira pessoa tem sentido temporal. “Clamar” é natural no contexto de oração, sem exigir uma formulação excessivamente emotiva.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: O verbo ענה significa aqui “responder”; a forma imperativa preserva o apelo direto da oração.
- source_word: אֱלֹהֵי צִדְקִי
  choice: ó Deus da minha justiça
  rationale: 'Mantém a estrutura construta do hebraico e sua abertura semântica: Deus pode ser entendido como fonte da justiça do salmista ou como aquele que o justifica e lhe faz justiça.'
- source_word: בַּצָּר
  choice: Na angústia
  rationale: צַר descreve aflição ou aperto. “Angústia” comunica o sofrimento e combina com a imagem espacial de sair de um lugar estreito.
- source_word: הִרְחַבְתָּ לִּי
  choice: abriste espaço para mim
  rationale: O hifil de רחב expressa tornar amplo ou espaçoso. A formulação preserva a metáfora espacial da libertação e soa natural em português.
- source_word: חָנֵּנִי
  choice: Concede-me a tua graça
  rationale: חנן significa mostrar favor ou graça. Esta formulação é clara em português e preserva melhor essa nuance do que uma tradução limitada a compaixão.
- source_word: וּשְׁמַע
  choice: e ouve
  rationale: שׁמע, em linguagem de oração, indica ouvir com atenção; “ouve” é a forma direta e tradicional sem acrescentar interpretação.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: תְּפִלָּה é o termo comum para oração, e esta é a correspondência portuguesa mais direta.
theological_decisions:
- issue: Sentido de “Deus da minha justiça”
  choice: Manter no texto principal a expressão formal “Deus da minha justiça”
  alternative: “meu Deus justo” ou “Deus que me faz justiça”
  rationale: A construção hebraica não determina uma única relação entre Deus, o salmista e a justiça. A tradução formal preserva a possibilidade de Deus ser a fonte da justiça do salmista ou aquele que o defende e vindica, sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a metáfora espacial do hebraico e a ambiguidade teológica da expressão “Deus da minha justiça”.
