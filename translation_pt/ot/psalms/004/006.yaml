  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: pt
  text: 'Muitos estão dizendo: “Quem nos mostrará o bem?[a] Faz brilhar sobre nós a luz do teu rosto[b], ó Yahweh[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem nos fará ver o bem?” O verbo hebraico está na forma causativa.'
    reason: lexical_alternative
  - marker: b
    text: “A luz do teu rosto” é uma imagem poética para o favor ou a presença graciosa de Deus.
    reason: lexical_alternative
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Muitos estão dizendo
  rationale: O particípio expressa uma fala em curso ou característica; a locução progressiva preserva esse valor e soa natural em português.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Quem nos mostrará o bem?
  rationale: O hifil de ראה tem sentido causativo, ‘fazer ver/mostrar’. ‘O bem’ mantém a amplitude de טוֹב sem restringi-lo a prosperidade material.
- source_word: נְסָה עָלֵינוּ
  choice: Faz brilhar sobre nós
  rationale: No contexto da ‘luz do rosto’, a expressão é vertida de modo poético e compreensível. A forma hebraica é rara e admite discussão textual e lexical, mas o sentido contextual é um pedido pela manifestação luminosa do favor divino.
- source_word: אוֹר פָּנֶיךָ
  choice: a luz do teu rosto
  rationale: Preserva literalmente a imagem antropomórfica hebraica, em vez de substituí-la no texto principal por ‘favor’ ou ‘presença’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
theological_decisions:
- issue: Imagem antropomórfica da luz do rosto divino
  choice: Manter ‘a luz do teu rosto’ no texto principal
  alternative: teu favor; a luz da tua presença
  rationale: A metáfora comunica favor e presença graciosa, mas sua conservação mantém a força poética e a tensão própria do texto hebraico.
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração o preserva, enquanto ‘SENHOR’ o substitui por um título.
- issue: Alcance de טוֹב
  choice: o bem
  alternative: algo de bom; prosperidade
  rationale: ‘O bem’ conserva o sentido amplo e não decide se a pergunta se refere a benefício, bem-estar, prosperidade ou favor divino.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala direta inclui tanto a pergunta quanto a súplica. A metáfora hebraica central foi preservada; ‘faz brilhar’ evita a formulação pouco natural ‘levanta a luz’ sem reduzir a imagem a uma explicação.
