id: PSA.4.2
reference: Psalms 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: pt
  text: Filhos dos homens, até quando minha honra[a] será transformada em vergonha? Até quando amarão o que é vazio e buscarão a falsidade? Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha glória”. A palavra hebraica pode indicar honra, glória, dignidade ou peso; aqui provavelmente se refere à dignidade do salmista, exposta à vergonha pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: Filhos dos homens
  rationale: Preserva o modo de tratamento masculino plural e a força retórica da expressão hebraica, embora em português funcione como referência aos adversários humanos do salmista.
- source_word: עַד מֶה
  choice: até quando
  rationale: É a forma idiomática natural em português para esta pergunta de protesto temporal.
- source_word: כְבוֹדִי
  choice: minha honra
  rationale: כָּבוֹד pode significar honra ou glória. Neste contexto de vergonha pública e falsidade, “honra” comunica melhor a dimensão social, sem excluir a ideia mais ampla de glória.
- source_word: לִכְלִמָּה
  choice: transformarão ... em vergonha
  rationale: A construção hebraica é elíptica, literalmente próxima de “minha honra para vergonha”. O verbo explícito torna natural em português a ideia de fazer da honra motivo ou condição de vergonha.
- source_word: תֶּאֱהָבוּן
  choice: amarão
  rationale: O imperfeito na repreensão pode apontar para conduta continuada; o futuro português, ligado a “até quando”, conserva bem a força retórica.
- source_word: רִיק
  choice: o que é vazio
  rationale: Expressa aquilo que é vão, inútil ou sem substância em linguagem atual, evitando o possível tom arcaico de “vaidade”.
- source_word: תְּבַקְשׁוּ
  choice: buscarão
  rationale: Tradução direta de בקשׁ que preserva o paralelismo com “amarão”.
- source_word: כָזָב
  choice: a falsidade
  rationale: Mantém o substantivo abstrato singular e o paralelismo poético com “o que é vazio”; também pode abranger mentira e engano.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém por transliteração o marcador litúrgico ou musical de sentido preciso incerto.
theological_decisions:
- issue: Referente de “minha honra”
  choice: A tradução não especifica se se trata da dignidade pessoal ou régia do salmista, nem se é uma honra concedida por Deus.
  alternative: “minha glória” ou “a honra que Deus me deu”
  rationale: O hebraico permite um sentido amplo de honra ou glória. Preservar essa amplitude evita impor uma identificação teológica ou histórica não explícita.
- issue: Agentes da transformação da honra em vergonha
  choice: 'Os homens interpelados são apresentados como agentes: “vocês transformarão”.'
  alternative: 'Forma passiva ou elíptica: “até quando minha honra será transformada em vergonha?”'
  rationale: A sequência em segunda pessoa plural (“amarão”, “buscarão”) favorece entender os destinatários como responsáveis, embora o hebraico seja elíptico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” explicita de modo natural o sujeito plural já presente nas formas verbais hebraicas. “Filhos dos homens” conserva deliberadamente o colorido idiomático e retórico do original; “Selá” permanece sem explicação interpretativa no corpo do texto.
