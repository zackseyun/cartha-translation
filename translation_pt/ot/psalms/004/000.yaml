  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינ֗וֹת מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: pt
  text: 'Ao regente: com instrumentos de cordas. Salmo de Davi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; a expressão hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo é geralmente entendido como uma orientação ao responsável pela execução musical. “Regente” é claro e atual, sem recorrer a uma expressão arcaica nem especificar que se tratava necessariamente de um coro.
- source_word: בִּנְגִינוֹת
  choice: com instrumentos de cordas
  rationale: O substantivo, neste contexto musical, refere-se a música executada com instrumentos de cordas. A tradução preserva a orientação de execução sem definir uma prática mais específica do que o hebraico.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação convencional e adequada desse gênero de composição poético-musical.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição hebraica pode indicar autoria, associação, pertença ou dedicação. “De Davi” mantém em português uma amplitude semelhante, sem impor uma interpretação mais estreita.
theological_decisions:
- issue: Autoria ou associação indicada por לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A construção hebraica não determina por si só se Davi é o autor, a pessoa associada ao salmo ou seu destinatário. A tradução preserva essa ambiguidade histórica e teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural. “Ao regente” comunica a instrução musical de modo amplamente compreensível; “Salmo de Davi” preserva a formulação tradicional e a ambiguidade do hebraico. O marcador [a] aparece imediatamente após seu referente.
