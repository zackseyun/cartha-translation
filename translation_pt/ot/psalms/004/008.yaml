base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: pt
  text: Em paz, deito-me e durmo[a], pois só tu, ó Yahweh[b], me fazes habitar em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Em paz, juntamente me deito e durmo». O advérbio hebraico pode significar «juntamente» ou «ao mesmo tempo»; neste contexto, pode realçar as duas ações em conjunto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pois tu, Yahweh, me fazes habitar sozinho em segurança». O hebraico também permite entender que «sozinho» descreve a maneira como o salmista habita, embora o texto principal ligue a palavra a «tu».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: Em paz
  rationale: שָׁלוֹם abrange paz, bem-estar e integridade; «em paz» é natural em português e se ajusta ao repouso seguro descrito no contexto.
- source_word: יַחְדָּו
  choice: logo
  rationale: O advérbio significa literalmente «juntamente» ou «ao mesmo tempo». Neste contexto, liga estreitamente deitar-se e dormir; «logo» expressa de modo idiomático que o sono acompanha prontamente o ato de se deitar, embora a alternativa mais literal seja preservada em nota.
- source_word: אֶשְׁכְּבָה וְאִישָׁן
  choice: eu me deito e logo adormeço
  rationale: Os imperfeitos podem expressar decisão ou confiança. O presente declarativo soa natural em português e retrata a ação habitual ou confiante; «adormeço» torna clara a progressão entre deitar-se e dormir sem alterar o sentido central.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do repouso tranquilo e mantém o encadeamento poético com linguagem atual e dignificada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְבָדָד
  choice: só tu
  rationale: 'A posição e o sentido favorecem ligar «somente» ao sujeito divino: Yahweh é o único que concede segurança. A construção alternativa, na qual o salmista habita sozinho, permanece em nota.'
- source_word: לָבֶטַח
  choice: em segurança
  rationale: בֶּטַח indica segurança ou confiança; «em segurança» combina naturalmente com «habitar».
- source_word: תּוֹשִׁיבֵנִי
  choice: me fazes habitar
  rationale: O hifil de ישׁב é causativo. «Fazes habitar» preserva essa força de maneira clara e natural.
theological_decisions:
- issue: Referente e função de לְבָדָד
  choice: '«só tu»: Yahweh é o único que faz o salmista habitar em segurança.'
  alternative: '«me fazes habitar sozinho em segurança»: o advérbio descreve a condição do salmista.'
  rationale: A leitura principal segue a associação mais natural do advérbio com «tu, Yahweh», ressaltando a dependência exclusiva de Deus sem acrescentar uma formulação doutrinária além do texto. A sintaxe hebraica também permite relacioná-lo ao modo de habitar, por isso a ambiguidade é registrada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva tom poético e digno, usa «Yahweh» para o nome divino e registra em notas as duas ambiguidades relevantes do hebraico.
