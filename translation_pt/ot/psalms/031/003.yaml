id: PSA.31.3
reference: Psalms 31:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: pt
  text: Pois[a] tu és a minha rocha e a minha fortaleza[b]; por causa do teu nome, tu me conduzirás e me guiarás[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque”. O hebraico pode introduzir uma razão ou uma explicação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu lugar fortificado” ou “meu baluarte”.'
    reason: lexical_alternative
  - marker: c
    text: 'Os dois verbos são sinônimos próximos na poesia hebraica. Também podem ser entendidos como um pedido: “conduze-me e guia-me”.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a oração no contexto. “Pois” liga naturalmente esta confissão ao pedido anterior, embora o hebraico também possa ser entendido como “porque”.
- source_word: סַלְעִי
  choice: a minha rocha
  rationale: Preserva a imagem concreta de uma rocha ou penhasco como lugar de segurança e refúgio, em linguagem clara e tradicional.
- source_word: מְצוּדָתִי
  choice: a minha fortaleza
  rationale: Designa um lugar fortificado e seguro. “Fortaleza” mantém a imagem defensiva e forma um paralelo natural com “rocha”.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: por causa do teu nome
  rationale: Mantém a referência ao nome de Deus como fundamento de sua ação — seu caráter revelado, sua honra e fidelidade — em português atual e compreensível.
- source_word: תַּנְחֵנִי
  choice: tu me conduzirás
  rationale: O hifil de נחה expressa conduzir ou guiar. O futuro comunica, neste contexto de oração, expectativa confiante.
- source_word: וּתְנַהֲלֵנִי
  choice: e me guiarás
  rationale: O verbo também denota condução e orientação. Um verbo português distinto conserva o paralelismo de sinônimos próximos sem fundi-los.
theological_decisions:
- issue: Sentido de “por causa do teu nome”
  choice: A orientação divina se fundamenta no próprio nome de Deus, abrangendo seu caráter revelado, sua honra e sua fidelidade, sem explicitar no texto mais do que o hebraico afirma.
  alternative: Entender “nome” apenas como reputação perante outras pessoas.
  rationale: A expressão hebraica apela ao “nome” de Deus como razão para sua ação e admite uma riqueza de sentido que não deve ser reduzida na tradução.
- issue: Valor dos verbos hebraicos no imperfeito
  choice: 'Expectativa confiante no futuro: “tu me conduzirás e me guiarás”.'
  alternative: 'Petição: “conduze-me e guia-me”; ou ação habitual/presente: “tu me conduzes e me guias”.'
  rationale: No contexto, os imperfeitos podem expressar confiança decorrente da confissão de que Deus é rocha e fortaleza. O futuro preserva bem essa leitura, enquanto a nota reconhece a possibilidade de valor volitivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo poético foi preservado por meio de “conduzir” e “guiar”; a metáfora de proteção permaneceu concreta, sem paráfrase explicativa.
