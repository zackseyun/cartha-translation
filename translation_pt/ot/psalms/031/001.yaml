    issue: A formulação principal e a nota para בְּצִדְקָתְךָ devem ser realinhadas.
    rationale: “Em tua justiça” mantém a imagem e a construção da fonte; “Por tua justiça” explicita a possibilidade instrumental. A nota atual (“retidão”) não registra a alternativa preposicional mais relevante documentada no trilho inglês.
  revised_text: Em ti, Yahweh, me refugiei; que eu jamais seja envergonhado. Em tua justiça[a], livra-me.
