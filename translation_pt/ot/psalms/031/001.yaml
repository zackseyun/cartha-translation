  source_fidelity: A primeira oração é globalmente fiel, mas “busquei refúgio” pode sugerir apenas a procura de abrigo, enquanto חָסִיתִי afirma que o salmista efetivamente se refugiou em Yahweh. “Em tua justiça” reproduz mais diretamente o בְּ da fonte e a opção principal do trilho de auditoria inglês; a leitura instrumental permanece apropriada em nota.
  naturalness: “Em ti, Yahweh, me refugiei” é natural, solene e claro em português moderno. “Que eu jamais seja envergonhado” preserva adequadamente a súplica negativa e o registro poético.
  terminology: “Yahweh” preserva corretamente o tetragrama. “Justiça” é uma boa tradução de צִדְקָה neste apelo; “Por tua justiça” é uma alternativa semântica pertinente, não “retidão” como alternativa principal requerida pelo contexto preposicional.
