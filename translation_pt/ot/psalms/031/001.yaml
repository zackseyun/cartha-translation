  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: pt
  text: Em ti, Yahweh, me refugiei; que eu jamais seja envergonhado. Em tua justiça[a], livra-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por tua justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Em ti
  rationale: Preserva a imagem hebraica de encontrar refúgio em alguém e introduz naturalmente o objeto de חָסִיתִי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: חָסִיתִי
  choice: busquei refúgio
  rationale: Expressa o qatal na primeira pessoa e mantém a imagem concreta de recorrer a um lugar seguro; em português, é mais natural do que a formulação literal 'tomei refúgio'.
- source_word: אַל־אֵבוֹשָׁה לְעוֹלָם
  choice: que eu jamais seja envergonhado
  rationale: Reproduz a súplica negativa e o valor absoluto de לְעוֹלָם no contexto, preservando a ideia de sofrer vergonha ou desonra por uma esperança frustrada.
- source_word: בְּצִדְקָתְךָ
  choice: Por tua justiça
  rationale: 'Entende בְּ em sentido instrumental ou causal: a justiça de Yahweh é a base ou o meio do livramento. ''Justiça'' preserva o campo semântico, enquanto ''retidão'' continua possível.'
- source_word: פַלְּטֵנִי
  choice: livra-me
  rationale: Verte de modo conciso e digno o imperativo intensivo que pede resgate ativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Sentido de צְדָקָה como fundamento da ação salvadora de Deus
  choice: justiça
  alternative: retidão
  rationale: '''Justiça'' mantém a amplitude do termo hebraico e sua ligação com a ação correta de Deus, sem restringi-lo apenas à justiça judicial; a alternativa ''retidão'' ressalta seu caráter moral.'
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem 'Em ti, Yahweh' conserva a ênfase inicial do hebraico. O paralelismo e a brevidade da súplica foram mantidos.
