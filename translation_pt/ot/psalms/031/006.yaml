source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: pt
  text: Odeio os que se apegam a ídolos inúteis[a], mas eu confio em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que guardam/consideram coisas vãs” ou “os que se apegam a vaidades vazias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Odeio
  rationale: O perfeito qal na poesia expressa aqui uma atitude firme e contínua; o presente comunica isso com naturalidade em português.
- source_word: הַשֹּׁמְרִים
  choice: os que se apegam a
  rationale: Embora o verbo שמר possa significar “guardar”, “observar” ou “vigiar”, neste contexto indica adesão ou devoção aos objetos mencionados. “Apegam-se a” preserva essa força relacional sem tornar a referência excessivamente específica.
- source_word: הַבְלֵי שָׁוְא
  choice: ídolos inúteis
  rationale: A expressão reúne ideias de vazio, inutilidade e falsidade. No contraste com a confiança em Yahweh, refere-se naturalmente a falsos objetos de devoção ou confiança; a nota preserva traduções mais literais.
- source_word: וַאֲנִי
  choice: mas eu
  rationale: A conjunção e o pronome enfático estabelecem contraste direto entre o salmista e as pessoas da oração anterior.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: eu confio em Yahweh
  rationale: Com בטח, a preposição אֶל é expressa idiomaticamente por “em” em português. O perfeito descreve uma confiança estabelecida, apresentada naturalmente no presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de הַבְלֵי שָׁוְא
  choice: ídolos inúteis
  alternative: coisas vãs; vaidades vazias; falsidades inúteis
  rationale: O contexto contrasta a adesão a objetos falsos e vazios com a confiança em Yahweh. “Ídolos” torna explícito o referente provável, enquanto a nota conserva a amplitude lexical e a ambiguidade da expressão hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa preserva o paralelismo e o contraste poético. O nome divino é transliterado como “Yahweh”.
