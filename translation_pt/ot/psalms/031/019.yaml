  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: pt
  text: Como é grande a tua bondade, que reservaste para os que te temem e realizaste em favor dos que se refugiam em ti, diante dos filhos dos homens![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante da humanidade” ou “diante das pessoas”. O hebraico diz literalmente “diante dos filhos do homem”, expressão representativa que se refere aos seres humanos em geral.
    reason: Alternativa lexical e esclarecimento de uma expressão idiomática hebraica.
lexical_decisions:
- source_word: מָה רַב
  choice: Como é grande
  rationale: A construção exclamativa expressa admiração pela magnitude; esta formulação é natural e clara em português atual.
- source_word: טוּבְךָ
  choice: a tua bondade
  rationale: O termo pode indicar bondade, bens ou generosidade abundante. “Bondade” preserva tanto a qualidade divina quanto seus benefícios concretos.
- source_word: צָפַנְתָּ
  choice: reservaste
  rationale: O verbo descreve algo guardado ou armazenado para uso futuro. “Reservaste” comunica essa ideia com naturalidade, sem enfatizar indevidamente o ocultamento.
- source_word: לִירֵאֶיךָ
  choice: para os que te temem
  rationale: Mantém a expressão bíblica do temor de Deus, que neste contexto inclui reverência e lealdade, sem reduzi-la a simples medo.
- source_word: פָּעַלְתָּ
  choice: realizaste em favor
  rationale: O verbo indica efetuar ou produzir algo. A expressão explicita em português que a bondade é realizada em benefício dos que buscam refúgio em Deus.
- source_word: לַחֹסִים בָּךְ
  choice: dos que se refugiam em ti
  rationale: Preserva a imagem concreta de buscar abrigo ou proteção em Deus, em vez de substituí-la pelo conceito mais abstrato de confiar.
- source_word: נֶגֶד
  choice: diante de
  rationale: 'Neste contexto, indica presença ou visibilidade pública: a bondade divina é realizada à vista da humanidade.'
- source_word: בְּנֵי אָדָם
  choice: os filhos dos homens
  rationale: Reproduz de perto a expressão hebraica representativa, enquanto a nota esclarece seu sentido inclusivo e coletivo.
theological_decisions:
- issue: Sentido do temor de Deus em לִירֵאֶיךָ
  choice: os que te temem
  alternative: os que te reverenciam
  rationale: “Temem” conserva a amplitude e a tensão da linguagem bíblica, que pode abranger reverência, submissão e consciência do poder divino.
- issue: Expressão antropológica בְּנֵי אָדָם
  choice: os filhos dos homens
  alternative: a humanidade / as pessoas
  rationale: A tradução principal conserva a forma masculina representativa do hebraico; a nota esclarece que a referência é aos seres humanos em geral.
- issue: Relação de נֶגֶד בְּנֵי אָדָם com a oração anterior
  choice: diante dos filhos dos homens
  alternative: publicamente, aos olhos da humanidade
  rationale: A formulação preserva a ligação sintática algo aberta do hebraico, mas comunica a dimensão pública da ação de Deus sem acrescentar uma interpretação mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe poética. O paralelismo entre a bondade reservada e a bondade realizada foi preservado; “se refugiam em ti” mantém a metáfora concreta do hebraico.
