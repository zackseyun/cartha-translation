source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: pt
  text: Ó Yahweh, que eu não seja envergonhado, pois clamo a ti; que os perversos sejam envergonhados; que fiquem em silêncio no Sheol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fiquem imóveis no Sheol” ou “que desçam em silêncio ao Sheol”. O verbo hebraico pode indicar silêncio ou imobilidade; “Sheol” designa o domínio dos mortos, não necessariamente o inferno.'
    reason: Alternativa lexical para o verbo hebraico e esclarecimento cultural-teológico de «Sheol».
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino explícito do texto hebraico e expressa o vocativo por meio de “Ó”.
- source_word: אַל אֵבוֹשָׁה
  choice: que eu não seja envergonhado
  rationale: Reproduz a súplica negativa e preserva o paralelo lexical com o pedido subsequente a respeito dos perversos.
- source_word: כִּי קְרָאתִיךָ
  choice: pois clamo a ti
  rationale: Apresenta a invocação de Deus como fundamento da súplica; o presente comunica naturalmente a ação no contexto da oração poética.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: que os perversos sejam envergonhados
  rationale: Conserva a força volitiva ou imprecatória e o paralelo com a primeira ocorrência do verbo בושׁ.
- source_word: יִדְּמוּ
  choice: que fiquem em silêncio
  rationale: Expressa o sentido não causativo de estar ou tornar-se silencioso, sem excluir a nuance possível de imobilidade.
- source_word: לִשְׁאוֹל
  choice: no Sheol
  rationale: Preserva por transliteração o termo hebraico para o domínio dos mortos e evita identificá-lo automaticamente com sepultura ou inferno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome divino; a transliteração conserva essa especificidade sem substituí-lo por um título.
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; domínio dos mortos; inferno
  rationale: A transliteração preserva a amplitude conceitual do termo e não introduz a noção posterior e mais específica de inferno.
- issue: Relação entre silêncio, imobilidade e descida ao Sheol
  choice: que fiquem em silêncio no Sheol
  alternative: que fiquem imóveis no Sheol; que desçam em silêncio ao Sheol
  rationale: A formulação principal acompanha o sentido mais direto do verbo, enquanto a nota conserva as alternativas permitidas pelo verbo e pela preposição hebraicos.
translation_notes:
  register: Português moderno, claro e solene, com construção paralela adequada à poesia de oração. “Perversos” mantém o peso moral de רְשָׁעִים sem acrescentar uma definição doutrinária.
