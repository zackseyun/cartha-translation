  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: pt
  text: Fui esquecido como um morto, apagado da memória; tornei-me como um objeto perdido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um objeto arruinado” ou “como um objeto que perece”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Fui esquecido
  rationale: O nifal perfeito na primeira pessoa descreve o estado resultante do salmista. Em português, “fui esquecido” exprime com naturalidade tanto o acontecimento quanto sua consequência presente.
- source_word: כְּמֵת
  choice: como um morto
  rationale: A preposição כְּ marca comparação, e מֵת é singular. “Como um morto” conserva a imagem pessoal e singular do hebraico.
- source_word: מִלֵּב
  choice: apagado da memória
  rationale: Literalmente, “do coração”; neste contexto, לֵב representa a mente ou a lembrança. A formulação comunica que o salmista já não é lembrado sem reproduzir um hebraísmo obscuro em português.
- source_word: הָיִיתִי
  choice: tornei-me
  rationale: O perfeito de היה indica aqui uma condição à qual o falante chegou. “Tornei-me” preserva essa mudança resultante.
- source_word: כִּכְלִי
  choice: como um objeto
  rationale: כְּלִי pode designar recipiente, utensílio, instrumento ou objeto. “Objeto” mantém a amplitude lexical e soa mais natural do que “vaso” quando a natureza do item não é especificada.
- source_word: אֹבֵד
  choice: perdido
  rationale: O particípio de אבד pode significar perdido, arruinado ou prestes a perecer. “Perdido” preserva a ambiguidade entre algo extraviado e algo descartado ou condenado à ruína.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, de ampla compreensão internacional e leitura natural no Brasil. O paralelismo foi preservado, e o sentido idiomático de מִלֵּב foi explicitado no texto sem estreitar indevidamente a ambiguidade de אֹבֵד.
