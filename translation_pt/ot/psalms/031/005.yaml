base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: pt
  text: Em tua mão entrego o meu espírito; tu me resgataste, ó Yahweh, Deus da verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus fiel”. A palavra hebraica pode expressar verdade, confiabilidade ou fidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: Em tuas mãos
  rationale: Com o verbo de confiar ou entregar, a expressão indica colocar algo sob o cuidado e poder de alguém. O plural idiomático “mãos” é natural em português e conserva esse sentido.
- source_word: אַפְּקִיד
  choice: entrego
  rationale: O hifil de פקד expressa confiar ou entregar aos cuidados de alguém. “Entrego” é claro, solene e natural no contexto de oração.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: רוּחַ pode significar espírito, sopro ou vento; aqui designa a vida ou o próprio ser confiado a Deus, e “espírito” preserva melhor essa amplitude pessoal e teológica.
- source_word: פָּדִיתָה אֹתִי
  choice: tu me resgataste
  rationale: פדה significa resgatar ou redimir. “Resgataste” comunica diretamente a libertação realizada, sem exigir uma transação comercial explícita, e o perfeito hebraico é representado pelo pretérito perfeito.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama; “ó” marca naturalmente o vocativo em português.
- source_word: אֵל אֱמֶת
  choice: Deus da verdade
  rationale: Reproduz com transparência a construção nominal hebraica. אֱמֶת abrange verdade, confiabilidade e fidelidade; a principal alternativa contextual é mantida em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O texto traz o nome pessoal divino, não apenas um título. A transliteração preserva essa distinção sem importar uma substituição tradicional.
- issue: Sentido de אֱמֶת em אֵל אֱמֶת
  choice: Deus da verdade
  alternative: Deus fiel
  rationale: “Verdade” conserva a forma nominal e a transparência lexical, enquanto “fiel” expressa a confiabilidade que o termo também pode denotar. A nota mantém essa ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e o tom de oração foram preservados; evitou-se linguagem arcaica, exceto o uso literário corrente de “tu” apropriado ao discurso direto a Deus.
