  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: pt
  text: Exultarei e me alegrarei em teu amor leal, pois viste a minha aflição e conheceste as angústias da minha alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as aflições da minha vida” ou “as angústias do meu ser”. A palavra hebraica néfesh pode significar “alma”, “vida” ou “ser/pessoa”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Exultarei
  rationale: O cohortativo de גיל expressa alegria intensa e uma resolução volitiva. “Exultarei” preserva essa força poética em português digno e corrente.
- source_word: וְאֶשְׂמְחָה
  choice: e me alegrarei
  rationale: שמח, em paralelo com גיל, intensifica poeticamente a alegria. A combinação evita repetição e mantém os dois verbos hebraicos.
- source_word: בְּחַסְדֶּךָ
  choice: em teu amor leal
  rationale: חסד designa amor constante, leal e frequentemente ligado à fidelidade da aliança. “Amor leal” comunica afeição e constância sem impor uma explicitação teológica ausente do verso.
- source_word: אֲשֶׁר
  choice: pois
  rationale: Embora seja formalmente uma partícula relativa, aqui introduz a razão da alegria; “pois” reproduz naturalmente seu valor causal no registro poético.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: viste a minha aflição
  rationale: עֳנִי denota aflição, miséria ou sofrimento. “Aflição” é conciso, claro e apropriado ao registro do salmo.
- source_word: יָדַעְתָּ
  choice: conheceste
  rationale: ידע abrange conhecer, reconhecer e tomar conhecimento atento. “Conheceste” preserva essa amplitude e a possível dimensão relacional.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: as angústias da minha alma
  rationale: צָרוֹת está no plural e indica apertos, adversidades ou angústias; נֶפֶשׁ pode significar alma, vida ou o próprio ser. A formulação preserva o plural e a abertura antropológica do hebraico.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na lamentação poética
  choice: alma
  alternative: vida; meu ser
  rationale: “Alma” mantém uma correspondência tradicional e contextualmente adequada, sem exigir um dualismo técnico entre corpo e alma. A nota registra os sentidos igualmente possíveis de vida e ser/pessoa.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. O paralelismo verbal foi preservado, e “amor leal” expressa a constância de חסד sem recorrer a linguagem arcaica. O marcador da nota aparece imediatamente após a expressão a que se refere.
