source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: pt
  text: 'Quanto a mim, eu disse, alarmado[a]: “Fui cortado de diante dos teus olhos[b]”. Contudo, ouviste a voz das minhas súplicas quando clamei a ti por socorro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com pressa” ou “em pânico”. O hebraico pode indicar pressa, agitação ou pânico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da tua vista”. Literalmente: “de diante dos teus olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: alarmado
  rationale: O termo pode expressar pressa, agitação ou pânico. Neste lamento, “alarmado” comunica naturalmente o estado de perturbação do salmista sem restringir o sentido à mera rapidez.
- source_word: נִגְרַזְתִּי
  choice: Fui cortado
  rationale: O nifal de גזר indica ser cortado ou removido. O pretérito é natural em português dentro da fala citada e preserva a imagem forte do hebraico sem interpretá-la como rejeição doutrinária explícita.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: de diante dos teus olhos
  rationale: Mantém a imagem concreta do hebraico, literalmente “de diante dos teus olhos”, embora “da tua vista” seja uma formulação idiomática possível.
- source_word: אָכֵן
  choice: Contudo
  rationale: No contexto, a partícula introduz um contraste enfático entre a percepção temerosa do salmista e o fato de Deus ter ouvido sua oração.
- source_word: קוֹל תַּחֲנוּנַי
  choice: a voz das minhas súplicas
  rationale: 'Preserva os dois elementos da expressão hebraica: קוֹל, “voz”, e תַּחֲנוּנִים, pedidos insistentes de favor ou misericórdia.'
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: quando clamei a ti por socorro
  rationale: שׁוע denota clamar por auxílio; “por socorro” explicita em português uma nuance já presente no verbo hebraico, enquanto אֵלֶיךָ mantém a direção do clamor a Deus.
theological_decisions:
- issue: Percepção de abandono divino em contraste com a realidade de Deus ouvir
  choice: Preservar a declaração experiencial “Fui cortado de diante dos teus olhos”, seguida pelo contraste “Contudo, ouviste”.
  alternative: Interpretar a primeira declaração como “Pensei que me tivesses rejeitado”.
  rationale: O hebraico descreve a percepção angustiada do salmista, mas não afirma explicitamente uma rejeição teológica. A formulação mantém a tensão entre a experiência humana e a resposta efetiva de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o tratamento tradicional dirigido a Deus. A redação conserva a imagem concreta do hebraico e emprega sintaxe natural, sem eliminar a tensão do lamento.
