source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: pt
  text: Que emudeçam[a] os lábios mentirosos, que falam com insolência[b] contra o justo[c], com orgulho e desprezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam silenciados” ou “fiquem mudos”. O verbo hebraico pode indicar tanto ficar em silêncio quanto ser reduzido ao silêncio.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é um substantivo que significa “insolência” ou “arrogância” e aqui caracteriza o modo de falar.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “uma pessoa justa”. O singular hebraico pode indicar um indivíduo ou ter valor representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Que emudeçam
  rationale: O nifal imperfeito com força jussiva expressa um desejo ou pedido. “Que emudeçam” preserva essa força e admite tanto a ideia de ficarem calados quanto a de serem reduzidos ao silêncio.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: os lábios mentirosos
  rationale: A expressão construta significa literalmente “lábios de falsidade”. “Lábios mentirosos” é idiomático em português e mantém a imagem concreta do hebraico.
- source_word: הַדֹּבְרוֹת
  choice: que falam
  rationale: O particípio feminino plural concorda com “lábios” e tem função atributiva; a oração relativa é natural e fiel em português.
- source_word: עַל צַדִּיק
  choice: contra o justo
  rationale: צַדִּיק é singular e substantivado. “O justo” preserva o singular representativo sem acrescentar uma identificação ausente no texto.
- source_word: עָתָק
  choice: com insolência
  rationale: O substantivo denota insolência, arrogância ou fala atrevida. A locução adverbial descreve naturalmente o modo de falar e evita confundi-lo por completo com גַאֲוָה, “orgulho”.
- source_word: בְּגַאֲוָה
  choice: com orgulho
  rationale: A preposição בְּ indica modo ou atitude; “com orgulho” reproduz a altivez expressa pelo substantivo.
- source_word: וָבוּז
  choice: e desprezo
  rationale: בּוּז designa desprezo ou desdém. “Desprezo” forma uma combinação clara e enfática com “orgulho”.
theological_decisions:
- issue: Identidade do צַדִּיק singular
  choice: o justo
  alternative: uma pessoa justa
  rationale: A tradução conserva a ambiguidade entre um indivíduo específico e o justo como figura representativa, sem impor uma identificação teológica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A acumulação de “insolência”, “orgulho” e “desprezo” foi mantida por refletir a intensidade retórica do hebraico, sem transformar os três termos em sinônimos indistintos.
