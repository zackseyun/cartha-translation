  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: pt
  text: 'Eu, porém,[a] confio em ti, ó Yahweh; digo: “Tu és o meu Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu, porém, confiei em ti, ó Yahweh; disse: ‘Tu és o meu Deus.’” As formas verbais hebraicas também podem ser traduzidas no passado ou com sentido de presente perfeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Eu, porém
  rationale: A conjunção com o pronome independente marca contraste e ênfase. “Eu, porém” expressa isso de modo natural e digno em português.
- source_word: עָלֶיךָ
  choice: em ti
  rationale: Com בָּטַח, a preposição עַל indica a pessoa em quem se deposita confiança; “confiar em ti” é a construção idiomática em português.
- source_word: בָטַחְתִּי
  choice: confio
  rationale: Embora a forma hebraica seja qatal, o contexto permite entendê-la como declaração presente de uma confiança estabelecida e contínua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָמַרְתִּי
  choice: digo
  rationale: Em paralelo com “confio”, comunica como confissão presente aquilo que a forma qatal hebraica apresenta como declaração estabelecida.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: O substantivo com sufixo de primeira pessoa do singular significa diretamente “meu Deus”.
- source_word: אָתָּה
  choice: Tu és
  rationale: O pronome independente é explícito e enfático; em português, a cópula completa naturalmente a declaração nominal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Valor temporal dos verbos בָטַחְתִּי e אָמַרְתִּי
  choice: 'Presente: “confio” e “digo”'
  alternative: 'Passado ou presente perfeito: “confiei” e “disse” / “tenho confiado” e “tenho dito”'
  rationale: As formas qatal admitem leitura passada ou resultativa, mas, nesta oração, podem expressar confiança e confissão vigentes. A nota preserva a alternativa sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A colocação “Eu, porém” conserva o contraste enfático do hebraico; “ó Yahweh” mantém o tom de invocação poética. O uso de “tu/ti” é coerente e dignificado.
