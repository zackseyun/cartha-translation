base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: pt
  text: Tira-me da rede que esconderam para mim[a], pois tu és a minha fortaleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da rede que armaram para mim”. O hebraico diz literalmente que esconderam a rede, imagem de uma armadilha oculta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Tira-me
  rationale: 'O hifil de יצא tem sentido causativo: fazer sair, tirar ou conduzir para fora. “Tira-me” é natural em português e preserva esse sentido no contexto de alguém preso ou ameaçado por uma rede.'
- source_word: מֵרֶשֶׁת
  choice: da rede
  rationale: רֶשֶׁת designa literalmente uma rede, empregada aqui como imagem de uma armadilha. “Rede” conserva a figura concreta do hebraico.
- source_word: זוּ
  choice: que
  rationale: זוּ pode ter força demonstrativa ou relativa neste contexto. A construção “da rede que esconderam” reproduz de modo natural em português a relação entre a rede e a ação descrita, sem obrigar uma leitura exclusivamente demonstrativa.
- source_word: טָמְנוּ לִי
  choice: esconderam para mim
  rationale: טמן significa esconder ou ocultar. Embora em português seja idiomático dizer que armaram uma rede, “esconderam para mim” preserva o verbo hebraico e deixa a intenção hostil ser indicada pelo contexto.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão do pedido. “Pois” estabelece com clareza e dignidade poética que a confiança do salmista se fundamenta em Deus.
- source_word: מָעוּזִּי
  choice: a minha fortaleza
  rationale: מָעוֹז indica lugar ou fonte de força e proteção. “Fortaleza” mantém a imagem defensiva e expressa naturalmente a confiança pessoal do salmista.
theological_decisions:
- issue: Metáfora de Deus como proteção
  choice: tu és a minha fortaleza
  alternative: tu és o meu refúgio; tu és o meu baluarte
  rationale: A expressão apresenta Deus metaforicamente como força protetora. “Fortaleza” preserva a dimensão defensiva sem transformar a imagem em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem direta preserva o paralelismo do pedido e de sua razão; a nota esclarece a expressão deliberadamente literal relativa à rede oculta.
