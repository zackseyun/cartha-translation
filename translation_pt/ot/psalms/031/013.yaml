  text: כִּ֤י שָׁמַ֨עְתִּי דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִ/סָּ֫בִ֥יב בְּ/הִוָּסְדָ֣/ם יַ֣חַד עָלַ֑/י לָ/קַ֖חַת נַפְשִׁ֣/י זָמָֽמוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: pt
  text: Pois ouvi os murmúrios de muitos — terror por todos os lados! — quando juntos conspiravam contra mim e planejavam tirar-me a vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as calúnias de muitos”. O substantivo hebraico pode referir-se a murmúrios, rumores ou palavras difamatórias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da aflição descrita no contexto e preserva naturalmente a função explicativa.
- source_word: שָׁמַעְתִּי
  choice: tenho ouvido
  rationale: O perfeito hebraico descreve uma percepção já ocorrida com efeito presente; o pretérito perfeito composto comunica aqui experiência reiterada ou persistente de modo natural em português.
- source_word: דִּבַּת
  choice: os cochichos
  rationale: O substantivo pode indicar rumor, murmuração ou fala difamatória. “Cochichos” combina com o ambiente de hostilidade secreta sem excluir a possibilidade de calúnia, registrada em nota.
- source_word: רַבִּים
  choice: de muitos
  rationale: Reproduz de modo conciso o adjetivo plural substantivado.
- source_word: מָגוֹר מִסָּבִיב
  choice: terror por todos os lados
  rationale: Expressa claramente a fórmula hebraica de pavor circundante e conserva sua intensidade.
- source_word: בְּהִוָּסְדָם
  choice: enquanto conspiram
  rationale: No contexto hostil, a forma indica reunião ou deliberação conjunta contra o salmista; “conspiram” torna explícito esse valor contextual sem acrescentar conteúdo estranho.
- source_word: יַחַד
  choice: juntos
  rationale: Preserva a ênfase na ação coordenada.
- source_word: עָלַי
  choice: contra mim
  rationale: O contexto confere à preposição sentido adversativo.
- source_word: לָקַחַת נַפְשִׁי
  choice: tirar-me a vida
  rationale: נֶפֶשׁ refere-se aqui à vida ou à pessoa do salmista, não necessariamente a uma alma imaterial; a expressão portuguesa comunica com clareza a ameaça de morte.
- source_word: זָמָמוּ
  choice: planejando
  rationale: Transmite a ideia de elaborar intencionalmente um plano hostil e se liga de forma natural à conspiração mencionada antes.
