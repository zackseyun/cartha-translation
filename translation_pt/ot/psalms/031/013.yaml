    issue: Aspecto verbal de «tenho ouvido»
    rationale: O perfeito hebraico שָׁמַעְתִּי relata o que o salmista ouviu; «tenho ouvido» tende a comunicar repetição ou continuidade em português. «Ouvi» preserva melhor a forma e a progressão do enunciado.
  - severity: low
    issue: Alternância para presentes em «conspiram» e «planejando»
    rationale: O hebraico enquadra a consulta/conspiração e o plano como ações dos adversários ligadas ao relato de «ouvi». Formas no imperfeito português dão uma apresentação contextual mais coerente sem alegar duração precisa.
