  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: pt
  text: Amem o SENHOR, todos os seus fiéis![a] O SENHOR protege os fiéis e retribui plenamente[b] a quem age com arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os seus santos», «todos os seus piedosos» ou «todos os que lhe são leais». O termo hebraico se refere aos que demonstram lealdade ao SENHOR na relação de aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou «retribui por completo» ou «retribui abundantemente».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Amem
  rationale: Imperativo qal masculino plural de אהב; expressa uma exortação direta e natural à comunidade.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino יהוה segundo a convenção portuguesa amplamente reconhecida, sem confundi-lo com o título hebraico comum para “senhor”.
- source_word: כָּל־חֲסִידָיו
  choice: todos vocês, seus fiéis
  rationale: חסידיו designa os que se caracterizam por lealdade e devoção na relação de aliança. A forma vocativa explicita naturalmente em português que eles são os destinatários da exortação.
- source_word: אֱמוּנִים
  choice: os fiéis
  rationale: Plural substantivado ligado à ideia de firmeza, confiabilidade e fidelidade; “os fiéis” preserva de modo conciso seu sentido moral e relacional.
- source_word: נֹצֵר
  choice: protege
  rationale: O particípio de נצר comunica guardar ou conservar com cuidado. “Protege” é corrente em português e se ajusta ao tema do cuidado divino no salmo.
- source_word: וּמְשַׁלֵּם עַל־יֶתֶר
  choice: mas retribui plenamente
  rationale: שלם no piel tem aqui sentido de dar a devida retribuição, enquanto על יתר intensifica essa retribuição. “Mas” torna clara a contraposição contextual entre a proteção dos fiéis e o juízo do arrogante.
- source_word: עֹשֵׂה גַאֲוָה
  choice: a quem age com orgulho
  rationale: A expressão é literalmente “quem pratica orgulho”; a formulação escolhida preserva a conduta ativa e arrogante em português idiomático.
theological_decisions:
- issue: Identidade pactual expressa por חֲסִידָיו
  choice: seus fiéis
  alternative: seus santos; seus piedosos; os que lhe são leais
  rationale: “Seus fiéis” comunica lealdade e devoção ao SENHOR sem importar automaticamente sentidos eclesiásticos posteriores associados a “santos”.
- issue: Contraste entre proteção e retribuição divina
  choice: O SENHOR protege os fiéis, mas retribui plenamente a quem age com orgulho
  alternative: O SENHOR guarda os fiéis e retribui abundantemente a quem age com arrogância
  rationale: A tradução mantém lado a lado o cuidado divino pelos fiéis e a retribuição divina contra o orgulho, sem suavizar nem ampliar indevidamente qualquer dos dois polos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo plural brasileiro (“amem”) e vocativo explicitado por “todos vocês”. “SENHOR” aparece em versaletes convencionais para representar o nome divino. As notas foram posicionadas junto aos termos que explicam.
