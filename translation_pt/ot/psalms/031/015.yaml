  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: pt
  text: Meus tempos estão em tua mão[a]; livra-me da mão dos meus inimigos e dos que me perseguem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «meus tempos determinados» ou «minhas circunstâncias». A expressão hebraica «meus tempos» pode referir-se amplamente às fases e aos acontecimentos da vida de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: em tua mão
  rationale: Preserva a metáfora hebraica de poder e domínio sem explicitá-la demais, além de manter o contraste poético com as mãos dos inimigos.
- source_word: עִתֹּתָי
  choice: meus tempos
  rationale: Mantém a amplitude poética do plural hebraico, que pode abranger as fases, ocasiões e circunstâncias da vida.
- source_word: הַצִּילֵנִי
  choice: livra-me
  rationale: Expressa de modo natural e digno o pedido de ser retirado de um perigo concreto, sem ampliar o sentido para uma salvação teológica mais geral.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Conserva a metáfora da mão como poder ou domínio e a correspondência deliberada com «em tua mão» no primeiro segmento.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Equivalente direto e corrente para os adversários hostis do salmista.
- source_word: וּמֵרֹדְפָי
  choice: e dos que me perseguem
  rationale: Representa claramente o particípio hebraico e preserva a imagem concreta de perseguição; soa mais natural em português atual do que «meus perseguidores».
theological_decisions:
- issue: Amplitude interpretativa de «meus tempos»
  choice: Referência ampla às fases, ocasiões e circunstâncias da vida do salmista sob o domínio de Deus
  alternative: «meu destino» ou apenas «meus tempos determinados»
  rationale: O hebraico é poeticamente abrangente. «Meus tempos» preserva a tensão sem restringi-la a momentos previamente marcados nem transformá-la em uma afirmação mais específica sobre destino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo entre estar na mão de Deus e ser livrado das mãos dos inimigos foi preservado; o segundo uso foi flexionado no plural por naturalidade em português.
