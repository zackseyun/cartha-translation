  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: pt
  text: Sejam fortes, e que o coração de vocês tenha coragem, todos vocês que esperam por Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “põem sua esperança em Yahweh”. O particípio hebraico pode expressar tanto espera quanto esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Sejam fortes
  rationale: O imperativo qal plural de חזק é uma exortação direta à força e à firmeza; “sejam fortes” preserva de modo claro e natural sua força imperativa.
- source_word: וְיַאֲמֵץ
  choice: e tenha coragem
  rationale: O imperfeito hifil, usado com valor exortativo após o imperativo, pede que o coração se fortaleça ou tome coragem. “Tenha coragem” evita repetição desnecessária e conserva o paralelismo sem apagar a sobreposição semântica.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: לֵבָב designa o coração como centro da vontade, da disposição e da coragem. A forma singular com sufixo plural é preservada naturalmente em português.
- source_word: כָּל
  choice: todos os que
  rationale: O quantificador abrange todo o grupo caracterizado pelo particípio seguinte.
- source_word: הַמְיַחֲלִים
  choice: esperam
  rationale: O particípio de יחל pode indicar esperar com expectativa e pôr a esperança em alguém. “Esperam” preserva a imagem verbal, enquanto a nota registra explicitamente a nuance de esperança.
- source_word: לַיהוָה
  choice: em Yahweh
  rationale: Com יחל, a preposição ל marca aquele em quem se concentra a espera esperançosa. Em português, “esperar em Yahweh” comunica confiança, e o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio da designação divina sem substituí-lo por um título.
- issue: Nuance de יחל
  choice: esperam em Yahweh
  alternative: põem sua esperança em Yahweh
  rationale: O verbo reúne as ideias de espera e esperança confiante. A tradução principal mantém a imagem de esperar, e a nota conserva a outra nuance legítima sem resolver indevidamente a polissemia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. A inversão moderada em “tenha coragem o coração de vocês” preserva o foco poético no coração sem recorrer a formas arcaicas.
