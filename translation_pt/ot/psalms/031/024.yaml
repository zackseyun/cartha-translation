    rationale: “E tenha coragem o coração de vocês” emprega uma inversão marcada que não é necessária para fidelidade ao hebraico. “E que o coração de vocês tenha coragem” é mais fluente e preserva o tom exortativo.
  - severity: low
    issue: Regência de “esperar”
    rationale: Com referência à pessoa em quem se deposita expectativa, “esperar por Yahweh” é mais idiomático no português moderno do que “esperar em Yahweh”; a nota mantém explicitamente a leitura de esperança confiante.
