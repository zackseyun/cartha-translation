  verdict: revise
  source_fidelity: A tradução preserva adequadamente a dupla exortação plural seguida da referência ao coração singular com possessivo plural, bem como o particípio de יחל e o nome divino Yahweh. A opção “esperam por Yahweh” expressa de modo mais idiomático em português a construção de espera dirigida a alguém, sem eliminar a nuance de esperança, mantida na nota.
  naturalness: A inversão em “tenha coragem o coração de vocês” é compreensível, mas soa artificial no português moderno. A construção coordenada “e que o coração de vocês tenha coragem” reproduz naturalmente o valor exortativo/jussivo do imperfeito hebraico.
  terminology: “Yahweh” corresponde diretamente a יהוה e é usado de modo consistente. “Coração” mantém a imagem antropológica e poética do hebraico. A nota lexical conserva corretamente a alternativa semântica de esperança.
  issues:
