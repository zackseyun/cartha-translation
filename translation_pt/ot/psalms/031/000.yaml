  text: Ao mestre de música. Salmo de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «por Davi» ou «para Davi»; a inscrição hebraica pode indicar autoria, associação ou dedicação.
