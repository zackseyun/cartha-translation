lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: O termo designa provavelmente o responsável pela execução musical. «Mestre de música» é claro, natural e suficientemente amplo; a preposição ל é representada por «Ao».
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e preciso para este gênero de cântico, normalmente associado a acompanhamento musical.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção pode indicar autoria, associação, pertença ou dedicação. «De Davi» conserva melhor essa amplitude do que uma formulação explicitamente autoral.
theological_decisions:
- issue: Nuance da inscrição davídica
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não determina de modo inequívoco a relação expressa pela preposição ל; a tradução mantém a ambiguidade genuína sem impor uma conclusão sobre autoria.
translation_notes:
  register: Português moderno, claro e digno. A formulação breve preserva o estilo de inscrição do salmo, e o marcador foi colocado junto a «Davi», expressão explicada pela nota.
