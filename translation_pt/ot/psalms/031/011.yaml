base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: pt
  text: Por causa de todos os meus inimigos, tornei-me motivo de vergonha[a], sobretudo para os meus vizinhos, e motivo de pavor para os meus conhecidos; os que me veem na rua fogem de mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Da parte de todos os meus inimigos, tornei-me motivo de vergonha”; alguns entendem a frase inicial em sentido comparativo: “Mais do que todos os meus inimigos”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “afastam-se de mim”. O verbo hebraico também pode significar vaguear ou fugir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Por causa de todos os meus inimigos
  rationale: O hebraico pode indicar causa ou procedência e, menos provavelmente, comparação. No contexto, a causa da desonra é o sentido mais natural em português.
- source_word: הָיִיתִי חֶרְפָּה
  choice: tornei-me motivo de vergonha
  rationale: A construção com היה descreve a entrada num estado que ainda perdura. חֶרְפָּה é vergonha, afronta ou objeto de desprezo; 'motivo de vergonha' expressa naturalmente que o salmista passou a ser alvo de desonra.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: sobretudo para os meus vizinhos
  rationale: מְאֹד intensifica a condição do salmista em relação aos vizinhos. 'Sobretudo' comunica essa ênfase de modo claro e idiomático.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: e motivo de pavor para os meus conhecidos
  rationale: פַּחַד denota medo intenso ou pavor, e מְיֻדָּעַי se refere a conhecidos ou pessoas familiarizadas com ele, sem implicar necessariamente amizade íntima.
- source_word: רֹאַי בַּחוּץ
  choice: os que me veem na rua
  rationale: בַּחוּץ significa literalmente 'fora', mas aqui indica o espaço público. 'Na rua' transmite esse cenário social de maneira natural.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: fogem de mim
  rationale: נָדַד pode significar fugir, afastar-se ou vaguear. Neste contexto de repulsa e evasão pública, 'fogem de mim' comunica bem a reação, enquanto a nota registra a alternativa menos intensa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a progressão entre vergonha social, pavor entre conhecidos e evasão em público. A informação de que בַּחוּץ significa literalmente 'fora' foi incorporada idiomaticamente como 'na rua', sem exigir nota separada.
