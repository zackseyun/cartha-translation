source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: pt
  text: 'Pois minha vida se consome em tristeza,

    e meus anos, em gemidos;

    minha força vacila[b] por causa da minha iniquidade[a],

    e meus ossos definham.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da minha culpa”; a palavra hebraica pode indicar iniquidade, culpa ou a consequência da culpa.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa literalmente “tropeçar” ou “cambalear” e aqui descreve, por metáfora, a perda de força.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal da lamentação anterior e funciona naturalmente no discurso poético em português.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: minha vida se consome em tristeza
  rationale: כָלוּ expressa esgotamento ou consumo; o presente reflexivo comunica em português o processo vivido e seu efeito atual. יָגוֹן designa tristeza, pesar ou aflição.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: e meus anos, em gemidos
  rationale: Mantém o paralelismo conciso do hebraico. אֲנָחָה pode indicar suspiro ou gemido; “gemidos” comunica de modo natural uma lamentação profunda.
- source_word: כָּשַׁל ... כֹחִי
  choice: minha força vacila
  rationale: כָּשַׁל significa tropeçar, cambalear ou falhar. “Vacila” preserva a imagem de instabilidade sem produzir uma combinação pouco natural em português.
- source_word: בַּעֲוֺנִי
  choice: por causa da minha iniquidade
  rationale: A preposição é entendida causalmente no contexto. עָוֹן pode designar a transgressão, a culpa decorrente dela ou sua consequência; a alternativa é registrada em nota.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: e meus ossos definham
  rationale: Preserva a imagem corporal concreta. עָשֵׁשׁוּ comunica enfraquecimento, desgaste ou deterioração; “definham” é conciso e poético.
theological_decisions:
- issue: Sentido de עָוֹן na descrição que o salmista faz de si mesmo
  choice: iniquidade
  alternative: culpa ou consequência da culpa
  rationale: “Iniquidade” preserva a dimensão moral sem definir se o salmista enfatiza o ato, a culpa resultante ou suas consequências. A nota mantém aberta a amplitude semântica do hebraico.
- issue: Relação causal entre a iniquidade e a perda de força
  choice: por causa da minha iniquidade
  alternative: em minha iniquidade / por causa da minha culpa
  rationale: A leitura causal é adequada ao contexto, mas não acrescenta uma teoria específica de punição divina nem resolve além do texto a natureza exata dessa relação.
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura poética em quatro linhas. A elipse em “e meus anos, em gemidos” reproduz o paralelismo sem soar artificial. “Vacila” conserva a imagem hebraica, enquanto as notas preservam as ambiguidades lexical e teológica.
