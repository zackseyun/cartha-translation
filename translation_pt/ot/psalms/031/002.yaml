  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: pt
  text: Inclina para mim o teu ouvido; livra-me depressa. Sê para mim uma rocha de refúgio[a], uma casa fortificada[b] para me salvar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma rocha forte”. A expressão hebraica combina “rocha” com um termo que indica proteção segura ou fortaleza.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma fortaleza” ou “uma casa de fortalezas”. O hebraico conserva a imagem de uma casa e, ao mesmo tempo, a descreve como fortemente protegida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Inclina para mim o teu ouvido
  rationale: Conserva a metáfora hebraica de curvar o ouvido para escutar atentamente, em linguagem clara e digna.
- source_word: מְהֵרָה
  choice: depressa
  rationale: Expressa de modo natural a urgência do advérbio hebraico.
- source_word: הַצִּילֵנִי
  choice: livra-me
  rationale: Comunica a retirada de um perigo imediato e permite distinguir este verbo do posterior ישׁע, traduzido por 'salvar'.
- source_word: הֱיֵה לִי
  choice: Sê para mim
  rationale: Mantém o imperativo simples e a força relacional da construção hebraica.
- source_word: לְצוּר מָעוֹז
  choice: uma rocha de refúgio
  rationale: Preserva צוּר, 'rocha', e representa מָעוֹז como proteção ou lugar seguro, sem apagar a imagem poética.
- source_word: לְבֵית מְצוּדוֹת
  choice: uma casa fortificada
  rationale: Retém a imagem concreta de בַּיִת, 'casa', enquanto traduz o plural מְצוּדוֹת por sua função defensiva.
- source_word: לְהוֹשִׁיעֵנִי
  choice: para me salvar
  rationale: Representa diretamente o infinitivo de propósito de ישׁע e o distingue do pedido anterior por livramento.
