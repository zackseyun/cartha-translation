  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: pt
  text: Bendito seja Yahweh, pois ele me mostrou de modo maravilhoso o seu amor leal numa cidade sitiada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa cidade fortificada”; a expressão hebraica pode indicar tanto uma cidade sob cerco como uma cidade fortificada.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo funciona como exclamação doxológica; esta formulação conserva a força de bênção dirigida a Deus e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, preservando sua referência pactual.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do louvor com concisão e em registro doxológico natural.
- source_word: הִפְלִיא
  choice: manifestou de modo maravilhoso
  rationale: O hifil de פלא comunica uma ação extraordinária ou maravilhosa; com חַסְדּוֹ como objeto, a expressão indica uma manifestação extraordinária do amor de Deus.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חסד reúne as ideias de amor, lealdade e fidelidade relacional; “amor leal” é claro e evita restringir o termo apenas a misericórdia.
- source_word: לִי
  choice: por mim
  rationale: Identifica o salmista como beneficiário da manifestação do amor; “por mim” é idiomático com o verbo escolhido.
- source_word: בְּעִיר מָצוֹר
  choice: numa cidade sitiada
  rationale: מָצוֹר pode designar cerco ou lugar fortificado. “Cidade sitiada” se ajusta ao contexto de perigo e livramento, enquanto a alternativa lexical é preservada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração mantém o nome pactual sem substituí-lo por um título.
- issue: Sentido de בְּעִיר מָצוֹר
  choice: numa cidade sitiada
  alternative: numa cidade fortificada
  rationale: A expressão hebraica é genuinamente ambígua. O texto principal adota o sentido contextual de cerco e perigo, e a nota mantém transparente a outra possibilidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Bendito seja” preserva o tom de louvor; “manifestou de modo maravilhoso” evita arcaísmo; a ambiguidade da frase final é explicitada em nota.
