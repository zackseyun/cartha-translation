  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: pt
  text: e não me entregaste nas mãos do inimigo[a]; firmaste os meus pés num lugar espaçoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me entregaste ao poder do inimigo”.'
    reason: lexical_alternative
  - marker: b
    text: O “lugar espaçoso” evoca liberdade, segurança e alívio do confinamento ou da angústia.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: não me entregaste
  rationale: O hifil de סגר, neste contexto, indica entregar alguém ao domínio de outro. “Não me entregaste” é natural em português e expressa a ideia de ser deixado sob controle hostil.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: A expressão hebraica denota estar sob o poder ou controle de alguém. O plural idiomático “nas mãos de” preserva a imagem concreta e soa natural em português.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: Embora o substantivo hebraico esteja no singular e sem artigo, aqui designa de modo genérico o adversário hostil; “do inimigo” é claro e adequado ao registro dos Salmos.
- source_word: הֶעֱמַדְתָּ
  choice: firmaste
  rationale: O hifil de עמד significa fazer ficar de pé ou colocar em posição segura. “Firmaste” comunica estabilidade e ação deliberada, além de combinar naturalmente com “os meus pés”.
- source_word: בַמֶּרְחָב
  choice: num lugar espaçoso
  rationale: מֶרְחָב evoca amplitude e abertura em contraste com confinamento ou angústia. “Lugar espaçoso” preserva a metáfora com linguagem corrente e poética.
- source_word: רַגְלָי
  choice: os meus pés
  rationale: Mantém o plural do hebraico e a imagem corporal de estabilidade e liberdade de movimento.
- source_word: וְלֹא
  choice: e não
  rationale: A conjunção liga esta afirmação ao contexto anterior sem exigir que se explicite uma oposição mais forte.
