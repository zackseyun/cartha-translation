  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: pt
  text: Mostra-me favor, ó Yahweh, pois estou em angústia. Meu olho se definha de pesar[a] — minha alma[b] e meu ventre[c] também.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu olho perde o brilho de aflição” ou “meu olho desfalece de tristeza”.'
    reason: lexical_alternative
  - marker: b
    text: “Minha alma” também pode ser traduzido por “minha vida” ou “todo o meu ser”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “meu ventre”; o termo também pode referir-se, de modo mais amplo, às partes interiores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sê bondoso comigo
  rationale: O imperativo de חנן pede favor ou graça. A formulação preserva esse apelo sem convertê-lo diretamente em um pedido genérico de misericórdia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי צַר לִי
  choice: pois estou angustiado
  rationale: כִּי introduz a razão do pedido, e צַר לִי expressa aflição ou angústia pessoal de modo idiomático.
- source_word: עָשְׁשָׁה
  choice: se definha
  rationale: O verbo comunica enfraquecimento, desgaste ou perda de vigor; “se definha” preserva a intensidade poética.
- source_word: בְכַעַס
  choice: de pesar
  rationale: כעס pode indicar irritação, aflição, tristeza ou pesar. No contexto do lamento, “pesar” comunica a dor interior sem eliminar as alternativas lexicais.
- source_word: עֵינִי
  choice: meu olho
  rationale: Mantém o singular do hebraico e a imagem corporal concreta do poema.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נפש pode significar alma, vida ou o próprio ser. “Minha alma” conserva a amplitude antropológica e poética, com as demais possibilidades registradas em nota.
- source_word: וּבִטְנִי
  choice: e meu ventre também
  rationale: בטן designa literalmente o ventre e pode estender-se às partes interiores. A tradução mantém a imagem concreta e explicita naturalmente a coordenação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva-o como nome, sem substituí-lo por um título.
- issue: Sentido antropológico de נַפְשִׁי
  choice: minha alma
  alternative: minha vida; todo o meu ser
  rationale: O termo aparece poeticamente ao lado do olho e do ventre. “Alma” conserva sua amplitude sem determinar se a referência é exclusivamente à vida, ao eu ou a uma parte imaterial da pessoa.
translation_notes:
  register: Português atual, digno e acessível, com estrutura poética concisa. Conserva o singular “meu olho”, o nome divino “Yahweh” e as imagens corporais do hebraico; as ambiguidades de כעס, נפש e בטן são preservadas por notas.
