  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: pt
  text: Faz brilhar o teu rosto sobre o teu servo; salva-me por teu amor leal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em teu amor leal” ou “segundo o teu amor leal”. A preposição hebraica pode ter aqui mais de um sentido estreitamente relacionado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Faz brilhar
  rationale: O hifil imperativo de אור tem sentido causativo. “Faz brilhar” preserva tanto a força do pedido quanto a imagem concreta e soa natural em português.
- source_word: פָנֶיךָ
  choice: o teu rosto
  rationale: Mantém a imagem hebraica concreta do rosto divino, que neste contexto comunica favor e acolhimento, sem reduzi-la a uma formulação abstrata como “presença”.
- source_word: עַל
  choice: sobre
  rationale: Expressa a direção do favor divino para o servo e corresponde de modo natural à imagem de fazer o rosto brilhar sobre alguém.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: No contexto de oração dirigida a Deus, “servo” representa adequadamente a relação de submissão e pertença, sem introduzir conotações de escravidão que não estão em primeiro plano.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: Reproduz o imperativo com sufixo de primeira pessoa e conserva tanto o pedido imediato de livramento quanto a amplitude teológica do verbo ישׁע.
- source_word: בְחַסְדֶּךָ
  choice: por teu amor leal
  rationale: “Amor leal” comunica a constância e a fidelidade relacional de חסד em linguagem clara. A preposição בְּ foi entendida instrumentalmente como “por”, uma leitura natural, embora outras relações semânticas próximas sejam possíveis.
theological_decisions:
- issue: Tradução de חסד
  choice: amor leal
  alternative: misericórdia; amor constante; bondade fiel
  rationale: “Amor leal” preserva a ideia de amor marcado por fidelidade e compromisso, sem limitar o termo à compaixão nem importar uma formulação confessional específica.
- issue: Valor da preposição בְּ em בְחַסְדֶּךָ
  choice: por teu amor leal
  alternative: em teu amor leal; segundo o teu amor leal
  rationale: A leitura instrumental apresenta o amor leal de Deus como fundamento ou meio do salvamento pedido. Como o hebraico também permite nuances de esfera ou conformidade, a ambiguidade legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa singular coerentes (“teu”, “salva-me”). A imagem tradicional do rosto que brilha foi preservada. O marcador de nota aparece após a expressão a que se refere.
