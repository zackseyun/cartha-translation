source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: pt
  text: 'Tu os escondes no abrigo da tua presença,

    longe das tramas do homem[a];

    tu os ocultas em um refúgio,

    longe da contenda das línguas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das conspirações do homem” ou “dos planos do homem”. O termo hebraico é raro e pode indicar associações hostis ou maquinações.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da contenda das línguas”, isto é, da fala hostil ou difamatória.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: Tu os escondes
  rationale: O hifil de סתר expressa a ação de fazer alguém ficar escondido ou protegido. “Escondes” é direto, natural e mantém Deus como agente da proteção.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: no abrigo da tua presença
  rationale: סֵתֶר pode designar esconderijo, lugar secreto ou abrigo; פָּנִים significa literalmente “face”, mas aqui comunica a presença pessoal de Deus. A formulação preserva tanto a proximidade quanto a proteção.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: longe das tramas do homem
  rationale: רֻכְסֵי é um termo raro e difícil, provavelmente relacionado a combinações hostis, conspirações ou maquinações. “Tramas” comunica essa hostilidade sem eliminar a incerteza, registrada em nota.
- source_word: תִּצְפְּנֵם
  choice: tu os ocultas
  rationale: צפן pode significar esconder, guardar ou reservar. “Ocultas” mantém o sentido protetor e evita repetir exatamente o verbo do primeiro verso poético.
- source_word: בְּסֻכָּה
  choice: em um refúgio
  rationale: סֻכָּה designa literalmente uma cabana ou abrigo. Neste contexto, sua função protetora é central; “refúgio” torna essa função clara em português corrente.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: longe da contenda das línguas
  rationale: רִיב indica contenda, disputa ou conflito, e לְשֹׁנוֹת, “línguas”, representa fala hostil ou difamatória. A tradução conserva a imagem poética hebraica.
theological_decisions:
- issue: Valor representativo de אִישׁ
  choice: do homem
  alternative: dos homens; das pessoas
  rationale: O substantivo hebraico está no singular masculino e funciona de modo representativo. “Do homem” preserva essa forma e não restringe o referente a um indivíduo específico.
- issue: Sentido de פָּנֶיךָ
  choice: tua presença
  alternative: tua face
  rationale: Embora o termo signifique literalmente “tua face”, neste contexto a expressão indica a presença protetora de Deus. “Presença” comunica a extensão idiomática sem apagar a ideia relacional.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a oração dirigida a Deus. O paralelismo poético foi preservado em quatro linhas. Mantiveram-se as imagens de abrigo, ocultação e línguas, com notas apenas onde a dificuldade lexical ou o valor idiomático exigem esclarecimento.
