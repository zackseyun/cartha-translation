source:
  edition: WLC
  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: pt
  text: Os mortos não louvam a Yah, nem nenhum dos que descem ao silêncio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Silêncio” é uma expressão poética para o estado ou domínio da morte; alguns a entendem mais especificamente como “a sepultura” ou “o Sheol”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: Os mortos
  rationale: A forma substantivada refere-se genericamente às pessoas mortas; “os mortos” é natural, clara e digna em português.
- source_word: יְהַלְלוּ
  choice: não louvam
  rationale: O piel de הלל significa normalmente “louvar”, especialmente em contexto de culto, e mantém a ligação verbal com a linguagem de “aleluia”.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma abreviada do nome divino, distinta do tetragrama completo; a transliteração preserva essa particularidade poética.
- source_word: כָּל
  choice: nenhum dos
  rationale: Sob a negação coordenada, כָּל tem sentido distributivo; “nem nenhum dos” expressa isso naturalmente, sem transformar o termo em uma afirmação coletiva positiva.
- source_word: יֹרְדֵי
  choice: os que descem
  rationale: O particípio caracteriza aqueles que descem; a construção portuguesa preserva o caráter geral e contínuo da expressão.
- source_word: דוּמָה
  choice: silêncio
  rationale: Mantém a imagem poética hebraica sem identificá-la de modo definitivo com a sepultura ou o Sheol.
theological_decisions:
- issue: Se o versículo deve ser apresentado como negação doutrinária de todo louvor após a morte ou como linguagem poética sobre o silêncio da morte
  choice: 'Preservar a afirmação poética: “Os mortos não louvam a Yah, nem nenhum dos que descem ao silêncio.”'
  alternative: Explicitar no texto “os mortos na sepultura” ou identificar “silêncio” diretamente com o Sheol.
  rationale: O salmo contrapõe os adoradores vivos aos mortos mediante linguagem poética convencional. A tradução conserva a tensão sem decidir debates mais amplos sobre o estado intermediário.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. “Yah” preserva a forma abreviada do nome divino, e “ao silêncio” conserva a imagem concisa do hebraico.
