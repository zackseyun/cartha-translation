  text: Os ídolos deles são prata e ouro, obra de mãos humanas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: Os ídolos deles
  rationale: Neste contexto polêmico, o substantivo עָצָב se refere a ídolos ou imagens cultuais; “ídolos” explicita corretamente o referente e mantém o contraste com o Deus vivo.
- source_word: כֶּסֶף וְזָהָב
  choice: prata e ouro
  rationale: Tradução direta dos materiais de que os ídolos são feitos, preservando a coordenação simples do hebraico.
- source_word: מַעֲשֵׂה
  choice: obra de
  rationale: Mantém a força nominal de “obra, produto” e soa natural em português neste enunciado poético.
- source_word: יְדֵי אָדָם
  choice: mãos humanas
  rationale: Expressa de modo idiomático o sentido genérico de אָדָם e preserva a imagem concreta das mãos, bem como o contraste entre o divino e aquilo que seres humanos fabricam.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: mãos humanas
  alternative: mãos do homem
  rationale: אָדָם é genérico neste contexto, não uma referência a um indivíduo masculino. “Mãos humanas” comunica com clareza que os ídolos são produtos de seres humanos, sem alterar o contraste teológico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação concisa e paralela ao hebraico. A construção “obra de mãos humanas” conserva a concretude e o tom poético do original.
