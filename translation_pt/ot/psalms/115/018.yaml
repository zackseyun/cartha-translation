  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: pt
  text: Mas nós bendiremos a Yah, desde agora e para sempre. Louvem a Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica הַלְלוּ־יָהּ significa “Louvem a Yah!” e é a origem da forma litúrgica transliterada “Aleluia”. “Yah” é a forma poética abreviada do nome divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mas nós
  rationale: A conjunção com o pronome independente cria contraste com os mortos do versículo anterior; “Mas nós” preserva esse valor adversativo e o sujeito explícito.
- source_word: נְבָרֵךְ
  choice: bendiremos
  rationale: O piel imperfeito na primeira pessoa do plural expressa a decisão contínua e futura da comunidade viva de bendizer a Yah.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma poética abreviada do nome divino, distinta do tetragrama completo; a transliteração preserva essa particularidade do hebraico.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Expressa o momento presente como ponto inicial e é uma formulação natural no português contemporâneo.
- source_word: וְעַד עוֹלָם
  choice: e para sempre
  rationale: O idiomatismo indica duração sem fim; esta formulação comunica claramente seu alcance temporal.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz de modo transparente o imperativo plural seguido da forma breve do nome divino, mantendo a força litúrgica da aclamação.
theological_decisions:
- issue: Forma poética abreviada do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: O texto emprega duas vezes יָהּ, não o tetragrama completo יְהוָה. “Yah” preserva a distinção presente na fonte e esclarece a composição da aclamação tradicional “Aleluia”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Bendiremos” mantém o verbo tradicionalmente associado a Deus, enquanto “Louvem” traduz diretamente a aclamação final. A pontuação segue o fluxo natural do português.
