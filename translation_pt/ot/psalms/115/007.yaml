  - marker: b
    text: 'Ou: “não murmuram”; o verbo hebraico pode indicar uma emissão baixa de voz ou um murmúrio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: Têm mãos
  rationale: A expressão nominal hebraica significa literalmente “suas mãos”; em português, “têm mãos” explicita naturalmente a construção implícita e preserva o paralelismo com os pés.
- source_word: יְמִישׁוּן
  choice: não apalpam
  rationale: O verbo no hifil de מושׁ indica tatear, apalpar ou tocar com as mãos. “Não apalpam” mantém a ação concreta ligada às mãos e evita confundi-la com a capacidade emocional de sentir.
- source_word: רַגְלֵיהֶם
  choice: têm pés
  rationale: Embora o hebraico diga literalmente “seus pés”, a repetição de “têm” produz em português um paralelismo claro e natural.
- source_word: יְהַלֵּכוּ
  choice: não andam
  rationale: Representa diretamente a negação hebraica e, no contexto da sátira contra os ídolos, comunica sua incapacidade sem precisar convertê-la explicitamente em “não podem andar”.
- source_word: יֶהְגּוּ
  choice: não emitem som algum
  rationale: הגה pode indicar murmurar, proferir em voz baixa ou produzir um som. A formulação escolhida preserva aqui o sentido amplo de vocalização sem restringi-lo à fala articulada.
- source_word: בִּגְרוֹנָם
  choice: com a garganta
  rationale: A preposição ב pode ser instrumental neste contexto. “Com a garganta” é natural em português e conserva a imagem corporal do hebraico.
theological_decisions:
- issue: Natureza da incapacidade dos ídolos
  choice: Manter as negações formais — “não apalpam”, “não andam”, “não emitem” — deixando que o contexto expresse a incapacidade.
  alternative: 'Explicitar a incapacidade: “não podem apalpar”, “não podem andar”.'
  rationale: O hebraico emprega verbos negados, enquanto o contexto evidencia que os ídolos são impotentes. A tradução formal conserva essa tensão sem reduzir a sátira a mera inatividade.
- issue: Amplitude de יֶהְגּוּ
  choice: “não emitem som algum”
  alternative: “não murmuram” ou “não falam”
  rationale: O verbo admite uma vocalização baixa ou indistinta. A opção ampla evita afirmar especificamente fala articulada ou murmuração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado, e as notas registram alternativas lexicais reais sem impor uma interpretação denominacional.
