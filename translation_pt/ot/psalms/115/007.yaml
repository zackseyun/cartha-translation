  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: pt
  text: Têm mãos[a], mas não apalpam; têm pés, mas não andam; não emitem som algum pela garganta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Têm mãos, mas não tocam”.'
