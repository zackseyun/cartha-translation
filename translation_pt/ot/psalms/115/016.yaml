  text: הַ/שָּׁמַ֣יִם שָׁ֭מַיִם לַ/יהוָ֑ה וְ֝/הָ/אָ֗רֶץ נָתַ֥ן לִ/בְנֵי אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
translation:
  language: pt
  text: Os céus são os céus de Yahweh, mas a terra ele deu aos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do ser humano”; expressão hebraica que significa a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם שָׁמַיִם
  choice: Os céus são os céus
  rationale: Preserva a repetição enfática do hebraico e sua estrutura de tópico e comentário, numa formulação compreensível em português.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: A preposição ל indica posse ou pertencimento neste contexto; “de Yahweh” expressa isso naturalmente e mantém o nome divino.
- source_word: וְהָאָרֶץ
  choice: mas a terra
  rationale: Embora ו possa significar “e”, o paralelismo é contrastivo; “mas” torna explícito esse contraste sem alterar o sentido.
- source_word: נָתַן
  choice: ele deu
  rationale: O perfeito hebraico apresenta a ação como completa. O pronome retoma Yahweh, sujeito entendido pelo contexto.
- source_word: לִבְנֵי אָדָם
  choice: aos seres humanos
  rationale: A expressão idiomática hebraica, literalmente “aos filhos de Adão/do ser humano”, designa coletivamente a humanidade; a tradução comunica esse sentido genérico com naturalidade e precisão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o tetragrama; “Yahweh” preserva o nome próprio divino em vez de substituí-lo por um título.
- issue: Sentido de בְנֵי אָדָם
  choice: seres humanos
  alternative: filhos do homem
  rationale: A expressão é genericamente inclusiva e se refere à humanidade, não apenas a descendentes masculinos. A alternativa literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição poética de “céus” foi mantida para refletir a ênfase do hebraico; “seres humanos” evita que uma expressão idiomática coletiva seja entendida como referência exclusiva a homens.
