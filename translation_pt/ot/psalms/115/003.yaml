  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: pt
  text: Mas o nosso Deus está nos céus; ele faz tudo o que deseja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Mas o nosso Deus
  rationale: Em seu contexto, a conjunção ו tem força adversativa, contrapondo o Deus vivo aos ídolos; “Mas” expressa naturalmente esse contraste. אֱלֹהֵינוּ significa “nosso Deus”.
- source_word: בַשָּׁמַיִם
  choice: está nos céus
  rationale: Preserva a forma plural do hebraico שָׁמַיִם e mantém um registro elevado, mas corrente, em português.
- source_word: כֹּל אֲשֶׁר
  choice: tudo o que
  rationale: Expressa de modo natural a abrangência total da construção hebraica, sem perder sua precisão.
- source_word: חָפֵץ
  choice: deseja
  rationale: חפץ pode indicar desejar, ter prazer ou querer. “Deseja” é claro e corrente, preserva a dimensão volitiva e evita transformar o termo em uma categoria teológica técnica.
- source_word: עָשָׂה
  choice: faz
  rationale: Embora seja formalmente qatal, aqui o verbo enuncia uma verdade geral sobre a ação eficaz de Deus; o presente “faz” comunica adequadamente essa força gnômica.
theological_decisions:
- issue: Formulação da soberania divina
  choice: ele faz tudo o que deseja
  alternative: ele faz tudo o que quer
  rationale: A formulação afirma a liberdade e a eficácia de Deus em contraste com os ídolos impotentes, sem impor ao texto um sistema doutrinário mais estreito. “Deseja” conserva a amplitude lexical de חפץ.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A ordem e o paralelismo do hebraico são preservados sem produzir uma frase artificial.
