  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: pt
  text: Yahweh se lembrou de nós[a]; ele abençoará; abençoará a casa de Israel; abençoará a casa de Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tem tido consideração por nós”.'
    reason: Registra o sentido contextual possível de זכר como manter alguém em mente ou demonstrar consideração, sem substituir a tradução mais direta no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: זְכָרָנוּ
  choice: se lembrou de nós
  rationale: Traduz diretamente o qal perfeito com sufixo de primeira pessoa do plural. Em português, o pretérito perfeito expressa com naturalidade a ação concluída que fundamenta a confiança na bênção vindoura.
- source_word: יְבָרֵךְ
  choice: abençoará
  rationale: O imperfeito é entendido em sentido futuro e confiante no contexto. A repetição hebraica é preservada para manter a ênfase poética.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a imagem coletiva e familiar de בֵּית, bem como o paralelismo estrutural do verso.
- source_word: בֵּית אַהֲרֹן
  choice: a casa de Arão
  rationale: Preserva explicitamente a designação da linhagem sacerdotal e o paralelismo com “a casa de Israel”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A forma escolhida preserva o nome da aliança presente no texto hebraico, sem trocá-lo por um título. “Javé” é uma adaptação portuguesa possível, mas “Yahweh” mantém transparência direta com a forma internacional adotada pelo projeto.
- issue: Valor modal ou temporal de יְבָרֵךְ
  choice: 'futuro declarativo: “abençoará”'
  alternative: 'jussivo ou desejo: “que ele abençoe”'
  rationale: A sequência iniciada pelo perfeito “se lembrou” favorece uma declaração confiante sobre a bênção futura. A tradução não transforma a frase em oração ou pedido.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe simples. A repetição de “abençoará” e as expressões “casa de Israel” e “casa de Arão” foram mantidas por seu valor poético, coletivo e litúrgico.
