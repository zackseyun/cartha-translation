id: PSA.115.1
reference: Psalms 115:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: pt
  text: Não a nós, Yahweh, não a nós, mas ao teu nome dá glória, por causa do teu amor leal, por causa da tua fidelidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa do teu amor leal, por causa da tua verdade”.
    reason: Alternativa lexical para אֲמִתֶּךָ, que pode significar tanto “fidelidade” quanto “verdade” neste contexto.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, preservando sua identidade como nome da aliança.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Não a nós ... não a nós
  rationale: Mantém a negação enfática e a repetição poética do hebraico, negando que a glória deva ser atribuída aos que falam.
- source_word: תֵּן כָּבוֹד
  choice: dá glória
  rationale: Reproduz diretamente a expressão hebraica e funciona naturalmente como pedido para que a glória seja atribuída a Deus.
- source_word: לְשִׁמְךָ
  choice: ao teu nome
  rationale: Preserva a imagem concreta de “nome”, que também abrange a reputação e o caráter revelado de Deus.
- source_word: כִּי
  choice: mas
  rationale: Após a dupla negação, introduz em português a virada contrastiva para aquele a quem a glória deve ser dada.
- source_word: עַל
  choice: por causa de
  rationale: Expressa a base ou razão do pedido apresentado nas duas frases paralelas.
- source_word: חַסְדְּךָ
  choice: teu amor leal
  rationale: Comunica tanto o amor quanto a constância e lealdade associadas a חֶסֶד, sem recorrer a linguagem arcaica.
- source_word: אֲמִתֶּךָ
  choice: tua fidelidade
  rationale: No paralelismo com חֶסֶד, destaca a confiabilidade constante de Deus; a possibilidade lexical “verdade” é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de אֲמִתֶּךָ em paralelo com חַסְדְּךָ
  choice: fidelidade
  alternative: verdade
  rationale: Nesse par poético, o termo pode ressaltar a confiabilidade de Deus, mas “verdade” continua sendo uma possibilidade lexical genuína e por isso aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular para conservar a fala direta e solene dirigida a Deus. A repetição e a ordem poética foram mantidas sempre que naturais em português.
