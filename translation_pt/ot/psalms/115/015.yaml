  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: pt
  text: Que vocês sejam abençoados por Yahweh[a], o Criador do céu e da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Abençoados vocês de Yahweh». A expressão também pode ser entendida como uma declaração: «Vocês são abençoados por Yahweh».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os céus e a terra».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: Que vocês sejam abençoados
  rationale: O particípio passivo com o pronome plural forma, neste contexto, uma fórmula de bênção. A construção com «que» comunica naturalmente em português sua força de bênção ou desejo, sem transformar a frase em voz ativa.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição ל, nesta fórmula passiva, indica a fonte ou o agente da bênção. «Por Yahweh» preserva essa relação e mantém no texto o nome divino expresso no hebraico.
- source_word: עֹשֵׂה
  choice: o Criador de
  rationale: O particípio qal de עשה é usado substantivamente como título divino. «O Criador» é uma formulação portuguesa concisa, natural e digna.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: o céu e a terra
  rationale: A expressão constitui um merismo para a totalidade da criação. O singular «céu» é idiomático em português, embora o substantivo hebraico tenha forma plural.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Valor da fórmula בְּרוּכִים אַתֶּם לַיהוָה
  choice: Que vocês sejam abençoados por Yahweh
  alternative: Vocês são abençoados por Yahweh; Abençoados sejam vocês por Yahweh
  rationale: A formulação escolhida expressa a força beneditória sugerida pelo contexto, mantendo a voz passiva. A ambiguidade entre declaração e desejo é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para explicitar o plural de אַתֶּם. A formulação preserva a voz passiva e o caráter de bênção da frase hebraica.
