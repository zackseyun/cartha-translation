  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: pt
  text: Israel, confie em Yahweh; ele é o auxílio e o escudo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio que designa coletivamente o povo da aliança; preservado em sua forma portuguesa consagrada.
- source_word: בְּטַח
  choice: confie
  rationale: Imperativo masculino singular de בטח, concordando com Israel como entidade coletiva. Em português, o singular mantém essa forma e soa natural.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב marca o objeto da confiança, e o nome divino יהוה é transliterado como Yahweh.
- source_word: עֶזְרָם
  choice: o auxílio deles
  rationale: O substantivo עֵזֶר com sufixo de terceira pessoa masculina plural significa literalmente 'auxílio deles'. A formulação preserva o substantivo e a mudança hebraica do tratamento coletivo singular para a referência plural.
- source_word: וּמָגִנָּם
  choice: e o escudo deles
  rationale: מָגֵן é a imagem concreta de um escudo; ela é mantida, em vez de ser explicada como 'protetor'.
- source_word: הוּא
  choice: ele é
  rationale: O pronome independente enfatiza Yahweh como o auxílio e o escudo de Israel; a cópula é expressa naturalmente em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome divino pessoal sem substituí-lo por um título.
- issue: Mudança do singular coletivo para o plural pronominal
  choice: Israel, confie ... auxílio e escudo deles
  alternative: Israel, confie ... seu auxílio e seu escudo
  rationale: O hebraico dirige o imperativo singular a Israel como corpo coletivo, mas usa sufixos plurais em 'auxílio deles' e 'escudo deles'. A tradução conserva essa alternância significativa, embora menos idiomática do que uniformizar os pronomes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se o imperativo singular dirigido a Israel coletivamente e a metáfora concreta do escudo. A repetição de 'deles' evita a ambiguidade de 'seu' e reproduz a mudança de número do hebraico.
