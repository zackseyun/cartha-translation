  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: pt
  text: 'Por que as nações haveriam de dizer[a]: “Onde está agora o Deus deles?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que as nações dizem: ‘Onde está agora o Deus deles?’”'
    reason: Alternativa lexical e aspectual que representa o imperfeito hebraico como presente simples, podendo sugerir uma provocação recorrente ou em curso.
lexical_decisions:
- source_word: לָמָּה
  choice: Por que ... haveriam de
  rationale: Introduz uma pergunta retórica. Em combinação com o imperfeito יֹאמְרוּ, essa formulação expressa objeção à provocação das nações sem transformar a frase em simples previsão.
- source_word: יֹאמְרוּ
  choice: dizer
  rationale: O qal imperfeito, 3ª pessoa masculina plural de אמר, pode apresentar uma fala possível ou recorrente; a construção com “haveriam de” comunica naturalmente essa força em português.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Tradução direta e corrente de גּוֹיִם, aqui referente aos povos estrangeiros, sem as possíveis conotações posteriores de “gentios”.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Interrogativo de lugar; o verbo de ligação é naturalmente explicitado em português.
- source_word: נָא
  choice: agora
  rationale: Neste contexto, a partícula acrescenta imediatismo ou ênfase à provocação, e não cortesia.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Embora אֱלֹהִים tenha forma plural, aqui designa em sentido singular o Deus de Israel, referido pelas nações.
theological_decisions:
- issue: Referência de אֱלֹהֵיהֶם
  choice: o Deus deles
  alternative: o deus deles
  rationale: As nações questionam em tom de zombaria a presença ou atuação do Deus de Israel. A inicial maiúscula indica essa referência contextual, sem acrescentar conteúdo ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Haveriam de dizer” preserva a força retórica da pergunta; a nota registra a leitura mais direta no presente.
