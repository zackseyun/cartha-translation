base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/005.yaml
  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: pt
  text: Têm boca, mas não falam; têm olhos, mas não veem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה לָהֶם
  choice: Têm boca
  rationale: 'A construção com ל e sufixo pronominal expressa posse. O singular hebraico “boca” tem sentido distributivo: os ídolos, coletivamente, têm cada qual uma boca. O português permite preservar com naturalidade esse singular.'
- source_word: וְלֹא
  choice: mas não
  rationale: Embora ו seja frequentemente aditivo, aqui a negação cria contraste entre possuir o órgão e ser incapaz de exercer sua função; “mas não” reproduz naturalmente essa força adversativa.
- source_word: יְדַבֵּרוּ
  choice: falam
  rationale: O piel imperfeito de דבר indica o ato de falar. O presente em português expressa adequadamente a incapacidade característica descrita no paralelismo poético.
- source_word: עֵינַיִם לָהֶם
  choice: têm olhos
  rationale: עֵינַיִם designa “olhos”, e a construção possessiva com ל é vertida de modo idiomático por “têm”.
- source_word: יִרְאוּ
  choice: veem
  rationale: O qal imperfeito de ראה significa “ver”; “veem” mantém o sentido sensorial e o paralelismo com “falam”.
theological_decisions:
- issue: Referente dos sujeitos plurais implícitos
  choice: Os verbos na terceira pessoa do plural continuam a descrição dos ídolos mencionados no contexto anterior.
  alternative: Explicitar “eles” ou repetir “os ídolos” no versículo.
  rationale: O português pode omitir naturalmente o pronome, como o hebraico não apresenta um pronome independente. Isso mantém a coesão contextual e a sátira contra os ídolos sem acrescentar uma identificação que não está expressa neste versículo isolado.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. Preserva-se “boca” no singular distributivo, natural em português, e “olhos” no plural, conforme o hebraico.
