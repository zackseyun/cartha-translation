source:
  edition: WLC
  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: pt
  text: Ó casa de Arão, confiem em Yahweh; ele é o auxílio e o escudo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: casa de Arão
  rationale: Mantém o hebraísmo coletivo e o paralelismo do salmo, designando a linhagem sacerdotal de Arão sem transformar a expressão em uma explicação.
- source_word: בִּטְחוּ
  choice: confiem
  rationale: Imperativo plural de בטח. Em português, «confiem» explicita naturalmente o número plural dos destinatários.
- source_word: בַיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ marca aquele em quem se deposita confiança; o tetragrama יְהוָה é representado pelo nome próprio «Yahweh».
- source_word: עֶזְרָם
  choice: o auxílio deles
  rationale: O substantivo עֵזֶר com sufixo de terceira pessoa masculina plural significa literalmente «auxílio deles»; a formulação conserva a mudança do discurso direto para a terceira pessoa.
- source_word: וּמָגִנָּם
  choice: e o escudo deles
  rationale: Preserva a imagem concreta de מָגֵן e seu sufixo de terceira pessoa plural.
- source_word: הוּא
  choice: ele é
  rationale: O pronome independente dá ênfase ao sujeito numa oração nominal; o português requer a cópula «é», sem acrescentar a ideia de exclusividade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. «Yahweh» conserva sua função de nome pessoal da aliança sem substituí-lo por um título.
- issue: Mudança entre a segunda e a terceira pessoas
  choice: «confiem» ... «auxílio e escudo deles»
  alternative: «confiem» ... «auxílio e escudo de vocês»
  rationale: Os sufixos hebraicos em עֶזְרָם e מָגִנָּם estão na terceira pessoa plural. A tradução mantém a mudança gramatical e sua possível força litúrgica, em vez de harmonizá-la silenciosamente com o imperativo dirigido à casa de Arão.
translation_notes:
  register: Português contemporâneo, poético e digno. «Ó» assinala claramente o vocativo; «casa de Arão» preserva o idioma bíblico sem perder inteligibilidade. A repetição de «deles» evita esconder os dois sufixos hebraicos e mantém a mudança intencional de pessoa.
