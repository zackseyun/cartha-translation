  text: יֹסֵ֣ף יְהוָ֣ה עֲלֵי/כֶ֑ם עֲ֝לֵי/כֶ֗ם וְ/עַל בְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/014.yaml
  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: pt
  text: Que Yahweh lhes dê[b] crescimento[a] — a vocês e aos seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acrescente a vocês”. O verbo hebraico também pode ser traduzido por “acrescentar” ou “aumentar”.'
    reason: lexical_alternative
  - marker: b
    text: 'A forma verbal também pode ser entendida como uma declaração: “Yahweh lhes dará crescimento — a vocês e aos seus filhos”.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יֹסֵף
  choice: dê crescimento
  rationale: O hifil de יסף pode significar “acrescentar” ou “aumentar”. No contexto de uma bênção, “dê crescimento” é natural em português e mantém em aberto se o aumento envolve número, prosperidade ou bênção, sem especificar o que o hebraico não explicita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: lhes ... a vocês
  rationale: A primeira ocorrência é expressa idiomaticamente pelo pronome “lhes”; a segunda, após o travessão, preserva a repetição enfática e funciona como esclarecimento.
- source_word: וְעַל בְּנֵיכֶם
  choice: e aos seus filhos
  rationale: בנים pode designar filhos ou, em certos contextos, descendentes. “Filhos” é a opção direta e natural nesta bênção familiar, sem ampliar indevidamente o alcance.
theological_decisions:
- issue: Força volitiva ou futura da forma verbal יֹסֵף
  choice: Que Yahweh lhes dê crescimento
  alternative: Yahweh lhes dará crescimento
  rationale: No contexto de bênção dos versículos 12–15, a leitura volitiva é provável. A nota preserva a possibilidade gramatical de entender a forma como declaração futura.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A tradução mantém o nome pessoal presente no texto hebraico, sem substituí-lo silenciosamente pelo título tradicional.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade no Brasil e compreensão internacional. O travessão apresenta “a vocês e aos seus filhos” como expansão enfática do pronome “lhes”, preservando a repetição do hebraico sem produzir uma enumeração confusa.
