lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: semelhantes a eles
  rationale: Expressa naturalmente a comparação introduzida por כְּ e retoma os ídolos dos versículos anteriores.
- source_word: יִהְיוּ
  choice: se tornam
  rationale: Embora היה possa significar simplesmente “ser”, com o predicativo comparativo o contexto permite o sentido resultativo de “tornar-se”; a nota preserva a alternativa.
- source_word: עֹשֵׂיהֶם
  choice: os que os fazem
  rationale: Mantém a força participial e identifica de modo claro as pessoas que fabricam os ídolos.
- source_word: כֹּל אֲשֶׁר
  choice: todo aquele que
  rationale: Preserva o alcance universal da expressão hebraica em português natural.
- source_word: בֹּטֵחַ בָּהֶם
  choice: neles confia
  rationale: “Confiar em” é a correspondência idiomática e religiosa direta de בטח com ב.
theological_decisions:
- issue: Natureza da semelhança com os ídolos
  choice: A tradução afirma que fabricantes e devotos se tornam semelhantes aos ídolos, sem definir no texto principal todas as dimensões dessa semelhança.
  alternative: Explicitar no versículo que se tornam espiritualmente insensíveis ou moralmente semelhantes aos ídolos.
  rationale: O hebraico afirma a semelhança, mas não a explica plenamente neste versículo; a nota relaciona a declaração ao contexto imediato sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo e a ambiguidade lexical relevante; os marcadores seguem a ordem exigida pelo texto de consulta.
