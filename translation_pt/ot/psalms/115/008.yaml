  text: Os que os fazem se tornam semelhantes a eles[b][a], bem como todos os que neles confiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão semelhantes a eles”. O verbo hebraico pode ser traduzido por “ser” ou “tornar-se”; aqui, “se tornam” destaca o provável sentido de uma semelhança resultante.'
