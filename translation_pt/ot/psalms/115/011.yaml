  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: pt
  text: Vocês que temem Yahweh[a], confiem em Yahweh; ele é o auxílio deles e o escudo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os que temem Yahweh, confiem em Yahweh”. O particípio hebraico pode ser entendido como tratamento direto (“Vocês que temem...”) ou como designação na terceira pessoa (“Os que temem...”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: Vocês que temem
  rationale: O particípio masculino plural em construção, usado substantivamente, significa “os que temem”. A forma de tratamento direto combina com o imperativo plural seguinte e preserva o caráter exortativo do salmo.
- source_word: יְהוָה / בַיהוָה
  choice: Yahweh / em Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama e reproduz sua repetição enfática. Com בָּטַח, a preposição ב é naturalmente vertida por “em”.
- source_word: בִּטְחוּ
  choice: confiem
  rationale: Imperativo qal masculino plural de בָּטַח. “Confiem” é direto, natural e preserva a força da exortação.
- source_word: עֶזְרָם
  choice: o auxílio deles
  rationale: עֵזֶר pode designar “auxílio” ou “ajudador”. “Auxílio” preserva o substantivo e forma um paralelo natural com “escudo”.
- source_word: וּמָגִנָּם
  choice: e o escudo deles
  rationale: מָגֵן significa literalmente “escudo”; a imagem concreta de proteção é mantida.
- source_word: הוּא
  choice: ele é
  rationale: O pronome independente tem valor enfático na oração nominal. Em português, acrescenta-se naturalmente a cópula “é”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Mudança da segunda para a terceira pessoa
  choice: “Vocês que temem... confiem”; depois, “deles”
  alternative: “Os que temem... confiem”; depois, “deles”
  rationale: O hebraico permite entender יִרְאֵי como vocativo ou designação em terceira pessoa, enquanto os sufixos de עֶזְרָם e מָגִנָּם são inequivocamente de terceira pessoa. A tradução conserva essa mudança de pessoa, em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” como plural corrente e mantém a mudança hebraica para “deles”, bem como a metáfora concreta do escudo.
