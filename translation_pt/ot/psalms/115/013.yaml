  text: יְ֭בָרֵךְ יִרְאֵ֣י יְהוָ֑ה הַ֝/קְּטַנִּ֗ים עִם הַ/גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: pt
  text: Ele abençoará os que temem Yahweh, tanto os pequenos como os grandes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os menores com os maiores”; o hebraico contrapõe, de modo amplo, pessoas de menor e de maior importância, provavelmente incluindo posição social, não apenas tamanho.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Ele abençoará
  rationale: O piel imperfeito na terceira pessoa masculina singular, com Deus como sujeito retomado do contexto, expressa aqui uma garantia de sentido futuro.
- source_word: יִרְאֵי יְהוָה
  choice: os que temem Yahweh
  rationale: A construção participial substantivada é vertida de modo natural, preservando em “temem” tanto o temor quanto a reverência devida a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַקְּטַנִּים
  choice: os pequenos
  rationale: Mantém a amplitude do adjetivo substantivado e seu contraste com “os grandes”, sem restringi-lo apenas a idade, tamanho ou posição social.
- source_word: עִם
  choice: tanto ... como
  rationale: Em português, a construção correlativa comunica naturalmente a inclusão conjunta dos dois grupos.
- source_word: הַגְּדֹלִים
  choice: os grandes
  rationale: Preserva o paralelismo e a abrangência do contraste hebraico, que pode envolver posição, importância ou proeminência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Valor modal de יְבָרֵךְ
  choice: Ele abençoará
  alternative: Que ele abençoe
  rationale: O contexto favorece uma declaração confiante sobre a ação de Deus; ainda que a forma imperfeita possa admitir valor volitivo em outros contextos, aqui a leitura futura se harmoniza com a sequência do salmo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A correlação “tanto... como” torna idiomática a inclusão dos dois grupos, enquanto “pequenos” e “grandes” preserva a abertura semântica do contraste hebraico.
