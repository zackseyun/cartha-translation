base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: pt
  text: Têm ouvidos, mas não ouvem; têm nariz, mas não cheiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: ouvidos
  rationale: O substantivo dual designa os órgãos da audição; o plural português mantém naturalmente a referência aos ídolos.
- source_word: לָהֶם
  choice: têm
  rationale: A construção nominal de posse, literalmente «para eles», é expressa de modo natural em português pelo verbo «ter».
- source_word: יִשְׁמָעוּ
  choice: ouvem
  rationale: O qal imperfeito de שׁמע indica aqui a capacidade auditiva; «ouvem» é direto e preserva o contraste irônico.
- source_word: אַף
  choice: nariz
  rationale: Neste contexto, אַף nomeia o órgão do olfato, não «ira». O singular distributivo «nariz» é idiomático em português para um sujeito plural.
- source_word: יְרִיחוּן
  choice: cheiram
  rationale: A forma verbal expressa o ato ou a capacidade de perceber pelo olfato; «cheiram» conserva o paralelismo concreto e conciso.
- source_word: וְלֹא
  choice: mas não
  rationale: Embora formalmente seja «e não», a conjunção marca o contraste entre possuir o órgão e não exercer sua função; «mas não» comunica isso naturalmente.
theological_decisions:
- issue: Descrição antropomórfica dos ídolos
  choice: Descrição literal de órgãos sensoriais sem capacidade sensorial
  alternative: Formulação interpretativa que explicite a impotência espiritual dos ídolos
  rationale: O hebraico emprega imagens corporais concretas na polêmica contra a idolatria. Preservá-las mantém a força retórica sem acrescentar ao texto uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A repetição de «têm» torna explícita em português a segunda construção possessiva elíptica do hebraico. «Nariz» no singular funciona distributivamente e soa mais natural do que «narizes».
