  text: וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/020.yaml
  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: pt
  text: e Ogue, rei de Basã,[a] porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a Ogue, rei de Basã”, continuando a construção sintática dos versículos anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  choice: e Ogue
  rationale: A conjunção וּ é traduzida por “e”, dando continuidade à enumeração. O לְ retoma a construção dos versículos anteriores e marca Ogue como objeto da ação já expressa; em português, não é necessário reproduzi-lo isoladamente no texto principal.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Tradução corrente do substantivo; sua relação com o topônimo seguinte é expressa naturalmente por “rei de Basã”.
- source_word: הַבָּשָׁן
  choice: Basã
  rationale: O nome geográfico é transliterado segundo o uso português. O artigo hebraico não é reproduzido, pois o português normalmente diz “rei de Basã”.
- source_word: כִּי
  choice: porque
  rationale: Introduz o refrão que apresenta o fundamento do louvor. “Porque” preserva com clareza sua força explicativa e litúrgica.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa literalmente “para sempre”. Em conjunto com חַסְדּוֹ, o português pede um verbo explícito; “dura” comunica naturalmente a permanência afirmada no refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade duradoura. “Amor leal” preserva essa amplitude melhor que “misericórdia” e evita restringir o termo apenas à noção formal de aliança; o sufixo de terceira pessoa masculina é traduzido por “seu”.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: amor leal
  alternative: misericórdia; amor fiel; amor de aliança
  rationale: O refrão destaca o amor bondoso e constante de Deus. “Amor leal” mantém a ideia de fidelidade duradoura sem reduzir o termo somente à compaixão nem explicitar uma formulação teológica mais estreita que o próprio vocábulo.
- issue: Força sintática do לְ antes de Ogue
  choice: não explicitar a preposição no texto principal
  alternative: “e a Ogue, rei de Basã”
  rationale: A preposição retoma a construção elíptica iniciada nos versículos anteriores, na qual Ogue é objeto da ação. O texto principal fica mais natural sem a preposição, enquanto a nota preserva a forma alternativa e a continuidade sintática do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Mantém-se a estrutura breve e litânica do refrão.
