  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças ao Senhor dos senhores, pois o seu amor leal dura para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua fidelidade à aliança permanece para sempre”. O termo hebraico חֶסֶד pode indicar amor leal ligado à aliança, bem como bondade ou misericórdia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil convoca a comunidade a agradecer ou louvar; “Deem graças” é natural, direto e adequado ao refrão litúrgico do salmo.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: ao Senhor dos senhores
  rationale: Conserva a construção hebraica que expressa supremacia e mantém o peso do título divino em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão para a exortação, em registro poético e litúrgico natural.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A cláusula hebraica não tem verbo expresso; “dura para sempre” explicita naturalmente em português a permanência indicada pela locução.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade relacional; “amor leal” preserva essa amplitude melhor que opções mais estreitas como “misericórdia”.
theological_decisions:
- issue: Sentido do título אֲדֹנֵי הָאֲדֹנִים
  choice: Senhor dos senhores
  alternative: senhor dos mestres
  rationale: A expressão afirma a soberania suprema de Deus. A formulação tradicional e transparente “Senhor dos senhores” preserva sua força titular sem reduzi-la a uma hierarquia meramente social.
- issue: Amplitude semântica de חֶסֶד
  choice: amor leal
  alternative: fidelidade à aliança
  rationale: “Amor leal” comunica tanto afeição quanto constância, sem tornar explícita uma referência à aliança que, embora possível no campo semântico, não aparece lexicalmente no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com cadência litúrgica. O plural “Deem” dirige a exortação à comunidade. A nota preserva a amplitude teológica e lexical de חֶסֶד.
