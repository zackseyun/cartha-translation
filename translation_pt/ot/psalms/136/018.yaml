source:
  edition: WLC
  text: וַֽ֭/יַּהֲרֹג מְלָכִ֣ים אַדִּירִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/018.yaml
  text: and killed mighty kings[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: e matou reis poderosos[a], pois o seu amor leal[b] dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reis fortes”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico ḥésed; também pode ser traduzido como “misericórdia” ou “fidelidade à aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: e matou
  rationale: A forma narrativa de הרג dá continuidade à recapitulação histórica do salmo. “E matou” transmite de modo direto e atual a ação indicada pelo hebraico.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente comum e direto do substantivo plural hebraico.
- source_word: אַדִּירִים
  choice: poderosos
  rationale: No contexto marcial, o adjetivo caracteriza os reis como fortes ou formidáveis; “poderosos” é natural e evita sugerir apenas esplendor régio.
- source_word: כִּי
  choice: pois
  rationale: Introduz o refrão que fundamenta a celebração dos atos de Deus. “Pois” preserva tanto o valor explicativo quanto a cadência litúrgica.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Embora a expressão signifique literalmente “para sempre”, o português pede naturalmente um verbo no refrão; “dura para sempre” expressa a permanência contínua.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e fidelidade relacional. “Amor leal” conserva boa parte dessa amplitude em linguagem clara e digna.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre; a sua fidelidade à aliança permanece para sempre
  rationale: “Amor leal” preserva conjuntamente as dimensões afetiva e fiel de חֶסֶד sem restringir o termo apenas à misericórdia nem explicitar “aliança” onde essa palavra não aparece no verso.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. O refrão mantém uma cadência apropriada à recitação litúrgica.
