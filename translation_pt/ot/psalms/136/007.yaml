source:
  edition: WLC
  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'Àquele que fez os grandes luminares[a],

    porque o seu amor leal dura para sempre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandes luzes”. O hebraico se refere aos grandes corpos celestes que dão luz.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua fidelidade amorosa dura para sempre”. O termo hebraico inclui a ideia de amor constante e leal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Àquele que fez
  rationale: O לְ mantém a construção dativa da ladainha (“àquele que…”). Embora עֹשֵׂה seja particípio, o ato criador é expresso naturalmente em português como ação realizada.
- source_word: אוֹרִים גְּדֹלִים
  choice: os grandes luminares
  rationale: אוֹרִים designa aqui os corpos celestes portadores de luz, em eco da linguagem da criação de Gênesis 1. “Luminares” preserva essa referência e mantém um registro digno sem ser excessivamente técnico.
- source_word: כִּי
  choice: porque
  rationale: Introduz o refrão que apresenta o motivo do louvor. “Porque” expressa com clareza sua força explicativa e litúrgica.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa literalmente “para sempre”; o verbo “dura”, suprido em português, comunica a permanência contínua exigida pelo refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e constância. “Amor leal” conserva essa amplitude melhor do que uma formulação limitada apenas à emoção ou à obrigação pactual.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão recorrente
  choice: o seu amor leal dura para sempre
  alternative: a sua fidelidade amorosa dura para sempre; a sua misericórdia dura para sempre
  rationale: “Amor leal” preserva tanto o aspecto afetivo quanto a constância relacional e pactual do termo, sem impor uma leitura denominacional nem reduzir sua riqueza semântica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A disposição em duas linhas conserva o caráter responsivo do refrão.
