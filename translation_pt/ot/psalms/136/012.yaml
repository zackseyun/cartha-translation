  text: with a strong hand and an outstretched arm[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: com mão forte e braço estendido,[a] pois o seu amor fiel dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com mão poderosa e braço estendido».'
    reason: lexical_alternative
  - marker: b
    text: «Amor fiel» traduz o hebraico ḥésed, termo que pode expressar amor constante, bondade, misericórdia e lealdade, muitas vezes no contexto de uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: A preposição בְּ marca o meio ou instrumento; «com» é natural em português. «Mão forte» preserva diretamente a imagem hebraica e a fórmula ligada ao êxodo.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: e braço estendido
  rationale: Mantém a imagem concreta do braço e traduz o particípio נְטוּיָה de modo natural, preservando a ressonância tradicional da linguagem do êxodo.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento do louvor e conserva o tom litúrgico do refrão.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: O hebraico diz literalmente «para sempre»; o verbo «dura» é suprido em português para formar uma oração natural sem alterar o sentido.
- source_word: חַסְדּוֹ
  choice: o seu amor fiel
  rationale: «Amor fiel» comunica tanto benevolência quanto constância e lealdade, mantendo a amplitude de חֶסֶד em português corrente.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor fiel dura para sempre
  alternative: a sua misericórdia dura para sempre; a sua lealdade à aliança dura para sempre
  rationale: חֶסֶד reúne amor, bondade, fidelidade e lealdade relacional. «Amor fiel» preserva essa amplitude melhor do que «misericórdia» isoladamente, sem tornar explícita no texto uma referência à aliança que permanece implícita no termo e no contexto.
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural tanto no Brasil quanto em outros contextos lusófonos. A estrutura breve e paralela preserva o caráter litúrgico do refrão.
