  text: וְ/נִ֘עֵ֤ר פַּרְעֹ֣ה וְ/חֵיל֣/וֹ בְ/יַם ס֑וּף כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: pt
  text: e lançou o faraó e seu exército no mar de Juncos[a], porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “mar Vermelho”. Em hebraico, “mar de Juncos” ou “mar dos Juncos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִעֵר
  choice: e lançou
  rationale: O verbo נָעַר evoca sacudir para fora, livrar-se de algo ou arremessar. Em português, “lançou” preserva o movimento vigoroso para dentro do mar sem produzir a possível impressão inadequada de que Deus literalmente sacudiu o faraó.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma corrente em português para o título real egípcio; o artigo torna a expressão natural.
- source_word: וְחֵילוֹ
  choice: e seu exército
  rationale: No contexto militar, חַיִל designa as forças armadas; “exército” é claro, moderno e natural.
- source_word: בְיַם־סוּף
  choice: no mar de Juncos
  rationale: A expressão hebraica יַם־סוּף é representada de maneira transparente como “mar de Juncos”. A preposição “em/no” pode expressar o destino após um verbo de lançamento em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz o motivo recorrente do louvor no salmo e mantém clara a relação causal.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: O hebraico expressa permanência; a formulação verbal é natural no refrão português.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne amor, lealdade e compromisso duradouro. “Amor leal” preserva essa amplitude sem limitar o termo apenas a misericórdia ou a uma formulação doutrinária específica.
theological_decisions:
- issue: Tradução de יַם־סוּף
  choice: mar de Juncos no texto principal
  alternative: mar Vermelho
  rationale: “Mar de Juncos” reflete mais diretamente a forma hebraica, enquanto “mar Vermelho” é a identificação tradicional e amplamente conhecida. A alternativa tradicional é mantida em nota para reconhecimento e transparência.
- issue: Imagem verbal de נָעַר
  choice: lançou
  alternative: sacudiu para fora / derrubou
  rationale: “Lançou” conserva a ação vívida e violenta no mar, mas evita uma expressão pouco natural em português. Não acrescenta uma explicação sobre o modo exato da derrota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo litúrgico é preservado, e o refrão usa a formulação clara e recorrente “porque o seu amor leal dura para sempre”.
