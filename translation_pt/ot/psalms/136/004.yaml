  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'àquele que, só ele, faz grandes maravilhas[a],

    pois o seu amor leal dura para sempre.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “feitos maravilhosos”.
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico hesed, que pode incluir amor constante, misericórdia e fidelidade, muitas vezes no contexto de uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: àquele que faz
  rationale: A preposição לְ mantém o valor dativo do padrão litúrgico iniciado pelo chamado a dar graças, e o particípio substantivado é expresso naturalmente como “àquele que faz”.
- source_word: נִפְלָאוֹת גְּדֹלוֹת
  choice: grandes maravilhas
  rationale: A expressão designa feitos divinos extraordinários que despertam admiração. “Grandes maravilhas” é direta, poética e acessível.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: 'Expressa a exclusividade enfática do hebraico: ele, e nenhum outro, realiza essas maravilhas.'
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão para o louvor e preserva claramente a força causal do refrão.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Na oração hebraica sem verbo expresso, “dura” explicita de modo natural em português a continuidade indicada por לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso constante. “Amor leal” conserva essa amplitude melhor que “misericórdia” isoladamente e permanece natural no refrão.
theological_decisions:
- issue: Tradução do refrão כִּי לְעוֹלָם חַסְדּוֹ
  choice: porque o seu amor leal dura para sempre
  alternative: porque a sua misericórdia dura para sempre; porque a sua fidelidade à aliança permanece para sempre
  rationale: “Amor leal” preserva tanto a benevolência quanto a constância relacional de חֶסֶד sem restringir o termo à compaixão nem explicitar “aliança” onde ela não aparece lexicalmente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência adequada ao refrão litúrgico. A ordem “àquele que, sozinho, faz” destaca a exclusividade de Deus sem soar excessivamente rígida.
