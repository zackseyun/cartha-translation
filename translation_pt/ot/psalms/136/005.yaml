  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'Àquele que fez os céus com entendimento,[a]

    pois o seu amor leal[b] dura para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Àquele que faz os céus por meio do entendimento». O particípio hebraico também pode ser traduzido no presente, e a preposição pode indicar o meio, em vez da maneira.'
    reason: lexical_alternative
  - marker: b
    text: «Amor leal» traduz o hebraico חֶסֶד (chesed), termo que, conforme o contexto, também pode ser traduzido por «fidelidade», «bondade» ou «misericórdia».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Àquele que fez
  rationale: O לְ prefixado introduz o destinatário do louvor na sequência litúrgica. Embora o particípio possa ser vertido por «que faz», o passado é natural no contexto dos atos criadores celebrados no salmo.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Preserva o plural hebraico e o sentido cosmológico elevado próprio do contexto da criação.
- source_word: בִּתְבוּנָה
  choice: com entendimento
  rationale: תְּבוּנָה designa entendimento, discernimento ou inteligência; a preposição בְּ aqui pode indicar maneira ou meio. «Com entendimento» mantém essa amplitude sem confundir o termo com חָכְמָה, normalmente traduzido por «sabedoria».
- source_word: כִּי
  choice: pois
  rationale: Introduz, no refrão litúrgico, a razão para o louvor.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa literalmente «para sempre»; «dura» explicita de modo idiomático o valor contínuo subentendido no refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade, bondade e misericórdia. «Amor leal» é claro em português moderno e conserva tanto a dimensão afetiva quanto a fidelidade persistente; o sufixo pronominal é representado por «seu».
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre; a sua fidelidade à aliança permanece para sempre
  rationale: «Amor leal» evita reduzir חֶסֶד apenas à misericórdia e preserva sua combinação de amor e fidelidade, sem inserir no texto a expressão interpretativa mais explícita «à aliança».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência adequada ao refrão litúrgico. «Céus» mantém o registro poético; «amor leal» comunica o rico sentido de חֶסֶד sem tecnicismo denominacional.
