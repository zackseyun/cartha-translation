  text: the sun to rule by day[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'o sol para governar de dia,

    pois o seu amor fiel dura para sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amor fiel” traduz o hebraico חֶסֶד, termo rico que também pode ser traduzido, conforme o contexto, por “misericórdia”, “bondade leal” ou “fidelidade à aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[marcador de objeto direto, sem tradução independente]'
  rationale: Marca o objeto direto definido em hebraico e fica implícito na sintaxe natural do português.
- source_word: הַשֶּׁמֶשׁ
  choice: o sol
  rationale: Equivalente direto e natural do substantivo definido שֶׁמֶשׁ.
- source_word: לְמֶמְשֶׁלֶת
  choice: para governar
  rationale: O substantivo hebraico מֶמְשֶׁלֶת expressa governo ou domínio. Em português, a construção verbal com infinitivo é natural e comunica a função atribuída ao sol no contexto paralelo.
- source_word: בַּיּוֹם
  choice: o dia
  rationale: Depois de “governar”, o objeto direto “o dia” expressa naturalmente em português o âmbito temporal do governo do sol; “durante o dia” também seria possível, mas enfraqueceria o paralelo com a lua e as estrelas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do louvor e preserva a cadência litúrgica do refrão.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Explicita de modo idiomático a duração perpétua indicada por לְעוֹלָם na oração nominal hebraica.
- source_word: חַסְדּוֹ
  choice: o seu amor fiel
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e compromisso constante. “Amor fiel” é claro, digno e suficientemente amplo em português contemporâneo.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor fiel dura para sempre
  alternative: a sua misericórdia dura para sempre; a sua lealdade amorosa dura para sempre
  rationale: “Amor fiel” preserva tanto a dimensão afetiva quanto a constância e lealdade do termo, sem restringi-lo apenas à misericórdia nem inserir explicitamente “aliança”, que não aparece neste versículo.
translation_notes:
  register: Português moderno, claro e solene, com cadência adequada ao refrão litúrgico. A formulação “governar o dia” mantém o paralelismo poético com o versículo seguinte.
