  text: לְ/גֹזֵ֣ר יַם ס֭וּף לִ/גְזָרִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/013.yaml
  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
translation:
  language: pt
  text: àquele que dividiu o Mar dos Juncos em partes[a], porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Mar Vermelho”. O hebraico diz “Mar dos Juncos”.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: àquele que dividiu
  rationale: O לְ introduz aquele a quem se dirige o louvor na ladainha do salmo, e o particípio de גזר descreve o ato de cortar ou dividir. A formulação é natural em português e preserva a ação evocada pelo êxodo.
- source_word: יַם סוּף
  choice: o Mar dos Juncos
  rationale: Traduz diretamente o sentido mais provável da expressão hebraica, sem substituí-lo pela designação tradicional “Mar Vermelho”, registrada na nota.
- source_word: לִ/גְזָרִים
  choice: em partes
  rationale: O substantivo גְזָרִים indica partes ou porções separadas. “Em partes” comunica com clareza que o mar foi dividido.
- source_word: כִּי
  choice: porque
  rationale: Introduz o fundamento do louvor no refrão recorrente do salmo.
- source_word: לְ/עוֹלָם
  choice: dura para sempre
  rationale: O hebraico não traz verbo expresso; “dura” torna a frase natural em português e comunica permanência contínua.
- source_word: חַסְדּ/וֹ
  choice: o seu amor leal
  rationale: חסד expressa amor fiel, constante e comprometido. “Amor leal” preserva essa amplitude melhor que opções mais estreitas como “misericórdia”.
