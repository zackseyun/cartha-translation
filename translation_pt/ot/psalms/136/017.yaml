  text: לְ֭/מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'Àquele que feriu grandes reis[a],

    porque o seu amor leal[b] dura para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “golpeou grandes reis”. O particípio hebraico com o prefixo לְ dá continuidade à fórmula de louvor do salmo.'
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico hésed, que pode incluir amor fiel, bondade, misericórdia e lealdade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Àquele que derrotou
  rationale: O לְ prefixado mantém a fórmula de louvor dirigida a Deus, e o particípio de נכה funciona verbalmente na sequência. “Derrotou” expressa de modo natural o golpe decisivo contra os reis sem exigir que o verbo seja explicitamente vertido como “matou”.
- source_word: מְלָכִים גְּדֹלִים
  choice: grandes reis
  rationale: Tradução direta que preserva a ordem e a amplitude do hebraico; “grandes” pode indicar importância e poder.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do louvor no refrão. “Porque” é claro, corrente e adequado à cadência litúrgica em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: O hebraico indica duração ilimitada. O verbo “dura”, suprido naturalmente em português, comunica a continuidade expressa pelo refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חסד reúne as ideias de amor, fidelidade, benevolência e compromisso relacional. “Amor leal” preserva melhor essa riqueza do que apenas “amor” ou “misericórdia”.
theological_decisions:
- issue: Sentido de חסד no refrão
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre
  rationale: “Amor leal” mantém tanto a benevolência quanto a fidelidade duradoura associadas a חסד, sem restringir o termo somente à compaixão nem tornar explícita uma referência à aliança que permanece implícita no vocábulo.
- issue: Força de נכה aplicada aos reis
  choice: derrotou
  alternative: matou / feriu
  rationale: No contexto histórico e poético, o verbo descreve a ação decisiva de Deus contra reis inimigos. “Derrotou” comunica o resultado contextual sem eliminar a possibilidade de golpe mortal nem afirmá-la além do que esta linha isolada exige.
translation_notes:
  register: Português moderno, claro e digno, com cadência apropriada ao refrão litúrgico. A formulação “Àquele que” preserva a estrutura anafórica do salmo, e “amor leal” mantém a densidade teológica de חסד em linguagem acessível.
