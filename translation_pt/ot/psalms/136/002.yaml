  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças ao Deus dos deuses[a], pois seu amor leal[b] dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao Deus acima de todos os deuses”. O hebraico diz literalmente “Deus dos deuses”, expressão de supremacia.'
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico hesed, que pode abranger amor constante, misericórdia e fidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural do hifil de ידה pede que os ouvintes expressem gratidão ou louvor. “Deem graças” conserva a força do imperativo e é natural no refrão do salmo.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: ao Deus dos deuses
  rationale: A cadeia construta significa literalmente “Deus dos deuses”. A formulação preserva o título exaltado e sua expressão idiomática de supremacia, sem determinar a natureza dos chamados deuses.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão para a convocação à gratidão; “pois” é conciso, claro e adequado ao registro poético.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa “para sempre”. Como a oração hebraica não contém verbo expresso, “dura” o supre naturalmente em português sem alterar o sentido.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חסד reúne as ideias de amor, lealdade, misericórdia e fidelidade relacional. “Amor leal” é compreensível e preserva tanto o aspecto afetivo quanto o compromisso constante; o sufixo pronominal é traduzido por “seu”.
theological_decisions:
- issue: Sentido de אֱלֹהִים na expressão “Deus dos deuses”
  choice: Manter o título literal “Deus dos deuses” como expressão da supremacia de Deus.
  alternative: Traduzir de modo explicativo como “Deus acima de todos os deuses”.
  rationale: A expressão hebraica declara supremacia e incomparabilidade, mas, por si só, não define o estatuto ontológico dos demais “deuses”. A forma literal conserva essa tensão e a retórica do salmo.
- issue: Amplitude semântica de חֶסֶד
  choice: Traduzir por “amor leal”.
  alternative: Usar “misericórdia” ou “fidelidade à aliança”.
  rationale: “Amor leal” comunica de modo equilibrado afeto e constância sem restringir o termo exclusivamente à misericórdia nem tornar explícita uma referência à aliança que está apenas implícita no campo semântico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem acompanha a estrutura poética hebraica; “pois” mantém a relação causal, e o verbo “dura” torna natural em português a oração nominal hebraica.
