  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: pt
  text: que se lembrou de nós em nossa humilhação[a], pois seu amor leal dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em nossa condição abatida” ou “quando fomos humilhados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “pois seu amor leal é para sempre”.'
    reason: literal_rendering
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: que se lembrou de nós em nossa humilhação
  rationale: A partícula relativa שֶׁ introduz a descrição de Deus, e בְּשִׁפְלֵנוּ indica a situação de rebaixamento, aflição ou humilhação em que ele se lembrou de seu povo. “Em nossa humilhação” mantém essa amplitude sem especificar a causa ou a natureza exata da condição.
- source_word: זָכַר
  choice: se lembrou
  rationale: Preserva o sentido básico do verbo hebraico. No contexto, lembrar-se pode implicar agir em favor de alguém, mas essa consequência não é explicitada na tradução.
- source_word: לָנוּ
  choice: de nós
  rationale: Com זכר, a preposição hebraica marca idiomaticamente a pessoa lembrada; em português, a regência natural é “lembrar-se de nós”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão no refrão litúrgico e liga o ato de Deus à permanência de seu amor leal.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: O hebraico expressa duração perpétua sem verbo explícito. “Dura para sempre” é uma formulação idiomática e natural em português.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, fidelidade, benevolência e compromisso. “Amor leal” comunica tanto o afeto quanto a constância, sem limitar o termo apenas à misericórdia.
theological_decisions:
- issue: Sentido de זָכַר no agir divino
  choice: se lembrou de nós
  alternative: atentou para nós / agiu em nosso favor
  rationale: A tradução conserva o verbo do texto e não explicita a ação favorável que o contexto pode implicar.
- issue: Tradução do refrão כִּי לְעוֹלָם חַסְדּוֹ
  choice: pois seu amor leal dura para sempre
  alternative: pois seu amor leal é para sempre / pois sua misericórdia dura para sempre
  rationale: “Amor leal” preserva a combinação de bondade e fidelidade de חֶסֶד; “dura para sempre” fornece em português um verbo natural para a oração nominal hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O início em minúscula preserva a continuidade sintática do versículo dentro da sequência do salmo.
