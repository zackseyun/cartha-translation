  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: e deu a terra deles como herança[a], porque o seu amor leal dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por herança” ou “como propriedade”. O hebraico נַחֲלָה indica uma herança ou propriedade atribuída.
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico חֶסֶד, que frequentemente indica amor constante e fidelidade no relacionamento; outras traduções possíveis são “amor fiel”, “misericórdia” e “fidelidade à aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: e deu
  rationale: O qal perfeito na 3ª pessoa masculina singular, com conjunção, dá continuidade à sequência dos atos divinos no salmo.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: Expressa diretamente a terra pertencente aos reis e povos derrotados mencionados no contexto; evita o sentido político moderno de “país”.
- source_word: לְנַחֲלָה
  choice: como herança
  rationale: Preserva o sentido de propriedade recebida por atribuição, especialmente apropriado à linguagem bíblica da terra concedida.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do louvor no refrão e soa natural na repetição litúrgica em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Explicita idiomaticamente a permanência expressa pelo hebraico, sem alterar seu sentido temporal.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: Comunica tanto amor quanto constância e fidelidade relacional; é atual e mais abrangente que “misericórdia”.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre; o seu amor fiel dura para sempre; a sua fidelidade à aliança dura para sempre
  rationale: “Amor leal” preserva a combinação de afeto, compromisso e constância do termo sem limitar seu significado à compaixão nem inserir explicitamente “aliança”, que está implícita no contexto lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das frases acompanha o paralelismo e o refrão hebraicos; “terra deles” mantém a referência contextual sem excesso de explicitação.
