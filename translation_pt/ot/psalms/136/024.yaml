    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: e nos libertou
  rationale: O verbo פרק, com sufixo de primeira pessoa do plural, expressa tirar ou livrar alguém de perigo ou opressão. “Nos libertou” é claro e natural em português e, com o complemento “dos nossos adversários”, não fica restrito à emancipação da escravidão.
- source_word: מִצָּרֵינוּ
  choice: dos nossos adversários
  rationale: O substantivo plural com sufixo de primeira pessoa do plural designa pessoas hostis ou opressoras. “Adversários” preserva a amplitude do hebraico e mantém um registro digno e compreensível.
- source_word: כִּי
  choice: porque
  rationale: Introduz o fundamento do louvor no refrão. “Porque” comunica diretamente essa força explicativa em português atual.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica permanência sem fim. O verbo “dura”, suprido idiomaticamente em português, produz um refrão natural e fiel.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne amor, bondade, fidelidade e compromisso constante. “Amor leal” preserva essa amplitude melhor do que “misericórdia” isoladamente.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre
  rationale: “Amor leal” mantém tanto a dimensão afetiva quanto a fidelidade constante de Deus, sem limitar o termo à compaixão diante da miséria.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo litúrgico do refrão e emprega “adversários” para abranger hostilidade e opressão.
