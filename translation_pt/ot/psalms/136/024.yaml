  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: pt
  text: e nos libertou dos nossos adversários[a], porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
