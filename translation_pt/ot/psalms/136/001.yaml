id: PSA.136.1
reference: Psalms 136:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças a Yahweh[a], pois ele é bom; pois seu amor leal dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico יהוה também é tradicionalmente representado por “SENHOR”; outra forma conhecida é “Jeová”.
    reason: alternative_reading
  - marker: b
    text: Ou “sua fidelidade à aliança permanece para sempre” ou “sua misericórdia dura para sempre”. O termo hebraico חֶסֶד expressa amor leal, misericórdia e fidelidade duradoura, especialmente no contexto de uma relação de aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil pede que a comunidade expresse gratidão e louvor; “deem graças” comunica esse sentido de modo natural e consagrado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da ação, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico.
- source_word: כִּי
  choice: pois
  rationale: Nas duas ocorrências, כִּי apresenta a razão para dar graças. A repetição de “pois” conserva o paralelismo e a força causal do hebraico.
- source_word: טוֹב
  choice: bom
  rationale: “Bom” traduz diretamente o adjetivo e preserva sua amplitude, sem restringi-lo a “bondoso” ou “benéfico”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão indica duração ilimitada ou permanente; “para sempre” é clara, natural e adequada ao refrão litúrgico.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso duradouro. “Amor leal” mantém essa riqueza sem reduzir o termo apenas a misericórdia ou fidelidade contratual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Sentido de חֶסֶד no refrão
  choice: amor leal
  alternative: misericórdia; fidelidade à aliança; amor constante
  rationale: “Amor leal” preserva conjuntamente a afeição e a fidelidade duradoura inerentes ao termo, sem eliminar sua ressonância pactual.
- issue: Verbo implícito na cláusula final
  choice: dura para sempre
  alternative: é para sempre
  rationale: O hebraico apresenta uma cláusula nominal, literalmente próxima de “para sempre [é] seu חֶסֶד”. “Dura para sempre” explicita em português a continuidade naturalmente comunicada pela expressão, sem alterar sua afirmação central.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição de “pois” preserva a estrutura litúrgica e causal do hebraico; o ponto e vírgula torna perceptível o paralelismo sem fragmentar o versículo.
