  text: לְ/רֹקַ֣ע הָ֭/אָרֶץ עַל הַ/מָּ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'àquele que estendeu a terra sobre as águas[a],

    pois o seu amor leal dura para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expandiu a terra por cima das águas”; o verbo hebraico também pode ter o sentido concreto de “bater” ou “martelar” um material até formar uma superfície larga.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: àquele que estendeu
  rationale: A preposição לְ introduz, na sequência litânica do salmo, aquele a quem se dirige o louvor. O particípio de רקע descreve o ato de alargar ou estender uma superfície; “estendeu” é natural em português e conserva a imagem sem impor o sentido mais específico de martelar metal.
- source_word: הָ/אָרֶץ
  choice: a terra
  rationale: No contexto cósmico da criação e em relação com “as águas”, אֶרֶץ designa a terra, não uma região específica.
- source_word: עַל הַ/מָּיִם
  choice: sobre as águas
  rationale: עַל pode significar “sobre”, “por cima de” ou “em cima de”. “Sobre as águas” preserva com naturalidade a imagem cosmológica e o tom poético.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz o fundamento do louvor no refrão. “Pois” mantém a ligação explicativa e o registro poético.
- source_word: לְ/עוֹלָם
  choice: dura para sempre
  rationale: עוֹלָם expressa perpetuidade. O verbo “dura”, implícito na fórmula nominal hebraica, produz em português um refrão claro e natural.
- source_word: חַסְדּֽ/וֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e fidelidade. “Amor leal” preserva de modo conciso tanto a dimensão afetiva quanto a constância relacional, sem restringir o termo apenas à misericórdia.
theological_decisions:
- issue: Imagem cosmológica da criação
  choice: Manter a descrição poética de Deus estendendo a terra sobre as águas.
  alternative: Generalizar como uma declaração de que Deus estabeleceu o mundo.
  rationale: O hebraico apresenta uma imagem cosmológica poética. Preservá-la respeita a forma e a tensão próprias do texto, sem convertê-la em explicação científica nem substituí-la por uma paráfrase abstrata.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Àquele que” conserva a estrutura litânica; “amor leal” comunica a riqueza de חֶסֶד sem recorrer a linguagem denominacional.
