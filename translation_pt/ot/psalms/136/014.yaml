  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: e conduziu Israel pelo meio dele[a], pois seu amor leal[b] dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e fez Israel passar pelo meio dele”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como “misericórdia” ou “fidelidade à aliança”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: e conduziu
  rationale: O hifil de עבר expressa fazer passar ou levar através. “Conduziu” comunica em português corrente a ação causativa e orientadora, enquanto a expressão seguinte preserva a ideia de travessia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio vertido segundo a forma tradicional em português.
- source_word: בְּ/תוֹכ֑/וֹ
  choice: pelo meio dele
  rationale: Preserva o sentido espacial de atravessar o interior do referente, o mar mencionado no versículo anterior, sem substituir o pronome do texto hebraico por uma explicitação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para o louvor e mantém de modo natural o caráter litúrgico do refrão.
- source_word: לְ/עוֹלָם
  choice: dura para sempre
  rationale: Como a oração hebraica não traz verbo expresso, “dura” completa naturalmente a frase em português e comunica permanência contínua.
- source_word: חַסְדּֽ/וֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e fidelidade relacional. “Amor leal” é conciso, compreensível e preserva tanto a dimensão afetiva quanto a constância.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: seu amor leal dura para sempre
  alternative: sua misericórdia dura para sempre; sua fidelidade à aliança permanece para sempre
  rationale: “Amor leal” mantém juntas a bondade amorosa e a fidelidade constante manifestadas nos atos de Deus, sem reduzir o termo apenas à misericórdia nem explicitar “aliança” onde essa palavra não aparece no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo litúrgico do salmo, o pronome que retoma o mar e a amplitude semântica de חֶסֶד por meio de nota.
