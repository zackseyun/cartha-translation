  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'como herança para Israel, seu servo[a],

    porque o seu amor leal[b] dura para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu escravo”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como “misericórdia”, “bondade” ou “amor constante”; ele frequentemente expressa amor fiel e comprometido.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: herança
  rationale: O substantivo designa propriedade herdada ou território recebido por lote; no contexto, refere-se à terra concedida a Israel.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: A preposição לְ marca Israel como beneficiário ou destinatário da herança; “para Israel” é claro e natural em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui funciona como título da relação de Israel com Deus, sem destacar a condição de escravidão.
- source_word: כִּי
  choice: porque
  rationale: Introduz o refrão que apresenta a razão do louvor e preserva sua ligação lógica com a afirmação anterior.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Expressa duração perpétua; em conjunto com חַסְדּוֹ, esta formulação é idiomática e conserva o sentido temporal.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, fidelidade e compromisso constante; “amor leal” mantém essa amplitude de modo compreensível.
theological_decisions:
- issue: A relação de Israel com Deus em עַבְדּוֹ
  choice: seu servo
  alternative: seu escravo
  rationale: O termo identifica Israel como pertencente a Deus e a seu serviço, mas o contexto celebra a dádiva da terra e não põe em primeiro plano uma condição coerciva.
- issue: O sentido de חַסְדּוֹ no refrão
  choice: seu amor leal
  alternative: sua misericórdia; seu amor da aliança; sua bondade
  rationale: “Amor leal” preserva tanto o afeto quanto a fidelidade constante implicados no termo, sem restringi-lo apenas à compaixão nem explicitar “aliança” onde ela não aparece lexicalmente.
translation_notes:
  register: Verso em registro poético, digno e acessível. A abertura fragmentária com “como herança” preserva a continuidade sintática com os versículos anteriores. O refrão usa uma formulação natural em português moderno e mantém o paralelismo litúrgico do salmo.
