  text: the moon and stars to rule over the night[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: a lua e as estrelas para governarem a noite, pois seu amor leal dura para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Introduz os objetos na sequência iniciada nos versos anteriores e não tem equivalente natural em português.
- source_word: הַיָּרֵחַ
  choice: a lua
  rationale: Tradução direta do substantivo definido que designa o corpo celeste.
- source_word: וְכוֹכָבִים
  choice: e as estrelas
  rationale: Traduz o substantivo plural de modo natural em português; o artigo definido combina com a referência aos astros criados.
- source_word: לְמֶמְשְׁלוֹת
  choice: para governarem
  rationale: Expressa a função ou finalidade atribuída à lua e às estrelas. O plural concorda naturalmente com o sujeito composto.
- source_word: בַּלָּיְלָה
  choice: a noite
  rationale: 'Com o verbo ''governar'', o português dispensa preposição: ''governar a noite''. A formulação preserva a ideia de domínio sobre o período noturno.'
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão no refrão e mantém uma cadência litúrgica natural em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Explicita idiomaticamente a permanência expressa pela locução temporal hebraica no refrão.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Representa o amor bondoso, constante e fiel de Deus sem restringir o termo apenas à misericórdia nem explicitar mais aliança do que o vocábulo sozinho exige.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: seu amor leal dura para sempre
  alternative: sua misericórdia dura para sempre; seu amor fiel dura para sempre; sua fidelidade à aliança dura para sempre
  rationale: '''Amor leal'' preserva conjuntamente as dimensões de afeto, bondade, constância e fidelidade, sem reduzir a amplitude do termo a uma única dimensão teológica.'
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção 'para governarem a noite' mantém a função dos astros e ecoa naturalmente a linguagem da criação. Não foram incluídas notas porque as alternativas lexicais não são necessárias para compreender este versículo isolado.
