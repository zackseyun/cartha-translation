  text: ה֭וֹדוּ לְ/אֵ֣ל הַ/שָּׁמָ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'Deem graças ao Deus dos céus,

    porque o seu amor leal dura para sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque a sua fidelidade à aliança dura para sempre”. A palavra hebraica חֶסֶד expressa amor leal e fidelidade, muitas vezes no contexto de uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil convoca a comunidade a agradecer ou louvar; “Deem graças” expressa diretamente essa convocação e se ajusta ao refrão litúrgico do salmo.
- source_word: לְאֵל
  choice: ao Deus
  rationale: אֵל pode significar “Deus” ou “poderoso”, mas, com a especificação “dos céus”, funciona naturalmente como título divino.
- source_word: הַשָּׁמָיִם
  choice: dos céus
  rationale: Embora o português também admita “do céu”, “Deus dos céus” é natural, dignificado e preserva a forma plural do hebraico.
- source_word: כִּי
  choice: porque
  rationale: Introduz o fundamento para a ação de graças; “porque” comunica essa relação causal com clareza.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa literalmente “para sempre”; o verbo “dura”, implícito na oração nominal hebraica, torna natural em português a ideia de permanência.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne amor, bondade e lealdade duradoura, frequentemente em contexto de aliança. “Amor leal” preserva de modo conciso tanto a dimensão afetiva quanto a fidelidade.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: o seu amor leal dura para sempre
  alternative: a sua fidelidade à aliança dura para sempre
  rationale: “Amor leal” mantém juntas as dimensões de amor e fidelidade sem restringir o termo apenas à misericórdia nem explicitar “aliança” no texto principal quando essa palavra não aparece de forma independente no hebraico.
translation_notes:
  register: Português moderno, claro e reverente, com fluidez litúrgico-poética. Emprega-se “Deem” como imperativo plural amplamente compreensível e “Deus dos céus” para conservar o paralelismo e a forma do hebraico.
