  text: לְ/מַכֵּ֣ה מִ֭צְרַיִם בִּ/בְכוֹרֵי/הֶ֑ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/010.yaml
  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: pt
  text: Àquele que feriu o Egito nos seus primogênitos[a], pois o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por meio de seus primogênitos», «entre seus primogênitos» ou, de modo mais explícito, «ao ferir seus primogênitos». O hebraico diz literalmente «em/com seus primogênitos».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Àquele que feriu
  rationale: O לְ introduz o destinatário implícito do louvor na estrutura litânica do salmo, e o particípio de נכה tem força verbal. “Àquele que feriu” é natural, digno e mantém a ação direta.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Forma portuguesa corrente para o nome do país e do povo representado por ele.
- source_word: בִּבְכוֹרֵיהֶם
  choice: em seus primogênitos
  rationale: Reproduz de perto a construção compacta com בְּ e preserva sua possível nuance locativa ou instrumental sem explicitar na linha principal um verbo ausente do hebraico.
- source_word: כִּי
  choice: porque
  rationale: Introduz o refrão recorrente com valor causal. “Porque” é claro e natural em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Explicita de modo idiomático a continuidade temporal pressuposta na construção nominal do refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne amor, lealdade e constância relacional. “Amor leal” comunica essas dimensões em português atual sem restringir o termo apenas a misericórdia.
theological_decisions:
- issue: A afirmação do juízo divino contra os primogênitos do Egito no contexto do amor leal de Deus
  choice: Manter diretamente que Deus feriu o Egito em seus primogênitos e conservar o refrão de louvor.
  alternative: Suavizar a ação ou expandir o texto para “ferindo seus primogênitos”.
  rationale: O hebraico coloca lado a lado o juízo no êxodo e o amor leal permanente de Deus. A tradução preserva essa tensão teológica sem atenuá-la nem acrescentar ao texto principal uma explicação verbal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação preserva o paralelismo litânico e a concisão do hebraico; o marcador [a] aparece no texto principal.
