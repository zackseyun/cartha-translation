  text: לְ/מוֹלִ֣יךְ עַ֭מּ/וֹ בַּ/מִּדְבָּ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/016.yaml
  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: àquele que conduziu seu povo pelo deserto, pois seu amor leal dura para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no deserto”. A preposição hebraica significa literalmente “em”, mas, com o verbo “conduzir”, “pelo deserto” expressa naturalmente o percurso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: àquele que conduziu
  rationale: 'O particípio hifil de הלך, com לְ na estrutura litânica do salmo, expressa referência: “àquele que...”. “Conduziu” preserva naturalmente em português a ideia causativa de fazer seguir ou guiar.'
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עַם designa aqui o povo ligado a Deus; “seu povo” conserva de modo claro e natural essa relação.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: מִדְבָּר indica uma região desértica ou erma. Embora בְּ seja literalmente “em/no”, com um verbo de condução “pelo deserto” comunica em português o percurso sem acrescentar um destino.
- source_word: כִּי
  choice: pois
  rationale: No refrão, כִּי introduz o fundamento do louvor. “Pois” mantém o tom poético e litúrgico.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica duração ilimitada. Com חֶסֶד, “dura para sempre” explicita de maneira natural em português a continuidade afirmada pelo refrão.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e fidelidade relacional. “Amor leal” preserva essa amplitude melhor que “misericórdia” isoladamente e é compreensível ao leitor moderno.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão
  choice: seu amor leal dura para sempre
  alternative: sua misericórdia dura para sempre; seu amor fiel dura para sempre; sua lealdade à aliança permanece para sempre
  rationale: “Amor leal” mantém juntas a benevolência e a fidelidade presentes no termo, sem restringi-lo somente à compaixão nem tornar explícita a palavra “aliança”, que não aparece neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação mantém a estrutura litânica do salmo e evita vocabulário confessional técnico.
