  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: pt
  text: Seom, rei dos amorreus,[a] pois seu amor leal dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “a Seom”; a frase continua a ação do versículo anterior, em que Deus feriu grandes reis.
    reason: previous_rendering
  - marker: b
    text: Ou “pois sua fidelidade à aliança dura para sempre” ou “pois sua misericórdia dura para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Seom
  rationale: O לְ introduz Seom como objeto da ação verbal herdada do versículo anterior (“matou reis poderosos”). Em português, repetir apenas o nome dá continuidade natural à enumeração; a relação sintática é esclarecida em nota.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente direto e corrente do título real hebraico.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: Embora a forma hebraica seja singular gentílica, a expressão portuguesa idiomática para o povo governado é “rei dos amorreus”.
- source_word: כִּי
  choice: pois
  rationale: Introduz o motivo do louvor no refrão; “pois” mantém a ligação explicativa com linguagem natural e digna.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A oração hebraica não traz verbo expresso. “Dura” explicita de modo idiomático a continuidade indicada por לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e benevolência duradoura. “Amor leal” preserva essa amplitude sem restringir o termo apenas a misericórdia.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão do Salmo 136
  choice: seu amor leal dura para sempre
  alternative: sua fidelidade à aliança dura para sempre; sua misericórdia dura para sempre
  rationale: “Amor leal” comunica tanto a afeição quanto a constância relacional do termo. “Fidelidade à aliança” torna explícita uma dimensão real, mas interpretativa; “misericórdia” é possível, porém mais estreita.
translation_notes:
  register: Português moderno, claro e litúrgico, com boa legibilidade brasileira. O verso preserva a estrutura enumerativa do salmo e usa “amorreus”, forma bíblica corrente em português.
