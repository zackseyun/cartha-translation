  text: נֹתֵ֣ן לֶ֭חֶם לְ/כָל בָּשָׂ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/025.yaml
  text: who gives food to all flesh[a], for his steadfast love endures forever.
translation:
  language: pt
  text: 'que dá alimento a todo ser vivo[a],

    pois o seu amor leal dura para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pão a toda carne”. “Toda carne” é uma expressão hebraica que pode referir-se a todos os seres vivos, e “pão” pode significar alimento em geral.
    reason: alternativa lexical e esclarecimento de idioma hebraico
lexical_decisions:
- source_word: נֹתֵן
  choice: que dá
  rationale: O particípio descreve a ação contínua de Deus e mantém a forma relativa e litânica do salmo.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido básico seja “pão”, aqui o termo designa por metonímia o sustento em geral, apropriado a todos os seres vivos.
- source_word: לְכָל בָּשָׂר
  choice: a todo ser vivo
  rationale: A expressão hebraica, literalmente “a toda carne”, abrange aqui os seres vivos em geral. A tradução comunica naturalmente esse alcance sem o restringir à humanidade; a forma literal é preservada na nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz o refrão como fundamento do louvor e preserva um ritmo litúrgico natural em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Na oração nominal hebraica, o português requer um verbo; “dura para sempre” expressa com clareza a permanência indicada.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e bondade constante. “Amor leal” é conciso, inteligível e evita reduzi-lo apenas a misericórdia.
theological_decisions:
- issue: Alcance de “toda carne”
  choice: todos os seres vivos
  alternative: toda a humanidade
  rationale: No contexto da provisão divina, a expressão hebraica pode incluir as criaturas vivas em geral. A tradução não limita sem necessidade o cuidado providencial de Deus aos seres humanos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência do refrão e apresenta na nota a imagem hebraica literal.
