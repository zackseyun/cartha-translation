  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: pt
  text: e tirou Israel do meio deles, porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: e tirou
  rationale: O hifil de יצא tem sentido causativo, “fazer sair” ou “tirar”. “Tirou” é natural em português e mantém esse valor sem especificar o modo da saída.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio que, no contexto, designa o povo de Israel; mantém-se a forma tradicional em português.
- source_word: מִתּוֹכָם
  choice: do meio deles
  rationale: Expressa a saída do interior ou do meio de um grupo, aqui os egípcios. A formulação é idiomática e preserva a relação indicada pelo hebraico.
- source_word: כִּי
  choice: porque
  rationale: Introduz o refrão como fundamento do louvor. “Porque” comunica claramente a força causal em português.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: Na oração nominal hebraica, o português pede naturalmente um verbo. “Dura para sempre” expressa permanência contínua e conserva a cadência do refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חסד reúne amor, bondade, misericórdia e lealdade relacional. “Amor leal” preserva de forma concisa tanto a dimensão afetiva quanto a fidelidade constante, sem restringir o termo apenas à compaixão.
theological_decisions:
- issue: Tradução de חַסְדּוֹ no refrão do Salmo 136
  choice: o seu amor leal dura para sempre
  alternative: a sua misericórdia dura para sempre
  rationale: “Amor leal” preserva a amplitude de חסד — benevolência amorosa e fidelidade duradoura — sem impor uma formulação confessional específica. “Misericórdia” é tradicional, mas pode estreitar o sentido à compaixão. O verbo “dura”, ausente na oração nominal hebraica, é suprido para produzir português natural sem eliminar a permanência indicada por לְעוֹלָם.
translation_notes:
  register: 'Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem direta mantém o paralelismo litúrgico do salmo. Não foi necessária nota: “do meio deles” reproduz adequadamente מִתּוֹכָם, e “amor leal” torna explícita no texto a principal nuance lexical de חסד.'
