  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: pt
  text: Sirvam a Yahweh com alegria; venham diante dele com gritos de júbilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com cânticos de júbilo”; o termo hebraico pode indicar louvor jubiloso expresso tanto por gritos como pelo canto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Sirvam
  rationale: O imperativo plural de עבד, tendo Yahweh como objeto, expressa serviço marcado por devoção e obediência. “Sirvam” preserva essa amplitude sem restringir o sentido ao culto litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: A preposição ב indica o modo ou a disposição com que o serviço deve ser prestado; “com alegria” é natural e fiel ao sentido.
- source_word: בֹּאוּ
  choice: venham
  rationale: Equivalente direto do imperativo plural de בוא. Evita especificar uma entrada no santuário, ideia não explicitada neste versículo.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Reproduz de modo idiomático a expressão hebraica que significa estar perante sua face ou presença.
- source_word: בִּרְנָנָה
  choice: com gritos de júbilo
  rationale: רננה pode designar um clamor vibrante de alegria ou um cântico jubiloso. A escolha preserva a força vocal e exuberante do termo, sem ocultar a alternativa indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e representa de forma amplamente aceita sua provável vocalização, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Diante dele” mantém proximidade formal com o hebraico, enquanto “gritos de júbilo” comunica naturalmente sua intensidade poética.
