  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: pt
  text: 'Salmo para ação de graças.[a]


    Aclame Yahweh com alegria, terra inteira!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título também pode ser traduzido como “Salmo para uma oferta de ação de graças” ou “Salmo de ação de graças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: Salmo para ação de graças
  rationale: Mantém o valor final ou funcional da preposição לְ e traduz תּוֹדָה pela expressão portuguesa corrente “ação de graças”, sem eliminar a possível referência cultual indicada na nota.
- source_word: הָרִיעוּ
  choice: Aclame ... com alegria
  rationale: O verbo denota erguer um brado ou aclamação. “Aclame com alegria” comunica o imperativo festivo em português natural e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כָּל־הָאָרֶץ
  choice: terra inteira
  rationale: Expressa de modo idiomático a totalidade de “toda a terra” e conserva a interpelação direta à terra como um todo.
theological_decisions:
- issue: Sentido cultual de תּוֹדָה no título
  choice: ação de graças no texto principal
  alternative: oferta de ação de graças
  rationale: תּוֹדָה pode designar tanto agradecimento/louvor quanto uma oferta específica. O texto principal preserva o sentido mais amplo, e a nota registra a leitura sacrificial sem impô-la.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O singular “Aclame” concorda com o vocativo coletivo “terra inteira”; a exclamação reproduz a força do imperativo hebraico.
