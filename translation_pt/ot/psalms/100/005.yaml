base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: pt
  text: Pois Yahweh é bom[a]; seu amor leal dura para sempre[b], e sua fidelidade dura de geração em geração[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque Yahweh é bom”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico ḥésed reúne ideias de amor constante, misericórdia e lealdade fiel, inclusive no âmbito da aliança.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “até geração e geração”; isto é, por todas as gerações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão das convocações anteriores do salmo e mantém, em português natural, a força explicativa do hebraico.
- source_word: טוֹב
  choice: bom
  rationale: Expressa de modo direto tanto a bondade moral quanto a beneficência de Yahweh, sem restringir o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica duração ilimitada; o verbo “dura”, suprido em português, torna explícita e natural a predicação nominal hebraica.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Reúne as ideias de amor, misericórdia, constância e lealdade relacional próprias de חֶסֶד, sem reduzi-lo exclusivamente a uma delas.
- source_word: וְעַד דֹּר וָדֹר
  choice: e ... de geração em geração
  rationale: Reproduz idiomaticamente a extensão contínua através de gerações sucessivas; a elipse do verbo “dura” preserva o paralelismo e soa natural em português.
- source_word: אֱמוּנָתוֹ
  choice: sua fidelidade
  rationale: Comunica a firmeza, confiabilidade e constância divinas e forma um paralelo adequado com “amor leal”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; sua transliteração preserva essa distinção e evita substituí-lo silenciosamente por um título.
- issue: Amplitude semântica de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; fidelidade à aliança
  rationale: “Amor leal” conserva simultaneamente a dimensão afetiva e a constância relacional do termo, sem impor no texto principal uma formulação teológica mais estreita.
- issue: Predicação verbal implícita nas duas linhas nominais
  choice: “dura” expresso na primeira linha e elíptico na segunda
  alternative: “é para sempre” e “permanece de geração em geração”
  rationale: O hebraico não apresenta verbo expresso. A solução dá clareza em português sem ocultar a estrutura paralela nem transformar desnecessariamente as duas linhas.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. “Pois” mantém a ligação argumentativa; “amor leal” evita o arcaísmo de opções tradicionais; a pontuação destaca o paralelismo poético sem tornar o verso artificialmente literal.
