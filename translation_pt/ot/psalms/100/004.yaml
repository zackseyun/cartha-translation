id: PSA.100.4
reference: Psalms 100:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: pt
  text: Entrem por seus portões com ações de graças[a], em seus pátios com louvor; deem-lhe graças e bendigam o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma oferta de gratidão”. O termo hebraico pode indicar tanto ações de graças como uma oferta de gratidão, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Entrem
  rationale: O imperativo plural de בוא indica movimento para dentro; com “portões” e “pátios”, “Entrem” é natural e preciso.
- source_word: שְׁעָרָיו
  choice: seus portões
  rationale: Mantém o plural e a imagem concreta das entradas do recinto de culto.
- source_word: בְּתוֹדָה
  choice: com ações de graças
  rationale: תוֹדָה pode indicar gratidão expressa ou uma oferta de gratidão. No paralelismo com “louvor”, o sentido abstrato é o mais provável, sem eliminar a alternativa cultual.
- source_word: חֲצֵרֹתָיו
  choice: seus pátios
  rationale: Designa os pátios do recinto sagrado; “pátios” comunica a imagem com clareza no português atual.
- source_word: בִּתְהִלָּה
  choice: com louvor
  rationale: Preserva o sentido de תְהִלָּה e o paralelismo com “com ações de graças”.
- source_word: הוֹדוּ לוֹ
  choice: deem-lhe graças
  rationale: No hifil e em contexto de culto, ידה significa dar graças; a formulação também preserva a ligação lexical com תוֹדָה.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: “Bendigam” preserva a distinção entre ברך e o termo anterior para louvor, além de ser uma expressão digna e compreensível no contexto do culto.
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: Mantém literalmente a linguagem hebraica sobre o nome de Deus, que representa sua identidade revelada e reputação.
theological_decisions:
- issue: Imagem cultual dos portões e pátios
  choice: Manter literalmente “portões” e “pátios”.
  alternative: Generalizar como “presença” ou “casa”.
  rationale: O hebraico retrata a entrada dos adoradores no recinto sagrado. Preservar essa imagem evita introduzir uma abstração teológica ausente do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi preservado sem acrescentar conjunção entre os dois primeiros membros.
