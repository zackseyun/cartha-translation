base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: pt
  text: Saibam que Yahweh é Deus. Foi ele quem nos fez, e não nós mesmos[a]; somos o seu povo e as ovelhas da sua pastagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a leitura marginal tradicional: “Foi ele quem nos fez, e somos dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Saibam
  rationale: O imperativo plural de ידע convoca toda a comunidade a reconhecer uma verdade estabelecida. “Saibam” é direto, natural e mantém a força imperativa.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os ouvintes devem saber; em português, “que” liga naturalmente o imperativo à declaração seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do hebraico, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: הוּא אֱלֹהִים
  choice: é Deus
  rationale: A construção hebraica identifica enfaticamente Yahweh como Deus. Em português, “Yahweh é Deus” comunica a afirmação com naturalidade, sem acrescentar “somente”, que não está explícito.
- source_word: הוּא עָשָׂנוּ
  choice: Foi ele quem nos fez
  rationale: A construção clivada preserva com naturalidade a ênfase do pronome הוּא e expressa עשה pelo verbo corrente “fazer”.
- source_word: וְלֹא אֲנַחְנוּ
  choice: e não nós mesmos
  rationale: Segue o texto consonantal (ketiv), לא, entendendo que Deus nos fez e que não fizemos a nós mesmos. A leitura marginal tradicional é registrada em nota.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Reproduz de modo claro a designação pactual e o possessivo do hebraico.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: e as ovelhas do seu pasto
  rationale: Mantém a metáfora pastoril e a correspondência lexical de צֹאן e מַרְעִית, em formulação portuguesa compreensível.
theological_decisions:
- issue: Leitura ketiv/qere na oração central
  choice: 'O texto principal segue o ketiv: “Foi ele quem nos fez, e não nós mesmos”.'
  alternative: 'Segundo a leitura marginal tradicional (qere): “Foi ele quem nos fez, e somos dele”.'
  rationale: O texto escrito לא significa naturalmente “não”, enquanto a leitura marginal לו significa “dele”. As duas leituras são antigas e coerentes; a primazia do texto consonantal fundamenta a opção principal, sem ocultar a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é natural, preserva o paralelismo e mantém o nome divino “Yahweh”. O marcador [a] aparece após o versículo e remete à variante da oração central.
