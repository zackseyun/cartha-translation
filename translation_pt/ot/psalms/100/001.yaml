  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: pt
  text: 'Salmo para ação de graças.[a]


    Que toda a terra aclame Yahweh com gritos de alegria![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salmo de ação de graças” ou “Salmo para uma oferta de gratidão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ergam um grito de alegria a Yahweh, toda a terra!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Em títulos do Saltério, מִזְמוֹר designa normalmente um salmo ou cântico; “Salmo” é a equivalência corrente e adequada ao gênero.
- source_word: לְתוֹדָה
  choice: para ação de graças
  rationale: תּוֹדָה pode indicar ação de graças, louvor ou uma oferta de gratidão. A preposição לְ favorece “para”, sem exigir que o título seja entendido especificamente em sentido sacrificial.
- source_word: הָרִיעוּ
  choice: Aclamem ... com alegria
  rationale: O imperativo hifil de רוע pede uma aclamação forte e festiva. “Aclamem com alegria” comunica tanto a expressão vocal quanto o tom jubiloso em português natural.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ indica o destinatário da aclamação, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Literalmente, a expressão é “toda a terra”, mas, dirigida por um imperativo plural, funciona como vocativo metonímico para todos os seus habitantes. A formulação explicita esse sentido em português e evita a impressão de que o solo é diretamente interpelado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Escopo de כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  alternative: toda a terra
  rationale: A convocação é universal. A tradução escolhida explicita a metonímia provável sem restringir אֶרֶץ a uma terra ou país específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O título permanece conciso; o corpo usa uma aclamação natural sem perder a intensidade festiva do hebraico.
