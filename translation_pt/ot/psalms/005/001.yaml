  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: pt
  text: Dá ouvidos às minhas palavras, ó Yahweh; compreende o meu gemido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha meditação” ou “o meu murmúrio”. O termo hebraico pode indicar uma reflexão interior ou uma expressão em voz baixa; aqui foi traduzido como “gemido” por causa do contexto de lamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: às minhas palavras
  rationale: O plural com sufixo de primeira pessoa refere-se às palavras do salmista; esta é uma tradução direta e natural em português.
- source_word: הַאֲזִינָה
  choice: Dá ouvidos
  rationale: A expressão conserva a imagem hebraica de inclinar o ouvido ou escutar atentamente, além de manter o tom solene de súplica.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, enquanto a interjeição vocativa reproduz naturalmente a invocação.
- source_word: בִּינָה
  choice: compreende
  rationale: O imperativo de בין pede percepção atenta e entendimento, não apenas audição; “compreende” preserva essa nuance.
- source_word: הֲגִיגִי
  choice: o meu gemido
  rationale: O substantivo pode indicar reflexão interior, murmúrio ou som baixo. No contexto de lamento, “gemido” comunica de modo natural uma expressão íntima e angustiada, sem ocultar as outras possibilidades lexicais, registradas em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de הֲגִיגִי no contexto da oração
  choice: meu gemido
  alternative: minha meditação; meu murmúrio
  rationale: O contexto de lamento favorece uma expressão baixa e angustiada, mas o campo semântico permanece genuinamente aberto; por isso, as alternativas são preservadas em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Dá ouvidos” mantém o paralelismo poético e o tom de oração; “compreende” expressa a percepção profunda solicitada pelo salmista.
