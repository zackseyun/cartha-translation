source:
  edition: WLC
  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: pt
  text: Os arrogantes não permanecerão diante dos teus olhos[a]; odeias todos os que praticam a maldade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não tomarão posição diante de ti” ou “não subsistirão na tua presença”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todos os que operam a perversidade”; também pode ser traduzido por “todos os que fazem o mal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: não permanecerão
  rationale: O hitpael de יצב expressa tomar posição ou manter-se de pé. “Não permanecerão” comunica naturalmente que essas pessoas não podem subsistir na presença de Deus.
- source_word: הוֹלְלִים
  choice: os arrogantes
  rationale: Neste particípio, o termo designa pessoas presunçosas, jactanciosas ou insolentes. “Os arrogantes” é claro em português corrente e preserva o caráter moral da expressão.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: diante dos teus olhos
  rationale: A expressão indica estar à vista ou na presença de Deus. A formulação mantém a imagem concreta do hebraico e é compreensível em português.
- source_word: שָׂנֵאתָ
  choice: odeias
  rationale: O verbo declara diretamente ódio ou aversão. “Odeias” preserva sem atenuação a afirmação explícita do texto.
- source_word: פֹּעֲלֵי אָוֶן
  choice: todos os que praticam a maldade
  rationale: A construção designa literalmente os que fazem ou operam אָוֶן. A escolha mantém o sentido ativo do particípio e a força moral do substantivo em português natural.
theological_decisions:
- issue: Linguagem sobre o ódio divino
  choice: odeias todos os que praticam a maldade
  alternative: rejeitas ou te opões a todos os que praticam a maldade
  rationale: שָׂנֵאתָ significa diretamente “odeias”. A tradução conserva a afirmação teologicamente incisiva do hebraico, sem suavizá-la nem explicá-la além do que o versículo diz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a segunda pessoa singular (“teus”, “odeias”) para representar diretamente o discurso dirigido a Deus. A ordem e o paralelismo dos dois membros poéticos foram preservados.
