id: PSA.5.12
reference: Psalms 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: pt
  text: Pois tu abençoas o justo, ó Yahweh; como um escudo, o teu favor o cerca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu favor o coroa como um escudo”. O verbo hebraico pode significar “coroar” ou “cercar”; a imagem do escudo favorece a ideia de proteção ao redor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a confiança expressa no contexto; “Pois” preserva com naturalidade essa força explicativa.
- source_word: תְּבָרֵךְ
  choice: abençoas
  rationale: O imperfeito expressa aqui uma ação característica ou certa de Deus; o presente comunica essa confiança em português natural.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado singular representa a pessoa justa de modo genérico, forma preservada naturalmente por “o justo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando sua referência pactual.
- source_word: כַּצִּנָּה
  choice: como um escudo
  rationale: O prefixo כְּ marca comparação, e צִנָּה designa um escudo, possivelmente um escudo grande; a formulação escolhida é clara sem acrescentar especificidade desnecessária.
- source_word: רָצוֹן
  choice: o teu favor
  rationale: No contexto, indica a disposição favorável de Deus; o possessivo explicita naturalmente em português que o favor procede de Yahweh.
- source_word: תַּעְטְרֶנּוּ
  choice: o cerca
  rationale: Embora o verbo possa significar “coroar”, a imagem do escudo favorece o sentido de cercar protetoramente; a alternativa literal é mantida em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Relação entre favor, escudo e o verbo תַּעְטְרֶנּוּ
  choice: como um escudo, o teu favor o cerca
  alternative: o teu favor o coroa como um escudo
  rationale: A sintaxe e o léxico permitem “coroar”, mas a comparação com um escudo sugere envolvimento protetor. A ambiguidade genuína é preservada em nota, sem transformar a imagem em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, preservando a comparação com o escudo e a ambiguidade lexical por meio da nota.
