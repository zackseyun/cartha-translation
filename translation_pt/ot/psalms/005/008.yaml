id: PSA.5.8
reference: Psalms 5:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: pt
  text: Yahweh, guia-me em tua justiça por causa dos que me espreitam[a]; torna reto diante de mim o teu caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa dos meus inimigos”. O termo hebraico pode designar adversários e também sugerir pessoas que observam com hostilidade ou ficam à espreita.
    reason: lexical_alternative
  - marker: b
    text: Ou “aplana diante de mim o teu caminho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, conforme o texto hebraico, sem substituí-lo por um título.
- source_word: נְחֵנִי
  choice: guia-me
  rationale: Expressa naturalmente em português o pedido de condução contido no verbo נחה.
- source_word: בְצִדְקָתֶךָ
  choice: em tua justiça
  rationale: Preserva a construção hebraica e o sentido amplo de retidão moral divina; em português atual, 'justiça' comunica esse campo sem limitar a frase a um ato judicial.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Apresenta os adversários como a circunstância que motiva o pedido.
- source_word: שׁוֹרְרָי
  choice: os que me espreitam
  rationale: Conserva a possível nuance específica de observadores hostis, em vez de reduzi-la ao termo genérico 'inimigos'.
- source_word: הושר
  choice: torna reto
  rationale: O causativo de ישר descreve tornar reto, direito ou plano; a escolha mantém a metáfora do caminho.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Equivalente português natural e formalmente próximo da expressão hebraica.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: Mantém o singular e permite tanto a imagem de uma rota quanto o sentido moral de modo de agir.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração 'Yahweh' preserva explicitamente o nome da aliança presente no hebraico; 'Jeová' é uma forma tradicional alternativa.
- issue: Sentido de צְדָקָה neste versículo
  choice: justiça
  alternative: retidão
  rationale: A frase apela ao caráter moralmente justo de Deus. 'Justiça' é natural em português e mantém amplitude moral e relacional, embora 'retidão' destaque mais diretamente a qualidade de ser reto.
translation_notes:
  register: Português moderno, claro e digno, com forma de oração poética. Usa 'tu' de modo consistente na referência a Deus e preserva a metáfora hebraica do caminho.
