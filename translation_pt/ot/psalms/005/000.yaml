lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: Em títulos de salmos, designa convencionalmente o responsável pela execução ou direção musical. A expressão é clara em português e a preposição «a» preserva o valor do prefixo hebraico.
- source_word: אֶל הַנְּחִילוֹת
  choice: para flautas
  rationale: A expressão parece ser uma indicação musical ou instrumental. «Para flautas» comunica a interpretação provável sem tornar definitiva a identificação incerta do termo técnico.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente tradicional e preciso do termo hebraico usado para uma composição musical no Saltério.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Preserva a concisão e a amplitude semântica da construção hebraica, que pode indicar autoria, pertença, dedicação ou associação.
