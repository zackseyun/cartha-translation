  text: Ao mestre de música, para flautas[a]. Salmo de Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «para instrumentos de sopro». O termo hebraico talvez seja uma indicação musical técnica, tradicionalmente transliterada como «Nehiloth».
