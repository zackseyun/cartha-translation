source:
  edition: WLC
  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: pt
  text: Pois tu não és um Deus que tem prazer na maldade; o mal[a] não pode habitar contigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a pessoa má não pode habitar contigo” ou “nenhum malfeitor pode habitar contigo”.'
    reason: O hebraico רָע pode referir-se tanto ao mal em sentido abstrato quanto a uma pessoa má.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o apelo anterior e mantém com naturalidade o encadeamento argumentativo do salmo.
- source_word: אֵל
  choice: Deus
  rationale: Designa Deus em uma declaração dirigida diretamente a ele; “Deus” é a forma natural e reverente em português.
- source_word: חָפֵץ
  choice: tem prazer
  rationale: Expressa agrado ou deleite, não apenas vontade ou intenção; a formulação é clara e corrente.
- source_word: רֶשַׁע
  choice: maldade
  rationale: O substantivo abstrato denota perversidade moral ou conduta culpável; “maldade” conserva essa dimensão sem reduzi-la a dano genérico.
- source_word: יְגֻרְךָ
  choice: não pode habitar contigo
  rationale: O verbo גור descreve residir ou permanecer como hóspede. No contexto, a negação comunica exclusão da presença de Deus, e “habitar contigo” preserva a imagem em português natural.
- source_word: רָע
  choice: o mal
  rationale: A forma pode designar o mal em sentido abstrato ou uma pessoa má. “O mal” mantém o paralelismo conciso com “maldade”, enquanto a nota registra a leitura pessoal igualmente possível.
theological_decisions:
- issue: Se רָע deve ser entendido de modo abstrato (“o mal”) ou pessoal (“a pessoa má”/“o malfeitor”)
  choice: o mal
  alternative: a pessoa má; nenhum malfeitor
  rationale: O paralelismo imediato com רֶשַׁע (“maldade”) favorece a formulação abstrata, que afirma a incompatibilidade entre Deus e o mal. Como o hebraico também admite que o adjetivo substantivado designe uma pessoa má, essa possibilidade é preservada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. “Tem prazer na maldade” comunica a nuance afetiva de חָפֵץ sem soar arcaico; “habitar contigo” conserva a metáfora espacial de גור e o tom poético.
