  verdict: revise
  source_fidelity: A tradução preserva adequadamente o valor volitivo dos verbos, o sentido concreto de buscar refúgio e a referência explícita ao nome de Deus. Contudo, «exultem para sempre» para יְרַנֵּנוּ deixa de expressar a manifestação vocal jubilosa do verbo hebraico e se aproxima demais do verbo final עלץ, que já é bem vertido por «exultem».
  naturalness: O texto é claro, poético e natural em português moderno. «Para sempre gritem de alegria» é igualmente natural e torna mais nítida a progressão dos três verbos de alegria. «Cobre-os» é conciso, idiomático e preserva a imagem hebraica de cobertura protetora.
  terminology: «Refugiam em ti», «teu nome» e «exultem em ti» são escolhas fiéis e adequadas ao registro do salmo. A revisão reserva «exultem» para עלץ e traduz רנן com uma expressão de clamor jubiloso.
