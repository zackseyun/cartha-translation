  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: pt
  text: Mas alegrem-se todos os que se refugiam em ti; para sempre gritem de alegria. Cobre-os[a], e em ti exultem os que amam o teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estende a tua proteção sobre eles” ou “abriga-os”. O hebraico apresenta a imagem de uma cobertura protetora.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: alegrem-se
  rationale: O imperfeito qal pode ter valor volitivo neste contexto de oração. A forma portuguesa preserva o pedido ou desejo, sem convertê-lo numa previsão categórica.
- source_word: כָל חוֹסֵי בָךְ
  choice: todos os que se refugiam em ti
  rationale: O particípio de חסה expressa a ação de buscar abrigo e proteção; “refugiam-se” mantém a imagem concreta, em vez de reduzi-la à confiança interior.
- source_word: לְעוֹלָם יְרַנֵּנוּ
  choice: exultem para sempre
  rationale: רנן no piel indica manifestação vocal e jubilosa de alegria, podendo incluir canto ou gritos. “Exultem” transmite alegria intensa com naturalidade poética, enquanto a nota preserva a dimensão vocal.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Estende sobre eles a tua proteção
  rationale: O hifil de סכך retrata uma cobertura protetora. A formulação explicita a função dessa cobertura sem abandonar a imagem espacial de algo estendido sobre eles.
- source_word: וְיַעְלְצוּ בְךָ
  choice: em ti se regozijem
  rationale: עלץ denota alegria exuberante. “Regozijem-se” diferencia este verbo do primeiro e mantém o foco expresso por בְךָ, “em ti”.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: os que amam o teu nome
  rationale: A tradução conserva a referência explícita ao “nome”, que representa o caráter e a reputação revelados de Deus, sem a substituir simplesmente por “ti”.
theological_decisions:
- issue: Pedido ou desejo, em contraste com previsão
  choice: 'Formas volitivas: “alegrem-se”, “exultem” e “se regozijem”'
  alternative: 'Formas futuras: “se alegrarão”, “exultarão” e “se regozijarão”'
  rationale: No contexto de oração do salmo, os imperfeitos hebraicos admitem naturalmente força jussiva. A tradução os apresenta como petições ou desejos, sem afirmar que a leitura preditiva seja gramaticalmente impossível.
translation_notes:
  register: Português moderno, poético e reverente, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A colocação pronominal e o vocabulário evitam arcaísmos excessivos. A repetição de termos de alegria do hebraico é representada por “alegrem-se”, “exultem” e “se regozijem”; a possível dimensão de canto ou clamor jubiloso em רנן é preservada implicitamente por “exultem”.
