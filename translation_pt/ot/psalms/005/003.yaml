id: PSA.5.3
reference: Psalms 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: pt
  text: Yahweh, pela manhã ouves a minha voz; pela manhã apresento diante de ti a minha oração[a] e fico à espera, atento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ponho em ordem diante de ti” ou “preparo para ti”. O objeto não aparece no hebraico; no contexto, provavelmente se refere à oração ou súplica do salmista.
    reason: lexical_alternative
  - marker: b
    text: Ou “e observo com expectativa”. O verbo hebraico pode transmitir a ideia de observar, aguardar ou olhar ao longe com esperança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֹּקֶר
  choice: pela manhã
  rationale: O substantivo tem função temporal adverbial. A repetição nas duas orações foi preservada por sua força poética e enfática.
- source_word: תִּשְׁמַע
  choice: ouves
  rationale: O imperfeito qal pode expressar futuro ou expectativa confiante. O presente em português comunica a confiança habitual do salmista sem excluir a expectativa de ser ouvido.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Tradução direta e natural; evita intensificar o termo para 'clamor', sentido que o contexto pode sugerir, mas que o substantivo não exige.
- source_word: אֶעֱרָךְ לְךָ
  choice: apresento diante de ti a minha oração
  rationale: O verbo significa ordenar, dispor ou apresentar, mas seu objeto está implícito. No contexto, 'a minha oração' torna compreensível a construção sem ocultar em nota a formulação mais literal.
- source_word: וַאֲצַפֶּה
  choice: e fico à espera, atento
  rationale: A expressão reúne as ideias de observar, aguardar e olhar com expectativa. A formulação portuguesa conserva tanto a espera quanto a vigilância.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e corresponde à reconstrução acadêmica mais amplamente aceita, sem substituí-lo por um título.
- issue: Objeto implícito de אֶעֱרָךְ
  choice: a minha oração
  alternative: 'deixo o objeto sem explicitação: ''ponho tudo em ordem diante de ti'''
  rationale: O contexto de fala dirigida a Deus favorece oração ou súplica como objeto implícito, mas a nota preserva a abertura lexical do hebraico e evita transformar a inferência contextual em certeza absoluta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “pela manhã” e o paralelismo poético foram mantidos. A colocação “a minha voz/a minha oração” favorece ampla legibilidade lusófona.
