  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: pt
  text: Tu destróis os que falam mentiras[a]; Yahweh detesta o homem sanguinário e enganador[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tu destruirás os que falam falsidades». O verbo hebraico pode ser entendido como futuro ou como uma declaração geral sobre a ação de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «homem de sangues e engano», expressão que descreve alguém marcado por derramamento de sangue e engano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Tu destróis
  rationale: O piel de אבד indica causar a perda ou destruição. O presente exprime naturalmente uma ação característica de Deus no contexto, sem excluir a possível leitura futura, registrada em nota.
- source_word: דֹּבְרֵי כָזָב
  choice: os que falam mentiras
  rationale: Preserva a força verbal da expressão hebraica, literalmente «os que falam falsidade», em linguagem portuguesa clara e corrente.
- source_word: אִישׁ דָּמִים
  choice: o homem sanguinário
  rationale: Mantém o singular masculino de אִישׁ e comunica de modo idiomático que se trata de alguém marcado por violência, derramamento de sangue ou culpa de sangue, sem restringir o sentido apenas a homicídio.
- source_word: וּמִרְמָה
  choice: e traiçoeiro
  rationale: מִרְמָה abrange engano, fraude e traição. O adjetivo «traiçoeiro» liga-se naturalmente a «homem» e conserva a gravidade moral do termo.
- source_word: יְתָעֵב
  choice: detesta
  rationale: O piel de תעב expressa forte repulsa. «Detesta» é atual, claro e suficientemente intenso para o registro poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada.
- issue: Valor temporal de תְּאַבֵּד
  choice: 'presente geral: «Tu destróis»'
  alternative: 'futuro: «Tu destruirás»'
  rationale: A forma prefixal pode ser entendida como futura ou como declaração geral da ação divina. O contexto favorece uma caracterização presente, mas a ambiguidade legítima é preservada em nota.
- issue: Singular masculino אִישׁ
  choice: o homem sanguinário e traiçoeiro
  alternative: a pessoa violenta e enganadora
  rationale: A tradução conserva o substantivo masculino singular do hebraico e evita neutralizá-lo sem necessidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com tratamento direto por «tu», adequado ao paralelismo poético. «Sanguinário e traiçoeiro» torna idiomática a construção nominal hebraica sem reduzir sua força moral.
