  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: pt
  text: 'Declara-os culpados, ó Deus;

    que caiam por causa dos seus próprios planos.[a]

    Expulsa-os[b] por causa das suas muitas transgressões,

    pois se rebelaram contra ti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que caiam de seus planos”, isto é, que sejam arruinados pelos próprios projetos ou que estes fracassem.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “lança-os fora” ou “bane-os”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Declara-os culpados
  rationale: O imperativo hifil de אשם, com sufixo de terceira pessoa do plural, pede que Deus os considere ou pronuncie culpados. A formulação conserva o sentido judicial sem especificar além do texto a punição resultante.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: É uma invocação direta na oração; o vocativo é natural e mantém o tom solene.
- source_word: יִפְּלוּ
  choice: que caiam
  rationale: O imperfeito com força jussiva expressa uma petição imprecatória, não uma simples previsão.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: por causa dos seus próprios planos
  rationale: מוֹעֵצוֹת designa planos ou conselhos. A preposição מן pode indicar origem, causa ou meio; a tradução comunica que os próprios planos ocasionam a queda, sem ocultar a ambiguidade, registrada em nota.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: por causa das suas muitas transgressões
  rationale: בְּ com רֹב tem aqui sentido causal. פֶּשַׁע abrange transgressão e rebelião; “transgressões” mantém o peso moral e é compreensível em português atual.
- source_word: הַדִּיחֵמוֹ
  choice: Expulsa-os
  rationale: O imperativo hifil de נדח indica fazer alguém afastar-se, ser lançado fora ou banido. “Expulsa-os” é direto, vigoroso e adequado ao contexto judicial e imprecatório.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento da petição e liga naturalmente os versos em registro poético.
- source_word: מָרוּ בָךְ
  choice: se rebelaram contra ti
  rationale: מרה com בְּ expressa rebelião dirigida contra Deus; esta tradução é direta e idiomática.
theological_decisions:
- issue: Linguagem de oração imprecatória
  choice: Manter as petições diretas por julgamento divino
  alternative: Transformá-las em previsões ou suavizá-las como simples pedidos de correção
  rationale: O hebraico emprega imperativos e um imperfeito de força jussiva dirigido a Deus. Preservar a súplica por julgamento reflete o sentido textual e mantém sua tensão teológica.
- issue: Agência da queda dos adversários
  choice: Apresentar os próprios planos deles como causa da queda, reconhecendo a ambiguidade da preposição
  alternative: Entender apenas que eles cairão para longe dos seus planos, isto é, que seus projetos fracassarão
  rationale: מן admite mais de uma relação semântica neste contexto. O texto principal adota a leitura causal mais natural em português, enquanto a nota conserva a alternativa ligada à forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A disposição em linhas preserva o paralelismo poético. O pronome “ti” mantém a invocação direta e solene sem arcaísmo excessivo.
