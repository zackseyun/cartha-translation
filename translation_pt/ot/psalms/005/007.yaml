    issue: “Voltado para” marca o orante no masculino.
    rationale: O particípio “voltado” pressupõe um referente masculino, enquanto a forma hebraica de primeira pessoa não especifica gênero. “Em direção ao” preserva o sentido direcional sem acrescentar essa marca.
  - severity: low
    issue: A alternativa “tomado de assombro diante de ti” é pouco adequada.
    rationale: Além de também introduzir gênero masculino, “assombro” pode ser entendido como susto ou perplexidade. “Admiração reverente” comunica melhor a nuance possível de יִרְאָה.
  revised_text: Mas eu, pela abundância do teu amor leal, entrarei em tua casa; me prostrarei em direção ao teu santo templo, com temor de ti.[a]
