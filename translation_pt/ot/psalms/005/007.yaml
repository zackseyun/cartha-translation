  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: pt
  text: Mas eu, pela abundância do teu amor leal, entrarei em tua casa; me prostrarei em direção ao teu santo templo, com temor de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com reverência por ti” ou “com admiração reverente por ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente marca contraste com os perversos mencionados anteriormente; “Mas eu” expressa isso de modo natural e conciso.
- source_word: בְּרֹב חַסְדְּךָ
  choice: pela abundância do teu amor leal
  rationale: A preposição indica a base da aproximação, enquanto חֶסֶד comunica amor fiel e comprometido. “Amor leal” preserva essa dimensão sem restringi-la apenas à misericórdia.
- source_word: אָבוֹא בֵיתֶךָ
  choice: entrarei em tua casa
  rationale: O imperfeito expressa propósito ou expectativa. “Casa” mantém a imagem hebraica e evita antecipar “templo” na oração seguinte.
- source_word: אֶשְׁתַּחֲוֶה
  choice: me prostrarei
  rationale: O verbo descreve concretamente o ato corporal de inclinar-se ou prostrar-se em adoração; esta opção conserva a força física da imagem.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: voltado para o teu santo templo
  rationale: אֶל tem sentido direcional neste contexto. “Voltado para” esclarece que a prostração é em direção ao santuário, sem sugerir necessariamente entrada nele.
- source_word: בְּיִרְאָתֶךָ
  choice: no temor de ti
  rationale: Mantém a amplitude de יִרְאָה, que abrange temor, reverência e assombro diante de Deus, sem atenuar sua solenidade.
theological_decisions:
- issue: Sentido de חֶסֶד como fundamento para aproximar-se de Deus
  choice: amor leal
  alternative: fidelidade à aliança; misericórdia
  rationale: A expressão atribui a entrada na casa de Deus à abundância de seu amor fiel. “Amor leal” conserva tanto a afeição quanto a constância relacional, sem impor uma formulação confessional específica.
- issue: Nuance de יִרְאָה diante de Deus
  choice: temor de ti
  alternative: reverência por ti; assombro diante de ti
  rationale: O hebraico sustenta a tensão entre temor e reverência. A tradução mantém “temor” e registra em nota as nuances legítimas, sem reduzi-lo a terror nem a simples respeito.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética natural. O tratamento em segunda pessoa singular acompanha o discurso direto a Deus. “Me prostrarei” favorece a legibilidade brasileira, e “voltado para” explicita naturalmente a direção indicada por אֶל.
