source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: pt
  text: Pois não há nada confiável na boca deles[a]; o íntimo deles é destruição[b]. A garganta deles é um túmulo aberto; lisonjeiam com a língua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há nada confiável na boca dele”, se a forma singular no início do verso for mantida mais estritamente.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seu ser interior é ruína” ou “seu coração é destruição”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com a língua, falam com suavidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a súplica anterior e preserva de modo natural a ligação lógica do hebraico.
- source_word: אֵין ... נְכוֹנָה
  choice: não há nada confiável
  rationale: A negação existencial é absoluta, e נְכוֹנָה descreve aquilo que é firme, seguro ou digno de confiança, aqui em relação à fala.
- source_word: בְּפִיהוּ
  choice: na boca deles
  rationale: Embora o sufixo nesta forma seja singular, os sufixos seguintes são plurais e o referente coletivo são os perversos; o plural mantém a coerência do verso em português.
- source_word: קִרְבָּם
  choice: seu íntimo
  rationale: Preserva a referência ampla ao ser interior sem restringi-la especificamente ao coração ou a uma única faculdade humana.
- source_word: הַוּוֹת
  choice: destruição
  rationale: O plural hebraico pode denotar ruínas, desgraças ou propósitos destrutivos; o substantivo abstrato singular comunica naturalmente a força predicativa em português.
- source_word: קֶבֶר פָּתוּחַ
  choice: um túmulo aberto
  rationale: Mantém a imagem concreta e ameaçadora da fala que conduz à morte e à corrupção.
- source_word: גְּרוֹנָם
  choice: a garganta deles
  rationale: No campo imagético da fala, 'garganta' é o equivalente anatômico natural e preserva a metáfora.
- source_word: לְשׁוֹנָם
  choice: com a língua
  rationale: Reproduz o singular coletivo hebraico de maneira idiomática em português.
- source_word: יַחֲלִיקוּן
  choice: eles lisonjeiam
  rationale: A forma causativa de חלק retrata o ato de tornar a fala suave; no contexto, indica fala aduladora e enganosa.
theological_decisions:
- issue: Metáfora antropológica em קִרְבָּם
  choice: seu íntimo
  alternative: seu coração; seu ser interior
  rationale: A expressão descreve a corrupção interior manifestada na fala. 'Íntimo' conserva a amplitude poética sem identificar essa interioridade exclusivamente com o coração.
- issue: Número do sufixo em בְּפִיהוּ no contexto
  choice: na boca deles
  alternative: na boca dele
  rationale: A forma é singular, mas o restante do verso emprega sufixos plurais e trata coletivamente dos perversos. O plural torna essa referência contextual clara sem ocultar a forma singular, registrada em nota.
- issue: Sentido da fala suave em יַחֲלִיקוּן
  choice: eles lisonjeiam
  alternative: falam com suavidade
  rationale: O contexto é de fala não confiável e destrutiva; 'lisonjeiam' explicita adequadamente a suavidade enganosa, enquanto a alternativa mais formal permanece na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela e as imagens corporais do hebraico foram preservadas; as notas registram a oscilação de número e alternativas lexicais genuínas.
