  text: הַקְשִׁ֤יבָ/ה לְ/ק֬וֹל שַׁוְעִ֗/י מַלְכִּ֥/י וֵ/אלֹהָ֑/י כִּֽי אֵ֝לֶ֗י/ךָ אֶתְפַּלָּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: pt
  text: Presta atenção ao som do meu clamor por socorro, meu Rei e meu Deus, pois é a ti que oro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “orarei”. A forma hebraica pode expressar ação presente, contínua ou futura, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Presta atenção
  rationale: O imperativo de קשׁב pede uma escuta atenta. A expressão é natural no português moderno e conserva a força do apelo.
- source_word: לְקוֹל
  choice: ao som do
  rationale: קוֹל pode significar “som” ou “voz”. Com שַׁוְעִי, “ao som do meu clamor” preserva a construção hebraica de modo claro.
- source_word: שַׁוְעִי
  choice: meu clamor por socorro
  rationale: שַׁוְעָה designa um grito angustiado por auxílio, não apenas um clamor genérico.
- source_word: מַלְכִּי
  choice: meu Rei
  rationale: Mantém o título régio no vocativo dirigido a Deus; a inicial maiúscula segue o uso editorial português para títulos divinos.
- source_word: וֵאלֹהָי
  choice: e meu Deus
  rationale: Tradução direta do título divino com sufixo de primeira pessoa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido e se ajusta ao registro digno da oração.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: Expressa a direção da oração e preserva a ênfase produzida pela posição do elemento no hebraico.
- source_word: אֶתְפַּלָּל
  choice: oro
  rationale: O imperfeito hitpael de פלל pode indicar ação presente, habitual ou futura. No apelo em curso, o presente é natural sem excluir por si só outras nuances contextuais.
theological_decisions:
- issue: Tratamento de segunda pessoa na oração
  choice: é a ti que oro
  alternative: é a você que oro
  rationale: “A ti” é amplamente compreensível, digno e natural na linguagem de oração, sem acrescentar conteúdo doutrinário.
- issue: Título régio no endereço divino
  choice: meu Rei e meu Deus
  alternative: meu rei e meu Deus
  rationale: Preserva os dois títulos dirigidos a Deus. A maiúscula em “Rei” é uma convenção editorial, não uma expansão teológica.
- issue: Aspecto e tempo de אֶתְפַּלָּל
  choice: oro
  alternative: orarei
  rationale: O contexto favorece a oração presente ou em curso, mas a forma hebraica também admite valor futuro; essa ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção enfática “é a ti que oro” reproduz a direção destacada da oração no hebraico; “clamor por socorro” explicita o valor de pedido de auxílio presente em שַׁוְעָה.
