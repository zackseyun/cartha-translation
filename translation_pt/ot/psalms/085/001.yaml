source:
  edition: WLC
  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: pt
  text: Favoreceste a tua terra, ó Yahweh; restauraste a sorte de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trouxeste de volta os cativos de Jacó” ou “reverteste o cativeiro de Jacó”. A expressão hebraica pode indicar a restauração após o exílio ou uma reversão mais ampla das circunstâncias.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: Favoreceste
  rationale: O qal de רצה expressa aqui benevolência ou favor para com a terra. “Favoreceste” é natural e conciso em português, sem sugerir mera aceitação passiva.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַרְצֶךָ
  choice: a tua terra
  rationale: Refere-se à terra pertencente a Deus em relação pactual, provavelmente a terra de Israel. “Terra” evita a conotação político-moderna de “país”.
- source_word: שַׁבְתָּ
  choice: restauraste
  rationale: Com o substantivo seguinte, שוב forma uma expressão idiomática de reversão ou restauração; “restauraste” comunica claramente esse sentido.
- source_word: שבות
  choice: a sorte
  rationale: Na expressão שׁוּב שְׁבוּת, pode indicar uma restauração mais ampla das circunstâncias, sem restringir o sentido ao retorno físico do exílio. A leitura ligada ao cativeiro é preservada em nota.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Reproduz o nome poético e pactual usado no hebraico, que neste contexto designa coletivamente o povo de Israel.
theological_decisions:
- issue: Sentido da expressão שׁוּב שְׁבוּת יַעֲקֹב
  choice: restauraste a sorte de Jacó
  alternative: trouxeste de volta os cativos de Jacó / reverteste o cativeiro de Jacó
  rationale: A expressão hebraica pode descrever uma reversão geral das circunstâncias ou, mais especificamente, a volta do cativeiro. O texto principal mantém o sentido mais amplo, e a nota preserva a possível referência ao exílio.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais sintéticas adequadas ao registro poético. O nome Yahweh é mantido, e “a sorte de Jacó” conserva a amplitude da expressão hebraica sem eliminar sua possível dimensão exílica.
