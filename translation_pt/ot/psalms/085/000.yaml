lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente quem dirige ou supervisiona a execução musical. “Ao regente” é conciso, natural em português e mantém a força do ל prefixado.
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: A preposição ל pode indicar autoria, pertença, associação ou dedicatória. “Dos filhos de” funciona naturalmente como título e conserva parte dessa abertura sem impor uma identificação autoral absoluta.
- source_word: קֹרַח
  choice: Corá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação portuguesa corrente para o gênero indicado por מִזְמוֹר, composição poético-musical possivelmente associada a acompanhamento instrumental.
