  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: pt
  text: Não voltarás a dar-nos vida[a][b], para que o teu povo se alegre em ti?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não voltarás para nos dar vida?». O verbo hebraico pode ser entendido como «voltar» ou, com o verbo seguinte, como «novamente».
    reason: lexical_alternative
  - marker: b
    text: Ou «nos reavivar» ou «fazer-nos viver».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não ...?
  rationale: Introduz uma pergunta retórica que espera resposta positiva. Em português, a construção com «não» preserva tanto a forma interrogativa quanto o apelo cheio de esperança.
- source_word: תָּשׁוּב
  choice: voltarás
  rationale: O verbo שׁוב significa «voltar» ou «tornar». Aqui pode retratar Deus voltando-se novamente para o seu povo, sem explicitar no texto principal que se trata de favor restaurado.
- source_word: תְּחַיֵּנוּ
  choice: nos dar vida
  rationale: O piel de חיה com sufixo da primeira pessoa do plural expressa fazer viver ou restaurar à vida. «Dar-nos vida» mantém a amplitude da restauração comunitária sem limitá-la à renovação espiritual ou à sobrevivência física.
- source_word: וְעַמְּךָ
  choice: para que o teu povo
  rationale: A ligação com a petição anterior é expressa naturalmente em português como resultado ou finalidade. «Teu povo» preserva a linguagem relacional e pactual do hebraico.
- source_word: יִשְׂמְחוּ
  choice: se alegre
  rationale: Neste contexto de oração, o imperfeito pode expressar o resultado desejado. O subjuntivo português comunica essa nuance sem reduzi-la a uma simples previsão futura.
- source_word: בָךְ
  choice: em ti
  rationale: Com o verbo «alegrar-se», a preposição ב indica o objeto ou âmbito da alegria. «Em ti» mantém Deus como o centro dessa alegria.
theological_decisions:
- issue: Se o «voltar» de Deus deve ser explicitado como voltar-se favoravelmente para o povo
  choice: Mantido o verbo amplo «voltar» no texto principal
  alternative: voltar-te novamente para nós; tornar a mostrar favor
  rationale: O hebraico não explicita «para nós» nem «com favor», embora o contexto favoreça esse sentido. A formulação conserva a imagem e evita incorporar a interpretação ao texto.
- issue: Se «dar vida» deve ser limitado à renovação espiritual ou à restauração nacional
  choice: Mantida a expressão ampla «dar vida»
  alternative: renovar-nos espiritualmente; restaurar a vida da nação
  rationale: O contexto trata da restauração comunitária depois do juízo, mas a expressão hebraica permanece abrangente. A tradução não a restringe a uma única dimensão.
- issue: Relação entre «voltar» e «dar vida»
  choice: Entendida como o retorno de Deus com a finalidade de restaurar a vida do povo
  alternative: Não tornarás a dar-nos vida?; Não nos darás vida novamente?
  rationale: A justaposição dos dois verbos permite entender שׁוב como verbo pleno («voltar») ou com valor adverbial («novamente»). O texto principal preserva a imagem do retorno; a nota registra a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se «tu», coerente com o discurso direto a Deus e com o paralelismo «teu povo»/«em ti». A formulação evita restringir a restauração a uma categoria exclusivamente espiritual, física ou política.
