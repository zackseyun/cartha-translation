    issue: A construção «voltarás para nos dar vida» impõe uma relação de finalidade entre «voltar» e «dar vida».
    rationale: No hebraico, תשוב pode funcionar com valor adverbial, «novamente», junto de «dar-nos vida»; esta é uma leitura muito natural da justaposição verbal e é refletida pela nota inglesa. «Voltarás a dar-nos vida» comunica essa leitura de modo idiomático, enquanto a nota conserva a alternativa em que «voltar» é verbo pleno.
