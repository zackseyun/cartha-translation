base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: pt
  text: Continuarás irado conosco[a] para sempre? Prolongarás a tua ira[b] de geração em geração?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra nós”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Estenderás a tua ira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: para sempre
  rationale: A partícula interrogativa הַ com לְעוֹלָם forma uma pergunta retórica sobre duração indefinida; “para sempre” é natural e fiel em português.
- source_word: תֶּאֱנַף
  choice: ficarás irado
  rationale: O verbo אנף significa estar ou ficar irado. A escolha preserva claramente a linguagem da ira divina sem aumentar sua intensidade.
- source_word: בָּנוּ
  choice: conosco
  rationale: Com אנף, a preposição ב pode indicar a pessoa contra quem se dirige a ira. “Irado conosco” é idiomático em português; “contra nós” permanece uma alternativa possível.
- source_word: תִּמְשֹׁךְ
  choice: prolongarás
  rationale: משך significa literalmente puxar ou estender; com “ira”, exprime sua extensão no tempo. “Prolongarás” comunica naturalmente esse sentido.
- source_word: אַפְּךָ
  choice: a tua ira
  rationale: אַף significa literalmente “nariz”, mas é uma expressão idiomática para ira. A tradução verte diretamente o sentido contextual.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: A expressão hebraica distributiva indica continuidade através de gerações sucessivas; esta é a formulação portuguesa corrente e digna.
theological_decisions:
- issue: Linguagem antropopática sobre a ira divina
  choice: Manter “irado” e “ira” sem atenuação
  alternative: Substituir por “descontente” ou por uma formulação de oposição
  rationale: O hebraico menciona explicitamente a ira de Deus e sua possível duração. Preservar essa linguagem mantém a tensão teológica e emocional do lamento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo das duas perguntas foi preservado. Emprega-se “tu”, coerentemente acompanhado das formas verbais e possessivas correspondentes.
