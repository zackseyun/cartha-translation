  text: הַרְאֵ֣/נוּ יְהוָ֣ה חַסְדֶּ֑/ךָ וְ֝/יֶשְׁעֲ/ךָ֗ תִּתֶּן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: pt
  text: 'Mostra-nos, Yahweh, o teu amor leal[a] e concede-nos a tua salvação.


    [a] Ou: “Faze-nos ver o teu amor leal, Yahweh, e dá-nos a tua salvação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faze-nos ver o teu amor leal, Yahweh, e dá-nos a tua salvação.”'
    reason: Registra uma tradução mais formal de הַרְאֵנוּ e תִּתֶּן לָנוּ, preservando a construção causativa “faze-nos ver” e o sentido básico “dá-nos”.
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Mostra-nos
  rationale: O hifil imperativo de ראה com sufixo de primeira pessoa do plural significa literalmente “faze-nos ver”. “Mostra-nos” preserva de modo natural em português tanto a força do imperativo quanto o sentido da petição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: חסד abrange amor, bondade e lealdade duradoura, frequentemente no contexto de compromisso ou aliança. “Amor leal” comunica esses aspectos sem limitar o termo apenas a misericórdia.
- source_word: וְיֶשְׁעֲךָ
  choice: e a tua salvação
  rationale: ישע pode indicar salvação, livramento ou vitória. “Salvação” preserva aqui a amplitude da ação divina de resgatar e se ajusta ao registro de oração do salmo.
- source_word: תִּתֶּן לָנוּ
  choice: concede-nos
  rationale: A expressão significa literalmente “dá-nos”. “Concede-nos” é uma formulação portuguesa natural e digna para uma petição dirigida a Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo pelo título “SENHOR”.
- issue: Amplitude semântica de חֶסֶד
  choice: amor leal
  alternative: misericórdia; bondade; amor da aliança
  rationale: “Amor leal” mantém unidos o afeto, a bondade e a fidelidade duradoura implicados no termo, sem tornar explícita uma referência à aliança além do que o próprio verso declara.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em “Mostra-nos” e “concede-nos” mantém um tom bíblico digno sem recorrer a vocabulário arcaico.
