  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: pt
  text: A justiça irá adiante dele e abrirá caminho para os passos dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: a justiça
  rationale: Preserva o sentido central de retidão/justiça e sua personificação como aquilo que vai adiante de Deus.
- source_word: לְפָנָיו
  choice: adiante dele
  rationale: Expressa naturalmente a ideia espacial de ir diante dele, sem explicitar além do hebraico quem é o referente do pronome.
- source_word: יְהַלֵּךְ
  choice: irá
  rationale: Representa o imperfeito hebraico no contexto prospectivo do versículo.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: e abrirá caminho para os seus passos
  rationale: Traduz de modo idiomático a construção difícil, mantendo a relação entre preparar/estabelecer um caminho e os passos dele.
theological_decisions:
- issue: Referente dos pronomes masculinos em לְפָנָיו e פְּעָמָיו
  choice: dele / seus
  alternative: do Senhor / de Deus
  rationale: O hebraico usa pronomes, e o contexto fornece o referente; mantê-los evita inserir no versículo um nome divino que não aparece explicitamente nele.
- issue: Agência da justiça
  choice: A justiça irá adiante dele
  alternative: Ele fará a justiça ir adiante dele
  rationale: A justiça é o sujeito gramatical explícito, e sua personificação deve ser preservada.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação evita tanto um literalismo obscuro como uma explicação teológica não presente no texto.
