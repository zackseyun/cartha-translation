  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: pt
  text: Restaura-nos[a], ó Deus da nossa salvação, e afasta de nós a tua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faz-nos voltar, ó Deus da nossa salvação”. O verbo hebraico pode significar, mais literalmente, “faz-nos retornar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Restaura-nos
  rationale: O imperativo hifil com sufixo de primeira pessoa do plural significa literalmente “faz-nos voltar”. No contexto do salmo, “Restaura-nos” expressa de modo natural o pedido de renovação do favor e do bem-estar do povo, sem excluir a ideia de retorno.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: ó Deus da nossa salvação
  rationale: Mantém a construção genitiva hebraica e ressalta que a salvação ou libertação procede de Deus. O vocativo com “ó” é natural numa oração poética e digna.
- source_word: וְהָפֵר
  choice: e afasta
  rationale: O imperativo hifil de פרר pode significar anular, desfazer ou fazer cessar. Com “ira” como objeto, “afasta” comunica naturalmente o pedido para que Deus remova ou faça cessar sua ira.
- source_word: כַּעַסְךָ
  choice: a tua ira
  rationale: O substantivo denota ira ou indignação. “Ira” é claro, conciso e adequado ao registro poético e teológico do salmo.
- source_word: עִמָּנוּ
  choice: de nós
  rationale: Embora עם normalmente signifique “com”, nesta combinação com o verbo que pede a remoção da ira, “de nós” transmite em português o sentido relacional pretendido sem explicitar além do hebraico a ideia de hostilidade.
theological_decisions:
- issue: Se o pedido inicial deve ser entendido sobretudo como conversão moral ou como restauração do povo
  choice: Restaura-nos
  alternative: Faz-nos voltar
  rationale: O hebraico admite literalmente “faz-nos voltar”, preservando a iniciativa divina. No contexto de favor renovado após a ira, “Restaura-nos” é idiomático e abrangente, sem restringir o pedido apenas ao arrependimento interior; a alternativa literal é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A colocação pronominal “Restaura-nos” e o vocativo “ó Deus” preservam o tom poético da oração. O marcador [a] aparece imediatamente após a expressão a que se refere.
