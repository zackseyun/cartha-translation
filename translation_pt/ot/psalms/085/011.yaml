source:
  edition: WLC
  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: pt
  text: A verdade brotará da terra[a], e a justiça olhará do céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A fidelidade brotará da terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a retidão olhará do céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: a verdade
  rationale: אֱמֶת pode indicar verdade, fidelidade ou confiabilidade. “A verdade” nomeia de modo natural a virtude abstrata e mantém o paralelismo poético com צֶדֶק; “a fidelidade” permanece como alternativa legítima em nota.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. O contraste vertical e cósmico com “do céu” favorece “da terra”.
- source_word: תִּצְמָח
  choice: brotará
  rationale: צמח descreve o ato de brotar ou crescer, sobretudo de vegetação. “Brotará” preserva de forma concisa e vívida a metáfora agrícola.
- source_word: צֶדֶק
  choice: a justiça
  rationale: צֶדֶק abrange justiça e retidão. Em português corrente, “justiça” funciona naturalmente como virtude personificada e preserva a dimensão moral e relacional do termo; “retidão” é registrada em nota.
- source_word: מִשָּׁמַיִם
  choice: do céu
  rationale: שָׁמַיִם pode ser traduzido por “céu” ou “céus”. O singular coletivo é natural em português e mantém o contraste com “terra”.
- source_word: נִשְׁקָף
  choice: olhará
  rationale: O nifal de שׁקף exprime olhar ou contemplar a partir de um ponto elevado. Com “do céu”, “olhará” conserva a direção e a personificação sem tornar a frase pesada.
theological_decisions:
- issue: Amplitude semântica de אֱמֶת
  choice: verdade
  alternative: fidelidade
  rationale: O hebraico admite ambas. “Verdade” preserva a virtude abstrata no texto principal, enquanto a nota mantém a leitura relacional de “fidelidade” sem resolver indevidamente a ambiguidade.
- issue: Amplitude moral e forense de צֶדֶק
  choice: justiça
  alternative: retidão
  rationale: O termo pode destacar tanto o que é justo quanto o que é reto. “Justiça” é clara e natural no paralelismo, mas “retidão” continua sendo uma tradução possível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A imagem vegetal de brotar e a personificação da justiça que olha do alto foram preservadas. Os marcadores aparecem imediatamente após as expressões a que se referem.
