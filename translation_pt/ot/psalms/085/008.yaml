  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: pt
  text: Quero ouvir o que o Deus Yahweh dirá, pois ele anunciará paz ao seu povo e aos que lhe são fiéis[a]; mas que eles não voltem à insensatez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aos seus leais», «aos seus piedosos» ou «aos seus santos».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «à tolice». Uma interpretação menos provável entende o substantivo final como «confiança».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Quero ouvir
  rationale: O coortativo expressa a intenção ou determinação do salmista; «Quero ouvir» comunica essa força volitiva em português natural.
- source_word: מַה יְדַבֵּר
  choice: o que ... dirá
  rationale: O imperfeito aponta para aquilo que Deus está prestes a dizer; «dirá» é idiomático e mantém a orientação futura.
- source_word: הָאֵל יְהוָה
  choice: Deus, Yahweh
  rationale: Preserva tanto אֵל quanto o nome divino, entendendo a justaposição como uma identificação, sem acrescentar uma relação sintática ausente no hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou fundamento da disposição de ouvir.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a correspondência tradicional e suficientemente ampla, incluindo bem-estar, integridade e harmonia restaurada.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Reprodução direta e natural da construção possessiva.
- source_word: חֲסִידָיו
  choice: os que lhe são fiéis
  rationale: Expressa a lealdade e a piedade próprias de uma relação de aliança, evitando restringir o termo a um sentido eclesiástico técnico.
- source_word: וְאַל יָשׁוּבוּ
  choice: mas que eles não voltem
  rationale: אַל com o imperfeito tem força proibitiva ou exortativa. «Mas» explicita naturalmente o contraste entre a promessa de paz e a advertência seguinte.
- source_word: לְכִסְלָה
  choice: à insensatez
  rationale: Representa o sentido comum de כסלה como conduta tola; a leitura «confiança» é possível, mas menos provável no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: Mantém explicitamente o nome da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de חֲסִידָיו
  choice: os que lhe são fiéis
  alternative: seus santos; seus piedosos; seus leais
  rationale: Conserva o aspecto ético e relacional da lealdade a Deus sem importar uma definição eclesiológica posterior.
- issue: Força da oração final
  choice: 'exortação ou advertência: «mas que eles não voltem»'
  alternative: 'predição: «e eles não voltarão»'
  rationale: A construção אַל com o imperfeito favorece claramente a força proibitiva/jussiva e preserva a tensão entre a paz anunciada e o perigo de recaída.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem «Deus, Yahweh» preserva os dois elementos hebraicos; «Quero ouvir» mantém a volição do coortativo, e a cláusula final conserva sua força exortativa.
