  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: pt
  text: De fato, a sua salvação está perto dos que o temem[a], para que a glória[b] habite em nossa terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato, seu livramento está perto dos que o temem.”'
    reason: lexical_alternative
  - marker: b
    text: “Glória” pode se referir à presença manifesta de Deus ou à honra restaurada à terra.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: A partícula tem aqui força enfática e afirmativa, não restritiva. “De fato” comunica essa ênfase de modo natural em português.
- source_word: קָרוֹב
  choice: está perto
  rationale: O adjetivo expressa proximidade. “Está perto” preserva de maneira direta e idiomática a imagem hebraica.
- source_word: לִירֵאָיו
  choice: dos que o temem
  rationale: A forma participial designa os que vivem no temor de Deus. “Temem” conserva o sentido religioso e pactual, mais amplo que mero respeito.
- source_word: יִשְׁעוֹ
  choice: a sua salvação
  rationale: O substantivo pode indicar salvação ou livramento. “A sua salvação” mantém a ressonância teológica e a relação possessiva do hebraico.
- source_word: לִשְׁכֹּן
  choice: para que ... habite
  rationale: O infinitivo com ל pode expressar propósito ou resultado. “Para que ... habite” torna clara essa relação sem decidir rigidamente entre as duas nuances.
- source_word: כָּבוֹד
  choice: glória
  rationale: “Glória” preserva o peso poético e teológico do termo, sem restringi-lo à presença manifesta de Deus, à honra ou ao esplendor.
- source_word: בְּאַרְצֵנוּ
  choice: em nossa terra
  rationale: No contexto, אֶרֶץ se refere à terra do povo. “Em nossa terra” é uma tradução direta e natural.
theological_decisions:
- issue: Referente de כָּבוֹד (“glória”)
  choice: Manter o termo amplo “glória”, sem explicitar seu referente.
  alternative: Entender como a presença gloriosa de Deus ou como a honra restaurada à terra.
  rationale: O hebraico é evocativo e não determina de forma inequívoca o referente. A tradução preserva essa abertura teológica.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Emprega “temem” para preservar o sentido bíblico de ירא e mantém “glória” deliberadamente aberta. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
