  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: pt
  text: De fato[a], Yahweh dará o que é bom, e a nossa terra produzirá o seu fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Também”, “Sim” ou “Certamente”. A partícula hebraica pode ter sentido aditivo ou enfático; aqui, provavelmente reforça a certeza da promessa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De fato
  rationale: Neste contexto poético, a partícula reforça a certeza das promessas anteriores; “De fato” comunica essa ênfase sem reduzi-la a uma simples adição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִתֵּן
  choice: dará
  rationale: O imperfeito aponta aqui para a expectativa futura da bênção divina; “dará” é natural e direto em português.
- source_word: הַטּוֹב
  choice: o que é bom
  rationale: Preserva a amplitude da expressão hebraica, que pode designar o bem de modo abstrato ou coisas boas concretas, sem restringi-la a bens materiais.
- source_word: וְאַרְצֵנוּ
  choice: e a nossa terra
  rationale: No contexto agrícola, אֶרֶץ se refere à terra do povo; “terra” é a opção portuguesa mais natural e abrangente.
- source_word: תִּתֵּן
  choice: produzirá
  rationale: Embora o verbo signifique literalmente “dará”, “produzirá” expressa de maneira idiomática em português a ação da terra.
- source_word: יְבוּלָהּ
  choice: o seu fruto
  rationale: יְבוּל designa o produto ou rendimento da terra. “Seu fruto” é corrente em português bíblico moderno e mantém o sentido agrícola amplo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Amplitude de הַטּוֹב
  choice: o que é bom
  alternative: o bem; coisas boas
  rationale: A formulação escolhida mantém aberta a possibilidade de bem moral e de benefícios concretos no contexto, sem resolver indevidamente essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética foi preservada, enquanto “produzirá o seu fruto” oferece uma formulação natural para a imagem agrícola hebraica.
