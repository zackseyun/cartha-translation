  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: pt
  text: Retiraste toda a tua ira; afastaste-te do ardor da tua indignação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Recolheste toda a tua ira; fizeste recuar o ardor da tua indignação.”'
    reason: 'Alternativa lexical e sintática: אָסַף pode significar “recolher” ou “retirar”, e הֱשִׁיבוֹתָ pode ser entendido causativamente como “fizeste recuar”.'
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: Retiraste
  rationale: No contexto, אסף expressa recolher ou remover a ira. “Retiraste” comunica esse sentido com naturalidade e preserva a ação deliberada sem introduzir a imagem pouco idiomática de “reunir” a ira.
- source_word: כָל
  choice: toda
  rationale: Mantém a ideia de totalidade e reforça que a ira foi inteiramente retirada.
- source_word: עֶבְרָתֶךָ
  choice: a tua ira
  rationale: עֶבְרָה designa ira intensa ou furor. “Ira” conserva o registro elevado e é amplamente compreensível em português.
- source_word: הֱשִׁיבוֹתָ
  choice: afastaste-te
  rationale: O hifil de שוב com מן comunica voltar-se ou afastar-se de algo. A forma reflexiva é natural em português e mantém a imagem de mudança de direção, sem interpretar o verbo como arrependimento emocional.
- source_word: מֵחֲרוֹן
  choice: do ardor
  rationale: חָרוֹן evoca calor abrasador e, idiomaticamente, intensifica a ira. “Ardor” preserva a metáfora térmica em português corrente e digno.
- source_word: אַפֶּךָ
  choice: da tua indignação
  rationale: אַף significa literalmente “nariz” e, por extensão, ira. “Indignação” expressa o sentido figurado e evita repetição imediata de “ira”, enquanto “ardor” retém indiretamente a imagem corporal e térmica.
theological_decisions:
- issue: Linguagem antropomórfica sobre a ira divina
  choice: Manter a metáfora térmica em “ardor da tua indignação”.
  alternative: Afastaste de nós a tua ira ardente.
  rationale: O hebraico apresenta a ira de Deus de modo vívido, por meio de linguagem corporal e térmica. A tradução preserva essa força poética sem literalizar “nariz” nem suavizar a realidade do juízo divino.
- issue: Possível objeto implícito em הֱשִׁיבוֹתָ
  choice: 'Traduzir como movimento do próprio Deus: “afastaste-te do ardor”.'
  alternative: “Fizeste recuar o ardor da tua ira” ou “afastaste de nós a tua ira ardente”.
  rationale: 'A construção permite mais de uma análise: Deus pode ser retratado como voltando-se da sua ira, ou como fazendo a ira recuar. O texto principal segue a leitura reflexiva tradicional, e a nota registra a alternativa causativa sem resolver indevidamente a ambiguidade.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes com o discurso dirigido a Deus. “Ardor da tua indignação” mantém o paralelismo poético e a imagem térmica do hebraico.
