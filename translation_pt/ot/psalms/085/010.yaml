source:
  edition: WLC
  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: pt
  text: O amor leal e a verdade se encontraram[a]; a justiça[b] e a paz se beijaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fidelidade”, em vez de “a verdade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a retidão”, em vez de “a justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa a dimensão duradoura, relacional e comprometida de חֶסֶד com linguagem natural em português, sem restringir o termo apenas a misericórdia.
- source_word: אֱמֶת
  choice: verdade
  rationale: Preserva o sentido direto de אֱמֶת e a concisão poética; “fidelidade” continua sendo uma alternativa legítima e é registrada em nota.
- source_word: נִפְגָּשׁוּ
  choice: se encontraram
  rationale: O perfeito nifal plural descreve um encontro entre as qualidades personificadas; a forma pronominal é idiomática em português.
- source_word: צֶדֶק
  choice: justiça
  rationale: Neste contexto de qualidades morais personificadas, “justiça” comunica com clareza o sentido ético de צֶדֶק; “retidão” permanece possível e é indicada em nota.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a correspondência portuguesa mais reconhecível e idiomática, embora o hebraico também possa abranger integridade e bem-estar.
- source_word: נָשָׁקוּ
  choice: se beijaram
  rationale: Mantém literalmente a imagem ousada do hebraico e torna explícita, de modo natural em português, a reciprocidade entre os sujeitos personificados.
theological_decisions:
- issue: Personificação de qualidades relacionais e morais
  choice: 'Manter literalmente a personificação: “se encontraram” e “se beijaram”'
  alternative: Parafrasear como “se uniram em harmonia” ou “foram reconciliadas”
  rationale: O hebraico apresenta essas qualidades como agentes personificados. Preservar as imagens evita impor ao verso uma síntese doutrinária mais explícita do que ele próprio oferece.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético e personificação preservados. A colocação dos marcadores segue imediatamente os termos de sentido lexical alternativo.
