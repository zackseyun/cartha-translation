id: PSA.85.2
reference: Psalms 85:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: pt
  text: Perdoaste a iniquidade do teu povo[a]; cobriste todo o pecado deles[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “carregaste” ou “levaste embora a iniquidade do teu povo”. A expressão hebraica retrata o perdão como o ato de erguer ou levar embora a culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os pecados deles”. O hebraico emprega um substantivo singular com sufixo plural, que pode ser traduzido coletivamente como “pecado” ou distributivamente como “pecados”.
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: Perdoaste
  rationale: Embora o verbo signifique literalmente “erguer, carregar, levar”, com עָוֹן forma uma expressão idiomática de perdão ou remoção da culpa. “Perdoaste” comunica com clareza o sentido contextual, enquanto a nota preserva a imagem hebraica.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O termo pode indicar iniquidade, culpa ou a consequência da culpa. “Iniquidade” mantém seu peso moral e a distinção lexical em relação a חַטָּאתָם no segundo membro.
- source_word: עַמֶּךָ
  choice: teu povo
  rationale: Tradução natural do substantivo coletivo com sufixo de segunda pessoa, preservando o vínculo relacional expresso no hebraico.
- source_word: כִּסִּיתָ
  choice: cobriste
  rationale: Mantém a metáfora concreta de cobrir, que neste contexto poético expressa o tratamento divino do pecado sem reduzir a frase a uma paráfrase abstrata.
- source_word: כָל
  choice: todo
  rationale: Com o singular coletivo “pecado”, “todo” reproduz naturalmente a abrangência de כָל.
- source_word: חַטָּאתָם
  choice: o pecado deles
  rationale: O hebraico apresenta um substantivo singular com sufixo plural. O singular coletivo português preserva essa forma e o paralelismo, embora o plural “todos os pecados deles” também seja legítimo.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo é incerto, emprega-se a transliteração tradicional, sem impor uma interpretação como “pausa” ou “interlúdio”.
theological_decisions:
- issue: Tradução da expressão idiomática נָשָׂא עָוֹן
  choice: Perdoaste a iniquidade do teu povo
  alternative: Levaste embora a iniquidade do teu povo; carregaste a iniquidade do teu povo
  rationale: A expressão denota perdão ou remoção da culpa. A tradução principal oferece o sentido claro em português moderno, e a nota conserva a imagem subjacente de erguer, carregar ou levar embora.
- issue: Singular ou plural em חַטָּאתָם
  choice: todo o pecado deles
  alternative: todos os pecados deles
  rationale: O substantivo hebraico está no singular com sufixo plural e pode ter valor coletivo. O singular mantém a forma poética sem excluir a compreensão distributiva indicada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se a segunda pessoa singular em estilo bíblico-poético (“teu”, “perdoaste”, “cobriste”). “Selá” segue a transliteração portuguesa tradicional. Todos os marcadores de nota aparecem no texto.
