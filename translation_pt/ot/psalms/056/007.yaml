  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: pt
  text: Por causa da iniquidade[a], não os deixes escapar; com ira, derruba os povos[b], ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa da iniquidade, não os resgates”. A oração hebraica é difícil; o verbo também pode ser entendido mais diretamente como “livrar” ou “resgatar”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Por causa de
  rationale: A preposição introduz aqui, com maior probabilidade, o motivo da petição. “Por causa de” comunica naturalmente esse valor causal.
- source_word: אָוֶן
  choice: iniquidade
  rationale: O termo designa maldade ou conduta perversa. “Iniquidade” mantém o peso moral da acusação e se ajusta ao registro poético da oração.
- source_word: פַּלֶּט
  choice: não os deixes escapar
  rationale: O verbo pode significar “escapar” ou, em uso causativo, “livrar”. No contexto imprecatório e em paralelo com o pedido de julgamento, a formulação expressa a provável petição negativa, embora a construção hebraica seja difícil e a alternativa seja registrada em nota.
- source_word: לָמוֹ
  choice: os
  rationale: O pronome retoma os adversários perversos mencionados no salmo e funciona naturalmente como complemento na formulação portuguesa.
- source_word: בְּאַף
  choice: com ira
  rationale: אַף, nesta expressão, denota ira. “Com ira” preserva o valor circunstancial ou instrumental sem acrescentar o possessivo “tua”, que não está explícito no hebraico.
- source_word: עַמִּים
  choice: os povos
  rationale: É o plural de “povo”. A escolha preserva a forma lexical do hebraico; “as nações” continua possível e consta em nota.
- source_word: הוֹרֵד
  choice: derruba
  rationale: O imperativo causativo de ירד pede que Deus faça os povos descerem, no sentido de rebaixá-los ou vencê-los. “Derruba” transmite de modo natural a metáfora e sua força judicial.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O nome funciona como vocativo no fim da petição; “ó Deus” torna essa função explícita em português.
theological_decisions:
- issue: Petição imprecatória e provável negação numa oração hebraica difícil
  choice: A primeira oração é apresentada como um pedido para que os perversos não escapem por causa de sua iniquidade, seguido do pedido para que Deus derrube os povos com ira.
  alternative: “Por causa da iniquidade, não os livres”; também se tem entendido a oração como uma pergunta acerca de escaparem mediante a iniquidade.
  rationale: A sintaxe hebraica é comprimida e admite mais de uma análise, sobretudo quanto a פַּלֶּט e à relação de עַל אָוֶן com o verbo. A leitura como petição negativa se harmoniza com o contexto imprecatório e com o pedido paralelo de julgamento, mas a nota preserva a incerteza sem eliminar uma alternativa lexical importante.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. Mantém a concisão e o paralelismo poético, sem suavizar a petição de julgamento.
