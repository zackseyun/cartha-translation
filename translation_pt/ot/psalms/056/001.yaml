  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: pt
  text: 'Sê favorável a mim, ó Deus,

    pois um homem me persegue avidamente;[a]

    o dia todo, lutando, ele me oprime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me esmaga”, “arremete contra mim” ou “quer me devorar”; o verbo hebraico evoca ofegar de modo hostil ou perseguir avidamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Tem compaixão de mim
  rationale: O imperativo piel de חנן com sufixo de primeira pessoa pede o favor benevolente de Deus. A formulação é natural em português e mantém o tom de súplica sem exigir que o contexto seja especificamente penitencial.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: Reproduz de modo idiomático o vocativo da oração.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da súplica e se ajusta ao registro poético.
- source_word: שְׁאָפַנִי
  choice: me persegue com avidez
  rationale: שׁאף evoca o ofegar ou farejar de quem deseja alcançar a presa e, por extensão, uma perseguição hostil e ávida. A tradução comunica a imagem e o sentido em português corrente sem fixar uma interpretação excessivamente literal.
- source_word: אֱנוֹשׁ
  choice: um homem
  rationale: O substantivo singular designa aqui um adversário humano e pode ressaltar sua condição mortal; 'um homem' preserva tanto a singularidade quanto o contraste com Deus.
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: Equivalente moderno, natural e conciso para a expressão temporal.
- source_word: לֹחֵם
  choice: ele luta
  rationale: O particípio qal descreve a atividade hostil contínua do adversário. A oração coordenada soa mais natural em português do que um particípio solto.
- source_word: יִלְחָצֵנִי
  choice: me oprime
  rationale: לחץ denota pressionar, afligir ou oprimir; 'me oprime' expressa claramente a pressão hostil contínua.
theological_decisions:
- issue: Referência humana singular em אֱנוֹשׁ
  choice: um homem
  alternative: um mortal; o ser humano
  rationale: O contexto imediato apresenta um agressor singular. 'Um homem' evita transformar esse adversário em toda a humanidade, ao mesmo tempo que conserva o contraste entre oposição humana e socorro divino.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A disposição em três linhas preserva o paralelismo e a progressão da súplica. A nota mantém aberta a variedade semântica de שׁאף.
