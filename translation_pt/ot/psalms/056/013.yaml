  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: pt
  text: Pois livraste minha alma da morte[a]; não livraste também meus pés de tropeçar[b], para que eu ande diante de Deus na luz da vida[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha vida”. O hebraico néfesh pode indicar a alma, a vida ou a própria pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “de cair”.
    reason: lexical_alternative
  - marker: c
    text: Ou “na luz dos vivos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da confiança e do louvor expressos no contexto anterior, mantendo a força conectiva em registro poético natural.
- source_word: הִצַּלְתָּ
  choice: livraste
  rationale: O hifil perfeito de נצל indica fazer escapar ou livrar. O pretérito perfeito português apresenta o ato como realizado, de acordo com o contexto de ação de graças.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. “Minha alma” conserva a imagem hebraica e sua amplitude poética, enquanto a nota registra a alternativa contextual “minha vida”.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: A preposição מִן com מָוֶת expressa livramento da ameaça ou do domínio da morte; “da morte” é direto e idiomático.
- source_word: הֲלֹא
  choice: não ... também
  rationale: A partícula interrogativa espera resposta afirmativa. A formulação preserva a pergunta retórica e relaciona o segundo livramento ao primeiro.
- source_word: רַגְלַי
  choice: meus pés
  rationale: Mantém a imagem concreta do hebraico e prepara naturalmente a referência a tropeçar e andar.
- source_word: מִדֶּחִי
  choice: de tropeçar
  rationale: דֶּחִי pode indicar tropeço, queda ou ser lançado abaixo. “De tropeçar” combina naturalmente com “pés” e com a metáfora de andar na oração seguinte.
- source_word: לְהִתְהַלֵּךְ
  choice: para que eu ande
  rationale: O infinitivo com לְ expressa propósito ou resultado. A oração final explicita essa relação de modo claro sem eliminar sua possível nuance resultativa.
- source_word: לִפְנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: Reproduz de forma concisa a ideia de estar e viver perante a face ou presença de Deus.
- source_word: בְּאוֹר הַחַיִּים
  choice: na luz da vida
  rationale: Preserva a imagem poética e traduz diretamente חַיִּים como “vida”; a possível leitura idiomática “dos vivos” é mantida em nota.
theological_decisions:
- issue: Amplitude antropológica de נַפְשִׁי
  choice: minha alma
  alternative: minha vida; a mim
  rationale: O termo não deve ser reduzido a uma antropologia técnica nem ter sua imagem poética apagada. “Minha alma” preserva a expressão hebraica, e a nota esclarece que a vida ou a pessoa inteira pode estar em vista.
- issue: Sentido de בְּאוֹר הַחַיִּים
  choice: na luz da vida
  alternative: na luz dos vivos
  rationale: A construção admite uma imagem de vida, vitalidade e favor, enquanto uma expressão relacionada pode referir-se ao âmbito dos vivos. O texto principal segue mais diretamente a forma hebraica, sem excluir a alternativa.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Mantiveram-se o paralelismo corporal (“alma”, “pés”, “ande”) e a pergunta retórica. “Preservaste” foi suprido na segunda oração para tornar explícita em português a elipse verbal hebraica; a forma mais elíptica aparece em nota.
