  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: pt
  text: 'Então os meus inimigos recuarão no dia em que eu clamar. Isto eu sei[a]: Deus está a meu favor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por isto sei que Deus está a meu favor».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a consequência temporal da súplica do salmista de modo direto e natural.
- source_word: יָשׁוּבוּ אָחוֹר
  choice: recuarão
  rationale: A combinação de שוב com אָחוֹר descreve voltar para trás ou bater em retirada; «recuarão» exprime o movimento e a derrota implícita.
- source_word: אוֹיְבַי
  choice: os meus inimigos
  rationale: Tradução direta do substantivo com sufixo possessivo.
- source_word: בְּיוֹם אֶקְרָא
  choice: no dia em que eu clamar
  rationale: Conserva a expressão temporal concreta do hebraico e traduz קרא no contexto de uma súplica dirigida a Deus.
- source_word: זֶה יָדַעְתִּי
  choice: Isto eu sei
  rationale: Preserva a leitura deítica mais direta e a ênfase da ordem hebraica; a possível leitura instrumental é registrada em nota.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que o salmista sabe; em português, a pontuação permite uma formulação natural sem repetir explicitamente a conjunção.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Designação comum do Deus de Israel, singular em sentido neste contexto.
- source_word: לִי
  choice: está a meu favor
  rationale: O לִי elíptico indica apoio ou favor no contexto da retirada dos inimigos, sem ser reduzido à ideia de posse.
theological_decisions:
- issue: Sentido de אֱלֹהִים לִי
  choice: Deus está a meu favor
  alternative: Deus é meu / Deus me pertence
  rationale: Embora a construção seja elíptica e possa formalmente sugerir relação ou posse, o contexto dos inimigos que recuam em resposta à oração favorece a ideia de apoio divino.
- issue: Relação de זֶה com o restante da frase
  choice: '«Isto eu sei»: afirmação de certeza seguida de seu conteúdo'
  alternative: '«Por isto sei»: o recuo dos inimigos serve de evidência'
  rationale: A sintaxe hebraica admite ambas as relações. A leitura deítica é adotada no texto, e a instrumental é preservada em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Clamar» mantém o contexto de oração sem explicitar um objeto ausente no hebraico; «está a meu favor» soa natural e preserva a força relacional de לִי.
