  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: pt
  text: Contaste as minhas andanças; põe as minhas lágrimas no teu odre[a]. Não estão elas no teu livro?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um odre é um recipiente de pele, não uma garrafa moderna de vidro.
    reason: esclarecimento histórico e lexical
lexical_decisions:
- source_word: נֹדִי
  choice: as minhas andanças
  rationale: O termo deriva de נוד e evoca deslocamentos errantes ou a condição de quem é impelido de um lugar para outro. “Andanças” preserva a imagem concreta sem reduzi-la a “sofrimento” ou “miséria”.
- source_word: סָפַרְתָּה
  choice: contaste
  rationale: ספר significa primariamente contar ou enumerar e, por extensão, registrar. “Contaste” mantém o sentido concreto de que Deus conhece cada uma das andanças do salmista.
- source_word: שִׂימָה
  choice: recolhe
  rationale: O imperativo de שׂים significa literalmente “põe” ou “coloca”. No contexto das lágrimas em um recipiente, “recolhe” expressa com naturalidade a ação figurada sem apagar a imagem.
- source_word: דִמְעָתִי
  choice: as minhas lágrimas
  rationale: Equivalência direta e idiomática em português.
- source_word: בְנֹאדֶךָ
  choice: no teu odre
  rationale: נֹאד designa um recipiente feito de pele, frequentemente usado para vinho ou outros líquidos. “Odre” reproduz com precisão o objeto antigo e evita a imagem anacrônica de uma garrafa de vidro.
- source_word: הֲלֹא
  choice: não estão elas
  rationale: Mantém a pergunta retórica que espera resposta afirmativa, sem convertê-la em uma declaração explícita.
- source_word: בְסִפְרָתֶךָ
  choice: registradas no teu livro
  rationale: O sintagma indica que as lágrimas constam do registro divino. A inclusão de “registradas” torna clara em português a relação elíptica entre as lágrimas e o livro, preservando “livro” como a imagem concreta do hebraico.
theological_decisions:
- issue: Imagens antropomórficas de Deus recolhendo lágrimas e mantendo um livro
  choice: Preservar as imagens concretas do odre e do livro
  alternative: Parafrasear de modo abstrato, como “tu te lembras de todo o meu sofrimento”
  rationale: A linguagem poética apresenta Deus como pessoalmente atento a cada aflição do salmista. Manter as imagens conserva sua força afetiva e teológica sem determinar de que maneira elas devem ser entendidas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tu” preserva o tratamento direto e poético dirigido a Deus. O paralelismo e a pergunta retórica do hebraico foram mantidos.
