  source_fidelity: A tradução identifica corretamente os inimigos, a duração contínua, a multiplicidade dos adversários, a luta contra o salmista e a leitura espacial de מָרוֹם. Porém, “anseiam por me devorar” acrescenta “devorar”, imagem que não está expressa no hebraico e que torna a metáfora mais específica e violenta do que o original.
  naturalness: “O dia inteiro”, “pois são muitos os que lutam contra mim” e “do alto” são naturais e adequados ao registro poético moderno. “Me perseguem avidamente” comunica de modo idiomático a ideia hostil e intensiva do primeiro verbo sem introduzir um objeto ou ação não presentes no texto.
  terminology: “Ó Altíssimo” é uma alternativa vocativa válida para מָרוֹם; “com arrogância” registra adequadamente a leitura adverbial. A nota deve ser ancorada em “do alto”, a expressão a que se refere, e “invocação” descreve melhor a possibilidade vocativa do que “chamado”.
