  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: pt
  text: Meus inimigos me perseguem avidamente o dia inteiro, pois são muitos os que lutam contra mim do alto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ó Altíssimo”. A última palavra hebraica pode ser entendida como uma invocação dirigida a Deus, em vez de descrever a posição elevada dos atacantes; alguns também a entendem como “com arrogância”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: anseiam por me devorar
  rationale: Preserva a imagem de desejo hostil e predatório evocada por שׁאף, ao mesmo tempo que comunica com naturalidade a perseguição agressiva no contexto; evita restringir o verbo à interpretação mais específica de “pisotear”.
- source_word: שׁוֹרְרַי
  choice: meus inimigos
  rationale: Expressa de modo claro e corrente os adversários hostis do salmista.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Equivalente idiomático e natural em português contemporâneo.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão da queixa no fluxo poético.
- source_word: רַבִּים
  choice: são muitos
  rationale: Mantém o valor quantitativo e produz uma construção portuguesa fluente.
- source_word: לֹחֲמִים לִי
  choice: os que lutam contra mim
  rationale: Representa a ação hostil contínua do particípio e a direção adversativa indicada por לִי.
- source_word: מָרוֹם
  choice: lá do alto
  rationale: Conserva primariamente a imagem espacial ou elevada do hebraico sem eliminar as leituras possíveis como vocativo divino ou indicação de arrogância.
theological_decisions:
- issue: Interpretação de מָרוֹם
  choice: lá do alto
  alternative: ó Altíssimo; com arrogância
  rationale: A sintaxe condensada permite entender o termo como indicação de posição elevada, vocativo dirigido a Deus ou expressão adverbial de arrogância. O texto principal conserva a imagem de altura, enquanto a nota registra as outras leituras para não resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo poético, a intensidade predatória do primeiro verbo e a ambiguidade de מָרוֹם por meio de nota.
