base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: pt
  text: 'Ao regente: conforme “A pomba silenciosa de lugares distantes”[a]. De Davi. Um miktam[b], quando os filisteus o prenderam em Gate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “A pomba do silêncio distante”, ou possivelmente outro título de melodia; o sentido exato da expressão é incerto.'
    reason: alternative_reading
  - marker: b
    text: Miktam é um termo técnico usado nos títulos dos Salmos; seu significado exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Fórmula dos títulos dos Salmos dirigida ao responsável pela execução musical; “regente” é natural, claro e não restringe indevidamente a função a um coro.
- source_word: עַל
  choice: conforme
  rationale: Neste contexto musical, introduz provavelmente a melodia ou o título segundo o qual o salmo devia ser executado.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “A pomba silenciosa de lugares distantes”
  rationale: A expressão obscura é preservada como provável título de melodia. “Silenciosa” representa אֵלֶם e “lugares distantes” comunica o plural רְחֹקִים sem recorrer à proposta lexical pouco provável “carvalhos”.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a amplitude da relação expressa por לְ, que pode indicar autoria, associação, dedicação ou pertencimento, sem decidir entre essas possibilidades.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Termo técnico de significado incerto nos títulos dos Salmos; a transliteração evita uma tradução conjectural.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: quando ... o prenderam
  rationale: Expressa a circunstância temporal e a ação hostil de tomar ou deter Davi, sem exigir que se trate de uma captura formal.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica convencional em português.
- source_word: בְּגַת
  choice: em Gate
  rationale: Forma portuguesa tradicional do topônimo e tradução natural da preposição locativa.
theological_decisions:
- issue: Natureza do sobrescrito
  choice: Traduzir o título como parte do texto, mantendo suas indicações musicais e históricas.
  alternative: Tratá-lo como metadado editorial não traduzido.
  rationale: O texto hebraico transmitido inclui o sobrescrito; traduzi-lo respeita a forma canônica sem transformar termos obscuros em afirmações doutrinárias ou históricas mais específicas.
- issue: Relação de Davi com o salmo
  choice: De Davi
  alternative: Por Davi
  rationale: “De Davi” conserva a ambiguidade do hebraico לְדָוִד, enquanto “por Davi” afirmaria autoria de modo mais estreito.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O provável título musical é mantido entre aspas; o termo técnico miktam é transliterado e explicado em nota.
