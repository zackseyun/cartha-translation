  naturalness: O português é claro e de registro apropriado. “Tal como aguardam pela minha vida” conserva uma leve tensão idiomática que corresponde à expressão hebraica e soa natural em registro bíblico moderno. A nota esclarece a possível implicação hostil sem inseri-la no texto.
  terminology: “Passos” traduz adequadamente o idiomatismo literal “calcanhares”, e “vigiam” transmite bem a observação hostil de יִשְׁמֹרוּ. “Vida” é preferível a “alma” neste contexto. “Aguardam” preserva o valor básico de קוה sem impor “emboscar” ou “tirar a vida”.
