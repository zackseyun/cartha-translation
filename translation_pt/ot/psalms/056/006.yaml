  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: pt
  text: Eles se reúnem, escondem-se; vigiam os meus passos[a], tal como aguardam pela minha vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os meus calcanhares”; isto é, os meus passos ou movimentos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aguardam minha vida”. O verbo também pode sugerir, neste contexto hostil, que estão à espreita.
    reason: source_ambiguity
lexical_decisions:
- source_word: יָגוּרוּ
  choice: se reúnem
  rationale: No contexto hostil, o verbo indica que os inimigos se ajuntam ou formam um grupo contra o salmista. “Se reúnem” mantém a imagem sem explicitar um ataque.
- source_word: יצפינו
  choice: se escondem
  rationale: 'O hifil de צפן tem aqui sentido reflexivo: eles se ocultam, provavelmente para surpreender o salmista. “Se escondem” é claro e natural, sem tornar explícita a emboscada.'
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente dá ênfase ao sujeito. Em português, “eles” no início da sequência representa essa ênfase naturalmente.
- source_word: עֲקֵבַי
  choice: os meus passos
  rationale: A expressão significa literalmente “os meus calcanhares”, mas, no contexto de vigilância e perseguição, refere-se idiomaticamente aos passos ou movimentos do salmista.
- source_word: יִשְׁמֹרוּ
  choice: vigiam
  rationale: שמר não descreve aqui proteção, mas observação hostil e atenta. “Vigiam” comunica esse sentido com concisão.
- source_word: כַּאֲשֶׁר
  choice: enquanto
  rationale: A conjunção pode expressar comparação ou circunstância. “Enquanto” produz uma ligação natural em português entre a vigilância dos passos e a espera hostil, sem convertê-la explicitamente em causa.
- source_word: קִוּוּ
  choice: esperam
  rationale: קוה tem como sentido central esperar ou aguardar. O contexto torna a espera hostil; o verbo básico foi preservado, enquanto o complemento em português esclarece o alvo dessa espera.
- source_word: נַפְשִׁי
  choice: me tirar a vida
  rationale: נפש designa aqui a vida ou a própria pessoa. Como “esperar pela minha vida” seria pouco natural e obscuro em português, a formulação idiomática comunica que os inimigos aguardam uma oportunidade contra a vida do salmista.
theological_decisions:
- issue: Natureza da ameaça contra נַפְשִׁי
  choice: esperam para me tirar a vida
  alternative: esperam pela minha vida
  rationale: O contexto é claramente hostil, mas o hebraico emprega literalmente o verbo geral “esperar” com “minha vida”. A tradução corrente explicita a ameaça de morte para produzir português inteligível; a nota conserva a construção e a ambiguidade lexical do original.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sequência breve de ações mantém o ritmo tenso do hebraico. A coordenação com “e” evita uma sucessão excessivamente rígida de pontos e vírgulas, sem apagar a progressão: reunião, ocultação, vigilância e ameaça à vida.'
