  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: pt
  text: Em Deus confiei; não temerei. O que um ser humano me pode fazer?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Em Deus
  rationale: A preposição בְּ introduz aqui o objeto da confiança; “em Deus” é a formulação natural em português e corresponde ao paralelismo do salmo.
- source_word: בָּטַחְתִּי
  choice: confiei
  rationale: O qal perfeito na primeira pessoa do singular apresenta a confiança como assumida e estabelecida. “Confiei” preserva a forma verbal sem excluir seu efeito presente.
- source_word: לֹא אִירָא
  choice: não temerei
  rationale: O imperfeito com לֹא expressa, neste contexto, a resolução confiante que decorre da confiança em Deus.
- source_word: מַה יַּעֲשֶׂה
  choice: O que ... pode fazer
  rationale: Embora מַה seja literalmente “o que”, a pergunta retórica implica capacidade; “pode fazer” transmite naturalmente essa força em português.
- source_word: אָדָם
  choice: um ser humano
  rationale: אָדָם está no singular, mas tem sentido representativo e designa uma pessoa humana em contraste com Deus. “Um ser humano” preserva tanto o singular quanto a abrangência lexical sem sugerir especificamente um indivíduo masculino.
- source_word: לִי
  choice: contra mim
  rationale: Com o verbo “fazer”, לִי pode ser expresso literalmente por “a mim”, mas, no contexto de ameaça e dano, “contra mim” comunica de modo natural a relação pretendida, sem especificar qual dano poderia ser causado.
theological_decisions:
- issue: Sentido representativo de אָדָם
  choice: um ser humano
  alternative: um homem
  rationale: O substantivo singular contrasta a fragilidade humana com Deus e não depende do sexo da pessoa. A tradução mantém o singular e a referência humana geral, sem transformar o termo em coletivo.
- issue: Alcance da confiança expressa pelo perfeito בָּטַחְתִּי
  choice: confiei
  alternative: confio
  rationale: “Confiei” reflete mais diretamente o perfeito hebraico e apresenta a confiança como decisão estabelecida; o contexto permite que essa confiança continue no presente, sem ser necessário explicitá-lo na tradução.
translation_notes:
  register: Português atual, claro e digno, com cadência poética concisa. “Não temerei” mantém o tom solene e resoluto; “um ser humano” é amplamente compreensível em português brasileiro e internacional.
