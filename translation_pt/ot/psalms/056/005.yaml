- source_word: כָּל מַחְשְׁבֹתָם
  choice: todos os seus pensamentos
  rationale: Mantém o sentido mais direto de מַחְשָׁבוֹת, embora o termo também possa designar planos ou maquinações.
- source_word: לָרָע
  choice: visam o mal
  rationale: Comunica propósito ou direção maliciosa e preserva a dimensão moral de רַע, com sintaxe natural em português.
