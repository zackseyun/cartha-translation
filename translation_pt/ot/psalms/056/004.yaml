base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: pt
  text: Em Deus louvarei a sua palavra; em Deus confiei; não temerei. O que a carne poderá fazer contra mim?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que a carne pode fazer contra mim?” O verbo hebraico tem forma de futuro, mas a pergunta também expressa a incapacidade humana diante de Deus.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “carne” se refere aos seres humanos frágeis e mortais, em contraste com Deus.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Em Deus
  rationale: A preposição בְּ introduz aqui a esfera ou o fundamento tanto do louvor quanto da confiança. “Em Deus” é natural em português e preserva o paralelismo.
- source_word: אֲהַלֵּל
  choice: louvarei
  rationale: O piel imperfeito na primeira pessoa pode expressar futuro ou resolução. “Louvarei” comunica adequadamente essa determinação no contexto poético.
- source_word: דְּבָרוֹ
  choice: a sua palavra
  rationale: Mantém a amplitude de דָּבָר — palavra, declaração ou promessa — sem especificar além do que o hebraico afirma.
- source_word: בָּטַחְתִּי
  choice: confiei
  rationale: O qatal apresenta a confiança como ação estabelecida, da qual decorre a declaração seguinte de que o salmista não temerá.
- source_word: לֹא אִירָא
  choice: não temerei
  rationale: O imperfeito negado expressa confiança e resolução voltadas ao presente e ao futuro.
- source_word: מַה יַּעֲשֶׂה
  choice: O que ... poderá fazer
  rationale: O verbo hebraico está formalmente no imperfeito e pode ser traduzido como futuro. Em português, “poderá fazer” também transmite naturalmente a força retórica da pergunta.
- source_word: בָשָׂר
  choice: a carne
  rationale: Preserva a imagem hebraica que contrasta Deus com a humanidade frágil e mortal; uma nota esclarece o uso metonímico.
- source_word: לִי
  choice: contra mim
  rationale: Embora לִי seja literalmente “a mim”, “fazer contra mim” expressa em português natural o sentido adversativo presente no contexto.
theological_decisions:
- issue: O termo antropológico בָשָׂר em contraste com Deus
  choice: a carne
  alternative: um simples mortal
  rationale: '“A carne” conserva a imagem e a tensão teológica do hebraico: o poder limitado da humanidade frágil diante de Deus. A nota evita que o termo seja entendido apenas como matéria corporal ou como uma categoria moral.'
- issue: Força retórica de מַה יַּעֲשֶׂה
  choice: O que a carne poderá fazer contra mim?
  alternative: O que a carne pode fazer contra mim?
  rationale: A forma escolhida preserva o valor futuro do imperfeito hebraico, enquanto o contexto interrogativo comunica que a humanidade não pode frustrar a confiança do salmista em Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação mantém as três declarações estreitamente ligadas, e o vocabulário conserva a imagem poética central do hebraico.
