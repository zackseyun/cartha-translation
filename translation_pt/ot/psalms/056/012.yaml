id: PSA.56.12
reference: Psalms 56:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: pt
  text: Teus votos recaem sobre mim[a], ó Deus; eu te entregarei ofertas de gratidão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «meus votos a ti» ou «os votos que te fiz». O hebraico diz literalmente «teus votos», referindo-se provavelmente aos votos devidos a Deus.
    reason: alternative_reading
  - marker: b
    text: Ou «ações de graças». O termo hebraico pode indicar tanto expressões de agradecimento quanto ofertas apresentadas em gratidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: recaem sobre mim
  rationale: Preserva a imagem hebraica de algo que está sobre o salmista e, ao mesmo tempo, comunica em português o sentido de obrigação assumida.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; «ó Deus» torna explícita a interpelação direta de modo digno e natural.
- source_word: נְדָרֶיךָ
  choice: teus votos
  rationale: Mantém o sufixo de segunda pessoa do hebraico. No contexto, são os votos devidos a Deus, isto é, feitos a ele, mas essa relação não é explicitada no corpo do texto.
- source_word: אֲשַׁלֵּם
  choice: entregarei
  rationale: No contexto de votos e ofertas, expressa a ação de dar a Deus aquilo que lhe é devido, evitando a combinação pouco natural «pagarei ofertas».
- source_word: תּוֹדֹת
  choice: ofertas de gratidão
  rationale: O termo pode indicar tanto manifestações de agradecimento quanto ofertas de ação de graças. O paralelismo com votos e com o verbo de pagamento favorece aqui a nuance cultual.
- source_word: לָךְ
  choice: te
  rationale: Representa o destinatário indicado pela preposição hebraica e produz uma construção idiomática em português.
theological_decisions:
- issue: Sentido de «teus votos» em relação a Deus
  choice: Preservar no texto principal a formulação literal «teus votos».
  alternative: «meus votos a ti» ou «os votos que te fiz»
  rationale: O hebraico traz diretamente um sufixo de segunda pessoa, embora a expressão provavelmente designe votos feitos a Deus e, portanto, devidos a ele. A nota esclarece o sentido provável sem eliminar a tensão da formulação original.
- issue: Natureza de תּוֹדֹת
  choice: «ofertas de gratidão»
  alternative: «ações de graças»
  rationale: A proximidade temática com votos e o uso de אֲשַׁלֵּם favorecem uma referência a ofertas, mas o termo hebraico também admite o sentido mais amplo de expressões de agradecimento; essa alternativa é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Recaem sobre mim» conserva a imagem e a obrigação do original; «entregarei ofertas de gratidão» evita uma expressão mecanicamente literal e pouco natural, sem perder a ideia de dar a Deus o que é devido.
