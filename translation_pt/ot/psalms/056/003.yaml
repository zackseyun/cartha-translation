base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: pt
  text: Quando eu tiver medo[a], confiarei em ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “No dia em que eu temer, eu — em ti confiarei”.'
    reason: A nota preserva o substantivo “dia”, a ênfase do pronome independente אֲנִי e a ordem marcada do hebraico, enquanto o texto principal usa português natural.
lexical_decisions:
- source_word: י֥וֹם
  choice: Quando
  rationale: Embora יוֹם signifique literalmente “dia”, aqui introduz uma circunstância temporal; “quando” expressa naturalmente o sentido em português.
- source_word: אִירָ֑א
  choice: eu tiver medo
  rationale: O Qal imperfeito de ירא descreve a experiência de sentir medo. A construção “quando eu tiver medo” é corrente e preserva a referência temporal e a realidade do temor.
- source_word: אֲ֝נִ֗י
  choice: '[expresso pelo sujeito de “confiarei”]'
  rationale: O pronome independente dá ênfase ao sujeito. Em português, a primeira pessoa já está marcada no verbo; a ênfase hebraica é registrada na nota para evitar a forma pouco natural “eu, eu” no texto principal.
- source_word: אֵלֶ֥י/ךָ
  choice: em ti
  rationale: Com בטח, a preposição אֶל indica a pessoa para quem se dirige a confiança. “Confiar em ti” é a colocação idiomática natural em português.
- source_word: אֶבְטָֽח
  choice: confiarei
  rationale: O imperfeito de בטח expressa aqui a decisão ou disposição do salmista diante do medo; o futuro “confiarei” preserva esse tom de resolução.
theological_decisions:
- issue: Relação entre medo e confiança
  choice: O salmista reconhece que sente medo e responde a ele confiando deliberadamente em Deus.
  alternative: Traduzir como se a confiança eliminasse por completo qualquer experiência de medo.
  rationale: O hebraico justapõe o medo e a resolução de confiar, sem afirmar que o medo jamais existe; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ti” mantém o tratamento singular tradicional dirigido a Deus sem recorrer a formulações arcaicas; a sintaxe principal é natural e concisa.
