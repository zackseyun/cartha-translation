source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: pt
  text: Em Deus louvarei a palavra[a]; em Yahweh louvarei a palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a promessa”, nas duas linhas; o hebraico דָּבָר pode significar “palavra”, “assunto” ou “promessa”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Em Deus
  rationale: A preposição בְּ é mantida como “em”, exprimindo a relação/confiança em Deus e preservando o paralelismo com בַּיהוָה.
- source_word: אֲהַלֵּל
  choice: louvarei
  rationale: O piel imperfeito na primeira pessoa do singular expressa aqui resolução ou sentido futuro; “louvarei” é natural, conciso e mantém a declaração reiterada.
- source_word: דָּבָר
  choice: a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou, neste contexto, “promessa”. “A palavra” preserva a forma lexical e a ambiguidade, enquanto a nota registra a alternativa contextual.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição é traduzida por “em” para conservar o paralelismo, e o nome divino יהוה é transliterado como “Yahweh”, distinguindo-o de אֱלֹהִים na primeira linha.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e a distinção poética entre אֱלֹהִים e יהוה sem introduzir uma interpretação denominacional.
- issue: Referente de “a palavra”
  choice: Manter “a palavra” sem explicitar o possuidor
  alternative: a palavra de Deus; a promessa de Deus
  rationale: O hebraico repete apenas דָּבָר e não traz pronome possessivo. A formulação concisa conserva a ambiguidade e a tensão poética do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com forte paralelismo poético. A ordem “Em Deus...; em Yahweh...” e a repetição integral reproduzem a estrutura enfática do hebraico.
