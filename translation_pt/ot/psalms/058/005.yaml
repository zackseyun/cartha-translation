  text: that does not listen to the voice of charmers[b][a], of one who skillfully casts spells.
translation:
  language: pt
  text: que não dá ouvidos à voz dos encantadores[a], à de quem lança encantamentos com perícia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao som dos que sussurram”. O termo hebraico traduzido por “encantadores” está ligado ao sussurro ou à recitação de fórmulas de encantamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um que ata encantamentos, hábil”. A expressão hebraica é idiomática e se refere a um encantador experiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Partícula relativa que continua a descrição da serpente surda no versículo anterior; “que” preserva naturalmente essa ligação em português.
- source_word: לֹא יִשְׁמַע
  choice: não dá ouvidos
  rationale: O imperfeito descreve a falta característica de resposta da serpente. “Não dá ouvidos” comunica mais claramente a ideia de não atender do que a simples incapacidade física de ouvir.
- source_word: לְקוֹל
  choice: à voz
  rationale: קוֹל pode significar “voz” ou “som”. “Voz” combina com os agentes humanos que proferem fórmulas de encantamento, enquanto a alternativa é registrada em nota.
- source_word: מְלַחֲשִׁים
  choice: encantadores
  rationale: O termo deriva de uma raiz ligada a sussurros e fórmulas mágicas. No contexto da serpente, “encantadores” expressa de modo claro e natural a função desses praticantes.
- source_word: חוֹבֵר חֲבָרִים
  choice: quem lança encantamentos
  rationale: A expressão hebraica, literalmente próxima de “quem ata encantamentos”, é idiomática e designa alguém que formula ou emprega encantamentos. A tradução evita um literalismo obscuro.
- source_word: מְחֻכָּם
  choice: com perícia
  rationale: A forma comunica habilidade ou competência. “Com perícia” evita a conotação moral positiva que “com sabedoria” poderia sugerir neste contexto.
