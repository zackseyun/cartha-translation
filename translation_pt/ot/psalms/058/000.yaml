  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֗ת לְ/דָוִ֥ד מִכְתָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: pt
  text: 'Ao regente: “Não destrua”.[a] De Davi. Um miktam.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “conforme ‘Não destrua’”, caso a expressão indique de modo mais explícito a melodia ou o arranjo musical.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico miktam é uma designação de significado incerto usada em títulos de salmos; pode indicar um tipo de composição ou um arranjo musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: A fórmula dos títulos dos Salmos se dirige ao responsável pela execução musical. “Ao regente” é conciso, natural e conserva essa função litúrgico-musical.
- source_word: אַל תַּשְׁחֵת
  choice: “Não destrua”
  rationale: A expressão provavelmente funciona como título de uma melodia ou arranjo musical. As aspas indicam esse uso sem acrescentar uma preposição ausente no hebraico; a nota registra a interpretação musical mais explícita.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição hebraica pode indicar autoria, dedicação ou associação. “De Davi” é natural em português e evita tornar a autoria mais explícita do que o original.
- source_word: מִכְתָּם
  choice: Um miktam
  rationale: O significado exato do termo é incerto, embora ele funcione como classificação literária ou musical em títulos de salmos. A transliteração evita traduções especulativas.
theological_decisions:
- issue: Natureza dos termos do título
  choice: Tratar a linha como título canônico e apresentar “Não destrua” como provável título musical, preservando “De Davi” sem especificar autoria.
  alternative: Entender “Não destrua” como ordem direta e traduzir לְדָוִד explicitamente como “por Davi”.
  rationale: O hebraico não explicita por completo nem a função da expressão musical nem a relação de Davi com o salmo. A tradução evita resolver essas ambiguidades sem fundamento textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ao regente” evita o caráter mais tradicional de “ao mestre de canto”; “miktam” é mantido como termo técnico desconhecido e explicado em nota.
