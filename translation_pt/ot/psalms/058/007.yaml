lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: que eles se dissolvam
  rationale: No paralelismo com a água, expressa desfazer-se ou desaparecer; o subjuntivo preserva a força imprecatória.
- source_word: כְמוֹ מַיִם
  choice: como a água
  rationale: Mantém diretamente a comparação poética do hebraico.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: que escoa
  rationale: Expressa de modo natural o movimento da água que corre e desaparece, sem tentar reproduzir rigidamente a construção hebraica difícil.
- source_word: יִדְרֹךְ
  choice: quando ele preparar
  rationale: Com a flecha e a imagem implícita do arco, o verbo descreve a ação de aprontar o disparo; esta formulação é natural e evita acrescentar explicitamente 'arco', ausente do texto consonantal.
- source_word: חצ/ו
  choice: sua flecha
  rationale: Preserva o singular indicado pela leitura massorética e a imagem individual da oração.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: que ela fique sem ponta
  rationale: A cláusula é lexical e textualmente difícil. No contexto de uma flecha preparada, 'sem ponta' comunica sua inutilização e corresponde a uma interpretação possível ligada a cortar ou embotar, sem ocultar a incerteza, registrada em nota.
