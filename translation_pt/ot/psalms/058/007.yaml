  source_fidelity: A primeira oração preserva bem a imagem imprecatória de dissolver-se como água que escoa. Na segunda, porém, o hebraico massorético vocalizado lê חִצָּיו, “suas flechas”, e o verbo final difícil está no plural. A formulação no singular (“sua flecha... ela”) não representa adequadamente essa concordância. Além disso, “fique sem ponta” fixa uma interpretação específica demais para כְּמוֹ יִתְמֹלָלוּ, forma de sentido debatido.
  naturalness: A redação é clara e poética. Com o plural, “quando ele apontar suas flechas, que elas fiquem como que cortadas” permanece natural em português moderno, embora conserve de propósito a estranheza moderada exigida pela dificuldade do hebraico.
  terminology: “Se dissolvam”, “água que escoa” e “apontar” são escolhas adequadas. “Como que cortadas” evita afirmar sem ressalvas que as flechas perdem a ponta; a nota explicita as alternativas relevantes.
