  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: pt
  text: Ó Deus, quebra os dentes na boca deles; despedaça as mandíbulas[a] dos leões jovens, ó Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «os dentes fortes» ou «as presas». O termo hebraico se refere primariamente às mandíbulas ou aos maxilares e pode, por extensão, referir-se aos dentes fortes nelas situados.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «YHWH», o nome divino, aqui transliterado «Yahweh».'
    reason: divine_name
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo na súplica; a partícula «ó» explicita em português natural que Deus está sendo diretamente invocado.
- source_word: הֲרָס
  choice: quebra
  rationale: O imperativo de הרס significa derrubar, destruir ou quebrar; com «dentes» como objeto, «quebra» é concreto, idiomático e preserva a força da imagem.
- source_word: שִׁנֵּימוֹ
  choice: os dentes
  rationale: Plural de «dente» com sufixo de terceira pessoa masculina plural; «deles» aparece na expressão locativa seguinte e identifica os possuidores sem ambiguidade.
- source_word: בְּפִימוֹ
  choice: na boca deles
  rationale: Mantém o valor locativo normal de ב e a imagem hebraica dos dentes sendo quebrados dentro da boca, sem interpretar a preposição como movimento para fora.
- source_word: מַלְתְּעוֹת
  choice: presas
  rationale: O termo designa os dentes fortes usados para triturar, ou possivelmente a região das mandíbulas. No paralelismo com leões novos, «presas» comunica de modo natural o perigo predatório; a amplitude lexical é registrada em nota.
- source_word: כְּפִירִים
  choice: leões novos
  rationale: כפירים costuma indicar leões jovens e vigorosos, não necessariamente filhotes pequenos. «Leões novos» preserva essa imagem de força predatória.
- source_word: נְתֹץ
  choice: arranca
  rationale: O imperativo de נתץ pode significar derrubar, demolir ou desprender violentamente. Com dentes de leões como objeto, «arranca» expressa a ação contundente e distingue o segundo verbo do primeiro, sem suavizar a imprecação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» conserva o nome pessoal e evita substituí-lo pelo título «Senhor».
- issue: Imagens violentas da imprecação
  choice: Manter literalmente o pedido para quebrar e arrancar os dentes dos inimigos retratados como leões
  alternative: Parafrasear como «tira o poder deles»
  rationale: O hebraico apresenta imagens corporais concretas e violentas. A tradução preserva sua força poética e teológica, sem transformar a petição em uma abstração interpretativa.
- issue: Sentido contextual de נְתֹץ com dentes como objeto
  choice: arranca
  alternative: despedaça; quebra; derruba
  rationale: «Arranca» representa naturalmente em português a destruição ou remoção violenta das presas, embora o verbo hebraico tenha alcance mais amplo; por isso, não se afirma que remoção seja seu único sentido lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a violência concreta da poesia imprecatória foram preservados. «Ó Deus» e «ó Yahweh» mantêm as duas invocações diretas do hebraico; «leões novos» evita sugerir filhotes indefesos.
