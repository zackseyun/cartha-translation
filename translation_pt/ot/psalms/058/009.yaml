base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: pt
  text: Antes que as suas panelas sintam o espinheiro[a], quer ele esteja verde, quer em chamas, ele o varrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste versículo é difícil. Mais literalmente: “Antes que as suas panelas percebam o espinheiro, como vivo, como ardor, ele o fará girar”. A imagem provavelmente descreve uma remoção súbita, antes que o fogo aqueça as panelas. Os referentes dos pronomes e a relação de “verde” e “ardor” com a frase são incertos; a frase final também pode ser entendida como “ele os varrerá em sua ira”.'
    reason: Leitura alternativa e preservação da ambiguidade sintática, pronominal e lexical do hebraico.
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Antes que
  rationale: Introduz com clareza a ação que ocorrerá antes que outra se complete e preserva a rapidez da imagem.
- source_word: יָבִינוּ
  choice: sintam
  rationale: Embora o verbo normalmente signifique “entender” ou “perceber”, com “panelas” como sujeito indica aqui perceber o calor; “sintam” torna a metáfora compreensível sem explicá-la em excesso.
- source_word: סִּירֹתֵיכֶם
  choice: as suas panelas
  rationale: Designa recipientes usados para cozinhar; “panelas” é concreto, corrente e natural em português.
- source_word: אָטָד
  choice: o espinheiro
  rationale: Refere-se a um arbusto espinhoso que podia servir de combustível de queima rápida; o singular concreto acompanha a forma hebraica.
- source_word: כְּמוֹ חַי
  choice: esteja ele verde
  rationale: No contexto de combustível vegetal, “vivo” provavelmente indica vegetação ainda fresca ou verde.
- source_word: כְּמוֹ חָרוֹן
  choice: ou em chamas
  rationale: חָרוֹן costuma designar ardor ou ira, mas a imagem imediata é de combustível e calor. “Em chamas” preserva essa imagem, enquanto a possível referência à ira é registrada na nota.
- source_word: יִשְׂעָרֶנּוּ
  choice: ele as varrerá para longe
  rationale: O verbo sugere levar violentamente como por uma tempestade. O objeto hebraico é singular e obscuro; o plural feminino retoma naturalmente “panelas” no sentido provável da figura, e a dificuldade é explicitada na nota.
theological_decisions:
- issue: Sentido da imagem poética e dos referentes pronominais
  choice: A imagem comunica uma remoção súbita antes que o fogo de espinheiros consiga aquecer as panelas; no texto principal, o objeto da remoção é expresso pelas panelas da comparação.
  alternative: 'Traduzir mais literalmente: “Antes que as suas panelas percebam o espinheiro, como vivo, como ardor, ele o levará num redemoinho”; ou entender a frase final como “ele os varrerá em sua ira”.'
  rationale: O hebraico é sintaticamente difícil. A tradução principal comunica o provável sentido contextual de juízo repentino, mas a nota preserva o singular obscuro, o possível sentido de “ira” e uma forma mais literal da construção.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível. A construção mantém a imagem concreta e abrupta do poema, enquanto a nota documenta as dificuldades do hebraico sem impor uma interpretação denominacional.
