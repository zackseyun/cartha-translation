  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: pt
  text: Os ímpios se afastam desde o ventre; desde o ventre materno se desviam, falando mentiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “desde o ventre” ... “desde o ventre/barriga”; a linguagem poética descreve os ímpios como desviados desde o início da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: se afastam
  rationale: Expressa a ideia de alheamento ou separação do verbo זור e forma um paralelo natural com “se desviam”, sem restringir o sentido à corrupção moral.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Equivalente tradicional, claro e digno para a designação coletiva dos que agem perversamente.
- source_word: מֵרָחֶם
  choice: desde o ventre
  rationale: Preserva de perto a imagem hebraica e sua força poética.
- source_word: תָּעוּ
  choice: se desviam
  rationale: Comunica o sentido de errar ou andar fora do caminho; o presente expressa em português a caracterização geral feita pelo perfeito hebraico no contexto poético.
- source_word: מִבֶּטֶן
  choice: desde o ventre materno
  rationale: Mantém a segunda referência hebraica ao ventre e o paralelismo, enquanto “materno” esclarece naturalmente o sentido de בטן em português.
- source_word: דֹּבְרֵי כָזָב
  choice: falando mentiras
  rationale: Reproduz de modo conciso o valor caracterizador e contínuo do particípio hebraico.
- source_word: כָזָב
  choice: mentiras
  rationale: É o equivalente moderno mais direto e natural no contexto da fala.
theological_decisions:
- issue: Se o versículo deve ser formulado como ensino técnico sobre culpa moral pré-natal ou pecado herdado
  choice: Preservar a hipérbole poética de que os ímpios se desviam desde o começo da vida.
  alternative: Traduzir de modo a afirmar explicitamente uma doutrina sistemática de culpa desde a concepção, ou enfraquecer a frase como mera invectiva sem peso antropológico.
  rationale: O paralelismo “desde o ventre” // “desde o ventre materno” intensifica poeticamente a denúncia. A tradução conserva sua força e sua tensão teológica sem acrescentar uma conclusão doutrinária que o hebraico não formula tecnicamente.
translation_notes:
  register: Português moderno, amplamente internacional e natural para leitores brasileiros. A formulação é digna e acessível; mantém o paralelismo e a hipérbole do hebraico sem tornar o verso artificialmente técnico.
