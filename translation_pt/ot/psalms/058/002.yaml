  text: אַף בְּ/לֵב֮ עוֹלֹ֪ת תִּפְעָ֫ל֥וּ/ן בָּ/אָ֡רֶץ חֲמַ֥ס יְ֝דֵי/כֶ֗ם תְּפַלֵּֽסֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: pt
  text: Até no coração vocês praticam injustiças; na terra[b], suas mãos pesam violência[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “medem violência”. O verbo hebraico pode ter o sentido de pesar ou medir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no país”. O termo hebraico pode designar tanto a terra em sentido amplo quanto uma terra ou país específico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ao contrário
  rationale: A partícula enfática reforça e contrapõe a acusação à alegação implícita de justiça no contexto; em português, “Ao contrário” comunica naturalmente esse movimento.
- source_word: בְּלֵב
  choice: no coração
  rationale: Preserva a imagem hebraica do coração como sede da intenção interior; o singular coletivo acompanha o texto-fonte, embora o destinatário seja plural.
- source_word: עוֹלֹת תִּפְעָלוּן
  choice: vocês praticam injustiças
  rationale: פעל indica fazer ou realizar, e עוֹלֹת é plural; “praticam injustiças” é natural, mantém a ação deliberada e representa o número do substantivo.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém a amplitude possível de אֶרֶץ e o contraste entre a intenção interior e a atuação concreta, sem excluir totalmente a ideia de uma terra ou país específico.
- source_word: חֲמַס
  choice: violência
  rationale: É o equivalente direto e estabelecido para a violência ou o dano violento indicado por חמס.
- source_word: יְדֵיכֶם
  choice: suas mãos
  rationale: Conserva a imagem concreta das mãos como agentes das ações praticadas.
- source_word: תְּפַלֵּסוּן
  choice: pesam
  rationale: Preserva a metáfora de pesar ou medir, especialmente incisiva no contexto de autoridades que deveriam distribuir justiça, mas distribuem violência.
theological_decisions:
- issue: Força metafórica do verbo final em contexto judicial
  choice: “suas mãos pesam a violência”
  alternative: “suas mãos medem a violência” ou “vocês distribuem violência”
  rationale: 'A tradução conserva a ironia judicial do hebraico: em vez de pesar a justiça, as mãos dos acusados pesam violência. A alternativa “distribuem” seria mais idiomática, porém apagaria a metáfora.'
- issue: Valor da partícula inicial אַף
  choice: “Ao contrário”
  alternative: “Sim”, “De fato” ou “Até”
  rationale: O contexto favorece uma acusação enfática e contrastiva. Como a partícula admite mais de uma nuance, a nota registra a alternativa mais estritamente enfática.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A formulação conserva as imagens hebraicas do coração, das mãos e da pesagem. Os marcadores seguem a ordem em que as notas se aplicam ao verso.
