source:
  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: pt
  text: 'E as pessoas dirão: “Certamente há fruto para o justo; certamente há um Deus que julga na terra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz um particípio no plural, literalmente algo como “Deus/deuses que julgam”. A expressão é geralmente entendida como referência ao único Deus, mas também pode ser lida, com menor probabilidade, como “deuses que julgam”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: E as pessoas dirão
  rationale: O imperfeito de אמר, no desfecho da cena de juízo, admite sentido futuro ou resultante. אָדָם é singular genérico; o plural idiomático “as pessoas” comunica naturalmente a humanidade observadora sem limitar a afirmação ao sexo masculino.
- source_word: אַךְ
  choice: Certamente
  rationale: Nas duas ocorrências, a partícula expressa afirmação enfática, não exclusão.
- source_word: פְּרִי לַצַּדִּיק
  choice: há fruto para o justo
  rationale: Mantém a metáfora hebraica de “fruto” como resultado, consequência ou recompensa e preserva a construção existencial elíptica.
- source_word: יֵשׁ אֱלֹהִים
  choice: há um Deus
  rationale: 'יֵשׁ introduz uma afirmação existencial. “Um Deus”, com maiúscula, reproduz de modo natural a força confessional: Deus existe e atua, sem sugerir que seja apenas uma divindade entre outras.'
- source_word: שֹׁפְטִים
  choice: que julga
  rationale: Embora o particípio tenha forma plural, no contexto ele é mais bem entendido com אֱלֹהִים referente ao Deus único; por isso, o português emprega concordância singular idiomática.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: O contexto trata do exercício da justiça divina no mundo, favorecendo “terra” em vez do sentido mais restrito “país” ou “território”.
theological_decisions:
- issue: Sentido de אֱלֹהִים שֹׁפְטִים
  choice: “um Deus que julga”, no singular
  alternative: “deuses que julgam”, no plural
  rationale: O clímax do salmo reconhece a justiça do Deus verdadeiro. Ainda assim, a morfologia plural do particípio é genuína e merece ser registrada, pois permite formalmente uma leitura alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva “fruto” para preservar a imagem poética hebraica e usa “o justo” como singular representativo.
