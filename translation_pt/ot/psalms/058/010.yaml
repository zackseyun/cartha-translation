base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: pt
  text: O justo se alegrará quando vir a vingança[a]; lavará os pés no sangue do ímpio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque viu a vingança”. A conjunção hebraica pode ter sentido causal (“porque”) ou temporal (“quando”).'
    reason: lexical_alternative
  - marker: b
    text: A imagem de lavar os pés no sangue do ímpio é poética e retrata a completude do juízo; não constitui uma ordem para praticar violência pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se alegrará
  rationale: O imperfeito qal, neste contexto poético, tem sentido futuro; a formulação é natural e preserva a força preditiva.
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo substantivado masculino singular, com valor representativo; esta é a forma mais natural em português.
- source_word: כִּי
  choice: quando
  rationale: Introduz aqui a circunstância temporal que suscita a alegria, embora também admita sentido causal; a alternativa é registrada em nota.
- source_word: חָזָה
  choice: vir
  rationale: O perfeito hebraico, subordinado a uma oração de orientação futura, pode ser expresso idiomaticamente pelo futuro do subjuntivo em português.
- source_word: נָקָם
  choice: a vingança
  rationale: Equivalente direto que preserva a severidade da retribuição descrita, sem atenuá-la como mera vindicação.
- source_word: פְּעָמָיו
  choice: os pés
  rationale: Embora o substantivo possa referir-se a passos, a imagem de lavar no sangue favorece o sentido concreto de pés.
- source_word: יִרְחַץ
  choice: lavará
  rationale: Preserva o sentido futuro do imperfeito qal e a imagem poética direta.
- source_word: בְּדַם
  choice: no sangue
  rationale: A preposição é naturalmente locativa nesta imagem; a tradução mantém sua expressão incisiva.
- source_word: הָרָשָׁע
  choice: do ímpio
  rationale: Adjetivo substantivado singular, representativo ou coletivo; 'ímpio' é corrente no registro bíblico português e mantém o contraste moral com 'justo'.
theological_decisions:
- issue: Se o versículo descreve espírito de vingança pessoal ou alegria diante do juízo justo
  choice: Preservar a alegria ao ver a vingança sem atribuí-la explicitamente a uma retaliação pessoal nem acrescentar 'divina' ao texto.
  alternative: Explicitar 'vingança divina' ou reformular como mera 'vindicação'.
  rationale: O hebraico fala de vingança e emprega a imagem violenta de pés lavados no sangue do ímpio. A tradução mantém essa tensão do salmo imprecatório sem introduzir uma qualificação interpretativa ausente no texto.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. 'O justo' e 'o ímpio' preservam o singular representativo do hebraico. Os marcadores aparecem junto às expressões que esclarecem.
