  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: pt
  text: Será que vocês realmente falam o que é justo em silêncio?[a] Será que julgam com retidão, filhos dos homens?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil. O Texto Massorético traz uma palavra que significa “silêncio” ou “mudez”. Muitos, porém, a entendem como “poderosos” ou até “deuses”, resultando em: “Será que vocês realmente falam o que é justo, ó poderosos?”'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “filhos de homem”; também pode ser entendido como “seres humanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Será que vocês realmente
  rationale: Reproduz a pergunta retórica enfática e seu tom de contestação, em português natural.
- source_word: אֵלֶם
  choice: em silêncio
  rationale: Segue a vocalização do Texto Massorético, embora a expressão resultante seja deliberadamente difícil; outras leituras são registradas em nota.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: Expressa o sentido moral e judicial do substantivo com uma construção idiomática junto ao verbo “falar”.
- source_word: תְּדַבֵּרוּן
  choice: falam
  rationale: Equivalente direto e natural do verbo hebraico neste desafio retórico.
- source_word: מֵישָׁרִים
  choice: com retidão
  rationale: Preserva a ideia de equidade e integridade no exercício do julgamento.
- source_word: תִּשְׁפְּטוּ
  choice: julgam
  rationale: Mantém o sentido judicial conciso do verbo hebraico.
- source_word: בְּנֵי אָדָם
  choice: filhos dos homens
  rationale: Conserva a forma masculina e a expressão antropológica do hebraico, que ressalta a condição humana dos destinatários.
theological_decisions:
- issue: Interpretação do difícil אֵלֶם
  choice: Seguir a vocalização massorética com o sentido de “em silêncio” no texto principal.
  alternative: 'Entender a forma como vocativo: “ó poderosos” ou até “ó deuses”.'
  rationale: A leitura massorética deve permanecer no texto principal, mas a alternativa antiga e interpretativamente relevante não deve ser ocultada, pois altera tanto os destinatários quanto a estrutura da pergunta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estranheza de “falar... em silêncio” foi mantida por refletir a dificuldade real do hebraico, sem eliminar a leitura alternativa.
