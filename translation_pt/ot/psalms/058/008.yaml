  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: pt
  text: Como o caracol que se dissolve enquanto avança, como a criança natimorta que não viu o sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sintaxe hebraica da segunda comparação é difícil. Mais literalmente: “o aborto de uma mulher — eles não viram o sol”. O verbo está no plural, embora “aborto” esteja no singular; o sentido parece referir-se à criança, ou coletivamente aos que morrem antes de nascer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: Como
  rationale: Introduz naturalmente as duas comparações poéticas.
- source_word: שַׁבְּלוּל
  choice: o caracol
  rationale: É a identificação tradicional e lexicalmente bem estabelecida; preserva a imagem do animal que parece consumir-se ao deixar seu rastro.
- source_word: תֶּמֶס
  choice: que se dissolve
  rationale: Expressa a ideia de derreter-se ou desfazer-se e funciona naturalmente em português como caracterização do caracol.
- source_word: יַהֲלֹךְ
  choice: enquanto avança
  rationale: Traduz o verbo 'ir/andar' no contexto do movimento do caracol, com fluidez poética.
- source_word: נֵפֶל אֵשֶׁת
  choice: a criança que nasce morta
  rationale: Comunica de modo claro e digno o referente de um aborto espontâneo ou natimorto, evitando que a oração seguinte seja ligada por engano à mulher.
- source_word: בַּל חָזוּ שָׁמֶשׁ
  choice: e não vê o sol
  rationale: Conserva a imagem hebraica e atribui corretamente a ausência de visão do sol à criança, embora o hebraico use verbo no plural.
