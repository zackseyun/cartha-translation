  text: חֲמַת לָ֗/מוֹ כִּ/דְמ֥וּת חֲמַת נָחָ֑שׁ כְּמוֹ פֶ֥תֶן חֵ֝רֵ֗שׁ יַאְטֵ֥ם אָזְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: pt
  text: O veneno deles é como o veneno de uma serpente, como o de uma cobra surda[a] que tapa o ouvido,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “áspide”; o hebraico פֶתֶן se refere a uma serpente venenosa, tradicionalmente traduzida por “áspide”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: veneno
  rationale: No paralelismo com serpente e cobra, o substantivo designa naturalmente veneno, não ira; “veneno” conserva com clareza a imagem.
- source_word: לָמוֹ
  choice: deles
  rationale: 'Nesta construção, a forma pronominal tem valor possessivo com o substantivo: “o veneno deles”.'
- source_word: כִּדְמוּת
  choice: é como
  rationale: A construção introduz uma comparação; “é como” a expressa de modo natural em português.
- source_word: נָחָשׁ
  choice: serpente
  rationale: Termo geral e poeticamente digno, que permite distingui-lo do nome mais específico no segundo membro.
- source_word: כְּמוֹ
  choice: como o de
  rationale: A partícula comparativa é traduzida naturalmente, e “o de” retoma “veneno” sem repetição pesada.
- source_word: פֶתֶן
  choice: cobra
  rationale: O termo hebraico se refere a uma serpente venenosa; “cobra” é um equivalente moderno claro, enquanto a identificação exata da espécie permanece incerta.
- source_word: חֵרֵשׁ
  choice: surda
  rationale: O adjetivo significa “surdo”; a imagem é de uma cobra que não ouve, e não de uma cobra muda.
- source_word: יַאְטֵם
  choice: tapa
  rationale: O verbo comunica a ação de fechar ou vedar; “tapa o ouvido” preserva a imagem física vívida e soa natural.
- source_word: אָזְנוֹ
  choice: o ouvido
  rationale: O sufixo masculino singular retoma a cobra; em português, o artigo definido com a parte do corpo é mais idiomático do que o possessivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A repetição de “veneno” no primeiro membro preserva a ênfase do hebraico, enquanto “como o de” evita uma repetição desnecessariamente pesada no segundo. A vírgula final mantém a continuidade sintática com o versículo seguinte.
