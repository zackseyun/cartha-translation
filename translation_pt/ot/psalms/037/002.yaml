lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém com naturalidade a ligação explicativa.
- source_word: כֶחָצִיר
  choice: como a erva
  rationale: חָצִיר designa erva ou vegetação rasteira; «erva» é corrente e preserva a imagem de transitoriedade.
- source_word: מְהֵרָה
  choice: logo
  rationale: Expressa a rapidez e também a proximidade do fim anunciado; «logo» é natural neste contexto poético.
- source_word: יִמָּלוּ
  choice: murcharão
  rationale: No contexto da vegetação, o verbo pode indicar murchar ou secar, embora também permita a imagem de ser cortado; a alternativa é registrada em nota.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: como a vegetação verde
  rationale: A expressão reúne a ideia de verdor e vegetação tenra; esta formulação evita restringi-la a uma espécie específica.
- source_word: יִבּוֹלוּן
  choice: secarão
  rationale: O verbo descreve a perda de viço da vegetação. «Secarão» forma um paralelo natural com «murcharão» sem apagar a sobreposição semântica.
