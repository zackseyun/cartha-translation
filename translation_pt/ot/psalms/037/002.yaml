  text: Pois depressa murcharão como a erva[a] e secarão como a vegetação verde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «serão cortados como a erva [...] murcharão como a vegetação verde». Os verbos hebraicos deste versículo pertencem a campos de sentido parcialmente sobrepostos e podem transmitir as ideias de murchar, secar, perder o viço ou serem cortados.'
