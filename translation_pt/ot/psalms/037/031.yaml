  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: pt
  text: A lei do seu Deus está em seu coração[a]; seus passos não vacilam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A instrução do seu Deus está em seu coração; seus passos não tropeçam.”'
    reason: Alternativas lexicais legítimas para תּוֹרָה e מעד.
lexical_decisions:
- source_word: תּוֹרַת
  choice: a lei de
  rationale: תּוֹרָה pode significar lei, instrução ou ensino. Neste salmo sapiencial, “lei” preserva a força normativa e pactual da instrução divina, enquanto a nota registra a alternativa lexical legítima.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: 'O substantivo com sufixo masculino singular expressa posse e relação pessoal: “seu Deus”.'
- source_word: בְּלִבּוֹ
  choice: está em seu coração
  rationale: A expressão indica interiorização. No uso hebraico, “coração” abrange o pensamento, a vontade e a vida interior; a formulação é natural e mantém a imagem original.
- source_word: לֹא
  choice: não
  rationale: A negação é mantida diretamente e, com o presente, expressa a verdade geral característica do contexto sapiencial.
- source_word: תִמְעַד
  choice: vacilam
  rationale: מעד pode indicar escorregar, cambalear ou vacilar. Com “passos” como sujeito, “não vacilam” é idiomático em português e preserva a figura de um caminhar firme.
- source_word: אֲשֻׁרָיו
  choice: seus passos
  rationale: O plural designa passos ou pisadas e funciona metaforicamente para o curso da vida; “seus passos” é claro, conciso e natural.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto sapiencial
  choice: lei
  alternative: instrução; ensino
  rationale: “Lei” conserva o peso da vontade divina autorizada e interiorizada pelo justo, sem excluir o campo semântico mais amplo de instrução, explicitado na nota.
- issue: Aspecto temporal de תִמְעַד
  choice: 'presente gnômico: “não vacilam”'
  alternative: 'futuro: “não vacilarão”'
  rationale: O contexto descreve uma característica geral do justo. O presente em português comunica essa verdade proverbial sem impor uma previsão temporal específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo conciso do hebraico e preserva a metáfora dos passos firmes.
