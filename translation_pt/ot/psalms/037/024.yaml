  source_fidelity: A tradução preserva adequadamente o contraste entre נפל (“cair”) e o passivo de טול (“ser lançado/derrubado”), bem como o valor concessivo plausível de כִּי. O nome Yahweh e a imagem concreta da mão são mantidos.
  naturalness: “Ainda que caia, não será lançado por terra” é claro e idiomático. Contudo, “Yahweh segura a sua mão” deixa o possuidor da mão desnecessariamente ambíguo em português, podendo ser lido como a mão do próprio Yahweh. “Yahweh lhe segura a mão” é natural e torna explícita a relação pretendida.
  terminology: “Yahweh” segue a decisão editorial para o Tetragrama. “Lançado por terra” conserva registro digno e a distinção verbal do hebraico. A revisão da nota b conserva a alternativa de סמך sem ambiguidade possessiva.
