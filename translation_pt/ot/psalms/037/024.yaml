  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: pt
  text: Ainda que caia[a], não será lançado por terra, pois Yahweh lhe segura a mão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, se cair, não será lançado por terra”. A conjunção hebraica pode ter sentido causal, condicional ou, como no texto, concessivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sustenta a mão dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ainda que
  rationale: 'No contexto, a conjunção introduz adequadamente uma concessão: a pessoa pode cair, mas não será derrubada de modo definitivo. A nota preserva outras relações sintáticas possíveis.'
- source_word: יִפֹּל
  choice: caia
  rationale: O verbo נפל tem o sentido básico de “cair”. O subjuntivo após “ainda que” expressa a eventualidade sem limitar a queda a pecado, perigo físico ou outro revés específico.
- source_word: יוּטָל
  choice: será lançado por terra
  rationale: A forma passiva de טול indica ser lançado ou derrubado. A expressão distingue este verbo do simples “cair” da oração anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: סוֹמֵךְ
  choice: segura
  rationale: O particípio de סמך comunica apoio contínuo. Com “mão” como objeto, “segura” é natural em português e mantém a imagem concreta de auxílio.
- source_word: יָדוֹ
  choice: a sua mão
  rationale: Reproduz o objeto explícito “sua mão”, preservando a imagem de Yahweh sustentando a mão da pessoa justa.
theological_decisions:
- issue: Sentido metafórico da queda
  choice: Manter a referência ampla a quedas ou reveses da pessoa justa
  alternative: Entender a queda especificamente como pecado, apostasia ou perigo físico
  rationale: O hebraico não especifica a natureza da queda. A formulação preserva essa amplitude e evita impor uma interpretação doutrinária mais estreita.
- issue: Resultado da queda
  choice: “não será lançado por terra”
  alternative: “não cairá jamais” ou “não ficará caído”
  rationale: O versículo admite que a pessoa justa caia, mas nega que seja derrubada ou abandonada de maneira decisiva; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural tanto no Brasil quanto em outros contextos lusófonos. “Lançado por terra” conserva a força passiva do segundo verbo e evita confundi-lo com o primeiro “cair”.
