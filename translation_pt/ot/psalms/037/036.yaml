base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: pt
  text: Mas ele passou[a], e eis que já não estava ali; procurei por ele, mas não foi encontrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passou adiante”. O verbo hebraico pode indicar passar ou desaparecer; aqui descreve o súbito desaparecimento do perverso de vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passou
  rationale: Mantém o sentido básico de עבר, “passar”, sem decidir se a expressão indica apenas passagem, desaparecimento ou morte; o contexto comunica a súbita ausência do perverso.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a função enfática da partícula, que chama a atenção para o resultado inesperado, em registro poético e compreensível.
- source_word: אֵינֶנּוּ
  choice: já não estava ali
  rationale: Expressa a ausência indicada pelo hebraico sem sugerir aniquilação; “ali” torna a formulação natural em português.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: procurei por ele
  rationale: Traduz בקשׁ de modo corrente e claro, preservando a ação concreta de buscar alguém.
- source_word: וְלֹא נִמְצָא
  choice: mas não foi encontrado
  rationale: Conserva a forma passiva do nifal de מצא e explicita naturalmente o contraste com a procura anterior.
theological_decisions:
- issue: Se a passagem do perverso significa morte ou simples desaparecimento de vista
  choice: Não especificar; traduzir “passou” e explicar a amplitude na nota.
  alternative: “morreu” ou “desapareceu”
  rationale: O verbo hebraico permite mais de uma nuance, e o versículo enfatiza sobretudo a transição da presença para a ausência. Uma formulação não interpretativa preserva a ambiguidade original.
translation_notes:
  register: Português moderno, claro e dignificado, com leve cadência poética. “E eis que” conserva a ênfase retórica do hebraico; “já não estava ali” evita a ambiguidade potencial de “já não existia”.
