base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: pt
  text: Afaste-se do mal e faça o bem, e habite para sempre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, à luz do tema recorrente do salmo: “e habite na terra para sempre” ou “e viva em segurança para sempre”. Aqui, o hebraico não diz explicitamente “na terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Afaste-se
  rationale: O imperativo expressa afastar-se ou desviar-se. “Afaste-se” é natural em português moderno e conserva a força moral e volitiva do hebraico.
- source_word: מֵרָע
  choice: do mal
  rationale: A preposição מִן com רַע indica aquilo de que a pessoa deve afastar-se. No contexto ético, “do mal” é a formulação mais natural.
- source_word: וַעֲשֵׂה טוֹב
  choice: e faça o bem
  rationale: Reproduz de modo direto o imperativo e o adjetivo substantivado, mantendo o paralelismo conciso com “afaste-se do mal”.
- source_word: וּשְׁכֹן
  choice: e habite
  rationale: O verbo significa habitar, morar ou estabelecer residência. “Habite” preserva a imagem de permanência residencial sem acrescentar um objeto ausente no hebraico.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua ou indefinida e corresponde de maneira natural e tradicional à concisão do hebraico.
theological_decisions:
- issue: Sentido da exortação/promessa em וּשְׁכֹן לְעוֹלָם
  choice: Traduzir diretamente como “e habite para sempre”, preservando a sequência de imperativos e sem explicitar objeto.
  alternative: “e habite na terra para sempre” ou “e viva em segurança para sempre”
  rationale: O tema recorrente do salmo favorece a compreensão de permanência na terra ou em segurança, mas este versículo não declara explicitamente “na terra”. A tradução principal mantém a forma concisa e a ambiguidade do texto hebraico, enquanto a nota registra as leituras contextuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo ético e a concisão poética do hebraico; o ponto e vírgula ajuda a distinguir a última exortação sem romper a unidade do verso.
