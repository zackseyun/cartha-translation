  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: pt
  text: Pois os braços dos perversos serão quebrados[a], mas Yahweh sustenta os justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “braços”; a imagem provavelmente representa a força ou o poder dos perversos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da exortação no contexto e preserva com naturalidade a força causal do hebraico.
- source_word: זְרוֹעוֹת
  choice: os braços
  rationale: Mantém a imagem concreta do hebraico, na qual os braços podem representar, por metonímia, força ou poder.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Expressa o adjetivo substantivado plural como uma categoria moral de pessoas, em linguagem clara e corrente.
- source_word: תִּשָּׁבַרְנָה
  choice: serão quebrados
  rationale: Reproduz diretamente a forma passiva e futura/imperfectiva, em concordância com 'braços'.
- source_word: וְ
  choice: mas
  rationale: Explicita o contraste discursivo entre o destino dos perversos e o amparo concedido aos justos.
- source_word: סוֹמֵךְ
  choice: sustenta
  rationale: O particípio indica apoio contínuo; 'sustenta' é natural em português e conserva essa ideia durativa.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Tradução concisa e tradicional do adjetivo substantivado plural, adequada ao contexto sapiencial e poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e representa de modo amplamente aceito sua provável vocalização.
- issue: Metáfora dos braços dos perversos
  choice: Preservar 'braços' no texto e explicar sua possível força metonímica em nota
  alternative: Traduzir diretamente como 'força' ou 'poder'
  rationale: A imagem concreta pertence à poesia hebraica e não deve ser reduzida a uma única interpretação, embora o sentido figurado provável seja esclarecido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura poética e o contraste entre os perversos e os justos foram preservados; o nome divino aparece como Yahweh.
