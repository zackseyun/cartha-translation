id: PSA.37.11
reference: Psalms 37:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: pt
  text: Mas os humildes herdarão a terra[a] e se deleitarão na abundância de paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os mansos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo plural designa pessoas humildes, mansas ou socialmente abatidas. “Os humildes” é claro e atual, sem reduzir o sentido a timidez; “os mansos” permanece como alternativa lexical relevante.
- source_word: יִירְשׁוּ
  choice: herdarão
  rationale: Preserva o sentido futuro e a ressonância pactual de receber ou tomar posse, mais plenamente do que o simples “possuirão”.
- source_word: אָרֶץ
  choice: a terra
  rationale: Em português, “a terra” preserva a ambiguidade do hebraico entre território e mundo terrestre, embora o contexto do salmo favoreça especialmente a ideia da terra como lugar de posse e segurança.
- source_word: וְהִתְעַנְּגוּ
  choice: e se deleitarão
  rationale: Expressa naturalmente a forma reflexiva hebraica e mantém o tom elevado do salmo.
- source_word: עַל
  choice: na
  rationale: Com o verbo “deleitar-se” e um substantivo abstrato, “na” é a construção idiomática natural em português.
- source_word: רֹב
  choice: abundância de
  rationale: Traduz diretamente a ideia de grande quantidade ou plenitude e forma uma expressão portuguesa natural com “paz”.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a equivalência principal e concisa, abrangendo aqui segurança e bem-estar, ainda que o hebraico possa ter alcance mais amplo.
theological_decisions:
- issue: Ressonância intertextual com Mateus 5:5 e a formulação tradicional sobre os mansos herdarem a terra
  choice: Traduzir עֲנָוִים como “os humildes”, registrando “os mansos” em nota, e manter “a terra”, que em português conserva naturalmente a amplitude de אָרֶץ.
  alternative: Os mansos herdarão a terra.
  rationale: A tradução parte diretamente do hebraico e evita impor a formulação tradicional como única leitura. Ao mesmo tempo, a nota preserva a alternativa lexical legítima e sua importante ressonância intertextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A conjunção adversativa “Mas” preserva o contraste do contexto. Não se acrescenta nota separada para “terra/mundo”, pois o português “terra” já comporta naturalmente ambos os alcances do hebraico; a tradução mantém assim a ambiguidade genuína sem sobrecarregar o versículo.
