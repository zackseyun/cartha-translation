  text: צוֹפֶ֣ה רָ֭שָׁע לַ/צַּדִּ֑יק וּ֝/מְבַקֵּ֗שׁ לַ/הֲמִית/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/032.yaml
  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: pt
  text: O perverso observa[a] o justo e procura matá-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fica à espreita do justo”. Neste contexto, o verbo hebraico pode indicar uma observação hostil, feita com a intenção de causar dano.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fazê-lo morrer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: observa
  rationale: O particípio de צפה indica observar ou vigiar. “Observa” preserva o sentido básico, enquanto o contexto hostil e a oração paralela deixam clara a intenção nociva.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado no singular designa uma pessoa moralmente perversa e mantém o singular representativo da poesia hebraica.
- source_word: לַצַּדִּיק
  choice: o justo
  rationale: Mantém a categoria ética central do salmo e é uma expressão natural e consagrada em português.
- source_word: וּמְבַקֵּשׁ
  choice: e procura
  rationale: בקש significa normalmente procurar ou buscar; aqui expressa a intenção hostil do perverso de matar o justo.
- source_word: לַהֲמִיתוֹ
  choice: matá-lo
  rationale: O infinitivo hifil de מות significa causar a morte. “Matá-lo” comunica esse sentido com precisão, concisão e naturalidade em português contemporâneo.
- source_word: וּ
  choice: e
  rationale: 'A conjunção liga diretamente as duas ações participiais: observar e procurar matar.'
theological_decisions: []
