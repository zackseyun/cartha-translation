  text: וְ/הִתְעַנַּ֥ג עַל יְהוָ֑ה וְ/יִֽתֶּן לְ֝/ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: pt
  text: Tenha prazer em Yahweh, e ele lhe dará os desejos do seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pedidos do seu coração”. O substantivo hebraico pode se referir tanto ao que se pede quanto ao que se deseja interiormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Tenha prazer
  rationale: O imperativo hitpael conclama o destinatário a encontrar prazer profundo; em português, “tenha prazer” comunica essa ideia de modo natural, atual e digno.
- source_word: עַל
  choice: em
  rationale: Embora a preposição tenha o sentido básico de “sobre”, com este verbo a relação é expressa idiomaticamente em português por “em”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִתֶּן
  choice: ele lhe dará
  rationale: O imperfeito qal com a conjunção é entendido naturalmente, neste contexto de exortação sapiencial, como futuro ou resultado.
- source_word: מִשְׁאֲלֹת
  choice: os desejos
  rationale: O substantivo pode indicar tanto desejos quanto pedidos; ligado a “coração”, “desejos” expressa com naturalidade os anseios interiores, sem eliminar a alternativa lexical registrada em nota.
- source_word: לִבֶּךָ
  choice: do seu coração
  rationale: “Coração” preserva a imagem hebraica da interioridade, que abrange desejos, vontade e pensamento.
theological_decisions:
- issue: Possível leitura da promessa como garantia de prosperidade
  choice: Manter a promessa em sua forma direta, sem qualificações interpretativas.
  alternative: Acrescentar “desejos piedosos” ou explicar que Deus transforma os desejos.
  rationale: O hebraico não contém essas qualificações. A tradução deve preservar a afirmação e sua tensão teológica, sem inserir uma solução doutrinária.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém concisão poética e dignidade, sem explicitar no texto principal interpretações ausentes do hebraico.
