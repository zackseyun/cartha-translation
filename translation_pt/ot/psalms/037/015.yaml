  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: pt
  text: 'A espada deles entrará no próprio coração[a],

    e os seus arcos serão quebrados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A espada deles entrará nos próprios corações”. Em hebraico, “coração” está no singular com um possessivo plural, uma construção coletiva comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: a espada deles
  rationale: O substantivo está no singular com sufixo de terceira pessoa masculina plural. O português preserva naturalmente o singular coletivo ou distributivo.
- source_word: תָּבוֹא
  choice: entrará
  rationale: O Qal imperfeito concorda com o sujeito feminino singular, “espada”. Com בְּ e “coração”, “entrará” expressa de modo natural a ideia de penetração.
- source_word: בְלִבָּם
  choice: no próprio coração
  rationale: A preposição permite o sentido “em/para dentro de”. “Próprio” explicita com naturalidade a referência reflexiva implícita no contexto, em que a arma se volta contra seus possuidores.
- source_word: וְקַשְּׁתוֹתָם
  choice: e os seus arcos
  rationale: O substantivo é plural com sufixo de terceira pessoa masculina plural; a conjunção também é preservada.
- source_word: תִּשָּׁבַרְנָה
  choice: serão quebrados
  rationale: O Nifal imperfeito feminino plural de שבר tem sentido passivo. “Serão quebrados” é direto e não aumenta indevidamente a intensidade para “despedaçados”.
