  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: pt
  text: Entregue o seu caminho a Yahweh[a]; confie nele, e ele agirá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Role o seu caminho sobre Yahweh”. A expressão significa confiar a ele o rumo da própria vida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ele o fará” ou “e ele fará isso acontecer”. O hebraico diz apenas que ele “fará” ou “agirá”, sem explicitar o objeto.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Entregue
  rationale: O imperativo significa literalmente “role”, mas, nesta construção com עַל e “seu caminho”, expressa a ideia de confiar a alguém o próprio curso de vida. “Entregue” comunica o sentido idiomático com naturalidade em português.
- source_word: עַל
  choice: a
  rationale: Embora a preposição signifique literalmente “sobre”, o verbo português “entregar” rege naturalmente “a”. A imagem hebraica subjacente é preservada na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דַּרְכֶּךָ
  choice: o seu caminho
  rationale: Reprodução direta e natural; em contexto sapiencial, “caminho” pode abranger o rumo da vida, a conduta e os projetos pessoais.
- source_word: וּבְטַח
  choice: confie
  rationale: O imperativo de בטח pede confiança ou dependência pessoal; “confie” é conciso e corrente.
- source_word: עָלָיו
  choice: nele
  rationale: A preposição é literalmente “sobre ele”, mas “confiar nele” é a construção idiomática natural em português.
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém a sequência hebraica e a ênfase explícita no sujeito que realizará a ação.
- source_word: יַעֲשֶׂה
  choice: agirá
  rationale: O verbo עשה é amplo, e o hebraico não explicita objeto. “Agirá” preserva essa abertura sem acrescentar o que exatamente Yahweh fará.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não apenas um título. “Yahweh” preserva sua função como nome próprio.
- issue: Objeto implícito de יַעֲשֶׂה
  choice: e ele agirá
  alternative: e ele o fará; e ele fará isso acontecer
  rationale: Como não há objeto expresso no hebraico, a formulação aberta evita tornar a promessa mais específica do que o texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Entregue o seu caminho” conserva a linguagem sapiencial tradicional sem manter de modo artificial o verbo literal “rolar”; “agirá” preserva a concisão e a ambiguidade do hebraico.
