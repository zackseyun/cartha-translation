source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: pt
  text: Deixe de lado a ira e abandone o furor; não se irrite[a], pois isso só leva a fazer o mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se agite” ou “não se inflame de indignação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “somente para fazer o mal”. A construção também pode ser entendida como uma indicação de propósito.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Deixe de lado a ira
  rationale: O imperativo de רפה pede que se cesse ou largue algo; “deixe de lado” expressa isso com naturalidade. אַף é traduzido por seu sentido figurado comum, “ira”, e não pelo sentido literal de “nariz”.
- source_word: וַעֲזֹב חֵמָה
  choice: e abandone o furor
  rationale: עזב significa deixar ou abandonar, enquanto חֵמָה indica ira intensa ou ardente. “Furor” mantém a força poética e distingue o termo da “ira” da primeira oração.
- source_word: אַל תִּתְחַר
  choice: não se irrite
  rationale: A forma verbal pode descrever alguém que se inflama, se agita ou fica indignado. “Não se irrite” é claro e atual, sem enfraquecer a advertência.
- source_word: אַךְ לְהָרֵעַ
  choice: pois isso só leva a fazer o mal
  rationale: אַךְ tem força restritiva, “somente”. O infinitivo com לְ pode indicar propósito ou resultado; no contexto, a formulação principal apresenta a irritação como caminho para a prática do mal, enquanto a nota preserva a construção mais literal.
theological_decisions:
- issue: Força moral da oração final
  choice: 'A oração é apresentada como advertência sobre o resultado da irritação: “isso só leva a fazer o mal”.'
  alternative: “somente para fazer o mal”
  rationale: A construção hebraica compacta admite uma leitura de resultado ou de propósito. O texto principal usa a leitura de resultado, natural no contexto do salmo, sem eliminar a alternativa mais literal, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético entre “ira” e “furor”. A redação evita vocabulário arcaico e preserva em notas a amplitude lexical e sintática do hebraico.
