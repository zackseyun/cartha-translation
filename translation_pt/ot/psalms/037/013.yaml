  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: pt
  text: O Senhor ri dele[a], pois vê que o dia dele[b] está chegando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zomba dele” ou “caçoa dele”; o verbo hebraico significa literalmente “ri”, aqui com sentido de escárnio no contexto.
    reason: lexical_alternative
  - marker: b
    text: “O dia dele” se refere ao dia determinado para a queda ou o juízo do perverso.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: O título divino אֲדֹנָי é expresso naturalmente em português como “o Senhor”, preservando a referência ao senhorio de Deus.
- source_word: יִשְׂחַק
  choice: ri
  rationale: O verbo שׂחק significa literalmente “rir”. O contexto lhe confere sentido de escárnio, mas a tradução mantém o núcleo lexical sem explicitar além do hebraico.
- source_word: לוֹ
  choice: dele
  rationale: Com o verbo “rir”, a construção idiomática portuguesa “rir de alguém” indica que o perverso é alvo do riso; por isso, לֹו é traduzido por “dele”.
- source_word: כִּי
  choice: pois
  rationale: A primeira ocorrência introduz a razão do riso do Senhor, e “pois” preserva de modo conciso a relação causal.
- source_word: רָאָה
  choice: vê
  rationale: 'Embora a forma hebraica seja perfeita, ela comunica percepção presente e relevante: o Senhor vê o desfecho que se aproxima. “Vê” evita a interpretação adicional de “sabe”.'
- source_word: כִּי
  choice: que
  rationale: A segunda ocorrência introduz o conteúdo daquilo que o Senhor vê.
- source_word: יָבֹא
  choice: está chegando
  rationale: O imperfeito aponta para um acontecimento futuro iminente; “está chegando” preserva sua vivacidade e proximidade.
- source_word: יוֹמוֹ
  choice: o dia dele
  rationale: A expressão traduz literalmente “seu dia”. No contexto, trata-se do dia destinado à queda ou ao juízo do perverso, sentido esclarecido em nota sem ser inserido no texto.
theological_decisions:
- issue: Natureza do riso divino
  choice: O texto apresenta o Senhor rindo do perverso diante do juízo que se aproxima.
  alternative: “O Senhor zomba dele” ou uma referência a um riso sem conotação de escárnio.
  rationale: O verbo hebraico denota literalmente rir, enquanto o contexto lhe dá força de escárnio judicial. “Ri” conserva a forma lexical e a tensão do texto sem sugerir frivolidade nem tornar explícita uma interpretação que permanece contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das notas acompanha sua ocorrência no texto; “o dia dele” mantém a concisão poética e evita a possível ambiguidade referencial de “seu dia”.
