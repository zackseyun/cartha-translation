source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: pt
  text: Yahweh conhece os dias dos íntegros[a], e a herança deles será para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irrepreensíveis”, “retos” ou “de coração inteiro”.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode dar a entender que eles possuirão sua herança permanentemente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יוֹדֵעַ
  choice: conhece
  rationale: Traduz diretamente o particípio hebraico e mantém em aberto a possível dimensão atenta e relacional desse conhecimento.
- source_word: יְמֵי
  choice: os dias dos
  rationale: Conserva a expressão concreta do hebraico, que no contexto pode abranger o curso ou a duração da vida.
- source_word: תְמִימִם
  choice: íntegros
  rationale: Comunica inteireza de caráter e retidão sem sugerir necessariamente perfeição absoluta ou ausência total de pecado.
- source_word: נַחֲלָתָם
  choice: a herança deles
  rationale: Preserva tanto o sentido de herança ou porção recebida quanto sua ressonância pactual.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a forma portuguesa natural e direta para a duração indefinida ou permanente indicada no hebraico.
- source_word: תִּהְיֶה
  choice: será
  rationale: Reproduz de modo simples o valor futuro do verbo sem acrescentar explicitamente a ideia interpretativa de permanência.
theological_decisions:
- issue: Sentido de תְמִימִם no contexto sapiencial
  choice: Pessoas caracterizadas pela integridade
  alternative: Os irrepreensíveis; os retos; pessoas moralmente perfeitas
  rationale: O termo indica inteireza e integridade no contraste entre justos e perversos, sem exigir uma afirmação de impecabilidade absoluta.
- issue: Força do conhecimento de Yahweh
  choice: Traduzir simplesmente por “conhece”
  alternative: Cuida dos; vela por; aprova
  rationale: O contexto pode sugerir conhecimento atento e relacional, mas essas paráfrases tornariam explícito mais do que o verbo hebraico diz.
- issue: Permanência da herança
  choice: “será para sempre”
  alternative: Permanecerá para sempre; será possuída para sempre
  rationale: A formulação mantém a ambiguidade do original entre a duração da própria herança e a posse duradoura dela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi regularizada para que cada marcador apareça junto ao elemento explicado.
