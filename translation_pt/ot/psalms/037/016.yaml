  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: pt
  text: Melhor é o pouco do justo do que a abundância de muitos perversos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Melhor é o pouco para o justo do que a grande abundância dos perversos». O hebraico é elíptico; «muitos» pode qualificar os perversos, como no texto principal, ou a abundância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Nesta construção comparativa de tom proverbial, טוֹב tem o sentido idiomático de «melhor»; a ordem escolhida conserva a concisão e a solenidade do hebraico.
- source_word: מְעַט
  choice: o pouco
  rationale: Expressa uma quantidade pequena e estabelece o contraste direto com הֲמוֹן, «abundância».
- source_word: לַצַּדִּיק
  choice: do justo
  rationale: O ל pode indicar posse nesta frase elíptica. «Do justo» comunica naturalmente tanto aquilo que ele possui quanto a possível ideia mais geral de algo destinado a ele.
- source_word: מֵהֲמוֹן
  choice: do que a abundância de
  rationale: הָמוֹן pode indicar abundância, grande quantidade ou riqueza. «Abundância» preserva a amplitude lexical e evita restringir o sentido exclusivamente a bens materiais.
- source_word: רְשָׁעִים
  choice: perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente culpáveis; «perversos» é corrente, claro e digno em português.
- source_word: רַבִּים
  choice: muitos
  rationale: O plural concorda mais naturalmente com רְשָׁעִים, produzindo «muitos perversos», embora a expressão hebraica permita alguma ambiguidade.
