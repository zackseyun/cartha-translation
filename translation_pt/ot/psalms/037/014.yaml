  verdict: approve
  source_fidelity: 'O texto reproduz com precisão a sequência e os propósitos da ação dos ímpios: desembainhar a espada, retesar o arco, derrubar o pobre e o necessitado e matar pessoas de conduta íntegra. «Desembainharam» traduz adequadamente o uso idiomático de פָּתְחוּ com «espada», e «retesaram o arco» comunica bem a preparação para o ataque expressa por וְדָרְכוּ קַשְׁתָּם. «Os que seguem um caminho reto» explicita de modo fiel e natural o sentido moral de יִשְׁרֵי דָרֶךְ, sem impor uma leitura confessional.'
