  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: pt
  text: Os ímpios desembainharam a espada e retesaram o arco para derrubar o pobre e o necessitado, para matar os que seguem um caminho reto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: desembainharam a espada
  rationale: O verbo significa literalmente “abrir”, mas, combinado com “espada”, forma uma expressão marcial para tirá-la da bainha. “Desembainharam” reproduz o sentido de modo claro e natural.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Equivalente tradicional e ainda compreensível para a categoria moral substantivada no hebraico, sem acrescentar especificação de gênero.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: e retesaram o arco
  rationale: Com “arco”, o verbo descreve o ato de curvá-lo ou armá-lo para o disparo. “Retesaram” comunica essa preparação bélica, e o singular preserva o singular coletivo do hebraico.
- source_word: לְהַפִּיל
  choice: para derrubar
  rationale: O hifil de נפל significa “fazer cair”. “Derrubar” mantém o caráter intencional e violento da ação.
- source_word: עָנִי וְאֶבְיוֹן
  choice: o pobre e o necessitado
  rationale: A dupla expressão designa pessoas econômica e socialmente vulneráveis. A tradução conserva os dois termos sobrepostos, mas distintos.
- source_word: לִטְבֹחַ
  choice: para matar
  rationale: O verbo pode indicar abater ou massacrar. Neste contexto humano e poético, “matar” é natural e dignificado, embora menos gráfico que “massacrar”.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: os que seguem um caminho reto
  rationale: A expressão significa literalmente “retos de caminho”. A formulação portuguesa comunica a integridade moral do modo de viver sem recorrer a um decalque pouco natural.
theological_decisions:
- issue: Sentido moral de יִשְׁרֵי דָרֶךְ
  choice: os que seguem um caminho reto
  alternative: os retos de caminho
  rationale: A escolha mantém a metáfora bíblica do caminho como conduta de vida e evita transformar a expressão em uma afirmação de impecabilidade ou em terminologia confessional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela dos dois propósitos violentos foi preservada.
