  terminology: «Ímpios» preserva a categoria moral hebraica sem marcar gênero. «Pobre e necessitado» conserva o paralelismo de עָנִי e אֶבְיוֹן. Embora לִטְבֹחַ possa ter força mais gráfica, «matar» é uma representação semanticamente segura, idiomática e digna no contexto poético; não é necessário intensificá-la com termos potencialmente interpretativos como «massacrar» ou «trucidar».
