review_pass:
  verdict: revise
  source_fidelity: A redação preserva bem a estrutura explicativa de כִּי, o contraste entre os dois grupos, a ênfase de הֵמָּה e a ambiguidade de אָרֶץ. Contudo, “esperam em Yahweh” tende em português a significar confiar em Yahweh, ao passo que קֹוֵי יְהוָה expressa primariamente esperar por Yahweh, com expectativa confiante.
  naturalness: O texto é claro, moderno e de registro apropriado. “Esperam por Yahweh” é igualmente natural e comunica com maior precisão a construção hebraica.
  terminology: “Yahweh”, “herdarão” e “a terra” são escolhas adequadas. “Serão eliminados” comunica o resultado de יִכָּרֵתוּן, embora seja menos imagético que “serão cortados”; não exige alteração. A nota deve apresentar a alternativa de alcance amplo de אָרֶץ, não simplesmente substituí-la por “país”.
  issues:
  - severity: medium
    issue: “esperam em Yahweh” para וְקֹוֵי יְהוָה
    rationale: Em português, esperar em alguém normalmente descreve confiança ou esperança depositada nessa pessoa. O hebraico קוה com Yahweh como complemento expressa espera por Yahweh; “esperam por Yahweh” mantém essa orientação, sem excluir a expectativa confiante implicada pelo contexto.
  - severity: low
    issue: Nota “Ou ‘o país’”
    rationale: “País” é uma especificação moderna e mais estreita do que אָרֶץ. A alternativa relevante é o alcance amplo de “terra”, isto é, “a terra” no sentido de mundo/terra inteira, em contraste com a referência a uma terra ou território determinado.
  revised_text: Pois os que praticam o mal serão eliminados, mas os que esperam por Yahweh — esses herdarão a terra.[a]
  revised_footnotes:
  - marker: a
    text: Ou “a terra” em sentido mais amplo. A palavra hebraica pode indicar tanto uma terra ou território específico quanto a terra em sentido global.
    reason: lexical_alternative
