  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: pt
  text: Pois os que praticam o mal serão eliminados, mas os que esperam por Yahweh — esses herdarão a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra” em sentido mais amplo. A palavra hebraica pode indicar tanto uma terra ou território específico quanto a terra em sentido global.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e mantém de modo natural a relação explicativa.
- source_word: מְרֵעִים
  choice: os que praticam o mal
  rationale: Expressa de maneira clara e atual o particípio substantivado, identificando pessoas caracterizadas por fazer o mal.
- source_word: יִכָּרֵתוּן
  choice: serão eliminados
  rationale: O nifal de כרת comunica ser cortado, removido ou excluído. “Serão eliminados” preserva a força judicial em português corrente sem especificar além do hebraico o modo dessa remoção.
- source_word: וְקֹוֵי
  choice: mas os que esperam em
  rationale: קוה indica espera confiante e expectante. “Esperam em” conserva tanto a paciência quanto a confiança, enquanto “mas” torna explícito o contraste contextual expresso pela conjunção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הֵמָּה
  choice: esses
  rationale: O pronome independente é enfático; “esses”, após o travessão, reproduz naturalmente a ênfase contrastiva.
- source_word: יִירְשׁוּ
  choice: herdarão
  rationale: Preserva a dimensão de promessa e herança ligada à aliança, além de acompanhar o vocabulário recorrente do salmo.
- source_word: אָרֶץ
  choice: a terra
  rationale: Pode designar a terra prometida ou a terra em sentido mais amplo. Em português, “a terra” conserva essa ambiguidade melhor do que uma formulação mais específica.
theological_decisions:
- issue: Alcance de אָרֶץ na promessa
  choice: a terra
  alternative: a terra prometida ou o mundo habitado
  rationale: O contexto do salmo evoca a promessa pactual da terra, mas o substantivo hebraico também pode ter alcance mais amplo. A tradução “a terra” mantém aberta essa tensão sem restringir o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “os que praticam o mal” evita o tom menos corrente de “malfeitores”; o travessão e “esses” preservam a ênfase do pronome hebraico.
