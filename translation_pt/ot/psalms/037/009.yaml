- from: Pois os que praticam o mal serão eliminados, mas os que esperam em Yahweh — esses herdarão a terra.[a]
  to: Pois os que praticam o mal serão eliminados, mas os que esperam por Yahweh — esses herdarão a terra.[a]
  rationale: A revisão troca “esperam em” por “esperam por” para reproduzir mais diretamente o complemento de קוה e ajusta a nota para preservar a alternativa semântica pertinente de אָרֶץ. O restante do texto é mantido.
  reviewer_model: gpt-5.6-terra
