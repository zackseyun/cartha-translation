  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: pt
  text: Confie em Yahweh e faça o bem; habite na terra e cultive a fidelidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alimente-se de fidelidade”; outra possibilidade: “desfrute de segurança”. A expressão hebraica é difícil e pode evocar a imagem de pastar ou de ser nutrido pela fidelidade ou confiabilidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Confie
  rationale: O imperativo de בטח expressa depositar confiança em alguém; “confie” é natural em português e preserva a exortação direta.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica aquele em quem se deposita confiança, e o nome da aliança יְהוָה é transliterado como “Yahweh”.
- source_word: וַעֲשֵׂה טוֹב
  choice: e faça o bem
  rationale: Tradução concisa e idiomática do imperativo seguido de טוֹב, empregado como objeto substantivado.
- source_word: שְׁכָן אֶרֶץ
  choice: habite na terra
  rationale: שׁכן significa habitar ou estabelecer-se; “a terra” se ajusta ao tema recorrente do salmo, em vez do sentido mais amplo de “o mundo”.
- source_word: וּרְעֵה
  choice: e cultive
  rationale: רעה pode significar pastorear, apascentar ou alimentar-se. Com o substantivo abstrato אֱמוּנָה, “cultive” comunica uma atividade contínua de promover e praticar, sem ocultar em nota a metáfora e a ambiguidade do hebraico.
- source_word: אֱמוּנָה
  choice: a fidelidade
  rationale: אֱמוּנָה pode indicar fidelidade, firmeza, confiabilidade ou segurança. “Fidelidade” combina com as exortações éticas do contexto, enquanto outras possibilidades são registradas em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva no texto o nome divino específico presente no hebraico, sem substituí-lo por um título.
- issue: Interpretação de וּרְעֵה אֱמוּנָה
  choice: cultive a fidelidade
  alternative: alimente-se de fidelidade; desfrute de segurança
  rationale: A expressão hebraica é difícil e admite tanto uma imagem ligada ao pastoreio ou à alimentação quanto uma leitura relacionada à segurança. A tradução principal busca clareza sem eliminar as alternativas, preservadas na nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos diretos. A pontuação mantém os dois pares de exortações do verso, e a nota preserva a ambiguidade lexical e metafórica da frase final.
