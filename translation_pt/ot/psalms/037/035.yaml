  yaml_path: translation/ot/psalms/037/035.yaml
  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: pt
  text: Vi um perverso e opressor expandir-se como uma árvore nativa e viçosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto à imagem: “como um nativo viçoso”. A expressão hebraica é difícil. Muitos entendem que ela evoca uma árvore nativa, vigorosa em seu ambiente; por isso a tradução explicita “árvore”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O qal perfeito na primeira pessoa do singular relata uma observação passada. Em português, o pretérito perfeito é natural e pode conservar a relevância reflexiva no contexto do salmo.
- source_word: רָשָׁע
  choice: perverso
  rationale: Designa alguém moralmente mau ou culpado. “Perverso” é corrente, digno e adequado ao contexto sapiencial.
- source_word: עָרִיץ
  choice: opressor
  rationale: O termo descreve uma pessoa poderosa, tirânica e intimidadora. “Opressor” preserva a dimensão social do abuso de poder sem restringi-lo à violência física.
- source_word: וּמִתְעָרֶה
  choice: expandir-se
  rationale: A forma hitpael participial apresenta um desenvolvimento expansivo e vigoroso. “Expandir-se” conserva o matiz reflexivo e funciona com a metáfora arbórea.
- source_word: כְּאֶזְרָח
  choice: como árvore ... em seu próprio solo
  rationale: אֶזְרָח normalmente significa “nativo” ou “nascido no lugar”. No símile poético, a imagem provavelmente é a de uma árvore enraizada em seu solo nativo; explicitar “árvore” torna a comparação inteligível.
- source_word: רַעֲנָן
  choice: viçosa
  rationale: Expressa verdor, frescor e crescimento vigoroso. “Viçosa” preserva de modo natural a imagem vegetal.
