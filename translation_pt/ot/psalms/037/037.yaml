  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: pt
  text: Observe o íntegro[a] e veja o reto, pois há futuro[b] para o homem de paz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preste atenção ao íntegro e olhe para o reto”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “fim” ou “desfecho”; alguns o entendem aqui como “posteridade”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “homem pacífico”; “paz” também pode comunicar bem-estar ou inteireza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Observe
  rationale: O imperativo, neste contexto, convida a prestar cuidadosa atenção a alguém, e não a guardá-lo. “Observe” mantém a concisão e a força exortativa.
- source_word: תָּם
  choice: o íntegro
  rationale: O termo descreve inteireza e integridade moral, não perfeição sem pecado. “Íntegro” é natural em português e preserva essa nuance.
- source_word: וּרְאֵה
  choice: e contemple
  rationale: O segundo imperativo forma um paralelo poético com שְׁמָר. “Contemple” evita uma repetição pouco expressiva e comunica atenção deliberada.
- source_word: יָשָׁר
  choice: o reto
  rationale: O adjetivo substantivado designa quem possui retidão moral. “O reto” preserva tanto a forma concisa quanto o paralelismo com “o íntegro”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação anterior; “pois” expressa naturalmente essa relação explicativa.
- source_word: אַחֲרִית
  choice: futuro
  rationale: Pode indicar futuro, fim ou desfecho e, possivelmente, posteridade. “Futuro” comunica aqui uma perspectiva positiva sem definir em excesso sua natureza.
- source_word: לְאִישׁ
  choice: para o homem
  rationale: Mantém o substantivo masculino singular explicitamente presente no hebraico e soa natural com a expressão qualificadora seguinte.
- source_word: שָׁלוֹם
  choice: de paz
  rationale: “Paz” é o equivalente mais direto, ao mesmo tempo que permite as nuances de pacificidade, bem-estar e integridade associadas a שָׁלוֹם.
theological_decisions:
- issue: Masculino singular אִישׁ em uma afirmação sapiencial
  choice: o homem
  alternative: a pessoa
  rationale: O texto hebraico emprega explicitamente o substantivo masculino singular. A tradução o preserva sem negar o possível alcance representativo do princípio sapiencial.
- issue: Sentido de אַחֲרִית no destino do íntegro
  choice: há futuro
  alternative: há um fim, há um desfecho ou há posteridade
  rationale: O contexto contrasta o destino final dos retos com o dos transgressores. “Futuro” transmite uma perspectiva positiva, enquanto a nota conserva a amplitude lexical e evita decidir indevidamente entre desfecho e descendência.
- issue: Caracterização de אִישׁ שָׁלוֹם
  choice: homem de paz
  alternative: homem pacífico ou homem que desfruta de bem-estar
  rationale: A construção literal preserva a tensão entre caráter pacífico e estado de bem-estar, sem reduzir שָׁלוֹם a apenas uma dessas ideias.
translation_notes:
  register: Português moderno, claro e digno, com concisão poética. Foram mantidos os dois imperativos paralelos, os adjetivos substantivados “o íntegro” e “o reto” e a expressão deliberadamente ampla “homem de paz”.
