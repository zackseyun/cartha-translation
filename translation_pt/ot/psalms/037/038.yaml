  - severity: low
    issue: «Perversos» é menos preciso como equivalente lexical estabelecido de רְשָׁעִים neste salmo.
    rationale: «Ímpios» mantém a categoria moral/judicial recorrente dos Salmos e evita uma possível leitura predominantemente psicológica de «perversos».
