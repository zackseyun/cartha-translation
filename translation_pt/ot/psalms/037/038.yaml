  source_fidelity: A primeira linha transmite adequadamente a destruição coletiva dos transgressores. Na segunda, porém, «será eliminado» enfraquece e apaga a imagem verbal de כרת («ser cortado»), que é relevante e perfeitamente compreensível em registro bíblico português. «Futuro» é uma opção legítima para אַחֲרִית, desde que a alternativa «fim» permaneça na nota.
  naturalness: «O futuro dos perversos será eliminado» é compreensível, mas pouco idiomático em português e menos expressivo do que «será cortado». «Ímpios» é a designação tradicional e ainda corrente no registro dos Salmos, preservando o contraste moral sem sugerir perversidade psicológica.
  terminology: «Transgressores» corresponde bem a פֹשְׁעִים. «Ímpios» corresponde de modo mais estabelecido a רְשָׁעִים no vocabulário poético e sapiencial bíblico. «Cortado» preserva a formulação de נִכְרָתָה.
