  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: pt
  text: Mas os transgressores serão todos destruídos; o futuro dos ímpios será cortado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o fim dos ímpios será cortado”. O hebraico אַחֲרִית pode significar “futuro”, “desfecho” ou “fim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֹשְׁעִים
  choice: Mas os transgressores
  rationale: פֹשְׁעִים designa os que se rebelam ou transgridem. “Transgressores” preserva o sentido moral e jurídico; o waw é traduzido como “Mas” para expressar o contraste com o destino dos íntegros no versículo anterior.
- source_word: נִשְׁמְדוּ יַחְדָּו
  choice: serão todos destruídos
  rationale: O nifal de שׁמד comunica destruição, enquanto יַחְדָּו pode significar “juntos” ou “todos/por igual”. Nesta sentença de caráter proverbial e prospectivo, “serão todos destruídos” soa natural e expressa o destino comum dos transgressores.
- source_word: אַחֲרִית
  choice: o futuro
  rationale: O termo pode indicar futuro, destino, desfecho ou fim. “Futuro” comunica aqui aquilo que aguarda os perversos, sem restringir o sentido à posteridade; a alternativa “fim” é preservada em nota.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: רְשָׁעִים é a categoria moral habitual nos salmos para pessoas culpadas ou perversas. “Perversos” é claro, corrente e mantém o contraste sapiencial com os íntegros.
- source_word: נִכְרָתָה
  choice: será eliminado
  rationale: O nifal de כרת significa literalmente “ser cortado” e, por extensão, “ser eliminado”. Como o sujeito em português é “o futuro”, “será eliminado” comunica o sentido idiomático com maior naturalidade do que “será cortado”.
theological_decisions:
- issue: Sentido de אַחֲרִית no contexto de juízo
  choice: o futuro dos perversos será eliminado
  alternative: o fim dos perversos será eliminado
  rationale: O substantivo hebraico pode designar futuro, destino, desfecho, fim ou, em certos contextos, posteridade. Aqui, “futuro” expressa o destino que aguarda os perversos sem limitar o referente aos descendentes. A leitura “fim” continua plausível e é registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido; o primeiro perfeito hebraico foi vertido pelo futuro por seu valor proverbial/prospectivo no contexto, em harmonia com a segunda linha.
