base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: pt
  text: 'De Davi.[a]


    Não se irrite por causa dos que fazem o mal; não tenha inveja dos que praticam a injustiça.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para Davi”. A expressão hebraica pode indicar autoria, associação ou dedicação.'
    reason: textual_ambiguity
  - marker: b
    text: 'Ou: “dos que fazem o que é errado” ou “dos que praticam a perversidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A expressão do título pode indicar autoria, associação ou dedicação. “De Davi” é natural e tradicional em português e evita especificar além do hebraico.
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל expressa proibição; “não” é o equivalente direto e natural.
- source_word: תִּתְחַר
  choice: se irrite
  rationale: O hitpael de חרה descreve ficar acalorado, agitado ou irritado. “Irritar-se” comunica essa perturbação interior em português atual sem restringi-la necessariamente à ira intensa.
- source_word: בַּמְּרֵעִים
  choice: por causa dos que fazem o mal
  rationale: A preposição ב marca aqui a causa ou ocasião da irritação. A formulação explicita essa relação de modo natural.
- source_word: תְּקַנֵּא
  choice: tenha inveja
  rationale: קנא pode significar ciúme ou inveja; neste contexto, “ter inveja” expressa melhor a reação ao aparente sucesso dos perversos.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: dos que praticam a injustiça
  rationale: A construção participial significa literalmente os que fazem ou praticam עַוְלָה, termo que abrange injustiça, perversidade e ação errada. “Praticam a injustiça” preserva o caráter ativo e a dimensão moral/social.
