source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יֶהְגֶּ֣ה חָכְמָ֑ה וּ֝/לְשׁוֹנ֗/וֹ תְּדַבֵּ֥ר מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: pt
  text: A boca do justo profere sabedoria[a], e sua língua fala o que é justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “medita sobre a sabedoria” ou “murmura sabedoria”. O verbo hebraico pode indicar tanto reflexão como fala em voz baixa; aqui, a referência à boca e o paralelismo com “sua língua fala” favorecem a expressão oral.
    reason: lexical_alternative
  - marker: b
    text: Ou “fala justiça” ou “profere juízo”. O termo hebraico pode significar justiça, juízo, decisão judicial ou aquilo que é correto.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: A boca do justo
  rationale: Preserva a construção nominal hebraica e a metonímia da boca pela fala. “O justo” é natural em português e mantém o singular masculino representativo do texto sem acrescentar “homem”.
- source_word: יֶהְגֶּה
  choice: profere
  rationale: Embora הגה possa indicar meditar ou murmurar, o sujeito “boca” e o paralelismo com “a língua fala” favorecem aqui uma expressão vocal. “Profere” comunica fala ponderada em registro digno.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente direto e corrente de חָכְמָה neste contexto sapiencial.
- source_word: וּלְשׁוֹנוֹ
  choice: e sua língua
  rationale: Mantém a imagem corporal e o paralelismo poético com “boca”, ambos naturais em português.
- source_word: תְּדַבֵּר
  choice: fala
  rationale: Tradução direta e natural do piel de דבר, concordando com “língua” como sujeito.
- source_word: מִשְׁפָּט
  choice: o que é justo
  rationale: Neste contexto, מִשְׁפָּט designa aquilo que está de acordo com o direito e a justiça. A formulação portuguesa evita limitar o sentido a um veredito judicial, sem eliminar essa possibilidade lexical.
theological_decisions:
- issue: Masculino singular representativo na poesia sapiencial
  choice: o justo
  alternative: a pessoa justa; o homem justo
  rationale: O hebraico emprega um substantivo/adjetivo masculino singular com valor representativo. “O justo” reflete essa forma de modo idiomático, sem acrescentar o substantivo “homem”, ausente no original.
- issue: Amplitude semântica de מִשְׁפָּט
  choice: o que é justo
  alternative: justiça; juízo
  rationale: A escolha conserva o foco ético da fala do justo, enquanto a nota registra os sentidos judicial e abstrato legítimos do termo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo “boca/língua” foi preservado; “profere” mantém um tom poético sem ser arcaico, e as ambiguidades lexicais relevantes aparecem nas notas.
