  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: pt
  text: O dia todo ele é bondoso e empresta, e seus descendentes são uma bênção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus descendentes são abençoados”. O hebraico diz literalmente: “seus descendentes [são] para bênção”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: O dia todo
  rationale: Preserva a força temporal do idioma hebraico, indicando uma prática contínua ou habitual, em português natural.
- source_word: חוֹנֵן
  choice: é bondoso
  rationale: O particípio de חנן descreve quem demonstra favor ou graça. “É bondoso” é claro no português corrente e mantém um sentido mais amplo do que mera generosidade financeira.
- source_word: וּמַלְוֶה
  choice: e empresta
  rationale: A forma causativa de לוה significa aqui conceder empréstimos, não tomar emprestado; o presente expressa a ação habitual do particípio.
- source_word: וְזַרְעוֹ
  choice: e seus descendentes
  rationale: זֶרַע é um coletivo que pode designar a descendência. “Descendentes” comunica esse alcance com clareza e evita o literalismo potencialmente obscuro de “semente”.
- source_word: לִבְרָכָה
  choice: são uma bênção
  rationale: A expressão significa literalmente “para bênção”. No contexto, “são uma bênção” exprime naturalmente a ideia de que os descendentes se caracterizam como bênção, sem eliminar a alternativa de que sejam abençoados.
theological_decisions:
- issue: Sentido da oração final לִבְרָכָה
  choice: seus descendentes são uma bênção
  alternative: seus descendentes são abençoados
  rationale: A preposição לְ com בְּרָכָה sugere mais diretamente condição ou destinação — “para bênção”. A tradução principal conserva isso como “são uma bênção”, enquanto a nota registra a possibilidade de entender que eles recebem bênção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “O dia todo” é idiomático; “bondoso” evita linguagem excessivamente técnica; “descendentes” preserva o valor coletivo de זֶרַע.
