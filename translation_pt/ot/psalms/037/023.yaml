  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: pt
  text: O SENHOR firma os passos de um homem,[a] e se agrada de seu caminho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do SENHOR são firmados os passos de um homem”.'
    reason: Tradução alternativa que conserva a construção passiva e a ideia de origem/agência expressa no hebraico.
  - marker: b
    text: O hebraico também permite entender que é o homem quem se agrada de seu caminho.
    reason: O sujeito de “se agrada” está implícito e pode referir-se ao SENHOR ou ao homem.
lexical_decisions:
- source_word: מֵיְהוָה
  choice: Do SENHOR vêm
  rationale: A preposição מִן indica fonte ou origem. A formulação conserva essa nuance e, em português natural, também comunica que é o SENHOR quem firma os passos.
- source_word: מִצְעֲדֵי גֶבֶר
  choice: os passos firmes de um homem
  rationale: מִצְעֲדֵי significa “passos”, e גֶבֶר designa um homem. A inversão permite manter o SENHOR em destaque sem abandonar a imagem hebraica do caminhar.
- source_word: כּוֹנָנוּ
  choice: firmes
  rationale: O pual de כון expressa passos estabelecidos, firmados ou tornados seguros. “Firmes” comunica o resultado do passivo de modo conciso; a nota registra a tradução verbal mais formal.
- source_word: וְדַרְכּוֹ
  choice: do seu caminho
  rationale: דֶּרֶךְ é “caminho”, literal ou figurado. O possessivo permanece deliberadamente ambíguo, como no hebraico.
- source_word: יֶחְפָּץ
  choice: ele se agrada
  rationale: חפץ significa ter prazer ou agrado. “Se agrada” é corrente e digno, sem acrescentar um objeto não expresso.
theological_decisions:
- issue: Sujeito implícito de יֶחְפָּץ
  choice: No texto principal, “ele” aponta mais naturalmente para o SENHOR.
  alternative: O sujeito pode ser o homem, que se agrada do caminho.
  rationale: O hebraico não explicita o sujeito. O SENHOR é o antecedente mais provável no contexto sintático, mas a referência ao homem continua genuinamente possível e é preservada em nota.
- issue: Referente do sufixo em דַרְכּוֹ
  choice: “seu caminho” refere-se ao caminho do homem, no qual o SENHOR se agrada.
  alternative: Se “ele” for o homem, a expressão pode ser entendida como o caminho no qual ele próprio se agrada.
  rationale: A forma hebraica permite a tensão pronominal, que não deve ser eliminada por paráfrase explicativa.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira e alcance internacional. “SENHOR” representa o nome divino YHWH. A ordem marcada “Do SENHOR vêm...” preserva a ênfase inicial do hebraico; as notas mantêm tanto a alternativa passiva quanto a ambiguidade do pronome.
