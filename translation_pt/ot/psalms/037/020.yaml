id: PSA.37.20
reference: Psalms 37:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: pt
  text: 'Pois os perversos perecerão,

    e os inimigos de Yahweh serão como o esplendor das pastagens[a]:

    desaparecerão; como fumaça, desaparecerão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma interpretação tradicional: “como a gordura dos cordeiros”. A expressão hebraica é difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Expressa a relação explicativa ou causal com o contexto anterior de modo natural em português.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente más no contexto sapiencial; “perversos” é corrente, digno e mais específico que o genérico “maus”.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Preserva o sentido de chegar à ruína ou deixar de existir e mantém a orientação futura do verso.
- source_word: וְאֹיְבֵי יְהוָה
  choice: e os inimigos de Yahweh
  rationale: Reproduz diretamente a construção hebraica e conserva o nome divino pessoal.
- source_word: כִּיקַר כָּרִים
  choice: como o esplendor das pastagens
  rationale: Segue uma leitura plausível de יקר como “esplendor” e de כרים como “pastagens”, preservando a imagem poética sem ocultar a dificuldade da expressão.
- source_word: כָּלוּ ... כָּלוּ
  choice: desaparecerão ... desaparecerão
  rationale: Mantém a repetição enfática do verbo hebraico e se harmoniza naturalmente com a imagem da fumaça.
- source_word: בֶעָשָׁן
  choice: como fumaça
  rationale: 'Expressa em português a força comparativa da imagem: os inimigos desaparecem assim como a fumaça.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Conserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Interpretação de כִּיקַר כָּרִים
  choice: como o esplendor das pastagens
  alternative: como a gordura dos cordeiros
  rationale: A expressão hebraica é difícil e admite vocalização ou interpretação tradicional diferente. A leitura principal corresponde ao texto massorético apresentado, enquanto a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura em linhas preserva o paralelismo e a repetição poética. O futuro “serão” foi explicitado na comparação para tornar natural em português a oração nominal hebraica dentro da sequência futura.
