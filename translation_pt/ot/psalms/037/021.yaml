source:
  edition: WLC
  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: pt
  text: O perverso toma emprestado e não paga, mas o justo age com generosidade[a] e dá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mostra favor” ou “é bondoso”. O verbo hebraico expressa a ideia de conceder graça ou favor, aqui manifestada no ato de dar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: toma emprestado
  rationale: O particípio qal de לוה indica tomar algo emprestado. O presente exprime naturalmente a força proverbial do verso.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado designa, no singular representativo, aquele que pratica a perversidade; mantém o contraste sapiencial com 'o justo'.
- source_word: לֹא יְשַׁלֵּם
  choice: não paga
  rationale: O piel de שלם significa aqui pagar ou devolver o que é devido. 'Não paga' é natural em português no contexto de uma dívida contraída.
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo substantivado no singular representativo, em contraste direto com רָשָׁע.
- source_word: חוֹנֵן
  choice: age com generosidade
  rationale: O particípio qal de חנן expressa conceder graça ou favor; neste contexto, essa disposição se manifesta concretamente em generosidade. A formulação soa natural sem apagar o campo semântico de favor, preservado em nota.
- source_word: וְנוֹתֵן
  choice: e dá
  rationale: נתן significa normalmente 'dar'. A tradução mantém a amplitude do hebraico, sem restringi-lo interpretativamente a 'emprestar'.
theological_decisions:
- issue: Singular masculino representativo no contraste sapiencial
  choice: Manter 'o perverso' e 'o justo' no singular
  alternative: Os perversos ... os justos; uma pessoa perversa ... uma pessoa justa
  rationale: O hebraico emprega substantivos masculinos singulares com sentido proverbial e representativo. O português conserva esse contraste de maneira natural, sem converter o verso em plural nem explicitar algo que o texto deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Toma emprestado' evita a possível ambiguidade de 'pede emprestado'; 'age com generosidade' comunica no contexto a ação favorável indicada por חנן. A segunda oração conserva 'dá' sem introduzir a leitura contextual possível, mas não lexicalmente necessária, de 'empresta'.
