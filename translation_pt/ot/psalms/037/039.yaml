  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: pt
  text: A salvação[a] dos justos vem de Yahweh[b]; ele é a fortaleza deles[c] no tempo da angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento” ou “vitória”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “YHWH”; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: c
    text: Ou “refúgio” ou “lugar seguro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: A salvação
  rationale: תְּשׁוּעָה pode indicar salvação, livramento ou vitória. “Salvação” mantém o registro teológico e poético do salmo, sem excluir o resgate concreto presente no contexto.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural é empregado como substantivo e designa, como categoria, os que se caracterizam pela justiça. “Os justos” é natural e tradicional em português.
- source_word: מֵיְהוָה
  choice: vem de Yahweh
  rationale: A preposição מִן indica origem ou fonte. A inserção idiomática de “vem” expressa com clareza em português a oração nominal hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָעוּזָּם
  choice: a fortaleza deles
  rationale: מָעוֹז designa um lugar ou fonte de força e proteção. “Fortaleza” conserva a imagem defensiva, enquanto “deles” representa o sufixo de terceira pessoa masculina plural.
- source_word: בְּעֵת צָרָה
  choice: no tempo da angústia
  rationale: A expressão temporal refere-se ao período ou ocasião de aflição. “No tempo da angústia” é clara, digna e próxima da forma hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva a referência ao nome da aliança sem substituí-lo por um título.
- issue: Sujeito e cópula implícitos na segunda oração nominal
  choice: ele é a fortaleza deles
  alternative: sua fortaleza no tempo da angústia; Yahweh é a fortaleza deles
  rationale: O hebraico não apresenta cópula expressa nem repete o sujeito. “Ele é” produz uma oração natural em português e retoma Yahweh sem acrescentar conteúdo teológico novo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A formulação preserva o paralelismo conciso, explicita apenas a cópula exigida pela naturalidade do português e mantém a imagem concreta de proteção.
