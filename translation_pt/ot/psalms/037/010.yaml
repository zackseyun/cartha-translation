  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: pt
  text: Mais um pouco, e o perverso não existirá mais; mesmo que você observe atentamente o lugar dele, ele não estará lá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Mais um pouco
  rationale: Expressa de modo natural em português a locução temporal hebraica, sem ampliar para o sentido interpretativo de “em breve”.
- source_word: וְאֵין
  choice: já não existirá
  rationale: O contexto prospectivo favorece o futuro; “já não existirá” comunica o desaparecimento do perverso e mantém a força existencial da construção.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Preserva o singular masculino substantivado e seu provável valor representativo ou genérico, sem acrescentar “homem” ao texto.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: mesmo que você observe atentamente
  rationale: O verbo indica consideração ou observação cuidadosa. “Mesmo que” explicita a relação concessiva natural no contexto.
- source_word: עַל מְקוֹמוֹ
  choice: o lugar dele
  rationale: Mantém a imagem concreta do local associado ao perverso; em português, “observar o lugar” dispensa a reprodução rígida da preposição hebraica.
- source_word: וְאֵינֶנּוּ
  choice: ele não estará lá
  rationale: Retoma a ideia de ausência de modo concreto e evita repetir “já não existirá”.
