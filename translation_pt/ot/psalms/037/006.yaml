lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ele fará surgir
  rationale: O hifil de יצא expressa a ação causativa de fazer algo sair ou aparecer. “Fará surgir” preserva esse sentido e soa natural em português.
- source_word: כָאוֹר
  choice: como a luz
  rationale: O prefixo כ indica comparação, e אוֹר significa “luz”. A tradução mantém diretamente a imagem poética de algo que se torna claramente visível.
- source_word: צִדְקֶךָ
  choice: a sua justiça
  rationale: צדק pode indicar justiça, retidão ou vindicação. “Justiça” mantém transparência lexical, enquanto a nota registra a nuance contextual de vindicação pública.
- source_word: וּמִשְׁפָּטֶךָ
  choice: e o seu direito
  rationale: משפט pode significar juízo, justiça, direito ou causa judicial. Neste paralelismo, “direito” expressa a legitimidade da causa da pessoa sem restringir o termo a uma sentença judicial.
- source_word: כַצָּהֳרָיִם
  choice: como o meio-dia
  rationale: צָהֳרַיִם designa o meio-dia, momento de plena claridade. A formulação preserva a comparação e o paralelismo com “como a luz”.
