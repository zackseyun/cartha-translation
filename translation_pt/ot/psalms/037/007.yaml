  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: pt
  text: Fique em silêncio diante de Yahweh[a] e espere por ele com paciência[b]; não se inflame de ira[c] por causa daquele que prospera em seu caminho, por causa do homem que executa planos astutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fique quieto diante de Yahweh”. O verbo hebraico pode enfatizar tanto o silêncio como a quietude.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “espere por ele com anseio”. O verbo hebraico pode retratar uma espera intensa, até angustiada; tradicionalmente, também se traduz por “descanse nele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Tradicionalmente: “não se irrite” ou “não fique inquieto”. O hebraico usa mais literalmente a imagem de ficar quente, isto é, inflamar-se de ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Fique em silêncio
  rationale: O imperativo de דמם pode exprimir tanto silêncio como quietude. “Fique em silêncio” é claro e natural em português e representa diretamente a atitude reverente e contida diante de Deus.
- source_word: לַיהוָה
  choice: diante de Yahweh
  rationale: Neste contexto, o ל marca orientação relacional ou presença. “Diante de” comunica naturalmente a postura assumida perante Yahweh.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: e espere por ele com paciência
  rationale: O hitpolel de חול pode sugerir agitação, anseio ou espera penosa. No paralelismo exortativo, a expressão aponta para uma espera perseverante, sem eliminar totalmente sua possível intensidade emocional.
- source_word: אַל תִּתְחַר
  choice: não se inflame de ira
  rationale: חרה emprega a imagem de ficar quente ou arder e frequentemente denota ira. A formulação preserva essa metáfora de modo inteligível em português.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: por causa daquele que prospera em seu caminho
  rationale: A preposição indica o motivo da ira, enquanto מצליח descreve quem prospera ou obtém êxito. “Em seu caminho” conserva a imagem hebraica do curso de vida ou conduta.
- source_word: בְּאִישׁ
  choice: por causa do homem
  rationale: אִישׁ é masculino singular e apresenta um indivíduo representativo. “O homem” preserva essa forma sem tornar a referência mais específica do que o contexto permite.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: que executa planos astutos
  rationale: מְזִמּוֹת pode designar planos, projetos calculados ou intrigas. O contexto é negativo; “planos astutos” comunica o caráter calculado sem acrescentar explicitamente “maus”, palavra ausente do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Intensidade emocional de וְהִתְחוֹלֵל
  choice: espere por ele com paciência
  alternative: espere por ele com anseio
  rationale: A leitura adotada se ajusta à exortação do salmo, enquanto a nota preserva a possibilidade de uma espera intensa ou angustiada, evitando resolver indevidamente a ambiguidade lexical.
- issue: Natureza dos מְזִמּוֹת
  choice: planos astutos
  alternative: intrigas
  rationale: O contexto associa os planos à prosperidade do injusto, mas o substantivo pode variar entre planos calculados e esquemas negativos. “Planos astutos” mantém a tensão sem inserir diretamente o adjetivo “maus”.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe exortativa natural. Conserva a imagem hebraica de inflamar-se, o nome Yahweh e a ambiguidade da espera por meio de nota. A repetição “por causa” reproduz a estrutura enfática do verso.
