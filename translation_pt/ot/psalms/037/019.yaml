  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: pt
  text: Não serão envergonhados[a] em tempo de adversidade[b] e, em dias de fome, ficarão saciados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não ficarão envergonhados”. O verbo hebraico pode indicar tanto sentir vergonha quanto sofrer vergonha ou desonra.
    reason: lexical_alternative
  - marker: b
    text: Ou “em tempo de calamidade” ou “em tempo de infortúnio”. Aqui, o termo hebraico não se refere ao mal moral, mas à adversidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “ficarão plenamente satisfeitos” ou “terão o suficiente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: serão envergonhados
  rationale: O verbo בושׁ pode indicar sofrer vergonha, desonra ou frustração pública. A forma passiva é natural em português e preserva o aspecto resultativo do hebraico.
- source_word: בְּעֵת רָעָה
  choice: em tempos de adversidade
  rationale: עֵת significa “tempo”, e רָעָה, neste contexto, designa infortúnio ou dificuldade, não mal moral. O plural idiomático “em tempos de adversidade” comunica naturalmente a situação descrita.
- source_word: רָעָה
  choice: adversidade
  rationale: Aqui o termo se refere a circunstâncias ruins ou calamitosas. “Adversidade” evita a leitura ética de “mal” e mantém a abrangência do termo.
- source_word: וּבִימֵי רְעָבוֹן
  choice: e, em dias de fome
  rationale: A expressão construta hebraica é preservada de modo direto e natural, referindo-se a períodos de grave escassez.
- source_word: רְעָבוֹן
  choice: fome
  rationale: O substantivo pode designar fome severa ou carestia. “Fome” é amplamente compreensível em português e funciona bem tanto para a privação quanto para um período de escassez generalizada.
- source_word: יִשְׂבָּעוּ
  choice: ficarão plenamente satisfeitos
  rationale: O verbo שׂבע significa ficar saciado ou ter o bastante. “Plenamente satisfeitos” conserva a ideia de provisão suficiente, embora “saciados” seja uma alternativa mais diretamente ligada à alimentação.
