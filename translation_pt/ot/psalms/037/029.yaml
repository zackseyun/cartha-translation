source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: pt
  text: Os justos herdarão a terra e habitarão nela para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Terra”. O hebraico אֶרֶץ pode significar tanto uma terra ou território quanto a Terra; aqui, “a terra” combina com a formulação repetida do Salmo 37.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Adjetivo plural substantivado que designa, como classe, as pessoas que agem com justiça. “Os justos” é natural, digno e preserva o sentido moral e teológico.
- source_word: יִירְשׁוּ
  choice: herdarão
  rationale: O verbo ירשׁ pode indicar herdar ou tomar posse. “Herdarão” preserva a nuance de promessa e aliança recorrente no Salmo 37.
- source_word: אָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar uma terra ou território específico, ou a terra em sentido amplo. No contexto repetitivo do Salmo 37, “a terra” preserva tanto a formulação da promessa territorial quanto, em português, parte da amplitude lexical; a leitura “a Terra” é explicitada em nota.
- source_word: וְיִשְׁכְּנוּ
  choice: e habitarão
  rationale: שׁכן expressa habitar, residir ou estabelecer-se. “Habitarão” comunica residência estável e duradoura em registro bíblico atual e compreensível.
- source_word: לָעַד
  choice: para sempre
  rationale: A expressão indica duração permanente; “para sempre” é a formulação portuguesa clara e natural.
- source_word: עָלֶיהָ
  choice: nela
  rationale: A preposição עַל com sufixo feminino retoma אָרֶץ. Em português, “nela” é mais idiomático para residência do que “sobre ela”, sem alterar o referente.
theological_decisions:
- issue: Alcance de אָרֶץ no contexto da promessa
  choice: a terra
  alternative: a Terra
  rationale: O contexto imediato do Salmo 37 repete a promessa de herdar a terra, evocando a linguagem territorial da aliança. Contudo, o substantivo hebraico também admite o sentido mais amplo de “Terra”; a nota conserva essa possibilidade sem resolver dogmaticamente a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém tom digno e conciso. “Habitarão nela” evita a construção menos idiomática “habitarão sobre ela”, e a nota preserva a amplitude semântica de אֶרֶץ.
