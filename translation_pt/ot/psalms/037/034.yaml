base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: pt
  text: Espere por Yahweh[a] e guarde o caminho dele; ele o exaltará para que você herde a terra[b]. Quando os perversos forem eliminados, você verá isso.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ponha a esperança em Yahweh”. O verbo hebraico expressa espera paciente e confiante.
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode referir-se à terra em sentido mais amplo. Aqui, “terra” preserva tanto a linguagem pactual de herança quanto essa possível amplitude do termo.
    reason: alternative_reading
  - marker: c
    text: Compare Mateus 5:5, que retoma a promessa de herdar a terra.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Espere em
  rationale: O imperativo de קוה expressa espera paciente e confiante dirigida a Yahweh. “Espere em” é natural em português e mantém tanto a expectativa quanto a confiança; “ponha a esperança em” explicitaria mais a confiança, mas estreitaria um pouco o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּשְׁמֹר דַּרְכּוֹ
  choice: e siga o caminho dele
  rationale: שׁמר significa guardar, observar ou cumprir. Em português atual, “seguir o caminho dele” comunica com naturalidade a adesão fiel à conduta e à vontade de Yahweh, sem sugerir que se deva proteger fisicamente um caminho.
- source_word: וִירוֹמִמְךָ
  choice: Ele o exaltará
  rationale: O hifil de רום indica elevar ou exaltar. “Exaltará” preserva o tom poético e a ideia de vindicação.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: para que você herde a terra
  rationale: ירשׁ pode significar herdar ou possuir; “herde” conserva a nuance pactual. אָרֶץ admite “terra” e, conforme o contexto, “país/território”; o português “terra” preserva melhor essa amplitude.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: quando os perversos forem eliminados
  rationale: A construção com o infinitivo nifal de כרת indica a circunstância temporal. “Forem eliminados” transmite o corte judicial definitivo de modo claro em português moderno.
- source_word: תִּרְאֶה
  choice: você verá isso
  rationale: O verbo significa simplesmente “você verá”. “Isso” é acrescentado para indicar naturalmente que a pessoa verá a eliminação dos perversos.
theological_decisions:
- issue: Sentido de אָרֶץ no contexto sapiencial e pactual
  choice: terra
  alternative: país, território
  rationale: O salmo repete a promessa pactual de herdar a terra, mas אָרֶץ também pode ter alcance mais amplo. “Terra” mantém a ambiguidade lexical e permite a ressonância posterior de Mateus 5:5 sem apagar o cenário veterotestamentário.
- issue: Natureza da espera expressa por קוה
  choice: Espere em Yahweh
  alternative: Ponha a esperança em Yahweh
  rationale: A formulação escolhida conserva a tensão entre espera paciente e confiança expectante, sem reduzir o verbo apenas à esperança interior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Siga o caminho dele” evita o pouco natural “guarde o seu caminho”; o pronome “dele” reduz a ambiguidade de “seu”. A ordem das notas foi ajustada para que os marcadores apareçam em sequência no texto.
