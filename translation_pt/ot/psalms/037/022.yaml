  footnotes:
  - marker: a
    text: Ou “a Terra”. A palavra hebraica אֶרֶץ pode significar tanto “terra” no sentido de território quanto “Terra”; neste contexto, “a terra” corresponde melhor ao cenário pactual do salmo.
