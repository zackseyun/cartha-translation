lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e mantém com naturalidade o fluxo argumentativo do salmo.
- source_word: מְבֹרָכָיו
  choice: os abençoados por ele
  rationale: Preserva o particípio passivo e torna explícita a relação com o referente masculino singular, entendido no contexto como o SENHOR.
- source_word: יִירְשׁוּ
  choice: herdarão
  rationale: Conserva tanto a ideia de receber e possuir quanto a ressonância pactual da promessa da terra.
- source_word: אָרֶץ
  choice: a terra
  rationale: No contexto recorrente do Salmo 37, refere-se mais naturalmente à terra prometida ou território, embora o hebraico também possa abranger a terra em sentido universal.
- source_word: וּמְקֻלָּלָיו
  choice: mas os amaldiçoados por ele
  rationale: A conjunção expressa contraste neste paralelismo; a formulação mantém o particípio passivo e explicita a agência sugerida pelo sufixo.
- source_word: יִכָּרֵתוּ
  choice: serão eliminados
  rationale: Expressa em português corrente o nifal de כרת, isto é, serem cortados, excluídos ou removidos, sem restringir indevidamente o modo como isso ocorre.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em מְבֹרָכָיו e מְקֻלָּלָיו
  choice: Explicitar “por ele”, entendendo o referente contextual como o SENHOR.
  alternative: Traduzir mais literalmente por “seus abençoados” e “seus amaldiçoados”.
  rationale: O contexto do salmo identifica o referente, e a explicitação esclarece a agência sem introduzir uma afirmação teológica alheia ao hebraico.
- issue: Alcance semântico de אָרֶץ
  choice: a terra
  alternative: a Terra; o país
  rationale: “A terra” preserva melhor o cenário pactual e sapiencial do salmo, sem excluir a possibilidade de um alcance mais amplo, registrada em nota.
- issue: Força de יִכָּרֵתוּ
  choice: serão eliminados
  alternative: serão cortados; serão exterminados
  rationale: A escolha comunica a remoção judicial indicada pelo idioma hebraico sem determinar se se trata especificamente de morte, expulsão ou perda de lugar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo antitético foi preservado por “mas”; evitou-se linguagem excessivamente técnica ou arcaica.
