id: PSA.37.40
reference: Psalms 37:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: pt
  text: Yahweh os ajuda e os livra[a]; ele os livra dos perversos e os salva, porque nele se refugiam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os resgata”, nas duas ocorrências de “livra”; o hebraico repete o mesmo verbo de resgate para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque confiam nele”; mais literalmente, o hebraico fala de buscar refúgio nele.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: וַיַּעְזְרֵם
  choice: os ajuda
  rationale: Traduz diretamente עזר com uma expressão corrente e digna; o presente comunica naturalmente a declaração resumitiva do salmo.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: os livra; ele os livra
  rationale: Mantém a repetição intencional do mesmo verbo hebraico פלט, preservando sua ênfase poética.
- source_word: מֵרְשָׁעִים
  choice: dos perversos
  rationale: Expressa o adjetivo substantivado plural sem acrescentar indicação de gênero ausente no hebraico.
- source_word: וְיוֹשִׁיעֵם
  choice: e os salva
  rationale: Preserva a amplitude e o peso de ישׁע, distinguindo-o no contexto do verbo פלט traduzido por 'livrar'.
- source_word: כִּי
  choice: porque
  rationale: Apresenta com clareza a relação causal indicada no contexto.
- source_word: חָסוּ בוֹ
  choice: nele se refugiam
  rationale: Conserva a imagem concreta de buscar abrigo ou proteção, em vez de reduzi-la ao conceito mais geral de confiar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O hebraico traz o Tetragrama como nome próprio; a transliteração preserva essa característica sem substituí-lo por um título.
- issue: Repetição do verbo פלט
  choice: 'Preservar: ''os livra; ele os livra'''
  alternative: Condensar em uma única ocorrência
  rationale: A repetição adjacente é uma ênfase perceptível do texto hebraico e não deve ser silenciosamente eliminada.
- issue: Sentido de חָסוּ בוֹ
  choice: nele se refugiam
  alternative: confiam nele
  rationale: A formulação escolhida conserva a metáfora hebraica de proteção, embora a confiança esteja implicada.
translation_notes:
  register: Português moderno, claro e solene, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A ordem pronominal evita rigidez excessiva, e a repetição poética do original foi mantida.
