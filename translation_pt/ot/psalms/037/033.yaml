base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: pt
  text: Yahweh não o deixará nas mãos do perverso[a], nem o condenará quando ele for julgado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão dele”, isto é, sob o poder ou controle do perverso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando for levado a julgamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַעַזְבֶנּוּ
  choice: não o abandonará
  rationale: עזב pode significar deixar, abandonar ou desamparar. “Abandonará” expressa naturalmente a ideia de não deixar o justo entregue ao poder do perverso.
- source_word: בְיָדוֹ
  choice: nas mãos do perverso
  rationale: O hebraico diz literalmente “na mão dele”. Em português, o plural idiomático “nas mãos” comunica estar sob poder ou controle; “do perverso” explicita o antecedente contextual sem alterar o referente.
- source_word: יַרְשִׁיעֶנּוּ
  choice: o condenará
  rationale: 'O hifil de רשע tem aqui sentido forense: declarar culpado ou condenar.'
- source_word: בְּהִשָּׁפְטוֹ
  choice: quando ele for julgado
  rationale: A preposição בְּ com o infinitivo construto e sufixo é entendida temporalmente. A formulação conserva a voz passiva e não especifica indevidamente o tribunal ou o agente humano.
theological_decisions:
- issue: Referência dos pronomes
  choice: O objeto masculino singular é o justo, e a “mão” pertence ao perverso mencionado no contexto anterior.
  alternative: Manter “na mão dele”, preservando a referência pronominal implícita, porém com possível ambiguidade em português.
  rationale: O contexto imediato contrapõe o justo ao perverso. A explicitação contextual evita que o leitor tome “dele” como referência a Yahweh, sem neutralizar o masculino singular do hebraico.
- issue: Sentido judicial da segunda oração
  choice: Traduzir יַרְשִׁיעֶנּוּ como “o condenará” e בְּהִשָּׁפְטוֹ como “quando ele for julgado”.
  alternative: “Não o declarará culpado quando for levado a julgamento.”
  rationale: A combinação lexical é forense. “Condenará” mantém esse registro sem importar categorias doutrinárias posteriores nem definir além do texto a natureza do julgamento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Nas mãos do perverso” é idiomático e esclarece o antecedente contextual; as notas preservam a forma literal e uma alternativa legítima para a expressão judicial.
