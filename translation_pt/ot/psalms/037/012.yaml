  text: זֹמֵ֣ם רָ֭שָׁע לַ/צַּדִּ֑יק וְ/חֹרֵ֖ק עָלָ֣י/ו שִׁנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/012.yaml
  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: pt
  text: O perverso trama contra o justo e range os dentes contra ele[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “maquina contra o justo” ou “planeja o mal contra o justo”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “ranger os dentes” indica raiva e hostilidade.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: trama
  rationale: O particípio expressa a ação contínua de maquinar ou planejar com intenção hostil. “Trama” é conciso, natural e preserva essa malícia.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado designa uma pessoa moralmente má. “O perverso” conserva o singular e soa natural no registro sapiencial e poético.
- source_word: לַצַּדִּיק
  choice: contra o justo
  rationale: A preposição marca o alvo da hostilidade. “Contra o justo” traduz diretamente a relação e mantém o contraste moral do hebraico.
- source_word: חֹרֵק
  choice: range
  rationale: O verbo descreve o ranger dos dentes como manifestação de raiva ou hostilidade. “Range” é a formulação idiomática corrente em português.
- source_word: עָלָיו
  choice: contra ele
  rationale: No contexto, a preposição indica a direção hostil do gesto. “Contra ele” é clara e preserva a força relacional do hebraico.
- source_word: שִׁנָּיו
  choice: os dentes
  rationale: O hebraico diz literalmente “seus dentes”; em português, com parte do corpo, o artigo definido é mais natural, e o referente possessivo permanece inequívoco pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e o presente participial do hebraico são representados por verbos no presente. Mantém-se o singular individual de רָשָׁע e צַדִּיק, sem excluir seu valor representativo.
