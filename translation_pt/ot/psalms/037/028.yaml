id: PSA.37.28
reference: Psalms 37:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: pt
  text: 'Pois Yahweh ama a justiça

    e não abandona os que lhe são fiéis[a].

    Eles são guardados para sempre[b],

    mas a descendência dos perversos será eliminada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus santos”, “seus piedosos” ou “seus leais”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico também pode ser entendido de modo mais estreito: “os que lhe são fiéis são preservados para sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança em forma amplamente reconhecível e segue a opção do projeto, sem substituí-lo por um título.
- source_word: אֹהֵב
  choice: ama
  rationale: Expressa de modo direto e natural o sentido habitual do particípio de אהב.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto, refere-se à ordem justa e ao que é reto; “justiça” comunica melhor o sentido ético do que o mais estreito “julgamento”.
- source_word: יַעֲזֹב
  choice: abandona
  rationale: Verbo atual e claro para a ideia de deixar ou desamparar, conservando a força relacional da afirmação.
- source_word: חֲסִידָיו
  choice: os que lhe são fiéis
  rationale: Comunica pessoas caracterizadas por lealdade e devoção ligadas a חֶסֶד, evitando que “santos” seja entendido apenas como termo eclesiástico técnico.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português natural para duração permanente neste contexto.
- source_word: נִשְׁמָרוּ
  choice: são guardados
  rationale: Mantém a forma passiva do nifal de שמר e a ideia de proteção ou preservação.
- source_word: זֶרַע
  choice: a descendência
  rationale: No contexto, זֶרַע indica posteridade; “descendência” é corrente e preserva o valor coletivo.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Representa o plural substantivado e mantém o contraste sapiencial entre justos e perversos.
- source_word: נִכְרָת
  choice: será eliminada
  rationale: Transmite claramente o resultado do nifal de כרת aplicado à descendência. A expressão mais literal “será cortada” soaria menos natural em português sem contexto adicional.
theological_decisions:
- issue: Referente e força de חֲסִידָיו
  choice: “os que lhe são fiéis”, indicando pessoas leais e devotadas a Yahweh
  alternative: “seus santos”, “seus piedosos” ou “seus leais”
  rationale: A formulação preserva o vínculo de חָסִיד com lealdade e devoção sem importar um sentido eclesiástico posterior ou reduzir o termo somente à conduta religiosa.
- issue: Relação entre as duas orações centrais
  choice: “não abandona os que lhe são fiéis. Eles são guardados para sempre” como duas afirmações complementares
  alternative: 'Ler mais estreitamente: “os que lhe são fiéis são preservados para sempre”'
  rationale: A sequência hebraica permite que נִשְׁמָרוּ לְעוֹלָם desenvolva a afirmação anterior. A divisão em duas frases mantém explícito o verbo passivo sem ocultar a possibilidade de ligação sintática mais estreita, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A disposição em linhas acompanha o paralelismo poético. “Yahweh” preserva o nome divino; “os que lhe são fiéis” evita tecnicismo confessional; “será eliminada” prioriza naturalidade sem perder a força judicial do hebraico.
