source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: pt
  text: Fui jovem e já envelheci, mas nunca vi o justo abandonado, nem a sua descendência[a] mendigando[b] pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a sua semente”, isto é, os seus descendentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “procurando pão” ou “pedindo pão”. O verbo hebraico significa literalmente “buscar” ou “pedir”, mas aqui provavelmente se refere a mendigar alimento básico.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Fui jovem
  rationale: A construção predicativa significa literalmente que o salmista era jovem; esta formulação é natural em português e preserva o contraste autobiográfico com a velhice.
- source_word: גַּם זָקַנְתִּי
  choice: e já envelheci
  rationale: O verbo expressa o processo concluído de chegar à velhice. “Já” comunica naturalmente a progressão entre as duas etapas da vida, enquanto “envelheci” conserva o caráter verbal do hebraico.
- source_word: וְלֹא רָאִיתִי
  choice: mas nunca vi
  rationale: No resumo de uma vida que vai da juventude à velhice, “nunca vi” expressa de modo idiomático a experiência acumulada do falante. “Mas” torna clara a leve força contrastiva da conjunção.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular é usado substantivamente e de modo representativo. “O justo” conserva o singular genérico sem acrescentar “homem”.
- source_word: נֶעֱזָב
  choice: abandonado
  rationale: O particípio passivo de עזב indica alguém deixado ou desamparado. “Abandonado” preserva o peso existencial da expressão em português atual.
- source_word: וְזַרְעוֹ
  choice: nem a sua descendência
  rationale: זֶרַע significa literalmente “semente” e, neste contexto, designa os descendentes. “Nem” coordena naturalmente as duas situações que o salmista afirma não ter visto, sem sugerir que ambas precisem ocorrer juntas.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: mendigando pão
  rationale: Embora בקש signifique basicamente “buscar” ou “pedir”, quando tem “pão” por objeto neste contexto de necessidade, a expressão provavelmente descreve pedir alimento por caridade. “Mendigando pão” comunica essa força sem generalizar “pão” para “comida”.
theological_decisions:
- issue: Se o versículo deve soar como garantia teológica absoluta ou como observação pessoal do salmista
  choice: 'Mantida a forma de testemunho pessoal: “nunca vi”.'
  alternative: Reformular como promessa universal de que nenhuma pessoa justa ou seus descendentes jamais passarão necessidade.
  rationale: O hebraico apresenta explicitamente a experiência do falante desde a juventude até a velhice. A tradução não amplia essa observação para uma promessa absoluta nem elimina a tensão com outras experiências bíblicas de sofrimento dos justos.
- issue: Referência genérica masculina em צַדִּיק e o coletivo זַרְעוֹ
  choice: “o justo” e “a sua descendência”.
  alternative: “as pessoas justas” e “seus filhos”.
  rationale: A redação escolhida preserva o representante singular do hebraico e traduz o substantivo coletivo sem restringi-lo apenas aos filhos imediatos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados, enquanto “já”, “mas” e “nem” dão fluidez idiomática à progressão e à coordenação. Os marcadores das notas foram posicionados nos termos efetivamente comentados.
