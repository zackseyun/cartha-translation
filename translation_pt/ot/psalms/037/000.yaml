base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: pt
  text: De Davi. Não se irrite por causa dos malfeitores[a]; não tenha inveja dos que praticam injustiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se enfureça por causa dos malfeitores”. O verbo hebraico pode descrever alguém que se inflama, fica agitado ou irritado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dos que cometem perversidade” ou “dos que praticam iniquidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A construção hebraica pode indicar autoria, associação ou dedicação; a formulação tradicional e concisa preserva essa amplitude.
- source_word: אַל־תִּתְחַר
  choice: Não se irrite
  rationale: O verbo descreve a ideia de se inflamar, agitar ou irritar; esta opção é natural em português e não reduz o sentido apenas a preocupação.
- source_word: בַּמְּרֵעִים
  choice: por causa dos malfeitores
  rationale: Expressa pessoas que praticam o mal e conserva a relação causal ou motivadora indicada pela preposição.
- source_word: אַל־תְּקַנֵּא
  choice: não tenha inveja
  rationale: Neste paralelismo, o verbo denota invejar aqueles que parecem prosperar apesar de agir mal.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: dos que praticam injustiça
  rationale: Traduz de modo direto a expressão formada por 'praticantes de' e um termo que pode significar injustiça, perversidade ou iniquidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A tradução evita o menos natural “não se preocupe” para manter a imagem hebraica de irritação ou agitação, e emprega “injustiça” como termo amplamente compreensível para עַוְלָה.
