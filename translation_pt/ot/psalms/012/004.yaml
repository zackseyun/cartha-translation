  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: pt
  text: 'os que dizem: “Com nossa língua prevaleceremos; nossos lábios são nossos[a] — quem é senhor sobre nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nossos lábios estão conosco”; também pode significar “nossos lábios estão do nosso lado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: os que dizem
  rationale: O relativo retoma os ímpios do versículo anterior, e o perfeito poético caracteriza sua atitude habitual; o presente é natural em português.
- source_word: לִלְשֹׁנֵנוּ
  choice: Com a nossa língua
  rationale: O ל prefixado pode ter valor instrumental; “com” comunica que a língua é o meio pelo qual pretendem impor-se, sem eliminar totalmente a concisão do hebraico.
- source_word: נַגְבִּיר
  choice: prevaleceremos
  rationale: O hifil de גבר expressa demonstrar força ou obter vantagem; no contexto, trata-se de prevalecer por meio da fala.
- source_word: שְׂפָתֵינוּ
  choice: nossos lábios
  rationale: Preserva a imagem concreta e poética do hebraico, em vez de substituí-la pelo abstrato “nossa fala”.
- source_word: אִתָּנוּ
  choice: estão conosco
  rationale: Reproduz de perto a expressão hebraica “com nós”, preservando sua possível nuance de posse, disponibilidade ou vantagem; uma nota esclarece alternativas idiomáticas.
- source_word: מִי אָדוֹן לָנוּ
  choice: quem é senhor sobre nós?
  rationale: אָדוֹן é um substantivo comum para senhor ou amo; a minúscula evita tratá-lo como nome ou título divino, enquanto “sobre nós” explicita naturalmente a relação de autoridade indicada por לָנוּ.
theological_decisions:
- issue: Sentido de אָדוֹן na pergunta desafiadora
  choice: senhor
  alternative: amo
  rationale: O texto nega, de maneira arrogante, qualquer autoridade superior sem identificar explicitamente Deus. “senhor”, em minúscula, conserva a amplitude lexical e a tensão contextual.
- issue: Ambiguidade de אִתָּנוּ
  choice: nossos lábios estão conosco
  alternative: nossos lábios nos pertencem / estão do nosso lado
  rationale: A formulação principal mantém a expressão compacta e ambígua do hebraico. A nota apresenta os sentidos possíveis sem decidir se a ênfase recai em posse ou vantagem.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético preservado. “Prevaleceremos” mantém o tom de autoconfiança arrogante; “senhor” fica em minúscula por ser um termo genérico de autoridade.
