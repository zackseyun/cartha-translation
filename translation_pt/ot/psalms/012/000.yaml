source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: pt
  text: 'Ao regente: conforme “A Oitava”[a]. Salmo de Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: A Oitava; provavelmente uma indicação musical ou litúrgica, talvez referente a uma melodia, um instrumento ou um registro de oitava. Tradicionalmente transliterado como Sheminith.'
    reason: cultural_note
  - marker: b
    text: Ou “por Davi” ou “para Davi”; o hebraico deixa em aberto a relação exata de Davi com o salmo.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa quem dirige a execução musical. “Ao regente” é conciso, natural e não restringe a função necessariamente a um coro.
- source_word: עַל
  choice: conforme
  rationale: Neste título musical, a preposição provavelmente introduz uma melodia, modalidade ou indicação de execução; “conforme” comunica essa função sem decidir qual delas está em vista.
- source_word: הַשְּׁמִינִית
  choice: “A Oitava”
  rationale: A expressão significa literalmente “a oitava”. As aspas e as iniciais maiúsculas indicam que se trata de uma designação musical ou litúrgica, cujo sentido técnico exato é incerto.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação tradicional e contextualmente precisa para este gênero de composição musical e poética.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, associação, pertencimento ou dedicação. “De Davi” preserva melhor essa amplitude do que formulações mais específicas.
theological_decisions:
- issue: Relação de Davi com o salmo indicada por לְדָוִד
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não determina de modo inequívoco a relação exata. A tradução mantém a ambiguidade em vez de afirmar além do texto uma conclusão específica sobre autoria ou dedicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao regente” evita a especificidade possivelmente excessiva de “mestre do coro”; “conforme” preserva o caráter técnico e incerto da indicação musical.
