source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: pt
  text: Que Yahweh elimine todos os lábios lisonjeiros[a], a língua que fala grandezas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «lábios suaves»; a expressão hebraica retrata uma fala lisa, aduladora e enganosa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «coisas grandes»; aqui, afirmações vangloriosas ou arrogantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: Que ... elimine
  rationale: O hifil imperfeito de כרת pode significar cortar, eliminar ou destruir. A construção com «Que» expressa naturalmente em português o valor de desejo, oração ou imprecação sugerido pelo contexto, sem transformar a imagem em uma ação física estranha contra lábios e língua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: todos os lábios lisonjeiros
  rationale: כָּל tem sentido abrangente, e a expressão literalmente descreve «lábios de suavidades». «Lábios lisonjeiros» comunica em português atual a fala suave, aduladora e manipuladora da imagem hebraica.
- source_word: לָשׁוֹן
  choice: a língua
  rationale: Mantém o singular vívido do hebraico, que aparece em aposição ao sintagma plural anterior e personifica a fala arrogante.
- source_word: מְדַבֶּרֶת
  choice: que fala
  rationale: O particípio feminino concorda com «língua» e é vertido naturalmente por uma oração relativa.
- source_word: גְּדֹלוֹת
  choice: grandezas
  rationale: Preserva de modo conciso o sentido literal de «coisas grandes», enquanto o contexto e a nota esclarecem que se trata de afirmações arrogantes ou vangloriosas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Força verbal de יַכְרֵת
  choice: 'Desejo ou imprecação: «Que Yahweh elimine»'
  alternative: 'Declaração: «Yahweh eliminará»'
  rationale: A forma imperfeita pode admitir leitura declarativa, mas, no contexto da súplica do salmo, a leitura volitiva é natural. A formulação escolhida conserva o tom de oração sem apresentar a alternativa como impossível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Lisonjeiros» é corrente e mantém a imagem corporal dos lábios; «fala grandezas» conserva a formulação poética e a tensão do original sem explicitar demais a arrogância no texto principal.
