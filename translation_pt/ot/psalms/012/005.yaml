source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: pt
  text: '“Por causa da violência contra os pobres,

    por causa do gemido dos necessitados,

    agora me levantarei”, diz Yahweh.

    “Eu o porei a salvo, como ele tanto deseja.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da última frase é difícil. Mais literalmente: “Eu o porei em segurança; ele ofega por isso”. Outros entendem: “Eu o porei a salvo daquele que bufa contra ele”, ou algo semelhante.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: Por causa da violência contra os pobres
  rationale: מִן é causal neste contexto, e שֹׁד designa violência destrutiva, devastação ou saque. “Violência contra os pobres” explicita de modo natural quem sofre a ação sem reduzir a gravidade do termo.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: por causa do gemido dos necessitados
  rationale: A segunda construção com מִן é paralela e causal. “Gemido” comunica aflição audível, enquanto “necessitados” distingue אֶבְיוֹנִים de עֲנִיִּים sem eliminar a proximidade semântica.
- source_word: עַתָּה אָקוּם
  choice: agora me levantarei
  rationale: Preserva tanto a urgência temporal de עַתָּה quanto a imagem antropomórfica de Yahweh levantando-se para agir.
- source_word: יֹאמַר יְהוָה
  choice: diz Yahweh
  rationale: A fórmula de fala fica natural em português, e o nome divino é transliterado em vez de substituído por um título.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: Eu o porei a salvo
  rationale: A construção expressa colocar alguém em condição de livramento ou segurança. Esta formulação é idiomática em português e conserva o resultado concreto da intervenção divina.
- source_word: יָפִיחַ לוֹ
  choice: como ele tanto deseja
  rationale: Adota a compreensão contextual de יפח como ofegar, ansiar ou desejar, ligando לוֹ à pessoa necessitada. O intensificador “tanto” transmite o anseio sem tornar a linha excessivamente literal; a incerteza do hebraico é registrada na nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome pessoal. “Yahweh” preserva diretamente esse nome, sem substituí-lo por um título.
- issue: Referente e sentido da cláusula final יָפִיחַ לוֹ
  choice: A pessoa oprimida deseja a segurança na qual Yahweh a colocará
  alternative: 'Yahweh a põe a salvo daquele que bufa contra ela; ou: ele ofega por isso'
  rationale: A sintaxe e o sentido exato são difíceis. A leitura escolhida produz uma sequência coerente com o gemido dos necessitados, mas a tradução não deve ocultar as alternativas reais, por isso elas aparecem em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Pobres” e “necessitados” mantêm a diferenciação dos termos hebraicos. A nota [a] aparece no texto principal e conserva a ambiguidade genuína da cláusula final.
