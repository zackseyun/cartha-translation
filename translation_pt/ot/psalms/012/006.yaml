  text: אִֽמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּ/עֲלִ֣יל לָ/אָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: pt
  text: 'As palavras de Yahweh são palavras puras,

    como prata refinada numa fornalha[a] sobre a terra[b],

    purificada sete vezes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num cadinho” ou “num recipiente de fundição”. O termo hebraico é raro, e seu referente exato é incerto, embora o sentido seja claramente metalúrgico.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre a terra”. A expressão pode indicar o local ou o contexto do processo de refino; sua nuance exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: palavras
  rationale: O substantivo repetido designa palavras ou declarações. “Palavras” é natural em português e preserva a repetição poética sem restringir o sentido a promessas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: טְהֹרוֹת
  choice: puras
  rationale: O adjetivo indica pureza e combina tanto com as palavras de Yahweh quanto com a imagem metalúrgica subsequente.
- source_word: כֶּסֶף
  choice: prata
  rationale: O substantivo designa diretamente o metal usado na comparação.
- source_word: צָרוּף
  choice: refinada
  rationale: A forma descreve prata submetida ao processo de refino; “refinada” é clara e idiomática.
- source_word: בַּעֲלִיל
  choice: numa fornalha
  rationale: O termo raro parece designar, no contexto, um recipiente ou instalação de refino. “Fornalha” comunica claramente a imagem, enquanto a nota preserva a incerteza lexical.
- source_word: לָאָרֶץ
  choice: sobre a terra
  rationale: A construção é difícil. A tradução relativamente formal preserva a expressão hebraica sem decidir se ela indica localização, disposição sobre o chão ou outra nuance.
- source_word: מְזֻקָּק
  choice: purificada
  rationale: A forma intensifica a imagem metalúrgica. “Purificada” evita repetir “refinada” e mantém a sobreposição semântica.
- source_word: שִׁבְעָתָיִם
  choice: sete vezes
  rationale: A expressão adverbial indica refino repetido e completo; “sete vezes” é transparente e preserva a formulação hebraica.
theological_decisions:
- issue: Natureza da pureza das palavras de Yahweh
  choice: O versículo afirma a pureza e confiabilidade completas das palavras de Yahweh por meio de uma comparação metalúrgica.
  alternative: Restringir a afirmação à pureza moral ou ampliá-la para formular uma doutrina posterior específica de preservação textual.
  rationale: O hebraico compara as palavras divinas à prata completamente refinada. A tradução conserva essa afirmação poética sem introduzir formulações doutrinárias que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e a repetição de “palavras” foram preservadas. As notas registram as duas dificuldades lexicais reais sem sobrecarregar o texto principal.
