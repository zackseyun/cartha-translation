source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: pt
  text: Salva, ó Yahweh, pois o piedoso já não existe[a]; os fiéis desapareceram do meio dos seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o fiel chegou ao fim»; também pode ser entendido como «já não existe o piedoso».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «dos filhos do homem», expressão que aqui se refere à comunidade humana.'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Salva-nos
  rationale: O imperativo dirigido a Deus é um pedido urgente de socorro. Embora o objeto não esteja expresso em hebraico, em português «salva-nos» transmite naturalmente o sujeito coletivo implícito na oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento do pedido e mantém de modo natural a relação causal.
- source_word: גָמַר חָסִיד
  choice: já não há quem seja fiel
  rationale: גמר indica chegar ao fim ou deixar de existir, enquanto חסיד descreve alguém leal, especialmente em sentido relacional e pactual. A formulação portuguesa preserva o singular representativo sem sugerir necessariamente um único indivíduo específico.
- source_word: פַסּוּ אֱמוּנִים
  choice: os que são dignos de confiança desapareceram
  rationale: פסס expressa cessar ou desaparecer; אמונים designa pessoas confiáveis ou fiéis. Esta escolha distingue a expressão da linha anterior e ressalta a dimensão social da confiabilidade.
- source_word: מִבְּנֵי אָדָם
  choice: do meio dos seres humanos
  rationale: Traduz o sentido do idioma hebraico «dos filhos de אדם», isto é, da comunidade humana, em português claro e abrangente.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Sentido de חָסִיד
  choice: quem seja fiel
  alternative: o piedoso / o leal
  rationale: «Fiel» comunica de forma acessível a lealdade ético-relacional do termo, sem impor uma definição denominacional de piedade.
- issue: Número do singular חָסִיד
  choice: singular representativo em «quem seja fiel»
  alternative: «o fiel chegou ao fim» ou plural coletivo «os fiéis desapareceram»
  rationale: O hebraico traz singular, mas pode descrever uma classe de pessoas. A construção mantém essa tensão sem limitar a afirmação a um indivíduo determinado.
- issue: Antropologia em בְּנֵי אָדָם
  choice: seres humanos
  alternative: filhos de Adão / filhos dos homens
  rationale: Neste contexto, a expressão é um idioma coletivo para a sociedade humana; a tradução comunica seu referente sem restringi-lo ao sexo masculino.
translation_notes:
  register: Português atual, digno e poeticamente conciso, com legibilidade brasileira e compreensão internacional. O paralelismo hebraico foi preservado, com variação lexical entre חסיד e אמונים.
