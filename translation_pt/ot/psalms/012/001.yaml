review_pass:
  verdict: revise
  source_fidelity: A tradução capta adequadamente a queixa acerca do desaparecimento de pessoas piedosas/confiáveis. Contudo, «Salva-nos» introduz um objeto de primeira pessoa plural que não está expresso no hebraico. O imperativo pode ser mantido sem esse acréscimo. A nota b também deve apresentar com maior precisão a formulação literal hebraica.
  naturalness: O português é claro e contemporâneo. «Salva, ó Yahweh» conserva o tom de súplica poética sem explicitar um complemento ausente no texto-fonte. «Do meio dos seres humanos» é natural e compreensível internacionalmente.
  terminology: «Yahweh» preserva corretamente o Tetragrama. «O piedoso» para חָסִיד e «os fiéis» para אֱמוּנִים mantêm a distinção e o paralelismo, sem sobrecarregar o texto. A nota cultural deve dizer «filhos do homem», não «filhos de Adão», como representação literal mais segura do idiomatismo.
  issues:
  - severity: medium
    issue: «Salva-nos» explicita um objeto não presente no hebraico.
    rationale: הוֹשִׁיעָה é um imperativo dirigido a Yahweh, sem pronome ou objeto expresso. Embora a comunidade suplicante possa estar implicitamente em vista, «nos» é uma especificação interpretativa desnecessária.
  - severity: low
    issue: A nota b verte literalmente מִבְּנֵי אָדָם como «dos filhos de Adão».
    rationale: No idiomatismo, אָדָם tem valor humano/genérico; «filhos do homem» representa mais diretamente a construção literal e evita sugerir que o texto se refira especificamente ao indivíduo Adão.
  revised_text: Salva, ó Yahweh, pois o piedoso já não existe[a]; os fiéis desapareceram do meio dos seres humanos[b].
