- from: Salva-nos, ó Yahweh, pois já não há quem seja fiel[a]; os que são dignos de confiança desapareceram do meio dos seres humanos.[b]
  to: Salva, ó Yahweh, pois o piedoso já não existe[a]; os fiéis desapareceram do meio dos seres humanos[b].
  rationale: A revisão remove o pronome «nos», não expresso no hebraico, e torna a nota sobre בני אדם lexicalmente mais exata. O singular «o piedoso» conserva a forma singular hebraica, que pode ter valor representativo, enquanto «os fiéis» reflete o plural da segunda linha.
