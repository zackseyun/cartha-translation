  text: שָׁ֤וְא יְֽדַבְּרוּ֮ אִ֤ישׁ אֶת רֵ֫עֵ֥/הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּ/לֵ֖ב וָ/לֵ֣ב יְדַבֵּֽרוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: pt
  text: Falam coisas vãs[a], cada um ao seu próximo; com lábios lisonjeiros[b], com coração duplo[c] falam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falsidades” ou “palavras vazias”. O termo hebraico pode indicar aquilo que é vazio, falso ou sem valor.
    reason: lexical_alternative
  - marker: b
    text: Ou “com lábios suaves”. A imagem hebraica descreve uma fala agradável e lisonjeira, mas enganosa.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “com coração e coração”, expressão que indica duplicidade ou intenções divididas.
    reason: idiom_explanation
lexical_decisions:
- source_word: שָׁוְא
  choice: coisas vãs
  rationale: A expressão abrange o que é vazio, falso ou sem valor. “Coisas vãs” conserva essa amplitude sem restringir o sentido apenas a mentiras factuais.
- source_word: יְדַבְּרוּ ... יְדַבֵּרוּ
  choice: falam ... falam
  rationale: A repetição reproduz a cadência hebraica e enfatiza a corrupção da fala.
- source_word: אִישׁ אֶת רֵעֵהוּ
  choice: cada um com o seu próximo
  rationale: אִישׁ tem valor distributivo, e רֵעֵהוּ designa o próximo, companheiro ou semelhante no convívio social.
- source_word: שְׂפַת חֲלָקוֹת
  choice: com lábios lisonjeiros
  rationale: A imagem literal é de lábios suaves ou lisos; “lisonjeiros” comunica naturalmente a fala sedutora e enganosa.
- source_word: בְּלֵב וָלֵב
  choice: com coração duplo
  rationale: Mantém de perto a imagem idiomática hebraica, “com coração e coração”, que expressa duplicidade interior.
