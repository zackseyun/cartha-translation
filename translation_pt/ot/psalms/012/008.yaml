source:
  edition: WLC
  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: pt
  text: Por toda parte os perversos andam, quando a vileza é exaltada entre os seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “entre os filhos do homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: por toda parte
  rationale: Emprego adverbial que indica movimento ou presença ao redor; a expressão é natural em português e comunica a ampla circulação dos perversos.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Substantivo plural que designa pessoas moralmente más, sem acrescentar uma referência masculina que o termo hebraico não exige.
- source_word: יִתְהַלָּכוּן
  choice: andam
  rationale: O hitpael de הלך expressa andar ou circular. “Andam” preserva a imagem básica, enquanto “rondam” acrescentaria uma nuance ameaçadora possível, mas não necessária.
- source_word: כְּרֻם
  choice: quando ... é exaltada
  rationale: A construção difícil com כְּ é entendida em sentido temporal-circunstancial, indicando a situação em que os perversos circulam livremente.
- source_word: זֻלּוּת
  choice: vileza
  rationale: O substantivo denota aquilo que é baixo, desprezível ou sem valor; “vileza” conserva sua força moral no contexto.
- source_word: לִבְנֵי אָדָם
  choice: entre os seres humanos
  rationale: A expressão hebraica significa literalmente “entre os filhos do homem”, mas tem referência humana genérica. A formulação escolhida transmite essa abrangência de modo natural e claro em português.
theological_decisions:
- issue: Referência antropológica genérica em לִבְנֵי אָדָם
  choice: entre os seres humanos
  alternative: entre os filhos do homem
  rationale: Embora a forma hebraica seja masculina, seu referente é a humanidade em geral. A tradução principal explicita esse valor genérico sem restringir indevidamente o sentido; a forma literal é preservada em nota.
- issue: Relação circunstancial expressa por כְּרֻם
  choice: quando a vileza é exaltada
  alternative: à medida que a vileza é exaltada
  rationale: A sintaxe hebraica admite mais de uma nuance. “Quando” apresenta uma circunstância temporal sem definir uma relação causal, preservando a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “Por toda parte” conserva a ênfase do hebraico. A nota mantém visível o idioma antropológico literal sem sacrificar a clareza da referência genérica no texto principal.
