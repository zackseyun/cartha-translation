  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: pt
  text: Tu, Yahweh, os guardarás; tu o protegerás[a] desta geração para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa do plural (“os guardarás”) para o singular (“o protegerás”). Algumas traduções uniformizam a frase no plural: “os protegerás”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Tu
  rationale: O pronome independente de segunda pessoa está expresso e em posição inicial para dar ênfase; a ordem portuguesa preserva essa ênfase com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: תִּשְׁמְרֵם
  choice: os guardarás
  rationale: שׁמר expressa guardar, preservar ou velar por; o sufixo masculino plural é mantido por “os”.
- source_word: תִּצְּרֶנּוּ
  choice: o protegerás
  rationale: נצר significa guardar, proteger ou preservar. A vocalização massorética apresenta um objeto masculino singular, preservado em português por “o”.
- source_word: מִן הַדּוֹר זּוּ
  choice: desta geração
  rationale: A preposição indica proteção ou afastamento em relação à geração hostil, e דור é traduzido diretamente por “geração”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa corrente para duração contínua ou indefinida em contexto poético.
theological_decisions:
- issue: Mudança de número entre os objetos dos dois verbos
  choice: Manter “os guardarás ... o protegerás”
  alternative: 'Harmonizar no plural: “os guardarás ... os protegerás”'
  rationale: O texto massorético passa de um sufixo plural para um singular. A tradução conserva essa tensão gramatical e referencial, sem decidir silenciosamente se o singular representa cada necessitado, uma pessoa específica ou um uso coletivo.
translation_notes:
  register: Português moderno, claro e digno. O uso de “tu” permite conservar a ênfase do pronome hebraico e combina naturalmente com a invocação direta “Yahweh”. A repetição de “tu” mantém o paralelismo poético.
