  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: pt
  text: Derramaram sangue inocente — o sangue de seus filhos e de suas filhas, que sacrificaram aos ídolos de Canaã — e a terra ficou contaminada com sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sangues”, forma plural que pode indicar derramamento de sangue ou culpa de sangue. Também: “a terra ficou contaminada pelo derramamento de sangue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: Derramaram
  rationale: Preserva a imagem concreta de שׁפך aplicada ao sangue e é uma expressão natural em português para o ato de matar.
- source_word: דָם נָקִי
  choice: sangue inocente
  rationale: Reproduz a expressão hebraica e sua condenação moral explícita do sangue injustamente derramado.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: o sangue de seus filhos e de suas filhas
  rationale: Mantém a repetição explicativa de דם e identifica claramente as vítimas.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: que sacrificaram
  rationale: O relativo retoma filhos e filhas; 'sacrificaram' comunica com precisão o uso cultual de זבח.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: aos ídolos de Canaã
  rationale: '''Ídolos'' conserva o sentido religioso e pejorativo de עֲצַבִּים; ''de Canaã'' mantém a relação expressa no hebraico sem a tornar mais específica.'
- source_word: וַתֶּחֱנַף
  choice: ficou contaminada
  rationale: Expressa a profanação moral e religiosa da terra causada pelo sangue derramado, em linguagem atual e compreensível.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto aponta para a terra de Canaã, não para o planeta inteiro; em português, 'a terra' preserva essa referência contextual.
- source_word: בַּדָּמִים
  choice: de sangue
  rationale: Conserva no corpo do texto a repetição enfática de 'sangue'. A nota registra que o plural hebraico também pode comunicar derramamento de sangue ou culpa de sangue.
theological_decisions:
- issue: Condição moral das vítimas do sacrifício infantil
  choice: O texto chama a morte dos filhos e das filhas de derramamento de sangue inocente.
  alternative: O sangue dos inocentes.
  rationale: A tradução mantém o juízo moral explícito de דָם נָקִי sem acrescentar uma elaboração doutrinária.
- issue: Natureza da contaminação da terra
  choice: A terra ficou contaminada de sangue.
  alternative: A terra ficou profanada pelo derramamento de sangue ou pela culpa de sangue.
  rationale: A formulação preserva a imagem da terra moral e religiosamente afetada e mantém a repetição de 'sangue', enquanto a nota apresenta a força possível do plural hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões preservam a explicação em aposição no centro do verso. A repetição de 'sangue' foi mantida por ser enfática no hebraico; a única nota esclarece a ambiguidade sem sobrecarregar o texto.
