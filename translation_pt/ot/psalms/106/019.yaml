  text: יַעֲשׂוּ עֵ֥גֶל בְּ/חֹרֵ֑ב וַ֝/יִּשְׁתַּחֲו֗וּ לְ/מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: pt
  text: Fizeram um bezerro em Horebe e se prostraram diante de uma imagem fundida[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma imagem de metal fundido”. O termo hebraico se refere especificamente a uma imagem feita por fundição, geralmente em metal.
    reason: lexical_alternative
  - marker: b
    text: Este versículo recorda o bezerro feito em Horebe no relato de Êxodo 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: Fizeram
  rationale: O Qal de עשה significa normalmente “fazer”. A forma simples e direta preserva a neutralidade do hebraico, sem acrescentar “para si” nem especificar o processo de fabricação.
- source_word: עֵגֶל
  choice: um bezerro
  rationale: עֵגֶל designa um bezerro ou bovino jovem. “Bezerro” é natural em português e mantém a ligação reconhecível com o episódio de Êxodo 32, sem acrescentar “de ouro”, ausente neste versículo.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: A preposição ב indica aqui o local do acontecimento. “Em Horebe” é idiomático em português e preserva o topônimo hebraico.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: e se prostraram diante de
  rationale: A forma verbal de שחה expressa prostrar-se em homenagem ou adoração. “Se prostraram diante de” mantém tanto o gesto físico quanto sua evidente dimensão cultual, sem substituir o gesto pela interpretação mais geral “adoraram”.
- source_word: לְמַסֵּכָה
  choice: diante de uma imagem de metal fundido
  rationale: מַסֵּכָה designa uma imagem produzida por fundição, geralmente em metal. A expressão comunica com clareza esse traço específico em português moderno; “ídolo” seria genérico demais.
theological_decisions:
- issue: Explicitar o objeto como “bezerro de ouro”
  choice: Manter “um bezerro” sem “de ouro” no texto principal.
  alternative: um bezerro de ouro
  rationale: Embora Êxodo 32 identifique o material como ouro, este versículo diz apenas “bezerro” e depois o caracteriza como imagem fundida. Acrescentar “de ouro” importaria um detalhe do contexto mais amplo.
- issue: Traduzir וַיִּשְׁתַּחֲווּ diretamente como adoração
  choice: 'Traduzir pelo gesto: “se prostraram diante de”.'
  alternative: adoraram
  rationale: O contexto torna inequívoca a idolatria, mas a formulação escolhida preserva a ação corporal expressa no hebraico e não elimina sua força cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Imagem de metal fundido” explicita naturalmente o sentido técnico do substantivo hebraico; “se prostraram diante de” conserva o gesto concreto e a implicação de culto.
