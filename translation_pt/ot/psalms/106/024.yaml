  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: pt
  text: Então desprezaram a terra desejável[a]; não creram na sua palavra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra agradável” ou “a terra preciosa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não confiaram na sua palavra”; neste contexto, “sua palavra” também pode ser entendida como “sua promessa”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Então desprezaram
  rationale: O verbo מָאַס expressa rejeitar ou desprezar. “Desprezaram” preserva a força da censura, e “Então” representa com naturalidade a sequência narrativa marcada pelo waw consecutivo.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: a terra desejável
  rationale: אֶרֶץ é “terra” neste contexto geográfico e da promessa. חֶמְדָּה indica aquilo que é desejável, precioso ou agradável; “terra desejável” mantém de perto a formulação hebraica e comunica que a terra era digna de ser desejada.
- source_word: לֹא הֶאֱמִינוּ
  choice: não creram
  rationale: O hifil de אָמַן pode significar crer ou confiar. “Não creram” combina naturalmente com “palavra” e preserva a amplitude do hebraico.
- source_word: לִדְבָרוֹ
  choice: na sua palavra
  rationale: דָּבָר pode designar palavra, declaração ou, no contexto, promessa. A opção ampla “sua palavra” evita explicitar no texto principal algo que o hebraico deixa implícito.
theological_decisions:
- issue: Explicitar se “sua palavra” é a promessa de Deus acerca da terra
  choice: Manter “sua palavra” no texto principal
  alternative: sua promessa
  rationale: O contexto aponta para a promessa divina, mas o hebraico emprega o termo mais amplo דָּבָר. A tradução conserva essa amplitude sem eliminar a leitura contextual.
- issue: Traduzir הֶאֱמִינוּ como crença ou confiança
  choice: não creram
  alternative: não confiaram
  rationale: Ambas as ideias pertencem ao campo semântico do verbo. “Não creram na sua palavra” reproduz de modo direto a construção hebraica, enquanto a alternativa destaca a dimensão relacional sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura breve e paralela do verso foi preservada; “terra desejável” mantém a imagem hebraica sem inserir explicitamente “prometida”.
