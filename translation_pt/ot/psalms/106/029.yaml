  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: pt
  text: Eles o provocaram à ira com seus atos[a], e uma praga irrompeu entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eles o irritaram com suas ações».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: Eles o provocaram à ira
  rationale: O hifil de כעס expressa causar ira ou provocar à ira. O objeto não aparece explicitamente no hebraico, mas o contexto aponta para Deus; o pronome «o» comunica essa referência sem acrescentar um nome ao texto.
- source_word: בְּמַעַלְלֵיהֶם
  choice: com seus atos
  rationale: מַעֲלָלִים designa atos ou ações, aqui com conotação moral dada pelo contexto. A preposição ב indica o meio pelo qual ocorreu a provocação.
- source_word: וַתִּפְרָץ
  choice: irrompeu
  rationale: O verbo פרץ sugere um surgimento súbito ou impetuoso. «Irrompeu» preserva essa força e combina naturalmente com «praga».
- source_word: בָּם
  choice: entre eles
  rationale: A preposição ב indica que a praga surgiu no meio do grupo. «Entre eles» é uma formulação natural e mantém aberta a nuance locativa.
- source_word: מַגֵּפָה
  choice: uma praga
  rationale: מַגֵּפָה costuma designar uma praga ou golpe mortal, especialmente em contexto de juízo. «Praga» é claro e adequado à alusão histórica.
theological_decisions:
- issue: Objeto divino implícito de וַיַּכְעִיסוּ
  choice: Fornecer o objeto pronominal «o», em referência a Deus.
  alternative: Traduzir sem objeto explícito ou inserir «Deus»/«o SENHOR».
  rationale: Embora o hebraico não expresse o objeto neste segmento, o contexto identifica Deus como aquele que foi provocado. O pronome esclarece a sintaxe em português sem explicitar mais do que o discurso permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Provocaram à ira» conserva a força causativa do hebraico; «atos» e «irrompeu» mantêm concisão poética.
