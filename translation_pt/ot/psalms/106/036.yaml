  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: pt
  text: Serviram aos seus ídolos[a], e estes se tornaram uma armadilha para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Adoraram os seus ídolos, e estes se tornaram um laço para eles.”'
    reason: Alternativas lexicais legítimas para עבד (“adoraram”) e מוֹקֵשׁ (“laço”).
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Serviram
  rationale: O qal de עבד expressa aqui o serviço religioso prestado a falsos deuses. “Serviram” preserva a ligação verbal com serviço e devoção sem explicitar além do hebraico; “adoraram” é uma alternativa possível.
- source_word: עֲצַבֵּיהֶם
  choice: seus ídolos
  rationale: עֲצַבִּים designa com frequência ídolos, geralmente com conotação polêmica. “Ídolos” comunica o referente com clareza maior que “imagens”.
- source_word: וַיִּהְיוּ
  choice: se tornaram
  rationale: 'Embora היה possa significar simplesmente “ser”, a construção com לְמוֹקֵשׁ indica naturalmente resultado ou função adquirida: os ídolos vieram a servir de armadilha.'
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição ל marca a relação ou o efeito sobre o povo. “Para eles” é natural em português com “tornaram-se uma armadilha”.
- source_word: לְמוֹקֵשׁ
  choice: uma armadilha
  rationale: מוֹקֵשׁ designa laço ou armadilha, inclusive em sentido figurado. “Armadilha” é claro e corrente no português moderno.
theological_decisions:
- issue: Referente do sujeito implícito em וַיִּהְיוּ (“se tornaram”)
  choice: Os ídolos se tornaram uma armadilha para o povo que os servia.
  alternative: O ato de servir aos ídolos tornou-se uma armadilha para o povo.
  rationale: O antecedente plural mais próximo e natural é “seus ídolos”. A inserção de “estes” esclarece em português a referência gramatical, sem alterar o sentido mais provável do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Serviram” mantém a formulação hebraica, enquanto “estes” evita ambiguidade pronominal pouco natural em português. O marcador [a] aparece no texto principal.
