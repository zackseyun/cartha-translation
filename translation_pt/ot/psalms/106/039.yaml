base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: pt
  text: Assim, tornaram-se impuros por suas obras[a] e se prostituíram com seus atos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram infiéis por seus atos”. O hebraico emprega uma imagem sexual para expressar infidelidade moral e à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: tornaram-se impuros
  rationale: Preserva o sentido intransitivo ou resultativo de טמא, sem introduzir um agente externo não expresso no hebraico.
- source_word: בְּמַעֲשֵׂיהֶם
  choice: por suas obras
  rationale: 'Expressa o valor instrumental ou causal da preposição בְּ: suas próprias ações foram o meio pelo qual se tornaram impuros.'
- source_word: וַיִּזְנוּ
  choice: se prostituíram
  rationale: Mantém a imagem sexual forte de זנה e sua aplicação metafórica à infidelidade moral e pactual, sem substituí-la por uma interpretação explícita.
- source_word: בְּמַעַלְלֵיהֶם
  choice: com seus atos
  rationale: Comunica o sentido de atos ou práticas e conserva alguma variação poética em relação a מַעֲשֵׂיהֶם; “com” também preserva a abertura semântica da preposição hebraica.
theological_decisions:
- issue: Se זנה deve ser interpretado diretamente como apostasia ou infidelidade à aliança
  choice: 'Manter a metáfora no texto principal: “se prostituíram”'
  alternative: foram infiéis
  rationale: No contexto, a linguagem provavelmente descreve idolatria e infidelidade à aliança, mas o hebraico emprega deliberadamente uma imagem sexual. Mantê-la preserva a força e a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Tornaram-se impuros” evita o agente implícito de “foram contaminados”; “se prostituíram” conserva a metáfora bíblica sem linguagem arcaica.
