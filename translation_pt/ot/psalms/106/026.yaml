  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: pt
  text: Então, ele levantou a mão contra eles[a], para fazê-los cair no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «jurou contra eles». A expressão hebraica «levantou a mão» pode referir-se a fazer um juramento, especialmente em contexto de juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יָדוֹ
  choice: levantou a mão
  rationale: Preserva a imagem e o idioma hebraico, que pode descrever o gesto de prestar juramento; essa nuance é indicada em nota sem substituir a formulação concreta do texto.
- source_word: לָהֶם
  choice: contra eles
  rationale: Embora a preposição seja literalmente «a/para eles», neste contexto judicial «contra eles» comunica naturalmente a direção adversa do gesto.
- source_word: לְהַפִּיל אֹתָם
  choice: para fazê-los cair
  rationale: Reproduz o valor causativo do hifil de נפל e mantém a expressão mais transparente do que alternativas interpretativas como «destruí-los».
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: É a designação portuguesa corrente e contextualmente adequada para o lugar da peregrinação de Israel, sem exigir que se trate apenas de dunas ou areia.
theological_decisions:
- issue: Sentido idiomático de «levantou a mão»
  choice: Manter o idioma no texto principal e registrar em nota sua possível força de juramento judicial.
  alternative: «jurou contra eles»
  rationale: No contexto, o gesto provavelmente evoca um juramento solene de Deus acerca do juízo. Como o hebraico conserva a imagem em vez de empregar explicitamente um verbo para jurar, a tradução mantém essa tensão e evita resolver a ambiguidade no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A colocação pronominal em «fazê-los» preserva fluidez e registro bíblico contemporâneo sem arcaísmo.
