source:
  edition: WLC
  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: pt
  text: Esqueceram-se de Deus, seu Salvador[a], que havia feito grandes coisas no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu Libertador”. O particípio hebraico pode destacar Deus como aquele que os salva.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: Esqueceram-se
  rationale: O qal perfeito na terceira pessoa do plural relata uma ação passada no contexto da recapitulação histórica do salmo; o pretérito perfeito é natural em português.
- source_word: אֵל
  choice: Deus
  rationale: Embora אֵל possa ressaltar poder, aqui funciona como designação do Deus de Israel; “Deus” é a forma mais direta e natural.
- source_word: מוֹשִׁיעָם
  choice: seu Salvador
  rationale: O particípio hifil de ישׁע com sufixo da terceira pessoa masculina plural significa literalmente “seu salvador” ou “aquele que os salva”. A formulação escolhida é concisa e preserva esse papel característico de Deus.
- source_word: עֹשֶׂה
  choice: que havia feito
  rationale: O particípio qal modifica Deus e é expresso naturalmente por uma oração relativa. O mais-que-perfeito composto deixa clara a anterioridade das grandes obras em relação ao esquecimento.
- source_word: גְדֹלוֹת
  choice: grandes coisas
  rationale: O adjetivo substantivado plural designa grandes feitos de modo amplo. “Grandes coisas” é claro, corrente e mantém a amplitude do hebraico.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: A preposição בְּ indica o local onde ocorreram as obras divinas.
theological_decisions:
- issue: Sentido do título divino אֵל
  choice: Deus
  alternative: o Poderoso; Deus poderoso
  rationale: O contexto identifica aquele a quem Israel esqueceu, sem exigir que a possível nuance de poder seja transformada em título explícito.
- issue: Valor do particípio מוֹשִׁיעָם
  choice: seu Salvador
  alternative: aquele que os salvava; seu Libertador
  rationale: “Salvador” conserva a caracterização de Deus como aquele que salva, enquanto a nota registra a alternativa lexical legítima sem restringir o sentido à libertação política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “Esqueceram-se” mantém naturalidade formal sem arcaísmo; “seu Salvador” retoma o grupo plural de forma idiomática.
