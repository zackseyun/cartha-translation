  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: pt
  text: Lembrou-se, em favor deles, da sua aliança e voltou atrás[a], conforme a abundância do seu amor leal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mudou de ideia” ou “teve compaixão”. O verbo hebraico pode indicar voltar atrás ou ser movido à compaixão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Lembrou-se
  rationale: Em contexto de aliança, זכר indica lembrar-se de modo eficaz, agindo em consideração a um compromisso anterior. “Lembrou-se” mantém a formulação bíblica e sua ressonância pactual.
- source_word: לָהֶם
  choice: em favor deles
  rationale: A preposição ל com o sufixo refere o ato de lembrar à situação e ao benefício do povo. “Em favor deles” expressa isso com naturalidade em português.
- source_word: בְּרִיתוֹ
  choice: da sua aliança
  rationale: בְּרִית é o termo bíblico habitual para um vínculo solene de compromisso; “aliança” preserva seu sentido teológico e relacional.
- source_word: וַיִּנָּחֵם
  choice: e voltou atrás
  rationale: O nifal de נחם pode indicar voltar atrás, mudar de disposição ou ser movido à compaixão. “Voltou atrás” comunica uma mudança real no modo de Deus tratar o povo sem eliminar a amplitude semântica, explicitada na nota.
- source_word: כְּרֹב
  choice: conforme a grandeza
  rationale: A construção כ + רֹב exprime medida ou correspondência. “Conforme a grandeza” é natural e mantém essa relação proporcional.
- source_word: חַסְדּוֹ
  choice: do seu amor leal
  rationale: חסד reúne graça, amor e fidelidade constante, especialmente no âmbito da aliança. “Amor leal” preserva melhor essa combinação do que apenas “misericórdia”.
theological_decisions:
- issue: A linguagem antropopática aplicada a Deus em וַיִּנָּחֵם
  choice: e voltou atrás
  alternative: e mudou de ideia; e teve compaixão
  rationale: O hebraico descreve, em linguagem humana, uma mudança real no modo de Deus agir para com o povo. A tradução mantém essa tensão sem afirmar que Deus tenha cometido um erro ou recebido informação nova; a nota registra as outras nuances legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para a sintaxe natural do português, e “amor leal” conserva a dimensão afetiva e pactual de חסד.
