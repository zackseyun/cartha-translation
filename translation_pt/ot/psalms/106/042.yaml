  text: וַ/יִּלְחָצ֥וּ/ם אוֹיְבֵי/הֶ֑ם וַ֝/יִּכָּנְע֗וּ תַּ֣חַת יָדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: pt
  text: Seus inimigos os oprimiram, e eles foram subjugados sob a mão deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob o poder deles” ou “sob o domínio deles”; literalmente, “sob a mão deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: os oprimiram
  rationale: O Qal de לחץ com sufixo de objeto masculino plural expressa pressão hostil, aflição ou opressão; “oprimiram” comunica com clareza a dominação prolongada neste contexto.
- source_word: אֹיְבֵיהֶם
  choice: seus inimigos
  rationale: É o sentido comum de אֹיֵב com sufixo masculino plural e corresponde diretamente ao contexto de hostilidade.
- source_word: וַיִּכָּנְעוּ
  choice: foram subjugados
  rationale: 'O Nifal de כנע tem força passiva ou resultativa: ser abatido, humilhado ou posto em sujeição. “Foram subjugados” preserva essa força e combina com a expressão seguinte.'
- source_word: תַּחַת יָדָם
  choice: debaixo da mão deles
  rationale: A tradução mantém a imagem concreta do hebraico, na qual estar “debaixo da mão” de alguém significa estar sujeito ao seu poder ou domínio.
