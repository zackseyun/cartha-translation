  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: pt
  text: Pois amarguraram-lhe o espírito[a], e ele falou irrefletidamente[b] com os lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provocaram o seu espírito”; o verbo hebraico pode expressar a ideia de causar amargura ou de provocar.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Moisés falou impulsivamente em Meribá; compare Números 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a causa ou explicação do que foi dito no versículo anterior e mantém com naturalidade a ligação argumentativa.
- source_word: הִמְרוּ
  choice: amarguraram
  rationale: Com “o espírito dele” como objeto direto, expressa o possível sentido causativo de tornar amargo, sem eliminar a nuance próxima de provocar ou incitar.
- source_word: אֶת רוּחוֹ
  choice: o espírito dele
  rationale: Preserva o termo antropológico hebraico para a disposição interior de Moisés, sem interpretá-lo como referência ao Espírito Santo. A formulação também conserva formalmente a referência pronominal do texto.
- source_word: וַיְבַטֵּא
  choice: ele falou irrefletidamente
  rationale: O verbo indica proferir palavras e, neste contexto, tem força negativa. “Irrefletidamente” comunica uma fala impulsiva ou precipitada em português atual.
- source_word: בִּשְׂפָתָיו
  choice: com os seus lábios
  rationale: Mantém a imagem concreta do hebraico e sua expressão enfática referente à fala.
theological_decisions:
- issue: Referente dos pronomes em “o espírito dele” e “seus lábios”
  choice: Os pronomes se referem a Moisés.
  alternative: Os pronomes poderiam ser associados coletivamente ao povo ou a outro antecedente.
  rationale: No relato de Meribá em Salmos 106:32–33, a reação resultante é a fala irrefletida de Moisés, em consonância com Números 20:10. O contexto não indica referência ao Espírito Santo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a imagem hebraica de “espírito” e “lábios”, usando “irrefletidamente” para comunicar de maneira natural a força negativa da fala.
