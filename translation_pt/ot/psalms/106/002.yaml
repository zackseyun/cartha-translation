  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: pt
  text: Quem pode narrar os feitos poderosos de Yahweh ou proclamar todo o seu louvor?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Proclamar” traduz uma expressão que significa literalmente “fazer ouvir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יְמַלֵּל
  choice: Quem pode narrar
  rationale: A pergunta retórica trata da capacidade de expressar plenamente os atos de Deus. “Quem pode” explicita naturalmente essa força, enquanto “narrar” comunica o Piel de מלל como contar ou declarar.
- source_word: גְּבוּרוֹת
  choice: feitos poderosos
  rationale: O plural designa manifestações concretas de força ou poder, não apenas uma qualidade abstrata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַשְׁמִיעַ
  choice: proclamar
  rationale: O Hifil de שמע significa literalmente “fazer ouvir”; “proclamar” transmite de modo natural em português a ideia de tornar algo publicamente conhecido.
- source_word: כָּל תְּהִלָּתוֹ
  choice: todo o seu louvor
  rationale: Preserva tanto a força totalizante de כָּל quanto o singular coletivo תְּהִלָּתוֹ, sem restringi-lo apenas a atos específicos nem acrescentar explicitamente a ideia de louvor devido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. A transliteração “Yahweh” conserva essa distinção e evita substituí-lo silenciosamente por um título.
- issue: Sentido de תְּהִלָּתוֹ
  choice: seu louvor
  alternative: os louvores que ele merece; seus feitos dignos de louvor
  rationale: A expressão pode apontar para o louvor dirigido a Deus ou, por extensão, para aquilo que o torna digno de louvor. A redação conserva a formulação ampla e a tensão do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela e a pergunta retórica do hebraico foram preservadas.
