  text: Fez com que todos os que os haviam levado cativos tivessem compaixão deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: Fez com que [...] tivessem compaixão deles
  rationale: O hebraico apresenta Deus como aquele que faz seu povo tornar-se objeto de compaixão. Esta construção é natural em português e preserva a causalidade do verbo נתן.
- source_word: לִפְנֵי
  choice: com que
  rationale: Neste contexto, a expressão indica a relação perante aqueles que detinham os cativos; a construção portuguesa explicita essa relação sem introduzir uma ideia ausente.
- source_word: כָּל שׁוֹבֵיהֶם
  choice: todos os que os haviam levado cativos
  rationale: שבה designa levar ou manter alguém em cativeiro. O mais-que-perfeito composto situa naturalmente a captura antes da compaixão narrada.
theological_decisions:
- issue: Agência divina e compaixão dos captores
  choice: Fez com que [...] tivessem compaixão
  alternative: Concedeu-lhes compaixão diante de todos os seus captores
  rationale: A opção escolhida mantém Deus como agente causador e os captores como aqueles em quem a compaixão se manifesta, evitando a possível impressão de que a compaixão foi uma qualidade concedida diretamente aos cativos.
