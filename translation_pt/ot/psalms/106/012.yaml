  text: וַ/יַּאֲמִ֥ינוּ בִ/דְבָרָ֑י/ו יָ֝שִׁ֗ירוּ תְּהִלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: pt
  text: Então creram nas palavras dele[a] e cantaram o seu louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E creram nas palavras dele”. A forma narrativa hebraica pode ser traduzida por “e” ou pelo sequencial mais explícito “então”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Então creram
  rationale: O hifil wayyiqtol de אמן expressa aqui confiar ou crer. “Então” comunica de modo natural a progressão narrativa do waw, sem ampliar o sentido.
- source_word: בִדְבָרָיו
  choice: nas palavras dele
  rationale: דבר está no plural com sufixo masculino singular. A forma escolhida preserva o plural hebraico e evita em português a possível leitura de “suas palavras” como referente ao sujeito plural.
- source_word: יָשִׁירוּ
  choice: cantaram
  rationale: O imperfeito qal, no encadeamento narrativo do versículo, é adequadamente expresso pelo pretérito perfeito em português.
- source_word: תְּהִלָּתוֹ
  choice: o seu louvor
  rationale: תְּהִלָּה com sufixo masculino singular designa o louvor pertencente ou devido a ele. “Cantaram o seu louvor” é natural e mantém a construção possessiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome “dele” explicita sem ambiguidade que as palavras são de Deus; “o seu louvor” conserva a formulação poética tradicional e inteligível.
