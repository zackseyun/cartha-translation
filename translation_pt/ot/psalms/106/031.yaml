source:
  edition: WLC
  text: וַ/תֵּחָ֣שֶׁב ל֭/וֹ לִ/צְדָקָ֑ה לְ/דֹ֥ר וָ֝/דֹ֗ר עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: pt
  text: E isso lhe foi atribuído como justiça, de geração em geração, para sempre.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “considerado” ou “computado”. O hebraico usa a expressão habitual para algo ser tido ou atribuído como justiça.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por geração e geração”, expressão que indica todas as gerações sucessivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: foi atribuído
  rationale: O nifal de חשב expressa aqui a ideia passiva de considerar, computar ou atribuir. “Foi atribuído” preserva a linguagem de imputação sem exigir um sentido estritamente financeiro.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com o sufixo indica a pessoa a quem algo foi atribuído; o pronome “lhe” é direto e natural em português.
- source_word: לִצְדָקָה
  choice: como justiça
  rationale: Com חשב + ל, “como justiça” preserva a avaliação expressa pelo idioma hebraico e evita restringir o sentido a apenas “um ato justo”.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Esta expressão portuguesa reproduz naturalmente o idioma hebraico “por geração e geração”, indicando continuidade através das gerações sucessivas.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a forma portuguesa corrente e digna de expressar duração indefinida ou perpétua.
theological_decisions:
- issue: Relação com Gênesis 15:6 e o sentido teológico da justiça atribuída
  choice: Manter “lhe foi atribuído como justiça” sem acrescentar explicação doutrinária posterior.
  alternative: Traduzir como “foi considerado um ato justo” ou “foi-lhe creditado para justiça”.
  rationale: A formulação conserva a ressonância bíblica da justiça atribuída, mas não determina além do texto se o foco recai sobre condição, avaliação ou ato.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a linguagem de atribuição e o paralelismo temporal do hebraico.
