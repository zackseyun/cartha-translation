  source_fidelity: O texto traduz fielmente וַתֵּחָשֶׁב לוֹ לִצְדָקָה como “lhe foi atribuído como justiça”, preservando a construção passiva de חשב e sem reduzir a expressão a um único ato justo. “De geração em geração, para sempre” comunica adequadamente לְדֹר וָדֹר עַד עוֹלָם e mantém sua intensificação temporal.
