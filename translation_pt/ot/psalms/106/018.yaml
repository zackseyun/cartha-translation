base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: pt
  text: E um fogo ardeu no meio da assembleia deles; uma chama consumiu os perversos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: ardeu
  rationale: O verbo בער descreve o fogo que se acende ou arde; “ardeu” é natural e preserva a imagem concreta sem especificar além do hebraico.
- source_word: אֵשׁ
  choice: um fogo
  rationale: Mantém o sentido básico e concreto de אֵשׁ.
- source_word: בַּעֲדָתָם
  choice: no meio da assembleia deles
  rationale: עֵדָה designa o grupo reunido ou assembleia; “no meio de” expressa com naturalidade a ocorrência do fogo dentro desse grupo.
- source_word: לֶהָבָה
  choice: uma chama
  rationale: Preserva o paralelismo poético com “um fogo” e o sentido direto do substantivo.
- source_word: תְּלַהֵט
  choice: consumiu
  rationale: A forma intensiva de להט comunica queimar com força destrutiva; “consumiu” transmite esse resultado no contexto.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Traduz o plural substantivado como caracterização moral, sem acrescentar gênero nem restringi-lo a um termo jurídico.
theological_decisions:
- issue: Referente da linguagem de juízo
  choice: Manter a descrição concreta do fogo que atingiu os perversos dentro da assembleia.
  alternative: Entender o fogo apenas como metáfora geral do juízo.
  rationale: O contexto recorda acontecimentos históricos de rebelião e juízo; nada no verso exige que a imagem concreta seja alegorizada ou ampliada em uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Assembleia” mantém o sentido coletivo de עֵדָה, enquanto “no meio da” soa mais natural em português do que uma reprodução rígida da preposição hebraica.
