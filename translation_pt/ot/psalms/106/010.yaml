source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: pt
  text: Assim, ele os salvou[a] da mão daquele que os odiava e os redimiu[b] da mão do inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrou”; o verbo hebraico pode indicar o resgate de alguém em perigo.
    reason: lexical_alternative
  - marker: b
    text: “Redimiu” também pode ser traduzido por “resgatou” ou “libertou”; o hebraico transmite a ideia de recuperar ou libertar mediante intervenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: ele os salvou
  rationale: O verbo ישׁע expressa salvar ou livrar de um perigo. “Salvou” é claro em português moderno e mantém a força da intervenção divina.
- source_word: מִיַּד
  choice: da mão de
  rationale: Mantém a imagem hebraica da “mão” como poder ou domínio. A expressão continua compreensível em português e ocorre paralelamente nas duas metades do verso.
- source_word: שׂוֹנֵא
  choice: daquele que os odiava
  rationale: Preserva o particípio substantivado no singular, sem convertê-lo em plural. O pretérito imperfeito expressa naturalmente a hostilidade contínua no contexto narrativo.
- source_word: וַיִּגְאָלֵם
  choice: os redimiu
  rationale: O verbo גאל descreve recuperar ou libertar mediante intervenção. “Redimiu” preserva sua nuance própria e sua ressonância teológica, distinguindo-o de “salvou”.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: Conserva o substantivo definido no singular e o paralelismo com “daquele que os odiava”.
theological_decisions:
- issue: Se os verbos ישׁע e גאל deveriam ser nivelados como uma única ideia de livramento
  choice: Manter a distinção como “salvou” e “redimiu”
  alternative: Traduzir ambos por formas de “livrar”
  rationale: Os dois verbos são semanticamente próximos, mas não idênticos. Mantê-los distintos preserva o paralelismo poético e a tensão entre salvação do perigo e redenção por intervenção, sem acrescentar uma formulação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “da mão” conserva a imagem e o paralelismo do hebraico; os singulares “daquele que” e “do inimigo” foram preservados sem explicitar se representam indivíduos ou poderes coletivos.
