  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: pt
  text: Então Fineias se levantou e interveio[a], e a praga foi detida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “executou o julgamento”; alternativamente, “orou” ou “intercedeu”. Aqui, o verbo hebraico pode ter sentido judicial ou intercessório.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se levantou
  rationale: O verbo עמד pode significar “ficar de pé” ou “levantar-se”. Na sequência narrativa, “se levantou” expressa de modo natural o início de uma ação decidida.
- source_word: פִּינְחָס
  choice: Fineias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: וַיְפַלֵּל
  choice: interveio
  rationale: A forma verbal de פלל admite aqui força judicial ou intercessória. “Interveio” preserva essa amplitude e se harmoniza com a alusão a Números 25 sem reduzir o ato somente a oração nem explicitar em excesso sua execução.
- source_word: וַתֵּעָצַר
  choice: foi detida
  rationale: O nifal de עצר indica que algo foi contido ou interrompido. “Foi detida” é claro, digno e adequado à praga como sujeito.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מגפה designa uma praga ou surto mortal; “a praga” é a expressão natural e mantém a ligação contextual com Números 25.
theological_decisions:
- issue: Sentido de וַיְפַלֵּל em relação ao ato de Fineias
  choice: interveio
  alternative: executou o julgamento; orou ou intercedeu
  rationale: O salmo alude ao ato decisivo de Fineias em Números 25, mas o verbo hebraico pode assumir força judicial ou intercessória. A tradução principal mantém essa tensão, e a nota registra as leituras mais específicas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo narrativo e evita resolver indevidamente a ambiguidade do verbo central.
