  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: pt
  text: Mas desejaram intensamente no deserto[a] e puseram Deus à prova na terra árida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “desejaram um desejo”; o hebraico emprega um verbo e um substantivo da mesma raiz para intensificar a ideia.
    reason: lexical_alternative
  - marker: b
    text: Ou “na região desolada”. O termo hebraico enfatiza a aridez e a desolação do lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: foram dominados por um desejo intenso
  rationale: O verbo seguido do substantivo cognato forma uma expressão enfática, literalmente algo como “desejaram um desejo”. A formulação portuguesa comunica uma cobiça muito forte de modo natural, sem sugerir necessariamente desejo sexual.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região desértica ou erma; “deserto” é claro, corrente e preserva a associação com a peregrinação de Israel.
- source_word: וַיְנַסּוּ
  choice: puseram ... à prova
  rationale: נסה significa testar ou submeter à prova. A locução é natural em português e mantém o sentido negativo da provocação humana dirigida a Deus.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל funciona como título divino e é traduzido de maneira clara e idiomática por “Deus”.
- source_word: בִּישִׁימוֹן
  choice: na terra árida
  rationale: יְשִׁימוֹן enfatiza uma região desolada e estéril. “Terra árida” preserva essa nuance e evita repetir “deserto” para os dois termos hebraicos distintos.
theological_decisions:
- issue: Como representar a construção enfática com verbo e substantivo cognato
  choice: foram dominados por um desejo intenso
  alternative: desejaram intensamente; cobiçaram no deserto
  rationale: A tradução idiomática preserva a força do hebraico sem reproduzir a repetição pouco natural “desejaram um desejo”. Também evita restringir o sentido a uma conotação sexual ou acrescentar explicitamente a ideia moral de ganância.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém o paralelismo entre “deserto” e “terra árida”, distinguindo os dois termos geográficos hebraicos sem soar artificial.
