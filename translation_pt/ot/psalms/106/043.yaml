  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: pt
  text: Muitas vezes ele os livrou, mas eles se rebelaram em seus planos[a] e foram abatidos por sua iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu conselho” ou “segundo seus propósitos”. O hebraico pode enfatizar tanto o ato de rebeldia quanto uma disposição rebelde; o termo também pode significar “conselho”, “plano” ou “propósito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “afundaram” ou “definharam por causa de sua iniquidade”. O verbo hebraico pode indicar ser abatido, afundar ou definhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Muitas vezes
  rationale: Expressa diretamente a repetição numerosa indicada pela locução hebraica, com naturalidade em português.
- source_word: יַצִּילֵם
  choice: ele os livrou
  rationale: O hifil de נצל indica livrar ou resgatar. “Livrou” preserva a ideia de repetidas intervenções divinas sem acrescentar conotações não exigidas pelo verso.
- source_word: וְהֵמָּה
  choice: mas eles
  rationale: O pronome independente realça o contraste entre o livramento repetido e a resposta rebelde do povo.
- source_word: יַמְרוּ
  choice: se rebelavam
  rationale: O verbo מרה denota rebeldia ou resistência. O imperfeito em contexto de ações repetidas favorece uma formulação habitual, sem reduzir a rebeldia a um único ato pontual.
- source_word: בַעֲצָתָם
  choice: em seus próprios planos
  rationale: עֵצָה pode significar conselho, plano ou propósito. “Planos” é natural no contexto, enquanto “próprios” torna explícito apenas o valor possessivo do sufixo hebraico; a nota preserva as alternativas lexicais.
- source_word: וַיָּמֹכּוּ
  choice: foram abatidos
  rationale: מוך descreve ficar baixo, decair ou definhar. “Foram abatidos” comunica a condição resultante sem determinar de modo excessivo se houve colapso, humilhação ou definhamento.
- source_word: בַּעֲוֺנָם
  choice: por sua iniquidade
  rationale: עָוֹן abrange iniquidade, culpa e, por vezes, sua consequência. A formulação mantém o peso moral do termo e a força causal ou instrumental da preposição.
theological_decisions:
- issue: Agente do livramento
  choice: O sujeito é expresso apenas pelo pronome “ele” e entendido pelo contexto como Deus.
  alternative: Repetir explicitamente “Deus” ou “o SENHOR”.
  rationale: O hebraico traz um sujeito masculino singular implícito no verbo, sem repetir o nome divino neste verso. O contexto do salmo identifica o agente.
- issue: Aspecto da rebeldia
  choice: “Se rebelavam” apresenta uma conduta recorrente no contexto dos muitos livramentos.
  alternative: “Rebelaram-se” ou “eram rebeldes”.
  rationale: A forma verbal e o paralelismo contextual admitem uma leitura habitual. A tradução conserva tanto a ação de rebelar-se quanto sua persistência, sem transformar o verbo em mera característica estática.
- issue: Sentido moral de עָוֹן
  choice: “Iniquidade”.
  alternative: “Culpa” ou “maldade”.
  rationale: “Iniquidade” preserva a gravidade moral e a possível relação entre o pecado, a culpa e suas consequências, sem impor um sistema doutrinário específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o contraste poético do hebraico foram preservados, enquanto as notas mantêm abertas as principais ambiguidades lexicais.
