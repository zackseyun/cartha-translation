  text: חָטָ֥אנוּ עִם אֲבוֹתֵ֗י/נוּ הֶעֱוִ֥ינוּ הִרְשָֽׁעְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/006.yaml
  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: pt
  text: Pecamos com os nossos pais[a]; cometemos iniquidade[b]; agimos perversamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os nossos antepassados”. O hebraico diz literalmente “com os nossos pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “procedemos mal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: O qal perfeito na primeira pessoa do plural expressa uma confissão coletiva. Em português, o pretérito perfeito é natural e mantém a ação passada relevante no contexto penitencial.
- source_word: עִם
  choice: com
  rationale: A preposição indica associação e solidariedade com as gerações anteriores, não apenas semelhança.
- source_word: אֲבוֹתֵינוּ
  choice: os nossos pais
  rationale: Preserva o termo masculino de parentesco do hebraico; no contexto, ele pode designar os antepassados de Israel.
- source_word: הֶעֱוִינוּ
  choice: cometemos iniquidade
  rationale: O hifil de עוה comunica agir de modo errado, tortuoso ou culpável. A formulação distingue este membro de 'pecamos' e conserva sua densidade moral.
- source_word: הִרְשָׁעְנוּ
  choice: agimos perversamente
  rationale: O hifil de רשע descreve conduta ímpia ou culpável. 'Agimos perversamente' mantém a força verbal e o clímax da confissão tríplice.
theological_decisions:
- issue: Solidariedade coletiva na confissão
  choice: “com os nossos pais”
  alternative: “como os nossos pais” ou “com os nossos antepassados”
  rationale: עִם significa naturalmente 'com' e apresenta a comunidade em continuidade solidária com gerações anteriores, sem transformar a frase numa afirmação doutrinária técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência paralela. Mantém a confissão em três membros e a distinção lexical entre os três verbos hebraicos.
