  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: pt
  text: e fazer cair a descendência deles entre as nações e dispersá-la por diversas terras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: e fazer ... cair
  rationale: O infinitivo hifil de נפל tem sentido causativo, “fazer cair”. A formulação preserva a amplitude do hebraico sem especificar indevidamente morte ou derrota militar.
- source_word: זַרְעָם
  choice: a descendência deles
  rationale: זֶרַע significa literalmente “semente” e, neste contexto, designa a posteridade. “Descendência” é natural, clara e mantém a ideia coletiva.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם refere-se aqui às nações estrangeiras no meio das quais sua descendência sofreria o juízo; “nações” evita conotações posteriores desnecessárias de “gentios”.
- source_word: וּלְזָרוֹתָם
  choice: e espalhá-los
  rationale: זרה pode significar “joeirar” ou “espalhar”. Em paralelo com o juízo e a dispersão geográfica, “espalhar” comunica claramente o sentido contextual.
- source_word: בָּאֲרָצוֹת
  choice: por outras terras
  rationale: O plural de אֶרֶץ indica diversas terras ou países. “Por outras terras” expressa em português corrente a dispersão para fora da terra de Israel, sem restringir o termo a Estados políticos.
theological_decisions:
- issue: Natureza do juízo descrito
  choice: O versículo descreve um juízo que faz a descendência cair entre nações estrangeiras e a espalha por outras terras.
  alternative: A primeira oração pode ser entendida mais especificamente como fazer a descendência morrer ou ser derrotada entre as nações.
  rationale: O causativo de נפל é mais amplo que “matar”. O paralelismo com o espalhamento favorece conservar o sentido geral de queda e dispersão, sem eliminar as possíveis nuances de morte ou derrota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura infinitiva coordenada do hebraico foi preservada. “Descendência” mantém o valor coletivo de זֶרַע; por isso, o pronome plural em “espalhá-los” acompanha semanticamente as pessoas abrangidas pelo coletivo.
