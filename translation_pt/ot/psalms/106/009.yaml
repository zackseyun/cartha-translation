base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/009.yaml
  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: pt
  text: Repreendeu o Mar Vermelho[a], e ele secou; conduziu-os pelas profundezas como por um deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Mar de Juncos”. Hebraico: yam suf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: Repreendeu
  rationale: Preserva o sentido comum de גער e a imagem poética em que Deus se dirige ao mar como a um agente sob sua autoridade.
- source_word: בְּיַם סוּף
  choice: o mar Vermelho
  rationale: É a designação geográfica convencional em português para o mar do êxodo; a tradução mais literal é mantida em nota.
- source_word: וַיֶּחֱרָב
  choice: ele secou
  rationale: Expressa de modo natural o valor intransitivo de חרב; o pronome retoma claramente o mar.
- source_word: וַיּוֹלִיכֵם
  choice: conduziu-os
  rationale: Traduz com precisão e dignidade o causativo de הלך, indicando que Deus os fez avançar e os guiou.
- source_word: בַּתְּהֹמוֹת
  choice: pelas profundezas
  rationale: Conserva o plural hebraico e a força poética das grandes profundezas aquáticas, com a preposição adequada ao movimento.
- source_word: כַּמִּדְבָּר
  choice: como por um deserto
  rationale: 'Mantém a comparação: Deus tornou a travessia das profundezas semelhante a uma passagem por terreno desértico.'
theological_decisions:
- issue: Tradução de יַם סוּף na alusão ao êxodo
  choice: mar Vermelho
  alternative: mar de Juncos
  rationale: “Mar Vermelho” identifica de imediato o referente tradicional do êxodo para leitores de língua portuguesa, enquanto a nota preserva a alternativa lexicalmente possível sem resolver indevidamente a questão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação conserva o paralelismo narrativo e a personificação poética do mar.
