  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: pt
  text: Sacrificaram seus filhos e suas filhas aos demônios[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a demônios”.
    reason: 'alternativa lexical: o hebraico contém o artigo, mas em português o substantivo também pode ser empregado sem artigo em referência genérica.'
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: Sacrificaram
  rationale: O verbo זבח denota abater ou oferecer em sacrifício. “Sacrificaram” é natural e conciso e preserva o sentido cultual.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico de objeto direto não tem equivalente explícito necessário em português.
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: O plural de בֵּן designa especificamente os filhos do sexo masculino; a formulação mantém a distinção presente no hebraico.
- source_word: וְאֶת
  choice: e [marcador de objeto direto não traduzido]
  rationale: A conjunção é traduzida por “e”, enquanto o marcador de objeto direto fica implícito na sintaxe portuguesa.
- source_word: בְּנוֹתֵיהֶם
  choice: suas filhas
  rationale: O plural de בַּת significa “filhas”. A menção de filhos e filhas preserva a abrangência enfática da acusação.
- source_word: לַשֵּׁדִים
  choice: aos demônios
  rationale: שֵׁדִים refere-se a seres demoníacos. A preposição ל indica o destinatário do sacrifício, e o artigo incorporado na forma hebraica é naturalmente representado por “aos”.
theological_decisions:
- issue: Tradução de שֵׁדִים
  choice: demônios
  alternative: falsos deuses; espíritos malignos
  rationale: O termo hebraico designa seres espirituais demoníacos, não apenas ídolos abstratos. “Demônios” preserva a afirmação sobrenatural do texto sem acrescentar detalhes especulativos.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A ordem coordenada e os termos específicos “filhos” e “filhas” preservam o paralelismo e a força do hebraico.
