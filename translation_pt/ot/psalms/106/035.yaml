  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: pt
  text: mas se misturaram com as nações[a] e aprenderam as práticas delas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se mesclaram entre as nações”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os atos delas” ou “as obras delas”; aqui, a expressão se refere aos costumes e às ações habituais das nações.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: se misturaram
  rationale: O hitpael de ערב expressa aqui mistura ou associação social. “Se misturaram” é natural em português e mantém a ideia de assimilação sem acrescentar uma condenação explícita.
- source_word: בַגּוֹיִם
  choice: com as nações
  rationale: גּוֹיִם designa as nações ou povos ao redor de Israel. “Com as nações” combina naturalmente com o verbo escolhido e evita as conotações posteriores que “gentios” poderia introduzir.
- source_word: וַיִּלְמְדוּ
  choice: aprenderam
  rationale: A forma qal tem sentido ativo e direto. “Aprenderam” preserva a participação responsável de Israel na adoção dessas condutas.
- source_word: מַעֲשֵׂיהֶם
  choice: as práticas delas
  rationale: Embora o termo signifique literalmente “atos” ou “obras”, neste contexto refere-se às ações habituais e aos costumes das nações. “Práticas” comunica esse sentido claramente sem especificar além do texto.
theological_decisions:
- issue: Força moral e religiosa da associação de Israel com as nações
  choice: Expressar uma assimilação culpável por meio de “se misturaram com as nações e aprenderam as práticas delas”, sem acrescentar condenação explícita.
  alternative: Empregar uma formulação mais neutra, como “viveram entre as nações”, ou mais interpretativa, como “se contaminaram com as nações”.
  rationale: O hebraico afirma a associação e o aprendizado, enquanto o contexto do salmo fornece a avaliação negativa. A tradução mantém essa tensão sem intensificá-la nem atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “delas” retoma inequivocamente “as nações”; a conjunção inicial “mas” preserva o contraste com o versículo anterior.
