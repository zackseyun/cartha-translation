  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: pt
  text: Ele os entregou nas mãos das nações,[a] e os que os odiavam exerceram domínio sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão das nações”, expressão que significa estar sob o poder delas.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Ele os entregou
  rationale: O verbo נתן, com sujeito masculino singular implícito e objeto masculino plural, descreve aqui a entrega de Israel ao poder de outros. “Entregou” comunica naturalmente esse sentido em português sem reduzir a agência divina a mera permissão.
- source_word: בְּיַד גּוֹיִם
  choice: nas mãos das nações
  rationale: Preserva a metáfora hebraica da mão como poder ou domínio. O plural “nas mãos” é idiomático em português, embora o hebraico use o singular coletivo “na mão”.
- source_word: גּוֹיִם
  choice: nações
  rationale: No contexto, refere-se às nações estrangeiras sob cujo domínio Israel foi colocado. “Nações” é claro e evita a carga religiosa mais específica de “gentios”.
- source_word: וַיִּמְשְׁלוּ בָהֶם
  choice: dominaram sobre eles
  rationale: משׁל significa governar, exercer domínio. “Dominaram sobre” conserva a força hostil do contexto melhor que o mais neutro “governaram”.
- source_word: שֹׂנְאֵיהֶם
  choice: os que os odiavam
  rationale: A expressão reproduz o particípio hebraico, que designa aqueles que odiavam Israel, sem ampliá-lo para o conceito mais geral de “inimigos”.
theological_decisions:
- issue: Agência divina no juízo de Israel
  choice: “Ele os entregou” atribui diretamente a ação a Deus.
  alternative: Traduzir de modo mais brando, como se Deus apenas tivesse permitido que fossem dominados.
  rationale: O verbo hebraico נתן atribui a entrega ao sujeito divino implícito. A tradução preserva essa tensão teológica sem acrescentar explicações doutrinárias.
translation_notes:
  register: Português moderno, digno e acessível. A metáfora hebraica da mão foi mantida em forma portuguesa natural; “dominaram” comunica o caráter opressivo do governo exercido pelos que odiavam Israel.
