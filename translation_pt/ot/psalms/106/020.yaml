  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: pt
  text: Trocaram a sua glória pela imagem de um boi que come capim[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu Deus glorioso”. O hebraico diz literalmente “a sua glória”, uma forma reverencial de se referir a Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “touro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Trocaram
  rationale: O verbo מוּר expressa troca ou substituição. “Trocaram” comunica com naturalidade que abandonaram uma realidade em favor de outra.
- source_word: כְּבוֹדָם
  choice: a sua glória
  rationale: Preserva literalmente a expressão hebraica e sua força evocativa, sem explicitar no texto principal que a referência é a Deus.
- source_word: בְּתַבְנִית
  choice: pela imagem de
  rationale: תַּבְנִית pode indicar forma, semelhança ou representação. No contexto de idolatria, “imagem” é natural, e a preposição “por” completa idiomaticamente o verbo “trocar”.
- source_word: שׁוֹר
  choice: um boi
  rationale: שׁוֹר pode designar boi ou touro. “Boi” é uma equivalência ampla e corrente, enquanto a alternativa “touro” é registrada em nota.
- source_word: אֹכֵל עֵשֶׂב
  choice: que come capim
  rationale: 'A oração relativa reproduz naturalmente o particípio com seu objeto e mantém a ironia do hebraico: a glória de Israel foi substituída pela representação de um animal que pasta.'
theological_decisions:
- issue: Referente de “a sua glória”
  choice: Manter “a sua glória” no texto principal.
  alternative: “seu Deus glorioso” ou “Deus”
  rationale: Embora o contexto indique Deus como referente, o hebraico emprega o substantivo abstrato “glória”. A tradução mantém essa formulação reverencial e a tensão teológica, esclarecendo a referência possível em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Capim” torna concreta e natural a alimentação do animal; “erva” seria possível, mas pode soar menos claramente como pastagem neste contexto.
