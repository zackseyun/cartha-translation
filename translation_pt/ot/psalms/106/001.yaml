id: PSA.106.1
reference: Psalms 106:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: pt
  text: Aleluia![a] Deem graças a Yahweh, porque ele é bom, porque o seu amor leal dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Louvem a Yah”, usando a forma abreviada do nome Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ יָהּ
  choice: Aleluia
  rationale: A expressão litúrgica hebraica significa literalmente “Louvem a Yah”. A forma consagrada “Aleluia” é natural em português, preserva o caráter exclamativo e é esclarecida em nota.
- source_word: הוֹד֣וּ
  choice: Deem graças
  rationale: O imperativo plural de ידה, neste contexto de culto, convoca a comunidade a agradecer publicamente a Deus.
- source_word: לַ/יהוָ֣ה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da ação de graças, e o nome divino יְהוָה é representado como “Yahweh”.
- source_word: כִּי ט֑וֹב
  choice: porque ele é bom
  rationale: כִּי apresenta o motivo da ação de graças; o pronome e o verbo de ligação, implícitos no hebraico, são necessários para uma frase natural em português.
- source_word: לְ/עוֹלָ֣ם
  choice: dura para sempre
  rationale: A expressão significa “para sempre”. O verbo “dura”, suprido em português, comunica naturalmente a permanência atribuída ao amor de Yahweh.
- source_word: חַסְדּֽ/וֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e fidelidade relacional. “Amor leal” conserva essa amplitude sem restringir o termo apenas a misericórdia ou afeto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome divino; a transliteração preserva sua função de nome próprio sem importar uma interpretação denominacional.
- issue: Representação da forma abreviada יָהּ em הַלְלוּ־יָהּ
  choice: Aleluia, com explicação em nota
  alternative: Louvem a Yah
  rationale: A forma litúrgica tradicional é imediatamente reconhecível em português, enquanto a nota preserva o sentido e a presença da forma abreviada do nome divino.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia
  rationale: “Amor leal” preserva tanto a dimensão afetiva quanto a fidelidade duradoura do termo, sem decidir além do que o hebraico explicita se a referência é formalmente pactual.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural dirigidos à comunidade. Mantém-se a repetição de “porque”, que reflete os dois כִּי do hebraico e sustenta o paralelismo poético.
