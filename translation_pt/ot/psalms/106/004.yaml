  text: זָכְרֵ֣/נִי יְ֭הוָה בִּ/רְצ֣וֹן עַמֶּ֑/ךָ פָּ֝קְדֵ֗/נִי בִּ/ישׁוּעָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: pt
  text: Lembra-te de mim, ó Yahweh, quando mostrares favor ao teu povo[a]; atende-me com a tua salvação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com favor para com o teu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “visita-me com a tua salvação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Lembra-te de mim
  rationale: O imperativo qal de זכר com sufixo de primeira pessoa expressa um pedido direto para que Yahweh se lembre do salmista. A formulação preserva a força simples e orante do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: quando mostrares favor ao teu povo
  rationale: רָצוֹן denota favor, boa vontade ou aceitação. A preposição בְּ pode ter aqui valor temporal ou circunstancial; a formulação comunica naturalmente o pedido de ser lembrado quando Deus agir favoravelmente para com seu povo, enquanto a nota preserva a construção mais formal.
- source_word: פָּקְדֵנִי
  choice: atende-me
  rationale: Neste contexto de oração, פקד pode indicar voltar a atenção para alguém, cuidar dele ou intervir em seu favor. “Atende-me” comunica esse sentido em português corrente sem limitar o verbo a uma visita física.
- source_word: בִּישׁוּעָתֶךָ
  choice: com a tua salvação
  rationale: Preserva o substantivo יְשׁוּעָה e a preposição, mantendo a amplitude de salvação, livramento e auxílio salvador.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de בִּרְצוֹן עַמֶּךָ
  choice: 'Leitura temporal/circunstancial: “quando mostrares favor ao teu povo”'
  alternative: 'Leitura associativa: “com favor para com o teu povo”'
  rationale: A construção hebraica é compacta e admite mais de uma relação sintática. O contexto de súplica favorece a leitura temporal/circunstancial, mas a alternativa é mantida em nota para não eliminar a ambiguidade real.
- issue: Alcance de פָּקְדֵנִי
  choice: atende-me
  alternative: visita-me
  rationale: O verbo pode descrever uma visita divina no sentido de dar atenção e intervir. A opção principal torna essa força inteligível em português atual, e a nota conserva a imagem tradicional de “visitar”.
translation_notes:
  register: Português moderno, digno e acessível, com colocação pronominal natural em linguagem de oração. Mantém “Yahweh” como nome divino e conserva em notas as ambiguidades legítimas das expressões hebraicas.
