  text: A terra se abriu[a] e engoliu Datã[c]; cobriu o grupo[b] de Abirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se fendeu”. O verbo hebraico admite essa formulação mais vívida à luz do acontecimento narrado em Números 16.'
