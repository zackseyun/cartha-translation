    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: se abriu
  rationale: Qal imperfeito, 3ª pessoa feminina singular, de פתח, com אֶרֶץ como sujeito. No relato poético, descreve um acontecimento passado. “Se abriu” é claro e natural; “se fendeu” expressa de modo mais vívido o contexto, mas é um pouco mais interpretativo.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Neste contexto, designa a terra ou o solo que se abriu debaixo dos rebeldes, não um território.
- source_word: וַתִּבְלַע
  choice: e engoliu
  rationale: Wayyiqtol de בלע que dá sequência à ação passada. “Engoliu” preserva diretamente a imagem hebraica.
- source_word: דָּתָן
  choice: Datã
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: וַתְּכַס עַל
  choice: cobriu
  rationale: A combinação de כסה com עַל indica que a terra cobriu o grupo. Em português, “cobriu” comunica o sentido de modo natural, sem a necessidade de reproduzir a preposição separadamente.
- source_word: עֲדַת
  choice: o grupo de
  rationale: Forma construta de עֵדָה, referente à coletividade associada a Abirão. “Grupo” é atual e claro, sem a possível conotação eclesiástica de “congregação”.
- source_word: אֲבִירָם
  choice: Abirão
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
theological_decisions:
- issue: Relação do versículo com o relato mais amplo de Números 16
  choice: Traduzir apenas o resumo poético do salmo, que nomeia Datã e Abirão e menciona o grupo de Abirão.
  alternative: Acrescentar as famílias ou outros rebeldes citados no relato de Números 16.
  rationale: A tradução não deve inserir no versículo detalhes narrativos ausentes do texto hebraico do salmo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a concisão e o paralelismo poético do hebraico. O ponto e vírgula evita uma sequência pesada de conjunções sem apagar a progressão das ações.
