  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: pt
  text: para que eu veja o bem dos teus escolhidos, me alegre com a alegria da tua nação[a] e me glorie com a tua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “exulte junto com a tua herança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִרְאוֹת בְּטוֹבַת
  choice: para que eu veja o bem
  rationale: O infinitivo com לְ prossegue a finalidade da petição anterior. “Veja o bem” conserva tanto o verbo concreto ראה quanto a amplitude de טוֹבָה, que aqui pode abranger bem-estar, benefício e prosperidade.
- source_word: בְּחִירֶיךָ
  choice: dos teus escolhidos
  rationale: Expressa aqueles que Deus escolheu sem recorrer a “eleitos”, termo que pode trazer associações sistemáticas posteriores não exigidas pelo contexto.
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: me alegre com a alegria
  rationale: Mantém a repetição enfática da raiz hebraica שמח e entende בְּ como participação na alegria do povo.
- source_word: גּוֹיֶךָ
  choice: tua nação
  rationale: Traduz diretamente גּוֹי e preserva sua designação corporativa distinta das outras expressões do versículo.
- source_word: לְהִתְהַלֵּל
  choice: me glorie
  rationale: O hitpael de הלל pode indicar gloriar-se, exultar ou vangloriar-se. “Gloriar-me” comunica exultação positiva e mantém um registro digno sem a conotação predominantemente negativa de “vangloriar-me”.
- source_word: עִם נַחֲלָתֶךָ
  choice: com a tua herança
  rationale: עִם indica associação, e נַחֲלָה é preservado como o termo pactual “herança”, aqui aplicado ao povo pertencente a Deus.
theological_decisions:
- issue: Preservação das designações pactuais distintas do povo de Deus
  choice: teus escolhidos ... tua nação ... tua herança
  alternative: teus eleitos ... teu povo ... tua propriedade
  rationale: O hebraico reúne três designações diferentes. A tradução mantém essa variedade sem reduzi-las a um único termo nem importar uma formulação doutrinária posterior.
- issue: Sentido de לְהִתְהַלֵּל no contexto positivo
  choice: me glorie
  alternative: exulte; me vanglorie
  rationale: “Me glorie” preserva a possibilidade de orgulho exultante e comunitário sem sugerir necessariamente uma vanglória censurável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção em primeira pessoa retoma a finalidade da petição do versículo anterior. A repetição “me alegre com a alegria” é deliberada para refletir a figura etimológica hebraica.
