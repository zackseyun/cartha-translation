  source_fidelity: 'A tradução preserva a sequência final dos infinitivos de propósito dependentes da petição do versículo anterior: ver, alegrar-se e gloriar-se. “O bem” mantém adequadamente a amplitude de טוֹבָה, incluindo bem-estar e prosperidade sem a restringir; “teus escolhidos”, “tua nação” e “tua herança” refletem as երեք designações hebraicas distintas. “Me glorie com” comunica de modo aceitável a associação expressa por עִם e o sentido positivo-contextual de להתהלל.'
