source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: pt
  text: Então murmuraram[a] em suas tendas; não deram ouvidos à voz de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resmungaram” ou “reclamaram”. O verbo hebraico descreve uma manifestação murmurada de descontentamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “não obedeceram à voz de Yahweh”. A expressão hebraica traduzida como “dar ouvidos à voz” também pode ter o sentido de atender ou obedecer.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Então murmuraram
  rationale: O verbo רגן expressa queixa ou descontentamento manifestado em murmúrios. “Murmuraram” conserva esse aspecto e o tom negativo; “então” representa naturalmente a progressão narrativa do waw no contexto.
- source_word: בְאָהֳלֵיהֶם
  choice: em suas tendas
  rationale: אֹהֶל significa literalmente “tenda”. A tradução preserva a imagem concreta adequada ao contexto da peregrinação no deserto.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: não deram ouvidos à voz
  rationale: A construção שׁמע בקול pode indicar tanto escutar quanto atender ou obedecer. A expressão portuguesa “dar ouvidos à voz” preserva a imagem auditiva e comunica a recusa em acatar, sem reduzi-la explicitamente a “obedecer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido pelo nome pessoal “Yahweh”, em vez de ser substituído por um título.
theological_decisions:
- issue: Sentido de שׁמע בקול
  choice: não deram ouvidos à voz
  alternative: não obedeceram à voz
  rationale: A formulação escolhida mantém a metáfora hebraica da escuta e, ao mesmo tempo, permite o sentido contextual de atender ou obedecer, sem eliminar a amplitude semântica.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Murmuraram” mantém o tom bíblico sem ser arcaico; “deram ouvidos” preserva a tensão entre escutar e obedecer.
