  text: וַ/יִּֽחַר אַ֣ף יְהוָ֣ה בְּ/עַמּ֑/וֹ וַ֝/יְתָעֵ֗ב אֶת נַחֲלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: pt
  text: Então, a ira de Yahweh se acendeu contra seu povo, e ele detestou sua herança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: A expressão hebraica combina o verbo חרה com אַף para retratar a ira como calor que se acende. A formulação preserva essa metáfora de modo natural e solene em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַמּוֹ
  choice: contra o seu povo
  rationale: Com um verbo de ira, a preposição בְּ marca naturalmente o alvo contra o qual ela se dirige.
- source_word: וַיְתָעֵב
  choice: detestou
  rationale: תעב comunica forte aversão ou repulsa. “Detestou” é atual, claro e conserva a intensidade do hebraico.
- source_word: נַחֲלָתוֹ
  choice: a sua herança
  rationale: נַחֲלָה designa herança ou porção atribuída; aplicado ao povo, “herança” mantém a nuance relacional e pactual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Linguagem antropopática da ira divina
  choice: a ira de Yahweh se acendeu
  alternative: Yahweh ficou irado
  rationale: A tradução conserva a imagem hebraica de calor e não reduz a linguagem vívida do salmo a uma afirmação abstrata.
- issue: Repulsa de Deus por sua própria herança
  choice: ele detestou a sua herança
  alternative: ele rejeitou a sua herança
  rationale: 'Mantém a forte tensão do texto: o povo continua designado como herança de Yahweh, embora seja objeto de sua profunda aversão no contexto do juízo.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação simples reproduz o paralelismo narrativo do hebraico; “se acendeu” preserva a metáfora sem soar excessivamente arcaico.
