  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: pt
  text: Eles provocaram ira nas águas de Meribá[a][b], e Moisés foi prejudicado por causa deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meribá significa “discussão”, “contenda” ou “conflito”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Eles o irritaram nas águas de Meribá”. O hebraico não declara explicitamente, nesta linha, quem foi levado à ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: provocaram ira
  rationale: O hifil de קצף expressa causação de ira. A formulação preserva essa força causativa sem explicitar quem foi provocado, pois o objeto não aparece no hebraico.
- source_word: עַל מֵי מְרִיבָה
  choice: junto às águas de Meribá
  rationale: Aqui עַל introduz o local ou cenário do episódio. “Junto às” é natural em português e evita sugerir que as próprias águas foram necessariamente o objeto da provocação.
- source_word: מֵי מְרִיבָה
  choice: as águas de Meribá
  rationale: Mantém Meribá como nome próprio e traduz diretamente a construção hebraica.
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: as coisas acabaram mal para Moisés
  rationale: Reproduz de modo idiomático o sentido adverso e impessoal da expressão, sem atribuir maldade moral a Moisés nem especificar nesta linha qual foi a consequência.
- source_word: בַּעֲבוּרָם
  choice: por causa deles
  rationale: No contexto, a expressão indica causa e relaciona o resultado adverso sofrido por Moisés à conduta do povo.
theological_decisions:
- issue: Natureza do resultado adverso para Moisés
  choice: O versículo afirma que, por causa do povo, as coisas acabaram mal para Moisés, sem explicar plenamente nesta linha a relação entre a provocação do povo e a responsabilidade do próprio Moisés.
  alternative: Explicitar que o texto se refere ao pecado de Moisés em Meribá, ou atribuir toda a culpa exclusivamente ao povo.
  rationale: 'O hebraico preserva a tensão: relata um resultado ruim para Moisés por causa deles, mas não desenvolve aqui toda a explicação teológica presente no contexto mais amplo.'
- issue: Objeto da provocação
  choice: Não explicitar no texto principal quem foi provocado à ira.
  alternative: Traduzir “provocaram a ira de Deus” ou “irritaram-no”.
  rationale: O objeto de וַיַּקְצִיפוּ não está expresso nesta linha. Embora o contexto permita inferências, a tradução não deve inseri-las silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Provocaram ira” conserva a ambiguidade do objeto; “as coisas acabaram mal” comunica naturalmente o resultado adverso sem explicar além do hebraico.
