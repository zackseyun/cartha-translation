revisions:
- from: Eles provocaram ira junto às águas de Meribá[a][b], e, por causa deles, as coisas acabaram mal para Moisés.
  to: Eles provocaram ira nas águas de Meribá[a][b], e Moisés foi prejudicado por causa deles.
