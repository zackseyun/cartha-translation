  source_fidelity: A primeira oração preserva adequadamente o hifil causativo de קצף sem identificar o objeto não expresso da ira. A segunda comunica o sentido adverso e causal de וַיֵּרַע לְמֹשֶׁה בַּעֲבוּרָם. A revisão torna esse resultado adverso mais direto em português, sem acrescentar uma explicação teológica.
  naturalness: “Junto às águas” é possível, mas “nas águas de Meribá” é mais fluente para a referência ao episódio/local. “As coisas acabaram mal para Moisés” é compreensível, porém algo coloquial e indireto; “Moisés foi prejudicado” é conciso, natural e mantém o caráter adverso sem especificar qual foi o prejuízo.
  terminology: “Meribá” é uma transliteração apropriada e consistente. “Provocaram ira” conserva a ambiguidade deliberada do texto hebraico. A nota alternativa deve dizer que o hebraico não explicita a pessoa levada à ira, em vez de “quem foi provocado”, que pode inverter a relação causativa.
