id: PSA.106.8
reference: Psalms 106:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם לְמַ֣עַן שְׁמ֑/וֹ לְ֝/הוֹדִ֗יעַ אֶת גְּבוּרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: pt
  text: Contudo[a], ele os salvou por causa do seu nome[b], para tornar conhecido o seu poder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “E ele os salvou” ou “Mas ele os salvou”; a conjunção hebraica admite diferentes traduções e, aqui, estabelece contraste com o versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: “Por causa do seu nome” também pode ser entendido como “por causa da sua reputação”, embora “nome”, em hebraico, muitas vezes inclua o sentido mais amplo do caráter revelado e da honra de Deus.
    reason: lexical_alternative
  - marker: c
    text: Ou “a sua força”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Contudo, ele os salvou
  rationale: O verbo ישׁע significa “salvar” ou “livrar”. “Salvou” é natural e preserva sua ressonância teológica. Neste contexto, o וַ inicial liga a oração à anterior com valor de contraste, expresso por “Contudo”.
- source_word: לְמַעַן שְׁמוֹ
  choice: por causa do seu nome
  rationale: לְמַעַן indica motivo ou propósito. A expressão mantém literalmente “nome”, que no hebraico abrange a identidade revelada, o caráter e a honra de Deus, sem reduzi-lo apenas à reputação.
- source_word: לְהוֹדִיעַ
  choice: para tornar conhecido
  rationale: O infinitivo causativo de ידע significa “fazer saber” ou “tornar conhecido”. A formulação portuguesa comunica com clareza tanto o propósito quanto a força causativa.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Partícula que marca o objeto direto definido e não possui equivalente lexical próprio em português.
- source_word: גְּבוּרָתוֹ
  choice: o seu poder
  rationale: גְּבוּרָה pode designar força, poder ou feitos poderosos. Aqui, o singular abstrato “poder” é natural em português e expressa a capacidade divina manifestada no ato de salvar.
theological_decisions:
- issue: Sentido de “por causa do seu nome”
  choice: O ato salvador de Deus decorre da consideração por seu nome, entendido como sua identidade revelada, seu caráter e sua honra.
  alternative: “Por causa da sua reputação.”
  rationale: A noção de reputação está incluída no idioma hebraico, mas não esgota seu sentido. Conservar “nome” preserva a profundidade teológica e a possível dimensão pactual sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Contudo” explicita o contraste contextual sem tornar a formulação coloquial; “seu nome” conserva o idioma bíblico e sua amplitude semântica.
