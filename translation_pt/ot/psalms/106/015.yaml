  naturalness: '“Então ele lhes deu o que pediram” é natural. “Enviou fraqueza ao seu ser” tem combinação pouco idiomática: o singular “seu ser” depois de “lhes” é pesado e “fraqueza” não transmite bem a imagem de debilitamento progressivo. “Enviou definhamento às suas vidas” é claro, digno e natural o suficiente no registro poético.'
