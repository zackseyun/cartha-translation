  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: pt
  text: Então ele lhes deu o que pediram[a], mas enviou definhamento às suas vidas[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pedido deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “magreza”, “emaciação” ou “fraqueza”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico néfesh; também pode significar “alma”, “pessoa” ou “ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ele lhes deu
  rationale: Traduz diretamente נתן e incorpora com naturalidade o objeto indireto לָהֶם.
- source_word: שֶׁאֱלָתָם
  choice: o que pediram
  rationale: Expressa de modo idiomático שאלה, isto é, aquilo que foi solicitado; “seu pedido” permanece uma alternativa lexical legítima.
- source_word: וַיְשַׁלַּח
  choice: mas enviou
  rationale: O hebraico traz literalmente “e enviou”, porém o contexto estabelece contraste entre a concessão do pedido e sua consequência adversa.
- source_word: רָזוֹן
  choice: fraqueza
  rationale: רָזוֹן pode designar magreza, definhamento ou debilidade. “Fraqueza” é natural em português e evita sugerir apenas aparência física, enquanto a nota preserva as alternativas mais concretas.
- source_word: בְּנַפְשָׁם
  choice: ao seu ser
  rationale: נֶפֶשׁ abrange vida, pessoa, ser e, em certos contextos, alma. “Ao seu ser” comunica uma aflição que alcança a própria vida/pessoa sem impor a noção moderna de uma alma imaterial.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de juízo
  choice: ser
  alternative: alma; vida; pessoa
  rationale: O termo hebraico tem campo semântico mais amplo que o português moderno “alma”. “Ser” preserva a profundidade da expressão sem decidir uma antropologia dicotômica; a nota registra as alternativas.
- issue: Relação entre as duas orações
  choice: mas
  alternative: e
  rationale: 'Embora ו seja formalmente copulativo, o contexto apresenta contraste: Deus concedeu o pedido, porém enviou uma consequência aflitiva. “Mas” explicita essa relação sem acrescentar conteúdo doutrinário.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. As notas mantêm a amplitude lexical do hebraico e a ambiguidade de נֶפֶשׁ.
