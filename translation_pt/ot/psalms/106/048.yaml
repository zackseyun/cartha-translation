  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: pt
  text: 'Bendito seja Yahweh, o Deus de Israel, de eternidade a eternidade![a] E diga todo o povo: “Amém!” Louvem Yah![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde sempre e para sempre” ou “de era em era”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Louvem Yah”. A expressão é tradicionalmente transliterada como “Aleluia” ou traduzida como “Louvem o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a fórmula doxológica participial em português natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a cadeia construta hebraica.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: de eternidade a eternidade
  rationale: Mantém a repetição e a amplitude temporal da fórmula hebraica sem reduzi-la a uma simples paráfrase.
- source_word: וְאָמַר כָּל הָעָם
  choice: E diga todo o povo
  rationale: Embora וְאָמַר seja formalmente qatal, o contexto litúrgico favorece valor exortativo ou responsivo.
- source_word: אָמֵן
  choice: Amém
  rationale: Forma litúrgica consagrada e amplamente compreendida em português.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah
  rationale: Traduz o imperativo plural e preserva a forma abreviada do nome divino.
theological_decisions:
- issue: Distinção entre יְהוָה e a forma breve יָהּ
  choice: Yahweh para יְהוָה e Yah para יָהּ
  alternative: SENHOR para ambas as formas, ou Aleluia para הַלְלוּ יָהּ
  rationale: Preserva tanto o nome divino quanto a distinção lexical intencional entre sua forma plena e sua forma abreviada.
- issue: Valor verbal de וְאָמַר no contexto litúrgico
  choice: 'Exortação: “E diga todo o povo”'
  alternative: 'Narrativa ou previsão: “E todo o povo disse/dirá”'
  rationale: A posição do verso como doxologia e resposta congregacional sustenta a leitura volitiva, sem ocultar que a forma hebraica admite discussão.
translation_notes:
  register: Português moderno, claro e litúrgico, com ampla legibilidade brasileira. A ordem “diga todo o povo” conserva o tom responsivo e solene; “Louvem” explicita corretamente o imperativo plural hebraico.
