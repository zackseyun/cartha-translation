  text: wondrous things in the land of Ham[b][a], awesome things by the Red Sea.
translation:
  language: pt
  text: maravilhas na terra de Cam[a], feitos assombrosos junto ao mar Vermelho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cam” é, neste contexto, um nome poético para o Egito.
    reason: cultural_note
  - marker: b
    text: Hebraico Yam Suf, tradicionalmente “mar Vermelho”; outra tradução possível é “mar dos Juncos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: maravilhas
  rationale: O plural derivado de פלא designa atos extraordinários. “Maravilhas” é natural, poético e preserva a força do hebraico sem acrescentar uma interpretação técnica.
- source_word: בְּאֶרֶץ
  choice: na terra de
  rationale: A preposição בְּ com אֶרֶץ tem sentido locativo; “na terra de” é a forma direta e idiomática em português.
- source_word: חָם
  choice: Cam
  rationale: Mantém-se o nome próprio empregado no texto hebraico, em vez de substituí-lo interpretativamente por “Egito”; a nota esclarece sua referência contextual.
- source_word: נ֝וֹרָאוֹת
  choice: feitos assombrosos
  rationale: A forma derivada de ירא descreve atos que provocam temor e reverência. “Feitos assombrosos” comunica essa força melhor que “coisas terríveis”, que poderia sugerir maldade.
- source_word: עַל
  choice: junto ao
  rationale: Neste contexto geográfico, עַל indica localização à margem de ou perto do mar. “Junto ao” é natural e mantém aberta a relação espacial sem impor o sentido literal de “sobre”.
- source_word: יַם סוּף
  choice: mar Vermelho
  rationale: A tradução tradicional e amplamente reconhecida identifica o episódio referido. Como a expressão hebraica pode ser entendida literalmente como “mar dos Juncos”, essa alternativa é registrada em nota.
