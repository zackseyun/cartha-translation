  text: לֹֽא הִ֭שְׁמִידוּ אֶת הָֽ/עַמִּ֑ים אֲשֶׁ֤ר אָמַ֖ר יְהוָ֣ה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/034.yaml
  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: pt
  text: Não destruíram os povos que Yahweh lhes havia dito que destruíssem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Não destruíram os povos que Yahweh lhes disse”. A expressão “que destruíssem” foi suprida porque o conteúdo da fala está implícito no hebraico e é esclarecido pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Não
  rationale: A negação simples hebraica é expressa naturalmente em português antes do verbo no pretérito perfeito.
- source_word: הִשְׁמִידוּ
  choice: destruíram
  rationale: O hifil de שׁמד indica causar destruição ou eliminação. “Destruíram” preserva a força do verbo sem tornar a formulação mais específica que o hebraico.
- source_word: אֶת הָעַמִּים
  choice: os povos
  rationale: O plural עַמִּים designa grupos humanos distintos; “os povos” conserva esse sentido melhor que uma formulação territorial ou política.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português, retomando “os povos” como objeto implícito de “destruíssem”.
- source_word: אָמַר
  choice: havia dito
  rationale: O verbo significa literalmente “disse”. O mais-que-perfeito composto situa a fala de Yahweh antes da desobediência, sem intensificá-lo para “ordenou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָהֶם
  choice: lhes
  rationale: Representa de modo conciso e natural o objeto indireto plural, “a eles”.
theological_decisions:
- issue: Complemento elíptico depois de “Yahweh lhes havia dito”
  choice: Suprir “que destruíssem” no texto, com nota explicativa
  alternative: “Não destruíram os povos dos quais Yahweh lhes havia falado”
  rationale: O hebraico termina literalmente com “que Yahweh disse a eles”, deixando elíptico o conteúdo da fala. O verbo anterior e o contexto indicam que se trata da instrução de destruir esses povos. A explicitação produz português coerente sem esconder que o complemento está implícito no original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. Mantém “Yahweh” como nome próprio e preserva, por meio da nota, a elipse presente no hebraico.
