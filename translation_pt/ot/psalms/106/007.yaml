  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: pt
  text: Nossos pais, no Egito, não compreenderam os teus feitos maravilhosos; não se lembraram da imensidão do teu amor leal, mas se rebelaram junto ao mar — o mar Vermelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar de Juncos”. O nome hebraico Yam Suf é tradicionalmente traduzido por “mar Vermelho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Nossos pais
  rationale: Mantém o termo familiar masculino do hebraico, que aqui designa coletivamente as gerações anteriores de Israel.
- source_word: הִשְׂכִּילוּ
  choice: não compreenderam
  rationale: Expressa a falta de discernimento quanto ao significado dos atos de Deus, em paralelo com “não se lembraram”.
- source_word: נִפְלְאוֹתֶיךָ
  choice: os teus feitos maravilhosos
  rationale: Comunica que se trata de atos extraordinários de Deus, e não apenas de maravilhas abstratas.
- source_word: רֹב חֲסָדֶיךָ
  choice: a imensidão do teu amor leal
  rationale: “Imensidão” traduz naturalmente a ideia de abundância, enquanto “amor leal” preserva as dimensões de fidelidade, benevolência e compromisso presentes em חֶסֶד.
- source_word: וַיַּמְרוּ
  choice: mas se rebelaram
  rationale: O verbo significa rebelar-se; “mas” torna explícito o contraste contextual entre os atos amorosos de Deus e a resposta de Israel.
- source_word: עַל יָם בְּיַם סוּף
  choice: junto ao mar — no mar Vermelho
  rationale: Preserva as duas expressões locativas em aposição e identifica o mar de modo natural, sem fazer dele o objeto da rebelião.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; bondade
  rationale: “Amor leal” conserva a amplitude do termo, incluindo benevolência e fidelidade duradoura, sem restringi-lo apenas à compaixão.
- issue: Topônimo יַם סוּף
  choice: mar Vermelho
  alternative: mar de Juncos
  rationale: A forma tradicional e amplamente reconhecida permanece no texto, enquanto a tradução lexicalmente possível de סוּף é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção poética fluente. A repetição locativa do hebraico é mantida por meio de travessão, e a ambiguidade lexical do topônimo é preservada em nota.
