  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: pt
  text: Contudo, ele viu a aflição deles quando ouviu o clamor deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele viu a aflição que os atingia quando ouviu o clamor deles.”'
    reason: Alternativa lexical e sintática que representa mais explicitamente לָהֶם como relação de aflição sobre ou para eles e preserva a conjunção inicial simples.
lexical_decisions:
- source_word: וַיַּרְא
  choice: ele viu
  rationale: O verbo ראה significa diretamente “ver”; aqui, no contexto, também comunica que Deus percebeu e atentou para a situação, sem que seja necessário explicitar essa nuance no texto.
- source_word: בַּצַּר לָהֶם
  choice: a aflição deles
  rationale: צַר designa aperto, angústia ou aflição, e לָהֶם permite uma expressão possessiva natural em português. “Aflição” é clara, digna e adequada ao contexto de sofrimento.
- source_word: בְּשָׁמְעוֹ
  choice: quando ouviu
  rationale: A preposição בְּ com o infinitivo construto introduz naturalmente uma oração temporal; “quando ouviu” reproduz essa relação de modo corrente.
- source_word: רִנָּתָם
  choice: o seu clamor
  rationale: רִנָּה pode indicar um grito sonoro, inclusive de alegria, mas neste contexto de aflição denota um clamor urgente. “Clamor” preserva a intensidade e o registro poético.
- source_word: וַ
  choice: Contudo
  rationale: Embora וַ seja formalmente uma conjunção simples, o contexto contrasta a opressão decorrente da rebeldia anterior com a resposta misericordiosa de Deus. “Contudo” torna perceptível essa força adversativa sem acrescentar conteúdo.
theological_decisions:
- issue: Força discursiva da conjunção inicial no contexto de misericórdia após juízo
  choice: Nuance adversativa expressa por “Contudo”
  alternative: Conexão simples, “E”, ou sequência, “Então”
  rationale: O waw hebraico admite uma tradução simples, mas o fluxo do salmo destaca que Deus atende ao povo apesar da rebeldia narrada anteriormente. A opção mantém a tensão entre juízo e misericórdia sem resolver ou ampliar teologicamente o texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Aflição” e “clamor” mantêm um tom poético e digno sem arcaísmo; o pronome “seu” retoma o grupo plural de forma natural, embora a nota use “deles” para máxima explicitude.
