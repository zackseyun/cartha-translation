  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: pt
  text: Depressa se esqueceram das obras dele; não esperaram pelo seu conselho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu plano” ou “seu propósito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: Depressa
  rationale: Expressa a ideia de rapidez ou precipitação e, ligado a “se esqueceram”, produz uma formulação portuguesa natural e concisa.
- source_word: שָׁכְחוּ
  choice: se esqueceram
  rationale: O perfeito qal indica uma ação concluída; “se esqueceram” é a forma idiomática corrente em português.
- source_word: מַעֲשָׂיו
  choice: das obras dele
  rationale: “Obras” preserva a concisão e o registro bíblico de מַעֲשֶׂה, referindo-se aos atos realizados por Deus.
- source_word: לֹא חִכּוּ
  choice: não esperaram
  rationale: Traduz diretamente a negação e o perfeito de חכה, mantendo a censura narrativa do verso.
- source_word: לַעֲצָתוֹ
  choice: pelo seu conselho
  rationale: “Conselho” conserva a amplitude de עֵצָה, que pode envolver orientação, plano ou propósito, sem restringir o sentido a um decreto.
theological_decisions:
- issue: Sentido de עֵצָה em referência a Deus
  choice: seu conselho
  alternative: seu plano; seu propósito
  rationale: “Conselho” preserva tanto a dimensão de orientação divina quanto a possível ideia de desígnio, sem resolver indevidamente a ambiguidade em favor de uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Depressa” comunica a pressa indicada pelo hebraico; “obras dele” evita possível ambiguidade do possessivo “suas”.
