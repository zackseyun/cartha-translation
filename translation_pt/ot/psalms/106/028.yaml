base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/028.yaml
  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: pt
  text: Eles se uniram a Baal de Peor[a] e comeram sacrifícios dos mortos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prenderam a Baal-Peor”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “sacrifícios dos mortos”; a expressão pode se referir a sacrifícios oferecidos a ídolos sem vida ou a ritos associados aos mortos.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: se uniram
  rationale: O verbo צמד expressa ligação ou associação estreita. “Se uniram” é natural em português, preserva o sentido reflexivo e não acrescenta uma imagem ausente da forma principal.
- source_word: לְבַעַל פְּעוֹר
  choice: a Baal de Peor
  rationale: Mantém os nomes Baal e Peor e expressa de modo claro a relação do deus com o lugar, sem fundi-los necessariamente em um único nome.
- source_word: וַיֹּאכְלוּ
  choice: e comeram
  rationale: Reproduz de modo simples e direto a sequência narrativa hebraica.
- source_word: זִבְחֵי
  choice: sacrifícios
  rationale: O substantivo designa sacrifícios ou ofertas sacrificiais. “Sacrifícios” mantém correspondência lexical próxima sem especificar indevidamente que se trata de refeições sacrificiais.
- source_word: מֵתִים
  choice: dos mortos
  rationale: A expressão hebraica significa literalmente “dos mortos”. A tradução conserva a ambiguidade entre ídolos sem vida e ritos relacionados com pessoas mortas.
theological_decisions:
- issue: Referente de “mortos” em “sacrifícios dos mortos”
  choice: Manter a formulação ampla “dos mortos”.
  alternative: “oferecidos a ídolos sem vida” ou “oferecidos aos falecidos”
  rationale: O hebraico não identifica explicitamente o referente. A formulação literal preserva a possível alusão tanto a ídolos sem vida quanto a práticas associadas aos mortos, sem decidir uma questão que o texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a concisão do paralelismo narrativo foram preservadas; as notas registram a alternativa lexical e a ambiguidade sem sobrecarregar o texto principal.
