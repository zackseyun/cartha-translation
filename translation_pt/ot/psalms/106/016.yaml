  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: pt
  text: No acampamento, tiveram ciúmes de Moisés e de Arão, o santo de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consagrado a Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: tiveram ciúmes
  rationale: O verbo קנא indica aqui ciúme invejoso dirigido contra Moisés e Arão. A expressão é natural em português e preserva o sentido contextual sem acrescentar uma nuance temporal incerta.
- source_word: לְמֹשֶׁה ... לְאַהֲרֹן
  choice: de Moisés e de Arão
  rationale: Com קנא, a preposição ל marca as pessoas que são alvo do ciúme; em português, a construção idiomática é “ter ciúmes de”.
- source_word: בַּמַּחֲנֶה
  choice: No acampamento
  rationale: מַחֲנֶה designa o acampamento israelita no deserto. A colocação inicial mantém a moldura espacial do hebraico e produz uma frase fluente.
- source_word: קְדוֹשׁ יְהוָה
  choice: o santo de Yahweh
  rationale: A expressão funciona como designação apositiva de Arão e destaca sua condição de pessoa consagrada a Yahweh, preservando a formulação compacta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de קְדוֹשׁ יְהוָה aplicado a Arão
  choice: “o santo de Yahweh”, como designação de Arão enquanto pessoa especialmente consagrada a Yahweh
  alternative: “consagrado a Yahweh”
  rationale: A tradução principal conserva a ambiguidade e a concisão da relação expressa no hebraico; a nota registra a leitura relacional alternativa sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acampamento” e “tiveram ciúmes” são correntes; “o santo de Yahweh” preserva deliberadamente a formulação marcada e teologicamente densa do original.
