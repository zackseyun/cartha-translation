lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: cobriram
  rationale: Traduz diretamente o verbo כסה, preservando a imagem concreta das águas que cobrem os perseguidores.
- source_word: מַיִם
  choice: As águas
  rationale: Mantém o plural hebraico e, com o artigo, identifica naturalmente em português as águas mencionadas no contexto.
- source_word: צָרֵיהֶם
  choice: os seus adversários
  rationale: Expressa o sentido de oponentes hostis sem acrescentar especificidade; “inimigos” também seria possível.
- source_word: אֶחָד מֵהֶם
  choice: nenhum deles
  rationale: Reproduz de modo idiomático, sob negação, a ideia hebraica de que nem sequer um dentre eles ficou.
- source_word: לֹא נוֹתָר
  choice: restou
  rationale: Verte diretamente o nifal de יתר, que indica não ter sobrado ou permanecido alguém.
