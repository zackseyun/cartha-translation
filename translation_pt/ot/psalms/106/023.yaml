base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: pt
  text: Então ele disse que os destruiria — se Moisés, seu escolhido, não tivesse se colocado na brecha diante dele[a], para fazer sua ira recuar e impedi-lo de destruí-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na abertura”. A imagem hebraica é a de alguém que toma posição numa brecha da muralha; aqui, descreve a intercessão de Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa esse avanço com naturalidade em português.
- source_word: לְהַשְׁמִידָם
  choice: que os destruiria
  rationale: Após “disse”, o infinitivo com ל expressa a ação pretendida; a oração com futuro do pretérito comunica claramente essa intenção.
- source_word: לוּלֵי
  choice: se ... não tivesse
  rationale: 'Introduz uma condição contrafactual: a destruição ocorreria caso Moisés não interviesse.'
- source_word: בְחִירוֹ
  choice: seu escolhido
  rationale: Mantém a ideia de que Moisés foi escolhido por Deus sem acrescentar conotações doutrinárias posteriores.
- source_word: עָמַד בַּפֶּרֶץ
  choice: não tivesse se colocado ... na brecha
  rationale: Preserva a imagem concreta de alguém que toma posição numa abertura defensiva, ao mesmo tempo que soa natural em português.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: O pronome se refere naturalmente a Deus; a expressão preserva a cena de intercessão em sua presença.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: para fazer sua fúria recuar
  rationale: O hifil de שוב indica fazer voltar ou recuar; “fúria” traduz a intensidade de חֵמָה e conserva a imagem verbal.
- source_word: מֵהַשְׁחִית
  choice: e impedir a destruição
  rationale: A preposição מן com o infinitivo expressa prevenção. Esta formulação evita a repetição pouco natural de “destruir” sem eliminar o agente divino pressuposto.
theological_decisions:
- issue: Linguagem antropopática sobre o juízo divino
  choice: Manter “sua fúria” e a ideia de fazê-la recuar.
  alternative: Suavizar como “seu juízo” ou “sua decisão”.
  rationale: O hebraico retrata explicitamente a ira divina sendo contida pela intercessão de Moisés; a tradução não deve dissolver essa tensão.
- issue: Imagem intercessória de Moisés na brecha
  choice: Preservar a metáfora “na brecha”.
  alternative: Parafrasear apenas como “intercedeu por eles”.
  rationale: A imagem do defensor que ocupa uma abertura é central à representação de Moisés como mediador e deve permanecer visível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção contrafactual foi explicitada de modo natural, e a metáfora hebraica central foi preservada.
