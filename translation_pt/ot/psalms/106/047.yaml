  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: pt
  text: Salva-nos, Yahweh, nosso Deus, e reúne-nos dentre as nações, para darmos graças ao teu santo nome e nos gloriarmos no teu louvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e exultarmos ao te louvar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Salva-nos
  rationale: O imperativo hifil de ישׁע com sufixo de primeira pessoa do plural é um pedido direto de salvação ou livramento; “Salva-nos” é natural, solene e preserva o peso teológico e concreto do verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Representa diretamente a forma com sufixo de primeira pessoa do plural e mantém o caráter relacional da súplica.
- source_word: וְקַבְּצֵנוּ
  choice: e reúne-nos
  rationale: O piel imperativo de קבץ descreve a reunião de um povo disperso; “reúne-nos” é corrente e adequado ao contexto.
- source_word: מִן הַגּוֹיִם
  choice: dentre as nações
  rationale: Expressa que os suplicantes se encontram dispersos no meio de outros povos, sem introduzir a carga posterior de “gentios”.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: para darmos graças ao teu santo nome
  rationale: O infinitivo com לְ indica propósito; “dar graças” traduz o sentido usual de ידה no hifil, e “teu santo nome” comunica naturalmente a construção hebraica.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: e nos gloriarmos no teu louvor
  rationale: O hitpael de שׁבח tem força reflexiva de gloriar-se ou exultar; a formulação preserva essa intensidade e mantém “louvor” como substantivo, como no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” conserva essa função e evita substituir o nome por um título.
- issue: Sentido de לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: nos gloriarmos no teu louvor
  alternative: nos exaltarmos no teu louvor; nos alegrarmos com o teu louvor; nos orgulharmos do teu louvor
  rationale: A escolha mantém a força reflexiva e exultante sem atribuir mérito humano. A expressão hebraica é incomum em português, por isso a alternativa mais explícita é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com colocação pronominal compatível com o registro poético. “Dentre as nações” explicita a procedência do meio dos povos; “nos gloriarmos” conserva a tensão e a intensidade da expressão hebraica. O marcador [a] aparece no texto principal.
