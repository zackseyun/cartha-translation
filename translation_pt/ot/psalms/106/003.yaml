  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: pt
  text: 'Felizes os que guardam a justiça,

    os que praticam a retidão em todo tempo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Felizes
  rationale: A forma exclamativa introduz uma bem-aventurança. “Felizes” é natural e digna em português e comunica uma condição favorecida, não apenas uma emoção passageira.
- source_word: שֹׁמְרֵי
  choice: os que guardam
  rationale: O particípio indica uma prática contínua. “Guardam” preserva a imagem hebraica de observar e manter fielmente um padrão.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto ético, o termo se refere à justiça como norma e prática, não a uma sentença judicial.
- source_word: עֹשֵׂה
  choice: os que praticam
  rationale: Embora o particípio hebraico esteja no singular, ele tem força genérica e coletiva após a expressão plural. O plural produz português natural e mantém o sentido habitual da ação.
- source_word: צְדָקָה
  choice: a retidão
  rationale: “Retidão” expressa conduta moralmente correta e mantém este termo distinto de מִשְׁפָּט, traduzido como “justiça”.
- source_word: בְכָל עֵת
  choice: em todo tempo
  rationale: A expressão preserva a ênfase distributiva e comunica constância habitual em linguagem bíblica clara e corrente.
theological_decisions:
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: Traduzir distintamente como “justiça” e “retidão”.
  alternative: Empregar “justiça” para ambos, ou parafrasear o segundo como “o que é certo”.
  rationale: Os termos são semanticamente próximos, mas não idênticos. Distingui-los conserva o paralelismo e evita reduzir ambos a um único conceito.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura em dois versos preserva o paralelismo hebraico. “Felizes” evita uma formulação excessivamente eclesiástica, enquanto “guardam a justiça” e “praticam a retidão” mantêm o peso ético e a ação habitual do original.
