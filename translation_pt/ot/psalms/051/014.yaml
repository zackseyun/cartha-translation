  text: אֲלַמְּדָ֣ה פֹשְׁעִ֣ים דְּרָכֶ֑י/ךָ וְ֝/חַטָּאִ֗ים אֵלֶ֥י/ךָ יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: pt
  text: Ensinarei aos transgressores os teus caminhos, e os pecadores voltarão para ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vão se voltar para ti” ou “retornarão para ti”. O verbo hebraico pode expressar tanto voltar-se como retornar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Ensinarei
  rationale: O hifil imperfeito/coortativo na primeira pessoa do singular expressa aqui propósito ou resolução após a restauração pedida pelo salmista. O futuro em português transmite essa força volitiva de modo natural.
- source_word: פֹשְׁעִים
  choice: transgressores
  rationale: O termo designa os que transgridem ou se rebelam deliberadamente. “Transgressores” conserva o peso moral e pactual do hebraico sem explicitação excessiva.
- source_word: דְּרָכֶיךָ
  choice: os teus caminhos
  rationale: O plural de דֶּרֶךְ refere-se às maneiras, orientações ou caminhos de Deus. A tradução mantém a metáfora hebraica e sua ressonância bíblica.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: Equivalente direto e corrente que preserva o paralelismo com “transgressores”.
- source_word: אֵלֶיךָ
  choice: para ti
  rationale: A preposição indica direção, “a/para ti”. “Para ti” é natural em português e não acrescenta ao sintagma preposicional a ideia de retorno, que pertence ao verbo.
- source_word: יָשׁוּבוּ
  choice: voltarão
  rationale: שׁוב pode significar voltar, retornar ou virar-se. No contexto penitencial, “voltarão” comunica naturalmente a reorientação relacional para Deus, sem restringir o verbo a uma formulação doutrinária específica.
theological_decisions:
- issue: Linguagem de arrependimento em שׁוב
  choice: voltarão para ti
  alternative: se voltarão para ti; retornarão para ti
  rationale: O hebraico admite tanto a ideia de virar-se em direção a Deus quanto a de retornar a ele. “Voltarão para ti” preserva essa amplitude no contexto de restauração, sem definir uma teoria específica da conversão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a segunda pessoa singular (“teus”, “ti”) por sua naturalidade no registro bíblico e pela referência direta a Deus.
