  source_fidelity: 'O texto principal traduz com fidelidade o hebraico: o coortativo/imperfeito de primeira pessoa é adequadamente expresso por “Ensinarei”; “transgressores”, “teus caminhos”, “pecadores” e “voltarão para ti” preservam o paralelismo e a orientação do original. “Voltarão” mantém de modo apropriado a possível nuance de retorno em יָשׁוּבוּ, sem excluir a ideia de voltar-se para Deus.'
