review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência marcada por אָז ... אָז, o sentido de חפץ como prazer/aceitação, a referência aos touros e ao altar. Contudo, עוֹלָה e כָלִיל estão no singular no hebraico e são melhor representados como designações sacrificiais singulares. “Ofertas inteiramente consumidas” também pode sugerir consumo em sentido não sacrificial; “oferta inteiramente queimada” explicita com segurança o valor cultual de כָלִיל sem eliminar a possível relação estreita entre os dois termos.
  naturalness: “Então terás prazer em” e “sacrifícios justos” são naturais em português moderno e mantêm um registro bíblico digno. A formulação revista melhora a precisão e a fluência da enumeração sacrificial.
  terminology: “Holocausto” é o equivalente técnico estabelecido para עוֹלָה. “Oferta inteiramente queimada” comunica o aspecto de totalidade de כָלִיל e evita tratar o termo como uma categoria moderna vaga. A nota mantém tanto a possibilidade de distinção quanto a de expressão enfática.
  issues:
  - severity: medium
    issue: Pluralização de termos sacrificiais singulares
    rationale: O hebraico traz עוֹלָה e כָלִיל no singular. Embora o plural genérico seja possível em português, o singular preserva melhor a forma e a enumeração do texto-fonte.
  - severity: low
    issue: “Ofertas inteiramente consumidas” é potencialmente ambíguo
    rationale: “Consumidas” pode não indicar claramente a queima ritual. “Oferta inteiramente queimada” torna explícito o sentido cultual de totalidade associado a כָלִיל.
  revised_text: Então terás prazer em sacrifícios justos[a], em holocausto e oferta inteiramente queimada[b]; então touros serão oferecidos sobre o teu altar.
