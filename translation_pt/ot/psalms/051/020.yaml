source:
  edition: WLC
  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: pt
  text: Então terás prazer em sacrifícios justos[a], em holocausto e oferta inteiramente queimada[b]; então touros serão oferecidos sobre o teu altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios de justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “holocausto inteiramente queimado”. O hebraico pode distinguir aqui o holocausto da oferta inteiramente queimada ou usar os dois termos como uma expressão enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: terás prazer em
  rationale: חפץ expressa prazer ou satisfação; a formulação é natural em português e mantém o sentido de aceitação divina.
- source_word: זִבְחֵי צֶדֶק
  choice: sacrifícios justos
  rationale: Preserva a força moral e pactual de צֶדֶק sem limitar a expressão à mera correção ritual; a alternativa mais formal consta em nota.
- source_word: עוֹלָה
  choice: holocaustos
  rationale: Termo sacrificial tradicional e preciso em português para a oferta inteiramente queimada no altar.
- source_word: וְכָלִיל
  choice: ofertas inteiramente consumidas
  rationale: Mantém כָלִיל como termo distinto, enfatizando a totalidade da oferta, sem fundi-lo silenciosamente com עוֹלָה.
- source_word: יַעֲלוּ
  choice: serão oferecidos
  rationale: No contexto sacrificial, o hifil de עלה significa fazer subir ou apresentar sobre o altar; a voz passiva é idiomática em português.
- source_word: מִזְבַּחֲךָ
  choice: o teu altar
  rationale: Tradução direta do altar pertencente a Deus, a quem o salmista se dirige.
- source_word: פָרִים
  choice: touros
  rationale: Equivalente direto e adequado para os animais sacrificiais indicados por פָרִים.
- source_word: אָז ... אָז
  choice: Então ... então
  rationale: Conserva a repetição hebraica, que marca consequência e sequência.
theological_decisions:
- issue: A aceitação dos sacrifícios após a ênfase do salmo no arrependimento e no coração contrito
  choice: Conservar a linguagem concreta do culto sacrificial restaurado e aceitável
  alternative: Interpretar os sacrifícios metaforicamente ou subordiná-los explicitamente à disposição interior
  rationale: 'O texto mantém a tensão: os sacrifícios não são abolidos, mas aparecem como agradáveis a Deus no contexto da restauração. A tradução não resolve essa relação por paráfrase.'
- issue: Relação entre עוֹלָה e כָלִיל
  choice: 'Traduzir como duas expressões coordenadas: “holocaustos e ofertas inteiramente consumidas”'
  alternative: 'Entender a combinação como uma única expressão enfática: “holocaustos inteiramente consumidos”'
  rationale: A coordenação hebraica permite discussão sobre distinção, aposição ou hendíadis. O texto principal preserva a distinção lexical, e a nota registra a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “tu” por coerência com a fala direta a Deus e “holocausto” em seu sentido técnico sacrificial.
