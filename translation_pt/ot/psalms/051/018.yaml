id: PSA.51.18
reference: Psalms 51:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: pt
  text: Os sacrifícios de Deus são um espírito quebrantado[a]; um coração quebrantado e esmagado[b], ó Deus, não desprezarás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito contrito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um coração quebrantado e contrito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Os sacrifícios de Deus
  rationale: Preserva a construção hebraica sem explicitar interpretativamente “os sacrifícios que Deus aceita”, sentido que o contexto sugere, mas que a expressão não declara de modo direto.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: um espírito quebrantado
  rationale: Mantém a imagem de algo quebrado e soa natural e digna em português; “contrito” expressa bem o sentido penitencial, mas é mais interpretativo e fica registrado em nota.
- source_word: לֵב נִשְׁבָּר
  choice: um coração quebrantado
  rationale: Traduz diretamente “coração” e repete a imagem da raiz שבר, em paralelo com “espírito quebrantado”.
- source_word: וְנִדְכֶּה
  choice: e esmagado
  rationale: Conserva a metáfora concreta de algo esmagado ou abatido, sem reduzi-la antecipadamente à noção interpretativa de contrição.
- source_word: אֱלֹהִים
  choice: Deus / ó Deus
  rationale: Emprega a forma portuguesa padrão; na segunda ocorrência, a partícula vocativa “ó” torna explícito o endereço direto já indicado pela sintaxe hebraica.
- source_word: לֹא תִבְזֶה
  choice: não desprezarás
  rationale: Reproduz diretamente a ideia de tratar com desprezo ou desdém; o futuro mantém a forma verbal e a confiança expressa pelo salmista.
theological_decisions:
- issue: A metáfora do sacrifício no contexto de arrependimento
  choice: O texto identifica o espírito e o coração quebrantados como sacrifícios de Deus, sem acrescentar que o sistema sacrificial foi abolido.
  alternative: Explicitar “os sacrifícios aceitáveis a Deus” ou afirmar que sacrifícios exteriores foram rejeitados em absoluto.
  rationale: 'A tradução conserva a formulação metafórica e sua tensão teológica: o versículo exalta a disposição interior penitente, mas não formula por si só uma negação completa de todo sacrifício ritual.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Quebrantado” preserva a metáfora hebraica e é mais idiomático neste contexto do que “quebrado”; “esmagado” mantém a força concreta do segundo particípio. A ordem e o paralelismo poético do hebraico foram mantidos.
