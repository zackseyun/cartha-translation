source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: pt
  text: Devolve-me a alegria da tua salvação[c], e que um espírito disposto[a] me sustente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito generoso” ou “um espírito nobre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “me ampare”.
    reason: lexical_alternative
  - marker: c
    text: Ou “teu livramento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Devolve
  rationale: O imperativo no hifil de שוב pede que Deus faça voltar ao salmista uma alegria antes conhecida. “Devolve” expressa isso de modo direto e natural em português.
- source_word: לִּי
  choice: me
  rationale: A preposição com sufixo de primeira pessoa indica o destinatário; em português, o pronome átono com “devolver” comunica naturalmente “a mim”.
- source_word: שְׂשׂוֹן
  choice: alegria
  rationale: O substantivo denota alegria, contentamento ou júbilo. “Alegria” é claro, conciso e adequado ao contexto de oração.
- source_word: יִשְׁעֶךָ
  choice: tua salvação
  rationale: O termo pode indicar salvação ou livramento. “Tua salvação” preserva a amplitude teológica da ação salvadora de Deus sem restringi-la a um livramento apenas circunstancial.
- source_word: וְרוּחַ
  choice: e ... espírito
  rationale: Neste contexto poético e interior, רוּחַ é mais bem entendido como “espírito”, não “vento” ou “sopro”; a conjunção liga esta petição à anterior.
- source_word: נְדִיבָה
  choice: disposto
  rationale: O adjetivo pode significar disposto, generoso ou nobre. “Espírito disposto” comunica uma disposição pronta e voluntária, mantendo a frase aberta quanto a se tratar do espírito humano ou do Espírito divino.
- source_word: תִסְמְכֵנִי
  choice: me sustente
  rationale: O verbo סמך significa sustentar, apoiar ou amparar. O imperfeito tem aqui força volitiva, paralela ao imperativo inicial; “que ... me sustente” reproduz a petição com naturalidade.
theological_decisions:
- issue: Sentido de “tua salvação” no salmo penitencial
  choice: tua salvação
  alternative: teu livramento
  rationale: O hebraico comporta tanto salvação quanto livramento. No contexto de pecado, purificação e renovação, “salvação” mantém a abrangência da ação divina sem importar formulações doutrinárias posteriores.
- issue: Identidade e qualidade do “espírito disposto”
  choice: um espírito disposto
  alternative: um espírito generoso / um espírito nobre
  rationale: A tradução não determina se o espírito é o Espírito de Deus ou a disposição interior renovada do salmista. Também preserva, em nota, a amplitude semântica do adjetivo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “tu” de modo coerente com a linguagem de oração e evita explicitar a identidade do “espírito”, preservando a ambiguidade do hebraico.
