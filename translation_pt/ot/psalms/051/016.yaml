base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: pt
  text: Senhor, abre os meus lábios, e a minha boca proclamará o teu louvor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Título divino em vocativo. “Senhor” é a forma portuguesa natural e reverente, sem confundi-lo explicitamente com o nome divino YHWH.
- source_word: שְׂפָתַי
  choice: os meus lábios
  rationale: Preserva a imagem corporal concreta e o sufixo de primeira pessoa do singular.
- source_word: תִּפְתָּח
  choice: abre
  rationale: O imperfeito qal, no contexto de oração e apelo direto, funciona naturalmente como pedido; o imperativo português expressa isso com clareza.
- source_word: וּפִי
  choice: e a minha boca
  rationale: Mantém a conjunção simples e o paralelismo entre “lábios” e “boca”, sem acrescentar uma inferência temporal ou consecutiva.
- source_word: יַגִּיד
  choice: proclamará
  rationale: O hifil de נגד significa declarar ou tornar conhecido. “Proclamará” é natural no contexto de louvor público e conserva o valor resultante/futuro.
- source_word: תְּהִלָּתֶךָ
  choice: o teu louvor
  rationale: Expressão idiomática em português que mantém a referência de segunda pessoa e o sentido de louvor dirigido a Deus.
theological_decisions:
- issue: Tradução do título divino em apelo direto
  choice: Senhor
  alternative: meu Senhor
  rationale: אֲדֹנָי é usado como título divino reverente. “Senhor” traduz o título de modo natural, sem inserir o possessivo “meu”, embora este possa ser associado à forma hebraica historicamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação “os meus lábios” soa natural e preserva a imagem hebraica; “teu” mantém um tratamento direto, reverente e amplamente inteligível.
