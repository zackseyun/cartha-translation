source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: pt
  text: Por teu favor[a], faze o bem a Sião; edifica[b] os muros de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a tua vontade” ou “por tua boa vontade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “constrói”; em sentido de restauração, “reconstrói”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: faze o bem
  rationale: O hifil em forma de súplica pede que Deus aja em benefício de Sião. “Faze o bem” mantém a força verbal direta sem acrescentar a ideia mais específica de prosperidade.
- source_word: בִּרְצוֹנְךָ
  choice: por teu favor
  rationale: רָצוֹן pode expressar favor, boa vontade ou vontade. “Por teu favor” é natural em português, preserva o sentido de benevolência divina e não exclui o aspecto volitivo, registrado em nota.
- source_word: אֶת צִיּוֹן
  choice: a Sião
  rationale: O marcador de objeto introduz Sião como objeto ou beneficiária do bem solicitado; a construção portuguesa “fazer o bem a” expressa isso com clareza.
- source_word: תִּבְנֶה
  choice: edifica
  rationale: O imperfeito qal, após o imperativo, funciona como continuação da súplica. “Edifica” conserva o sentido básico de construir e pode admitir restauração sem impor explicitamente “reedifica”.
- source_word: חוֹמוֹת
  choice: muros
  rationale: O substantivo plural designa concretamente os muros da cidade; “muros” é a correspondência direta e corrente.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma tradicional e plenamente corrente do topônimo em português.
theological_decisions:
- issue: Relação entre o favor divino e a restauração
  choice: O versículo é traduzido como uma oração para que o favor de Deus se manifeste em benefício concreto de Sião e na edificação dos muros de Jerusalém.
  alternative: 'Entender a expressão em sentido sobretudo volitivo: “segundo a tua vontade, faze o bem a Sião”.'
  rationale: O hebraico רָצוֹן abrange favor, boa vontade e vontade. O texto principal destaca a benevolência divina, adequada ao contexto de oração, enquanto a nota preserva a alternativa volitiva.
translation_notes:
  register: Português moderno, claro e digno, com formas imperativas tradicionais mas ainda amplamente compreensíveis (“faze”, “edifica”). A formulação mantém o paralelismo conciso da poesia hebraica e sinaliza as alternativas lexicais sem determinar uma reconstrução histórica específica.
