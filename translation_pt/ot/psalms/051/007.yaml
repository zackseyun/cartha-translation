  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: pt
  text: Eis que desejas a verdade no íntimo[a] e, no lugar oculto[b], fazes-me conhecer a sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas partes interiores” ou “no ser interior”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no segredo, ensinas-me sabedoria”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Preserva a força enfática e poética que chama a atenção para a afirmação, sem reduzi-la a uma simples conjunção explicativa.
- source_word: אֱמֶת
  choice: a verdade
  rationale: Expressa verdade, autenticidade e integridade interior; evita restringir o termo exclusivamente à fidelidade pactual.
- source_word: חָפַצְתָּ
  choice: desejas
  rationale: Transmite o querer ou ter prazer em algo e se ajusta naturalmente à exigência moral do contexto.
- source_word: בַטֻּחוֹת
  choice: no íntimo
  rationale: Comunica de modo natural as partes interiores ou o ser interior, mantendo a referência ao centro oculto da pessoa sem uma imagem excessivamente anatômica.
- source_word: וּבְסָתֻם
  choice: e, no lugar oculto
  rationale: Conserva a metáfora espacial do que está escondido e mantém o paralelismo com o íntimo.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: É o equivalente direto e adequado para a sabedoria moral e espiritual no contexto.
- source_word: תוֹדִיעֵנִי
  choice: fazes-me conhecer
  rationale: Reproduz o valor causativo do hifil de ידע com clareza, sem excluir a ideia contextual de ensinar.
theological_decisions:
- issue: Natureza da verdade interior desejada por Deus
  choice: Apresentar a verdade como realidade moral interior e a sabedoria como algo que Deus dá a conhecer no âmbito oculto da pessoa.
  alternative: Entender “verdade” especificamente como fidelidade à aliança ou interpretar o verso sobretudo como autoconsciência psicológica.
  rationale: O paralelismo hebraico associa verdade interior e sabedoria comunicada por Deus, mas não define essas expressões segundo uma categoria doutrinária posterior; a tradução preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira e compreensão internacional. “Eis que” mantém a elevação do salmo; “no íntimo” evita um literalismo anatômico, enquanto a nota registra a imagem hebraica. Todos os marcadores de nota aparecem no texto.
