  text: Ao mestre de música[a]. Salmo de Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para o mestre de música”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de Davi”; a expressão pode indicar autoria, associação ou dedicação, e também pode ser traduzida como “por Davi” ou “para Davi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: O termo, comum nos cabeçalhos dos salmos, designa quem dirige ou supervisiona a execução musical. “Mestre de música” é claro e natural em português; “ao” representa a preposição לְ sem definir rigidamente se o sentido é destinatário ou finalidade.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação convencional e precisa desse gênero poético-musical, provavelmente associado a acompanhamento instrumental.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção com לְ e nome próprio pode indicar autoria, associação, pertença ou dedicação. “De Davi” conserva melhor essa amplitude do que “por Davi” ou “para Davi”.
theological_decisions:
- issue: Sentido do cabeçalho davídico
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não determina inequivocamente a relação de Davi com o salmo. A formulação escolhida mantém aberta a possibilidade de autoria, associação ou dedicação, sem impor uma interpretação específica.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa própria de um cabeçalho. “Mestre de música” evita a possível ambiguidade moderna de “regente” e não restringe a função necessariamente a um coro.
