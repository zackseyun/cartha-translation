base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: pt
  text: Sê bondoso comigo[a], ó Deus, segundo o teu amor leal[b]; segundo a abundância das tuas misericórdias[c], apaga as minhas transgressões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tem misericórdia de mim». O verbo hebraico pede favor ou graça; o texto principal o distingue dos termos posteriores para amor leal e misericórdias.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como «amor constante» ou «bondade fiel» e muitas vezes expressa lealdade no contexto de uma aliança.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «segundo a grandeza» ou «a multidão das tuas misericórdias».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sê bondoso comigo
  rationale: O imperativo de חנן com sufixo de primeira pessoa pede favor ou graça. A formulação preserva a força verbal e mantém distinção em relação a חֶסֶד e רַחֲמִים no restante do verso.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: É um vocativo dirigido ao Deus de Israel; «ó» torna explícita e natural a interpelação em português.
- source_word: כְּחַסְדֶּךָ
  choice: segundo o teu amor leal
  rationale: חֶסֶד abrange amor, bondade e lealdade firme, frequentemente em contexto de aliança. «Amor leal» comunica a constância relacional sem introduzir jargão técnico.
- source_word: כְּרֹב
  choice: segundo a abundância
  rationale: רֹב pode indicar abundância, grandeza ou multidão. A construção nominal preserva essa amplitude e soa natural com «misericórdias».
- source_word: רַחֲמֶיךָ
  choice: das tuas misericórdias
  rationale: O plural hebraico expressa manifestações abundantes de profunda compaixão. O plural foi mantido e distingue este termo do pedido inicial por favor.
- source_word: מְחֵה
  choice: apaga
  rationale: מחה significa limpar, apagar ou eliminar. «Apaga» conserva de modo claro a metáfora de remover algo escrito ou registrado.
- source_word: פְשָׁעַי
  choice: as minhas transgressões
  rationale: פֶּשַׁע denota transgressão, rebelião ou ruptura com a autoridade. «Transgressões» preserva sua força moral e relacional no contexto penitencial.
theological_decisions:
- issue: Distinção entre חנן, חסד e רחמים
  choice: Usar «Sê bondoso comigo», «amor leal» e «misericórdias».
  alternative: Empregar «misericórdia» ou termos da mesma raiz para as três expressões.
  rationale: O hebraico reúne conceitos relacionados, mas lexicalmente distintos, acerca do favor, do amor leal e da compaixão de Deus. A diferenciação preserva a textura poética e evita reduzir todos eles a um único conceito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo «ó Deus» e o imperativo «Sê» mantêm o tom de oração; a ordem poética e os três campos lexicais relacionados foram preservados sem rigidez artificial.
