id: PSA.51.10
reference: Psalms 51:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: pt
  text: Esconde o teu rosto dos meus pecados e apaga[a] todas as minhas iniquidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “elimina” ou “remove por completo”.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido como “iniquidades” também pode ter o sentido de “culpa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Esconde
  rationale: O imperativo hifil de סתר exprime o pedido para que Deus não contemple os pecados do salmista. “Esconde” preserva tanto a força imperativa quanto a metáfora concreta.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: פנים significa literalmente “rosto” e, neste contexto, representa de modo antropomórfico a atenção pessoal de Deus. A tradução mantém a imagem hebraica.
- source_word: מֵחֲטָאָי
  choice: dos meus pecados
  rationale: 'חטא designa pecados ou transgressões. A contração “dos” reproduz naturalmente em português a construção hebraica com a preposição מִן: esconder o rosto de algo.'
- source_word: וְכָל
  choice: e ... todas
  rationale: A conjunção com כָּל liga o segundo pedido ao primeiro e ressalta sua abrangência total.
- source_word: עֲוֹנֹתַי
  choice: minhas iniquidades
  rationale: עָוֹן pode indicar iniquidade e também culpa. “Iniquidades” mantém uma distinção lexical em relação a חטא, traduzido como “pecados”, sem impor uma distinção doutrinária técnica.
- source_word: מְחֵה
  choice: apaga
  rationale: O imperativo de מחה comunica a ideia de apagar, eliminar ou remover por completo. “Apaga” é claro e natural em português e conserva a imagem de remoção de um registro ou mancha.
theological_decisions:
- issue: Preservação dos dois termos hebraicos relacionados ao pecado
  choice: Traduzir חטא por “pecados” e עָוֹן por “iniquidades”
  alternative: Traduzir ambos por “pecados”, ou traduzir עָוֹן por “culpa”
  rationale: O paralelismo hebraico emprega vocábulos diferentes. Preservar essa variação reflete a intensificação poética, enquanto a nota reconhece que עָוֹן também pode designar culpa.
translation_notes:
  register: Português moderno, claro e reverente, com uso de “tu” coerente com a linguagem direta da oração. A formulação conserva o paralelismo, os imperativos e a imagem concreta do rosto divino, sem tornar a frase artificial.
