  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: pt
  text: quando o profeta Natã veio até ele, depois que ele teve relações com Bate-Seba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entrou até Bate-Seba”, expressão idiomática que se refere a relações sexuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: quando ... veio
  rationale: A preposição בְּ com o infinitivo construto de בוא introduz uma oração temporal; esta formulação é natural em português e preserva a relação temporal.
- source_word: אֵלָיו
  choice: até ele
  rationale: Expressa de modo natural o movimento em direção à pessoa indicada pelo sufixo masculino singular.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Mantém o nome próprio em sua forma portuguesa consagrada e o título definido, com ordem natural em português.
- source_word: כַּאֲשֶׁר
  choice: depois que
  rationale: No contexto, indica a circunstância anterior que motivou a visita de Natã e comunica claramente a sequência dos acontecimentos.
- source_word: בָּא אֶל בַּת שָׁבַע
  choice: ele teve relações com Bate-Seba
  rationale: בוא אֶל, quando empregado a respeito de um homem e uma mulher neste contexto, é um eufemismo hebraico para relações sexuais. A tradução comunica o sentido sem reproduzir literalmente uma expressão pouco natural em português.
- source_word: בַּת שָׁבַע
  choice: Bate-Seba
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
