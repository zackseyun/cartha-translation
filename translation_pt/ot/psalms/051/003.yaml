  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: pt
  text: Lava-me completamente da minha iniquidade[a][b] e purifica-me[c] do meu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lava-me abundantemente” ou “Lava-me repetidas vezes”; o intensificador hebraico pode indicar uma limpeza abundante ou intensiva.'
    reason: lexical_alternative
  - marker: b
    text: “Iniquidade” também pode ser traduzida por “culpa” ou “perversidade”; o termo hebraico pode abranger tanto o ato errado quanto a culpa decorrente dele.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “limpa-me do meu pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: completamente
  rationale: O infinitivo absoluto/adverbial de רבה intensifica o imperativo seguinte. “Completamente” comunica em português corrente a intensidade ou abundância da lavagem, sem tornar explícita uma repetição que o hebraico não exige.
- source_word: כַּבְּסֵנִי
  choice: lava-me
  rationale: כבס é o verbo usado especialmente para lavar roupas e evoca uma limpeza profunda por lavagem. “Lava-me” preserva a imagem e soa natural em português.
- source_word: מֵעֲוֺנִי
  choice: da minha iniquidade
  rationale: עָוֹן pode designar a perversidade, a culpa ou suas consequências. “Iniquidade” mantém o peso moral e conserva a distinção poética em relação a חַטָּאת.
- source_word: וּמֵחַטָּאתִי
  choice: e do meu pecado
  rationale: חַטָּאת, neste contexto penitencial, significa naturalmente “pecado”. A escolha mantém os dois termos paralelos relacionados, mas não idênticos.
- source_word: טַהֲרֵנִי
  choice: purifica-me
  rationale: טהר significa tornar limpo ou puro e pode reunir ressonâncias morais e rituais. “Purifica-me” expressa bem essa amplitude em português e evita repetir a imagem de lavar.
theological_decisions:
- issue: Tradução dos termos penitenciais paralelos עָוֹן e חַטָּאת
  choice: 'Manter termos distintos: “iniquidade” e “pecado”.'
  alternative: Traduzir עָוֹן como “culpa” ou “maldade”, ou nivelar ambos com termos mais genéricos.
  rationale: O paralelismo emprega palavras relacionadas, porém não idênticas. Preservar a diferença mantém a textura hebraica sem impor uma distinção doutrinária rígida entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal pós-verbal conserva o tom poético e solene sem recorrer a vocabulário arcaico. Os marcadores foram posicionados junto aos elementos a que se referem.
