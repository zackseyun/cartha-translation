  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: pt
  text: Faze-me ouvir alegria e júbilo; que exultem os ossos que esmagaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os ossos que quebraste».'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Faze-me ouvir
  rationale: O hifil de שׁמע com sufixo de primeira pessoa singular é causativo, literalmente «faz-me ouvir». A formulação preserva tanto a causalidade quanto o tom de súplica.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: alegria e júbilo
  rationale: Os dois substantivos próximos são vertidos por termos distintos para conservar o paralelismo poético sem repetição artificial.
- source_word: תָּגֵלְנָה
  choice: que exultem
  rationale: O imperfeito qal feminino plural pode ter força volitiva neste contexto de oração; «que exultem» expressa naturalmente o desejo.
- source_word: עֲצָמוֹת
  choice: os ossos
  rationale: O hebraico diz literalmente «ossos», sem sufixo possessivo. O artigo em português torna a frase natural, enquanto o contexto indica que são os ossos do salmista.
- source_word: דִּכִּיתָ
  choice: esmagaste
  rationale: A forma perfeita na segunda pessoa masculina singular descreve ação concluída atribuída diretamente a Deus. «Esmagaste» mantém a força da metáfora de דכה.
theological_decisions:
- issue: Atribuição do sofrimento a Deus
  choice: os ossos que esmagaste
  alternative: os ossos que foram esmagados
  rationale: O hebraico atribui diretamente a Deus a ação de esmagar. A tradução conserva essa tensão teológica, sem transformar a oração em construção passiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Faze-me» conserva com concisão a causalidade hebraica; «júbilo» e «exultem» mantêm o tom poético sem linguagem excessivamente arcaica.
