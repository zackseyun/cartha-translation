id: PSA.51.15
reference: Psalms 51:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: pt
  text: Livra-me da culpa de sangue[a], ó Deus, Deus da minha salvação, e a minha língua cantará com alegria a tua justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do derramamento de sangue”; em hebraico, literalmente, “de sangues”, expressão que muitas vezes indica culpa por sangue derramado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a tua retidão”. O termo hebraico pode incluir tanto retidão moral quanto justiça judicial e salvadora.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo de נצל com sufixo de primeira pessoa expressa um pedido direto de resgate; “Livra-me” é natural, digno e não especifica indevidamente o meio do livramento.
- source_word: מִדָּמִים
  choice: da culpa de sangue
  rationale: O plural דמים, literalmente “sangues”, frequentemente designa derramamento de sangue e a culpa decorrente dele. No contexto penitencial, “culpa de sangue” preserva melhor a ideia de responsabilidade por sangue derramado.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; “ó Deus” torna explícita a invocação sem alterar o sentido.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Deus da minha salvação
  rationale: Mantém a construção hebraica e o termo teológico amplo תְּשׁוּעָה, que pode abranger salvação e livramento.
- source_word: תְּרַנֵּן
  choice: cantará com alegria
  rationale: O verbo רנן indica expressão vocal jubilosa, que pode ser canto ou grito de alegria. A formulação comunica louvor intenso em português corrente.
- source_word: לְשׁוֹנִי
  choice: a minha língua
  rationale: Conserva a imagem poética hebraica da língua como instrumento do louvor.
- source_word: צִדְקָתֶךָ
  choice: a tua justiça
  rationale: צדקה reúne matizes de retidão e justiça, inclusive a ação justa e salvadora de Deus. “Justiça” é idiomático em português bíblico e deixa a alternativa “retidão” registrada em nota.
theological_decisions:
- issue: Sentido do plural דמים na confissão
  choice: culpa de sangue
  alternative: derramamento de sangue; atos sanguinários
  rationale: No contexto de arrependimento do salmo, a expressão aponta mais naturalmente para a culpa ligada ao sangue derramado, mas a nota preserva a possibilidade lexical de referência ao próprio derramamento de sangue.
- issue: Amplitude semântica de צִדְקָתֶךָ
  choice: tua justiça
  alternative: tua retidão; tua justiça salvadora
  rationale: O hebraico pode reunir dimensões moral, judicial e salvadora. O texto principal mantém o termo amplo “justiça”, sem restringi-lo a uma só dimensão, e a nota registra “retidão” como tradução possível.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem poética e a imagem da língua foram preservadas; “cantará com alegria” comunica o caráter jubiloso do verbo hebraico sem soar arcaico.
