  source_fidelity: O texto representa com fidelidade o hebraico. “Livra-me” traduz adequadamente o imperativo הַצִּילֵנִי; “culpa de sangue” comunica o sentido idiomático e penitencial de מִדָּמִים; e a construção “Deus da minha salvação” preserva o paralelismo e a construção do original. “A minha língua cantará com alegria” mantém a imagem explícita da língua e o caráter jubiloso de תְּרַנֵּן. “A tua justiça” é uma tradução semanticamente legítima de צִדְקָתֶךָ, cuja amplitude inclui justiça e retidão.
