  text: כִּ֤י לֹא תַחְפֹּ֣ץ זֶ֣בַח וְ/אֶתֵּ֑נָה ע֝וֹלָ֗ה לֹ֣א תִרְצֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: pt
  text: Pois não tens prazer em sacrifício[a]; do contrário, eu o ofereceria. Não te agradas de holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não desejas sacrifício; senão, eu o daria.” A conjunção e a ordem das orações em hebraico permitem esta tradução mais formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e preserva com naturalidade o encadeamento argumentativo do salmo.
- source_word: לֹא תַחְפֹּץ
  choice: não tens prazer em
  rationale: Expressa a nuance afetiva de חפץ, que aqui indica agrado ou deleite, e não apenas vontade.
- source_word: זֶבַח
  choice: sacrifício
  rationale: É o termo cultual amplo e corrente em português, suficientemente preciso neste paralelismo poético.
- source_word: וְאֶתֵּנָה
  choice: do contrário, eu o ofereceria
  rationale: Entende a conjunção em sentido resultativo ou condicional segundo o contexto. O pronome retoma explicitamente “sacrifício”, e “ofereceria” comunica de modo natural a entrega cultual.
- source_word: עוֹלָה
  choice: holocausto
  rationale: Termo tradicional e preciso para a oferta inteiramente queimada, ainda amplamente reconhecível no registro bíblico português.
- source_word: לֹא תִרְצֶה
  choice: Não te agradas de
  rationale: Comunica a ideia de não olhar favoravelmente ou não sentir agrado pela oferta, mantendo pequena distinção lexical em relação à primeira oração.
theological_decisions:
- issue: Alcance da afirmação sobre os sacrifícios
  choice: Manter a negação direta sem ampliá-la para uma rejeição universal de todo culto sacrificial.
  alternative: Interpretar o versículo como abolição ou condenação absoluta de todos os sacrifícios.
  rationale: No contexto penitencial do salmo, o texto ressalta a insuficiência do rito por si só. A tradução preserva a tensão com outras passagens bíblicas que tratam os sacrifícios favoravelmente, sem inserir uma explicação doutrinária no versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Holocausto” preserva a terminologia cultual bíblica; “do contrário, eu o ofereceria” torna explícita, sem eliminar a alternativa em nota, a relação implícita entre as orações.
