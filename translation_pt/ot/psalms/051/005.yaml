base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: pt
  text: Contra ti — contra ti somente — pequei[a] e fiz o que é mau aos teus olhos, para que sejas reconhecido como justo ao falares e irrepreensível ao julgares.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contra ti somente pequei”. A formulação hebraica enfatiza Deus como a parte ofendida em última instância.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que sejas reconhecido como justo em tuas palavras e puro em teu julgamento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Contra ti — contra ti somente —
  rationale: Expressa naturalmente a pessoa ofendida e conserva a ênfase absoluta da repetição hebraica, sem atenuá-la com “acima de tudo”.
- source_word: חָטָאתִי
  choice: pequei
  rationale: O perfeito hebraico apresenta o ato confessado como realidade consumada; o pretérito perfeito é a forma mais natural em português.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: e fiz o que é mau aos teus olhos
  rationale: Mantém o adjetivo substantivado e a imagem hebraica da avaliação divina, em português claro e digno.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a relação deliberadamente tensa de propósito ou resultado, sem decidir entre essas nuances.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: sejas reconhecido como justo em tuas palavras
  rationale: Comunica a nuance forense de estar ou mostrar-se no direito, evitando que “justificado” sugira que Deus necessite ser moralmente corrigido.
- source_word: תִּזְכֶּה בְּשָׁפְטֶךָ
  choice: irrepreensível quando julgares
  rationale: “Irrepreensível” expressa pureza e vindicação; a oração temporal traduz de modo natural a construção בְּ mais infinitivo.
theological_decisions:
- issue: A afirmação “contra ti somente” apesar das vítimas humanas do pecado
  choice: Conservar a formulação absoluta dirigida a Deus
  alternative: Contra ti acima de tudo
  rationale: O hebraico enfatiza Deus como a parte finalmente ofendida. A tradução mantém essa tensão, sem inserir uma explicação no texto.
- issue: A relação introduzida por לְמַעַן entre a confissão e a justiça de Deus
  choice: para que
  alternative: de modo que
  rationale: A expressão hebraica admite propósito ou resultado. “Para que” mantém a conexão forte e a tensão teológica sem acrescentar uma solução interpretativa.
- issue: A nuance forense dos verbos צדק e זכה
  choice: reconhecido como justo ... irrepreensível
  alternative: justificado ... puro
  rationale: A escolha preserva o paralelismo judicial e moral, mas evita possíveis conotações doutrinárias modernas que ultrapassem o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões reproduzem a ênfase da repetição hebraica; “tu” mantém o tratamento direto e solene sem linguagem arcaica. Todos os marcadores de nota constam no texto principal.
