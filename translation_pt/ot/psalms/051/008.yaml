  text: תְּחַטְּאֵ֣/נִי בְ/אֵז֣וֹב וְ/אֶטְהָ֑ר תְּ֝כַבְּסֵ֗/נִי וּ/מִ/שֶּׁ֥לֶג אַלְבִּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: pt
  text: Purifica-me com hissopo[a], e ficarei puro; lava-me, e ficarei mais branco que a neve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Limpa-me com hissopo”. O verbo hebraico tem sentido purgativo, ligado à remoção do pecado e à purificação ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Purifica-me
  rationale: O piel de חטא tem aqui sentido purgativo ou causativo ligado à remoção do pecado e à purificação ritual. “Purifica-me” é natural em português e conserva essa dimensão sem recorrer a um literalismo obscuro.
- source_word: בְאֵזוֹב
  choice: com hissopo
  rationale: A preposição בְּ indica o meio ou instrumento, e o hissopo evoca os ritos israelitas de purificação. “Com hissopo” é direto e idiomático.
- source_word: וְאֶטְהָר
  choice: e ficarei puro
  rationale: טהר denota tornar-se limpo ou puro, tanto em contexto ritual quanto moral. “Ficarei puro” combina naturalmente com “purifica-me” e mantém o resultado futuro expresso pelo hebraico.
- source_word: תְּכַבְּסֵנִי
  choice: lava-me
  rationale: כבס designa propriamente a lavagem de roupas, mas aqui é aplicado poeticamente ao salmista. “Lava-me” preserva a metáfora de maneira clara e digna.
- source_word: וּמִשֶּׁלֶג
  choice: que a neve
  rationale: A preposição מִן tem valor comparativo neste contexto. Com o comparativo português “mais branco”, a forma idiomática é “que a neve”.
- source_word: אַלְבִּין
  choice: ficarei mais branco
  rationale: O hifil de לבן expressa ficar ou tornar-se branco; em conjunto com מִן, forma a comparação “mais branco que a neve”. “Ficarei” preserva a voz não explicitamente passiva e o resultado esperado.
theological_decisions:
- issue: Imagem de purificação ritual aplicada ao pecado moral
  choice: Manter explicitamente “Purifica-me com hissopo”
  alternative: “Limpa-me com hissopo” ou uma formulação genérica como “perdoa-me”
  rationale: O verso emprega a linguagem dos ritos de purificação de Israel para exprimir a remoção do pecado. Conservar “hissopo” e “purifica-me” preserva essa ligação sem acrescentar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Mantém-se o paralelismo poético entre purificar/puro e lavar/branco, bem como a imagem ritual específica do hissopo.
