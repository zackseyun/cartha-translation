base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: pt
  text: Não me lances para longe da tua presença e não tires de mim o teu Espírito Santo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu espírito santo”; mais literalmente, “o espírito da tua santidade”.
    reason: Alternativa lexical e preservação da ambiguidade da construção hebraica.
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: me lances para longe
  rationale: O hifil de שלך expressa fazer alguém ser lançado ou afastado. “Lances para longe” conserva a força da imagem hebraica e soa natural numa súplica em português.
- source_word: מִלְּפָנֶיךָ
  choice: da tua presença
  rationale: Embora פָּנִים signifique literalmente “face”, a expressão idiomática indica estar diante de Deus; “da tua presença” comunica isso com clareza e naturalidade.
- source_word: רוּחַ קָדְשְׁךָ
  choice: o teu Espírito Santo
  rationale: A construção pode significar literalmente “o espírito da tua santidade” ou “o teu espírito santo”. A formulação escolhida identifica o Espírito como pertencente a Deus, enquanto a nota preserva as alternativas lexicais e a ambiguidade de capitalização.
- source_word: תִּקַּח
  choice: tires
  rationale: לקח tem o sentido básico de “tomar” ou “tirar”. “Não tires de mim” mantém a formulação direta da súplica sem acrescentar a interpretação de uma retirada gradual.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Equivalente direto e idiomático da preposição hebraica neste contexto.
theological_decisions:
- issue: Capitalização e interpretação de רוּחַ קָדְשְׁךָ
  choice: o teu Espírito Santo
  alternative: o teu espírito santo; mais literalmente, o espírito da tua santidade
  rationale: No contexto, trata-se do próprio Espírito de Deus. A capitalização segue o uso português estabelecido, mas a nota registra a forma mais literal e evita ocultar a amplitude possível da construção hebraica.
translation_notes:
  register: Português moderno, claro e reverente, de leitura natural no Brasil e compreensível internacionalmente. A segunda pessoa singular preserva o caráter pessoal da oração. O marcador foi colocado junto à expressão a que a nota se refere.
