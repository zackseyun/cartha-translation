  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: pt
  text: Cria em mim um coração puro, ó Deus, e renova dentro de mim um espírito firme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito constante”; o termo hebraico também pode transmitir a ideia de algo reto, estabelecido ou estável.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: coração puro
  rationale: “Coração” preserva a imagem hebraica do centro da vontade, dos pensamentos e dos afetos. “Puro” expressa com naturalidade a pureza moral e ritual de טָהוֹר no contexto do salmo; “limpo” também seria possível, mas é menos idiomático nesta combinação em português.
- source_word: בְּרָא לִי
  choice: cria em mim
  rationale: Embora לִי tenha literalmente o sentido de “para mim”, a formulação idiomática em português é “cria em mim”. O verbo “criar” preserva a força de ברא, frequentemente associado à ação criadora de Deus.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A partícula vocativa “ó” deixa clara a invocação direta e mantém o tom poético da oração.
- source_word: רוּחַ נָכוֹן
  choice: espírito firme
  rationale: “Espírito” conserva a amplitude de רוּחַ e o paralelismo com “coração”. “Firme” comunica o sentido de algo estabelecido, estável ou constante em נָכוֹן, sem reduzi-lo apenas à correção moral.
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: renova dentro de mim
  rationale: “Renova” expressa restauração e revitalização interior. “Dentro de mim” traduz de modo claro e natural a localização interna indicada por בְּקִרְבִּי.
theological_decisions:
- issue: Sentido de נָכוֹן em רוּחַ נָכוֹן
  choice: espírito firme
  alternative: espírito reto; espírito constante
  rationale: O hebraico aponta principalmente para firmeza, estabilidade ou constância. “Firme” preserva essa ênfase sem excluir a dimensão moral presente no contexto de arrependimento.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A ordem e o paralelismo do hebraico foram preservados sem produzir uma formulação artificial.
