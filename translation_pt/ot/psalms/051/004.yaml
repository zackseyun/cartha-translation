  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: pt
  text: Pois eu conheço as minhas transgressões, e o meu pecado está sempre diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da súplica no contexto. “Pois” preserva essa função explicativa e se encaixa naturalmente no fluxo confessional do salmo.
- source_word: פְשָׁעַי
  choice: as minhas transgressões
  rationale: O termo designa transgressões com a ideia de rebeldia contra Deus. “Transgressões” mantém o peso moral e distingue este vocábulo do termo traduzido por “pecado” na segunda oração.
- source_word: אֲנִי אֵדָע
  choice: eu conheço
  rationale: O pronome explícito dá ênfase ao sujeito, e o verbo expressa conhecimento pessoal e consciência da culpa. “Eu conheço” reproduz ambos sem acrescentar a nuance mais específica de confissão pública presente em “reconheço”.
- source_word: וְחַטָּאתִי
  choice: e o meu pecado
  rationale: No contexto confessional, חַטָּאת significa “pecado”, não “oferta pelo pecado”. O singular foi mantido, podendo enfocar a culpa como realidade presente ou o pecado específico em vista.
- source_word: נֶגְדִּי
  choice: diante de mim
  rationale: Preserva a imagem de algo colocado na presença ou perante os olhos do salmista, em português natural e digno.
- source_word: תָמִיד
  choice: sempre
  rationale: Comunica a persistência contínua do pecado na consciência do salmista de modo claro e corrente.
theological_decisions:
- issue: Relação entre “transgressões” e “pecado”
  choice: Manter os dois termos distintos
  alternative: Uniformizar ambos como “pecados”
  rationale: O hebraico emprega vocábulos relacionados, mas distintos. Preservar “transgressões” e “pecado” mantém a textura poética e a amplitude moral da confissão.
- issue: Sentido de אֵדָע
  choice: “conheço”, como consciência pessoal da culpa
  alternative: “reconheço”, com possível nuance de admissão ou confissão
  rationale: O verbo afirma diretamente conhecimento ou consciência. A tradução evita tornar explícita uma nuance de reconhecimento confessional que o contexto pode sugerir, mas que não precisa ser incorporada ao sentido lexical do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o paralelismo hebraico e evita tanto arcaísmos quanto paráfrase excessiva.
