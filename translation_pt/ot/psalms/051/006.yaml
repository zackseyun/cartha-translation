source:
  edition: WLC
  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: pt
  text: De fato[a], em iniquidade fui dado à luz[b][c], e em pecado minha mãe me concebeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eis que” ou “Certamente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nasci”.
    reason: lexical_alternative
  - marker: c
    text: Este versículo é frequentemente entendido como confissão de pecaminosidade desde a concepção ou como hipérbole poética de arrependimento; o próprio hebraico não resolve plenamente a questão.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: De fato
  rationale: A partícula introduz uma afirmação enfática. “De fato” comunica essa ênfase com naturalidade em português; a nota preserva alternativas mais solenes ou asseverativas.
- source_word: בְּעָוֹן
  choice: em iniquidade
  rationale: Mantém a preposição hebraica e o peso moral de עָוֹן sem decidir se a ênfase recai sobre culpa, perversidade ou condição pecaminosa.
- source_word: חוֹלָלְתִּי
  choice: fui dado à luz
  rationale: O verbo, nesta forma e neste contexto, evoca o nascimento. A formulação é natural e mais específica que “nasci”, sem recorrer a expressões arcaicas.
- source_word: וּבְחֵטְא
  choice: e em pecado
  rationale: Preserva a preposição, o sentido comum de חֵטְא e o paralelismo poético com “em iniquidade”.
- source_word: יֶחֱמַתְנִי
  choice: me concebeu
  rationale: Neste contexto, o verbo é melhor entendido como referência à concepção, em paralelo com a imagem do nascimento no primeiro membro.
- source_word: אִמִּי
  choice: minha mãe
  rationale: Tradução direta do substantivo com sufixo possessivo.
theological_decisions:
- issue: Se o versículo ensina o pecado pessoal da mãe, a pecaminosidade do salmista desde a concepção ou emprega hipérbole penitencial
  choice: Traduzir diretamente a relação poética entre iniquidade, nascimento, pecado e concepção, sem definir o mecanismo ou um sistema doutrinário.
  alternative: Entender a frase como referência ao ato pecaminoso da mãe, como declaração da pecaminosidade inata desde a concepção ou como hipérbole penitencial.
  rationale: O hebraico relaciona a existência do salmista desde a concepção e o nascimento com עָוֹן e חֵטְא, mas não determina explicitamente qual dessas explicações teológicas deve prevalecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De fato” evita uma abertura excessivamente arcaica, enquanto “iniquidade” conserva a gravidade e a concisão da linguagem poética. O paralelismo do hebraico foi mantido.
