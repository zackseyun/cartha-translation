  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: pt
  text: E agora, Senhor, o que espero?[a] Minha esperança está em ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E agora, Senhor, o que tenho esperado? Minha esperança está em ti.” O verbo hebraico קוה pode significar tanto esperar quanto ter esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o marcador temporal, introduzindo de modo natural a conclusão presente do salmista.
- source_word: מַה
  choice: o que
  rationale: Mantém o pronome interrogativo na pergunta retórica sem explicitar uma finalidade que o hebraico deixa implícita.
- source_word: קִוִּיתִי
  choice: espero
  rationale: O verbo קוה abrange esperar e ter esperança. O presente em português combina naturalmente com “agora” e mantém a orientação atual do salmista; a nota registra a forma mais estritamente aspectual e a amplitude lexical.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino reverencial de maneira tradicional, clara e não denominacional.
- source_word: תּוֹחַלְתִּי
  choice: Minha esperança
  rationale: “Esperança” expressa de forma natural o sentido central de expectativa confiante do substantivo.
- source_word: לְךָ הִיא
  choice: está em ti
  rationale: A expressão portuguesa idiomática comunica que Deus é o objeto e fundamento da esperança, enquanto o pronome hebraico retoma enfaticamente o substantivo feminino.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: No uso hebraico, אֲדֹנָי funciona como o título reverencial divino estabelecido. “Senhor” traduz o título sem transformar sua forma histórica em uma ênfase possessiva não necessária no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “ti” coerente com a linguagem bíblica corrente. A pergunta conserva a concisão e a ambiguidade semântica do hebraico entre espera e esperança.
