  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: pt
  text: Livra-me de todas as minhas transgressões; não faças de mim alvo do desprezo do insensato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não faças de mim a vergonha do insensato”. O hebraico pode indicar tanto que a pessoa se torna alvo do desprezo de um insensato quanto que se torna uma vergonha associada ao insensato ou à insensatez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל
  choice: de todas
  rationale: A combinação de מִן com כָּל expressa libertação da totalidade das transgressões do salmista; “de todas” é natural em português.
- source_word: פְּשָׁעַי
  choice: minhas transgressões
  rationale: פֶּשַׁע designa transgressão ou rebelião contra a autoridade legítima. “Transgressões” preserva a força moral e teológica sem explicitação excessiva.
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo hifil de נצל significa resgatar ou livrar. “Livra-me” é claro, conciso e apropriado ao registro de oração do salmo.
- source_word: חֶרְפַּת
  choice: alvo do desprezo
  rationale: חֶרְפָּה pode indicar afronta, desprezo, vergonha ou desonra pública. No contexto da leitura principal, “alvo do desprezo” comunica naturalmente em português que o salmista teme tornar-se objeto da afronta de outro.
- source_word: נָבָל
  choice: o insensato
  rationale: נָבָל descreve alguém moral e espiritualmente insensível, não apenas alguém com pouca inteligência. “Insensato” preserva essa nuance melhor do que “tolo” em muitos contextos contemporâneos.
- source_word: אַל תְּשִׂימֵנִי
  choice: não faças de mim
  rationale: שׂים com objeto pessoal pode significar pôr alguém em certa condição ou fazê-lo tornar-se algo. “Não faças de mim” é a formulação portuguesa mais natural.
theological_decisions:
- issue: Sentido da petição sobre a vergonha diante do insensato
  choice: O salmista pede a Deus que não permita que ele se torne alvo do desprezo de uma pessoa moralmente insensata.
  alternative: O salmista pede que não se torne uma vergonha associada ao insensato ou à insensatez.
  rationale: A construção חֶרְפַּת נָבָל admite mais de uma relação entre os substantivos. A redação principal segue a leitura contextual de desprezo dirigido pelo insensato, enquanto a nota preserva a possibilidade de vergonha ou desonra associada a ele, sem identificar dogmaticamente o salmista como insensato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção tradicional de oração (“Livra-me”) e vocabulário moral claro. A nota mantém a ambiguidade genuína da expressão hebraica.
