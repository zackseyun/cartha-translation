    issue: «até diante do bem» para מִטּוֹב
    rationale: A locução portuguesa normalmente significa «na presença do bem», enquanto o מן hebraico marca uma relação de afastamento, retenção ou restrição. A redação atual obscurece a ambiguidade lexical em vez de preservá-la.
  revised_text: Fiquei mudo, em silêncio; calei-me até mesmo quanto ao bem[a], e minha dor se agravou.
  revised_footnotes:
