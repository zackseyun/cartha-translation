  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: pt
  text: Fiquei mudo, em silêncio; calei-me até mesmo quanto ao bem[a], e minha dor se agravou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “calei-me até de falar o que era bom”; também pode significar: “afastei-me do que é bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Fiquei mudo
  rationale: O nifal na primeira pessoa pode indicar tornar-se mudo ou permanecer sem falar. A formulação preserva a autodescrição sem decidir se o silêncio foi voluntário ou imposto.
- source_word: דּוּמִיָּה
  choice: em silêncio
  rationale: O substantivo denota silêncio ou quietude; a expressão adverbial é natural em português e mantém a intensificação do paralelismo.
- source_word: הֶחֱשֵׁיתִי
  choice: calei-me
  rationale: O hifil de חשׁה exprime guardar silêncio. “Calei-me” distingue discretamente esta ação de “fiquei mudo” e conserva o paralelismo.
- source_word: מִטּוֹב
  choice: até diante do bem
  rationale: 'A expressão hebraica é compacta e ambígua. Esta tradução é legível sem explicitar “falar”, e a nota preserva as principais possibilidades: silêncio até quanto ao que é bom ou afastamento daquilo que é bom.'
- source_word: וּכְאֵבִי
  choice: e minha dor
  rationale: כְּאֵב pode designar dor física ou emocional. “Dor” mantém essa amplitude.
- source_word: נֶעְכָּר
  choice: se agravou
  rationale: O nifal de עכר comunica perturbação ou intensificação. No contexto, “se agravou” expressa naturalmente o aumento da dor durante o silêncio.
theological_decisions:
- issue: Sentido de מִטּוֹב
  choice: até diante do bem
  alternative: até de falar o que era bom; afastei-me do que é bom
  rationale: O texto não especifica se “bem” se refere a boas palavras, ao que é benéfico em geral ou a outra nuance. A tradução principal evita impor uma interpretação, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo conciso. “Fiquei mudo” e “calei-me” reproduzem a repetição sem soar excessivamente redundantes. A formulação de מִטּוֹב permanece deliberadamente aberta, com esclarecimento em nota.
