base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: pt
  text: 'Eu disse: “Guardarei os meus caminhos, para não pecar com a minha língua; porei uma mordaça à minha boca enquanto o perverso estiver diante de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: Traduz diretamente o qal perfeito na primeira pessoa e introduz uma resolução previamente formulada, sem explicitar além do hebraico a ideia de ‘resolvi’.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: Vigiarei os meus caminhos
  rationale: O verbo expressa determinação cuidadosa, e ‘caminhos’ preserva a imagem hebraica referente à conduta.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: para não pecar com a minha língua
  rationale: Expressa naturalmente em português a prevenção indicada por מן com o infinitivo, mantendo ‘língua’ como instrumento do possível pecado.
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: porei uma mordaça em minha boca
  rationale: Reproduz a imagem concreta de contenção de מַחְסוֹם. ‘Porei’ torna idiomática em português a construção com שׁמר, cujo sentido contextual é manter a boca refreada.
- source_word: בְּעוֹד
  choice: enquanto
  rationale: Indica simultaneidade temporal de modo claro e natural.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Adjetivo masculino singular substantivado; ‘o perverso’ conserva número e gênero gramatical sem acrescentar o substantivo ‘homem’.
- source_word: לְנֶגְדִּי
  choice: estiver diante de mim
  rationale: Traduz a ideia de presença diante do salmista; o verbo suprido é necessário para fluência em português.
theological_decisions:
- issue: Forma de traduzir o masculino singular רָשָׁע
  choice: o perverso
  alternative: uma pessoa perversa; o homem perverso
  rationale: ‘O perverso’ preserva a forma masculina singular substantivada do hebraico e evita tanto neutralizá-la quanto acrescentar ‘homem’, palavra não expressa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se as imagens hebraicas de ‘caminhos’, ‘língua’ e ‘mordaça’. Não se incluiu a nota [a] da camada inglesa porque ela parece estar ligada por engano a ‘Eu disse’; a ambiguidade lexical pertinente foi resolvida no texto como ‘o perverso’, sem necessidade de nota para publicação.
