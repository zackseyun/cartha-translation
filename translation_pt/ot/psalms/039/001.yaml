review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura da resolução do salmista, a prevenção de pecar por meio da língua, a imagem de contenção e a referência ao perverso singular diante dele. Contudo, «Vigiarei» é menos preciso para שׁמר neste contexto do que «Guardarei», e «porei uma mordaça em minha boca» sugere localização física pouco natural para uma mordaça; em português, ela é posta «à» ou «sobre» a boca.
  naturalness: O registro é moderno e digno. «Guardarei os meus caminhos» é mais idiomático e mais próximo do sentido de vigiar/proteger a própria conduta. «Porei uma mordaça à minha boca» conserva a metáfora concreta e soa naturalmente em português bíblico contemporâneo.
  terminology: «O perverso» traduz de modo apropriado o adjetivo substantivado masculino singular רָשָׁע, sem acrescentar «homem» nem neutralizar a forma. «Língua», «caminhos» e «mordaça» mantêm imagens e termos relevantes do hebraico.
  issues:
  - severity: low
    issue: «Vigiarei os meus caminhos»
    rationale: Embora possível, «vigiar» em português costuma focalizar observar ou fazer guarda. «Guardar os meus caminhos» representa melhor שׁמר como cautelosa preservação da própria conduta e mantém o paralelismo verbal do versículo.
  - severity: medium
    issue: «Porei uma mordaça em minha boca»
    rationale: Uma mordaça é posta à ou sobre a boca, não normalmente «em» a boca. A formulação atual é menos natural e pode alterar a imagem material de מַחְסוֹם.
  revised_text: 'Eu disse: “Guardarei os meus caminhos, para não pecar com a minha língua; porei uma mordaça à minha boca enquanto o perverso estiver diante de mim.”'
