base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: pt
  text: Desvia de mim o teu olhar, para que eu volte a sorrir[a] antes que eu vá e já não exista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que eu recupere as forças” ou “para que meu rosto volte a brilhar”. O verbo hebraico pode transmitir a ideia de renovação do ânimo, do brilho ou das forças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: Desvia de mim o teu olhar
  rationale: O imperativo pede que Deus retire do salmista seu olhar aflitivo. A formulação explicita o objeto implícito do verbo e soa natural em português.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Expressa diretamente a separação indicada pela preposição com o sufixo de primeira pessoa.
- source_word: וְאַבְלִיגָה
  choice: para que eu volte a sorrir
  rationale: O verbo pode indicar recuperar o brilho, o ânimo ou as forças. Esta opção comunica de modo natural a renovação do semblante, sem ocultar a amplitude lexical, registrada na nota.
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: Equivalente temporal claro e corrente em português.
- source_word: אֵלֵךְ
  choice: eu vá
  rationale: Preserva a metáfora discreta do hebraico para a partida desta vida, sem tornar explícita a morte.
- source_word: וְאֵינֶנִּי
  choice: e já não exista
  rationale: Expressa a ausência definitiva indicada pela construção hebraica e mantém o paralelismo solene com a partida.
theological_decisions:
- issue: Se a referência à morte em אֵלֵךְ וְאֵינֶנִּי deve ser explicitada
  choice: 'Manter a expressão indireta: “antes que eu vá e já não exista”'
  alternative: “antes que eu morra e desapareça”
  rationale: Embora o contexto aponte claramente para a morte, o hebraico fala dela por meio de uma partida e da ausência subsequente. A tradução conserva essa contenção poética.
translation_notes:
  register: Português moderno, digno e acessível, com fluência brasileira e compreensão internacional. A colocação “o teu olhar” evita uma leitura ambígua de “desvia o olhar de mim”, e a nota conserva a amplitude semântica de וְאַבְלִיגָה.
