  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: pt
  text: Com repreensões por causa da iniquidade, disciplinas o homem e, como a traça, fazes definhar o que lhe é precioso[a]. Certamente, todo ser humano é apenas vapor[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “fazes suas coisas preciosas definhar como a traça”. O hebraico de “o que lhe é precioso” também pode indicar, mais especificamente, sua beleza ou, de modo mais amplo, seus bens estimados.'
    reason: lexical_alternative
  - marker: b
    text: “Vapor” traduz o hebraico hével, termo que evoca a transitoriedade ou a falta de substância de um sopro; tradicionalmente, “vaidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: com repreensões
  rationale: Preserva o valor instrumental da preposição e o sentido de censura corretiva do plural תוֹכָחוֹת, em linguagem portuguesa natural.
- source_word: עַל עָוֺן
  choice: por causa da iniquidade
  rationale: Explicita naturalmente a relação causal; 'iniquidade' mantém o peso moral de עָוֺן sem restringi-lo apenas ao ato ou à culpa.
- source_word: יִסַּרְתָּ
  choice: disciplinas
  rationale: Expressa a correção mediante disciplina indicada por יסר, sem o arcaísmo de 'castigas' ou 'açoitas' e sem eliminar sua severidade.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o substantivo masculino singular representativo do hebraico; no contexto, refere-se ao ser humano individual em sentido genérico.
- source_word: וַתֶּמֶס
  choice: fazes consumir
  rationale: O hifil de מסס indica causar dissolução ou definhamento. A formulação conserva a ação divina e combina naturalmente com a imagem da traça.
- source_word: כָּעָשׁ
  choice: como a traça
  rationale: Preserva a comparação concreta com o inseto que corrói gradualmente aquilo que se valoriza.
- source_word: חֲמוּדוֹ
  choice: o que lhe é precioso
  rationale: Conserva a amplitude de חֲמוּד, que pode indicar beleza, encanto, bem desejável ou coisas estimadas, sem decidir indevidamente entre essas possibilidades.
- source_word: אַךְ
  choice: certamente
  rationale: Comunica a ênfase conclusiva da partícula neste contexto solene.
- source_word: הֶבֶל
  choice: vapor
  rationale: Preserva a imagem concreta de algo fugaz e insubstancial, em vez de reduzi-la ao sentido abstrato tradicional de 'vaidade'.
- source_word: כָּל אָדָם
  choice: todo ser humano
  rationale: אָדָם designa aqui a humanidade de modo genérico. Em português atual, 'todo ser humano' comunica com precisão esse alcance universal, enquanto 'o homem' na oração anterior mantém o singular masculino de אִישׁ.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo litúrgico ou musical porque sua função exata permanece incerta.
theological_decisions:
- issue: Antropologia genérica nos termos אִישׁ e אָדָם
  choice: Traduzir אִישׁ por 'o homem' e כָּל אָדָם por 'todo ser humano'
  alternative: 'Empregar formas masculinas nos dois casos: ''um homem'' e ''todo homem'''
  rationale: A distinção em português reflete os diferentes lexemas hebraicos e evita que 'todo homem' seja entendido apenas como todo indivíduo do sexo masculino. O caráter representativo de אִישׁ permanece visível em 'o homem', ao passo que o alcance universal de אָדָם fica explícito.
- issue: Agente e objeto na imagem da traça
  choice: Deus faz consumir aquilo que é precioso ao homem, como a traça o corrói
  alternative: Entender a construção como 'fazes suas coisas preciosas definhar como a traça' ou associar mais diretamente o próprio homem àquilo que definha
  rationale: A sintaxe favorece Deus como sujeito continuado de וַתֶּמֶס e חֲמוּדוֹ como objeto. A tradução conserva, contudo, a concisão e a leve abertura poética da comparação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o paralelismo poético e a segunda pessoa singular dirigida a Deus. 'Selá' segue a transliteração bíblica corrente. Todos os marcadores de nota aparecem no texto.
