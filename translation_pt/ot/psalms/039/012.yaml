source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: pt
  text: 'Ouve a minha oração, ó Yahweh,

    e dá ouvidos ao meu clamor;

    não fiques surdo às minhas lágrimas.[a]

    Pois sou forasteiro junto de ti,

    residente temporário como todos os meus antepassados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fiques em silêncio diante das minhas lágrimas”. O verbo hebraico pode indicar tanto estar surdo quanto permanecer calado.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “como todos os meus pais”, isto é, os antepassados.'
    reason: lexical_clarification
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Ouve
  rationale: Imperativo direto de שׁמע dirigido a Yahweh; “ouve” é natural na linguagem de oração e mantém a petição concisa.
- source_word: תְפִלָּתִי
  choice: a minha oração
  rationale: Equivalente direto e corrente do substantivo hebraico para oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְשַׁוְעָתִי
  choice: ao meu clamor
  rationale: שַׁוְעָה designa um grito ou clamor, muitas vezes por socorro; “clamor” preserva a intensidade sem explicitação excessiva.
- source_word: הַאֲזִינָה
  choice: dá ouvidos
  rationale: O imperativo de אזן forma paralelismo poético com “ouve” e é uma expressão portuguesa digna e compreensível.
- source_word: אֶל דִּמְעָתִי
  choice: às minhas lágrimas
  rationale: O singular hebraico tem valor coletivo; o plural é idiomático em português e preserva a imagem concreta.
- source_word: אַל תֶּחֱרַשׁ
  choice: não fiques surdo
  rationale: חרשׁ pode indicar surdez ou silêncio. O contexto imediato insiste em ouvir e dar ouvidos, favorecendo aqui a imagem auditiva, sem ocultar a alternativa na nota.
- source_word: כִּי
  choice: Pois
  rationale: Introduz o fundamento da súplica e se ajusta ao registro poético.
- source_word: גֵר
  choice: forasteiro
  rationale: Expressa alguém que vive fora de sua condição ou terra nativa, sem os direitos plenos de um natural do lugar; evita o arcaísmo de “peregrino” como simples viajante.
- source_word: עִמָּךְ
  choice: junto de ti
  rationale: Mantém o sentido básico de presença ou convivência expresso por עם, sem acrescentar uma interpretação teológica.
- source_word: תּוֹשָׁב
  choice: residente temporário
  rationale: Distingue o termo de גֵר e comunica a condição de quem reside sem posse ou pertencimento pleno.
- source_word: כְּכָל אֲבוֹתָי
  choice: como todos os meus antepassados
  rationale: Transmite o sentido ancestral de אָבוֹת no contexto e evita que “meus pais” seja entendido em português moderno apenas como pai e mãe; a forma literal é registrada em nota.
theological_decisions:
- issue: Relação entre גֵר e תּוֹשָׁב
  choice: 'Manter dois termos distintos: “forasteiro” e “residente temporário”.'
  alternative: Fundir as expressões como sinônimos, por exemplo, “estrangeiro e peregrino”.
  rationale: A dupla hebraica descreve uma condição social de não pertencimento e residência sem posse plena. Preservar a distinção mantém a tensão entre estar presente e não ser proprietário.
- issue: Sentido de אַל תֶּחֱרַשׁ diante das lágrimas
  choice: “não fiques surdo”, em continuidade com os pedidos para ouvir.
  alternative: “não fiques em silêncio”.
  rationale: O verbo admite ambos os sentidos. A sequência “ouve” e “dá ouvidos” sustenta a leitura auditiva, enquanto a nota preserva a ambiguidade real.
- issue: Sentido de אֲבוֹתָי
  choice: “meus antepassados”.
  alternative: “meus pais”.
  rationale: No contexto, o plural se refere às gerações ancestrais, não somente aos genitores. A tradução comunica esse referente com clareza, e a nota conserva a forma literal masculina.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome próprio divino. O paralelismo foi mantido em linhas curtas; termos sociais distintos traduzem a dupla hebraica sem linguagem jurídica excessivamente técnica.
