base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: pt
  text: Faz-me saber, Yahweh, qual é o meu fim e qual é a medida dos meus dias, para que eu saiba quão passageiro sou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quão frágil sou” ou “quão transitório sou”. A expressão hebraica é concisa e pode enfatizar tanto a fragilidade humana quanto a brevidade da vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: Faze-me conhecer
  rationale: O hifil imperativo de ידע com sufixo de primeira pessoa é causativo. A formulação preserva esse valor e mantém o paralelismo com אֵדְעָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: קִצִּי
  choice: o meu fim
  rationale: קֵץ designa o fim ou limite; neste lamento, refere-se naturalmente ao término da vida, sem acrescentar a ideia mais forte de destino.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: e qual é a medida dos meus dias
  rationale: Conserva a imagem concreta de מִדָּה, 'medida', e expressa de modo natural a pergunta sobre a extensão da vida.
- source_word: אֵדְעָה
  choice: para que eu saiba
  rationale: O coortativo pode indicar propósito ou resultado desejado após o imperativo; esta construção explicita essa relação sem alterar o sentido.
- source_word: מֶה חָדֵל אָנִי
  choice: como sou passageiro
  rationale: A expressão hebraica é concisa e difícil. No contexto da brevidade dos dias, 'passageiro' comunica transitoriedade, preservando em nota a possibilidade de ênfase na fragilidade.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de חָדֵל aplicado ao salmista
  choice: passageiro
  alternative: frágil; transitório
  rationale: O contexto enfatiza a curta duração da vida, mas o termo também pode salientar a fragilidade humana; a nota mantém essa ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa, preservando a imagem da “medida” e a relação de propósito do hebraico.
