  text: 'Meu coração se aqueceu dentro de mim; enquanto eu meditava, o fogo ardia[a]; então falei com a minha língua:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um fogo ardia” ou “o fogo se acendeu”. A imagem hebraica intensifica o calor interior com a figura de um fogo que arde.
