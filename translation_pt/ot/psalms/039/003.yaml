lexical_decisions:
- source_word: חַם לִבִּי בְּקִרְבִּי
  choice: Meu coração ardia dentro de mim
  rationale: Preserva a imagem hebraica do coração como centro da vida interior e expressa de modo natural o calor crescente, sem confundi-lo inteiramente com o fogo da oração seguinte.
- source_word: בַּהֲגִיגִי
  choice: enquanto eu meditava
  rationale: הֲגִיג pode indicar reflexão interior, meditação ou murmúrio; a formulação temporal é natural no contexto e mantém o sentido reflexivo.
- source_word: תִבְעַר אֵשׁ
  choice: o fogo se acendeu
  rationale: Reproduz a intensificação poética do calor interior para o fogo ativo. O artigo definido liga naturalmente o fogo ao calor já mencionado, embora o hebraico também permita entender “um fogo”.
- source_word: דִּבַּרְתִּי בִלְשׁוֹנִי
  choice: Então falei com a minha língua
  rationale: Mantém a imagem corporal explícita de לָשׁוֹן e a progressão do processo interior para a fala exterior; “então” explicita a sequência sugerida pelo verso.
