id: PSA.39.6
reference: Psalms 39:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: pt
  text: De fato, o homem anda como uma sombra[a]; de fato, em vão se agitam[b]. Ele acumula bens[c] e não sabe quem os recolherá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma imagem”, “como mera aparência” ou “como um fantasma”. A palavra hebraica significa literalmente “imagem” e aqui retrata a existência humana como algo sem substância.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico está no plural: “eles se agitam”. A mudança do singular “o homem” para o plural provavelmente amplia a afirmação para os seres humanos em geral.'
    reason: textual_syntax
  - marker: c
    text: 'O hebraico não declara o que ele acumula; “bens” é esclarecido pelo pronome plural na frase seguinte: “quem os recolherá”.'
    reason: implicit_object
lexical_decisions:
- source_word: אַךְ
  choice: de fato
  rationale: A expressão, repetida nas duas primeiras orações, comunica a ênfase asseverativa do hebraico e mantém a repetição poética.
- source_word: בְּצֶלֶם
  choice: como uma sombra
  rationale: Embora צֶלֶם signifique literalmente “imagem”, neste contexto descreve uma existência humana sem substância e passageira. “Como uma sombra” transmite essa força poética; a acepção literal é preservada em nota.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: o homem anda
  rationale: Mantém o singular masculino representativo de אִישׁ e traduz o movimento expresso pela forma reflexiva de הלך de maneira natural em português.
- source_word: הֶבֶל
  choice: em vão
  rationale: Aqui o termo qualifica a agitação como inútil ou sem resultado, e por isso a locução adverbial “em vão” se ajusta bem à sintaxe.
- source_word: יֶהֱמָיוּן
  choice: se agitam
  rationale: O verbo plural indica tumulto, inquietação ou atividade agitada. A ausência de sujeito explícito em português preserva, tanto quanto possível, a mudança difícil do singular “o homem” para o plural hebraico.
- source_word: יִצְבֹּר
  choice: acumula bens
  rationale: O verbo significa juntar ou amontoar. “Bens” explicita o objeto implícito, confirmado pelo sufixo plural da oração seguinte.
- source_word: וְלֹא יֵדַע
  choice: e não sabe
  rationale: Reproduz diretamente a coordenação e a negação do hebraico.
- source_word: מִי אֹסְפָם
  choice: quem os recolherá
  rationale: O pronome “os” conserva o sufixo masculino plural hebraico e o relaciona naturalmente aos bens acumulados.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: o homem
  alternative: a pessoa; alguém
  rationale: O hebraico apresenta a humanidade por meio de um substantivo masculino singular. A tradução conserva essa forma sem limitar a afirmação apenas aos homens.
- issue: Mudança do singular para o plural em יֶהֱמָיוּן
  choice: o homem... se agitam
  alternative: o homem... se agita; as pessoas se agitam
  rationale: A mudança de número presente no texto hebraico é mantida, sem corrigi-la silenciosamente nem definir com excessiva precisão o sujeito plural.
translation_notes:
  register: Português atual, poético e digno, com sintaxe concisa. A repetição de “de fato” reproduz a estrutura hebraica; a inversão “em vão se agitam” mantém o ritmo e deixa perceptível a difícil mudança de número.
