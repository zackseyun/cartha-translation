  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: pt
  text: Retira de mim[d] a tua praga[a]; pelo ataque[b] da tua mão, estou consumido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu golpe” ou “a tua aflição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelo golpe da tua mão” ou “por causa da hostilidade da tua mão”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “vou me consumindo” ou “estou esgotado”.'
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “de sobre mim”.
