lexical_decisions:
- source_word: הָסֵר
  choice: Retira
  rationale: O imperativo no hifil expressa um pedido direto para que Deus remova aquilo que aflige o salmista. “Retira” conserva a força do imperativo e soa natural em português.
- source_word: מֵעָלַי
  choice: de mim
  rationale: A expressão combina as ideias de procedência e posição sobre o salmista. “De mim” é idiomático; a imagem espacial mais literal é preservada em nota.
- source_word: נִגְעֶךָ
  choice: a tua praga
  rationale: נֶגַע pode designar praga, golpe ou aflição. “Praga” mantém a atribuição direta a Deus sem definir se se trata especificamente de doença, punição ou outro sofrimento.
- source_word: מִתִּגְרַת
  choice: pelo ataque
  rationale: תִּגְרָה comunica contenda, hostilidade ou investida. Na construção com “tua mão”, “pelo ataque” expressa a ação opressora que consome o salmista, sem reduzir necessariamente o termo a um único golpe físico.
- source_word: יָדְךָ
  choice: da tua mão
  rationale: Mantém a imagem antropomórfica hebraica da mão como agente da ação e do poder divinos, em vez de substituí-la por uma abstração.
- source_word: אֲנִי כָלִיתִי
  choice: estou consumido
  rationale: O pronome explícito dá destaque ao salmista, e o perfeito de כלה descreve alguém levado ao fim, esgotado ou consumido. A formulação portuguesa preserva a intensidade sem declarar morte consumada.
theological_decisions:
- issue: Natureza da aflição indicada por נִגְעֶךָ
  choice: “a tua praga”, entendida como aflição diretamente atribuída a Deus, mas sem especificar sua forma
  alternative: “o teu golpe” ou “a tua aflição”
  rationale: O texto apresenta Deus como fonte da experiência dolorosa, mas não informa se ela é doença, castigo judicial ou outra calamidade. A tradução mantém essa tensão.
- issue: Sentido da ação da mão divina em מִתִּגְרַת יָדְךָ
  choice: “pelo ataque da tua mão”
  alternative: “pelo golpe da tua mão” ou “por causa da hostilidade da tua mão”
  rationale: A expressão é forte e pode sugerir investida hostil ou golpe. “Ataque” conserva essa força sem explicar por que Deus age assim nem suavizar a atribuição ao próprio Deus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada ao português, preservando a súplica direta, a imagem da mão divina e o paralelismo conciso do hebraico.
