source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: pt
  text: Eis que fizeste meus dias de apenas alguns palmos, e o tempo da minha vida é como nada diante de ti. Certamente, todo ser humano, ainda que esteja firme[a], não passa de vapor[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em pé” ou “estabelecido”; o sentido pode ser que até quem parece seguro é apenas vapor.
    reason: lexical_alternative
  - marker: b
    text: Ou “mero sopro” ou “vaidade”; o hebraico הֶבֶל evoca algo insubstancial e passageiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis
  rationale: Mantém a chamada enfática à atenção e o tom poético elevado do hebraico, sem soar excessivamente obscuro em português.
- source_word: טְפָחוֹת
  choice: do tamanho de poucos palmos
  rationale: Preserva a imagem concreta do palmo como medida muito curta e torna natural em português a construção aplicada à duração dos dias.
- source_word: נָתַתָּה יָמַי
  choice: fizeste meus dias
  rationale: Neste contexto, נתן expressa que Deus determinou ou fez breve a duração dos dias; a formulação conserva o sujeito divino e o idioma poético.
- source_word: וְחֶלְדִּי
  choice: e o tempo da minha vida
  rationale: Comunica com clareza a duração da vida no mundo e mantém o paralelismo com “meus dias”.
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: é como nada diante de ti
  rationale: Preserva tanto a comparação com o nada quanto a perspectiva da presença ou avaliação de Deus.
- source_word: אַךְ
  choice: Certamente
  rationale: Expressa a força enfática da partícula ao introduzir a conclusão geral do salmista.
- source_word: כָּל אָדָם
  choice: todo ser humano
  rationale: O singular genérico אָדָם abrange a humanidade; “todo ser humano” comunica naturalmente essa abrangência em português sem restringi-la ao sexo masculino.
- source_word: נִצָּב
  choice: mesmo que esteja firme
  rationale: Conserva a imagem de alguém em pé ou estabelecido e explicita de modo moderado o provável valor concessivo no contexto.
- source_word: כָּל הֶבֶל
  choice: é puro vapor
  rationale: “Vapor” preserva a imagem concreta de algo fugaz e insubstancial; “puro” transmite a força totalizante de כָּל na predicação.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional porque a função precisa do termo é incerta.
theological_decisions:
- issue: Abrangência de אָדָם na afirmação sobre a condição humana
  choice: todo ser humano
  alternative: todo homem
  rationale: Aqui אָדָם funciona como singular genérico. A opção escolhida conserva a universalidade da declaração e evita que o leitor moderno a entenda como limitada aos homens.
- issue: Sentido de נִצָּב em relação à fragilidade humana
  choice: mesmo que esteja firme
  alternative: estando em pé / estabelecido
  rationale: 'A tradução mantém a ironia e a tensão do verso: até quem parece estável ou seguro continua sendo transitório, sem definir se a firmeza é física, social ou existencial.'
- issue: Imagem e alcance de הֶבֶל
  choice: puro vapor
  alternative: mero sopro / vaidade
  rationale: “Vapor” conserva a metáfora hebraica de transitoriedade e falta de substância, sem reduzir o termo apenas a inutilidade moral ou filosófica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva as imagens poéticas concretas de “palmos” e “vapor”, usa “Selá” sem tentar resolver seu significado incerto e evita linguagem denominacional.
