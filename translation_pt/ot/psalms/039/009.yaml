  yaml_path: translation/ot/psalms/039/009.yaml
  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: pt
  text: Estou calado[a]; não abro a boca, pois tu fizeste isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fui silenciado” ou “Estou em silêncio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “pois tu fizeste”; o objeto não é declarado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Fiquei calado
  rationale: O nifal de אלם pode indicar ter sido reduzido ao silêncio ou permanecer calado. “Fiquei calado” preserva o valor resultativo sem explicitar um agente que o hebraico não nomeia.
- source_word: לֹא אֶפְתַּח פִּי
  choice: não abro a boca
  rationale: Mantém a expressão hebraica com “boca” e traduz o imperfeito como postura presente no contexto; “não abrirei a boca” também é possível.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira natural a razão do silêncio, com valor causal.
- source_word: אַתָּה
  choice: tu
  rationale: O pronome está expresso e anteposto no hebraico. A construção “foste tu quem” comunica sua ênfase em português.
- source_word: עָשִׂיתָ
  choice: fez isso
  rationale: עשה é um verbo amplo, e seu objeto não está expresso. “Fez isso” soa natural em português, ao mesmo tempo que não define além do texto a ação mencionada.
theological_decisions:
- issue: Objeto implícito de עָשִׂיתָ e ação divina
  choice: pois foste tu quem fez isso
  alternative: pois tu agiste
  rationale: A tradução reconhece a ação de Deus e preserva a ênfase do pronome, mas mantém indefinido o conteúdo exato daquilo que ele fez, sem explicar a relação entre Deus e o sofrimento além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Tu” conserva o tratamento direto a Deus e permite reproduzir com naturalidade a ênfase do pronome hebraico.
