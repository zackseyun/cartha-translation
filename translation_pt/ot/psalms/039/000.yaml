base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/000.yaml
  text: For the choir director; according to Jeduthun[a]. A psalm of David[b].
translation:
  language: pt
  text: Ao regente; segundo Jedutum[a]. Salmo de Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Jedutum” ou “a Jedutum”; a preposição hebraica pode indicar diferentes tipos de associação nos títulos dos salmos.
    reason: alternative_reading
  - marker: b
    text: Ou “por Davi”; literalmente, o título hebraico diz “de Davi” e pode indicar autoria ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente quem dirige a execução musical. “Ao regente” é conciso, natural em português e não restringe indevidamente a função à direção de um coro.
- source_word: לִידוּתוּן
  choice: segundo Jedutum
  rationale: A preposição לְ pode indicar destinação ou associação. “Segundo Jedutum” expressa uma provável associação musical, de estilo ou tradição, sem eliminar outras possibilidades, registradas em nota.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente tradicional, claro e preciso para o rótulo de gênero musical מִזְמוֹר no Saltério.
- source_word: לְדָוִד
  choice: de Davi
  rationale: “De Davi” preserva melhor a amplitude semântica da preposição לְ, que pode assinalar autoria, pertença, dedicação ou associação, ao passo que “por Davi” afirmaria autoria de maneira mais específica.
