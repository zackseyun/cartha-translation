  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: pt
  text: 'Tu lhe concedeste o desejo do seu coração

    e não lhe negaste o pedido[a] dos seus lábios.

    Selá.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a súplica dos seus lábios”. O raro substantivo hebraico provavelmente se refere a um pedido expresso, em paralelo com “o desejo do seu coração”.
    reason: lexical_alternative
  - marker: b
    text: “Selá” é mantido como transliteração porque seu significado ou sua função exatos são incertos, embora provavelmente indique uma pausa musical ou litúrgica.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: o desejo do coração
  rationale: Expressa de modo natural e digno o desejo interior indicado pela construção hebraica, preservando o paralelismo com o pedido verbalizado no segundo verso.
- source_word: נָתַתָּה לּוֹ
  choice: Tu lhe concedeste
  rationale: O perfeito hebraico descreve uma ação concluída. “Concedeste” comunica melhor, neste contexto, que Deus satisfez o desejo, e a forma “Tu” mantém clara a interpelação direta.
- source_word: וַאֲרֶשֶׁת
  choice: o pedido
  rationale: O substantivo raro provavelmente designa uma petição ou solicitação expressa, em paralelo com o desejo interior do primeiro verso.
- source_word: שְׂפָתָיו
  choice: de seus lábios
  rationale: Preserva a imagem poética hebraica dos lábios como meio pelo qual o pedido é expresso.
- source_word: בַּל מָנַעְתָּ
  choice: não lhe negaste
  rationale: Reproduz a negação poética e o sentido de não reter ou recusar aquilo que foi pedido, em português atual.
- source_word: סֶּלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, com acento adequado à leitura em português, porque o significado e a função exatos do termo permanecem incertos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético foi preservado, assim como a imagem concreta dos lábios. “Tu” reflete a segunda pessoa singular do hebraico sem regionalismos adicionais.
