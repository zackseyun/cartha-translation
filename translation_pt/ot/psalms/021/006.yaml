  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: pt
  text: Pois tu o tornas muito abençoado para sempre[a]; tu o enches de alegria na tua presença.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramas bênçãos sobre ele para sempre” ou “fazes dele uma bênção para sempre”. A expressão hebraica é compacta e pode referir-se tanto às bênçãos concedidas ao rei como ao fato de ele próprio se tornar bênção ou fonte de bênção. “Muito abençoado” expressa o possível sentido intensivo do plural hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do louvor anterior; “pois” expressa naturalmente esse valor causal em português.
- source_word: תְשִׁיתֵהוּ
  choice: fazes dele
  rationale: O verbo שׁית pode significar pôr, colocar ou fazer. Nesta construção predicativa, “fazes dele” conserva a relação direta entre o rei e “bênçãos”.
- source_word: בְרָכוֹת
  choice: bênçãos
  rationale: Mantém o plural hebraico e a formulação incomum, que pode retratar o rei como alguém abundantemente abençoado, como personificação da bênção ou como fonte dela.
- source_word: לָעַד
  choice: para sempre
  rationale: Equivalente português corrente e claro para duração permanente.
- source_word: תְּחַדֵּהוּ
  choice: tu o alegras
  rationale: 'O piel de חדה tem sentido causativo: fazer alguém alegrar-se. “Alegras” comunica isso de modo conciso e natural.'
- source_word: בְשִׂמְחָה
  choice: com a alegria
  rationale: Preserva o substantivo “alegria” e a força instrumental ou associativa da preposição בְּ.
- source_word: אֶת־פָּנֶיךָ
  choice: da tua presença
  rationale: A expressão literalmente relacionada ao “rosto” de Deus funciona idiomaticamente como referência à sua presença. A ligação com “alegria” produz uma frase natural em português.
theological_decisions:
- issue: Sentido de “fazes dele bênçãos”
  choice: Conservar no texto a construção plural e compacta, permitindo que o rei seja entendido como alguém que incorpora abundante bênção.
  alternative: “Tu derramas bênçãos sobre ele para sempre” ou “tu fazes dele uma bênção para sempre”.
  rationale: O hebraico admite nuances de bênçãos concedidas ao rei e de o próprio rei tornar-se bênção ou fonte de bênção. A redação principal evita limitar a frase a apenas uma dessas possibilidades e não impõe uma leitura exclusivamente material ou especificamente messiânica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve elevação poética. A expressão incomum “fazes dele bênçãos” foi mantida deliberadamente para refletir a forma plural e a ambiguidade genuína do hebraico; a nota oferece formulações portuguesas mais idiomáticas sem escolher silenciosamente entre elas.
