  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: pt
  text: Sê exaltado[a], ó Yahweh, na tua força! Cantaremos e faremos música sobre o teu poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levanta-te, ó Yahweh, com a tua força”. O verbo hebraico pode ser entendido como um chamado para Deus se levantar ou para ser exaltado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Sê exaltado
  rationale: A forma volitiva de רום dirige a Yahweh um apelo ou aclamação para que seja elevado/exaltado. A formulação mantém a linguagem de louvor, enquanto a nota preserva a possibilidade de entender o verbo como um chamado para Deus se levantar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעֻזֶּךָ
  choice: na tua força
  rationale: Preserva a preposição ב e apresenta a força de Yahweh como a esfera ou manifestação em que ele é exaltado.
- source_word: נָשִׁירָה
  choice: Cantaremos
  rationale: O coortativo da primeira pessoa do plural expressa a resolução dos adoradores; o futuro em português comunica essa disposição de modo natural.
- source_word: וּנְזַמְּרָה
  choice: e faremos música
  rationale: זמר denota cantar ou produzir música em contexto de louvor. A escolha preserva o aspecto musical e evita simplesmente repetir 'cantaremos'.
- source_word: גְּבוּרָתֶךָ
  choice: sobre o teu poder
  rationale: גְּבוּרָה designa poder, força ou proeza. 'Poder' mantém uma distinção poética em relação a עֹז, traduzido por 'força'; 'sobre' indica naturalmente o tema do canto e da música em português.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama יְהוָה; a transliteração preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Sentido do apelo רוּמָה dirigido a Deus
  choice: Sê exaltado
  alternative: Levanta-te
  rationale: O contexto conclusivo de louvor favorece uma aclamação da exaltação de Yahweh, mas a amplitude lexical do verbo permite também um chamado para que ele se levante; essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. Mantém o paralelismo poético entre “força” e “poder” e conserva a ambiguidade principal do primeiro verbo em nota.
