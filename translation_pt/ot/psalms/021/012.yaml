  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: pt
  text: Pois tu os farás dar as costas[a]; com as cordas do teu arco, mirarás os rostos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tu os colocarás como ombro”. A expressão hebraica provavelmente retrata os inimigos dando as costas em retirada ou expondo o ombro como alvos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com as tuas cordas, prepararás [o arco ou as flechas] contra os rostos deles”. A imagem hebraica é condensada, e o objeto que se prepara não é declarado.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da confiança expressa no contexto anterior, mantendo a ligação discursiva do hebraico.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: tu os farás dar as costas
  rationale: שׁית significa pôr, colocar ou fazer, e שֶׁכֶם significa literalmente ombro. A expressão militar parece descrever os inimigos virando as costas em retirada; a tradução comunica o provável sentido idiomático sem ocultar a imagem literal, registrada em nota.
- source_word: בְּמֵיתָרֶיךָ
  choice: com as cordas do teu arco
  rationale: מֵיתָר designa corda ou cordão. No contexto bélico e em conexão com o ato de apontar, trata-se provavelmente das cordas do arco; a explicitação de “arco” torna a imagem compreensível.
- source_word: תְּכוֹנֵן
  choice: apontarás
  rationale: A forma verbal de כון pode significar preparar ou deixar pronto. Neste contexto de arco e alvo, “apontarás” expressa naturalmente a ação implícita, enquanto a alternativa mais literal é preservada em nota.
- source_word: עַל־פְּנֵיהֶם
  choice: para o rosto deles
  rationale: פנים designa o rosto ou a face; com עַל neste contexto hostil, a expressão indica a direção ou o alvo. O singular coletivo em português evita a formulação menos natural “para as faces deles”.
