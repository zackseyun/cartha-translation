translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a tensão entre os inimigos darem as costas e o arco ser apontado para o rosto foram mantidos, sem acrescentar uma relação temporal ou causal ausente do hebraico.
