source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: pt
  text: Tu os tornarás como uma fornalha ardente quando te manifestares[a]; Yahweh, em sua ira, os engolirá, e o fogo os consumirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo da tua presença”; literalmente, “no tempo do teu rosto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Tu os tornarás
  rationale: O verbo שׁית pode significar pôr, colocar ou fazer. Com a expressão predicativa seguinte, “tornarás” comunica naturalmente o estado resultante.
- source_word: כְּתַנּוּר אֵשׁ
  choice: como uma fornalha ardente
  rationale: תנור designa forno ou fornalha, e אֵשׁ acrescenta a imagem do fogo. “Fornalha ardente” preserva de modo claro e idiomático a intensidade destrutiva.
- source_word: לְעֵת פָּנֶיךָ
  choice: quando te manifestares
  rationale: A expressão significa literalmente “no tempo do teu rosto”. Aqui, פָּנִים pode indicar presença ou manifestação; a formulação escolhida mantém o valor temporal e comunica naturalmente a ideia de aparecimento, sem lhe impor um sentido escatológico técnico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּאַפּוֹ
  choice: em sua ira
  rationale: אַף significa literalmente nariz, mas funciona idiomaticamente para a ira. “Em sua ira” expressa com clareza o sentido contextual.
- source_word: יְבַלְּעֵם
  choice: os engolirá
  rationale: Preserva a metáfora vívida de בלע, “engolir”, e a distingue do verbo seguinte, que descreve o fogo consumindo-os.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: e o fogo os consumirá
  rationale: “Consumirá” é a expressão portuguesa natural para a ação destrutiva do fogo e preserva o sujeito explícito אֵשׁ.
theological_decisions:
- issue: Expressão antropomórfica “no tempo do teu rosto”
  choice: quando te manifestares
  alternative: no tempo da tua presença
  rationale: A tradução comunica a manifestação da presença divina sem conservar um literalismo obscuro nem definir a frase como termo escatológico técnico. A alternativa com “presença” também é lexicalmente possível.
- issue: Forma de representar o nome divino
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome pessoal representado pelo Tetragrama e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento de segunda pessoa singular coerente com o discurso dirigido ao rei. A ordem das orações e as metáforas do hebraico foram preservadas sempre que naturais em português.
