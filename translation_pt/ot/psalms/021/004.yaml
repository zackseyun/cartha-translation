  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: pt
  text: Ele te pediu vida; tu lhe deste prolongamento de dias[a], para todo o sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “extensão de dias”; isto é, longa vida.
    reason: lexical_alternative
  - marker: b
    text: A expressão “para todo o sempre” pode ser entendida como hipérbole régia para uma vida e um reinado duradouros, ou como linguagem que encontra cumprimento mais pleno no Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: vida
  rationale: Embora tenha forma plural em hebraico, o substantivo funciona aqui como abstrato singular e significa naturalmente “vida”.
- source_word: שָׁאַל מִמְּךָ
  choice: te pediu
  rationale: Expressa de modo natural em português que o rei pediu vida a Deus; o pronome “te” preserva a referência à segunda pessoa.
- source_word: נָתַתָּה לּוֹ
  choice: tu lhe deste
  rationale: O perfeito hebraico é apresentado como ação concluída. O objeto é recuperado da oração anterior, como também ocorre poeticamente no hebraico.
- source_word: אֹרֶךְ יָמִים
  choice: uma longa vida
  rationale: A expressão literal “extensão de dias” é um idiomatismo para longevidade. “Uma longa vida” comunica o sentido com clareza e naturalidade, sem perder a expansão da ideia de “vida” da primeira oração.
- source_word: עוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A fórmula intensifica a duração e conserva a afirmação aberta de permanência ilimitada, em linguagem portuguesa corrente e solene.
theological_decisions:
- issue: A extensão da vida prometida ao rei no salmo régio
  choice: Manter “para todo o sempre” sem limitar seu sentido no texto principal
  alternative: Entender a expressão como hipérbole régia sobre uma vida e um reinado duradouros, ou como linguagem que alcança cumprimento mais pleno no Messias
  rationale: O hebraico afirma duração sem limite. A tradução preserva a tensão entre o contexto régio imediato e uma possível dimensão messiânica, sem decidir a questão interpretativa no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo poético, enquanto “uma longa vida” traduz idiomaticamente a expressão hebraica literal “extensão de dias”.
