  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: pt
  text: Ó Yahweh, o rei se alegra em tua força; quanto exulta em tua salvação![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como «salvação» também pode significar «livramento» ou «vitória» neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino pessoal e acrescenta «Ó» para expressar o vocativo da oração direta.
- source_word: בְּעָזְּךָ
  choice: em tua força
  rationale: Preserva a preposição hebraica como esfera ou fundamento da alegria do rei e mantém o paralelismo com «em tua salvação».
- source_word: יִשְׂמַח
  choice: se alegra
  rationale: O yiqtol poético admite valor presente, habitual ou prospectivo; o presente português é natural no contexto de louvor sem impor uma referência exclusivamente futura.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Embora o substantivo não tenha artigo em hebraico, o contexto aponta para um rei específico.
- source_word: וּבִישׁוּעָתְךָ
  choice: em tua salvação
  rationale: «Salvação» conserva a amplitude de יְשׁוּעָה, que também pode indicar livramento ou vitória, e reproduz o paralelismo preposicional.
- source_word: מַה ... מְאֹד
  choice: quanto
  rationale: A construção tem força exclamativa e intensiva. «Quanto» a comunica de modo natural em português, sem a redundância pouco idiomática de «quão grandemente».
- source_word: יגיל
  choice: exulta
  rationale: Distingue a alegria exuberante de גיל daquela expressa por שמח no primeiro membro e preserva a progressão poética.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Amplitude de יְשׁוּעָה
  choice: salvação
  alternative: livramento ou vitória
  rationale: «Salvação» mantém a amplitude lexical e teológica do termo, enquanto a nota registra sentidos contextualmente possíveis sem escolher um deles de forma exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi preservado, e «quanto exulta» transmite de forma idiomática a intensidade exclamativa do hebraico.
