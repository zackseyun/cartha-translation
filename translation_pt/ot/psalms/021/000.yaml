lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente o responsável pela execução musical. “Ao regente” é conciso, natural e conserva o valor direcional ou dedicatório do prefixo לַ־.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e exato para este gênero poético-musical; em português, o artigo indefinido pode ser omitido naturalmente no estilo de um título.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, associação, pertença ou dedicação. “De Davi” mantém melhor essa amplitude do que opções mais específicas.
theological_decisions:
- issue: Sentido da indicação davídica no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica לְ não obriga a decidir entre autoria, associação e dedicação; a tradução conserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e conciso, adequado ao caráter formular de um título de salmo. “Regente” tem leitura clara no português brasileiro e ampla compreensão internacional; o marcador da nota foi ligado a “Davi”, expressão à qual a variante se refere.
