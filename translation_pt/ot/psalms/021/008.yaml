  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: pt
  text: A tua mão alcançará todos os teus inimigos[a]; a tua mão direita alcançará os que te odeiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encontrará” ou “apanhará”; neste contexto, o hebraico pode indicar chegar eficazmente até os inimigos e apoderar-se deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: alcançará
  rationale: O verbo מצא significa normalmente “achar” ou “encontrar”, mas, neste contexto de confronto, indica conseguir chegar até os inimigos e apanhá-los. “Alcançará” comunica essa eficácia em português natural, sem explicitar além do texto o que lhes acontecerá.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Mantém a imagem concreta hebraica da mão como agente de poder e ação, bem como a referência direta ao destinatário masculino singular.
- source_word: לְכָל
  choice: todos
  rationale: Preserva a abrangência de כל e forma a expressão idiomática “todos os teus inimigos”.
- source_word: אֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Equivalente direto e corrente de אֹיְבֶיךָ, mantendo o sufixo de segunda pessoa masculina singular.
- source_word: יְמִינְךָ
  choice: a tua mão direita
  rationale: Conserva o paralelismo e a imagem tradicional de força e ação eficaz associada à mão direita.
- source_word: שֹׂנְאֶיךָ
  choice: os que te odeiam
  rationale: Preserva a nuance verbal do particípio, em vez de reduzi-lo simplesmente a outro substantivo como “adversários”.
theological_decisions:
- issue: Linguagem antropomórfica da mão como expressão do poder real ou divino
  choice: Manter “mão” e “mão direita” como imagens concretas.
  alternative: Verter de modo abstrato como “teu poder” ou “tua força”.
  rationale: O hebraico emprega imagens corporais poeticamente significativas. Mantê-las conserva o paralelismo e não decide se o referente deve ser entendido apenas em sentido real, divino ou tipológico.
translation_notes:
  register: Português moderno, claro e digno, com formas em “tu” para refletir a segunda pessoa singular do hebraico. “Alcançará” soa natural em contexto poético e marcial; a nota preserva o sentido lexical básico e outras nuances possíveis.
