id: PSA.21.3
reference: Psalms 21:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: pt
  text: Pois vais ao encontro dele com boas bênçãos[a]; pões sobre a cabeça dele uma coroa de ouro fino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te antecipas a ele com boas bênçãos” ou “vais adiante dele com boas bênçãos”. O verbo hebraico pode indicar tanto ir ao encontro de alguém como adiantar-se diante dele.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “ouro puro” ou “ouro refinado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da alegria mencionada no contexto anterior, de modo natural em português.
- source_word: תְקַדְּמֶנּוּ
  choice: vais ao encontro dele
  rationale: Expressa o sentido de encontrar alguém ou adiantar-se para recebê-lo, preservando a iniciativa indicada pelo verbo hebraico.
- source_word: בִּרְכוֹת טוֹב
  choice: com boas bênçãos
  rationale: Mantém o plural «bênçãos» e o sentido amplo de טוֹב, sem restringi-lo a prosperidade material nem produzir a construção pouco natural «bênçãos de bem».
- source_word: תָּשִׁית
  choice: pões
  rationale: Equivalente corrente e digno para o ato de colocar uma coroa.
- source_word: לְרֹאשׁוֹ
  choice: sobre a cabeça dele
  rationale: Com o verbo de colocação, a preposição hebraica indica naturalmente a posição da coroa sobre a cabeça.
- source_word: עֲטֶרֶת
  choice: uma coroa
  rationale: No contexto de um salmo real, «coroa» comunica adequadamente o sentido régio do substantivo.
- source_word: פָּז
  choice: ouro fino
  rationale: Designa ouro de alta qualidade; «ouro fino» conserva o registro poético e admite as nuances de ouro puro ou refinado.
theological_decisions:
- issue: Natureza das bênçãos concedidas ao rei
  choice: Manter a expressão ampla «boas bênçãos»
  alternative: Especificá-las como prosperidade material ou como bênçãos exclusivamente espirituais e pactuais
  rationale: O hebraico não delimita a natureza do bem concedido; a formulação preserva essa amplitude teológica.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A segunda pessoa do singular preserva o discurso direto a Deus; «dele» evita a possível ambiguidade de «sua cabeça».
