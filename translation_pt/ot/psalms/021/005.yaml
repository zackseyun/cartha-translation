  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: pt
  text: Grande é a glória dele por meio da tua salvação[a][b]; tu lhe conferes esplendor e majestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela tua salvação” ou “na tua salvação”; a preposição hebraica pode indicar meio ou esfera.
    reason: lexical_alternative
  - marker: b
    text: “Salvação” também pode ser entendida aqui como “livramento” ou, neste contexto régio, “vitória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grande é
  rationale: O adjetivo predicativo abre a oração no hebraico; a formulação preserva essa ênfase com dignidade e naturalidade poética.
- source_word: כְּבוֹדוֹ
  choice: a glória dele
  rationale: כָּבוֹד expressa glória ou honra; “glória” se ajusta ao contexto régio. A construção “dele” evita possível ambiguidade de “sua” em português.
- source_word: בִּישׁוּעָתֶךָ
  choice: por meio da tua salvação
  rationale: A preposição ב pode indicar meio ou esfera. “Por meio de” torna claro o sentido instrumental sem excluir as demais possibilidades, registradas em nota; “salvação” conserva a amplitude de יְשׁוּעָה.
- source_word: הוֹד
  choice: esplendor
  rationale: הוֹד denota magnificência ou esplendor régio e permanece distinto do termo poético seguinte.
- source_word: וְהָדָר
  choice: e majestade
  rationale: No paralelismo com הוֹד, הָדָר comunica dignidade e imponência régias.
- source_word: תְּשַׁוֶּה
  choice: tu lhe conferes
  rationale: O verbo com עַל descreve pôr algo sobre alguém; “conferir” expressa naturalmente a concessão de atributos régios.
- source_word: עָלָיו
  choice: lhe
  rationale: O pronome oblíquo transmite de modo idiomático em português o destinatário da ação expressa por תְּשַׁוֶּה עָלָיו.
theological_decisions:
- issue: Sentido de יְשׁוּעָה em um salmo régio
  choice: salvação
  alternative: livramento ou vitória
  rationale: O termo pode indicar livramento e, em contexto régio ou militar, vitória. “Salvação” mantém sua amplitude lexical e teológica sem restringir o verso ao êxito militar.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Emprega-se “tu” em consonância com as formas verbais e possessivas do verso. “A glória dele” favorece a clareza referencial, enquanto “tu lhe conferes” evita uma tradução excessivamente literal.
