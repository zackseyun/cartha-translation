base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: pt
  text: Pois o rei confia em Yahweh e, pelo amor leal do Altíssimo[a], não será abalado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no amor leal do Altíssimo”. A preposição hebraica pode indicar meio ou esfera; “amor leal” também pode ser traduzido por “fidelidade à aliança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não vacilará” ou “não será movido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a ligação discursiva sem tornar a relação mais causal do que o hebraico exige.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Reproduz de modo direto o substantivo definido que designa a figura real do salmo.
- source_word: בֹּטֵחַ
  choice: confia
  rationale: O particípio qal expressa confiança contínua ou característica; o presente simples é natural em português.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição indica aquele em quem se deposita confiança, e o nome divino é transliterado como Yahweh.
- source_word: וּבְחֶסֶד
  choice: e, pelo amor leal
  rationale: A preposição בְּ pode indicar meio ou esfera; no texto principal, “pelo” expressa o meio ou fundamento. חֶסֶד denota amor fiel e comprometido, vertido de modo conciso como “amor leal”.
- source_word: עֶלְיוֹן
  choice: do Altíssimo
  rationale: Título divino substantivado, traduzido pela forma portuguesa consagrada e clara.
- source_word: בַּל יִמּוֹט
  choice: não será abalado
  rationale: A partícula poética nega o verbo que descreve vacilar, mover-se ou perder a estabilidade; “não será abalado” conserva a metáfora e soa natural.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. A transliteração “Yahweh” preserva sua função como nome próprio sem substituí-lo por um título.
- issue: Relação entre a lealdade divina e a estabilidade do rei
  choice: “pelo amor leal” como meio ou fundamento
  alternative: “no amor leal” como esfera de confiança
  rationale: A preposição hebraica permite leitura instrumental ou locativa. O texto adota a leitura instrumental mais natural no contexto, mas registra a outra possibilidade em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada com pontuação para deixar claro que a expressão preposicional se liga à estabilidade do rei. As notas preservam as alternativas semânticas reais de בְּ, חֶסֶד e מוט.
