source:
  edition: WLC
  text: כִּי נָט֣וּ עָלֶ֣י/ךָ רָעָ֑ה חָֽשְׁב֥וּ מְ֝זִמָּ֗ה בַּל יוּכָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/011.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: pt
  text: Pois intentaram o mal contra ti[a]; planejaram uma trama, mas não conseguiram levá-la a cabo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estenderam o mal contra ti”; a expressão hebraica significa que dirigiram ou intentaram o mal contra ti.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “planejaram uma trama, mas não puderam executá-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior e preserva com naturalidade a força explicativa da partícula hebraica.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: tramaram o mal contra ti
  rationale: נָטָה significa literalmente estender ou inclinar, mas nesta construção comunica a ideia de dirigir ou intentar o mal contra alguém. “Tramaram” expressa a intenção hostil e se encaixa no paralelismo poético.
- source_word: חָשְׁבוּ מְזִמָּה
  choice: planejaram uma conspiração
  rationale: חָשַׁב indica planejamento deliberado, e מְזִמָּה designa aqui um plano ardiloso e hostil. A formulação conserva o caráter calculado da ação.
- source_word: בַּל יוּכָלוּ
  choice: mas não conseguiram realizá-la
  rationale: A partícula poética בַּל nega a capacidade expressa por יכל. O pronome retoma de modo natural a conspiração, objeto implícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com uso de “ti” adequado à linguagem poética dirigida a Deus ou ao rei. A tradução prioriza equivalência ótima e registra em nota o caráter idiomático da primeira oração e a formulação mais literal da última.
