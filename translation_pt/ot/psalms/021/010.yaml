source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: pt
  text: Tu destruirás da terra o fruto deles e, dentre os seres humanos, a descendência deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentre os filhos do homem”; isto é, dentre a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: o fruto deles
  rationale: Mantém a metáfora concreta de פְּרִי, enquanto o paralelismo com “a descendência deles” deixa perceptível seu sentido de posteridade.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar “terra” ou “país”; “terra” preserva o alcance amplo mais provável neste contexto de juízo régio.
- source_word: תְּאַבֵּד
  choice: tu destruirás
  rationale: O piel de אבד tem força causativa, “destruir” ou “fazer perecer”; a forma mantém a segunda pessoa masculina singular do hebraico.
- source_word: וְזַרְעָם
  choice: a descendência deles
  rationale: זֶרַע significa literalmente “semente” e, aplicado a pessoas, “descendência”; esta última opção é clara e natural, sem apagar a metáfora paralela já mantida em “fruto”.
- source_word: מִבְּנֵי אָדָם
  choice: dentre os seres humanos
  rationale: A expressão hebraica “filhos de אדם” designa genericamente a humanidade. Em português atual, “seres humanos” comunica seu referente inclusivo de modo natural e exato; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Tradução de אָדָם na expressão בְּנֵי אָדָם
  choice: seres humanos
  alternative: filhos do homem
  rationale: A expressão é genérica e se refere à humanidade, não exclusivamente a homens do sexo masculino. A tradução idiomática evita uma possível leitura cristológica indevida de “Filho do Homem”, enquanto a nota preserva a forma do hebraico.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. Conserva-se “fruto” para reproduzir a imagem hebraica e usa-se “descendência” para esclarecer o paralelismo. O pronome “tu” retém a interpelação direta a Deus.
