  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: pt
  text: Ó Deus, dá ouvidos à minha oração e não te escondas da minha súplica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ignores o meu pedido”. O verbo hebraico significa literalmente “esconder-se” e, neste contexto, expressa a recusa de dar atenção à oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: dá ouvidos
  rationale: O imperativo de אזן pede que Deus escute atentamente. A expressão portuguesa preserva a imagem hebraica e o tom solene da oração, sem deixar de ser clara.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É uma invocação direta a Deus; o nome da aliança não aparece no texto.
- source_word: תְּפִלָּתִי
  choice: minha oração
  rationale: תְּפִלָּה é o termo geral para oração, e esta é a correspondência natural em português.
- source_word: וְאַל
  choice: e não
  rationale: Mantém de modo direto a coordenação hebraica entre os dois pedidos.
- source_word: תִּתְעַלַּם
  choice: te escondas
  rationale: A forma reflexiva de עלם apresenta metaforicamente Deus escondendo-se ou tornando-se inacessível, em vez de simplesmente não prestar atenção.
- source_word: מִתְּחִנָּתִי
  choice: da minha súplica
  rationale: תְּחִנָּה designa um pedido insistente por favor ou misericórdia; “súplica” preserva a intensidade e combina naturalmente com a preposição מִן.
