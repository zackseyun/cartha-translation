base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: pt
  text: As palavras da sua boca são suaves[a], mas seu coração é guerra; suas palavras são mais suaves que o óleo, mas são espadas desembainhadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras lisonjeiras saem da sua boca”. A expressão hebraica é rara e pode evocar mais especificamente uma fala amanteigada ou lisonjeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: As palavras da sua boca são suaves
  rationale: A expressão hebraica é rara e literalmente evoca algo amanteigado ou liso; no contexto, descreve uma fala suave ou lisonjeira. A formulação portuguesa torna o sentido inteligível sem perder a imagem, explicada na nota.
- source_word: וּקֲרָב לִבּוֹ
  choice: mas seu coração é guerra
  rationale: Preserva a metáfora nominal, breve e contundente, do hebraico, em vez de explicá-la como mera hostilidade interior.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: suas palavras são mais macias que o óleo
  rationale: Mantém a comparação sensorial do original e traduz שמן diretamente como 'óleo', sem especificar azeite.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: mas são espadas desembainhadas
  rationale: No contexto, פְתִחוֹת designa armas abertas ou tiradas da bainha. 'Espadas desembainhadas' comunica claramente a violência oculta nas palavras e conserva o contraste adversativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se a metáfora incisiva 'seu coração é guerra'. A alternativa 'espadas desembainhadas' foi incorporada ao texto principal por ser clara e fiel ao sentido contextual; por isso, não requer nota separada.
