base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: pt
  text: Dá-me atenção e responde-me; ando inquieto[a] em minha queixa[b] e gemo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vagueio inquieto”. O verbo hebraico pode indicar tanto agitação interior quanto movimento errante sob aflição.'
    reason: lexical_alternative
  - marker: b
    text: “Queixa” também pode ser traduzido por “meditação” ou “reflexão”; neste contexto de lamento, “queixa” parece mais adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Dá-me atenção
  rationale: O imperativo de קשׁב pede uma escuta atenta. “Dá-me atenção” é natural em português moderno e mantém a urgência da súplica.
- source_word: לִּי
  choice: -me
  rationale: O pronome de primeira pessoa singular é expresso de modo idiomático como pronome átono ligado a “dá”.
- source_word: וַעֲנֵנִי
  choice: e responde-me
  rationale: ענה, neste uso, significa responder. A formulação direta é natural no contexto de oração.
- source_word: אָרִיד
  choice: ando inquieto
  rationale: O verbo pode comunicar agitação ou movimento errante causado pela aflição. “Ando inquieto” preserva o estado de perturbação sem excluir totalmente a ideia de movimento.
- source_word: בְּשִׂיחִי
  choice: em minha queixa
  rationale: שׂיח pode designar reflexão, murmúrio ou queixa. O contexto de lamento favorece “queixa”, mantendo-se a amplitude lexical em nota.
- source_word: וְאָהִימָה
  choice: e solto gemidos
  rationale: המה descreve a emissão de som, como murmurar, gemer ou fazer ruído. “Solto gemidos” transmite de forma natural a angústia audível do salmista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção “ando inquieto” conserva a possível nuance de movimento do hebraico, enquanto as notas registram as ambiguidades lexicais genuínas.
