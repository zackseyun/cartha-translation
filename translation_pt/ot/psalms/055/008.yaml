  yaml_path: translation/ot/psalms/055/008.yaml
  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: pt
  text: Eu me apressaria[a] para me refugiar do vento impetuoso, da tempestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu me apressaria para um refúgio” ou “Que eu me apresse a refugiar-me”. A forma hebraica expressa resolução ou desejo pessoal urgente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Eu me apressaria
  rationale: A forma volitiva de חוּשׁ expressa desejo ou resolução pessoal urgente; o condicional em português se ajusta ao desejo irreal expresso no contexto, sem reduzi-la a um futuro simples.
- source_word: מִפְלָט
  choice: a buscar refúgio
  rationale: O substantivo designa refúgio ou meio de escape. Em português, com o verbo de pressa, “apressar-se a buscar refúgio” comunica naturalmente o destino pretendido, embora “buscar” esteja implícito, não expresso como verbo separado no hebraico.
- source_word: לִי
  choice: para mim
  rationale: A preposição com sufixo de primeira pessoa marca interesse ou benefício pessoal.
- source_word: מֵרוּחַ
  choice: longe do vento
  rationale: רוּחַ tem aqui sentido meteorológico por causa do paralelismo com a tempestade; מִן indica afastamento ou proteção contra algo, expresso naturalmente por “longe de”.
- source_word: סֹעָה
  choice: impetuoso
  rationale: O particípio descreve o movimento violento do vento; “impetuoso” preserva a força da imagem sem repetir “tempestade”.
- source_word: מִסָּעַר
  choice: longe da tempestade
  rationale: סַעַר denota tempestade ou tormenta. A repetição de “longe de” conserva o paralelismo das duas ocorrências hebraicas de מִן.
