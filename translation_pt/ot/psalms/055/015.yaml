base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: pt
  text: Que a morte caia sobre eles[a]; que desçam vivos ao Sheol[b], pois há maldade em sua morada[c], no meio deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que desolações venham sobre eles”, “Que a morte os surpreenda” ou expressão semelhante. A palavra hebraica inicial é difícil, e seu sentido exato é incerto.'
    reason: textual_variant
  - marker: b
    text: Sheol é o termo hebraico para o mundo dos mortos; outra tradução possível é “a sepultura”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “em sua habitação” ou “durante sua peregrinação”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “dentro deles” ou “entre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Que a morte caia
  rationale: O termo inicial é textualmente e lexicalmente difícil. À luz do paralelismo com a descida ao Sheol, a tradução conserva a imprecação ligada à morte sem acrescentar uma ideia incerta de engano ou subitaneidade; a incerteza é registrada em nota.
- source_word: עָלֵימוֹ
  choice: sobre eles
  rationale: Equivalente natural da preposição com sufixo de terceira pessoa masculina plural, mantendo o tom poético.
- source_word: יֵרְדוּ
  choice: que desçam
  rationale: Expressa a força volitiva ou jussiva própria da imprecação e preserva a imagem vertical do hebraico.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o termo hebraico e sua amplitude sem identificá-lo indevidamente com inferno ou apenas com sepultura.
- source_word: חַיִּים
  choice: vivos
  rationale: Indica que eles descem ao Sheol ainda em vida; esta é a formulação idiomática e direta em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão da imprecação em registro poético digno.
- source_word: רָעוֹת
  choice: maldade
  rationale: O plural hebraico pode funcionar coletivamente; neste contexto, designa o mal moral, e não simples calamidades.
- source_word: בִּמְגוּרָם
  choice: em sua morada
  rationale: Representa o sentido contextual de lugar de habitação, preservando em nota a possibilidade lexical ligada a residência ou peregrinação.
- source_word: בְּקִרְבָּם
  choice: no meio deles
  rationale: Mantém a ambiguidade entre o que está dentro deles e o que se encontra entre eles como grupo, sem a resolver silenciosamente.
theological_decisions:
- issue: Natureza de שְׁאוֹל na tradução
  choice: Manter “Sheol” no texto principal
  alternative: “a sepultura” ou “o mundo dos mortos”
  rationale: A transliteração preserva a imagem poética e a extensão semântica do termo na Bíblia Hebraica, evitando importar a noção teológica posterior e mais específica de “inferno”.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Que desçam” conserva a força imprecatória; “maldade” comunica o valor moral de רָעוֹת. As quatro notas aparecem em ordem natural no texto e preservam as dificuldades e ambiguidades reais do hebraico.
