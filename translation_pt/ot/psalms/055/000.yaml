  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: pt
  text: 'Ao regente: com instrumentos de corda. Um masquil[a] de Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um salmo instrutivo” ou “um cântico contemplativo”; o sentido exato de masquil nos títulos dos salmos é incerto.
    reason: lexical_alternative
  - marker: b
    text: A expressão “de Davi” também pode significar “por Davi” ou “para Davi”.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para o regente
  rationale: Nos títulos dos salmos, o particípio derivado de נצח designa provavelmente o responsável pela execução musical. “Regente” é atual e inteligível, e “para” representa o prefixo ל sem tornar a função mais específica do que o hebraico.
- source_word: בִּנְגִינֹת
  choice: com instrumentos de cordas
  rationale: O termo נְגִינֹת, neste contexto litúrgico, aponta provavelmente para acompanhamento executado em instrumentos de cordas. “Com” expressa naturalmente esse acompanhamento.
- source_word: מַשְׂכִּיל
  choice: um masquil
  rationale: Como o sentido exato deste termo técnico nos títulos dos salmos é incerto, mantém-se uma transliteração aportuguesada, com possíveis sentidos explicados em nota, em vez de escolher uma interpretação específica no texto.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção com ל pode indicar autoria, associação, destinação ou pertencimento. “De Davi” conserva em português uma amplitude maior do que “escrito por Davi”.
theological_decisions:
- issue: Autoria ou associação expressa por לְדָוִד
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não define necessariamente uma única relação entre Davi e o salmo. A formulação escolhida preserva essa ambiguidade e não transforma a inscrição em uma afirmação inequívoca de autoria direta.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa inteligibilidade no Brasil e sem regionalismos marcados. O termo técnico “masquil” foi preservado para não eliminar a incerteza lexical do original.
