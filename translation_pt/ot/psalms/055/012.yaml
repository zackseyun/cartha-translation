  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: pt
  text: Pois não é um inimigo que me insulta[a] — eu poderia suportar isso; não é quem me odeia que se engrandeceu contra mim[b] — eu poderia me esconder dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me afronta” ou “zomba de mim”. O verbo hebraico indica abuso verbal marcado por desprezo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “se fez grande contra mim”, isto é, portou-se com arrogância contra mim.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da lamentação no contexto e mantém a ligação discursiva natural em poesia portuguesa.
- source_word: אוֹיֵב
  choice: inimigo
  rationale: Equivalente comum e claro para o adversário mencionado pelo salmista.
- source_word: יְחָרְפֵנִי
  choice: me insulta
  rationale: O verbo חרף indica afronta verbal marcada por desprezo; “insulta” comunica isso de modo direto e atual.
- source_word: וְאֶשָּׂא
  choice: isso eu poderia suportar
  rationale: נשׂא tem aqui o sentido idiomático de suportar ou aguentar. O valor potencial decorre da situação contrária aos fatos, e “isso” explicita naturalmente o que seria suportado.
- source_word: מְשַׂנְאִי
  choice: quem me odeia
  rationale: Expressa de modo idiomático o particípio substantivado, preservando seu caráter pessoal.
- source_word: עָלַי הִגְדִּיל
  choice: se engrandece contra mim
  rationale: Preserva a imagem hebraica de fazer-se grande em oposição a alguém, sem reduzir o sentido apenas a uma explicação como “age com arrogância”.
- source_word: וְאֶסָּתֵר מִמֶּנּוּ
  choice: dele eu poderia me esconder
  rationale: Reproduz o sentido reflexivo do nifal e o valor potencial da construção contrária aos fatos; a ordem destaca a pessoa da qual seria possível esconder-se.
