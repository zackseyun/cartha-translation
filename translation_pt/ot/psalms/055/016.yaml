  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: pt
  text: Quanto a mim, clamo a Deus, e Yahweh me salvará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: Quanto a mim
  rationale: O pronome independente está expresso e vem em posição inicial enfática; a formulação comunica naturalmente em português seu valor contrastivo.
- source_word: אֶל אֱלֹהִים
  choice: a Deus
  rationale: A preposição indica a direção do clamor, e אֱלֹהִים se refere aqui ao único Deus, em paralelo com Yahweh.
- source_word: אֶקְרָא
  choice: clamo
  rationale: O imperfeito qal na primeira pessoa pode ter nuance presente, habitual ou futura. No contexto, o presente expressa de modo conciso o apelo do salmista; 'clamo' preserva a intensidade poética sem ampliar excessivamente o verbo.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: A conjunção é aditiva, e o nome divino יְהוָה é transliterado como 'Yahweh', preservando o nome próprio presente no hebraico.
- source_word: יוֹשִׁיעֵנִי
  choice: me salvará
  rationale: O hifil de ישׁע significa 'salvar, livrar'. O futuro comunica a confiança prospectiva do salmista e mantém o sentido lexical central da raiz.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Nuance temporal de אֶקְרָא e יוֹשִׁיעֵנִי
  choice: presente para o clamor e futuro para a salvação
  alternative: 'futuro em ambos: ''clamarei... me salvará''; presente em ambos: ''clamo... me salva'''
  rationale: Os imperfeitos hebraicos permitem mais de uma nuance. A combinação escolhida representa o apelo atual do salmista e sua confiança na intervenção futura, sem negar as alternativas gramaticais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. 'Quanto a mim' conserva a ênfase contrastiva; 'clamo' é poético, corrente e mais intenso que o simples 'chamo'.
