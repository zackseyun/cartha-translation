base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: pt
  text: Dia e noite, eles circulam ao redor dela, sobre as muralhas dela[a]; maldade e sofrimento[b] estão no meio dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles a cercam sobre as muralhas dela”. O verbo hebraico pode enfatizar tanto o movimento ao redor como o ato de cercar.
    reason: lexical_alternative
  - marker: b
    text: “Maldade e sofrimento” também pode ser traduzido como “iniquidade e aflição” ou “perversidade e opressão”, pois os termos hebraicos podem indicar tanto o mal moral como o sofrimento que ele produz.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Dia e noite
  rationale: Expressão temporal idiomática que comunica atividade contínua, em linguagem portuguesa natural.
- source_word: יְסוֹבְבֻהָ
  choice: eles a rondam
  rationale: O verbo סבב pode indicar dar voltas, rodear ou cercar. “Rondam” preserva a ideia de movimento repetido, enquanto o pronome feminino retoma a cidade personificada.
- source_word: עַל חוֹמֹתֶיהָ
  choice: sobre as suas muralhas
  rationale: Traduz diretamente עַל como “sobre” e conserva a imagem das forças que circulam nas muralhas da cidade.
- source_word: אָוֶן
  choice: maldade
  rationale: O termo pode denotar perversidade, iniquidade ou o mal danoso. “Maldade” mantém aqui sua dimensão moral sem linguagem excessivamente técnica.
- source_word: עָמָל
  choice: sofrimento
  rationale: O termo abrange sofrimento, aflição, trabalho penoso e opressão. “Sofrimento” expressa o dano presente na cidade e se distingue de “maldade”.
- source_word: בְּקִרְבָּהּ
  choice: estão dentro dela
  rationale: Equivale a “no meio dela” e preserva de modo natural a personificação feminina da cidade.
