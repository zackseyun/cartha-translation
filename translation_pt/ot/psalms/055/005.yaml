  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: pt
  text: Medo e tremor vêm sobre mim, e o horror me cobre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o terror me cobre” ou “o estremecimento me cobre”.'
