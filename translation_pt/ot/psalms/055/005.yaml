lexical_decisions:
- source_word: יִרְאָה
  choice: medo
  rationale: O substantivo expressa medo ou pavor; “medo” é direto, natural e forma uma expressão clara com “tremor”.
- source_word: וָרַעַד
  choice: e tremor
  rationale: O termo indica o tremor físico associado ao terror; “tremor” conserva tanto o aspecto corporal quanto o emocional.
- source_word: יָבֹא בִי
  choice: vêm sobre mim
  rationale: Embora a construção seja literalmente “vem em mim”, “vêm sobre mim” comunica em português a experiência que se apodera do salmista. O verbo fica no plural por concordar naturalmente com o sujeito composto “medo e tremor”.
- source_word: וַתְכַסֵּנִי
  choice: e o horror me cobre
  rationale: A raiz כסה significa “cobrir”; a tradução preserva a metáfora hebraica em vez de explicitá-la como “dominar” ou “subjugar”.
- source_word: פַּלָּצוּת
  choice: horror
  rationale: O substantivo pode designar horror, terror ou estremecimento. “Horror” transmite a intensidade do estado e combina naturalmente com a imagem de algo que cobre o salmista.
