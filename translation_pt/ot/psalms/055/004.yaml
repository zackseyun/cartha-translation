lexical_decisions:
- source_word: לִבִּי
  choice: meu coração
  rationale: לֵב designa aqui o centro interior das emoções e pensamentos; «meu coração» é natural em português e preserva a força corporal da imagem.
- source_word: יָחִיל
  choice: se contorce
  rationale: O verbo de חול/חיל pode expressar contorção, tremor ou angústia. «Se contorce» comunica a aflição interior intensa e mantém a imagem visceral, enquanto a nota registra alternativas legítimas.
- source_word: בְּקִרְבִּי
  choice: dentro de mim
  rationale: קֶרֶב com sufixo de primeira pessoa refere-se ao interior da pessoa; «dentro de mim» é claro, corrente e poeticamente adequado.
- source_word: אֵימוֹת
  choice: os terrores
  rationale: O plural de אֵימָה indica terrores ou pavores intensos; «os terrores» preserva tanto o número quanto o peso emocional.
- source_word: מָוֶת
  choice: da morte
  rationale: A relação nominal é mantida sem decidir se a morte é fonte, objeto ou personificação do terror.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O qatal apresenta a ação como realizada. «Caíram sobre mim» conserva a metáfora hebraica direta e seu efeito de súbita opressão.
- source_word: עָלָי
  choice: sobre mim
  rationale: É o equivalente direto e natural de עַל com sufixo de primeira pessoa, preservando a ideia de algo que sobrevém e oprime.
