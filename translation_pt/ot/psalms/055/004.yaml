  yaml_path: translation/ot/psalms/055/004.yaml
  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: pt
  text: Meu coração se contorce dentro de mim[a], e os terrores da morte caíram sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu coração treme dentro de mim”. O verbo hebraico pode indicar contorção, tremor ou angústia.'
