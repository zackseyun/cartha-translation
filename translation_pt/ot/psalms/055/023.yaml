source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: pt
  text: Mas tu, ó Deus, os farás descer ao poço da destruição[a]; homens sanguinários e traiçoeiros não viverão nem metade dos seus dias[b]. Eu, porém, confiarei em ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao poço da corrupção”, “à cova da destruição” ou simplesmente “à cova”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não dividirão pela metade os seus dias”; isto é, a vida deles será abreviada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: os farás descer
  rationale: O hifil de ירד tem sentido causativo. “Farás descer” conserva essa força e a imagem de descenso sem especificar indevidamente como o juízo ocorrerá.
- source_word: לִבְאֵר שַׁחַת
  choice: ao poço da destruição
  rationale: בְּאֵר designa um poço ou uma cova, enquanto שַׁחַת pode indicar destruição, cova ou corrupção. A formulação mantém tanto a imagem concreta quanto sua associação com morte e juízo.
- source_word: אַנְשֵׁי דָמִים
  choice: homens sanguinários
  rationale: A expressão hebraica, literalmente “homens de sangues”, caracteriza pessoas violentas e culpadas de derramamento de sangue. “Homens sanguinários” comunica esse sentido de modo natural e vívido.
- source_word: וּמִרְמָה
  choice: e traiçoeiros
  rationale: מִרְמָה abrange engano, fraude e traição. O adjetivo “traiçoeiros” coordena-se naturalmente com “sanguinários” e caracteriza os mesmos homens sem perder a dimensão moral do termo.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: não viverão nem metade dos seus dias
  rationale: A expressão, literalmente relacionada a “dividir pela metade os seus dias”, é uma maneira enfática de dizer que a vida deles será abreviada. A redação portuguesa mantém a referência à metade dos dias e comunica claramente o idioma.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: Eu, porém, confiarei em ti
  rationale: O pronome explícito וַאֲנִי é enfático e contrasta o salmista com os homens descritos anteriormente. “Eu, porém” preserva esse contraste, e o futuro “confiarei” corresponde ao aspecto volitivo ou prospectivo da declaração.
theological_decisions:
- issue: Natureza da imagem de juízo em “poço da destruição”
  choice: Manter uma imagem vívida de juízo divino que conduz à morte ou destruição, sem transformá-la em termo técnico para um destino escatológico específico.
  alternative: Traduzir como “sepultura”, “Sheol” ou “corrupção”.
  rationale: O hebraico evoca uma cova destrutiva, mas não exige aqui uma identificação doutrinária mais precisa. A tradução conserva a força judicial e mortal da imagem sem resolver sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ó Deus” marca o vocativo de forma natural; “Eu, porém” preserva a ênfase contrastiva do hebraico. A imagem do poço foi mantida, e os marcadores de nota foram posicionados junto às expressões que explicam.
