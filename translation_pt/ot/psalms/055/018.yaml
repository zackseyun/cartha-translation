base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: pt
  text: Resgatou em paz a minha alma da batalha contra mim, pois muitos estavam comigo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pois muitos estavam contra mim». Literalmente: «pois muitos estavam comigo».'
    reason: Registra a leitura adversativa contextual da oração final sem substituir, no texto principal, o sentido lexical direto de עִמָּדִי («comigo»).
lexical_decisions:
- source_word: פָּדָה
  choice: resgatou
  rationale: Expressa o ato de libertar ou redimir mediante resgate, preservando a força do verbo hebraico e soando naturalmente em português.
- source_word: בְשָׁלוֹם
  choice: em paz
  rationale: Mantém de forma direta a construção hebraica e deixa aberta a amplitude de paz, integridade e bem-estar.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva o idioma e o registro poético do hebraico, sem reduzir o termo apenas a 'vida' ou ao pronome 'me'.
- source_word: מִקֲּרָב לִי
  choice: da batalha contra mim
  rationale: Conserva a imagem militar de קְרָב e entende לִי, de modo contextual, como referência à batalha dirigida contra o salmista.
- source_word: כִּי
  choice: pois
  rationale: Introduz com naturalidade em português a explicação ou razão apresentada pela oração final.
- source_word: בְרַבִּים
  choice: muitos
  rationale: Representa concisamente a ideia de pluralidade ou grande número contida na expressão hebraica.
- source_word: עִמָּדִי
  choice: comigo
  rationale: Traduz o sentido lexical mais direto da preposição עם e preserva a tensão da frase no contexto de conflito.
theological_decisions:
- issue: Interpretação da oração final בְרַבִּים הָיוּ עִמָּדִי
  choice: pois muitos estavam comigo
  alternative: pois muitos estavam contra mim
  rationale: עִמָּדִי significa mais diretamente 'comigo', embora o contexto permita entender a expressão idiomaticamente como referência a numerosos adversários. O texto principal mantém a formulação hebraica e sua ambiguidade, enquanto a nota registra a interpretação contextual alternativa.
translation_notes:
  register: Português moderno, claro e poético, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A colocação possessiva 'a minha alma' mantém dignidade e transparência, e a nota preserva a ambiguidade genuína da última oração.
