  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: pt
  text: 'E eu disse[a]: “Quem me dera asas como as de uma pomba! Eu voaria para longe e habitaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais literal: “E eu disse: ‘Quem me dará asas como as de uma pomba? Eu voaria para longe e habitaria.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O wayyiqtol de אמר dá sequência ao discurso do salmista; a formulação preserva essa progressão simples.
- source_word: מִי יִתֶּן לִּי
  choice: Quem me dera
  rationale: A pergunta literal ‘quem dará a mim?’ funciona aqui como expressão de desejo. A locução portuguesa comunica naturalmente esse valor optativo sem especificar um doador.
- source_word: אֵבֶר
  choice: asas
  rationale: Embora o substantivo esteja no singular, tem sentido coletivo no quadro do voo; em português, o plural é a forma natural.
- source_word: כַּיּוֹנָה
  choice: como as da pomba
  rationale: Preserva a comparação introduzida por כ e deixa claro que as asas desejadas são semelhantes às da pomba.
- source_word: אָעוּפָה
  choice: Eu voaria para longe
  rationale: O coortativo expressa desejo; o condicional português mantém o tom aspirativo, e ‘para longe’ explicita naturalmente a ideia contextual de fuga.
- source_word: וְאֶשְׁכֹּנָה
  choice: e encontraria morada
  rationale: שכן significa habitar, permanecer ou estabelecer-se. A expressão é digna e natural, preservando a ideia de chegar a um lugar onde permanecer, sem substituir diretamente o verbo pela interpretação ‘descansar’.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação principal comunica o valor desiderativo do idioma hebraico; a nota conserva mais de perto sua forma interrogativa e o sentido lexical de שכן.
