  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: pt
  text: 'Há males destrutivos dentro dela;[a]

    a opressão e o engano não se afastam de sua praça.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há calamidades dentro dela” ou “Há ruína dentro dela”. O substantivo hebraico está no plural e pode indicar males, calamidades ou atos destrutivos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de suas ruas”. O termo hebraico pode referir-se mais especificamente a uma praça ou a outro espaço público aberto da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: males destrutivos
  rationale: O substantivo hebraico está no plural e pode designar calamidades, ruínas ou atos que causam destruição. A expressão preserva o plural e comunica naturalmente males de caráter destrutivo.
- source_word: בְּקִרְבָּהּ
  choice: dentro dela
  rationale: Reproduz o sentido espacial de 'em seu interior' e mantém a personificação feminina da cidade.
- source_word: יָמִישׁ
  choice: não se afastam
  rationale: Expressa a presença contínua dos dois males mencionados. Embora a forma hebraica seja singular, em português a concordância no plural com 'a opressão e o engano' é natural.
- source_word: מֵרְחֹבָהּ
  choice: de sua praça
  rationale: רְחוֹב designa frequentemente um espaço público amplo ou uma praça urbana; 'praça' conserva melhor esse sentido específico do que o mais abrangente 'ruas'.
- source_word: תֹּךְ
  choice: opressão
  rationale: Neste contexto de males sociais presentes no espaço público, o termo pode indicar opressão ou extorsão; 'opressão' é claro, abrangente e adequado ao contexto.
- source_word: וּמִרְמָה
  choice: e o engano
  rationale: מִרְמָה pode significar engano, fraude ou traição. 'Engano' mantém a amplitude lexical e forma uma combinação natural com 'opressão'.
