  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: pt
  text: Deus ouvirá e os humilhará[a] — ele, que está entronizado desde a antiguidade (Selá) — pois não há mudanças para eles[b], e eles não temem a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhes responderá”. O verbo hebraico pode ser entendido como “responder”, mas, no contexto, também pode ter o sentido de humilhar ou afligir em juízo.
    reason: alternative_reading
  - marker: b
    text: Ou “para quem não há reviravoltas”. A expressão hebraica é difícil e pode referir-se a uma condição sem perturbações que favorece a complacência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: ouvirá
  rationale: O imperfeito qal pode indicar ação futura ou habitual; no contexto da oração, o futuro expressa a confiança do salmista na intervenção de Deus.
- source_word: אֵל
  choice: Deus
  rationale: É um título divino poético comum; “Deus” é a forma natural em português sem acrescentar uma ênfase não exigida pelo contexto.
- source_word: וְיַעֲנֵם
  choice: os humilhará
  rationale: No contexto de juízo contra os perversos, o verbo pode indicar que Deus os humilhará ou afligirá. A leitura “lhes responderá” continua lexicalmente possível e é preservada em nota.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: ele, que está entronizado desde a antiguidade
  rationale: O particípio de ישׁב, aplicado a Deus, pode expressar permanência e governo real; קֶדֶם aponta para tempos antigos.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional, pois o significado e a função exatos do termo são incertos.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: pois não há mudanças para eles
  rationale: A expressão difícil é mantida próxima da forma hebraica. חֲלִיפוֹת pode designar mudanças, alternâncias ou reviravoltas nas circunstâncias, talvez sugerindo uma vida sem perturbações que alimenta a complacência.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: e eles não temem a Deus
  rationale: O perfeito hebraico descreve aqui uma disposição estabelecida; o presente português comunica naturalmente esse estado contínuo.
theological_decisions:
- issue: Sentido de ענה no segundo verbo
  choice: ação judicial de Deus que humilha os inimigos
  alternative: Deus lhes responderá
  rationale: O contexto imediato trata de malfeitores hostis e da intervenção julgadora de Deus. “Os humilhará” preserva esse possível valor punitivo, enquanto a leitura formalmente possível “lhes responderá” é registrada em nota para não eliminar a ambiguidade.
- issue: Relação entre a ausência de mudanças e a falta de temor
  choice: a oração causal é mantida sem explicar além do texto
  alternative: explicitar que uma vida tranquila produziu complacência
  rationale: O hebraico sugere uma ligação, mas não especifica plenamente sua natureza; a tradução preserva essa tensão sem inserir uma explicação interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção parentética preserva o título divino e mantém “Selá” sem lhe atribuir significado incerto. A formulação deliberadamente literal “não há mudanças para eles” conserva a dificuldade do hebraico, esclarecida apenas em nota.
