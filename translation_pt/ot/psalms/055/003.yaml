  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: pt
  text: 'Por causa da voz do inimigo,

    por causa da opressão do perverso;

    pois fazem cair desgraça sobre mim[a]

    e, com ira, me odeiam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazem cair o mal sobre mim”. A palavra hebraica pode indicar desgraça, dano, maldade ou iniquidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: Por causa da voz do inimigo
  rationale: מִן é entendido causalmente, em paralelo com מִפְּנֵי. Mantém-se a imagem concreta da “voz” e o singular hebraico “inimigo”.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: por causa da opressão do perverso
  rationale: עָקָה comunica pressão, angústia ou opressão; no contexto de hostilidade sofrida, “opressão” expressa bem a aflição imposta. “Perverso” preserva a caracterização moral do singular רָשָׁע.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: fazem cair desgraça sobre mim
  rationale: O hifil de מוט preserva a imagem de fazer algo cair sobre alguém. “Desgraça” expressa aqui o dano ou a aflição imposta, sem eliminar a possível conotação moral de אָוֶן, registrada em nota.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: e, com ira, me odeiam
  rationale: אַף tem o sentido idiomático de ira, e שׂטם denota ódio ou hostilidade persistente. A formulação é clara, natural e próxima da estrutura hebraica.
