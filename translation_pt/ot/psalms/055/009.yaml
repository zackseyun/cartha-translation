  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: pt
  text: Confunde-os[a], Senhor; divide a fala deles[b], pois tenho visto violência e conflito na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Engole-os, Senhor” ou “Destrói-os, Senhor”. O verbo hebraico pode ter um sentido destrutivo mais literal, embora aqui talvez signifique arruinar os planos deles por meio da confusão.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “divide a língua deles”; isto é, interrompe a capacidade deles de falar uns com os outros ou de compreender uns aos outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Confunde-os
  rationale: Embora o verbo frequentemente signifique literalmente “engolir” ou, por extensão, “destruir”, o paralelismo imediato com “divide a fala deles” favorece aqui a ideia de frustrar os planos dos inimigos mediante confusão. A ambiguidade genuína é preservada em nota.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo natural, sem confundi-lo com o nome divino YHWH.
- source_word: פַּלַּג
  choice: divide
  rationale: O imperativo significa “dividir” ou “separar”; “divide” preserva a forma direta da súplica e a possível evocação da divisão da linguagem em Babel.
- source_word: לְשׁוֹנָם
  choice: a fala deles
  rationale: לָשׁוֹן significa literalmente “língua”, mas aqui se refere idiomaticamente à fala ou linguagem. “A fala deles” é clara em português e mantém o foco na comunicação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da súplica e mantém um registro poético natural.
- source_word: רָאִיתִי
  choice: vejo
  rationale: O perfeito hebraico apresenta aquilo que o salmista constatou e que permanece diante dele. No contexto do salmo, o presente português comunica naturalmente essa realidade observada; “tenho visto” também seria possível.
- source_word: חָמָס
  choice: violência
  rationale: Expressa com clareza a ideia de violência, brutalidade ou injustiça violenta.
- source_word: וְרִיב
  choice: e conflito
  rationale: רִיב pode indicar disputa, contenda ou conflito. “Conflito” é corrente e forma um par natural com “violência”.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Tradução locativa direta e natural.
theological_decisions:
- issue: Sentido do imperativo בַּלַּע em relação a “divide a fala deles”
  choice: Traduzir como uma súplica para que os inimigos sejam confundidos.
  alternative: “Engole-os, Senhor” ou “Destrói-os, Senhor”.
  rationale: O paralelismo com a divisão da fala favorece a ideia de comunicação frustrada e desintegração dos planos, possivelmente evocando Babel. Como o sentido literal ou destrutivo continua possível, ele é mantido na nota, sem eliminar a tensão do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A sintaxe conserva o paralelismo poético e os imperativos do hebraico. As notas preservam tanto o sentido literal de בַּלַּע quanto a imagem literal de “língua”.
