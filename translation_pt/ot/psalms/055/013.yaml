  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: pt
  text: Mas você, homem igual a mim, meu companheiro[a] e meu amigo íntimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu guia”; o termo hebraico pode designar tanto um associado próximo como alguém que lidera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção e o pronome introduzem um contraste forte com o contexto anterior; “Mas você” expressa naturalmente a surpresa dolorosa da interpelação.
- source_word: אֱנוֹשׁ
  choice: homem
  rationale: O substantivo designa aqui um ser humano do sexo masculino. O foco contextual está na identidade do traidor, não especialmente na fragilidade ou mortalidade humana.
- source_word: כְּעֶרְכִּי
  choice: igual a mim
  rationale: A expressão derivada de עֵרֶךְ indica equivalência ou posição comparável. “Igual a mim” é clara, concisa e preserva o sentido relacional.
- source_word: אַלּוּפִי
  choice: meu companheiro
  rationale: O termo pode designar um associado próximo, companheiro ou líder/guia. No paralelismo com “meu amigo íntimo”, “companheiro” comunica proximidade sem eliminar a alternativa lexical, registrada em nota.
- source_word: וּמְיֻדָּעִי
  choice: e meu amigo íntimo
  rationale: A forma derivada de ידע descreve alguém conhecido de perto. “Amigo íntimo” transmite a familiaridade e a força emocional do lamento melhor do que “conhecido”.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com leitura fluente no Brasil e compreensão ampla no espaço lusófono. A repetição dos possessivos conserva a intensidade pessoal do hebraico.
