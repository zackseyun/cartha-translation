lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força de chamar a atenção e mantém um tom poético digno, sem tornar a expressão obscura.
- source_word: אַרְחִיק נְדֹד
  choice: eu iria para bem longe, vagando
  rationale: Reproduz conjuntamente a ideia de afastar-se e o infinitivo absoluto de נדד, que pode sugerir vaguear ou fugir, sem reduzir a construção a uma única nuance.
- source_word: אָלִין
  choice: passaria a noite
  rationale: 'Expressa de modo natural e concreto o sentido habitual de לון/לין: pernoitar ou alojar-se.'
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, 'deserto' pode designar uma região erma e desabitada; aqui comunica naturalmente o lugar remoto buscado pelo salmista, embora não implique necessariamente um mar de areia.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo hebraico de sentido incerto, conforme a prática tradicional, em vez de impor uma interpretação conjectural.
