  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: pt
  text: Eis que eu iria para bem longe, vagando; passaria a noite no deserto.[a] Selá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu fugiria para bem longe e me alojaria numa região deserta”. O hebraico combina o ato de afastar-se com um termo que pode significar vaguear ou fugir; o verbo seguinte também pode ser traduzido por “eu me alojaria”.'
    reason: lexical_alternative
  - marker: b
    text: “Selá” é tradicionalmente deixado sem tradução. Seu significado exato é incerto; talvez seja uma indicação musical ou litúrgica.
