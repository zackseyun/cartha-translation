  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: pt
  text: Lança sobre Yahweh a tua carga[a], e ele te sustentará; jamais permitirá que o justo[b] seja abalado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua sorte”, “a tua preocupação” ou, possivelmente, “aquilo que ele te deu”. O substantivo hebraico é raro e pode referir-se, de modo mais amplo, ao que foi colocado sobre uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o justo”, no singular masculino; provavelmente empregado em sentido representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Lance
  rationale: O imperativo de שלך expressa lançar ou atirar algo sobre alguém. “Lance” mantém a imagem vívida e soa digno e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, distinguindo-o de títulos como “Senhor”.
- source_word: יְהָבְךָ
  choice: a sua carga
  rationale: O substantivo raro parece designar aquilo que pesa sobre a pessoa, sua carga, sorte ou cuidado. “Carga” preserva a imagem concreta e combina com a promessa de sustentação.
- source_word: יְכַלְכְּלֶךָ
  choice: ele o sustentará
  rationale: O verbo כלכל pode indicar sustentar, amparar ou prover. “Sustentará” reúne adequadamente as ideias de apoio e manutenção.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: jamais permitirá
  rationale: A construção idiomática nega de modo duradouro que Yahweh dê ou permita a instabilidade descrita a seguir.
- source_word: מוֹט
  choice: seja abalado
  rationale: O termo denota vacilar, cambalear ou perder a estabilidade. “Ser abalado” preserva a metáfora sem exigir a ideia de destruição total.
- source_word: לַצַּדִּיק
  choice: o justo
  rationale: O adjetivo substantivado está no singular masculino. “O justo” conserva essa forma e, em português bíblico corrente, pode ter valor representativo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. A transliteração preserva explicitamente o nome em vez de substituí-lo por um título.
- issue: Alcance da promessa de que o justo não será abalado
  choice: jamais permitirá que o justo seja abalado
  alternative: jamais permitirá que o justo sofra qualquer perturbação
  rationale: A tradução mantém a metáfora hebraica de instabilidade e não amplia a promessa para ausência de todo sofrimento ou aflição.
- issue: Valor representativo de לַצַּדִּיק
  choice: o justo
  alternative: a pessoa justa
  rationale: A forma singular masculina do hebraico é preservada, sem negar seu provável uso representativo.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. A colocação pronominal em “ele o sustentará” evita ambiguidade e mantém um registro digno; “carga” conserva a metáfora concreta do hebraico.
