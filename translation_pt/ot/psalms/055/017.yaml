base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: pt
  text: À tarde, de manhã e ao meio-dia, apresento minha queixa e gemo, e ele ouve a minha voz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “medito e murmuro”. O verbo traduzido por “apresento minha queixa” também pode significar “falo” ou “medito”; neste contexto de lamento, o sentido de queixa é o mais provável. O hebraico diz literalmente “ele ouve a minha voz”; pelo contexto, “ele” se refere a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: À tarde, de manhã e ao meio-dia
  rationale: Reproduz a sequência dos três períodos do dia em português natural, preservando o ritmo cumulativo do hebraico.
- source_word: אָשִׂיחָה
  choice: apresento minha queixa
  rationale: O verbo pode indicar meditar, falar ou lamentar; no contexto de aflição e em paralelo com o gemido, expressa mais provavelmente uma queixa verbal, sem eliminar sua amplitude lexical.
- source_word: וְאֶהֱמֶה
  choice: e gemo
  rationale: Expressa agitação audível ou lamento. “Gemo” é corrente, digno e adequado ao paralelismo com a queixa.
- source_word: וַיִּשְׁמַע
  choice: e ele ouve
  rationale: O presente comunica a ação habitual e a confiança do salmista no contexto poético, embora a forma hebraica também admita outras relações temporais.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Mantém o sentido concreto e pessoal de קוֹל no contexto da oração.
theological_decisions:
- issue: Sujeito implícito de וַיִּשְׁמַע
  choice: ele ouve
  alternative: Deus ouve / o SENHOR ouve
  rationale: O contexto identifica Deus como referente, mas o versículo hebraico não explicita o nome divino; por isso, preserva-se o pronome implícito sem acrescentar uma designação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a cadência dos três períodos do dia, a linguagem de lamento e o sujeito divino implícito no original.
