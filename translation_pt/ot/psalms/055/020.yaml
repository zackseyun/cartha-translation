  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: pt
  text: Ele estendeu as mãos contra os que viviam em paz com ele[a]; profanou sua aliança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra seus amigos” ou “contra seus aliados”. A expressão hebraica se refere a pessoas que mantinham uma relação de paz com ele.
    reason: lexical_alternative
  - marker: b
    text: Ou “violou sua aliança”. O verbo hebraico significa mais literalmente “profanou” ou “tratou como algo contaminado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: estendeu
  rationale: Com “mãos” como objeto e em contexto hostil, o verbo descreve o ato de estender ou lançar as mãos contra alguém. “Estendeu” preserva a imagem concreta do hebraico sem reduzi-la ao mais interpretativo “atacou”.
- source_word: יָדָיו
  choice: as mãos
  rationale: 'A forma do texto é plural, com sufixo masculino singular: literalmente, “suas mãos”. Em português, “estendeu as mãos” comunica naturalmente a posse pelo sujeito e mantém o plural.'
- source_word: בִּשְׁלֹמָיו
  choice: contra os que viviam em paz com ele
  rationale: A expressão designa pessoas que mantinham relações pacíficas com ele. “Contra” explicita a força hostil da preposição neste contexto, enquanto a formulação evita restringir o sentido a “amigos” ou “aliados”.
- source_word: חִלֵּל
  choice: profanou
  rationale: O piel de חלל pode significar profanar, tornar comum ou tratar como contaminado. “Profanou” conserva a força moral e religiosa da expressão, embora “violou” seja uma alternativa contextual possível.
- source_word: בְּרִיתוֹ
  choice: sua aliança
  rationale: בְּרִית é o termo habitual para uma aliança ou pacto. O possessivo é mantido sem especificar se se trata de uma aliança divina ou de um compromisso humano.
theological_decisions:
- issue: Natureza da linguagem de aliança
  choice: “Pro­fanou sua aliança”, preservando a linguagem solene e relacional do hebraico.
  alternative: “Violou seu pacto” ou “quebrou seu acordo”.
  rationale: O contexto condena a traição de alguém que estava em relação pacífica com outros, mas não identifica explicitamente esta aliança como a aliança de Deus. A tradução mantém a gravidade do termo sem importar uma referência teológica não declarada.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das orações e a imagem das mãos foram preservadas; as notas registram alternativas lexicais genuínas sem resolver além do que o hebraico permite.
