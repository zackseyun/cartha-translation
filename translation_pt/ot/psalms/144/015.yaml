  text: אַשְׁרֵ֣י הָ֭/עָם שֶׁ/כָּ֣כָה לּ֑/וֹ אַֽשְׁרֵ֥י הָ֝/עָ֗ם שֶׁ/יֲהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: pt
  text: Feliz o povo para quem as coisas são assim; feliz o povo cujo Deus é Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança descreve uma condição invejável de plenitude e favor, não apenas uma emoção passageira. Em português, “Feliz” é natural, digna e tradicional nesse gênero.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa aqui um povo como coletividade; “o povo” preserva o sentido relacional e poético sem a conotação política mais forte de “a nação”.
- source_word: שֶׁכָּכָה לּוֹ
  choice: para quem tudo é assim
  rationale: A expressão combina a ideia de “assim/desse modo” com לּוֹ, indicando que a condição descrita anteriormente pertence ao povo. “Tudo é assim” torna explícita, sem detalhá-la, a referência resumidora ao quadro dos versículos anteriores.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: cujo Deus é
  rationale: O sufixo masculino singular retoma coletivamente “o povo”; a construção possessiva portuguesa “cujo Deus é” reproduz isso com clareza e concisão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituir por um título.
- issue: Sentido de אַשְׁרֵי
  choice: Feliz
  alternative: Bem-aventurado
  rationale: “Feliz” comunica em português atual o estado de plenitude favorecida expresso pela fórmula hebraica, enquanto “bem-aventurado” é possível, mas menos corrente. A escolha não reduz a expressão a um sentimento momentâneo.
translation_notes:
  register: Português moderno, claro e poético, de ampla compreensão, com boa legibilidade brasileira. Mantém o paralelismo das duas declarações e a referência deliberadamente resumidora de “assim” ao contexto anterior.
