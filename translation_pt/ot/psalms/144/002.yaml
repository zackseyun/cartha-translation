  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: pt
  text: Meu amor leal e minha fortaleza, meu alto refúgio e meu libertador[a], meu escudo, em quem me refugio, aquele que sujeita o meu povo[b] debaixo de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “meu libertador para mim”.'
    reason: literal_rendering
  - marker: b
    text: Algumas versões antigas trazem “povos”; compare Salmos 18:47.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: meu amor leal
  rationale: חֶסֶד expressa amor firme, lealdade e misericórdia, muitas vezes no âmbito da aliança. Neste conjunto de títulos, a expressão designa Deus como aquele que personifica esse amor leal.
- source_word: מְצוּדָתִי
  choice: minha fortaleza
  rationale: O termo indica um lugar fortificado de defesa; “fortaleza” preserva de modo natural a imagem militar.
- source_word: מִשְׂגַּבִּי
  choice: meu alto refúgio
  rationale: Designa um lugar elevado e seguro. “Alto refúgio” mantém tanto a ideia de altura quanto a de proteção e evita repetir “fortaleza”.
- source_word: מְפַלְטִי לִי
  choice: meu libertador
  rationale: O particípio מְפַלְטִי apresenta Deus como aquele que livra. O dativo לִי reforça a relação pessoal, já comunicada de modo idiomático pelo possessivo “meu”; a forma mais explícita é registrada em nota.
- source_word: מָגִנִּי
  choice: meu escudo
  rationale: Tradução direta da metáfora militar de proteção.
- source_word: וּבוֹ חָסִיתִי
  choice: em quem me refugio
  rationale: חסה significa buscar ou encontrar refúgio. O presente comunica naturalmente a confiança contínua da confissão poética, sem reduzir a imagem ao sentido genérico de “confiar”.
- source_word: הָרוֹדֵד
  choice: aquele que sujeita
  rationale: O particípio descreve quem põe sob domínio. “Sujeita” preserva a força régia e militar do contexto.
- source_word: עַמִּי
  choice: o meu povo
  rationale: 'O texto massorético vocalizado traz o singular com sufixo de primeira pessoa: “meu povo”. A leitura plural apoiada por versões antigas é mantida em nota.'
- source_word: תַחְתָּי
  choice: debaixo de mim
  rationale: Preserva a metáfora espacial hebraica que expressa submissão à autoridade do rei.
theological_decisions:
- issue: Se עַמִּי deve ser traduzido como “meu povo” ou segundo a leitura plural “povos”.
  choice: o meu povo
  alternative: povos
  rationale: A leitura principal segue o Texto Massorético, que traz “meu povo”. Isso pode indicar que Deus põe o próprio povo do salmista sob sua autoridade régia, sem implicar necessariamente opressão. Como versões antigas e a passagem paralela de Salmos 18:47 favorecem o plural, a alternativa é explicitada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com imagens poéticas e militares preservadas. “Amor leal” comunica a amplitude de חֶסֶד sem recorrer ao arcaísmo “benignidade”. “Alto refúgio” distingue מִשְׂגָּב de מְצוּדָה, e a ordem das expressões acompanha de perto o hebraico.
