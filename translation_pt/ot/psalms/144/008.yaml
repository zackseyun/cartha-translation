  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: pt
  text: cuja boca fala coisas vãs[a], e cuja mão direita é uma mão direita de mentira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fala falsidade”. A palavra hebraica pode indicar vazio, vaidade, inutilidade ou falsidade.'
    reason: lexical_alternative
  - marker: b
    text: A repetição “mão direita... mão direita” reproduz a ênfase do hebraico. A mão direita podia estar associada a juramentos, poder ou fidelidade prometida; aqui, a expressão sugere engano ou traição.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: cuja
  rationale: Introduz a oração relativa que descreve os estrangeiros do versículo anterior e concorda naturalmente com “boca” e “mão direita”.
- source_word: פִּיהֶם
  choice: boca
  rationale: O hebraico traz o substantivo no singular com sufixo plural, construção coletiva que o português preserva de modo natural após “cuja”.
- source_word: דִּבֶּר
  choice: fala
  rationale: Embora formalmente perfeito, neste contexto descritivo exprime conduta característica; o presente é natural em português.
- source_word: שָׁוְא
  choice: falsidade
  rationale: O termo pode indicar vazio, vaidade, inutilidade ou engano. No contexto de fala hostil, “falsidade” comunica com clareza a dimensão enganosa sem excluir a ideia de palavras vazias.
- source_word: וִימִינָם
  choice: e cuja mão direita
  rationale: Mantém o paralelismo da segunda oração e expressa naturalmente a conjunção e o sufixo possessivo.
- source_word: יְמִין
  choice: mão direita
  rationale: 'Preserva a repetição enfática do hebraico: “mão direita... mão direita”.'
- source_word: שָׁקֶר
  choice: mentira
  rationale: Expressa de maneira corrente e digna a ideia de falsidade, fraude ou engano presente no hebraico.
