  text: אָ֭דָם לַ/הֶ֣בֶל דָּמָ֑ה יָ֝מָ֗י/ו כְּ/צֵ֣ל עוֹבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: pt
  text: O ser humano é semelhante a um sopro[a]; seus dias são como uma sombra que passa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um vapor”, “vaidade” ou “vazio”. A palavra hebraica ressalta aqui a transitoriedade e a falta de consistência da vida humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: o ser humano
  rationale: Aqui o substantivo faz uma afirmação genérica sobre a fragilidade humana. “O ser humano” comunica esse alcance inclusivo em português atual sem limitar o sentido a um indivíduo do sexo masculino.
- source_word: לַהֶבֶל
  choice: semelhante a um sopro
  rationale: הֶבֶל designa literalmente sopro ou vapor e, por extensão, aquilo que é transitório e inconsistente. “Sopro” preserva a imagem concreta e a brevidade sugerida pelo contexto.
- source_word: דָּמָה
  choice: é semelhante a
  rationale: O verbo expressa semelhança ou comparação. Esta formulação é natural, clara e digna em português.
- source_word: יָמָיו
  choice: seus dias
  rationale: Mantém a imagem hebraica dos dias como a duração da vida humana; o possessivo retoma “o ser humano” de modo natural.
- source_word: כְּצֵל
  choice: como uma sombra
  rationale: Preserva diretamente o símile poético introduzido pela preposição hebraica.
- source_word: עוֹבֵר
  choice: que passa
  rationale: O particípio descreve a sombra em movimento, passando e desaparecendo. A oração relativa conserva a vivacidade da imagem em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso mantém o paralelismo e as duas imagens concretas do hebraico. “O ser humano” evita uma leitura exclusivamente masculina, enquanto “seus dias” conserva a expressão poética do texto-fonte.
