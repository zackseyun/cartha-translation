base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: pt
  text: 'De Davi.[a]


    Bendito seja Yahweh, minha rocha,

    que treina minhas mãos para o combate

    e meus dedos para a guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Para Davi” ou “Por Davi”, no título do salmo; a preposição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A fórmula tradicional e concisa não determina em excesso a relação indicada por לְ, que pode expressar autoria, associação ou dedicação.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a forma litúrgica e doxológica da expressão hebraica, com naturalidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: צוּרִי
  choice: minha rocha
  rationale: Mantém a metáfora concreta de estabilidade e proteção presente no hebraico.
- source_word: הַמְלַמֵּד
  choice: que treina
  rationale: No contexto militar, comunica ensino e preparação prática, refletindo a ação característica expressa pelo particípio.
- source_word: יָדַי לַקְרָב
  choice: minhas mãos para o combate
  rationale: Conserva a linguagem corporal e militar, usando uma formulação corrente em português.
- source_word: אֶצְבְּעוֹתַי לַמִּלְחָמָה
  choice: meus dedos para a guerra
  rationale: Preserva tanto o termo específico 'dedos' quanto o paralelismo poético com a linha anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta diretamente o nome divino; a transliteração preserva essa particularidade em vez de substituí-la por um título.
- issue: Linguagem marcial aplicada a Deus
  choice: Manter literalmente que Deus treina mãos e dedos para o combate e a guerra
  alternative: Generalizar como fortalecimento ou preparação espiritual
  rationale: O hebraico descreve explicitamente preparação para conflito armado; suavizar ou espiritualizar a imagem eliminaria sua particularidade histórica e sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O título foi separado do corpo do versículo; o paralelismo hebraico e as imagens concretas foram preservados.
