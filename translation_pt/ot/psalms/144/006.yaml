  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: pt
  text: Faz reluzir o relâmpago e dispersa-os; lança as tuas flechas e põe-os em confusão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lança as tuas flechas e derrota-os”. O último verbo pode indicar causar pânico, confusão ou derrota em batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק
  choice: Faz reluzir
  rationale: O imperativo verbal de ברק pede que Deus faça irromper ou fulgurar o relâmpago. A expressão é natural em português e mantém a força causativa ou emissiva sugerida pelo contexto.
- source_word: בָּרָק
  choice: o relâmpago
  rationale: O substantivo designa relâmpago ou raio. O singular com valor coletivo preserva a forma hebraica e soa naturalmente em português poético.
- source_word: וּתְפִיצֵם
  choice: e dispersa-os
  rationale: A forma causativa de פוץ descreve fazer os inimigos se espalharem. “Dispersa-os” é clara, vigorosa e adequada ao contexto bélico.
- source_word: שְׁלַח
  choice: lança
  rationale: Com “flechas” como objeto, “lança” comunica de modo idiomático o ato de enviá-las, sem enfraquecer a imagem guerreira.
- source_word: חִצֶּיךָ
  choice: as tuas flechas
  rationale: Tradução direta do plural com sufixo de segunda pessoa masculina singular, preservando a imagem do guerreiro divino.
- source_word: וּתְהֻמֵּם
  choice: e põe-nos em confusão
  rationale: המה/המם pode indicar causar confusão, pânico ou derrota em batalha. A formulação preserva a força causativa e não restringe indevidamente o sentido a uma derrota completa.
theological_decisions:
- issue: Imagem de Deus como guerreiro
  choice: Manter a súplica direta a Deus por meio das imagens bélicas de relâmpago e flechas.
  alternative: Suavizar o verso como um pedido geral de ajuda ou juízo.
  rationale: O hebraico emprega imperativos e apresenta Deus em linguagem poética de combate. A tradução preserva essa representação sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação pronominal mantém um tom poético sem recorrer a vocabulário arcaico.
