base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: pt
  text: 'De Davi.[a]


    Bendito seja o SENHOR, minha rocha,

    que treina minhas mãos para o combate

    e meus dedos para a guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Para Davi” ou “Por Davi”. No título do salmo, a preposição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino YHWH segundo uma convenção portuguesa amplamente reconhecida, distinguindo-o tipograficamente do título comum “Senhor”.
- source_word: צוּרִי
  choice: minha rocha
  rationale: Preserva a metáfora hebraica direta de proteção, firmeza e segurança.
- source_word: הַמְלַמֵּד
  choice: que treina
  rationale: No contexto militar, “treina” expressa com naturalidade a ação de ensinar ou preparar as mãos para lutar.
- source_word: לַקְרָב ... לַמִּלְחָמָה
  choice: para o combate ... para a guerra
  rationale: Mantém o paralelismo hebraico e a pequena variação lexical entre confronto ou batalha e guerra.
theological_decisions:
- issue: Relação de Deus com a capacitação militar do salmista
  choice: que treina minhas mãos para o combate
  alternative: que ensina minhas mãos a combater
  rationale: A tradução preserva a afirmação explícita do texto sem ampliá-la em uma doutrina geral sobre guerra ou violência.
- issue: Forma do nome divino
  choice: o SENHOR
  alternative: Yahweh
  rationale: A forma em versalete é tradicional e inteligível em português, ao mesmo tempo que sinaliza que o hebraico traz o nome próprio divino YHWH.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética e paralelismo preservados. A nota mantém a ambiguidade genuína da rubrica hebraica.
