base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: pt
  text: Ó Yahweh, inclina os teus céus e desce[a]; toca nos montes, e eles fumegarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “baixa-te”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que fumeguem”; o hebraico também pode apresentar a fumaça como o resultado que se seguirá ao toque de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama e usa a partícula vocativa natural em português.
- source_word: הַט
  choice: inclina
  rationale: O imperativo de נטה descreve os céus sendo inclinados para baixo; “inclina” preserva a imagem poética e combina naturalmente com “desce”.
- source_word: שָׁמֶיךָ
  choice: os teus céus
  rationale: Preserva o plural e o sufixo possessivo de segunda pessoa, mantendo o tom elevado do hebraico.
- source_word: וְתֵרֵד
  choice: e desce
  rationale: Reproduz de modo direto e idiomático o movimento descendente expresso pelo verbo hebraico.
- source_word: גַּע
  choice: toca
  rationale: Traduz o sentido comum de נגע sem intensificá-lo indevidamente como “golpeia”.
- source_word: בֶּהָרִים
  choice: nos montes
  rationale: Representa o substantivo definido e conserva a imagem grandiosa da manifestação divina; “montes” é corrente e poético em português.
- source_word: וְיֶעֱשָׁנוּ
  choice: para que fumeguem
  rationale: Expressa a possível relação de resultado ou finalidade após o imperativo, sem ocultar na nota a alternativa de uma sequência coordenada futura.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação entre o toque divino e a fumaça dos montes
  choice: para que fumeguem
  alternative: e eles fumegarão
  rationale: A forma verbal após os imperativos pode indicar o resultado pretendido do toque, mas a coordenação com valor futuro também é possível; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e poético, com formas amplamente compreensíveis. O paralelismo dos imperativos foi preservado, assim como a imagem teofânica dos céus inclinados e dos montes fumegantes.
