base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: pt
  text: Estende a tua mão do alto[a]; resgata-me e livra-me das muitas águas[b], da mão de filhos de estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura tradicional do hebraico diz “a tua mão”; o texto consonantal traz “as tuas mãos”.
    reason: textual_variant
  - marker: b
    text: Também pode ser traduzida por “das grandes águas”. A expressão hebraica é uma imagem poética de perigo avassalador.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica “filhos de estrangeiros” é uma forma idiomática de dizer “estrangeiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Estende
  rationale: O imperativo de שׁלח, com “mãos” como objeto, descreve o ato de estendê-las. “Estende” conserva a imagem concreta e é natural em português.
- source_word: יָדֶיךָ
  choice: as tuas mãos
  rationale: A forma hebraica é plural, com sufixo de segunda pessoa masculina singular. A tradução mantém o número do texto massorético.
- source_word: מִמָּרוֹם
  choice: lá do alto
  rationale: מָרוֹם indica um lugar elevado ou as alturas. “Lá do alto” preserva a imagem espacial sem especificar “céu”, termo que não aparece no hebraico.
- source_word: פְּצֵנִי
  choice: resgata-me
  rationale: Neste contexto, o verbo פצה comunica tirar alguém do perigo. “Resgata-me” é claro, atual e funciona no paralelismo com “livra-me”.
- source_word: וְהַצִּילֵנִי
  choice: e livra-me
  rationale: נצל expressa livramento ou retirada do perigo. “Livra-me” mantém a distinção verbal e o paralelismo poético.
- source_word: מִמַּיִם רַבִּים
  choice: das muitas águas
  rationale: Tradução próxima da expressão hebraica, que literalmente fala de águas numerosas e, poeticamente, evoca um perigo avassalador.
- source_word: מִיַּד
  choice: da mão de
  rationale: Mantém a metáfora hebraica da mão como poder ou domínio e também o contraste poético com as mãos divinas no início do versículo.
- source_word: בְּנֵי נֵכָר
  choice: filhos de estrangeiros
  rationale: Preserva a expressão filial masculina do hebraico, que funciona idiomaticamente como designação de estrangeiros.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter “Estende as tuas mãos lá do alto”
  alternative: Intervém do céu
  rationale: O hebraico retrata concretamente a ação salvadora de Deus. A tradução conserva essa imagem, sem substituí-la por uma abstração.
- issue: Expressão masculina e filial em בְּנֵי נֵכָר
  choice: Traduzir por “filhos de estrangeiros” no texto principal
  alternative: estrangeiros
  rationale: A formulação preserva a estrutura e o gênero gramatical da expressão hebraica; a nota esclarece seu valor idiomático.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O paralelismo e as imagens concretas do hebraico foram preservados sem tornar a frase artificial.
