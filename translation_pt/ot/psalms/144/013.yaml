  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: pt
  text: Que os nossos celeiros estejam cheios, fornecendo provisões de toda espécie[a]; que os nossos rebanhos se multipliquem aos milhares, às dezenas de milhares, em nossos espaços abertos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de espécie em espécie”; a expressão indica provisões abundantes e variadas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em nossas ruas”. O termo hebraico pode indicar ruas, áreas exteriores ou outros espaços abertos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: os nossos celeiros
  rationale: O substantivo raro designa lugares de armazenamento ou provisão. “Celeiros” é natural no contexto agrícola e compreensível em português moderno.
- source_word: מְלֵאִים
  choice: estejam cheios
  rationale: O adjetivo predicativo significa “cheios”. A construção com “que” expressa naturalmente o tom de desejo ou bênção percebido no contexto, sem tornar a frase pesada.
- source_word: מְפִיקִים
  choice: fornecendo
  rationale: O particípio descreve os celeiros fazendo sair ou disponibilizando suas provisões. “Fornecendo” preserva esse movimento para fora com fluidez em português.
- source_word: מִזַּן אֶל זַן
  choice: provisões de toda espécie
  rationale: A expressão distributiva, literalmente “de espécie em espécie”, comunica variedade abundante. “Provisões” explicita o que sai dos celeiros sem restringir a frase apenas a um produto específico.
- source_word: צֹאנֵנוּ
  choice: os nossos rebanhos
  rationale: O coletivo hebraico se refere ao gado miúdo, especialmente ovelhas e cabras. “Rebanhos” conserva o sentido coletivo sem limitar indevidamente a uma só espécie.
- source_word: מַאֲלִיפוֹת
  choice: se multipliquem aos milhares
  rationale: A forma ligada a “mil” descreve aumento ou produção em milhares. A construção reflexiva é idiomática e preserva a imagem de crescimento dos rebanhos.
- source_word: מְרֻבָּבוֹת
  choice: às dezenas de milhares
  rationale: A forma derivada de “dez mil” intensifica o primeiro número. A formulação mantém a progressão paralela de milhares para dezenas de milhares.
- source_word: בְּחוּצוֹתֵינוּ
  choice: em nossos espaços abertos
  rationale: O termo pode indicar ruas, lugares exteriores ou áreas abertas. “Espaços abertos” preserva melhor essa amplitude lexical e se ajusta ao cenário pastoril sem introduzir explicitamente “campos”, palavra ausente do hebraico.
