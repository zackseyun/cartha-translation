  naturalness: O texto é claro e de registro adequado. «Da mão de estrangeiros» é uma expressão bíblica ainda compreensível em português moderno; «uma mão direita de engano» preserva a forma hebraica e permanece inteligível no contexto poético.
  terminology: «Resgata-me», «livra-me», «estrangeiros» e «falsidade» são escolhas adequadas. «Engano» corresponde bem a שקר e permite manter a repetição de «mão direita» sem recorrer ao menos preciso «enganadora».
