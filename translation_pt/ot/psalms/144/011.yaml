base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: pt
  text: Resgata-me e livra-me da mão de estrangeiros[a], cuja boca profere falsidade[b] e cuja mão direita é uma mão direita de engano.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de estrangeiro”, expressão idiomática que significa “estrangeiros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “profere vaidade” ou “profere coisas vazias”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico repete “mão direita”: “cuja mão direita é uma mão direita de engano”. A mão direita pode simbolizar poder, juramento ou ação.'
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Resgata-me
  rationale: O imperativo de פצה com sufixo de primeira pessoa pede libertação ou resgate. “Resgata-me” transmite a urgência e mantém um verbo distinto do seguinte.
- source_word: וְהַצִּילֵנִי
  choice: e livra-me
  rationale: O Hifil imperativo de נצל significa arrancar do perigo ou livrar. “Livra-me” preserva o paralelismo sem fundir os dois verbos.
- source_word: מִיַּד
  choice: do poder de
  rationale: Literalmente “da mão de”; aqui, “mão” representa domínio ou poder. A formulação explicita naturalmente o sentido idiomático em português, enquanto a imagem da mão permanece no segundo hemistíquio.
- source_word: בְּנֵי נֵכָר
  choice: estrangeiros
  rationale: A expressão literal “filhos do estrangeiro/da terra estrangeira” funciona como designação idiomática de estrangeiros.
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: cuja boca profere falsidade
  rationale: שָׁוְא pode indicar vazio, inutilidade ou falsidade. Em paralelo com שֶׁקֶר, “falsidade” comunica o sentido moral sem eliminar a alternativa lexical, registrada em nota.
- source_word: וִימִינָם יְמִין שָׁקֶר
  choice: e cuja mão direita é uma mão direita enganadora
  rationale: Preserva a repetição enfática de “mão direita”. O adjetivo “enganadora” expressa שֶׁקֶר de modo natural, sem transformar a mão em uma abstração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o paralelismo poético e a repetição hebraica significativa, mas traduz idiomaticamente “da mão de” como “do poder de”. Os marcadores seguem cada expressão pertinente.
