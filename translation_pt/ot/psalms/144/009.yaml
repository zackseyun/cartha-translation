base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: pt
  text: Ó Deus, cantarei a ti uma nova canção; com uma harpa de dez cordas[a], tocarei para ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com um alaúde de dez cordas» ou, de modo mais geral, «com um instrumento de dez cordas»; não se sabe ao certo qual instrumento antigo é designado por נֵבֶל.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo em uma invocação direta; «Ó Deus» preserva o tom poético e reverente sem acrescentar conteúdo.
- source_word: שִׁיר חָדָשׁ
  choice: uma nova canção
  rationale: Equivalente direto, natural e consagrado em português, preservando o motivo bíblico da «nova canção».
- source_word: אָשִׁירָה
  choice: cantarei
  rationale: A forma coortativa de primeira pessoa expressa intenção ou resolução; o futuro «cantarei» comunica esse valor de modo natural.
- source_word: לָּךְ
  choice: a ti / para ti
  rationale: A preposição indica o destinatário do louvor. Na primeira oração, «a ti» combina naturalmente com «cantarei»; na segunda, «para ti» evita rigidez e mantém o mesmo referente.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: com uma harpa de dez cordas
  rationale: נֵבֶל designa um instrumento de cordas cuja identificação exata é incerta; «harpa» é uma tradução tradicional e inteligível. A preposição instrumental בְּ é representada naturalmente por «com».
- source_word: אֲזַמְּרָה
  choice: tocarei
  rationale: O piel de זמר pode indicar fazer música ou entoar louvor. Como o instrumento é explicitamente mencionado, «tocarei» expressa com clareza a execução musical e evita uma formulação pouco idiomática.
