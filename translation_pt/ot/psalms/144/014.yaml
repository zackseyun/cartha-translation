base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: pt
  text: Nosso gado está carregado[a]; não há brecha nem saída[b], nem clamor em nossas ruas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossos bois estão bem carregados”. O hebraico pode referir-se a bois ou, mais amplamente, a gado; “carregados” significa literalmente “sob carga”. Neste contexto, alguns o entendem como imagem de fecundidade e abundância do rebanho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não há quem saia” ou “não há exílio”. O hebraico é conciso; no contexto, a saída pode aludir a uma partida forçada da cidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: nossos bois
  rationale: Embora אַלּוּף também possa designar chefe ou líder de clã, o contexto de prosperidade agrícola e sua combinação com מְסֻבָּלִים favorecem o sentido de animais domésticos, provavelmente bois.
- source_word: מְסֻבָּלִים
  choice: estão carregados
  rationale: O particípio passivo deriva de סבל, “carregar, suportar uma carga”. A tradução mantém a imagem literal e a ambiguidade entre animais carregando peso e gado prenhe.
- source_word: אֵין פֶּרֶץ
  choice: não há brecha
  rationale: פֶּרֶץ denota uma abertura, ruptura ou brecha, provavelmente nas defesas da comunidade neste contexto de segurança pública.
- source_word: וְאֵין יוֹצֵאת
  choice: nem saída
  rationale: A expressão hebraica é elíptica e difícil. “Nem saída” conserva sua forma impessoal e sua ambiguidade, podendo aludir a partida forçada, exílio ou outra saída calamitosa.
- source_word: וְאֵין צְוָחָה
  choice: nem grito de aflição
  rationale: צְוָחָה é um clamor ou grito, geralmente provocado por sofrimento. A explicitação “de aflição” comunica essa nuance em português natural.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: em nossas ruas
  rationale: רְחֹבוֹת designa espaços públicos largos, como ruas ou praças; “ruas” é claro, natural e adequado ao cenário cívico.
