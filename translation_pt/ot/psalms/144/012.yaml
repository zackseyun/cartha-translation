  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: pt
  text: Que os nossos filhos sejam como plantas bem desenvolvidas na sua juventude, e as nossas filhas, como colunas de canto esculpidas segundo o modelo de um palácio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de um templo” ou “de um grande salão”. A palavra hebraica pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Que
  rationale: Embora seja normalmente um pronome relativo, aqui introduz uma condição desejada ligada ao contexto anterior. “Que” expressa naturalmente esse valor optativo em português sem tornar a frase excessivamente explícita.
- source_word: בָּנֵינוּ
  choice: os nossos filhos
  rationale: O substantivo indica especificamente filhos do sexo masculino e forma um paralelo deliberado com “as nossas filhas”.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: como plantas bem desenvolvidas
  rationale: A expressão retrata plantas que cresceram bem ou foram cultivadas até alcançar vigor. “Bem desenvolvidas” preserva tanto o crescimento quanto o resultado florescente, sem restringir a imagem a árvores jovens.
- source_word: בִּנְעוּרֵיהֶם
  choice: na sua juventude
  rationale: A expressão situa esse crescimento vigoroso no período da juventude; o singular coletivo “sua” é natural e não altera o referente plural.
- source_word: בְּנוֹתֵינוּ
  choice: as nossas filhas
  rationale: Mantém o sentido específico e o paralelismo de gênero do texto hebraico.
- source_word: כְזָוִיּוֹת
  choice: como colunas de canto
  rationale: O termo se relaciona literalmente com cantos ou ângulos; no símile arquitetônico, “colunas de canto” comunica de modo inteligível elementos estruturais e ornamentais colocados nos cantos.
- source_word: מְחֻטָּבוֹת
  choice: esculpidas
  rationale: O particípio passivo descreve algo talhado ou trabalhado por corte. “Esculpidas” combina com a imagem de arquitetura ornamentada.
- source_word: תַּבְנִית
  choice: segundo o modelo de
  rationale: O substantivo pode indicar forma, padrão, modelo ou projeto. A formulação conserva a ideia de configuração artística sem reduzir o sentido a mera decoração.
- source_word: הֵיכָל
  choice: um palácio
  rationale: O termo pode designar palácio, templo ou grande salão. No quadro de prosperidade familiar e nacional, “palácio” oferece uma leitura contextual plausível; a alternativa “templo” é mantida em nota.
theological_decisions:
- issue: Referente de הֵיכָל no símile arquitetônico aplicado às filhas
  choice: imagem não cultual de um palácio
  alternative: imagem cultual de um templo
  rationale: O contexto imediato descreve prosperidade doméstica e social, sem marcadores cultuais explícitos. “Palácio” comunica grandeza arquitetônica sem introduzir uma referência religiosa não exigida, enquanto a nota preserva a possibilidade lexical de “templo”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética paralela entre filhos e filhas foi preservada; evitou-se linguagem técnica no corpo do versículo.
