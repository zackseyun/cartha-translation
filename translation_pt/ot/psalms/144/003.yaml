  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: pt
  text: Ó Yahweh, que é o ser humano, para que lhe dês atenção,[a] o filho do homem, para que o leves em conta?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo ecoa de perto Salmos 8:4.
    reason: cross_reference
  - marker: b
    text: Em hebraico, «o filho do homem» é uma expressão poética para o ser humano, com ênfase em sua fragilidade e mortalidade; aqui tem sentido genérico, não é um título messiânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama e expressa a força vocativa da oração com «Ó».
- source_word: מָה אָדָם
  choice: que é o ser humano
  rationale: Conserva a pergunta retórica sobre a pequenez humana; «ser humano» comunica naturalmente o valor genérico de אָדָם em português.
- source_word: וַתֵּדָעֵהוּ
  choice: para que o conheças
  rationale: Preserva o sentido lexical básico de ידע, aqui com a nuance contextual de reconhecer ou dar atenção.
- source_word: בֶּן אֱנוֹשׁ
  choice: o filho do homem
  rationale: Mantém a expressão poética hebraica e o paralelismo, sem convertê-la em título messiânico neste contexto.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: para que o leves em conta
  rationale: Expressa de modo idiomático חשב como considerar ou ter em mente, em paralelo com «conheças».
theological_decisions:
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o nome divino; «Yahweh» preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Sentido de אָדָם / בֶּן אֱנוֹשׁ
  choice: o ser humano ... o filho do homem
  alternative: o homem ... o filho do mortal; a humanidade ... o ser humano
  rationale: A primeira expressão é vertida de modo claramente genérico, enquanto a segunda preserva o idioma poético e sua ressonância bíblica. No contexto, ambas se referem à humanidade frágil, não a uma figura messiânica específica.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. «Leves em conta» evita uma formulação artificial e mantém a ideia do cuidado atento de Deus. Todos os marcadores aparecem no texto.
