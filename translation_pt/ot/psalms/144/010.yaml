  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: pt
  text: aquele que dá salvação aos reis[a] e livra Davi, seu servo, da espada mortal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertação” ou “vitória”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da espada má”; também pode ser entendido como “da espada cruel” ou “destruidora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: aquele que dá
  rationale: O particípio qal com artigo tem função substantivada e retoma Deus como “aquele que dá”, preservando a construção participial do hebraico.
- source_word: תְּשׁוּעָה
  choice: salvação
  rationale: O substantivo pode indicar salvação, libertação ou vitória. “Salvação” conserva sua amplitude teológica, enquanto o contexto deixa perceptível a dimensão militar.
- source_word: לַמְּלָכִים
  choice: aos reis
  rationale: A preposição ל marca o objeto indireto de “dá”; “aos reis” é a formulação direta e natural em português.
- source_word: הַפּוֹצֶה
  choice: e livra
  rationale: O particípio expressa resgate ou libertação. “Livra” é corrente e digno em português; a conjunção explicita com naturalidade a coordenação entre as duas orações participiais.
- source_word: אֶת דָּוִד
  choice: Davi
  rationale: O marcador de objeto direto não é traduzido, e o nome recebe sua forma portuguesa tradicional.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: No contexto real e pactual, עבד designa Davi em sua relação de serviço a Deus. “Servo” reproduz adequadamente esse uso sem acentuar indevidamente a condição de escravo.
- source_word: מֵחֶרֶב רָעָה
  choice: da espada mortal
  rationale: מן indica livramento de um perigo. Embora רָעָה signifique literalmente “má”, aplicado à espada pode caracterizá-la como danosa ou mortal. “Espada mortal” comunica naturalmente o sentido contextual, mantendo a forma literal em nota.
theological_decisions:
- issue: Amplitude de תְּשׁוּעָה em contexto real e militar
  choice: salvação
  alternative: libertação; vitória
  rationale: O contexto envolve reis e o livramento de Davi diante da espada, portanto inclui vitória ou resgate militar. Ainda assim, “salvação” preserva a amplitude da ação salvadora de Deus sem restringi-la ao êxito bélico.
- issue: Sentido de עַבְדּוֹ aplicado a Davi
  choice: seu servo
  alternative: seu escravo
  rationale: Aqui o termo funciona como designação real e pactual da relação de Davi com Deus. “Servo” reflete melhor esse emprego e evita introduzir uma ênfase social que o contexto não destaca.
- issue: Valor de רָעָה ao qualificar a espada
  choice: mortal
  alternative: má; cruel; destruidora
  rationale: A expressão hebraica admite uma leitura mais literal, “espada má”, e uma leitura funcional, “espada mortal”. O texto principal usa a forma idiomática portuguesa, enquanto a nota conserva a imagem literal e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura “aquele que” preserva o caráter participial do hebraico; “salvação” mantém a densidade teológica, e a nota sobre a espada registra a formulação literal sem impor uma única nuance.
