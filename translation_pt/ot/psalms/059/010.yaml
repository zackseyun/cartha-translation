  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: pt
  text: O Deus do seu amor leal irá à minha frente[a][b]; Deus me fará ver os meus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra vocalização ou tradição de tradução: «Meu Deus, em seu amor leal, irá à minha frente» ou «Meu Deus de amor leal irá à minha frente».'
    reason: alternative_reading
  - marker: b
    text: «Amor leal» traduz o hebraico hesed, que muitas vezes denota amor constante e fiel, misericórdia ou lealdade ligada à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: O Deus do
  rationale: A forma construta de אֱלֹהִים introduz o substantivo seguinte com sufixo. «O Deus do» preserva essa relação sintática, embora a expressão resultante seja incomum.
- source_word: חסדו
  choice: seu amor leal
  rationale: חֶסֶד denota amor, bondade ou misericórdia caracterizados por lealdade e constância. «Amor leal» comunica essas dimensões sem tornar explícita no texto principal uma referência à aliança que o termo, isoladamente, não exige. O sufixo masculino singular é preservado como «seu».
- source_word: יְקַדְּמֵנִי
  choice: irá à minha frente
  rationale: O piel de קדם pode significar vir ao encontro, antecipar-se ou ir adiante. No contexto da ajuda divina esperada, «irá à minha frente» conserva a imagem de precedência e iniciativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Mantém-se a repetição enfática do nome divino no hebraico, em vez de substituí-lo por um pronome.
- source_word: יַרְאֵנִי
  choice: me deixará ver
  rationale: 'O hifil de ראה tem sentido causativo ou permissivo: «fará ver» ou «deixará ver». A formulação preserva esse valor sem introduzir explicitamente a ideia de triunfo.'
- source_word: בְשֹׁרְרָי
  choice: a queda dos meus inimigos
  rationale: שׁורר designa adversários hostis. «Meus inimigos» é o equivalente português mais claro. «A queda» explicita o complemento idiomático associado ao uso de ראה בְּ nesse contexto, mas, por não estar expresso lexicalmente no hebraico, é assinalado em nota.
theological_decisions:
- issue: Sufixo pronominal em חסדו
  choice: seu amor leal
  alternative: meu Deus, em seu amor leal / meu Deus de amor leal
  rationale: A vocalização massorética apresentada traz o sufixo de terceira pessoa masculina singular, produzindo literalmente a construção incomum «O Deus do seu amor leal». Outra vocalização ou tradição de leitura entende o primeiro termo como «meu Deus». Segue-se o WLC no texto principal e registra-se a alternativa em nota.
- issue: Sentido da visão dos inimigos
  choice: ver a queda dos meus inimigos
  alternative: ver os meus inimigos
  rationale: A expressão hebraica pode ter o sentido idiomático de contemplar o que acontece aos inimigos, frequentemente sua derrota. Para produzir português natural, «a queda» foi acrescentado, mas a nota preserva a formulação mais estrita e evita apresentar a implicação contextual como se fosse um substantivo expresso no original.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção deliberadamente incomum «O Deus do seu amor leal» segue a vocalização do WLC; a alternativa tradicional é preservada em nota. A ordem dos marcadores foi normalizada para [a][b].
