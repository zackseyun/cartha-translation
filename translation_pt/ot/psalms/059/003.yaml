  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: pt
  text: 'Pois olha: eles armam emboscada contra a minha vida; homens violentos se reúnem contra mim, não por alguma transgressão ou pecado meu, ó SENHOR.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “SENHOR” representa o nome divino YHWH.
    reason: Informa ao leitor o nome presente no texto hebraico sem alterar a convenção adotada no corpo do versículo.
lexical_decisions:
- source_word: הִנֵּה
  choice: olha
  rationale: Mantém a chamada enfática à atenção em linguagem direta e atual.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: armam emboscada contra a minha vida
  rationale: Expressa a ação hostil de ficar à espreita e preserva נֶפֶשׁ no sentido contextual de vida.
- source_word: יָגוּרוּ עָלַי
  choice: se reúnem contra mim
  rationale: Reproduz o ajuntamento hostil indicado pelo verbo e pela preposição.
- source_word: עַזִּים
  choice: homens violentos
  rationale: No contexto, descreve adversários fortes, ferozes ou insolentes; “violentos” comunica naturalmente sua força hostil sem especificar além do texto.
- source_word: לֹא פִשְׁעִי וְלֹא חַטָּאתִי
  choice: não por alguma transgressão ou pecado meu
  rationale: Preserva a alegação de inocência do salmista e a forma nominal concisa do hebraico, sem afirmar impecabilidade universal.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino YHWH por SENHOR em versaletes.
theological_decisions:
- issue: Alcance da declaração de inocência
  choice: não por alguma transgressão ou pecado meu
  alternative: embora eu não tenha cometido transgressão nem pecado
  rationale: A opção escolhida liga a inocência à perseguição descrita e evita transformar a afirmação contextual do salmista numa declaração absoluta de impecabilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção preserva o paralelismo e a intensidade do apelo, sem suavizar a hostilidade dos perseguidores nem ampliar a alegação de inocência.
