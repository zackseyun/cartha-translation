  text: חַטַּאת פִּ֗י/מוֹ דְּֽבַר שְׂפָ֫תֵ֥י/מוֹ וְ/יִלָּכְד֥וּ בִ/גְאוֹנָ֑/ם וּ/מֵ/אָלָ֖ה וּ/מִ/כַּ֣חַשׁ יְסַפֵּֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: pt
  text: O pecado da boca deles é a palavra dos seus lábios[a]; que sejam apanhados em seu orgulho[b], por causa da maldição e da mentira que proferem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa do pecado da boca deles, da palavra dos seus lábios, que sejam apanhados em seu orgulho; e por causa da maldição e da mentira que proferem.”'
    reason: A relação sintática entre as expressões iniciais e “que sejam apanhados” é ambígua no hebraico; elas podem formar uma declaração nominal ou indicar a causa do castigo pedido.
  - marker: b
    text: 'Ou: “apanhados pelo próprio orgulho”.'
    reason: A preposição hebraica pode indicar tanto a esfera quanto o meio ou a causa de serem apanhados.
lexical_decisions:
- source_word: חַטַּאת פִּימוֹ
  choice: O pecado da boca deles
  rationale: חַטַּאת indica aqui a transgressão moral expressa pela fala, não uma oferta ritual. O singular coletivo de פִּימוֹ é mantido em português.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: é a palavra dos seus lábios
  rationale: A formulação conserva o paralelismo concreto entre boca e lábios e reproduz a relação construta do hebraico, embora a ligação sintática com a oração seguinte admita outra leitura.
- source_word: וְיִלָּכְדוּ
  choice: que sejam apanhados
  rationale: O imperfeito nifal tem força volitiva no contexto da oração. A construção com 'que' comunica de modo natural o pedido imprecatório.
- source_word: בִגְאוֹנָם
  choice: em seu orgulho
  rationale: גָּאוֹן denota aqui orgulho ou arrogância. A preposição ב pode indicar a esfera em que são apanhados ou, possivelmente, o meio pelo qual isso ocorre.
- source_word: מֵאָלָה וּמִכַּחַשׁ
  choice: por causa da maldição e da mentira
  rationale: As formas com מִן são entendidas causalmente. Os singulares abstratos foram conservados, representando a fala marcada por maldição e falsidade.
- source_word: יְסַפֵּרוּ
  choice: que proferem
  rationale: Embora ספר costume significar 'contar' ou 'relatar', neste contexto se refere ao que eles dizem. 'Proferem' combina naturalmente com ambos os objetos sem apagar o caráter verbal da ação.
theological_decisions:
- issue: Força da forma verbal וְיִלָּכְדוּ
  choice: 'Pedido: ''que sejam apanhados'''
  alternative: 'Predição: ''e serão apanhados'''
  rationale: O contexto do salmo e a sequência discursiva favorecem a leitura jussiva, mas a forma hebraica, isoladamente, também pode ser lida como imperfeito indicativo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se as imagens corporais de “boca” e “lábios”, a concisão poética e a ambiguidade sintática relevante por meio de nota.
