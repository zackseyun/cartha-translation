  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: pt
  text: Sem que eu tenha culpa, eles correm e tomam posição[a]. Desperta, vem ao meu encontro e vê!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles se apressam e se preparam”. O segundo verbo pode indicar que eles se firmam, tomam posição ou se preparam para agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: Sem culpa
  rationale: Expressa de modo natural a ausência de culpabilidade que o salmista reivindica no contexto, preservando a nuance moral e jurídica de עָוֺן.
- source_word: יְרוּצוּן
  choice: eles correm
  rationale: Mantém a imagem vívida e o sentido básico de רוץ, sem restringi-lo a uma corrida literal ou excluir a ideia de avançar depressa.
- source_word: וְיִכּוֹנָנוּ
  choice: e tomam posição
  rationale: Representa o sentido de firmar-se ou colocar-se em prontidão, adequado ao movimento hostil do contexto sem explicitar indevidamente uma ação militar.
- source_word: עוּרָה
  choice: Desperta
  rationale: Preserva a metáfora antropomórfica do imperativo dirigido a Deus e sua força poética.
- source_word: לִקְרָאתִי
  choice: vem ao meu encontro
  rationale: Torna idiomática em português a expressão hebraica ‘ao meu encontro’, explicitando apenas o movimento já pressuposto pelo imperativo e sem substituir a imagem por ‘ajuda-me’.
- source_word: וּרְאֵה
  choice: e vê
  rationale: Conserva a brevidade e o paralelismo do imperativo hebraico.
theological_decisions:
- issue: Imperativo antropomórfico dirigido a Deus
  choice: Desperta
  alternative: Levanta-te; põe-te em ação
  rationale: A formulação mantém a tensão poética da oração por intervenção divina sem afirmar que Deus durma literalmente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem compacta e os imperativos preservam o vigor poético do hebraico; o ponto de exclamação comunica a urgência da súplica.
