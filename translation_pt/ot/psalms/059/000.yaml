base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: pt
  text: 'Ao regente: segundo “Não Destruas”. De Davi. Mictão[a], quando Saul enviou homens[b], e eles vigiaram a casa para matá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O significado de “mictão” é incerto; por isso, o termo foi transliterado em vez de traduzido.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “quando Saul enviou, e eles vigiaram a casa para matá-lo”. O hebraico não diz expressamente “homens”, mas o verbo no plural indica que Saul enviou agentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Fórmula dos cabeçalhos dos Salmos dirigida ao responsável pela execução musical; “regente” é claro e não restringe indevidamente sua função a um coral.
- source_word: אַל־תַּשְׁחֵת
  choice: segundo “Não Destruas”
  rationale: A expressão provavelmente identifica uma melodia ou indicação musical. “Segundo” torna essa função provável inteligível, enquanto as aspas preservam a expressão como título.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a concisão e a ambiguidade convencional do לְ nos cabeçalhos quanto a autoria, associação ou dedicação.
- source_word: מִכְתָּם
  choice: Mictão
  rationale: Como o sentido exato do termo técnico é incerto, a transliteração evita uma tradução especulativa.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: quando Saul enviou homens
  rationale: A construção marca tempo, “quando Saul enviou”. “Homens” é explicitado naturalmente a partir do verbo plural seguinte, que pressupõe agentes enviados.
- source_word: וַיִּשְׁמְרוּ
  choice: e eles ficaram vigiando
  rationale: Neste contexto hostil, שׁמר denota vigilância contínua da casa, não proteção; a perífrase portuguesa comunica bem a ação durativa.
- source_word: אֶת־הַבַּיִת
  choice: a casa
  rationale: Reproduz o objeto definido sem acrescentar “dele”, embora o contexto identifique a casa como a de Davi.
- source_word: לַהֲמִיתוֹ
  choice: para matá-lo
  rationale: Expressa diretamente a finalidade do infinitivo com sufixo masculino singular.
theological_decisions: []
translation_notes:
