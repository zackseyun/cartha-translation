  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: pt
  text: Consome-os com ira[a]; consome-os até que deixem de existir, para que saibam que Deus governa em Jacó até os confins da terra[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Destrói-os com ira; destrói-os, e eles deixarão de existir”. O hebraico admite uma tradução mais abrupta e literal.'
    reason: lexical_alternative
  - marker: b
    text: “Em Jacó” se refere ao governo de Deus em relação a Jacó, isto é, Israel; alguns traduzem “sobre Jacó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: Consome-os
  rationale: O imperativo piel de כלה expressa levar ao fim, consumir ou destruir. “Consome-os” preserva a imagem intensa e permite manter a repetição enfática do hebraico.
- source_word: בְחֵמָה
  choice: com ira
  rationale: חֵמָה indica ira ardente ou furor. “Com ira” comunica de modo natural o valor modal ou instrumental da preposição בְּ, sem acrescentar um possessivo ausente no texto.
- source_word: וְאֵינֵמוֹ
  choice: até que deixem de existir
  rationale: A expressão significa literalmente “e eles não existem/não estão mais”. No encadeamento com o imperativo repetido, esta formulação transmite naturalmente o resultado completo, embora a alternativa mais abrupta seja registrada em nota.
- source_word: וְיֵדְעוּ
  choice: para que saibam
  rationale: O waw seguido do imperfeito, após as súplicas imprecatórias, pode indicar finalidade ou resultado. “Para que saibam” preserva essa relação sem convertê-la categoricamente em simples futuro ou ordem independente.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto do salmo, o termo designa o Deus de Israel; “Deus” é a correspondência direta e habitual.
- source_word: מֹשֵׁל
  choice: governa
  rationale: O particípio indica domínio contínuo. “Governa” é claro, atual e mantém a ideia de exercício efetivo de autoridade.
- source_word: בְּיַעֲקֹב
  choice: em Jacó
  rationale: Mantém-se a preposição hebraica em sua forma mais direta e “Jacó” como designação pactual do povo, sem substituí-lo interpretativamente por “Israel”. A alternativa “sobre Jacó” é indicada em nota.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: até os confins da terra
  rationale: Expressão portuguesa consagrada e natural para os limites ou lugares mais distantes do mundo.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo permanece incerto, ele é transliterado, com acento conforme a pronúncia usual em português.
theological_decisions:
- issue: Linguagem imprecatória dirigida aos inimigos
  choice: Manter o pedido direto de destruição completa, repetindo o imperativo.
  alternative: Abrandar o pedido como mera contenção, derrota parcial ou hipérbole sem destruição.
  rationale: O hebraico repete o imperativo e pede que os inimigos sejam levados ao ponto de já não existirem. A severidade da súplica deve ser preservada, não suavizada por sensibilidades modernas.
- issue: Relação entre o governo de Deus em Jacó e seu reconhecimento universal
  choice: Preservar tanto “em Jacó” quanto “até os confins da terra”.
  alternative: Restringir a declaração somente a Israel ou dissolver “Jacó” numa afirmação exclusivamente universal.
  rationale: O verso mantém juntos o governo particular de Deus em relação a Jacó e o conhecimento desse governo em alcance mundial. A tradução conserva essa tensão sem a resolver.
- issue: Tensão entre a eliminação dos inimigos e o conhecimento que lhes é atribuído
  choice: Traduzir “até que deixem de existir, para que saibam”, sem explicar ou harmonizar a tensão.
  alternative: Alterar o sujeito de “saibam”, entender apenas os sobreviventes ou reformular o conhecimento como reconhecimento anterior à destruição.
  rationale: A sequência hebraica justapõe as duas ideias de modo forte e potencialmente paradoxal. A tradução não deve introduzir uma solução exegética que o texto não explicita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição poética foi mantida; evitou-se linguagem excessivamente arcaica ou coloquial. Todos os marcadores de nota aparecem no texto principal.
