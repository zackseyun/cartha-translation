  source_fidelity: O texto traduz fielmente os dois imperativos hebraicos de súplica (הַצִּילֵנִי / הוֹשִׁיעֵנִי), a referência a praticantes de אָוֶן e a expressão construta אַנְשֵׁי דָמִים. “Dos que praticam a maldade” comunica claramente o valor ativo de “os que praticam/fazem” sem reduzir indevidamente o termo a uma categoria técnica. “Homens de sangue” conserva, de modo formalmente apropriado, a imagem hebraica e seu masculino contextual.
  naturalness: “Livra-me dos que praticam a maldade e salva-me dos homens de sangue” é português atual, claro e solene sem ser arcaizante. O paralelismo é bem mantido. Embora “homens de sangue” seja uma formulação bíblica marcada, é inteligível e deliberadamente explicada em nota.
  terminology: “Livra-me” e “salva-me” distinguem adequadamente os dois verbos sem lhes atribuir sentidos excessivamente específicos. “Maldade” é uma opção natural para אָוֶן neste contexto moral. A nota para “homens de sangue” explica com precisão que o plural hebraico “sangues” é idiomático e pode denotar caráter sanguinário ou culpa por derramamento de sangue.
