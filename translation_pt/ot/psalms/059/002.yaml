  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: pt
  text: Livra-me dos que praticam a maldade[a] e salva-me dos homens de sangue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos malfeitores”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “homens de sangues”, isto é, homens sanguinários ou culpados de derramamento de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo de נצל pede libertação de um perigo. “Livra-me” é natural no contexto de uma súplica e mantém a ideia de ser retirado do alcance dos inimigos.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: dos que praticam a maldade
  rationale: Reproduz de modo claro a construção “os que fazem/praticam” e toma אָוֶן em seu sentido moral, adequado ao paralelismo com adversários violentos.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: e dos homens de sangue
  rationale: Mantém tanto o substantivo masculino אַנְשֵׁי quanto a expressão hebraica דָמִים, “sangues”, um idiomatismo ligado à violência homicida e à culpa de sangue.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: O imperativo de ישׁע expressa salvação ou socorro. “Salva-me” preserva sua amplitude sem especificar indevidamente vitória militar.
theological_decisions:
- issue: Forma masculina de אַנְשֵׁי
  choice: homens de sangue
  alternative: pessoas sanguinárias
  rationale: O hebraico emprega um substantivo masculino plural e, no contexto, aponta para adversários humanos violentos; a tradução conserva essa forma sem a neutralizar.
- issue: Força idiomática de דָמִים
  choice: homens de sangue
  alternative: homens sanguinários; homens culpados de derramamento de sangue
  rationale: A imagem hebraica é mantida no texto principal para conservar sua força e transparência, enquanto a nota esclarece seus sentidos possíveis sem escolher apenas um deles.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo dos dois imperativos foi preservado, assim como a imagem hebraica “homens de sangue”.
