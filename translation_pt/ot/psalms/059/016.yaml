base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: pt
  text: 'Mas eu cantarei a tua força;

    pela manhã, cantarei com júbilo[a] o teu amor leal[b],

    pois tens sido a minha fortaleza

    e o meu refúgio no dia da minha angústia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por «cantarei com júbilo» também pode significar «gritarei de alegria».
    reason: lexical_alternative
  - marker: b
    text: «Amor leal» traduz o hebraico hesed, termo que expressa amor fiel e comprometido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: O pronome independente, ligado pela conjunção, destaca o contraste entre o salmista e os inimigos mencionados no contexto anterior.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: cantarei a tua força
  rationale: Mantém a imagem hebraica da força de Deus como tema do cântico e expressa a decisão do salmista.
- source_word: וַאֲרַנֵּן
  choice: cantarei com júbilo
  rationale: O verbo רנן descreve uma expressão vocal intensa e jubilosa, que pode ser entendida como canto ou grito de alegria.
- source_word: לַבֹּקֶר
  choice: pela manhã
  rationale: Expressa naturalmente o valor temporal da frase e conserva o contraste contextual com a noite.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: חסד designa amor fiel e comprometido, frequentemente no contexto da relação de Deus com seu povo; “amor leal” comunica isso sem linguagem arcaica.
- source_word: הָיִיתָ מִשְׂגָּב לִי
  choice: tens sido a minha fortaleza
  rationale: O perfeito apresenta a proteção divina como experiência comprovada e ainda relevante; “fortaleza” comunica um lugar elevado e seguro.
- source_word: וּמָנוֹס
  choice: e o meu refúgio
  rationale: מנוס é um lugar para onde alguém foge em busca de segurança; “refúgio” preserva essa ideia e forma um paralelo natural com “fortaleza”.
- source_word: בְּיוֹם צַר לִי
  choice: no dia da minha angústia
  rationale: Conserva a imagem temporal e o caráter pessoal da aflição expressos no hebraico.
theological_decisions:
- issue: Sentido de חֶסֶד na celebração do livramento divino
  choice: o teu amor leal
  alternative: a tua misericórdia; o teu amor de aliança
  rationale: “Amor leal” preserva tanto a benevolência afetiva quanto a fidelidade comprometida de Deus, sem restringir o termo apenas à misericórdia nem explicitar “aliança” onde ela permanece implícita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com paralelismo poético preservado. Emprega-se “tu” de modo coerente com o discurso direto a Deus; evita-se vocabulário arcaico e mantém-se a riqueza semântica de רנן e חֶסֶד por meio de nota.
