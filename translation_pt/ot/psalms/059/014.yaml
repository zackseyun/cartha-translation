base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/014.yaml
  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: pt
  text: Eles voltam ao anoitecer; rosnam como cães e rondam a cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: Eles voltam
  rationale: O verbo שׁוב expressa voltar ou retornar; a forma concisa preserva a ideia da ação repetida sem explicar indevidamente sua intenção.
- source_word: לָעֶרֶב
  choice: ao anoitecer
  rationale: עֶרֶב indica a tarde ou o começo da noite. “Ao anoitecer” é natural em português e situa com clareza o reinício da atividade hostil.
- source_word: יֶהֱמוּ
  choice: rosnam
  rationale: המה pode indicar um ruído forte, rugido ou som animal. No símile canino imediato, “rosnam” comunica bem o som ameaçador, embora “uivam” também seja possível.
- source_word: כַכָּלֶב
  choice: como cães
  rationale: O hebraico emprega o singular representativo “como um cão”; o plural é mais natural com o sujeito plural em português e preserva a imagem coletiva.
- source_word: וִיסוֹבְבוּ
  choice: e rondam
  rationale: סבב significa andar ao redor ou circular. No contexto de inimigos comparados a cães pela cidade, “rondam” transmite o movimento ameaçador sem tornar explícito mais do que a imagem permite.
- source_word: עִיר
  choice: a cidade
  rationale: Embora o substantivo hebraico não tenha artigo, o contexto aponta para a cidade conhecida; o artigo definido é idiomático em português.
theological_decisions: []
