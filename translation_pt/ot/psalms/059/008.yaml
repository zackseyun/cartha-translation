base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: pt
  text: Mas tu, Yahweh, ris deles; zombas de todas as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção seguida do pronome independente introduz uma virada contrastiva em relação aos inimigos descritos no contexto; “Mas tu” expressa isso com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, sem substituí-lo por um título.
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: ris deles
  rationale: O verbo significa “rir”, e a preposição com sufixo indica aqueles contra quem o riso se dirige. “Rir de” é a construção portuguesa natural e preserva a imagem concreta.
- source_word: תִּלְעַג
  choice: zombas
  rationale: Expressa claramente escárnio ou ridicularização em linguagem atual, sem recorrer a uma forma arcaica.
- source_word: לְ/כָל גּוֹיִם
  choice: de todas as nações
  rationale: גּוֹיִם designa aqui as nações ou povos de modo amplo; a preposição é exigida em português pelo verbo “zombar”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” conserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Alcance de גּוֹיִם
  choice: todas as nações
  alternative: todos os gentios
  rationale: Neste contexto poético, a palavra se refere amplamente às nações, sem exigir o sentido técnico posterior de “gentios”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa adequada à poesia. O paralelismo entre “ris deles” e “zombas de todas as nações” foi preservado; o vocativo dispensa “ó” para maior naturalidade sem perder solenidade.
