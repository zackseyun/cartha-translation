  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: pt
  text: 'Ó minha força, a ti cantarei louvores,

    pois Deus é a minha fortaleza,

    o Deus do meu amor leal.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu Deus misericordioso” ou “o Deus que me demonstra amor leal”. O hebraico diz literalmente “o Deus do meu amor leal”.
    reason: A expressão hebraica é poeticamente condensada e admite mais de uma relação entre Deus, o salmista e o amor leal.
lexical_decisions:
- source_word: עֻזִּי
  choice: Ó minha força
  rationale: O substantivo significa “força” ou “poder”. Neste contexto poético, funciona como vocativo dirigido a Deus; “ó” torna essa função clara em português.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: A preposição indica direção, “a” ou “para”. Com o verbo de cantar louvores, “a ti” é natural e mantém o movimento do louvor em direção a Deus.
- source_word: אֲזַמֵּרָה
  choice: cantarei louvores
  rationale: O piel de זמר nos Salmos costuma designar o ato de cantar em louvor, possivelmente com acompanhamento musical. “Cantarei louvores” explicita esse sentido cultual sem expandir excessivamente.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão do louvor. “Pois” preserva de modo conciso a relação causal.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa o Deus de Israel em sentido singular.
- source_word: מִשְׂגַּבִּי
  choice: minha fortaleza
  rationale: מִשְׂגָּב designa um lugar alto e seguro, usado figuradamente como proteção. “Fortaleza” comunica segurança defensiva em linguagem bíblica natural e corrente.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: o Deus do meu amor leal
  rationale: A cadeia construta significa literalmente “o Deus do meu hesed”. “Amor leal” representa a fidelidade relacional e pactual de חֶסֶד, enquanto a estrutura comprimida conserva a ambiguidade poética do hebraico.
theological_decisions:
- issue: Sentido de חַסְדִּי em relação a Deus
  choice: o Deus do meu amor leal
  alternative: meu Deus misericordioso; o Deus que me demonstra amor leal
  rationale: O hebraico permite entender a expressão como referência ao amor leal de Deus para com o salmista ou como caracterização de Deus como fonte e personificação desse amor. A tradução principal mantém a expressão genitival e sua tensão, sem escolher silenciosamente uma interpretação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética. O vocativo “Ó minha força” e o paralelismo entre “força” e “fortaleza” preservam a forma do verso; “amor leal” mantém a densidade teológica de חֶסֶד.
