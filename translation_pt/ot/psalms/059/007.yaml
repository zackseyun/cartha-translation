  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: pt
  text: 'Eis que[a] eles despejam palavras da boca; espadas estão em seus lábios, pois dizem[b]: “Quem ouve?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que eles fazem jorrar da boca”; o verbo hebraico evoca algo que borbulha ou é derramado em abundância.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz simplesmente: “Quem ouve?” O objeto não é expresso, deixando deliberadamente aberta a afirmação arrogante.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Partícula que chama a atenção. “Vejam” preserva sua força dêitica em português atual e se dirige naturalmente aos ouvintes do poema.
- source_word: יַבִּיעוּן
  choice: despejam palavras
  rationale: O hifil de נבע evoca algo que borbulha ou jorra. “Despejam” mantém a imagem de fala abundante; “palavras” é um complemento implícito acrescentado para que a construção seja natural em português, sem antecipar indevidamente “espadas”.
- source_word: בְּפִיהֶם
  choice: pela boca
  rationale: Embora ב possa significar “em” ou “com”, a expressão “despejam palavras pela boca” comunica de modo idiomático o fluxo da fala e preserva a imagem de origem ou passagem.
- source_word: חֲרָבוֹת
  choice: espadas
  rationale: O substantivo significa normalmente “espadas”. A metáfora da fala violenta deve permanecer explícita, em vez de ser interpretada como simples “destruição”.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: nos seus lábios
  rationale: Formulação natural que conserva o paralelismo poético com “pela boca” e apresenta as espadas como metáfora das palavras prontas para ser pronunciadas.
- source_word: כִּי
  choice: pois dizem
  rationale: A conjunção introduz a razão ou atitude subjacente. “Dizem” explicita com naturalidade o ato de fala implícito antes da pergunta citada.
- source_word: מִי שֹׁמֵעַ
  choice: Quem ouve?
  rationale: A pergunta breve reflete o particípio hebraico e preserva a ausência deliberada de objeto, bem como a arrogante expectativa de impunidade.
theological_decisions:
- issue: Objeto implícito do verbo “ouvir” na pergunta retórica
  choice: Manter “Quem ouve?”, sem objeto expresso.
  alternative: “Quem nos ouve?” ou “Quem ouve isso?”
  rationale: 'O hebraico não especifica o que ou quem seria ouvido. Preservar essa abertura mantém a tensão: os perversos falam como se ninguém — possivelmente nem Deus — estivesse ouvindo, sem inserir no texto um objeto ausente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Vejam” funciona como chamado público à atenção. A expressão “despejam palavras” torna idiomática a imagem hebraica sem ligar “espadas” ao primeiro membro da frase; o segundo membro preserva integralmente a metáfora poética.
