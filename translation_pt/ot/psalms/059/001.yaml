  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י אֱלֹהָ֑/י מִּ/מִתְקוֹמְמַ֥/י תְּשַׂגְּבֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: pt
  text: Livra-me dos meus inimigos, meu Deus; põe-me em lugar alto, longe do alcance dos que se levantam contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “protege-me dos que se levantam contra mim”. O verbo hebraico retrata a pessoa sendo colocada num lugar alto e inacessível e, assim, mantida em segurança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O hifil imperativo de נצל com sufixo de primeira pessoa singular expressa o pedido de ser retirado de uma situação de perigo. “Livra-me” é natural, digno e evita possíveis conotações soteriológicas mais amplas de “salva-me”.
- source_word: מֵאֹיְבַי
  choice: dos meus inimigos
  rationale: אֹיֵב é o termo comum para “inimigo”, e מִן indica afastamento ou separação.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Mantém diretamente o vocativo pessoal com sufixo de primeira pessoa singular.
- source_word: מִּמִתְקוֹמְמַי
  choice: longe do alcance dos que se levantam contra mim
  rationale: O particípio de קום designa aqueles que se insurgem ou se põem contra o salmista. Em ligação com שׂגב e com a preposição מִן, a formulação exprime proteção e afastamento sem apagar a imagem de oposição ativa.
- source_word: תְּשַׂגְּבֵנִי
  choice: põe-me em lugar alto
  rationale: O piel de שׂגב pode significar colocar num lugar alto e inacessível e, por extensão, proteger. A tradução preserva a metáfora concreta de segurança pela elevação.
theological_decisions:
- issue: Sentido da petição תְּשַׂגְּבֵנִי מִּמִתְקוֹמְמַי
  choice: põe-me em lugar alto, longe do alcance dos que se levantam contra mim
  alternative: protege-me dos que se levantam contra mim
  rationale: A opção principal conserva a imagem espacial do verbo שׂגב e explicita com naturalidade sua implicação protetora. A alternativa é semanticamente legítima, mas perde a metáfora hebraica.
- issue: Tratamento do vocativo אֱלֹהָי
  choice: meu Deus
  alternative: ó meu Deus
  rationale: “Meu Deus” reproduz o apelo pessoal sem acrescentar uma partícula vocativa ausente do hebraico; “ó meu Deus” também seria possível em registro mais elevado.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com colocação pronominal adequada ao registro bíblico digno. A imagem hebraica de elevação protetora foi preservada e esclarecida de modo natural.
