  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é difícil; literalmente: “A força dele — para ti vigiarei”. “Vigiar” também pode ser entendido, neste contexto, como esperar atentamente: “A força dele — por ti esperarei”.'
