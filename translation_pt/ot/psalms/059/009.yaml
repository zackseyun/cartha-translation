lexical_decisions:
- source_word: עֻזּוֹ
  choice: a força dele
  rationale: A forma massorética traz o sufixo de terceira pessoa masculina do singular, literalmente “a força dele”. A construção é abrupta; “diante de” explicita com cautela a circunstância implícita sem substituir a leitura do texto por “minha força”.
- source_word: אֵלֶיךָ אֶשְׁמֹרָה
  choice: esperarei por ti
  rationale: אֶל indica direção para Deus, e שׁמר pode expressar vigilância ou espera atenta. Em português corrente, “esperarei por ti” comunica naturalmente a expectativa vigilante neste contexto; a imagem mais literal de vigiar é preservada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da espera confiante do salmista.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a tradução normal do substantivo plural com referência singular ao Deus de Israel.
- source_word: מִשְׂגַּבִּי
  choice: minha fortaleza
  rationale: Designa um lugar alto e seguro de proteção. “Fortaleza” mantém a imagem defensiva e é natural em português.
theological_decisions:
- issue: Se עֻזּוֹ deve ser entendido como “a força dele” ou como vocativo, “ó minha força”
  choice: 'Manter no texto principal a forma massorética de terceira pessoa: “a força dele”'
  alternative: “Ó minha força, esperarei por ti”
  rationale: O hebraico fornecido está vocalizado com sufixo de terceira pessoa masculina singular. A leitura vocativa é tradicional e contextualmente plausível, mas depende de outra compreensão textual; por isso, aparece em nota, sem eliminar a dificuldade do texto massorético.
- issue: Se אֶשְׁמֹרָה descreve vigiar, esperar ou cantar
  choice: “esperarei”, entendido como expectativa vigilante
  alternative: “vigiarei” ou, segundo outra leitura textual, “cantarei”
  rationale: O verbo שׁמר tem como sentido básico guardar ou vigiar, mas junto de אֵלֶיךָ pode comunicar espera atenta dirigida a Deus. “Esperarei por ti” é idiomático e não exclui a vigilância; as demais possibilidades são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal torna inteligível a sintaxe hebraica abrupta, enquanto as notas preservam tanto a forma massorética quanto as leituras tradicionais concorrentes.
