source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: pt
  text: Mas tu, SENHOR, Deus dos Exércitos, Deus de Israel, desperta para pedir contas a todas as nações.[a] Não concedas favor a nenhum dos que, traiçoeiramente, praticam o mal.[b] Selá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desperta para punir todas as nações”. O verbo hebraico também pode significar “visitar”, “intervir a respeito de” ou “pedir contas”, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tenhas misericórdia de nenhum dos que, traiçoeiramente, praticam o mal”. O verbo hebraico significa literalmente “mostrar favor” ou “ser gracioso”.'
    reason: lexical_alternative
  - marker: c
    text: “Selá” provavelmente é uma indicação musical ou litúrgica; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa amplamente reconhecida para o Tetragrama, distinguindo-o tipograficamente como nome divino.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva o título tradicional e sua força militar e cósmica sem restringir צְבָאוֹת apenas a exércitos humanos ou seres celestes.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz diretamente a cadeia construta e mantém o título pactual.
- source_word: הָקִיצָה
  choice: desperta
  rationale: Mantém a metáfora poética do imperativo dirigido a Deus, em linguagem digna e natural.
- source_word: לִפְקֹד
  choice: para pedir contas
  rationale: No contexto judicial, expressa a ideia de intervenção para responsabilizar, preservando melhor que uma tradução exclusivamente punitiva a amplitude de פקד.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Conserva o sentido coletivo e político amplo de גּוֹיִם, sem introduzir uma distinção teológica posterior entre judeus e gentios.
- source_word: אַל תָּחֹן
  choice: não concedas favor
  rationale: Representa de perto חנן, 'mostrar favor/ser gracioso', sem substituí-lo silenciosamente pelo conceito relacionado, mas não idêntico, de misericórdia.
- source_word: בֹּגְדֵי אָוֶן
  choice: os que, traiçoeiramente, praticam o mal
  rationale: Expressa tanto a deslealdade de בגד quanto a maldade de אָוֶן em português corrente, evitando o substantivo pouco natural 'traidores de iniquidade'.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém o termo litúrgico por transliteração, com acento adequado à leitura portuguesa, pois seu significado exato é incerto.
theological_decisions:
- issue: Alcance de כָּל הַגּוֹיִם no contexto imprecatório
  choice: todas as nações
  alternative: todos os gentios
  rationale: A expressão apresenta amplamente os povos sob o juízo divino; 'nações' preserva esse sentido sem importar uma oposição étnico-teológica posterior.
- issue: Força judicial de פקד
  choice: pedir contas
  alternative: punir
  rationale: '''Pedir contas'' comunica responsabilização e possível juízo sem eliminar a amplitude lexical do verbo hebraico; a alternativa mais diretamente punitiva permanece registrada em nota.'
- issue: Pedido para que Deus não demonstre חנן
  choice: não concedas favor
  alternative: não tenhas misericórdia
  rationale: A formulação conserva a linguagem de favor/graça e a tensão própria da imprecação, sem suavizá-la nem equiparar integralmente favor e misericórdia.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem vocativa e a metáfora 'desperta' preservam o tom poético. 'Pedir contas' mantém a força judicial sem fechar a polissemia de פקד; as alternativas relevantes aparecem em notas.
