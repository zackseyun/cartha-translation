base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: pt
  text: Voltam ao anoitecer; rosnam[a] como cães e rondam[b] a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uivam”. O verbo hebraico pode indicar diversos ruídos fortes semelhantes aos de animais.
    reason: lexical_alternative
  - marker: b
    text: Ou “dão voltas pela cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: voltam
  rationale: O qal imperfeito de שוב tem o sentido básico de voltar ou retornar. “Voltam” é direto, natural e preserva a ideia do movimento repetido dos inimigos.
- source_word: לָעֶרֶב
  choice: ao anoitecer
  rationale: A expressão indica o momento da tarde/noite. “Ao anoitecer” evita a possível leitura brasileira de “à tarde” como período vespertino amplo e combina com a cena noturna.
- source_word: יֶהֱמוּ
  choice: rosnam
  rationale: המה pode descrever um ruído forte, como bramido, rugido ou rosnado. Na comparação com cães hostis, “rosnam” comunica de modo natural o som ameaçador sem eliminar a alternativa “uivam”.
- source_word: כַכָּלֶב
  choice: como cães
  rationale: Embora כֶּלֶב esteja no singular, o singular hebraico pode ter valor genérico. O plural é mais natural em português com o sujeito plural e transmite a imagem coletiva.
- source_word: וִיסוֹבְבוּ
  choice: e rondam
  rationale: O verbo סבב expressa movimento circular ou ao redor. Neste contexto, “rondam” preserva a movimentação inquietante e hostil sem afirmar necessariamente que cercam a cidade.
- source_word: עִיר
  choice: a cidade
  rationale: Mesmo sem artigo no hebraico, o contexto aponta para a cidade específica em questão; o artigo definido é natural em português.
