  text: הֵ֭מָּה ינועו/ן לֶ/אֱכֹ֑ל אִם לֹ֥א יִ֝שְׂבְּע֗וּ וַ/יָּלִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: pt
  text: Eles vagueiam em busca de comida; se não ficam satisfeitos, passam a noite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rosnam”. O verbo hebraico pode ser entendido como “passam a noite” ou, neste contexto em que os inimigos são comparados a cães, como “rosnam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome masculino plural retoma os inimigos retratados como cães; em português, “Eles” expressa o sujeito com naturalidade.
- source_word: ינועון
  choice: vagueiam
  rationale: O verbo נוּעַ indica movimento de um lado para outro. “Vagueiam” preserva a imagem de busca inquieta sem sugerir indevidamente embriaguez ou cambaleio.
- source_word: לֶאֱכֹל
  choice: em busca de comida
  rationale: O infinitivo com לְ exprime propósito, literalmente “para comer”. A formulação escolhida torna explícito, de modo idiomático e sem alterar o sentido, que vagueiam procurando alimento.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: se não ficam satisfeitos
  rationale: A construção é mantida como condição direta. שׂבע descreve ficar saciado, especialmente de comida; “ficam satisfeitos” é corrente e preserva a imagem da fome.
- source_word: וַיָּלִינוּ
  choice: passam a noite
  rationale: A forma pode ser relacionada a לוּן/לִין, “passar a noite, pernoitar”. Essa leitura direta foi mantida no texto, enquanto a possível leitura contextual “rosnam” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ritmo poético conciso. “Em busca de comida” comunica naturalmente a finalidade do infinitivo hebraico, e a nota preserva a ambiguidade lexical do último verbo.
