source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: pt
  text: Não os mates, para que o meu povo não se esqueça; faze-os vaguear[a] pelo teu poder[b] e derruba-os, ó Senhor, nosso escudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faze-os cambalear” ou “abala-os”; o verbo hebraico pode indicar movimento errante ou instabilidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela tua força”; a palavra hebraica pode significar força, poder ou força militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵמוֹ
  choice: Não os mates
  rationale: A partícula negativa com a forma volitiva expressa uma proibição. A formulação preserva o pedido para que os inimigos não sejam mortos de imediato.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: para que o meu povo não se esqueça
  rationale: פֶּן introduz o resultado temido. Esta construção é natural em português e conserva a relação negativa de finalidade ou consequência.
- source_word: הֲנִיעֵמוֹ
  choice: faze-os vaguear
  rationale: A forma causativa pode indicar movimento errante ou instabilidade. 'Vaguear' comunica um deslocamento contínuo e inquieto, sem excluir as alternativas registradas em nota.
- source_word: בְחֵילְךָ
  choice: pelo teu poder
  rationale: חַיִל pode designar força, poder ou força militar; aqui, dirigido a Deus e com uso instrumental da preposição, 'pelo teu poder' é a leitura contextual mais natural.
- source_word: וְהוֹרִידֵמוֹ
  choice: e derruba-os
  rationale: O causativo de ירד significa fazer descer. 'Derruba-os' conserva a imagem de rebaixamento e derrota em português corrente.
- source_word: מָגִנֵּנוּ
  choice: nosso escudo
  rationale: Mantém a metáfora concreta e recorrente nos Salmos, em vez de reduzi-la a 'protetor' ou 'defesa'.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: Trata-se do título divino em vocativo, não do tetragrama. 'Ó Senhor' expressa diretamente a invocação.
theological_decisions:
- issue: Natureza do juízo pedido
  choice: O salmista pede que os inimigos não sejam mortos de imediato, mas fiquem sujeitos a um juízo visível e prolongado, para que o povo não se esqueça.
  alternative: O pedido pode ser entendido de modo mais geral como fazer os inimigos cambalear ou ficar instáveis e depois rebaixá-los, sem implicar deslocamento errante.
  rationale: A sequência 'não os mates... faze-os vaguear... derruba-os' contrasta a morte imediata com outra forma de juízo. A tradução preserva essa tensão, enquanto a nota mantém aberta a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O imperativo negativo e os demais pedidos usam formas tradicionais ainda correntes no registro bíblico ('mates', 'faze', 'derruba'), sem arcaísmo excessivo. A aposição 'ó Senhor, nosso escudo' recebe vírgula em português para clareza vocativa.
