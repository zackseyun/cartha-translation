source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ כִּי ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑י/נוּ כִּֽי נָ֝עִים נָאוָ֥ה תְהִלָּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: pt
  text: Louvem Yah[a], pois é bom cantar louvores ao nosso Deus; pois é agradável, e o louvor é apropriado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yah”, forma abreviada do nome divino; muitas traduções trazem “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Ou “belo” ou “digno”; o termo hebraico pode indicar aquilo que é belo, conveniente ou apropriado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louvem
  rationale: Imperativo plural de הלל. “Louvem” preserva a convocação direta e soa natural no português atual.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma abreviada do nome divino, distinta do tetragrama completo. A transliteração preserva a forma hebraica e sua ligação com “aleluia”.
- source_word: כִּי
  choice: pois
  rationale: Introduz, nas duas ocorrências, a razão para a convocação ao louvor. “Pois” mantém a relação explicativa e o tom poético.
- source_word: טוֹב
  choice: bom
  rationale: Preserva o sentido avaliativo amplo do adjetivo sem o limitar à ideia de prazer.
- source_word: זַמְּרָה
  choice: cantar louvores
  rationale: A forma de זמר expressa louvor musical; “cantar louvores” comunica tanto o canto quanto sua orientação devocional.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa do plural.
- source_word: נָעִים
  choice: agradável
  rationale: Expressa a qualidade prazerosa ou deleitosa do louvor em linguagem portuguesa clara e atual.
- source_word: נָאוָה
  choice: apropriado
  rationale: Comunica principalmente aquilo que convém ou é adequado, sem excluir a nuance estética possível.
- source_word: תְהִלָּה
  choice: louvor
  rationale: O substantivo designa o ato ou conteúdo do louvor; a forma simples conserva a concisão hebraica.
theological_decisions:
- issue: Forma portuguesa do nome divino abreviado יָהּ
  choice: Yah
  alternative: o SENHOR
  rationale: O texto traz a forma abreviada יָהּ, não o tetragrama completo. Transliterá-la evita apagar essa distinção e conserva a relação litúrgica com “aleluia”.
- issue: Relação entre נָעִים, נָאוָה e תְהִלָּה
  choice: “o louvor é agradável e apropriado”
  alternative: “é agradável; belo é o louvor”
  rationale: A formulação adotada apresenta “louvor” como referente dos dois adjetivos e produz português natural, mantendo tanto a dimensão prazerosa quanto a de conveniência. A possível nuance estética de נָאוָה é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo foi expresso com duas orações introduzidas por “pois”, e a segunda foi levemente reordenada para fluência sem eliminar a nuance lexical indicada em nota.
