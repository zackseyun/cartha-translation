  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: pt
  text: que cobre os céus de nuvens, que prepara a chuva para a terra e faz a erva brotar nos montes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְכַסֶּה
  choice: que cobre
  rationale: O particípio de כסה descreve a ação característica de cobrir; “que cobre” mantém a ligação poética com o contexto anterior.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural “os céus” preserva a forma e o tom poético do hebraico, embora “o céu” também fosse idiomático em português.
- source_word: בְּעָבִים
  choice: de nuvens
  rationale: עָבִים designa nuvens, possivelmente densas; na construção portuguesa, “cobrir de nuvens” é natural e não acrescenta uma qualificação ausente do texto.
- source_word: הַמֵּכִין
  choice: que prepara
  rationale: O hifil de כון significa preparar ou deixar pronto; aqui comunica a provisão intencional da chuva sem explicitar além do hebraico.
- source_word: לָאָרֶץ
  choice: para a terra
  rationale: No contexto abrangente dos céus, das nuvens e da chuva, “terra” corresponde melhor ao alcance de אֶרֶץ do que “região” ou “país”.
- source_word: מָטָר
  choice: a chuva
  rationale: Equivalente direto, claro e poético do substantivo hebraico.
- source_word: הַמַּצְמִיחַ
  choice: faz ... brotar
  rationale: A forma causativa de צמח é representada naturalmente em português por “faz brotar”.
- source_word: הָרִים
  choice: os montes
  rationale: “Montes” transmite o sentido de elevações ou montanhas e se ajusta ao registro poético dos Salmos sem enfraquecer a imagem.
- source_word: חָצִיר
  choice: a erva
  rationale: חָצִיר pode indicar capim, relva ou vegetação herbácea; “erva” é amplo, natural e apropriado ao cenário dos montes.
theological_decisions:
- issue: A ação divina expressa por uma sequência de particípios
  choice: Manter a sequência descritiva com “que cobre ... que prepara ... e faz ...”
  alternative: 'Transformar a sequência em orações independentes: “Ele cobre ... prepara ... e faz ...”'
  rationale: Os particípios hebraicos estão ligados à descrição de Deus no contexto e apresentam suas ações providenciais como características contínuas. A construção relativa preserva essa ligação sem impor uma interpretação doutrinária adicional.
translation_notes:
  register: Português atual, claro e dignificado, com cadência poética. O último “que” não foi repetido antes de “faz” para evitar rigidez, sem romper o paralelismo. A nota da camada inglesa foi omitida porque seu conteúdo apenas parafraseia הַמַּצְמִיחַ e o marcador após “clouds” não corresponde a uma variante do texto hebraico.
