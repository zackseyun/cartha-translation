base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: pt
  text: Pois ele fortaleceu as barras dos seus portões; abençoou seus filhos[a] em seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus filhos do sexo masculino”. O hebraico pode referir-se especificamente a filhos do sexo masculino ou, de modo mais amplo, aos filhos ou descendentes da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado ao louvor no contexto anterior e mantém o nexo causal com fluidez poética.
- source_word: חִזַּק
  choice: reforçou
  rationale: O piel perfeito de חזק expressa tornar forte ou firme. “Reforçou” é natural com as trancas que protegem os portões e conserva a ação concluída.
- source_word: בְּרִיחֵי
  choice: trancas
  rationale: Designa barras ou ferrolhos usados para fechar e proteger portões. “Trancas” comunica claramente sua função sem especificar demais o mecanismo.
- source_word: שְׁעָרָיִךְ
  choice: dos seus portões
  rationale: O plural com sufixo feminino singular se refere à cidade personificada. “Seus portões” preserva a referência sem inserir explicitamente o nome de Jerusalém.
- source_word: בֵּרַךְ
  choice: abençoou
  rationale: Tradução direta e idiomática do piel perfeito de ברך, preservando a ação concluída.
- source_word: בָּנַיִךְ
  choice: seus filhos
  rationale: בנים pode indicar filhos do sexo masculino ou, em sentido coletivo, os filhos e habitantes da cidade. O contexto cívico favorece a formulação abrangente, mantendo a alternativa lexical em nota.
- source_word: בְּקִרְבֵּךְ
  choice: dentro de você
  rationale: Preserva a imagem da cidade como interlocutora personificada e comunica naturalmente que os filhos estão em seu interior; a expressão mais literal consta em nota.
theological_decisions:
- issue: Cidade personificada como interlocutora no feminino singular
  choice: Manter a interpelação direta por meio de “seus” e “dentro de você”
  alternative: Inserir explicitamente “Jerusalém” ou empregar “teus” e “em teu meio”
  rationale: Os sufixos hebraicos são femininos singulares e apontam para a cidade personificada no contexto. A tradução conserva essa relação sem acrescentar um nome ausente do versículo.
- issue: Amplitude de בנים no contexto cívico
  choice: seus filhos
  alternative: seus filhos homens; seus descendentes; seus habitantes
  rationale: O termo pode ser especificamente masculino ou coletivo. No discurso dirigido à cidade, “filhos” permite o sentido coletivo sem apagar a ambiguidade lexical, explicitada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Você” evita o tom arcaizante de “tu” em grande parte do Brasil, enquanto a personificação da cidade permanece explícita. O ponto e vírgula reproduz o paralelismo das duas ações concluídas sem acrescentar uma conjunção ausente do hebraico.
