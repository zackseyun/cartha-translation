translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. O pronome “Ele” mantém explícito que Deus é o agente, conforme o contexto do salmo. Não se acrescentou nota, pois “geada” comunica adequadamente כְּפוֹר sem exigir uma alternativa técnica.
