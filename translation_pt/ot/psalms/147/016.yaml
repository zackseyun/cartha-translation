  language: pt
  text: Ele dá a neve como lã; espalha a geada como cinza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Ele dá
  rationale: O particípio qal de נתן descreve, na sequência hínica, uma ação característica e contínua de Deus. A forma finita no presente é natural em português e preserva esse sentido habitual.
- source_word: שֶׁלֶג
  choice: neve
  rationale: É o sentido lexical comum e adequado ao contexto.
- source_word: כַּצָּמֶר
  choice: como lã
  rationale: A preposição comparativa כ com צֶמֶר introduz uma símile; a formulação preserva a imagem da neve branca e macia como lã.
- source_word: כְּפוֹר
  choice: geada
  rationale: O substantivo designa geada ou uma camada visível de cristais de gelo. “Geada” é corrente, clara e adequada à imagem em português.
- source_word: כָּאֵפֶר
  choice: como cinza
  rationale: A preposição comparativa כ com אֵפֶר forma a símile. “Cinza”, como substantivo de massa, é a expressão natural em português.
- source_word: יְפַזֵּר
  choice: espalha
  rationale: O piel imperfeito de פזר expressa dispersar ou espalhar. “Espalha” reproduz de modo natural a imagem da geada distribuída sobre a terra.
