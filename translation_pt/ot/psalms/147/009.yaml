  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: pt
  text: Ele dá alimento aos animais e aos filhotes dos corvos[a] que gritam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos filhotes do corvo»; mais literalmente, «aos filhos do corvo».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «que clamam»; o texto não declara explicitamente a quem eles clamam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Ele dá
  rationale: O particípio qal de נתן tem sentido habitual no contexto de louvor; o presente finito é natural em português e retoma Deus, mencionado no contexto.
- source_word: לִבְהֵמָה
  choice: aos animais
  rationale: בְּהֵמָה pode designar um animal ou os animais em geral e, às vezes, o gado. O paralelismo com os corvos favorece aqui o sentido mais amplo.
- source_word: לַחְמָהּ
  choice: alimento
  rationale: Embora לֶחֶם signifique literalmente «pão», também designa comida em geral. «Alimento» comunica com naturalidade o sentido no caso dos animais.
- source_word: לִבְנֵי עֹרֵב
  choice: aos corvos ainda filhotes
  rationale: A construção בְּנֵי seguida do nome de um animal pode indicar seus filhotes. Esta formulação é clara e idiomática, sem perder a imagem dos corvos jovens.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: que gritam
  rationale: קרא pode significar chamar, clamar ou gritar. «Gritam» expressa o som insistente dos filhotes sem acrescentar um destinatário que o hebraico não explicita.
theological_decisions:
- issue: Se deve ser explicitado que os filhotes clamam a Deus
  choice: 'Manter implícito o destinatário: «que gritam»'
  alternative: «que clamam a ele»
  rationale: O contexto apresenta o cuidado providencial de Deus, mas o hebraico não indica expressamente a quem os filhotes chamam. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Alimento» evita o literalismo potencialmente enganoso de «pão», e «corvos ainda filhotes» soa mais natural do que «filhos do corvo».
