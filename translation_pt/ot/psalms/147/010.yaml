  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: pt
  text: Ele não se agrada da força do cavalo, nem tem prazer nas pernas do homem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחְפָּץ
  choice: se agrada
  rationale: Expressa naturalmente o deleite ou satisfação do verbo חפץ neste paralelismo.
- source_word: גְבוּרַת הַסּוּס
  choice: força do cavalo
  rationale: Tradução direta da expressão hebraica, que alude à capacidade militar do cavalo sem explicitar além do texto.
- source_word: שׁוֹקֵי הָאִישׁ
  choice: pernas do homem
  rationale: Preserva a imagem concreta do hebraico e o artigo definido de הָאִישׁ, sem restringir indevidamente o referente a um guerreiro.
- source_word: יִרְצֶה
  choice: tem prazer
  rationale: No paralelo com חפץ, comunica aprovação ou satisfação, mantendo a variação verbal do original.
theological_decisions:
- issue: Objeto da aprovação divina
  choice: Manter as imagens de força equina e pernas humanas sem paráfrase interpretativa.
  alternative: Explicitar como poder militar, velocidade ou força do guerreiro.
  rationale: O verso contrasta recursos de vigor, mas o hebraico conserva imagens concretas; explicitá-las teologicamente reduziria sua amplitude poética.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo natural. A coordenação por “nem” reproduz a dupla negação hebraica de modo idiomático.
