  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: pt
  text: Yahweh se agrada dos que o temem, dos que esperam por seu amor leal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aguardam seu amor leal” ou “põem a esperança em seu amor leal”. O verbo hebraico pode expressar tanto espera quanto esperança. “Amor leal” traduz hesed, termo que reúne as ideias de amor, lealdade e misericórdia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: se agrada
  rationale: O particípio de רצה expressa aqui prazer favorável ou aprovação, não mero querer. “Se agrada” é natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְרֵאָיו
  choice: os que o temem
  rationale: Preserva a linguagem bíblica de temor diante de Deus e sua tensão reverente, sem reduzi-la a simples respeito.
- source_word: הַמְיַחֲלִים
  choice: os que esperam
  rationale: O verbo יחל pode envolver tanto esperar quanto ter esperança; “esperam” conserva essa amplitude natural no contexto.
- source_word: לְחַסְדּוֹ
  choice: em seu amor leal
  rationale: חסד reúne amor, lealdade e misericórdia. “Amor leal” comunica de modo conciso sua dimensão relacional e duradoura.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o nome divino; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido do temor de Deus
  choice: os que o temem
  alternative: os que o reverenciam
  rationale: “Temem” mantém a formulação e a tensão teológica do hebraico, que inclui reverência sem eliminar a noção de temor.
- issue: Relação expressa por יחל com לְ
  choice: esperam em seu amor leal
  alternative: aguardam seu amor leal; põem a esperança em seu amor leal
  rationale: A construção indica expectativa confiante dirigida ao חסד de Yahweh. “Esperam em” preserva em português a sobreposição entre espera e esperança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada, assim como o verbo “temer” e a riqueza semântica de hesed.
