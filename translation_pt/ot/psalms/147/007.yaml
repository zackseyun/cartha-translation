  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: pt
  text: Cantem a Yahweh com ações de graças[a]; entoem louvores ao nosso Deus com a lira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Respondam a Yahweh com ações de graças”. O verbo hebraico pode significar “responder”, mas aqui provavelmente se refere a cantar em resposta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com a harpa”. O hebraico kinnor designa um instrumento de cordas, mais precisamente uma lira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Cantem
  rationale: Embora o verbo ענה possa significar “responder”, neste contexto poético e musical, em paralelo com זַמְּרוּ, ele provavelmente se refere a cantar em resposta ou elevar um cântico. “Cantem” comunica esse sentido de modo natural.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário do cântico. O nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no texto hebraico.
- source_word: בְּתוֹדָה
  choice: com ações de graças
  rationale: תּוֹדָה expressa agradecimento ou louvor agradecido; “com ações de graças” conserva essa ênfase e corresponde ao valor de acompanhamento da preposição ב.
- source_word: זַמְּרוּ
  choice: entoem louvores
  rationale: זמר descreve cantar ou fazer música em louvor, muitas vezes com acompanhamento instrumental. “Entoem louvores” preserva o caráter vocal e musical sem repetir simplesmente “cantem”.
- source_word: לֵאלֹהֵינוּ
  choice: ao nosso Deus
  rationale: A preposição ל marca o destinatário do louvor, e o sufixo de primeira pessoa do plural preserva a dimensão comunitária de “nosso Deus”.
- source_word: בְכִנּוֹר
  choice: com a lira
  rationale: כִּנּוֹר designa um instrumento de cordas da família da lira. “Lira” é historicamente mais preciso que o tradicional “harpa”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” mantém o nome da aliança sem substituí-lo por um título.
- issue: Sentido de ענה no contexto do culto
  choice: Cantem
  alternative: Respondam
  rationale: O paralelismo com זמר e a referência ao acompanhamento instrumental favorecem o sentido de canto responsivo, mas a nota conserva a possibilidade lexical mais literal de “responder”.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O paralelismo poético foi preservado por meio de dois imperativos distintos: “Cantem” e “entoem louvores”.'
