  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: pt
  text: Ele cura os de coração partido e enfaixa suas feridas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas dores” ou “suas lesões”. O termo hebraico pode indicar dor ou dano; “feridas” foi escolhido porque combina com a imagem de enfaixar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Ele cura
  rationale: O particípio qal de רפא tem valor descritivo e habitual no contexto de louvor. O presente finito é natural em português e expressa adequadamente a ação característica de Deus.
- source_word: לִשְׁבוּרֵי לֵב
  choice: os de coração partido
  rationale: A expressão construta significa literalmente “os quebrados de coração”. “De coração partido” conserva a metáfora e é uma formulação corrente e compreensível em português.
- source_word: וּמְחַבֵּשׁ
  choice: e enfaixa
  rationale: O particípio de חבש, em contexto de cura, indica envolver com faixas ou tratar uma ferida. “Enfaixa” mantém de modo claro e conciso a imagem médica concreta.
- source_word: לְעַצְּבוֹתָם
  choice: suas feridas
  rationale: O substantivo pode indicar dores, lesões ou sofrimentos. “Feridas” se ajusta melhor à ação concreta de enfaixar, sem excluir a dor interior evocada pelo paralelismo.
theological_decisions:
- issue: Alcance da imagem de cura
  choice: Preservar em conjunto a angústia interior e a imagem concreta de tratamento de feridas.
  alternative: Entender o versículo exclusivamente como cura espiritual ou principalmente como cura física.
  rationale: O paralelismo une pessoas de coração partido ao ato de enfaixar suas feridas, combinando sofrimento interior e imagem corporal sem limitar a afirmação a apenas um deles.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva a metáfora hebraica e evita linguagem excessivamente técnica ou confessional.
