base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: pt
  text: Ele lança o seu gelo como migalhas[a]; diante do seu frio, quem pode resistir?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como bocados” ou “como pedaços”. A imagem hebraica é de pequenos fragmentos, provavelmente evocando pedaços de pão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem ficará de pé?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: lança
  rationale: O particípio hifil de שלך descreve Deus fazendo o gelo cair ou ser lançado; “lança” conserva a força e a concisão da imagem poética.
- source_word: קַרְחוֹ
  choice: o seu gelo
  rationale: קֶרַח designa gelo ou geada. “Gelo” combina naturalmente com o ato de lançar e mantém concreta a imagem das partículas congeladas.
- source_word: כְפִתִּים
  choice: como migalhas
  rationale: פִּתִּים são pedaços ou bocados, especialmente fragmentos de pão; “migalhas” comunica de modo claro a imagem de pequenos pedaços espalhados.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém o sentido espacial e figurado de estar perante a força do frio de Deus.
- source_word: קָרָתוֹ
  choice: seu frio
  rationale: קָרָה significa “frio”; o possessivo preserva a apresentação poética do clima sob o domínio de Deus.
- source_word: מִי יַעֲמֹד
  choice: quem pode resistir
  rationale: A forma verbal significa literalmente “quem ficará de pé”, mas, nesta pergunta retórica, expressa suportar ou resistir; a formulação portuguesa é natural e conserva o sentido contextual.
