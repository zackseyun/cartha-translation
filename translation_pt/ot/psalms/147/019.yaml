base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/019.yaml
  text: He declares his word to Jacob[b][a], his statutes and his judgments to Israel.
translation:
  language: pt
  text: 'Ele dá a conhecer[a] a sua palavra a Jacó,

    seus estatutos e suas decisões[b] a Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declara a sua palavra a Jacó” ou “anuncia a sua palavra a Jacó”.'
    reason: lexical_alternative
  - marker: b
    text: “Decisões” também pode ser traduzido por “ordenanças”, “normas” ou “juízos” neste contexto jurídico e pactual.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: revela
  rationale: O particípio hifil de נגד expressa tornar conhecido ou declarar. “Revela” é natural em português e comunica que Deus dá a conhecer sua palavra, sem reduzir o verbo a um simples ato de contar.
- source_word: דברו
  choice: a sua palavra
  rationale: דָּבָר pode significar “palavra”, “mensagem” ou “assunto”. No paralelismo com estatutos e decisões, “a sua palavra” preserva o sentido amplo e pactual.
- source_word: ליעקב
  choice: a Jacó
  rationale: A preposição ל marca o destinatário; “Jacó” preserva diretamente o nome pactual e seu sentido coletivo no paralelismo com Israel.
- source_word: חקיו
  choice: seus estatutos
  rationale: חֻקִּים designa prescrições ou decretos estabelecidos. “Estatutos” mantém o registro jurídico-pactual e é compreensível em português.
- source_word: ומשפטיו
  choice: e suas decisões
  rationale: מִשְׁפָּטִים pode designar decisões judiciais, ordenanças ou normas. “Decisões” conserva a dimensão jurídica sem sugerir aqui apenas atos de condenação.
- source_word: לישראל
  choice: a Israel
  rationale: A preposição marca novamente o destinatário. “Israel” corresponde poeticamente a “Jacó” como designação do povo da aliança.
theological_decisions:
- issue: Sentido coletivo de Jacó/Israel
  choice: Manter “Jacó” e “Israel” sem acrescentar “povo de” ou “descendentes de”.
  alternative: Explicitar “ao povo de Jacó” ou “aos descendentes de Jacó”.
  rationale: O hebraico emprega diretamente os dois nomes pactuais em paralelismo. Preservá-los mantém a força poética e evita uma expansão interpretativa.
- issue: Relação entre palavra, estatutos e decisões
  choice: Preservar o paralelismo sem afirmar explicitamente se o segundo verso redefine ou apenas desenvolve “a sua palavra”.
  alternative: Parafrasear “a sua palavra, isto é, seus estatutos e suas ordenanças”.
  rationale: O texto associa estreitamente os termos, mas não contém um marcador explicativo que exija identificá-los de modo exaustivo.
translation_notes:
  register: Português moderno, digno e acessível, com disposição poética em dois versos. “Revela” favorece a naturalidade brasileira sem apagar o sentido de tornar conhecido; as notas registram as principais alternativas. Todos os possessivos hebraicos foram preservados.
