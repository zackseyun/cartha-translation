  text: בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
translation:
  language: pt
  text: Yahweh edifica Jerusalém; reúne os dispersos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os expulsos”, “os desterrados” ou “os exilados de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: reconstrói
  rationale: O particípio qal de בנה expressa ação habitual ou em curso. No contexto de restauração, “reconstrói” comunica naturalmente que Jerusalém está sendo edificada novamente, sem perder o sentido concreto do verbo.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada em português para o nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: נִדְחֵי
  choice: os dispersos
  rationale: A forma derivada de נדח designa os que foram afastados, expulsos ou espalhados. “Os dispersos” preserva a amplitude do termo e se ajusta à imagem de serem reunidos.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma padrão do nome nacional em português.
- source_word: יְכַנֵּס
  choice: reúne
  rationale: O piel imperfeito de כנס significa reunir ou congregar. O presente exprime bem a ação característica paralela ao particípio da primeira oração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. “Yahweh” conserva o nome pessoal e evita substituí-lo por um título.
- issue: Alcance de נִדְחֵי יִשְׂרָאֵל
  choice: os dispersos de Israel
  alternative: os exilados de Israel; os expulsos de Israel
  rationale: O termo pode abranger dispersão, expulsão ou exílio; “dispersos” evita restringir a referência a uma deportação formal específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Reconstrói” explicita o sentido restaurador sugerido pelo contexto; o paralelismo verbal foi mantido no presente. O único marcador de nota aparece no texto após a expressão a que se refere.
