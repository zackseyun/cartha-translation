  text: הַ/שָּׂם גְּבוּלֵ֥/ךְ שָׁל֑וֹם חֵ֥לֶב חִ֝טִּ֗ים יַשְׂבִּיעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/014.yaml
  text: He makes your borders peaceful[a]; he satisfies you with the finest wheat.
translation:
  language: pt
  text: Ele torna pacíficas as tuas fronteiras e te sacia com o melhor trigo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com a gordura do trigo”, expressão hebraica que indica o trigo mais rico ou de melhor qualidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: Ele torna
  rationale: O particípio de שׂים descreve a ação contínua de Deus; em português, a forma verbal finita é natural, e “torna” expressa bem o resultado causado no contexto.
- source_word: גְּבוּלֵךְ
  choice: as suas fronteiras
  rationale: גְּבוּל pode indicar limite, fronteira ou território. O plural idiomático “fronteiras” se ajusta à referência a Jerusalém, tratada no feminino no contexto.
- source_word: שָׁלוֹם
  choice: pacíficas
  rationale: שָׁלוֹם abrange paz, bem-estar e segurança. Aqui funciona como resultado predicativo ligado às fronteiras; “pacíficas” produz português claro sem reduzir a ideia apenas a uma delimitação geográfica.
- source_word: חֵלֶב
  choice: o melhor
  rationale: Literalmente “gordura”, mas, nesse uso idiomático, designa a parte mais rica, excelente ou seleta.
- source_word: חִטִּים
  choice: trigo
  rationale: O substantivo designa especificamente trigo, e não cereais em geral.
- source_word: יַשְׂבִּיעֵךְ
  choice: a sacia
  rationale: O hifil de שׂבע significa satisfazer, fartar ou saciar. “Sacia” combina naturalmente com a provisão abundante de alimento e conserva o sufixo feminino singular dirigido a Jerusalém.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concordância feminina singular porque o verso se dirige a Jerusalém. A tradução mantém o paralelismo poético e verte o primeiro hemistíquio de modo natural, sem ocultar o valor de paz, bem-estar e segurança de שָׁלוֹם.
