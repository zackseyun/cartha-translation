  source_fidelity: A tradução acompanha adequadamente a negação, o contraste contextual com Israel, o sentido normativo de מִשְׁפָּטִים e o imperativo plural final. Contudo, o possessivo em “as suas ordenanças” pode ser lido como referente às nações, não a Deus, enquanto o sufixo hebraico se refere inequivocamente aos juízos de Deus.
  naturalness: “Elas não conheceram” após “nenhuma outra nação” é gramaticalmente possível, mas soa menos fluente por alternar entre o singular indefinido e um pronome plural. Uma formulação com sujeito elíptico e possessivo desambiguado é mais natural e concisa.
  terminology: “Ordenanças” é uma opção adequada para מִשְׁפָּטִים neste contexto. “Yah” preserva corretamente a forma curta יָהּ; “Louvem a Yah!” reflete o imperativo plural.
  issues:
