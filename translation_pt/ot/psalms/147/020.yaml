  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: pt
  text: Ele não fez assim com nenhuma outra nação; não conheceram as ordenanças dele. Louvem a Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aleluia!” Em hebraico, halelu-yah significa literalmente “Louvem a Yah”, empregando a forma abreviada do nome divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן
  choice: Ele não fez assim
  rationale: Reproduz de modo conciso a negação, o perfeito de עשה e a referência retrospectiva de כֵן ao tratamento descrito nos versículos anteriores.
- source_word: לְכָל גּוֹי
  choice: com nenhuma outra nação
  rationale: Sob a negação, לְכָל tem sentido distributivo, 'com nenhuma nação'. Acrescenta-se 'outra' para expressar naturalmente em português o contraste implícito com Israel, sem alterar o referente.
- source_word: וּמִשְׁפָּטִים
  choice: as suas ordenanças
  rationale: מִשְׁפָּטִים designa aqui as determinações normativas de Deus comunicadas a Israel. 'Ordenanças' mantém o âmbito jurídico sem restringi-lo a sentenças judiciais; o possessivo explicita que são de Deus.
- source_word: בַּל יְדָעוּם
  choice: elas não conheceram
  rationale: Mantém o valor poético da negação בַּל e o sentido básico de ידע. O pronome objeto hebraico é expresso em português pelo antecedente 'as suas ordenanças'.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: O imperativo plural é vertido por 'Louvem', e יָהּ é preservado como 'Yah', a forma abreviada do nome divino presente no hebraico.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ
  choice: Yah
  alternative: SENHOR; Aleluia
  rationale: O texto traz יָהּ, forma curta do nome divino. A transliteração preserva essa forma específica e torna transparente o conteúdo da aclamação, em vez de expandi-la para 'SENHOR' ou transliterar toda a expressão como 'Aleluia'.
- issue: Sentido de מִשְׁפָּטִים no contexto da revelação dada a Israel
  choice: ordenanças
  alternative: juízos; decretos; normas
  rationale: '''Ordenanças'' comunica determinações divinas de caráter normativo e preserva a dimensão jurídica do termo, sem reduzi-lo apenas a decisões judiciais.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural feminino 'elas' retoma 'nação' de modo gramaticalmente natural; 'outra' explicita o contraste contextual com Israel. A formulação conserva o paralelismo e a concisão poética do hebraico.
