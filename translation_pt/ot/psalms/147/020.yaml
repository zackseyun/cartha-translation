- from: Ele não fez assim com nenhuma outra nação; elas não conheceram as suas ordenanças. Louvem a Yah![a]
  to: Ele não fez assim com nenhuma outra nação; não conheceram as ordenanças dele. Louvem a Yah![a]
  rationale: A revisão elimina a ambiguidade do possessivo ao explicitar que as ordenanças são dele, isto é, de Deus, e torna a segunda oração mais fluente em português por deixar implícito o sujeito coletivo (“as nações”). Mantêm-se o contraste contextual expresso por “outra”, a terminologia jurídica e a tradução transparente da aclamação hebraica.
