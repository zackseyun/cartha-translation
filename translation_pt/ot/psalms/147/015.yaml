  text: הַ/שֹּׁלֵ֣חַ אִמְרָת֣/וֹ אָ֑רֶץ עַד מְ֝הֵרָ֗ה יָר֥וּץ דְּבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: pt
  text: Ele envia sua ordem[a] à terra; sua palavra corre com grande rapidez.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «declaração» ou «enunciado».
    reason: lexical_alternative
  - marker: b
    text: Ou «muito rapidamente»; a expressão hebraica enfatiza a velocidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Ele envia
  rationale: O particípio tem valor verbal no contexto e descreve a ação contínua de Deus; a forma finita é natural em português.
- source_word: אִמְרָתוֹ
  choice: sua ordem
  rationale: Embora o substantivo possa significar «declaração» ou «enunciado», «ordem» comunica aqui a eficácia da fala divina e mantém uma distinção poética em relação a דְּבָרוֹ.
- source_word: אָרֶץ
  choice: à terra
  rationale: O acusativo direcional indica o destino da ordem; «terra» corresponde ao alcance cósmico do contexto, em vez do sentido mais localizado de «país» ou «território».
- source_word: עַד מְהֵרָה
  choice: com grande rapidez
  rationale: A expressão adverbial salienta a velocidade. Esta formulação comunica a intensidade com naturalidade, sem eliminar a imagem do verbo seguinte.
- source_word: יָרוּץ
  choice: corre
  rationale: Preserva o sentido básico do verbo e a personificação poética da palavra de Deus em movimento.
- source_word: דְּבָרוֹ
  choice: sua palavra
  rationale: «Palavra» é a tradução mais natural neste contexto e conserva tanto o paralelismo com אִמְרָתוֹ quanto a variação lexical do hebraico.
theological_decisions:
- issue: Natureza da fala divina no paralelismo poético
  choice: Apresentar a fala de Deus como ordem e palavra eficazes, sem identificar a «palavra» explicitamente com o Logos pessoal.
  alternative: Traduzir os dois substantivos por «palavra» ou inserir no texto principal uma leitura cristológica explícita.
  rationale: O salmo celebra a eficácia da fala de Deus na criação e na providência, mas o versículo hebraico não faz por si só uma identificação cristológica explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Com grande rapidez» preserva a ênfase da expressão hebraica, e «corre» mantém a imagem poética.
