  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: pt
  text: Louva Yahweh, Jerusalém; louva o teu Deus, Sião.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: Celebre
  rationale: Imperativo feminino singular dirigido à Jerusalém personificada. “Celebre” transmite louvor público e distingue naturalmente este verbo de הַֽלְלִי no paralelismo.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do nome próprio em português; o vocativo preserva a personificação da cidade.
- source_word: אֶת יְהוָה
  choice: o SENHOR
  rationale: O marcador de objeto direto introduz o nome divino. A forma “o SENHOR” segue a convenção portuguesa amplamente reconhecida para o Tetragrama, enquanto a nota preserva explicitamente o nome hebraico.
- source_word: הַֽלְלִי
  choice: louve
  rationale: Imperativo feminino singular de הלל. “Louve” é claro, atual e mantém a força exortativa do verso.
- source_word: אֱלֹהַיִךְ
  choice: o seu Deus
  rationale: A forma com sufixo feminino singular refere-se ao Deus de Sião. “Seu” concorda com o tratamento de Jerusalém/Sião em terceira pessoa no português brasileiro corrente.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e corrente do nome em português, paralela a Jerusalém e sem expansão interpretativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: SENHOR no texto, com Yahweh em nota
  alternative: Yahweh no texto principal
  rationale: A convenção “SENHOR” oferece reconhecimento imediato aos leitores de língua portuguesa; a nota registra sem ocultação que o hebraico traz o nome próprio Yahweh, preservando a informação textual e a tensão entre tradução e transliteração.
translation_notes:
  register: Português moderno, claro e digno, com vocativos poéticos preservados. O paralelismo foi expresso por “celebre” e “louve”, evitando repetição desnecessária sem enfraquecer a sinonímia hebraica.
