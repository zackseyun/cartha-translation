source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: pt
  text: Yahweh ergue os humildes[a]; faz os perversos descer até o chão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ampara” ou “sustenta os humildes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “até a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: ergue
  rationale: O particípio de עודד pode indicar fortalecer, amparar ou restaurar. “Ergue” expressa esse auxílio de modo natural e preserva o contraste vertical com fazer os perversos descer.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar os humildes, mansos ou socialmente oprimidos. “Os humildes” mantém a amplitude moral e social do hebraico e contrasta adequadamente com “os perversos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַשְׁפִּיל
  choice: faz ... descer
  rationale: A forma causativa de שׁפל significa tornar baixo ou rebaixar. A formulação conserva a ação causativa e o paralelismo antitético com “ergue”.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: “Perversos” comunica com clareza a categoria ética de רְשָׁעִים no uso dos Salmos, sem ampliação interpretativa.
- source_word: עֲדֵי אָרֶץ
  choice: até o chão
  rationale: A expressão indica movimento ou rebaixamento até a terra. “Até o chão” é idiomático em português e conserva a intensidade da imagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo foi mantido por meio do contraste entre “ergue” e “faz ... descer”; as notas preservam alternativas lexicais genuínas do hebraico.
