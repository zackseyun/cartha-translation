  text: יִשְׁלַ֣ח דְּבָר֣/וֹ וְ/יַמְסֵ֑/ם יַשֵּׁ֥ב ר֝וּח֗/וֹ יִזְּלוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: pt
  text: Ele envia sua palavra e os derrete; faz soprar seu vento[a], e as águas correm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu espírito” ou “seu sopro”. A palavra hebraica pode ter qualquer um desses sentidos, mas “vento” se ajusta melhor às imagens meteorológicas deste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: envia
  rationale: O qal imperfeito de שׁלח expressa aqui a ação característica de Deus. “Envia” preserva a força concreta do verbo e soa natural em português.
- source_word: דְּבָרוֹ
  choice: sua palavra
  rationale: דבר pode significar “palavra”, “assunto” ou “ordem”. “Sua palavra” conserva a expressão poética e deixa implícita, sem a explicitar em excesso, a força de comando no contexto.
- source_word: וְיַמְסֵם
  choice: e os derrete
  rationale: O hifil de מסס com sufixo masculino plural significa “fazê-los derreter”. O pronome retoma as formas congeladas mencionadas no versículo anterior, sem inserir no texto um referente mais específico que o hebraico não repete.
- source_word: יַשֵּׁב
  choice: faz soprar
  rationale: O hifil de נשׁב tem sentido causativo, “fazer soprar”. Esta formulação é idiomática e preserva a agência divina.
- source_word: רוּחוֹ
  choice: seu vento
  rationale: רוּחַ pode designar vento, sopro ou espírito. No contexto meteorológico imediato, “vento” é o sentido mais provável, enquanto as demais possibilidades são preservadas em nota.
- source_word: יִזְּלוּ
  choice: correm
  rationale: O qal imperfeito plural de נזל descreve líquidos que fluem. “As águas correm” é uma formulação poética, clara e natural em português.
- source_word: מָיִם
  choice: as águas
  rationale: O plural poético “as águas” corresponde ao substantivo hebraico e concorda naturalmente com o verbo plural.
theological_decisions:
- issue: Sentido de רוּחוֹ em relação à ação divina
  choice: seu vento
  alternative: seu espírito ou seu sopro
  rationale: 'O versículo descreve o domínio de Deus sobre o clima: sua palavra derrete o que está congelado, seu vento sopra e as águas correm. “Vento” é o sentido contextual mais direto, sem impor uma leitura pneumatológica; a amplitude lexical do hebraico permanece registrada na nota.'
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. A ordem das orações e o pronome “os” preservam a concisão e a referência implícita do hebraico.
