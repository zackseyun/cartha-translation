  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: pt
  text: Ele conta o número das estrelas; chama cada uma pelo nome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה מִסְפָּר
  choice: conta o número
  rationale: A combinação expressa enumeração exata. A tradução mantém os dois elementos do hebraico e soa natural em português.
- source_word: לַכּוֹכָבִים
  choice: das estrelas
  rationale: O ל integra aqui a construção idiomática com מִסְפָּר; em português, a relação é expressa naturalmente por “das estrelas”.
- source_word: לְכֻלָּם
  choice: cada uma
  rationale: Embora literalmente seja “a todas elas”, “cada uma” preserva a abrangência distributiva e concorda naturalmente com “estrelas” em português.
- source_word: שֵׁמוֹת
  choice: pelo nome
  rationale: O plural literal “nomes” participa da expressão com קרא. “Pelo nome” é a formulação idiomática portuguesa e comunica identificação individual.
- source_word: יִקְרָא
  choice: chama
  rationale: קרא pode significar chamar, nomear ou convocar. “Chama ... pelo nome” preserva a imagem do texto sem decidir desnecessariamente entre nomeação e convocação.
theological_decisions:
- issue: Sujeito divino implícito
  choice: Ele
  alternative: O SENHOR
  rationale: O hebraico não repete o nome divino; o sujeito é recuperado do contexto. “Ele” preserva essa continuidade sem tornar explícito o que está apenas implícito no versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A segunda oração usa “cada uma” para transmitir a força distributiva de “todas elas” sem perder a referência feminina às estrelas.
