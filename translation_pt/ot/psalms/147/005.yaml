  text: גָּד֣וֹל אֲדוֹנֵ֣י/נוּ וְ/רַב כֹּ֑חַ לִ֝/תְבוּנָת֗/וֹ אֵ֣ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: pt
  text: Grande é o nosso Senhor e imenso em poder; seu entendimento é incalculável.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não há número para o seu entendimento”; também pode ser traduzido: “seu entendimento não tem número”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grande
  rationale: Mantém o adjetivo predicativo na abertura e preserva a força do louvor e a ordem enfática do hebraico.
- source_word: אֲדֹנֵינוּ
  choice: o nosso Senhor
  rationale: Traduz אֲדוֹן como título, sem confundi-lo com o nome divino YHWH, e conserva o sufixo possessivo de primeira pessoa do plural.
- source_word: וְרַב כֹּחַ
  choice: e imenso em poder
  rationale: Expressa a grande abundância de poder indicada por רַב כֹּחַ em português natural, evitando a repetição pouco elegante de “grande”.
- source_word: לִתְבוּנָתוֹ
  choice: seu entendimento
  rationale: “Entendimento” comunica de modo amplo e acessível o sentido de compreensão, discernimento ou inteligência de תְּבוּנָה.
- source_word: אֵין מִסְפָּר
  choice: é incalculável
  rationale: Reproduz de modo idiomático a afirmação hebraica de que não há número ou contagem possível, sem limitar o sentido a uma quantidade literalmente enumerável.
theological_decisions:
- issue: Tradução do título divino אֲדֹנֵינוּ
  choice: o nosso Senhor
  alternative: o nosso mestre
  rationale: O texto usa אֲדוֹן com o sufixo “nosso”, não o nome divino YHWH. “Nosso Senhor” preserva o valor titular e a linguagem de adoração sem introduzir a convenção usada para o nome divino.
- issue: Descrição do entendimento divino como אֵין מִסְפָּר
  choice: é incalculável
  alternative: não há número para o seu entendimento
  rationale: A formulação principal conserva a transcendência quantitativa expressa pelo idioma hebraico em linguagem portuguesa natural; a nota registra a imagem literal de número sem transformar a frase numa afirmação filosófica mais específica sobre infinitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A inversão “Grande é o nosso Senhor” conserva a ênfase do hebraico; “incalculável” oferece naturalidade sem apagar a imagem de contagem, explicitada na nota.
