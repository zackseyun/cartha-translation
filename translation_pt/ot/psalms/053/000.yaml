  text: לַ/מְנַצֵּ֥חַ עַֽל מָחֲלַ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: pt
  text: 'Para o diretor de música: segundo Maalate[a]. Masquil[b] de Davi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Possivelmente o nome de uma melodia ou um termo musical ou litúrgico; o sentido de “Maalate” é incerto.
    reason: lexical_alternative
  - marker: b
    text: “Masquil” é um termo técnico dos títulos dos salmos, talvez indicando uma composição didática ou contemplativa.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica “de Davi” pode indicar autoria, associação, dedicação ou vínculo com uma coleção.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para o diretor de música
  rationale: Nos títulos dos salmos, o termo designa quem supervisiona a execução musical. A formulação é clara em português atual e não limita necessariamente a função à direção de um coro.
- source_word: עַל
  choice: segundo
  rationale: Neste contexto musical, a preposição pode introduzir uma melodia, um estilo ou uma indicação de execução. “Segundo” mantém aberta a natureza exata da relação.
- source_word: מָחֲלַת
  choice: Maalate
  rationale: Como o referente é incerto e pode ser o nome de uma melodia ou um termo musical ou litúrgico, a transliteração evita uma tradução semântica especulativa.
- source_word: מַשְׂכִּיל
  choice: Masquil
  rationale: Trata-se de um termo técnico dos títulos de salmos cujo sentido exato é discutido. A transliteração preserva essa incerteza sem impor a interpretação de composição didática ou contemplativa.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, vínculo, dedicação ou associação a uma coleção. “De Davi” é natural em português e preserva melhor essa amplitude do que “escrito por Davi”.
theological_decisions:
- issue: Natureza do título e atribuição davídica
  choice: Traduzir o título como parte do texto e verter לְדָוִד por “de Davi”.
  alternative: Traduzir explicitamente “escrito por Davi” ou tratar o título como material editorial não traduzido.
  rationale: O texto hebraico inclui o título, e sua tradução respeita a forma textual recebida. “De Davi” não faz uma afirmação de autoria mais específica do que a construção hebraica permite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Diretor de música” comunica a função sem arcaísmo; “Maalate” e “Masquil” são transliterações acompanhadas de notas que preservam a incerteza dos termos técnicos.
