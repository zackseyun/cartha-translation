source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: pt
  text: Quem dera viesse de Sião a salvação de Israel! Quando Deus restaurar a sorte do seu povo[a], exulte Jacó; alegre-se Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando Deus trouxer de volta o povo cativo” ou “Quando Deus fizer voltar do cativeiro o seu povo”. O idioma hebraico pode indicar uma restauração geral depois da aflição, muitas vezes incluindo o retorno do cativeiro.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão hebraica é idiomática e comunica desejo intenso, não uma pergunta literal. “Quem dera” preserva com naturalidade o tom de anseio.
- source_word: מִצִּיּוֹן
  choice: de Sião
  rationale: A preposição מִן indica fonte ou origem; “de Sião” é a forma mais natural em português.
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: a salvação de Israel
  rationale: Embora יְשֻׁעוֹת esteja morfologicamente no plural, pode funcionar como plural abstrato ou intensivo. O singular coletivo “a salvação” expressa de modo natural a libertação esperada para Israel.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: Quando Deus restaurar a sorte do seu povo
  rationale: A construção com בְּ e infinitivo tem valor temporal. O idioma שׁוּב שְׁבוּת costuma indicar reversão da aflição e restauração, embora possa incluir o retorno do cativeiro; a ambiguidade é registrada em nota.
- source_word: יָגֵל
  choice: exulte
  rationale: O valor volitivo combina com o anseio da primeira oração. “Exulte” preserva a intensidade e permite distinguir o verbo de יִשְׂמַח.
- source_word: יִשְׂמַח
  choice: alegre-se
  rationale: A forma volitiva mantém o tom de desejo e “alegre-se” reproduz a variação lexical do paralelismo.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacó / Israel
  rationale: Os nomes são mantidos como designações poéticas paralelas do mesmo povo.
theological_decisions:
- issue: Sentido do idioma שׁוּב שְׁבוּת
  choice: restaurar a sorte do seu povo
  alternative: trazer de volta o povo cativo / fazer voltar do cativeiro o seu povo
  rationale: O idioma pode referir-se especificamente ao retorno do cativeiro, mas também tem o sentido mais amplo de reverter uma situação de aflição. A tradução principal conserva esse alcance amplo sem excluir a restauração histórica, e a leitura mais literal é apresentada em nota.
- issue: Valor dos verbos יָגֵל e יִשְׂמַח
  choice: exulte Jacó; alegre-se Israel
  alternative: Jacó exultará; Israel se alegrará
  rationale: No contexto do desejo introduzido por מִי יִתֵּן, os verbos podem ser entendidos como continuação volitiva do anseio. A alternativa futura é gramaticalmente possível, mas o valor de desejo articula melhor a progressão poética.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Quem dera” conserva o tom poético de anseio; “exulte” e “alegre-se” mantêm a variação do paralelismo hebraico.
