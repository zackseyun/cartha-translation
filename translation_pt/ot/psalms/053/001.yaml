id: PSA.53.1
reference: Psalms 53:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: pt
  text: 'O insensato diz em seu coração: “Deus não existe”. Eles se corromperam e cometeram injustiça detestável[a]; não há quem faça o bem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praticaram um mal detestável” ou “tornaram detestáveis os seus atos”. O hebraico combina um verbo relacionado ao que é abominável com um substantivo que significa “mal”, “injustiça” ou “iniquidade”.
    reason: alternativa lexical
lexical_decisions:
- source_word: נָבָל
  choice: o insensato
  rationale: Designa alguém moralmente insensato e afastado de Deus, não apenas uma pessoa de pouca inteligência. “Insensato” comunica melhor essa dimensão ética no português atual.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Preserva a imagem antropológica hebraica para o pensamento e a disposição interiores, sem reduzi-la simplesmente a “para si mesmo”.
- source_word: אֵין אֱלֹהִים
  choice: Deus não existe
  rationale: Expressa de modo natural em português a negação existencial do hebraico. “Deus” refere-se ao Deus de Israel no contexto do salmo.
- source_word: הִשְׁחִיתוּ
  choice: eles se corromperam
  rationale: Conserva a mudança do representante singular para os verbos no plural e comunica tanto a corrupção moral quanto o estado resultante.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: e cometeram injustiça detestável
  rationale: Combina de modo idiomático o verbo ligado à abominação com o substantivo que significa maldade ou injustiça, preservando a força ética da expressão.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: não há quem faça o bem
  rationale: Reproduz com naturalidade a construção existencial seguida de particípio e sua afirmação abrangente.
theological_decisions:
- issue: Mudança do singular “insensato” para verbos no plural
  choice: 'Manter o singular na primeira oração e o plural nas seguintes: “O insensato diz... Eles se corromperam...”'
  alternative: Uniformizar tudo no singular ou generalizar tudo no plural.
  rationale: A mudança gramatical está no texto hebraico e amplia a descrição do insensato representativo para a classe de pessoas caracterizada por essa atitude.
- issue: Forma masculina do representante singular
  choice: “em seu coração”
  alternative: Empregar uma formulação impessoal ou plural.
  rationale: O sufixo hebraico é masculino singular e retoma o representante singular; a tradução preserva essa forma sem ampliar nem restringir além do original.
- issue: Formulação da negação אֵין אֱלֹהִים
  choice: “Deus não existe”
  alternative: “Não há Deus”.
  rationale: As duas formulações são semanticamente possíveis. A escolhida expressa com clareza, em português corrente, a negação existencial no quadro teológico israelita, sem transformá-la em mera afirmação de ausência local.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém a imagem do coração, a mudança retórica do singular para o plural e a tensão lexical da expressão hebraica sobre abominação e injustiça.
