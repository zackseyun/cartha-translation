  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: pt
  text: Deus olha dos céus para os filhos dos homens[a], para ver se há alguém que entenda, alguém que busque a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. Em hebraico, “os filhos dos homens” é uma expressão coletiva que se refere aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o contexto se refere ao único Deus; por isso, o singular português é exigido.
- source_word: מִשָּׁמַיִם
  choice: dos céus
  rationale: Conserva o plural da expressão hebraica e soa natural em português no registro poético bíblico.
- source_word: הִשְׁקִיף
  choice: olha
  rationale: O verbo descreve o ato de observar a partir de um lugar elevado. O presente dá vivacidade poética, como na camada inglesa consultada, sem alterar a imagem da inspeção divina.
- source_word: בְּנֵי אָדָם
  choice: os filhos dos homens
  rationale: Preserva a forma concreta e coletiva do hebraico, que se refere aos seres humanos em geral; a nota esclarece esse alcance inclusivo.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Expressa de modo direto o infinitivo de propósito ligado ao ato de olhar.
- source_word: הֲיֵשׁ
  choice: se há alguém
  rationale: 'Reproduz naturalmente em português a construção interrogativa existencial: verifica-se se existe uma pessoa assim.'
- source_word: מַשְׂכִּיל
  choice: que entenda
  rationale: Mantém a ideia de discernimento ou compreensão, sem reduzi-la a inteligência meramente intelectual nem ampliá-la explicitamente para comportamento sábio.
- source_word: דֹּרֵשׁ
  choice: que busque
  rationale: Traduz o particípio como disposição contínua de procurar ou voltar-se para Deus.
- source_word: אֶת אֱלֹהִים
  choice: a Deus
  rationale: O marcador de objeto direto não recebe tradução própria; em português, a regência natural de “buscar”, neste contexto, permite “buscar a Deus”.
theological_decisions:
- issue: Alcance de אָדָם na expressão בְּנֵי אָדָם
  choice: os filhos dos homens
  alternative: a humanidade
  rationale: A tradução principal conserva a expressão coletiva e concreta do hebraico, sem limitar sua referência aos indivíduos do sexo masculino. A alternativa mais transparente é registrada em nota para evitar ambiguidade moderna.
- issue: Nuance de מַשְׂכִּיל
  choice: que entenda
  alternative: que aja com sabedoria
  rationale: O particípio pode envolver discernimento com implicações práticas. “Que entenda” preserva a formulação mais aberta e evita resolver silenciosamente a tensão entre compreensão e conduta sábia.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética. A repetição de “alguém que” torna claro que os dois particípios descrevem a pessoa procurada. O marcador [a] foi colocado junto à expressão que a nota explica.
