  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: pt
  text: Ali ficaram tomados de grande pavor[a], sem que houvesse motivo para temer, pois Deus espalhou os ossos de quem acampava contra você[b]. Tu os envergonhaste[c], pois Deus os rejeitou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “temeram um temor”. O hebraico combina verbo e substantivo da mesma raiz para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem acampava ao seu redor” ou “seu sitiante”. Neste contexto, o particípio hebraico traduzido por “acampava” tem sentido hostil.
    reason: lexical_alternative
  - marker: c
    text: O versículo passa de falar sobre Deus (“Deus espalhou”) a dirigir-se diretamente a ele (“Tu os envergonhaste”), mudança poética preservada na tradução.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: O advérbio locativo abre a cena de modo abrupto; “Ali” é claro, natural e preserva a força poética.
- source_word: פָּחֲדוּ פַחַד
  choice: ficaram tomados de grande pavor
  rationale: A construção cognata verbo-substantivo intensifica o medo. A formulação portuguesa comunica essa ênfase sem reproduzir literalmente a expressão pouco natural “temeram um temor”.
- source_word: לֹא הָיָה פַחַד
  choice: sem que houvesse motivo para temer
  rationale: A oração indica a inexistência de causa real para o medo. Esta formulação é idiomática e mantém o contraste paradoxal com o grande pavor.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a explicação do que precede; “pois” preserva essa relação em registro digno e corrente.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa com referência singular o Deus de Israel.
- source_word: פִּזַּר
  choice: espalhou
  rationale: O piel expressa dispersão enérgica; “espalhou” preserva com clareza a imagem dos ossos dos inimigos derrotados.
- source_word: עַצְמוֹת
  choice: os ossos
  rationale: O artigo definido em português torna natural a relação com a expressão participial que identifica de quem são os ossos.
- source_word: חֹנָךְ
  choice: quem acampava contra você
  rationale: O particípio de חנה significa “acampar”. O contexto de derrota e ossos espalhados favorece o sentido hostil, enquanto a formulação evita especificar além do texto se se trata estritamente de cerco.
- source_word: הֱבִשֹׁתָה
  choice: Tu os envergonhaste
  rationale: O hiphil de בוש significa causar vergonha ou levar à desonra. A forma é entendida como segunda pessoa masculina singular no perfeito, e “Tu” torna visível a mudança repentina para o discurso direto.
- source_word: מְאָסָם
  choice: os rejeitou
  rationale: מאס frequentemente significa rejeitar ou repudiar. “Rejeitou” comunica o sentido judicial e relacional sem acrescentar uma carga emotiva indevida.
theological_decisions:
- issue: Mudança de pessoa e de destinatário no versículo
  choice: 'Preservar a mudança do discurso sobre Deus na terceira pessoa para a interpelação direta a Deus: “Tu os envergonhaste”.'
  alternative: Uniformizar tudo na terceira pessoa (“Deus os envergonhou”) ou entender a segunda pessoa como referência a Sião/Jerusalém.
  rationale: A poesia hebraica permite a mudança abrupta. Preservá-la evita harmonizar o texto indevidamente. A oração seguinte, “pois Deus os rejeitou”, torna coerente entender a interpelação intermediária como dirigida a Deus, embora a transição permaneça poeticamente tensa.
- issue: Sentido hostil de חֹנָךְ
  choice: “quem acampava contra você”
  alternative: “quem acampava ao seu redor” ou “seu sitiante”
  rationale: O contexto de ossos espalhados, vergonha e rejeição indica um acampamento inimigo. A tradução explicita a relação hostil, mas não restringe a imagem necessariamente a um cerco formal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom poético digno, evita arcaísmos fora do pronome enfático “Tu”, empregado deliberadamente para tornar perceptível a mudança de pessoa no hebraico, e conserva a tensão entre pavor intenso e ausência de causa real para temer.
