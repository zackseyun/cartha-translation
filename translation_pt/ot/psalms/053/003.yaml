  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: pt
  text: Todos se desviaram; juntos se corromperam. Não há quem faça o bem, nem sequer um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: Todos
  rationale: Expressa de modo natural e abrangente a totalidade do grupo referido no contexto.
- source_word: סָג
  choice: se desviaram
  rationale: Preserva a ideia de afastamento do caminho certo sem explicitar além do que o verbo hebraico afirma.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Reproduz a ação coletiva marcada pelo advérbio e mantém o paralelismo poético.
- source_word: נֶאֱלָחוּ
  choice: se corromperam
  rationale: Comunica claramente a deterioração moral expressa pelo nifal, em linguagem corrente e digna.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Não há quem faça o bem
  rationale: Construção idiomática em português que conserva a negação existencial e o sentido caracterizador do particípio.
- source_word: גַּם אֶחָד
  choice: nem sequer um
  rationale: Mantém a intensificação enfática da negação de forma concisa e natural.
theological_decisions:
- issue: Alcance da corrupção humana na denúncia do salmo
  choice: 'Conservar a formulação universal do hebraico: “Todos... Não há... nem sequer um”.'
  alternative: Restringir explicitamente a denúncia apenas à classe imediata dos malfeitores.
  rationale: A linguagem do versículo é abrangente. A tradução preserva essa abrangência poética sem acrescentar um sistema doutrinário que o próprio versículo não desenvolve.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom poético, solene e claro. Não se incluiu nota lexical porque “se corromperam” representa adequadamente נֶאֱלָחוּ; a alternativa “se tornaram repugnantes/imundos” seria possível, mas menos natural e poderia sugerir sujeira física.
