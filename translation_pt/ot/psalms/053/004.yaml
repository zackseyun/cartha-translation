  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: pt
  text: Não sabem os que praticam a maldade[a] — os que devoram o meu povo[c] como quem come pão[b]? Não invocam a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os malfeitores”, em vez de “os que praticam a maldade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “os que comem o meu povo; comem pão”. O sentido é que consomem o povo com a mesma facilidade com que comem um alimento comum.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “meu povo” pode ser entendida como fala de Deus ou do salmista; aqui o hebraico não identifica explicitamente o falante.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Será que... não entendem
  rationale: A combinação introduz uma pergunta retórica que espera resposta afirmativa. O presente expressa adequadamente a caracterização geral, e “entendem” comunica aqui percepção ou reconhecimento moral.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a maldade
  rationale: Reproduz o sentido ativo da expressão construta, em português corrente e digno, sem reduzir sua força moral.
- source_word: אֹכְלֵי עַמִּי
  choice: os que devoram o meu povo
  rationale: “Devoram” preserva a metáfora de comer e comunica naturalmente a opressão predatória.
- source_word: אָכְלוּ לֶחֶם
  choice: como quem come pão
  rationale: 'Explicita a comparação implícita na justaposição hebraica: eles consomem o povo com a mesma facilidade e habitualidade com que comem pão.'
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora formalmente plural, a palavra designa aqui o Deus único e rege o sentido singular esperado no contexto.
- source_word: לֹא קָרָאוּ
  choice: Eles não invocam
  rationale: Com Deus como complemento, קרא denota chamar ou clamar por ele. “Invocar” preserva de modo conciso a dimensão religiosa da expressão.
theological_decisions:
- issue: Referente do possessivo em “meu povo”
  choice: Manter “meu povo” sem identificar explicitamente o falante
  alternative: Entender a expressão como fala direta de Deus ou como fala do salmista em solidariedade com os justos
  rationale: O sufixo hebraico é de primeira pessoa do singular, mas a linha não identifica de maneira explícita quem fala. A tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; a pergunta retórica e a metáfora alimentar foram preservadas, com leve explicitação sintática para assegurar compreensão.
