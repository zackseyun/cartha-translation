  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: pt
  text: Que Deus nos seja favorável e nos abençoe; que faça o seu rosto brilhar sobre nós.[a][b] Selá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “conosco”. A expressão costuma ser traduzida como “sobre nós” neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Esta frase ecoa a bênção sacerdotal de Números 6:24–26, especialmente: “O SENHOR faça o seu rosto brilhar sobre você”.'
    reason: cross_reference
  - marker: c
    text: “Selá” provavelmente é uma indicação litúrgica ou musical; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui ela se refere ao único Deus e rege formas verbais no singular.
- source_word: יְחָנֵּנוּ
  choice: seja bondoso conosco
  rationale: O verbo חנן, neste pedido, expressa a concessão graciosa de favor. A formulação comunica isso em português atual sem restringir o sentido a compaixão diante do sofrimento.
- source_word: וִיבָרְכֵנוּ
  choice: e nos abençoe
  rationale: ברך é o verbo hebraico habitual para abençoar; a tradução direta é natural e preserva o tom litúrgico.
- source_word: יָאֵר
  choice: faça ... brilhar
  rationale: A forma causativa de אור significa fazer brilhar ou iluminar. A construção preserva a imagem concreta e a alusão à bênção sacerdotal.
- source_word: פָּנָיו
  choice: o seu rosto
  rationale: A tradução literal mantém a imagem bíblica do rosto divino como expressão de presença e favor, sem substituí-la por uma interpretação.
- source_word: אִתָּנוּ
  choice: sobre nós
  rationale: A preposição significa literalmente 'conosco', mas, na expressão sobre o rosto que brilha, 'sobre nós' comunica naturalmente a direção do favor divino. A leitura literal é preservada em nota.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo é incerto e provavelmente litúrgico ou musical, ele é mantido por transliteração.
theological_decisions:
- issue: Força volitiva da sequência verbal
  choice: 'Traduzir como oração ou desejo: ''Que Deus ...; que faça...'''
  alternative: 'Entender como afirmação indicativa, por exemplo: ''Deus é bondoso conosco e nos abençoa'''
  rationale: No contexto de bênção e oração do salmo, as formas verbais têm naturalmente valor volitivo. A construção com 'que' expressa esse valor em português.
- issue: Alusão à bênção sacerdotal
  choice: Preservar a imagem do rosto que brilha
  alternative: Explicitar o sentido como 'olhe para nós com favor'
  rationale: O verso ecoa Números 6:24–26. Manter a imagem conserva a ligação intertextual e evita reduzir a metáfora a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção paralela com “que” mantém o caráter de súplica; “rosto” e “brilhar” preservam a imagem hebraica e sua ressonância litúrgica.
