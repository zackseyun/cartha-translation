base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/005.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: pt
  text: Que os povos te louvem, ó Deus[a]; que todos os povos te louvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os povos te louvarão, ó Deus; todos os povos te louvarão”. O verbo também pode ter o sentido de “dar graças”, mas, neste refrão poético, “louvar” expressa melhor o sentido de culto.'
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: que ... te louvem
  rationale: O hifil de ידה nos Salmos frequentemente expressa louvor ou gratidão pública dirigida a Deus. Neste refrão de culto, “louvem” comunica com naturalidade o sentido predominante, enquanto a construção com “que” preserva a força volitiva provável.
- source_word: עַמִּים
  choice: os povos
  rationale: O plural designa diversos grupos humanos e preserva o alcance universal do salmo; “os povos” é mais próximo da forma hebraica do que o possível “as nações”.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O termo funciona aqui como vocativo. “Ó Deus” torna explícita a invocação e mantém o registro poético e orante.
- source_word: כֻּלָּם
  choice: todos
  rationale: A palavra abrange a totalidade dos povos mencionados. “Todos os povos” é conciso, natural e enfático em português.
theological_decisions:
- issue: Modo e função discursiva da oração repetida
  choice: 'Traduzir como oração ou desejo: “Que os povos te louvem”'
  alternative: “Os povos te louvarão”
  rationale: A forma hebraica admite leitura indicativa, mas o contexto orante do refrão favorece a força volitiva. A alternativa futura é preservada em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição e o paralelismo do hebraico foram preservados.
