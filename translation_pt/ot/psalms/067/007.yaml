  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: pt
  text: Deus nos abençoará, e todos os confins da terra o temerão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reverenciarão” ou “terão temor reverente dele”. O verbo hebraico pode incluir tanto temor quanto reverência diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: nos abençoará
  rationale: O piel imperfeito com sufixo de primeira pessoa do plural significa “abençoará a nós”. Neste encerramento poético, o valor futuro/resultativo expressa confiança, embora o contexto mais amplo também permita entender “que nos abençoe”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, o referente é singular, como indica o verbo, e “Deus” é a forma natural em português.
- source_word: וְיִירְאוּ
  choice: e ... temerão
  rationale: O verbo ירא, quando dirigido a Deus, abrange temor, reverência e assombro. “Temerão” preserva sua força e amplitude teológica.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome objeto masculino singular retoma Deus; em português, o pronome oblíquo “o” comunica isso de modo natural e conciso.
- source_word: כָּל
  choice: todos
  rationale: Com a expressão seguinte, כָּל tem sentido coletivo. A concordância masculina plural é determinada por “confins”.
- source_word: אַפְסֵי אָרֶץ
  choice: os confins da terra
  rationale: A expressão construta designa as extremidades ou regiões mais distantes do mundo. “Os confins da terra” conserva a imagem poética e é corrente em português.
theological_decisions:
- issue: Sentido de ירא em relação a Deus
  choice: o temerão
  alternative: o reverenciarão; ficarão maravilhados diante dele
  rationale: “Temer” mantém a tensão bíblica entre medo, reverência, assombro e submissão, sem reduzir o termo a mero respeito. A nota registra alternativas legítimas.
- issue: Valor modal de יְבָרְכֵנוּ
  choice: Deus nos abençoará
  alternative: Que Deus nos abençoe; Deus nos abençoa
  rationale: O fechamento do salmo favorece uma declaração confiante de resultado futuro. Ainda assim, a forma verbal hebraica pode assumir nuance volitiva no contexto; a tradução principal segue a leitura mais provável sem transformar a ambiguidade em afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Confins da terra” preserva a linguagem poética tradicional sem soar arcaica. O futuro “abençoará/temerão” acompanha o paralelismo verbal e o tom confiante do encerramento.
