base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: pt
  text: A terra produziu seu fruto[a]; Deus, o nosso Deus, nos abençoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A terra deu sua produção” ou “A terra produziu sua colheita”. O hebraico אֶרֶץ também pode significar “terra” no sentido de país ou território.
    reason: lexical_alternative
  - marker: b
    text: Ou “que Deus, o nosso Deus, nos abençoe” ou “Deus, o nosso Deus, nos abençoará”. Neste contexto, o verbo hebraico pode ser entendido como presente, expressão de desejo ou futuro.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: a terra
  rationale: O contexto universal do salmo favorece “terra”, embora o termo hebraico também possa designar uma terra ou região específica.
- source_word: נָתְנָה
  choice: produziu
  rationale: Embora o verbo signifique literalmente “deu”, com יְבוּלָהּ a formulação “produziu seu fruto” é natural em português e conserva o sentido de resultado agrícola já obtido.
- source_word: יְבוּלָהּ
  choice: seu fruto
  rationale: “Fruto” comunica de modo claro e digno a produção da terra, sem restringir o referente a uma colheita específica; “produto” ou “produção” também seriam possíveis.
- source_word: יְבָרְכֵנוּ
  choice: nos abençoa
  rationale: O imperfeito hebraico admite valor presente, volitivo ou futuro. O presente expressa aqui uma afirmação confiante ligada ao fruto já produzido, sem ocultar as demais leituras, registradas em nota.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Tradução portuguesa consagrada do título divino, empregado aqui com referência singular ao Deus de Israel.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: 'A expressão reproduz diretamente o sufixo de primeira pessoa do plural e preserva a repetição enfática do hebraico: “Deus, o nosso Deus”.'
theological_decisions:
- issue: Valor do imperfeito יְבָרְכֵנוּ
  choice: 'presente indicativo: “nos abençoa”'
  alternative: 'oração: “que Deus, o nosso Deus, nos abençoe”; ou futuro: “Deus, o nosso Deus, nos abençoará”'
  rationale: A forma verbal é contextualmente ambígua. A oração anterior descreve uma dádiva já realizada, o que permite a afirmação presente; a continuação do salmo também permite expectativa futura. A nota conserva essa tensão sem impor uma única análise como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a repetição enfática do hebraico foram preservadas. “Produziu seu fruto” evita o literalismo pouco idiomático de “deu sua produção”, enquanto as notas mantêm as ambiguidades lexical e verbal do texto-fonte.
