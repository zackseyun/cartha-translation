  text: לָ/דַ֣עַת בָּ/אָ֣רֶץ דַּרְכֶּ֑/ךָ בְּ/כָל גּ֝וֹיִ֗ם יְשׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: pt
  text: para que se conheça o teu caminho na terra[a], a tua salvação[b] entre todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país”, caso a referência seja entendida de modo mais local; o paralelo “entre todas as nações” favorece o sentido mais amplo, “na terra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o teu livramento”. O termo hebraico pode indicar tanto um resgate concreto quanto a salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: para que se conheça
  rationale: O infinitivo construto com לְ expressa propósito e dá continuidade à oração do versículo anterior. A construção impessoal é natural em português e preserva esse valor final.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar tanto uma terra ou região quanto a terra em sentido amplo. O paralelismo com “entre todas as nações” favorece aqui o alcance universal.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: Mantém a metáfora hebraica de דֶּרֶךְ e permite abranger tanto o proceder de Deus quanto o caminho que ele estabelece.
- source_word: בְּכָל גּוֹיִם
  choice: entre todas as nações
  rationale: גּוֹיִם designa coletivamente as nações. “Entre” expressa com naturalidade a presença e o conhecimento da ação salvadora de Deus em âmbito internacional.
- source_word: יְשׁוּעָתֶךָ
  choice: a tua salvação
  rationale: יְשׁוּעָה pode significar livramento, resgate ou salvação. “Salvação” conserva a amplitude teológica do termo sem excluir um livramento concreto.
theological_decisions:
- issue: Alcance de אֶרֶץ em um salmo de horizonte universal
  choice: “terra” em sentido universal
  alternative: “terra” em sentido local ou “país”
  rationale: A expressão paralela “entre todas as nações” aponta para um horizonte mundial, embora a possibilidade lexical de uma referência mais local seja registrada em nota.
- issue: Amplitude semântica de יְשׁוּעָה
  choice: “salvação”
  alternative: “livramento”
  rationale: “Salvação” preserva a abrangência da ação salvadora de Deus no contexto, sem restringir o termo a uma formulação doutrinária posterior; a nuance concreta de resgate permanece indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem poética conserva o paralelismo hebraico, deixando implícito na segunda linha o verbo “se conheça”.
