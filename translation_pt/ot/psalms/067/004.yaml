source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: pt
  text: Alegrem-se as nações e cantem de alegria[a], pois julgas os povos com justiça e guias as nações na terra[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gritem de alegria”. O verbo pode indicar canto jubiloso ou gritos de alegria.
    reason: lexical_alternative
  - marker: b
    text: Ou “no país”, se אֶרֶץ for entendido em sentido mais local; aqui, “na terra” reflete o alcance universal do salmo.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Alegrem-se
  rationale: O imperfeito qal de שׂמח tem aqui força volitiva, adequada ao contexto de louvor. “Alegrem-se” expressa de modo natural o convite ou desejo, sem o transformar numa simples previsão.
- source_word: וִירַנְּנוּ
  choice: e cantem de alegria
  rationale: O piel de רנן indica uma manifestação vocal jubilosa, que pode ser canto ou clamor. “Cantem de alegria” é idiomático e mantém a dimensão celebrativa; a alternativa “gritem de alegria” fica registrada em nota.
- source_word: לְאֻמִּים
  choice: as nações
  rationale: O termo pode designar povos ou nações. “Nações” combina com o alcance universal do salmo e é mantido nas duas ocorrências.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da alegria das nações. “Pois” é conciso e apropriado ao registro poético.
- source_word: תִשְׁפֹּט
  choice: julgas
  rationale: O imperfeito qal pode ter valor futuro ou habitual. O presente descreve naturalmente a atuação característica de Deus, sem apagar completamente a abertura aspectual do hebraico.
- source_word: עַמִּים
  choice: os povos
  rationale: “Povos” preserva uma distinção lexical em relação a לְאֻמִּים, traduzido por “nações”, e comunica o sentido coletivo amplo.
- source_word: מִישׁוֹר
  choice: com justiça
  rationale: O substantivo comunica retidão, equidade ou imparcialidade. “Com justiça” é claro em português corrente e mantém a dimensão ética e judicial do contexto.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: Embora אֶרֶץ também possa significar “terra” em sentido local ou “país”, o alcance universal do salmo favorece aqui a referência ao mundo habitado.
- source_word: תַּנְחֵם
  choice: guias
  rationale: O hifil de נחה significa conduzir ou guiar. “Guias” expressa direção e governo sábio sem limitar a imagem a deslocamento físico.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional porque a função exata do termo permanece incerta.
theological_decisions:
- issue: Alcance de אֶרֶץ
  choice: “a terra” em sentido global
  alternative: “a terra/o país” em sentido local
  rationale: A repetição de povos e nações ao longo do salmo favorece o alcance universal, embora a possibilidade lexical local seja preservada em nota.
- issue: Valor aspectual dos imperfeitos
  choice: Exortação ou desejo nos primeiros verbos e presente habitual em “julgas” e “guias”
  alternative: 'Leitura futura: “as nações se alegrarão... julgarás... guiarás”'
  rationale: No contexto litúrgico, os verbos iniciais soam naturalmente como convite ou desejo, e as ações divinas como fundamento permanente do louvor. O hebraico, porém, permite matiz futuro, por isso a tradução evita construir uma distinção doutrinária sobre o aspecto verbal.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética clara. Emprega-se a segunda pessoa do singular (“julgas”, “guias”) para representar diretamente as formas hebraicas dirigidas a Deus. “Selá” conserva a forma tradicional em português.
