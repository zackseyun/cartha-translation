  source_fidelity: A tradução preserva adequadamente a estrutura volitiva inicial, a razão introduzida por כִּי, a distinção entre «nações» e «povos», o sentido judicial de מִישׁוֹר e o valor de condução de תַּנְחֵם. Contudo, «sobre a terra» para בָּאָרֶץ é menos idiomático em português neste contexto; a locução natural é «na terra», que pode igualmente ter alcance universal.
  naturalness: «Alegrem-se as nações e cantem de alegria» e «pois julgas os povos com justiça» são naturais e mantêm um registro poético acessível. «Guias as nações sobre a terra» soa espacialmente marcada, como se as nações estivessem sobre a superfície terrestre em contraste com outro lugar. «Guias as nações na terra» é mais fluente e fiel ao locativo hebraico.
  terminology: «Nações», «povos», «justiça» e «Selá» são escolhas adequadas. A nota b deve tratar «no país» (ou «na terra», em sentido local) como alternativa local; não deve apresentar «na terra» como alternativa, pois essa é a formulação portuguesa recomendada também para o sentido universal.
