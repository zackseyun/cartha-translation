    rationale: A nota atual opõe «na terra» a «sobre a terra» como se a primeira implicasse necessariamente sentido local. Em português, «na terra» também é a forma normal para o sentido global. A alternativa local deve ser explicitada como «no país» ou «na terra», entendida localmente.
