  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: pt
  text: Que os povos te louvem, ó Deus; que todos os povos te louvem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os povos te louvarão”. A forma verbal hebraica pode expressar um desejo ou uma oração e, com menor probabilidade neste contexto, uma ação futura.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: que ... te louvem
  rationale: O hifil de ידה, em contextos de louvor nos salmos, significa normalmente “louvar” ou “dar graças”. Aqui, a forma repetida funciona como desejo ou oração; “que ... te louvem” expressa essa força volitiva com naturalidade em português.
- source_word: עַמִּים
  choice: os povos
  rationale: O plural designa diversos povos ou grupos humanos. “Os povos” conserva o plural concreto do hebraico e evita a nuance predominantemente política que “nações” pode sugerir.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O termo funciona como vocativo. “Ó Deus” torna explícito o chamamento e mantém o registro poético e reverente.
- source_word: כֻּלָּם
  choice: todos os povos
  rationale: O hebraico significa literalmente “todos eles”. A repetição de “povos” torna o referente inequívoco em português e preserva a ênfase totalizante do verso.
theological_decisions:
- issue: Força volitiva da forma verbal repetida no refrão de louvor
  choice: 'Traduzir como desejo ou petição: “Que os povos te louvem”'
  alternative: “Os povos te louvarão”
  rationale: A forma hebraica é morfologicamente imperfeita, mas, neste contexto litúrgico, é mais bem entendida como desejo ou oração. A tradução preserva essa força sem transformar o verso em uma predição categórica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada; “ó Deus” mantém o vocativo poético sem soar arcaico em excesso.
