lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente o responsável pela execução ou direção musical. “Regente” é claro e natural em português, e “ao” representa a preposição ל sem determinar além do necessário a função precisa.
- source_word: בִּנְגִינֹת
  choice: com instrumentos de cordas
  rationale: O substantivo, neste contexto musical, refere-se a instrumentos ou música de cordas. “Com instrumentos de cordas” é idiomático e preserva o sentido instrumental da preposição; “em instrumentos de cordas” continua possível.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação tradicional e reconhecível do gênero, sem apagar sua associação musical.
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz o segundo termo de gênero separadamente, preservando a dupla designação hebraica em vez de fundi-la com “salmo”.
theological_decisions: []
translation_notes:
  register: Título musical conciso, digno e de leitura natural em português contemporâneo. Mantém as duas classificações hebraicas, “Salmo” e “Cântico”, e registra em nota a ambiguidade da preposição diante de “instrumentos de cordas”.
