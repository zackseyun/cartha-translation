  text: Ó Deus, ouve a minha oração; dá ouvidos às palavras da minha boca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo em uma oração direta. Em português, “Ó Deus” marca com naturalidade e dignidade esse chamado.
- source_word: שְׁמַע
  choice: ouve
  rationale: O imperativo qal pede recepção atenta. “Ouve” conserva a formulação tradicional da linguagem de oração e o paralelismo auditivo do verso.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: תְּפִלָּה designa normalmente uma oração; a tradução direta é clara e adequada ao contexto do salmo.
- source_word: הַאֲזִינָה
  choice: dá ouvidos
  rationale: O imperativo hifil de אזן expressa escuta atenta. “Dá ouvidos” preserva a imagem auditiva e forma uma expressão portuguesa corrente e digna.
- source_word: לְאִמְרֵי
  choice: às palavras
  rationale: O plural construto אִמְרֵי significa aqui “palavras”, e a preposição ל é naturalmente incorporada na regência de “dar ouvidos a”.
- source_word: פִי
  choice: da minha boca
  rationale: A tradução mantém a expressão concreta do hebraico, “as palavras da minha boca”, sem convertê-la em uma paráfrase abstrata.
