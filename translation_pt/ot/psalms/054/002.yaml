  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: pt
  text: Deus, salva-me pelo teu nome e, pelo teu poder, faze-me justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “julga-me” ou “defende a minha causa”. O verbo hebraico pode referir-se ao ato de julgar num tribunal, mas aqui provavelmente tem o sentido de conceder justiça ou dar ganho de causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto de oração deixa claro o vocativo. Em português, “Deus” é uma invocação direta natural, sem necessidade de acrescentar a interjeição “ó”.
- source_word: בְּשִׁמְךָ
  choice: pelo teu nome
  rationale: Preserva o valor instrumental da preposição ב e a expressão hebraica compacta; “nome” representa o caráter revelado, a reputação e a identidade de Deus.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: Traduz diretamente o hifil de ישׁע como pedido de resgate ou salvação, mantendo a formulação ampla e corrente da oração dos salmos.
- source_word: וּבִגְבוּרָתְךָ
  choice: e, pelo teu poder
  rationale: גְּבוּרָה designa força ou capacidade poderosa. “Poder” é natural e digno em português e mantém o sentido instrumental paralelo a “pelo teu nome”.
- source_word: תְדִינֵנִי
  choice: faze-me justiça
  rationale: O verbo דִּין possui sentido judicial, mas neste pedido provavelmente solicita uma decisão favorável, isto é, que Deus defenda a causa do suplicante e lhe conceda justiça. A expressão portuguesa comunica isso sem eliminar a dimensão forense.
theological_decisions:
- issue: Sentido do pedido para Deus julgar ou vindicar o suplicante
  choice: faze-me justiça
  alternative: julga-me; defende a minha causa
  rationale: O contexto aponta para um apelo à ação judicial justa de Deus contra adversários, não simplesmente para uma avaliação neutra. A tradução preserva a tensão forense sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo instrumental do hebraico foi preservado em “pelo teu nome” e “pelo teu poder”; a colocação pronominal mantém tom bíblico natural sem arcaísmo excessivo.
