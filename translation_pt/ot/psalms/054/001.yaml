  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: pt
  text: 'quando os zifeus vieram e disseram a Saul: “Não está Davi escondido entre nós?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conosco”. O hebraico diz literalmente “conosco”; “entre nós” explicita o sentido de Davi estar escondido no meio deles ou em sua região.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: quando ... foram
  rationale: A preposição בְּ com o infinitivo construto de בוא introduz uma oração temporal. Em português natural, “quando ... foram” expressa adequadamente a ida dos zifeus para falar com Saul.
- source_word: הַזִּיפִים
  choice: os zifeus
  rationale: Plural gentílico que designa os habitantes de Zife; “zifeus” é a forma portuguesa tradicional e concisa.
- source_word: וַיֹּאמְרוּ לְשָׁאוּל
  choice: falar com Saul
  rationale: A construção narrativa significa literalmente “e disseram a Saul”. Integrada a בְּבוֹא, a formulação “foram falar com Saul” é idiomática e preserva a sequência e o destinatário da fala.
- source_word: הֲלֹא
  choice: Não está ...?
  rationale: A partícula interrogativa espera resposta afirmativa. A pergunta negativa em português preserva sua força retórica sem convertê-la em afirmação.
- source_word: דָוִד
  choice: Davi
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: מִסְתַּתֵּר
  choice: escondido
  rationale: O particípio hitpael de סתר descreve Davi mantendo-se oculto. “Está ... escondido” comunica de modo natural o estado contínuo resultante da ação reflexiva.
- source_word: עִמָּנוּ
  choice: entre nós
  rationale: Embora עִם signifique literalmente “com”, no contexto de alguém oculto na região ou no meio do grupo dos zifeus, “entre nós” exprime naturalmente o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente integrada (“foram falar com”) para evitar uma formulação rígida, sem alterar o conteúdo narrativo. Não se acrescentou nota, pois “entre nós” comunica diretamente o sentido contextual de עִמָּנוּ.
