base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: pt
  text: Ao mestre de música, com instrumentos de cordas. Um maskil[b] de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; o título hebraico pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
  - marker: b
    text: “Maskil” é um termo técnico hebraico usado nos títulos de salmos, provavelmente indicando um tipo de composição ou de execução, embora seu sentido exato seja incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: Em títulos de salmos, designa quem dirige ou supervisiona a execução musical. A formulação é clara e atual sem restringir a função especificamente a um coro.
- source_word: בִּנְגִינֹת
  choice: com instrumentos de cordas
  rationale: O termo indica acompanhamento por instrumentos de cordas; “com” expressa naturalmente o modo de execução.
- source_word: מַשְׂכִּיל
  choice: maskil
  rationale: Trata-se de um termo técnico dos títulos dos salmos cujo sentido exato é incerto. A transliteração evita defini-lo indevidamente como didático, contemplativo ou musicalmente elaborado.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, dedicação, pertença ou associação. “De Davi” preserva melhor essa amplitude em português.
theological_decisions:
- issue: Sentido da atribuição davídica no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica não determina por si só se a relação é de autoria, dedicação ou associação; a tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. Mantém o termo técnico transliterado e posiciona cada marcador imediatamente após a expressão explicada.
