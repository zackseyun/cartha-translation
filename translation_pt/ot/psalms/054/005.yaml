  source_fidelity: 'O texto traduz adequadamente o hebraico massorético: “Eis que” reproduz a partícula enfática הִנֵּה; Deus é apresentado como aquele que ajuda o salmista; e a segunda linha preserva a construção difícil de אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי mediante “o Senhor está entre os que sustentam a minha vida”. A opção não elimina indevidamente o plural do particípio nem transforma a leitura principal em uma afirmação direta e inequívoca de que o Senhor, sozinho, sustenta o salmista.'
