source:
  edition: WLC
  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: pt
  text: Eis que Deus é quem me ajuda; o Senhor está entre os que sustentam a minha vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Senhor sustenta a minha alma” ou “o Senhor é quem sustenta a minha vida”. A construção hebraica traduzida por “está entre os que sustentam a minha vida” é sintaticamente difícil; também pode ser entendida como uma afirmação de que o próprio Senhor sustenta diretamente o salmista. O termo hebraico traduzido por “vida” também pode significar “alma” ou “a própria pessoa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Partícula de apresentação e ênfase; conserva a força poética elevada de chamar a atenção para a afirmação.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Designação comum de Deus, empregada aqui em sentido singular como sujeito da oração.
- source_word: עֹזֵר לִי
  choice: é quem me ajuda
  rationale: O particípio de עזר com לִי apresenta Deus como agente pessoal da ajuda. Esta formulação é natural em português e mantém a ênfase da construção.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Título divino, traduzido de modo corrente e digno sem confundi-lo graficamente com o nome YHWH.
- source_word: בְּסֹמְכֵי
  choice: está entre os que sustentam
  rationale: A preposição בְּ diante do particípio plural construto é sintaticamente difícil. A tradução adota o sentido associativo possível, preservando o plural sem ocultar a dificuldade.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto de preservação diante de inimigos, נֶפֶשׁ designa naturalmente a vida ou a própria pessoa, não necessariamente uma alma imaterial.
theological_decisions:
- issue: Tradução de אֲדֹנָי como título divino
  choice: o Senhor
  alternative: Senhor
  rationale: O termo designa Deus, e o artigo torna a expressão natural em português, preservando o peso do título.
- issue: Sentido de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma
  rationale: O contexto favorece a preservação da vida do salmista. A opção evita impor ao hebraico uma dicotomia antropológica mais estreita.
- issue: Relação sintática entre אֲדֹנָי e בְּסֹמְכֵי נַפְשִׁי
  choice: o Senhor está entre os que sustentam a minha vida
  alternative: o Senhor sustenta a minha vida
  rationale: A leitura principal conserva a preposição e o particípio plural do texto massorético. A alternativa é idiomaticamente mais simples e adotada por algumas traduções, mas resolve a construção difícil ao identificar diretamente o Senhor como sustentador.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis que” mantém o tom poético; “é quem me ajuda” soa mais natural do que “é meu ajudador”. A nota reúne a ambiguidade sintática e a amplitude semântica de נֶפֶשׁ, e seu marcador aparece no texto.
