source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: pt
  text: 'Pois estranhos[a] se levantaram contra mim,

    e homens violentos[b] procuram tirar-me a vida[c];

    não põem Deus diante de si.

    Selá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiros” ou “forasteiros”. O hebraico pode designar pessoas alheias, afastadas ou estrangeiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens cruéis” ou “homens impiedosos”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “procuram a minha alma”; neste contexto, “alma” significa a vida da pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e preserva a força causal com fluidez poética em português.
- source_word: זָרִים
  choice: estranhos
  rationale: O termo pode indicar pessoas alheias, afastadas ou estrangeiras. “Estranhos” preserva essa amplitude sem afirmar necessariamente uma origem étnica estrangeira.
- source_word: קָמוּ עָלַי
  choice: se levantaram contra mim
  rationale: Reproduz a imagem do idiomatismo hebraico e comunica oposição hostil de modo natural.
- source_word: עָרִיצִים
  choice: homens violentos
  rationale: O termo designa pessoas violentas, cruéis ou opressoras. “Homens violentos” expressa claramente a ameaça e mantém o plural masculino do texto.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: procuram tirar-me a vida
  rationale: Neste contexto de ameaça, נֶפֶשׁ se refere à vida da pessoa. A formulação portuguesa torna explícito o propósito homicida sem introduzir uma dicotomia entre corpo e alma.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: não põem Deus diante de si
  rationale: Preserva a metáfora hebraica de colocar Deus diante de si, isto é, tê-lo no horizonte da própria conduta, sem explicá-la excessivamente.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém transliterado o termo litúrgico ou musical, cuja função exata permanece incerta.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ em contexto de ameaça
  choice: vida
  alternative: alma
  rationale: Os adversários ameaçam matar o salmista; “vida” comunica o sentido concreto de נֶפֶשׁ aqui sem impor ao texto uma distinção mais estreita entre corpo e alma.
- issue: Sentido moral de não colocar Deus diante de si
  choice: 'Preservar a metáfora: “não põem Deus diante de si”'
  alternative: “não levam Deus em conta”
  rationale: A tradução conserva a imagem e a tensão do original, deixando ao leitor a inferência de que os agressores agem sem consideração por Deus.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. “Selá” segue a transliteração tradicional em português. A metáfora final foi mantida em vez de substituída por uma explicação interpretativa.
