  text: ישוב הָ֭/רַע לְ/שֹׁרְרָ֑/י בַּ֝/אֲמִתְּ/ךָ֗ הַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: pt
  text: Que o mal recaia sobre os meus adversários[a]; em tua fidelidade[b], destrói-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto ao primeiro verbo: “O mal recairá sobre os meus adversários.” O primeiro verbo também pode ser entendido como indicativo, em vez de volitivo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “em tua verdade”. A palavra hebraica pode significar verdade, confiabilidade ou fidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: Que ... recaia
  rationale: O imperfeito qal de שוב pode ser indicativo ou volitivo. Como o verso é uma oração e termina com um imperativo, a formulação volitiva preserva melhor o pedido, sem ocultar a leitura indicativa alternativa.
- source_word: הָרַע
  choice: o mal
  rationale: רַע pode indicar mal moral, dano ou calamidade. “O mal” conserva a concisão e a amplitude semântica do hebraico.
- source_word: לְשֹׁרְרָי
  choice: sobre os meus adversários
  rationale: Designa os que se opõem hostilmente ao salmista. “Adversários” é atual e não restringe o contexto a inimigos militares.
- source_word: בַּאֲמִתְּךָ
  choice: em tua fidelidade
  rationale: אֱמֶת pode significar verdade, confiabilidade ou fidelidade. No apelo dirigido a Deus, “fidelidade” expressa bem sua confiabilidade, enquanto a nota preserva “verdade” como alternativa.
- source_word: הַצְמִיתֵם
  choice: destrói-os
  rationale: Imperativo hifil de צמת com sufixo de terceira pessoa plural; comunica destruir, exterminar ou eliminar. “Destrói-os” reproduz de modo direto a força do pedido.
theological_decisions:
- issue: Força imprecatória do verso
  choice: Apresentar a primeira oração como pedido de juízo divino.
  alternative: 'Apresentá-la como declaração ou previsão: “O mal recairá sobre os meus adversários; em tua fidelidade, tu os destruirás.”'
  rationale: O contexto de oração e o imperativo final favorecem a leitura volitiva, mas a nota mantém a ambiguidade real do imperfeito hebraico, sem suavizar a tensão imprecatória.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Que ... recaia” expressa naturalmente o valor volitivo; “destrói-os” mantém sem atenuação a força do imperativo hebraico.
