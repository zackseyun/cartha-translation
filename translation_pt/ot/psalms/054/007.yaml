base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: pt
  text: Eu te oferecerei um sacrifício voluntário[a]; darei graças ao teu nome, ó Yahweh[b], pois é bom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega a expressão “com uma oferta voluntária”. Ela também pode ser entendida de modo mais adverbial: “sacrificarei livremente” ou “de livre vontade”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”; também transliterado “Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico diz literalmente: “pois é bom”, sem indicar expressamente o sujeito. Pode referir-se ao nome de Yahweh ou ao próprio Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: com uma oferta voluntária
  rationale: O substantivo נְדָבָה designa uma oferta apresentada espontaneamente; junto de אֶזְבְּחָה, a tradução preserva o sentido sacrificial, sem eliminar a possível nuance adverbial.
- source_word: אֶזְבְּחָה
  choice: sacrificarei
  rationale: A forma de זבח significa oferecer em sacrifício; o futuro em português expressa naturalmente a determinação do salmista.
- source_word: לָּךְ
  choice: a ti
  rationale: A preposição ל marca o destinatário do sacrifício.
- source_word: אוֹדֶה
  choice: darei graças
  rationale: No hifil, ידה pode expressar agradecimento ou louvor; aqui, “dar graças” combina naturalmente com “ao teu nome”.
- source_word: שִׁמְךָ
  choice: teu nome
  rationale: Preserva a referência explícita ao nome de Deus, que representa sua identidade revelada e reputação.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כִּי טוֹב
  choice: pois ele é bom
  rationale: O hebraico não explicita o sujeito de טוֹב. Em português, “ele” retoma naturalmente “teu nome”, substantivo masculino, preservando a leitura contextual principal sem ocultar a alternativa referente ao próprio Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” conserva essa função, enquanto “SENHOR” é a substituição tradicional por um título.
- issue: Referente implícito em כִּי טוֹב
  choice: “ele é bom”, entendendo “ele” como “teu nome”
  alternative: “ele é bom”, entendendo “ele” como Yahweh
  rationale: O hebraico não apresenta sujeito explícito. “Teu nome” é o antecedente imediato, mas a sintaxe também permite compreender a afirmação como referência direta a Yahweh; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com colocação pronominal e vocabulário adequados à linguagem poética de oração. A ordem inicial acompanha a ênfase hebraica em בִּנְדָבָה, e as notas preservam tanto a nuance cultual quanto as ambiguidades sintáticas reais.
