source:
  edition: WLC
  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: pt
  text: Pois ele me livrou de toda angústia, e meus olhos viram os meus inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão pode dar a entender que o salmista viu a queda dos inimigos ou sua própria vindicação diante deles, mas o hebraico diz apenas que seus olhos os viram.
    reason: ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior de louvor e mantém com naturalidade a força explicativa da conjunção.
- source_word: מִכָּל צָרָה
  choice: de toda angústia
  rationale: A construção expressa livramento da totalidade das situações de aflição; “toda angústia” é natural e preserva o sentido amplo de צָרָה.
- source_word: הִצִּילָנִי
  choice: ele me livrou
  rationale: O hifil de נצל indica livrar ou resgatar. O pretérito perfeito comunica em português uma ação concluída sem acrescentar nuances ausentes no hebraico.
- source_word: וּבְאֹיְבַי
  choice: e ... os meus inimigos
  rationale: Com ראה, a preposição ב introduz aquilo que é visto. O objeto direto sem preposição é a forma mais natural em português, sem explicitar derrota ou triunfo.
- source_word: רָאֲתָה עֵינִי
  choice: meus olhos viram
  rationale: A expressão hebraica tem literalmente “meu olho” como sujeito. O plural idiomático em português preserva a imagem corporal e soa natural, ao contrário do singular excessivamente literal.
theological_decisions:
- issue: O que o salmista viu com respeito aos inimigos
  choice: Afirmar apenas que seus olhos viram os inimigos.
  alternative: “meus olhos viram a queda dos meus inimigos” ou “contemplei triunfante os meus inimigos”
  rationale: O contexto pode sugerir a derrota dos inimigos ou a vindicação do salmista, mas o hebraico não declara nenhuma dessas ideias de modo explícito. A tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Pois” mantém a ligação argumentativa; “meus olhos viram” conserva a imagem hebraica sem produzir um singular pouco idiomático.
