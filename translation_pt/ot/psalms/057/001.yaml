id: PSA.57.1
reference: Psalms 57:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: pt
  text: 'Sê bondoso comigo, ó Deus, sê bondoso comigo,

    pois em ti a minha alma[a] se refugia;

    e à sombra das tuas asas me refugiarei,

    até que passem as calamidades.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a minha vida se refugia em ti»; também pode ser entendido simplesmente como «eu me refugio em ti». O hebraico נַפְשִׁי pode significar «minha alma», «minha vida» ou «eu mesmo».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «destruições»; o plural hebraico provavelmente se refere coletivamente a perigos devastadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sê bondoso comigo
  rationale: O imperativo de חנן com sufixo de primeira pessoa pede que Deus demonstre favor ou graça. A formulação preserva a força verbal sem recorrer ao termo teologicamente mais carregado «graça» nem confundir plenamente o verbo com «ter compaixão».
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente corrente do título divino usado aqui em vocativo.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa a razão do pedido e se ajusta ao registro poético.
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: em ti a minha alma se refugia
  rationale: A preposição ב indica aquele em quem se busca abrigo. «Minha alma» conserva a expressão hebraica, enquanto «se refugia» comunica a confiança já assumida e presente.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: e à sombra das tuas asas
  rationale: Mantém sem explicitação indevida a imagem poética de proteção sob as asas divinas.
- source_word: אֶחְסֶה
  choice: me refugiarei
  rationale: O imperfeito de primeira pessoa aponta naturalmente para uma ação futura ou contínua e mantém a progressão em relação à confiança expressa na linha anterior.
- source_word: עַד יַעֲבֹר
  choice: até que passem
  rationale: Expressa a duração do refúgio até que os perigos tenham seguido adiante; o plural verbal concorda naturalmente com «calamidades».
- source_word: הַוּוֹת
  choice: as calamidades
  rationale: O substantivo plural designa acontecimentos destrutivos ou perigos que causam ruína. «Calamidades» preserva o plural e soa natural em português.
theological_decisions:
- issue: Amplitude antropológica de נַפְשִׁי
  choice: a minha alma
  alternative: a minha vida; eu mesmo
  rationale: נפש pode designar a pessoa inteira ou sua vida, não necessariamente uma alma imaterial em sentido filosófico posterior. A tradução mantém a imagem poética tradicional, e a nota registra a amplitude sem impor uma antropologia específica.
- issue: Imagem protetora da sombra das asas
  choice: preservar literalmente a metáfora poética
  alternative: explicitar como «sob a tua proteção»
  rationale: A imagem comunica proteção divina sem exigir que a linguagem seja entendida como descrição corporal literal; explicá-la no texto reduziria sua força e sua abertura poética.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética. O paralelismo entre «se refugia» e «me refugiarei» foi mantido, assim como a metáfora das asas. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
