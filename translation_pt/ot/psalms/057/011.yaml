  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: pt
  text: Sê exaltado acima dos céus, ó Deus; esteja a tua glória sobre toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tua glória está sobre toda a terra”. A segunda linha hebraica não tem verbo explícito; ele precisa ser entendido pelo contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Sê exaltado
  rationale: A forma de רום dirige a Deus uma súplica de sentido imperativo ou jussivo. “Sê exaltado” comunica tanto a elevação quanto a supremacia divina e se ajusta ao tom de oração do refrão.
- source_word: עַל
  choice: acima de / sobre
  rationale: Com “céus”, “acima de” expressa naturalmente elevação e supremacia; com “toda a terra”, “sobre” evita rigidez e preserva a abrangência da imagem hebraica.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural português tradicional e ainda corrente preserva o caráter poético e corresponde ao substantivo hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A partícula “ó” marca com clareza a função vocativa da expressão em uma oração poética.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O paralelo cósmico com “os céus” favorece “terra”, e não “país” ou “território”; “toda a terra” é natural e abrangente.
- source_word: כְּבוֹדֶךָ
  choice: a tua glória
  rationale: “Glória” é a equivalência mais transparente para כבוד quando descreve a majestade manifesta de Deus.
theological_decisions:
- issue: A segunda linha hebraica não contém verbo explícito.
  choice: esteja a tua glória sobre toda a terra
  alternative: a tua glória está sobre toda a terra
  rationale: O jussivo “esteja” mantém o paralelismo com a súplica da primeira linha, sem ocultar que o hebraico também permite entender a segunda como declaração. A alternativa é registrada em nota para preservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A colocação “Sê exaltado” conserva o tom litúrgico sem recorrer a linguagem excessivamente arcaica; o paralelismo e a ambiguidade verbal do hebraico são preservados por meio da nota.
