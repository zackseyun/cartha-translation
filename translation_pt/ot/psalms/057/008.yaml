base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: pt
  text: Desperte[a], minha glória! Despertem, harpa e lira[b]! Eu despertarei a alvorada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha alma” ou “todo o meu ser”; “minha glória” é uma referência poética ao próprio salmista.
    reason: lexical_alternative
  - marker: b
    text: O hebraico menciona dois antigos instrumentos de cordas; seus equivalentes modernos exatos são incertos.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Desperte! / Despertem!
  rationale: O imperativo de עור é uma convocação direta para despertar. A flexão singular diante de “minha glória” e a plural diante dos dois instrumentos tornam a concordância natural em português, preservando o tom poético.
- source_word: כְבוֹדִי
  choice: minha glória
  rationale: A expressão significa literalmente “minha glória” e pode funcionar poeticamente como referência ao próprio ser interior. Mantém-se a metáfora no texto, com alternativas explicadas em nota.
- source_word: הַנֵּבֶל
  choice: harpa
  rationale: Designa um antigo instrumento de cordas cuja identificação exata é incerta. “Harpa” é um equivalente tradicional, claro e distinto de “lira”.
- source_word: כִנּוֹר
  choice: lira
  rationale: Designa um antigo instrumento de cordas, comumente representado por “lira”; a escolha ajuda a distingui-lo de נבל.
- source_word: אָעִירָה
  choice: Eu despertarei
  rationale: A forma causativa de עור comunica que o salmista fará a alvorada despertar, preservando a personificação poética e a força volitiva da declaração.
- source_word: שָּׁחַר
  choice: a alvorada
  rationale: Refere-se ao romper do dia. “Alvorada” conserva a imagem poética e combina naturalmente com o verbo “despertar”.
