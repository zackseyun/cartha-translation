base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: pt
  text: 'Ao regente: “Não destrua”. De Davi. Mictam[a], quando fugiu de Saul, na caverna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mictam” é um termo hebraico de significado incerto; por isso, foi transliterado em vez de traduzido.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: O termo dos cabeçalhos dos salmos designa provavelmente o responsável pela execução musical. “Ao regente” é conciso, natural e não especifica além do hebraico se se trata de coro ou de outro conjunto.
- source_word: אַל־תַּשְׁחֵת
  choice: “Não destruas”
  rationale: A expressão funciona provavelmente como título, refrão ou indicação de melodia; as aspas sinalizam esse uso sem decidir qual dessas funções é a correta.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva melhor a amplitude da preposição ל, que no cabeçalho pode expressar autoria, associação ou pertença, sem afirmar categoricamente “por Davi”.
- source_word: מִכְתָּם
  choice: Mictam
  rationale: Como o significado do termo técnico é incerto, a transliteração evita impor traduções conjecturais como “inscrição” ou “salmo de ouro”.
- source_word: בְּבָרְחוֹ
  choice: quando fugiu
  rationale: O infinitivo construto com ב tem sentido temporal neste contexto; a formulação é natural em português.
- source_word: מִפְּנֵי שָׁאוּל
  choice: de Saul
  rationale: No contexto de fuga, a expressão idiomática hebraica significa afastar-se de Saul; a tradução simples comunica isso sem reproduzir literalmente “da presença de”.
- source_word: בַּמְּעָרָה
  choice: na caverna
  rationale: A preposição indica mais naturalmente localização. O artigo definido do hebraico é mantido.
theological_decisions:
- issue: Natureza do versículo
  choice: Apresentar todo o texto como cabeçalho do salmo.
  alternative: Tratar “Não destruas” ou outros elementos como parte do corpo poético.
  rationale: 'A sequência reúne elementos convencionais de um cabeçalho: direção musical, provável título ou melodia, associação davídica, termo de gênero e contexto histórico.'
- issue: Sentido de מִכְתָּם
  choice: Manter o termo transliterado como “Mictam”.
  alternative: Traduzir como “inscrição”, “salmo de ouro” ou outra interpretação conjectural.
  rationale: O significado é disputado; a transliteração preserva a incerteza real do texto e evita introduzir uma interpretação teológica ou literária sem base suficiente.
- issue: Relação expressa por לְדָוִד
  choice: Usar “De Davi”.
  alternative: Usar “Por Davi” ou “Para Davi”.
  rationale: “De Davi” mantém aberta a possibilidade de autoria, associação ou pertença editorial, em vez de resolver a ambiguidade da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O cabeçalho conserva sua forma compacta. “Não destruas” mantém o singular do hebraico e recebe aspas por ser provavelmente um título, refrão ou nome de melodia. A vírgula antes de “na caverna” destaca a nota locativa final.
