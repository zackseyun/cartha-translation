  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: pt
  text: Ele enviará do céu e me salvará; ele insulta quem me persegue avidamente.[a][b] Selá. Deus enviará seu amor leal e sua fidelidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem me persegue avidamente me insulta”, tomando o inimigo, e não Deus, como sujeito de “insulta”. Outra possibilidade é: “ele me salvará da afronta de quem me persegue avidamente”.'
    reason: alternative_reading
  - marker: b
    text: A expressão “quem me persegue avidamente” traduz a imagem de alguém que busca o salmista com avidez; também pode ser traduzida de modo mais literal como “quem arqueja atrás de mim” ou, mais interpretativamente, como “meu perseguidor” ou “quem procura me devorar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Ele enviará
  rationale: O imperfeito qal expressa aqui confiança poética numa intervenção futura. Mantém-se sem objeto explícito, como no hebraico.
- source_word: מִשָּׁמַיִם
  choice: do céu
  rationale: Forma portuguesa natural para indicar a origem da intervenção divina, sem exigir o plural literal.
- source_word: וְיוֹשִׁיעֵנִי
  choice: e me salvará
  rationale: Reproduz de modo amplo e direto o hifil de ישׁע, adequado ao contexto de perigo.
- source_word: חֵרֵף
  choice: afronta
  rationale: Conserva o sentido verbal direto de censurar, insultar ou afrontar, sem transformá-lo interpretativamente em resultado como “envergonhará”.
- source_word: שֹׁאֲפִי
  choice: quem vem ávido atrás de mim
  rationale: Preserva a imagem de alguém que arqueja avidamente atrás do salmista e, ao mesmo tempo, comunica perseguição hostil em português corrente.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional, pois a função exata do termo é incerta.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente padrão do título divino, usado aqui em sentido singular.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Expressa tanto o amor quanto a constância e lealdade abrangidos por חסד, sem restringir o termo a uma formulação denominacional.
- source_word: וַאֲמִתּוֹ
  choice: e sua fidelidade
  rationale: No par com חסד, אמת salienta a confiabilidade e fidelidade de Deus.
theological_decisions:
- issue: Sujeito e sentido de חֵרֵף שֹׁאֲפִי
  choice: Deus é entendido como sujeito de “afronta”, e o perseguidor como objeto.
  alternative: 'O perseguidor pode ser o sujeito: “quem vem ávido atrás de mim me afronta”; também é possível entender a frase como referência à afronta do perseguidor da qual Deus salva o salmista.'
  rationale: A sintaxe poética hebraica é condensada e permite mais de uma análise. O texto principal mantém Deus como sujeito em continuidade com os verbos anteriores, enquanto a nota preserva a leitura alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das frases acompanha o movimento poético hebraico; a elipse depois de “enviará” e a ambiguidade da oração central foram preservadas, com esclarecimento em notas.
