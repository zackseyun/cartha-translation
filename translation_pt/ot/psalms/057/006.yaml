lexical_decisions:
- source_word: רֶשֶׁת
  choice: rede
  rationale: Designa uma rede usada para capturar; “rede” mantém concreta a imagem da armadilha.
- source_word: הֵכִינוּ
  choice: prepararam
  rationale: O hifil de כון indica preparar ou deixar pronto e expressa a ação deliberada dos inimigos sem ampliar o sentido.
- source_word: לִפְעָמַי
  choice: para os meus passos
  rationale: פעם pode designar pé ou passo; “para os meus passos” preserva o plural e a imagem de uma rede posta no percurso do salmista.
- source_word: כָּפַף נַפְשִׁי
  choice: minha alma se curvou
  rationale: A formulação conserva a imagem hebraica de נֶפֶשׁ e o sentido de curvar-se ou ficar abatido, sem reduzir a expressão simplesmente a “eu”.
- source_word: כָּרוּ
  choice: cavaram
  rationale: Equivalente direto e natural para a ação de abrir uma cova.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Expressa naturalmente a localização à frente do salmista e mantém o registro poético.
- source_word: שִׁיחָה
  choice: cova
  rationale: O substantivo denota uma cova ou fosso, frequentemente associado a uma armadilha; “cova” é claro e conciso em português.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: eles mesmos caíram no meio dela
  rationale: “Caíram no meio dela” reproduz a reversão irônica do hebraico; “eles mesmos” torna explícita em português a referência contrastiva já clara pelo contexto, sem alterar os participantes.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo litúrgico ou musical é incerto, ele é transliterado em vez de receber uma tradução conjectural.
