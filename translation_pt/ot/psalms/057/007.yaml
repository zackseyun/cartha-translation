lexical_decisions:
- source_word: נָכוֹן
  choice: firme
  rationale: O termo expressa aquilo que está estabelecido, seguro ou preparado. No contexto, “firme” comunica de modo natural a estabilidade interior e a determinação do salmista, sem excluir totalmente a nuance de prontidão.
- source_word: לִבִּי
  choice: meu coração
  rationale: Preserva a imagem hebraica do coração como centro da vontade, dos afetos e da disposição interior.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A expressão funciona como vocativo em uma oração direta; “ó Deus” reproduz essa forma de tratamento com clareza e dignidade.
- source_word: אָשִׁירָה
  choice: cantarei
  rationale: A forma coortativa expressa decisão e propósito. O futuro “cantarei” transmite essa resolução de maneira natural em português.
- source_word: וַאֲזַמֵּרָה
  choice: e entoarei louvores
  rationale: O verbo no piel pode indicar cantar louvores ou fazer música. “Entoarei louvores” mantém a progressão poética após “cantarei” e explicita a orientação laudatória adequada ao contexto, enquanto a nota preserva a alternativa mais estritamente musical.
