translation_notes:
  register: Português atual, claro e reverente, com ampla legibilidade brasileira. A repetição de “meu coração está firme” foi mantida por sua força poética e retórica. Os dois coortativos foram vertidos como resoluções no futuro, e a conjunção hebraica foi preservada sem acrescentar uma partícula enfática ausente do texto.
