  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: pt
  text: 'Sê exaltado acima dos céus, ó Deus;

    esteja a tua glória sobre toda a terra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tua glória está sobre toda a terra”. A segunda linha não tem verbo no hebraico e pode ser entendida como um pedido ou como uma declaração.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Sê exaltado
  rationale: A forma imperativa de רום expressa um apelo doxológico para que Deus seja reconhecido como elevado. “Sê exaltado” preserva o sentido resultativo e o registro de oração, sem sugerir apenas movimento físico.
- source_word: עַל הַשָּׁמַיִם
  choice: acima dos céus
  rationale: Neste contexto poético, עַל indica elevação, e o plural הַשָּׁמַיִם é naturalmente vertido por “os céus”. A expressão comunica a supremacia divina.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo. A partícula “ó” torna explícita a invocação em português e mantém o tom poético e solene.
- source_word: עַל כָּל הָאָרֶץ
  choice: sobre toda a terra
  rationale: A expressão comunica alcance universal e, possivelmente, supremacia. “Sobre toda a terra” preserva a construção espacial e o paralelismo com o primeiro verso.
- source_word: כְּבוֹדֶךָ
  choice: a tua glória
  rationale: כבוד, aplicado a Deus, denota sua majestade manifesta e seu esplendor. “Glória” é a equivalência mais direta, reconhecível e teologicamente transparente.
theological_decisions:
- issue: Se a segunda linha sem verbo deve ser entendida como pedido ou declaração
  choice: esteja a tua glória sobre toda a terra
  alternative: a tua glória está sobre toda a terra
  rationale: Em paralelo com o imperativo da primeira linha, a frase nominal pode funcionar naturalmente como continuação do pedido. Ainda assim, como o hebraico não traz verbo, a leitura declarativa permanece genuinamente possível e é preservada em nota.
translation_notes:
  register: Português atual, claro e digno, com forma vocativa e paralelismo poético. O uso de “Sê” e “tua” preserva a segunda pessoa singular do hebraico e é amplamente compreensível, inclusive para leitores brasileiros.
