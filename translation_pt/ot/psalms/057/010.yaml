  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: pt
  text: Pois o teu amor leal é grande até os céus,[a] e a tua fidelidade, até as nuvens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o teu amor leal é grande até os céus, e a tua verdade, até as nuvens”.'
    reason: Preserva o sentido lexical alternativo de אֱמֶת como “verdade”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exaltação e do louvor no contexto anterior, preservando o valor causal com fluidez poética.
- source_word: גָדֹל
  choice: é grande
  rationale: Expressa de modo natural a magnitude do atributo divino.
- source_word: עַד
  choice: até
  rationale: Marca extensão ou alcance; mantém a imagem vertical do hebraico sem explicá-la em excesso.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Conserva o registro poético elevado e o paralelismo com as nuvens.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: Reúne as ideias de amor, constância e lealdade relacional próprias de חֶסֶד, em linguagem portuguesa atual.
- source_word: וְעַד
  choice: e ... até
  rationale: Preserva a conjunção e a repetição conceitual da preposição no paralelismo, embora o segundo verbo seja elíptico em português.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: Oferece a imagem concreta mais provável neste paralelismo poético com os céus.
- source_word: אֲמִתֶּךָ
  choice: a tua fidelidade
  rationale: No paralelismo com חֶסֶד e como atributo de Deus, אֱמֶת destaca confiabilidade e constância, embora também possa significar verdade.
theological_decisions:
- issue: Tradução dos atributos divinos חֶסֶד e אֱמֶת
  choice: amor leal e fidelidade
  alternative: misericórdia e verdade
  rationale: A escolha comunica a constância relacional dos atributos sem inserir terminologia denominacional. A nota preserva a alternativa lexical genuína para אֱמֶת.
- issue: Sentido espacial de עַד
  choice: até os céus / até as nuvens
  alternative: tão grande quanto os céus / alcança os céus
  rationale: A tradução mantém a imagem e a ambiguidade poética de extensão do hebraico, sem transformar a metáfora em comparação ou ação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula na segunda oração marca a elipse de “é grande” e conserva o paralelismo poético.
