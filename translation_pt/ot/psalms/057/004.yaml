id: PSA.57.4
reference: Psalms 57:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: pt
  text: Minha alma está no meio de leões; deito-me entre os que ardem[a] — filhos dos homens[b], cujos dentes são lanças e flechas, e cuja língua é uma espada afiada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “os que estão em chamas” ou “os flamejantes”, descrevendo a hostilidade feroz dos inimigos.
    reason: lexical_alternative
  - marker: b
    text: Ou “seres humanos” ou “homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Minha alma
  rationale: Preserva a imagem poética de נֶפֶשׁ, que aqui pode abranger a pessoa interior, a própria vida ou o eu ameaçado, sem reduzi-la simplesmente a “eu”.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Comunica de modo natural a ideia de estar cercado pelo perigo.
- source_word: לְבָאִם
  choice: leões
  rationale: Mantém a imagem hebraica sem decidir se os leões são literais ou uma metáfora dos inimigos humanos.
- source_word: אֶשְׁכְּבָה
  choice: deito-me
  rationale: Reproduz o verbo concreto שׁכב na primeira pessoa e conserva a postura vívida do salmista.
- source_word: לֹהֲטִים
  choice: os que ardem
  rationale: Preserva a metáfora participial de ardor ou chama e a sintaxe condensada, sem explicá-la apenas como ira ou violência.
- source_word: בְּנֵי אָדָם
  choice: filhos dos homens
  rationale: Mantém a forma masculina e a expressão poética hebraica, entendida no contexto como referência a seres humanos; a nota registra uma alternativa mais idiomática.
- source_word: שִׁנֵּיהֶם
  choice: cujos dentes
  rationale: A oração relativa liga naturalmente a imagem aos adversários mencionados.
- source_word: חֲנִית וְחִצִּים
  choice: são lanças e flechas
  rationale: O plural em português expressa naturalmente a imagem coletiva do singular hebraico חֲנִית em paralelo com “flechas”.
- source_word: וּלְשׁוֹנָם
  choice: e cuja língua
  rationale: Mantém o singular coletivo da imagem e cria uma ligação fluente com a oração anterior.
- source_word: חֶרֶב חַדָּה
  choice: é uma espada afiada
  rationale: Tradução direta e idiomática da metáfora hebraica para a fala destrutiva.
theological_decisions:
- issue: Se as imagens de animais e armas devem ser interpretadas literal ou metaforicamente
  choice: Preservar as imagens como descrição poética dos inimigos humanos, sem resolver sua relação precisa.
  alternative: Entender os leões literalmente e distingui-los dos homens hostis, ou interpretar toda a linguagem como metáfora de adversários humanos.
  rationale: O verso passa de “leões” a “filhos dos homens”, criando uma sobreposição poética deliberada que a tradução não deve eliminar.
- issue: Como traduzir בְּנֵי אָדָם de maneira fiel ao gênero gramatical e ao alcance humano da expressão
  choice: filhos dos homens
  alternative: seres humanos; homens; filhos de Adão
  rationale: A expressão hebraica é masculina e poeticamente marcada; o texto principal conserva essa forma, enquanto a nota esclarece seu sentido geral.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla compreensão internacional. A ordem e as metáforas do hebraico foram preservadas sempre que isso não prejudicou a clareza.
