base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: pt
  text: 'Eu te darei graças entre os povos[a], Senhor;

    cantarei louvores a ti entre as nações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu te louvarei entre os povos”. O verbo hebraico pode indicar tanto gratidão como louvor; “darei graças” preserva a distinção em relação a “cantarei louvores” na linha seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Eu te darei graças
  rationale: O hifil de ידה pode significar agradecer ou louvar. “Darei graças” preserva essa nuance e evita repetir a ideia expressa por זמר no segundo verso.
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: O plural de עַם designa aqui grupos humanos ou étnicos; “entre os povos” conserva o sentido coletivo plural e o paralelismo.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Trata-se do título divino אֲדֹנָי, não do Tetragrama. “Senhor” é natural em português e mantém essa distinção.
- source_word: אֲזַמֶּרְךָ
  choice: cantarei louvores a ti
  rationale: O piel de זמר, no contexto dos salmos, indica cantar em louvor, frequentemente com conotação musical. A formulação explicita o sentido cultual sem perder naturalidade.
- source_word: בַּל
  choice: entre
  rationale: Neste contexto poético, funciona como preposição paralela ao ב da primeira linha e introduz o âmbito em que o louvor será cantado.
- source_word: אֻמִּים
  choice: as nações
  rationale: “Nações” diferencia אֻמִּים de עַמִּים na linha anterior, ao mesmo tempo que conserva o paralelismo sinônimo.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: Ó Senhor
  rationale: O hebraico traz o título divino, e não יהוה. “Senhor” preserva essa diferença; a força vocativa já é clara pela posição e pela pontuação, sem necessidade de acrescentar “Ó”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem natural dos pronomes e preservação do paralelismo poético. “Darei graças” é preferido a “renderei graças” por ser mais direto para leitores comuns, sem perder solenidade.
