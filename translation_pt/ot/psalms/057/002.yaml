  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: pt
  text: 'Clamo ao Deus Altíssimo,

    ao Deus que leva a termo o que me diz respeito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que cumpre seu propósito para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Clamo
  rationale: O imperfeito qal na primeira pessoa pode ter valor presente ou futuro no discurso poético. “Clamo” preserva a vivacidade e o sentido de invocar, sem acrescentar a intensidade explícita de “grito”.
- source_word: לֵאלֹהִים
  choice: ao Deus
  rationale: Embora אֱלֹהִים tenha forma plural, o contexto e o paralelismo com אֵל mostram que designa o Deus de Israel no singular.
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: Título divino tradicional e claro em português, correspondente a “o mais elevado”.
- source_word: לָאֵל
  choice: ao Deus
  rationale: אֵל é aqui uma designação comum de Deus. Repetir “Deus” conserva o paralelismo sinonímico sem introduzir “El” como nome próprio pouco transparente.
- source_word: גֹמֵר
  choice: que leva a termo
  rationale: O particípio de גמר significa completar, concluir ou levar ao fim. “Leva a termo” expressa a ação contínua de Deus e evita inserir no texto hebraico o substantivo interpretativo “propósito”.
- source_word: עָלָי
  choice: o que me diz respeito
  rationale: 'Com גמר, a preposição עַל e o sufixo têm sentido idiomático: aquilo que concerne ao salmista. A formulação preserva essa abertura melhor do que a leitura estritamente benefativa “por mim”.'
theological_decisions:
- issue: Sentido de גֹמֵר עָלָי
  choice: Deus leva a termo o que diz respeito ao salmista
  alternative: Deus cumpre seu propósito para mim
  rationale: O hebraico afirma que Deus completa aquilo que concerne ao salmista, mas não explicita o objeto como “propósito”. A tradução principal preserva essa ambiguidade; a nota registra a interpretação contextual legítima.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A disposição em duas linhas evidencia o paralelismo poético. “Leva a termo” é corrente em registro bíblico-literário sem ser arcaico.
