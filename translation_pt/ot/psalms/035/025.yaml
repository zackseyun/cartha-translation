  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: pt
  text: 'Não digam em seu coração[a]: “Ah! Era o que queríamos!” Não digam: “Nós o engolimos!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seus corações”. A expressão seguinte também pode ser traduzida mais literalmente como “Ah, nossa alma!” ou entendida como “Ah, nosso desejo!” ou “Ah, nosso apetite!”. Aqui, o hebraico néfesh provavelmente indica aquilo que eles desejavam, ou a satisfação desse desejo, e não uma alma imaterial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Não digam
  rationale: אַל com a forma verbal prefixada expressa aqui um pedido negativo dirigido a Deus quanto à fala dos inimigos. Em português, “Não digam” preserva de modo natural a força volitiva no contexto da oração.
- source_word: בְלִבָּם
  choice: no coração
  rationale: Mantém a imagem hebraica do coração como sede do pensamento e do desejo íntimo. O singular coletivo corresponde à forma do texto-fonte e é compreensível em português.
- source_word: הֶאָח
  choice: Ah!
  rationale: Interjeição de triunfo malicioso. “Ah!” soa natural em português e conserva a força exclamativa sem acrescentar uma explicação.
- source_word: נַפְשֵׁנוּ
  choice: Era isso que queríamos
  rationale: נֶפֶשׁ tem ampla faixa semântica, incluindo pessoa, vida, apetite e desejo. Neste brado de satisfação, uma formulação idiomática ligada ao desejo comunica melhor o sentido provável do que o literal “nossa alma”, sem ocultar as alternativas na nota.
- source_word: בִּלַּעֲנוּהוּ
  choice: Nós o engolimos
  rationale: Preserva a metáfora vívida de בלע, que retrata a derrota completa da vítima. O perfeito é adequadamente expresso pelo pretérito perfeito português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Não digam” e a metáfora de engolir foram preservadas. A primeira exclamação foi vertida idiomaticamente, enquanto a polissemia de נֶפֶשׁ permanece documentada em nota.
