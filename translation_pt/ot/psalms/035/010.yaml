  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: pt
  text: 'Todos os meus ossos dirão: “SENHOR, quem é como tu? Tu livras o pobre de quem é mais forte do que ele, o pobre e o necessitado de quem o rouba.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Todos os meus ossos
  rationale: Preserva a imagem corporal enfática do hebraico, que expressa o ser inteiro do salmista, sem substituí-la por uma explicação abstrata.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o tetragrama, em versaletes representados aqui por maiúsculas.
- source_word: עָנִי
  choice: o pobre
  rationale: Neste contexto de exploração e desigualdade de poder, 'pobre' comunica de modo natural a vulnerabilidade social e material do termo.
- source_word: מֵחָזָק מִמֶּנּוּ
  choice: de quem é mais forte do que ele
  rationale: Reproduz a comparação explícita do hebraico e mantém o referente humano singular.
- source_word: אֶבְיוֹן
  choice: necessitado
  rationale: Distingue o termo de עָנִי e ressalta a condição de carência.
- source_word: מִגֹּזְלוֹ
  choice: de quem o rouba
  rationale: Traduz diretamente o particípio de גזל, que indica alguém que toma algo pela força ou de modo injusto.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: A forma tradicional mantém reconhecimento público amplo sem introduzir uma vocalização reconstruída no corpo do texto.
- issue: Sentido da expressão 'todos os meus ossos'
  choice: Manter a metáfora literalmente
  alternative: Todo o meu ser
  rationale: A imagem poética é clara em português e não deve ser silenciosamente interpretada ou nivelada.
- issue: Caracterização de עָנִי
  choice: pobre
  alternative: afligido
  rationale: O paralelismo com 'necessitado' e a ação de roubar favorecem a dimensão socioeconômica, embora o termo hebraico também possa abranger aflição e opressão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. A repetição de 'o pobre' foi mantida para refletir o paralelismo hebraico. A segunda oração foi formulada como declaração direta ('Tu livras'), coerente com o particípio hebraico de valor descritivo e mais fluida em português.
