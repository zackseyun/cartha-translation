base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: pt
  text: Quanto a mim, quando eles adoeciam, minha veste era de pano de saco[a]; humilhava-me com jejum[b], e minha oração voltava ao meu peito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pano de saco era um tecido áspero usado como roupa de luto, aflição ou arrependimento.
    reason: cultural_note
  - marker: b
    text: Literalmente, “afligia a mim mesmo com jejum”, expressão hebraica que indica humilhar-se ou negar-se a si mesmo por meio do jejum.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “minha oração voltava sem resposta” ou “minha oração voltava para meu benefício”. A expressão hebraica é idiomática e pode indicar que a intercessão não mudou a hostilidade deles ou que seu benefício retornou ao salmista.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: quando eles adoeciam
  rationale: A construção com ב e o infinitivo de חלה, acompanhado do sufixo da terceira pessoa masculina plural, tem sentido temporal e se refere ao adoecimento deles.
- source_word: לְבוּשִׁי שָׂק
  choice: minha roupa era pano de saco
  rationale: Mantém a estrutura nominal hebraica e expressa com clareza o estado de luto do salmista.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: eu me humilhava com jejum
  rationale: A expressão hebraica significa literalmente afligir a própria vida ou pessoa com jejum. A formulação escolhida comunica em português atual a autohumilhação realizada por meio do jejum.
- source_word: וּתְפִלָּתִי
  choice: e minha oração
  rationale: Tradução direta do substantivo com a conjunção, ligando a oração às ações de luto e jejum.
- source_word: עַל חֵיקִי תָשׁוּב
  choice: voltava ao meu próprio peito
  rationale: 'Preserva a imagem concreta e a ambiguidade do hebraico: חֵיק pode indicar peito, regaço ou dobra da veste, e שוב significa voltar ou retornar.'
theological_decisions:
- issue: Sentido de “minha oração voltava ao meu próprio peito”
  choice: Preservar no texto principal a imagem hebraica sem definir seu sentido.
  alternative: “minha oração voltava sem resposta” ou “o benefício da minha oração voltava para mim”
  rationale: A expressão é idiomática e genuinamente ambígua. Ela pode sugerir que a intercessão não alterou a hostilidade deles, que não foi atendida em favor deles ou que seu benefício retornou ao salmista. Escolher uma dessas interpretações no texto eliminaria uma tensão presente no original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pano de saco” conserva a expressão bíblica reconhecível e recebe explicação cultural. O imperfeito em “adoeciam”, “era”, “me humilhava” e “voltava” retrata a conduta habitual ou reiterada do salmista quando seus adversários ficavam doentes.
