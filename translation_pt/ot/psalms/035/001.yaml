  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: pt
  text: 'De Davi.[a]


    Enfrenta, Yahweh, os que me enfrentam[b]; combate os que me combatem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “Para Davi”. A expressão hebraica pode indicar autoria ou uma associação com Davi.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Defende a minha causa contra os meus adversários”. O verbo hebraico pode referir-se tanto a pleitear uma causa quanto, de modo mais amplo, a enfrentar alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria ou associação. “De Davi” é a formulação tradicional e concisa em português sem restringir indevidamente a relação.
- source_word: רִיבָה ... אֶת יְרִיבַי
  choice: Enfrenta ... os que me enfrentam
  rationale: A repetição verbal conserva o paralelismo e a reciprocidade do hebraico. “Enfrentar” é natural no português atual e comunica a oposição, enquanto a nota preserva a possível dimensão jurídica do verbo ריב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְחַם ... אֶת לֹחֲמָי
  choice: combate os que me combatem
  rationale: “Combater” preserva a força bélica de לחם e reproduz naturalmente em português a repetição entre o imperativo e o particípio.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” conserva sua função de nome pessoal, sem substituí-lo pelo título tradicional.
- issue: Sentido jurídico ou adversativo de ריב
  choice: Enfrenta
  alternative: Defende a minha causa
  rationale: O verbo pode descrever tanto uma disputa judicial quanto um confronto mais amplo. O texto principal evita acrescentar explicitamente “minha causa”, ausente no hebraico, e a nota registra a leitura jurídica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo verbal preservado nas duas metades do verso. “Enfrenta” evita o tom arcaizante de “contende”, e “combate” mantém a intensidade militar da segunda linha.
