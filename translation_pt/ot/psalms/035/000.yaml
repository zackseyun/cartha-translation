base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: pt
  text: De Davi. Ó SENHOR[a], enfrenta os que me enfrentam[b]; combate os que me combatem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, o nome pessoal de Deus, tradicionalmente representado por “SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: 'O primeiro verbo também pode ter sentido jurídico: “Defende a minha causa contra os que litigam comigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a forma concisa e a ambiguidade convencional do sobrescrito hebraico, que pode indicar autoria, associação, dedicação ou pertencimento.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: enfrenta os que me enfrentam
  rationale: Reproduz a repetição da raiz ריב e mantém seu sentido amplo de contender ou entrar em disputa, sem limitar o texto exclusivamente ao âmbito judicial.
- source_word: לְחַם ... אֶת־לֹחֲמָי
  choice: combate os que me combatem
  rationale: Conserva a figura bélica e o paralelismo enfático do hebraico em português natural.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes; a nota registra a forma do hebraico.
theological_decisions:
- issue: Agência divina no pedido imprecatório
  choice: Mantida a súplica direta para que o SENHOR enfrente e combata os adversários do salmista.
  alternative: Abrandar como simples defesa ou auxílio.
  rationale: O hebraico emprega dois imperativos fortes e paralelos; suavizá-los eliminaria a tensão teológica genuína do texto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo direto. O vocativo “Ó SENHOR” dá naturalidade à oração. A repetição verbal do original foi preservada, e o sobrescrito permaneceu deliberadamente conciso.
