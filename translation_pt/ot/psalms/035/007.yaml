lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e preserva o valor causal com fluidez poética em português.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Expressa uma ação gratuita, sem causa justificável, e mantém a repetição enfática nas duas orações.
- source_word: טָמְנוּ
  choice: esconderam
  rationale: Traduz diretamente a ideia de ocultar a armadilha.
- source_word: לִי
  choice: para mim
  rationale: Preserva de modo compacto a indicação de alvo ou prejuízo presente no hebraico.
- source_word: שַׁחַת רִשְׁתָּם
  choice: uma cova com sua rede
  rationale: Mantém os dois elementos concretos da imagem de caça sem impor uma relação sintática excessivamente precisa onde o hebraico é difícil e ambíguo.
- source_word: חָפְרוּ
  choice: cavaram-na
  rationale: Conserva a imagem concreta de cavar e retoma naturalmente a cova em português.
- source_word: לְנַפְשִׁי
  choice: para tirar minha vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a própria pessoa ameaçada, não necessariamente uma alma imaterial; a formulação torna explícita a intenção hostil sugerida pela expressão.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma
  rationale: O contexto descreve uma ameaça à vida do salmista. Traduzir por “alma” poderia introduzir uma distinção antropológica posterior que o hebraico não exige aqui.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético preservado. A primeira oração conserva a ambiguidade da relação entre a cova e a rede em vez de reduzi-las a uma única armadilha; a nota registra as principais alternativas. A segunda oração explicita com naturalidade a ameaça à vida.
