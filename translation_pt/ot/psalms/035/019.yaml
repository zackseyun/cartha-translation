  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: pt
  text: Não deixes que meus inimigos mentirosos[a] se alegrem contra mim, nem que os que me odeiam sem motivo pisquem o olho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que meus inimigos se alegrem falsamente contra mim”. A expressão hebraica é compacta e pode descrever inimigos caracterizados pela falsidade ou inimigos que agem falsamente contra o salmista.'
    reason: lexical_alternative
  - marker: b
    text: “Piscar o olho” é uma expressão hebraica para fazer um sinal malicioso ou conspiratório, muitas vezes indicando desprezo ou hostilidade secreta.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יִשְׂמְחוּ
  choice: Não deixes que ... se alegrem
  rationale: A partícula negativa com o imperfeito expressa aqui um pedido proibitivo dirigido a Deus; esta formulação preserva tanto a oração quanto a ideia de impedir o triunfo hostil.
- source_word: לִי
  choice: por minha causa
  rationale: A preposição é literalmente ampla ('para mim', 'a meu respeito'); no contexto, indica alegria hostil relacionada ao que acontece ao salmista, sem explicitar além do hebraico uma vitória já consumada.
- source_word: אֹיְבַי שֶׁקֶר
  choice: meus inimigos mentirosos
  rationale: A expressão hebraica compacta liga 'meus inimigos' a 'falsidade'. A tradução mantém a leitura atributiva no texto e registra em nota a possibilidade adverbial.
- source_word: שֹׂנְאַי חִנָּם
  choice: os que me odeiam sem motivo
  rationale: O particípio designa aqueles que mantêm uma atitude de ódio, e חִנָּם indica que tal hostilidade é imerecida ou destituída de causa.
- source_word: יִקְרְצוּ עָיִן
  choice: pisquem o olho
  rationale: Preserva a imagem concreta do idioma hebraico, cujo valor malicioso ou conspiratório é explicado em nota.
