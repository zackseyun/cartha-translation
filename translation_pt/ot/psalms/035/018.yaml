  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: pt
  text: Eu te darei graças na grande assembleia[a]; no meio de um povo numeroso[b], eu te louvarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa grande congregação”.'
