    reason: lexical_alternative
lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: Eu te darei graças
  rationale: O hifil de ידה, em contexto de culto, significa dar graças ou louvar. “Darei graças” preserva a distinção em relação a אֲהַלְלֶךָ, traduzido por “louvarei” no segundo membro.
- source_word: בְּקָהָל רָב
  choice: na grande assembleia
  rationale: קָהָל designa uma reunião ou congregação reunida, e רָב pode indicar grandeza ou número. “Grande assembleia” é natural, digna e mantém o caráter público da declaração.
- source_word: בְּעַם עָצוּם
  choice: no meio de um povo numeroso
  rationale: עָצוּם pode significar numeroso ou poderoso. O paralelismo com “grande assembleia” favorece aqui a ideia de grande número, sem eliminar a alternativa lexical indicada em nota.
- source_word: אֲהַלְלֶךָּ
  choice: eu te louvarei
  rationale: O piel de הלל significa regularmente louvar ou exaltar. “Louvarei” é direto e natural em português.
