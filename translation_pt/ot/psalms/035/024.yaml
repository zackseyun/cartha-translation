  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: pt
  text: Julga-me segundo a tua justiça[a], ó Yahweh, meu Deus, e não deixes que eles se alegrem à minha custa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a tua retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Julga-me
  rationale: O imperativo de שׁפט pede que Deus profira uma decisão judicial em favor do salmista. “Julga-me” preserva de modo direto a imagem forense e, no contexto da súplica, implica vindicação.
- source_word: כְצִדְקְךָ
  choice: segundo a tua justiça
  rationale: צדק designa aqui a retidão ou justiça que caracteriza Deus e serve de norma para seu juízo. “Justiça” é natural em português e mantém a dimensão moral e judicial; “retidão” permanece alternativa legítima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Conserva explicitamente o sufixo de primeira pessoa do singular.
- source_word: וְאַל יִשְׂמְחוּ
  choice: e não deixes que eles se alegrem
  rationale: אַל com o imperfeito expressa um pedido negativo dirigido a Deus. A construção “não deixes que” comunica com clareza que se pede a Deus que impeça a alegria hostil dos adversários.
- source_word: לִי
  choice: com a minha desgraça
  rationale: Neste contexto adversativo, לִי com שׂמח indica alegria maliciosa às custas do salmista. A formulação torna essa relação idiomática em português, embora explicite o motivo implícito da alegria.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem o substituir por um título.
- issue: Sentido de צִדְקְךָ
  choice: tua justiça
  alternative: tua retidão
  rationale: “Justiça” preserva a dimensão moral e forense da palavra sem restringi-la apenas a procedimento judicial. “Retidão” é uma alternativa lexical real e consta em nota.
- issue: Força de שָׁפְטֵנִי
  choice: Julga-me
  alternative: Faze-me justiça; Defende a minha causa
  rationale: A petição solicita um julgamento favorável, mas a tradução mantém a forma verbal ampla do hebraico e deixa que o contexto comunique a vindicação.
translation_notes:
  register: Português moderno, digno e acessível, com colocação pronominal natural no imperativo. O vocativo “ó Yahweh, meu Deus” conserva a solenidade poética. A expressão “com a minha desgraça” comunica o regozijo hostil implícito no contexto.
