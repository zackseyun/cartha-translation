translation:
  language: pt
  text: 'Abriram bem a boca contra mim e disseram: “Ahá! Ahá! Nossos olhos[a] viram!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Nosso olho viu”. O hebraico usa um verbo no singular com a expressão coletiva “nossos olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  choice: Abriram bem
  rationale: O hifil de רחב significa literalmente “tornaram largo”. Com “boca”, a expressão descreve abrir bem a boca, aqui em zombaria hostil.
- source_word: עָלַי
  choice: contra mim
  rationale: A preposição עַל, neste contexto de fala hostil, indica oposição, não posição espacial.
- source_word: פִּיהֶם
  choice: a boca
  rationale: O hebraico emprega o singular “boca” com sujeito plural. O português admite naturalmente esse uso distributivo, preservando a forma da imagem hebraica.
- source_word: הֶאָח הֶאָח
  choice: Ah! Ah!
  rationale: A interjeição repetida expressa satisfação maliciosa ou triunfo zombeteiro. “Ah! Ah!” conserva a repetição e soa natural em português.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Nossos olhos viram
  rationale: A expressão hebraica é literalmente “nosso olho viu”, com “olho” em sentido coletivo. O plural é a formulação idiomática em português; não se acrescentou objeto explícito, preservando a abertura do original quanto ao que foi visto.
