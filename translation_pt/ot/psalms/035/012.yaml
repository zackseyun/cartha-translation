base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/012.yaml
  text: They repay me evil for good[b][a], bereavement to my soul.
translation:
  language: pt
  text: Retribuem-me o mal pelo bem; deixam minha alma desolada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “luto para a minha alma” ou “perda dolorosa para mim”. O hebraico pode evocar luto por uma perda — frequentemente pela perda de filhos — ou, em sentido figurado, desolação; “alma” também pode significar vida ou a própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Retribuem-me
  rationale: O piel de שׁלם expressa retribuição ou pagamento em resposta ao que foi recebido; “retribuem-me” é natural e preserva a ideia de reciprocidade hostil.
- source_word: רָעָה
  choice: o mal
  rationale: O substantivo pode indicar mal moral ou dano. “O mal” mantém ambas as nuances e corresponde ao contraste conciso do hebraico.
- source_word: תַּחַת טוֹבָה
  choice: pelo bem
  rationale: תַּחַת marca troca ou substituição. Na construção “o mal pelo bem”, “pelo” comunica com clareza a retribuição indevida.
- source_word: שְׁכוֹל
  choice: desolada
  rationale: שְׁכוֹל denota privação ou perda grave, muitas vezes luto pela perda de filhos. No contexto metafórico, “desolada” comunica o efeito devastador sem especificar indevidamente uma perda literal de filhos.
- source_word: לְנַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode significar alma, vida ou o próprio ser. “Minha alma” preserva a imagem poética e a amplitude antropológica do termo.
theological_decisions:
- issue: Relação sintática da frase nominal שְׁכוֹל לְנַפְשִׁי com a oração anterior
  choice: deixam minha alma desolada
  alternative: desolação para a minha alma
  rationale: O hebraico apresenta uma frase nominal abrupta, cuja relação exata com a primeira oração não é explicitada. A formulação verbal em português expressa o resultado mais provável e evita um fragmento pouco natural, enquanto a nota registra a forma mais literal e sua ambiguidade.
translation_notes:
  register: Português atual, digno e poético, com colocação pronominal natural e paralelismo conciso. A segunda expressão foi tornada verbal para clareza em português, sem eliminar na nota a formulação nominal e a amplitude semântica do hebraico.
