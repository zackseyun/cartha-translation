  yaml_path: translation/ot/psalms/035/028.yaml
  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: pt
  text: E a minha língua falará[b] da tua justiça[a] e, o dia inteiro, do teu louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tua retidão”. O termo hebraico pode abranger tanto retidão quanto justiça, especialmente num contexto de vindicação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meditará sobre” ou “murmurará”. O verbo hebraico pode indicar meditação, fala em voz baixa ou enunciação; aqui, por ter “a minha língua” como sujeito, o contexto favorece a fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: E a minha língua
  rationale: Mantém a conjunção que liga o versículo ao contexto anterior e conserva a metonímia hebraica da língua como órgão da fala.
- source_word: תֶּהְגֶּה
  choice: falará
  rationale: O verbo הגה pode indicar murmurar, meditar ou proferir. Como o sujeito é “a minha língua”, o contexto favorece expressão vocal; “falará” evita especificar indevidamente o volume ou o modo.
- source_word: צִדְקֶךָ
  choice: da tua justiça
  rationale: “Justiça” preserva tanto a retidão de Deus quanto sua ação justa ao vindicar o salmista, sem estreitar o sentido.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão portuguesa natural que comunica a duração de “todo o dia”.
- source_word: תְּהִלָּתֶךָ
  choice: do teu louvor
  rationale: Conserva a forma possessiva do hebraico e permite entender tanto o louvor dirigido a Deus quanto o louvor que lhe pertence.
theological_decisions:
- issue: Sentido de צִדְקֶךָ no contexto da vindicação divina
  choice: tua justiça
  alternative: tua retidão
  rationale: O termo hebraico abrange a retidão moral de Deus e sua justiça ativa em favor do salmista. “Justiça” mantém essa amplitude, enquanto “retidão” é uma alternativa possível.
- issue: Alcance de “o dia inteiro”
  choice: Ligação mais imediata com “do teu louvor”, preservando a disposição poética hebraica
  alternative: Ligação com toda a ação de falar da justiça e do louvor
  rationale: A ordem hebraica coloca a expressão temporal antes de “teu louvor” no segundo membro. A pontuação mantém essa proximidade sem excluir totalmente que a duração caracterize a declaração como um todo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O ponto e vírgula e a elipse de “falará” no segundo membro preservam o paralelismo poético e a ordem enfática do hebraico.
