  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: pt
  text: Sejam envergonhados e humilhados os que procuram tirar-me a vida[a]; recuem e sejam desonrados os que planejam o meu mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “os que buscam a minha vida” ou “a minha alma”; neste contexto, a expressão hebraica significa procurar matar alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que tramam o mal contra mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O Qal de בוש expressa sofrer vergonha ou ser exposto à vergonha; a construção com “sejam” preserva aqui a força optativa/imprecatória.
- source_word: וְיִכָּלְמוּ
  choice: e humilhados
  rationale: O Nifal de כלם pertence ao campo semântico da vergonha e da desonra; “humilhados” mantém seu sentido passivo/resultativo e reforça o paralelismo sem mera repetição.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: os que procuram tirar-me a vida
  rationale: Nesse contexto hostil, buscar a נֶפֶשׁ de alguém significa procurar matá-lo. A formulação explicita naturalmente o idioma hebraico em português.
- source_word: יִסֹּגוּ אָחוֹר
  choice: recuem
  rationale: סוג com אָחוֹר indica retirar-se ou voltar para trás; “recuem” comunica de modo conciso a derrota ou reversão desejada.
- source_word: וְיַחְפְּרוּ
  choice: e sejam desonrados
  rationale: חפר denota aqui vergonha ou desonra, não o ato literal de cavar. “Sejam desonrados” distingue o termo dos verbos anteriores sem abandonar o mesmo campo semântico.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: os que planejam o meu mal
  rationale: חשב indica conceber ou planejar, enquanto רָעָתִי pode designar o mal ou dano dirigido contra o salmista. A tradução preserva essa formulação e sua possível amplitude.
theological_decisions:
- issue: Força imprecatória dos imperfeitos hebraicos
  choice: 'Traduzir como desejo ou petição: “Sejam... recuem... sejam...”'
  alternative: 'Traduzir como previsão indicativa: “Serão... recuarão...”'
  rationale: Embora as formas imperfeitas possam ser ambíguas isoladamente, no contexto da oração funcionam naturalmente como pedidos de juízo. A tradução preserva a súplica do salmista sem convertê-la em simples previsão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O paralelismo poético e a força imprecatória foram preservados; evitou-se linguagem denominacional.
