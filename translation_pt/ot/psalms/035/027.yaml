  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: pt
  text: 'Que gritem de alegria e se alegrem os que têm prazer na minha vindicação[a]; que digam sempre: “Yahweh seja engrandecido, pois tem prazer na paz[b] de seu servo!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na minha justiça” ou “na minha retidão”. O termo hebraico pode indicar justiça em sentido moral ou jurídico; neste contexto, provavelmente se refere à vindicação do salmista.
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode significar “bem-estar” ou “prosperidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: Que exultem
  rationale: O verbo רנן indica uma manifestação vocal intensa de alegria. “Exultem” comunica alegria pública e exuberante em português natural, sem restringir o sentido ao canto.
- source_word: וְיִשְׂמְחוּ
  choice: e se alegrem
  rationale: שמח significa alegrar-se ou regozijar-se. A formulação preserva o paralelismo com a primeira expressão de júbilo.
- source_word: חֲפֵצֵי
  choice: os que têm prazer na
  rationale: O particípio de חפץ expressa prazer, agrado ou deleite. “Têm prazer” é claro e permite manter a ligação lexical com הֶחָפֵץ na segunda metade do versículo.
- source_word: צִדְקִי
  choice: minha vindicação
  rationale: No contexto forense do salmo, a expressão aponta provavelmente para o reconhecimento de que o salmista tem razão diante de seus acusadores. “Vindicação” torna esse sentido claro sem excluir em nota as possibilidades mais amplas de justiça e retidão.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: que digam sempre
  rationale: A construção prossegue com valor volitivo. “Sempre” traduz תָמִיד de maneira simples e natural, comunicando louvor contínuo.
- source_word: יִגְדַּל יְהוָה
  choice: Seja engrandecido Yahweh
  rationale: O imperfeito tem força volitiva numa fórmula de louvor. “Seja engrandecido” preserva o sentido verbal de גדל, e “Yahweh” translitera o nome divino.
- source_word: הֶחָפֵץ
  choice: que tem prazer
  rationale: A tradução mantém o sentido afetivo do particípio e a repetição intencional da raiz חפץ presente anteriormente no versículo.
- source_word: שְׁלוֹם
  choice: paz
  rationale: שָׁלוֹם inclui paz, bem-estar, integridade e prosperidade. “Paz” é a correspondência direta e tradicional, enquanto a nota registra a amplitude semântica relevante.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: No contexto dos Salmos, עֶבֶד designa adequadamente o salmista em sua relação de serviço e pertencimento a Deus. “Servo” é digno, corrente e contextualmente apropriado.
theological_decisions:
- issue: Sentido de צִדְקִי aplicado ao salmista
  choice: minha vindicação
  alternative: minha justiça; minha retidão
  rationale: 'O conflito com acusadores favorece uma leitura forense: os apoiadores do salmista desejam que ele seja reconhecido como estando com a razão. A tradução evita transformar a frase numa afirmação inequívoca de perfeição moral, mas preserva a amplitude do hebraico em nota.'
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome pessoal divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Amplitude de שְׁלוֹם
  choice: paz
  alternative: bem-estar; prosperidade
  rationale: “Paz” preserva a forma mais direta do termo, enquanto a nota esclarece que o hebraico pode abranger o pleno bem-estar do servo, e não apenas a ausência de conflito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A estrutura volitiva foi mantida por meio de “Que...” e “Seja...”. A repetição de “têm prazer” preserva a ligação lexical do hebraico, e os marcadores de nota foram posicionados junto aos termos que explicam.
