source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: pt
  text: Mas, quando tropecei[a], eles se alegraram e se reuniram; reuniram-se contra mim agressores[b] que eu não conhecia[d]. Eles me dilaceraram e não pararam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando manquejei”, “na minha claudicação” ou “quando vacilei”. O hebraico pode indicar uma limitação física ou, em sentido mais amplo, um momento de fraqueza ou queda.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é raro e incerto. Pode significar “os que golpeiam” ou “feridores”; também pode referir-se a pessoas aflitas ou incapacitadas.
    reason: lexical_alternative
  - marker: c
    text: Ou “eles me dilaceraram e não se calaram”, caso a imagem descreva insultos incessantes, e não uma agressão física contínua.
    reason: lexical_alternative
  - marker: d
    text: Ou “reuniram-se contra mim agressores, e eu não sabia”, caso a frase indique que o salmista desconhecia a reunião ou a conspiração deles.
    reason: syntactic_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: quando tropecei
  rationale: O substantivo ligado a צלע pode indicar manqueira, claudicação ou um momento de tropeço e fraqueza. A formulação comunica com naturalidade a adversidade do salmista sem excluir por completo a imagem física.
- source_word: שָׂמְחוּ
  choice: eles se alegraram
  rationale: Equivalente corrente do Qal perfeito de שמח, aqui com o sentido hostil de alegrar-se com a desgraça alheia.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: eles se reuniram; reuniram-se
  rationale: Mantém a repetição enfática do verbo אסף presente no hebraico, sem tornar a frase artificial em português.
- source_word: עָלַי
  choice: contra mim
  rationale: Embora a preposição possa significar literalmente “sobre mim”, o contexto hostil favorece o português idiomático “contra mim”.
- source_word: נֵכִים
  choice: agressores
  rationale: O termo é raro e de sentido incerto. A interpretação ligada a golpear se ajusta ao contexto de hostilidade; “agressores” é natural em português e evita o arcaísmo de “feridores”. Outras possibilidades são registradas em nota.
- source_word: וְלֹא יָדַעְתִּי
  choice: que eu não conhecia
  rationale: A frase pode ser entendida como oração relativa referente aos agressores. Essa leitura é gramaticalmente fluente e conserva a possibilidade de serem pessoas que o salmista não conhecia ou não reconhecia como inimigas; a outra análise sintática fica em nota.
- source_word: קָרְעוּ
  choice: eles me dilaceraram
  rationale: קרע significa rasgar ou dilacerar. O objeto não está expresso no hebraico, mas o contexto permite explicitar o salmista como alvo, preservando uma imagem que pode descrever agressão física ou verbal.
- source_word: וְלֹא דָמּוּ
  choice: e não pararam
  rationale: דמם pode significar calar-se ou cessar. “Não pararam” expressa a ação implacável sem decidir se o ataque era físico ou verbal; a alternativa literal relevante é dada em nota.
theological_decisions: []
