  source_fidelity: 'O texto preserva adequadamente a sequência e a ênfase do hebraico: a alegria diante da adversidade do salmista, a repetição de אסף (“se reuniram; reuniram-se”), a reunião hostil contra ele e o ataque contínuo. “Quando tropecei” é uma contextualização legítima de בְּצַלְעִי, enquanto a nota mantém as possibilidades de manqueira/claudicação e de fraqueza. “Agressores” adota com cautela a leitura ativa mais provável para נֵכִים, e a nota registra a incerteza lexical. A oração relativa “que eu não conhecia” é uma análise sintática possível de וְלֹא יָדַעְתִּי; a alternativa de desconhecimento da conspiração está devidamente anotada.'
