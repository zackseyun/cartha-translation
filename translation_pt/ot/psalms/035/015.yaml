  terminology: “Agressores” é uma solução portuguesa natural para a leitura de נֵכִים como pessoas que golpeiam ou atacam. Não elimina a alternativa de pessoas aflitas/incapacitadas, que permanece explicitamente indicada na nota. Os demais termos não levantam questões teológicas ou onomásticas.
