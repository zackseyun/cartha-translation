  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: pt
  text: Toma o escudo e o escudo grande[a] e levanta-te para me ajudar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa dois termos distintos para escudo; o segundo provavelmente indica um escudo maior, que protegia uma parte mais extensa do corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Toma
  rationale: O imperativo de חזק, neste contexto, pede que Deus empunhe armas defensivas. “Toma” é natural em português e conserva a imagem concreta de prontidão para a luta.
- source_word: מָגֵן
  choice: escudo
  rationale: מָגֵן é o termo comum para escudo; a tradução direta mantém a metáfora militar.
- source_word: צִנָּה
  choice: escudo grande
  rationale: צִנָּה designa provavelmente um escudo maior, distinto de מָגֵן. “Escudo grande” comunica a diferença com clareza, sem recorrer a um termo arcaico ou potencialmente enganoso.
- source_word: וְקוּמָה
  choice: e levanta-te
  rationale: O imperativo de קום com he paragógico exprime um apelo enfático para que Deus intervenha. “Levanta-te” é natural na linguagem de oração e preserva o movimento da imagem hebraica.
- source_word: בְּעֶזְרָתִי
  choice: para me ajudar
  rationale: A construção com בְּ e עֶזְרָה indica ação em favor do salmista. A forma verbal idiomática é mais natural em português, embora o hebraico empregue o substantivo “ajuda”.
theological_decisions:
- issue: Representação de Deus por meio de imagens militares
  choice: Manter literalmente Deus tomando escudos e levantando-se para ajudar o salmista.
  alternative: Suavizar a linguagem para um pedido geral de proteção.
  rationale: O hebraico apresenta explicitamente Deus como guerreiro e defensor. Preservar essa imagem mantém a força poética e a tensão teológica do texto, sem transformá-la em uma afirmação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com forma de segunda pessoa singular compatível com a linguagem direta de oração. A repetição “escudo e escudo grande” reproduz deliberadamente os dois termos hebraicos distintos e evita o termo “broquel”, hoje pouco transparente e capaz de sugerir equivocadamente um escudo pequeno.
