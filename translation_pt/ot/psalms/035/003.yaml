  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: pt
  text: 'Saca a lança e bloqueia o caminho dos que me perseguem[a]; diz à minha alma[b]: “Eu sou a tua salvação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saca a lança e o machado de guerra contra os que me perseguem”, se וּסְגֹר for entendido como o nome de uma arma, e não como o verbo “bloquear” ou “fechar”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “à minha vida” ou simplesmente “a mim”. A palavra hebraica pode indicar a alma, a vida ou a própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Empunha
  rationale: O hifil imperativo de ריק, neste contexto bélico, indica tirar ou sacar a arma. “Empunha” expressa em português natural a ação de pôr a lança em uso, sem recorrer ao menos idiomático “desembainha a lança”.
- source_word: חֲנִית
  choice: a lança
  rationale: É o termo hebraico comum para lança. O artigo em português torna a ordem natural neste contexto.
- source_word: וּסְגֹר
  choice: bloqueia o caminho
  rationale: O verbo significa fechar ou impedir. Como o objeto está implícito, “o caminho” explicita de modo natural aquilo que deve ser fechado diante dos perseguidores, sem eliminar a leitura alternativa como nome de arma.
- source_word: לִקְרַאת
  choice: dos que
  rationale: Em combinação com “bloqueia o caminho”, a preposição com sentido de ir ao encontro ou colocar-se diante de alguém é expressa naturalmente pela construção completa “bloqueia o caminho dos que me perseguem”.
- source_word: רֹדְפָי
  choice: os que me perseguem
  rationale: O particípio com sufixo de primeira pessoa descreve os perseguidores ou aqueles que continuam perseguindo o salmista.
- source_word: אֱמֹר
  choice: diz
  rationale: Tradução direta do imperativo singular de אמר, em registro atual e digno.
- source_word: לְנַפְשִׁי
  choice: à minha alma
  rationale: Preserva a expressão poética hebraica e sua dimensão interior e pessoal, sem reduzi-la simplesmente a “a mim”.
- source_word: יְשֻׁעָתֵךְ
  choice: a sua salvação
  rationale: יְשׁוּעָה pode designar tanto livramento concreto quanto salvação em sentido mais amplo. “Salvação” conserva essa amplitude; “sua” é dirigido à alma do salmista.
- source_word: אָֽנִי
  choice: Eu sou
  rationale: O pronome independente é enfático. A construção portuguesa “Eu sou” reproduz essa ênfase e fornece a cópula exigida.
theological_decisions:
- issue: Sentido de יְשׁוּעָה numa oração por resgate
  choice: salvação
  alternative: livramento
  rationale: O contexto imediato é de socorro diante de perseguidores, de modo que “livramento” é possível. “Salvação”, porém, mantém a amplitude do hebraico e sua força teológica sem impor conteúdo doutrinário posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa singular foi mantida nos imperativos dirigidos a Deus; dentro da fala à alma, “sua” evita a forma pouco corrente “tua” após “à minha alma”, embora possa haver ambiguidade formal fora do contexto.
