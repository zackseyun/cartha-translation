  terminology: “Lança”, “alma” e “salvação” são adequados ao registro poético e ao hebraico. A nota alternativa deve usar “machado de guerra”, e não a expressão genérica “arma de combate”, para refletir a proposta lexical em questão, mantendo-a como leitura disputada.
