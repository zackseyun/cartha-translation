  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: pt
  text: Venha sobre ele a destruição sem que perceba[a]; que a rede que escondeu o apanhe; nessa mesma destruição caia ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venha sobre ele a destruição quando ele menos esperar”. O hebraico diz literalmente: “venha sobre ele a destruição; ele não sabe”.'
    reason: lexical_alternative
  - marker: b
    text: 'O último pronome feminino também pode se referir à rede: “caia ele nela”, enfatizando que é apanhado na própria armadilha.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: Venha sobre ele
  rationale: O verbo בוא, com שׁוֹאָה como sujeito e sufixo de terceira pessoa masculina, descreve a destruição vindo sobre o inimigo. A forma portuguesa preserva o valor volitivo próprio do contexto imprecatório.
- source_word: שׁוֹאָה
  choice: destruição
  rationale: O substantivo designa ruína ou devastação. “Destruição” é claro, digno e permite manter a correspondência entre as duas ocorrências do termo no versículo.
- source_word: לֹא יֵדָע
  choice: sem que perceba
  rationale: A expressão significa literalmente “ele não sabe”. No contexto, indica que a destruição o surpreende sem que ele tenha consciência de sua chegada; “sem que perceba” comunica isso naturalmente sem eliminar a nota literal.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: a rede que escondeu
  rationale: O sufixo de רִשְׁתּוֹ indica “sua rede”, e a oração relativa identifica naturalmente a rede como aquela que ele próprio escondeu. טמן é adequadamente traduzido por “esconder” no contexto de uma armadilha.
- source_word: תִּלְכְּדוֹ
  choice: o apanhe
  rationale: לכד significa capturar ou apanhar. Com “rede”, “apanhar” forma uma combinação corrente e preserva a imagem da armadilha.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: nessa mesma destruição caia ele
  rationale: A construção antepõe בְּשׁוֹאָה e a retoma com o pronome feminino בָּהּ. A tradução principal entende essa retomada como enfática e conserva o paralelismo com a primeira ocorrência de “destruição”; a possível referência do pronome à rede é registrada em nota.
theological_decisions:
- issue: Caráter imprecatório do pedido
  choice: Manter as formas volitivas “Venha”, “apanhe” e “caia”
  alternative: Traduzir como simples previsão futura
  rationale: As formas verbais no contexto expressam o desejo ou pedido do salmista. Convertê-las em mera previsão reduziria a tensão própria da oração imprecatória.
- issue: Referente do pronome feminino em בָּהּ
  choice: Entendê-lo no texto principal como retomada enfática de “destruição”
  alternative: Entendê-lo como referência à “rede”, de modo que ele caia na própria armadilha
  rationale: Tanto שׁוֹאָה quanto רֶשֶׁת são femininos e podem servir de antecedente. A ordem imediata favorece “destruição”, mas a imagem da rede favorece a outra leitura; por isso, a alternativa é preservada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ordem levemente poética em “caia ele”. Evitou-se um regionalismo marcado. A repetição de “destruição” reproduz a repetição hebraica e sustenta a leitura enfática do último segmento.
