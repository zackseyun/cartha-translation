base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: pt
  text: Pois eles não falam de paz, mas contra os que vivem tranquilamente na terra[a] tramam palavras enganosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os pacíficos da terra» ou «os que estão em repouso na terra». A expressão hebraica provavelmente se refere a pessoas que vivem de maneira tranquila e pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica ou queixa anterior e mantém com naturalidade o encadeamento do salmo.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: não falam de paz
  rationale: Conserva שָׁלוֹם como conteúdo da fala, sem reduzi-lo ao advérbio «pacificamente»; em português, «falar de paz» é mais natural que «falar paz».
- source_word: שָׁלוֹם
  choice: paz
  rationale: Expressa o sentido central de paz, incluindo no contexto a ideia mais ampla de bem-estar e relações pacíficas.
- source_word: וְעַל
  choice: mas ... contra
  rationale: Torna explícito o contraste contextual entre não falar de paz e tramar contra pessoas pacíficas, preservando o valor da preposição עַל.
- source_word: רִגְעֵי אֶרֶץ
  choice: os que vivem tranquilamente na terra
  rationale: Traduz a expressão difícil como referência provável a pessoas que levam uma vida quieta e pacífica, sem fundi-la lexicalmente com o שָׁלוֹם anterior.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: palavras enganosas
  rationale: Representa de maneira natural em português o sintagma hebraico «palavras de engano», mantendo seu conteúdo verbal e malicioso.
- source_word: יַחֲשֹׁבוּן
  choice: tramam
  rationale: No contexto hostil, חשׁב indica conceber ou planejar deliberadamente; «tramam» comunica essa intenção maliciosa.
