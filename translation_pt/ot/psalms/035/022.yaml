  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: pt
  text: Tu viste, ó Yahweh; não fiques em silêncio. Ó Senhor, não te afastes de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Tu viste
  rationale: O qal perfeito na segunda pessoa masculina singular afirma que Deus já viu a situação. O pretérito perfeito é direto e natural em português, sem acrescentar um objeto ausente no hebraico.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Preserva o nome divino expresso pelo tetragrama e usa a partícula vocativa portuguesa para marcar a invocação direta.
- source_word: אַל תֶּחֱרַשׁ
  choice: não fiques em silêncio
  rationale: חרשׁ tem aqui o sentido de permanecer calado ou sem responder. A formulação conserva tanto a imagem do silêncio quanto a súplica para que Deus intervenha.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: O título divino é distinguido do nome Yahweh e vertido pela forma portuguesa corrente e digna.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: não te afastes de mim
  rationale: Expressa de modo natural a súplica negativa e preserva a metáfora relacional e espacial de רחק com מן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o nome divino; a transliteração o preserva, enquanto “Senhor” é reservado neste versículo para אֲדֹנָי.
- issue: Sentido do silêncio divino
  choice: não fiques em silêncio
  alternative: não sejas surdo
  rationale: O contexto favorece o sentido de não permanecer calado ou inativo, sem transformar a metáfora em uma afirmação de incapacidade para ouvir.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém o paralelismo das duas súplicas e distingue o nome divino Yahweh do título Senhor.
