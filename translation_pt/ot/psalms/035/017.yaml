    issue: «Livra» para הָשִׁיבָה
    rationale: O imperativo tem como sentido básico “faz voltar/restaura”. Embora “livra” seja contextualmente possível, «resgata» preserva mais claramente a noção de recuperar a vida de uma situação de destruição.
  - severity: low
    issue: «a única que tenho» para יְחִידָתִי
    rationale: A expressão acrescenta “que tenho”, ausente no original, e reduz a formulação poética concisa. «Minha única» conserva a ambiguidade e o paralelismo com «minha vida».
  revised_text: Senhor, até quando ficarás olhando? Resgata a minha vida das suas devastações, minha única, dos leões jovens.
