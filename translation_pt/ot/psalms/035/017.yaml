  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: pt
  text: Senhor, até quando ficarás olhando? Resgata a minha vida das suas devastações, minha única, dos leões jovens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Reproduz o título divino no texto hebraico de modo natural e tradicional em português.
- source_word: תִרְאֶה
  choice: ficarás olhando
  rationale: Mantém a ideia de observar sem intervir, implicada pela pergunta no contexto, sem acrescentar uma explicação ao texto.
- source_word: הָשִׁיבָה
  choice: Livra
  rationale: Embora a forma signifique literalmente 'faz voltar/restaura', neste pedido ela solicita que Deus recupere a vida do salmista das mãos dos atacantes; 'livra' comunica naturalmente essa força contextual.
- source_word: נַפְשִׁי
  choice: minha vida
  rationale: נפשׁ aqui designa a vida ou a própria pessoa ameaçada, não necessariamente uma 'alma' separada do corpo.
- source_word: מִשֹּׁאֵיהֶם
  choice: de suas devastações
  rationale: O substantivo raro deriva de uma raiz associada a devastação e ruína; a tradução preserva essa imagem e a referência plural aos inimigos.
- source_word: יְחִידָתִי
  choice: a única que tenho
  rationale: A expressão refere-se à vida única e insubstituível do salmista. A formulação portuguesa explicita a relação com 'minha vida' sem identificar uma entidade diferente.
- source_word: מִכְּפִירִים
  choice: dos leões jovens
  rationale: Mantém a metáfora hebraica dos inimigos como leões jovens e vigorosos.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי
  choice: minha vida
  alternative: minha alma
  rationale: No paralelismo com יְחִידָתִי e diante da ameaça dos inimigos, o foco é a preservação da vida inteira, sem impor uma leitura dicotômica de corpo e alma.
- issue: Relação entre נַפְשִׁי e יְחִידָתִי
  choice: minha vida... a única que tenho
  alternative: minha alma... minha única
  rationale: A tradução entende ambos como referências paralelas à única vida preciosa do salmista, preservando a intensidade do pedido em português inteligível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A ordem poética e as metáforas centrais foram preservadas; evitou-se linguagem denominacional.
