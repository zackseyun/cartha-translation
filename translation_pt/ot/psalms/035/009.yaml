  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: pt
  text: Então a minha alma se alegrará em Yahweh[a]; exultará em sua salvação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E a minha alma se alegrará em Yahweh”.'
