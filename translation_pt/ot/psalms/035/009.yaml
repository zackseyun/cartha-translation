  - marker: b
    text: 'Ou: “exultará em seu livramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Então a minha alma
  rationale: נֶפֶשׁ pode indicar alma, vida ou a própria pessoa. “A minha alma” preserva a expressão poética e o caráter interior e pessoal da alegria. O וְ inicial é traduzido como “Então” para explicitar a consequência esperada da intervenção pedida no contexto anterior.
- source_word: תָּגִיל
  choice: se alegrará
  rationale: גיל no qal expressa alegria intensa. “Se alegrará” é natural, claro e permite distinguir o verbo paralelo mais enfático na segunda oração.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ marca aqui aquele em quem a alegria encontra seu objeto ou âmbito. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: תָּשִׂישׂ
  choice: exultará
  rationale: שׂושׂ/שׂישׂ denota alegria exuberante. “Exultará” conserva a intensificação poética em relação a “se alegrará”.
- source_word: בִּישׁוּעָתוֹ
  choice: na salvação que vem dele
  rationale: יְשׁוּעָה pode significar “salvação” ou “livramento”; neste contexto inclui o resgate concreto dos inimigos. A formulação “que vem dele” expressa naturalmente em português o sufixo possessivo hebraico sem sugerir que Deus seja quem recebe a salvação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Amplitude de יְשׁוּעָה
  choice: salvação
  alternative: livramento
  rationale: “Salvação” mantém a amplitude lexical e teológica do termo, enquanto o contexto imediato permite entendê-la também como livramento concreto dos inimigos; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. “Então” liga o versículo à libertação esperada no contexto; “alma” mantém a imagem hebraica sem impedir o sentido de “eu mesmo”. A expressão “que vem dele” evita a possível estranheza ou ambiguidade de “sua salvação” em português.
