base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: pt
  text: Sejam como a palha diante do vento,[a] e o anjo de Yahweh os expulsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o anjo de Yahweh a impeli-los”. A conjunção hebraica pode ser traduzida simplesmente por “e”, e o particípio pode ter o sentido de “impelir”, “enxotar” ou “expulsar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Sejam
  rationale: 'O contexto imprecatório favorece o valor volitivo: trata-se de um pedido, não de mera previsão futura.'
- source_word: כְּמֹץ
  choice: como a palha
  rationale: מֹץ é a palha leve separada do grão e dispersa pelo vento; a expressão preserva a comparação agrícola em português corrente.
- source_word: לִפְנֵי רוּחַ
  choice: levada pelo vento
  rationale: Embora a construção seja literalmente 'diante do vento', a formulação natural em português explicita o efeito evidente da imagem sem alterar seu sentido.
- source_word: וּמַלְאַךְ יְהוָה
  choice: enquanto o anjo de Yahweh
  rationale: מַלְאָךְ é traduzido como 'anjo' nesta expressão, e o nome divino é transliterado como 'Yahweh'. 'Enquanto' apresenta de modo idiomático a ação concomitante, preservando em nota a coordenação simples possível.
- source_word: דּוֹחֶה
  choice: os expulsa
  rationale: O particípio de דחה comunica ação continuada e vigorosa de impelir ou enxotar; 'expulsa' é natural e mantém a ideia de afastamento forçado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração representa diretamente o nome próprio presente no texto hebraico, sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: Neste sintagma bíblico recorrente, 'anjo' é a leitura contextual mais provável, sem definir além do texto a identidade teológica da figura.
- issue: Relação sintática introduzida por וּ
  choice: enquanto
  alternative: e
  rationale: A tradução principal expressa a simultaneidade entre a imagem da palha e a ação do anjo; a nota conserva a coordenação mais estritamente formal e a variação possível do particípio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão breve 'Sejam como...' conserva o tom de petição imprecatória; 'palha levada pelo vento' torna natural a imagem hebraica.
