  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: pt
  text: Desperta e ergue-te pelo meu direito[a], meu Deus e meu Senhor, pela minha causa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para o meu julgamento» ou «pela minha justiça»; o termo hebraico pode indicar julgamento, justiça ou decisão favorável num contexto judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou «pela minha disputa» ou «pelo meu caso»; o hebraico se refere a uma contenda ou causa judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Desperta
  rationale: Imperativo enfático dirigido a Deus, preservando a metáfora do despertar como apelo à intervenção divina.
- source_word: וְהָקִיצָה
  choice: e levanta-te
  rationale: Segundo verbo de despertar, usado em paralelo intensificador; a formulação distinta evita repetição rígida e comunica prontidão para agir.
- source_word: לְמִשְׁפָּטִי
  choice: para fazeres justiça por mim
  rationale: מִשְׁפָּט pode designar julgamento, justiça ou decisão favorável num contexto forense. A expressão portuguesa conserva a dimensão judicial e o interesse pessoal do salmista sem pressupor antecipadamente o veredito.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Forma possessiva em vocativo, traduzida diretamente.
- source_word: וַאדֹנָי
  choice: e meu Senhor
  rationale: Título divino de tratamento; «Senhor» é a forma reverente e corrente em português.
- source_word: לְרִיבִי
  choice: para defenderes a minha causa
  rationale: רִיב denota disputa, contenda ou causa judicial. «Defenderes a minha causa» expressa naturalmente o pedido de intervenção no litígio, sem restringi-lo a um processo formal moderno.
theological_decisions:
- issue: 'Dois títulos dirigidos a Deus: אֱלֹהַי וַאדֹנָי'
  choice: meu Deus e meu Senhor
  alternative: meu Deus e meu soberano
  rationale: Mantém os dois títulos reverenciais e o discurso direto a Deus, sem introduzir uma identificação cristológica específica no salmo.
- issue: Sentido forense de לְמִשְׁפָּטִי
  choice: para fazeres justiça por mim
  alternative: para o meu julgamento
  rationale: A opção preserva o pedido por ação judicial justa em favor do salmista, sem reduzir מִשְׁפָּט ao ato de julgá-lo nem tornar explícita uma absolvição que o termo apenas pode implicar no contexto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Os imperativos mantêm a urgência poética; a construção forense é expressa de modo natural, e os vocativos permanecem na posição central do hebraico.
