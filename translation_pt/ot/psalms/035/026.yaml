  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: pt
  text: Sejam envergonhados e humilhados todos juntos os que se alegram com o meu mal; sejam vestidos de vergonha e desonra os que se engrandecem contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que se exaltam sobre mim” ou “os que se vangloriam contra mim”. O hebraico fala literalmente de fazer-se grande sobre alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  choice: sejam envergonhados e humilhados
  rationale: Os imperfeitos têm força de pedido ou imprecação. A formulação preserva os dois termos hebraicos ligados à vergonha e expressa com naturalidade o resultado desejado.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Explicita que o grupo inteiro compartilha o mesmo destino, sem perder o valor adverbial de simultaneidade ou conjunto.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: os que se alegram com o meu mal
  rationale: רָעָה aqui designa o mal, dano ou desgraça que atinge o salmista, não uma maldade moral praticada por ele. A expressão portuguesa conserva essa amplitude contextual.
- source_word: יִלְבְּשׁוּ בֹשֶׁת וּכְלִמָּה
  choice: sejam vestidos de vergonha e desonra
  rationale: Mantém a metáfora hebraica de vestir-se de uma condição e diferencia os substantivos quase sinônimos, reforçando a humilhação pública.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: os que se engrandecem contra mim
  rationale: Preserva a imagem de fazer-se grande sobre ou contra alguém e comunica arrogância sem restringir o sentido apenas à fala ou à jactância.
theological_decisions:
- issue: Força imprecatória dos verbos
  choice: formas optativas com “sejam”
  alternative: formas descritivas no futuro, como “serão envergonhados”
  rationale: O contexto e a forma verbal favorecem um pedido dirigido a Deus, não uma simples previsão; a tradução conserva essa tensão sem suavizar a imprecação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi mantida próxima do paralelismo hebraico; “desonra” evita repetir “humilhação”, e “se engrandecem” preserva a imagem original.
