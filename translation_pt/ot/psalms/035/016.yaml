lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Entre os... profanos
  rationale: 'O termo derivado de חנף pode indicar pessoas profanas, ímpias ou hipócritas. “Profanos” expressa aqui a corrupção moral e religiosa sem restringir o sentido à falta de sinceridade; בְּ é entendido em sentido associativo ou locativo: “entre”.'
- source_word: לַעֲגֵי
  choice: zombadores
  rationale: O termo designa os que zombam ou escarnecem; “zombadores” é corrente, claro e preserva a hostilidade do contexto.
- source_word: מָעוֹג
  choice: num banquete
  rationale: A palavra é rara e de sentido incerto. Pode estar ligada a bolo, bocado ou a uma situação de banquete. No texto principal, “num banquete” comunica com naturalidade o possível ambiente social, e a nota preserva as alternativas lexicais.
- source_word: חָרֹק
  choice: eles rangem
  rationale: O verbo חרק descreve o ranger dos dentes como manifestação de hostilidade. A forma verbal finita produz uma frase natural em português.
- source_word: עָלַי
  choice: contra mim
  rationale: Com o ato hostil de ranger os dentes, “contra mim” é idiomático em português e mantém a força adversativa da preposição.
- source_word: שִׁנֵּימוֹ
  choice: os dentes
  rationale: O substantivo plural com sufixo de terceira pessoa masculina plural é representado naturalmente pela construção portuguesa “eles rangem os dentes”.
