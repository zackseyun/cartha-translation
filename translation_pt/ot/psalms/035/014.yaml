lexical_decisions:
- source_word: כְּרֵעַ כְּאָח לִי
  choice: como se ele fosse meu amigo, como se fosse meu irmão
  rationale: Os dois כ marcam comparações paralelas, e לִי exprime proximidade pessoal. A formulação portuguesa explicita o referente subentendido pelo contexto e mantém a intimidade de amigo e irmão.
- source_word: הִתְהַלָּכְתִּי
  choice: eu me comportava
  rationale: O hitpael de הלך pode indicar o modo habitual de alguém andar ou conduzir-se. Aqui, “me comportava” comunica naturalmente a maneira como o salmista tratava essa pessoa, sem limitar a imagem a deslocamento físico.
- source_word: כַּאֲבֶל אֵם
  choice: como quem chora a morte da mãe
  rationale: A expressão designa alguém em luto por uma mãe. “Chora a morte” torna claro em português atual o sentido fúnebre de אֲבֶל, enquanto o artigo definido expressa de modo idiomático a relação familiar implícita.
- source_word: קֹדֵר
  choice: sombrio
  rationale: O particípio sugere estar escurecido, abatido ou com aparência lúgubre. “Sombrio” preserva a imagem de escuridão e seu valor emocional, sem fundi-lo com a expressão distinta de luto pela mãe.
- source_word: שַׁחוֹתִי
  choice: eu me curvava
  rationale: O verbo descreve postura baixa ou encurvada, apropriada à aflição. O aspecto durativo em português harmoniza com o comportamento continuado descrito no verso.
