translation:
  language: pt
  text: Eu andava como se ele fosse meu amigo[a], como se fosse meu irmão; eu me curvava, sombrio[b], como quem está de luto pela mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Como amigo, como irmão para mim, eu andava”. O hebraico expressa grande proximidade pessoal.'
