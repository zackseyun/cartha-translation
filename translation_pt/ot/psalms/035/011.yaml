lexical_decisions:
- source_word: יְקוּמוּן
  choice: Levantam-se
  rationale: O verbo קום descreve as testemunhas surgindo ou tomando posição contra o salmista; “levantam-se” preserva a imagem e funciona naturalmente no contexto forense.
- source_word: עֵדֵי חָמָס
  choice: testemunhas violentas
  rationale: A expressão significa literalmente “testemunhas de violência”. “Testemunhas violentas” conserva a formulação compacta e a ideia de testemunho nocivo e injusto, sem restringi-la necessariamente à falsidade.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: sobre coisas que não conheço
  rationale: Como o hebraico não explicita o objeto da oração relativa, “coisas” é um complemento mínimo exigido pela naturalidade em português; “não conheço” preserva a alegação de desconhecimento do salmista.
- source_word: יִשְׁאָלוּנִי
  choice: interrogam-me sobre
  rationale: שׁאל pode significar perguntar, indagar ou exigir. No cenário hostil e forense, “interrogam-me” comunica perguntas acusatórias sem alterar o conteúdo delas.
