  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: pt
  text: Levantam-se testemunhas violentas[a]; perguntam-me sobre coisas que não conheço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testemunhas falsas” ou “testemunhas mal-intencionadas”; literalmente, em hebraico, “testemunhas de violência”.
