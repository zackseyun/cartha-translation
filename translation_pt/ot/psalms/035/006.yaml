source:
  edition: WLC
  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: pt
  text: Que o caminho deles seja escuro e escorregadio, com o anjo de Yahweh perseguindo-os.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o anjo de Yahweh os persiga”. A conjunção hebraica também pode indicar simples coordenação; no texto, “com” apresenta a perseguição como circunstância concomitante.'
    reason: alternativa sintática
lexical_decisions:
- source_word: יְהִי
  choice: Que ... seja
  rationale: A forma jussiva de היה expressa desejo ou imprecação. “Que ... seja” preserva naturalmente essa força volitiva em português.
- source_word: דַרְכָּם
  choice: o caminho deles
  rationale: דֶּרֶךְ pode indicar caminho literal ou modo de vida. “Caminho” mantém ambas as possibilidades e a imagem do salmo.
- source_word: חֹשֶׁךְ
  choice: escuro
  rationale: Embora o hebraico empregue o substantivo “escuridão”, o adjetivo predicativo é a forma natural em português e conserva a imagem de obscuridade e perigo.
- source_word: וַחֲלַקְלַקּוֹת
  choice: e escorregadio
  rationale: O substantivo plural designa lugares ou condições escorregadias. A formulação adjetiva concorda com “caminho” e comunica a imagem com clareza sem explicitação desnecessária.
- source_word: וּמַלְאַךְ יְהוָה
  choice: com o anjo de Yahweh
  rationale: A conjunção ו pode marcar simples coordenação ou circunstância concomitante. “Com” expressa de modo fluente a circunstância acompanhante, enquanto a nota preserva a leitura coordenada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רֹדְפָם
  choice: perseguindo-os
  rationale: O particípio de רדף descreve ação contínua de perseguir. “Perseguindo-os” preserva tanto o valor aspectual quanto o sentido hostil sem especificar além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Relação sintática entre o caminho perigoso e a perseguição pelo anjo
  choice: 'circunstância concomitante: “com o anjo de Yahweh perseguindo-os”'
  alternative: 'coordenação simples: “e o anjo de Yahweh os persiga”'
  rationale: A conjunção hebraica permite ambas as relações. A leitura circunstancial produz português natural sem eliminar a alternativa, que é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Que ... seja” mantém o tom imprecatório sem arcaísmo, e os adjetivos “escuro e escorregadio” reproduzem a imagem poética de maneira idiomática.
