  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: pt
  text: É melhor refugiar-se em Yahweh do que confiar em nobres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “príncipes”. O termo hebraico נְדִיבִים pode referir-se a nobres ou governantes de destaque; “príncipes” é a tradução tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo predicativo introduz uma comparação de vantagem; a construção portuguesa natural explicita o verbo copulativo.
- source_word: לַחֲסוֹת
  choice: refugiar-se
  rationale: O infinitivo de חסה expressa buscar ou tomar refúgio e, neste contexto, comunica proteção e dependência de modo conciso e natural.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica aquele em quem se busca refúgio, e o nome divino יהוה é transliterado como Yahweh.
- source_word: מִבְּטֹחַ
  choice: do que confiar
  rationale: A preposição מן tem valor comparativo, e o infinitivo de בטח significa confiar ou apoiar-se; a formulação preserva o paralelismo entre os infinitivos.
- source_word: בִּנְדִיבִים
  choice: em nobres
  rationale: נְדִיבִים pode designar nobres, príncipes ou pessoas de posição elevada; “nobres” preserva melhor a amplitude do termo no contraste com Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. “Refugiar-se” mantém a imagem hebraica, e “nobres” é amplamente compreensível sem restringir o referente a uma categoria monárquica específica.
