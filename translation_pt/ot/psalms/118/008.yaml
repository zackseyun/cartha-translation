  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: pt
  text: É melhor refugiar-se em Yahweh do que confiar no ser humano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no homem”, “na humanidade” ou “nas pessoas”; o hebraico emprega no singular um termo genérico para o ser humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo predicativo introduz uma avaliação comparativa; em português, “É melhor” forma uma oração completa e natural.
- source_word: לַחֲסוֹת
  choice: refugiar-se
  rationale: O infinitivo de חסה expressa a ação de buscar ou tomar refúgio. “Refugiar-se” preserva de modo conciso a imagem de proteção, sem reduzi-la apenas a confiança abstrata.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição indica aquele em quem se busca refúgio, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִבְּטֹחַ
  choice: do que confiar
  rationale: A construção מן com o infinitivo estabelece a comparação “melhor... do que”; “confiar” traduz naturalmente o sentido de בטח.
- source_word: בָּאָדָם
  choice: no ser humano
  rationale: אָדָם está no singular genérico e representa a humanidade em contraste com Yahweh. “Ser humano” mantém o singular representativo em português atual sem restringir a referência ao sexo masculino.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido genérico de אָדָם no contraste com Deus
  choice: ser humano
  alternative: homem; humanidade; pessoas
  rationale: O substantivo hebraico singular tem referência genérica. “Ser humano” comunica essa abrangência e conserva o contraste entre confiança em Yahweh e confiança no que é humano, sem resolver o singular em um plural.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa adequada à poesia sapiencial. “Refugiar-se” conserva a metáfora concreta, e “ser humano” oferece ampla legibilidade brasileira sem apagar o singular genérico do hebraico.
