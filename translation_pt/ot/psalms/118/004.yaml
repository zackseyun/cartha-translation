source:
  edition: WLC
  text: יֹֽאמְרוּ נָ֭א יִרְאֵ֣י יְהוָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: pt
  text: 'Digam agora os que temem Yahweh[a]: “Seu amor leal dura para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que reverenciam Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ נָא
  choice: Digam agora
  rationale: O imperfeito com força volitiva, reforçado por נָא, funciona como convocação litúrgica. “Digam agora” transmite de modo natural a exortação e sua urgência.
- source_word: יִרְאֵי יְהוָה
  choice: os que temem Yahweh
  rationale: A expressão designa os que reverenciam Yahweh. “Temem” preserva a formulação bíblica e inclui, no contexto, temor reverente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: introdução não explicitada
  rationale: Aqui כִּי introduz o conteúdo da declaração. Em português, os dois-pontos e a citação direta expressam essa função com naturalidade, sem exigir “pois” ou “que”.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica duração ilimitada; como a oração hebraica não traz verbo expresso, “dura” torna a frase idiomática em português.
- source_word: חַסְדּוֹ
  choice: Seu amor leal
  rationale: חֶסֶד reúne amor, lealdade e fidelidade relacional, frequentemente no âmbito da aliança. “Amor leal” preserva essa combinação sem reduzi-la apenas a misericórdia ou fidelidade.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino. “Yahweh” o representa diretamente e evita sua substituição por um título.
- issue: Amplitude de חֶסֶד
  choice: amor leal
  alternative: fidelidade à aliança; misericórdia
  rationale: “Amor leal” mantém juntos os aspectos afetivo e fiel do termo. A nota registra a dimensão de fidelidade à aliança sem transformar essa nuance na única interpretação possível.
translation_notes:
  register: Português moderno, claro e digno, com cadência litúrgica. A ordem “Digam agora” conserva a força convocatória; “os que temem Yahweh” mantém a expressão bíblica tradicional sem perder o sentido reverente.
