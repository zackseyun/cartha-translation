  text: אֶ֭בֶן מָאֲס֣וּ הַ/בּוֹנִ֑ים הָ֝יְתָ֗ה לְ/רֹ֣אשׁ פִּנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: pt
  text: A pedra que os construtores rejeitaram tornou-se a pedra angular[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cabeça do canto”.
    reason: lexical_alternative
  - marker: b
    text: Este versículo é citado mais tarde no Novo Testamento com referência ao Messias/Cristo; veja, por exemplo, Mateus 21:42; Atos 4:11; 1 Pedro 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: pedra
  rationale: O substantivo comum designa uma pedra; esta opção preserva a metáfora sem especificar indevidamente tamanho ou função.
- source_word: מָאֲסוּ
  choice: rejeitaram
  rationale: O verbo indica rejeitar ou recusar deliberadamente; a escolha se ajusta naturalmente à imagem da construção.
- source_word: הַבּוֹנִים
  choice: os construtores
  rationale: O particípio substantivado significa literalmente 'os que constroem'; 'os construtores' é claro, conciso e idiomático em português.
- source_word: הָיְתָה
  choice: tornou-se
  rationale: O perfeito hebraico descreve a mudança e o estado resultante. 'Tornou-se' expressa essa reversão de modo natural, sem impor uma referência temporal além do texto.
- source_word: לְרֹאשׁ פִּנָּה
  choice: a pedra angular
  rationale: A expressão significa literalmente 'cabeça de esquina/canto'. 'Pedra angular' é a equivalência arquitetônica tradicional e inteligível, enquanto a nota preserva a forma literal e sua possível amplitude.
theological_decisions:
- issue: Uso messiânico/cristológico do versículo em textos bíblicos posteriores
  choice: Manter no texto principal a metáfora arquitetônica em seu sentido direto, sem explicitar uma identificação messiânica.
  alternative: Traduzir ou ampliar o texto principal de modo a identificar a pedra diretamente com o Messias/Cristo.
  rationale: O hebraico apresenta uma imagem de rejeição seguida de exaltação ou vindicação, mas não identifica explicitamente a pedra. As citações do Novo Testamento podem ser registradas em nota sem substituir a formulação do salmo por sua aplicação posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase permanece próxima do hebraico, e a expressão idiomática 'pedra angular' é acompanhada da forma literal em nota.
