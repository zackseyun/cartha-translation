  text: עָזִּ֣/י וְ/זִמְרָ֣ת יָ֑הּ וַֽ/יְהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/014.yaml
  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: pt
  text: 'Yah[a] é a minha força e o meu cântico;

    ele se tornou a minha salvação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Yah”, forma abreviada do nome divino, e não a forma completa geralmente representada como “o SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: a minha força
  rationale: עֹז denota força ou poder. “A minha força” é natural em português e preserva a confissão pessoal do hebraico.
- source_word: וְזִמְרָת
  choice: e o meu cântico
  rationale: זִמְרָה, nesta expressão poética tradicional, indica canto. “Cântico” mantém o tom elevado e a ligação com Êxodo 15:2 e Isaías 12:2.
- source_word: יָהּ
  choice: Yah
  rationale: O texto traz a forma abreviada do nome divino, יָהּ, e não o tetragrama completo. A transliteração “Yah” conserva essa distinção e evita a ambiguidade que “Já” teria no português moderno.
- source_word: וַיְהִי
  choice: ele se tornou
  rationale: A forma de היה expressa aqui um resultado alcançado. “Ele se tornou” preserva a força verbal e identifica naturalmente Yah como sujeito, sem reduzir a expressão a uma simples cópula.
- source_word: לִי
  choice: minha
  rationale: Embora לִי seja literalmente “para mim”, a construção portuguesa “a minha salvação” comunica de modo idiomático a apropriação pessoal indicada pela preposição.
- source_word: לִישׁוּעָה
  choice: a minha salvação
  rationale: יְשׁוּעָה pode significar salvação, livramento ou vitória. “Salvação” mantém a amplitude do termo e se ajusta tanto ao contexto imediato de libertação quanto ao uso bíblico mais amplo.
theological_decisions:
- issue: Representação da forma abreviada do nome divino יָהּ
  choice: Yah
  alternative: o SENHOR
  rationale: A forma hebraica é o nome divino abreviado e poético, não יְהוָה. Preservá-la por transliteração representa com maior precisão a distinção existente no texto-fonte, sem assimilá-la silenciosamente ao título usado para o tetragrama completo.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Cântico” foi preferido a “canção” pelo registro bíblico-poético. O pronome “ele” explicita em português o sujeito naturalmente retomado do primeiro verso, sem alterar o referente do hebraico.
