  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: pt
  text: Isto veio de Yahweh[a]; é maravilhoso aos nossos olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isto foi da parte de Yahweh” ou “Isto aconteceu da parte de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é extraordinário aos nossos olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: de
  rationale: A construção marca fonte ou origem; “de” expressa isso de modo direto e natural em português, sem acrescentar a imagem de “mão”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָיְתָה זֹּאת
  choice: Isso veio
  rationale: O hebraico pode significar literalmente “isso foi/tem sido”; no contexto, “isso veio” comunica naturalmente que o acontecimento tem sua origem em Yahweh, sem excluir as alternativas indicadas em nota.
- source_word: הִיא
  choice: é
  rationale: O pronome independente retoma enfaticamente o acontecimento anterior. Em português, a elipse do sujeito em “é maravilhoso” soa natural e mantém a coesão.
- source_word: נִפְלָאת
  choice: maravilhoso
  rationale: O nifal de פלא descreve algo admirável, extraordinário ou que causa assombro; “maravilhoso” preserva o tom de louvor em linguagem corrente e digna.
- source_word: בְּעֵינֵינוּ
  choice: aos nossos olhos
  rationale: Preserva a expressão concreta do hebraico e a perspectiva compartilhada dos falantes, numa formulação idiomática em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; “Jeová” é uma forma tradicional alternativa.
- issue: Relação de Yahweh com o acontecimento
  choice: Isso veio de Yahweh
  alternative: Isso foi da parte de Yahweh; isso aconteceu por obra de Yahweh
  rationale: A formulação principal conserva a noção de fonte ou origem sem definir além do hebraico o modo preciso da ação divina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “aos nossos olhos” mantém o idioma hebraico sem causar estranheza. Os marcadores foram posicionados imediatamente após os trechos aos quais se referem.
