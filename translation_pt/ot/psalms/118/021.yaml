source:
  edition: WLC
  text: א֭וֹדְ/ךָ כִּ֣י עֲנִיתָ֑/נִי וַ/תְּהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: pt
  text: Eu te darei graças, pois me respondeste e te tornaste a minha salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu livramento”. O termo hebraico pode referir-se ao resgate numa situação concreta e também à salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אודך
  choice: Eu te darei graças
  rationale: O hifil de ידה expressa dar graças ou louvar. O futuro preserva a nuance prospectiva ou volitiva do imperfeito hebraico, enquanto a construção com objeto indireto é natural em português.
- source_word: כי
  choice: pois
  rationale: Aqui כי introduz a razão da ação de graças; “pois” comunica de modo claro e digno essa relação causal.
- source_word: עניתני
  choice: me respondeste
  rationale: A forma deriva de ענה no sentido de responder, e não do homônimo que significa afligir. A tradução mantém a linguagem bíblica natural da oração atendida.
- source_word: ותהי
  choice: e te tornaste
  rationale: O wayyiqtol de היה faz a sequência avançar e tem aqui sentido dinâmico; “te tornaste” preserva melhor essa força do que o estático “foste”.
- source_word: לי
  choice: a minha
  rationale: Embora לִי seja literalmente “para mim”, com “tornar-se” e “salvação” a formulação possessiva é idiomática e preserva a relação pessoal expressa no hebraico.
- source_word: לישועה
  choice: salvação
  rationale: יְשׁוּעָה pode indicar livramento concreto e também salvação em sentido mais amplo. “Salvação” preserva essa amplitude e a ressonância teológica do salmo.
theological_decisions:
- issue: Sentido de יְשׁוּעָה num salmo de livramento com ressonância teológica
  choice: salvação
  alternative: livramento
  rationale: “Salvação” abrange tanto o resgate na situação concreta quanto o alcance teológico mais amplo do termo, sem impor ao verso uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal e o pretérito mantêm um tom bíblico natural sem arcaísmo excessivo.
