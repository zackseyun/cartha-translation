  text: יֹֽאמַר נָ֥א יִשְׂרָאֵ֑ל כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: pt
  text: Que Israel diga agora:[a] “Seu amor leal[b] dura para sempre.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Israel diga: ‘Pois seu amor leal é para sempre.’” A palavra hebraica כִּי pode significar “pois”, “que” ou introduzir diretamente o conteúdo da confissão.'
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico חֶסֶד, que muitas vezes se refere a um amor constante e fiel, ligado à aliança. Conforme o contexto, também pode ser traduzido por “amor da aliança”, “bondade fiel” ou “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר
  choice: Que ... diga
  rationale: O imperfeito com valor jussivo, seguido do sujeito, expressa uma exortação. Em português, “Que Israel diga” comunica isso de modo natural e digno.
- source_word: נָא
  choice: agora
  rationale: Aqui a partícula reforça o chamado ou lhe dá urgência, em vez de indicar mera cortesia; “agora” se ajusta ao contexto litúrgico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio consagrado; no contexto, designa coletivamente o povo de Israel.
- source_word: כִּי
  choice: introdução do conteúdo por citação direta
  rationale: Neste refrão, כִּי pode introduzir o conteúdo da confissão. Os dois-pontos e a citação direta reproduzem essa função com naturalidade, sem eliminar a alternativa causal.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão indica duração indefinida ou perpétua. Com חֶסֶד, “dura para sempre” forma um refrão claro e natural.
- source_word: חַסְדּוֹ
  choice: Seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade constante, frequentemente no âmbito da aliança. “Amor leal” preserva essa amplitude melhor que termos mais estreitos ou arcaicos.
theological_decisions:
- issue: Tradução de חֶסֶד no refrão de louvor ligado à relação de Deus com Israel
  choice: amor leal
  alternative: misericórdia; amor da aliança; bondade fiel
  rationale: “Amor leal” comunica tanto a benevolência quanto a constância relacional de חֶסֶד, sem restringir o termo à compaixão nem inserir uma formulação doutrinária mais específica que o hebraico.
- issue: Função de כִּי na confissão de Israel
  choice: introdução do conteúdo da fala por citação direta
  alternative: 'valor causal: “pois”; valor completivo: “que”'
  rationale: A sintaxe admite mais de uma análise. O texto principal adota a leitura natural de conteúdo, enquanto a nota preserva explicitamente a possível força causal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção “Que Israel diga agora” conserva o tom de convocação litúrgica; “amor leal” evita tanto o arcaísmo de opções tradicionais quanto uma redução do campo semântico de חֶסֶד.
