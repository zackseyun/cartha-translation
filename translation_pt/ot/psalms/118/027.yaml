source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: pt
  text: Yahweh é Deus e nos deu luz.[a] Amarrem o sacrifício da festa[b] com cordas[c], até os chifres do altar.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e brilhou sobre nós”. O verbo hebraico pode indicar que Yahweh deu luz ao seu povo ou que brilhou sobre ele com favor.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a festa”. Aqui, muitos entendem a palavra como referência ao sacrifício oferecido na festa; outros entendem que a linha fala de uma procissão festiva.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “com cordas grossas”. Alguns interpretam a palavra como “ramos”, mas “cordas” é o sentido lexical mais provável.'
    reason: lexical_alternative
  - marker: d
    text: A expressão hebraica também pode ser entendida como “aos chifres do altar”, isto é, prendendo o sacrifício às projeções dos cantos do altar.
    reason: syntactic_alternative
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: Yahweh é Deus
  rationale: A oração nominal identifica Yahweh como Deus. A ordem em português expressa naturalmente a relação entre o nome divino e o predicativo, sem acrescentar um título intensificador.
- source_word: וַיָּאֶר לָנוּ
  choice: e nos deu luz
  rationale: O hifil de אור pode significar dar luz ou iluminar. A formulação é clara em português e mantém a imagem da luz, sem excluir a ideia de Yahweh ter brilhado favoravelmente sobre o povo.
- source_word: אִסְרוּ
  choice: Amarrem
  rationale: O imperativo plural de אסר significa amarrar ou prender. “Amarrem” é direto, corrente e concorda com o destinatário coletivo.
- source_word: חַג
  choice: o sacrifício da festa
  rationale: Embora חַג normalmente signifique festa ou festival, a combinação com “amarrar” e a referência ao altar favorecem o uso metonímico para a vítima sacrificial da festa. A nota preserva as outras leituras.
- source_word: בַּעֲבֹתִים
  choice: com cordas
  rationale: O substantivo denota normalmente cordas, possivelmente grossas. Essa acepção se ajusta naturalmente ao verbo “amarrar”; a interpretação “ramos” é registrada em nota.
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: até os chifres do altar
  rationale: “Até” representa עַד, e “chifres” conserva o termo cultual para as projeções nos cantos do altar. A construção incomum do hebraico é mantida sem decidir se as cordas eram presas diretamente aos chifres.
theological_decisions:
- issue: Referente cultual de חַג
  choice: Traduzir metonimicamente como “o sacrifício da festa”
  alternative: “a festa” ou “a procissão festiva”
  rationale: O altar e o verbo “amarrar” favorecem a referência à vítima sacrificial, mas o substantivo, por si só, normalmente designa a festa. A ambiguidade interpretativa é explicitada em nota, sem fazer dela uma conclusão doutrinária.
- issue: Imagem da luz em וַיָּאֶר לָנוּ
  choice: “nos deu luz”
  alternative: “brilhou sobre nós”
  rationale: A forma causativa apoia “deu luz”, enquanto o contexto também permite entender a luz como manifestação favorável de Yahweh. A nota conserva ambas as possibilidades.
- issue: Relação entre as cordas e os chifres do altar
  choice: Manter “até os chifres do altar”
  alternative: “aos chifres do altar”
  rationale: A preposição עַד indica limite ou alcance, mas o contexto pode sugerir que o sacrifício seja preso aos chifres. A tradução evita resolver silenciosamente essa dificuldade cultual e sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” translitera o nome divino; “chifres do altar” preserva a imagem técnica do culto bíblico. As notas registram as ambiguidades lexicais e sintáticas sem sobrecarregar o texto principal.
