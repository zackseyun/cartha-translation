  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: pt
  text: A mão direita de Yahweh está exaltada;[a] a mão direita de Yahweh realiza proezas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está erguida bem alto” ou “triunfa”. O verbo hebraico pode indicar elevação ou exaltação e, neste contexto, pode sugerir triunfo.
    reason: lexical_alternative
  - marker: b
    text: Ou “mostra seu poder”, “age poderosamente” ou “alcança a vitória”. A expressão hebraica traduzida por “realiza proezas” descreve uma ação poderosa ou vitoriosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: mão direita
  rationale: Preserva a imagem concreta do hebraico, que poeticamente representa força, poder e ação vitoriosa, sem substituí-la por uma abstração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רוֹמֵמָה
  choice: está exaltada
  rationale: Conserva o sentido de estar elevada ou ser exaltada e mantém a concordância com “mão direita”, sem restringir o verbo à ideia interpretativa de triunfo.
- source_word: עֹשָׂה חָיִל
  choice: realiza proezas
  rationale: Traduz de forma natural o idioma hebraico, que descreve ação poderosa, valorosa ou vitoriosa, preservando o tom triunfal do salmo.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter literalmente “mão direita” como imagem do poder e da intervenção vitoriosa de Yahweh.
  alternative: O poder de Yahweh está exaltado; Yahweh age poderosamente.
  rationale: A imagem concreta é central à poesia bíblica e conserva suas ressonâncias em outras passagens, sem reduzir a metáfora a uma formulação abstrata.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição poética de “a mão direita de Yahweh” foi preservada, bem como o paralelismo do verso.
