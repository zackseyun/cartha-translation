base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: pt
  text: Eles me cercaram, sim, cercaram-me; em nome de Yahweh, eu os eliminei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os repeli” ou “eu os cortei”. O verbo hebraico indica uma ação decisiva contra os inimigos, mas sua nuance exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי ... סְבָבוּנִי
  choice: Eles me cercaram, sim, cercaram-me
  rationale: Preserva a repetição enfática da raiz סבב e a imagem de cerco hostil; “sim” comunica aqui a força intensificadora de גַם em português natural.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Mantém a formulação hebraica, indicando que o salmista age invocando o nome, a autoridade e o poder de Yahweh.
- source_word: אֲמִילַם
  choice: eu os eliminei
  rationale: O hifil de מול neste refrão exprime ação decisiva contra os inimigos. “Eliminei” preserva essa força sem pressupor necessariamente a imagem específica de abatê-los com golpes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o nome pessoal divino. A transliteração “Yahweh” o distingue de um título e segue a orientação lexical fornecida, sem substituí-lo por “Senhor”.
- issue: Sentido da ação expressa por אֲמִילַם
  choice: eu os eliminei
  alternative: eu os repeli; eu os cortei
  rationale: A forma é lexicalmente difícil e admite diferentes nuances. O texto principal comunica uma ação decisiva, enquanto a nota preserva alternativas legítimas sem resolver além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição poética foi mantida, e a colocação pronominal variada evita artificialidade sem apagar o paralelismo.
