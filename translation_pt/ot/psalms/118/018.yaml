  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: pt
  text: Yah[a] me disciplinou severamente, mas não me entregou à morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Yah» é a forma poética abreviada do nome divino em hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: me disciplinou com rigor
  rationale: A construção com infinitivo absoluto antes do verbo intensifica a ação. “Com rigor” comunica essa ênfase em português natural, enquanto “disciplinou” preserva a nuance de correção sem limitar o sentido a punição.
- source_word: יָּהּ
  choice: Javé
  rationale: É a forma poética abreviada do nome divino. Em português, “Javé” identifica esse nome de modo claro e corrente; a nota registra a forma hebraica abreviada “Yah”.
- source_word: וְלַמָּוֶת
  choice: mas ... à morte
  rationale: No contexto, a conjunção introduz contraste entre a disciplina severa e o desfecho que não ocorreu. A preposição ל marca o destino ao qual o salmista não foi entregue.
- source_word: לֹא נְתָנָנִי
  choice: não me entregou
  rationale: נתן com objeto pessoal e ל + substantivo tem aqui o sentido idiomático de entregar alguém ao poder ou destino da morte.
theological_decisions:
- issue: Tradução da forma poética abreviada do nome divino יָהּ
  choice: Javé
  alternative: Yah; SENHOR
  rationale: “Javé” mantém a referência ao nome divino e é mais imediatamente compreensível ao leitor lusófono do que “Yah”. A nota preserva a distinção lexical de que o hebraico emprega a forma poética abreviada, sem transformar a escolha em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ritmo poético conciso. A formulação mantém a forte ênfase da primeira oração e o contraste com a preservação da morte.
