  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: pt
  text: Não morrerei, mas viverei e contarei os feitos de Yah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yah”, forma poética abreviada do nome divino; muitas traduções trazem, de modo mais geral, “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: Não morrerei
  rationale: A negação com o imperfeito qal na primeira pessoa expressa aqui uma declaração confiante voltada para o futuro.
- source_word: כִּי אֶחְיֶה
  choice: pelo contrário, viverei
  rationale: Neste paralelismo antitético, כִּי contrapõe viver a morrer; “pelo contrário” torna essa força adversativa clara e natural em português.
- source_word: וַאֲסַפֵּר
  choice: e contarei
  rationale: O piel de ספר indica narrar ou declarar; “contarei” é corrente e comunica a ideia de relatar os atos divinos.
- source_word: מַעֲשֵׂי
  choice: os feitos
  rationale: O plural construto designa ações ou obras; “feitos” conserva o peso poético e combina naturalmente com “contarei”.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma poética abreviada do nome divino, não um título; a transliteração preserva a distinção presente no hebraico.
theological_decisions:
- issue: Representação do nome divino יָהּ
  choice: Yah
  alternative: o SENHOR
  rationale: O texto traz a forma poética abreviada do nome divino. “Yah” preserva essa forma específica, enquanto “o SENHOR” a normalizaria como se fosse o tetragrama completo.
- issue: Relação expressa por כִּי
  choice: pelo contrário
  alternative: pois
  rationale: Embora כִּי possa ser causal, o contraste direto entre “não morrerei” e “viverei” favorece aqui a leitura adversativa, sem eliminar a tensão poética.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula realça o paralelismo antitético do verso.
