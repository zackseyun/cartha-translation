  source_fidelity: 'A declaração principal está bem traduzida: os imperfeitos expressam a confiança de que o salmista não morrerá, mas viverá. «Contarei os feitos de Yah» transmite adequadamente וַאֲסַפֵּר מַעֲשֵׂי־יָהּ. Contudo, «pelo contrário» torna a relação mais enfática e corretiva do que o hebraico exige; «mas» preserva de modo mais direto o contraste poético e também a ambiguidade possível de כִּי.'
