base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/025.yaml
  text: Please, LORD, save us now! Please, LORD, grant success now!
translation:
  language: pt
  text: Por favor, SENHOR, salva! Por favor, SENHOR, faz prosperar!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנָּא
  choice: Por favor
  rationale: A partícula expressa súplica enfática e cortês; «por favor» comunica com naturalidade o apelo urgente.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consagrada de representar o tetragrama por «SENHOR» em versaletes/maiúsculas.
- source_word: הוֹשִׁיעָה נָּא
  choice: salva-nos agora
  rationale: O hifil imperativo de ישׁע pede livramento; o objeto plural «nos» é tradicionalmente inferido pelo contexto e refletido na antiga recepção do clamor. Aqui נָּא reforça a urgência, bem expressa por «agora».
- source_word: הַצְלִיחָה נָּא
  choice: concede-nos êxito agora
  rationale: O hifil imperativo de צלח pede que Deus faça prosperar ou dê bom resultado; «concede-nos êxito» preserva essa causatividade sem restringi-la a prosperidade material.
theological_decisions:
- issue: Objeto implícito dos imperativos
  choice: Explicitar «nos» nas duas súplicas
  alternative: «salva» / «faz prosperar», sem objeto expresso
  rationale: Embora o hebraico não apresente sufixo pronominal explícito, o contexto comunitário do salmo e a recepção antiga sustentam a explicitação; ela também produz português idiomático sem impor um referente individual.
- issue: Sentido de הַצְלִיחָה
  choice: «concede-nos êxito»
  alternative: «faz-nos prosperar»
  rationale: «Êxito» mantém aberto o tipo de resultado pedido e evita uma leitura exclusivamente econômica de «prosperar».
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A repetição de «Por favor, SENHOR» reproduz a estrutura enfática do hebraico; «agora» comunica a força reiterada de נָּא em cada hemistíquio.
