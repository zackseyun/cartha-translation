  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: pt
  text: Bendito é aquele que vem em nome de Yahweh;[a][b][c] nós abençoamos vocês da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bendito o que vem em nome de Yahweh”. O particípio hebraico está no masculino singular.'
    reason: lexical_alternative
  - marker: b
    text: “Em nome de” também pode transmitir a ideia de “com a autoridade de” ou “como representante de”.
    reason: lexical_alternative
  - marker: c
    text: Mais tarde, o Novo Testamento cita este versículo em relação à entrada de Jesus em Jerusalém (por exemplo, Mt 21:9; Mc 11:9; Lc 19:38; Jo 12:13). A tradução do salmo, porém, não insere essa aplicação posterior em sua redação.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito
  rationale: Preserva a forma passiva/adjetival da fórmula hebraica de bênção, com redação tradicional e natural em português.
- source_word: הַבָּא
  choice: aquele que vem
  rationale: O particípio substantivado com artigo está no masculino singular. “Aquele que vem” é idiomático e mantém tanto o número quanto a força participial.
- source_word: בְּשֵׁם
  choice: em nome de
  rationale: Tradução transparente da expressão, que pode envolver autoridade ou representação sem obrigar uma explicitação interpretativa no texto principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּרַכְנוּכֶם
  choice: nós abençoamos vocês
  rationale: O perfeito na primeira pessoa do plural, com sufixo de segunda pessoa masculina plural, funciona naturalmente como declaração litúrgica performativa. “Vocês” torna explícito o objeto plural.
- source_word: מִבֵּית
  choice: desde a casa de
  rationale: “Desde” expressa a origem espacial da bênção e conserva “casa” sem explicitar interpretativamente “templo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Referência imediata ou messiânica de הַבָּא
  choice: Manter a fórmula litúrgica geral “aquele que vem” no texto principal
  alternative: Explicitar no texto uma identificação messiânica
  rationale: O salmo abençoa aquele que chega em nome de Yahweh. O uso posterior no Novo Testamento é relevante, mas não deve ser inserido na tradução do texto hebraico; a redação permanece compatível com essa aplicação posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o objeto plural; “casa de Yahweh” preserva a imagem hebraica e suas conotações cultuais.
