  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: pt
  text: 'Diga agora a casa de Arão[a]: “Pois o seu amor leal dura para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A sua fidelidade à aliança dura para sempre”. O hebraico חֶסֶד (ḥésed) pode indicar amor leal, misericórdia ou fidelidade à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Diga
  rationale: O imperfeito qal de terceira pessoa do plural tem força jussiva nesta convocação litúrgica. Em português, a concordância no singular com o sujeito coletivo “a casa de Arão” é natural e mantém o sentido exortativo.
- source_word: נָא
  choice: agora
  rationale: A partícula acrescenta urgência à convocação; “agora” comunica essa força de modo natural, sem o tom de cortesia de “por favor”.
- source_word: בֵית אַהֲרֹן
  choice: a casa de Arão
  rationale: Preserva o idiomatismo bíblico da expressão construta e sua referência coletiva à linhagem ou comunidade sacerdotal de Arão.
- source_word: כִּי
  choice: não expresso separadamente
  rationale: Aqui introduz o conteúdo da declaração. Em português, os dois-pontos e a citação direta tornam a relação clara; traduzir por “pois” poderia soar como explicação causal, estreitando indevidamente a função da partícula.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão adverbial significa “para sempre”. O verbo “dura”, suprido em português, forma uma declaração idiomática com חֶסֶד e expressa continuidade.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade, misericórdia e fidelidade no âmbito relacional e pactual. “Amor leal” conserva essa amplitude melhor do que opções que destacam apenas misericórdia ou fidelidade.
theological_decisions:
- issue: Tradução de חֶסֶד na fórmula de louvor da aliança
  choice: amor leal
  alternative: fidelidade à aliança; misericórdia; amor constante
  rationale: “Amor leal” mantém juntos o afeto e a firme lealdade de Deus, sem reduzir o termo exclusivamente a sentimento, compaixão ou obrigação jurídica. A nota registra uma alternativa explicitamente pactual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem “Diga agora a casa de Arão” conserva a cadência da convocação litúrgica. O pronome “seu” retoma Deus no contexto do salmo; a ambiguidade própria do pronome hebraico não é ampliada por explicitação do nome divino.
