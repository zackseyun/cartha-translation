  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: pt
  text: Você me empurrou com força[a] para que eu caísse, mas[b] Yahweh me ajudou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Empurrando, você me empurrou”, construção enfática que também pode ser traduzida por “você me empurrou violentamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e Yahweh me ajudou”. A conjunção hebraica pode significar simplesmente “e”, embora o contexto favoreça o sentido contrastivo “mas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: Você me empurrou com força
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. Em português corrente, “com força” transmite essa ênfase com naturalidade, sem reproduzir literalmente a repetição hebraica.
- source_word: לִנְפֹּל
  choice: para me fazer cair
  rationale: O infinitivo com ל pode indicar propósito ou resultado. A formulação explicita naturalmente em português o efeito pretendido do empurrão, sem eliminar essa flexibilidade contextual.
- source_word: וַיהוָה
  choice: mas Yahweh
  rationale: Embora ו possa significar simplesmente “e”, o contexto estabelece contraste entre a agressão sofrida e a ajuda divina; por isso, “mas” é a leitura principal.
- source_word: עֲזָרָנִי
  choice: me ajudou
  rationale: Tradução direta e natural do verbo עזר no perfeito com sufixo de primeira pessoa do singular.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino יהוה. “Yahweh” preserva no texto principal o nome pessoal, em vez de substituí-lo por um título.
- issue: Valor da conjunção ו antes do nome divino
  choice: mas
  alternative: e
  rationale: A conjunção hebraica admite “e”, mas aqui o contraste entre a tentativa de derrubar o salmista e a intervenção de Yahweh favorece “mas”, sem excluir a alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O pronome “você” torna explícita a segunda pessoa masculina singular do hebraico sem recorrer ao registro regional ou arcaizante de “tu”.
