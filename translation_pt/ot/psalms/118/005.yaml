  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: pt
  text: Da angústia clamei a Yah; Yah me respondeu num lugar amplo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do lugar apertado clamei a Yah; Yah me respondeu em amplidão”. O hebraico contrapõe a imagem de um espaço estreito à de um espaço amplo para expressar angústia e alívio; também pode sugerir liberdade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: Da angústia
  rationale: A expressão parte da imagem de um lugar apertado ou estreito e, por extensão, significa aflição ou angústia. A tradução comunica naturalmente o sentido, enquanto a nota preserva a imagem espacial.
- source_word: קָרָאתִי
  choice: clamei a
  rationale: No contexto de oração, o verbo indica invocar ou clamar a alguém. “Clamei a” é corrente, expressivo e mantém Yah como destinatário.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma poética abreviada do nome divino. A transliteração preserva sua forma específica e a repetição enfática do hebraico.
- source_word: עָנָנִי
  choice: me respondeu
  rationale: Reproduz diretamente o verbo “responder” com o sufixo de primeira pessoa.
- source_word: בַמֶּרְחָב
  choice: dando-me ampla liberdade
  rationale: מֶרְחָב designa amplidão ou um lugar espaçoso e, metaforicamente, alívio e liberdade. A preposição ב permite leitura locativa ou circunstancial/instrumental; esta formulação é natural em português e conserva a ideia de libertação da opressão sem eliminar a alternativa espacial, registrada na nota.
theological_decisions:
- issue: Tradução do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: O texto traz a forma poética abreviada do nome divino, não o tetragrama completo. “Yah” preserva essa distinção lexical e a repetição poética, sem impor uma interpretação denominacional.
- issue: Relação entre angústia e amplidão
  choice: Yah respondeu concedendo ampla liberdade
  alternative: Yah respondeu em/num lugar espaçoso ou conduzindo a um lugar amplo
  rationale: O hebraico mantém uma tensão entre linguagem espacial concreta e seu sentido figurado de alívio. O texto principal comunica o efeito em português natural, e a nota conserva a leitura espacial mais literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética concisa. “Angústia” torna claro o sentido figurado; “ampla liberdade” ecoa a oposição espacial. A nota apresenta a formulação concreta e preserva a ambiguidade da preposição hebraica.
