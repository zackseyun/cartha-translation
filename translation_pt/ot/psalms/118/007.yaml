translation:
  language: pt
  text: Yahweh está entre os que me ajudam[a]; e eu olharei para os que me odeiam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh está a meu favor entre os que me ajudam”. A construção hebraica pode destacar que Yahweh está com os ajudadores do salmista, em vez de apresentá-lo isoladamente como seu único ajudador.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “verei os que me odeiam” ou “verei, triunfante, o que acontecerá aos que me odeiam”. A expressão hebraica pode sugerir que o salmista verá a queda deles, mas não a declara explicitamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי בְּעֹזְרָי
  choice: está entre os que me ajudam
  rationale: Preserva o plural substantivado de עֹזְרָי e o sentido relacional da construção hebraica, sem reduzi-la ao singular “meu ajudador”.
- source_word: וַאֲנִי
  choice: e eu
  rationale: Em português, o pronome explícito diante do verbo flexionado conserva de modo natural a possível ênfase do pronome hebraico independente.
- source_word: אֶרְאֶה
  choice: olharei para
  rationale: Reproduz a construção de ראה com ב sem explicitar no texto principal a ideia contextual de triunfo ou queda dos adversários.
- source_word: בְשֹׂנְאָי
  choice: os que me odeiam
  rationale: Traduz naturalmente o particípio substantivado e mantém a referência específica a quem odeia o salmista, em vez do termo mais amplo “inimigos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem introduzir um título substitutivo.
- issue: Sentido de olhar para os que odeiam o salmista
  choice: 'manter a expressão aberta: “olharei para”'
  alternative: “verei a derrota dos que me odeiam”
  rationale: O contexto pode sugerir que o salmista verá a queda dos adversários, mas o objeto ou resultado visto não é declarado no hebraico; por isso, a tradução principal não o explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O paralelismo e a concisão poética foram preservados; os marcadores de nota aparecem junto às expressões correspondentes.
