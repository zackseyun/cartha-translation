  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: pt
  text: Abram para mim os portões da justiça[c]; entrarei por eles e darei graças a Yah[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “Yah”, forma abreviada do nome divino; algumas traduções trazem “o SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “louvarei Yah”. O verbo hebraico pode indicar agradecimento ou louvor, conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “os portões da retidão”. O substantivo hebraico pode ter o sentido de justiça ou retidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Abram
  rationale: Imperativo qal masculino plural de פתח; em português, “Abram” transmite diretamente a ordem dirigida a mais de uma pessoa.
- source_word: לִי
  choice: para mim
  rationale: A preposição ל com sufixo de primeira pessoa singular pode significar “para mim” ou “a mim”; com o verbo “abrir”, “para mim” é natural em português.
- source_word: שַׁעֲרֵי
  choice: os portões de
  rationale: Plural construto de שַׁעַר. “Portões” sugere entradas monumentais e se ajusta ao provável cenário litúrgico; o artigo definido torna natural a referência contextual.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange justiça, retidão e aquilo que é justo. “Justiça” é corrente e digna em português, sem eliminar a alternativa semântica “retidão”, registrada em nota.
- source_word: אָבֹא
  choice: entrarei
  rationale: Imperfeito qal de primeira pessoa singular de בוא; depois do imperativo, expressa a ação pretendida pelo falante. “Entrarei” é conciso e idiomático com portões.
- source_word: בָם
  choice: por eles
  rationale: A preposição ב com sufixo masculino plural indica aqui passagem através dos portões; “por eles” comunica esse movimento naturalmente.
- source_word: אוֹדֶה
  choice: darei graças a
  rationale: A forma de ידה neste contexto de culto pode indicar agradecimento ou louvor. “Darei graças a” representa diretamente o sentido de ação de graças, preservando “louvarei” como alternativa em nota.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ é a forma abreviada do nome divino. A transliteração “Yah” preserva a forma específica do hebraico, em vez de substituí-la por um título.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: O texto traz יָהּ, e não o tetragrama completo יהוה. A transliteração mantém essa distinção presente na fonte hebraica.
- issue: Amplitude semântica de צֶדֶק
  choice: justiça
  alternative: retidão
  rationale: O substantivo pode expressar justiça ou retidão. O texto principal usa “justiça”, enquanto a nota conserva a alternativa sem resolver indevidamente a nuance.
- issue: Sentido de ידה no contexto
  choice: darei graças a
  alternative: louvarei
  rationale: O verbo admite ação de graças e louvor. Neste enunciado litúrgico, “darei graças” é uma representação direta e natural, com a outra possibilidade indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Portões” preserva a dimensão arquitetônica de שַׁעֲרִים; “Yah” mantém a forma abreviada do nome divino. As notas aparecem junto aos termos a que se referem e preservam as ambiguidades lexicais genuínas.
