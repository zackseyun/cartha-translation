  language: en
  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: pt
  text: Tu és o meu Deus, e eu te darei graças[a]; meu Deus, eu te exaltarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu te louvarei”; neste contexto dos salmos, o verbo pode incluir tanto gratidão quanto louvor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu te enaltecerei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי
  choice: o meu Deus
  rationale: אֵל com sufixo de primeira pessoa do singular significa “meu Deus”; com אַתָּה, forma a oração nominal enfática “Tu és o meu Deus”.
- source_word: וְאוֹדֶךָ
  choice: e eu te darei graças
  rationale: O hifil de ידה, frequente nos salmos, expressa ação de graças e também pode abranger louvor. “Eu te darei graças” preserva o objeto de segunda pessoa.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: É uma segunda invocação pessoal, paralela a אֵלִי. A repetição de “meu Deus” conserva a devoção e o paralelismo do hebraico.
- source_word: אֲרוֹמְמֶךָ
  choice: eu te exaltarei
  rationale: A forma de רום comunica elevar ou enaltecer em linguagem de louvor. “Exaltarei” mantém a metáfora vertical e soa natural no registro poético.
theological_decisions:
- issue: Tradução dos títulos divinos אֵלִי e אֱלֹהַי
  choice: o meu Deus ... meu Deus
  alternative: meu Poderoso ... meu Deus
  rationale: As duas formas se dirigem pessoalmente ao Deus de Israel. Traduzir ambas por “meu Deus” preserva o paralelismo e evita introduzir uma distinção teológica que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “tu” acompanha a forma explícita e enfática אַתָּה; as formas verbais mantêm coerência com esse tratamento. A segunda oração preserva a invocação poética sem acrescentar uma segunda cópula ausente no hebraico.
