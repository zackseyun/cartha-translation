  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: pt
  text: Yahweh está a meu favor; não temerei. O que um ser humano pode me fazer?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “O que um ser humano me fará?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי
  choice: está a meu favor
  rationale: Neste contexto, a preposição com o sufixo de primeira pessoa comunica apoio e alinhamento; esta formulação é natural em português e mantém essa força.
- source_word: לֹא אִירָא
  choice: não temerei
  rationale: O imperfeito expressa confiança ou resolução diante do perigo, preservada pelo futuro conciso em português.
- source_word: מַה יַעֲשֶׂה לִי
  choice: o que ... pode fazer contra mim?
  rationale: A pergunta é retórica. O verbo modal «pode» explicita naturalmente em português a limitação humana sugerida pelo contexto, enquanto «contra mim» expressa a pessoa afetada por uma ação hostil.
- source_word: אָדָם
  choice: um ser humano
  rationale: O substantivo está no singular, mas tem sentido genérico. «Um ser humano» preserva tanto a singularidade quanto a referência inclusiva, evitando que «homem» seja entendido apenas como pessoa do sexo masculino.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração conserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Força retórica de מַה יַעֲשֶׂה
  choice: O que ... pode fazer?
  alternative: O que ... fará?
  rationale: A forma hebraica pode ser vertida literalmente com futuro, mas no contexto a pergunta afirma a limitação do poder humano. «Pode» comunica essa força retórica sem eliminar a leitura formal, registrada em nota.
- issue: Sentido genérico de אָדָם
  choice: um ser humano
  alternative: o homem
  rationale: A escolha mantém o singular genérico e o contraste entre Yahweh e qualquer mortal, sem restringir indevidamente a referência ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A estrutura breve e confiante do paralelismo hebraico foi preservada; «está a meu favor» evita a possível ambiguidade de «é por mim».
