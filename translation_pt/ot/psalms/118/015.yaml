  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: pt
  text: 'Nas tendas dos justos ouvem-se brados de júbilo e de salvação:[a]


    “A mão direita de Yahweh realiza feitos poderosos!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vitória” ou “livramento”, em vez de “salvação”.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica; também pode ser traduzida por “age com poder”, “age valorosamente” ou “realiza grandes feitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  choice: ressoa a voz de júbilo
  rationale: קוֹל indica voz ou som, e רִנָּה, um brado jubiloso. A formulação portuguesa conserva tanto o caráter audível quanto a celebração e evita sugerir apenas alegria interior.
- source_word: וִֽישׁוּעָ֗ה
  choice: salvação
  rationale: יְשׁוּעָה abrange salvação, livramento e vitória. “Salvação” mantém a amplitude do termo no contexto da intervenção salvadora de Yahweh; as nuances alternativas ficam registradas em nota.
- source_word: בְּ/אָהֳלֵ֥י
  choice: nas tendas
  rationale: Preserva a imagem concreta do plural construto de אֹהֶל, sem substituí-la por “moradas” ou “lares”.
- source_word: צַדִּיקִ֑ים
  choice: dos justos
  rationale: O adjetivo substantivado designa aqueles que são justos; “os justos” é natural e mantém a categoria ético-religiosa do hebraico.
- source_word: יְמִ֥ין יְ֝הוָה
  choice: A mão direita de Yahweh
  rationale: Mantém a metáfora corporal tradicional da ação poderosa e salvadora de Deus e translitera diretamente o nome divino.
- source_word: עֹ֣שָׂה חָֽיִל
  choice: realiza feitos poderosos
  rationale: A expressão idiomática significa agir com força, demonstrar poder ou obter êxito. Esta tradução comunica o sentido em português natural sem restringi-lo exclusivamente à valentia militar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título; “Javé” é uma adaptação portuguesa possível, mas não foi adotada.
- issue: Sentido de יְשׁוּעָה no contexto de celebração
  choice: salvação
  alternative: vitória; livramento
  rationale: O termo pode designar resgate, libertação ou vitória. “Salvação” conserva sua amplitude e ressonância teológica, enquanto a nota preserva as possibilidades contextuais mais concretas.
- issue: Força da expressão עֹשָׂה חָיִל
  choice: realiza feitos poderosos
  alternative: age com poder; demonstra valentia
  rationale: A expressão celebra a ação eficaz e poderosa de Yahweh. A tradução não decide indevidamente entre força, valentia e resultado vitorioso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial foi ajustada para fluidez, preservando a localização “nas tendas dos justos”. “Voz de júbilo” mantém o elemento vocal de רִנָּה; “ressoa” torna natural a construção existencial do hebraico. As aspas apresentam a aclamação ouvida nas tendas, sem impor uma análise sintática além do que o contexto permite.
