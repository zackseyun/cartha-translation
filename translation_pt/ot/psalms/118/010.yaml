base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/010.yaml
  text: All the nations surrounded me; in the name of the LORD, I surely cut them off.
translation:
  language: pt
  text: Todas as nações me cercaram; em nome do SENHOR, certamente as eliminarei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico pode exprimir uma ação decidida ou futura: «certamente as eliminarei». O verbo tem o sentido de cortar fora, eliminar; não especifica o modo.'
    reason: Registra a nuance modal do imperfeito hebraico e o alcance figurado do verbo sem impor uma leitura temporal retrospectiva.
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Todas as nações
  rationale: Reproduz de modo direto a abrangência de כָּל e o sentido coletivo de גּוֹיִם.
- source_word: סְבָבוּנִי
  choice: me cercaram
  rationale: Expressa o cerco hostil indicado pelo verbo סבב com o sufixo de primeira pessoa.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome do SENHOR
  rationale: Preserva a fórmula hebraica e representa o Tetragrama segundo a convenção portuguesa amplamente reconhecida.
- source_word: כִּי אֲמִילַם
  choice: certamente as destruí
  rationale: Entende כִּי como partícula enfática neste refrão e אֲמִילַם como forma derivada de מול, usada aqui no sentido figurado de eliminar ou destruir. O perfeito em português mantém a leitura retrospectiva do contexto, embora a forma hebraica possa admitir valor volitivo ou prospectivo.
theological_decisions:
- issue: Força de כִּי e valor temporal/modal de אֲמִילַם
  choice: certamente as destruí
  alternative: eu as destruirei / que eu as elimine
  rationale: A tradução mantém a afirmação enfática adotada no texto de consulta e é coerente com a recordação de livramento no salmo, sem atribuir à expressão uma doutrina denominacional. A ambiguidade morfológica relevante é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do paralelismo hebraico. O marcador [a] deve acompanhar a expressão comentada no texto principal.
