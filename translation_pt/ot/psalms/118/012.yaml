  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: pt
  text: Cercaram-me como abelhas; apagaram-se como fogo de espinheiros.[a] Em nome de Yahweh, certamente os abaterei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram extintos como fogo de espinheiros”. O hebraico comprime a imagem, comparando os inimigos ao fogo de espinheiros, que arde rapidamente e logo se apaga.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente os cortarei”. O verbo hebraico pode significar “cortar” ou “abater”.'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: Cercaram-me
  rationale: O verbo סבב descreve o ato de rodear ou cercar; “cercaram-me” é natural em português e mantém a ideia de cerco hostil.
- source_word: כִדְבוֹרִים
  choice: como abelhas
  rationale: A preposição כְּ introduz uma comparação e preserva a imagem vívida de um enxame.
- source_word: דֹּעֲכוּ
  choice: apagaram-se
  rationale: O verbo דּעך denota apagar-se ou extinguir-se, sobretudo em referência ao fogo. A forma pronominal é idiomática em português e conserva a imagem da chama que cessa.
- source_word: כְּאֵשׁ קוֹצִים
  choice: como fogo de espinheiros
  rationale: A expressão hebraica compara os inimigos ao fogo alimentado por espinheiros, que se inflama intensamente e logo se apaga. “Fogo de espinheiros” mantém a construção compacta e a metáfora.
- source_word: בְּשֵׁם יְהוָה
  choice: Em nome de Yahweh
  rationale: A expressão indica ação mediante invocação ou sob a autoridade de Yahweh; “em nome de” é a formulação portuguesa corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: certamente
  rationale: Neste refrão, כִּי tem força asseverativa ou enfática; “certamente” comunica essa confiança sem introduzir uma relação causal artificial.
- source_word: אֲמִילַם
  choice: os eliminei
  rationale: A forma causativa de מול pode significar cortar fora, suprimir ou eliminar. “Eliminei” é português natural e comunica o resultado da ação, enquanto a nota registra a alternativa mais concreta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem trocá-lo por um título.
- issue: Valor temporal de אֲמִילַם
  choice: os eliminei
  alternative: eu os eliminarei
  rationale: O yiqtol pode ser entendido como ação narrada com confiança consumada ou como declaração futura de resolução. O contexto poético e a camada de consulta favorecem o passado, mas a nota preserva a possibilidade futura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo poético do hebraico foram preservados sem tornar a frase excessivamente literal.
