source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças a Yahweh, porque ele é bom, porque o seu amor leal dura para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “porque para sempre é o seu amor leal”. O hebraico não traz um verbo correspondente a “dura”.'
    reason: literal_rendering
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil convida a comunidade a agradecer ou louvar. “Deem graças” comunica de modo claro o sentido de ação de graças e conserva o caráter litúrgico do refrão.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da ação de graças, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no hebraico.
- source_word: כִּי טוֹב
  choice: porque ele é bom
  rationale: כִּי introduz o motivo da ação de graças. O pronome e o verbo de ligação, implícitos no hebraico, são expressos para produzir português natural.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão indica duração indefinida ou perpétua. “Para sempre” é a formulação portuguesa natural e consagrada para este refrão.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e fidelidade comprometida. “Amor leal” preserva essa amplitude melhor do que apenas “misericórdia”, sem tornar explícita uma referência à aliança que o termo, isoladamente, não exige.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde de modo provável à pronúncia antiga, sem substituí-lo por um título.
- issue: Predicação nominal em לְעוֹלָם חַסְדּוֹ
  choice: o seu amor leal dura para sempre
  alternative: para sempre é o seu amor leal
  rationale: O hebraico não contém um verbo equivalente a “durar”; a tradução o acrescenta para formar uma frase portuguesa idiomática. A nota registra a construção mais literal e evita apresentar a expansão verbal como se fosse explícita no original.
translation_notes:
  register: Português atual, digno e acessível, com imperativo plural brasileiro (“Deem”) e cadência adequada a um refrão litúrgico. A repetição de “porque” reproduz o paralelismo dos dois כִּי hebraicos.
