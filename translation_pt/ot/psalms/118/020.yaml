  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: pt
  text: Esta é a porta de Yahweh[a]; os justos entrarão por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a porta para Yahweh» ou «a porta destinada a Yahweh». A preposição hebraica pode indicar relação, pertencimento ou direção; «de Yahweh» parece ajustar-se melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Esta é
  rationale: O pronome demonstrativo identifica a porta apontada; em português, a cópula «é» é necessária para formar uma oração natural.
- source_word: הַשַּׁעַר
  choice: a porta
  rationale: שַׁעַר designa uma porta ou portal. «Porta» preserva a imagem concreta e se ajusta ao provável contexto de entrada processional ou cultual.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: A preposição לְ pode indicar relação, pertencimento ou direção. «De Yahweh» expressa naturalmente a associação da porta com Yahweh, sem eliminar em nota as outras possibilidades.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo substantivado no plural se refere às pessoas caracterizadas pela justiça; «os justos» é claro, corrente e preserva seu sentido moral e teológico.
- source_word: יָבֹאוּ
  choice: entrarão
  rationale: O imperfeito qal de בוא pode, neste contexto, indicar ação futura ou certeza modal. «Entrarão» é idiomático em relação a uma porta.
- source_word: בוֹ
  choice: por ela
  rationale: A preposição בְּ com o sufixo masculino retoma שַׁעַר. Em português, passa-se «por» uma porta; o pronome feminino concorda naturalmente com «porta».
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome divino pessoal e segue a orientação editorial fornecida, sem substituí-lo por um título.
- issue: Relação expressa por לְ em לַיהוָה
  choice: porta de Yahweh
  alternative: porta para Yahweh; porta destinada a Yahweh
  rationale: A construção admite relação, pertencimento ou direção. O texto principal usa a formulação portuguesa mais natural no contexto, enquanto a nota conserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe concisa acompanha o paralelismo do hebraico; «entrarão por ela» é a forma idiomática em português sem perder a imagem concreta da porta.
