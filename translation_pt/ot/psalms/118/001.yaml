id: PSA.118.1
reference: Psalms 118:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças a Yahweh[a], porque ele é bom, porque o seu amor leal dura para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “a sua lealdade à aliança dura para sempre”. O termo hebraico חֶסֶד inclui as ideias de amor, bondade e lealdade constante, especialmente no contexto de uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil, neste refrão litúrgico, pede que a comunidade expresse gratidão e louvor; “Deem graças” comunica essa força de modo natural e direto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz o nome divino יהוה. “Yahweh” o representa como nome próprio, sem substituí-lo por um título tradicional.
- source_word: כִּי
  choice: porque
  rationale: Nas duas ocorrências, כִּי introduz o motivo para dar graças. A repetição de “porque” preserva a estrutura e a cadência do hebraico.
- source_word: טוֹב
  choice: bom
  rationale: “Bom” traduz diretamente o adjetivo e mantém toda a amplitude da afirmação sobre a bondade de Deus.
- source_word: לְעוֹלָם
  choice: dura para sempre
  rationale: A expressão significa literalmente “para sempre”. Em português, “dura para sempre” forma uma oração natural com חַסְדּוֹ sem perder a ideia de permanência.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade constante, muitas vezes em contexto de aliança. “Amor leal” preserva essa riqueza melhor que opções mais estreitas como “misericórdia”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O versículo emprega diretamente o Tetragrama. A forma “Yahweh” preserva o caráter de nome próprio, enquanto a nota registra a tradução reverencial tradicional.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: lealdade à aliança; misericórdia; amor constante
  rationale: A expressão celebra a benevolência fiel e duradoura de Deus. “Amor leal” mantém juntas as dimensões afetiva e relacional sem restringir o termo a uma única formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural facilmente compreensível. A repetição de “porque” conserva o paralelismo e a cadência litúrgica do hebraico.
