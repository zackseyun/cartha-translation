  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: pt
  text: Este é o dia que Yahweh fez; alegremo-nos e exultemos nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Este é o dia
  rationale: O demonstrativo זֶה, seguido do substantivo definido הַיּוֹם, identifica enfaticamente um dia específico. A cópula «é», implícita no hebraico, é necessária para uma formulação natural em português.
- source_word: עָשָׂה
  choice: fez
  rationale: O qal perfeito de עשה descreve a ação divina como realizada. «Fez» mantém a concisão do hebraico e é natural com «dia» como objeto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: נָגִילָה
  choice: alegremo-nos
  rationale: O coortativo na primeira pessoa do plural expressa exortação conjunta; «alegremo-nos» transmite essa força volitiva.
- source_word: וְנִשְׂמְחָה
  choice: e exultemos
  rationale: O segundo coortativo coordenado reforça a alegria. «Exultemos» evita mera repetição e preserva, de modo natural, a combinação de dois verbos afins no hebraico.
- source_word: בּוֹ
  choice: nele
  rationale: A preposição ב com sufixo masculino singular retoma naturalmente «o dia», também masculino em português. «Nele» preserva a formulação metafórica do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Referente de בּוֹ
  choice: o dia («nele»)
  alternative: o próprio Yahweh («nele»), leitura gramaticalmente possível em isolamento
  rationale: O antecedente imediato e contextualmente mais natural é הַיּוֹם, «o dia». A tradução não introduz uma referência pessoal que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura breve e celebrativa do verso foi preservada; «alegremo-nos e exultemos» mantém o paralelismo verbal sem soar excessivamente arcaico.
