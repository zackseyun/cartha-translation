reference: Psalms 60:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: pt
  text: Deus falou em sua santidade:[a] “Eu exultarei;[b] repartirei Siquém e medirei o vale de Sucote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seu lugar santo” ou “por sua santidade”. A expressão hebraica pode indicar a própria santidade de Deus ou a esfera de sua presença santa.'
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem “Eu exultarei” como a resposta do salmista à fala de Deus, e não como parte da própria declaração divina.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo singular דִּבֶּר mostra que se refere ao único Deus de Israel.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta a declaração divina como um ato concluído; o pretérito perfeito é direto e natural em português.
- source_word: בְּקָדְשׁוֹ
  choice: em sua santidade
  rationale: Preserva a concisão e a ambiguidade do hebraico entre a santidade de Deus e a esfera de sua presença santa, sem especificar indevidamente um santuário.
- source_word: אֶעְלֹזָה
  choice: Eu exultarei
  rationale: Expressa alegria intensa e triunfante, mantendo o tom elevado do oráculo.
- source_word: אֲחַלְּקָה
  choice: repartirei
  rationale: No contexto territorial, indica dividir ou distribuir uma região; 'repartirei' é natural e conserva essa ideia.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo hebraico.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: o vale de Sucote
  rationale: Traduz a cadeia construta geográfica e usa uma transliteração portuguesa clara do topônimo.
- source_word: אֲמַדֵּד
  choice: medirei
  rationale: Mantém a imagem literal de medir o território, com a implicação contextual de delimitá-lo ou distribuí-lo.
theological_decisions:
- issue: Mudança de locutor e extensão da citação
  choice: As três formas na primeira pessoa são apresentadas como continuação da fala direta de Deus.
  alternative: O salmista diz 'Eu exultarei' em resposta à fala de Deus, e a declaração divina começa em 'repartirei Siquém'.
  rationale: A sequência pode ser lida naturalmente como um oráculo divino no qual Deus reivindica soberania sobre o território. Contudo, a sintaxe hebraica não elimina a possibilidade de que 'Eu exultarei' seja a resposta do salmista; a nota preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e formas toponímicas correntes. A tradução mantém a linguagem territorial concreta e sinaliza, em notas, as ambiguidades genuínas do hebraico.
