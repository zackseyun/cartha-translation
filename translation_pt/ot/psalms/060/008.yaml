base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: pt
  text: Moabe é a minha bacia de lavar[a]; sobre Edom lanço a minha sandália; sobre mim, Filístia, grite em triunfo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «bacia de lavar» também é traduzido por «vaso de lavar». A imagem comunica humilhação e sujeição.
    reason: lexical_alternative
  - marker: b
    text: 'A forma hebraica é difícil. O texto massorético pode ser entendido como um imperativo dirigido à Filístia: «Sobre mim, Filístia, grite em triunfo». Uma tradução tradicional entende a linha como uma declaração na primeira pessoa: «Sobre a Filístia levanto um grito de triunfo».'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: minha bacia de lavar
  rationale: סִיר designa um recipiente ou bacia, e רַחְצִי especifica seu uso para lavagem. «Bacia de lavar» é concreto e natural em português moderno, preservando a imagem humilhante de sujeição.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: lanço a minha sandália
  rationale: O hifil de שלך significa lançar ou atirar, e נַעַל designa calçado. «Sandália» corresponde melhor ao contexto antigo, enquanto «lanço» mantém o tom poético e elevado.
- source_word: עַל אֱדוֹם
  choice: sobre Edom
  rationale: עַל conserva aqui a imagem espacial de lançar a sandália sobre Edom como sinal de domínio. «Sobre» é direto e idiomático em português.
- source_word: עָלַי פְּלֶשֶׁת
  choice: sobre a Filístia ... por mim
  rationale: A construção com preposição e sufixo de primeira pessoa é difícil. No contexto, a Filístia é o domínio sobre o qual se levanta o brado, e o sufixo é representado naturalmente por «por mim» junto ao imperativo seguinte.
- source_word: הִתְרֹעָעִי
  choice: grite em triunfo
  rationale: A forma feminina singular de רוע comunica um brado forte, frequentemente de triunfo ou batalha. O imperativo concorda com a Filístia entendida como terra ou nação feminina e pode ter força irônica.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moabe / Edom / Filístia
  rationale: Empregam-se as formas toponímicas consagradas e amplamente reconhecidas em português; «Filístia» designa a terra ou nação, não simplesmente o povo filisteu.
theological_decisions:
- issue: Força do imperativo הִתְרֹעָעִי dirigido à Filístia
  choice: 'Comando irônico de sujeição: «sobre a Filístia, grite em triunfo por mim»'
  alternative: «Sobre a Filístia levanto um grito de triunfo», entendendo a forma como declaração na primeira pessoa mediante leitura ou vocalização alternativa.
  rationale: A vocalização massorética indica um imperativo feminino singular, gramaticalmente dirigido à Filístia. No contexto de domínio sobre nações inimigas, provavelmente é uma ordem irônica que sinaliza submissão. A tradução mantém o texto massorético e registra a leitura tradicional alternativa em nota, sem eliminar a tensão.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética concisa. «Bacia de lavar» evita um termo arcaico; «lanço» e «em triunfo» preservam a elevação do verso. Os marcadores aparecem no texto junto às expressões que explicam.
