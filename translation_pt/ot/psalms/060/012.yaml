  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: pt
  text: Com Deus, realizaremos grandes feitos, e ele pisoteará os nossos adversários.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Com Deus
  rationale: A preposição ב pode indicar associação ou meio. “Com Deus” é natural em português, expressa dependência do auxílio divino e preserva a possível nuance instrumental sem a restringir.
- source_word: נַעֲשֶׂה חָיִל
  choice: realizaremos grandes feitos
  rationale: A combinação idiomática de עשה com חַיִל comunica agir com força ou realizar proezas. Esta formulação reproduz o sentido do conjunto em português corrente e digno.
- source_word: וְהוּא
  choice: e ele
  rationale: 'Mantém tanto a coordenação introduzida por ו quanto a presença enfática do pronome independente: o povo age com Deus, e ele próprio derrota os adversários.'
- source_word: יָבוּס
  choice: pisoteará
  rationale: O verbo בוס descreve o ato de pisar ou calcar sob os pés. “Pisoteará” conserva a imagem marcial vívida sem substituí-la pela interpretação mais abstrata “derrotará”.
- source_word: צָרֵינוּ
  choice: os nossos adversários
  rationale: O termo designa inimigos ou oponentes. “Adversários” corresponde bem à amplitude lexical e se ajusta ao contexto militar e poético.
theological_decisions:
- issue: Agência na vitória
  choice: Preservar lado a lado a ação humana (“realizaremos grandes feitos”) e a ação divina decisiva (“ele pisoteará”).
  alternative: Enfatizar exclusivamente a vitória humana ou atribuir toda ação apenas a Deus.
  rationale: 'O hebraico mantém ambas as afirmações em tensão: o povo age com Deus, enquanto Deus subjuga os adversários. A tradução não dissolve essa relação.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso mantém o paralelismo poético, a concisão e a imagem concreta do hebraico. Não se acrescentou nota porque “Com Deus” preserva adequadamente a amplitude associação/meio, e “pisoteará” traduz diretamente a imagem verbal.
