  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: pt
  text: Para que os teus amados sejam livrados[a], salva com a tua mão direita e responde-nos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam resgatados”.'
