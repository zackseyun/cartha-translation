lexical_decisions:
- source_word: לְמַעַן
  choice: Para que
  rationale: Introduz a finalidade ou o resultado desejado e mantém de modo natural a força da expressão hebraica.
- source_word: יֵחָלְצוּן
  choice: sejam livrados
  rationale: O nifal de חלץ comunica a ideia de ser retirado do perigo ou resgatado; “sejam livrados” é claro no contexto de súplica e não especifica indevidamente a natureza do perigo.
- source_word: יְדִידֶיךָ
  choice: os teus amados
  rationale: Preserva o plural e o sentido afetivo do termo hebraico, sem acrescentar uma identificação doutrinária específica.
- source_word: הוֹשִׁיעָה
  choice: salva
  rationale: O imperativo hifil de ישׁע expressa um pedido direto pela ação salvadora de Deus; “salva” é conciso e natural em uma oração.
- source_word: יְמִינְךָ
  choice: com a tua mão direita
  rationale: Mantém a imagem antropomórfica hebraica e entende a expressão como o meio pelo qual Deus salva.
- source_word: ו/ענ/נו
  choice: e responde-nos
  rationale: A forma apresentada no texto-fonte traz o sufixo de primeira pessoa do plural, sustentando “responde-nos” e harmonizando com a dimensão comunitária da súplica.
theological_decisions:
- issue: Imagem da mão direita divina
  choice: Manter “com a tua mão direita”
  alternative: Parafrasear como “com o teu poder”
  rationale: A imagem concreta faz parte da poesia e da teologia do texto; preservá-la evita reduzir a metáfora a uma abstração.
- issue: Sufixo pronominal no pedido final
  choice: “responde-nos” no texto principal
  alternative: “responde-me”
  rationale: O texto hebraico fornecido sustenta a leitura plural. A leitura singular é preservada em nota por estar representada em algumas tradições ou interpretações textuais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo da súplica, o plural de “amados” e a imagem poética da mão direita, evitando linguagem excessivamente técnica ou denominacional.
