base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: pt
  text: Gileade é meu, e Manassés é meu; Efraim é a defesa da minha cabeça; Judá é meu cetro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu legislador” ou “meu bastão de comando”. O termo hebraico pode designar aquele que decreta ou o bastão/cetro que simboliza o governo.
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: é meu
  rationale: A preposição com sufixo de primeira pessoa expressa posse; a cópula implícita é naturalmente explicitada em português.
- source_word: גִלְעָד
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida em português para o nome geográfico.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma portuguesa tradicional do nome tribal e regional.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma portuguesa tradicional do nome tribal.
- source_word: מָעוֹז
  choice: fortaleza
  rationale: O substantivo designa lugar ou fonte de força e proteção; “fortaleza” conserva a imagem militar e política.
- source_word: רֹאשִׁי
  choice: da minha cabeça
  rationale: A tradução formal preserva a metáfora concreta e sua ambiguidade, sem explicar se a ideia é proteção, poder ou preeminência.
- source_word: מְחֹקְקִי
  choice: meu cetro
  rationale: No contexto de imagens territoriais, militares e régias, “cetro” comunica de modo natural o símbolo da autoridade de governo; a possibilidade pessoal, “meu legislador”, fica registrada em nota.
theological_decisions:
- issue: Sentido régio de מְחֹקְקִי
  choice: meu cetro
  alternative: meu legislador; meu bastão de governante
  rationale: O termo pode indicar quem decreta ou o bastão que simboliza o governo. “Cetro” preserva a imagem da autoridade régia e a coerência do paralelismo sem impor uma leitura constitucional mais estreita.
- issue: Metáfora מָעוֹז רֹאשִׁי
  choice: a fortaleza da minha cabeça
  alternative: uma fortaleza para a minha cabeça; a força da minha cabeça
  rationale: A construção escolhida acompanha de perto o hebraico e conserva sua metáfora incomum, em vez de resolver silenciosamente a relação exata entre Efraim, fortaleza e cabeça.
translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos consagrados. A sintaxe mantém o paralelismo poético e a metáfora deliberadamente compacta do hebraico.
