  text: נָ֘תַ֤תָּה לִּ/ירֵאֶ֣י/ךָ נֵּ֭ס לְ/הִתְנוֹסֵ֑ס מִ֝/פְּנֵ֗י קֹ֣שֶׁט סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/004.yaml
  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: pt
  text: Deste uma bandeira aos que te temem, para ser erguida[a] por causa da verdade[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para ser exibida”, “para que se reúnam em torno dela” ou, possivelmente, “para fugir”. O verbo hebraico é difícil e sua interpretação é debatida.
    reason: lexical_alternative
  - marker: b
    text: O hebraico qóshet provavelmente significa “verdade” ou “veracidade”; algumas versões antigas e alguns intérpretes entendem a linha de outra maneira, resultando em traduções como “por causa do arco”.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Deste
  rationale: O qal perfeito na segunda pessoa masculina singular dirige-se a Deus e apresenta a ação como realizada. O pretérito perfeito é natural em português e não exclui sua relevância presente.
- source_word: לִירֵאֶיךָ
  choice: aos que te temem
  rationale: A expressão traduz de modo idiomático o particípio de ירא e conserva a ideia bíblica de temor reverente, sem reduzi-la a mero pavor.
- source_word: נֵס
  choice: bandeira
  rationale: O substantivo designa um estandarte ou sinal levantado. “Bandeira” é corrente e mantém a imagem pública e militar do verso.
- source_word: לְהִתְנוֹסֵס
  choice: para ser erguida
  rationale: O infinitivo é lexicalmente difícil. Em associação com נֵס, a leitura passiva/reflexiva de algo levantado ou exibido preserva melhor a imagem da bandeira; outras possibilidades são registradas em nota.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Embora a expressão signifique literalmente “de diante da face de”, aqui a relação causal produz uma frase portuguesa clara e se ajusta à leitura adotada da oração.
- source_word: קֹשֶׁט
  choice: a verdade
  rationale: A forma poética provavelmente significa “verdade” ou “veracidade”. O artigo torna a expressão natural em português, sem alterar seu sentido básico.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se, por transliteração, o marcador litúrgico ou musical hebraico cujo sentido exato permanece incerto.
theological_decisions: []
