lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz as duas perguntas retóricas.
- source_word: יֹבִלֵנִי
  choice: me levará
  rationale: O hifil de יבל expressa fazer ir, conduzir ou levar; com o destino indicado em seguida, “me levará” é natural e preciso.
- source_word: עִיר מָצוֹר
  choice: a cidade fortificada
  rationale: A construção designa uma cidade caracterizada por fortificações, provavelmente uma praça-forte, e não necessariamente uma cidade sitiada.
- source_word: נָחַנִי
  choice: me guiará
  rationale: O verbo נחה significa conduzir ou guiar. O futuro em português mantém o paralelismo prospectivo, embora a forma hebraica também permita leitura perfectiva.
- source_word: עַד אֱדוֹם
  choice: até Edom
  rationale: עַד marca o limite ou ponto de chegada; “até Edom” reproduz isso de modo idiomático.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nome próprio tradicionalmente transliterado como “Edom” em português.
