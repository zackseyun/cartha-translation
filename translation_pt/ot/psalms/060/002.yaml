  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: pt
  text: Fizeste a terra[a] tremer; rachaste-a. Cura suas fraturas, pois ela vacila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o país». O hebraico אֶרֶץ pode se referir tanto à terra em sentido amplo quanto a uma terra ou país específico; o contexto poético permite ambas as nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: Fizeste ... tremer
  rationale: 'O hifil de רָעַשׁ expressa causação: fazer a terra tremer. A formulação é natural em português e preserva a força causativa.'
- source_word: אֶרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou país específico. A imagem poética favorece «a terra», sem excluir uma aplicação à terra de Israel.
- source_word: פְּצַמְתָּהּ
  choice: abriste nela fendas
  rationale: O verbo comunica ruptura ou fissura. Esta expressão torna clara a imagem sísmica e se liga naturalmente às «fraturas» da oração seguinte.
- source_word: רְפָה
  choice: Cura
  rationale: Imperativo de רָפָא, normalmente «curar». Mantém a personificação poética da terra, em vez de reduzir a imagem a «consertar».
- source_word: שְׁבָרֶיהָ
  choice: suas fraturas
  rationale: שֶׁבֶר pode indicar quebra, fratura ou brecha. «Fraturas» se ajusta à imagem de terremoto e combina com o verbo «curar».
- source_word: כִי
  choice: pois
  rationale: Introduz a razão do pedido e conserva concisão e dignidade poéticas.
- source_word: מָטָה
  choice: está cambaleando
  rationale: O verbo descreve inclinação, vacilação ou perda de estabilidade. «Está cambaleando» preserva o caráter contínuo e personificado da imagem.
theological_decisions: []
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. A tradução conserva a personificação da terra e a sequência de imagens sísmicas. O pretérito perfeito composto do inglês não foi reproduzido mecanicamente; o pretérito perfeito simples é a forma idiomática em português para as ações concluídas aqui descritas.
