  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: pt
  text: 'Ao regente: segundo “Lírio do Testemunho”.[a] Miktam[b] de Davi,[c] para ensinar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “para a melodia ‘Lírio do Testemunho’”. O hebraico parece preservar um título musical ou litúrgico, mas seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: “Miktam” é um termo hebraico de significado incerto, provavelmente uma designação musical ou literária.
    reason: lexical_alternative
  - marker: c
    text: “De Davi” também pode significar “por Davi” ou “para Davi”; a construção hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa o responsável pela execução musical. “Ao regente” é conciso, natural em português e preserva a função litúrgica sem especificar necessariamente um coro.
- source_word: עַל
  choice: segundo
  rationale: Neste contexto, a preposição provavelmente introduz uma melodia ou indicação musical. “Segundo” mantém aberta a natureza exata dessa relação.
- source_word: שׁוּשַׁן עֵדוּת
  choice: “Lírio do Testemunho”
  rationale: A expressão parece ser um título musical ou litúrgico. A tradução relativamente formal e as aspas assinalam esse caráter sem alegar certeza sobre seu referente.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Como o significado desse rótulo hebraico de gênero é incerto, a transliteração evita uma interpretação especulativa.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, associação ou dedicação. “De Davi” preserva melhor essa amplitude do que “por Davi” ou “para Davi”.
- source_word: לְלַמֵּד
  choice: para ensinar
  rationale: O infinitivo expressa finalidade; a formulação conserva de modo claro e natural o propósito instrutivo.
theological_decisions: []
