  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução se limita ao texto hebraico fornecido, que termina em “para ensinar”; a continuação histórica presente na camada inglesa de consulta não consta do trecho da WLC apresentado e, por isso, não foi acrescentada.
