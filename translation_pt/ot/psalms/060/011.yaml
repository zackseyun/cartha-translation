  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: pt
  text: Dá-nos ajuda contra o adversário[a], pois é inútil o socorro humano[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajuda na angústia”; o hebraico צַר pode significar tanto “angústia” como “adversário” ou “inimigo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “livramento” ou “vitória” para “socorro”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico אָדָם significa “ser humano” e aqui se refere à humanidade em geral.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָבָה
  choice: Dá
  rationale: Forma de pedido usada na oração; “Dá” é direta, natural e preserva a força do imperativo hebraico.
- source_word: לָּנוּ
  choice: nos
  rationale: Pronome da primeira pessoa do plural, ligado naturalmente ao pedido “Dá-nos”.
- source_word: עֶזְרַת
  choice: socorro
  rationale: O substantivo significa ajuda ou auxílio; “socorro” é idiomático em uma súplica e se ajusta ao contexto de perigo.
- source_word: מִצָּר
  choice: contra o adversário
  rationale: צַר pode designar tanto angústia quanto adversário. O contexto militar do salmo favorece o sentido pessoal, e a preposição מִן é expressa idiomaticamente por “contra”.
- source_word: וְשָׁוְא
  choice: pois inútil é
  rationale: שָׁוְא comunica inutilidade, vacuidade ou falsidade. “Inútil” transmite com clareza a insuficiência do recurso humano; “pois” explicita a relação explicativa natural no contexto.
- source_word: תְּשׁוּעַת
  choice: a salvação
  rationale: O termo pode significar salvação, livramento ou vitória. “Salvação” preserva a amplitude lexical, enquanto as alternativas contextuais são registradas em nota.
- source_word: אָדָם
  choice: humana
  rationale: אָדָם refere-se aqui ao ser humano ou à humanidade em geral, em contraste com a ajuda divina. O adjetivo “humana” comunica esse sentido coletivo de maneira natural e inclusiva.
theological_decisions:
- issue: Contraste entre o socorro divino e a salvação humana
  choice: A salvação proporcionada por seres humanos é inútil diante da necessidade expressa no contexto do salmo.
  alternative: Uma afirmação geral de que todo esforço humano é inútil.
  rationale: O hebraico contrasta o pedido de socorro a Deus com a insuficiência do livramento humano, sem ampliar a declaração para uma condenação sistemática de todo esforço humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética concisa. “Socorro” mantém o tom de súplica; a ordem “inútil é” conserva ênfase poética sem soar arcaica.
