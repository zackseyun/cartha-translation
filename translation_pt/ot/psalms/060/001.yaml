source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: pt
  text: Ó Deus, tu nos rejeitaste e abriste brechas em nós; ficaste irado. Restaura-nos![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Volta para nós”. O hebraico pode indicar tanto a restauração do povo quanto o retorno de Deus a ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo está em vocativo. “Ó Deus” expressa com clareza e dignidade a invocação direta, sem depender apenas da pontuação.
- source_word: זְנַחְתָּנוּ
  choice: tu nos rejeitaste
  rationale: זנח indica rejeitar ou repudiar. “Rejeitaste” é natural em português atual e preserva a força relacional da lamentação.
- source_word: פְרַצְתָּנוּ
  choice: abriste brechas em nós
  rationale: פרץ evoca romper, arrombar ou abrir uma brecha. A formulação mantém a imagem concreta de Deus rompendo a defesa ou integridade do povo e evita o sentido potencialmente positivo de “fizeste-nos avançar”.
- source_word: אָ֝נַפְתָּ
  choice: ficaste irado
  rationale: O verbo expressa ira. O pretérito perfeito acompanha a sequência de ações divinas anteriores e “irado” conserva a intensidade do hebraico em registro digno e compreensível.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Restaura-nos
  rationale: A forma de שוב e a construção com לָנוּ admitem uma súplica por restauração, embora também possam ser entendidas como pedido para que Deus volte ao povo. A tradução principal é concisa e adequada ao movimento da lamentação; a alternativa fica registrada em nota.
theological_decisions:
- issue: Sentido da petição final תְּשׁוֹבֵב לָנוּ
  choice: Súplica para que Deus restaure o seu povo depois do juízo
  alternative: “Volta para nós”, isto é, uma súplica para que Deus retorne ao seu povo
  rationale: A expressão hebraica permite relacionar a reversão tanto à restauração do povo quanto ao retorno de Deus a ele. O texto principal adota a primeira possibilidade, sem eliminar a ambiguidade genuína, preservada na nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O pronome “tu” acompanha os verbos de segunda pessoa do hebraico e é amplamente inteligível. A imagem incomum de brechas foi mantida porque é central ao verbo פרץ.
