  terminology: “Rejeitaste”, “irado” e “Restaura-nos” são escolhas precisas e consistentes com o vocabulário bíblico em português. A nota preserva de modo adequado a ambiguidade real da petição final, incluindo a possibilidade de Deus voltar-se novamente para o povo.
