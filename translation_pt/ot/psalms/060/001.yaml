  source_fidelity: 'O texto traduz com fidelidade a sequência hebraica: invocação a Deus, rejeição do povo, imagem de uma ruptura/brecha infligida por Deus, ira divina e súplica final por reversão. “Abriste brechas em nós” preserva adequadamente a imagem concreta e violenta de פרצתנו sem lhe atribuir um objeto explicativo que o hebraico não fornece. “Restaura-nos” é uma leitura contextualmente sólida de תשובב לנו.'
