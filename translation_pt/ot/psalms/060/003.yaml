  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: pt
  text: Mostraste ao teu povo coisas duras; deste-nos a beber vinho que nos faz cambalear.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho que causa cambaleio”, “vinho de vertigem” ou “vinho de desorientação”.
    reason: Alternativas para תַּרְעֵלָה, termo que pode expressar cambaleio, vertigem ou desorientação semelhante à embriaguez.
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: Fizeste ... passar por
  rationale: O hifil de ראה significa literalmente “fazer ver” ou “mostrar”, mas aqui descreve aquilo que Deus fez o povo experimentar. A formulação escolhida comunica essa força causativa em português natural.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: עַם designa aqui o povo pertencente a Deus; “o teu povo” preserva de modo direto essa relação.
- source_word: קָשָׁה
  choice: dificuldades
  rationale: O adjetivo substantivado indica experiências duras ou penosas. “Dificuldades” transmite o sentido sem especificar indevidamente a natureza do sofrimento.
- source_word: הִשְׁקִיתָנוּ
  choice: deste-nos a beber
  rationale: O hifil de שקה significa “dar de beber” ou “fazer beber”. “Deste-nos a beber” mantém a força causativa e o tom poético sem sugerir necessariamente coerção além do que o contexto afirma.
- source_word: יַיִן
  choice: vinho
  rationale: É o sentido comum do substantivo e preserva a imagem metafórica do texto hebraico.
- source_word: תַּרְעֵלָה
  choice: que nos faz cambalear
  rationale: O substantivo evoca cambaleio, vertigem ou desorientação. A oração relativa produz português claro e conserva o efeito vivido da metáfora.
theological_decisions:
- issue: Força metafórica da imagem do vinho
  choice: Conservar a imagem do vinho que faz o povo cambalear como experiência imposta de aflição e desorientação.
  alternative: Explicitar a imagem como juízo divino ou substituir o vinho por uma referência direta ao sofrimento.
  rationale: O paralelismo com as dificuldades favorece uma leitura metafórica, mas a tradução não deve reduzir a imagem a uma única explicação teológica nem eliminar sua tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A primeira oração evita o hebraísmo pouco natural “mostraste coisas duras”, enquanto a segunda preserva integralmente a metáfora poética do vinho.
