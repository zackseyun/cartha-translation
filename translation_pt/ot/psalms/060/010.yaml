  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: pt
  text: Não és tu, ó Deus, que nos rejeitaste[a] e que não sais, ó Deus, com os nossos exércitos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos repudiaste”.'
    reason: lexical_alternative
  - marker: b
    text: “Sair” é aqui uma expressão militar, isto é, sair para a batalha com os exércitos.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: Não foste tu... que
  rationale: Introduz uma pergunta retórica que espera confirmação. A construção portuguesa preserva tanto a força interrogativa quanto a ênfase do pronome independente.
- source_word: אַתָּה
  choice: tu
  rationale: O pronome independente é enfático; em «Não foste tu... que», essa ênfase aparece naturalmente em português.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: Funciona como vocativo e é repetido na segunda oração, como no hebraico.
- source_word: זְנַחְתָּנוּ
  choice: nos rejeitaste
  rationale: זנח significa rejeitar ou repudiar. «Rejeitaste» é claro, atual e mantém sem atenuação a linguagem direta do lamento.
- source_word: וְלֹא
  choice: e que já não
  rationale: Mantém a segunda oração sob o alcance da pergunta retórica. «Já não» exprime naturalmente a ausência atual da ação divina, sem transformá-la em ordem negativa.
- source_word: תֵצֵא
  choice: sais
  rationale: Preserva a imagem literal de sair; no contexto, trata-se de sair para a batalha, sentido esclarecido em nota.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: com os nossos exércitos
  rationale: צבאות designa aqui as forças militares de Israel, e a preposição indica acompanhamento na batalha.
theological_decisions:
- issue: A linguagem da rejeição divina no lamento
  choice: Afirmar diretamente que Deus rejeitou o povo e já não sai com seus exércitos.
  alternative: Atenuar para «permitiste que fôssemos rejeitados» ou «pareceste nos rejeitar».
  rationale: O hebraico atribui diretamente a Deus tanto a rejeição quanto a ausência na campanha militar. A tradução conserva a tensão teológica própria do lamento.
- issue: Alcance interrogativo de הֲלֹא
  choice: Tratar as duas orações coordenadas como uma única pergunta retórica.
  alternative: 'Traduzir a segunda oração como afirmação independente: «e já não sais».'
  rationale: A leitura interrogativa conjunta é sintaticamente plausível e evita que a segunda oração seja entendida como uma proibição; a formulação mantém a unidade retórica do verso.
translation_notes:
  register: Português moderno, digno e acessível, com uso de «tu» coerente com a forma verbal singular e vocativo bíblico natural. A sintaxe «Não foste tu... que» comunica a pergunta retórica sem rigidez excessiva; «já não sais» soa natural e preserva a dimensão militar da imagem.
