  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: pt
  text: Pois tu, Yahweh, és o Altíssimo sobre toda a terra; estás exaltado muito acima de todos os deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seres divinos” ou “seres celestiais”. O hebraico elohim pode designar deuses, seres divinos ou poderes celestiais, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a afirmação anterior e mantém com naturalidade o encadeamento argumentativo do salmo.
- source_word: אַתָּה
  choice: tu
  rationale: 'Conserva o pronome explícito e sua ênfase: é o próprio Yahweh quem ocupa a posição suprema.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Expressa supremacia de posição e preserva a ressonância do conhecido título divino.
- source_word: עַל כָּל הָאָרֶץ
  choice: sobre toda a terra
  rationale: Comunica a supremacia de Yahweh sobre o mundo inteiro com formulação natural em português.
- source_word: מְאֹד
  choice: muito acima
  rationale: O intensificador hebraico, unido à comparação introduzida por עַל, é expresso de maneira idiomática em português.
- source_word: נַעֲלֵיתָ
  choice: estás exaltado
  rationale: Traduz o sentido passivo-resultativo do verbo e apresenta a exaltação como estado vigente no contexto poético.
- source_word: עַל כָּל אֱלֹהִים
  choice: acima de todos os deuses
  rationale: Mantém o sentido plural direto e a força polêmica do texto, sem decidir antecipadamente a identidade precisa dos referentes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Preserva o nome pessoal revelado no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de אֱלֹהִים no último membro do verso
  choice: deuses
  alternative: seres divinos; seres celestiais
  rationale: “Deuses” conserva o sentido plural mais direto e a tensão teológica do salmo quanto aos rivais ou seres sobre os quais Yahweh é supremo; a nota registra outras identificações lexicalmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A estrutura paralela do verso e a ênfase do pronome hebraico foram preservadas.
