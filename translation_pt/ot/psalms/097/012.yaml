  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: pt
  text: Alegrem-se em Yahweh, vocês que são justos, e deem graças pela lembrança da sua santidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e deem graças pela menção da sua santidade”. O substantivo hebraico זֵכֶר pode significar lembrança, memorial ou menção. Algumas traduções trazem “ao seu santo nome”, com base em expressões semelhantes nos Salmos, mas aqui o hebraico diz literalmente “sua santidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Alegrem-se
  rationale: Imperativo plural de שׂמח; expressa de modo natural e direto o chamado à alegria.
- source_word: צַדִּיקִים
  choice: vocês que são justos
  rationale: Representa o grupo plural interpelado diretamente, em português corrente, sem transformar o termo em título técnico.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב marca aquele em quem se encontra o motivo ou âmbito da alegria, e o nome divino יהוה é transliterado.
- source_word: וְהוֹדוּ
  choice: e deem graças
  rationale: O imperativo hifil plural de ידה, neste contexto de louvor, indica ação de graças.
- source_word: לְזֵכֶר
  choice: ao lembrar-se de
  rationale: זֵכֶר admite os sentidos de lembrança, memorial ou menção. A formulação escolhida é natural em português e conserva a ideia principal de recordação, sem excluir a alternativa 'à menção de'.
- source_word: קָדְשׁוֹ
  choice: sua santidade
  rationale: Traduz literalmente o substantivo com sufixo possessivo. O hebraico não contém a palavra 'nome', portanto ela não foi acrescentada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva sua função como nome pactual sem substituí-lo por um título.
- issue: Se deve ser suprida a palavra 'nome' em קָדְשׁוֹ
  choice: sua santidade
  alternative: seu santo nome
  rationale: Embora 'seu santo nome' seja uma expressão tradicional e encontre paralelos nos Salmos, שֵׁם ('nome') não aparece neste versículo. Mantém-se, por isso, a formulação do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'vocês que são justos' explicita o valor vocativo de צַדִּיקִים. O marcador [a] aparece no texto principal e reúne a ambiguidade lexical de זֵכֶר e a alternativa tradicional relativa a קָדְשׁוֹ.
