  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: pt
  text: Sião ouviu e se alegrou; as filhas de Judá[a] exultaram por causa dos teus julgamentos, ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as cidades de Judá” ou “os povoados de Judá”. O hebraico diz literalmente “as filhas de Judá”, expressão poética que pode se referir às comunidades de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: ouviu
  rationale: O qal perfeito, terceira pessoa do singular feminino, tem Sião como sujeito; o pretérito perfeito preserva a ação concluída e a sequência poética.
- source_word: וַתִּשְׂמַח
  choice: e se alegrou
  rationale: Expressa alegria de modo natural e digno, mantendo distinção em relação ao verbo mais intenso que vem depois.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém o nome próprio na forma tradicional e amplamente reconhecida em português, sem substituir sua possível função metonímica por Jerusalém ou pelo povo.
- source_word: וַתָּגֵלְנָה
  choice: exultaram
  rationale: O verbo גיל sugere alegria intensa; “exultaram” preserva essa força e evita repetir simplesmente “alegraram-se”.
- source_word: בְּנוֹת יְהוּדָה
  choice: as filhas de Judá
  rationale: Conserva a expressão poética literal e sua ambiguidade, enquanto a nota registra o possível sentido geográfico de cidades ou povoados dependentes de Judá.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Neste contexto, introduz naturalmente a razão da alegria, sem o sentido final normalmente associado a “a fim de”.
- source_word: מִשְׁפָּטֶיךָ
  choice: teus julgamentos
  rationale: Mantém a amplitude de מִשְׁפָּט para decisões ou atos judiciais divinos, em harmonia com o contexto do salmo.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino pessoal e usa a partícula vocativa portuguesa exigida pelo endereçamento direto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal, e “ó” marca o vocativo.
- issue: Sentido de בְּנוֹת יְהוּדָה
  choice: as filhas de Judá
  alternative: as cidades de Judá / os povoados de Judá
  rationale: A tradução principal conserva a imagem hebraica e não elimina a possibilidade de referência poética às comunidades de Judá; essa possibilidade é apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi preservado; o ponto e vírgula torna clara a passagem de Sião às filhas de Judá. O marcador foi colocado junto à expressão explicada pela nota.
