source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: pt
  text: Yahweh reina; alegre-se a terra; alegrem-se as muitas terras costeiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilhas”. O termo hebraico pode referir-se a ilhas ou a regiões costeiras marítimas distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָלָךְ
  choice: reina
  rationale: Expressa de modo natural a proclamação poética do governo real contínuo de Yahweh, sem impor ao qatal o sentido mais específico de que ele acaba de tornar-se rei.
- source_word: תָּגֵל
  choice: alegre-se
  rationale: O imperfeito tem aqui força volitiva ou exortativa, adequada à resposta da terra à proclamação do reinado de Yahweh.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelo com as muitas terras costeiras indica alcance universal, e não apenas a terra de Israel.
- source_word: יִשְׂמְחוּ
  choice: alegrem-se
  rationale: Mantém a força exortativa do verbo e o paralelismo poético com “alegre-se a terra”.
- source_word: אִיִּים
  choice: terras costeiras
  rationale: O termo pode designar ilhas ou regiões marítimas costeiras, frequentemente com a ideia de terras distantes; a alternativa lexical é preservada em nota.
- source_word: רַבִּים
  choice: muitas
  rationale: Equivalente quantitativo simples e natural, concordando com “terras costeiras”.
theological_decisions:
- issue: Alcance da proclamação da realeza de Yahweh
  choice: Declaração universal do reinado presente de Yahweh sobre o mundo
  alternative: 'Referência localizada à terra de Israel, ou fórmula ingressiva: “Yahweh tornou-se rei”'
  rationale: O paralelismo entre “a terra” e “as muitas terras costeiras” favorece o alcance mundial. “Reina” afirma a realeza divina sem excluir à força possíveis nuances resultativas do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. A repetição de “alegre-se/alegrem-se” reflete o paralelismo lexical hebraico; “terras costeiras” mantém a amplitude geográfica do termo sem eliminar a alternativa “ilhas”.
