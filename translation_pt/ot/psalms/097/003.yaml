  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: pt
  text: O fogo vai adiante dele e queima seus adversários por todos os lados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: O fogo
  rationale: O substantivo denota fogo; em português, o artigo definido produz uma formulação poética natural e remete ao fogo que acompanha a manifestação divina no contexto.
- source_word: לְפָנָיו
  choice: adiante dele
  rationale: A expressão literalmente relacionada à face ou presença significa aqui que o fogo segue à frente dele; “adiante dele” é claro e natural.
- source_word: תֵּלֵךְ
  choice: vai
  rationale: הלך significa ir ou andar. Com “fogo” como sujeito, “vai” conserva a imagem dinâmica sem rigidez excessiva.
- source_word: וּתְלַהֵט
  choice: queima
  rationale: O verbo להב descreve arder intensamente ou abrasar. “Queima” preserva a ação destrutiva sem explicitar uma consumação total que o hebraico não exige.
- source_word: סָבִיב
  choice: ao redor
  rationale: O advérbio indica a extensão circundante; “ao redor” é uma equivalência direta e idiomática.
- source_word: צָרָיו
  choice: seus adversários
  rationale: O termo designa os que se opõem hostilmente a ele. “Adversários” preserva essa noção, enquanto “inimigos” permanece uma alternativa legítima.
theological_decisions:
- issue: Referente dos sufixos masculinos de terceira pessoa no contexto teofânico do Salmo 97
  choice: Manter “dele” e “seus”, deixando o antecedente implícito pelo contexto.
  alternative: Explicitar “do SENHOR” e “seus adversários”.
  rationale: O hebraico emprega sufixos pronominais, e o contexto imediato identifica o referente. Preservar os pronomes mantém o fluxo poético e evita inserir neste versículo um nome que não aparece nele.
translation_notes:
  register: Português moderno, digno e acessível, com formulação poética concisa. “Adiante dele” evita a possível conotação temporal ou hierárquica de “antes dele”, e a nota conserva a alternativa lexical genuína para צָרָיו.
