source:
  edition: WLC
  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: pt
  text: Os montes se derretem como cera diante de Yahweh[a], diante do Senhor de toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de diante da face/presença de Yahweh”; a expressão foi traduzida de forma natural como “diante de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: os montes
  rationale: O substantivo está no plural definido. “Montes” preserva a imagem poética e é natural no registro bíblico em português.
- source_word: כַּדּוֹנַג
  choice: como cera
  rationale: O prefixo כַּ marca comparação; “como cera” reproduz a símile de modo claro e idiomático.
- source_word: נָמַסּוּ
  choice: se derretem
  rationale: O verbo descreve derreter ou dissolver-se. O presente comunica a vivacidade e a força descritiva do perfeito hebraico na poesia.
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: A expressão significa literalmente “de diante da face/presença de”. “Diante de” é natural em português e mantém a ideia da presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, sem substituí-lo por um título.
- source_word: אֲדוֹן
  choice: Senhor
  rationale: O título significa senhor ou soberano. “Senhor” conserva o paralelismo elevado do verso sem acrescentar uma interpretação.
- source_word: כָּל הָאָרֶץ
  choice: de toda a terra
  rationale: Preserva a relação de posse ou domínio expressa pela construção hebraica e seu alcance universal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e o distingue do título אֲדוֹן, traduzido como “Senhor” na segunda metade.
- issue: Valor temporal e aspectual de נָמַסּוּ
  choice: 'presente: “se derretem”'
  alternative: 'passado: “se derreteram”; perfeito composto: “têm se derretido”'
  rationale: Embora a forma hebraica seja perfeita, o contexto poético permite uma descrição vívida da manifestação divina. O presente português transmite essa força sem impor uma sequência temporal específica.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Montes” foi preferido a “montanhas” por concisão e registro; “se derretem” mantém a imagem concreta da cera e a voz média/reflexiva natural em português.
