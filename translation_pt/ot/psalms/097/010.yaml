source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: pt
  text: Vocês que amam Yahweh, odeiem o mal. Ele guarda a vida[a] de seus fiéis; ele os livra da mão dos ímpios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as vidas», «as pessoas» ou «as almas». O hebraico nefashot pode referir-se a vidas, pessoas ou almas; neste contexto de proteção e livramento, «vida» expressa o sentido concreto sem determinar uma concepção antropológica posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Vocês que amam Yahweh
  rationale: O particípio em construção pode ser entendido como vocativo. Esta formulação torna a exortação direta e natural em português, preservando o sentido de “os que amam Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שִׂנְאוּ
  choice: odeiem
  rationale: O imperativo masculino plural expressa uma ordem direta; “odeiem” preserva sua força sem suavização.
- source_word: רָע
  choice: o mal
  rationale: O adjetivo singular substantivado designa o mal como categoria moral ampla.
- source_word: שֹׁמֵר
  choice: Ele guarda
  rationale: O particípio descreve a ação protetora característica de Yahweh; “guarda” conserva o aspecto de cuidado e proteção.
- source_word: נַפְשׁוֹת
  choice: a vida
  rationale: Neste contexto de proteção e livramento, נֶפֶשׁ se refere à vida ou à pessoa, não necessariamente a uma alma imaterial. O singular coletivo em português produz uma expressão natural.
- source_word: חֲסִידָיו
  choice: dos seus fiéis
  rationale: O termo caracteriza pessoas leais e piedosas em sua relação com Deus. “Seus fiéis” é atual, acessível e conserva essa dimensão relacional.
- source_word: מִיַּד
  choice: das mãos
  rationale: Preserva a imagem hebraica da mão como poder ou domínio. O plural é idiomático em português quando se refere a várias pessoas ímpias.
- source_word: רְשָׁעִים
  choice: dos ímpios
  rationale: Designa pessoas moralmente culpadas; “ímpios” é uma formulação bíblica clara e ainda corrente em português.
- source_word: יַצִּילֵם
  choice: os livra
  rationale: O hifil de נצל indica resgatar ou tirar do poder de alguém. “Livra” combina naturalmente com “das mãos” e comunica resgate ativo.
theological_decisions:
- issue: Sentido de נַפְשׁוֹת no contexto
  choice: a vida
  alternative: as almas; as pessoas
  rationale: A proteção e o livramento do poder dos ímpios favorecem o sentido concreto de vida ou pessoa. A tradução evita impor ao verso uma afirmação antropológica específica sobre uma alma imaterial.
- issue: Tradução de חֲסִידָיו
  choice: seus fiéis
  alternative: seus santos; seus piedosos; seus leais
  rationale: A expressão comunica fidelidade e devoção na relação com Deus sem restringir o termo a uma categoria eclesiástica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” explicita o vocativo plural; “odeiem” mantém a força do imperativo. A segunda frase preserva o paralelismo entre a proteção constante e o livramento ativo.
