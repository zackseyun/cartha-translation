  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: pt
  text: Sejam envergonhados todos os que servem a imagens esculpidas, os que se gloriam em ídolos. Prostrem-se diante dele todos os deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seres celestiais” ou “todos os anjos”. O hebraico diz “todos os deuses”, o que pode ser uma referência polêmica aos deuses das nações ou uma referência a seres celestiais que assistem diante do SENHOR.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O verbo בוש expressa vergonha ou desonra. A forma pode ter força volitiva no contexto; esta tradução conserva a ideia de humilhação pública sem a enfraquecer para mero sentimento interior.
- source_word: עֹבְדֵי
  choice: os que servem
  rationale: O particípio de עבד indica pessoas dedicadas ao serviço ou culto. “Servem” mantém o valor lexical, enquanto o objeto deixa claro o contexto religioso.
- source_word: פֶסֶל
  choice: imagens esculpidas
  rationale: פֶסֶל designa especificamente uma imagem talhada ou esculpida. A expressão é precisa e corrente, além de evitar linguagem arcaica.
- source_word: הַמִּתְהַלְלִים
  choice: os que se gloriam
  rationale: O hitpael de הלל aqui comunica exaltação ou orgulho no objeto mencionado. “Gloriam-se” preserva a conotação religiosa e poética sem explicá-la em excesso.
- source_word: בָּאֱלִילִים
  choice: em ídolos
  rationale: אֱלִילִים pode carregar uma nuance pejorativa de nulidade ou inutilidade, mas “ídolos” identifica o referente de modo conciso e natural.
- source_word: הִשְׁתַּחֲווּ
  choice: prostrem-se
  rationale: O imperativo de שׁחה descreve inclinar-se ou prostrar-se em homenagem. “Prostrem-se” conserva tanto o gesto físico quanto sua dimensão cultual.
- source_word: לוֹ
  choice: diante dele
  rationale: Embora ל seja literalmente “a/para ele”, em português “prostrar-se diante dele” é a construção idiomática que expressa fielmente a homenagem dirigida a alguém.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: O plural אֱלֹהִים é mantido literalmente para preservar a formulação hebraica e a ambiguidade entre divindades das nações e seres celestiais.
theological_decisions:
- issue: Referente de כָּל אֱלֹהִים
  choice: todos os deuses
  alternative: todos os seres celestiais; todos os anjos
  rationale: O hebraico diz literalmente “todos os deuses”. No contexto, a expressão pode ser uma afirmação polêmica sobre os deuses das nações ou referir-se a seres celestiais que assistem diante do SENHOR. A tradução principal conserva a tensão do original, e a nota registra as leituras alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética em duas partes foi preservada; “prostrem-se” mantém solenidade sem arcaísmo, e a ambiguidade teológica de אֱלֹהִים permanece explícita.
