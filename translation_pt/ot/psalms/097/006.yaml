source:
  edition: WLC
  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: pt
  text: Os céus proclamam a sua justiça[a], e todos os povos veem a sua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua retidão”. O termo hebraico pode expressar tanto justiça quanto retidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: proclamam
  rationale: O hifil de נגד expressa tornar conhecido ou declarar. “Proclamam” é natural, conciso e mantém o tom poético elevado.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: No contexto cósmico e teofânico do salmo, “os céus” preserva tanto o sentido poético quanto a personificação da criação.
- source_word: צִדְקוֹ
  choice: a sua justiça
  rationale: צֶדֶק pode abranger justiça, retidão e conformidade moral. Em português atual, “justiça” exprime naturalmente tanto o caráter reto de Deus quanto seus atos justos, enquanto a nota preserva a alternativa “retidão”.
- source_word: וְרָאוּ
  choice: e ... veem
  rationale: Embora a forma hebraica seja perfeita, o presente comunica bem a vivacidade e o caráter geral da afirmação poética em português.
- source_word: כָל הָעַמִּים
  choice: todos os povos
  rationale: “Povos” reflete diretamente o plural עַמִּים e mantém o alcance universal sem restringi-lo a Estados ou nações políticas.
- source_word: כְּבוֹדוֹ
  choice: a sua glória
  rationale: “Glória” é a tradução consagrada e adequada para a majestade divina manifesta indicada por כָּבוֹד.
theological_decisions:
- issue: Sentido do atributo divino צִדְקוֹ
  choice: a sua justiça
  alternative: a sua retidão
  rationale: O termo hebraico reúne dimensões morais e judiciais. “Justiça” funciona com naturalidade no texto principal, e “retidão” é mantida em nota para não eliminar a amplitude teológica do original.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Os céus”, “proclamam” e “glória” preservam o registro elevado sem recorrer a linguagem arcaica.
