  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: pt
  text: Seus relâmpagos iluminam o mundo; a terra vê e estremece.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra vê e se abala”. O verbo hebraico pode expressar tremor, contorção ou abalo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: iluminam
  rationale: O hifil de אור expressa fazer brilhar ou dar luz; “iluminam” preserva naturalmente o valor causativo em português.
- source_word: בְרָקָיו
  choice: seus relâmpagos
  rationale: O substantivo plural com sufixo de terceira pessoa masculina singular refere-se aos relâmpagos de Deus. O plural é natural em português.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תבל designa com frequência o mundo em sua extensão habitada e mantém aqui a distinção poética em relação a הָאָרֶץ.
- source_word: רָאֲתָה
  choice: vê
  rationale: Embora seja formalmente perfeito, o presente dá vivacidade à cena poética e se harmoniza com a descrição teofânica.
- source_word: וַתָּחֵל
  choice: e estremece
  rationale: O verbo חול/חיל pode indicar tremer, contorcer-se ou estar em dores. “Estremece” comunica a reação da terra sem restringi-la indevidamente a dor ou abalo sísmico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No paralelismo com תבל e no contexto cósmico do salmo, a referência é à terra, não apenas a uma região.
theological_decisions:
- issue: Alcance cósmico da teofania
  choice: “o mundo” e “a terra” como termos distintos e complementares
  alternative: Entender הָאָרֶץ de modo localizado como “a região” ou “a terra” no sentido territorial
  rationale: O paralelismo e o contexto teofânico favorecem um alcance universal, sem acrescentar uma afirmação doutrinária além da imagem poética.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A personificação poética da terra foi preservada.
