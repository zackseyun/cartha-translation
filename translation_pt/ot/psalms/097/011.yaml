base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: pt
  text: A luz é semeada para o justo[a], e a alegria, para os retos de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A luz é espalhada/plantada para o justo”. O hebraico conserva uma metáfora agrícola: a luz é retratada como algo semeado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: a luz
  rationale: Mantém a metáfora poética ampla de luz, que pode sugerir bênção, livramento ou bem-estar sem limitar o sentido a uma interpretação específica.
- source_word: זָרֻעַ
  choice: é semeada
  rationale: Reproduz o particípio passivo de זרע e preserva a imagem agrícola marcante do hebraico.
- source_word: לַצַּדִּיק
  choice: para o justo
  rationale: A preposição ל indica benefício ou destinação. O singular genérico do hebraico é preservado de modo natural em português.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: e ... para os retos de coração
  rationale: Expressa naturalmente o idioma hebraico que descreve pessoas interiormente íntegras, mantendo o plural e o paralelismo.
- source_word: שִׂמְחָה
  choice: a alegria
  rationale: Termo claro e corrente que corresponde ao substantivo hebraico e forma um paralelo conciso com “a luz”.
theological_decisions:
- issue: Sentido metafórico de “luz”
  choice: Preservar a imagem “A luz é semeada”
  alternative: Explicitar como “O livramento está preparado” ou “A prosperidade está reservada”
  rationale: O texto hebraico não especifica uma única realidade representada pela luz. A formulação conserva sua amplitude poética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula em “e a alegria, para...” marca a elipse de “é semeada” e preserva o paralelismo poético sem acrescentar um verbo ausente no segundo membro.
