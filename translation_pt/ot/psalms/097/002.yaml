lexical_decisions:
- source_word: עָנָן
  choice: nuvem
  rationale: O substantivo hebraico está no singular e pode ter valor coletivo na poesia; o singular também mantém a correspondência com o substantivo seguinte.
- source_word: וַעֲרָפֶל
  choice: e escuridão densa
  rationale: עֲרָפֶל designa escuridão espessa, névoa sombria ou densas trevas, sobretudo em contextos de manifestação divina. A formulação preserva o peso da imagem sem explicá-la.
- source_word: סְבִיבָיו
  choice: estão ao redor dele
  rationale: Traduz literalmente a expressão preposicional «ao redor dele», suprindo a cópula exigida pelo português.
- source_word: צֶדֶק
  choice: justiça
  rationale: Neste paralelismo, o termo aponta para retidão ou conformidade com o que é justo. «Justiça» é claro e natural em português, embora se sobreponha parcialmente ao termo seguinte.
- source_word: וּמִשְׁפָּט
  choice: e juízo
  rationale: מִשְׁפָּט pode denotar juízo, decisão judicial ou ordem justa. «Juízo» mantém alguma distinção lexical em relação a צֶדֶק e se ajusta à imagem régia do trono.
- source_word: מְכוֹן
  choice: o fundamento
  rationale: O substantivo indica base, lugar estabelecido ou fundamento; aqui, «fundamento» expressa naturalmente aquilo sobre o qual o trono se firma.
- source_word: כִּסְאוֹ
  choice: do seu trono
  rationale: Reproduz a relação construta hebraica מְכוֹן כִּסְאוֹ, isto é, «fundamento do seu trono».
theological_decisions:
- issue: Imagem teofânica do ocultamento divino
  choice: Manter a nuvem e a escuridão densa ao redor de Deus sem suavizar a imagem.
  alternative: Interpretar dinamicamente a imagem como majestade ou mistério que o cercam.
  rationale: O texto combina o reinado de Deus com uma imagem teofânica semelhante à do Sinai, preservando a tensão entre revelação e ocultamento, sem convertê-la em abstração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poéticos foram preservados; «juízo» distingue מִשְׁפָּט de צֶדֶק sem impor uma interpretação denominacional.
