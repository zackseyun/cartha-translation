  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: pt
  text: Nuvem e escuridão densa estão ao redor dele[a]; justiça e direito são o fundamento do seu trono.
  philosophy: optimal-equivalence
  footnotes:
