base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: pt
  text: 'Mictam de Davi.[a]


    Guarda-me, ó Deus, pois em ti me refugio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico miktam, título de salmo de significado incerto; talvez indique um tipo de composição. Alguns traduzem por “salmo”, “cântico de ouro” ou “inscrição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Mictão
  rationale: O termo é um cabeçalho de significado incerto. A transliteração adaptada à ortografia portuguesa preserva a forma hebraica sem impor um sentido especulativo.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, associação ou dedicação. “De Davi” é natural em português e preserva melhor essa amplitude do que “por Davi”.
- source_word: שָׁמְרֵנִי
  choice: Guarda-me
  rationale: O imperativo de שׁמר pede cuidado e proteção contínuos. “Guarda-me” é corrente, digno e mantém a amplitude do verbo.
- source_word: אֵל
  choice: ó Deus
  rationale: אֵל é um título divino comum. A partícula “ó” expressa naturalmente o vocativo em português.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão do pedido. “Pois” comunica com clareza a relação causal.
- source_word: חָסִיתִי
  choice: me refugio
  rationale: O verbo חסה evoca buscar ou encontrar abrigo. O presente português comunica uma confiança atual e estabelecida, sem perder a imagem concreta de refúgio.
- source_word: בָךְ
  choice: em ti
  rationale: Com חסה, a preposição ב marca aquele em quem se busca refúgio. “Em ti” é o equivalente idiomático e preserva a linguagem relacional.
theological_decisions:
- issue: Sentido do cabeçalho מִכְתָּם
  choice: Transliterar como “Mictão”
  alternative: Traduzir como “salmo”, “cântico de ouro” ou “inscrição”
  rationale: O significado exato do termo é incerto. A transliteração evita apresentar como certo qualquer sentido conjectural e conserva a ambiguidade do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A inversão pronominal em “Guarda-me” e o vocativo “ó Deus” preservam o tom de oração sem soar excessivamente arcaicos. O título foi transliterado como “Mictão”, forma adaptada à ortografia portuguesa.
