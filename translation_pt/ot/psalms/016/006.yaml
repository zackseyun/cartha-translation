  text: חֲבָלִ֣ים נָֽפְלוּ לִ֭/י בַּ/נְּעִמִ֑ים אַף נַ֝חֲלָ֗ת שָֽׁפְרָ֥ה עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: pt
  text: As linhas de demarcação caíram para mim em lugares agradáveis[a]; sim, minha herança é bela aos meus olhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As cordas de medição caíram para mim em lugares agradáveis”. A imagem hebraica é a de cordas ou linhas que delimitavam uma herança repartida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “minha herança me é agradável” ou “minha herança me agrada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: linhas de demarcação
  rationale: No contexto de repartição de terras, o termo designa cordas de medição ou as linhas que delimitam a porção atribuída. A escolha mantém concreta e compreensível a imagem territorial.
- source_word: נָפְלוּ
  choice: caíram
  rationale: Traduz literalmente o verbo e preserva a imagem hebraica de uma porção determinada por sorteio, em vez de explicá-la apenas como 'couberam'.
- source_word: לִי
  choice: para mim
  rationale: Expressa o dativo de interesse ou vantagem e mantém a relação pessoal do salmista com a porção recebida.
- source_word: בַּנְּעִמִים
  choice: em lugares agradáveis
  rationale: O plural substantivado de נעים, dentro da metáfora territorial, é naturalmente entendido como referência a lugares agradáveis ou aprazíveis.
- source_word: אַף
  choice: sim
  rationale: Aqui a partícula reforça e confirma a declaração anterior; 'sim' comunica essa força enfática sem reduzi-la a simples adição.
- source_word: נַחֲלָת
  choice: minha herança
  rationale: Embora a forma esteja em construção, o contexto exige relação de primeira pessoa. 'Herança' preserva tanto a concretude da porção territorial quanto suas ressonâncias pactuais.
- source_word: שָׁפְרָה
  choice: é bela
  rationale: O verbo expressa beleza, excelência ou agradável qualidade. O perfeito admite aqui sentido estativo, vertido naturalmente pelo presente.
- source_word: עָלַי
  choice: aos meus olhos
  rationale: A expressão literalmente relacionada a 'sobre mim' indica aqui avaliação ou apreço pessoal. 'Aos meus olhos' produz português natural sem eliminar a perspectiva subjetiva do salmista.
theological_decisions:
- issue: A imagem da repartição da terra como metáfora da porção dada por Deus
  choice: Preservar as linhas de demarcação e a herança como imagens concretas.
  alternative: Explicitar o sentido como 'as bênçãos que me foram dadas são agradáveis'.
  rationale: A linguagem remete à divisão de uma herança territorial e se relaciona com o SENHOR como porção do salmista no versículo anterior. Manter a metáfora conserva essa textura teológica sem definir de modo excessivo se a herança é terra, circunstâncias, o próprio Deus ou a totalidade da porção recebida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva deliberadamente a imagem incomum de as linhas 'caírem', esclarecida em nota, e evita substituir a metáfora por uma explicação generalizada sobre bênçãos.
