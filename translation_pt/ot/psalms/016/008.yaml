  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: pt
  text: Tenho colocado Yahweh sempre diante de mim; porque ele está à minha direita, não vacilarei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não serei abalado” ou “não serei removido”. O verbo hebraico pode indicar vacilar, cambalear ou ser tirado de uma posição firme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Mantenho
  rationale: O piel perfeito de שׁוה indica uma ação deliberada de pôr ou colocar. Em português, “mantenho” comunica de modo natural a postura estabelecida e contínua do salmista, reforçada por תָמִיד, sem perder a ideia de escolha consciente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְנֶגְדִּי
  choice: diante de mim
  rationale: Preserva a imagem espacial e relacional de alguém mantido perante a vista ou na presença do salmista.
- source_word: תָמִיד
  choice: sempre
  rationale: Expressa com clareza e naturalidade a constância indicada pelo advérbio hebraico.
- source_word: כִּי
  choice: porque
  rationale: Mantém a relação causal entre a presença protetora de Yahweh e a confiança do salmista.
- source_word: מִימִינִי
  choice: à minha direita
  rationale: Preserva a imagem hebraica da posição de apoio, proteção e proximidade.
- source_word: בַּל אֶמּוֹט
  choice: não serei abalado
  rationale: מוט descreve vacilar, cambalear ou ser deslocado de uma posição firme. “Não serei abalado” conserva tanto a imagem de estabilidade quanto seu sentido figurado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; ou a substituição tradicional “SENHOR”
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva no texto o caráter de nome pessoal sem convertê-lo em título.
- issue: Agente implícito em אֶמּוֹט
  choice: não serei abalado
  alternative: não vacilarei
  rationale: A forma pode ser expressa em português como passiva ou como verbo de estado/movimento. A opção escolhida preserva a possível ideia de forças externas que tentam tirar o salmista de sua posição, sem excluir a noção de instabilidade pessoal.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética concisa. “Mantenho” evita uma construção pesada com perfeito composto e combina naturalmente com “sempre”. O nome Yahweh é conservado por transliteração.
