source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: pt
  text: Pois não abandonarás a minha vida no Sheol, nem permitirás que aquele que te é fiel[b] veja a cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à decomposição”. A Septuaginta e a citação deste versículo no Novo Testamento empregam uma palavra que destaca a decomposição ou corrupção.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o teu santo”. O termo hebraico pode indicar alguém fiel, leal, piedoso ou santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da confiança expressa no contexto anterior e funciona naturalmente no argumento poético.
- source_word: לֹא תַעֲזֹב
  choice: não abandonarás
  rationale: Expressa com clareza o sentido de não deixar ou entregar alguém ao domínio do Sheol.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: נפש aqui pode designar a pessoa ou sua vida; 'minha vida' é natural em português e evita sugerir que apenas uma parte imaterial do ser esteja em vista.
- source_word: לִשְׁאוֹל
  choice: no Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo a uma sepultura individual.
- source_word: לֹא תִתֵּן
  choice: nem permitirás
  rationale: Com o infinitivo seguinte, נתן tem sentido idiomático de permitir ou deixar.
- source_word: חֲסִידְךָ
  choice: aquele que te é fiel
  rationale: Comunica a lealdade e a devoção implicadas em חסיד sem impor como sentido principal a tradução tradicional 'Santo'.
- source_word: לִרְאוֹת
  choice: veja
  rationale: Preserva o idioma hebraico, no qual 'ver' pode significar experimentar ou sofrer algo.
- source_word: שָׁחַת
  choice: a cova
  rationale: No paralelismo com Sheol, 'cova' representa bem o sentido concreto provável, preservando em nota a alternativa 'decomposição'.
theological_decisions:
- issue: Significado messiânico posterior no uso do Novo Testamento
  choice: Traduzir o sentido lexical imediato do hebraico sem tornar explicitamente cristológica a linha principal.
  alternative: Usar 'teu Santo' e 'decomposição' na linha principal, em maior conformidade verbal com a Septuaginta e as citações em Atos.
  rationale: O texto hebraico admite nuances preservadas pela tradição grega, mas a tradução principal não deve decidir antecipadamente a aplicação neotestamentária. As alternativas teologicamente relevantes ficam registradas em notas.
- issue: Referência de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma
  rationale: No contexto de morte e Sheol, נפש pode referir-se à vida ou à própria pessoa. 'Vida' evita uma dicotomia antropológica não exigida pelo hebraico.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. ''Sheol'' é mantido como termo do mundo conceitual hebraico. A construção ''aquele que te é fiel'' soa mais natural e semanticamente transparente do que o substantivado ''teu fiel''. Há um problema de marcação a corrigir: a nota [a] sobre decomposição deve ficar após ''cova'', não após ''Sheol''.'
