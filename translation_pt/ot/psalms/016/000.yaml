base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: pt
  text: 'Mictão de Davi.[a]


    Guarda-me, ó Deus, pois em ti me refugio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico mictão, título de salmo cujo significado é incerto; talvez indique um tipo de composição. Alguns traduzem por “salmo” ou “cântico de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם (miktām)
  choice: Mictã
  rationale: Translitera o termo técnico do título, cujo significado é incerto, em vez de escolher uma interpretação não comprovada.
- source_word: שָׁמְרֵנִי (šāmrēnî)
  choice: Guarda-me
  rationale: Preserva o sentido direto do imperativo de שׁמר, que aqui pede proteção e cuidado.
- source_word: חָסִיתִי (ḥāsîtî)
  choice: me refugio
  rationale: Expressa naturalmente a ação de buscar abrigo e segurança em Deus; o perfeito hebraico pode indicar confiança assumida ou presente, bem vertida em português pelo presente.
theological_decisions:
- issue: Natureza de מִכְתָּם no título
  choice: Manter como termo transliterado e explicar a incerteza em nota
  alternative: Traduzir como “salmo”, “poema” ou “cântico de ouro”
  rationale: O sentido e a função exatos do termo são desconhecidos; traduzi-lo de modo específico resolveria indevidamente uma ambiguidade textual genuína.
- issue: Valor temporal de חָסִיתִי
  choice: “me refugio”
  alternative: “me refugiei” ou “tenho buscado refúgio”
  rationale: No contexto de uma súplica, o perfeito pode apresentar a confiança como postura já assumida e vigente; o presente transmite essa força sem excluir seu início anterior.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira ampla. A forma vocativa “ó Deus” torna natural a invocação direta, enquanto “Guarda-me” mantém concisão e proximidade lexical com o hebraico. O marcador foi colocado após “Mictã de Davi”, pois a nota explica o termo do título.
