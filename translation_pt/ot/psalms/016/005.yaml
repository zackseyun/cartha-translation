  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: pt
  text: Yahweh é a porção da minha herança e o meu cálice[a]; tu sustentas a minha sorte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh é a minha porção e o meu cálice”. O hebraico reúne, em rápida sucessão, várias imagens de distribuição: “porção”, “herança/parte” e “sorte”.'
    reason: Alternativa lexical e esclarecimento da sobreposição de imagens no hebraico.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְנָת חֶלְקִי
  choice: a porção da minha herança
  rationale: Mantém a relação construta e a sequência de imagens ligadas à parte recebida por distribuição, sem fundir os dois substantivos.
- source_word: וְכוֹסִי
  choice: e o meu cálice
  rationale: Conserva a metáfora bíblica concreta do cálice como aquilo que cabe à pessoa, sem explicá-la no corpo do versículo.
- source_word: אַתָּה
  choice: tu
  rationale: Retém a ênfase do pronome hebraico explícito e corresponde naturalmente à referência direta a Yahweh.
- source_word: תּוֹמִיךְ
  choice: sustentas
  rationale: Expressa a ideia de manter, amparar ou conservar seguro aquilo que foi atribuído, em linguagem poética atual.
- source_word: גּוֹרָלִי
  choice: a minha sorte
  rationale: Preserva a imagem do objeto ou resultado do sorteio usado para determinar uma parte atribuída; evita interpretá-lo diretamente como 'destino'.
theological_decisions:
- issue: Yahweh como a herança atribuída ao salmista
  choice: 'Preservar a formulação sobreposta: “a porção da minha herança” e “a minha sorte”.'
  alternative: “minha porção e meu cálice” ou “minha porção escolhida e meu cálice”.
  rationale: O hebraico acumula termos de distribuição — porção, herança/parte e sorte — e apresenta o próprio Yahweh como aquilo que cabe ao salmista, bem como aquele que o mantém seguro. A tradução conserva essa tensão poética e teológica sem reduzir os termos a uma única ideia.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O paralelismo e as imagens concretas do hebraico foram preservados; empregou-se “tu” por coerência com o pronome enfático dirigido a Yahweh.
