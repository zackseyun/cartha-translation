base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: pt
  text: Tu me fazes conhecer[a] o caminho da vida; diante da tua face há plenitude de alegrias[b]; à tua direita há delícias para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu me farás conhecer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, idiomaticamente: “na tua presença há plenitude de alegrias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Tu me fazes conhecer
  rationale: Preserva o valor causativo do hifil de ידע. O imperfeito poético pode expressar confiança presente, embora também admita nuance futura.
- source_word: אֹרַח חַיִּים
  choice: o caminho da vida
  rationale: Mantém a metáfora hebraica de uma senda ou curso que conduz à vida; חַיִּים funciona aqui como substantivo abstrato.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: plenitude de alegrias
  rationale: Conserva tanto a ideia de abundância ou saciedade de שֹׂבַע quanto o plural intensivo e múltiplo de שְׂמָחוֹת.
- source_word: אֶת פָּנֶיךָ
  choice: diante da tua face
  rationale: Reproduz com transparência a imagem concreta do hebraico, que idiomaticamente comunica estar na presença de Deus.
- source_word: נְעִמוֹת
  choice: delícias
  rationale: Expressa coisas agradáveis e prazerosas com linguagem poética natural, sem reduzir o termo a prazer meramente sensorial.
- source_word: בִּימִינְךָ
  choice: à tua direita
  rationale: Representa naturalmente em português a localização junto à mão direita, imagem de proximidade favorecida.
- source_word: נֶצַח
  choice: para sempre
  rationale: Comunica de modo claro e corrente a duração permanente indicada pelo termo neste contexto.
theological_decisions:
- issue: Se אֶת פָּנֶיךָ deve ser traduzido literalmente ou por seu sentido idiomático de presença divina
  choice: diante da tua face
  alternative: na tua presença
  rationale: A formulação principal preserva a imagem corporal e poética do hebraico, enquanto a nota esclarece seu sentido idiomático sem eliminar a ressonância do texto.
- issue: Valor temporal do imperfeito תּוֹדִיעֵנִי
  choice: Tu me fazes conhecer
  alternative: Tu me farás conhecer
  rationale: O presente comunica a confiança poética como realidade vigente. A forma hebraica também permite leitura futura, registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla compreensão internacional. Mantém o tratamento singular reverente por “tu”, o paralelismo hebraico e a imagem literal de “face”, esclarecida em nota.
