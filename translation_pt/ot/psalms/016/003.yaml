  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: pt
  text: Quanto aos santos que estão na terra[b], eles são os nobres[c] em quem está todo o meu prazer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o meu deleite”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no país”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os excelentes” ou “os majestosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Quanto aos santos
  rationale: O לְ inicial é entendido como marcador de tópico neste contexto. “Santos” preserva o sentido substantivado de קְדוֹשִׁים e é natural em português; a nota registra a alternativa menos tradicional “os que são santos”.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: que estão na terra
  rationale: אֶרֶץ pode indicar “terra” ou “país”. “Na terra” mantém a formulação aberta e natural, sem decidir se a referência é territorial ou mais ampla.
- source_word: הֵמָּה
  choice: eles são
  rationale: O pronome independente é expresso para conservar sua ênfase e tornar clara a predicação.
- source_word: וְאַדִּירֵי
  choice: os nobres
  rationale: אַדִּירֵי comunica dignidade, excelência ou majestade. “Nobres” se ajusta ao paralelismo sem sugerir necessariamente poder militar.
- source_word: כָּל חֶפְצִי
  choice: todo o meu prazer
  rationale: חֵפֶץ abrange prazer, deleite e desejo. “Todo o meu prazer” é claro e conserva a intensidade de כָּל.
- source_word: בָם
  choice: em quem está
  rationale: Como o referente é pessoal, “em quem” é idiomático e mantém a força da preposição בְּ.
theological_decisions:
- issue: Identidade dos “santos”
  choice: A tradução os apresenta como pessoas santas que estão na terra, sem definição técnica adicional.
  alternative: Seres santos celestiais ou pessoas consagradas em sentido geral.
  rationale: A expressão “que estão na terra” favorece referentes humanos, mas o texto não especifica sua identidade institucional; por isso, a tradução evita impor uma leitura denominacional.
- issue: Alcance de אֶרֶץ
  choice: “terra”, preservando a amplitude semântica.
  alternative: “país”, com referência mais local, ou “mundo/terra” em sentido cósmico.
  rationale: O hebraico permite tanto uma referência territorial quanto terrestre mais ampla, e o contexto não exige que a ambiguidade seja eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e a ênfase do hebraico são preservadas sem rigidez excessiva. Todos os marcadores de nota aparecem no texto principal.
