  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: pt
  text: Por isso, meu coração se alegra, e minha glória exulta[a]; até mesmo a minha carne habitará em segurança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha honra”, “todo o meu ser”. Alguns entendem aqui “minha glória” como uma maneira de falar do próprio ser; a antiga tradução grega traz “minha língua”.
    reason: lexical_alternative
  - marker: b
    text: Ou “repousará em segurança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Preserva de modo natural a força conclusiva da expressão hebraica, ligando o versículo à confiança declarada anteriormente.
- source_word: שָׂמַח לִבִּי
  choice: meu coração se alegra
  rationale: Mantém a imagem hebraica do coração como centro da vida interior e expressa o estado resultante do verbo perfeito de forma corrente em português.
- source_word: וַיָּגֶל
  choice: exulta
  rationale: Comunica uma alegria intensa e conserva a variação poética em relação a “se alegra”.
- source_word: כְּבוֹדִי
  choice: minha glória
  rationale: É a tradução formal do substantivo hebraico e preserva a ambiguidade poética, sem decidir se a expressão designa a honra, o ser inteiro ou a faculdade de expressão do salmista.
- source_word: אַף
  choice: até
  rationale: Assinala a extensão enfática e culminante da alegria interior à segurança física.
- source_word: בְּשָׂרִי
  choice: minha carne
  rationale: Preserva a imagem concreta do hebraico e sua ressonância intertextual, sem introduzir aqui a ideia teológica posterior de natureza pecaminosa.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: habitará em segurança
  rationale: Traduz diretamente a ideia de morar ou permanecer em condição segura; mantém o valor futuro do verbo no contexto.
theological_decisions:
- issue: Sentido de כְּבוֹדִי e sua interpretação na tradição antiga
  choice: minha glória
  alternative: minha honra; todo o meu ser; minha língua
  rationale: O texto hebraico diz literalmente “minha glória”. A formulação principal conserva essa expressão difícil, enquanto a nota registra sentidos idiomáticos possíveis. A antiga tradução grega e a citação em Atos 2:26 apresentam “minha língua”, razão adicional para não ocultar a questão textual e interpretativa.
- issue: Sentido de בְּשָׂרִי
  choice: minha carne
  alternative: meu corpo
  rationale: “Carne” representa diretamente o ser físico neste contexto e preserva a linguagem poética e a ligação com a citação posterior, sem sugerir que o termo signifique aqui natureza pecaminosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e conserva deliberadamente “minha glória” e “minha carne”, termos menos coloquiais, mas importantes para a transparência em relação ao hebraico.
