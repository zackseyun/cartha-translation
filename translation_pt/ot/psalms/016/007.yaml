  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: pt
  text: Bendirei Yahweh, que me aconselha; mesmo à noite, o meu íntimo me instrui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meus rins me instruem”. No hebraico, os rins podem representar o íntimo da pessoa, incluindo a consciência e as emoções profundas. O verbo traduzido por “instrui” também pode significar “corrige” ou “disciplina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Bendirei
  rationale: O piel de ברך significa aqui bendizer, isto é, falar bem de Deus ou louvá-lo. O imperfeito admite naturalmente valor volitivo ou prospectivo; “Bendirei” preserva de modo direto tanto o verbo quanto esse aspecto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa que descreve Yahweh; “que” é a forma natural e não marcada em português.
- source_word: יְעָצָנִי
  choice: me aconselha
  rationale: O verbo יעץ significa aconselhar ou dar conselho. O presente expressa bem uma ação característica no contexto poético.
- source_word: אַף
  choice: até
  rationale: 'Marca intensificação aditiva: o aconselhamento alcança até mesmo as horas da noite.'
- source_word: לֵילוֹת
  choice: de noite
  rationale: Embora o hebraico use o plural “noites”, a locução adverbial singular é idiomática em português e pode exprimir ação recorrente.
- source_word: יִסְּרוּנִי
  choice: me instrui
  rationale: יסר pode significar disciplinar, corrigir, advertir ou instruir. “Instrui” se ajusta ao contexto de formação interior sem eliminar por completo sua nuance corretiva.
- source_word: כִלְיוֹתָי
  choice: o meu íntimo
  rationale: Literalmente “meus rins”, imagem hebraica para as profundezas da pessoa, incluindo consciência e emoções. “O meu íntimo” comunica essa função sem importar a categoria distinta de “coração” ou restringi-la à mente.
theological_decisions:
- issue: Metáfora antropológica em כִלְיוֹתָי
  choice: o meu íntimo
  alternative: meus rins; meu coração; minha mente
  rationale: A tradução funcional torna compreensível a imagem hebraica do eu interior, preservando sua amplitude. A nota mantém acessível a forma literal; “coração” e “mente” substituiriam a imagem por categorias mais estreitas.
- issue: Amplitude semântica de יִסְּרוּנִי
  choice: me instrui
  alternative: me disciplina; me corrige; me adverte
  rationale: O contexto favorece instrução interior, mas o verbo também pode envolver correção ou disciplina. Essa possibilidade é registrada em nota para não resolver silenciosamente a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome Yahweh e o paralelismo poético; usa “o meu íntimo” para comunicar a metáfora antropológica sem literalismo enganoso. O marcador de nota aparece no texto principal.
