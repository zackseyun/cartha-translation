id: PSA.16.4
reference: Psalms 16:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: pt
  text: Multiplicarão as dores dos que correm atrás de outro deus[a]. Não derramarei suas ofertas de bebida de sangue[b], nem porei os nomes deles nos meus lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus ídolos se multiplicarão”. O termo hebraico pode estar associado a ídolos em alguns contextos, embora “dores” se ajuste melhor ao sentido desta linha.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “com sangue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: Multiplicarão
  rationale: O imperfeito qal de רבה expressa aumento ou multiplicação; a forma futura preserva a afirmação poética de consequência.
- source_word: עַצְּבוֹתָם
  choice: as dores dos que
  rationale: O termo pode indicar dores ou sofrimentos. A construção portuguesa explicita que as dores pertencem aos que perseguem outro deus, preservando a alternativa ligada a ídolos em nota.
- source_word: אַחֵר מָהָרוּ
  choice: correm atrás de outro deus
  rationale: מהר indica apressar-se; no contexto cultual, 'correr atrás' comunica busca ávida. 'Deus' explicita o referente implícito de אַחֵר.
- source_word: בַּל אַסִּיךְ
  choice: Não derramarei
  rationale: A negativa poética בַּל e o hifil de נסך descrevem a recusa de derramar uma libação.
- source_word: נִסְכֵּיהֶם
  choice: suas ofertas de bebida
  rationale: Expressão cultual clara e acessível para libações, sem perder a imagem sacrificial.
- source_word: מִדָּם
  choice: de sangue
  rationale: A preposição מן pode indicar material ou origem; 'de sangue' preserva diretamente a imagem forte, enquanto 'com sangue' permanece em nota.
- source_word: אֶשָּׂא אֶת שְׁמוֹתָם עַל שְׂפָתָי
  choice: nem porei os nomes deles nos meus lábios
  rationale: נשא significa literalmente levantar ou tomar, mas com 'nomes' e 'lábios' comunica pronunciá-los. 'Porei ... nos meus lábios' conserva a imagem hebraica em português natural.
theological_decisions:
- issue: Referente implícito depois de אַחֵר ('outro')
  choice: outro deus
  alternative: outro
  rationale: As ofertas de bebida e a recusa de pronunciar nomes situam a frase no contexto da idolatria. Acrescentar 'deus' esclarece o referente implícito sem impor uma afirmação doutrinária adicional.
- issue: Sentido de עַצְּבוֹתָם
  choice: dores
  alternative: ídolos
  rationale: A leitura mais natural apresenta a multiplicação das dores como consequência para os idólatras. Como o vocábulo pode ser associado a ídolos em certos contextos, a alternativa é preservada em nota.
- issue: Referente de 'os nomes deles'
  choice: manter o pronome ambíguo
  alternative: explicitar 'os nomes desses deuses' ou 'os nomes dos adoradores'
  rationale: O hebraico permite relacionar os nomes aos outros deuses ou aos seus seguidores. O pronome conserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Ofertas de bebida' prioriza clareza popular; 'correm atrás' reproduz a ideia de busca ávida sem arcaísmo. A ordem poética foi mantida tanto quanto possível.
