  text: אָמַ֣רְתְּ לַֽ֭/יהוָה אֲדֹנָ֣/י אָ֑תָּה ט֝וֹבָתִ֗/י בַּל עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: pt
  text: 'Eu disse a Yahweh[a]: “Tu és o meu Senhor; não tenho bem algum além de ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Meu bem não está além de ti”, isto é, o bem do salmista não se estende para fora de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Eu disse
  rationale: Embora a forma consonantal pareça ser a segunda pessoa feminina singular, o contexto apresenta o salmista falando em primeira pessoa; as versões antigas e a tradição de tradução sustentam esse entendimento contextual.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da declaração, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אֲדֹנָי אָתָּה
  choice: Tu és o meu Senhor
  rationale: O substantivo com sufixo de primeira pessoa significa “meu Senhor”; o pronome explícito אָתָּה dá ênfase ao sujeito, reproduzida naturalmente em português.
- source_word: טוֹבָתִי
  choice: bem algum
  rationale: טוֹבָה pode indicar bem, benefício ou bem-estar. Nesta construção negativa, “bem algum” é idiomático e mantém a amplitude do termo sem sugerir mérito moral.
- source_word: בַּל עָלֶיךָ
  choice: não tenho ... além de ti
  rationale: A expressão poética compacta pode ser entendida literalmente como “meu bem não está além de ti”. A formulação escolhida comunica de modo natural que o bem do salmista não se encontra fora de Deus.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente diretamente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido da oração final
  choice: não tenho bem algum além de ti
  alternative: meu bem não está além de ti
  rationale: A opção principal comunica com clareza a dependência confessada pelo salmista, enquanto a nota conserva a estrutura mais formal e a ambiguidade espacial da expressão hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com a oração direta e a forma singular hebraica. A construção “bem algum” evita a possível leitura moral de “minha bondade”.
