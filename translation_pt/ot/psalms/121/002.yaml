source:
  edition: WLC
  text: עֶ֭זְרִ/י מֵ/עִ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: pt
  text: Meu socorro vem de Yahweh[a], o Criador dos céus e da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Meu socorro é da parte de Yahweh”. O hebraico não apresenta um verbo finito explícito na primeira oração; “vem” foi acrescentado para dar naturalidade em português.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “céus” tem forma plural. Também se pode dizer, de modo mais idiomático, “o céu e a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: Meu socorro
  rationale: עֵזֶר designa ajuda ou auxílio. “Meu socorro” é uma expressão natural, concisa e digna em português, adequada à confissão de dependência do salmista.
- source_word: מֵעִם
  choice: vem de
  rationale: A preposição indica a origem do socorro, literalmente “da parte de”. Como a primeira oração hebraica não traz verbo finito explícito, “vem de” expressa essa relação de origem de modo idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשֵׂה
  choice: o Criador
  rationale: O particípio apresenta Yahweh como aquele que faz ou cria. “O Criador” preserva de forma concisa sua força caracterizadora e funciona naturalmente como aposição em português.
- source_word: שָׁמַיִם
  choice: dos céus
  rationale: O substantivo hebraico tem forma plural. “Os céus” é natural em português bíblico atual e preserva esse traço do texto-fonte.
- source_word: וָאָרֶץ
  choice: e da terra
  rationale: Neste par abrangente com “os céus”, אֶרֶץ se refere à terra ou ao mundo, não a uma região específica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome divino. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força do particípio עֹשֵׂה
  choice: o Criador dos céus e da terra
  alternative: aquele que fez os céus e a terra; aquele que faz os céus e a terra
  rationale: O particípio pode caracterizar Yahweh como Criador, sem limitar a expressão a uma ação passada nem exigir que seja entendida como criação contínua.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. “Socorro” conserva o tom confessional do salmo; “Criador” oferece uma formulação natural e digna sem eliminar a força caracterizadora do particípio hebraico.
