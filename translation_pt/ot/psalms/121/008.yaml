  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: pt
  text: Yahweh guardará a sua saída e a sua entrada, desde agora e para sempre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh protegerá a sua partida e a sua chegada”. A expressão hebraica “saída e entrada” refere-se de modo amplo aos movimentos ou a todo o curso da vida de uma pessoa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de agora em diante e para sempre”.'
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִשְׁמָר
  choice: guardará
  rationale: O verbo שׁמר significa guardar, proteger ou vigiar. “Guardará” é claro e preserva a repetição lexical que estrutura o Salmo 121.
- source_word: צֵאתְךָ
  choice: a sua saída
  rationale: Reproduz de modo concreto o infinitivo com sufixo de segunda pessoa e mantém o paralelismo com “a sua entrada”.
- source_word: וּבוֹאֶךָ
  choice: e a sua entrada
  rationale: Conserva o par hebraico “saída e entrada”, um merismo que pode abranger os movimentos e toda a vida da pessoa.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Expressa naturalmente o ponto inicial presente indicado pela locução hebraica.
- source_word: וְעַד עוֹלָם
  choice: e para sempre
  rationale: Comunica a duração futura sem limite expressa por עוֹלָם, em linguagem portuguesa atual e poética.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o nome divino. “Yahweh” preserva sua função como nome próprio sem substituí-lo por um título.
- issue: Alcance da expressão “saída e entrada”
  choice: Preservar o merismo concreto
  alternative: Explicitar como “todos os seus caminhos” ou “toda a sua vida”
  rationale: A expressão provavelmente abrange o conjunto dos movimentos ou da vida da pessoa, mas a tradução mantém a imagem e a amplitude do hebraico sem restringi-la nem interpretá-la em excesso.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O paralelismo concreto do hebraico foi mantido, enquanto “desde agora e para sempre” oferece uma cadência natural.
