  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: pt
  text: Eis que[a] aquele que guarda Israel não cochila nem dorme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam: aquele que guarda Israel não cochilará nem dormirá.”'
    reason: Alternativa lexical para הִנֵּה e alternativa temporal possível para os verbos hebraicos.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz a afirmação com ênfase e chama a atenção para ela. “Eis que” preserva essa força dêitica em registro digno e amplamente compreensível.
- source_word: לֹא ... וְלֹא
  choice: não ... nem
  rationale: A construção correlativa reproduz com naturalidade as duas negações hebraicas coordenadas.
- source_word: יָנוּם
  choice: cochila
  rationale: Expressa sono leve ou sonolência e mantém a distinção lexical em relação ao verbo seguinte, que indica dormir.
- source_word: יִישָׁן
  choice: dorme
  rationale: É o verbo comum para dormir e preserva a progressão poética de cochilar para dormir.
- source_word: שֹׁמֵר
  choice: aquele que guarda
  rationale: O particípio funciona como substantivo. A formulação mantém o verbo “guardar”, central neste salmo, e soa mais natural em português do que “o guardador”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada do nome próprio.
theological_decisions:
- issue: Descrição antropomórfica da vigilância de Deus
  choice: Manter a imagem poética de que aquele que guarda Israel não cochila nem dorme.
  alternative: Explicitar abstratamente que Deus nunca fica desatento ou inativo.
  rationale: O paralelismo comunica vigilância incessante por meio de linguagem antropomórfica. A tradução conserva a imagem e sua tensão sem transformá-la numa formulação filosófica alheia ao verso.
- issue: Valor temporal dos verbos no imperfeito hebraico
  choice: 'Usar o presente geral: “não cochila nem dorme”.'
  alternative: 'Usar o futuro: “não cochilará nem dormirá”.'
  rationale: No contexto, a afirmação descreve uma característica constante daquele que guarda Israel. O futuro continua gramaticalmente possível e é registrado em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a solenidade poética sem recorrer a vocabulário obscuro; “cochila” distingue naturalmente o sono leve do sono pleno.
