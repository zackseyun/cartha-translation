  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: pt
  text: Yahweh guardará você de todo mal; guardará a sua vida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua alma”. O hebraico néfesh pode significar “vida”, “pessoa” ou “alma”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: guardará você / guardará
  rationale: O verbo שׁמר significa guardar, proteger ou vigiar. A repetição de “guardará” mantém a repetição temática e estilística do hebraico.
- source_word: מִכָּל רָע
  choice: de todo mal
  rationale: Conserva a amplitude de רָע, que pode abranger tanto o mal quanto dano, adversidade ou calamidade, sem restringir o sentido apenas ao perigo físico.
- source_word: נַפְשֶׁךָ
  choice: a sua vida
  rationale: Neste contexto, נֶפֶשׁ pode designar a vida ou a própria pessoa. “A sua vida” é natural em português e evita impor uma distinção antropológica mais estreita do que o hebraico exige.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” o preserva como nome próprio, sem o substituir por um título.
- issue: Sentido de נַפְשֶׁךָ
  choice: a sua vida
  alternative: a sua alma; a sua pessoa
  rationale: “Vida” expressa adequadamente o uso de נֶפֶשׁ para o ser vivente ou para a vida, enquanto a nota conserva a alternativa tradicional “alma” e a ambiguidade lexical.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A construção “guardará você” evita regionalizar o pronome como “tu” e conserva a repetição deliberada do verbo hebraico.
