  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: pt
  text: De dia, o sol não ferirá você[a], nem a lua, de noite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fará mal a você”. O verbo hebraico significa literalmente “golpear” ou “ferir”, mas, neste contexto, pode indicar causar dano.'
    reason: lexical_alternative
  - marker: b
    text: O par “de dia... de noite” expressa proteção abrangente em todo tempo; o sol e a lua podem ser entendidos literalmente, figuradamente ou de ambas as maneiras.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: De dia
  rationale: Expressa naturalmente o valor adverbial temporal e forma paralelo claro com “de noite”.
- source_word: הַשֶּׁמֶשׁ
  choice: o sol
  rationale: Correspondência nominal direta, mantendo a imagem concreta do hebraico.
- source_word: לֹא
  choice: não
  rationale: Preserva a negação que rege o verbo e, por paralelismo, também o segundo membro.
- source_word: יַכֶּכָּה
  choice: ferirá você
  rationale: O verbo נכה significa literalmente “golpear/ferir”. “Ferirá” conserva a imagem concreta e pode também comunicar efeito nocivo, sem a rigidez de “golpeará” nem a explicitação interpretativa de “fará mal”.
- source_word: וְיָרֵחַ
  choice: nem a lua
  rationale: Em português, “nem” expressa naturalmente que a negação do primeiro membro se estende ao segundo.
- source_word: בַּלָּיְלָה
  choice: de noite
  rationale: Mantém a antítese temporal e o paralelismo poético com “de dia”.
theological_decisions:
- issue: Natureza da proteção prometida
  choice: Manter as imagens concretas do sol e da lua sem definir se são literais, figuradas ou ambas.
  alternative: Explicitar proteção contra danos ambientais, afirmar proteção total em todo tempo ou introduzir possível alusão a temores antigos ligados à lua.
  rationale: O paralelismo dia/noite pode funcionar como expressão abrangente, mas o texto conserva imagens cósmicas concretas. A tradução não deve eliminar essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ferirá você” preserva a concretude do hebraico sem recorrer ao arcaísmo “ferir-te-á”; a pontuação destaca o paralelismo poético.
