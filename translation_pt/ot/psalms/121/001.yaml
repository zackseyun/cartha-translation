  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: pt
  text: 'Cântico das Subidas. Elevo os meus olhos para os montes[a]: de onde virá o meu socorro?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “montanhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz diretamente o substantivo que designa um cântico, sem impor o rótulo de gênero mais específico “salmo”.
- source_word: לַמַּעֲלוֹת
  choice: de peregrinação
  rationale: A expressão hebraica significa literalmente algo como “das subidas”. No título tradicional destes salmos, pode designar as subidas dos peregrinos; a formulação portuguesa é clara, sem especificar destino ou cenário litúrgico.
- source_word: אֶשָּׂא
  choice: Elevo
  rationale: O imperfeito qal na primeira pessoa apresenta poeticamente a ação do salmista; “elevo” é atual, natural e preserva o tom elevado.
- source_word: עֵינַי
  choice: os meus olhos
  rationale: Correspondência direta do substantivo com sufixo de primeira pessoa, em ordem idiomática no português.
- source_word: אֶל
  choice: para
  rationale: Expressa com naturalidade a direção do olhar.
- source_word: הֶהָרִים
  choice: os montes
  rationale: הָרִים pode designar montes ou montanhas. “Montes” é natural no registro bíblico português e mantém a imagem sem definir sua possível função simbólica.
- source_word: מֵאַיִן
  choice: de onde
  rationale: Reproduz de modo claro e moderno a pergunta pela origem do socorro.
- source_word: יָבֹא
  choice: virá
  rationale: O imperfeito de בוא tem aqui sentido prospectivo e, com מֵאַיִן, forma naturalmente uma pergunta direta.
- source_word: עֶזְרִי
  choice: o meu socorro
  rationale: “Socorro” é uma tradução concisa e idiomática de עֵזֶר neste contexto, preservando sua força e ressonância poética.
theological_decisions:
- issue: Se a segunda oração deve ser traduzida como afirmação ou pergunta retórica
  choice: 'Pergunta direta: “de onde virá o meu socorro?”'
  alternative: Afirmação subordinada, como “de onde vem o meu socorro”
  rationale: מֵאַיִן seguido do imperfeito יָבֹא forma mais naturalmente uma pergunta. Assim se preserva a tensão poética que o versículo seguinte responde.
- issue: Sentido simbólico dos montes
  choice: Manter “os montes” sem explicação interpretativa no texto
  alternative: Identificá-los com Sião, com lugares de culto pagão ou com locais de perigo
  rationale: O hebraico não determina neste versículo se os montes têm valor positivo, negativo ou apenas geográfico; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O título usa a formulação corrente “Cântico de peregrinação”; a nota preserva a alternativa lexical para הֶהָרִים.
