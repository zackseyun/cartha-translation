source:
  edition: WLC
  text: יְהוָ֥ה שֹׁמְרֶ֑/ךָ יְהוָ֥ה צִ֝לְּ/ךָ֗ עַל יַ֥ד יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: pt
  text: Yahweh é quem guarda você; Yahweh é a sua sombra[a] à sua direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a sombra protetora que está bem ao seu lado.
    reason: Esclarece o valor protetor da imagem hebraica sem substituí-la no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֹׁמְרֶךָ
  choice: quem guarda você
  rationale: O particípio de שׁמר expressa ação contínua. A formulação mantém o verbo “guardar”, central e recorrente no Salmo 121, e soa natural no português atual.
- source_word: צִלְּךָ
  choice: a sua sombra
  rationale: צל designa literalmente sombra, aqui com valor protetor, como alívio contra o calor do sol. A tradução conserva a imagem concreta sem reduzi-la ao conceito abstrato de proteção.
- source_word: עַל יַד יְמִינֶךָ
  choice: à sua direita
  rationale: A expressão indica proximidade ao lado direito. “À sua direita” é a forma portuguesa natural de comunicar essa posição imediata, embora não reproduza explicitamente o substantivo “mão”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico emprega diretamente o nome divino. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar outra forma tradicional portuguesa.
- issue: Sentido metafórico de צל
  choice: sombra protetora, mantendo “sombra” no texto
  alternative: proteção; abrigo
  rationale: A metáfora apresenta Yahweh como sombra próxima que protege. Mantê-la evita explicitar em excesso a maneira exata dessa proteção.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção “quem guarda você” evita o tom excessivamente técnico de “guardião” e preserva a repetição temática do verbo guardar no salmo. O paralelismo das duas ocorrências de “Yahweh” foi mantido.
