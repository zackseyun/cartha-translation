  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: pt
  text: Ele não deixará que o seu pé vacile[b][a]; aquele que guarda você não cochilará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Que ele não deixe o seu pé vacilar; que aquele que guarda você não cochile». As formas hebraicas podem ser entendidas tanto como desejo ou oração quanto como afirmação segura.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «escorregue», «cambaleie» ou «se abale».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: não deixará / não cochilará
  rationale: Com os verbos no imperfeito, pode ter força volitiva («que não...»), mas o contexto de confiança do salmo favorece em português a declaração segura no futuro; a possibilidade de oração ou desejo é preservada em nota.
- source_word: יִתֵּן
  choice: deixará
  rationale: Embora נתן signifique literalmente «dar», nesta construção expressa permitir. «Não deixará que» é idiomático em português.
- source_word: לַמּוֹט
  choice: vacile
  rationale: מוֹט descreve perda de estabilidade, podendo significar escorregar, cambalear ou ser abalado. «Vacile» preserva a imagem ampla sem a restringir a um escorregão literal.
- source_word: רַגְלֶךָ
  choice: o seu pé
  rationale: Mantém o singular concreto do hebraico e soa naturalmente na imagem de firmeza ao caminhar.
- source_word: יָנוּם
  choice: cochilará
  rationale: נוּם indica sonolência ou sono leve, não necessariamente sono profundo. «Cochilar» é claro e prepara o paralelismo ampliado do versículo seguinte.
- source_word: שֹׁמְרֶךָ
  choice: aquele que guarda você
  rationale: שׁמר reúne as ideias de guardar, vigiar e proteger. A formulação verbal é natural no português moderno e permite conservar a repetição temática de «guardar» ao longo do salmo.
theological_decisions:
- issue: Força de אַל com os verbos no imperfeito
  choice: 'Afirmação de confiança: «Ele não deixará... não cochilará»'
  alternative: 'Oração ou desejo: «Que ele não deixe... que aquele que guarda você não cochile»'
  rationale: O contexto do salmo enfatiza a segurança da proteção do SENHOR, favorecendo a leitura declarativa. Contudo, as formas hebraicas também admitem nuance volitiva, explicitada na nota para não eliminar a tensão.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira. «Aquele que guarda você» evita o substantivo pouco natural «guardador» e conserva a palavra-chave do salmo. A ordem dos marcadores [b][a] segue sua ligação imediata: primeiro a alternativa lexical de «vacile», depois a alternativa sintática de todo o versículo.'
