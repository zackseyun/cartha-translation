  text: A Song of Ascents[a]. I lift up my eyes to the mountains; from where will my help come?
translation:
  language: pt
  text: Cântico das Subidas. Levanto os olhos para os montes[a]; de onde virá o meu socorro?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as colinas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: A expressão designa a coleção tradicionalmente associada às subidas a Jerusalém. “De peregrinação” comunica naturalmente essa função em português, sem limitar o sentido à subida física.
- source_word: הֶהָרִים
  choice: os montes
  rationale: “Montes” reproduz o plural e a referência ao relevo elevado, mantendo uma formulação natural e tradicional em português; “colinas” também é possível conforme o contexto.
- source_word: עֶזְרִי
  choice: meu socorro
  rationale: “Socorro” expressa ajuda em situação de necessidade e corresponde de modo idiomático ao substantivo hebraico עֵזֶר.
theological_decisions:
- issue: Possível origem do socorro nos montes
  choice: 'Preservar a pergunta aberta: “de onde virá o meu socorro?”'
  alternative: Pontuar ou reformular de modo a afirmar que o socorro vem dos montes
  rationale: O hebraico apresenta uma pergunta, cuja resposta aparece no versículo seguinte. A tradução não antecipa nem resolve essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “Cântico” e “socorro” preservando a tonalidade poética. O ponto e vírgula mantém a ligação entre o gesto de olhar e a pergunta subsequente.
