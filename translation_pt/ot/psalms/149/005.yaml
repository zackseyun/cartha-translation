source:
  edition: WLC
  text: יַעְלְז֣וּ חֲסִידִ֣ים בְּ/כָב֑וֹד יְ֝רַנְּנ֗וּ עַל מִשְׁכְּבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/005.yaml
  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: pt
  text: Exultem os fiéis na glória[a]; cantem de alegria em suas camas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na honra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “deem gritos de alegria em suas camas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: Exultem
  rationale: O imperfeito de valor volitivo, em paralelismo poético, funciona como exortação. “Exultem” preserva a intensidade celebrativa e o registro elevado.
- source_word: חֲסִידִים
  choice: os fiéis
  rationale: O termo designa pessoas caracterizadas por lealdade e devoção no âmbito da aliança. “Os fiéis” é claro em português atual e evita transformar o termo numa categoria eclesiástica técnica.
- source_word: בְּכָבוֹד
  choice: na glória
  rationale: A construção com בְּ pode indicar a esfera ou condição da exultação. “Na glória” mantém o peso poético de כָּבוֹד, sem excluir a possível nuance de honra.
- source_word: יְרַנְּנוּ
  choice: cantem de alegria
  rationale: No piel, רנן expressa uma manifestação vocal intensa de alegria, muitas vezes em canto. A formulação é natural no contexto de louvor do salmo.
- source_word: עַל
  choice: em
  rationale: Diante de “camas”, o português idiomático emprega “em”, correspondendo ao sentido locativo de estar sobre ou deitado nelas.
- source_word: מִשְׁכְּבוֹתָם
  choice: suas camas
  rationale: O substantivo indica lugares onde alguém se deita; “camas” é o equivalente direto e corrente neste contexto.
theological_decisions:
- issue: Tradução de חֲסִידִים
  choice: os fiéis
  alternative: os piedosos; os leais; os santos
  rationale: A expressão aponta para os que demonstram lealdade e devoção a Deus no âmbito da aliança, sem exigir a leitura técnica posterior que “os santos” poderia sugerir.
- issue: Sentido de בְּכָבוֹד
  choice: na glória
  alternative: na honra; por causa da glória
  rationale: Foi preservada a leitura mais direta da preposição como esfera ou condição, mantendo em nota a ambiguidade entre “glória” e “honra” em vez de resolvê-la teologicamente.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito lusófono mais amplo. O paralelismo exortativo foi preservado com dois verbos no presente do subjuntivo. “Exultem” mantém o tom poético; “cantem de alegria” comunica de forma acessível a expressão vocal jubilosa.
