  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
translation:
  language: pt
  text: Na garganta deles estão altos louvores a Deus[a], e em sua mão há uma espada de dois gumes[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as exaltações de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma espada de dois fios”. Literalmente, “uma espada de duas bocas”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz “em sua mão”; o singular pode ter sentido distributivo ou coletivo. Também seria possível traduzir “em suas mãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: altos louvores
  rationale: O substantivo plural derivado de רומם indica louvores elevados ou exaltações. “Altos louvores” conserva o sentido de enaltecimento em linguagem poética compreensível.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל é um título divino que se refere ao Deus de Israel; “Deus” é a tradução natural em português.
- source_word: בִּגְרוֹנָם
  choice: na garganta deles
  rationale: גרון significa literalmente “garganta”. A tradução direta preserva a imagem corporal vívida do louvor que sai deles, sem substituí-la interpretativamente por “boca”.
- source_word: וְחֶרֶב
  choice: e ... uma espada
  rationale: A conjunção introduz o segundo membro paralelo, e o substantivo tem sentido indefinido no contexto.
- source_word: פִּיפִיּוֹת
  choice: de dois gumes
  rationale: A expressão designa uma espada com dois fios ou gumes. “De dois gumes” é idiomático, claro e preserva a imagem hebraica.
- source_word: בְּיָדָם
  choice: na mão deles
  rationale: O hebraico emprega “mão” no singular com sufixo plural, uso distributivo ou coletivo. A forma singular mantém a correspondência formal, embora “nas mãos deles” também seja possível em português.
theological_decisions:
- issue: Imagem militar unida à adoração
  choice: Manter lado a lado os altos louvores e a espada, sem suavizar nenhuma das imagens.
  alternative: Interpretar a espada metaforicamente no texto principal.
  rationale: O hebraico apresenta a imagem marcial em paralelo poético com o louvor. A tradução preserva essa tensão teológica em vez de resolvê-la por interpretação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética. Conserva-se a imagem literal da “garganta” e o singular coletivo “mão”. A ordem verbal “Estejam” reflete a construção nominal elíptica do verso e sua força poética.
