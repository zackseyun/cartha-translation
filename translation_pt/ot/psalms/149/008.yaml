base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: pt
  text: para prender os reis deles com correntes e os seus homens ilustres com grilhões de ferro,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאְסֹר
  choice: para prender
  rationale: O infinitivo construto expressa propósito em ligação com o versículo anterior. “Prender” é natural em português e conserva a ideia concreta de sujeitar, sem restringir o sentido ao encarceramento formal.
- source_word: מַלְכֵיהֶם
  choice: os reis deles
  rationale: מֶלֶךְ designa especificamente um rei. A formulação mantém o sufixo possessivo e evita ampliar o sentido para governantes em geral.
- source_word: בְּזִקִּים
  choice: com correntes
  rationale: זִקִּים indica correntes ou instrumentos de contenção. “Com correntes” é claro, concreto e idiomático com “prender”.
- source_word: וְנִכְבְּדֵיהֶם
  choice: e os seus homens ilustres
  rationale: A forma deriva de כבד e designa pessoas de peso social, honradas ou eminentes. “Homens ilustres” preserva o masculino plural e a noção de destaque social sem pressupor uma classe nobiliárquica formal.
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: com grilhões de ferro
  rationale: כבל refere-se a laços ou grilhões. A escolha distingue o termo das “correntes” da primeira linha e mantém a forte imagem de contenção feita de ferro.
theological_decisions:
- issue: Representação do masculino plural em וְנִכְבְּדֵיהֶם
  choice: os seus homens ilustres
  alternative: os seus nobres
  rationale: O hebraico está no masculino plural. A tradução o conserva e comunica proeminência social, sem neutralizar o gênero nem definir de modo excessivo o grupo como nobreza hereditária.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Os reis deles” evita a possível ambiguidade de “seus reis” no primeiro membro; “os seus homens ilustres” retoma naturalmente o mesmo referente. Não se acrescentou nota, pois “homens ilustres” comunica adequadamente a amplitude lexical no texto.
