  text: לַ/עֲשׂ֤וֹת בָּ/הֶ֨ם מִשְׁפָּ֬ט כָּת֗וּב הָדָ֣ר ה֭וּא לְ/כָל חֲסִידָ֗י/ו הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: pt
  text: para executar contra eles a sentença escrita[a]. Essa é uma honra para todos os seus fiéis[b]. Louvem Yah![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o julgamento escrito”, isto é, o julgamento já registrado ou determinado por Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus fiéis”; tradicionalmente, “seus santos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Louvem Yah” (halelu-yah); tradicionalmente transliterado “Aleluia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: executar
  rationale: Com מִשְׁפָּט e o contexto marcial, indica cumprir ou aplicar uma sentença judicial, não apenas fazer algo.
- source_word: בָּהֶם
  choice: contra eles
  rationale: Expressa que as nações e os reis mencionados anteriormente são os alvos da execução da sentença; em português, 'contra eles' é natural neste contexto judicial.
- source_word: מִשְׁפָּט כָּתוּב
  choice: a sentença escrita
  rationale: '''Sentença'' comunica aqui o ato ou veredito judicial específico, enquanto ''escrita'' preserva a imagem textual explícita do particípio hebraico.'
- source_word: הָדָר
  choice: uma honra
  rationale: No contexto, designa a dignidade ou distinção concedida ao povo fiel; a construção com artigo indefinido é natural em português.
- source_word: חֲסִידָיו
  choice: seus fiéis
  rationale: Comunica pessoas caracterizadas por fidelidade e devoção, sem as possíveis associações eclesiásticas posteriores de 'santos'.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz o imperativo plural e translitera a forma abreviada do nome divino, preservando tanto o sentido quanto a forma hebraica.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ na fórmula litúrgica final
  choice: Yah
  alternative: o SENHOR; Aleluia
  rationale: O texto traz a forma abreviada יָהּ, não o tetragrama completo. 'Yah' preserva o nome presente no hebraico, enquanto a tradução do imperativo torna clara a força da fórmula.
- issue: Referente e valor de הָדָר
  choice: Essa é uma honra para todos os seus fiéis
  alternative: Essa honra pertence a todos os seus fiéis; Isso é esplendor para todos os seus santos
  rationale: O demonstrativo pode resumir a execução da sentença descrita anteriormente. 'Honra' preserva a ideia de distinção conferida sem acrescentar uma explicação teológica não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético e o tom judicial do contexto. 'Sentença escrita' soa mais idiomático em português do que 'julgamento escrito', que permanece registrado em nota. Todos os marcadores de nota aparecem no texto principal.
