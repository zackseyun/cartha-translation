  text: יִשְׂמַ֣ח יִשְׂרָאֵ֣ל בְּ/עֹשָׂ֑י/ו בְּנֵֽי צִ֝יּ֗וֹן יָגִ֥ילוּ בְ/מַלְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/002.yaml
  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: pt
  text: Alegre-se Israel naquele que o fez[a]; exultem os filhos de Sião em seu Rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “naqueles que o fizeram” ou “em seus criadores”; a forma plural é geralmente entendida aqui como referência a Deus, que fez Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “em seu rei”, caso se entenda a expressão como referência a um rei terreno, e não a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Alegre-se
  rationale: O imperfeito qal de שׂמח tem aqui valor exortativo; “alegre-se” expressa isso com naturalidade e dignidade em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio tradicional do povo da aliança.
- source_word: בְּעֹשָׂיו
  choice: naquele que o fez
  rationale: A forma hebraica é morfologicamente plural, mas neste contexto refere-se naturalmente a Deus como criador de Israel. A formulação verbal evita rigidez e mantém o sentido singular, enquanto a nota registra o número hebraico.
- source_word: בְּנֵי צִיּוֹן
  choice: os filhos de Sião
  rationale: Traduz literalmente a expressão masculina plural, que designa coletivamente o povo de Sião.
- source_word: יָגִילוּ
  choice: exultem
  rationale: O verbo גיל exprime alegria jubilosa e é mais intenso que o verbo do primeiro membro; “exultem” preserva a força poética.
- source_word: בְמַלְכָּם
  choice: em seu Rei
  rationale: A preposição marca aquele em quem se exulta. “Seu” é natural em português e corresponde ao sufixo plural hebraico; a inicial maiúscula indica a leitura contextual de Deus como referente.
theological_decisions:
- issue: Referente de “seu Rei”
  choice: Deus é o Rei em vista
  alternative: Um rei terreno de Israel
  rationale: O paralelismo imediato entre aquele que fez Israel e o Rei dos filhos de Sião favorece fortemente a referência divina. A alternativa possível é preservada em nota.
- issue: Número de בְּעֹשָׂיו
  choice: 'Sentido singular: “naquele que o fez”'
  alternative: 'Tradução formal no plural: “naqueles que o fizeram” ou “em seus criadores”'
  rationale: Embora a forma hebraica seja plural, o contexto a aplica naturalmente ao Deus de Israel. O texto principal evita sugerir vários criadores, mas a forma original é documentada em nota.
translation_notes:
  register: Português moderno, claro e poeticamente digno, com boa legibilidade brasileira. O paralelismo foi preservado, assim como a diferença de intensidade entre “alegre-se” e “exultem”. Os marcadores aparecem no ponto exato das ambiguidades relevantes.
