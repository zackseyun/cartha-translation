  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: pt
  text: 'Louvem a Yah![a]


    Cantem a Yahweh um cântico novo;


    cantem o seu louvor na assembleia dos fiéis.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, halelu-Yah, literalmente «Louvem a Yah»; daí vem a forma «Aleluia».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o seu louvor na assembleia dos fiéis». Para «fiéis», também são possíveis «piedosos», «leais» ou «santos».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: O imperativo plural de הלל dirige a exortação à comunidade; יָהּ é preservado como a forma abreviada do nome divino. Em português, a regência natural é «louvar a».
- source_word: שִׁירוּ לַיהוָה
  choice: Cantem a Yahweh
  rationale: O imperativo plural שִׁירוּ é traduzido diretamente, e a preposição ל indica aquele a quem se canta. Mantém-se Yahweh para יהוה, distinguindo-o da forma breve Yah no início.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Expressão tradicional e clara no registro poético dos Salmos; «cântico» preserva a ressonância litúrgica sem dificultar a leitura.
- source_word: תְּהִלָּתוֹ
  choice: o seu louvor ressoe
  rationale: Literalmente, «seu louvor». Como o hebraico apresenta uma continuação sem verbo explícito, «ressoe» torna a exortação natural em português sem definir rigidamente se a expressão é objeto implícito, aposição ou aclamação.
- source_word: בִּקְהַל
  choice: na assembleia
  rationale: קהל designa a comunidade reunida. «Assembleia» conserva o caráter coletivo sem impor conotação eclesiástica específica.
- source_word: חֲסִידִים
  choice: dos fiéis
  rationale: O termo descreve pessoas marcadas por devoção e lealdade, especialmente no âmbito da aliança. «Fiéis» comunica essa ideia de modo atual e evita as conotações técnicas posteriores de «santos».
theological_decisions:
- issue: As formas divinas יָהּ e יהוה no mesmo versículo
  choice: Yah e Yahweh, respectivamente
  alternative: Traduzir ambas por «Senhor» ou empregar «Aleluia» para a primeira
  rationale: O hebraico usa deliberadamente a forma breve Yah e a forma plena do nome divino. Preservar ambas reflete essa distinção e evita ocultar o nome próprio.
- issue: Sentido de חֲסִידִים
  choice: fiéis
  alternative: piedosos, leais ou santos
  rationale: «Fiéis» equilibra devoção religiosa e lealdade à aliança sem introduzir uma categoria eclesiástica posterior. A nota registra alternativas legítimas.
- issue: Relação sintática de תְּהִלָּתוֹ com a exortação anterior
  choice: Explicitar poeticamente «o seu louvor ressoe»
  alternative: «seu louvor na assembleia dos fiéis», sem verbo, ou entender «seu louvor» como objeto implícito de «cantem»
  rationale: O texto hebraico é conciso e não traz verbo nesta unidade. A formulação portuguesa produz uma linha inteligível, mas a nota preserva a abertura sintática do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético em três linhas. Os nomes Yah e Yahweh são mantidos; «cântico» conserva o tom salmódico. A pequena explicitação verbal «ressoe» favorece a naturalidade, enquanto a nota preserva a concisão e a ambiguidade sintática do hebraico.
