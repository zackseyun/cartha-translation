  text: לַ/עֲשׂ֣וֹת נְ֭קָמָה בַּ/גּוֹיִ֑ם תּֽ֝וֹכֵחֹ֗ת בַּל אֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/007.yaml
  text: to execute vengeance on the nations[a], punishments on the peoples,
translation:
  language: pt
  text: para executar vingança contra as nações e aplicar castigos aos povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repreensões” ou “correções aos povos”. O termo hebraico pode indicar repreensões ou correções, mas, neste contexto, provavelmente tem sentido judicial, em paralelo com “vingança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: para executar
  rationale: O infinitivo construto com ל expressa propósito. Com נְקָמָה como objeto, “executar” é natural em português e comunica a realização efetiva do juízo.
- source_word: נְקָמָה
  choice: vingança
  rationale: O substantivo designa vingança ou ato de vingar em contexto judicial ou bélico. “Vingança” preserva a força e a tensão do hebraico sem atenuação interpretativa.
- source_word: בַּגּוֹיִם
  choice: contra as nações
  rationale: Nesse contexto, ב marca o alvo da vingança. “Contra” é idiomático em português e deixa clara a direção da ação.
- source_word: תּוֹכֵחוֹת
  choice: castigos
  rationale: Embora o termo também possa significar repreensões ou correções, o paralelismo com “vingança” e o contexto judicial e bélico favorecem aqui um sentido penal concreto.
- source_word: בַּל
  choice: contra
  rationale: A forma poética introduz o alvo da segunda ação e mantém o paralelismo com בַּגּוֹיִם.
- source_word: אֻמִּים
  choice: os povos
  rationale: “Povos” preserva o plural coletivo e distingue este termo de גּוֹיִם, traduzido como “nações”.
theological_decisions:
- issue: Se a linguagem de juízo deve ser suavizada para evitar atribuir vingança e castigo ao povo de Deus
  choice: Manter a linguagem forte de “vingança” e “castigos”
  alternative: Empregar termos mais brandos, como “justiça”, “repreensões” ou “correções”
  rationale: O hebraico emprega linguagem vigorosa de juízo em contexto marcial. Suavizá-la resolveria indevidamente a tensão teológica presente no salmo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Executar vingança” conserva o tom judicial e poético; a repetição de “contra” explicita o paralelismo hebraico de modo natural.
