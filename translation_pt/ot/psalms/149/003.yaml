  yaml_path: translation/ot/psalms/149/003.yaml
  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: pt
  text: Louvem o seu nome com dança[a]; com tamborim e lira[c], façam música a ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a dança”. O hebraico מָחוֹל pode indicar tanto o ato de dançar quanto uma dança ou forma de dança.
    reason: lexical_alternative
  - marker: b
    text: Ou “cantem louvores a ele”. O verbo hebraico זמר pode referir-se tanto ao louvor cantado quanto à execução de música instrumental.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “harpa”. O hebraico כִּנּוֹר designa mais especificamente um instrumento de cordas semelhante à lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַֽלְל֣וּ
  choice: Louvem
  rationale: O piel imperfeito tem força exortativa no contexto poético. O imperativo português comunica essa convocação de modo natural e digno.
- source_word: שְׁמ֣וֹ
  choice: o seu nome
  rationale: Preserva a referência explícita ao “nome”, expressão bíblica que representa a pessoa tal como é conhecida e honrada.
- source_word: בְמָחוֹל
  choice: com dança
  rationale: מָחוֹל pode designar a atividade de dançar ou uma dança; “com dança” é natural em português e mantém essa amplitude básica.
- source_word: בְּתֹף
  choice: com tamborim
  rationale: תֹף designa um instrumento de percussão semelhante a um tambor de armação ou tamborim; “tamborim” é uma equivalência moderna e compreensível.
- source_word: וְכִנּוֹר
  choice: e lira
  rationale: כִּנּוֹר era um instrumento antigo de cordas mais próximo da lira do que da harpa moderna.
- source_word: יְזַמְּרוּ
  choice: façam música
  rationale: No piel, זמר pode abranger música vocal de louvor e execução instrumental. Como o verso nomeia instrumentos, “façam música” preserva melhor essa abrangência.
- source_word: לוֹ
  choice: para ele
  rationale: A preposição ל marca aqui o destinatário da música de louvor; “para ele” é idiomático em português.
