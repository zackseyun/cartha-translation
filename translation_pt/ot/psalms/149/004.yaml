source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: pt
  text: Pois Yahweh se agrada do seu povo; ele adorna os humildes com salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com livramento» ou «com vitória». O termo hebraico pode indicar salvação, resgate, livramento ou vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor no contexto e conserva de modo natural a força explicativa do hebraico.
- source_word: רוֹצֶה
  choice: se agrada de
  rationale: Neste contexto, רצה expressa prazer e favor dirigidos a alguém, e não simples vontade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַמּוֹ
  choice: do seu povo
  rationale: A preposição ב com רצה marca aquilo ou aqueles em quem se tem prazer; em português, «agradar-se de» comunica esse sentido naturalmente.
- source_word: יְפָאֵר
  choice: adorna
  rationale: O piel de פאר comunica a ideia de embelezar ou conferir honra; «adorna» preserva a imagem sem impor a noção mais específica de coroação.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar humildes, mansos ou socialmente abatidos; «os humildes» é claro, atual e mantém a principal nuance ética e devocional.
- source_word: בִּישׁוּעָה
  choice: com salvação
  rationale: ישועה abrange salvação, livramento e, conforme o contexto, vitória. «Com salvação» preserva a amplitude do termo e se integra à imagem de adornar.
theological_decisions:
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração «Yahweh» conserva essa condição de nome próprio.
- issue: Sentido de יְשׁוּעָה neste salmo de louvor
  choice: salvação
  alternative: livramento ou vitória
  rationale: «Salvação» preserva a abrangência teológica e concreta do termo, sem excluir resgate nem triunfo. As possibilidades contextuais são mantidas em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética clara. Conserva o paralelismo do verso, o nome divino e a imagem de Yahweh adornando os humildes.
