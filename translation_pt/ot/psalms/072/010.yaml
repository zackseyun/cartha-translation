source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: pt
  text: Que os reis de Társis e das regiões costeiras tragam tributo; que os reis de Sabá e Sebá apresentem presentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: Társis
  rationale: Transliteração portuguesa tradicional do topônimo, preservando a referência geográfica antiga sem identificação especulativa.
- source_word: אִיִּים
  choice: regiões costeiras
  rationale: O plural pode designar ilhas ou terras litorâneas; esta formulação natural preserva a abrangência geográfica do termo.
- source_word: מִנְחָה
  choice: tributo
  rationale: No contexto de reis que homenageiam o soberano, indica uma dádiva de submissão ou homenagem, não apenas uma oferta cultual.
- source_word: יָשִׁיבוּ
  choice: tragam
  rationale: Embora o verbo costume significar 'fazer voltar' ou 'retribuir', com tributo assume idiomaticamente o sentido de entregá-lo; 'tragam' é natural em português.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma portuguesa consagrada do antigo reino mencionado no texto.
- source_word: סְבָא
  choice: Sebá
  rationale: Mantém este nome distinto de Sabá, conforme o hebraico e a tradição portuguesa.
- source_word: אֶשְׁכָּר
  choice: presentes
  rationale: Designa dádivas ou presentes oferecidos, em paralelismo com o tributo da primeira linha.
- source_word: יַקְרִיבוּ
  choice: apresentem
  rationale: Expressa a ação de aproximar ou oferecer as dádivas diante do rei, sem impor aqui uma conotação sacrificial.
theological_decisions:
- issue: Força verbal dos imperfeitos hebraicos
  choice: Que ... tragam; que ... apresentem
  alternative: Os reis ... trarão; os reis ... apresentarão
  rationale: O contexto poético de Salmo 72 favorece a leitura jussiva como desejo ou petição pelo reinado ideal, embora a forma também possa ser entendida como previsão.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. Os topônimos tradicionais são mantidos, e não se acrescentam identificações geográficas ou interpretações messiânicas ausentes do versículo.
