base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: pt
  text: De Salomão.[a] Ó Deus, dá ao rei os teus juízos e ao filho do rei a tua justiça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Para Salomão» ou «A Salomão», no título.
    reason: alternative_reading
  - marker: b
    text: «A tua justiça» também pode ser traduzido por «a tua retidão».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: De Salomão
  rationale: A preposição לְ no cabeçalho admite relação de autoria, dedicação ou destinatário. «De Salomão» é natural como título tradicional, enquanto a nota preserva as demais possibilidades.
- source_word: מִשְׁפָּטֶיךָ
  choice: os teus juízos
  rationale: O plural hebraico aponta para decisões, critérios ou atos judiciais de Deus; «juízos» preserva o número e evita fundi-lo com o substantivo seguinte.
- source_word: צִדְקָתְךָ
  choice: a tua justiça
  rationale: צְדָקָה abrange retidão e justiça, inclusive a ação justa. «Justiça» é clara no contexto régio sem eliminar a alternativa «retidão», registrada em nota.
- source_word: בֶן־מֶלֶךְ
  choice: filho do rei
  rationale: Tradução direta da construção hebraica, mantendo a possível referência ao herdeiro real sem identificá-lo além do texto.
theological_decisions:
- issue: Relação entre o rei e o filho do rei
  choice: Manter as duas designações sem afirmar se se referem à mesma pessoa ou a pessoas distintas.
  alternative: Interpretar ambas explicitamente como Salomão ou como o rei messiânico.
  rationale: O paralelismo hebraico permite sobreposição referencial, mas não resolve de modo explícito a identidade; a tradução preserva essa abertura.
- issue: Origem divina da justiça régia
  choice: Conservar a petição para que Deus dê seus juízos e sua justiça ao governante.
  alternative: Parafrasear como simples capacitação moral do rei.
  rationale: O texto apresenta tais qualidades como provenientes de Deus, sem explicar o mecanismo ou desenvolver uma doutrina política.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construção paralela próxima do hebraico. O vocativo «Ó Deus» torna explícita a invocação, e os possessivos «teus/tua» mantêm o registro bíblico corrente e legível no Brasil.
