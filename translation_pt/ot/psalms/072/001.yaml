  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: pt
  text: 'De Salomão.[a]


    Ó Deus, dá ao rei os teus juízos,

    e ao filho do rei, a tua justiça.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Para Salomão” ou “A Salomão”, no título.
    reason: alternative_reading
  - marker: b
    text: O termo traduzido por “justiça” também pode ser entendido como “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: De Salomão
  rationale: O לְ em títulos de salmos pode indicar autoria, dedicação ou associação. “De Salomão” é natural em português e mantém em aberto essas relações; as alternativas são registradas em nota.
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo na oração; “Ó Deus” expressa claramente o apelo direto.
- source_word: מִשְׁפָּטֶיךָ
  choice: os teus juízos
  rationale: O plural hebraico pode designar julgamentos, decisões judiciais ou o discernimento justo que procede de Deus. “Juízos” conserva tanto o plural quanto a dimensão judicial.
- source_word: לְמֶלֶךְ
  choice: ao rei
  rationale: Reproduz de modo direto o destinatário daquilo que se pede a Deus.
- source_word: תֵּן
  choice: dá
  rationale: Equivalente simples e direto do imperativo hebraico, apropriado ao tom de oração.
- source_word: וְצִדְקָתְךָ
  choice: e a tua justiça
  rationale: צְדָקָה reúne dimensões de retidão e justiça. Neste contexto de governo régio, “justiça” é natural em português, sem excluir a ideia moral de retidão.
- source_word: לְבֶן־מֶלֶךְ
  choice: ao filho do rei
  rationale: Mantém literalmente a construção hebraica e não decide se ela designa o herdeiro real ou funciona em paralelo com “o rei”.
theological_decisions:
- issue: Identidade do “rei” e do “filho do rei”
  choice: Manter a linguagem régia sem identificação messiânica explícita no texto.
  alternative: Entender a oração especificamente acerca de Salomão ou, em sentido dinástico/messiânico, acerca do rei ideal.
  rationale: O versículo permite uma referência histórica imediata e também ressonâncias mais amplas. A tradução não resolve uma questão que o próprio texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e ampla compreensão internacional. A colocação de “a tua justiça” após uma vírgula favorece o paralelismo poético sem alterar a sintaxe. Os marcadores [a] e [b] aparecem no texto principal.
