  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: pt
  text: Que ele desça[a] como chuva sobre a relva cortada[b], como aguaceiros que regam a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele descerá como chuva”. Neste contexto, o imperfeito hebraico pode ser entendido como desejo ou oração, ou como descrição futura.'
    reason: alternative_reading
  - marker: b
    text: “Relva cortada” também pode ser traduzido por “grama ceifada”. Como a palavra hebraica designa algo cortado ou tosquiado, alguns entendem “velo tosquiado”; a imagem agrícola, porém, se ajusta melhor ao contexto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o solo” ou “a região”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Que ele desça
  rationale: O imperfeito de ירד, no contexto de oração e bênção régia do salmo, é traduzido com valor volitivo. “Desça” preserva de modo natural a imagem do movimento para baixo.
- source_word: כְּמָטָר
  choice: como chuva
  rationale: Traduz diretamente a preposição comparativa כ e o substantivo מָטָר, mantendo o símile.
- source_word: עַל
  choice: sobre
  rationale: Equivalente idiomático e poético para a preposição עַל neste contexto.
- source_word: גֵּז
  choice: relva cortada
  rationale: O termo designa aquilo que foi cortado ou tosquiado. A referência à relva cortada se harmoniza com chuva, aguaceiros e terra, embora “velo tosquiado” seja lexicalmente possível.
- source_word: כִּרְבִיבִים
  choice: como aguaceiros
  rationale: רְבִיבִים indica chuvas ou pancadas abundantes; “aguaceiros” preserva a imagem e o paralelismo com “como chuva”.
- source_word: זַרְזִיף
  choice: que regam
  rationale: A forma rara descreve o gotejar ou derramar da água. A formulação verbal é natural em português e expressa o efeito vivificante da chuva sem forçar uma precisão incerta.
- source_word: אָרֶץ
  choice: a terra
  rationale: אָרֶץ pode significar terra, região ou chão. “A terra” mantém a amplitude poética e é natural em português.
theological_decisions:
- issue: Valor do imperfeito verbal em contexto de oração régia
  choice: 'Desejo ou petição: “Que ele desça”'
  alternative: 'Descrição futura: “Ele descerá”'
  rationale: O contexto de bênção e oração do Salmo 72 favorece o valor volitivo, mas o hebraico também admite leitura futura; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética. “Relva cortada” evita uma formulação excessivamente técnica; “aguaceiros” comunica chuva abundante sem acrescentar explicitamente uma intensidade que o paralelismo já sugere. Os marcadores seguem imediatamente os elementos a que se referem.
