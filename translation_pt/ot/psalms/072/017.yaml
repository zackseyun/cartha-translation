source:
  edition: WLC
  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: pt
  text: 'Que o seu nome permaneça para sempre;


    diante do sol,[a] que o seu nome se perpetue.[b]


    Que todas as nações sejam abençoadas nele;[c]


    que o chamem bem-aventurado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto durar o sol”. O hebraico diz mais literalmente “diante do sol”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é raro e também pode sugerir que o nome “floresça”, “aumente” ou “se propague”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Que todas as nações abençoem a si mesmas por meio dele”. A forma hebraica também pode ser entendida em sentido reflexivo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Que o seu nome permaneça para sempre
  rationale: O jussivo יְהִי expressa desejo ou oração. “Permaneça para sempre” comunica em português atual a duração associada ao nome, preservando “nome” como expressão da identidade e reputação do rei.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: diante do sol
  rationale: Mantém a imagem hebraica literalmente espacial, sem ocultar que, no contexto poético, ela provavelmente exprime duração comparável à do sol.
- source_word: ינין
  choice: se perpetue
  rationale: O verbo é raro e seu sentido exato é discutido. “Se perpetue” se aplica naturalmente ao nome e preserva a ideia geral de continuidade sem defini-la apenas como descendência, crescimento ou propagação.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: sejam abençoadas nele
  rationale: A formulação conserva a possível leitura passiva ou média e a ressonância das fórmulas patriarcais de bênção, enquanto a alternativa reflexiva é registrada em nota.
- source_word: כָּל גּוֹיִם
  choice: todas as nações
  rationale: No contexto régio e universal do salmo, גּוֹיִם designa os povos ou nações do mundo; “todas as nações” é claro e tradicional sem restringir o referente.
- source_word: יְאַשְּׁרוּהוּ
  choice: que o proclamem feliz
  rationale: O piel de אשר significa declarar alguém feliz ou bem-aventurado. “Proclamem feliz” é digno e compreensível, evitando tanto uma expressão arcaica quanto uma paráfrase excessiva.
theological_decisions:
- issue: Alcance régio e messiânico do versículo
  choice: Preservar a referência imediata ao rei e a possível ressonância messiânica, sem identificar explicitamente o rei com uma figura posterior.
  alternative: Tratar a linguagem apenas como hipérbole sobre um rei histórico, ou exclusivamente como profecia messiânica direta.
  rationale: O Salmo 72 é régio, mas emprega linguagem universal que ultrapassa um reinado comum. “Todas as nações sejam abençoadas nele” mantém a ligação verbal com as promessas patriarcais e permite a leitura canônica sem impô-la ao texto.
- issue: Sentido de וְיִתְבָּרְכוּ בוֹ
  choice: 'Usar a leitura passiva ou média: “sejam abençoadas nele”.'
  alternative: 'Leitura reflexiva: “abençoem a si mesmas por meio dele” ou “tomem-no como fórmula de bênção”.'
  rationale: A forma hitpael admite mais de uma nuance. O texto principal conserva a recepção de bênção e a nota registra explicitamente a leitura reflexiva, evitando eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. “Diante do sol” preserva a imagem concreta do hebraico; “se perpetue” e “proclamem feliz” mantêm dignidade sem recorrer a formulações excessivamente arcaicas.
