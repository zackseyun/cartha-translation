  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: pt
  text: Em seus dias, o justo florescerá[a], e haverá paz em abundância[b][d], até que não haja mais lua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O singular também pode ter sentido coletivo: “os justos florescerão”. Ou pode referir-se a um justo específico, possivelmente ao próprio rei.'
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica traduzida como “paz” também pode incluir as ideias de bem-estar, integridade e prosperidade.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “até não haver lua”, expressão poética que indica duração contínua.
    reason: cultural_note
  - marker: d
    text: Ou, de modo mais literal, “e abundância de paz”.
    reason: previous_rendering
lexical_decisions:
- source_word: יִפְרַח
  choice: florescerá
  rationale: O verbo פרח descreve brotar, florir ou prosperar. “Florescerá” preserva a imagem poética e expressa naturalmente o desenvolvimento próspero sob o governo do rei.
- source_word: בְּיָמָיו
  choice: Em seus dias
  rationale: Reproduz de perto o hebraico e, no contexto, indica o período do reinado ou da vida do rei sem explicitação desnecessária.
- source_word: צַדִּיק
  choice: o justo
  rationale: Mantém o singular morfológico do hebraico e permite tanto uma leitura genérica ou coletiva quanto a referência a um indivíduo específico. A nota explicita essa ambiguidade.
- source_word: וְרֹב
  choice: e haverá ... em abundância
  rationale: רֹב denota grande quantidade ou abundância. A inserção de “haverá”, implícito na oração nominal hebraica, produz português natural sem alterar o sentido.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a correspondência principal mais transparente no contexto do salmo real, enquanto a nota preserva os sentidos mais amplos de bem-estar, integridade e prosperidade.
- source_word: עַד בְּלִי יָרֵחַ
  choice: até que não haja mais lua
  rationale: Conserva a imagem hebraica e sua forma temporal, ao mesmo tempo que soa natural em português. A expressão poética comunica duração extrema ou permanente.
theological_decisions:
- issue: Alcance de צַדִּיק em um salmo real ou messiânico
  choice: Preservar o singular “o justo”, sem decidir se é genérico, coletivo ou individual
  alternative: “os justos”, entendendo o singular como coletivo; ou “o justo” como referência específica ao rei ideal
  rationale: O hebraico apresenta adjetivo e verbo no singular, mas o substantivado singular pode ter valor representativo ou coletivo. Manter o singular preserva a forma e a tensão interpretativa sem identificar obrigatoriamente o justo com o rei nem excluir essa possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura poética foi preservada sem tornar a oração nominal hebraica artificial em português.
