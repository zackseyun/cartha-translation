base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: pt
  text: Que ele governe de mar a mar[a] e do Rio[b] até os confins da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele governará de mar a mar e do Rio até os confins da terra”.'
    reason: alternative_reading
  - marker: b
    text: “O Rio” provavelmente se refere ao Eufrates, uma fronteira geográfica recorrente na Bíblia.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Que ele governe
  rationale: O verbo רדה significa governar ou exercer domínio. No contexto de oração pelo rei, a construção com «Que» expressa naturalmente em português a provável força volitiva do imperfeito.
- source_word: מִיָּם עַד יָם
  choice: de mar a mar
  rationale: Preserva a expressão poética e abrangente do hebraico sem especificar quais mares estão em vista.
- source_word: וּמִנָּהָר
  choice: e desde o Rio
  rationale: O hebraico diz literalmente «desde o rio»; nesse uso geográfico absoluto, provavelmente designa o Eufrates. A inicial maiúscula sinaliza o provável nome geográfico sem inserir «Eufrates» no texto principal.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: até os confins da terra
  rationale: «Confins da terra» comunica de modo natural e digno as extremidades ou regiões mais distantes indicadas por אַפְסֵי.
theological_decisions:
- issue: Força do imperfeito possivelmente jussivo em um salmo real
  choice: Que ele governe
  alternative: Ele governará
  rationale: O contexto de oração e bênção pelo rei favorece a leitura volitiva, sem eliminar a possível leitura preditiva nem a ressonância messiânica do texto. A alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível. A ordem dos marcadores foi ajustada para que cada nota apareça junto à expressão que explica.
