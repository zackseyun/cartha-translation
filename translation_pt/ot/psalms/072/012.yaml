source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: pt
  text: Pois ele livra o necessitado quando clama, e o pobre[a] que não tem quem o ajude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflito”; o termo hebraico também pode destacar sofrimento ou opressão, além de pobreza.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor do rei no contexto anterior e expressa de modo natural o valor causal da conjunção.
- source_word: יַצִּיל
  choice: ele livra
  rationale: O hifil de נצל indica fazer escapar ou resgatar. “Livra” comunica socorro concreto sem limitar o sentido a uma salvação especificamente espiritual.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Designa quem vive em carência e depende de auxílio. “Necessitado” mantém distinção em relação a עָנִי no membro paralelo.
- source_word: מְשַׁוֵּעַ
  choice: quando clama
  rationale: O particípio de שׁוע descreve o necessitado clamando por socorro; a construção temporal é natural em português e preserva essa circunstância.
- source_word: וְעָנִי
  choice: e o pobre
  rationale: עָנִי pode significar pobre, aflito ou oprimido. Em paralelo com אֶבְיוֹן, a carência socioeconômica está em primeiro plano, embora a alternativa “aflito” permaneça em nota.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: que não tem quem o ajude
  rationale: Expressa com naturalidade que o pobre está desamparado e sem pessoa alguma que lhe preste auxílio.
theological_decisions:
- issue: Referente de “ele”
  choice: Manter o pronome singular “ele” sem identificar explicitamente seu referente, que no contexto é a figura real celebrada no salmo.
  alternative: Explicitar “o rei”, ou interpretar diretamente como um rei justo genérico ou como o Messias.
  rationale: O hebraico traz um verbo na terceira pessoa masculina singular, sem nomear o sujeito neste versículo. A tradução conserva a abertura do texto e não resolve sua possível dimensão régia ou messiânica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Pois” preserva a ligação causal; “não tem quem o ajude” evita uma formulação rígida como “não tem ajudador”.
