  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: pt
  text: Que todos os reis se prostrem diante dele[a]; que todas as nações o sirvam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorem”, em lugar de “se prostrem diante dele” e/ou “o sirvam”; os verbos hebraicos podem ter conotações tanto de homenagem régia quanto de culto religioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: se prostrem
  rationale: O verbo שׁחה nesta forma expressa prostrar-se ou curvar-se em sinal de homenagem. “Se prostrem” preserva o gesto concreto e sua possível dimensão religiosa sem restringi-lo desde logo a culto.
- source_word: לוֹ
  choice: diante dele
  rationale: Com o verbo de prostrar-se, ל indica a pessoa a quem se dirige a homenagem; “diante dele” é uma formulação natural em português.
- source_word: כָל מְלָכִים
  choice: todos os reis
  rationale: Tradução direta que conserva o alcance universal da submissão régia.
- source_word: כָל גּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם designa aqui amplamente as nações do mundo, em paralelo com “todos os reis”; “nações” evita uma especificação étnico-religiosa indevida.
- source_word: יַעַבְדוּהוּ
  choice: o sirvam
  rationale: עבד tem como sentido básico “servir”, podendo incluir serviço político ou religioso. A escolha conserva essa amplitude sem explicitar apenas “adorar”.
theological_decisions:
- issue: Se o versículo deve empregar explicitamente linguagem de adoração dirigida ao rei
  choice: 'Manter a linguagem mais ampla de homenagem e serviço: “se prostrem diante dele” e “o sirvam”.'
  alternative: Traduzir um ou ambos os verbos por “adorar”.
  rationale: O salmo é régio, e os verbos hebraicos comportam tanto homenagem ao rei quanto conotações religiosas. A formulação escolhida preserva essa tensão e não impõe uma leitura exclusivamente cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O jussivo contextual é vertido por “Que...”, e o paralelismo poético é preservado.
