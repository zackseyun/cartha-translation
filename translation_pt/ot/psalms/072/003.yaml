  text: יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָ/עָ֑ם וּ֝/גְבָע֗וֹת בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/003.yaml
  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: pt
  text: Que os montes tragam paz ao povo[a], e as colinas a tragam com justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o povo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio da justiça” ou “com retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: tragam
  rationale: O verbo נָשָׂא significa literalmente “levantar, carregar, levar”. Com “montes” e “colinas” como sujeitos poéticos e “paz” como objeto, “tragam” comunica naturalmente a ideia de produzir ou proporcionar paz. A forma imperfeita é entendida como desejo ou pedido no contexto desta oração pelo rei.
- source_word: הָרִים
  choice: os montes
  rationale: Tradução direta do substantivo plural com artigo, preservando a imagem poética.
- source_word: שָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם abrange paz, bem-estar, integridade e prosperidade. “Paz” é a opção mais clara e tradicional, sem excluir aqui o sentido mais amplo de bem-estar coletivo.
- source_word: לָעָם
  choice: ao povo
  rationale: A preposição ל pode indicar direção ou benefício. “Ao povo” se ajusta à imagem da paz que chega a ele; “para o povo” permanece uma alternativa legítima.
- source_word: וּגְבָעוֹת
  choice: e as colinas também
  rationale: “Colinas” preserva o paralelismo com “montes”. Acrescentou-se “também” para tornar natural em português a elipse do verbo e do objeto na segunda oração, sem introduzir uma ação diferente.
- source_word: בִּצְדָקָה
  choice: com justiça
  rationale: A preposição ב pode expressar modo ou meio, e צְדָקָה pode significar justiça ou retidão. “Com justiça” preserva de forma compacta a relação sem decidir rigidamente entre modo e instrumento.
theological_decisions:
- issue: Força da forma verbal imperfeita numa oração régia
  choice: 'Desejo ou pedido: “Que os montes tragam”'
  alternative: 'Predição: “Os montes trarão”'
  rationale: No contexto do Salmo 72, uma oração ou bênção em favor do reinado, a forma verbal exprime mais naturalmente um desejo do que uma simples previsão.
- issue: Função de בִּצְדָקָה na segunda oração
  choice: 'Expressão de modo ou meio: “com justiça”'
  alternative: 'Objeto paralelo: “as colinas tragam justiça”'
  rationale: O בְּ hebraico favorece a leitura adverbial, “com/em/por meio de justiça”. Tratar “justiça” como objeto direto produz paralelismo mais explícito, mas exige enfraquecer o valor normal da preposição; por isso, a tradução mantém a ambiguidade entre modo e meio.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A elipse poética hebraica foi mantida de maneira natural por meio de “também”. “Justiça” foi preferida a “retidão” no texto por adequar-se ao contexto do governo régio, enquanto a alternativa foi preservada em nota.
