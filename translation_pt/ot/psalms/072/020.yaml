  text: כָּלּ֥וּ תְפִלּ֑וֹת דָּ֝וִ֗ד בֶּן יִשָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: pt
  text: Terminaram as orações de Davi, filho de Jessé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Foram concluídas” ou “Chegaram ao fim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלּוּ
  choice: Terminaram
  rationale: O pual perfeito, 3ª pessoa do plural, de כלה, tendo תְפִלּוֹת como sujeito, expressa que as orações chegaram ao fim. “Terminaram” é direto, natural e mantém o valor conclusivo do hebraico.
- source_word: תְפִלּוֹת
  choice: as orações
  rationale: Plural comum de תְּפִלָּה. “Orações” comunica o sentido lexical básico sem restringi-lo a cânticos ou petições.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן יִשָׁי
  choice: filho de Jessé
  rationale: A cadeia construta identifica Davi por sua ascendência; a formulação é transparente e idiomática em português.
theological_decisions:
- issue: Função do versículo como colofão ou nota editorial, em contraste com sua leitura como parte direta da oração do salmo
  choice: Traduzir como declaração simples que assinala o término das orações de Davi
  alternative: Entendê-lo especificamente como uma subscrição editorial posterior
  rationale: O hebraico apresenta uma declaração concisa, mas não explicita sua história redacional. A tradução conserva o sentido manifesto sem transformar uma possível função editorial em afirmação histórica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada ao uso idiomático do português, mantendo a concisão e o caráter conclusivo do hebraico.
