base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: pt
  text: Que ele viva, e que lhe seja dado ouro de Sabá[a]. Que se ore continuamente por ele[b]; que o abençoem o dia inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e que ele lhe dê ouro de Sabá”. O verbo hebraico está na voz ativa, mas o sujeito não é especificado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que alguém ore por ele” ou “que orem por ele”. O hebraico não identifica explicitamente o sujeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Que ele viva
  rationale: O jussivo qal de חיה expressa desejo ou bênção; “Que ele viva” preserva essa força volitiva sem transformá-la em simples previsão.
- source_word: וְיִתֶּן לוֹ
  choice: que lhe seja dado
  rationale: Embora o verbo hebraico esteja na voz ativa, seu sujeito não é expresso. A construção passiva em português comunica naturalmente a entrega de tributo sem identificar quem o oferece.
- source_word: מִזְּהַב שְׁבָא
  choice: ouro de Sabá
  rationale: A construção com מִן indica aqui procedência ou origem. “Ouro de Sabá” é uma formulação natural e mantém a associação geográfica.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Que se ore por ele
  rationale: O hitpael de פלל com בְּעַד significa orar em favor de alguém. A forma impessoal preserva o sujeito não especificado no hebraico.
- source_word: תָמִיד
  choice: continuamente
  rationale: תָמִיד indica continuidade ou regularidade persistente; “continuamente” convém ao registro poético e à frase temporal seguinte.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão portuguesa corrente que reproduz de modo claro o sentido temporal de “todo o dia”.
- source_word: יְבָרֲכֶנְהוּ
  choice: que o abençoem
  rationale: A formulação com sujeito indeterminado em português transmite a aclamação contínua sem impor uma identidade específica ao agente, que não está declarado no texto hebraico.
theological_decisions:
- issue: Referente das petições reais no Salmo 72
  choice: Manter o versículo como desejo ou oração em favor do rei davídico, sem inserir uma identificação messiânica explícita na tradução.
  alternative: Traduzir o texto diretamente como profecia messiânica acerca do Messias.
  rationale: O sentido histórico imediato é uma série de petições pelo rei, embora o salmo também admita leitura canônica ou messiânica. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. As construções impessoais evitam acrescentar sujeitos não expressos no hebraico, e as notas registram as formas mais literais.
