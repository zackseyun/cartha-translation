  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: pt
  text: Terá compaixão do pobre e do necessitado e salvará a vida dos necessitados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as almas dos necessitados”. A palavra hebraica pode significar “vida”, “ser”, “pessoa” ou “alma”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: terá compaixão
  rationale: Neste contexto, o verbo expressa consideração compassiva pelos vulneráveis. A formulação é natural em português e se harmoniza com o ato de salvar no segundo membro.
- source_word: עַל
  choice: de
  rationale: Com o verbo de compaixão, a preposição hebraica assinala seu objeto; em português idiomático, isso se expressa por “ter compaixão de”.
- source_word: דַּל
  choice: o pobre
  rationale: O termo pode designar alguém pobre, fraco ou socialmente desamparado. “O pobre” comunica com clareza o sentido socioeconômico, sem excluir sua vulnerabilidade.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: “Necessitado” preserva a distinção poética em relação a דַּל e expressa alguém carente de auxílio.
- source_word: נַפְשׁוֹת
  choice: a vida
  rationale: Embora o hebraico esteja no plural e possa significar “vidas”, “pessoas” ou “almas”, o singular coletivo “a vida dos necessitados” é idiomático em português e se encaixa no contexto de proteção e livramento.
- source_word: אֶבְיוֹנִים
  choice: dos necessitados
  rationale: Mantém a correspondência lexical com a ocorrência anterior de אֶבְיוֹן e reflete o plural hebraico.
- source_word: יוֹשִׁיעַ
  choice: salvará
  rationale: O hifil de ישׁע significa salvar ou livrar. “Salvará” é direto, natural e conserva a ligação lexical com o uso bíblico mais amplo, enquanto o contexto indica livramento concreto.
theological_decisions:
- issue: Sentido de נַפְשׁוֹת na antropologia humana
  choice: Traduzido no texto como “a vida”.
  alternative: “as almas” ou “as pessoas”
  rationale: No contexto da proteção exercida pelo rei, o termo se refere mais naturalmente à vida ou à pessoa dos necessitados. “Almas” poderia sugerir uma dicotomia posterior entre corpo e alma que o hebraico não exige; a nota conserva a alternativa lexical legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela do hebraico foi preservada, e “pobre”/“necessitado” mantém a variação lexical poética.
