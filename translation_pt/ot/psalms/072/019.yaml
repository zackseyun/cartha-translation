id: PSA.72.19
reference: Psalms 72:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: pt
  text: E bendito seja para sempre o seu nome glorioso[a]; e que a sua glória encha toda a terra[b]. Amém e amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o nome da sua glória”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terra inteira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: E bendito seja
  rationale: Preserva a força volitiva e litúrgica da fórmula de bênção no contexto da doxologia, em português natural.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: o seu nome glorioso
  rationale: A cadeia construta significa literalmente “o nome da sua glória”; “seu nome glorioso” comunica o sentido com naturalidade, mantendo em nota a forma mais literal.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração perpétua de modo claro, corrente e digno.
- source_word: וְיִמָּלֵא
  choice: e que ... encha
  rationale: O imperfeito nifal é entendido aqui com força volitiva. Embora a forma verbal possa parecer passiva, a construção com אֶת introduzindo “toda a terra” favorece o sentido de que a glória a encha.
- source_word: כְבוֹדוֹ
  choice: a sua glória
  rationale: “Glória” é a equivalência mais adequada no contexto doxológico, preservando as ideias de honra, majestade e esplendor divinos.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: toda a terra
  rationale: Representa a totalidade da terra ou do mundo; no contexto universal do salmo, “terra” é preferível ao sentido localizado de “país” ou “território”.
- source_word: אָמֵן וְאָמֵן
  choice: Amém e amém
  rationale: Mantém a dupla afirmação litúrgica e a cadência solene do hebraico.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: toda a terra, em sentido universal
  alternative: todo o território ou toda a terra de Israel
  rationale: A culminação do salmo em uma doxologia e seu horizonte abrangente favorecem a referência ao mundo inteiro, sem restringir a frase à terra de Israel.
- issue: Valor modal de וְיִמָּלֵא
  choice: 'pedido ou desejo: “que ... encha”'
  alternative: 'declaração futura: “encherá” ou formulação passiva: “seja cheia”'
  rationale: O contexto doxológico favorece uma expressão volitiva. A presença do marcador de objeto direto אֶת apoia a leitura em que “sua glória” é o agente que enche “toda a terra”.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação conserva o tom solene e litúrgico, evita arcaísmos desnecessários e mantém a ambiguidade lexical relevante em notas.
