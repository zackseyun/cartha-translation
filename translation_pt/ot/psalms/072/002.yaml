  text: יָדִ֣ין עַמְּ/ךָ֣ בְ/צֶ֑דֶק וַ/עֲנִיֶּ֥י/ךָ בְ/מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: pt
  text: Que ele julgue[a] o teu povo com justiça e os teus aflitos[b] com equidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele julgará». Neste contexto, o imperfeito hebraico pode expressar tanto um desejo — «Que ele julgue» — quanto uma ação futura.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «os teus pobres», «os teus necessitados» ou «os teus oprimidos». O termo hebraico pode referir-se a pessoas pobres, aflitas ou oprimidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Que ele julgue
  rationale: O imperfeito qal na terceira pessoa masculina singular pode ter valor volitivo ou futuro. No contexto de oração pelo rei, a construção «Que ele julgue» comunica naturalmente o desejo ou pedido.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Traduz diretamente o substantivo coletivo com sufixo de segunda pessoa masculina singular e preserva seu sentido nacional e pactual.
- source_word: בְצֶדֶק
  choice: com justiça
  rationale: Expressa a retidão moral que deve caracterizar o julgamento e traduz naturalmente o beth como indicador de modo.
- source_word: וַעֲנִיֶּיךָ
  choice: e os teus aflitos
  rationale: O termo עָנִי pode designar pobres, necessitados, oprimidos ou pessoas que sofrem aflição. «Aflitos» mantém essa amplitude sem restringir a referência à pobreza econômica.
- source_word: בְמִשְׁפָּט
  choice: com equidade
  rationale: מִשְׁפָּט aqui indica julgamento justo ou justiça aplicada. «Equidade» é natural no paralelismo e evita repetir «justiça», preservando ao mesmo tempo a distinção lexical entre צֶדֶק e מִשְׁפָּט.
theological_decisions:
- issue: Valor volitivo ou preditivo do imperfeito inicial numa oração régia
  choice: Que ele julgue
  alternative: Ele julgará
  rationale: O início do salmo tem forma de oração ou bênção em favor do rei, o que favorece a leitura volitiva. A alternativa futura continua possível e é registrada em nota para preservar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. «Equidade» mantém o paralelismo poético e distingue os dois termos hebraicos relacionados à justiça.
