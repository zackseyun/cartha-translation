base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: pt
  text: Bendito seja Yahweh Deus, o Deus de Israel, o único que faz maravilhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo integra uma fórmula doxológica. “Bendito seja” é natural, dignificado e preserva seu caráter litúrgico e declarativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Está em aposição a Yahweh; a tradução direta mantém a identificação presente no hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta e preserva sua especificidade relacional e teológica.
- source_word: עֹשֵׂה
  choice: que faz
  rationale: O particípio qal descreve uma característica contínua de Deus; a oração relativa é idiomática em português.
- source_word: נִפְלָאוֹת
  choice: maravilhas
  rationale: Designa atos extraordinários e admiráveis; “maravilhas” é claro, corrente e adequado ao registro poético.
- source_word: לְבַדּוֹ
  choice: o único
  rationale: Na construção “o único que faz”, expressa com naturalidade a exclusividade atribuída a Deus, sem acrescentar uma ideia de isolamento no modo de agir.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Alcance da exclusividade em לְבַדּוֹ
  choice: o único que faz maravilhas
  alternative: que, sozinho, faz maravilhas
  rationale: A escolha mantém a afirmação de exclusividade do hebraico, associando-a ao agente desses atos extraordinários, sem resolver além do texto se a ênfase recai sobre unicidade ou ação sem auxílio.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. A formulação conserva o paralelismo doxológico e evita linguagem arcaica desnecessária.
