  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: pt
  text: Que ele julgue os pobres do povo[a], salve os filhos dos necessitados e esmague o opressor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele julgará os pobres do povo, salvará os filhos dos necessitados e esmagará o opressor.” Neste contexto, os verbos hebraicos no imperfeito podem indicar tanto o futuro como uma oração ou um desejo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Julgue ele
  rationale: O qal imperfeito de שׁפט pode expressar futuro ou desejo neste contexto. A forma optativa preserva o caráter de oração pelo rei e mantém o sentido judicial básico do verbo.
- source_word: עֲנִיֵּי עָם
  choice: os pobres do povo
  rationale: עֲנִיִּים pode designar pobres, aflitos ou oprimidos. O paralelismo com os necessitados favorece aqui o aspecto socioeconômico, e a construção conserva a relação do hebraico.
- source_word: יוֹשִׁיעַ
  choice: salve
  rationale: O hifil de ישׁע indica salvar ou livrar. “Salve” comunica diretamente a ideia forte de resgate sem especificar indevidamente os meios.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: os filhos dos necessitados
  rationale: בני é literalmente “filhos” e pode ter sentido coletivo; אֶבְיוֹן designa quem passa necessidade. A tradução mantém a imagem familiar e distingue o termo de “pobres” na linha anterior.
- source_word: וִידַכֵּא
  choice: e esmague
  rationale: דכא comunica a ideia vigorosa de esmagar ou quebrar. No contexto da justiça real contra a exploração, “esmague” preserva a força da expressão.
- source_word: עוֹשֵׁק
  choice: o opressor
  rationale: O particípio de עשׁק designa aquele que oprime ou explora. “O opressor” é conciso, natural e conserva seu caráter habitual.
theological_decisions:
- issue: Modo verbal ao longo do versículo
  choice: 'Leitura optativa, em forma de oração: “Julgue ele... salve... e esmague...”'
  alternative: 'Futuro simples: “Ele julgará... salvará... e esmagará...”'
  rationale: O Salmo 72 tem a forma de oração pelo rei, e os imperfeitos hebraicos podem ser entendidos como pedidos ou desejos. A tradução preserva essa força litúrgica sem transformar a passagem em uma previsão mais categórica do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão “Julgue ele” preserva de modo natural o tom solene e optativo; o paralelismo e a força concreta de “esmague” foram mantidos.
