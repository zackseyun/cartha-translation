  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: pt
  text: Que te temam[a] enquanto durar o sol e enquanto houver lua[b], de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles te temerão”. A forma hebraica também pode ser entendida como uma afirmação futura, em vez de um desejo ou oração.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “com o sol e diante da lua”; no paralelismo poético, a expressão indica duração contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Que te temam
  rationale: O verbo ירא pode significar “temer” ou “reverenciar”. A construção portuguesa com “que” comunica naturalmente a provável força volitiva ou de oração no contexto, sem eliminar a possibilidade de uma afirmação futura, registrada em nota.
- source_word: עִם שָׁמֶשׁ
  choice: enquanto durar o sol
  rationale: Embora עִם signifique normalmente “com”, aqui a expressão com o sol indica duração. O verbo “durar” é explicitado para transmitir o sentido idiomático em português corrente.
- source_word: וְלִפְנֵי יָרֵחַ
  choice: e enquanto houver lua
  rationale: Literalmente, לִפְנֵי significa “diante de” ou “na presença de”. No paralelismo com o sol, a expressão comunica duração; a formulação escolhida torna esse valor temporal claro sem reduzir a imagem poética.
- source_word: דּוֹר דּוֹרִים
  choice: de geração em geração
  rationale: A expressão hebraica singular-plural enfatiza a sucessão contínua das gerações. “De geração em geração” é natural, digna e preserva essa força reiterativa.
theological_decisions:
- issue: Sujeito e referente de “te temam” em um salmo régio
  choice: Manter a segunda pessoa sem identificar explicitamente quem deve ser temido.
  alternative: Explicitar que o temor se dirige ao rei, a Deus ou a Deus por meio do rei.
  rationale: O hebraico apenas diz “te” e o contexto régio permite mais de uma compreensão. A tradução conserva essa ambiguidade e a tensão teológica do texto.
- issue: Valor modal de יִירָאוּךָ
  choice: 'Traduzir como desejo ou oração: “Que te temam”.'
  alternative: 'Traduzir como declaração futura: “Eles te temerão”.'
  rationale: A forma verbal pode ter força volitiva no contexto do salmo, mas também admite leitura futura; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “enquanto” esclarece o paralelismo temporal, e “de geração em geração” mantém a cadência poética tradicional sem arcaísmo excessivo.
