base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: pt
  text: Diante dele, os habitantes do deserto se curvarão[a], e os seus inimigos lamberão o pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “as tribos do deserto”. O termo hebraico também pode, em certos contextos, designar criaturas das regiões desertas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Diante dele
  rationale: Expressa de modo natural o sentido idiomático de estar perante alguém ou em sua presença.
- source_word: יִכְרְעוּ
  choice: se curvarão
  rationale: Preserva a ideia de prostração e submissão diante do rei, com linguagem corrente e digna.
- source_word: צִיִּים
  choice: os habitantes do deserto
  rationale: O termo é raro e pode designar habitantes humanos de regiões desérticas ou, em outros contextos, criaturas do deserto. O paralelismo com “seus inimigos” favorece aqui a referência humana.
- source_word: וְאֹיְבָיו
  choice: e os seus inimigos
  rationale: Tradução direta do substantivo com sufixo de terceira pessoa masculina singular.
- source_word: עָפָר
  choice: o pó
  rationale: Mantém a imagem concreta de humilhação e derrota presente na expressão hebraica.
- source_word: יְלַחֵכוּ
  choice: lamberão
  rationale: Reproduz diretamente o verbo hebraico e conserva a força da imagem poética.
theological_decisions:
- issue: Natureza da imagem de submissão
  choice: Conservar literalmente as imagens de curvar-se e lamber o pó como linguagem poética de submissão e derrota.
  alternative: Parafrasear como submissão política ou derrota completa.
  rationale: O contexto real emprega imagens vívidas de sujeição. A tradução não exige que cada gesto seja entendido como ato literal, mas também não dissolve a metáfora em linguagem abstrata.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo poético, a imagem concreta do hebraico e a ambiguidade lexical de צִיִּים por meio de nota.
