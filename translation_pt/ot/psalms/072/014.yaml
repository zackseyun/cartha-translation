  text: מִ/תּ֣וֹךְ וּ֭/מֵ/חָמָס יִגְאַ֣ל נַפְשָׁ֑/ם וְ/יֵיקַ֖ר דָּמָ֣/ם בְּ/עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: pt
  text: Da opressão e da violência ele resgatará a vida deles[a], e o sangue deles será precioso aos olhos dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alma deles” ou “as vidas deles”. O hebraico néfesh pode significar vida, pessoa, ser ou alma, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: O singular “ele/dele” continua mais naturalmente a referência ao rei no salmo, embora a linguagem também evoque o próprio cuidado redentor de Deus pelos oprimidos.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: da opressão
  rationale: A construção significa literalmente “do meio de”; com o substantivo seguinte, “da opressão” comunica naturalmente a libertação para fora dessa condição.
- source_word: וּמֵחָמָס
  choice: e da violência
  rationale: חָמָס pode indicar violência, injustiça ou dano cruel; “violência” preserva a imagem direta e repete a preposição exigida pelo português natural.
- source_word: יִגְאַל
  choice: resgatará
  rationale: גאל descreve a ação de reclamar, remir ou libertar como resgatador. “Resgatará” é claro em português corrente e conserva melhor essa força do que o genérico “livrará”.
- source_word: נַפְשָׁם
  choice: a vida deles
  rationale: נֶפֶשׁ pode significar vida, pessoa, ser ou alma. Neste contexto, “vida” evita restringir o termo à alma imaterial e mantém a forma coletiva singular do hebraico.
- source_word: וְיֵיקַר
  choice: será precioso
  rationale: O verbo expressa alto valor ou estima; “será precioso” preserva de modo natural a força e a imagem do original.
- source_word: דָּמָם
  choice: o sangue deles
  rationale: A tradução concreta mantém a imagem hebraica de sangue que não é considerado barato nem dispensável.
- source_word: בְּעֵינָיו
  choice: aos olhos dele
  rationale: Mantém o idioma concreto do hebraico e comunica claramente avaliação e estima.
theological_decisions:
- issue: Referente do sujeito e do pronome masculinos no singular
  choice: Manter “ele/dele” sem identificar explicitamente o referente, permitindo que o contexto imediato aponte para o rei.
  alternative: Entender como referência direta a Deus, aquele que resgata os oprimidos e considera precioso o sangue deles.
  rationale: As formas singulares continuam naturalmente o rei do salmo, mas a ação também ecoa o cuidado redentor de Deus. A tradução preserva essa tensão literária e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem de “sangue” e a ambiguidade do referente singular, sem impor uma identificação doutrinária.
