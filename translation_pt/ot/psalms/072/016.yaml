  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: pt
  text: Haja fartura de cereal na terra[a]; no alto dos montes, que o seu fruto ondeie como o Líbano; e que, da cidade, as pessoas floresçam como a vegetação da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Haja um punhado de cereal na terra”. A expressão hebraica é rara e pode destacar uma pequena quantidade que se torna extraordinariamente fecunda ou, simplesmente, a fartura de cereal.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Haja
  rationale: O jussivo de היה expressa desejo ou oração; “Haja” transmite essa força de modo natural e digno em português.
- source_word: פִסַּת
  choice: fartura de
  rationale: O substantivo é raro e discutido. “Fartura de” se ajusta à imagem contextual de extraordinária fecundidade, enquanto a possibilidade de “um punhado de” é preservada em nota.
- source_word: בַּר
  choice: cereal
  rationale: Neste contexto, designa genericamente os grãos cultivados. “Cereal” evita restringir o sentido a trigo ou milho.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Refere-se naturalmente ao território agrícola; “terra” mantém também a ressonância mais ampla do hebraico.
- source_word: בְּרֹאשׁ הָרִים
  choice: no alto dos montes
  rationale: Expressa de maneira corrente a localização nos cumes e conserva a imagem de fertilidade até em lugares improváveis.
- source_word: יִרְעַשׁ
  choice: ondeie
  rationale: O verbo denota agitar-se ou tremer. Aplicado à produção agrícola, “ondeie” comunica seu movimento visível sem eliminar a força da imagem.
- source_word: כַּלְּבָנוֹן
  choice: como o Líbano
  rationale: Mantém diretamente a comparação com o Líbano, associado à vegetação majestosa e exuberante.
- source_word: פִּרְיוֹ
  choice: o seu fruto
  rationale: Preserva a forma singular coletiva e a referência à produção do cereal.
- source_word: וְיָצִיצוּ
  choice: que as pessoas floresçam
  rationale: O verbo significa brotar ou florescer. O plural humano implícito é explicitado de forma mínima, pois a procedência urbana aponta para os habitantes, mantendo-se a metáfora vegetal.
- source_word: מֵעִיר
  choice: na cidade
  rationale: A preposição מן pode ter valor local de surgimento ou crescimento a partir de um lugar; em português, “na cidade” comunica melhor onde a população floresce, sem a impressão de que esteja saindo dela.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: como a vegetação da terra
  rationale: “Vegetação” abrange o sentido coletivo de עֵשֶׂב e torna clara a comparação com crescimento abundante.
theological_decisions:
- issue: Interpretação da expressão rara פִסַּת בַּר
  choice: fartura de cereal
  alternative: um punhado de cereal
  rationale: A oração por prosperidade e as imagens de fruto exuberante favorecem a ideia de fartura. Como “um punhado” continua lexicalmente possível e produziria a imagem de uma pequena quantidade extraordinariamente fecunda, essa leitura é preservada em nota.
- issue: Sujeito implícito de וְיָצִיצוּ
  choice: as pessoas
  alternative: eles
  rationale: O hebraico não nomeia o sujeito do verbo plural. A referência à cidade torna seus habitantes a compreensão mais provável; “as pessoas” esclarece isso sem especificar um grupo social ou religioso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo poético, a imagem do Líbano e a metáfora do florescimento humano; a ambiguidade lexical principal é registrada em nota.
