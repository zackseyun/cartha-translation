  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: pt
  text: Yahweh ama os portões de Sião mais do que todas as moradas de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh ama os portões de Sião acima de todas as moradas de Jacó.”'
    reason: Alternativa lexical para a força comparativa de מִכֹּל.
lexical_decisions:
- source_word: אֹהֵב
  choice: ama
  rationale: O particípio qal de אהב tem função verbal, com Yahweh como sujeito. “Ama” expressa de modo natural uma disposição contínua, sem acrescentar intensidade ausente do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: שַׁעֲרֵי
  choice: os portões de
  rationale: O plural construto de שַׁעַר designa os portões da cidade. A tradução mantém a imagem concreta, embora os portões possam representar metonimicamente a própria cidade.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma consagrada e amplamente reconhecida em português para o topônimo hebraico.
- source_word: מִכֹּל
  choice: mais do que todas
  rationale: A preposição מִן, neste contexto de preferência, tem força comparativa. A formulação torna explícita a predileção por Sião em relação às demais moradas de Jacó.
- source_word: מִשְׁכְּנוֹת
  choice: as moradas
  rationale: O plural de מִשְׁכָּן tem aqui sentido geral de lugares de habitação. “Moradas” preserva o tom poético sem sugerir necessariamente estruturas cultuais.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Conserva o nome próprio do texto hebraico, embora ele também designe coletivamente o povo ou o território de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. A transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Força comparativa de מִכֹּל
  choice: mais do que todas as moradas de Jacó
  alternative: acima de todas as moradas de Jacó
  rationale: A construção indica preferência por Sião. “Mais do que” comunica claramente a comparação, enquanto “acima de” permanece uma alternativa possível e mais formal.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. “Portões” preserva a referência concreta às entradas fortificadas da cidade; “moradas” mantém o paralelismo sem introduzir conotação cultual indevida.
