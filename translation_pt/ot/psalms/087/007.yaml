  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: pt
  text: E cantores e dançarinos dizem:[a] “Todas as minhas fontes estão em você.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “flautistas”. O termo hebraico é tradicionalmente entendido como referência aos que dançam ou giram, embora também tenha sido proposto o sentido de músicos que tocam flauta.'
    reason: lexical_alternative
  - marker: b
    text: “Todas as minhas fontes estão em você” é uma metáfora poética que também pode transmitir a ideia de “todas as minhas nascentes” ou “todas as minhas fontes de vida estão em você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: E cantores
  rationale: O particípio de שׁיר significa naturalmente “cantores”. A leitura “príncipes”, embora possível para as mesmas consoantes em outros contextos, é menos provável no paralelismo com כְּחֹלְלִים.
- source_word: כְּחֹלְלִים
  choice: e dançarinos
  rationale: O termo é tradicionalmente relacionado a חול no sentido de dançar ou girar. A construção poética comprimida reúne cantores e dançarinos; a alternativa “flautistas” é preservada em nota.
- source_word: כָּל
  choice: Todas
  rationale: Expressa totalidade e concorda com o substantivo feminino plural “fontes”.
- source_word: מַעְיָנַי
  choice: minhas fontes
  rationale: מַעְיָן designa uma nascente ou fonte. “Fontes” conserva a imagem concreta e poética e, em português, também permite o sentido metafórico de origem da vida.
- source_word: בָּךְ
  choice: estão em você
  rationale: A preposição ב é mantida como “em”; o pronome se refere a Sião, tratada no hebraico como feminino singular. O verbo “estão” é suprido para formar uma frase natural em português.
theological_decisions:
- issue: Força metafórica de “minhas fontes” na fala dirigida a Sião
  choice: Manter a metáfora “Todas as minhas fontes estão em você”.
  alternative: Todas as minhas fontes de vida estão em você; Todas as minhas bênçãos vêm de você.
  rationale: O hebraico deixa aberta a extensão da imagem. A tradução preserva Sião como lugar de origem, vida ou pertencimento sem transformar a poesia em uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A coordenação explicita os dois grupos sem eliminar a concisão poética. Os marcadores seguem a ordem de ocorrência no texto.
