  text: יְֽהוָ֗ה יִ֭סְפֹּר בִּ/כְת֣וֹב עַמִּ֑ים זֶ֖ה יֻלַּד שָׁ֣ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: pt
  text: 'Yahweh contará, ao registrar os povos: “Este nasceu ali.”[a] Selá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais conforme o contexto: “nela”, referindo-se a Sião nos versículos ao redor.'
    reason: Alternativa contextual para o advérbio hebraico שָׁם, preservada sem alterar a tradução literal «ali» no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יִסְפֹּר
  choice: contará
  rationale: Preserva o sentido básico de ספר no qal, “contar, enumerar”, enquanto a frase seguinte fornece o contexto de registro.
- source_word: בִּכְתוֹב
  choice: ao registrar
  rationale: A preposição ב com o infinitivo construto tem valor temporal; “ao registrar” é natural em português e mantém a imagem de um registro oficial.
- source_word: עַמִּים
  choice: os povos
  rationale: Reproduz o plural amplo de עַמִּים sem restringi-lo necessariamente a Estados ou nações políticas.
- source_word: זֶה
  choice: Este
  rationale: Representa o demonstrativo masculino singular como referência a uma pessoa individual, sem acrescentar um substantivo ausente no hebraico.
- source_word: יֻלַּד
  choice: nasceu
  rationale: Expressa de modo natural em português o passivo hebraico “foi nascido”.
- source_word: שָׁם
  choice: ali
  rationale: Mantém o advérbio locativo e sua referência contextual a Sião, sem explicitar no texto mais do que o hebraico diz.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo litúrgico ou musical porque seu sentido exato permanece incerto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva o nome pessoal expresso no texto hebraico e segue a convenção do projeto.
- issue: Explicitação do referente de שָׁם
  choice: ali
  alternative: nela; em Sião
  rationale: O contexto aponta para Sião, mas o hebraico emprega apenas o advérbio “ali”; a tradução preserva essa formulação sem resolver silenciosamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. “Ao registrar” comunica naturalmente a circunstância temporal e a imagem de inscrição; “Selá” conserva a forma tradicional em português.
