base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: pt
  text: 'Mencionarei Raabe[a] e Babilônia entre os que me conhecem[b]; eis a Filístia e Tiro, com Cuxe: este nasceu ali.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raabe é um nome poético para o Egito.
    reason: alternative_reading
  - marker: b
    text: Ou “aos que me conhecem”. A preposição hebraica permite mais de uma relação sintática nesta expressão poética.
    reason: lexical_alternative
  - marker: c
    text: Isto é, em Sião, conforme o contexto do salmo.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Mencionarei
  rationale: O hifil de זכר pode significar “mencionar” ou “fazer menção de”. “Mencionarei” preserva a forma verbal e se ajusta à enumeração poética.
- source_word: רַהַב
  choice: Raabe
  rationale: Mantém o nome poético hebraico tradicionalmente associado ao Egito, cuja identificação é esclarecida em nota.
- source_word: וּבָבֶל
  choice: e Babilônia
  rationale: Emprega a forma portuguesa corrente do nome do lugar.
- source_word: לְיֹדְעָי
  choice: entre os que me conhecem
  rationale: A construção poética comprimida com לְ pode indicar inclusão no grupo dos que conhecem ou reconhecem o falante. A alternativa “aos que me conhecem” é registrada em nota.
- source_word: הִנֵּה
  choice: eis
  rationale: Preserva a função de chamar a atenção em registro poético digno e natural em português.
- source_word: פְלֶשֶׁת
  choice: a Filístia
  rationale: O hebraico nomeia a terra ou região, não explicitamente seus habitantes.
- source_word: וְצוֹר
  choice: e Tiro
  rationale: Usa a forma portuguesa consagrada do topônimo.
- source_word: עִם כּוּשׁ
  choice: com Cuxe
  rationale: Traduz de modo direto a ideia de associação expressa por עִם, mantendo Cuxe como nome próprio.
- source_word: זֶה
  choice: Este
  rationale: Preserva o demonstrativo masculino singular sem acrescentar “homem”; no contexto, pode ter força distributiva em relação aos povos mencionados.
- source_word: יֻלַּד שָׁם
  choice: nasceu ali
  rationale: Traduz diretamente o passivo de ילד e o advérbio שָׁם; “ali” conserva a referência contextual sem explicitação interpretativa no texto.
theological_decisions:
- issue: Identidade do falante em “os que me conhecem”
  choice: Manter a primeira pessoa sem identificar explicitamente o falante.
  alternative: Entender o falante como o SENHOR ou como Sião personificada.
  rationale: O verso não identifica o falante dentro da própria linha; preservar o pronome deixa que o contexto literário sustente a interpretação.
- issue: Referente de “ali”
  choice: Manter o advérbio, deixando o referente implícito.
  alternative: Substituir “ali” por “em Sião” ou “na cidade de Deus”.
  rationale: O contexto do salmo aponta para Sião, mas o hebraico emprega apenas o advérbio. A tradução preserva essa forma e esclarece a referência provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Eis” conserva o chamado de atenção do hebraico; os topônimos seguem formas portuguesas correntes ou transliterações reconhecíveis. A pontuação distingue a enumeração da declaração final sem resolver suas ambiguidades literárias.
