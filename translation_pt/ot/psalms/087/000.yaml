  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: pt
  text: 'Dos filhos de Corá.[a] Salmo e cântico.


    Seu fundamento está nos montes santos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Para os filhos de Corá. Salmo e cântico». A expressão pode indicar associação ou destinação, e não necessariamente autoria direta.'
    reason: lexical_alternative
  - marker: b
    text: O referente do sufixo em «seu» não é expresso no hebraico; pelo contexto, pode ser Sião ou Jerusalém.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: Dos filhos de Corá
  rationale: A preposição לְ pode indicar autoria, pertencimento ou associação. A formulação tradicional e natural «Dos filhos de Corá» preserva essa amplitude sem afirmar autoria individual direta.
- source_word: מִזְמוֹר שִׁיר
  choice: Salmo; cântico
  rationale: Mantém os dois termos hebraicos e usa pontuação que os apresenta como designações coordenadas do poema.
- source_word: יְסוּדָתוֹ
  choice: Seu fundamento
  rationale: Reproduz o substantivo «fundamento» e o sufixo masculino singular sem substituir por uma paráfrase verbal nem explicitar à força o referente implícito.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: nos montes santos
  rationale: Tradução direta e idiomática da construção, preservando o plural «montes» e a qualificação de santidade.
theological_decisions:
- issue: Referente do sufixo em יְסוּדָתוֹ («seu fundamento»)
  choice: Manter o pronome sem explicitar o referente
  alternative: «O fundamento de Sião está nos montes santos» ou «Ele a fundou nos montes santos»
  rationale: O hebraico traz um sufixo masculino singular cujo referente não é expresso no versículo. Embora Sião/Jerusalém seja sugerida pelo contexto do salmo, explicitá-la no texto resolveria uma ambiguidade genuína.
- issue: Relação dos filhos de Corá com o salmo
  choice: «Dos filhos de Corá»
  alternative: «Para os filhos de Corá»
  rationale: A preposição hebraica admite associação, pertencimento ou destinação; a tradução principal segue o uso convencional sem transformar a indicação em uma alegação inequívoca de autoria.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem do cabeçalho foi mantida próxima ao hebraico. O ponto e vírgula evita deixar «cântico» como fragmento isolado, e as notas preservam as ambiguidades do לְ inicial e do sufixo em יְסוּדָתוֹ.
