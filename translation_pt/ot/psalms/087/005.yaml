  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: pt
  text: 'E a respeito de Sião se dirá[a]: “Este e aquele nasceram nela”; e o próprio Altíssimo a estabelecerá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um após outro nasceu nela”. O hebraico repete “homem e homem” para expressar um sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: E a respeito de Sião
  rationale: A preposição ל introduz Sião como tópico; “a respeito de” é natural e explícito em português, enquanto “E” mantém a continuidade poética.
- source_word: יֵאָמַר
  choice: se dirá
  rationale: O nifal imperfeito de אמר tem sentido passivo e impessoal; “se dirá” preserva de modo idiomático a projeção declarativa do hebraico.
- source_word: אִישׁ וְאִישׁ
  choice: Este e aquele
  rationale: A repetição tem força distributiva, referindo-se a indivíduos um por um. “Este e aquele” conserva essa estrutura sem restringir desnecessariamente o sentido a homens adultos.
- source_word: יֻלַּד בָּהּ
  choice: nasceram nela
  rationale: Embora o verbo hebraico esteja morfologicamente no singular por acompanhar a expressão distributiva, o plural é natural em português com “este e aquele”; “nela” preserva a personificação feminina de Sião.
- source_word: וְהוּא
  choice: e o próprio
  rationale: O pronome expresso é enfático. Ligá-lo a “Altíssimo” mediante “o próprio” reproduz essa ênfase em português.
- source_word: יְכוֹנְנֶהָ
  choice: a estabelecerá
  rationale: O verbo כון aqui comunica firmar, estabelecer ou tornar segura. “Estabelecerá” equilibra proximidade lexical e clareza poética.
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: Título divino tradicional, claro e dignificado em português.
theological_decisions:
- issue: Referente do pronome enfático וְהוּא junto de עֶלְיוֹן
  choice: “o próprio Altíssimo” refere o pronome enfático a Deus
  alternative: “e ele, o Altíssimo, a estabelecerá”
  rationale: A construção atribui enfaticamente ao Altíssimo a ação de firmar Sião. A formulação preserva a ênfase hebraica sem acrescentar uma afirmação doutrinária externa.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e alcance internacional. Mantém a personificação de Sião e o paralelismo poético; o ponto e vírgula separa as duas declarações principais sem romper sua unidade.
