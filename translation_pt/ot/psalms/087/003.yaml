base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/003.yaml
  text: Glorious things are spoken of you[a], city of God. Selah
translation:
  language: pt
  text: Coisas gloriosas são ditas a seu respeito[a], cidade de Deus. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em você”. A preposição hebraica pode ser entendida de mais de uma maneira aqui; “a seu respeito” se ajusta melhor ao contexto de louvor a Sião.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Coisas gloriosas
  rationale: O particípio/adjetivo passivo feminino plural de כבד é usado substantivamente e, neste contexto poético, indica coisas honrosas, esplêndidas ou de grande importância. “Coisas gloriosas” preserva naturalmente o tom elevado.
- source_word: מְדֻבָּר
  choice: são ditas
  rationale: O particípio pual de דבר funciona de modo predicativo com נִכְבָּדוֹת. “São ditas” é uma formulação natural e digna em português.
- source_word: בָּךְ
  choice: a seu respeito
  rationale: A preposição ב com o verbo de fala pode indicar aquilo sobre o qual se fala. “A seu respeito” comunica claramente essa leitura, sem eliminar a possibilidade locativa do hebraico, registrada em nota.
- source_word: עִיר הָאֱלֹהִים
  choice: cidade de Deus
  rationale: A cadeia construta significa “cidade de Deus”. A expressão funciona como aposto vocativo referente à cidade já interpelada pelo sufixo de segunda pessoa.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo é incerta, ele é transliterado, seguindo o uso bíblico corrente em português, em vez de receber uma interpretação conjectural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Emprega-se “seu” por ser amplamente compreensível no português internacional e natural para leitores brasileiros; o referente feminino fica explicitado pelo aposto “cidade de Deus”.
