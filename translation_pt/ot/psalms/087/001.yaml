    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: Dos filhos de Corá
  rationale: O לְ dos títulos dos salmos pode indicar autoria, pertença ou associação. “Dos filhos de Corá” é conciso e tradicional, sem afirmar de modo absoluto autoria direta; a alternativa é registrada em nota.
- source_word: מִזְמוֹר שִׁיר
  choice: Salmo; cântico
  rationale: Mantém os dois termos de gênero do hebraico, em vez de fundi-los. O ponto e vírgula os apresenta como designações coordenadas dentro do título.
- source_word: יְסוּדָתוֹ
  choice: Seu fundamento
  rationale: Traduz o substantivo “fundamento” com o sufixo pronominal de terceira pessoa, deixando o referente implícito como no hebraico. Em português, “seu” preserva de modo natural a ambiguidade entre um referente masculino e Sião/Jerusalém entendida pelo contexto.
- source_word: בְּהַרְרֵי
  choice: nos montes
  rationale: A preposição בְּ pode indicar localização “em” ou “sobre”. “Nos montes” é natural em português e não força uma descrição topográfica excessivamente precisa.
- source_word: קֹדֶשׁ
  choice: santos
  rationale: O substantivo קֹדֶשׁ funciona aqui atributivamente, qualificando os montes como consagrados ou santos. “Santos” é a equivalência direta e corrente.
theological_decisions:
- issue: Referente do sufixo pronominal em יְסוּדָתוֹ
  choice: Manter o referente implícito em “Seu fundamento”
  alternative: “O fundamento dela”, tendo Sião ou Jerusalém como referente implícito; ou a paráfrase “Ele a fundou”
  rationale: O hebraico não identifica expressamente o antecedente neste versículo. A formulação escolhida conserva a tensão poética e não decide se o referente implícito é Deus, Sião/Jerusalém ou aquilo que ele fundou.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a forma tradicional “Corá”. A estrutura breve e nominal reproduz o caráter do título hebraico. O possessivo “seu” foi mantido deliberadamente ambíguo, e todas as alternativas relevantes aparecem em notas ligadas ao texto.
