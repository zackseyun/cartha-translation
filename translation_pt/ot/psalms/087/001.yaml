translation:
  language: pt
  text: 'Dos filhos de Corá[a]: salmo, cântico. Seu fundamento[b] está nos montes santos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para os filhos de Corá”. A preposição hebraica pode indicar autoria, pertença ou associação.'
    reason: lexical_alternative
  - marker: b
