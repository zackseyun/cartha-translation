base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: pt
  text: De Davi. A ti clamo, Yahweh; minha rocha, não sejas surdo para mim, para que não permaneças em silêncio para mim e eu me torne como os que descem à cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A cova” pode referir-se à sepultura ou ao mundo dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Mantém a fórmula breve e ambígua do título hebraico, que pode indicar autoria, associação, dedicação ou pertencimento.
- source_word: צוּרִי
  choice: rocha minha
  rationale: Preserva diretamente a metáfora hebraica e sua função de vocativo.
- source_word: אַל־תֶּחֱרַשׁ ... תֶּחֱשֶׁה
  choice: não fiques surdo ... permaneceres calado
  rationale: 'Distingue os dois verbos relacionados: o primeiro pode sugerir não ouvir ou não responder; o segundo enfatiza o silêncio.'
- source_word: בוֹר
  choice: cova
  rationale: Termo natural que conserva a imagem de uma cavidade profunda e, no contexto, sua associação com a sepultura ou o mundo dos mortos.
theological_decisions:
- issue: Sentido da fórmula לְדָוִד
  choice: De Davi
  alternative: Para Davi / referente a Davi
  rationale: A tradução tradicional e concisa preserva a indeterminação da relação expressa pela preposição hebraica sem impor uma teoria específica de autoria.
- issue: Relação entre o silêncio divino e a descida à cova
  choice: Pois, se permaneceres calado para comigo, serei como os que descem à cova
  alternative: Para que não permaneças calado para comigo, e eu me torne como os que descem à cova
  rationale: Entende פֶּן como introdução da consequência temida e expressa em português a relação condicional implícita, sem afirmar se a ameaça é morte literal, abandono ou ambas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “rocha minha” mantém o tom poético e o vocativo do hebraico. O nome divino é transliterado como “Yahweh”.
