  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: pt
  text: Dá-lhes conforme a sua obra e conforme a maldade de seus atos; dá-lhes conforme a obra de suas mãos; retribui-lhes o que merecem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: Dá-lhes
  rationale: O imperativo de נתן dirige a Deus uma petição direta. “Dá-lhes” é claro e preserva a força reiterada do pedido.
- source_word: כְּפָעֳלָם
  choice: conforme as suas obras
  rationale: פעל designa obra, feito ou ação. O plural idiomático em português comunica naturalmente o sentido coletivo e mantém a ideia de retribuição proporcional.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: e conforme a maldade dos seus atos
  rationale: רֹעַ expressa mal ou maldade, e מַעַלְלִים, atos ou feitos. A formulação conserva o peso moral sem acrescentar uma qualificação além do hebraico.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: conforme a obra das suas mãos
  rationale: Preserva a imagem hebraica das mãos como agentes daquilo que eles próprios fizeram, bem como o paralelismo do verso.
- source_word: הָשֵׁב
  choice: retribui-lhes
  rationale: O hifil de שוב indica aqui fazer voltar sobre alguém, isto é, pagar ou retribuir. “Retribui-lhes” transmite adequadamente o sentido judicial.
- source_word: גְּמוּלָם
  choice: o que merecem
  rationale: גְּמוּל denota paga, retribuição ou recompensa devida. “O que merecem” é natural em português moderno e mantém a noção de justa correspondência.
theological_decisions:
- issue: Linguagem imprecatória e retribuição divina
  choice: O verso é traduzido como uma petição para que Deus retribua aos maus de modo proporcional aos seus atos.
  alternative: Entender a linguagem apenas como descrição, atenuando seu caráter de pedido.
  rationale: Os imperativos repetidos — “dá... dá... retribui” — apresentam inequivocamente uma oração por justiça divina. A tradução conserva essa tensão moral sem intensificar o texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição e o paralelismo do hebraico foram mantidos. “Obra das suas mãos” conserva a imagem original; “o que merecem” evita o tom excessivamente técnico de “a sua retribuição”.
