base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: pt
  text: Yahweh é minha força e meu escudo; nele meu coração confiou, e fui socorrido. Então meu coração exultou[a], e com meu cântico eu o louvarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alegrou-se intensamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu lhe darei graças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֻזִּי
  choice: minha força
  rationale: Reproduz diretamente o sentido de força ou vigor e forma um paralelo natural com “meu escudo”.
- source_word: מָגִנִּי
  choice: meu escudo
  rationale: Preserva a metáfora concreta e transparente do hebraico.
- source_word: בּוֹ בָטַח לִבִּי
  choice: nele meu coração confiou
  rationale: Mantém o coração como sujeito e traduz o qatal por passado, de acordo com a sequência verbal do verso.
- source_word: נֶעֱזָרְתִּי
  choice: fui socorrido
  rationale: Expressa naturalmente a forma passiva do verbo עזר, sem explicitar quem prestou o auxílio além do que o contexto permite inferir.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: Então meu coração exultou
  rationale: “Exultou” comunica a alegria intensa de עלז, e “então” representa a progressão narrativa do wayyiqtol.
- source_word: וּמִשִּׁירִי
  choice: com meu cântico
  rationale: Entende a preposição מִן em sentido instrumental, adequado ao contexto de louvor por meio do canto.
- source_word: אֲהוֹדֶנּוּ
  choice: eu o louvarei
  rationale: No contexto do cântico, ידה pode indicar louvor; a nuance também possível de agradecimento é mantida em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Sentido de ידה no hifil
  choice: eu o louvarei
  alternative: eu lhe darei graças
  rationale: O paralelismo com “meu cântico” favorece “louvar”, mas o verbo também pode denotar agradecimento; por isso, a alternativa aparece em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem “nele meu coração confiou” conserva o foco poético do hebraico. Os tempos passados refletem as formas verbais do texto massorético, e o futuro em “louvarei” segue o yiqtol final.
