  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: pt
  text: Não me arrastes junto com os perversos[a], nem com os que praticam o mal, que falam de paz com os seus próximos[b], mas têm o mal no coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me leves junto com os perversos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus companheiros” ou “seus amigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: me arrastes
  rationale: Preserva a força do verbo משׁך e a súplica para não ser levado junto com os perversos, sem explicitar se isso se refere à companhia ou ao destino deles.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa pessoas moralmente más em linguagem atual e digna.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam o mal
  rationale: Mantém a ideia verbal de pessoas que fazem ativamente o mal, em português natural.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: que falam de paz
  rationale: Conserva a imagem hebraica e o contraste entre palavras exteriormente pacíficas e a maldade interior.
- source_word: רֵעֵיהֶם
  choice: o próximo
  rationale: Abrange a pessoa com quem se mantém uma relação social, sem pressupor amizade íntima; o singular coletivo é idiomático em português.
- source_word: רָעָה בִּלְבָבָם
  choice: têm o mal no coração
  rationale: Comunica naturalmente a presença de intenção ou disposição má no íntimo, preservando a imagem bíblica do coração.
theological_decisions:
- issue: Natureza da súplica do salmista quanto aos perversos
  choice: Pedido para não ser levado junto com os malfeitores, em sua companhia ou destino
  alternative: Pedido apenas para não imitar os perversos
  rationale: A construção 'não me arrastes junto com' sugere ser incluído com eles, possivelmente no juízo, mas o texto não especifica o mecanismo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom poético e digno, evita o arcaísmo “iniquidade” e preserva o contraste entre fala pacífica e mal interior.
