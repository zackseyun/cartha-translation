  text: הוֹשִׁ֤יעָ/ה אֶת עַמֶּ֗/ךָ וּ/בָרֵ֥ךְ אֶת נַחֲלָתֶ֑/ךָ וּֽ/רְעֵ֥/ם וְ֝/נַשְּׂאֵ֗/ם עַד הָ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: pt
  text: Salva o teu povo e abençoa a tua herança; pastoreia-os[a] e carrega-os[b] para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimenta-os”; o verbo hebraico pode indicar alimentar um rebanho, mas também o cuidado mais amplo de um pastor.
    reason: lexical_alternative
  - marker: b
    text: Ou “levanta-os” ou “sustenta-os”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Salva
  rationale: O imperativo de ישׁע dirige a Deus um pedido direto de livramento e salvação. “Salva” é natural, conciso e preserva a força religiosa do verbo.
- source_word: עַמֶּךָ
  choice: o teu povo
  rationale: עם com sufixo de segunda pessoa masculina singular designa o povo que pertence a Deus; “o teu povo” é claro e tradicional sem ser arcaico.
- source_word: בָרֵךְ
  choice: abençoa
  rationale: O imperativo de ברך, em contexto de oração, corresponde diretamente a “abençoa” e mantém o tom litúrgico.
- source_word: נַחֲלָתֶךָ
  choice: a tua herança
  rationale: נחלה pode indicar herança, patrimônio ou possessão. “A tua herança” conserva a metáfora da aliança pela qual o povo pertence a Deus.
- source_word: רְעֵם
  choice: pastoreia-os
  rationale: O imperativo de רעה abrange o cuidado integral do pastor, inclusive alimentar o rebanho. “Pastoreia-os” preserva essa imagem pastoral mais ampla.
- source_word: נַשְּׂאֵם
  choice: carrega-os
  rationale: נשא pode significar levantar, levar, carregar ou sustentar. Em paralelo com “pastoreia-os”, “carrega-os” expressa cuidado protetor sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: עַד הָעוֹלָם
  choice: para sempre
  rationale: A expressão indica duração contínua ou indefinida; “para sempre” é a formulação corrente e adequada ao registro poético.
theological_decisions:
- issue: Metáfora pastoral em רְעֵם
  choice: pastoreia-os
  alternative: alimenta-os
  rationale: O verbo inclui alimentar, mas não se limita a isso. A tradução escolhida mantém a imagem mais abrangente do cuidado e governo de Deus como pastor.
- issue: Identidade do povo como נַחֲלָתֶךָ
  choice: a tua herança
  alternative: a tua possessão
  rationale: “Herança” preserva a linguagem da aliança e a metáfora de um povo pertencente a Deus, sem reduzi-la à ideia genérica de propriedade.
- issue: Sentido de נַשְּׂאֵם
  choice: carrega-os
  alternative: levanta-os
  rationale: O hebraico permite tanto a ideia de carregar ou sustentar quanto a de levantar. O contexto pastoral favorece “carrega-os”, mas a nota mantém aberta a alternativa genuína.
