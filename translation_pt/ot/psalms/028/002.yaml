  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: pt
  text: Ouve a voz das minhas súplicas por misericórdia quando clamo a ti, quando levanto as mãos em direção ao teu santo santuário interior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teu santo santuário”; o termo hebraico pode designar mais especificamente o recinto interior, ou a parte mais interna, do santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouve
  rationale: O imperativo qal masculino singular dirige a Deus uma petição urgente; “Ouve” é natural e digno na linguagem de oração.
- source_word: קוֹל
  choice: a voz
  rationale: קוֹל pode significar “voz” ou “som”; junto de súplicas pessoais, “voz” preserva a imagem concreta e soa mais natural em português.
- source_word: תַּחֲנוּנַי
  choice: das minhas súplicas por misericórdia
  rationale: O termo designa pedidos insistentes de favor ou misericórdia. A formulação explicita essa nuance sem reduzir a intensidade da oração.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: quando clamo a ti
  rationale: A preposição com o infinitivo construto tem valor temporal, e שׁוע expressa um clamor intenso dirigido a Deus.
- source_word: בְּנָשְׂאִי יָדַי
  choice: quando levanto as mãos
  rationale: Mantém tanto a construção temporal quanto o gesto corporal de oração presente no hebraico.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: em direção ao teu santo santuário interior
  rationale: דְּבִיר aponta especificamente para o recinto mais interno do santuário; a expressão escolhida comunica a referência espacial de modo acessível.
theological_decisions:
- issue: Referência cúltica de דְּבִיר קָדְשֶׁךָ
  choice: teu santo santuário interior
  alternative: teu santo santuário
  rationale: A tradução específica preserva a imagem do recinto sagrado interno associado à presença de Deus, sem acrescentar afirmações doutrinárias posteriores. A alternativa mais geral continua lexicalmente possível.
translation_notes:
  register: Português moderno, claro e digno, com construção de oração compreensível no Brasil e em outras comunidades lusófonas. “Súplicas por misericórdia” conserva a intensidade sem depender do termo mais solene isoladamente; “santuário interior” mantém a precisão cultual do hebraico.
