  to: De Davi. A ti, Yahweh, clamo; ó minha Rocha, não sejas surdo para comigo; se ficares em silêncio para comigo, tornar-me-ei como os que descem à cova.[a]
  rationale: 'A revisão substitui a sequência pouco idiomática «para que, se...» por uma condição direta, que comunica com clareza a consequência receada: se Yahweh permanecer em silêncio, o salmista se tornará semelhante aos que descem à cova. «Ó minha Rocha» dá forma natural ao vocativo poético. A nota sobre a alternativa de «surdo» e «silêncio» foi retirada porque a tradução principal já mantém essa distinção lexical, e a nota sintática anterior não oferece uma alternativa portuguesa satisfatória.'
