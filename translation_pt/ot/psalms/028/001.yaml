  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: pt
  text: De Davi. A ti, Yahweh, clamo; ó minha Rocha, não sejas surdo para comigo; se ficares em silêncio para comigo, tornar-me-ei como os que descem à cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A «cova» pode designar a sepultura ou o domínio dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a ambiguidade da preposição לְ no título, que pode indicar autoria, associação ou dedicação, sem restringi-la a «por» ou «para».
- source_word: אֵלֶיךָ ... אֶקְרָא
  choice: A ti ... clamo
  rationale: Reproduz a direção da invocação e a intensidade apropriada à oração poética; «clamo» é natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צוּרִי
  choice: rocha minha
  rationale: Mantém a metáfora concreta de estabilidade e proteção, e a ordem marcada funciona como vocativo poético em português.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: não sejas surdo para comigo
  rationale: חרשׁ pode significar «ser surdo» ou «calar-se». A opção «surdo» preserva uma provável distinção em relação ao verbo de silêncio na oração seguinte.
- source_word: פֶּן תֶּחֱשֶׁה מִמֶּנִּי וְנִמְשַׁלְתִּי
  choice: para que, se ficares em silêncio para comigo, eu não me torne
  rationale: Entende פֶּן como introdução do resultado temido e conserva a possibilidade sintática de o silêncio divino ser a condição sob a qual o salmista se tornaria semelhante aos mortos.
- source_word: עִם יֹרְדֵי בוֹר
  choice: como os que descem à cova
  rationale: Depois de «tornar-se», «como» comunica naturalmente a comparação indicada pelo contexto. «Cova» conserva a imagem concreta sem limitar o referente apenas ao túmulo físico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. «Yahweh» o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de בּוֹר no destino dos que descem
  choice: cova
  alternative: sepultura; mundo dos mortos
  rationale: «Cova» mantém a imagem hebraica e sua abertura semântica, que pode apontar para a sepultura ou para o domínio dos mortos sem identificar explicitamente um conceito posterior.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo e a tensão entre Deus não ouvir e não responder, sem explicar excessivamente a imagem da cova.
