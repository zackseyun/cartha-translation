reference: Psalms 28:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: pt
  text: Pois eles não entendem as obras de Yahweh nem a obra de suas mãos[a]; ele os derrubará e não os edificará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois eles não atentam para as obras de Yahweh nem para a obra de suas mãos.”'
    reason: 'Alternativa lexical: neste contexto, בין com אֶל pode destacar não apenas compreender, mas também considerar ou prestar atenção.'
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica ou do juízo expresso no contexto anterior; “Pois” conserva de modo natural a ligação causal em português.
- source_word: לֹא יָבִינוּ אֶל
  choice: não entendem
  rationale: O verbo בין expressa entendimento ou discernimento; com אֶל, dirige esse entendimento às obras de Deus. A construção portuguesa dispensa a reprodução literal da preposição.
- source_word: פְּעֻלֹּת יְהוָה
  choice: as obras de Yahweh
  rationale: O plural designa os atos ou feitos de Deus. “Obras” mantém a relação lexical e poética com a expressão singular seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַעֲשֵׂה יָדָיו
  choice: a obra de suas mãos
  rationale: Preserva o singular hebraico e a imagem comum daquilo que Deus fez, em paralelo com “as obras de Yahweh”.
- source_word: יֶהֶרְסֵם
  choice: ele os derrubará
  rationale: הרס descreve demolir ou derrubar; a escolha conserva a metáfora de construção que contrasta com o verbo seguinte.
- source_word: וְלֹא יִבְנֵם
  choice: e não os edificará
  rationale: Mantém o sentido básico de בנה, “construir/edificar”, e o contraste deliberado com “derrubará”, sem acrescentar a ideia não explícita de reconstrução.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Alcance do juízo na metáfora de derrubar e edificar
  choice: ele os derrubará e não os edificará
  alternative: ele os destruirá e não os reconstruirá
  rationale: A tradução conserva a tensão e a imagem arquitetônica dos dois verbos hebraicos, sem especificar destruição absoluta nem uma reconstrução anterior que o texto não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sem construções artificiais; “edificará” mantém a metáfora poética em registro bíblico corrente.
