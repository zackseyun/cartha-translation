  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: pt
  text: Yahweh é a força deles; ele é a fortaleza de salvação[a] para o seu ungido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fortaleza de livramentos» ou «fortaleza de atos salvadores»; o substantivo hebraico está no plural, literalmente «salvações».
    reason: lexical_alternative
  - marker: b
    text: «Seu ungido» também pode ser traduzido como «seu Messias». No contexto, a expressão provavelmente se refere primeiro ao rei ungido por Yahweh, sem excluir uma ressonância messiânica mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio, em vez de substituí-lo pelo título «SENHOR».
- source_word: עֹז
  choice: força
  rationale: Expressa diretamente força ou poder e mantém a distinção em relação a מָעוֹז, traduzido como «fortaleza».
- source_word: לָמוֹ
  choice: deles
  rationale: Preserva o pronome hebraico da terceira pessoa do plural, sem especificar no texto quem são eles.
- source_word: מָעוֹז
  choice: fortaleza
  rationale: Conserva a imagem de um lugar seguro e fortificado, além de ser claro em português atual.
- source_word: יְשׁוּעוֹת
  choice: salvação
  rationale: O hebraico emprega o plural, mas «fortaleza de salvações» seria pouco natural em português; o singular coletivo comunica livramento e atos salvadores, enquanto a forma plural é registrada em nota.
- source_word: מְשִׁיחוֹ
  choice: seu ungido
  rationale: Traduz o sentido contextual de alguém consagrado pela unção, provavelmente o rei, sem transformar necessariamente a expressão no título técnico «Messias».
- source_word: הוּא
  choice: é
  rationale: A cópula portuguesa comunica de maneira natural a afirmação nominal; a estrutura coordenada permite que o segundo «é» fique subentendido sem perda de sentido.
theological_decisions:
- issue: Se מְשִׁיחוֹ deve ser traduzido como título («seu Messias») ou como expressão descritiva («seu ungido»).
  choice: seu ungido
  alternative: seu Messias
  rationale: No contexto do salmo, a expressão pode designar primeiramente o rei ungido por Yahweh. A tradução principal preserva esse sentido imediato, e a nota mantém a possível ressonância messiânica sem impor uma conclusão dogmática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Fortaleza de salvação» evita o pouco natural «fortaleza de salvações», enquanto a nota preserva o plural hebraico. Os marcadores foram colocados junto aos termos a que efetivamente se referem.
