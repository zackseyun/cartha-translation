  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: pt
  text: Bendito seja Yahweh, pois ele ouviu a voz das minhas súplicas por misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som das minhas súplicas”. O hebraico pode significar literalmente “a voz” ou “o som” das minhas súplicas por misericórdia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo funciona de modo predicativo numa fórmula exclamativa de louvor; “Bendito seja” é natural, digno e preserva essa força.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e concisa a razão do louvor.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O perfeito hebraico apresenta a ação como realizada; no contexto, o pretérito perfeito português é natural e não elimina sua relevância presente.
- source_word: קוֹל
  choice: a voz de
  rationale: קוֹל pode significar “voz” ou “som”; “a voz das minhas súplicas” mantém a imagem hebraica e soa mais pessoal e idiomático que “o som” neste contexto de oração.
- source_word: תַּחֲנוּנָי
  choice: minhas súplicas por misericórdia
  rationale: Expressa pedidos insistentes de favor ou compaixão; “súplicas” preserva a intensidade, enquanto “por misericórdia” explicita naturalmente a orientação semântica do termo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar outra forma tradicional de transliteração.
translation_notes:
  register: Português moderno, claro e reverente, de ampla compreensão internacional e boa legibilidade brasileira. A formulação conserva o paralelismo conceitual e a expressão hebraica sem recorrer a vocabulário arcaico.
