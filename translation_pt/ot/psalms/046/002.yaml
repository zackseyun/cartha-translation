base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: pt
  text: Por isso, não teremos medo, ainda que a terra se transforme[a] e os montes vacilem no coração dos mares.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a terra seja mudada». O verbo hebraico pode indicar mudança ou troca; aqui descreve a desestabilização da terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e os montes tremam no coração dos mares».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca naturalmente a conclusão baseada na confissão anterior de que Deus é refúgio e força.
- source_word: לֹא נִירָא
  choice: não teremos medo
  rationale: O imperfeito na primeira pessoa do plural expressa confiança e resolução; o futuro preserva bem essa força em português.
- source_word: בְּהָמִיר
  choice: ainda que ... se transforme
  rationale: A construção com infinitivo descreve a circunstância, e o verbo pode indicar mudança ou substituição. «Se transforme» mantém essa amplitude sem reduzir a imagem apenas a um colapso físico.
- source_word: אָרֶץ
  choice: a terra
  rationale: O contexto de montes e mares sugere uma convulsão cósmica, não apenas uma região ou território.
- source_word: וּבְמוֹט
  choice: e ... vacilem
  rationale: O verbo retrata perda de estabilidade, oscilação ou deslocamento. «Vacilem» conserva a imagem sem especificar indevidamente o mecanismo da queda.
- source_word: הָרִים
  choice: os montes
  rationale: Equivalente direto, corrente e poético para os acidentes geográficos mencionados.
- source_word: בְּלֵב
  choice: para o coração dos
  rationale: Preserva a metáfora hebraica de «coração» como o interior ou centro e, com «para», comunica o movimento implícito no contexto.
- source_word: יַמִּים
  choice: mares
  rationale: Mantém o plural explícito do hebraico e a amplitude poética da cena.
