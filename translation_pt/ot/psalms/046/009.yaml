  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: pt
  text: Ele faz cessar as guerras até os confins da terra; quebra o arco e corta a lança em pedaços; queima as carroças[a] no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carros de guerra”. A palavra hebraica significa mais literalmente “carroças” ou “carros de transporte”, embora algumas traduções usem “carros de guerra” por causa do contexto militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: faz cessar as guerras
  rationale: Preserva a força causativa do particípio hifil de שׁבת e traduz מִלְחָמוֹת diretamente como “guerras”.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: até os confins da terra
  rationale: Expressão portuguesa natural para a extensão universal indicada literalmente pelo “extremo” ou “limite” da terra.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: quebra o arco
  rationale: Mantém o singular genérico do hebraico e traduz de modo direto o piel de שׁבר.
- source_word: וְקִצֵּץ חֲנִית
  choice: e corta a lança em pedaços
  rationale: קצץ descreve cortar ou decepar; com “lança”, a formulação comunica naturalmente a destruição da arma sem especificar, como faria “em duas”, um número de partes ausente no hebraico.
- source_word: עֲגָלוֹת
  choice: as carroças
  rationale: O substantivo designa normalmente carroças ou carros de transporte, e não emprega o termo hebraico usual para carros de guerra. “Carroças” evita a leitura moderna de automóveis.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: queima ... no fogo
  rationale: Reproduz a imagem concreta da expressão hebraica com uma construção clara e natural em português.
theological_decisions:
- issue: Tradução tradicional de עֲגָלוֹת no contexto militar
  choice: carroças
  alternative: carros de guerra
  rationale: Não há questão doutrinária envolvida. O texto principal segue o sentido lexical comum do substantivo hebraico, enquanto a nota preserva a interpretação tradicional sugerida pelo contexto bélico.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Confins da terra” conserva o alcance universal da expressão hebraica; “carroças” prioriza o sentido lexical sem ocultar a alternativa tradicional.
