base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: pt
  text: As nações se agitaram[a], os reinos vacilaram; ele fez ouvir a sua voz, e a terra se derreteu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As nações estavam em tumulto, os reinos foram abalados.”'
    reason: Alternativa lexical que torna mais explícitos o tumulto de הָמוּ e o abalo ou perda de estabilidade de מָטוּ.
lexical_decisions:
- source_word: הָמוּ
  choice: se agitavam
  rationale: O verbo expressa ruído tumultuoso e agitação. “Se agitavam” comunica a instabilidade coletiva sem limitar o sentido ao som nem acrescentar explicitamente fúria hostil.
- source_word: גּוֹיִם
  choice: nações
  rationale: No contexto, refere-se a povos organizados politicamente e forma paralelo com “reinos”; “nações” preserva esse alcance sem introduzir o contraste religioso sugerido por “gentios”.
- source_word: מָטוּ
  choice: vacilavam
  rationale: O verbo descreve perda de firmeza, oscilação ou risco de queda. “Vacilavam” mantém a imagem de reinos instáveis sem antecipar uma queda consumada.
- source_word: מַמְלָכוֹת
  choice: reinos
  rationale: Equivalente direto e natural para domínios políticos, adequado ao paralelismo poético.
- source_word: נָתַן בְּקוֹלוֹ
  choice: fez ouvir a sua voz
  rationale: A expressão significa literalmente “deu a sua voz”. A formulação escolhida preserva a ideia de uma manifestação vocal poderosa em português natural, sem reduzir o ato apenas a falar mais alto.
- source_word: תָּמוּג
  choice: se derreteu
  rationale: O verbo pode indicar derreter-se, dissolver-se ou perder a firmeza. “Se derreteu” conserva a imagem poética forte do texto hebraico.
- source_word: אָרֶץ
  choice: a terra
  rationale: O horizonte abrangente do salmo, com nações e reinos, favorece o sentido cósmico de “terra” em vez do sentido regional de “país” ou “terra habitada”.
theological_decisions:
- issue: Sujeito implícito de נָתַן
  choice: “ele”, entendido pelo contexto como Deus
  alternative: Explicitar “Deus” ou “o SENHOR”
  rationale: O hebraico traz um sujeito masculino singular implícito. O pronome “ele” mantém a concisão e permite que o contexto identifique Deus, sem inserir neste versículo um nome divino que não aparece explicitamente nele.
translation_notes:
  register: Português moderno, poético e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A pontuação preserva as três imagens sucessivas e a intervenção decisiva da voz divina.
