  text: אֱלֹהִ֣ים בְּ֭/קִרְבָּ/הּ בַּל תִּמּ֑וֹט יַעְזְרֶ֥/הָ אֱ֝לֹהִ֗ים לִ/פְנ֥וֹת בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: pt
  text: Deus está no meio dela[a]; ela não será abalada[b]. Deus a ajudará ao despontar da manhã.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentro dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não vacilará” ou “não cambaleará”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “ao voltar-se da manhã”; isto é, ao amanhecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, neste contexto designa claramente o único Deus de Israel.
- source_word: בְּקִרְבָּהּ
  choice: no meio dela
  rationale: A expressão indica presença no interior da cidade. “No meio dela” é natural em português e preserva o pronome feminino sem explicitar interpretativamente o referente.
- source_word: בַּל
  choice: não
  rationale: A partícula poética nega o verbo seguinte; “não” comunica o sentido sem acrescentar uma ênfase que o contexto não exige.
- source_word: תִּמּוֹט
  choice: será abalada
  rationale: O nifal de מוט descreve algo que cambaleia, vacila ou é deslocado. “Será abalada” preserva a imagem de estabilidade e soa natural no registro poético dos Salmos.
- source_word: יַעְזְרֶהָ
  choice: a ajudará
  rationale: O imperfeito expressa aqui uma ação futura ou assegurada. A formulação é concisa e mantém o objeto feminino singular.
- source_word: לִפְנוֹת בֹּקֶר
  choice: ao despontar da manhã
  rationale: A expressão evoca a chegada ou virada da manhã. “Ao despontar da manhã” transmite essa imagem em português natural, sem reduzi-la apenas a uma indicação cronológica seca.
theological_decisions:
- issue: Referente dos pronomes femininos singulares
  choice: Manter “dela/ela/a”, remetendo à cidade de Deus ou Sião no contexto imediato.
  alternative: Substituir os pronomes por “cidade” ou generalizar o referente como a comunidade do povo de Deus.
  rationale: A gramática feminina singular aponta naturalmente para a cidade mencionada no contexto. Preservar os pronomes evita inserir no versículo uma identificação interpretativa mais explícita que o hebraico não faz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das frases acompanha de perto o paralelismo hebraico; “ao despontar da manhã” preserva a imagem poética em linguagem idiomática.
