  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: pt
  text: Javé[a] dos Exércitos está conosco; o Deus de Jacó é a nossa fortaleza. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, na forma tradicional: «O SENHOR dos Exércitos está conosco».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma corrente em português o nome divino, em vez de substituí-lo pelo título «SENHOR».
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva a força militar e possivelmente cósmica do título hebraico, com formulação clara e consagrada em português.
- source_word: עִמָּנוּ
  choice: está conosco
  rationale: Expressa de modo direto e natural a presença solidária e protetora indicada pela preposição hebraica.
- source_word: מִשְׂגָּב לָנוּ
  choice: é a nossa fortaleza
  rationale: O substantivo designa um lugar alto e seguro, um refúgio defensivo; a formulação portuguesa comunica de modo idiomático a relação de proteção expressa por לָנוּ.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: o Deus de Jacó
  rationale: Reproduz diretamente a cadeia construta e mantém a referência pactual ao patriarca.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo é incerta, preserva-se a transliteração em vez de impor uma interpretação musical.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Javé dos Exércitos
  alternative: O SENHOR dos Exércitos
  rationale: O texto traz explicitamente o nome divino; «Javé» o preserva, enquanto «SENHOR» representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém o paralelismo poético, emprega «Javé» para o nome divino e conserva «Selá» por causa de sua função incerta.
