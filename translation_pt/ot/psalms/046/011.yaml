source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: pt
  text: Yahweh dos Exércitos está conosco[a]; o Deus de Jacó é nossa fortaleza[b]. Selá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O SENHOR dos Exércitos está conosco”. O hebraico צְבָאוֹת, tradicionalmente traduzido por “hostes”, refere-se a exércitos ou tropas e pode ter conotações celestiais.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma fortaleza para nós”. O termo hebraico מִשְׂגָּב também pode ser traduzido por “refúgio” ou “alto refúgio” e designa um lugar elevado e seguro de proteção.
    reason: lexical_alternative
  - marker: c
    text: “Selá” é um termo hebraico litúrgico ou musical cujo significado exato é incerto; por isso, é mantido sem tradução.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressa de modo claro o sentido militar de צְבָאוֹת e preserva as possíveis conotações de exércitos celestiais.
- source_word: עִמָּנוּ
  choice: está conosco
  rationale: Traduz naturalmente a oração nominal hebraica e o sentido da preposição com sufixo da primeira pessoa do plural.
- source_word: מִשְׂגָּב
  choice: fortaleza
  rationale: Preserva a imagem de um lugar elevado, seguro e fortificado; em português, 'fortaleza' comunica proteção e defesa com naturalidade.
- source_word: לָנוּ
  choice: nossa
  rationale: O possessivo português expressa de maneira idiomática a ideia hebraica de benefício, literalmente 'fortaleza para nós'.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: o Deus de Jacó
  rationale: Mantém a construção de identificação pactual e o conhecido idioma bíblico em português.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo litúrgico ou musical é incerto, a transliteração evita uma interpretação excessivamente específica.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: Mantém o nome divino explícito e traduz צְבָאוֹת de maneira compreensível, sem restringir indevidamente a referência a exércitos terrenos ou celestiais.
- issue: Sentido metafórico de מִשְׂגָּב
  choice: nossa fortaleza
  alternative: refúgio para nós; alto refúgio para nós
  rationale: Conserva a figura de segurança fortificada e elevada, sem reduzi-la à ideia mais genérica de abrigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela do hebraico foi preservada. O possessivo 'nossa' torna לָנוּ idiomático sem alterar sua função benefativa; a nota registra a forma mais literal. Os marcadores seguem a ordem em que aparecem no texto.
