lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente quem dirigia a execução musical. “Regente” é claro, conciso e evita limitar a função exclusivamente a um coro.
- source_word: לִבְנֵי קֹרַח
  choice: Dos filhos de Corá
  rationale: A preposição pode indicar autoria, associação ou responsabilidade pela execução. “Dos filhos de Corá” conserva essa ambiguidade tradicional sem escolher uma função específica.
- source_word: עַל
  choice: Conforme
  rationale: Em indicações musicais, pode introduzir uma melodia, um estilo ou outra orientação de execução. “Conforme” expressa essa relação sem definir qual delas está em vista.
- source_word: עֲלָמוֹת
  choice: Alamote
  rationale: O sentido do termo técnico é incerto; pode referir-se a jovens mulheres, a vozes agudas ou ao nome de uma melodia. A transliteração evita resolver indevidamente a questão.
- source_word: שִׁיר
  choice: Cântico
  rationale: Identifica de modo breve e digno o gênero da composição, preservando sua função nominal no título.
