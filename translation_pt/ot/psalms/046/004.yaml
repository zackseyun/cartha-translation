  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: pt
  text: Um rio[a] — suas correntes alegram a cidade de Deus, as santas moradas do Altíssimo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Há um rio cujas correntes alegram a cidade de Deus”. O hebraico começa simplesmente com “Um rio”, sem verbo expresso.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “moradas”, no plural. A expressão pode referir-se ao conjunto do recinto sagrado; algumas traduções a vertem no singular, como “a santa morada” ou “o santuário”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Um rio
  rationale: O substantivo não tem artigo no hebraico. “Um rio” preserva essa indefinição e a abertura poética sem acrescentar um verbo inexistente no texto.
- source_word: פְּלָגָיו
  choice: suas correntes
  rationale: O plural com sufixo de terceira pessoa masculina retoma o rio. “Correntes” comunica de modo natural os cursos de água que dele procedem.
- source_word: יְשַׂמְּחוּ
  choice: alegram
  rationale: A forma piel expressa que as correntes causam alegria. “Alegram” preserva essa força causativa com concisão poética.
- source_word: עִיר אֱלֹהִים
  choice: a cidade de Deus
  rationale: Reproduz com clareza e dignidade a relação do estado construto hebraico.
- source_word: קְדֹשׁ מִשְׁכְּנֵי
  choice: a santa morada
  rationale: A expressão poética identifica a cidade como o lugar santo onde o Altíssimo habita. O singular coletivo produz português natural, enquanto a nota registra que מִשְׁכְּנֵי tem forma plural.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: É o título divino tradicional e semanticamente direto para “o Mais Alto”.
theological_decisions:
- issue: Se o plural hebraico מִשְׁכְּנֵי deve aparecer como plural formal ou como singular coletivo em português
  choice: a santa morada
  alternative: as santas moradas / o lugar santo das moradas
  rationale: O contexto apresenta a cidade de Deus como o âmbito da presença divina, e o singular coletivo é mais natural em português. A nota mantém transparência quanto à forma plural hebraica, que pode indicar as dependências ou o conjunto do recinto sagrado.
- issue: Se deve ser acrescentado um verbo existencial no início
  choice: Um rio —
  alternative: Há um rio cujas correntes...
  rationale: O hebraico começa com uma frase nominal. O travessão conserva a abertura abrupta e poética sem decidir que o verbo implícito seja necessariamente existencial.
translation_notes:
  register: Português moderno, poético e reverente, com leitura natural no Brasil e ampla compreensão internacional. O travessão conserva a concisão da abertura hebraica; “Altíssimo” mantém o título divino reconhecível.
