base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: pt
  text: Parem[a] e saibam que eu sou Deus. Serei exaltado entre as nações[b]; serei exaltado na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Fiquem quietos”, “Cessem” ou “Soltem”; o imperativo hebraico pode significar afrouxar, parar ou soltar o que se tem nas mãos.
    reason: lexical_alternative
  - marker: b
    text: “Serei exaltado” também pode ser traduzido por “sou exaltado”; a forma hebraica pode ter força presente ou futura neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Parem
  rationale: O imperativo plural de רפה pode significar afrouxar, largar ou cessar. No contexto de conflitos entre as nações, “Parem” expressa diretamente a ordem de abandonar a agitação e a resistência, sem restringi-la à contemplação interior.
- source_word: וּדְעוּ
  choice: e saibam
  rationale: ידע significa primariamente “saber/conhecer” e aqui inclui reconhecer quem Deus é. “Saibam” mantém a forma imperativa plural e a formulação direta.
- source_word: כִּי
  choice: que
  rationale: 'Aqui כִּי introduz o conteúdo daquilo que os ouvintes devem saber: “que eu sou Deus”.'
- source_word: אָנֹכִי אֱלֹהִים
  choice: eu sou Deus
  rationale: A presença do pronome אָנֹכִי dá ênfase ao sujeito. Em português, “eu sou Deus” preserva naturalmente essa ênfase sem acrescentar um intensificador ausente do texto.
- source_word: אָרוּם
  choice: serei exaltado
  rationale: O imperfeito qal de רום pode ter força futura ou expressar uma realidade certa. “Serei exaltado” comunica a certeza da supremacia manifesta de Deus e mantém o paralelismo das duas ocorrências.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa povos ou nações. “Entre as nações” é natural em português e preserva o alcance internacional do verso.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. O paralelismo com “entre as nações” favorece aqui o sentido global, adequadamente expresso por “na terra”.
theological_decisions:
- issue: Força do imperativo הַרְפּוּ
  choice: Uma ordem ampla para cessar a agitação, a luta ou a resistência diante da soberania de Deus, traduzida por “Parem”
  alternative: Uma ordem exclusivamente militar para interromper o combate, ou exclusivamente devocional para ficar em silêncio interior
  rationale: O verbo indica afrouxar, largar ou cessar, e o contexto fala de guerras, nações em tumulto e do governo de Deus. “Parem” preserva a amplitude da ordem e evita reduzi-la tanto a um comando militar quanto a uma prática contemplativa.
- issue: Valor temporal de אָרוּם
  choice: 'Futuro de certeza: “serei exaltado”'
  alternative: 'Presente: “sou exaltado”'
  rationale: A forma verbal admite nuance presente ou futura conforme o contexto. O futuro expressa bem a certeza de que a supremacia de Deus será reconhecida universalmente, sem negar sua exaltação atual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Parem” torna explícito o número do imperativo hebraico. A redação conserva o paralelismo poético e evita interpretar a abertura apenas como quietude contemplativa.
