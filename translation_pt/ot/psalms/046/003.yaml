  yaml_path: translation/ot/psalms/046/003.yaml
  text: Its waters roar and foam; the mountains quake at its swelling[a]. Selah
translation:
  language: pt
  text: Ainda que suas águas rujam e espumem, e os montes estremeçam com sua agitação.[a] Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sua elevação”, “com sua soberba” ou “com sua arremetida”. O substantivo hebraico pode indicar exaltação, orgulho ou o movimento ascendente e impetuoso das águas; neste contexto, a imagem física das águas revoltas é provavelmente a pretendida.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: rujam
  rationale: O verbo המה expressa ruído forte e tumultuoso; “rujam” preserva a força sonora e combina naturalmente com águas revoltas.
- source_word: יֶחְמְרוּ
  choice: espumem
  rationale: Neste contexto, חמר provavelmente descreve águas revolvidas, turvas ou espumantes; “espumem” forma uma imagem clara e natural em português.
- source_word: מֵימָיו
  choice: suas águas
  rationale: Mantém a relação possessiva do sufixo hebraico de terceira pessoa masculina singular, cujo referente no contexto é o mar mencionado no versículo anterior.
- source_word: יִרְעֲשׁוּ
  choice: estremeçam
  rationale: רעשׁ indica forte tremor ou abalo; “estremeçam” é vívido e idiomático tendo os montes como sujeito.
- source_word: הָרִים
  choice: os montes
  rationale: Preserva o artigo definido hebraico e emprega uma forma corrente e digna no registro poético dos Salmos.
- source_word: בְּגַאֲוָתוֹ
  choice: com sua agitação
  rationale: גאות pode indicar exaltação, orgulho ou elevação das águas. “Agitação” comunica aqui o movimento impetuoso das águas sem resolver em excesso a ambiguidade lexical, explicitada na nota.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional por se tratar de uma indicação litúrgica ou musical de sentido exato incerto.
