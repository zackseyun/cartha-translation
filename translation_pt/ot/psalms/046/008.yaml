base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: pt
  text: Venham, vejam as obras do SENHOR, que causou desolações na terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo plural literalmente ligado a “ir” funciona aqui como convite ou convocação; “Venham” é a forma natural em português.
- source_word: חֲזוּ
  choice: vejam
  rationale: Expressa olhar ou contemplar atentamente; “vejam” conserva o imperativo e é claro para leitores modernos.
- source_word: מִפְעֲלוֹת
  choice: as obras
  rationale: Equivalente direto e tradicional para os feitos ou ações realizados pelo SENHOR.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama com “SENHOR” em versaletes.
- source_word: שָׂם
  choice: trouxe
  rationale: O verbo significa literalmente “pôs/colocou”; no contexto, “trouxe desolações” comunica de modo natural que ele as causou ou estabeleceu, sem enfraquecer sua agência.
- source_word: שַׁמּוֹת
  choice: desolações
  rationale: Preserva o plural forte do hebraico e a imagem de lugares ou condições devastados.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: A preposição pode ser vertida contextualmente como “sobre”; “terra” preserva a possível amplitude entre território e mundo habitado.
theological_decisions:
- issue: Atribuição das desolações ao SENHOR
  choice: que trouxe desolações
  alternative: que pôs desolações
  rationale: Mantém explícita a agência divina afirmada no hebraico, sem suavizar a tensão teológica; “trouxe” é mais idiomático em português do que “pôs” nesta combinação.
- issue: Alcance de אֶרֶץ
  choice: a terra
  alternative: o país
  rationale: “Terra” conserva a ambiguidade do hebraico entre uma região específica e a terra em sentido amplo, adequada ao horizonte poético do salmo.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural e ordem sintática natural. A tradução mantém a força perturbadora do texto ao atribuir diretamente ao SENHOR as desolações.
