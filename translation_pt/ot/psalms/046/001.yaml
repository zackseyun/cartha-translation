    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui o sentido é singular e se refere ao Deus de Israel.
- source_word: לָנוּ
  choice: nosso
  rationale: A expressão significa literalmente “para nós”, mas, nesta construção predicativa, “nosso” é a formulação natural em português.
- source_word: מַחֲסֶה
  choice: refúgio
  rationale: Expressa de modo direto um lugar de proteção e segurança, preservando a imagem poética.
- source_word: וָעֹז
  choice: e força
  rationale: עֹז denota força ou poder; “força” mantém a forma abstrata e combina naturalmente com “refúgio”.
- source_word: עֶזְרָה
  choice: auxílio
  rationale: O substantivo indica ajuda ou socorro. “Auxílio” mantém a construção nominal e um registro digno e atual.
- source_word: בְּצָרוֹת
  choice: nas angústias
  rationale: O plural designa situações de aflição ou aperto; “nas angústias” preserva tanto o plural quanto a intensidade do termo.
- source_word: נִמְצָא מְאֹד
  choice: plenamente disponível
  rationale: A expressão literalmente fala de ser “encontrado” intensamente ou em alto grau. Em português, “plenamente disponível” comunica de modo natural que Deus se mostra prontamente acessível, sem reduzir a força do intensificador.
theological_decisions:
- issue: Estrutura e sentido da cláusula final
  choice: “auxílio plenamente disponível nas angústias”
  alternative: “auxílio encontrado em extremo nas angústias” ou “socorro bem presente nas angústias”
  rationale: A sequência hebraica é compacta e permite conservar a noção literal de Deus ser “encontrado” em alto grau ou expressá-la idiomaticamente como disponibilidade comprovada. O texto principal adota uma formulação natural em português, enquanto a nota registra a forma mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é poético e digno, sem arcaísmos; a formulação principal prioriza equivalência ótima, e a nota preserva a construção incomum do hebraico.
