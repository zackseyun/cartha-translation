  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: pt
  text: De Davi. Masquil[a]. Feliz aquele cuja transgressão foi perdoada[b], cujo pecado foi coberto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Masquil, termo usado em títulos de salmos cujo sentido exato é incerto; talvez indique uma composição instrutiva ou contemplativa.
    reason: cultural_note
  - marker: b
    text: Literalmente, “foi levantada” ou “foi levada embora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל (maskíl)
  choice: Masquil
  rationale: Mantém transliterado o termo técnico do título, pois seu sentido exato é incerto; a nota apresenta as possibilidades mais prováveis.
- source_word: אַשְׁרֵי (’ashrê)
  choice: Feliz aquele
  rationale: Expressa naturalmente a condição favorecida ou venturosa indicada pela fórmula hebraica, sem reduzi-la a um simples estado emocional.
- source_word: נְשׂוּי (nesui)
  choice: foi perdoada
  rationale: No contexto, comunica o sentido idiomático de a transgressão ter sido removida, enquanto a nota preserva a imagem literal de ser levantada ou levada embora.
- source_word: כְּסוּי (kesui)
  choice: foi coberto
  rationale: Preserva a metáfora hebraica e seu paralelismo com a transgressão perdoada.
theological_decisions:
- issue: Relação expressa por לְדָוִד no título
  choice: De Davi
  alternative: Para Davi / dedicado a Davi
  rationale: A formulação tradicional e concisa preserva a possível atribuição davídica sem desenvolver no corpo do texto uma explicação que o hebraico não explicita.
- issue: Metáforas do perdão
  choice: Traduzir נְשׂוּי por “foi perdoada” e manter כְּסוּי como “foi coberto”
  alternative: “foi levantada/levada embora” e “foi coberto”
  rationale: A primeira expressão é idiomática e requer clareza em português; a segunda permanece natural e conserva a tensão poética e teológica do paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Masquil” conserva o termo técnico sem impor uma interpretação incerta; “Feliz aquele” reproduz de modo natural a fórmula sapiencial hebraica.
