id: PSA.32.2
reference: Psalms 32:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: pt
  text: Feliz o homem[a] a quem o SENHOR não atribui culpa[b] e em cujo espírito não há engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui, “homem” tem sentido genérico: refere-se à pessoa humana, não somente ao sexo masculino.'
    reason: lexical_alternative
  - marker: b
    text: Ou “iniquidade” ou “pecado”. O termo hebraico pode indicar tanto a transgressão quanto a culpa resultante dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A forma plural funciona idiomaticamente como uma exclamação de bem-aventurança. “Feliz” é natural em português e expressa a condição favorecida, não apenas uma emoção passageira.
- source_word: אָדָם
  choice: o homem
  rationale: O substantivo está no singular e tem sentido representativo e genérico. A tradução conserva a forma masculina do hebraico, enquanto a nota esclarece que a referência não se limita aos homens.
- source_word: יַחְשֹׁב ... לֹו
  choice: não atribui ... a quem
  rationale: חשב com objeto indireto comunica a ideia de computar, considerar ou lançar algo na conta de alguém. “Atribui” mantém a nuance forense e contábil em português corrente.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: A forma em versaletes segue a convenção portuguesa amplamente reconhecida para o nome divino YHWH e preserva sua distinção em relação ao título comum “Senhor”.
- source_word: עָוֹן
  choice: culpa
  rationale: O termo pode designar a iniquidade cometida, a culpa resultante ou suas consequências. No contexto da linguagem de atribuição, “culpa” combina clareza com a nuance forense, sem eliminar as alternativas lexicais, registradas em nota.
- source_word: בְּרוּחוֹ
  choice: em cujo espírito
  rationale: A expressão aponta para a disposição interior da pessoa e se liga naturalmente, em português, ao antecedente singular.
- source_word: רְמִיָּה
  choice: engano
  rationale: O termo denota falsidade, fraude ou dolo. “Engano” é atual, compreensível e adequado ao contraste do salmo entre ocultação e confissão sincera.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: o homem
  alternative: a pessoa; o ser humano
  rationale: O hebraico emprega um singular masculino com força representativa. A redação mantém essa forma sem entender a declaração como exclusiva do sexo masculino; a nota explicita o alcance genérico.
- issue: Metáfora forense da não atribuição
  choice: não atribui culpa
  alternative: não leva em conta a iniquidade; não imputa pecado; não lança a culpa em sua conta
  rationale: A tradução preserva a linguagem de avaliação ou contabilidade do hebraico, mas evita tanto uma paráfrase que sugira mera indiferença ao pecado quanto terminologia técnica desnecessária.
- issue: Amplitude semântica de עָוֹן
  choice: culpa
  alternative: iniquidade; pecado
  rationale: O contexto permite ouvir tanto o ato perverso quanto a culpa que dele decorre. “Culpa” se ajusta à construção com חשב, enquanto a nota conserva a ambiguidade lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com cadência própria de uma bem-aventurança. “SENHOR” em versaletes representa o nome divino YHWH. A sintaxe conserva o paralelismo entre a culpa não atribuída por Deus e a ausência de engano no íntimo.
