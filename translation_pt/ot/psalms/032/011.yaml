  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: pt
  text: Alegrem-se em Yahweh[a] e exultem, justos; gritem de alegria[b], todos os retos de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui transliterado como “Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “cantem de alegria”. O verbo hebraico pode indicar um brado vibrante de alegria, gritado ou cantado.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Alegrem-se
  rationale: O imperativo plural de שׂמח convoca à alegria. “Alegrem-se” é claro e natural, além de permitir distinguir o verbo seguinte.
- source_word: בַיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica o âmbito ou objeto da alegria; “em” preserva essa relação sem explicá-la em excesso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: וְגִילוּ
  choice: e exultem
  rationale: O imperativo de גיל expressa alegria intensa. “Exultem” mantém essa intensidade e evita repetir “alegrem-se”.
- source_word: צַדִּיקִים
  choice: vocês, justos
  rationale: O substantivo funciona como vocativo, identificando diretamente os destinatários dos imperativos.
- source_word: וְהַרְנִינוּ
  choice: gritem de alegria
  rationale: O hifil imperativo de רנן designa uma manifestação sonora e vibrante de alegria, que pode ser gritada ou cantada.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: todos vocês que são retos de coração
  rationale: Preserva tanto a abrangência de כָּל quanto a ideia hebraica de integridade interior expressa por יִשְׁרֵי לֵב, em português compreensível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama como nome divino. A transliteração mantém o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Sentido de “retos de coração”
  choice: integridade moral interior
  alternative: mera sinceridade subjetiva
  rationale: A expressão יִשְׁרֵי לֵב aponta para retidão interior, sem reduzir seu sentido à simples franqueza ou sinceridade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi preservado, assim como a progressão entre alegrar-se, exultar e manifestar a alegria em voz alta.
