  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: pt
  text: Eu lhe darei entendimento e lhe ensinarei o caminho por onde você deve andar[a]; eu o aconselharei, com meu olhar sobre você[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o caminho por onde você andará” ou “por este caminho você andará”. O hebraico admite um sentido futuro mais literal, mas o contexto de instrução favorece “por onde você deve andar”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “meu olho sobre você”. A expressão pode indicar orientação vigilante ou cuidado atento.
    reason: lexical_alternative
  - marker: c
    text: Não fica explícito neste versículo se quem fala é o SENHOR ou o salmista.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: Eu lhe darei entendimento
  rationale: 'O hifil de שׂכל tem sentido causativo: fazer compreender, dar discernimento. A formulação preserva esse valor de modo natural em português.'
- source_word: וְאוֹרְךָ
  choice: e lhe ensinarei
  rationale: O hifil de ירה pode significar ensinar, instruir ou orientar. “Ensinarei” mantém o paralelismo pedagógico, enquanto “o caminho” conserva a nuance direcional.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: o caminho por onde você deve andar
  rationale: A construção admite literalmente um sentido futuro, “o caminho por onde você andará”, mas, no contexto de instrução e conselho, “deve andar” expressa naturalmente a direção pretendida sem eliminar a alternativa, registrada em nota.
- source_word: אִיעֲצָה
  choice: eu o aconselharei
  rationale: O verbo יעץ significa aconselhar ou dar conselho. “Aconselharei” é claro, digno e adequado ao contexto sapiencial.
- source_word: עָלֶיךָ עֵינִי
  choice: mantendo os olhos sobre você
  rationale: A expressão é literalmente “meu olho sobre você”. A tradução conserva a metáfora de atenção vigilante em português corrente; o plural idiomático evita uma formulação artificial.
theological_decisions:
- issue: Identidade de quem fala em Salmos 32:8
  choice: Manter a fala na primeira pessoa sem identificar explicitamente o locutor.
  alternative: Entender explicitamente que o SENHOR fala, ou que o salmista fala ao ouvinte.
  rationale: O próprio versículo não nomeia quem fala. A tradução preserva essa abertura interpretativa, e a nota informa a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular hebraico e conserva a imagem dos olhos atentos sem identificar o locutor.
