base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: pt
  text: 'Eu te fiz saber do meu pecado e não encobri a minha iniquidade. Eu disse: “Confessarei a Yahweh as minhas transgressões”, e tu perdoaste[a] a iniquidade do meu pecado. Selá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantaste” ou “carregaste” a iniquidade do meu pecado. O verbo retrata a remoção ou o carregamento de um peso e, neste contexto, significa “perdoaste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: o meu pecado
  rationale: Traduz diretamente חטאת e mantém sua distinção em relação aos outros dois termos de transgressão presentes no versículo.
- source_word: אוֹדִיעֲךָ
  choice: eu te dei a conhecer
  rationale: Preserva o valor causativo do hifil de ידע, isto é, fazer algo conhecido, sem reduzir a expressão a uma interpretação como “reconheci”.
- source_word: עֲוֺנִי
  choice: minha iniquidade
  rationale: Mantém a distinção lexical entre עון, חטאת e פשע e conserva o peso moral do termo, que também pode envolver culpa.
- source_word: כִסִּיתִי
  choice: não encobri
  rationale: Conserva a metáfora de cobrir ou ocultar o pecado e soa natural em português.
- source_word: אוֹדֶה
  choice: confessarei
  rationale: Neste contexto penitencial, com as transgressões como assunto da declaração, o hifil de ידה significa confessar, não agradecer.
- source_word: עֲלֵי פְשָׁעַי
  choice: as minhas transgressões
  rationale: A preposição על introduz o assunto confessado; em português corrente, a construção é expressa naturalmente como objeto direto de “confessarei”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando no texto o nome pessoal da aliança.
- source_word: נָשָׂאתָ
  choice: perdoaste
  rationale: Com iniquidade como objeto, נשא comunica idiomaticamente o perdão. A imagem literal de levantar ou carregar é preservada em nota.
- source_word: עֲוֺן חַטָּאתִי
  choice: a iniquidade do meu pecado
  rationale: Mantém a relação construta e a expressão hebraica em camadas, sem a achatar simplesmente para “minha culpa”.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo é incerta, ele é transliterado em vez de receber uma interpretação como “pausa” ou “interlúdio”.
theological_decisions:
- issue: Forma de traduzir o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Preservar no texto principal a metáfora de נָשָׂאתָ עֲוֺן ou expressar seu sentido idiomático
  choice: perdoaste
  alternative: levantaste; carregaste a iniquidade do meu pecado
  rationale: O contexto comunica claramente o perdão divino. A tradução idiomática torna o sentido imediato ao leitor, enquanto a nota preserva a imagem hebraica e sua possível nuance de remoção ou carregamento de um peso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tríade “pecado — iniquidade — transgressões” foi mantida para refletir as distinções lexicais do hebraico. A expressão final, deliberadamente mais solene, conserva a formulação em camadas do original. O marcador da nota foi colocado junto de “perdoaste”, termo ao qual a explicação lexical se refere.
