base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: pt
  text: Pois, dia e noite, a tua mão pesava sobre mim; meu vigor[a] se ressecou como sob o calor do verão[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto a “meu vigor”: “minha seiva” ou “minha vitalidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nas secas do verão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do sofrimento mencionado no contexto anterior, sem tornar a relação causal mais rígida do que o hebraico.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Mantém o merismo hebraico que expressa duração contínua, em formulação natural em português.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: a tua mão pesava
  rationale: Preserva a metáfora concreta do peso da mão divina e o valor durativo da forma verbal.
- source_word: עָלַי
  choice: sobre mim
  rationale: Expressa naturalmente a pressão exercida sobre o salmista sem acrescentar a ideia mais específica de hostilidade.
- source_word: נֶהְפַּךְ
  choice: se ressecou
  rationale: Comunica, no contexto da vitalidade e do verão, o resultado da transformação indicada pelo verbo, embora a alternativa mais literal seja registrada em nota.
- source_word: לְשַׁדִּי
  choice: meu vigor
  rationale: O termo raro pode designar seiva, umidade ou vitalidade corporal; 'vigor' transmite de modo claro a força vital figurada.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: como sob o calor do verão
  rationale: Reproduz de maneira idiomática a imagem de calor ressecante, mantendo em nota a possibilidade mais literal de 'secas do verão'.
- source_word: סֶלָה
  choice: Selá
  rationale: Conserva transliterado o marcador litúrgico ou musical cujo sentido exato permanece incerto.
theological_decisions:
- issue: Ação divina no sofrimento
  choice: A mão de Deus pesa sobre o salmista
  alternative: Sofrimento geral sem ação divina explícita; ou formulação doutrinária mais forte de punição direta
  rationale: O hebraico atribui explicitamente a pressão à mão de Deus, mas não define neste versículo o mecanismo nem uma doutrina completa de punição. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora da mão pesada foi preservada; a expressão rara sobre a vitalidade foi vertida de modo idiomático, com as alternativas lexicais relevantes em notas.
