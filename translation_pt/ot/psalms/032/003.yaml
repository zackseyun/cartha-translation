  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: pt
  text: Pois, enquanto permaneci calado, meus ossos se consumiram em meio ao meu gemido[a] durante todo o dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rugido”. O termo hebraico pode indicar um clamor alto semelhante a um rugido, mas aqui provavelmente descreve um gemido angustiado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois, enquanto
  rationale: כִּי introduz a explicação ligada ao contexto anterior; com o perfeito seguinte, “Pois, enquanto” expressa de modo natural a circunstância durativa sem reduzir a partícula apenas a uma causa abstrata.
- source_word: הֶחֱרַשְׁתִּי
  choice: fiquei calado
  rationale: A forma de חרשׁ indica que o salmista permaneceu em silêncio. “Fiquei calado” é corrente e preserva o objeto implícito, sem acrescentar “sobre o meu pecado” ao texto.
- source_word: בָּלוּ
  choice: se consumiram
  rationale: בלה descreve desgaste ou deterioração. “Se consumiram” comunica a debilitação intensa e mantém a imagem poética aplicada aos ossos.
- source_word: עֲצָמַי
  choice: meus ossos
  rationale: A tradução literal preserva a imagem corporal hebraica, que exprime a aflição da pessoa inteira.
- source_word: בְּשַׁאֲגָתִי
  choice: com o meu gemido
  rationale: שׁאגה pode designar um rugido ou clamor alto; neste contexto de angústia, “gemido” é natural em português, enquanto “com” representa a circunstância expressa por בְּ.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Equivalente idiomático moderno que conserva a ideia de duração contínua.
theological_decisions:
- issue: Se deve explicitar que o silêncio dizia respeito ao pecado não confessado
  choice: Manter o objeto do silêncio implícito
  alternative: “enquanto fiquei calado sobre o meu pecado”
  rationale: O contexto sugere fortemente o pecado não confessado, mas este versículo não explicita o objeto. Mantê-lo implícito evita inserir interpretação explicativa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo poético e a imagem concreta dos ossos, sem explicitar além do hebraico a causa do silêncio.
