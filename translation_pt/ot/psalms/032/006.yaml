  source_fidelity: 'O texto preserva adequadamente a ligação inferencial de עַל־זֹאת (“Por isso”), o valor exortativo de יִתְפַּלֵּל (“ore”), o singular representativo de כָּל חָסִיד (“todo fiel”) e a direção explícita da oração (“a ti”). “Enquanto podes ser encontrado” é uma interpretação idiomática e contextual plausível de לְעֵת מְצֹא, sem eliminar a concisão da construção hebraica, que é devidamente registrada na nota. A oração final conserva a imagem das muitas águas e a referência singular ao fiel: as águas “não o alcançarão”.'
  naturalness: O português é atual, claro e poeticamente sóbrio, com boa legibilidade brasileira e aceitável em uso internacional. “Todo fiel ore a ti” tem registro bíblico-literário natural, e “enquanto podes ser encontrado” mantém tratamento direto coerente com “a ti”.
  terminology: “Fiel” é uma escolha apropriada para חָסִיד, pois comunica devoção/fidelidade sem introduzir o sentido eclesiástico mais delimitado de “santo”. “Inundação de muitas águas” é formalmente próximo de לְשֵׁטֶף מַיִם רַבִּים e preserva a metáfora. As notas empregam terminologia compatível com as alternativas lexicais e não impõem uma leitura doutrinária da imagem.
