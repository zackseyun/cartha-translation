id: PSA.32.6
reference: Psalms 32:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: pt
  text: Por isso, todo fiel ore a ti enquanto podes ser encontrado[a]; certamente, na inundação de muitas águas[b], elas não o alcançarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no tempo de encontrar”; também pode ser entendido como “no tempo oportuno”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na inundação de muitas águas”. A expressão retrata uma ameaça avassaladora.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Por isso
  rationale: Expressa de modo natural a ligação causal ou inferencial com a confissão e o perdão mencionados antes.
- source_word: יִתְפַּלֵּל
  choice: ore
  rationale: O imperfeito assume no contexto força exortativa, adequadamente expressa pelo presente do subjuntivo em português.
- source_word: כָּל חָסִיד
  choice: todo fiel
  rationale: חָסִיד designa alguém caracterizado por fidelidade e devoção; “fiel” é corrente, digno e evita o sentido eclesiástico mais restrito que “santo” poderia sugerir.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: Conserva a direção da oração e o tratamento direto, sem acrescentar um nome divino ausente do hebraico.
- source_word: לְעֵת מְצֹא
  choice: enquanto podes ser encontrado
  rationale: Entende a construção elíptica como referência ao período em que Deus pode ser encontrado, em formulação portuguesa natural; a forma mais literal é registrada em nota.
- source_word: רַק
  choice: certamente
  rationale: Neste contexto, a partícula reforça a certeza da afirmação, em vez de funcionar no sentido restritivo de “somente”.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: na inundação de muitas águas
  rationale: Mantém a imagem poética de águas numerosas e impetuosas sem explicá-la como uma calamidade específica.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: elas não o alcançarão
  rationale: O plural remete às águas, e o pronome singular retoma o fiel; “alcançar” comunica o contato indicado pelo verbo sem ampliar seu sentido.
theological_decisions:
- issue: Referente da promessa de proteção
  choice: O pronome “o” retoma “todo fiel”, mantendo as águas como imagem poética de ameaça avassaladora.
  alternative: Entender as águas como uma inundação estritamente literal ou tomar Deus como referente do pronome.
  rationale: A concordância e a progressão sintática favorecem o fiel como referente de אֵלָיו. A tradução conserva a metáfora sem definir se ela aponta para aflição, caos ou juízo em particular.
- issue: Sentido de לְעֵת מְצֹא
  choice: “enquanto podes ser encontrado”, com Deus como aquele que pode ser encontrado.
  alternative: “no tempo de encontrar” ou “no tempo oportuno”.
  rationale: A leitura escolhida se ajusta à oração dirigida a Deus, mas a construção hebraica é concisa e não explicita o objeto de “encontrar”; por isso, a forma literal é preservada em nota.
translation_notes:
  register: Português atual, poético e amplamente compreensível, com legibilidade brasileira. O tratamento “ti” preserva a fala direta a Deus. A estrutura mantém o singular representativo do hebraico e não resolve a metáfora das águas em uma calamidade específica.
