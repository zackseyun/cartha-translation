  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: pt
  text: Não sejam como o cavalo ou como a mula[a], sem entendimento, cujos arreios são o freio e a rédea para contê-lo; do contrário, ele não se aproximará de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que ele não se aproxime de você”. A cláusula final é difícil em hebraico e pode indicar tanto que o animal se recusa a se aproximar se não for contido quanto que precisa ser contido para não avançar sobre a pessoa.'
    reason: Leitura alternativa de uma construção hebraica sintaticamente ambígua.
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Não sejam
  rationale: אַל com o imperfeito de היה expressa uma proibição. A forma plural do hebraico é preservada com naturalidade.
- source_word: כְּסוּס כְּפֶרֶד
  choice: como o cavalo ou como a mula
  rationale: Preserva as duas comparações no singular e emprega os nomes comuns e atuais dos animais.
- source_word: אֵין הָבִין
  choice: sem entendimento
  rationale: Expressa de modo conciso a falta de compreensão ou discernimento atribuída aos animais.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: o freio e a rédea
  rationale: Identifica os instrumentos usados para controlar o animal. Embora a extensão semântica dos dois termos possa se sobrepor, esta combinação é clara em português.
- source_word: עֶדְיוֹ
  choice: cujos arreios são
  rationale: O substantivo costuma indicar adorno ou aquilo que se coloca sobre alguém ou algo; neste contexto, refere-se ao equipamento posto no animal. “Arreios” comunica a imagem sem insistir no sentido literal de “adorno”.
- source_word: לִבְלֹם
  choice: para contê-lo
  rationale: O verbo significa refrear, conter ou manter sob controle; “conter” se ajusta naturalmente ao uso do freio e da rédea.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: do contrário, ele não se aproximará de você
  rationale: 'Adota uma leitura possível da difícil cláusula final: sem ser contido pelo equipamento, o animal não se aproxima do condutor. O singular segue a imagem animal singular do hebraico.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a passagem do imperativo plural (“não sejam”) para o destinatário singular (“você”), correspondente à mudança de número presente no hebraico. O marcador [a] aparece no texto junto à comparação, remetendo à ambiguidade que afeta a interpretação da imagem inteira.
