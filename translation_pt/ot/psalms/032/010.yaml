  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: pt
  text: Muitas são as dores do perverso[a], mas o amor leal cerca aquele que confia em Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitas dores são para o perverso”. O substantivo hebraico pode indicar dores, tristezas ou sofrimentos.'
    reason: lexical_alternative
  - marker: b
    text: Yahweh representa o nome divino יהוה (YHWH), tradicionalmente traduzido por “SENHOR”.
    reason: divine_name
lexical_decisions:
- source_word: רַבִּים
  choice: Muitas
  rationale: Preserva a quantificação e a posição enfática no início do verso, em português natural.
- source_word: מַכְאוֹבִים
  choice: dores
  rationale: O substantivo abrange dores, sofrimentos e tristezas; “dores” mantém o sentido concreto sem excluir dimensões emocionais ou circunstanciais.
- source_word: לָרָשָׁע
  choice: aguardam o perverso
  rationale: A preposição ל indica relação ou destinação. “Aguardam” expressa naturalmente em português que muitas dores estão reservadas ao perverso, sem especificar de modo indevido sua causa imediata.
- source_word: וְהַבּוֹטֵחַ
  choice: mas aquele que confia
  rationale: O particípio substantivado designa “aquele que confia”; a conjunção recebe valor adversativo pelo contraste entre as duas metades do verso.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: בטח com ב significa naturalmente “confiar em”; o nome divino é transliterado para preservar o nome da aliança presente no hebraico.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa a combinação de amor, fidelidade e compromisso duradouro própria de חֶסֶד, de modo claro e digno em português moderno.
- source_word: יְסוֹבְבֶנּוּ
  choice: cerca
  rationale: O verbo significa rodear ou circundar; “cerca” é conciso e natural. O sufixo masculino singular retoma aquele que confia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; bondade
  rationale: “Amor leal” conserva tanto o afeto quanto a fidelidade duradoura do termo, sem restringi-lo apenas à compaixão nem explicitar “aliança” onde essa palavra não aparece.
- issue: Singular representativo רָשָׁע
  choice: o perverso
  alternative: a pessoa perversa; os perversos
  rationale: Mantém o singular genérico do hebraico e o contraste formal com “aquele que confia”, sem entender a referência como limitada a um indivíduo específico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura antitética do hebraico foi preservada. “Perverso” evita a possível conotação exclusivamente jurídica de “culpado”, e “amor leal” comunica חֶסֶד sem linguagem arcaica.
