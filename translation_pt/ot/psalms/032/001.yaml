id: PSA.32.1
reference: Psalms 32:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: pt
  text: De Davi. Um maskil[a]. Feliz aquele cuja transgressão foi perdoada[b], cujo pecado foi coberto!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico maskil, termo usado em títulos de salmos cujo sentido exato é incerto; talvez indique uma composição instrutiva ou contemplativa.
    reason: cultural_note
  - marker: b
    text: Literalmente, “foi levantada” ou “foi carregada”, no sentido de ter sido removida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, pertencimento, associação ou dedicação. “De Davi” é natural em português e preserva essa relativa abertura sem especificar além do hebraico.
- source_word: מַשְׂכִּיל
  choice: maskil
  rationale: O sentido técnico do termo no título é incerto. A transliteração evita fixar no texto principal uma interpretação como “salmo de instrução” ou “composição contemplativa”.
- source_word: אַשְׁרֵי
  choice: Feliz aquele
  rationale: A forma funciona como uma exclamação de bem-aventurança. “Feliz aquele” é clara, digna e natural, sem reduzir a expressão a um estado emocional passageiro.
- source_word: נְשׂוּי
  choice: foi perdoada
  rationale: O particípio de נשׂא significa literalmente algo como “levantada” ou “carregada”; associado à transgressão, expressa idiomaticamente seu perdão ou remoção. A imagem literal é registrada em nota.
- source_word: פֶּשַׁע
  choice: transgressão
  rationale: O termo pode designar violação deliberada ou rebelião. “Transgressão” conserva sua gravidade e estabelece um paralelo natural com “pecado”.
- source_word: כְּסוּי
  choice: foi coberto
  rationale: A tradução preserva diretamente a metáfora do particípio passivo de כסה e seu paralelismo com a transgressão perdoada.
- source_word: חֲטָאָה
  choice: pecado
  rationale: Neste contexto moral e em paralelo com “transgressão”, o referente é pecado, não oferta pelo pecado.
theological_decisions:
- issue: Forma da bem-aventurança e sujeito representativo singular
  choice: Feliz aquele...
  alternative: Felizes aqueles... / Bem-aventurado o homem...
  rationale: O hebraico apresenta um indivíduo representativo. “Aquele” mantém o singular genérico sem introduzir uma referência especificamente masculina; “feliz” comunica a condição favorecida proclamada pela fórmula sapiencial.
- issue: Tratamento do termo מַשְׂכִּיל no título
  choice: Manter “maskil” transliterado no texto principal
  alternative: Salmo de instrução / composição contemplativa
  rationale: Como a função exata do termo é discutida, a transliteração preserva a incerteza real do título e deixa as possibilidades explicativas para a nota.
- issue: Relação entre perdão e a metáfora de cobrir
  choice: Preservar “perdoada” na primeira linha e “coberto” na segunda
  alternative: Removida... ocultado
  rationale: A escolha comunica o sentido idiomático de נשׂא sem apagar a metáfora distinta de כסה, preservando o paralelismo e a tensão poética do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O título permanece conciso; “maskil” é transliterado e explicado. A linguagem mantém dignidade poética sem arcaísmos, e o ponto de exclamação explicita o caráter exclamativo de אַשְׁרֵי.
