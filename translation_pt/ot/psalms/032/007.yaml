  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: pt
  text: Tu és o meu esconderijo; tu me guardas da aflição; tu me cercas de gritos de livramento.[a] Selá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cânticos de livramento” ou “gritos jubilosos de resgate”.
    reason: lexical_alternative
  - marker: b
    text: “Selá” provavelmente é uma indicação musical ou litúrgica; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: esconderijo
  rationale: O substantivo indica um lugar onde alguém se esconde e encontra proteção. “Esconderijo” conserva a metáfora concreta e é natural em português.
- source_word: מִצַּר
  choice: da aflição
  rationale: צַר pode indicar aflição, angústia ou situação apertada. “Da aflição” expressa o perigo sem especificar indevidamente um adversário pessoal.
- source_word: תִּצְּרֵנִי
  choice: tu me guardas
  rationale: O verbo נצר significa guardar, conservar ou proteger. “Tu me guardas” é claro, direto e combina com a imagem de Deus como esconderijo.
- source_word: רָנֵּי
  choice: gritos
  rationale: O plural construto de רִנָּה designa clamores sonoros, muitas vezes jubilosos. “Gritos” preserva sua força audível sem decidir que sejam necessariamente cânticos.
- source_word: פַלֵּט
  choice: livramento
  rationale: A forma ligada a פלט comunica escape ou resgate. “Livramento” forma uma expressão natural e mantém o sentido de ser retirado do perigo.
- source_word: תְּסוֹבְבֵנִי
  choice: tu me cercas
  rationale: O verbo סבב significa cercar ou rodear. A construção direta “tu me cercas” conserva a imagem poética e tem boa legibilidade brasileira.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, ele é transliterado em vez de receber uma interpretação não comprovada, como “pausa” ou “interlúdio”.
theological_decisions:
- issue: Natureza dos “gritos de livramento” que cercam o salmista
  choice: A expressão é mantida como “gritos de livramento”, sem identificar quem os profere.
  alternative: Cânticos de livramento; gritos jubilosos de resgate; cânticos sobre o livramento.
  rationale: A construção hebraica רָנֵּי פַלֵּט é compacta e permite mais de uma nuance. A tradução conserva sua ambiguidade poética e não determina se os gritos procedem de Deus, dos adoradores ou do próprio salmista.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O uso de “tu” preserva o tratamento direto e poético dirigido a Deus; a ordem pronominal “tu me guardas / tu me cercas” evita construções excessivamente formais.
