id: PSA.140.8
reference: Psalms 140:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: pt
  text: 'Ó Yahweh, não concedas os desejos do perverso;

    não faças prosperar o seu plano[a], para que eles não se exaltem[b]. Selá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não deixes que o plano dele se realize”. O verbo hebraico desta oração é difícil e também pode ter o sentido de promover ou levar adiante o plano.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que ele não se exalte”. O texto hebraico traz um verbo no plural (“eles se exaltem”), embora o contexto anterior esteja no singular.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מַאֲוַיֵּי
  choice: os desejos
  rationale: Expressa de modo natural o sentido de anseios ou desejos, sem intensificar indevidamente o termo.
- source_word: רָשָׁע
  choice: do perverso
  rationale: Mantém o singular morfológico e comunica tanto a maldade moral quanto o uso representativo do termo.
- source_word: זְמָמוֹ
  choice: o seu plano
  rationale: Designa um propósito ou projeto; o contexto deixa claro seu caráter nocivo, sem ser necessário explicitá-lo como 'trama'.
- source_word: תָּפֵק
  choice: faças prosperar
  rationale: O verbo é difícil neste contexto; a escolha comunica a ideia provável de promover, levar adiante ou permitir a realização do plano.
- source_word: יָרֻמוּ
  choice: eles não se exaltem
  rationale: Preserva o verbo plural do texto massorético e sua possível ideia de elevação em poder, sucesso ou orgulho.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, pois a função exata do termo é incerta.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva o nome pessoal revelado no texto hebraico, em vez de substituí-lo por um título.
- issue: Mudança do singular ('perverso', 'seu plano') para o plural יָרֻמוּ
  choice: 'Preservar o plural: ''eles não se exaltem'''
  alternative: 'Regularizar para o singular: ''ele não se exalte'''
  rationale: O hebraico passa deliberadamente de referentes singulares para um verbo plural. A tradução mantém essa tensão, que pode ampliar a referência do perverso individual para seus aliados ou para os perversos em geral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. A construção poética conserva o paralelismo e a mudança de número do hebraico; 'Selá' permanece sem tradução por causa de seu sentido incerto.
