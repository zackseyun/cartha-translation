reference: Psalms 140:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: pt
  text: Guarda-me[a], ó Yahweh, das mãos dos perversos; protege-me dos homens violentos[b], que planejaram fazer meus pés tropeçar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das mãos do perverso”. O singular hebraico pode referir-se a um indivíduo ou ter sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “do homem de violências”. O hebraico traz essa expressão no singular, mas em seguida usa o verbo plural “planejaram”, tratando os inimigos coletivamente.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Guarda-me
  rationale: O imperativo de שׁמר pede proteção contínua. “Guarda-me” é direto, digno e mantém o paralelismo com o verbo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מִידֵי רָשָׁע
  choice: das mãos dos perversos
  rationale: Mantém a imagem hebraica das “mãos” como poder hostil. O singular רָשָׁע pode ter sentido coletivo; o plural em português torna esse valor natural, com a alternativa singular indicada em nota.
- source_word: מֵאִישׁ חֲמָסִים
  choice: dos homens violentos
  rationale: Embora אִישׁ esteja no singular, a expressão é genérica e vem seguida pelo verbo plural חָשְׁבוּ. O plural em português preserva essa referência coletiva e evita discordância artificial; a forma mais literal é registrada em nota.
- source_word: תִּנְצְרֵנִי
  choice: protege-me
  rationale: נצר expressa guardar ou preservar. “Protege-me” distingue naturalmente este pedido do anterior sem enfraquecer o paralelismo.
- source_word: חָשְׁבוּ
  choice: planejaram
  rationale: O perfeito plural de חשׁב, neste contexto hostil, denota conceber ou planejar uma ação.
- source_word: לִדְחוֹת פְּעָמָי
  choice: fazer meus pés tropeçar
  rationale: דחה transmite a ideia de impelir, derrubar ou desviar; com פְּעָמָי, a expressão retrata inimigos tentando provocar a queda do salmista. A formulação portuguesa conserva a imagem corporal de modo claro.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Número gramatical e sentido coletivo dos adversários
  choice: 'Plural coletivo: “os perversos” e “os homens violentos”'
  alternative: 'Singular formal: “o perverso” e “o homem de violências”'
  rationale: O hebraico emprega substantivos singulares, mas retoma os adversários com o verbo plural חָשְׁבוּ. O plural no texto principal comunica naturalmente o valor coletivo sem ocultar a forma hebraica, explicitada nas notas.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. O paralelismo poético é mantido por “Guarda-me” e “protege-me”; a tensão entre os singulares hebraicos e o verbo plural é preservada por meio das notas, sem impor uma identificação estritamente individual dos inimigos.
