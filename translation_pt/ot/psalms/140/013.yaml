source:
  edition: WLC
  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: pt
  text: Certamente os justos darão graças ao teu nome; os íntegros habitarão diante da tua face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na tua presença”. Hebraico: “diante da tua face”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: A partícula introduz uma conclusão enfática e confiante, não uma restrição exclusiva.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural substantivado designa aqueles caracterizados pela justiça; esta formulação é natural e tradicional em português.
- source_word: יוֹדוּ
  choice: darão graças
  rationale: O hifil de ידה, neste contexto salmódico e com referência ao nome de Deus, expressa agradecimento ou louvor.
- source_word: לִשְׁמֶךָ
  choice: ao teu nome
  rationale: Preserva a preposição hebraica e apresenta o nome de Deus como destinatário da ação de graças.
- source_word: יֵשְׁבוּ
  choice: habitarão
  rationale: Embora o verbo também possa significar “sentar-se” ou “permanecer”, aqui comunica permanência estável junto de Deus.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O adjetivo plural substantivado tem sentido ético; “íntegros” é corrente em português e evita confusão com retidão meramente física.
- source_word: אֶת פָּנֶיךָ
  choice: diante da tua face
  rationale: Mantém a imagem concreta do hebraico, que representa proximidade e acesso à presença divina.
theological_decisions:
- issue: Linguagem antropomórfica para a presença divina
  choice: diante da tua face
  alternative: na tua presença; diante de ti
  rationale: A tradução principal conserva a referência literal à “face” de Deus e sua força poética, sem explicar ou eliminar a imagem; a nota oferece a equivalência idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“teu”, “tua”). O paralelismo poético entre “os justos” e “os íntegros” foi preservado.
