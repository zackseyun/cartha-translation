  footnotes:
  - marker: a
    text: Ou “todos os dias se reúnem para a batalha” ou “todos os dias incitam conflitos”. O verbo hebraico traduzido como “provocam” é difícil neste contexto, e várias traduções são possíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Partícula relativa que dá continuidade à descrição de pessoas mencionadas no contexto; “que” é a forma natural em português.
- source_word: חָשְׁבוּ
  choice: planejam
  rationale: O verbo indica conceber ou tramar deliberadamente, e não apenas pensar; “planejam” comunica intenção maliciosa em linguagem corrente.
- source_word: רָעוֹת
  choice: males
  rationale: O plural designa coisas, atos ou planos nocivos; “males” preserva de modo conciso o plural e a carga moral.
- source_word: בְּלֵב
  choice: no coração
  rationale: Mantém a imagem antropológica hebraica, na qual o coração é o centro do pensamento e da intenção. O singular também é preservado.
- source_word: כָּל יוֹם
  choice: o dia todo
  rationale: Expressão temporal idiomática que enfatiza atividade contínua ao longo do dia.
- source_word: יָגוּרוּ
  choice: provocam
  rationale: O verbo é difícil neste contexto. “Provocam” expressa adequadamente a ideia contextual de fomentar ou suscitar hostilidades sem ocultar, na nota, outras análises possíveis.
- source_word: מִלְחָמוֹת
  choice: guerras
  rationale: Preserva o sentido forte e a forma plural do substantivo hebraico.
