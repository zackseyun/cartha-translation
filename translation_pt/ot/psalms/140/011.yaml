base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: pt
  text: O homem de língua[a] não se firmará na terra; o mal caçará o homem violento[b], levando-o a quedas sucessivas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o caluniador”. A expressão hebraica significa literalmente “homem de língua”.'
    reason: lexical_alternative
  - marker: b
    text: 'Outra análise sintática possível: “o homem mau e violento — que ele seja caçado”. O hebraico é difícil.'
    reason: syntactic_ambiguity
  - marker: c
    text: Hebraico difícil. Literalmente, algo como “para empurrões”; também pode ser entendido como “com golpes repetidos” ou “até a ruína”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: homem de língua
  rationale: Preserva a imagem hebraica compacta e incomum, que provavelmente designa alguém de fala maldosa ou caluniosa; a nota oferece o sentido idiomático.
- source_word: בַּל יִכּוֹן
  choice: não se firmará
  rationale: 'Expressa a negação poética e o sentido nifal de כון: ficar estabelecido, firme ou seguro.'
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode indicar terra, país ou território. “Na terra” mantém a amplitude do hebraico sem impor uma leitura exclusivamente cósmica ou nacional.
- source_word: אִישׁ חָמָס
  choice: homem violento
  rationale: Transmite naturalmente a expressão literal “homem de violência”, mantendo a caracterização pessoal.
- source_word: רָע
  choice: o mal
  rationale: Lê רָע como sujeito substantivado do verbo seguinte, personificando o mal como caçador, em vez de o tomar necessariamente como adjetivo de “homem violento”.
- source_word: יְצוּדֶנּוּ
  choice: perseguirá
  rationale: O verbo צוד pertence ao campo semântico de caçar, capturar ou armar uma cilada. “Perseguirá” soa natural em português e conserva a imagem da caça sem afirmar que a captura já ocorreu.
- source_word: לְמַדְחֵפֹת
  choice: empurrando-o para a queda
  rationale: A palavra rara, no plural, deriva de uma raiz ligada a empurrar ou impelir. A formulação conserva tanto o movimento forçado quanto seu provável resultado, enquanto a nota registra a dificuldade textual.
theological_decisions:
- issue: Identidade do sujeito em רָע יְצוּדֶנּוּ
  choice: “o mal” é o sujeito que persegue o homem violento
  alternative: 'רָע qualifica “homem violento”, seguido de uma oração optativa: “quanto ao homem mau e violento, que ele seja perseguido”'
  rationale: A leitura escolhida explica diretamente o verbo singular e produz a vigorosa personificação do mal presente na estrutura poética, sem ocultar a alternativa sintática possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem incomum “homem de língua” foi mantida por sua força poética; as ambiguidades sintáticas e o raro termo final foram preservados em notas, enquanto o texto principal oferece uma leitura natural e coerente.
