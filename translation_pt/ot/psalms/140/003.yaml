  text: שָֽׁנֲנ֣וּ לְשׁוֹנָ/ם֮ כְּֽמוֹ נָ֫חָ֥שׁ חֲמַ֥ת עַכְשׁ֑וּב תַּ֖חַת שְׂפָתֵ֣י/מוֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/003.yaml
  text: They sharpen their tongue like a snake[a]; the venom of a viper is under their lips[b]. Selah
translation:
  language: pt
  text: Afiaram a língua como uma serpente[a]; o veneno de uma víbora está debaixo de seus lábios. Selá[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobra”. O hebraico designa uma serpente, mas a espécie exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: “Selá” provavelmente é uma indicação litúrgica ou musical; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: שָֽׁנֲנ֣וּ
  choice: Afiaram
  rationale: O piel de שׁנן significa “afiar”. O pretérito preserva a forma verbal hebraica e mantém a imagem de tornar a fala cortante e perigosa.
- source_word: לְשׁוֹנָם
  choice: a língua
  rationale: Mantém o singular coletivo do hebraico; em português, o possessivo pode ficar implícito porque o sujeito plural já identifica os agentes.
- source_word: כְּמוֹ נָחָשׁ
  choice: como uma serpente
  rationale: נָחָשׁ designa uma cobra ou serpente. “Serpente” é natural no registro poético e não exige identificar uma espécie.
- source_word: חֲמַת
  choice: veneno
  rationale: Embora חֵמָה também possa significar ira, no contexto de uma cobra venenosa indica veneno.
- source_word: עַכְשׁוּב
  choice: víbora
  rationale: O termo indica uma serpente venenosa, mas a espécie exata é incerta. “Víbora” comunica claramente a imagem sem pretender precisão zoológica absoluta.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: está debaixo dos seus lábios
  rationale: Preserva a localização metafórica do veneno oculto sob os lábios; “está” supre naturalmente a cópula ausente na oração nominal hebraica.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido preciso do termo é incerto, provavelmente uma indicação litúrgica ou musical, ele é transliterado em vez de interpretado.
