  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: pt
  text: Quanto à cabeça dos que me cercam[a], que o mal de seus lábios os cubra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que as cabeças dos que me cercam sejam cobertas pelo mal de seus lábios”. O hebraico é compacto, e “cabeça” pode ser entendido coletivamente; alguns interpretam a construção como se tivesse sentido plural.'
    reason: alternative_reading
  - marker: b
    text: “Mal” também pode ser traduzido como “maldade”, “dano” ou “desgraça”, referindo-se ao efeito nocivo daquilo que eles dizem.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: cabeça
  rationale: Mantém o sentido concreto do hebraico e a imagem ligada ao verbo “cobrir”; o singular pode ter valor coletivo nesta construção compacta.
- source_word: מְסִבָּי
  choice: os que me cercam
  rationale: Expressa de modo natural a ideia de pessoas que rodeiam hostilmente o salmista, sem acrescentar a especificidade de um cerco militar.
- source_word: עֲמַל
  choice: mal causado
  rationale: Neste contexto, o termo indica o dano ou a perversidade produzidos pela fala. “Mal causado” conserva a noção de efeito nocivo, embora “maldade” ou “desgraça” também sejam possíveis.
- source_word: שְׂפָתֵימוֹ
  choice: seus lábios
  rationale: Preserva a imagem corporal concreta do hebraico em vez de substituí-la diretamente por “fala” ou “palavras”.
- source_word: יכסומו
  choice: que ... os cubra
  rationale: Traduz o verbo כסה como “cobrir” e, no contexto da oração imprecatória, entende a forma verbal como desejo ou pedido, não como simples previsão.
theological_decisions:
- issue: Estrutura elíptica e força imprecatória da oração
  choice: 'Manter “cabeça” no singular como tópico da oração e traduzir o verbo como desejo: “que ... os cubra”.'
  alternative: “Que as cabeças dos que me cercam sejam cobertas pelo mal dos seus lábios” ou, em sentido indicativo, “o mal dos seus lábios os cobrirá”.
  rationale: O hebraico é compacto e admite mais de uma análise. O contexto favorece uma imprecação, enquanto a manutenção do singular respeita o texto consonantal e preserva sua tensão gramatical.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A formulação conserva a imagem concreta de “cabeça”, “lábios” e “cobrir”, além da ambiguidade da sintaxe hebraica, esclarecida nas notas.
