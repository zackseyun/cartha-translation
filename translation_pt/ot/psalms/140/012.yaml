  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: pt
  text: Sei[a] que Yahweh defenderá a causa do aflito[b] e fará justiça aos necessitados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto ao perfeito hebraico, “tenho sabido”. A vocalização tradicional lê a primeira pessoa: “sei”. As consoantes também podem ser entendidas como “tu sabes”. Neste contexto, a confissão do salmista, “sei”, é a leitura mais natural.'
    reason: textual_variant
  - marker: b
    text: Literalmente, “fará a causa ou o processo do aflito”; isto é, agirá para defender sua causa judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Sei
  rationale: No contexto, a frase funciona como a confissão final do salmista. O presente português expressa naturalmente o valor estativo, enquanto a dificuldade formal da leitura hebraica é preservada em nota.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que o salmista sabe.
- source_word: יַעֲשֶׂה ... דִּין
  choice: defenderá a causa
  rationale: 'Embora עשה signifique literalmente “fazer”, com דין forma uma expressão forense: agir em favor da causa ou do processo de alguém.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עָנִי
  choice: o aflito
  rationale: Neste salmo sobre opressão e violência, designa especialmente quem sofre aflição ou opressão, não apenas pobreza econômica.
- source_word: מִשְׁפַּט
  choice: justiça
  rationale: Aqui indica uma decisão justa ou a justiça assegurada em favor dos vulneráveis.
- source_word: אֶבְיֹנִים
  choice: os necessitados
  rationale: Expressa pessoas carentes e vulneráveis, preservando a distinção em relação a עָנִי no paralelismo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal de Deus sem o substituir por um título.
- issue: Pessoa gramatical de ידעת
  choice: Sei
  alternative: Tu sabes
  rationale: A leitura em primeira pessoa corresponde à confissão conclusiva esperada no contexto, mas a forma consonantal transmitida pode ser entendida como segunda pessoa; a nota mantém essa tensão textual explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Defenderá a causa” conserva a imagem jurídica sem reproduzir literalmente uma expressão pouco idiomática; o paralelismo é mantido por “fará justiça aos necessitados”.
