  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: pt
  text: Os orgulhosos esconderam uma armadilha para mim[a]; com cordas, estenderam uma rede ao lado do caminho[b]; armaram laços para mim. Selá[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os arrogantes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto ao caminho” ou “à margem da trilha”.
    reason: lexical_alternative
  - marker: c
    text: “Selá” provavelmente é uma indicação litúrgica ou musical; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: esconderam
  rationale: O verbo descreve ocultar algo, especialmente uma armadilha; “esconderam” preserva de modo natural a ideia de perigo dissimulado.
- source_word: גֵאִים
  choice: os orgulhosos
  rationale: Designa pessoas soberbas ou arrogantes. “Os orgulhosos” é claro, conciso e não acrescenta marca de gênero ausente da expressão.
- source_word: פַּח
  choice: uma armadilha
  rationale: O substantivo indica uma armadilha ou um laço para capturar presa. “Armadilha” mantém a imagem e permite alguma distinção em relação a מֹקְשִׁים no fim do verso.
- source_word: וַחֲבָלִים
  choice: com cordas
  rationale: Embora a forma traga literalmente a conjunção “e”, o contexto permite entender as cordas como o meio usado para estender a rede; essa formulação é natural em português.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: estenderam uma rede
  rationale: A combinação verbal significa abrir ou estender uma rede, imagem comum de caça e emboscada.
- source_word: לְיַד מַעְגָּל
  choice: ao lado do caminho
  rationale: לְיַד indica proximidade lateral, e מַעְגָּל designa caminho, trilha ou percurso. A tradução conserva a localização da emboscada sem restringir indevidamente o sentido.
- source_word: מֹקְשִׁים
  choice: laços
  rationale: Refere-se a dispositivos de captura ou tropeço. “Laços” preserva o campo semântico da caça e evita repetir “armadilha”.
- source_word: שָׁתוּ
  choice: armaram
  rationale: O verbo significa pôr ou colocar; em português, “armar laços” é a colocação idiomática adequada.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto e provavelmente se trata de uma indicação litúrgica ou musical, ele é transliterado.
