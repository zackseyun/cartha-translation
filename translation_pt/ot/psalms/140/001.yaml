  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: pt
  text: Livra-me[a], Yahweh, do homem mau; guarda-me do homem violento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Resgata-me”.'
    reason: Alternativa lexical para חַלְּצֵנִי, que pode significar resgatar ou livrar.
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Livra-me
  rationale: O imperativo hifil de חלץ com sufixo de primeira pessoa singular expressa tirar do perigo, resgatar ou livrar. “Livra-me” é natural, urgente e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵאָדָם רָע
  choice: do homem mau
  rationale: אָדָם, em paralelo com אִישׁ, indica aqui um indivíduo hostil; o singular masculino e o adjetivo רָע são preservados.
- source_word: מֵאִישׁ חֲמָסִים
  choice: do homem violento
  rationale: A expressão hebraica descreve um homem caracterizado pela violência. “Homem violento” comunica naturalmente em português o plural intensivo ou abstrato חֲמָסִים.
- source_word: תִּנְצְרֵנִי
  choice: guarda-me
  rationale: נצר significa guardar, proteger ou preservar. “Guarda-me” mantém a distinção em relação a “livra-me” e expressa proteção contínua.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Substantivos masculinos singulares אָדָם e אִישׁ
  choice: homem
  alternative: pessoa; ser humano
  rationale: O paralelismo descreve um malfeitor individual por meio de substantivos masculinos singulares. “Homem” preserva essa forma sem transformar o referente em uma abstração neutra.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem e o paralelismo poético do hebraico foram preservados sem sacrificar a naturalidade.
