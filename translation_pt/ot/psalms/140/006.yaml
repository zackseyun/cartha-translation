lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu digo
  rationale: Embora a forma hebraica seja morfologicamente perfeita, no discurso poético pode expressar uma declaração presente ou reiterada; o contexto e a tradição de tradução sustentam o presente natural em português.
- source_word: לַיהוָה / יְהוָה
  choice: ao SENHOR / Ó SENHOR
  rationale: Representa o tetragrama conforme a convenção editorial reverente e amplamente reconhecida nas Bíblias em português.
- source_word: הַאֲזִינָה
  choice: escuta
  rationale: Imperativo que pede atenção auditiva; “escuta” é direto, natural e preserva o apelo pessoal.
- source_word: קֹול תַּחֲנוּנָי
  choice: a voz das minhas súplicas
  rationale: Mantém a imagem hebraica da “voz” e traduz o plural de pedidos intensos por “súplicas”.
theological_decisions:
- issue: Declaração de pertencimento e relação com Deus
  choice: Tu és o meu Deus
  alternative: Tu és Deus para mim
  rationale: A tradução direta preserva a linguagem pactual e pessoal do hebraico sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O tratamento “Tu” conserva a solenidade poética e concorda diretamente com a segunda pessoa singular do hebraico.
