  text: For the choirmaster. A psalm of David[a].
translation:
  language: pt
  text: Ao regente. Salmo de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; o título hebraico pode indicar autoria, associação ou dedicatória.
    reason: 'Leitura alternativa: a relação expressa pela preposição hebraica pode ser entendida de mais de uma maneira.'
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente quem dirigia a execução musical. “Ao regente” é claro, atual e conserva a função indicada pelo hebraico; o prefixo לַ é expresso naturalmente por “Ao”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação usual desse gênero de composição poético-musical e o equivalente consagrado e exato neste contexto.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, associação, pertencimento ou dedicatória. “De Davi” mantém em português mais dessa amplitude do que opções específicas como “por Davi” ou “para Davi”.
theological_decisions:
- issue: Relação do título com Davi
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O título hebraico não exige que se determine aqui uma autoria estrita. A formulação preserva a ambiguidade histórica e literária sem impor uma conclusão mais específica do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação breve conserva o estilo próprio de um título de salmo; o marcador [a] foi colocado junto a “Davi”, termo explicado pela nota.
