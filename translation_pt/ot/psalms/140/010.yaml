  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: pt
  text: Caiam sobre eles brasas ardentes[a]; que ele os lance no fogo, em covas profundas[b], para que nunca mais se levantem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Chovam brasas sobre eles”. O verbo hebraico pode transmitir a ideia de fazer cair ou chover algo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em abismos” ou “nas profundezas das águas”. O termo hebraico é raro, e seu sentido exato é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: Caiam
  rationale: O hifil imperfeito de מוט tem aqui força jussiva ou imprecatória. A formulação preserva o desejo de que as brasas sejam feitas cair sem especificar o agente.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: Equivalente natural e direto da preposição על com sufixo pronominal.
- source_word: גֶּחָלִים
  choice: brasas ardentes
  rationale: O substantivo designa carvões ou brasas; “ardentes” explicita de modo natural a imagem ígnea do contexto.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: 'Com o verbo causativo seguinte, a expressão tem sentido direcional: serem lançados para dentro do fogo.'
- source_word: יַפִּלֵם
  choice: que ele os lance
  rationale: O hifil imperfeito masculino singular de נפל, com objeto plural, indica que um agente singular os faz cair. Mantém-se o sujeito implícito sem acrescentar explicitamente “Deus”.
- source_word: בְּמַהֲמֹרוֹת
  choice: em covas profundas
  rationale: מהמרות é raro e de sentido incerto. “Covas profundas” conserva uma imagem concreta de queda e destruição, sem excluir em nota outras possibilidades.
- source_word: בַּל
  choice: nunca mais
  rationale: A partícula negativa, ligada a יקומו, comunica aqui a finalidade ou o resultado definitivo da queda.
- source_word: יָקוּמוּ
  choice: se levantem
  rationale: קום significa levantar-se, erguer-se ou ficar de pé. Após a imagem de serem lançados abaixo, “se levantem” preserva o contraste, e “mais” expressa a ideia contextual de não voltarem a fazê-lo.
theological_decisions:
- issue: Linguagem imprecatória e sujeito implícito do verbo singular
  choice: Preservar a oração por juízo e traduzir o sujeito singular apenas como “ele”.
  alternative: Explicitar “Deus” como sujeito ou tornar a segunda oração inteiramente impessoal.
  rationale: O hebraico passa de uma forma verbal plural para uma singular, provavelmente com um agente divino implícito. “Que ele os lance” conserva essa mudança e evita inserir um nome que o verso não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e a linguagem de juízo foram mantidas; as ambiguidades lexicais genuínas aparecem nas notas.
