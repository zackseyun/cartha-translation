source:
  edition: WLC
  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: pt
  text: Ó Yahweh, meu Senhor, força da minha salvação, tu cobriste a minha cabeça no dia da batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no dia das armas” ou “no dia dos armamentos”. O hebraico provavelmente se refere ao tempo de conflito armado; por isso, “batalha” no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, distinguindo-o de אֲדֹנָי, que vem logo depois.
- source_word: אֲדֹנָי
  choice: meu Senhor
  rationale: A forma traz o sufixo de primeira pessoa singular; “meu Senhor” preserva tanto a relação pessoal quanto a distinção em relação a Yahweh.
- source_word: עֹז יְשׁוּעָתִי
  choice: força da minha salvação
  rationale: Mantém a relação construta do hebraico e o sentido de força ou poder que sustenta a salvação/libertação do salmista.
- source_word: סַכֹּתָה
  choice: tu cobriste
  rationale: Preserva a imagem concreta do verbo סכך, “cobrir, abrigar, proteger”, e traduz a forma perfeita como ação concluída.
- source_word: לְרֹאשִׁי
  choice: a minha cabeça
  rationale: Depois de “cobrir”, esta é a formulação portuguesa mais direta e natural para a imagem hebraica de proteção da cabeça.
- source_word: בְּיוֹם נָשֶׁק
  choice: no dia da batalha
  rationale: Embora נָשֶׁק possa designar armas ou armamento, a expressão completa se refere naturalmente ao tempo do conflito armado; a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega o nome divino pessoal e, imediatamente depois, o título אֲדֹנָי. “Yahweh, meu Senhor” conserva essa distinção lexical e teológica sem fundir os dois termos.
- issue: Sentido de יְשׁוּעָתִי no contexto militar
  choice: minha salvação
  alternative: minha libertação
  rationale: “Salvação” preserva a amplitude semântica e a linguagem tradicional dos Salmos, enquanto o contexto de batalha mantém presente a ideia concreta de livramento.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “tu” adequado à oração poética. A repetição “Yahweh, meu Senhor” é mantida por refletir dois termos hebraicos distintos. A nota foi colocada após “batalha”, termo ao qual se refere.
