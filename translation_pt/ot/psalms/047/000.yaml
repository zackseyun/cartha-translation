lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de canto
  rationale: Nos títulos dos salmos, o termo designa convencionalmente o responsável pela execução musical. “Mestre de canto” é uma expressão clara, digna e tradicional em português; “ao” representa naturalmente a preposição ל, embora “para o” também seja possível.
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: A preposição ל nos títulos pode indicar associação, pertença, dedicação ou autoria. “Dos filhos de” conserva melhor essa abertura do que uma formulação explicitamente autoral ou dedicatória.
- source_word: קֹרַח
  choice: Corá
  rationale: Emprega-se a forma portuguesa consagrada do nome bíblico.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: מִזְמוֹר é a designação convencional do gênero. Sem artigo, “Salmo” soa natural e conciso em um título português.
