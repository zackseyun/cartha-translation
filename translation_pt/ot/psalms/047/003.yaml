  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: pt
  text: 'Ele subjuga povos sob nós[a]

    e nações sob nossos pés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “põe povos em sujeição sob nós”. O verbo hebraico aqui tem o sentido de subjugar, não de falar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: submete
  rationale: Neste contexto, a forma causativa de דבר, tendo “povos” como objeto e em paralelo com “debaixo dos nossos pés”, significa pôr em sujeição, não falar. “Submete” é claro, conciso e preserva o tom régio-militar.
- source_word: עַמִּים
  choice: povos
  rationale: O plural de עם designa grupos humanos ou povos. “Povos” mantém uma distinção lexical natural em relação a לְאֻמִּים no segundo membro.
- source_word: תַּחְתֵּינוּ
  choice: debaixo de nós
  rationale: A preposição תחת com o sufixo de primeira pessoa do plural expressa aqui sujeição por meio de uma imagem espacial. A formulação preserva o paralelismo com “debaixo dos nossos pés”.
- source_word: וּלְאֻמִּים
  choice: e nações
  rationale: לְאֻמִּים pode designar povos ou nações. “Nações” diferencia o termo de עַמִּים sem eliminar o paralelismo poético.
- source_word: תַּחַת רַגְלֵינוּ
  choice: debaixo dos nossos pés
  rationale: A expressão mantém literalmente a imagem convencional de conquista ou sujeição e soa natural em português.
theological_decisions:
- issue: Voz coletiva e agência na linguagem de conquista
  choice: Deus é o sujeito implícito que age em favor do seu povo e submete outros povos debaixo de “nós”.
  alternative: Uma declaração régia generalizada sobre o êxito militar de Israel.
  rationale: O contexto imediato atribui a Deus a realeza e a vitória. A tradução conserva a primeira pessoa coletiva e a imagem de sujeição, sem atenuá-la nem lhe impor uma releitura teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e a imagem espacial de sujeição foram preservados; “submete” evita a possível associação indevida com o verbo “falar”.
