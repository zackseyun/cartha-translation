source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: pt
  text: Os nobres dos povos se reuniram como povo do Deus de Abraão[a], pois a Deus pertencem os escudos da terra[b]; ele é grandemente exaltado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se reuniram com o povo do Deus de Abraão”. A expressão hebraica pode indicar identificação ou estreita associação.'
    reason: alternative_reading
  - marker: b
    text: Isto é, provavelmente, “os governantes da terra”; literalmente, “os escudos da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: os nobres de
  rationale: O termo נָדִיב pode designar pessoas de alta posição, como nobres ou príncipes. “Nobres” é atual, natural e mantém a relação contextual com os “escudos” da terra.
- source_word: עַמִּים
  choice: os povos
  rationale: O plural indica diversos grupos humanos. “Povos” preserva esse sentido coletivo sem impor uma concepção estritamente política de nações.
- source_word: נֶאֱסָפוּ
  choice: se reuniram
  rationale: O nifal de אסף expressa aqui a ação de reunir-se. O pretérito perfeito é idiomático em português e adequado à declaração poética.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: como povo do Deus de Abraão
  rationale: A construção hebraica é compacta e admite identificação ou associação. “Como povo” comunica a provável identificação dos nobres reunidos com o povo pertencente ao Deus de Abraão, sem desenvolver além do texto a natureza dessa inclusão.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou fundamento da declaração anterior de modo claro e digno.
- source_word: לֵאלֹהִים
  choice: a Deus pertencem
  rationale: O לְ indica posse ou pertencimento. A formulação preserva a ordem enfática com Deus em destaque e soa natural em português.
- source_word: מָגִנֵּי אֶרֶץ
  choice: os escudos da terra
  rationale: A expressão significa literalmente “escudos da terra” e provavelmente funciona como metáfora de governantes ou protetores. A imagem original é mantida no texto, com a interpretação indicada em nota.
- source_word: מְאֹד נַעֲלָה
  choice: ele é grandemente exaltado
  rationale: A forma verbal masculina singular retoma naturalmente Deus. “Grandemente exaltado” preserva o tom elevado do salmo e o valor contextual do verbo.
theological_decisions:
- issue: Relação dos nobres dos povos com o povo do Deus de Abraão
  choice: Eles se reúnem como povo do Deus de Abraão.
  alternative: Eles se reúnem com o povo do Deus de Abraão.
  rationale: O hebraico permite tanto identificação quanto estreita associação. O contexto da realeza divina sobre os povos favorece a identificação inclusiva, mas a alternativa é registrada para não eliminar a ambiguidade.
- issue: Referente de “escudos da terra”
  choice: Manter a metáfora literal no texto.
  alternative: Traduzir interpretativamente como “governantes da terra”.
  rationale: A metáfora provavelmente aponta para governantes ou protetores humanos, mas sua força poética e sua possível amplitude justificam preservá-la no texto principal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe conserva o paralelismo poético e as metáforas do hebraico sem recorrer a linguagem arcaica.
