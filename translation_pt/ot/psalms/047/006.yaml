  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: pt
  text: Cantem louvores a Deus[a], cantem louvores; cantem louvores ao nosso Rei, cantem louvores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Toquem música para Deus... toquem música para o nosso Rei”. O verbo hebraico pode indicar louvor musical em sentido amplo, não apenas canto.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: cantem louvores
  rationale: O imperativo plural de זמר, neste contexto litúrgico, convida ao louvor vocal ou musical. “Cantem louvores” comunica naturalmente o sentido cultual e mantém as quatro repetições enfáticas do hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa o Deus de Israel, celebrado diretamente, por isso “Deus” é a tradução natural.
- source_word: לְמַלְכֵּנוּ
  choice: ao nosso Rei
  rationale: A preposição לְ indica o destinatário do louvor. “Ao nosso Rei” é idiomático em português, e a inicial maiúscula assinala que “Rei” funciona aqui como título divino.
theological_decisions:
- issue: Título da realeza divina
  choice: nosso Rei
  alternative: nosso rei
  rationale: O contexto imediato celebra o reinado universal de Deus; assim, “Rei” é tratado como título divino sem acrescentar uma interpretação alheia ao salmo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição quádrupla foi preservada para reproduzir a ênfase e o ritmo do hebraico.
