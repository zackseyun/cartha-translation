  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: pt
  text: Deus reina sobre as nações[a]; Deus está sentado em seu santo trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus tornou-se rei sobre as nações; Deus tomou assento em seu santo trono.” Os verbos hebraicos no perfeito podem enfatizar o estabelecimento de seu reinado.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: reina
  rationale: O qatal pode expressar, nesta proclamação poética, um estado presente ou resultante. “Reina” comunica de modo natural a soberania atual de Deus sem excluir a possível ênfase no estabelecimento de seu reinado.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa inequivocamente o Deus de Israel no singular. A repetição nos dois membros foi mantida por sua força retórica.
- source_word: עַל
  choice: sobre
  rationale: Com o verbo de reinar e “nações”, indica domínio e autoridade, sendo naturalmente traduzido por “sobre”.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Designa coletivamente os povos ou nações. “As nações” é corrente e evita conotações posteriores que “gentios” poderia introduzir.
- source_word: יָשַׁב
  choice: está sentado
  rationale: Preserva a imagem concreta de estar sentado no trono e, no contexto real, implica entronização. A locução é natural em português e mantém o paralelismo com “reina”.
- source_word: כִּסֵּא
  choice: trono
  rationale: No contexto da realeza divina, o termo significa especificamente “trono”, não apenas um assento genérico.
- source_word: קָדְשׁוֹ
  choice: seu santo
  rationale: A expressão hebraica, literalmente “trono de sua santidade”, funciona de modo adjetival. “Seu santo trono” é a formulação portuguesa natural e fiel.
theological_decisions:
- issue: A realeza divina expressa por verbos no perfeito hebraico
  choice: 'Proclamação presente: “Deus reina ... Deus está sentado em seu santo trono.”'
  alternative: 'Sentido ingressivo/perfectivo: “Deus tornou-se rei ... Deus tomou assento em seu santo trono.”'
  rationale: O salmo aclama poeticamente a soberania universal e atual de Deus. O presente comunica melhor essa realidade contínua em português, enquanto a nota preserva a possibilidade de os perfeitos enfatizarem o estabelecimento do reinado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Deus” e a imagem concreta do trono foram preservadas; evitou-se linguagem denominacional.
