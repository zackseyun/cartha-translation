source:
  edition: WLC
  text: עָלָ֣ה אֱ֭לֹהִים בִּ/תְרוּעָ֑ה יְ֝הֹוָ֗ה בְּ/ק֣וֹל שׁוֹפָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: pt
  text: Deus subiu em meio a aclamações[a]; Yahweh, ao som do shofar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao som de um grito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Shofar: instrumento de sopro feito de chifre, tradicionalmente de carneiro.'
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: subiu
  rationale: O verbo significa “subir”. O pretérito perfeito é natural em português e mantém a declaração poética sem impor uma referência cristológica posterior.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O referente é o Deus de Israel, em paralelismo com יהוה; por isso, exige o singular “Deus”.
- source_word: בִּתְרוּעָה
  choice: em meio a aclamações
  rationale: תְּרוּעָה designa um clamor forte, grito ou aclamação. O plural idiomático “aclamações” preserva a amplitude celebrativa sem restringir o termo a alegria ou batalha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּקוֹל
  choice: ao som do
  rationale: Com um instrumento, קוֹל é expresso naturalmente em português como “som”; a preposição pode indicar o acompanhamento da subida.
- source_word: שׁוֹפָר
  choice: shofar
  rationale: Mantém a identidade específica do instrumento de chifre, evitando que “trombeta” sugira indevidamente um instrumento metálico moderno; a nota explica o termo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Possível leitura cristológica da subida
  choice: Deus subiu
  alternative: Deus ascendeu
  rationale: “Subiu” traduz diretamente o hebraico e preserva a imagem de entronização do salmo sem impor uma associação posterior específica com a ascensão de Cristo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi preservado; “aclamações” evita a ambiguidade em português de “com um grito”, que poderia soar como se Deus fosse quem gritava.
