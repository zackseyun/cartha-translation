  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: pt
  text: Pois Yahweh, o Altíssimo, é temível[a], grande Rei sobre toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é digno de temor”, “inspira assombro” ou “é terrível”. O hebraico descreve Yahweh como aquele que inspira temor reverente e assombro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado ao louvor no contexto e conserva de modo natural o valor causal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Conserva o título divino e a força superlativa do termo hebraico em formulação consagrada e clara em português.
- source_word: נוֹרָא
  choice: é temível
  rationale: Expressa que Yahweh inspira temor reverente e assombro, sem reduzir o sentido a mero terror nem enfraquecê-lo com linguagem coloquial.
- source_word: מֶלֶךְ גָּדוֹל
  choice: grande Rei
  rationale: Preserva diretamente a imagem régia e a ênfase na grandeza e majestade do soberano divino.
- source_word: עַל כָּל הָאָרֶץ
  choice: sobre toda a terra
  rationale: No contexto da entronização universal, אֶרֶץ designa a terra inteira, e não apenas uma região ou território.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico apresenta diretamente o nome divino; a transliteração preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Nuance de נוֹרָא aplicado a Deus
  choice: é temível
  alternative: é digno de temor; é terrível; inspira assombro
  rationale: “Temível” mantém a tensão entre temor reverente, assombro e a majestade que causa medo, sem restringir o termo a pavor hostil. A nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe poética concisa. “Grande Rei” mantém a ordem enfática do hebraico; “temível” é corrente em registros bíblico e solene, e sua amplitude semântica é esclarecida em nota.
