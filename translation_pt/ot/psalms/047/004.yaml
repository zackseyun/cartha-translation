  yaml_path: translation/ot/psalms/047/004.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: pt
  text: Ele escolhe para nós nossa herança[a], a glória de Jacó, que ama.[b] Selá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele escolherá para nós nossa herança, a glória de Jacó, que ama.”'
    reason: O imperfeito hebraico pode ter valor futuro; “glória” também pode ser traduzido por “orgulho”, em sentido positivo.
  - marker: b
    text: 'A oração “que ama” também pode referir-se à herança ou à terra: “a glória de Jacó, que ama”.'
    reason: A sintaxe hebraica permite mais de um antecedente para a oração relativa; o sujeito é Deus, subentendido pelo contexto.
  - marker: c
    text: “Selá” é um termo litúrgico ou musical hebraico de significado incerto, tradicionalmente deixado sem tradução.
    reason: Nota cultural sobre termo técnico de sentido exato desconhecido.
lexical_decisions:
- source_word: יִבְחַר
  choice: escolhe
  rationale: O imperfeito qal de בחר pode expressar ação presente ou habitual, bem como futura. “Escolhe” combina com a celebração do reinado e da atuação contínua de Deus no salmo; a possibilidade futura é registrada em nota.
- source_word: לָנוּ
  choice: para nós
  rationale: A preposição לְ com sufixo da primeira pessoa do plural indica benefício ou referência. “Para nós” é a formulação mais natural e direta.
- source_word: נַחֲלָתֵנוּ
  choice: nossa herança
  rationale: נַחֲלָה designa herança, patrimônio ou posse recebida por porção, muitas vezes a terra da aliança. “Herança” preserva tanto o sentido de concessão quanto a ressonância pactual.
- source_word: אֶת ... אֶת
  choice: não traduzidos separadamente
  rationale: As duas ocorrências são marcadores de objeto direto; a segunda introduz uma expressão apositiva que especifica “nossa herança” como “a glória de Jacó”.
- source_word: גְּאוֹן
  choice: a glória
  rationale: גָּאוֹן pode significar orgulho, exaltação, majestade ou glória. Neste contexto positivo, “glória” comunica com naturalidade aquilo que é elevado e esplêndido, sem sugerir necessariamente arrogância; “orgulho” é preservado como alternativa em nota.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome pessoal e coletivo presente no hebraico, sem substituí-lo interpretativamente por “Israel”.
- source_word: אֲשֶׁר אָהֵב
  choice: que ele ama
  rationale: O relativo אֲשֶׁר não marca gênero, e o perfeito אָהֵב pode descrever um estado ou amor permanente. “Que ele ama” é natural em português e conserva a possível referência tanto a Jacó quanto à herança.
- source_word: סֶלָה
  choice: Selá
  rationale: O termo litúrgico ou musical hebraico tem sentido exato incerto; por isso, é transliterado em vez de receber uma tradução conjectural.
theological_decisions:
- issue: Referente de “que ele ama”
  choice: Jacó é o referente principal, sem eliminar a ambiguidade na redação
  alternative: A oração relativa pode modificar a herança ou terra, isto é, aquilo que constitui a glória de Jacó.
  rationale: Jacó é o referente pessoal mais próximo e a ideia do amor de Deus por Jacó/Israel é biblicamente coerente. Contudo, a sintaxe hebraica permite relacionar a oração à herança; o português “que ele ama” preserva essa tensão, e a nota explicita a alternativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém o paralelismo poético. “Glória” evita a conotação predominantemente negativa que “orgulho” pode ter no uso moderno, enquanto a alternativa lexical permanece documentada. O pronome relativo “que” conserva de modo natural a ambiguidade do antecedente.
