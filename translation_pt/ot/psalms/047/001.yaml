id: PSA.47.1
reference: Psalms 47:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: pt
  text: Batam palmas, todos os povos[a]; aclamem a Deus com gritos de alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as nações”. O hebraico עַמִּים pode designar grupos humanos em sentido étnico e coletivo ou, mais amplamente, nações.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com voz de júbilo” ou “com som de alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: Preserva o plural coletivo e étnico de עַמִּים, mantendo o alcance universal expresso por כָּל sem reduzir o termo à noção política de Estados-nações.
- source_word: תִּקְעוּ כָף
  choice: Batam palmas
  rationale: Traduz naturalmente em português o idioma hebraico de bater a mão ou a palma, e o plural do imperativo corresponde aos muitos destinatários.
- source_word: הָרִיעוּ
  choice: aclamem
  rationale: O imperativo causativo de רוע indica levantar um brado forte, frequentemente jubiloso ou triunfal. “Aclamem” expressa em português uma manifestação pública e sonora dirigida a Deus.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição ל marca aqui a direção ou o destinatário da aclamação.
- source_word: בְּקוֹל רִנָּה
  choice: com gritos de alegria
  rationale: קוֹל designa voz ou som, e רִנָּה pode indicar júbilo, canto jubiloso ou brado alegre. A expressão escolhida comunica de modo natural tanto o elemento sonoro quanto a alegria intensa.
theological_decisions:
- issue: Alcance do chamado dirigido aos povos
  choice: O versículo convoca universalmente todos os povos a aclamar a Deus.
  alternative: Entender o chamado como dirigido retoricamente apenas às nações vizinhas de Israel.
  rationale: O hebraico diz explicitamente “todos os povos”, e o contexto régio do salmo sustenta um chamado universal ao reconhecimento da realeza de Deus, sem exigir uma limitação geográfica ou étnica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Batam palmas” é idiomático e direto; “aclamem” conserva o caráter público e jubiloso do brado. A pontuação mantém o paralelismo poético dos dois imperativos.
