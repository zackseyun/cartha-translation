  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: pt
  text: Pois Deus é o Rei de toda a terra; cantem com entendimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cantem com habilidade”; possivelmente, “cantem um masquil”, termo musical ou literário de significado incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado ao louvor nos versículos anteriores, preservando de modo natural a força causal ou explicativa.
- source_word: מֶלֶךְ
  choice: o Rei
  rationale: Expressa diretamente a condição régia de Deus; o artigo torna a formulação natural em português sem alterar o sentido predicativo.
- source_word: כָּל הָאָרֶץ
  choice: de toda a terra
  rationale: Mantém de perto a construção hebraica e o alcance universal do reinado divino.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, a forma hebraica refere-se no singular ao Deus de Israel.
- source_word: זַמְּרוּ
  choice: cantem
  rationale: Imperativo plural que convoca a comunidade a cantar louvores; a forma é concisa, clara e natural.
- source_word: מַשְׂכִּיל
  choice: com entendimento
  rationale: Preserva a relação do termo com discernimento ou compreensão, sem eliminar suas possíveis conotações de execução hábil ou de designação musical/literária.
theological_decisions:
- issue: Alcance da realeza divina
  choice: Deus é apresentado como Rei de toda a terra, em sentido universal.
  alternative: Entender אֶרֶץ como terra ou país, com possível ênfase mais localizada.
  rationale: A expressão כָּל הָאָרֶץ, no contexto do salmo, aponta naturalmente para toda a terra; a tradução não restringe o alcance além do que o texto indica.
- issue: Sentido de מַשְׂכִּיל
  choice: Traduzir adverbialmente como “com entendimento”.
  alternative: “com habilidade” ou “um masquil”, como termo musical/literário.
  rationale: O hebraico admite mais de uma análise. A tradução principal comunica uma leitura plausível e inteligível, enquanto a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativo plural em forma brasileira corrente. A redação mantém a concisão poética e registra em nota a incerteza lexical de מַשְׂכִּיל.
