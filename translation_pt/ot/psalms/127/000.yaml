  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: pt
  text: 'Cântico das Subidas. De Salomão.[a]


    Se Yahweh não construir a casa,[b]

    em vão trabalham nela os seus construtores.

    Se Yahweh não guardar a cidade,

    em vão o vigia permanece alerta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “Para Salomão” ou “Pertencente a Salomão”. A expressão hebraica pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “casa” também pode ter o sentido mais amplo de família, linhagem ou dinastia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Reproduz o título tradicional da coleção e o sentido literal de uma canção ligada a subidas ou ascensões, sem especificar uma ocasião histórica que o hebraico não explicita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo silenciosamente por um título.
- source_word: בַיִת
  choice: casa
  rationale: É o sentido imediato no paralelismo com construtores, embora o termo hebraico também possa designar família, linhagem ou dinastia; essa amplitude é registrada em nota.
- source_word: שָׁוְא
  choice: em vão
  rationale: Expressa a inutilidade ou falta de resultado do esforço humano sem a ação de Yahweh e preserva a repetição enfática dos dois membros.
- source_word: שָׁקַד שׁוֹמֵר
  choice: o vigia permanece alerta
  rationale: Comunica naturalmente a ideia do vigia que se mantém desperto e vigilante, preservando a formulação proverbial do hebraico.
theological_decisions:
- issue: Relação entre a ação divina e o trabalho humano
  choice: Preservar as condicionais e declarar que o esforço é vão sem a ação de Yahweh
  alternative: Parafrasear como proibição do trabalho humano ou como garantia automática de sucesso
  rationale: O texto não condena construir nem vigiar; estabelece a dependência da ação protetora e eficaz de Yahweh, sem explicar sistematicamente como ela se relaciona com a responsabilidade humana.
- issue: Sentido de “casa”
  choice: Manter “casa” no texto e registrar a extensão semântica em nota
  alternative: Traduzir diretamente como “família” ou “dinastia”
  rationale: A imagem explícita é de construção, mas o hebraico permite uma ressonância mais ampla que não deve ser excluída nem imposta no corpo do texto.
translation_notes:
  register: Português atual, claro e digno, com paralelismo poético preservado. “Cântico” mantém o registro dos salmos; “vigia permanece alerta” é natural e compreensível em diferentes variedades do português. O pronome “nela” conserva o בּוֹ hebraico de modo idiomático, com concordância portuguesa com “casa”.
