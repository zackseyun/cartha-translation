base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: pt
  text: 'Cântico das subidas[a]. De Salomão.[b]


    Se Yahweh não construir a casa[c], seus construtores trabalham em vão[d]; se Yahweh não guardar a cidade, o sentinela permanece acordado em vão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cântico de peregrinação”. O título hebraico designa a coleção dos Salmos 120–134; “subidas” pode aludir a peregrinações a Jerusalém, mas a referência exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “Para Salomão” ou “Pertencente a Salomão”. A expressão hebraica pode indicar autoria, dedicação ou associação.
    reason: alternative_reading
  - marker: c
    text: “Casa” também pode ter em hebraico o sentido mais amplo de “família”, “casa real” ou “dinastia”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “seus construtores trabalham nela em vão”; “nela” fica implícito na formulação do texto principal.
    reason: source_form
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Preserva o sentido lexical de מַעֲלוֹת e a fórmula que identifica esta coleção de salmos, sem impor como certa uma explicação específica sobre peregrinação ou liturgia.
- source_word: לִשְׁלֹמֹה
  choice: De Salomão
  rationale: É a forma breve e convencional em títulos de salmos; a nota mantém a possível ideia de autoria, dedicação ou associação expressa pela preposição ל.
- source_word: אִם ... לֹא
  choice: Se ... não
  rationale: Reproduz naturalmente em português a condição negativa das duas orações hebraicas, sem alterar sua força para uma afirmação causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִבְנֶה בַיִת
  choice: construir a casa
  rationale: Mantém a imagem concreta da construção e a ligação verbal com 'construtores'; o contexto proverbial permite o uso definido de 'a casa'.
- source_word: שָׁוְא
  choice: em vão
  rationale: Expressa a inutilidade do esforço e conserva a repetição enfática nos dois membros paralelos.
- source_word: עָמְלוּ בֹנָיו בוֹ
  choice: seus construtores trabalham em vão
  rationale: Comunica de modo natural o esforço dos construtores relacionado à casa; a nota registra o בּוֹ, literalmente 'nela', omitido no corpo por redundância em português.
- source_word: יִשְׁמָר עִיר
  choice: guardar a cidade
  rationale: Expressa proteção vigilante e sustenta o paralelo com o sentinela.
- source_word: שָׁקַד שׁוֹמֵר
  choice: o sentinela fica acordado
  rationale: Preserva o sentido de vigília ou estado desperto de שׁקד, enquanto 'sentinela' torna explícito o contexto de guarda.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. A transliteração 'Yahweh' o preserva e evita substituí-lo silenciosamente por um título.
- issue: Alcance semântico de בַיִת
  choice: casa
  alternative: família; casa real; dinastia
  rationale: O paralelismo imediato com cidade e sentinela favorece a imagem concreta da casa, mas a nota mantém aberto o alcance mais amplo que o substantivo hebraico pode ter.
- issue: Agência divina e esforço humano
  choice: Manter as duas condições negativas sem explicação doutrinária adicional
  alternative: Parafrasear como bênção, providência ou predestinação
  rationale: O verso afirma a inutilidade do trabalho e da vigilância sem a ação de Yahweh, mas não define aqui como essa ação se relaciona em termos sistemáticos com a atividade humana.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se o paralelismo hebraico, a repetição de “em vão” e a ligação entre “construir” e “construtores”. “Sentinela” foi preferido a formas menos específicas como “guarda” para manter a imagem de vigilância noturna.
