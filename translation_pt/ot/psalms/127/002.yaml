  naturalness: O texto é claro e de registro apropriado, mas a sequência “levantar cedo, ficar acordados até tarde” soa gramaticalmente desalinhada. Uma formulação genérica coerente, com infinitivos reflexivos e singular genérico, é mais fluente e amplamente natural em português.
  terminology: “Trabalho penoso”, “sono” e “amado” são escolhas adequadas. A nota deve indicar explicitamente que, na segunda alternativa, quem dorme é o amado, para evitar uma ambiguidade portuguesa que poderia sugerir que Deus dorme.
