  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: pt
  text: É inútil levantar-se cedo, ficar acordado até tarde, comendo o pão de trabalho penoso; pois ele dá sono a seu amado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois assim ele dá a seu amado durante o sono”; ou: “pois ele dá a seu amado enquanto seu amado dorme”. O hebraico é condensado e pode significar tanto que Deus dá o próprio sono como que concede suas dádivas durante o sono.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: É inútil
  rationale: Expressa a ideia de esforço vão ou sem proveito de modo natural em português.
- source_word: מַשְׁכִּימֵי קוּם
  choice: levantar cedo
  rationale: Reproduz com clareza a ação de se levantar de madrugada ou muito cedo.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: ficar acordados até tarde
  rationale: Comunica idiomaticamente o prolongamento da atividade até tarde, mantendo o contraste com levantar cedo.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: comendo o pão do trabalho penoso
  rationale: Preserva a imagem concreta do pão e representa עֲצָבִים como labor doloroso e desgastante, sem restringi-lo apenas à tristeza ou ansiedade.
- source_word: כֵּן
  choice: pois
  rationale: Explicita naturalmente a relação lógica com a afirmação anterior, embora o hebraico também possa ser entendido como “assim”.
- source_word: יִתֵּן
  choice: ele dá
  rationale: Mantém a declaração geral no presente; o referente implícito é Deus, conforme o contexto do salmo.
- source_word: לִידִידוֹ
  choice: ao seu amado
  rationale: Conserva o singular e o tom afetivo do termo hebraico.
- source_word: שֵׁנָא
  choice: sono
  rationale: Adota como leitura principal o substantivo como objeto direto de “dá”, sem ocultar a construção alternativa na nota.
theological_decisions:
- issue: Sintaxe condensada de כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: pois ele dá sono ao seu amado
  alternative: 'ou: “pois assim ele dá ao seu amado durante o sono”; ou: “pois ele dá ao seu amado enquanto este dorme”'
  rationale: O hebraico permite entender “sono” como aquilo que Deus dá ou como indicação das circunstâncias em que ele dá. A leitura principal é natural e se ajusta ao contraste com o esforço inquieto, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural implícito de לָכֶם é refletido em “acordados”; evitou-se linguagem denominacional e manteve-se na nota a ambiguidade sintática do final do versículo.
