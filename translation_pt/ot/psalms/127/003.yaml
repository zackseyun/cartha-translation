  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: pt
  text: Eis que os filhos são uma herança vinda de Yahweh[a]; o fruto do ventre é uma recompensa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos são a herança de Yahweh”.'
    reason: Leitura alternativa possível da construção hebraica, que pode indicar posse em vez de origem.
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Conserva a força de chamar a atenção própria da partícula hebraica, em linguagem atual e adequada ao contexto poético.
- source_word: נַחֲלַת יְהוָה
  choice: uma herança que vem de Yahweh
  rationale: Explicita de modo natural a leitura de origem ou dádiva, favorecida pelo paralelismo com 'recompensa', sem ocultar a possível leitura possessiva, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּנִים
  choice: os filhos
  rationale: No contexto, o plural masculino designa genericamente a descendência; 'filhos' é natural em português e pode abranger os filhos de ambos os sexos.
- source_word: שָׂכָר
  choice: uma recompensa
  rationale: Expressa o sentido positivo do substantivo neste paralelismo, sem a conotação comercial mais forte de 'salário'.
- source_word: פְּרִי הַבָּטֶן
  choice: o fruto do ventre
  rationale: Preserva a imagem poética hebraica convencional para a descendência e sua ressonância bíblica.
theological_decisions:
- issue: Sentido da construção נַחֲלַת יְהוָה
  choice: os filhos são uma herança que vem de Yahweh
  alternative: os filhos são a herança de Yahweh
  rationale: A construção hebraica admite tanto a ideia de origem quanto a de posse. O paralelismo com 'uma recompensa' favorece entender os filhos como dádiva proveniente de Yahweh, mas a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A abertura 'Vejam' mantém o chamado de atenção; a elipse verbal no segundo membro preserva o paralelismo poético.
