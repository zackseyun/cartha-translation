  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: pt
  text: Como flechas na mão de um guerreiro, assim são os filhos de sua juventude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “os filhos homens nascidos durante a juventude”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Como flechas
  rationale: חִצִּים é o plural comum de חֵץ, “flecha”; “como” preserva o símile introduzido por כְּ.
- source_word: בְּ/יַד
  choice: na mão de
  rationale: A expressão com בְּ e o singular יָד indica que as flechas estão sob o domínio e à disposição do guerreiro; a forma singular foi preservada.
- source_word: גִּבּוֹר
  choice: um guerreiro
  rationale: No contexto da imagem bélica, גִּבּוֹר designa adequadamente um homem forte ou valente em combate; “guerreiro” é claro e natural.
- source_word: כֵּן
  choice: assim são
  rationale: כֵּן introduz o segundo termo da comparação; “assim são” mantém a estrutura proverbial do hebraico.
- source_word: בְּנֵי
  choice: os filhos
  rationale: בְּנֵי é um plural masculino em estado construto. “Filhos” preserva a referência masculina sem ampliá-la silenciosamente para “crianças”.
- source_word: הַ/נְּעוּרִים
  choice: da juventude
  rationale: נְעוּרִים significa “juventude” ou “anos da juventude”. A tradução formal preserva a concisão e a ambiguidade da expressão hebraica, enquanto a nota explicita seu sentido idiomático provável.
theological_decisions:
- issue: Expressão de gênero em בְּנֵי הַנְּעוּרִים
  choice: os filhos da juventude
  alternative: os filhos nascidos durante a juventude
  rationale: O hebraico emprega explicitamente o masculino plural e, no contexto social da imagem, provavelmente tem filhos homens em vista. O texto principal conserva essa forma e a expressão concisa do original; a nota oferece a leitura idiomática sem transformar a explicação em tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “Como... assim...” preserva a forma poética e proverbial do hebraico.
