  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: pt
  text: Feliz o homem que enche deles a sua aljava; eles não serão envergonhados[a] quando falarem com os inimigos[b] à porta da cidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “não se envergonharão”. Alguns entendem que o sujeito é somente o pai e traduzem: “ele não será envergonhado”. No hebraico, os verbos estão no plural.'
    reason: alternative_reading
  - marker: b
    text: Ou “quando contenderem com os inimigos” ou “quando defenderem sua causa diante dos inimigos”. Neste contexto, o verbo pode ter sentido jurídico ou adversarial.
    reason: lexical_alternative
  - marker: c
    text: A porta da cidade era o lugar de julgamentos públicos e de assuntos cívicos nas cidades antigas.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Introduz uma bem-aventurança e, em português atual, comunica naturalmente a condição favorável daquele homem sem reduzir o sentido a uma emoção passageira.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Mantém o masculino explícito do hebraico e a referência contextual ao pai retratado no salmo.
- source_word: מִלֵּא אֶת־אַשְׁפָּתוֹ מֵהֶם
  choice: enche deles a sua aljava
  rationale: Preserva a imagem das flechas do versículo anterior e expressa o valor de conteúdo da preposição מִן de forma idiomática em português.
- source_word: לֹא יֵבֹשׁוּ
  choice: eles não serão envergonhados
  rationale: Conserva o sujeito plural dos verbos hebraicos e a dimensão pública de vergonha ou desonra.
- source_word: כִּי
  choice: quando
  rationale: Apresenta a circunstância em que não sofrerão vergonha, leitura natural no contexto.
- source_word: יְדַבְּרוּ אֶת־אוֹיְבִים
  choice: falarem com os inimigos
  rationale: Mantém o sentido amplo de falar ou tratar com a parte adversária, sem decidir no texto principal entre conversa, contestação e defesa judicial.
- source_word: בַּשָּׁעַר
  choice: à porta da cidade
  rationale: Torna explícito o cenário urbano implícito na expressão hebraica e usa a formulação portuguesa tradicional e inteligível para o lugar de julgamento e negócios públicos.
theological_decisions:
- issue: Linguagem representativa masculina
  choice: o homem
  alternative: a pessoa; aquele que
  rationale: O substantivo hebraico é masculino e, no contexto, aponta para o pai; a tradução evita neutralizar essa referência.
- issue: Sujeito plural em יֵבֹשׁוּ e יְדַבְּרוּ
  choice: eles não serão envergonhados ... quando falarem
  alternative: ele não será envergonhado ... quando falar
  rationale: O texto massorético emprega verbos plurais, possivelmente abrangendo o pai e os filhos ou a família. O texto principal preserva essa forma em vez de resolver a tensão em favor do pai sozinho.
- issue: Natureza do confronto à porta
  choice: falarem com os inimigos
  alternative: contenderem com os inimigos; defenderem sua causa diante dos inimigos
  rationale: O Piel de דבר pode adquirir nuance adversarial ou forense neste cenário, mas o verbo continua lexicalmente amplo; a nota registra as possibilidades sem impor uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aljava” preserva a metáfora poética consolidada; “à porta da cidade” esclarece naturalmente o cenário antigo. Os marcadores foram posicionados junto às expressões que explicam.
