  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: pt
  text: Sejam envergonhados e recuem todos os que odeiam Sião.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Serão envergonhados e recuarão todos os que odeiam Sião.” As formas hebraicas também podem ser entendidas como uma declaração futura, em vez de uma oração de desejo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O verbo בוש expressa vergonha, humilhação ou frustração. A construção preserva aqui a força de desejo ou imprecação do yiqtol sem especificar quem causa a vergonha.
- source_word: וְיִסֹּגוּ אָחוֹר
  choice: e recuem
  rationale: A locução significa voltar para trás ou bater em retirada. “Recuem” comunica de modo natural e conciso tanto o verbo quanto a direção indicada por אָחוֹר, sem acrescentar uma agência não expressa no hebraico.
- source_word: כֹּל
  choice: todos
  rationale: Equivalente direto e natural do quantificador hebraico.
- source_word: שֹׂנְאֵי
  choice: os que odeiam
  rationale: O particípio substantivado, literalmente “os que odeiam”, é vertido por uma construção corrente que preserva seu sentido contínuo e caracterizador.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português para o nome צִיּוֹן.
theological_decisions:
- issue: Força modal dos yiqtol יֵבֹשׁוּ e וְיִסֹּגוּ
  choice: 'Desejo ou oração imprecatória: “Sejam envergonhados e recuem...”'
  alternative: 'Declaração futura: “Serão envergonhados e recuarão...”'
  rationale: No contexto poético, as formas podem ter valor volitivo/jussivo, mas também admitem leitura futura. O texto principal conserva a força de oração, e a nota registra a ambiguidade real.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Recuem” evita a expressão redundante “voltem para trás” e representa naturalmente וְיִסֹּגוּ אָחוֹר. O marcador da nota aparece no texto principal.
