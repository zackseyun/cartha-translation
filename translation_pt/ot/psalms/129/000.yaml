  source_fidelity: A declaração em primeira pessoa, a referência à juventude e a convocação para Israel falar correspondem bem ao hebraico. Contudo, o título שִׁיר הַמַּעֲלוֹת introduz a linha seguinte como sobrescrito, sendo mais fiel assinalá-lo com dois-pontos, não com ponto final. A alternativa para רַבַּת é pertinente e preserva uma ambiguidade lexical real.
  naturalness: «Muito me oprimiram desde a minha juventude» é claro, solene e natural no registro poético bíblico em português. Os travessões isolam adequadamente a fórmula de convocação; o travessão final preserva a continuação poética.
  terminology: «Cântico de peregrinação» é uma forma compreensível para o título tradicional e não sobre-especifica o cenário. «Oprimiram» transmite de modo adequado a hostilidade de צְרָרוּנִי. A nota deve corrigir a construção correlativa para «tanto ... quanto».
  issues:
