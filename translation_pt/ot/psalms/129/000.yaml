  text: 'Cântico de peregrinação: “Muito me oprimiram desde a minha juventude” — diga agora Israel —[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitas vezes me oprimiram desde a minha juventude”. O termo hebraico pode indicar tanto grande intensidade ou extensão quanto repetição frequente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: O título designa um cântico ligado às subidas ou ascensões; no contexto do Saltério, “peregrinação” comunica de modo natural a provável subida dos peregrinos a Jerusalém, sem alongar o cabeçalho.
- source_word: רַבַּת
  choice: Muito
  rationale: O advérbio preserva em português a leitura de grande intensidade ou extensão, enquanto a possível ideia de repetição é registrada em nota.
- source_word: צְרָרוּנִי
  choice: me oprimiram
  rationale: O verbo expressa tratar como adversário, hostilizar ou afligir; “oprimir” é claro, digno e adequado à experiência coletiva de Israel.
- source_word: מִנְּעוּרַי
  choice: desde a minha juventude
  rationale: Reproduz a imagem de Israel falando em primeira pessoa e olhando para a hostilidade sofrida desde seus primeiros tempos.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: diga agora Israel
  rationale: Mantém a exortação enfática introduzida por נָא e a personificação coletiva de Israel.
theological_decisions:
- issue: Identidade do eu que sofre
  choice: Manter a primeira pessoa singular e acrescentar “diga agora Israel”
  alternative: Converter diretamente para a primeira pessoa plural
  rationale: O hebraico apresenta Israel como sujeito coletivo que recita a declaração no singular; preservar essa forma evita explicar além do texto.
- issue: Sentido do sofrimento descrito
  choice: Usar o termo geral “oprimiram”
  alternative: Especificar perseguição política, militar ou religiosa
  rationale: A linha não identifica a modalidade exata da hostilidade, por isso a tradução mantém sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. As aspas e os travessões distinguem a declaração que Israel é convocado a repetir; o travessão final conserva a continuidade sintática com o versículo seguinte.
