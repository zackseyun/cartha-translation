  text: יְהוָ֥ה צַדִּ֑יק קִ֝צֵּ֗ץ עֲב֣וֹת רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: pt
  text: Yahweh é justo; ele cortou as cordas[a] dos perversos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordas grossas” ou “amarras”.
    reason: Alternativas lexicais para עֲבוֹת, que pode denotar cordas espessas usadas para prender.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa de modo direto e natural em português o caráter moral e judicial atribuído a Yahweh.
- source_word: קִצֵּץ
  choice: cortou
  rationale: O verbo indica cortar ou romper de maneira decisiva; o pretérito perfeito comunica naturalmente a ação concluída.
- source_word: עֲבוֹת
  choice: cordas
  rationale: Mantém a imagem concreta de amarras usadas para prender; o termo também pode designar cordas grossas.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Traduz o adjetivo plural substantivado sem acrescentar uma referência exclusiva a homens; 'perversos' é claro e corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. O pronome “ele” explicita naturalmente a mudança para a ação verbal sem alterar o referente. O marcador foi colocado após “cordas”, termo ao qual a nota lexical se refere.
