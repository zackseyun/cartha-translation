  yaml_path: translation/ot/psalms/129/007.yaml
  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: pt
  text: 'com a qual o ceifeiro não enche a mão,

    nem quem ajunta os feixes enche os braços.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o regaço», «o colo» ou «a dobra da roupa» — o lugar onde se seguravam os feixes recolhidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: com a qual ... não
  rationale: 'Retoma a erva dos telhados no versículo anterior e explicita em português a relação: é uma erva com a qual o ceifeiro não consegue encher a mão.'
- source_word: מִלֵּא
  choice: enche
  rationale: Embora a forma hebraica seja perfeita, aqui descreve o resultado característico dessa erva; o presente proverbial é mais natural em português.
- source_word: כַפּוֹ
  choice: a mão
  rationale: כַּף designa literalmente a palma ou a mão; «mão» é idiomático e mantém a imagem concreta da colheita.
- source_word: קוֹצֵר
  choice: o ceifeiro
  rationale: O particípio substantivado indica aquele que corta a plantação. «Ceifeiro» é conciso, claro e preserva o paralelismo agrícola.
- source_word: וְחִצְנוֹ
  choice: os braços
  rationale: O substantivo pode indicar o regaço, o peito ou a dobra da roupa onde se carregavam as hastes. «Os braços» comunica com clareza a imagem de segurar os feixes junto ao corpo, enquanto a nota preserva as alternativas mais literais.
- source_word: מְעַמֵּר
  choice: quem ajunta os feixes
  rationale: O particípio se refere a quem reúne a colheita em molhos ou feixes; a formulação explicita a ação para o leitor moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. «Ceifeiro» mantém o cenário agrícola bíblico sem soar obscuro; «quem ajunta os feixes» evita um termo técnico menos transparente. O marcador [a] foi colocado imediatamente após «os braços», expressão que a nota esclarece.
