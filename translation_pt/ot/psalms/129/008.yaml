base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: pt
  text: 'E os que passam não dizem: “A bênção de Yahweh esteja sobre vocês! Nós os abençoamos em nome de Yahweh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: E ... não dizem
  rationale: Mantém a coordenação e a negação hebraicas; o presente expressa naturalmente a descrição geral do que os transeuntes não fazem.
- source_word: הָעֹבְרִים
  choice: os que passam
  rationale: O particípio com artigo designa uma classe de pessoas; esta formulação é clara e natural em português.
- source_word: בִּרְכַּת יְהוָה
  choice: A bênção de Yahweh
  rationale: Preserva a construção nominal hebraica e a linguagem tradicional de bênção.
- source_word: אֲלֵיכֶם
  choice: esteja sobre vocês
  rationale: Explicita o sentido optativo da fórmula de bênção, cujo verbo está implícito no hebraico.
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: Nós os abençoamos
  rationale: O perfeito funciona de modo performativo numa fórmula convencional; o presente comunica que a bênção é pronunciada naquele momento.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Expressa a invocação e a autoridade sob as quais a bênção é pronunciada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A forma “vocês” é natural e deixa claro o plural de אֲלֵיכֶם e אֶתְכֶם. A repetição de “Yahweh” preserva a repetição enfática do original.
