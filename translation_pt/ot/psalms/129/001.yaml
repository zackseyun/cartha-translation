  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרַ֑/י יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/001.yaml
  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
translation:
  language: pt
  text: Cântico das Subidas. Muitas vezes me afligiram desde a minha juventude — diga agora Israel —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Preserva de modo natural o substantivo hebraico מַעֲלוֹת e a fórmula tradicional que encabeça os Salmos 120–134, sem explicitar a interpretação peregrina no texto.
- source_word: רַבַּת
  choice: Muitas vezes
  rationale: O uso adverbial pode indicar repetição ou grande extensão. Neste contexto, a repetição é idiomática em português e antecipa naturalmente a retomada da declaração no versículo seguinte.
- source_word: צְרָרוּנִי
  choice: me afligiram
  rationale: Expressa o tratamento hostil sem restringi-lo à opressão política e conserva o registro de lamento.
- source_word: מִנְּעוּרַי
  choice: desde a minha juventude
  rationale: Transmite o ponto inicial temporal da expressão hebraica em português corrente e digno.
- source_word: יֹאמַר נָא
  choice: diga agora
  rationale: O jussivo com נָא funciona como convocação enfática; “agora” reproduz sua força discursiva sem sugerir um pedido de cortesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio e o sentido corporativo da comunidade convocada a repetir a declaração.
theological_decisions:
- issue: Locutor corporativo e moldura litúrgica
  choice: Manter a primeira pessoa singular e a convocação para que Israel fale.
  alternative: Interpretar explicitamente o locutor como um indivíduo cuja experiência é depois aplicada a Israel.
  rationale: A frase “diga agora Israel” convida a comunidade a assumir a queixa em primeira pessoa; a tradução conserva a tensão entre voz individual e identidade corporativa sem a resolver por paráfrase.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Cântico” preserva o tom litúrgico; a ordem e os travessões mantêm a convocação enfática e a continuidade sintática com o versículo seguinte.
