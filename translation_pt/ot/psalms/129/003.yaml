lexical_decisions:
- source_word: עַל גַּבִּי
  choice: sobre as minhas costas
  rationale: A preposição עַל indica a superfície atingida, e גַּבִּי significa literalmente “minhas costas”. A formulação mantém a imagem corporal vívida do hebraico.
- source_word: חָרְשׁוּ חֹרְשִׁים
  choice: Lavradores lavraram
  rationale: O verbo e o particípio derivam da mesma raiz e significam “lavrar/arar” e “lavradores”. A repetição preserva a força poética e a metáfora agrícola.
- source_word: הֶאֱרִיכוּ
  choice: alongaram
  rationale: O hifil expressa a ideia causativa de tornar longo ou prolongar. “Alongaram” é conciso e natural em português.
- source_word: לְמַעֲנוֹתָם
  choice: os seus sulcos
  rationale: O substantivo designa os sulcos abertos pelo arado. “Sulcos” conserva tanto a imagem agrícola concreta quanto sua associação metafórica com feridas prolongadas.
theological_decisions:
- issue: Representação metafórica do sofrimento de Israel
  choice: Conservar literalmente a imagem de lavrar as costas e alongar sulcos.
  alternative: Explicitar como açoites, feridas ou opressão.
  rationale: O hebraico não desfaz a metáfora. Mantê-la preserva sua violência poética e evita impor no texto principal uma interpretação específica do modo de sofrimento.
translation_notes:
  register: Português moderno, claro e digno. A repetição deliberada “Lavradores lavraram” reproduz a figura etimológica hebraica; “costas” segue o uso idiomático português para essa parte do corpo.
