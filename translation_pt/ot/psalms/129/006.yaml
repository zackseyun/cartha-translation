  verdict: approve
  source_fidelity: O texto principal traduz adequadamente o valor optativo de יִהְיוּ e preserva a imagem concreta de חֲצִיר dos telhados. “Que seca antes de ser arrancada” corresponde de modo direto ao sentido lexical atestado de שָׁלַף, “puxar/retirar/arrancar”. A nota assinala de forma apropriada a alternativa interpretativa tradicional, segundo a qual a vegetação seca antes de brotar ou se desenvolver. Isso é preferível a adotar sem ressalva a leitura inglesa “before it grows up”, que não é o sentido lexical mais direto de שָׁלַף.
  naturalness: “Que eles sejam como a relva dos telhados, que seca antes de ser arrancada” é português atual, claro e poeticamente conciso. “Relva” é uma escolha internacional e apropriada ao registro do salmo; “dos telhados” exprime naturalmente a relação locativa da imagem.
