  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: pt
  text: 'Que eles sejam como a relva dos telhados,

    que seca antes de ser arrancada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que seca antes de brotar”. O sentido da expressão hebraica é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que eles sejam
  rationale: O valor volitivo ou imprecatório no contexto favorece uma formulação optativa, expressando o desejo do salmista a respeito dos que odeiam Sião.
- source_word: כַּחֲצִיר
  choice: como a relva
  rationale: חָצִיר designa relva ou vegetação rasteira; “relva” preserva com naturalidade a imagem poética.
- source_word: גַּגּוֹת
  choice: dos telhados
  rationale: O plural refere-se aos telhados planos, onde uma fina camada de terra podia permitir o surgimento de vegetação de pouca duração.
- source_word: שֶׁקַּדְמַת
  choice: antes de
  rationale: A construção relativa comunica anterioridade temporal em relação à ação seguinte.
- source_word: שָׁלַף
  choice: ser arrancada
  rationale: O verbo significa puxar, retirar ou arrancar. “Ser arrancada” mantém o sentido lexical no contexto da relva, sem substituí-lo pela ideia distinta de crescer.
- source_word: יָבֵשׁ
  choice: seca
  rationale: O verbo expressa secar; a forma presente produz uma descrição poética clara e direta.
