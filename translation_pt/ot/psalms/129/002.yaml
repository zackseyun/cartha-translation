base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: pt
  text: Muito me oprimiram desde a minha juventude[a], mas não prevaleceram contra mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitas vezes me oprimiram desde a minha juventude”. A expressão hebraica inicial pode destacar tanto a intensidade (“muito”) quanto a repetição (“muitas vezes”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não conseguiram me vencer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: Muito
  rationale: O uso adverbial exprime sobretudo grande intensidade ou extensão. “Muito” preserva essa força de modo natural em português, sem excluir a possível ideia de repetição, registrada em nota.
- source_word: צְרָרוּנִי
  choice: me oprimiram
  rationale: O verbo צרר descreve ação hostil, perseguição ou aflição. “Oprimiram” comunica hostilidade prolongada sem restringir o sentido a um ataque militar.
- source_word: מִנְּעוּרָי
  choice: desde a minha juventude
  rationale: A expressão indica o ponto inicial no tempo e sua continuidade; “desde a minha juventude” é clara e idiomática.
- source_word: גַּם
  choice: mas
  rationale: 'Neste contexto, גַּם assume força adversativa ou concessiva: apesar da opressão, os inimigos não tiveram êxito.'
- source_word: לֹא יָכְלוּ לִי
  choice: não prevaleceram contra mim
  rationale: יכל com ל expressa não conseguir dominar ou vencer alguém. “Não prevaleceram contra mim” preserva a ideia de tentativa frustrada de subjugação.
