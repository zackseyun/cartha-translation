base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: pt
  text: Em vestes bordadas, ela é conduzida ao rei[a]; as virgens que a seguem, suas companheiras, são trazidas a você[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em bordados, ela é levada ao rei”.'
    reason: lexical_alternative
  - marker: b
    text: “Virgens” também pode ser traduzido por “moças” ou “jovens mulheres”, mas o termo hebraico designa mais especificamente jovens não casadas, virgens.
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega aqui a segunda pessoa feminina singular, aparentemente passando a dirigir-se à noiva. Algumas traduções ajustam a frase para se referir ao rei.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: Em vestes bordadas
  rationale: רְקָמוֹת designa bordados ou tecidos trabalhados e coloridos. “Vestes” é explicitado naturalmente com base no contexto nupcial, enquanto “bordadas” preserva a imagem concreta.
- source_word: תּוּבַל
  choice: ela é conduzida
  rationale: O hofal de יבל indica que ela é levada ou conduzida. “É conduzida” mantém a voz passiva e combina com o caráter cerimonial da procissão.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: A preposição ל indica aqui movimento em direção ao rei; “ao rei” é a formulação portuguesa mais direta.
- source_word: בְּתוּלוֹת
  choice: virgens
  rationale: O termo denota mais especificamente mulheres jovens não casadas, virgens; a escolha preserva essa precisão lexical no contexto das acompanhantes da noiva.
- source_word: אַחֲרֶיהָ
  choice: seguem atrás dela
  rationale: A expressão indica posição ou sequência posterior. A inclusão de “seguem”, implícita na cena processional, produz português natural sem alterar o sentido.
- source_word: רֵעוֹתֶיהָ
  choice: suas companheiras
  rationale: רֵעוֹתֶיהָ expressa relação de amizade ou companhia sem especificar formalmente uma função; “companheiras” preserva essa amplitude.
- source_word: מוּבָאוֹת
  choice: são trazidas
  rationale: O particípio hofal feminino plural de בוא descreve as companheiras sendo trazidas. A forma passiva reproduz a estrutura hebraica.
- source_word: לָךְ
  choice: a você
  rationale: O sufixo é de segunda pessoa feminina singular. “A você” preserva a mudança poética para o discurso direto dirigido à noiva.
theological_decisions:
- issue: Mudança de destinatária no pronome final לָךְ
  choice: 'Manter a segunda pessoa feminina: “a você”.'
  alternative: Interpretar o referente como o rei (“a ele”/“ao rei”) ou suavizar como “com ela”.
  rationale: O Texto Massorético traz inequivocamente um sufixo feminino singular de segunda pessoa. A tradução conserva a tensão e a mudança de pessoa do hebraico, sem corrigi-las por conjectura.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para clareza: “seguem” explicita o movimento implícito da procissão, e os marcadores foram posicionados junto às expressões que explicam. A segunda pessoa feminina do final foi preservada, sem suavização interpretativa.'
