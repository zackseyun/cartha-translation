base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: pt
  text: Em lugar de seus pais estarão seus filhos; você os estabelecerá como príncipes em toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todo o país”. A palavra hebraica traduzida por “terra” também pode significar “país” ou “território”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Em lugar de
  rationale: Expressa substituição ou sucessão dinástica, e não posição espacial.
- source_word: אֲבֹתֶיךָ
  choice: seus pais
  rationale: Preserva o sentido literal e o tom dinástico do hebraico; no contexto, também pode abranger antepassados.
- source_word: יִהְיוּ
  choice: estarão
  rationale: O futuro de “estar” forma em português uma construção natural com “em lugar de” e comunica a sucessão prometida.
- source_word: בָנֶיךָ
  choice: seus filhos
  rationale: No contexto régio, refere-se especificamente aos filhos homens como herdeiros; em português, “filhos” é a forma natural correspondente.
- source_word: תְּשִׁיתֵמוֹ
  choice: você os constituirá
  rationale: O verbo significa pôr ou estabelecer; “constituirá” comunica a instalação formal em uma função de governo sem expandir demais o texto.
- source_word: לְשָׂרִים
  choice: príncipes
  rationale: Preserva o registro régio de שָׂרִים, que pode designar príncipes, chefes ou governantes.
- source_word: בְּכָל הָאָרֶץ
  choice: por toda a terra
  rationale: Mantém o alcance amplo mais provável no contexto régio exaltado, enquanto uma nota registra a possibilidade lexical de “terra” no sentido de território ou país.
theological_decisions:
- issue: Alcance de הָאָרֶץ no contexto régio, potencialmente messiânico
  choice: toda a terra
  alternative: todo o país / toda a terra do reino
  rationale: O hebraico permite tanto um alcance universal quanto territorial. O texto principal mantém a leitura ampla adequada ao tom exaltado do salmo, e a nota preserva a alternativa sem impor uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Constituir príncipes” mantém o tom régio e formal do salmo sem soar arcaico. O marcador [a] aparece no texto principal junto à expressão que explica.
