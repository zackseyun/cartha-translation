  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: pt
  text: Todas as tuas vestes exalam mirra, aloés[a] e cássia; dos palácios de marfim,[b] instrumentos de cordas[c] te alegraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “aloés” são uma madeira aromática, possivelmente madeira de ágar, e não a planta suculenta hoje conhecida por esse nome.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “vindos dos palácios de marfim” ou, conforme outra compreensão da preposição, “por causa dos palácios de marfim”.
    reason: alternative_reading
  - marker: c
    text: O hebraico não declara o sujeito de “te alegraram”. Entre as possibilidades estão música, músicos ou, segundo uma interpretação tradicional, instrumentos de cordas.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: mirra
  rationale: Equivalente português tradicional e preciso para a resina aromática.
- source_word: וַאֲהָלוֹת
  choice: aloés
  rationale: Designa uma madeira aromática usada em perfumes, não a planta suculenta hoje chamada aloé; a nota esclarece o sentido.
- source_word: קְצִיעוֹת
  choice: cássia
  rationale: Nome corrente da especiaria ou casca aromática mencionada no hebraico.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Todas as tuas vestes exalam
  rationale: A oração hebraica não tem verbo expresso e justapõe os aromas às vestes. “Exalam” comunica naturalmente que as vestes estão impregnadas dessas fragrâncias, sem sugerir que sejam feitas das especiarias.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: dos palácios de marfim
  rationale: No contexto de casamento régio, הֵיכָל denota palácios ou salões; שֵׁן, literalmente “dente”, refere-se idiomaticamente ao marfim.
- source_word: שִׂמְּחוּךָ
  choice: te alegraram
  rationale: 'Reproduz o piel perfeito na terceira pessoa do plural com sufixo de segunda pessoa masculina singular: “fizeram-te ficar alegre”.'
- source_word: sujeito implícito de שִׂמְּחוּךָ
  choice: instrumentos de cordas
  rationale: O hebraico massorético não explicita o sujeito plural. “Instrumentos de cordas” representa uma interpretação tradicional adequada ao ambiente festivo, mas a incerteza é preservada em nota.
theological_decisions:
- issue: Contexto régio e possível leitura messiânica do Salmo 45
  choice: Traduzir segundo a cena imediata de casamento régio
  alternative: Introduzir na redação uma identificação messiânica explícita
  rationale: O versículo descreve fragrâncias, luxo palaciano e celebração. Leituras messiânicas ou tipológicas posteriores não devem ser acrescentadas às palavras deste versículo.
- issue: Sujeito não expresso de שִׂמְּחוּךָ
  choice: Usar “instrumentos de cordas” no texto e assinalar a inferência
  alternative: Música, músicos ou outro sujeito plural não identificado
  rationale: A forma verbal exige um sujeito plural, mas o texto hebraico preservado não o nomeia de modo inequívoco. A tradução adota a interpretação tradicional sem ocultar a ambiguidade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa coerentes com o registro poético dos Salmos. “Exalam” torna natural a oração nominal hebraica; as notas preservam as principais incertezas lexicais e sintáticas.
