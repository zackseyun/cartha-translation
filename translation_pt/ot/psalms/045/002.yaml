source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: pt
  text: Você é mais belo do que os filhos dos homens[a]; a graça foi derramada sobre seus lábios[b]; por isso Deus o abençoou para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “mais belo que os filhos do homem”, expressão poética que compara o rei aos demais seres humanos. Também se pode traduzir: “mais formoso que os filhos dos homens”.'
    reason: lexical_alternative
  - marker: b
    text: “Graça” também pode significar “favor”, “encanto” ou “graciosidade”. A imagem pode descrever a fala graciosa do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Você é o mais belo
  rationale: A forma poética intensiva de יפה expressa beleza extraordinária. Em português, “o mais belo entre” comunica naturalmente a comparação superlativa implícita, sem o tom arcaico de “mais formoso”.
- source_word: מִבְּנֵי אָדָם
  choice: entre os filhos dos homens
  rationale: Preserva a expressão poética hebraica e sua referência masculina no contexto de um rei, ao mesmo tempo que a construção “o mais belo entre” soa natural em português.
- source_word: הוּצַק
  choice: foi derramada
  rationale: O perfeito passivo de יצק descreve a graça como algo derramado sobre os lábios. O pretérito perfeito mantém o aspecto perfectivo e a imagem concreta.
- source_word: חֵן
  choice: graça
  rationale: חֵן pode significar graça, favor ou encanto. Junto aos lábios, “graça” conserva tanto a ideia de fala graciosa quanto a de favor ou encanto, sem limitar indevidamente o sentido.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: sobre os seus lábios
  rationale: Embora בְּ tenha sentido básico de “em/com”, “sobre” se ajusta naturalmente em português à metáfora de derramar e preserva sua vivacidade.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressa de forma atual e clara a relação inferencial do hebraico, com dignidade poética.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: Deus o abençoou
  rationale: אֱלֹהִים é entendido como sujeito, a leitura sintática mais direta, e o perfeito verbal é traduzido pelo pretérito perfeito português.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português claro e consagrado para duração permanente.
theological_decisions:
- issue: Se אֱלֹהִים é sujeito da oração ou vocativo.
  choice: Deus o abençoou
  alternative: ó Deus, ele o abençoou / por isso, ó Deus, o seu Deus o abençoou
  rationale: Neste versículo, a sintaxe mais natural toma אֱלֹהִים como sujeito de בֵּרַכְךָ. A tradução não acrescenta “seu Deus” a partir do versículo seguinte nem força uma leitura cristológica além do que o texto desta oração afirma.
- issue: Amplitude semântica de חֵן junto aos lábios.
  choice: graça
  alternative: favor, encanto ou palavras graciosas
  rationale: “Graça” mantém a polissemia do hebraico e evita reduzir a expressão apenas à eloquência, ao favor divino ou à beleza pessoal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “o mais belo entre” evita rigidez literal sem apagar a comparação; “filhos dos homens” mantém o registro poético tradicional sem recorrer a formas arcaicas. Os pronomes de tratamento seguem o padrão brasileiro formal (“seus”, “o”).
