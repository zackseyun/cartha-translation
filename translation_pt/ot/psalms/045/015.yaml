  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: pt
  text: Serão conduzidas com alegria e júbilo; entrarão no palácio do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “salão” ou, em outros contextos, “templo”; aqui, “palácio” combina melhor com o cenário do casamento real.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: serão conduzidas
  rationale: 'O hofal imperfeito, terceira pessoa feminina plural, de יבל expressa ação passiva: serem conduzidas ou levadas. “Serão conduzidas” preserva a ideia de procissão e a concordância feminina indicada pelo hebraico.'
- source_word: בִּשְׂמָחוֹת
  choice: com alegria
  rationale: A preposição בְּ indica aqui modo ou acompanhamento. Embora o substantivo esteja no plural, “com alegria” comunica naturalmente em português o sentido coletivo da celebração.
- source_word: וָגִיל
  choice: e júbilo
  rationale: גִּיל designa alegria intensa ou exultação. “Júbilo” distingue o termo de שְׂמָחוֹת sem tornar a expressão pesada.
- source_word: תְּבֹאֶינָה
  choice: entrarão
  rationale: O qal imperfeito feminino plural de בוא, diante de um edifício como destino, é expresso com precisão e naturalidade por “entrarão”.
- source_word: בְּהֵיכַל
  choice: no palácio
  rationale: הֵיכָל pode significar palácio, salão ou templo. No cenário imediato de casamento real do Salmo 45, “palácio” é a opção contextual mais provável.
- source_word: מֶלֶךְ
  choice: do rei
  rationale: Embora o hebraico não tenha artigo explícito, a construção e o contexto apontam para o rei específico celebrado no salmo; “do rei” é natural em português.
theological_decisions:
- issue: Referente dos verbos no feminino plural
  choice: 'Manter o sujeito implícito no feminino plural: “serão conduzidas” e “entrarão”.'
  alternative: Explicitar “elas”, “as jovens” ou “as acompanhantes da noiva”.
  rationale: Os verbos hebraicos indicam um referente feminino plural, ligado pelo contexto ao cortejo nupcial, mas o versículo não o nomeia. A tradução preserva essa informação gramatical sem especificar além do texto.
- issue: Sentido de הֵיכָל no cenário do salmo
  choice: palácio
  alternative: templo ou salão
  rationale: O contexto literário imediato é uma procissão de casamento real. “Palácio” preserva esse cenário sem impor uma identificação teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético, diferencia os dois termos de celebração e mantém no feminino plural o sujeito que o hebraico deixa implícito.
