  text: שִׁמְעִי בַ֣ת וּ֭/רְאִי וְ/הַטִּ֣י אָזְנֵ֑/ךְ וְ/שִׁכְחִ֥י עַ֝מֵּ֗/ךְ וּ/בֵ֥ית אָבִֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: pt
  text: Escute, filha, e veja; incline o ouvido e esqueça o seu povo e a casa de seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Escute
  rationale: O imperativo feminino singular pede atenção deliberada; “escute” é natural no português moderno e distingue esta ordem da ordem seguinte, “veja”.
- source_word: בַת
  choice: filha
  rationale: Mantém o vocativo feminino direto sem acrescentar a interjeição ausente no hebraico.
- source_word: וּרְאִי
  choice: e veja
  rationale: Traduz diretamente o imperativo de ראה e preserva a sequência coordenada de ordens.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: incline o ouvido
  rationale: Conserva a imagem hebraica de voltar ou inclinar o ouvido para ouvir com atenção; o possessivo fica naturalmente implícito no português.
- source_word: וְשִׁכְחִי
  choice: e esqueça
  rationale: Mantém o sentido lexical explícito e a força do imperativo, sem suavizá-lo como “deixe para trás”.
- source_word: עַמֵּךְ
  choice: o seu povo
  rationale: Representa de modo direto o grupo étnico e social ao qual a mulher pertence.
- source_word: וּבֵית אָבִיךְ
  choice: e a casa de seu pai
  rationale: Preserva a expressão hebraica para a família, o lar ou a casa ancestral paterna, sem escolher apenas uma dessas nuances.
theological_decisions:
- issue: Força da exortação nupcial
  choice: Uma exortação direta à noiva para reorientar sua lealdade principal, deixando seu povo e sua casa paterna em favor do casamento real.
  alternative: Uma convocação sapiencial geral à atenção, sem destaque para uma mudança de lealdade.
  rationale: A sequência de imperativos culmina em esquecer o povo e a casa paterna, o que, no contexto nupcial do salmo, indica uma reorientação relacional decisiva. A tradução conserva essa força sem acrescentar interpretações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo e a sucessão dos imperativos do hebraico. “Incline o ouvido” mantém a imagem poética sem soar excessivamente arcaica.
