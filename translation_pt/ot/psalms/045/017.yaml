  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: pt
  text: Farei que o teu nome seja lembrado[a] em todas as gerações; por isso, os povos te louvarão[b] para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mencionarei o teu nome” ou “me lembrarei do teu nome”. O verbo hebraico está na forma causativa e sugere uma comemoração ativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “te darão graças”. O verbo hebraico pode expressar louvor ou ação de graças em contextos de culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Farei que ... seja lembrado
  rationale: 'O hifil de זכר favorece um sentido causativo: o salmista promoverá a lembrança ou comemoração do nome, e não apenas se lembrará dele em particular.'
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Tradução direta e idiomática; neste contexto, o nome também abrange reputação, renome e memória pública.
- source_word: בְּכָל דֹּר וָדֹר
  choice: em todas as gerações
  rationale: A repetição hebraica expressa a sucessão contínua das gerações. O plural é natural em português e preserva o alcance distributivo da expressão.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressa de maneira clara e atual a relação de consequência indicada pela locução hebraica.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva o plural hebraico e a referência poética a múltiplos povos, sem reduzi-los a um único povo.
- source_word: יְהוֹדֻךָ
  choice: te louvarão
  rationale: No uso dos Salmos, o hifil de ידה pode indicar louvor ou ação de graças. 'Louvarão' se ajusta naturalmente ao contexto de renome duradouro.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente, digna e enfática para a fórmula hebraica de duração perpétua.
theological_decisions:
- issue: Referente dos pronomes de segunda pessoa neste salmo real de casamento
  choice: Manter a interpelação direta na segunda pessoa, sem identificar o referente além do que o texto declara
  alternative: Explicitar o rei davídico ou interpretar diretamente a fala como messiânica
  rationale: O versículo dirige-se diretamente a 'tu' e anuncia louvor duradouro. Embora o contexto imediato seja régio e haja leitura messiânica no âmbito canônico, a tradução não deve decidir uma questão que o próprio versículo deixa aberta.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A colocação pronominal em “te louvarão” é natural no registro bíblico contemporâneo sem soar arcaica. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
