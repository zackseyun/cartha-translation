  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: pt
  text: Amaste a justiça e odiaste a maldade; por isso Deus[a], o teu Deus, te ungiu com óleo de alegria, mais do que a teus companheiros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por isso, ó Deus, o teu Deus te ungiu». O primeiro «Deus» pode ser entendido como vocativo, em vez de sujeito do verbo.'
    reason: alternative_reading
  - marker: b
    text: Este versículo é citado em Hebreus 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Amaste
  rationale: O perfeito qal na segunda pessoa masculina singular descreve de modo direto a atitude consolidada do rei; o pretérito perfeito é natural e poético em português.
- source_word: צֶּדֶק
  choice: a justiça
  rationale: Abrange aquilo que é justo e correto e mantém o contraste ético com רֶשַׁע; em português corrente, «justiça» é mais natural aqui do que «retidão».
- source_word: וַתִּשְׂנָא
  choice: e odiaste
  rationale: Mantém a coordenação e o paralelismo com «amaste», explicitando naturalmente a segunda pessoa.
- source_word: רֶשַׁע
  choice: a maldade
  rationale: Expressa o mal moral e forma um contraste claro e idiomático com «justiça».
- source_word: עַל כֵּן
  choice: por isso
  rationale: Introduz de forma corrente e precisa a consequência do amor à justiça e do ódio à maldade.
- source_word: מְשָׁחֲךָ
  choice: te ungiu
  rationale: Preserva o sentido régio e consagratório do verbo משׁח e representa diretamente o perfeito com sufixo de segunda pessoa.
- source_word: אֱלֹהִים אֱלֹהֶיךָ
  choice: Deus, o teu Deus
  rationale: Toma o primeiro אֱלֹהִים como sujeito e o segundo como identificação apositiva, sem ocultar em nota a leitura vocativa também possível.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: óleo de alegria
  rationale: Reproduz a cadeia construta de forma idiomática e mantém a imagem festiva de honra, favor e exaltação.
- source_word: מֵחֲבֵרֶיךָ
  choice: mais do que aos teus companheiros
  rationale: O מן tem valor comparativo; esta formulação é clara em português e identifica os companheiros como o segundo termo da comparação.
theological_decisions:
- issue: Função sintática e força teológica do primeiro אֱלֹהִים
  choice: «Deus, o teu Deus, te ungiu», tomando o primeiro אֱלֹהִים como sujeito.
  alternative: «Ó Deus, o teu Deus te ungiu», tomando o primeiro אֱלֹהִים como vocativo.
  rationale: A sintaxe hebraica admite ambas as análises. O texto principal adota a leitura que se encaixa mais diretamente como sujeito do verbo neste versículo, enquanto a nota preserva a leitura vocativa, relevante no contexto do salmo e em Hebreus 1:9.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção poética concisa. Emprega-se «teu» em harmonia com a segunda pessoa verbal «amaste/odiaste», evitando mistura pronominal. A ambiguidade sintática central do hebraico é mantida por meio de nota.
