  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: pt
  text: 'Meu coração transborda de uma boa palavra[a]; eu digo: “Minha obra é para o rei[b]”. Minha língua é a pena de um escriba hábil[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um tema agradável” ou “um assunto nobre”. A expressão hebraica pode indicar tanto as palavras pronunciadas quanto o tema expresso.
    reason: lexical_alternative
  - marker: b
    text: Ou “a respeito do rei” ou “ao rei”. A preposição hebraica pode indicar dedicação, assunto ou destinatário.
    reason: lexical_alternative
  - marker: c
    text: Ou “um escriba pronto” ou “um escriba veloz”. O adjetivo hebraico pode destacar prontidão e rapidez, além de habilidade adquirida.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: transborda
  rationale: Expressa o movimento interior de algo que borbulha ou aflora até se tornar fala, preservando a força poética do hebraico.
- source_word: לִבִּי
  choice: meu coração
  rationale: Mantém a imagem hebraica do coração como centro da reflexão e da emoção.
- source_word: דָּבָר טוֹב
  choice: uma boa palavra
  rationale: Preserva a amplitude lexical de דָּבָר e a forma concreta da expressão, sem excluir o sentido contextual de tema agradável ou assunto nobre.
- source_word: אֹמֵר אֲנִי
  choice: eu digo
  rationale: Equivalente direto e natural, sem especificar indevidamente se a fala é recitação ou declaração formal.
- source_word: מַעֲשַׂי
  choice: minha obra
  rationale: No contexto poético, indica aquilo que o salmista produziu ou compôs; o singular coletivo em português soa natural e evita restringir o sentido a poema ou feitos.
- source_word: לְמֶלֶךְ
  choice: para o rei
  rationale: Expressa naturalmente a possível dedicação da composição, mantendo em nota os sentidos também plausíveis de assunto ou destinatário.
- source_word: לְשׁוֹנִי
  choice: minha língua
  rationale: Conserva a metáfora corporal e poética do texto hebraico.
- source_word: עֵט
  choice: pena
  rationale: Designa de modo natural um instrumento antigo de escrita e combina com a imagem do escriba.
- source_word: סוֹפֵר
  choice: escriba
  rationale: Preserva o ambiente antigo e o sentido profissional de um escritor treinado.
- source_word: מָהִיר
  choice: hábil
  rationale: Comunica a fluência adquirida de quem escreve com prontidão e rapidez; outros matizes são registrados em nota.
