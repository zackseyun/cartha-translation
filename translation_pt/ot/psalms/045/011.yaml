source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: pt
  text: E o rei desejará a sua beleza[a], pois ele é o seu senhor; curve-se diante dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que o rei deseje a sua beleza». A forma hebraica pode ser entendida como uma declaração futura ou como um desejo ou exortação de valor volitivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «preste-lhe homenagem». O verbo pode descrever o ato de curvar-se reverentemente diante de um superior, tanto em contexto régio como religioso. Alguns também traduzem: «adore-o».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: E ... desejará
  rationale: O hitpael imperfeito de אוה, com conjunção prefixada, é aqui vertido como futuro simples, em conformidade com a leitura contextual mais provável, embora a forma poética também possa admitir valor volitivo.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Substantivo definido, traduzido diretamente.
- source_word: יָפְיֵךְ
  choice: a sua beleza
  rationale: O substantivo com sufixo de segunda pessoa feminina singular denota a beleza ou formosura da mulher interpelada; «a sua beleza» é direto e natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação ou exortação, mantendo a conexão causal e o tom poético.
- source_word: הוּא
  choice: ele
  rationale: Mantém o pronome independente e sua ênfase explícita.
- source_word: אֲדֹנַיִךְ
  choice: o seu senhor
  rationale: Título relacional do rei ou marido, sem tratar a palavra como nome divino. «Senhor», em minúscula, conserva dignidade sem a dureza possível de «mestre».
- source_word: וְהִשְׁתַּחֲוִי
  choice: curve-se diante
  rationale: O imperativo de שׁחה descreve o ato de inclinar-se ou prostrar-se em reverência. A formulação preserva o gesto sem determinar se a homenagem é régia ou religiosa.
- source_word: לוֹ
  choice: dele
  rationale: A preposição com sufixo masculino singular é expressa idiomaticamente em «diante dele».
theological_decisions:
- issue: Se וְהִשְׁתַּחֲוִי לוֹ deve ser traduzido com linguagem explicitamente religiosa
  choice: curve-se diante dele
  alternative: preste-lhe homenagem; adore-o
  rationale: O verbo pode indicar prostração perante Deus ou perante um superior humano. Como o salmo retrata um casamento régio, a tradução principal conserva a ação de reverência sem decidir se ela é apenas cortesã ou também cultual.
- issue: Valor modal de וְיִתְאָו
  choice: o rei desejará
  alternative: que o rei deseje; e que o rei deseje
  rationale: A forma imperfeita pode ser entendida como futuro indicativo ou receber, no encadeamento poético, força volitiva. O texto principal adota o futuro simples, mas a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «sua/seu» para a mulher diretamente interpelada e evita linguagem religiosa mais específica do que o hebraico exige.
