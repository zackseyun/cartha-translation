  text: חֲגֽוֹר חַרְבְּ/ךָ֣ עַל יָרֵ֣ךְ גִּבּ֑וֹר ה֝וֹדְ/ךָ֗ וַ/הֲדָרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/003.yaml
  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: pt
  text: Prenda sua espada à coxa[a], ó guerreiro valente, em seu esplendor e sua majestade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cinja sua espada sobre a coxa”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “seu esplendor e sua majestade”, sem uma preposição correspondente a “em”; a expressão também pode ser entendida de forma apositiva ou elíptica.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: Prenda
  rationale: O imperativo de חגר significa cingir ou afixar algo ao corpo. “Prenda” comunica em português atual a ação concreta de colocar a espada, sem recorrer a uma paráfrase vaga.
- source_word: חַרְבְּךָ
  choice: sua espada
  rationale: Reproduz diretamente o substantivo com sufixo de segunda pessoa masculina singular.
- source_word: עַל יָרֵךְ
  choice: à coxa
  rationale: 'Preserva a imagem espacial concreta do hebraico: a espada é afixada junto à coxa. É mais exato que a opção mais genérica “ao lado do corpo”.'
- source_word: גִּבּוֹר
  choice: ó guerreiro valente
  rationale: O termo está em vocativo e, no contexto marcial, designa alguém poderoso e hábil na guerra. A formulação explicita naturalmente esse sentido em português.
- source_word: הוֹדְךָ
  choice: seu esplendor
  rationale: הוֹד expressa esplendor, glória ou majestade em contexto régio; “esplendor” preserva a magnificência poética e distingue o termo do substantivo seguinte.
- source_word: וַהֲדָרֶךָ
  choice: e sua majestade
  rationale: הדר pode denotar majestade, imponência ou beleza. “Majestade” mantém o tom régio elevado e o paralelismo com “esplendor”.
theological_decisions:
- issue: Identidade régia ou messiânica do destinatário no Salmo 45
  choice: Traduzir o versículo como discurso direto a um guerreiro régio, sem explicitar uma identificação messiânica.
  alternative: Inserir na tradução uma identificação direta do guerreiro com o Messias.
  rationale: O versículo hebraico apresenta imediatamente uma figura régia e guerreira, mas não a chama de Messias. A redação preserva esse sentido textual e deixa a leitura messiânica ou tipológica para o contexto canônico e a interpretação.
- issue: Relação sintática de הוֹדְךָ וַהֲדָרֶךָ com a ordem anterior
  choice: Empregar “com seu esplendor e sua majestade”, ligando as qualidades ao guerreiro no cumprimento da ordem.
  alternative: 'Tratar os substantivos de modo estritamente apositivo ou como objetos adicionais do imperativo: “seu esplendor e sua majestade”.'
  rationale: O hebraico poético é conciso e não traz uma preposição equivalente a “com”. A solução adotada produz português natural sem eliminar a possibilidade formal, registrada em nota, de uma construção apositiva ou elíptica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Prenda” evita o caráter mais arcaico de “cinga” no texto principal, enquanto “ó guerreiro valente” conserva o vocativo e o tom marcial da poesia régia.
