lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: toda gloriosa
  rationale: Entende כָּל em função intensiva e כְּבוּדָּה como expressão de esplendor. A formulação conserva o caráter poético e predicativo do hebraico.
- source_word: בַת מֶלֶךְ
  choice: a filha do rei
  rationale: Reproduz de modo transparente a expressão hebraica e preserva o cenário régio; “a princesa” seria possível, mas menos próximo da forma da fonte.
- source_word: פְּנִימָה
  choice: no interior
  rationale: Mantém, tanto quanto possível, a abertura do advérbio hebraico entre uma localização interna e uma possível referência à dimensão interior da princesa, sem acrescentar “palácio” ou “aposento” ao texto.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: entretecida de ouro
  rationale: Expressa trabalho artesanal integrado à veste, apropriado ao contexto têxtil, sem restringir o termo a joias engastadas; outras possibilidades são registradas em nota.
- source_word: לְבוּשָׁהּ
  choice: sua veste
  rationale: Termo natural, digno e adequado à poesia régia, sem especificar indevidamente um tipo exato de traje.
theological_decisions:
- issue: Possível sentido exterior ou interior de פְּנִימָה
  choice: Conservar “no interior” no texto e explicitar a ambiguidade em nota.
  alternative: “Dentro do palácio/aposento” ou “interiormente”.
  rationale: O hebraico não identifica expressamente um palácio nem obriga a uma leitura sobre beleza moral interior; a tradução evita resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, poético e acessível, com construção digna e próxima da concisão hebraica. Evita acrescentar “palácio” ao texto principal e usa “veste” por adequação ao cenário régio.
