translation:
  language: pt
  text: Toda gloriosa está a filha do rei lá dentro[a]; sua veste é entretecida de ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “A filha do rei é toda gloriosa por dentro”. “Lá dentro” também pode indicar que ela está dentro do palácio ou de um aposento.'
