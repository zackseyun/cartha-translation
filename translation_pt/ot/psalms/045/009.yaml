  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: pt
  text: Filhas de reis estão entre as tuas mulheres ilustres[a]; à tua direita está a rainha, adornada com ouro de Ofir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entre as tuas mulheres preciosas» ou «entre as tuas damas nobres». A expressão hebraica é difícil.
    reason: lexical_alternative
  - marker: b
    text: O «ouro de Ofir» era ouro fino associado a Ofir, lugar conhecido no Antigo Testamento por sua riqueza e seu ouro.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Filhas de reis
  rationale: Tradução direta da construção hebraica, preservando a imagem e o paralelismo; «princesas» seria possível, mas menos transparente.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: entre as tuas mulheres ilustres
  rationale: A expressão é difícil. Derivada de יקר, pode indicar pessoas preciosas, honradas ou nobres ligadas ao destinatário; o contexto imediato de mulheres da corte favorece esta formulação, sem ocultar as alternativas em nota.
- source_word: נִצְּבָה
  choice: está
  rationale: O verbo descreve a posição assumida pela rainha na cena. «Está» produz português natural, enquanto a noção específica de posição é preservada por «à tua direita».
- source_word: שֵׁגַל
  choice: a rainha
  rationale: O substantivo designa a consorte real. «Rainha» é o equivalente corrente e adequado ao contexto nupcial régio.
- source_word: לִימִינְךָ
  choice: à tua direita
  rationale: Expressão portuguesa natural que preserva a posição de honra na cena da corte.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: adornada com ouro de Ofir
  rationale: כֶּתֶם indica ouro fino, e Ofir identifica sua procedência célebre. «Adornada com» torna explícito o sentido contextual da preposição sem especificar indevidamente uma peça de roupa.
