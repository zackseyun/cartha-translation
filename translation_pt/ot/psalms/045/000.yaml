base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: pt
  text: 'Ao mestre de música: segundo “Lírios”[a]. Dos filhos de Corá. Um maskil[b]. Um cântico de amores[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz Shoshannim, literalmente “Lírios”; provavelmente é o nome de uma melodia ou de uma indicação musical.
    reason: lexical_alternative
  - marker: b
    text: Maskil é um termo técnico dos títulos dos salmos; talvez designe uma composição contemplativa ou instrutiva.
    reason: lexical_alternative
  - marker: c
    text: Ou “um cântico de amor”. O hebraico traz literalmente “um cântico de amores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: Nos títulos dos salmos, o termo designa o responsável pela execução musical. A formulação é clara em português moderno sem limitar a função especificamente à regência de um coro.
- source_word: עַל
  choice: segundo
  rationale: Em títulos musicais, a preposição pode introduzir uma melodia, estilo ou indicação de execução. “Segundo” preserva essa abertura sem definir em excesso a relação técnica.
- source_word: שֹׁשַׁנִּים
  choice: “Lírios”
  rationale: O substantivo significa literalmente “lírios”, mas aqui provavelmente funciona como nome de uma melodia ou indicação musical. As aspas sinalizam esse uso técnico provável.
- source_word: לִבְנֵי קֹרַח
  choice: Dos filhos de Corá
  rationale: A preposição hebraica pode indicar autoria, associação ou dedicação. “Dos filhos de Corá” mantém a formulação tradicional e evita decidir entre essas possibilidades.
- source_word: מַשְׂכִּיל
  choice: Um maskil
  rationale: Trata-se de um termo técnico dos títulos dos salmos cujo sentido exato é incerto. A transliteração evita a precisão indevida de traduções como “instrutivo” ou “contemplativo”.
- source_word: שִׁיר
  choice: Um cântico
  rationale: Tradução natural do rótulo de gênero, apropriada ao registro poético e litúrgico do título.
- source_word: יְדִידֹת
  choice: de amores
  rationale: O plural hebraico é incomum. A tradução formal “de amores” conserva o número e a ambiguidade poética, em vez de reduzi-lo ao mais interpretativo “cântico de amor”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O título conserva a estrutura segmentada do hebraico e mantém transliterado o termo técnico incerto “maskil”. As aspas em “Lírios” indicam que provavelmente se trata de uma designação musical.
