  text: וּ/בַֽת צֹ֨ר בְּ֭/מִנְחָה פָּנַ֥יִ/ךְ יְחַלּ֗וּ עֲשִׁ֣ירֵי עָֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: pt
  text: E a filha de Tiro virá com um presente[a]; os ricos do povo buscarão o seu favor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma oferta” ou “trazendo tributo”; o hebraico מִנְחָה pode indicar presente, tributo ou oferta, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seu rosto”. A expressão idiomática hebraica significa buscar o favor de alguém ou suplicar-lhe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: E a filha de Tiro
  rationale: A conjunção dá continuidade ao contexto. A expressão hebraica “filha de Tiro” personifica a cidade ou o seu povo e é preservada em português.
- source_word: בְּמִנְחָה
  choice: com um presente
  rationale: מִנְחָה pode designar presente, tributo ou oferta. No contexto régio, “presente” é natural e evita restringir o termo a um sentido cultual.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: buscarão o seu favor
  rationale: Embora פָּנַיִךְ signifique literalmente “seu rosto”, a construção idiomática com o piel de חלה expressa a ideia de suplicar ou procurar obter o favor de alguém. O feminino singular do destinatário é compatível com “seu” em português.
- source_word: עֲשִׁירֵי עָם
  choice: os ricos do povo
  rationale: A expressão construta indica os ricos ou abastados de um povo. A formulação conserva a concisão e a possível referência coletiva sem especificar uma etnia não explicitada.
