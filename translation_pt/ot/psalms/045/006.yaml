  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: pt
  text: O teu trono[a], ó Deus, é para todo o sempre; o cetro do teu reino é um cetro de retidão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O teu trono é Deus para todo o sempre»; ou: «O teu trono divino é para todo o sempre». A sintaxe hebraica é debatida; o texto principal segue a leitura vocativa.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, conservando a ordem das expressões no hebraico: «Um cetro de retidão é o cetro do teu reino».'
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: o teu trono
  rationale: כִּסֵּא designa o trono ou assento régio; neste salmo real, «trono» é a equivalência natural e precisa.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A leitura principal entende אֱלֹהִים como vocativo. Ela se ajusta ao discurso direto do salmo e preserva a força teológica do hebraico, enquanto outras análises sintáticas são registradas em nota.
- source_word: עוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão hebraica intensifica a ideia de duração perpétua; «para todo o sempre» é corrente, digna e preserva essa ênfase.
- source_word: שֵׁבֶט
  choice: cetro
  rationale: No contexto régio, שֵׁבֶט é o emblema da autoridade do governante, não uma vara ou um cajado genérico.
- source_word: מִישֹׁר
  choice: retidão
  rationale: מִישֹׁר comunica a ideia ética de justeza e integridade. «Retidão» conserva essa amplitude sem restringir o termo à esfera judicial.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: o cetro do teu reino
  rationale: A formulação preserva a relação construta do hebraico e sua imagem régia, em português natural.
theological_decisions:
- issue: Força sintática e teológica de אֱלֹהִים no primeiro hemistíquio
  choice: 'Vocativo: «O teu trono, ó Deus, permanece para todo o sempre»'
  alternative: 'Predicativo: «O teu trono é Deus para todo o sempre»; ou leitura qualitativa: «O teu trono divino permanece para todo o sempre»'
  rationale: A leitura vocativa é natural no contexto, corresponde a uma recepção antiga importante e preserva a tensão teológica do texto. Como a sintaxe hebraica é debatida, as alternativas plausíveis são mantidas em nota, sem serem apagadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a imagem poética régia e usa «tu» em consonância com o tratamento direto e solene do verso. «Permanece» explicita naturalmente a cópula ausente na oração nominal hebraica.
