base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: pt
  text: Em tua majestade, avança triunfante, cavalgando pela causa da verdade, da mansidão e da justiça.[a] Tua mão direita te ensinará coisas assombrosas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto à expressão compacta em hebraico: «pela causa da verdade e da justiça humilde» ou «da humildade da justiça».'
    reason: alternativa sintática
  - marker: b
    text: 'Ou: «e que tua mão direita te ensine coisas temíveis». O verbo pode ser entendido como declaração ou como continuação das ordens anteriores; «assombrosas» também pode ser traduzido por «temíveis» ou «inspiradoras de temor».'
    reason: alternativa gramatical e lexical
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: Em tua majestade
  rationale: הָדָר expressa majestade, esplendor ou honra. A formulação adverbial liga naturalmente a majestade do rei às ordens seguintes.
- source_word: צְלַח רְכַב
  choice: avança triunfante, montado
  rationale: A combinação dos imperativos reúne a ideia de avançar com êxito e a ação concreta de cavalgar. Esta formulação conserva ambos os componentes sem transformar צלח apenas em uma descrição do modo de cavalgar.
- source_word: עַל דְּבַר אֱמֶת
  choice: pela causa da verdade
  rationale: דְּבַר pode indicar palavra, assunto ou causa; neste contexto régio e marcial, a expressão sugere atuação em favor da verdade.
- source_word: וְעַנְוָה צֶדֶק
  choice: da mansidão e da justiça
  rationale: A sequência hebraica é compacta e admite mais de uma análise. A coordenação respeita os dois termos distintos e evita resolver a expressão como se a justiça fosse necessariamente qualificada pela mansidão.
- source_word: וְתוֹרְךָ
  choice: e ... te ensinará
  rationale: A forma verbal é morfologicamente indicativa, com יְמִינֶךָ, substantivo feminino em hebraico, como sujeito posposto. Por isso, o futuro 'ensinará' representa a forma mais diretamente do que uma construção volitiva.
- source_word: נוֹרָאוֹת
  choice: feitos temíveis
  rationale: O termo designa coisas ou atos que despertam temor e assombro. 'Temíveis' preserva essa força, enquanto 'feitos' explicita naturalmente a ação vitoriosa implícita no contexto.
- source_word: יְמִינֶךָ
  choice: tua mão direita
  rationale: Mantém literalmente a imagem poética tradicional de poder, destreza e ação vitoriosa.
theological_decisions:
- issue: Imagem do rei guerreiro em um salmo posteriormente lido de modo messiânico
  choice: Manter a interpelação régia imediata, sem inserir uma identificação messiânica explícita.
  alternative: Redigir o versículo de modo a tornar explícito um referente messiânico.
  rationale: O texto hebraico dirige-se poeticamente ao rei. A tradução deve conservar esse sentido histórico-literário e deixar que as leituras canônicas surjam do contexto mais amplo, não de acréscimos ao versículo.
- issue: Relação sintática entre עַנְוָה e צֶדֶק
  choice: 'Traduzir como termos coordenados: ''mansidão e justiça''.'
  alternative: Traduzir como 'justiça humilde' ou 'humildade da justiça'.
  rationale: A construção é concisa e ambígua. A coordenação preserva os dois conceitos sem impor uma relação qualificativa que o hebraico não torna inequívoca.
- issue: Modalidade de וְתוֹרְךָ
  choice: Usar a declaração 'tua mão direita te ensinará'.
  alternative: Usar a forma volitiva 'que tua mão direita te ensine'.
  rationale: A morfologia favorece uma forma verbal indicativa. A alternativa volitiva é contextualmente possível, mas não precisa ser imposta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e o uso de 'tua' preservam o tom poético sem arcaísmo excessivo. O marcador [a] aparece no texto principal junto à oração que a nota esclarece.
