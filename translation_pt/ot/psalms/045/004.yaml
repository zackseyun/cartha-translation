revisions:
- from: Em tua majestade, avança triunfante, montado, pela causa da verdade, da mansidão e da justiça; e tua mão direita te ensinará feitos temíveis.[a]
  to: Em tua majestade, avança triunfante, cavalgando pela causa da verdade, da mansidão e da justiça.[a] Tua mão direita te ensinará coisas assombrosas.[b]
  rationale: A revisão substitui o particípio pouco natural «montado» por «cavalgando», que representa claramente a ação expressa pelo imperativo רְכַב em ligação com «avança triunfante». Também torna נוֹרָאוֹת mais aberto com «coisas assombrosas» e acrescenta uma nota para a sintaxe disputada de «mansidão e justiça». A mudança de pontuação antes da oração final deixa mais clara a mudança para a declaração sobre a mão direita, sem eliminar a alternativa volitiva na nota.
  reviewer_model: gpt-5.6-terra
