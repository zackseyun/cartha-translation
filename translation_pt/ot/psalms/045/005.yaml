  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: pt
  text: Tuas flechas são afiadas[a]; povos caem debaixo de ti; elas estão no coração dos inimigos do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Tuas flechas são afiadas — povos caem debaixo de ti — no coração dos inimigos do rei”. O hebraico é muito condensado e poético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: tuas flechas
  rationale: O plural com sufixo de segunda pessoa masculina singular significa diretamente “tuas flechas”; “flechas” é a equivalência portuguesa natural.
- source_word: שְׁנוּנִים
  choice: são afiadas
  rationale: O adjetivo ou particípio passivo comunica que as flechas são afiadas; a construção predicativa é clara e idiomática em português.
- source_word: עַמִּים
  choice: povos
  rationale: Preserva o plural de עַם e a referência a múltiplos grupos humanos, sem restringir o sentido a Estados nacionais.
- source_word: תַּחְתֶּיךָ
  choice: debaixo de ti
  rationale: Reproduz o sentido espacial e marcial de “sob/debaixo de ti” em linguagem comum e digna.
- source_word: יִפְּלוּ
  choice: caem
  rationale: O imperfeito hebraico admite leitura futura ou presente vívida; “caem” mantém a vivacidade poética do quadro.
- source_word: בְּלֵב
  choice: estão no coração
  rationale: Mantém a expressão hebraica comprimida “no coração”, suprindo apenas a cópula necessária em português e evitando acrescentar explicitamente o verbo interpretativo “traspassar”.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: dos inimigos do rei
  rationale: Conserva literalmente a cadeia construta “inimigos do rei”, sem harmonizá-la com a segunda pessoa como “teus inimigos”.
theological_decisions:
- issue: Referente de “o rei” em um salmo real e potencialmente messiânico
  choice: Manter “o rei” no texto imediato
  alternative: Explicitar uma identificação messiânica ou substituir por “teus inimigos”
  rationale: O hebraico diz “o rei”. A tradução preserva a formulação histórico-poética e deixa a leitura tipológica ou messiânica para a interpretação, sem resolver no texto uma tensão teológica legítima.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O uso de “tuas/ti” sustenta o tom poético e régio. A sintaxe principal torna explícita a relação provável das flechas com o coração dos inimigos, enquanto a nota preserva a estrutura hebraica altamente elíptica.
