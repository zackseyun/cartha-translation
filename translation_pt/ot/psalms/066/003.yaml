base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: pt
  text: 'Digam a Deus: “Como são temíveis as tuas obras! Por causa da grandeza da tua força, os teus inimigos te fingem submissão.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus inimigos se submetem a ti” ou “se encolhem diante de ti”. O verbo hebraico pode indicar submissão fingida ou forçada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Digam
  rationale: Imperativo qal no plural, dirigido à comunidade reunida; “Digam” é direto, natural e preserva o número plural.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição לְ indica o destinatário das palavras.
- source_word: מַה נּוֹרָא
  choice: Como são assombrosas
  rationale: A construção exclamativa expressa espanto reverente; “assombrosas” conserva tanto a admiração quanto a dimensão de temor de נוֹרָא.
- source_word: מַעֲשֶׂיךָ
  choice: as tuas obras
  rationale: מַעֲשֶׂה designa obras ou feitos; “obras” é claro e apropriado ao registro de louvor do salmo.
- source_word: בְּרֹב עֻזֶּךָ
  choice: Por causa da grandeza da tua força
  rationale: בְּ pode indicar aqui causa ou fundamento; רֹב comunica grandeza ou abundância, e עֹז, força ou poder.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: se submetem a ti, ainda que fingidamente
  rationale: O piel de כחש com לְ pode descrever submissão forçada, relutante ou fingida. A formulação explicita a submissão sem apresentá-la como devoção sincera.
- source_word: אֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Equivalência direta do substantivo plural com sufixo de segunda pessoa masculina singular.
theological_decisions:
- issue: Natureza da resposta dos inimigos a Deus
  choice: Submissão provocada pelo poder divino, mas não necessariamente sincera
  alternative: Submissão geral, sem qualquer indicação de fingimento ou relutância
  rationale: O verbo כחש pode envolver negação, falsidade ou obediência fingida. A tradução mantém a tensão entre sujeição exterior e disposição interior, sem transformar essa leitura em uma afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Assombrosas” preserva o componente de admiração e temor; a nota conserva a amplitude semântica do verbo que descreve a reação dos inimigos.
