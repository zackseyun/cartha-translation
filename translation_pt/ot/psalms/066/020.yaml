  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: pt
  text: Bendito seja Deus,[a] que não rejeitou a minha oração nem afastou de mim o seu amor leal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “que não retirou de mim a minha oração e o seu amor leal”. O hebraico emprega um só verbo para os dois objetos. “Amor leal” também pode ser traduzido por “amor constante”, “fidelidade à aliança” ou “misericórdia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo funciona aqui como fórmula exclamativa de louvor; “Bendito seja” é natural, digno e preserva o caráter doxológico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O substantivo designa o Deus de Israel, a quem o salmista louva diretamente.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa que declara o motivo do louvor.
- source_word: לֹא הֵסִיר
  choice: não rejeitou ... nem afastou
  rationale: 'O hifil de סור significa retirar ou desviar. Em português, a repetição semântica por dois verbos torna naturais os dois objetos: Deus não recusou a oração e não retirou do salmista o seu amor.'
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: Tradução direta do substantivo que indica oração ou súplica dirigida a Deus.
- source_word: וְחַסְדּוֹ
  choice: nem ... o seu amor leal
  rationale: Depois da negação, וְ é expresso naturalmente por “nem”. חֶסֶד reúne amor, lealdade e fidelidade duradoura; “amor leal” conserva essa amplitude de modo conciso.
- source_word: מֵאִתִּי
  choice: de mim
  rationale: Indica separação em relação ao salmista e se liga naturalmente a “afastou”.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: o seu amor leal
  alternative: a sua fidelidade à aliança; o seu amor constante; a sua misericórdia
  rationale: “Amor leal” preserva tanto o aspecto afetivo quanto a fidelidade firme de Deus, sem restringir o termo apenas à misericórdia nem explicitar “aliança” onde ela não é mencionada no verso.
- issue: Relação entre a oração e o amor de Deus sob a mesma negação
  choice: não rejeitou a minha oração nem afastou de mim o seu amor leal
  alternative: não retirou de mim a minha oração e o seu amor leal
  rationale: A construção hebraica coordena os dois objetos de הֵסִיר, mas uma reprodução rígida seria pouco natural e poderia sugerir que Deus tiraria do salmista sua capacidade de orar. A formulação escolhida conserva a dupla negação e o sentido relacional sem eliminar a tensão sintática do original, documentada em nota.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O tom permanece reverente e poético. A ordem foi levemente ajustada para evitar ambiguidade sintática indevida, enquanto a nota registra a forma mais literal e a amplitude de חֶסֶד.
