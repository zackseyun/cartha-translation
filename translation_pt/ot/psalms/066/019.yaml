  text: אָ֭כֵן שָׁמַ֣ע אֱלֹהִ֑ים הִ֝קְשִׁ֗יב בְּ/ק֣וֹל תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/019.yaml
  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: pt
  text: De fato, Deus ouviu; prestou atenção à voz da minha oração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: De fato
  rationale: Expressa a afirmação enfática e confirmatória do hebraico em português natural e digno.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O perfeito hebraico apresenta a ação como realizada; o pretérito perfeito é a forma natural em português neste testemunho.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo no singular e o contexto indicam referência ao único Deus.
- source_word: הִקְשִׁיב
  choice: prestou atenção
  rationale: O hifil de קשׁב comunica escuta atenta e deliberada; esta expressão preserva essa nuance melhor que uma simples repetição de 'ouviu'.
- source_word: בְּקוֹל
  choice: à voz de
  rationale: A construção significa escutar ou dar atenção à voz; 'à voz da minha oração' mantém a imagem concreta do hebraico e continua compreensível em português.
- source_word: תְּפִלָּתִי
  choice: minha oração
  rationale: Tradução direta do substantivo com sufixo possessivo de primeira pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e reverente, com leve elevação poética própria dos Salmos. A repetição semântica entre 'ouviu' e 'prestou atenção' preserva o paralelismo hebraico, enquanto 'voz da minha oração' conserva sua imagem concreta.
