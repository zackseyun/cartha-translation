  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: pt
  text: Ao regente[a]. Cântico, salmo. Aclame a Deus[b] toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao diretor de música” ou “Ao mestre do coro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Toda a terra dê um brado a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: O termo indica quem dirige ou supervisiona a execução musical. “Ao regente” é conciso, atual e mantém a possível função litúrgico-musical sem especificar necessariamente um coral.
- source_word: שִׁיר מִזְמוֹר
  choice: Cântico, salmo
  rationale: Mantém os dois rótulos de gênero presentes no hebraico, sem fundi-los.
- source_word: הָרִיעוּ
  choice: Aclamem
  rationale: O imperativo designa a emissão de um brado forte, frequentemente festivo ou triunfal. “Aclamem” comunica louvor público e sonoro sem acrescentar explicitamente “com alegria” ao texto principal.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição assinala Deus como destinatário da aclamação.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Em português, a metonímia hebraica que convoca “toda a terra” pode soar como se o solo fosse o interlocutor. A explicitação dos habitantes comunica naturalmente o alcance universal do chamado, preservando a alternativa mais formal em nota.
theological_decisions:
- issue: Alcance de כָּל הָאָרֶץ
  choice: chamado universal a todos os habitantes da terra
  alternative: toda a terra ou toda a região
  rationale: O contexto de louvor favorece um chamado universal, mas a nota preserva a forma mais literal e a amplitude semântica de אֶרֶץ.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A rubrica é mantida concisa; a ordem do hebraico e os dois termos de gênero são preservados. As notas registram alternativas formais e lexicais genuínas.
