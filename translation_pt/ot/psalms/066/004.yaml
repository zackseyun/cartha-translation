  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: pt
  text: Toda a terra se prostrará diante de ti[a] e cantará louvores a ti; cantará louvores ao teu nome. Selá[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “te adorará”. O verbo hebraico pode indicar a prostração como ato de adoração.
    reason: lexical_alternative
  - marker: b
    text: “Selá” é provavelmente uma indicação musical ou litúrgica; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Toda a terra
  rationale: Expressa naturalmente a abrangência universal do hebraico; “terra” se ajusta melhor ao alcance do salmo do que “país” ou “território”.
- source_word: יִשְׁתַּחֲווּ
  choice: se prostrará diante de
  rationale: Preserva a imagem concreta de inclinar-se ou prostrar-se perante Deus, deixando evidente no contexto seu sentido de adoração sem substituí-lo por um termo abstrato.
- source_word: לְךָ
  choice: diante de ti / a ti
  rationale: Com “prostrar-se”, o português idiomático pede “diante de”; com “cantar louvores”, “a ti” representa naturalmente a direção indicada pela preposição hebraica.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: cantará louvores / cantará louvores
  rationale: Comunica o canto de louvor próprio de זמר e conserva a repetição enfática do original.
- source_word: שִׁמְךָ
  choice: teu nome
  rationale: Mantém a expressão bíblica direta e teologicamente significativa, sem reduzi-la a uma paráfrase como “tua fama”.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo hebraico cuja função exata permanece incerta, evitando uma interpretação especulativa.
theological_decisions:
- issue: Se יִשְׁתַּחֲווּ deve ser vertido por um termo explicitamente cúltico ou pela ação corporal
  choice: se prostrará diante de ti
  alternative: te adorará
  rationale: A forma escolhida preserva a ação corporal presente no verbo hebraico e, no contexto dirigido a Deus, mantém sua dimensão de adoração sem resolver a imagem em abstração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular coletivo “Toda a terra” rege naturalmente os verbos no singular. A ordem e a repetição poética do hebraico foram preservadas.
