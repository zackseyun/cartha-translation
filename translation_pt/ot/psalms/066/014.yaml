  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: pt
  text: que meus lábios proferiram e minha boca pronunciou quando eu estava em aflição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que meus lábios abriram”. No hebraico, a expressão significa falar ou proferir palavras.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz a oração relativa que retoma os votos do versículo anterior, preservando a ligação sintática de modo natural em português.
- source_word: פָּצוּ
  choice: proferiram
  rationale: Embora o verbo signifique literalmente “abriram”, a expressão com “lábios” é idiomática e indica o ato de falar; “proferiram” comunica esse sentido e mantém o tom poético.
- source_word: שְׂפָתַי
  choice: meus lábios
  rationale: Mantém a imagem corporal do hebraico e o paralelismo poético com “minha boca”.
- source_word: וְדִבֶּר
  choice: e ... pronunciou
  rationale: Expressa o sentido comum de “falar” e forma um paralelismo natural com “proferiram”, sem apagar a repetição poética do original.
- source_word: פִּי
  choice: minha boca
  rationale: Tradução direta que preserva o paralelismo sinônimo “meus lábios / minha boca”.
- source_word: בַּצַּר לִי
  choice: quando eu estava em aflição
  rationale: Traduz naturalmente a circunstância temporal e pessoal de aperto ou sofrimento expressa pela frase hebraica.
