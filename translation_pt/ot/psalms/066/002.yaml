  text: זַמְּר֥וּ כְבֽוֹד שְׁמ֑/וֹ שִׂ֥ימוּ כָ֝ב֗וֹד תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/002.yaml
  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: pt
  text: Cantem a glória do seu nome; tornem glorioso o seu louvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “ponham glória [em] seu louvor”. A construção hebraica é idiomática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Cantem
  rationale: O imperativo plural de זמר convoca a comunidade a louvar por meio do canto. “Cantem” é direto, natural e evita acrescentar “louvores” antes dos complementos já expressos no verso.
- source_word: כְבוֹד שְׁמוֹ
  choice: a glória do seu nome
  rationale: A construção nominal foi preservada para manter a ênfase na glória ou honra ligada ao nome de Deus, em vez de reduzi-la ao adjetivo “glorioso”.
- source_word: שִׂימוּ כָבוֹד
  choice: tornem glorioso
  rationale: שׂימוּ significa literalmente “ponham” ou “estabeleçam”, seguido do substantivo “glória”. Em português corrente, “tornem glorioso” comunica de modo natural a força do idioma hebraico sem perder sua relação explícita com a glória.
- source_word: תְּהִלָּתוֹ
  choice: o seu louvor
  rationale: A tradução conserva o substantivo “louvor” e o sufixo de terceira pessoa masculina. No contexto, pode designar tanto o louvor dirigido a Deus quanto o louvor que lhe pertence; a formulação portuguesa mantém essa amplitude.
theological_decisions:
- issue: Sentido de “seu louvor”
  choice: Preservar a expressão possessiva “o seu louvor”
  alternative: “o louvor dado a ele” ou “sua fama”
  rationale: O sufixo hebraico não obriga a escolher entre o louvor dirigido a Deus, o louvor que lhe pertence e sua reputação louvável. A tradução evita resolver essa tensão de forma denominacional ou excessivamente interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Seu” retoma Deus no contexto do salmo. A repetição conceitual de “glória” e “glorioso” reflete deliberadamente a repetição de כבוד no hebraico.
