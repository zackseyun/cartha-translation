base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: pt
  text: 'A ele clamei com a minha boca,

    e o louvor[a] estava debaixo da minha língua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a exaltação”. O substantivo hebraico também pode referir-se ao louvor expresso em palavras.'
    reason: Alternativa lexical para וְרוֹמַם.
lexical_decisions:
- source_word: אֵלָיו
  choice: A ele
  rationale: Preserva o pronome masculino singular do hebraico; o referente é Deus no contexto, sem substituir o pronome pelo nome divino.
- source_word: פִּי
  choice: com a minha boca
  rationale: Mantém a imagem concreta e a construção instrumental do hebraico, naturais também em português.
- source_word: קָרָאתִי
  choice: clamei
  rationale: Em contexto de oração, קרא expressa chamar em voz alta ou clamar; “clamei” comunica a intensidade sem ampliar indevidamente o sentido.
- source_word: וְרוֹמַם
  choice: e o louvor
  rationale: A forma massorética pode ser entendida como substantivo ligado à ideia de exaltação; “louvor” exprime com naturalidade a exaltação verbal de Deus neste contexto.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Reproduz o sentido espacial de “sob/debaixo de” e conserva a imagem poética de algo pronto para ser pronunciado.
- source_word: לְשׁוֹנִי
  choice: minha língua
  rationale: Mantém a referência corporal literal e o paralelismo poético com “minha boca”.
theological_decisions:
- issue: Valor gramatical de וְרוֹמַם
  choice: 'Substantivo: “o louvor”'
  alternative: 'Forma verbal: “ele foi exaltado pela minha língua”'
  rationale: A vocalização massorética favorece a leitura nominal “exaltação/louvor”, mas a forma admite uma interpretação verbal tradicional. A tradução principal segue a leitura nominal sem ocultar a alternativa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil. Conserva as imagens hebraicas de “boca”, “debaixo” e “língua”, bem como a estrutura paralela do verso.
