  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: pt
  text: 'Ao regente[a]. Cântico. Salmo.


    Toda a terra, aclamem a Deus![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao diretor de música” ou “Ao mestre do coro”.'
