  - marker: b
    text: 'Ou: “Deem um brado a Deus, toda a terra!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ (lamnatseach)
  choice: Ao regente
  rationale: Traduz a designação musical de modo conciso e digno, preservando em nota as alternativas possíveis para a função.
- source_word: שִׁיר מִזְמוֹר (shir mizmor)
  choice: Cântico. Salmo.
  rationale: Mantém os dois termos do cabeçalho e sua forma justaposta, sem fundi-los numa única classificação.
- source_word: הָרִיעוּ (hari'u)
  choice: Aclamem
  rationale: O imperativo pode indicar levantar um brado ou aclamar. “Aclamem” transmite a força pública e jubilosa do verbo sem exigir uma formulação pouco natural.
- source_word: כָּל־הָאָרֶץ (kol-ha'arets)
  choice: todos os habitantes da terra
  rationale: Explicita em português o sentido coletivo do chamado dirigido à terra, além de permitir concordância natural com o imperativo plural; a expressão mais literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com cabeçalho conciso. “Aclamem” evita linguagem arcaica e conserva a intensidade do chamado coletivo; a nota registra a imagem hebraica mais literal.
