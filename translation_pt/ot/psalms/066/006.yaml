id: PSA.66.6
reference: Psalms 66:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: pt
  text: Transformou o mar em terra seca; atravessaram o rio a pé[b]; ali nos alegramos nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ali, alegremo-nos nele”. A forma hebraica também pode ser entendida como uma exortação, em vez de uma declaração retrospectiva.'
    reason: alternative_reading
  - marker: b
    text: O versículo provavelmente recorda tanto a travessia do mar no êxodo como a travessia do rio Jordão na entrada na terra.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: transformou
  rationale: Expressa de modo natural a mudança concreta do mar em terreno seco, sem acrescentar detalhes ao verbo hebraico.
- source_word: יָם
  choice: o mar
  rationale: Mantém o sentido lexical amplo e permite a evocação da travessia do mar sem especificar no texto qual mar era.
- source_word: לְיַבָּשָׁה
  choice: em terra seca
  rationale: Reproduz a mudança de estado indicada pela preposição e pelo substantivo hebraico, em formulação corrente em português.
- source_word: בַּנָּהָר
  choice: o rio
  rationale: Com o verbo 'atravessar', o objeto direto é a forma idiomática de exprimir em português a passagem pelo rio; o texto não identifica explicitamente o rio.
- source_word: יַעַבְרוּ
  choice: atravessaram
  rationale: Comunica claramente o movimento de passar de um lado para o outro e se ajusta à provável recordação histórica, embora a forma hebraica seja imperfeita.
- source_word: בְרָגֶל
  choice: a pé
  rationale: Equivalente português direto e idiomático, indicando que a passagem foi feita caminhando.
- source_word: שָׁם
  choice: ali
  rationale: Preserva a referência espacial, que pode apontar para o lugar da ação salvadora ou, de maneira mais ampla, para aquele acontecimento.
- source_word: נִשְׂמְחָה
  choice: nos alegramos
  rationale: Adota a leitura retrospectiva coerente com a recordação dos atos de Deus e com a identificação comunitária dos adoradores; a possível força exortativa é preservada em nota.
- source_word: בּוֹ
  choice: nele
  rationale: Mantém o pronome masculino singular e sua forma concisa. No contexto, o referente mais provável é Deus, sem substituí-lo explicitamente pelo nome.
theological_decisions:
- issue: Alusão histórica e identificação comunitária
  choice: A redação recorda as travessias do mar e do rio e apresenta a comunidade adoradora como participante solidária da alegria de Israel.
  alternative: 'A frase final pode ser entendida como exortação presente: “ali, alegremo-nos nele”.'
  rationale: A leitura retrospectiva combina com os atos salvadores narrados, mas a morfologia de נִשְׂמְחָה admite valor volitivo; por isso, a alternativa é mantida em nota, sem eliminar a tensão.
- issue: Referente do pronome בּוֹ
  choice: “nele”, entendido mais provavelmente como referência a Deus.
  alternative: O pronome poderia ser relacionado ao lugar ou acontecimento mencionado.
  rationale: O contexto de louvor favorece Deus como referente, mas a tradução pronominal evita explicitar além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa e ritmo poético. “Terra seca”, “a pé” e “ali” são expressões amplamente compreensíveis. Os marcadores foram posicionados junto às palavras ou orações a que suas notas efetivamente se referem.
