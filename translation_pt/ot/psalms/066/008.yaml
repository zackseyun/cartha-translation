base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: pt
  text: Bendigam, ó povos, o nosso Deus e façam ouvir a voz do seu louvor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a voz do louvor dirigido a ele”.'
    reason: Alternativa lexical que explicita o sufixo como referência ao destinatário do louvor.
lexical_decisions:
- source_word: בָּרְכוּ
  choice: Bendigam
  rationale: O imperativo plural de ברך dirige aos povos a ordem de bendizer Deus; “bendigam” preserva o sentido verbal e o uso bíblico sem reduzi-lo simplesmente a “louvem”.
- source_word: עַמִּים
  choice: ó povos
  rationale: O plural funciona como vocativo. “Povos” mantém a convocação coletiva e é mais próximo do hebraico do que “nações”.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: A forma com sufixo de primeira pessoa do plural significa diretamente “nosso Deus” e conserva a perspectiva da comunidade do salmista.
- source_word: וְהַשְׁמִיעוּ
  choice: e façam que se ouça
  rationale: O hifil imperativo de שמע tem força causativa, “fazer ouvir”. A construção escolhida expressa essa causalidade em português corrente, sem enfraquecê-la para um simples “deixem que se ouça”.
- source_word: קוֹל
  choice: a voz
  rationale: קוֹל pode significar “voz” ou “som”. “A voz do seu louvor” mantém a imagem de uma expressão audível e reproduz de perto a construção hebraica.
- source_word: תְּהִלָּתוֹ
  choice: do seu louvor
  rationale: O substantivo com sufixo de terceira pessoa masculina singular é vertido diretamente como “seu louvor”, preservando a relação do louvor com Deus sem decidir no texto principal se o sentido é possessivo ou objetivo.
theological_decisions:
- issue: Nuance do sufixo em תְּהִלָּתוֹ
  choice: do seu louvor
  alternative: do louvor dirigido a ele
  rationale: O sufixo hebraico admite a formulação direta “seu louvor”, mas o contexto também permite entendê-lo como louvor dirigido a Deus. A tradução principal conserva a ambiguidade, e a nota registra a leitura alternativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocativo claro. A formulação “façam que se ouça” conserva a força causativa do hebraico; “a voz do seu louvor” mantém sua imagem acústica e sua ambiguidade.
