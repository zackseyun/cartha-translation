- from: Bendigam, ó povos, o nosso Deus e façam que se ouça a voz do seu louvor[a].
  to: Bendigam, ó povos, o nosso Deus e façam ouvir a voz do seu louvor[a].
  rationale: A revisão substitui a perífrase «façam que se ouça» por «façam ouvir», expressão portuguesa natural que representa de maneira mais direta o hifil imperativo «fazei ouvir / tornai audível». Mantêm-se o vocativo, o possessivo comunitário «nosso Deus», a imagem acústica de «voz» e a ambiguidade do sufixo em «seu louvor», com a leitura objetiva registrada em nota.
