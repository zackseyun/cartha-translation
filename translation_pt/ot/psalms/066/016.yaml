source:
  edition: WLC
  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: pt
  text: Venham e ouçam, todos vocês que temem a Deus, e eu contarei o que ele fez por minha vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por minha alma”. O hebraico נֶפֶשׁ (néfesh) pode significar “vida”, “alma” ou o próprio “ser”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: Embora o verbo signifique literalmente “ir/andar”, aqui funciona como convite dirigido aos ouvintes; “Venham” é a forma idiomática natural em português.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Preserva o imperativo e expressa o chamado a dar atenção ao testemunho do salmista.
- source_word: וַאֲסַפְּרָה
  choice: e eu contarei
  rationale: O verbo ספר significa contar ou relatar; a forma expressa a intenção do salmista de narrar a ação de Deus.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: todos vocês que temem a Deus
  rationale: Mantém o sentido bíblico de temor reverente sem reduzi-lo a simples respeito nem intensificá-lo como puro terror.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Traduz o título divino אֱלֹהִים, empregado aqui em vez do nome divino YHWH.
- source_word: אֲשֶׁר עָשָׂה
  choice: o que ele fez
  rationale: É uma tradução direta e natural da oração relativa e do perfeito hebraico, adequada ao contexto de testemunho.
- source_word: לְנַפְשִׁי
  choice: por minha vida
  rationale: נֶפֶשׁ pode designar vida, pessoa, ser ou alma. Neste contexto, “minha vida” comunica naturalmente a ação de Deus em favor do próprio salmista, enquanto “minha alma” permanece como alternativa legítima em nota.
theological_decisions:
- issue: Sentido de “temer a Deus”
  choice: temor reverente diante de Deus
  alternative: terror diante de Deus; simples respeito pela divindade
  rationale: A tradução conserva o termo “temem” e sua tensão bíblica, permitindo o sentido de reverência, assombro e submissão sem o restringir a mero respeito ou terror.
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma; meu próprio ser; mim
  rationale: O termo hebraico tem amplitude semântica e frequentemente designa a vida ou a própria pessoa. “Minha vida” é claro e natural neste testemunho, e a alternativa tradicional “minha alma” é registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita que os imperativos e o particípio são plurais. A ordem foi ajustada com vírgulas para conservar o chamado direto do hebraico sem soar artificial.
