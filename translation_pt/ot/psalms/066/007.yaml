source:
  edition: WLC
  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: pt
  text: Ele governa para sempre com seu poder; seus olhos vigiam as nações. Que os rebeldes não se exaltem[a]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se levantem” ou “não se ergam”. O verbo hebraico pode indicar levantar, erguer ou exaltar a si mesmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Ele governa
  rationale: O particípio qal de משל tem aqui valor verbal e descreve o governo contínuo de Deus; o presente é natural em português e preserva esse aspecto durativo.
- source_word: בִּגְבוּרָתוֹ
  choice: com seu poder
  rationale: גְּבוּרָה indica força ou poder, e a preposição ב tem valor instrumental; a expressão comunica que Deus exerce seu governo mediante seu poder.
- source_word: עוֹלָם
  choice: para sempre
  rationale: Em posição adverbial, עוֹלָם indica duração sem fim; «para sempre» é claro e idiomático.
- source_word: עֵינָיו
  choice: seus olhos
  rationale: A imagem antropomórfica explícita do hebraico é preservada, sem reduzi-la simplesmente a «ele».
- source_word: בַּגּוֹיִם
  choice: as nações
  rationale: גּוֹיִם designa aqui as nações ou povos em geral, não especificamente os gentios em contraste religioso posterior.
- source_word: תִּצְפֶּינָה
  choice: vigiam
  rationale: A forma de צפה significa observar ou manter vigilância e concorda com «olhos»; «vigiam» preserva tanto o sentido quanto a imagem poética.
- source_word: הַסּוֹרְרִים
  choice: os rebeldes
  rationale: O particípio de סרר descreve pessoas obstinadamente resistentes ou rebeldes; o substantivo corrente «rebeldes» expressa isso com naturalidade.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: Que ... não se exaltem
  rationale: אַל com o imperfeito expressa proibição. O hifil de רום pode significar levantar ou exaltar, e לָמוֹ favorece aqui a compreensão reflexiva de autoexaltação, embora permaneçam possíveis os sentidos de levantar-se ou erguer-se.
- source_word: סֶלָה
  choice: Selá
  rationale: O termo litúrgico ou musical de sentido exato incerto é transliterado, em vez de receber uma tradução conjectural.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção divina
  choice: Preservar «seus olhos vigiam as nações»
  alternative: «Ele vigia as nações»
  rationale: O hebraico menciona explicitamente os olhos de Deus. Manter a imagem conserva a força poética sem afirmar qualquer limitação própria das criaturas.
- issue: Sentido da proibição dirigida aos rebeldes
  choice: 'Traduzir como autoexaltação: «Que os rebeldes não se exaltem»'
  alternative: «Que os rebeldes não se levantem» ou «não se ergam»
  rationale: A construção com לָמוֹ favorece o valor reflexivo, e רום no hifil pode indicar exaltação. A nota preserva a ambiguidade lexical entre exaltar-se e erguer-se.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantêm-se o paralelismo conciso, a imagem dos olhos divinos e a transliteração litúrgica tradicional «Selá».
