  source_fidelity: O hebraico atribui diretamente a Deus a ação de fazer um homem cavalgar sobre o povo e, em seguida, de tirá-lo para a abundância. «Conduziste a um lugar» enfraquece a noção explícita de fazer sair/tirar (וַתּוֹצִיאֵנוּ).
  naturalness: «Fizeste um homem passar a cavalo» é compreensível, mas menos preciso e menos fluente para a imagem equestre do que «Fizeste um homem cavalgar». «As nossas cabeças» soa mais natural em português e conserva o singular coletivo hebraico no sentido.
  terminology: «Um homem» preserva adequadamente o singular de אֱנוֹשׁ, sem resolver se o singular tem alcance representativo. «Abundância» comunica bem לָרְוָיָה sem impor uma interpretação material excessivamente estreita.
