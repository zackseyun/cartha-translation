base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: pt
  text: Fizeste um homem cavalgar sobre as nossas cabeças; passamos pelo fogo e pela água, mas nos trouxeste para um lugar de abundância.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ (ʾenôš)
  choice: um homem
  rationale: Mantém o substantivo singular do texto massorético e seu sentido de ser humano mortal, sem convertê-lo no plural genérico.
- source_word: הִרְכַּבְתָּ (hirkavta)
  choice: fizeste ... passar a cavalo
  rationale: Expressa naturalmente em português a forma causativa do verbo ligado a montar ou cavalgar, preservando a imagem de alguém dominando o povo.
- source_word: לְרֹאשֵׁנוּ (lerōʾšênû)
  choice: sobre a nossa cabeça
  rationale: Conserva o singular coletivo de 'cabeça' e a imagem hebraica de humilhação e sujeição.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם (bāʾnû bāʾēš ûvammayim)
  choice: passamos pelo fogo e pela água
  rationale: Traduz idiomaticamente a travessia de perigos extremos, mantendo as duas imagens concretas.
- source_word: לָרְוָיָה (lārevāyâ)
  choice: a um lugar de fartura
  rationale: O termo sugere abundância, saciedade ou alívio amplo; 'lugar de fartura' preserva a ideia sem restringi-la indevidamente a uma condição específica.
theological_decisions:
- issue: Agência divina na provação e no livramento
  choice: 'Mantida por meio da segunda pessoa: ''Fizeste'' e ''tu nos conduziste''.'
  alternative: Atenuar a primeira ação como mera permissão divina.
  rationale: A gramática hebraica atribui diretamente a Deus tanto a sujeição quanto a saída para a fartura; a tradução preserva essa tensão teológica.
- issue: Número de אֱנוֹשׁ
  choice: um homem
  alternative: homens ou pessoas
  rationale: O texto massorético apresenta o substantivo no singular; a tradução não o transforma silenciosamente em plural, embora o singular possa ter valor representativo ou coletivo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para a imagem equestre. O paralelismo foi preservado, assim como o contraste entre provação extrema e abundância final.
