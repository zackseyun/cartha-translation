source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: pt
  text: Oferecerei-te holocaustos de animais cevados, com a fumaça[a] de carneiros; sacrificarei gado e bodes[b]. Selá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o aroma de carneiros”. O termo hebraico pode se referir à fumaça ou ao odor produzido pela queima de um sacrifício.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico se refere especificamente a caprinos machos.
    reason: lexical_clarification
  - marker: c
    text: “Selá” é tradicionalmente deixado sem tradução, pois seu significado exato é incerto; talvez seja uma indicação musical ou litúrgica.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo sacrificial consagrado em português para ofertas totalmente queimadas no altar; o contexto impede o sentido moderno não ritual.
- source_word: מֵחִים
  choice: animais cevados
  rationale: Expressa animais bem nutridos ou engordados, apropriados para um sacrifício valioso, com concisão e registro digno.
- source_word: אַעֲלֶה לָךְ
  choice: oferecerei a ti
  rationale: O hifil de עלה tem aqui sentido sacrificial de fazer subir ou oferecer, preservando também o destinatário divino.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: com a fumaça de carneiros
  rationale: קְטֹרֶת pode designar a fumaça ou o odor produzido pela queima. Como carneiros estão sendo sacrificados, 'fumaça' transmite a imagem sem sugerir que os animais sejam incenso.
- source_word: אֶעֱשֶׂה
  choice: sacrificarei
  rationale: Embora o verbo básico seja 'fazer', neste contexto cultual ele descreve a realização do sacrifício; 'sacrificarei' é natural e explícito em português.
- source_word: בָקָר
  choice: gado
  rationale: O substantivo coletivo designa bovinos sem especificar necessariamente bois ou touros; 'gado' preserva essa abrangência.
- source_word: עִם עַתּוּדִים
  choice: e bodes
  rationale: עַתּוּדִים designa especificamente caprinos machos. 'Bodes' preserva essa especificidade, enquanto 'e' comunica naturalmente o valor associativo de עִם.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, mantém-se a transliteração tradicional em vez de adotar uma interpretação musical ou litúrgica específica.
theological_decisions:
- issue: A natureza da קְטֹרֶת dos carneiros
  choice: fumaça
  alternative: aroma
  rationale: A tradução mantém a imagem concreta da queima sacrificial, mas registra em nota a possível nuance olfativa, sem decidir além do que o hebraico permite.
- issue: O sentido cultual de אֶעֱשֶׂה
  choice: sacrificarei
  alternative: prepararei/farei
  rationale: O contexto torna o ato sacrificial claro. A opção evita uma formulação portuguesa obscura, sem acrescentar uma espécie de rito não expressa no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia sacrificial reconhecível. A ordem poética e o paralelismo foram preservados sem produzir construções artificiais; as ambiguidades reais de קְטֹרֶת e סֶלָה aparecem nas notas.
