  text: כִּֽי בְחַנְתָּ֥/נוּ אֱלֹהִ֑ים צְ֝רַפְתָּ֗/נוּ כִּ/צְרָף כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: pt
  text: Pois tu nos provaste[a], ó Deus; tu nos refinaste como se refina a prata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos examinaste” ou “nos puseste à prova”; o verbo hebraico pode salientar uma prova que revela ou comprova a autenticidade.
    reason: lexical_alternative
  - marker: b
    text: 'A imagem vem do trabalho com metais: a prova realizada por Deus é comparada à refinação da prata, na qual o calor separa as impurezas do metal.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o louvor no contexto e conserva de modo natural o valor explicativo da conjunção hebraica.
- source_word: בְחַנְתָּנוּ
  choice: tu nos provaste
  rationale: O verbo בחן descreve examinar ou pôr à prova para verificar ou demonstrar a qualidade; “provaste” mantém essa nuance e se liga bem à imagem da refinação.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A expressão funciona como vocativo; “ó Deus” preserva a invocação direta em registro poético digno e corrente.
- source_word: צְרַפְתָּנוּ
  choice: tu nos refinaste
  rationale: צרף é o verbo próprio da refinação de metais. “Refinaste” preserva a metáfora metalúrgica sem substituí-la por uma interpretação abstrata como “purificaste”.
- source_word: כִּצְרָף כָּסֶף
  choice: como se refina a prata
  rationale: A construção comparativa apresenta genericamente o processo de refinar prata; esta formulação é natural em português e mantém explícita a comparação.
