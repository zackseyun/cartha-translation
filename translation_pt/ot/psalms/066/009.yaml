translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo poético e a imagem dos pés, enquanto as notas registram a forma mais literal e a amplitude semântica de נֶפֶשׁ e מוֹט.
