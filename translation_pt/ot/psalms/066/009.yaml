  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: pt
  text: 'aquele que nos mantém vivos[a]

    e não permitiu que nossos pés vacilassem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que põe nossa vida entre os viventes”. O termo hebraico traduzido por “vida” também pode significar “alma” ou “nós mesmos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “escorregassem”; literalmente, “para que nosso pé vacile”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם נַפְשֵׁנוּ בַּחַיִּים
  choice: aquele que nos mantém com vida
  rationale: A expressão hebraica diz literalmente que Deus “põe” nossa נֶפֶשׁ “na vida” ou “entre os viventes”. No contexto, o sentido é preservativo. “Nos mantém com vida” comunica com naturalidade que Deus preserva a nossa vida, sem impor a נֶפֶשׁ a noção mais restrita de uma parte imaterial da pessoa.
- source_word: וְלֹא נָתַן
  choice: e não permite
  rationale: 'Nesta construção, נָתַן seguido de לַמּוֹט expressa permissão: Deus não deixa que a instabilidade aconteça. O presente combina com o particípio substantivado inicial e apresenta a ação preservadora de Deus como característica contínua.'
- source_word: לַמּוֹט
  choice: vacilem
  rationale: מוֹט descreve perda de firmeza, oscilação ou escorregão. Com “pés”, “vacilem” preserva a imagem de instabilidade e mantém o tom poético.
- source_word: רַגְלֵנוּ
  choice: nossos pés
  rationale: O hebraico apresenta o singular coletivo “nosso pé”. O plural idiomático em português conserva a imagem concreta e aplica naturalmente a ação ao povo que fala na primeira pessoa do plural.
