  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: pt
  text: Se eu tivesse acolhido a maldade no meu coração[a], o Senhor não me teria ouvido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se eu tivesse considerado a maldade no meu coração”. O hebraico usa literalmente o verbo “ver”, aqui no sentido de considerar ou olhar favoravelmente.'
    reason: Alternativa mais próxima da formulação hebraica e esclarecimento do sentido idiomático do verbo.
lexical_decisions:
- source_word: אָוֶן
  choice: maldade
  rationale: No contexto, o termo designa mal moral ou conduta perversa. “Maldade” é claro e corrente em português, sem sugerir apenas sofrimento ou desgraça.
- source_word: אִם
  choice: se
  rationale: Introduz naturalmente a condição contrária ao fato, expressa em português por “se eu tivesse”.
- source_word: רָאִיתִי
  choice: tivesse acolhido
  rationale: Embora o verbo signifique literalmente “ver”, a expressão “ver no coração” comunica dar atenção favorável ou abrigar interiormente. “Acolhido” preserva essa disposição voluntária sem tornar o sentido excessivamente afetivo.
- source_word: בְלִבִּי
  choice: no coração
  rationale: Mantém a imagem hebraica do coração como centro da vontade, dos pensamentos e das disposições interiores.
- source_word: לֹא יִשְׁמַע
  choice: não teria me ouvido
  rationale: No contexto da oração, “ouvir” pode denotar atenção favorável. A forma condicional composta é idiomática em português e não acrescenta a ideia mais específica de responder.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino reverencial אֲדֹנָי pela forma portuguesa tradicional, natural e amplamente compreendida.
theological_decisions:
- issue: Se a expressão רָאִיתִי בְלִבִּי deve ser vertida literalmente ou interpretada como disposição interior favorável ao mal
  choice: Interpretar a expressão como acolher a maldade no coração
  alternative: Se eu tivesse visto a maldade no meu coração; se eu tivesse considerado a maldade no coração
  rationale: O hebraico não trata da mera percepção da própria maldade, mas de lhe dar lugar ou consideração favorável no íntimo. A tradução evita sugerir que reconhecer o pecado, por si só, impede a oração.
- issue: Se שׁמע deve ser traduzido por “ouvir”, “escutar” ou “responder”
  choice: ouvir
  alternative: escutar; atender; responder
  rationale: “Ouvir” preserva a formulação do hebraico e, no contexto de oração, admite o sentido de dar atenção favorável. “Responder” tornaria explícita uma consequência que o verbo não declara diretamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem é natural, a metáfora do coração foi preservada e a nota registra a alternativa lexical sem sobrecarregar o texto principal.
