  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: pt
  text: Tu nos fizeste entrar na rede[a]; puseste um fardo opressivo sobre os nossos lombos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na armadilha” ou “na fortaleza”. O termo hebraico pode indicar um meio ou lugar de captura e confinamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “quadris” ou “cintura”. O hebraico refere-se à região dos lombos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Tu nos fizeste entrar
  rationale: 'O hifil de בוא com sufixo de primeira pessoa do plural expressa causação: “fizeste-nos entrar” ou “nos levaste para dentro”. A formulação preserva claramente a ação direta de Deus.'
- source_word: בַמְּצוּדָה
  choice: na rede
  rationale: מְצוּדָה pode designar rede, armadilha ou fortificação. No contexto de provação e confinamento, “rede” comunica de modo natural a imagem de captura; a alternativa lexical é registrada em nota.
- source_word: שַׂמְתָּ
  choice: puseste
  rationale: שׂים significa pôr, colocar ou estabelecer. “Puseste” é direto e mantém o paralelismo da ação divina.
- source_word: מוּעָקָה
  choice: um fardo opressivo
  rationale: O substantivo denota pressão, angústia, aperto ou carga constrangedora. “Fardo opressivo” preserva tanto a aflição quanto a imagem concreta de algo imposto ao corpo.
- source_word: בְמָתְנֵינוּ
  choice: sobre os nossos quadris
  rationale: מָתְנַיִם refere-se à região dos lombos ou quadris. “Quadris” é compreensível no português atual e mantém a imagem corporal; “lombos” consta como alternativa em nota.
theological_decisions:
- issue: Ação divina no sofrimento
  choice: 'Manter Deus como sujeito explícito de ambas as ações: fez o povo entrar e pôs sobre ele o fardo.'
  alternative: 'Atenuar a agência divina, por exemplo: “caímos na rede” ou “um fardo veio sobre nós”.'
  rationale: Os dois verbos hebraicos estão na segunda pessoa masculina singular e se dirigem diretamente a Deus. A tradução preserva essa tensão teológica sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com segunda pessoa singular para preservar o discurso direto a Deus. A expressão “fardo opressivo” torna explícita a combinação hebraica de peso, pressão e aflição sem eliminar a imagem corporal.
