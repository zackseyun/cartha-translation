  yaml_path: translation/ot/psalms/066/013.yaml
  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: pt
  text: Entrarei em tua casa com holocaustos; cumprirei os votos que te fiz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pagarei os votos que te fiz». «Tua casa» provavelmente se refere ao santuário de Deus.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: אָבוֹא
  choice: Entrarei
  rationale: O qal imperfeito na primeira pessoa do singular expressa a ação futura ou pretendida do salmista. Com o complemento «em tua casa», «entrarei» é natural em português e comunica diretamente o movimento para o interior.
- source_word: בֵיתְךָ
  choice: tua casa
  rationale: A expressão significa literalmente «tua casa». No contexto, refere-se provavelmente ao santuário de Deus, mas o texto principal preserva a imagem concreta do hebraico sem estreitá-la para «templo».
- source_word: בְעוֹלוֹת
  choice: com holocaustos
  rationale: עֹלוֹת é o plural do termo sacrificial normalmente traduzido por «holocaustos», ofertas totalmente queimadas. A preposição בְּ indica aqui acompanhamento.
- source_word: אֲשַׁלֵּם
  choice: cumprirei
  rationale: No piel e na construção com votos, שׁלם significa pagar ou cumprir o que foi prometido. «Cumprirei» exprime claramente o sentido idiomático e evita uma conotação exclusivamente comercial.
- source_word: לְךָ
  choice: a ti
  rationale: A preposição לְ marca Deus como o destinatário do cumprimento dos votos; «a ti» mantém essa relação de modo conciso.
- source_word: נְדָרָי
  choice: os meus votos
  rationale: O substantivo plural com sufixo de primeira pessoa significa diretamente «meus votos»; o artigo antes do possessivo é idiomático em português.
theological_decisions:
- issue: Se «tua casa» deve ser interpretada no texto principal como referência técnica ao templo ou santuário
  choice: Manter «tua casa» no texto principal
  alternative: teu templo; teu santuário
  rationale: O hebraico diz literalmente «tua casa». Embora o contexto sacrificial indique o santuário, preservar a expressão mantém a imagem e evita tornar explícita uma identificação que o verso deixa implícita.
- issue: Como representar o cumprimento dos votos religiosos
  choice: «cumprirei»
  alternative: «pagarei»
  rationale: Ambas as opções pertencem ao campo semântico do verbo neste contexto. «Cumprirei» comunica a obrigação assumida sem sugerir necessariamente uma transação monetária.
translation_notes:
  register: Português moderno, claro e digno, com construção sintética próxima do paralelismo hebraico. Emprega-se «tua» e «a ti» de forma coerente para a segunda pessoa singular dirigida a Deus. «Holocaustos» é o termo bíblico corrente para ofertas inteiramente queimadas.
