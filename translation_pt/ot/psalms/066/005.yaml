  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: pt
  text: Venham e vejam as obras de Deus; temível é sua ação para com os filhos dos homens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. Em hebraico, “os filhos do homem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: Embora הלך normalmente signifique “ir”, neste convite seguido de “ver” o português idiomático pede “Venham e vejam”.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Preserva o imperativo plural e o chamado para observar o que Deus fez.
- source_word: מִפְעֲלוֹת
  choice: as obras
  rationale: Designa aquilo que Deus realizou; “obras” mantém um tom digno e permite alguma distinção em relação a עֲלִילָה.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto se refere inequivocamente ao Deus de Israel.
- source_word: נוֹרָא
  choice: inspira temor
  rationale: Expressa o sentido de algo que suscita reverência e medo, evitando o possível uso banal de “impressionante”.
- source_word: עֲלִילָה
  choice: feitos
  rationale: Comunica a atividade ou atuação divina e preserva uma distinção lexical natural em relação a “obras”.
- source_word: עַל
  choice: para com
  rationale: Mantém ampla a relação das ações divinas com a humanidade, sem defini-las antecipadamente como favoráveis ou hostis.
- source_word: בְּנֵי אָדָם
  choice: os filhos dos homens
  rationale: Reproduz de perto a expressão hebraica masculina representativa, que aqui designa genericamente os seres humanos.
theological_decisions:
- issue: Sentido reverencial de נוֹרָא
  choice: inspira temor
  alternative: é temível
  rationale: A formulação escolhida preserva a combinação de reverência e medo sem sugerir apenas terror.
- issue: Expressão humana genérica בְּנֵי אָדָם
  choice: os filhos dos homens
  alternative: a humanidade
  rationale: O texto principal conserva a forma concreta do hebraico; a nota esclarece seu sentido coletivo e inclusivo.
- issue: Força relacional de עַל
  choice: para com
  alternative: contra
  rationale: A preposição não é estreitada para uma ação exclusivamente hostil; a tradução mantém a abertura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Venham e vejam” é o convite natural; “inspira temor” retém a reverência de נוֹרָא. A nota torna explícito o valor coletivo de בְּנֵי אָדָם.
