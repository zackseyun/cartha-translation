base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: pt
  text: Afastaste de mim quem me ama e o meu amigo; meus conhecidos são as trevas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «meus conhecidos estão nas trevas»; ou: «as trevas são a minha única companhia». O final hebraico é muito conciso e pode ser entendido de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְחַקְתָּ מִמֶּנִּי
  choice: Afastaste de mim
  rationale: Preserva a forma causativa dirigida a Deus e a ideia de separação, em português natural e solene.
- source_word: אֹהֵב
  choice: quem me ama
  rationale: O particípio substantivado designa alguém que ama o salmista. Esta formulação evita o sentido predominantemente romântico ou sexual que «amante» pode ter no português atual.
- source_word: וָרֵעַ
  choice: e o meu amigo
  rationale: No contexto relacional, רֵעַ indica amigo ou companheiro; «amigo» é claro e mantém a distinção em relação a «quem me ama».
- source_word: מְיֻדָּעַי
  choice: meus conhecidos
  rationale: Reproduz o plural com sufixo de primeira pessoa e não o transforma indevidamente em amigos íntimos.
- source_word: מַחְשָׁךְ
  choice: são as trevas
  rationale: Mantém a frase nominal abrupta e a predicação metafórica segundo a ordem massorética, acrescentando apenas a cópula exigida pelo português.
theological_decisions:
- issue: Relação sintática da expressão final מְיֻדָּעַי מַחְשָׁךְ
  choice: meus conhecidos são as trevas
  alternative: as trevas são a minha única companhia / meus conhecidos estão nas trevas
  rationale: O hebraico é extremamente conciso e admite mais de uma compreensão. O texto principal conserva a ordem dos termos e a imagem dura, sem resolver a ambiguidade em favor de uma interpretação teológica ou psicológica específica; a nota registra alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se «quem me ama» a «amante» para evitar uma conotação romântico-sexual não exigida pelo hebraico. A brusquidão poética do final foi preservada.
