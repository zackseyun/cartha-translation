source:
  edition: WLC
  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: pt
  text: 'Pois a minha alma está cheia de aflições,

    e a minha vida se aproxima do Sheol.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sepultura” ou “do mundo dos mortos”. O termo hebraico é Sheol.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a causa do lamento expresso no contexto e mantém de modo natural a força causal do hebraico.
- source_word: שָׂבְעָה בְרָעוֹת
  choice: está cheia de aflições
  rationale: O verbo descreve estar cheio ou saciado; com רָעוֹת, a expressão se refere às adversidades que o salmista suporta. “Aflições” comunica isso com naturalidade e dignidade, sem sugerir que se trata de males morais cometidos por ele.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva a distinção poética em relação a חַיַּי (“a minha vida”) no segundo verso, embora נֶפֶשׁ também possa significar vida ou pessoa.
- source_word: וְחַיַּי
  choice: e a minha vida
  rationale: חַיִּים, embora tenha forma plural, funciona aqui como substantivo abstrato singular; “a minha vida” é a formulação portuguesa natural.
- source_word: לִשְׁאוֹל
  choice: do Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos e evita reduzi-lo à sepultura física ou identificá-lo com uma categoria teológica posterior.
- source_word: הִגִּיעוּ
  choice: se aproxima
  rationale: O verbo significa alcançar ou chegar. No contexto poético, a formulação expressa que a vida do salmista está chegando ao Sheol, isto é, que a morte está iminente.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração conserva o conceito do texto hebraico e sua amplitude, sem equipará-lo indevidamente apenas à sepultura nem importar uma concepção posterior do inferno.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura em dois versos preserva o paralelismo poético e distingue “alma” de “vida”.
