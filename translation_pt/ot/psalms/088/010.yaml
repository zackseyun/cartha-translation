  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: pt
  text: Acaso fazes maravilhas pelos mortos? Será que os espíritos dos mortos[a] se levantam para te louvar? Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as sombras»; em hebraico, Rephaim, termo poético para os mortos no mundo dos mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: pelos mortos
  rationale: A combinação interrogativa הֲ com לַ expressa aqui «pelos mortos?» ou «em favor dos mortos?». «Pelos mortos» é natural e conserva a força retórica.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: fazes maravilhas
  rationale: Embora פֶּלֶא esteja no singular, a expressão idiomática portuguesa «fazer maravilhas» comunica naturalmente a ideia de atos divinos extraordinários sem restringi-la a «milagre».
- source_word: אִם
  choice: Será que
  rationale: Neste paralelismo, אִם introduz uma segunda pergunta retórica, não uma condição. «Será que» torna explícita essa função interrogativa.
- source_word: רְפָאִים
  choice: os espíritos dos mortos
  rationale: Neste contexto poético, רְפָאִים designa os mortos no mundo dos mortos. A formulação é clara em português moderno e evita tanto o possível sentido étnico de «refains» quanto a obscuridade de «sombras» no texto principal.
- source_word: יָקוּמוּ
  choice: se levantam
  rationale: Conserva a imagem concreta de קום e sua ambiguidade poética, sem afirmar de modo indevido uma doutrina específica de ressurreição.
- source_word: יוֹדוּךָ
  choice: para te louvar
  rationale: O hifil de ידה pode significar agradecer ou louvar; no contexto cultual e retórico do salmo, «louvar» exprime adequadamente o sentido.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, mantém-se a transliteração tradicional, sem impor uma interpretação especulativa.
theological_decisions:
- issue: Sentido de רְפָאִים no contexto poético do mundo dos mortos
  choice: os espíritos dos mortos
  alternative: as sombras; os mortos; os refains
  rationale: A escolha conserva a referência aos falecidos no mundo dos mortos sem importar afirmações posteriores sobre o estado intermediário. A alternativa poética «sombras» é registrada em nota.
- issue: Força de יָקוּמוּ
  choice: se levantam
  alternative: ressuscitam
  rationale: «Se levantam» preserva a imagem e a tensão retórica do hebraico; «ressuscitam» poderia definir de maneira excessiva a ação como ressurreição doutrinariamente formulada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Acaso» e «Será que» sustentam as duas perguntas retóricas; «Selá» preserva o termo litúrgico incerto.
