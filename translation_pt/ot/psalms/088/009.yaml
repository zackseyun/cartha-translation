  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: pt
  text: Meu olho se enfraquece por causa da aflição;[a] todos os dias clamo a ti, ó Yahweh; estendo minhas mãos para ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu olho definha por causa da aflição” ou “Meu olho dói por causa da miséria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: Meu olho
  rationale: O hebraico emprega o singular, uma imagem poética que pode representar a visão, o vigor ou a pessoa em sofrimento. O singular preserva a concretude do original e é compreensível em português.
- source_word: דָאֲבָה
  choice: se enfraquece
  rationale: O verbo expressa definhar, languescer ou perder as forças em consequência do sofrimento. “Se enfraquece” comunica o sentido com naturalidade sem limitar a expressão à dor física.
- source_word: מִנִּי עֹנִי
  choice: por causa da aflição
  rationale: A construção indica causa ou origem. “Aflição” abrange sofrimento e miséria sem acrescentar uma causa específica ausente do texto.
- source_word: קְרָאתִיךָ
  choice: clamo a ti
  rationale: Embora a forma verbal seja qatal, a expressão “todos os dias” favorece aqui uma ação habitual. “Clamo” preserva a ideia de invocação em oração e a intensidade do contexto sem exagerá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל יוֹם
  choice: todos os dias
  rationale: A expressão tem sentido distributivo e indica repetição diária; “todos os dias” evita a possível leitura de duração contínua de “o dia todo”.
- source_word: שִׁטַּחְתִּי
  choice: estendo
  rationale: O verbo descreve o gesto de abrir ou estender as mãos em súplica. No paralelismo com o clamor diário, o presente expressa naturalmente a prática habitual.
- source_word: כַפָּי
  choice: minhas mãos
  rationale: Embora o substantivo possa designar especificamente as palmas, “mãos” é a forma natural em português para o gesto de oração e súplica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” procura representá-lo diretamente, sem substituí-lo por um título e sem adotar a forma híbrida tradicional “Jeová”.
- issue: Valor temporal dos verbos קְרָאתִיךָ e שִׁטַּחְתִּי
  choice: 'Presente habitual: “clamo” e “estendo”'
  alternative: 'Perfeito: “clamei” e “estendi” ou “tenho clamado” e “tenho estendido”'
  rationale: As formas hebraicas permitem uma perspectiva perfectiva, mas “todos os dias” e o paralelismo poético sustentam uma ação repetida. O presente habitual é natural em português sem eliminar por completo a tensão temporal do contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o singular poético “meu olho”, o vocativo “ó Yahweh” e o gesto concreto das mãos. A nota foi colocada junto à expressão a que se refere.
