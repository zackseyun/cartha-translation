source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: pt
  text: Mas eu clamo a ti, ó Yahweh; pela manhã, minha oração chega à tua presença.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vai ao teu encontro” ou “se apresenta diante de ti”. O verbo hebraico pode transmitir a ideia de chegar diante de alguém, encontrar ou preceder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente dá ênfase contrastiva ao salmista. “Mas eu” preserva o contraste com naturalidade em português.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: A preposição indica que Yahweh é o destinatário do clamor. “A ti” é claro, digno e adequado ao registro de oração.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título; “ó” expressa o vocativo em português.
- source_word: שִׁוַּעְתִּי
  choice: clamo
  rationale: O verbo descreve um clamor por socorro. O presente comunica naturalmente a súplica contínua no contexto poético, sem acrescentar um objeto não expresso no hebraico.
- source_word: וּבַבֹּקֶר
  choice: pela manhã
  rationale: Expressa de modo idiomático o valor temporal da frase hebraica. O ponto e vírgula torna desnecessário reproduzir a conjunção com “e”.
- source_word: תְּפִלָּתִי
  choice: minha oração
  rationale: Conserva diretamente o substantivo singular com o sufixo possessivo de primeira pessoa.
- source_word: תְקַדְּמֶךָּ
  choice: chega à tua presença
  rationale: O hifil de קדם pode indicar vir diante de, encontrar ou preceder. Esta formulação preserva a imagem da oração que se apresenta diante de Deus e soa natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o tetragrama. A forma “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Valor temporal de שִׁוַּעְתִּי
  choice: clamo
  alternative: clamei; tenho clamado
  rationale: Embora a forma hebraica seja qatal, o contexto de oração poética permite entendê-la como a expressão de um clamor persistente. O presente mantém essa continuidade sem excluir que o clamor já tenha começado.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. O paralelismo poético foi preservado por meio de duas orações separadas por ponto e vírgula.
