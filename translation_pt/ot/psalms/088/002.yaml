  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: pt
  text: Que a minha oração chegue à tua presença; inclina o teu ouvido ao meu clamor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּבוֹא
  choice: Que ... chegue
  rationale: 'O imperfeito qal na 3ª pessoa feminina singular concorda com תְּפִלָּתִי e, no contexto de súplica, tem força volitiva: expressa o pedido de que a oração alcance a presença de Deus.'
- source_word: לְפָנֶיךָ
  choice: à tua presença
  rationale: A expressão significa literalmente 'diante da tua face', mas funciona idiomaticamente como referência à presença de alguém. 'À tua presença' conserva o movimento indicado por לְ e soa natural em português.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: תְּפִלָּה é o termo comum para 'oração'; essa tradução mantém a amplitude do substantivo sem restringi-lo a uma súplica específica.
- source_word: הַטֵּה
  choice: inclina
  rationale: O imperativo hifil de נטה transmite a imagem de voltar ou inclinar o ouvido para escutar atentamente. 'Inclina' preserva essa metáfora bíblica de modo claro e digno.
- source_word: אָזְנְךָ
  choice: o teu ouvido
  rationale: Mantém o singular concreto do hebraico e a imagem de escuta atenta.
- source_word: לְרִנָּתִי
  choice: ao meu clamor
  rationale: רִנָּה pode indicar um brado ou grito intenso. No contexto de lamento do Salmo 88, 'clamor' comunica a intensidade sem sugerir necessariamente alegria.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular coerentes com a oração dirigida diretamente a Deus. A formulação preserva o paralelismo entre a oração que chega à presença divina e o pedido para que Deus escute o clamor.
