source:
  edition: WLC
  text: הֲ/יִוָּדַ֣ע בַּ/חֹ֣שֶׁךְ פִּלְאֶ֑/ךָ וְ֝/צִדְקָתְ/ךָ֗ בְּ/אֶ֣רֶץ נְשִׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: pt
  text: Acaso a tua maravilha será conhecida nas trevas, ou a tua justiça[a] na terra do esquecimento[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão».
    reason: lexical_alternative
  - marker: b
    text: “A terra do esquecimento” é uma expressão poética para o domínio dos mortos.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיִוָּדַע
  choice: Acaso ... será conhecida
  rationale: O nifal imperfeito de ידע, em uma pergunta retórica, é expresso naturalmente em português por uma construção passiva no futuro; «acaso» sinaliza o caráter interrogativo sem determinar explicitamente a resposta.
- source_word: בַּחֹשֶׁךְ
  choice: nas trevas
  rationale: A preposição com artigo definido favorece «nas trevas»; no contexto, a imagem aponta poeticamente para o domínio da morte, não apenas para a ausência de luz.
- source_word: פִּלְאֶךָ
  choice: a tua maravilha
  rationale: Mantém o substantivo hebraico no singular e permite entendê-lo coletivamente como o poder ou agir maravilhoso de Deus, sem convertê-lo em plural.
- source_word: וְצִדְקָתְךָ
  choice: ou a tua justiça
  rationale: Embora וְ normalmente corresponda a «e», aqui liga duas perguntas retóricas paralelas, para as quais «ou» é a conexão mais natural em português. «Justiça» preserva o campo semântico de צדקה; a alternativa «retidão» é registrada em nota.
- source_word: בְּאֶרֶץ
  choice: na terra
  rationale: A expressão ligada ao substantivo seguinte forma naturalmente «na terra do esquecimento» e funciona como descrição poética do domínio dos mortos.
- source_word: נְשִׁיָּה
  choice: esquecimento
  rationale: Traduz diretamente a ideia de esquecimento ou olvido, mantendo transparente a imagem poética hebraica.
theological_decisions:
- issue: Sentido de צדקה no contexto poético dos atributos e atos de Deus
  choice: justiça
  alternative: retidão
  rationale: צדקה pode designar tanto a conformidade moral e a fidelidade ao que é reto quanto a justiça exercida. «Justiça» é natural e abrangente em português; «retidão» permanece como alternativa legítima para não restringir o campo semântico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem paralela do hebraico e a tensão das perguntas retóricas foram preservadas; evitou-se explicar a metáfora diretamente no corpo do versículo.
