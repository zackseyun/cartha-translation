  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: pt
  text: Acaso o teu amor leal será proclamado na sepultura, ou a tua fidelidade no Abadom[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na destruição” ou “no lugar de destruição”. Em hebraico, “Abadom” é um termo poético para o domínio da ruína e da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: Acaso ... será proclamado
  rationale: A forma passiva de ספר, introduzida pela partícula interrogativa, expressa uma pergunta retórica. “Acaso ... será proclamado” preserva tanto a passividade quanto a força retórica em português natural.
- source_word: בַּקֶּבֶר
  choice: na sepultura
  rationale: קֶבֶר designa sepultura ou lugar de enterro. “Sepultura” é claro, corrente e apropriado ao paralelismo poético com Abadom.
- source_word: חַסְדֶּךָ
  choice: teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade duradoura. “Amor leal” preserva essa amplitude sem impor uma formulação confessional específica.
- source_word: אֱמוּנָתְךָ
  choice: tua fidelidade
  rationale: אֱמוּנָה refere-se aqui à constância e confiabilidade de Deus, em paralelo com חֶסֶד. “Fidelidade” é a equivalência portuguesa mais direta.
- source_word: בָּאֲבַדּוֹן
  choice: no Abadom
  rationale: אֲבַדּוֹן pode indicar destruição ou o domínio da ruína e da morte. A transliteração tradicional portuguesa “Abadom” conserva a imagem poética e sua ressonância bíblica; as alternativas semânticas ficam registradas em nota.
theological_decisions:
- issue: Se אֲבַדּוֹן deve ser traduzido como substantivo comum ou mantido como termo poético para o domínio da morte
  choice: Abadom no texto principal
  alternative: destruição; lugar de destruição
  rationale: No paralelismo com “sepultura”, o termo provavelmente aponta para o domínio da morte e da ruína, não apenas para destruição abstrata. Manter “Abadom” preserva a tensão e a imagem do hebraico, enquanto a nota esclarece seu sentido lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pergunta retórica e o paralelismo poético foram preservados; “ou” explicita naturalmente em português a relação interrogativa entre os dois membros sem resolver a ambiguidade do termo Abadom.
