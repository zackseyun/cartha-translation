lexical_decisions:
- source_word: סָמְכָה
  choice: repousa
  rationale: O verbo סמך traz a ideia de apoiar-se ou ficar assentado sobre algo. Com a ira como sujeito e “sobre mim”, “repousa” preserva a imagem espacial e o aspecto resultante do perfeito hebraico sem acrescentar explicitamente a noção de peso.
- source_word: חֲמָתֶךָ
  choice: a tua ira
  rationale: חֵמָה pode designar calor, furor ou ira. “Ira” é natural no contexto de lamento e mantém a força teológica da indignação divina.
- source_word: מִשְׁבָּרֶיךָ
  choice: tuas ondas
  rationale: O substantivo denota ondas que arrebentam. “Ondas” é claro e natural em português; a nota conserva a imagem lexical mais específica de ondas que quebram.
- source_word: עִנִּיתָ
  choice: quebrantaste-me
  rationale: No Piel, ענה pode significar afligir, humilhar ou oprimir. “Quebrantaste-me” comunica sofrimento intenso e combina naturalmente com a imagem das ondas, sem reduzir o sentido a opressão social.
- source_word: וְכָל
  choice: e com todas
  rationale: A formulação expressa de modo idiomático que todas as ondas de Deus são o meio pelo qual o salmista é afligido, preservando também a totalidade indicada por כָּל.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo litúrgico permanece incerto, ele é transliterado em vez de receber uma tradução conjectural.
theological_decisions:
- issue: Ira divina e agência de Deus no sofrimento
  choice: 'Deus é diretamente interpelado: sua ira repousa sobre o salmista, e suas ondas o quebrantam.'
  alternative: Tornar as ondas e o sofrimento mais impessoais ou suavizar “ira” como mera angústia.
  rationale: O hebraico atribui diretamente a Deus tanto a ira quanto a ação aflitiva. A tradução preserva essa tensão do lamento sem explicá-la ou atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural no registro bíblico. O paralelismo poético foi mantido em dois versos. “Ondas” privilegia legibilidade, enquanto “quebrantaste-me” retém a violência da imagem marítima.
