  yaml_path: translation/ot/psalms/088/000.yaml
  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: pt
  text: 'Cântico. Salmo dos filhos de Corá. Para o regente: segundo Maalate Leanote[a]. Masquil[b] de Hemã, o ezraíta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «Maalate Leanote» é incerta. Talvez indique uma melodia ou um estilo musical; outras propostas são «segundo Maalate, para canto responsivo» e «segundo Maalate, acerca da aflição».
    reason: lexical_alternative
  - marker: b
    text: «Masquil» é um termo técnico dos cabeçalhos dos salmos, muitas vezes entendido como uma composição instrutiva ou contemplativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Termo de gênero no cabeçalho; «cântico» é natural, claro e mantém a distinção em relação a «salmo».
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Equivalente consagrado para uma composição musical do saltério.
- source_word: לִבְנֵי קֹרַח
  choice: dos filhos de Corá
  rationale: A preposição ל pode expressar autoria, associação ou dedicação; «dos» mantém a relação ampla sem a definir excessivamente.
- source_word: לַמְנַצֵּחַ
  choice: Para o regente
  rationale: Indica a pessoa encarregada da execução musical; esta forma é atual e não restringe desnecessariamente a função a um coro.
- source_word: עַל
  choice: segundo
  rationale: Em cabeçalhos musicais, pode introduzir melodia, estilo ou orientação de execução; «segundo» conserva essa amplitude.
- source_word: מָחֲלַת לְעַנּוֹת
  choice: Maalate Leanote
  rationale: O sentido da expressão técnica é incerto; a transliteração evita escolher silenciosamente entre interpretações concorrentes.
- source_word: מַשְׂכִּיל
  choice: Masquil
  rationale: Termo técnico de sentido não inteiramente seguro nos cabeçalhos dos salmos; a transliteração preserva a incerteza, explicada em nota.
- source_word: לְהֵימָן
  choice: de Hemã
  rationale: A preposição pode indicar autoria ou associação; «de» é conciso e preserva essa abertura.
- source_word: הָאֶזְרָחִי
  choice: o ezraíta
  rationale: Reproduz o título gentílico do texto consonantal sem impor a possível identificação alternativa com «zeraíta».
