  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: pt
  text: Sou contado entre os que descem à cova[a]; tornei-me como um homem sem forças[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à sepultura”. A “cova” é uma imagem poética comum da morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um homem forte sem vigor”. O termo hebraico traduzido por “homem” pode trazer uma conotação de força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Sou contado
  rationale: O nifal de חשׁב indica ser considerado ou incluído em determinado grupo. O presente comunica naturalmente o estado vívido do salmista, embora a forma hebraica seja perfeita.
- source_word: עִם
  choice: entre
  rationale: Embora signifique literalmente “com”, após “sou contado” a preposição “entre” expressa de modo idiomático a inclusão do salmista nesse grupo.
- source_word: יוֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: O particípio descreve os que descem ao בור, imagem poética comum da morte ou do domínio dos mortos.
- source_word: בּוֹר
  choice: cova
  rationale: “Cova” preserva a imagem concreta hebraica e, neste contexto poético, evoca a morte sem restringir o termo a uma sepultura literal.
- source_word: הָיִיתִי
  choice: tornei-me
  rationale: O perfeito de היה pode indicar aqui a chegada a um estado resultante; “tornei-me” transmite essa transição com naturalidade.
- source_word: כְּגֶבֶר
  choice: como um homem
  rationale: גבר designa um homem e pode sugerir força ou vigor. A tradução simples preserva o contraste com a ausência de forças na expressão seguinte.
- source_word: אֵין אֱיָל
  choice: sem forças
  rationale: אֱיָל denota força ou vigor. “Sem forças” é claro, natural e mantém a formulação incisiva do hebraico.
theological_decisions: []
