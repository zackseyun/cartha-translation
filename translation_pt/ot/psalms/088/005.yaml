  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: pt
  text: Entre os mortos, estou livre[a], como os que foram mortos e jazem na sepultura, dos quais já não te lembras[b]; e eles foram cortados da tua mão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “livre entre os mortos”. O hebraico emprega a linguagem de liberdade ou libertação, provavelmente de modo irônico: o salmista se vê como alguém praticamente morto, fora do convívio e das atividades dos vivos.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “lembrar” provavelmente significa mais do que conservar alguém na memória; pode incluir voltar-se para essa pessoa e agir em seu favor.
    reason: lexical_alternative
  - marker: c
    text: '“Mão” é uma imagem hebraica que pode representar poder, domínio ou cuidado. A frase também pode ser traduzida: “foram separados da tua mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: entre os mortos
  rationale: A preposição ב com o plural definido tem sentido locativo ou associativo; “entre os mortos” expressa a identificação do salmista com o domínio dos mortos.
- source_word: חָפְשִׁי
  choice: estou livre
  rationale: Preserva a imagem paradoxal de liberdade ou desligamento. No contexto, a expressão é sombria e irônica, não uma libertação positiva.
- source_word: כְּמוֹ חֲלָלִים
  choice: como os que foram mortos
  rationale: כְּמוֹ introduz a comparação, e חֲלָלִים designa pessoas mortas, frequentemente de modo violento. A formulação é clara e natural em português.
- source_word: שֹׁכְבֵי קֶבֶר
  choice: jazem na sepultura
  rationale: O particípio expressa estado contínuo. “Jazem” mantém o registro poético e é amplamente compreensível; “sepultura” representa קֶבֶר sem restringi-lo a um tipo específico de túmulo.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: dos quais já não te lembras
  rationale: Mantém o verbo “lembrar” e sua tensão relacional, sem reduzi-lo a simples recordação mental nem explicá-lo diretamente como cuidado ou intervenção.
- source_word: וְהֵמָּה
  choice: e eles
  rationale: Traduz de modo direto a conjunção e o pronome enfático, evitando impor uma relação causal que não está explicitamente marcada.
- source_word: מִיָּדְךָ נִגְזָרוּ
  choice: foram separados da tua mão
  rationale: “Separados” comunica o resultado do Nifal de גזר, enquanto “tua mão” conserva a imagem hebraica aberta a poder, domínio e cuidado.
theological_decisions:
- issue: O sentido de Deus não mais se lembrar dos mortos
  choice: Manter “já não te lembras” no texto principal
  alternative: “já não cuidas” ou “já não ages em favor deles”
  rationale: A fala pertence à perspectiva angustiada do lamento. A tradução conserva a linguagem e a tensão do hebraico, sem sugerir limitação da onisciência divina nem resolver “lembrar” apenas como cuidado.
- issue: A liberdade entre os mortos
  choice: Manter a imagem paradoxal “estou livre”
  alternative: “estou abandonado” ou “fui desligado”
  rationale: O hebraico emprega explicitamente a linguagem de liberdade ou isenção, provavelmente de modo irônico. Substituí-la por “abandonado” eliminaria a figura poética e acrescentaria uma interpretação.
- issue: Separação da mão de Deus
  choice: Conservar “tua mão”
  alternative: “teu poder” ou “teu cuidado”
  rationale: A metáfora pode abranger poder, domínio e cuidado. Preservá-la evita limitar indevidamente sua amplitude teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com leve elevação poética em “jazem”. A ordem inicial preserva a ênfase hebraica em “entre os mortos”. Os três marcadores de nota aparecem no texto principal e as notas mantêm abertas as principais ambiguidades lexicais e teológicas.
