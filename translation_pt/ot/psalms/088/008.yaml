  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: pt
  text: Afastaste de mim os meus companheiros[a]; fizeste de mim alguém repugnante para eles[b]. Estou confinado[c] e não posso sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os meus conhecidos” ou “os que me são conhecidos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fizeste de mim uma abominação para eles”.
    reason: lexical_alternative
  - marker: c
    text: Ou “Estou encerrado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Afastaste
  rationale: O hifil de רחק expressa fazer ficar distante ou remover. “Afastaste” comunica com naturalidade tanto a ação causativa quanto a separação sofrida pelo salmista.
- source_word: מְיֻדָּעַי
  choice: os meus companheiros
  rationale: A forma derivada de ידע designa pessoas conhecidas do salmista. “Companheiros” é relacional e natural em português, sem pressupor a intimidade mais forte de “amigos”; a nota preserva opções mais formais.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Reproduz o sentido normal de separação da preposição מן com o sufixo da primeira pessoa.
- source_word: שַׁתַּנִי
  choice: fizeste de mim
  rationale: Embora שׂים signifique literalmente “pôr” ou “colocar”, nesta construção predicativa tem o sentido idiomático de tornar alguém alguma coisa.
- source_word: תוֹעֵבוֹת
  choice: alguém repugnante
  rationale: O substantivo plural funciona predicativamente e exprime forte aversão. “Alguém repugnante” preserva essa força em português corrente sem produzir uma construção artificial.
- source_word: לָמוֹ
  choice: para eles
  rationale: O pronome retoma os companheiros mencionados e, na construção portuguesa, indica como eles passaram a considerar o salmista.
- source_word: כָּלֻא
  choice: Estou confinado
  rationale: A forma passiva ou estativa de כלא descreve alguém impedido de sair, encerrado ou restringido. “Confinado” mantém a imagem sem afirmar necessariamente uma prisão formal.
- source_word: וְלֹא אֵצֵא
  choice: e não posso sair
  rationale: A formulação hebraica é literalmente “e não saio”, mas, após “estou confinado”, o contexto expressa incapacidade. “Não posso sair” torna explícita essa força contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução mantém a acusação direta dirigida a Deus e a intensidade do isolamento, sem especificar além do hebraico se o confinamento é literal ou figurado.
