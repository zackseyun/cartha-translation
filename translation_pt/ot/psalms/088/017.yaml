  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: pt
  text: Eles me cercaram como águas o dia inteiro[a]; juntos, fecharam-se sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eles me rodearam como águas o dia inteiro; juntos, cercaram-me», preservando o paralelismo lexical mais estreito entre os dois verbos hebraicos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: me cercam
  rationale: O verbo סבב descreve o cerco em torno do salmista. O presente é natural no contexto poético português e retrata a aflição como contínua e vívida.
- source_word: כַמַּיִם
  choice: como águas
  rationale: A preposição כ marca comparação. O plural «águas» preserva o valor formal do substantivo hebraico e comunica a imagem de algo que envolve e ameaça submergir.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão temporal que indica duração contínua; esta formulação é corrente e clara em português moderno.
- source_word: הִקִּיפוּ
  choice: me rodeiam
  rationale: O verbo é paralelo a סַבּוּנִי e reforça a imagem de cerco. «Rodeiam» preserva o paralelismo sem produzir repetição rígida.
- source_word: עָלַי
  choice: me
  rationale: Com o verbo «rodear», o pronome objeto expressa naturalmente em português a ação dirigida ao salmista, embora o hebraico use literalmente uma preposição com o sentido de «sobre/contra mim».
- source_word: יָחַד
  choice: todos juntos
  rationale: Expressa a ação coletiva e simultânea das ameaças. «Todos juntos» torna explícita, de modo natural, a força distributiva do sujeito plural.
