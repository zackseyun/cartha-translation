base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: pt
  text: Por que, ó Yahweh, rejeitas a minha alma[a] e escondes de mim o teu rosto?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mim” ou “a minha vida”. A palavra hebraica traduzida por “alma” também pode indicar a própria pessoa ou a vida.'
    reason: lexical_alternative
  - marker: b
    text: “Esconder o rosto” é uma expressão hebraica que pode indicar a retirada da presença favorável ou da atenção.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: Por que
  rationale: Interrogativo direto de causa; preserva de modo natural a força da lamentação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando seu caráter de nome pessoal.
- source_word: תִּזְנַח
  choice: rejeitas
  rationale: Expressa o sentido de repelir ou descartar, com linguagem atual e sem acrescentar a ideia mais específica de abandono.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Mantém a expressão concreta hebraica e sua intensidade poética, embora נֶפֶשׁ também possa designar a própria pessoa ou a vida.
- source_word: תַּסְתִּיר
  choice: escondes
  rationale: Equivalente direto e natural do verbo hebraico, adequado à imagem do rosto oculto.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: Preserva a imagem hebraica, que no contexto pode implicar presença, atenção e favor.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Forma portuguesa concisa e idiomática para indicar de quem o rosto é escondido.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. A transliteração preserva esse nome sem o substituir por um título; “Javé” é uma forma aportuguesada possível.
- issue: Sentido de נַפְשִׁי
  choice: a minha alma
  alternative: a mim; a minha vida
  rationale: A formulação literal preserva a antropologia e a poesia abertas do hebraico, sem decidir se o salmista se refere à sua interioridade, à sua vida ou a si mesmo como pessoa inteira.
- issue: Imagem de esconder o rosto
  choice: escondes de mim o teu rosto
  alternative: retiras de mim a tua presença favorável
  rationale: A imagem concreta é mantida para não reduzir sua amplitude teológica; ela pode comunicar retirada de presença, atenção ou favor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de segunda pessoa coerentes com “teu”. A ordem foi levemente ajustada em “escondes de mim o teu rosto” para soar natural em português, sem perder a imagem do original.
