base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: pt
  text: Tu me puseste na cova mais profunda[a], em lugares escuros, nas profundezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas regiões mais profundas da cova, nas trevas, nos abismos”.'
    reason: Alternativa lexical e sintática que explicita תַּחְתִּיּוֹת como regiões inferiores e representa os plurais poéticos de forma diferente.
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Tu me puseste
  rationale: O verbo שׁית/שׂים significa “pôr, colocar”. A forma hebraica traz Deus como sujeito na segunda pessoa e o salmista como objeto; “Tu me puseste” preserva de modo direto e digno essa atribuição.
- source_word: בְּבוֹר
  choice: na cova
  rationale: בּוֹר pode designar cova, cisterna ou poço usado como calabouço. “Cova” mantém a imagem poética de confinamento e proximidade da morte sem restringi-la indevidamente a “sepultura”.
- source_word: תַּחְתִּיּוֹת
  choice: mais profunda
  rationale: O termo indica as partes ou regiões inferiores. Ligá-lo idiomaticamente a “cova” como “a cova mais profunda” comunica o grau extremo de profundidade sem perder a força da expressão hebraica.
- source_word: בְּמַחֲשַׁכִּים
  choice: em lugares escuros
  rationale: O substantivo está no plural e pode significar “lugares escuros” ou, coletivamente, “trevas”. A tradução conserva a concretude e a pluralidade da imagem.
- source_word: בִּמְצֹלוֹת
  choice: nas profundezas
  rationale: O termo denota profundidades, muitas vezes associadas a águas profundas ou lugares abissais. “Nas profundezas” é natural em português e mantém a imagem poética aberta.
theological_decisions:
- issue: A ação de Deus no lamento
  choice: 'Preservar a interpelação direta: “Tu me puseste”'
  alternative: Empregar uma formulação impessoal que atenue a ação divina
  rationale: O hebraico apresenta explicitamente Deus como aquele que colocou o salmista nessa condição. A tradução conserva a tensão teológica própria do lamento, sem explicá-la nem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O paralelismo poético e a progressão de cova, escuridão e profundezas foram preservados.
