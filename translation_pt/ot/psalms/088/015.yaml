  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: pt
  text: Estou aflito e à beira da morte desde a juventude; tenho suportado os teus terrores; estou desnorteado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O último verbo hebraico é difícil e também pode ser traduzido por “estou dominado”, “estou confuso” ou “estou arruinado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: aflito
  rationale: No contexto de lamento, descreve sofrimento e miséria, não necessariamente pobreza econômica.
- source_word: וְגֹוֵעַ
  choice: estou à beira da morte
  rationale: O particípio expressa uma condição contínua de estar morrendo ou próximo da morte; esta formulação é natural e preserva o aspecto durativo.
- source_word: מִנֹּעַר
  choice: desde a juventude
  rationale: A preposição indica duração a partir da juventude; a expressão portuguesa dispensa explicitar o possessivo.
- source_word: נָשָׂאתִי
  choice: suporto
  rationale: נשׂא pode significar carregar ou suportar. O presente comunica a aflição contínua, embora o perfeito também permita 'tenho suportado' ou 'suportei'.
- source_word: אֵמֶיךָ
  choice: os teus terrores
  rationale: Tradução direta do plural com sufixo de segunda pessoa, preservando a atribuição dos terrores a Deus no discurso do salmista.
- source_word: אָפוּנָה
  choice: fico desnorteado
  rationale: A forma é lexicalmente difícil e pode exprimir estar confuso, dominado ou arruinado. 'Fico desnorteado' preserva a ideia de desorientação sem definir excessivamente o sentido.
theological_decisions:
- issue: Referência de “os teus terrores”
  choice: A fala se dirige diretamente a Deus e relaciona os terrores a ele, sem atenuar sua agência.
  alternative: Entender os terrores apenas como medo sentido na presença de Deus, sem que procedam de seus atos.
  rationale: O sufixo de segunda pessoa liga naturalmente os terrores a Deus. A tradução mantém a tensão teológica do lamento.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes com o discurso direto a Deus. A construção poética conserva a intensidade do lamento e sinaliza em nota a incerteza do verbo final.
