base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: pt
  text: Ó Yahweh, Deus da minha salvação, clamo de dia e de noite diante de ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino presente no hebraico e acrescenta «Ó» para expressar de modo natural o chamamento direto da oração.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Deus da minha salvação
  rationale: Reproduz a cadeia construta hebraica e conserva o sentido amplo de יְשׁוּעָה, sem restringi-lo a um tipo específico de livramento.
- source_word: יוֹם
  choice: de dia
  rationale: Valor temporal adverbial, em contraste poético com «à noite».
- source_word: צָעַקְתִּי
  choice: clamo
  rationale: Embora seja uma forma perfeita, no contexto da lamentação descreve o clamor do salmista como realidade presente e persistente; «clamo» transmite também a intensidade do verbo צעק.
- source_word: בַלַּיְלָה
  choice: à noite
  rationale: Equivalente temporal natural em português, paralelo a «de dia».
- source_word: נֶגְדֶּךָ
  choice: estou diante de ti
  rationale: A expressão significa literalmente «diante de ti». Como a oração hebraica não tem verbo expresso, «estou» é suprido para formar uma frase clara em português sem definir além do necessário a relação indicada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal divino e corresponde melhor à forma hebraica do que a alternativa tradicional «Jeová».
translation_notes:
  register: Português moderno, digno e acessível, com formulação adequada à oração poética. O paralelismo temporal «de dia… à noite» foi preservado, assim como a concisão e a tensão da frase hebraica.
