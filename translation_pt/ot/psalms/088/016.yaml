  text: A tua ira ardente passou sobre mim[a][b]; os teus terrores me destruíram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se abateu sobre mim”. O verbo hebraico significa literalmente “passou”, mas o contexto também pode sugerir uma força avassaladora.'
    reason: lexical_alternative
  - marker: b
    text: “Ira ardente” traduz uma expressão hebraica ligada à ideia de ardor; também pode ser traduzida por “furor” ou “ira feroz”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “me eliminaram” ou “me exterminaram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: sobre mim
  rationale: A preposição עַל com sufixo de primeira pessoa indica movimento dirigido sobre o salmista e combina naturalmente com o verbo seguinte.
- source_word: עָבְרוּ
  choice: passou
  rationale: O verbo עבר significa literalmente “passar” ou “atravessar”. A formulação preserva a metáfora hebraica sem explicitar além do texto a ideia de uma força avassaladora.
- source_word: חֲרוֹנֶיךָ
  choice: a tua ira ardente
  rationale: חרון designa ira intensa e conserva uma imagem associada ao ardor. Embora a forma hebraica seja plural, ela funciona aqui de modo intensivo ou abstrato e é expressa naturalmente no singular em português.
- source_word: בִּעוּתֶיךָ
  choice: os teus terrores
  rationale: O substantivo denota terrores ou coisas que causam pavor; “terrores” mantém a força e a concisão do lamento.
- source_word: צִמְּתוּתֻנִי
  choice: me destruíram
  rationale: A forma verbal de צמת pode significar destruir, exterminar ou eliminar. “Destruíram” comunica claramente a intensidade extrema da linguagem poética.
