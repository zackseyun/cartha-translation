  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: pt
  text: 'Yahweh envia de Sião o cetro do teu poder: “Governa no meio dos teus inimigos.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vara do teu poder” ou “o bastão do teu poder”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Yahweh enviará” ou, mais interpretativamente, “Yahweh estende”.
    reason: lexical_alternative
  - marker: c
    text: Ou “Governa entre os teus inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: cetro
  rationale: O substantivo pode designar vara, bastão ou cetro. No contexto régio do salmo, “cetro” preserva a imagem concreta e expressa com naturalidade a autoridade real.
- source_word: עֻזְּךָ
  choice: da sua força
  rationale: עֹז denota força ou poder. A formulação mantém o sufixo de segunda pessoa e a relação genitiva do hebraico, indicando o cetro que manifesta a força do rei.
- source_word: יִשְׁלַח
  choice: estende
  rationale: O verbo significa literalmente enviar ou fazer sair. Neste contexto, “estende” comunica de modo natural a ação de Yahweh ao fazer avançar desde Sião o domínio simbolizado pelo cetro, sem excluir a tradução mais literal “enviará”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִצִּיּוֹן
  choice: desde Sião
  rationale: Reproduz a ideia de origem espacial e preserva o nome próprio com suas associações régias e teológicas.
- source_word: רְדֵה
  choice: Governe
  rationale: O imperativo de רדה significa governar, dominar ou exercer domínio. “Governe” é claro, atual e preserva a linguagem régia sem intensificá-la indevidamente.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Traduz a expressão espacial de forma próxima ao hebraico e conserva a imagem do rei governando cercado por forças hostis.
- source_word: אֹיְבֶיךָ
  choice: seus inimigos
  rationale: Tradução direta do plural com sufixo masculino singular, referido ao rei interpelado.
theological_decisions:
- issue: Imagem régia e messiânica no Salmo 110
  choice: Preservar a linguagem do cetro, da força e do governo sem identificar explicitamente no versículo a figura régia.
  alternative: Explicitar uma leitura messiânica na tradução ou enfraquecer a linguagem régia com termos genéricos.
  rationale: O hebraico apresenta uma figura real a quem Yahweh concede autoridade. A tradução mantém tanto o sentido régio imediato quanto a abertura para a interpretação messiânica canônica, sem inserir uma conclusão doutrinária no texto.
- issue: Agente e destinatário das duas orações
  choice: Manter Yahweh como agente da primeira oração e o rei como destinatário do imperativo, indicado por dois-pontos e aspas.
  alternative: Reformular a frase para fazer de Yahweh o agente implícito do governo ou eliminar a mudança de pessoa.
  rationale: Os sufixos de segunda pessoa e o imperativo masculino singular mostram que Yahweh age em favor da pessoa interpelada e depois lhe dirige a ordem de governar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cetro” conserva a imagem régia; “Governe” evita a possível ambiguidade de “reine”, que poderia sugerir apenas portar o título. As aspas tornam explícita a passagem da declaração sobre Yahweh para a ordem dirigida ao rei. Todos os marcadores de nota aparecem no texto principal.
