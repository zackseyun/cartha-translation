source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: pt
  text: O Senhor está à sua direita[a]; no dia da sua ira, esmagará reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o senhor à sua direita”. A expressão pode referir-se ao rei/Messias a quem o salmo se dirige; outros entendem “O Senhor” aqui como Deus agindo em juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: A forma massorética é אֲדֹנָי (Adonai), convencionalmente traduzida por “Senhor”. A escolha não a substitui pelo nome divino YHWH, ausente neste versículo, e mantém aberta a identificação do referente.
- source_word: עַל יְמִינְךָ
  choice: está à sua direita
  rationale: A expressão indica posição ao lado direito de alguém. “À sua direita” é natural em português e conserva a imagem concreta de proximidade, apoio, honra ou poder.
- source_word: מָחַץ
  choice: esmagará
  rationale: O verbo expressa golpe devastador, esmagamento ou despedaçamento. O futuro comunica adequadamente a ação de juízo apresentada na sequência poética, embora a forma hebraica seja um perfeito.
- source_word: בְּיוֹם אַפּוֹ
  choice: no dia da sua ira
  rationale: Preserva a expressão temporal com “dia” e traduz o uso idiomático de אַף, literalmente ligado ao nariz, como ira intensa.
- source_word: מְלָכִים
  choice: reis
  rationale: Tradução direta do substantivo plural, mantendo explícitos os governantes sujeitos ao juízo.
theological_decisions:
- issue: Referente de אֲדֹנָי em Salmos 110:5
  choice: Traduzir de modo amplo como “O Senhor”, sem identificar explicitamente o referente.
  alternative: Entender o Senhor como Deus agindo em juízo; ou entender o senhor à direita como o rei/Messias mencionado no salmo.
  rationale: O hebraico traz אֲדֹנָי, não o nome YHWH, e a sintaxe admite leituras diferentes quanto ao sujeito. O texto principal conserva essa tensão e a nota registra as interpretações principais sem decidir doutrinariamente entre elas.
- issue: Valor temporal de מָחַץ
  choice: Usar o futuro, “esmagará”.
  alternative: Traduzir como passado, “esmagou”, ou como presente, “esmaga”.
  rationale: Embora o verbo esteja no perfeito hebraico, o contexto de pronunciamento poético e juízo favorece em português uma ação futura ou profeticamente apresentada. A escolha evita uma construção artificial sem alterar o caráter decisivo da ação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Mantém a imagem hebraica da mão direita em forma idiomática portuguesa e preserva por nota a ambiguidade sobre o referente de “Senhor”.
