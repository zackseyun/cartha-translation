base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: pt
  text: Ele julgará entre as nações; encherá de cadáveres[a]; esmagará a cabeça sobre uma vasta terra[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é conciso e não explicita o que será enchido de cadáveres.
    reason: lexical_alternative
  - marker: b
    text: “Cabeça” está no singular e também pode ser entendida como “um chefe” ou, coletivamente, como “cabeças”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “esmagará a cabeça de uma vasta terra”. “Terra” também pode significar a terra inteira, isto é, o mundo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: julgará
  rationale: O qal imperfeito na poesia admite valor futuro; “julgará” conserva o sentido judicial sem explicitar além do texto a execução punitiva implícita no contexto.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם significa naturalmente “nações”, e בְּ indica aqui o âmbito em que o julgamento ocorre.
- source_word: מָלֵא גְוִיּוֹת
  choice: encherá tudo de cadáveres
  rationale: A expressão hebraica é elíptica e não declara o objeto de “encher”. “Tudo” produz português natural, mas permanece uma complementação contextual e por isso é assinalado em nota.
- source_word: גְוִיּוֹת
  choice: cadáveres
  rationale: O termo designa corpos mortos; “cadáveres” preserva de modo direto a violência da cena de batalha.
- source_word: מָחַץ
  choice: esmagará
  rationale: O verbo descreve um golpe violento que quebra ou esmaga; a escolha é vívida, atual e adequada ao contexto marcial.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: Mantém-se o substantivo concreto no singular, sem decidir se é coletivo, se significa um governante ou se aponta para um inimigo específico.
- source_word: עַל אֶרֶץ רַבָּה
  choice: por uma vasta terra
  rationale: A construção pode indicar extensão espacial sobre uma terra ampla. “Por uma vasta terra” é idiomático em português e evita transformar silenciosamente אֶרֶץ em “mundo”.
theological_decisions:
- issue: Referente e alcance da expressão singular רֹאשׁ em um salmo régio-messiânico
  choice: Manter “a cabeça” no singular, sem identificar seu referente.
  alternative: “um chefe”, “cabeças” em sentido coletivo ou um inimigo supremo específico
  rationale: Embora o salmo tenha leitura cristológica tradicional, o hebraico deste versículo não identifica explicitamente a cabeça; a tradução preserva essa tensão.
- issue: Alcance de אֶרֶץ na cláusula final
  choice: Traduzir por “terra” no sentido territorial, sem universalizar.
  alternative: “a terra” no sentido do mundo inteiro
  rationale: אֶרֶץ pode designar tanto uma região como toda a terra. A opção principal mantém o alcance mais aberto, e a alternativa ampla fica registrada em nota.
- issue: Relação sintática de עַל אֶרֶץ רַבָּה
  choice: Entender a expressão como extensão espacial do ato de esmagar.
  alternative: 'Entendê-la como domínio da cabeça: “a cabeça de uma vasta terra”'
  rationale: A sintaxe poética é concisa. O sentido espacial preserva mais diretamente עַל, mas a leitura relacional é genuinamente possível e deve ser indicada.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com paralelismo futuro preservado. A imagem violenta não foi suavizada. As elipses e ambiguidades relevantes do hebraico foram mantidas no texto ou explicitadas em notas.
