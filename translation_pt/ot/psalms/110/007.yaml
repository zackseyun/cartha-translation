source:
  edition: WLC
  text: מִ֭/נַּחַל בַּ/דֶּ֣רֶךְ יִשְׁתֶּ֑ה עַל כֵּ֝֗ן יָרִ֥ים רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/007.yaml
  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
translation:
  language: pt
  text: No caminho, ele beberá da torrente[a]; por isso, levantará a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do riacho” ou “do curso de água”. O termo hebraico pode designar uma torrente, um riacho, seu leito ou um curso de água sazonal.
    reason: lexical_alternative
  - marker: b
    text: A expressão “levantar a cabeça” pode sugerir força renovada, confiança ou exaltação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: da torrente
  rationale: נחל pode designar uma torrente, um riacho, o leito de um curso de água ou um curso sazonal. “Torrente” preserva a imagem poética e se ajusta bem ao cenário do salmo, sem recorrer ao menos conhecido “uádi”.
- source_word: בַּדֶּרֶךְ
  choice: No caminho
  rationale: דרך significa “caminho, estrada, jornada”. “No caminho” é natural no português atual e conserva a ideia de beber durante o percurso.
- source_word: יִשְׁתֶּה
  choice: ele beberá
  rationale: O imperfeito hebraico admite valor futuro ou habitual. O futuro se harmoniza com a sequência verbal do salmo, sem explicitar a identidade do sujeito masculino singular.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: A expressão introduz consequência ou resultado. “Por isso” comunica com naturalidade a ligação entre beber e levantar a cabeça.
- source_word: יָרִים רֹאשׁ
  choice: levantará a cabeça
  rationale: A tradução mantém a imagem hebraica, que pode sugerir força renovada, confiança ou exaltação, sem reduzir sua amplitude a uma única interpretação.
theological_decisions:
- issue: Referente dos verbos no masculino singular neste salmo real
  choice: Manter “ele” sem identificar expressamente o referente.
  alternative: Identificá-lo como o rei davídico, o rei-sacerdote a quem o salmo se dirige ou o Messias segundo a leitura canônica posterior.
  rationale: O hebraico apresenta um sujeito masculino singular não expresso. A tradução não insere uma identificação cristológica nem exclui a leitura messiânica tradicional.
- issue: Sentido de “levantará a cabeça”
  choice: Preservar literalmente a metáfora.
  alternative: Explicitar como “recuperará as forças”, “triunfará” ou “será exaltado”.
  rationale: A expressão poética pode reunir renovação, confiança e exaltação; escolher apenas uma dessas ideias eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português, e as notas preservam a amplitude lexical e metafórica do hebraico.
