  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: pt
  text: 'Javé jurou e não voltará atrás: “Tu és sacerdote para sempre, à maneira de Melquisedeque.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “segundo a minha palavra” ou “pelo meu decreto, Melquisedeque”; a expressão hebraica é difícil, e “Melquisedeque” também pode ser entendido como vocativo. Alguns a entendem como “à maneira de Melquisedeque”.
    reason: alternative_reading
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O perfeito hebraico apresenta um juramento divino solene e consumado; “jurou” é direto e natural em português.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera de forma reconhecível em português o nome divino, preservando sua referência pactual.
- source_word: וְלֹא יִנָּחֵם
  choice: e não voltará atrás
  rationale: Neste contexto, o nifal de נחם indica que Javé não revogará nem reconsiderará o juramento; a expressão portuguesa comunica com naturalidade sua irrevogabilidade.
- source_word: אַתָּה כֹהֵן
  choice: Você é sacerdote
  rationale: Preserva a interpelação direta e expressa naturalmente em português o predicativo que designa o ofício.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a formulação portuguesa corrente para duração permanente neste contexto.
- source_word: עַל דִּבְרָתִי
  choice: à maneira de
  rationale: A expressão hebraica é difícil; esta tradução comunica a ideia provável de padrão ou modalidade associada a Melquisedeque sem impor a formulação técnica “ordem” ao texto principal.
- source_word: מַלְכִּי־צֶדֶק
  choice: Melquisedeque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Sentido de עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: à maneira de Melquisedeque
  alternative: segundo a minha palavra/o meu decreto, Melquisedeque
  rationale: A sintaxe hebraica admite mais de uma compreensão. A leitura que associa o sacerdócio a um padrão representado por Melquisedeque é coerente com o contexto e com a recepção antiga, mas a alternativa mais literal é mantida em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. “Javé” preserva o nome divino; “não voltará atrás” evita o sentido moral moderno que “arrepender-se” poderia sugerir.
