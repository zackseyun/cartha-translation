base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: pt
  text: 'De Davi.[a] Salmo.


    Yahweh declara ao meu senhor:[b]


    “Sente-se à minha direita,

    até que eu faça dos seus inimigos

    um estrado para os seus pés.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “para Davi”, “por Davi” ou “pertencente a Davi”. A expressão hebraica do título permite mais de uma relação com Davi.
    reason: lexical_alternative
  - marker: b
    text: O hebraico distingue Yahweh, o nome divino, de “meu senhor”, um título de respeito.
    reason: lexical_alternative
  - marker: c
    text: A imagem também pode ser expressa de modo mais interpretativo como “debaixo dos seus pés”. O hebraico diz literalmente “um estrado para os seus pés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, pertença, dedicação ou associação. “De Davi” é natural em português e preserva melhor essa amplitude do que “escrito por Davi”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Equivalente consagrado e adequado para a designação do gênero poético-musical.
- source_word: נְאֻם
  choice: Declaração
  rationale: O substantivo introduz uma fala solene, muitas vezes divina. “Declaração” conserva essa força oracular melhor do que o simples verbo “diz”, sem tornar a frase obscura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue do título אֲדֹנִי que aparece logo depois.
- source_word: לַאדֹנִי
  choice: ao meu senhor
  rationale: אֲדֹנִי é um título honorífico com sufixo de primeira pessoa, “meu senhor”, distinto do nome divino Yahweh. A inicial minúscula evita impor tipograficamente uma identificação teológica posterior.
- source_word: שֵׁב
  choice: sente-se
  rationale: Imperativo singular de ישׁב. “Sente-se” é idiomático no português moderno e, junto de “à minha direita”, mantém a imagem de entronização e honra.
- source_word: לִימִינִי
  choice: à minha direita
  rationale: Expressão natural em português que preserva a metáfora bíblica de honra, autoridade e entronização.
- source_word: עַד
  choice: até que
  rationale: Mantém o valor temporal da construção hebraica sem definir além do texto o que sucede depois do ponto indicado.
- source_word: אָשִׁית
  choice: eu faça
  rationale: O verbo שׁית significa pôr ou colocar; na construção resultativa com “estrado”, “faça... um estrado” comunica naturalmente o sentido.
- source_word: אֹיְבֶיךָ
  choice: seus inimigos
  rationale: Tradução direta do substantivo plural com sufixo masculino singular.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: um estrado para os seus pés
  rationale: “Estrado para os pés” preserva a imagem régia de vitória e submissão, além de representar diretamente a preposição לְ, sem substituí-la no texto principal por “debaixo dos seus pés”.
theological_decisions:
- issue: Distinção entre יְהוָה e אֲדֹנִי
  choice: Yahweh ... meu senhor
  alternative: SENHOR ... meu Senhor
  rationale: O hebraico emprega o nome divino no primeiro caso e um título honorífico no segundo. Traduzir de formas distintas torna essa diferença visível e evita confundir as duas expressões.
- issue: Identidade do referente de “meu senhor”
  choice: senhor com inicial minúscula
  alternative: Senhor com inicial maiúscula
  rationale: O texto hebraico apresenta um título, não um nome próprio. A tradução mantém aberta a identificação do personagem e não insere por meio da capitalização uma conclusão cristológica posterior, embora o uso messiânico do versículo no cânon permaneça possível.
- issue: Valor temporal de עַד
  choice: até que
  alternative: enquanto
  rationale: “Até que” reproduz a forma temporal mais direta, mas não deve ser entendido como afirmação de que a posição de honra necessariamente termina quando os inimigos são subjugados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo foi disposto em linhas poéticas. “Estrado” preserva a imagem tradicional sem recorrer ao menos corrente “escabelo”.
