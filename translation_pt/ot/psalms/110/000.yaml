  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: pt
  text: 'De Davi[a]. Salmo.


    Yahweh[b] declara ao meu senhor[c]:


    “Sente-se à minha direita,

    até que eu faça dos seus inimigos

    um estrado para os seus pés[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “por Davi”, “para Davi” ou “a respeito de Davi”.
    reason: lexical_alternative
  - marker: b
    text: Yahweh representa o nome divino escrito em hebraico com as quatro consoantes YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico distingue YHWH, o nome divino, de adoni, “meu senhor”; o verso não identifica explicitamente esse senhor.
    reason: theological_ambiguity
  - marker: d
    text: Isto é, em posição de completa submissão sob os seus pés.
    reason: idiom_explanation
lexical_decisions:
- source_word: לְדָוִד (leDavid)
  choice: De Davi
  rationale: Reproduz a atribuição tradicional do cabeçalho sem definir de modo excessivo a relação expressa pela preposição hebraica.
- source_word: נְאֻם (ne’um)
  choice: declara
  rationale: Comunica em português corrente a ideia de pronunciamento solene ou oráculo, mantendo a introdução direta da fala.
- source_word: יְהוָה (YHWH)
  choice: Yahweh
  rationale: Representa o nome divino como nome próprio e o distingue de אֲדֹנִי, “meu senhor”.
- source_word: לַאדֹנִי (la’adoni)
  choice: ao meu senhor
  rationale: Mantém a distinção lexical entre o nome divino e o título dado ao destinatário, sem determinar explicitamente sua identidade.
- source_word: הֲדֹם לְרַגְלֶיךָ (hadom leraglekha)
  choice: um estrado para os seus pés
  rationale: Conserva a imagem concreta do hebraico em linguagem natural e dignificada.
theological_decisions:
- issue: Identidade de “meu senhor”
  choice: meu senhor, em minúsculas
  alternative: meu Senhor, com maiúscula
  rationale: O hebraico distingue adoni de YHWH, mas o próprio verso não explicita a identidade do destinatário. A forma em minúsculas evita inserir na tradução uma conclusão interpretativa posterior.
- issue: Valor do cabeçalho לְדָוִד
  choice: De Davi
  alternative: Por Davi; para Davi; a respeito de Davi
  rationale: “De Davi” preserva a formulação tradicional e uma medida da amplitude semântica da preposição hebraica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A disposição em linhas preserva o caráter poético. “Estrado” mantém a imagem régia sem recorrer ao menos corrente “escabelo”; “meu senhor” evita capitalização interpretativa.
