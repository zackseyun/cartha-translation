base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: pt
  text: O teu povo se apresentará voluntariamente no dia do teu poder[a], em santo esplendor[b]; desde o ventre da aurora, a ti pertence o orvalho da tua juventude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia da tua força” ou “no dia do teu exército”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em trajes santos”, “em santo aparato” ou “nos esplendores da santidade”.'
    reason: lexical_alternative
  - marker: c
    text: O último trecho é difícil. Pode significar que os jovens do rei são para ele como o orvalho que procede do ventre da aurora, ou pode falar do frescor da sua juventude.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Mantém o sentido lexical comum de עַם, “povo”, sem restringi-lo a exército ou tropas, embora o contexto tenha imagens militares.
- source_word: נְדָבֹת
  choice: se apresentará voluntariamente
  rationale: O plural nominal designa ofertas voluntárias e, em construção predicativa com “teu povo”, descreve poeticamente a entrega espontânea do povo. A formulação verbal comunica isso com clareza em português.
- source_word: בְּיוֹם חֵילֶךָ
  choice: no dia do teu poder
  rationale: “No dia de” expressa naturalmente o valor temporal; חַיִל pode indicar força, poder ou exército. “Poder” preserva a amplitude sem impor uma leitura exclusivamente militar.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: em santo esplendor
  rationale: Conserva a ambiguidade poética entre esplendor caracterizado pela santidade, adornos sagrados e vestes cerimoniais.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: desde o ventre da aurora
  rationale: Preserva a metáfora vívida de origem ou nascimento e traduz מִשְׁחָר como “aurora”, em registro poético natural.
- source_word: לְךָ
  choice: a ti pertence
  rationale: Explicita em português a relação possessiva implícita na preposição hebraica, sem eliminar a concisão poética.
- source_word: טַל
  choice: o orvalho
  rationale: Mantém literalmente a imagem poética central.
- source_word: יַלְדֻתֶיךָ
  choice: tua juventude
  rationale: Preserva a leitura lexical de juventude ou vigor juvenil e evita decidir se o termo representa coletivamente os jovens guerreiros.
theological_decisions:
- issue: Sentido do último segmento do versículo
  choice: 'Manter a declaração poética: “a ti pertence o orvalho da tua juventude”.'
  alternative: “Teus jovens vêm a ti como o orvalho desde o ventre da aurora”, ou uma leitura cristológica ligada à geração.
  rationale: O hebraico é comprimido e notoriamente difícil. A tradução conserva as imagens e a tensão interpretativa, sem impor uma conclusão sobre vigor juvenil, jovens seguidores ou geração messiânica.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação dos marcadores acompanha exatamente os pontos de ambiguidade; a ordem b/c foi regularizada em relação à camada inglesa.
