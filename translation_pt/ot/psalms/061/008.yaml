  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: pt
  text: Assim, cantarei louvores ao teu nome para sempre, para cumprir os meus votos[a] dia após dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pagar os meus votos dia após dia”. O verbo hebraico pode significar “pagar” ou, de maneira mais ampla, “cumprir” quando se refere a votos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Liga o versículo à oração e à confiança anteriores, exprimindo consequência ou resolução de modo natural em português.
- source_word: אֲזַמְּרָה
  choice: cantarei louvores
  rationale: O piel de זמר indica cantar ou fazer música em louvor; a formulação explicita naturalmente o sentido cultual.
- source_word: שִׁמְךָ
  choice: ao teu nome
  rationale: Preserva a expressão hebraica, que pode abranger o caráter revelado e a reputação de Deus.
- source_word: לָעַד
  choice: para sempre
  rationale: Expressa duração contínua e indefinida em português corrente e digno.
- source_word: לְשַׁלְּמִי
  choice: cumprindo
  rationale: Com votos como objeto, o piel de שלם pode significar pagar ou cumprir. O gerúndio reproduz de modo fluente a relação entre o louvor contínuo e o cumprimento diário dos votos.
- source_word: נְדָרַי
  choice: os meus votos
  rationale: Equivalente direto e contextualmente adequado para compromissos solenes assumidos diante de Deus.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: A repetição hebraica comunica regularidade contínua; esta expressão mantém sua força iterativa em português natural.
