  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: pt
  text: Que eu habite na tua tenda para sempre[a] e me refugie no abrigo das tuas asas. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Habitarei na tua tenda para sempre”. A forma hebraica pode expressar um forte desejo ou propósito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: Que eu habite
  rationale: O coortativo qal na primeira pessoa expressa desejo ou súplica. “Que eu habite” preserva essa nuance volitiva e soa natural em português.
- source_word: בְ֭/אָהָלְ/ךָ
  choice: na tua tenda
  rationale: אָהֶל significa literalmente “tenda”. A expressão pode evocar o santuário e a presença de Deus, mas manter a imagem concreta evita especificá-la além do hebraico.
- source_word: עוֹלָמִ֑ים
  choice: para sempre
  rationale: O plural idiomático intensifica a duração; “para sempre” comunica isso com naturalidade no português atual.
- source_word: אֶֽחֱסֶ֨ה
  choice: me refugie
  rationale: חסה significa buscar ou encontrar refúgio. Em paralelo com o coortativo anterior, o subjuntivo dependente de “Que eu” mantém a força volitiva da oração.
- source_word: בְ/סֵ֖תֶר
  choice: no abrigo
  rationale: סֵתֶר designa lugar oculto ou protegido. “Abrigo” comunica proteção sem perder a imagem poética.
- source_word: כְּנָפֶ֣י/ךָ
  choice: das tuas asas
  rationale: Preserva literalmente a metáfora das asas e a relação expressa em “no abrigo das tuas asas”.
- source_word: סֶּֽלָה
  choice: Selá
  rationale: Como o sentido preciso do termo litúrgico ou musical é incerto, ele é transliterado em vez de traduzido conjecturalmente.
theological_decisions:
- issue: Imagem do santuário em “tua tenda”
  choice: Manter “tua tenda”
  alternative: teu tabernáculo; teu santuário; tua morada
  rationale: A tenda provavelmente evoca o lugar da presença de Deus, mas o texto emprega a imagem concreta de uma tenda. Mantê-la preserva a abertura poética e evita impor uma identificação cultual ou celestial específica.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com a linguagem poética e devocional. A coordenação “Que eu habite... e me refugie” reproduz de modo natural o paralelismo e a força volitiva. “Selá” segue a acentuação portuguesa corrente.
