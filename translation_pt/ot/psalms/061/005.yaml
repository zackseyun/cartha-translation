source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: pt
  text: Pois tu, ó Deus, ouviste os meus votos; concedeste a herança[a] dos que temem o teu nome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode entender: “concedeste-me a herança dos que temem o teu nome”. O hebraico não declara explicitamente “a mim”, embora o contexto possa indicar esse destinatário.'
    reason: alternative_reading
  - marker: b
    text: “Temer o teu nome” significa viver em temor reverente diante de Deus; o “nome” representa o próprio Deus conforme ele se dá a conhecer.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da confiança expressa no contexto anterior, preservando a função conectiva do hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto de segunda pessoa indica tratamento direto; a forma vocativa é natural em uma oração solene em português.
- source_word: שָׁמַעְתָּ
  choice: ouviste
  rationale: O perfeito hebraico apresenta a ação como realizada. O pretérito perfeito é claro e idiomático, sem excluir sua relevância presente.
- source_word: לִנְדָרָי
  choice: os meus votos
  rationale: נֶדֶר designa normalmente um voto feito a Deus, não necessariamente a oferta associada ao seu cumprimento.
- source_word: נָתַתָּ
  choice: concedeste
  rationale: Expressa o ato de dar como concessão divina e permite preservar em português a ausência de um destinatário explícito no hebraico.
- source_word: יְרֻשַּׁת
  choice: a herança
  rationale: O termo denota herança, patrimônio ou posse recebida; 'herança' mantém sua força concreta e sua possível ressonância pactual.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: dos que temem o teu nome
  rationale: Tradução transparente da construção hebraica, preservando o peso teológico de 'temer' em vez de reduzi-lo apenas a respeito ou admiração.
theological_decisions:
- issue: Destinatário implícito em נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ
  choice: concedeste a herança dos que temem o teu nome
  alternative: concedeste-me a herança dos que temem o teu nome
  rationale: O hebraico não traz pronome ou objeto indireto equivalente a 'me'. A leitura com o salmista como destinatário é plausível pelo contexto, mas não deve ser inserida silenciosamente no texto principal.
- issue: Sentido de יִרְאֵי שְׁמֶךָ
  choice: os que temem o teu nome
  alternative: os que reverenciam o teu nome
  rationale: No idioma bíblico, o temor do nome de Deus abrange reverência, lealdade e submissão. Manter 'temem' preserva a tensão e a amplitude do termo.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. O uso de “tu” acompanha o tratamento direto do hebraico e mantém o tom de oração. “Concedeste” evita completar indevidamente o verbo com “me”, sem produzir uma construção truncada.
