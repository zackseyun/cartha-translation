base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: pt
  text: Desde os confins da terra clamo a ti quando meu coração desfalece[a]; guia-me à rocha mais alta do que eu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando meu coração está sobrecarregado».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «à rocha alta demais para mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Desde os confins da terra
  rationale: קָצֶה indica extremidade ou limite. A expressão portuguesa «os confins da terra» comunica distância extrema, preserva o alcance poético e é natural em registro bíblico moderno.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: clamo a ti
  rationale: קרא pode significar chamar ou clamar. «Clamo» expressa adequadamente a urgência da oração sem acrescentar conteúdo não explícito.
- source_word: בַּעֲטֹף לִבִּי
  choice: quando meu coração desfalece
  rationale: עטף, nesta construção, descreve fraqueza interior, desfalecimento ou o estado de estar sobrecarregado. «Desfalece» conserva a imagem do vigor que se esvai; a alternativa «fica abatido» é registrada em nota.
- source_word: בְּצוּר
  choice: à rocha
  rationale: צוּר significa literalmente «rocha» e evoca segurança e refúgio. Mantém-se a metáfora concreta, em vez de substituí-la por sua interpretação.
- source_word: יָרוּם מִמֶּנִּי
  choice: mais alta do que eu
  rationale: רוּם significa ser alto ou elevado, e מִמֶּנִּי forma aqui uma comparação. Esta tradução preserva o sentido comparativo sem transformar implicitamente a altura em impossibilidade; essa leitura possível aparece em nota.
- source_word: תַנְחֵנִי
  choice: guia-me
  rationale: נחה no Hifil significa conduzir ou guiar. «Guia-me» soa natural com o destino indicado e expressa a dependência do suplicante.
theological_decisions:
- issue: Força metafórica de «rocha»
  choice: Conservar «rocha» como imagem de refúgio seguro, sem identificar ou explicar explicitamente a metáfora no texto principal.
  alternative: Traduzir como «lugar seguro» ou «refúgio».
  rationale: O hebraico emprega a imagem concreta צוּר. Preservá-la mantém a poesia e sua ressonância teológica sem reduzir a metáfora a uma interpretação.
- issue: Sentido de יָרוּם מִמֶּנִּי
  choice: 'Traduzir como comparação: «mais alta do que eu».'
  alternative: «alta demais para mim».
  rationale: A construção admite uma comparação direta e pode sugerir inacessibilidade. O texto principal evita resolver essa nuance; a leitura de incapacidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Confins» preserva a elevação poética sem arcaísmo excessivo; «clamo» e «guia-me» mantêm o tom direto de oração. Os marcadores aparecem junto às expressões a que se referem, em ordem [a], [b].
