source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: pt
  text: Que acrescentes dias aos dias do rei[a]; que os seus anos durem de geração em geração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acrescentarás dias aos dias do rei”. A forma verbal hebraica também pode ser entendida como uma declaração futura, em vez de uma oração.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “como geração e geração”, expressão hebraica que indica continuidade por sucessivas gerações.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: dias aos dias do rei
  rationale: Mantém a imagem hebraica de acrescentar “dias” aos dias já vividos pelo rei, em português claro, e preserva o paralelismo com “anos”.
- source_word: תּוֹסִיף
  choice: Que acrescentes
  rationale: O imperfeito hifil de יסף significa “acrescentar”. No contexto de oração, a construção optativa portuguesa expressa adequadamente uma petição dirigida a Deus, sem ocultar na nota a possível leitura como futuro.
- source_word: שְׁנוֹתָיו
  choice: os seus anos
  rationale: O sufixo masculino singular remete naturalmente ao rei; “seus anos” conserva a referência e o paralelismo temporal.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: durem de geração em geração
  rationale: A repetição “geração e geração” indica sucessão contínua. A formulação portuguesa comunica esse valor idiomático de modo natural; “durem” explicita o sentido requerido pela frase nominal no contexto.
theological_decisions:
- issue: Se תּוֹסִיף deve ser entendido como declaração futura ou como pedido pela longevidade do rei
  choice: 'Petição: “Que acrescentes...”'
  alternative: 'Declaração futura: “Acrescentarás...”'
  rationale: Embora a forma verbal possa indicar futuro, o contexto de súplica do salmo favorece a leitura optativa. A alternativa legítima é preservada em nota, sem transformar a ambiguidade em certeza profética.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de oração poética. Conserva-se a imagem hebraica “dias aos dias”; a segunda linha é vertida idiomaticamente como “de geração em geração” para evitar uma construção obscura em português.
