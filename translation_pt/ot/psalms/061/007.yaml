id: PSA.61.7
reference: Psalms 61:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: pt
  text: Que ele permaneça entronizado para sempre diante de Deus[a]; designa o amor leal e a verdade[b] para que o guardem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ele habite para sempre diante de Deus”. O verbo hebraico pode significar sentar-se, permanecer ou habitar; neste contexto régio, pode também sugerir estar entronizado.'
    reason: lexical_alternative
  - marker: b
    text: “Verdade” também pode ser traduzida por “fidelidade” aqui. A expressão hebraica “amor leal e verdade/fidelidade” descreve com frequência a lealdade e a confiabilidade de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Que ele permaneça entronizado
  rationale: O imperfeito qal de ישׁב pode significar sentar-se, permanecer ou habitar e, em contexto régio, pode ter nuance de entronização. A formulação portuguesa expressa a oração por um reinado duradouro sem ocultar a alternativa lexical indicada na nota.
- source_word: עוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua de modo natural, atual e poeticamente adequado em português.
- source_word: לִפְנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: Preserva de modo conciso tanto a ideia espacial de estar perante Deus quanto a de viver ou reinar em sua presença.
- source_word: חֶסֶד
  choice: amor leal
  rationale: חֶסֶד reúne as ideias de amor, compromisso e lealdade. “Amor leal” comunica essa riqueza melhor que o sentido mais restrito de “misericórdia”.
- source_word: אֱמֶת
  choice: verdade
  rationale: Mantém a correspondência lexical direta, enquanto a nota registra “fidelidade”, alternativa especialmente forte nesta combinação tradicional.
- source_word: מַן
  choice: designa
  rationale: Entendido como imperativo dirigido a Deus, com o sentido de nomear ou encarregar o amor leal e a verdade de proteger o rei.
- source_word: יִנְצְרֻהוּ
  choice: para que o guardem
  rationale: O verbo plural apresenta o amor leal e a verdade como agentes personificados que guardam ou preservam o rei; a construção final é clara e natural em português.
theological_decisions:
- issue: Valor do imperfeito em uma oração régia
  choice: 'Desejo ou petição: “Que ele permaneça entronizado”'
  alternative: 'Predição simples: “Ele permanecerá entronizado”'
  rationale: O contexto próximo é de súplica, e o segundo membro contém um imperativo dirigido a Deus. A leitura optativa mantém a unidade do versículo, enquanto a nota preserva a amplitude lexical do verbo.
- issue: Sentido da expressão חֶסֶד וֶאֱמֶת
  choice: 'Qualidades divinas personificadas: “o amor leal e a verdade”'
  alternative: “o amor leal e a fidelidade” ou “a misericórdia e a verdade”
  rationale: A dupla expressão evoca a lealdade e a confiabilidade de Deus. O texto principal conserva “verdade”, e a nota registra “fidelidade” como alternativa contextual importante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético e a personificação das qualidades divinas; as notas mantêm abertas as ambiguidades lexicais genuínas.
