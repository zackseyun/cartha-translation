  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: pt
  text: Ao regente; com instrumentos de cordas. De Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por Davi” ou “Para Davi”; a construção hebraica pode indicar autoria, associação ou dedicação.
