lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente quem dirigia a execução musical. “Ao regente” é claro, conciso e não limita a função à direção de um coro.
- source_word: עַל
  choice: com
  rationale: Neste contexto musical, a preposição introduz provavelmente o acompanhamento; “com” expressa isso de modo natural em português.
- source_word: נְגִינַת
  choice: instrumentos de cordas
  rationale: O termo se refere à música ou ao acompanhamento produzido por cordas; a formulação escolhida comunica de forma direta o sentido musical provável.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A construção com לְ nos títulos pode indicar autoria, associação ou dedicação. “De Davi” preserva melhor essa amplitude do que uma formulação explicitamente autoral.
theological_decisions:
- issue: O lamed na atribuição davídica
  choice: De Davi
  alternative: Por Davi; para Davi
  rationale: O hebraico não exige que se determine exclusivamente autoria direta, associação ou dedicação. A tradução mantém essa ambiguidade sem impor uma conclusão histórica ou teológica mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com formulação tradicional o bastante para um título de salmo. O marcador [a] foi colocado imediatamente após “Davi”, expressão explicada pela nota.
