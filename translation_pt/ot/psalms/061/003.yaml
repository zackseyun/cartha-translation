lexical_decisions:
- source_word: מַחְסֶה
  choice: refúgio
  rationale: Equivalente natural e direto para um lugar de proteção ou abrigo, preservando a metáfora do hebraico.
- source_word: מִגְדַּל עֹז
  choice: torre forte
  rationale: Expressa de modo claro e digno a construção hebraica, literalmente uma torre de força, sem tornar a frase artificial em português.
- source_word: מִפְּנֵי אוֹיֵב
  choice: contra o inimigo
  rationale: Neste contexto, a preposição indica proteção diante da ameaça inimiga; 'contra' preserva a função defensiva da torre e concorda com a evidência contextual.
theological_decisions:
- issue: Valor da imagem de Deus como proteção
  choice: 'Preservar as duas metáforas: ''refúgio'' e ''torre forte'''
  alternative: Explicitar como 'aquele que me protege'
  rationale: O paralelismo poético atribui diretamente a Deus imagens concretas de segurança; explicá-las reduziria a força e a abertura poética do texto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. O perfeito hebraico foi vertido por 'tens sido', que comunica uma experiência passada com continuidade ou relevância presente.
