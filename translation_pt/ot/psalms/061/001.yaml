  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: pt
  text: Ouve, ó Deus, o meu clamor[a]; escuta a minha oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu brado” ou “a minha súplica”. O substantivo hebraico pode indicar um grito forte e, em alguns contextos, um grito ou canto de alegria; aqui, o contexto de oração favorece a ideia de uma súplica urgente.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Ouve
  rationale: Imperativo qal de שׁמע dirigido a Deus. “Ouve” é direto, natural na linguagem de oração e preserva a metáfora auditiva.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O termo funciona como vocativo. “Ó Deus” expressa de modo claro e digno a invocação direta.
- source_word: רִנָּתִי
  choice: o meu clamor
  rationale: רִנָּה pode designar um grito sonoro, um brado ou, conforme o contexto, um canto jubiloso. Em paralelo com “minha oração”, aqui indica melhor um pedido urgente.
- source_word: הַקְשִׁיבָה
  choice: escuta
  rationale: Imperativo hifil de קשׁב, que solicita atenção auditiva. “Escuta” é corrente em português e conserva a ideia de ouvir atentamente.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: Tradução direta do termo comum para oração, preservando o paralelismo sem o confundir com “clamor”.
