  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: pt
  text: E a ti, ó Senhor, pertence o amor leal[a], pois retribuis a cada um segundo a sua obra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E teu, ó Senhor, é o amor leal”. O hebraico não traz verbo expresso e coloca “a ti” no início, enfatizando que o amor leal pertence ao Senhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  choice: E a ti ... pertence
  rationale: A expressão preposicional vem à frente para dar ênfase e, numa oração hebraica sem verbo expresso, indica posse ou atribuição. “Pertence” supre naturalmente a cópula em português e preserva a ênfase.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: É o título divino Adonai. A partícula “ó” marca a interpelação direta própria da oração poética.
- source_word: חָסֶד
  choice: amor leal
  rationale: חסד reúne amor, bondade, misericórdia e fidelidade relacional. “Amor leal” é conciso, atual e preserva tanto o afeto quanto a constância, sem reduzir o termo apenas à misericórdia.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou explicação da afirmação anterior; “pois” mantém essa relação em linguagem poética concisa.
- source_word: תְשַׁלֵּם
  choice: retribuis
  rationale: O piel de שלם indica dar a alguém o que lhe corresponde, positiva ou negativamente. “Retribuis” abrange recompensa e juízo sem limitar o sentido a um deles.
- source_word: לְאִישׁ
  choice: a cada um
  rationale: Embora אִישׁ seja masculino singular, aqui tem força distributiva e representativa. “A cada um” é natural em português, conserva o singular distributivo e não restringe indevidamente a declaração a homens.
- source_word: כְּמַעֲשֵׂהוּ
  choice: segundo a sua obra
  rationale: Mantém a correspondência expressa por כְּ, o substantivo singular “obra” e a referência individual do sufixo, em formulação portuguesa clara e tradicional sem ser arcaica.
theological_decisions:
- issue: Relação entre o amor leal de Deus e a retribuição divina
  choice: Manter juntos o amor leal e a retribuição segundo a obra de cada um, sem suavizar nenhum dos dois.
  alternative: Entender חסד apenas como misericórdia ou traduzir תשלם somente como recompensa positiva.
  rationale: O próprio versículo põe o amor leal de Deus ao lado de sua retribuição justa. “Amor leal” conserva a dimensão relacional e fiel, enquanto “retribuis” deixa em aberto tanto a recompensa quanto o juízo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem marcada “E a ti” preserva a ênfase poética do hebraico; “retribuis” mantém a ambivalência entre recompensa e juízo.
