translation:
  language: pt
  text: Somente em Deus, aquieta-te, minha alma[a][b], pois dele vem a minha esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somente em Deus a minha alma espera em silêncio”, entendendo o verbo como uma declaração, não como uma exortação.'
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico pode transmitir a ideia de ficar em silêncio, aquietar-se ou esperar em silêncio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: Marca exclusividade e restringe a orientação da alma a Deus; “somente” preserva essa ênfase sem deslocá-la para a frase final.
- source_word: לֵאלֹהִים
  choice: para Deus
  rationale: Mantém a preposição ל e expressa a orientação exclusiva da alma para Deus.
- source_word: דּוֹמִּי
  choice: fique em silêncio
  rationale: A forma massorética é entendida como uma exortação dirigida à própria alma. A tradução conserva diretamente a ideia de silêncio, sem acrescentar explicitamente o verbo “esperar”.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva a linguagem hebraica de autoexortação e permanece natural no registro poético dos Salmos.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação de modo claro e conciso.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: Retoma Deus e preserva a coesão pronominal do hebraico, sem acrescentar aqui a exclusividade já expressa por אַךְ.
- source_word: תִּקְוָתִי
  choice: a minha esperança
  rationale: É a tradução corrente e contextualmente adequada de תִּקְוָה, comunicando expectativa confiante.
theological_decisions:
- issue: Entender דּוֹמִּי como afirmação ou como exortação
  choice: 'Exortação: “fique em silêncio, minha alma”'
  alternative: 'Afirmação: “somente para Deus minha alma espera em silêncio”'
  rationale: A vocalização massorética permite tomar a forma como imperativo feminino singular dirigido a נַפְשִׁי. A alternativa declarativa é genuína no contexto e foi preservada em nota, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. “Fique em silêncio” é mais natural no português brasileiro amplo do que “cale-se” e evita a possível dureza dessa expressão. A ordem inicial preserva a ênfase exclusiva do hebraico.
