  naturalness: “Somente em Deus, aquieta-te, minha alma” é português poético moderno, claro e digno. “Aquieta-te” é mais conciso e apropriado para uma exortação da alma do que a perífrase “fique em silêncio”, e evita a ambiguidade pragmática de “para Deus”.
  terminology: “Minha alma” e “esperança” preservam termos tradicionais e naturais no registro dos Salmos. “Dele vem a minha esperança” reproduz corretamente a origem indicada por מִמֶּנּוּ, embora “vem dele” seja uma ordem um pouco mais fluida; ambas são fiéis.
