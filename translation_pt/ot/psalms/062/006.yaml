  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹ֣א אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: pt
  text: Somente ele é a minha rocha e a minha salvação, a minha fortaleza; não serei abalado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não serei movido”.'
    reason: Alternativa lexical para אֶמּוֹט, que pode descrever ser abalado, deslocado ou movido.
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Somente ele
  rationale: 'אַךְ, em conjunto com o pronome הוּא, destaca exclusividade e ênfase: Deus, e nenhum outro, é a fonte de segurança. “Somente ele” é natural e claro em português moderno.'
- source_word: צוּרִי
  choice: a minha rocha
  rationale: צוּר descreve uma rocha firme e protetora e funciona aqui como metáfora da estabilidade que Deus oferece. “Minha rocha” preserva a imagem poética e sua força teológica.
- source_word: וִישׁוּעָתִי
  choice: a minha salvação
  rationale: יְשׁוּעָה pode indicar salvação, livramento ou vitória. “Salvação” mantém a amplitude do termo e se ajusta ao paralelismo poético.
- source_word: מִשְׂגַּבִּי
  choice: a minha fortaleza
  rationale: מִשְׂגָּב designa um lugar elevado e seguro de proteção. “Fortaleza” comunica defesa e segurança de modo idiomático, sem abandonar a imagem espacial.
- source_word: לֹא אֶמּוֹט
  choice: não serei abalado
  rationale: A forma de מוֹט expressa ser sacudido, deslocado ou desestabilizado. “Não serei abalado” conserva a metáfora de firmeza e expressa confiança em português atual.
theological_decisions:
- issue: Grau de confiança na frase final
  choice: não serei abalado
  alternative: não serei movido
  rationale: A frase declara confiança firme em Deus como fundamento e proteção, sem acrescentar uma ideia de invulnerabilidade absoluta que não esteja explicitamente no hebraico. A formulação preserva a voz passiva e a imagem de estabilidade.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. O artigo definido repetido em “a minha rocha”, “a minha salvação” e “a minha fortaleza” favorece a cadência natural e enfática em português.
