  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: pt
  text: Certamente, os filhos do homem são um sopro; os filhos dos homens são uma mentira.[a] Na balança, eles sobem; juntos, pesam menos que um sopro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo interpretativo: “os de condição humilde” e “os de condição elevada”. Mais literalmente, o hebraico traz “os filhos do homem” e “os filhos dos homens”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: Marca a afirmação enfática do verso de modo natural e digno em português.
- source_word: הֶבֶל
  choice: um sopro
  rationale: Preserva a imagem concreta de algo fugaz e sem consistência, evitando o sentido moral moderno que “vaidade” poderia sugerir.
- source_word: בְּנֵי אָדָם
  choice: os filhos de Adão
  rationale: Mantém a forma hebraica e sua distinção lexical em relação à expressão paralela בְּנֵי אִישׁ, sem impor no texto principal uma divisão por classes sociais.
- source_word: כָּזָב
  choice: uma mentira
  rationale: Expressa de maneira breve e vigorosa a ideia de falsidade ou falta de confiabilidade.
- source_word: בְּנֵי אִישׁ
  choice: os filhos dos homens
  rationale: Conserva, tanto quanto possível em português, a distinção entre אָדָם e אִישׁ e o paralelismo poético.
- source_word: בְּמֹאזְנַיִם
  choice: Na balança
  rationale: Comunica naturalmente o instrumento de pesagem e preserva a metáfora.
- source_word: לַעֲלוֹת
  choice: eles sobem
  rationale: Mantém a imagem literal de subir no prato da balança por falta de peso, em vez de substituí-la pela explicação interpretativa “são pesados”.
- source_word: מֵהֶבֶל
  choice: pesam menos que um sopro
  rationale: Explicita em português a comparação exigida pela metáfora da balança, preservando a repetição de “sopro”.
- source_word: יַחַד
  choice: juntos
  rationale: Indica que a avaliação abrange ambos os grupos em conjunto.
theological_decisions:
- issue: Interpretação de בְּנֵי אָדָם / בְּנֵי אִישׁ
  choice: Preservar no texto a distinção literal aproximada como “os filhos de Adão” / “os filhos dos homens”.
  alternative: “os de condição humilde” / “os de condição elevada”
  rationale: A leitura como classes sociais é plausível, mas interpretativa. O hebraico apresenta duas expressões paralelas com termos distintos para ser humano; por isso, a ambiguidade é mantida no texto e a leitura social é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação conserva o paralelismo e a metáfora da balança sem recorrer ao arcaísmo “vaidade”. O marcador [a] aparece no texto principal.
