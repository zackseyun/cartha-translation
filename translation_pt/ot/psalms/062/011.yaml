  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: pt
  text: 'Uma coisa Deus falou[a]; duas coisas ouvi: que a força pertence a Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma vez Deus falou; duas vezes ouvi isto”. A expressão hebraica pode ser entendida em sentido adverbial (“uma vez/duas vezes”) ou como fórmula numérica (“uma coisa/duas coisas”).'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: Uma coisa
  rationale: O numeral feminino singular significa literalmente “uma” e, em paralelo com שְׁתַּיִם, pode introduzir uma fórmula numérica. A inclusão de “coisa” torna a construção natural em português.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta a fala divina como concluída. O pretérito perfeito simples é natural em português e mantém o paralelismo com “ouvi”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui tem sentido singular e designa Deus.
- source_word: שְׁתַּיִם
  choice: duas coisas
  rationale: Em paralelo com אַחַת, é entendido como o segundo elemento da fórmula “uma coisa... duas coisas”. “Coisas” é suprido para clareza idiomática.
- source_word: זוּ
  choice: absorvido na expressão “duas coisas ouvi”
  rationale: A forma pronominal aponta para o conteúdo que segue; em português, sua função é transmitida naturalmente pela construção, sem uma tradução separada e artificial.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O perfeito hebraico indica o que o salmista recebeu pela audição. O pretérito perfeito simples combina naturalmente com “falou”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que foi ouvido.
- source_word: עֹז
  choice: força
  rationale: O substantivo denota força, poder ou vigor. “Força” é claro, corrente e preserva o campo lexical básico.
- source_word: לֵאלֹהִים
  choice: pertence a Deus
  rationale: A preposição לְ expressa aqui posse ou atribuição; “pertence a Deus” explicita esse sentido de modo natural.
theological_decisions:
- issue: Fórmula numérica “uma... duas”
  choice: “Uma coisa Deus falou; duas coisas ouvi”
  alternative: “Uma vez Deus falou; duas vezes ouvi isto”
  rationale: O hebraico permite tanto uma leitura substantiva, como fórmula numérica, quanto uma leitura adverbial de frequência. A leitura substantiva articula melhor a progressão poética e o conteúdo introduzido por כִּי, enquanto a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Deus falou” evita solenidade artificial; “força pertence a Deus” conserva a atribuição enfática do hebraico.
