base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: pt
  text: Somente ele é a minha rocha e a minha salvação, a minha fortaleza; não serei grandemente abalado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: 'Neste contexto, a partícula enfatiza exclusividade: Deus é a única fonte de segurança. “Somente” expressa isso com clareza em português.'
- source_word: הוּא
  choice: ele
  rationale: Pronome masculino singular que retoma Deus; sua expressão explícita é natural e enfática em português.
- source_word: צוּרִי
  choice: a minha rocha
  rationale: Preserva a metáfora bíblica de firmeza, estabilidade e proteção.
- source_word: וִישׁוּעָתִי
  choice: e a minha salvação
  rationale: “Salvação” mantém o sentido amplo de livramento e segurança presente em יְשׁוּעָה.
- source_word: מִשְׂגַּבִּי
  choice: a minha fortaleza
  rationale: O termo designa um lugar elevado e seguro; “fortaleza” comunica proteção e defensibilidade em linguagem corrente.
- source_word: לֹא אֶמּוֹט
  choice: não serei abalado
  rationale: Traduz de modo natural o nifal de מוֹט, que descreve ser sacudido, vacilar ou perder a estabilidade.
- source_word: רַבָּה
  choice: muito
  rationale: O adjetivo funciona adverbialmente e modifica o grau em que o salmista será abalado; “muito” preserva essa nuance sem tornar a frase artificial.
theological_decisions:
- issue: Grau de segurança expresso na oração final
  choice: não serei muito abalado
  alternative: não serei abalado
  rationale: O hebraico contém רַבָּה, modificador de grau que significa “muito” ou “grandemente”. Mantê-lo evita harmonizar esta formulação com a declaração absoluta semelhante em Salmos 62:6.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura paralela e as metáforas de rocha e fortaleza foram preservadas; o modificador “muito” foi mantido no texto principal por estar explícito no hebraico.
