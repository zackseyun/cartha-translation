base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: pt
  text: É em Deus que repousam a minha salvação e a minha glória[a][b]; a rocha da minha força, o meu refúgio, está em Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Sobre Deus estão a minha salvação e a minha glória”.'
    reason: lexical_alternative
  - marker: b
    text: “Minha glória” também pode ser entendida como “minha honra”, isto é, a dignidade ou a vindicação do salmista.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: É em Deus que repousam
  rationale: A preposição indica que a salvação e a glória do salmista dependem de Deus. A formulação conserva a imagem de algo que repousa sobre seu fundamento, mas soa natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente padrão quando אֱלֹהִים designa o Deus de Israel.
- source_word: יִשְׁעִי
  choice: a minha salvação
  rationale: O termo derivado de ישׁע abrange livramento e salvação; “salvação” preserva essa amplitude temporal e teológica.
- source_word: וּכְבוֹדִי
  choice: e a minha glória
  rationale: כָּבוֹד pode significar glória, honra ou dignidade. “Minha glória” mantém a imagem poética, enquanto a nota registra a alternativa contextual.
- source_word: צוּר
  choice: a rocha
  rationale: Preserva a metáfora bíblica de firmeza, estabilidade e proteção.
- source_word: עֻזִּי
  choice: da minha força
  rationale: Equivale diretamente a “minha força” ou “meu vigor”; evita introduzir a imagem mais específica de uma fortaleza.
- source_word: מַחְסִי
  choice: o meu refúgio
  rationale: O substantivo denota um lugar de abrigo ou proteção; “refúgio” é claro e natural no registro dos Salmos.
- source_word: בֵּאלֹהִים
  choice: está em Deus
  rationale: A preposição בְּ apresenta Deus como a esfera ou fundamento em que se encontra o refúgio. O verbo “está” explicita a cópula omitida na poesia hebraica.
theological_decisions:
- issue: Relação da expressão preposicional inicial com as orações nominais
  choice: Apresentar a salvação e a glória como repousando em Deus, e concluir que o refúgio está em Deus.
  alternative: 'Traduzir mais formalmente: “Sobre Deus estão a minha salvação e a minha glória”.'
  rationale: O hebraico é poético e não traz cópula expressa. “É em Deus que repousam” comunica dependência e fundamento sem transformar a afirmação em explicação doutrinária.
- issue: Sentido de כְבוֹדִי
  choice: minha glória
  alternative: minha honra ou dignidade
  rationale: O termo admite tanto “glória” quanto “honra”. A tradução mantém a expressão poética tradicional, e a nota preserva a possibilidade de referência à honra, dignidade ou vindicação do salmista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção enfática “É em Deus que” dá naturalidade ao verso e preserva a ideia de dependência expressa por עַל. Mantiveram-se as metáforas “repousam”, “rocha” e “refúgio”, bem como a tensão semântica entre glória e honra.
