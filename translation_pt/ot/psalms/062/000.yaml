  text: לַ/מְנַצֵּ֥חַ עַֽל יְדוּת֗וּן מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/000.yaml
  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: pt
  text: 'Ao regente: conforme Jedutum[a]. Salmo de Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “sobre Jedutum” ou “para Jedutum”; a expressão pode indicar um estilo musical, uma melodia ou uma orientação de execução associada a Jedutum.
    reason: alternative_reading
  - marker: b
    text: O título “de Davi” pode indicar autoria, dedicação ou associação com Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Em títulos de salmos, o termo designa quem dirige a execução musical. “Ao regente” é conciso, natural e não restringe a função à direção de um coro.
- source_word: עַל
  choice: conforme
  rationale: Neste título, a preposição pode introduzir uma melodia, um estilo ou uma orientação de execução ligada a Jedutum. “Conforme” preserva essa abertura sem especificar além do hebraico.
- source_word: יְדוּתוּן
  choice: Jedutum
  rationale: Transliteração portuguesa tradicional e clara do nome próprio; o referente pode ser o músico levítico ou algo musical associado a ele.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação convencional e adequada do gênero indicado pelo termo hebraico nos títulos.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica é ampla e pode expressar autoria, dedicação, pertencimento ou associação. “De Davi” conserva melhor essa flexibilidade do que “por Davi” ou “para Davi”.
theological_decisions:
- issue: Sentido de לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não obriga a decidir entre autoria e uma associação davídica mais ampla; a tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com formulação própria de um título litúrgico. “Ao regente” favorece ampla legibilidade brasileira e evita o arcaísmo de “mestre de canto”; “conforme” mantém a incerteza musical do original.
