  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: pt
  text: Não confiem na opressão[a] nem ponham esperança vã no roubo; se as riquezas aumentarem, não ponham nelas o coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não sejam vãos no roubo” ou “não se vangloriem do roubo”. O verbo hebraico é difícil e pode transmitir a ideia de agir de modo vazio ou de pôr esperança naquilo que é vazio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: confiem
  rationale: O verbo בטח expressa confiança ou segurança depositada em algo; “confiem” é natural e direto em português.
- source_word: בְעֹשֶׁק
  choice: na opressão
  rationale: עֹשֶׁק abrange opressão, exploração e extorsão; “opressão” preserva o sentido ético mais amplo.
- source_word: בְגָזֵל
  choice: no roubo
  rationale: גָזֵל indica roubo ou aquilo que é tomado à força; “roubo” mantém o paralelismo claro com “opressão”.
- source_word: תֶּהְבָּלוּ
  choice: ponham esperança vã
  rationale: A forma derivada de הבל é difícil e pode sugerir agir em vão, tornar-se vão ou confiar no que é vazio. A expressão escolhida comunica essa confiança ilusória sem ocultar a ambiguidade, registrada em nota.
- source_word: חַיִל
  choice: riquezas
  rationale: Embora חַיִל possa significar força ou recursos, o verbo “aumentar” e a advertência contra apegar o coração favorecem o sentido material de riquezas.
- source_word: כִּי יָנוּב
  choice: se as riquezas aumentarem
  rationale: נוב tem o sentido concreto de brotar e, por extensão, crescer ou aumentar. “Se... aumentarem” preserva aqui a nuance condicional de כִּי.
- source_word: תָּשִׁיתוּ לֵב
  choice: não prendam a elas o coração
  rationale: A expressão שׁית לב descreve dirigir ou fixar o coração em algo. “Prender o coração” é idiomático em português e comunica apego interior e confiança.
theological_decisions:
- issue: Sentido da advertência no segundo membro
  choice: Uma proibição de depositar esperança vazia no roubo
  alternative: “Não sejam vãos no roubo” ou “não se vangloriem do roubo”
  rationale: O paralelismo com “não confiem” favorece uma advertência contra confiança ilusória, mas o verbo hebraico admite outras leituras; por isso, elas são preservadas em nota, sem resolver indevidamente a tensão.
- issue: Alcance da advertência sobre riquezas
  choice: Mesmo riquezas que simplesmente aumentam não devem dominar o coração
  alternative: Limitar a advertência apenas aos bens obtidos por opressão e roubo
  rationale: O último membro emprega o termo mais amplo חַיִל e pode ampliar a advertência para as riquezas em geral, sem negar a ligação contextual com ganhos injustos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas no plural coerentes. “Riquezas” soa mais natural neste contexto do que o singular abstrato “riqueza”; o pronome “elas” explicita apenas a concordância exigida em português.
