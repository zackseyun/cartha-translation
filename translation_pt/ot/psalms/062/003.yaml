  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: pt
  text: Até quando vocês atacarão um homem? Vocês todos o derrubarão[a], como um muro inclinado[b], uma cerca prestes a cair?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o assassinarão”. O verbo hebraico geralmente significa assassinar, mas, neste contexto, pode ser entendido em sentido metafórico, em consonância com a imagem de uma estrutura que desaba.'
    reason: lexical_alternative
  - marker: b
    text: A comparação pode retratar o homem atacado como frágil e prestes a cair. Outros entendem que ela descreve os agressores, comparados a um muro saliente ou a uma cerca inclinada.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: atacarão
  rationale: O verbo raro הותת expressa uma investida violenta. “Atacarão” é claro e natural, sem especificar além do que o hebraico permite a maneira da agressão.
- source_word: עַל אִישׁ
  choice: um homem
  rationale: Mantém o singular masculino de אִישׁ e apresenta o indivíduo que é alvo do ataque.
- source_word: תְּרָצְּחוּ
  choice: o derrubarão
  rationale: Embora רצח normalmente se refira a matar ou assassinar, aqui a imagem imediatamente seguinte de um muro e uma cerca à beira do colapso favorece o sentido metafórico de fazer cair ou destruir. A alternativa mais direta é preservada em nota.
- source_word: כֻלְּכֶם
  choice: vocês todos
  rationale: Reproduz a ênfase coletiva do pronome plural hebraico em português corrente.
- source_word: כְּקִיר נָטוּי
  choice: como um muro inclinado
  rationale: Preserva de modo conciso a imagem concreta de uma estrutura instável e próxima de cair.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: uma cerca prestes a cair
  rationale: דחה sugere algo empurrado, deslocado ou cedendo. A formulação comunica naturalmente a instabilidade da cerca sem impor uma causa específica.
