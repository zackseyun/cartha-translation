  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: pt
  text: Somente diante de Deus minha alma está em silêncio[a]; dele vem minha salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somente por Deus minha alma espera em silêncio”; ou: “Somente em Deus minha alma encontra descanso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: Preserva a força restritiva e enfática do advérbio, destacando a orientação exclusiva para Deus sem transformar a afirmação em mera certeza.
- source_word: אֶל
  choice: diante de
  rationale: A preposição indica direção ou orientação para Deus. Em português, “diante de Deus” comunica de modo natural a postura silenciosa da pessoa perante ele, embora “por Deus” também seja possível se o silêncio for entendido como espera.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto singular dos Salmos, refere-se ao Deus de Israel.
- source_word: דּוּמִיָּה
  choice: permanece em silêncio
  rationale: O substantivo expressa silêncio, quietude ou repouso. A construção verbal é natural em português e mantém em primeiro plano a imagem do silêncio, sem explicitar demais a ideia implícita de espera confiante.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode designar a própria pessoa, a vida ou o ser interior. “Minha alma” é natural no registro poético e preserva a amplitude da expressão hebraica.
- source_word: מִמֶּנּוּ
  choice: dele vem
  rationale: 'A preposição indica origem: a salvação procede de Deus. O verbo “vem”, suprido em português, torna explícita a relação nominal implícita no hebraico.'
- source_word: יְשׁוּעָתִי
  choice: minha salvação
  rationale: O termo pode indicar salvação, livramento ou vitória. “Minha salvação” conserva o registro teológico e continua permitindo o sentido concreto de livramento.
theological_decisions:
- issue: Sentido de דּוּמִיָּה נַפְשִׁי
  choice: Uma expressão de silêncio e quietude confiante diante de Deus
  alternative: A alma espera por Deus em silêncio; ou encontra descanso em Deus
  rationale: O substantivo hebraico admite silêncio, quietude e, no contexto, espera ou descanso. O texto principal conserva a imagem lexical do silêncio, enquanto a nota registra as principais leituras sem decidir além do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A omissão dos artigos antes de “minha alma” e “minha salvação” mantém concisão sem prejudicar a naturalidade. “Diante de Deus” evita a formulação pouco idiomática “para Deus minha alma está em silêncio” e conserva a postura relacional expressa por אֶל.
