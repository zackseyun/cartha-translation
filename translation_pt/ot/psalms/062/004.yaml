  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: pt
  text: Eles só planejam derrubá-lo de sua posição elevada[a]; têm prazer na falsidade. Com a boca, abençoam, mas por dentro amaldiçoam[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de sua dignidade”, “de sua exaltação” ou “de sua eminência”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente “com sua boca, abençoam”; o sentido provavelmente é coletivo: por fora, abençoam, mas por dentro amaldiçoam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: só
  rationale: 'O advérbio expressa aqui a restrição do propósito dos inimigos: é somente isso que planejam. “Só” é natural e conciso em português.'
- source_word: מִשְּׂאֵתוֹ
  choice: de sua posição elevada
  rationale: שְׂאֵת pode indicar elevação, exaltação, dignidade ou eminência. A expressão preserva tanto a imagem espacial quanto a ideia de posição ou status, sem especificar demais.
- source_word: יָעֲצוּ
  choice: planejam
  rationale: O verbo descreve deliberação ou maquinação. “Planejam” comunica com clareza a ação intencional, cujo caráter hostil fica evidente no contexto.
- source_word: לְהַדִּיחַ
  choice: derrubá-lo
  rationale: O Hifil de נדח comunica fazer alguém cair, ser afastado ou expulso. Ligado à ideia de elevação, “derrubá-lo” reproduz de modo natural a imagem do hebraico.
- source_word: יִרְצוּ כָזָב
  choice: têm prazer na falsidade
  rationale: A construção expressa agrado ou prazer no engano. “Falsidade” mantém o sentido amplo de כָזָב, que pode abranger mentira e fraude.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Com a boca, abençoam
  rationale: Embora a forma hebraica diga literalmente “com sua boca”, o paralelismo e o sentido favorecem uma referência coletiva à fala exterior dos adversários. A tradução mantém “boca” no singular coletivo.
- source_word: וּבְקִרְבָּם
  choice: por dentro
  rationale: A expressão significa literalmente “no interior deles”. “Por dentro” apresenta em português natural o contraste entre as palavras externas e a disposição íntima.
- source_word: יְקַלְלוּ
  choice: amaldiçoam
  rationale: O verbo significa amaldiçoar e forma uma antítese direta com “abençoam”.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo litúrgico ou musical é incerta, ele é transliterado, seguindo o uso bíblico tradicional em português.
theological_decisions:
- issue: Referente do sufixo masculino singular em מִשְּׂאֵתוֹ e do objeto implícito de לְהַדִּיחַ
  choice: O alvo singular é expresso por “derrubá-lo” e “sua posição elevada”, sem identificá-lo além do que o contexto permite.
  alternative: Empregar uma construção impessoal, ou interpretar a expressão principalmente como perda de dignidade ou honra.
  rationale: O hebraico marca um referente masculino singular. Preservá-lo evita generalização indevida e não impõe uma identificação teológica específica.
- issue: Número gramatical em בְּפִיו, literalmente “com sua boca”
  choice: Entender o singular como coletivo e traduzir “Com a boca, abençoam”.
  alternative: Traduzir literalmente “Com a boca dele, abençoam”, apesar da dificuldade de sentido.
  rationale: O sujeito plural de “abençoam” e o paralelo “no interior deles” indicam que a boca representa coletivamente a fala externa dos adversários; a nota preserva a forma literal e a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Selá” segue a transliteração tradicional. O paralelismo antitético entre bênção exterior e maldição interior foi mantido, e as ambiguidades lexicais relevantes aparecem nas notas.
