base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: pt
  text: Confiem nele em todos os momentos, ó povo; derramem diante dele o coração de vocês.[a] Deus é o nosso refúgio. Selá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Derramar o coração” é uma expressão hebraica que significa expor abertamente diante de Deus os pensamentos, sentimentos e desejos mais íntimos.
    reason: lexical_alternative
  - marker: b
    text: “Selá” provavelmente é um termo litúrgico ou musical; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Confiem nele
  rationale: O imperativo plural de בטח expressa confiança depositada em alguém; a forma pronominal masculina remete a Deus no contexto.
- source_word: בְכָל־עֵת
  choice: em todo o tempo
  rationale: Preserva de modo natural a expressão distributiva hebraica, com o sentido de sempre ou em todas as ocasiões.
- source_word: עָם
  choice: ó povo
  rationale: O substantivo funciona como vocativo dirigido à comunidade; “ó povo” torna explícito esse valor na poesia.
- source_word: שִׁפְכוּ לְפָנָיו לְבַבְכֶם
  choice: derramem diante dele o coração de vocês
  rationale: Mantém a metáfora hebraica e o sentido de expor abertamente a vida interior na presença de Deus. “De vocês” reflete o sufixo plural, enquanto o substantivo coletivo permanece singular no hebraico.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: Deus é o nosso refúgio
  rationale: A oração nominal hebraica admite naturalmente a cópula em português; “nosso refúgio” comunica com clareza a relação expressa por לָנוּ.
- source_word: סֶלָה
  choice: Selá
  rationale: A transliteração preserva o termo litúrgico ou musical cujo significado exato continua incerto.
theological_decisions:
- issue: Destinatário coletivo de עָם
  choice: A exortação se dirige à comunidade como “ó povo”.
  alternative: Traduzir simplesmente “povo” ou entender o termo como “nação”.
  rationale: A posição depois dos imperativos favorece a leitura vocativa, sem restringir o referente a uma entidade política ou étnica mais específica.
- issue: Número em לְבַבְכֶם
  choice: “o coração de vocês”
  alternative: “os seus corações”
  rationale: O hebraico traz “coração” no singular com sufixo de segunda pessoa plural. A formulação escolhida conserva essa combinação e continua natural no português brasileiro.
- issue: Sentido de סֶלָה
  choice: Manter “Selá” sem tradução.
  alternative: “pausa”, “interlúdio” ou outra indicação musical.
  rationale: Como a função exata do termo é incerta, traduzi-lo fixaria uma interpretação não demonstrável.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A construção “o coração de vocês” conserva o singular hebraico e explicita o destinatário plural. A pontuação mantém o paralelismo poético e a progressão da exortação para a afirmação de confiança.
