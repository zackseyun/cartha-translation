lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos cabeçalhos dos Salmos, o termo designa quem dirige a execução musical. “Ao regente” é conciso, natural em português e evita restringir a função exclusivamente a um coral.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e preciso para este gênero poético-musical no Saltério.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode expressar autoria, associação, pertencimento ou dedicação. “De Davi” conserva melhor essa amplitude do que “por Davi”.
theological_decisions:
- issue: Sentido da atribuição davídica no cabeçalho
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica admite mais de uma relação com Davi; a tradução não deve afirmar autoria de modo mais específico do que o original.
translation_notes:
  register: Português moderno, digno e acessível, com formulação concisa própria de um cabeçalho. O marcador foi colocado depois de “Davi”, pois a nota explica a atribuição davídica.
