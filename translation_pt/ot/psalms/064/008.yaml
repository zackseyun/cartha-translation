base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: pt
  text: Eles são levados a tropeçar[a]; a própria língua se volta contra eles; todos os que os veem balançam a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente, a oração hebraica pode ser vertida: “Eles o fizeram tropeçar sobre eles — a língua deles”. A sintaxe e os referentes dos pronomes são difíceis, e as traduções divergem. O texto principal segue o sentido de que os maus são arruinados pela própria fala.'
    reason: alternative_reading
  - marker: b
    text: O verbo também pode ser traduzido por “abanam a cabeça”, “estremecem” ou, em certos contextos, “fogem”. O hebraico não menciona explicitamente a cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: são levados a tropeçar
  rationale: A forma causativa de כשׁל significa fazer tropeçar ou cair. Embora o sufixo hebraico seja morfologicamente masculino singular, a sintaxe poética é difícil; o texto principal expressa a compreensão contextual de que os malfeitores são derrubados coletivamente.
- source_word: עָלֵימוֹ
  choice: contra eles
  rationale: A preposição עַל com sufixo pode significar “sobre eles” ou “contra eles”. Aqui, “contra eles” comunica naturalmente que a própria fala se volta para sua ruína.
- source_word: לְשׁוֹנָם
  choice: a própria língua
  rationale: Preserva a imagem concreta e o singular coletivo do hebraico, enquanto “própria” torna clara, em português, a ironia de serem prejudicados por sua fala.
- source_word: יִתְנֹדֲדוּ
  choice: balançam a cabeça
  rationale: נוד pode indicar movimento, oscilação, afastamento ou gesto de reação. Neste contexto visual, a expressão portuguesa comunica um gesto de espanto, reprovação ou escárnio sem fixar qual dessas reações predomina.
- source_word: כָּל רֹאֵה בָם
  choice: todos os que os veem
  rationale: Tradução direta e natural da construção participial, preservando tanto a abrangência universal quanto o objeto plural.
theological_decisions:
- issue: Agente e referentes pronominais na primeira oração
  choice: O texto principal entende coletivamente que os malfeitores são levados a tropeçar e que a própria língua se volta contra eles.
  alternative: 'Entender literalmente um referente masculino singular: “ele/ela o fez tropeçar sobre eles”, tomando “a língua deles” como sujeito ou como oração relacionada.'
  rationale: O hebraico é sintaticamente comprimido e seus pronomes não se alinham de modo transparente com os referentes plurais do contexto. A tradução principal oferece o sentido contextual mais coerente, mas a nota conserva a ambiguidade formal em vez de atribuir com certeza a ação a Deus ou a outro agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “São levados a tropeçar” preserva a metáfora hebraica; “a própria língua se volta contra eles” explicita com naturalidade a relação comprimida da segunda expressão. A pontuação mantém as três unidades poéticas, e as notas registram tanto a dificuldade sintática quanto a amplitude lexical sem resolver indevidamente a ambiguidade.
