  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: pt
  text: Então toda a humanidade temerá[a] e anunciará a obra de Deus; compreenderá o que ele fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada pessoa” ou “todos os seres humanos”. O hebraico diz literalmente “todo ser humano” (kol adam), expressão coletiva que se refere à humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: temerá
  rationale: O verbo ירא pode expressar tanto temor diante do juízo quanto reverência. O futuro mantém a sequência poética do contexto sem reduzir essa amplitude a mero susto.
- source_word: כָּל אָדָם
  choice: toda a humanidade
  rationale: אָדָם é singular na forma, mas coletivo e genérico aqui. “Toda a humanidade” comunica naturalmente o conjunto dos seres humanos, sem restringir a referência aos homens.
- source_word: וַיַּגִּידוּ
  choice: anunciará
  rationale: O hifil de נגד significa tornar conhecido, contar ou declarar. “Anunciará” preserva o caráter público do testemunho sobre a ação divina.
- source_word: פֹּעַל אֱלֹהִים
  choice: a obra de Deus
  rationale: פֹּעַל designa obra, feito ou ação. A formulação mantém a referência ampla ao ato decisivo de Deus no contexto.
- source_word: וּמַעֲשֵׂהוּ
  choice: o que ele fez
  rationale: Embora literalmente seja “sua obra/seu feito”, esta formulação evita repetição pesada e expressa com clareza a ação concreta de Deus.
- source_word: הִשְׂכִּילוּ
  choice: compreenderá
  rationale: O hifil de שׂכל pode significar compreender, adquirir discernimento ou agir com sabedoria. Como o objeto é o feito de Deus, o sentido contextual é perceber e compreender sua ação.
theological_decisions:
- issue: Sentido coletivo e genérico de אָדָם
  choice: toda a humanidade
  alternative: cada pessoa / todos os seres humanos
  rationale: A expressão hebraica כָּל אָדָם refere-se coletivamente à humanidade, não exclusivamente ao sexo masculino. A tradução preserva esse alcance universal sem impor uma leitura individualista.
- issue: Nuance de ירא diante da ação divina
  choice: temerá
  alternative: ficará com medo / reverenciará
  rationale: “Temerá” conserva a tensão entre pavor diante do juízo e reverência perante Deus, sem decidir por apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O singular coletivo em “toda a humanidade temerá... anunciará... compreenderá” acompanha a unidade do referente hebraico.
