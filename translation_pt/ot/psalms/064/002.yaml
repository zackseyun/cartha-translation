  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: pt
  text: Esconde-me do conselho secreto dos malfeitores[a], do tumulto[b] dos que praticam a maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos planos secretos dos malfeitores» ou «da trama secreta dos malfeitores». O hebraico סוֹד pode se referir a uma deliberação confidencial, a um círculo íntimo ou a um plano secreto.
    reason: lexical_alternative
  - marker: b
    text: Ou «do alvoroço» ou «do ajuntamento hostil dos que praticam a maldade». O hebraico רִגְשָׁה sugere agitação coletiva, comoção ou tumulto hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Esconde-me
  rationale: O hifil de סתר com sufixo de primeira pessoa singular significa «esconder-me» ou «ocultar-me». No contexto da súplica, a forma é naturalmente expressa em português como um pedido direto.
- source_word: מִסּוֹד
  choice: dos planos secretos
  rationale: סוֹד pode indicar conversa confidencial, círculo íntimo, deliberação reservada ou trama. Com agentes hostis, «planos secretos» comunica com naturalidade tanto o caráter clandestino quanto o deliberativo, sem eliminar as alternativas registradas na nota.
- source_word: מְרֵעִים
  choice: dos malfeitores
  rationale: O particípio de רעע designa pessoas que fazem o mal. «Malfeitores» preserva esse sentido ativo e é claro no português atual.
- source_word: מֵרִגְשַׁת
  choice: do tumulto
  rationale: רִגְשָׁה sugere agitação coletiva, alvoroço ou ajuntamento hostil e ruidoso. «Tumulto» preserva essa amplitude sem definir indevidamente o tamanho do grupo.
- source_word: פֹּעֲלֵי אָוֶן
  choice: dos que praticam a maldade
  rationale: A expressão construta descreve pessoas que fazem ou produzem אָוֶן. «Os que praticam a maldade» é atual e compreensível, conserva a força habitual da expressão e evita a formulação pouco natural «obreiros da iniquidade».
