lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: reforçam entre si
  rationale: O piel de חזק comunica tornar forte ou firme. “Reforçam entre si” expressa em português natural a ação deliberada e o envolvimento reflexivo ou recíproco indicado por לָמוֹ, sem reduzir o verbo a mero assentimento.
- source_word: דָּבָר רָע
  choice: um plano perverso
  rationale: דָּבָר pode significar palavra, assunto, coisa ou empreendimento. O contexto de conspiração e armadilhas favorece “plano”, enquanto a nota preserva a amplitude lexical do hebraico.
- source_word: יְסַפְּרוּ
  choice: falam em
  rationale: No piel, ספר pode significar contar, relatar ou discorrer. Com o infinitivo לִטְמוֹן, “falam em” transmite naturalmente a conversa conspiratória sem transformar explicitamente o verbo em “planejam”.
- source_word: לִטְמוֹן
  choice: esconder
  rationale: O infinitivo de טמן significa ocultar ou esconder. A tradução mantém o núcleo lexical e deixa implícito o ato de preparar os laços.
- source_word: מוֹקְשִׁים
  choice: laços
  rationale: מוֹקֵשׁ designa um laço ou uma armadilha. “Laços” conserva a imagem poética e, por ser masculino plural em português, permite que “os” mantenha parte da concisão referencial do hebraico.
- source_word: אָמְרוּ
  choice: dizem
  rationale: Embora a forma seja qatal, a sequência poética descreve a atividade dos perversos de modo vívido; o presente “dizem” harmoniza-se com os verbos anteriores.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: Quem os verá?
  rationale: O sufixo de לָמוֹ é de terceira pessoa do plural. “Os” reproduz esse dado gramatical e pode apontar aos laços no fluxo imediato, sem substituir o hebraico pela leitura em primeira pessoa.
