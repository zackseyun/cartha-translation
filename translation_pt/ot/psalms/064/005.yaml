  text: 'Eles fortalecem o seu plano perverso[a]; falam em esconder laços e dizem: “Quem os verá?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida por “um assunto mau”, “uma coisa má” ou “um propósito perverso”; a palavra דָּבָר tem sentido amplo, mas o contexto favorece a ideia de um plano.
