  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: pt
  text: Ouve, ó Deus, a minha voz em minha queixa[a]; guarda a minha vida do temor do inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em minha meditação” ou “em minha reflexão”. O termo hebraico pode se referir tanto à reflexão interior quanto a uma queixa expressa em palavras.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouve
  rationale: Imperativo singular dirigido a Deus; “ouve” é direto, natural e preserva a linguagem tradicional de oração sem soar arcaico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O vocativo com “ó” expressa claramente a invocação direta e mantém um registro digno.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Preserva a imagem concreta do hebraico קוֹלִי, em vez de reduzi-la a “a mim” ou “a minha oração”.
- source_word: בְשִׂיחִי
  choice: em minha queixa
  rationale: שִׂיחַ pode indicar reflexão, meditação ou queixa. No contexto de lamento e ameaça, “queixa” é a leitura contextual mais provável, enquanto a nota conserva as alternativas genuínas.
- source_word: מִפַּחַד
  choice: do temor
  rationale: פַּחַד denota medo, pavor ou temor. “Temor” transmite a apreensão diante da ameaça sem ampliar indevidamente a intensidade.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: Mantém o singular definido do hebraico, que pode funcionar de maneira individual, genérica ou coletiva na poesia.
- source_word: תִּצֹּר
  choice: guarda
  rationale: O verbo נצר significa guardar, proteger ou preservar. “Guarda a minha vida” é natural em português e conserva a ideia de proteção.
- source_word: חַיָּי
  choice: a minha vida
  rationale: É o equivalente idiomático do plural hebraico usado com sentido de vida; evita a interpretação adicional de “alma”.
theological_decisions:
- issue: Sentido de בְשִׂיחִי no contexto de lamento
  choice: queixa
  alternative: meditação, reflexão
  rationale: A súplica por proteção contra o inimigo favorece o sentido de queixa ou lamento, mas o termo hebraico também pode designar reflexão interior; a nota mantém essa ambiguidade sem impor uma resolução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O vocativo “ó Deus” e a expressão “a minha voz” preservam a forma poética e concreta do hebraico; “guarda” evita rigidez desnecessária.
