  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: pt
  text: para atirar contra o íntegro[b] a partir de lugares escondidos[a]; de repente, atiram contra ele e não têm medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em lugares secretos”. A preposição hebraica significa literalmente “em”, mas o contexto retrata um ataque feito a partir de posições ocultas.
    reason: lexical_alternative
  - marker: b
    text: Ou “contra o inocente”. O termo hebraico pode indicar integridade moral ou inocência.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: atirar
  rationale: Neste contexto de ataque, o infinitivo de ירה indica disparar ou lançar um projétil. “Atirar” preserva a ação sem explicitar “flechas”, que não aparecem no texto.
- source_word: בַּמִּסְתָּרִים
  choice: de lugares escondidos
  rationale: O substantivo designa lugares ocultos. Embora a preposição hebraica seja literalmente “em”, “de lugares escondidos” expressa naturalmente em português a posição encoberta de onde parte o ataque.
- source_word: תָּם
  choice: o íntegro
  rationale: O termo pode caracterizar alguém moralmente íntegro ou inocente. “O íntegro” conserva a dimensão ética e o singular representativo do hebraico.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Equivalente português natural para a ideia de uma ação abrupta e inesperada.
- source_word: יֹרֻהוּ
  choice: atiram contra ele
  rationale: A forma verbal com sufixo masculino singular retoma “o íntegro”. “Contra ele” comunica o alvo da ação sem sugerir necessariamente que o disparo o atingiu.
- source_word: וְלֹא יִירָאוּ
  choice: e não têm medo
  rationale: Mantém a concisão e a ausência de objeto explícito no hebraico, sem determinar se não temem Deus, pessoas ou consequências.
