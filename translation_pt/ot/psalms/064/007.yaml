  text: וַ/יֹּרֵ֗/ם אֱלֹ֫הִ֥ים חֵ֥ץ פִּתְא֑וֹם הָ֝י֗וּ מַכּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: pt
  text: Mas Deus atira uma flecha contra eles[a]; de repente, ficam feridos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Mas Deus atirou neles uma flecha; de repente vieram as suas feridas.”'
    reason: Registra a forma narrativa passada e a construção nominal mais literal do hebraico, cuja sintaxe admite uma tradução menos idiomática.
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: atira ... contra eles
  rationale: O hifil de ירה com sufixo de terceira pessoa masculina plural apresenta Deus disparando contra eles. O presente dá vivacidade à narrativa poética, enquanto a nota registra a leitura formal no passado.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Designa aqui, em sentido singular, o Deus de Israel.
- source_word: חֵץ
  choice: uma flecha
  rationale: Corresponde ao sentido lexical direto de חֵץ e funciona naturalmente como objeto de 'atira'.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Expressa a brusquidão e o caráter inesperado do juízo.
- source_word: הָיוּ מַכּוֹתָם
  choice: ficam feridos
  rationale: Representa de modo natural em português o resultado expresso literalmente por 'foram/tornaram-se as suas feridas', sem perder a imagem do golpe sofrido.
theological_decisions:
- issue: Representação do juízo divino na imagem poética
  choice: Manter Deus como agente que dispara a flecha contra os perversos.
  alternative: Abrandar a imagem como simples reversão providencial.
  rationale: O hebraico apresenta explicitamente Deus como sujeito da ação; a tradução preserva essa agência sem acrescentar elaboração doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva a concisão e o paralelismo abrupto da poesia hebraica.
