  text: que afiam a língua como uma espada; preparam a sua flecha — uma palavra amarga —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: afiam
  rationale: Reproduz diretamente a imagem de tornar a língua cortante, como uma espada.
- source_word: דָּרְכוּ
  choice: armam
  rationale: O verbo descreve a preparação de uma arma de projétil, normalmente o ato de retesar ou armar o arco. Como o objeto expresso é “flecha”, “armam sua flecha” preserva a imagem incomum do hebraico sem acrescentar explicitamente “arco”.
- source_word: חִצָּם
  choice: sua flecha
  rationale: Mantém o singular coletivo do texto massorético e a metáfora bélica.
- source_word: דָּבָר מָר
  choice: uma palavra amarga
  rationale: Tradução direta que conserva a identificação metafórica da flecha com a fala hostil.
theological_decisions:
- issue: Relação entre “flecha” e “palavra amarga”
  choice: Travessões apresentam “uma palavra amarga” como aposição metafórica a “sua flecha”.
  alternative: Traduzir no plural, “palavras amargas”, ou inserir “para disparar”.
  rationale: O hebraico traz formas no singular e não explicita o ato de disparar; a formulação escolhida preserva sua concisão e tensão poética.
translation_notes:
  register: Português atual, claro e poético, com paralelismo preservado. O relativo inicial “que” mantém a dependência sintática do versículo anterior.
