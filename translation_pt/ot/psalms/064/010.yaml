source:
  edition: WLC
  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: pt
  text: O justo se alegrará em Yahweh e nele se refugiará; todos os retos de coração se gloriarão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exultarão” ou “se orgulharão”. O verbo hebraico pode expressar gloriar-se, exultar ou orgulhar-se; aqui, o contexto lhe dá sentido positivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se alegrará
  rationale: O imperfeito, no contexto poético, aponta para o resultado esperado da ação julgadora de Deus; “se alegrará” transmite naturalmente a ideia de alegria celebrativa.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular é usado como substantivo e tem valor representativo. “O justo” preserva o singular sem acrescentar “homem”.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição indica aquele em quem se encontra a alegria, e o tetragrama é representado pelo nome próprio “Yahweh”.
- source_word: וְחָסָה בּוֹ
  choice: e nele se refugiará
  rationale: חסה expressa buscar abrigo ou proteção. “Refugiar-se” conserva a imagem concreta melhor do que o termo mais amplo “confiar”.
- source_word: וְיִתְהַלְלוּ
  choice: se gloriarão
  rationale: O hitpael de הלל pode indicar gloriar-se, exultar ou orgulhar-se. “Se gloriarão” preserva o caráter positivo do contexto sem eliminar a nuance de exultação.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: todos os retos de coração
  rationale: A expressão hebraica descreve pessoas cuja disposição interior é reta. A formulação conserva tanto a metáfora da retidão quanto a referência ao coração como centro da vida interior.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Objeto implícito de “se gloriarão”
  choice: manter o verbo sem complemento explícito
  alternative: se gloriarão em Yahweh
  rationale: Embora o contexto associe a exultação a Deus e à sua ação salvadora, o hebraico não repete um complemento para o verbo final. A tradução mantém essa abertura sintática.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi preservado, e o ponto e vírgula marca a passagem do justo singular representativo para o grupo dos retos de coração.
