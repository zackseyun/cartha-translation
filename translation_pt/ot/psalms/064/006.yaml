source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: pt
  text: 'Tramam injustiças e dizem:


    “Concluímos uma busca minuciosa.”


    O íntimo de cada pessoa e o coração são profundos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Planejam injustiças
  rationale: O verbo pode indicar procurar, investigar ou conceber cuidadosamente; no contexto de conspiração, “planejam” comunica a busca deliberada por atos injustos. O plural עוֹלֹת é preservado como “injustiças”.
- source_word: תַּמְנוּ
  choice: Concluímos
  rationale: A forma de תמם expressa completar ou levar a termo. A primeira pessoa plural foi mantida como fala dos conspiradores.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: um plano bem planejado
  rationale: A combinação etimológica intensiva é difícil e admite sentidos como busca minuciosa, plano cuidadosamente elaborado ou ocultação cuidadosa. “Plano bem planejado” preserva a ênfase na elaboração diligente sem acrescentar explicitamente a ideia de segredo.
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: O íntimo de cada pessoa e o coração são profundos
  rationale: קֶרֶב designa o interior ou íntimo; אִישׁ é genérico neste contexto e foi vertido inclusivamente como “cada pessoa”. “Profundos” conserva a metáfora de profundidade aplicada tanto ao íntimo quanto ao coração.
theological_decisions:
- issue: Profundidade do interior humano
  choice: Manter a afirmação metafórica de que o íntimo e o coração são profundos
  alternative: Explicitar que os pensamentos humanos são inescrutáveis ou astutos
  rationale: O hebraico é conciso e metafórico; explicitar maldade, astúcia ou inescrutabilidade resolveria uma ambiguidade que o texto deixa aberta, embora o contexto seja hostil.
- issue: Possível ocultação do plano
  choice: Não inserir “oculto” no texto principal
  alternative: “um plano cuidadosamente oculto”
  rationale: מְחֻפָּשׂ deriva de חפש, ligado a procurar/investigar, e não exprime inequivocamente ocultação. A alternativa é contextual e possível, mas menos lexicalmente direta.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. A redação evita arcaísmos e conserva a brusquidão e a ambiguidade do hebraico, especialmente na frase intensiva חֵפֶשׂ מְחֻפָּשׂ.
