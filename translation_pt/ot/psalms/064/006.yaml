review_pass:
  verdict: revise
  source_fidelity: A primeira oração pode legitimamente ser entendida no contexto como «tramam injustiças», embora o hebraico também evoque buscar/investigar atos perversos. Na fala citada, porém, חֵפֶשׂ מְחֻפָּשׂ enfatiza uma busca/investigação minuciosamente realizada; «um plano bem planejado» substitui essa imagem por uma tautologia em português e introduz «plano» sem sinalizá-lo.
  naturalness: «Plano bem planejado» é pouco idiomático e enfraquece a expressão intensiva hebraica. «Busca minuciosa» é natural, conciso e preserva melhor a repetição enfática.
  terminology: «Íntimo» e «coração» traduzem adequadamente קֶרֶב e לֵב, e «cada pessoa» comunica com naturalidade o uso genérico de אִישׁ. «Profundos» mantém a metáfora sem explicá-la doutrinariamente.
  issues:
  - severity: medium
    issue: A expressão «um plano bem planejado» não representa adequadamente חֵפֶשׂ מְחֻפָּשׂ.
    rationale: O par hebraico deriva do campo semântico de buscar/examinar e sugere uma busca cuidadosamente conduzida ou minuciosamente investigada. A versão atual torna a frase uma redundância de «planejar» e perde essa imagem; «plano» é uma explicitação contextual possível, mas não necessária.
  revised_text: 'Tramam injustiças e dizem:


    “Concluímos uma busca minuciosa.”


    O íntimo de cada pessoa e o coração são profundos.'
