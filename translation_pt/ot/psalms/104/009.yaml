  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: pt
  text: Tu estabeleceste um limite que elas não podem ultrapassar[a]; não voltarão a cobrir a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fronteira”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as águas não voltarão a cobrir a terra.
    reason: referent_clarification
lexical_decisions:
- source_word: גְּבוּל
  choice: limite
  rationale: O substantivo designa um limite ou fronteira fixada. “Limite” é natural em português e se ajusta à imagem das águas contidas por Deus.
- source_word: שַׂמְתָּ
  choice: estabeleceste
  rationale: O verbo שׂוּם significa pôr, colocar ou estabelecer. Aqui, “estabeleceste” expressa de modo idiomático a fixação de um limite.
- source_word: בַּל
  choice: não podem / não
  rationale: A partícula nega os verbos no imperfeito. Na primeira oração, “não podem” comunica a restrição imposta; na segunda, o futuro “não voltarão” expressa naturalmente o resultado duradouro.
- source_word: יַעֲבֹרוּן
  choice: ultrapassar
  rationale: עבר significa passar ou atravessar. Com “limite”, “ultrapassar” é a combinação mais clara e natural em português.
- source_word: יְשׁוּבוּן
  choice: voltarão
  rationale: שוב significa voltar ou retornar. O futuro negativo indica que as águas não tornarão a cobrir a terra.
- source_word: לְכַסּוֹת
  choice: a cobrir
  rationale: O infinitivo de כסה significa cobrir. A tradução mantém a imagem hebraica sem explicitar “inundar”, embora isso esteja implícito.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto cósmico do salmo da criação, “a terra” comunica melhor o alcance do referente do que “a região” ou “o território”.
theological_decisions:
- issue: Referente dos verbos no plural
  choice: O pronome “elas” remete às águas do contexto imediato.
  alternative: Os verbos podem ser entendidos de forma mais geral como referentes às águas caóticas ou ao mar.
  rationale: Os versículos anteriores descrevem as águas fugindo e recebendo limites. O feminino plural explicita apenas o referente gramatical natural em português, sem acrescentar uma interpretação além do contexto.
- issue: Relação com o dilúvio
  choice: A tradução preserva a declaração de que as águas não voltarão a cobrir a terra, sem identificar explicitamente um episódio específico.
  alternative: Ler a frase como alusão direta à promessa posterior ao dilúvio.
  rationale: A linguagem pode evocar tanto a ordenação da criação quanto o dilúvio. O texto principal conserva essa tensão, enquanto a nota esclarece o referente imediato.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega-se “tu” para refletir a segunda pessoa singular do hebraico e manter o registro poético. A colocação pronominal e a sintaxe são naturais sem perder a concisão do verso.
