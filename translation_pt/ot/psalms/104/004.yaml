  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: pt
  text: Ele faz de seus mensageiros ventos[a][b] e de seus ministros fogo ardente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ventos” também pode significar “espíritos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ele faz de seus anjos espíritos e de seus ministros uma chama de fogo”. Hebreus 1:7 reflete essa interpretação tradicional.'
    reason: alternative_reading
  - marker: c
    text: 'A sintaxe hebraica também permite: “Ele faz dos ventos seus mensageiros e do fogo ardente seus ministros”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: עֹשֶׂה
  choice: faz
  rationale: O particípio descreve uma ação característica de Deus; “faz” mantém a força verbal e soa natural em português.
- source_word: מַלְאָכָיו
  choice: seus mensageiros
  rationale: מַלְאָךְ pode designar tanto um mensageiro quanto um anjo. “Mensageiros” preserva o sentido lexical amplo sem decidir antecipadamente se estão em vista seres celestiais ou agentes personificados.
- source_word: רוּחוֹת
  choice: ventos
  rationale: רוּחַ pode significar vento, sopro ou espírito. No contexto do hino da criação e em paralelo com o fogo, “ventos” preserva melhor a imagem concreta; a alternativa “espíritos” fica registrada em nota.
- source_word: מְשָׁרְתָיו
  choice: seus ministros
  rationale: O termo designa os que prestam serviço ou assistem alguém. “Ministros” conserva a ideia de serviço com registro digno e reconhecível no uso bíblico português.
- source_word: אֵשׁ לֹהֵט
  choice: fogo ardente
  rationale: A expressão mantém a imagem elementar do fogo e representa de modo natural o particípio לֹהֵט, que indica algo abrasador ou em chamas.
theological_decisions:
- issue: Se o versículo fala de anjos/espíritos ou de mensageiros/ventos como agentes de Deus
  choice: Ele faz de seus mensageiros ventos e de seus ministros, fogo ardente.
  alternative: 'Ele faz de seus anjos espíritos e de seus ministros uma chama de fogo; ou: Ele faz dos ventos seus mensageiros e das chamas de fogo, seus ministros.'
  rationale: O vocabulário e a sintaxe hebraicos permitem mais de uma interpretação. O texto principal conserva a ordem e a predicação tradicionais do hebraico, enquanto as notas registram tanto a leitura angelológica associada a Hebreus 1:7 quanto a leitura das forças criadas como mensageiros de Deus, favorecida pelo contexto do Salmo 104.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ministros” é empregado no sentido de servidores ou assistentes, não como título denominacional ou político. As notas preservam a ambiguidade lexical e sintática sem impor uma resolução teológica.
