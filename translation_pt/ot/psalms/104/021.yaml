lexical_decisions:
- source_word: הַכְּפִירִים
  choice: os leões jovens
  rationale: Traduz o substantivo hebraico no plural de modo claro e natural, preservando a referência a leões novos.
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: rugem pela presa
  rationale: Mantém a imagem concreta e a relação de finalidade expressa pelo hebraico.
- source_word: וּלְבַקֵּשׁ
  choice: e buscam
  rationale: Preserva a coordenação verbal explícita do texto massorético, sem convertê-la em uma construção subordinada.
- source_word: מֵאֵל אָכְלָם
  choice: de Deus o seu alimento
  rationale: Conserva a ideia de que Deus é a fonte de quem os animais procuram obter alimento, com ordem portuguesa digna e inteligível.
theological_decisions:
- issue: A providência divina no sustento dos animais
  choice: buscam de Deus o seu alimento
  alternative: procuram seu alimento junto a Deus
  rationale: A formulação preserva a afirmação poética de dependência de Deus sem explicar o mecanismo nem reduzir a tensão entre a caça dos leões e a providência divina.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A coordenação do hebraico foi preservada, em vez do particípio subordinado usado na camada inglesa.
