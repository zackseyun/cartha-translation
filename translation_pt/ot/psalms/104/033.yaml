  text: אָשִׁ֣ירָה לַ/יהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: pt
  text: Cantarei a Yahweh por toda a minha vida; farei música para o meu Deus enquanto eu existir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto eu viver”. A expressão hebraica pode referir-se à continuação da existência de modo mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Cantarei
  rationale: O coortativo qal na primeira pessoa expressa aqui uma intenção resoluta de louvar; o futuro em português comunica isso de modo natural.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário do cântico, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: בְּחַיָּי
  choice: por toda a minha vida
  rationale: A expressão significa literalmente “em/durante a minha vida”; esta formulação portuguesa transmite naturalmente a duração total pretendida.
- source_word: אֲזַמְּרָה
  choice: farei música
  rationale: O piel de זמר pode indicar cantar louvores ou fazer música. A tradução mantém o matiz musical e evita repetir simplesmente “cantarei”.
- source_word: לֵאלֹהַי
  choice: para o meu Deus
  rationale: A preposição marca o destinatário da música, e o sufixo de primeira pessoa é preservado em “meu Deus”.
- source_word: בְּעוֹדִי
  choice: enquanto eu existir
  rationale: עוד com o sufixo da primeira pessoa indica continuidade da existência. A formulação preserva a variação poética em relação a “por toda a minha vida”, sem restringir silenciosamente o sentido.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Farei música” conserva a distinção poética entre שׁיר e זמר; “enquanto eu existir” mantém a possível amplitude de עודי, com a alternativa idiomática registrada em nota.
