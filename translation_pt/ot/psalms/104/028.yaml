  text: תִּתֵּ֣ן לָ֭/הֶם יִלְקֹט֑וּ/ן תִּפְתַּ֥ח יָֽ֝דְ/ךָ֗ יִשְׂבְּע֥וּ/ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: pt
  text: Tu lhes dás, e eles recolhem; abres a tua mão, e eles se fartam de coisas boas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתֵּן
  choice: Tu lhes dás
  rationale: O qal imperfeito na segunda pessoa masculina singular dirige-se a Deus. A forma simples “dás” preserva a ação direta; o pronome “tu” dá clareza ao início do verso.
- source_word: לָהֶם
  choice: lhes
  rationale: A preposição ל com sufixo da terceira pessoa plural marca naturalmente o objeto indireto e é expressa de modo idiomático pelo pronome “lhes”.
- source_word: יִלְקֹטוּן
  choice: eles recolhem
  rationale: O verbo לקט significa recolher ou juntar. Em português, “recolhem” pode ser usado de maneira transitiva com o objeto elíptico, recuperado do que Deus dá, sem precisar acrescentar “isso”.
- source_word: תִּפְתַּח
  choice: abres
  rationale: O qal imperfeito na segunda pessoa masculina singular é traduzido diretamente, sem acrescentar a ideia não explícita de abrir amplamente.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Mantém a imagem antropomórfica concreta e poeticamente central da provisão divina.
- source_word: יִשְׂבְּעוּן
  choice: eles se fartam
  rationale: O verbo שבע expressa ficar saciado ou ter o bastante. “Se fartam” comunica de modo natural a plena saciedade produzida pela provisão de Deus, sem implicar necessariamente excesso.
- source_word: טוֹב
  choice: de coisas boas
  rationale: טוֹב funciona substantivamente. “Coisas boas” torna explícito em português o valor substantival e combina naturalmente com “se fartam”.
theological_decisions:
- issue: Linguagem antropomórfica para a provisão de Deus
  choice: Manter “abres a tua mão”
  alternative: “provês generosamente” ou “dás livremente”
  rationale: A imagem concreta da mão aberta apresenta poeticamente o cuidado sustentador de Deus e não deve ser reduzida a uma paráfrase abstrata.
- issue: Sentido de saciedade em יִשְׂבְּעוּן טוֹב
  choice: “eles se fartam de coisas boas”
  alternative: “eles ficam satisfeitos com o bem”
  rationale: A escolha preserva o sentido concreto de receber alimento ou provisão suficiente no contexto das criaturas, sem excluir a amplitude semântica de טוֹב.
translation_notes:
  register: Português moderno, claro e dignificado, com fluidez tanto no Brasil quanto em outros contextos lusófonos. Conserva o paralelismo poético e a segunda pessoa singular dirigida a Deus.
