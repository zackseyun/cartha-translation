  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: pt
  text: Que os pecadores desapareçam da terra[a], e que os perversos não existam mais. Bendiga Yahweh, ó minha alma. Aleluia![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Que os pecadores cheguem ao fim da terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Louvem Yah!”. “Aleluia” é a transliteração tradicional dessa expressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: desapareçam
  rationale: O Qal imperfeito de תמם pode indicar chegar ao fim, acabar ou deixar de existir. No contexto do desejo imprecatório e com “da terra”, “desapareçam” comunica a remoção sem acrescentar explicitamente a ideia de serem consumidos.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: Designação pessoal plural para os que se caracterizam pelo pecado; evita transformar o referente em “pecados” abstratos.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: O contexto cósmico e criacional do Salmo 104 favorece “terra” em vez de uma região ou país específico.
- source_word: וּרְשָׁעִים
  choice: e os perversos
  rationale: Traduz o adjetivo substantivado como uma categoria moral pessoal, em português atual e claro.
- source_word: עוֹד אֵינָם
  choice: não existam mais
  rationale: Expressa diretamente a cessação de existência ou presença indicada pela locução hebraica, preservando o paralelismo.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Bendiga a Yahweh, ó minha alma
  rationale: Mantém o sentido de ברך quando Deus é o objeto e preserva a autoexortação poética dirigida à própria alma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: הַלְלוּ יָהּ
  choice: Aleluia!
  rationale: Emprega a forma litúrgica consagrada em português; a composição e o sentido literal são esclarecidos em nota.
theological_decisions:
- issue: Se o desejo se refere ao fim dos pecados ou ao desaparecimento dos próprios pecadores
  choice: O texto fala dos pecadores e dos perversos desaparecendo da terra.
  alternative: Que os pecados acabem na terra.
  rationale: חַטָּאִים e רְשָׁעִים designam pessoas. A forma volitiva “Que...” preserva o caráter de desejo ou oração sem suavizar a tensão imprecatória nem transformá-la em ordem direta.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Desapareçam da terra” é mais natural que o decalque “sejam acabados da terra”, enquanto a nota conserva a alternativa mais formal. O nome Yahweh é mantido, e “Aleluia” preserva a expressão litúrgica reconhecível.
