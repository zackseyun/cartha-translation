  text: הַ/מַּבִּ֣יט לָ֭/אָרֶץ וַ/תִּרְעָ֑ד יִגַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: pt
  text: Ele olha para a terra[a], e ela treme; toca nos montes, e eles fumegam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Aquele que olha para a terra, e ela treme; toca nos montes, e eles fumegam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Ele olha para
  rationale: O particípio hifil funciona como descrição substantivada de Deus, literalmente «aquele que olha». Em português, a oração finita mantém o sentido vívido e soa mais natural.
- source_word: לָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar «terra» no sentido de território, o contexto cósmico e criacional do Salmo 104 favorece o planeta ou mundo habitado.
- source_word: וַתִּרְעָד
  choice: e ela treme
  rationale: O verbo רעד expressa tremor ou abalo. «Treme» conserva a vivacidade poética, e o pronome explicita naturalmente que o sujeito é «a terra».
- source_word: יִגַּע
  choice: toca
  rationale: נגע significa normalmente «tocar» ou «alcançar e tocar». A forma simples comunica o poder divino sem esforço sugerido pela imagem.
- source_word: בֶּהָרִים
  choice: nos montes
  rationale: הָרִים designa elevações como montes ou montanhas. «Montes» é tradicional, corrente e poeticamente conciso em português, sem diminuir necessariamente a grandeza da imagem.
- source_word: וְיֶעֱשָׁנוּ
  choice: e eles fumegam
  rationale: O verbo עשׁן significa emitir fumaça. «Fumegam» é conciso, natural e preserva a concordância plural com os montes.
theological_decisions:
- issue: Sujeito divino implícito na oração participial
  choice: Empregar «Ele», referindo-se a Deus no contexto do salmo.
  alternative: Traduzir mais formalmente por «Aquele que olha para a terra...»
  rationale: O contexto identifica claramente Deus como sujeito. O pronome produz uma formulação natural em português sem acrescentar uma afirmação doutrinária alheia ao texto; a estrutura mais formal é preservada em nota.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A construção é direta e mantém o paralelismo e a intensidade das duas reações da criação ao olhar e ao toque divinos.
