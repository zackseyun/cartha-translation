  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: pt
  text: Fez a lua para os tempos determinados[a]; o sol conhece o seu ocaso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as estações” ou “as festas”; o termo hebraico pode se referir a tempos fixos ou determinados, inclusive às épocas festivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: Fez
  rationale: O Qal de עשה significa normalmente “fazer”. O sujeito divino está implícito no contexto, e “fez” evita interpretar o verbo como “determinou”.
- source_word: יָרֵחַ
  choice: a lua
  rationale: Equivalente direto e natural para o corpo celeste.
- source_word: לְמוֹעֲדִים
  choice: para os tempos determinados
  rationale: מוֹעֵד pode indicar tempo fixado, época ou ocasião festiva. A formulação ampla preserva a ideia de tempos estabelecidos sem restringi-la às estações climáticas ou às festas religiosas.
- source_word: שֶׁמֶשׁ
  choice: o sol
  rationale: Equivalente padrão e inequívoco.
- source_word: יָדַע
  choice: sabe
  rationale: Mantém o sentido literal de ידע e a personificação poética do sol.
- source_word: מְבוֹאוֹ
  choice: quando se pôr
  rationale: Embora מבוא denote literalmente entrada ou chegada, em relação ao sol refere-se idiomaticamente ao seu ocaso. A construção “sabe quando se pôr” expressa com naturalidade que o sol conhece o momento do próprio poente.
theological_decisions:
- issue: Sentido de מוֹעֲדִים no contexto da criação
  choice: tempos determinados, em sentido amplo
  alternative: estações ou festas
  rationale: O versículo apresenta a ordem estabelecida por Deus para os astros. A lua marca tempos fixos que podem incluir épocas e datas festivas; a tradução ampla conserva essa extensão sem impor uma leitura exclusivamente climática ou cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem poética concisa foi preservada, assim como a personificação do sol. “Tempos determinados” conserva a amplitude lexical do hebraico, e a nota registra as alternativas relevantes.
