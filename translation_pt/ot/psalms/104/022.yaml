  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: pt
  text: O sol nasce; eles se recolhem[a] e se deitam em seus covis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “são reunidos” ou “se retiram”. O verbo hebraico pode ser entendido em sentido passivo (“ser reunidos”) ou reflexivo/intransitivo (“recolher-se, retirar-se”).
    reason: lexical_alternative
  - marker: b
    text: Ou “tocas” ou “moradas”. A palavra hebraica designa um lugar de habitação; neste contexto animal, “covis” é mais específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: nasce
  rationale: O qal imperfeito de זרח, tendo “o sol” como sujeito, descreve o nascer ou despontar do sol. “Nasce” é a expressão corrente e adequada à sequência temporal.
- source_word: הַשֶּׁמֶשׁ
  choice: o sol
  rationale: Substantivo definido, traduzido diretamente e com naturalidade.
- source_word: יֵאָסֵפוּן
  choice: eles se recolhem
  rationale: O nifal de אסף pode ser entendido passivamente, “são reunidos”, ou em sentido reflexivo/intransitivo, “recolhem-se, retiram-se”. No contexto dos animais noturnos que voltam quando o sol nasce, “se recolhem” preserva bem o movimento sem introduzir um agente externo.
- source_word: וְאֶל
  choice: e ... em
  rationale: Embora אֶל indique literalmente direção (“para”), em português o movimento já é expresso por “se recolhem”; com “se deitam”, a localização final é naturalmente introduzida por “em”.
- source_word: מְעוֹנֹתָם
  choice: seus covis
  rationale: מָעוֹן designa uma habitação ou morada. No contexto animal, “covis” é específico, claro e natural.
- source_word: יִרְבָּצוּן
  choice: se deitam
  rationale: O qal de רבץ descreve com frequência animais que se deitam ou ficam agachados. “Se deitam” comunica claramente que se acomodam para repousar.
