source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: pt
  text: Escondes o teu rosto[a], e eles ficam apavorados; retiras o sopro deles[b], e eles morrem e voltam ao seu pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua presença”. Em hebraico, “o teu rosto” é uma expressão comum para indicar presença pessoal ou favor.
    reason: lexical_alternative
  - marker: b
    text: Ou “o espírito deles”. O termo hebraico רוּחַ pode significar “sopro”, “vento” ou “espírito”; aqui, o contexto da morte e do retorno ao pó favorece “sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: Escondes
  rationale: O hifil de סתר significa esconder ou ocultar. “Escondes” é natural em português e preserva a imagem relacional da retirada da presença favorável de Deus.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: A expressão significa literalmente “o teu rosto” e pode designar presença ou favor. A imagem concreta foi mantida por sua força poética e clareza.
- source_word: יִבָּהֵלוּן
  choice: ficam apavorados
  rationale: O nifal de בהל expressa forte perturbação, alarme ou pavor. “Ficam apavorados” comunica de modo corrente a intensidade da reação.
- source_word: תֹּסֵף
  choice: retiras
  rationale: O qal de אסף pode significar recolher, juntar ou retirar. Com רוּחָם como objeto, “retiras” exprime de forma concisa a remoção do princípio vital.
- source_word: רוּחָם
  choice: o sopro deles
  rationale: רוּחַ pode significar sopro, vento ou espírito. No contexto da morte e do retorno ao pó, “sopro” representa naturalmente a respiração ou força vital, sem eliminar a alternativa “espírito”.
- source_word: יִגְוָעוּן
  choice: morrem
  rationale: גוע significa expirar ou perecer. “Morrem” é a equivalência mais clara e idiomática no contexto.
- source_word: עֲפָרָם
  choice: seu pó
  rationale: O hebraico traz o sufixo possessivo, literalmente “pó deles”. “Seu pó” preserva essa forma e evoca a mortalidade e o retorno à matéria de origem.
- source_word: יְשׁוּבוּן
  choice: voltam
  rationale: שוב significa voltar ou retornar. “Voltam” combina naturalmente com “ao seu pó” e conserva o movimento expresso no original.
theological_decisions:
- issue: Sentido de רוּחָם no contexto de criação e morte
  choice: o sopro deles
  alternative: o espírito deles
  rationale: A sequência descreve seres vivos privados do princípio que os anima, morrendo e voltando ao pó. “Sopro” preserva o vínculo com a vida corporal e evita impor ao verso uma definição posterior da constituição humana, enquanto a nota registra a ambiguidade lexical.
- issue: Linguagem antropomórfica do rosto de Deus
  choice: o teu rosto
  alternative: a tua presença
  rationale: A imagem hebraica foi mantida para preservar sua concretude e força poética. A nota esclarece que “rosto” também pode representar presença ou favor, sem substituir a metáfora no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção fluente para leitores brasileiros. O paralelismo poético foi preservado, assim como as imagens concretas de “rosto”, “sopro” e “pó”.
