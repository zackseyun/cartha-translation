  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: pt
  text: e o vinho alegra o coração do ser humano[a], fazendo o rosto brilhar mais do que o azeite faz[b], e o pão sustenta o coração do ser humano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o coração do homem” ou “o coração de uma pessoa”. O hebraico usa um singular representativo para o ser humano em geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazendo o rosto brilhar com azeite”. A preposição hebraica pode indicar comparação (“mais do que o azeite”) ou meio/associação (“com azeite”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/יַיִן
  choice: e o vinho
  rationale: Traduz o substantivo concreto como substância genérica, de modo natural em português, preservando a conjunção.
- source_word: יְשַׂמַּח
  choice: alegra
  rationale: 'O piel de שׂמח tem sentido causativo: produzir alegria. “Alegra” é claro, conciso e poético.'
- source_word: לְבַב אֱנוֹשׁ
  choice: o coração do ser humano
  rationale: לְבַב designa o centro da vida interior, e אֱנוֹשׁ refere-se aqui ao ser humano mortal em sentido representativo, não especificamente a um indivíduo masculino.
- source_word: לְ/הַצְהִיל פָּנִים
  choice: fazendo o rosto brilhar
  rationale: O infinitivo causativo expressa propósito ou resultado. O gerúndio mantém a fluidez poética sem eliminar essa nuance.
- source_word: מִ/שָּׁמֶן
  choice: mais do que o azeite
  rationale: מִן admite valor comparativo, enquanto שֶׁמֶן, neste contexto mediterrânico e cosmético/alimentar, é naturalmente entendido como azeite. A leitura instrumental também é preservada em nota.
- source_word: וְ/לֶחֶם
  choice: e o pão
  rationale: Mantém o sentido concreto de לֶחֶם e a tríade poética de vinho, azeite e pão.
- source_word: יִסְעָד
  choice: sustenta
  rationale: סעד significa apoiar, amparar ou sustentar; aqui descreve adequadamente a função nutritiva do pão.
theological_decisions:
- issue: O singular representativo אֱנוֹשׁ
  choice: ser humano
  alternative: homem; pessoa
  rationale: O termo abrange a humanidade mortal e não identifica necessariamente um homem do sexo masculino. “Ser humano” comunica essa referência genérica sem apagar o singular representativo.
- issue: A relação de מִשָּׁמֶן com o brilho do rosto
  choice: 'comparação: “mais do que o azeite”'
  alternative: 'meio ou associação: “com azeite”'
  rationale: A preposição מִן pode introduzir comparação, origem ou meio. A leitura comparativa é coerente, mas a construção permanece genuinamente ambígua; por isso, a leitura instrumental é registrada em nota, sem transformar a ambiguidade em afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Azeite” foi preferido a “óleo” por se ajustar melhor ao contexto bíblico de שֶׁמֶן, enquanto a repetição de “coração do ser humano” conserva o paralelismo hebraico.
