lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: onde
  rationale: A combinação introduz uma oração relativa locativa que retoma as árvores do versículo anterior; “onde” é a forma natural e concisa em português.
- source_word: צִפֳּרִים
  choice: os pássaros
  rationale: O termo é uma designação geral para aves; “os pássaros” comunica naturalmente a referência genérica no contexto.
- source_word: יְקַנֵּנוּ
  choice: fazem seus ninhos
  rationale: O verbo קנן significa fazer ninho ou aninhar-se. A expressão escolhida é clara, atual e preserva a ação verbal.
- source_word: חֲסִידָה
  choice: a cegonha
  rationale: É a identificação convencional e bem estabelecida do substantivo hebraico; o singular representativo foi mantido.
- source_word: בְּרוֹשִׁים
  choice: os ciprestes
  rationale: O termo designa uma conífera, mas a espécie exata é incerta. “Ciprestes” é uma tradução tradicional e plausível, com a incerteza registrada em nota.
- source_word: בֵּיתָהּ
  choice: tem sua morada
  rationale: Literalmente, “sua casa”. “Tem sua morada” expressa com naturalidade o lugar em que a cegonha habita, sem acrescentar a ideia específica de ninho.
