  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: pt
  text: Que a minha meditação lhe seja agradável[a]; eu me alegrarei em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a minha reflexão lhe seja doce” ou “aceitável”.'
    reason: Alternativas lexicais para יֶעֱרַב e שִׂיחִי, que podem ressaltar doçura, aceitabilidade ou reflexão.
lexical_decisions:
- source_word: יֶעֱרַב
  choice: seja agradável
  rationale: No qal, o verbo pode expressar aquilo que é doce, agradável ou aceitável. “Seja agradável” comunica com naturalidade a oração para que a meditação seja favoravelmente recebida.
- source_word: עָלָיו
  choice: lhe
  rationale: Com יֶעֱרַב, a preposição עַל e o sufixo masculino singular indicam aquele a quem algo agrada. “Lhe” é idiomático em português, e o referente contextual é Deus.
- source_word: שִׂיחִי
  choice: a minha meditação
  rationale: שִׂיחַ pode designar meditação, reflexão, expressão ou queixa. O contexto de louvor favorece “meditação”, sem excluir por completo a dimensão verbal do termo.
- source_word: אָנֹכִי
  choice: eu
  rationale: O pronome independente põe alguma ênfase no salmista. O “eu” explícito antes de “me alegrarei” preserva essa ênfase de modo natural.
- source_word: אֶשְׂמַח
  choice: me alegrarei
  rationale: O imperfeito pode exprimir resolução ou disposição contínua. O futuro português transmite adequadamente a decisão do salmista.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ marca o objeto ou âmbito da alegria, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem poética e o paralelismo foram preservados sem rigidez excessiva.
