  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: pt
  text: Os montes se elevaram[a], os vales desceram, até o lugar que estabeleceste para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra construção plausível da poesia hebraica: “Elas subiram sobre os montes e desceram aos vales, até o lugar que estabeleceste para elas”, entendendo-se as águas como sujeito implícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ הָרִים
  choice: Os montes se elevaram
  rationale: Toma הָרִים como sujeito de יַעֲלוּ, conforme uma construção plausível do hebraico massorético. “Elevaram-se” expressa naturalmente o movimento ascendente do relevo sem acrescentar uma explicação geológica.
- source_word: יֵרְדוּ בְקָעוֹת
  choice: os vales desceram
  rationale: Toma בְקָעוֹת como sujeito paralelo de יֵרְדוּ. “Desceram” preserva o verbo hebraico e o paralelismo poético, evitando tornar a imagem mais específica do que o original.
- source_word: בְקָעוֹת
  choice: vales
  rationale: Designa depressões ou vales no terreno; “vales” é claro, corrente e apropriado ao contraste com “montes”.
- source_word: אֶל מְקוֹם
  choice: até o lugar
  rationale: A preposição marca o destino do movimento. “Até o lugar” soa natural em português e mantém a referência definida pela oração seguinte.
- source_word: זֶה יָסַדְתָּ
  choice: que estabeleceste
  rationale: O demonstrativo hebraico integra a expressão relativa referente ao lugar. “Que estabeleceste” é idiomático e conserva a ideia de Deus fixar ou determinar esse lugar.
- source_word: לָהֶם
  choice: para eles
  rationale: Mantém o sufixo masculino plural sem decidir de modo indevido se a referência conceitual recai sobre os elementos do relevo ou, na leitura alternativa, sobre as águas.
theological_decisions:
- issue: Sujeito dos verbos na poesia hebraica
  choice: 'Os montes e os vales são apresentados como sujeitos: “Os montes se elevaram, os vales desceram”.'
  alternative: 'As águas são o sujeito implícito: “Elas subiram sobre os montes e desceram pelos vales”.'
  rationale: A vocalização e a sintaxe permitem entender “montes” e “vales” como sujeitos, formando uma imagem coerente da ordenação da criação. Contudo, o contexto imediato trata das águas em retirada, de modo que a leitura tradicional com águas como sujeito continua plausível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a ambiguidade sintática genuína do hebraico por meio da nota.
