base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: pt
  text: Envias o teu Espírito[a]; eles são criados, e renovas a face do solo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu sopro” ou “o teu vento”; o termo hebraico רוּחַ pode ter os três sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: envias
  rationale: O piel de שׁלח significa “enviar” ou “mandar”. “Envias” é direto, natural e conserva a ação divina sem acrescentar nuances ausentes do hebraico.
- source_word: רוּחֲךָ
  choice: o teu Espírito
  rationale: רוּחַ pode significar “espírito”, “sopro” ou “vento”. Neste contexto de criação e renovação, “Espírito” expressa adequadamente a atuação vivificadora de Deus, enquanto as outras possibilidades lexicais são preservadas em nota.
- source_word: יִבָּרֵאוּן
  choice: eles são criados
  rationale: O nifal de ברא tem sentido passivo, “ser criado”. A tradução evita acrescentar “de novo”, pois a ideia de renovação aparece explicitamente na oração seguinte.
- source_word: וּתְחַדֵּשׁ
  choice: e renovas
  rationale: O piel de חדשׁ significa “renovar” ou “tornar novo”. “Renovas” mantém tanto o valor lexical quanto a coordenação introduzida por וּ.
- source_word: פְּנֵי
  choice: a face de
  rationale: A expressão preserva a imagem poética literal do hebraico e continua inteligível em português; “superfície” seria possível, mas menos literário.
- source_word: אֲדָמָה
  choice: o solo
  rationale: אֲדָמָה designa o chão, a terra cultivável ou o solo. “Solo” distingue o termo do conceito cósmico mais amplo de “terra” e se ajusta à imagem de sua renovação.
theological_decisions:
- issue: Sentido de רוּחַ no contexto da criação
  choice: o teu Espírito
  alternative: o teu sopro; o teu vento
  rationale: “Espírito” conserva a ressonância da ação vivificadora de Deus sem deixar de ser lexicalmente defensável. Como o hebraico permite também “sopro” e “vento”, a nota preserva essa ambiguidade em vez de eliminá-la.
- issue: Relação sintática entre o envio e a criação
  choice: Quando envias... eles são criados
  alternative: Envias... eles são criados
  rationale: A formulação temporal explicita em português a relação natural entre as duas ações no contexto, sem afirmar além do texto como essa ação ocorre. A construção coordenada mais próxima da forma hebraica é registrada em nota.
translation_notes:
  register: Português atual, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa do singular mantém a alocução direta a Deus; a omissão do pronome sujeito é idiomática. “Face do solo” preserva a textura poética do hebraico.
