  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: pt
  text: Ele faz crescer o capim para os animais e as plantas para o trabalho do ser humano,[a] a fim de tirar da terra o pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o serviço do ser humano” ou “para o cultivo humano”. A expressão hebraica pode indicar trabalho, serviço ou cultivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: faz crescer
  rationale: Preserva a força causativa do particípio hifil e soa natural em português.
- source_word: חָצִיר
  choice: capim
  rationale: No contexto, designa vegetação que serve de alimento aos animais; “capim” é claro e natural para leitores brasileiros.
- source_word: לַבְּהֵמָה
  choice: para os animais
  rationale: בְּהֵמָה indica aqui animais terrestres, especialmente os domésticos; “animais” evita limitar indevidamente o referente apenas ao gado bovino.
- source_word: וְעֵשֶׂב
  choice: e as plantas
  rationale: עֵשֶׂב é mais amplo que “ervas” e abrange a vegetação útil ao ser humano.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: para o trabalho do ser humano
  rationale: Mantém a relação compacta e algo ambígua entre a vegetação e o trabalho/serviço humano, sem restringi-la apenas ao cultivo.
- source_word: לְהוֹצִיא
  choice: a fim de tirar
  rationale: Expressa adequadamente a ideia de finalidade ou resultado do infinitivo hebraico.
- source_word: לֶחֶם
  choice: pão
  rationale: Conserva o sentido lexical concreto e a imagem agrícola, embora o termo possa, em outros contextos, ter o sentido mais amplo de alimento.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Retrata a terra ou o solo como fonte da produção e preserva a concisão poética.
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: ser humano
  alternative: homem / humanidade
  rationale: O substantivo singular é representativo e se refere à humanidade, não especificamente a um indivíduo masculino. “Ser humano” comunica esse sentido genérico com clareza em português moderno.
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. A tradução conserva o paralelismo e a ambiguidade de עֲבֹדָה, esclarecida em nota.
