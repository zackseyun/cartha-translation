  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: pt
  text: Tu a cobriste com o abismo como com uma veste[a]; as águas ficaram acima dos montes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as profundezas” ou “o abismo primordial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: o abismo
  rationale: Aqui תְּהוֹם designa as águas profundas, o abismo aquático. “O abismo” conserva a imagem cósmica e poética sem impor uma interpretação mitológica.
- source_word: כַּ/לְּבוּשׁ
  choice: como com uma veste
  rationale: O prefixo כַּ marca comparação, e לְבוּשׁ significa veste ou roupa. A formulação preserva o vínculo com “cobriste” e mantém o símile explícito.
- source_word: כִּסִּיתוֹ
  choice: Tu a cobriste
  rationale: A forma verbal está na segunda pessoa masculina singular, com sufixo de terceira pessoa masculina singular. Em português, o pronome retoma naturalmente “a terra”, palavra feminina no contexto anterior, daí “a”. A segunda pessoa preserva a fala dirigida a Deus.
- source_word: עַל
  choice: acima de
  rationale: Neste contexto, עַל expressa a posição das águas sobre os montes; “acima de” comunica claramente que elas se elevavam além deles.
- source_word: הָרִים
  choice: os montes
  rationale: הָרִים refere-se a montanhas ou montes. “Montes” é natural no registro poético bíblico em português e preserva a grandeza da cena.
- source_word: יַעַמְדוּ
  choice: ficaram
  rationale: O verbo עמד significa literalmente estar de pé ou permanecer. Referido às águas, “ficaram” transmite de modo natural seu estado ou posição, sem introduzir movimento ausente do hebraico.
- source_word: מָיִם
  choice: as águas
  rationale: “As águas” retoma o abismo aquático mencionado no primeiro membro e preserva o paralelismo poético.
theological_decisions:
- issue: Pessoa do verbo e destinatário
  choice: 'Discurso direto a Deus: “Tu a cobriste”'
  alternative: 'Narração em terceira pessoa: “Ele a cobriu”'
  rationale: A morfologia hebraica é inequivocamente de segunda pessoa masculina singular, e o contexto do salmo dirige-se ao SENHOR. Mantê-la preserva a estrutura de louvor dirigido a Deus.
- issue: Referente do sufixo em כִּסִּיתוֹ
  choice: A terra, retomada em português pelo pronome feminino “a”
  alternative: Um referente masculino expresso como “o”
  rationale: O sufixo hebraico é gramaticalmente masculino porque retoma אֶרֶץ, que em hebraico é feminino em geral, mas pode apresentar referência/forma contextual debatida; no fluxo de 104:5–6, o referente semântico é a terra. Em português, a concordância natural exige “a”.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. Emprega-se “Tu” para conservar a segunda pessoa explícita do hebraico, “veste” pelo tom literário acessível e “montes” como termo bíblico corrente. A ambiguidade lexical de תְּהוֹם é registrada em nota.
