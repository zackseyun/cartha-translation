  text: הַֽ/מְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּ/נְּחָלִ֑ים בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: pt
  text: Ele faz brotar fontes nos vales[a]; elas correm entre os montes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas ravinas» ou «nos leitos das torrentes»; o termo hebraico pode indicar leitos de cursos d’água sazonais ou os vales associados a eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Ele faz brotar
  rationale: O particípio hifil de שׁלח descreve a ação providencial contínua de Deus. Em português, «faz brotar» expressa de modo natural o envio das fontes sem sugerir que elas sejam objetos transportados.
- source_word: מַעְיָנִים
  choice: fontes
  rationale: מַעְיָן designa uma nascente ou fonte natural de água; «fontes» é claro, corrente e adequado ao contexto.
- source_word: בַּנְּחָלִים
  choice: nos vales
  rationale: נחל pode indicar vale, ravina, leito de torrente ou uádi. «Nos vales» comunica de modo acessível a topografia, enquanto a nota preserva as alternativas mais específicas.
- source_word: בֵּין הָרִים
  choice: entre os montes
  rationale: A expressão localiza diretamente o curso das águas entre elevações. «Montes» é natural em português bíblico moderno e não exclui montanhas.
- source_word: יְהַלֵּכוּן
  choice: elas correm
  rationale: Embora הלך signifique literalmente ir ou andar, aplicado às águas indica seu movimento. «Correm» é idiomático e mantém uma imagem um pouco mais concreta que «fluem».
theological_decisions:
- issue: Sujeito implícito do particípio
  choice: «Ele» refere-se a Deus
  alternative: «Aquele que faz brotar»
  rationale: O contexto do salmo identifica Deus como agente da ordenação providencial da criação. A forma finita com «Ele» produz uma frase natural em português sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva o paralelismo e a imagem hídrica, evitando o termo técnico «uádis» no texto principal.
