  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: pt
  text: vestindo-te de luz como de uma roupa, estendendo os céus como uma cortina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma cortina de tenda”. O termo hebraico pode designar um painel de tecido usado numa tenda ou no tabernáculo.'
    reason: alternativa lexical
lexical_decisions:
- source_word: עֹטֶה
  choice: vestindo-te
  rationale: O particípio qal apresenta uma ação poética vívida. A forma reflexiva preserva Deus como aquele que se cobre de luz, e a escolha soa natural em português junto à comparação com uma roupa.
- source_word: אוֹר
  choice: luz
  rationale: O substantivo denota luz, empregada aqui como aquilo de que Deus poeticamente se veste; não é necessário substituí-la por uma abstração como “esplendor”.
- source_word: כַּשַּׂלְמָה
  choice: como de uma roupa
  rationale: שַׂלְמָה é um termo amplo para roupa ou veste. A construção “vestindo-te de luz como de uma roupa” mantém a comparação sem restringi-la a um tipo específico de vestimenta.
- source_word: נוֹטֶה
  choice: estendendo
  rationale: O particípio qal de נטה descreve abrir, estender ou espalhar algo. “Estendendo” conserva a ação contínua e a imagem cósmica.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural hebraico pode designar o céu ou os céus; neste hino da criação, “os céus” preserva melhor a amplitude e o registro elevado da imagem.
- source_word: כַּיְרִיעָה
  choice: como uma cortina
  rationale: יְרִיעָה designa uma cortina, painel de tecido ou cobertura, muitas vezes ligada a uma tenda ou ao tabernáculo. “Cortina” é conciso e natural, enquanto a nuance de tenda é registrada em nota.
theological_decisions:
- issue: Retrato antropomórfico de Deus vestindo-se de luz e estendendo os céus
  choice: Manter diretamente as metáforas poéticas
  alternative: Parafrasear como “estás cercado de luz” ou “manifestas a luz como teu esplendor”
  rationale: O hebraico descreve poeticamente a majestade e a atividade criadora de Deus. Preservar as imagens evita converter a tradução em explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os particípios coordenados preservam o movimento poético do hebraico; “roupa” evita arcaísmo, e “céus” mantém a elevação do contexto.
