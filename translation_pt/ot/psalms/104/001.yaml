  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: pt
  text: Bendiga Yahweh[a], ó minha alma! Yahweh, meu Deus, como és grandioso! De esplendor e majestade te vestiste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui transliterado “Yahweh”; também é tradicionalmente traduzido por “SENHOR” ou transliterado “Jeová”.'
    reason: Identifica o Tetragrama e registra as principais formas de representá-lo em português.
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Bendiga
  rationale: Mantém o sentido básico de ברך na autoexortação litúrgica. A forma na terceira pessoa do singular é a construção corrente do imperativo em português ao dirigir-se à própria alma.
- source_word: נַפְשִׁי
  choice: ó minha alma
  rationale: Preserva a apóstrofe à própria vida ou ao ser interior do salmista; o vocativo poético é natural e dignificado em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: como és grandioso
  rationale: Expressa de modo natural o valor estativo do perfeito e a forte intensificação de מְאֹד. A exclamação conserva o caráter de louvor sem sugerir que Deus tenha passado a ser grande.
- source_word: הוֹד וְהָדָר
  choice: esplendor e majestade
  rationale: Reproduz o par de termos quase sinônimos que retratam a magnificência visível e régia de Deus.
- source_word: לָבָשְׁתָּ
  choice: te vestiste
  rationale: Conserva a metáfora concreta de vestir esplendor e majestade, bem como o aspecto formal do perfeito hebraico, em formulação poética natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente por um título; a nota informa as convenções alternativas.
- issue: Sentido temporal de גָּדַלְתָּ
  choice: 'estado presente: “és grandioso”'
  alternative: “tornaste-te muito grande”
  rationale: No contexto do louvor, o perfeito descreve adequadamente a grandeza reconhecida de Deus; traduzi-lo como mudança de estado poderia introduzir a ideia teologicamente carregada de que Deus antes não era grande.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A inversão “De esplendor e majestade te vestiste” mantém a imagem de vestimenta e o tom elevado sem arcaísmo excessivo.
