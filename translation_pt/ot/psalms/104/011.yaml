  text: יַ֭שְׁקוּ כָּל חַיְת֣/וֹ שָׂדָ֑י יִשְׁבְּר֖וּ פְרָאִ֣ים צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/011.yaml
  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: pt
  text: Dão de beber[a] a todos os animais do campo; os jumentos selvagens[b] saciam a sede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todos os animais do campo bebem delas”.'
    reason: A forma causativa hebraica apresenta as águas como aquilo que dá de beber; em português, a mesma cena também pode ser expressa colocando os animais como sujeito.
  - marker: b
    text: 'Ou: “onagros”.'
    reason: Alternativa técnica para o animal designado pelo termo hebraico.
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: Dão de beber
  rationale: O hifil de שׁקה significa fazer beber ou fornecer água. A forma portuguesa preserva a perspectiva ativa do hebraico, cujo sujeito são as fontes ou águas mencionadas no contexto anterior.
- source_word: כָּל חַיְתוֹ שָׂדָי
  choice: a todos os animais do campo
  rationale: Expressa de modo claro e atual a totalidade dos animais que vivem na região aberta; “animais” é mais natural e abrangente que “feras” neste contexto.
- source_word: יִשְׁבְּרוּ ... צְמָאָם
  choice: saciam a sede
  rationale: שׁבר com “sede” forma uma expressão idiomática que significa satisfazer ou extinguir a sede; “saciam a sede” é natural e mantém o sentido concreto.
- source_word: פְרָאִים
  choice: jumentos selvagens
  rationale: Designa equídeos selvagens, também chamados onagros. “Jumentos selvagens” é imediatamente compreensível para leitores comuns.
