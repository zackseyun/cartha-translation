    rationale: “Diante de” pode indicar sobretudo localização ou presença. “À tua repreensão” preserva de modo mais direto a ideia de que as águas fogem em resposta à repreensão.
  - severity: medium
    issue: A nota de rodapé usa “escaparam” como alternativa para יְנוּסוּן.
    rationale: נוּס significa fugir, tomar fuga ou correr para longe; “escapar” pode sugerir êxito em livrar-se de algo e não é a alternativa mais fiel aqui. A nota deve oferecer formulações portuguesas diretamente compatíveis com os dois verbos.
