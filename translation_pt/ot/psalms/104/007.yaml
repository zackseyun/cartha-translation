  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: pt
  text: À tua repreensão, elas fugiram[a]; ao som do teu trovão, retiraram-se às pressas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “À tua repreensão, elas correram para longe; ao som do teu trovão, apressaram-se a fugir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: tua repreensão
  rationale: Preserva a ideia de uma censura ou ordem verbal enérgica de Deus, com poder sobre a criação, em linguagem portuguesa natural e digna.
- source_word: יְנוּסוּן
  choice: elas fugiram
  rationale: Traduz diretamente o verbo נוּס, “fugir”. O pretérito perfeito se ajusta ao relato poético da retirada das águas no contexto.
- source_word: קוֹל
  choice: ao som de
  rationale: Embora קוֹל possa significar “voz”, “som” ou “ruído”, “ao som do teu trovão” é a expressão mais natural em português e conserva a imagem auditiva.
- source_word: רַעַמְךָ
  choice: teu trovão
  rationale: Tradução direta de רַעַם, mantendo a vívida imagem do poder divino manifestado no trovão.
- source_word: יֵחָפֵזוּן
  choice: retiraram-se às pressas
  rationale: Expressa o movimento apressado indicado por חפז sem acrescentar necessariamente a ideia mais específica de pânico; “retiraram-se” também torna claro o afastamento no contexto.
- source_word: מִן ... מִן
  choice: Diante de ... ao som de
  rationale: Aqui מִן indica a causa ou ocasião imediata da reação. As formulações portuguesas comunicam naturalmente que as águas recuam em resposta à repreensão e ao trovão de Deus.
theological_decisions:
- issue: Referente dos verbos no plural (“fugiram” / “retiraram-se”)
  choice: Manter o sujeito implícito por meio do pronome feminino “elas”, retomando as águas do contexto anterior.
  alternative: Explicitar “as águas fugiram”.
  rationale: O hebraico depende do contexto e não repete o substantivo neste versículo. “Elas” preserva a continuidade poética sem introduzir um nome ausente da linha, e o gênero feminino identifica naturalmente “as águas” em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva o paralelismo poético e o sujeito contextual. “Às pressas” é corrente sem ser coloquial; “repreensão” mantém a força teológica da fala divina.
