  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: pt
  text: 'que assenta sobre as águas as vigas dos seus aposentos superiores,

    que faz das nuvens o seu carro,

    que anda sobre as asas do vento[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito”; a palavra hebraica רוּחַ pode significar tanto “vento” como “espírito”. Aqui, “vento” se ajusta melhor às imagens meteorológicas do contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: que assenta ... as vigas
  rationale: O particípio de קרה descreve a colocação de vigas ou a construção de um teto. “Assenta ... as vigas” preserva a metáfora arquitetônica concreta e soa natural em português.
- source_word: בַמַּיִם
  choice: sobre as águas
  rationale: Embora ב possa indicar “em”, “com” ou “sobre”, a imagem arquitetônica favorece “sobre as águas”, sem transformar a poesia em descrição técnica.
- source_word: עֲלִיּוֹתָיו
  choice: seus aposentos superiores
  rationale: O substantivo designa cômodos ou aposentos no andar superior. A expressão é clara, atual e mantém a ideia de uma habitação elevada.
- source_word: הַשָּׂם
  choice: que faz
  rationale: No enunciado em que as nuvens se tornam o carro divino, “faz das nuvens” expressa com naturalidade o sentido de שׂים, “pôr, estabelecer, fazer”.
- source_word: עָבִים
  choice: as nuvens
  rationale: A palavra pode sugerir nuvens densas, mas “as nuvens” comunica adequadamente a imagem poética sem acrescentar uma qualificação não indispensável.
- source_word: רְכוּבוֹ
  choice: o seu carro
  rationale: O termo se refere àquilo em que alguém cavalga ou viaja, especialmente um carro. “Seu carro” preserva a imagem teofânica de modo claro.
- source_word: הַמְהַלֵּךְ
  choice: que anda
  rationale: O particípio de הלך significa literalmente andar ou mover-se. “Anda” conserva a personificação vívida do hebraico.
- source_word: כַּנְפֵי
  choice: as asas
  rationale: Embora כנף também possa significar borda ou extremidade, “asas” é o sentido mais expressivo e adequado à velocidade do vento nesta poesia.
- source_word: רוּחַ
  choice: vento
  rationale: רוּחַ pode significar vento, sopro ou espírito. A sequência de águas, nuvens, carro e asas favorece aqui o fenômeno meteorológico “vento”, sem eliminar a alternativa lexical, registrada em nota.
theological_decisions:
- issue: Sentido de רוּחַ no último verso
  choice: vento
  alternative: espírito
  rationale: As imagens de nuvens e deslocamento pelos céus tornam “vento” a leitura contextual mais provável. A nota preserva a amplitude semântica do hebraico e evita impor ao verso uma referência doutrinária específica ao Espírito.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético em três linhas. “Aposentos superiores” evita tanto o arcaísmo excessivo quanto uma formulação excessivamente coloquial; “assenta ... as vigas” mantém a metáfora arquitetônica do hebraico.
