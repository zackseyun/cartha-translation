  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: pt
  text: Os montes altos são para as cabras-monteses[a]; as rochas são refúgio para os híraces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “íbexes”.
    reason: lexical_alternative
  - marker: b
    text: Também chamados “damões”; são pequenos mamíferos que vivem entre rochas.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: os montes altos
  rationale: A expressão traduz diretamente o substantivo e o adjetivo hebraicos, preservando a descrição do terreno elevado e mantendo uma formulação poética natural em português.
- source_word: לַיְּעֵלִים
  choice: para as cabras-monteses
  rationale: יָעֵל designa cabras selvagens das montanhas, geralmente identificadas como íbexes. “Cabras-monteses” é claro e acessível, enquanto a nota registra o termo zoológico mais específico.
- source_word: סְלָעִים
  choice: as rochas
  rationale: סְלָעִים refere-se a formações rochosas. “Rochas” preserva a amplitude do hebraico e forma um paralelo natural com “montes altos”.
- source_word: מַחְסֶה
  choice: refúgio
  rationale: O substantivo indica um lugar de proteção ou abrigo. “Refúgio” conserva tanto o sentido físico quanto a dignidade poética do salmo.
- source_word: לַשְׁפַנִּים
  choice: para os hiraces
  rationale: שָׁפָן designa o pequeno mamífero que vive entre rochas, identificado como hírax ou damão. “Hiraces” é zoologicamente preciso e evita associações equivocadas com texugos ou coelhos.
