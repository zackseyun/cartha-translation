  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: pt
  text: O homem sai para o seu trabalho e para a sua labuta até o entardecer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ser humano sai para o seu trabalho”. O hebraico אָדָם é um singular genérico que aqui representa a humanidade.'
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos traduzidos por “trabalho” e “labuta” têm sentidos parcialmente sobrepostos; ambos podem referir-se ao trabalho ou à atividade de uma pessoa.
    reason: lexical_nuance
lexical_decisions:
- source_word: יֵצֵא
  choice: sai
  rationale: 'O imperfeito qal de יצא descreve aqui uma ação habitual dentro da sequência poética: depois da atividade noturna dos animais, o ser humano sai durante o dia. “Sai” preserva o sentido de movimento e soa natural em português.'
- source_word: אָדָם
  choice: O homem
  rationale: אָדָם é um singular genérico que pode designar a humanidade ou um indivíduo. Neste contexto, representa os seres humanos em contraste com os animais dos versículos anteriores. “O homem” preserva a forma singular representativa do hebraico; a leitura explicitamente coletiva é indicada em nota.
- source_word: לְפָעֳלוֹ
  choice: para o seu trabalho
  rationale: פֹּעַל denota obra, trabalho ou atividade. A preposição לְ após “sair” expressa finalidade ou destino; “para o seu trabalho” é claro e idiomático.
- source_word: וְלַעֲבֹדָתוֹ
  choice: e para a sua labuta
  rationale: עֲבֹדָה pode significar trabalho, serviço ou labor. “Labuta” distingue o termo de פֹּעַל sem eliminar a sobreposição semântica e se ajusta ao contexto do trabalho cotidiano.
- source_word: עֲדֵי עָרֶב
  choice: até o entardecer
  rationale: עֲדֵי é uma forma poética de “até”, e עָרֶב designa a tarde ou o começo da noite. “Até o entardecer” expressa com clareza o limite temporal da jornada diária.
theological_decisions:
- issue: Sentido genérico de אָדָם numa declaração sobre a humanidade
  choice: O homem
  alternative: O ser humano; a humanidade
  rationale: O versículo descreve o padrão humano comum na criação, contrapondo o trabalho diurno das pessoas à atividade noturna dos animais. A tradução principal conserva o singular masculino representativo do hebraico, enquanto a nota esclarece que a referência é genérica, não exclusivamente masculina.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “para o seu/para a sua” conserva o paralelismo das duas expressões hebraicas. “Entardecer” evita variantes regionais de regência em “até à tarde” e mantém o tom poético.
