  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: pt
  text: Ele fundou a terra sobre seus alicerces[a]; ela jamais será abalada, para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabeleceu a terra sobre suas bases”; o hebraico emprega uma imagem arquitetônica para expressar a estabilidade do mundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: fundou
  rationale: O verbo descreve o ato de fundar ou estabelecer mediante a colocação de alicerces; “fundou” preserva a imagem arquitetônica e é natural em português.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No contexto deste hino da criação, refere-se ao mundo terrestre, e não a uma região específica.
- source_word: עַל
  choice: sobre
  rationale: Expressa aqui colocação ou sustentação e mantém de modo direto a relação espacial da imagem.
- source_word: מְכוֹנֶיהָ
  choice: seus alicerces
  rationale: O substantivo pode indicar bases, lugares firmes ou fundamentos; “alicerces” comunica com clareza a metáfora arquitetônica.
- source_word: בַּל תִּמּוֹט
  choice: jamais será abalada
  rationale: A construção nega que a terra venha a oscilar ou perder sua estabilidade; “será abalada” preserva a voz passiva e “jamais” reforça a negação em harmonia com a expressão temporal seguinte.
- source_word: עוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão duplicada intensifica a duração; esta formulação portuguesa preserva sua força enfática e poética.
theological_decisions:
- issue: Linguagem cosmológica na imagem poética da criação
  choice: Manter a imagem arquitetônica da terra fundada sobre alicerces e permanentemente estável.
  alternative: Ele estabeleceu firmemente a terra, para que nunca se mova.
  rationale: O verso emprega linguagem poética e fenomenológica. A tradução não a converte em descrição científica moderna nem a harmoniza com um sistema cosmológico ou doutrinário posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Alicerces” conserva a concretude poética; “para todo o sempre” mantém o tom elevado sem soar arcaico.
