  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: pt
  text: Tu trazes as trevas, e faz-se noite; nela se movem todos os animais da floresta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vagueiam” ou “rondam”; o verbo hebraico descreve o movimento dos animais durante a noite, sem necessariamente indicar caça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: Tu trazes
  rationale: O verbo significa pôr ou colocar. No contexto do anoitecer, “trazes as trevas” expressa de modo natural a ação direta atribuída a Deus, sem reduzi-la a mera permissão.
- source_word: חֹשֶׁךְ
  choice: as trevas
  rationale: Equivalente português tradicional e ainda corrente para a escuridão noturna, adequado ao registro poético.
- source_word: וִיהִי לָיְלָה
  choice: e faz-se noite
  rationale: 'Reproduz de modo conciso e idiomático o estado resultante: ao serem postas as trevas, chega a noite.'
- source_word: בּוֹ
  choice: nela
  rationale: O pronome retoma naturalmente “noite” em português.
- source_word: תִרְמֹשׂ
  choice: se movem
  rationale: O verbo descreve o deslocamento de criaturas, podendo sugerir rastejar, vaguear ou rondar. A formulação abrangente evita atribuir comportamento predatório a todos os animais.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: todos os animais da floresta
  rationale: Expressão natural e inclusiva para a totalidade dos animais silvestres; “animais” comunica melhor ao leitor moderno do que “feras”, sem intensificar o hebraico.
theological_decisions:
- issue: A ação divina na ordenação da criação
  choice: Deus traz ativamente as trevas, e a noite resulta disso.
  alternative: Deus apenas permite que as trevas e a noite ocorram.
  rationale: A segunda pessoa do singular atribui diretamente a ação a Deus. A tradução mantém essa agência sem acrescentar uma teoria filosófica de causalidade.
translation_notes:
  register: Português moderno, poético e acessível, com tratamento de Deus por “tu”, coerente com a segunda pessoa singular hebraica. A construção “faz-se noite” preserva dignidade literária sem soar arcaica. O marcador [a] foi colocado após a oração a que se refere.
