  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: pt
  text: Ali navegam os navios; ali está o Leviatã, que formaste para brincar no mar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Leviatã, que formaste para brincares com ele”. Alguns entendem a frase final como uma referência a Deus brincando com o Leviatã, em vez de o Leviatã brincar no mar.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: Retoma de modo natural o mar mencionado no contexto anterior.
- source_word: אֳנִיּוֹת יְהַלֵּכוּן
  choice: navegam os navios
  rationale: O verbo הלך descreve o movimento habitual das embarcações; em português, “navegam” expressa isso com clareza e naturalidade.
- source_word: לִוְיָתָן
  choice: o Leviatã
  rationale: A transliteração preserva a designação poética e suas conexões com outras passagens bíblicas.
- source_word: זֶה יָצַרְתָּ
  choice: que formaste
  rationale: A construção relativa é natural em português, e “formaste” preserva a ideia concreta de moldar presente em יצר.
- source_word: לְשַׂחֶק
  choice: para brincar
  rationale: Expressa de maneira clara e atual a atividade lúdica indicada pelo infinitivo hebraico.
- source_word: בּוֹ
  choice: no mar
  rationale: Explicita o antecedente contextual mais provável do pronome masculino singular, evitando a ambiguidade artificial que “nele” teria em português.
theological_decisions:
- issue: Referente de בּוֹ após לְשַׂחֶק
  choice: O Leviatã foi formado para brincar no mar.
  alternative: O Leviatã foi formado para Deus brincar com ele.
  rationale: 'O mar do contexto imediato é o referente locativo mais provável: ali navegam os navios e ali brinca o Leviatã. Contudo, a sintaxe hebraica também permite entender Deus como aquele que brinca com o Leviatã; essa alternativa genuína é preservada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Navegam” evita a expressão menos idiomática “movem-se de um lado para outro”; “no mar” torna explícito o referente contextual sem eliminar a leitura alternativa, registrada na nota.
