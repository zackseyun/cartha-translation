  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: pt
  text: Eis o mar, grande e vasto[a]; nele fervilham criaturas sem número[b], seres vivos pequenos e grandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “largo de mãos”, expressão que indica grande largura ou vasta extensão.
    reason: cultural_note
  - marker: b
    text: 'Ou: “nele se movem seres sem número”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Eis o mar
  rationale: A construção deítica apresenta o mar à contemplação. “Eis o mar” conserva essa força exclamativa de modo natural e poético em português.
- source_word: גָּדוֹל וּרְחַב יָדַיִם
  choice: grande e vasto
  rationale: “Grande” traduz גָּדוֹל, enquanto “vasto” comunica naturalmente a grande extensão expressa pelo idioma hebraico רְחַב יָדַיִם, cuja imagem literal é esclarecida em nota.
- source_word: שָׁם
  choice: nele
  rationale: O advérbio locativo remete ao mar recém-mencionado; “nele” torna essa referência explícita e fluente em português.
- source_word: רֶמֶשׂ
  choice: fervilham criaturas
  rationale: O substantivo coletivo descreve seres que se movem ou enxameiam. No contexto marinho, “fervilham criaturas” transmite tanto o movimento quanto a abundância, sem sugerir apenas animais terrestres rastejantes.
- source_word: וְאֵין מִסְפָּר
  choice: sem número
  rationale: Mantém de forma concisa e poética o idioma hebraico que indica uma quantidade incontável.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: seres vivos pequenos e grandes
  rationale: Preserva a abrangência de חַיּוֹת e o contraste inclusivo entre criaturas de diferentes tamanhos.
