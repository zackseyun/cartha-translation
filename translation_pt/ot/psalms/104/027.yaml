  text: כֻּ֭לָּ/ם אֵלֶ֣י/ךָ יְשַׂבֵּר֑וּ/ן לָ/תֵ֖ת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: pt
  text: Todos eles esperam de ti[a] que lhes dês o seu alimento no tempo certo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltam-se para ti com expectativa” ou “põem a esperança em ti”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no devido tempo” ou “na época apropriada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva o sentido abrangente e distributivo, retomando todas as criaturas mencionadas no contexto.
- source_word: אֵלֶיךָ
  choice: em ti
  rationale: Com יְשַׂבֵּרוּן, expressa de modo natural em português a pessoa em quem se deposita a expectativa; a nota registra alternativas mais direcionais.
- source_word: יְשַׂבֵּרוּן
  choice: esperam
  rationale: O Piel de שׂבר indica espera confiante ou expectativa. 'Esperam' é conciso, corrente e permite que a oração seguinte esclareça o que é aguardado.
- source_word: לָתֵת
  choice: para que lhes dês
  rationale: Representa o infinitivo como conteúdo da espera em construção portuguesa natural, explicitando o objeto indireto já pressuposto pelo sufixo em 'seu alimento'.
- source_word: אָכְלָם
  choice: o alimento
  rationale: É um termo geral para comida ou sustento e se aplica ao conjunto das criaturas, não apenas a predadores.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: Comunica o tempo próprio ou adequado de forma idiomática, sem acrescentar uma ideia não presente no hebraico.
theological_decisions:
- issue: Providência divina na criação
  choice: A dependência de todas as criaturas de Deus para receber alimento é expressa sem ampliação doutrinária.
  alternative: Traduzir com linguagem mais interpretativa de confiança, adoração ou provisão soberana.
  rationale: O hebraico retrata expectativa e dependência, mas não exige que se explicitem conceitos teológicos além da afirmação do próprio verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Todos eles' mantém a retomada enfática das criaturas; 'no tempo certo' soa natural e conserva a noção de ocasião apropriada.
