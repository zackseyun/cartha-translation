base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/012.yaml
  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
translation:
  language: pt
  text: Acima delas habitam as aves do céu; de entre os ramos[a], fazem ouvir a sua voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a folhagem” ou “os galhos frondosos”. O substantivo hebraico é raro e pode designar, de modo amplo, ramos com folhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Acima delas
  rationale: A preposição עַל com o sufixo retoma as correntes ou fontes do versículo anterior e indica posição acima delas. A formulação preserva a imagem poética sem reduzi-la a mera proximidade.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: עוֹף é coletivo para criaturas voadoras, aqui naturalmente entendido como aves. “Do céu” conserva a construção hebraica e soa poético e corrente em português.
- source_word: יִשְׁכּוֹן
  choice: habitam
  rationale: O verbo שׁכן expressa habitar, residir ou estabelecer-se. “Habitam” mantém esse sentido sem acrescentar a ideia específica de fazer ninhos.
- source_word: מִבֵּין
  choice: por entre
  rationale: A expressão indica que a voz procede do meio da vegetação. “Por entre” é idiomático em português e preserva a noção espacial.
- source_word: עֳפָאיִם
  choice: os ramos
  rationale: O substantivo raro parece designar ramos, galhos frondosos ou folhagem. “Ramos” é claro e adequado ao contexto, enquanto a incerteza lexical é registrada em nota.
- source_word: יִתְּנוּ קוֹל
  choice: fazem ouvir sua voz
  rationale: O hebraico diz literalmente “dão voz”. A formulação portuguesa conserva a referência à voz das aves sem interpretar explicitamente o som como canto.
