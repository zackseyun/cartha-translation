  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: pt
  text: Como são numerosas as tuas obras, ó Yahweh! Fizeste todas elas com sabedoria; a terra está cheia das tuas criaturas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das tuas posses” ou “daquilo que te pertence”. O termo hebraico pode indicar o que alguém possui ou adquire; neste contexto, pode se referir de modo amplo às coisas que Deus fez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Como são numerosas
  rationale: A construção exclamativa expressa a grande quantidade e variedade das obras. A formulação é natural em português e preserva a ênfase na multiplicidade.
- source_word: מַעֲשֶׂיךָ
  choice: as tuas obras
  rationale: Tradução direta que abrange, no contexto do salmo, tudo o que Deus fez na criação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֻּלָּם
  choice: todas elas
  rationale: Retoma explicitamente 'obras' e conserva a força totalizante do hebraico.
- source_word: בְּחָכְמָה
  choice: com sabedoria
  rationale: Preserva o substantivo e apresenta a sabedoria como o modo pelo qual Deus realizou suas obras.
- source_word: עָשִׂיתָ
  choice: Fizeste
  rationale: O pretérito perfeito expressa de modo natural em português a ação criadora realizada, sem perder sua relevância presente.
- source_word: מָלְאָה הָאָרֶץ
  choice: a terra está cheia
  rationale: O perfeito hebraico descreve aqui o estado resultante e presente da terra.
- source_word: קִנְיָנֶךָ
  choice: das tuas criaturas
  rationale: No contexto da criação, indica as coisas que Deus produziu e que lhe pertencem. 'Criaturas' comunica esse referente com clareza, enquanto a nota preserva o sentido lexical mais amplo de posse ou aquisição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração preserva essa característica sem substituí-lo por um título.
- issue: Sentido de קִנְיָנֶךָ
  choice: tuas criaturas
  alternative: tuas posses; aquilo que te pertence
  rationale: O contexto imediato trata das obras criadas por Deus, favorecendo 'criaturas', mas o termo hebraico também admite a ideia mais ampla de algo adquirido ou possuído; essa amplitude é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para uma exclamação natural em português, preservando o paralelismo poético e a ambiguidade lexical relevante em nota.
