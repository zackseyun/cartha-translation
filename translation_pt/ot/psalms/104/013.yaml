  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: pt
  text: Ele rega os montes de seus aposentos elevados; a terra se farta com o fruto[a] das tuas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do fruto das tuas obras”. A preposição hebraica pode indicar tanto a fonte quanto o meio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Ele rega
  rationale: O particípio hifil de שׁקה tem valor verbal e sentido causativo. O sujeito divino, implícito no hebraico e claro no contexto, é expresso em português para dar naturalidade.
- source_word: הָרִים
  choice: os montes
  rationale: É o sentido comum do termo; “montes” é natural e corrente em português no contexto poético.
- source_word: מֵעֲלִיּוֹתָיו
  choice: desde os seus aposentos elevados
  rationale: Preserva a ideia de aposentos na parte alta e a imagem arquitetônica cósmica do salmo. “Desde” indica o ponto de origem da água.
- source_word: מִפְּרִי
  choice: com o fruto
  rationale: A preposição מִן pode indicar fonte ou meio. “Com o fruto” produz uma frase natural em português, enquanto a nota registra a alternativa “do fruto”.
- source_word: מַעֲשֶׂיךָ
  choice: das tuas obras
  rationale: Mantém o plural amplo do hebraico e pode abranger toda a atividade criadora de Deus.
- source_word: תִּשְׂבַּע
  choice: se farta
  rationale: Expressa a ideia de receber até ficar plenamente abastecida ou saciada e concorda naturalmente com “a terra”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto de louvor à criação favorece o sentido abrangente de “terra”, não o sentido local de “território”.
theological_decisions:
- issue: Sujeito divino implícito
  choice: Ele rega os montes
  alternative: Regando os montes
  rationale: Embora o particípio hebraico não traga o sujeito expresso neste versículo, o contexto imediato o identifica como Deus. Explicitar “Ele” melhora a leitura sem acrescentar uma afirmação teológica nova.
- issue: Alternância entre terceira e segunda pessoa
  choice: seus aposentos elevados / tuas obras
  alternative: teus aposentos elevados / tuas obras
  rationale: A tradução conserva a mudança de terceira para segunda pessoa presente no texto hebraico, em vez de uniformizá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a imagem poética dos aposentos elevados, a plenitude expressa por “se farta” e a mudança de pessoa gramatical do original.
