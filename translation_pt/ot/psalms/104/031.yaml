source:
  edition: WLC
  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: pt
  text: Que a glória de Yahweh permaneça para sempre[a]; que Yahweh se alegre em suas obras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a glória de Yahweh seja para sempre”. O hebraico diz literalmente “seja”, expressão que também pode transmitir a ideia de permanência.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “com suas obras” ou “por causa de suas obras”. A preposição hebraica permite mais de uma nuance relacional neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que ... permaneça
  rationale: O jussivo de היה expressa desejo ou oração. Com לְעוֹלָם, “permaneça para sempre” comunica em português corrente a continuidade desejada, sem reduzir a construção a uma simples afirmação.
- source_word: כְבוֹד
  choice: glória
  rationale: “Glória” é a tradução consagrada e adequada ao contexto doxológico, abrangendo honra, esplendor e majestade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração indefinida e permanente em linguagem portuguesa natural e atual.
- source_word: יִשְׂמַח
  choice: que ... se alegre
  rationale: 'O valor volitivo, paralelo ao da primeira oração, é preservado como desejo: “que ... se alegre”.'
- source_word: בְּמַעֲשָׂיו
  choice: em suas obras
  rationale: Mantém de perto a preposição ב e, no contexto do salmo, refere-se às obras criadas por Yahweh. A expressão também pode ser entendida relacionalmente como “com suas obras” ou “por causa de suas obras”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, enquanto “SENHOR” representa a substituição tradicional por um título.
- issue: Sentido das formas volitivas nas duas orações
  choice: 'Desejos dirigidos a respeito de Yahweh: “Que ... permaneça”; “que ... se alegre”'
  alternative: 'Afirmações: “A glória ... permanece”; “Yahweh se alegra”'
  rationale: As formas verbais e o paralelismo favorecem a leitura como desejo ou oração, sem transformá-las em declarações indicativas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Permaneça para sempre” soa mais natural que o literal “seja para sempre”, registrado em nota; “em suas obras” conserva a formulação hebraica sem excluir outras nuances possíveis.
