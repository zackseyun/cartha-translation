  text: יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: pt
  text: 'As árvores de Yahweh se saciam[a],

    os cedros do Líbano que ele plantou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são plenamente supridas” ou “têm fartura”. O verbo hebraico indica que estão plenamente supridas ou saciadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: ficam saciadas
  rationale: O Qal de שבע expressa estar plenamente suprido ou saciado. “Ficam saciadas” preserva a imagem poética e a abundância da provisão divina sem acrescentar explicitamente “água”, embora o contexto trate de irrigação.
- source_word: עֲצֵי יְהוָה
  choice: as árvores de Yahweh
  rationale: Mantém a relação construta do hebraico e conserva o nome divino como nome próprio, sem substituir por um título.
- source_word: אַרְזֵי לְבָנוֹן
  choice: os cedros do Líbano
  rationale: Tradução direta da construção nominal; o segundo verso identifica em aposição as árvores mencionadas no primeiro.
- source_word: אֲשֶׁר נָטָע
  choice: que ele plantou
  rationale: A oração relativa é reproduzida naturalmente; o pronome “ele”, exigido em português para maior clareza, retoma Yahweh como sujeito implícito de נָטָע.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome, em vez de o substituir por um título.
- issue: Possível personificação em יִשְׂבְּעוּ
  choice: ficam saciadas
  alternative: ficam plenamente abastecidas
  rationale: A escolha conserva a personificação e a amplitude semântica do verbo hebraico, sem explicitar um objeto não mencionado no verso.
translation_notes:
  register: Português atual, claro e digno, com estrutura poética em dois versos. “Saciadas” conserva a imagem hebraica, enquanto a nota esclarece seu sentido no contexto da provisão abundante de Deus.
