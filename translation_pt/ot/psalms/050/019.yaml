  text: You let your mouth loose for evil[b][a], and your tongue frames deceit.
translation:
  language: pt
  text: Você dá livre curso à sua boca para o mal, e sua língua se prende ao engano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sua língua se associa ao engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיךָ
  choice: a boca
  rationale: Preserva a imagem corporal hebraica e o paralelismo poético com “sua língua”; o possessivo é expresso naturalmente por “Você... a boca”.
- source_word: שָׁלַחְתָּ
  choice: solta
  rationale: No contexto, o verbo “enviar/soltar” descreve dar livre curso à fala. “Solta” mantém a vivacidade da imagem sem explicá-la em excesso.
- source_word: בְרָעָה
  choice: para o mal
  rationale: A preposição pode indicar direção ou esfera; “para o mal” conserva o sentido moral e a concisão do hebraico.
- source_word: וּלְשׁוֹנְךָ
  choice: e sua língua
  rationale: Tradução direta que preserva o paralelismo entre boca e língua.
- source_word: תַּצְמִיד
  choice: se prende a
  rationale: A forma verbal deriva da ideia de juntar, ligar ou prender. A formulação conserva essa imagem e permite que a língua seja entendida como ligada ao engano, sem substituí-la por uma interpretação mais livre.
- source_word: מִרְמָה
  choice: engano
  rationale: Equivalente amplo e natural em contexto de fala enganosa, sem restringir o termo a fraude ou traição.
