lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Você se senta
  rationale: Preserva a imagem concreta do hebraico e sua força retórica, em vez de reduzi-la a uma expressão adverbial.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: fala contra seu irmão
  rationale: Neste contexto acusatório, a preposição ב com דבר tem sentido adversativo; “contra” explicita naturalmente a fala hostil.
- source_word: בְּבֶן אִמְּךָ
  choice: o filho de sua própria mãe
  rationale: Mantém a formulação enfática sobre o parentesco próximo e o paralelismo familiar do hebraico.
- source_word: תִּתֶּן דֹּפִי
  choice: difama
  rationale: A combinação idiomática significa lançar censura, imputar culpa ou proferir fala difamatória; “difama” comunica isso de modo direto e natural em português.
