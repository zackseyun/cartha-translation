  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: pt
  text: Conheço todas as aves dos montes, e as criaturas do campo estão comigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seres que se movem no campo” ou “os animais silvestres do campo”; o sentido da palavra hebraica é incerto. A expressão “estão comigo” também pode implicar “são minhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Conheço
  rationale: 'O perfeito qal de ידע expressa aqui um estado permanente: o conhecimento abrangente de Deus. O presente é natural em português.'
- source_word: כָּל עוֹף
  choice: todas as aves
  rationale: עוֹף é um coletivo que pode abranger seres voadores; no contexto, “aves” é a forma mais natural, e “todas” comunica a totalidade.
- source_word: הָרִים
  choice: dos montes
  rationale: הָרִים pode significar montes ou montanhas. “Montes” é corrente, poético e adequado ao cenário natural.
- source_word: וְזִיז
  choice: e as criaturas
  rationale: זִיז é um termo difícil, provavelmente referente ao que se move no campo ou aos animais silvestres. “Criaturas” preserva a amplitude sem especificar além da evidência.
- source_word: שָׂדַי
  choice: do campo
  rationale: O singular hebraico possui sentido coletivo e é reproduzido naturalmente por “do campo”.
- source_word: עִמָּדִי
  choice: estão comigo
  rationale: Reproduz de perto a locução hebraica “comigo”, preservando sua possível implicação de posse ou disponibilidade sem torná-la explícita no texto.
theological_decisions:
- issue: Implicação de domínio ou posse divina em עִמָּדִי
  choice: estão comigo
  alternative: são minhas
  rationale: Embora o contexto possa implicar que os animais pertencem a Deus, o hebraico diz literalmente “comigo”. A tradução conserva essa formulação e deixa a implicação teológica ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem poética e o paralelismo hebraico foram preservados sem rigidez.
