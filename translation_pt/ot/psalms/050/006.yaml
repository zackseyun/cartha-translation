lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: proclamam
  rationale: O hifil de נגד expressa tornar algo publicamente conhecido; “proclamam” preserva o tom poético e solene.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Mantém o plural poético hebraico em uma formulação consagrada e natural em português.
- source_word: צִדְקוֹ
  choice: a sua justiça
  rationale: צדק abrange retidão e justiça; no contexto do juízo divino, “justiça” é natural, sem excluir a ideia mais ampla de retidão, registrada na nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proclamação e mantém uma ligação causal concisa e digna.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, o predicado e o pronome mostram claramente o sentido singular.
- source_word: שֹׁפֵט
  choice: é juiz
  rationale: O particípio funciona como predicativo nominal; “é juiz” preserva essa construção sem acrescentar um artigo definido ausente no hebraico.
- source_word: הוּא
  choice: o próprio
  rationale: Torna explícita, em português idiomático, a ênfase do pronome independente hebraico.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do marcador litúrgico é incerto, ele é transliterado em vez de interpretado.
theological_decisions:
- issue: Sentido de צדק em relação ao juízo divino
  choice: a sua justiça
  alternative: a sua retidão
  rationale: “Justiça” se ajusta diretamente ao contexto judicial, enquanto “retidão” preserva a dimensão moral mais ampla do termo; a alternativa genuína é mantida em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Proclamam” conserva o tom público e poético; “Selá” mantém o marcador litúrgico sem lhe atribuir significado incerto.
