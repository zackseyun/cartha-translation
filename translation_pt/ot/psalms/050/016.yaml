  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: pt
  text: 'Mas ao perverso Deus diz: “Que direito você tem de recitar os meus estatutos[a] e de tomar a minha aliança nos lábios[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Que é que você tem a ver com recitar os meus estatutos?”'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e tomar a minha aliança sobre a sua boca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Mas ao perverso
  rationale: A conjunção e a preposição introduzem contraste com o contexto anterior; רָשָׁע designa aqui uma categoria moral, por isso “perverso” comunica melhor que a leitura meramente forense “culpado”.
- source_word: אָמַר אֱלֹהִים
  choice: Deus diz
  rationale: Embora אָמַר seja formalmente perfeito, a fórmula de introdução do discurso direto na poesia pode ser vertida pelo presente para preservar a vivacidade do pronunciamento.
- source_word: מַה לְּךָ
  choice: Que direito você tem
  rationale: O idioma constitui uma contestação da legitimidade ou propriedade da conduta, não um simples pedido de informação. A formulação torna clara a repreensão sem ampliar seu alcance.
- source_word: לְסַפֵּר
  choice: de recitar
  rationale: O verbo סָפַר, neste contexto, indica enunciar ou repetir verbalmente as prescrições divinas; “recitar” preserva esse sentido e o registro solene.
- source_word: חֻקָּי
  choice: os meus estatutos
  rationale: חֹק designa prescrições ou decretos estabelecidos; “estatutos” mantém a nuance jurídica e pactual.
- source_word: וַתִּשָּׂא
  choice: e trazer
  rationale: נָשָׂא significa literalmente levantar ou carregar. Com “aliança” e “sobre a boca”, descreve tomá-la ou trazê-la à fala; “trazer” conserva parte da imagem sem soar artificial.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: “Aliança” é a correspondência portuguesa consolidada para בְּרִית e preserva seu peso teológico e canônico.
- source_word: עֲלֵי פִיךָ
  choice: nos lábios
  rationale: O hebraico diz literalmente “sobre a tua boca”; “nos lábios” é a expressão portuguesa natural para algo proferido, mantendo a imagem corporal.
theological_decisions:
- issue: Natureza da repreensão ao perverso
  choice: A pergunta contesta a legitimidade moral do perverso para recitar os estatutos e invocar a aliança de Deus.
  alternative: Entender a frase como proibição absoluta de qualquer menção verbal à aliança por uma pessoa perversa.
  rationale: O idioma מַה לְּךָ questiona a relação, pretensão ou direito da pessoa diante de sua hipocrisia; não exige interpretar o verso como proibição irrestrita de toda fala sobre Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por naturalidade contemporânea, mantendo vocabulário pactual e jurídico como “aliança” e “estatutos”. Os marcadores seguem a ordem em que aparecem no texto.
