  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: pt
  text: Salmo de Asafe. O Poderoso[a], Deus, Yahweh, falou e convocou a terra, desde o nascer do sol até o seu poente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus, Deus, Yahweh”. Alguns entendem de outra forma os títulos divinos iniciais, inclusive: “O Deus dos deuses, Yahweh”.'
    reason: Registra interpretações possíveis da sintaxe da sequência אֵל אֱלֹהִים יְהוָה.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo consagrado e exato para o gênero indicado no cabeçalho.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A preposição לְ pode indicar autoria, associação ou pertencimento a uma coleção; “de Asafe” é natural e mantém aberta a relação exata.
- source_word: אֵל
  choice: O Poderoso
  rationale: Distingue אֵל de אֱלֹהִים e preserva a força da sequência solene de designações divinas.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O nome divino יְהוָה e os verbos no singular mostram que o referente é o Deus de Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome pessoal divino em vez de substituí-lo por um título.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta a fala como ação realizada; o pretérito perfeito é solene e natural em português.
- source_word: וַיִּקְרָא
  choice: e convocou
  rationale: O verbo avança a ação e, neste contexto, sugere chamar a terra a comparecer, sem explicitar além do texto a natureza da assembleia.
- source_word: אָרֶץ
  choice: a terra
  rationale: A extensão do nascer ao pôr do sol favorece o sentido universal, não apenas uma região.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: desde o nascer do sol
  rationale: Preserva a imagem poética hebraica e soa natural em português.
- source_word: עַד מְבֹאוֹ
  choice: até o seu poente
  rationale: O sufixo remete ao sol; “poente” preserva de forma concisa a imagem complementar ao nascer do sol.
theological_decisions:
- issue: Interpretação da tríplice designação divina אֵל אֱלֹהִים יְהוָה
  choice: O Poderoso, Deus, Yahweh
  alternative: “Deus, Deus, Yahweh” ou “O Deus dos deuses, Yahweh”
  rationale: O hebraico dispõe três designações em sequência. Traduzir אֵל de modo distinto preserva a intensidade retórica e sua força lexical, enquanto a nota registra outras análises sintáticas possíveis sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético, a abrangência universal e a ambiguidade do cabeçalho “de Asafe”.
