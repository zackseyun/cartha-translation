  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: pt
  text: Pois meu é todo animal da floresta, os animais em mil montes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os animais em mil colinas” ou “o gado em mil montes”. O hebraico para “animais” pode designar animais grandes ou gado, e o termo para “montes” também pode ser vertido como “montanhas” ou “colinas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a declaração anterior e funciona naturalmente como conectivo explicativo em português.
- source_word: לִי
  choice: meu é
  rationale: Expressa posse divina e preserva, com uma ordem poética natural em português, a ênfase inicial do predicado possessivo.
- source_word: כָל
  choice: todo
  rationale: Com o substantivo singular coletivo, comunica adequadamente a totalidade distributiva.
- source_word: חַיְתוֹ יָעַר
  choice: animal da floresta
  rationale: Designa os animais silvestres pertencentes ao ambiente florestal; no contexto, a referência à floresta torna desnecessário explicitar 'selvagem'.
- source_word: בְּהֵמוֹת
  choice: os animais
  rationale: O termo pode abranger animais grandes e não exige aqui o sentido zoologicamente restrito de bovinos; a tradução mantém essa amplitude lexical.
- source_word: בְּהַרְרֵי
  choice: nos montes
  rationale: A preposição indica localização, e 'montes' preserva a imagem topográfica sem impor uma distinção rígida entre colinas e montanhas.
- source_word: אָלֶף
  choice: aos milhares
  rationale: No hebraico, o numeral singular dentro da construção pode ser entendido como 'mil montes'; a formulação portuguesa expressa a abundância poética, embora a alternativa literal seja registrada em nota.
theological_decisions:
- issue: Alcance da imagem da posse divina
  choice: A linguagem apresenta a posse abrangente de Deus sobre os animais mediante imagens poéticas de totalidade e abundância.
  alternative: Entender a expressão como referência estritamente literal aos animais situados em exatamente mil montes.
  rationale: O contexto poético afirma a suficiência e soberania divinas; não convém restringir a declaração a um inventário numérico, mas a imagem hebraica deve continuar visível por meio da nota.
- issue: Relação entre os dois membros do verso
  choice: 'Manter justaposição: ''todo animal da floresta, os animais...'''
  alternative: Acrescentar a conjunção 'e' para tornar explícita uma coordenação.
  rationale: O hebraico não traz conjunção. A justaposição conserva a estrutura poética e permite tanto perceber dois grupos complementares quanto uma relação explicativa, sem resolver silenciosamente a sintaxe.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve inversão poética em 'meu é'. A justaposição reproduz a ausência de conjunção no hebraico. A nota preserva as alternativas lexicais e a leitura numérica mais literal.
