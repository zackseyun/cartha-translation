  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: pt
  text: Quem oferece um sacrifício de ação de graças[a] me honra; e a quem põe em ordem seu caminho[b] mostrarei a salvação de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta de gratidão”. O termo hebraico se refere à gratidão expressa em forma sacrificial.
    reason: lexical_alternative
  - marker: b
    text: Ou “prepara um caminho”. A expressão hebraica é compacta e pode se referir a pôr em ordem a própria conduta.
    reason: alternative_reading
  - marker: c
    text: Ou “o livramento de Deus” ou “a vitória de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Quem oferece
  rationale: O particípio qal é substantivado e descreve genericamente a pessoa que sacrifica; “quem oferece” soa natural em português e mantém o contexto sacrificial.
- source_word: תּוֹדָה
  choice: um sacrifício de gratidão
  rationale: No contexto cultual, o termo indica gratidão expressa por meio de uma oferta sacrificial, não apenas agradecimento verbal.
- source_word: יְכַבְּדָנְנִי
  choice: me honra
  rationale: O piel de כבד significa honrar ou glorificar; “me honra” é direto, atual e adequado ao contraste entre culto e conduta no salmo.
- source_word: וְשָׂם דֶּרֶךְ
  choice: e a quem põe em ordem o seu caminho
  rationale: A expressão hebraica é compacta. Esta tradução preserva a metáfora do caminho e comunica a provável ideia de ordenar corretamente a própria conduta, sem ocultar a alternativa em nota.
- source_word: אַרְאֶנּוּ
  choice: mostrarei
  rationale: O hifil de ראה significa “fazer ver” ou “mostrar”; o sufixo masculino singular tem como referente a pessoa que põe seu caminho em ordem.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: a salvação de Deus
  rationale: יֵשַׁע pode designar salvação, livramento ou vitória. “Salvação” é apropriado neste contexto, e a formulação conserva a referência a Deus na terceira pessoa presente no hebraico.
theological_decisions:
- issue: Sentido de וְשָׂם דֶּרֶךְ
  choice: Promessa dirigida à pessoa que põe em ordem o próprio caminho, isto é, sua conduta.
  alternative: “a quem prepara o caminho” ou, mais literalmente, “a quem estabelece um caminho”.
  rationale: A leitura ética se ajusta ao contexto do salmo, que associa culto aceitável e vida correta. A nota preserva a concisão e a possível variação de sentido do hebraico.
- issue: Referência divina em בְּיֵשַׁע אֱלֹהִים
  choice: Manter “a salvação de Deus”, embora o próprio Deus fale em primeira pessoa.
  alternative: “minha salvação” ou “a salvação que vem de Deus”.
  rationale: A terceira pessoa é genuína no texto hebraico e pode constituir autorreferência divina. Mantê-la evita normalizar ou explicar silenciosamente a tensão gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém o paralelismo entre quem oferece o sacrifício e quem ordena o caminho; o ponto e vírgula torna as duas declarações facilmente perceptíveis. Todas as ambiguidades relevantes são preservadas no texto ou registradas em notas.
