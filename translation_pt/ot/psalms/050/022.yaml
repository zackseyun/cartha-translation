  naturalness: «Entendam isto, por favor» é compreensível e moderno. A revisão ajusta a ligação final para uma construção portuguesa mais clara e idiomática, sem reduzir a solenidade nem a violência da imagem.
  terminology: «Deus», «despedaçar» e «livrar» são adequados ao hebraico e ao registro do salmo. «Despedace» preserva o aspecto vívido de טרף sem impor uma interpretação doutrinária.
