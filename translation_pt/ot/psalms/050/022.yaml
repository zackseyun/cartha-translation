base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: pt
  text: Entendam isto, por favor, vocês que se esquecem de Deus, para que eu não os despedace, sem que haja quem os livre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּֽינוּ
  choice: Entendam
  rationale: Imperativo plural de בין, que convoca os destinatários a compreender e discernir. “Entendam” é direto, natural e preserva a força da exortação.
- source_word: נָא
  choice: por favor
  rationale: Partícula que acrescenta insistência ou apelo. “Por favor” transmite esse tom sem convertê-la em simples indicação temporal.
- source_word: זֹאת
  choice: isto
  rationale: Demonstrativo que remete à advertência divina no contexto imediato. “Isto” mantém a referência sem explicá-la além do texto.
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: vocês que se esquecem de Deus
  rationale: O particípio funciona como vocativo. A construção escolhida é idiomática em português e preserva a caracterização contínua dos destinatários.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz uma consequência ameaçadora que deve ser evitada. Esta construção é corrente em português e conserva a solenidade da advertência.
- source_word: אֶ֝טְרֹ֗ף
  choice: eu não os despedace
  rationale: טרף descreve o ato de dilacerar uma presa. “Despedace” preserva a imagem violenta; o pronome “os”, implícito no hebraico, explicita naturalmente o objeto indicado pelo contexto.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: e não haja quem os livre
  rationale: A negação existencial seguida do particípio causativo de נצל indica a ausência de qualquer libertador. “Quem os livre” é natural e mantém a ideia de resgate.
theological_decisions:
- issue: Imagem do juízo divino em אֶטְרֹף
  choice: Preservar a metáfora predatória mediante “eu não os despedace”.
  alternative: Abrandar para “eu não os destrua” ou “eu não os agarre”.
  rationale: O hebraico emprega uma imagem vívida de dilacerar uma presa. Abrandá-la reduziria a severidade da advertência e substituiria a metáfora do texto por uma interpretação mais genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, sem suavizar a imagem do juízo. Não se incluiu nota, pois a explicitação pronominal do objeto implícito é transparente e não elimina uma ambiguidade relevante.
