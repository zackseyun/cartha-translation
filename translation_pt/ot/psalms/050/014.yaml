  text: זְבַ֣ח לֵ/אלֹהִ֣ים תּוֹדָ֑ה וְ/שַׁלֵּ֖ם לְ/עֶלְי֣וֹן נְדָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: pt
  text: Ofereça a Deus um sacrifício de gratidão[a] e cumpra os seus votos ao Altíssimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofereça gratidão a Deus como sacrifício”; neste contexto sacrificial, o hebraico תּוֹדָה pode significar tanto “gratidão” ou “ação de graças” quanto “oferta de gratidão”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: זְבַח
  choice: Ofereça
  rationale: O imperativo do verbo זבח descreve a apresentação de um sacrifício. “Ofereça” é natural em português e, com o complemento “um sacrifício”, preserva claramente o sentido cultual.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição ל indica aqui o destinatário da oferta; “a Deus” é a formulação portuguesa direta e idiomática.
- source_word: תּוֹדָה
  choice: um sacrifício de gratidão
  rationale: תּוֹדָה pode designar tanto gratidão/ação de graças quanto uma oferta de gratidão. A expressão escolhida preserva simultaneamente a dimensão sacrificial e a de agradecimento, sem restringir indevidamente o termo a uma categoria ritual técnica.
- source_word: וְשַׁלֵּם
  choice: e cumpra
  rationale: O imperativo de שלם, com votos como objeto, significa pagar ou cumprir. “Cumpra” é a colocação natural em português e comunica a obrigação assumida sem conotação excessivamente comercial.
- source_word: לְעֶלְיוֹן
  choice: ao Altíssimo
  rationale: עֶלְיוֹן é um título divino que significa “Altíssimo”. A contração “ao” traduz naturalmente a preposição ל.
- source_word: נְדָרֶיךָ
  choice: os seus votos
  rationale: O substantivo plural com sufixo de segunda pessoa masculina singular é traduzido de modo direto e compreensível; “seus” mantém a referência pessoal sem marcar gênero desnecessariamente em português.
theological_decisions:
- issue: Expressão cultual que combina זבח e תודה
  choice: “um sacrifício de gratidão”
  alternative: “gratidão como sacrifício” ou “uma oferta de gratidão”
  rationale: O hebraico admite tanto a ideia de gratidão apresentada sacrificialmente quanto a de uma oferta específica de gratidão. O texto principal mantém as duas dimensões, e a nota registra a ambiguidade lexical genuína.
- issue: Título divino עֶלְיוֹן
  choice: “o Altíssimo”
  alternative: “Elyon”
  rationale: O termo funciona como título divino e seu sentido é transparente quando traduzido; transliterá-lo o tornaria desnecessariamente opaco.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Sacrifício de gratidão” evita o tecnicismo menos corrente “sacrifício de ação de graças”, enquanto a nota preserva a amplitude semântica do hebraico.
