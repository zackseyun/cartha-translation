  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: pt
  text: Pois você odeia a disciplina[b][a] e lança as minhas palavras atrás de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas você odeia a disciplina.” A conjunção também pode ser entendida em sentido adversativo, além do sentido explicativo ou continuativo.'
    reason: lexical_alternative
  - marker: b
    text: “Disciplina” também pode ser traduzida por “instrução”, “correção” ou “repreensão”, refletindo a amplitude do hebraico musar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Pois você
  rationale: O pronome explícito dá ênfase ao destinatário, e a conjunção pode introduzir uma explicação ou um contraste. “Pois você” liga naturalmente a acusação ao contexto, sem eliminar a leitura adversativa, registrada em nota.
- source_word: שָׂנֵאתָ
  choice: odeia
  rationale: Embora seja uma forma perfeita, no discurso poético acusatório descreve uma atitude característica; o presente é natural em português.
- source_word: מוּסָר
  choice: disciplina
  rationale: O termo hebraico abrange formação moral, instrução corretiva e repreensão. “Disciplina” conserva bem essa amplitude no contexto.
- source_word: וַתַּשְׁלֵךְ
  choice: lança
  rationale: Preserva a imagem concreta de atirar ou jogar fora, com registro digno e corrente. O presente expressa a conduta caracterizada pela acusação.
- source_word: דְּבָרַי
  choice: as minhas palavras
  rationale: Tradução direta do plural com sufixo de primeira pessoa, sem ampliar interpretativamente para mandamentos ou ensinamentos.
- source_word: אַחֲרֶיךָ
  choice: para trás de si
  rationale: Mantém a imagem espacial do hebraico e comunica rejeição ou desprezo, evitando a possível ideia de ação secreta associada a “pelas costas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “para trás de si” preserva a metáfora sem sugerir segredo; os marcadores seguem a ordem fornecida no texto de consulta.
