  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: pt
  text: Nosso Deus vem e não fica em silêncio[a]; diante dele, um fogo devora, e, ao seu redor, uma tempestade se enfurece violentamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o nosso Deus venha e não fique em silêncio”. Também é possível entender os verbos com sentido futuro: “Nosso Deus virá e não ficará em silêncio”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e, ao seu redor, é extremamente tempestuoso” ou “e, ao seu redor, há uma tempestade violenta”. O hebraico usa um verbo de sentido tempestuoso, sem mencionar expressamente o substantivo “tempestade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: vem
  rationale: O imperfeito qal de בוא pode ter valor presente ou futuro na poesia. O presente torna vívida a manifestação divina sem excluir a leitura futura, registrada em nota.
- source_word: אֱלֹהֵינוּ
  choice: Nosso Deus
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa do plural.
- source_word: וְאַל יֶחֱרַשׁ
  choice: e não fica em silêncio
  rationale: Embora אַל normalmente introduza proibição ou valor volitivo, no contexto poético a frase pode descrever a vinda de Deus como não silenciosa. A nota preserva a possibilidade volitiva.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: diante dele, um fogo devora
  rationale: Mantém a ordem imagética e o valor espacial de לְפָנָיו; אכל, tendo o fogo como sujeito, comunica consumir ou devorar.
- source_word: וּסְבִיבָיו
  choice: e ao seu redor
  rationale: Equivalente idiomático e conciso da expressão espacial hebraica.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: a tempestade é violentíssima
  rationale: O nifal de שער descreve um cenário tempestuoso ou uma tempestade que se enfurece; מְאֹד intensifica fortemente a imagem. Em português, a formulação nominal é natural, embora o hebraico não expresse um substantivo explícito; a alternativa mais verbal consta na nota.
theological_decisions:
- issue: A manifestação de Deus em julgamento é retratada por silêncio rompido, fogo e tempestade, sem identificação cristológica explícita.
  choice: Conservar a descrição direta da vinda de Deus e suas imagens teofânicas.
  alternative: Interpretar explicitamente a cena como prenúncio do juízo final.
  rationale: O verso apresenta a vinda de Deus com fogo e tempestade, mas não especifica no próprio texto uma estrutura escatológica ou denominacional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo e a força visual da poesia, enquanto as notas registram as ambiguidades de aspecto verbal e de construção na última oração.
