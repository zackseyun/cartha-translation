source:
  edition: WLC
  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: pt
  text: De Sião[a], a perfeição da beleza, Deus resplandece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De Sião, a perfeição da beleza, Deus resplandeceu”; ou: “De Sião, em perfeita beleza, Deus resplandece”.'
    reason: Leituras alternativas possíveis para o aspecto de הוֹפִיעַ e para a relação sintática de מִכְלַל־יֹפִי.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: De Sião
  rationale: A preposição מִן indica fonte ou origem. “De Sião” é natural em português e preserva a ideia de que a manifestação divina procede de Sião.
- source_word: מִכְלַל
  choice: a perfeição da
  rationale: Em construção com יֹפִי, expressa completude ou manifestação plena; a formulação mantém a força elevada e poética do hebraico.
- source_word: יֹפִי
  choice: beleza
  rationale: O substantivo denota beleza ou formosura. “Beleza” é claro, corrente e não desloca o sentido para a ideia mais específica de esplendor radiante.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo singular הוֹפִיעַ confirma que אֱלֹהִים tem sentido singular neste contexto.
- source_word: הוֹפִיעַ
  choice: resplandece
  rationale: O hifil de יפע pode indicar brilhar, manifestar-se radiantemente ou aparecer em esplendor. “Resplandece” conserva a imagem luminosa e a vivacidade poética; o presente português traduz adequadamente o perfeito hebraico de valor poético, embora uma leitura perfectiva também seja possível.
theological_decisions:
- issue: Relação de “a perfeição da beleza” com Sião ou com Deus
  choice: 'A expressão é apresentada em aposição a Sião: “De Sião, a perfeição da beleza, Deus resplandece”.'
  alternative: 'Pode ser entendida adverbial ou predicativamente: “De Sião, em perfeita beleza, Deus resplandece”, vinculando mais diretamente a beleza à manifestação de Deus.'
  rationale: A sequência hebraica favorece a leitura de מִכְלַל־יֹפִי como descrição apositiva de Sião, mas a nota preserva a ambiguidade sintática e teológica genuína.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “Resplandece” preserva a imagem radiante sem soar excessivamente arcaico. A pontuação mantém a leitura apositiva principal, e a nota registra as alternativas legítimas.
