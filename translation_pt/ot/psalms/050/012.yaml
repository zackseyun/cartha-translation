  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: pt
  text: Se eu tivesse fome, não diria a você, pois o mundo e tudo o que nele há são meus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Se eu tivesse fome
  rationale: A construção com אִם e o imperfeito apresenta uma situação hipotética. Em português, o imperfeito do subjuntivo expressa essa força retórica de modo natural.
- source_word: לֹא אֹמַר לָךְ
  choice: não diria a você
  rationale: O condicional harmoniza com a hipótese da primeira oração; 'dizer a você' preserva de modo claro o sentido de אמר com objeto indireto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação anterior, mantendo uma ligação explicativa concisa e digna.
- source_word: לִי
  choice: são meus
  rationale: A preposição לְ marca posse. A construção predicativa é natural em português com o sujeito composto que segue.
- source_word: תֵבֵל
  choice: o mundo
  rationale: תֵבֵל designa o mundo, especialmente a terra habitada ou o mundo ordenado; 'o mundo' é claro e adequado ao contexto poético.
- source_word: וּמְלֹאָהּ
  choice: e tudo o que nele há
  rationale: A expressão literalmente indica 'sua plenitude', isto é, aquilo que enche o mundo. A formulação escolhida comunica esse sentido com naturalidade em português moderno.
theological_decisions:
- issue: Autossuficiência divina no contexto dos sacrifícios
  choice: 'A declaração é traduzida como uma hipótese retórica: Deus não depende de provisão humana.'
  alternative: 'Uma tradução mais literal quanto à forma verbal seria: ''Se eu tiver fome, não direi a você''.'
  rationale: O contexto rejeita a ideia de que os sacrifícios alimentem Deus. A forma hipotética em português transmite essa ênfase sem acrescentar terminologia filosófica ao texto.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tom permanece poético e digno, sem arcaísmos. A expansão idiomática 'tudo o que nele há' evita a expressão menos natural 'sua plenitude' e preserva o sentido do hebraico.
