  terminology: “Repreenderei” corresponde bem a אוֹכִיחֲךָ no contexto moral e acusatório. “Seria igual a você” comunica de modo idiomático a falsa suposição de que Deus se equipararia ao acusado, sem impor uma formulação doutrinária.
