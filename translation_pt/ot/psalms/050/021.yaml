  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: pt
  text: Você fez essas coisas, e eu fiquei calado. Você pensou que eu seria igual a você.[a] Mas eu repreenderei você e porei em ordem diante dos seus olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que eu era como você”. A construção hebraica permite mais de uma forma de expressar a suposição equivocada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “apresentarei o caso diante de você”. O verbo hebraico significa “organizar”, “dispor” ou “pôr em ordem”, e seu objeto não está expresso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Você fez essas coisas
  rationale: O demonstrativo plural retoma as transgressões mencionadas anteriormente, e o perfeito descreve os atos já praticados.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: e eu fiquei calado
  rationale: Expressa claramente o silêncio de Deus durante esse período sem acrescentar ao verbo a interpretação explícita de aprovação ou indiferença.
- source_word: דִּמִּיתָ
  choice: Você pensou
  rationale: Neste contexto, o verbo indica uma suposição ou conclusão mental equivocada; “pensou” é corrente e direto.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: que eu era como você
  rationale: A oração expressa o conteúdo da suposição equivocada. A formulação portuguesa é natural, enquanto a possível nuance temporal de “seria” é preservada em nota.
- source_word: אוֹכִיחֲךָ
  choice: eu repreenderei você
  rationale: O hifil de יכח tem aqui força moral e acusatória. “Repreenderei” mantém essa força sem restringir o termo ao sentido técnico de condenação judicial.
- source_word: וְאֶעֶרְכָה לְעֵינֶיךָ
  choice: e porei tudo em ordem diante dos seus olhos
  rationale: ערך significa organizar, dispor ou pôr em ordem. O objeto não aparece no hebraico; “tudo” o torna idiomático em português sem especificá-lo como “acusação” ou “caso”.
theological_decisions:
- issue: O significado do silêncio divino
  choice: Traduzir simplesmente “eu fiquei calado”, seguido pelo contraste “Mas eu repreenderei você”.
  alternative: Explicitar o silêncio como tolerância ou paciência divina.
  rationale: A sequência deixa claro que o silêncio não significava aprovação, mas evita inserir no próprio texto uma explicação teológica que o verbo não declara.
- issue: Caráter da apresentação final
  choice: “porei tudo em ordem diante dos seus olhos”
  alternative: “apresentarei o caso diante de você”
  rationale: O contexto admite uma cena de acusação, mas o objeto do verbo está implícito. A tradução escolhida preserva a imagem hebraica e não resolve de modo indevido se se trata das acusações, dos pecados ou do caso como um todo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “você” para o singular. A repetição de “você” mantém clara a confrontação direta. O texto evita linguagem jurídica excessivamente técnica e preserva a indeterminação do objeto de וְאֶעֶרְכָה.
