  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: pt
  text: E clame a mim no dia da aflição; eu o livrarei, e você me honrará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me glorificará”. O verbo hebraico pode significar “honrar” ou “glorificar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: E clame a mim
  rationale: O verbo קרא com sufixo de objeto, neste contexto, expressa invocar Deus em busca de ajuda. “Clame a mim” é natural em português e preserva a intensidade da súplica.
- source_word: בְּיוֹם
  choice: no dia da
  rationale: A expressão temporal hebraica significa literalmente “no dia de” e conserva a forma poética sem perder naturalidade em português.
- source_word: צָרָה
  choice: aflição
  rationale: צָרָה designa angústia, dificuldade ou adversidade. “Aflição” comunica a gravidade do contexto e mantém um registro poético digno.
- source_word: אֲחַלֶּצְךָ
  choice: eu o livrarei
  rationale: O Piel de חלץ significa livrar ou resgatar de perigo. “Livrarei” é conciso, corrente no registro bíblico moderno e adequado ao contexto da ação salvadora de Deus.
- source_word: וּתְכַבְּדֵנִי
  choice: e você me honrará
  rationale: O Piel de כבד pode significar honrar ou glorificar. “Honrará” preserva o sentido amplo de atribuir a Deus o devido peso e estima, sem restringir a resposta a uma formulação litúrgica.
theological_decisions:
- issue: Resposta humana após o livramento divino
  choice: e você me honrará
  alternative: e você me glorificará
  rationale: O hebraico apresenta a honra dada a Deus como resposta apropriada de quem foi livrado. “Honrará” mantém o sentido amplo do verbo, enquanto “glorificará” continua sendo uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O tratamento por “você” torna explícita a segunda pessoa masculina singular do hebraico sem recorrer a formas regionais ou arcaizantes.
