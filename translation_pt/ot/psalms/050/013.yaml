  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: pt
  text: Acaso eu como a carne de touros ou bebo o sangue de bodes?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Acaso eu como
  rationale: A partícula interrogativa com o imperfeito qal na primeira pessoa introduz uma pergunta retórica. “Acaso eu como” transmite com naturalidade a negação implícita, sem convertê-la numa afirmação explicativa.
- source_word: בְּשַׂר
  choice: a carne de
  rationale: בשר designa concretamente a carne do animal. Em português atual, “carne” preserva melhor a imagem sacrificial do que “corpo” ou uma formulação abstrata.
- source_word: אַבִּירִים
  choice: touros
  rationale: Embora o termo possa significar literalmente “fortes” ou “poderosos”, neste contexto sacrificial designa bovinos fortes, isto é, touros.
- source_word: וְדַם
  choice: ou ... o sangue de
  rationale: A conjunção וְ normalmente significa “e”, mas, ligando as duas partes de uma única pergunta retórica, “ou” expressa naturalmente em português a relação entre as alternativas sem alterar o sentido do paralelismo.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: O termo designa cabritos ou caprinos machos; “bodes” é a correspondência portuguesa clara e precisa neste contexto.
- source_word: אֶשְׁתֶּה
  choice: bebo
  rationale: O imperfeito qal na primeira pessoa continua a pergunta retórica iniciada no primeiro membro; o presente do indicativo é idiomático em português.
theological_decisions:
- issue: Linguagem sacrificial antropomórfica a respeito de Deus
  choice: Manter a pergunta retórica e suas imagens concretas de comer carne e beber sangue
  alternative: Parafrasear como “Será que preciso dos seus sacrifícios?”
  rationale: O hebraico nega que Deus dependa literalmente dos sacrifícios como alimento. Preservar as imagens concretas mantém tanto a força retórica quanto a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” assinala claramente a pergunta retórica; “touros” e “bodes” mantêm a precisão da cena sacrificial. Não se incluiu a nota inglesa fornecida porque seu marcador está ligado a “bulls”, enquanto o conteúdo da nota (“male goats”) corresponde a עַתּוּדִים, traduzido diretamente por “bodes”.
