  source_fidelity: A tradução preserva adequadamente a pergunta retórica introduzida por הֲ, os dois verbos na primeira pessoa e a imagética sacrificial concreta. “Touros” é contextual e lexicalmente apropriado para אַבִּירִים, e “bodes” traduz com precisão עַתּוּדִים, isto é, caprinos machos.
