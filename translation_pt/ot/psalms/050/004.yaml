  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: pt
  text: 'Ele chama os céus do alto e a terra[a], para julgar o seu povo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele convoca os céus do alto e a terra”. O verbo pode ter o sentido de convocar, especialmente em um contexto judicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: chama
  rationale: O qal imperfeito de קרא pode significar “chamar” ou “convocar”. “Chama” é natural em português e preserva a amplitude do verbo, enquanto o contexto judicial permite a nuance de convocação.
- source_word: אֶל
  choice: os / a
  rationale: 'A preposição direcional é expressa naturalmente pela regência de “chamar”: “chama os céus... e a terra”.'
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: No paralelismo cósmico com “a terra”, o plural “os céus” preserva o alcance e o registro poético do hebraico.
- source_word: מֵעָל
  choice: lá do alto
  rationale: A expressão funciona adverbialmente, situando os céus no alto. “Lá do alto” é clara, poética e evita sugerir indevidamente movimento a partir de cima.
- source_word: וְאֶל
  choice: e
  rationale: A conjunção liga o segundo elemento cósmico; a relação direcional permanece implícita na regência compartilhada do verbo “chama”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Em paralelo com “os céus”, trata-se da terra em sentido cósmico, não apenas de uma região ou território.
- source_word: לָדִין
  choice: para julgar
  rationale: O infinitivo com ל expressa propósito. “Para julgar” comunica isso de modo direto e natural.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: A expressão preserva tanto o sentido coletivo de עם quanto a relação indicada pelo sufixo possessivo.
theological_decisions:
- issue: Identidade do sujeito implícito
  choice: Manter o pronome masculino singular “Ele”, que o contexto identifica como Deus.
  alternative: Explicitar “Deus” no próprio versículo.
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas este versículo não nomeia expressamente o sujeito. O pronome preserva o fluxo discursivo sem acrescentar uma identificação ausente nesta linha.
- issue: Função dos céus e da terra na cena judicial
  choice: Não explicitar que atuam como testemunhas.
  alternative: Traduzir de modo interpretativo como “convoca os céus e a terra como testemunhas”.
  rationale: O contexto sugere uma convocação judicial, mas o versículo apenas afirma que ele chama os céus e a terra para julgar seu povo; não especifica formalmente a função deles.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A formulação mantém a imagem cósmica, a finalidade judicial e a ambiguidade lexical de קרא. O marcador [a] aparece imediatamente após o conjunto dos elementos chamados.
