  text: Se você via um ladrão, você o aprovava,[a] e sua porção estava com os adúlteros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se agradava dele” ou “o aceitava”. O verbo hebraico expressa favor, aceitação ou aprovação.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua porção estava com os adúlteros”, expressão que indica alinhamento, participação ou convivência com eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Quando
  rationale: Embora אִם normalmente introduza uma condição, aqui apresenta de modo retórico uma conduta habitual dentro da acusação; “quando” comunica essa função com naturalidade em português.
- source_word: רָאִיתָ
  choice: você via
  rationale: O perfeito de ראה descreve a conduta denunciada. Com “quando”, o imperfeito português expressa naturalmente a situação repetida ou característica.
- source_word: גַנָּב
  choice: um ladrão
  rationale: Tradução direta de גַּנָּב, pessoa que furta ou rouba.
- source_word: וַתִּרֶץ
  choice: aprovava o que ele fazia
  rationale: A forma deriva de רצה, com o sentido de ter prazer, favorecer ou aceitar. No contexto acusatório, a formulação comunica aprovação sem sugerir mero contentamento pessoal nem adotar a leitura improvável “corria”.
- source_word: עִמּוֹ
  choice: o que ele fazia
  rationale: O hebraico diz literalmente “com ele”. A formulação explicita em português o objeto implícito da aprovação, preservando a ligação com o ladrão.
- source_word: וְעִם מְנָאֲפִים
  choice: e se associava com os adúlteros
  rationale: מְנָאֲפִים é um particípio substantivado, “adúlteros”; a preposição עִם integra a expressão idiomática seguinte de alinhamento e convivência.
- source_word: חֶלְקֶךָ
  choice: se associava
  rationale: Literalmente “sua porção”, aqui é uma metáfora de participação, alinhamento ou pertencimento. A tradução idiomática torna o sentido claro, enquanto a nota preserva a imagem hebraica.
