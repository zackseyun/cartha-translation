  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: pt
  text: Reúnam junto a mim os meus fiéis, os que firmam a minha aliança por meio de sacrifício.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “os que cortam a minha aliança sobre um sacrifício”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: Reúnam
  rationale: O imperativo qal masculino plural de אסף convoca vários agentes a ajuntar pessoas. “Reúnam” é natural, claro e preserva a força imperativa.
- source_word: לִי
  choice: junto a mim
  rationale: A preposição ל com sufixo de primeira pessoa pode significar “a/para mim”. Neste contexto de convocação, “junto a mim” expressa a reunião na presença de Deus sem especificar além do texto como ela ocorre.
- source_word: חֲסִידָי
  choice: os meus fiéis
  rationale: חסיד designa pessoas marcadas por lealdade e devoção no âmbito da aliança. “Os meus fiéis” conserva o aspecto relacional e evita associações técnicas posteriores que “santos” poderia sugerir.
- source_word: כֹּרְתֵי
  choice: os que firmam
  rationale: O particípio plural de כרת integra a expressão idiomática כרת ברית, literalmente “cortar uma aliança”. Em português, “firmar uma aliança” comunica o sentido idiomático com dignidade e clareza; a forma literal é registrada em nota.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: ברית com sufixo de primeira pessoa singular significa “minha aliança”. “Aliança” preserva o termo bíblico e sua dimensão relacional, sem reduzi-lo a mero acordo.
- source_word: עֲלֵי זָבַח
  choice: por meio de sacrifício
  rationale: A expressão associa a ratificação da aliança ao rito sacrificial. “Por meio de sacrifício” representa com clareza a provável relação instrumental, embora a preposição על também possa ser vertida mais literalmente como “sobre”.
theological_decisions:
- issue: Sentido de חֲסִידָי no contexto da aliança
  choice: os meus fiéis
  alternative: os meus santos; os que me são leais
  rationale: A escolha ressalta a fidelidade ou lealdade da aliança sem introduzir um sentido eclesiástico técnico posterior. A forma hebraica permite a nuance tanto de devoção quanto de lealdade.
- issue: Expressão idiomática de ratificação da aliança
  choice: os que firmam a minha aliança por meio de sacrifício
  alternative: os que cortam a minha aliança sobre um sacrifício
  rationale: A tradução principal comunica naturalmente o idioma hebraico em português, enquanto a nota conserva sua forma concreta e a possível amplitude da preposição, sem resolver além da evidência a relação ritual exata.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Reúnam” mantém a convocação direta; “firmam a minha aliança” evita literalismo obscuro, e a nota preserva a imagem hebraica.
