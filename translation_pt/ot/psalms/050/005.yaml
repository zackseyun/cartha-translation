  source_fidelity: A tradução preserva adequadamente o imperativo plural de אִסְפוּ, o direcionamento a Deus em לִי, a identificação pactual em חֲסִידַי e a construção participial כֹּרְתֵי בְרִיתִי. “Por meio de sacrifício” comunica de forma clara a associação ritual expressa por עֲלֵי זָבַח, sem alegar uma precisão indevida; a nota registra a formulação literal e a imagem idiomática de ‘cortar’ uma aliança.
  naturalness: O português é moderno, solene e natural para o gênero. “Reúnam junto a mim os meus fiéis” transmite com clareza a convocação dirigida a agentes plurais, e “os que firmam a minha aliança” é idiomático e adequado ao registro bíblico.
  terminology: “Fiéis” reproduz bem a nuance de lealdade/devotamento de חֲסִידַי sem introduzir um sentido eclesiástico técnico. “Aliança” é o equivalente estabelecido e apropriado para בְרִית. “Firmam” traduz de modo compreensível o idioma כרת ברית, cuja literalidade é devidamente preservada na nota.
