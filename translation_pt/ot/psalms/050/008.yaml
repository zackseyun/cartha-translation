  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: pt
  text: Não o repreendo por causa dos seus sacrifícios; seus holocaustos estão continuamente diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação direta da ação divina, expressa de modo natural em português.
- source_word: עַל
  choice: por causa de
  rationale: Com o verbo יכח, indica o motivo ou assunto da repreensão; a expressão explicita essa relação sem restringir indevidamente o sentido.
- source_word: זְבָחֶיךָ
  choice: seus sacrifícios
  rationale: Preserva o sentido cultual amplo de זֶבַח, sem especificar além do texto.
- source_word: אוֹכִיחֶךָ
  choice: o repreendo
  rationale: O hifil de יכח aqui comunica repreensão ou censura; 'repreendo' é corrente, claro e adequado ao discurso divino.
- source_word: וְעוֹלֹתֶיךָ
  choice: seus holocaustos
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada; 'holocaustos' é a designação bíblica consagrada e concisa em português.
- source_word: לְנֶגְדִּי
  choice: diante de mim
  rationale: Expressa presença à vista de Deus e mantém a nuance relacional e cultual.
- source_word: תָמִיד
  choice: continuamente
  rationale: Conserva a ideia de regularidade ou constância da presença das ofertas.
theological_decisions:
- issue: Sentido do versículo em relação ao sistema sacrificial de Israel
  choice: Deus não repreende o povo por falta de sacrifícios, pois os holocaustos estão continuamente diante dele.
  alternative: O versículo rejeita todo e qualquer sacrifício.
  rationale: A segunda oração confirma a presença constante dos holocaustos; portanto, o problema não é a ausência do rito, embora o contexto desenvolva uma crítica mais profunda à postura dos adoradores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A coordenação hebraica com וְ foi vertida por ponto e vírgula para refletir naturalmente a relação explicativa entre as orações.
