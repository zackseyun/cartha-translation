  text: Não tomarei nenhum touro da sua casa, nem bodes dos seus currais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: Não tomarei
  rationale: O Qal imperfeito na primeira pessoa do singular, negado por לֹא, expressa aqui a declaração divina de que ele não tomará esses animais.
- source_word: מִבֵּיתְךָ
  choice: da sua casa
  rationale: Preserva a imagem concreta de בַּיִת como casa ou propriedade do adorador, sem deslocar o sentido para os membros da família.
- source_word: פָר
  choice: nenhum touro
  rationale: פָר designa um bovino macho, especialmente em contexto sacrificial. “Touro” é direto; “nenhum” comunica naturalmente em português o alcance da negação.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: dos seus currais
  rationale: מִכְלָאָה é um recinto para animais. “Currais” é claro, atual e adequado ao contexto de criação de gado e caprinos.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: O termo hebraico especifica caprinos machos; “bodes” preserva essa precisão lexical sem necessidade de nota.
