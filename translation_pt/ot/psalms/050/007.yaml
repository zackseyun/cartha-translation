  text: שִׁמְעָ֤/ה עַמִּ֨/י וַ/אֲדַבֵּ֗רָה יִ֭שְׂרָאֵל וְ/אָעִ֣ידָה בָּ֑/ךְ אֱלֹהִ֖ים אֱלֹהֶ֣י/ךָ אָנֹֽכִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: pt
  text: 'Ouça, meu povo, e eu falarei; ó Israel, testemunharei contra você[a]: eu sou Deus, o seu Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “darei testemunho contra você”. O verbo hebraico tem sentido jurídico e testemunhal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Ouça
  rationale: O imperativo de שׁמע convoca a uma escuta atenta. “Ouça” é natural em português moderno e conserva o tom solene e judicial.
- source_word: עַמִּי
  choice: meu povo
  rationale: A forma com sufixo de primeira pessoa expressa a relação de aliança e é vertida diretamente por “meu povo”.
- source_word: וַאֲדַבֵּרָה
  choice: e eu falarei
  rationale: O coortativo de primeira pessoa após o imperativo indica propósito ou resolução. “E eu falarei” preserva a sequência e a determinação solene sem tornar a frase artificial.
- source_word: יִשְׂרָאֵל
  choice: ó Israel
  rationale: O nome próprio é mantido e recebe “ó” para marcar com clareza o vocativo solene.
- source_word: וְאָעִידָה בָּךְ
  choice: testemunharei contra você
  rationale: 'O Hifil de עוד, com בְּ e sufixo de segunda pessoa, tem força forense: prestar testemunho contra alguém. “Testemunharei contra você” conserva essa imagem judicial e o singular dirigido a Israel.'
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui seu sentido e sua referência são singulares.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: 'A forma construta com sufixo de segunda pessoa singular expressa a relação pactual. O artigo torna a aposição natural em português: “Deus, o seu Deus”.'
- source_word: אָנֹכִי
  choice: eu sou
  rationale: O pronome independente é enfático; numa oração nominal hebraica, o português requer a cópula. “Eu sou” preserva a autoidentificação enfática.
theological_decisions:
- issue: A autoidentificação divina אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: eu sou Deus, o seu Deus
  alternative: Deus, o seu Deus, sou eu
  rationale: A oração nominal hebraica apresenta uma identificação enfática. A redação escolhida é clara e digna em português atual, preservando tanto a afirmação da divindade quanto a relação de aliança, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” mantém o tratamento de Israel como entidade coletiva no hebraico; “ó” assinala o vocativo solene.
