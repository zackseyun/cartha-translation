  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: pt
  text: Salmo de Asafe. Deus, Deus, Yahweh,[a] falou e convocou a terra, desde o nascer do sol até o seu pôr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus, Deus, o SENHOR”. Alguns entendem de outra maneira os títulos divinos iniciais, inclusive: “O Deus dos deuses, o SENHOR”.'
    reason: Leitura alternativa da sequência hebraica incomum אֵל אֱלֹהִים יְהוָה e representação tradicional do nome divino.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Salmo de Asafe
  rationale: Forma natural em português que preserva a relação deliberadamente ampla expressa por לְ, sem especificar se Asafe é autor, destinatário ou referência da composição.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Deus, Deus, Yahweh
  rationale: Mantém a sequência incomum dos três nomes ou títulos divinos e sua tensão interpretativa, sem normalizá-la silenciosamente.
- source_word: וַיִּקְרָא אָרֶץ
  choice: e convocou a terra
  rationale: No contexto de uma cena judicial e de testemunho, 'convocou' comunica melhor o ato solene de chamar a terra do que o genérico 'chamou'.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: desde o nascer do sol até o seu pôr
  rationale: Expressão portuguesa clara e digna que conserva o merismo do horizonte oriental ao ocidental.
theological_decisions:
- issue: Relação sintática e semântica entre אֵל, אֱלֹהִים e יהוה
  choice: Deus, Deus, Yahweh
  alternative: O Deus dos deuses, Yahweh / Deus, Deus, o SENHOR
  rationale: A construção hebraica admite mais de uma análise. O texto principal reproduz a justaposição e a nota registra as principais alternativas, evitando decidir uma questão genuinamente ambígua.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome pessoal divino dos títulos אֵל e אֱלֹהִים e corresponde à camada inglesa auditada; a alternativa tradicional é indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação preserva a repetição enfática e a ambiguidade dos títulos divinos, enquanto 'convocou' sugere adequadamente a cena judicial do salmo.
