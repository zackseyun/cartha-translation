  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: pt
  text: Bendito seja Yahweh[a], que não nos entregou como presa aos dentes deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bendito é Yahweh”. A fórmula hebraica de bênção admite as duas traduções, embora “Bendito seja Yahweh” preserve melhor aqui a força doxológica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: A fórmula hebraica de bênção tem força doxológica. “Bendito seja” é natural, digna e preserva melhor essa exclamação litúrgica do que uma simples declaração descritiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שֶׁלֹּא
  choice: que não
  rationale: Introduz naturalmente, em português, a ação divina que fundamenta a bênção.
- source_word: נְתָנָנוּ
  choice: não nos entregou
  rationale: Embora o verbo básico signifique “dar”, “entregou” comunica com naturalidade a ideia contextual de pôr alguém em poder dos inimigos, sem ampliar indevidamente o sentido.
- source_word: טֶרֶף
  choice: presa
  rationale: No contexto de “dentes”, mantém a imagem dos inimigos como animais predadores.
- source_word: לְשִׁנֵּיהֶם
  choice: aos dentes deles
  rationale: Preserva a imagem concreta e vívida do hebraico, enquanto a construção completa permanece compreensível em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Força da fórmula בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  alternative: Bendito é Yahweh
  rationale: As duas construções são possíveis, mas o subjuntivo preserva melhor a força doxológica e celebrativa da fórmula neste contexto.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. A formulação conserva a metáfora predatória e a concisão poética do hebraico.
