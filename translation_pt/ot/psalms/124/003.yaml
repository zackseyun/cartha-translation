  text: então eles nos teriam engolido vivos, quando a ira deles se acendeu contra nós.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles nos engoliram”, se o verbo for entendido como passado simples; o contexto mais amplo (vv. 2–5) favorece o sentido contrafactual “eles nos teriam engolido”.
