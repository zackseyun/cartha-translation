    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: então
  rationale: Advérbio temporal que introduz a consequência na sequência contrafactual dos vv. 2–5; “então” é natural e conciso.
- source_word: חַיִּים
  choice: vivos
  rationale: Acusativo adverbial com o sentido de “enquanto vivos”; “engolido vivos” preserva a imagem vívida e soa idiomático em português.
- source_word: בְּלָעוּנוּ
  choice: eles nos teriam engolido
  rationale: Embora a forma verbal seja um perfeito qal, o contexto condicional iniciado no versículo anterior favorece o futuro do pretérito composto, sem apagar a possibilidade formal do passado simples.
- source_word: בַּחֲרוֹת
  choice: quando ... se acendeu
  rationale: O infinitivo construto com ב expressa circunstância temporal. “Se acendeu” conserva a metáfora de fogo ligada à ira.
- source_word: אַפָּם
  choice: a ira deles
  rationale: אַף significa literalmente “nariz”, mas é uma expressão hebraica convencional para ira; “ira” mantém a intensidade e o registro poético.
- source_word: בָּנוּ
  choice: contra nós
  rationale: Com verbos de ira, ב indica o alvo da hostilidade; “contra nós” é a formulação portuguesa mais clara.
