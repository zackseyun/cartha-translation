  text: então as águas impetuosas teriam passado sobre a nossa alma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “então as águas arrogantes teriam passado sobre nós”. O adjetivo hebraico pode significar “orgulhosas”, “insolentes” ou “presunçosas”; aqui, descreve metaforicamente as águas como violentas e dominadoras. “Nossa alma” também pode significar “nossa vida” ou simplesmente “nós”.'
    reason: Alternativas lexicais para הַזֵּידוֹנִים e נַפְשֵׁנוּ.
lexical_decisions:
- source_word: אֲזַי
  choice: então
  rationale: Advérbio temporal que dá continuidade à sequência contrafactual dos versículos anteriores; “então” é claro e natural em português.
- source_word: עָבַר עַל
  choice: teriam passado sobre
  rationale: Conserva o sentido espacial básico do verbo e da preposição, bem como a imagem das águas passando por cima dos salmistas.
- source_word: נַפְשֵׁנוּ
  choice: a nossa alma
  rationale: Mantém a forma singular coletiva do hebraico e sua imagem poética; נֶפֶשׁ pode designar a alma, a vida ou a própria pessoa.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Preserva o plural hebraico, natural na linguagem poética portuguesa.
- source_word: הַזֵּידוֹנִים
  choice: impetuosas
  rationale: No contexto das águas, comunica sua força violenta e dominadora. O sentido mais literal de orgulho, insolência ou presunção é preservado na nota.
