  text: עֶ֭זְרֵ/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/008.yaml
  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: pt
  text: Nosso auxílio está no nome de Yahweh[a], criador dos céus e da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui transliterado “Yahweh”.'
    reason: Explica a forma hebraica subjacente e a opção de transliteração.
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Nosso auxílio
  rationale: O substantivo עֵזֶר com sufixo de primeira pessoa do plural denota auxílio ou socorro, não a pessoa de um ajudador; “nosso auxílio” é natural e preserva a construção nominal.
- source_word: בְּשֵׁם
  choice: está no nome de
  rationale: A preposição בְּ com שֵׁם indica a base ou esfera de confiança e invocação. “No nome de” preserva a formulação litúrgica e pactual sem explicá-la em excesso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama YHWH, em vez de substituí-lo por um título.
- source_word: עֹשֵׂה
  choice: que fez
  rationale: O particípio qal caracteriza Yahweh como aquele que fez o cosmos. Em português, a oração relativa é clara e natural, sem transformar “Criador” em título formal.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: os céus e a terra
  rationale: Expressão abrangente para a totalidade da criação; “os céus e a terra” é a formulação portuguesa consagrada e corresponde naturalmente aos substantivos hebraicos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico apresenta diretamente o tetragrama. “Yahweh” preserva o nome pessoal; a nota informa sua forma consonantal hebraica sem substituir o nome por um título.
- issue: Valor do particípio עֹשֵׂה
  choice: que fez
  alternative: criador de; aquele que faz
  rationale: O particípio pode descrever uma ação característica e admitir formulação nominal ou relativa. “Que fez” é idiomático e preserva a identificação de Yahweh como autor dos céus e da terra, sem exigir que a ação seja entendida como ainda em curso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Auxílio” mantém o tom litúrgico sem soar arcaico; a sintaxe permanece concisa e próxima do paralelismo hebraico.
