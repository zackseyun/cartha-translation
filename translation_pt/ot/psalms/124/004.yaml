  text: then the waters would have swept us away[a]; the stream would have passed over our soul.
translation:
  language: pt
  text: então as águas nos teriam arrastado; a torrente teria passado sobre nossa alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossa vida” ou simplesmente “nós”. Aqui, a palavra hebraica traduzida como “alma” pode se referir à pessoa inteira ou à vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: então
  rationale: Advérbio temporal que dá continuidade à sequência contrafactual do versículo anterior; “então” é natural e conciso em português.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Mantém o plural definido do hebraico e a imagem poética concreta de águas avassaladoras.
- source_word: שְׁטָפוּנוּ
  choice: nos teriam arrastado
  rationale: O verbo descreve a ação de águas que inundam e carregam consigo. O futuro do pretérito composto expressa a condição irreal implícita no contexto.
- source_word: נַחְלָה
  choice: a torrente
  rationale: Embora o termo possa designar um riacho ou curso de água, neste contexto de águas destrutivas “torrente” comunica adequadamente sua força sem abandonar a imagem.
- source_word: עָבַר
  choice: teria passado
  rationale: Preserva o sentido básico de atravessar ou passar por cima; a forma verbal portuguesa mantém a sequência contrafactual.
- source_word: עַל
  choice: sobre
  rationale: Expressa diretamente o movimento das águas por cima da comunidade em perigo.
- source_word: נַפְשֵׁנוּ
  choice: a nossa alma
  rationale: Conserva a linguagem poética hebraica e sua ambiguidade, enquanto a nota esclarece que נֶפֶשׁ pode indicar a vida ou a própria pessoa.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em um contexto poético de perigo mortal
  choice: a nossa alma
  alternative: a nossa vida; nós
  rationale: O termo não afirma necessariamente uma antropologia técnica neste contexto. A tradução formal preserva a tensão e a dicção poética, e a nota apresenta os sentidos contextualmente possíveis sem escolher silenciosamente entre eles.
translation_notes:
  register: Português moderno, claro e solene, com estrutura poética paralela. O futuro do pretérito composto explicita naturalmente em português a condição contrafactual herdada do contexto. A colocação do marcador após “alma” liga a nota diretamente ao termo explicado.
