base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: pt
  text: 'Cântico das subidas. De Davi.


    Se Yahweh não tivesse estado a nosso favor[a] — diga Israel agora —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “não tivesse estado ao nosso lado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Mantém a forma tradicional da rubrica e traduz מַעֲלוֹת de modo próximo ao hebraico, sem decidir se a referência é a peregrinações, degraus ou uso litúrgico.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição לְ pode indicar autoria, associação ou dedicação. “De Davi” conserva melhor essa amplitude do que “por Davi” ou “para Davi”.
- source_word: לוּלֵי
  choice: Se ... não estivesse
  rationale: Introduz uma condição contrária aos fatos cuja consequência continua no versículo seguinte; a construção com o imperfeito do subjuntivo é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama e preserva sua referência pactual.
- source_word: שֶׁהָיָה לָנוּ
  choice: estivesse a nosso favor
  rationale: Expressa em português corrente a ideia de que Yahweh agia em favor de Israel. Evita a formulação pouco natural “fosse por nós”, sem acrescentar uma imagem ausente do hebraico.
- source_word: יֹאמַר נָא
  choice: diga ... agora
  rationale: Reproduz a exortação do jussivo com נָא de maneira direta e natural.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome do povo da aliança sem paráfrase desnecessária.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido da expressão שֶׁהָיָה לָנוּ
  choice: estivesse a nosso favor
  alternative: estivesse ao nosso lado
  rationale: A expressão indica apoio ou atuação em benefício de Israel. O texto principal comunica esse sentido sem introduzir a imagem espacial mais específica de estar “ao lado”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A rubrica permanece formal; os travessões conservam a suspensão retórica da condição, cuja continuação vem no versículo seguinte.
