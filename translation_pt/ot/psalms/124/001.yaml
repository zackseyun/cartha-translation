  - severity: low
    issue: A nota chama «ao nosso lado» de alternativa «mais figurada».
    rationale: A diferença principal é de idiomaticidade e de imagem espacial, não de maior grau de figuração. A formulação revisada descreve a alternativa com maior precisão.
