  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/000.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: pt
  text: 'Cântico de peregrinação. De Davi.


    Se o SENHOR não tivesse estado a nosso favor[a] — diga agora Israel —,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “que era para nós”; também pode ser traduzido de modo idiomático: “que esteve ao nosso lado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: A expressão designa os cânticos ligados às subidas, provavelmente às peregrinações a Jerusalém. A formulação comunica naturalmente essa função em português sem reduzir o título a uma subida meramente física.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a formulação breve e a ambiguidade relacional da preposição hebraica, que pode indicar autoria, associação ou dedicação.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: לוּלֵי
  choice: Se não fosse
  rationale: Expressa a condição contrária aos fatos introduzida pela partícula hebraica, deixando a consequência em suspensão como no texto.
- source_word: שֶׁהָיָה לָנוּ
  choice: que esteve a nosso favor
  rationale: O hebraico diz literalmente que YHWH 'era/esteve para nós'; a escolha preserva a ideia de auxílio favorável sem acrescentar a imagem mais específica de 'lado' ao texto principal.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: diga Israel
  rationale: Reproduz a convocação enfática para que Israel declare a frase, com ordem natural e digna em português.
theological_decisions:
- issue: Representação do tetragrama
  choice: SENHOR
  alternative: Javé
  rationale: A convenção SENHOR é amplamente inteligível e reverente em português, enquanto a nota lexical registra que o termo-fonte é o nome divino YHWH; não se acrescenta interpretação denominacional.
- issue: Natureza da presença divina em שֶׁהָיָה לָנוּ
  choice: a nosso favor
  alternative: ao nosso lado
  rationale: A opção principal comunica auxílio e defesa sem impor uma metáfora espacial que não aparece explicitamente no hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O travessão e a vírgula final mantêm a construção retórica suspensa, cuja consequência aparece no versículo seguinte. O marcador [a] aparece junto à expressão que explica.
