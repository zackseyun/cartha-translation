  text: לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ בְּ/ק֖וּם עָלֵ֣י/נוּ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: pt
  text: Se Yahweh não tivesse estado a nosso favor quando os homens se levantaram contra nós—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se Yahweh não tivesse estado ao nosso lado quando os homens se levantaram contra nós”.'
    reason: Alternativa idiomática para שֶׁהָיָה לָנוּ, que pode expressar apoio como “estar ao lado de alguém”.
lexical_decisions:
- source_word: לוּלֵי
  choice: Se ... não estivesse
  rationale: Introduz uma condição contrafactual cuja consequência aparece no versículo seguinte; esta construção é natural em português e preserva a estrutura suspensa do poema.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֶׁהָיָה לָנוּ
  choice: estivesse a nosso favor
  rationale: No contexto, a construção com היה e ל expressa apoio em favor do povo. A formulação evita o sentido causal e ambíguo que “fosse por nós” pode ter em português.
- source_word: בְּקוּם
  choice: quando ... se levantaram
  rationale: A preposição בְּ com o infinitivo construto introduz a circunstância temporal; em contexto hostil, קום significa levantar-se para agir contra alguém.
- source_word: עָלֵינוּ
  choice: contra nós
  rationale: No contexto de hostilidade, עַל tem sentido adversativo, expresso naturalmente por “contra”.
- source_word: אָדָם
  choice: os homens
  rationale: O singular hebraico é coletivo e designa os atacantes humanos. O plural em português comunica naturalmente esse valor coletivo sem sugerir apenas um indivíduo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração preserva a distinção entre o nome próprio e títulos como “Senhor”.
- issue: Sentido de שֶׁהָיָה לָנוּ
  choice: estivesse a nosso favor
  alternative: estivesse ao nosso lado
  rationale: A opção principal mantém a ideia de apoio sem converter a expressão em uma descrição necessariamente espacial; a alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética. O travessão preserva a oração condicional em suspenso, cuja consequência vem no versículo seguinte.
