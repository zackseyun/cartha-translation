id: PSA.124.7
reference: Psalms 124:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: pt
  text: Nossa alma[a] escapou como um pássaro do laço dos que armam laços[b]; o laço se rompeu, e nós escapamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “alma” pode significar a vida ou a pessoa inteira.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos caçadores” ou “dos que preparam armadilhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: nossa alma
  rationale: Reproduz de modo direto o substantivo coletivo singular נֶפֶשׁ com o sufixo de primeira pessoa do plural, preservando o registro poético. Neste contexto, a expressão pode representar a vida ou a pessoa inteira, possibilidade indicada em nota.
- source_word: כְּצִפּוֹר
  choice: como um pássaro
  rationale: צִפּוֹר é um termo geral para ave ou pássaro, sem exigir a identificação específica de um pardal.
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: escapou / escapamos
  rationale: A repetição de formas de מלט é preservada, sustentando o movimento poético da fuga figurada para a declaração explícita de livramento.
- source_word: מִפַּח / הַפַּח
  choice: do laço / o laço
  rationale: Laço expressa naturalmente uma armadilha para aves e conserva a repetição enfática do hebraico.
- source_word: יוֹקְשִׁים
  choice: dos que armam laços
  rationale: O particípio designa pessoas que montam armadilhas. A formulação é clara em português atual e mantém a ligação lexical com o laço, sem recorrer ao termo menos comum 'passarinheiros'.
- source_word: נִשְׁבָּר
  choice: se rompeu
  rationale: Expressa de forma idiomática o acontecimento concluído pelo qual a armadilha deixou de prender, sem especificar quem a rompeu.
- source_word: וַאֲנַחְנוּ
  choice: e nós
  rationale: Mantém o pronome explícito e enfático do hebraico antes da declaração final.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: Manter 'alma' no texto e esclarecer sua amplitude semântica em nota
  alternative: Traduzir 'nossa vida' ou 'nós mesmos' no texto principal
  rationale: A escolha preserva a forma poética e a ambiguidade legítima do hebraico, enquanto a nota evita que 'alma' seja entendida necessariamente como uma parte imaterial separável da pessoa.
translation_notes:
  register: Português moderno, digno e poético, com sintaxe acessível. A repetição de “laço” e “escapou/escapamos” foi mantida para refletir a estrutura e a ênfase do hebraico.
