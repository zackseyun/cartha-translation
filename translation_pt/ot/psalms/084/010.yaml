source:
  edition: WLC
  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: pt
  text: Pois um dia nos teus pátios é melhor do que mil[a]. Prefiro ficar no limiar da casa do meu Deus[b] a morar nas tendas da perversidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do que mil”. Algumas traduções acrescentam “dias” ou “em outro lugar”, mas essas palavras não aparecem no texto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Escolhi ficar no limiar da casa do meu Deus”; tradicionalmente: “Prefiro ser porteiro na casa do meu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: é melhor
  rationale: Na construção comparativa com מֵאָלֶף, o português pede naturalmente o comparativo “é melhor”, embora טוֹב isoladamente signifique “bom”.
- source_word: בַּחֲצֵרֶיךָ
  choice: nos teus pátios
  rationale: חָצֵר designa pátio ou átrio. “Pátios” conserva o plural e comunica com clareza o espaço do santuário em português atual.
- source_word: מֵאָלֶף
  choice: do que mil
  rationale: O hebraico deixa implícito o termo contado após “mil”. A tradução preserva essa concisão sem acrescentar “dias” ou “em outro lugar” ao texto principal.
- source_word: בָּחַרְתִּי
  choice: prefiro
  rationale: Embora a forma verbal possa ser traduzida literalmente como “escolhi”, no paralelismo comparativo ela expressa uma preferência decidida. “Prefiro” transmite essa força de modo natural.
- source_word: הִסְתּוֹפֵף
  choice: ficar no limiar
  rationale: O verbo raro indica ocupar um lugar junto ao limiar ou à entrada, provavelmente uma posição humilde; não designa inequivocamente o ofício de porteiro.
- source_word: בְּבֵית אֱלֹהַי
  choice: da casa do meu Deus
  rationale: “Casa” preserva a imagem concreta do hebraico para o santuário sem especificá-la além do texto como “templo”.
- source_word: מִדּוּר
  choice: a morar
  rationale: O infinitivo introduz o segundo termo da comparação; “a morar” é idiomático após “prefiro ... a”.
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: nas tendas da perversidade
  rationale: Mantém o substantivo abstrato רֶשַׁע, destacando a qualidade moral associada às tendas, em vez de transformá-lo diretamente em referência a pessoas perversas.
theological_decisions:
- issue: Linguagem do santuário
  choice: teus pátios / casa do meu Deus
  alternative: teus átrios / templo do meu Deus
  rationale: A tradução conserva as imagens espaciais concretas do santuário e o contraste entre proximidade de Deus e habitação na perversidade, sem substituir “casa” por uma designação mais específica.
- issue: Posição junto à entrada
  choice: ficar no limiar
  alternative: ser porteiro
  rationale: O hebraico sustenta a ideia de ocupar um lugar humilde junto à entrada, mas não exige que o salmista reivindique um cargo formal de porteiro.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e ampla inteligibilidade internacional. “Pátios”, “limiar” e “tendas” preservam a poesia e as imagens concretas do hebraico sem arcaísmo excessivo.
