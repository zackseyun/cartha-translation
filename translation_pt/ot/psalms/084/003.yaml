base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: pt
  text: Até o pardal encontrou um lar, e a andorinha, um ninho para si, onde põe os seus filhotes[a]—junto aos teus altares[b], ó Yahweh dos Exércitos[c], meu Rei e meu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde pôs seus filhotes”. O verbo hebraico também pode descrever uma ação já concluída, em vez da finalidade habitual do ninho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos teus altares” ou “perto dos teus altares”. A construção hebraica é compacta e pode indicar proximidade, não necessariamente uma posição literal sobre os altares.'
    reason: lexical_alternative
  - marker: c
    text: 'Forma tradicional: “SENHOR dos Exércitos” ou “SENHOR dos exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Expressa a força enfática da partícula: até mesmo aves pequenas encontram lugar no santuário de Deus.'
- source_word: צִפּוֹר
  choice: pardal
  rationale: Embora possa designar uma ave pequena em geral, “pardal” é uma identificação tradicional e lexicalmente possível, além de formar um par poético natural com “andorinha”.
- source_word: מָצְאָה בַיִת
  choice: encontrou um lar
  rationale: Traduz o perfeito hebraico como ação concluída com resultado presente e comunica uma morada, não apenas uma construção.
- source_word: דְרוֹר
  choice: andorinha
  rationale: É a identificação mais comum desse nome de ave; “andorinhão” também é possível, mas menos seguro e menos familiar.
- source_word: קֵן לָהּ
  choice: um ninho para si
  rationale: Preserva o dativo de benefício ou posse e a referência feminina à ave.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: onde pode pôr seus filhotes
  rationale: Apresenta naturalmente o ninho como o lugar destinado à cria. Como o perfeito hebraico também pode indicar ação já concluída, essa leitura é mantida em nota.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: junto aos teus altares
  rationale: A construção hebraica é compacta e, no contexto, provavelmente localiza o ninho nas proximidades dos altares, sem afirmar que estivesse literalmente sobre eles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Torna transparente o sentido concreto do título divino, preservando sua força soberana e marcial.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: meu Rei e meu Deus
  rationale: Mantém as duas confissões pessoais em discurso direto, com “Rei” empregado como título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo pelo título tradicional.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos; dos Exércitos celestiais; dos Senhores dos Exércitos
  rationale: “Dos Exércitos” mantém a amplitude do hebraico sem restringir explicitamente quais exércitos estão em vista.
- issue: Relação das aves com os altares
  choice: junto aos teus altares
  alternative: nos teus altares; perto dos teus altares
  rationale: A sintaxe é condensada e permite uma relação de proximidade. A formulação escolhida evita a imagem improvável de ninhos literalmente sobre a superfície sacrificial, sem apagar a ligação íntima com o santuário.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com a linguagem poética dos Salmos. A elipse em “e a andorinha, um ninho” conserva o paralelismo sem soar artificial. “Pode pôr” é natural em português para a função do ninho, enquanto a nota preserva o valor perfectivo possível do hebraico.
