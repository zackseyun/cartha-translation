id: PSA.84.11
reference: Psalms 84:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: pt
  text: Pois Yahweh Deus é sol e escudo; Yahweh concede favor e honra.[a] Não nega bem algum aos que andam com integridade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “graça e glória”.'
    reason: lexical_alternative
  - marker: b
    text: “Com integridade” indica inteireza e retidão no modo de viver, não perfeição sem pecado.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a afirmação anterior e funciona naturalmente no discurso poético em português.
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: sol e escudo
  rationale: 'Preserva literalmente as duas metáforas poéticas: luz e vida associadas ao sol, e proteção associada ao escudo, sem explicá-las além do hebraico.'
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém o nome divino representado pelo Tetragrama e entende אֱלֹהִים em aposição.
- source_word: חֵן וְכָבוֹד
  choice: favor e honra
  rationale: חֵן expressa benevolência ou favor, e כָבוֹד, como dádiva concedida às pessoas, pode indicar honra; a alternativa tradicional 'graça e glória' é registrada em nota.
- source_word: יִתֵּן
  choice: concede
  rationale: O imperfeito tem aqui valor habitual ou gnômico; o presente comunica uma verdade geral. 'Concede' expressa de modo digno o ato de dar favor e honra.
- source_word: לֹא יִמְנַע טוֹב
  choice: Não nega bem algum
  rationale: Expressa idiomaticamente em português a ideia de não reter nenhuma coisa boa, preservando o caráter abrangente de טוֹב.
- source_word: לַהֹלְכִים בְּתָמִים
  choice: aos que andam com integridade
  rationale: Mantém a metáfora ética de 'andar' e traduz תָמִים como inteireza e retidão de conduta, sem sugerir perfeição sem pecado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido ético de בְּתָמִים
  choice: com integridade
  alternative: irrepreensivelmente; com retidão
  rationale: A expressão descreve inteireza e retidão no modo de viver, não perfeição moral absoluta. A formulação escolhida reduz esse possível equívoco sem enfraquecer a exigência ética.
- issue: Alcance de טוֹב
  choice: bem algum
  alternative: o que é bom; coisa boa alguma
  rationale: O hebraico é abrangente e não especifica que todo desejo humano será concedido; a tradução conserva essa generalidade sem acrescentar uma qualificação teológica ausente do verso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A concisão e o paralelismo poético do hebraico foram preservados; as metáforas 'sol', 'escudo' e 'andar' permanecem explícitas.
