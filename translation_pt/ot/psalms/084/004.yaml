  - marker: d
    text: 'Ou: “continuam a te louvar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Felizes
  rationale: A forma plural introduz uma exclamação de felicidade ou bem-aventurança. “Felizes” é clara, digna e natural em português, sem reduzir a expressão a um estado emocional passageiro.
- source_word: יוֹשְׁבֵי
  choice: os que habitam
  rationale: O particípio de ישׁב indica os que residem ou permanecem, e não apenas os que estão sentados; a formulação preserva esse sentido contínuo.
- source_word: בֵיתֶךָ
  choice: tua casa
  rationale: Mantém a imagem literal do hebraico. No contexto, a expressão provavelmente se refere ao santuário de Deus, mas “casa” evita explicitar no texto principal o que permanece implícito.
- source_word: עוֹד יְהַלְלוּךָ
  choice: continuam a te louvar
  rationale: עוֹד, junto do imperfeito, pode expressar continuidade habitual. A tradução comunica louvor persistente e soa natural em português, sem impor uma referência exclusivamente futura.
- source_word: סֶּלָה
  choice: Selá
  rationale: O termo litúrgico ou musical hebraico tem sentido incerto; por isso, é transliterado, em vez de receber uma interpretação não comprovada.
theological_decisions:
- issue: Referente de “tua casa”
  choice: Preservar “tua casa” no texto principal
  alternative: teu templo; teu santuário
  rationale: O contexto aponta provavelmente para o santuário ou templo de Deus, mas o hebraico diz literalmente “tua casa”. A imagem foi mantida, com esclarecimento em nota.
- issue: Valor temporal e aspectual de עוֹד יְהַלְלוּךָ
  choice: continuam a te louvar
  alternative: ainda te louvarão
  rationale: O imperfeito hebraico admite leitura futura ou habitual. Com עוֹד e com os habitantes da casa de Deus como sujeito, a leitura de ação contínua é adequada, mas a possibilidade futura é registrada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A ordem concisa “Felizes os que...” conserva o caráter poético e exclamativo do hebraico.
