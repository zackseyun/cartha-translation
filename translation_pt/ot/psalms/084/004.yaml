  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: pt
  text: Felizes[a] são os que habitam em tua casa[b]; ainda te louvarão[d]. Selá[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como são felizes os que habitam em tua casa” ou “Bem-aventurados”.'
    reason: lexical_alternative
  - marker: b
    text: “Tua casa” provavelmente se refere ao santuário ou templo de Deus.
    reason: cultural_note
  - marker: c
    text: “Selá” é um termo litúrgico ou musical hebraico de significado incerto, tradicionalmente deixado sem tradução.
