  text: 'For the choir director: according to the Gittith[c][b][a]. A psalm of the sons of Korah.'
translation:
  language: pt
  text: 'Ao regente: segundo a Gitite[a]. Salmo dos filhos de Corá.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Gitite; o termo provavelmente indica uma melodia, modalidade ou instrumento musical, mas seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “para os filhos de Corá”; a preposição hebraica pode indicar autoria, associação ou destinação nos títulos dos salmos.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, a forma designa quem dirige a execução musical. “Ao regente” é conciso, natural e não restringe a função à direção de um coro.
- source_word: עַל
  choice: segundo
  rationale: Em rubricas musicais, a preposição pode introduzir uma melodia, modalidade ou instrumento. “Segundo” preserva essa abertura sem especificar indevidamente “com” ou “na melodia de”.
- source_word: הַגִּתִּית
  choice: a Gitite
  rationale: O referente exato é incerto, talvez uma melodia, modalidade ou instrumento musical. A transliteração evita resolver artificialmente a incerteza do hebraico.
- source_word: לִבְנֵי קֹרַח
  choice: dos filhos de Corá
  rationale: A preposição hebraica pode indicar autoria, associação ou destinação. A formulação tradicional e concisa mantém aberta a natureza exata da relação.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo de gênero estabelecido para uma composição musical desse tipo e corresponde naturalmente ao uso português.
