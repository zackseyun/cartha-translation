base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: pt
  text: Ao atravessarem o vale de Baca[a], fazem dele uma fonte; até a chuva temporã[b] o cobre de bênçãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baca pode evocar a palavra hebraica relacionada a “choro”; daí a tradução possível “vale do Choro”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “mestre”. Neste contexto, a palavra hebraica é geralmente entendida como a chuva que chega no começo da estação chuvosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: Ao atravessarem o vale
  rationale: O particípio qal plural descreve os peregrinos em movimento; com a preposição e o substantivo, “atravessarem o vale” expressa naturalmente a passagem pelo lugar.
- source_word: הַבָּכָא
  choice: Baca
  rationale: A transliteração preserva o provável nome de lugar e sua possível evocação do verbo hebraico associado a chorar, sem impor uma interpretação no texto principal.
- source_word: מַעְיָן
  choice: uma fonte
  rationale: O termo designa uma nascente ou fonte de água; “fonte” é claro, corrente e adequado à imagem poética.
- source_word: יְשִׁיתוּהוּ
  choice: eles o transformam
  rationale: O verbo שׁית pode significar pôr, fazer ou tornar; o sufixo masculino singular retoma o vale, que os peregrinos fazem tornar-se uma fonte.
- source_word: גַּם
  choice: até
  rationale: Assinala uma afirmação adicional e intensificadora na progressão poética.
- source_word: בְּרָכוֹת
  choice: de bênçãos
  rationale: A forma vocalizada significa naturalmente “bênçãos”; a expressão conserva a sobreposição poética entre dádiva divina e água vivificante.
- source_word: יַעְטֶה
  choice: cobre
  rationale: O verbo comunica a ideia de cobrir ou revestir; “cobre” mantém a metáfora com clareza.
- source_word: מוֹרֶה
  choice: a chuva temporã
  rationale: No contexto agrícola e hídrico, o termo indica mais provavelmente a primeira chuva da estação; a mesma forma pode significar “mestre”, alternativa registrada em nota.
theological_decisions:
- issue: Interpretação de הַבָּכָא
  choice: Manter “Baca” como nome de lugar
  alternative: “vale do Choro” ou “vale das Lágrimas”
  rationale: O hebraico funciona naturalmente como topônimo, mas pode evocar choro. A transliteração evita resolver indevidamente a ambiguidade, que é indicada em nota.
- issue: Sentido de מוֹרֶה
  choice: Traduzir como “a chuva temporã”
  alternative: “o Mestre”
  rationale: A imagem imediata de fonte, chuva e bênçãos favorece o sentido de chuva sazonal; a alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Chuva temporã” conserva a precisão agrícola e o tom poético; as notas preservam as ambiguidades reais do hebraico.
