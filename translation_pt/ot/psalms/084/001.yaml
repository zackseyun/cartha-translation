  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: pt
  text: Como são amáveis as tuas moradas[a], ó Yahweh dos Exércitos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como são queridas as tuas moradas” ou “Como são agradáveis os teus lugares de habitação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Como
  rationale: Aqui, מַה introduz uma exclamação, não uma pergunta. “Como” reproduz naturalmente essa força poética em português.
- source_word: יְּדִידוֹת
  choice: amáveis
  rationale: O termo expressa aquilo que é amado, querido ou agradável. “Amáveis” conserva a dimensão afetiva e também permite o sentido de encantadoras ou agradáveis.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: as tuas moradas
  rationale: Preserva o plural e o sentido de lugares onde Deus habita, sem restringir a referência apenas ao tabernáculo mosaico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, “Exércitos” mantém a imagem das hostes sob o comando de Yahweh e soa natural e solene em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das hostes
  rationale: “Dos Exércitos” preserva a estrutura do título e comunica com clareza o poder soberano de Yahweh, sem especificar se os exércitos são celestes, terrenos ou cósmicos.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão internacional. A colocação pronominal “as tuas moradas” preserva o tom lírico e solene. O marcador [a] aparece imediatamente após a expressão a que se refere.
