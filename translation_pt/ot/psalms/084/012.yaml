  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: pt
  text: Ó Yahweh dos Exércitos, feliz é quem confia em ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “bem-aventurado é quem confia em ti” ou “afortunado é quem confia em ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva a imagem do título hebraico e corresponde ao uso bíblico corrente em português.
- source_word: אַשְׁרֵי
  choice: feliz é
  rationale: Expressa naturalmente a fórmula exclamativa de bem-aventurança; não se limita a um estado emocional passageiro.
- source_word: אָדָם
  choice: quem
  rationale: O substantivo singular é genérico neste contexto e se refere a qualquer ser humano; 'quem' comunica isso com naturalidade sem restringir o sentido ao sexo masculino.
- source_word: בֹּטֵחַ
  choice: confia
  rationale: O particípio indica uma atitude característica ou contínua de confiança.
- source_word: בָּךְ
  choice: em ti
  rationale: Preserva a preposição e a referência direta a Yahweh na segunda pessoa do singular.
theological_decisions:
- issue: Forma do título יְהוָה צְבָאוֹת
  choice: Ó Yahweh dos Exércitos
  alternative: Ó SENHOR Todo-Poderoso
  rationale: A interjeição 'Ó' explicita o vocativo exigido pelo discurso direto, enquanto 'dos Exércitos' conserva a imagem própria do título hebraico sem convertê-la na interpretação 'Todo-Poderoso'.
- issue: Alcance de אָדָם no singular
  choice: quem
  alternative: o homem
  rationale: Aqui אָדָם tem valor representativo e inclui qualquer pessoa que confie em Yahweh. A formulação escolhida preserva esse alcance universal sem acrescentar uma distinção de sexo que o contexto não enfatiza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O vocativo solene 'Ó' e o pronome 'ti' são naturais na linguagem bíblica e poética. A ordem da frase mantém o paralelismo e a concisão do hebraico.
