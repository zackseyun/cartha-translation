  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: pt
  text: Olha para o nosso escudo[a], ó Deus, e contempla o rosto do teu ungido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso protetor”. O hebraico diz literalmente “nosso escudo”, metáfora poética que pode se referir a Deus como protetor ou ao rei.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico significa “ungido” e está na origem de “Messias”. Aqui, provavelmente se refere primeiro ao rei davídico, embora possa ter uma ressonância messiânica mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: nosso escudo
  rationale: Preserva a imagem concreta do hebraico מָגֵן e não decide se a metáfora designa Deus como protetor ou o rei como defensor do povo.
- source_word: רְאֵה
  choice: olha para
  rationale: No imperativo, o verbo pede atenção favorável, não mera percepção visual; “olha para” comunica a súplica de modo natural e próximo do hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: A interjeição “ó” marca naturalmente o vocativo da oração em português, sem acrescentar conteúdo teológico.
- source_word: וְהַבֵּט
  choice: e contempla
  rationale: O verbo נבט expressa um olhar dirigido e atento. “Contempla” distingue discretamente este verbo do anterior e preserva o paralelismo poético sem soar excessivamente arcaico.
- source_word: פְּנֵי
  choice: o rosto de
  rationale: Mantém a imagem literal de פָּנִים e suas implicações relacionais, em vez de interpretá-la abstratamente como “presença”.
- source_word: מְשִׁיחֶךָ
  choice: teu ungido
  rationale: מָשִׁיחַ significa “ungido” e, no contexto imediato, provavelmente se refere ao rei davídico. A forma sem maiúscula evita impor ao texto uma identificação messiânica específica, sem eliminar sua possível ressonância mais ampla.
theological_decisions:
- issue: Referente de “nosso escudo”
  choice: A metáfora “nosso escudo” foi mantida sem identificar expressamente seu referente.
  alternative: Interpretar o escudo como Deus, o protetor, ou como o rei davídico, defensor do povo.
  rationale: O hebraico admite ambas as leituras e pode colocar intencionalmente “nosso escudo” em paralelo com “teu ungido”. Preservar a metáfora mantém a ambiguidade e a tensão poética.
- issue: Referente de “teu ungido”
  choice: “teu ungido”, em minúscula
  alternative: “teu Messias”
  rationale: No horizonte imediato do salmo, a expressão provavelmente designa o rei davídico ungido. Traduzir por “Messias” ou usar maiúscula especificaria uma leitura cristológica que o hebraico, por si só, não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração acompanha de perto o hebraico; “teu” mantém o tom poético e reverente sem recorrer a linguagem excessivamente arcaica.
