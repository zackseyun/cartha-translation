  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: pt
  text: Minha alma anseia e até desfalece pelos pátios de Yahweh; meu coração e minha carne cantam de alegria ao Deus vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “gritam de alegria”. O verbo hebraico indica um brado ou canto vibrante de júbilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: anseia
  rationale: Expressa desejo intenso; “anseia” é natural, digno e preserva a força afetiva do hebraico.
- source_word: וְגַם כָּלְתָה
  choice: e até desfalece
  rationale: וְגַם intensifica a progressão, e כָּלְתָה descreve a alma consumida ou exaurida pelo anseio. A formulação conserva o crescendo poético.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: É a correspondência direta e tradicional, adequada ao paralelismo posterior com “meu coração e minha carne”.
- source_word: לְחַצְרוֹת
  choice: pelos pátios
  rationale: Designa os espaços ou átrios do recinto do templo. “Pátios” é claro ao leitor contemporâneo e mantém a imagem concreta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לִבִּי וּבְשָׂרִי
  choice: meu coração e minha carne
  rationale: Preserva a combinação hebraica do ser interior com a dimensão corporal, sem reduzi-la interpretativamente a “todo o meu ser”.
- source_word: יְרַנְּנוּ
  choice: clamam
  rationale: O verbo indica um grito sonoro, frequentemente jubiloso. “Clamam” se ajusta ao anseio intenso do contexto, enquanto a nota registra explicitamente o sentido de alegria possível e frequente.
- source_word: אֶל אֵל חָי
  choice: ao Deus vivo
  rationale: Mantém a direção expressa por אֶל (“a/para”) e traduz a conhecida designação bíblica אֵל חָי de modo natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O original emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Valor de יְרַנְּנוּ no contexto de anseio
  choice: clamam
  alternative: cantam de alegria ou gritam de alegria
  rationale: “Clamam” preserva a intensidade da voz dirigida a Deus sem eliminar o possível tom jubiloso, explicitado na nota, nem decidir que o contexto seja exclusivamente súplica ou exclusivamente celebração.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso conserva o paralelismo poético, a progressão emocional e as imagens concretas do hebraico. O marcador [a] foi colocado imediatamente após a expressão a que a nota se refere.
