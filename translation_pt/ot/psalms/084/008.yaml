  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: pt
  text: 'Ó Yahweh[a], Deus dos Exércitos, ouve a minha oração;

    dá ouvidos, ó Deus de Jacó.

    Selá[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino Yahweh, tradicionalmente representado por «SENHOR» em muitas traduções.
    reason: alternative_reading
  - marker: b
    text: «Selá» é um termo litúrgico ou musical hebraico de significado incerto; talvez indique uma pausa ou um interlúdio.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo pelo título «SENHOR».
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Reproduz o título divino de modo corrente e digno em português. «Exércitos» mantém a ideia coletiva de forças organizadas sem explicitar se são celestes, terrestres ou ambas.
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: ouve a minha oração
  rationale: Tradução direta e natural do imperativo שׁמע e do substantivo com sufixo de primeira pessoa.
- source_word: הַאֲזִינָה
  choice: dá ouvidos
  rationale: Preserva a imagem e a variação poética em relação ao verbo anterior, em vez de nivelar os dois pedidos como «ouve».
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Deus de Jacó
  rationale: Tradução transparente da construção hebraica que identifica Deus por sua relação com Jacó.
- source_word: סֶלָה
  choice: Selá
  rationale: A transliteração conserva o termo litúrgico ou musical hebraico, cujo significado exato permanece incerto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico apresenta o nome pessoal, não o título אֲדֹנָי. «Yahweh» preserva essa distinção e evita trocar o nome por um título; a nota registra a convenção tradicional.
- issue: Alcance de צְבָאוֹת no título divino
  choice: Exércitos
  alternative: hostes; exércitos celestes
  rationale: O hebraico pode abranger hostes ou forças sem defini-las aqui. A tradução mantém a amplitude do título e não acrescenta «celestes».
- issue: Sentido de סֶלָה
  choice: Selá
  alternative: pausa; interlúdio
  rationale: Como a função precisa do termo é discutida, a transliteração preserva a ambiguidade em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. «Ó» mantém o vocativo enfático; «dá ouvidos» conserva a expressão figurada e distingue os dois imperativos hebraicos.
