  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: pt
  text: Vão de força em força[a]; cada um se apresenta[b] diante de Deus em Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vão de grupo em grupo” ou “de vitória em vitória”; a palavra hebraica traduzida por “força” também pode indicar vigor, valor ou exército.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aparece a Deus”. O verbo hebraico tem forma passiva, mas, no contexto de peregrinação e culto, provavelmente significa apresentar-se diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Vão
  rationale: O qal imperfeito na terceira pessoa do plural expressa o avanço contínuo dos peregrinos. “Vão” é natural e não especifica indevidamente o modo da jornada.
- source_word: מֵחַיִל אֶל חָיִל
  choice: de força em força
  rationale: חַיִל pode indicar força, vigor, valor ou exército. No contexto da peregrinação, a expressão sugere força renovada ou crescente, preservando ao mesmo tempo a formulação tradicional.
- source_word: יֵרָאֶה
  choice: cada um se apresenta
  rationale: O nifal imperfeito está no singular em meio a um contexto plural, favorecendo sentido distributivo. Em contexto de peregrinação e culto, pode significar apresentar-se diante da divindade.
- source_word: אֶל אֱלֹהִים
  choice: diante de Deus
  rationale: Embora אֶל indique literalmente direção, com o verbo de aparição em contexto cultual a formulação idiomática portuguesa é “diante de Deus”.
- source_word: בְצִיּוֹן
  choice: em Sião
  rationale: Mantém o nome tradicional do lugar e traduz naturalmente a localização do santuário.
theological_decisions:
- issue: Sentido cultual de יֵרָאֶה אֶל אֱלֹהִים
  choice: cada um se apresenta diante de Deus
  alternative: cada um é visto por Deus
  rationale: O nifal de ראה em contexto de peregrinação pode ter o sentido idiomático de comparecer ou apresentar-se para o culto. A nota preserva a leitura passiva gramaticalmente possível sem introduzir uma conclusão teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas acompanha os respectivos pontos do texto, e a construção distributiva “cada um” preserva o singular hebraico no contexto plural.
