  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: pt
  text: Feliz é o homem cuja força está em ti e em cujo coração[a] estão os caminhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no coração deles estão os caminhos”. O sufixo hebraico de “coração” é plural, embora o versículo comece com “o homem” no singular.'
    reason: lexical_alternative
  - marker: b
    text: Os “caminhos” provavelmente são caminhos de peregrinação que levam à habitação de Deus, mas este versículo não diz explicitamente “para Sião”.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz é
  rationale: A forma plural funciona idiomaticamente como fórmula de bem-aventurança. “Feliz é” comunica o sentido com naturalidade e dignidade no português atual.
- source_word: אָדָם
  choice: o homem
  rationale: O substantivo está no masculino singular e tem sentido representativo. “O homem” conserva essa forma do hebraico sem excluir o alcance genérico da afirmação.
- source_word: עֹז
  choice: força
  rationale: Neste contexto, indica vigor ou capacidade encontrados em Deus, e não principalmente uma fortaleza física.
- source_word: לוֹ בָךְ
  choice: cuja força está em ti
  rationale: A construção significa literalmente que há força para ele em Deus. A formulação relativa é natural em português e mantém a ideia de que a força se encontra em Deus.
- source_word: מְסִלּוֹת
  choice: as estradas
  rationale: O termo designa estradas ou caminhos preparados, por vezes elevados. “Estradas” evita acrescentar no texto um destino que o versículo não declara.
- source_word: בִּלְבָבָם
  choice: em cujo coração
  rationale: A redação principal acompanha o “homem” singular de modo natural em português. Uma nota registra que o sufixo hebraico muda para o plural, literalmente “no coração deles”.
theological_decisions:
- issue: Masculino genérico em אָדָם
  choice: o homem
  alternative: a pessoa
  rationale: O hebraico emprega um substantivo masculino singular de alcance representativo. A tradução preserva essa forma sem restringir a verdade do versículo apenas aos homens.
- issue: Destino implícito das מְסִלּוֹת
  choice: as estradas
  alternative: as estradas para Sião
  rationale: O contexto do salmo sugere caminhos de peregrinação rumo à habitação de Deus, mas “para Sião” não aparece neste versículo e, por isso, não foi acrescentado ao texto.
- issue: Mudança do singular para o plural em בִּלְבָבָם
  choice: em cujo coração
  alternative: no coração deles
  rationale: A tradução principal mantém uma frase portuguesa fluente ligada ao singular “o homem”, enquanto a nota conserva a mudança gramatical real e potencialmente significativa do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o tom sapiencial da bem-aventurança, sem explicitar no texto principal elementos apenas inferidos do contexto.
