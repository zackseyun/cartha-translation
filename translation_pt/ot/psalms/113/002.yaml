id: PSA.113.2
reference: Psalms 113:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: pt
  text: 'Seja bendito o nome de Yahweh,

    desde agora e para sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o nome de Yahweh seja bendito.”'
    reason: Alternativa que torna mais explícita a nuance volitiva do jussivo hebraico.
lexical_decisions:
- source_word: יְהִי
  choice: Seja
  rationale: O jussivo qal de היה expressa aqui desejo ou exortação. “Seja” transmite naturalmente em português a força de uma bênção ou convocação, sem convertê-la em simples afirmação.
- source_word: שֵׁם
  choice: nome
  rationale: Mantém o termo hebraico e sua referência à pessoa e reputação representadas pelo nome, sem explicitação indevida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְבֹרָךְ
  choice: bendito
  rationale: O particípio passivo de ברך significa “bendito”. Esta escolha preserva a linguagem de bênção e soa mais idiomática nesta fórmula do que “abençoado”.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Expressa o ponto presente como início de uma duração contínua, em português moderno e natural.
- source_word: וְעַד עוֹלָם
  choice: e para sempre
  rationale: Comunica claramente a duração sem fim indicada pela construção hebraica, evitando formulações arcaicas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Força modal de יְהִי
  choice: Seja bendito
  alternative: É/será bendito
  rationale: A forma jussiva favorece uma bênção, desejo ou exortação, e não uma declaração meramente indicativa. A tradução conserva essa nuance sem determinar mais precisamente se predomina desejo ou convocação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética foi mantida, e “bendito” preserva a formulação tradicional sem arcaísmo excessivo.
