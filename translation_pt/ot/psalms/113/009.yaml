  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: pt
  text: 'Ele dá um lar à mulher estéril

    e a faz alegre mãe de filhos.

    Louvem a Yah![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “Aleluia!”'
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: faz ... habitar
  rationale: O particípio hifil de ישׁב expressa fazer alguém habitar ou estabelecer-se. A formulação preserva o valor causativo e o caráter poético do hebraico.
- source_word: עֲקֶרֶת
  choice: a mulher estéril
  rationale: O substantivo designa uma mulher que não tem filhos. “Estéril” é conciso, tradicional e adequado ao registro poético, sem o tom clínico de “infértil”.
- source_word: הַבַּיִת
  choice: em família
  rationale: Embora a expressão possa ser traduzida literalmente como “na casa”, בית neste contexto admite o sentido de lar ou núcleo familiar. “Habitar em família” comunica naturalmente a reversão do isolamento e se harmoniza com a maternidade mencionada em seguida.
- source_word: אֵם הַבָּנִים
  choice: mãe de filhos
  rationale: בנים pode indicar filhos homens ou descendentes em geral. Aqui, o foco está na passagem da esterilidade à maternidade; “filhos” é natural em português e não restringe necessariamente o sentido a meninos.
- source_word: שְׂמֵחָה
  choice: alegre
  rationale: O adjetivo feminino caracteriza a mãe como alguém que se alegra. “Alegre” é claro, corrente e mantém a concisão poética.
- source_word: הַֽלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: O hebraico combina um imperativo plural com a forma abreviada do nome divino, יָהּ. “Louvem a Yah!” traduz ambos os elementos, em vez de transliterar toda a expressão como “Aleluia”.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ na aclamação final
  choice: Yah
  alternative: Senhor; Aleluia
  rationale: O texto traz יָהּ, não o tetragrama completo. “Yah” preserva essa forma distinta; “Senhor” a confundiria com a convenção usada para YHWH, enquanto “Aleluia” translitera a expressão inteira em vez de traduzi-la.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético em três linhas. “Habitar em família” privilegia a ideia contextual de integração num lar sem ocultar o sentido causativo do verbo. O marcador [a] aparece no texto junto à expressão anotada.
