    rationale: Embora בית possa referir-se à casa ou ao lar enquanto unidade doméstica, “em família” desloca o sentido para relações familiares e deixa de representar a imagem de ser estabelecida num lar/casa. Uma formulação com “lar” preserva melhor a metáfora doméstica e a reversão da esterilidade.
