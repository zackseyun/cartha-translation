  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: pt
  text: que se inclina para contemplar os céus e a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se faz pequeno para contemplar”.'
    reason: Alternativa lexical que representa mais explicitamente o sentido causativo/reflexivo de fazer-se baixo presente em הַמַּשְׁפִּילִי.
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: que se inclina
  rationale: O particípio hifil de שׁפל comunica a imagem de fazer-se baixo ou abaixar-se. No contexto da exaltação de Deus no versículo anterior, “se inclina” preserva de modo natural a metáfora de condescendência, sem sugerir humilhação moral.
- source_word: לִרְאוֹת
  choice: para contemplar
  rationale: O infinitivo construto de ראה expressa finalidade. “Contemplar” transmite o ato intencional de olhar e mantém o registro poético e digno do salmo.
- source_word: בַּשָּׁמַיִם
  choice: os céus
  rationale: שׁמים, de forma plural, designa aqui os céus em sentido cósmico, não apenas o céu visível.
- source_word: וּבָאָרֶץ
  choice: e a terra
  rationale: אָרֶץ forma com “os céus” o par cósmico abrangente. Em português, a preposição regida por “contemplar” pode ficar implícita diante dos dois objetos coordenados.
theological_decisions:
- issue: Descrição antropomórfica da transcendência e condescendência de Deus
  choice: que se inclina para contemplar
  alternative: que se humilha para ver
  rationale: A tradução conserva a imagem concreta de Deus inclinando-se, enfatizando que até os céus estão abaixo daquele que habita nas alturas. Evita reduzir a metáfora a uma afirmação abstrata como “presta atenção” e também evita que “se humilha” seja entendido como degradação moral.
translation_notes:
  register: Português moderno, poético e amplamente inteligível, com boa legibilidade brasileira. “Se inclina” mantém a imagem antropomórfica; “contemplar” dá dignidade ao registro sem soar arcaico.
