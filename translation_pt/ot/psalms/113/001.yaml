source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: pt
  text: Louvem a Yah! Louvem, servos de Yahweh[a]; louvem o nome de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos de Yahweh”. O termo hebraico pode indicar pessoas que servem ou que estão em condição de escravidão; neste contexto de adoração, “servos” se encaixa melhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louvem
  rationale: Imperativo plural do piel de הלל. “Louvem” expressa com clareza o chamado direto e preserva sua repetição enfática no versículo.
- source_word: יָהּ
  choice: Yah
  rationale: Forma abreviada do nome divino. A transliteração “Yah” mantém a distinção formal em relação a יְהוָה nas duas ocorrências seguintes e evidencia a composição de “Aleluia”.
- source_word: עַבְדֵי
  choice: servos
  rationale: Plural construto de עבד. “Servos” é natural no contexto de culto e conserva a ideia de pessoas a serviço e sob a autoridade de Yahweh, sem impor aqui a conotação mais restrita de “escravos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliteração do nome divino, preservando sua ocorrência explícita no hebraico e sua relação, mas não identidade formal, com a forma abreviada Yah.
- source_word: אֶת שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Reprodução natural da construção hebraica, mantendo o nome divino como objeto explícito do louvor.
theological_decisions:
- issue: Distinção entre יָהּ e יְהוָה no mesmo versículo
  choice: Traduzir יָהּ como “Yah” e יְהוָה como “Yahweh”
  alternative: Traduzir ambos por “SENHOR” ou uniformizar ambos como “Yahweh”
  rationale: O hebraico emprega deliberadamente a forma curta Yah na aclamação inicial e o Tetragrama completo nas frases seguintes. A tradução preserva essa distinção sem sugerir deuses diferentes.
- issue: Amplitude semântica de עבד
  choice: “servos”
  alternative: “escravos”
  rationale: O termo pode designar tanto serviço quanto sujeição, mas o contexto é uma convocação cultual dirigida aos que servem a Yahweh. “Servos” é adequado sem eliminar a alternativa lexical, registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “Louvem” conserva o ritmo exortativo do hebraico. “Yah” e “Yahweh” preservam as duas formas do nome divino presentes no texto-fonte.
