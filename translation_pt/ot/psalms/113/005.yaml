  yaml_path: translation/ot/psalms/113/005.yaml
  text: Who is like Yahweh our God[a], who is seated on high[b],
translation:
  language: pt
  text: Quem é como Yahweh, nosso Deus[a], que se assenta nas alturas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico יהוה, aqui transliterado “Yahweh”, é tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “que se eleva para se assentar”; a expressão retrata Yahweh em sua posição exaltada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica sobre a incomparabilidade de Yahweh; “Quem” preserva essa força com naturalidade.
- source_word: כַּ/יהוָה
  choice: é como Yahweh
  rationale: A preposição כְּ expressa comparação, e a cópula “é” é naturalmente suprida em português. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Forma com sufixo de primeira pessoa do plural, em aposição a “Yahweh”.
- source_word: הַמַּגְבִּיהִי
  choice: que se assenta nas alturas
  rationale: O particípio de גבהּ apresenta Deus como aquele que se eleva ou está elevado; em combinação com לָשֶׁבֶת, a formulação comunica sua posição exaltada sem tornar explícito além do texto se a imagem é de trono ou habitação.
- source_word: לָשֶׁבֶת
  choice: se assenta
  rationale: O infinitivo de ישׁב pode significar sentar-se ou habitar. “Assenta-se” preserva a imagem de estar sentado e admite a conotação de entronização.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama diretamente; “Yahweh” preserva o nome pessoal da aliança, enquanto a forma tradicional pode ser informada em nota.
- issue: Sentido da posição elevada de Deus
  choice: que se assenta nas alturas
  alternative: que se eleva para habitar
  rationale: A escolha conserva a imagem de ישׁב e a exaltação expressa por גבהּ, sem decidir rigidamente entre entronização e habitação.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e alcance internacional. A inversão simples da pergunta mantém o tom poético; “nas alturas” reproduz de modo idiomático a exaltação espacial do hebraico.
