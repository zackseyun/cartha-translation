  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: pt
  text: 'Ele ergue o pobre do pó;

    levanta o necessitado do monte de cinzas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do depósito de lixo”. O hebraico אַשְׁפֹּת indica um lugar onde se descartavam ou acumulavam cinzas e resíduos, imagem de extrema humilhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: ergue
  rationale: 'O particípio hifil de קום expressa ação causativa: fazer alguém se levantar. “Ergue” é natural em português e preserva a imagem de reversão da condição humilde.'
- source_word: מֵעָפָר
  choice: do pó
  rationale: עָפָר designa pó ou terra solta, e מִן indica a origem. “Do pó” mantém a imagem concreta de humilhação e condição inferior.
- source_word: דָּל
  choice: o pobre
  rationale: דָּל pode indicar alguém pobre, fraco ou socialmente insignificante. “O pobre” é claro no contexto e conserva as possíveis conotações de vulnerabilidade e baixa posição social.
- source_word: מֵאַשְׁפֹּת
  choice: do monte de cinzas
  rationale: אַשְׁפֹּת refere-se a um lugar onde se acumulam cinzas ou resíduos. “Monte de cinzas” preserva a imagem bíblica concreta; a alternativa “depósito de lixo” é registrada em nota.
- source_word: יָרִים
  choice: levanta
  rationale: O hifil de רום significa levantar ou elevar. “Levanta” forma um paralelismo natural com “ergue” sem antecipar a ideia mais explícita de exaltação presente no versículo seguinte.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: אֶבְיוֹן denota quem se encontra em necessidade ou indigência. “O necessitado” distingue o termo de דָּל, mantendo ao mesmo tempo a sobreposição semântica do paralelismo.
theological_decisions:
- issue: Imagens antropológicas e sociais
  choice: Preservar a linguagem concreta de reversão social
  alternative: Generalizar o versículo como referência à humildade espiritual ou à exaltação divina em sentido amplo
  rationale: O hebraico emprega imagens materiais vívidas — “pó” e “monte de cinzas” — e categorias sociais — “pobre” e “necessitado”. A tradução mantém esses elementos sem os espiritualizar, preservando a possibilidade de aplicações teológicas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. A ordem dos constituintes foi ajustada para maior naturalidade em português, sem perder as imagens concretas nem a distinção entre “pobre” e “necessitado”.
