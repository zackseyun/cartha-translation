  text: to seat him with nobles[b][a], with the nobles of his people.
translation:
  language: pt
  text: para fazê-lo sentar-se com os nobres[a], com os nobres do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “príncipes”; o termo hebraico pode designar nobres ou pessoas de posição principesca.
    reason: lexical_alternative
  - marker: b
    text: Em “seu povo”, “seu” provavelmente se refere ao SENHOR; também pode referir-se ao homem que foi levantado.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: para fazê-lo sentar-se
  rationale: O infinitivo causativo de ישׁב com לְ expressa propósito ou resultado em continuidade com o versículo anterior. A formulação preserva tanto o valor causativo quanto o objeto masculino singular, referente ao necessitado levantado no v. 7.
- source_word: עִם
  choice: com
  rationale: Traduz diretamente a preposição e mantém a imagem de ser colocado na companhia de pessoas de posição elevada; sua repetição também é preservada.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: os nobres
  rationale: Neste contexto social, נָדִיב designa pessoas de posição elevada ou principesca. “Nobres” comunica essa condição sem restringir o sentido a filhos de reis nem sugerir apenas generosidade moral.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עַם normalmente denota um povo ou comunidade. “Seu povo” é natural em português e conserva a possível ambiguidade gramatical do possessivo.
theological_decisions:
- issue: Referente de “seu” em “seu povo”
  choice: Manter “seu povo” no texto, entendendo contextualmente que o possessivo provavelmente se refere ao SENHOR.
  alternative: O possessivo pode referir-se ao homem pobre que foi levantado.
  rationale: O SENHOR é o agente das ações nos versículos circundantes, o que favorece a referência ao povo dele; contudo, a forma hebraica também permite ligar o sufixo ao homem levantado. A nota preserva essa possibilidade sem resolver além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “com os nobres” reproduz o paralelismo enfático do hebraico. “Fazê-lo sentar-se” conserva explicitamente o sentido causativo, embora seja um pouco mais formal que “dar-lhe um lugar”.
