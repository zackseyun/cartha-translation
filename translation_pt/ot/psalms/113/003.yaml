source:
  edition: WLC
  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: pt
  text: Desde o nascer do sol até o seu pôr[a], o nome de Yahweh[b] deve ser louvado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Desde o leste até o oeste”; literalmente, “desde o nascer do sol até o seu pôr”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: Desde o nascer do sol
  rationale: מִזְרַח pode indicar o leste ou o nascer; em paralelo com מְבוֹאוֹ e seguido de שֶׁמֶשׁ, a expressão poética “o nascer do sol” preserva melhor a imagem hebraica.
- source_word: מְבוֹאוֹ
  choice: até o seu pôr
  rationale: O substantivo significa literalmente a entrada ou ida para dentro, com o sufixo remetendo ao sol; “seu pôr” comunica naturalmente o pôr do sol e mantém o merismo poético.
- source_word: מְהֻלָּל
  choice: deve ser louvado
  rationale: O particípio passivo pode significar “louvado” ou “digno de louvor”. “Deve ser louvado” conserva a afirmação geral e sua força de convocação, sem convertê-la em imperativo direto.
- source_word: שֵׁם
  choice: o nome
  rationale: A tradução literal preserva a amplitude hebraica de nome como identidade revelada, reputação e pessoa conhecida na adoração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto a nota registra a forma tradicional por título.
- issue: Força de מְהֻלָּל no contexto
  choice: deve ser louvado
  alternative: é louvado; seja louvado
  rationale: A formulação mantém juntas a ideia descritiva de dignidade de louvor e a nuance normativa de convocação, sem impor um imperativo que não está expresso na forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética do hebraico foi preservada, e “pôr” retoma naturalmente “sol” sem repetição desnecessária.
