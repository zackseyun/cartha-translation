  text: רָ֖ם עַל כָּל גּוֹיִ֥ם יְהוָ֑ה עַ֖ל הַ/שָּׁמַ֣יִם כְּבוֹדֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: pt
  text: 'Yahweh está exaltado acima de todas as nações;

    sua glória está acima dos céus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: está exaltado
  rationale: O adjetivo predicativo indica altura e exaltação. “Está exaltado” soa natural e digno em português e comunica a supremacia de Yahweh, preservando a imagem vertical reforçada por “acima”.
- source_word: עַל כָּל גּוֹיִם
  choice: acima de todas as nações
  rationale: עַל expressa aqui elevação e superioridade. “Acima de todas as nações” mantém o paralelismo com “acima dos céus” e não reduz a afirmação apenas à ideia de governo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל הַשָּׁמַיִם
  choice: acima dos céus
  rationale: No contexto poético, שָׁמַיִם é adequadamente traduzido por “céus”. A repetição de “acima” reproduz o paralelismo hebraico e enfatiza a transcendência.
- source_word: כְּבוֹדוֹ
  choice: sua glória
  rationale: כָּבוֹד pode denotar glória, honra ou majestade. “Sua glória” é claro e apropriado ao contexto de louvor, sem restringir indevidamente o campo semântico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no corpo do versículo, enquanto “SENHOR” o substituiria por um título; “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A disposição em dois versos destaca o paralelismo poético do hebraico.
