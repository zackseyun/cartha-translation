  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: pt
  text: 'Ao regente. De Davi.[a] Salmo.


    Ó Deus do meu louvor, não fiques em silêncio.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por Davi”, “Para Davi” ou “A Davi”; o título hebraico é ambíguo.
    reason: alternative_reading
  - marker: b
    text: Ou “não te cales”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente o responsável pela execução musical. “Ao regente” é conciso, atual e não restringe necessariamente a função à direção de um coro.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição ל nos títulos dos salmos pode indicar autoria, dedicação ou associação. “De Davi” mantém em português parte dessa abertura sem impor exclusivamente a ideia de autoria.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente tradicional, claro e preciso para a designação hebraica do gênero.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ó Deus do meu louvor
  rationale: Preserva a construção hebraica compacta e sua possível riqueza de sentido, em vez de explicá-la apenas como “Deus a quem louvo”.
- source_word: אַל תֶּחֱרַשׁ
  choice: não fiques em silêncio
  rationale: Expressa naturalmente a súplica urgente para que Deus não permaneça calado ou sem responder.
theological_decisions:
- issue: Sentido do título לְדָוִד
  choice: Manter “De Davi” no texto principal
  alternative: “Por Davi”, “Para Davi” ou “A Davi”
  rationale: O hebraico permite autoria, dedicação ou associação; a tradução evita transformar essa construção ambígua numa afirmação inequívoca de autoria.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em outros contextos lusófonos. O vocativo “Ó” conserva o tom de oração; “regente” evita formulação arcaica e não pressupõe especificamente um coro.
