  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: pt
  text: porque não se lembrou de agir com bondade,[a] mas perseguiu o pobre e necessitado e o de coração quebrantado,[b] para matá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de praticar misericórdia”. O hebraico חָסֶד também pode transmitir a ideia de amor leal ou fidelidade à aliança, mas aqui se refere à bondade concreta para com pessoas vulneráveis.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o homem pobre e necessitado e o quebrantado de coração”. O singular provavelmente tem sentido representativo, descrevendo o tipo de pessoa que ele perseguia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: porque
  rationale: A expressão introduz a causa do juízo descrito no contexto; “porque” preserva de modo natural sua força causal.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: não se lembrou de agir com bondade
  rationale: זָכַר com infinitivo indica não ter em mente algo de modo que se aja; חֶסֶד, neste contexto de tratamento dos vulneráveis, refere-se concretamente à bondade, sem excluir suas possíveis nuances de misericórdia e lealdade.
- source_word: וַיִּרְדֹּף
  choice: mas perseguiu
  rationale: “Perseguiu” mantém a imagem verbal de ir atrás de alguém com hostilidade, enquanto “mas” explicita o contraste contextual entre não agir com bondade e atacar ativamente o vulnerável.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: o pobre e necessitado
  rationale: A formulação conserva o singular representativo e a dupla caracterização da vulnerabilidade, com redação portuguesa natural.
- source_word: וְנִכְאֵה לֵבָב
  choice: o de coração quebrantado
  rationale: A expressão representa literalmente alguém esmagado ou abatido no coração; “de coração quebrantado” é corrente, digna e preserva a dimensão interior.
- source_word: לְמוֹתֵת
  choice: para matá-lo
  rationale: O infinitivo expressa a finalidade ou o resultado visado pela perseguição. O pronome singular preserva a forma representativa dos termos hebraicos anteriores.
