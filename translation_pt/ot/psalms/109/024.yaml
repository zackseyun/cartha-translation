  yaml_path: translation/ot/psalms/109/024.yaml
  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: pt
  text: Meus joelhos fraquejam por causa do jejum, e minha carne definha por falta de gordura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «minha carne ficou sem gordura». A expressão hebraica descreve a perda de gordura corporal, isto é, o emagrecimento extremo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: meus joelhos
  rationale: O plural com sufixo de primeira pessoa tem aqui o sentido anatômico comum e preserva a imagem concreta da fraqueza física.
- source_word: כָּשְׁלוּ
  choice: fraquejam
  rationale: O verbo expressa tropeçar, vacilar ou falhar; aplicado aos joelhos, «fraquejam» comunica de modo natural que eles cedem por debilidade.
- source_word: מִצּוֹם
  choice: de tanto jejuar
  rationale: A preposição indica a causa da fraqueza. Esta formulação corrente em português preserva o jejum explícito e evita sugerir apenas falta involuntária de alimento.
- source_word: וּבְשָׂרִי
  choice: e minha carne
  rationale: Mantém o termo corporal concreto בשר, em vez de substituí-lo pelo mais geral «corpo».
- source_word: כָּחַשׁ
  choice: definha
  rationale: O verbo indica tornar-se magro, consumido ou emagrecido; «definha» transmite a perda progressiva de vigor e massa corporal no lamento.
- source_word: מִשָּׁמֶן
  choice: por falta de gordura
  rationale: No contexto, a expressão aponta para a perda ou ausência de gordura corporal, isto é, para a emaciação. A formulação torna o idioma hebraico inteligível sem apagar sua imagem concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Fraquejam» e «definha» conservam o paralelismo corporal e a intensidade poética do lamento; a nota registra a forma mais literal da expressão final.
