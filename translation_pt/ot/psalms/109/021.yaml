  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: pt
  text: Mas tu, ó Yahweh, meu Senhor[a], age em meu favor por causa do teu nome[b]; livra-me, pois o teu amor leal[c] é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ó Yahweh, meu Senhor”. O texto emprega em sequência o nome divino יְהוָה (YHWH) e o título אֲדֹנָי (“meu Senhor”).'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “faze comigo”. No contexto da súplica, a expressão pode significar “age comigo” ou “age em meu favor”.'
    reason: lexical_alternative
  - marker: c
    text: “Amor leal” traduz חֶסֶד, termo que também pode ser traduzido por “amor constante”, “misericórdia” ou “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas tu
  rationale: O pronome enfático, ligado pela conjunção, estabelece contraste com os adversários mencionados no contexto anterior.
- source_word: יְהוָה אֲדֹנָי
  choice: ó Yahweh, meu Senhor
  rationale: Mantém em sequência o nome divino YHWH e o título אֲדֹנָי, incluindo a relação pessoal expressa pela forma tradicionalmente lida como “meu Senhor”.
- source_word: עֲשֵׂה אִתִּי
  choice: age em meu favor
  rationale: O sentido básico é “faze comigo”, mas, nesta súplica, a expressão pede uma intervenção favorável. A formulação portuguesa é clara sem especificar a forma dessa ação.
- source_word: לְמַעַן שְׁמֶךָ
  choice: por causa do teu nome
  rationale: Expressa o apelo ao nome, isto é, à identidade, ao caráter e à reputação de Deus, sem substituir a imagem hebraica.
- source_word: חַסְדְּךָ
  choice: teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso duradouro. “Amor leal” é atual, compreensível e preserva essa amplitude.
- source_word: הַצִּילֵנִי
  choice: livra-me
  rationale: O hifil de נצל pede que alguém seja retirado do perigo. “Livra-me” conserva o registro de oração e não define além do texto a natureza do perigo.
theological_decisions:
- issue: A dupla invocação יְהוָה אֲדֹנָי
  choice: ó Yahweh, meu Senhor
  alternative: ó SENHOR Deus; ó Senhor Yahweh
  rationale: A tradução mantém distintos o nome próprio divino e o título, em vez de fundi-los ou trocar sua ordem. A nota registra a forma hebraica para que a tradição textual permaneça transparente.
- issue: O alcance teológico de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; fidelidade à aliança
  rationale: “Amor leal” comunica afeto e fidelidade sem restringir o termo exclusivamente a uma formulação de aliança nem reduzi-lo apenas à compaixão.
- issue: A relação causal introduzida por כִּי
  choice: livra-me, pois o teu amor leal é bom
  alternative: porque o teu amor leal é bom, livra-me
  rationale: A ordem foi ajustada para produzir português natural, preservando a bondade do amor leal de Deus como fundamento explícito do pedido de livramento.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural para leitores brasileiros e compreensão internacional. A inversão da última oração preserva a relação causal e evita uma construção pesada, enquanto “livra-me” mantém o tom poético e devocional do salmo.
