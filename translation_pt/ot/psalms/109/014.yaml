  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: pt
  text: Que a culpa de seus pais[a] seja lembrada diante de Yahweh, e que o pecado de sua mãe não seja apagado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a iniquidade de seus antepassados”. O hebraico pode indicar iniquidade, culpa ou a responsabilidade decorrente do pecado; literalmente, “seus pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: seja lembrada
  rationale: O nifal imperfeito tem força volitiva neste contexto imprecatório; a construção passiva preserva a forma hebraica.
- source_word: עֲוֺן
  choice: culpa
  rationale: עָוֹן pode indicar iniquidade, culpa ou a responsabilidade decorrente do pecado. Aqui, “culpa” expressa adequadamente aquilo que deve permanecer na memória diante de Deus.
- source_word: אֲבֹתָיו
  choice: seus pais
  rationale: Reproduz de perto o hebraico literalmente plural “pais”, que neste contexto pode designar os antepassados masculinos; a possibilidade mais ampla é indicada em nota.
- source_word: אֶל יְהוָה
  choice: diante de Yahweh
  rationale: Com o verbo “lembrar”, a preposição אֶל pode comunicar que a culpa permaneça presente perante Deus. O nome divino é transliterado como “Yahweh”.
- source_word: וְחַטַּאת
  choice: e ... o pecado
  rationale: חַטָּאת designa aqui o pecado, não uma oferta pelo pecado, em paralelo com עָוֹן.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Tradução direta do substantivo com sufixo possessivo.
- source_word: אַל תִּמָּח
  choice: não seja apagado
  rationale: A forma expressa um desejo negativo. “Apagado” conserva a imagem de eliminar algo de um registro e forma um contraste natural com “lembrada”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde à forma adotada na camada de consulta fornecida.
- issue: Responsabilidade associada aos antepassados
  choice: Preservar a imprecação sem explicar como a culpa ancestral se relaciona com o descendente
  alternative: Reformular o verso como punição direta do filho pelos pecados dos pais
  rationale: O hebraico pede que a culpa dos pais seja lembrada diante de Yahweh, mas não explicita aqui os mecanismos ou limites da responsabilidade. A tradução mantém essa tensão sem acrescentar uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e claro, com sintaxe paralela próxima do hebraico. “Seja lembrada” e “não seja apagado” preservam o contraste entre memória e eliminação de um registro. O possessivo “seus” tem como referente o homem mencionado no contexto do salmo.
