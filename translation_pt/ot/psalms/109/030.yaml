  text: א֘וֹדֶ֤ה יְהוָ֣ה מְאֹ֣ד בְּ/פִ֑/י וּ/בְ/ת֖וֹךְ רַבִּ֣ים אֲהַֽלְלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: pt
  text: Agradecerei muito a Yahweh com a minha boca; no meio de muitos[a], eu o louvarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, publicamente, em meio a uma multidão.
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: Agradecerei
  rationale: O hifil de ידה, neste contexto de culto e em paralelo com “louvarei”, expressa agradecimento. “Agradecerei” é direto e natural em português.
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Representa o nome divino יהוה como nome próprio, conforme o testemunho direto do texto hebraico.
- source_word: מְאֹ֣ד
  choice: muito
  rationale: Mantém de modo natural o valor adverbial intensificador do hebraico, qualificando o ato de agradecer.
- source_word: בְּ/פִ֑/י
  choice: com a minha boca
  rationale: A preposição indica o meio ou instrumento do agradecimento e conserva a concretude da expressão hebraica.
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: no meio de muitos
  rationale: Reproduz a expressão espacial e comunitária sem acrescentar “assembleia”, termo não explícito no hebraico.
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: eu o louvarei
  rationale: O piel de הלל significa “louvar”; o sufixo masculino singular retoma Yahweh. O pronome explícito “eu” favorece o ritmo e destaca o paralelismo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituir o nome por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A formulação “Agradecerei muito” comunica naturalmente a intensidade de מְאֹד, enquanto “com a minha boca” mantém a imagem concreta do hebraico.
