  source_fidelity: A tradução preserva com precisão o contraste central entre a maldição dos adversários e a bênção de Deus. «Eles podem amaldiçoar» comunica de modo aceitável a nuance concessiva possível de יְקַלְלוּ, e a nota mantém a alternativa volitiva/permissiva. «Eles se levantam» não introduz indevidamente a ideia de ataque, e «ficam envergonhados» traduz adequadamente a vergonha/desonra expressa por וַיֵּבֹשׁוּ.
  naturalness: O português é moderno, claro e poeticamente sóbrio. A sequência «tu abençoarás» / «o teu servo se alegrará» é coerente com o tratamento por «tu» e tem boa legibilidade internacional, incluindo o Brasil. «Ficam envergonhados» é uma formulação natural e evita especificar se a vergonha é interna ou pública.
  terminology: «Amaldiçoar» e «abençoar» conservam o contraste lexical do hebraico. «Teu servo» é a designação humilde apropriada do orador e não impõe uma leitura messiânica. As notas são fiéis às alternativas e aos limites semânticos do texto.
