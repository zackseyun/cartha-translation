  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: pt
  text: Eles podem amaldiçoar[a], mas tu abençoarás. Eles se levantam e ficam envergonhados[b], mas o teu servo se alegrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Que eles amaldiçoem, mas abençoa tu», entendendo os imperfeitos iniciais em sentido mais volitivo ou permissivo.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «Eles se levantam e ficam envergonhados». O verbo pode sugerir uma ação hostil, mas o texto diz apenas que eles «se levantam».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: Eles podem amaldiçoar
  rationale: O imperfeito piel pode ter valor futuro, habitual ou concessivo/permissivo. Neste paralelismo adversativo, «podem amaldiçoar» preserva naturalmente a força concessiva sem transformar o verbo em uma ordem.
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome independente enfatiza e contrasta os adversários com Deus. O sujeito explícito em português comunica esse contraste sem a ênfase excessiva de «eles mesmos».
- source_word: וְ/אַתָּה
  choice: mas tu
  rationale: Embora a conjunção seja formalmente «e», aqui seu sentido é adversativo, contrapondo a maldição dos inimigos à bênção de Deus.
- source_word: תְבָ֫רֵךְ
  choice: abençoarás
  rationale: O imperfeito piel na segunda pessoa do singular aponta para a ação de Deus em contraste com a dos adversários; o futuro é natural no fluxo do verso.
- source_word: קָ֤מוּ
  choice: Eles se levantam
  rationale: O qal perfeito de קום significa literalmente levantar-se ou pôr-se de pé. O contexto pode sugerir ação hostil, mas o texto não diz explicitamente que atacam.
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: e ficam envergonhados
  rationale: בוש expressa vergonha, humilhação ou desonra. «Ficam envergonhados» comunica o estado resultante sem especificar além do hebraico se a vergonha é apenas interior ou pública.
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: mas o teu servo
  rationale: A expressão significa «teu servo» e funciona como autodesignação humilde do salmista. A conjunção recebe sentido adversativo por contrastar sua alegria com a vergonha dos adversários.
- source_word: יִשְׂמָֽח
  choice: se alegrará
  rationale: O imperfeito qal de שמח indica alegria; o futuro acompanha o movimento resultativo do verso e forma contraponto à vergonha dos inimigos.
theological_decisions:
- issue: Referente de «teu servo»
  choice: O orador refere-se humildemente a si mesmo diante de Deus como «teu servo».
  alternative: Uma figura mais genérica do servo justo.
  rationale: No contexto imediato do salmo, a expressão funciona como autodesignação do salmista em oração. A tradução mantém o sentido direto sem impor uma identificação messiânica que este verso, por si só, não exige.
- issue: Força modal dos verbos iniciais
  choice: 'Leitura concessiva: «Eles podem amaldiçoar, mas tu abençoarás».'
  alternative: 'Leitura volitiva ou permissiva: «Que eles amaldiçoem, mas abençoa tu».'
  rationale: A forma verbal hebraica admite mais de uma nuance contextual. A leitura concessiva se encaixa bem no contraste, enquanto a nota preserva a alternativa volitiva sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes («tu», «abençoarás», «teu»). «Amaldiçoar» e «abençoar» preservam o contraste lexical central. A formulação mantém a ambiguidade modal do início em nota e evita explicitar um ataque que o verbo hebraico não declara.
