  text: They repaid me evil for good[a], and hatred for my love.
translation:
  language: pt
  text: Retribuíram-me o mal pelo bem[a] e o ódio pelo meu amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Puseram contra mim o mal em lugar do bem.” O verbo hebraico significa literalmente “pôr” ou “colocar”, mas aqui provavelmente tem o sentido de dar algo em retribuição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Retribuíram-me
  rationale: Embora שׂוּם signifique literalmente “pôr/colocar”, a construção com עָלַי e as duas expressões com תַּחַת indica aqui troca ou retribuição. “Retribuíram-me” comunica esse valor de modo natural e preserva o paralelismo.
- source_word: עָלַי
  choice: -me
  rationale: O sentido literal é “sobre mim/contra mim”, mas o pronome objeto ligado a “retribuíram” expressa naturalmente em português a pessoa que recebe essa retribuição.
- source_word: רָעָה
  choice: o mal
  rationale: “O mal” preserva tanto a dimensão moral quanto o caráter hostil do termo, sem restringi-lo apenas a dano físico.
- source_word: תַּחַת
  choice: pelo
  rationale: A preposição marca substituição ou troca. Na fórmula portuguesa “o mal pelo bem”, “pelo” exprime concisamente aquilo que foi correspondido com o mal.
- source_word: טוֹבָה
  choice: bem
  rationale: Mantém a amplitude do hebraico e a oposição poética direta entre mal e bem.
- source_word: וְשִׂנְאָה
  choice: e o ódio
  rationale: O substantivo abstrato “ódio” corresponde diretamente ao hebraico e forma um paralelo nominal equilibrado com “meu amor”.
- source_word: אַהֲבָתִי
  choice: meu amor
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa; evita explicitar indevidamente “o amor que demonstrei”, embora esse sentido seja possível no contexto.
