  text: Tornei-me motivo de desprezo para eles; quando me veem, balançam a cabeça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: Tornei-me
  rationale: Expressa naturalmente a mudança de condição indicada pelo perfeito de היה, em vez de apenas um estado presente.
- source_word: חֶרְפָּה
  choice: motivo de desprezo
  rationale: Comunica que o salmista passou a ser alvo de desonra e escárnio; é mais idiomático em português atual do que o substantivo isolado “opróbrio”.
- source_word: יְנִיעוּן רֹאשָׁם
  choice: balançam a cabeça
  rationale: Reproduz o gesto hebraico de zombaria ou reprovação sem acrescentar explicitamente uma interpretação ao texto.
theological_decisions:
- issue: Valor temporal de הָיִיתִי
  choice: Tornei-me
  alternative: Tenho sido / tornei-me e continuo sendo
  rationale: O perfeito admite relação com um estado resultante, mas o verso não exige explicitar essa continuidade. A tradução preserva o acontecimento descrito sem ampliar sua força aspectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém o paralelismo e não explicita o sentido simbólico do gesto de balançar a cabeça.
