base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: pt
  text: Esta é a retribuição[a] dos meus acusadores, da parte de Yahweh, e dos que falam mal contra a minha vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obra” ou “feito”. Neste contexto, o termo pode indicar a recompensa ou retribuição destinada aos adversários; “meus acusadores” também pode ser traduzido por “meus adversários”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “contra a minha alma”. Aqui, “alma” pode significar a própria pessoa ou a vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta é
  rationale: O demonstrativo feminino singular abre uma oração nominal; em português, a cópula implícita é expressa naturalmente por “é”.
- source_word: פְּעֻלַּת
  choice: retribuição
  rationale: Embora o sentido básico seja “obra” ou “feito”, no contexto a palavra designa aquilo que é dado ou efetuado em resposta à conduta dos adversários. “Retribuição” comunica melhor esse valor contextual.
- source_word: שֹׂטְנַי
  choice: meus acusadores
  rationale: O termo pode designar adversários ou acusadores. Como o salmo destaca acusações e ataques verbais, “acusadores” preserva adequadamente a dimensão forense.
- source_word: מֵאֵת
  choice: que vem de
  rationale: A preposição indica origem ou agência. A formulação explicita em português que Yahweh é a fonte da retribuição sem alterar a relação sintática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהַדֹּבְרִים
  choice: e para os que falam
  rationale: Mantém a conjunção hebraica e apresenta o segundo grupo paralelamente aos “acusadores”, sem decidir que seja apenas uma explicação do primeiro.
- source_word: רָע
  choice: o mal
  rationale: Conserva a força moral do substantivo/adjetivo hebraico no contexto de fala hostil.
- source_word: עַל נַפְשִׁי
  choice: contra a minha vida
  rationale: נֶפֶשׁ pode indicar alma, pessoa ou vida. Aqui “vida” transmite a pessoa ameaçada no contexto, evitando a leitura moderna restrita de “alma” como parte imaterial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino pessoal. “Yahweh” preserva esse nome por transliteração, sem substituí-lo por um título.
- issue: Valor declarativo ou volitivo da oração nominal
  choice: Esta é
  alternative: Seja esta
  rationale: A oração nominal, isoladamente, é naturalmente declarativa. O contexto imprecatório pode favorecer uma nuance volitiva, mas ela não é marcada gramaticalmente neste versículo; por isso, a tradução principal não a impõe.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “que vem de Yahweh” torna natural a indicação hebraica de origem; “falam o mal” preserva deliberadamente a força e a relativa abertura da expressão original.
