  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: pt
  text: Que seus filhos andem vagando e mendiguem; que procurem em meio às suas ruínas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que procurem longe de suas ruínas», entendendo a preposição hebraica como indicação de afastamento, e não do âmbito ou da procedência da busca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנ֤וֹעַ יָנ֣וּעוּ
  choice: vivam vagando
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a ideia verbal de נוע. A construção «vivam vagando» transmite movimento contínuo ou repetido e, no contexto imprecatório, funciona naturalmente como desejo.
- source_word: בָנָיו
  choice: os seus filhos
  rationale: בנים pode designar especificamente filhos homens ou, de modo mais amplo, os filhos de alguém. «Filhos» preserva a expressão familiar sem acrescentar uma delimitação ausente do contexto.
- source_word: וְשִׁאֵלוּ
  choice: e mendiguem
  rationale: Embora שאל normalmente signifique «pedir», o contexto de errância e desolação favorece o sentido de pedir esmola ou mendigar.
- source_word: וְדָרְשׁוּ
  choice: que procurem sustento
  rationale: דרש significa «buscar, procurar». O objeto não é expresso no hebraico; «sustento» explicita com moderação aquilo que o contexto de mendicância sugere e produz uma frase natural em português.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: entre as suas ruínas
  rationale: חרבות designa ruínas ou lugares devastados. Neste contexto, מן pode indicar o âmbito ou lugar de onde se busca algo; «entre as suas ruínas» oferece uma formulação portuguesa inteligível, enquanto a leitura separativa é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A formulação mantém o paralelismo imprecatório e a intensidade da errância. «Sustento» é uma explicitação contextual, não um termo expresso no hebraico; a ambiguidade da preposição מן é registrada em nota.
