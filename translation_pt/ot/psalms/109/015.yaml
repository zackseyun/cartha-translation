  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: pt
  text: Que eles estejam continuamente diante de Yahweh, e que ele elimine da terra[a] a memória deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do país”; o hebraico אֶרֶץ pode referir-se à terra em sentido amplo ou a uma região ou país, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Estejam eles
  rationale: O imperfeito qal na terceira pessoa do plural tem força volitiva neste contexto imprecatório; a forma portuguesa preserva o sentido de desejo ou oração.
- source_word: נֶגֶד
  choice: diante de
  rationale: Expressa presença perante alguém e mantém a possível conotação relacional ou judicial do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Comunica duração constante em registro solene e natural.
- source_word: וְיַכְרֵת
  choice: e que ele apague
  rationale: O imperfeito hifil é entendido com força volitiva, em paralelo com a oração anterior. No contexto da memória, “apague” comunica de modo natural a ideia de eliminar ou extinguir.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou país; o texto principal usa a opção abrangente e a nota preserva a alternativa.
- source_word: זִכְרָם
  choice: a memória deles
  rationale: Refere-se à lembrança ou memória deixada por eles; a formulação é clara e conserva a imagem hebraica.
theological_decisions:
- issue: Força imprecatória/volitiva dos verbos
  choice: 'Traduzir os dois verbos como desejos ou pedidos: “Estejam eles... e que ele apague...”'
  alternative: “Eles estarão continuamente diante de Yahweh, e ele apagará da terra a memória deles.”
  rationale: O contexto é de oração imprecatória, e os imperfeitos hebraicos admitem naturalmente força jussiva. A tradução preserva essa retórica sem transformá-la em mera previsão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada sem eliminar o paralelismo nem a severidade da imprecação.
