  text: תַּֽחַת אַהֲבָתִ֥/י יִשְׂטְנ֗וּ/נִי וַ/אֲנִ֥י תְפִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: pt
  text: Em troca do meu amor, eles me acusam; eu, porém, sou oração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «mas eu oro» ou «mas eu sou homem de oração». O hebraico diz literalmente: «mas eu sou oração».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Em troca de
  rationale: Neste contexto, introduz a ideia de retribuição ou troca adversa, não o sentido espacial de «debaixo de». «Em troca de» é direto e natural em português.
- source_word: אַהֲבָתִי
  choice: meu amor
  rationale: Preserva de modo direto o substantivo hebraico e sua ligação com o vocabulário bíblico comum do amor.
- source_word: יִשְׂטְנוּנִי
  choice: eles me acusam
  rationale: O verbo pode indicar agir como adversário, opor-se ou acusar. «Acusam» conserva bem sua possível nuance forense e adversarial neste contexto.
- source_word: וַאֲנִי
  choice: eu, porém
  rationale: Embora a conjunção seja formalmente «e», aqui o contexto expressa contraste; «porém» torna essa relação clara em português corrente.
- source_word: תְפִלָּה
  choice: sou oração
  rationale: 'Mantém a formulação nominal, comprimida e marcante, do hebraico: literalmente, «eu [sou] oração», sem resolver a expressão em uma paráfrase verbal.'
theological_decisions:
- issue: Força idiomática da oração nominal וַאֲנִי תְפִלָּה
  choice: Preservar no texto principal a expressão «eu, porém, sou oração».
  alternative: «mas eu oro» ou «mas eu sou homem de oração»
  rationale: A formulação hebraica é deliberadamente concisa e admite mais de uma explicitação. Manter o substantivo preserva sua intensidade e sua ambiguidade genuína; a nota oferece leituras mais explícitas sem impor uma delas ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum «sou oração» é mantida intencionalmente por refletir a concisão poética do hebraico; a inversão «eu, porém» reforça o contraste sem arcaísmo.
