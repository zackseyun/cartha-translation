source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: pt
  text: Não haja quem lhe estenda bondade[a], nem quem mostre favor aos seus filhos órfãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem continue a tratá-lo com misericórdia”; a expressão hebraica fala literalmente em “prolongar” ou “estender” bondade.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode referir-se especificamente a crianças sem pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: estenda
  rationale: O particípio de משׁך significa literalmente “puxar” ou “prolongar”; com חָסֶד, a expressão indica estender ou continuar a bondade para com alguém. “Estenda” preserva a imagem e soa natural em português.
- source_word: חָסֶד
  choice: bondade
  rationale: Neste contexto, designa bondade misericordiosa ou leal demonstrada por uma pessoa. “Bondade” é clara e evita restringir indevidamente o termo a uma formulação exclusivamente pactual.
- source_word: חוֹנֵן
  choice: mostre favor
  rationale: חנן comunica a ideia de conceder graça, favor ou misericórdia. “Mostre favor” mantém o sentido interpessoal e é natural no português moderno.
- source_word: יְתוֹמָיו
  choice: seus filhos órfãos
  rationale: יָתוֹם designa o órfão, muitas vezes especificamente uma criança sem pai. Como o sufixo os relaciona ao homem mencionado, “seus filhos órfãos” explicita naturalmente essa relação.
- source_word: אַל יְהִי
  choice: Não haja
  rationale: A construção jussiva negativa expressa um desejo ou pedido de que tal pessoa não exista. “Não haja” conserva de maneira concisa a força imprecatória.
theological_decisions:
- issue: Preservação do pedido imprecatório sem suavizar sua força
  choice: “Não haja quem...” como pedido direto
  alternative: 'Traduzir como previsão descritiva: “Não haverá quem...”'
  rationale: As formas jussivas hebraicas exprimem desejo ou invocação, não simples previsão. A tradução mantém a tensão e a força retórica do salmo imprecatório.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação concisa preserva o paralelismo e o tom imprecatório do hebraico.
