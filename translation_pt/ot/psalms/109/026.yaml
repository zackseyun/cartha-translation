  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: pt
  text: Ajuda-me, ó Yahweh, meu Deus; salva-me segundo o teu amor leal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “salva-me conforme a tua fidelidade à aliança”. O hebraico חֶסֶד designa amor leal e constante e pode conter conotações de aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: Ajuda-me
  rationale: Imperativo de עזר com sufixo de primeira pessoa do singular. “Ajuda-me” é uma súplica direta, natural e urgente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa funciona como vocativo em aposição a Yahweh; “meu Deus” traduz isso de modo direto.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: Imperativo hifil de ישׁע com sufixo de primeira pessoa do singular. “Salva-me” conserva o sentido amplo de resgate divino no contexto dos Salmos.
- source_word: כְחַסְדֶּךָ
  choice: segundo o teu amor leal
  rationale: A preposição כ indica padrão ou medida, e חֶסֶד expressa amor firme e leal, frequentemente com conotações de aliança. “Segundo o teu amor leal” preserva tanto a construção quanto a riqueza relacional do termo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
- issue: Alcance de חֶסֶד
  choice: amor leal
  alternative: misericórdia; fidelidade à aliança
  rationale: “Amor leal” mantém juntas as ideias de amor, constância e lealdade, sem limitar o termo à compaixão nem tornar explícita uma referência à aliança que permanece conotativa.
translation_notes:
  register: Português moderno, claro e digno, com formas pronominais amplamente compreensíveis. A formulação conserva o paralelismo breve da súplica hebraica e usa “ó” para marcar naturalmente o vocativo solene.
