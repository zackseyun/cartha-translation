  text: וְֽ֭/יֵדְעוּ כִּי יָ֣דְ/ךָ זֹּ֑את אַתָּ֖ה יְהוָ֣ה עֲשִׂיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: pt
  text: Que eles saibam[a] que esta é a tua mão; tu, ó Yahweh, fizeste isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E que eles saibam» ou «Saibam eles»; no contexto, o verbo hebraico tem sentido volitivo, expressando desejo ou pedido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Saibam eles
  rationale: O imperfeito qal na 3ª pessoa do plural, com conjunção prefixada, tem força volitiva no contexto, expressando o desejo ou a oração do salmista. A ordem marcada preserva essa força em português com registro digno.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que eles devem reconhecer, não uma explicação causal.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Mantém a metáfora hebraica da mão como expressão da ação e do poder divinos, sem explicá-la em excesso.
- source_word: זֹּאת
  choice: esta
  rationale: O demonstrativo feminino aponta para a intervenção mencionada no contexto e concorda naturalmente com «mão» em português.
- source_word: אַתָּה
  choice: tu
  rationale: O pronome independente é expresso para conservar a ênfase do hebraico antes do nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עֲשִׂיתָהּ
  choice: fizeste isso
  rationale: O verbo עשה indica que Yahweh realizou a intervenção referida; «isso» retoma naturalmente o ato em português sem restringir seu sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal mediante transliteração amplamente reconhecida.
- issue: Agência divina expressa pela metáfora da mão
  choice: manter «a tua mão»
  alternative: explicitar como «o teu poder» ou «a tua ação»
  rationale: A imagem pode comunicar simultaneamente poder e ação; mantê-la preserva a amplitude e a tensão poética do original.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa coerentes («tua», «tu», «fizeste»). A formulação conserva a metáfora hebraica e a ênfase no sujeito divino.
