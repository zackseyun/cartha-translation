  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: pt
  text: Ele vestiu a maldição como sua veste[a]; ela entrou como água em seu interior[b] e como óleo nos seus ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele se revestiu de maldição como de uma veste”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nas suas entranhas”. O termo hebraico pode indicar tanto o interior do corpo quanto o ser interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ קְלָלָה
  choice: Ele se revestiu de maldição
  rationale: O verbo לבשׁ descreve o ato de vestir-se ou revestir-se, e קְלָלָה pode designar uma maldição ou a prática de amaldiçoar. “Revestiu-se de maldição” mantém a metáfora concreta e permite que o substantivo feminino seja retomado naturalmente por “ela” na oração seguinte.
- source_word: כְּמַדּוֹ
  choice: como de uma veste
  rationale: מַד designa uma veste ou roupa. A formulação portuguesa completa de modo natural a construção “revestiu-se de” e preserva a comparação, sem especificar indevidamente o tipo de vestimenta.
- source_word: וַתָּבֹא
  choice: ela penetrou
  rationale: O verbo feminino singular retoma קְלָלָה. Embora בוא signifique literalmente “entrar/vir”, “penetrou” expressa em português a entrada profunda sugerida pelas imagens paralelas da água e do óleo, sem acrescentar um agente externo.
- source_word: כַמַּיִם בְּקִרְבּוֹ
  choice: como água no seu íntimo
  rationale: A comparação com a água é mantida diretamente. קֶרֶב pode indicar o interior físico ou o ser interior; “íntimo” conserva essa amplitude em português, enquanto a nota registra a alternativa mais corporal.
- source_word: וְכַשֶּׁמֶן בְּעַצְמוֹתָיו
  choice: e como óleo nos seus ossos
  rationale: A tradução conserva o paralelismo e a imagem de algo que permeia profundamente. A preposição ב pode ser vertida por “em/nos”, e o verbo “penetrou” já comunica o movimento para dentro.
theological_decisions:
- issue: Imagem imprecatória e agência
  choice: A maldição que o homem adotou como vestimenta passa a penetrá-lo profundamente.
  alternative: Deus faz a maldição entrar diretamente nele; ou o verso descreve apenas uma consequência psicológica.
  rationale: O hebraico descreve a relação do homem com a maldição e o que ela faz nele, mas não explicita neste verso o mecanismo nem nomeia um agente divino. A tradução preserva essa tensão e a imagem de retribuição poética.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Veste” preserva o tom poético sem arcaísmo excessivo; “seu íntimo” mantém a ambiguidade entre interior corporal e interioridade pessoal.
