    issue: Construção pouco idiomática em «Nomeia sobre ele um homem perverso».
    rationale: Em português, «nomear sobre alguém» soa truncado e não é a maneira corrente de expressar a designação de uma pessoa sobre outra. «Coloca ... sobre ele» preserva o sentido de designar/estabelecer e a relação indicada por עָלָיו.
  - severity: low
    issue: «Que um acusador fique à sua direita» atenua a ação de tomar posição.
    rationale: «Ficar» pode sugerir permanência; o hebraico יַעֲמֹד descreve estar de pé ou pôr-se numa posição. «Que ... se ponha à sua direita» é mais específico e natural no contexto.
  revised_text: Coloca um homem perverso sobre ele, e que um acusador[a] se ponha à sua direita.
