source:
  edition: WLC
  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: pt
  text: Coloca um homem perverso sobre ele, e que um acusador[a] se ponha à sua direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um adversário”; ou ainda “Satanás”. A palavra hebraica pode significar “acusador”, “adversário” ou, em certos contextos, o nome próprio Satanás.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Nomeia
  rationale: O imperativo hifil de פקד pede que alguém seja colocado ou designado sobre outra pessoa. “Nomeia” preserva a força imperativa e soa natural em português.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Com פקד, a preposição על indica naturalmente a pessoa sobre quem alguém é nomeado; a expressão mantém a possível dimensão administrativa ou judicial.
- source_word: רָשָׁע
  choice: um homem perverso
  rationale: O termo designa uma pessoa moralmente má. “Um homem perverso” torna explícita a referência pessoal e mantém um registro digno e corrente.
- source_word: שָׂטָן
  choice: um acusador
  rationale: Neste contexto judicial, o substantivo comum pode designar quem acusa ou atua como adversário. “Acusador” harmoniza-se com a posição à direita e evita impor o nome próprio “Satanás”.
- source_word: יַעֲמֹד
  choice: que ... fique
  rationale: O imperfeito tem valor volitivo após o imperativo. “Que ... fique” expressa em português a imprecação e a tomada de posição indicada pelo verbo.
- source_word: עַל יְמִינוֹ
  choice: à sua direita
  rationale: A expressão preserva a localização idiomática e a possível cena judicial sem acrescentar uma interpretação não explicitada no hebraico.
theological_decisions:
- issue: Se שָׂטָן deve ser traduzido como nome próprio ou substantivo comum
  choice: 'substantivo comum: “um acusador”'
  alternative: “Satanás” ou “um adversário”
  rationale: O hebraico não exige aqui um nome próprio, e o contexto imediato favorece uma cena judicial de acusação. A nota conserva tanto a alternativa lexical “adversário” quanto a leitura tradicional “Satanás”, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo, a força imprecatória e a ambiguidade lexical de שָׂטָן.
