lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: Palavras de ódio
  rationale: Preserva a relação construta e expressa de modo direto e natural as declarações movidas por ódio ou hostilidade.
- source_word: סְבָבוּנִי
  choice: me cercam
  rationale: Mantém a imagem poética de palavras que envolvem o salmista; o presente comunica vividamente a hostilidade em curso.
- source_word: וַיִּלָּחֲמוּנִי
  choice: eles lutam contra mim
  rationale: Expressa o sentido do Nifal de לחם, lutar ou combater contra alguém, sem exigir que o contexto seja estritamente militar.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Comunica que a agressão não tem razão válida nem justificativa, em português corrente e claro.
theological_decisions: []
