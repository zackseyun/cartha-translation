  text: For I am poor and needy[a], and my heart is wounded within me.
translation:
  language: pt
  text: Pois sou pobre e necessitado, e meu coração está ferido[a] dentro de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trespassado” ou “mortalmente ferido”. O verbo hebraico pode descrever alguém perfurado, ferido ou atingido de modo fatal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a súplica no contexto e preserva de modo natural a força conectiva do hebraico.
- source_word: עָנִי
  choice: pobre
  rationale: O termo pode indicar pobreza, aflição ou opressão. “Pobre” combina com אֶבְיוֹן sem excluir a situação mais ampla de sofrimento.
- source_word: אֶבְיוֹן
  choice: necessitado
  rationale: Distingue o termo de עָנִי e comunica carência e desamparo, preservando o conhecido par hebraico.
- source_word: אָנֹכִי
  choice: sou
  rationale: O pronome independente é explícito e enfático; em português, sua força é expressa naturalmente pela construção “sou pobre e necessitado”.
- source_word: לִבִּי
  choice: meu coração
  rationale: Mantém a imagem hebraica do coração como centro da vida interior, sem restringi-la apenas às emoções.
- source_word: חָלַל
  choice: está ferido
  rationale: No contexto, descreve uma lesão interior profunda. “Ferido” preserva a amplitude do verbo, que também pode sugerir ser traspassado ou mortalmente atingido.
- source_word: בְּקִרְבִּי
  choice: dentro de mim
  rationale: Expressa de maneira clara e idiomática a localização interior indicada pela frase hebraica.
