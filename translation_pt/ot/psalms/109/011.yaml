source:
  edition: WLC
  text: יְנַקֵּ֣שׁ נ֭וֹשֶׁה לְ/כָל אֲשֶׁר ל֑/וֹ וְ/יָבֹ֖זּוּ זָרִ֣ים יְגִיעֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: pt
  text: Que o credor se apodere de tudo o que ele possui[a], e que estranhos saqueiem o fruto do seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enrede”; o verbo hebraico pode significar armar uma cilada ou capturar, mas aqui provavelmente descreve o credor tomando posse dos bens do devedor.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: se apodere de
  rationale: No piel, o verbo pode significar armar uma cilada ou apanhar. Com “credor” como sujeito e os bens como objeto, expressa aqui a apropriação agressiva do patrimônio; “se apodere de” comunica esse sentido econômico sem sugerir literalmente uma armadilha.
- source_word: נ֭וֹשֶׁה
  choice: credor
  rationale: Designa quem empresta e exige o pagamento da dívida. “Credor” é natural, amplo e adequado ao contexto.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: tudo o que ele possui
  rationale: Expressa de forma abrangente todos os bens pertencentes ao alvo da imprecação, em português claro e idiomático.
- source_word: וְיָבֹזּוּ
  choice: saqueiem
  rationale: O verbo בזז indica tomar despojos, geralmente pela força. “Saqueiem” preserva a ideia de espoliação predatória.
- source_word: זָרִים
  choice: estranhos
  rationale: Refere-se a pessoas de fora do círculo familiar ou comunitário. “Estranhos” preserva essa amplitude sem especificar nacionalidade.
- source_word: יְגִיעוֹ
  choice: o fruto do seu trabalho
  rationale: O substantivo pode indicar o produto ou ganho obtido pelo esforço, não apenas o ato de trabalhar. A expressão deixa claro que aquilo que será saqueado é o resultado do trabalho.
theological_decisions:
- issue: Força jussiva da imprecação
  choice: 'Traduzir os verbos como desejos ou pedidos: “Que ... se apodere ... e que ... saqueiem”.'
  alternative: 'Futuro simples: “O credor se apoderará ... e estranhos saquearão ...”.'
  rationale: No contexto das imprecações do Salmo 109, as formas yiqtol exprimem melhor desejo ou pedido do que simples previsão. A construção portuguesa com “que” preserva a força de maldição ou oração sem convertê-la em afirmação futura.
translation_notes:
  register: Português moderno, claro e digno, com construção jussiva natural. “Saqueiem” mantém o tom poético e violento do hebraico, enquanto “fruto do seu trabalho” explicita de modo idiomático o produto do esforço.
