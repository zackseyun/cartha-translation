  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: pt
  text: Como uma sombra que se alonga[a], desapareço[b]; sou sacudido como um gafanhoto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando declina” ou “quando se estende”; o verbo hebraico pode descrever a sombra que se alonga ou se inclina ao entardecer.
    reason: lexical_alternative
  - marker: b
    text: Ou “vou-me embora” ou “passo”; o hebraico usa literalmente o verbo “ir/andar”, aqui com o sentido de desaparecer ou passar.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico normalmente designa um gafanhoto, especialmente o migratório; também pode ser traduzido por “locusta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: Como a sombra
  rationale: O prefixo כְּ marca comparação, e צֵל significa “sombra”; a formulação preserva de modo natural o símile hebraico.
- source_word: כִּנְטוֹתוֹ
  choice: quando se alonga
  rationale: A forma de נטה pode indicar estender-se, inclinar-se ou declinar. No contexto da sombra, “quando se alonga” exprime naturalmente a imagem do fim do dia sem eliminar outras nuances.
- source_word: נֶהֱלָכְתִּי
  choice: vou desaparecendo
  rationale: O nifal de הלך, literalmente ligado a ir ou partir, descreve aqui o desaparecimento do salmista à semelhança de uma sombra. A locução mantém a ideia de movimento/processo sem tornar o português obscuro.
- source_word: נִנְעַרְתִּי
  choice: sou sacudido para longe
  rationale: O nifal de נער comunica ser sacudido ou desalojado. “Para longe” torna claro o resultado implícito da imagem, preservando a voz passiva.
- source_word: כָּאַרְבֶּה
  choice: como um gafanhoto
  rationale: אַרְבֶּה designa normalmente o gafanhoto, especialmente o migratório. “Gafanhoto” é a designação corrente e inteligível em português.
