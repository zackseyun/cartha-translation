  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: pt
  text: Que os meus acusadores[a] se vistam de desonra e se envolvam em sua vergonha como num manto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «meus adversários». O termo hebraico pode indicar oponentes em geral ou acusadores em sentido mais jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: Que ... se vistam
  rationale: O imperfeito qal na oração imprecatória funciona naturalmente como desejo ou pedido. A construção reflexiva com «se vistam de» preserva de modo idiomático a imagem hebraica do vestuário.
- source_word: שׂוֹטְנַי
  choice: meus acusadores
  rationale: O particípio plural com sufixo de primeira pessoa pode designar adversários em geral ou pessoas que acusam. «Meus acusadores» se ajusta ao contexto hostil e jurídico do salmo, sem apagar a alternativa lexical.
- source_word: כְּלִמָּה
  choice: desonra
  rationale: O substantivo indica vergonha pública, humilhação ou desonra. «Desonra» distingue este termo de בָּשְׁתָּם, traduzido por «sua vergonha», preservando o paralelismo sem repetição desnecessária.
- source_word: וְיַעֲטוּ
  choice: e se envolvam
  rationale: O verbo עטה expressa cobrir ou envolver-se. A forma reflexiva é natural em português e mantém a metáfora de alguém cercado por uma peça de roupa.
- source_word: כַמְעִיל
  choice: como num manto
  rationale: מְעִיל designa uma veste exterior. «Manto» é claro, digno e comunica bem a ideia de algo que envolve o corpo.
- source_word: בָּשְׁתָּם
  choice: sua vergonha
  rationale: O substantivo com sufixo de terceira pessoa do plural significa literalmente «vergonha deles». Em português, «sua vergonha» retém a relação possessiva e se integra naturalmente à imagem do manto.
theological_decisions:
- issue: Valor modal dos imperfeitos numa oração imprecatória
  choice: 'Traduzir como desejo ou pedido: «Que os meus acusadores ... se vistam ... e se envolvam».'
  alternative: 'Predição futura: «Os meus acusadores se vestirão ... e se envolverão».'
  rationale: No contexto das petições do Salmo 109, os imperfeitos são entendidos naturalmente em sentido volitivo ou jussivo. A construção com «Que» conserva o caráter de oração sem transformá-la numa simples previsão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a metáfora dupla do vestuário e distingue «desonra» de «vergonha». O marcador [a] aparece imediatamente após o termo a que se refere.
