  text: יִֽהְיֽוּ יָמָ֥י/ו מְעַטִּ֑ים פְּ֝קֻדָּת֗/וֹ יִקַּ֥ח אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: pt
  text: Sejam poucos os seus dias; que outro assuma o seu encargo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “função”, “posto”, “responsabilidade” ou “supervisão”. O termo hebraico indica uma responsabilidade confiada ou uma função designada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Sejam
  rationale: O jussivo, no contexto imprecatório, é expresso naturalmente pelo presente do subjuntivo em português.
- source_word: יָמָיו
  choice: os seus dias
  rationale: Tradução direta do substantivo plural com sufixo de terceira pessoa masculina; no contexto, refere-se à duração da vida.
- source_word: מְעַטִּים
  choice: poucos
  rationale: Preserva diretamente a ideia de dias pouco numerosos, implicando uma vida breve.
- source_word: פְּקֻדָּתוֹ
  choice: o seu encargo
  rationale: O termo designa responsabilidade confiada, função ou posto. “Encargo” mantém essa amplitude sem impor ao salmo um sentido eclesiástico técnico.
- source_word: יִקַּח
  choice: que ... assuma
  rationale: O imperfeito tem força volitiva em paralelo com a primeira oração; “que ... assuma” comunica essa imprecação e soa natural em português.
- source_word: אַחֵר
  choice: outro
  rationale: Equivalente direto e idiomático, indicando outra pessoa.
theological_decisions:
- issue: Sentido de פְּקֻדָּתוֹ, posteriormente citado em Atos 1:20
  choice: encargo
  alternative: função, posto, responsabilidade ou supervisão
  rationale: “Encargo” preserva a noção hebraica de uma responsabilidade confiada e permite a aplicação posterior em Atos sem introduzir no salmo, de modo retroativo, um ofício eclesiástico técnico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção paralela com o subjuntivo preserva a força imprecatória; “encargo” evita tanto o tecnicismo denominacional quanto a perda da ideia de responsabilidade confiada.
