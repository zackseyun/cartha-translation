  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: pt
  text: Pois ele se põe à direita do necessitado, para salvá-lo dos que julgam sua vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos seus juízes» ou «dos que julgam sua alma». O hebraico pode se referir aos que atuam como juízes contra ele; e o termo traduzido por «vida» também pode significar «alma» ou a própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação de louvor anterior e mantém com naturalidade a força explicativa do hebraico.
- source_word: יַעֲמֹד
  choice: ele se põe
  rationale: O imperfeito pode indicar ação característica ou garantida; «se põe» preserva a imagem de tomar posição em defesa de alguém sem impor exclusivamente valor presente ou futuro.
- source_word: לִימִין
  choice: à direita de
  rationale: Mantém a metáfora hebraica de presença próxima, apoio e defesa.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Abrange pobreza, carência e vulnerabilidade, sentidos centrais do termo no contexto.
- source_word: לְהוֹשִׁיעַ
  choice: para salvá-lo
  rationale: Expressa a finalidade do infinitivo e conserva a amplitude de ישׁע, que aqui inclui livramento judicial e preservação da vida.
- source_word: מִשֹּׁפְטֵי
  choice: dos que julgam
  rationale: Preserva o sentido judicial do particípio sem explicitar «condenam», embora o contexto seja hostil.
- source_word: נַפְשׁוֹ
  choice: sua vida
  rationale: Neste contexto de ameaça e livramento, נֶפֶשׁ designa mais naturalmente a vida ou a própria pessoa, sem exigir a noção mais estreita de uma alma imaterial.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: sua vida
  alternative: sua alma; a ele próprio
  rationale: O contexto trata do resgate de uma pessoa vulnerável diante de julgamento hostil. «Vida» preserva a gravidade da ameaça sem impor uma antropologia posterior mais específica.
- issue: Valor temporal de יַעֲמֹד
  choice: ele se põe
  alternative: ele se porá; ele está
  rationale: A forma pode exprimir ação habitual ou assegurada. A formulação escolhida mantém essa abertura e apresenta a postura protetora de Deus sem restringi-la ao presente ou ao futuro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem poética e a metáfora judicial do hebraico foram preservadas sem rigidez excessiva.
