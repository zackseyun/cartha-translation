  text: יִֽהְיוּ בָנָ֥י/ו יְתוֹמִ֑ים וְ֝/אִשְׁתּ/וֹ אַלְמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: pt
  text: Que os filhos dele fiquem sem pai[a], e a sua mulher fique viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “órfãos”. O termo hebraico pode indicar filhos privados do pai; aqui, “sem pai” combina com o paralelo “a sua mulher fique viúva”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que ... fiquem
  rationale: A forma verbal, no contexto imprecatório, expressa desejo ou pedido, não mera previsão. Em português, a construção com “que” e o presente do subjuntivo comunica naturalmente essa força.
- source_word: בָנָיו
  choice: os filhos dele
  rationale: O plural masculino de בֵּן significa especificamente “filhos”. “Dele” mantém clara a referência ao homem mencionado no contexto e soa natural no português moderno.
- source_word: יְתוֹמִים
  choice: sem pai
  rationale: O termo pode designar órfãos, especialmente crianças privadas do pai. Aqui, “sem pai” preserva a precisão contextual e o paralelismo com a mulher que fica viúva.
- source_word: וְאִשְׁתּוֹ
  choice: e a sua mulher
  rationale: Neste contexto, אִשָּׁה com o sufixo possessivo designa a esposa. “Sua mulher” é uma expressão corrente, digna e amplamente compreensível.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: O substantivo denota diretamente uma viúva; com “ficar”, o predicativo sem artigo é a formulação natural em português.
theological_decisions:
- issue: Modo imprecatório do salmo
  choice: 'Traduzir como desejo ou pedido: “Que os filhos dele fiquem sem pai, e a sua mulher fique viúva.”'
  alternative: 'Futuro preditivo: “Os filhos dele ficarão sem pai, e a sua mulher ficará viúva.”'
  rationale: A forma verbal e o contexto literário favorecem o sentido volitivo ou imprecatório. A tradução conserva a tensão e a dureza da oração sem transformá-la em simples previsão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “fiquem/fique” explicita naturalmente em português a mudança de condição implícita no hebraico e preserva o paralelismo.
