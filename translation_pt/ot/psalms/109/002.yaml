  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: pt
  text: Pois a boca do perverso e a boca enganosa se abriram contra mim[a]; falaram comigo com língua mentirosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a boca do perverso e a boca do engano se abriram contra mim”. O hebraico repete literalmente “boca”; “boca enganosa” expressa de modo mais natural o sentido da segunda construção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “falaram a mim com língua mentirosa”. A expressão hebraica também pode ser entendida como fala dirigida ao salmista: “falaram comigo” ou “falaram a mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e preserva de modo natural a força causal.
- source_word: פִי רָשָׁע
  choice: a boca do perverso
  rationale: Mantém a construção hebraica e o adjetivo substantivado no singular, sem acrescentar uma especificação ausente no texto.
- source_word: וּפִי מִרְמָה
  choice: e a boca enganosa
  rationale: Preserva a repetição enfática de 'boca'; entende מִרְמָה atributivamente, como expressão de fala enganosa.
- source_word: עָלַי פָּתָחוּ
  choice: se abriram contra mim
  rationale: Conserva a imagem concreta de abrir a boca e traduz עָלַי com seu sentido hostil no contexto.
- source_word: דִּבְּרוּ אִתִּי
  choice: falaram comigo
  rationale: Reproduz de perto a construção com אִתִּי e mantém sua possível nuance de interação, embora o contexto seja hostil.
- source_word: לְשׁוֹן שָׁקֶר
  choice: com língua mentirosa
  rationale: Mantém a imagem hebraica da língua e expressa שָׁקֶר em português corrente.
