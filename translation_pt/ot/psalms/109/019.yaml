  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: pt
  text: Que ela seja para ele como a roupa com que se cobre[a] e como o cinto que sempre põe em volta da cintura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ela seja para ele como uma veste que põe sobre si e como uma faixa que continuamente amarra em volta do corpo.”'
    reason: Alternativa lexical que explicita outros sentidos possíveis de עטה e מֵזַח e conserva a linguagem concreta de cingir.
lexical_decisions:
- source_word: תְּהִי
  choice: Que ela seja
  rationale: O jussivo qal na 3ª pessoa feminina expressa um desejo ou uma imprecação; a construção portuguesa preserva essa força volitiva.
- source_word: ל֭וֹ
  choice: para ele
  rationale: Mantém explicitamente a relação indicada pela preposição com sufixo pronominal.
- source_word: כְּבֶגֶד
  choice: como a roupa
  rationale: בגד é um termo geral para veste ou roupa; a escolha evita especificar indevidamente o tipo de peça.
- source_word: יַעְטֶה
  choice: com que se cobre
  rationale: עטה pode significar cobrir-se, envolver-se ou vestir-se; esta formulação conserva a imagem de algo que o recobre.
- source_word: וּלְמֵזַח
  choice: e como o cinto
  rationale: מֵזַח designa uma peça usada para cingir; “cinto” é claro e atual em português.
- source_word: תָּמִיד
  choice: sempre
  rationale: Transmite de modo natural a continuidade expressa pelo advérbio.
- source_word: יַחְגְּרֶהָ
  choice: põe em volta da cintura
  rationale: חגר descreve o ato de cingir ou prender uma peça à cintura, e o sufixo feminino retoma a realidade comparada ao cinto. A formulação é natural sem apagar a imagem concreta.
theological_decisions:
- issue: Força jussiva no contexto imprecatório
  choice: 'Traduzir como desejo ou imprecação: “Que ela seja...”'
  alternative: 'Traduzir como futuro preditivo: “Ela será...”'
  rationale: A forma verbal e o contexto do Salmo 109 favorecem uma petição de juízo, não uma simples previsão; a tradução preserva a tensão retórica sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome feminino “ela” preserva a referência ao elemento feminino do contexto anterior, enquanto a nota registra uma formulação mais literal das imagens de vestir e cingir.
