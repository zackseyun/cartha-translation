  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: pt
  text: Quando ele for julgado, que seja declarado culpado[a], e que sua oração se torne pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que saia como ímpio”. O hebraico também pode descrever a pessoa como ímpia, mas, neste contexto judicial, provavelmente indica um veredito de culpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seja considerada pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Quando ele for julgado
  rationale: A preposição בְּ com o infinitivo construto nifal de שׁפט e o sufixo de terceira pessoa masculina singular tem valor temporal e sentido passivo/judicial.
- source_word: יֵצֵא רָשָׁע
  choice: que seja declarado culpado
  rationale: Embora יֵצֵא signifique literalmente “saia”, no contexto judicial a expressão indica o resultado do julgamento; רָשָׁע pode designar quem recebe um veredito de culpa. A formulação portuguesa preserva o valor volitivo sem produzir um calque pouco natural.
- source_word: וּתְפִלָּתוֹ
  choice: e que sua oração
  rationale: תְּפִלָּה significa “oração”; a construção com “que” coordena naturalmente a segunda petição imprecatória com a primeira.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: se torne pecado
  rationale: היה com ל pode indicar resultado ou transformação. “Se torne pecado” representa diretamente esse valor, mantendo a concisão e a tensão do hebraico.
theological_decisions:
- issue: Força das formas verbais no contexto imprecatório
  choice: 'Traduzir como petição volitiva: “que seja... e que... se torne”'
  alternative: 'Traduzir como previsão futura: “será... e sua oração se tornará”'
  rationale: A sequência de petições do Salmo 109 favorece o valor jussivo ou optativo. A tradução preserva a fala imprecatória do salmista sem convertê-la em mera previsão.
- issue: Sentido de רָשָׁע no cenário judicial
  choice: culpado
  alternative: ímpio ou perverso
  rationale: O contexto explícito de julgamento favorece o sentido forense, embora o termo também possa caracterizar moralmente alguém como ímpio; a nota preserva essa alternativa lexical.
- issue: Relação da oração com o pecado
  choice: “se torne pecado”
  alternative: “seja considerada pecado”
  rationale: A tradução principal mantém a formulação forte e ambígua do hebraico, sem explicitar se se trata de transformação, resultado ou imputação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Seja declarado culpado” comunica naturalmente o resultado forense implícito em “saia culpado”, enquanto as notas preservam as alternativas genuínas do hebraico.
