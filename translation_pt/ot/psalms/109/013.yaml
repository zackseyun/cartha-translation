  text: יְהִֽי אַחֲרִית֥/וֹ לְ/הַכְרִ֑ית בְּ/ד֥וֹר אַ֝חֵ֗ר יִמַּ֥ח שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: pt
  text: Que a sua descendência seja eliminada[a]; na geração seguinte, que o nome deles seja apagado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Que o seu fim seja a destruição». אַחֲרִית pode significar «fim» ou «futuro», mas, neste contexto, provavelmente se refere à descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Seja
  rationale: O jussivo de היה expressa desejo ou imprecação; «seja» preserva naturalmente essa força volitiva em português.
- source_word: אַחֲרִיתוֹ
  choice: a sua descendência
  rationale: Embora אַחֲרִית possa significar «fim» ou «futuro», o paralelismo com a geração seguinte e o apagamento do nome favorece a ideia da linhagem que permanece depois dele.
- source_word: לְהַכְרִית
  choice: exterminada
  rationale: O infinitivo de כרת com ל indica resultado ou finalidade. «Exterminada» transmite que a linhagem é inteiramente eliminada, em linguagem clara e digna.
- source_word: בְּדוֹר אַחֵר
  choice: na geração seguinte
  rationale: No contexto, a expressão aponta para a geração posterior; «seguinte» é natural e preserva a relação temporal.
- source_word: יִמַּח
  choice: seja apagado
  rationale: O nifal de מחה significa ser apagado ou eliminado, especialmente quando o objeto é um nome ou memória.
- source_word: שְׁמָם
  choice: o nome deles
  rationale: O sufixo hebraico é plural e retoma os membros da descendência; o singular coletivo «nome» conserva a forma do original.
theological_decisions:
- issue: Força imprecatória do versículo
  choice: Manter a forma de desejo ou oração por juízo contra a linhagem do ímpio
  alternative: Converter a declaração numa simples previsão sobre o futuro dele
  rationale: As formas jussivas e o contexto do Salmo 109 apresentam pedidos de juízo, não previsões neutras. A tradução conserva essa severidade e tensão sem atenuá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela com «seja» preserva o caráter poético e imprecatório. O marcador [a] aparece imediatamente após a expressão ambígua.
