  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: pt
  text: Ele amou a maldição[a], e ela veio sobre ele; não teve prazer na bênção[b], e ela ficou longe dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele amou amaldiçoar, e isso veio sobre ele.” O substantivo hebraico pode indicar tanto a ação ou prática de amaldiçoar quanto uma maldição concreta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não se agradou da bênção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amou
  rationale: O qal wayyiqtol de אהב expressa amor, afeição ou desejo; “amou” preserva de modo direto a força volitiva e o contraste poético.
- source_word: קְלָלָה
  choice: a maldição
  rationale: O substantivo pode indicar tanto a prática ou categoria de amaldiçoar quanto uma maldição concreta. No português, “a maldição” mantém a referência retomada pelo pronome feminino e permite ambas as nuances.
- source_word: וַתְּבוֹאֵהוּ
  choice: ela veio sobre ele
  rationale: A forma de בוא traz sufixo de objeto masculino singular, enquanto o sujeito feminino retoma “maldição”. “Veio sobre ele” comunica naturalmente a chegada da maldição como consequência.
- source_word: וְלֹא חָפֵץ
  choice: não teve prazer
  rationale: חפץ pode expressar prazer, agrado ou desejo. “Não teve prazer” conserva o contraste afetivo com “amou” sem tornar a frase artificial.
- source_word: בִּבְרָכָה
  choice: na bênção
  rationale: O substantivo está em paralelismo antitético com קְלָלָה. “Na bênção” representa adequadamente a bênção como realidade ou categoria.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: ela se afastou dele
  rationale: רחק significa estar, tornar-se ou ficar distante. O wayyiqtol feminino retoma “bênção”; “se afastou dele” reproduz o movimento/resultante distanciamento sem acrescentar duração contínua.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. Os pronomes femininos explicitam que a maldição vem sobre ele e que a bênção se afasta dele.
