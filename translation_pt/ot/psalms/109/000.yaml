base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: pt
  text: 'Ao regente. De Davi.[a] Salmo.


    Ó Deus do meu louvor, não fiques em silêncio.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por Davi”, “Para Davi” ou “Referente a Davi”; a expressão hebraica do título é ambígua.
    reason: alternative_reading
  - marker: b
    text: Ou “não te cales”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Traduz a designação musical como uma instrução dirigida ao responsável pela execução, em linguagem clara e sem especificar além do que o hebraico permite.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ó Deus do meu louvor
  rationale: 'Preserva a construção compacta e sua possível amplitude: o Deus a quem o salmista louva e/ou aquele que é o motivo de seu louvor.'
- source_word: אַל תֶּחֱרַשׁ
  choice: não fiques em silêncio
  rationale: Expressa o pedido para que Deus não permaneça calado ou inativo, sem explicitar uma intervenção que o texto apenas implica.
theological_decisions:
- issue: Relação indicada por לְדָוִד
  choice: De Davi
  alternative: Por Davi; para Davi; referente a Davi
  rationale: A formulação tradicional e concisa é adequada, mas a preposição hebraica não determina por si só autoria; a nota mantém abertas as relações possíveis.
- issue: Sentido de “Deus do meu louvor”
  choice: Manter a expressão genitiva sem paráfrase explicativa
  alternative: Ó Deus, a quem eu louvo; ó Deus, motivo do meu louvor
  rationale: O hebraico permite mais de uma nuance, e a tradução não deve resolver silenciosamente essa tensão.
translation_notes:
  register: Português atual, digno e de leitura ampla. Mantém a forma breve do cabeçalho hebraico e conserva a ambiguidade da atribuição davídica e da expressão “Deus do meu louvor”.
