  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: pt
  text: Pois eis que os perversos retesam o arco; põem a flecha na corda para, na escuridão[a], atirar contra os retos de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a partir da escuridão”. A expressão hebraica pode enfatizar tanto o cenário escuro do ataque como o esconderijo de onde ele é lançado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a declaração anterior e preserva a ligação argumentativa do contexto.
- source_word: הִנֵּה
  choice: vejam
  rationale: Partícula dêitica que chama a atenção para uma ameaça imediata; “vejam” mantém a vivacidade em português atual, sem recorrer ao mais solene “eis”.
- source_word: הָרְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente corruptas, não apenas culpadas em sentido jurídico; “perversos” é corrente e apropriado ao registro poético.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: retesam o arco
  rationale: O idioma descreve o ato de curvar e preparar o arco para disparar. “Retesar o arco” comunica essa ação de modo preciso e natural.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: põem a flecha na corda
  rationale: Expressa a preparação deliberada do disparo, colocando a flecha na corda do arco. Mantém o singular hebraico e a imagem concreta.
- source_word: לִירוֹת
  choice: atirar
  rationale: Infinitivo de ירה no sentido próprio do arco e flecha. “Atirar” é claro e idiomático no contexto.
- source_word: בְּמוֹ אֹפֶל
  choice: na escuridão
  rationale: A expressão pode indicar o ambiente escuro ou o ocultamento do ataque. “Na escuridão” preserva o sentido adverbial mais direto sem eliminar a alternativa indicada em nota.
- source_word: לְיִשְׁרֵי לֵב
  choice: contra os retos de coração
  rationale: Preserva a expressão hebraica que caracteriza a integridade moral interior, com formulação digna e compreensível em português.
