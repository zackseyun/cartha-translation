  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: pt
  text: Pois Yahweh é justo; ele ama ações justas; os retos contemplarão o seu rosto[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “o seu rosto contempla os retos”. A sintaxe hebraica da oração final tem sido entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “o seu rosto”. A expressão também pode sugerir sua presença ou seu favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a afirmação anterior e soa natural em português.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa o caráter moral de Yahweh e preserva a ligação lexical com צְדָקוֹת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְדָקוֹת
  choice: ações justas
  rationale: O plural aponta naturalmente para atos concretos de justiça; a formulação também mantém a ligação com 'justo'.
- source_word: אָהֵב
  choice: ama
  rationale: Verbo direto e corrente que apresenta a disposição característica de Yahweh.
- source_word: יָשָׁר
  choice: os retos
  rationale: O adjetivo é usado substantivamente para pessoas moralmente íntegras; o verbo no plural favorece o sentido coletivo.
- source_word: יֶחֱזוּ
  choice: contemplarão
  rationale: Transmite mais do que mera percepção visual e conserva o tom elevado do salmo sem soar arcaico.
- source_word: פָנֵימוֹ
  choice: o seu rosto
  rationale: Mantém a imagem concreta do hebraico; 'presença' ou 'favor' são nuances interpretativas registradas em nota.
theological_decisions:
- issue: Referente e sintaxe da oração final
  choice: os retos contemplarão o seu rosto
  alternative: o seu rosto contempla os retos
  rationale: O verbo plural יֶחֱזוּ favorece 'os retos' como sujeito coletivo, e ver o rosto de Deus é uma expressão bíblica conhecida de comunhão e favor. Como a sintaxe admite outra análise, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição 'justo/justas' preserva deliberadamente a relação entre as palavras hebraicas da mesma raiz; 'contemplarão' mantém o tom poético.
