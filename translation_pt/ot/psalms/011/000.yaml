  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: pt
  text: 'Ao regente.[a] De Davi.


    Em Yahweh busco refúgio. Como vocês podem dizer à minha alma: “Fujam para o monte de vocês, pássaro”?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao mestre de música”. O sentido exato do título hebraico não é certo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz a formulação difícil: “Fujam para o monte de vocês, pássaro”. Também é possível entender: “Fujam como um pássaro para o monte de vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Designa provavelmente o responsável pela execução musical. “Regente” é conciso, atual e mantém a função do termo sem especificar além do que o hebraico permite.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a fórmula tradicional e a ambiguidade da preposição לְ, que pode indicar autoria, associação, dedicação ou pertencimento.
- source_word: בַּיהוָה
  choice: Em Yahweh
  rationale: Translitera o nome divino יהוה, distinguindo-o do título “Senhor”.
- source_word: חָסִיתִי
  choice: busco refúgio
  rationale: Expressa em português natural a confiança vigente do salmista. Embora a forma hebraica seja perfectiva, o contexto permite entender uma ação assumida com efeito presente.
- source_word: לְנַפְשִׁי
  choice: à minha alma
  rationale: Mantém a imagem explícita de נֶפֶשׁ e sua força reflexiva, sem reduzi-la silenciosamente a “a mim”.
- source_word: נוּדוּ
  choice: Fujam
  rationale: Reproduz o imperativo plural massorético, apesar da tensão com o substantivo singular “pássaro” no fim da frase.
- source_word: הַרְכֶם
  choice: para o monte de vocês
  rationale: Preserva tanto o substantivo singular “monte” quanto o sufixo de segunda pessoa do plural.
- source_word: צִפּוֹר
  choice: ó pássaro
  rationale: Trata o singular como vocativo, uma leitura possível da difícil ordem hebraica, sem inserir na linha principal a comparação “como um pássaro”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O uso do nome próprio conserva a distinção lexical do texto hebraico e não acrescenta uma substituição litúrgica à tradução.
- issue: Sentido de נֶפֶשׁ
  choice: alma
  alternative: mim / minha vida
  rationale: “Alma” preserva a metáfora antropológica do hebraico, mas não deve ser entendida aqui como definição técnica de uma parte separável da pessoa.
- issue: Número e sintaxe na ordem para fugir
  choice: Manter o imperativo plural e o vocativo singular
  alternative: “Fuja como um pássaro para o seu monte”
  rationale: O texto massorético apresenta uma tensão real entre formas plurais e o singular צִפּוֹר. A tradução principal a conserva, e a nota registra a leitura comparativa mais fluente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”, “busco refúgio”). A sintaxe incomum da ordem final foi mantida deliberadamente para não ocultar a dificuldade do hebraico; a leitura mais idiomática aparece em nota.
