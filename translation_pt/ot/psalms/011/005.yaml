id: PSA.11.5
reference: Psalms 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: pt
  text: Yahweh põe à prova o justo, mas a sua alma odeia o perverso e aquele que ama a violência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'De modo mais fluente: “Yahweh põe à prova o justo, mas odeia o perverso e aquele que ama a violência”. Em hebraico, a expressão é literalmente “a sua alma odeia”, um modo enfático de comunicar profunda aversão pessoal.'
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado tem sentido representativo e descreve a pessoa caracterizada pela justiça.
- source_word: יִבְחָן
  choice: põe à prova
  rationale: Expressa o sentido avaliativo de בחן de modo natural em português, sem restringi-lo a mera observação ou a uma provação punitiva.
- source_word: וְרָשָׁע
  choice: o perverso
  rationale: Preserva a categoria moral do adjetivo substantivado e seu valor genérico; “perverso” é claro e corrente em português.
- source_word: וְאֹהֵב חָמָס
  choice: e aquele que ama a violência
  rationale: Mantém a referência pessoal e o caráter habitual expresso pelo particípio.
- source_word: חָמָס
  choice: violência
  rationale: É o equivalente mais direto neste contexto, embora o termo também possa abranger injustiça violenta.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: a sua alma odeia
  rationale: Conserva a expressão hebraica enfática, na qual נֶפֶשׁ aponta para o íntimo do próprio Yahweh e comunica profunda aversão pessoal.
theological_decisions:
- issue: Referente e força de “a sua alma” na oração final
  choice: “a sua alma” refere-se ao próprio Yahweh e expressa profunda aversão pessoal
  alternative: Traduzir de modo mais fluente como “ele odeia”, omitindo “alma”
  rationale: A construção hebraica atribui o ódio à נֶפֶשׁ de Yahweh. Preservá-la mantém a intensidade e a tensão antropomórfica do texto sem desenvolver especulações sobre as paixões divinas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Põe à prova” evita a possível impressão de que Yahweh apenas observa, enquanto “a sua alma odeia” preserva deliberadamente a intensidade concreta do hebraico.
