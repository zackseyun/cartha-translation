  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: pt
  text: Fará chover armadilhas sobre os perversos; fogo, enxofre e um vento abrasador serão a porção do cálice deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: Fará chover
  rationale: Reproduz o sentido causativo e a imagem de algo que desce do alto, com referência implícita a Deus preservada pelo contexto.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa pessoas caracterizadas pela maldade, sem restringir o termo a uma infração específica.
- source_word: פַּחִים
  choice: armadilhas
  rationale: Segue o texto consonantal e a vocalização massorética no sentido plural de laços ou armadilhas, preservando a imagem incomum em vez de adotar uma conjectura como 'brasas'.
- source_word: אֵשׁ וְגָפְרִית
  choice: fogo, enxofre
  rationale: Correspondência direta, mantendo a tradicional imagem bíblica de juízo.
- source_word: רוּחַ זִלְעָפוֹת
  choice: um vento abrasador
  rationale: Comunica de modo natural a ideia de um vento intensamente quente e destrutivo; o singular indefinido torna a expressão corrente em português.
- source_word: מְנָת כּוֹסָם
  choice: a porção do cálice deles
  rationale: Mantém tanto a noção de porção destinada quanto a metáfora do cálice, sem explicar no corpo do versículo o seu valor simbólico.
theological_decisions:
- issue: O cálice como imagem de destino ou juízo divino
  choice: 'Preservar literalmente a metáfora: ''a porção do cálice deles'''
  alternative: Explicitar como 'o castigo que lhes está reservado'
  rationale: A formulação hebraica é metafórica e teologicamente carregada; explicá-la na tradução eliminaria sua força e anteciparia uma interpretação.
- issue: Identidade do agente em 'fará chover'
  choice: Manter o sujeito pronominal implícito em português
  alternative: Inserir 'O SENHOR fará chover'
  rationale: O hebraico usa a forma verbal de terceira pessoa e depende do contexto anterior para identificar o agente; a tradução preserva essa coesão sem acrescentar o nome divino neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e as imagens fortes do hebraico foram preservadas sem arcaísmos desnecessários.
