base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: pt
  text: Yahweh está no seu santo templo; Yahweh — nos céus está o seu trono. Seus olhos veem; suas pálpebras examinam os seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os filhos do homem»; isto é, a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: no seu santo templo
  rationale: הֵיכָל pode significar templo ou palácio; no paralelismo com o trono celestial, «santo templo» preserva a imagem da morada sagrada sem restringi-la explicitamente ao edifício terreno.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: nos céus está o seu trono
  rationale: Preserva a ordem marcada da frase hebraica e verte naturalmente o plural formal שָׁמַיִם por «céus».
- source_word: עֵינָיו יֶחֱזוּ
  choice: Seus olhos veem
  rationale: חזה significa ver ou contemplar; «veem» é direto, atual e mantém o antropomorfismo.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: suas pálpebras examinam
  rationale: Mantém a imagem poética literal das pálpebras em paralelo com os olhos; «examinam» comunica o sentido investigativo de בחן.
- source_word: בְּנֵי אָדָם
  choice: os seres humanos
  rationale: A expressão idiomática significa coletivamente a humanidade. «Os seres humanos» comunica seu alcance inclusivo com clareza em português atual; a forma mais literal é registrada em nota.
theological_decisions:
- issue: A morada divina e o trono celestial
  choice: Conservar lado a lado o santo templo de Yahweh e seu trono nos céus
  alternative: Identificar o santo templo exclusivamente com o templo terreno ou exclusivamente com o céu
  rationale: O hebraico apresenta as duas afirmações sem explicitar sua relação; a tradução preserva essa tensão poética e teológica.
- issue: Sentido coletivo de בְּנֵי אָדָם
  choice: os seres humanos
  alternative: os filhos de Adão / os filhos do homem
  rationale: O contexto abrange a humanidade em geral. A escolha evita que o idiomatismo hebraico seja entendido em português como referência apenas masculina, sem apagar a forma original, indicada na nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. A repetição de «Yahweh», a ordem marcada «nos céus está o seu trono» e o antropomorfismo «suas pálpebras examinam» preservam a estrutura e a poesia hebraicas.
