base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: pt
  text: Se os fundamentos forem destruídos,[a] o que poderá fazer o justo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois os fundamentos estão sendo derrubados; o que fez o justo?” A forma verbal hebraica da pergunta final permite uma tradução mais voltada ao passado, embora o contexto seja comumente entendido no sentido de “o que poderá fazer o justo?”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Embora a conjunção frequentemente signifique “pois” ou “porque”, aqui a leitura condicional introduz com naturalidade a situação que dá origem à pergunta retórica.
- source_word: הַשָּׁתוֹת
  choice: os fundamentos
  rationale: Preserva a imagem concreta do hebraico sem restringi-la às estruturas sociais, à justiça ou à ordem moral.
- source_word: יֵהָרֵסוּן
  choice: forem destruídos
  rationale: Expressa a forma passiva do verbo הרס e se ajusta à construção condicional em português.
- source_word: צַדִּיק
  choice: o justo
  rationale: Reproduz o singular representativo do hebraico de modo tradicional, conciso e natural em português.
- source_word: מַה
  choice: o que
  rationale: Introduz diretamente a pergunta retórica, sem ampliação interpretativa desnecessária.
- source_word: פָּעָל
  choice: poderá fazer
  rationale: Embora a forma verbal seja formalmente qatal, no contexto a pergunta diz respeito à possibilidade prática de agir quando os fundamentos são destruídos. A nota preserva a leitura mais orientada ao passado.
theological_decisions:
- issue: Alcance metafórico de “os fundamentos”
  choice: Manter a metáfora sem identificar os fundamentos com uma realidade específica.
  alternative: Explicitar “os fundamentos da sociedade”, “da justiça” ou “da ordem moral”.
  rationale: A imagem hebraica permanece ampla e evocativa; especificá-la resolveria uma abertura interpretativa legítima do texto.
- issue: Valor temporal e modal de פָּעָל
  choice: Traduzir contextualmente como “poderá fazer”.
  alternative: Traduzir formalmente como “fez” ou “tem feito”.
  rationale: A leitura modal se integra bem à condição precedente e à pergunta retórica, mas a formulação hebraica também permite uma leitura voltada ao passado, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão poética, a metáfora de “fundamentos” e a ambiguidade verbal relevante por meio de nota.
