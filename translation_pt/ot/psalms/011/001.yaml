base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: pt
  text: 'Ao regente. De Davi.


    No SENHOR busquei refúgio. Como vocês podem me dizer: “Fuja para o seu monte como um pássaro”?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto escrito (ketiv) traz formas plurais: “Fujam para o monte de vocês como um pássaro.” A leitura tradicional (qere) traz o singular, dirigido ao salmista: “Fuja para o seu monte como um pássaro.”'
    reason: Registra de forma precisa a variação entre o ketiv e o qere, enquanto o texto principal segue a leitura tradicional singular.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Traduz o título musical de modo conciso e evita especificar além do hebraico se a função era reger o canto, dirigir os músicos ou supervisionar a execução.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Preserva a construção breve do cabeçalho e sua possível indicação de autoria, associação ou dedicação, sem explicitar uma relação que o hebraico não define.
- source_word: בַּיהוָה חָסִיתִי
  choice: No SENHOR me refugio
  rationale: Expressa a confiança presente decorrente de ter buscado refúgio. SENHOR segue a convenção portuguesa para o nome divino יהוה.
- source_word: לְנַפְשִׁי
  choice: me
  rationale: נפשׁ com sufixo de primeira pessoa funciona aqui naturalmente como referência à própria pessoa; 'à minha alma' seria possível, mas menos idiomático e poderia sugerir uma distinção antropológica indevida.
- source_word: הַרְכֶם
  choice: o seu monte
  rationale: Na fala dirigida ao salmista, o possessivo é vertido no singular conforme a leitura tradicional do imperativo, mantendo a imagem de um lugar pessoal de fuga.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida, sem alterar a identidade do nome no texto-fonte.
- issue: Sentido de חָסִיתִי
  choice: me refugio
  alternative: busquei refúgio
  rationale: O perfeito hebraico pode apresentar uma ação já tomada com validade presente; a formulação escolhida comunica a postura vigente de confiança sem restringi-la a um único momento passado.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. A pergunta conserva o tom de protesto confiante do salmista. A pontuação separa o cabeçalho litúrgico do poema.
