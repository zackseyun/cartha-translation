base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: pt
  text: Que sejam envergonhados e humilhados, todos juntos, os que procuram tirar a minha vida[a][b]; que recuem e sejam desonrados os que têm prazer na minha desgraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha alma/vida”; neste contexto, a expressão se refere à vida do salmista, que os inimigos procuram tirar.'
    reason: lexical_alternative
  - marker: b
    text: Ou “destruir a minha vida” ou “consumi-la”; o verbo hebraico transmite a ideia de levá-la ao fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: passem vergonha
  rationale: Expressa de modo natural em português a experiência pública de vergonha desejada na forma imprecatória do verso.
- source_word: וְיַחְפְּרוּ
  choice: e sejam humilhados
  rationale: Preserva a intensificação paralela de בוש e evita termos pouco correntes como “confundidos” neste sentido.
- source_word: יַחַד
  choice: todos juntos
  rationale: Indica que os inimigos sofrerão conjuntamente o vexame; a formulação é clara e enfática em português.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: os que procuram acabar com a minha vida
  rationale: נפשׁ designa aqui a vida ou a própria pessoa, e o contexto explicita a intenção hostil. A construção foi integrada ao infinitivo seguinte para soar natural em português.
- source_word: לִסְפּוֹתָהּ
  choice: acabar com
  rationale: O verbo pode significar eliminar, consumir ou levar ao fim. “Acabar com” comunica claramente a intenção de matar sem eliminar as alternativas lexicais, registradas em nota.
- source_word: יִסֹּגוּ אָחוֹר
  choice: recuem
  rationale: Traduz de maneira idiomática a ideia hebraica de voltar para trás ou retirar-se, sem redundância artificial.
- source_word: וְיִכָּלְמוּ
  choice: e sejam desonrados
  rationale: Mantém o campo semântico de vergonha e desgraça, ao mesmo tempo que distingue este verbo dos dois termos paralelos da primeira oração.
- source_word: חֲפֵצֵי רָעָתִי
  choice: os que têm prazer na minha desgraça
  rationale: חפץ pode indicar prazer ou desejo, e רעה se refere aqui ao mal ou calamidade que sobrevém ao salmista, não à sua maldade moral.
