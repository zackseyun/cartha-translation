id: PSA.40.4
reference: Psalms 40:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: pt
  text: Feliz o homem que faz de Yahweh a sua confiança[a] e não se volta para os arrogantes[b], nem para os que se desviam para a falsidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado o homem que põe em Yahweh a sua confiança”. A expressão hebraica pode comunicar tanto felicidade quanto uma condição de favor digna de ser celebrada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os soberbos”. O hebraico é mais bem entendido aqui como referência a pessoas arrogantes, e não ao nome próprio Raabe.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para a mentira” ou “para o engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança expressa a condição digna e favorecida de alguém. Em português atual, “Feliz” é natural e preserva o tom sapiencial; “Bem-aventurado” seria possível, mas é mais tradicional e menos corrente.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: O substantivo masculino singular designa um homem e aqui tem força representativa numa máxima sapiencial. A tradução mantém a forma masculina da fonte.
- source_word: שָׂם
  choice: faz de
  rationale: O verbo significa pôr ou estabelecer. A construção portuguesa “faz de Yahweh a sua confiança” comunica de modo natural a relação predicativa do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִבְטַחוֹ
  choice: a sua confiança
  rationale: O substantivo indica aquilo ou aquele em quem se deposita confiança. “A sua confiança” preserva a concisão e combina naturalmente com “faz de”.
- source_word: פָנָה אֶל
  choice: se volta para
  rationale: A expressão descreve voltar-se para alguém ou algo, com a possível nuance de buscar apoio ou dar atenção; a tradução conserva essa imagem sem explicá-la em excesso.
- source_word: רְהָבִים
  choice: os arrogantes
  rationale: Neste plural, o termo é mais provavelmente um substantivo comum referente a pessoas soberbas ou arrogantes, e não o nome próprio Raabe.
- source_word: שָׂטֵי
  choice: os que se desviam
  rationale: O particípio exprime pessoas que se afastam ou desviam. A formulação mantém o sentido verbal sem introduzir a noção mais específica de apostasia.
- source_word: כָזָב
  choice: a falsidade
  rationale: O substantivo singular pode significar falsidade, mentira ou engano. “Falsidade” preserva o caráter abstrato e a amplitude do termo.
theological_decisions:
- issue: Masculino singular representativo na fórmula sapiencial
  choice: o homem
  alternative: a pessoa; aquele
  rationale: O hebraico emprega גֶּבֶר, substantivo masculino singular. A tradução preserva essa forma, embora o princípio expresso possa ter alcance representativo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Identidade de רְהָבִים
  choice: os arrogantes
  alternative: Raabe; os soberbos
  rationale: A forma plural e o paralelismo com os que se desviam para a falsidade favorecem a leitura como descrição de pessoas arrogantes, não como referência ao nome próprio Raabe.
- issue: Relação entre os arrogantes e os que se desviam
  choice: duas expressões coordenadas, sem decidir se são grupos distintos
  alternative: 'uma única expressão em aposição: os arrogantes que se desviam para a falsidade'
  rationale: A sintaxe permite proximidade sem exigir que a tradução identifique plenamente os dois grupos. “Nem” mantém a coordenação e evita resolver além do necessário a relação entre eles.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Feliz” evita o arcaísmo relativo de “bem-aventurado”, registrado em nota. A construção “faz de Yahweh a sua confiança” conserva a imagem compacta do hebraico. Os marcadores [a], [b] e [c] aparecem no texto principal e correspondem exatamente às notas.
