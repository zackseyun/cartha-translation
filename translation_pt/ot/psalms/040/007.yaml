base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: pt
  text: 'Então eu disse: “Eis que vim[b]; no rolo do livro está escrito a meu respeito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para mim” ou “prescrito para mim”. A expressão hebraica pode indicar o que foi escrito a respeito do falante ou o que foi estabelecido para ele.'
    reason: alternative_reading
  - marker: b
    text: Citado em Hebreus 10:7 em relação ao Messias.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal e introduz a resposta do salmista de modo natural em português.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: Reproduz diretamente a primeira pessoa do perfeito de אמר e introduz a fala citada.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força enfática e apresentativa da partícula hebraica em registro poético digno e ainda compreensível.
- source_word: בָאתִי
  choice: venho
  rationale: No contexto de apresentação voluntária, o perfeito hebraico expressa a chegada do falante diante de Deus; o presente português comunica naturalmente essa disponibilidade imediata, sem reduzir a frase a uma ação passada.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: no rolo do livro
  rationale: Mantém a imagem concreta de מְגִלָּה, um rolo escrito, e representa a construção hebraica sem a reduzir simplesmente a “livro”.
- source_word: כָּתוּב
  choice: está escrito
  rationale: Expressa de forma idiomática em português o estado resultante indicado pelo particípio passivo.
- source_word: עָלָי
  choice: a meu respeito
  rationale: É a leitura contextual mais direta de עַל com sufixo pessoal no âmbito daquilo que consta num documento, preservando em nota as possibilidades “para mim” e “prescrito para mim”.
theological_decisions:
- issue: Sentido de עָלָי num versículo posteriormente citado em Hebreus 10
  choice: a meu respeito
  alternative: para mim; prescrito para mim
  rationale: A tradução principal conserva o sentido imediato mais provável no salmo, sem fazer a releitura cristológica posterior controlar silenciosamente o hebraico. A nota mantém a ambiguidade legítima da expressão.
- issue: Relação do versículo com sua citação no Novo Testamento
  choice: Registrar a conexão em nota
  alternative: Inserir uma identificação messiânica explícita no texto principal
  rationale: A nota informa a recepção do versículo em Hebreus 10:7 sem acrescentar ao corpo do salmo uma identificação que não é expressa lexicalmente neste versículo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Eis que” conserva o tom poético elevado; “a meu respeito” evita coloquialismo excessivo. A ordem das marcas acompanha precisamente o conteúdo de cada nota.
