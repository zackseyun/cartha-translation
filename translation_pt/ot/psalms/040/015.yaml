  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: pt
  text: 'Fiquem estarrecidos[a] por causa[b] de sua vergonha os que me dizem: “Ahá! Ahá!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem desolados” ou “fiquem atônitos”; o verbo hebraico pode indicar devastação ou espanto aterrador.
