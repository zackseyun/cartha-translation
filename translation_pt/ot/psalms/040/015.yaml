  - marker: b
    text: Literalmente, “sobre o calcanhar de sua vergonha”; a expressão hebraica indica causa ou consequência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: fiquem estarrecidos
  rationale: O qal imperfeito de שׁמם pode indicar desolação ou espanto paralisante. “Fiquem estarrecidos” preserva o impacto de ruína e assombro sem escolher exclusivamente um dos dois matizes.
- source_word: עַל עֵקֶב
  choice: por causa
  rationale: A expressão, literalmente relacionada ao que vem no ‘calcanhar’ ou rastro de algo, assume aqui valor causal ou consequencial. “Por causa” comunica esse sentido com naturalidade em português.
- source_word: בָּשְׁתָּם
  choice: sua vergonha
  rationale: Traduz diretamente o substantivo que denota vergonha, desonra ou humilhação pública. No contexto, o pronome se refere aos que zombam do salmista.
- source_word: הָאֹמְרִים לִי
  choice: os que me dizem
  rationale: O artigo com o particípio tem função substantivada; “os que me dizem” reproduz essa construção de modo claro e natural.
- source_word: הֶאָח הֶאָח
  choice: Ahá! Ahá!
  rationale: Interjeição de zombaria e satisfação maliciosa. “Ahá! Ahá!” conserva a forma repetida e a força provocadora sem explicitar além do hebraico.
