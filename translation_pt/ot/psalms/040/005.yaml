base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: pt
  text: Muitas são as coisas que fizeste, ó Yahweh, meu Deus — as tuas maravilhas e os teus planos para nós[a]. Não há quem se compare a ti. Se eu as anunciasse e delas falasse, seriam mais do que se pode contar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus pensamentos a nosso respeito”.'
    reason: Alternativa lexical legítima para מַחְשְׁבֹתֶיךָ אֵלֵינוּ, que pode designar pensamentos, intenções ou planos de Deus dirigidos ao povo.
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Muitas coisas fizeste
  rationale: O plural רַבּוֹת expressa a grande quantidade dos atos divinos; “coisas” explicita em português o objeto implícito sem acrescentar conteúdo específico.
- source_word: יְהוָה אֱלֹהַי
  choice: ó Yahweh, meu Deus
  rationale: Mantém o nome divino como nome próprio e preserva a forma pessoal e direta da invocação.
- source_word: נִפְלְאֹתֶיךָ
  choice: as tuas maravilhas
  rationale: Conserva de modo conciso o sentido de atos extraordinários realizados por Deus.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: e os teus planos para nós
  rationale: מַחְשָׁבוֹת pode indicar pensamentos, propósitos ou planos. “Planos para nós” comunica intenção dirigida ao povo em português natural, enquanto a alternativa mais literal fica registrada em nota.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Não há quem se compare a ti
  rationale: Expressa com naturalidade o idiomatismo hebraico de incomparabilidade.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Se eu as anunciasse e delas falasse
  rationale: As formas coortativas são entendidas contextualmente como uma condição que conduz à impossibilidade de enumerar todas as obras; os pronomes retomam as coisas, maravilhas e planos mencionados.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: seriam numerosas demais para contar
  rationale: No contexto, עָצְמוּ indica quantidade excessiva, e מִסַּפֵּר transmite a ideia de exceder toda possibilidade de contagem ou enumeração.
theological_decisions:
- issue: Sentido dos מַחְשָׁבוֹת de Deus dirigidos ao povo
  choice: os teus planos para nós
  alternative: os teus pensamentos a nosso respeito
  rationale: A formulação comunica propósito divino benevolente sem impor ao verso um sistema posterior de providência ou predestinação; a amplitude lexical é preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural e cadência poética moderada. A segunda pessoa do singular preserva o tom direto da oração, e “Yahweh” translitera o nome divino.
