  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: pt
  text: Pois males sem conta me cercaram[a]; minhas iniquidades[b] me alcançaram, e não consigo ver. São mais numerosas que os cabelos da minha cabeça, e meu coração me abandonou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “incontáveis” ou “numerosos demais para contar”.'
    reason: lexical_alternative
  - marker: b
    text: “Minhas iniquidades” também pode ser traduzido por “meus pecados” ou “minha culpa”; o hebraico pode abranger tanto os atos perversos como a culpa que acarretam.
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode transmitir a ideia de que o coração desfaleceu, isto é, de perda de força ou coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e preserva de modo natural o valor explicativo da conjunção.
- source_word: אָפְפוּ עָלַי
  choice: me cercaram
  rationale: Mantém a imagem de males envolvendo o salmista por todos os lados, em português claro e atual.
- source_word: רָעוֹת
  choice: males
  rationale: Preserva a amplitude do hebraico, que pode abranger males, desgraças e calamidades, sem restringir o sentido apenas a aflições.
- source_word: עַד אֵין מִסְפָּר
  choice: sem conta
  rationale: Expressa a ideia de quantidade inumerável em formulação concisa, natural e digna.
- source_word: הִשִּׂיגוּנִי
  choice: me alcançaram
  rationale: Conserva a imagem de algo que chega até a pessoa ou a alcança, sem decidir além do que o verbo exige se ela foi inteiramente vencida.
- source_word: עֲוֹנֹתַי
  choice: minhas iniquidades
  rationale: Mantém o peso moral do termo e sua possível abrangência de atos perversos e culpa, preservando a tensão entre pecado e seu fardo.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: e não consigo ver
  rationale: Reproduz diretamente a incapacidade de ver sem especificar se a causa é física, emocional ou figurada.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: São mais numerosas que os cabelos da minha cabeça
  rationale: No contexto comparativo, o verbo indica superioridade numérica; a formulação comunica claramente a imagem hebraica.
- source_word: וְלִבִּי עֲזָבָנִי
  choice: e meu coração me abandonou
  rationale: Preserva a metáfora literal e sua abertura sem reduzi-la exclusivamente à perda de coragem, força ou lucidez.
theological_decisions:
- issue: Se עֲוֹנֹתַי designa os pecados do salmista, sua culpa ou as consequências desses pecados
  choice: minhas iniquidades
  alternative: minha culpa; as consequências dos meus pecados
  rationale: O possessivo favorece a referência às próprias iniquidades do salmista, enquanto o campo semântico também pode incluir a culpa que elas acarretam. A tradução conserva essa tensão e não converte o termo em simples sofrimento externo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e poético sem arcaísmos desnecessários. A formulação mantém as imagens hebraicas e assinala em notas as principais alternativas sem resolver ambiguidades legítimas.
