  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: pt
  text: Ele pôs em minha boca um cântico novo, um louvor ao nosso Deus. Muitos verão, temerão[a] e confiarão em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficarão cheios de temor reverente”. O verbo hebraico pode expressar medo, reverência ou profunda admiração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: pôs
  rationale: No idioma formado com “em minha boca”, נתן tem o sentido natural de colocar ou pôr, preservando a imagem concreta do hebraico.
- source_word: בְּפִי
  choice: em minha boca
  rationale: Tradução direta que mantém a vívida imagem corporal do texto.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Formulação clara e tradicional em português, com registro poético adequado aos Salmos.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: um louvor ao nosso Deus
  rationale: A expressão está em aposição a “um cântico novo” e especifica seu caráter ou conteúdo sem acrescentar uma relação não explícita no hebraico.
- source_word: יִרְאוּ רַבִּים
  choice: Muitos verão
  rationale: O imperfeito expressa naturalmente o resultado futuro da ação divina testemunhada por muitas pessoas.
- source_word: וְיִירָאוּ
  choice: temerão
  rationale: Preserva a força e a amplitude de ירא, que pode envolver medo, reverência e admiração diante de Deus.
- source_word: וְיִבְטְחוּ
  choice: confiarão
  rationale: בטח significa confiar ou apoiar-se com segurança; a forma simples é natural em português e acompanha a sequência verbal.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama e traduz naturalmente a preposição regida por “confiar”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Amplitude de וְיִירָאוּ como reação à obra de Deus
  choice: temerão
  alternative: ficarão maravilhados; terão reverência
  rationale: “Temerão” mantém a tensão bíblica entre medo e reverência, enquanto a nota registra a amplitude semântica em vez de limitar o verbo a uma emoção mais branda.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética. “Cântico” mantém o registro dos Salmos sem soar arcaico; a construção concisa preserva o paralelismo e a sequência ver–temer–confiar.
