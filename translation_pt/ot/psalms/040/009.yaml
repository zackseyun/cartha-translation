  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: pt
  text: Proclamei a justiça[a] na grande assembleia; eis que não refreei meus lábios[b]. Ó Yahweh, tu sabes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O hebraico צֶדֶק pode expressar tanto retidão moral quanto justiça.
    reason: lexical_alternative
  - marker: b
    text: Ou “não retive meus lábios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: Proclamei
  rationale: O piel de בשר indica anunciar ou trazer notícias, muitas vezes boas. “Proclamei” conserva o caráter público e enfático do anúncio sem acrescentar uma formulação especificamente evangelística.
- source_word: צֶדֶק
  choice: a justiça
  rationale: צֶדֶק abrange retidão moral e justiça. “Justiça” é natural em português e preserva a dimensão pública e ética do termo; a alternativa “retidão” é indicada em nota.
- source_word: בְּקָהָל רָב
  choice: na grande assembleia
  rationale: קהל designa uma comunidade reunida, e רב a qualifica como grande ou numerosa. A expressão mantém o cenário público e comunitário.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função enfática do marcador discursivo e seu tom poético, sem perder clareza para o leitor moderno.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: não contive os meus lábios
  rationale: Preserva a imagem concreta dos “lábios” e expressa o sentido de não restringir ou reter a fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אַתָּה יָדָעְתָּ
  choice: tu o sabes
  rationale: O perfeito hebraico expressa aqui um conhecimento presente reconhecido pelo salmista. O pronome “o” explicita apenas o referente contextual — o fato de ele não ter silenciado — sem resolver além do necessário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Ó Yahweh
  alternative: Ó SENHOR
  rationale: O texto emprega diretamente o tetragrama. A transliteração preserva o nome pessoal divino, e “ó” assinala com naturalidade o vocativo em português.
- issue: Amplitude semântica de צֶדֶק
  choice: justiça
  alternative: retidão
  rationale: O termo pode envolver tanto conformidade moral quanto justiça em sentido público ou judicial. O texto principal usa “justiça”, enquanto a nota preserva a alternativa sem eliminar a amplitude do hebraico.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e alcance internacional. A formulação conserva o paralelismo poético, a imagem dos lábios e a ênfase de “eis que”, evitando linguagem excessivamente arcaica.
