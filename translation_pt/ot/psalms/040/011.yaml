source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: pt
  text: Tu, ó Yahweh, não reterás de mim a tua compaixão[a]; o teu amor leal e a tua fidelidade[b] sempre me guardarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não retenhas de mim a tua compaixão”, entendendo o verbo como uma súplica, e não como uma declaração de confiança.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a tua verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, de acordo com a orientação do projeto.
- source_word: תִכְלָא
  choice: não reterás
  rationale: כלא significa deter ou reter. O futuro mantém o valor natural do yiqtol como declaração confiante, sem excluir a possível nuance de súplica indicada em nota.
- source_word: רַחֲמֶיךָ
  choice: a tua compaixão
  rationale: Embora formalmente plural em hebraico, o substantivo expressa a compaixão misericordiosa de Deus; o singular coletivo é natural em português.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: Comunica tanto a bondade amorosa quanto a constância relacional de חסד, sem tornar explícita na tradução uma interpretação exclusivamente pactual.
- source_word: אֲמִתְּךָ
  choice: a tua fidelidade
  rationale: No paralelismo com חסד e como agente de proteção, אמת destaca aqui a confiabilidade de Deus; “verdade” continua sendo alternativa lexical possível.
- source_word: תָּמִיד
  choice: sempre
  rationale: Expressa de modo atual e natural a continuidade da ação protetora.
- source_word: יִצְּרוּנִי
  choice: me guardarão
  rationale: נצר tem sentido de guardar, proteger ou preservar. O plural concorda com os dois sujeitos coordenados, “amor leal” e “fidelidade”.
theological_decisions:
- issue: Sentido modal de תִכְלָא
  choice: 'declaração confiante: “não reterás”'
  alternative: 'súplica: “não retenhas”'
  rationale: A forma é um imperfeito de segunda pessoa masculina singular e admite naturalmente sentido futuro; no contexto de oração, porém, pode ter força volitiva semelhante à de uma súplica, alternativa preservada em nota.
- issue: Sentido de אֱמֶת no par חֶסֶד וֶאֱמֶת
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” exprime a confiabilidade divina que, juntamente com o amor leal, guarda o salmista, sem negar o campo semântico de “verdade”.
- issue: Representação do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Mantém visível o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” para conservar as formas de segunda pessoa do hebraico. “Amor leal” evita o arcaísmo de expressões como “benignidade” e mantém a dimensão de constância de חסד. A ordem inicial “Tu, ó Yahweh” preserva a ênfase do pronome hebraico.
