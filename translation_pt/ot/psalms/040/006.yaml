  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: pt
  text: Sacrifício e oferta[a] não desejaste; abriste-me os ouvidos[b]; holocausto e oferta pelo pecado não pediste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “oferta de cereal”.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, em hebraico: “cavaste para mim ouvidos”, provavelmente uma expressão idiomática para tornar alguém capaz de ouvir ou obedecer. A Septuaginta, seguida em Hebreus 10:5, traz: “um corpo preparaste para mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifício
  rationale: É o termo português corrente e adequado para a oferta animal no contexto do culto.
- source_word: מִנְחָה
  choice: oferta
  rationale: Preserva a amplitude do termo e forma um par poético natural com “sacrifício”; o sentido mais específico de oferta de cereal é indicado em nota.
- source_word: חָפַצְתָּ
  choice: não desejaste
  rationale: Expressa vontade e prazer sem intensificar indevidamente a nuance do verbo hebraico.
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: abriste-me os ouvidos
  rationale: Traduz de modo natural o provável sentido idiomático da imagem hebraica literal, “cavaste para mim ouvidos”, ligada à capacidade de ouvir e obedecer.
- source_word: עוֹלָה
  choice: holocausto
  rationale: Termo tradicional e preciso em português para o sacrifício inteiramente queimado.
- source_word: חֲטָאָה
  choice: oferta pelo pecado
  rationale: O paralelismo sacrificial exige o sentido cultual, não o conceito abstrato de pecado.
- source_word: שָׁאָלְתָּ
  choice: não pediste
  rationale: Mantém o sentido direto do verbo hebraico e o paralelismo com “não desejaste”, sem o reforço interpretativo de “exigiste”.
theological_decisions:
- issue: Relação entre o hebraico “cavaste para mim ouvidos” e a citação de Hebreus 10:5, baseada na Septuaginta
  choice: Manter no texto principal o sentido da leitura hebraica como “abriste-me os ouvidos” e registrar em nota tanto a imagem literal hebraica quanto a forma grega.
  alternative: “um corpo preparaste para mim”
  rationale: O texto principal deve representar o hebraico massorético do salmo, sem harmonizá-lo com a Septuaginta ou com Hebreus; a nota preserva com transparência a importante diferença textual e canônica.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe poética concisa. “Holocausto” conserva a terminologia bíblica amplamente reconhecida; “abriste-me os ouvidos” comunica naturalmente o provável valor idiomático sem ocultar em nota a formulação concreta do hebraico.
