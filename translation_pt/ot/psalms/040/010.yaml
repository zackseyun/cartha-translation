  source_fidelity: O texto traduz com fidelidade os três membros poéticos do hebraico. “Não escondi ... no íntimo do meu coração” transmite adequadamente a imagem de retenção interior; “proclamei a tua fidelidade e a tua salvação” é uma formulação contextual e natural para אָמַרְתִּי; e “não ocultei ... da grande assembleia” reproduz de modo plausível a relação de כִחַדְתִּי com לְקָהָל רָב. A nota d preserva corretamente a possibilidade de entender a assembleia como o público diante do qual se fez a proclamação.
