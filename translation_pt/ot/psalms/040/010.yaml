id: PSA.40.10
reference: Psalms 40:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: pt
  text: Não escondi a tua justiça[a] no íntimo do meu coração; proclamei a tua fidelidade e a tua salvação[b]. Não ocultei o teu amor leal[c] e a tua verdade da grande assembleia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua retidão”. O hebraico também pode se referir à ação justa ou à vindicação de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “o teu livramento”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o teu amor de aliança”. O termo hebraico reúne as ideias de amor, lealdade e compromisso duradouro.
    reason: lexical_alternative
  - marker: d
    text: Ou “diante da grande assembleia”. A construção hebraica pode destacar tanto aqueles de quem nada foi ocultado quanto o público diante do qual essas coisas foram proclamadas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: a tua justiça
  rationale: “Justiça” preserva a amplitude de צְדָקָה, que pode indicar retidão moral, ação justa ou vindicação divina, e se encaixa naturalmente na sequência de atributos e atos de Deus.
- source_word: כִסִּיתִי
  choice: não escondi
  rationale: Embora כסה signifique literalmente “cobrir”, com “no íntimo do meu coração” o sentido idiomático é guardar oculto e não tornar conhecido.
- source_word: בְּתוֹךְ לִבִּי
  choice: no íntimo do meu coração
  rationale: A expressão mantém a imagem hebraica do coração como interioridade, em português natural e digno.
- source_word: אֱמוּנָתְךָ
  choice: a tua fidelidade
  rationale: Neste contexto, אֱמוּנָה designa a confiabilidade constante de Deus, não a fé subjetiva de quem fala.
- source_word: וּתְשׁוּעָתְךָ
  choice: e a tua salvação
  rationale: “Salvação” expressa adequadamente a ação divina de resgatar; “livramento” continua sendo uma alternativa contextual válida.
- source_word: אָמָרְתִּי
  choice: proclamei
  rationale: O verbo básico significa “disse”, mas aqui recebe como objetos a fidelidade e a salvação de Deus; “proclamei” comunica de modo conciso a declaração pública sugerida pelo contexto da assembleia.
- source_word: כִחַדְתִּי
  choice: não ocultei
  rationale: כחד significa ocultar ou reter. “Ocultei” preserva o paralelismo com “escondi” sem apagar a variação lexical do hebraico.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: חֶסֶד reúne amor, lealdade e compromisso duradouro. “Amor leal” é claro e preserva essa combinação sem recorrer a linguagem arcaica.
- source_word: וַאֲמִתְּךָ
  choice: e a tua verdade
  rationale: “Verdade” preserva a distinção lexical em relação a אֱמוּנָה, traduzida anteriormente por “fidelidade”, embora אֱמֶת também possa envolver confiabilidade.
- source_word: לְקָהָל רָב
  choice: da grande assembleia
  rationale: 'Com o verbo “ocultar”, a preposição לְ pode ser expressa naturalmente como “de”: o salmista não reteve essas coisas do povo reunido. A posição final também permite entender a assembleia como o âmbito diante do qual ocorreu a proclamação.'
theological_decisions:
- issue: Distinção entre os termos correlatos אֱמוּנָה e אֱמֶת
  choice: Traduzir אֱמוּנָתְךָ por “a tua fidelidade” e אֲמִתְּךָ por “a tua verdade”
  alternative: Traduzir os dois termos por palavras sobrepostas, como “fidelidade”, ou inverter as escolhas
  rationale: A distinção mantém a acumulação poética de qualidades divinas e evita reduzir dois termos hebraicos relacionados a um único conceito.
- issue: Valor temporal dos verbos hebraicos perfeitos
  choice: 'Usar o pretérito perfeito em português: “não escondi”, “proclamei”, “não ocultei”'
  alternative: Usar construções como “não tenho escondido”, “tenho proclamado” e “não tenho ocultado”
  rationale: O pretérito perfeito é a forma mais natural em português para testemunhar ações realizadas. O perfeito composto sugeriria repetição ou continuidade habitual, sentido que a gramática hebraica não exige.
- issue: Relação de לְקָהָל רָב com a declaração e a ocultação
  choice: 'Ligar a expressão diretamente a “não ocultei”: “da grande assembleia”'
  alternative: 'Entendê-la como o cenário da proclamação: “diante da grande assembleia”'
  rationale: A regência com o verbo de ocultar favorece “da”, mas a ordem poética admite a leitura pública mais ampla; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “tu” conforme a referência direta a Deus e evita formas arcaicas. O paralelismo poético é mantido por “não escondi”/“não ocultei”, enquanto “proclamei” torna explícita, sem excessos, a dimensão pública do testemunho.
