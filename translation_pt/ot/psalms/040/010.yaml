  terminology: “Justiça” é uma escolha semanticamente defensável para צְדָקָה e a nota registra “retidão” e o possível matiz de vindicação. “Fidelidade”, “salvação”, “amor leal” e “verdade” distinguem de maneira útil os termos hebraicos correlatos sem impor leitura doutrinária. As quatro notas estão ancoradas em posições claras e suas alternativas refletem ambiguidades lexicais reais.
