lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: O termo designa quem dirige ou supervisiona a execução musical. «Ao regente» é conciso, natural em títulos de salmos e representa o prefixo ל com valor de destinação.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Em títulos de salmos, ל pode indicar autoria, associação, pertença ou dedicação. «De Davi» mantém essa amplitude melhor que uma formulação que atribua autoria de modo inequívoco.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o rótulo habitual do gênero, com conotação musical. Em português, «Salmo» é claro e consagrado; o artigo indefinido é dispensável neste título breve.
theological_decisions:
- issue: Sentido da expressão davídica no título
  choice: De Davi
  alternative: Por Davi; Para Davi
  rationale: O hebraico não obriga a decidir entre autoria, associação e dedicação. A tradução preserva essa abertura sem afirmar mais do que o título diz.
translation_notes:
  register: Título breve, digno e corrente em português internacional, com boa legibilidade brasileira. «Regente» evita restringir a função especificamente a um coro, e a nota fica ligada à expressão «De Davi», que ela explica.
