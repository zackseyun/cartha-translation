  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: pt
  text: 'Que todos os que te buscam se regozijem e se alegrem em ti; que os que amam a tua salvação[a] digam sempre: “Seja Yahweh engrandecido!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu livramento”. O termo hebraico תְּשׁוּעָה pode significar “salvação” ou “livramento”.
    reason: lexical_alternative
  - marker: b
    text: A aclamação “Seja Yahweh engrandecido!” expressa o desejo de que a grandeza de Yahweh seja reconhecida publicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ
  choice: se regozijem
  rationale: O imperfeito qal pode expressar aqui um desejo, introduzido naturalmente em português por “Que”. “Regozijem-se” mantém o tom poético e distingue o verbo do paralelo seguinte.
- source_word: וְיִשְׂמְחוּ
  choice: e se alegrem
  rationale: Preserva o paralelismo com שׂושׂ sem reduzir os dois verbos a uma única expressão.
- source_word: בְּךָ
  choice: em ti
  rationale: A preposição indica de modo natural a esfera ou o fundamento da alegria, mantendo o foco em Deus.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: todos os que te buscam
  rationale: Expressa de forma corrente o particípio substantivado que caracteriza pessoas que buscam Deus.
- source_word: יֹאמְרוּ תָמִיד
  choice: digam sempre
  rationale: Comunica a ideia de fala repetida ou contínua em português claro e natural.
- source_word: יִגְדַּל יְהוָה
  choice: Seja Yahweh engrandecido!
  rationale: Conserva a força volitiva da forma hebraica e o caráter de aclamação, em vez de transformá-la numa simples afirmação de que Yahweh é grande.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: os que amam a tua salvação
  rationale: A formulação é natural e mantém a amplitude de תְּשׁוּעָה, que pode indicar tanto livramento concreto quanto salvação em sentido mais amplo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal por transliteração sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de תְּשׁוּעָה no contexto da oração do salmo
  choice: salvação
  alternative: livramento
  rationale: “Salvação” preserva tanto a possibilidade de socorro concreto quanto a ressonância teológica mais ampla, sem eliminar a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição poética “se regozijem e se alegrem” preserva os dois verbos hebraicos, e a construção com “Que” comunica o valor de desejo ou oração.
