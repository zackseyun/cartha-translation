base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: pt
  text: Esperei com perseverança por Yahweh[a]; ele se inclinou para mim e ouviu o meu clamor por socorro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Esperando, esperei por Yahweh”, expressão enfática que também pode ser traduzida como “esperei pacientemente” ou “esperei com expectativa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Esperei com perseverança
  rationale: A construção hebraica com infinitivo absoluto e verbo finito intensifica a ação de esperar. A formulação comunica espera persistente e confiante em português natural, sem reproduzir de modo artificial a repetição hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּט אֵלַי
  choice: ele se inclinou para mim
  rationale: O verbo נטה pode significar inclinar-se, voltar-se ou estender-se. Neste contexto, descreve Yahweh dirigindo sua atenção ao salmista; “se inclinou para mim” preserva a imagem do hebraico e é compreensível em português.
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: שׁמע indica aqui ouvir com atenção o pedido. “Ouviu” mantém a formulação simples do texto e, com o complemento, sugere atenção responsiva sem tornar explícita uma resposta não declarada.
- source_word: שַׁוְעָתִי
  choice: o meu clamor por socorro
  rationale: שַׁוְעָה designa um grito ou clamor dirigido a alguém em busca de auxílio. “Clamor por socorro” expressa essa finalidade com clareza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal no texto, sem substituí-lo pelo título “SENHOR”; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Com perseverança” evita que “pacientemente” seja entendido apenas como estado emocional e conserva a ênfase hebraica na espera persistente. A colocação “se inclinou para mim” mantém a imagem poética do original.
