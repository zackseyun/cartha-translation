  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: pt
  text: Mas eu sou pobre e necessitado; o Senhor pensa em mim.[a] Tu és o meu auxílio e o meu libertador; meu Deus, não demores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tem consideração por mim” ou “pensará em mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: O pronome independente, ligado pela conjunção, destaca o salmista em contraste com o contexto anterior; “Mas eu” expressa isso naturalmente.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pobre e necessitado
  rationale: Mantém dois termos distintos, embora sobrepostos, para sua condição humilde, vulnerável e carente.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Trata-se do título divino Adonai, e não do nome YHWH; “o Senhor” é claro, digno e idiomático.
- source_word: יַחֲשָׁב לִי
  choice: cuida de mim
  rationale: Neste contexto de súplica, expressa naturalmente a ideia de levar alguém em consideração e ter atenção por ele, sem impor a noção mais específica de elaborar planos.
- source_word: עֶזְרָתִי
  choice: o meu auxílio
  rationale: Preserva o substantivo abstrato “auxílio”, em paralelo poético com o agente pessoal “libertador”.
- source_word: וּמְפַלְטִי
  choice: e o meu libertador
  rationale: O particípio substantivado designa aquele que livra ou conduz à segurança; “libertador” preserva essa força verbal.
- source_word: אֱלֹהַי אַל תְּאַחַר
  choice: meu Deus, não demores
  rationale: Mantém o apelo pessoal e a urgência da proibição hebraica em português atual e digno.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: meu Senhor
  rationale: A forma hebraica é o título divino Adonai, não o tetragrama; o contexto não exige acrescentar o possessivo “meu”.
- issue: Sentido de יַחֲשָׁב לִי
  choice: cuida de mim
  alternative: pensa em mim / leva-me em consideração
  rationale: A expressão admite pensar em alguém, considerá-lo ou atentar para ele. “Cuida de mim” comunica a consideração pessoal no contexto, enquanto a nota preserva as alternativas sem transformar a frase numa afirmação mais específica sobre planos providenciais.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo poético, o contraste inicial e a urgência da oração, evitando arcaísmos como “não tardes”.
