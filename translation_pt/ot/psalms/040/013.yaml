base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: pt
  text: Queiras[a], ó Yahweh, livrar-me; ó Yahweh, apressa-te[b] em ajudar-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dispõe-te a” ou “Sê favorável para”. O hebraico pede a disposição favorável de Yahweh para livrar o salmista.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vem depressa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: Queiras
  rationale: O imperativo de רצה pede a disposição favorável de Yahweh. “Queiras” conserva a nuance volitiva e funciona naturalmente como súplica em português, sem reduzir o verbo a uma simples fórmula de cortesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino, em vez de ser substituído pelo título “SENHOR”.
- source_word: לְהַצִּילֵנִי
  choice: livrar-me
  rationale: O infinitivo hifil de נצל com sufixo de primeira pessoa significa resgatar ou tirar alguém do perigo. “Livrar-me” é claro, idiomático e adequado ao registro dos Salmos.
- source_word: לְעֶזְרָתִי
  choice: em ajudar-me
  rationale: A expressão significa literalmente “para o meu auxílio”. Depois de “apressa-te”, “em ajudar-me” comunica de modo natural a assistência urgente pedida pelo salmista.
- source_word: חוּשָׁה
  choice: apressa-te
  rationale: O imperativo de חושׁ expressa urgência. “Apressa-te” preserva diretamente essa força e mantém um registro digno e atual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o tetragrama como nome próprio. “Yahweh” o preserva sem substituí-lo por um título.
- issue: Nuance da petição רְצֵה
  choice: Queiras
  alternative: Agrada-te; dispõe-te
  rationale: A forma pode exprimir agrado, favor ou disposição voluntária. “Queiras” mantém aberta essa amplitude volitiva, sem sugerir que o livramento seja apenas uma fonte de prazer.
translation_notes:
  register: Português moderno, claro e digno, com construção de súplica própria do registro poético. A repetição de “ó Yahweh” reproduz a invocação enfática do hebraico.
