id: PSA.40.8
reference: Psalms 40:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: pt
  text: Tenho prazer em fazer a tua vontade, meu Deus, e a tua lei[a] está no íntimo do meu ser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução”. O termo hebraico torá pode designar de modo mais amplo o ensino de Deus, e não somente normas legais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: em fazer
  rationale: O infinitivo construto de עשה com ל completa חפץ e indica aquilo em que o salmista tem prazer. “Em fazer” é natural em português após “tenho prazer”.
- source_word: רְצוֹנְךָ
  choice: a tua vontade
  rationale: רָצוֹן pode significar vontade, desejo, favor ou prazer; com o verbo “fazer”, “a tua vontade” preserva de modo claro o sentido volitivo.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: O sufixo de primeira pessoa do singular explicita a relação pessoal e funciona aqui como vocativo.
- source_word: חָפָצְתִּי
  choice: Tenho prazer
  rationale: חפץ expressa desejo, agrado ou deleite. O presente idiomático comunica a disposição contínua do salmista sem reduzir o verbo a um simples desejo.
- source_word: וְתוֹרָתְךָ
  choice: e a tua lei
  rationale: תּוֹרָה pode designar lei ou instrução. “Lei” mantém o peso pactual e escriturístico tradicional, enquanto a nota preserva o sentido mais amplo de ensino.
- source_word: בְּתוֹךְ
  choice: no íntimo de
  rationale: A expressão indica localização interior. “No íntimo de” é corrente, digna e comunica internalização.
- source_word: מֵעָי
  choice: meu ser
  rationale: מֵעֶה refere-se literalmente às partes internas e, por extensão, ao interior profundo da pessoa. Com “no íntimo de”, “meu ser” evita a imagem anatômica potencialmente enganosa sem substituí-la interpretativamente por “coração”.
theological_decisions:
- issue: Tradução de תּוֹרָה em contexto devocional
  choice: lei
  alternative: instrução
  rationale: “Lei” conserva a ressonância pactual e escriturística de תּוֹרָה nos Salmos. A nota registra “instrução” para não limitar o termo hebraico apenas a estatutos legais.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa (“tua”) coerentes com o discurso direto a Deus. “No íntimo do meu ser” preserva a força antropológica do hebraico em linguagem natural, sem recorrer ao arcaísmo anatômico “entranhas” nem à interpretação mais estreita “coração”.
