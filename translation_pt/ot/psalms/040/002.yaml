  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: pt
  text: Ele me tirou do poço do tumulto[a], do lamaçal; pôs os meus pés sobre uma rocha e firmou os meus passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do poço do estrondo” ou “do poço do ruído”; muitas traduções interpretam a expressão como “poço da desolação” ou “poço da destruição”.
    reason: alternativa lexical para שָׁאוֹן e registro de traduções interpretativas
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Ele me tirou
  rationale: O hifil de עלה indica fazer subir ou retirar de baixo; em português, “tirou” exprime naturalmente o resgate para fora do poço, sem perder a imagem concreta.
- source_word: מִבּוֹר
  choice: do poço
  rationale: בּוֹר pode designar poço, cisterna ou cova. “Poço” é claro e mantém a imagem vertical de onde o salmista é retirado.
- source_word: שָׁאוֹן
  choice: do tumulto
  rationale: שָׁאוֹן denota ruído, estrondo ou tumulto. “Tumulto” preserva o sentido lexical sem interpretar antecipadamente o poço como destruição ou desolação.
- source_word: מִטִּיט הַיָּוֵן
  choice: do lamaçal
  rationale: A combinação טִיט הַיָּוֵן descreve barro ou lama viscosa. “Lamaçal” comunica de modo conciso e natural a massa lodosa e instável, evitando uma repetição pouco idiomática em português.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: pôs os meus pés sobre uma rocha
  rationale: 'O hifil de קום significa fazer ficar de pé, estabelecer ou colocar firmemente. A formulação conserva os elementos concretos: pés e rocha.'
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: firmou os meus passos
  rationale: O polel de כון expressa tornar firme ou estabelecer, e אֲשֻׁרָי significa “meus passos”. A expressão é natural, digna e mantém o paralelismo com os pés postos sobre a rocha.
theological_decisions:
- issue: Preservar as imagens concretas ou explicá-las como livramento moral ou espiritual
  choice: Preservar no texto principal as imagens do poço, do lamaçal, dos pés, da rocha e dos passos
  alternative: Ele me resgatou da destruição e deu segurança à minha vida
  rationale: O hebraico apresenta metáforas físicas vívidas sem explicitar aqui uma única aplicação teológica. A tradução não deve resolver essa abertura interpretativa.
- issue: Sentido de שָׁאוֹן na expressão “poço do tumulto”
  choice: tumulto
  alternative: destruição, desolação, estrondo ou ruído
  rationale: “Tumulto” reflete diretamente o campo semântico de ruído e agitação e evita transformar uma expressão difícil numa interpretação mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Lamaçal” evita uma combinação redundante como “lama lodosa”, enquanto o restante conserva de perto as imagens e a estrutura poética do hebraico.
