base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: pt
  text: Derrama sobre eles a tua indignação, e que o ardor da tua ira[a] os alcance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o ardor do teu nariz”, expressão idiomática hebraica para ira intensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Derrama
  rationale: O imperativo de שׁפך mantém a imagem vívida de verter a indignação divina e soa natural em português.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל com sufixo de terceira pessoa masculina plural indica que a indignação é dirigida contra eles; “sobre eles” preserva naturalmente essa direção.
- source_word: זַעְמֶךָ
  choice: a tua indignação
  rationale: זַעַם expressa ira ou indignação, muitas vezes divina. “Indignação” conserva a dimensão moral e evita repetir “ira” na oração seguinte.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: e que o ardor da tua ira
  rationale: A expressão idiomática hebraica significa literalmente o ardor ou queimar do nariz e comunica ira intensa. “Ardor da tua ira” preserva a metáfora de calor com clareza e dignidade.
- source_word: יַשִּׂיגֵם
  choice: os alcance
  rationale: O hifil de נשׂג pode significar alcançar, apanhar ou atingir. “Os alcance” comunica a ira que chega até seus alvos sem acrescentar uma imagem ausente do texto.
theological_decisions:
- issue: Linguagem imprecatória dirigida aos inimigos
  choice: Manter o pedido direto para que a indignação e a ira de Deus venham sobre eles.
  alternative: Suavizar como “mostra-lhes o teu desagrado”.
  rationale: O hebraico contém uma petição explícita por juízo divino. A tradução preserva sua força e tensão teológica, sem amenizá-la nem explicá-la.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outras comunidades lusófonas. A colocação pronominal em “os alcance” mantém fluidez natural sem perder solenidade.
