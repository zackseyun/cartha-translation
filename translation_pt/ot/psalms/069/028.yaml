base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: pt
  text: Sejam apagados do livro da vida[a] e não sejam inscritos com os justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do livro dos vivos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: Sejam apagados
  rationale: O nifal imperfeito com força jussiva expressa aqui um pedido ou desejo imprecatório. “Apagados” preserva tanto a voz passiva quanto a imagem de remover nomes de um registro.
- source_word: מִסֵּפֶר
  choice: do livro
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito. “Livro” é natural nesta expressão e mantém a imagem registral.
- source_word: חַיִּים
  choice: da vida
  rationale: O substantivo plural pode significar “vida” ou “os vivos”. “Livro da vida” preserva a formulação bíblica tradicional sem definir de modo restritivo a natureza desse registro; a alternativa lexical é indicada em nota.
- source_word: וְעִם
  choice: e ... com
  rationale: A preposição עִם significa literalmente “com” e indica aqui associação aos justos no ato de serem inscritos.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Tradução substantivada corrente do plural, preservando a categoria moral do hebraico sem explicitação doutrinária adicional.
- source_word: אַל יִכָּתֵבוּ
  choice: não sejam inscritos
  rationale: אַל seguido do imperfeito tem força jussiva negativa. “Sejam inscritos” comunica de modo natural a escrita de nomes em um livro ou registro, mantendo a passividade do nifal de כתב.
theological_decisions:
- issue: Sentido de “livro da vida” no salmo imprecatório
  choice: Manter a metáfora “livro da vida” sem definir se ela se refere à vida terrena, à pertença ao povo da aliança ou à salvação escatológica.
  alternative: “livro dos vivos”, entendido mais diretamente como registro das pessoas vivas
  rationale: A expressão hebraica admite a ideia de um registro divino, mas o verso isolado não determina de forma inequívoca seu alcance teológico. A tradução conserva essa abertura.
- issue: Força da imprecação
  choice: 'Traduzir os verbos como pedido ou desejo: “Sejam... não sejam...”'
  alternative: 'Traduzir como previsão declarativa: “Serão apagados... não serão inscritos...”'
  rationale: No contexto da sequência imprecatória, as formas verbais têm valor jussivo, não meramente preditivo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com paralelismo conciso. “Inscritos” foi preferido a “escritos” por soar natural em referência à inclusão de nomes em um registro, sem abandonar a imagem do livro.
