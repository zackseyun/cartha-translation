base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: pt
  text: Louvarei o nome de Deus com um cântico e o engrandecerei com ações de graças[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um sacrifício de ação de graças”; o termo hebraico pode indicar tanto ações de graças quanto um sacrifício oferecido em gratidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Louvarei
  rationale: A forma cohortativa na primeira pessoa expressa propósito ou resolução. O futuro em português comunica essa determinação de modo natural e digno.
- source_word: שֵׁם אֱלֹהִים
  choice: o nome de Deus
  rationale: Mantém de maneira transparente a construção hebraica e sua força reverente.
- source_word: בְּשִׁיר
  choice: com um cântico
  rationale: A preposição בְּ indica aqui meio ou modo; “com um cântico” é uma formulação natural em português e preserva o sentido musical.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: e o engrandecerei
  rationale: O piel de גדל tem o sentido de declarar grande, exaltar ou enaltecer. “Engrandecerei” conserva a imagem hebraica e o paralelismo com “louvarei”; o pronome retoma Deus.
- source_word: בְתוֹדָה
  choice: com ações de graças
  rationale: תּוֹדָה pode indicar agradecimento ou uma oferta de gratidão. Neste paralelismo de louvor verbal e musical, o sentido de agradecimento é o mais provável.
theological_decisions:
- issue: Se תּוֹדָה designa ações de graças ou uma oferta de gratidão
  choice: ações de graças
  alternative: uma oferta de gratidão
  rationale: O contexto imediato reúne louvor, cântico e engrandecimento de Deus, favorecendo uma expressão verbal de gratidão. A possível referência sacrificial é preservada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. “Cântico” preserva o registro poético sem soar arcaico; “ações de graças” é uma expressão corrente no contexto de louvor.
