  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: pt
  text: E não escondas o teu rosto[a] do teu servo[b], pois estou angustiado; responde-me depressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua presença”. O hebraico diz literalmente “o teu rosto”, expressão que pode indicar favor ou presença atenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “escravo”. A palavra hebraica pode designar um servo ou um escravo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל
  choice: E não
  rationale: וְ liga esta súplica às petições anteriores, e אַל com o imperfeito expressa uma proibição ou pedido negativo. “E não” preserva a ligação simples sem acrescentar contraste.
- source_word: תַּסְתֵּר
  choice: escondas
  rationale: O verbo סתר significa “esconder, ocultar”. Mantê-lo conserva a imagem hebraica da face divina que não deve ser retirada do suplicante.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: A tradução literal preserva a imagem relacional e poética. No idioma hebraico, o “rosto” de Deus pode comunicar sua atenção, presença e favor.
- source_word: מֵעַבְדֶּךָ
  choice: do teu servo
  rationale: עבד pode designar servo ou escravo. Nesta oração, “servo” expressa naturalmente a humilde relação de pertencimento e serviço a Deus, sem excluir totalmente a nuance de sujeição.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da súplica e mantém de modo conciso a relação causal.
- source_word: צַר לִי
  choice: estou angustiado
  rationale: A construção hebraica descreve a condição aflitiva do salmista. “Estou angustiado” é natural em português e preserva a força pessoal e urgente da expressão.
- source_word: מַהֵר
  choice: depressa
  rationale: O termo exprime urgência, literalmente a ideia de apressar-se. “Depressa” funciona naturalmente como modificador do pedido seguinte.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: Em contexto de oração, ענה significa normalmente “responder”. A forma pronominal conserva o pedido direto do salmista.
theological_decisions:
- issue: Linguagem antropomórfica na relação com Deus
  choice: Manter “o teu rosto” no texto principal
  alternative: a tua presença
  rationale: A imagem do rosto de Deus comunica atenção, favor e proximidade relacional. Preservá-la evita reduzir a tensão e a riqueza poética a uma formulação abstrata.
- issue: Sentido de עבד na relação com Deus
  choice: servo
  alternative: escravo
  rationale: Embora o substantivo possa indicar um escravo, nesta fórmula de oração o foco recai na humilde pertença e no serviço a Deus. “Servo” é mais natural no contexto, e a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa do singular coerentes com o registro poético dos Salmos. A ordem foi levemente naturalizada para “o teu rosto do teu servo”, mantendo as imagens e a urgência do hebraico.
