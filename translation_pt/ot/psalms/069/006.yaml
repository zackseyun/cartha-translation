source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: pt
  text: Que os que esperam em ti[a] não sejam envergonhados por minha causa, Senhor Yahweh dos Exércitos[b]; que os que te buscam não sejam humilhados por minha causa, Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que aguardam por ti”. O particípio hebraico pode indicar uma espera marcada por esperança confiante.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Senhor Yahweh dos Exércitos”. “Yahweh” representa o nome divino יהוה; tradicionalmente, também se traduz “Senhor DEUS dos Exércitos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O qal de בוש expressa sofrer vergonha ou desonra. A construção portuguesa mantém o valor resultativo e se ajusta à súplica para que outros não venham a sofrer vergonha por causa do salmista.
- source_word: בִי
  choice: por minha causa
  rationale: 'Neste contexto, ב com o pronome pessoal tem força causal: o salmista teme tornar-se ocasião da vergonha ou humilhação dos fiéis.'
- source_word: קֹוֶיךָ
  choice: os que esperam em ti
  rationale: O particípio de קוה reúne as ideias de esperar e ter esperança. “Esperam em ti” preserva naturalmente em português tanto a expectativa confiante quanto o objeto pessoal dessa confiança.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Senhor Yahweh dos Exércitos
  rationale: “Senhor” representa אֲדֹנָי, “Yahweh” torna explícito o nome divino יהוה, e “dos Exércitos” conserva a imagem do título צְבָאוֹת sem substituí-la por uma paráfrase.
- source_word: יִכָּלְמוּ
  choice: sejam humilhados
  rationale: כלם se sobrepõe semanticamente a בוש, mas pode ressaltar humilhação ou desonra. A escolha preserva a variação lexical no paralelismo.
- source_word: מְבַקְשֶׁיךָ
  choice: os que te buscam
  rationale: O particípio de בקש indica busca contínua; a formulação é natural e direta em português.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: A expressão construta identifica o Deus de Israel e funciona aqui como vocativo, sem necessidade de acrescentar uma interjeição.
theological_decisions:
- issue: Representação do nome divino יהוה na invocação אֲדֹנָי יְהוָה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A opção mantém distintos o título אֲדֹנָי e o nome próprio יהוה, evitando ocultar o nome divino sob um título substitutivo.
- issue: Sentido da vergonha dos fiéis “por minha causa”
  choice: Não explicitar a razão pela qual a situação do salmista poderia envergonhá-los
  alternative: Interpretar que sua queda moral ou o fracasso de sua esperança causaria a vergonha
  rationale: O hebraico afirma apenas que o salmista poderia ser a ocasião da vergonha deles; não especifica o mecanismo. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem poética moderada. A repetição de “por minha causa” e a distinção entre “envergonhados” e “humilhados” preservam o paralelismo hebraico. Todos os marcadores de nota aparecem no texto principal.
