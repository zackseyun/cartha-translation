  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: pt
  text: Que a mesa diante deles se torne uma armadilha, e que seu bem-estar se torne um laço[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas ofertas de comunhão”. O termo hebraico também pode designar ofertas sacrificiais de paz, embora aqui possa referir-se mais geralmente ao bem-estar ou à segurança deles.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Que ... se torne
  rationale: O jussivo expressa um desejo imprecatório. A construção portuguesa com “que” e o presente do subjuntivo transmite essa força de modo natural e digno.
- source_word: שֻׁלְחָנָם
  choice: a mesa diante deles
  rationale: Preserva a imagem concreta da mesa como lugar de alimento, provisão ou banquete, sem explicá-la no corpo do versículo.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Reproduz a expressão espacial hebraica e mantém a ironia de algo que está abertamente diante deles tornar-se perigoso.
- source_word: לְפָח
  choice: uma armadilha
  rationale: פַּח designa uma armadilha ou laço. “Armadilha” permite distinguir este termo do substantivo paralelo מוֹקֵשׁ.
- source_word: וְלִשְׁלוֹמִים
  choice: e, para seu bem-estar
  rationale: שְׁלוֹמִים admite aqui uma leitura abstrata ligada a paz, segurança ou bem-estar. A formulação mantém a preposição hebraica e não elimina a dificuldade sintática; a possível ressonância sacrificial é registrada em nota.
- source_word: לְמוֹקֵשׁ
  choice: um laço
  rationale: מוֹקֵשׁ é um laço ou ardil. A escolha preserva a variação lexical do paralelismo hebraico.
theological_decisions:
- issue: Sentido de שְׁלוֹמִים no contexto imprecatório
  choice: Traduzir no texto como “seu bem-estar”
  alternative: “suas ofertas de comunhão” ou “suas ofertas pacíficas”
  rationale: O sentido abstrato de bem-estar ou segurança funciona naturalmente no contexto e preserva a ironia de uma bênção converter-se em meio de juízo. Como o substantivo também possui uso sacrificial, essa ressonância plausível é mantida em nota, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantêm-se a forma imprecatória, a imagem concreta da mesa e os dois termos paralelos de captura, sem suavizar o tom de juízo.
