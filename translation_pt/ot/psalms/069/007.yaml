  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: pt
  text: Pois por tua causa tenho suportado afronta; a humilhação cobriu o meu rosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação causal ligada ao contexto anterior; “Pois” preserva a conexão discursiva sem a redundância pouco natural de “pois porque” em português.
- source_word: עָלֶיךָ
  choice: por tua causa
  rationale: עַל com o sufixo expressa aqui causa ou motivo. “Por tua causa” é natural e mantém aberta a nuance entre sofrer por causa de Deus e por lealdade a ele.
- source_word: נָשָׂאתִי
  choice: tenho suportado
  rationale: Com חֶרְפָּה, o verbo נשׂא descreve carregar ou aguentar uma afronta. “Tenho suportado” comunica naturalmente a experiência continuada e relevante no contexto, embora atenue ligeiramente a metáfora concreta de carregar.
- source_word: חֶרְפָּה
  choice: afronta
  rationale: Abrange insulto, opróbrio e desonra pública, sendo uma palavra corrente e digna no português moderno.
- source_word: כִּסְּתָה
  choice: cobriu
  rationale: Mantém a metáfora concreta do verbo כסה, cujo sujeito feminino é כְלִמָּה.
- source_word: כְלִמָּה
  choice: humilhação
  rationale: Expressa a vergonha desonrosa e pública sem repetir o campo lexical de “afronta”; é clara no português contemporâneo.
- source_word: פָנַי
  choice: o meu rosto
  rationale: Preserva a imagem literal e idiomática da vergonha cobrindo o rosto.
theological_decisions:
- issue: Sentido da expressão עָלֶיךָ
  choice: por tua causa
  alternative: por amor de ti
  rationale: A formulação escolhida preserva o sentido causal mais direto e evita introduzir uma nuance benefativa ou voluntarista mais forte do que a construção hebraica exige.
translation_notes:
  register: Português moderno, claro e digno, com construção causal natural. “Tua” mantém o tratamento tradicional dirigido a Deus e é amplamente inteligível; “afronta” e “humilhação” distinguem os dois termos hebraicos sem linguagem excessivamente arcaica.
