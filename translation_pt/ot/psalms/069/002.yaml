  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: pt
  text: Afundei em lama profunda, onde não há apoio para os pés; entrei em águas profundas, e a correnteza passou sobre mim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a correnteza me submergiu” ou “a torrente me engoliu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Afundei
  rationale: O qal perfeito na primeira pessoa singular descreve a experiência do salmista como já efetivada, com resultado presente no contexto poético.
- source_word: בִּיוֵן מְצוּלָה
  choice: em lama profunda
  rationale: A expressão combina יוֵן, “lama/lodo”, e מְצוּלָה, “profundidade/lugar profundo”; “lama profunda” preserva de modo natural as duas imagens.
- source_word: וְאֵין מָעֳמָד
  choice: onde não há apoio para os pés
  rationale: מָעֳמָד indica lugar firme para permanecer em pé ou ponto de apoio. A formulação explicita naturalmente a falta de sustentação dentro da imagem da lama.
- source_word: בָּאתִי
  choice: entrei
  rationale: Embora בוא signifique literalmente “vir/chegar”, com águas profundas o português idiomático favorece “entrei”, mantendo a ideia de ingresso numa situação perigosa.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: em águas profundas
  rationale: A construção designa as profundezas das águas; esta forma é clara, natural e conserva a imagem hebraica.
- source_word: שִׁבֹּלֶת
  choice: a correnteza
  rationale: Neste contexto, o termo denota uma corrente ou torrente de água. “Correnteza” comunica com precisão seu movimento e sua força, sem pressupor necessariamente uma inundação.
- source_word: שְׁטָפָתְנִי
  choice: me arrastou
  rationale: O verbo שטף pode indicar inundar, passar impetuosamente sobre ou levar pela força das águas. “Me arrastou” forma uma imagem natural com “correnteza”, enquanto a nota registra outras possibilidades.
