  text: יְֽ֭הַלְלוּ/הוּ שָׁמַ֣יִם וָ/אָ֑רֶץ יַ֝מִּ֗ים וְֽ/כָל רֹמֵ֥שׂ בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: pt
  text: Louvem-no[a] os céus[b] e a terra, os mares e tudo o que se move neles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Que os céus e a terra o louvem”. O verbo hebraico também pode ser entendido de modo mais preditivo: “os céus e a terra o louvarão”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “céus”; também pode ser entendido coletivamente como “céu”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “rasteja” ou “pulula”. O termo hebraico pode designar criaturas que se movem, rastejam ou pululam.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Louvem-no
  rationale: O piel imperfeito na 3ª pessoa do plural, com sufixo de objeto masculino singular, funciona aqui naturalmente como convocação à adoração. A forma portuguesa preserva o objeto explícito, “-no”.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O substantivo hebraico tem forma plural, e “os céus e a terra” é uma expressão cósmica natural e corrente em português.
- source_word: וָאָרֶץ
  choice: e a terra
  rationale: Neste par com “os céus”, “a terra” se refere ao mundo criado, e não a um território específico.
- source_word: יַמִּים
  choice: os mares
  rationale: Tradução direta do plural hebraico, adequada à enumeração poética dos domínios da criação.
- source_word: וְכָל רֹמֵשׂ
  choice: e tudo o que se move
  rationale: A expressão abrange as criaturas que se movem, rastejam ou pululam. “Tudo o que se move” comunica essa amplitude sem restringi-la a répteis ou insetos.
- source_word: בָּם
  choice: neles
  rationale: O pronome masculino plural retoma naturalmente “os mares” e preserva a ligação pronominal do hebraico.
theological_decisions:
- issue: Força do imperfeito hebraico na convocação ao louvor
  choice: 'Convocação: “Louvem-no”'
  alternative: 'Predição: “os céus e a terra o louvarão”'
  rationale: No contexto, a força volitiva ou jussiva se ajusta melhor à convocação poética dirigida à criação. A nota preserva a possibilidade de leitura preditiva, sem impor uma conclusão teológica adicional.
- issue: Alcance da criação na fórmula de louvor
  choice: Convocação cósmica que inclui céus, terra, mares e suas criaturas
  alternative: Referência apenas aos seres animados como agentes literais do louvor
  rationale: A personificação poética convoca toda a ordem criada, sem exigir que a tradução defina de que modo cada elemento louva.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A inversão “Louvem-no os céus” mantém a força convocatória e o ritmo do verso sem soar arcaica. Os artigos em “os céus e a terra” correspondem ao uso natural em português.
