  text: 'For the choirmaster: according to Lilies[a]. Of David[b].'
translation:
  language: pt
  text: 'Ao regente: conforme “Lírios”[a]. De Davi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “segundo a melodia ‘Lírios’”; a expressão provavelmente designa uma melodia ou um estilo musical.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “De Davi” pode indicar autoria, dedicação ou associação e, por si só, não resolve a questão.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo introduz uma instrução musical ou litúrgica dirigida ao responsável pela execução. “Ao regente” é conciso, natural em português e não restringe indevidamente a função a um coro.
- source_word: עַל
  choice: conforme
  rationale: Em títulos musicais, a preposição pode indicar melodia, estilo ou modo de execução. “Conforme” preserva essa flexibilidade sem afirmar de modo categórico que se trata de uma melodia.
- source_word: שׁוֹשַׁנִּים
  choice: “Lírios”
  rationale: O substantivo significa literalmente “lírios” e provavelmente funciona aqui como nome de uma melodia ou indicação musical. As aspas e a inicial maiúscula assinalam o provável uso como título, sem substituir a tradução por transliteração.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A construção pode indicar autoria, dedicação ou associação. “De Davi” conserva melhor essa amplitude do que “Por Davi” ou “Para Davi”.
theological_decisions:
- issue: Sentido da expressão לְדָוִד no título
  choice: De Davi
  alternative: Por Davi; para Davi
  rationale: O hebraico não determina por si só se a relação é especificamente de autoria, dedicação ou associação; a tradução evita resolver essa questão.
translation_notes:
  register: Título em português moderno, conciso e digno. “Regente” tem boa legibilidade ampla; “conforme” mantém a imprecisão técnica do hebraico. As aspas em “Lírios” deixam claro o provável caráter titular da indicação musical.
