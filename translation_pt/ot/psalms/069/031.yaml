  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: pt
  text: Isso agradará mais a Yahweh do que um boi, um touro com chifres e cascos fendidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “melhor para Yahweh do que um boi, um touro”. O hebraico compara o louvor a um animal plenamente apto para o sacrifício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִיטַב
  choice: Isso agradará mais
  rationale: O Qal imperfeito feminino singular retoma o louvor e a ação de graças do versículo anterior. Com מִן, expressa que isso será mais agradável a Yahweh do que o sacrifício mencionado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה como “Yahweh”, preservando sua função de nome próprio.
- source_word: מִשּׁוֹר
  choice: do que um boi
  rationale: A preposição מִן depois de יטב introduz a comparação. “Boi” traduz naturalmente שׁוֹר e mantém o primeiro dos dois termos bovinos.
- source_word: פָּר
  choice: um novilho
  rationale: Traduz פָּר como um bovino macho apto para sacrifício e preserva sua aposição a שׁוֹר, sem fundir os dois termos.
- source_word: מַקְרִן
  choice: com chifres
  rationale: Expressa de modo natural a forma descritiva derivada de קרן, caracterizando o animal como plenamente desenvolvido.
- source_word: מַפְרִיס
  choice: e cascos fendidos
  rationale: Representa a ideia de dividir ou fender o casco, em linguagem portuguesa clara, e conserva a descrição do animal ritualmente apropriado.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Relação entre louvor e sacrifício
  choice: O louvor será mais agradável a Yahweh do que o animal sacrificial descrito
  alternative: O louvor substitui ou invalida em absoluto todo sacrifício
  rationale: A construção hebraica estabelece uma comparação de agrado, mas não afirma aqui, por si só, a abolição universal dos sacrifícios.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Isso” retoma naturalmente o louvor e a ação de graças do versículo anterior; “cascos fendidos” evita vocabulário técnico ou arcaico.
