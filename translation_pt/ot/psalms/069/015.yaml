  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: pt
  text: Não deixes que a correnteza das águas me arraste[a], nem que as profundezas me engulam, nem que o poço feche a boca sobre mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a torrente de águas me arraste”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a cova feche a boca sobre mim”. A palavra hebraica geralmente significa “poço”, mas, neste contexto poético, também pode evocar uma cova ou cisterna mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: me arraste
  rationale: O verbo שטף descreve a ação impetuosa das águas que inundam e levam consigo; “me arraste” expressa com naturalidade essa força destrutiva.
- source_word: שִׁבֹּלֶת מַיִם
  choice: a correnteza
  rationale: A expressão indica uma corrente ou torrente de águas. “Correnteza” é clara, vigorosa e idiomática em português, sem perder a imagem poética.
- source_word: תִּבְלָעֵנִי
  choice: me engulam
  rationale: בלע significa literalmente “engolir”; a escolha conserva a personificação e a ideia de completo envolvimento.
- source_word: מְצוּלָה
  choice: as profundezas
  rationale: O substantivo designa águas profundas ou profundidades aquáticas. O plural natural em português mantém a amplitude ameaçadora da imagem.
- source_word: תֶּאְטַר
  choice: feche
  rationale: O verbo transmite a ideia de fechar ou cerrar; “feche” combina naturalmente com a metáfora da boca do poço.
- source_word: בְּאֵר
  choice: o poço
  rationale: בְּאֵר normalmente significa “poço”. A tradução retém o referente lexical direto e deixa o contexto poético comunicar seu caráter mortal, sem convertê-lo silenciosamente em “cova”.
- source_word: פִּיהָ
  choice: a boca
  rationale: “Boca” preserva a personificação do poço; o possessivo é expresso naturalmente pela construção portuguesa “o poço feche a boca”.
- source_word: עָלַי
  choice: sobre mim
  rationale: A preposição indica que a abertura se fecha por cima do salmista, aprisionando-o.
