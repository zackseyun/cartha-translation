  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: pt
  text: Tornei-me[a] um estranho para os meus irmãos e um estrangeiro para os filhos de minha mãe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Fui”. O verbo hebraico pode indicar tanto um estado no passado como a entrada nesse estado: “tornei-me”.'
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de minha mãe” é uma expressão poética para familiares muito próximos, especialmente irmãos.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: um estranho
  rationale: O termo derivado de זוּר descreve alguém alheio, afastado ou tratado como estranho. “Um estranho” preserva a imagem relacional concreta e o paralelismo com “um estrangeiro”.
- source_word: הָיִיתִי
  choice: Tornei-me
  rationale: O qatal de היה pode indicar aqui a entrada numa condição ou o estado resultante. “Tornei-me” expressa com naturalidade a mudança lamentada pelo salmista, sem ocultar a possibilidade de uma tradução no passado simples, registrada em nota.
- source_word: לְאֶחָי
  choice: para os meus irmãos
  rationale: A expressão significa literalmente “para os meus irmãos”. Mantém-se a referência masculina explícita do hebraico e traduz-se naturalmente a preposição relacional por “para”.
- source_word: וְנָכְרִי
  choice: e um estrangeiro
  rationale: נָכְרִי designa alguém estrangeiro ou alheio. “Estrangeiro” é claro em português moderno e preserva a intensificação do paralelismo sem introduzir terminologia jurídica.
- source_word: לִבְנֵי אִמִּי
  choice: para os filhos de minha mãe
  rationale: A tradução direta conserva a formulação poética hebraica, o vínculo materno enfatizado e o paralelismo com “meus irmãos”.
theological_decisions:
- issue: Linguagem de parentesco marcada por gênero
  choice: Manter “meus irmãos” e “os filhos de minha mãe” no texto principal
  alternative: “meus irmãos e minhas irmãs”, “meus familiares” ou “meus parentes”
  rationale: O hebraico emprega termos de parentesco explicitamente masculinos em paralelismo poético. Preservá-los evita ampliar ou generalizar silenciosamente a referência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “um” e o par “estranho/estrangeiro” preservam o paralelismo e a progressão do hebraico; “filhos de minha mãe” mantém deliberadamente a imagem poética original.
