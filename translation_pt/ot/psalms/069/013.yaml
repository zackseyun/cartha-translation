  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: pt
  text: Quanto a mim, porém, minha oração se dirige a ti, Yahweh, em tempo favorável[a]. Ó Deus, na abundância do teu amor leal, responde-me pela verdade[b] da tua salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em tempo aceitável». A expressão hebraica indica uma ocasião favorável para Deus ouvir e agir.
    reason: lexical_alternative
  - marker: b
    text: Ou «pela fidelidade da tua salvação». O termo hebraico pode significar «verdade» ou «fidelidade/confiabilidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim, porém
  rationale: O pronome independente, combinado com a conjunção, realça o contraste com o contexto anterior. A formulação preserva tanto a ênfase pessoal quanto a força adversativa.
- source_word: תְפִלָּתִי לְךָ
  choice: minha oração se dirige a ti
  rationale: O hebraico diz literalmente «minha oração a ti». A forma verbal acrescentada em português explicita a relação elíptica sem alterar o sentido e produz linguagem natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עֵת רָצוֹן
  choice: em tempo favorável
  rationale: A expressão designa uma ocasião de favor ou aceitação, propícia para Deus ouvir e agir.
- source_word: בְּרָב חַסְדֶּךָ
  choice: na abundância do teu amor leal
  rationale: Preserva a ideia de grandeza ou abundância e traduz חסד como amor firme e comprometido, sem restringi-lo a uma formulação doutrinária específica.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: O imperativo pede diretamente que Deus responda à oração.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: segundo a verdade da tua salvação
  rationale: Mantém a ligação de אֱמֶת com a salvação divina e conserva no texto principal o sentido lexical de «verdade», enquanto a nota registra a possibilidade contextual de «fidelidade».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. «Yahweh» preserva esse caráter pessoal sem substituí-lo por um título.
- issue: Sentido de אֱמֶת em relação à salvação
  choice: verdade
  alternative: fidelidade
  rationale: O termo hebraico admite os sentidos de verdade, firmeza, confiabilidade e fidelidade. O texto mantém «verdade», e a nota preserva a alternativa contextual sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «minha oração se dirige a ti» torna natural a frase nominal hebraica; «amor leal» comunica a constância relacional de חסד sem recorrer a linguagem arcaica. Os marcadores foram posicionados junto às expressões que explicam.
