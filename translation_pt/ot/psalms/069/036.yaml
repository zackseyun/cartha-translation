  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: pt
  text: A descendência dos seus servos a herdará[a], e os que amam o seu nome habitarão nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Sião, a cidade restaurada mencionada no contexto anterior; outros entendem, de modo mais amplo, a terra ou Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: descendência
  rationale: O substantivo coletivo pode significar literalmente “semente” ou, como aqui, a posteridade. “Descendência” é natural em português e preserva o valor coletivo singular.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Neste contexto devocional e pactual, “servos” comunica adequadamente a relação com Deus sem enfatizar indevidamente a instituição social da escravidão.
- source_word: יִנְחָלוּהָ
  choice: a herdará
  rationale: O verbo expressa receber ou possuir como herança. O pronome feminino retoma Sião, mencionada no contexto anterior.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: os que amam o seu nome
  rationale: Preserva a expressão hebraica e sua ressonância bíblica, sem reduzi-la à formulação interpretativa “os que o amam”.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: habitarão nela
  rationale: “Habitar” mantém o sentido de residir ou estabelecer morada e se ajusta ao registro digno do salmo; o pronome feminino retoma Sião.
theological_decisions:
- issue: Referente dos sufixos femininos em “a herdará” e “habitarão nela”
  choice: Sião, ou a cidade restaurada, mencionada no contexto imediato
  alternative: A terra ou, de modo mais amplo, Jerusalém
  rationale: O contexto anterior fala de Deus salvar Sião e reconstruir as cidades de Judá. Os pronomes femininos preservam o referente sem inseri-lo explicitamente no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Descendência” conserva o caráter coletivo de זֶרַע; “habitarão” mantém a ressonância poética e pactual sem soar arcaico.
