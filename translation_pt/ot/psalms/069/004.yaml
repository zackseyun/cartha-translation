  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: pt
  text: Os que me odeiam sem motivo são mais numerosos do que os cabelos da minha cabeça; são poderosos os que querem me destruir, meus inimigos mentirosos.[a] O que não roubei, então tenho de restituir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus inimigos falsos” ou “os que injustamente são meus inimigos”. A expressão hebraica pode descrever os inimigos como enganosos ou indicar que eles se opõem ao salmista injustamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “então restituo” ou “então restituirei”. O sentido pode ser que o salmista é obrigado a devolver aquilo que não roubou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: são mais numerosos que os cabelos da minha cabeça
  rationale: O verbo רַבּוּ e o מ comparativo formam uma comparação de quantidade; a formulação preserva a hipérbole poética em português natural.
- source_word: שֹׂנְאַי חִנָּם
  choice: os que me odeiam sem motivo
  rationale: חִנָּם indica ausência de causa ou justificativa, e não apenas gratuidade no sentido econômico.
- source_word: עָצְמוּ
  choice: são poderosos
  rationale: O verbo expressa força ou poder e, no contexto, destaca a capacidade ameaçadora dos adversários.
- source_word: מַצְמִיתַי
  choice: os que querem me destruir
  rationale: A forma participial designa aqueles empenhados em levar o salmista à ruína; esta redação comunica a intenção hostil com clareza.
- source_word: אֹיְבַי שֶׁקֶר
  choice: meus inimigos sem razão
  rationale: שֶׁקֶר pode qualificar os inimigos como falsos ou indicar que sua inimizade é injusta ou infundada. A tradução escolhida evita a ideia potencialmente enganosa de inimigos apenas aparentes e mantém aberta a relação com falsa acusação.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: O que não roubei
  rationale: גזל denota tomar por roubo ou violência; 'roubar' é o equivalente português mais direto e acessível.
- source_word: אָז אָשִׁיב
  choice: então tenho de restituir
  rationale: Literalmente, a expressão diz 'então restituo/restituirei'. No contexto de acusação injusta, a formulação explicita com cautela a restituição imposta, enquanto a nota registra a forma mais estrita.
theological_decisions:
- issue: Restituição exigida apesar da inocência declarada
  choice: O que não roubei, então tenho de restituir.
  alternative: O que não roubei, então restituo.
  rationale: O contexto retrata sofrimento e acusação injustos. A tradução torna inteligível o paradoxo de ser obrigado a devolver aquilo que não foi roubado, sem introduzir uma interpretação doutrinária particular.
- issue: Relação de שֶׁקֶר com os inimigos
  choice: meus inimigos sem razão
  alternative: meus inimigos mentirosos; os que são meus inimigos falsamente
  rationale: A sintaxe permite entender שֶׁקֶר como descrição do caráter enganoso dos inimigos ou da falta de fundamento de sua oposição. O texto adota uma leitura contextual e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. 'Sem motivo' e 'sem razão' distinguem naturalmente as expressões hebraicas próximas sem apagar sua sobreposição. As notas conservam as ambiguidades lexical e sintática relevantes.
