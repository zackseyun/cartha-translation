  text: תֶּחְשַׁ֣כְנָה עֵ֭ינֵי/הֶם מֵ/רְא֑וֹת וּ֝/מָתְנֵ֗י/הֶם תָּמִ֥יד הַמְעַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: pt
  text: Que os olhos deles escureçam, para que não vejam, e faze seus lombos vacilarem sem cessar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Que ... escureçam
  rationale: O imperfeito de valor volitivo, no contexto imprecatório, expressa pedido ou desejo. A construção com «que» reproduz essa força com naturalidade em português.
- source_word: עֵינֵיהֶם
  choice: os olhos deles
  rationale: Tradução direta que preserva a imagem corporal do hebraico.
- source_word: מֵרְאוֹת
  choice: para que não vejam
  rationale: Embora a construção seja literalmente «de ver», a preposição מן com o infinitivo aqui indica impedimento ou incapacidade; esta formulação comunica o sentido com clareza.
- source_word: וּמָתְנֵיהֶם
  choice: e ... seus lombos
  rationale: מָתְנַיִם designa a região dos lombos ou da cintura. «Lombos» mantém a imagem corporal e o registro poético sem restringi-la aos quadris.
- source_word: תָּמִיד
  choice: sem cessar
  rationale: Expressa duração contínua de maneira natural e poeticamente adequada em português.
- source_word: הַמְעַד
  choice: faze ... vacilarem
  rationale: 'O hifil de מעד tem sentido causativo: fazer perder a firmeza, cambalear ou vacilar. «Vacilarem» preserva a imagem de instabilidade física sem a reduzir a mero tremor.'
theological_decisions:
- issue: Força imprecatória do versículo
  choice: 'Traduzir como pedido de juízo: «Que... e faze...»'
  alternative: 'Traduzir como previsão futura: «Os olhos deles escurecerão...»'
  rationale: No contexto, as formas verbais funcionam como uma súplica dirigida a Deus, e não como simples previsão. A tradução conserva essa tensão e não suaviza o caráter imprecatório.
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. «Faze» conserva a forma de tratamento singular implícita no apelo a Deus; «sem cessar» evita a rigidez de «continuamente» sem perder a ideia de duração constante.
