  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: pt
  text: Quando chorei em jejum, em minha alma[a], isso se tornou objeto de insultos contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “em jejum, minha alma”. A relação de “minha alma” com o jejum é condensada e pode ser entendida de modos diferentes, como “chorei em jejum” ou, mais interpretativamente, “humilhei-me com jejum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Quando chorei
  rationale: 'בכה significa “chorar”. Embora o waw possa ser apenas sequencial (“e chorei”), a relação com וַתְּהִי permite expressar naturalmente a circunstância temporal: “Quando chorei... isso se tornou...”.'
- source_word: בַצּוֹם
  choice: em jejum
  rationale: צוֹם designa jejum, e a preposição ב pode indicar a circunstância que acompanha o choro. “Em jejum” é uma formulação portuguesa direta e natural.
- source_word: נַפְשִׁי
  choice: de toda a alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. Aqui sua relação sintática com “em jejum” é condensada e ambígua. “De toda a alma” mantém explícita a dimensão interior e pessoal sem introduzir o verbo “humilhar”, ausente no texto hebraico; a nota registra a construção literal e outras leituras possíveis.
- source_word: וַתְּהִי
  choice: isso se tornou
  rationale: היה expressa aqui o resultado da ação anterior. O pronome “isso” retoma toda a situação de chorar em jejum.
- source_word: לַחֲרָפוֹת
  choice: motivo de insultos
  rationale: חֲרָפוֹת é formalmente plural e pode significar afrontas, zombarias ou insultos. “Motivo de insultos” comunica de modo natural que a conduta do salmista passou a provocar desprezo dirigido contra ele.
- source_word: לִי
  choice: contra mim
  rationale: A preposição ל marca a pessoa afetada. Com “insultos”, o português idiomático pede “contra mim”, preservando o sentido adverso.
theological_decisions:
- issue: Relação entre “minha alma” e o jejum
  choice: Manter a referência explícita à alma, sem acrescentar um verbo ausente
  alternative: “Quando me humilhei com jejum” ou simplesmente “Quando chorei em jejum”
  rationale: O hebraico é sintaticamente compacto e permite mais de uma compreensão. Acrescentar “humilhei” harmonizaria o verso com linguagem semelhante de outros textos, mas resolveria a ambiguidade; omitir נַפְשִׁי perderia um elemento expresso no original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “De toda a alma” oferece fluência ao português, enquanto a nota preserva a ordem incomum e a ambiguidade do hebraico. “Motivo de insultos” evita a rigidez de “tornou-se reprovações para mim”.
