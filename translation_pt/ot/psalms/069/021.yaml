base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: pt
  text: Deram-me veneno por alimento[a] e, para minha sede, deram-me vinagre[b] para beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fel”. O hebraico se refere aqui a uma substância venenosa ou amarga; “fel” é a tradução tradicional.
    reason: lexical_alternative
  - marker: b
    text: Ou “vinho azedo”. O termo hebraico pode indicar vinho azedo ou vinagre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram-me
  rationale: O wayyiqtol de נתן expressa uma ação passada; “deram-me” é direto e natural. O verbo é repetido no segundo membro para preservar o paralelismo.
- source_word: בְּבָרוּתִי
  choice: como alimento
  rationale: בָּרוּת significa alimento ou sustento. No contexto, “como alimento” comunica que o veneno lhes foi oferecido em lugar de comida, sem afirmar de modo mais específico que tenha sido misturado nela.
- source_word: רֹאשׁ
  choice: veneno
  rationale: Neste uso poético, רֹאשׁ designa uma substância venenosa ou amarga. “Veneno” expressa o sentido com clareza; a alternativa tradicional “fel” é registrada em nota.
- source_word: וְלִצְמָאִי
  choice: e, para matar minha sede
  rationale: A expressão portuguesa torna explícita de modo idiomático a finalidade associada à sede, preservando a correspondência com o primeiro membro.
- source_word: יַשְׁקוּנִי
  choice: deram-me ... para beber
  rationale: O hifil de שׁקה significa fazer alguém beber ou dar-lhe de beber. Esta formulação é natural e mantém a ação dos agentes.
- source_word: חֹמֶץ
  choice: vinagre
  rationale: חֹמֶץ pode indicar vinagre ou vinho azedo. “Vinagre” é claro e tradicional, enquanto “vinho azedo” permanece em nota como alternativa lexical legítima.
theological_decisions:
- issue: Ressonância com as narrativas evangélicas da paixão
  choice: Traduzir os termos conforme seu sentido no salmo hebraico, usando “veneno” e “vinagre” no texto principal.
  alternative: Usar “fel” e/ou “vinho azedo” para aproximar a formulação das associações tradicionais com os Evangelhos.
  rationale: A primazia do texto hebraico exige que a tradução não harmonize silenciosamente o salmo com formulações posteriores. As alternativas de importância intertextual são preservadas em notas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A estrutura mantém o paralelismo das duas ofertas hostis, evitando tanto linguagem excessivamente arcaica quanto harmonização intertextual.
