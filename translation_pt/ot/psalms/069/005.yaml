base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: pt
  text: Ó Deus, tu conheces a minha insensatez, e as minhas culpas não estão escondidas de ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo numa oração. “Ó Deus” marca de modo natural e digno a invocação direta em português.
- source_word: אַתָּה
  choice: tu
  rationale: O pronome explícito dá ênfase ao destinatário. “Tu” preserva essa ênfase e concorda com a linguagem de oração adotada no versículo.
- source_word: יָדַעְתָּ
  choice: conheces
  rationale: 'O perfeito qal tem aqui valor estativo: o conhecimento de Deus é atual e completo. O presente português expressa bem esse sentido.'
- source_word: לְאִוַּלְתִּי
  choice: a minha insensatez
  rationale: O termo indica insensatez ou loucura com dimensão moral, não simples falta de inteligência. “Insensatez” é atual, clara e digna.
- source_word: וְאַשְׁמוֹתַי
  choice: as minhas culpas
  rationale: O substantivo está no plural e, em paralelo com “minha insensatez”, designa culpas ou atos culpáveis. O plural concreto preserva melhor a forma hebraica sem sugerir ofertas pela culpa.
- source_word: מִמְּךָ
  choice: de ti
  rationale: A preposição מן com sufixo significa literalmente “de ti” e, com o verbo esconder, indica aquilo que não escapa ao conhecimento de Deus.
- source_word: לֹא נִכְחָדוּ
  choice: não estão escondidas
  rationale: O nifal plural exprime o estado de não estarem ocultas. A concordância plural corresponde a “as minhas culpas”.
theological_decisions:
- issue: A confissão de pecado do falante em um salmo posteriormente aplicado de forma messiânica no Novo Testamento
  choice: Manter a confissão pessoal de insensatez e culpas na voz do salmista.
  alternative: Interpretar a confissão somente em sentido coletivo ou representativo.
  rationale: O hebraico apresenta claramente uma confissão na primeira pessoa. A tradução preserva essa voz e a tensão teológica, sem introduzir no texto uma harmonização posterior.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. O uso de “tu” mantém a invocação pessoal e solene; “insensatez” evita tanto coloquialismo quanto arcaísmo. Não são necessárias notas, pois as principais nuances do hebraico podem ser representadas diretamente no texto.
