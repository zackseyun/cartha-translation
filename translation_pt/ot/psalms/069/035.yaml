source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: pt
  text: Pois Deus salvará Sião e edificará as cidades de Judá; ali habitarão e a possuirão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a herdarão” ou “tomarão posse dela”. O verbo hebraico pode expressar herdar ou tomar posse, especialmente de uma terra.
    reason: lexical_alternative
  - marker: b
    text: O objeto no hebraico é feminino singular, provavelmente uma referência a Sião ou à terra personificada.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou a garantia que sustenta a esperança expressa no contexto anterior; “pois” mantém essa ligação explicativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo no singular confirma que o termo tem aqui sentido singular.
- source_word: יוֹשִׁיעַ
  choice: salvará
  rationale: O hifil de ישׁע expressa salvar ou livrar; o futuro comunica adequadamente a promessa neste contexto.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém o nome próprio tradicional e reconhecível em português, sem substituir seu alcance geográfico e comunitário por uma explicação interpretativa.
- source_word: וְיִבְנֶה
  choice: e edificará
  rationale: בנה significa construir ou edificar. “Edificará” é digno e natural neste registro, sem acrescentar a ideia não explícita de reconstrução.
- source_word: עָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Reproduz diretamente a construção nominal hebraica e identifica a região de modo claro.
- source_word: וְיָשְׁבוּ שָׁם
  choice: ali habitarão
  rationale: ישׁב pode significar habitar, viver ou estabelecer-se; “habitarão” conserva a noção de residência estabelecida, e a ordem adotada é natural e poética em português.
- source_word: וִירֵשׁוּהָ
  choice: e a possuirão
  rationale: ירשׁ pode significar possuir, herdar ou tomar posse. O pronome átono feminino singular “a” preserva tanto a forma do sufixo hebraico quanto a possível referência a Sião personificada.
theological_decisions:
- issue: Referente do sufixo feminino singular em וִירֵשׁוּהָ
  choice: Preservar o objeto feminino singular em “a possuirão”.
  alternative: Explicitar “possuirão Sião”, “herdarão a terra” ou usar uma referência neutra.
  rationale: O hebraico não identifica de modo inequívoco o referente. A forma feminina pode apontar para Sião ou para a terra/cidade personificada; mantê-la evita resolver silenciosamente a ambiguidade poética.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Edificará” e “habitarão” mantêm a dignidade poética sem arcaísmo excessivo. O pronome feminino singular preserva a ambiguidade e a personificação do hebraico.
