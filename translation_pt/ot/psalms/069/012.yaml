  text: יָשִׂ֣יחוּ בִ֭/י יֹ֣שְׁבֵי שָׁ֑עַר וּ֝/נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: pt
  text: Os que se sentam à porta da cidade falam de mim[a], e sou tema das canções dos que bebem bebida forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A porta da cidade era um lugar público onde se tratavam assuntos cívicos e se realizavam julgamentos; a expressão sugere que o salmista era alvo de comentários em público, inclusive entre pessoas socialmente influentes.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: falam de mim
  rationale: שׂיח pode indicar meditar ou falar; neste contexto social hostil, denota conversa ou comentário. A preposição ב marca o assunto, por isso “de mim” preserva o sentido sem explicitar “contra mim”.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: os que se sentam à porta da cidade
  rationale: A expressão significa literalmente os que se sentam à porta. Acrescentar “da cidade” torna clara para o leitor moderno a referência ao espaço público e cívico, sem restringir o grupo a porteiros ou autoridades.
- source_word: וּנְגִינוֹת
  choice: e sou tema das canções
  rationale: O substantivo significa canções ou música. O paralelismo indica que o salmista é o assunto do canto; “sou tema das canções” explicita essa predicação elíptica sem acrescentar que as canções sejam necessariamente zombeteiras.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: os que bebem bebida forte
  rationale: שֵׁכָר designa bebida alcoólica, geralmente distinta do vinho. “Bebida forte” preserva a distinção lexical e evita substituir a expressão pelo interpretativo “bêbados”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva a imagem antiga da porta da cidade e o paralelismo poético, esclarecendo apenas a predicação implícita no segundo verso.
