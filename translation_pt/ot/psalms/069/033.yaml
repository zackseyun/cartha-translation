source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: pt
  text: Pois Yahweh ouve os necessitados e não despreza os seus prisioneiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus cativos”. O termo hebraico pode designar, de modo amplo, pessoas mantidas em cativeiro ou confinamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado anterior ao louvor, preservando de modo natural a força causal do hebraico.
- source_word: שֹׁמֵעַ אֶל אֶבְיוֹנִים
  choice: ouve os necessitados
  rationale: O particípio apresenta uma ação característica de Yahweh. “Ouve” conserva, no contexto de oração, tanto a ideia de escutar como a de atender; “necessitados” abrange pessoas pobres e vulneráveis sem restringir indevidamente o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando sua referência pessoal e pactual.
- source_word: וְאֶת אֲסִירָיו
  choice: e ... os seus prisioneiros
  rationale: A conjunção coordena o segundo grupo, e o sufixo de terceira pessoa masculina singular é mantido por “seus”. “Prisioneiros” expressa diretamente pessoas mantidas presas ou confinadas.
- source_word: לֹא בָזָה
  choice: não despreza
  rationale: O perfeito tem valor de verdade geral neste paralelismo poético. O presente em português harmoniza-se com “ouve” e comunica que Yahweh não trata essas pessoas com desdém.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração evita substituí-lo por um título.
- issue: Sentido possessivo de אֲסִירָיו
  choice: os seus prisioneiros
  alternative: os prisioneiros
  rationale: Mantém-se o sufixo possessivo do hebraico sem definir além do texto a natureza exata da relação entre Yahweh e os que estão presos.
- issue: Identidade dos אֲסִירָיו
  choice: prisioneiros
  alternative: cativos
  rationale: “Prisioneiros” conserva o sentido básico de pessoas detidas ou confinadas; a alternativa “cativos” permanece possível e é registrada em nota, sem decidir se a prisão é judicial, militar ou metafórica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. O artigo em “os seus prisioneiros” soa natural em português e preserva explicitamente o possessivo hebraico. A nota foi colocada junto de “prisioneiros”, termo ao qual a alternativa lexical se refere.
