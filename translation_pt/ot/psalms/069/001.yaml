  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: pt
  text: Salva-me[a], ó Deus, pois as águas chegaram até o meu pescoço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “até a minha alma”. O hebraico néfesh pode significar “alma”, “vida” ou “ser” e, em contextos como este, também a garganta ou o pescoço.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Salva-me
  rationale: O imperativo hifil de ישׁע com sufixo de primeira pessoa singular expressa um pedido direto de livramento. “Salva-me” é natural, claro e tradicional no contexto dos salmos.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo em uma oração direta; “ó Deus” preserva o tom urgente e digno do apelo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido. “Pois” é conciso e adequado ao registro poético sem soar arcaico.
- source_word: בָאוּ
  choice: chegaram
  rationale: O verbo indica que as águas vieram ou alcançaram determinado nível. Em português, “chegaram até” transmite naturalmente o avanço das águas sem acrescentar detalhes ao hebraico.
- source_word: מַיִם
  choice: as águas
  rationale: Mantém a imagem poética hebraica no plural e sugere as águas ameaçadoras já presentes no cenário.
- source_word: עַד נָפֶשׁ
  choice: até o meu pescoço
  rationale: Embora נֶפֶשׁ possa significar “alma”, “vida” ou “ser”, neste contexto de afogamento pode designar concretamente a garganta ou o pescoço, onde a água ameaça a respiração. A nota preserva a expressão mais literal.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na imagem poética de perigo
  choice: 'Sentido corporal concreto: “pescoço”'
  alternative: “alma” ou “vida”
  rationale: O contexto descreve perigo por meio da imagem de águas que sobem, não formula uma doutrina sobre a alma. “Pescoço” comunica com clareza o risco iminente, enquanto a nota conserva a amplitude semântica e a ambiguidade da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão e a urgência da oração hebraica; “pescoço” torna natural a metáfora de afogamento, e a nota registra a formulação literal.
