  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: pt
  text: Que o acampamento deles[a] fique desolado; que não haja ninguém morando em suas tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morada” ou “habitação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: Que ... fique
  rationale: O imperfeito volitivo de היה expressa aqui um desejo imprecatório. Em português, “Que ... fique” preserva com naturalidade essa força, sem convertê-la em simples previsão.
- source_word: טִירָתָם
  choice: o acampamento deles
  rationale: טִירָה pode designar acampamento ou habitação cercada. “Acampamento” mantém o sentido concreto e coletivo e corresponde bem ao paralelismo com “tendas”.
- source_word: נְשַׁמָּה
  choice: desolado
  rationale: A forma denota desolação ou devastação. A construção “fique desolado” é natural em português e conserva a ideia de ruína.
- source_word: בְּאָהֳלֵיהֶם
  choice: em suas tendas
  rationale: אֹהֶל significa literalmente “tenda”; embora possa estender-se a “morada”, a tradução concreta preserva a imagem poética hebraica.
- source_word: אַל יְהִי
  choice: que não haja
  rationale: A construção jussiva negativa formula um desejo ou pedido imprecatório. “Que não haja” reproduz sua força volitiva de modo idiomático.
- source_word: יֹשֵׁב
  choice: ninguém morando
  rationale: O particípio de ישב indica alguém que habita ou mora. “Ninguém morando” conserva a força verbal e soa natural em português.
theological_decisions:
- issue: Jussivos imprecatórios em um salmo de lamento
  choice: 'Traduzir como pedidos ou desejos: “Que ... fique”; “que não haja”.'
  alternative: “O acampamento deles ficará desolado; não haverá ninguém morando em suas tendas.”
  rationale: As formas hebraicas são volitivas, e o verso funciona como imprecação diante de Deus, não apenas como previsão. A tradução mantém essa tensão retórica sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a imagem concreta das tendas e a força imprecatória dos jussivos. A nota registra a amplitude semântica de טִירָה sem sobrecarregar o texto principal.
