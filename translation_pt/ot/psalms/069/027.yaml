  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: pt
  text: Acrescenta culpa à culpa deles[a] e não os deixes entrar na tua justiça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode significar iniquidade, culpa ou a consequência da culpa.
    reason: lexical_alternative
  - marker: b
    text: Aqui, «justiça» também pode evocar a ação justa de Deus, que salva ou vindica.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Acrescenta
  rationale: Imperativo de נתן dirigido a Deus. Na construção com עָוֺן עַל עֲוֺנָם, «acrescenta» expressa naturalmente a ideia cumulativa, sem reduzir o vigor da imprecação.
- source_word: עָוֺן ... עֲוֺנָם
  choice: culpa à culpa deles
  rationale: O mesmo substantivo aparece duas vezes e pode indicar perversidade, culpa ou sua consequência. «Culpa» preserva a repetição e a ideia de culpabilidade acumulada, enquanto a nota mantém a amplitude semântica.
- source_word: עַל
  choice: à
  rationale: Embora a preposição tenha o sentido básico de «sobre», o português idiomático pede «acrescentar X a Y».
- source_word: וְאַל יָבֹאוּ
  choice: e não os deixes entrar
  rationale: אַל com o imperfeito exprime aqui um pedido ou desejo negativo dirigido a Deus. A formulação comunica isso com clareza e conserva a metáfora de entrada.
- source_word: בְּצִדְקָתֶךָ
  choice: na tua justiça
  rationale: «Justiça» é natural em português e mantém em aberto as nuances de retidão divina, juízo justo e ação salvadora ou vindicadora.
theological_decisions:
- issue: Sentido de «tua justiça» no contexto de uma imprecação
  choice: Manter «tua justiça» como expressão ampla
  alternative: tua ação justa; tua ação salvadora ou vindicadora
  rationale: O hebraico não obriga a escolher entre o caráter justo de Deus, seu juízo e sua ação que salva ou vindica. A tradução principal preserva essa tensão, e a nota esclarece sua amplitude.
translation_notes:
  register: Português atual, digno e de compreensão ampla. «Acrescenta culpa à culpa deles» conserva a repetição enfática do hebraico; «não os deixes entrar» torna explícito o valor volitivo da forma hebraica sem eliminar a imagem de movimento.
