  text: קָרְבָ֣/ה אֶל נַפְשִׁ֣/י גְאָלָ֑/הּ לְמַ֖עַן אֹיְבַ֣/י פְּדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: pt
  text: Aproxima-te da minha alma[a] e redime-a; por causa dos meus inimigos[b], resgata-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “minha alma”; o termo também pode significar “minha vida” ou “a mim mesmo”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em consideração aos meus inimigos, resgata-me”. A expressão hebraica pode ser entendida mais literalmente dessa maneira, mas, neste contexto, provavelmente significa “por causa dos” ou “em razão dos” meus inimigos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: Aproxima-te
  rationale: Imperativo qal masculino singular de קרב. A forma expressa de modo natural e direto o pedido para que Deus se faça próximo.
- source_word: נַפְשִׁי
  choice: da minha alma
  rationale: נפש pode designar alma, vida ou a própria pessoa. “Minha alma” preserva a imagem hebraica e o tom intensamente pessoal, enquanto a nota registra a amplitude semântica.
- source_word: גְאָלָהּ
  choice: redime-a
  rationale: O verbo גאל descreve o ato de redimir ou reivindicar como redentor. O pronome feminino retoma “alma”, também feminina em português.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Embora לְמַעַן frequentemente indique propósito ou benefício, aqui os inimigos constituem mais naturalmente o motivo ou a circunstância do pedido de socorro. A ambiguidade é preservada em nota.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Tradução direta e corrente do substantivo plural com sufixo de primeira pessoa.
- source_word: פְּדֵנִי
  choice: resgata-me
  rationale: פדה expressa libertação ou resgate. “Resgata-me” distingue este verbo de גאל sem pressupor uma teoria específica sobre o meio ou preço do resgate.
theological_decisions:
- issue: Distinção entre os verbos de redenção גאל e פדה
  choice: Traduzir גאל por “redimir” e פדה por “resgatar”
  alternative: Traduzir ambos por “redimir” ou verter פדה por “libertar”
  rationale: O uso de verbos relacionados, mas distintos, intensifica poeticamente o pedido. A diferenciação conserva a textura lexical hebraica sem importar para o verso uma doutrina desenvolvida de expiação.
- issue: Sentido contextual de לְמַעַן
  choice: “por causa dos meus inimigos”
  alternative: “por amor dos meus inimigos” ou “em consideração aos meus inimigos”
  rationale: No contexto de perseguição, os inimigos são a razão para a intervenção pedida, não seus beneficiários. Como a construção hebraica admite uma leitura mais final ou benefactiva, essa possibilidade é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular adequadas à oração dirigida a Deus. Conserva-se “alma” para refletir a expressão hebraica, e empregam-se “redimir” e “resgatar” para representar os dois verbos correlatos sem apagar sua distinção.
