  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: pt
  text: Mas eu estou aflito e sofrendo; ó Deus, que a tua salvação me ponha em lugar seguro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tua salvação, ó Deus, me porá em lugar seguro”. A forma verbal hebraica também pode ser entendida como uma declaração futura. A expressão traduzida por “pôr em lugar seguro” significa literalmente colocar no alto, fora de alcance; por isso, também pode ser traduzida por “proteger” ou “manter em segurança”.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome expresso marca contraste com o contexto anterior; “Mas eu” é natural em português e mantém essa ênfase.
- source_word: עָנִי
  choice: aflito
  rationale: Embora possa significar “pobre” ou “necessitado”, aqui o paralelo com כוֹאֵב favorece a condição de alguém abatido e afligido.
- source_word: וְכוֹאֵב
  choice: e sofrendo
  rationale: O particípio descreve um estado presente de dor ou sofrimento; “sofrendo” é claro e natural sem limitar a dor ao aspecto físico.
- source_word: יְשׁוּעָתְךָ
  choice: a tua salvação
  rationale: Preserva a amplitude de יְשׁוּעָה, que abrange salvação, livramento e socorro.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O substantivo funciona como vocativo; a forma escolhida conserva o tom direto de oração.
- source_word: תְּשַׂגְּבֵנִי
  choice: me ponha em lugar seguro
  rationale: O Piel de שׂגב comunica colocar alguém no alto, fora de alcance e, por extensão, em segurança. A formulação transmite a metáfora espacial e seu sentido protetor de modo idiomático.
theological_decisions:
- issue: Força do imperfeito תְּשַׂגְּבֵנִי
  choice: 'Pedido de caráter jussivo: “que ... me ponha”'
  alternative: 'Declaração futura: “a tua salvação ... me porá”'
  rationale: No contexto de lamento e súplica, a leitura como pedido é a mais natural, mas a forma hebraica também admite valor futuro; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e ampla inteligibilidade internacional. O vocativo foi colocado antes da oração final para dar fluidez, e a imagem hebraica de elevação protetora foi comunicada sem recorrer a uma expressão excessivamente literal ou arcaica.
