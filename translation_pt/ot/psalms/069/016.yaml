id: PSA.69.16
reference: Psalms 69:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: pt
  text: Responde-me, ó Yahweh, pois bom é o teu amor leal; segundo a abundância da tua compaixão, volta-te para mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Responde-me
  rationale: O imperativo de ענה, em contexto de oração, pede que Deus responda ao suplicante; “Responde-me” é natural, direto e fiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma compacta o fundamento do pedido e mantém o tom poético da oração.
- source_word: טוֹב
  choice: bom
  rationale: Preserva o sentido predicativo básico do adjetivo e a afirmação de que o amor leal de Deus é bom.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: חסד reúne afeto, fidelidade e constância relacional; “amor leal” comunica esses aspectos de modo conciso e atual.
- source_word: כְּרֹב
  choice: segundo a abundância da tua
  rationale: 'A preposição כְּ com רֹב indica medida ou padrão: o salmista apela à grandeza da compaixão divina.'
- source_word: רַחֲמֶיךָ
  choice: compaixão
  rationale: Embora a forma hebraica seja plural, רַחֲמִים funciona frequentemente como plural abstrato/intensivo; “compaixão” é a expressão portuguesa mais natural sem perder a ideia de ternura abundante.
- source_word: פְּנֵה אֵלַי
  choice: volta-te para mim
  rationale: O imperativo de פנה com אֶל descreve voltar-se em direção a alguém; a formulação conserva o movimento relacional do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia
  rationale: “Amor leal” mantém em tensão a bondade afetiva e a fidelidade constante do termo, sem restringi-lo apenas à indulgência diante da culpa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A ordem “bom é o teu amor leal” conserva a ênfase do hebraico sem soar excessivamente arcaica. Não se incluiu nota porque a alternativa fornecida no material inglês corresponde, na realidade, à segunda oração e não constitui variante de עֲנֵנִי.
