  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: pt
  text: Tu conheces a afronta contra mim, minha vergonha e minha humilhação; todos os meus adversários estão diante de ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Tu conheces
  rationale: 'O qal perfeito de ידע, dirigido a Deus, tem aqui valor estativo: o salmista afirma que Deus conhece plenamente sua situação. O presente é natural em português.'
- source_word: חֶרְפָּתִי
  choice: a afronta que sofro
  rationale: חֶרְפָּה abrange afronta, desprezo e desonra impostos a alguém. A formulação explicita de modo natural que o salmista é alvo da afronta, sem atribuí-la a ele como ação.
- source_word: בָשְׁתִּי
  choice: minha vergonha
  rationale: O termo denota vergonha ou desonra. “Vergonha” é direto, corrente e preserva a intensidade emocional.
- source_word: כְלִמָּתִי
  choice: minha humilhação
  rationale: כְּלִמָּה pode indicar humilhação pública e desonra. “Humilhação” distingue o termo de בָשְׁתִּי e mantém a acumulação retórica dos quase sinônimos.
- source_word: נֶגְדְּךָ
  choice: diante de ti
  rationale: A expressão indica aquilo que está perante alguém ou em sua presença. “Diante de ti” é idiomático e conserva o tom poético da oração.
- source_word: כָּל
  choice: todos
  rationale: O quantificador é abrangente e concorda naturalmente com o substantivo plural masculino em português.
- source_word: צוֹרְרָי
  choice: meus adversários
  rationale: O particípio substantivado de צרר designa os que hostilizam ou oprimem o salmista. “Adversários” preserva a hostilidade ativa e o registro poético.
