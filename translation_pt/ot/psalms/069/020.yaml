base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: pt
  text: A afronta partiu meu coração, e estou enfermo[a]. Esperei por compaixão[b], mas não houve nenhuma; esperei por consoladores, mas não encontrei nenhum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e estou gravemente aflito». A expressão hebraica pode indicar enfermidade grave ou, de modo mais amplo, um estado de profunda aflição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por alguém que se compadecesse de mim». O termo hebraico refere-se à comiseração compassiva demonstrada para com quem sofre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: A afronta
  rationale: O substantivo expressa tanto o desprezo ou insulto vindo de outros quanto a desonra pública resultante. “Afronta” preserva essas duas dimensões em linguagem digna e corrente.
- source_word: שָׁבְרָה
  choice: partiu
  rationale: O verbo descreve o efeito consumado da afronta sobre o coração. “Partiu meu coração” é uma expressão natural em português e não intensifica o sentido como faria “despedaçou”.
- source_word: לִבִּי
  choice: meu coração
  rationale: “Coração” representa o íntimo da pessoa, incluindo emoções e ânimo; a imagem hebraica permanece clara e natural em português.
- source_word: וָאֲנוּשָׁה
  choice: e estou gravemente abatido
  rationale: A forma indica um estado grave de aflição ou enfermidade. A tradução mantém a intensidade sem limitar necessariamente o sofrimento a uma doença física.
- source_word: וָאֲקַוֶּה
  choice: Esperei
  rationale: O verbo comunica espera acompanhada de esperança ou expectativa. “Esperei” preserva esse valor de modo direto.
- source_word: לָנוּד
  choice: por quem se compadecesse de mim
  rationale: O infinitivo refere-se à manifestação de comiseração para com quem sofre. A formulação pessoal combina naturalmente com a declaração seguinte de que não havia ninguém e evita que “piedade” soe condescendente.
- source_word: וָאַיִן
  choice: mas não houve ninguém
  rationale: A partícula declara a inexistência do auxílio esperado. “Mas” explicita o contraste contextual, e “ninguém” corresponde à formulação pessoal adotada na oração anterior.
- source_word: וְלַמְנַחֲמִים
  choice: procurei consoladores
  rationale: O particípio plural designa pessoas que dariam consolo. “Consoladores” conserva de forma concisa o caráter pessoal e plural da expressão.
- source_word: וְלֹא מָצָאתִי
  choice: mas não encontrei nenhum
  rationale: A expressão declara que a procura não teve resultado e mantém o paralelismo com “mas não houve ninguém”.
theological_decisions:
- issue: Uso messiânico na interpretação cristã
  choice: Traduzir o versículo primeiramente em seu contexto de lamento individual no salmo, sem acrescentar linguagem messiânica explícita.
  alternative: Apresentar o texto principal como predição direta do sofrimento do Messias.
  rationale: O Novo Testamento aplica partes do Salmo 69 a Jesus, mas o sentido hebraico deste versículo é o lamento de alguém submetido a afronta e abandono. A redação permanece plenamente compatível com a aplicação messiânica posterior sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do lamento foi preservada, enquanto a segunda metade foi levemente explicitada para soar natural em português. Os marcadores de nota aparecem junto às expressões a que se referem.
