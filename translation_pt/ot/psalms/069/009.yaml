  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: pt
  text: 'Pois o zelo pela tua casa me consumiu[a],

    e os insultos dos que te insultam caíram sobre mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo é citado em João 2:17 com referência a Jesus. O verbo hebraico também pode ser traduzido mais literalmente por “me devorou”.
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da situação do salmista no contexto e mantém com naturalidade a força explicativa do hebraico.
- source_word: קִנְאַת
  choice: o zelo
  rationale: Aqui o substantivo expressa dedicação intensa, não inveja ou ciúme; “zelo” é preciso e natural em português.
- source_word: בֵּיתְךָ
  choice: pela tua casa
  rationale: Conserva a expressão literal hebraica e não restringe indevidamente a referência a “templo” ou “santuário”.
- source_word: אֲכָלָתְנִי
  choice: me consumiu
  rationale: Traduz de modo idiomático a imagem de “comer/devorar”, preservando sua intensidade em português corrente e digno.
- source_word: וְחֶרְפּוֹת
  choice: e os insultos
  rationale: Expressa a afronta verbal indicada pelo substantivo plural em linguagem moderna e compreensível.
- source_word: חֹרְפֶיךָ
  choice: dos que te insultam
  rationale: Mantém a repetição da mesma raiz hebraica por meio de “insultos/insultam” e identifica naturalmente os agentes.
- source_word: נָפְלוּ עָלַי
  choice: caíram sobre mim
  rationale: Reproduz de perto a metáfora hebraica segundo a qual as afrontas dirigidas a Deus atingem o salmista.
theological_decisions:
- issue: Ressonância messiânica e canônica do versículo
  choice: Traduzir o texto em seu sentido imediato no salmo, sem inserir uma identificação cristológica explícita no corpo do versículo.
  alternative: Explicitar no texto principal sua aplicação a Jesus em João 2:17.
  rationale: O hebraico apresenta diretamente a voz do salmista. A aplicação neotestamentária é relevante, mas pertence a uma nota de referência cruzada, não à formulação do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “insultos dos que te insultam” conserva deliberadamente o vínculo lexical do hebraico. O marcador [a] aparece no texto principal.
