  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: pt
  text: Os humildes viram e se alegram[a]; vocês que buscam a Deus, que o coração de vocês reviva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Os aflitos viram e se alegram” ou “Os mansos viram e se alegram”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “que o coração de vocês viva”, expressão que comunica ânimo, vitalidade ou esperança renovados.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: viram
  rationale: O qal perfeito, terceira pessoa do plural, indica uma ação vista como completa. O pretérito preserva esse aspecto sem acrescentar um objeto ausente no hebraico.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar humildes, mansos ou aflitos. “Os humildes” conserva a dimensão moral e espiritual sem excluir sua condição socialmente abatida.
- source_word: יִשְׂמָחוּ
  choice: se alegram
  rationale: O imperfeito pode apresentar uma reação atual, contínua ou futura. No paralelismo, o presente português exprime naturalmente a alegria resultante sem fixar demais o tempo.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: vocês que buscam a Deus
  rationale: O particípio em construção com “Deus” funciona aqui como vocativo, confirmado pelo sufixo de segunda pessoa do plural na oração seguinte.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, a forma refere-se no singular ao Deus de Israel.
- source_word: וִיחִי לְבַבְכֶם
  choice: que o coração de vocês reviva
  rationale: A formulação conserva o jussivo e a imagem hebraica de o coração voltar a viver. O singular coletivo “coração”, ligado a um possuidor plural, é natural em português e preserva a forma da fonte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A combinação “viram e se alegram” mantém a mudança aspectual do hebraico, e “reviva” comunica de modo natural a imagem idiomática sem reduzi-la simplesmente a “tenham coragem”.
