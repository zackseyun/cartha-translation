base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: pt
  text: Estou exausto de tanto clamar; minha garganta está ressequida[a]. Meus olhos desfalecem enquanto espero pelo meu Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está rouca”. O hebraico sugere mais literalmente que a garganta está seca, ardendo ou inflamada de tanto clamar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto ponho minha esperança no meu Deus”. O verbo hebraico pode expressar tanto espera quanto expectativa esperançosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Estou exausto
  rationale: Expressa o estado resultante de cansaço intenso indicado pelo perfeito de יגע e soa natural no contexto de lamentação.
- source_word: בְקָרְאִי
  choice: de tanto clamar
  rationale: קרא indica aqui clamar por socorro; a construção portuguesa comunica tanto a repetição quanto a causa do esgotamento.
- source_word: נִחַר
  choice: está ressequida
  rationale: Preserva a imagem hebraica de secura ou ardor na garganta causada pelo clamor prolongado, sem reduzi-la apenas à rouquidão.
- source_word: גְּרוֹנִי
  choice: minha garganta
  rationale: Equivalente anatômico direto e natural, preservando a dimensão corporal da lamentação.
- source_word: כָּלוּ
  choice: desfalecem
  rationale: Comunica que os olhos estão se esgotando ou perdendo as forças, sem especificar indevidamente apenas perda de visão.
- source_word: עֵינַי
  choice: Meus olhos
  rationale: Tradução direta que mantém a imagem corporal do hebraico.
- source_word: מְיַחֵל
  choice: enquanto espero
  rationale: יחל reúne espera e expectativa esperançosa; 'espero' preserva em português essa ambivalência melhor que uma formulação exclusivamente temporal ou emocional.
- source_word: לֵאלֹהָי
  choice: pelo meu Deus
  rationale: A preposição ל marca o objeto da espera ou esperança, e o sufixo pessoal é preservado em 'meu Deus'.
