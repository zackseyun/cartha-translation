base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: pt
  text: Livra-me da lama; não me deixes afundar. Que eu seja livrado dos que me odeiam e das profundezas das águas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo hifil de נצל com sufixo de primeira pessoa pede uma intervenção ativa. “Livra-me” é natural, digno e mantém a ligação lexical com o pedido paralelo אִנָּצְלָה.
- source_word: מִטִּיט
  choice: da lama
  rationale: טיט pode designar lama, lodo ou barro. “Lama” comunica com clareza a matéria em que alguém pode afundar e soa natural no português atual.
- source_word: וְאַל אֶטְבָּעָה
  choice: não me deixes afundar
  rationale: A partícula negativa com o imperfeito de primeira pessoa expressa um pedido volitivo. Esta formulação reproduz naturalmente em português a força da súplica.
- source_word: אִנָּצְלָה
  choice: Que eu seja livrado
  rationale: A forma nifal coortativa de נצל renova a súplica e está em paralelismo com o imperativo inicial; a voz passiva preserva a forma e a tensão poética do hebraico.
- source_word: מִשֹּׂנְאַי
  choice: dos que me odeiam
  rationale: A expressão significa literalmente “dos que me odeiam”. Esta escolha evita substituir o ódio explicitamente mencionado pelo termo interpretativo “inimigos”.
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: e das águas profundas
  rationale: מַעֲמַקֵּי מָיִם descreve profundezas aquáticas. “Águas profundas” é uma expressão portuguesa clara e poética, preservando a imagem de perigo por submersão.
theological_decisions: []
