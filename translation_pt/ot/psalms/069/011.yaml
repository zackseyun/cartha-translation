  yaml_path: translation/ot/psalms/069/011.yaml
  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: pt
  text: Fiz do pano de saco a minha roupa e tornei-me motivo de zombaria para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um provérbio” ou “um dito”; isto é, alguém citado como exemplo e alvo de zombaria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Fiz
  rationale: Nesse uso de נתן, com “minha roupa” e “pano de saco”, o sentido é fazer ou adotar algo como vestimenta, não entregar alguma coisa.
- source_word: לְבוּשִׁי
  choice: a minha roupa
  rationale: Expressa naturalmente em português aquilo que o salmista usava como vestimenta e conserva o possessivo do hebraico.
- source_word: שָׂק
  choice: pano de saco
  rationale: Designa o tecido áspero usado em contextos de luto, humilhação e penitência; esta é uma expressão bíblica clara e corrente em português.
- source_word: וָאֱהִי
  choice: tornei-me
  rationale: Indica a passagem a um estado resultante, aqui o de ser tratado como objeto de escárnio.
- source_word: לָהֶם
  choice: para eles
  rationale: Conserva a relação expressa pela preposição hebraica e identifica o grupo para o qual o salmista se tornou alvo de zombaria.
- source_word: לְמָשָׁל
  choice: motivo de zombaria
  rationale: No contexto de humilhação pública, מָשָׁל descreve alguém transformado em exemplo proverbial ou dito de escárnio. A tradução comunica a força negativa do contexto, enquanto a nota preserva a imagem lexical.
