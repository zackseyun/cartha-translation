  register: Português moderno, claro e digno, com sintaxe natural e leitura acessível no Brasil e em outros contextos lusófonos. “Pano de saco” preserva a imagem cultural bíblica; “motivo de zombaria” torna explícita a conotação contextual de מָשָׁל sem eliminar sua alternativa proverbial, registrada na nota.
