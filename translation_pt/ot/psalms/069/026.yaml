  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: pt
  text: Pois eles perseguem aquele a quem tu feriste e contam a dor dos que traspassaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a dor dos teus mortos”. O termo hebraico também pode designar os mortos ou os que foram traspassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da imprecação anterior e preserva naturalmente o valor causal em português.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: aquele a quem tu feriste
  rationale: Supre o objeto implícito exigido pelo português, preservando a referência singular e a ação divina expressa no hebraico.
- source_word: רָדָפוּ
  choice: perseguem
  rationale: No contexto de lamento, o verbo descreve perseguição hostil, não mera ação de seguir.
- source_word: וְאֶל
  choice: e
  rationale: A preposição hebraica é idiomática nesta construção; em português, o objeto de 'contam' comunica de modo natural aquilo de que falam.
- source_word: מַכְאוֹב
  choice: a dor
  rationale: Equivalente direto que mantém o paralelismo poético com ferir e traspassar.
- source_word: חֲלָלֶיךָ
  choice: dos que traspassaste
  rationale: Representa o sentido de pessoas traspassadas ou gravemente feridas e expressa o sufixo como agência divina; a possibilidade de significar 'teus mortos' é preservada em nota.
- source_word: יְסַפֵּרוּ
  choice: contam
  rationale: O Piel de ספר significa contar ou relatar; 'contam' é claro e natural, sem acrescentar uma intenção não explicitada pelo verbo.
theological_decisions:
- issue: Se חֲלָלֶיךָ designa os feridos/traspassados por Deus ou os seus mortos
  choice: os que traspassaste
  alternative: teus mortos
  rationale: A menção da dor favorece pessoas feridas que ainda sofrem, mas o substantivo também pode designar mortos. A tradução mantém a primeira leitura no texto e registra a segunda em nota, sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de 'tu' para conservar a interpelação poética direta a Deus. A formulação mantém o singular na primeira oração e o plural na segunda.
