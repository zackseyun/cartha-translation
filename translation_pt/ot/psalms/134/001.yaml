  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: pt
  text: Cântico das subidas.[a] Vejam! Bendigam Yahweh, todos vocês, servos de Yahweh, que estão de pé na casa de Yahweh[b] à noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “Cântico de peregrinação” ou, mais literalmente, “Cântico das ascensões”.
    reason: lexical_alternative
  - marker: b
    text: A “casa de Yahweh” é o santuário do templo.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Preserva o título tradicional da coleção e traduz formalmente o plural מַעֲלוֹת, sem adotar no texto principal a interpretação mais específica de peregrinação.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Expressa de modo atual e enfático a partícula que chama a atenção dos ouvintes.
- source_word: בָּרֲכוּ
  choice: Bendigam
  rationale: Mantém o sentido litúrgico básico de ברך e a forma imperativa plural dirigida aos servos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino no texto hebraico, em vez de substituí-lo por um título.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: todos vocês, servos de Yahweh
  rationale: Torna explícito o endereço direto sugerido pelo imperativo e usa “servos”, adequado ao contexto do culto no santuário.
- source_word: הָעֹמְדִים
  choice: que ficam de pé
  rationale: Conserva a imagem concreta do particípio hebraico, sem substituí-la pela interpretação “que ministram”.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva o idioma hebraico “casa de Yahweh”; uma nota esclarece sua referência contextual ao santuário.
- source_word: בַּלֵּילוֹת
  choice: durante as noites
  rationale: Mantém o plural hebraico e comunica naturalmente a atividade noturna repetida ou continuada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o tetragrama como nome próprio; “Yahweh” preserva essa referência, enquanto “SENHOR” a substitui por um título.
- issue: Sentido de עֹמְדִים no serviço do templo
  choice: ficam de pé
  alternative: ministram
  rationale: A expressão concreta pode sugerir serviço cultual, mas o texto não substitui explicitamente o ato de estar de pé pelo verbo “ministrar”; a tradução mantém essa abertura sem resolver a implicação.
translation_notes:
  register: Português atual, claro e digno, com cadência poética. “Vejam!” conserva a convocação enfática sem recorrer ao arcaísmo “Eis”. “Ficam de pé” mantém a imagem hebraica concreta, e “durante as noites” preserva o plural de forma compreensível.
