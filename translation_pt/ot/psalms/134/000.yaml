base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: pt
  text: 'Cântico das subidas. Vejam: bendigam o SENHOR, todos vocês, servos do SENHOR, que estão de pé na casa do SENHOR, nas noites.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa do SENHOR” é o santuário do templo.
    reason: Nota cultural para esclarecer a referência de “casa do SENHOR”.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Reproduz de modo natural a expressão do título, preservando sua imagem e a possível referência às peregrinações a Jerusalém.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Mantém a força de chamada à atenção da partícula hebraica; “Eis” seria possível, mas é menos corrente no português moderno.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: O imperativo plural pode significar louvar, bendizer ou declarar bendito; “bendigam” preserva a formulação cultual sem restringir indevidamente o sentido.
- source_word: עֹמְדִים
  choice: permanecem
  rationale: No contexto do serviço no santuário, o particípio pode indicar estar de pé ou exercer serviço/presença contínua. “Permanecem” soa natural e evita sugerir apenas postura física.
- source_word: בַּלֵּילוֹת
  choice: durante as noites
  rationale: Preserva o plural hebraico e comunica o serviço noturno habitual, em vez de uma única noite.
theological_decisions:
- issue: Sentido de “casa do SENHOR”
  choice: Manter a expressão literal no texto
  alternative: Traduzir como “templo do SENHOR”
  rationale: A expressão hebraica designa aqui o santuário/templo, mas conservar “casa do SENHOR” mantém a metáfora bíblica e evita tornar explícito no corpo do texto o que pode ser esclarecido em nota.
- issue: Função dos servos que permanecem à noite
  choice: Não especificar sacerdotes ou levitas
  alternative: Identificá-los como ministros levíticos
  rationale: Embora o contexto cultual possa sugerir sacerdotes ou levitas, o hebraico diz apenas “servos do SENHOR”; a tradução não deve resolver essa identificação além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O título tradicional foi mantido sem numeração própria; “SENHOR” representa o nome divino יהוה. O marcador [a] aparece no texto principal.
