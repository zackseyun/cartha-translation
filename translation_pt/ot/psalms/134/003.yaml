  text: יְבָרֶכְ/ךָ֣ יְ֭הוָה מִ/צִּיּ֑וֹן עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: pt
  text: Que Yahweh abençoe você de Sião, criador dos céus e da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh abençoará você de Sião”. O verbo hebraico também pode ser entendido como um futuro simples, mas, neste contexto de bênção, o sentido de desejo é mais provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que ... abençoe você
  rationale: O imperfeito piel de ברך com sufixo masculino singular tem, nesta bênção conclusiva, valor volitivo. A construção com “que” expressa naturalmente um desejo ou uma invocação de bênção em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִצִּיּוֹן
  choice: desde Sião
  rationale: A preposição מִן indica a origem da bênção. “Desde Sião” preserva essa noção de procedência e evita sugerir que Sião seja o objeto da bênção.
- source_word: עֹשֵׂה
  choice: criador
  rationale: O particípio qal funciona como título em aposição a Yahweh. “Criador” mantém essa força nominal e identifica diretamente aquele que abençoa.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: dos céus e da terra
  rationale: A expressão forma um merismo que abrange toda a criação. O plural “céus” reflete a forma hebraica e é natural no registro bíblico português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o nome divino. A transliteração preserva a distinção entre o nome próprio e títulos como “Senhor”, sem acrescentar interpretação denominacional.
- issue: Valor do imperfeito יְבָרֶכְךָ na bênção final
  choice: 'Desejo ou invocação: “Que ... abençoe você”'
  alternative: 'Predição: “Yahweh abençoará você”'
  rationale: O contexto litúrgico e beneditório favorece o valor volitivo, embora a morfologia também possa admitir uma leitura de futuro simples.
- issue: Função de עֹשֵׂה
  choice: 'Título em aposição: “criador dos céus e da terra”'
  alternative: 'Oração relativa: “aquele que fez os céus e a terra”'
  rationale: O particípio pode descrever Yahweh como aquele que faz ou fez. A forma nominal conserva de modo conciso seu caráter de título, sem excluir a referência ao ato criador.
translation_notes:
  register: Português atual, digno e de fácil leitura, com preferência por “você” para tornar explícito o destinatário masculino singular do hebraico. “Desde Sião” soa um pouco mais solene que “de Sião”, mas comunica com clareza a origem da bênção.
