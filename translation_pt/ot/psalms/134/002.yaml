source:
  edition: WLC
  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: pt
  text: Ergam as mãos para o lugar santo e bendigam Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em direção ao santuário”, “no santuário” ou “em santidade”. O hebraico קֹדֶשׁ pode referir-se tanto à santidade quanto a um lugar santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Ergam
  rationale: Imperativo masculino plural de נשׂא. “Ergam” expressa de modo natural e concreto o ato físico solicitado.
- source_word: יְדֵיכֶם
  choice: as mãos
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa plural; o possessivo já fica claro pela forma verbal e pelo contexto, embora também fosse possível dizer “suas mãos”.
- source_word: קֹדֶשׁ
  choice: para o lugar santo
  rationale: קֹדֶשׁ pode designar santidade ou um lugar sagrado. Neste contexto cultual, a leitura direcional referente ao santuário é plausível, mas a ausência de preposição mantém abertas leituras locativa e qualitativa, registradas na nota.
- source_word: וּבָרֲכוּ
  choice: e bendigam
  rationale: Imperativo plural de ברך. “Bendigam” preserva a linguagem bíblica de declarar o louvor e a bênção dirigidos a Deus, sem reduzi-la simplesmente a “louvem”.
- source_word: אֶת
  choice: '[marca de objeto direto, não traduzida]'
  rationale: A partícula hebraica assinala o objeto direto definido e não possui equivalente lexical necessário em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de קֹדֶשׁ na expressão שְׂאוּ יְדֵיכֶם קֹדֶשׁ
  choice: 'Leitura direcional: “para o lugar santo”'
  alternative: Leitura locativa, “no santuário”, ou qualitativa, “em santidade”
  rationale: O contexto dos servos que ministram à noite na casa de Yahweh favorece uma referência ao espaço sagrado. Contudo, a construção hebraica não contém preposição e permite mais de uma análise; por isso, a tradução principal não elimina as alternativas, que são apresentadas em nota.
translation_notes:
  register: Português atual, claro e digno, com imperativos no plural. “Lugar santo” conserva o valor cultual sem tornar a frase excessivamente técnica; “santuário” aparece na nota como alternativa natural.
