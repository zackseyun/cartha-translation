  text: אַ֭שֻּׁרֵי/נוּ עַתָּ֣ה סבבו/ני עֵינֵי/הֶ֥ם יָ֝שִׁ֗יתוּ לִ/נְט֥וֹת בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: pt
  text: Em nossos passos, agora me cercam[a]; fixam os olhos em me lançar por terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico alterna aqui entre “nossos passos” e “me cercam”. Também se pode entender: “Agora cercaram nossos passos”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “para me fazer cair no chão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: em nossos passos
  rationale: Preserva o plural possessivo do hebraico e trata a expressão como referência à trajetória ou aos movimentos do salmista e de seu grupo, sem transformá-la diretamente no objeto do verbo.
- source_word: עַתָּה
  choice: agora
  rationale: Reproduz de modo direto o advérbio temporal que destaca a crise presente.
- source_word: סבבוני
  choice: me cercam
  rationale: Mantém o sufixo explícito de primeira pessoa singular no texto massorético e o sentido de rodear ou cercar.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: fixam os olhos
  rationale: Expressão portuguesa natural que conserva a imagem hebraica de dirigir atentamente os olhos para um objetivo hostil.
- source_word: לִנְטוֹת
  choice: em me lançar
  rationale: No contexto hostil, comunica a intenção de fazer o salmista inclinar-se, cair ou ser derrubado, sem recorrer a uma formulação obscura.
- source_word: בָּאָרֶץ
  choice: por terra
  rationale: Expressão idiomática em português para ser derrubado ao chão; corresponde ao sentido concreto de אֶרֶץ neste contexto.
theological_decisions:
- issue: Alternância entre referência plural e singular
  choice: Preservar “nossos” e “me”
  alternative: Uniformizar como “nossos... nos” ou “meus... me”
  rationale: O texto massorético alterna explicitamente entre o possessivo plural em “nossos passos” e o objeto singular em “me cercam”. Preservar a tensão evita harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção inicial é deliberadamente marcada para conservar a mudança hebraica de plural para singular; “por terra” mantém a imagem física em linguagem natural.
