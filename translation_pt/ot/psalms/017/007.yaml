  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: pt
  text: Manifesta de forma extraordinária o teu amor fiel[a], ó Salvador dos que em ti se refugiam daqueles que se levantam contra eles, com a tua mão direita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Torna maravilhoso o teu amor fiel”. O imperativo hebraico pode pedir que algo seja mostrado como extraordinário ou que seja tornado distinto ou maravilhoso.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final também pode estar ligada aos que buscam refúgio: “os que se refugiam à tua direita”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Mostra de modo maravilhoso
  rationale: O imperativo hifil de פלא pede que Deus manifeste seu amor como algo extraordinário; a formulação é natural em português e mantém a força do pedido.
- source_word: חֲסָדֶיךָ
  choice: o teu amor fiel
  rationale: חסד reúne amor, misericórdia e lealdade pactual. “Amor fiel” é claro e preserva a ideia central de constância e fidelidade.
- source_word: מוֹשִׁיעַ
  choice: ó Salvador
  rationale: O particípio funciona como vocativo ou aposição dirigida a Deus. “Ó Salvador” torna explícita essa força no registro de oração.
- source_word: חוֹסִים
  choice: dos que em ti se refugiam
  rationale: חסה descreve buscar ou encontrar refúgio. A inclusão de “em ti”, implícita no contexto da invocação a Deus, mantém viva a imagem de proteção.
- source_word: מִמִּתְקוֹמְמִים
  choice: daqueles que se levantam contra eles
  rationale: O particípio expressa uma ação hostil de levantar-se contra alguém. “Contra eles” explicita naturalmente o alvo implícito, isto é, os que se refugiam em Deus.
- source_word: בִּימִינֶךָ
  choice: com a tua mão direita
  rationale: A expressão é entendida principalmente como instrumento da ação salvadora de Deus e conserva a imagem antropomórfica de poder.
theological_decisions:
- issue: Relação sintática de בִּימִינֶךָ no fim do versículo
  choice: 'Ligada à ação salvadora de Deus: ele salva “com a tua mão direita”.'
  alternative: 'Ligada aos que buscam refúgio: “os que se refugiam à tua mão direita”.'
  rationale: A posição final da expressão permite mais de uma ligação sintática. A leitura instrumental é coerente e natural, mas a alternativa genuína é preservada em nota.
- issue: Objeto implícito da hostilidade em מִמִּתְקוֹמְמִים
  choice: “contra eles”, referindo-se aos que se refugiam em Deus
  alternative: Deixar o objeto sem explicitação ou entender “contra ti”.
  rationale: O hebraico não declara o objeto de modo expresso. O referente humano imediato produz a leitura contextual mais natural, sem transformar a inferência em uma afirmação dogmática.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém o tratamento em segunda pessoa singular, comum no registro bíblico e poético, e conserva a ambiguidade sintática relevante em nota.
