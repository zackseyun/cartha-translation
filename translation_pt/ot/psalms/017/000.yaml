base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: pt
  text: Oração de Davi. Ouve, SENHOR, uma causa justa[a]; presta atenção ao meu clamor; dá ouvidos à minha oração, vinda de lábios sem engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouve a justiça” ou “ouve o que é justo”. O hebraico pode se referir à justiça, à retidão ou a uma causa justa; aqui, provavelmente indica a causa que o salmista apresenta como justa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Oração de Davi
  rationale: Reproduz de modo natural a fórmula do título; a preposição לְ pode indicar autoria, associação ou dedicação, e a formulação portuguesa preserva a concisão tradicional sem desenvolver essa relação.
- source_word: צֶדֶק
  choice: uma causa justa
  rationale: No contexto forense da súplica, o substantivo pode designar justiça, retidão ou aquilo que é justo; “uma causa justa” comunica o sentido provável sem atribuir ao salmista impecabilidade moral absoluta.
- source_word: רִנָּתִי
  choice: meu clamor
  rationale: Aqui רִנָּה não indica necessariamente canto jubiloso, mas um grito ou apelo dirigido a Deus.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: feita por lábios sem engano
  rationale: A expressão hebraica é compacta e modifica a oração; a explicitação de “feita por” produz português claro e mantém a afirmação de sinceridade.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes, sem inserir no texto uma reconstrução vocal específica.
- issue: Alcance de צֶדֶק
  choice: causa justa
  alternative: justiça / o que é justo
  rationale: A escolha acompanha o cenário de apelo judicial sugerido pelo contexto, enquanto a nota preserva a amplitude lexical e evita resolver em excesso a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado nos três pedidos. “Presta atenção” e “dá ouvidos” distinguem naturalmente os verbos hebraicos de escuta. A pontuação integra o título e a súplica sem acrescentar estrutura ausente do texto-fonte.
