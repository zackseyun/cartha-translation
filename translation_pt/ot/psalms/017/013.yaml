base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: pt
  text: Levanta-te, ó Yahweh; enfrenta-o, derruba-o; livra a minha vida[a] do ímpio com a tua espada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico néfesh, muitas vezes traduzido por «alma»; aqui, no contexto de perigo mortal, provavelmente significa «vida» ou «a própria pessoa».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «livra a minha vida do ímpio, que é a tua espada». O hebraico também pode retratar o ímpio como um instrumento na mão de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: Imperativo dirigido a Yahweh. A forma comunica com naturalidade a urgência do apelo e mantém o tom elevado do salmo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קַדְּמָה פָנָיו
  choice: enfrenta-o
  rationale: A expressão significa literalmente ir ou apresentar-se diante do rosto dele; no contexto de intervenção contra um inimigo, «enfrenta-o» expressa de modo natural sua força idiomática.
- source_word: הַכְרִיעֵהוּ
  choice: abate-o
  rationale: O hifil de כרע indica fazer o adversário curvar-se, cair ou ser rebaixado. «Abate-o» preserva a concisão, a força e o contexto de confronto.
- source_word: פַּלְּטָה
  choice: livra
  rationale: O imperativo de פלט pede resgate ou libertação. «Livra» é claro e mantém o registro tradicionalmente associado à oração dos salmos.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: נפש pode designar alma, vida, pessoa ou o próprio ser. Neste contexto de perigo mortal, «a minha vida» comunica o referente concreto sem impor uma leitura antropológica abstrata.
- source_word: מֵרָשָׁע
  choice: do perverso
  rationale: O termo está no singular e pode referir-se ao adversário individual indicado pelos sufixos masculinos singulares anteriores. «Perverso» preserva tanto a referência pessoal quanto o caráter moral do termo.
- source_word: חַרְבֶּךָ
  choice: com a tua espada
  rationale: A sequência hebraica é sintaticamente compacta. No texto principal, a espada é entendida como o meio pelo qual Yahweh livra o salmista; a leitura apositiva é preservada em nota.
theological_decisions:
- issue: Relação sintática entre «o perverso» e «a tua espada»
  choice: 'Leitura instrumental: Yahweh livra o salmista por meio de sua espada.'
  alternative: 'Leitura apositiva: o perverso é a espada, isto é, um instrumento na mão de Yahweh.'
  rationale: O hebraico מֵרָשָׁע חַרְבֶּךָ admite ambas as relações. O encadeamento de imperativos que pedem a intervenção divina favorece a leitura instrumental no texto principal, mas a alternativa afeta significativamente a imagem da agência divina e, por isso, não deve ser ocultada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega pronomes átonos e segunda pessoa do singular em registro bíblico moderado, sem arcaísmos desnecessários. A concisão e o paralelismo imperativo do hebraico foram preservados.
