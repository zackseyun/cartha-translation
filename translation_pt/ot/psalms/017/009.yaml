translation:
  language: pt
  text: 'dos perversos que me devastam,

    dos meus inimigos, que atentam contra a minha vida e me cercam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus inimigos mortais, que me cercam”. O hebraico inclui literalmente “vida” ou “alma” (בְּנֶפֶשׁ). A expressão pode descrever inimigos que visam à vida do salmista, em vez de simplesmente qualificá-los como “mortais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: dos
  rationale: No contexto do pedido de proteção, a expressão indica a fonte hostil da qual o salmista busca livramento. “Dos” é natural em português e evita o literalismo pouco idiomático “de diante de”.
- source_word: רְשָׁעִים
  choice: perversos
  rationale: O substantivo adjetival plural designa pessoas moralmente culpadas. “Perversos” preserva a categoria ética e soa natural no registro poético.
- source_word: זוּ
  choice: que
  rationale: A partícula relativa liga “perversos” ao verbo seguinte; “que” é a forma portuguesa direta e idiomática.
- source_word: שַׁדּוּנִי
  choice: me devastam
  rationale: O verbo שׁדד comunica ruína ou violência severa. “Me devastam” mantém essa força sem necessariamente afirmar aniquilação total.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Tradução direta do substantivo plural com sufixo possessivo de primeira pessoa.
- source_word: בְּנֶפֶשׁ
  choice: mortais
  rationale: A expressão com נֶפֶשׁ provavelmente apresenta os inimigos como ameaça à vida do salmista. “Inimigos mortais” expressa naturalmente essa força, enquanto a nota conserva a formulação mais explícita e a ambiguidade lexical.
- source_word: יַקִּיפוּ עָלָי
  choice: me cercam
  rationale: O Hifil de נקף com עַל descreve cercar ou rodear alguém. “Me cercam” é claro, vívido e idiomático.
