translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. “Perversos” evita acrescentar marcação masculina ausente no hebraico; “mortais” comunica de modo natural a ameaça à vida, e a nota preserva a alternativa mais literal.
