base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: pt
  text: Que da tua presença saia a minha sentença[a]; que os teus olhos vejam o que é reto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a decisão sobre a minha causa” ou “a minha vindicação”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a equidade” ou “o que é justo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: da tua presença
  rationale: Expressa de modo natural em português a ideia hebraica de algo que procede de diante da face de Deus, preservando a imagem de sua presença judicial.
- source_word: מִשְׁפָּטִי
  choice: a minha sentença
  rationale: No contexto forense, מִשְׁפָּטִי pode indicar a decisão ou o veredito relativo à causa do salmista. “Sentença” mantém esse sentido judicial sem tornar explícita uma absolvição favorável.
- source_word: יֵצֵא
  choice: saia
  rationale: Reproduz diretamente a imagem de uma decisão que sai ou procede da presença de Deus e mantém a forma de petição do imperfeito hebraico no contexto.
- source_word: עֵינֶיךָ
  choice: os teus olhos
  rationale: Conserva a expressão antropomórfica e a concretude poética do hebraico.
- source_word: תֶּחֱזֶינָה
  choice: vejam
  rationale: É uma tradução clara e atual do verbo de percepção חזה; o contexto comunica a ideia de exame atento.
- source_word: מֵישָׁרִים
  choice: o que é reto
  rationale: O plural hebraico pode designar retidão, equidade ou coisas retas. A expressão escolhida é natural e preserva tanto a dimensão moral quanto a judicial.
theological_decisions:
- issue: Ler os imperfeitos hebraicos como declaração futura ou como petição
  choice: 'Petição: “Que... saia”; “que... vejam”'
  alternative: 'Declaração ou expectativa futura: “Minha sentença sairá...; teus olhos verão...”'
  rationale: O contexto de oração favorece o valor volitivo, mas a formulação não acrescenta certeza ou promessa além do que a gramática permite.
- issue: Explicitar que a sentença é uma vindicação favorável
  choice: Manter “a minha sentença” no texto principal
  alternative: “a minha vindicação” ou “a decisão favorável à minha causa”
  rationale: O salmista espera ser vindicado, mas מִשְׁפָּטִי, por si só, pode significar sentença, julgamento ou causa. A tradução principal preserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo hebraico e a imagem judicial foram preservados; “tua” mantém o tratamento singular e poético dirigido a Deus.
