  text: תָּמֹ֣ךְ אֲ֭שֻׁרַ/י בְּ/מַעְגְּלוֹתֶ֑י/ךָ בַּל נָמ֥וֹטּוּ פְעָמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: pt
  text: Meus passos se mantiveram firmes nas tuas veredas[a]; meus pés não escorregaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sustenta os meus passos nas tuas veredas”. A forma hebraica pode ser entendida como um pedido ou como uma afirmação de firmeza.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹךְ
  choice: se mantiveram firmes
  rationale: A forma de תמך comunica sustentação ou firmeza. No paralelismo com “não escorregaram”, a expressão apresenta de modo natural a perseverança dos passos, sem ocultar em nota a possível leitura como pedido.
- source_word: אֲשֻׁרַי
  choice: meus passos
  rationale: O substantivo designa passos ou o curso do caminhar; “meus passos” preserva a metáfora concreta e é português corrente.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: nas tuas veredas
  rationale: מַעְגָּל designa uma trilha, pista ou caminho. “Veredas” conserva a imagem poética de caminhos definidos e combina naturalmente com a preposição hebraica בְּ.
- source_word: בַּל
  choice: não
  rationale: Equivalente direto e natural da partícula poética de negação.
- source_word: נָמֹטּוּ
  choice: escorregaram
  rationale: מוט pode indicar vacilar, resvalar ou ser abalado. Com pés como sujeito, “escorregaram” expressa com clareza a imagem física do hebraico.
- source_word: פְעָמָי
  choice: meus pés
  rationale: Embora o termo possa significar passos ou pisadas, “meus pés” é uma metonímia natural em português com o verbo “escorregar” e evita repetição pesada.
theological_decisions:
- issue: 'A função de תָּמֹךְ: afirmação ou pedido'
  choice: 'Afirmação de firmeza: “Meus passos se mantiveram firmes”'
  alternative: 'Petição: “Sustenta os meus passos”'
  rationale: 'A forma hebraica admite discussão: pode funcionar como expressão enfática associada à afirmação seguinte ou ser entendida com força de pedido. O paralelismo com o perfeito “não escorregaram” favorece no texto principal a leitura afirmativa, enquanto a nota conserva a alternativa genuína.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veredas” mantém o tom poético sem soar obscuro; “escorregaram” torna concreta a imagem do caminhar.
