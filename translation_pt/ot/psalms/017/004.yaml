  text: לִ/פְעֻלּ֣וֹת אָ֭דָם בִּ/דְבַ֣ר שְׂפָתֶ֑י/ךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: pt
  text: Quanto às ações humanas, pela palavra dos teus lábios, eu me guardei dos caminhos dos violentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “guardei os caminhos do violento”. O hebraico também pode ser entendido como “observei” ou “vigiei os caminhos do violento”, mas o contexto favorece o sentido de evitá-los.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Quanto às ações humanas
  rationale: O לְ introduz o âmbito ou tópico, e אָדָם tem sentido genérico. “Ações humanas” comunica naturalmente a conduta das pessoas sem sugerir um homem específico.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: pela palavra dos teus lábios
  rationale: 'O בְּ tem valor instrumental: a palavra de Deus é o meio ou a norma pela qual o salmista se guarda. A referência aos “lábios” preserva a imagem poética hebraica.'
- source_word: שָׁמַרְתִּי
  choice: eu me guardei dos
  rationale: Embora o verbo possa significar guardar, observar ou vigiar, neste contexto ele provavelmente expressa autocontrole e afastamento. O pronome reflexivo explicita em português esse sentido contextual sem ocultar a leitura mais literal, registrada em nota.
- source_word: אָרְחוֹת
  choice: caminhos
  rationale: Mantém a metáfora concreta de um percurso que representa modo de vida ou conduta.
- source_word: פָּרִיץ
  choice: os violentos
  rationale: O termo designa quem age com violência ou crueldade. O plural idiomático concorda naturalmente com os “caminhos” associados a esse tipo de pessoa.
theological_decisions:
- issue: Sentido de שָׁמַרְתִּי com “os caminhos dos violentos”
  choice: O salmista afirma que, mediante a palavra de Deus, evitou os caminhos dos violentos.
  alternative: O salmista afirma que observou ou vigiou os caminhos do violento.
  rationale: שׁמר admite os sentidos de guardar, vigiar e observar, mas a declaração de integridade no contexto favorece a ideia de se resguardar de uma conduta violenta. A ambiguidade real do hebraico é preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção “palavra dos teus lábios” conserva deliberadamente o paralelismo e a imagem poética do hebraico.
