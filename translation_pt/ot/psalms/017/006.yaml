  - marker: b
    text: “Inclina o teu ouvido para mim” é uma expressão hebraica que pede a Deus que escute com atenção.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Eu te invoco
  rationale: O perfeito qal na poesia de oração pode descrever um chamado já feito, uma invocação presente ou uma ação expressa com confiança. “Eu te invoco” é natural em português e mantém a oração direta sem restringir indevidamente o valor temporal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão confiante da invocação e conserva de modo conciso a relação causal.
- source_word: תַעֲנֵנִי
  choice: tu me respondes
  rationale: O imperfeito pode ter nuance presente ou futura. O presente comunica a confiança do salmista na resposta de Deus sem excluir a expectativa futura.
- source_word: אֵל
  choice: ó Deus
  rationale: O substantivo está em uso vocativo; “ó Deus” preserva adequadamente a forma de tratamento da oração.
- source_word: הַט אָזְנְךָ לִי
  choice: inclina para mim o teu ouvido
  rationale: Mantém a imagem concreta do idioma hebraico, que pede atenção cuidadosa, em formulação poética compreensível em português.
- source_word: שְׁמַע
  choice: ouve
  rationale: Preserva a força do imperativo e o paralelismo com a expressão anterior sobre o ouvido.
- source_word: אִמְרָתִי
  choice: as minhas palavras
  rationale: Embora a forma recebida seja singular, o substantivo designa aqui a fala ou declaração do orante; o plural idiomático em português comunica naturalmente o conteúdo verbal dirigido a Deus, em consonância com o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” coerente com a oração poética. A metáfora hebraica do ouvido foi preservada e explicada em nota. Os dois imperativos finais mantêm o paralelismo e a intensidade do apelo.
