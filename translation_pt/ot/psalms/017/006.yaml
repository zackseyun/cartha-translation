  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: pt
  text: Eu te invoco[a], pois tu me respondes, ó Deus; inclina o teu ouvido para mim[b]; ouve a minha palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu te invoquei, porque tu me responderás, ó Deus”. Na poesia de oração, as formas verbais hebraicas podem admitir nuance passada, presente ou de futuro expresso com confiança.'
