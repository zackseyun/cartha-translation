base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: pt
  text: Oração de Davi. Ouve, Yahweh, uma causa justa[a]; atende ao meu clamor; dá ouvidos à minha oração, que procede de lábios sem engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouve a justiça”, isto é, ouve o que é justo. O hebraico pode significar justiça, retidão ou uma causa justa; aqui provavelmente se refere à causa justa do salmista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Oração de Davi
  rationale: A fórmula de cabeçalho identifica o salmo como oração associada a Davi, provavelmente de sua autoria; a construção sem artigo é natural em títulos portugueses.
- source_word: שִׁמְעָה
  choice: Ouve
  rationale: O imperativo preserva o apelo direto e introduz a sequência poética de pedidos para que Deus escute.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: צֶדֶק
  choice: uma causa justa
  rationale: Como objeto de 'ouve', o substantivo provavelmente designa a causa ou reivindicação justa do salmista, embora o sentido mais literal 'justiça' permaneça possível e seja registrado em nota.
- source_word: הַקְשִׁיבָה
  choice: atende a
  rationale: Expressa escuta atenta e deliberada, distinguindo este verbo dos demais pedidos paralelos.
- source_word: רִנָּתִי
  choice: meu clamor
  rationale: No contexto de súplica, o termo indica um grito urgente, não um brado de alegria.
- source_word: הַאֲזִינָה
  choice: dá ouvidos a
  rationale: Preserva a imagem auditiva do hebraico e mantém um registro poético corrente e compreensível.
- source_word: תְפִלָּתִי
  choice: minha oração
  rationale: Mantém a correspondência lexical com o termo 'oração' do cabeçalho.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: feita por lábios sem engano
  rationale: Explicita naturalmente em português que a oração procede de lábios livres de falsidade, sem alterar a afirmação do texto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome pessoal em vocativo. A transliteração 'Yahweh' o preserva em vez de substituí-lo por um título.
- issue: Sentido de צֶדֶק como objeto de 'ouvir'
  choice: uma causa justa
  alternative: a justiça; o que é justo
  rationale: O contexto de apelo judicial favorece a causa justa do salmista, mas a concisão do hebraico admite uma referência mais abstrata à justiça; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e poético, com legibilidade brasileira ampla. Os três verbos de audição foram diferenciados como “ouve”, “atende” e “dá ouvidos” para conservar o paralelismo e a variação lexical do hebraico.
