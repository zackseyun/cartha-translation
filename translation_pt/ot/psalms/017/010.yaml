lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: o coração insensível
  rationale: O hebraico diz literalmente «a gordura deles». Na poesia hebraica, «gordura» pode representar insensibilidade e autossatisfação. Em português, explicitar «coração» torna a imagem compreensível; «insensível» comunica o sentido no contexto.
- source_word: סָּגְרוּ
  choice: fecharam
  rationale: Mantém o sentido direto do verbo hebraico «fechar» e a imagem de uma disposição interior vedada ou endurecida.
- source_word: פִּימוֹ
  choice: com a boca
  rationale: A forma hebraica traz «a boca deles» no singular coletivo. «Com a boca» conserva naturalmente esse valor em português.
- source_word: דִּבְּרוּ
  choice: falam
  rationale: Embora a forma hebraica seja perfeita, no retrato poético ela pode descrever uma conduta característica; o presente é natural em português.
- source_word: בְגֵאוּת
  choice: com arrogância
  rationale: O substantivo hebraico denota orgulho, altivez ou arrogância. A locução preserva a forma nominal e expressa claramente o sentido moral negativo.
