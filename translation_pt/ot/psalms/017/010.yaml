  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: pt
  text: Eles fecham o coração insensível[a]; com a boca falam com arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a gordura deles». Aqui, «gordura» pode representar metaforicamente um coração insensível ou satisfeito consigo mesmo.
