lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Ele é como
  rationale: Embora o hebraico comece nominalmente com “a semelhança dele”, a comparação direta expressa o sentido com naturalidade em português e evita a redundância de “a sua semelhança é como”.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: Reproduz de modo claro e natural a partícula comparativa כְּ e o substantivo אַרְיֵה.
- source_word: יִכְסוֹף
  choice: ávido
  rationale: O verbo indica desejo intenso; no contexto predatório, “ávido” comunica a forte disposição do leão para atacar.
- source_word: לִטְרוֹף
  choice: por dilacerar
  rationale: טרף, na imagem de um animal predador, pode designar agarrar e despedaçar a presa. “Dilacerar” mantém a força concreta da metáfora.
- source_word: וְכִכְפִיר
  choice: como um leão novo
  rationale: כְּפִיר designa um leão jovem, e a construção introduz uma segunda comparação paralela.
- source_word: יֹשֵׁב
  choice: à espreita
  rationale: O particípio significa literalmente “sentado”, mas, em combinação com lugares ocultos e a imagem do predador, descreve alguém postado em emboscada. A tradução contextual é mais natural, e o sentido literal é preservado em nota.
- source_word: בְּמִסְתָּרִים
  choice: em lugares ocultos
  rationale: Preserva o plural e comunica claramente locais escondidos ou encobertos.
