  text: אֲנִ֗י בְּ֭/צֶדֶק אֶחֱזֶ֣ה פָנֶ֑י/ךָ אֶשְׂבְּעָ֥ה בְ֝/הָקִ֗יץ תְּמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: pt
  text: Quanto a mim, em justiça contemplarei o teu rosto; quando eu despertar[a], ficarei satisfeito com a tua semelhança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O despertar pode ser entendido como o acordar comum do sono ou como um despertar na vindicação final ou ressurreição.
    reason: alternative_reading
  - marker: b
    text: Ou «a tua forma» ou «a tua imagem».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: em justiça
  rationale: Preserva a formulação compacta do hebraico e não determina se a justiça é a integridade do salmista, a justa vindicação concedida por Deus ou outra nuance forense.
- source_word: אֶחֱזֶה
  choice: contemplarei
  rationale: O verbo חזה indica ver ou perceber atentamente; «contemplarei» mantém a força elevada e deliberada do verbo sem soar arcaico.
- source_word: פָנֶיךָ
  choice: o teu rosto
  rationale: Traduz diretamente a imagem concreta do hebraico. «Tua presença» seria uma extensão interpretativa possível, mas menos formalmente próxima.
- source_word: אֶשְׂבְּעָה
  choice: ficarei satisfeito
  rationale: 'Expressa naturalmente o sentido de שׂבע no qal: estar saciado, pleno ou satisfeito.'
- source_word: בְּהָקִיץ
  choice: quando eu despertar
  rationale: A construção com בְּ e infinitivo indica tempo. A expressão portuguesa preserva a ambiguidade entre despertar do sono comum e um possível despertar ligado à vindicação final.
- source_word: תְּמוּנָתֶךָ
  choice: a tua semelhança
  rationale: תְּמוּנָה pode significar semelhança, forma ou imagem. «Semelhança» conserva a concretude do substantivo sem definir uma forma física precisa.
theological_decisions:
- issue: Se בְּהָקִיץ se refere ao despertar comum do sono ou sugere ressurreição e vindicação final
  choice: O texto principal diz «quando eu despertar», sem especificar a natureza desse despertar.
  alternative: Entender a expressão exclusivamente como o despertar diário ou exclusivamente como um despertar escatológico na ressurreição.
  rationale: O hebraico não resolve explicitamente a questão. Manter a expressão aberta preserva a tensão teológica do texto, enquanto a nota apresenta as principais possibilidades.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e as imagens concretas do hebraico foram preservados. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
