  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: pt
  text: Examinaste o meu coração, visitaste-me de noite; provaste-me e nada encontraste.[a] Decidi que a minha boca não transgredirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Planejei; a minha boca não ultrapassará”, isto é, o salmista resolve não exceder os limites naquilo que diz.'
    reason: Alternativa lexical e sintática para o hebraico condensado do final do versículo.
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: Examinaste
  rationale: O verbo descreve exame ou prova do caráter; “examinaste” combina naturalmente com “o meu coração” e preserva o sentido avaliativo.
- source_word: לִבִּי
  choice: o meu coração
  rationale: “Coração” conserva a antropologia hebraica, na qual representa a pessoa interior, incluindo pensamentos e intenções.
- source_word: פָּקַדְתָּ
  choice: visitaste-me
  rationale: פקד pode significar visitar, inspecionar ou atentar para alguém. “Visitaste-me” preserva o idioma hebraico, enquanto o contexto comunica que se trata de escrutínio divino.
- source_word: לַּיְלָה
  choice: de noite
  rationale: O termo funciona adverbialmente; “de noite” é conciso, natural e adequado ao registro poético.
- source_word: צְרַפְתַּנִי
  choice: provaste-me
  rationale: צרף designa literalmente o refino de metais e, por metáfora, a prova de uma pessoa. “Provaste-me” comunica esse sentido sem tornar explícita demais a imagem metalúrgica.
- source_word: בַל תִּמְצָא
  choice: e nada encontraste
  rationale: A negação recai sobre o verbo, sem objeto expresso. “Nada encontraste” mantém a concisão e não acrescenta “mal” ou “culpa”, que não aparecem no hebraico.
- source_word: זַמֹּתִי
  choice: Decidi
  rationale: A forma é entendida verbalmente, com o sentido de determinar ou resolver. “Decidi” é atual e natural em português.
- source_word: בַל יַעֲבָר פִּי
  choice: que a minha boca não transgredirá
  rationale: עבר significa literalmente passar ou ultrapassar. Com “boca”, indica ultrapassar limites na fala; “não transgredirá” preserva a força moral e funciona como conteúdo da decisão.
theological_decisions:
- issue: Interpretação do cólon final
  choice: “Decidi que a minha boca não transgredirá.”
  alternative: “O que planejei, a minha boca não ultrapassará” ou “a minha boca não transgride”.
  rationale: O hebraico é condensado e admite mais de uma segmentação. Entender זַמֹּתִי como verbo e a oração seguinte como conteúdo da decisão produz sentido coerente no contexto, sem transformar a afirmação em uma doutrina de impecabilidade.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. Mantiveram-se “coração”, “visitaste-me” e “boca” para preservar as imagens hebraicas; a ambiguidade do final foi registrada em nota.
