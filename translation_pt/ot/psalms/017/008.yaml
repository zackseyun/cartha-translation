  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: pt
  text: Guarda-me como se guarda a pupila do olho[a]; esconde-me à sombra das tuas asas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “a menina dos olhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Guarda-me
  rationale: O verbo שׁמר expressa guardar, vigiar ou proteger. “Guarda-me” é direto, natural e mantém a forma de súplica sem especificar além do texto o modo da proteção.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: como a pupila do olho
  rationale: A expressão hebraica designa a pupila, parte sensível e cuidadosamente protegida do olho. Esta formulação comunica a imagem anatômica de modo claro, sem substituir a metáfora por sua interpretação.
- source_word: בְּצֵל
  choice: à sombra
  rationale: צֵל pode significar “sombra” ou “abrigo proporcionado pela sombra”. “À sombra” preserva a imagem poética e forma uma expressão natural com “asas” em português.
- source_word: כְּנָפֶיךָ
  choice: das tuas asas
  rationale: כָּנָף significa “asa”. A tradução literal conserva a metáfora bíblica de proteção divina e evita explicá-la no corpo do verso.
- source_word: תַּסְתִּירֵנִי
  choice: esconde-me
  rationale: No hifil, סתר significa esconder ou ocultar. “Esconde-me” traduz o verbo diretamente e mantém a vívida imagem de proteção.
theological_decisions:
- issue: Tradução da expressão protetora relacionada ao olho
  choice: 'Traduzir a expressão hebraica pelo seu referente concreto: “a pupila do olho”.'
  alternative: “a menina dos olhos”
  rationale: O verso apresenta uma imagem concreta de proteção cuidadosa. “Pupila do olho” é transparente para leitores atuais, enquanto a forma tradicional pode ser entendida principalmente como uma expressão de estima.
- issue: Preservação da imagem das asas
  choice: Manter “tuas asas” como metáfora da proteção divina.
  alternative: Explicitar como “teu cuidado” ou “tua proteção”.
  rationale: O hebraico emprega linguagem poética e figurada. Conservar a imagem mantém a força literária e a tensão própria do texto sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. O uso de “tuas” preserva o tratamento singular presente no hebraico e é amplamente compreensível, inclusive no Brasil.
