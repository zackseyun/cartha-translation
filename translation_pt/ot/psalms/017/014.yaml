source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: pt
  text: 'dos homens, pela tua mão, ó Yahweh,[a]

    dos homens deste mundo,

    cuja porção está nesta vida.


    Tu lhes enches o ventre com o que tens reservado;

    eles se fartam de filhos[b]

    e deixam o que lhes sobra para suas crianças.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sintaxe hebraica é condensada. Também pode ser entendida como “dos homens da tua mão”.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico “filhos”, no masculino plural. Outra leitura possível é: “seus filhos se fartam”.'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Ou “para seus pequeninos”. O termo hebraico se refere mais especificamente a crianças pequenas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: dos homens
  rationale: No contexto, refere-se aos adversários humanos e continua a súplica por livramento do versículo anterior. “Dos mortais” seria possível, mas “dos homens” preserva melhor o paralelismo e o masculino plural.
- source_word: יָדְךָ
  choice: pela tua mão
  rationale: Expressa a possível ideia de meio ou agência divina sem esconder a sintaxe hebraica comprimida; outras relações sintáticas permanecem possíveis e são registradas em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מֵחֶלֶד
  choice: deste mundo
  rationale: חֶלֶד aponta aqui para a esfera temporal da vida humana. “Deste mundo” é natural em português e combina com a frase seguinte, sem explicitar uma doutrina escatológica além do texto.
- source_word: חֶלְקָם בַּחַיִּים
  choice: cuja porção está nesta vida
  rationale: Comunica que a parte desses homens se encontra na vida presente, preservando o contraste temporal do contexto. “Sua porção está entre os vivos” continua sendo uma possibilidade lexical.
- source_word: וּצְפוּנְךָ
  choice: com o que tens reservado
  rationale: O termo designa aquilo que está oculto ou guardado. A formulação evita especificar indevidamente se se trata de tesouro ou de outros bens providos por Deus.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Tu lhes enches o ventre
  rationale: Mantém a imagem concreta do hebraico, na qual בֶּטֶן significa aqui mais naturalmente “ventre” como lugar de saciedade.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: eles se fartam de filhos
  rationale: Toma os homens como sujeito do verbo e בָנִים como aquilo com que se fartam. Conserva “filhos”, masculino plural explícito no hebraico, associado no contexto à prosperidade e à numerosa descendência.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: deixam o que lhes sobra
  rationale: יֶתֶר denota restante, excedente ou sobra. A expressão comunica naturalmente a abundância remanescente transmitida aos descendentes sem reduzi-la necessariamente a dinheiro.
- source_word: לְעוֹלְלֵיהֶם
  choice: para suas crianças
  rationale: עוֹלָלִים designa especificamente crianças pequenas. “Crianças” soa natural no contexto de transmissão à geração seguinte, e a nuance etária é indicada em nota.
theological_decisions:
- issue: Relação dos adversários com a mão de Deus
  choice: “dos homens, pela tua mão, ó Yahweh” apresenta a mão divina como possível meio do livramento, sem definir os homens como instrumentos de juízo.
  alternative: “dos homens da tua mão” ou “dos homens, da tua mão”
  rationale: A construção hebraica é condensada e admite mais de uma análise. A nota preserva essa ambiguidade em vez de impor uma explicação específica da providência divina.
- issue: Prosperidade temporal dos adversários
  choice: “cuja porção está nesta vida” descreve a porção presente desses homens.
  alternative: “cuja porção está entre os vivos”
  rationale: A tradução conserva o contraste temporal sugerido pelo salmo, mas não acrescenta uma afirmação explícita sobre seu destino futuro.
- issue: Sentido de יִשְׂבְּעוּ בָנִים
  choice: Os próprios homens se fartam de filhos, entendidos como sinal de abundante descendência.
  alternative: “seus filhos se fartam”
  rationale: A sequência hebraica permite alguma incerteza sintática. A leitura escolhida se ajusta ao sujeito anterior e ao quadro de prosperidade, enquanto a alternativa é preservada na nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O fragmento inicial foi mantido porque a frase continua a súplica do versículo anterior. A segunda pessoa singular usa “tu” para conservar o discurso direto ao nome divino; as imagens concretas de “porção”, “ventre” e “fartar-se” foram preservadas.
