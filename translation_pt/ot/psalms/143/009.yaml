  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: pt
  text: Livra-me dos meus inimigos, ó Yahweh; em ti me refugiei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a ti me escondi” ou “em ti procurei abrigo”. A expressão hebraica comunica a ideia de buscar proteção em Deus.
    reason: alternativa lexical
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo hifil de נצל, com sufixo de primeira pessoa do singular, exprime um pedido direto de libertação ou resgate. “Livra-me” é natural, solene e apropriado à linguagem de oração dos salmos.
- source_word: מֵאֹיְבַי
  choice: dos meus inimigos
  rationale: A preposição מִן indica afastamento, e o plural אֹיְבַי significa diretamente “meus inimigos”.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: O tetragrama é transliterado como o nome divino “Yahweh”, e a partícula vocativa portuguesa “ó” torna claro o apelo direto.
- source_word: אֵלֶיךָ
  choice: em ti
  rationale: Embora אֶל normalmente signifique “a” ou “para”, junto de כִסִּתִי a expressão comunica a busca de proteção junto a Deus. “Em ti” preserva o foco antecipado do hebraico e soa natural com “buscar abrigo”.
- source_word: כִסִּתִי
  choice: busco abrigo
  rationale: A forma deriva de כסה, cujo sentido básico envolve cobrir ou esconder. Neste contexto, a construção é entendida como procurar proteção. O presente português expressa naturalmente a confiança atual do salmista sem tornar excessivamente literal a imagem hebraica; a nota registra as alternativas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido da oração אֵלֶיךָ כִסִּתִי
  choice: em ti busco abrigo
  alternative: para junto de ti me escondi; em ti me refugiei
  rationale: A construção hebraica admite uma tradução mais concreta ligada a esconder-se, mas no contexto expressa a busca de proteção em Deus. A tradução principal comunica o valor idiomático sem eliminar a metáfora, que é explicitada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem “em ti busco abrigo” acompanha a ênfase inicial do hebraico em אֵלֶיךָ. O vocativo “ó Yahweh” mantém o tom de súplica do salmo.
