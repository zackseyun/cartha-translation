base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/005.yaml
  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: pt
  text: Lembro-me dos dias de outrora[a]; medito em toda a tua obra; reflito sobre a obra das tuas mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Recordei-me dos dias de outrora». O perfeito hebraico pode referir-se a uma lembrança passada ou à ação presente de trazer esses dias à memória.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode significar «medito», «pondero» ou até «falo». Neste contexto, o paralelismo favorece a ideia de reflexão interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: Lembro-me
  rationale: O qal perfeito na primeira pessoa pode indicar uma lembrança passada ou a ação presente de trazer algo à memória. O presente expressa naturalmente a reflexão em curso no salmo.
- source_word: יָמִים מִקֶּדֶם
  choice: os dias de outrora
  rationale: A expressão designa tempos antigos. «De outrora» é conciso, poético e compreensível no português atual.
- source_word: הָגִיתִי בְכָל־פָּעֳלֶךָ
  choice: medito em tudo o que fizeste
  rationale: הגה comunica a ideia de meditar ou ponderar. A formulação portuguesa transmite o sentido coletivo de «toda a tua obra» com naturalidade e sem restringi-lo apenas à criação.
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: sobre a obra das tuas mãos
  rationale: Mantém a imagem hebraica concreta das mãos de Deus e o singular coletivo «obra».
- source_word: אֲשׂוֹחֵחַ
  choice: reflito
  rationale: שׂיח pode envolver meditar, ponderar ou falar. No paralelismo com הגה, o contexto favorece a reflexão interior; «reflito» também evita repetir «medito».
