id: PSA.143.1
reference: Psalms 143:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: pt
  text: 'Salmo de Davi.[a]


    Ó Yahweh, ouve a minha oração;

    dá ouvidos às minhas súplicas.[b]

    Em tua fidelidade,[c] responde-me;

    em tua justiça.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Davi” ou “por Davi”. A expressão hebraica pode indicar autoria, associação ou dedicação.
    reason: ambiguity
  - marker: b
    text: Ou “aos meus pedidos de misericórdia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “por tua fidelidade”; a expressão também pode apresentar a fidelidade de Deus como fundamento do pedido.
    reason: ambiguity
  - marker: d
    text: Ou “por tua justiça” ou “em tua retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo consagrado e preciso para o gênero indicado no cabeçalho.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Preserva melhor a possível relação de autoria, associação ou dedicação expressa pela preposição hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: שְׁמַע תְּפִלָּתִי
  choice: ouve a minha oração
  rationale: Reproduz diretamente o imperativo e o substantivo singular, com linguagem natural de oração.
- source_word: הַאֲזִינָה אֶל־תַּחֲנוּנַי
  choice: dá ouvidos às minhas súplicas
  rationale: Mantém o paralelismo poético e comunica pedidos insistentes por favor ou misericórdia.
- source_word: בֶּאֱמֻנָתְךָ
  choice: Em tua fidelidade
  rationale: אֱמוּנָה designa aqui a confiabilidade ou fidelidade de Deus; a formulação conserva a preposição sem decidir se indica esfera, norma ou fundamento.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: Equivalente direto e natural do pedido feito em contexto de oração, sem explicitar uma resposta favorável que permanece implícita.
- source_word: בְּצִדְקָתֶךָ
  choice: em tua justiça
  rationale: צְדָקָה pode abranger justiça, retidão e conformidade com o que é certo; 'justiça' é natural em português e preserva a tensão do apelo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Javé
  rationale: O texto contém o nome divino, não um título. 'Yahweh' o preserva por transliteração; 'Javé' é a forma aportuguesada possível.
- issue: Base do apelo à resposta divina
  choice: Em tua fidelidade ... em tua justiça
  alternative: Por tua fidelidade ... por tua justiça
  rationale: A preposição ב pode indicar a esfera ou norma segundo a qual Deus responde, bem como o fundamento do apelo. O texto principal conserva a construção hebraica, e as notas registram a leitura causal ou instrumental.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com paralelismo poético preservado. Emprega-se “tu” por coerência com a segunda pessoa singular do hebraico e por seu uso tradicional, ainda inteligível, na linguagem de oração.
