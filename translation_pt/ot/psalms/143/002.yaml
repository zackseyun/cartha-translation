source:
  edition: WLC
  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: pt
  text: E não entres em juízo com o teu servo, pois ninguém que vive é justo diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois ninguém que vive será declarado justo diante de ti”.'
    reason: Alternativa lexical que explicita o sentido forense possível de יִצְדַּק.
lexical_decisions:
- source_word: וְ/אַל
  choice: E não
  rationale: Mantém a ligação desta súplica com o versículo anterior sem introduzir um contraste que o hebraico não exige.
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט
  choice: entres em juízo
  rationale: Reproduz de modo natural em português a expressão jurídica hebraica, que descreve o ato de levar a causa a julgamento.
- source_word: אֶת עַבְדֶּ֑/ךָ
  choice: com o teu servo
  rationale: Embora אֵת normalmente marque o objeto direto, a locução portuguesa “entrar em juízo” pede “com”. “Servo” conserva o tom de oração e a relação de submissão expressa por עֶבֶד.
- source_word: כִּ֤י
  choice: pois
  rationale: Introduz de forma concisa a razão da súplica.
- source_word: לֹֽא יִצְדַּ֖ק
  choice: é justo
  rationale: Expressa a afirmação geral do salmista, preservando também, pelo contexto de juízo, a possível nuance forense. A alternativa forense é registrada em nota.
- source_word: לְ/פָנֶ֣י/ךָ
  choice: diante de ti
  rationale: É a forma portuguesa idiomática para avaliação na presença de Deus.
- source_word: כָל חָֽי
  choice: ninguém que vive
  rationale: Sob a negação, a expressão hebraica tem sentido universal negativo. Esta formulação é natural, abrangente e claramente pessoal em português.
theological_decisions:
- issue: Nuance moral ou forense de יִצְדַּק no contexto do juízo divino
  choice: “ninguém que vive é justo diante de ti”
  alternative: “ninguém que vive será declarado justo diante de ti”
  rationale: O texto une linguagem de tribunal a uma confissão ampla sobre a condição humana perante Deus. O texto principal preserva a afirmação geral, enquanto a nota mantém explícita a leitura forense sem impor ao versículo uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa singular foi mantida por ser natural no registro bíblico e por representar diretamente os sufixos hebraicos dirigidos a Deus.
