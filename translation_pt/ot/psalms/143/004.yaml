  language: pt
  text: E o meu espírito desfalece dentro de mim[a]; o meu coração fica estarrecido dentro de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O meu espírito fica sobrecarregado dentro de mim; o meu coração fica desolado dentro de mim.”'
    reason: Alternativa lexical para וַתִּתְעַטֵּף e יִשְׁתּוֹמֵם, que podem indicar estar sobrecarregado e ficar desolado.
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: desfalece
  rationale: No contexto de lamento, o hitpael de עטף expressa fraqueza interior, desfalecimento ou a sensação de estar dominado pela aflição. “Desfalece” é natural, conciso e mantém a imagem sem explicá-la em excesso.
- source_word: עָלַי
  choice: dentro de mim
  rationale: A preposição significa literalmente “sobre mim”, mas, ligada ao estado do espírito do salmista, “dentro de mim” comunica de modo idiomático a experiência interior e se harmoniza com בְּתוֹכִי no segundo membro.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: Aqui רוּחַ designa a vida interior do salmista, e não apenas sua respiração nem o Espírito Santo. “O meu espírito” preserva a linguagem antropológica e o paralelismo com “o meu coração”.
- source_word: בְּתוֹכִי
  choice: dentro de mim
  rationale: A expressão indica interioridade. A repetição de “dentro de mim” conserva o paralelismo enfático do hebraico.
- source_word: יִשְׁתּוֹמֵם
  choice: fica estarrecido
  rationale: O verbo שמם pode descrever desolação, espanto ou um estado de choque. “Fica estarrecido” expressa a perplexidade devastadora do salmista sem reduzir o termo apenas à tristeza.
- source_word: לִבִּי
  choice: o meu coração
  rationale: לֵב designa o centro interior do pensamento e das emoções. “O meu coração” é a equivalência poética tradicional e clara em português.
