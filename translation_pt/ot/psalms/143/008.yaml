base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: pt
  text: Faz-me ouvir, pela manhã, o teu amor fiel[a], pois em ti confio. Faz-me conhecer o caminho que devo seguir[b], pois a ti elevo a minha alma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Permite que eu ouça, pela manhã, o teu amor fiel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Faz-me conhecer o caminho pelo qual irei”; literalmente, “o caminho que irei”.'
    reason: lexical_alternative
  - marker: c
    text: “Elevar a alma” é uma expressão hebraica que comunica confiar-se a Deus ou dirigir a ele todo o ser interior.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Faz-me ouvir
  rationale: O imperativo hifil de שׁמע com sufixo de primeira pessoa significa literalmente “faz-me ouvir”. A formulação preserva a força causativa e o tom de súplica, sem explicar antecipadamente como o amor de Deus será “ouvido”.
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: A expressão temporal indica mais naturalmente o momento da súplica. “Pela manhã” é corrente em português e não acrescenta a ideia de repetição diária.
- source_word: חַסְדֶּךָ
  choice: o teu amor fiel
  rationale: חסד reúne as ideias de amor, lealdade e constância. “Amor fiel” comunica de modo claro a afeição e a fidelidade divinas, sem restringir o termo apenas a “misericórdia” nem explicitar além do texto uma terminologia técnica de aliança.
- source_word: כִּי
  choice: pois
  rationale: Nas duas ocorrências, כִּי introduz a razão da súplica. “Pois” mantém a ligação causal e combina com o registro poético da oração.
- source_word: בְךָ בָטָחְתִּי
  choice: em ti confio
  rationale: O perfeito hebraico pode apresentar uma confiança já firmada e ainda vigente. O presente português expressa naturalmente essa disposição contínua.
- source_word: הוֹדִיעֵנִי
  choice: Faz-me conhecer
  rationale: O hifil de ידע significa “fazer saber/conhecer”. “Faz-me conhecer” permanece próximo da forma causativa e é natural no contexto de um pedido de orientação.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: o caminho que devo seguir
  rationale: A formulação hebraica é literalmente “o caminho que/por onde irei”. No contexto, trata-se de orientação solicitada; “que devo seguir” comunica essa nuance sem limitar “caminho” a uma estrada física.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: A preposição indica direção para Deus. “A ti” é uma construção natural e digna na oração portuguesa.
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: elevo a minha alma
  rationale: A expressão hebraica é mantida como metáfora de entrega, desejo e orientação do ser interior para Deus. O presente se ajusta à oração em andamento.
theological_decisions:
- issue: Sentido de חסד na súplica dirigida a Deus
  choice: o teu amor fiel
  alternative: a tua misericórdia; o teu amor leal; o teu amor de aliança
  rationale: “Amor fiel” preserva tanto o amor quanto a constância e lealdade divinas. Evita reduzir o termo à compaixão e também evita impor uma formulação teológica mais técnica do que o próprio verso exige.
- issue: Metáfora נָשָׂאתִי נַפְשִׁי
  choice: a ti elevo a minha alma
  alternative: a ti me entrego; para ti dirijo todo o meu ser
  rationale: A tradução conserva a imagem hebraica e sua amplitude devocional, sem decidir se ela significa exclusivamente confiança, desejo, oração ou entrega.
- issue: Nuance modal em דֶּרֶךְ זוּ אֵלֵךְ
  choice: o caminho que devo seguir
  alternative: o caminho por onde irei
  rationale: O contexto de pedido por direção favorece a nuance de orientação expressa por “devo”, mas a nota registra a forma mais literal para não ocultar a abertura gramatical do hebraico.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por “tu” foi mantido no registro bíblico-poético, com formas verbais naturais. A tradução conserva as metáforas centrais, empregando equivalência ótima para tornar explícita apenas a nuance contextual necessária em “o caminho que devo seguir”.
