  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: pt
  text: Salmo de Davi. Ó SENHOR, ouve a minha oração; dá ouvidos às minhas súplicas! Responde-me em tua fidelidade, em tua justiça.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por tua fidelidade”. O hebraico também pode apresentar a fidelidade de Deus como fundamento ou meio de sua resposta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em tua retidão” ou “por tua justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Salmo de Davi
  rationale: Reproduz naturalmente o título hebraico, preservando a relação ampla expressa por לְ, tradicionalmente entendida como autoria ou associação.
- source_word: תַּחֲנוּנַי
  choice: minhas súplicas
  rationale: O plural designa pedidos insistentes de favor ou misericórdia; “súplicas” é claro, digno e não acrescenta um objeto ausente no hebraico.
- source_word: בֶּאֱמוּנָתְךָ
  choice: em tua fidelidade
  rationale: Mantém a preposição e o sentido de firmeza e confiabilidade divinas, sem decidir se a expressão indica esfera, fundamento ou meio.
- source_word: בְּצִדְקָתֶךָ
  choice: em tua justiça
  rationale: Preserva o campo semântico de צְדָקָה e a construção paralela com בֶּאֱמוּנָתְךָ; no contexto, pode incluir retidão e ação justa.
theological_decisions:
- issue: Base do apelo por resposta divina
  choice: “em tua fidelidade, em tua justiça”
  alternative: “por tua fidelidade, por tua justiça”
  rationale: A formulação retém a ambiguidade da preposição hebraica בְּ, sem definir exclusivamente essas qualidades como meio ou fundamento da resposta.
- issue: Sentido de צְדָקָה aplicado a Deus
  choice: “justiça”
  alternative: “retidão”
  rationale: “Justiça” é corrente e suficientemente ampla para a ação de Deus em conformidade com seu caráter; a nota registra a alternativa sem impor uma leitura doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “SENHOR” representa o nome divino יהוה segundo a convenção editorial bíblica; “dá ouvidos” preserva o paralelismo poético sem soar arcaico em excesso.
