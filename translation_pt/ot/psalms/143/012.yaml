base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: pt
  text: E, em teu amor leal, darás fim a meus inimigos[a] e destruirás todos os que afligem a minha alma[b], pois eu sou teu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por teu amor leal”; a preposição hebraica pode indicar o meio, além da esfera ou do fundamento da ação.'
    reason: lexical_alternative
  - marker: b
    text: “Minha alma” também pode significar “minha vida” ou simplesmente “eu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: E, em teu amor leal
  rationale: חֶסֶד expressa amor fiel, lealdade e misericórdia, muitas vezes em contexto de aliança. “Amor leal” conserva tanto o aspecto relacional quanto a constância. A preposição בְּ é vertida por “em”, mantendo a ideia de esfera ou fundamento, embora também possa ser instrumental.
- source_word: תַּצְמִית
  choice: eliminarás
  rationale: O hifil de צמת indica fazer cessar, eliminar ou exterminar. “Eliminarás” preserva a força do verbo e evita repeti-lo como “destruirás”, usado na oração paralela.
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: Equivalência direta e natural do substantivo plural com sufixo de primeira pessoa.
- source_word: וְהַאֲבַדְתָּ
  choice: e destruirás
  rationale: O hifil de אבד significa causar a perdição ou destruição. “Destruirás” mantém a intensidade do hebraico e a variação verbal do paralelismo.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: todos os adversários da minha alma
  rationale: צֹרֲרֵי designa os que hostilizam ou oprimem. A construção nominal “adversários da minha alma” acompanha de perto o hebraico e preserva נֶפֶשׁ de modo poético, sem excluir os sentidos de vida ou pessoa.
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: pois eu sou teu servo
  rationale: כִּי apresenta o fundamento da súplica. “Servo” expressa submissão, pertença e serviço a Deus no registro dos salmos, sem introduzir desnecessariamente a instituição social da escravidão.
theological_decisions:
- issue: Linguagem imprecatória contra os inimigos
  choice: Manter os verbos fortes “eliminarás” e “destruirás”.
  alternative: Suavizar como “derrotarás”, “calarás” ou “afastarás”.
  rationale: Os verbos hebraicos exprimem juízo severo. A tradução conserva a tensão da oração por julgamento divino, sem atenuá-la nem ampliá-la.
- issue: Valor modal das formas verbais
  choice: 'Traduzir como futuro: “eliminarás” e “destruirás”.'
  alternative: 'Entender como súplica volitiva: “elimina” e “destrói”.'
  rationale: As formas hebraicas, no contexto de oração, podem ter força de pedido, mas a sequência também admite expressão confiante do que Deus fará. O futuro preserva a forma da camada de consulta e soa naturalmente como confiança em português, sem negar o caráter de súplica do salmo.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. Emprega-se “teu” em coerência com o singular íntimo da oração. A formulação mantém o paralelismo hebraico, distingue os dois verbos fortes e conserva a amplitude semântica de נֶפֶשׁ.
