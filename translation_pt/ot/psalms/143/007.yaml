source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: pt
  text: Responde-me depressa, ó Yahweh; meu espírito desfalece. Não escondas de mim o teu rosto, para que eu não me torne como os que descem à cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura”. Em hebraico, “a cova” é uma imagem poética da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: depressa
  rationale: O imperativo tem valor adverbial e comunica a urgência do pedido. “Depressa” é corrente e natural em português.
- source_word: עֲנֵנִי
  choice: Responde-me
  rationale: Neste contexto de oração, ענה significa responder à súplica; a forma escolhida é direta e preserva o tom pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּלְתָה רוּחִי
  choice: meu espírito desfalece
  rationale: כלה expressa esgotamento ou perda de forças. “Desfalece” comunica de modo conciso o colapso interior do salmista.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Não escondas de mim o teu rosto
  rationale: Preserva a imagem hebraica da retirada da presença ou do favor divino, ainda compreensível em português.
- source_word: וְנִמְשַׁלְתִּי
  choice: para que eu não me torne como
  rationale: O nifal de משל expressa ser ou tornar-se semelhante. Neste pedido negativo, a construção final negativa transmite naturalmente a consequência temida sem eliminar a nuance preventiva.
- source_word: יֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: Mantém o particípio e a imagem poética do בור como lugar associado à morte, sem explicitar Seol nem impor uma doutrina do estado intermediário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não apenas um título. “Yahweh” preserva essa distinção por transliteração.
- issue: Sentido de בור
  choice: cova
  alternative: sepultura; Seol
  rationale: “Cova” conserva a metáfora hebraica da descida à morte e evita especificar além do que o verso afirma.
- issue: Relação expressa por וְנִמְשַׁלְתִּי após a proibição
  choice: para que eu não me torne como
  alternative: senão me tornarei como; e serei semelhante a
  rationale: A tradução apresenta o resultado temido como finalidade preventiva, adequada ao contexto, embora a coordenação hebraica também possa ser entendida como consequência direta.
translation_notes:
  register: Português moderno, digno e acessível, com formas pronominais tradicionais de oração (“tu”, implícito; “teu”; “escondas”) para refletir o singular hebraico. A ordem e as imagens principais do original foram preservadas, com ajustes mínimos para fluidez.
