translation:
  language: pt
  text: Estendo as minhas mãos para ti; minha alma, como terra exausta, anseia por ti[a]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha alma é como terra ressequida diante de ti”. O adjetivo hebraico significa literalmente “exausta” ou “desfalecida”; “ressequida” explicita a provável imagem de uma terra sedenta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Estendo
  rationale: O qal de פרשׂ descreve o gesto concreto de abrir ou estender as mãos em oração. O presente poético soa natural em português e dá vivacidade à súplica.
- source_word: יָדַי
  choice: as minhas mãos
  rationale: A forma com sufixo de primeira pessoa refere-se às duas mãos; o plural preserva o gesto de súplica.
- source_word: אֵלֶיךָ
  choice: para ti
  rationale: A preposição אֶל indica direção ao destinatário; “para ti” é natural e mantém essa orientação.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode designar vida, pessoa ou ser interior. Neste contexto de anseio dirigido a Deus, “alma” preserva adequadamente a força poética e afetiva.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: como terra exausta
  rationale: עֲיֵפָה significa literalmente cansada, exausta ou desfalecida. A expressão conserva a personificação hebraica sem substituir diretamente o adjetivo por “seca”.
- source_word: לְךָ
  choice: por ti
  rationale: O לְךָ é poeticamente elíptico. “Por ti” comunica que a alma-terra anseia por Deus, sem tornar explícitos sede ou ressecamento que estão apenas sugeridos pela imagem.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo litúrgico é incerto, ele é transliterado segundo o uso bíblico consolidado em português.
