base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: pt
  text: Pois um inimigo perseguiu a minha alma[a]; esmagou a minha vida contra o chão; fez-me habitar em lugares escuros, como os mortos de outrora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perseguiu-me”. Em hebraico, “a minha alma” é uma forma poética comum de se referir à própria pessoa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como os que morreram há muito tempo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da súplica no contexto e preserva de modo natural a força causal.
- source_word: רָדַף
  choice: persegue
  rationale: O perfeito hebraico descreve a perseguição sofrida como realidade efetiva; o presente dá fluidez ao lamento em português sem enfraquecer sua força.
- source_word: אוֹיֵב
  choice: um inimigo
  rationale: O substantivo singular não tem artigo no hebraico; a forma indefinida reproduz esse dado sem impedir um sentido genérico no contexto.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva o idioma poético hebraico e a distinção lexical em relação a חַיָּתִי, traduzido depois como 'a minha vida'.
- source_word: דִּכָּא
  choice: esmagou
  rationale: Expressa vividamente a ideia de quebrar ou reduzir por esmagamento.
- source_word: לָאָרֶץ
  choice: contra o chão
  rationale: Forma idiomática em português que conserva a imagem de alguém violentamente lançado e abatido.
- source_word: חַיָּתִי
  choice: a minha vida
  rationale: No contexto, designa a existência viva ou vitalidade do salmista; 'vida' é claro e natural.
- source_word: הוֹשִׁיבַנִי
  choice: fez-me habitar
  rationale: Conserva o valor causativo do hifil e a ideia de ser confinado a uma condição ou lugar.
- source_word: בְמַחֲשַׁכִּים
  choice: em lugares escuros
  rationale: Mantém a forma plural do hebraico, que sugere regiões ou lugares de trevas.
- source_word: כְּמֵתֵי עוֹלָם
  choice: como os que morreram há muito tempo
  rationale: Entende עוֹלָם aqui em seu valor temporal remoto, evocando os mortos de tempos antigos, sem sugerir necessariamente uma afirmação sobre morte eterna.
