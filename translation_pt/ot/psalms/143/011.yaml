  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: pt
  text: Por causa do teu nome, ó Yahweh, preserva minha vida[a]; por tua justiça[b], tira-me da angústia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz-me viver”, “reanima-me” ou “mantém-me vivo”. O verbo hebraico pode indicar dar vida, preservar a vida ou restaurar as forças.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “em tua justiça” ou “por tua retidão”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “tira minha alma da angústia”. Aqui, “minha alma” pode significar “a mim” ou “minha vida”; “angústia” também pode ser traduzida como “aflição” ou “tribulação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: Por causa do teu nome
  rationale: Expressa o motivo do apelo e conserva o idioma bíblico do “nome” como reputação, honra e caráter revelado de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: תְּחַיֵּנִי
  choice: preserva minha vida
  rationale: No contexto de súplica por livramento, comunica a preservação da vida sem excluir totalmente as possíveis nuances de reanimar ou restaurar, registradas em nota.
- source_word: בְּצִדְקָתְךָ
  choice: por tua justiça
  rationale: Entende בְּ em sentido instrumental e emprega “justiça” para a retidão fiel de Deus que fundamenta o livramento; “em tua justiça” continua possível.
- source_word: תוֹצִיא מִצָּרָה
  choice: tira-me da angústia
  rationale: Reproduz de modo natural a imagem causativa de fazer sair de uma situação de aflição.
- source_word: נַפְשִׁי
  choice: me
  rationale: Neste contexto, נֶפֶשׁ designa a própria pessoa ou vida. “Me” evita que “minha alma” seja entendido apenas como a parte imaterial do ser humano, enquanto a forma hebraica é preservada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico apresenta o nome pessoal diretamente. A transliteração preserva essa distinção, sem trocar o nome por um título.
- issue: Nuance de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é natural em português e abrange aqui a retidão e fidelidade moral de Deus, sem reduzir o termo à justiça judicial.
- issue: Sentido de נַפְשִׁי
  choice: me
  alternative: minha alma; minha vida
  rationale: O termo funciona de maneira idiomática para a pessoa inteira ou sua vida; a tradução não impõe uma leitura antropológica dualista.
translation_notes:
  register: Português atual, reverente e acessível, com construção direta. Conserva o nome divino e o idioma do “nome”, mas verte נַפְשִׁי de modo idiomático para evitar uma interpretação indevidamente restrita de “alma”.
