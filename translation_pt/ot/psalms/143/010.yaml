  text: לַמְּדֵ֤/נִי לַֽ/עֲשׂ֣וֹת רְצוֹנֶ/ךָ֮ כִּֽי אַתָּ֪ה אֱל֫וֹהָ֥/י רוּחֲ/ךָ֥ טוֹבָ֑ה תַּ֝נְחֵ֗/נִי בְּ/אֶ֣רֶץ מִישֽׁוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: pt
  text: Ensina-me a fazer a tua vontade, pois tu és o meu Deus. Que o teu bom Espírito[a] me guie em terreno plano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu bom espírito”. O hebraico não distingue maiúsculas de minúsculas; por isso, a expressão pode referir-se ao Espírito de Deus ou, de modo mais geral, ao seu espírito ou disposição bondosa.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Ensina-me
  rationale: O piel imperativo de למד com sufixo de primeira pessoa singular significa ensinar ou instruir alguém. “Ensina-me” é direto, natural e apropriado ao contexto de oração.
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: a fazer a tua vontade
  rationale: O infinitivo de עשה indica o que o salmista deseja aprender, e רצון designa aqui aquilo que Deus quer. A formulação preserva o sentido verbal simples e corrente.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: pois tu és o meu Deus
  rationale: כִּי apresenta a razão do pedido. “Pois” mantém com naturalidade a relação causal e o tom de oração.
- source_word: רוּחֲךָ טוֹבָה
  choice: o teu bom Espírito
  rationale: A expressão significa literalmente “teu espírito bom”. A maiúscula representa a leitura provável de que se trata do próprio Espírito de Deus, enquanto a nota conserva a alternativa permitida pela escrita hebraica.
- source_word: תַּנְחֵנִי
  choice: me guie
  rationale: O hifil de נחה significa conduzir ou guiar. A construção “Que ... me guie” comunica naturalmente o valor de súplica do hebraico.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: em terreno plano
  rationale: מִישׁוֹר pode indicar um lugar nivelado, plano, e também admite associações figuradas com retidão. “Em terreno plano” preserva a imagem espacial sem excluir sua força metafórica.
theological_decisions:
- issue: Se רוּחֲךָ deve ser entendido como “Espírito” ou “espírito”
  choice: o teu bom Espírito
  alternative: o teu bom espírito
  rationale: Como o salmista se dirige a Deus e fala de “teu espírito”, a referência ao próprio Espírito de Deus é uma leitura natural. Contudo, o hebraico não marca distinção por maiúsculas, de modo que a nota preserva a leitura mais geral como espírito ou disposição de Deus.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o discurso direto a Deus. “Em terreno plano” mantém a metáfora concreta e evita interpretar מִישׁוֹר exclusivamente como retidão moral.
