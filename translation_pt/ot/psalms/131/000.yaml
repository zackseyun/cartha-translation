  text: A Song of Ascents[b][a]. Of David.
translation:
  language: pt
  text: 'Cântico das Subidas.[a] De Davi.[b]


    SENHOR, meu coração não é orgulhoso,

    nem meus olhos são arrogantes;

    não andei em coisas grandiosas,

    nem em coisas extraordinárias demais para mim.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Cântico das Subidas”. Pode referir-se às subidas dos peregrinos a Jerusalém ou ao emprego desses cânticos em algum contexto de subida.
    reason: lexical_alternative
  - marker: b
    text: Ou “Por Davi” ou “Para Davi”; a inscrição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: c
    text: Ou “em coisas extraordinárias que estão além de mim”. A expressão hebraica se refere a assuntos que excedem a posição, a compreensão ou a capacidade de quem fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: A expressão designa a coleção dos cânticos ligados às subidas, provavelmente à subida dos peregrinos a Jerusalém. “Peregrinação” comunica naturalmente essa função, enquanto a nota preserva o sentido literal.
- source_word: גָבַהּ לִבִּי
  choice: meu coração não é orgulhoso
  rationale: A imagem hebraica do coração elevado expressa orgulho; a formulação portuguesa é clara e preserva o foco interior.
- source_word: רָמוּ עֵינַי
  choice: meus olhos são arrogantes
  rationale: Olhos elevados são uma imagem hebraica de altivez. “Arrogantes” mantém o paralelismo com o orgulho do coração sem exigir uma expressão pouco natural.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: não me envolvo em grandes questões
  rationale: O verbo “andar” é idiomático e, neste contexto, indica ocupar-se ou conduzir-se em determinada esfera. “Grandes questões” conserva a amplitude do substantivo.
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: coisas maravilhosas demais para mim
  rationale: נפלאות pode indicar coisas extraordinárias, admiráveis ou além da compreensão/capacidade. A tradução preserva a linguagem de maravilha e explicita o limite indicado por מִמֶּנִּי.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH
  rationale: A forma em versaletes segue a convenção portuguesa amplamente reconhecida para o nome divino, sem identificá-lo com um nome denominacionalmente preferido.
- issue: Sentido das “grandes questões” e das “coisas maravilhosas”
  choice: Manter categorias amplas, relacionadas ao que excede a posição ou capacidade do salmista
  alternative: Especificá-las como mistérios teológicos ou ambições políticas
  rationale: O hebraico não define o campo dessas coisas; especificá-lo resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Não me envolvo” verte idiomaticamente o hebraico “não ando”, e “questões” evita sugerir que grandeza em si seja condenada. As notas registram as ambiguidades reais do título e da expressão final.
