    issue: Tempo/aspecto de הִלַּכְתִּי
    rationale: “Não me envolvo” está no presente, enquanto o hebraico usa perfeito na declaração retrospectiva do salmista. “Não me envolvi” conserva melhor esse aspecto sem tornar o português artificial.
  - severity: low
    issue: Explicitação de “com arrogância”
    rationale: A altivez é de fato o sentido idiomático de “olhos elevados”, mas a expressão acrescenta uma abstração interpretativa. “Meus olhos não se erguem” preserva a imagem hebraica e deixa o sentido poético implícito.
