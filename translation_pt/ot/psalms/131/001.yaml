base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: pt
  text: 'Cântico das Subidas. De Davi.[a]


    Yahweh, meu coração não é orgulhoso,

    nem meus olhos se erguem;

    não me envolvi com grandezas

    nem com coisas maravilhosas demais para mim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por Davi” ou “Para Davi”; o cabeçalho hebraico pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: b
    text: 'Também pode ser traduzido: “que estão além de mim”. A expressão hebraica indica assuntos que excedem a capacidade ou o âmbito apropriado de quem fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Preserva o sentido lexical de subidas/ascensões e funciona naturalmente como título reconhecível da coleção de salmos.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Mantém, tanto quanto possível em português, a ambiguidade da preposição hebraica, que pode indicar autoria, associação ou dedicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: גָבַהּ לִבִּי
  choice: meu coração não é orgulhoso
  rationale: Comunica de modo natural o sentido idiomático do coração elevado, isto é, soberbo.
- source_word: רָמוּ עֵינַי
  choice: meus olhos se levantam com arrogância
  rationale: Conserva a imagem dos olhos erguidos e explicita seu sentido idiomático de altivez.
- source_word: הִלַּכְתִּי
  choice: não me envolvo
  rationale: Neste contexto, o verbo descreve ocupar-se ou conduzir-se em determinado âmbito; a formulação é corrente em português e evita sugerir mero deslocamento físico.
- source_word: בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: com coisas grandes e maravilhosas demais para mim
  rationale: 'Reproduz o paralelismo e entende מִמֶּנִּי como medida comparativa: assuntos que excedem a capacidade ou o lugar adequado do salmista.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de o substituir por um título.
- issue: Sentido da atribuição לְדָוִד
  choice: De Davi
  alternative: Por Davi / Para Davi
  rationale: A construção hebraica pode indicar autoria, associação ou dedicação; a tradução não deve decidir além do que o texto permite.
- issue: Natureza das “coisas grandes e maravilhosas”
  choice: Assuntos grandes e maravilhosos demais para o salmista
  alternative: Feitos grandiosos realizados pelo salmista
  rationale: O texto pode referir-se amplamente a matérias, empreendimentos ou realidades acima de sua medida. A redação mantém essa amplitude sem impor uma aplicação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo poético foi mantido em linhas breves; evitou-se linguagem excessivamente arcaica.
