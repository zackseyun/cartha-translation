base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: pt
  text: Israel[a], espere em Yahweh, desde agora e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Israel espere em Yahweh”.'
    reason: Leitura alternativa da forma verbal exortativa hebraica.
lexical_decisions:
- source_word: יַחֵל
  choice: espere
  rationale: O imperfeito/jussivo de יחל tem aqui força exortativa. “Espere” comunica tanto expectativa quanto confiança e soa natural em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio do povo da aliança e permite entendê-lo como vocativo na exortação.
- source_word: אֶל
  choice: em
  rationale: Embora a preposição indique literalmente direção (“para”), com יחל a expressão idiomática em português é “esperar em”, tendo alguém como objeto de esperança e confiança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Expressão temporal corrente que preserva o ponto inicial indicado pelo hebraico.
- source_word: וְעַד עוֹלָם
  choice: e para sempre
  rationale: Reproduz de modo claro e natural a duração indefinida e culminante da expressão hebraica.
theological_decisions:
- issue: Forma exortativa do verbo inicial
  choice: 'Vocativo com imperativo: “Israel, espere em Yahweh”'
  alternative: 'Jussivo explícito: “Que Israel espere em Yahweh”'
  rationale: A forma hebraica admite uma exortação em terceira pessoa ou uma convocação direta ao povo. O vocativo é natural em português e preserva a força exortativa sem resolver uma questão doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A vírgula marca Israel como vocativo; a nota preserva a alternativa jussiva genuína.
