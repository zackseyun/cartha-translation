base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: pt
  text: De fato, acalmei e aquietei a minha alma[a]; como uma criança desmamada junto à mãe[b], como uma criança desmamada está a minha alma dentro de mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se não nivelei e aquietei a minha alma”. A abertura hebraica é uma expressão idiomática enfática, aqui traduzida por “De fato”.'
    reason: lexical_alternative
  - marker: b
    text: A imagem é a de uma criança que, já desmamada, não se agita para mamar, mas repousa tranquilamente junto à mãe.
    reason: cultural_note
  - marker: c
    text: 'Literalmente, a difícil construção hebraica pode ser traduzida: “como uma criança desmamada sobre mim está a minha alma”. “Dentro de mim” expressa em português o sentido provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: De fato
  rationale: A expressão funciona aqui como afirmação enfática, não como condição literal. “De fato” comunica a ênfase com naturalidade em português.
- source_word: שִׁוִּיתִי
  choice: acalmei
  rationale: Neste contexto, o verbo descreve levar o próprio íntimo a um estado sereno e equilibrado; “acalmei” harmoniza-se com o paralelismo seguinte.
- source_word: וְדוֹמַמְתִּי
  choice: e aquietei
  rationale: Preserva o sentido ativo de fazer ficar quieto ou imóvel e forma uma combinação natural com “acalmei”.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Refere-se ao ser interior do salmista. “Alma” conserva a linguagem poética e bíblica sem exigir uma concepção técnica de dualismo entre corpo e alma.
- source_word: כְּגָמֻל
  choice: como uma criança desmamada
  rationale: O particípio passivo designa alguém já desmamado; “criança desmamada” expressa de modo claro a imagem hebraica.
- source_word: עֲלֵי אִמּוֹ
  choice: junto à mãe
  rationale: A preposição retrata proximidade íntima e repouso. “Junto à mãe” é natural em português e evita tornar “sobre a mãe” excessivamente literal.
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: assim está a minha alma dentro de mim
  rationale: A cláusula retoma e aplica a comparação ao íntimo do salmista. “Dentro de mim” comunica o sentido provável em português natural, enquanto a nota preserva a formulação hebraica difícil.
theological_decisions:
- issue: Nuance antropológica de נַפְשִׁי
  choice: a minha alma
  alternative: o meu ser / o meu íntimo
  rationale: O verso fala da vida interior e da disposição do salmista. “Alma” preserva a ressonância poética e teológica, sem importar necessariamente um dualismo técnico.
- issue: Sentido da imagem da criança desmamada
  choice: Repouso sereno e confiante junto à mãe
  alternative: Privação ou afastamento da mãe
  rationale: O paralelismo com “acalmei e aquietei” indica uma criança que já não se agita para mamar, mas descansa em proximidade segura; a tradução não transforma a metáfora em uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. O paralelismo foi preservado, e as dificuldades da expressão enfática inicial e da frase final foram registradas em notas.
