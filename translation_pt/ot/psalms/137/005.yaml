base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: pt
  text: Se eu me esquecer de você, Jerusalém, que a minha mão direita se esqueça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “que a minha mão direita se esqueça de sua habilidade”. O hebraico é elíptico, e esse sentido mais completo é inferido do contexto e refletido em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma declaração condicional com força de juramento; “Se” é a correspondência mais direta e natural em português.
- source_word: אֶשְׁכָּחֵךְ
  choice: eu me esquecer de você
  rationale: O qal imperfeito na primeira pessoa do singular, com sufixo feminino singular, dirige-se diretamente a Jerusalém. Em português corrente, “esquecer-se de você” expressa naturalmente essa relação.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Mantém o nome próprio tradicional em português e sua função de vocativo.
- source_word: תִּשְׁכַּח
  choice: que ... se esqueça
  rationale: O imperfeito feminino singular tem aqui valor volitivo ou imprecatório numa automaldição. A construção “que ... se esqueça” comunica essa força em português digno e natural.
- source_word: יְמִינִי
  choice: a minha mão direita
  rationale: יָמִין designa normalmente a mão direita; no contexto, ela pode ser entendida como instrumento da habilidade musical, sem que essa ideia seja explicitada no texto hebraico.
theological_decisions:
- issue: Automaldição elíptica no segundo cólon
  choice: que a minha mão direita se esqueça
  alternative: que a minha mão direita se esqueça de sua habilidade; que a minha mão direita seja esquecida
  rationale: O texto massorético diz literalmente que a mão direita “se esqueça”, sem declarar o objeto. A tradução principal preserva essa concisão e ambiguidade, enquanto a nota apresenta a explicitação contextual comum sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para reproduzir com clareza o tratamento direto a Jerusalém e mantém a formulação elíptica da automaldição.
