  text: תִּדְבַּ֥ק לְשׁוֹנִ֨/י לְ/חִכִּ/י֮ אִם לֹ֪א אֶ֫זְכְּרֵ֥/כִי אִם לֹ֣א אַ֭עֲלֶה אֶת יְרוּשָׁלִַ֑ם עַ֝֗ל רֹ֣אשׁ שִׂמְחָתִֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: pt
  text: Que a minha língua se cole ao céu da boca, se eu não me lembrar de ti, se eu não elevar Jerusalém acima da minha maior alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se eu não elevar Jerusalém sobre a cabeça da minha alegria”. A expressão indica dar a Jerusalém precedência acima de toda alegria.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: Que ... se cole
  rationale: O verbo דבק significa aderir, colar-se ou apegar-se. Neste juramento de automaldição, a construção optativa com “Que” transmite naturalmente a consequência invocada pelo salmista.
- source_word: לְשׁוֹנִי
  choice: a minha língua
  rationale: Mantém a referência anatômica concreta, essencial à imagem da perda da capacidade de falar ou cantar.
- source_word: לְחִכִּי
  choice: ao céu da boca
  rationale: חֵךְ designa o palato. “Céu da boca” é a expressão corrente e clara em português, preservando a imagem corporal.
- source_word: אִם לֹא
  choice: se eu não
  rationale: Conserva a estrutura condicional do juramento hebraico em ambas as ocorrências.
- source_word: אֶזְכְּרֵכִי
  choice: me lembrar de ti
  rationale: זכר significa lembrar. O sufixo feminino singular aponta naturalmente para Jerusalém, tratada em discurso direto; “ti” preserva essa personificação poética.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: elevar Jerusalém
  rationale: O hifil de עלה significa literalmente fazer subir e, neste contexto, colocar em posição superior. “Elevar” mantém tanto a imagem vertical quanto a ideia de primazia.
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: acima da minha maior alegria
  rationale: Literalmente, “sobre a cabeça da minha alegria”. A formulação comunica que Jerusalém deve ocupar lugar superior até mesmo à maior alegria do salmista, sem reproduzir um idiomatismo obscuro em português.
theological_decisions:
- issue: Referente do sufixo feminino singular em אֶזְכְּרֵכִי
  choice: Jerusalém, personificada e diretamente interpelada
  alternative: Sião ou a cidade entendida de maneira mais ampla na linguagem poética
  rationale: Jerusalém é o referente contextual natural e concorda com o gênero feminino do sufixo. A tradução mantém o discurso direto sem acrescentar uma interpretação doutrinária.
- issue: Relação de Jerusalém com שִׂמְחָתִי
  choice: Jerusalém é colocada acima da maior alegria pessoal
  alternative: Jerusalém é tratada como a principal alegria
  rationale: A sintaxe e a imagem de עַל רֹאשׁ permitem nuances próximas. A redação escolhida preserva explicitamente a comparação “acima de”, enquanto a nota registra a forma literal e a alternativa possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “ti” para preservar o discurso poético direto dirigido a Jerusalém. A ordem das duas condições segue o hebraico, e a nota conserva a imagem literal e a ambiguidade idiomática do último segmento.
