  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: pt
  text: Como poderíamos cantar a canção de Yahweh em terra estrangeira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a canção de YHWH”; tradicionalmente, “a canção do SENHOR”. A expressão final também pode ser traduzida por “em país estrangeiro”; literalmente, “sobre solo estrangeiro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ נָשִׁיר
  choice: Como poderíamos cantar
  rationale: A combinação do interrogativo com o imperfeito expressa aqui uma pergunta retórica marcada por impossibilidade ou impropriedade sentida. O condicional em português comunica naturalmente essa força de lamento sem transformar a frase numa simples pergunta sobre método.
- source_word: שִׁיר יְהוָה
  choice: a canção de Yahweh
  rationale: A construção liga a canção diretamente ao nome divino. “Canção” é corrente e digna em português, e “de Yahweh” preserva a relação genitiva sem especificar além do hebraico se é uma canção dirigida a ele ou pertencente ao seu culto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: עַל אַדְמַת נֵכָר
  choice: em terra estrangeira
  rationale: Embora עַל possa ser literalmente “sobre”, com “terra” o português idiomático pede “em”. A expressão conserva o sentido concreto e geográfico de estar no território de outro povo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino. Mantê-lo como “Yahweh” torna visível ao leitor essa característica do texto, enquanto a forma tradicional é indicada em nota.
- issue: Relação expressa por שִׁיר יְהוָה
  choice: a canção de Yahweh
  alternative: uma canção ao Senhor
  rationale: A construção hebraica não explicita se a canção é dirigida a Yahweh, composta a respeito dele ou própria de seu culto. A tradução conserva essa abertura sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Como poderíamos” preserva a força retórica e lamentosa; “terra estrangeira” é mais natural em português do que o literal “solo estrangeiro”, registrado na nota.
