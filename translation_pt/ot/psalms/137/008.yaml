  text: בַּת בָּבֶ֗ל הַ/שְּׁד֫וּדָ֥ה אַשְׁרֵ֥י שֶׁ/יְשַׁלֶּם לָ֑/ךְ אֶת גְּ֝מוּלֵ֗/ךְ שֶׁ/גָּמַ֥לְתְּ לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: pt
  text: Ó filha da Babilônia, devastada[a], feliz aquele que lhe retribuir o que você fez conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saqueada” ou “destinada à destruição”. O termo hebraico pode descrever a devastação sofrida ou apresentar como certa a ruína ainda por vir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: Ó filha da Babilônia
  rationale: A expressão construta personifica a cidade e seu povo. Em português, “filha da Babilônia” preserva o hebraísmo de modo mais natural; o vocativo “Ó” explicita a interpelação indicada pela segunda pessoa no restante do verso.
- source_word: הַשְּׁדוּדָה
  choice: devastada
  rationale: O particípio passivo de שׁדד pode descrever alguém devastado, destruído ou saqueado. “Devastada” mantém a formulação concisa e não decide se a ruína já ocorreu ou é vista como iminente.
- source_word: אַשְׁרֵי
  choice: feliz aquele
  rationale: Fórmula hebraica de bem-aventurança que declara a condição favorecida de alguém. “Feliz aquele” é corrente, digna e evita tornar explícito um agente que o hebraico não nomeia.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: que lhe retribuir
  rationale: O verbo שׁלם neste contexto expressa retribuição ou pagamento correspondente. “Retribuir” conserva o caráter judicial e recíproco da afirmação.
- source_word: אֶת גְּמוּלֵךְ
  choice: o que você fez
  rationale: גְּמוּל designa ação praticada, tratamento ou retribuição. Em conjunto com o verbo, esta formulação evita a expressão pouco natural “retribuir a retribuição”, sem perder a reciprocidade.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  choice: você fez conosco
  rationale: גמל pode significar tratar ou agir para com alguém. “Fez conosco” comunica naturalmente o dano sofrido e mantém a referência à conduta da Babilônia.
theological_decisions:
- issue: Bem-aventurança imprecatória sobre quem retribuir à Babilônia
  choice: Manter a declaração “feliz aquele” e a retribuição correspondente
  alternative: Transformá-la em mera previsão futura ou suavizar sua força retributiva
  rationale: O hebraico enuncia uma genuína bem-aventurança sobre quem retribui à Babilônia o tratamento dado ao povo. A tradução preserva o choque moral e a tensão entre lamento, justiça e vingança, sem os resolver por paráfrase.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira e alcance internacional. O pronome “você” torna inequívoca a personificação feminina da Babilônia; “lhe” evita repetição pesada. A cadência conserva a interpelação, a bem-aventurança e a reciprocidade do hebraico.
