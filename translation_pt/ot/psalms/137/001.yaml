base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: pt
  text: Junto aos rios da Babilônia[a], ali nos sentamos; também choramos ao nos lembrarmos de Sião.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Junto aos cursos d’água da Babilônia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ali nos sentamos e choramos ao nos lembrarmos de Sião”. O hebraico também contém, antes de “choramos”, uma partícula aditiva ou enfática, que pode ser traduzida por “também”, “até” ou “de fato”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Junto a
  rationale: Com uma expressão geográfica, indica localização ao lado ou nas proximidades; “junto aos” é natural em português e adequado à cena.
- source_word: נַהֲרוֹת
  choice: rios
  rationale: O plural de נָהָר normalmente designa rios; a alternativa “canais” pode refletir a paisagem hídrica da Babilônia, mas é mais interpretativa.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: שָׁם
  choice: ali
  rationale: Preserva a ênfase dêitica no lugar do exílio e soa natural após “junto aos rios da Babilônia”.
- source_word: יָשַׁבְנוּ
  choice: nos sentamos
  rationale: O verbo pode significar sentar-se ou habitar; neste contexto de choro junto aos rios, descreve naturalmente a ação de se sentar.
- source_word: גַּם
  choice: também
  rationale: Mantém a força aditiva da partícula hebraica sem definir além do necessário sua relação sintática exata.
- source_word: בָּכִינוּ
  choice: choramos
  rationale: Equivalente corrente e digno para o ato de verter lágrimas; evita o tom arcaizante de “pranteamos”.
- source_word: בְּזָכְרֵנוּ
  choice: ao nos lembrarmos
  rationale: A preposição com o infinitivo construto admite valor temporal e possivelmente circunstancial; a construção portuguesa preserva essa relação sem impor causalidade explícita.
- source_word: אֶת צִיּוֹן
  choice: Sião
  rationale: O marcador de objeto direto não é traduzido; mantém-se o nome específico e sua ressonância poético-teológica.
theological_decisions:
- issue: Tradução de צִיּוֹן
  choice: Sião
  alternative: Jerusalém
  rationale: O texto nomeia especificamente Sião. Preservar o topônimo mantém sua dimensão geográfica, poética e teológica, em vez de reduzi-lo a uma identificação explicativa.
- issue: Relação de גַּם com as ações de sentar e chorar
  choice: “também choramos”, preservando a força aditiva
  alternative: “sentamo-nos e choramos”
  rationale: A partícula pode ser entendida como aditiva ou enfática. O texto principal a representa explicitamente, enquanto a nota registra uma disposição alternativa natural sem eliminar a tensão sintática.
translation_notes:
  register: Português contemporâneo, digno e poético, com ampla legibilidade brasileira. “Junto aos” e “nos sentamos” são naturais sem perder a estrutura da cena hebraica. O ponto e vírgula conserva a pausa e torna explícita a partícula גַּם. Todos os marcadores de nota aparecem no texto principal.
