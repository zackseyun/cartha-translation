  text: On the poplars in its midst we hung our lyres[a][b].
translation:
  language: pt
  text: Nos álamos que havia no meio dela, penduramos nossas liras[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «salgueiros». O termo hebraico para essas árvores pode indicar salgueiros ou árvores do tipo álamo; «salgueiros» é a tradução tradicional.
    reason: lexical_alternative
  - marker: b
    text: Ou «nossas harpas». O hebraico kinnor designa um antigo instrumento de cordas, provavelmente uma lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: nos
  rationale: A preposição עַל indica que os instrumentos foram pendurados nas árvores; em português, a contração «nos» expressa essa relação espacial de modo natural.
- source_word: עֲרָבִים
  choice: álamos
  rationale: O termo hebraico pode designar árvores do tipo salgueiro ou álamo. «Álamos» reflete uma identificação botânica plausível no ambiente mesopotâmico, enquanto a tradução tradicional «salgueiros» é preservada em nota.
- source_word: בְּתוֹכָהּ
  choice: que havia no meio dela
  rationale: O sufixo feminino singular retoma naturalmente a Babilônia mencionada no versículo anterior. A formulação mantém o referente pronominal e torna clara, em português corrente, a relação das árvores com o lugar.
- source_word: תָּלִינוּ
  choice: penduramos
  rationale: O qal perfeito na primeira pessoa do plural significa diretamente «penduramos» e comunica com naturalidade o gesto de deixar os instrumentos de lado durante o luto.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: nossas liras
  rationale: כִּנּוֹר designa um antigo instrumento de cordas, provavelmente uma lira. «Harpas», tradução tradicional, permanece como alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. A ordem foi ajustada para evitar a leitura pouco natural de que algo estivesse pendurado «sobre» as copas, sem eliminar a referência pronominal à Babilônia.
