  text: כִּ֤י שָׁ֨ם שְֽׁאֵל֪וּ/נוּ שׁוֹבֵ֡י/נוּ דִּבְרֵי שִׁ֭יר וְ/תוֹלָלֵ֣י/נוּ שִׂמְחָ֑ה שִׁ֥ירוּ לָ֝֗/נוּ מִ/שִּׁ֥יר צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: pt
  text: 'Pois ali os nossos captores nos pediam palavras de canção, e os nossos atormentadores[a], alegria: “Cantem para nós uma das canções de Sião!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que zombavam de nós”. O termo hebraico é raro e pode enfatizar tanto a opressão abusiva quanto a zombaria hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal do contexto anterior e preserva com naturalidade o fluxo do discurso.
- source_word: שָׁם
  choice: ali
  rationale: Retoma o lugar do exílio mencionado no contexto; “ali” é natural em português.
- source_word: שְׁאֵלוּנוּ
  choice: nos pediam
  rationale: Expressa uma solicitação dirigida aos exilados; o imperfeito português comunica adequadamente a cena rememorada e seu caráter durativo.
- source_word: שׁוֹבֵינוּ
  choice: os nossos captores
  rationale: Designa aqueles que os levaram cativos, de forma concisa e precisa.
- source_word: דִּבְרֵי שִׁיר
  choice: palavras de canção
  rationale: Conserva a expressão hebraica, que focaliza palavras cantadas, e não apenas música em sentido abstrato.
- source_word: וְתוֹלָלֵינוּ
  choice: e os nossos atormentadores
  rationale: O termo raro pode indicar opressores abusivos ou pessoas que zombavam dos cativos; “atormentadores” se ajusta ao lamento sem eliminar a alternativa lexical, registrada em nota.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Mantém a ideia de entretenimento alegre exigido pelos captores e é claro no português atual.
- source_word: שִׁירוּ לָנוּ
  choice: Cantem para nós
  rationale: Traduz o imperativo plural e o sentido de uma apresentação feita em benefício dos ouvintes.
- source_word: מִשִּׁיר צִיּוֹן
  choice: uma das canções de Sião
  rationale: 'Explicita o valor partitivo da preposição hebraica: uma canção escolhida dentre as associadas a Sião.'
theological_decisions: []
