base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: pt
  text: 'Lembra-te, ó Yahweh, contra os filhos de Edom, do dia de Jerusalém[a], quando diziam: “Arrasem-na! Arrasem-na[b] até os alicerces!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o dia em que Jerusalém caiu”. Literalmente, “o dia de Jerusalém”, expressão que se refere à calamidade da cidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Descubram-na! Descubram-na!” O verbo hebraico sugere despojar ou expor completamente; no contexto, pode referir-se a arrasar a cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo masculino singular dirigido a Yahweh. A forma pronominal é natural e digna em português; a força adversativa é expressa por “contra”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִבְנֵי אֱדוֹם
  choice: contra os filhos de Edom
  rationale: “Contra” comunica o sentido adversativo ou judicial da preposição neste contexto; “filhos de Edom” preserva a expressão étnico-familiar hebraica.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: do dia de Jerusalém
  rationale: Mantém a formulação hebraica concisa e sua ambiguidade, sem inserir no texto principal que Jerusalém caiu ou foi destruída.
- source_word: הָאֹמְרִים
  choice: quando diziam
  rationale: Reproduz de modo natural em português a fala reiterada dos edomitas naquele momento, embora expresse temporalmente o particípio hebraico.
- source_word: עָרוּ עָרוּ
  choice: Arrasem-na! Arrasem-na
  rationale: No contexto da destruição de uma cidade até os alicerces, “arrasar” comunica com clareza a ordem hostil e total, preservando sua repetição enfática; a nota registra a imagem lexical alternativa de desnudar ou expor.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: até os alicerces
  rationale: Expressão portuguesa idiomática para destruição completa até o nível da fundação. O plural natural em português corresponde ao singular coletivo ou estrutural hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido da petição “lembra-te” em relação a Edom
  choice: “contra os filhos de Edom”
  alternative: “dos filhos de Edom” ou “em favor dos filhos de Edom”
  rationale: O contexto imprecatório e judicial favorece a leitura adversativa, sem explicitar no texto qual pena Deus deveria aplicar.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção “Lembra-te, ó Yahweh” conserva o tom de oração; “Arrasem-na!” torna natural e vigoroso o grito citado. Todas as ambiguidades relevantes são mantidas no texto ou documentadas nas notas.
