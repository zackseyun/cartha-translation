  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: pt
  text: Feliz é aquele que agarrar e despedaçar os teus pequeninos contra a rocha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os teus bebês”. O termo hebraico se refere a crianças muito pequenas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz aquele
  rationale: A forma hebraica introduz uma exclamação de bem-aventurança ou condição invejável. Em português corrente, “Feliz aquele” conserva a fórmula solene dos salmos sem atenuar a tensão do contexto.
- source_word: שֶׁיֹּאחֵז
  choice: que agarrar
  rationale: O verbo expressa tomar ou segurar com firmeza. “Agarrar” é natural e mantém a força física da ação.
- source_word: וְנִפֵּץ
  choice: e esmagar
  rationale: O verbo descreve despedaçar mediante impacto violento. “Esmagar ... contra” reproduz de modo claro e direto a brutalidade da imagem hebraica.
- source_word: עֹלָלַיִךְ
  choice: os teus pequeninos
  rationale: O substantivo se refere a crianças muito pequenas. “Pequeninos” preserva tanto a idade tenra quanto o forte efeito emocional; “bebês” é uma alternativa possível e mais específica.
- source_word: אֶל הַסָּלַע
  choice: contra a rocha
  rationale: Com o verbo de impacto, a preposição é naturalmente vertida por “contra”; “rocha” é a correspondência ampla e usual de סֶלַע.
theological_decisions:
- issue: Força ética e teológica de אַשְׁרֵי em contexto imprecatório
  choice: Traduzir diretamente por “Feliz aquele”, sem suavizar a declaração nem acrescentar uma explicação moral ao versículo.
  alternative: “Bem-aventurado aquele” ou uma paráfrase que atenue a violência.
  rationale: O hebraico formula uma declaração explícita de felicidade ou bem-aventurança no clamor por retribuição contra a Babilônia. A tradução deve conservar essa tensão retórica e teológica, sem transformar o verso em aprovação abstrata da crueldade nem resolver no texto aquilo que o original deixa ao leitor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão poética e a violência explícita do hebraico, sem eufemismo. O pronome “teus” conserva a referência direta à Babilônia no contexto do salmo.
