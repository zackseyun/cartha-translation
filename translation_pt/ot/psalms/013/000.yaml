  yaml_path: translation/ot/psalms/013/000.yaml
  text: For the choir director. A psalm of David[a].
translation:
  language: pt
  text: Para o regente. Salmo de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; nos títulos dos salmos, o hebraico pode indicar autoria ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Para o regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente quem dirigia ou supervisionava a execução musical. “Regente” é natural, conciso e não restringe a função especificamente a um coro.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e adequado em português para esse gênero de composição poético-musical.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção portuguesa preserva melhor a amplitude da preposição hebraica, que pode indicar autoria, associação, pertencimento ou dedicação.
theological_decisions:
- issue: Sentido de לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O hebraico não determina inequivocamente autoria. “De Davi” mantém a ambiguidade relacional do título sem excluir autoria nem impô-la.
translation_notes:
  register: Português moderno, claro e digno, com formulação breve própria de um título litúrgico. “Regente” é mais abrangente que “regente do coro” e evita acrescentar ao hebraico uma referência explícita a coro.
