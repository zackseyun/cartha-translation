  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
translation:
  language: pt
  text: 'para que o meu inimigo não diga: “Eu o venci”, e os meus adversários não se alegrem porque eu vacile.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porque eu for abalado” ou “porque eu tropeçar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que... não
  rationale: Introduz aquilo que o salmista pede a Deus que impeça; essa construção expressa com naturalidade em português a finalidade ou o resultado negativo.
- source_word: יֹאמַר
  choice: diga
  rationale: Equivalente direto e natural de אמר no contexto de discurso citado.
- source_word: אֹיְבִי
  choice: o meu inimigo
  rationale: Preserva o substantivo singular com sufixo de primeira pessoa.
- source_word: יְכָלְתִּיו
  choice: Eu o venci
  rationale: O verbo יכל com objeto pronominal indica que o inimigo afirma ter prevalecido sobre o salmista. “Venci” é claro, conciso e não implica necessariamente destruição total.
- source_word: צָרַי
  choice: os meus adversários
  rationale: Preserva o plural e distingue este termo do singular “inimigo” da oração anterior.
- source_word: יָגִילוּ
  choice: se alegrem
  rationale: Comunica a alegria exultante dos adversários diante da instabilidade do salmista em linguagem corrente e digna.
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, a conjunção pode marcar a circunstância que suscita a alegria dos adversários. “Quando” preserva a possibilidade temporal sem excluir a relação causal.
- source_word: אֶמּוֹט
  choice: eu vacilar
  rationale: O nifal de מוט descreve perda de firmeza, oscilação ou abalo. “Vacilar” é natural em português e mantém aberta a dimensão física, emocional ou existencial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira e alcance internacional. A repetição de “não” torna explícito que פֶּן rege tanto a fala do inimigo quanto a alegria dos adversários. A alternativa da nota preserva a amplitude semântica de מוט e de כִּי.
