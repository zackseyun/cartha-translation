  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: pt
  text: Até quando, Yahweh, te esquecerás de mim? Para sempre? Até quando esconderás de mim o teu rosto[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua presença”. Literalmente, “teu rosto”. Em hebraico, esconder o rosto pode significar retirar a presença ou o favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Até quando
  rationale: Expressão interrogativa de duração, repetida no lamento. “Até quando” é natural em português e preserva a insistência poética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תִּשְׁכָּחֵנִי
  choice: te esquecerás de mim
  rationale: O qal imperfeito de שׁכח com objeto de primeira pessoa comunica a queixa contínua e voltada para o futuro; a forma pronominal é idiomática em português.
- source_word: נֶצַח
  choice: Para sempre?
  rationale: Mantém o sentido temporal e a força emocional do lamento. A pergunta breve separada reproduz com clareza a tensão do hebraico sem sugerir que o esquecimento divino seja afirmado como fato definitivo.
- source_word: תַּסְתִּיר
  choice: esconderás
  rationale: O hifil imperfeito de סתר tem como objeto “teu rosto”; “esconder” preserva diretamente a imagem hebraica.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: Conserva a expressão concreta do hebraico e sua força poética; os sentidos associados de presença e favor são indicados em nota.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Expressa separação e é a construção portuguesa natural com “esconder o rosto”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o nome divino. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da expressão “teu rosto”
  choice: Manter “o teu rosto” no texto principal
  alternative: tua presença
  rationale: A imagem hebraica pode denotar a presença ou o favor divino, mas conservar a expressão concreta evita resolver no texto principal toda a amplitude da metáfora.
- issue: Relação de נֶצַח com a pergunta precedente
  choice: Traduzir como a pergunta enfática separada “Para sempre?”
  alternative: Até quando te esquecerás de mim para sempre?
  rationale: A formulação separada é idiomática em português, preserva o impacto retórico e mantém a tensão entre “até quando” e “para sempre”, sem suavizar a queixa do salmista.
translation_notes:
  register: Português moderno, claro e digno, com cadência de lamento. A repetição de “Até quando” e a pergunta curta “Para sempre?” preservam a intensidade poética do hebraico.
