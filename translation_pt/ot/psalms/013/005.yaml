  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: pt
  text: Quanto a mim, porém, confiei no teu amor leal; meu coração se alegrará na tua salvação[a]. Cantarei a Yahweh, porque ele me fez muito bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento”. O termo hebraico pode se referir ao resgate de uma aflição presente, bem como à salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim, porém
  rationale: A conjunção e o pronome enfático assinalam o contraste entre o lamento anterior e a confiança do salmista; a formulação preserva ambos com naturalidade em português.
- source_word: בְּחַסְדְּךָ
  choice: no teu amor leal
  rationale: חֶסֶד expressa amor bondoso, constante e fiel, muitas vezes no contexto da aliança. “Amor leal” comunica tanto o afeto quanto a fidelidade sem restringir o sentido a mera misericórdia.
- source_word: בָטַחְתִּי
  choice: confiei
  rationale: O perfeito hebraico apresenta a confiança como atitude já assumida e ainda relevante. O pretérito perfeito é natural em português e mantém esse valor no contexto.
- source_word: יָגֵל לִבִּי
  choice: meu coração se alegrará
  rationale: O imperfeito aponta naturalmente para a alegria esperada em resposta ao agir de Deus; “coração” preserva a imagem hebraica do íntimo da pessoa.
- source_word: בִּישׁוּעָתֶךָ
  choice: na tua salvação
  rationale: יְשׁוּעָה pode indicar livramento de uma aflição presente e também salvação em sentido amplo. “Salvação” mantém essa amplitude, e a nota registra a alternativa contextual.
- source_word: אָשִׁירָה
  choice: Cantarei
  rationale: A forma cohortativa exprime decisão ou propósito. “Cantarei” comunica essa resolução de maneira concisa e natural.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando no texto o nome pessoal da aliança.
- source_word: כִּי גָמַל עָלָי
  choice: porque ele me fez muito bem
  rationale: כִּי introduz a razão do cântico, e a expressão גמל על descreve o trato benéfico e generoso de Deus. A formulação portuguesa é atual, clara e evita a ideia excessivamente transacional de recompensa.
theological_decisions:
- issue: Forma de verter o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Amplitude de יְשׁוּעָה
  choice: salvação
  alternative: livramento
  rationale: O termo comporta tanto o resgate concreto da aflição presente quanto um sentido mais amplo de salvação. O texto principal conserva a amplitude teológica, enquanto a nota preserva a leitura contextual alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o tom direto da oração. A tradução mantém o contraste, a progressão do lamento para a confiança e a tensão lexical entre livramento imediato e salvação ampla.
