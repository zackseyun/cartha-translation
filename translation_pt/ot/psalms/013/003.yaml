base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: pt
  text: Olha e responde-me, ó Yahweh, meu Deus; ilumina os meus olhos[a], para que eu não durma na morte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por «faz brilhar os meus olhos» ou «dá luz aos meus olhos». A imagem hebraica pode indicar renovação da vitalidade, clareza ou esperança.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, algo como «para que eu não durma a morte»; tradicionalmente, «para que eu não durma o sono da morte».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Olha para mim
  rationale: O imperativo de נבט pede que Deus volte sua atenção para o salmista. A explicitação de «para mim» decorre naturalmente do paralelismo com «responde-me» e produz português corrente sem alterar o sentido.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: Em contexto de oração, ענה significa normalmente «responder». A forma mantém o apelo direto e pessoal sem acrescentar que a resposta necessariamente será favorável.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz diretamente a forma possessiva e conserva o caráter pessoal da invocação.
- source_word: הָאִירָה עֵינַי
  choice: ilumina os meus olhos
  rationale: O hifil de אור comunica a ideia de fazer brilhar ou dar luz. «Ilumina os meus olhos» preserva a imagem corporal hebraica e sua abertura a sentidos como vitalidade, clareza e esperança.
- source_word: פֶּן
  choice: para que eu não
  rationale: Introduz o resultado temido. Esta construção é mais natural no português moderno do que «para que não aconteça que», sem perder a relação preventiva.
- source_word: אִישַׁן הַמָּוֶת
  choice: eu não adormeça na morte
  rationale: A formulação conserva a metáfora da morte como sono e oferece uma construção portuguesa compreensível, sem inserir no texto principal o substantivo adicional de «o sono da morte».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração conserva o nome pessoal em vez de substituí-lo por um título tradicional.
- issue: Sentido da imagem הָאִירָה עֵינַי
  choice: Manter a imagem como «ilumina os meus olhos»
  alternative: «restaura as minhas forças» ou «devolve-me a esperança»
  rationale: A imagem pode envolver renovação da vida, clareza ou esperança, mas o texto não seleciona apenas uma dessas interpretações; por isso, sua amplitude é preservada.
- issue: Relação entre sono e morte
  choice: «adormeça na morte»
  alternative: «durma o sono da morte»
  rationale: A tradução mantém a associação metafórica sem decidir questões sobre o estado dos mortos nem transformar a metáfora em formulação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. «Responde-me» e «os meus olhos» mantêm uma forma natural em diferentes variedades do português; a metáfora poética e o vocativo solene foram preservados.
