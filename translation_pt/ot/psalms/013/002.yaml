  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: pt
  text: Até quando terei de fazer planos dentro de mim, com tristeza no coração o dia inteiro?[a] Até quando meu inimigo se elevará acima de mim?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até quando porei conselhos dentro de mim, com pesar no coração durante o dia?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Até quando meu inimigo triunfará sobre mim?” O hebraico diz mais literalmente “se elevará acima de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Até quando
  rationale: Expressão interrogativa natural em português para o lamento temporal, preservada nas duas ocorrências.
- source_word: אָשִׁית עֵצוֹת
  choice: terei de fazer planos
  rationale: O verbo significa literalmente “pôr/estabelecer”, e o substantivo plural pode indicar conselhos ou planos. A formulação comunica de modo natural a deliberação repetida e angustiosa, sem tornar explícito mais do que o hebraico.
- source_word: בְּנַפְשִׁי
  choice: dentro de mim
  rationale: נֶפֶשׁ designa aqui o íntimo ou a própria pessoa. “Dentro de mim” é claro e idiomático, evitando que “alma” seja entendido como uma definição técnica da constituição humana.
- source_word: יָגוֹן
  choice: tristeza
  rationale: Expressa pesar ou aflição; “tristeza” é corrente, digna e adequada ao paralelismo poético.
- source_word: בִּלְבָבִי
  choice: no coração
  rationale: Preserva a imagem hebraica do coração como centro da experiência interior.
- source_word: יוֹמָם
  choice: o dia inteiro
  rationale: O advérbio pode significar “de dia” ou, no contexto, a duração contínua do sofrimento durante o dia. A escolha apresenta esta última leitura no texto.
- source_word: יָרוּם
  choice: se elevará
  rationale: Mantém a metáfora vertical do verbo רום, em vez de substituí-la diretamente pela interpretação “triunfará”.
- source_word: אֹיְבִי
  choice: meu inimigo
  rationale: Equivalente direto e natural do substantivo singular com sufixo de primeira pessoa.
- source_word: עָלָי
  choice: acima de mim
  rationale: Com רום, conserva a imagem espacial de superioridade; “contra mim” enfraqueceria essa metáfora.
theological_decisions: []
