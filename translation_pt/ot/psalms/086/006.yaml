source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: pt
  text: Dá ouvidos, ó Yahweh, à minha oração; presta atenção à voz das minhas súplicas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos meus pedidos de misericórdia”.'
    reason: Esclarece que תַּחֲנוּנִים designa apelos insistentes por favor ou misericórdia.
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Dá ouvidos
  rationale: O imperativo de אזן pede que Deus escute atentamente. A expressão portuguesa preserva a imagem hebraica do ouvido e é natural em linguagem de oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: תְּפִלָּתִי
  choice: à minha oração
  rationale: Tradução direta de תְּפִלָּה com o sufixo de primeira pessoa do singular; a preposição atende à regência natural de 'dar ouvidos'.
- source_word: וְהַקְשִׁיבָה
  choice: presta atenção
  rationale: קשב expressa escuta atenta. Esta formulação distingue o segundo verbo do primeiro e preserva o paralelismo intensificador.
- source_word: בְּקוֹל
  choice: à voz
  rationale: Mantém o substantivo קוֹל, 'voz', sem reduzi-lo a uma simples preposição.
- source_word: תַּחֲנוּנוֹתָי
  choice: das minhas súplicas
  rationale: ‘Súplicas’ comunica pedidos insistentes por favor ou misericórdia e conserva o tom solene da oração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto dirige-se a Deus pelo nome pessoal do pacto; a transliteração preserva esse nome em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. ‘Dá ouvidos’ mantém a imagem hebraica; ‘presta atenção’ evita repetição plana e expressa a intensificação do segundo imperativo.
