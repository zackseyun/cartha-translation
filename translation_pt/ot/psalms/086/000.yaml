base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: pt
  text: 'Oração de Davi.


    Inclina para mim o teu ouvido, ó SENHOR, e responde-me, pois sou pobre e necessitado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aflito e necessitado”. O termo hebraico traduzido como “pobre” também pode descrever alguém aflito ou humilhado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Oração de Davi
  rationale: Traduz naturalmente o título hebraico, preservando a relação expressa por לְ, que neste contexto pode indicar autoria ou associação.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Inclina para mim o teu ouvido
  rationale: Mantém a imagem hebraica de inclinar o ouvido em sinal de atenção, com formulação clara e digna em português.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção bíblica portuguesa amplamente reconhecida para representar o nome divino YHWH.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: Equivalente direto e natural do imperativo hebraico com sufixo de primeira pessoa.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pobre e necessitado
  rationale: Reproduz a dupla descrição do salmista sem eliminar a amplitude semântica de עָנִי; a alternativa 'aflito' é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versaletes segue uma convenção consolidada nas Bíblias em português e indica que o hebraico traz o nome divino, sem introduzir uma interpretação denominacional.
- issue: Sentido de עָנִי
  choice: pobre
  alternative: aflito ou humilhado
  rationale: O paralelismo com אֶבְיוֹן favorece 'pobre', mas o termo também pode descrever aflição ou humilhação; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O título foi separado do corpo do versículo. A imagem concreta de inclinar o ouvido foi preservada, e o vocativo recebeu “ó” para fluência natural.
