  source_fidelity: O texto traduz com precisão a superscrição תְּפִלָּה לְדָוִד como “Oração de Davi” e preserva adequadamente a ambiguidade associativa de לְ. “Inclina o teu ouvido” reproduz a metáfora hebraica, “responde-me” corresponde a עֲנֵנִי, e “pois sou pobre e necessitado” mantém tanto a relação causal quanto o paralelismo de עָנִי וְאֶבְיוֹן. A nota registra de modo apropriado a amplitude semântica de עָנִי.
