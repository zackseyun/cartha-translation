  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: pt
  text: 'Oração de Davi.


    Inclina o teu ouvido, ó Yahweh, e responde-me,

    pois sou pobre[a] e necessitado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflito”. O termo hebraico עָנִי pode designar alguém pobre, aflito ou humilhado.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Oração
  rationale: O substantivo funciona como indicação do gênero do salmo; “Oração” é direto, natural e preserva sua forma concisa.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, pertença ou associação. “De Davi” conserva essa amplitude sem especificar além do hebraico.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Inclina o teu ouvido
  rationale: Mantém a metáfora corporal hebraica de voltar o ouvido para escutar com atenção, em linguagem digna e compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲנֵנִי
  choice: responde-me
  rationale: Em contexto de oração, ענה denota dar resposta; a formulação portuguesa é clara e idiomática.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão em que se fundamenta o pedido.
- source_word: עָנִי
  choice: pobre
  rationale: O termo pode indicar pobreza, aflição ou humilhação. “Pobre”, em paralelo com “necessitado”, preserva seu sentido concreto, enquanto a nota registra a alternativa contextual.
- source_word: וְאֶבְיוֹן
  choice: e necessitado
  rationale: Reproduz o paralelismo com עָנִי e comunica a condição de carência sem exagerar o sentido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por um título.
- issue: Sentido de עָנִי na autodescrição do salmista
  choice: pobre
  alternative: aflito; humilhado
  rationale: A combinação com “necessitado” favorece o sentido socioeconômico, mas o campo semântico também inclui aflição. A nota preserva essa ambiguidade sem impor uma leitura exclusivamente material ou espiritual.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A ordem vocativa foi ajustada para soar natural, mantendo a metáfora hebraica. Usaram-se “teu” e “responde-me” para conservar um tom de oração digno sem arcaísmo excessivo.
