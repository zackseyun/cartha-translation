  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a oração e o louvor anteriores, preservando de modo natural a ligação argumentativa do hebraico.
- source_word: גָדוֹל
  choice: grande
  rationale: Expressa diretamente a grandeza de Deus em condição e poder, com linguagem corrente e digna.
- source_word: וְעֹשֵׂה
  choice: e fazes
  rationale: O particípio descreve uma ação característica e contínua; o presente simples comunica isso naturalmente em português.
- source_word: נִפְלָאוֹת
  choice: maravilhas
  rationale: Designa feitos extraordinários que despertam admiração; “maravilhas” é conciso, natural e preserva o plural.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto de invocação direta e exclusividade, o termo se refere inequivocamente ao único Deus.
- source_word: לְבַדֶּךָ
  choice: só tu
  rationale: Preserva a ênfase exclusiva da forma hebraica com sufixo de segunda pessoa e produz uma declaração clara em português.
theological_decisions:
- issue: Afirmação monoteísta exclusiva na oração final
  choice: só tu és Deus
  alternative: tu és Deus, tu somente
  rationale: “Só tu és Deus” põe em primeiro plano a exclusividade expressa por לְבַדֶּךָ, sem acrescentar elaboração filosófica nem sugerir meramente que Deus age sem ajuda.
