  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: pt
  text: Alegra a alma do teu servo[a], pois a ti, Senhor, elevo a minha alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alegra a vida de teu servo” ou “alegra o próprio ser de teu servo”; o termo hebraico pode significar “alma”, “vida” ou a própria pessoa, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: Alegra
  rationale: O imperativo piel expressa o pedido direto para que Deus cause alegria; “alegra” preserva a força verbal e soa natural na oração.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: alma / minha alma
  rationale: Neste contexto, נֶפֶשׁ designa a pessoa interior diante de Deus. “Alma” preserva o peso devocional e a repetição poética, sem excluir os sentidos contextuais de vida ou ser.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: No discurso dirigido a Deus nos Salmos, o termo exprime submissão humilde e serviço; “servo” se ajusta ao contexto melhor que “escravo”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido e mantém clara a relação lógica em registro de oração.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: Preserva a direção expressa pela preposição hebraica e forma uma construção natural com “elevo”.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino de modo tradicional, claro e apropriado ao registro da oração.
- source_word: אֶשָּׂא
  choice: elevo
  rationale: Conserva a metáfora devocional de dirigir ou entregar a própria alma a Deus, sem a explicar em excesso.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ na linguagem de oração
  choice: Traduzir por “alma” nas duas ocorrências
  alternative: “vida”, “ser” ou “a mim mesmo”
  rationale: A repetição tem função poética e devocional. “Alma” mantém essa força sem impor ao termo uma antropologia técnica.
- issue: Sentido de עבד na relação do salmista com Deus
  choice: “teu servo”
  alternative: “teu escravo”
  rationale: Aqui o foco recai na devoção humilde e no serviço a Deus, não principalmente na condição social de escravidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“teu”, “ti”) e preservação da repetição poética de “alma”.
