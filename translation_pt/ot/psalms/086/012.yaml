  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: pt
  text: Eu te louvarei[a], Senhor, meu Deus, de todo o meu coração, e glorificarei o teu nome para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu te agradecerei”; o verbo hebraico pode ter o sentido tanto de agradecer como de louvar em contextos de adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Eu te louvarei
  rationale: O hifil de ידה pode expressar louvor ou agradecimento. Neste contexto de adoração, em paralelo com glorificar o nome de Deus, “louvarei” comunica melhor o sentido doxológico. O imperfeito é entendido como declaração de propósito, com valor futuro.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz diretamente o título divino e mantém uma forma reverente, corrente e natural em português.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Preserva o sufixo explícito da primeira pessoa do singular e, junto de “Senhor”, mantém integralmente a dupla invocação hebraica.
- source_word: בְּכָל לְבָבִי
  choice: de todo o coração
  rationale: Expressão portuguesa natural que conserva a imagem hebraica e comunica devoção inteira, sem reservas.
- source_word: וַאֲכַבְּדָה
  choice: e glorificarei
  rationale: O piel de כבד pode significar honrar ou glorificar. Com “o teu nome” como objeto e em contexto de culto, “glorificarei” é claro, elevado e adequado.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém a expressão literal e teologicamente rica, na qual o nome representa o caráter e a reputação revelados da pessoa.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a equivalência portuguesa contemporânea mais clara para duração contínua e sem fim neste compromisso de louvor.
theological_decisions:
- issue: Tradução da invocação divina אֲדֹנָי אֱלֹהַי
  choice: Senhor, meu Deus
  alternative: Ó Senhor, meu Deus
  rationale: Preserva os dois títulos e a relação pessoal expressa pelo sufixo, sem acrescentar a interjeição “ó”, que não é exigida pelo hebraico.
- issue: Amplitude semântica de אוֹדְךָ
  choice: Eu te louvarei
  alternative: Eu te agradecerei
  rationale: O contexto de culto e o paralelismo com glorificar o nome favorecem “louvar”, mas a nota conserva a alternativa legítima de agradecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal “te louvarei” é natural no registro bíblico contemporâneo, e “de todo o coração” preserva a força idiomática do hebraico.
