id: PSA.86.9
reference: Psalms 86:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: pt
  text: Todas as nações que fizeste virão e se prostrarão diante de ti[a], Senhor, e glorificarão o teu nome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e te adorarão”; o verbo hebraico pode indicar o ato de prostrar-se em reverência e, por extensão, adorar.
    reason: lexical_alternative
  - marker: b
    text: Ou “e honrarão o teu nome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Todas as nações
  rationale: Preserva o alcance coletivo e universal da expressão hebraica, sem introduzir a distinção mais específica sugerida por “gentios”.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: que fizeste
  rationale: Traduz diretamente o verbo עשה como “fazer”, deixando que o contexto comunique a ideia de criação sem torná-la mais explícita que o hebraico.
- source_word: יָבֹאוּ
  choice: virão
  rationale: O imperfeito expressa aqui a expectativa futura apresentada pelo salmista.
- source_word: וְיִשְׁתַּחֲווּ
  choice: e se prostrarão
  rationale: Conserva tanto o gesto físico de inclinar-se profundamente quanto sua dimensão de reverência e adoração.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Expressão portuguesa natural para a ideia hebraica de estar perante a face ou presença de alguém.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Tradução convencional e reverente do título divino אֲדֹנָי em português.
- source_word: וִיכַבְּדוּ
  choice: e glorificarão
  rationale: No piel, כבד pode significar honrar ou glorificar; “glorificarão” é natural com “teu nome” e adequado ao contexto de adoração, sem eliminar a alternativa lexical.
- source_word: לִשְׁמֶךָ
  choice: o teu nome
  rationale: Como objeto de “glorificar”, esta construção é idiomática em português e comunica a honra dada à identidade e reputação reveladas de Deus.
theological_decisions:
- issue: Alcance da resposta das nações
  choice: Uma futura homenagem universal ao Senhor por todas as nações que ele fez
  alternative: Linguagem hiperbólica de louvor referente a muitas nações, não necessariamente a todas sem exceção
  rationale: O texto afirma diretamente “todas as nações” e não oferece neste versículo uma limitação do alcance; a tradução conserva essa amplitude sem explicar como ou quando ela se cumpre.
- issue: Natureza do ato expresso por וְיִשְׁתַּחֲווּ
  choice: “se prostrarão”, preservando o gesto reverente e sua possível força cultual
  alternative: “adorarão”, explicitando apenas a extensão religiosa do verbo
  rationale: A formulação escolhida mantém a imagem concreta do hebraico e deixa a nota registrar que o gesto, neste contexto, também pode ser entendido como adoração.
- issue: Tradução de אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor; Soberano
  rationale: No uso dirigido a Deus, אֲדֹנָי funciona como título divino reverente; “Senhor” é sua tradução portuguesa clara e estabelecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com o tom poético (“fizeste”, “ti”, “teu”). A ordem segue de perto o hebraico sem soar artificial. Os marcadores [a] e [b] aparecem no texto principal.
