  yaml_path: translation/ot/psalms/086/007.yaml
  text: In the day of my distress I call to you, because you answer me.
translation:
  language: pt
  text: No dia da minha aflição, clamo a ti, porque tu me respondes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: No dia da minha aflição
  rationale: Reproduz a expressão temporal e traduz צָרָה por «aflição», termo natural e digno que abrange angústia, dificuldade e sofrimento.
- source_word: אֶקְרָאֶךָּ
  choice: clamo a ti
  rationale: O verbo קרא, neste contexto de oração, indica invocar ou pedir auxílio; «clamo a ti» preserva a intensidade e o destinatário expresso pelo sufixo.
- source_word: כִּי
  choice: porque
  rationale: 'Mantém o valor causal mais direto da conjunção: o salmista clama com base na certeza de que Deus responde.'
- source_word: תַעֲנֵנִי
  choice: tu me respondes
  rationale: O imperfeito hebraico pode expressar expectativa ou certeza contextual; o presente português comunica a confiança habitual e atual sem acrescentar modalidade.
theological_decisions:
- issue: Valor temporal ou modal de תַעֲנֵנִי
  choice: tu me respondes
  alternative: tu me responderás
  rationale: O presente preserva a formulação confiante adotada pelo texto de consulta e é compatível com o uso hebraico, sem converter explicitamente a afirmação em promessa futura.
- issue: Relação introduzida por כִּי
  choice: porque
  alternative: pois
  rationale: «Porque» torna explícita a relação causal presente no hebraico e conserva a confiança teológica do salmista na resposta divina.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural para leitores brasileiros e ampla compreensão internacional. A colocação «clamo a ti» evita um registro excessivamente coloquial e preserva o tom poético da oração.
