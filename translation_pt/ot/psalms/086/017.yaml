source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: pt
  text: Faz em meu favor um sinal de favor[a], para que os que me odeiam o vejam e fiquem envergonhados, pois tu, Yahweh, me ajudaste e me consolaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faz comigo um sinal para o bem”; literalmente, “faz comigo um sinal para o bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: Faz em meu favor
  rationale: Preserva o sentido básico de עשה, “fazer”, e exprime de modo natural a relação indicada por עִמִּי, literalmente “comigo”, aqui entendida como uma ação favorável ao salmista.
- source_word: אוֹת לְטוֹבָה
  choice: um sinal de bondade
  rationale: אוֹת é “sinal”; לְטוֹבָה pode indicar bem, benefício ou favor. “De bondade” comunica um sinal visível da ação benevolente de Deus sem especificar além do hebraico.
- source_word: וְיִרְאוּ
  choice: para que ... o vejam
  rationale: O imperfeito após o imperativo expressa finalidade ou resultado esperado. O pronome “o” retoma naturalmente “sinal”.
- source_word: שֹׂנְאַי
  choice: os que me odeiam
  rationale: Traduz diretamente a forma participial e preserva a hostilidade pessoal, em vez de ampliá-la para o termo mais geral “inimigos”.
- source_word: וְיֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: בוש pode indicar vergonha, fracasso ou desonra pública. A forma passiva conserva a ideia de serem levados à vergonha pelo que veem.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da vergonha dos adversários e soa natural no registro poético contemporâneo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עֲזַרְתַּנִי
  choice: me ajudaste
  rationale: O perfeito apresenta a ajuda divina como ação realizada; o pretérito perfeito é direto e natural em português.
- source_word: וְנִחַמְתָּנִי
  choice: me consolaste
  rationale: Neste contexto, נחם significa consolar ou confortar. “Consolaste” é digno, corrente e adequado ao paralelismo com “ajudaste”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto contém o nome próprio divino. “Yahweh” preserva essa função e evita substituí-lo silenciosamente por um título.
- issue: Natureza do sinal pedido
  choice: sinal de bondade
  alternative: sinal para o meu bem; sinal de favor
  rationale: A expressão לְטוֹבָה permite as ideias relacionadas de bem, benefício e favor. A tradução mantém a formulação aberta, sem definir que tipo de sinal ou intervenção se pede.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém o movimento poético do pedido ao resultado e, depois, à razão. “Yahweh” preserva o nome divino; “consolaste” evita tanto coloquialismo excessivo quanto arcaísmo.
