base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: pt
  text: Volta-te para mim e concede-me a tua graça; dá a tua força ao teu servo e salva o filho da tua serva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Volta-te para mim
  rationale: O imperativo de פנה pede que Deus dirija sua atenção ao salmista. A formulação é natural em português e preserva o sentido relacional e direcional.
- source_word: וְחָנֵּנִי
  choice: e concede-me a tua graça
  rationale: O verbo חנן expressa a concessão graciosa de favor. Esta tradução preserva esse núcleo sem reduzir a expressão apenas a piedade ou compaixão.
- source_word: תְּנָה עֻזְּךָ
  choice: dá a tua força
  rationale: Mantém a simplicidade do imperativo נתן e traduz עֹז diretamente como força, no contexto de um pedido de capacitação divina.
- source_word: לְעַבְדֶּךָ
  choice: ao teu servo
  rationale: Servo comunica a humilde submissão e pertença expressas por עבד, com linguagem corrente e apropriada à oração.
- source_word: וְהוֹשִׁיעָה
  choice: e salva
  rationale: Traduz diretamente o imperativo de ישׁע e conserva a amplitude da ideia de resgate e livramento.
- source_word: לְבֶן אֲמָתֶךָ
  choice: o filho da tua serva
  rationale: Reproduz de modo claro e natural a expressão hebraica, mantendo explícita a referência materna e a continuidade de pertença que ela sugere.
theological_decisions:
- issue: Autodesignação humilde por meio de עבד e אמה
  choice: servo / serva
  alternative: escravo / escrava; servo / criada
  rationale: A dupla mantém a relação lexical entre as duas designações e destaca a submissão e pertença a Deus sem introduzir um tom social mais específico do que o contexto exige. A referência à mãe não é nivelada nem omitida.
- issue: Nuance de חנן
  choice: concede-me a tua graça
  alternative: tem misericórdia de mim; mostra-me favor
  rationale: A escolha conserva a ideia de favor concedido gratuitamente, sem resolver o termo exclusivamente como compaixão diante do sofrimento.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o registro poético dos Salmos. A sintaxe acompanha o paralelismo hebraico sem soar rígida, e evita vocabulário arcaico como “serva de mão” ou “criada”.
