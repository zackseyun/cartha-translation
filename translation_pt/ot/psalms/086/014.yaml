  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: pt
  text: Deus, homens arrogantes se levantaram contra mim, e um bando de homens violentos procurou tirar-me a vida[a]; eles não te colocaram diante de si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «procuraram a minha vida», expressão hebraica que significa procurar matar alguém.
    reason: cultural_note
  - marker: b
    text: Isto é, eles não levam Deus em consideração.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O termo funciona aqui como vocativo singular dirigido ao Deus de Israel. Em português, a interpelação direta «Deus» é natural e não acrescenta uma interjeição ausente no hebraico.
- source_word: זֵדִים
  choice: homens arrogantes
  rationale: O substantivo adjetival designa pessoas orgulhosas, insolentes ou presunçosas. «Homens arrogantes» comunica com clareza tanto a referência pessoal masculina quanto a atitude hostil.
- source_word: קָמוּ עָלַי
  choice: se levantaram contra mim
  rationale: A expressão é um modo idiomático de descrever oposição hostil. O pretérito perfeito representa adequadamente a ação já ocorrida no contexto do lamento.
- source_word: וַעֲדַת
  choice: um bando de
  rationale: O substantivo indica um grupo reunido. «Bando» é natural em português e combina com o caráter hostil do grupo neste contexto.
- source_word: עָרִיצִים
  choice: homens violentos
  rationale: O termo descreve pessoas violentas, cruéis ou opressoras. «Homens violentos» preserva a ameaça concreta sem restringir o sentido a tiranos políticos.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: procura tirar-me a vida
  rationale: Literalmente, o grupo «buscou minha vida», expressão hebraica que neste contexto significa procurar matar. A formulação portuguesa mantém a imagem da vida como alvo e torna explícito o sentido idiomático.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: eles não te têm diante de si
  rationale: A expressão significa literalmente não colocar Deus diante deles e comunica que não o mantêm em vista nem o levam em consideração. A tradução preserva a metáfora de modo natural.
theological_decisions:
- issue: Explicitação do vocativo mediante «Ó Deus»
  choice: Deus
  alternative: Ó Deus
  rationale: O contexto deixa claro que se trata de uma invocação, mas o hebraico não contém uma partícula equivalente a «ó». A tradução mantém o tratamento direto sem acrescentá-la.
- issue: Explicitação da intenção letal na expressão «buscar minha vida»
  choice: procura tirar-me a vida
  alternative: buscou a minha vida
  rationale: A expressão hebraica é um idioma de intenção homicida. Em português atual, «buscar a minha vida» pode soar obscuro ou sugerir procura física; «tirar-me a vida» transmite o sentido contextual sem ir além dele.
- issue: Sentido de não colocar Deus diante deles
  choice: eles não te têm diante de si
  alternative: eles não te levam em consideração
  rationale: 'A opção escolhida conserva a metáfora hebraica e sua tensão: os agressores não mantêm Deus diante de si e, portanto, agem sem consideração por ele. A alternativa explicita a implicação.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a interpelação direta «Deus» e a metáfora «diante de si»; o idioma homicida é vertido de forma clara no texto principal. A concordância de «procura» segue o núcleo coletivo singular «bando».
