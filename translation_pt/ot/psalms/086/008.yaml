source:
  edition: WLC
  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: pt
  text: Não há ninguém como tu entre os deuses[a], Senhor, e não há obras como as tuas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os seres celestiais”. O hebraico diz “entre os deuses”, modo bíblico comum de declarar que o Senhor é incomparável e está acima de todo poder considerado divino.
    reason: alternative_reading
  - marker: b
    text: Ou “feitos” ou “atos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Não há ninguém
  rationale: A partícula existencial negativa expressa negação absoluta; esta formulação é direta e natural em português.
- source_word: כָּמוֹךָ
  choice: como tu
  rationale: A preposição comparativa com sufixo de segunda pessoa masculina singular indica semelhança ou comparabilidade.
- source_word: בָאֱלֹהִים
  choice: entre os deuses
  rationale: A preposição בְּ com o plural אֱלֹהִים forma aqui uma comparação dentro do grupo; a tradução preserva a expressão plural e a força poética do hebraico.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: O título divino está em vocativo; “Senhor” é a forma digna e tradicionalmente inteligível em contexto de oração.
- source_word: וְאֵין
  choice: e não há
  rationale: Preserva tanto a conjunção quanto a negação existencial que inicia o segundo membro paralelo.
- source_word: כְמַעֲשֶׂיךָ
  choice: obras como as tuas
  rationale: מַעֲשֶׂה abrange obra, feito ou ato; “obras” conserva o sentido amplo das ações divinas e reproduz a comparação.
theological_decisions:
- issue: Sentido de “entre os deuses”
  choice: Manter a expressão plural “entre os deuses” como declaração poética da incomparabilidade do Senhor diante de todo poder tido por divino.
  alternative: “entre os seres celestiais”; “não há deus como tu”; “entre governantes ou juízes”
  rationale: O hebraico emprega explicitamente אֱלֹהִים no plural dentro de uma construção comparativa. Preservar essa forma mantém a tensão e a força do texto sem impor uma afirmação metafísica além do que o versículo diz.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “tu” coerente com o sufixo hebraico de segunda pessoa singular. O paralelismo e a repetição de “não há” foram preservados.
