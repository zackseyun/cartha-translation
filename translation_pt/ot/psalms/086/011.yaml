id: PSA.86.11
reference: Psalms 86:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: pt
  text: Ensina-me o teu caminho, ó Yahweh, para que eu ande na tua verdade[a]; une o meu coração[b] para temer o teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na tua fidelidade”. A palavra hebraica pode expressar tanto “verdade” como “fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “faz que o meu coração seja indiviso”. O verbo hebraico significa “unir” ou “tornar um” e expressa a libertação de lealdades divididas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ensina-me
  rationale: O imperativo hifil de ירה com sufixo de primeira pessoa significa “ensina-me” ou “instrui-me”. “Ensina-me” é natural, direto e preserva o pedido de instrução divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: דֶּרֶךְ designa caminho e, por extensão, modo de viver ou conduta prescrita por Deus. O singular foi preservado.
- source_word: אֲהַלֵּךְ
  choice: para que eu ande
  rationale: O imperfeito após o imperativo expressa aqui propósito ou resultado. A formulação explicita naturalmente em português a relação com o pedido anterior.
- source_word: בַּאֲמִתֶּךָ
  choice: na tua verdade
  rationale: אֱמֶת pode significar verdade, fidelidade ou confiabilidade. “Na tua verdade” é uma tradução direta e mantém a amplitude do termo; “na tua fidelidade” consta em nota como possibilidade legítima.
- source_word: יַחֵד
  choice: une
  rationale: O imperativo piel de יחד significa unir ou tornar um. “Une” conserva a imagem hebraica de um coração integrado, sem lealdades divididas.
- source_word: לְבָבִי
  choice: o meu coração
  rationale: לֵבָב se refere ao ser interior, incluindo vontade e afetos. “Coração” preserva a metáfora bíblica e é corrente em português.
- source_word: לְיִרְאָה
  choice: para temer
  rationale: O infinitivo com לְ expressa propósito. “Temer” conserva o peso do hebraico ירא, que neste contexto inclui temor reverente, sem reduzi-lo apenas a “reverenciar”.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: A expressão hebraica associa o nome à pessoa, reputação e presença de Deus. A formulação literal preserva sua importância teológica e cultual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, em vez de substituí-lo por um título ou adotar uma forma híbrida tradicional.
- issue: Sentido de ירא em relação ao nome de Deus
  choice: temer o teu nome
  alternative: reverenciar o teu nome
  rationale: O verbo abrange temor, reverência e assombro. “Temer” mantém a tensão e o peso teológico do termo, sem suavização interpretativa.
- issue: Unidade do coração
  choice: une o meu coração
  alternative: faz que o meu coração seja indiviso
  rationale: A tradução principal preserva a metáfora e a forma verbal do hebraico; a alternativa explicita que o pedido é por liberdade de lealdades divididas.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “tu” de modo coerente na linguagem de oração. A ordem poética e o paralelismo do hebraico foram preservados sem sacrificar a naturalidade. Os marcadores foram ligados aos termos a que efetivamente se referem: [a] a “verdade” e [b] à unidade do coração.'
