id: PSA.86.5
reference: Psalms 86:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: pt
  text: Pois tu, Senhor, és bom e perdoador[a], rico em amor leal para com todos os que te invocam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disposto a perdoar”.'
    reason: Alternativa lexical para סַלָּח, que pode destacar a disposição ou prontidão de Deus para perdoar.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a súplica anterior e mantém, em português natural, a ligação argumentativa do salmo.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino אֲדֹנָי em vocativo, sem tratá-lo como o nome divino יהוה.
- source_word: טוֹב
  choice: bom
  rationale: Preserva o sentido amplo da bondade de Deus sem restringi-lo apenas a bondade prática, benevolência ou gentileza.
- source_word: סַלָּח
  choice: perdoador
  rationale: O adjetivo raro descreve Deus como aquele que perdoa. “Perdoador” conserva a forma predicativa e é conciso; “disposto a perdoar” explicita a ideia de prontidão, mas é mais interpretativo.
- source_word: רַב חֶסֶד
  choice: rico em amor leal
  rationale: “Rico” comunica abundância, enquanto “amor leal” reúne benevolência duradoura e fidelidade relacional associadas a חֶסֶד.
- source_word: לְכָל קֹרְאֶיךָ
  choice: para com todos os que te invocam
  rationale: “Invocar” expressa com naturalidade a ação de dirigir-se a Deus em oração, e “para com” identifica os beneficiários de seu amor leal.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: Soberano; meu Senhor
  rationale: O termo é um título divino, não o Tetragrama. “Senhor” é a tradução portuguesa corrente e mantém essa distinção sem acrescentar um possessivo ausente na forma tradicionalmente vocalizada.
- issue: Amplitude semântica de חֶסֶד
  choice: amor leal
  alternative: amor constante; misericórdia; amor fiel
  rationale: “Amor leal” preserva conjuntamente afeto, benevolência duradoura e fidelidade, evitando reduzir o termo apenas a misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa do singular foi mantida por se tratar de oração direta; “invocam” evita uma expressão excessivamente coloquial e conserva o sentido cultual do hebraico.
