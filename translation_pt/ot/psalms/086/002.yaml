lexical_decisions:
- source_word: שָׁמְרָה
  choice: Guarda
  rationale: O imperativo de שׁמר pede a proteção de Deus. “Guarda” é conciso, natural e mantém o sentido protetor.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste pedido de preservação, נֶפֶשׁ designa a vida ou o próprio ser do salmista, e não principalmente uma parte imaterial da pessoa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada pelo salmista para o pedido e se encaixa naturalmente no registro de oração.
- source_word: חָסִיד
  choice: fiel
  rationale: O termo descreve alguém caracterizado por devoção e lealdade no relacionamento de aliança, sem implicar perfeição moral.
- source_word: הוֹשַׁע
  choice: salva
  rationale: O imperativo de ישׁע expressa um pedido de livramento; “salva” preserva tanto o sentido imediato quanto sua ressonância teológica.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: No contexto de oração, עֶבֶד funciona como título humilde de relação e submissão a Deus; “servo” é mais adequado aqui do que “escravo”.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz diretamente a forma possessiva e preserva o caráter pessoal da invocação.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: que confia em ti
  rationale: A expressão participial caracteriza o servo como alguém que deposita continuamente sua confiança em Deus.
theological_decisions:
- issue: Sentido de חָסִיד na autodescrição do salmista
  choice: O salmista se apresenta como fiel e leal a Deus.
  alternative: “piedoso”, “devoto”, “leal” ou “santo”
  rationale: '“Fiel” comunica devoção e lealdade de aliança sem transformar a declaração numa reivindicação de impecabilidade ou mérito. Assim, mantém-se a tensão do texto: o salmista apela para sua relação de fidelidade com Deus e, ainda assim, pede que Deus o salve.'
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento em “tu” coerentes com o discurso direto dirigido a Deus. A ordem e a pontuação tornam clara a invocação “meu Deus” sem eliminar a possível densidade sintática do hebraico.
