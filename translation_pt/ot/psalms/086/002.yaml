  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: pt
  text: Guarda a minha vida[a], pois sou fiel[b]; salva o teu servo, meu Deus, pois confio em ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “a minha alma”; aqui, provavelmente, “a minha vida” ou “a mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “piedoso”, “devoto” ou “leal”. A palavra hebraica indica fidelidade no relacionamento de aliança, não perfeição sem pecado.
