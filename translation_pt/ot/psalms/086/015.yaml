  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: pt
  text: Mas tu, Senhor, és Deus compassivo e bondoso, lento para a ira e rico em amor leal e fidelidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “verdade”. Nesta fórmula de aliança, a palavra hebraica muitas vezes tem o sentido de fidelidade ou confiabilidade, e não apenas de verdade em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção, com o pronome enfático, assume valor contrastivo no contexto; “Mas tu” o expressa naturalmente.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino Adonai, convencionalmente traduzido por “Senhor”, sem necessidade de explicitar valor possessivo.
- source_word: אֵל
  choice: Deus
  rationale: Identifica o Senhor como Deus na fórmula que ecoa Êxodo 34:6; “Deus” é natural e não acrescenta uma nuance de poder ausente da expressão.
- source_word: רַחוּם וְ/חַנּוּן
  choice: compassivo e bondoso
  rationale: “Compassivo” comunica a profunda misericórdia de רַחוּם; “bondoso” expressa de modo corrente a disposição favorável e generosa de חַנּוּן, evitando aqui a possível redundância estilística de “misericordioso”.
- source_word: אֶרֶךְ אַפַּיִם
  choice: paciente
  rationale: O idioma hebraico, literalmente ligado à demora em irar-se, descreve quem suporta a provocação sem se enfurecer depressa. “Paciente” é conciso e natural, embora “demoras a irar-te” seja uma alternativa mais formal.
- source_word: וְ/רַב חֶסֶד
  choice: e rico em amor leal
  rationale: רַב indica abundância, enquanto חֶסֶד reúne amor, misericórdia e lealdade de aliança. “Rico em amor leal” preserva essas dimensões em português claro.
- source_word: וֶ/אֱמֶת
  choice: e fidelidade
  rationale: Na associação formular com חֶסֶד, אֱמֶת frequentemente indica firmeza, confiabilidade ou fidelidade, sem excluir a tradução literal “verdade”.
theological_decisions:
- issue: Formulação de aliança que ecoa Êxodo 34:6
  choice: compassivo e bondoso, paciente e rico em amor leal e fidelidade
  alternative: misericordioso e gracioso, lento para a ira e abundante em misericórdia e verdade
  rationale: A redação conserva a ressonância da autodescrição divina e seus atributos relacionais, usando português moderno sem impor uma interpretação denominacional.
- issue: Sentido de אֱמֶת na expressão חֶסֶד וֶאֱמֶת
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” comunica melhor a confiabilidade relacional no par formular, mas a nota preserva a alternativa lexical genuína “verdade”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi mantido em uma frase fluente; “tu” conserva a ênfase do pronome hebraico e combina naturalmente com “Senhor” em registro bíblico corrente.
