source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: pt
  text: Pois grande é o teu amor leal para comigo, e livraste a minha vida das profundezas do Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do mundo dos mortos mais profundo” ou “da sepultura nas profundezas”. Sheol é o termo hebraico para o domínio dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do louvor no contexto anterior e preserva com naturalidade a ligação poética.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: Expressa o amor bondoso, firme e relacional de חֶסֶד sem restringi-lo apenas a misericórdia nem explicitar demais a dimensão pactual.
- source_word: גָּדוֹל
  choice: grande é
  rationale: Reproduz diretamente o sentido do adjetivo e mantém a ênfase poética mediante a ordem marcada.
- source_word: עָלָי
  choice: para comigo
  rationale: Comunica de modo idiomático que o amor de Deus se dirige ao salmista.
- source_word: וְהִצַּלְתָּ
  choice: e livraste
  rationale: O hifil de נצל indica livrar ou resgatar; o pretérito perfeito apresenta a ação como realizada.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto de livramento do Sheol, נֶפֶשׁ designa naturalmente a vida ou a própria pessoa. Evita sugerir, sem necessidade, uma antropologia técnica de alma separável.
- source_word: מִשְּׁאוֹל
  choice: do Sheol
  rationale: A transliteração conserva o conceito hebraico do domínio dos mortos sem reduzi-lo simplesmente à sepultura ou identificá-lo com uma categoria doutrinária posterior.
- source_word: תַּחְתִּיָּה
  choice: mais profundo
  rationale: Conserva a força superlativa e a imagem vertical do hebraico, formando em português uma expressão compreensível e solene.
theological_decisions:
- issue: Como traduzir שְׁאוֹל sem impor precisão doutrinária posterior
  choice: Sheol
  alternative: mundo dos mortos; sepultura nas profundezas
  rationale: A transliteração preserva a imagem antiga e sua amplitude sem equipará-la automaticamente ao inferno. A nota explica o termo e registra alternativas contextuais.
- issue: Sentido de נַפְשִׁי no contexto do livramento da morte
  choice: a minha vida
  alternative: a minha alma; a mim
  rationale: O contexto favorece a vida ameaçada ou a pessoa inteira. A opção evita transformar o verso em declaração técnica sobre a constituição humana, embora 'minha alma' permaneça uma tradução possível.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A inversão “grande é” preserva a ênfase poética; “amor leal” comunica חֶסֶד com clareza. Mantém-se “Sheol” para conservar a imagem hebraica, acompanhada de nota explicativa.
