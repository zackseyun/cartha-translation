review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a relação causal de כִּי, o sentido de חֶסֶד como amor leal, o perfeito de וְהִצַּלְתָּ e o campo semântico de נַפְשִׁי como “vida”. “Sheol” preserva corretamente o referente hebraico sem impor uma identificação doutrinária posterior. Contudo, “do mais profundo Sheol” é uma combinação pouco natural em português e representa de modo rígido a qualificação de שְׁאוֹל תַּחְתִּיָּה. “Das profundezas do Sheol” transmite com precisão a imagem de extrema descida e é idiomático.
  naturalness: O registro é moderno, solene e acessível. “Pois grande é” e “para comigo” são apropriados ao gênero poético. A única dificuldade relevante é a ordem e a colocação em “mais profundo Sheol”; “das profundezas do Sheol” é mais fluente para leitores de português internacional e brasileiro.
  terminology: “Amor leal” é uma boa solução para חֶסֶד. “Vida” é contextualmente defensável para נַפְשִׁי e não introduz uma antropologia técnica. Deve-se manter “Sheol” com nota explicativa; as alternativas da nota devem ser formuladas como alternativas naturais em português.
  issues:
  - severity: medium
    issue: A expressão “do mais profundo Sheol” é pouco idiomática e soa como uma construção calcada.
    rationale: Embora “mais profundo” procure refletir תַּחְתִּיָּה, em português a imagem vertical é expressa naturalmente por “das profundezas do Sheol”. Essa formulação preserva o sentido de Sheol extremamente profundo/baixo sem sugerir indevidamente uma geografia técnica de níveis.
