revisions:
- from: Pois grande é o teu amor leal para comigo, e livraste a minha vida do mais profundo Sheol.[a]
  to: Pois grande é o teu amor leal para comigo, e livraste a minha vida das profundezas do Sheol.[a]
  rationale: A revisão substitui a construção pouco natural “do mais profundo Sheol” por “das profundezas do Sheol”, expressão portuguesa idiomática que conserva a intensidade e a imagem descendente de שְׁאוֹל תַּחְתִּיָּה. A nota foi ajustada para que sua primeira alternativa seja gramatical e semanticamente paralela à expressão hebraica.
