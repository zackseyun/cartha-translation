base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: pt
  text: Tem misericórdia de mim[a], Senhor, pois clamo a ti o dia todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mostra-me favor”. O verbo hebraico pode expressar um pedido de favor gracioso ou de misericórdia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Tem compaixão de mim
  rationale: O imperativo de חנן com sufixo de primeira pessoa pede favor gracioso ou misericórdia. Em português atual, “tem compaixão de mim” é natural na linguagem de oração e conserva a dimensão de misericórdia, enquanto a nota registra a alternativa mais diretamente ligada à graça/favor.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino אֲדֹנָי, convencional e adequadamente traduzido por “Senhor”; “meu Senhor” tornaria explícito um elemento possessivo que não convém destacar no uso fixo do título divino.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta o pedido. “Pois” preserva de modo conciso e natural a relação causal.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: A preposição אֶל com sufixo de segunda pessoa masculina singular indica a direção do clamor. “A ti” é idiomático com “clamar” e mantém o registro digno da oração.
- source_word: אֶקְרָא
  choice: clamo
  rationale: קרא pode significar chamar ou clamar. No contexto de súplica dirigida a Deus, “clamo” expressa naturalmente o ato de invocá-lo sem acrescentar a intensidade mais forte de “grito”.
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: A expressão significa literalmente “todo o dia”. “O dia todo” é corrente em português e preserva a ideia de apelo sustentado ou repetido.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor; Soberano
  rationale: O verso se dirige a Deus em oração com o título divino estabelecido אֲדֹנָי. “Senhor” traduz o título de modo tradicional, claro e não denominacional, sem enfatizar indevidamente a forma possessiva histórica.
- issue: Amplitude semântica de חנן
  choice: Tem compaixão de mim
  alternative: Sê bondoso comigo; concede-me favor
  rationale: O verbo abrange favor gracioso e misericórdia. A tradução principal usa uma súplica portuguesa natural, enquanto a nota preserva a alternativa ligada mais explicitamente a graça e favor, sem definir uma distinção teológica ausente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “A ti” conserva o tom de oração sem arcaísmo excessivo; “o dia todo” evita a formulação menos corrente “todo o dia”.
