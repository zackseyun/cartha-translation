  text: הָ֤/אֵ֣ל לָ/נוּ֮ אֵ֤ל לְֽ/מוֹשָׁ֫ע֥וֹת וְ/לֵ/יהוִ֥ה אֲדֹנָ֑/י לַ֝/מָּ֗וֶת תּוֹצָאֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: pt
  text: Deus é para nós um Deus de salvações[a]; a Yahweh, o Senhor, pertencem as formas de escapar da morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um Deus de livramentos». O plural hebraico pode enfatizar atos repetidos ou variados de resgate.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «saídas da morte» ou «vias de saída quanto à morte». O sentido é o de maneiras de escapar da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Deus
  rationale: O artigo definido identifica especificamente Deus; em português, «Deus» já funciona naturalmente como nome definido.
- source_word: לָנוּ
  choice: para nós
  rationale: A preposição ל indica aqui relação e benefício; «para nós» é natural em português e conserva essa força.
- source_word: אֵל
  choice: um Deus
  rationale: A repetição de אֵל é mantida na construção predicativa, preservando a ênfase do hebraico.
- source_word: לְמוֹשָׁעוֹת
  choice: de salvações
  rationale: O plural hebraico é preservado para sugerir atos repetidos ou múltiplos de salvação, ainda que a expressão seja levemente marcada em português.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: a Yahweh, o Senhor
  rationale: Mantém distintos o nome divino יהוה e o título אֲדֹנָי, respeitando a ordem do texto hebraico e evitando a combinação pouco natural «Senhor SENHOR».
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: formas de escapar da morte
  rationale: תּוֹצָאוֹת denota literalmente saídas ou vias de saída; com מָוֶת, a expressão comunica meios de escapar da morte. A formulação portuguesa torna o sentido inteligível e mantém a ideia plural.
theological_decisions:
- issue: Representação do nome divino יהוה junto de אֲדֹנָי
  choice: Yahweh, o Senhor
  alternative: o Senhor DEUS
  rationale: A tradução explicita o nome da aliança e conserva também o título «o Senhor», sem fundir os dois elementos do hebraico.
- issue: Sentido de לַמָּוֶת תּוֹצָאוֹת
  choice: formas de escapar da morte
  alternative: saídas da morte
  rationale: A construção pode ser reproduzida mais literalmente, mas isso seria opaco em português. O contexto favorece vias de livramento da morte, sem negar que a expressão hebraica enfatiza que essas saídas pertencem ao Senhor.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «Deus» e o plural incomum «salvações» foram mantidos por sua importância poética e semântica; a expressão final foi tornada idiomática, com a forma literal registrada em nota.
