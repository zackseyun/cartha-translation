source:
  edition: WLC
  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: pt
  text: Viram as tuas procissões, ó Deus — as procissões do meu Deus, do meu Rei, no santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Viram os teus caminhos, ó Deus — os caminhos do meu Deus, do meu Rei, em santidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: Viram
  rationale: O qal perfeito na terceira pessoa do plural descreve uma ação concluída; o pretérito perfeito é a forma mais natural em português e não exige acrescentar um valor aspectual além do hebraico.
- source_word: הֲלִיכוֹתֶיךָ
  choice: as tuas procissões
  rationale: O substantivo plural pode significar movimentos, marchas ou cortejos. O contexto litúrgico e celebrativo favorece “procissões”, mantendo também o plural explícito do hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto indica vocativo; “ó Deus” preserva de modo natural e solene a interpelação poética.
- source_word: הֲלִיכוֹת
  choice: as procissões
  rationale: A repetição do mesmo termo preserva o paralelismo e a ênfase do original, bem como seu plural.
- source_word: אֵלִי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa singular expressa posse de maneira direta.
- source_word: מַלְכִּי
  choice: meu Rei
  rationale: Preserva o título régio aplicado a Deus; a inicial maiúscula segue o uso português para título divino sem acrescentar conteúdo.
- source_word: בַקֹּדֶשׁ
  choice: no santuário
  rationale: A preposição בְּ significa primariamente “em/no”, e קֹדֶשׁ pode designar o lugar santo ou santuário. “No santuário” conserva melhor a forma hebraica do que a leitura direcional “para dentro do santuário”.
theological_decisions:
- issue: Referente das procissões
  choice: Movimentos cerimoniais de Deus vistos no santuário
  alternative: Os caminhos ou atos de Deus vistos em santidade; ou procissões que entram no santuário
  rationale: O substantivo repetido e o contexto celebrativo favorecem a imagem processional, mas בַקֹּדֶשׁ não exprime inequivocamente direção. A tradução mantém a localização “no santuário”, enquanto a nota registra a alternativa mais abstrata.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição e o plural do hebraico foram preservados; a ambiguidade de בַקֹּדֶשׁ foi tratada sem impor uma direção ausente da preposição.
