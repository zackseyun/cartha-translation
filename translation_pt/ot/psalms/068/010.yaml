  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: pt
  text: As tuas criaturas[a] se estabeleceram nela; em tua bondade, ó Deus, providenciaste para o pobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico חַיָּתְךָ é difícil neste contexto; também pode ser traduzido como “teus seres vivos”, “teu rebanho”, “tua comunidade” ou “tua congregação”.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: as tuas criaturas
  rationale: O substantivo חַיָּה designa literalmente um ser vivo ou animal, mas aqui pode ter sentido coletivo e referir-se à comunidade pertencente a Deus. “Criaturas” preserva a amplitude do termo sem impor uma interpretação exclusivamente humana; a dificuldade é explicitada em nota.
- source_word: יָשְׁבוּ בָהּ
  choice: se estabeleceram nela
  rationale: יָשַׁב pode significar sentar-se, habitar ou estabelecer-se. No contexto da terra ou herança mencionada anteriormente, “se estabeleceram nela” expressa residência duradoura e mantém a referência feminina do sufixo.
- source_word: תָּכִין
  choice: providenciaste
  rationale: O hifil de כּוּן pode significar preparar, firmar ou deixar pronto. Com o complemento “para o pobre”, o sentido contextual é o de fazer provisão.
- source_word: בְּטוֹבָתְךָ
  choice: em tua bondade
  rationale: טוֹבָה pode indicar bondade, benefício ou abundância. A formulação conserva a preposição e apresenta a bondade divina como esfera ou motivo da provisão, sem reduzir o termo a bens materiais.
- source_word: לֶעָנִי
  choice: para o pobre
  rationale: עָנִי pode designar o pobre, necessitado ou aflito. Neste contexto de provisão, “o pobre” é direto e natural, embora o termo hebraico também possa abranger quem sofre aflição.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O nome funciona como vocativo no fim do verso; “ó Deus” preserva com naturalidade o apelo poético.
theological_decisions:
- issue: Sentido de חַיָּתְךָ neste contexto poético difícil
  choice: Referência ampla às “criaturas” de Deus, sem definir se são animais ou uma coletividade humana
  alternative: “teu rebanho”, “tua comunidade” ou “tua congregação”
  rationale: O sentido literal é ligado a seres vivos, mas o contexto de ocupação da terra permite uma leitura coletiva do povo de Deus. O texto principal mantém o termo amplo, e a nota conserva as principais possibilidades sem impor uma identificação denominacional ou resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com o registro poético dos Salmos. “Providenciaste para o pobre” é idiomático e conciso; a nota está ligada ao termo realmente ambíguo no hebraico.
