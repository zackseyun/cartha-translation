  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: pt
  text: Nas assembleias, bendigam a Deus, Yahweh[b], da fonte de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês que procedem da fonte (ou origem) de Israel”. A expressão hebraica é elíptica e pode descrever a procedência dos adoradores, isto é, a descendência de Israel.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: Nas assembleias
  rationale: O plural מַקְהֵלוֹת designa grupos reunidos. “Assembleias” preserva o plural e evita uma conotação eclesiástica institucional que não é exigida pelo hebraico.
- source_word: בָּרְכוּ
  choice: bendigam
  rationale: O imperativo plural de ברך, tendo Deus como objeto, refere-se a bendizê-lo em linguagem de adoração. “Bendigam” mantém tanto o valor verbal quanto o sentido de ordem.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים tem referente singular e aparece em relação a יהוה; “Deus” é a tradução portuguesa natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração do nome divino preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִמְּקוֹר
  choice: desde a fonte
  rationale: מָקוֹר significa fonte, nascente ou origem. “Fonte” conserva a imagem poética, e “desde” expressa a ideia de procedência marcada por מִן sem eliminar a construção elíptica.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome divino, enquanto “SENHOR” representa a substituição tradicional por um título.
- issue: Relação de יהוה com אֱלֹהִים
  choice: “a Yahweh” como aposição que identifica Deus
  alternative: Entender “Yahweh” como início da expressão seguinte ou como invocação independente
  rationale: A leitura em aposição é sintaticamente plausível e mantém juntos os dois nomes divinos, mas a concisão poética do hebraico permite alguma incerteza; a tradução evita ampliar a frase com explicações teológicas.
- issue: Sentido de “desde a fonte de Israel”
  choice: Manter a expressão elíptica e imagética
  alternative: “vocês que procedem da fonte/origem de Israel”
  rationale: O hebraico não explicita o sujeito ou o vínculo sintático da expressão final. A forma literal conserva a ambiguidade entre uma indicação poética de origem e uma descrição dos adoradores como descendentes de Israel.
translation_notes:
  register: Português moderno, claro e digno, com imperativo na terceira pessoa do plural, amplamente compreensível no Brasil e em outros contextos lusófonos. “Desde a fonte” mantém a imagem e a estranheza poética controlada do original; a nota esclarece a principal leitura alternativa.
