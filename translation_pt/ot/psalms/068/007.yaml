  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: pt
  text: Deus, quando saíste à frente do teu povo, quando marchaste pelo deserto[a] — Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela região desolada” ou “pela terra erma”. O termo hebraico se refere a uma região desértica e desolada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Mantém o endereço direto, de valor vocativo, sem acrescentar uma partícula inexistente no hebraico.
- source_word: בְּצֵאתְךָ
  choice: quando saíste
  rationale: A preposição ב com o infinitivo construto e o sufixo de segunda pessoa tem sentido temporal neste contexto.
- source_word: לִפְנֵי עַמֶּךָ
  choice: à frente do teu povo
  rationale: Expressa naturalmente a imagem de Deus indo adiante e guiando o povo.
- source_word: בְּצַעְדְּךָ
  choice: quando marchaste
  rationale: O verbo צעד indica avançar a passos ou marchar; aqui transmite movimento deliberado e forma paralelo com 'quando saíste'.
- source_word: בִישִׁימוֹן
  choice: pelo deserto
  rationale: יְשִׁימוֹן designa uma região desolada ou erma; 'pelo' comunica de modo idiomático o movimento através dela.
- source_word: סֶלָה
  choice: Selá
  rationale: A transliteração preserva a incerteza quanto à função exata do termo, provavelmente litúrgica ou musical.
theological_decisions:
- issue: A ação divina na jornada do povo pelo deserto
  choice: Discurso direto a Deus, recordando que ele ia à frente do seu povo no deserto.
  alternative: Leitura descritiva, sem entender 'Deus' como endereço direto.
  rationale: A sintaxe e o contexto do salmo favorecem o discurso direto, sem exigir que a tradução explicite além do texto a identificação histórica ou uma formulação doutrinária adicional.
translation_notes:
  register: Português atual, digno e claro, com formas de segunda pessoa singular coerentes com o endereço direto a Deus. 'Selá' é conservado como termo transliterado.
