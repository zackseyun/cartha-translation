  text: מֵֽ֭/הֵיכָלֶ/ךָ עַל יְרוּשָׁלִָ֑ם לְ/ךָ֤ יוֹבִ֖ילוּ מְלָכִ֣ים שָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: pt
  text: Do teu templo, acima de Jerusalém[a], reis te trarão tributo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por causa do teu templo em Jerusalém, reis te trarão presentes.»'
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por «presente» ou «oferta».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Do teu templo
  rationale: Preserva o sentido básico de origem da preposição מִן e traduz הֵיכָל pelo termo corrente «templo».
- source_word: עַל יְרוּשָׁלִָם
  choice: que se eleva sobre Jerusalém
  rationale: Expressa de modo natural a relação espacial indicada por עַל, evitando sugerir que o templo flutua sobre a cidade; a explicitação «que se eleva» evoca sua posição elevada.
- source_word: לְךָ
  choice: te
  rationale: Marca Deus como destinatário daquilo que os reis trazem, em formulação portuguesa natural.
- source_word: יוֹבִילוּ
  choice: trarão
  rationale: O hifil de יבל, com שַׁי como objeto, significa aqui levar ou trazer uma oferta a alguém.
- source_word: מְלָכִים
  choice: reis
  rationale: Mantém diretamente a imagem régia do substantivo hebraico.
- source_word: שַׁי
  choice: tributo
  rationale: Além de «presente» ou «oferta», o termo pode designar tributo oferecido a um superior; o contexto de reis honrando Deus favorece essa nuance.
theological_decisions:
- issue: Relação sintática entre o templo e Jerusalém
  choice: O templo de Deus é descrito como situado em posição elevada sobre Jerusalém, e dele parte a linha que culmina no tributo trazido pelos reis.
  alternative: «Por causa do teu templo em Jerusalém, reis te trarão presentes.»
  rationale: O hebraico admite que מִן tenha valor causal e que עַל seja entendido de modo locativo mais geral. O texto principal conserva mais claramente os valores espaciais básicos sem excluir a leitura alternativa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção poética natural. Emprega «teu/te» por coerência com o discurso direto a Deus e mantém «tributo» para preservar a nuance política e honorífica.
