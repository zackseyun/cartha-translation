source:
  edition: WLC
  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: pt
  text: O teu Deus decretou a tua força. Demonstra força[a], ó Deus, tu que agiste em nosso favor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico עוּזָה é difícil. Também pode ser entendido como “Sê forte, ó Deus” ou, ligado ao versículo seguinte, “Fortalece, ó Deus, aquilo que fizeste por nós”.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: decretou
  rationale: O perfeito indica uma determinação já emitida e ainda válida. “Decretou” preserva a força de uma ordem soberana e se combina naturalmente com o substantivo “força”.
- source_word: אֱלֹהֶיךָ
  choice: o teu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui tem sentido singular e se refere ao Deus de Israel; o sufixo de segunda pessoa masculina singular é traduzido por “teu”.
- source_word: עֻזֶּךָ
  choice: a tua força
  rationale: O substantivo designa força ou poder; “força” é claro e mantém a correspondência lexical com a oração seguinte.
- source_word: עוּזָה
  choice: Demonstra força
  rationale: A forma é incomum e de interpretação difícil. Esta tradução preserva seu valor de apelo dirigido a Deus sem acrescentar um possessivo ausente nessa oração.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto exige sentido vocativo, marcado naturalmente em português por “ó Deus”.
- source_word: זוּ
  choice: tu que
  rationale: A partícula relativa introduz uma oração que descreve Deus dentro da invocação direta.
- source_word: פָּעַלְתָּ
  choice: agiste
  rationale: O verbo exprime ação eficaz. “Agiste” é natural em português e evita exigir um objeto que o hebraico não explicita.
- source_word: לָּנוּ
  choice: em nosso favor
  rationale: 'A preposição tem sentido benefactivo: Deus agiu em benefício do povo.'
theological_decisions:
- issue: Forma ambígua עוּזָה
  choice: 'Entendê-la como pedido para Deus manifestar força: “Demonstra força, ó Deus”'
  alternative: “Sê forte, ó Deus” ou “Fortalece, ó Deus, aquilo que fizeste por nós”
  rationale: A sintaxe hebraica é difícil. A leitura escolhida mantém o caráter de súplica e a coerência interna do versículo, sem incorporar silenciosamente palavras do versículo seguinte; a nota conserva as principais alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Demonstra força” conserva a concisão e a estranheza moderada do hebraico; “em nosso favor” expressa de modo natural o valor benefactivo de לָנוּ.
