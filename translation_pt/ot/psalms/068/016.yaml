base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: pt
  text: Por que vocês saltitam[a], ó montanhas de muitos picos, diante do monte que Deus desejou para nele habitar? Sim, Yahweh habitará ali para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que olham com inveja?” O verbo hebraico é raro e incerto; pode descrever saltos ou um olhar invejoso, desconfiado ou de soslaio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: saltitam
  rationale: O verbo hebraico é raro e de sentido incerto. “Saltitam” preserva a possível imagem de movimento, sem eliminar na nota a alternativa contextual de um olhar invejoso ou hostil.
- source_word: הָרִים גַּבְנֻנִּים
  choice: montanhas de muitos picos
  rationale: A expressão provavelmente evoca elevações com lombadas, cristas ou vários cumes; esta formulação conserva a imagem e permanece compreensível.
- source_word: הָהָר
  choice: o monte
  rationale: Mantém o substantivo definido do hebraico sem explicitar “Sião”, embora o contexto mais amplo do salmo aponte para ele.
- source_word: חָמַד
  choice: desejou
  rationale: Expressa diretamente a ideia de desejar ou ter prazer em algo, sem substituir o verbo pela implicação interpretativa “escolheu”.
- source_word: לְשִׁבְתּוֹ
  choice: para nele habitar
  rationale: Reproduz com naturalidade a construção de finalidade e deixa claro que Deus deseja o monte como lugar de sua habitação.
- source_word: אַף
  choice: Sim
  rationale: Neste contexto, a partícula reforça enfaticamente a afirmação seguinte; “Sim” comunica essa confirmação de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: habitará ali para sempre
  rationale: “Habitará” representa o sentido de estabelecer morada; “ali” é explicitado a partir do monte mencionado no contexto, e “para sempre” traduz a duração ilimitada.
theological_decisions:
- issue: Identificação explícita do monte como Sião
  choice: Manter “o monte” no texto principal
  alternative: Traduzir interpretativamente como “o monte Sião”
  rationale: O contexto do salmo permite identificar o lugar com Sião, mas este versículo emprega apenas o substantivo comum definido. A tradução evita acrescentar ao texto uma especificidade não expressa aqui.
- issue: Sentido da pergunta retórica dirigida às outras montanhas
  choice: Usar a imagem de movimento “saltitam” e registrar a incerteza em nota
  alternative: Explicitar “olham com inveja” ou “olham de soslaio” no texto principal
  rationale: O verbo é raro e admite interpretações distintas. A escolha conserva a imagem lexical possível, enquanto a nota preserva a leitura adversativa sugerida pelo contraste entre as montanhas e o monte desejado por Deus.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O vocativo “ó” preserva o tom poético, enquanto “vocês” evita uma conjugação excessivamente arcaica. A personificação das montanhas e a ambiguidade do verbo raro são mantidas.
