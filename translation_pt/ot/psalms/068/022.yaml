base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: pt
  text: 'O Senhor disse: “Eu os trarei de volta de Basã; eu os trarei de volta das profundezas do mar.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Eu trarei de volta de Basã; eu trarei de volta das profundezas do mar”. O hebraico não expressa o objeto do verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo natural e tradicional em português, sem confundi-lo com o nome divino YHWH.
- source_word: אָמַר
  choice: disse
  rationale: O qatal introduz diretamente a fala divina; “disse” é a formulação simples e natural.
- source_word: מִבָּשָׁן
  choice: de Basã
  rationale: Mantém o topônimo transliterado e traduz מִן pela preposição portuguesa natural “de”.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: eu os trarei de volta ... eu os trarei de volta
  rationale: O hifil de שוב tem sentido causativo, “trazer de volta”. O pronome “os” explicita em português o objeto deixado implícito no hebraico; a repetição é preservada para manter a ênfase.
- source_word: מִמְּצֻלוֹת יָם
  choice: das profundezas do mar
  rationale: Expressão idiomática que preserva a imagem das regiões profundas do mar e sua ideia de distância ou perigo extremos.
theological_decisions:
- issue: Objeto implícito do verbo repetido אָשִׁיב
  choice: 'Explicitar “os”: “eu os trarei de volta”'
  alternative: 'Manter o objeto sem expressão: “eu trarei de volta de Basã; eu trarei de volta das profundezas do mar”'
  rationale: O hebraico não expressa o objeto, mas o hifil é transitivo e o português pede naturalmente um complemento. “Os” é suprido pelo contexto sem definir de maneira indevida se a referência específica é ao povo de Deus, aos inimigos ou a outro grupo contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição hebraica foi mantida, e a ambiguidade do objeto implícito foi registrada em nota.
