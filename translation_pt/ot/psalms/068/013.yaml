base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: pt
  text: Embora vocês se deitem entre os apriscos[a], as asas de uma pomba estão cobertas de prata, e suas penas de voo estão cobertas de ouro amarelo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os alforjes” ou “entre as pedras da lareira”; o termo hebraico é incerto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em ouro amarelo-esverdeado” ou “com um brilho amarelo-esverdeado de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Embora
  rationale: Neste contexto poético, a partícula pode introduzir uma oração concessiva. “Embora” expressa essa leitura provável sem eliminar em nota uma ambiguidade que não exige destaque editorial próprio.
- source_word: תִּשְׁכְּבוּן
  choice: vocês se deitem
  rationale: O verbo שׁכב descreve o ato de deitar-se. O subjuntivo é exigido naturalmente em português depois de “embora”, e “vocês” oferece leitura ampla e corrente para a segunda pessoa plural.
- source_word: בֵּין שְׁפַתָּיִם
  choice: entre os apriscos
  rationale: O termo שְׁפַתָּיִם é obscuro e discutido. “Apriscos” preserva uma interpretação tradicional ligada a lugares de repouso ou recintos, enquanto a nota registra alternativas relevantes.
- source_word: כַּנְפֵי יוֹנָה
  choice: as asas de uma pomba
  rationale: Reproduz de modo direto e natural a cadeia construta hebraica e mantém a imagem poética.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: estão cobertas de prata
  rationale: O particípio de חפה indica revestimento ou cobertura. A formulação conserva o estado descrito no hebraico sem especificar indevidamente o método de revestimento.
- source_word: אֶבְרוֹתֶיהָ
  choice: suas penas de voo
  rationale: אֶבְרוֹת designa as penas fortes das asas. “Penas de voo” é mais claro ao leitor comum do que o termo técnico “rêmiges” e mais preciso do que simplesmente “penas”.
- source_word: בִּירַקְרַק חָרוּץ
  choice: de ouro amarelado
  rationale: חָרוּץ pode designar ouro, e יְרַקְרַק evoca uma tonalidade amarela ou amarelo-esverdeada. “Ouro amarelado” mantém uma imagem compreensível no texto, enquanto a nota preserva a nuance cromática incomum.
