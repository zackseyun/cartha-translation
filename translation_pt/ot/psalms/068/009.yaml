source:
  edition: WLC
  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: pt
  text: Derramaste chuva abundante[a], ó Deus; quando a tua herança estava exausta[b], tu a firmaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “chuva generosa”; a expressão hebraica ressalta a provisão concedida por Deus com largueza.
    reason: lexical_alternative
  - marker: b
    text: “A tua herança” pode se referir ao povo de Deus, à terra ou a ambos em conjunto na linguagem poética. “Firmaste” também pode ser traduzido por “estabeleceste” ou “tornaste firme”.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: chuva abundante
  rationale: A expressão combina o substantivo comum para “chuva” com um termo ligado à generosidade e à oferta voluntária. No contexto, descreve uma chuva concedida com largueza; “chuva abundante” comunica naturalmente essa provisão generosa.
- source_word: תָּנִיף
  choice: derramaste
  rationale: O hifil de נוּף pode indicar fazer oscilar ou sacudir; associado à chuva, retrata Deus fazendo-a cair. “Derramaste” preserva a imagem poética e a ação divina sem soar mecânico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto é de discurso direto. A forma vocativa “ó Deus” mantém o tom poético e reverente.
- source_word: נַחֲלָתְךָ
  choice: a tua herança
  rationale: O termo pode designar a propriedade atribuída a Deus, seu povo, sua terra ou ambos em linguagem poética. A tradução literal preserva essa amplitude referencial.
- source_word: וְנִלְאָה
  choice: quando ... estava exausta
  rationale: A forma feminina singular concorda com “herança” e expressa cansaço, enfraquecimento ou esgotamento. A relação temporal torna a sequência hebraica clara em português sem alterar seu sentido.
- source_word: כּוֹנַנְתָּהּ
  choice: tu a restauraste
  rationale: O verbo כּון denota firmar, estabelecer, preparar ou tornar estável. Aqui, após a exaustão da herança e a chuva providencial, “restauraste” comunica a renovação e o fortalecimento implícitos no contexto, sem especificar se o referente é a terra ou o povo.
theological_decisions:
- issue: Referente de “a tua herança”
  choice: Mantida a expressão “a tua herança”, sem identificar exclusivamente a terra ou o povo.
  alternative: “a tua terra” ou “o teu povo”
  rationale: O hebraico permite que a expressão abranja a terra, o povo de Deus ou ambos em compressão poética. Manter “herança” preserva a ambiguidade genuína e a amplitude teológica do verso.
- issue: Sentido de כּוֹנַנְתָּהּ
  choice: “tu a restauraste”
  alternative: “tu a firmaste” ou “tu a estabeleceste”
  rationale: “Restauraste” se ajusta ao quadro de uma herança exausta revigorada pela chuva, enquanto o verbo também comporta a ideia de firmar ou estabelecer. A nota registra essa extensão sem resolver indevidamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A inversão poética foi evitada; o vocativo “ó Deus” conserva a solenidade. Os pronomes “tu/a tua” preservam o discurso direto e a concordância tradicional bíblica.
