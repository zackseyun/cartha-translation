base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: pt
  text: Os carros de Deus são miríades, milhares e milhares[a]; o Senhor está entre eles, como no Sinai, em santidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma expressão numérica que pode ser entendida como “duas miríades” ou, de modo idiomático, como uma quantidade imensa; em seguida aparece literalmente “milhares de shin'an”, palavra rara e incerta, provavelmente ligada à repetição ou multiplicidade.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta oração é muito condensado e difícil. Outras traduções possíveis são: “o Senhor está entre eles — Sinai em santidade”; “o Senhor está entre eles; o Sinai está no santuário”; ou “o Senhor veio do Sinai para o lugar santo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: os carros de Deus
  rationale: רֶכֶב pode designar coletivamente carros ou forças de carros. A formulação preserva a imagem poética e a relação possessiva do construto.
- source_word: רִבֹּתַיִם
  choice: miríades
  rationale: A forma dual pode indicar literalmente duas miríades, mas no paralelismo funciona como expressão de quantidade imensa. “Miríades” mantém o tom elevado sem impor precisão matemática.
- source_word: אַלְפֵי שִׁנְאָן
  choice: milhares e milhares
  rationale: שִׁנְאָן é raro e de sentido incerto, provavelmente associado a repetição ou multiplicidade. A expressão comunica abundância reiterada em português natural.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Tradução portuguesa corrente do título divino אֲדֹנָי.
- source_word: בָם
  choice: entre eles
  rationale: A preposição ב com o sufixo pode significar “neles”, “com eles” ou “entre eles”; no contexto da hoste de carros, “entre eles” é natural.
- source_word: סִינַי
  choice: Sinai
  rationale: Transliteração portuguesa estabelecida do topônimo.
- source_word: בַּקֹּדֶשׁ
  choice: em santidade
  rationale: קֹדֶשׁ pode denotar santidade ou um lugar santo. A opção abstrata evita especificar “santuário” onde a sintaxe hebraica permanece comprimida e ambígua.
theological_decisions:
- issue: Interpretação da oração comprimida אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: o Senhor está entre eles, Sinai em santidade
  alternative: 'o Senhor está entre eles como no Sinai, em santidade; ou: o Senhor veio do Sinai para o santuário'
  rationale: A redação principal conserva a concisão e a tensão sintática do hebraico, sem acrescentar comparação ou movimento que não estejam expressos. A nota registra leituras interpretativas plausíveis.
translation_notes:
  register: Português moderno, digno e poético, com legibilidade brasileira e compreensão internacional. Mantém-se deliberadamente a formulação elíptica “Sinai em santidade” no texto, enquanto a nota explicita a dificuldade e as principais alternativas.
