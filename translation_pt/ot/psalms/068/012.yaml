  text: מַלְכֵ֣י צְ֭בָאוֹת יִדֹּד֣וּ/ן יִדֹּד֑וּ/ן וּ/נְוַת בַּ֝֗יִת תְּחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: pt
  text: 'Reis de exércitos fogem, fogem;

    e a mulher que fica em casa reparte os despojos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a dona de casa reparte os despojos»; ou: «a que habita na casa reparte os despojos». A expressão hebraica está no feminino singular e provavelmente retrata a mulher que permanece em casa recebendo e distribuindo os bens capturados na guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: reis de exércitos
  rationale: Preserva a construção hebraica no plural e o sentido militar de צְבָאוֹת, sem evocar desnecessariamente o uso de «exércitos» em um título divino.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: fogem, fogem
  rationale: A repetição direta mantém a ênfase e a força poética do verbo נדד no hebraico.
- source_word: וּנְוַת בַּיִת
  choice: a mulher que fica em casa
  rationale: Expressa naturalmente o referente feminino singular e a imagem daquela que permanece no lar, sem recorrer a um termo social potencialmente anacrônico.
- source_word: תְּחַלֵּק
  choice: reparte
  rationale: O piel indica dividir ou distribuir; «reparte» comunica de modo claro a distribuição dos bens capturados.
- source_word: שָׁלָל
  choice: os despojos
  rationale: Designa bens tomados na guerra; «despojos» é corrente no registro bíblico-militar e permanece compreensível.
