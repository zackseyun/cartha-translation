base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: pt
  text: 'Cantem a Deus, cantem louvores ao seu nome;


    preparem uma estrada[a] para aquele que cavalga pelas estepes[b].


    Yah é o seu nome; exultem diante dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aplanem o caminho”. O verbo hebraico descreve erguer, aterrar ou preparar uma via; a imagem pode evocar a preparação de uma estrada para a chegada de Deus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sobre as nuvens”. O sentido habitual do termo hebraico é “estepes” ou “planícies áridas”, mas alguns intérpretes o entendem aqui em sentido teofânico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Cantem a Deus
  rationale: O imperativo plural de שׁיר é uma convocação direta ao canto, e אֱלֹהִים designa aqui o Deus de Israel.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: cantem louvores ao seu nome
  rationale: זמר, neste contexto de culto, denota cantar ou fazer música em louvor; a formulação mantém שְׁמוֹ, “seu nome”.
- source_word: סֹלּוּ
  choice: preparem o caminho
  rationale: O verbo סלל significa literalmente erguer, aplanar ou preparar uma estrada. “Preparem o caminho” comunica de modo natural a imagem de abrir uma via para a chegada divina, embora o substantivo “caminho” esteja implícito.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: para aquele que cavalga pelas estepes
  rationale: O particípio רֹכֵב apresenta Deus como cavaleiro, e עֲרָבוֹת normalmente designa planícies áridas ou estepes. “Cavalga pelas estepes” conserva tanto o movimento quanto o cenário.
- source_word: בְּיָהּ שְׁמוֹ
  choice: Yah é o seu nome
  rationale: יָהּ é a forma abreviada do nome divino e, por ser nome próprio, é transliterada. A ordem portuguesa preserva a ênfase inicial em Yah.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: exultem diante dele
  rationale: עלז indica alegria intensa e jubilosa; “exultem” mantém o tom elevado e celebrativo do imperativo.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: O hebraico traz יָהּ, forma curta e distinta do tetragrama completo. A transliteração preserva essa forma específica sem substituí-la por um título.
- issue: Imagem do cavaleiro divino em בָּעֲרָבוֹת
  choice: aquele que cavalga pelas estepes
  alternative: aquele que cavalga sobre as nuvens
  rationale: O sentido lexical usual de עֲרָבוֹת favorece “estepes” ou “planícies áridas”, em harmonia com o cenário de marcha pelo deserto no salmo. A leitura teofânica “nuvens” é genuína e foi preservada em nota, sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos no plural. “Estepes” preserva a precisão da paisagem sem regionalismo; “Yah” mantém a forma abreviada do nome divino. As quebras de linha refletem o paralelismo poético.
