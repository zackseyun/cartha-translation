source:
  edition: WLC
  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: pt
  text: Pai dos que não têm pai e juiz das viúvas é Deus em sua santa morada[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pai dos órfãos”. A expressão hebraica se refere especialmente aos que foram privados do pai.
    reason: lexical_alternative
  - marker: b
    text: Ou “defensor das viúvas”; a palavra hebraica designa mais literalmente quem julga ou administra justiça.
    reason: lexical_alternative
  - marker: c
    text: Ou “desde a sua santa morada”; algumas traduções entendem a expressão como o lugar de onde Deus age, embora a preposição hebraica signifique literalmente “em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: Pai dos
  rationale: O construto de אָב é predicativo em relação a אֱלֹהִים. “Pai dos” preserva diretamente a relação hebraica e soa natural em português.
- source_word: יְתוֹמִים
  choice: que não têm pai
  rationale: O termo designa especialmente crianças privadas do pai. A formulação mantém essa precisão e a vulnerabilidade social em foco; “órfãos” permanece como alternativa mais concisa.
- source_word: דַיַּן
  choice: juiz das
  rationale: O substantivo indica quem julga ou administra justiça. “Juiz” conserva a imagem judicial sem explicitar interpretativamente a ideia de defensor.
- source_word: אַלְמָנוֹת
  choice: viúvas
  rationale: Equivalente direto e corrente para mulheres privadas do marido.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora formalmente plural, aqui tem sentido singular e é o sujeito da oração nominal.
- source_word: בִּמְעוֹן
  choice: em sua santa morada
  rationale: מָעוֹן significa morada ou habitação, e a preposição בְּ é normalmente locativa, “em”. “Morada” é atual, digna e adequada à poesia.
- source_word: קָדְשׁוֹ
  choice: sua santa
  rationale: A expressão literal “morada de sua santidade” é vertida naturalmente como “sua santa morada”, preservando o sufixo possessivo e a noção de santidade.
theological_decisions:
- issue: Se דַיַּן deve receber sentido explicitamente protetor
  choice: juiz das viúvas
  alternative: defensor das viúvas
  rationale: O contexto associa o julgamento divino à justiça em favor dos vulneráveis, mas o valor lexical é judicial. “Juiz” preserva a imagem e a tensão do texto sem transformar a implicação protetora em significado explícito.
- issue: Se בִּמְעוֹן קָדְשׁוֹ indica localização ou origem da ação
  choice: em sua santa morada
  alternative: desde a sua santa morada
  rationale: A preposição hebraica expressa literalmente localização, “em”. A leitura “desde” torna explícito um ponto de partida possível, mas vai além da forma simples do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem predicativa foi mantida para conservar o paralelismo poético e fazer de “Deus” o sujeito culminante da oração nominal. “Os que não têm pai” privilegia a precisão do hebraico; as alternativas interpretativas são preservadas em notas.
