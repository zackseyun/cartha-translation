  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: pt
  text: Do Egito virão nobres[a]; Cuxe se apressará a estender as mãos a Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “embaixadores” ou “príncipes”. O termo hebraico é raro e provavelmente se refere a pessoas de destaque vindas do Egito.
    reason: lexical_alternative
  - marker: b
    text: 'Lit.: “Cuxe se apressará a estender as mãos dele a Deus”. O hebraico emprega um sufixo masculino singular, apresentando a nação como uma pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: virão
  rationale: O Qal imperfeito, terceira pessoa masculina plural, de אתה/אתי indica mais naturalmente vir ou chegar; evita-se acrescentar a ideia de trazer tributo, que não está expressa no verbo.
- source_word: חַשְׁמַנִּים
  choice: nobres
  rationale: O substantivo raro parece designar pessoas de destaque. “Nobres” preserva a posição elevada sem especificar indevidamente uma função diplomática; “embaixadores” e “príncipes” continuam possíveis.
- source_word: מִנִּי מִצְרָיִם
  choice: do Egito
  rationale: A expressão indica claramente origem ou procedência, para a qual “do Egito” é natural em português.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Mantém o topônimo hebraico em sua forma portuguesa corrente, sem identificá-lo diretamente com uma entidade geográfica posterior como a Etiópia.
- source_word: תָּרִיץ
  choice: se apressará a estender
  rationale: O Hifil de רוץ comunica pressa ou movimento rápido. Com “mãos” como objeto, a formulação expressa naturalmente a urgência do gesto sem traduzir mecanicamente “fazer correr”.
- source_word: יָדָיו
  choice: as mãos
  rationale: O sufixo é masculino singular e concorda com Cuxe como nação personificada. Em português, omitir o possessivo evita o pouco natural “suas mãos” sem apagar a personificação; a nota registra a forma singular.
- source_word: לֵאלֹהִים
  choice: para Deus
  rationale: A preposição indica direção. “Para Deus” transmite com naturalidade o gesto dirigido a Deus, sem decidir se se trata especificamente de oração, súplica, adoração ou submissão.
theological_decisions:
- issue: Sentido de Cuxe estender as mãos para Deus
  choice: Manter um gesto dirigido a Deus que pode indicar submissão, súplica, oração ou adoração, sem especificar uma dessas possibilidades.
  alternative: Entender o gesto exclusivamente como entrega diplomática de tributo ou como declaração explícita de plena inclusão pactual.
  rationale: A imagem aponta para Cuxe voltando-se para Deus, mas o verso não define com precisão a natureza do gesto. A tradução conserva essa abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Do Egito virão” preserva a ênfase na procedência. “Cuxe” segue a forma portuguesa do topônimo bíblico. As notas mantêm visíveis a raridade de חַשְׁמַנִּים e a personificação singular de Cuxe.
