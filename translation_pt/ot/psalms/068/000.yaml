lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa provavelmente quem dirigia a execução musical. “Ao regente” é conciso, natural e preserva o contexto litúrgico-musical sem limitar a função à direção de um coro.
- source_word: לְדָוִד
  choice: De Davi
  rationale: A preposição hebraica לְ nos títulos pode indicar autoria, pertença, dedicação ou associação. “De Davi” mantém essa amplitude melhor que a formulação mais específica “Por Davi”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação tradicional e natural para uma composição poético-musical, sem especificar além do que o hebraico permite.
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz diretamente a segunda designação de gênero e mantém a justaposição hebraica entre “salmo” e “cântico”, em vez de fundi-las.
