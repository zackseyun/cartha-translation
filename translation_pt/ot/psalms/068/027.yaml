  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: pt
  text: Ali está o pequeno Benjamim, à frente deles[a]; os príncipes de Judá, em sua multidão[b]; os príncipes de Zebulom; os príncipes de Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governando-os” ou “dominando sobre eles”. O particípio hebraico pode indicar governo ou precedência; neste contexto, o texto principal o entende como liderança na procissão.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua comitiva”, “em seu agrupamento” ou “em sua turba”. O termo hebraico é raro, e sua nuance exata é incerta, mas indica um grupo reunido que acompanha Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali está
  rationale: O advérbio dêitico significa “ali/lá”. A forma “Ali está” introduz naturalmente, em português, os grupos presentes na procissão.
- source_word: בִּנְיָמִן צָעִיר
  choice: o pequeno Benjamim
  rationale: צָעִיר pode significar “pequeno”, “jovem” ou “menor”. No contexto tribal, “pequeno” preserva tanto a concisão poética quanto a provável referência à dimensão ou posição de Benjamim.
- source_word: רֹדֵם
  choice: à frente deles
  rationale: O particípio com sufixo plural pode expressar governo, domínio ou precedência. No cenário de uma procissão, “à frente deles” comunica liderança sem impor uma leitura estritamente política.
- source_word: שָׂרֵי
  choice: os príncipes de
  rationale: שַׂר designa autoridades, chefes ou príncipes. “Príncipes” mantém o tom elevado e a posição social indicada pelo hebraico.
- source_word: רִגְמָתָם
  choice: em sua multidão
  rationale: O termo é raro e de sentido exato incerto, mas parece indicar um agrupamento, massa ou comitiva. “Em sua multidão” preserva essa noção coletiva sem especificá-la além da evidência.
- source_word: יְהוּדָה / זְבֻלוּן / נַפְתָּלִי
  choice: Judá / Zebulom / Naftali
  rationale: Formas convencionais dos nomes tribais em português.
