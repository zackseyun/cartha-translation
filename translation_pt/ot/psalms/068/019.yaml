  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: pt
  text: Bendito seja o Senhor, que dia após dia nos sustenta[a] — Deus é a nossa salvação. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dia após dia carrega a nossa carga”; tradicionalmente: “dia após dia nos cumula de benefícios”. O verbo hebraico pode se referir a pôr uma carga ou a carregá-la, e o objeto não está expresso.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a fórmula doxológica hebraica em português natural e solene.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino de modo tradicional, claro e natural em português.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: Reproduz o valor distributivo da repetição hebraica com uma expressão corrente em português.
- source_word: יַעֲמָס לָנוּ
  choice: nos sustenta
  rationale: O verbo עמס pertence ao campo de carregar ou levar uma carga; como o objeto está implícito e a construção é comprimida, 'nos sustenta' comunica a ação contínua de Deus sem acrescentar os 'benefícios' da interpretação tradicional.
- source_word: הָאֵל
  choice: Deus
  rationale: É a forma portuguesa natural para a designação divina אֵל neste contexto.
- source_word: יְשׁוּעָתֵנוּ
  choice: a nossa salvação
  rationale: Mantém a amplitude de sentido de salvação, livramento e auxílio salvador.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, pois a função exata do termo é incerta.
theological_decisions:
- issue: Sentido da oração comprimida יַעֲמָס לָנוּ
  choice: Deus nos sustenta continuamente.
  alternative: Deus carrega diariamente a nossa carga; ou Deus nos cumula de benefícios.
  rationale: O verbo denota carregar ou pôr uma carga, mas o objeto não está expresso. 'Nos sustenta' preserva a imagem do auxílio divino sem introduzir um objeto ausente; a ambiguidade genuína fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição hebraica foi preservada idiomaticamente, e a ambiguidade lexical central foi mantida por meio de nota.
