  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: pt
  text: Dos teus santuários, Deus é temível; o Deus de Israel — ele dá força e grande poder ao povo[a]. Bendito seja Deus!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do teu santuário» ou «em teu santuário». O hebraico traz «dos teus santuários», uma forma plural que pode referir-se à santa morada de Deus em sentido majestático ou coletivo.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: temível
  rationale: Expressa que Deus inspira assombro e temor reverente, sem reduzir o termo a mero medo nem recorrer a uma formulação coloquial.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa o único Deus de Israel.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: desde os teus santuários
  rationale: Mantém a preposição de origem, o sufixo de segunda pessoa e o plural morfológico do hebraico. A possível leitura idiomática no singular ou com sentido locativo é registrada em nota.
- source_word: אֵל יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Trata a expressão como aposição nominal que identifica o Deus mencionado.
- source_word: הוּא
  choice: ele
  rationale: Preserva o pronome explícito e sua ênfase discreta.
- source_word: נֹתֵן
  choice: dá
  rationale: O particípio descreve uma ação característica; o presente simples é natural em português.
- source_word: עֹז
  choice: força
  rationale: Representa o sentido comum de vigor ou força e permanece distinto do substantivo seguinte.
- source_word: וְתַעֲצֻמוֹת
  choice: e poderio
  rationale: “Poderio” comunica grande poder e preserva a intensificação sem repetir simplesmente “força” ou “poder”.
- source_word: לָעָם
  choice: ao povo
  rationale: Não acrescenta o possessivo “seu”, ausente no hebraico, embora o contexto possa indicar Israel.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Reproduz de modo natural e solene a fórmula doxológica hebraica.
theological_decisions:
- issue: Número e sentido de “santuários”
  choice: desde os teus santuários
  alternative: do teu santuário; em teu santuário
  rationale: A forma massorética é plural e vem precedida por מִן, normalmente indicativo de origem. Como o plural pode ter sentido coletivo ou majestático, e a preposição pode ser entendida de modo locativo neste contexto, as alternativas legítimas são mantidas em nota sem normalizar o texto principal.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. “Temível” conserva a união de majestade e temor reverente; “poderio” distingue os dois termos hebraicos ligados à força. A construção menos comum “desde os teus santuários” foi mantida para preservar a ambiguidade real do texto-fonte, esclarecida em nota.
