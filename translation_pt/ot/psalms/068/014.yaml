source:
  edition: WLC
  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: pt
  text: 'Quando o Todo-Poderoso dispersou reis ali,

    nevou no Zalmom.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: Quando ... dispersou
  rationale: O infinitivo com בְּ exprime aqui uma circunstância temporal; “dispersou” comunica naturalmente o sentido de espalhar ou pôr em fuga.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução tradicional e amplamente inteligível do título divino Shaddai, sem tentar resolver sua etimologia incerta.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente direto do substantivo plural hebraico.
- source_word: בָּהּ
  choice: ali
  rationale: O pronome feminino singular pode remeter a um lugar ou realidade mencionada no contexto; “ali” preserva a referência contextual sem explicitação indevida.
- source_word: תַּשְׁלֵג
  choice: nevou
  rationale: A forma verbal admite leitura impessoal, “nevou”, apropriada ao paralelismo e preservada pela tradição textual.
- source_word: בְּצַלְמוֹן
  choice: no Zalmom
  rationale: Mantém Zalmom como nome geográfico e traduz a preposição locativa בְּ por “no”.
theological_decisions:
- issue: Agente da dispersão dos reis
  choice: O Todo-Poderoso é apresentado como aquele que dispersa os reis.
  alternative: Entender a forma verbal sem atribuir diretamente a ação a Deus.
  rationale: A sintaxe hebraica apresenta שַׁדַּי como sujeito natural de בְּפָרֵשׂ.
- issue: Sentido da neve em Zalmom
  choice: 'Preservar a afirmação literal e concisa: “nevou no Zalmom”.'
  alternative: Interpretar metaforicamente como despojos, ossos, brilho ou completa derrota.
  rationale: O verso é poético e obscuro; o hebraico não exige que a tradução resolva a imagem ou determine se se trata de evento meteorológico ou metáfora.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem foi levemente ajustada à sintaxe natural do português, mantendo o paralelismo em dois versos e a concisão enigmática do hebraico.
