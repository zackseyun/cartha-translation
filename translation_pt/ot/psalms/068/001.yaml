source:
  edition: WLC
  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: pt
  text: Deus se levanta; seus inimigos se dispersam[a], e os que o odeiam fogem de diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo a tradução optativa tradicional: “Que Deus se levante; que seus inimigos se dispersem, e que os que o odeiam fujam de diante dele.”'
    reason: Leitura alternativa da força dos imperfeitos hebraicos.
lexical_decisions:
- source_word: יָקוּם
  choice: se levanta
  rationale: O imperfeito qal de קום pode funcionar aqui como declaração vívida ou como desejo de valor jussivo. “Se levanta” conserva a imagem verbal e permite a leitura declarativa no texto principal sem apagar a alternativa optativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo está no singular e a referência é ao Deus de Israel; por isso, exige-se o singular “Deus”.
- source_word: יָפוּצוּ
  choice: se dispersam
  rationale: O imperfeito qal plural de פוץ descreve a dispersão dos inimigos. A construção pronominal é idiomática em português e expressa claramente o resultado sem tornar explícito um agente não expresso.
- source_word: אֹיְבָיו
  choice: seus inimigos
  rationale: Forma construta com sufixo de terceira pessoa masculina singular; a tradução possessiva é direta.
- source_word: וְיָנוּסוּ
  choice: e ... fogem
  rationale: O imperfeito qal plural de נוס é vertido por “fogem”, forma natural, atual e apropriada ao registro poético.
- source_word: מְשַׂנְאָיו
  choice: os que o odeiam
  rationale: O particípio substantivado com sufixo de terceira pessoa masculina singular preserva sua força verbal ativa em “os que o odeiam”.
- source_word: מִפָּנָיו
  choice: de diante dele
  rationale: A expressão significa literalmente “de diante de sua face/presença”. “De diante dele” mantém a imagem hebraica e comunica a retirada perante Deus em português compreensível.
theological_decisions:
- issue: Força verbal dos imperfeitos iniciais no contexto poético de teofania militar
  choice: 'Leitura declarativa vívida: “Deus se levanta; seus inimigos se dispersam...”'
  alternative: 'Leitura optativa/jussiva: “Que Deus se levante; que seus inimigos se dispersem, e que os que o odeiam fujam de diante dele.”'
  rationale: As formas hebraicas são imperfeitos e, neste contexto, podem ser entendidas como declaração vívida ou como oração/desejo. O texto principal adota a leitura declarativa, enquanto a nota preserva a leitura optativa tradicional, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De diante dele” conserva deliberadamente a imagem concreta do hebraico; a sintaxe paralela mantém o ritmo poético.
