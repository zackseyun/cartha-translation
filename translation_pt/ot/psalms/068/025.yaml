  text: קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים בְּ/ת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: pt
  text: À frente iam os cantores; atrás, os músicos, no meio das jovens que tocavam tamborins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: À frente iam
  rationale: Expressa de modo natural o avanço na dianteira da procissão, conforme o piel perfeito de קדם neste contexto.
- source_word: שָׁרִים
  choice: os cantores
  rationale: Deriva de שׁיר, “cantar”, e designa os cantores, em paralelo com os instrumentistas.
- source_word: אַחַר
  choice: atrás
  rationale: Indica a posição subsequente na procissão; “atrás” preserva aqui com clareza a relação espacial.
- source_word: נֹגְנִים
  choice: os músicos
  rationale: O termo deriva de נגן e se refere aos que tocam instrumentos; “músicos” é claro, atual e adequado ao paralelismo.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Mantém a imagem espacial do hebraico e situa as jovens dentro do cortejo.
- source_word: עֲלָמוֹת
  choice: jovens
  rationale: Designa mulheres jovens, provavelmente em idade de casar, sem necessariamente afirmar virgindade; “jovens” é natural e não especifica além do hebraico.
- source_word: תּוֹפֵפוֹת
  choice: que tocavam tamborins
  rationale: Reproduz a ação denominativa ligada a תֹּף; “tocavam tamborins” é mais idiomático em português do que “batiam tamborins” e conserva o sentido musical.
