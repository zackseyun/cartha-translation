base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: pt
  text: Subiste ao alto; levaste cativos; recebeste dádivas entre os seres humanos[a], até mesmo entre os rebeldes, para que Yah Deus habitasse ali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeste dádivas dos seres humanos”. A preposição hebraica pode indicar tanto o âmbito (“entre”) como a origem (“de”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que Yah Deus habitasse entre eles”; ou: “como habitação para Yah Deus”. A oração hebraica é compacta e admite mais de uma construção.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: Subiste às alturas
  rationale: Expressa naturalmente o movimento ascendente e o cenário elevado, mantendo o tom poético sem especificar demais o lugar.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: levaste cativos contigo
  rationale: A construção cognata hebraica descreve a marcha triunfal com cativos; esta formulação conserva a imagem e soa clara em português atual.
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: recebeste dádivas
  rationale: Embora לָקַחְתָּ costume significar 'tomaste', com מַתָּנוֹת o sentido contextual de receber presentes ou tributos é natural. 'Dádivas' preserva o registro poético.
- source_word: בָּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם pode designar a humanidade, e ב pode indicar esfera ('entre') ou origem ('de/da parte de'). O texto principal mantém a leitura de esfera, e a alternativa é registrada em nota.
- source_word: וְאַף סוֹרְרִים
  choice: até mesmo entre os rebeldes
  rationale: וְאַף acrescenta ênfase inclusiva, enquanto סוֹרְרִים designa os que resistem ou se rebelam.
- source_word: לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: para que Yah Deus habitasse ali
  rationale: O infinitivo com ל pode indicar finalidade ou resultado. 'Ali' explicita apenas o mínimo necessário para uma frase natural, sem decidir de modo rígido o referente elíptico.
theological_decisions:
- issue: Sentido da preposição em בָּאָדָם na expressão sobre as dádivas
  choice: entre os seres humanos
  alternative: dos seres humanos / da parte dos seres humanos
  rationale: A preposição hebraica permite mais de uma relação semântica. A tradução principal preserva a esfera humana, enquanto a nota mantém a possível ideia de origem, sem impor uma interpretação teológica.
- issue: Sintaxe e referente da oração final לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: para que Yah Deus habitasse ali
  alternative: para que Yah Deus habitasse entre eles / como habitação para Yah Deus
  rationale: A oração hebraica é compacta e elíptica. A leitura principal usa um advérbio espacial pouco específico, e a nota preserva construções alternativas plausíveis.
- issue: Representação de יָהּ אֱלֹהִים
  choice: Yah Deus
  alternative: Deus, Yah
  rationale: יָהּ é a forma abreviada do nome divino, não o tetragrama completo. A transliteração 'Yah' conserva essa distinção no texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. Emprega-se 'seres humanos' para o valor coletivo de אָדָם, 'dádivas' para conservar a elevação poética e 'Yah' para representar distintamente a forma abreviada do nome divino.
