  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: pt
  text: Reinos da terra, cantem a Deus; cantem louvores[a] ao Senhor—Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toquem música ao Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: Reinos da terra
  rationale: A construção plural abrange os domínios políticos de toda a terra; a formulação é direta, universal e natural em português.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: cantem a Deus
  rationale: O imperativo plural convoca os reinos a cantar, e a preposição לְ indica Deus como destinatário do cântico.
- source_word: זַמְּרוּ
  choice: cantem louvores
  rationale: O imperativo piel de זמר expressa louvor musical; “cantem louvores” preserva tanto o caráter musical quanto o contexto de adoração, sem excluir a alternativa instrumental.
- source_word: אֲדֹנָי
  choice: ao Senhor
  rationale: O texto traz o título divino Adonai, não o tetragrama; por isso, traduz-se como “Senhor”. A contração “ao” decorre da regência natural de “cantar louvores” em português.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo litúrgico ou musical permanece incerta, ele é transliterado, com acento para orientar a pronúncia em português.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: SENHOR
  rationale: אֲדֹנָי é um título, e não o nome divino יהוה. “Senhor” mantém essa distinção sem introduzir uma identificação gráfica indevida com o tetragrama.
- issue: Amplitude de זַמְּרוּ
  choice: cantem louvores
  alternative: toquem música
  rationale: O contexto favorece louvor musical, mas o verbo pode abranger execução instrumental. A tradução principal segue o paralelismo com “cantem”, e a nota conserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural (“cantem”), amplamente compreensíveis no Brasil e em outras variedades. O marcador da nota foi colocado após a expressão a que a alternativa lexical realmente se refere.
