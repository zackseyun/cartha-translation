translation:
  language: pt
  text: para que o teu pé os esmague em sangue[a], e a língua dos teus cães tenha dos inimigos a sua porção.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, sem explicitar o objeto: “o teu pé esmague em sangue”. O objeto “os” está implícito no hebraico e foi suprido com base no contexto.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica no fim do versículo é difícil e elíptica; literalmente, suas palavras finais podem ser entendidas como “dos inimigos, dele”.
    reason: textual_difficulty
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz propósito ou resultado e preserva de modo natural a força da expressão hebraica.
- source_word: תִּמְחַץ
  choice: esmague
  rationale: O verbo מחץ comunica um golpe destrutivo, ‘esmagar’ ou ‘despedaçar’. ‘Esmague’ mantém a imagem violenta e a transitividade do verbo; o objeto implícito foi expresso como ‘os’ pelo contexto.
- source_word: רַגְלְךָ
  choice: o teu pé
  rationale: Mantém o singular do hebraico e a imagem concreta do pé triunfante.
- source_word: בְּדָם
  choice: em sangue
  rationale: Conserva a construção preposicional e a imagem vívida sem definir além do necessário se o sangue é o meio ou o ambiente da ação.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: a língua dos teus cães
  rationale: Preserva o singular coletivo ‘língua’ e o plural ‘cães’, em formulação compreensível em português.
- source_word: מֵאֹיְבִים
  choice: dos inimigos
  rationale: A preposição מן indica a procedência daquilo que cabe aos cães; ‘dos inimigos’ preserva essa relação.
- source_word: מִנֵּהוּ
  choice: a sua porção
  rationale: A forma final é difícil e elíptica. A tradução contextual ‘a sua porção’ produz uma oração inteligível sem apagar a dificuldade, que é indicada em nota.
theological_decisions:
- issue: Imagens violentas de vitória e juízo
  choice: Manter as imagens concretas do pé em sangue e dos cães recebendo parte dos inimigos
  alternative: Abrandar o versículo para uma declaração genérica de vitória
  rationale: O hebraico emprega imagens deliberadamente fortes. A tradução conserva sua tensão e não as suaviza por preferência teológica ou sensibilidade moderna.
- issue: Objeto implícito de ‘esmague’
  choice: Explicitar ‘os’, referindo-se aos inimigos
  alternative: 'Deixar o verbo sem objeto: ‘o teu pé esmague em sangue’'
  rationale: O verbo é transitivo e o contexto fornece os inimigos como objeto implícito. A nota preserva a possibilidade de uma reprodução mais estrita da elipse.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa coerentes (‘teu’, ‘teus’). A ordem poética e as imagens concretas foram mantidas, enquanto a elipse final recebeu uma formulação mínima e inteligível, acompanhada de nota.
