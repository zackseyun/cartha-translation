  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: pt
  text: àquele que cavalga nos mais altos céus[a], que existem desde os tempos antigos — eis que ele faz ouvir a sua voz[b], uma voz poderosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nos céus dos céus de tempos antigos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele profere a sua voz, uma voz de força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: àquele que cavalga
  rationale: O לְ retoma o contexto imperativo do versículo anterior, e o particípio רֹכֵב descreve Deus de forma substantivada como aquele que cavalga.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: nos mais altos céus
  rationale: A cadeia construta, literalmente 'nos céus dos céus', tem força superlativa; esta formulação comunica o sentido com naturalidade em português.
- source_word: קֶדֶם
  choice: desde os tempos antigos
  rationale: Aqui o termo tem sentido temporal, indicando a antiguidade dos céus, e não o sentido espacial de 'leste'.
- source_word: הֵן
  choice: eis que
  rationale: Preserva a função enfática e de chamada de atenção da partícula hebraica em registro poético digno.
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: ele faz ressoar a sua voz
  rationale: A expressão hebraica significa literalmente 'dá com sua voz', mas idiomaticamente descreve o ato de emitir ou fazer ouvir a voz; 'faz ressoar' preserva a força da imagem.
- source_word: קוֹל עֹז
  choice: uma voz poderosa
  rationale: A expressão construta significa literalmente 'voz de força'; 'voz poderosa' é clara, natural e mantém sua intensidade.
theological_decisions:
- issue: Referente daquele que cavalga
  choice: O texto continua descrevendo o Deus de Israel em elevada linguagem poética, sem identificar um referente mais específico.
  alternative: Uma leitura tipológica posterior pode relacionar a imagem do cavaleiro divino ao Messias.
  rationale: O contexto hebraico imediato se refere a Deus; a tradução mantém esse referente sem inserir na linha principal uma identificação cristológica ou angélica posterior.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A formulação preserva o encadeamento com o versículo anterior, a imagem divina de cavalgar pelos céus e a antiguidade atribuída aos céus, sem resolver além do texto sua possível dimensão tipológica.
