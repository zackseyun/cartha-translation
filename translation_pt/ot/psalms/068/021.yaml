  naturalness: “Certamente Deus esmagará a cabeça de seus inimigos, o topo cabeludo daquele que anda em sua culpa” é mais fluente e poético em português moderno. “Anda” retém a metáfora hebraica de conduta habitual; o particípio já comunica continuidade, sem exigir “continua andando”.
