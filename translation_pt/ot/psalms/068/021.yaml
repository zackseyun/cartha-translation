source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: pt
  text: Certamente Deus esmagará a cabeça de seus inimigos, o topo cabeludo daquele que anda em sua culpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o crânio cabeludo daquele que persiste em seus delitos”.'
    reason: Alternativas lexicais para קָדְקֹד, מִתְהַלֵּךְ e בַּאֲשָׁמָיו.
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: A partícula tem aqui força asseverativa, expressando uma afirmação enfática, e não a ideia restritiva de “somente”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo está no singular e o referente é o Deus de Israel.
- source_word: יִמְחַץ
  choice: esmagará
  rationale: Preserva a imagem forte de destruição violenta e soa natural em português.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: Mantém a imagem corporal concreta e o paralelismo poético do hebraico.
- source_word: אֹיְבָיו
  choice: dos seus inimigos
  rationale: Reproduz o plural e o sufixo masculino singular, cujo antecedente mais natural no contexto imediato é Deus.
- source_word: קָדְקֹד שֵׂעָר
  choice: o alto da cabeça cabeluda
  rationale: קָדְקֹד designa o topo ou alto da cabeça, e שֵׂעָר o caracteriza como coberto de cabelo. A formulação evita o sentido régio que “coroa” poderia sugerir em português.
- source_word: מִתְהַלֵּךְ
  choice: daquele que continua andando
  rationale: O particípio hitpael sugere conduta contínua ou habitual; “continua andando” conserva a metáfora ética de caminhar sem reduzi-la simplesmente a “viver”.
- source_word: בַּאֲשָׁמָיו
  choice: em sua culpa
  rationale: Mantém a formulação compacta e a amplitude lexical do hebraico, que pode indicar culpa, delito ou atos culpáveis.
theological_decisions:
- issue: Referente do sufixo em אֹיְבָיו (“seus inimigos”)
  choice: O pronome refere-se mais naturalmente a Deus.
  alternative: Pode ser entendido de maneira mais geral como referência aos inimigos do rei divino ou do povo de Deus.
  rationale: Deus é o sujeito explícito da oração e o antecedente singular imediato; a tradução não acrescenta um referente messiânico ou nacional não expresso no versículo.
- issue: Sentido de בַּאֲשָׁמָיו
  choice: “em sua culpa”
  alternative: “em seus delitos” ou “em seus atos culpáveis”
  rationale: A opção preserva a ambiguidade entre o estado de culpa e as transgressões pelas quais a pessoa é culpada, sem transformar o substantivo em uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A imagem violenta e o paralelismo corporal foram preservados. O marcador [a] aparece no texto principal e esclarece alternativas reais sem resolver indevidamente a ambiguidade hebraica.
