  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: pt
  text: A terra tremeu; até os céus gotejaram diante de Deus — este Sinai — diante de Deus, o Deus de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: tremeu
  rationale: Expressa de modo natural e direto o abalo da terra indicado pelo verbo hebraico.
- source_word: נָטְפוּ
  choice: gotejaram
  rationale: Preserva a imagem concreta do hebraico, que descreve os céus como gotejando, sem explicitar chuva no texto principal.
- source_word: זֶה סִינַי
  choice: este Sinai
  rationale: Mantém a formulação abrupta e enfática do hebraico e sua ambiguidade sintática, sem acrescentar 'o próprio' ou um verbo ausente.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Reproduz a ideia da presença ou face de Deus e funciona naturalmente nas duas ocorrências.
theological_decisions:
- issue: Relação sintática de זֶה סִינַי com a descrição precedente
  choice: este Sinai
  alternative: o próprio Sinai / no Sinai
  rationale: A construção hebraica é comprimida e admite diferentes entendimentos. A tradução literal preserva essa tensão, sem transformar Sinai inequivocamente em sujeito nem em indicação de lugar.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo e ordem próximos do hebraico. O travessão conserva a interrupção enfática de 'este Sinai'.
