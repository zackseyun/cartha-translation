base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: pt
  text: Como a fumaça é dispersada, assim tu os dispersas[a]; como a cera se derrete diante do fogo[b][c], assim os ímpios perecem diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim tu a dispersas”, referindo-se à fumaça. O hebraico não expressa o objeto; o verbo também pode significar afastar, espalhar ou soprar para longe.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante do fogo” e “de diante de Deus”; a expressão pode indicar tanto a presença quanto a causa do que acontece.
    reason: lexical_alternative
  - marker: c
    text: Os verbos hebraicos também podem ser entendidos como futuros (“dispersarás... perecerão”) ou, no contexto, como um desejo (“que disperses... que pereçam”).
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Como a fumaça é dispersada
  rationale: A preposição כ introduz a comparação, e o infinitivo de נדף descreve a fumaça sendo impelida, espalhada ou dissipada. “É dispersada” preserva a imagem e o vínculo lexical com o verbo seguinte.
- source_word: תִּנְדֹּף
  choice: assim tu os dispersas
  rationale: O imperfeito qal na segunda pessoa masculina singular dirige-se a Deus. O objeto plural, não expresso no hebraico, é recuperado do contexto anterior e do paralelo “os ímpios”; “dispersas” mantém a repetição da raiz נדף.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: como a cera se derrete
  rationale: כ com o infinitivo construto introduz outra comparação. A formulação finita é natural em português e conserva a imagem literal.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: diante do fogo
  rationale: מִפְּנֵי significa literalmente “de diante da face/presença de” e, neste contexto, indica a exposição ao fogo e sua ação. “Diante do fogo” preserva o paralelismo com “diante de Deus”.
- source_word: יֹאבְדוּ
  choice: perecem
  rationale: O qal imperfeito de אבד pode significar perecer, desaparecer ou ser destruído. “Perecem” conserva a força poética sem especificar indevidamente o modo.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: O substantivo adjetival designa pessoas moralmente perversas ou culpadas. “Os ímpios” é conciso, corrente no registro bíblico e mantém a categoria moral.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: A expressão pode indicar afastamento da presença ou efeito causado por ela. “Diante de Deus” conserva a imagem espacial e a ambiguidade causal.
theological_decisions:
- issue: Valor dos verbos no imperfeito em contexto poético
  choice: 'Presente de valor vívido ou geral: “dispersas ... perecem”'
  alternative: Futuro (“dispersarás ... perecerão”) ou desejo de teor jussivo (“que disperses ... que pereçam”)
  rationale: Os imperfeitos hebraicos admitem valor futuro, habitual ou modal. O presente preserva a comparação vívida sem decidir de modo excessivo entre previsão e imprecação.
- issue: Objeto não expresso de תִּנְדֹּף
  choice: “os”, referindo-se aos adversários/ímpios
  alternative: “a”, referindo-se à fumaça
  rationale: O hebraico não explicita o objeto. A referência plural antecipa o paralelo com “os ímpios”, embora a referência singular à fumaça também seja gramaticalmente possível; a ambiguidade é indicada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. O tratamento “tu” mantém a segunda pessoa singular explícita do hebraico e é amplamente reconhecível no registro bíblico. As repetições “dispersada/dispersas” e “diante... diante” reproduzem correspondências formais relevantes do original.
