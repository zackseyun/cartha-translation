  text: וְֽ/צַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִ/פְנֵ֥י אֱלֹהִ֗ים וְ/יָשִׂ֥ישׂוּ בְ/שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: pt
  text: Mas os justos se alegrarão[a]; exultarão diante de Deus[b] e se regozijarão com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os justos se alegrarão”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “mas” no texto expressa o contraste com o versículo anterior.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “diante de Deus”, isto é, na presença de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Mas os justos
  rationale: צַדִּיקִים designa pessoas justas. A conjunção וְ pode significar simplesmente “e”, mas “mas” expressa naturalmente o contraste discursivo com o destino dos perversos no versículo anterior.
- source_word: יִשְׂמְחוּ
  choice: se alegrarão
  rationale: שׂמח expressa alegria. “Se alegrarão” é claro e natural em português e inicia a sequência enfática de termos de júbilo.
- source_word: יַעַלְצוּ
  choice: exultarão
  rationale: עלץ indica alegria intensa e jubilosa; “exultarão” preserva essa força e distingue o verbo dos demais termos de alegria.
- source_word: לִפְנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: A expressão significa literalmente “diante da face de Deus” e, por extensão, “na presença de Deus”. “Diante de Deus” é conciso, idiomático e mantém a imagem hebraica.
- source_word: וְיָשִׂישׂוּ
  choice: e transbordarão de alegria
  rationale: שׂוש denota regozijo intenso. A formulação evita uma repetição pouco expressiva de “alegrar-se” e comunica em português corrente a intensidade acumulativa do hebraico.
- source_word: בְשִׂמְחָה
  choice: de alegria
  rationale: שִׂמְחָה especifica ou intensifica o modo do regozijo. Integrada à expressão “transbordarão de alegria”, conserva a ênfase do acúmulo hebraico de palavras de júbilo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A sequência “se alegrarão; exultarão... e transbordarão de alegria” procura preservar a acumulação enfática de três expressões hebraicas de júbilo sem soar mecanicamente repetitiva.
