  text: הַר אֱ֭לֹהִים הַר בָּשָׁ֑ן הַ֥ר גַּ֝בְנֻנִּ֗ים הַר בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: pt
  text: Um monte de Deus é o monte de Basã[a]; um monte de picos[b] é o monte de Basã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um monte poderoso” ou “um monte majestoso”; em hebraico, “monte de Deus” pode funcionar como superlativo idiomático.
    reason: alternative_reading
  - marker: b
    text: O raro termo hebraico traduzido como “picos” também pode sugerir um monte acidentado ou cheio de elevações arredondadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: monte
  rationale: É o sentido comum do substantivo neste contexto. A repetição foi mantida para preservar a estrutura enfática e poética do hebraico.
- source_word: אֱלֹהִים
  choice: de Deus
  rationale: A construção hebraica הַר אֱלֹהִים admite naturalmente a tradução formal “monte de Deus”. A possível função superlativa é registrada em nota, sem eliminar a ressonância teológica da expressão.
- source_word: בָּשָׁן
  choice: Basã
  rationale: Nome geográfico vertido segundo sua forma tradicional e amplamente reconhecível em português bíblico.
- source_word: גַּבְנֻנִּים
  choice: picos
  rationale: O termo raro, no plural, parece descrever saliências ou cumes do monte. “Picos” comunica com clareza essa característica topográfica sem acrescentar explicitamente a ideia de quantidade.
theological_decisions:
- issue: Se הַר אֱלֹהִים deve ser traduzido formalmente ou como superlativo idiomático
  choice: “monte de Deus” no texto principal
  alternative: “monte poderoso” ou “monte majestoso”
  rationale: A tradução formal preserva tanto a construção hebraica quanto sua força poético-teológica; a leitura superlativa plausível é mantida em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com a repetição poética do original preservada. Os marcadores foram posicionados junto às expressões a que cada nota se refere.
