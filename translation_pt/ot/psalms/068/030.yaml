id: PSA.68.30
reference: Psalms 68:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: pt
  text: Repreende a fera dos juncos[a], a manada de touros entre os bezerros dos povos, que pisoteia pedaços de prata[b]. Dispersa os povos que se deleitam em guerras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fera selvagem dos juncos”; possivelmente uma referência figurada ao Egito ou a outro poder hostil.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta expressão é difícil. Também pode significar “que se submete com pedaços de prata” ou “que se prostra com barras de prata”, isto é, oferecendo tributo.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Repreende
  rationale: O imperativo de גער expressa uma repreensão divina enérgica, capaz de subjugar poderes hostis, sem implicar necessariamente sua destruição.
- source_word: חַיַּת קָנֶה
  choice: a fera dos juncos
  rationale: Mantém a imagem literal e ambígua de um animal perigoso ligado aos juncos ou pântanos, sem identificar explicitamente a figura com o Egito ou outro poder.
- source_word: עֲדַת אַבִּירִים
  choice: a manada de touros
  rationale: Embora עֲדָה possa significar assembleia, o contexto animal e o uso de אַבִּירִים para animais fortes favorecem a imagem de uma manada de touros.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: entre os bezerros dos povos
  rationale: Entende ב em sentido local ou associativo e conserva a metáfora bovina, provavelmente aplicada a governantes ou povos subordinados.
- source_word: מִתְרַפֵּס
  choice: que pisoteia
  rationale: Adota no texto principal a leitura de ação hostil, coerente com as imagens de animais poderosos e com os povos que desejam guerras; a leitura de submissão é preservada em nota.
- source_word: בְּרַצֵּי כָסֶף
  choice: pedaços de prata
  rationale: רַצֵּי é obscuro e pode indicar pedaços, fragmentos, barras ou lingotes; a expressão escolhida evita especificação excessiva.
- source_word: בִּזַּר
  choice: Dispersa
  rationale: Embora a forma esteja vocalizada como perfeito, o paralelismo poético com o imperativo inicial permite entendê-la como continuação da súplica.
- source_word: עַמִּים
  choice: os povos
  rationale: Traduz diretamente o plural עַמִּים sem restringi-lo à noção política moderna de nações.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: que se deleitam em guerras
  rationale: Expressa a preferência contínua pela guerra e conserva a força moral do verbo חפץ.
theological_decisions:
- issue: Identificação da “fera dos juncos”
  choice: Manter a metáfora sem identificar o poder histórico no texto principal
  alternative: Identificá-la especificamente com o Egito ou, de modo genérico, com um império hostil
  rationale: A ambientação entre juncos pode sugerir o Egito, mas o hebraico não o nomeia; conservar a imagem evita tornar explícita uma identificação apenas provável.
- issue: Sentido de מִתְרַפֵּס
  choice: 'Entender como ação hostil: “que pisoteia”'
  alternative: Entender como submissão ou prostração mediante prata oferecida como tributo
  rationale: O contexto imediato favorece uma descrição de inimigos violentos, mas a forma hebraica é difícil e a leitura ligada à submissão e ao tributo continua plausível, sendo registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. As imagens animais e a ambiguidade histórica e lexical do hebraico foram preservadas, com alternativas relevantes em notas.
