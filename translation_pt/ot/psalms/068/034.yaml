id: PSA.68.34
reference: Psalms 68:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: pt
  text: Atribuam força a Deus[a]; sua majestade está sobre Israel, e sua força está nos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Deem força a Deus”. O hebraico diz literalmente “deem”, usado aqui como chamado para reconhecer ou atribuir a Deus a força.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas nuvens” ou “nas alturas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Atribuam
  rationale: Embora נתן signifique literalmente “dar”, nesta exortação poética com “força” como objeto o sentido é reconhecer ou atribuir a Deus a força que lhe pertence.
- source_word: עֹז
  choice: força
  rationale: O substantivo denota força ou poder; “força” é claro e preserva a repetição poética do verso.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição ל marca o destinatário da exortação; “a Deus” é a formulação natural em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com גַּאֲוָתוֹ, a preposição עַל indica mais naturalmente extensão ou soberania sobre Israel, sem eliminar outras nuances possíveis.
- source_word: גַּאֲוָתוֹ
  choice: sua majestade
  rationale: No contexto de louvor a Deus, גאוה tem sentido positivo de exaltação ou majestade, não de orgulho censurável.
- source_word: וְעֻזּוֹ
  choice: e sua força
  rationale: Repete-se “força” para conservar a ligação lexical e poética com עֹז na primeira oração.
- source_word: בַּשְּׁחָקִים
  choice: nos céus
  rationale: שׁחקים designa poeticamente as alturas celestes e também pode evocar nuvens; “nos céus” é natural, digno e mantém a imagem cósmica.
theological_decisions:
- issue: Se o imperativo sugere que os seres humanos literalmente dão força a Deus
  choice: Traduzir o idioma como “Atribuam força a Deus”
  alternative: “Deem força a Deus”
  rationale: A exortação convoca os adoradores a reconhecer a força de Deus, não a suprir nele uma carência. A formulação escolhida evita essa inferência sem apagar o sentido literal do hebraico, registrado em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Atribuam” preserva o tom coletivo da exortação; a repetição de “força” mantém o paralelismo poético. Todos os marcadores de nota constam no texto principal.
