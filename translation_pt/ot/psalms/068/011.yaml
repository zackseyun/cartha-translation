source:
  edition: WLC
  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: pt
  text: O Senhor dá a palavra[a]; as mulheres que anunciam as boas-novas[b] são uma grande multidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem” ou “a ordem”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega um particípio feminino plural: “as mulheres que trazem boas notícias” ou “as anunciadoras”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “um grande exército” ou “uma grande companhia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: O termo é um título divino; “O Senhor” é sua forma natural e consagrada em português, sem tratá-lo como se fosse o nome divino יהוה.
- source_word: יִתֶּן
  choice: dá
  rationale: O imperfeito hebraico pode assumir valor presente, futuro ou modal. Neste enunciado poético, o presente expressa de modo natural a ação proclamada, sem excluir por si só outras nuances contextuais.
- source_word: אֹמֶר
  choice: a palavra
  rationale: O substantivo pode designar palavra, mensagem, pronunciamento ou ordem. “A palavra” preserva a concisão e a amplitude do hebraico; alternativas relevantes são registradas em nota.
- source_word: הַמְבַשְּׂרוֹת
  choice: as mulheres que anunciam as boas-novas
  rationale: O particípio está explicitamente no feminino plural e deriva do verbo que significa anunciar ou trazer boas notícias. A tradução conserva tanto o gênero marcado quanto a ideia de boas-novas.
- source_word: צָבָא רָב
  choice: uma grande multidão
  rationale: צָבָא pode indicar exército, hoste ou um grande contingente organizado, e רָב ressalta sua magnitude. “Uma grande multidão” é claro e atual em português, enquanto a possível imagem militar permanece em nota.
theological_decisions:
- issue: Gênero do particípio הַמְבַשְּׂרוֹת
  choice: 'Explicitar o feminino: “as mulheres que anunciam as boas-novas”'
  alternative: “os mensageiros” ou “os que anunciam”
  rationale: A forma hebraica é feminina plural. Preservá-la reproduz uma característica lexical e literária do texto sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Evitou-se “hoste” no texto principal por ser menos corrente, embora seu sentido coletivo e possivelmente militar esteja representado pela nota.
