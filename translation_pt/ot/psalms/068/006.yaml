source:
  edition: WLC
  text: אֱלֹהִ֤ים מ֘וֹשִׁ֤יב יְחִידִ֨ים בַּ֗יְתָ/ה מוֹצִ֣יא אֲ֭סִירִים בַּ/כּוֹשָׁר֑וֹת אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: pt
  text: Deus dá aos solitários um lar; liberta os prisioneiros para a prosperidade[a], mas os rebeldes habitam numa terra ressequida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a abundância”; o raro termo hebraico também é entendido por alguns como “com cânticos” ou como outra expressão de libertação jubilosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Designa aqui o Deus de Israel; os particípios no singular confirmam o sentido singular.
- source_word: מוֹשִׁיב
  choice: dá ... um lar
  rationale: O particípio hifil de ישׁב expressa fazer habitar ou estabelecer. A formulação comunica naturalmente em português a ação causativa sem reduzir o sentido a mera localização.
- source_word: יְחִידִים
  choice: aos solitários
  rationale: Refere-se aos que estão sós ou isolados; “solitários” preserva o sentido sem o limitar ao sentimento subjetivo de solidão.
- source_word: בַּיְתָה
  choice: um lar
  rationale: בַּיִת pode indicar casa ou unidade doméstica. “Lar” mantém a imagem de moradia e acolhimento sem especificar necessariamente uma família biológica.
- source_word: מוֹצִיא
  choice: liberta
  rationale: O hifil de יצא significa fazer sair. No contexto de prisioneiros, “liberta” exprime com clareza o resultado contextual, embora o valor literal seja “faz sair”.
- source_word: אֲסִירִים
  choice: os prisioneiros
  rationale: Denota pessoas presas ou acorrentadas; “prisioneiros” é a equivalência moderna mais direta.
- source_word: בַּכּוֹשָׁרוֹת
  choice: para a prosperidade
  rationale: O termo raro e difícil é frequentemente associado a êxito, bem-estar ou abundância. A nota preserva outras interpretações plausíveis.
- source_word: אַךְ
  choice: mas
  rationale: Marca o forte contraste entre a ação benéfica de Deus e a condição dos rebeldes.
- source_word: סוֹרֲרִים
  choice: os rebeldes
  rationale: O particípio de סרר designa os que resistem obstinadamente ou se rebelam.
- source_word: שָׁכְנוּ
  choice: habitam
  rationale: O perfeito qal de שכן tem aqui valor geral ou proverbial; o presente é natural em português.
- source_word: צְחִיחָה
  choice: numa terra ressequida
  rationale: O substantivo denota secura ou lugar árido; “terra ressequida” torna clara a imagem poética.
theological_decisions:
- issue: Sentido da ação de Deus para com os solitários
  choice: Deus proporciona aos isolados um lar e pertencimento.
  alternative: Deus coloca pessoas solitárias em famílias.
  rationale: O hebraico menciona os solitários e uma casa ou lar. A tradução evita restringir בַּיִת à família biológica e mantém aberta a amplitude de casa, lar ou unidade doméstica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e o contraste poético foram preservados; a incerteza lexical de בַּכּוֹשָׁרוֹת foi explicitada em nota.
