id: PSA.7.6
reference: Psalms 7:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: pt
  text: Levanta-te, Yahweh, na tua ira; ergue-te[a] contra os acessos de fúria dos meus inimigos; desperta por mim[b]; ordenaste o juízo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sê exaltado”. O verbo hebraico também pode expressar exaltação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “desperta para mim”, isto é, em meu favor.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “desperta por mim para o juízo que ordenaste”. A relação sintática da expressão final com o imperativo anterior é ambígua.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: Imperativo de קום dirigido a Deus. Preserva a imagem poética de Deus se levantando para agir e soa natural em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאַפֶּךָ
  choice: na tua ira
  rationale: אַף significa literalmente nariz e, por extensão idiomática, ira. O contexto exige o sentido figurado.
- source_word: הִנָּשֵׂא
  choice: ergue-te
  rationale: O imperativo nifal de נשׂא dá continuidade ao apelo para que Deus intervenha. A forma reflexiva portuguesa preserva o movimento figurado, sem excluir a possível ideia de exaltação.
- source_word: בְּעַבְרוֹת
  choice: contra os acessos de fúria
  rationale: O plural de עֶבְרָה sugere manifestações ou arroubos intensos de furor. Neste contexto hostil, ב é entendido em sentido adversativo, e “acessos de fúria” preserva o plural com naturalidade.
- source_word: צוֹרְרָי
  choice: dos meus inimigos
  rationale: Particípio substantivado de צרר, designando os que tratam o salmista com hostilidade; “inimigos” é claro e corrente.
- source_word: וְעוּרָה
  choice: desperta
  rationale: Mantém a vívida linguagem antropomórfica do imperativo de עור sem reduzi-la à paráfrase “age” ou “intervém”.
- source_word: אֵלַי
  choice: por mim
  rationale: 'Embora אֵלַי possa ser vertido literalmente por “para mim”, no apelo judicial seu valor pode ser benefactivo: agir em favor do salmista.'
- source_word: מִשְׁפָּט
  choice: juízo
  rationale: Designa ação ou decisão judicial. “Juízo” preserva o cenário forense e o vínculo com o verbo seguinte.
- source_word: צִוִּיתָ
  choice: ordenaste
  rationale: Verte diretamente o sentido habitual de צוה e evita decidir de antemão entre uma ordem específica e o estabelecimento divino do juízo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome pessoal divino. A transliteração o preserva sem substituí-lo por um título.
- issue: Imperativos antropomórficos dirigidos a Deus
  choice: Preservar “Levanta-te... ergue-te... desperta”
  alternative: Parafrasear como “age” ou “intervém”
  rationale: A sequência constitui a retórica poética da oração. Mantê-la não afirma que Deus esteja literalmente deitado ou adormecido.
- issue: Relação sintática da oração final
  choice: “ordenaste o juízo” como oração independente
  alternative: “desperta para o juízo que ordenaste”
  rationale: O hebraico permite relacionar מִשְׁפָּט צִוִּיתָ mais estreitamente com o imperativo anterior. A pontuação escolhida segue a leitura como afirmação independente, enquanto a nota conserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com a linguagem poética dos salmos. A sequência de imperativos e o paralelismo hebraico foram preservados; “acessos de fúria” comunica o plural intensivo sem recorrer a expressão arcaica.
