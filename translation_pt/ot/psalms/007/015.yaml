base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/015.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: pt
  text: Ele cavou uma cova e a aprofundou[a], e caiu no buraco que fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele cavou uma cova e a escavou, e caiu na cova que fez».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹר
  choice: cova
  rationale: בּוֹר pode designar uma cova ou cisterna; neste contexto de armadilha, «cova» comunica naturalmente a cavidade escavada sem especificar uma cisterna.
- source_word: כָּרָה
  choice: cavou
  rationale: O verbo significa diretamente «cavar», e esta escolha preserva a imagem concreta e a linguagem corrente.
- source_word: וַיַּחְפְּרֵהוּ
  choice: e a aprofundou
  rationale: חפר se sobrepõe a כרה no campo semântico de escavar; «a aprofundou» expressa a progressão da ação sem repetição pouco natural.
- source_word: וַיִּפֹּל
  choice: mas caiu
  rationale: 'Embora o waw narrativo possa ser vertido por «e», «mas» torna explícita em português a reviravolta irônica já presente na sequência: quem cavou a cova caiu nela.'
- source_word: שַׁחַת
  choice: buraco
  rationale: Aqui o termo se refere concretamente à cavidade que funciona como armadilha. «Buraco» distingue-o de בּוֹר sem abandonar a imagem física.
- source_word: יִפְעָל
  choice: fez
  rationale: פעל é um verbo amplo de fazer ou produzir; no contexto, «fez» é claro, idiomático e remete ao buraco resultante da escavação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva o paralelismo concreto e a ironia retributiva do hebraico; evita «cisterna», específico demais neste contexto. O pronome feminino em «a aprofundou» retoma «cova».
