  source_fidelity: A tradução identifica corretamente as armas e as flechas como preparadas pelo sujeito implícito (Deus, no contexto). Contudo, o uso de dois pretéritos perfeitos ('preparou ... fez') neutraliza a diferença entre o perfeito הֵכִין e o imperfeito יִפְעָל. Uma formulação com 'torna' reproduz melhor o segundo verbo como ação/apresentação em curso ou habitual.
  naturalness: '''Armas de morte'' é compreensível, mas pouco idiomático no português moderno. ''Armas mortais'' conserva a força letal do hebraico e soa mais natural. A ordem ''Para ele, preparou'' preserva a antecipação enfática do destinatário presente no hebraico sem sacrificar a fluência poética.'
  terminology: '''Flechas flamejantes'' é uma boa representação da leitura principal, isto é, flechas ardentes/incendiárias. A nota preserva adequadamente a alternativa lexical associada a ''perseguir'', sem a transformar em leitura principal.'
  issues:
