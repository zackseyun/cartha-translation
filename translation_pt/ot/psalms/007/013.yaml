  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: pt
  text: Para ele, preparou armas mortais; torna suas flechas flamejantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “torna suas flechas para os perseguidores” ou “contra os perseguidores”. O termo hebraico também pode ser entendido como derivado de um verbo que significa “perseguir”, em vez de “arder”; o texto principal segue a imagem militar usual de flechas incendiárias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: E para ele
  rationale: Preserva a preposição לְ com sufixo de terceira pessoa masculina singular. No contexto, o referente mais natural é o perverso contra quem Deus prepara as armas.
- source_word: הֵכִין
  choice: preparou
  rationale: O hifil de כון significa “preparar, deixar pronto”. O pretérito perfeito comunica de modo natural a ação concluída no paralelismo poético.
- source_word: כְּלֵי מָוֶת
  choice: armas de morte
  rationale: כְּלִי pode designar utensílio, instrumento ou arma; a menção imediata de flechas favorece “armas”. A construção “de morte” conserva a forma e a força letal do hebraico.
- source_word: חִצָּיו
  choice: suas flechas
  rationale: Tradução direta do substantivo plural com sufixo masculino singular.
- source_word: לְדֹלְקִים
  choice: flamejantes
  rationale: דלק pode estar ligado a arder ou a perseguir. No contexto bélico, “flamejantes” expressa a leitura tradicional de flechas incendiárias sem sobrecarregar a frase.
- source_word: יִפְעָל
  choice: fez
  rationale: O qal de פעל pode significar “fazer, produzir, executar”. “Fez” é conciso, natural e mantém o paralelismo com “preparou”.
