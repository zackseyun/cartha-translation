lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: A interjeição chama a atenção para a imagem vívida; “Vejam” é natural, direto e amplamente compreensível em português.
- source_word: יְחַבֶּל
  choice: sofre as dores de parto de
  rationale: No contexto da metáfora de gestação e nascimento, o verbo evoca contorções ou dores de parto. A formulação explicita essa força sem confundi-lo com o verbo seguinte, que expressa concepção.
- source_word: אָוֶן
  choice: maldade
  rationale: O termo abrange tanto perversidade moral quanto dano ou desgraça. “Maldade” preserva aqui a dimensão moral e o distingue de עָמָל.
- source_word: הָרָה
  choice: concebe
  rationale: O verbo denota conceber ou ficar grávido; “concebe” mantém a formulação verbal compacta e a sequência poética hebraica.
- source_word: עָמָל
  choice: aflição
  rationale: O termo pode indicar sofrimento, fadiga, desgraça ou dano. “Aflição” preserva sua amplitude negativa e funciona naturalmente como aquilo que é concebido.
- source_word: יָלַד שָׁקֶר
  choice: dá à luz a falsidade
  rationale: A expressão completa a metáfora reprodutiva de modo claro e atual; “falsidade” pode abranger mentira e engano.
