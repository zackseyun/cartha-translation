  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: pt
  text: Deus é um juiz justo[a] e se indigna todos os dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus julga o justo”.'
    reason: syntactic_alternative
  - marker: b
    text: 'Ou: “ira-se todos os dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, neste contexto designa o único Deus e tem sentido singular.
- source_word: שׁוֹפֵט צַדִּיק
  choice: é um juiz justo
  rationale: 'O particípio שׁוֹפֵט pode funcionar como substantivo predicativo, e צַדִּיק como adjetivo: Deus é caracterizado como juiz que age conforme a justiça. A possível leitura verbal, “julga o justo”, é preservada em nota.'
- source_word: וְאֵל
  choice: e um Deus
  rationale: אֵל retoma o referente divino e a conjunção וְ é expressa por “e”. A formulação mantém o paralelismo e permite uma construção natural em português.
- source_word: זֹעֵם
  choice: que se indigna
  rationale: O particípio exprime a contínua reação de Deus contra o mal. “Indigna-se” comunica ira moralmente fundamentada, sem suavizar a linguagem de ira divina.
- source_word: בְּכָל יוֹם
  choice: todos os dias
  rationale: A expressão indica recorrência diária, não necessariamente duração ininterrupta ao longo de um único dia.
theological_decisions:
- issue: Linguagem sobre a ira divina
  choice: um Deus que se indigna todos os dias
  alternative: um Deus que fica irado todos os dias
  rationale: O hebraico atribui explicitamente a Deus uma reação contínua de ira ou indignação. A tradução preserva essa tensão teológica, enquanto “indigna” destaca o caráter moral dessa reação sem explicá-la além do texto.
- issue: Ambiguidade sintática de שׁוֹפֵט צַדִּיק
  choice: é um juiz justo
  alternative: julga o justo
  rationale: A leitura predicativa caracteriza Deus como juiz justo e se ajusta bem ao paralelismo. Como o hebraico também permite entender צַדִּיק como objeto do particípio verbal, a leitura alternativa é registrada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Juiz justo” conserva a concisão poética; “se indigna” mantém a força da ira divina sem recorrer a linguagem arcaica.
