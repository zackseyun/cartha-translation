  text: אִם גָּ֭מַלְתִּי שֽׁוֹלְמִ֥/י רָ֑ע וָ/אֲחַלְּצָ֖/ה צוֹרְרִ֣/י רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/004.yaml
  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: pt
  text: 'se retribuí com o mal a quem vivia em paz comigo,

    ou livrei sem motivo o meu inimigo[a] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com sentido concessivo: “embora eu tenha livrado aquele que era meu inimigo sem motivo”. O verbo hebraico normalmente significa “livrar” ou “resgatar”; a construção desta cláusula é difícil.'
    reason: Preserva a ambiguidade sintática e interpretativa da cláusula, sem substituir o sentido lexical usual do verbo por uma leitura hostil.
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz a condição da declaração de inocência e corresponde naturalmente à prótase do juramento iniciado no contexto.
- source_word: גָּמַלְתִּי
  choice: retribuí
  rationale: Expressa a ideia de tratar alguém segundo o que fez ou de lhe dar algo em retorno; com רָע, indica retribuir com o mal.
- source_word: שׁוֹלְמִי
  choice: a quem vivia em paz comigo
  rationale: Preserva o sentido relacional de alguém que mantinha paz com o salmista, sem restringi-lo indevidamente a amigo ou aliado formal.
- source_word: רָע
  choice: com o mal
  rationale: Mantém a força moral do substantivo hebraico e forma uma construção idiomática com “retribuí”.
- source_word: וָאֲחַלְּצָה
  choice: ou despojei
  rationale: Adota o sentido hostil exigido pelo paralelismo de duas possíveis injustiças negadas pelo salmista. A tradução comum do verbo como “livrar” é preservada em nota.
- source_word: צוֹרְרִי
  choice: o meu inimigo
  rationale: Tradução clara e corrente do particípio substantivado que designa alguém hostil ao salmista.
- source_word: רֵיקָם
  choice: sem motivo
  rationale: Neste contexto, indica ação gratuita ou sem justa causa; é mais natural e precisa em português do que a reprodução literal “vaziamente”.
theological_decisions:
- issue: Sentido de וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'leitura negativa: “ou despojei sem motivo o meu inimigo”'
  alternative: 'leitura positiva e concessiva: “embora eu tenha livrado aquele que era meu inimigo sem motivo”'
  rationale: A leitura negativa mantém o paralelismo entre duas injustiças hipotéticas na declaração de inocência. Contudo, como חלץ frequentemente significa “livrar” ou “resgatar”, a leitura positiva continua genuinamente possível e é registrada na nota, sem ocultar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “a quem vivia em paz comigo” prioriza precisão relacional; “despojei sem motivo” conserva a estrutura poética concisa. O travessão indica que a condição continua no versículo seguinte.
