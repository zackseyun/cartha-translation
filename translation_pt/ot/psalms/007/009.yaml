  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: pt
  text: 'Que chegue ao fim o mal dos perversos,

    mas firma o justo,

    tu que examinas os corações e os rins[a],

    ó Deus justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No pensamento hebraico antigo, os “rins” representavam o íntimo da pessoa, especialmente seus sentimentos e motivações mais profundos.
    reason: Esclarece uma metáfora antropológica antiga que pode soar apenas anatômica ao leitor moderno, preservando ao mesmo tempo a imagem original.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Que chegue ao fim
  rationale: Expressa o jussivo e a partícula de súplica נָא de modo natural, sem transformar o pedido em simples afirmação.
- source_word: רַע רְשָׁעִים
  choice: o mal dos perversos
  rationale: Mantém a possível abrangência de רַע como maldade ou mal praticado e conserva o plural de רְשָׁעִים.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: mas firma o justo
  rationale: O verbo no polel pede a ideia de estabelecer ou tornar firme; o singular definido é preservado.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: os corações e os rins
  rationale: Preserva as duas imagens antropológicas hebraicas, em vez de fundi-las em uma interpretação moderna como 'corações e mentes'.
- source_word: אֱלֹהִים צַדִּיק
  choice: ó Deus justo
  rationale: Lê a expressão final como invocação, em consonância com o fluxo da oração e com a descrição participial anterior.
theological_decisions:
- issue: Relação de 'Deus justo' com a oração
  choice: 'Vocativo: ''ó Deus justo'''
  alternative: 'Predicação: ''o Deus justo examina os corações e os rins'''
  rationale: A construção admite alguma tensão sintática, mas o contexto de súplica e a sequência do verso favorecem dirigir a declaração a Deus, sem acrescentar conteúdo doutrinário.
- issue: Sentido metafórico de 'rins'
  choice: Manter a imagem literal no texto e explicá-la em nota
  alternative: Substituir por 'mente', 'íntimo' ou 'pensamentos mais profundos'
  rationale: A imagem hebraica é teologicamente e poeticamente significativa; a nota torna seu valor idiomático acessível sem apagar a forma do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A disposição poética conserva o movimento da súplica. 'Firma' é conciso e natural no registro bíblico; 'perversos' evita restringir רְשָׁעִים a uma categoria jurídica. O marcador [a] aparece imediatamente após a expressão explicada.
