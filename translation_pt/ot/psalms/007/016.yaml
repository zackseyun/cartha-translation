source:
  edition: WLC
  text: יָשׁ֣וּב עֲמָל֣/וֹ בְ/רֹאשׁ֑/וֹ וְ/עַ֥ל קָ֝דְקֳד֗/וֹ חֲמָס֥/וֹ יֵרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: pt
  text: 'Sua maldade[a] voltará sobre a própria cabeça,

    e sua violência descerá sobre o alto da sua cabeça.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu mal” ou “o dano que causa”. O hebraico עָמָל pode indicar sofrimento, dano, maldade ou ação nociva, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre o topo de sua cabeça”. O hebraico קָדְקֹד se refere à parte mais alta, ou coroa, da cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: voltará
  rationale: O Qal imperfeito de שׁוב exprime aqui o retorno contra o perverso daquilo que ele mesmo produziu. “Voltará” preserva a imagem de reversão e retribuição.
- source_word: עֲמָלוֹ
  choice: sua maldade
  rationale: עָמָל pode indicar sofrimento, dano, maldade ou ação nociva. No contexto, trata-se do mal praticado ou tramado pelo perverso, que recai sobre ele; a nota preserva a amplitude lexical.
- source_word: בְרֹאשׁוֹ
  choice: sobre a própria cabeça
  rationale: A formulação portuguesa comunica naturalmente que as consequências recaem sobre o próprio autor do mal e mantém a imagem corporal do hebraico.
- source_word: וְעַל
  choice: e ... sobre
  rationale: Mantém a ligação coordenada e a preposição do segundo membro do paralelismo.
- source_word: קָדְקֳדוֹ
  choice: o alto da sua cabeça
  rationale: קָדְקֹד designa o topo ou a parte superior da cabeça. A expressão é clara e digna em português, sem o tom coloquial de “cocuruto”.
- source_word: חֲמָסוֹ
  choice: sua violência
  rationale: חָמָס denota violência, brutalidade ou injustiça violenta. “Violência” é a correspondência mais direta neste contexto.
- source_word: יֵרֵד
  choice: descerá
  rationale: O Qal imperfeito de ירד conserva a imagem vertical do ato violento descendo sobre a cabeça de quem o praticou.
theological_decisions:
- issue: Imagem de retribuição na justiça poética
  choice: O mal e a violência do perverso voltam contra ele próprio.
  alternative: O verso poderia ser entendido mais genericamente como sofrimento que retorna a alguém, sem ênfase explícita em retribuição moral.
  rationale: O paralelismo entre a maldade que volta à cabeça e a violência que desce sobre o alto dela apresenta as ações nocivas recaindo sobre seu autor. A tradução conserva essa força sem acrescentar uma formulação doutrinária.
translation_notes:
  register: Português atual, amplamente compreensível e de registro poético digno. O paralelismo hebraico e as imagens de retorno e descida foram preservados; “própria” explicita de modo natural o caráter reflexivo da consequência.
