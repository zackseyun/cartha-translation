source:
  edition: WLC
  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: pt
  text: Que um inimigo persiga a minha vida e a alcance[a]; que ele calque por terra a minha vida e faça a minha glória habitar no pó[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha alma”. O termo hebraico נַפְשִׁי pode designar a pessoa, a alma ou a vida, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha honra” ou “a minha dignidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: Que ... persiga
  rationale: O contexto de autoimprecação, após a condição do versículo anterior, pede valor jussivo; “persiga” conserva o sentido direto do verbo.
- source_word: אוֹיֵב
  choice: um inimigo
  rationale: O substantivo singular não traz artigo no hebraico; “um inimigo” preserva naturalmente essa indefinição.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto de perseguição e violência, נֶפֶשׁ designa melhor a vida ou a própria pessoa, sem impor uma distinção estreita entre corpo e alma.
- source_word: וְיַשֵּׂג
  choice: e a alcance
  rationale: O verbo significa alcançar depois de perseguir; o pronome retoma naturalmente “a minha vida”.
- source_word: וְיִרְמֹס
  choice: que ele calque
  rationale: “Calcar” preserva a imagem de pisar e esmagar sob os pés, com tom poético digno.
- source_word: לָאָרֶץ
  choice: por terra
  rationale: A expressão portuguesa “calcar por terra” comunica de modo natural o movimento para o chão e a humilhação resultante.
- source_word: חַיָּי
  choice: a minha vida
  rationale: O plural hebraico é idiomático e, neste verso, refere-se à vida do salmista.
- source_word: וּכְבוֹדִי
  choice: a minha glória
  rationale: “Glória” mantém a amplitude poética de כָּבוֹד, que também pode indicar honra ou dignidade.
- source_word: לֶעָפָר
  choice: no pó
  rationale: Com o verbo “habitar”, “no pó” preserva a imagem de humilhação e morte em português natural.
- source_word: יַשְׁכֵּן
  choice: faça ... habitar
  rationale: A forma causativa é representada explicitamente, sem reduzir a imagem poética a “derrubar” ou “deitar”.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional, pois a função exata do termo permanece incerta.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma
  rationale: A perseguição, o pisoteamento e o pó apontam para a vida concreta da pessoa; “vida” evita introduzir uma dicotomia antropológica que o hebraico não exige.
- issue: Sentido de כְבוֹדִי como referência ao salmista
  choice: a minha glória
  alternative: a minha honra; a minha dignidade
  rationale: A tradução principal conserva a força e a ambiguidade poéticas do termo, enquanto a nota registra sentidos contextualmente possíveis.
translation_notes:
  register: Português moderno, poético e digno, com legibilidade brasileira. A construção “calcar por terra” conserva a violência da imagem hebraica sem recorrer a formulação excessivamente coloquial; “Selá” permanece sem tradução devido à incerteza de seu sentido.
