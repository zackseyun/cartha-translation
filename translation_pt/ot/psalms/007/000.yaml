  text: Shiggaion de Davi[a], que ele cantou a Yahweh a respeito das palavras de Cuxe, benjamita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, um termo técnico musical ou poético, como «lamento» ou «canto impetuoso»; o termo hebraico Shiggaion é raro e seu sentido é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Shiggaion
  rationale: O termo hebraico é raro e de sentido incerto. A transliteração preserva seu possível caráter técnico, musical ou poético, sem impor uma interpretação debatida.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Nos títulos dos salmos, ל pode indicar autoria, associação, pertença ou dedicação. A formulação compacta «de Davi» preserva essa abertura melhor que «por Davi».
- source_word: אֲשֶׁר שָׁר
  choice: que ele cantou
  rationale: Tradução direta e natural da oração relativa com o perfeito de שׁיר, mantendo o sentido verbal passado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio e mantém a direção expressa pela preposição hebraica.
- source_word: עַל דִּבְרֵי
  choice: a respeito das palavras de
  rationale: עַל pode indicar assunto ou ocasião, e דִּבְרֵי pode significar palavras, assuntos ou acontecimentos. A tradução escolhida é formalmente transparente e evita especificar «acusações» ou causalidade sem necessidade.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בֶּן יְמִינִי
  choice: benjamita
  rationale: A expressão identifica naturalmente alguém pertencente à tribo de Benjamim; «benjamita» comunica o sentido idiomático em português atual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O título conserva a concisão do hebraico; a rara designação técnica é transliterada e explicada em nota.
