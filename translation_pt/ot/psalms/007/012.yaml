  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: pt
  text: Se ele não voltar atrás[a], afiará a sua espada; já armou o seu arco e o deixou pronto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se arrepender”. O verbo hebraico significa “voltar” ou “retornar” e, neste contexto, pode ter o sentido de arrependimento.'
    reason: lexical_alternative
  - marker: b
    text: Os pronomes podem referir-se a Deus, que prepara armas de juízo contra quem não volta atrás, ou, menos provavelmente, ao perverso preparando as próprias armas.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Se ... não
  rationale: Preserva de modo natural e transparente a construção condicional hebraica.
- source_word: יָשׁוּב
  choice: voltar atrás
  rationale: Mantém o sentido amplo de שׁוּב, “voltar/retornar”, permitindo no contexto a implicação de arrependimento sem explicitá-la no texto principal.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: afiará a sua espada
  rationale: Tradução direta e corrente do verbo que designa afiar uma lâmina, com preservação do sufixo possessivo.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: já armou o seu arco
  rationale: No contexto do arco, דרך descreve a ação de vergá-lo e prepará-lo para uso; “armar o arco” é idiomático e compreensível em português.
- source_word: וַיְכוֹנְנֶהָ
  choice: e o deixou pronto
  rationale: Expressa a ideia de preparar ou deixar firmemente pronto; o pronome retoma “arco” conforme o gênero natural em português.
theological_decisions:
- issue: Referente dos pronomes masculinos de terceira pessoa
  choice: Manter “ele/sua/seu” sem identificar expressamente o sujeito; no contexto dominante, refere-se a Deus como juiz guerreiro.
  alternative: O sujeito pode ser entendido como o perverso, que prepara as próprias armas.
  rationale: O contexto imediato favorece Deus como aquele que prepara os instrumentos de juízo, mas o hebraico não repete explicitamente o sujeito neste versículo. A manutenção dos pronomes preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Voltar atrás” preserva a amplitude lexical do hebraico; “armou o seu arco” comunica idiomaticamente a preparação da arma sem linguagem arcaica.
