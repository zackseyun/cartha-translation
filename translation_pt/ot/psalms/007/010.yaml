- from: Meu escudo está com Deus[a], que salva os retos de coração.
  to: Meu escudo está em Deus[a], que salva os retos de coração.
  rationale: Substitui-se “com Deus” por “em Deus” para eliminar uma leitura espacial ou possessiva estranha ao português e expressar naturalmente que a defesa do salmista se encontra em Deus. A nota mantém a alternativa interpretativa tradicional e informa a concisão verbal do hebraico.
