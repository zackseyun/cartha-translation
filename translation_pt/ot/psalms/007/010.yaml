base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: pt
  text: Meu escudo está em Deus[a], que salva os retos de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, numa reestruturação interpretativa: “Deus é meu escudo”. O hebraico é compacto e não traz verbo explícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Meu escudo
  rationale: Mantém a imagem concreta do escudo, em vez de substituí-la por termos abstratos como “proteção” ou “defesa”.
- source_word: עַל
  choice: está com
  rationale: Na construção compacta מָגִנִּי עַל אֱלֹהִים, expressa que a defesa do salmista se encontra em Deus. “Está com” preserva a relação sintática sem convertê-la silenciosamente na formulação interpretativa “Deus é meu escudo”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, neste contexto designa o único Deus de Israel e requer o singular em português.
- source_word: מוֹשִׁיעַ
  choice: que salva
  rationale: O particípio caracteriza a ação habitual de Deus; a oração relativa é clara e natural em português.
- source_word: יִשְׁרֵי
  choice: os retos
  rationale: O termo descreve pessoas moralmente íntegras ou retas. “Retos” conserva o campo lexical de ישר sem substituí-lo por “justos”, que corresponde mais diretamente a outro campo lexical.
- source_word: לֵב
  choice: de coração
  rationale: Preserva de modo natural o hebraísmo que se refere ao caráter e à pessoa interior.
theological_decisions:
- issue: Relação sintática da primeira oração
  choice: Meu escudo está com Deus
  alternative: Deus é meu escudo
  rationale: O hebraico não apresenta verbo explícito e admite mais de uma reestruturação idiomática. O texto principal conserva a construção compacta e a ideia de que a defesa do salmista se encontra em Deus; a nota registra a formulação interpretativa comum sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora concreta do escudo e a concisão poética foram preservadas.
