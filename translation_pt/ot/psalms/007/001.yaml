  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: pt
  text: Ó Yahweh, meu Deus, em ti me refugio[a]; salva-me de todos os que me perseguem e livra-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho me refugiado”. O perfeito hebraico pode ser entendido, neste contexto de oração, como uma confiança vigente.'
    reason: alternativa aspectual
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, preservando sua função de invocação direta.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa singular significa naturalmente “meu Deus”.
- source_word: בְּךָ
  choice: em ti
  rationale: Representa diretamente a preposição ב com sufixo de segunda pessoa masculina singular, sem acrescentar a ideia não expressa de exclusividade.
- source_word: חָסִיתִי
  choice: me refugio
  rationale: O perfeito de חסה pode, neste contexto de oração, exprimir confiança assumida e vigente; o presente é natural em português e mantém essa relevância atual.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: O imperativo hifil de ישׁע pede salvação ou socorro; “salva-me” é claro e preserva a linguagem de oração.
- source_word: מִכָּל רֹדְפַי
  choice: de todos os que me perseguem
  rationale: O particípio com sufixo indica aqueles que continuam perseguindo o salmista; a oração relativa conserva melhor a força verbal.
- source_word: וְהַצִּילֵנִי
  choice: e livra-me
  rationale: O imperativo hifil de נצל comunica arrancar do perigo ou pôr a salvo; “livra-me” mantém uma distinção sutil em relação a “salva-me”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” o preserva como nome próprio sem substituí-lo por um título.
- issue: Aspecto de חָסִיתִי no contexto da oração
  choice: me refugio
  alternative: tenho me refugiado; busquei refúgio
  rationale: O perfeito hebraico permite entender uma ação assumida com relevância presente. O texto principal usa o presente idiomático, enquanto a nota preserva a alternativa aspectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural no registro bíblico (“salva-me”, “livra-me”). A invocação “Ó Yahweh” preserva o vocativo enfático do hebraico.
