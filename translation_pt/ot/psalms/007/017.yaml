source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: pt
  text: Darei graças a Yahweh conforme a sua justiça[a] e cantarei louvores ao nome de Yahweh, o Altíssimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da sua justiça” ou “conforme a sua retidão”. O termo hebraico pode abranger tanto a retidão quanto a justiça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Darei graças
  rationale: O hifil de ידה, em contextos de ação de graças nos salmos, costuma significar agradecer ou louvar. “Darei graças” expressa naturalmente o sentido cultual e mantém Yahweh como objeto da ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando o nome pessoal presente no hebraico.
- source_word: כְּצִדְקוֹ
  choice: conforme a sua justiça
  rationale: A preposição כְ indica correspondência ou conformidade. “Justiça” é natural em português e abrange aqui tanto o caráter reto de Deus quanto sua atuação justa; a alternativa causal é registrada em nota.
- source_word: וַאֲזַמְּרָה
  choice: e cantarei louvores
  rationale: A forma volitiva de זמר denota cantar em louvor, frequentemente com conotação musical. A expressão é clara e idiomática em português.
- source_word: שֵׁם
  choice: ao nome
  rationale: Mantém a formulação bíblica concreta e sua referência à identidade e reputação reveladas de Deus.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Título divino tradicional, claro e preciso. O artigo favorece a leitura de עֶלְיוֹן como título em aposição a Yahweh, sem acrescentar “Deus”, ausente do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de צדק aplicado a Deus
  choice: justiça
  alternative: retidão
  rationale: O termo hebraico abrange a retidão moral e a justiça manifestada em atos. “Justiça” soa natural neste contexto de juízo e louvor, enquanto a nota preserva a possível nuance causal e de retidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela do verso foi preservada, e a vírgula antes de “o Altíssimo” explicita a aposição sem eliminar a possível força titular do hebraico.
