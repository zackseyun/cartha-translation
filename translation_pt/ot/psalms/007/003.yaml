base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: pt
  text: Yahweh, meu Deus, se fiz isso, se há injustiça em minhas mãos[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se há mal em minhas mãos”. A expressão hebraica pode indicar culpa moral ou responsabilidade por uma ação errada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, preservando sua função de nome próprio e sua distinção de títulos como “Senhor”.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa do singular significa “meu Deus”; a maiúscula é apropriada porque se refere diretamente ao Deus de Israel.
- source_word: אִם
  choice: se
  rationale: Introduz as condições de uma autotoimprecação que prossegue nos versículos seguintes; “se” é a equivalência portuguesa direta e natural.
- source_word: עָשִׂיתִי זֹאת
  choice: fiz isso
  rationale: Reproduz de modo conciso o perfeito qal na primeira pessoa com o demonstrativo, sem especificar além do hebraico a ação à qual “isso” se refere.
- source_word: יֶשׁ
  choice: há
  rationale: Equivalente idiomático e atual da partícula existencial hebraica.
- source_word: עָוֶל
  choice: injustiça
  rationale: Preserva o sentido de ação moralmente torta ou injusta e combina com o contexto judicial da declaração de inocência.
- source_word: בְּכַפָּי
  choice: nas minhas mãos
  rationale: Mantém a imagem hebraica das palmas ou mãos como esfera da ação e possível culpabilidade, em expressão compreensível em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não apenas um título. “Yahweh” conserva essa identidade textual sem substituir o nome por “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Natureza da afirmação do salmista
  choice: condição aberta que introduz uma autotoimprecação
  alternative: declaração absoluta de impecabilidade
  rationale: A repetição de אִם formula uma condição ligada a acusações concretas e não exige interpretar o verso como reivindicação geral de ausência de pecado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem e a repetição de “se” preservam a estrutura hebraica. O travessão mantém a frase aberta, pois a condição continua nos versículos seguintes.
