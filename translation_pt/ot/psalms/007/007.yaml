  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: pt
  text: Que a assembleia dos povos te cerque[a]; e, acima dela[b], volta ao alto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nações”, em vez de “povos”.'
    reason: lexical_alternative
  - marker: b
    text: 'O coletivo também pode ser expresso no plural: “acima deles”, isto é, acima dos povos reunidos.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: assembleia
  rationale: Designa um grupo reunido. “Assembleia” é atual, digna e preserva o caráter coletivo sem acrescentar conotação eclesiástica.
- source_word: לְאֻמִּים
  choice: povos
  rationale: O plural se refere a grupos étnicos ou nacionais distintos. “Povos” preserva essa pluralidade; “nações” também é possível.
- source_word: תְּסוֹבְבֶךָּ
  choice: que ... te cerque
  rationale: A forma é entendida no contexto como pedido ou desejo de valor jussivo, não como simples previsão. “Cercar” expressa diretamente a ideia de rodear.
- source_word: וְעָלֶיהָ
  choice: acima dela
  rationale: O sufixo hebraico é feminino singular e retoma formalmente “assembleia” como unidade coletiva. A tradução mantém essa concordância e a imagem espacial, sem explicitar além do texto se a referência conceitual recai sobre a assembleia ou sobre seus integrantes.
- source_word: לַמָּרוֹם
  choice: às alturas
  rationale: מָרוֹם indica altura ou lugar elevado. “Às alturas” combina naturalmente com o verbo de movimento “volta” e preserva tanto a dimensão espacial quanto a possibilidade de exaltação poética.
- source_word: שׁוּבָה
  choice: volta
  rationale: É imperativo de שוב, “voltar/retornar”. “Volta” mantém o pedido explícito sem inserir no texto ideias interpretativas como entronização.
theological_decisions:
- issue: Se o verso retrata julgamento divino a partir de uma posição exaltada ou movimento literal para o alto
  choice: Manter o pedido poético para que Deus volte às alturas, acima da assembleia
  alternative: Entender como pedido para Deus retomar sua posição exaltada de governo e julgamento, ou como ascensão espacial literal
  rationale: O imperativo favorece uma petição, mas o hebraico não obriga a decidir se a imagem é estritamente espacial ou representa governo e julgamento exaltados. A tradução preserva essa tensão.
- issue: Referência singular ou plural de וְעָלֶיהָ
  choice: 'Referência singular à assembleia coletiva: “acima dela”'
  alternative: 'Representar em sentido distributivo os povos reunidos: “acima deles”'
  rationale: O sufixo é formalmente feminino singular e concorda naturalmente com “assembleia”. O sentido plural coletivo continua possível e é registrado em nota.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para soar natural, preservando o paralelismo e a ambiguidade entre altura espacial e posição exaltada.
