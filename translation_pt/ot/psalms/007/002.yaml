  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: pt
  text: para que ele não despedace a minha vida[a] como um leão, dilacerando-a sem que ninguém a livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha alma”; o hebraico נַפְשִׁי refere-se aqui à vida ou ao próprio ser do salmista, ameaçado de morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a consequência temida; em português, “para que não” preserva naturalmente a força preventiva ou negativa do hebraico.
- source_word: יִטְרֹף
  choice: despedace
  rationale: O verbo descreve a ação de um predador que dilacera a presa; “despedace” mantém a imagem violenta e prepara a elaboração seguinte.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: Reproduz de modo direto e natural a comparação marcada pelo prefixo hebraico כְּ.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto de ataque mortal, נֶפֶשׁ designa a vida ou o próprio ser do salmista, não necessariamente uma alma imaterial. A nota preserva a alternativa lexical tradicional.
- source_word: פֹּרֵק
  choice: dilacerando-a
  rationale: O particípio desenvolve e intensifica a imagem do leão que despedaça a presa; o pronome retoma “a minha vida” para dar clareza em português.
- source_word: וְאֵין מַצִּיל
  choice: sem que ninguém a livre
  rationale: Expressa com naturalidade a inexistência de alguém capaz de resgatar o salmista, preservando a ação concreta de livramento.
