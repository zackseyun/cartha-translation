id: PSA.7.8
reference: Psalms 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: pt
  text: Yahweh julga os povos; julga-me[a], ó Yahweh, segundo a minha justiça e segundo a integridade[b] que há em mim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faze-me justiça”. O imperativo hebraico traduzido por “julga-me” pode, neste contexto, pedir uma sentença favorável.
    reason: lexical_alternative
  - marker: b
    text: Ou “irrepreensibilidade”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “que está sobre mim”.
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָדִין
  choice: julga
  rationale: O imperfeito pode expressar uma ação geral ou habitual; o presente também preserva a ligação judicial com o imperativo seguinte.
- source_word: עַמִּים
  choice: os povos
  rationale: Representa naturalmente o plural coletivo hebraico sem lhe impor o sentido político moderno de “nações”.
- source_word: שָׁפְטֵנִי
  choice: julga-me
  rationale: Traduz diretamente o imperativo de שׁפט e mantém a repetição com “julga”; no contexto, pode incluir a ideia de emitir uma sentença favorável.
- source_word: כְּצִדְקִי
  choice: segundo a minha justiça
  rationale: Preserva a afirmação explícita do salmista e o valor normativo da preposição כְּ, sem reduzir a expressão a uma mera alegação de causa justa.
- source_word: וּכְתֻמִּי
  choice: e segundo a integridade
  rationale: “Integridade” comunica inteireza moral sem necessariamente afirmar impecabilidade absoluta.
- source_word: עָלָי
  choice: que há em mim
  rationale: Expressa em português corrente que a integridade pertence ao salmista; a imagem mais literal, “sobre mim”, é preservada em nota.
theological_decisions:
- issue: Se a afirmação de justiça e integridade do salmista deve ser suavizada para evitar a ideia de impecabilidade absoluta
  choice: Manter em primeira pessoa “minha justiça” e “integridade que há em mim”
  alternative: Parafrasear como “a justiça da minha causa” ou “minha inocência neste caso”
  rationale: O hebraico apresenta a reivindicação de modo direto. A tradução conserva a tensão teológica sem transformá-la numa afirmação explícita de perfeição moral nem limitá-la no texto principal a uma situação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético do hebraico foram preservados, enquanto “que há em mim” evita uma formulação pouco idiomática no texto principal.
