  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: pt
  text: Ele abateu a força dele no caminho[a][b]; encurtou os meus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “a força dele”; muitos entendem “a minha força” por causa do contexto em primeira pessoa.
    reason: alternative_reading
  - marker: b
    text: Ou “no curso da vida”; literalmente, “no caminho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: abateu
  rationale: O piel de ענה pode expressar afligir, humilhar ou enfraquecer. “Abateu” conserva a ação exercida sobre o vigor e soa natural no paralelismo poético em português.
- source_word: בַדֶּרֶךְ
  choice: no caminho
  rationale: Reproduz a imagem concreta do hebraico, sem decidir no texto principal se o caminho representa metaforicamente o curso da vida.
- source_word: כחו
  choice: o vigor dele
  rationale: Mantém o sufixo de terceira pessoa masculina da forma consonantal apresentada. “Vigor” comunica naturalmente כוח como força ou capacidade vital neste contexto.
- source_word: קִצַּר
  choice: encurtou
  rationale: Equivalente direto de קצר, preservando o paralelismo entre o vigor abatido e os dias reduzidos.
- source_word: יָמָי
  choice: os meus dias
  rationale: Mantém o sufixo de primeira pessoa e a expressão poética hebraica para a duração da vida.
theological_decisions:
- issue: Alternância de pessoa entre “o vigor dele” e “os meus dias”
  choice: Preservar a terceira pessoa no primeiro hemistíquio e a primeira pessoa no segundo.
  alternative: “Ele abateu o meu vigor no caminho; encurtou os meus dias.”
  rationale: A forma hebraica fornecida apresenta uma tensão real entre o sufixo de terceira pessoa em כחו e o de primeira pessoa em ימי. O texto principal não harmoniza silenciosamente essa alternância; a leitura contextual em primeira pessoa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Abateu o vigor” evita a expressão pouco idiomática “afligiu a força”, preservando a contundência e a concisão do verso. Os marcadores seguem imediatamente as expressões a que se referem.
