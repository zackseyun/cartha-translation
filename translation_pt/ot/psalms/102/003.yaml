base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: pt
  text: 'Pois os meus dias se dissipam como fumaça,

    e os meus ossos ardem como um braseiro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus ossos são chamuscados como um tição”, “como um forno” ou “como uma lareira”. O termo hebraico que designa o objeto ou lugar em chamas é raro; por isso, a imagem exata é incerta, embora o sentido de calor intenso seja claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da lamentação e preserva de modo natural a ligação causal em português.
- source_word: כָלוּ בְעָשָׁן
  choice: se dissipam como fumaça
  rationale: O verbo expressa chegar ao fim ou consumir-se; junto de “fumaça”, a formulação comunica poeticamente dias que desaparecem, entendendo a preposição em sentido comparativo apropriado ao contexto.
- source_word: יָמָי
  choice: os meus dias
  rationale: Tradução direta que mantém o caráter pessoal da lamentação.
- source_word: וְעַצְמוֹתַי
  choice: e os meus ossos
  rationale: Preserva a imagem corporal hebraica de sofrimento profundo.
- source_word: כְּמוֹ קֵד
  choice: como um braseiro
  rationale: “Braseiro” representa com naturalidade um objeto ou lugar de calor intenso, sem esconder que o substantivo hebraico raro admite outras identificações.
- source_word: נִחָרוּ
  choice: ardem
  rationale: Expressa de maneira concisa e vívida o calor abrasador ou chamuscante atribuído aos ossos, sem especificar que tenham sido completamente carbonizados.
