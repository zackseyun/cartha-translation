  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: pt
  text: "Ele se voltou para a oração do desamparado\n e não desprezou a oração deles.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do indigente”, “daquele que está sem recursos”. Em outros contextos, o termo hebraico também pode designar um arbusto do deserto, talvez evocando aqui alguém despojado de tudo ou isolado.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: se voltou para
  rationale: Preserva a imagem concreta do verbo hebraico, ao mesmo tempo que comunica atenção favorável à oração.
- source_word: תְּפִלַּת
  choice: a oração de
  rationale: Corresponde diretamente ao substantivo hebraico e permite manter sua repetição na segunda linha.
- source_word: הָעַרְעָר
  choice: o desamparado
  rationale: Neste contexto, o termo designa alguém reduzido à privação, isolado ou sem amparo; o singular genérico combina com o posterior sufixo plural coletivo.
- source_word: בָזָה
  choice: desprezou
  rationale: Expressa adequadamente a ideia de tratar com desdém ou considerar sem valor.
- source_word: תְּפִלָּתָם
  choice: a oração deles
  rationale: Mantém o substantivo no singular e traduz explicitamente o sufixo plural, preservando também a repetição hebraica.
theological_decisions:
- issue: Sentido antropológico de עַרְעָר
  choice: pessoa desamparada
  alternative: pessoa solitária ou alguém comparado a um arbusto do deserto
  rationale: A referência à oração e o sufixo plural em “oração deles” indicam referentes humanos. A tradução principal expressa sua condição sem eliminar da nota o possível pano de fundo imagético.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “oração” e a mudança do singular genérico “desamparado” para o plural “deles” reproduzem a forma e a tensão do hebraico.
