base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: pt
  text: 'Eu digo: “Meu Deus, não me leves embora[a] na metade dos meus dias; os teus anos duram de geração em geração[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “não me faças subir”. Aqui, o verbo hebraico provavelmente tem o sentido de alguém ser levado embora prematuramente.
    reason: lexical_alternative
  - marker: b
    text: Ou “por todas as gerações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Eu digo
  rationale: O imperfeito qal na primeira pessoa do singular pode introduzir a súplica em presente vívido; “Eu digo” preserva essa abertura sem fixá-la desnecessariamente no passado.
- source_word: אֵלִי
  choice: Meu Deus
  rationale: A forma com sufixo de primeira pessoa significa “meu Deus” e funciona aqui como vocativo, naturalmente compreensível sem a interjeição “ó”.
- source_word: אַל תַּעֲלֵנִי
  choice: não me leves embora
  rationale: Embora o hifil de עלה possa ser vertido literalmente como “fazer subir”, no contexto da brevidade da vida a expressão indica ser retirado prematuramente da vida. “Levar embora” comunica o sentido provável sem explicitar “morte” além do hebraico.
- source_word: בַּחֲצִי יָמָי
  choice: na metade dos meus dias
  rationale: Mantém a imagem hebraica de uma vida interrompida antes de se completar e soa natural em português.
- source_word: בְּדוֹר דּוֹרִים
  choice: de geração em geração
  rationale: Reproduz de modo idiomático a continuidade ao longo das gerações e preserva a formulação temporal do hebraico.
- source_word: שְׁנוֹתֶיךָ
  choice: os teus anos
  rationale: Tradução direta do substantivo plural com sufixo de segunda pessoa, em contraste com os dias limitados do salmista.
theological_decisions:
- issue: Linguagem idiomática relativa à morte na oração
  choice: “não me leves embora”
  alternative: “não me faças subir” ou “não me retires”
  rationale: O contexto contrapõe a vida abreviada do suplicante aos anos duradouros de Deus. A tradução comunica a provável referência à retirada prematura da vida, sem transformar a inferência contextual em formulação doutrinária explícita.
- issue: Duração dos anos de Deus
  choice: “os teus anos duram de geração em geração”
  alternative: “os teus anos são por geração de gerações”
  rationale: O verbo “duram”, implícito em português para formar uma oração natural, expressa a continuidade indicada pela construção hebraica sem definir filosoficamente a eternidade divina além do verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “não me leves” é natural, e “de geração em geração” conserva o paralelismo poético e a ambiguidade temporal do original.
