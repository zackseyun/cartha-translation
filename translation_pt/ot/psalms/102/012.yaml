  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: pt
  text: Mas tu, Yahweh, permaneces entronizado para sempre[a], e a tua memória é de geração em geração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estás sentado para sempre” ou “permaneces para sempre”. O verbo hebraico significa literalmente “sentar-se”, mas também pode expressar permanência e, em contexto régio, entronização.
    reason: lexical_alternative
  - marker: b
    text: Ou “o teu memorial” ou “o teu renome”. O substantivo hebraico pode indicar memória, memorial, lembrança ou fama duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente estabelece forte contraste com a fragilidade e transitoriedade humanas no contexto anterior; “Mas tu” expressa isso naturalmente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְעוֹלָם תֵּשֵׁב
  choice: permaneces entronizado para sempre
  rationale: ישב significa literalmente “sentar-se” e também pode indicar permanência ou entronização. A formulação portuguesa comunica a continuidade do reinado divino, preservando a alternativa literal em nota.
- source_word: וְזִכְרְךָ
  choice: e a tua memória
  rationale: זֵכֶר pode designar memória, memorial ou renome. “A tua memória” conserva a ligação lexical com a recordação sem restringir o sentido a fama.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Expressão portuguesa corrente que reproduz a continuidade pelas gerações sucessivas.
theological_decisions:
- issue: Permanência e possível realeza divina em תֵּשֵׁב
  choice: permaneces entronizado para sempre
  alternative: estás sentado para sempre; permaneces para sempre
  rationale: O contexto permite uma imagem régia, mas o verbo hebraico não contém por si só um termo explícito para trono. A nota preserva essa abertura lexical.
- issue: Sentido de זִכְרְךָ
  choice: a tua memória
  alternative: o teu memorial; o teu renome
  rationale: A escolha mantém a amplitude do substantivo hebraico; a nota registra as principais possibilidades sem decidir indevidamente entre recordação, memorial e fama duradoura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “tu” em concordância regular e conserva o nome divino “Yahweh”. A repetição de “permanece” dá naturalidade e explicita a continuidade sugerida pelas expressões temporais, embora o segundo verbo não esteja expresso no hebraico.
