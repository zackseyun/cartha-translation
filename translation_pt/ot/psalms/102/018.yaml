source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: pt
  text: Isto será escrito para uma geração futura, e um povo ainda por ser criado louvará Jah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “Jah”, forma curta e poética do nome divino; muitas traduções trazem “o SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: será escrito
  rationale: O nifal imperfeito de כתב tem sentido passivo e, neste contexto voltado para o futuro, é expresso naturalmente pelo futuro do indicativo.
- source_word: זֹאת
  choice: Isto
  rationale: O demonstrativo remete ao testemunho ou à oração precedente como um todo, sem exigir o acréscimo interpretativo de um substantivo.
- source_word: לְדוֹר אַחֲרוֹן
  choice: para uma geração futura
  rationale: דור significa “geração”, e אחרון indica aqui uma geração posterior ou vindoura, sem exigir a leitura escatológica de “última geração”.
- source_word: וְעַם
  choice: e um povo
  rationale: עם significa normalmente “povo”; a ausência do artigo favorece a referência indefinida a um povo futuro.
- source_word: נִבְרָא
  choice: ainda por ser criado
  rationale: O particípio passivo de ברא significa “criado”. Em paralelo com a geração futura, a formulação explicita de modo natural o caráter prospectivo sem definir a natureza dessa criação.
- source_word: יְהַלֶּל
  choice: louvará
  rationale: O piel imperfeito de הלל expressa louvor e se harmoniza com a orientação futura do verso.
- source_word: יָהּ
  choice: Jah
  rationale: Preserva a forma curta e poética do nome divino, distinta de יהוה. A grafia com h evita confusão, em português, com o advérbio “já”.
theological_decisions:
- issue: Tradução do nome divino יָהּ
  choice: Jah
  alternative: o SENHOR
  rationale: O hebraico emprega a forma curta יהּ, não o tetragrama יהוה. Manter “Jah” preserva essa distinção lexical e poética; “o SENHOR” seria uma adaptação tradicional que a apagaria.
- issue: Sentido de נִבְרָא aplicado ao povo
  choice: ainda por ser criado
  alternative: recém-criado
  rationale: O paralelismo com “uma geração futura” favorece a referência a um povo que ainda virá a existir. A tradução não determina se “criado” descreve origem histórica, renovação espiritual ou outra dimensão, preservando a amplitude do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. “Geração futura” comunica o valor temporal de אַחֲרוֹן sem impor uma leitura de “última geração”. A forma “Jah” mantém a distinção do original e evita a ambiguidade visual de “Já” em português.
