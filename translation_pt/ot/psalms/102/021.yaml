  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: pt
  text: para proclamar em Sião o nome de Yahweh e o seu louvor em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: para proclamar
  rationale: O infinitivo com לְ expressa propósito ou resultado no contexto. No piel, ספר pode significar contar ou relatar; com “o nome de Yahweh”, “proclamar” comunica melhor a declaração pública.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição בְּ indica localização, e “Sião” é a forma portuguesa consagrada do nome próprio.
- source_word: שֵׁם
  choice: nome
  rationale: Mantém o sentido direto do hebraico e preserva sua riqueza teológica, que pode abranger identidade e reputação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּתְהִלָּתוֹ
  choice: e o seu louvor
  rationale: Traduz diretamente o substantivo תְּהִלָּה com o sufixo de terceira pessoa masculina singular. A formulação preserva a concisão e a possível abrangência de louvor dirigido a ele ou referente a ele.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição בְּ indica localização, e “Jerusalém” é a forma portuguesa padrão do nome da cidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título, ao mesmo tempo que evita adotar a vocalização tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção mantém o paralelismo poético entre Sião e Jerusalém e entre “o nome de Yahweh” e “o seu louvor”.
