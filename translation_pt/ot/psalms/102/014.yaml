  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: pt
  text: Pois os teus servos têm prazer nas pedras dela e se compadecem do seu pó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm apreço pelas pedras dela e favorecem o seu pó”.'
    reason: Alternativa lexical para רצה e חנן, preservando os sentidos de apreço e favor gracioso.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz naturalmente, em português, a razão ligada à esperança ou súplica precedente.
- source_word: רָצוּ
  choice: têm prazer
  rationale: Expressa o apreço afetuoso dos servos pelas pedras de Sião, preservando o valor de agrado ou prazer do verbo.
- source_word: עֲבָדֶיךָ
  choice: os teus servos
  rationale: É a forma natural e digna de designar os que servem a Deus neste contexto poético.
- source_word: אֶת אֲבָנֶיהָ
  choice: nas pedras dela
  rationale: Mantém a referência feminina a Sião sem a possível ambiguidade de 'suas pedras' em português.
- source_word: וְאֶת עֲפָרָהּ
  choice: e ... do seu pó
  rationale: Conserva a imagem literal do pó da cidade arruinada; o possessivo retoma Sião personificada.
- source_word: יְחֹנֵנוּ
  choice: se compadecem
  rationale: O verbo חנן pode indicar favor gracioso ou compaixão; nesta construção, 'se compadecem do seu pó' soa natural e preserva a afeição diante da ruína.
theological_decisions:
- issue: Personificação feminina de Sião/Jerusalém
  choice: Referência retomada por 'dela' e 'seu'
  alternative: Empregar formas impessoais ou repetir 'Sião'
  rationale: Os sufixos hebraicos são femininos e retomam Sião; a formulação portuguesa preserva essa referência poética sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética natural. 'Pois' mantém a conexão causal; 'pó' conserva a imagem concreta do hebraico. O marcador da nota aparece no texto principal.
