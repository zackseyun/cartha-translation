  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: pt
  text: Eles perecerão, mas tu permanecerás[a]; todos eles se desgastarão como uma veste. Como roupa, tu os trocarás[b], e eles passarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarás de pé”. O verbo hebraico significa literalmente “ficar de pé” e, aqui, expressa permanência duradoura em contraste com o perecimento da criação.
    reason: lexical_alternative
  - marker: b
    text: Ou “os mudarás” ou “os substituirás”. O hebraico pode indicar mudança, troca ou substituição, dando continuidade à metáfora da roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: Pronome independente masculino plural que retoma os céus e a terra do contexto; “Eles” preserva com naturalidade o contraste com “tu”.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: O qal imperfeito de אבד indica perecimento ou ruína futura, sem exigir a ideia mais específica de aniquilação.
- source_word: וְאַתָּה
  choice: mas tu
  rationale: A conjunção tem força adversativa no contexto, contrapondo a transitoriedade da criação à permanência de Deus.
- source_word: תַעֲמֹד
  choice: permanecerás
  rationale: Embora o verbo signifique literalmente “ficar de pé”, aqui expressa continuidade e permanência em contraste com “perecerão”.
- source_word: וְכֻלָּם
  choice: todos eles
  rationale: Expressa a totalidade das realidades criadas mencionadas no contexto.
- source_word: כַּבֶּגֶד
  choice: como uma veste
  rationale: בגד é um termo geral para peça de roupa; “veste” conserva o tom poético e a comparação.
- source_word: יִבְלוּ
  choice: se desgastarão
  rationale: בלה descreve com frequência o desgaste de roupas; a forma reflexiva é idiomática em português e preserva a imagem.
- source_word: כַּלְּבוּשׁ
  choice: Como roupa
  rationale: לבוש também designa vestimenta; “roupa” mantém a metáfora e evita uma repetição rígida.
- source_word: תַּחֲלִיפֵם
  choice: tu os trocarás
  rationale: O hifil de חלף pode significar mudar, trocar ou substituir. No símile da roupa, “trocarás” evoca naturalmente a troca de vestes sem decidir se o sentido é apenas mudança ou substituição.
- source_word: וְיַחֲלֹפוּ
  choice: eles passarão
  rationale: O qal de חלף pode indicar passar ou desaparecer; “passarão” mantém a transitoriedade e a relação verbal com a imagem precedente.
theological_decisions:
- issue: Permanência divina em contraste com a transitoriedade da criação
  choice: “Eles perecerão, mas tu permanecerás”
  alternative: “Eles perecerão, mas tu ficarás de pé”
  rationale: A tradução comunica a força contextual da permanência de Deus sem acrescentar terminologia doutrinária posterior; a nota conserva o sentido literal do verbo hebraico.
- issue: Mudança ou substituição da criação na metáfora da roupa
  choice: “tu os trocarás”
  alternative: “tu os mudarás” ou “tu os substituirás”
  rationale: “Trocarás” funciona naturalmente com roupa e preserva a amplitude semântica do hebraico, sem definir em que consiste essa mudança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “tu” para preservar o contraste enfático do hebraico e o registro poético. A formulação mantém o paralelismo e a metáfora das vestes.
