  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: pt
  text: Meus dias são como uma sombra estendida[a], e eu vou secando como a erva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma sombra alongada”. A imagem hebraica provavelmente evoca uma sombra estendida ao entardecer, sugerindo declínio e transitoriedade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Meus dias
  rationale: Preserva o plural hebraico com sufixo de primeira pessoa e a imagem poética da duração da vida.
- source_word: כְּצֵל
  choice: como uma sombra
  rationale: Reproduz diretamente a comparação marcada por כְּ e o sentido comum de צֵל.
- source_word: נָטוּי
  choice: que se alonga
  rationale: Expressa naturalmente a ideia de uma sombra estendida, provavelmente a sombra crescente do fim do dia, sem substituir a imagem por sua interpretação.
- source_word: וַאֲנִי
  choice: e eu
  rationale: Mantém a conjunção simples do hebraico; não intensifica a relação para 'mas eu'.
- source_word: כָּעֵשֶׂב
  choice: como a erva
  rationale: עֵשֶׂב designa erva ou vegetação; 'erva' é corrente em português e apropriada à imagem poética de fragilidade.
- source_word: אִיבָשׁ
  choice: vou secando
  rationale: O verbo יבשׁ significa secar ou definhar. A forma progressiva comunica o processo em curso e combina naturalmente com 'erva', preservando a imagem concreta de perda de vigor.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. 'Erva' mantém uma imagem bíblica reconhecível; 'vou secando' evita uma formulação excessivamente arcaica e preserva o aspecto concreto do verbo.
