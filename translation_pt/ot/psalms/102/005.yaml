  - marker: b
    text: 'Ou: “à minha pele”. Neste contexto de extrema magreza, a palavra hebraica traduzida como “carne” pode referir-se à pele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Por causa de
  rationale: A construção מִן + קוֹל pode indicar a causa da condição descrita. Em português, “por causa de” comunica esse nexo com naturalidade; a referência literal ao “som” fica registrada em nota, sem ocultar a ambiguidade da preposição.
- source_word: אַנְחָתִי
  choice: meu gemido
  rationale: O substantivo designa gemido ou suspiro produzido pela aflição. “Gemido” conserva a intensidade física e emocional do lamento.
- source_word: דָּבְקָה
  choice: se apegam
  rationale: O verbo דבק significa aderir, ficar colado ou apegar-se. “Se apegam” mantém a imagem concreta e é compreensível no português atual.
- source_word: עַצְמִי
  choice: meus ossos
  rationale: Embora a forma seja singular, עֶצֶם pode ter sentido coletivo. O plural é a expressão natural em português para a estrutura óssea do corpo.
- source_word: לִבְשָׂרִי
  choice: à minha carne
  rationale: “Carne” reproduz o sentido básico e concreto de בָּשָׂר sem explicar excessivamente a imagem. No contexto de extrema magreza, “pele” também é possível e aparece em nota.
