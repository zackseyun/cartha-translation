  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: pt
  text: 'Por causa do meu gemido[a],

    meus ossos se apegam à minha carne.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do som do meu gemido”. A preposição hebraica pode indicar tanto origem quanto causa.'
