base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/004.yaml
  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: pt
  text: Meu coração foi abatido como a erva e secou, pois me esqueço de comer o meu pão.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois me esqueci de comer o meu pão”. O perfeito hebraico pode ser entendido como descrição de uma aflição contínua ou como ação concluída cujos efeitos permanecem.'
    reason: lexical_alternative
  - marker: b
    text: “O meu pão” também pode significar “o meu alimento” em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: foi abatido
  rationale: O passivo de נכה indica que o coração foi atingido ou abatido. “Foi abatido” preserva a força passiva e expressa naturalmente a aflição em português.
- source_word: כָעֵשֶׂב
  choice: como a erva
  rationale: עֵשֶׂב designa erva ou vegetação. “Como a erva” mantém a comparação poética com algo frágil que seca.
- source_word: וַיִּבַשׁ
  choice: e secou
  rationale: יבש significa secar ou ressecar. O verbo “secou” conserva a forma verbal coordenada do hebraico e completa a imagem da erva sem vida.
- source_word: לִבִּי
  choice: meu coração
  rationale: לֵב designa aqui o íntimo da pessoa, abrangendo emoções, pensamentos e vitalidade. “Meu coração” preserva a imagem antropológica do texto.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão ou evidência da condição descrita. “Pois” é conciso, natural e adequado ao registro poético.
- source_word: שָׁכַחְתִּי
  choice: me esqueço
  rationale: Embora a forma hebraica seja perfeita, o contexto permite entendê-la como descrição presente e contínua da aflição. “Me esqueço” comunica essa experiência habitual sem excluir a leitura de uma ação já ocorrida, registrada em nota.
- source_word: מֵאֲכֹל
  choice: de comer
  rationale: A construção hebraica é literalmente “de comer”; depois de “esquecer-se”, essa também é a construção idiomática em português.
- source_word: לַחְמִי
  choice: o meu pão
  rationale: לֶחֶם significa literalmente “pão”, embora possa designar alimento em geral. A tradução mantém o termo concreto e sua textura poética.
