translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem sintática natural. Conserva-se a imagem concreta do coração abatido como a erva, bem como o verbo coordenado “secou”. O uso de “erva” evita restringir עֵשֶׂב a gramado, e “pão” mantém a expressão poética hebraica.
