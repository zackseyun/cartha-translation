  text: Pois ele olhou de sua santa altura; dos céus, o SENHOR contemplou a terra,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: olhou do alto
  rationale: Expressa o ato de olhar para baixo a partir de uma posição elevada, em linguagem natural e sem acrescentar conotações ausentes.
- source_word: מִמְּרוֹם קָדְשׁוֹ
  choice: do alto do seu santuário
  rationale: Preserva a construção hebraica, na qual קֹדֶשׁ pode designar o lugar santo ou santuário, e mantém a imagem espacial do paralelismo.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes.
- source_word: הִבִּיט
  choice: contemplou
  rationale: Distingue de modo natural o segundo verbo de visão e transmite um olhar atento, sem exceder o sentido contextual.
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: dos céus ... a terra
  rationale: Reproduz o movimento espacial do olhar desde os céus em direção à terra; o artigo torna a formulação idiomática em português.
theological_decisions:
- issue: Relação entre o 'alto do seu santuário' e os céus
  choice: Manter as duas expressões paralelas sem identificá-las ou diferenciá-las explicitamente
  alternative: Explicitar que o santuário santo é o próprio céu
  rationale: O paralelismo aproxima as imagens, mas o verso não exige uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e claro, com sintaxe poética. A repetição semântica dos dois verbos de visão foi preservada com variação lexical. A vírgula final mantém a continuidade sintática com o versículo seguinte.
