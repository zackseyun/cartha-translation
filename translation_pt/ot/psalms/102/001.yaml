  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: pt
  text: Ó Yahweh[a], ouve a minha oração, e que o meu clamor chegue a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Conserva o nome divino expresso pelo tetragrama e usa a interjeição vocativa natural em português.
- source_word: שִׁמְעָה
  choice: ouve
  rationale: Reproduz diretamente o imperativo masculino singular e mantém a força da súplica.
- source_word: תְפִלָּתִי
  choice: a minha oração
  rationale: Equivalente direto e natural de תְּפִלָּה com o sufixo de primeira pessoa.
- source_word: וְשַׁוְעָתִי
  choice: e o meu clamor
  rationale: שַׁוְעָה indica um grito angustiado, frequentemente por socorro; “clamor” preserva esse peso emotivo sem explicitar além do texto.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: Expressa naturalmente a direção marcada por אֶל com o sufixo de segunda pessoa.
- source_word: תָבֹוא
  choice: que ... chegue
  rationale: O imperfeito tem aqui valor volitivo; “que chegue” comunica em português a petição e a ideia de movimento até o destinatário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o tetragrama como nome próprio. “Yahweh” o translitera em vez de substituí-lo por um título; a nota registra as formas tradicionais.
translation_notes:
  register: Português moderno, claro e digno, com cadência apropriada à oração poética. O artigo antes de “minha oração” e “meu clamor” favorece a naturalidade em português brasileiro sem alterar o sentido.
