  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: pt
  text: Os filhos dos teus servos habitarão[a], e a descendência deles será estabelecida diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os descendentes dos teus servos permanecerão, e a posteridade deles será firmada diante de ti”.'
    reason: Alternativa lexical que explicita o sentido genealógico de בְּנֵי e apresenta equivalentes possíveis para שכן, זֶרַע e כון.
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן pode designar filhos ou descendentes. “Os filhos de” preserva a forma familiar do hebraico e é natural em português, sem exigir que a referência se limite à geração imediata.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: עֶבֶד pode significar servo ou escravo. Neste salmo dirigido a Deus, “servos” é a opção idiomática e contextualmente adequada.
- source_word: יִשְׁכּוֹנוּ
  choice: habitarão
  rationale: O verbo שכן significa habitar, morar ou residir. “Habitarão” conserva o sentido simples do hebraico sem acrescentar explicitamente a ideia de segurança.
- source_word: וְזַרְעָם
  choice: e a descendência deles
  rationale: זֶרַע, literalmente “semente”, é usado coletivamente para descendência. “Descendência” comunica esse valor em português atual e digno.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: A expressão significa literalmente “diante da tua face” e, por extensão, “na tua presença”. “Diante de ti” é conciso e preserva a formulação hebraica.
- source_word: יִכּוֹן
  choice: será estabelecida
  rationale: O nifal de כון expressa ser estabelecido, firmado ou tornado estável. “Será estabelecida” mantém a voz passiva e o sentido resultativo.
theological_decisions:
- issue: Se a promessa deve ser explicitada como especificamente pactual ou escatológica
  choice: Manter a afirmação geral de continuidade e estabilidade da descendência dos servos de Deus diante dele.
  alternative: Explicitar uma promessa pactual a Israel ou uma promessa escatológica de salvação final.
  rationale: O versículo afirma que os filhos habitarão e que sua descendência será estabelecida diante de Deus, mas não define por si só o mecanismo nem o horizonte teológico exato.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A segunda pessoa singular preserva o discurso direto dirigido a Deus. Evitou-se acrescentar “em segurança”, pois essa noção não está expressa lexicalmente em יִשְׁכּוֹנוּ.
