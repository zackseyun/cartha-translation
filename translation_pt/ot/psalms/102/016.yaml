  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: pt
  text: Pois Yahweh edificou Sião; manifestou-se em sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi visto em sua glória” ou “é visto em sua glória”. O verbo hebraico pode indicar tanto que Yahweh se manifestou quanto que foi visto.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação do contexto, preservando de modo natural o valor conectivo do hebraico.
- source_word: בָנָה
  choice: edificou
  rationale: Traduz o qatal como ação concluída. “Edificou” preserva a ideia de construir ou estabelecer uma cidade sem acrescentar explicitamente a noção de reconstrução.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém a forma tradicional e amplamente reconhecida do nome próprio em português, sem generalizá-lo como Jerusalém.
- source_word: נִרְאָה
  choice: manifestou-se
  rationale: O nifal de ראה pode indicar aparecer ou ser visto. “Manifestou-se” expressa naturalmente a aparição divina em português, enquanto a ambiguidade da voz é registrada em nota.
- source_word: בִּכְבוֹדוֹ
  choice: em sua glória
  rationale: Tradução direta que preserva a linguagem teologicamente significativa de כָּבוֹד e o valor da preposição.
theological_decisions:
- issue: Sentido da manifestação divina em נִרְאָה בִּכְבוֹדוֹ
  choice: manifestou-se em sua glória
  alternative: foi visto em sua glória / é visto em sua glória
  rationale: A forma hebraica admite tanto a ideia de aparecer quanto a de ser visto. O texto principal usa uma formulação natural para a manifestação divina, sem ocultar as outras possibilidades, apresentadas na nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Edificou” mantém concisão poética e evita acrescentar o prefixo semântico de “reconstruiu”.
