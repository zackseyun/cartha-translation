  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: pt
  text: Tu te levantarás e terás compaixão de Sião, pois é tempo de lhe mostrar favor[a], porque chegou o tempo determinado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de ser gracioso para com ela” ou “de favorecê-la”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o tempo marcado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: tu te levantarás
  rationale: O imperfeito qal na segunda pessoa masculina singular aponta, no contexto, para uma ação futura de Deus. A expressão preserva a imagem vívida do hebraico sem a transformar em paráfrase.
- source_word: תְּרַחֵם
  choice: terás compaixão
  rationale: O piel de רחם expressa compaixão ou misericórdia. “Ter compaixão” conserva o aspecto afetivo do termo e soa natural em português atual.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém-se o nome próprio do texto hebraico, sem o substituir interpretativamente por Jerusalém ou pelo povo de Deus.
- source_word: כִּי
  choice: pois / porque
  rationale: As duas ocorrências introduzem razões para a afirmação anterior. A variação idiomática evita repetição pesada sem eliminar a função explicativa.
- source_word: עֵת
  choice: é tempo
  rationale: A construção portuguesa comunica de modo natural que chegou o momento adequado para a ação indicada pelo infinitivo seguinte.
- source_word: לְחֶנְנָהּ
  choice: de lhe conceder favor
  rationale: O infinitivo de חנן com sufixo feminino singular refere-se a Sião e significa mostrar favor ou agir graciosamente para com ela. “Conceder favor” preserva esse sentido beneficente.
- source_word: בָא
  choice: chegou
  rationale: O perfeito de בוא apresenta como consumada a chegada do momento, com relevância presente.
- source_word: מוֹעֵד
  choice: o tempo determinado
  rationale: מוֹעֵד designa um tempo fixado ou designado. “Tempo determinado” comunica tanto a ocasião quanto seu caráter estabelecido.
theological_decisions:
- issue: Se Sião deve ser traduzida concretamente ou interpretada
  choice: Manter “Sião” como o objeto nomeado da compaixão divina.
  alternative: “Jerusalém” ou “o povo de Deus”.
  rationale: O hebraico nomeia Sião diretamente. Embora o nome possa ter ressonâncias mais amplas, a tradução não deve inserir essas identificações no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “tu” para refletir o discurso direto singular dirigido a Deus e preservar o tom poético. Os marcadores foram colocados junto às expressões a que suas alternativas efetivamente correspondem.
