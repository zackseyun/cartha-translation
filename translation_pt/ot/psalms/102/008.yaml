  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: pt
  text: Todo o dia, meus inimigos me insultam; os que zombam de mim juram por mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “juram por mim”. A expressão é difícil; também pode significar “juram contra mim” ou indicar que o nome ou a situação do salmista era usado em uma fórmula de maldição ou desprezo.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: O dia inteiro
  rationale: Expressão temporal idiomática que indica continuidade ao longo de todo o dia; é natural e clara em português.
- source_word: חֵרְפוּנִי
  choice: me insultam
  rationale: O verbo חרף expressa afronta, escárnio ou injúria. “Insultam” comunica com naturalidade a hostilidade verbal do contexto.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Correspondência direta e corrente para o substantivo possessivo hebraico.
- source_word: מְהוֹלָלַי
  choice: os que zombam de mim
  rationale: A forma é difícil, mas o contexto favorece a referência a pessoas que tratam o salmista com escárnio.
- source_word: בִּי נִשְׁבָּעוּ
  choice: usam meu nome em suas maldições
  rationale: Literalmente, a construção pode ser entendida como “juram por mim”. No contexto hostil, provavelmente indica que o salmista se tornou fórmula ou exemplo de maldição; a tradução explicita esse sentido provável sem eliminar a leitura literal, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem poética e o paralelismo foram preservados, enquanto a expressão hebraica obscura da segunda linha foi vertida pelo sentido contextual mais provável e acompanhada de nota.
