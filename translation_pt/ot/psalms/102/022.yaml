  text: בְּ/הִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו וּ֝/מַמְלָכ֗וֹת לַ/עֲבֹ֥ד אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: pt
  text: quando povos e reinos se reunirem[a] para servir[b] a Yahweh—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando povos e reinos forem reunidos”; a forma hebraica permite explicitar a ideia passiva.
    reason: lexical_alternative
  - marker: b
    text: Quando Deus é o objeto, “servir” também pode ser entendido ou traduzido como “adorar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: quando ... se reunirem
  rationale: 'A preposição בְּ com o infinitivo construto nifal de קבץ tem valor temporal: “quando/no reunir-se”. Em português, “quando ... se reunirem” expressa o acontecimento com naturalidade; a possibilidade de explicitar o valor passivo do nifal é preservada em nota.'
- source_word: עַמִּים
  choice: povos
  rationale: Mantém o plural corporativo e étnico do hebraico sem reduzi-lo à ideia moderna de Estados nacionais.
- source_word: יַחְדָּו
  choice: se reunirem
  rationale: A noção de estarem juntos é expressa idiomaticamente pelo verbo pronominal “reunir-se”, evitando o pleonasmo pouco elegante “se reunirem juntos”.
- source_word: וּ/מַמְלָכוֹת
  choice: e reinos
  rationale: Preserva a coordenação hebraica e o sentido de domínios ou reinos organizados.
- source_word: לַ/עֲבֹד
  choice: para servir
  rationale: “Servir” é o equivalente lexical mais amplo de עבד e mantém tanto a ideia de serviço quanto sua dimensão cultual quando Deus é o objeto; “adorar” consta como alternativa em nota.
- source_word: אֶת יְהוָה
  choice: a Yahweh
  rationale: O marcador de objeto direto אֶת não recebe tradução independente; o nome divino יהוה é transliterado como “Yahweh”, preservando o nome pactual presente no texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Amplitude de עבד quando Yahweh é o objeto
  choice: servir
  alternative: adorar
  rationale: O verbo pode designar serviço cultual e, portanto, adoração, mas seu sentido lexical é mais amplo. O texto principal conserva essa amplitude e a nota registra a alternativa contextual.
- issue: Voz do infinitivo nifal בְּהִקָּבֵץ
  choice: se reunirem
  alternative: forem reunidos
  rationale: A construção pronominal portuguesa é natural e pode descrever a reunião dos povos e reinos sem especificar o agente; a formulação passiva, também possível, é mantida em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para formar em português o sujeito coordenado natural “povos e reinos”. O travessão final foi mantido porque o versículo continua sintaticamente o pensamento do contexto.
