  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: pt
  text: Oração de uma pessoa aflita, quando desfalece[a] e derrama sua queixa[b] diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando se sente sobrecarregada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua meditação” ou “seu lamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Oração
  rationale: A abertura nominal é própria de um título de salmo; em português, não é necessário acrescentar artigo indefinido.
- source_word: לְעָנִי
  choice: de uma pessoa aflita
  rationale: O lamed indica relação no título, e עָנִי designa alguém aflito, oprimido ou pobre. “Pessoa aflita” preserva o sentido experiencial sem restringi-lo à pobreza nem explicitar gênero desnecessariamente.
- source_word: כִּי
  choice: quando
  rationale: Introduz a circunstância em que a oração é feita; o valor temporal é natural neste contexto.
- source_word: יַעֲטֹף
  choice: desfalece
  rationale: O verbo pode expressar fraqueza, desfalecimento ou a condição de estar sobrecarregado; “desfalece” é conciso e preserva a imagem de perda de forças.
- source_word: וְלִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de/na presença de”, e o nome divino é transliterado como Yahweh.
- source_word: יִשְׁפֹּךְ
  choice: derrama
  rationale: Mantém a metáfora hebraica de verter diante de Deus a angústia interior e soa natural em português.
- source_word: שִׂיחוֹ
  choice: sua queixa
  rationale: שִׂיחַ pode indicar reflexão, meditação, queixa ou lamento; no contexto de aflição e oração, “queixa” comunica bem o sentido lamentoso sem eliminar as alternativas lexicais, registradas em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a decisão doutrinária fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O título foi formulado de modo inclusivo e natural, sem apagar o singular do hebraico. As ambiguidades de יַעֲטֹף e שִׂיחוֹ foram preservadas por notas.
