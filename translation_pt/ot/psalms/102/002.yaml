base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: pt
  text: Não escondas de mim o teu rosto[a] no dia da minha aflição[b]. Inclina o teu ouvido para mim; no dia em que eu clamar, responde-me depressa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tua presença”. No idioma hebraico, “rosto” pode referir-se à presença favorável de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “no dia em que há aflição para mim”.'
    reason: lexical_alternative
  - marker: c
    text: 'Também pode ser traduzido: “apressa-te a responder-me”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Não escondas
  rationale: A partícula negativa com a forma verbal expressa uma súplica urgente. A tradução preserva o sentido básico de esconder sem enfraquecer o pedido.
- source_word: פָּנֶיךָ
  choice: o teu rosto
  rationale: Mantém a imagem concreta do hebraico, que pode representar a presença ou o favor de Deus.
- source_word: בְּיוֹם צַר לִי
  choice: no dia da minha aflição
  rationale: Expressa de modo natural a aflição que atinge o salmista e preserva a estrutura temporal do verso.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: Inclina para mim o teu ouvido
  rationale: Conserva a imagem poética e antropomórfica de Deus voltando atentamente o ouvido para a oração.
- source_word: בְּיוֹם אֶקְרָא
  choice: no dia em que eu clamar
  rationale: Preserva a repetição de 'no dia' e traduz קרא segundo o contexto de uma invocação urgente.
- source_word: מַהֵר עֲנֵנִי
  choice: responde-me depressa
  rationale: Transmite com clareza a urgência do advérbio מַהֵר ligado ao pedido de resposta.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus
  choice: Preservar no texto as imagens de 'rosto' e 'ouvido'
  alternative: Interpretar diretamente como 'presença' e 'ouve-me'
  rationale: As imagens hebraicas comunicam o favor e a atenção de Deus sem exigir uma afirmação sobre corporalidade; mantê-las conserva a força poética e a ambiguidade legítima.
- issue: Repetição da expressão temporal בְּיוֹם
  choice: Manter 'no dia' nas duas ocorrências
  alternative: Substituir por 'quando eu estiver aflito' e 'quando eu clamar'
  rationale: A repetição estrutura poeticamente a súplica e intensifica sua urgência.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o tom de oração. A sintaxe poética preserva as imagens concretas e a repetição do hebraico sem deixar o verso obscuro.
