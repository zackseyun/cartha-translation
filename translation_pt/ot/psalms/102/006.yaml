  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/006.yaml
  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: pt
  text: Sou como uma ave do deserto[a]; tornei-me como uma coruja entre as ruínas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou como um pelicano do deserto”. A identificação da ave designada pelo termo hebraico קָאַת é incerta; traduções tradicionais muitas vezes usam “pelicano”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como uma pequena coruja entre as ruínas”. A espécie exata designada pelo termo hebraico כּוֹס é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: Sou como
  rationale: O qal de דמה expressa comparação. O presente transmite naturalmente em português o estado descrito pelo perfeito hebraico e mantém o paralelismo poético.
- source_word: לִקְאַת
  choice: uma ave do deserto
  rationale: קָאַת é um nome de ave cuja identificação exata é incerta. A formulação genérica evita afirmar uma espécie não demonstrável, preservando a associação com lugares desolados.
- source_word: מִדְבָּר
  choice: deserto
  rationale: מִדְבָּר designa região erma ou não cultivada; “deserto” é claro, conciso e apropriado à imagem de isolamento.
- source_word: הָיִיתִי
  choice: tornei-me como
  rationale: O perfeito de היה pode indicar um estado resultante. “Tornei-me” conserva essa nuance sem eliminar a possibilidade de uma descrição do estado presente.
- source_word: כְּכוֹס
  choice: como uma coruja
  rationale: כּוֹס é aqui um nome de ave, provavelmente alguma espécie de coruja, embora a identificação zoológica exata seja incerta.
- source_word: חֳרָבוֹת
  choice: entre as ruínas
  rationale: O plural refere-se a ruínas ou lugares devastados. “Entre as ruínas” produz uma imagem natural em português e preserva o cenário de desolação.
