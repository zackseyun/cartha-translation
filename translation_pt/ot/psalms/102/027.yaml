  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: pt
  text: Mas tu és o mesmo[a], e os teus anos não terão fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “tu és ele”; expressão que pode significar “tu és o mesmo” ou “permaneces o mesmo”.'
    reason: Alternativa lexical que preserva a forma literal e a amplitude da expressão hebraica.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção, com o pronome independente, estabelece contraste com a transitoriedade da criação nos versículos anteriores; “Mas tu” expressa isso naturalmente em português.
- source_word: הוּא
  choice: és o mesmo
  rationale: Literalmente, “tu és ele”. No contexto, a expressão afirma a identidade permanente de Deus em contraste com a criação que muda e perece. “És o mesmo” preserva esse sentido em português corrente.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: e os teus anos
  rationale: שָׁנָה designa aqui anos no sentido temporal, com sufixo de segunda pessoa masculina singular; a tradução direta é natural e mantém a imagem poética.
- source_word: לֹא יִתָּמּוּ
  choice: não terão fim
  rationale: O verbo תמם significa chegar ao fim, completar-se ou acabar. “Não terão fim” comunica de modo claro e conciso a duração sem término.
theological_decisions:
- issue: A expressão “tu és ele” e a permanência divina
  choice: és o mesmo
  alternative: tu és ele; permaneces o mesmo
  rationale: A tradução comunica a identidade contínua de Deus no contraste poético com a criação transitória, sem acrescentar terminologia filosófica que não está expressa no hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” em continuidade com o discurso direto do salmo. A formulação mantém o paralelismo conciso e o contraste com a criação mutável.
