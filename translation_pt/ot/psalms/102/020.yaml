  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/020.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: pt
  text: 'para ouvir o gemido do prisioneiro,

    para libertar os filhos da morte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os destinados a morrer” ou “os condenados à morte”. Literalmente, o hebraico diz “filhos da morte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: O infinitivo construto com לְ expressa propósito ou resultado no contexto maior e mantém o paralelismo com לְפַתֵּחַ.
- source_word: אֶנְקַת
  choice: o gemido de
  rationale: O substantivo אנקה indica gemido ou suspiro causado por aflição; “gemido” comunica melhor a intensidade do sofrimento.
- source_word: אָסִיר
  choice: o prisioneiro
  rationale: אָסִיר designa alguém preso ou mantido em cativeiro; “prisioneiro” é direto e natural em português.
- source_word: לְפַתֵּחַ
  choice: para libertar
  rationale: Embora פתח signifique literalmente “abrir”, neste contexto descreve abrir a prisão ou a saída para pessoas confinadas, daí o sentido idiomático de libertar.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Preserva a construção hebraica e sua imagem forte, sem substituir silenciosamente o idioma por uma interpretação.
- source_word: תְמוּתָה
  choice: morte
  rationale: O substantivo significa “morte”; na expressão “filhos da morte”, provavelmente caracteriza pessoas destinadas a morrer ou condenadas à morte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “para” conserva a estrutura paralela dos dois infinitivos hebraicos; a imagem literal “filhos da morte” é mantida no texto e esclarecida em nota.
