lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a causa ou fundamento da lamentação e mantém com naturalidade a ligação poética com o contexto.
- source_word: אֵפֶר
  choice: cinzas
  rationale: Expressa a imagem de luto, humilhação e sofrimento; o plural é idiomático em português.
- source_word: כַּלֶּחֶם
  choice: como pão
  rationale: Preserva diretamente a comparação marcada pelo prefixo hebraico כְּ.
- source_word: אָכָלְתִּי
  choice: tenho comido
  rationale: O perfeito hebraico descreve a experiência do salmista; o pretérito perfeito composto comunica bem uma situação repetida ou prolongada que alcança o presente da lamentação.
- source_word: שִׁקֻּוַי
  choice: a minha bebida
  rationale: Refere-se ao que o salmista bebe, sem qualquer indicação contextual de uma oferta ritual.
- source_word: בִּבְכִי
  choice: com choro
  rationale: Preserva o substantivo hebraico 'choro' e entende a preposição como acompanhamento ou mistura; 'com lágrimas' é uma concretização natural, registrada em nota.
- source_word: מָסָכְתִּי
  choice: misturado
  rationale: O verbo denota misturar líquidos; a escolha conserva a metáfora de uma bebida misturada ao choro.
