  language: pt
  text: 'Pois tenho comido cinzas como pão

    e tenho misturado a minha bebida com choro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho misturado a minha bebida com lágrimas”. O hebraico diz “com choro”, expressão que também pode ser traduzida de modo mais concreto como “com lágrimas”.'
