translation_notes:
  register: Português moderno, claro e digno, com ordem sintática levemente poética. A repetição elíptica de “tenho” no segundo verso evita peso desnecessário sem alterar o aspecto verbal. O marcador da nota foi colocado junto à expressão a que a alternativa se refere.
