  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: pt
  text: Permaneço acordado e sou como um pássaro solitário sobre um telhado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um pardal sozinho sobre um telhado”. O hebraico צִפּוֹר é um termo geral para pássaro, embora “pardal” seja uma tradução tradicional mais específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Fico acordado
  rationale: Neste lamento, o verbo expressa vigília ou falta de sono, não a ação de montar guarda. A formulação é natural em português e preserva a experiência de permanecer desperto.
- source_word: וָאֶהְיֶה
  choice: e sou
  rationale: Dá continuidade à descrição poética sem impor uma sequência passada rígida; o presente combina com o estado expresso na primeira oração.
- source_word: כְּצִפּוֹר
  choice: como um pássaro
  rationale: צִפּוֹר é um termo geral para ave ou pássaro, às vezes de pequeno porte, mas não identifica necessariamente um pardal. “Pássaro” mantém essa amplitude lexical.
- source_word: בּוֹדֵד
  choice: solitário
  rationale: Expressa que o pássaro está sozinho ou isolado, em registro poético digno, sem acentuar necessariamente o sentimento subjetivo de solidão.
- source_word: עַל גָּג
  choice: sobre o telhado
  rationale: Reproduz de modo claro e idiomático a imagem hebraica de um pássaro isolado no alto de um telhado.
