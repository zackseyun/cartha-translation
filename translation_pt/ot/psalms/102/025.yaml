  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: pt
  text: Há muito tempo, fundaste a terra[a], e os céus são obra das tuas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançaste os alicerces da terra”.'
    reason: Alternativa lexical que explicita a imagem de יסד, “fundar, lançar os alicerces”.
lexical_decisions:
- source_word: לְפָנִים
  choice: Há muito tempo
  rationale: Expressa de modo natural o valor temporal de “antigamente/de outrora”, sem perder a referência a um passado remoto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelismo cósmico com “os céus” indica a terra como parte da criação, não uma região ou país.
- source_word: יָסַדְתָּ
  choice: fundaste
  rationale: Preserva de forma concisa a imagem de fundar ou lançar os alicerces, além de concordar com a segunda pessoa singular.
- source_word: וּמַעֲשֵׂה
  choice: e ... são obra
  rationale: A oração nominal hebraica requer a cópula em português; “obra” comunica naturalmente aquilo que foi feito.
- source_word: יָדֶיךָ
  choice: das tuas mãos
  rationale: Mantém a expressão antropomórfica e poética do hebraico, com referência direta a Deus.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: Mantém o plural tradicional e poético, apropriado ao paralelismo com “a terra”.
theological_decisions:
- issue: A linguagem da criação aplicada diretamente a Deus
  choice: 'Manter a segunda pessoa direta: Deus fundou a terra, e os céus são obra de suas mãos.'
  alternative: Tornar a formulação impessoal ou atenuar a imagem das mãos.
  rationale: O hebraico atribui diretamente a Deus a criação da terra e dos céus; a tradução conserva tanto essa afirmação quanto a imagem antropomórfica, sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com dicção poética acessível. Emprega-se “tu” para conservar a oração em segunda pessoa e “os céus” para manter o paralelismo cósmico.
