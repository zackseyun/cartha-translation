  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: pt
  text: Então as nações temerão[a] o nome de Yahweh, e todos os reis da terra, a tua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reverenciarão”. O verbo hebraico pode indicar temor no sentido de temor reverente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Então ... temerão
  rationale: O qal imperfeito de ירא pode indicar temor ou reverência. O futuro se ajusta ao contexto, e “então” explicita a consequência contextual da reconstrução de Sião mencionada no versículo anterior, embora a conjunção também possa ser traduzida simplesmente por “e”.
- source_word: גּוֹיִם
  choice: as nações
  rationale: O plural designa povos ou nações; “as nações” evita introduzir o contraste posterior associado a “gentios”.
- source_word: אֶת שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Preserva a construção hebraica e o conceito bíblico de “nome” sem o reduzir a reputação ou identidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: e todos os reis da terra
  rationale: כָל com o substantivo plural em estado construto é naturalmente expresso por “todos os reis”; “da terra” mantém a imagem e a abrangência do hebraico.
- source_word: אֶת כְּבוֹדֶךָ
  choice: a tua glória
  rationale: כבוד, com sufixo de segunda pessoa masculina singular, refere-se diretamente à glória de Deus. A elipse verbal da segunda oração é preservada de modo poético e inteligível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de o substituir por um título.
- issue: Sentido de ירא diante do nome divino
  choice: temerão
  alternative: reverenciarão
  rationale: “Temer” preserva a amplitude semântica e a tensão bíblica entre medo e reverência, enquanto a nota registra a leitura de temor reverente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe poética. “Então” explicita a relação consequencial com o contexto anterior. A segunda oração mantém a elipse do verbo (“temerão”), como no hebraico, sem sacrificar a compreensão.
