source:
  edition: WLC
  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: pt
  text: 'por causa da tua indignação e da tua ira,

    pois tu me levantaste[a] e me lançaste fora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: me carregaste.'
    reason: O verbo hebraico também pode significar “carregar” ou “levar”, embora o contraste com “lançaste fora” favoreça aqui “levantaste”.
lexical_decisions:
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A expressão preposicional tem valor causal neste contexto, não espacial.
- source_word: זַעַמְךָ
  choice: tua indignação
  rationale: Preserva a intensidade do termo e o distingue do substantivo de ira que vem em seguida.
- source_word: וְקִצְפֶּךָ
  choice: e da tua ira
  rationale: Mantém o paralelismo de dois termos próximos, mas não idênticos, para a cólera divina.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da situação descrita, com fluidez poética em português.
- source_word: נְשָׂאתַנִי
  choice: tu me levantaste
  rationale: No paralelismo com o ato de lançar fora, comunica a imagem vívida de alguém erguido antes de ser arremessado; a amplitude lexical do verbo é registrada em nota.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: e me lançaste fora
  rationale: Expressa tanto o movimento vigoroso de lançar quanto a ideia contextual de rejeição, em linguagem atual e digna.
theological_decisions:
- issue: Representação da ira divina
  choice: Conservar dois termos, “indignação” e “ira”, sem atenuá-los.
  alternative: Fundir ambos em uma única palavra ou interpretar a linguagem como simples emoção humana.
  rationale: O hebraico emprega dois substantivos sobrepostos, mas distintos, e atribui diretamente a Deus a ação e a ira; a tradução mantém essa tensão sem acrescentar uma explicação doutrinária.
- issue: Ação divina de levantar e lançar fora
  choice: Manter ambas as ações atribuídas diretamente a Deus.
  alternative: Reformular em voz passiva ou entender a queda apenas como consequência indireta.
  rationale: A forma verbal hebraica dirige as duas ações a Deus de maneira explícita; a tradução não suaviza essa afirmação poética.
translation_notes:
  register: Português poético, atual e digno, com tratamento na segunda pessoa singular (“tu”), comum na linguagem bíblica e claramente compreensível no português brasileiro. A divisão em dois versos conserva o paralelismo e a progressão causal do hebraico.
