  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: pt
  text: Eles o carregarão nas mãos[a], para que você não bata o pé contra uma pedra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre as palmas”; também pode ser traduzido como “eles o sustentarão” ou “o levantarão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: nas mãos
  rationale: A expressão hebraica significa literalmente “sobre as palmas/mãos”. “Nas mãos” preserva a imagem e é a formulação natural em português.
- source_word: יִשָּׂאוּנְךָ
  choice: Eles o carregarão
  rationale: O verbo נָשָׂא pode significar levantar, levar, carregar ou sustentar. “Carregarão” comunica com clareza a ação protetora sem acrescentar necessariamente a ideia de movimento para cima.
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz aqui uma finalidade preventiva ou um resultado evitado. A construção “para que não” é clara e corrente em português.
- source_word: תִּגֹּף
  choice: bata
  rationale: O verbo נָגַף descreve o choque do pé contra a pedra. “Bater o pé contra” reproduz diretamente a construção sem interpretar o ato como tropeço ou queda.
- source_word: בָּאֶבֶן
  choice: contra uma pedra
  rationale: Neste contexto, בְּ indica aquilo contra o qual o pé bate. Embora o hebraico tenha artigo na forma, a referência é genérica, e o português natural emprega “uma pedra”.
- source_word: רַגְלֶךָ
  choice: o pé
  rationale: O substantivo hebraico está no singular com sufixo de segunda pessoa masculina singular; a expressão idiomática portuguesa também favorece o singular.
theological_decisions:
- issue: Equilíbrio entre formulação tradicional e linguagem moderna baseada no hebraico
  choice: Eles o carregarão nas mãos
  alternative: Eles o sustentarão sobre as palmas
  rationale: A opção escolhida preserva a imagem de proteção do texto hebraico em linguagem atual, sem arcaísmo e sem introduzir uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o tratamento por “você” exigido pelo sufixo de segunda pessoa singular no contexto, enquanto o pronome objeto “o” evita repetição. A ordem da frase é natural em português e preserva a relação preventiva expressa por פֶּן.
