  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: pt
  text: Pois ele dará ordens aos seus anjos a seu respeito[a], para guardarem[b] você em todos os seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu favor”. A construção hebraica pode indicar tanto referência quanto benefício.
    reason: lexical_alternative
  - marker: b
    text: Ou “para cuidarem de você” ou “para protegerem você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da garantia anterior e preserva com naturalidade o fluxo explicativo do poema.
- source_word: מַלְאָכָיו
  choice: seus anjos
  rationale: Embora o termo possa significar “mensageiros”, neste contexto designa naturalmente seres celestiais enviados para proteger.
- source_word: יְצַוֶּה
  choice: dará ordens
  rationale: Expressa claramente a ação de emitir uma ordem; em português corrente, a construção com “aos seus anjos” é mais natural do que “comandará seus anjos”.
- source_word: לָּךְ
  choice: a seu respeito
  rationale: Com o verbo צוה, indica a pessoa acerca de quem ou em favor de quem a ordem é dada, e não o destinatário da ordem.
- source_word: לִשְׁמָרְךָ
  choice: para guardarem você
  rationale: Comunica diretamente a finalidade protetora de שׁמר. O infinitivo flexionado no plural explicita em português que os anjos executam a ordem, sem alterar o sentido.
- source_word: בְּכָל
  choice: em todos os
  rationale: Preserva de modo direto a preposição e a abrangência total do quantificador.
- source_word: דְּרָכֶיךָ
  choice: seus caminhos
  rationale: Mantém a metáfora hebraica, que pode abranger tanto trajetos concretos quanto o curso da vida.
theological_decisions:
- issue: Referente do sujeito implícito no verbo masculino singular
  choice: Deus é o sujeito de “dará ordens” e ordena aos seus anjos que protejam a pessoa interpelada.
  alternative: Tomar outro antecedente masculino singular como sujeito.
  rationale: O contexto imediato do salmo apresenta o SENHOR como aquele que protege, e a forma verbal masculina singular remete naturalmente a ele.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” torna a interpelação singular inequívoca; “em todos os seus caminhos” conserva a expressão poética e sua possível amplitude literal e figurada.
