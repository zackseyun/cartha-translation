  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: pt
  text: Porque tu[a], ó Yahweh, és o meu refúgio; fizeste do Altíssimo a tua morada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma interpretação comum do difícil texto hebraico: “Porque disseste: ‘Yahweh é o meu refúgio’, e fizeste do Altíssimo a tua morada.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Porque
  rationale: Introduz a razão ou o fundamento da proteção descrita no contexto e preserva o valor causal do hebraico.
- source_word: אַתָּה
  choice: tu
  rationale: Mantém explicitamente o pronome de segunda pessoa masculina singular e sua ênfase no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: מַחְסִי
  choice: o meu refúgio
  rationale: מַחְסֶה designa abrigo ou lugar de proteção; “refúgio” é claro e adequado à linguagem dos Salmos.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Preserva o título divino e usa a forma consagrada e natural em português.
- source_word: שַׂמְתָּ
  choice: fizeste
  rationale: O qal perfeito de שׂים pode significar estabelecer ou fazer de algo alguma coisa; com “morada”, “fizeste de” é idiomático.
- source_word: מְעוֹנֶךָ
  choice: a tua morada
  rationale: מָעוֹן significa habitação ou morada; a escolha é atual, digna e distinta de “refúgio” na primeira oração.
theological_decisions:
- issue: Sintaxe do falante e do destinatário em Salmos 91:9
  choice: 'Leitura como discurso direto à pessoa fiel: “Porque tu, ó Yahweh, és o meu refúgio; fizeste do Altíssimo a tua morada.”'
  alternative: '“Porque disseste: ‘Yahweh é o meu refúgio’, e fizeste do Altíssimo a tua morada.”'
  rationale: O texto massorético não contém um verbo explícito equivalente a “disseste” e apresenta uma construção condensada, com passagem de “meu refúgio” para “tua morada”. O texto principal preserva a redação hebraica com suplementação mínima; a leitura tradicional alternativa é registrada em nota por causa da dificuldade sintática.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” para reproduzir a segunda pessoa singular do hebraico. O ponto e vírgula torna legível a estrutura comprimida sem eliminar sua tensão sintática.
