id: PSA.91.1
reference: Psalms 91:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: pt
  text: Aquele[a] que habita no abrigo[b] do Altíssimo passará a noite[c] à sombra do Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quem habita”. O hebraico está no masculino singular, mas pode representar qualquer pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lugar secreto” ou “no esconderijo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “permanecerá” ou “se hospedará”. O verbo hebraico sugere passar a noite e, por extensão, permanecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Aquele que habita
  rationale: O particípio funciona como substantivo e descreve alguém cuja permanência é característica. “Habita” expressa residência contínua com mais naturalidade do que o literal “se assenta”.
- source_word: בְּסֵתֶר
  choice: no abrigo
  rationale: סֵתֶר indica um lugar oculto ou protegido. “Abrigo” comunica de modo natural tanto refúgio quanto proteção, sem dar ao texto um tom esotérico.
- source_word: עֶלְיוֹן
  choice: do Altíssimo
  rationale: Título divino que expressa supremacia. “Altíssimo” é a forma consagrada, clara e diretamente compreensível em português.
- source_word: בְּצֵל
  choice: à sombra
  rationale: Embora a preposição hebraica seja literalmente “em”, “à sombra” é a expressão idiomática portuguesa que preserva a imagem de proximidade e proteção.
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Traduz o título divino em vez de apenas transliterá-lo, comunicando claramente a ideia tradicionalmente associada a שַׁדַּי.
- source_word: יִתְלוֹנָן
  choice: passará a noite
  rationale: O verbo לון designa concretamente alojar-se ou pernoitar e, por extensão, permanecer. “Passará a noite” preserva a imagem concreta e o valor futuro da forma verbal.
theological_decisions:
- issue: Representação do participante masculino singular
  choice: Aquele que habita
  alternative: Quem habita
  rationale: O hebraico emprega um particípio masculino singular com possível sentido representativo. A tradução conserva a forma masculina sem limitar explicitamente a promessa apenas aos homens; a nota registra a alternativa genérica.
- issue: Tradução do título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: A tradução do título torna seu valor tradicional acessível ao leitor moderno e evita transformar desnecessariamente o título hebraico em nome transliterado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético entre habitar e passar a noite, preserva a imagem protetora da sombra e evita linguagem excessivamente arcaica.
