  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: pt
  text: Porque ele se apegou a mim[a], eu o livrarei; eu o colocarei num lugar alto e seguro[b], porque conhece o meu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porque ele me ama” ou “porque pôs em mim o seu afeto”. O verbo hebraico indica forte afeição, vínculo ou apego.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu o colocarei no alto” ou “eu o protegerei”. O verbo hebraico transmite a ideia de pôr alguém num lugar elevado e, por isso, seguro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: Nas duas ocorrências, introduz a razão da ação divina e mantém com naturalidade a força causal do hebraico.
- source_word: בִי חָשַׁק
  choice: se apegou a mim
  rationale: O verbo חָשַׁק com a preposição ב expressa forte afeição e vínculo dirigido a Deus. “Apegou-se a mim” preserva tanto a ligação afetiva quanto a ideia de adesão firme.
- source_word: וַאֲפַלְּטֵהוּ
  choice: eu o livrarei
  rationale: Expressa a ação prometida de Deus ao retirar alguém do perigo. “Livrarei” é corrente, claro e apropriado ao registro poético.
- source_word: אֲשַׂגְּבֵהוּ
  choice: eu o colocarei num lugar alto e seguro
  rationale: Preserva a imagem de pôr alguém numa altura inacessível e explicita, sem substituir a metáfora, a segurança que essa posição comunica.
- source_word: יָדַע
  choice: conhece
  rationale: O perfeito hebraico apresenta como fundamento da proteção uma realidade já estabelecida. O presente português expressa naturalmente esse conhecimento pessoal e relacional.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Mantém a expressão concreta do hebraico, que pode envolver a identidade e o caráter revelado de Deus sem precisar ser ampliada na tradução.
theological_decisions:
- issue: Linguagem de forte vínculo com Deus em חָשַׁק
  choice: se apegou a mim
  alternative: me ama; pôs em mim o seu amor
  rationale: A formulação conserva a amplitude da ligação intensa indicada pelo verbo, sem reduzi-la somente a sentimento nem impor uma explicação doutrinária.
- issue: Metáfora protetora em אֲשַׂגְּבֵהוּ
  choice: eu o colocarei num lugar alto e seguro
  alternative: eu o protegerei; eu o colocarei no alto
  rationale: A opção retém a elevação como imagem de inacessibilidade e proteção, evitando tanto achatar a metáfora quanto sugerir mera exaltação de posição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez natural no Brasil. A ordem das orações e o paralelismo causal foram preservados; as imagens hebraicas de apego e altura protetora permanecem visíveis no texto.
