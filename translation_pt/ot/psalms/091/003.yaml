  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: pt
  text: Pois ele livrará você da armadilha do caçador de aves[a] e da peste destruidora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do que arma laços”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da peste mortal” ou “da peste da destruição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da confiança expressa no contexto anterior, preservando naturalmente a força conectiva do hebraico.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente destaca o sujeito; em português, “ele” mantém essa referência sem acrescentar uma ênfase excessiva.
- source_word: יַצִּילְךָ
  choice: livrará você
  rationale: O hifil de נצל significa livrar ou resgatar de um perigo. A formulação é clara, solene e acessível em português internacional com boa legibilidade brasileira.
- source_word: מִפַּח
  choice: da armadilha
  rationale: פַּח designa uma armadilha ou laço. “Armadilha” é corrente e comunica de imediato a imagem concreta.
- source_word: יָקוּשׁ
  choice: do caçador de aves
  rationale: O termo designa quem arma laços, especialmente para capturar aves. Esta expressão evita o arcaísmo de equivalentes tradicionais e explicita apenas o que está lexicalmente presente.
- source_word: מִדֶּבֶר
  choice: da peste
  rationale: דֶּבֶר denota peste ou epidemia devastadora; “peste” preserva a gravidade e é amplamente compreensível.
- source_word: הַוּוֹת
  choice: destruidora
  rationale: A forma expressa ruína, destruição ou calamidades. O adjetivo “destruidora” conserva essa força sem limitar o sentido exclusivamente à letalidade.
theological_decisions:
- issue: Natureza dos perigos descritos
  choice: Manter as ameaças concretas — a armadilha e a peste — sem decidir se sua função poética também abrange perigos mais amplos.
  alternative: Interpretá-las apenas como perigos físicos literais ou apenas como ameaças espirituais metafóricas.
  rationale: O hebraico nomeia perigos reais, mas a poesia pode fazê-los representar a proteção divina de modo mais abrangente. A tradução preserva essa tensão.
- issue: Valor de הַוּוֹת
  choice: “destruidora”, conservando a ideia de ruína ou destruição.
  alternative: “mortal” ou “da destruição”.
  rationale: “Mortal” é possível pelo efeito contextual, mas estreita a expressão à morte; “da destruição” é mais formal, porém menos natural em português.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. “Caçador de aves” é transparente para leitores atuais; “livrará você” evita uma colocação pronominal marcadamente regional. Os marcadores aparecem junto aos termos aos quais se referem.
