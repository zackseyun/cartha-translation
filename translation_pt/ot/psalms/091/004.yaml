  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: pt
  text: Com sua plumagem ele cobrirá você[a], e sob suas asas você se refugiará; sua fidelidade é escudo e muralha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com suas penas ele cobrirá você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua verdade é escudo e broquel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: com sua plumagem
  rationale: אֶבְרָה designa a parte emplumada ou a plumagem da ave. “Plumagem” conserva a imagem aviária e soa mais natural em português atual do que “rêmiges” ou “penas de voo”.
- source_word: יָסֶךְ
  choice: ele cobrirá
  rationale: O hifil de סכך expressa a ação de cobrir com efeito protetor; “cobrirá” mantém tanto o sentido direto como a imagem da ave protegendo seus filhotes.
- source_word: לָךְ
  choice: você
  rationale: A forma hebraica se dirige ao ouvinte no singular. “Você” oferece leitura clara e amplamente compreensível, sem acrescentar gênero ao português.
- source_word: וְתַחַת
  choice: e sob
  rationale: Tradução espacial direta e idiomática que dá continuidade à imagem protetora.
- source_word: כְּנָפָיו
  choice: suas asas
  rationale: כָּנָף significa naturalmente “asa” neste contexto aviário.
- source_word: תֶּחְסֶה
  choice: você se refugiará
  rationale: חסה significa buscar ou tomar refúgio. A forma pronominal “se refugiará” é direta, natural e preserva a ação expressa pelo hebraico.
- source_word: צִנָּה
  choice: escudo
  rationale: צִנָּה designa um escudo, muitas vezes grande. “Escudo” comunica com clareza a metáfora defensiva, sem tornar o verso pesado.
- source_word: וְסֹחֵרָה
  choice: e muralha
  rationale: O termo raro tem sentido discutido e tradicionalmente recebe traduções como “broquel”. “Muralha” expressa proteção defensiva circundante, permanece compreensível e acompanha adequadamente “escudo”.
- source_word: אֲמִתּוֹ
  choice: sua fidelidade
  rationale: אֱמֶת pode indicar verdade, fidelidade ou confiabilidade. No contexto da proteção divina, “fidelidade” comunica de modo natural o caráter seguro e confiável de Deus.
theological_decisions:
- issue: O sentido de אֲמִתּוֹ na metáfora de proteção
  choice: sua fidelidade
  alternative: sua verdade
  rationale: Os dois sentidos são lexicalmente possíveis. “Fidelidade” se ajusta melhor à ideia de proteção confiável, sem inserir uma afirmação doutrinária além do texto; “verdade” é preservada em nota.
- issue: A identificação do segundo objeto defensivo, סֹחֵרָה
  choice: muralha
  alternative: broquel
  rationale: O vocábulo é raro e seu sentido exato é incerto. “Muralha” preserva a noção de defesa abrangente e é imediatamente compreensível; a tradução tradicional “broquel” permanece em nota para não ocultar a incerteza.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e vocabulário amplamente internacional. A construção mantém o paralelismo poético, a imagem aviária e a passagem para a metáfora militar. As notas preservam as alternativas lexicais genuínas sem sobrecarregar o texto principal.
