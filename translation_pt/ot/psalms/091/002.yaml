lexical_decisions:
- source_word: אֹמַר
  choice: Digo
  rationale: O imperfeito qal na primeira pessoa pode ter valor presente ou futuro/modal. Neste contexto de confissão poética, o presente expressa naturalmente uma declaração contínua, sem impor futuridade.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: 'A preposição ל marca aqui o destinatário da declaração: o salmista fala a Yahweh.'
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando seu caráter de nome próprio e seguindo a orientação do projeto.
- source_word: מַחְסִי
  choice: meu refúgio
  rationale: Mantém de forma clara e tradicional a imagem de abrigo e proteção.
- source_word: וּמְצוּדָתִי
  choice: e minha fortaleza
  rationale: Preserva a imagem defensiva de um lugar fortificado e forma um paralelismo natural com “meu refúgio”.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo da primeira pessoa.
- source_word: אֶבְטַח בּוֹ
  choice: em quem confio
  rationale: O presente comunica confiança firme e contínua; a construção relativa liga a declaração naturalmente a “meu Deus” em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio, enquanto a nota registra a tradução reverencial tradicional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. A colocação do verbo declarativo antes da fala e a expressão “em quem confio” são idiomáticas e preservam o sentido do hebraico.
