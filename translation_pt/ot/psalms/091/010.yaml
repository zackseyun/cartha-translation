  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: pt
  text: 'Nenhum mal acontecerá a você,[a]

    e nenhuma praga chegará perto da sua tenda.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nenhuma desgraça sobrevirá a você”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, sua morada ou seu lar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: acontecerá
  rationale: O verbo אנה, nesta forma, expressa a ideia de acontecer ou sobrevir. “Acontecerá a você” é natural em português atual e mantém a direção indicada por אֵלֶיךָ.
- source_word: רָעָה
  choice: mal
  rationale: Aqui רָעָה designa algo nocivo ou adverso. “Mal” preserva a amplitude do hebraico, podendo abranger dano, desgraça ou calamidade sem restringir o sentido ao mal moral.
- source_word: נֶגַע
  choice: praga
  rationale: נֶגַע pode indicar golpe, aflição ou praga. No contexto do Salmo 91, marcado por pestilência e perigos mortais, “praga” comunica adequadamente a ameaça destrutiva.
- source_word: יִקְרַב
  choice: chegará perto
  rationale: O Qal de קרב conserva a imagem espacial de aproximar-se. “Chegará perto” é claro e idiomático em português.
- source_word: אָהֳלֶךָ
  choice: sua tenda
  rationale: O substantivo significa literalmente “tenda”, embora possa representar por extensão a morada e o lar. A imagem concreta foi preservada no texto, com a extensão de sentido indicada em nota.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: A preposição אֶל indica movimento ou direção para o destinatário. “A você” se combina naturalmente com “acontecerá” em português brasileiro e internacional.
theological_decisions:
- issue: Natureza da proteção prometida
  choice: Apresentar o versículo como promessa poética direta de proteção divina, sem acrescentar qualificações interpretativas.
  alternative: Interpretá-lo explicitamente como garantia incondicional de que o fiel jamais sofrerá qualquer dano físico ou temporal.
  rationale: O hebraico enuncia a promessa com força direta. A tradução preserva essa força e a tensão teológica do texto, sem resolver além do versículo as questões mais amplas sobre sofrimento e providência.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O paralelismo poético foi disposto em dois versos. “Mal” mantém maior amplitude lexical que “dano”, enquanto as notas registram alternativas relevantes sem enfraquecer a afirmação do texto.
