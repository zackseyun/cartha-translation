  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: pt
  text: Eu o satisfarei com uma vida longa e lhe mostrarei a minha salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu livramento”. O termo hebraico pode indicar tanto o resgate de um perigo quanto a salvação em sentido mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: uma vida longa
  rationale: A expressão construta significa literalmente “extensão de dias”, mas funciona como um idiomatismo para longevidade. “Uma vida longa” comunica esse sentido em português natural e atual.
- source_word: אַשְׂבִּיעֵהוּ
  choice: Eu o satisfarei
  rationale: O hifil de שׂבע expressa fazer alguém ficar satisfeito ou plenamente saciado. A tradução mantém a pessoa como objeto do verbo, conforme o hebraico.
- source_word: וְאַרְאֵהוּ
  choice: e lhe mostrarei
  rationale: O hifil de ראה significa aqui “fazer ver” ou “mostrar”. A formulação preserva de modo natural a ação divina explícita.
- source_word: בִּישׁוּעָתִי
  choice: a minha salvação
  rationale: יְשׁוּעָה pode indicar tanto livramento concreto quanto salvação em sentido mais amplo. “A minha salvação” conserva essa amplitude, e a preposição בְּ introduz aquilo que Deus fará o fiel ver.
theological_decisions:
- issue: Amplitude de יְשׁוּעָה no encerramento de um salmo sobre proteção divina
  choice: salvação
  alternative: livramento
  rationale: “Salvação” preserva a amplitude teológica do termo hebraico sem excluir a ideia contextual de resgate diante do perigo. A alternativa é registrada em nota para manter a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Uma vida longa” traduz de forma idiomática אֹרֶךְ יָמִים; “lhe mostrarei” evita uma construção pesada sem perder a força causativa do hebraico.
