  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: pt
  text: Você não terá medo do terror da noite[a], nem da flecha que voa de dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pavor da noite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: você não terá medo
  rationale: O qal imperfeito na 2ª pessoa masculina singular, com לֹא, expressa naturalmente uma garantia futura no contexto, sem converter a frase em ordem.
- source_word: פַּחַד
  choice: terror
  rationale: O substantivo indica pavor ou terror ameaçador, sentido mais forte que o simples ato subjetivo de sentir medo.
- source_word: לָיְלָה
  choice: da noite
  rationale: A expressão idiomática preserva a relação poética entre o terror noturno e o perigo diurno.
- source_word: חֵץ
  choice: flecha
  rationale: Mantém a imagem concreta comum do hebraico, sem explicar como metáfora aquilo que o texto deixa figurativamente aberto.
- source_word: יָעוּף
  choice: que voa
  rationale: Reproduz de modo natural o qal imperfeito de עוּף e sua função de caracterizar a flecha.
- source_word: יוֹמָם
  choice: de dia
  rationale: É a forma idiomática corrente em português e mantém o contraste com a noite.
- source_word: מִן ... מִן
  choice: do ... nem da
  rationale: A coordenação portuguesa comunica os perigos diante dos quais não haverá medo sem repetir rigidamente a preposição hebraica.
theological_decisions:
- issue: Promessa/garantia ou ordem
  choice: 'garantia: “Você não terá medo”'
  alternative: 'ordem: “Não tenha medo”'
  rationale: לֹא com o imperfeito, neste contexto poético, é mais naturalmente entendido como garantia acerca da pessoa protegida. A tradução preserva essa ênfase sem impor um imperativo que a forma hebraica não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” torna explícita a segunda pessoa singular do hebraico; “terá medo” preserva a força de garantia futura. A ordem dos marcadores da camada inglesa foi normalizada, mantendo apenas a alternativa lexical pertinente ao texto português.
