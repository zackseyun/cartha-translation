  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: pt
  text: 'nem da peste que anda na escuridão,[a]

    nem da destruição que assola ao meio-dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “epidemia” em vez de “peste”; “destruição” também pode significar “flagelo mortal”. O hebraico emprega termos poéticos paralelos para ameaças destrutivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: peste
  rationale: O termo designa com frequência peste ou epidemia; “peste” é claro, corrente e mantém o paralelismo com uma ameaça destrutiva.
- source_word: בָּאֹפֶל
  choice: na escuridão
  rationale: אֹפֶל indica escuridão profunda ou trevas; a formulação preserva a imagem e o contraste com o meio-dia.
- source_word: יַהֲלֹךְ
  choice: anda
  rationale: O verbo הלך significa andar ou ir; “anda” conserva a personificação poética da peste.
- source_word: קֶּטֶב
  choice: destruição
  rationale: קֶטֶב pode indicar destruição ou flagelo mortal. “Destruição” preserva a amplitude da imagem sem restringi-la necessariamente a uma doença.
- source_word: יָשׁוּד
  choice: devasta
  rationale: O verbo expressa arruinar ou assolar violentamente; “devasta” é vívido, natural e adequado à força poética do hebraico.
- source_word: צָהֳרָיִם
  choice: ao meio-dia
  rationale: O substantivo significa meio-dia; esta opção é concisa e mantém o contraste temporal com “na escuridão”.
- source_word: מִן
  choice: nem da
  rationale: Embora a preposição signifique literalmente “de”, aqui ela dá continuidade, desde o versículo anterior, à lista de perigos dos quais a pessoa não precisa ter medo; “nem da” reproduz naturalmente essa estrutura.
