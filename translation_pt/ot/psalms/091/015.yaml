  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: pt
  text: Ele me invocará, e eu lhe responderei; estou com ele na angústia; eu o livrarei e o honrarei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Ele me invocará
  rationale: קרא com objeto pessoal, em contexto de oração, expressa invocar ou clamar a alguém. “Invocará” é natural, digno e deixa claro que Deus é o destinatário da oração.
- source_word: וְאֶעֱנֵהוּ
  choice: e eu lhe responderei
  rationale: ענה significa responder. A construção com “lhe” é idiomática em português e mantém a relação direta entre invocação e resposta.
- source_word: עִמּוֹ אָנֹכִי
  choice: estarei com ele
  rationale: A ordem hebraica dá destaque a “com ele”. Em português, “estarei com ele” preserva naturalmente a promessa de presença divina; o futuro harmoniza-se com a sequência de promessas, embora o hebraico seja literalmente “eu estou”.
- source_word: בְצָרָה
  choice: na angústia
  rationale: צָרָה designa aflição, aperto ou angústia. “Na angústia” conserva a intensidade existencial e é expressão corrente no registro bíblico moderno.
- source_word: אֲחַלְּצֵהוּ
  choice: eu o livrarei
  rationale: חלץ no piel pode significar retirar do perigo, resgatar ou livrar. “Livrarei” é claro e amplo, sem acrescentar uma imagem específica não exigida pelo contexto.
- source_word: וַאֲכַבְּדֵהוּ
  choice: e o honrarei
  rationale: כבד no piel significa honrar ou conferir honra. “Honrarei” é a opção mais natural quando o objeto é a pessoa protegida e evita a possível confusão de “glorificarei”.
theological_decisions:
- issue: Promessas da fala divina e condições não expressas
  choice: Manter a sequência direta de resposta, presença, livramento e honra
  alternative: Explicitar que as promessas dependem de condições adicionais de fidelidade
  rationale: O hebraico não introduz neste versículo condições explicativas. A tradução preserva as promessas como formuladas, sem importar qualificações doutrinárias.
- issue: Valor temporal de עִמּוֹ אָנֹכִי
  choice: “estarei com ele”, integrado à série de promessas
  alternative: “estou com ele”, reproduzindo mais formalmente a oração nominal hebraica
  rationale: No contexto da fala promissória, o português futuro soa natural e comunica presença durante a angústia. A escolha não restringe a presença divina ao futuro, mas apresenta a promessa do ponto de vista daquele que invocará.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A formulação conserva o paralelismo conciso e a progressão verbal do hebraico.
