base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: pt
  text: Você apenas olhará com seus olhos e verá a retribuição dos perversos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a paga dos perversos” ou “o castigo dos perversos”.
    reason: Alternativas lexicais para שִׁלֻּמַת, cujo sentido abrange paga, retribuição e, no contexto, castigo.
lexical_decisions:
- source_word: רַק
  choice: apenas
  rationale: 'Expressa a limitação enfática: a pessoa observará o destino descrito, sem sofrê-lo.'
- source_word: בְּעֵינֶיךָ
  choice: com os seus olhos
  rationale: Preserva a imagem hebraica da visão pessoal em linguagem portuguesa clara e natural.
- source_word: תַבִּיט
  choice: olhará
  rationale: O hifil de נבט significa olhar ou contemplar; “olhará” é simples, atual e combina com o verbo seguinte.
- source_word: וְשִׁלֻּמַת
  choice: a retribuição
  rationale: Conserva a ideia de retorno devido ou paga correspondente sem restringir o termo necessariamente a uma modalidade específica de punição.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Traduz a categoria moral substantivada de modo corrente e digno em português.
- source_word: תִּרְאֶה
  choice: e verá
  rationale: Representa diretamente o qal de ראה e mantém a coordenação entre olhar e ver.
theological_decisions:
- issue: Natureza do destino dos perversos
  choice: a retribuição dos perversos
  alternative: o castigo dos perversos; a paga dos perversos
  rationale: “Retribuição” preserva o sentido moral e judicial do substantivo hebraico, mas não define além do texto a forma exata da consequência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva o paralelismo verbal e a imagem hebraica dos olhos, sem recorrer a vocabulário arcaizante.
