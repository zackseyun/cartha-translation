base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: pt
  text: Mil poderão cair ao seu lado[a], e dez mil à sua direita; mas não chegará perto de você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mil cairão ao seu lado, e dez mil à sua direita”. Neste contexto poético, os imperfeitos hebraicos podem ter sentido futuro ou modal.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não se aproximará de você”. O sujeito não é expresso em hebraico; o contexto sugere a calamidade ameaçadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: poderão cair
  rationale: O imperfeito qal de נפל admite valor futuro ou modal neste contexto poético. “Poderão cair” preserva essa abertura sem transformar o verso numa previsão determinista.
- source_word: מִצִּדְּךָ
  choice: ao seu lado
  rationale: Embora מִן seja literalmente “de/desde”, com o verbo “cair” a expressão indica aqui a posição relativa à pessoa; “ao seu lado” é natural e mantém a imagem espacial.
- source_word: אֶלֶף
  choice: mil
  rationale: Mantém literalmente o numeral e o paralelismo poético.
- source_word: וּרְבָבָה
  choice: e dez mil
  rationale: רְבָבָה designa dez mil ou uma quantidade enorme; “dez mil” conserva a intensificação numérica do paralelismo.
- source_word: מִימִינֶךָ
  choice: à sua direita
  rationale: A expressão tem sentido espacial neste contexto. “À sua direita” é idiomático em português e preserva a estrutura paralela.
- source_word: אֵלֶיךָ
  choice: perto de você
  rationale: Com נגשׁ, אֶל indica movimento em direção à pessoa; integrado a “chegará perto”, comunica claramente a aproximação da ameaça.
- source_word: לֹא יִגָּשׁ
  choice: isso não chegará perto
  rationale: O verbo singular não traz sujeito expresso. “Isso” retoma de modo amplo a ameaça ou calamidade do contexto sem especificá-la além do texto, enquanto “chegará perto” traduz naturalmente a ideia de aproximação.
theological_decisions:
- issue: Sujeito implícito da oração final
  choice: Empregar “isso” como referência ampla à ameaça ou calamidade do contexto.
  alternative: Explicitar “a calamidade” ou “a praga”, ou reformular para evitar um sujeito expresso.
  rationale: O hebraico deixa o sujeito sem expressão. Como o português normalmente pede um sujeito recuperável, “isso” mantém a referência aberta e evita limitar o sentido a uma ameaça específica.
- issue: Valor dos imperfeitos hebraicos
  choice: Traduzir יִפֹּל modalmente por “poderão cair” e לֹא יִגָּשׁ como futuro negativo.
  alternative: 'Traduzir ambos como futuro categórico: “cairão” e “não chegará”.'
  rationale: No primeiro membro, o valor modal apresenta vividamente o que pode ocorrer ao redor do destinatário; na conclusão, o futuro negativo expressa a afirmação contrastante de proteção. A nota registra a leitura futura possível do primeiro verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo numérico e espacial do hebraico foi preservado. “Você” comunica diretamente o singular hebraico sem arcaísmo; “isso” conserva a indeterminação do sujeito final.
