  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: pt
  text: 'Você pisará o leão e a cobra[a];

    calcará o leão jovem e a serpente[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “áspide”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dragão”. O termo hebraico pode designar um grande réptil ou uma criatura marinha em outros contextos; aqui, “serpente” se ajusta melhor à lista de animais terrestres perigosos.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: sobre, expresso pela construção direta com “pisará”
  rationale: A preposição introduz aquilo sobre o que se pisa. Em português natural, o verbo “pisar” rege objeto direto neste sentido, sem necessidade de traduzir a preposição separadamente.
- source_word: שַׁחַל
  choice: leão
  rationale: Termo poético para leão. A tradução simples preserva o sentido e mantém a linguagem acessível.
- source_word: פֶתֶן
  choice: cobra
  rationale: Designa uma serpente venenosa, tradicionalmente identificada como áspide ou cobra. “Cobra” é clara para leitores modernos e conserva a imagem de perigo mortal.
- source_word: תִּדְרֹךְ
  choice: você pisará
  rationale: O verbo indica pôr os pés sobre ou calcar. “Pisará” é natural e preserva o valor futuro do imperfeito no contexto.
- source_word: תִּרְמֹס
  choice: calcará
  rationale: Expressa pisar com força ou subjugar sob os pés. “Calcará” mantém o paralelismo poético e a intensificação em relação a “pisará”.
- source_word: כְּפִיר
  choice: leão jovem
  rationale: Refere-se a um leão novo e vigoroso, não necessariamente a um filhote pequeno.
- source_word: תַנִּין
  choice: serpente
  rationale: Embora o termo possa designar um grande réptil, monstro marinho ou dragão em outros contextos, nesta lista de animais terrestres perigosos “serpente” se ajusta melhor ao paralelismo.
theological_decisions:
- issue: Se תַנִּין deve ser entendido de forma zoológica ou como criatura monstruosa
  choice: serpente
  alternative: dragão
  rationale: O contexto reúne animais perigosos sobre os quais a pessoa protegida triunfa. A leitura zoológica se encaixa naturalmente com leão, cobra e leão jovem, mas a alternativa tradicional “dragão” é preservada em nota para não eliminar a amplitude do termo hebraico.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “Você” explicita o sujeito masculino singular do hebraico sem marcar gênero em português. A alternância “pisará/calcará” preserva o paralelismo e a intensificação verbal do original.
