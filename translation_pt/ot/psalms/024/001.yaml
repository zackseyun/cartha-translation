id: PSA.24.1
reference: Psalms 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: pt
  text: 'Salmo de Davi.[a]


    A Yahweh pertencem a terra e tudo o que nela há,[b]

    o mundo e os que nele habitam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salmo para Davi”. A preposição hebraica pode indicar autoria, associação ou destinação.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Literalmente: “e sua plenitude”.'
    reason: literal_rendering
lexical_decisions:
- source_word: לְדָוִד
  choice: de Davi
  rationale: A expressão tradicional e natural em títulos de salmos conserva, em português, certa abertura entre autoria e associação; a possível ideia de destinação é registrada em nota.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente português consagrado e preciso para o termo técnico de um cântico acompanhado por música.
- source_word: לַיהוָה
  choice: A Yahweh pertencem
  rationale: Expressa naturalmente a oração nominal hebraica de posse e mantém o nome divino explícito.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelismo com תֵּבֵל e o alcance universal do verso favorecem 'terra', não 'país' ou 'território'.
- source_word: וּמְלוֹאָהּ
  choice: e tudo o que nela há
  rationale: Comunica em português corrente o sentido da expressão compacta 'sua plenitude'; a forma mais literal é preservada em nota.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: Equivalente natural para o mundo ordenado e habitado, nuance reforçada pelo membro paralelo seguinte.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: e os que nele habitam
  rationale: Preserva a força verbal do particípio hebraico e soa digna e natural em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza da posse declarada no primeiro verso
  choice: A Yahweh pertencem a terra e tudo o que nela há
  alternative: A terra e tudo o que nela há são de Yahweh
  rationale: A formulação escolhida mantém em destaque a posse divina e acompanha a ordem do hebraico sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo poético foi mantido em duas linhas; empregou-se linguagem digna e acessível, sem arcaísmos desnecessários.
