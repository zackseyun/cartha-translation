  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: pt
  text: 'Ergam a cabeça, ó portões;

    sejam erguidas, ó portas antigas[a],

    para que entre o Rei da glória.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “portas eternas”. A expressão hebraica pode indicar tanto portas de remota antiguidade como portas de duração perpétua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Ergam
  rationale: O imperativo plural mantém a ordem vívida dirigida aos portões personificados e soa natural em português.
- source_word: שְׁעָרִים
  choice: portões
  rationale: No contexto de uma entrada monumental, “portões” expressa com naturalidade os grandes acessos de uma cidade ou santuário.
- source_word: רָאשֵׁיכֶם
  choice: a cabeça
  rationale: Preserva a imagem literal e a personificação do hebraico. O singular distributivo é idiomático em português ao se dirigir coletivamente aos portões.
- source_word: וְהִנָּשְׂאוּ
  choice: sejam erguidas
  rationale: Reproduz o valor passivo do imperativo nifal e conserva o paralelismo poético com “Ergam”.
- source_word: פִּתְחֵי עוֹלָם
  choice: portas antigas
  rationale: “Portas” é natural no paralelismo com “portões”; עוֹלָם pode apontar para antiguidade remota ou duração perpétua. A leitura temporal “antigas” fica no texto, e a alternativa “eternas” é preservada em nota.
- source_word: וְיָבֹא
  choice: para que entre
  rationale: Expressa de modo natural o resultado ou propósito decorrente dos imperativos e traduz o movimento de entrada.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: o Rei da glória
  rationale: Mantém a construção titular elevada do hebraico sem reduzi-la a “rei glorioso”.
theological_decisions:
- issue: Preservar a personificação e a imagem de entrada real sem restringir sua interpretação
  choice: Manter a fala direta aos portões e às portas, inclusive a imagem de erguer a cabeça
  alternative: Parafrasear como uma simples ordem para abrir os portões
  rationale: O hebraico personifica diretamente os acessos. A tradução conserva a força poética e litúrgica sem impor uma identificação histórica ou messiânica específica ao Rei da glória.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. “Ó” preserva o vocativo elevado sem tornar o verso arcaico. A variação “portões/portas” acompanha o paralelismo hebraico, e “ergam/sejam erguidas” conserva sua repetição verbal.
