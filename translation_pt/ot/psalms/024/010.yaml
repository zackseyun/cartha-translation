  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: pt
  text: Quem é este Rei da glória? Yahweh dos Exércitos — ele é o Rei da glória.[a] Selá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título hebraico pode referir-se, de modo amplo, aos exércitos celestiais ou a poderes ordenados.
    reason: lexical_alternative
  - marker: b
    text: “Selá” provavelmente é uma indicação musical ou litúrgica; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Quem é este
  rationale: A pergunta hebraica é enfática. A formulação portuguesa é natural e conserva sua força retórica.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Rei da glória
  rationale: Preserva a construção nominal hebraica e o sentido de כָּבוֹד como glória, honra e majestade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: É uma forma clara e corrente em português para o título divino; o plural pode abranger os exércitos celestiais sem exigir que seu referente seja definido com maior precisão.
- source_word: הוּא
  choice: ele é
  rationale: Mantém o pronome explícito e enfático, sem acrescentar uma ideia de exclusividade que não está expressamente marcada.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, conserva-se sua transliteração, adaptada à acentuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico traz diretamente o nome divino. A transliteração preserva a distinção entre o nome pessoal e títulos como “Senhor”.
- issue: Sentido do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das hostes
  rationale: “Exércitos” é mais compreensível no português atual, enquanto a nota preserva a amplitude semântica do título e evita limitá-lo a forças humanas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação retórica direta. As iniciais maiúsculas em “Rei” e “Exércitos” assinalam seu uso no título divino, sem alterar o conteúdo lexical.
