base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: pt
  text: Tal é a geração dos que o buscam, dos que buscam a tua face, ó Jacó.[a] Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ó Jacó”. Algumas traduções entendem a expressão como referência ao Deus de Jacó ou à comunidade de Jacó.'
    reason: O vocativo é gramaticalmente possível, mas seu referente e sua relação com a frase precedente são discutidos; a nota preserva a ambiguidade sem alterar o texto principal.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Tal é a geração
  rationale: Expressa de modo natural a identificação feita pelo hebraico, mantendo a referência coletiva de דּוֹר.
- source_word: דֹּרְשָׁו
  choice: dos que o buscam
  rationale: Mantém o sufixo pronominal de terceira pessoa e a repetição semântica com o particípio seguinte.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: dos que buscam a tua face
  rationale: Conserva a imagem hebraica de buscar a face de alguém, linguagem relacional e cultual compreensível em português.
- source_word: סֶלָה
  choice: Selá
  rationale: Translitera o termo litúrgico ou musical de sentido incerto, sem lhe atribuir uma interpretação não demonstrável.
theological_decisions:
- issue: Identidade do vocativo יַעֲקֹב
  choice: ó Jacó
  alternative: ó Deus de Jacó / que buscam o Deus de Jacó
  rationale: O texto hebraico recebido diz literalmente “Jacó” e não contém a palavra “Deus”. A tradução preserva a forma e a tensão do texto em vez de suprir uma identificação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. A repetição “buscam” foi mantida por refletir a estrutura poética hebraica. “Tua” preserva o discurso direto no singular, e “Selá” permanece sem explicação interpretativa no corpo do versículo.
