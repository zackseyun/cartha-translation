  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: pt
  text: Aquele que tem mãos limpas e coração puro, que não elevou a minha alma à falsidade[a][b], nem jurou de modo enganoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente «minha alma». Muitas traduções seguem uma leitura contextual, «sua alma», em harmonia com a descrição na terceira pessoa ao longo do versículo.
    reason: textual_variant
  - marker: b
    text: Ou «à vaidade», «ao que é vazio». Alguns entendem que a expressão se refere a um ídolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַּפַּיִם
  choice: mãos limpas
  rationale: Preserva a imagem concreta hebraica da inocência e retidão manifestas na conduta; é também uma expressão natural em português.
- source_word: בַר לֵבָב
  choice: coração puro
  rationale: Expressa a pureza moral interior e mantém o paralelo entre a conduta exterior, representada pelas mãos, e a disposição interior, representada pelo coração.
- source_word: נָשָׂא ... נַפְשִׁי
  choice: voltou a minha alma para
  rationale: O verbo com נֶפֶשׁ descreve a orientação do ser, desejo ou devoção. A formulação comunica o sentido do idioma em português corrente, sem apagar a leitura massorética na primeira pessoa, «minha alma».
- source_word: לַשָּׁוְא
  choice: para o que é falso
  rationale: שָׁוְא pode indicar falsidade, vazio ou aquilo que não tem valor. A expressão escolhida se ajusta ao contexto ético sem restringir o termo à interpretação específica de idolatria.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: jurou com intenção de enganar
  rationale: Torna explícito em português natural que o juramento é feito de modo ou com propósito fraudulento, preservando a força moral de מִרְמָה.
theological_decisions:
- issue: Sufixo de primeira pessoa em נַפְשִׁי («minha alma») em um contexto sintático de terceira pessoa
  choice: Mantida no texto principal a leitura massorética «minha alma».
  alternative: «a própria alma» ou «sua alma», conforme a leitura contextual adotada por muitas traduções.
  rationale: Embora a terceira pessoa torne a alternativa mais fluente no contexto, o texto WLC fornecido traz o sufixo de primeira pessoa. A tradução conserva essa tensão textual em vez de corrigi-la silenciosamente.
- issue: Possível referência de שָׁוְא à idolatria
  choice: Traduzido de maneira ampla como «o que é falso».
  alternative: «vaidade», «o que é vazio» ou «um ídolo».
  rationale: O termo comporta vários sentidos relacionados a falsidade, vazio e inutilidade. Identificá-lo diretamente com um ídolo resolveria uma ambiguidade que o hebraico não resolve por si só.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Aquele que» mantém a ligação com a pergunta do versículo anterior. A coordenação «não... nem...» reproduz naturalmente as duas negações hebraicas.
