source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: pt
  text: Levantem suas cabeças, ó portas; ergam-se, ó portas antigas[a], para que entre o Rei da glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portas eternas”. A expressão hebraica pode indicar portas de grande antiguidade ou de duração permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Levantem
  rationale: Imperativo plural dirigido poeticamente às portas; preserva a ordem vívida e a personificação.
- source_word: שְׁעָרִים
  choice: portas
  rationale: Termo corrente para portas de cidade ou templo e natural no paralelismo poético.
- source_word: רָאשֵׁיכֶם
  choice: a cabeça
  rationale: Traduz literalmente a imagem hebraica, sem reduzi-la à paráfrase arquitetônica 'abram-se'.
- source_word: וּשְׂאוּ
  choice: ergam-se
  rationale: Retém a repetição sem produzir em português a expressão pouco natural 'levantem-se a si mesmas'; a personificação continua clara.
- source_word: פִּתְחֵי עוֹלָם
  choice: entradas antigas
  rationale: פֶּתַח designa uma abertura ou entrada, enquanto עוֹלָם pode indicar remota antiguidade ou duração indefinida. A formulação é natural e preserva o paralelismo sem decidir excessivamente o alcance temporal.
- source_word: וְיָבֹא
  choice: para que entre
  rationale: Expressa naturalmente em português o propósito ou resultado da ordem anterior.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: o Rei da glória
  rationale: Mantém a construção elevada e tradicional do título hebraico.
theological_decisions:
- issue: Preservação da personificação das portas, que têm 'cabeça'
  choice: Levantem a cabeça, ó portas
  alternative: Abram-se completamente, ó portas
  rationale: O hebraico apresenta explicitamente a imagem de portas com cabeça. Mantê-la conserva a força poética e litúrgica sem impor uma explicação arquitetônica.
- issue: Sentido de עוֹלָם em פִּתְחֵי עוֹלָם
  choice: entradas antigas
  alternative: entradas eternas / entradas de duração perpétua
  rationale: עוֹלָם admite tanto a ideia de antiguidade remota quanto a de duração indefinida ou perpétua. O texto principal usa a leitura contextual mais natural, e a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo 'ó' mantém o tom poético; a metáfora e a ambiguidade temporal do hebraico foram preservadas.
