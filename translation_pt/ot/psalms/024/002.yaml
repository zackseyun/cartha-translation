  text: כִּי ה֭וּא עַל יַמִּ֣ים יְסָדָ֑/הּ וְ/עַל נְ֝הָר֗וֹת יְכוֹנְנֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: pt
  text: "Pois foi ele quem a fundou sobre os mares\n e a firmou sobre os rios."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação do versículo anterior e mantém uma ligação poética natural em português.
- source_word: הוּא
  choice: foi ele quem
  rationale: Torna perceptível a ênfase do pronome independente hebraico sem recorrer a uma construção artificial.
- source_word: עַל יַמִּים
  choice: sobre os mares
  rationale: Conserva tanto o valor espacial da preposição quanto a imagem cosmológica e poética do plural יַמִּים.
- source_word: יְסָדָהּ
  choice: a fundou
  rationale: Expressa diretamente o ato de lançar o fundamento; o pronome feminino retoma «a terra» no versículo anterior.
- source_word: וְעַל נְהָרוֹת
  choice: e ... sobre os rios
  rationale: Preserva o paralelismo da segunda linha e traduz נְהָרוֹת pelo seu sentido lexical comum, sem apagar a imagem aquática.
- source_word: יְכוֹנְנֶהָ
  choice: a firmou
  rationale: Comunica a ideia de tornar firme ou estável e mantém uma distinção verbal em relação a יְסָדָהּ.
theological_decisions:
- issue: Imagem cosmológica da terra fundada sobre mares e rios
  choice: Manter de modo direto a linguagem poético-cosmológica do hebraico.
  alternative: Parafrasear a imagem como uma afirmação abstrata da estabilidade da criação ou adaptá-la a categorias científicas modernas.
  rationale: O texto celebra o domínio criador do SENHOR por meio de imagens aquáticas próprias da poesia hebraica. A tradução deve preservá-las sem impor uma explicação científica nem reduzi-las a metáfora abstrata.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético. «Pois» liga o verso ao anterior; «foi ele quem» preserva a ênfase de הוּא. «Fundou» e «firmou» reproduzem a progressão entre lançar o fundamento e dar estabilidade.
