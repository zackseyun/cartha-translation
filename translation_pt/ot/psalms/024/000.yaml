  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: pt
  text: 'Salmo de Davi.[a]


    A Yahweh[b] pertencem a terra e tudo o que nela há,[c]

    o mundo e os que nele habitam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode indicar um salmo dedicado a Davi ou relacionado a ele.
    reason: source_ambiguity
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente traduzido por “SENHOR”.'
    reason: divine_name
  - marker: c
    text: 'Literalmente: “e sua plenitude”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: de Davi
  rationale: Reproduz de modo natural a relação expressa pela preposição לְ no título, sem determinar se Davi é autor, destinatário ou tema.
- source_word: לַיהוָה
  choice: A Yahweh pertencem
  rationale: Expressa com clareza a construção hebraica de posse e mantém o nome divino representado pelo Tetragrama.
- source_word: מְלוֹאָהּ
  choice: tudo o que nela há
  rationale: Comunica em português corrente a ideia daquilo que enche a terra, sem perder o sentido abrangente do substantivo hebraico.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: Equivalente natural para a terra habitada, em paralelo poético com הָאָרֶץ.
- source_word: יֹשְׁבֵי בָהּ
  choice: os que nele habitam
  rationale: Mantém o particípio substantivado e a referência pronominal ao mundo.
theological_decisions:
- issue: Relação de Davi com o salmo no título
  choice: de Davi
  alternative: por Davi
  rationale: A preposição hebraica admite mais de uma relação; a formulação tradicional e natural preserva essa abertura melhor do que uma atribuição autoral explícita.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome pessoal divino do título hebraico אֲדֹנָי; a nota informa a convenção alternativa comum.
translation_notes:
  register: Português atual, claro e solene, com sintaxe poética natural. A inversão “A Yahweh pertencem” preserva a ênfase inicial do hebraico na pertença a Deus; “tudo o que nela há” evita a rigidez pouco idiomática de “sua plenitude” no texto principal.
