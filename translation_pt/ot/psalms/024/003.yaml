  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: pt
  text: Quem pode subir ao monte de Yahweh? E quem pode ficar de pé em seu lugar santo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «permanecer em seu lugar santo». O verbo hebraico pode indicar levantar-se, ficar de pé ou permanecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: O pronome interrogativo introduz uma pergunta retórica sobre quem está apto; «quem» é a equivalência portuguesa mais natural e concisa.
- source_word: יַעֲלֶה
  choice: pode subir
  rationale: O imperfeito qal de עלה significa «subir». Neste contexto litúrgico, «pode» comunica aptidão ou permissão, não mera ação futura.
- source_word: בְהַר
  choice: ao monte de
  rationale: הַר pode designar monte ou montanha. «Monte» é natural em português no contexto de Sião e preserva a imagem da elevação sagrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: וּמִי
  choice: E quem
  rationale: Preserva a conjunção e o paralelismo entre as duas perguntas poéticas.
- source_word: יָקוּם
  choice: pode permanecer
  rationale: קום pode significar levantar-se, ficar de pé ou manter-se. Aqui, «permanecer» exprime estar e manter-se na presença divina, em paralelo com o acesso indicado por «subir».
- source_word: בִּמְקוֹם
  choice: em ... lugar
  rationale: מָקוֹם significa amplamente «lugar»; a tradução evita especificar «santuário» além do que o texto hebraico afirma.
- source_word: קָדְשׁוֹ
  choice: seu lugar santo
  rationale: A construção com sufixo de terceira pessoa é expressa de modo idiomático como «seu lugar santo», preservando tanto a santidade quanto a referência possessiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força dos verbos no imperfeito nas perguntas retóricas
  choice: pode subir / pode permanecer
  alternative: subirá / permanecerá; consegue subir / ficar de pé
  rationale: As perguntas tratam da aptidão para aproximar-se e permanecer no lugar santo, sem reduzir os verbos a simples futuro nem resolver além do texto a natureza dessa aptidão.
- issue: Sentido de יָקוּם no contexto do acesso ao lugar santo
  choice: permanecer
  alternative: ficar de pé
  rationale: «Permanecer» comunica a ideia contextual de manter-se na presença de Deus; «ficar de pé» continua sendo uma alternativa mais literal, mas pode soar apenas postural em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o paralelismo das duas perguntas e a modalidade de aptidão expressa por «pode». «Monte» é preferido a «montanha» por ser idiomático no contexto bíblico de Sião.
