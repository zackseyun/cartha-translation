  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: pt
  text: Ele receberá de Yahweh a bênção e, do Deus da sua salvação, a justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão” ou “vindicação”. O termo hebraico pode ter sentidos de justiça, retidão, vindicação e ação salvadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: receberá
  rationale: Embora נָשָׂא tenha normalmente o sentido de levantar, levar ou carregar, com o objeto abstrato בְּרָכָה expressa idiomaticamente receber ou obter uma bênção.
- source_word: בְרָכָה
  choice: a bênção
  rationale: Mantém o substantivo no singular e comunica naturalmente o favor concedido por Deus.
- source_word: מֵאֵת יְהוָה
  choice: de Yahweh
  rationale: A preposição indica a fonte da bênção, e o nome divino é transliterado como Yahweh.
- source_word: וּצְדָקָה
  choice: e ... a justiça
  rationale: Justiça preserva a amplitude de צְדָקָה, que aqui pode incluir retidão concedida ou reconhecida, vindicação judicial e justiça salvadora.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: do Deus da sua salvação
  rationale: Reproduz a relação construta do hebraico e deixa em aberto tanto Deus como fonte da salvação quanto Deus caracterizado por seu agir salvador.
- source_word: יִשְׁעוֹ
  choice: sua salvação
  rationale: Salvação corresponde ao registro teológico do salmo e conserva a possibilidade de libertação ou livramento presente no termo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; Yahweh preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de צְדָקָה neste contexto
  choice: justiça
  alternative: vindicação ou declaração de justiça
  rationale: Justiça mantém a tensão entre retidão, veredito favorável e ação salvadora de Deus, sem limitar antecipadamente o termo a uma única dimensão.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática ajustada para explicitar as duas fontes paralelas sem perder o paralelismo hebraico. O artigo definido antes de “bênção” e “justiça” é natural em português; a nota preserva a amplitude semântica de צְדָקָה.
