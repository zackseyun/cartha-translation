  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: pt
  text: Quem é este Rei da glória? Yahweh, forte e poderoso; Yahweh, poderoso na batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poderoso na guerra”.
    reason: Alternativa lexical para מִלְחָמָה, que pode designar tanto uma batalha quanto a guerra.
lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é este
  rationale: Reproduz de modo natural a pergunta direta do hebraico e preserva a estrutura litúrgica de pergunta e resposta.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Rei da glória
  rationale: Mantém a relação construta e a força de título da expressão hebraica, além de conservar o refrão do salmo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עִזּוּז וְגִבּוֹר
  choice: forte e poderoso
  rationale: Distingue os dois termos coordenados e comunica com clareza sua ênfase cumulativa na força e no poder.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: poderoso na batalha
  rationale: Preserva a construção adjetiva do hebraico e seu sentido marcial sem acrescentar explicitamente o substantivo 'guerreiro'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo por um título; 'Yahweh' também mantém continuidade com a convenção editorial fornecida.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição de “Yahweh” e o paralelismo poético foram preservados.
