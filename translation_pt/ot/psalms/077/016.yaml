source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: pt
  text: As águas te viram, ó Deus; as águas te viram e se contorceram[a]; até as profundezas[b] estremeceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram em agonia”, “se agitaram” ou “tremeram”. O verbo hebraico pode indicar tremor convulsivo ou contorções semelhantes às dores do parto.
    reason: lexical_alternative
  - marker: b
    text: Ou “as águas profundas”. O termo hebraico se refere às grandes profundezas aquáticas ou oceânicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: te viram
  rationale: O qal perfeito de ראה com sufixo de segunda pessoa masculina singular significa diretamente “viram-te”. A repetição foi mantida para preservar a ênfase e o paralelismo poético.
- source_word: מַיִם
  choice: as águas
  rationale: “As águas” expressa com naturalidade a personificação poética e mantém a repetição presente no hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O termo funciona como vocativo; “ó” deixa clara a interpelação direta e conserva o tom poético solene.
- source_word: יָחִילוּ
  choice: se contorceram
  rationale: O verbo חול/חיל pode descrever agitação convulsiva, angústia semelhante à do parto ou tremor. “Se contorceram” preserva a imagem corporal vívida e evita repeti-la com o verbo seguinte.
- source_word: אַף
  choice: até
  rationale: 'Aqui a partícula intensifica a progressão: não apenas as águas, mas até as profundezas reagiram à presença de Deus.'
- source_word: יִרְגְּזוּ
  choice: estremeceram
  rationale: רגז costuma indicar tremor ou abalo. “Estremeceram” é corrente, poético e distingue este verbo do contorcer-se expresso na oração anterior.
- source_word: תְהֹמוֹת
  choice: as profundezas
  rationale: O plural de תְּהוֹם designa águas profundas ou profundezas oceânicas. “As profundezas” mantém a imagem cósmica em português moderno e natural.
theological_decisions:
- issue: Personificação das águas cósmicas diante de Deus
  choice: Manter as águas e as profundezas como realidades personificadas que reagem à presença de Deus, sem explicar a imagem dentro do versículo.
  alternative: Restringir a formulação a uma alusão direta à travessia do mar ou apresentá-la como combate contra poderes marinhos míticos.
  rationale: O hebraico retrata poeticamente as próprias águas recuando em agitação diante de Deus. A tradução conserva essa imagem e deixa suas associações históricas, intertextuais ou cosmológicas abertas à interpretação.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó Deus”, a repetição de “as águas te viram” e o paralelismo foram preservados. Os marcadores de nota foram posicionados junto aos termos efetivamente explicados.
