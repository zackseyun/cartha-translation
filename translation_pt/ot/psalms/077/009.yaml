lexical_decisions:
- source_word: הֲשָׁכַח
  choice: Será que ... se esqueceu
  rationale: A partícula interrogativa com שׁכח introduz uma pergunta retórica. A formulação preserva a angústia do salmista e soa natural em português.
- source_word: חַנּוֹת
  choice: de ser bondoso
  rationale: O infinitivo de חנן expressa agir com graça, bondade ou favor. “Ser bondoso” comunica o sentido em português corrente sem transformar a pergunta em afirmação.
- source_word: אֵל
  choice: Deus
  rationale: אֵל funciona aqui como título divino comum; “Deus” é a correspondência clara e idiomática.
- source_word: אִם
  choice: Ou
  rationale: No paralelismo, אִם introduz a segunda pergunta como alternativa à primeira. “Ou” torna explícita essa relação sem eliminar a força interrogativa.
- source_word: קָפַץ
  choice: fechou
  rationale: O verbo transmite literalmente a ideia de fechar. A escolha conserva a metáfora concreta do hebraico, embora “reteve” seja uma alternativa idiomática.
- source_word: בְּאַף
  choice: em sua ira
  rationale: אַף pode significar literalmente “nariz” e, por extensão, ira. A expressão possessiva explicita naturalmente em português que se trata da ira de Deus.
- source_word: רַחֲמָיו
  choice: a sua compaixão
  rationale: Embora a forma hebraica seja plural, o termo pode funcionar coletivamente para a compaixão ou misericórdia divina. O singular abstrato é natural em português; o plural é registrado na nota.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido preciso do termo litúrgico ou musical é incerto, ele é transliterado, com acento para orientar a leitura em português.
theological_decisions:
- issue: Se o versículo deve ser traduzido como perguntas retóricas ou como afirmações
  choice: Duas perguntas retóricas que expressam a aflição do salmista
  alternative: Afirmações como “Deus se esqueceu...”
  rationale: A partícula interrogativa e o contexto poético favorecem perguntas retóricas. Convertê-las em afirmações exageraria a queixa e eliminaria a tensão própria do lamento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura interrogativa e a metáfora de “fechar” foram preservadas; as alternativas lexicais aparecem em nota.
