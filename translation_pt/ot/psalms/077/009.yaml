  text: Será que Deus se esqueceu de ser bondoso? Ou, em sua ira, reteve sua compaixão? Selá[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que Deus se esqueceu de mostrar favor? Ou, em sua ira, reteve suas misericórdias?”'
