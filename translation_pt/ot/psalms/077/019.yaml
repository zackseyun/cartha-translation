  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: pt
  text: O teu caminho foi pelo mar[a], e as tuas veredas, pelas muitas águas; mas as tuas pegadas[b] não foram conhecidas.
  philosophy: optimal-equivalence
  footnotes:
