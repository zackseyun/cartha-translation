    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: passou pelo mar
  rationale: A preposição בְּ pode indicar localização, «no mar», mas, ligada a «caminho», aqui naturalmente apresenta o mar como a esfera ou rota do movimento. A forma verbal acrescentada em português torna a frase completa e comunica essa travessia sem explicitar além do hebraico.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: דֶּרֶךְ significa «caminho, via» e conserva tanto a imagem concreta quanto sua possível ressonância teológica.
- source_word: שביליך
  choice: as tuas veredas
  rationale: שְׁבִיל denota caminho ou trilha. «Veredas» preserva o paralelismo poético com «caminho» e mantém um registro digno e compreensível.
- source_word: בְּמַיִם רַבִּים
  choice: pelas muitas águas
  rationale: A expressão intensifica o primeiro membro. «Pelas muitas águas» comunica percurso no meio delas e retém a formulação poética hebraica, sem substituir «muitas» por uma interpretação como «profundas» ou «poderosas».
- source_word: עִקְּבוֹתֶיךָ
  choice: as tuas pegadas
  rationale: O substantivo pode designar pegadas, passos ou rastros. «Pegadas» torna vívida a imagem das marcas que deveriam ficar após a passagem.
- source_word: לֹא נֹדָעוּ
  choice: não se conheceram
  rationale: A forma passiva do verbo ידע é mantida de modo relativamente formal, preservando em aberto se as pegadas não foram vistas, reconhecidas ou descobertas.
theological_decisions:
- issue: Grau de explicitação da imagem do êxodo
  choice: Manter a imagem poética do caminho de Deus pelo mar sem nomear no texto principal a travessia do mar Vermelho.
  alternative: Explicitar que o versículo se refere diretamente à travessia do mar Vermelho.
  rationale: Embora o contexto evoque a libertação pelas águas, o hebraico não nomeia aqui o acontecimento. A tradução conserva a tensão entre a ação histórica de Deus e o caráter inescrutável de seus rastros.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A inversão moderada e «veredas» preservam o paralelismo do salmo; «passou» evita uma construção nominal pouco natural, enquanto «não se conheceram» mantém a ambiguidade do passivo hebraico.
