  rationale: A expressão aponta para dias antigos. “De outrora” mantém o tom poético e é compreensível no português moderno.
- source_word: שְׁנוֹת עוֹלָמִים
  choice: nos anos de tempos remotos
  rationale: עוֹלָמִים, em paralelo com “dias de outrora”, refere-se aqui à antiguidade distante, não necessariamente à eternidade absoluta. A formulação preserva o paralelismo e a extensão temporal.
