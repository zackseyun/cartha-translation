  text: נָחִ֣יתָ כַ/צֹּ֣אן עַמֶּ֑/ךָ בְּֽ/יַד מֹשֶׁ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: pt
  text: Guiaste o teu povo como um rebanho, pela mão de Moisés e Arão.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como ovelhas”. O hebraico צאן é um termo coletivo para um rebanho, especialmente de ovelhas ou cabras.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pela mão de Moisés e Arão”, expressão que significa por meio da atuação ou liderança deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: Guiaste
  rationale: O verbo na segunda pessoa do singular dirige-se a Deus e expressa a ação de conduzir. “Guiaste” é natural em português, mantém o aspecto concluído do perfeito hebraico e combina com a imagem pastoral.
- source_word: כַצֹּאן
  choice: como um rebanho
  rationale: O prefixo כ marca comparação, e צאן é um coletivo referente sobretudo a ovelhas e cabras. “Como um rebanho” preserva a imagem coletiva.
- source_word: עַמֶּךָ
  choice: o teu povo
  rationale: עם designa aqui o povo pertencente a Deus; “o teu povo” é claro, direto e apropriado ao contexto pactual e histórico.
- source_word: בְּיַד
  choice: pela mão de
  rationale: A expressão hebraica indica agência ou mediação. A formulação conserva a imagem do original e continua compreensível em português, enquanto a nota esclarece o valor idiomático.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
theological_decisions:
- issue: A atuação de Moisés e Arão na condução de Israel
  choice: Deus é o agente principal que guia o povo, servindo-se de Moisés e Arão como agentes humanos.
  alternative: Moisés e Arão seriam apenas referências históricas que acompanhariam a ação divina, sem função mediadora expressa.
  rationale: O verbo na segunda pessoa singular atribui diretamente a condução a Deus, enquanto בְּיַד מֹשֶׁה וְאַהֲרֹן indica a agência ou liderança humana por meio da qual essa condução ocorreu. A tradução mantém ambos os aspectos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas nominais tradicionais. A colocação pronominal e o pretérito “Guiaste” preservam o discurso direto dirigido a Deus. A expressão “pela mão de” retém deliberadamente o idioma hebraico, esclarecido em nota.
