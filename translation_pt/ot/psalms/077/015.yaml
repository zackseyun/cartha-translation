  text: גָּאַ֣לְתָּ בִּ/זְר֣וֹעַ עַמֶּ֑/ךָ בְּנֵי יַעֲקֹ֖ב וְ/יוֹסֵ֣ף סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: pt
  text: Resgataste o teu povo com o teu braço[a], os filhos de Jacó e de José[b]. Selá[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo teu braço”. A imagem do braço representa o grande poder de Deus em ação.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de Jacó e de José” pode ser uma forma poética de se referir a Israel; “José” talvez destaque as tribos que descendiam dele.
    reason: alternative_reading
  - marker: c
    text: “Selá” provavelmente é uma indicação litúrgica ou musical; seu significado exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: Resgataste
  rationale: O verbo גאל expressa resgate ou redenção, frequentemente com a ideia de agir em favor de alguém ligado por aliança ou parentesco. “Resgataste” é natural em português e preserva o sentido de libertação mediante ação redentora.
- source_word: בִּזְרוֹעַ
  choice: com o teu braço
  rationale: זְרוֹעַ significa literalmente “braço” e aqui retrata poeticamente o poder de Deus em ação. A formulação conserva tanto a imagem hebraica quanto o valor instrumental da preposição.
- source_word: עַמֶּךָ
  choice: o teu povo
  rationale: עַם com o sufixo de segunda pessoa masculina singular significa diretamente “teu povo”, a comunidade que pertence ao Deus a quem o salmista se dirige.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: בְּנֵי é a forma construta de “filhos”. A tradução formal preserva a expressão genealógica e nacional do hebraico sem substituí-la interpretativamente por “descendentes”.
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Jacó e José
  rationale: Os nomes são vertidos segundo a forma portuguesa tradicional. A tradução mantém ambos sem explicar no texto qual função representativa José desempenha.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto e provavelmente litúrgico ou musical, ele é transliterado na forma consagrada em português.
theological_decisions:
- issue: Designação nacional em “os filhos de Jacó e de José”
  choice: Manter literalmente os dois nomes e a expressão “filhos de”.
  alternative: Interpretar José como Efraim e Manassés, como o reino do norte ou entender toda a expressão simplesmente como “Israel”.
  rationale: O hebraico não esclarece a função representativa de José. A formulação preserva a ressonância poética e histórica, bem como a ambiguidade entre uma referência tribal mais restrita e uma designação de todo Israel.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conservam-se a metáfora concreta do braço, a expressão genealógica “filhos de” e a transliteração litúrgica “Selá”. A ordem dos marcadores foi normalizada para acompanhar sua ocorrência no texto.
