  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: pt
  text: Acaso o Senhor rejeitará para sempre[a] e nunca mais mostrará favor?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso o Senhor abandonará para sempre e nunca mais será favorável?”'
    reason: Alternativas lexicais para זנח e רצה, preservando respectivamente os sentidos de afastar/rejeitar e mostrar-se favorável.
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: Acaso ... para sempre
  rationale: A partícula interrogativa הֲ introduz uma pergunta retórica, e לְעוֹלָמִים expressa duração indefinida. “Acaso ... para sempre” reproduz com naturalidade a força da lamentação.
- source_word: יִזְנַח
  choice: rejeitará
  rationale: O verbo זנח indica rejeitar, repudiar ou pôr de lado. “Rejeitará” é atual, claro e preserva o sentido relacional.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: אֲדֹנָי é um título divino, não o nome YHWH; por isso, é traduzido naturalmente como “o Senhor”.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: e nunca mais
  rationale: A construção negada com יסף, infinitivo e עוֹד comunica que a ação não voltará a ocorrer. “Nunca mais” expressa de modo idiomático essa combinação.
- source_word: לִרְצוֹת
  choice: mostrará favor
  rationale: Neste contexto, רצה descreve disposição favorável ou aceitação. “Mostrar favor” torna explícita a dimensão relacional sem restringi-la a mero agrado emocional.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: Senhor
  rationale: O hebraico emprega o título Adonai, e não o nome divino YHWH. Traduzir por “o Senhor” preserva essa distinção e soa natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” assinala a pergunta retórica sem torná-la excessivamente coloquial; o futuro mantém a perspectiva angustiada do salmista.
