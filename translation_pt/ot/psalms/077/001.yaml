base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: pt
  text: 'Elevo a minha voz a Deus e clamo;

    elevo a minha voz a Deus, e ele me escuta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que ele me escute» ou «que ele me escute». O verbo hebraico ressalta ouvir com atenção.'
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: Elevo a minha voz a Deus
  rationale: A expressão nominal, literalmente «minha voz a Deus», indica que a voz é dirigida a Deus. «Elevo a minha voz» torna explícita em português a ação implícita, conserva a imagem da voz e permite repetir a frase, como no hebraico.
- source_word: וְאֶצְעָקָה
  choice: e clamo
  rationale: O verbo צעק expressa um clamor intenso, geralmente por socorro. «Clamo» é atual, digno e poeticamente conciso.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo designa aqui o Deus único e é traduzido no singular.
- source_word: וְהַאֲזִין אֵלָי
  choice: e ele me escuta
  rationale: אזן no hifil comunica ouvir com atenção. «Escuta» é natural em português e mantém o sentido de resposta atenta, sem reduzir a expressão à mera percepção sonora.
theological_decisions:
- issue: A resposta divina no segundo membro
  choice: 'Declaração: «e ele me escuta»'
  alternative: 'Valor volitivo ou final: «para que ele me escute» / «que ele me escute»'
  rationale: A construção hebraica é incomum e admite discussão quanto à força temporal ou modal. No encadeamento poético, a leitura declarativa é adequada e preserva a afirmação de que Deus atende ao salmista; a alternativa volitiva é registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e poético, com repetição intencional para reproduzir o paralelismo hebraico. «Elevo a minha voz» evita o pouco natural «minha voz é para Deus», mas conserva a imagem e a direção da fala.
