source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: pt
  text: Tu és o Deus que realiza maravilhas; tornaste conhecida a tua força entre os povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entre as nações». O termo hebraico pode se referir tanto a povos como a nações.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: o Deus
  rationale: O artigo definido identifica enfaticamente o Deus de Israel; a construção portuguesa «Tu és o Deus...» é natural e preserva essa ênfase.
- source_word: עֹשֵׂה
  choice: que realiza
  rationale: O particípio descreve uma ação característica de Deus. «Que realiza» comunica de modo natural e digno esse sentido contínuo e definidor.
- source_word: פֶלֶא
  choice: maravilhas
  rationale: Embora formalmente singular, o substantivo pode ter valor coletivo e designa feitos extraordinários. O plural «maravilhas» expressa naturalmente essa classe de atos divinos sem a especificidade adicional de «milagres».
- source_word: הוֹדַעְתָּ
  choice: tornaste conhecida
  rationale: A forma causativa de ידע significa «fazer conhecer». «Tornaste conhecida» preserva essa força e concorda com «a tua força».
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: A preposição ב favorece «entre», e עַמִּים pode indicar povos ou nações. «Povos» mantém o alcance amplo sem sugerir apenas Estados políticos.
- source_word: עֻזֶּךָ
  choice: a tua força
  rationale: עֹז denota força, poder ou potência. «Força» é direto, natural e adequado ao contexto dos feitos poderosos de Deus.
theological_decisions:
- issue: Alcance da manifestação divina em בָעַמִּים
  choice: entre os povos
  alternative: entre as nações
  rationale: A formulação preserva a preposição hebraica e o alcance plural da manifestação do poder divino, sem restringi-la a entidades políticas nem impor um programa teológico mais específico.
translation_notes:
  register: Português moderno, claro e digno, com emprego de «tu» em continuidade com a invocação direta do salmo. A ordem das orações e o paralelismo poético do hebraico foram preservados.
