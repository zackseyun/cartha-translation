  text: I will meditate on all your work[a], and I will ponder your deeds.
translation:
  language: pt
  text: Meditarei em toda a tua obra e refletirei sobre os teus feitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falarei dos teus feitos”. O verbo hebraico pode indicar tanto refletir ou meditar quanto falar ou discorrer; aqui, o paralelismo favorece o sentido reflexivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Meditarei
  rationale: O Qal na primeira pessoa do singular de הגה expressa meditação ou reflexão. O futuro em português comunica bem a nuance volitiva/prospectiva no contexto poético.
- source_word: בְכָל פָּעֳלֶךָ
  choice: em toda a tua obra
  rationale: A preposição ב marca o objeto da meditação. פֹּעַל está no singular com sentido coletivo; “toda a tua obra” preserva esse número e soa natural em português.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: sobre os teus feitos
  rationale: עֲלִילוֹת designa atos ou feitos. “Feitos” mantém a variação poética em relação a “obra”, sem acrescentar a ideia interpretativa de poderosos.
- source_word: אָשִׂיחָה
  choice: refletirei
  rationale: שיח pode indicar meditar/refletir ou falar/discorrer. “Refletirei” se ajusta ao paralelismo contemplativo e evita repetir “meditarei”, embora a possibilidade de fala seja preservada em nota.
