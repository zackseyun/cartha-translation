  text: אֶזְכְּרָ֣ה אֱלֹהִ֣ים וְ/אֶֽהֱמָיָ֑ה אָשִׂ֓יחָה וְ/תִתְעַטֵּ֖ף רוּחִ֣/י סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: pt
  text: Eu me lembro de Deus e gemo; medito[a], e meu espírito desfalece[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «expresso minha queixa»; o verbo hebraico pode indicar tanto reflexão meditativa quanto fala de lamento.
    reason: lexical_alternative
  - marker: b
    text: Ou «fica abatido» ou «é dominado pela angústia».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Eu me lembro
  rationale: O imperfeito/coortativo de זכר pode ter nuance presente, futura ou volitiva. No contexto imediato do lamento, o presente expressa com naturalidade a ação contínua do salmista.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O referente é o Deus de Israel, por isso o singular «Deus» comunica corretamente o sentido contextual.
- source_word: וְאֶהֱמָיָה
  choice: e gemo
  rationale: המה descreve agitação audível ou som de lamento; «gemo» é conciso e adequado à aflição do salmista.
- source_word: אָשִׂיחָה
  choice: medito
  rationale: שיח pode indicar reflexão interior, meditação ou expressão de queixa. «Medito» preserva o sentido reflexivo no paralelismo, enquanto a nota registra a possível nuance de lamento verbal.
- source_word: וְתִתְעַטֵּף
  choice: desfalece
  rationale: O hitpael de עטף pode descrever fraqueza ou a condição de estar dominado pela angústia. «Desfalece» comunica com clareza o abatimento interior.
- source_word: רוּחִי
  choice: meu espírito
  rationale: רוּחַ aqui designa a vida interior do salmista, não apenas sua respiração; «meu espírito» conserva essa dimensão.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo é incerta, ele é transliterado em vez de receber uma tradução conjectural.
theological_decisions: []
