  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: pt
  text: O som do teu trovão ressoou no redemoinho[a]; os relâmpagos iluminaram o mundo; a terra estremeceu e tremeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na roda”; o hebraico provavelmente evoca uma tempestade giratória, daí “no redemoinho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: O som de
  rationale: קוֹל pode significar “som” ou “voz”; com “trovão”, “o som” é natural em português e preserva a imagem auditiva.
- source_word: רַעַמְךָ
  choice: teu trovão
  rationale: O substantivo designa o trovão, e o sufixo de segunda pessoa masculina singular é preservado como “teu”, mantendo a fala dirigida a Deus.
- source_word: בַּגַּלְגַּל
  choice: no redemoinho
  rationale: גַּלְגַּל denota literalmente roda ou algo que gira, mas neste contexto meteorológico e poético provavelmente evoca uma tempestade giratória; “redemoinho” conserva essa imagem.
- source_word: הֵאִירוּ
  choice: iluminaram
  rationale: O hifil de אור significa dar luz ou iluminar; “iluminaram” preserva o sentido causativo e concorda naturalmente com o plural “relâmpagos”.
- source_word: בְרָקִים
  choice: os relâmpagos
  rationale: O hebraico está no plural; “os relâmpagos” é idiomático em português e mantém o número gramatical.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תֵּבֵל refere-se ao mundo, especialmente à terra habitada; “o mundo” é conciso e natural neste cenário cósmico.
- source_word: רָגְזָה
  choice: estremeceu
  rationale: O verbo expressa agitação ou tremor; “estremeceu” distingue este movimento do verbo seguinte e preserva a intensificação poética.
- source_word: וַתִּרְעַשׁ
  choice: e tremeu
  rationale: רעש denota sacudir ou tremer; “tremeu” mantém um segundo verbo distinto, reproduzindo o paralelismo intensificador do hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto cósmico da teofania, “a terra” é mais adequado que o sentido localizado “a região” ou “a terra natal”.
theological_decisions: []
