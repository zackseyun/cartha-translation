  text: אָ֭חַזְתָּ שְׁמֻר֣וֹת עֵינָ֑/י נִ֝פְעַ֗מְתִּי וְ/לֹ֣א אֲדַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/004.yaml
  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: pt
  text: Mantiveste abertas as minhas pálpebras[a]; estou perturbado[b] e não consigo falar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Mantiveste as vigílias dos meus olhos”. A expressão hebraica provavelmente indica que Deus impediu que os olhos do salmista se fechassem para dormir.
    reason: lexical_alternative
  - marker: b
    text: Ou “estou agitado” ou “estou transtornado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Mantiveste abertas
  rationale: O qal perfeito na segunda pessoa masculina singular se dirige a Deus. Com o objeto seguinte, a expressão comunica que Deus impediu que os olhos do salmista se fechassem.
- source_word: שְׁמֻרוֹת עֵינָי
  choice: as minhas pálpebras
  rationale: Literalmente, a expressão fala das “vigílias” ou “guardas” dos olhos. No contexto de uma noite sem sono, “pálpebras” transmite com clareza e naturalidade o provável sentido da imagem, enquanto a nota preserva sua forma incomum.
- source_word: נִפְעַמְתִּי
  choice: estou perturbado
  rationale: O nifal expressa forte agitação interior. “Perturbado” mantém a amplitude do termo sem decidir se a emoção é ansiedade, espanto ou desassossego.
- source_word: וְלֹא אֲדַבֵּר
  choice: e não consigo falar
  rationale: Embora a forma seja literalmente “e não falo”, o contexto sugere incapacidade causada pela perturbação, não uma simples decisão de permanecer calado.
theological_decisions:
- issue: A ação divina e a insônia do salmista
  choice: Manter explícito que Deus manteve abertas as pálpebras do salmista
  alternative: Descrever apenas o salmista como alguém que permaneceu acordado
  rationale: A segunda pessoa do verbo atribui diretamente a ação a Deus; a tradução preserva essa tensão sem explicar o motivo divino.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O tratamento por “tu” acompanha a fala direta a Deus e é mantido sem formas regionais coloquiais.
