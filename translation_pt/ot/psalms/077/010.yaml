base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: pt
  text: 'Então eu disse: “Esta é a minha aflição[a]: os anos da mão direita do Altíssimo”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha fraqueza” ou “minha enfermidade”. A palavra hebraica é difícil e pode indicar aflição, fraqueza ou doença.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Esta é a minha aflição: a mudança da mão direita do Altíssimo”. Alguns entendem que o hebraico se refere à mudança da mão direita do Altíssimo, em vez de “os anos” dela.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O wayyiqtol de אמר introduz a declaração seguinte na sequência do salmo; “Então eu disse” expressa com naturalidade essa transição narrativa.
- source_word: חַלּוֹתִי
  choice: minha aflição
  rationale: A forma é difícil e pode apontar para sofrimento, fraqueza ou enfermidade. “Aflição” se ajusta ao contexto de lamento sem restringir indevidamente o sentido.
- source_word: הִיא
  choice: Esta é
  rationale: O pronome feminino provavelmente aponta para a condição ou constatação do salmista; “Esta é” torna a referência explícita e natural em português.
- source_word: שְׁנוֹת
  choice: os anos da
  rationale: A leitura mais direta entende o termo como plural de “ano”. A possível relação com o sentido de “mudança” é mantida em nota devido à reconhecida dificuldade do verso.
- source_word: יְמִין
  choice: mão direita
  rationale: Preserva a imagem hebraica tradicional, que na poesia bíblica frequentemente representa poder e ação salvadora.
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: É o título divino consagrado e natural em português, preservando a ideia de suprema exaltação.
theological_decisions:
- issue: Interpretação de um verso hebraico notoriamente difícil
  choice: A fala identifica a aflição presente do salmista em relação aos anos associados à mão direita do Altíssimo.
  alternative: '“Então eu disse: ‘Minha tristeza é que a mão direita do Altíssimo mudou’” ou “Então eu disse: ‘Esta é a minha fraqueza: os anos da mão direita do Altíssimo’”.'
  rationale: חַלּוֹתִי e שְׁנוֹת admitem mais de uma análise. O texto principal apresenta uma leitura plausível e relativamente formal, enquanto as notas preservam as alternativas relevantes sem eliminar a tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A imagem bíblica “mão direita” e o título “Altíssimo” foram preservados. A pontuação mantém a construção fragmentária do hebraico sem forçar uma explicação no corpo do verso.
