source:
  edition: WLC
  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: pt
  text: Lembrarei os feitos de Yah[a]; sim, recordarei as tuas maravilhas de tempos antigos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mencionarei os feitos de Yah” ou “relatarei os feitos de Yah”. O verbo também pode indicar lembrar em voz alta ou fazer menção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as tuas maravilhas de outrora” ou “as tuas maravilhas de muito tempo atrás”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Lembrarei
  rationale: O hifil de זכר pode significar lembrar, mencionar ou relatar. “Lembrarei” preserva o ato deliberado de trazer à memória e mantém a repetição poética com אֶזְכְּרָה, sem especificar que se trata de proclamação pública.
- source_word: מַעַלְלֵי
  choice: os feitos
  rationale: מַעֲלָלִים designa ações ou feitos; “feitos” é natural, digno e adequado ao paralelismo poético.
- source_word: יָהּ
  choice: Yah
  rationale: É a forma poética abreviada do nome divino, distinta do tetragrama יהוה; a transliteração preserva essa distinção presente no hebraico.
- source_word: כִּי
  choice: sim
  rationale: Neste contexto, כִּי pode introduzir uma reafirmação enfática. “Sim” liga naturalmente os dois membros em português sem impor uma relação causal pouco clara.
- source_word: אֶזְכְּרָה
  choice: recordarei
  rationale: A forma volitiva de primeira pessoa expressa decisão firme. “Recordarei” transmite essa resolução e evita uma repetição estilisticamente pesada, embora preserve o mesmo campo lexical de זכר.
- source_word: מִקֶּדֶם
  choice: de tempos antigos
  rationale: A expressão aponta para o passado remoto ou os tempos de outrora, sem necessariamente indicar o princípio absoluto.
- source_word: פִּלְאֶךָ
  choice: as tuas maravilhas
  rationale: פלא designa uma maravilha ou ato extraordinário; o plural natural em português corresponde ao sentido coletivo e ao paralelismo com “feitos”.
theological_decisions:
- issue: Tradução da forma poética abreviada do nome divino יָהּ
  choice: Yah
  alternative: SENHOR
  rationale: O texto hebraico emprega יָהּ, não o tetragrama יהוה. Manter “Yah” conserva a distinção lexical e poética sem equiparar silenciosamente as duas formas.
- issue: Valor discursivo de כִּי entre os dois membros
  choice: sim
  alternative: pois
  rationale: A partícula admite valor explicativo ou enfático. O paralelismo parece reafirmar a decisão de lembrar; “sim” preserva essa leitura, enquanto “pois” apresentaria a segunda oração mais explicitamente como fundamento causal.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. O paralelismo hebraico foi mantido; “lembrar/recordar” conserva o vínculo lexical sem produzir repetição excessivamente rígida. A forma “Yah” preserva o nome divino abreviado do texto-fonte.
