  text: As nuvens derramaram água; os céus fizeram ouvir a sua voz; sim, as tuas flechas moviam-se de um lado para outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus relâmpagos moviam-se de um lado para outro”. O hebraico diz literalmente “as tuas flechas”, provavelmente como imagem dos relâmpagos nesta manifestação de Deus em meio à tempestade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם
  choice: derramaram água
  rationale: Expressa o jorro abundante indicado pelo verbo e soa natural em português, sem perder a imagem poética.
- source_word: עָבוֹת
  choice: as nuvens
  rationale: Designa massas densas de nuvens; “as nuvens” é claro e idiomático no contexto da tempestade.
- source_word: קוֹל נָתְנוּ
  choice: fizeram ouvir a sua voz
  rationale: Preserva a personificação e a formulação hebraica de “dar voz/som”, sem explicitar interpretativamente “trovejar”.
- source_word: שְׁחָקִים
  choice: os céus
  rationale: O termo pode indicar céus ou nuvens. “Os céus” evita repetir “nuvens” e conserva o paralelismo poético.
- source_word: אַף
  choice: sim
  rationale: Marca a intensificação e o avanço enfático do último membro do verso com concisão natural em português.
- source_word: חֲצָצֶיךָ
  choice: as tuas flechas
  rationale: Mantém o sentido lexical direto de “flechas” e deixa que o contexto de tempestade sugira a metáfora dos relâmpagos.
- source_word: יִתְהַלָּכוּ
  choice: cruzaram o céu
  rationale: Comunica movimento em várias direções de maneira poética e compreensível; “o céu” é complemento contextual, não expresso no hebraico, que torna a imagem natural em português.
theological_decisions:
- issue: 'Imagem teofânica: flechas literais ou relâmpagos metafóricos'
  choice: Manter “as tuas flechas” no texto principal.
  alternative: Traduzir diretamente como “os teus relâmpagos”.
  rationale: O substantivo hebraico significa literalmente “flechas”, enquanto o contexto de teofania em meio à tempestade aponta provavelmente para relâmpagos. A tradução conserva a imagem marcial e registra a interpretação meteorológica em nota, sem eliminar a tensão poética.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética. A formulação preserva a personificação dos céus e a imagem marcial das flechas. O marcador [a] aparece no texto principal.
