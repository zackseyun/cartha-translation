lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O sufixo de segunda pessoa em דַּרְכֶּךָ favorece a leitura vocativa; em português, «Ó Deus» explicita naturalmente a interpelação.
- source_word: בַּקֹּדֶשׁ
  choice: em santidade
  rationale: קֹדֶשׁ pode designar santidade ou o lugar santo. A leitura abstrata caracteriza o modo de agir de Deus sem excluir a alternativa locativa, registrada em nota.
- source_word: דַּרְכֶּךָ
  choice: o teu caminho
  rationale: «Caminho» preserva tanto a ideia do curso das ações de Deus quanto a de sua maneira de agir.
- source_word: מִי
  choice: que
  rationale: Na construção idiomática portuguesa «que deus», introduz a comparação retórica de modo natural.
- source_word: אֵל
  choice: deus
  rationale: O substantivo comum em minúscula representa qualquer pretensa divindade comparada ao Deus de Israel.
- source_word: גָּדוֹל
  choice: tão grande
  rationale: «Grande» é o sentido lexical direto; «tão» torna natural em português a construção comparativa com «como», sem acrescentar conteúdo substantivo.
- source_word: כֵּאלֹהִים
  choice: como Deus
  rationale: Preserva a comparação marcada por כְּ e entende אֱלֹהִים como referência singular ao Deus verdadeiro no contexto.
theological_decisions:
- issue: Sentido de בַּקֹּדֶשׁ
  choice: O caminho de Deus é caracterizado pela santidade
  alternative: O caminho de Deus está no santuário
  rationale: O hebraico admite tanto o sentido abstrato quanto o locativo/cúltico. O texto principal mantém a ênfase na santidade de Deus, e a nota conserva a leitura do santuário sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com forma vocativa clara. A repetição «deus... Deus» conserva o contraste hebraico entre qualquer divindade e o Deus verdadeiro.
