base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: pt
  text: No dia da minha aflição, busquei o Senhor; minha mão ficou estendida durante a noite e não enfraqueceu.[a] Minha alma recusou-se a ser consolada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha mão fluía durante a noite e não afrouxava”. A imagem hebraica é difícil; o texto principal a entende como uma mão mantida estendida em oração persistente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: No dia da minha aflição
  rationale: Mantém a expressão temporal e verte צָרָה por “aflição”, termo natural e digno no contexto de lamento.
- source_word: אֲדֹנָי דָּרָשְׁתִּי
  choice: busquei o Senhor
  rationale: דרשׁ, quando dirigido a Deus, significa buscá-lo; אֲדֹנָי é título e, por isso, é traduzido como “o Senhor”.
- source_word: יָדִי
  choice: minha mão
  rationale: Preserva o singular do hebraico, sem emenda ou generalização.
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: ficou estendida durante a noite, sem se cansar
  rationale: O verbo נגר evoca literalmente fluxo ou derramamento, mas a combinação com “minha mão” provavelmente descreve a mão persistentemente estendida em oração. פוג pode indicar enfraquecer, afrouxar ou cessar; “sem se cansar” comunica a persistência física sem resolver por completo a imagem difícil.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  choice: Minha alma recusou ser consolada
  rationale: Reproduz diretamente a recusa expressa por מאן, o sentido passivo de נחם e a linguagem poética de נפשׁ.
theological_decisions:
- issue: Tradução de אֲדֹנָי
  choice: o Senhor
  alternative: Senhor
  rationale: O texto traz o título אֲדֹנָי, e não o nome divino YHWH. O artigo produz uma formulação natural em português sem confundir título e nome.
- issue: Imagem da mão durante a oração
  choice: minha mão ficou estendida
  alternative: minha mão fluía/foi derramada
  rationale: A leitura principal expressa a provável postura de oração, enquanto a nota conserva a imagem lexical incomum e a incerteza do hebraico.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e o paralelismo do lamento foram preservados; a ambiguidade da imagem hebraica foi registrada em nota.
