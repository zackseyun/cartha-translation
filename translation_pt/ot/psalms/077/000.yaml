  text: לַ/מְנַצֵּ֥חַ עַֽל ידיתון לְ/אָסָ֥ף מִזְמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: pt
  text: Ao regente[a]. Conforme Jedutum[b]. Salmo de Asafe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Ao diretor de música» ou «Ao mestre de canto».
    reason: lexical_alternative
  - marker: b
    text: «Conforme Jedutum» pode indicar um estilo musical, uma melodia, um conjunto ou o grupo ligado a Jedutum.
    reason: cultural_note
  - marker: c
    text: Ou «para Asafe»; a preposição hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, a forma designa quem dirige a execução musical. «Ao regente» é conciso, natural em português e não restringe indevidamente a função à regência de coro.
- source_word: עַל
  choice: Conforme
  rationale: Neste cabeçalho musical, a preposição provavelmente introduz uma indicação de execução, melodia, estilo ou grupo. «Conforme» conserva essa relação sem escolher uma dessas possibilidades.
- source_word: יְדוּתוּן
  choice: Jedutum
  rationale: Nome próprio ou designação associada a um grupo musical, transliterado na forma tradicional e amplamente reconhecível em português.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: A preposição hebraica pode indicar autoria, associação ou destinação. A formulação tradicional «de Asafe» é natural e mantém alguma abertura sem afirmar explicitamente que Asafe foi o autor.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o equivalente corrente e preciso do termo hebraico que identifica o gênero da composição.
theological_decisions:
- issue: Relação de Asafe com o salmo
  choice: Salmo de Asafe
  alternative: Salmo para Asafe
  rationale: O hebraico não determina por si só se a relação é de autoria, associação ou dedicação. A tradução segue a expressão portuguesa convencional, enquanto a nota explicita a ambiguidade real.
translation_notes:
  register: Português moderno, digno e conciso, adequado ao formato de um título de salmo. A segmentação em três frases curtas reflete as unidades do cabeçalho e evita uma cadeia pesada de complementos.
