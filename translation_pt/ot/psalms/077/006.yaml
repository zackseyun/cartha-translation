  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: pt
  text: Lembro-me da minha canção durante a noite[a]; medito em meu coração[b], e meu espírito[c] busca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha melodia” ou “minha música”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reflito com meu coração” ou “converso com meu coração”; o verbo hebraico pode indicar meditação interior ou fala reflexiva.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “meu íntimo” ou “minha mente”; aqui, “espírito” se refere ao ser interior do salmista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Lembro-me
  rationale: O imperfeito/coortativo poético pode expressar presente, futuro ou volição. O presente se ajusta à sequência introspectiva do salmo sem eliminar totalmente seu caráter deliberativo.
- source_word: נְגִינָתִי
  choice: minha canção
  rationale: נְגִינָה pode designar canção, melodia ou música instrumental; “canção” é natural no contexto poético e mantém a referência pessoal.
- source_word: בַּלָּיְלָה
  choice: durante a noite
  rationale: Expressa com naturalidade o valor temporal da locução hebraica e preserva a atmosfera noturna do verso.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: medito em meu coração
  rationale: שׂיח pode indicar reflexão interior ou fala meditativa. A formulação portuguesa comunica a interioridade de modo natural, embora o hebraico diga literalmente “com meu coração”.
- source_word: וַיְחַפֵּשׂ
  choice: busca
  rationale: O verbo חפשׂ descreve uma procura ou investigação cuidadosa. O presente mantém a progressão reflexiva, e a ausência de objeto preserva a abertura do hebraico.
- source_word: רוּחִי
  choice: meu espírito
  rationale: רוּחַ aqui aponta para o íntimo do salmista; “espírito” conserva a amplitude antropológica do termo sem reduzi-lo apenas à mente.
theological_decisions:
- issue: Relação entre “coração” e “espírito”
  choice: 'Manter ambos como termos distintos: “coração” e “espírito”.'
  alternative: Uniformizá-los como “meu íntimo” ou “minha mente”.
  rationale: O paralelismo hebraico aproxima os conceitos, mas não necessariamente os identifica; conservar os dois termos evita impor uma antropologia sistemática ao verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados. “Busca” permanece sem complemento para refletir a formulação aberta do hebraico, enquanto as notas registram ambiguidades lexicais relevantes.
