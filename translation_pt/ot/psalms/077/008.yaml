base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: pt
  text: Acaso o seu amor leal cessou para sempre? Sua promessa chegou ao fim para todas as gerações?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua palavra chegou ao fim para todas as gerações?”'
    reason: Alternativa lexical mais formal para אֹמֶר.
lexical_decisions:
- source_word: הֶאָפֵס
  choice: cessou
  rationale: O perfeito com prefixo interrogativo pergunta se algo terminou ou desapareceu. “Cessou” é natural e preserva a força da lamentação.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressão temporal comum que comunica duração permanente de modo claro e idiomático.
- source_word: חַסְדּוֹ
  choice: o seu amor leal
  rationale: חֶסֶד expressa amor fiel e comprometido. “Amor leal” preserva tanto o afeto quanto a fidelidade, sem tornar explícita uma formulação pactual ausente do termo isolado.
- source_word: גָּמַר
  choice: chegou ao fim
  rationale: O verbo indica conclusão ou cessação; esta formulação comunica claramente o temido término da palavra divina.
- source_word: אֹמֶר
  choice: sua promessa
  rationale: Embora o sentido lexical básico seja “palavra” ou “declaração”, o paralelismo e o contexto da confiabilidade divina favorecem “promessa”. A alternativa mais formal é mantida em nota.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: A expressão descreve continuidade ao longo de gerações sucessivas. Esta é uma formulação portuguesa corrente e mantém a repetição do hebraico.
theological_decisions:
- issue: Se אֹמֶר deve ser traduzido formalmente como “palavra” ou contextualmente como “promessa”
  choice: promessa
  alternative: palavra
  rationale: No contexto, o salmista questiona a permanência do favor e da confiabilidade de Deus. “Promessa” comunica o provável sentido da palavra empenhada de Deus, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de perguntas retóricas e a tensão da lamentação foram preservadas.
