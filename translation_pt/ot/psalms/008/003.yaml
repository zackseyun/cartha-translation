base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: pt
  text: 'Quando contemplo os teus céus[a], obra dos teus dedos,

    a lua e as estrelas que firmaste —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois vejo os teus céus [...] que estabeleceste.”'
    reason: 'Alternativa lexical: כִּי pode ser causal (“pois”), אֶרְאֶה pode ser traduzido por “vejo”, e כּוֹנָנְתָּה por “estabeleceste”.'
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto poético, a conjunção introduz a circunstância que leva à pergunta do versículo seguinte. “Quando” produz essa ligação naturalmente, sem excluir a possível nuance causal.
- source_word: אֶרְאֶה
  choice: contemplo
  rationale: O imperfeito de ראה descreve aqui o ato de olhar atentamente. “Contemplo” é corrente, poético e mais expressivo que o simples “vejo”, sem o ar arcaico de outras opções.
- source_word: שָׁמֶיךָ
  choice: os teus céus
  rationale: Mantém o plural hebraico e o sufixo de segunda pessoa, preservando a amplitude cósmica da expressão.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: obra dos teus dedos
  rationale: A formulação portuguesa usa “obra” em sentido coletivo e preserva literalmente a imagem antropomórfica dos dedos de Deus, com naturalidade poética.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: a lua e as estrelas
  rationale: Os artigos definidos, embora não expressos em hebraico, são naturais em português para esses corpos celestes específicos.
- source_word: כּוֹנָנְתָּה
  choice: firmaste
  rationale: O polel de כון comunica estabelecer, tornar firme ou dispor. “Firmaste” é conciso, poético e conserva a ideia de estabilidade e ordenação.
theological_decisions:
- issue: Linguagem antropomórfica para a ação criadora de Deus
  choice: Manter “dos teus dedos”
  alternative: “feita por tuas mãos” ou “que fizeste”
  rationale: A imagem hebraica apresenta a criação como obra íntima e aparentemente fácil de Deus. Preservá-la mantém a força poética sem afirmar corporeidade física divina.
- issue: Relação lógica introduzida por כִּי
  choice: Traduzir por “Quando” no texto principal
  alternative: “Pois” ou “Porque”
  rationale: O hebraico permite uma leitura circunstancial ou causal. A leitura circunstancial liga-se com fluidez à pergunta do versículo seguinte, enquanto a alternativa causal é preservada em nota.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. O travessão final mantém a frase aberta para a pergunta do versículo seguinte.
