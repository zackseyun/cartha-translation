lexical_decisions:
- source_word: צִפּוֹר
  choice: as aves
  rationale: Embora esteja no singular morfológico, o substantivo tem sentido coletivo nesta enumeração; o plural é a forma natural de expressá-lo em português.
- source_word: שָׁמַיִם
  choice: dos céus
  rationale: Preserva o plural hebraico e o tom poético elevado, sem perder clareza para o leitor moderno.
- source_word: וּ/דְגֵי הַ/יָּם
  choice: e os peixes do mar
  rationale: Reproduz de modo direto a construção hebraica; “peixes” expressa naturalmente o valor coletivo em português.
- source_word: עֹבֵר
  choice: tudo o que percorre
  rationale: O particípio singular pode ter força coletiva e resumir de modo amplo a vida marinha; esta formulação mantém essa abrangência sem impor uma referência mais estreita.
- source_word: אָרְחוֹת
  choice: as veredas
  rationale: Mantém a imagem poética de caminhos ou rotas no mar; “veredas” é digna, inteligível e adequada ao paralelismo do salmo.
- source_word: יַמִּים
  choice: dos mares
  rationale: Conserva o plural do hebraico e sua amplitude poética.
