  text: sheep and oxen[a], all of them, and also the beasts of the field.
translation:
  language: pt
  text: 'ovelhas e bois[a], todos eles,

    e também os animais do campo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rebanhos e gado [...] e também os animais do campo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹנֶה
  choice: ovelhas
  rationale: O termo designa animais domésticos de pequeno porte criados em rebanhos, sobretudo ovelhas e cabras. “Ovelhas” é concreto, natural e conciso no paralelismo poético; “rebanhos” permanece uma alternativa possível.
- source_word: וַאֲלָפִים
  choice: e bois
  rationale: O termo se refere a bovinos domésticos. “Bois” forma um par poético natural com “ovelhas”, enquanto “gado” é uma alternativa mais abrangente.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Preserva o pronome sufixado e a ênfase abrangente do hebraico.
- source_word: וְגַם
  choice: e também
  rationale: Mantém tanto a conjunção quanto a força aditiva, ampliando a lista para além dos animais domésticos.
- source_word: בַּהֲמוֹת
  choice: os animais
  rationale: Neste contexto, o plural tem sentido amplo. “Animais” é claro e natural em português e evita que “feras” sugira exclusivamente animais perigosos.
- source_word: שָׂדָי
  choice: do campo
  rationale: Reproduz de modo conciso a imagem poética hebraica do campo ou da terra aberta.
theological_decisions: []
