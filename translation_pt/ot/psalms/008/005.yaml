  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: pt
  text: Contudo, fizeste-o um pouco menor que Deus[a] e o coroaste de glória e honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que os seres celestiais”; a Septuaginta traz “que os anjos”, tradução refletida em Hebreus 2:7.
    reason: Registra a amplitude semântica de אֱלֹהִים e a variante interpretativa da antiga tradução grega com relevância canônica.
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: fizeste-o... menor
  rationale: O hifil de חסר, seguido de uma comparação com מִן, indica colocar alguém numa condição inferior; esta formulação é natural em português e preserva o sentido comparativo.
- source_word: מְּעַט
  choice: um pouco
  rationale: No contexto hebraico, expressa mais naturalmente um pequeno grau de inferioridade, não um período breve.
- source_word: מֵאֱלֹהִים
  choice: que Deus
  rationale: Embora אֱלֹהִים possa designar Deus, deuses ou seres celestiais conforme o contexto, 'Deus' é a leitura mais direta do texto hebraico; a alternativa relevante é mantida em nota.
- source_word: וְכָבוֹד
  choice: glória
  rationale: כָּבוֹד comunica glória, honra ou dignidade e combina com o paralelismo poético elevado.
- source_word: וְהָדָר
  choice: honra
  rationale: הָדָר pode significar esplendor, majestade ou honra; 'honra' expressa aqui a dignidade concedida e evita redundância excessiva com 'glória'.
- source_word: תְּעַטְּרֵהוּ
  choice: o coroaste
  rationale: O piel de עטר evoca coroar ou circundar; 'coroaste' preserva com clareza a metáfora régia.
theological_decisions:
- issue: Referente e força representativa do pronome singular
  choice: Manter o singular masculino em “fizeste-o” e “o coroaste”
  alternative: Empregar “os fizeste”, “a humanidade” ou formas plurais
  rationale: O hebraico usa sufixos pronominais masculinos singulares, retomando o ser humano representativo no contexto; conservar o singular mantém a forma e deixa implícita sua dimensão coletiva.
- issue: Tradução de אֱלֹהִים
  choice: Deus
  alternative: seres celestiais; anjos; deuses
  rationale: A primazia do hebraico favorece 'Deus' no texto principal. 'Anjos' representa a tradição da Septuaginta refletida em Hebreus 2:7, enquanto 'seres celestiais' é uma possibilidade lexical; ambas as questões são registradas em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com construção poética concisa. “Contudo” marca o contraste contextual; a ênclise em “fizeste-o” e “coroaste” mantém dignidade literária sem arcaísmo excessivo.
