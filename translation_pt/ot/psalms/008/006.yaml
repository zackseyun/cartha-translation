  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: pt
  text: Tu o fizeste governar sobre as obras das tuas mãos; puseste tudo debaixo dos pés dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As formas singulares «o» e «dele» retomam a linguagem masculina representativa do versículo anterior e se referem à humanidade, conforme a expressão hebraica.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Tu o fizeste governar
  rationale: O hifil de משל expressa a ideia causativa de fazer alguém governar ou exercer domínio. A formulação preserva essa força e soa natural em português.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: sobre as obras das tuas mãos
  rationale: Com משל, a preposição indica aquilo sobre o qual se governa. A tradução conserva a imagem concreta das mãos de Deus.
- source_word: כֹּל
  choice: tudo
  rationale: O termo absoluto tem sentido abrangente no contexto, referindo-se ao conjunto do que foi posto sob a autoridade humana.
- source_word: שַׁתָּה
  choice: puseste
  rationale: O qal de שׁית significa pôr, colocar ou estabelecer; «puseste» é direto, digno e mantém o paralelismo verbal.
- source_word: תַחַת רַגְלָיו
  choice: debaixo dos pés dele
  rationale: Conserva a imagem hebraica de sujeição e autoridade sem substituir a metáfora por uma explicação.
theological_decisions:
- issue: Masculino singular representativo da humanidade no Salmo 8
  choice: Manter as formas masculinas singulares «o» e «dele»
  alternative: Empregar o plural neutro, como «os fizeste governar» e «debaixo dos pés deles»
  rationale: O hebraico usa formas masculinas singulares que retomam a figura humana representativa do versículo anterior. A tradução preserva a gramática e a tensão do texto, esclarecendo o alcance representativo em nota.
- issue: Linguagem de domínio
  choice: «Tu o fizeste governar»
  alternative: «Tu lhe deste domínio»
  rationale: A escolha preserva explicitamente a força causativa do verbo hebraico sem transformar a construção verbal em um substantivo teológico.
translation_notes:
  register: Português moderno, claro e digno, com tratamento de Deus por «tu», em continuidade com a linguagem poética dos Salmos. «Governar» comunica autoridade de modo corrente, enquanto «obras das tuas mãos» e «debaixo dos pés» preservam as imagens concretas do hebraico.
