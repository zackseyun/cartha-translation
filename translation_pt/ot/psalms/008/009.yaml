  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: pt
  text: Ó Yahweh[a], nosso Senhor, como é majestoso o teu nome em toda a terra!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “SENHOR”; também transliterado como “Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o do título אֲדֹנֵינוּ que vem em seguida e preservando a forma pessoal da invocação.
- source_word: אֲדֹנֵינוּ
  choice: nosso Senhor
  rationale: Expressa o título divino de autoridade e soberania em português natural e reverente.
- source_word: מָה אַדִּיר
  choice: como é majestoso
  rationale: A construção exclamativa hebraica expressa admiração; esta formulação portuguesa reproduz naturalmente a exclamação e associa אַדִּיר a grandeza e imponência.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Preserva a expressão hebraica, na qual o nome comunica a reputação, a honra e a manifestação de quem Deus é, sem explicitar além do texto.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: O contexto cósmico do salmo favorece 'terra' no sentido do mundo inteiro, não de uma região ou país.
theological_decisions:
- issue: Sequência do nome divino e do título יְהוָה אֲדֹנֵינוּ
  choice: Ó Yahweh, nosso Senhor
  alternative: Ó SENHOR, nosso Senhor
  rationale: A transliteração preserva o nome divino no texto hebraico, enquanto 'nosso Senhor' mantém distinto o título que o acompanha.
- issue: Sentido de אַדִּיר aplicado ao nome de Deus
  choice: majestoso
  alternative: excelente
  rationale: '''Majestoso'' comunica grandeza e imponência, sem reduzir a expressão a excelência moral nem introduzir uma interpretação doutrinária específica.'
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. A invocação conserva o tom poético e exclamativo do hebraico; usa-se 'teu' por sua naturalidade em linguagem bíblica dirigida a Deus, sem excesso de arcaísmo.
