base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: pt
  text: 'Ó Yahweh[a], nosso Senhor,


    como é majestoso o teu nome em toda a terra!


    Tu estabeleceste o teu esplendor acima dos céus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, o nome divino tradicionalmente representado por «SENHOR»; aqui transliterado «Yahweh». «Javé» é outra forma de transliteração em português.
    reason: alternative_reading
  - marker: b
    text: 'A forma hebraica vocalizada é literalmente um imperativo: «Põe o teu esplendor acima dos céus». A construção é incomum; no contexto, muitos a entendem como uma declaração: «Tu estabeleceste» ou «tu puseste o teu esplendor acima dos céus».'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o do título אֲדֹנֵינוּ (“nosso Senhor”) que vem logo depois.
- source_word: אֲדֹנֵינוּ
  choice: nosso Senhor
  rationale: O substantivo אֲדוֹן com sufixo de primeira pessoa do plural funciona aqui como título de Deus em invocação direta; “Senhor” é natural e digno em português.
- source_word: מָה אַדִּיר
  choice: como é majestoso
  rationale: מָה tem força exclamativa, e אַדִּיר comunica grandeza, imponência e majestade. A formulação preserva o tom de admiração do poema.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém o idioma hebraico, no qual o nome expressa a identidade e a reputação revelada de Deus, sem explicitar além do texto.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: “Terra” corresponde ao alcance cósmico sugerido pelo paralelo com “os céus”; “país” ou “território” estreitaria indevidamente o sentido.
- source_word: תְּנָה
  choice: Põe
  rationale: Na vocalização massorética, a forma é naturalmente lida como imperativo masculino singular de נתן. A tradução conserva essa forma verbal em vez de convertê-la silenciosamente numa declaração no passado.
- source_word: הוֹדְךָ
  choice: o teu esplendor
  rationale: הוֹד pode indicar esplendor, majestade ou glória. “Esplendor” é vívido, poético e evita repetir “majestoso”.
- source_word: עַל הַשָּׁמָיִם
  choice: acima dos céus
  rationale: Neste contexto exaltado, עַל apresenta o esplendor divino como elevado acima dos próprios céus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama, seguido imediatamente do título distinto “nosso Senhor”. A transliteração preserva o nome próprio e mantém perceptível essa diferença.
- issue: Valor verbal de תְּנָה
  choice: 'imperativo: “Põe”'
  alternative: 'declaração: “tu puseste” ou “colocaste”'
  rationale: A vocalização do texto massorético aponta formalmente para um imperativo. Como a construção com אֲשֶׁר é difícil e muitas traduções adotam uma declaração, a alternativa é registrada em nota sem apagar a tensão gramatical do hebraico.
translation_notes:
  register: Português atual, poético e solene, com ordem direta e versos breves. “Ó” marca naturalmente a invocação. Mantiveram-se “teu” e “nosso”, formas amplamente compreensíveis no português internacional e naturais na linguagem dos Salmos.
