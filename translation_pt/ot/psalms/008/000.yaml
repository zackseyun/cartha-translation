base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/000.yaml
  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: pt
  text: Ao regente do coro; conforme a Gitite.[a] Salmo de Davi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Gitite; provavelmente um termo musical ou litúrgico, talvez o nome de uma melodia ou de um instrumento.'
    reason: cultural_note
  - marker: b
    text: Ou «por Davi» ou «para Davi». A expressão hebraica pode indicar autoria ou outra forma de associação.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente do coro
  rationale: Nos títulos dos salmos, a forma costuma designar quem dirige a execução musical. A expressão é clara em português moderno e preserva o contexto litúrgico-musical.
- source_word: עַל
  choice: conforme
  rationale: Neste tipo de indicação musical, a preposição relaciona a execução do salmo ao termo seguinte sem definir se ele é instrumento, melodia ou outra orientação técnica.
- source_word: הַגִּתִּית
  choice: a Gitite
  rationale: Como o referente exato é incerto, a transliteração evita escolher indevidamente entre instrumento, melodia ou outro termo musical.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É a designação tradicional e precisa deste gênero poético-musical.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção hebraica pode indicar autoria, vínculo, dedicação ou pertença a uma coleção; «de Davi» conserva melhor essa abertura do que «por Davi».
theological_decisions:
- issue: Relação de Davi com o salmo indicada por לְדָוִד
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: O título hebraico não determina necessariamente uma única relação. A formulação escolhida evita transformar a possível autoria em afirmação mais específica do que a fonte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula mantém unidas as duas indicações musicais; a transliteração «Gitite» conserva a incerteza do termo hebraico.
