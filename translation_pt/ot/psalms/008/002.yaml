id: PSA.8.2
reference: Psalms 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: pt
  text: 'Da boca de crianças pequenas e de bebês que mamam,

    estabeleceste força[a] por causa dos teus adversários,

    para fazer cessar o inimigo e o vingador.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “louvor”, conforme a tradição da Septuaginta refletida em Mateus 21:16; o texto hebraico diz “força”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Da boca de
  rationale: A construção מִן + פֶּה indica aquilo que procede da boca. O singular coletivo do hebraico é preservado de modo natural em português.
- source_word: עוֹלְלִים
  choice: crianças pequenas
  rationale: O termo designa crianças de pouca idade. A expressão é atual, clara e evita tanto o arcaísmo de “pequeninos” quanto uma precisão etária indevida.
- source_word: יֹנְקִים
  choice: bebês que mamam
  rationale: O particípio descreve concretamente os que ainda mamam. Esta formulação é natural em português e mantém a imagem do hebraico.
- source_word: יִסַּדְתָּ
  choice: estabeleceste
  rationale: O verbo יסד significa fundar, assentar ou estabelecer. “Estabeleceste” funciona naturalmente com o objeto abstrato “força” e preserva a ação dirigida a Deus.
- source_word: עֹז
  choice: força
  rationale: 'Este é o sentido direto do texto hebraico: força ou poder. A leitura “louvor” da tradição grega é registrada em nota, não inserida no texto principal.'
- source_word: לְמַעַן
  choice: por causa de
  rationale: A locução pode expressar finalidade, consideração ou motivo. Aqui, “por causa de” preserva a relação com os adversários sem definir além do necessário se eles são a ocasião ou o alvo da ação.
- source_word: צוֹרְרֶיךָ
  choice: teus adversários
  rationale: O particípio substantivado designa os que se opõem com hostilidade. “Adversários” evita repetir imediatamente “inimigo” e mantém o sentido.
- source_word: לְהַשְׁבִּית
  choice: para fazer cessar
  rationale: O infinitivo causativo significa fazer parar ou cessar. A tradução mantém o valor amplo do verbo, em vez de restringi-lo especificamente a “calar”.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: O singular definido representa o opositor de forma genérica e corresponde ao paralelismo com o termo seguinte.
- source_word: מִתְנַקֵּם
  choice: o vingador
  rationale: O particípio descreve aquele que pratica ou busca vingança. “Vingador” é conciso e conserva a forma substantivada.
theological_decisions:
- issue: עֹז no hebraico em contraste com “louvor” na Septuaginta e em Mateus 21:16
  choice: Traduzir עֹז como “força” no texto principal.
  alternative: louvor
  rationale: O Texto Massorético traz inequivocamente עֹז, “força” ou “poder”. A prioridade do original hebraico requer essa leitura no corpo do salmo. A tradição grega, refletida em Mateus 21:16, tem relevância intertextual e por isso é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A disposição em três linhas acompanha as unidades poéticas do versículo. Evitou-se linguagem arcaica e preservou-se a diferença entre o hebraico “força” e a tradição grega “louvor”.
