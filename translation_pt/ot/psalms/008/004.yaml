  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: pt
  text: Que é o ser humano, para que te lembres dele, e o filho do homem, para que cuides dele?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho do homem” é aqui uma expressão hebraica que significa “ser humano”, em paralelo com a primeira parte do versículo. Em usos bíblicos posteriores, a expressão também pode adquirir significado messiânico.
    reason: cross_reference
  - marker: b
    text: 'Ou: “atentes para ele”, “o visites” ou “te ocupes dele”. O verbo hebraico pode expressar diferentes formas de atenção ou intervenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Que é o ser humano
  rationale: Reproduz a pergunta retórica hebraica e expressa a humanidade frágil e mortal sugerida por אֱנוֹשׁ, em português natural e inclusivo sem perder o singular representativo.
- source_word: כִּי תִזְכְּרֶנּוּ
  choice: para que te lembres dele
  rationale: Na pergunta retórica, כִּי introduz aquilo que causa admiração; 'para que' é idiomático em português, e 'te lembres' traduz diretamente זכר.
- source_word: וּבֶן אָדָם
  choice: e o filho do homem
  rationale: Preserva a imagem e o paralelismo hebraicos, bem como sua ressonância canônica, sem converter a expressão em título explícito neste contexto.
- source_word: כִּי תִפְקְדֶנּוּ
  choice: para que cuides dele
  rationale: פקד aqui indica a atenção ativa de Deus. 'Cuides' é natural no contexto e evita a estranheza de 'visites', embora o campo semântico permita outras traduções.
theological_decisions:
- issue: Linguagem masculina representativa para a humanidade
  choice: Traduzir אֱנוֹשׁ por 'ser humano' e manter 'filho do homem' no segundo membro
  alternative: homem; mortal; humanidade
  rationale: '''Ser humano'' comunica claramente a referência representativa a toda a humanidade, enquanto ''filho do homem'' conserva a forma poética e a ressonância intertextual do hebraico.'
- issue: Possível sentido messiânico de 'filho do homem'
  choice: Usar minúsculas e entender a expressão, neste salmo, como referência genérica ao ser humano
  alternative: Sinalizar no texto principal um título messiânico
  rationale: O paralelismo imediato trata da humanidade; aplicações cristológicas posteriores não exigem que o texto hebraico seja explicitamente titularizado aqui.
- issue: Amplitude semântica de פקד
  choice: cuides dele
  alternative: o visites; atentes para ele; te ocupes dele
  rationale: O contexto favorece a atenção benevolente de Deus, mas a nota preserva a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético, usa 'ser humano' para tornar explícita a referência à humanidade e conserva 'filho do homem' por sua imagem e importância intertextual.
