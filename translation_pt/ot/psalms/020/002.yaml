  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: pt
  text: Que ele lhe envie ajuda do santuário[a] e, de Sião, o sustente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da santidade” ou “do lugar santo”; aqui, provavelmente, o santuário de Deus.'
    reason: lexical_alternative
  - marker: b
    text: Ou “o apoie” ou “o ampare”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Que ele envie
  rationale: O imperfeito qal de שׁלח, no contexto de bênção e oração do salmo, exprime adequadamente um desejo ou pedido, e não apenas futuro simples.
- source_word: עֶזְרְךָ
  choice: lhe envie ajuda
  rationale: עֵזֶר com sufixo de segunda pessoa masculina singular significa literalmente “sua ajuda” ou “ajuda para você”. A formulação escolhida é natural em português e preserva o destinatário singular.
- source_word: מִקֹּדֶשׁ
  choice: do santuário
  rationale: קֹדֶשׁ pode designar tanto santidade como um lugar santo. Em paralelismo locativo com “de Sião”, o sentido concreto de santuário é o mais provável.
- source_word: וּמִצִּיּוֹן
  choice: e, de Sião
  rationale: Mantém o nome próprio Sião e a origem locativa da ação, ligada à primeira oração por paralelismo sinônimo.
- source_word: יִסְעָדֶךָּ
  choice: o sustente
  rationale: סעד abrange sustentar, apoiar e amparar. “Sustente” conserva o tom poético e a ideia de fortalecimento, enquanto o imperfeito continua subordinado ao valor desiderativo de “Que ele”.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Manter “ele” em minúscula, entendendo-se pelo contexto que se refere ao SENHOR.
  alternative: Inserir explicitamente “o SENHOR”.
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, mas não há sujeito expresso neste versículo. Manter o pronome evita acrescentar o nome divino ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação pronominal e a pontuação preservam o destinatário singular masculino indicado pelo hebraico e destacam o paralelismo entre o santuário e Sião.
