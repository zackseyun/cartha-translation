  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: pt
  text: Agora sei que o SENHOR salva o seu ungido; ele lhe responde desde os seus santos céus, com os poderosos atos de salvação da sua mão direita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Advérbio temporal explícito no texto hebraico; preserva a progressão do salmo para uma declaração presente de confiança.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino com SENHOR em versaletes.
- source_word: מְשִׁיחוֹ
  choice: o seu ungido
  rationale: Traduz literalmente o substantivo com sufixo possessivo, mantendo no contexto imediato a referência ao rei consagrado sem impor uma identificação posterior.
- source_word: יַעֲנֵהוּ
  choice: ele lhe responde
  rationale: Expressa o imperfeito hebraico como afirmação confiante e mantém o pronome referente ao ungido.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: desde os seus santos céus
  rationale: Preserva o plural de שָׁמַיִם e a construção que descreve os céus pertencentes à esfera da santidade divina.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: com os poderosos atos de salvação da sua mão direita
  rationale: A formulação torna natural o plural abstrato גְּבוּרוֹת, preserva o valor salvífico de יֵשַׁע e mantém a imagem da mão direita como agente do poder divino.
theological_decisions:
- issue: Referência de מְשִׁיחוֹ
  choice: ungido
  alternative: Messias
  rationale: No contexto do Salmo 20, o termo designa diretamente o rei consagrado. A tradução lexical 'ungido' preserva tanto esse sentido histórico quanto possíveis leituras messiânicas, sem resolvê-las no corpo do texto.
- issue: Valor verbal de יַעֲנֵהוּ
  choice: ele lhe responde
  alternative: ele lhe responderá
  rationale: O imperfeito pode ser entendido de modo prospectivo, mas, após 'Agora sei', o presente comunica bem a certeza confessada. A alternativa futura continua gramaticalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. Mantém a repetição possessiva do hebraico e a imagem tradicional da mão direita, evitando linguagem denominacional.
