  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: pt
  text: Que ele se lembre de todas as suas ofertas[a] e aceite o seu holocausto[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas ofertas de cereal”; o hebraico minḥah pode designar especificamente uma oferta de cereal ou, de modo mais amplo, uma oferta ou dádiva.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a torne gorda” ou “a considere rica”, expressão que indica receber o sacrifício favoravelmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Que ele se lembre
  rationale: O imperfeito qal de זכר tem aqui força volitiva, própria de uma oração ou bênção; a formulação expressa naturalmente esse desejo em português.
- source_word: כָּל
  choice: todas
  rationale: Preserva a abrangência do quantificador hebraico e concorda naturalmente com o plural “ofertas”.
- source_word: מִנְחֹתֶךָ
  choice: suas ofertas
  rationale: מִנְחָה pode designar uma dádiva ou oferta em sentido amplo e, em contexto ritual, especificamente uma oferta de cereal. A tradução principal mantém a amplitude lexical, e a alternativa específica aparece em nota.
- source_word: וְעוֹלָתְךָ
  choice: e o seu holocausto
  rationale: עוֹלָה é o termo sacrificial para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e concisa em português.
- source_word: יְדַשְּׁנֶה
  choice: aceite
  rationale: O piel de דשן evoca literalmente tornar gordo ou considerar rico; no contexto sacrificial, funciona como expressão de acolhimento favorável. “Aceite” comunica o sentido idiomático com clareza, preservando a imagem literal em nota.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional porque a função exata do termo é incerta; traduzi-lo imporia uma interpretação não comprovada.
theological_decisions:
- issue: Referente dos verbos na terceira pessoa do masculino singular
  choice: O sujeito implícito é expresso por “ele”, referindo-se a Deus no contexto da oração.
  alternative: Deixar o agente divino inteiramente implícito.
  rationale: O hebraico não nomeia o sujeito neste versículo, mas o contexto do Salmo 20 identifica Deus como aquele cuja ajuda e aceitação são invocadas. O pronome torna a frase natural em português sem acrescentar uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Que ele se lembre” preserva o tom de oração; “holocausto” mantém a terminologia sacrificial bíblica corrente; “Selá” conserva a ambiguidade do termo hebraico.
