  text: לַ/מְנַצֵּ֗חַ מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: pt
  text: Ao regente. Salmo de Davi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; o título hebraico pode indicar autoria, associação ou dedicação.
    reason: Leitura alternativa
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos Salmos, o termo parece designar quem dirige ou supervisiona a execução musical. “Ao regente” é conciso, natural e preserva a função de instrução musical sem restringi-la necessariamente a um coro.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: O substantivo designa uma composição poético-musical e, neste contexto literário, “salmo” é a equivalência consagrada e precisa.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos pode indicar autoria, associação, pertença ou dedicação. “De Davi” conserva em português parte dessa amplitude melhor que opções mais específicas como “por Davi” ou “para Davi”.
- source_word: לְ
  choice: Ao
  rationale: A preposição prefixada apresenta o destinatário da instrução musical; “Ao regente” é uma formulação idiomática em português para esse tipo de título.
theological_decisions:
- issue: Sentido da indicação davídica
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A construção hebraica não exige que se decida entre autoria, associação e dedicação. O texto principal mantém a formulação mais ampla, e a nota registra as leituras mais específicas.
translation_notes:
  register: Português moderno, claro e digno, com formulação breve própria de um título litúrgico. “Regente” é amplamente compreensível e evita a especificidade excessiva de “mestre de canto”.
