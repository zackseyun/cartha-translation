  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: pt
  text: Uns confiam em carros de guerra; outros, em cavalos[a]. Nós, porém, fazemos menção do nome do SENHOR, nosso Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Uns, em carros; outros, em cavalos”; o verbo é subentendido.'
    reason: Preserva a elipse do original e informa que «confiam» é uma explicitação contextual.
  - marker: b
    text: 'Ou: “invocamos o nome do SENHOR”, “recordamos o nome do SENHOR” ou “proclamamos o nome do SENHOR”.'
    reason: Registra a amplitude semântica de נַזְכִּיר sem resolver silenciosamente sua ambiguidade.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: Uns confiam em carros de guerra, outros, em cavalos
  rationale: O hebraico apresenta frases nominais elípticas, literalmente «uns, em carros; outros, em cavalos». «Confiam» explicita em português a relação sugerida pelo contraste, enquanto «carros de guerra» esclarece o sentido militar de רֶכֶב.
- source_word: נַזְכִּיר
  choice: invocamos
  rationale: O hifil de זכר pode significar fazer lembrar, mencionar ou proclamar. Neste contexto, ligado ao nome divino e em contraste com a dependência de recursos militares, «invocamos» comunica naturalmente a confiança cultual em Deus sem reduzir o verbo a simples lembrança mental.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa amplamente reconhecida de representar o tetragrama por «SENHOR» em versaletes/maiúsculas, evitando inserir uma vocalização discutida no texto principal.
theological_decisions:
- issue: Natureza do contraste entre poder militar e o nome divino
  choice: «confiam» para o primeiro hemistíquio e «invocamos» para o segundo
  alternative: «Uns se gloriam em carros... nós fazemos menção do nome...»
  rationale: As palavras de confiança ou glória não aparecem expressamente no primeiro hemistíquio, mas a elipse requer algum complemento em português. O contraste aponta para diferentes fundamentos de segurança. A nota preserva a forma mais literal, e a nota sobre נַזְכִּיר mantém abertas as nuances de lembrar, mencionar e proclamar.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. A construção paralela «Uns... outros... nós, porém...» conserva o contraste poético; «carros de guerra» evita que «carros» seja entendido como automóveis modernos.
