  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: pt
  text: Daremos gritos de alegria por tua salvação[a] e, em nome do nosso Deus, ergueremos as nossas bandeiras[b]. Que Yahweh atenda a todos os teus pedidos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua vitória” ou “o teu livramento”. O termo hebraico pode se referir à salvação em sentido amplo, inclusive ao resgate ou à vitória militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “levantaremos o nosso estandarte”. O verbo hebraico provavelmente evoca o ato de erguer ou exibir bandeiras em celebração.
    reason: lexical_alternative
  - marker: c
    text: Ou “Yahweh atenderá a todos os teus pedidos”. A forma hebraica pode ser entendida tanto como desejo ou oração quanto como afirmação futura, embora o sentido de oração combine bem com o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: Celebraremos com alegria
  rationale: A forma volitiva de רנן expressa júbilo coletivo e audível. Esta formulação soa natural em português sem limitar o verbo especificamente a cantar.
- source_word: בִּישׁוּעָתֶךָ
  choice: a tua salvação
  rationale: יְשׁוּעָה abrange salvação, livramento e vitória. “Salvação” conserva a amplitude sem excluir o contexto régio e militar.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: em nome do nosso Deus
  rationale: Mantém o idioma hebraico e comunica celebração sob a autoridade e identidade de Deus.
- source_word: נִדְגֹּל
  choice: ergueremos as nossas bandeiras
  rationale: O verbo provavelmente evoca erguer ou exibir um estandarte em celebração. O plural coletivo é idiomático em português e preserva a imagem concreta.
- source_word: יְמַלֵּא
  choice: Que ... atenda
  rationale: Embora seja formalmente imperfeito, no contexto a forma funciona naturalmente como desejo ou oração. Com “pedidos”, “atender” é português corrente e comunica o sentido de concedê-los plenamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: a todos os teus pedidos
  rationale: מִשְׁאֲלוֹת designa aquilo que se pede. “Pedidos” é claro, atual e adequado ao contexto de oração.
theological_decisions:
- issue: Sentido de יְשׁוּעָה no contexto régio e militar
  choice: salvação
  alternative: vitória; livramento
  rationale: O contexto torna “vitória” plausível, mas “salvação” preserva a amplitude teológica e lexical do termo hebraico sem excluir o resgate militar.
- issue: Força do imperfeito יְמַלֵּא
  choice: 'desejo ou oração: “Que Yahweh atenda”'
  alternative: 'afirmação futura: “Yahweh atenderá”'
  rationale: O contexto litúrgico e suplicante favorece uma bênção ou oração, embora a morfologia também permita entender a frase como declaração futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular foi preservada por corresponder ao destinatário régio do hebraico. A imagem das bandeiras permanece concreta, e as ambiguidades de יְשׁוּעָה e יְמַלֵּא são registradas em notas.
