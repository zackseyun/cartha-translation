  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: pt
  text: Ó Yahweh[a], salva! Que o rei nos responda no dia em que clamarmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ó Yahweh, salva o rei; responde-nos no dia em que clamarmos»; possivelmente também: «Ó Yahweh, salva! O Rei nos responderá no dia em que clamarmos». A sintaxe hebraica é concisa e permite mais de uma interpretação de «o rei».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino como nome pessoal e emprega «Ó» para marcar naturalmente o vocativo em português.
- source_word: הוֹשִׁיעָה
  choice: salva!
  rationale: Traduz diretamente o imperativo de ישׁע sem limitar seu alcance à vitória militar nem acrescentar um objeto que o hebraico não explicita.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: Reproduz o substantivo definido; a inicial maiúscula acompanha a leitura principal em que o título se refere a Deus, enquanto a nota registra a leitura igualmente possível referente ao rei humano.
- source_word: יַעֲנֵנוּ
  choice: Que ... nos responda
  rationale: Expressa em português natural o valor volitivo ou jussivo que o imperfeito pode ter nesta oração.
- source_word: בְיוֹם
  choice: no dia em que
  rationale: Preserva a imagem temporal do hebraico e, ao mesmo tempo, forma uma expressão poética natural em português.
- source_word: קָרְאֵנוּ
  choice: clamarmos
  rationale: Comunica o ato de chamar em oração sem indicar explicitamente um objeto; «clamar» é corrente e digno neste contexto.
theological_decisions:
- issue: Referente e função sintática de הַמֶּלֶךְ («o rei/o Rei»)
  choice: Entender «o Rei» como sujeito de «nos responda», com referência provável a Yahweh
  alternative: Entender «o rei» como objeto de «salva» e dirigir «responde-nos» a Yahweh; ou ler «o Rei nos responderá» como declaração
  rationale: A sintaxe hebraica é comprimida e permite essas construções. O texto principal adota uma leitura coerente com o paralelismo da oração, mas a nota conserva as alternativas reais sem encerrar a questão teológica ou sintática.
translation_notes:
  register: Português moderno, poético e acessível, com cadência própria de oração. «Yahweh» preserva o nome divino; «Ó» esclarece o vocativo. A construção mantém a concisão do hebraico e registra em nota sua ambiguidade sintática genuína.
