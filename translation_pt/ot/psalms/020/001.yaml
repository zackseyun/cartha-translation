  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: pt
  text: Que Yahweh lhe responda no dia da aflição; que o nome do Deus de Jacó o coloque em lugar alto e seguro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o proteja”. O verbo hebraico retrata alguém colocado num lugar alto e seguro, fora do alcance do perigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: Que ... lhe responda
  rationale: O hifil de ענה significa aqui “responder”. A construção com “que” comunica naturalmente em português a força optativa dos imperfeitos neste contexto de oração e bênção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיוֹם צָרָה
  choice: no dia da aflição
  rationale: Preserva a imagem temporal hebraica e traduz צָרָה por uma expressão ampla e digna, que abrange angústia, adversidade e perigo.
- source_word: יְשַׂגֶּבְךָ
  choice: o coloque a salvo nas alturas
  rationale: O piel de שׂגב retrata alguém posto num lugar alto e inacessível e, portanto, protegido. A formulação conserva tanto a metáfora espacial quanto sua força protetora.
- source_word: שֵׁם
  choice: o nome
  rationale: Mantém a expressão concreta e teologicamente significativa do hebraico, sem reduzi-la apenas a reputação, autoridade ou presença.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: o Deus de Jacó
  rationale: Tradução direta do construto, preservando sua ressonância histórica e pactual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” conserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força dos verbos no contexto de bênção e oração
  choice: Sentido optativo expresso por “Que...”
  alternative: 'Futuro declarativo: “Yahweh lhe responderá... o nome... o protegerá”'
  rationale: No contexto litúrgico do salmo, os imperfeitos exprimem melhor um desejo ou pedido. A tradução evita convertê-los em simples predição.
- issue: Metáfora protetora de שׂגב
  choice: Conservar a imagem de ser colocado a salvo nas alturas
  alternative: “proteja”
  rationale: A opção principal preserva a metáfora de ficar fora do alcance do perigo, enquanto a nota oferece a tradução funcional mais concisa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “lhe/o” mantém o singular masculino do destinatário no hebraico; a repetição de “que” conserva o paralelismo de oração e bênção.
