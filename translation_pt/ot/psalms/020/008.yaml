  text: הֵ֭מָּה כָּרְע֣וּ וְ/נָפָ֑לוּ וַ/אֲנַ֥חְנוּ קַּ֝֗מְנוּ וַ/נִּתְעוֹדָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: pt
  text: Eles se curvaram e caíram, mas nós nos levantamos e permanecemos firmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficamos de pé”, “somos fortalecidos” ou “nos mantemos firmes”.
    reason: Alternativas lexicais para o raro verbo final, que pode descrever reerguimento, fortalecimento ou estabilidade.
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome independente de terceira pessoa do plural enfatiza o contraste com “nós”; “Eles” expressa isso de modo natural em português.
- source_word: כָּרְעוּ
  choice: se curvaram
  rationale: O verbo descreve dobrar-se, ajoelhar-se ou abater-se. “Se curvaram” conserva a imagem física e prepara o paralelo com “caíram”.
- source_word: וְנָפָלוּ
  choice: e caíram
  rationale: Tradução direta que preserva a coordenação e o paralelismo poético com o verbo anterior.
- source_word: וַאֲנַחְנוּ
  choice: mas nós
  rationale: Embora a conjunção seja formalmente aditiva, o contraste explícito entre “eles” e “nós” justifica o adversativo natural “mas”.
- source_word: קַּמְנוּ
  choice: nos levantamos
  rationale: O verbo קום significa levantar-se ou pôr-se de pé; a escolha mantém o contraste direto com a queda dos adversários.
- source_word: וַנִּתְעוֹדָד
  choice: permanecemos firmes
  rationale: A forma rara pode transmitir a ideia de recompor-se, fortalecer-se ou manter-se ereto. “Permanecemos firmes” comunica estabilidade restaurada sem eliminar as demais possibilidades, registradas em nota.
