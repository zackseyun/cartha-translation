  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: pt
  text: Que ele lhe conceda o que seu coração deseja[a] e realize todos os seus planos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conforme o seu coração”; isto é, de acordo com o desejo ou a intenção do seu coração.
    reason: esclarecimento_da_imagem_hebraica
  - marker: b
    text: 'Ou: “todos os seus propósitos”.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: יִתֶּן
  choice: Que ele conceda
  rationale: O yiqtol, no contexto de petições e bênçãos do salmo, expressa naturalmente um desejo ou uma oração. “Conceder” comunica uma dádiva solicitada com mais naturalidade do que o simples “dar”.
- source_word: לְךָ
  choice: lhe
  rationale: O pronome átono expressa de modo natural em português o objeto indireto, “a você”.
- source_word: כִלְבָבֶךָ
  choice: conforme o seu coração
  rationale: Mantém a imagem hebraica do coração como centro do desejo, da intenção e da vontade, sem restringi-la a apenas um desses sentidos.
- source_word: וְכָל
  choice: e todos
  rationale: Reproduz a conjunção e a ideia abrangente de כָּל de forma idiomática com o plural português “planos”.
- source_word: עֲצָתְךָ
  choice: seus planos
  rationale: עֵצָה pode indicar conselho, propósito ou plano. Neste contexto de oração pelo êxito do rei, “planos” é claro e natural, preservando a ideia de decisões deliberadas.
- source_word: יְמַלֵּא
  choice: realize
  rationale: O Piel de מלא indica levar algo à plena concretização. “Realizar” expressa isso de maneira corrente e adequada em português.
theological_decisions:
- issue: Força das formas verbais no contexto de bênção e oração
  choice: 'Traduzir os dois verbos como desejos ou petições: “Que ele ... conceda ... e realize”'
  alternative: 'Traduzir como futuro declarativo: “Ele lhe concederá ... e realizará”'
  rationale: A sequência de petições do Salmo 20 favorece o valor volitivo das formas yiqtol. A tradução mantém o tom litúrgico e suplicante sem transformar a frase em previsão categórica.
- issue: Sentido de “coração”
  choice: Conservar “coração” como sede de desejos, intenções e vontade
  alternative: Explicitar apenas “desejo”, “mente” ou “vontade”
  rationale: O hebraico mantém uma imagem antropológica ampla. Preservá-la evita reduzir o sentido a emoção, cognição ou vontade isoladamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de bênção natural. Conserva-se a imagem bíblica do “coração”; “planos” evita o sentido excessivamente estreito ou pouco natural que “conselho” teria neste contexto.
