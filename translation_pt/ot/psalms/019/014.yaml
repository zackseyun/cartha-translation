id: PSA.19.14
reference: Psalms 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: pt
  text: Que as palavras da minha boca e a meditação do meu coração sejam agradáveis diante de ti[a], ó Yahweh, minha rocha e meu redentor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à tua vista”. O hebraico diz literalmente “diante da tua face/presença”.'
    reason: lexical_alternative
  - marker: b
    text: “Redentor” traduz um termo que designa quem resgata ou recupera; na lei israelita, muitas vezes se relaciona às obrigações de um parente próximo.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que ... sejam
  rationale: O imperfeito qal de היה tem força volitiva neste contexto de oração; a construção portuguesa com “Que” expressa naturalmente o desejo ou a petição.
- source_word: לְרָצוֹן
  choice: agradáveis
  rationale: רָצוֹן com ל indica aquilo que encontra favor ou aceitação. “Agradáveis” é idiomático em português e conserva o sentido de aprovação diante de Deus.
- source_word: אִמְרֵי פִי
  choice: as palavras da minha boca
  rationale: Mantém a imagem concreta do sintagma construto hebraico e é claro e natural em português.
- source_word: הֶגְיוֹן לִבִּי
  choice: a meditação do meu coração
  rationale: הֶגְיוֹן pode indicar meditação, reflexão ou murmúrio. “Meditação” preserva a ambiguidade de uma atividade interior e forma o contraponto às palavras pronunciadas.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Expressa de modo natural o hebraico literalmente relacionado à face ou presença da pessoa, mantendo o sentido relacional e avaliativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צוּרִי
  choice: minha rocha
  rationale: Preserva diretamente a metáfora hebraica de estabilidade e proteção, sem reduzi-la a uma interpretação como “refúgio”.
- source_word: וְגֹאֲלִי
  choice: e meu redentor
  rationale: גאל descreve quem resgata ou recupera alguém ou algo, frequentemente no âmbito das responsabilidades de parentesco. “Redentor” é conciso e não torna explícito um elemento de parentesco que permanece apenas associado ao termo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR; ó Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “ó” marca o vocativo de maneira natural em português.
- issue: Metáfora צוּרִי
  choice: minha rocha
  alternative: meu refúgio
  rationale: A tradução mantém a imagem poética e teológica do hebraico, evitando resolver a metáfora em apenas uma de suas implicações.
- issue: Amplitude de גֹאֲלִי
  choice: meu redentor
  alternative: meu resgatador; meu parente-redentor
  rationale: “Redentor” conserva tanto a ideia geral de resgate quanto a possível ressonância das obrigações de parentesco, sem afirmar que esta última seja o único sentido pretendido aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o paralelismo entre fala exterior e reflexão interior, o vocativo, a metáfora da rocha e a amplitude cultural de “redentor”.
