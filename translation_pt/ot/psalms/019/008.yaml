  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: pt
  text: Os preceitos de Yahweh são retos e alegram o coração; o mandamento de Yahweh é puro[a] e ilumina os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “claro”. O adjetivo hebraico pode destacar a pureza, com a ideia resultante de clareza, apropriada à expressão paralela “ilumina os olhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: preceitos
  rationale: Designa diretrizes ou determinações estabelecidas. “Preceitos” conserva esse sentido específico e o distingue de מִצְוַת, traduzido como “mandamento”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יְשָׁרִים
  choice: retos
  rationale: Expressa aquilo que é correto e íntegro; também preserva de modo natural a imagem básica de retidão.
- source_word: מְשַׂמְּחֵי לֵב
  choice: alegram o coração
  rationale: Reproduz o sentido causativo do particípio hebraico em português corrente e mantém o coração como objeto.
- source_word: לֵב
  choice: coração
  rationale: Mantém a imagem concreta e abrangente do hebraico, que pode incluir emoções, pensamento e vontade.
- source_word: מִצְוַת
  choice: mandamento
  rationale: Preserva o singular hebraico, usado de modo representativo ou coletivo, e mantém a distinção em relação a “preceitos”.
- source_word: בָּרָה
  choice: puro
  rationale: O adjetivo denota fundamentalmente pureza ou limpeza. “Puro” conserva esse sentido, enquanto “claro” explicita uma possível relação com a iluminação mencionada em seguida.
- source_word: מְאִירַת עֵינָיִם
  choice: ilumina os olhos
  rationale: Expressa naturalmente em português a ação causativa de dar luz, preservando a metáfora e o paralelismo com “alegram o coração”.
- source_word: עֵינָיִם
  choice: olhos
  rationale: Conserva a imagem concreta hebraica, sem reduzi-la interpretativamente a “entendimento” ou “visão”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança e representa de forma mais provável sua vocalização antiga.
- issue: Sentido de בָּרָה
  choice: puro
  alternative: claro
  rationale: “Puro” representa o sentido lexical principal, sem eliminar a possibilidade contextual de clareza, registrada em nota por causa da frase paralela “ilumina os olhos”.
translation_notes:
  register: Português moderno, digno e de leitura natural, com paralelismo poético conciso. Os particípios hebraicos foram vertidos por verbos no presente (“alegram”, “ilumina”), que comunicam efeito habitual e contínuo. O marcador da nota foi colocado após “puro”, termo ao qual a alternativa lexical se refere.
