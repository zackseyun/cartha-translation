  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: pt
  text: Quem pode discernir os próprios erros? Absolve-me das faltas ocultas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos pecados secretos” ou “das coisas ocultas”. O hebraico pode se referir a faltas desconhecidas do próprio falante, ocultas aos outros ou, de modo mais geral, a coisas ocultas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: erros
  rationale: O substantivo denota erros, desvios ou pecados cometidos por engano. “Erros” é natural e conciso, mantém a dimensão moral do contexto e não especifica além do hebraico que sejam necessariamente involuntários.
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo padrão, aqui introduzindo uma pergunta retórica.
- source_word: יָבִין
  choice: pode discernir
  rationale: O verbo pode significar entender, perceber ou discernir. A formulação comunica a incapacidade humana de reconhecer plenamente os próprios erros.
- source_word: מִנִּסְתָּרוֹת
  choice: das faltas ocultas
  rationale: A preposição מן com a forma passiva derivada de סתר significa literalmente “de coisas ocultas”. O paralelismo com “erros” favorece uma referência moral, enquanto “faltas ocultas” deixa em aberto se estão ocultas do próprio salmista ou de outras pessoas.
- source_word: נַקֵּנִי
  choice: Absolve-me
  rationale: O imperativo piel de נקה pode expressar declarar inocente, isentar de culpa ou purificar. “Absolve-me” preserva com naturalidade o aspecto de libertação da culpa, sem impor um sentido estritamente ritual.
theological_decisions:
- issue: Natureza das coisas ou faltas ocultas
  choice: A expressão é vertida como faltas ocultas, em paralelo moral com “erros”.
  alternative: “pecados secretos” ou “coisas ocultas” em sentido mais geral
  rationale: O paralelismo favorece faltas ou pecados, mas o texto não esclarece se estão ocultos do próprio falante, das demais pessoas ou apenas não manifestos. A tradução e a nota preservam essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Os próprios erros” explicita em português o referente reflexivo naturalmente inferido pela pergunta e pelo pedido seguinte. A formulação mantém a concisão e o paralelismo poético.
