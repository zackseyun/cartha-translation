  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: pt
  text: Não há fala, nem palavras; não se ouve a voz[a] deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o som”. A palavra hebraica קוֹל pode significar “voz” ou “som”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: não há
  rationale: Expressa de modo natural em português a negação existencial que introduz as duas primeiras afirmações.
- source_word: אֹמֶר
  choice: fala
  rationale: Designa expressão falada em sentido amplo e forma um paralelismo claro com “palavras”.
- source_word: דְּבָרִים
  choice: palavras
  rationale: No contexto poético de comunicação e audição, o sentido concreto “palavras” é o mais adequado.
- source_word: בְּלִי
  choice: não
  rationale: A construção hebraica indica a circunstância negativa da voz não ser ouvida; em português atual, a formulação verbal é mais natural do que uma reprodução rígida com “sem”.
- source_word: נִשְׁמָע
  choice: se ouve
  rationale: Traduz diretamente a forma passiva de שׁמע, usando a construção passiva sintética corrente em português.
- source_word: קוֹלָם
  choice: a voz deles
  rationale: “Voz” preserva a personificação dos céus no poema; “som” continua sendo uma alternativa lexical legítima e é registrada em nota.
theological_decisions:
- issue: O testemunho dos céus como comunicação não verbal
  choice: 'A tradução nega a presença de fala e palavras audíveis: “Não há fala, nem palavras; não se ouve a voz deles.”'
  alternative: A linha também pode ser entendida como uma proclamação que ocorre sem fala nem palavras, ressaltando um testemunho silencioso e universal.
  rationale: A sintaxe hebraica favorece naturalmente a ausência de linguagem falada e de voz audível. A formulação mantém a tensão poética com o versículo anterior, no qual os céus proclamam a glória de Deus, sem explicar ou harmonizar em excesso a imagem.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A repetição completa de “não há” foi evitada na segunda expressão para produzir fluidez natural sem perder a dupla negação do hebraico.
