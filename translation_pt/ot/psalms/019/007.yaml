source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: pt
  text: A lei de Yahweh é perfeita e restaura a vida[a]; o testemunho de Yahweh é digno de confiança e torna sábio o inexperiente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: reaviva a vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: lei
  rationale: Embora תּוֹרָה possa significar instrução em sentido amplo, aqui designa a revelação de Yahweh com força pactual; “lei” preserva esse peso e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: תְּמִימָה
  choice: perfeita
  rationale: Comunica inteireza, integridade e excelência plena no contexto poético.
- source_word: מְשִׁיבַת
  choice: restaura
  rationale: Preserva o sentido causativo de שוב, isto é, fazer voltar ou restaurar, sem eliminar a possibilidade contextual de reanimar.
- source_word: נָפֶשׁ
  choice: a vida
  rationale: נֶפֶשׁ pode designar vida, pessoa ou ser interior. “Vida” evita uma leitura dualista indevida e expressa naturalmente a vitalidade da pessoa inteira neste contexto.
- source_word: עֵדוּת
  choice: testemunho
  rationale: É o equivalente direto e tradicional para a revelação atestada ou estipulação pactual de Yahweh.
- source_word: נֶאֱמָנָה
  choice: digno de confiança
  rationale: Expressa com clareza moderna a firmeza e confiabilidade indicadas pelo termo hebraico.
- source_word: מַחְכִּימַת
  choice: torna sábio
  rationale: Reproduz de modo direto e natural o sentido causativo do particípio.
- source_word: פֶּתִי
  choice: o inexperiente
  rationale: Refere-se à pessoa ingênua, aberta à influência e ainda não formada, sem necessariamente implicar corrupção moral; “inexperiente” comunica isso melhor no português corrente do que “simples”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de מְשִׁיבַת נָפֶשׁ
  choice: restaura a vida
  alternative: reaviva a vida; restaura a alma
  rationale: A expressão admite as ideias relacionadas de fazer voltar, restaurar e reanimar a נֶפֶשׁ. O texto principal conserva o valor básico de שוב e entende נֶפֶשׁ como a vida da pessoa; a nota registra a forte alternativa contextual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O paralelismo hebraico foi preservado; “inexperiente” evita a possível interpretação de “simples” como intelectualmente incapaz.
