base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: pt
  text: Também o teu servo é advertido por eles[a]; ao guardá-los, há grande recompensa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é alertado por eles”; o verbo hebraico também pode indicar tomar os preceitos como advertência.
    reason: lexical_alternative
  - marker: b
    text: Ou “há abundante recompensa” ou “há grande benefício”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva que liga a afirmação ao elogio anterior das palavras e determinações do SENHOR.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: Expressa a autodesignação devocional do salmista diante de Deus; neste contexto, “servo” é mais natural e adequado do que “escravo”.
- source_word: נִזְהָר
  choice: é advertido
  rationale: Mantém o sentido passivo/resultativo do nifal de זהר, sem excluir a ideia de que o servo acolhe a advertência.
- source_word: בָּהֶם
  choice: por eles
  rationale: Retoma as determinações divinas mencionadas no contexto e expressa de modo natural o valor instrumental da preposição.
- source_word: בְּשָׁמְרָם
  choice: em guardá-los
  rationale: Conserva a construção circunstancial ou instrumental com ב e o sentido bíblico corrente de שמר como guardar, observar e cumprir.
- source_word: עֵקֶב רָב
  choice: grande recompensa
  rationale: Traduz a consequência ou benefício abundante que acompanha a observância, preservando a formulação positiva sem definir sua mecânica teológica.
theological_decisions:
- issue: Se o versículo ensina mérito adquirido diante de Deus ou declara o resultado benéfico da obediência
  choice: A tradução afirma que há grande recompensa em guardar as determinações de Deus, sem especificar que ela seja mérito adquirido.
  alternative: “Ao guardá-los, recebe-se grande recompensa”, que poderia acentuar uma relação de obtenção ou mérito.
  rationale: O hebraico associa a observância a עֵקֶב רָב, mas não explica aqui a natureza nem a base dessa recompensa; a formulação escolhida preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A colocação “o teu servo” soa natural, enquanto “em guardá-los” preserva a concisão e a estrutura do hebraico. Todos os marcadores de nota aparecem no texto principal.
