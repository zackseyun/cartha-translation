base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: pt
  text: São mais desejáveis do que o ouro[a], sim, do que muito ouro fino, e mais doces do que o mel e o mel que escorre dos favos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “São dignos de desejo, mais do que o ouro [...] e doces, mais do que o mel, sim, o mel que escorre dos favos”. O hebraico emprega formas descritivas em construções comparativas, e a expressão final pode ser traduzida mais literalmente como “mel gotejante dos favos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: mais desejáveis
  rationale: O particípio passivo de חמד tem função predicativa e retoma implicitamente os juízos do SENHOR no versículo anterior; a construção comparativa com מִן pede, em português natural, “mais desejáveis”.
- source_word: מִזָּהָב
  choice: do que o ouro
  rationale: A preposição מִן marca comparação; “do que o ouro” completa naturalmente “mais desejáveis”.
- source_word: וּמִפַּז רָב
  choice: sim, do que muito ouro fino
  rationale: פַּז designa ouro puro ou refinado, enquanto רָב indica abundância. “Sim” expressa a progressão enfática sem apagar a distinção entre זָהָב e פַּז.
- source_word: וּמְתוּקִים
  choice: e mais doces
  rationale: O adjetivo está em paralelismo com “desejáveis” e recebe valor comparativo da frase seguinte com מִן.
- source_word: מִדְּבַשׁ
  choice: do que o mel
  rationale: מִן introduz novamente o termo da comparação; esta é a formulação portuguesa corrente.
- source_word: וְנֹפֶת צוּפִים
  choice: e o mel que escorre dos favos
  rationale: נֹפֶת evoca mel que flui ou goteja, e צוּפִים provavelmente se refere aos favos. A formulação mantém a imagem concreta e é compreensível ao leitor moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O plural masculino retoma os juízos do SENHOR mencionados no contexto anterior. A repetição de “mel” explicita a relação entre דְּבַשׁ e נֹפֶת צוּפִים sem eliminar a vivacidade poética.
