  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: pt
  text: O temor de Yahweh é puro[a] e permanece para sempre; as decisões de Yahweh são verdadeiras e inteiramente justas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “são justas todas juntas”. O hebraico também pode enfatizar que todas elas, consideradas em conjunto, são justas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Preserva a expressão hebraica, que reúne reverência, assombro e temor diante de Yahweh, sem reduzi-la interpretativamente a “religião” ou “adoração”.
- source_word: טְהוֹרָה
  choice: puro
  rationale: Comunica de modo natural a qualidade de pureza; “limpo” também é lexicalmente possível.
- source_word: עוֹמֶדֶת לָעַד
  choice: permanece para sempre
  rationale: Expressa em português corrente o sentido idiomático de “estar de pé para sempre”, isto é, conservar-se permanentemente.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: as decisões de Yahweh
  rationale: מִשְׁפָּטִים pode designar decisões judiciais, juízos ou ordenanças. “Decisões” conserva a nuance jurídica e é compreensível no português moderno.
- source_word: אֱמֶת
  choice: verdadeiras
  rationale: O substantivo hebraico funciona predicativamente e caracteriza as decisões como verdadeiras, confiáveis ou fiéis.
- source_word: צָדְקוּ יַחְדָּו
  choice: todas juntas, justas
  rationale: 'Mantém a forma verbal e a força coletiva de יַחְדָּו: os juízos, considerados conjuntamente, mostram-se justos.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de “o temor de Yahweh” numa sequência que descreve a revelação divina
  choice: Manter literalmente “o temor de Yahweh”
  alternative: a religião de Yahweh; a adoração a Yahweh
  rationale: A expressão pode funcionar metonimicamente no contexto, mas sua formulação hebraica é teologicamente rica e não deve ser resolvida por uma paráfrase interpretativa.
- issue: Força coletiva de צָדְקוּ יַחְדָּו
  choice: “todas juntas, justas”
  alternative: “inteiramente justas”
  rationale: A redação escolhida preserva a possibilidade de que יַחְדָּו descreva os juízos como justos em conjunto, sem excluir a noção de justiça completa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluidez, preservando o paralelismo poético e as ambiguidades relevantes do hebraico.
