lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao mestre de música
  rationale: Em títulos de salmos, o termo designa provavelmente o responsável pela execução musical. “Mestre de música” é claro, natural e mais abrangente que “regente do coro”; a preposição ל é representada por “a”.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo convencional e preciso para esse gênero poético-musical, sem exigir o artigo indefinido num título em português.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção tradicional “de Davi” preserva, em português, certa abertura entre autoria, associação, pertencimento e dedicatória, sem impor uma relação mais específica que o hebraico.
theological_decisions:
- issue: Sentido de לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica pode expressar autoria, associação, pertencimento ou dedicatória. “De Davi” conserva melhor essa ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formulação concisa própria de um título litúrgico. O marcador foi colocado após “Davi”, pois a nota explica לְדָוִד.
