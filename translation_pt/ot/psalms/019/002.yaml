  - marker: b
    text: 'Ou: “declara conhecimento” ou “dá a conhecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: Um dia após outro
  rationale: Expressa naturalmente em português a sucessão ou transmissão contínua de um dia ao seguinte, preservando o paralelismo poético.
- source_word: יַבִּיעַ
  choice: derrama
  rationale: O hifil de נבע retrata algo que brota ou flui abundantemente; “derrama” conserva essa imagem vívida.
- source_word: אֹמֶר
  choice: palavras
  rationale: O substantivo indica expressão verbal; “palavras” soa natural em português e mantém a personificação poética dos dias.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: e uma noite após outra
  rationale: Reproduz a construção paralela do primeiro hemistíquio e comunica continuidade.
- source_word: יְחַוֶּה
  choice: comunica
  rationale: O piel de חוה significa dar a conhecer, declarar ou comunicar. “Comunica” preserva a transmissão de conhecimento sem restringir o verbo a uma revelação técnica.
- source_word: דָּעַת
  choice: conhecimento
  rationale: É o equivalente direto do substantivo hebraico e preserva o paralelo conceitual com “palavras”.
