  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: pt
  text: Dia após dia derrama palavras[a], e noite após noite revela conhecimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz brotar palavras”. O verbo hebraico retrata um fluxo abundante, não apenas o ato de falar.'
