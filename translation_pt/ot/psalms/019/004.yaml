base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: pt
  text: Por toda a terra se estende a linha deles[a], e as suas palavras chegam até os confins do mundo. Neles, ele armou uma tenda para o sol[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A voz deles se espalha por toda a terra” ou “O som deles se espalha por toda a terra”. O texto consonantal hebraico diz “a linha deles”, mas algumas versões antigas e muitos intérpretes entendem aqui “som” ou “voz”, de acordo com o contexto poético.'
    reason: alternative_reading
  - marker: b
    text: “Neles” provavelmente se refere aos céus mencionados no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: a linha deles
  rationale: Preserva a leitura massorética קַו, «linha», entendida poeticamente como algo cujo alcance se estende por toda a terra; a possibilidade de «voz» ou «som» é registrada em nota.
- source_word: יָצָא
  choice: se estende
  rationale: No contexto poético, expressa de modo natural em português o movimento ou alcance da linha que «saiu», sem eliminar a imagem do texto hebraico.
- source_word: מִלֵּיהֶם
  choice: as suas palavras
  rationale: Traduz diretamente o substantivo aramaizante que designa palavras ou enunciados e mantém o paralelismo verbal do verso.
- source_word: תֵבֵל
  choice: mundo
  rationale: É a forma portuguesa natural para o mundo habitado neste contexto poético.
- source_word: שָׂם
  choice: armou
  rationale: Com «tenda», o verbo idiomático português «armar» comunica naturalmente o ato de colocar ou instalar, sem acrescentar sentido cultual.
- source_word: אֹהֶל
  choice: uma tenda
  rationale: Mantém o sentido comum do hebraico e evita as conotações cultuais desnecessárias de «tabernáculo».
- source_word: בָּהֶם
  choice: Neles
  rationale: Preserva o pronome hebraico e sua referência contextual provável aos céus, sem explicitar demais no texto principal.
- source_word: לַשֶּׁמֶשׁ
  choice: para o sol
  rationale: Tradução direta e natural da expressão preposicional.
