  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: pt
  text: Também guarda o teu servo dos pecados cometidos com arrogância[a]; não deixes que eles me dominem. Então serei íntegro[b] e ficarei livre de grande transgressão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos arrogantes” ou “das pessoas orgulhosas”. O hebraico pode referir-se tanto a pessoas arrogantes quanto a pecados cometidos com presunção ou arrogância; o texto principal segue o paralelo com o versículo anterior.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “irrepreensível”, “inocente” ou “completo”. O termo hebraico pode transmitir a ideia de integridade ou inteireza.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de grande rebelião”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Mantém a força aditiva, ligando esta petição à oração sobre as faltas ocultas no versículo anterior.
- source_word: מִזֵּדִים
  choice: dos pecados cometidos com arrogância
  rationale: No contexto, o termo provavelmente se refere a pecados presunçosos ou insolentes, em paralelo com as faltas do versículo anterior. A expressão preserva a nuance de orgulho sem recorrer ao pouco natural 'pecados presunçosos'.
- source_word: חֲשֹׂךְ
  choice: guarda
  rationale: Expressa o pedido para que Deus refreie e preserve o salmista de tais pecados, em português corrente e digno.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: É a forma natural da linguagem de oração e conserva a postura de submissão diante de Deus.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: não deixes que eles me dominem
  rationale: Preserva a imagem de pecados exercendo domínio sobre a pessoa e comunica claramente a construção permissiva da oração.
- source_word: אָז
  choice: Então
  rationale: Assinala o resultado esperado da ação protetora de Deus.
- source_word: אֵיתָם
  choice: serei íntegro
  rationale: Comunica inteireza e integridade moral sem sugerir necessariamente perfeição absoluta.
- source_word: וְנִקֵּיתִי
  choice: ficarei livre
  rationale: O verbo נקה indica estar livre de culpa ou ser considerado inocente. 'Ficarei livre' combina naturalmente com a preposição seguinte.
- source_word: מִפֶּשַׁע רָב
  choice: de grande transgressão
  rationale: Mantém a gravidade e a forma singular coletiva do hebraico; 'transgressão' também preserva a ideia de séria violação contra Deus.
theological_decisions:
- issue: Referente de מִזֵּדִים
  choice: pecados cometidos com arrogância
  alternative: os arrogantes / as pessoas orgulhosas
  rationale: O contexto imediato trata de faltas e pecados, e a oração para que não dominem o salmista aplica-se naturalmente ao poder do pecado. A ambiguidade genuína é preservada em nota.
- issue: Sentido de אֵיתָם
  choice: íntegro
  alternative: irrepreensível / inocente / completo
  rationale: A palavra descreve integridade ou inteireza moral no contexto, sem obrigar a leitura de impecabilidade absoluta.
- issue: Sentido de פֶּשַׁע
  choice: transgressão
  alternative: rebelião
  rationale: Ambas as ideias pertencem ao campo semântico do termo; 'transgressão' é natural no contexto, enquanto a nota registra a nuance possível de rebelião.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos e preserva tanto a imagem do domínio exercido pelo pecado quanto a ambiguidade lexical relevante por meio das notas.
