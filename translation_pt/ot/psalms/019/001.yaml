  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: pt
  text: Os céus declaram a glória de Deus, e o firmamento anuncia a obra de suas mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a extensão celeste anuncia o que suas mãos fizeram”.'
    reason: Registra alternativas lexicais naturais para הָרָקִיעַ e וּמַעֲשֵׂה יָדָיו, preservando tanto a imagem da abóbada ou extensão do céu quanto a possibilidade de uma formulação mais corrente.
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Preserva o alcance cósmico e o tom poético elevado do plural hebraico, sendo também uma expressão natural em português bíblico contemporâneo.
- source_word: מְסַפְּרִים
  choice: declaram
  rationale: O particípio de ספר expressa uma ação contínua de contar ou tornar conhecido; “declaram” mantém a personificação poética sem paráfrase excessiva.
- source_word: כְּבוֹד
  choice: glória
  rationale: “Glória” é a correspondência tradicional e semanticamente adequada para כָּבוֹד, abrangendo a majestade, a honra e o esplendor atribuídos a Deus.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל funciona como designação da divindade criadora; “Deus” comunica naturalmente o sentido sem impor a leitura de um nome próprio.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: a obra de suas mãos
  rationale: Mantém de perto a imagem antropomórfica concreta do hebraico e sua força poética.
- source_word: מַגִּיד
  choice: anuncia
  rationale: O particípio hifil de נגד significa tornar conhecido ou declarar. “Anuncia” produz paralelismo natural com “declaram” e evita repetição rígida.
- source_word: הָרָקִיעַ
  choice: o firmamento
  rationale: “Firmamento” é uma forma portuguesa reconhecível para רָקִיעַ e preserva melhor a imagem hebraica da extensão celeste do que o termo genérico “céu”; a alternativa moderna é registrada em nota.
theological_decisions:
- issue: Tradução de אֵל
  choice: Deus
  alternative: El
  rationale: Embora אֵל possa ser entendido ou transliterado como “El” em certos contextos, aqui designa de modo direto o Deus cuja glória é manifestada pela criação. “Deus” evita introduzir uma ênfase em nome próprio que o contexto não exige.
translation_notes:
  register: Português moderno, digno e poeticamente elevado, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo hebraico foi preservado por meio de “declaram” e “anuncia”; “firmamento” conserva a imagem tradicional, enquanto a nota oferece uma alternativa contemporânea.
