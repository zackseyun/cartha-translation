translation:
  language: pt
  text: Ele é como um noivo que sai de sua câmara nupcial[a]; alegra-se como um guerreiro para correr seu percurso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seu pavilhão nupcial” ou “de seu dossel nupcial”. O hebraico חֻפָּה pode referir-se a uma cobertura nupcial ou a uma câmara nupcial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ele é
  rationale: O pronome masculino retoma “o sol” (שֶׁמֶשׁ, aqui tratado no masculino pelo pronome) no versículo anterior. Em português, “sol” é masculino, de modo que “ele” preserva naturalmente a referência e a personificação poética; a ligação com o contexto é expressa sem um “e” inicial, dispensável na fluência portuguesa.
- source_word: כְּחָתָן
  choice: como um noivo
  rationale: חָתָן designa o noivo. “Noivo” é a forma corrente, clara e poeticamente adequada em português.
- source_word: יֹצֵא
  choice: que sai
  rationale: O particípio de יצא apresenta vividamente o noivo saindo. A oração relativa é natural em português e conserva a ação em curso.
- source_word: מֵחֻפָּתוֹ
  choice: de sua câmara nupcial
  rationale: חֻפָּה pode designar uma cobertura ou pavilhão nupcial e, neste contexto poético, a câmara de onde o noivo emerge. A alternativa lexical genuína é preservada em nota.
- source_word: יָשִׂישׂ
  choice: alegra-se
  rationale: O verbo שׂושׂ expressa alegria viva. “Alegra-se” é natural, dignificado e mantém a personificação do sol.
- source_word: כְּגִבּוֹר
  choice: como um guerreiro
  rationale: גִּבּוֹר denota alguém forte e valente, frequentemente um guerreiro. “Guerreiro” preserva a imagem heroica sem recorrer a linguagem arcaica.
- source_word: לָרוּץ
  choice: ao percorrer
  rationale: Embora רוץ signifique literalmente “correr”, a construção “ao percorrer seu caminho” comunica em português a corrida do sol por sua rota e evita a formulação pouco natural “correr um caminho”.
- source_word: אֹרַח
  choice: seu caminho
  rationale: אֹרַח significa caminho, vereda ou rota. O possessivo explicita em português a relação contextual com o percurso do sol, sem alterar a imagem básica.
