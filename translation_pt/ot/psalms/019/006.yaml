  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: pt
  text: De uma extremidade dos céus vem a sua saída[a], e o seu percurso vai até as extremidades dos céus[b]; nada fica oculto ao seu calor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu nascer”. O termo hebraico pode indicar a saída, o surgimento ou o ponto de partida do sol.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu circuito”. O termo hebraico descreve a volta ou o trajeto percorrido pelo sol através dos céus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: de uma extremidade dos céus
  rationale: Preserva a ideia espacial de קָצֶה e o plural poético שָׁמַיִם, com formulação clara em português.
- source_word: מוֹצָאוֹ
  choice: sua saída
  rationale: Mantém o sentido básico de surgimento ou partida do sol sem restringi-lo obrigatoriamente a “nascer”.
- source_word: וּתְקוּפָתוֹ
  choice: e seu percurso
  rationale: Expressa o movimento abrangente do sol pelos céus em linguagem corrente; a alternativa mais formal “circuito” é registrada em nota.
- source_word: עַל קְצוֹתָם
  choice: vai até as extremidades deles
  rationale: Traduz עַל em seu valor direcional no contexto e conserva o sufixo plural que retoma “os céus”.
- source_word: וְאֵין נִסְתָּר
  choice: nada se esconde
  rationale: Reproduz de modo conciso a construção existencial negativa com o particípio passivo/reflexivo.
- source_word: מֵחַמָּתוֹ
  choice: do seu calor
  rationale: “Calor” comunica a força de חַמָּה melhor que “calidez”; o possessivo retoma naturalmente o sol em português.
theological_decisions:
- issue: Grau de personificação do sol
  choice: Empregar possessivos gramaticalmente masculinos naturais em português, sem intensificar a personificação.
  alternative: Explicitar repetidamente “do sol” ou usar linguagem que o apresente como agente pessoal.
  rationale: Os sufixos hebraicos são masculinos singulares, e “sol” também é masculino em português. A construção natural preserva a poesia sem sugerir divindade ou agência mitológica.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Extremidades deles” conserva explicitamente a referência plural aos céus, embora seja menos coloquial que “a outra extremidade”.
