id: PSA.52.9
reference: Psalms 52:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: pt
  text: Mas eu sou como uma oliveira viçosa na casa de Deus; confio no amor leal de Deus para todo o sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eternamente e para sempre”. A expressão hebraica combina dois termos de duração para dar forte ênfase à perpetuidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção e o pronome independente assinalam contraste com o perverso descrito no contexto anterior; “Mas eu” expressa isso de modo natural e enfático em português.
- source_word: כְּזַיִת רַעֲנָן
  choice: como uma oliveira viçosa
  rationale: כְּ marca comparação, זַיִת designa aqui a árvore, e רַעֲנָן comunica verdor, vigor e vitalidade; “viçosa” preserva a imagem sem reduzi-la apenas à cor verde.
- source_word: בְּבֵית אֱלֹהִים
  choice: na casa de Deus
  rationale: Tradução direta que mantém a imagem do santuário e sua ressonância bíblica.
- source_word: בָּטַחְתִּי
  choice: confio
  rationale: O perfeito hebraico pode exprimir uma confiança estabelecida e vigente; o presente português combina naturalmente com a duração contínua indicada no fim do verso.
- source_word: בְחֶסֶד אֱלֹהִים
  choice: no amor leal de Deus
  rationale: חֶסֶד reúne amor, fidelidade e compromisso constante. “Amor leal” é conciso, compreensível e conserva essa densidade sem impor uma formulação doutrinária mais estreita.
- source_word: עוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão dupla intensifica a duração; a formulação portuguesa preserva essa ênfase e é natural no registro bíblico atual.
theological_decisions:
- issue: Tradução de חֶסֶד em referência a Deus
  choice: amor leal
  alternative: amor constante; misericórdia; amor da aliança
  rationale: “Amor leal” conserva tanto o afeto quanto a fidelidade duradoura implicados no termo, sem restringi-lo exclusivamente à misericórdia nem explicitar “aliança” onde ela permanece implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o contraste, a metáfora da oliveira e a imagem da casa de Deus. O marcador [a] foi colocado imediatamente após a expressão a que se refere.
