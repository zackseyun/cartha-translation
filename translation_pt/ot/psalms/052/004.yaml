  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: pt
  text: Você amou o mal mais do que o bem, a falsidade mais do que falar o que é justo. Selá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Você amou
  rationale: O qal perfeito na segunda pessoa masculina singular dirige a acusação diretamente ao perverso. Em português, o pretérito perfeito expressa com naturalidade essa disposição já manifestada, sem excluir sua relevância presente.
- source_word: רָּע
  choice: o mal
  rationale: Em contraste direto com טוֹב, o substantivo tem sentido moral; “o mal” é claro, corrente e preserva a oposição poética.
- source_word: מִטּוֹב
  choice: mais do que o bem
  rationale: A preposição מִן depois de um verbo de preferência estabelece comparação. “Mais do que” conserva explicitamente essa força.
- source_word: שֶׁקֶר
  choice: a falsidade
  rationale: O termo abrange mentira, engano e aquilo que é falso. “Falsidade” mantém o caráter abstrato do paralelismo e não restringe o sentido a mentiras individuais.
- source_word: מִדַּבֵּר
  choice: mais do que falar
  rationale: A segunda ocorrência de מִן introduz novamente o elemento preterido na comparação; o infinitivo português reproduz a construção de modo natural.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: No contexto da fala, צֶדֶק designa aquilo que é correto, reto ou justo. A formulação idiomática evita a expressão pouco natural “falar justiça” e preserva a dimensão ética do termo.
- source_word: סֶלָה
  choice: Selá
  rationale: Como a função exata do termo litúrgico ou musical é incerta, ele é transliterado em vez de receber uma tradução conjectural.
theological_decisions:
- issue: Sentido de צֶדֶק no contexto da fala
  choice: o que é justo
  alternative: a justiça; a retidão; o que é certo
  rationale: O contraste imediato é entre falsidade e fala reta. “O que é justo” conserva a força moral de צֶדֶק sem restringi-lo à justiça jurídica nem produzir uma expressão artificial em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição comparativa “mais do que” preserva o paralelismo hebraico. “Selá” mantém a ambiguidade do termo técnico.
