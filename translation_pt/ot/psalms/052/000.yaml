  text: For the choirmaster[a]. A Maskil[b] of David[c].
translation:
  language: pt
  text: Ao regente[a]. Um masquil[b] de Davi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para o regente”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico masquil, provavelmente um termo musical ou literário; talvez “salmo didático” ou “cântico contemplativo”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por Davi” ou “para Davi”; o hebraico pode indicar autoria, dedicação, pertencimento ou associação.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa convencionalmente o responsável pela execução musical. “Ao regente” é conciso, natural em português e mantém a possível ideia de destinação ou instrução.
- source_word: מַשְׂכִּיל
  choice: Um masquil
  rationale: O sentido exato do termo técnico nos títulos dos salmos é incerto. A transliteração preserva essa incerteza sem impor sentidos possíveis, como “salmo didático” ou “cântico contemplativo”.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição hebraica pode indicar autoria, pertencimento, dedicação ou associação. “De Davi” é a formulação portuguesa mais concisa e relativamente aberta, sem afirmar de modo inequívoco “por Davi” ou “para Davi”.
theological_decisions:
- issue: Autoria ou associação indicada por לְדָוִד no título
  choice: de Davi
  alternative: por Davi; para Davi; pertencente a Davi
  rationale: O hebraico não define inequivocamente a relação do salmo com Davi; a tradução mantém essa abertura em vez de converter a expressão numa afirmação categórica de autoria.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Regente” comunica a função musical sem restringi-la necessariamente à direção de um coro. A transliteração “masquil” segue a ortografia portuguesa e conserva o caráter técnico e incerto do hebraico.
