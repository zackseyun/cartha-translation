  text: אָהַ֥בְתָּ כָֽל דִּבְרֵי בָ֗לַע לְשׁ֣וֹן מִרְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: pt
  text: Você ama todas as palavras devoradoras[a], ó língua enganadora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “todas as palavras de devoração”; ou, “todas as palavras destrutivas”.
    reason: Alternativas lexical e formal para בָלַע, substantivo derivado de “devorar, engolir”, usado metaforicamente para fala que causa ruína.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Você ama
  rationale: O Qal perfeito, em uma acusação poética dirigida diretamente ao interlocutor, expressa aqui uma disposição consolidada; o presente comunica esse padrão habitual com naturalidade em português, sem abandonar o sentido básico de amar.
- source_word: כָל דִּבְרֵי
  choice: todas as palavras
  rationale: כָל seguido do plural construto abrange a totalidade das palavras ou declarações; “todas as palavras” é direto e idiomático em português.
- source_word: בָלַע
  choice: que devoram
  rationale: Preserva a imagem vívida da raiz “engolir/devorar” e, no contexto, caracteriza palavras que consomem ou arruínam, evitando reduzir a metáfora à interpretação mais genérica “destrutivas”.
- source_word: לְשׁוֹן מִרְמָה
  choice: ó língua enganadora
  rationale: Mantém “língua” como metonímia poética da fala e verte o substantivo “engano” de modo adjetival, natural em português. A interjeição “ó” assinala o vocativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com vocativo bíblico digno. A metáfora concreta de palavras que “devoram” foi preservada; a formulação evita arcaísmos e mantém a acusação abrangente do hebraico.
