base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: pt
  text: Mas Deus também o derrubará para sempre; ele o tomará[a] e o arrancará da sua tenda[b], e o arrancará pela raiz da terra dos vivos[c]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o agarrará”, “o levará à força” ou “o arrebatará”. O verbo hebraico é raro e indica uma tomada ou remoção enérgica.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “o arrancará da sua morada”. Hebraico: “da sua tenda”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a tua raiz da terra dos vivos”; a construção poética expressa a ideia de arrancá-lo pela raiz da terra dos vivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Mas ... também
  rationale: Preserva o sentido aditivo de גַּם e explicita o contraste contextual com a arrogância descrita anteriormente.
- source_word: אֵל
  choice: Deus
  rationale: É a tradução natural do substantivo singular אֵל neste contexto, em referência ao Deus de Israel.
- source_word: יִתָּצְךָ
  choice: o derrubará
  rationale: O verbo נתץ descreve a demolição ou destruição violenta de algo erguido. “Derrubará” conserva essa imagem e se aplica naturalmente à pessoa interpelada.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa de modo direto a duração permanente indicada normalmente pela locução hebraica, sem reduzi-la apenas à ideia de intensidade ou completude.
- source_word: יַחְתְּךָ
  choice: o agarrará
  rationale: O verbo raro comunica uma tomada ou remoção enérgica. “Agarrará” mantém a força da ação sem definir além do que permite a evidência lexical.
- source_word: וְיִסָּחֲךָ
  choice: e o arrancará
  rationale: נסח transmite a ideia concreta de retirar, puxar ou arrancar. A escolha combina naturalmente com a origem indicada em seguida.
- source_word: מֵאֹהֶל
  choice: da sua tenda
  rationale: Mantém a imagem concreta de אֹהֶל, embora “morada” seja possível como expressão do sentido funcional.
- source_word: וְשֵׁרֶשְׁךָ
  choice: e o desarraigará
  rationale: Comunica claramente a remoção pela raiz e preserva a metáfora vegetal da expressão hebraica.
- source_word: מֵאֶרֶץ חַיִּים
  choice: da terra dos vivos
  rationale: Conserva a expressão hebraica tradicional para o âmbito dos que vivem, em contraste com a morte.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o significado exato do termo é incerto, a transliteração evita uma interpretação especulativa.
theological_decisions:
- issue: Natureza do juízo expresso por לָנֶצַח
  choice: para sempre
  alternative: completamente; de uma vez por todas
  rationale: O sentido mais natural é o de permanência duradoura. A tradução preserva a gravidade do juízo divino sem explicar sua natureza metafísica além do que o verso afirma.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sequência de verbos fortes preserva as imagens poéticas de demolição, remoção violenta e desenraizamento. “Selá” foi transliterado por causa da incerteza quanto ao seu significado.
