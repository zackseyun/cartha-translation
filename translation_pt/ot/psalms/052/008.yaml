id: PSA.52.8
reference: Psalms 52:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: pt
  text: 'Vejam: este é o homem que não fez de Deus o seu refúgio[a], mas confiou na abundância de suas riquezas e se fortaleceu em sua própria ruína[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortaleza” ou “baluarte”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “destruição”, “desejo perverso” ou “planos destrutivos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz uma observação enfática e exemplar. “Vejam” preserva a força dêitica em português atual, sem o tom arcaizante de “Eis”.
- source_word: הַגֶּבֶר
  choice: este é o homem
  rationale: O substantivo é masculino singular e aponta para um homem específico apresentado como exemplo; não é necessário explicitar aqui a possível conotação de força de גֶּבֶר.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: não fez de Deus o seu refúgio
  rationale: שׂים admite o sentido de fazer ou estabelecer algo como outra coisa, e מָעוֹז designa uma fonte ou lugar de proteção e força. “Refúgio” é claro e natural, enquanto “fortaleza” e “baluarte” permanecem alternativas legítimas.
- source_word: וַיִּבְטַח
  choice: mas confiou
  rationale: Embora o ו possa ser traduzido por “e”, o contraste com não fazer de Deus seu refúgio justifica o adversativo “mas”.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: na abundância de suas riquezas
  rationale: A formulação conserva tanto a ideia de grande quantidade em רֹב quanto o sentido de riqueza em עֹשֶׁר.
- source_word: יָעֹז
  choice: se fortaleceu
  rationale: O verbo expressa ser ou tornar-se forte. A forma portuguesa comunica aquisição ou demonstração de força sem acrescentar a ideia mais interpretativa de buscar deliberadamente essa força.
- source_word: בְּהַוָּתוֹ
  choice: em sua própria ruína
  rationale: הַוָּה pode indicar ruína, destruição, desejo perverso ou planos destrutivos. “Sua própria ruína” preserva a ironia provável de que aquilo em que ele se fortalecia era também ruinoso, sem ocultar as demais possibilidades.
theological_decisions:
- issue: Masculino singular em הַגֶּבֶר
  choice: o homem
  alternative: a pessoa
  rationale: O hebraico apresenta um referente masculino singular. Manter “homem” conserva essa forma e não transforma silenciosamente o personagem em uma referência neutra.
- issue: Sentido de הַוָּה
  choice: ruína
  alternative: destruição; desejo perverso; planos destrutivos
  rationale: O contexto denuncia uma segurança falsa baseada na riqueza. “Ruína” comunica bem a ironia possível, mas a amplitude semântica do termo exige que outras leituras sejam registradas em nota.
- issue: Relação expressa por יָעֹז בְּהַוָּתוֹ
  choice: se fortaleceu em sua própria ruína
  alternative: buscou força em seus planos destrutivos
  rationale: A tradução escolhida permanece próxima do valor verbal de tornar-se ou mostrar-se forte e evita definir הַוָּה exclusivamente como atividade perversa intencional.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O imperativo plural “Vejam” conserva o chamado público à atenção. Os marcadores foram colocados junto aos termos que efetivamente explicam: [a] após “refúgio” e [b] após “ruína”.'
