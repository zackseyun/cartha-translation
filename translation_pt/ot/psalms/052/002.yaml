  text: מַה תִּתְהַלֵּ֣ל בְּ֭/רָעָה הַ/גִּבּ֑וֹר חֶ֥סֶד אֵ֝֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: pt
  text: Por que você se gloria no mal, ó poderoso? O amor leal de Deus permanece o dia todo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o amor leal de Deus o dia todo”; o verbo “permanece” está implícito.'
    reason: Informa ao leitor que a continuidade é expressa por uma oração nominal no hebraico e que o verbo foi suprido para clareza em português.
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: você se gloria no mal
  rationale: Reproduz o sentido reflexivo de התהלל e mantém a preposição בְּ, sem reduzir a expressão a mero orgulho por um ato isolado.
- source_word: הַגִּבּוֹר
  choice: ó poderoso
  rationale: Preserva o vocativo e a ideia de força ou poder; no contexto, a designação tem força confrontadora, possivelmente irônica.
- source_word: חֶסֶד אֵל
  choice: o amor leal de Deus
  rationale: “Amor leal” expressa a combinação de amor, fidelidade e compromisso presente em חֶסֶד, sem impor uma formulação denominacional.
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: Tradução natural da expressão temporal, com o sentido de continuidade ao longo de todo o dia.
theological_decisions:
- issue: Relação entre a maldade do poderoso e o חֶסֶד de Deus
  choice: Mantida como contraste em duas frases, sem explicitar uma conclusão teológica adicional.
  alternative: Inserir uma conjunção interpretativa, como “mas”, ou entender a segunda frase como ameaça de juízo.
  rationale: O hebraico apenas justapõe as orações. A tradução preserva essa tensão e não acrescenta uma relação lógica que o texto não declara expressamente.
- issue: Verbo ausente na oração חֶסֶד אֵל כָּל הַיּוֹם
  choice: Suprido “permanece”.
  alternative: “O amor leal de Deus é o dia todo” ou uma frase nominal fragmentária.
  rationale: A oração hebraica é nominal e deixa o verbo implícito. “Permanece” comunica a continuidade de modo claro, concordando com o sentido provável sem tratar o verbo como expresso no original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Você” torna a interpelação direta e corrente; “ó poderoso” preserva o tom poético do vocativo.
