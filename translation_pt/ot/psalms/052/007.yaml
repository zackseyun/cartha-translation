  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: pt
  text: 'Os justos verão e temerão[a]; e rirão dele[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão com medo”. O hebraico pode indicar medo, embora, neste contexto, também possa incluir temor reverente diante do juízo de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “zombarão dele”. O verbo hebraico significa “rir”; o contexto sugere um riso de escárnio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: verão
  rationale: O qal imperfeito, terceira pessoa masculina plural, de ראה tem aqui valor futuro na sequência poética. “Verão” preserva o sentido direto de perceber com a visão.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural é usado como substantivo. “Os justos” é natural em português e mantém a categoria moral do hebraico.
- source_word: וְיִירָאוּ
  choice: temerão
  rationale: O qal imperfeito, terceira pessoa masculina plural, de ירא pode indicar tanto medo quanto temor reverente. “Temerão” conserva de modo conciso essa amplitude.
- source_word: וְעָלָיו
  choice: dele
  rationale: Com o verbo שׂחק, a preposição על introduz o alvo do riso. Em português, “rir dele” é a construção idiomática mais natural.
- source_word: יִשְׂחָקוּ
  choice: rirão
  rationale: O qal imperfeito, terceira pessoa masculina plural, de שׂחק tem o sentido básico de rir. O contexto sugere escárnio, mas a tradução principal preserva o valor lexical sem explicitá-lo indevidamente.
theological_decisions:
- issue: Sentido de ירא diante do juízo divino
  choice: temerão
  alternative: ficarão com medo; ficarão tomados de reverência
  rationale: A reação dos justos ao juízo pode envolver tanto medo quanto reverência. “Temerão” preserva essa tensão teológica em vez de restringir o sentido a terror ou admiração reverente.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética concisa. A ordem verbal do hebraico foi mantida, e as notas preservam as ambiguidades de ירא e שׂחק.
