  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: pt
  text: Você planeja destruições[a]; sua língua é como uma navalha afiada, praticando o engano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você planeja ruínas”. O substantivo hebraico está no plural (“destruições”), mas pode ter sentido coletivo, referindo-se a dano destrutivo.'
    reason: lexical_alternative
  - marker: b
    text: “Praticando o engano” pode descrever a língua ou a pessoa interpelada, como alguém que pratica o engano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: destruições
  rationale: Mantém o plural hebraico e expressa danos ruinosos deliberadamente planejados; em português, o plural poético é compreensível, embora também possa ter valor coletivo.
- source_word: תַּחְשֹׁב
  choice: planeja
  rationale: O qal imperfeito na segunda pessoa masculina singular indica que o interlocutor concebe intencionalmente o mal, não que apenas pensa nele.
- source_word: לְשׁוֹנֶךָ
  choice: sua língua
  rationale: Preserva a metáfora corporal da língua como instrumento da fala nociva e, após a cesura, funciona como sujeito da comparação seguinte.
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: como uma navalha afiada
  rationale: Reproduz diretamente a comparação e comunica uma lâmina preparada para cortar; 'afiada' é mais natural e ameaçador no contexto do que 'polida'.
- source_word: עֹשֵׂה רְמִיָּה
  choice: praticando o engano
  rationale: Expressa atividade contínua de produzir ou praticar falsidade, sem determinar de modo absoluto se o particípio descreve a língua ou a pessoa interpelada.
theological_decisions:
- issue: Referente de עֹשֵׂה רְמִיָּה
  choice: Mantida a ambiguidade por meio de “praticando o engano”
  alternative: “você, que pratica o engano” ou “ela produz engano”
  rationale: A construção pode qualificar a língua ou, em aposição, a pessoa interpelada; o texto principal não deve resolver uma ambiguidade sintática genuína.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação preserva a divisão sintática indicada pela cesura: “você” é o sujeito de “planeja”, enquanto “sua língua” inicia a comparação seguinte. A formulação mantém a concisão e a tensão poética do hebraico.'
