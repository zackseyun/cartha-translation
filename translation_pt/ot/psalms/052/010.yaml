  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: pt
  text: Eu te darei graças para sempre, porque agiste; porei minha esperança em teu nome[a], pois é bom[b], na presença dos teus fiéis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esperarei pelo teu nome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois teu nome é bom”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Eu te darei graças
  rationale: O hifil de ידה pode expressar agradecimento e louvor. “Dar graças” conserva a ideia de gratidão dirigida a Deus sem excluir o louvor.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua de modo natural e digno em português moderno.
- source_word: כִּי עָשִׂיתָ
  choice: porque agiste
  rationale: O primeiro כִּי é causal. Como עשה aparece sem objeto expresso, “agiste” evita acrescentar um pronome cujo referente o hebraico não especifica.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  choice: porei minha esperança em teu nome
  rationale: קוה reúne as ideias de esperar e ter esperança. Esta formulação comunica em português a confiança expectante depositada no caráter revelado de Deus, representado por seu nome; a alternativa mais formal é preservada em nota.
- source_word: כִּי טוֹב
  choice: pois é bom
  rationale: A oração hebraica é breve e não explicita o sujeito de “bom”. A construção portuguesa sem sujeito expresso preserva essa concisão e não obriga o leitor a decidir se a referência direta é ao nome ou ao ato de esperar com esperança.
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: na presença dos teus fiéis
  rationale: נֶגֶד indica aquilo que ocorre diante de outros. חֲסִידֶיךָ designa os que demonstram devoção e lealdade pactual; “teus fiéis” é claro e evita sentidos eclesiásticos técnicos posteriores.
theological_decisions:
- issue: Sentido de קוה em relação ao nome de Deus
  choice: porei minha esperança em teu nome
  alternative: esperarei pelo teu nome
  rationale: O verbo pode indicar tanto espera quanto esperança confiante. O texto principal comunica naturalmente a confiança expectante em português, enquanto a nota conserva a construção mais próxima da forma hebraica.
- issue: Referente implícito em כִּי טוֹב
  choice: pois é bom
  alternative: pois teu nome é bom
  rationale: O hebraico não apresenta sujeito expresso, embora “teu nome” seja o antecedente mais próximo. A tradução mantém a elipse e a nota oferece a explicitação possível.
- issue: Tradução de חֲסִידֶיךָ
  choice: teus fiéis
  alternative: teus leais
  rationale: “Fiéis” comunica devoção e lealdade a Deus sem importar uma categoria eclesiástica técnica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo e a concisão poética; as notas preservam as ambiguidades reais de קוה e da oração elíptica כִּי טוֹב.
