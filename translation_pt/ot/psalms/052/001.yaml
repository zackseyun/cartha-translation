  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: pt
  text: 'quando Doegue, o edomita, veio e contou a Saul, dizendo-lhe: “Davi veio à casa de Aimeleque”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Davi foi à casa de Aimeleque”. O perfeito hebraico pode ser expresso por “veio”, que preserva a perspectiva espacial do relato, ou por “foi”, conforme a perspectiva do falante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹוא
  choice: quando ... veio
  rationale: A preposição בְּ com o infinitivo construto de בוא introduz uma oração temporal; esta formulação é natural em português.
- source_word: דּוֹאֵג
  choice: Doegue
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: הָאֲדֹמִי
  choice: o edomita
  rationale: Gentílico que identifica a origem ou etnia de Doegue.
- source_word: וַיַּגֵּד
  choice: informou
  rationale: O hifil de נגד significa contar, comunicar ou informar; “informou” ajusta-se ao contexto de um relato feito a Saul.
- source_word: לְשָׁאוּל
  choice: Saul
  rationale: O português expressa naturalmente o destinatário como objeto direto de “informou”.
- source_word: וַיֹּאמֶר לוֹ
  choice: dizendo-lhe
  rationale: Preserva a introdução hebraica ao conteúdo da informação sem tornar a sequência excessivamente pesada.
- source_word: בָּא
  choice: foi
  rationale: Embora בוא signifique normalmente “vir/entrar”, em português o movimento de Davi até a casa de Aimeleque é expresso naturalmente por “foi”; a alternativa “veio” preserva mais diretamente a dêixis hebraica.
- source_word: דָוִד
  choice: Davi
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: אֶל בֵּית
  choice: à casa de
  rationale: Indica movimento em direção à casa física de Aimeleque, de modo idiomático em português.
- source_word: אֲחִימֶלֶךְ
  choice: Aimeleque
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
