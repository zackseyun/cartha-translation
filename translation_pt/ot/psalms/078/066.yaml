  text: וַ/יַּךְ צָרָ֥י/ו אָח֑וֹר חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: pt
  text: Ele golpeou seus inimigos, fazendo-os recuar[a]; cobriu-os de vergonha permanente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele golpeou seus inimigos pelas costas». O hebraico אָחוֹר pode indicar movimento para trás ou o lugar do corpo atingido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: golpeou
  rationale: Traduz נכה como uma ação passada forte e concreta, sem o arcaísmo de «feriu» em certos usos nem a especificação excessiva de morte contida em «abateu».
- source_word: צָרָיו
  choice: seus inimigos
  rationale: Expressa de modo claro e natural o sentido de adversários ou opressores, preservando a referência possessiva.
- source_word: אָחוֹר
  choice: fazendo-os recuar
  rationale: Entende o termo adverbialmente, indicando movimento para trás. A formulação é natural em português e mantém a imagem vívida, embora explicite a relação resultativa implícita.
- source_word: חֶרְפַּת עוֹלָם
  choice: vergonha permanente
  rationale: Comunica desonra pública e duradoura. «Permanente» preserva o valor contextual de עוֹלָם sem exigir uma afirmação metafísica sobre eternidade absoluta.
- source_word: נָתַן לָמוֹ
  choice: cobriu-os de
  rationale: Representa idiomaticamente a imposição de vergonha sobre eles; evita o pouco natural «deu-lhes vergonha», mantendo o sentido causativo do hebraico.
theological_decisions: []
