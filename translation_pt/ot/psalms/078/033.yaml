  source_fidelity: O hebraico diz literalmente que ele levou/consumiu os dias deles em הֶבֶל e os anos deles em בֶּהָלָה. «Consumiu», «dias», «anos» e «terror» são opções fiéis e preservam o paralelismo e a agência divina contextual. Contudo, «Assim» introduz uma nuance consecutiva ou modal que não é exigida pelo waw narrativo e soa menos direta neste versículo isolado.
  naturalness: «Em inutilidade» é compreensível, mas é pouco idiomático para caracterizar uma existência ou dias em português atual. «Em futilidade» é mais natural, conserva o sentido de vacuidade/desperdício e evita reduzir הֶבֶל a mera falta de utilidade prática. A retirada de «Assim» também melhora a fluidez.
  terminology: «Futilidade» representa adequadamente הֶבֶל neste contexto; a nota preserva «vaidade» e a imagem concreta de sopro/fugacidade. «Terror» é uma boa tradução de בֶּהָלָה no contexto de juízo, sem impor que o termo signifique necessariamente terror súbito.
