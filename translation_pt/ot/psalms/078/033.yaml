  to: Ele consumiu os dias deles em futilidade[a], e os anos deles em terror.
  rationale: A revisão substitui uma expressão menos idiomática por «em futilidade» e elimina «Assim», que não é necessário para traduzir a progressão narrativa hebraica. Mantêm-se «consumiu», a repetição de «deles», o paralelismo «dias/anos» e «terror», todos compatíveis com o texto-fonte e com o contexto imediato.
