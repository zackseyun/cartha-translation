  - severity: medium
    issue: «Em inutilidade» é uma colocação pouco natural para הֶבֶל neste versículo.
    rationale: «Em futilidade» comunica mais idiomaticamente a ideia de dias vãos, vazios ou desperdiçados, preservando a amplitude semântica do hebraico.
