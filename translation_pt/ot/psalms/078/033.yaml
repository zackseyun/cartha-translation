base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: pt
  text: Ele consumiu os dias deles em futilidade[a], e os anos deles em terror.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vaidade”; o termo também pode evocar algo tão fugaz quanto um sopro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: consumiu
  rationale: O verbo כלה, aqui com Deus como sujeito implícito pelo contexto, pode significar acabar, completar ou consumir. “Consumiu” expressa de modo conciso a ação divina que levou seus dias ao fim.
- source_word: בַּהֶבֶל
  choice: em inutilidade
  rationale: הֶבֶל denota sopro ou vapor e, por extensão, vazio, vaidade ou inutilidade. Neste contexto, caracteriza os dias como desperdiçados e sem proveito.
- source_word: יְמֵיהֶם
  choice: os dias deles
  rationale: Mantém a imagem temporal e o paralelismo do hebraico, sem generalizar para “vidas”.
- source_word: וּשְׁנוֹתָם
  choice: e os anos deles
  rationale: Preserva o paralelismo poético entre “dias” e “anos”.
- source_word: בַּבֶּהָלָה
  choice: em terror
  rationale: בֶּהָלָה pode indicar terror, pânico, consternação ou alarme repentino. “Terror” se ajusta ao contexto de juízo divino e preserva a força emocional do termo.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: 'Deus é o sujeito: “ele consumiu”'
  alternative: 'Formulação impessoal: “os dias deles se acabaram”'
  rationale: O contexto atribui a ação a Deus em juízo. Explicitar o pronome preserva a forma verbal masculina singular e a agência divina no salmo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “deles” preserva a estrutura paralela do hebraico; “inutilidade” evita o possível sentido moral restrito que “vaidade” adquiriu no uso comum.
