base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: pt
  text: Contudo, ele deu ordem às nuvens lá do alto[a] e abriu as portas do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aos céus lá do alto».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu ordem
  rationale: צוה expressa ordenar ou dar uma ordem. «Deu ordem» é natural em português e preserva a ação soberana e pessoal de Deus; a forma narrativa é vertida no passado.
- source_word: שְׁחָקִים
  choice: nuvens
  rationale: שׁחקים pode designar nuvens ou céus. No contexto da provisão do maná e em paralelo com «portas do céu», «nuvens» mantém a imagem concreta sem eliminar a alternativa lexical.
- source_word: מִמָּעַל
  choice: lá do alto
  rationale: A expressão indica posição ou procedência superior. «Lá do alto» soa natural com «nuvens» e conserva o valor espacial do hebraico.
- source_word: דַלְתֵי
  choice: as portas do
  rationale: דלת significa normalmente «porta»; o plural em estado construto é reproduzido diretamente como «as portas do».
- source_word: שָׁמַיִם
  choice: céu
  rationale: שמים pode significar céu, céus ou firmamento. «Portas do céu» é uma expressão poética clara e corrente em português.
- source_word: פָּתָח
  choice: abriu
  rationale: פתח significa simplesmente abrir. «Abriu» preserva a força verbal sem acrescentar intensidade.
- source_word: וַ
  choice: Contudo
  rationale: Embora o waw possa ser apenas coordenativo, o contexto contrasta a incredulidade de Israel com a provisão divina. «Contudo» comunica essa relação discursiva sem alterar a ação narrada.
theological_decisions:
- issue: Força discursiva do waw inicial diante da incredulidade de Israel e da provisão de Deus
  choice: Traduzir de modo adversativo por «Contudo»
  alternative: «E» ou «Então»
  rationale: A conjunção hebraica é ampla, mas o contexto do salmo estabelece contraste entre a desconfiança do povo e a ação generosa de Deus. A tradução adversativa preserva essa tensão sem introduzir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. Conserva-se a metáfora concreta «portas do céu» e registra-se em nota a ambiguidade de שׁחקים entre «nuvens» e «céus».
