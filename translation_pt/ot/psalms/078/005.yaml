  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: pt
  text: Pois ele estabeleceu um testemunho em Jacó e instituiu uma lei[a] em Israel; ordenou aos nossos pais que os dessem a conhecer aos seus filhos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma instrução” (hebraico torá).
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “seus filhos”; neste contexto, o termo provavelmente se refere aos descendentes em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: estabeleceu
  rationale: O hifil de קום tem sentido causativo, “fazer permanecer, estabelecer”; “estabeleceu” é natural e adequado ao contexto institucional da aliança.
- source_word: עֵדוּת
  choice: um testemunho
  rationale: Preserva o sentido básico de testemunho ou atestado, sem restringi-lo indevidamente a um decreto jurídico.
- source_word: בְּיַעֲקֹב
  choice: em Jacó
  rationale: Mantém a preposição e o paralelismo poético com “em Israel”; Jacó designa metonimicamente o povo da aliança.
- source_word: וְתוֹרָה
  choice: e uma lei
  rationale: תורה pode significar lei ou instrução. Em paralelo com “testemunho” e no contexto de uma norma transmitida entre gerações, “lei” conserva bem sua força normativa.
- source_word: שָׂם
  choice: instituiu
  rationale: Embora o sentido básico seja “pôs”, “instituiu” expressa de forma natural em português o estabelecimento de uma lei e evita a formulação pouco idiomática “pôs uma lei”.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Preserva a construção hebraica e o paralelismo com “em Jacó”.
- source_word: אֲשֶׁר צִוָּה
  choice: a qual ordenou
  rationale: A oração relativa retoma de modo mais imediato “lei”, sem excluir a unidade conceitual formada por testemunho e lei.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: aos nossos pais
  rationale: Mantém o substantivo masculino explícito do hebraico e é uma formulação bíblica clara em português.
- source_word: לְהוֹדִיעָם
  choice: que dessem a conhecer
  rationale: O hifil de ידע significa literalmente causar conhecimento, isto é, “dar a conhecer”. O sufixo masculino plural pode retomar conjuntamente “testemunho” e “lei”, apesar da diferença de gênero na tradução portuguesa.
- source_word: לִבְנֵיהֶם
  choice: aos seus filhos
  rationale: בנים é formalmente “filhos”; aqui pode abranger a descendência em geral, mas a tradução mantém a forma masculina e registra a abrangência provável em nota.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: uma lei
  alternative: uma instrução
  rationale: “Lei” preserva a força normativa daquilo que Deus estabeleceu em Israel, enquanto “instrução” continua sendo uma alternativa lexical legítima e é indicada em nota.
- issue: Referente do pronome em לְהוֹדִיעָם
  choice: entender “testemunho” e “lei” como conteúdo conjunto a ser dado a conhecer
  alternative: entender o referente imediato como a lei somente
  rationale: O sufixo hebraico é masculino plural e favorece uma retomada conjunta dos dois elementos coordenados. A sintaxe portuguesa não explicita o objeto, preservando essa amplitude sem impor uma resolução.
- issue: Linguagem de parentesco em אֲבוֹתֵינוּ e לִבְנֵיהֶם
  choice: nossos pais ... seus filhos
  alternative: nossos antepassados ... suas crianças/descendentes
  rationale: A tradução conserva a forma masculina presente no hebraico; uma nota esclarece que “filhos” provavelmente possui alcance genérico e intergeracional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “em Jacó ... em Israel” foi preservado. “Instituiu uma lei” foi preferido a uma reprodução mecânica de שָׂם, por ser mais idiomático em português, enquanto “estabeleceu um testemunho” mantém a imagem institucional do primeiro membro.
