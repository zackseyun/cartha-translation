  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: pt
  text: 'Escolheu Davi, seu servo,

    e o tirou dos currais das ovelhas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos cercados” ou “dos apriscos”.
    reason: Alternativas lexicais para מִכְלְאֹת, termo que designa recintos fechados para animais.
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Escolheu
  rationale: O Qal wayyiqtol de בחר expressa a ação narrativa de escolher. Em português, o sujeito divino pode permanecer implícito, como no hebraico, e a coordenação inicial não precisa ser reproduzida isoladamente.
- source_word: בְּדָוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: עבד pode significar servo ou escravo; neste contexto, descreve de modo honorífico a relação de Davi com Deus, sem destacar uma condição social de escravidão.
- source_word: וַיִּקָּחֵהוּ
  choice: e o tirou
  rationale: לקח significa tomar ou levar. Com a origem introduzida por מִן, “tirou” comunica naturalmente em português a retirada de Davi de sua ocupação pastoril, sem explicitar o destino.
- source_word: מִמִּכְלְאֹת
  choice: dos currais
  rationale: מִכְלָאָה designa um recinto fechado para animais. “Currais” é uma equivalência portuguesa natural; a nota preserva alternativas possíveis.
- source_word: צֹאן
  choice: das ovelhas
  rationale: צאן abrange pequenos animais de rebanho, sobretudo ovelhas e cabras. Nesta expressão pastoril, “ovelhas” é idiomático e adequado ao contexto de Davi.
theological_decisions:
- issue: A condição de Davi como עבד de Deus
  choice: seu servo
  alternative: seu escravo
  rationale: O termo assinala que Davi pertence a Deus e o serve, mas o contexto privilegia sua função honorífica e escolhida, não a condição coercitiva evocada em português moderno por “escravo”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A disposição em duas linhas acompanha o paralelismo poético. O sujeito permanece implícito, recuperável do contexto do salmo.
