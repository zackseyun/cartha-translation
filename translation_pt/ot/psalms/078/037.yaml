  text: וְ֭/לִבָּ/ם לֹא נָכ֣וֹן עִמּ֑/וֹ וְ/לֹ֥א נֶ֝אֶמְנ֗וּ בִּ/בְרִיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: pt
  text: O coração deles não era firme com ele,[a] e não foram fiéis à sua aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O coração deles não era constante com ele”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não foram fiéis em sua aliança”; em português, diz-se naturalmente “fiéis à sua aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém o singular coletivo hebraico, apresentando a disposição interior do povo como uma unidade, em linguagem portuguesa natural.
- source_word: נָכוֹן
  choice: firme
  rationale: No contexto, descreve estabilidade e constância interior diante de Deus. “Firme” preserva o sentido sem sugerir apenas correção moral.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a preposição hebraica e expressa alinhamento relacional com Deus.
- source_word: נֶאֶמְנוּ
  choice: foram fiéis
  rationale: O nifal de אמן indica confiabilidade ou fidelidade; em relação à aliança, “fiéis” comunica adequadamente lealdade pactual.
- source_word: בִּבְרִיתוֹ
  choice: à sua aliança
  rationale: Embora ב seja literalmente “em”, o português idiomático rege “fiel a”, por isso “à sua aliança” transmite naturalmente a relação expressa no hebraico.
theological_decisions:
- issue: Linguagem de fidelidade à aliança
  choice: A falta de firmeza interior do povo é posta em paralelo com sua infidelidade à aliança de Deus.
  alternative: 'Traduzir de modo mais literal: “não se mostraram firmes em sua aliança”.'
  rationale: O paralelismo aponta para deslealdade relacional e moral, não apenas para falta de crença intelectual. “Não foram fiéis” preserva essa força sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular coletivo “o coração deles” conserva a imagem hebraica; “firme” e “fiéis à sua aliança” equilibram proximidade formal e naturalidade.
