  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: pt
  text: Então conduziu seu povo como ovelhas e os guiou como um rebanho pelo deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: conduziu
  rationale: A forma causativa de נסע expressa fazer partir ou pôr em marcha. “Conduziu” comunica naturalmente que Deus fez seu povo avançar, preservando também a imagem pastoral do verso.
- source_word: כַּצֹּאן
  choice: como ovelhas
  rationale: צאן designa animais de pequeno porte, sobretudo ovelhas e cabras; na comparação pastoral, “ovelhas” é a opção mais clara e natural.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עם indica aqui o povo pertencente a Deus, Israel, no contexto do êxodo.
- source_word: וַיְנַהֲגֵם
  choice: os guiou
  rationale: נהג pode significar conduzir, guiar ou tocar um rebanho. “Guiou” preserva a direção cuidadosa sugerida pela imagem do pastor e evita repetição lexical.
- source_word: כָּעֵדֶר
  choice: como um rebanho
  rationale: עדר designa rebanho ou manada; “rebanho” harmoniza naturalmente com a menção anterior às ovelhas.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: מִדְבָּר denota uma região erma ou pouco habitada, não necessariamente um deserto arenoso. Em português bíblico corrente, “deserto” é natural no contexto do êxodo, e a preposição “pelo” expressa o percurso através dessa região.
theological_decisions:
- issue: Imagem de Deus como pastor de Israel no contexto do êxodo
  choice: 'Manter diretamente as comparações: Deus conduz seu povo como ovelhas e o guia como um rebanho.'
  alternative: Explicitar Deus como “pastor” ou desenvolver a metáfora.
  rationale: O texto apresenta a ação divina por meio de comparações pastorais, sem chamar Deus explicitamente de pastor neste verso. A tradução conserva a relação entre Deus e seu povo sem acrescentar desenvolvimento doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a progressão narrativa; “pelo deserto” soa mais natural para um deslocamento através da região do que “no deserto”.
