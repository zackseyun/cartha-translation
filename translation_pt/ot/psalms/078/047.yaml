  text: יַהֲרֹ֣ג בַּ/בָּרָ֣ד גַּפְנָ֑/ם וְ֝/שִׁקְמוֹתָ֗/ם בַּֽ/חֲנָמַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/047.yaml
  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: pt
  text: Destruiu com granizo as videiras deles e, com geada[a], os seus sicômoros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com gafanhotos”, “com pedras de granizo” ou “com granizo miúdo”; o termo hebraico é raro e seu sentido é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: Destruiu
  rationale: Embora o verbo signifique literalmente “matar”, seus objetos são plantas; “destruiu” comunica de modo natural o efeito devastador sem impor uma personificação estranha em português.
- source_word: בַּבָּרָד
  choice: com granizo
  rationale: 'A preposição ב tem valor instrumental: o granizo é o meio pelo qual as videiras foram destruídas.'
- source_word: גַּפְנָם
  choice: as videiras deles
  rationale: O substantivo coletivo com sufixo de terceira pessoa masculina plural designa as plantas, não necessariamente os terrenos cultivados; “videiras” preserva essa precisão.
- source_word: וְשִׁקְמוֹתָם
  choice: e os seus sicômoros
  rationale: שִׁקְמָה designa o sicômoro-figueira (Ficus sycomorus). “Sicômoros” é conciso, corrente em traduções bíblicas portuguesas e adequado ao paralelismo com “videiras”.
- source_word: בַּחֲנָמַל
  choice: com geada
  rationale: O termo é raro e de sentido incerto. “Geada” é uma interpretação tradicional e plausível no contexto de destruição agrícola e mantém o paralelismo climático com “granizo”; a incerteza é explicitada em nota.
