  text: יְבַקַּ֣ע צֻ֭רִים בַּ/מִּדְבָּ֑ר וַ֝/יַּ֗שְׁקְ כִּ/תְהֹמ֥וֹת רַבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: pt
  text: Ele fendeu rochas no deserto e lhes deu de beber em abundância, como das grandes profundezas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e lhes deu de beber como de um imenso abismo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּע
  choice: abriu
  rationale: O piel de בקע expressa partir ou abrir à força. “Abriu” soa natural em português para rochas que passam a verter água, sem perder a ação vigorosa.
- source_word: צֻרִים
  choice: rochas
  rationale: O plural de צוּר designa rochas ou massas rochosas; “rochas” é claro, corrente e preserva o plural.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר pode indicar deserto ou região erma. “No deserto” é natural, amplamente compreensível e adequado ao cenário do êxodo.
- source_word: וַיַּשְׁקְ
  choice: lhes deu de beber
  rationale: O hifil de שׁקה significa dar de beber ou fazer beber. O pronome “lhes”, implícito no hebraico e recuperado do contexto, produz português natural.
- source_word: כִּתְהֹמוֹת
  choice: como das grandes profundezas
  rationale: O כְּ introduz comparação, e תְּהֹמוֹת evoca águas profundas ou abismos. A formulação conserva tanto a comparação quanto a imagem poética.
- source_word: רַבָּה
  choice: grandes / em abundância
  rationale: רַבָּה comunica grandeza ou abundância. O texto principal exprime a abundância do beber e também mantém a magnitude das profundezas, enquanto a nota registra uma análise mais compacta possível.
theological_decisions:
- issue: Natureza da imagem das águas
  choice: Manter a comparação “como das grandes profundezas” sem explicar a origem física da água.
  alternative: “e lhes deu de beber do grande abismo”
  rationale: O כְּ hebraico favorece uma leitura comparativa. Esta opção preserva a imagem poética de provisão prodigiosa sem impor uma cosmologia literal ou reduzir tudo a uma declaração genérica de abundância.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Deserto” é preferido a “região erma”; “profundezas” conserva a linguagem poética bíblica sem arcaísmo excessivo.
