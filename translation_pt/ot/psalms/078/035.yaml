  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: pt
  text: Então se lembraram de que Deus era a sua rocha e de que o Deus Altíssimo era o seu redentor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Então se lembraram
  rationale: O wayyiqtol dá sequência à narrativa; “Então” comunica essa progressão, e “se lembraram” traduz naturalmente o sentido passado de זכר.
- source_word: כִּי
  choice: de que
  rationale: כִּי introduz aqui o conteúdo da lembrança, não uma oração causal; após “lembraram-se”, a regência idiomática em português pede “de que”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, neste contexto designa de modo singular o Deus de Israel.
- source_word: צוּרָם
  choice: a sua rocha
  rationale: Preserva diretamente a metáfora de צוּר para estabilidade, proteção e força, sem explicá-la além do texto.
- source_word: וְאֵל עֶלְיוֹן
  choice: e o Deus Altíssimo
  rationale: Traduz אֵל como título divino e עֶלְיוֹן pelo título português consagrado “Altíssimo”, mantendo o paralelismo e sem recorrer à transliteração “El”.
- source_word: גֹּאֲלָם
  choice: o seu redentor
  rationale: Mantém a forma nominal e a amplitude de גאל neste contexto poético; “resgatador” seria possível, mas “redentor” preserva melhor a ressonância do título sem impor o sentido jurídico mais específico de parente-resgatador.
theological_decisions:
- issue: Relação entre os títulos אֱלֹהִים e אֵל עֶלְיוֹן
  choice: 'Traduzir ambos como designações do mesmo Deus: “Deus ... e ... o Deus Altíssimo”.'
  alternative: “Deus ... e ... El Altíssimo” ou “Deus ... e ... o Altíssimo”.
  rationale: O paralelismo poético apresenta duas designações da mesma pessoa divina. Traduzir אֵל evita sugerir, pela transliteração, um ser distinto e conserva a clareza para leitores comuns.
- issue: Cópula ausente nas orações nominais hebraicas
  choice: Empregar “era” nas duas orações.
  alternative: 'Manter a segunda oração elíptica: “e o Deus Altíssimo, o seu redentor”.'
  rationale: O hebraico permite predicação nominal sem cópula expressa. Em português, repetir “era” torna a frase natural e inequívoca sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “de que” e “era” explicita a coordenação de modo natural em português, enquanto “rocha” conserva a imagem poética do hebraico.
