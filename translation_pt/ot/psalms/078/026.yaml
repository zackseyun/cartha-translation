  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: pt
  text: 'Pôs em movimento o vento do leste nos céus[a]

    e, com sua força, conduziu o vento do sul.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fez partir o vento do leste nos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o sul”; aqui, provavelmente “o vento do sul”, em paralelo com “o vento do leste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: Fez partir
  rationale: O hifil de נסע significa literalmente “fazer partir” ou “pôr em movimento”. A formulação preserva a imagem hebraica e a ação direta de Deus, sem restringi-la a “soprar”.
- source_word: קָדִים
  choice: o vento leste
  rationale: קָדִים frequentemente designa o vento procedente do leste; explicitar “vento” torna claro o paralelismo com תֵימָן.
- source_word: בַּשָּׁמָיִם
  choice: nos céus
  rationale: Mantém a forma plural e o registro poético do hebraico, embora neste contexto se refira à esfera celeste onde os ventos se movem.
- source_word: וַיְנַהֵג
  choice: conduziu
  rationale: נהג pode significar conduzir, guiar ou impelir. “Conduziu” expressa o direcionamento soberano do vento sem acrescentar violência à ação.
- source_word: בְּעֻזּוֹ
  choice: com sua força
  rationale: Tradução direta de בְּ mais עֹז com sufixo, apresentando a força de Deus como o meio pelo qual ele conduz o vento.
- source_word: תֵימָן
  choice: o vento sul
  rationale: Embora o termo possa significar literalmente “sul” ou “região sul”, o paralelismo com קָדִים e o contexto indicam um vento procedente dessa direção.
theological_decisions:
- issue: Ação divina sobre as forças naturais
  choice: Os dois verbos apresentam Deus como aquele que põe um vento em movimento e conduz o outro.
  alternative: Descrever os ventos de modo impessoal, como se apenas surgissem ou soprassem.
  rationale: A gramática hebraica mantém Deus como sujeito de ambas as ações. A tradução conserva essa agência sem desenvolver afirmações teológicas além do verso.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira. “Fez partir” preserva de perto a expressão hebraica, enquanto “conduziu” mantém o paralelismo verbal e a agência divina. Os marcadores seguem a ordem de aparição no texto.
