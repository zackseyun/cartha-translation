  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: pt
  text: Quantas vezes se rebelaram contra ele no deserto e o entristeceram na terra árida![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Como repetidamente se rebelaram contra ele no deserto». A expressão inicial ressalta os repetidos atos de rebeldia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «lhe causaram dor» ou «o afligiram» na terra árida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Quantas vezes
  rationale: No uso exclamativo deste contexto, exprime frequência e repetição, não uma pergunta numérica literal.
- source_word: יַמְרוּהוּ
  choice: se rebelaram contra ele
  rationale: O hifil de מרה com sufixo de terceira pessoa masculina singular comunica rebeldia ou desafio dirigido contra Deus.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa a região desértica da peregrinação de Israel; «deserto» é a formulação bíblico-geográfica mais natural e amplamente compreensível em português.
- source_word: יַעֲצִיבוּהוּ
  choice: e o entristeceram
  rationale: O hifil de עצב pode significar causar dor, tristeza ou aflição; «entristeceram» preserva de modo natural a força pessoal e afetiva do hebraico.
- source_word: בִּישִׁימוֹן
  choice: na terra árida
  rationale: יְשִׁימוֹן indica uma região desolada e árida. A escolha distingue o termo de מִדְבָּר e conserva o paralelismo poético sem sugerir necessariamente uma área arenosa.
theological_decisions:
- issue: Linguagem antropopática a respeito de Deus em יַעֲצִיבוּהוּ
  choice: Manter a expressão pessoal e afetiva «o entristeceram» no texto principal.
  alternative: «lhe causaram dor» ou «o afligiram»
  rationale: O hebraico apresenta a rebelião de Israel como uma ofensa relacional que causa tristeza ou dor a Deus. A tradução preserva essa tensão, sem reduzi-la a uma fórmula impessoal como «o provocaram».
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Terra árida» preserva a distinção poética entre os dois termos hebraicos relacionados, enquanto «o entristeceram» mantém a linguagem relacional forte do original.
