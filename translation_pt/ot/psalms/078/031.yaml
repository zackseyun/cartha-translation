  terminology: “Ira de Deus” é registro bíblico moderno e fiel ao antropopatismo hebraico, sem impor interpretação doutrinária. “Robustos” é uma escolha sóbria para o grupo descrito como “gordos/bem nutridos”, e a nota lexical oferece transparência suficiente. “Jovens de Israel” é aceitável para os homens jovens no vigor da idade indicados por בַּחוּרִים.
