  source_fidelity: 'A tradução representa com fidelidade o hebraico: וְאַף é corretamente entendido como “a ira”; עָלָה בָהֶם é preservado na imagem “se levantou contra eles”; וַיַּהֲרֹג e הִכְרִיעַ são adequadamente vertidos por “matou” e “derrubou”. “Os mais robustos entre eles” comunica de modo plausível o sentido contextual de בְּמִשְׁמַנֵּיהֶם, e a nota mantém a alternativa literal. “Os jovens de Israel” reproduz adequadamente בַחוּרֵי יִשְׂרָאֵל.'
