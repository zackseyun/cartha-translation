  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: pt
  text: Então a ira de Deus se levantou contra eles, e ele matou os mais robustos entre eles[a]; derrubou os jovens de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os seus gordos”; provavelmente, os mais robustos ou vigorosos entre eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: Então a ira de Deus
  rationale: אַף designa idiomaticamente a ira; “Então” expressa a progressão narrativa do waw sem tornar a frase excessivamente literal.
- source_word: עָלָה בָהֶם
  choice: se levantou contra eles
  rationale: Preserva a imagem hebraica da ira que se ergue em hostilidade contra alguém e soa natural em português.
- source_word: וַיַּהֲרֹג
  choice: ele matou
  rationale: Tradução direta, clara e atual de הרג.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: os mais robustos entre eles
  rationale: O termo deriva da ideia de gordura e, neste contexto, indica provavelmente os homens bem nutridos, vigorosos ou de maior porte; “robustos” mantém mais da imagem concreta que “fortes” sem sugerir apenas obesidade.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: os jovens de Israel
  rationale: בָּחוּר se refere normalmente a homens jovens no vigor da idade; “jovens” é natural e suficientemente abrangente em português.
- source_word: הִכְרִיעַ
  choice: derrubou
  rationale: O hifil de כרע significa fazer cair ou curvar-se; “derrubou” conserva essa imagem e o paralelismo com “matou”.
theological_decisions:
- issue: Expressão antropopática da ira divina
  choice: a ira de Deus se levantou contra eles
  alternative: Deus se irou contra eles / a ira de Deus veio sobre eles
  rationale: A formulação preserva a metáfora hebraica de uma ira que se levanta, sem reduzi-la a uma explicação nem convertê-la na imagem diferente de algo que vem sobre o povo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética clara. “Robustos” procura reter a concretude do hebraico, enquanto a nota registra a forma literal e sua provável extensão contextual.
