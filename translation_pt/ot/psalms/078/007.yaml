source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: pt
  text: para que ponham em Deus a sua confiança[a], não se esqueçam dos feitos de Deus[b] e guardem os seus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua esperança” ou “a sua segurança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as obras de Deus” ou “os atos de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: para que ponham
  rationale: O qal imperfeito de שׂים significa pôr ou colocar. No encadeamento de propósito iniciado no contexto anterior, “para que ponham” expressa naturalmente a função da oração em português.
- source_word: בֵאלֹהִים
  choice: em Deus
  rationale: A preposição ב marca aqui aquele em quem se deposita a confiança; “em Deus” é a construção portuguesa natural.
- source_word: כִּסְלָם
  choice: a sua confiança
  rationale: כֶּסֶל pode indicar confiança, esperança ou segurança. “Confiança” preserva diretamente a ideia de apoio confiante sem excluir a dimensão de esperança.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: não se esqueçam
  rationale: Tradução direta do qal imperfeito negado de שׁכח, coordenado com os demais resultados pretendidos.
- source_word: מַעַלְלֵי אֵל
  choice: os feitos de Deus
  rationale: מַעֲלָלִים designa feitos, obras ou atos. “Feitos” é claro, digno e adequado ao paralelismo poético.
- source_word: וּמִצְוֺתָיו
  choice: e os seus mandamentos
  rationale: מִצְוֹת refere-se a mandamentos ou ordens; “mandamentos” mantém o registro bíblico e pactual.
- source_word: יִנְצֹרוּ
  choice: guardem
  rationale: נצר significa guardar, vigiar ou observar. Com “mandamentos”, “guardar” preserva tanto a observância quanto a ideia de cuidado atento.
theological_decisions:
- issue: Tradução dos nomes divinos אֱלֹהִים e אֵל nos membros paralelos
  choice: Ambos traduzidos como “Deus”
  alternative: Traduzir אֵל como “o Poderoso” ou variar para “Deus Todo-Poderoso”
  rationale: Os dois termos são designações divinas comuns empregadas em paralelismo poético, não o nome pactual YHWH. Traduzir ambos como “Deus” preserva o sentido e evita introduzir uma distinção teológica não enfatizada pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e o fluxo de propósito do contexto, sem explicitar além do hebraico.
