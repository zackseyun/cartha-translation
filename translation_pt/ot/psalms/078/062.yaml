base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: pt
  text: Entregou seu povo à espada e se enfureceu contra a sua herança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Entregou
  rationale: O hifil de סגר, neste contexto, significa entregar alguém ao poder de outro. “Entregou” preserva o valor causativo e é natural em português.
- source_word: לַחֶרֶב
  choice: à espada
  rationale: חֶרֶב significa literalmente “espada” e aqui representa a morte violenta em combate. A tradução conserva a imagem hebraica.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עַם com o sufixo de terceira pessoa masculina singular designa o povo pertencente a Deus no relato histórico do salmo.
- source_word: וּבְנַחֲלָתוֹ
  choice: contra a sua herança
  rationale: נַחֲלָה designa Israel como herança ou propriedade recebida. Com o verbo de ira, a preposição ב é expressa naturalmente em português por “contra”.
- source_word: הִתְעַבָּר
  choice: se enfureceu
  rationale: O hitpael de עבר nesta expressão indica ira intensa. “Se enfureceu” comunica a força do verbo sem ampliar seu sentido.
theological_decisions:
- issue: Tradução dos termos pactuais referentes a Israel
  choice: seu povo ... sua herança
  alternative: sua nação ... seu patrimônio
  rationale: 'A manutenção dos dois termos preserva a tensão teológica do texto: o juízo recai sobre aqueles que continuam sendo descritos como povo e herança de Deus.'
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A coordenação concisa acompanha a estrutura poética hebraica; o possessivo “sua” retoma Deus sem ambiguidade relevante no contexto.
