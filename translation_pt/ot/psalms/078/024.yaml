  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: pt
  text: Fez chover sobre eles maná para que comessem e lhes deu o grão do céu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cereal dos céus”. A expressão é uma descrição poética do maná; em contextos relacionados, também é traduzida de modo mais interpretativo como “alimento do céu” ou “pão do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Fez chover
  rationale: O hifil de מטר tem sentido causativo. “Fez chover” reproduz esse valor de modo claro e natural em português.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל com sufixo pronominal indica aqui a direção do maná que descia sobre o povo.
- source_word: מָן
  choice: maná
  rationale: “Maná” é a forma tradicional e amplamente reconhecida em português para o alimento do deserto.
- source_word: לֶאֱכֹל
  choice: para que comessem
  rationale: O infinitivo com ל expressa finalidade. A oração desenvolvida deixa explícito, em português natural, que o maná foi dado para eles comerem.
- source_word: דְגַן
  choice: grão
  rationale: דגן designa coletivamente grãos ou cereais. “Grão” preserva a imagem agrícola e poética sem restringi-la indevidamente a trigo.
- source_word: שָׁמַיִם
  choice: céu
  rationale: Embora a forma hebraica seja morfologicamente plural, “céu” é a expressão idiomática em português neste construto poético e conserva sua dimensão elevada.
- source_word: נָתַן
  choice: deu
  rationale: נתן é o verbo comum “dar”; a escolha preserva a simplicidade e a força direta do hebraico.
- source_word: לָמוֹ
  choice: lhes
  rationale: A forma pronominal poética significa “a eles”; o pronome indireto “lhes” é conciso e natural na construção portuguesa.
theological_decisions:
- issue: Descrição metafórica do maná como “grão do céu”
  choice: Manter a metáfora poética “grão do céu”.
  alternative: Traduzir interpretativamente como “alimento do céu” ou “pão do céu”.
  rationale: O hebraico emprega דגן, “grão/cereal”, em paralelo poético com o maná. Preservar a imagem evita substituir o termo original por formulações interpretativas vindas de contextos relacionados.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da metáfora hebraica. O sujeito divino permanece implícito, como no versículo hebraico em seu contexto.
