  text: לֹא זָכְר֥וּ אֶת יָד֑/וֹ י֝֗וֹם אֲֽשֶׁר פָּדָ֥/ם מִנִּי צָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: pt
  text: Não se lembraram da mão dele[a], do dia em que ele os resgatou do adversário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu poder” ou “daquilo que sua mão havia feito”. O hebraico diz literalmente “da mão dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do inimigo” ou “do opressor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: se lembraram
  rationale: O qal de זכר significa normalmente “lembrar-se, recordar”. Com לֹא, “não se lembraram” conserva de modo transparente a formulação hebraica e evita a interpretação um pouco mais forte de “esqueceram”.
- source_word: יָדוֹ
  choice: da mão dele
  rationale: “Mão” é uma metáfora hebraica frequente para poder ou ação. A imagem concreta foi mantida, pois continua compreensível em português, e uma nota explicita os sentidos possíveis.
- source_word: יוֹם אֲשֶׁר
  choice: do dia em que
  rationale: A expressão mantém o substantivo temporal יוֹם e reproduz com naturalidade em português a ideia de “o dia em que”.
- source_word: פָּדָם
  choice: ele os resgatou
  rationale: פדה designa resgatar ou redimir alguém de cativeiro ou perigo. “Resgatou” é natural no português contemporâneo e preserva aqui o ato concreto de libertação sem perder o sentido redentivo.
- source_word: מִנִּי צָר
  choice: do adversário
  rationale: צָר pode designar adversário, inimigo ou opressor. “Adversário” conserva a amplitude lexical e combina com o registro poético e digno do salmo.
theological_decisions:
- issue: Força metafórica de “sua mão”
  choice: Manter no texto principal a imagem concreta como “a mão dele”.
  alternative: seu poder; aquilo que sua mão havia feito
  rationale: O hebraico emprega “mão”, metáfora bíblica comum para poder e ação. Preservá-la evita resolver uma imagem genuína do texto em uma abstração interpretativa.
- issue: Sentido de פדה no contexto do êxodo
  choice: Traduzir como “resgatou”.
  alternative: redimiu; libertou
  rationale: No contexto histórico do salmo, פדה evoca a ação salvadora de Deus ao retirar o povo da opressão. “Resgatou” preserva o componente de livramento característico do verbo, enquanto “libertou” seria mais amplo e “redimiu” poderia soar mais abstrato para o leitor comum.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém a concisão poética, a metáfora hebraica da mão e o valor temporal explícito de “dia”, sem introduzir especificidades denominacionais.
