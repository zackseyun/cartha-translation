  text: וַ/יִּקַ֖ץ כְּ/יָשֵׁ֥ן אֲדֹנָ֑/י כְּ֝/גִבּ֗וֹר מִתְרוֹנֵ֥ן מִ/יָּֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: pt
  text: Então o Senhor despertou como quem dormia, como um guerreiro que dá um brado por causa do vinho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um guerreiro que exulta por causa do vinho”; ou: “como um valente que grita, estimulado pelo vinho”.'
    reason: A forma מִתְרוֹנֵן pode denotar gritar ou exultar, גִּבּוֹר pode ser “guerreiro” ou “valente”, e מִן admite nuances de causa ou origem.
lexical_decisions:
- source_word: וַיִּקַץ
  choice: despertou
  rationale: O verbo יקץ significa despertar ou acordar; “despertou” é natural e mantém a imagem poética.
- source_word: כְּיָשֵׁן
  choice: como quem dormia
  rationale: A preposição comparativa כְּ apresenta uma semelhança. A formulação conserva o antropomorfismo como comparação, sem afirmar literalmente que o Senhor dormia.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Trata-se do título divino אֲדֹנָי, não do tetragrama; “o Senhor” é a correspondência portuguesa adequada.
- source_word: כְּגִבּוֹר
  choice: como um guerreiro
  rationale: גִּבּוֹר pode designar um homem forte, valente ou guerreiro; “guerreiro” se ajusta à imagem marcial do contexto.
- source_word: מִתְרוֹנֵן
  choice: que dá um brado
  rationale: O particípio expressa a emissão vigorosa de um grito, possivelmente jubiloso. “Dá um brado” preserva a força da imagem sem reduzi-la a uma emoção interior.
- source_word: מִיָּיִן
  choice: por causa do vinho
  rationale: A preposição מִן pode indicar origem ou causa; aqui a expressão retrata o brado provocado pelo efeito do vinho, embora a relação exata permaneça aberta a uma tradução mais literal, registrada em nota.
theological_decisions:
- issue: Representação antropomórfica de Deus despertando e comparação com um guerreiro estimulado pelo vinho
  choice: Manter integralmente a comparação poética, inclusive a referência ao vinho.
  alternative: Suavizar o antropomorfismo ou interpretar o vinho explicitamente como metáfora.
  rationale: O hebraico emprega uma imagem poética ousada para retratar a intervenção decisiva do Senhor após um período de aparente inatividade. A tradução preserva essa tensão em vez de explicá-la ou atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Como quem dormia” marca claramente a comparação; “dá um brado” mantém o vigor poético e marcial.
