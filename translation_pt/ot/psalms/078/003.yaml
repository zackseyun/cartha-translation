lexical_decisions:
- source_word: אֲשֶׁר
  choice: aquilo que
  rationale: Retoma o conteúdo mencionado no contexto anterior e introduz naturalmente, em português, as coisas ou ensinamentos ouvidos, conhecidos e transmitidos.
- source_word: וַנֵּדָעֵם
  choice: e conhecemos
  rationale: O verbo ידע traz aqui um sufixo de objeto plural; “conhecemos” conserva a ideia de conhecimento adquirido e permite que “aquilo que” funcione como objeto em português.
- source_word: וַאֲבוֹתֵינוּ
  choice: e nossos pais
  rationale: Traduz literalmente אָבוֹת sem restringir indevidamente a referência a ancestrais remotos; no contexto, “pais” pode abranger gerações anteriores.
- source_word: סִפְּרוּ־לָנוּ
  choice: nos contaram
  rationale: Expressa de modo natural o ato de narrar ou transmitir oralmente o conteúdo à geração seguinte.
