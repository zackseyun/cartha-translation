base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: pt
  text: Deus ouviu e ficou furioso,[a] e rejeitou completamente Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou irado”. O verbo hebraico expressa tornar-se irado ou enfurecer-se.
    reason: lexical_alternative
  - marker: b
    text: Ou “repudiou” ou “desprezou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: ouviu
  rationale: O qal perfeito tem aqui o sentido comum de ouvir e introduz a reação de Deus à conduta de Israel.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o sentido verbal singular identifica claramente o Deus de Israel.
- source_word: וַיִּתְעַבָּר
  choice: ficou furioso
  rationale: No hitpael, o verbo expressa tornar-se irado ou ser tomado de ira. A formulação é natural em português e preserva a intensidade do hebraico.
- source_word: וַיִּמְאַס
  choice: rejeitou
  rationale: O verbo מאס pode significar rejeitar, repudiar ou desprezar. 'Rejeitou' exprime com naturalidade o ato de repúdio neste contexto.
- source_word: מְאֹד
  choice: completamente
  rationale: O advérbio intensifica fortemente a rejeição; 'rejeitou completamente' comunica essa força de modo idiomático.
- source_word: בְּיִשְׂרָאֵל
  choice: Israel
  rationale: Com מאס, a preposição introduz o objeto da rejeição, expresso naturalmente em português como objeto direto.
theological_decisions:
- issue: Linguagem antropopática sobre a ira e a rejeição divinas
  choice: 'Manter a linguagem pessoal forte: ''ficou furioso'' e ''rejeitou completamente''.'
  alternative: Suavizar para 'ficou descontente' e 'retirou seu favor de Israel'.
  rationale: O hebraico emprega linguagem vigorosa de juízo ligado à aliança. A tradução preserva essa tensão teológica sem atenuar a severidade afirmada pelo salmo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação simples acompanha o movimento narrativo do hebraico, e as notas preservam alternativas lexicais genuínas.
