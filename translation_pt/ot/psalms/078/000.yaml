base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: pt
  text: 'Maskil de Asafe.[a]


    Escutem, povo meu, a minha instrução; inclinem os ouvidos às palavras da minha boca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskil” é um termo técnico encontrado nos títulos dos salmos; pode indicar uma composição instrutiva ou contemplativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Mantém transliterado o termo técnico do título, cujo sentido preciso é incerto, e explica suas possibilidades em nota.
- source_word: תּוֹרָתִי
  choice: minha instrução
  rationale: Neste contexto sapiencial, תּוֹרָה designa ensino ou instrução, não necessariamente a Lei mosaica em sentido técnico.
- source_word: הַאֲזִינָה
  choice: Escute
  rationale: Expressa em português corrente o imperativo idiomático de prestar atenção, sem reproduzir de modo artificial a imagem hebraica de 'dar ouvidos'.
- source_word: הַטּוּ אָזְנְכֶם
  choice: incline os ouvidos
  rationale: Preserva a imagem poética hebraica e o paralelismo com o primeiro imperativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com imperativo de tratamento coletivo. O título foi separado do corpo do salmo, e o paralelismo poético foi preservado.
