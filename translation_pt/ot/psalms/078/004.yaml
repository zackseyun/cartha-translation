  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: pt
  text: Não os ocultaremos dos filhos deles; contaremos à geração futura[a] os feitos dignos de louvor[b] de Yahweh, o seu poder e as maravilhas que ele realizou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à geração seguinte” ou “a uma geração posterior”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os louvores de Yahweh”. O hebraico pode indicar tanto os louvores dirigidos a Yahweh quanto seus atos dignos de louvor; o contexto favorece aqui a segunda opção.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: ocultaremos
  rationale: O piel de כחד expressa ocultar ou reter algo. “Não os ocultaremos” preserva a negação enfática e soa natural em português.
- source_word: מִבְּנֵיהֶם
  choice: dos filhos deles
  rationale: בנים pode indicar filhos ou descendentes. “Filhos” mantém a imagem concreta da transmissão entre gerações, enquanto “deles” preserva o referente plural do hebraico.
- source_word: לְדוֹר אַחֲרוֹן
  choice: à geração futura
  rationale: A expressão designa uma geração posterior. “Geração futura” conserva o sentido prospectivo sem limitar necessariamente a referência à geração imediatamente seguinte.
- source_word: מְסַפְּרִים
  choice: contaremos
  rationale: 'O particípio descreve a ação pela qual o povo não ocultará esses fatos: narrando-os. A forma finita “contaremos”, ligada por ponto e vírgula, comunica essa relação com clareza e força em português.'
- source_word: תְּהִלּוֹת יְהוָה
  choice: os feitos dignos de louvor de Yahweh
  rationale: תהלות pode significar louvores dirigidos a Yahweh ou aquilo nele que merece louvor. A coordenação com seu poder e suas maravilhas favorece aqui os atos dignos de louvor, sem eliminar a alternativa lexical, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: עֱזוּזוֹ
  choice: o seu poder
  rationale: O substantivo denota força ou poder. “Poder” é corrente, claro e adequado à descrição das ações divinas.
- source_word: נִפְלְאוֹתָיו
  choice: as maravilhas
  rationale: O termo se refere a atos extraordinários que despertam admiração. “Maravilhas” é conciso, digno e amplamente compreensível.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele realizou
  rationale: A oração relativa modifica “maravilhas”. “Realizou” expressa atos efetuados por Yahweh de maneira natural, evitando a construção menos elegante “maravilhas que fez”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal de Deus sem substituí-lo por um título.
- issue: Sentido de תְּהִלּוֹת יְהוָה
  choice: os feitos dignos de louvor de Yahweh
  alternative: os louvores de Yahweh
  rationale: A sequência “seu poder” e “as maravilhas que ele realizou” favorece a referência às ações ou qualidades louváveis de Yahweh. Como a expressão também pode designar louvores oferecidos a ele, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. O ponto e vírgula torna explícita a progressão entre não ocultar e contar, embora o hebraico use um particípio. Mantiveram-se a referência intergeracional, o paralelismo da enumeração e a ambiguidade lexical relevante em nota.
