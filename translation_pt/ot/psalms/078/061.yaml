  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: pt
  text: Entregou sua força[a] ao cativeiro[c] e seu esplendor[b] às mãos do adversário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão pode aludir à arca como sinal da força de Deus no meio de Israel.
    reason: cultural_note
  - marker: b
    text: Ou “sua glória” ou “sua beleza”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, ao poder do inimigo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Entregou
  rationale: Neste contexto de juízo e captura, נתן indica que Deus deixou sua força cair em poder inimigo. “Entregou” exprime isso naturalmente sem explicitar além do hebraico o referente poético.
- source_word: לַשְּׁבִי
  choice: ao cativeiro
  rationale: שְׁבִי designa cativeiro ou condição de capturado. A preposição לְ marca aqui o destino da entrega; “ao cativeiro” conserva a formulação compacta e poética.
- source_word: עֻזּוֹ
  choice: a sua força
  rationale: עֹז significa força ou poder. A tradução literal preserva a provável metonímia, sem identificar explicitamente a arca ou o santuário.
- source_word: וְתִפְאַרְתּוֹ
  choice: e o seu esplendor
  rationale: תִּפְאֶרֶת pode significar esplendor, glória ou beleza. “Esplendor” mantém a ideia de magnificência e honra e combina bem com o paralelismo poético.
- source_word: בְיַד
  choice: nas mãos de
  rationale: O hebraísmo “na mão de” indica domínio ou poder. O plural idiomático em português, “nas mãos de”, preserva a imagem e comunica naturalmente a sujeição.
- source_word: צָר
  choice: o adversário
  rationale: צַר designa inimigo, opressor ou adversário. “Adversário” é claro, digno e adequado ao registro poético.
theological_decisions:
- issue: Identificação de “sua força” e “seu esplendor”
  choice: Manter as expressões poéticas sem identificar seu referente no texto principal
  alternative: Identificá-las explicitamente com a arca, o santuário ou a presença gloriosa de Deus
  rationale: O contexto provavelmente alude à captura da arca, mas o hebraico não a nomeia neste versículo. A tradução conserva, portanto, a ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Entregou ao cativeiro” mantém a concisão do hebraico; “nas mãos do adversário” torna natural em português o idiomatismo sem perder sua imagem.
