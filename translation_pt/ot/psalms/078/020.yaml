base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: pt
  text: Vejam! Ele feriu a rocha, e as águas jorraram, e torrentes transbordaram. Será que ele também pode dar pão ou fornecer carne[a] ao seu povo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “carne” e, neste contexto, provavelmente se refere à carne como alimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam!
  rationale: Introduz um apelo enfático a um fato evidente. O imperativo plural soa natural em português e preserva a força dêitica da expressão hebraica.
- source_word: הִכָּה
  choice: feriu
  rationale: Expressa de modo digno e corrente a ação passada e vigorosa de golpear a rocha.
- source_word: צוּר
  choice: a rocha
  rationale: Refere-se à rocha do conhecido episódio no deserto; o artigo definido preserva essa referência específica.
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: e as águas jorraram
  rationale: Mantém o plural poético e comunica o fluxo abundante e vívido indicado pelo verbo.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: e torrentes transbordaram
  rationale: נְחָלִים pode designar cursos de água ou torrentes, e שׁטף sugere fluxo impetuoso ou transbordamento; a formulação conserva a intensidade da imagem.
- source_word: הֲגַם
  choice: Será que ele também pode
  rationale: Marca claramente a pergunta retórica e cética, enquanto גם amplia a questão da água para o alimento.
- source_word: לֶחֶם
  choice: pão
  rationale: Preserva o termo concreto hebraico e seu contraste com carne na oração seguinte.
- source_word: יוּכַל תֵּת
  choice: pode dar
  rationale: Reproduz diretamente a ideia de capacidade expressa pelo verbo modal e pelo infinitivo.
- source_word: אִם
  choice: ou
  rationale: Neste contexto, introduz de modo disjuntivo o segundo membro da pergunta retórica.
- source_word: יָכִין
  choice: fornecer
  rationale: No contexto da provisão de alimento, comunica naturalmente o sentido causativo de preparar ou tornar disponível.
- source_word: שְׁאֵר
  choice: carne
  rationale: O substantivo significa literalmente carne ou tecido carnal e, aqui, refere-se provavelmente a carne como alimento.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: עם designa aqui Israel como o povo de Deus; a regência de 'fornecer' permite uma formulação portuguesa natural.
theological_decisions:
- issue: Força retórica do ceticismo de Israel
  choice: Apresentar as orações finais como uma pergunta cética sobre a capacidade de Deus de prover alimento além de água
  alternative: Traduzir as orações de maneira mais plana, com menor destaque interrogativo
  rationale: A partícula interrogativa e o contexto de incredulidade no salmo favorecem uma pergunta retórica explícita, sem resolver ou suavizar a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vejam!” evita o arcaísmo de “Eis” sem perder a ênfase; “torrentes” preserva a intensidade poética. A pontuação explicita a pergunta retórica presente no hebraico.
