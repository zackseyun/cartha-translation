  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: pt
  text: Por isso, Yahweh ouviu e ficou enfurecido[a]; e um fogo se acendeu contra Jacó[b], e a ira também se levantou contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi provocado à ira” ou “ficou indignado”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em Jacó” e, no fim do versículo, “em Israel”; aqui, “contra” expressa o contexto hostil do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência do que foi narrado anteriormente.
- source_word: שָׁמַע
  choice: ouviu
  rationale: Tradução direta do verbo, deixando ao contexto a ideia de que Yahweh tomou conhecimento das palavras de Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיִּתְעַבָּר
  choice: ficou indignado
  rationale: Comunica a forte reação de ira expressa pelo hitpael, em linguagem portuguesa atual e digna.
- source_word: אֵשׁ נִשְּׂקָה
  choice: um fogo se acendeu
  rationale: Preserva a imagem do fogo e o sentido passivo/resultativo do verbo, com formulação natural em português.
- source_word: בְיַעֲקֹב
  choice: contra Jacó
  rationale: Interpreta a preposição בְ segundo o contexto hostil de juízo, sem perder a alternativa formal indicada em nota.
- source_word: וְגַם אַף
  choice: e também a ira
  rationale: Mantém a força aditiva de וְגַם e traduz o idiomatismo אַף por seu sentido contextual.
- source_word: עָלָה
  choice: se levantou
  rationale: Conserva a metáfora vertical do hebraico em português compreensível.
- source_word: בְיִשְׂרָאֵל
  choice: contra Israel
  rationale: Assim como no membro paralelo, traduz בְ com sentido hostil/judicial.
theological_decisions:
- issue: Intensidade da linguagem da ira divina
  choice: ficou indignado; a ira se levantou
  alternative: ficou enfurecido; foi provocado à ira
  rationale: Mantém inequívoca a forte reação divina, sem suavizá-la para mero desagrado; 'indignado' é natural e digno em português.
- issue: Natureza da imagem do fogo
  choice: Preservar 'um fogo se acendeu' sem definir se é literal ou metafórico.
  alternative: Explicitar que se trata de fogo literal ou de uma metáfora do juízo.
  rationale: O hebraico não resolve essa questão; a tradução conserva a imagem e sua tensão interpretativa.
- issue: Relação entre a indignação e o fogo
  choice: Manter coordenação por ponto e vírgula, sem transformar o waw em explicação causal.
  alternative: Traduzir o waw como 'pois'.
  rationale: A coordenação reflete mais diretamente וְ e preserva o paralelismo entre fogo e ira.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das notas segue sua primeira ocorrência no texto; a variante estrutural inglesa não foi reproduzida, pois a redação portuguesa já mantém claramente a coordenação hebraica.
