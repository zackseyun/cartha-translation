  text: יְשַׁלַּח בָּ֨/ם חֲר֬וֹן אַפּ֗/וֹ עֶבְרָ֣ה וָ/זַ֣עַם וְ/צָרָ֑ה מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: pt
  text: Enviou contra eles o ardor da sua ira — fúria, indignação e aflição —, um destacamento de mensageiros destruidores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um envio de anjos portadores de destruição”; tradicionalmente, “anjos maus”. O hebraico pode referir-se a mensageiros cujo caráter é destrutivo, e não necessariamente a seres moralmente maus.'
    reason: Leitura alternativa de מִשְׁלַחַת מַלְאֲכֵי רָעִים e preservação da ambiguidade lexical e teológica.
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Enviou
  rationale: O piel de שלח descreve a ação divina dirigida contra os egípcios. O pretérito acompanha naturalmente a sequência narrativa poética.
- source_word: בָּם
  choice: contra eles
  rationale: Com o verbo 'enviar' em contexto hostil, a preposição indica julgamento dirigido contra seus destinatários, não mera localização.
- source_word: חֲרוֹן אַפּוֹ
  choice: o ardor da sua ira
  rationale: Preserva a imagem hebraica de calor intenso associada à ira, em linguagem portuguesa natural e solene.
- source_word: עֶבְרָה
  choice: fúria
  rationale: Expressa ira transbordante e mantém a intensidade da acumulação poética sem repetir o termo 'ira'.
- source_word: וָזַעַם
  choice: indignação
  rationale: זעם pode indicar ira condenatória ou indignação; a escolha distingue este termo dos sinônimos ao redor.
- source_word: וְצָרָה
  choice: e aflição
  rationale: צרה designa dificuldade, angústia ou aflição imposta aos destinatários; 'aflição' se ajusta ao contexto de juízo.
- source_word: מִשְׁלַחַת
  choice: um destacamento de
  rationale: O substantivo denota algo enviado ou despachado. 'Destacamento' comunica de modo idiomático um grupo incumbido de uma missão, sem apagar a noção de envio.
- source_word: מַלְאֲכֵי
  choice: mensageiros
  rationale: מלאך pode designar mensageiros humanos ou sobrenaturais. 'Mensageiros' preserva essa amplitude lexical sem determinar sua natureza no texto principal.
- source_word: רָעִים
  choice: destruidores
  rationale: Neste contexto de calamidade enviada como juízo, o adjetivo pode descrever o efeito nocivo ou destrutivo dos mensageiros, sem exigir que sejam moralmente maus.
theological_decisions:
- issue: Se מַלְאֲכֵי רָעִים designa anjos moralmente maus ou agentes de um juízo destrutivo
  choice: um destacamento de mensageiros destruidores
  alternative: anjos maus; anjos de calamidade; mensageiros nocivos
  rationale: מלאך significa 'mensageiro' e רָעִים pode indicar maldade moral ou efeito nocivo e calamitoso. O texto principal conserva o sentido de juízo destrutivo sem afirmar a natureza moral ou ontológica dos agentes; a nota registra as leituras alternativas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões destacam a série poética de termos ligados ao juízo divino; 'destacamento' conserva a ideia de um grupo enviado. A nota foi colocada junto à expressão ambígua a que se refere.
