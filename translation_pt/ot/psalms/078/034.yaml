  source_fidelity: 'A tradução reproduz adequadamente a sequência e o paralelismo do hebraico: a circunstância temporal («Quando»), o matar por Deus, a busca por ele, o retorno e a busca diligente de Deus. «Voltavam» preserva o sentido básico de שוב sem impor «arrependiam-se».'
