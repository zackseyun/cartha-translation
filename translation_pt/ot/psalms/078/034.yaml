  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: pt
  text: Quando ele os matava, eles o buscavam; voltavam e buscavam a Deus com empenho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “buscavam cedo a Deus”, expressão que transmite a ideia de buscá-lo com diligência ou empenho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Quando
  rationale: Neste relato poético de circunstâncias repetidas, אִם tem valor temporal, não meramente hipotético.
- source_word: הֲרָגָם
  choice: ele os matava
  rationale: O verbo הרג significa matar. O imperfeito habitual em português expressa adequadamente a ação repetida no contexto; o sujeito implícito é Deus.
- source_word: וּדְרָשׁוּהוּ
  choice: eles o buscavam
  rationale: דרש com objeto pessoal significa buscar alguém; o pronome preserva o sufixo hebraico que se refere a Deus.
- source_word: וְשָׁבוּ
  choice: voltavam
  rationale: שוב significa fundamentalmente voltar ou retornar. A tradução preserva esse sentido sem tornar explícita a ideia mais forte de arrependimento, embora ela possa estar implícita no contexto.
- source_word: וְשִׁחֲרוּ
  choice: buscavam ... com empenho
  rationale: No piel, שחר pode designar buscar cedo e, por extensão idiomática, buscar com diligência ou empenho. A formulação é clara em português atual.
- source_word: אֵל
  choice: Deus
  rationale: אֵל é aqui um título divino comum, traduzido naturalmente como “Deus” sem expansão interpretativa.
theological_decisions:
- issue: Se וְשָׁבוּ deve ser traduzido com linguagem explícita de arrependimento
  choice: voltavam
  alternative: arrependiam-se; voltavam atrás
  rationale: Embora שוב possa implicar arrependimento neste contexto, seu sentido lexical básico é voltar. A opção escolhida preserva a possível dimensão teológica sem a tornar mais explícita do que o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi mantido, e o aspecto habitual foi expresso por verbos no imperfeito.
