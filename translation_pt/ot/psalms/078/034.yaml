  terminology: «Deus» é a equivalência natural de אֵל neste contexto. «Buscar» para דרש e «voltar» para שוב são escolhas semanticamente sóbrias e não confessionais. A nota explica de modo suficiente o sentido literal e idiomático de שחר.
