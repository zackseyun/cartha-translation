  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְנַסּ֣וּ וַ֭/יַּמְרוּ אֶת אֱלֹהִ֣ים עֶלְי֑וֹן וְ֝/עֵדוֹתָ֗י/ו לֹ֣א שָׁמָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/056.yaml
  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: pt
  text: Mas eles puseram Deus, o Altíssimo, à prova e se rebelaram contra ele; não guardaram os seus testemunhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus estatutos” ou “as suas prescrições”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: puseram ... à prova
  rationale: נסּה significa testar ou pôr à prova. A locução é natural em português e mantém a força acusatória do contexto.
- source_word: וַיַּמְרוּ
  choice: se rebelaram contra ele
  rationale: מרה expressa rebeldia ou desafio à autoridade divina. A explicitação pronominal produz sintaxe clara sem acrescentar um novo referente.
- source_word: אֶת אֱלֹהִים עֶלְיוֹן
  choice: Deus, o Altíssimo
  rationale: Mantém os dois elementos do título divino e trata עֶלְיוֹן naturalmente como título em aposição.
- source_word: וְעֵדוֹתָיו
  choice: os seus testemunhos
  rationale: Preserva a dimensão de testemunho e a conotação pactual de עֵדוֹת, embora o termo também possa designar prescrições ou estatutos.
- source_word: לֹא שָׁמָרוּ
  choice: não guardaram
  rationale: שׁמר, com mandamentos ou testemunhos, significa guardar ou observar. 'Guardar' é corrente na linguagem bíblica portuguesa e conserva a imagem lexical.
- source_word: וַ
  choice: Mas
  rationale: 'O contexto discursivo é contrastivo: apesar dos atos divinos anteriormente narrados, o povo voltou a testar Deus e a rebelar-se.'
theological_decisions:
- issue: Forma do título divino אֱלֹהִים עֶלְיוֹן
  choice: Deus, o Altíssimo
  alternative: o Deus Altíssimo
  rationale: A aposição é natural em português e preserva a ênfase na supremacia divina sem introduzir nuance doutrinária adicional.
- issue: Sentido legal e pactual de עֵדוֹתָיו
  choice: os seus testemunhos
  alternative: os seus estatutos; as suas prescrições
  rationale: A escolha retém a dimensão de testemunho própria do termo hebraico, enquanto a nota registra equivalentes jurídicos possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo verbal foi tornado explícito por “contra ele”, evitando fazer “à prova” reger indevidamente o segundo verbo.
