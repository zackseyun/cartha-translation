  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: pt
  text: e para que não fossem como seus antepassados, uma geração teimosa e rebelde, uma geração que não firmou o coração[a] e cujo espírito não foi fiel a Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não preparou o coração” ou “não estabeleceu o coração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cujo espírito não permaneceu firme com Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: e para que não fossem
  rationale: O contexto dá à forma verbal uma nuance de propósito ligada aos versículos anteriores; a formulação é natural em português e mantém essa ligação.
- source_word: כַאֲבוֹתָם
  choice: como seus antepassados
  rationale: Embora o hebraico diga literalmente “seus pais”, aqui o termo designa as gerações precedentes; “antepassados” evita uma leitura limitada aos pais imediatos.
- source_word: דּוֹר
  choice: geração
  rationale: É o sentido normal no salmo e preserva a repetição poética do substantivo coletivo.
- source_word: סוֹרֵר וּמֹרֶה
  choice: teimosa e rebelde
  rationale: A combinação expressa resistência obstinada e rebelião ativa; “teimosa e rebelde” é clara, atual e mantém os dois aspectos.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: não firmou o coração
  rationale: הכין pode significar preparar, estabelecer ou tornar firme. A tradução conserva a metáfora da resolução interior sem especificar indevidamente uma única nuance.
- source_word: לֵב / לִבּוֹ
  choice: coração
  rationale: Preserva o idioma antropológico hebraico, que abrange vontade, intenção e disposição interior.
- source_word: וְלֹא נֶאֶמְנָה אֶת אֵל רוּחוֹ
  choice: e cujo espírito não foi fiel a Deus
  rationale: Mantém “espírito” distinto de “coração” e traduz נֶאֶמְנָה pela ideia relacional de fidelidade, sem eliminar a possível nuance de firmeza.
theological_decisions:
- issue: Distinção antropológica entre coração e espírito
  choice: 'Preservar os dois termos: “coração” e “espírito”.'
  alternative: Fundir ambos em expressões como “mente”, “interior” ou “disposição”.
  rationale: O hebraico emprega dois termos relacionados, mas distintos; conservá-los mantém a textura poética e a tensão antropológica do texto.
- issue: Concordância com o substantivo coletivo “geração”
  choice: 'Usar formas singulares: “o coração” e “cujo espírito”.'
  alternative: Pluralizar como “seus corações” e “seus espíritos”.
  rationale: Os sufixos hebraicos estão no singular e retomam o coletivo singular דּוֹר; a estrutura permanece natural em português.
- issue: Relação do espírito com Deus
  choice: “fiel a Deus”.
  alternative: “firme com Deus”.
  rationale: “Fiel” expressa adequadamente a confiabilidade ou lealdade de נֶאֶמְנָה, enquanto a nota registra a leitura de firmeza sem impor uma formulação teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Antepassados” esclarece o referente intergeracional; “teimosa” comunica de modo corrente a resistência moral de סוֹרֵר. As notas preservam as ambiguidades lexicais genuínas de הכין e אמן.
