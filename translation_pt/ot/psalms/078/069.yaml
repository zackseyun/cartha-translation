source:
  edition: WLC
  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: pt
  text: E ele construiu seu santuário como as alturas[a], como a terra que estabeleceu para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os altos céus” ou “como os cumes elevados”. A expressão hebraica é poética e pode evocar imagens celestes ou montanhosas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que fundou para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: E ele construiu
  rationale: O wayyiqtol de בנה dá continuidade à sequência narrativa. A formulação preserva tanto o sentido direto de “construir” quanto o encadeamento do verso.
- source_word: כְּמוֹ
  choice: como
  rationale: A preposição introduz uma comparação; “como” é o equivalente natural e direto em português.
- source_word: רָמִים
  choice: as alturas
  rationale: O termo plural derivado de רום denota o que é elevado. “As alturas” conserva a imagem poética sem restringi-la aos céus ou às montanhas e evita a conotação cultual que “lugares altos” poderia ter.
- source_word: מִקְדָּשׁוֹ
  choice: seu santuário
  rationale: מקדש designa um lugar santo ou santuário. “Seu santuário” mantém a amplitude do termo sem limitá-lo explicitamente ao edifício do templo.
- source_word: כְּאֶרֶץ
  choice: como a terra
  rationale: No paralelismo poético, a terra aparece como realidade firme e duradoura; “terra” expressa melhor essa dimensão cósmica do que “país” ou “território”.
- source_word: יְסָדָהּ
  choice: que estabeleceu
  rationale: O verbo יסד significa fundar ou estabelecer, e o sufixo feminino retoma “terra”. “Estabeleceu” comunica de modo natural sua firmeza e permanência.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão indica duração permanente; “para sempre” preserva sua força poética em português corrente.
theological_decisions:
- issue: Referente e imagem na comparação do santuário
  choice: O santuário de Deus é comparado às alturas e à terra firmemente estabelecida e duradoura.
  alternative: A comparação pode referir-se especificamente aos altos céus ou aos cumes elevados.
  rationale: A expressão hebraica é poética e condensada. “As alturas” preserva sua ambiguidade entre imagens celestes e montanhosas, sem impor uma interpretação cosmológica mais específica do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação poética. A repetição de “como” reproduz o paralelismo hebraico, e “as alturas” mantém deliberadamente a imagem aberta.
