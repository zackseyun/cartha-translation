  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: pt
  text: Ele se lembrou de que eles eram carne, um vento[a] que passa e não volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sopro que passa e não volta”. A palavra hebraica רוּחַ pode significar “vento”, “sopro” ou “espírito”; aqui, a imagem provavelmente destaca a transitoriedade e a fragilidade humanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Ele se lembrou
  rationale: O qal wayyiqtol de זכר indica ação narrativa passada; o pronome explicita com naturalidade o sujeito divino implícito no contexto.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo da lembrança. Em português, a regência natural de “lembrar-se” pede “de que”.
- source_word: בָשָׂר
  choice: carne
  rationale: Mantém a imagem concreta hebraica, que aqui ressalta a fragilidade e a mortalidade humanas sem acrescentar qualificações interpretativas.
- source_word: הֵמָּה
  choice: eles eram
  rationale: O pronome independente é expresso com a cópula exigida pela sintaxe portuguesa.
- source_word: רוּחַ
  choice: um sopro
  rationale: No paralelismo poético, comunica algo fugaz e frágil. “Vento” também é possível; “espírito” poderia sugerir uma afirmação antropológica mais técnica do que o contexto exige.
- source_word: הוֹלֵךְ
  choice: que passa
  rationale: Reproduz de maneira idiomática o particípio de movimento e torna perceptível a ideia de transitoriedade.
- source_word: וְלֹא יָשׁוּב
  choice: e não volta
  rationale: Preserva o sentido geral do imperfeito hebraico e acompanha naturalmente a imagem de algo que passa.
theological_decisions:
- issue: Imagem antropológica da fragilidade humana
  choice: O versículo descreve os seres humanos como frágeis e transitórios — “carne” e “um sopro que passa e não volta”.
  alternative: Entender רוּחַ como “espírito” e interpretar a frase como uma declaração específica sobre a partida do espírito humano.
  rationale: O paralelismo imediato enfatiza mortalidade e transitoriedade. “Sopro”, com nota sobre a amplitude lexical, preserva a imagem sem impor uma doutrina técnica da constituição humana.
translation_notes:
  register: Português moderno, digno e fluente, de ampla compreensão internacional e leitura natural no Brasil. A formulação conserva o paralelismo conciso e a imagem poética do hebraico.
