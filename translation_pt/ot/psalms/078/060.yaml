  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: pt
  text: Ele abandonou o tabernáculo de Siló, a tenda que estabeleceu entre os seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tenda onde habitava entre os seres humanos”.'
    reason: A forma verbal hebraica pode referir-se ao estabelecimento da tenda ou, no contexto, à habitação de Deus nela entre os seres humanos.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: abandonou
  rationale: Expressa com naturalidade a ideia forte de deixar para trás ou desamparar, sem acrescentar uma razão não declarada no hebraico.
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: Preserva o sentido histórico e cultual da morada sagrada de Deus e mantém a distinção poética em relação a אֹהֶל, traduzido por “tenda”.
- source_word: שִׁלֹה
  choice: Siló
  rationale: Forma tradicional e reconhecível em português para o nome do lugar.
- source_word: אֹהֶל
  choice: tenda
  rationale: Reproduz o paralelismo com “tabernáculo” sem uniformizar os dois substantivos hebraicos.
- source_word: שִׁכֵּן
  choice: havia estabelecido
  rationale: A forma intensiva/causativa pode descrever Deus instalando ou estabelecendo a tenda. Esta opção é natural em português e conserva na nota a leitura contextual referente à habitação do próprio Deus.
- source_word: בָּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם tem aqui sentido coletivo e genérico. A expressão é clara, inclusiva e atual, sem sugerir apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Referência da linguagem de habitação
  choice: A tenda foi estabelecida por Deus entre os seres humanos.
  alternative: A tenda era o lugar onde Deus habitava entre os seres humanos.
  rationale: O Piel שִׁכֵּן admite uma formulação causativa ligada à instalação da tenda, enquanto o contexto permite entender a frase como referência à presença habitante de Deus. A tradução principal segue de perto a forma causativa e a nota preserva a leitura teologicamente significativa sem torná-la exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “tabernáculo” para conservar a referência cultual e “seres humanos” para representar o coletivo אָדָם de modo natural.
