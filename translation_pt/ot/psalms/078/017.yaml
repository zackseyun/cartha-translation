base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: pt
  text: Ainda assim, continuaram pecando contra ele, rebelando-se contra o Altíssimo na região árida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no deserto” ou “na terra ressequida”. O hebraico se refere especificamente a um lugar seco e árido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Ainda assim, continuaram
  rationale: A construção com יסף no hifil seguido de infinitivo expressa continuação ou repetição; עוֹד reforça essa progressão. “Ainda assim” também comunica naturalmente o contraste com os atos de Deus narrados no contexto.
- source_word: לַחֲטֹא לוֹ
  choice: pecando contra ele
  rationale: חטא com ל pode indicar pecado cometido contra alguém. O pronome retoma Deus no contexto, e “contra ele” é a formulação idiomática em português.
- source_word: לַמְרוֹת
  choice: rebelando-se contra
  rationale: 'O infinitivo de מרה especifica a maneira pela qual continuaram pecando: agindo em rebelião. A forma pronominal é natural em português e preserva a ideia de desafio deliberado.'
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e plenamente compreensível em português, preservando sua força teológica sem paráfrase.
- source_word: בַּצִּיָּה
  choice: na região árida
  rationale: O substantivo designa um lugar seco ou ressequido. “Região árida” reflete a especificidade lexical e soa mais natural em português do que uma tradução excessivamente literal.
theological_decisions:
- issue: Tradução do título divino עֶלְיוֹן
  choice: o Altíssimo
  alternative: o Mais Alto
  rationale: “O Altíssimo” é a forma corrente, digna e clara em português para esse epíteto divino, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A formulação conserva o paralelismo entre continuar pecando e rebelar-se, bem como o título divino e a imagem geográfica do hebraico.
