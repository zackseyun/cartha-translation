  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: pt
  text: O ser humano comeu o pão dos poderosos[a]; ele lhes enviou provisões até ficarem satisfeitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pão dos anjos”. Mais literalmente, o hebraico diz “pão dos poderosos” ou “dos seres poderosos”.
    reason: Registra a interpretação tradicional sem eliminar a ambiguidade lexical do hebraico.
lexical_decisions:
- source_word: לֶחֶם
  choice: pão
  rationale: Preserva a imagem concreta e o sentido básico do hebraico, em vez do termo mais geral “alimento”.
- source_word: אַבִּירִים
  choice: dos poderosos
  rationale: Expressa o sentido lexical mais direto, “poderosos” ou “seres poderosos”, sem transformar no texto principal a interpretação tradicional em “anjos”.
- source_word: אָכַל
  choice: comeu
  rationale: O qatal é adequadamente expresso pelo pretérito perfeito no contexto narrativo-poético.
- source_word: אִישׁ
  choice: o ser humano
  rationale: O singular tem valor representativo e genérico; esta formulação natural em português comunica a humanidade sem sugerir necessariamente um indivíduo específico do sexo masculino.
- source_word: צֵידָה
  choice: provisões
  rationale: Designa mantimentos fornecidos para suprir uma necessidade e mantém distinção lexical em relação a “pão”.
- source_word: שָׁלַח
  choice: enviou
  rationale: Corresponde diretamente ao verbo hebraico e evita a interpretação mais ampla “deu”.
- source_word: לָהֶם
  choice: lhes
  rationale: Representa de modo idiomático o objeto indireto plural em português.
- source_word: לָשֹׂבַע
  choice: até ficarem satisfeitos
  rationale: Comunica a ideia de saciedade ou plena satisfação de maneira clara e natural, sem perder o sentido de suficiência abundante.
theological_decisions:
- issue: Interpretação de אַבִּירִים na expressão “pão dos poderosos”
  choice: Traduzir no texto principal como “dos poderosos”
  alternative: “dos anjos” ou “dos seres poderosos”
  rationale: Embora a tradição relacione a expressão ao maná e a interprete como “pão dos anjos”, o termo hebraico não significa inequivocamente “anjos”. A tradução principal preserva o sentido lexical e a nota registra a interpretação tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “O ser humano” representa o singular genérico אִישׁ; “até ficarem satisfeitos” torna natural a expressão de saciedade. O marcador [a] aparece junto à expressão correspondente no texto.
