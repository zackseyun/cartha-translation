  verdict: revise
  source_fidelity: A construção temporal «quando» reflete adequadamente o valor contextual de אֲשֶׁר. «Sinais» e «maravilhas» preservam a distinção entre אֹתוֹתָיו e מוֹפְתָיו, e os locativos «no Egito» e «nos campos de Zoã» são fiéis. Contudo, «realizou» interpreta o verbo שָׂם além de seu sentido básico de «pôr/colocar/estabelecer»; uma formulação com «pôs» conserva melhor a imagem verbal e o paralelismo do hebraico.
  naturalness: «Quando pôs os seus sinais no Egito e as suas maravilhas nos campos de Zoã» é claro, fluente e digno em português moderno. A repetição de «os seus/as suas» ajuda a leitura do paralelismo poético sem tornar a frase pesada.
  terminology: «Sinais» e «maravilhas» são escolhas adequadas e lexicalmente distintas. «Zoã» é uma transliteração portuguesa estabelecida do topônimo hebraico; a nota identifica apropriadamente Tânis sem substituir o nome no texto.
