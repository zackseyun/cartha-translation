lexical_decisions:
- source_word: אֲשֶׁר
  choice: quando
  rationale: No contexto dos vv. 42–43, a partícula relativa introduz temporalmente os atos de Deus dos quais Israel não se lembrou; “quando” é natural em português sem perder a ligação sintática.
- source_word: שָׂם
  choice: realizou
  rationale: Embora o sentido básico seja “pôs/estabeleceu”, com “sinais” o português idiomático favorece “realizou”. A escolha comunica a manifestação efetiva dos sinais sem acrescentar uma ideia adversativa.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: A preposição בְּ indica aqui localização. “Contra o Egito” introduziria uma força adversativa não expressa diretamente.
- source_word: אֹתוֹתָיו
  choice: seus sinais
  rationale: “Sinais” preserva o valor de אוֹת e sua distinção lexical em relação a מוֹפֵת, evitando fundir ambos em “milagres”.
- source_word: וּמוֹפְתָיו
  choice: e suas maravilhas
  rationale: “Maravilhas” expressa מוֹפֵת de modo claro e digno, mantendo o par tradicional e semanticamente distinto “sinais e maravilhas”.
- source_word: בִּשְׂדֵה
  choice: nos campos de
  rationale: Apesar do singular morfológico, a expressão designa a região ou planície ao redor da cidade; “nos campos de” é uma formulação natural em português.
- source_word: צֹעַן
  choice: Zoã
  rationale: Translitera o topônimo hebraico em forma corrente e legível em português; a identificação histórica com Tânis fica para a nota.
