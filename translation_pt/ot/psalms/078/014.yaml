base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: pt
  text: Ele os conduziu com uma nuvem durante o dia[a] e, durante toda a noite, com a luz do fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele os guiou por meio de uma nuvem de dia e, a noite inteira, pela luz do fogo.”'
    reason: Alternativas lexicais e preposicionais legítimas para וַיַּנְחֵם, בֶּעָנָן, יוֹמָם e בְּאוֹר אֵשׁ.
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ele os conduziu
  rationale: O hifil de נחה com sufixo de terceira pessoa masculina plural significa conduzir ou guiar. “Conduziu” expressa de modo natural e direto a orientação divina no deserto.
- source_word: בֶּעָנָן
  choice: com uma nuvem
  rationale: 'A preposição ב é instrumental ou associativa neste contexto: Deus os conduziu por meio da nuvem. “Com uma nuvem” preserva a imagem hebraica sem explicá-la em excesso.'
- source_word: יוֹמָם
  choice: durante o dia
  rationale: O termo funciona adverbialmente, com o sentido de “de dia”. “Durante o dia” é claro em português moderno e forma um paralelo natural com a referência à noite.
- source_word: וְכָל הַלַּיְלָה
  choice: e, durante toda a noite
  rationale: Mantém explicitamente a totalidade expressa por כָל e reproduz com naturalidade a ideia de que a condução se estendeu pela noite inteira.
- source_word: בְּאוֹר אֵשׁ
  choice: com a luz do fogo
  rationale: Preserva os dois substantivos da construção hebraica e apresenta o fogo como fonte de iluminação, sem acrescentar a palavra “coluna”, ausente neste versículo.
theological_decisions:
- issue: Natureza da imagem da condução no deserto
  choice: Apresentar o versículo como relato da condução histórica de Israel por meio da nuvem e da luz do fogo, sem interpretação adicional.
  alternative: Explicitar no texto principal uma leitura tipológica da nuvem e do fogo.
  rationale: O hebraico recorda o motivo do êxodo, mas não desenvolve aqui seu possível significado tipológico. A tradução não deve introduzir uma interpretação teológica que o versículo não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo temporal entre dia e noite, conserva a imagem concreta da nuvem e do fogo e evita acrescentar “coluna”, termo conhecido do contexto do êxodo, mas ausente do hebraico deste versículo.
