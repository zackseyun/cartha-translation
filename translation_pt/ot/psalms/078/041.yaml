  text: וַ/יָּשׁ֣וּבוּ וַ/יְנַסּ֣וּ אֵ֑ל וּ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל הִתְווּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: pt
  text: De novo, voltaram atrás e puseram Deus à prova; provocaram o Santo de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é raro e de sentido incerto. Também pode ser traduzido por “limitaram” ou “puseram uma marca em”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: De novo, voltaram atrás
  rationale: O verbo שׁוּב, no contexto, descreve a repetição da infidelidade anterior. A formulação preserva tanto a ideia de retrocesso quanto a força reiterativa.
- source_word: וַיְנַסּוּ
  choice: puseram Deus à prova
  rationale: נסה significa testar ou pôr à prova. Esta expressão é natural em português e comunica que o povo desafiou Deus por sua incredulidade.
- source_word: אֵל
  choice: Deus
  rationale: אֵל funciona aqui como designação do Deus de Israel; “Deus” é a tradução clara e não acrescenta uma nuance que o contexto não exige.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva o título bíblico tradicional, com sua ênfase na santidade de Deus e em sua relação com Israel.
- source_word: הִתְווּ
  choice: provocaram
  rationale: O verbo hebraico é raro e de sentido incerto. “Provocaram” se harmoniza com o paralelismo de “puseram Deus à prova” e expressa a afronta do povo sem afirmar que eles restringiram metafisicamente a Deus.
theological_decisions:
- issue: Sentido do verbo raro הִתְווּ
  choice: provocaram
  alternative: limitaram; puseram uma marca em
  rationale: O contexto favorece uma ação de afronta ou provocação contra Deus, mas a evidência lexical não permite certeza. A tradução principal oferece um sentido contextual plausível, enquanto a nota preserva as alternativas relevantes sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Voltaram atrás” explicita a recaída na infidelidade, e o ponto e vírgula conserva o paralelismo poético entre as duas acusações.
