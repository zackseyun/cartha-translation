  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: pt
  text: Entregou a produção deles ao gafanhoto devorador[a] e o trabalho deles[b] ao gafanhoto em enxame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao inseto devorador” ou “à lagarta”. O termo hebraico חָסִיל parece designar de modo mais amplo um inseto que devora plantações e, nos relatos de pragas, é frequentemente entendido como uma espécie de gafanhoto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o fruto do trabalho deles”. O termo hebraico pode referir-se tanto ao próprio esforço quanto àquilo que ele produz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Entregou
  rationale: O verbo נָתַן significa literalmente “dar”; neste contexto de juízo, “entregou” expressa com naturalidade que Deus deixou a produção nas mãos dos agentes destruidores, sem alterar a estrutura básica do hebraico.
- source_word: לֶחָסִיל
  choice: ao gafanhoto devorador
  rationale: חָסִיל designa um inseto que consome plantações, frequentemente entendido nos textos de pragas como algum tipo ou estágio de gafanhoto. “Gafanhoto devorador” comunica tanto o provável referente quanto sua ação destrutiva.
- source_word: יְבוּלָם
  choice: a produção deles
  rationale: יְבוּל é o produto ou rendimento da terra. “Produção” é abrangente, atual e mantém o sentido agrícola.
- source_word: וִיגִיעָם
  choice: o trabalho deles
  rationale: יְגִיעַ pode indicar o esforço ou, por metonímia, aquilo que esse esforço produz. A formulação compacta preserva essa tensão lexical, esclarecida em nota.
- source_word: לָאַרְבֶּה
  choice: ao gafanhoto em enxame
  rationale: אַרְבֶּה é o termo comum para gafanhoto. “Em enxame” distingue este membro do paralelismo sem alegar uma identificação zoológica precisa e evoca a devastação coletiva característica desses insetos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A repetição de “deles” evita possível ambiguidade referencial de “sua/seu” e continua natural em português de ampla compreensão, inclusive no Brasil.
