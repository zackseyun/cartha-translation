  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: pt
  text: Ele transformou em sangue os rios deles[a], e eles não puderam beber de suas águas correntes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus canais do Nilo”; em contextos egípcios, o termo hebraico muitas vezes se refere ao Nilo ou a seus canais.
    reason: lexical_alternative
  - marker: b
    text: Ou “de seus cursos de água”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Ele transformou
  rationale: O verbo הפך descreve a mudança de algo para outro estado. “Transformou” expressa com naturalidade o resultado indicado por לְדָם, sem acrescentar explicações ao texto.
- source_word: לְדָם
  choice: em sangue
  rationale: A preposição לְ marca aqui o estado resultante; em português, “transformou em sangue” é a construção idiomática correspondente.
- source_word: יְאֹרֵיהֶם
  choice: os rios deles
  rationale: יְאֹר pode designar o Nilo e seus canais no contexto egípcio. “Rios” mantém a imagem ampla do texto poético, enquanto “deles” evita a possível ambiguidade de “seus” quanto ao possuidor.
- source_word: וְנֹזְלֵיהֶם
  choice: de suas águas correntes
  rationale: O substantivo derivado de נזל designa aquilo que flui. “Águas correntes” preserva essa imagem e funciona naturalmente como a fonte da qual não puderam beber.
- source_word: בַּל יִשְׁתָּיוּן
  choice: eles não puderam beber
  rationale: 'A partícula poética negativa בַּל com o imperfeito comunica, neste contexto, o resultado prático da transformação das águas: elas ficaram impróprias para beber.'
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ordem sintática natural. A segunda oração entende “suas águas correntes” como objeto antecipado no hebraico e explicita em português a relação com o verbo “beber”, sem alterar o sentido.
