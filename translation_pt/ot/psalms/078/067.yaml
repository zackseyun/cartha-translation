  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: pt
  text: Então rejeitou a tenda de José[a] e não escolheu a tribo de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efraim era a tribo predominante entre as tribos de José; o contexto seguinte contrasta essa rejeição com a escolha de Judá e de Sião.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Então rejeitou
  rationale: מָאַס pode significar rejeitar, desprezar ou repudiar. “Rejeitou” expressa com clareza a decisão divina sem intensificar desnecessariamente a ideia de desprezo; “então” representa de modo natural o avanço narrativo do wayyiqtol.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: a tenda de José
  rationale: אֹהֶל significa literalmente “tenda”. A expressão funciona aqui de modo metonímico para a morada ou esfera tribal ligada a José, mas manter “tenda” preserva a imagem poética e evita explicitação excessiva.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: a tribo de Efraim
  rationale: שֵׁבֶט pode designar tribo, bastão ou cetro. Com o nome de Efraim e em paralelo com “tenda de José”, “tribo” é o sentido contextual mais natural.
- source_word: לֹא בָחָר
  choice: não escolheu
  rationale: בָּחַר significa escolher ou selecionar. “Não escolheu” é direto, natural e conserva a linguagem bíblica de escolha sem introduzir terminologia teológica mais técnica.
theological_decisions:
- issue: Sentido histórico-teológico da rejeição e da escolha entre os centros tribais de Israel
  choice: Conservar a linguagem concreta sobre José e Efraim, entendendo-a no contexto da transferência da proeminência do santuário para Judá e Sião.
  alternative: Interpretar explicitamente José e Efraim como símbolos de todo o reino do norte.
  rationale: O salmo narra a história de Israel, e os versículos seguintes apresentam a escolha de Judá e do monte Sião. A tradução deve preservar os referentes tribais concretos do hebraico, deixando que o contexto comunique seu alcance histórico mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem verbal foi mantida compacta para preservar o paralelismo poético. Não se acrescentou pronome sujeito, pois o referente divino é claro no contexto.
