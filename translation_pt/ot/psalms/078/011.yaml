  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: pt
  text: Esqueceram-se dos seus feitos[a] e das maravilhas[b] que ele lhes havia mostrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “feitos maravilhosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Esqueceram-se
  rationale: O qal wayyiqtol na 3ª pessoa do plural narra uma ação passada em sequência. “Esqueceram-se” expressa diretamente שׁכח sem introduzir a ideia interpretativa de negligência.
- source_word: עֲלִילוֹתָיו
  choice: dos seus feitos
  rationale: עֲלִילוֹת designa ações ou feitos. “Feitos” é natural, digno e amplo o bastante para abranger as ações históricas de Deus.
- source_word: וְנִפְלְאוֹתָיו
  choice: e das maravilhas
  rationale: O termo, derivado de פלא, refere-se a ações extraordinárias que causam assombro. “Maravilhas” preserva essa amplitude e não o restringe a milagres em sentido técnico.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo introduz a oração que caracteriza as maravilhas; “que” é a ligação natural em português.
- source_word: הֶרְאָם
  choice: ele lhes havia mostrado
  rationale: O hifil perfeito de ראה com sufixo de 3ª pessoa do plural significa literalmente “fez que eles vissem” e, idiomaticamente, “mostrou-lhes”. O mais-que-perfeito deixa claro que a exibição das maravilhas precedeu o esquecimento.
theological_decisions:
- issue: Referente dos sufixos pronominais
  choice: 'Os sufixos referem-se a Deus: “seus feitos” e “maravilhas”.'
  alternative: Repetir explicitamente “de Deus” em ambas as expressões.
  rationale: O contexto identifica Deus como autor dessas ações. Manter os possessivos conserva a forma concisa do hebraico e o contraste teológico entre os atos divinos e o esquecimento de Israel, sem explicitação desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção reflexiva “esqueceram-se de” é idiomática e preserva a relação sintática entre o verbo e os dois objetos coordenados. Os marcadores seguem imediatamente os termos a que se referem.
