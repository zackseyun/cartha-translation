  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: pt
  text: Ele os conduziu em segurança, e eles não tiveram medo; e o mar[a] cobriu os seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «o mar». O versículo alude à travessia de Israel no êxodo. Possíveis explicitações incluem «o mar Vermelho» ou «o mar de Juncos», mas aqui o texto hebraico não é mais específico.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ele os conduziu
  rationale: O hifil de נחה com sufixo de terceira pessoa do plural expressa que Deus conduziu o povo. «Conduziu» preserva a imagem concreta do deslocamento e soa natural em português.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: בֶּטַח indica segurança; com לָ, a expressão funciona aqui de modo adverbial, descrevendo como Deus os conduziu.
- source_word: וְלֹא פָחָדוּ
  choice: e eles não tiveram medo
  rationale: Mantém a coordenação simples do hebraico e traduz פחד em linguagem corrente, sem explicitar uma relação de resultado que o texto não marca gramaticalmente.
- source_word: אֹיְבֵיהֶם
  choice: os seus inimigos
  rationale: Equivalente direto de אֹיֵב com o sufixo plural «deles»; no contexto, a referência aos inimigos do povo é clara.
- source_word: כִּסָּה
  choice: cobriu
  rationale: Preserva o sentido concreto de כסה e a imagem do mar cobrindo os inimigos, sem ampliar para «destruiu» ou «tragou».
- source_word: הַיָּם
  choice: o mar
  rationale: O substantivo hebraico é definido, mas não traz aqui um nome próprio. «O mar» conserva essa generalidade textual.
theological_decisions:
- issue: Alusão histórica à travessia do mar no êxodo
  choice: Manter «o mar» no texto principal.
  alternative: «o mar Vermelho» ou «o mar de Juncos»
  rationale: Embora a alusão ao êxodo seja clara, o versículo diz apenas הַיָּם, «o mar». A tradução não acrescenta uma identificação mais específica do que a forma hebraica fornece.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A repetição de «e» preserva a coordenação narrativa do hebraico; o marcador da nota foi colocado junto de «mar», expressão a que a nota se refere.
