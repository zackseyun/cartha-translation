  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: pt
  text: porque não creram em Deus, nem confiaram em sua salvação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: creram em Deus
  rationale: O verbo אמן no hifil com בְּ expressa depositar fé ou confiança em alguém; “creram em Deus” preserva a construção e distingue esta oração do paralelo “confiaram”.
- source_word: בָטְחוּ בִּישׁוּעָתוֹ
  choice: confiaram em sua salvação
  rationale: בטח com בְּ indica confiança; יְשׁוּעָה é aqui a salvação ou livramento que procede de Deus. A formulação mantém a amplitude do substantivo e o paralelismo poético.
theological_decisions:
- issue: Objeto da fé na primeira oração
  choice: creram em Deus
  alternative: creram em Deus no sentido de acreditar no que ele disse
  rationale: A preposição בְּ favorece “crer em/confiar em Deus”. A tradução não reduz a afirmação à aceitação de uma mensagem específica nem acrescenta uma explicação ausente do texto.
- issue: Sentido de “sua salvação”
  choice: sua salvação
  alternative: seu livramento
  rationale: “Salvação” conserva o campo semântico amplo de יְשׁוּעָה e a referência pronominal a Deus, sem decidir além do contexto se se trata apenas de socorro temporal ou de uma realidade teológica mais abrangente.
translation_notes:
  register: Português moderno, claro e digno. O uso de “nem” liga naturalmente as duas negativas paralelas; “sua salvação” evita uma formulação excessivamente explicativa e preserva a concisão poética.
