  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: pt
  text: Expulsou de diante deles as nações e lhes repartiu uma herança com a corda de medir[a]; fez as tribos de Israel habitarem nas tendas deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “distribuiu-lhes uma herança com a corda de medir”. O hebraico reúne as ideias de atribuição da herança e divisão medida da terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “nas tendas deles”. O pronome provavelmente retoma as nações expulsas; “tendas” também pode ter o sentido mais amplo de moradias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Expulsou
  rationale: Expressa com clareza a ação enérgica de fazer sair ou remover, sem especificar um meio que o hebraico não explicita.
- source_word: מִפְּנֵיהֶם
  choice: de diante deles
  rationale: Preserva de modo natural a construção hebraica e indica que as nações foram removidas perante Israel.
- source_word: גּוֹיִם
  choice: as nações
  rationale: É o equivalente usual para os povos não israelitas que habitavam a terra.
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: lhes repartiu por herança a terra medida com a corda
  rationale: Traduz idiomaticamente a atribuição da terra, preservando tanto a noção de herança quanto a imagem concreta da corda usada para medir e dividir.
- source_word: וַיַּשְׁכֵּן
  choice: fez ... habitarem
  rationale: Mantém explicitamente o valor causativo do hifil de שכן.
- source_word: בְּאָהֳלֵיהֶם
  choice: nas tendas daqueles povos
  rationale: 'Preserva a imagem literal de ''tendas'' e explicita o referente contextual do pronome: as nações anteriormente mencionadas.'
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: as tribos de Israel
  rationale: Tradução direta, clara e consagrada da expressão hebraica.
theological_decisions:
- issue: Agência na conquista e no assentamento
  choice: 'Deus permanece como sujeito das três ações: expulsar, repartir e fazer habitar.'
  alternative: Tornar Israel sujeito implícito da ocupação da terra.
  rationale: O contexto do salmo relata os atos de Deus em favor de Israel; a sintaxe hebraica mantém o mesmo sujeito singular ao longo do versículo.
- issue: Referente de 'suas tendas'
  choice: Explicitar 'daqueles povos'.
  alternative: Manter apenas 'suas tendas', com referente pronominal potencialmente ambíguo em português.
  rationale: No hebraico, o sufixo plural retoma naturalmente as nações expulsas, enquanto as tribos de Israel são o objeto do verbo causativo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva a imagem hebraica da corda de medir e torna clara a relação entre os povos expulsos e suas tendas.
