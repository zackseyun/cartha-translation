base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: pt
  text: Eles o provocaram à ira com seus lugares altos[a] e, com suas imagens esculpidas[b], despertaram seu ciúme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lugares altos” eram locais de culto, muitas vezes associados ao culto ilegítimo e à idolatria.
    reason: cultural_note
  - marker: b
    text: Ou “ídolos” ou “imagens talhadas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o provocaram ao ciúme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Eles o provocaram à ira
  rationale: O hifil de כעס expressa causar ira ou provocar à ira; a formulação preserva claramente a força causativa e soa natural em português.
- source_word: בְּבָמוֹתָם
  choice: com seus altares nos lugares altos
  rationale: במות designa locais elevados de culto. A explicitação de 'altares' evita que o português sugira apenas elevações geográficas, enquanto a nota preserva o referente cultural mais amplo.
- source_word: וּבִפְסִילֵיהֶם
  choice: e, com suas imagens esculpidas
  rationale: פסילים são imagens cultuais talhadas ou esculpidas; a escolha mantém o caráter concreto de objetos fabricados, sem reduzi-los ao termo mais interpretativo 'ídolos'.
- source_word: יַקְנִיאוּהוּ
  choice: despertaram seu ciúme
  rationale: O hifil de קנא significa provocar ciúme ou zelo. 'Despertaram seu ciúme' preserva a linguagem relacional da aliança e é idiomático em português.
theological_decisions:
- issue: Linguagem do ciúme divino
  choice: despertaram seu ciúme
  alternative: provocaram-no ao ciúme; despertaram seu zelo
  rationale: O hebraico emprega explicitamente קנא em contexto de culto idolátrico. Manter 'ciúme' conserva a tensão teológica e a ideia de exclusividade da relação de aliança, sem suavizá-la para mera ira nem interpretá-la apenas como zelo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem paralela do hebraico foi mantida, e a expressão cultural 'lugares altos' recebeu breve explicitação no texto e nota explicativa.
