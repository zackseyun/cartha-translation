  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: pt
  text: Assim, comeram e ficaram muito saciados, e ele lhes trouxe o que desejavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o desejo deles” ou “a sua ânsia”. O substantivo hebraico pode indicar tanto o desejo em si quanto aquilo que se deseja.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: comeram
  rationale: O qal de אכל é o verbo comum para comer; esta é a equivalência portuguesa mais direta e natural.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: ficaram muito saciados
  rationale: שׂבע expressa ficar saciado, satisfeito ou cheio depois de comer; מְאֹד intensifica o estado. “Muito saciados” conserva a imagem concreta da refeição abundante em registro digno e claro.
- source_word: תַאֲוָתָם
  choice: o que desejavam
  rationale: תַּאֲוָה pode indicar o desejo ou a coisa desejada. No contexto do alimento dado no deserto, a formulação concreta é natural, sem apagar a alternativa lexical, registrada em nota.
- source_word: יָבִא לָהֶם
  choice: ele lhes trouxe
  rationale: O hifil de בוא tem sentido causativo, “fazer vir” ou “trazer”. Com לָהֶם, “lhes trouxe” comunica de modo conciso que Deus fez chegar até eles o que desejavam.
theological_decisions:
- issue: Sujeito implícito de יָבִא
  choice: “ele”, tendo Deus como sujeito implícito no contexto
  alternative: 'Leitura impessoal ou intransitiva: “o desejo deles veio até eles”'
  rationale: O fluxo narrativo apresenta Deus como aquele que fornece o alimento, e a forma hifil favorece o sentido causativo “trouxe” ou “fez chegar”. O pronome preserva o sujeito implícito do hebraico sem acrescentar o nome “Deus” ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Saciados” preserva a imagem corporal do hebraico sem recorrer ao coloquial “de barriga cheia”; “o que desejavam” expressa naturalmente o objeto da ânsia, enquanto a nota mantém a ambiguidade do substantivo.
