  text: Ainda não tinham se afastado de seu desejo intenso[a]; a comida ainda estava em suas bocas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda não tinham se separado de seu desejo”. O verbo hebraico também pode ser traduzido mais literalmente como “se afastado” ou “se tornado alheios a”.'
