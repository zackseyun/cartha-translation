lexical_decisions:
- source_word: זָרוּ
  choice: tinham se afastado
  rationale: O verbo זור, seguido de מִן, comunica aqui afastamento ou abandono. A formulação é natural em português e mantém a ideia verbal sem afirmar mais do que o hebraico.
- source_word: מִתַּאֲוָתָם
  choice: do seu desejo intenso
  rationale: תַּאֲוָה indica desejo forte ou avidez. No contexto da exigência por alimento, “desejo intenso” transmite a força do termo sem a conotação predominantemente sexual que “luxúria” costuma ter.
- source_word: עוֹד
  choice: ainda
  rationale: 'Marca a continuidade da situação naquele momento: o alimento permanecia na boca deles.'
- source_word: אָכְלָם
  choice: a comida
  rationale: אֹכֶל significa alimento ou comida; “comida” é claro, corrente e adequado ao contexto.
- source_word: בְּפִיהֶם
  choice: na boca deles
  rationale: O hebraico traz o substantivo singular com sufixo plural, uma construção distributiva que o português expressa naturalmente por “na boca deles”.
