translation_notes:
  register: Português moderno, digno e de leitura ampla. “Entregou” conserva a ação divina direta; “gado” e “rebanhos” reproduzem o paralelismo parcialmente sobreposto do hebraico. A nota preserva a amplitude semântica de רְשָׁפִים.
