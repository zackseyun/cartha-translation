  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: pt
  text: Entregou o gado deles ao granizo e os seus rebanhos aos raios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às chamas” ou “aos dardos de fogo”; o termo hebraico pode designar forças destrutivas ardentes ou fulgurantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Entregou
  rationale: O verbo סגר pode significar fechar, entregar ou abandonar ao poder de algo. No contexto da praga, “entregou” expressa naturalmente que Deus deixou os animais sujeitos às forças destrutivas.
- source_word: לַבָּרָד
  choice: ao granizo
  rationale: בָּרָד significa “granizo”, e a preposição ל indica aquilo a que o gado foi entregue.
- source_word: בְּעִירָם
  choice: o gado deles
  rationale: בְּעִיר designa animais domésticos, especialmente animais de trabalho ou gado; “gado” é claro e adequado ao contexto rural.
- source_word: וּמִקְנֵיהֶם
  choice: e os seus rebanhos
  rationale: מִקְנֶה refere-se ao conjunto de animais possuídos. “Rebanhos” mantém o paralelismo com “gado” sem tornar os dois termos artificialmente idênticos.
- source_word: לָרְשָׁפִים
  choice: aos raios abrasadores
  rationale: רְשָׁפִים pode indicar chamas, centelhas ou projéteis ardentes; neste contexto meteorológico, “raios abrasadores” preserva tanto a ideia de relâmpagos quanto a de fogo, sem eliminar a ambiguidade lexical.
