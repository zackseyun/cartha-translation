  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: pt
  text: para que uma geração futura soubesse, e os filhos que ainda nasceriam se levantassem e contassem a seus filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos [...] seus filhos”; aqui, as formas masculinas se referem genericamente aos descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido, de modo natural em português.
- source_word: יֵדְעוּ
  choice: soubesse
  rationale: O imperfeito após לְמַעַן expressa a finalidade; o subjuntivo português preserva essa relação.
- source_word: דּוֹר אַחֲרוֹן
  choice: uma geração futura
  rationale: Designa uma geração posterior, sem exigir o sentido escatológico de 'última geração'.
- source_word: בָּנִים יִוָּלֵדוּ
  choice: os filhos que ainda nasceriam
  rationale: Preserva a imagem familiar concreta e o valor futuro-passivo do hebraico.
- source_word: יָקֻמוּ
  choice: se levantasse
  rationale: Mantém a imagem vívida de surgir para agir e dar continuidade à transmissão entre gerações.
- source_word: וִיסַפְּרוּ
  choice: e contasse
  rationale: Expressa de forma corrente a transmissão oral às gerações seguintes.
- source_word: לִבְנֵיהֶם
  choice: a seus filhos
  rationale: Preserva o vínculo familiar e a sucessão geracional indicados pelo hebraico.
theological_decisions:
- issue: Linguagem masculina para descendentes (בָּנִים / לִבְנֵיהֶם)
  choice: Traduzir como 'filhos' e esclarecer em nota que o termo abrange os descendentes em geral.
  alternative: crianças / seus filhos; descendentes
  rationale: Em português, 'filhos' preserva mais diretamente a metáfora familiar do hebraico, enquanto a nota evita restringir indevidamente a referência apenas aos homens.
- issue: Relação sintática de 'os filhos que ainda nasceriam'
  choice: Tratar a expressão como aposição explicativa de 'uma geração futura'.
  alternative: Coordenar como um segundo sujeito independente
  rationale: A aposição comunica naturalmente que a geração futura consiste nos filhos ainda por nascer, preservando a progressão poética e a ambiguidade estrutural sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões marcam a aposição explicativa sem apagar a estrutura poética.
