  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: pt
  text: Ele o trouxe de trás das ovelhas que amamentavam[a], para pastorear Jacó, seu povo, e Israel, sua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das ovelhas com crias”.'
    reason: lexical_alternative
  - marker: b
    text: “Herança” também pode ser traduzido por “patrimônio” ou “possessão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: de detrás
  rationale: A combinação de מִן com אַחַר indica que Davi foi tirado de detrás do rebanho. A formulação conserva a imagem espacial e pastoril do hebraico.
- source_word: עָלוֹת
  choice: as ovelhas que amamentavam
  rationale: O particípio feminino plural designa ovelhas que amamentam suas crias. Esta expressão é clara em português moderno e preserva a especificidade da cena.
- source_word: הֱבִיאוֹ
  choice: Ele o trouxe
  rationale: O hifil de בוא significa normalmente “trazer”. Deus é o sujeito implícito pelo contexto anterior, e Davi é o objeto.
- source_word: לִרְעוֹת
  choice: para pastorear
  rationale: רעה pode significar apascentar, cuidar ou pastorear. “Pastorear” mantém a metáfora que liga o trabalho de Davi com o rebanho à sua função régia sobre o povo.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: Jacó, seu povo
  rationale: A tradução apresenta “seu povo” como aposto de “Jacó” e emprega o objeto direto natural em português, sem tentar reproduzir mecanicamente a preposição hebraica.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: e Israel, sua herança
  rationale: נַחֲלָה denota herança, patrimônio ou possessão. “Herança” é um equivalente direto que conserva a ressonância da relação pactual entre Deus e Israel.
theological_decisions:
- issue: Metáfora régia e pastoril do chamado de Davi
  choice: Conservar explicitamente “pastorear”
  alternative: “governar”, “conduzir” ou “cuidar de”
  rationale: O verso estabelece deliberadamente uma ligação entre o pastoreio literal de Davi e sua função sobre Israel. A imagem é preservada sem acrescentar conclusões doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo o paralelismo entre “Jacó, seu povo” e “Israel, sua herança” e preservando a imagem pastoril do original.
