  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: pt
  text: Ele, porém, por ser compassivo, fazia expiação pela iniquidade[a] e não os destruía; muitas vezes fazia sua ira recuar e não despertava todo o seu furor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: perdoava a iniquidade. O verbo hebraico é o termo usual para fazer expiação; por isso, o texto principal preserva esse sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: compassivo
  rationale: Expressa a misericórdia compassiva como uma qualidade de Deus, em linguagem atual e digna.
- source_word: יְכַפֵּר
  choice: fazia expiação
  rationale: Preserva o sentido característico do piel de כפר e seu peso teológico, sem especificar um mecanismo de expiação que o versículo não declara.
- source_word: עָוֺן
  choice: iniquidade
  rationale: Mantém o sentido moral de perversidade ou culpa e combina naturalmente com a expressão 'fazer expiação'.
- source_word: יַשְׁחִית
  choice: não os destruía
  rationale: O hifil indica destruição como juízo. O pronome 'os', implícito no hebraico e recuperável do contexto, torna a frase natural em português.
- source_word: וְהִרְבָּה
  choice: muitas vezes
  rationale: O verbo com infinitivo comunica ação repetida ou frequente, não simples intensidade.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: fazia sua ira recuar
  rationale: Conserva a imagem hebraica de fazer a ira voltar para trás, em vez de reduzi-la apenas à ideia interpretativa de contenção.
- source_word: יָעִיר
  choice: despertava
  rationale: Reflete diretamente o sentido causativo de עור, 'despertar, incitar', e permanece compreensível com 'furor' como objeto.
- source_word: כָּל חֲמָתוֹ
  choice: todo o seu furor
  rationale: '''Furor'' distingue חֵמָה de אַף, já traduzido por ''ira'', enquanto ''todo'' preserva a extensão indicada por כָּל.'
theological_decisions:
- issue: Tradução de כפר em um salmo histórico não cultual
  choice: fazia expiação pela iniquidade
  alternative: perdoava a iniquidade
  rationale: Embora 'perdoava' expresse o efeito contextual, כפר é o verbo hebraico usual para expiar. A tradução principal conserva essa textura teológica sem introduzir uma teoria específica sobre o modo da expiação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. O aspecto reiterativo do relato histórico foi expresso pelo pretérito imperfeito e por 'muitas vezes'. A ordem inicial com 'porém' preserva o contraste do hebraico sem rigidez excessiva.
