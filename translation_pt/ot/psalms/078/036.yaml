  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: pt
  text: Mas o lisonjeavam com a boca[a] e, com a língua, mentiam para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enganavam-no” ou “seduziam-no”. O verbo hebraico pode ter esses sentidos, mas aqui provavelmente se refere a palavras lisonjeiras e insinceras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: o lisonjeavam
  rationale: O piel de פתה pode significar seduzir, enganar ou persuadir. Em paralelo com a mentira da segunda linha, descreve aqui palavras insinceras e manipuladoras dirigidas a Deus; “lisonjeavam” expressa isso naturalmente sem afirmar que conseguiram enganá-lo.
- source_word: בְּפִיהֶם
  choice: com a boca
  rationale: A preposição בְּ indica o meio pelo qual agiam. O singular coletivo “boca” preserva a forma concreta e poética do hebraico.
- source_word: וּבִלְשׁוֹנָם
  choice: e, com a língua
  rationale: A tradução literal de לָשׁוֹן mantém o paralelismo poético com “boca” e sua referência metafórica à fala.
- source_word: יְכַזְּבוּ
  choice: mentiam
  rationale: O piel de כזב denota mentir ou falar falsamente. “Mentiam” é direto, corrente e preserva a força moral da acusação.
- source_word: לוֹ
  choice: para ele
  rationale: 'O לְ com sufixo marca naturalmente o destinatário da fala falsa: mentiam para Deus.'
theological_decisions:
- issue: Se o versículo afirma que seres humanos conseguiram enganar Deus ou que lhe dirigiram palavras enganosas.
  choice: A tradução apresenta uma fala lisonjeira e insincera dirigida a Deus, sem declarar que ele foi efetivamente enganado.
  alternative: “Mas o enganavam com a boca” ou “tentavam enganá-lo com a boca”.
  rationale: O contexto trata da resposta hipócrita e da infidelidade de Israel. “Lisonjeavam” representa a fala manipuladora e preserva a tensão lexical, enquanto a nota registra os sentidos alternativos do verbo hebraico sem resolver a questão por formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo concreto entre “boca” e “língua” foi preservado; a pontuação destaca as duas linhas poéticas sem tornar a frase artificial.
