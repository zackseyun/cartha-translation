base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/002.yaml
  text: I will open my mouth in a parable[d][c][b][a]; I will utter riddles from of old.
translation:
  language: pt
  text: Abrirei a boca para falar por meio de uma parábola[a][d]; proferirei enigmas[b] dos tempos antigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um provérbio” ou “por meio de um dito”. O termo hebraico pode designar provérbio, parábola ou dito figurado.
    reason: lexical_alternative
  - marker: b
    text: Ou “ditos enigmáticos” ou “adivinhas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “desde a antiguidade”.
    reason: lexical_alternative
  - marker: d
    text: Este versículo é citado em Mateus 13:35 em conexão com Jesus falar por parábolas.
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Abrirei
  rationale: O imperfeito/coortativo poético de פתח, na primeira pessoa do singular, expressa naturalmente intenção ou ação futura.
- source_word: בְמָשָׁל
  choice: com uma parábola
  rationale: מָשָׁל pode designar provérbio, parábola ou dito figurado. No paralelismo com חִידוֹת, “parábola” comunica bem uma forma figurada de instrução, enquanto a preposição בְּ é vertida naturalmente por “com” em português.
- source_word: פִּי
  choice: a boca
  rationale: Mantém a imagem concreta do hebraico; com o verbo na primeira pessoa, o possessivo fica claro e sua omissão evita uma formulação pesada em português.
- source_word: אַבִּיעָה
  choice: proferirei
  rationale: O Hifil de נבע sugere fazer jorrar e, figuradamente, enunciar. “Proferirei” preserva o caráter verbal e poético sem tornar literal demais a metáfora.
- source_word: חִידוֹת
  choice: enigmas
  rationale: חִידָה designa um enigma ou dito enigmático. “Enigmas” é atual e digno, além de evitar que “adivinhas” soe recreativo.
- source_word: מִנִּי קֶדֶם
  choice: dos tempos antigos
  rationale: A expressão indica procedência temporal remota. “Dos tempos antigos” é natural em português e não sugere necessariamente o princípio absoluto ou a criação.
theological_decisions:
- issue: Relação do versículo com Mateus 13:35 e sentido de מָשָׁל / חִידוֹת
  choice: Traduzir o hebraico em seus próprios termos como “parábola” e “enigmas”, registrando a citação neotestamentária em nota.
  alternative: “Falarei por parábolas; proclamarei coisas ocultas desde a antiguidade.”
  rationale: A tradução não harmoniza retroativamente o salmo com uma formulação da citação grega. Preserva-se a instrução figurada e enigmática do texto hebraico, e a relação intertextual é informada sem controlar a tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado, e as alternativas lexicais genuínas foram mantidas em notas.
