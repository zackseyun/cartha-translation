  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: pt
  text: 'Não guardaram a aliança de Deus

    e se recusaram a andar na sua lei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “instrução” ou “ensino”: o hebraico torá pode se referir à lei, ao ensino ou à instrução de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: guardaram
  rationale: O verbo שׁמר, associado a בְּרִית, denota observar ou cumprir fielmente uma aliança. “Guardar a aliança” é uma expressão bíblica natural em português e preserva a imagem hebraica.
- source_word: בְּרִית אֱלֹהִים
  choice: a aliança de Deus
  rationale: A construção hebraica indica a aliança pertencente a Deus ou estabelecida por ele. A formulação mantém o tom elevado e a relação expressa no original.
- source_word: וּבְתוֹרָתוֹ
  choice: e ... na sua lei
  rationale: תּוֹרָה pode designar lei, ensino ou instrução. Neste contexto de fidelidade à aliança, “lei” comunica com clareza sua força normativa; a preposição ב é preservada em “na”.
- source_word: מֵאֲנוּ
  choice: se recusaram
  rationale: מאן expressa recusa deliberada ou falta de disposição. “Se recusaram” é idiomático e mantém a força da acusação.
- source_word: לָלֶכֶת
  choice: a andar
  rationale: הלך significa literalmente “andar” e, neste contexto, descreve a conduta. Manter a metáfora preserva a linguagem e a textura teológica do salmo.
- source_word: לֹא
  choice: não
  rationale: Reproduz diretamente a negação simples do hebraico em sintaxe portuguesa natural.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto da aliança
  choice: lei
  alternative: instrução ou ensino
  rationale: A associação entre guardar a aliança e andar na תּוֹרָה enfatiza aqui sua autoridade normativa. Contudo, o termo hebraico possui sentido mais amplo que legislação, razão pela qual a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado em duas linhas. A expressão tradicional “andar na sua lei” mantém a metáfora hebraica sem perder inteligibilidade.
