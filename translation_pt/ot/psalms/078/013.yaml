  - severity: low
    issue: “Abriu o mar” é aceitável, mas “dividiu o mar” reflete mais diretamente o verbo בָּקַע.
    rationale: O verbo descreve fender ou dividir; “dividiu” evita a leve generalização de “abriu”.
  - severity: low
    issue: A nota atual exclui categoricamente “muralha”.
    rationale: Embora נֵד designe primariamente um monte ou massa acumulada, “muralha” pode surgir como interpretação contextual da imagem; a nota deve distingui-la do sentido lexical primário sem a negar de modo absoluto.
