base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: pt
  text: Ele dividiu o mar e os fez atravessar; fez as águas se erguerem como um monte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma massa acumulada”. O hebraico diz “como um monte”; “muralha” é uma interpretação da imagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: abriu
  rationale: O verbo descreve partir ou fender, abrindo uma passagem. “Abriu o mar” é natural em português e conserva a imagem concreta sem sugerir que o mar apenas foi separado em partes abstratas.
- source_word: יָם
  choice: o mar
  rationale: Embora sem artigo no hebraico poético, o contexto identifica o mar da travessia do êxodo; o texto não especifica aqui “mar Vermelho”.
- source_word: וַיַּעֲבִירֵם
  choice: os fez passar
  rationale: Preserva de modo claro e idiomático o valor causativo da forma hifil de עבר.
- source_word: וַיַּצֶּב
  choice: fez ... ficarem de pé
  rationale: Expressa a ação causativa de pôr ou manter em posição erguida, preservando a personificação visual das águas.
- source_word: מַיִם
  choice: as águas
  rationale: O plural português é natural no registro bíblico-poético e corresponde à representação das águas do mar.
- source_word: כְּמוֹ
  choice: como
  rationale: Equivalente comparativo direto e natural.
- source_word: נֵד
  choice: um montão
  rationale: Designa uma massa amontoada ou empilhada. “Montão” conserva melhor a imagem hebraica do que a interpretação “muralha”.
theological_decisions:
- issue: Natureza da imagem do milagre no mar
  choice: Manter a imagem concreta de as águas ficarem de pé como um montão, sem explicar o mecanismo.
  alternative: Parafrasear como “conteve as águas” ou interpretar a descrição como uma muralha.
  rationale: O versículo apresenta a ação de Deus por meio de uma imagem vívida do êxodo. A tradução conserva a força poética e teológica sem decidir debates sobre o mecanismo nem substituir a imagem por uma explicação.
translation_notes:
  register: Português moderno, claro e digno, com ritmo poético. “Abriu o mar” evita uma formulação rígida, enquanto “os fez passar” retém a causalidade explícita. “Ficarem de pé” conserva a imagem marcante do hebraico; a nota esclarece o sentido menos comum de “montão” aplicado às águas.
