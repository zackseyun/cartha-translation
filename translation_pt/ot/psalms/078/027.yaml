lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Fez chover
  rationale: O hifil de מטר expressa a ideia causativa de fazer chover ou fazer cair em abundância. “Fez chover” é natural em português e preserva a imagem do original.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל com o sufixo pronominal significa naturalmente “sobre eles” neste contexto.
- source_word: כֶּעָפָר
  choice: como pó
  rationale: O prefixo comparativo כְּ introduz uma comparação; “como pó” reproduz de modo claro e direto a imagem hebraica de quantidade incontável.
- source_word: שְׁאֵר
  choice: carne
  rationale: שְׁאֵר pode designar carne corporal ou carne como alimento. Neste contexto da provisão no deserto, “carne” comunica naturalmente o alimento de origem animal sem eliminar a amplitude lexical do termo.
- source_word: וּכְחוֹל יַמִּים
  choice: como a areia dos mares
  rationale: A tradução mantém o plural יַמִּים, “mares”, e preserva a comparação hebraica, embora em português também seja comum dizer “areia do mar”.
- source_word: עוֹף כָּנָף
  choice: aves aladas
  rationale: A expressão construta significa literalmente algo como “ave de asa”. “Aves aladas” preserva a imagem e soa digna e compreensível em português atual.
