  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: pt
  text: Fez chover sobre eles carne[a] como pó e aves aladas como a areia dos mares.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico שְׁאֵר pode referir-se à carne em sentido corporal ou à carne como alimento; aqui se refere à carne comestível providenciada no deserto.
