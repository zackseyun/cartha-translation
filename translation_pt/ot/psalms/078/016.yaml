  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: pt
  text: 'Fez sair correntes da rocha

    e fez as águas descerem como rios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
