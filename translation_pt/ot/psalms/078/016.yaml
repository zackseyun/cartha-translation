lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Fez sair
  rationale: O hifil de יצא expressa causação. “Fez sair” preserva diretamente esse sentido e soa natural em português.
- source_word: נוֹזְלִים
  choice: correntes
  rationale: O particípio de נזל designa aquilo que flui. “Correntes” comunica de modo claro a imagem de águas fluindo da rocha, sem precisar antecipar o substantivo “águas” do segundo hemistíquio.
- source_word: מִסָּלַע
  choice: da rocha
  rationale: סלע pode designar rocha ou penhasco. “Da rocha” é natural e condiz com a alusão poética ao milagre no deserto.
- source_word: וַיּוֹרֶד
  choice: fez ... descerem
  rationale: 'O hifil de ירד é causativo: Deus fez as águas descerem. A formulação conserva a causatividade e o movimento descendente do hebraico.'
- source_word: כַּנְּהָרוֹת
  choice: como rios
  rationale: O prefixo כ marca comparação, e נהרות significa “rios”; portanto, “como rios” preserva diretamente a metáfora comparativa.
- source_word: מָיִם
  choice: as águas
  rationale: Embora possa ser vertido como substantivo de massa no singular, o plural “as águas” é idiomático em português poético e mantém mais de perto a forma e a amplitude imagética do hebraico.
