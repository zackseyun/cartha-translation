  text: Mas escolheu a tribo de Judá e o monte Sião, que ele amava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega um só verbo, “escolheu”, com dois objetos diretos: “a tribo de Judá” e “o monte Sião”, sem uma conjunção expressa entre eles.'
    reason: esclarecimento_sintático
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Mas escolheu
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “Mas” expressa naturalmente o contraste contextual com a rejeição de José e Efraim no versículo anterior. בחר significa “escolher, selecionar”.
- source_word: שֵׁבֶט יְהוּדָה
  choice: a tribo de Judá
  rationale: שֵׁבֶט designa aqui uma tribo de Israel, e a construção com יְהוּדָה é traduzida naturalmente como “a tribo de Judá”.
- source_word: הַר צִיּוֹן
  choice: o monte Sião
  rationale: Forma corrente e clara em português para a referência geográfica a Sião.
- source_word: אֲשֶׁר אָהֵב
  choice: que ele amava
  rationale: A oração relativa modifica mais naturalmente o antecedente imediato, “o monte Sião”, sem ampliar a afirmação teológica do texto.
- source_word: אֶת ... אֶת
  choice: e
  rationale: As duas ocorrências de אֶת marcam “a tribo de Judá” e “o monte Sião” como objetos do único verbo “escolheu”. A conjunção torna essa relação clara e natural em português, embora não esteja expressa no hebraico.
theological_decisions:
- issue: Relação entre a escolha de Judá e a de Sião
  choice: Apresentar Judá e o monte Sião como dois objetos da escolha divina.
  alternative: Entender “o monte Sião” como uma aposição que especifica “a tribo de Judá”.
  rationale: A repetição do marcador de objeto direto אֶת favorece dois objetos sob um único verbo. A tradução não desenvolve essa escolha numa doutrina de eleição além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Monte Sião” mantém a forma bíblica consagrada; a repetição de “ele” evita uma construção relativa excessivamente elíptica.
