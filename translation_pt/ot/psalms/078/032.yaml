  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: pt
  text: Apesar de tudo isso, continuaram pecando e não creram em seus feitos maravilhosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não confiaram em seus feitos maravilhosos” ou “não deram crédito a seus feitos maravilhosos”. O verbo hebraico pode ter o sentido de crer ou confiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: Apesar de tudo isso
  rationale: 'A construção tem sentido concessivo no contexto: apesar dos atos de juízo e provisão narrados anteriormente, o povo persistiu em sua conduta.'
- source_word: חָטְאוּ עוֹד
  choice: continuaram pecando
  rationale: O perfeito חָטְאוּ expressa o pecado, enquanto עוֹד indica sua persistência. Em português corrente, “continuaram pecando” comunica naturalmente essa força conjunta.
- source_word: וְ/לֹא הֶאֱמִינוּ
  choice: e não creram
  rationale: Preserva a coordenação simples do hebraico e traduz o Hifil de אמן sem acrescentar uma explicação doutrinária.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: em seus feitos maravilhosos
  rationale: נִפְלָאוֹת designa atos extraordinários de Deus. “Feitos maravilhosos” mantém tanto a ideia de assombro quanto a referência a ações concretas; o sufixo masculino singular é vertido por “seus”.
theological_decisions:
- issue: Natureza da falha de Israel diante dos atos de Deus
  choice: não creram em seus feitos maravilhosos
  alternative: não confiaram em seus feitos maravilhosos / não deram crédito a seus feitos maravilhosos
  rationale: A formulação conserva a amplitude de הֶאֱמִינוּ com בְּ, que pode envolver crença ou confiança, e mantém a tensão entre os atos divinos já presenciados e a incredulidade persistente do povo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Continuaram pecando” evita a rigidez de “ainda pecaram” e expressa com naturalidade a persistência indicada por עוֹד.
