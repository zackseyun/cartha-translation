  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף הַאֲזִ֣ינָ/ה עַ֭מִּ/י תּוֹרָתִ֑/י הַטּ֥וּ אָ֝זְנְ/כֶ֗ם לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: pt
  text: Masquil[a] de Asafe. Escute, meu povo, a minha instrução; inclinem os ouvidos às palavras da minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Masquil” é um termo técnico usado nos títulos dos salmos; pode indicar uma composição instrutiva ou contemplativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Masquil
  rationale: Mantém transliterado o termo técnico do título, cuja função exata é incerta, sem impor um único sentido possível.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: É a forma mais natural em português para a relação indicada no título, sem definir estritamente se se trata de autoria, associação ou dedicação.
- source_word: הַאֲזִינָה
  choice: Escute
  rationale: Expressa o chamado enfático à atenção em linguagem atual e digna; o singular concorda naturalmente com o vocativo coletivo «meu povo».
- source_word: עַמִּי
  choice: meu povo
  rationale: Conserva diretamente o possessivo e o vocativo do hebraico.
- source_word: תּוֹרָתִי
  choice: a minha instrução
  rationale: Neste contexto sapiencial e histórico, תּוֹרָה designa ensino ou instrução, não apenas legislação.
- source_word: הַטּוּ
  choice: inclinem
  rationale: Preserva a imagem poética de voltar ou inclinar os ouvidos para ouvir atentamente, bem como a mudança do imperativo singular para o plural no hebraico.
- source_word: אָזְנְכֶם
  choice: os ouvidos
  rationale: O plural é explícito; em português, o artigo definido com a parte do corpo é mais idiomático, ficando a referência aos ouvintes clara pela forma verbal plural.
- source_word: לְאִמְרֵי
  choice: às palavras
  rationale: É uma equivalência clara e natural que mantém o paralelismo poético.
- source_word: פִי
  choice: da minha boca
  rationale: Conserva a imagem concreta do original e o paralelo entre os ouvidos dos ouvintes e a boca do orador.
theological_decisions: []
