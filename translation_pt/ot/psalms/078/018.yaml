  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: pt
  text: Puseram Deus à prova em seus corações, pedindo comida para si mesmos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “em seu coração”. O singular apresenta o povo coletivamente; em português, também se pode traduzir “em seus corações”.
    reason: literal_form
  - marker: b
    text: Ou “pedindo comida para satisfazer seu apetite”. A palavra hebraica néfesh pode significar “ser”, “pessoa”, “vida”, “desejo” ou “apetite”; neste contexto, “apetite” é uma possibilidade forte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: puseram à prova
  rationale: O piel de נסה significa aqui testar ou pôr à prova. “Puseram à prova” expressa com clareza o desafio dirigido a Deus, sem a possível conotação moderna de indução ao pecado presente em “tentaram”.
- source_word: אֵל
  choice: Deus
  rationale: אֵל é um título divino comum e, neste contexto, corresponde naturalmente a “Deus”.
- source_word: בִּלְבָבָם
  choice: em seus corações
  rationale: O hebraico traz o substantivo no singular coletivo, literalmente “em seu coração”. O plural distributivo é mais natural e inequívoco em português, mantendo a ideia de uma atitude interior compartilhada.
- source_word: לִשְׁאָל
  choice: pedindo
  rationale: O infinitivo com ל indica aqui o meio pelo qual puseram Deus à prova. O gerúndio “pedindo” comunica essa relação de modo natural.
- source_word: אֹכֶל
  choice: comida
  rationale: אֹכֶל designa comida em sentido geral; não há motivo contextual para restringi-lo a “pão”.
- source_word: לְנַפְשָׁם
  choice: para si mesmos
  rationale: נֶפֶשׁ pode significar vida, pessoa, ser, desejo ou apetite. “Para si mesmos” conserva a referência reflexiva sem impor no texto principal uma interpretação única, enquanto a nota registra o sentido contextual de “apetite”.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto do desejo por comida
  choice: para si mesmos
  alternative: para satisfazer seu apetite
  rationale: A expressão pode apontar para a própria pessoa ou, neste contexto alimentar, para o apetite. O texto principal preserva essa amplitude sem introduzir uma antropologia de “alma” separada do corpo; a alternativa contextual é apresentada em nota.
- issue: Singular coletivo de לְבָבָם
  choice: em seus corações
  alternative: em seu coração
  rationale: O hebraico emprega o singular com sufixo plural, retratando a disposição interior coletiva do povo. O plural distributivo evita ambiguidade possessiva em português, e a forma literal fica registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitou-se “tentaram Deus” por sua possível ambiguidade contemporânea e preferiu-se “puseram Deus à prova”. Os marcadores de nota aparecem no texto principal.
