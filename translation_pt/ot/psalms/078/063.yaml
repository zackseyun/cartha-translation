base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: pt
  text: O fogo consumiu os seus jovens, e suas virgens não foram celebradas com cânticos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não foram festejadas”. É provável que o sentido seja que, por causa da devastação, não houve cânticos de casamento para as jovens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: os seus jovens
  rationale: בָּחוּר designa normalmente homens jovens no vigor da idade, aqui possivelmente em contexto militar e matrimonial. “Os seus jovens” é natural em português e mantém o paralelo com “suas virgens”.
- source_word: אָכְלָה אֵשׁ
  choice: O fogo consumiu
  rationale: Embora אָכַל signifique literalmente “comer”, quando o fogo é o sujeito a expressão significa idiomaticamente “consumir” ou “devorar”. “Consumiu” preserva a imagem destrutiva em linguagem clara.
- source_word: וּבְתוּלֹתָיו
  choice: e suas virgens
  rationale: בְּתוּלָה denota uma virgem ou jovem em idade de casar. “Virgens” conserva explicitamente o sentido do termo hebraico e o contraste com os jovens.
- source_word: לֹא הוּלָּלוּ
  choice: não foram celebradas com cânticos
  rationale: O Pual de הלל pode indicar que elas não foram celebradas ou louvadas; no contexto, provavelmente alude à ausência de cânticos matrimoniais. A formulação mantém a referência ao canto sem inserir explicitamente “casamento” no texto principal.
