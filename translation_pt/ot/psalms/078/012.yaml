  yaml_path: translation/ot/psalms/078/012.yaml
  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: pt
  text: Diante dos seus pais, ele realizou maravilhas na terra do Egito, nos campos de Zoã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
