lexical_decisions:
- source_word: נֶגֶד אֲבוֹתָם
  choice: Diante dos seus pais
  rationale: “Diante de” expressa presença e visibilidade, preservando a formulação familiar literal “seus pais”; no contexto, trata-se dos antepassados de Israel.
- source_word: עָשָׂה פֶלֶא
  choice: ele realizou maravilhas
  rationale: O singular hebraico pode ter sentido coletivo. “Realizou maravilhas” é natural e digno em português, sem acrescentar a classificação teológica mais específica de “milagres”.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém o substantivo geográfico explícito no hebraico e soa natural em português.
- source_word: שְׂדֵה צֹעַן
  choice: nos campos de Zoã
  rationale: A expressão está no singular em hebraico, mas pode designar a área rural ou região ao redor da cidade; o plural idiomático “campos” comunica esse sentido em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Zoã” segue a forma portuguesa tradicional do topônimo. A tradução conserva a referência literal aos “pais” e deixa o contexto identificar esses pais como os antepassados de Israel.
