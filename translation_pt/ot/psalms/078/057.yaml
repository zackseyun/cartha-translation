  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: pt
  text: Mas eles voltaram atrás e agiram traiçoeiramente, como seus pais; desviaram-se como um arco enganoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um arco frouxo” ou “como um arco defeituoso” — isto é, um arco no qual não se pode confiar para lançar a flecha na direção certa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: voltaram atrás
  rationale: Expressa a ideia de recuar ou abandonar um rumo anterior, sem recorrer ao termo teológico posterior “apostatar”.
- source_word: וַיִּבְגְּדוּ
  choice: agiram traiçoeiramente
  rationale: Preserva a força moral de בגד e sua conotação de deslealdade, sem acrescentar um objeto que não está expresso no hebraico.
- source_word: כַּאֲבוֹתָם
  choice: como seus pais
  rationale: Reproduz o termo masculino e familiar explícito no hebraico; “antepassados” seria uma possível formulação contextual, mas menos formalmente correspondente.
- source_word: נֶהְפְּכוּ
  choice: desviaram-se
  rationale: No contexto da imagem do arco, comunica uma mudança de direção ou desvio e forma uma frase natural em português.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: como um arco enganoso
  rationale: Mantém a personificação e a ambiguidade de רְמִיָּה, descrevendo um arco no qual não se pode confiar para lançar a flecha na direção certa; alternativas concretas são registradas em nota.
theological_decisions:
- issue: Nuance pactual da infidelidade de Israel
  choice: Empregar linguagem moralmente forte (“agiram traiçoeiramente”) sem explicitar que romperam a aliança com Deus.
  alternative: Traduzir de modo mais neutro como “foram infiéis” ou acrescentar “quebraram a fidelidade a Deus”.
  rationale: O contexto mais amplo do salmo trata da infidelidade de Israel, mas o versículo não explicita o objeto da traição nem menciona a aliança. A tradução conserva o peso relacional e moral sem ampliar teologicamente o texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A nota foi colocada junto de “arco enganoso”, expressão à qual a alternativa lexical se refere.
