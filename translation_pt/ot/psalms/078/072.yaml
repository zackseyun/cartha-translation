  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: pt
  text: Assim, ele os pastoreou com integridade de coração[a] e os guiou com a habilidade de suas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a integridade de seu coração”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com o entendimento de suas mãos”, isto é, com habilidade e discernimento ao conduzi-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: ele os pastoreou
  rationale: Preserva a metáfora explícita de רעה, central no contexto de Davi como rei-pastor, em vez de reduzi-la ao sentido genérico de cuidar ou liderar.
- source_word: כְּתֹם לְבָבוֹ
  choice: com integridade de coração
  rationale: תֹם expressa inteireza, integridade ou irrepreensibilidade. A formulação é natural em português e mantém o sentido ético; a preposição כ é entendida adverbialmente como “com”.
- source_word: לְבָבוֹ
  choice: coração
  rationale: Mantém a imagem hebraica do centro interior da vontade, do pensamento e do caráter.
- source_word: וּבִתְבוּנוֹת
  choice: com a habilidade
  rationale: O plural de תְּבוּנָה pode indicar entendimentos ou discernimentos; em ligação com “mãos”, comunica competência prática. “Habilidade” exprime essa nuance sem eliminar a alternativa mais literal.
- source_word: כַּפָּיו
  choice: de suas mãos
  rationale: Preserva a metáfora corporal das palmas ou mãos como expressão da capacidade prática de governar.
- source_word: יַנְחֵם
  choice: os guiou
  rationale: O hifil de נחה significa conduzir ou guiar. “Guiou” combina naturalmente com a imagem pastoral e sugere direção sábia.
theological_decisions:
- issue: Imagem régia de Davi como pastor
  choice: Manter no texto a linguagem explícita de pastorear.
  alternative: Empregar uma expressão genérica, como “cuidou deles” ou “os liderou”.
  rationale: O versículo conclui a apresentação de Davi como o pastor-rei escolhido pelo SENHOR. A metáfora deve ser preservada sem acrescentar uma identificação messiânica que o próprio versículo não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela do hebraico e as metáforas de pastor, coração e mãos foram mantidas. Os marcadores seguem a ordem em que aparecem no texto.
