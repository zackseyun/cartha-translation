- source_word: נוֹשְׁקֵי רוֹמֵי קָשֶׁת
  choice: armados com arcos
  rationale: Representa de modo natural em português a construção participial hebraica condensada, que reúne a ideia de estar equipado e de manejar ou disparar o arco.
- source_word: הָפְכוּ
  choice: voltaram atrás
  rationale: Mantém a imagem de inversão ou retorno do verbo hebraico e, no contexto militar, comunica retirada sem substituir a figura por uma formulação mais interpretativa.
- source_word: בְּיוֹם קְרָב
  choice: no dia da batalha
  rationale: Tradução direta e idiomática da expressão temporal, com registro digno e corrente.
