  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: pt
  text: Preparou um caminho para a sua ira[a]; não poupou a vida deles da morte[b], mas entregou a vida deles à peste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aplainou uma vereda para a sua ira”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a alma deles”; aqui, no sentido de “a vida deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “epidemia mortal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס
  choice: abriu
  rationale: O piel de פלס indica nivelar ou preparar uma via. Em português, “abriu caminho” conserva a imagem concreta e soa natural.
- source_word: נָתִיב
  choice: caminho
  rationale: נָתִיב designa uma senda, trilha ou caminho; a locução “abriu caminho” comunica claramente a metáfora.
- source_word: לְאַפּוֹ
  choice: para a sua ira
  rationale: אַף significa literalmente “nariz”, mas neste uso idiomático denota ira. “Ira” mantém o tom poético e judicial.
- source_word: לֹא חָשַׂךְ
  choice: não poupou
  rationale: חשׂך, nesta construção, significa não reter ou não preservar; “não poupou” é direto e idiomático.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: 'A preposição מן tem sentido separativo: não poupou ou preservou da morte.'
- source_word: נַפְשָׁם
  choice: a vida deles
  rationale: נֶפֶשׁ refere-se aqui à vida mortal, não especificamente a uma alma imaterial. A forma singular coletiva do hebraico é preservada de modo inteligível.
- source_word: וְחַיָּתָם
  choice: a vida deles
  rationale: Em paralelo com נַפְשָׁם, חַיָּה designa a existência viva. A repetição mantém o paralelismo lexical e a forma coletiva singular.
- source_word: לַדֶּבֶר
  choice: à peste
  rationale: דֶּבֶר denota peste ou epidemia mortal, especialmente em contextos de juízo. “Peste” é conciso e tradicional sem ser obscuro.
- source_word: הִסְגִּיר
  choice: entregou
  rationale: O hifil de סגר pode significar entregar ou deixar nas mãos de algo. “Entregou” expressa a ação de sujeitar a vida deles à peste.
theological_decisions:
- issue: Linguagem antropomórfica sobre o juízo divino
  choice: Conservar a imagem de abrir caminho para a ira de Deus.
  alternative: Deu livre curso à sua ira; desencadeou a sua ira.
  rationale: O hebraico apresenta a ira como algo para o qual se prepara uma rota. A tradução preserva a força poética sem transformar a imagem em formulação doutrinária abstrata.
- issue: Sentido de נֶפֶשׁ
  choice: Traduzir como “vida”, com nota sobre o literal “alma”.
  alternative: alma
  rationale: Neste contexto de morte física e peste, נֶפֶשׁ designa a vida da pessoa. “Vida” evita impor uma distinção posterior entre corpo e alma que o verso não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada em “não poupou da morte a vida deles” para evitar ambiguidade e conservar a relação separativa do hebraico. Os três marcadores aparecem no texto principal.
