  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: pt
  text: Ele as fez cair no meio do acampamento deles[a], ao redor de suas moradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu acampamento” e “suas moradas”; os sufixos hebraicos estão no singular e provavelmente se referem coletivamente a Israel como povo, por isso se usa “deles” em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: Ele as fez cair
  rationale: O hifil de נפל tem sentido causativo. O pronome feminino plural retoma naturalmente as aves/codornizes do contexto imediato, evitando o singular pouco natural em português.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Expressa localização no interior do acampamento e preserva com naturalidade a força espacial da expressão hebraica.
- source_word: מַחֲנֵהוּ
  choice: do acampamento deles
  rationale: Embora o sufixo hebraico seja morfologicamente singular, ele se refere coletivamente a Israel; o plural em português comunica esse referente com clareza.
- source_word: סָבִיב
  choice: ao redor de
  rationale: Indica distribuição circundante; esta formulação é corrente, clara e preserva a imagem espacial.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: de suas moradas
  rationale: מִשְׁכָּן designa lugares de habitação de modo mais amplo que apenas tendas. O possessivo plural é entendido coletivamente como referente aos israelitas.
