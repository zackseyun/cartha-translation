  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: pt
  text: 'Feriu de morte todos os primogênitos no Egito,

    as primícias do vigor deles[a] nas tendas de Cam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os primeiros frutos da força geradora deles”. A expressão hebraica se refere ao primeiro produto da força procriadora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Feriu de morte
  rationale: O verbo נכה, no contexto da morte dos primogênitos, descreve um golpe fatal. “Feriu de morte” torna explícita essa força contextual sem recorrer ao arcaico “matou à espada” nem reduzir o sentido ao simples “feriu”.
- source_word: כָּל בְּכוֹר
  choice: todos os primogênitos
  rationale: Expressa a totalidade indicada por כָּל sem acrescentar “homens” ou “do sexo masculino”, elementos não explícitos no hebraico.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: A preposição בְּ indica localização, e a expressão identifica diretamente o cenário da praga narrada no Êxodo.
- source_word: רֵאשִׁית אוֹנִים
  choice: as primícias do vigor deles
  rationale: A expressão poética designa o primeiro fruto da força geradora. “Primícias” preserva a imagem de começo ou primeiro produto, enquanto “vigor” mantém a referência à força procriadora sem formulação excessivamente técnica.
- source_word: בְּאָהֳלֵי חָם
  choice: nas tendas de Cam
  rationale: Mantém a designação poética e genealógica do Egito por meio de Cam, bem como a imagem concreta de “tendas”.
theological_decisions:
- issue: Designação poética de Egito como “tendas de Cam”
  choice: Manter “Cam” no texto principal
  alternative: nas moradas dos egípcios; nas moradas do Egito
  rationale: Como o primeiro verso já menciona o Egito, a referência a Cam no segundo acrescenta paralelismo poético e textura genealógica. Substituí-la por “Egito” ou “egípcios” apagaria uma imagem genuína do hebraico.
- issue: Sentido de רֵאשִׁית אוֹנִים
  choice: Preservar a metáfora “primícias do vigor”
  alternative: os primeiros frutos da força geradora; os primogênitos de sua força
  rationale: A formulação conserva a tensão poética entre primogenitura e força procriadora, sem restringir o idioma a uma explicação biológica no corpo do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Feriu de morte” comunica o resultado letal exigido pelo contexto; “primícias do vigor” conserva a imagem condensada do hebraico. O marcador [a] foi colocado no fim do verso ao qual a explicação lexical se aplica.
