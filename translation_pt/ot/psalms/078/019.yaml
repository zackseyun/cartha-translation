base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/019.yaml
  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: pt
  text: 'Falaram contra Deus; disseram[a]: “Será que Deus pode preparar uma mesa no deserto?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falaram a respeito de Deus”. A construção hebraica também admite um sentido mais neutro, mas, neste contexto, “contra Deus” expressa melhor o caráter de queixa e rebeldia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Falaram
  rationale: O wayyiqtol de דבר introduz a fala do povo; “falaram” é direto, natural e preserva a sequência narrativa.
- source_word: בֵּאלֹהִים
  choice: contra Deus
  rationale: Com דבר, a preposição ב pode ter sentido adversativo. O contexto de rebeldia e a pergunta desafiadora favorecem “contra Deus”, sem ocultar a alternativa mais neutra.
- source_word: אָמְרוּ
  choice: disseram
  rationale: Mantém explicitamente a fórmula hebraica em duas partes que introduz o discurso direto.
- source_word: הֲיוּכַל
  choice: Será que Deus pode
  rationale: A partícula interrogativa com יכל questiona capacidade. “Será que... pode” expressa em português natural o tom de dúvida desafiadora.
- source_word: אֵל
  choice: Deus
  rationale: Aqui אֵל funciona como designação divina em paralelo com אֱלֹהִים; “Deus” é claro e evita explicitar indevidamente a nuance de poder.
- source_word: לַעֲרֹךְ
  choice: preparar
  rationale: ערך com שֻׁלְחָן significa pôr em ordem ou preparar uma mesa, incluindo no contexto a ideia de prover alimento.
- source_word: שֻׁלְחָן
  choice: uma mesa
  rationale: Preserva a imagem concreta do hebraico, em vez de substituí-la interpretativamente por “uma refeição” ou “um banquete”.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente e bíblico, “deserto” comunica com clareza a região erma da peregrinação de Israel, sem exigir que se trate apenas de terreno arenoso.
theological_decisions:
- issue: Tom da fala de Israel a respeito de Deus
  choice: Traduzir בֵּאלֹהִים por “contra Deus”
  alternative: “a respeito de Deus” ou “sobre Deus”
  rationale: O salmo descreve a incredulidade e a provocação de Israel; o sentido adversativo se ajusta ao contexto e à pergunta que desafia a capacidade divina. A nota preserva a possibilidade gramatical mais neutra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Será que” torna natural a pergunta retórica sem eliminar seu desafio; “mesa” conserva a metáfora concreta do original.
