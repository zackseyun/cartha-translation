  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: pt
  text: Assim, ele os levou ao seu território santo[a], este monte[b] que a sua mão direita adquiriu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua fronteira santa” ou “ao território da sua santidade”. O hebraico גְּבוּל pode significar fronteira, limite ou território.
    reason: lexical_alternative
  - marker: b
    text: Ou “esta colina”. A expressão pode se referir à região montanhosa que Deus deu a Israel e, no contexto mais amplo, também pode evocar Sião.
    reason: alternative_reading
  - marker: c
    text: Ou “tomou posse de” ou “comprou”. O verbo hebraico tem vários sentidos relacionados; aqui descreve o que a mão direita de Deus obteve ou assegurou.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: Assim, ele os levou
  rationale: O hifil de בוא expressa fazer chegar ou levar. “Assim” liga naturalmente o verso à sequência dos atos de Deus narrados no salmo.
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: ao seu território santo
  rationale: גְּבוּל pode indicar limite, fronteira ou território. Como destino ao qual o povo é levado, “território” comunica melhor a dimensão espacial, enquanto “santo” preserva a relação com קָדְשׁוֹ.
- source_word: הַר זֶה
  choice: este monte
  rationale: Mantém o demonstrativo e o substantivo hebraicos sem identificar de modo interpretativo o lugar como Sião ou toda a região montanhosa de Canaã.
- source_word: קָנְתָה
  choice: conquistou
  rationale: קנה pode significar adquirir, comprar ou obter posse. Com a mão direita divina como sujeito, “conquistou” exprime obtenção pela força vitoriosa sem sugerir uma transação comercial.
- source_word: יְמִינוֹ
  choice: a sua mão direita
  rationale: Preserva a imagem antropomórfica hebraica da mão direita como expressão do poder e da vitória de Deus.
theological_decisions:
- issue: Referente de “este monte”
  choice: Manter “este monte” sem especificar o referente no texto principal.
  alternative: Sião; a região montanhosa de Canaã; a terra montanhosa dada a Israel.
  rationale: O hebraico não identifica expressamente o monte neste versículo. A formulação preserva a possível relação tanto com a terra quanto com Sião, sem resolver a ambiguidade.
- issue: Sentido de קנה aplicado ao monte
  choice: conquistou
  alternative: adquiriu; tomou posse de; comprou; criou.
  rationale: O contexto celebra a ação poderosa de Deus em favor de Israel. “Conquistou” preserva essa dimensão, mas a nota registra alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A aposição “este monte” conserva a estrutura poética dos dois membros e evita apresentar dois destinos distintos.
