base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
translation:
  language: pt
  text: Enviou entre eles enxames de moscas[a], que os devoraram, e rãs, que os destruíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enxames”; o termo hebraico עָרֹב pode designar, de modo mais geral, um enxame de insetos, tradicionalmente entendido como moscas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Enviou
  rationale: O piel de שׁלח indica que Deus fez a praga avançar contra os egípcios; “enviou” é natural, claro e suficientemente forte.
- source_word: בָּהֶם
  choice: contra eles
  rationale: Embora ב possa ter valor locativo (“entre eles”), neste contexto hostil “contra eles” expressa naturalmente a direção e o efeito da praga.
- source_word: עָרֹב
  choice: enxames de moscas
  rationale: עָרֹב designa a praga de insetos em enxame, tradicionalmente entendidos como moscas. A expressão esclarece o referente sem ocultar a incerteza lexical, registrada em nota.
- source_word: וַיֹּאכְלֵם
  choice: que os devoraram
  rationale: אכל significa literalmente comer e, neste contexto, comunica consumo destrutivo. O plural concorda naturalmente com “enxames de moscas” em português.
- source_word: וּצְפַרְדֵּעַ
  choice: e rãs
  rationale: O substantivo hebraico singular tem sentido coletivo; o plural é a forma idiomática em português.
- source_word: וַתַּשְׁחִיתֵם
  choice: que os destruíram
  rationale: O hifil de שׁחת expressa causar ruína ou destruição. “Destruíram” preserva a intensidade da linguagem da praga e concorda com “rãs”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. As orações relativas tornam idiomática a sequência hebraica sem enfraquecer o paralelismo. A incerteza sobre a espécie de inseto é preservada em nota.
