  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: pt
  text: Seus sacerdotes caíram à espada, e suas viúvas não choraram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não puderam chorar”. O hebraico diz literalmente “não choraram”; a frase também pode dar a entender que a devastação não deixou oportunidade para o luto habitual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: seus sacerdotes
  rationale: כֹּהֵן designa normalmente o sacerdote ligado ao culto; “sacerdotes” é a tradução direta e adequada ao contexto do juízo sobre Israel.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: A preposição בְּ indica aqui o instrumento ou meio da morte. A expressão portuguesa “cair à espada” comunica de modo natural e digno a morte violenta em combate.
- source_word: נָפָלוּ
  choice: caíram
  rationale: Mantém a imagem concreta do verbo נפל e, em associação com “à espada”, comunica claramente que foram mortos.
- source_word: וְאַלְמְנֹתָיו
  choice: e suas viúvas
  rationale: Preserva o sufixo possessivo masculino singular do hebraico sem explicitar um referente que o texto não nomeia nesta oração. Em português, “suas” conserva a possível amplitude referencial do original.
- source_word: לֹא תִבְכֶּינָה
  choice: não choraram
  rationale: Reproduz diretamente a negação e o verbo “chorar” sem acrescentar modalidade. O contexto pode sugerir impossibilidade de realizar o luto, mas essa inferência é preservada em nota como alternativa.
theological_decisions:
- issue: Sentido da ausência de choro das viúvas
  choice: A tradução principal declara simplesmente que elas “não choraram”.
  alternative: “Não puderam chorar”, entendendo que a devastação impediu o lamento e os ritos fúnebres habituais.
  rationale: O hebraico não contém um verbo modal equivalente a “poder”. A formulação direta preserva a tensão poética entre a declaração literal e a possível implicação de que o desastre não deixou oportunidade para o luto.
translation_notes:
  register: Português atual, claro e solene. “Caíram à espada” conserva a imagem poética hebraica sem soar excessivamente técnica; a ordem das duas orações acompanha de perto o paralelismo do original.
