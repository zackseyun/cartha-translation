  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: pt
  text: 'para declarar que Yahweh é reto;

    ele é a minha rocha,

    e nele não há injustiça.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “maldade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: para declarar
  rationale: O infinitivo construto indica a finalidade ou o resultado da ação descrita no contexto anterior; “declarar” mantém o caráter público da proclamação.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da declaração, e não necessariamente uma oração causal.
- source_word: יָשָׁר
  choice: reto
  rationale: Expressa a retidão moral de Yahweh e preserva a imagem hebraica do que é direito, sem restringi-la apenas ao âmbito judicial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צוּרִי
  choice: a minha rocha
  rationale: Preserva a metáfora concreta e recorrente dos Salmos para firmeza, segurança e proteção.
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: e nele não há injustiça
  rationale: Reproduz naturalmente em português a oração nominal negativa e comunica que nenhuma injustiça se encontra em Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e representa de modo mais provável sua pronúncia antiga.
- issue: Sentido moral de עַוְלָתָה
  choice: injustiça
  alternative: maldade
  rationale: “Injustiça” ressalta a ausência de qualquer desvio do que é reto, em paralelo com יָשָׁר, sem excluir o sentido moral mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. O pronome “ele” explicita naturalmente o sujeito de “é a minha rocha”, enquanto “nele” conserva a formulação relacional do hebraico.
