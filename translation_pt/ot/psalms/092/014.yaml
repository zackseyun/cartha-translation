  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: pt
  text: Ainda dão fruto na velhice; são viçosos e verdejantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda darão fruto na velhice; serão viçosos e verdejantes.” Os verbos hebraicos também podem ser entendidos com sentido futuro.'
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: ainda
  rationale: 'Expressa continuidade: a fecundidade e o vigor descritos no contexto persistem mesmo na velhice.'
- source_word: יְנוּבוּן
  choice: dão fruto
  rationale: O verbo נוב indica produzir, especialmente dentro da imagem vegetal. A expressão preserva com clareza a metáfora das árvores dos versículos anteriores.
- source_word: בְּשֵׂיבָה
  choice: na velhice
  rationale: Embora o substantivo se relacione literalmente aos cabelos grisalhos, aqui designa idiomaticamente a idade avançada.
- source_word: דְּשֵׁנִים
  choice: viçosos
  rationale: O termo significa literalmente 'gordos' ou 'ricos', mas, aplicado a plantas, comunica abundância de seiva, vigor e exuberância. 'Viçosos' preserva essa imagem em português natural.
- source_word: רַעֲנַנִּים
  choice: verdejantes
  rationale: Descreve vegetação fresca, verde e exuberante. 'Verdejantes' mantém a imagem arbórea e forma um paralelo natural com 'viçosos'.
- source_word: יִהְיוּ
  choice: são
  rationale: O imperfeito hebraico pode ter valor habitual ou geral na poesia; o presente comunica a descrição proverbial dos justos sem transformá-la numa previsão exclusivamente futura.
theological_decisions:
- issue: Aspecto e tempo verbal na descrição poética
  choice: 'Traduzir os imperfeitos como afirmações presentes e habituais: ''dão fruto'' e ''são''.'
  alternative: 'Traduzi-los como futuro: ''ainda darão fruto... serão''.'
  rationale: O versículo apresenta uma característica geral dos justos mediante a imagem das árvores. O presente é natural em português e preserva essa força proverbial, enquanto a nota registra a leitura futura também possível.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. 'Viçosos e verdejantes' conserva o paralelismo e a imagem vegetal sem recorrer ao literalismo enganoso 'gordos e verdes'.
