translation:
  language: pt
  text: Ao som do instrumento de dez cordas e da harpa[a], com melodia[b] na lira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Não se sabe ao certo quais instrumentos de cordas os termos hebraicos designam. נָבֶל também pode ser traduzido como “lira” ou “alaúde”, e כִּנּוֹר às vezes é traduzido como “harpa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com meditação na lira”. O hebraico הִגָּיוֹן pode indicar meditação, murmúrio ou som musical ressonante; neste contexto, o sentido musical parece mais adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: ao som de / na
  rationale: Neste contexto musical, a preposição indica acompanhamento ou meio instrumental. “Ao som de” é natural em português; antes de “lira”, “na” preserva de modo idiomático a ideia de execução no instrumento.
- source_word: עָשׂוֹר
  choice: instrumento de dez cordas
  rationale: O termo designa aqui um instrumento de dez cordas. A tradução evita identificar com precisão um tipo de instrumento que o hebraico não especifica.
- source_word: וַעֲלֵי
  choice: e da
  rationale: A conjunção e a preposição ligam o segundo instrumento ao primeiro. A formulação portuguesa evita uma repetição pesada sem perder a enumeração poética.
- source_word: נָבֶל
  choice: harpa
  rationale: O termo se refere a um instrumento de cordas, mas sua identificação exata é incerta. “Harpa” mantém a designação tradicional, com a incerteza registrada em nota.
- source_word: הִגָּיוֹן
  choice: melodia
  rationale: Em contexto instrumental, o termo pode indicar som ressonante, murmúrio musical ou execução meditativa. “Melodia” comunica de modo natural o sentido musical mais provável, sem eliminar a alternativa na nota.
- source_word: בְּכִנּוֹר
  choice: na lira
  rationale: כִּנּוֹר designa um instrumento de cordas, aqui distinguido de נָבֶל. “Lira” é uma equivalência convencional adequada, e a preposição בְּ indica o meio instrumental.
