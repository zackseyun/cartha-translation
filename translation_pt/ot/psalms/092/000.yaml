lexical_decisions:
- source_word: מִזְמוֹר
  choice: salmo
  rationale: Termo tradicional e natural em português para a designação musical e literária מִזְמוֹר, especialmente nos títulos do Saltério.
- source_word: שִׁיר
  choice: cântico
  rationale: Preserva o segundo substantivo do título, distinto de מִזְמוֹר, e mantém um registro digno e corrente no contexto dos Salmos.
- source_word: לְיוֹם
  choice: para o dia
  rationale: A preposição לְ indica finalidade ou associação; a formulação conserva explicitamente יוֹם sem acrescentar uma finalidade litúrgica não declarada.
- source_word: הַשַּׁבָּת
  choice: de sábado
  rationale: Identifica naturalmente em português o sábado como dia determinado, preservando a referência definida do hebraico sem recorrer à paráfrase interpretativa 'dia de descanso'.
theological_decisions:
- issue: Natureza do versículo como título, e não como linha poética
  choice: 'Apresentá-lo como título nominal: “Salmo. Cântico para o dia de sábado.”'
  alternative: Trat المج?á-lo como a primeira linha poética ou inserir um verbo ausente no hebraico.
  rationale: O hebraico reúne elementos nominais e não contém verbo finito. A pontuação como título reflete sua função literária e evita criar uma oração não expressa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Cântico” mantém a distinção lexical entre os dois substantivos hebraicos; a estrutura breve conserva o caráter de sobrescrito.
