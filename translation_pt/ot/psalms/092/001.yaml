  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: pt
  text: É bom dar graças a Yahweh[a] e cantar louvores ao teu nome, ó Altíssimo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; “Yahweh” é uma vocalização amplamente adotada. Tradicionalmente, “SENHOR”.'
    reason: Explicar a forma e a tradução do nome divino.
lexical_decisions:
- source_word: טוֹב
  choice: É bom
  rationale: O adjetivo predicativo avalia as ações expressas pelos infinitivos; a formulação impessoal é natural em português e preserva a amplitude de sentido de “bom”.
- source_word: לְהוֹדוֹת
  choice: dar graças
  rationale: Neste contexto de culto, o hifil de ידה expressa ação de graças ou louvor. “Dar graças” mantém a distinção em relação ao louvor cantado do segundo membro.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto hebraico traz diretamente o nome divino יהוה; “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- source_word: וּלְזַמֵּר
  choice: e cantar louvores
  rationale: O piel de זמר designa fazer música em louvor, frequentemente por meio do canto. A expressão é corrente e não especifica instrumentos ausentes do texto.
- source_word: לְשִׁמְךָ
  choice: ao teu nome
  rationale: Preserva a imagem hebraica do “nome”, importante por suas dimensões de identidade, reputação e revelação, sem reduzi-la simplesmente a “a ti”.
- source_word: עֶלְיוֹן
  choice: ó Altíssimo
  rationale: O título divino é empregado como vocativo; “ó Altíssimo” torna explícita e digna a forma de tratamento.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” busca representar o nome diretamente; a nota informa a forma hebraica e evita ocultar a decisão tradutória.
translation_notes:
  register: Português moderno, claro e reverente, com paralelismo poético preservado. Emprega “teu” por sua concisão e ampla inteligibilidade bíblica. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto do salmo.
