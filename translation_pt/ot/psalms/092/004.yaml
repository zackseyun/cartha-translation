  text: כִּ֤י שִׂמַּחְתַּ֣/נִי יְהוָ֣ה בְּ/פָעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖י יָדֶ֣י/ךָ אֲרַנֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: pt
  text: Pois tu me alegraste, ó Yahweh, por tua obra; pelas obras das tuas mãos, canto de alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: dou gritos de alegria. O verbo hebraico pode indicar tanto um canto jubiloso como um forte clamor de alegria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do louvor no contexto e mantém com naturalidade o valor causal da conjunção hebraica.
- source_word: שִׂמַּחְתַּנִי
  choice: tu me alegraste
  rationale: O piel perfeito de שׂמח com sufixo de primeira pessoa expressa que Yahweh fez o salmista ficar alegre; o pretérito perfeito preserva a ação concluída.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּפָעֳלֶךָ
  choice: com o teu feito
  rationale: פֹּעַל designa obra, feito ou atividade. “Com” comunica a causa ou o meio da alegria, enquanto “feito” conserva o singular e evita apagar a variação lexical com a expressão seguinte.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: pelas obras das tuas mãos
  rationale: Preserva a imagem antropomórfica concreta do hebraico e entende a preposição como indicadora da causa ou ocasião do louvor.
- source_word: אֲרַנֵּן
  choice: canto de alegria
  rationale: O piel imperfeito de רנן pode indicar canto jubiloso ou um grito sonoro de alegria. A tradução principal se ajusta ao contexto de um salmo cantado, e a nota registra a alternativa genuína.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza da expressão jubilosa em אֲרַנֵּן
  choice: canto de alegria
  alternative: dou gritos de alegria
  rationale: O verbo hebraico admite tanto canto jubiloso quanto clamor alegre; o contexto musical favorece “canto”, sem excluir a outra nuance.
translation_notes:
  register: Português moderno, digno e acessível, com uso coerente de “tu” na fala dirigida a Yahweh. A formulação mantém o paralelismo entre “teu feito” e “obras das tuas mãos”, bem como a imagem concreta do original.
