  text: וְ/אַתָּ֥ה מָר֗וֹם לְ/עֹלָ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: pt
  text: Mas tu estás no alto para sempre, ó Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: יהוה (YHWH), o nome divino, aqui transliterado como “Yahweh”.'
    reason: Explica a transliteração do nome divino no texto-fonte.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas tu
  rationale: A conjunção, junto do pronome independente, estabelece contraste com o destino dos perversos no contexto anterior. “Mas tu” comunica naturalmente essa força adversativa.
- source_word: מָרוֹם
  choice: estás nas alturas
  rationale: O substantivo מָרוֹם indica altura ou posição elevada. “Nas alturas” conserva a imagem espacial de exaltação sem transformar a expressão no título “Altíssimo”.
- source_word: לְ/עֹלָם
  choice: para sempre
  rationale: A expressão indica duração contínua e ilimitada; “para sempre” é clara, corrente e adequada ao registro poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה em vocativo
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O texto dirige-se diretamente a Deus usando o Tetragrama. “Ó Yahweh” preserva o nome próprio e torna explícito o vocativo em português, sem acrescentar uma interpretação denominacional.
- issue: Sentido de מָרוֹם
  choice: nas alturas
  alternative: exaltado
  rationale: A formulação mantém a metáfora espacial e sua possível conotação de supremacia, sem reduzir a expressão a uma qualidade abstrata nem convertê-la em título divino.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e leve cadência poética. O pronome “tu” corresponde ao tratamento direto e enfático do hebraico.
