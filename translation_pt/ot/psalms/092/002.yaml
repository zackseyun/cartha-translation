translation_notes:
  register: Português moderno, digno e acessível, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A colocação pronominal e o possessivo “teu” mantêm o tom poético e a referência direta a Deus. O fragmento conserva a dependência sintática do versículo anterior.
