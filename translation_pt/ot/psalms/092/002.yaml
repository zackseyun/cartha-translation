  text: proclamar pela manhã o teu amor leal e, noite após noite, a tua fidelidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַגִּיד
  choice: proclamar
  rationale: O infinitivo com לְ continua a construção do versículo anterior e expressa o que é bom fazer. “Proclamar” preserva a ideia de declaração aberta e solene.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: A preposição בְּ com o substantivo definido tem sentido temporal; “pela manhã” é natural em português e mantém o contraste poético com as noites.
- source_word: חַסְדֶּךָ
  choice: o teu amor leal
  rationale: חֶסֶד reúne benevolência duradoura, compromisso e lealdade. “Amor leal” comunica essas dimensões sem restringir o termo explicitamente a uma formulação pactual.
- source_word: וֶאֱמוּנָתְךָ
  choice: e a tua fidelidade
  rationale: אֱמוּנָה designa aqui a constância e confiabilidade de Deus; “fidelidade” é a equivalência portuguesa mais natural no paralelismo.
- source_word: בַּלֵּילוֹת
  choice: noite após noite
  rationale: O hebraico emprega o plural “noites”. A expressão distributiva “noite após noite” conserva a noção de repetição e soa mais natural em português do que o plural literal “nas noites”.
