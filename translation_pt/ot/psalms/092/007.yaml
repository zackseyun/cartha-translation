source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: pt
  text: Quando os perversos brotam como a erva e todos os que praticam a maldade florescem[a], é para serem destruídos para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e todos os que fazem o mal vicejam”. O hebraico diz literalmente: “e todos os praticantes da maldade florescem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para a sua destruição para sempre” ou “apenas para serem destruídos para sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: Quando ... brotam
  rationale: A preposição ב com o infinitivo construto de פרח introduz uma circunstância temporal. “Quando ... brotam” é natural em português e preserva a imagem vegetal.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente perversas; a forma mantém o sentido coletivo de modo conciso.
- source_word: כְּמוֹ עֵשֶׂב
  choice: como a erva
  rationale: עֵשֶׂב denota erva ou vegetação rasteira. “Erva” conserva a imagem bíblica de crescimento rápido e transitório.
- source_word: וַיָּצִיצוּ
  choice: florescem
  rationale: O verbo צוץ descreve brotar ou florescer. “Florescem” mantém o paralelismo vegetal e comunica prosperidade visível.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: todos os que praticam a maldade
  rationale: A expressão significa literalmente “todos os praticantes da maldade”. A formulação escolhida é clara e atual, sem perder o caráter habitual da ação.
- source_word: לְהִשָּׁמְדָם
  choice: é para serem destruídos
  rationale: 'O infinitivo nifal com sufixo de terceira pessoa plural admite força de finalidade ou resultado: “para eles serem destruídos”. A tradução preserva a voz passiva e não acrescenta um agente divino explícito.'
- source_word: עֲדֵי עַד
  choice: para sempre
  rationale: A locução hebraica expressa duração perpétua; “para sempre” é a equivalência portuguesa direta e corrente.
theological_decisions:
- issue: Se o florescimento dos perversos é apenas contrastado com sua destruição ou apresentado como dirigido a esse resultado
  choice: é para serem destruídos para sempre
  alternative: para a sua destruição para sempre; apenas para serem destruídos para sempre
  rationale: A preposição לְ pode exprimir finalidade ou resultado. O texto principal conserva essa ligação forte entre prosperidade momentânea e juízo final, sem inserir um sujeito divino que o hebraico deixa implícito; a nota registra formulações possíveis sem resolver além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Erva”, “brotam” e “florescem” preservam a imagem vegetal; “os que praticam a maldade” evita uma construção excessivamente calcada no hebraico. Os marcadores aparecem junto aos elementos a que se referem.
