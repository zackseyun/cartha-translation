base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: pt
  text: Como são grandes as tuas obras, ó Yahweh! Teus pensamentos[a] são muito profundos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planos” ou “propósitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: Como são grandes
  rationale: O מַה exclamativo expressa admiração, não uma pergunta; o perfeito de גדל tem aqui valor estativo. A formulação é natural e mantém a força poética.
- source_word: מַעֲשֶׂיךָ
  choice: as tuas obras
  rationale: מַעֲשֶׂה abrange obras e feitos. “Obras” preserva essa amplitude, podendo incluir criação, providência e atos divinos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְאֹד עָמְקוּ
  choice: são muito profundos
  rationale: O perfeito de עמק funciona de modo estativo, e מְאֹד intensifica o predicado. “Muito profundos” reproduz ambos os elementos em português corrente.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: teus pensamentos
  rationale: מַחֲשָׁבָה pode designar pensamentos, planos ou propósitos. “Pensamentos” é a correspondência mais direta e conserva a amplitude poética do termo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Amplitude de מַחְשְׁבֹתֶיךָ
  choice: pensamentos
  alternative: planos ou propósitos
  rationale: “Pensamentos” evita restringir a expressão somente a intenções ou decisões e permite que tanto a sabedoria quanto os desígnios divinos permaneçam em vista.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. A exclamação inicial conserva o tom admirativo da poesia; a segunda oração permanece direta e enfática.
