  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: pt
  text: Mas tu elevaste o meu chifre como o do boi selvagem[b]; fui ungido com óleo fresco[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “fui umedecido” ou “fui misturado com óleo fresco”. O verbo hebraico é incomum, e seu sentido exato é discutido.
    reason: lexical_alternative
  - marker: b
    text: O hebraico re'em designa um bovino selvagem poderoso, tradicionalmente traduzido por “boi selvagem”. Algumas traduções antigas trazem “unicórnio”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּרֶם
  choice: elevaste
  rationale: O verbo רום expressa elevar ou erguer. A forma de segunda pessoa masculina singular dirige-se a Deus no contexto; “elevaste” mantém o tom poético e combina naturalmente com a imagem do chifre.
- source_word: כִּרְאֵים
  choice: como o do boi selvagem
  rationale: רְאֵם designa um bovino selvagem poderoso. A formulação “como o do” deixa claro que a comparação é entre os chifres, evitando o tradicional, mas enganoso, “unicórnio”.
- source_word: קַרְנִי
  choice: o meu chifre
  rationale: קֶרֶן significa literalmente “chifre” e funciona como imagem de força, dignidade ou poder. A metáfora concreta do hebraico é preservada.
- source_word: בַּלֹּתִי
  choice: fui ungido
  rationale: A forma, provavelmente relacionada a בלל, é incomum e discutida. No contexto do óleo, “fui ungido” comunica de modo natural uma leitura idiomática plausível, enquanto a nota conserva alternativas mais literais.
- source_word: בְּשֶׁמֶן
  choice: com óleo
  rationale: Tradução direta e natural da expressão preposicional instrumental.
- source_word: רַעֲנָן
  choice: fresco
  rationale: רַעֲנָן comunica frescor, viço ou exuberância. Em relação ao óleo, “fresco” é claro e idiomático em português.
theological_decisions:
- issue: Metáfora do “chifre”
  choice: Preservar “chifre” como imagem de força e exaltação
  alternative: Traduzir interpretativamente como “minha força” ou “meu poder”
  rationale: A imagem é central à poesia hebraica e permanece compreensível no contexto; interpretá-la no corpo do texto reduziria sua riqueza literária e sua tensão simbólica.
- issue: Sentido de בַּלֹּתִי em relação ao óleo
  choice: Traduzir “fui ungido” e registrar a incerteza em nota
  alternative: “fui umedecido”, “fui regado” ou “fui misturado com óleo fresco”
  rationale: A associação imediata com óleo favorece uma formulação idiomática ligada à unção, mas o verbo raro não permite eliminar com segurança as leituras mais literais; por isso, a ambiguidade é explicitada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a metáfora hebraica “meu chifre”; “boi selvagem” evita uma identificação zoológica excessivamente específica. A ordem das notas segue sua ocorrência efetiva no versículo, e todos os marcadores aparecem no texto.
