base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: pt
  text: 'Pois eis os teus inimigos, ó Yahweh —

    pois eis que os teus inimigos perecerão;

    todos os que praticam a maldade serão dispersos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os malfeitores serão dispersos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou enfática da conjunção e sua ligação com o versículo anterior.
- source_word: הִנֵּה
  choice: eis
  rationale: Preserva a força demonstrativa e enfática do hebraico em linguagem poética digna e corrente.
- source_word: אֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Traduz diretamente o substantivo plural com sufixo de segunda pessoa masculina singular, dirigido a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: Pois eis ... Pois eis que
  rationale: Conserva a repetição enfática e marcada do original, ajustando apenas a sintaxe para soar natural em português.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Expressa o sentido de אבד sem especificar indevidamente o modo da destruição.
- source_word: יִתְפָּרְדוּ
  choice: serão dispersos
  rationale: Reflete o hitpael de פרד, que neste contexto comunica separação ou dispersão, e mantém o paralelismo poético.
- source_word: כָּל
  choice: todos
  rationale: Preserva o alcance abrangente do termo hebraico.
- source_word: פֹּעֲלֵי אָוֶן
  choice: todos os que praticam a maldade
  rationale: Reproduz de modo transparente e idiomático a ideia de pessoas que fazem ou praticam o mal, sem recorrer ao termo mais arcaico 'iniquidade'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva a referência ao nome pessoal de Deus sem convertê-lo em um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A disposição em três linhas preserva o paralelismo, e a repetição de “Pois eis” mantém a ênfase poética do hebraico.
