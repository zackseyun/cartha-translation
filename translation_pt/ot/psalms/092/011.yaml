  register: Português moderno, claro e digno, com legibilidade brasileira. O plural idiomático «meus olhos» evita estranheza excessiva, enquanto «meus ouvidos ouvem» conserva o paralelismo poético. As notas preservam as ambiguidades lexicais e verbais reais do hebraico.
