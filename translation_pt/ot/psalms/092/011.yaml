base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: pt
  text: Meus olhos contemplaram os que me espreitam[a]; meus ouvidos ouvem os malfeitores que se levantam contra mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «meus adversários». O termo hebraico pode referir-se mais literalmente a observadores hostis, isto é, aos que ficam à espreita.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «meus ouvidos ouviram» ou «meus ouvidos ouvirão». A forma verbal hebraica admite diferentes compreensões de aspecto ou tempo neste contexto poético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט עֵינִי
  choice: Meus olhos contemplaram
  rationale: Embora o hebraico diga literalmente «meu olho», o plural é a forma natural em português. «Contemplaram» preserva o sentido visual de נבט e o aspecto de ação constatada no contexto poético.
- source_word: בְּשׁוּרָי
  choice: os que me espreitam
  rationale: O termo pode designar observadores ou vigias hostis. «Os que me espreitam» mantém a imagem lexical sem reduzi-la simplesmente a «inimigos».
- source_word: בַּקָּמִים עָלַי
  choice: que se levantam contra mim
  rationale: Reproduz de modo natural a expressão hebraica de oposição hostil e conserva sua imagem.
- source_word: מְרֵעִים
  choice: malfeitores
  rationale: O particípio designa pessoas que praticam o mal ou causam dano; «malfeitores» é conciso e preserva a dimensão moral.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: meus ouvidos ouvem
  rationale: Mantém a personificação e o paralelismo corporal do hebraico. A forma verbal admite leitura presente, perfeita ou futura conforme a compreensão da sequência poética.
theological_decisions: []
