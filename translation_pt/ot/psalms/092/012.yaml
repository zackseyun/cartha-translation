base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: pt
  text: O justo[a] florescerá como a palmeira; crescerá[b] como o cedro no Líbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O singular hebraico pode ter sentido representativo, referindo-se aos justos em geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “se elevará”, “aumentará” ou “prosperará”; o verbo hebraico expressa crescimento vigoroso ou engrandecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo masculino singular usado como substantivo. “O justo” preserva a forma singular do hebraico e pode ter sentido representativo, sem acrescentar “homem” ao texto.
- source_word: כַּתָּמָר
  choice: como a palmeira
  rationale: A preposição comparativa כְּ introduz a imagem da תָּמָר. “Palmeira” é natural e preserva a imagem arbórea sem impor a especificação botânica “tamareira”.
- source_word: יִפְרָח
  choice: florescerá
  rationale: O verbo פרח descreve brotar ou florescer e, em sentido figurado, prosperar. “Florescerá” mantém tanto a imagem vegetal quanto sua força metafórica.
- source_word: כְּאֶרֶז
  choice: como o cedro
  rationale: Preserva diretamente a comparação com o cedro. O artigo definido soa natural em português nesta imagem poética.
- source_word: בַּלְּבָנוֹן
  choice: no Líbano
  rationale: Reflete de modo direto a preposição בְּ, localizando o cedro no Líbano, região célebre por essas árvores.
- source_word: יִשְׂגֶּה
  choice: crescerá
  rationale: O verbo שׂגה comunica crescimento, aumento ou engrandecimento. “Crescerá” preserva a amplitude lexical e forma um paralelismo natural com “florescerá”, sem explicitar indevidamente a ideia de altura.
