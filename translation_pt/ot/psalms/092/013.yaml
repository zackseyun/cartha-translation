lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Plantados
  rationale: O particípio passivo significa “plantados” ou “estabelecidos”; a escolha preserva de modo natural a metáfora vegetal.
- source_word: בְּבֵית
  choice: na casa de
  rationale: בַּיִת significa literalmente “casa” e, neste contexto, pode referir-se ao templo; “casa” conserva a imagem e o paralelismo hebraicos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּחַצְרוֹת
  choice: nos pátios de
  rationale: חָצֵר designa os pátios ou átrios do santuário; “pátios” é claro em português moderno, enquanto “átrios” permanece como alternativa na nota.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo da primeira pessoa do plural.
- source_word: יַפְרִיחוּ
  choice: florescerão
  rationale: O hifil de פרח pode indicar brotar, florescer ou vicejar; “florescerão” preserva a imagem vegetal e comunica vitalidade em linguagem poética natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ritmo poético conciso. O particípio inicial foi mantido, e o futuro verbal explicita naturalmente a promessa. A nota registra “átrios” como alternativa tradicional para os pátios do templo.
