lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: Preserva a forma masculina singular do hebraico e funciona naturalmente como tipo representativo no paralelismo poético.
- source_word: בַּעַר
  choice: embrutecido
  rationale: Expressa alguém cuja percepção se tornou semelhante à de um animal, sem reduzir o termo à mera falta de informação; mantém também o tom poético.
- source_word: יֵדָע
  choice: não sabe
  rationale: Tradução direta do verbo ידע, adequada ao paralelismo e à ideia de falta de conhecimento ou percepção.
- source_word: כְסִיל
  choice: insensato
  rationale: Termo corrente na linguagem sapiencial para alguém moral e intelectualmente tolo; é digno e amplamente compreensível em português.
- source_word: יָבִין
  choice: não entende
  rationale: Mantém a nuance de compreensão e discernimento, distinguindo-a levemente de 'não sabe' no primeiro membro.
- source_word: אֶת זֹאת
  choice: isto
  rationale: Reproduz de modo natural o demonstrativo hebraico, cujo referente é esclarecido pelo contexto subsequente; os dois-pontos preservam essa abertura.
