base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: pt
  text: Ó Deus, restaura-nos[a] e faze resplandecer o teu rosto[b], para que sejamos salvos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «traze-nos de volta» ou «faz-nos voltar». O verbo hebraico pode significar fazer alguém retornar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «faze resplandecer o teu rosto», imagem da presença e do favor de Deus; compare a linguagem da bênção sacerdotal em Números 6:25.
    reason: cross_reference
  - marker: c
    text: Ou «e seremos salvos». A forma hebraica pode ser entendida tanto como oração pelo resultado quanto como declaração confiante desse resultado.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: O título divino tem referência singular e está em discurso direto. Em português, «Ó Deus» expressa com naturalidade o vocativo que o contexto deixa claro, embora não haja partícula vocativa no hebraico.
- source_word: הֲשִׁיבֵנוּ
  choice: restaura-nos
  rationale: O hifil de שוב significa causar retorno. «Restaura-nos» preserva, de modo idiomático, tanto a ideia de fazer voltar como a renovação da condição do povo; «traze-nos de volta» e «faz-nos voltar» continuam possíveis.
- source_word: וְהָאֵר
  choice: e faze resplandecer
  rationale: O imperativo hifil de אור tem sentido causativo, «fazer brilhar». «Faze resplandecer» é natural no registro poético e conserva essa força causativa.
- source_word: פָּנֶיךָ
  choice: o teu rosto sobre nós
  rationale: Mantém a imagem hebraica do rosto divino, associada à presença e ao favor. «Sobre nós» explicita em português a relação idiomática implícita na imagem e acompanha a formulação tradicional da bênção sacerdotal, sem substituir «rosto» por uma interpretação abstrata.
- source_word: וְנִוָּשֵׁעָה
  choice: para que sejamos salvos
  rationale: 'A forma nifal na primeira pessoa do plural, com valor volitivo após os imperativos, pode ser expressa como resultado desejado: «para que sejamos salvos». A coordenação «e seremos salvos» também é gramaticalmente possível.'
theological_decisions:
- issue: Valor volitivo do verbo final em relação aos imperativos anteriores
  choice: para que sejamos salvos
  alternative: e seremos salvos
  rationale: A tradução principal apresenta a salvação como resultado pedido a Deus, de acordo com a sequência de imperativos e a forma volitiva. A nota preserva a possibilidade de entendê-la como declaração confiante do resultado.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. Emprega «tu» em concordância consistente («teu», «faze») e preserva a metáfora bíblica do rosto resplandecente. Os marcadores aparecem no texto na ordem em que as questões surgem.
