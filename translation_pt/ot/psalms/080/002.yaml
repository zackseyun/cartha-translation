  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: pt
  text: Diante de Efraim, Benjamim e Manassés, desperta o teu poder[b] e vem salvar-nos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vai em nosso socorro»; o verbo hebraico significa literalmente «ir/andar», mas, neste contexto, funciona como um pedido para que Deus intervenha em favor do seu povo.
    reason: lexical_alternative
  - marker: b
    text: Ou «a tua força» ou «a tua potência», em vez de «o teu poder».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: Diante de
  rationale: Preserva o sentido espacial de estar ou agir perante as tribos e soa natural em português no contexto da manifestação e condução divinas.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Efraim, Benjamim e Manassés
  rationale: Mantém os nomes tribais em suas formas portuguesas consagradas; a enumeração é apresentada com pontuação natural.
- source_word: עוֹרְרָה
  choice: desperta
  rationale: Reproduz a metáfora do imperativo hebraico, que pede que o poder divino seja posto em ação, com linguagem clara e digna.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: o teu poder
  rationale: גְּבוּרָה pode indicar poder, força ou potência; «poder» comunica naturalmente a capacidade poderosa de Deus neste apelo.
- source_word: וּלְכָה
  choice: e vem
  rationale: Embora o verbo hebraico signifique literalmente «vai/anda», no apelo dirigido a Deus expressa sua aproximação e intervenção em favor do povo.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: salvar-nos
  rationale: 'Expressa de modo idiomático a finalidade da ação pedida: trazer livramento aos suplicantes.'
theological_decisions:
- issue: Sentido da ação divina pedida na oração
  choice: «desperta o teu poder e vem salvar-nos»
  alternative: «desperta a tua força e vai para a nossa salvação»
  rationale: A tradução conserva a urgência da súplica e a metáfora do poder despertado, enquanto verte idiomaticamente o movimento como a vinda de Deus para intervir, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. «Teu» mantém o tratamento singular direto próprio da oração. As notas preservam as alternativas lexicais genuínas do hebraico.
