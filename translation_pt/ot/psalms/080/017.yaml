base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: pt
  text: Esteja a tua mão sobre o homem da tua direita[a], sobre o filho do homem[b] que fortaleceste para ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem à tua direita”. Literalmente, “o homem da tua mão direita”. A expressão hebraica pode indicar alguém associado à direita de Deus, sugerindo favor, força ou posição especial.'
    reason: lexical_alternative
  - marker: b
    text: “Filho do homem” pode significar simplesmente “ser humano”, embora, no contexto bíblico, a expressão também possa ter ressonância régia ou messiânica.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: Esteja
  rationale: O jussivo de היה expressa uma súplica ou desejo; “Esteja” preserva essa força de modo natural e digno em português.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Mantém a metáfora concreta da mão, que sugere ação, poder e apoio sem explicitar apenas uma dessas ideias.
- source_word: עַל
  choice: sobre
  rationale: Equivalente natural em português, adequado ao paralelismo poético e à ideia de ação ou proteção divina dirigida à pessoa mencionada.
- source_word: אִישׁ יְמִינֶךָ
  choice: o homem da tua mão direita
  rationale: 'Reproduz de perto o idioma hebraico e conserva sua ambiguidade poética: alguém especialmente associado à mão direita de Deus, possivelmente como favorecido, sustentado ou escolhido.'
- source_word: בֶּן אָדָם
  choice: o filho do homem
  rationale: Preserva o singular masculino e a expressão hebraica, sem decidir se aqui ela designa apenas um ser humano ou possui ressonância régia ou messiânica.
- source_word: אִמַּצְתָּ
  choice: fortaleceste
  rationale: O piel de אמץ comunica tornar forte ou firme; a forma verbal portuguesa expressa de maneira concisa a ação concluída.
- source_word: לָּךְ
  choice: para ti
  rationale: Preserva a relação ou finalidade indicada pela preposição sem ampliar indevidamente o sentido para “como propriedade tua” ou outra interpretação.
theological_decisions:
- issue: Se “o homem da tua mão direita” e “o filho do homem” devem ser apresentados explicitamente como títulos messiânicos
  choice: Mantidos como linguagem poética humana, sem maiúsculas nem explicação messiânica no texto principal
  alternative: Traduzir de modo explicitamente messiânico ou identificar diretamente a figura com Israel
  rationale: O contexto pode admitir leituras corporativa, régia ou messiânica, mas o hebraico do versículo não obriga a escolher entre elas. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e de tom poético digno, com uso de “tu” coerente com a oração dirigida a Deus. A formulação mantém de propósito o idioma incomum “homem da tua mão direita”, esclarecido em nota, para conservar a ambiguidade do hebraico.
