  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: pt
  text: Tu nos tornas motivo de conflito para os nossos vizinhos, e os nossos inimigos zombam deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “deles” não é explícito no hebraico. A expressão também pode ser entendida como “zombam de nós” ou “zombam entre si”.
    reason: Preservar a ambiguidade do pronome hebraico לָמוֹ e informar alternativas reconhecidas sem alterar silenciosamente o texto.
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Tu nos tornas
  rationale: Expressa diretamente a forma verbal causativa no contexto, mantendo Deus como sujeito e o povo como objeto.
- source_word: מָדוֹן
  choice: motivo de conflito
  rationale: O substantivo denota contenda, disputa ou discórdia; a formulação comunica que o povo se tornou causa ou objeto de conflito.
- source_word: לִשְׁכֵנֵינוּ
  choice: para os nossos vizinhos
  rationale: Preserva a preposição e o sentido relacional de שָׁכֵן, isto é, os povos ou grupos próximos.
- source_word: יִלְעֲגוּ
  choice: zombam
  rationale: Representa o sentido de escarnecer ou ridicularizar, em linguagem atual e digna.
- source_word: לָמוֹ
  choice: deles
  rationale: Mantém o pronome de terceira pessoa plural conforme o texto massorético e a camada inglesa auditada, sem substituí-lo silenciosamente por 'de nós'; a ambiguidade referencial é registrada em nota.
theological_decisions:
- issue: Referente de לָמוֹ
  choice: deles, com referência gramatical mais imediata aos vizinhos
  alternative: de nós; ou entre si
  rationale: A forma hebraica é de terceira pessoa plural e seu referente é discutido. O texto principal preserva 'deles', em consonância com a evidência formal e com a decisão auditada, enquanto a nota informa as leituras contextuais possíveis sem decidir uma questão teológica por harmonização.
translation_notes:
  register: Português moderno, claro e digno, com tratamento direto a Deus por “Tu”. “Motivo de conflito” evita uma construção excessivamente literal e pouco natural, sem enfraquecer a acusação do salmista.
