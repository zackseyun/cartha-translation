base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/005.yaml
  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: pt
  text: Tu os alimentaste com pão de lágrimas e lhes deste lágrimas para beber em grande medida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela medida de um terço” ou “em medida tríplice”. O termo final provavelmente se refere a uma medida grande, mas seu sentido exato é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Tu os alimentaste
  rationale: O hifil de אכל com sufixo de terceira pessoa masculina plural expressa a ação causativa de dar de comer ou alimentar. O pretérito perfeito traduz naturalmente a ação concluída no discurso poético dirigido a Deus.
- source_word: לֶחֶם דִּמְעָה
  choice: pão de lágrimas
  rationale: Mantém a imagem concreta e forte do hebraico, sem generalizar לֶחֶם como mera comida.
- source_word: וַתַּשְׁקֵמוֹ
  choice: e lhes deste ... para beber
  rationale: O hifil de שקה significa dar de beber ou fazer beber. Esta formulação é natural em português e conserva o paralelismo com alimentar.
- source_word: בִּדְמָעוֹת
  choice: lágrimas
  rationale: Com o verbo dar de beber, designa aquilo que é dado como bebida; a construção portuguesa dispensa a reprodução explícita da preposição hebraica.
- source_word: שָׁלִישׁ
  choice: em grande medida
  rationale: O termo parece indicar uma medida, mas seu valor exato neste contexto é incerto. A expressão comunica grande quantidade sem transformar uma interpretação metrológica incerta em precisão.
theological_decisions: []
