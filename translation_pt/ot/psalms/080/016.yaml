  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: pt
  text: Queimada pelo fogo, cortada — por causa da repreensão do teu rosto, perecem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: Queimada pelo fogo
  rationale: Preserva o particípio passivo feminino singular e a imagem enfática do hebraico, referindo-se à videira do contexto.
- source_word: כְּסוּחָה
  choice: cortada
  rationale: Reproduz o segundo particípio passivo feminino, que descreve a videira como derrubada ou decepada, sem acrescentar um agente.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: diante da repreensão do teu rosto
  rationale: Mantém a expressão antropomórfica incomum 'teu rosto' e comunica que a destruição ocorre em consequência da repreensão divina.
- source_word: יֹאבֵדוּ
  choice: perecem
  rationale: Mantém o plural masculino do verbo, apesar dos particípios femininos singulares anteriores, preservando a mudança gramatical e a possível ampliação dos referentes.
theological_decisions:
- issue: Mudança do feminino singular nos particípios para o masculino plural no verbo final
  choice: 'Preservar a mudança: ''Queimada... cortada... perecem'''
  alternative: 'Regularizar tudo no singular: ''ela perece'''
  rationale: O texto hebraico apresenta deliberadamente essa tensão gramatical; regularizá-la resolveria uma ambiguidade textual que deve permanecer visível.
- issue: Antropomorfismo em פָּנֶיךָ
  choice: teu rosto
  alternative: tua presença
  rationale: A tradução literal conserva a força poética e teológica da expressão sem interpretar 'rosto' apenas como 'presença'.
translation_notes:
  register: Português atual, digno e poético, com sintaxe concisa. O travessão liga as duas condições da videira à consequência da repreensão divina. A formulação conserva a tensão entre o feminino singular ('queimada', 'cortada') e o plural ('perecem').
