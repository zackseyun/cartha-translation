base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/013.yaml
  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: pt
  text: O javali da floresta a devasta[a], e os animais do campo se alimentam dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a despoja” ou “a rói”; o verbo hebraico raro descreve alimentação destrutiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pastam nela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: a devasta
  rationale: O verbo raro כרסם descreve o consumo destrutivo ou a ação de arrancar e despojar vegetação. “Devasta” transmite o dano causado à videira sem limitar excessivamente a maneira como o animal a destrói.
- source_word: חֲזִיר
  choice: javali
  rationale: חֲזִיר pode designar porco ou javali; a origem “da floresta” favorece o animal selvagem, e “javali” é a forma portuguesa mais natural e concisa.
- source_word: מִיָּעַר
  choice: da floresta
  rationale: A preposição מִן indica origem ou procedência. “Da floresta” reproduz isso de modo claro e idiomático.
- source_word: זִיז שָׂדַי
  choice: os animais do campo
  rationale: זִיז é um substantivo incomum para seres vivos que se movem, especialmente animais; em conjunto com שָׂדַי, a expressão refere-se aos animais da região aberta. “Animais do campo” preserva a imagem hebraica e soa natural em português.
- source_word: יִרְעֶנָּה
  choice: se alimentam dela
  rationale: רעה no qal pode significar pastar ou alimentar-se. Com o sufixo feminino retomando a videira, “se alimentam dela” mantém o sentido amplo e natural da ação dos animais.
theological_decisions: []
