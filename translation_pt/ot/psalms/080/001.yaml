id: PSA.80.1
reference: Psalms 80:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: pt
  text: 'Pastor de Israel, dá ouvidos,

    tu que conduzes José[a] como um rebanho;

    tu que estás entronizado sobre os querubins[b],

    resplandece!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “José” provavelmente representa aqui o povo de Israel, em especial as tribos do norte, embora o texto hebraico mantenha o nome próprio.
    reason: cultural_note
  - marker: b
    text: Ou “entronizado entre os querubins”. O hebraico diz literalmente “sentado/habitando [sobre/entre] os querubins”, expressão tradicional da presença régia de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה
  choice: Pastor
  rationale: Particípio de רעה usado como título divino e vocativo. “Pastor” preserva de modo natural a metáfora pastoral.
- source_word: הַאֲזִינָה
  choice: dá ouvidos
  rationale: O imperativo de אזן pede atenção cuidadosa. A expressão mantém o tom elevado da súplica e continua compreensível em português atual.
- source_word: נֹהֵג
  choice: conduzes
  rationale: No contexto pastoril, נהג expressa a ação de guiar ou conduzir o rebanho; “conduzes” é natural e evita a dureza que “tanges” poderia sugerir.
- source_word: כַּצֹּאן
  choice: como um rebanho
  rationale: צאן é um coletivo para animais de pequeno porte. “Rebanho” preserva o sentido coletivo e a imagem pastoral.
- source_word: יוֹסֵף
  choice: José
  rationale: Mantém o nome próprio do texto hebraico, sem substituir pela interpretação metonímica “Israel” ou “tribos do norte”.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: tu que estás entronizado sobre os querubins
  rationale: ישב, nesta fórmula régia associada à presença divina, comunica mais que o simples ato de sentar-se. “Entronizado” explicita a força real da imagem, enquanto “sobre” não restringe a relação espacial a “entre”.
- source_word: הוֹפִיעָה
  choice: resplandece
  rationale: O imperativo hiphil de יפע descreve uma manifestação radiante de Deus. “Resplandece” reúne concisamente as ideias de aparecimento e esplendor.
theological_decisions:
- issue: A imagem do reinado de Deus em relação aos querubins
  choice: entronizado sobre os querubins
  alternative: entronizado entre os querubins; sentado sobre os querubins
  rationale: A expressão evoca a presença régia de Deus ligada aos querubins, sem definir com plena precisão a relação espacial. A tradução principal preserva a imagem de trono, e a nota registra a alternativa tradicional “entre”.
- issue: A referência a José
  choice: manter o nome “José”
  alternative: explicitar “Israel” ou “as tribos do norte” no texto
  rationale: José provavelmente representa coletivamente o povo de Israel, com possível ênfase nas tribos do norte, mas o hebraico conserva o nome próprio; a tradução faz o mesmo e deixa a explicação para a nota.
translation_notes:
  register: Português poético, atual e digno, com paralelismo disposto em quatro linhas. “Dá ouvidos” conserva a solenidade da invocação sem recorrer a vocabulário arcaico, e “resplandece” preserva a concisão e a imagem teofânica do hebraico.
