base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: pt
  text: Ó Yahweh, Deus dos Exércitos, restaura-nos[a]; faze resplandecer o teu rosto, para que sejamos salvos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faze-nos voltar” ou “traze-nos de volta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e seremos salvos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, distinguindo-o do título אֱלֹהִים.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Título divino em aposição a Yahweh, formando com צְבָאוֹת a invocação 'Yahweh, Deus dos Exércitos'.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva o título divino tradicional e sua imagem de forças ou hostes sob o comando de Deus; 'Exércitos' é mais corrente em português moderno que 'Hostes'.
- source_word: הֲשִׁיבֵנוּ
  choice: restaura-nos
  rationale: O hifil imperativo de שוב pode significar fazer voltar, trazer de volta ou restaurar. No refrão do salmo, 'restaura-nos' expressa de modo natural a recuperação do povo sem excluir a ideia de retorno.
- source_word: הָאֵר פָּנֶיךָ
  choice: faze resplandecer o teu rosto
  rationale: Mantém a força causativa de הָאֵר e a imagem concreta do rosto divino como expressão de presença e favor.
- source_word: וְנִוָּשֵׁעָה
  choice: e seremos salvos
  rationale: 'Representa diretamente a coordenação com וְ e o sentido resultativo da forma volitiva no contexto: ao resplandecer o rosto de Deus, segue-se a salvação. A leitura de finalidade também permanece possível.'
theological_decisions:
- issue: Forma da invocação יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Ó Yahweh, Deus dos Exércitos
  alternative: Ó Yahweh, Deus das hostes
  rationale: Conserva o nome da aliança e entende 'Deus dos Exércitos' como título em aposição, sem restringir צְבָאוֹת apenas a exércitos humanos.
- issue: Força de וְנִוָּשֵׁעָה no encerramento do refrão
  choice: e seremos salvos
  alternative: para que sejamos salvos
  rationale: A forma pode exprimir resultado ou finalidade após os imperativos. O texto principal preserva a coordenação hebraica e o resultado esperado, enquanto a nota registra a leitura final/purposiva sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, claro e reverente, com formas verbais de segunda pessoa coerentes com 'teu'. A expressão tradicional 'faze resplandecer o teu rosto' preserva a imagem poética hebraica; 'Exércitos' evita o arcaísmo menos acessível de 'Hostes'.
