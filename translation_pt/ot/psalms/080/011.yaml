  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: pt
  text: Estendeu os seus ramos até o mar[a] e os seus brotos até o Rio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas ramagens”. O termo hebraico é incomum neste contexto e pode designar, de modo mais geral, o crescimento que a videira espalha.
    reason: lexical_alternative
  - marker: b
    text: “O Rio” provavelmente se refere ao Eufrates, evocando a extensão ideal do território de Israel, do mar até o Rio.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: Estendeu
  rationale: O piel de שלח descreve aqui a videira lançando ou fazendo avançar seu crescimento. “Estendeu” é natural em português e expressa com clareza a expansão espacial indicada pelo contexto.
- source_word: קְצִירֶהָ
  choice: os seus ramos
  rationale: Embora קציר costume estar relacionado à colheita, neste contexto poético da videira o termo incomum designa aquilo que ela lança ou espalha. “Ramos” preserva a imagem vegetal e o paralelismo sem restringir indevidamente o sentido.
- source_word: עַד יָם
  choice: até o mar
  rationale: עַד indica o limite alcançado. “Até o mar” comunica de modo natural a extensão da videira; no quadro territorial do salmo, o mar é provavelmente o Mediterrâneo.
- source_word: וְאֶל נָהָר
  choice: até o Rio
  rationale: A expressão pertence provavelmente à linguagem bíblica de fronteiras e aponta para o Eufrates. A inicial maiúscula sinaliza essa provável referência geográfica sem inseri-la no corpo do versículo.
- source_word: יוֹנְקוֹתֶיהָ
  choice: os seus brotos
  rationale: O substantivo designa crescimentos novos ou rebentos da videira. “Brotos” é corrente, claro e adequado à metáfora vegetal.
