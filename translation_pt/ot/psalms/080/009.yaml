  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: pt
  text: Limpaste o terreno diante dela[a]; ela lançou raízes[b] e encheu a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abriste espaço para ela”. O verbo hebraico pode indicar tanto desimpedir quanto preparar espaço para a videira.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ela enraizou suas raízes”, expressão hebraica que indica que a videira se estabeleceu firmemente.'
    reason: lexical_alternative
  - marker: c
    text: “Terra” também pode ser entendida como “território” ou “país”, conforme o alcance atribuído ao termo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Limpaste o terreno diante dela
  rationale: O piel de פנה, unido a לְפָנֶיהָ, indica desimpedir ou preparar o espaço à frente da videira. “Limpaste o terreno” comunica naturalmente a ação agrícola, enquanto “diante dela” preserva a imagem espacial do hebraico.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: ela lançou raízes
  rationale: A construção cognata significa literalmente “ela enraizou suas raízes”. “Lançou raízes” reproduz de modo idiomático o estabelecimento da videira sem acrescentar o intensificador “profundamente”, ausente do texto.
- source_word: וַתְּמַלֵּא
  choice: encheu
  rationale: Mantém o sentido básico de מלא e a imagem da videira que se expande até ocupar toda a extensão mencionada.
- source_word: אָרֶץ
  choice: a terra
  rationale: “Terra” preserva em português a flexibilidade de אֶרֶץ, que pode designar o território local ou, em escopo mais amplo, a terra.
theological_decisions:
- issue: Referente da metáfora da videira
  choice: Manter a videira como sujeito implícito, retomado pelo pronome feminino “ela”
  alternative: Explicitar “Israel” no corpo do versículo
  rationale: O contexto identifica a videira com Israel, mas este versículo conserva a metáfora agrícola. Não explicitar o referente evita substituir a imagem poética por sua interpretação.
- issue: Escopo de אָרֶץ
  choice: Usar “a terra”, preservando a possível amplitude do termo
  alternative: Especificar “o país” ou “o território”
  rationale: O hebraico permite tanto uma referência territorial local quanto uma leitura mais ampla; o português “terra” mantém essa ambiguidade sem resolvê-la indevidamente.
translation_notes:
  register: Português moderno, claro e poético, com concordância no feminino porque o referente contextual é “videira”. O paralelismo foi preservado com duas orações breves; evitou-se acrescentar “profundamente”, pois não há intensificador explícito no hebraico.
