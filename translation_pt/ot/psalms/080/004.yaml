  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: pt
  text: Ó Yahweh, Deus dos Exércitos, até quando fumegarás[a] contra a oração do teu povo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estarás irado com a oração”. O verbo hebraico evoca literalmente a imagem de fumegar, aqui como expressão da ira divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva o título divino e sua imagem militar ou cósmica sem especificar se os exércitos são terrenos ou celestiais.
- source_word: עַד מָתַי
  choice: até quando
  rationale: Expressão idiomática natural em português para a fórmula hebraica de lamento.
- source_word: עָשַׁנְתָּ
  choice: fumegarás
  rationale: Mantém a metáfora hebraica vívida de soltar fumaça ou fumegar de ira; o futuro português se ajusta naturalmente à pergunta «até quando».
- source_word: בִּתְפִלַּת
  choice: contra a oração
  rationale: Interpreta a preposição בְּ em sentido adversativo no contexto do verbo «fumegar».
- source_word: עַמֶּךָ
  choice: teu povo
  rationale: Expressa de modo natural a relação comunitária e pactual indicada pelo hebraico.
theological_decisions:
- issue: Forma do título יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Yahweh, Deus dos Exércitos
  alternative: SENHOR, Deus dos Exércitos
  rationale: Conserva o nome próprio divino e apresenta «Deus dos Exércitos» como título em aposição.
- issue: Preservação da metáfora de עָשַׁנְתָּ
  choice: fumegarás contra a oração
  alternative: estarás irado com a oração
  rationale: Preserva a imagem antropomórfica e a tensão do lamento, enquanto a nota esclarece seu sentido de ira.
translation_notes:
  register: Linguagem poética, digna e atual. «Fumegarás» é deliberadamente imagético e incomum, como o hebraico; a nota oferece a formulação idiomática. A colocação pronominal e o uso de «teu» mantêm clareza ampla e tom de oração.
