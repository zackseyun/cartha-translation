  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: pt
  text: Ó Deus dos Exércitos, volta, por favor; olha dos céus, vê e cuida desta videira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «visita esta videira». O verbo hebraico pode significar visitar, voltar a atenção para, cuidar de ou inspecionar; aqui, o contexto sugere uma intervenção em favor da videira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva o título divino e sua amplitude militar e cósmica. Em português, é uma forma tradicional ainda compreensível e mais próxima do hebraico do que «Deus Todo-Poderoso».
- source_word: שׁוּב נָא
  choice: volta, por favor
  rationale: שׁוּב é um imperativo que pede a Deus que volte sua atenção favorável ao povo; נָא dá à ordem o tom de súplica, expresso naturalmente por «por favor».
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: olha dos céus
  rationale: Mantém o imperativo e o ponto de observação celestial sem acrescentar um objeto ausente no hebraico.
- source_word: וּרְאֵה
  choice: vê
  rationale: Conserva o imperativo simples e a sequência poética de verbos ligados ao olhar.
- source_word: וּפְקֹד
  choice: e cuida
  rationale: Neste pedido em favor da videira, פקד aponta para uma intervenção atenta visando seu bem. «Cuida» comunica isso com clareza atual, enquanto a nota preserva a amplitude lexical do verbo.
- source_word: גֶּפֶן זֹאת
  choice: desta videira
  rationale: Traduz o substantivo singular גֶּפֶן e preserva com precisão a metáfora já desenvolvida no salmo, sem ampliá-la para «vinhedo».
theological_decisions:
- issue: Tradução do título divino
  choice: Deus dos Exércitos
  alternative: Deus Todo-Poderoso
  rationale: O hebraico apresenta Deus como senhor dos exércitos ou hostes, incluindo a dimensão celestial. A opção escolhida preserva essa imagem em vez de substituí-la pelo título interpretativo «Todo-Poderoso».
- issue: Sentido da intervenção divina expressa por פקד
  choice: cuida desta videira
  alternative: visita esta videira
  rationale: O contexto é uma súplica para que Deus intervenha em benefício da videira que representa seu povo. «Cuida» torna o sentido favorável claro, mas a nota mantém a possibilidade mais formal e lexicalmente ampla de «visita».
translation_notes:
  register: Português moderno, claro e reverente, com formas verbais na segunda pessoa do singular, comuns na linguagem bíblica. A construção concisa mantém a sucessão poética dos quatro imperativos hebraicos. O marcador foi colocado após «videira», expressão à qual a nota lexical se refere.
