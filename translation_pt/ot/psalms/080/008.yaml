source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: pt
  text: Do Egito trouxeste uma videira[a]; expulsaste nações e a plantaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “videira” representa Israel. O verbo traduzido por “trouxeste” também pode significar “fizeste partir”, “removeste” ou, neste contexto, “transplantaste”.
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: גֶּפֶן
  choice: uma videira
  rationale: O substantivo designa uma videira e, no contexto, funciona como metáfora de Israel. O artigo indefinido preserva naturalmente a formulação hebraica sem explicitar o referente.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: A preposição marca origem ou procedência; “do Egito” é idiomático em português e mantém a evocação do êxodo.
- source_word: תַּסִּיעַ
  choice: trouxeste
  rationale: O hifil de נסע pode significar fazer partir, remover ou transplantar. No quadro metafórico da videira e do êxodo, “trouxeste” comunica com clareza o deslocamento sem eliminar as alternativas lexicais, registradas em nota.
- source_word: תְּגָרֵשׁ
  choice: expulsaste
  rationale: O piel de גרש expressa expulsar ou desalojar; “expulsaste” é direto e apropriado ao contexto das nações removidas da terra.
- source_word: גּוֹיִם
  choice: nações
  rationale: “Nações” corresponde ao sentido contextual e evita importar a acepção posterior de “gentios”.
- source_word: וַתִּטָּעֶהָ
  choice: e a plantaste
  rationale: O verbo significa “plantar”, e o sufixo feminino retoma naturalmente “videira”, substantivo feminino também em português.
theological_decisions:
- issue: Identificação metafórica da videira
  choice: Manter “uma videira” no texto principal.
  alternative: Substituir a metáfora por “Israel”.
  rationale: O hebraico apresenta Israel por meio da metáfora da videira. Explicitar “Israel” no corpo do versículo converteria interpretação em tradução; a identificação pode ser indicada em nota.
- issue: Amplitude semântica de תַּסִּיעַ
  choice: Traduzir por “trouxeste” e preservar outras possibilidades em nota.
  alternative: “Fizeste partir”, “removeste” ou “transplantaste”.
  rationale: A forma verbal comporta a ideia de fazer partir ou remover. “Trouxeste” se ajusta ao movimento do Egito para uma nova terra, mas a nota preserva a ambiguidade lexical genuína.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe poética concisa. A ordem inicial “Do Egito” conserva a ênfase do hebraico na procedência. O pronome feminino “a” retoma naturalmente “videira” em português.
