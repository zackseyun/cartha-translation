  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: pt
  text: Os montes foram cobertos pela sua sombra, e os cedros de Deus[a], pelos seus ramos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cedros majestosos”. A expressão hebraica “cedros de Deus” pode indicar grandeza ou majestade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: foram cobertos
  rationale: O qal perfeito plural de כסה, com “os montes” como sujeito, é expresso naturalmente em português por uma construção passiva. O verbo fica subentendido no segundo membro paralelo.
- source_word: הָרִים
  choice: os montes
  rationale: Tradução direta do substantivo plural definido; “montes” é corrente e adequado ao registro poético.
- source_word: צִלָּהּ
  choice: sua sombra
  rationale: צל pode significar “sombra” ou “proteção da sombra”. “Sombra” mantém a imagem concreta da videira que se espalha.
- source_word: וַעֲנָפֶיהָ
  choice: por seus ramos
  rationale: ענף designa ramos ou galhos. A preposição explicita em português a relação paralela com “por sua sombra”, entendendo-se a elipse do verbo “foram cobertos”.
- source_word: אַרְזֵי אֵל
  choice: os cedros de Deus
  rationale: Preserva a forma explícita do hebraico e sua possível evocação teológica, sem reduzir a expressão apenas ao valor superlativo “cedros majestosos”.
theological_decisions:
- issue: Sentido de אֵל na expressão אַרְזֵי אֵל
  choice: cedros de Deus
  alternative: cedros majestosos
  rationale: O nome divino pode integrar uma expressão de grandeza ou majestade, mas a tradução literal conserva a imagem hebraica e não elimina sua possível referência a Deus.
- issue: Relação sintática entre “ramos” e “cedros de Deus”
  choice: os cedros de Deus foram cobertos pelos ramos da videira
  alternative: os ramos da videira eram como cedros de Deus
  rationale: 'O paralelismo com o primeiro membro favorece a elipse de “foram cobertos”: assim como os montes foram cobertos pela sombra, os cedros foram cobertos pelos ramos. A ausência de partícula comparativa no hebraico também favorece esta leitura, embora a outra interpretação seja tradicional e possível.'
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira. A construção elíptica do segundo membro reproduz o paralelismo hebraico sem soar artificial; as notas preservam as ambiguidades lexical e sintática.
