    rationale: «Pela sua sombra» e «pelos seus ramos» tornam a relação passiva e o paralelismo mais transparentes em português, sem mudança de sentido.
  revised_text: Os montes foram cobertos pela sua sombra, e os cedros de Deus[a], pelos seus ramos.
