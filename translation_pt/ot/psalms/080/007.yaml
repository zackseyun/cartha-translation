source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: pt
  text: Ó Deus dos Exércitos[a], restaura-nos[b]; faz o teu rosto brilhar[c], e seremos salvos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Deus das hostes» ou «Deus dos exércitos celestiais». O título hebraico pode abranger as forças celestiais e cósmicas sob o comando de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou «faz-nos voltar» ou «traz-nos de volta». O verbo hebraico pode indicar tanto retorno como restauração.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «faz o teu rosto brilhar». A imagem refere-se à presença favorável de Deus.
    reason: lexical_alternative
  - marker: d
    text: Ou «seremos libertos». O hebraico pode referir-se de modo amplo a resgate, livramento ou salvação.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Ó Deus dos Exércitos
  rationale: A expressão funciona como vocativo. «Ó» torna essa função natural em português, enquanto «dos Exércitos» preserva a amplitude do título hebraico, sem o limitar a forças humanas.
- source_word: הֲשִׁיבֵנוּ
  choice: restaura-nos
  rationale: O hifil de שוב pode significar fazer voltar ou restaurar. «Restaura-nos» é natural no refrão e mantém em aberto as dimensões geográfica, espiritual e pactual do pedido.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: faz o teu rosto brilhar
  rationale: A construção causativa é vertida de modo claro e atual. Mantém-se a imagem concreta do «rosto», em vez de substituí-la pela interpretação «presença» ou «favor».
- source_word: וְנִוָּשֵׁעָה
  choice: e seremos salvos
  rationale: O nifal de ישׁע exprime o resultado esperado da ação favorável de Deus. «Salvos» conserva o sentido amplo de resgate ou livramento, sem o restringir.
theological_decisions:
- issue: Sentido do título divino אֱלֹהִים צְבָאוֹת
  choice: Deus dos Exércitos
  alternative: Deus dos exércitos celestiais; Deus das hostes
  rationale: A tradução preserva a soberania de Deus sobre todas as forças sem reduzir o título apenas a exércitos humanos nem explicitar que sejam somente celestiais.
- issue: Alcance da salvação em וְנִוָּשֵׁעָה
  choice: seremos salvos
  alternative: seremos libertos; seremos socorridos
  rationale: O hebraico permite um sentido amplo de resgate. A formulação escolhida mantém tanto a possibilidade de livramento histórico quanto a ressonância teológica mais abrangente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O tratamento na segunda pessoa («teu») conserva a oração direta; «faz ... brilhar» é natural e mantém a forma causativa. A imagem bíblica do rosto foi preservada no texto principal.
