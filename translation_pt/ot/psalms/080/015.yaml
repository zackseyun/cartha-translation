  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: pt
  text: 'e a cepa[a] que a tua mão direita plantou,

    e o filho[b] que fortaleceste para ti —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “broto”, “ramo” ou “porta-enxerto”. O termo hebraico é raro e ocorre aqui na imagem da videira.
    reason: lexical_alternative
  - marker: b
    text: Ou “ramo”. O hebraico diz literalmente “filho”, mas alguns entendem a palavra de modo metafórico na imagem da vinha ou como referência coletiva a Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: cepa
  rationale: O substantivo é raro e aparece no contexto da videira. “Cepa” preserva a imagem vegetal sem definir de modo rígido se se trata de broto, ramo ou tronco-base.
- source_word: נָטְעָה
  choice: plantou
  rationale: Mantém o sentido comum do verbo e a imagem agrícola do salmo.
- source_word: יְמִינֶךָ
  choice: tua mão direita
  rationale: Preserva a imagem antropomórfica da ação poderosa de Deus, em vez de substituí-la pelo termo abstrato “poder”.
- source_word: וְעַל
  choice: e sobre
  rationale: Conserva a preposição hebraica e a ligação sintática com o pedido do versículo anterior, ainda que o versículo isolado permaneça como continuação de uma frase.
- source_word: בֵּן
  choice: filho
  rationale: É o sentido lexical direto. A tradução preserva a tensão entre a imagem da videira e a personificação corporativa, sem converter o termo em um vocábulo botânico.
- source_word: אִמַּצְתָּה
  choice: fortaleceste
  rationale: 'Expressa de forma natural o valor causativo/intensivo do piel: tornar forte ou firme.'
- source_word: לָּךְ
  choice: para ti
  rationale: Mantém o valor relacional ou de vantagem do dativo sem acrescentar uma finalidade mais específica do que o hebraico declara.
theological_decisions:
- issue: Identidade do “filho” dentro da metáfora da videira
  choice: Manter “filho” sem identificar explicitamente o referente no texto principal.
  alternative: Traduzir como “ramo”, entender diretamente como Israel ou explicitar uma leitura messiânica.
  rationale: O contexto favorece uma referência corporativa dentro da imagem de Israel como videira, mas o hebraico diz literalmente “filho”. Preservar essa palavra mantém a ambiguidade e permite leituras teológicas posteriores sem inseri-las na tradução.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção fragmentária e o travessão final foram mantidos porque o versículo continua a oração iniciada no contexto anterior. “Cepa” é corrente no campo semântico da viticultura e sustenta a imagem poética.
