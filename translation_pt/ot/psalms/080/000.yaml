base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/000.yaml
  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: pt
  text: 'Ao regente: segundo «Lírios». Testemunho.[a] Salmo de Asafe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «Ao regente, para a melodia “Lírios”. Testemunho. De Asafe. Salmo». O sobrescrito hebraico provavelmente conserva indicações musicais ou litúrgicas cujo sentido exato é incerto.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: A fórmula de sobrescrito se dirige ao responsável pela execução musical. «Regente» é conciso, atual e não restringe a função necessariamente a um coro.
- source_word: אֶל
  choice: segundo
  rationale: Em sobrescritos, a preposição provavelmente introduz uma melodia, estilo ou indicação de execução; «segundo» preserva esse uso sem o definir em excesso.
- source_word: שֹׁשַׁנִּים
  choice: «Lírios»
  rationale: Provável nome de melodia ou designação musical. As aspas indicam seu caráter titular, em vez de uma referência direta às flores.
- source_word: עֵדוּת
  choice: Testemunho
  rationale: Mantém o valor lexical básico e a ambiguidade de uma possível indicação musical ou litúrgica separada.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: Preserva a atribuição tradicional sem decidir se indica autoria, associação ou pertencimento a uma coleção.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Equivalente português corrente para o gênero de composição cantada indicado pelo hebraico.
theological_decisions:
- issue: Relação de עֵדוּת com «Lírios» e com a atribuição seguinte
  choice: 'Apresentá-lo como indicação independente: «Testemunho.»'
  alternative: Integrá-lo ao título musical («Lírios do testemunho») ou vinculá-lo a «de Asafe»
  rationale: A sintaxe concisa do sobrescrito é incerta. A separação evita impor uma relação que o hebraico não explicita com segurança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a concisão típica dos sobrescritos e a incerteza das antigas indicações musicais e litúrgicas.
