  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: pt
  text: Por que derrubaste as cercas dela[a], e todos os que passam pelo caminho colhem[b] os frutos dela?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os muros dela” ou “as sebes dela”; o hebraico se refere à proteção que cercava uma vinha.
    reason: lexical_alternative
  - marker: b
    text: Ou “a arrancam” ou “a despojam”. O verbo hebraico sugere colher ou arrancar o que há na videira; “os frutos dela” explicita o objeto no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz uma pergunta de lamento dirigida a Deus; é a forma natural e direta em português atual.
- source_word: פָּרַצְתָּ
  choice: derrubaste
  rationale: O verbo פרץ expressa abrir uma brecha ou romper. Com a cerca protetora de uma vinha como objeto, “derrubaste” comunica naturalmente a remoção dessa proteção.
- source_word: גְדֵרֶיהָ
  choice: as cercas dela
  rationale: גדר designa a cerca, o muro ou a sebe que protege uma vinha. “Cercas” preserva a imagem agrícola e evita sugerir, sem necessidade, fortificações urbanas.
- source_word: וְאָרוּהָ
  choice: de modo que ... colhem seus frutos
  rationale: O verbo ארה indica colher ou arrancar da planta. O hebraico traz como objeto a própria vinha; “seus frutos” explicita em português aquilo que os transeuntes colhem sem abandonar a metáfora.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: todos os que passam pelo caminho
  rationale: Reproduz o sentido coletivo e conserva a cadência poética da expressão hebraica, literalmente ligada aos que passam pelo caminho.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Manter como referente a vinha personificada no contexto, usando “dela” e “seus frutos”
  alternative: Substituir diretamente a imagem por Israel
  rationale: O contexto imediato apresenta Israel sob a figura de uma videira. Preservar os referentes femininos mantém a metáfora e sua tensão poética, sem convertê-la em explicação teológica em prosa.
- issue: Relação entre as duas orações
  choice: “de modo que”
  alternative: “e”
  rationale: O waw pode ser traduzido simplesmente por coordenação, mas aqui a segunda oração descreve o resultado da derrubada das cercas. “De modo que” torna essa relação natural em português sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A segunda pessoa singular (“derrubaste”) preserva a oração dirigida diretamente a Deus. A imagem da vinha permanece explícita pelo contexto, sem inserir “vinha” novamente no versículo.
