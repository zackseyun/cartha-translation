source:
  edition: WLC
  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: pt
  text: Então não nos afastaremos de ti; dá-nos vida[a], e invocaremos o teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reaviva-nos”. O hebraico também pode significar “conserva-nos vivos” ou “faz-nos viver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Então não
  rationale: A conjunção com a negação pode introduzir a consequência do pedido anterior. “Então não” expressa essa relação de modo natural, sem perder a continuidade do hebraico.
- source_word: נָסוֹג מִמֶּךָּ
  choice: nos afastaremos de ti
  rationale: O verbo סוג indica recuar ou voltar atrás. Nesta construção separativa, “afastar-se de ti” comunica com clareza a ideia de deixar de seguir a Deus, sem recorrer ao termo mais interpretativo “apostatar”.
- source_word: תְּחַיֵּנוּ
  choice: dá-nos vida
  rationale: O Piel de חיה pode significar dar vida, reavivar ou conservar com vida. “Dá-nos vida” preserva a amplitude causativa do pedido e evita restringi-lo apenas a renovação espiritual ou sobrevivência física.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: e invocaremos o teu nome
  rationale: קרא com בְּשֵׁם forma aqui a expressão de invocar o nome de Deus. “Invocaremos o teu nome” é natural, digna e mantém o sentido de oração e culto.
theological_decisions:
- issue: Sentido do pedido de vida
  choice: Pedido para Deus dar ou restaurar a vida, possibilitando a fidelidade e a invocação do seu nome.
  alternative: Pedido especificamente por reavivamento; ou, em sentido físico, para que Deus conserve o povo vivo.
  rationale: O campo semântico de חיה permite essas nuances. O texto principal mantém a formulação ampla, e a nota registra as alternativas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “ti/teu” preserva o tratamento singular dirigido a Deus e combina com o registro poético; “invocar” mantém a solenidade sem soar arcaico.
