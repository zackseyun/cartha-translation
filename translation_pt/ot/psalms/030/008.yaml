lexical_decisions:
- source_word: אֵלֶיךָ
  choice: A ti
  rationale: Reproduz diretamente a orientação da súplica ao destinatário, com formulação natural em português.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: אֶקְרָא
  choice: clamo
  rationale: O verbo קרא, neste contexto de oração urgente, expressa chamar ou clamar a Deus.
- source_word: אֲדֹנָי
  choice: meu Senhor
  rationale: A forma אֲדֹנָי é adequadamente distinguida de YHWH e mantém o sufixo possessivo historicamente refletido na expressão 'meu Senhor'.
- source_word: אֶתְחַנָּן
  choice: peço misericórdia
  rationale: O hitpael de חנן descreve uma súplica por favor ou misericórdia; esta formulação comunica o sentido sem sugerir mérito.
theological_decisions:
- issue: Distinção entre יְהוָה e אֲדֹנָי
  choice: SENHOR ... meu Senhor
  alternative: SENHOR ... Senhor
  rationale: Mantém visível a diferença lexical entre o nome divino e o título, sem impor uma interpretação sobre a relação entre as duas designações.
translation_notes:
  register: Português moderno, claro e reverente, com paralelismo conciso. Usa 'ti' de modo natural na linguagem bíblica e preserva a distinção entre o nome divino e o título אדני.
