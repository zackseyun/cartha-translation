  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: pt
  text: Ó Yahweh, fizeste subir do Sheol a minha alma[a][b]; mantiveste-me vivo, afastado dos que descem à cova[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol é o termo hebraico para o domínio dos mortos; outra tradução possível é “sepultura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha vida”.
    reason: lexical_alternative
  - marker: c
    text: Ou “reanimaste-me dentre os que descem à cova”; segundo outra interpretação da construção hebraica, “mantiveste-me vivo, para que eu não descesse à cova”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título, e preserva o vocativo poético.
- source_word: הֶעֱלִיתָ
  choice: fizeste subir
  rationale: Reproduz a forma causativa e conserva a imagem vertical de ser retirado do domínio da morte.
- source_word: מִן שְׁאוֹל
  choice: do Sheol
  rationale: Preserva o termo hebraico para o domínio dos mortos, sem o restringir a uma sepultura física nem o identificar com o inferno.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Mantém a expressão poética hebraica, reconhecendo que נֶפֶשׁ também pode significar vida ou a própria pessoa.
- source_word: חִיִּיתַנִי
  choice: mantiveste-me vivo
  rationale: Expressa preservação ou restauração da vida sem impor ao verso uma afirmação explícita de ressurreição.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: entre os que descem à cova
  rationale: Entende מִן como separação do grupo dos que descem à cova; a formulação é natural em português e conserva a ambiguidade poética do perigo de morte.
- source_word: בּוֹר
  choice: cova
  rationale: Conserva a imagem concreta de uma cavidade associada à morte e à sepultura, sem eliminar sua força metafórica.
theological_decisions:
- issue: Se o verso implica uma doutrina plenamente desenvolvida da vida após a morte ou uma ressurreição literal
  choice: Conservar as imagens de Sheol e da cova, apresentando o livramento da morte ou de um perigo mortal sem maior especificação.
  alternative: Traduzir Sheol apenas como “sepultura” ou explicitar “ressuscitaste-me dentre os mortos”.
  rationale: O hebraico emprega imagens poéticas tradicionais do domínio da morte. A tradução não deve resolver essa tensão por meio de linguagem doutrinariamente mais específica que o texto.
- issue: Relação sintática entre חִיִּיתַנִי e מִיּוֹרְדֵי בוֹר
  choice: “mantiveste-me vivo entre os que descem à cova”
  alternative: “reanimaste-me dentre os que descem à cova” ou “mantiveste-me vivo, para que eu não descesse à cova”
  rationale: A leitura escolhida preserva a ideia de separação em relação aos que descem à cova, mas a construção hebraica admite outras relações, registradas em nota.
translation_notes:
  register: Português moderno, digno e poético, de compreensão ampla. “Yahweh” preserva o nome divino; “Sheol” mantém o referente cultural hebraico e é explicado em nota. A colocação dos marcadores segue diretamente os termos ou construções a que se referem.
