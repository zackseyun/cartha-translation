base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: pt
  text: Ó Yahweh, por teu favor fizeste meu monte permanecer firme[a]; escondeste teu rosto, e fiquei consternado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabeleceste força para o meu monte”. A formulação hebraica é compacta e também pode ser entendida como imagem de prosperidade segura ou estabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino e expressa a invocação direta com o vocativo natural em português.
- source_word: בִּרְצוֹנְךָ
  choice: por teu favor
  rationale: רָצוֹן indica favor, boa vontade ou benevolência; a preposição בְּ tem aqui sentido instrumental.
- source_word: הֶעֱמַדְתָּה
  choice: fizeste ... permanecer
  rationale: O hifil de עמד é causativo, literalmente 'fazer ficar de pé'; 'fizeste ... permanecer firme' comunica essa força com naturalidade.
- source_word: לְהַרְרִי עֹז
  choice: meu monte permanecer firme
  rationale: Mantém a imagem compacta e difícil do hebraico, entendendo עֹז predicativa ou adverbialmente, sem substituir 'meu monte' por uma interpretação.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: escondeste teu rosto
  rationale: Preserva o conhecido idioma hebraico para a retirada da presença ou do favor divino.
- source_word: נִבְהָל
  choice: fiquei apavorado
  rationale: O nifal de בהל denota ficar alarmado, perturbado ou aterrorizado; 'apavorado' preserva a intensidade do verbo no contexto.
theological_decisions:
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o tetragrama יְהוָה; a transliteração conserva o nome pactual sem o substituir por um título.
- issue: Interpretação de 'meu monte'
  choice: Preservar 'meu monte' no texto principal
  alternative: minha prosperidade; minha fortaleza
  rationale: A expressão provavelmente simboliza segurança, estabilidade ou condição elevada, mas o hebraico mantém a imagem poética; traduzi-la literalmente evita resolver a ambiguidade interpretativa.
- issue: Intensidade de נִבְהָל
  choice: fiquei apavorado
  alternative: fiquei consternado; fiquei alarmado
  rationale: A forma pode abranger consternação e terror. A escolha conserva a reação forte provocada pelo ocultamento do rosto divino sem lhe acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de segunda pessoa coerentes ('teu', 'fizeste', 'escondeste'). A metáfora do monte e o idioma de esconder o rosto foram preservados.
