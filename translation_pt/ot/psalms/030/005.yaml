  terminology: «Ira», «favor», «vida», «choro» e «grito de alegria» correspondem adequadamente aos termos hebraicos e não introduzem interpretação doutrinária. «SENHOR» permanece apenas na nota de decisão contextual, sem necessidade de ser inserido no versículo, já que o hebraico usa sufixos pronominais.
