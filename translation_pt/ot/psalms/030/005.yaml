  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: pt
  text: Pois a sua ira dura apenas um instante; em seu favor há vida.[a] Ao entardecer, o choro passa a noite,[b] mas pela manhã vem um grito de alegria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu favor dura a vida inteira”. O hebraico é conciso: literalmente, “vida em seu favor”.'
    reason: ambiguity
  - marker: b
    text: O verbo hebraico descreve passar a noite como hóspede ou alojado.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um canto de alegria”. A palavra hebraica indica uma expressão vocal de júbilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta o contexto anterior e mantém o fluxo poético.
- source_word: רֶגַע בְּאַפּוֹ
  choice: a sua ira dura apenas um instante
  rationale: אַף designa idiomaticamente a ira, e רֶגַע indica duração muito breve. O verbo «dura» é suprido para formar uma oração natural em português sem alterar o sentido da frase nominal hebraica.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: em seu favor há vida
  rationale: Preserva חַיִּים como «vida» e רָצוֹן como «favor», sem decidir silenciosamente se a expressão também sugere que o favor dura a vida inteira.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: O choro passa a noite como hóspede
  rationale: Mantém a personificação e o sentido concreto de לין, hospedar-se ou passar a noite, enquanto «choro» corresponde ao substantivo בֶּכִי.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: mas pela manhã vem um grito de alegria
  rationale: A conjunção expressa contraste poético. רִנָּה é uma manifestação vocal de júbilo, como grito ou canto alegre; «vem» é acrescentado para dar naturalidade à frase nominal.
theological_decisions:
- issue: Referência dos sufixos pronominais em «sua ira» e «seu favor»
  choice: Os pronomes se referem ao SENHOR, conforme o contexto do salmo.
  alternative: Deixar o referente pronominal sem identificação contextual.
  rationale: A tradução conserva os pronomes do hebraico e a tensão entre a ira real e breve de Deus e o seu favor vivificante, sem acrescentar uma explicação doutrinária ao versículo.
- issue: Relação entre «vida» e «favor»
  choice: «Em seu favor há vida.»
  alternative: «Seu favor dura a vida inteira.»
  rationale: A formulação principal acompanha mais diretamente a sintaxe compacta do hebraico e evita resolver a ambiguidade entre vida como dádiva encontrada no favor divino e vida como indicação de duração.
translation_notes:
  register: Português moderno, claro e poético, com boa legibilidade brasileira e alcance internacional. A personificação do choro foi mantida, bem como o contraste entre noite e manhã. Evitou-se vocabulário excessivamente arcaico e preservou-se a concisão paralelística do hebraico.
