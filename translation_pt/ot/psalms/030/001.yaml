  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: pt
  text: Eu te exaltarei, ó Yahweh, porque me ergueste[a] e não permitiste que meus inimigos se alegrassem à minha custa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me içaste”; o verbo hebraico evoca literalmente puxar algo para cima, como de um poço.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Eu te exaltarei
  rationale: O verbo רום nesta forma expressa elevar ou exaltar em louvor. “Exaltarei” é natural no registro de adoração e conserva a imagem vertical.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente o motivo do louvor.
- source_word: דִלִּיתָנִי
  choice: me tiraste das profundezas
  rationale: דלה evoca puxar ou içar algo para cima, especialmente de um poço. A formulação comunica naturalmente em português tanto o resgate quanto a imagem concreta subjacente.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: e não deixaste que ... se alegrassem
  rationale: 'Expressa de modo idiomático o valor causativo do verbo: Yahweh não proporcionou aos inimigos ocasião para se alegrarem.'
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Correspondência direta e natural para o substantivo plural com sufixo possessivo.
- source_word: לִי
  choice: por minha causa
  rationale: Neste contexto, a preposição indica que o salmista seria a razão ou o objeto da alegria hostil dos inimigos, sem exigir que o texto afirme explicitamente triunfo “sobre” ele.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva esse nome por transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. A nota preserva a metáfora concreta do hebraico, enquanto o texto principal evita a expressão pouco idiomática “puxaste-me para cima”.
