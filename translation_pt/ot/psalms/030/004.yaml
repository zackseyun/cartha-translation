id: PSA.30.4
reference: Psalms 30:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: pt
  text: Cantem louvores a Yahweh, vocês, seus fiéis[a], e deem graças ao se lembrarem de sua santidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seus santos», «seus devotos» ou «os que lhe são leais».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «deem graças à memória de sua santidade»; ou: «deem graças à menção de sua santidade».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Cantem louvores
  rationale: O imperativo plural intensivo de זמר expressa canto ou música em louvor; a formulação preserva tanto o caráter musical quanto o sentido de adoração.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título.
- source_word: חֲסִידָיו
  choice: seus fiéis
  rationale: חסיד descreve pessoas marcadas por lealdade, fidelidade e devoção. «Seus fiéis» é claro e mantém o aspecto relacional sem restringir o termo a uma categoria eclesiástica.
- source_word: וְהוֹדוּ
  choice: e deem graças
  rationale: Neste contexto de louvor, o hifil de ידה significa agradecer ou louvar; «deem graças» preserva o valor mais específico e acompanha bem o paralelismo.
- source_word: לְזֵכֶר
  choice: ao se lembrarem de
  rationale: זכר pode indicar lembrança, memória ou menção. A construção verbal é natural em português e exprime gratidão suscitada pela recordação, enquanto a nota preserva as alternativas nominais.
- source_word: קָדְשׁוֹ
  choice: sua santidade
  rationale: O substantivo קדש com sufixo refere-se literalmente à santidade dele. Evita-se acrescentar «nome», palavra que não está expressa no hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. «Yahweh» procura representar diretamente o nome da aliança sem substituí-lo por um título.
- issue: Sentido de חֲסִידָיו
  choice: seus fiéis
  alternative: seus santos; seus devotos; os que lhe são leais
  rationale: O termo reúne ideias de devoção e lealdade vinculadas a חסד. «Fiéis» mantém essa amplitude e evita resolver a expressão como designação técnica de um grupo religioso.
- issue: Objeto ou ocasião da ação de graças em לְזֵכֶר קָדְשׁוֹ
  choice: ao se lembrarem de sua santidade
  alternative: à memória de sua santidade; à menção de sua santidade; à memória de seu santo nome
  rationale: A frase hebraica é condensada e pode apontar para lembrança ou menção. A tradução principal é idiomática, mas não acrescenta «nome»; a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. «Vocês» torna explícito o vocativo hebraico e evita que «seus fiéis» pareça outro complemento de «cantem louvores». A expressão principal referente à lembrança foi tornada idiomática, enquanto a nota conserva a concisão e a ambiguidade da formulação hebraica.
