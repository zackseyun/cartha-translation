  text: Transformaste o meu pranto em dança; desataste o meu pano de saco e me cingiste de alegria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: o meu lamento
  rationale: Expressa o pranto ou luto do salmista de modo natural, preservando o sentido do substantivo hebraico com sufixo de primeira pessoa.
- source_word: מָחוֹל
  choice: dança
  rationale: Equivalente direto e corrente para a dança celebrativa contrastada com o lamento.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: tiraste a minha roupa de luto
  rationale: O hebraico diz literalmente que Deus soltou ou desatou o pano de saco do salmista. 'Roupa de luto' comunica com clareza a função cultural do pano de saco, e 'tiraste' expressa naturalmente o resultado do ato.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: e me vestiste de alegria
  rationale: A imagem literal é cingir ou envolver alguém com alegria; 'vestiste' preserva a metáfora de troca de vestimenta e soa natural em português.
theological_decisions:
- issue: Valor enfático ou benefactivo de לִי
  choice: para mim
  alternative: omitir na tradução por considerá-lo parte da construção idiomática
  rationale: Mantém explícito o elemento hebraico e preserva a ênfase pessoal, embora a formulação seja algo marcada em português.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. 'Roupa de luto' torna compreensível o referente cultural de שַׂק sem perder a imagem de vestimenta.
