    rationale: O hebraico fala especificamente do pano de saco do salmista e do ato de o desatar/soltar. A revisão conserva tanto o referente concreto quanto a ação verbal.
  - severity: low
    issue: «me vestiste de alegria» para ותאזרני שמחה
    rationale: A ideia geral está correta, mas «cingiste de alegria» corresponde mais diretamente ao verbo de cingir e mantém a imagem poética.
