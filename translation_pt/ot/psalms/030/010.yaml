  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: pt
  text: Ouve, ó Yahweh, e sê favorável a mim[a]; ó Yahweh, sê o meu ajudador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tem misericórdia de mim”. O verbo hebraico pode expressar favor gracioso ou misericórdia numa súplica por ajuda divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouve
  rationale: Imperativo masculino singular de שׁמע. “Ouve” preserva a forma direta da súplica, sem explicitar o objeto que permanece implícito no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְחָנֵּנִי
  choice: e tem compaixão de mim
  rationale: O imperativo de חנן com sufixo de primeira pessoa pede favor benevolente. Em português corrente, “tem compaixão de mim” comunica naturalmente essa súplica; “concede-me favor” também é lexicalmente possível.
- source_word: הֱיֵה
  choice: sê
  rationale: 'O imperativo de היה funciona aqui como pedido predicativo: “sê”, não “torna-te”.'
- source_word: עֹזֵר לִי
  choice: o meu ajudador
  rationale: O particípio de עזר com לִי apresenta Yahweh pessoalmente como aquele que ajuda o suplicante. “O meu ajudador” conserva esse valor participial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem trocá-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e claro, com cadência de oração. “Ó” conserva a invocação direta; “sê” mantém concisão poética, e “ajudador” reflete o particípio hebraico de modo natural no registro bíblico.
