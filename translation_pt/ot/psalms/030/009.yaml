source:
  edition: WLC
  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: pt
  text: Que proveito há no meu sangue,[a] ao eu descer à cova?[b] Acaso o pó te louvará? Proclamará a tua fidelidade?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ganho há na minha morte?” Literalmente, o hebraico diz: “Que proveito há no meu sangue?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sepultura”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “verdade”. O termo hebraico pode significar “verdade” ou “fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Que proveito há
  rationale: Reproduz de modo natural e conciso a pergunta retórica hebraica acerca de que vantagem resultaria da morte do salmista.
- source_word: בְּדָמִי
  choice: no meu sangue
  rationale: Preserva a imagem concreta do hebraico, embora no contexto ela se refira à morte ou ao derramamento do sangue do salmista.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: ao eu descer à cova
  rationale: Expressa naturalmente em português a ação de descer, mantendo a metáfora espacial da aproximação da morte.
- source_word: שָׁחַת
  choice: cova
  rationale: Mantém a imagem poética de um lugar ao qual se desce; 'sepultura' é uma alternativa mais interpretativa.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Acaso o pó te louvará?
  rationale: Em contexto de culto dirigido a Deus, ידה é bem traduzido por 'louvar'; 'pó' conserva a metonímia da mortalidade humana.
- source_word: הֲיַגִּיד
  choice: Proclamará
  rationale: Verbo natural em registro poético e apropriado à declaração pública dos atributos de Deus.
- source_word: אֲמִתֶּךָ
  choice: a tua fidelidade
  rationale: אמת pode indicar verdade, firmeza ou fidelidade; aqui 'fidelidade' comunica bem seu sentido relacional sem eliminar a alternativa lexical.
theological_decisions:
- issue: Explicitar a morte ou preservar as imagens poéticas
  choice: Preservar no texto principal as imagens de 'sangue', 'cova' e 'pó'
  alternative: Traduzir interpretativamente como 'morte', 'sepultura' e 'os mortos'
  rationale: O hebraico argumenta por meio de imagens concretas da mortalidade. Mantê-las conserva a força e a tensão poéticas sem inserir a interpretação diretamente no texto.
- issue: Sentido de אֲמִתֶּךָ
  choice: fidelidade
  alternative: verdade
  rationale: O contexto de oração e louvor favorece a constância confiável de Deus, mas a nota preserva a amplitude semântica do termo.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A construção 'ao eu descer' evita associar equivocadamente 'meu sangue' à cova e mantém a primeira pessoa explícita. Os marcadores seguem cada expressão pertinente.
