  text: לְמַ֤עַן יְזַמֶּרְ/ךָ֣ כָ֭בוֹד וְ/לֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗/י לְ/עוֹלָ֥ם אוֹדֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: pt
  text: para que a minha glória cante louvores a ti e não fique em silêncio. Ó Yahweh, meu Deus,[a] eu te darei graças para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que todo o meu ser cante louvores a ti”. Em hebraico, “a minha glória”, expressão poética que pode se referir ao íntimo ou à língua do salmista.'
    reason: alternativa lexical para כָבוֹד
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz propósito ou resultado e preserva naturalmente a força final da expressão hebraica.
- source_word: יְזַמֶּרְךָ
  choice: cante louvores a ti
  rationale: O piel de זמר denota cantar louvores ou fazer música; a escolha mantém tanto o caráter musical quanto o sentido de louvor.
- source_word: כָבוֹד
  choice: a minha glória
  rationale: Mantém a metáfora literal do hebraico. Neste contexto poético, pode designar o íntimo, a língua ou todo o ser do salmista; a ambiguidade é explicada em nota.
- source_word: וְלֹא יִדֹּם
  choice: e não fique em silêncio
  rationale: דמם pode significar ficar calado ou imóvel; o contraste com cantar favorece o sentido de silêncio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz diretamente a forma possessiva, usada aqui em vocativo.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua de modo natural, digno e corrente em português.
- source_word: אוֹדֶךָּ
  choice: eu te darei graças
  rationale: O hifil de ידה, no contexto de ação de graças do salmo, comunica agradecer e confessar louvor; esta formulação preserva o valor de gratidão.
theological_decisions:
- issue: Sentido de כָבוֹד como sujeito do louvor
  choice: Manter a metáfora literal “a minha glória” no texto principal
  alternative: “todo o meu ser”, “a minha alma” ou “a minha língua”
  rationale: O substantivo hebraico é literalmente “glória/honra”, mas seu referente poético é discutido. A tradução conserva a tensão do original e registra a interpretação mais clara em nota, sem decidir silenciosamente entre as possibilidades.
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: A transliteração torna visível o nome pessoal encontrado no texto-fonte e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora poética do hebraico foram preservadas sem sacrificar a naturalidade.
