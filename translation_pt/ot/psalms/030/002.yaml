  text: Ó Yahweh[a], meu Deus, clamei a ti[b], e tu me curaste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”. Outras formas incluem “Javé” e “Jeová”.'
