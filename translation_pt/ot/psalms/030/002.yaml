lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino YHWH, distinguindo-o do título אֱלֹהַי e preservando o caráter pessoal da invocação.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: O substantivo com sufixo de primeira pessoa singular significa naturalmente “meu Deus” e integra o vocativo.
- source_word: שִׁוַּעְתִּי
  choice: clamei por socorro
  rationale: O verbo שׁוע expressa um clamor urgente por ajuda; a formulação explicita a força lexical sem acrescentar a natureza do perigo.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: A preposição אֶל com sufixo de segunda pessoa masculina singular indica a direção do clamor.
- source_word: וַתִּרְפָּאֵנִי
  choice: e tu me curaste
  rationale: Traduz diretamente רפא e mantém aberta a possibilidade de cura física ou de restauração/libertação em sentido mais amplo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome divino, não um título. “Yahweh” preserva essa distinção e evita substituir silenciosamente o nome por “Senhor”.
- issue: Alcance semântico da cura em רפא
  choice: tu me curaste
  alternative: tu me restauraste; fizeste-me sarar
  rationale: “Curaste” corresponde ao sentido lexical mais direto, sem decidir se o salmista fala de cura corporal ou, contextualmente, de restauração ou libertação mais abrangente.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe poética concisa. “Ó” marca a invocação; “a ti” mantém dignidade e naturalidade em registro bíblico amplamente compreensível.
