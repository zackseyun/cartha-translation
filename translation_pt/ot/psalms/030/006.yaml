base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: pt
  text: 'Quanto a mim, eu disse em minha tranquilidade[a]: “Jamais serei abalado.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em minha prosperidade”, “em meu sossego” ou “em minha segurança”. O termo hebraico pode indicar bem-estar tranquilo e seguro, não apenas prosperidade material.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Não serei abalado para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: A conjunção com o pronome independente dá destaque pessoal e pode marcar contraste; “Quanto a mim” reproduz essa ênfase com naturalidade em português.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: O qatal, neste contexto reflexivo, é adequadamente expresso pelo pretérito perfeito; o mais-que-perfeito é contextualmente possível, mas não exigido pela forma hebraica.
- source_word: בְשַׁלְוִי
  choice: em minha tranquilidade
  rationale: שַׁלְוָה designa sossego, segurança ou bem-estar tranquilo. “Tranquilidade” preserva a amplitude do termo sem restringi-lo à prosperidade material.
- source_word: בַּל ... לְעוֹלָם
  choice: jamais
  rationale: A partícula negativa poética, combinada com לְעוֹלָם, exprime negação enfática e duradoura; “jamais” reúne naturalmente ambas as forças em português.
- source_word: אֶמּוֹט
  choice: serei abalado
  rationale: O nifal de מוט descreve ser movido ou desestabilizado. “Ser abalado” conserva a metáfora de perda de estabilidade e é idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ênfase do pronome hebraico e conserva a metáfora de estabilidade, sem determinar se שַׁלְוָה se refere principalmente a prosperidade, sossego ou segurança.
