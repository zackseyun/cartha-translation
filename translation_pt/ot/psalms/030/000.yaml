  text: מִזְמ֡וֹר שִׁיר חֲנֻכַּ֖ת הַ/בַּ֣יִת לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/000.yaml
  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
translation:
  language: pt
  text: Salmo. Cântico para a dedicação da casa.[a] De Davi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do templo” ou “do palácio”; o hebraico diz simplesmente “da casa”.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica também pode ser entendida como “para Davi” ou “pertencente a Davi”.
    reason: source_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo consagrado e natural em português para esse gênero poético-musical, preservando sua função na superscrição.
- source_word: שִׁיר
  choice: Cântico
  rationale: Mantém explículo o segundo rótulo de gênero presente no hebraico, sem fundi-lo com מִזְמוֹר.
- source_word: חֲנֻכַּת
  choice: para a dedicação
  rationale: O substantivo em estado construto significa “dedicação”; a preposição “para” comunica naturalmente o uso ou a ocasião indicada pela superscrição.
- source_word: הַבַּיִת
  choice: da casa
  rationale: “Casa” preserva o sentido lexical amplo do hebraico e evita decidir se o referente é o templo, o palácio ou outra casa.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Fórmula tradicional e concisa nas superscrições dos salmos; conserva melhor que “escrito por Davi” a possível amplitude da relação indicada pela preposição hebraica.
theological_decisions:
- issue: Referente de “a casa” na superscrição
  choice: a casa
  alternative: o templo; o palácio de Davi
  rationale: O hebraico בַּיִת não identifica de modo inequívoco o edifício. A tradução mantém a abertura interpretativa do texto e registra possibilidades contextuais em nota.
- issue: Relação de Davi com o salmo
  choice: De Davi
  alternative: Para Davi; pertencente a Davi; por Davi
  rationale: A construção לְדָוִד pode indicar autoria, associação, pertença ou dedicação. “De Davi” mantém a formulação breve sem reduzir expressamente essa relação apenas à autoria.
translation_notes:
  register: Português moderno, claro e digno, com frases nominais breves próprias de uma superscrição. “Cântico” distingue שִׁיר de “salmo”, enquanto “casa” e “De Davi” preservam ambiguidades reais do hebraico.
