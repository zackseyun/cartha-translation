  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: pt
  text: Ela foi quebrada naquele dia[b]; assim, os aflitos do rebanho[a], que me observavam, reconheceram que aquela era a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pobres do rebanho” ou “os humildes do rebanho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi anulada” ou “foi revogada”, destacando o sentido de aliança da imagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: ela foi quebrada
  rationale: O passivo de פרר retoma a aliança simbolizada pelo cajado no contexto imediato. “Quebrada” mantém a imagem concreta e permite perceber também sua força pactual.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal profética natural e corrente em português.
- source_word: וַיֵּדְעוּ כֵן
  choice: reconheceram
  rationale: Neste contexto, כֵן liga o ato de quebrar à compreensão dos observadores. “Reconheceram” comunica que, por esse acontecimento, chegaram a saber a origem divina da palavra sem tornar a frase artificial em português.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: os aflitos do rebanho
  rationale: עֲנִיִּים pode designar pobres, aflitos ou humildes. “Aflitos” preserva a condição de opressão sem limitar o sentido à pobreza econômica.
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: que me observavam
  rationale: O particípio de שׁמר com o sufixo de objeto indica atenção continuada ao falante; “observavam” é natural e evita sugerir que o protegiam.
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: que aquela era a palavra de Yahweh
  rationale: A oração identifica a ação ou mensagem encenada como palavra de YHWH. “Aquela” retoma naturalmente o acontecimento no contexto, e “Yahweh” representa diretamente o nome divino.
theological_decisions:
- issue: Sentido pactual de וַתֻּפַר
  choice: foi quebrada
  alternative: foi anulada / foi revogada
  rationale: A tradução principal conserva a ação simbólica concreta associada ao cajado, enquanto a nota registra explicitamente a possível força jurídica e pactual do verbo.
- issue: Amplitude de עֲנִיֵּי הַצֹּאן
  choice: os aflitos do rebanho
  alternative: os pobres do rebanho / os humildes do rebanho
  rationale: O hebraico admite condição social, sofrimento e humildade; o texto principal não reduz a expressão a uma única dimensão, e a nota preserva as alternativas genuínas.
- issue: Representação do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome feminino “ela” retoma naturalmente “aliança” no versículo anterior. As notas preservam a ambiguidade lexical relevante sem sobrecarregar o texto principal.
