id: ZEC.11.2
reference: Zechariah 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: pt
  text: Lamenta, cipreste[a], pois o cedro caiu, porque os majestosos foram destruídos[b]. Lamentem, carvalhos de Basã, pois a floresta densa veio abaixo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abeto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os poderosos foram devastados”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica também pode significar “a floresta inacessível” ou “a floresta fortificada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: Lamenta / Lamentem
  rationale: Os imperativos de ילל convocam a um clamor de pesar ou alarme. “Lamenta/Lamentem” conserva o tom profético e a diferença de número entre o cipreste singular e os carvalhos plurais, em linguagem portuguesa natural e digna.
- source_word: בְּרוֹשׁ
  choice: cipreste
  rationale: O termo designa uma conífera e é tradicionalmente traduzido também por “abeto”. “Cipreste” é uma identificação lexical plausível e mantém o paralelismo arbóreo com o cedro e os carvalhos.
- source_word: כִּי
  choice: pois / porque
  rationale: As ocorrências introduzem a razão do lamento. A pequena variação estilística evita repetição pesada sem alterar a relação causal.
- source_word: נָפַל
  choice: caiu
  rationale: Reproduz diretamente o sentido do verbo sem explicitar que o cedro foi derrubado, causa apenas sugerida pela imagem.
- source_word: אֶרֶז
  choice: cedro
  rationale: Equivalente convencional e preciso para a árvore que, na poesia profética, evoca grandeza e força.
- source_word: אַדִּרִים
  choice: os majestosos
  rationale: 'Mantém o substantivo/adjetivo plural e sua ambiguidade: pode aludir às árvores imponentes e, metaforicamente, a pessoas ou poderes importantes, sem resolver a imagem no texto principal.'
- source_word: שֻׁדָּדוּ
  choice: foram destruídos
  rationale: A forma passiva comunica ruína violenta. “Destruídos” ajusta-se tanto à imagem das árvores quanto a uma possível referência metafórica, sem concretizar demais a ideia de saque.
- source_word: אַלּוֹנֵי בָשָׁן
  choice: carvalhos de Basã
  rationale: É a tradução convencional das árvores fortes e célebres de Basã; “terebintos” permanece uma possibilidade botânica, mas é menos reconhecível neste contexto.
- source_word: יָרַד
  choice: veio abaixo
  rationale: Expressa de modo idiomático o movimento de descer ou ruir, preservando a imagem do bosque abatido sem introduzir explicitamente um agente.
- source_word: יַעַר הַבָּצוּר
  choice: a floresta densa
  rationale: A expressão final é difícil. No contexto, “densa” transmite de modo natural a noção provável de uma mata cerrada e de difícil acesso; outras leituras são registradas em nota.
theological_decisions:
- issue: Se a imagem das árvores deve ser explicitada como referência a governantes ou poderes humanos
  choice: Conservar no texto principal a imagem das árvores e a expressão ambígua “os majestosos”
  alternative: Traduzir interpretativamente com “governantes”, “nobres” ou “poderosos”
  rationale: Embora as árvores provavelmente funcionem como metáfora de líderes ou grupos poderosos, o hebraico apresenta diretamente a cena arbórea. Preservá-la evita impor uma identificação teológica não expressa no versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Os imperativos mantêm a personificação poética das árvores; evitou-se explicitar a possível referência a governantes. “Veio abaixo” oferece uma formulação corrente sem acrescentar um agente causador.
