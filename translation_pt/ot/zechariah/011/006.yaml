revisions:
- from: Pois já não terei compaixão dos habitantes da terra[a] — declara Yahweh. Eis que entregarei as pessoas, cada uma nas mãos do seu próximo e nas mãos do seu rei[b]. Eles esmagarão a terra, e eu não livrarei das mãos deles[c].
  to: Pois não terei mais compaixão dos habitantes da terra[a] — declara Yahweh. Eis que entregarei as pessoas, cada uma nas mãos de seu próximo e nas mãos de seu rei[b]. Eles esmagarão a terra, e eu não os livrarei das mãos deles[c].
  rationale: A única alteração textual necessária é inserir «os» na cláusula final, para produzir português moderno gramatical e natural. Como essa inserção seleciona os habitantes como referente contextual, a nota c foi ajustada para declarar explicitamente que o hebraico não especifica o objeto e que «a terra» também é possível. As demais formulações preservam fielmente o sentido, o registro e a terminologia do texto hebraico.
