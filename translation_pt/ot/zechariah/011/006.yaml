  naturalness: «Eu não livrarei das mãos deles» é incompleta em português corrente, pois livrar normalmente requer objeto expresso neste contexto. «Eu não os livrarei das mãos deles» é gramatical, idiomático e mantém o registro profético.
  terminology: «Yahweh», «compaixão», «entregarei», «próximo», «rei» e «esmagarão» são escolhas apropriadas. «Terra» preserva a polissemia de הָאָרֶץ; a nota esclarece a possível leitura universal sem impor essa abrangência ao texto.
