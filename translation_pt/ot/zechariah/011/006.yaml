source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: pt
  text: Pois não terei mais compaixão dos habitantes da terra[a] — declara Yahweh. Eis que entregarei as pessoas, cada uma nas mãos de seu próximo e nas mãos de seu rei[b]. Eles esmagarão a terra, e eu não os livrarei das mãos deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos habitantes da terra” em sentido universal, caso הָאָרֶץ seja entendido como “terra” no sentido de mundo, e não como o território local.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o ser humano, cada um na mão de seu próximo e na mão de seu rei”; a expressão descreve cada pessoa sendo entregue ao poder de seu próximo e de seu rei.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico não explicita o objeto de “livrarei”. A tradução o entende como os habitantes; também pode referir-se à terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחְמוֹל
  choice: terei compaixão
  rationale: O verbo חמל pode expressar poupar ou mostrar compaixão. “Ter compaixão” preserva tanto a dimensão afetiva quanto a judicial e soa natural em português.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: habitantes da terra
  rationale: יֹשְׁבֵי é um particípio substantivado, “habitantes”. No contexto imediato, הָאָרֶץ aponta mais provavelmente para a terra ou território em julgamento, sem excluir lexicalmente “mundo/terra” em sentido universal.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e verte diretamente o nome divino יהוה como “Yahweh”.
- source_word: מַמְצִיא
  choice: entregarei
  rationale: O hifil de מצא tem aqui o sentido contextual de fazer alguém cair sob o poder de outro. “Entregarei” comunica de modo conciso essa ação judicial.
- source_word: הָאָדָם אִישׁ
  choice: as pessoas, cada uma
  rationale: A formulação combina o coletivo הָאָדָם com o distributivo אִישׁ. A tradução conserva ambos os aspectos em português natural, sem restringir indevidamente a referência a homens do sexo masculino.
- source_word: בְיַד
  choice: nas mãos de
  rationale: A expressão hebraica indica sujeição ao poder ou controle de alguém. O plural idiomático “nas mãos de” é a forma corrente em português e mantém a imagem corporal.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou amigo. “Próximo” é amplo e se ajusta ao contexto de desintegração social.
- source_word: מַלְכּוֹ
  choice: seu rei
  rationale: Mantém a especificidade política do substantivo hebraico e o vínculo distributivo expresso pelo sufixo.
- source_word: וְכִתְּתוּ
  choice: eles esmagarão
  rationale: כתת denota esmagar, despedaçar ou abater. “Esmagarão” preserva a violência da imagem e admite naturalmente “a terra” como objeto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém coerência com a ocorrência anterior e com o provável âmbito territorial da profecia.
- source_word: אַצִּיל מִיָּדָם
  choice: não livrarei das mãos deles
  rationale: נצל no hifil significa livrar ou resgatar. A omissão do objeto em português reproduz a falta de objeto explícito no hebraico, enquanto “das mãos deles” retoma a imagem de poder e controle.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Âmbito de הָאָרֶץ
  choice: terra, entendida primariamente como o território em vista
  alternative: terra/mundo em sentido universal
  rationale: O contexto imediato favorece o julgamento de uma população e de seu território, mas a nota preserva a possibilidade lexical mais ampla.
- issue: Referência de הָאָדָם אִישׁ
  choice: as pessoas, cada uma
  alternative: o homem, cada um
  rationale: A construção reúne uma designação humana coletiva e uma distribuição individual. A formulação escolhida conserva esses dois componentes sem resolver o coletivo como exclusivamente masculino.
- issue: Objeto implícito de אַצִּיל
  choice: manter o objeto não expresso
  alternative: não livrarei a terra; não os livrarei
  rationale: O hebraico não explicita se o objeto retomado é a terra, seus habitantes ou o conjunto em julgamento. A tradução preserva essa ambiguidade em vez de decidir silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conservam-se a fórmula profética, a imagem das mãos como poder e, na oração final, a ambiguidade do objeto hebraico.
