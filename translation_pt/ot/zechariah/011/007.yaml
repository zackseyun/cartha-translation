  text: וָֽ/אֶרְעֶה֙ אֶת צֹ֣אן הַֽ/הֲרֵגָ֔ה לָ/כֵ֖ן עֲנִיֵּ֣י הַ/צֹּ֑אן וָ/אֶקַּֽח לִ֞/י שְׁנֵ֣י מַקְל֗וֹת לְ/אַחַ֞ד קָרָ֤אתִי נֹ֨עַם֙ וּ/לְ/אַחַד֙ קָרָ֣אתִי חֹֽבְלִ֔ים וָ/אֶרְעֶ֖ה אֶת הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: pt
  text: Assim, apascentei o rebanho destinado ao abate, isto é, os aflitos do rebanho.[a] Então peguei para mim dois cajados; a um chamei Favor, e ao outro, União.[b] E apascentei o rebanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil. Também pode ser entendida como “portanto, os aflitos do rebanho” ou “em favor dos aflitos do rebanho”.
    reason: Preservar a ambiguidade sintática de לָכֵן עֲנִיֵּי הַצֹּאן.
  - marker: b
    text: O nome hebraico também pode ser traduzido como “Laços” ou “Vínculos”.
    reason: Registrar a amplitude semântica de חֹבְלִים e a base contextual da tradução “União”.
lexical_decisions:
- source_word: וָאֶרְעֶה
  choice: apascentei
  rationale: Expressa o ato de cuidar e conduzir um rebanho, preservando a metáfora pastoral e o aspecto verbal do hebraico.
- source_word: צֹאן הַהֲרֵגָה
  choice: rebanho destinado ao abate
  rationale: Comunica naturalmente que o rebanho está entregue à matança, sem sugerir que o pastor seja necessariamente quem o abaterá.
- source_word: נֹעַם
  choice: Favor
  rationale: O substantivo pode indicar agrado, benevolência ou graça; “Favor” funciona como nome próprio do cajado e preserva a ideia de benevolência.
- source_word: חֹבְלִים
  choice: União
  rationale: No contexto, o rompimento deste cajado representa o rompimento da fraternidade entre Judá e Israel (v. 14); “União” traduz essa função contextual, embora o termo também evoque laços ou vínculos.
theological_decisions:
- issue: Identidade dos “aflitos do rebanho”
  choice: “isto é, os aflitos do rebanho”
  alternative: “portanto, os aflitos do rebanho” ou “em favor dos aflitos do rebanho”
  rationale: A construção hebraica é difícil. A aposição adotada segue uma leitura contextual plausível, mas a nota preserva a incerteza textual e sintática sem definir um grupo teológico específico.
- issue: Sentido simbólico do segundo cajado
  choice: “União”
  alternative: “Laços” ou “Vínculos”
  rationale: A tradução reflete a explicação interna do símbolo no versículo 14 e não acrescenta uma identificação denominacional ou histórica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Apascentar” mantém o tom bíblico-pastoral sem soar excessivamente arcaico. Os nomes dos cajados recebem iniciais maiúsculas por funcionarem como nomes simbólicos.
