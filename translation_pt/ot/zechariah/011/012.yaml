base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: pt
  text: 'Então lhes disse: “Se for bom aos olhos de vocês, deem-me meu salário; mas, se não, abstenham-se.” E eles pesaram meu salário: trinta peças de prata[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “trinta de prata”; possivelmente, “trinta siclos de prata”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu lhes disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “lhes” representa אֲלֵיהֶם.
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: Se for bom aos olhos de vocês
  rationale: Preserva a imagem do idioma hebraico sem deixar de ser compreensível em português atual.
- source_word: הָבוּ שְׂכָרִי
  choice: deem-me o meu salário
  rationale: הָבוּ é o imperativo “deem”, e שְׂכָרִי designa a remuneração devida pelo serviço.
- source_word: וְאִם לֹא חֲדָלוּ
  choice: mas, se não, não o deem
  rationale: חדל significa cessar ou abster-se. A formulação explicita apenas o complemento já presente no contexto e comunica com naturalidade que eles poderiam deixar de pagar.
- source_word: וַיִּשְׁקְלוּ
  choice: eles pesaram
  rationale: Mantém a prática concreta de pesar a prata usada como pagamento no mundo antigo.
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: trinta peças de prata
  rationale: O hebraico diz literalmente “trinta de prata”, sem nomear a unidade. “Peças de prata” fornece em português o substantivo necessário sem especificar indevidamente “siclos”.
theological_decisions:
- issue: Unidade monetária na expressão do pagamento
  choice: trinta peças de prata
  alternative: trinta siclos de prata
  rationale: Embora “siclos” seja uma interpretação possível e a expressão tenha relevância em Mateus 26:15 e 27:9-10, o hebraico deste versículo não explicita a unidade. A tradução principal conserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem “bom aos olhos de vocês” foi mantida; a elipse de “não o deem” foi resolvida pelo contexto imediato sem acrescentar interpretação teológica. O marcador da nota foi colocado junto à expressão monetária a que a nota se refere.
