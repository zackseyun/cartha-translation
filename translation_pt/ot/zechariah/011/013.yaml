base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: pt
  text: 'Então Yahweh me disse: “Jogue isso ao oleiro — o magnífico preço pelo qual fui avaliado por eles.” Então peguei as trinta peças de prata e as joguei na Casa de Yahweh, ao oleiro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “oleiro”, nas duas ocorrências. Alguns propõem “tesouro” por causa do contexto difícil e do uso desta passagem no Novo Testamento, mas o Texto Massorético traz “oleiro”. A expressão “magnífico preço” é provavelmente irônica: ridiculariza a avaliação insultuosamente baixa de trinta peças de prata.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua ocorrência no hebraico.
- source_word: הַשְׁלִיכֵהוּ
  choice: Jogue isso
  rationale: O imperativo contém um sufixo masculino singular que, no contexto, retoma o pagamento ou preço; “isso” é natural em português e evita sugerir uma pessoa.
- source_word: הַיּוֹצֵר
  choice: ao oleiro
  rationale: O particípio substantivado de יצר normalmente designa o oleiro. Embora o contexto seja difícil e haja propostas como “tesouro”, mantém-se a leitura do Texto Massorético nas duas ocorrências.
- source_word: אֶדֶר הַיְקָר
  choice: o magnífico preço
  rationale: A expressão combina esplendor ou magnificência com valor e é provavelmente irônica. “Magnífico preço” conserva tanto o tom elevado quanto a mordacidade contextual.
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: pelo qual fui avaliado por eles
  rationale: Expressa naturalmente em português o sentido passivo/reflexivo da avaliação e identifica “eles” como seus agentes.
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: as trinta peças de prata
  rationale: Reproduz a expressão monetária sem acrescentar “siclos”, unidade que não aparece explicitamente neste versículo.
- source_word: בֵּית יְהוָה
  choice: Casa de Yahweh
  rationale: Mantém o hebraico “casa” em vez de explicitar interpretativamente “templo”.
- source_word: אֶל הַיּוֹצֵר
  choice: ao oleiro
  rationale: Preserva a repetição difícil e intencional da leitura massorética, sem substituí-la por uma conjectura textual.
theological_decisions:
- issue: A identidade do destinatário indicado por הַיּוֹצֵר e a força da expressão de avaliação
  choice: 'Manter “oleiro” nas duas ocorrências e traduzir a avaliação com ironia perceptível: “o magnífico preço pelo qual fui avaliado por eles”.'
  alternative: Adotar a conjectura “tesouro” ou achatar a expressão para “o preço pelo qual me avaliaram”.
  rationale: O Texto Massorético traz “oleiro” nas duas ocorrências. A dificuldade não justifica corrigir silenciosamente o texto, e a formulação elevada deve preservar a tensão irônica produzida pelo valor insultuosamente baixo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jogue” é corrente sem ser coloquial demais; “Casa de Yahweh” preserva a forma hebraica. A única nota reúne a dificuldade textual e a provável ironia, e seu marcador aparece no texto principal.
