  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: pt
  text: Ai do pastor inútil[a], que abandona o rebanho! Uma espada contra o seu braço e contra o seu olho direito! Seu braço há de secar completamente, e seu olho direito ficará completamente turvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastor-ídolo”. O termo hebraico pode significar algo sem valor, vazio ou semelhante a um ídolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética de denúncia e lamento; “Ai” preserva o tom solene e judicial em português.
- source_word: רֹעִי הָאֱלִיל
  choice: pastor inútil
  rationale: אֱלִיל pode designar aquilo que é vão, sem valor ou semelhante a um ídolo. No contexto, “inútil” expressa com naturalidade a incapacidade e a vacuidade desse líder, sem apagar a alternativa literal indicada em nota.
- source_word: עֹזְבִי הַצֹּאן
  choice: que abandona o rebanho
  rationale: O particípio caracteriza o pastor por abandonar o rebanho; a oração relativa reproduz essa força de modo corrente.
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: Uma espada contra o seu braço e contra o seu olho direito
  rationale: A frase hebraica não tem verbo expresso. A formulação nominal mantém a concisão e a força oracular sem transformar explicitamente a declaração em desejo ou ordem.
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: Seu braço há de secar completamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Há de secar completamente” comunica certeza enfática e preserva a imagem física de ressecamento ou atrofia.
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: seu olho direito ficará totalmente embaçado
  rationale: A construção intensiva indica perda severa de clareza visual. “Embaçado” preserva a ideia de obscurecimento sem afirmar cegueira total, que o hebraico não exige.
theological_decisions:
- issue: Sentido de אֱלִיל aplicado ao pastor
  choice: pastor inútil
  alternative: pastor-ídolo
  rationale: O contexto denuncia um líder que abandona o rebanho, favorecendo o sentido de inutilidade ou falta de valor. A tradução alternativa conserva em nota a possível ressonância idólatra ou de vacuidade, sem impor uma identificação doutrinária específica.
- issue: Natureza da declaração da espada
  choice: declaração nominal de juízo
  alternative: 'oração optativa: “Que a espada fira...”'
  rationale: Como o hebraico é uma oração sem verbo, a tradução evita decidir se a linha deve ser entendida estritamente como anúncio ou maldição, preservando sua tensão oracular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a metáfora pastoral, a concisão profética e as duas intensificações do hebraico, evitando interpretar “olho embaçado” como cegueira absoluta.
