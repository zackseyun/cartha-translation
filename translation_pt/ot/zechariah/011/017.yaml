  source_fidelity: A tradução reproduz bem a denúncia profética, o particípio caracterizador (“que abandona”), a construção nominal de juízo e as duas intensificações finais. Contudo, “olho ... embaçado” em português tende a descrever sobretudo a visão percebida, enquanto o hebraico diz que o próprio olho se tornará escuro/turvo. “Ficará completamente turvo” mantém a imagem e não força a ideia de cegueira total.
  naturalness: O texto é claro, solene e amplamente compreensível. “Seu olho direito ficará completamente turvo” é mais idiomático e preciso neste contexto do que “ficará totalmente embaçado”.
  terminology: “Ai”, “pastor inútil”, “rebanho”, “braço” e “olho direito” são escolhas adequadas. A nota preserva de modo útil a alternativa ligada a “ídolo”; “pastor-ídolo” deve permanecer como alternativa lexical, sem impor uma interpretação específica.
