  text: וָ/אֶקַּ֤ח אֶת מַקְלִ/י֙ אֶת נֹ֔עַם וָ/אֶגְדַּ֖ע אֹת֑/וֹ לְ/הָפֵיר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: pt
  text: Então peguei o meu cajado chamado Favor e o cortei ao meio, para romper a aliança que eu havia feito com todos os povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com todas as nações”. A palavra hebraica pode designar povos ou nações; o plural foi mantido no texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: o meu cajado
  rationale: מַקֵּל designa um cajado ou vara; “cajado” é natural no contexto da ação simbólica de um pastor.
- source_word: נֹעַם
  choice: chamado Favor
  rationale: Como nome simbólico do cajado, נֹעַם é traduzido pelo sentido. “Favor” comunica benevolência e agrado; “chamado” esclarece naturalmente em português que se trata do nome do cajado.
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: e o cortei ao meio
  rationale: גדע significa cortar ou decepar. No contexto, o cajado é seccionado como ato simbólico; “cortei ao meio” expressa isso de forma clara e idiomática.
- source_word: לְהָפֵיר
  choice: para romper
  rationale: Em contexto de aliança, הפר pode significar quebrar, anular ou invalidar. “Romper” preserva a força da imagem e combina naturalmente com “aliança” em português.
- source_word: בְּרִיתִי
  choice: a aliança
  rationale: 'בְּרִית é o termo hebraico habitual para uma relação pactual e é adequadamente traduzido por “aliança”. O possessivo é expresso na oração relativa: “que eu havia feito”.'
- source_word: כָּרַתִּי
  choice: eu havia feito
  rationale: כרת ברית é a expressão idiomática hebraica para “fazer uma aliança”. O mais-que-perfeito deixa claro que a aliança já existia antes de ser simbolicamente rompida.
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: O plural עַמִּים é mantido por “povos”, sem restringir o referente nem impor uma nuance exclusivamente geopolítica.
theological_decisions:
- issue: Alcance da aliança em “com todos os povos”
  choice: Manter a formulação ampla “todos os povos”.
  alternative: “todas as nações” ou uma identificação mais estreita com Israel ou com povos hostis.
  rationale: O hebraico não restringe explicitamente o referente neste versículo. A tradução conserva a amplitude e a tensão interpretativa do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cajado” preserva a imagem pastoril; “chamado Favor” torna natural o nome simbólico do objeto. O marcador da nota foi colocado junto de “povos”, termo ao qual a alternativa lexical se refere.
