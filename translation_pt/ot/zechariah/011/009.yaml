  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: pt
  text: 'Então eu disse: “Não pastorearei vocês. A que está morrendo, que morra; a que está perecendo, que pereça; e as que restarem devorem, cada uma, a carne da outra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרְעֶה
  choice: pastorearei
  rationale: O verbo רעה descreve a ação do pastor. “Pastorearei” preserva de modo conciso a metáfora central do capítulo, em vez de reduzi-la a alimentar ou levar ao pasto.
- source_word: הַמֵּתָה תָמוּת
  choice: A que está morrendo, que morra
  rationale: Mantém a construção enfática formada pelo particípio e pelo verbo finito, bem como o tom de abandono judicial, sem acrescentar uma causa específica para a morte.
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: a que está perecendo, que pereça
  rationale: Preserva a repetição hebraica e comunica destruição ou desaparecimento sem impor o sentido técnico de aniquilação.
- source_word: הַנִּשְׁאָרוֹת
  choice: as que restarem
  rationale: Expressa diretamente a ideia de permanecer ou ser deixado, mantendo a referência feminina às ovelhas do rebanho.
- source_word: תֹּאכַלְנָה
  choice: devorem
  rationale: Embora o sentido básico seja “comer”, o objeto “carne” e o contexto violento justificam “devorar”, que transmite naturalmente a brutalidade da imagem.
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: cada uma, a carne da outra
  rationale: A construção distributiva feminina corresponde às integrantes do rebanho. Esta formulação evita o enganoso literalismo “mulher... sua companheira” e preserva a violência recíproca da cena.
theological_decisions:
- issue: Preservação explícita da metáfora do pastor e do rebanho
  choice: Não pastorearei vocês
  alternative: Não alimentarei vocês
  rationale: A profecia encenada do capítulo depende da figura do pastor. “Pastorearei” mantém essa imagem sem restringir a ação ao fornecimento de alimento.
- issue: Grau de literalidade da imagem final de devorar carne
  choice: as que restarem devorem, cada uma, a carne da outra
  alternative: as sobreviventes se destruam mutuamente
  rationale: O hebraico apresenta uma imagem deliberadamente chocante de violência extrema. A tradução conserva a imagem concreta sem suavizá-la nem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A flexão feminina em “a que” e “as que” acompanha a imagem das ovelhas e permite reproduzir naturalmente a gramática do hebraico. A pontuação conserva a sequência breve e severa do pronunciamento.
