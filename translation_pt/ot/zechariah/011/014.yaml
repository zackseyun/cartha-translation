  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: pt
  text: Então cortei o meu segundo cajado, chamado União[a], para romper a fraternidade entre Judá e Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Laços»; o nome hebraico do segundo cajado evoca aquilo que liga ou mantém unido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: Então cortei
  rationale: O verbo גדע indica cortar ou decepar. No gesto simbólico com o cajado, «cortei» preserva a ação física deliberada sem acrescentar que ele foi feito em vários pedaços.
- source_word: מַקְלִי הַשֵּׁנִי
  choice: o meu segundo cajado
  rationale: מַקֵּל designa cajado ou vara, e הַשֵּׁנִי significa naturalmente «segundo», em sequência com os dois cajados do contexto.
- source_word: הַחֹבְלִים
  choice: União
  rationale: É o nome simbólico do segundo cajado. «União» comunica sua função no vínculo entre Judá e Israel, enquanto a nota preserva o sentido concreto de coisas que ligam ou mantêm unidas.
- source_word: לְהָפֵר
  choice: para romper
  rationale: הפר pode significar romper, invalidar ou desfazer. «Romper» combina com a relação fraterna mencionada e com o gesto simbólico de cortar o cajado.
- source_word: הָאַחֲוָה
  choice: a fraternidade
  rationale: אַחֲוָה expressa fraternidade ou vínculo entre irmãos. «Fraternidade» preserva a metáfora familiar e política sem reduzi-la à ideia genérica de unidade.
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: entre Judá e Israel
  rationale: A formulação direta conserva a distinção histórico-política do texto hebraico sem expansão interpretativa.
theological_decisions:
- issue: Tradução do nome simbólico הַחֹבְלִים
  choice: União
  alternative: Laços; Os que ligam
  rationale: O contexto apresenta o termo como nome de um cajado que simboliza o vínculo entre Judá e Israel. «União» torna o simbolismo claro, e a nota registra a imagem lexical concreta.
- issue: Tradução da metáfora familiar אַחֲוָה
  choice: fraternidade
  alternative: unidade; comunhão; vínculo entre irmãos
  rationale: O hebraico emprega uma metáfora explicitamente fraterna. «Fraternidade» conserva essa dimensão familiar sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha de perto o hebraico, mas evita rigidez; «chamado» explicita naturalmente que União é o nome do cajado.
