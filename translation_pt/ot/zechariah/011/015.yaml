  source_fidelity: 'A tradução representa adequadamente todos os elementos do hebraico: a progressão narrativa em “Então”, o nome divino “Javé”, o destinatário “me”, a repetição em “de novo”, o imperativo com a nuance pessoal de לְךָ em “para você”, o coletivo כְּלִי em “equipamento” e a qualificação “pastor insensato”. Não resolve a identidade simbólica do pastor além do que o versículo permite.'
