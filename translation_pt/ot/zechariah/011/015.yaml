  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י ע֣וֹד קַח לְ/ךָ֔ כְּלִ֖י רֹעֶ֥ה אֱוִלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: pt
  text: 'Então Javé me disse: “Tome de novo para você o equipamento[a] de um pastor insensato.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os utensílios” ou “os apetrechos”. O termo hebraico é amplo e se refere aos objetos ou ao equipamento associados a um pastor.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלָי
  choice: me disse
  rationale: A construção portuguesa com pronome oblíquo comunica naturalmente “disse a mim”.
- source_word: עוֹד
  choice: de novo
  rationale: Neste contexto de ordem, indica repetição ou uma ação simbólica adicional.
- source_word: קַח לְךָ
  choice: Tome ... para você
  rationale: “Tome” traduz o imperativo, e “para você” conserva a participação pessoal indicada por לְךָ.
- source_word: כְּלִי
  choice: equipamento
  rationale: O termo é amplo e pode designar objeto, utensílio ou conjunto de apetrechos; “equipamento” funciona como coletivo natural no contexto pastoril.
- source_word: רֹעֶה
  choice: pastor
  rationale: É a designação comum e contextualmente adequada para quem cuida de um rebanho.
- source_word: אֱוִלִי
  choice: insensato
  rationale: Expressa falta de juízo, inclusive em sentido moral, sem ampliar o termo para “inútil” ou “perverso”.
theological_decisions:
- issue: Identidade simbólica do pastor
  choice: Manter a descrição genérica “um pastor insensato”.
  alternative: Identificá-lo como um governante histórico específico, a liderança corrupta de Israel em geral ou uma figura escatológica.
  rationale: O versículo não identifica mais precisamente a figura; a tradução preserva a abertura interpretativa do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Javé” preserva o nome divino; “equipamento” é usado coletivamente, e a nota registra alternativas possíveis.
