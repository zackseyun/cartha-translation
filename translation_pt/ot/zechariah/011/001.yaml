    text: 'Ou: “Abre os teus portões, ó Líbano, e o fogo consumirá os teus cedros.”'
    reason: Alternativa lexical para “portas”; “portões” é possível no contexto, embora o sentido básico de דלת seja “porta”.
  revision_rationale: A revisão substitui a construção final “para que” por uma coordenação preditiva/resultativa mais próxima da sequência hebraica. Também emprega os possessivos “tuas/teus” para manter clara a personificação do Líbano e evitar ambiguidade referencial. A nota conserva somente a alternativa lexical pertinente, sem resolver além do necessário a imagem profética.
