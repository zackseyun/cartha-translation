  text: פְּתַ֥ח לְבָנ֖וֹן דְּלָתֶ֑י/ךָ וְ/תֹאכַ֥ל אֵ֖שׁ בַּ/אֲרָזֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: pt
  text: Abre as tuas portas, ó Líbano, e o fogo consumirá os teus cedros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abre os teus portões, ó Líbano, e o fogo consumirá os teus cedros.”'
    reason: Alternativa lexical para “portas”; “portões” é possível no contexto, embora o sentido básico de דלת seja “porta”.
lexical_decisions:
- source_word: פְּתַח
  choice: Abra
  rationale: Imperativo masculino singular de פתח, dirigido ao Líbano personificado. “Abra” é direto, natural e não amplia indevidamente o hebraico.
- source_word: לְבָנוֹן
  choice: ó Líbano
  rationale: Nome próprio usado como vocativo e personificado. A partícula “ó” explicita de modo digno e natural o chamamento direto.
- source_word: דְּלָתֶיךָ
  choice: as suas portas
  rationale: דלת designa normalmente porta ou folha de porta. “Portas” preserva a imagem concreta; “portões” permanece uma alternativa contextual possível.
- source_word: וְתֹאכַל
  choice: para que ... consuma
  rationale: O imperfeito qal após o imperativo pode indicar propósito ou resultado. Esta construção preserva essa relação sem eliminar a possível leitura coordenada e profética.
- source_word: אֵשׁ
  choice: o fogo
  rationale: Equivalente lexical direto e natural de אֵשׁ.
- source_word: בַּאֲרָזֶיךָ
  choice: os seus cedros
  rationale: Embora a preposição ב possa ser entendida locativamente, o verbo אכל com fogo comunica de modo idiomático que os cedros são consumidos. O sufixo possessivo é preservado.
theological_decisions:
- issue: Personificação e imagem profética
  choice: O Líbano é interpelado diretamente como terra ou região florestal personificada, cujas portas se abrem ao fogo destruidor.
  alternative: A referência pode evocar literalmente passagens ou entradas do Líbano, ou simbolicamente poderes políticos associados à região.
  rationale: A tradução mantém a imagem poética e não determina qual seja o referente simbólico mais amplo.
- issue: Relação entre o imperativo e a ação do fogo
  choice: “para que o fogo consuma”
  alternative: “e o fogo consumirá”
  rationale: A sequência hebraica admite nuance de propósito ou resultado, bem como uma coordenação com força preditiva. A leitura principal segue a nuance final/resultativa, enquanto a nota conserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O vocativo “ó Líbano” preserva a personificação profética; a construção evita especificar indevidamente o referente simbólico.
