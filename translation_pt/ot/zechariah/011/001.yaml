revisions:
- from: Abra as suas portas, ó Líbano, para que o fogo consuma os seus cedros.[a]
  to: Abre as tuas portas, ó Líbano, e o fogo consumirá os teus cedros.[a]
  rationale: A revisão substitui a construção final “para que” por uma coordenação preditiva/resultativa mais próxima da sequência hebraica. Também emprega os possessivos “tuas/teus” para manter clara a personificação do Líbano e evitar ambiguidade referencial. A nota conserva somente a alternativa lexical pertinente, sem resolver além do necessário a imagem profética.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente o imperativo dirigido ao Líbano personificado, a imagem das portas e dos cedros, e a identificação do fogo como agente destruidor. Contudo, “para que” introduz uma finalidade explícita que o hebraico não exige; a sequência imperativo + waw com imperfeito é mais seguramente reproduzida em português como consequência ou anúncio: “e o fogo consumirá”.'
  naturalness: O texto é claro e digno, mas “os seus cedros” após “o fogo” pode criar uma ambiguidade momentânea de posse em português. O uso coerente de “tuas/teus” com o vocativo poético elimina essa ambiguidade e permanece natural em registro bíblico moderno.
  terminology: “Líbano”, “portas”, “fogo” e “cedros” são escolhas adequadas. “Portões” deve permanecer apenas como alternativa em nota, pois דלת designa mais diretamente portas. A nota deve refletir a alternativa coordenada/preditiva sem apresentar a leitura principal como finalidade.
  issues:
  - severity: medium
    issue: “para que o fogo consuma” torna a relação em finalidade.
    rationale: O hebraico וְתֹאכַל após o imperativo pode ter efeito consecutivo/resultativo ou preditivo; “para que” pode sugerir que abrir as portas tem por objetivo causar o incêndio. “E o fogo consumirá” preserva melhor a coordenação e a força profética, sem excluir o resultado.
  - severity: low
    issue: Possível ambiguidade em “o fogo consuma os seus cedros”.
    rationale: Depois de “o fogo”, “seus cedros” pode ser momentaneamente associado ao fogo. “Teus cedros” retoma inequivocamente o Líbano interpelado.
  revised_text: Abre as tuas portas, ó Líbano, e o fogo consumirá os teus cedros.[a]
  revised_footnotes:
