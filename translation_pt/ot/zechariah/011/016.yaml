  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: pt
  text: Pois eis que estou levantando na terra um pastor que não cuidará das que estão perecendo[b], não buscará o jovem[a], não curará a que está ferida, nem sustentará a que está de pé[c]; antes, comerá a carne das que estão gordas e lhes arrancará os cascos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o jovem”. Em razão do contexto pastoril, também se entende como “a ovelha desgarrada” ou como um membro jovem e vulnerável do rebanho.
    reason: lexical_alternative
  - marker: b
    text: Ou “das que estão desaparecendo”, “das perdidas” ou “das que estão sendo destruídas”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a que está de pé”; no contexto, pode referir-se à que está firme ou saudável.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: estou levantando
  rationale: O hifil de קום indica fazer surgir ou estabelecer. “Estou levantando” conserva a ação divina e não especifica uma nomeação formal.
- source_word: רֹעֶה
  choice: um pastor
  rationale: É o termo comum para quem pastoreia e mantém tanto a imagem do rebanho quanto sua possível dimensão de liderança.
- source_word: הַנִּכְחָדוֹת
  choice: as que estão perecendo
  rationale: A forma feminina plural descreve as que desaparecem ou caminham para a destruição. A formulação preserva o processo sem decidir entre “perdidas” e “destruídas”.
- source_word: יִפְקֹד
  choice: cuidará
  rationale: Neste contexto pastoril, פקד expressa voltar a atenção para alguém e cuidar dele. “Cuidará” é natural em português e mantém o contraste com a negligência do pastor.
- source_word: הַנַּעַר
  choice: a ovelha jovem
  rationale: A forma vocalizada significa normalmente “o jovem” ou “a jovem”. A explicitação de “ovelha” decorre do contexto do rebanho; a interpretação contextual “desgarrada” é mantida em nota, sem substituir silenciosamente o sentido lexical.
- source_word: יְבַקֵּשׁ
  choice: buscará
  rationale: בקש significa buscar ou procurar, adequando-se diretamente à ação esperada de um pastor.
- source_word: הַנִּשְׁבֶּרֶת
  choice: a que está ferida
  rationale: O particípio passivo de שבר é literalmente “a quebrada”. Em relação a um animal, “ferida” comunica naturalmente a condição física sem eliminar a imagem de algo quebrado.
- source_word: יְרַפֵּא
  choice: curará
  rationale: רפא significa curar. A tradução evita acrescentar a imagem de enfaixar, que não aparece neste versículo.
- source_word: הַנִּצָּבָה
  choice: a que ainda está de pé
  rationale: A expressão conserva o sentido concreto de נצב, “estar de pé”. “Ainda” torna clara em português a ideia contextual de uma ovelha que permanece em pé, sem convertê-la categoricamente em “saudável”.
- source_word: יְכַלְכֵּל
  choice: sustentará
  rationale: כלכל pode significar sustentar, manter ou prover. “Sustentará” preserva uma abrangência maior do que apenas alimentar.
- source_word: הַבְּרִיאָה
  choice: a que está gorda
  rationale: בריא pode denotar alguém gordo, saudável ou bem alimentado. Na imagem predatória de consumir a carne, “gorda” expressa diretamente o alvo escolhido pelo mau pastor.
- source_word: פַרְסֵיהֶן יְפָרֵק
  choice: arrancará os cascos delas
  rationale: פרסה designa o casco, e פרק comunica separar, despedaçar ou arrancar. A tradução retém a violência concreta da cena e o pronome feminino plural do hebraico.
theological_decisions:
- issue: Identidade do pastor
  choice: Manter apenas “um pastor”, sem identificar a figura histórica ou escatologicamente.
  alternative: “um pastor mau”, “um pastor inútil” ou a identificação com uma figura específica.
  rationale: O próprio versículo caracteriza o pastor por seus atos cruéis, mas não lhe dá aqui um título qualificativo nem identifica uma pessoa específica. A tradução preserva essa abertura profética.
- issue: Ação divina ao levantar o pastor
  choice: Traduzir diretamente “estou levantando”, preservando a agência divina declarada.
  alternative: Atenuar para “permitirei que surja” ou especificar que Deus o nomeia como governante.
  rationale: O texto atribui a ação a Deus, mas não explica neste versículo a relação entre juízo, permissão e responsabilidade do pastor. A tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela das omissões do pastor foi preservada, e o ponto e vírgula destaca a passagem da negligência para a violência ativa. As notas ficam junto aos termos a que efetivamente se referem.
