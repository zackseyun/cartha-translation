reference: Zechariah 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
translation:
  language: pt
  text: Assim, removi[a] os três pastores[c] em um só mês. Minha alma se impacientou com eles[b], e a alma deles também sentiu repulsa por mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiz desaparecer” ou “eliminei”. O verbo hebraico pode indicar que eles foram removidos ou eliminados.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “minha alma se impacientou” traduz um idioma hebraico que comunica profunda impaciência, enfado ou aversão.
    reason: lexical_alternative
  - marker: c
    text: O texto não identifica os “três pastores”; há diversas propostas de interpretação.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַכְחִד
  choice: removi
  rationale: No hifil, כחד pode indicar fazer desaparecer, remover ou eliminar. “Removi” expressa uma ação decisiva sem determinar se os pastores foram mortos, depostos ou eliminados de outra forma.
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: os três pastores
  rationale: Mantém diretamente a metáfora central do capítulo e não transforma os pastores em “líderes” no texto principal.
- source_word: בְּיֶרַח אֶחָד
  choice: em um só mês
  rationale: Reproduz o período de um mês e usa “só” para comunicar naturalmente a concentração temporal da ação.
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: Minha alma se impacientou com eles
  rationale: A expressão idiomática קצר נפש comunica perda de paciência, profundo enfado ou aversão. A formulação conserva “minha alma” e torna o sentido compreensível em português.
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: e a alma deles também sentiu repulsa por mim
  rationale: בחלה expressa forte repulsa ou aversão. A tradução preserva o paralelismo entre “minha alma” e “a alma deles”, além da intensidade do verbo.
theological_decisions:
- issue: Identidade dos “três pastores”
  choice: Manter “os três pastores” sem identificá-los.
  alternative: Entendê-los como três governantes históricos específicos, três classes de líderes ou uma representação simbólica da liderança corrupta.
  rationale: O texto hebraico não identifica os pastores. Especificar quem são resolveria uma ambiguidade que o próprio versículo preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a metáfora dos pastores, o paralelismo entre as duas “almas” e as ambiguidades lexical e histórica do hebraico.
