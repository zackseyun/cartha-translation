base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: pt
  text: 'cujos compradores as abatem e não são considerados culpados[a], e cujos vendedores dizem: “Bendito seja Yahweh, pois fiquei rico”; e seus pastores não têm compaixão por elas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e não incorrem em culpa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não as poupam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֵיהֶן
  choice: compradores
  rationale: Preserva a linguagem comercial de קנה e o paralelismo com “vendedores”, sem enfraquecê-la com “donos”.
- source_word: יַהֲרְגֻן
  choice: as abatem
  rationale: No contexto do rebanho, “abater” expressa naturalmente a morte dos animais e conserva a brutalidade da imagem profética.
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: e não são considerados culpados
  rationale: אשם pode indicar incorrer em culpa ou ser declarado/considerado culpado. A formulação mantém a ideia de ausência de responsabilização sem reduzir o sentido apenas à falta de punição.
- source_word: וּמֹכְרֵיהֶן יֹאמַר
  choice: seus vendedores dizem
  rationale: Embora o verbo esteja formalmente no singular, o particípio possessivo é plural; o português regulariza a concordância para transmitir o sentido coletivo com naturalidade.
- source_word: וָאֶעְשִׁר
  choice: pois fiquei rico
  rationale: Expressa de modo atual e conciso o resultado de enriquecer indicado pela forma verbal, preservando o tom de autossatisfação.
- source_word: וְרֹעֵיהֶם
  choice: e seus pastores
  rationale: Mantém a metáfora do pastoreio e sua ressonância profética, sem interpretá-la antecipadamente como “líderes” nem importar um cargo eclesiástico posterior.
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: não têm compaixão delas
  rationale: Comunica o sentido relacional de חמל, que pode envolver ter piedade ou poupar; a alternativa mais concreta é preservada em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino e segue a orientação do projeto sem substituí-lo por um título.
- issue: Metáfora de liderança em רֹעִים
  choice: pastores
  alternative: líderes; os que cuidam delas
  rationale: A tradução conserva a imagem profética dos pastores infiéis e evita resolver no texto a identidade precisa dos dirigentes representados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O fragmento relativo “cujos” conserva sua ligação com o rebanho mencionado no contexto anterior. Os pronomes femininos retomam as ovelhas implícitas na imagem. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
