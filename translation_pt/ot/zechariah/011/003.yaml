  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: pt
  text: Ouve-se o lamento dos pastores, pois o esplendor deles[a] foi devastado; ouve-se o rugido dos leões jovens, pois a majestade do Jordão[b] foi devastada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a magnificência deles». O termo hebraico também pode designar uma veste imponente e talvez aluda concretamente àquilo que os adornava.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o orgulho do Jordão». A expressão pode referir-se concretamente à vegetação exuberante e aos densos matagais das margens do Jordão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: Ouve-se
  rationale: קוֹל introduz, em cada metade do verso, um som audível. A construção impessoal «Ouve-se» reproduz com naturalidade em português a apresentação vívida do lamento e do rugido.
- source_word: יִֽלְלַ֣ת
  choice: o lamento
  rationale: O termo derivado de ילל denota um grito de dor ou lamentação. «Lamento» é natural para os pastores e mantém o tom poético.
- source_word: הָרֹעִ֔ים
  choice: dos pastores
  rationale: Preserva a imagem lexical de pastores sem explicitar possíveis referentes simbólicos, como governantes ou líderes.
- source_word: כִּ֥י
  choice: pois
  rationale: Introduz a causa do lamento e do rugido, conservando de modo conciso a relação lógica e o registro poético.
- source_word: שֻׁדְּדָ֖ה / שֻׁדַּ֖ד
  choice: foi devastado / foi devastada
  rationale: As duas formas vêm de שׁדד, que pode significar devastar, arruinar ou despojar. «Foi devastado» comunica perda severa e preserva a repetição verbal e o paralelismo.
- source_word: אַדַּרְתָּ֑ם
  choice: o esplendor deles
  rationale: אַדֶּרֶת pode indicar magnificência ou uma veste imponente. «Esplendor» conserva o sentido elevado sem decidir se há uma alusão concreta àquilo que os adornava.
- source_word: שַׁאֲגַ֣ת
  choice: o rugido
  rationale: Designa propriamente o rugido de um leão e forma um paralelo sonoro claro com «o lamento».
- source_word: כְּפִירִ֔ים
  choice: dos leões novos
  rationale: כְּפִיר designa leões jovens e vigorosos. «Leões novos» é claro e evita a ideia de filhotes ainda indefesos.
- source_word: גְּא֥וֹן
  choice: a majestade
  rationale: גָּאוֹן pode significar majestade, exaltação ou orgulho. «Majestade» preserva a grandeza poética sem introduzir necessariamente uma censura moral.
- source_word: הַיַּרְדֵּֽן
  choice: do Jordão
  rationale: Forma portuguesa consagrada do nome do rio; o acréscimo de «rio» não é necessário neste contexto poético.
theological_decisions:
- issue: Identidade simbólica dos pastores e dos leões novos
  choice: Manter as imagens literais no texto principal
  alternative: Explicitar os pastores como líderes e os leões novos como governantes ou opressores
  rationale: O hebraico não identifica expressamente os referentes metafóricos. A tradução preserva a imagem e a tensão profética sem impor uma interpretação.
- issue: Sentido de גְּאוֹן הַיַּרְדֵּן
  choice: a majestade do Jordão
  alternative: o orgulho do Jordão; a mata exuberante do Jordão
  rationale: A formulação escolhida traduz o valor lexical de grandeza ou majestade e conserva a expressão figurada. A possível referência concreta à vegetação densa das margens é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «Ouve-se» e «foi devastado» conserva o paralelismo enfático do hebraico; o ponto e vírgula liga as duas imagens sem apagar sua correspondência poética.
