  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: pt
  text: 'Assim diz Yahweh, meu Deus: “Pastoreie o rebanho para o abate[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “o rebanho do abate”; ou “o rebanho destinado ao abate”.
    reason: A construção nominal hebraica pode indicar o rebanho associado ao abate sem explicitar, na própria expressão, a relação exata. A alternativa registra a interpretação contextual de que ele está destinado ao abate.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Expressão profética convencional que introduz uma declaração divina; o presente comunica naturalmente a autoridade contínua da proclamação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Preserva o sufixo hebraico de primeira pessoa do singular e a relação do profeta com Deus.
- source_word: רְעֵה
  choice: Pastoreie
  rationale: O imperativo singular de רעה retém a imagem verbal do pastor, central ao contexto, e soa natural no português moderno.
- source_word: צֹאן
  choice: rebanho
  rationale: Traduz naturalmente o substantivo coletivo referente ao conjunto de ovelhas.
- source_word: הַהֲרֵגָה
  choice: destinado ao abate
  rationale: Comunica o sentido contextual de um rebanho cuja sorte é o abate, sem tornar o pastor o agente que necessariamente o conduz para matar; a formulação mais literal é preservada em nota.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação do falante em אֱלֹהָי
  choice: meu Deus
  alternative: Deus; seu Deus
  rationale: O sufixo é inequivocamente de primeira pessoa singular, apresentando o profeta como aquele que recebe e relata a ordem de seu Deus.
- issue: Sentido da expressão צֹאן הַהֲרֵגָה
  choice: rebanho destinado ao abate
  alternative: rebanho para o abate; rebanho do abate
  rationale: A relação nominal hebraica indica um rebanho associado ao abate e, no contexto, destinado a ele. A tradução principal explicita esse sentido provável, enquanto a nota conserva a forma mais literal e sua concisão ambígua.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Pastoreie” preserva a metáfora e funciona como imperativo dirigido a uma só pessoa. Mantém-se “Yahweh” como nome próprio, e a nota registra a ambiguidade lexical sem sobrecarregar o texto principal.
