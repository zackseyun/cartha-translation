  source_fidelity: 'A tradução preserva com precisão a progressão do hebraico: todas as panelas em Jerusalém e Judá serão santas/consagradas ao SENHOR dos Exércitos; os sacrificantes virão, tomarão dentre elas e cozinharão nelas; e não haverá mais cananeu na casa do SENHOR naquele dia. “Algumas delas” explicita de modo legítimo o partitivo implícito em מֵהֶם, sem alterar o referente. “Cozinharão” é uma opção adequada para ובשלו.'
