  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: pt
  text: E todas as panelas em Jerusalém e em Judá serão santas ao SENHOR dos Exércitos. Todos os que oferecerem sacrifícios virão, pegarão algumas delas e cozinharão nelas. Naquele dia, já não haverá cananeu[a] na casa do SENHOR dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comerciante” ou “negociante”; o termo hebraico pode ter esse sentido em alguns contextos.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר
  choice: panela
  rationale: Designa um recipiente usado para cozinhar ou ferver; “panela” é natural em português e se ajusta ao verbo seguinte.
- source_word: קֹדֶשׁ
  choice: santas
  rationale: Expressa que as panelas estarão consagradas, preservando a força cultual e teológica do hebraico.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Verte o nome divino segundo a convenção editorial e mantém o título profético צְבָאוֹת de modo reconhecível.
- source_word: הַזֹּבְחִים
  choice: os que oferecerem sacrifícios
  rationale: O particípio substantivado se refere às pessoas que realizam sacrifícios; esta formulação é idiomática e clara.
- source_word: מֵהֶם
  choice: algumas delas
  rationale: Indica que os adoradores tomarão panelas dentre o conjunto mencionado; o feminino retoma “panelas”.
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: e cozinharão nelas
  rationale: O verbo pode significar cozinhar ou ferver. “Cozinharão” soa natural sem acrescentar um objeto que não aparece no hebraico.
- source_word: כְנַעֲנִי
  choice: cananeu
  rationale: Este é o sentido lexical primário e preserva a imagem contundente e sua ressonância canônica; o possível sentido comercial é registrado em nota.
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: na casa do SENHOR dos Exércitos
  rationale: “Casa” corresponde diretamente ao hebraico e conserva a maneira bíblica de designar o templo sem explicitação interpretativa.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É uma formulação profética consagrada e idiomática em português.
theological_decisions:
- issue: Sentido de כְנַעֲנִי na oração final
  choice: Manter “cananeu” no texto principal.
  alternative: “comerciante” ou “negociante”
  rationale: O termo hebraico normalmente designa um cananeu, mas em certos contextos também pode designar um comerciante. O texto principal preserva a imagem étnica e sua tensão teológica, enquanto a nota mantém acessível a leitura comercial plausível, especialmente no contexto do templo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “SENHOR dos Exércitos” e a expressão “casa do SENHOR” preservam o registro profético e cultual. A nota foi ligada diretamente a “cananeu”, termo ao qual a alternativa lexical se refere.
