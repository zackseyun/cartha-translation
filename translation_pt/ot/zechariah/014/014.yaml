source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: pt
  text: 'Também Judá lutará em Jerusalém[a], e serão reunidas as riquezas de todas as nações ao redor: ouro, prata e roupas em enorme abundância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Judá também lutará contra Jerusalém”. A preposição hebraica normalmente significa “em”, mas alguns entendem a expressão, à luz do contexto, como indicação de oposição.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: O advérbio preserva naturalmente a força aditiva e enfática da conjunção com a partícula גם.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo ou território.
- source_word: תִּלָּחֵם
  choice: lutará
  rationale: O nifal de לחם indica entrar em combate; «lutará» é claro, atual e não especifica além do hebraico a forma da batalha.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição ב é normalmente locativa, com o sentido de «em». A leitura contextual «contra Jerusalém» é mantida em nota.
- source_word: וְאֻסַּף
  choice: serão reunidas
  rationale: A forma passiva na sequência profética tem valor futuro. A concordância no plural com «riquezas» produz português natural sem alterar o sentido coletivo do hebraico.
- source_word: חֵיל
  choice: as riquezas
  rationale: Embora חֵיל possa significar força, exército ou bens, a enumeração de ouro, prata e roupas determina aqui o sentido material.
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: de todas as nações ao redor
  rationale: A expressão conserva tanto a totalidade quanto a relação espacial, em linguagem portuguesa corrente.
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: ouro, prata e roupas
  rationale: Tradução direta da lista de bens; «roupas» é mais corrente e amplamente compreensível que «vestes» ou «vestimentas».
- source_word: לָרֹב מְאֹד
  choice: em enorme abundância
  rationale: A formulação exprime a grande quantidade e a intensificação de מְאֹד de modo natural e digno.
theological_decisions:
- issue: Se בִּירוּשָׁלִָם indica que Judá luta em Jerusalém ou contra Jerusalém
  choice: Judá lutará em Jerusalém
  alternative: Judá lutará contra Jerusalém
  rationale: A preposição hebraica ב tem, em primeiro lugar, sentido locativo («em»). Como o contexto mais amplo permite que alguns entendam oposição, essa possibilidade é registrada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A ordem «Também Judá» conserva a ênfase aditiva inicial do hebraico.
