  text: וְ/יָ֣שְׁבוּ בָ֔/הּ וְ/חֵ֖רֶם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/יָשְׁבָ֥ה יְרוּשָׁלִַ֖ם לָ/בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
translation:
  language: pt
  text: E habitarão nela, e já não haverá nada destinado à destruição[a]; Jerusalém habitará em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “já não haverá maldição alguma”. O termo hebraico também pode se referir a algo colocado sob interdição ou destinado à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: E habitarão nela
  rationale: Mantém o sujeito implícito da forma verbal hebraica na terceira pessoa do plural, sem acrescentar “pessoas”, e preserva o sentido de residência duradoura de ישׁב.
- source_word: חֵרֶם
  choice: nada destinado à destruição
  rationale: חֵרֶם pode indicar aquilo que foi posto sob interdição ou destinado à destruição. A formulação comunica esse peso judicial sem reduzi-lo necessariamente a uma “maldição” abstrata.
- source_word: לֹא יִהְיֶה עוֹד
  choice: já não haverá
  rationale: Expressa com naturalidade a cessação futura e definitiva da condição descrita.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: Jerusalém habitará
  rationale: Preserva Jerusalém como sujeito personificado e mantém o paralelismo lexical com a primeira ocorrência de ישׁב.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: Tradução corrente e clara da ideia de segurança e ausência de ameaça expressa pela construção hebraica.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto da restauração de Jerusalém
  choice: nada destinado à destruição
  alternative: nenhuma maldição; nenhuma interdição
  rationale: A escolha conserva a dimensão de juízo e destruição associada ao termo hebraico, enquanto a nota registra a alternativa tradicional “maldição” e o sentido de algo colocado sob interdição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “habitar” é intencional para preservar o paralelismo e a personificação presentes no hebraico.
