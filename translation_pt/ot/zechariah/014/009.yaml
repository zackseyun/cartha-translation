review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o futuro profético, a realeza universal de Yahweh e o paralelismo de אֶחָד. Contudo, «Yahweh será um» e «o seu nome será um» são gramaticalmente possíveis, mas em português moderno soam excessivamente literais e podem sugerir uma unidade numérica de modo pouco idiomático.
  naturalness: «Um só» é a forma portuguesa natural para conservar a concisão e a abertura semântica de אֶחָד neste paralelismo. A elipse em «e seu nome, um só» é clara, solene e espelha a segunda oração nominal hebraica.
  terminology: «Yahweh», «rei», «toda a terra» e «naquele dia» estão adequados. As notas devem apresentar alternativas lexicais diretas; «somente Yahweh será reconhecido» introduz uma explicitação interpretativa que vai além da alternativa lexical, e «singular» não é uma alternativa natural aqui.
  issues:
  - severity: medium
    issue: 'Formulação principal excessivamente literal: «Yahweh será um ... o seu nome será um».'
    rationale: Embora siga a forma do hebraico, a construção não é idiomática em português contemporâneo e pode obscurecer o sentido. «Um só» preserva a repetição, a brevidade e a ambiguidade relevante entre unidade, unicidade e exclusividade.
  - severity: low
    issue: Alternativas das notas são desiguais em precisão e naturalidade.
    rationale: «Somente Yahweh será reconhecido» acrescenta «será reconhecido», ausente no texto, e «singular» é pouco natural como predicado de «nome» neste contexto. «O único» e «único» apresentam as alternativas sem ampliar a afirmação.
  revised_text: Yahweh será rei sobre toda a terra. Naquele dia, Yahweh será um só[a], e seu nome, um só[b].
  revised_footnotes:
  - marker: a
    text: Ou «Yahweh será o único». O hebraico diz literalmente «um» e pode expressar exclusividade ou singularidade, além de unidade.
    reason: lexical_alternative
  - marker: b
    text: Ou «seu nome será único» ou «seu nome será o único».
    reason: lexical_alternative
