revisions:
- from: Yahweh será rei sobre toda a terra. Naquele dia, Yahweh será um[a], e o seu nome será um[b].
  to: Yahweh será rei sobre toda a terra. Naquele dia, Yahweh será um só[a], e seu nome, um só[b].
