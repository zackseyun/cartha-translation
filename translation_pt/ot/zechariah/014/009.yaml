  text: וְ/הָיָ֧ה יְהוָ֛ה לְ/מֶ֖לֶךְ עַל כָּל הָ/אָ֑רֶץ בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֧ה יְהוָ֛ה אֶחָ֖ד וּ/שְׁמ֥/וֹ אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: pt
  text: Yahweh será rei sobre toda a terra. Naquele dia, Yahweh será um só[a], e seu nome, um só[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Yahweh será o único». O hebraico diz literalmente «um» e pode expressar exclusividade ou singularidade, além de unidade.
    reason: lexical_alternative
  - marker: b
    text: Ou «seu nome será único» ou «seu nome será o único».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: será
  rationale: O perfeito qal com conjunção, no discurso profético, tem aqui sentido futuro. “Será” transmite a predição de modo natural e direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמֶלֶךְ
  choice: rei
  rationale: 'A preposição לְ indica aqui condição ou função resultante: Yahweh será rei. A construção portuguesa dispensa a tradução explícita da preposição.'
- source_word: עַל כָּל הָאָרֶץ
  choice: sobre toda a terra
  rationale: “Sobre” expressa domínio régio, e o contexto escatológico favorece o alcance universal de הָאָרֶץ, “terra”, em vez do sentido regional de “país” ou “território”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética corrente, vertida em português natural sem perder sua função escatológica.
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: Yahweh será um
  rationale: “Um” corresponde diretamente a אֶחָד e conserva a formulação teologicamente densa, sem decidir se a ênfase recai sobre unidade, exclusividade ou singularidade.
- source_word: וּשְׁמוֹ אֶחָד
  choice: e o seu nome será um
  rationale: O verbo “será” é retomado em português para tornar explícita a elipse hebraica. A repetição de “um” preserva o paralelismo e evita restringir a frase a apenas uma de suas possíveis nuances.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de אֶחָד aplicado a Yahweh
  choice: manter “um” no texto principal
  alternative: “o único”; “somente Yahweh”
  rationale: A formulação hebraica pode comunicar unidade, singularidade e exclusividade. A tradução principal mantém sua concisão e tensão, enquanto a nota registra alternativas legítimas.
- issue: Sentido de אֶחָד aplicado ao nome de Yahweh
  choice: manter “um” no texto principal
  alternative: “único”; “o único reconhecido”
  rationale: A repetição lexical liga estreitamente Yahweh e seu nome. Preservá-la evita transformar uma afirmação compacta em interpretação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição pouco habitual de “um” foi mantida deliberadamente para refletir o paralelismo conciso do hebraico; as notas esclarecem as principais alternativas sem resolver a ambiguidade no texto.
