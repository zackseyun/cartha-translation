  terminology: “Nações”, “cidade será tomada”, “saqueadas”, “exílio” e “restante do povo” são escolhas sólidas. “Estupradas” traduz sem eufemismo a violência sexual indicada pela forma escrita hebraica; a nota registra adequadamente uma formulação eufemística tradicional. A nota b preserva as possibilidades de leitura de כרת sem impor uma interpretação teológica.
