  source_fidelity: 'A tradução transmite com precisão a sequência profética do hebraico: a ação divina de reunir as nações, o ataque contra Jerusalém, a tomada da cidade, a pilhagem, a violência sexual expressa pelo ketiv, o exílio de metade da cidade e a preservação do restante. “Contra Jerusalém” é contextual e idiomático, embora אֶל seja literalmente direcional. “Não será eliminado da cidade” conserva de modo aceitável a abertura semântica de לֹא יִכָּרֵת מִן־הָעִיר entre remoção e destruição.'
