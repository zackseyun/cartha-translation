source:
  edition: WLC
  text: וְ/אָסַפְתִּ֨י אֶת כָּל הַ/גּוֹיִ֥ם אֶֽל יְרוּשָׁלִַם֮ לַ/מִּלְחָמָה֒ וְ/נִלְכְּדָ֣ה הָ/עִ֗יר וְ/נָשַׁ֨סּוּ֙ הַ/בָּ֣תִּ֔ים וְ/הַ/נָּשִׁ֖ים תשגלנה וְ/יָצָ֞א חֲצִ֤י הָ/עִיר֙ בַּ/גּוֹלָ֔ה וְ/יֶ֣תֶר הָ/עָ֔ם לֹ֥א יִכָּרֵ֖ת מִן הָ/עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: pt
  text: Eu reunirei todas as nações contra Jerusalém para a batalha; a cidade será tomada, as casas serão saqueadas e as mulheres serão estupradas.[a] Metade da cidade irá para o exílio, mas o restante do povo não será eliminado da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas tradições traduzem de modo mais eufemístico: “as mulheres serão violadas”. O termo escrito no texto hebraico é explícito e se refere a estupro.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser entendida como “não será exterminado” ou, enfatizando a remoção, “não será retirado da cidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי
  choice: Eu reunirei
  rationale: O perfeito qal na fala profética tem sentido futuro. A primeira pessoa preserva a atuação direta do falante divino.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: No contexto militar e internacional, “nações” comunica com clareza o sentido geopolítico de גּוֹיִם.
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: contra Jerusalém para a batalha
  rationale: Embora אֶל indique literalmente direção, o contexto hostil exige em português “contra”; “para a batalha” expressa naturalmente a finalidade.
- source_word: וְנִלְכְּדָה הָעִיר
  choice: a cidade será tomada
  rationale: O nifal de לכד descreve a captura militar da cidade; “será tomada” é natural e digno em português.
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: as casas serão saqueadas
  rationale: O verbo denota pilhagem em contexto de guerra. “Saqueadas” é atual, claro e mantém a violência da cena.
- source_word: וְהַנָּשִׁים תשגלנה
  choice: as mulheres serão estupradas
  rationale: A forma escrita no texto hebraico é crua e se refere à violência sexual. A tradução direta evita minimizar a atrocidade por meio de eufemismo.
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: Metade da cidade irá para o exílio
  rationale: בַּגּוֹלָה indica exílio ou deportação; a formulação escolhida preserva a imagem coletiva e soa natural em português.
- source_word: וְיֶתֶר הָעָם
  choice: mas o restante do povo
  rationale: יֶתֶר significa a parte que resta. “Restante” evita atribuir ao termo conotações teológicas adicionais associadas a “remanescente”.
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: não será eliminado da cidade
  rationale: A expressão pode indicar remoção ou destruição. “Eliminado da cidade” mantém em português certa abertura entre esses sentidos, enquanto a nota registra explicitamente a leitura mais forte.
theological_decisions:
- issue: Descrição da violência sexual
  choice: Traduzir explicitamente como “as mulheres serão estupradas”
  alternative: “as mulheres serão violadas”
  rationale: A linguagem direta corresponde à força do texto hebraico escrito e não suaviza a atrocidade narrada. A alternativa eufemística é registrada em nota sem substituir o sentido principal.
- issue: Sentido de לֹא יִכָּרֵת מִן הָעִיר
  choice: “não será eliminado da cidade”
  alternative: “não será exterminado” ou “não será retirado da cidade”
  rationale: O nifal de כרת permite tanto a ideia de destruição quanto a de remoção. O texto principal conserva a tensão, e a nota explicita as duas possibilidades sem impor uma resolução doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação mantém o ritmo cumulativo do hebraico sem produzir uma frase excessivamente pesada. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
