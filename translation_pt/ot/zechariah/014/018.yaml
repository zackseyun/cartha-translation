  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: pt
  text: E se a família do Egito não subir nem vier[a], não estará sobre eles a praga[b] com que Yahweh ferirá as nações que não subirem para celebrar a Festa das Cabanas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “não subir e não vir”. O hebraico emprega os dois verbos, provavelmente reforçando a ideia da peregrinação a Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: 'O texto hebraico diz: “não estará sobre eles a praga — a praga com que Yahweh ferirá as nações”. A construção é difícil neste contexto, pois o versículo anterior fala da falta de chuva. Alguns entendem que, depois de “não estará sobre eles”, há uma referência elíptica à chuva e que “a praga” inicia uma oração distinta: o Egito receberia então a praga, já que não depende das chuvas da mesma maneira.'
    reason: alternative_reading
  - marker: c
    text: Tradicionalmente, “Festa dos Tabernáculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: a família do Egito
  rationale: Preserva a expressão coletiva singular do hebraico; מִשְׁפָּחָה pode designar uma família, clã ou grupo de parentesco.
- source_word: תַעֲלֶה
  choice: subir
  rationale: עלה é o verbo habitual para a subida a Jerusalém e para a peregrinação às festas; “subir” conserva esse sentido.
- source_word: וְלֹא בָאָה
  choice: nem vier
  rationale: Mantém o segundo verbo do hebraico, בוא (“vir, chegar”), sem fundi-lo silenciosamente com “subir”.
- source_word: וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה
  choice: não estará sobre eles a praga
  rationale: Reproduz de modo inteligível a construção difícil e enfática do texto massorético, inclusive a negação, sem harmonizá-la com o versículo anterior.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מַגֵּפָה designa uma praga ou golpe aflitivo; “praga” também mantém a ligação semântica com o verbo seguinte, נָגַף.
- source_word: יִגֹּף
  choice: ferirá
  rationale: נָגַף significa golpear, ferir ou afligir. “Ferirá” é atual, digno e preserva a relação com “praga”.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Neste contexto profético, גּוֹיִם se refere às nações em geral.
- source_word: לָחֹג
  choice: para celebrar
  rationale: O infinitivo de חגג indica celebrar ou observar uma festa de peregrinação; “celebrar” é claro e idiomático.
- source_word: חַג הַסֻּכּוֹת
  choice: a Festa das Cabanas
  rationale: סֻכּוֹת significa literalmente “cabanas” ou “abrigos”; a escolha torna a imagem hebraica transparente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Aparente tensão com o versículo anterior e a negação em וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה
  choice: Manter no texto principal “não estará sobre eles a praga”
  alternative: Entender que falta uma referência à chuva (“não haverá chuva sobre eles”) e tomar “a praga” como início de outra oração, ou emendar o texto
  rationale: O texto massorético traz explicitamente a negação seguida de “sobre eles estará a praga”, numa construção difícil. A tradução preserva essa tensão textual, sem inserir “chuva” nem recorrer a emenda conjectural.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O original emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem introduzir uma substituição titular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação “não subir nem vier” evita repetição pesada, enquanto a nota registra mais literalmente os dois verbos. “Festa das Cabanas” privilegia a transparência da imagem hebraica; a designação tradicional aparece em nota. A formulação difícil sobre a praga foi mantida deliberadamente.
