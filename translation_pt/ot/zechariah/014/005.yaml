id: ZEC.14.5
reference: Zechariah 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: pt
  text: E vocês fugirão pelo vale dos meus montes, pois o vale dos montes se estenderá até Azal. Sim, vocês fugirão como fugiram diante do terremoto, nos dias de Uzias, rei de Judá. Então Yahweh, meu Deus, virá, e todos os santos[a] contigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Santos” pode se referir a seres celestiais; também pode ser entendido como “anjos santos” ou como o povo santo de Deus.
    reason: lexical_alternative
  - marker: b
    text: O texto massorético diz “contigo”, no singular. Alguns testemunhos antigos trazem “com ele”.
    reason: textual_variant
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: vocês fugirão
  rationale: O verbo נוּס normalmente significa “fugir”, e sua repetição na comparação com a fuga causada pelo terremoto confirma esse sentido.
- source_word: גֵּיא הָרַי
  choice: pelo vale dos meus montes
  rationale: “Vale” traduz naturalmente גיא, e o sufixo de primeira pessoa em הָרַי é preservado em “meus montes”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da fuga e mantém de forma natural a relação explicativa entre as orações.
- source_word: יַגִּיעַ
  choice: se estenderá
  rationale: No contexto topográfico, o Hifil de נגע descreve o vale alcançando determinado ponto.
- source_word: אָצַל
  choice: Azal
  rationale: O nome do lugar é transliterado.
- source_word: כַאֲשֶׁר נַסְתֶּם
  choice: como fugiram
  rationale: Preserva a comparação explícita e a repetição do verbo “fugir”.
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: diante do terremoto
  rationale: Expressa em português corrente a ideia de fugir da presença ou ameaça do terremoto, sem apagar a imagem da preposição hebraica.
- source_word: וּבָא
  choice: Então ... virá
  rationale: “Então” comunica a progressão da sequência, e o futuro corresponde ao contexto profético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Preserva o sufixo de primeira pessoa do singular.
- source_word: כָּל קְדֹשִׁים
  choice: todos os santos
  rationale: “Santos” mantém a designação ampla dos seres consagrados a Deus sem especificar se são anjos ou seres humanos.
- source_word: עִמָּךְ
  choice: contigo
  rationale: Traduz diretamente o pronome de segunda pessoa masculina singular do texto massorético, preservando a mudança do plural para o singular.
theological_decisions:
- issue: Identidade dos santos que acompanham Yahweh
  choice: todos os santos
  alternative: todos os anjos santos
  rationale: O hebraico não identifica explicitamente esses seres como anjos nem como seres humanos redimidos; a formulação ampla preserva essa tensão.
- issue: Pronome em עִמָּךְ
  choice: contigo
  alternative: com ele
  rationale: O texto massorético apresentado traz “contigo”; a variante “com ele”, apoiada por testemunhos antigos e adotada em muitas traduções, é registrada em nota sem substituir a leitura-base.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o nome pessoal presente no hebraico.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” para o plural e “contigo” para tornar visível a mudança repentina ao singular no hebraico. A topografia e as ambiguidades textuais e teológicas foram preservadas sem explicações denominacionais.
