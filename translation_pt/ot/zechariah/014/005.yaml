  terminology: “Yahweh” segue a política indicada para o Tetragrama. “Santos” conserva adequadamente a abertura semântica de קְדֹשִׁים, e a nota explica sem decidir entre acompanhantes celestiais e o povo santo. Azal e Uzias estão apresentados de modo consistente e inteligível.
