  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֤וּ מַֽיִם חַיִּים֙ מִ/יר֣וּשָׁלִַ֔ם חֶצְיָ֗/ם אֶל הַ/יָּם֙ הַ/קַּדְמוֹנִ֔י וְ/חֶצְיָ֖/ם אֶל הַ/יָּ֣ם הָ/אַחֲר֑וֹן בַּ/קַּ֥יִץ וּ/בָ/חֹ֖רֶף יִֽהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: pt
  text: 'Naquele dia, águas vivas[a] fluirão de Jerusalém: metade delas para o mar oriental[b] e metade para o mar ocidental[c]. Assim será no verão e no inverno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “águas correntes” ou “águas frescas”. Em hebraico, “águas vivas”, expressão comum para água corrente ou vivificante.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o mar a leste de Jerusalém, tradicionalmente identificado com o mar Morto.
    reason: cultural_note
  - marker: c
    text: Isto é, o mar a oeste de Jerusalém, tradicionalmente identificado com o mar Mediterrâneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz com naturalidade a fórmula temporal profética. O valor futuro é expresso pelos verbos seguintes, sem necessidade de uma introdução mais pesada como “E acontecerá naquele dia”.
- source_word: יֵצְאוּ
  choice: fluirão
  rationale: O verbo significa literalmente “sairão”, mas, tendo as águas como sujeito, “fluirão” comunica de modo natural e preciso o movimento indicado.
- source_word: מַיִם חַיִּים
  choice: águas vivas
  rationale: Mantém a expressão hebraica e sua possível ressonância teológica, sem reduzir o sentido a uma explicação puramente física como “água corrente” ou “água fresca”.
- source_word: מִירוּשָׁלַם
  choice: de Jerusalém
  rationale: Expressa diretamente o ponto de origem das águas.
- source_word: חֶצְיָם
  choice: metade delas
  rationale: O sufixo pronominal retoma as águas; “delas” explicita o referente de forma natural em português.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: o mar oriental
  rationale: Preserva a designação direcional hebraica sem inserir no texto principal a identificação tradicional com o mar Morto.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: o mar ocidental
  rationale: No contraste geográfico com o mar oriental, a expressão designa o mar a oeste, tradicionalmente identificado com o Mediterrâneo.
- source_word: בַּקַּיִץ וּבָחֹרֶף יִהְיֶה
  choice: Assim será no verão e no inverno
  rationale: Conserva a construção singular e concisa do hebraico e comunica a continuidade do fluxo durante todo o ano.
theological_decisions:
- issue: Possível ressonância simbólica de מַיִם חַיִּים (“águas vivas”)
  choice: Manter “águas vivas” no texto principal
  alternative: Traduzir de modo explicativo como “água corrente”, “água fresca” ou interpretar explicitamente como água espiritual que dá vida
  rationale: A expressão pode descrever água corrente ou vivificante, mas, no contexto profético, também pode ter ressonância teológica. A tradução preserva essa tensão sem impor uma leitura exclusivamente física ou simbólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo geográfico e a concisão profética do hebraico, usando “fluirão” por naturalidade idiomática.
