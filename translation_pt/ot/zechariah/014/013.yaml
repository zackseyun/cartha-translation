  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do hebraico: a ocorrência no “naquele dia”, o grande pânico procedente de Yahweh entre o grupo, a ação distributiva de cada homem e a imagem concreta da mão que se levanta contra a mão do próximo. “Vindo de Yahweh” comunica de modo natural a relação expressa por מְהוּמַת יְהוָה sem acrescentar uma explicação doutrinária.'
