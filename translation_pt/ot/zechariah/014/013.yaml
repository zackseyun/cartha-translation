id: ZEC.14.13
reference: Zechariah 14:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: pt
  text: Naquele dia, haverá entre eles um grande pânico vindo de Yahweh[a]. Cada homem agarrará a mão do seu próximo, e sua mão se levantará contra a mão do seu próximo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande confusão” ou “um grande tumulto da parte de Yahweh”. O termo hebraico pode indicar um estado de terror e desordem caótica causado por Deus.
    reason: lexical_alternative
  - marker: b
    text: A repetição literal de “mão” cria uma imagem vívida de pessoas voltando-se violentamente umas contra as outras.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  choice: pânico
  rationale: O substantivo denota um estado de terror e desordem, aqui causado por intervenção divina. “Pânico” é natural em português e se ajusta ao contexto de violência caótica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor” e preservando sua forma pessoal.
- source_word: רַבָּה
  choice: grande
  rationale: O adjetivo intensifica “pânico”; “grande pânico” preserva a ênfase hebraica de modo idiomático.
- source_word: בָּהֶם
  choice: entre eles
  rationale: Indica que o pânico irrompe no meio do grupo, como confirma a agressão mútua descrita em seguida.
- source_word: וְהֶחֱזִיקוּ
  choice: agarrará
  rationale: O Hifil de חזק expressa aqui um ato enérgico de segurar; “agarrar” comunica força e hostilidade sem acrescentar uma finalidade não declarada.
- source_word: אִישׁ
  choice: cada homem
  rationale: Preserva o singular distributivo e a forma masculina explícita do hebraico.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: Refere-se ao outro integrante do grupo; “próximo” mantém a relação recíproca sem sugerir necessariamente amizade.
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: sua mão se levantará contra a mão do seu próximo
  rationale: Mantém a repetição concreta de “mão” e a imagem vívida do hebraico, sem reduzir a expressão a uma paráfrase interpretativa.
theological_decisions:
- issue: Natureza da desordem causada por Deus
  choice: “um grande pânico vindo de Yahweh” apresenta o pânico como procedente de Yahweh e atuando entre o grupo.
  alternative: “uma grande confusão de Yahweh” ou uma desordem associada de modo mais geral à intervenção de Yahweh.
  rationale: A construção מְהוּמַת יְהוָה aponta naturalmente para pânico causado ou enviado por Yahweh. A violência mútua subsequente sustenta essa leitura, sem exigir explicação teológica além do texto.
- issue: Linguagem distributiva masculina
  choice: cada homem
  alternative: cada um
  rationale: אִישׁ é masculino singular com valor distributivo. A formulação escolhida preserva tanto a forma quanto a função do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente segmentada em duas frases para favorecer a compreensão, mantendo o paralelismo e a imagem concreta do hebraico.
