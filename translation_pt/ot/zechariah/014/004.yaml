  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: pt
  text: Naquele dia, os pés dele estarão sobre o monte das Oliveiras, que fica diante de Jerusalém, a leste[a]. O monte das Oliveiras se partirá ao meio, do leste ao oeste, formando um vale muito grande[b]; metade do monte se deslocará para o norte, e a outra metade, para o sul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fica defronte de Jerusalém, para o leste”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico descreve o monte abrindo-se a partir do meio em direção ao leste e ao oeste, enquanto suas duas metades se afastam.
    reason: source_clarification
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: os pés dele estarão
  rationale: Mantém a imagem corporal concreta do hebraico e expressa como futuro o perfeito com waw em contexto profético.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética consagrada e natural em português atual.
- source_word: הַר הַזֵּתִים / הַר הַזֵּיתִים
  choice: o monte das Oliveiras
  rationale: Nome geográfico tradicional, claro e fiel à construção hebraica.
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: que fica diante de Jerusalém, a leste
  rationale: Preserva tanto a ideia espacial de estar diante ou defronte de Jerusalém quanto sua localização oriental.
- source_word: וְנִבְקַע
  choice: se partirá ao meio
  rationale: O nifal de בקע indica abrir-se ou partir-se; 'ao meio' é confirmado pela menção subsequente às duas metades.
- source_word: מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: do leste ao oeste
  rationale: Comunica de modo conciso o eixo da fenda, embora o hebraico descreva mais literalmente a divisão a partir do meio em direção ao leste e ao oeste.
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: formando um vale muito grande
  rationale: Torna explícito o resultado da divisão sem acrescentar conteúdo estranho ao texto e conserva a intensificação de מְאֹד.
- source_word: וּמָשׁ
  choice: se deslocará
  rationale: Expressa o movimento ou afastamento das metades do monte provocado pela divisão.
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: para o norte / para o sul
  rationale: Representa naturalmente em português as formas direcionais hebraicas.
theological_decisions:
- issue: Descrição antropomórfica da figura divina no contexto
  choice: Preservar literalmente «os pés dele estarão»
  alternative: «a presença dele repousará» ou «ele aparecerá»
  rationale: O hebraico emprega linguagem corporal concreta, cujo referente contextual é YHWH. A tradução não deve atenuar a imagem nem resolver suas implicações teológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação longa do hebraico foi dividida em duas frases para clareza, sem alterar a sequência dos acontecimentos.
