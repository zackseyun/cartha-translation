base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: pt
  text: Então Yahweh sairá e lutará contra aquelas nações, como quando luta num dia de batalha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como no dia em que ele lutou, num dia de batalha”. O hebraico permite uma tradução mais formal, com repetição de “dia”; o texto principal expressa a comparação de modo natural em português.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: וְיָצָא
  choice: Então ... sairá
  rationale: No discurso profético, a forma verbal apresenta a ação futura seguinte. “Então” expressa naturalmente a progressão do contexto anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְנִלְחַם
  choice: e lutará
  rationale: O nifal de לחם indica entrar em combate ou lutar; esta opção é clara e natural no contexto militar.
- source_word: בַּגּוֹיִם הָהֵם
  choice: contra aquelas nações
  rationale: Com לחם, a preposição ב marca aqui os adversários; הָהֵם é preservado por “aquelas”.
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: como quando luta
  rationale: A construção comparativa com “dia” funciona idiomaticamente como “como quando”. O presente exprime uma ação característica, sem obrigar a referência a uma batalha histórica específica.
- source_word: בְּיוֹם קְרָב
  choice: num dia de batalha
  rationale: Mantém a expressão temporal e indefinida do hebraico em português natural, sem identificar um dia histórico específico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal no texto e evita substituí-lo por um título ou por outra forma tradicional.
- issue: Referência temporal da comparação
  choice: como quando luta num dia de batalha
  alternative: como no dia em que lutou, no dia da batalha
  rationale: A construção hebraica admite uma comparação genérica ou uma possível alusão passada. O texto principal oferece a leitura idiomática e não identifica sem base uma batalha concreta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo marcial sem repetir artificialmente “dia”.
