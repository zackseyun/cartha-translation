base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: pt
  text: Eis que vem um dia para o SENHOR[a], e os seus despojos serão repartidos em seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a formulação mais tradicional: “um dia do SENHOR vem”. O hebraico diz literalmente: “um dia vem para o SENHOR”.'
    reason: Leitura alternativa que registra a conhecida fórmula profética sem apagar a preposição empregada no texto hebraico.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com solenidade o anúncio profético e conserva sua função de chamar a atenção, em registro digno e reconhecível.
- source_word: יוֹם
  choice: um dia
  rationale: O substantivo não tem artigo e apresenta um dia significativo que se aproxima, sem o identificar ainda como referente previamente definido.
- source_word: בָּא
  choice: vem
  rationale: O particípio qal tem valor de futuro iminente no discurso profético; o presente português expressa naturalmente essa aproximação.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: Mantém a força básica da preposição ל e evita converter sem indicação a expressão na fórmula tradicional “dia do SENHOR”.
- source_word: וְחֻלַּק
  choice: serão repartidos
  rationale: Expressa o pual passivo em contexto de futuro profético; o plural concorda naturalmente com “os bens saqueados”.
- source_word: שְׁלָלֵךְ
  choice: os bens saqueados de você
  rationale: Comunica em linguagem atual os bens tomados como despojo de guerra. O sufixo feminino singular dirige-se à cidade de Jerusalém personificada.
- source_word: בְּקִרְבֵּךְ
  choice: no meio de você
  rationale: Preserva a referência espacial ao interior da cidade e a segunda pessoa feminina singular do hebraico, sem substituir o destinatário pelo nome interpretativo “Jerusalém”.
theological_decisions:
- issue: Relação de לַיהוָה com a fórmula profética do “dia”
  choice: um dia para o SENHOR
  alternative: um dia do SENHOR
  rationale: O hebraico emprega a preposição ל, não uma construção nominal que corresponda mais diretamente a “do SENHOR”. A tradução principal conserva essa forma incomum e a nota registra a formulação tradicional evocada pelo contexto profético.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. “Eis que” mantém o tom profético elevado; “bens saqueados” torna explícito o sentido militar de שָׁלָל; a repetição “de você/no meio de você” conserva a interpelação feminina singular à cidade, embora soe deliberadamente marcada em português.
