revisions:
- from: Eis que vem um dia para o SENHOR[a], e os bens saqueados de você serão repartidos no meio de você.
  to: Eis que vem um dia para o SENHOR[a], e os seus despojos serão repartidos em seu meio.
  rationale: A revisão substitui expressões pouco naturais ou potencialmente ambíguas por “os seus despojos” e “em seu meio”. Assim, preserva-se o sentido bélico de שְׁלָל, a voz passiva futura de וְחֻלַּק e a referência interna de בְּקִרְבֵּךְ, em português moderno e claro. A formulação deliberadamente próxima do hebraico “um dia para o SENHOR” e sua nota alternativa são mantidas.
