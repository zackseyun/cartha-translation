    issue: “bens saqueados de você” é semanticamente ambíguo e menos preciso para שְׁלָלֵךְ.
    rationale: A expressão pode ser entendida como bens que alguém saqueou da destinatária. No contexto, o substantivo designa os despojos/plunder pertencentes à cidade e destinados à divisão.
  - severity: medium
    issue: “no meio de você” não é formulação natural para o interior de uma cidade em português moderno.
    rationale: Embora tente espelhar a segunda pessoa feminina singular, a formulação é artificial. “Em seu meio” mantém a referência à destinatária sem reduzir a clareza.
