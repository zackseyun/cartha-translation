language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: pt
  text: E acontecerá que, se alguma das famílias da terra não subir a Jerusalém para adorar[a] o Rei, Yahweh dos Exércitos[b], não cairá chuva sobre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para se prostrar diante de”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: E acontecerá que, se alguma
  rationale: A expressão introduz uma condição e seu resultado. Esta formulação conserva וְהָיָה sem impor ao português uma construção excessivamente hebraizante.
- source_word: לֹא יַעֲלֶה
  choice: não subir
  rationale: O verbo עלה é usado idiomaticamente para a subida geográfica e peregrinatória a Jerusalém.
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: das famílias da terra
  rationale: “Famílias” é claro e natural; no contexto internacional de Zacarias 14, “terra” tem alcance mundial, não apenas territorial israelita.
- source_word: אֶל יְרוּשָׁלַםִ
  choice: a Jerusalém
  rationale: A preposição “a” expressa de modo natural o movimento em direção à cidade.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: para adorar
  rationale: O verbo denota literalmente prostrar-se, mas aqui descreve um ato cultual; “adorar” comunica naturalmente sua função no contexto.
- source_word: לְמֶלֶךְ
  choice: o Rei
  rationale: O título se refere a Yahweh, identificado imediatamente em aposição; a maiúscula sinaliza seu uso titular.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” traduz צְבָאוֹת de modo transparente, preservando sua imagem marcial e cósmica.
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: não cairá chuva sobre ela
  rationale: Esta expressão é idiomática em português e preserva tanto a negação da chuva quanto sua incidência sobre a família mencionada; o singular concorda com “alguma das famílias”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a terra de Israel; o país
  rationale: O contexto trata das famílias das nações que sobem a Jerusalém; por isso, a expressão tem alcance mundial e não deve ser restringida à terra de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a fórmula narrativa inicial e a condição, sem reproduzir uma ordem de palavras artificial. Os marcadores [a] e [b] aparecem no texto principal.
