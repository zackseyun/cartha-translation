  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: pt
  text: 'Naquele dia, haverá nas campainhas dos cavalos[b]: “Consagrado ao SENHOR”[a]; e as panelas na casa do SENHOR serão como as bacias[c] diante do altar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Santidade para o SENHOR”. A fórmula repete a inscrição da lâmina de ouro do sumo sacerdote em Êxodo 28:36.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode indicar pequenas peças metálicas que tilintavam nos arreios dos cavalos; “campainhas” é o sentido mais provável.
    reason: cultural_note
  - marker: c
    text: 'Ou: “tigelas”. Eram recipientes sagrados usados no ritual do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão profética temporal corrente, natural em português e fiel à força deíctica do hebraico.
- source_word: יִהְיֶה עַל
  choice: haverá ... a inscrição
  rationale: O hebraico diz literalmente que a fórmula estará sobre as peças; “a inscrição” explicita de modo natural em português a função evidente das palavras citadas, sem especificar como foram gravadas.
- source_word: מְצִלּוֹת הַסּוּס
  choice: campainhas dos cavalos
  rationale: O termo provavelmente designa pequenas peças metálicas sonoras presas aos arreios. O singular hebraico “o cavalo” tem sentido genérico ou coletivo.
- source_word: קֹדֶשׁ לַיהוָה
  choice: “Consagrado ao SENHOR”
  rationale: Reproduz em português natural o sentido cultual e dedicatório da fórmula, mantendo sua concisão e sua relação com Êxodo 28:36.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção reverencial portuguesa para o Tetragrama, em versaletes representadas aqui por maiúsculas.
- source_word: הַסִּירוֹת
  choice: as panelas
  rationale: Designa recipientes usados para cozinhar ou ferver; “panelas” é claro, comum e suficientemente amplo.
- source_word: בְּבֵית יְהוָה
  choice: na casa do SENHOR
  rationale: Preserva a expressão hebraica e sua referência transparente ao templo.
- source_word: כַּמִּזְרָקִים
  choice: como as bacias
  rationale: Refere-se a recipientes cultuais usados no serviço sacrificial; “bacias” distingue esses utensílios das panelas e comunica seu formato e função geral.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: diante do altar
  rationale: Equivalente formal e idiomático da expressão espacial cultual.
theological_decisions:
- issue: A santidade cultual estendida a objetos comuns
  choice: O texto apresenta objetos ligados ao transporte e ao preparo de alimentos como consagrados e equipara as panelas do templo às bacias do altar.
  alternative: Entender a linguagem apenas como símbolo genérico de bênção futura, sem implicar a extensão da santidade cultual.
  rationale: A fórmula קֹדֶשׁ לַיהוָה e a comparação explícita com os vasos do altar indicam que a santidade alcança objetos antes comuns. A tradução conserva essa imagem sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “casa do SENHOR” e “diante do altar” para preservar o colorido cultual, enquanto usa vocabulário corrente como “campainhas”, “panelas” e “bacias”.
