id: ZEC.14.19
reference: Zechariah 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: pt
  text: Este será o castigo[a] do Egito e o castigo de todas as nações que não subirem para celebrar a Festa das Cabanas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pena”. A palavra hebraica também pode significar “pecado” em outros contextos, mas aqui se refere ao juízo incorrido por quem se recusa a subir para a festa.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “Festa dos Tabernáculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Este será
  rationale: O demonstrativo aponta para a consequência descrita anteriormente, e o imperfeito de היה tem sentido futuro/resultativo neste contexto.
- source_word: חַטַּאת
  choice: castigo
  rationale: Embora o substantivo possa significar “pecado” ou “oferta pelo pecado” em outros contextos, aqui resume o juízo imposto ao Egito e às demais nações que se recusarem a subir para a festa.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome da nação.
- source_word: וְחַטַּאת כָּל הַגּוֹיִם
  choice: e o castigo de todas as nações
  rationale: Mantém a repetição enfática do substantivo hebraico e traduz גּוֹיִם de modo amplo e não sectário.
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: que não subirem
  rationale: Preserva a linguagem de subida em peregrinação a Jerusalém; o futuro do subjuntivo é natural em português para a condição futura.
- source_word: לָחֹג
  choice: para celebrar
  rationale: O infinitivo de חגג expressa a celebração ou observância de uma festa de peregrinação.
- source_word: אֶת חַג הַסֻּכּוֹת
  choice: a Festa das Cabanas
  rationale: Traduz o título da festa com linguagem transparente, preservando a imagem das estruturas temporárias indicada por סֻכּוֹת.
theological_decisions:
- issue: Sentido de חַטַּאת em contexto de juízo escatológico
  choice: castigo
  alternative: pecado; pena; oferta pelo pecado
  rationale: O contexto imediato descreve a consequência judicial sofrida pelas nações que não participarem da peregrinação. “Castigo” comunica esse sentido sem introduzir indevidamente uma referência sacrificial.
- issue: Tradução de חַג הַסֻּכּוֹת
  choice: Festa das Cabanas
  alternative: Festa dos Tabernáculos; Festa das Tendas
  rationale: “Cabanas” torna acessível a imagem do hebraico, enquanto a forma tradicional permanece registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva-se a repetição de “castigo” e a linguagem de “subir”, presentes no hebraico.
