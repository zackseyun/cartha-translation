base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
translation:
  language: pt
  text: 'E acontecerá naquele dia: não haverá luz[a]; as coisas esplêndidas congelarão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra interpretação tradicional: “não haverá luz, nem frio, nem geada”. A cláusula final em hebraico é difícil e tem sido entendida de várias maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula profética que introduz um acontecimento futuro, em português natural e digno.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal profética consagrada e idiomática em português.
- source_word: לֹא יִהְיֶה אוֹר
  choice: não haverá luz
  rationale: Reproduz com clareza a oração existencial negativa do hebraico.
- source_word: יְקָרוֹת
  choice: as coisas esplêndidas
  rationale: Mantém o sentido lexical de coisas preciosas ou esplêndidas sem identificar de modo definitivo o referente obscuro.
- source_word: יקפאון
  choice: se congelarão
  rationale: Conserva a imagem concreta de congelar ou solidificar presente na leitura massorética, sem substituí-la por uma interpretação como escurecer.
theological_decisions:
- issue: Interpretação da difícil cláusula final יְקָרוֹת יקפאון
  choice: 'Traduzir de forma relativamente literal: “as coisas esplêndidas se congelarão”.'
  alternative: “não haverá luz, nem frio, nem geada” ou “as luzes se enfraquecerão”.
  rationale: O hebraico é lexical e sintaticamente obscuro. A redação principal permanece próxima do Texto Massorético e evita resolver silenciosamente o referente; a nota registra uma importante interpretação tradicional alternativa.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil. A construção mantém tom profético digno; “coisas esplêndidas” preserva deliberadamente a indeterminação do hebraico.
