review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a praga, a ação de Yahweh, os povos que guerrearam contra Jerusalém e a imagem explícita de decomposição corporal. Contudo, depois de «a carne de cada um», a omissão dos possessivos em «os olhos», «nas órbitas» e «na boca» torna as referências anatômicas menos definidas do que no hebraico, que as apresenta como pertencentes à pessoa atingida.
  naturalness: «Enquanto ele ainda estiver de pé» é claro e natural em português moderno. A repetição moderada de possessivos («seus/suas») evita que a sequência posterior soe genérica e preserva a relação distributiva já introduzida por «cada um».
  terminology: «Praga», «ferirá», «povos», «guerrearam contra», «carne», «órbitas» e «apodrecerá» são escolhas adequadas. «Yahweh» está consistente com a política indicada. A nota para «povos/nações» é pertinente e está corretamente ancorada.
  issues:
  - severity: low
    issue: Referência possessiva enfraquecida na descrição dos olhos e da língua.
    rationale: O hebraico traz «seus olhos», «sua língua» e complementos possessivos. A elipse portuguesa do rascunho é compreensível, mas «os olhos ... nas órbitas» e «a língua ... na boca» pode soar como descrição genérica. A explicitação preserva com maior precisão o singular distributivo sem alterar o sentido.
  revised_text: 'Esta será a praga com que Yahweh ferirá todos os povos[a] que guerrearam contra Jerusalém: a carne de cada um apodrecerá enquanto ele ainda estiver de pé; seus olhos apodrecerão em suas órbitas, e sua língua apodrecerá em sua boca.'
