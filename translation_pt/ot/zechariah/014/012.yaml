  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: pt
  text: 'Esta será a praga com que Yahweh ferirá todos os povos[a] que guerrearam contra Jerusalém: a carne de cada um apodrecerá enquanto ele ainda estiver de pé; seus olhos apodrecerão em suas órbitas, e sua língua apodrecerá em sua boca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as nações”. A palavra hebraica עַמִּים pode designar povos ou nações, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מַגֵּפָה designa um golpe ou flagelo devastador, frequentemente uma praga. “Praga” é natural em português e mantém aberta a natureza exata do juízo.
- source_word: יִגֹּף
  choice: ferirá
  rationale: O verbo נגף significa golpear, ferir ou afligir. “Ferirá” expressa claramente a ação judicial divina sem repetir “praga” nem especificar um mecanismo patológico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל־הָעַמִּים
  choice: todos os povos
  rationale: עַמִּים pode indicar povos ou nações. “Povos” preserva mais diretamente o plural lexical; “nações” continua sendo uma alternativa contextual válida e é indicada em nota.
- source_word: צָבְאוּ עַל
  choice: que guerrearam contra
  rationale: O verbo צבא, neste contexto, descreve mobilização e ação militar contra Jerusalém. “Guerrearam contra” comunica esse sentido de maneira direta e atual.
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: apodrecerá / apodrecerão
  rationale: As formas de מקק descrevem decomposição ou definhamento. “Apodrecer” conserva a imagem corporal gráfica e permite coerência lexical ao longo do versículo.
- source_word: בְּשָׂרוֹ
  choice: a carne de cada um
  rationale: “Carne” corresponde diretamente a בשר. A expressão “de cada um” torna explícito em português o singular distributivo que sucede ao antecedente plural “povos”.
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: enquanto ainda estiver de pé
  rationale: A construção participial retrata a decomposição ocorrendo com a pessoa ainda ereta. “Ainda” ressalta essa simultaneidade chocante sem acrescentar uma interpretação causal.
- source_word: בְחֹרֵיהֶן
  choice: nas órbitas
  rationale: חֹרִים refere-se aqui às cavidades dos olhos. “Órbitas” é o termo anatômico natural e preciso em português.
- source_word: וּלְשׁוֹנוֹ תִּמַּק בְּפִיהֶם
  choice: e a língua apodrecerá na boca
  rationale: A formulação impessoal/distributiva em português comunica o sentido apesar da alternância do hebraico entre sufixo singular (“sua língua”) e plural (“na boca deles”), sem criar uma imagem artificial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza das imagens de juízo
  choice: Manter a decomposição corporal gráfica sem explicar seu mecanismo
  alternative: Entender a cena apenas como metáfora de derrota ou como descrição de uma doença específica
  rationale: O hebraico descreve carne, olhos e língua apodrecendo, mas não determina se o processo deve ser classificado como milagroso, militar ou epidemiológico. A tradução conserva essa tensão.
- issue: Mudança entre referência plural e descrição singular
  choice: 'Traduzir a descrição como singular distributivo: “de cada um”'
  alternative: Manter literalmente todas as oscilações pronominais do hebraico ou pluralizar toda a descrição
  rationale: Depois de “todos os povos”, o hebraico passa a retratar um indivíduo representativo, com uma oscilação final para um sufixo plural. O singular distributivo preserva o foco vívido em cada atingido e produz português inteligível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a solenidade profética e a força gráfica do hebraico. O ponto e vírgula organiza a sequência corporal sem suavizar sua intensidade.
