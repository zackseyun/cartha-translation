    reason: lexical_alternative
  revision_rationale: A revisão apenas explicita os vínculos possessivos e o sujeito da oração temporal, que já estão implicados no singular distributivo do hebraico. Mantém-se a gravidade gráfica da imagem, sem especificar a natureza da praga nem resolver a oscilação pronominal final do texto hebraico além da normalização distributiva natural em português.
