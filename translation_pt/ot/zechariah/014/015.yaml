  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: pt
  text: 'E assim será a praga que atingirá os cavalos, as mulas, os camelos, os jumentos e todos os animais que estiverem naqueles acampamentos: será como esta praga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, como a praga descrita no versículo anterior.
    reason: Esclarece o referente contextual da comparação hebraica sem substituir a formulação preservada no texto.
lexical_decisions:
- source_word: וְכֵן
  choice: E assim
  rationale: Introduz a correspondência com o juízo descrito anteriormente, preservando tanto a conjunção como a ideia de semelhança ou continuidade.
- source_word: תִּהְיֶה מַגֵּפַת
  choice: a praga atingirá
  rationale: Embora o hebraico use literalmente o verbo 'ser', em português 'a praga atingirá' expressa com naturalidade a incidência da praga sobre os animais sem alterar o sentido.
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: os cavalos, as mulas, os camelos, os jumentos
  rationale: Equivalentes atuais e claros; os singulares coletivos hebraicos são vertidos naturalmente no plural em português.
- source_word: וְכָל הַבְּהֵמָה
  choice: e todos os animais
  rationale: בְּהֵמָה tem sentido amplo neste contexto e abrange os demais animais presentes nos acampamentos; 'animais' evita restringir indevidamente a referência a rebanhos.
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: que estiverem naqueles acampamentos
  rationale: Mantém a referência futura do verbo e traduz מַחֲנוֹת diretamente como acampamentos, sem interpretá-lo como exércitos.
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: uma praga como esta
  rationale: Preserva diretamente a comparação marcada por כְּ e sua referência à praga recém-descrita, sem forçar identidade absoluta.
theological_decisions:
- issue: Natureza do juízo sobre os animais nos acampamentos inimigos
  choice: Uma praga concreta que também atinge os animais associados aos acampamentos hostis
  alternative: Uma aflição genérica, sem a noção específica de praga
  rationale: A repetição de מַגֵּפָה no contexto imediato favorece 'praga' e mostra que o juízo anteriormente descrito se estende aos animais, sem exigir explicação adicional sobre seu mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Jumentos' é preferido a 'asnos' por ser corrente e não arcaizante; o travessão destaca a comparação conclusiva.
