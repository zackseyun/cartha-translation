source:
  edition: WLC
  text: וְ/הָיָ֣ה יוֹם אֶחָ֗ד ה֛וּא יִוָּדַ֥ע לַֽ/יהוָ֖ה לֹא י֣וֹם וְ/לֹא לָ֑יְלָה וְ/הָיָ֥ה לְ/עֵֽת עֶ֖רֶב יִֽהְיֶה אֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: pt
  text: 'E será um dia[a], conhecido por Yahweh: não será dia nem noite[b]; e, ao entardecer, haverá luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um só dia”. O hebraico diz literalmente “um dia” e pode destacar tanto sua singularidade numérica quanto seu caráter incomparável no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não dia e não noite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E será
  rationale: O waw seguido do qatal introduz aqui uma realidade futura no discurso profético; a formulação mantém a estrutura hebraica e soa natural em português.
- source_word: יוֹם אֶחָד
  choice: um dia único
  rationale: A expressão significa literalmente “um dia”, mas, no contexto, assinala um dia singular e extraordinário. “Único” explicita essa força contextual sem definir sua natureza.
- source_word: הוּא
  choice: será
  rationale: O pronome retoma “dia”. Em português, sua função é expressa naturalmente pela construção verbal, sem a repetição artificial de “ele”.
- source_word: יִוָּדַע לַיהוָה
  choice: conhecido por Yahweh
  rationale: O nifal de ידע indica que esse dia é conhecido, e ל marca a relação com Yahweh. “Conhecido por” é idiomático em português e preserva o sentido passivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino no texto hebraico e evita substituí-lo por um título.
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: não será dia nem noite
  rationale: A formulação conserva a negação das duas categorias e o caráter paradoxal da descrição, com sintaxe natural em português.
- source_word: לְעֵת עֶרֶב
  choice: ao entardecer
  rationale: Expressa de modo atual e conciso o período da tarde que chega ao fim, correspondente ao hebraico.
- source_word: יִהְיֶה אוֹר
  choice: haverá luz
  rationale: Reproduz naturalmente a construção existencial e mantém a surpreendente inversão final, sem acrescentar imagens.
theological_decisions:
- issue: Natureza do dia extraordinário
  choice: Apresentar um dia singular e extraordinário, sem determinar seu mecanismo ou cronologia escatológica.
  alternative: Entendê-lo exclusivamente como fenômeno astronômico literal, símbolo puro de salvação ou elemento de uma cronologia milenar específica.
  rationale: O hebraico descreve um dia excepcional, conhecido por Yahweh, no qual as categorias usuais de dia e noite são suspensas e há luz ao entardecer; o versículo não define um esquema profético específico.
- issue: Sentido de “conhecido por Yahweh”
  choice: Manter a afirmação aberta de que o dia é conhecido por Yahweh.
  alternative: Expandir como “cuja duração somente Yahweh conhece” ou “escolhido por Yahweh”.
  rationale: Essas expansões são interpretações possíveis, mas o texto afirma apenas que o dia é conhecido em relação a Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca as três afirmações do hebraico. “Yahweh” preserva o nome divino, e a construção paradoxal permanece sem explicação doutrinária adicional.
