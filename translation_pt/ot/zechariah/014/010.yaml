source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: pt
  text: Toda a terra será transformada numa planície[a], desde Geba até Rimom, ao sul de Jerusalém. Mas Jerusalém será elevada e permanecerá em seu lugar, desde a Porta de Benjamim até o local da Primeira Porta, até a Porta da Esquina, e desde a Torre de Hananel até os lagares do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficará como a Arabá». O hebraico pode comparar a terra à Arabá — o vale ou região de estepe — em vez de afirmar apenas que ela se tornará uma planície.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסּוֹב
  choice: será transformada
  rationale: No contexto, o verbo descreve uma mudança topográfica sofrida pela região. A forma passiva comunica com naturalidade o resultado, sem especificar um agente não expresso.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Os limites geográficos que seguem indicam a terra ou região em torno de Jerusalém, não necessariamente o planeta inteiro. Em português, «terra» preserva a amplitude lexical do hebraico, enquanto o contexto delimita o referente.
- source_word: כָּעֲרָבָה
  choice: numa planície
  rationale: עֲרָבָה pode designar uma planície ou estepe, ou especificamente a Arabá. No texto principal, «numa planície» torna clara a transformação topográfica; a leitura comparativa e geográfica é preservada em nota.
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: desde Geba até Rimom, ao sul de Jerusalém
  rationale: Os topônimos marcam a extensão da área transformada. A pontuação deixa «ao sul de Jerusalém» naturalmente associado a Rimom, conforme a construção hebraica.
- source_word: וְרָאֲמָה
  choice: será elevada
  rationale: A forma expressa elevação e contrasta Jerusalém com a terra circundante tornada plana. «Será elevada» conserva o provável valor passivo ou resultativo.
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: permanecerá em seu lugar
  rationale: A expressão, literalmente ligada a assentar-se ou habitar em seu próprio lugar, indica que a cidade continuará estabelecida em sua localização. A tradução evita um literalismo pouco natural.
- source_word: לְמִשַּׁעַר בִּנְיָמִן
  choice: desde a Porta de Benjamim
  rationale: Na sequência dos marcos urbanos, a preposição introduz o ponto inicial do percurso. «Desde» exprime essa função com clareza em português.
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: o local da Primeira Porta
  rationale: מְקוֹם destaca o lugar ou sítio da porta, talvez por ela já não existir. «O local» preserva essa nuance.
- source_word: שַׁעַר הַפִּנִּים
  choice: a Porta da Esquina
  rationale: O nome deriva de um termo para canto ou esquina. Esta forma é clara, digna e reconhecível em português bíblico atual.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: a Torre de Hananel
  rationale: Traduz o substantivo comum e translitera o nome próprio de maneira usual e transparente.
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: os lagares do rei
  rationale: יֶקֶב designa lagar ou instalação para prensar uvas. «Lagares» é preciso, conciso e corrente em contexto bíblico.
theological_decisions:
- issue: Extensão da transformação geográfica
  choice: transformação regional da terra em torno de Jerusalém
  alternative: transformação de toda a terra ou de todo o planeta
  rationale: Os limites entre Geba e Rimom e a enumeração dos marcos de Jerusalém favorecem uma referência regional. A tradução «terra» conserva a possível amplitude do substantivo hebraico sem impor uma leitura global.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os topônimos tradicionais «Geba», «Rimom» e «Hananel». «Mas» explicita o contraste topográfico já presente na relação entre a planície circundante e a elevação de Jerusalém.
