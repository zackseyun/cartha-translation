  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: pt
  text: Então, todos os que restarem de todas as nações que vieram contra Jerusalém subirão, ano após ano, para adorar o Rei, Yahweh dos Exércitos, e para celebrar a Festa das Cabanas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Festa dos Tabernáculos”; também chamada “Festa das Tendas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Então ... subirão
  rationale: Introduz o resultado futuro na sequência profética. “Então” expressa com naturalidade a progressão do discurso, enquanto o futuro verbal preserva a referência futura.
- source_word: כָּל הַנּוֹתָר
  choice: todos os que restarem
  rationale: O particípio designa os que sobrarem ou sobreviverem; esta formulação preserva essa referência pessoal sem tornar explícita além do texto a ideia de sobrevivência.
- source_word: מִכָּל הַגּוֹיִם
  choice: de todas as nações
  rationale: Tradução direta e natural da expressão que indica a procedência dentre o conjunto das nações.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: que vieram contra Jerusalém
  rationale: No contexto militar, עַל indica movimento hostil. “Vieram contra” conserva o modo de expressão hebraico sem especificar além do texto se o ataque foi consumado.
- source_word: וְעָלוּ
  choice: subirão
  rationale: עלה é o verbo habitual para subir a Jerusalém e carrega ressonância topográfica e de peregrinação; “subirão” preserva ambas.
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: ano após ano
  rationale: A expressão distributiva indica recorrência anual contínua; a formulação é corrente e clara em português.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: para adorar
  rationale: Embora o verbo descreva literalmente prostrar-se, neste contexto cultual o gesto constitui adoração; a escolha comunica diretamente esse sentido.
- source_word: לְמֶלֶךְ
  choice: o Rei
  rationale: O título é mantido em aposição ao nome divino, preservando sua importância no contexto.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” traduz o título צְבָאוֹת de modo transparente, abrangendo sua imagem régia e militar.
- source_word: וְלָחֹג
  choice: e para celebrar
  rationale: חגג denota celebrar ou observar uma festa de peregrinação; “celebrar” comunica tanto a observância quanto seu caráter festivo.
- source_word: חַג הַסֻּכּוֹת
  choice: a Festa das Cabanas
  rationale: סֻכּוֹת são cabanas ou abrigos temporários. “Festa das Cabanas” é transparente e compreensível, enquanto a designação tradicional é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Tradução de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos exércitos; dos senhores dos exércitos
  rationale: A tradução conserva a força e a amplitude da imagem hebraica sem restringir explicitamente os exércitos a uma única esfera.
- issue: Alcance escatológico da peregrinação das nações
  choice: Preservar literalmente a imagem profética, sem determinar seu esquema interpretativo
  alternative: Entendê-la como peregrinação anual estritamente literal ou como representação simbólica da adoração universal
  rationale: O versículo descreve as nações restantes subindo anualmente para adorar e celebrar a festa, mas não define aqui como essa cena se relaciona com um esquema escatológico específico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém o verbo tradicional de peregrinação “subir”, o título régio e o nome divino transliterado. A nota explica a designação tradicional da festa sem sobrecarregar o texto principal.
