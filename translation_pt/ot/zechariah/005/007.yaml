  text: And behold[a], a lead disk was lifted up[b], and this was one woman sitting inside the ephah.
translation:
  language: pt
  text: E eis que um disco de chumbo[a] foi levantado, e esta era uma mulher sentada dentro do efa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um peso redondo de chumbo», «uma massa de chumbo» ou, mais literalmente, «um talento de chumbo». A expressão hebraica pode indicar uma massa pesada e arredondada de chumbo; aqui, ela parece servir de tampa para o efa.
    reason: lexical_alternative
  - marker: b
    text: O efa era uma medida para produtos secos e, por extensão, o recipiente usado para essa medida; por isso, algumas traduções dizem «cesto».
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força vívida da expressão deítica que introduz um novo elemento na visão, em registro profético digno e ainda corrente.
- source_word: כִּכַּר עֹפֶרֶת
  choice: um disco de chumbo
  rationale: כִּכָּר pode designar uma massa arredondada ou em forma de disco. A tradução mantém a imagem concreta sem concluir no texto principal que o objeto era formalmente uma tampa, embora pareça cumprir essa função no contexto.
- source_word: נִשֵּׂאת
  choice: foi levantado
  rationale: Expressa com clareza o sentido passivo do nifal e o movimento visível do objeto de chumbo.
- source_word: וְזֹאת אִשָּׁה אַחַת
  choice: e ali estava uma mulher
  rationale: Torna natural em português a oração nominal hebraica e localiza a mulher revelada quando o disco é levantado. O numeral אַחַת é representado naturalmente por «uma», sem impor a ênfase potencialmente excessiva de «uma única mulher».
- source_word: יוֹשֶׁבֶת
  choice: sentada
  rationale: Traduz diretamente a postura indicada pelo particípio feminino.
- source_word: בְּתוֹךְ הָאֵיפָה
  choice: dentro do efa
  rationale: «Dentro» verte בְּתוֹךְ de modo idiomático, e «efa» conserva o termo cultural concreto que percorre a visão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «E eis que» conserva o tom visionário do hebraico; «ali estava» evita uma construção nominal rígida, e «efa» mantém o referente cultural com explicação em nota.
