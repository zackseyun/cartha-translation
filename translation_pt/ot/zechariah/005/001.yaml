base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/001.yaml
  text: Then I turned and lifted my eyes and saw[a], and behold[b], a flying scroll.
translation:
  language: pt
  text: 'Então me virei, levantei os olhos e vi: eis um rolo voando.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como «voltei a levantar os olhos», introduzindo a nova cena visionária.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשׁוּב
  choice: tornei a
  rationale: שׁוב pode indicar voltar ou fazer algo novamente. Em ligação com «levantar os olhos», «tornei a» introduz naturalmente a nova cena visionária sem obrigar a ideia de uma virada física.
- source_word: וָאֶשָּׂא עֵינַי
  choice: levantar os olhos
  rationale: Preserva a imagem da expressão idiomática hebraica e é clara em português atual.
- source_word: וָאֶרְאֶה
  choice: vi
  rationale: Traduz diretamente a percepção visionária expressa por ראה.
- source_word: וְהִנֵּה
  choice: eis
  rationale: Mantém a função apresentativa e enfática de הִנֵּה em registro bíblico digno, mas corrente.
- source_word: מְגִלָּה
  choice: rolo
  rationale: No contexto antigo, מְגִלָּה designa um rolo para escrita; «rolo» é claro em português e evita sugerir o formato posterior de livro.
- source_word: עָפָה
  choice: voando
  rationale: O particípio feminino concorda com מְגִלָּה e descreve o rolo em pleno voo; a construção com gerúndio é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura brasileira. A formulação conserva a imagem hebraica de levantar os olhos e a vivacidade de «eis», com sintaxe natural e digna.
