  text: וַ/יֹּ֣אמֶר אֵלַ֔/י לִ/בְנֽוֹת לָ֥/הֿ בַ֖יִת בְּ/אֶ֣רֶץ שִׁנְעָ֑ר וְ/הוּכַ֛ן וְ/הֻנִּ֥יחָה שָּׁ֖ם עַל מְכֻנָתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: pt
  text: 'Ele me disse: “Para lhe construírem uma casa na terra de Sinar[a]. Quando a casa estiver pronta, ela será colocada ali sobre a sua base[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinar é o antigo nome associado à Babilônia no Antigo Testamento.
    reason: cross_reference
  - marker: b
    text: 'Ou: “ela será colocada ali sobre a sua base”. As formas femininas hebraicas podem referir-se à mulher chamada Maldade ou, de modo mais abstrato, à efa e ao seu conteúdo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Ele me disse
  rationale: Forma narrativa natural em português para introduzir a explicação do anjo; preserva explicitamente o destinatário da fala.
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: Vão construir para ela uma casa
  rationale: O infinitivo com ל expressa finalidade. A formulação verbal completa em português decorre naturalmente da pergunta e resposta do contexto imediato, mantendo a mulher personificada como beneficiária.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: na terra de Sinar
  rationale: Mantém o topônimo antigo em vez de substituí-lo interpretativamente por Babilônia.
- source_word: וְהוּכַן
  choice: Quando a casa estiver pronta
  rationale: O hofal de כון indica que algo é preparado, estabelecido ou aprontado. O antecedente mais provável é בַּיִת, ‘casa’; explicitá-lo evita a ambiguidade criada apenas pelo gênero gramatical português.
- source_word: וְהֻנִּיחָה
  choice: ela será colocada ali
  rationale: A forma verbal feminina singular retoma naturalmente a mulher identificada como Maldade na visão. A voz passiva expressa com clareza o ato de instalá-la no lugar preparado.
- source_word: עַל מְכֻנָתָהּ
  choice: sobre a sua base
  rationale: מְכוּנָה designa uma base, suporte ou pedestal fixo. ‘Base’ é direto e não acrescenta por si só uma conotação cultual que o termo não exige.
theological_decisions:
- issue: Referente das formas femininas na oração final
  choice: As formas femininas são apresentadas como referência à mulher, a Maldade personificada, que será colocada sobre a sua base.
  alternative: 'Elas podem ser entendidas de maneira mais abstrata com referência à efa ou ao seu conteúdo: ‘isso será colocado ali sobre a sua base’.'
  rationale: A mulher identificada como Maldade em Zacarias 5:8 é o referente literário mais imediato. A tradução mantém essa personificação, enquanto a nota registra a ambiguidade real sem impor uma resolução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção ‘Vão construir’ torna natural a resposta elíptica do hebraico no contexto, sem identificar agentes não nomeados. Os marcadores foram posicionados junto ao conteúdo que cada nota explica.
