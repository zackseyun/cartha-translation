  terminology: “Sinar”, “Maldade”, “efa” e “base” são escolhas adequadas. A nota alternativa deve manter a ambiguidade do referente sem empregar o demonstrativo neutro “isso”, que não corresponde bem à morfologia feminina em discussão.
