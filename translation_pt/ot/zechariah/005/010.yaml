  yaml_path: translation/ot/zechariah/005/010.yaml
  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
translation:
  language: pt
  text: 'Então disse ao anjo que falava comigo: “Para onde elas estão levando a efa[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cesto” ou “o cesto de medir”. Em hebraico, “a efa”, uma medida padrão para produtos secos, aqui se refere ao recipiente visto na visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então perguntei
  rationale: O wayyiqtol dá sequência à narrativa. Como a fala introduzida é uma pergunta, “perguntei” é natural em português e comunica adequadamente o ato de dizer no contexto.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ possa significar “mensageiro”, no contexto visionário de Zacarias trata-se do mensageiro celestial que interpreta a visão; “anjo” é a forma clara e corrente.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: A fórmula recorrente em Zacarias emprega בִּי com o sentido idiomático de interação, “comigo”, não “em mim”. O particípio é bem representado pelo imperfeito “falava”.
- source_word: אָנָה
  choice: Para onde
  rationale: O advérbio interroga explicitamente o destino. “Para onde” preserva essa direção e é idiomático em português moderno.
- source_word: הֵמָּה
  choice: elas
  rationale: O pronome feminino plural retoma as duas mulheres do versículo anterior. Em português, “elas” mantém claramente o referente e concorda com o verbo.
- source_word: מוֹלִכוֹת
  choice: estão levando
  rationale: O particípio hifil feminino plural de הלך descreve o transporte da efa. A construção progressiva comunica naturalmente a ação observada na visão.
- source_word: אֶת הָאֵיפָה
  choice: a efa
  rationale: Mantém o termo hebraico para a medida de secos e preserva a continuidade lexical da visão, na qual ele também designa o recipiente. A nota esclarece esse uso ao leitor moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. Conserva-se “efa” no texto para manter a imagem e a continuidade do original, com explicação em nota.
