  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הוֹצֵאתִ֗י/הָ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/בָ֨אָה֙ אֶל בֵּ֣ית הַ/גַּנָּ֔ב וְ/אֶל בֵּ֛ית הַ/נִּשְׁבָּ֥ע בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/לָ֨נֶה֙ בְּ/ת֣וֹךְ בֵּית֔/וֹ וְ/כִלַּ֖תּ/וּ וְ/אֶת עֵצָ֥י/ו וְ/אֶת אֲבָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: pt
  text: “Eu a enviei[a]”, declara Yahweh dos Exércitos, “e ela entrará na casa do ladrão e na casa daquele que jura falsamente pelo meu nome. Ela permanecerá[b] dentro da casa dele e a consumirá, tanto a sua madeira como as suas pedras.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu a fiz sair”. O verbo hebraico pode ser traduzido mais literalmente assim; neste contexto, porém, tem o sentido de enviar a maldição para realizar sua obra.
    reason: lexical_alternative
  - marker: b
    text: Ou “ela ficará alojada” ou “ela passará a noite”. O verbo hebraico ressalta que a maldição não apenas entra na casa, mas permanece nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: Eu a enviei
  rationale: O hifil de יצא expressa a ação divina de fazer sair ou enviar, e o sufixo feminino retoma a maldição, representada pelo rolo no contexto. “Enviei” comunica com naturalidade que Yahweh a manda para executar o juízo.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: Mantém a fórmula profética solene, translitera o nome divino e traduz צְבָאוֹת de modo transparente e tradicional em português.
- source_word: וּבָאָה
  choice: e ela entrará
  rationale: Embora o verbo signifique literalmente “vir”, a construção com אֶל e “casa” indica ingresso. O pronome feminino preserva a concordância hebraica com a maldição.
- source_word: בֵּית הַגַּנָּב
  choice: a casa do ladrão
  rationale: Tradução direta e corrente de גַּנָּב, sem ampliar o sentido para roubo violento.
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: aquele que jura falsamente pelo meu nome
  rationale: Expressa de modo idiomático o ato de invocar o nome de Deus em um juramento falso, preservando a gravidade religiosa e jurídica da expressão.
- source_word: וְלָנֶה
  choice: Ela permanecerá
  rationale: לון pode indicar alojar-se ou passar a noite; no contexto, ressalta que a maldição continuará dentro da casa até consumi-la. A nota preserva a imagem lexical mais concreta.
- source_word: בְּתוֹךְ בֵּיתוֹ
  choice: dentro da casa dele
  rationale: Comunica claramente a localização no interior da casa e evita ambiguidade quanto ao possuidor.
- source_word: וְכִלַּתּוּ
  choice: e a consumirá
  rationale: O piel de כלה indica levar ao fim, consumir ou destruir por completo. “Consumirá” conserva a imagem vigorosa da maldição que acaba com toda a estrutura.
- source_word: עֵצָיו וְאֶת אֲבָנָיו
  choice: tanto a sua madeira como as suas pedras
  rationale: Preserva os elementos concretos da construção e enfatiza a destruição total da casa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Referente dos verbos e pronomes femininos
  choice: a maldição, retomada por “a/ela”
  alternative: o rolo, com pronomes masculinos em português
  rationale: No contexto imediato, o referente apresentado em Zacarias 5:3 é “esta é a maldição”; a morfologia feminina do hebraico em הוֹצֵאתִיהָ, וּבָאָה e וְלָנֶה favorece manter a referência à maldição, sem apagar sua associação com o rolo voador.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fala divina foi delimitada por aspas para tornar transparente a mudança de voz. Mantiveram-se a imagem concreta da casa consumida e a concordância feminina da maldição.
