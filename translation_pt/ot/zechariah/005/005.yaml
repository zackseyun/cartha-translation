base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: pt
  text: 'Então o anjo que falava comigo saiu e me disse: “Por favor, levante os olhos e veja o que é isto que está saindo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Traduz diretamente o verbo comum יָצָא, que pode indicar ‘sair’ visto como ir ou vir, sem acrescentar a ideia interpretativa de ‘avançar’.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar ‘mensageiro’, o contexto visionário e interpretativo de Zacarias favorece ‘anjo’.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: A expressão hebraica traz literalmente ‘que falava em mim’, mas neste contexto funciona idiomaticamente como comunicação com o profeta. O imperfeito ‘falava’ expressa adequadamente o particípio.
- source_word: וַיֹּאמֶר אֵלַי
  choice: e me disse
  rationale: Formulação narrativa natural em português para o verbo seguido de אֵלַי, preservando o sentido de fala dirigida ao profeta.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Por favor, levante os olhos
  rationale: Mantém a imagem da expressão hebraica e representa נָא como partícula cortês, em linguagem portuguesa natural e digna.
- source_word: וּרְאֵה
  choice: e veja
  rationale: Equivalente direto e natural do imperativo de רָאָה.
- source_word: מָה הַיּוֹצֵאת הַזֹּאת
  choice: o que é isto que está saindo
  rationale: Preserva a construção interrogativa e o aspecto contínuo do particípio feminino, sem antecipar a identificação do objeto no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a repetição do campo lexical de ‘sair’ nas duas ocorrências de יָצָא e conserva a identificação ainda indefinida do objeto visionário.
