  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: pt
  text: 'E ele me disse: “O que você vê?” E eu disse: “Vejo um rolo voando. Seu comprimento é de vinte côvados[a], e sua largura é de dez côvados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O côvado era uma unidade antiga de comprimento, aproximadamente a distância entre o cotovelo e a ponta dos dedos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: E ele me perguntou
  rationale: A forma verbal introduz a fala e faz a narrativa avançar. Como a fala é uma pergunta, “me perguntou” é natural em português e comunica com precisão a função do enunciado.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê?
  rationale: O particípio רֹאֶה tem sentido presente neste contexto. “O que você vê?” é a formulação corrente e direta em português moderno.
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: 'Eu respondi: “Vejo'
  rationale: Embora אָמַר signifique literalmente “dizer”, “respondi” expressa naturalmente a relação entre pergunta e resposta sem acrescentar conteúdo. “Vejo” preserva o sentido presente do particípio.
- source_word: מְגִלָּה
  choice: rolo
  rationale: O termo designa um documento enrolado. “Rolo” é a designação bíblica corrente e inteligível em português; o contexto posterior deixa clara sua função escrita.
- source_word: עָפָה
  choice: voando
  rationale: O particípio feminino modifica “rolo” e apresenta a imagem vívida de um rolo em voo, sem explicitação adicional.
- source_word: אָרְכָּהּ
  choice: Seu comprimento
  rationale: Expressa diretamente a dimensão longitudinal do rolo em português contemporâneo.
- source_word: עֶשְׂרִים בָּאַמָּה
  choice: vinte côvados
  rationale: Mantém a unidade antiga e a precisão numérica do hebraico, com nota cultural explicativa.
- source_word: וְרָחְבָּהּ
  choice: e sua largura
  rationale: “Largura” é o equivalente dimensional natural em contraste com “comprimento”.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez côvados
  rationale: Conserva a medida original; a estrutura “sua largura é de” torna desnecessário acrescentar “de largura”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” no diálogo por naturalidade ampla e preserva a unidade cultural antiga em vez de convertê-la. O marcador da nota foi colocado após a primeira ocorrência de “côvados”, à qual a explicação se aplica.
