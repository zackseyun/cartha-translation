  source_fidelity: 'A tradução representa com precisão a sequência visionária hebraica: o levantar dos olhos, a fórmula enfática «eis que», as duas mulheres que saem, o vento nas asas, a comparação com asas de cegonha, o transporte do efa e a localização entre a terra e os céus. «Vinham saindo» reproduz adequadamente o valor durativo do particípio no cenário da visão.'
