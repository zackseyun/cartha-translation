  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: pt
  text: 'Então levantei os olhos e vi: eis que duas mulheres vinham saindo, e havia vento em suas asas. Elas tinham asas como as da cegonha e ergueram o efa[a] entre a terra e os céus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cesto de medida”. O efa era uma medida padrão para produtos secos e, aqui, refere-se ao recipiente visto na visão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre a terra e o céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Então levantei os olhos
  rationale: Conserva a expressão visionária hebraica de modo natural em português; “Então” representa a progressão narrativa do waw no contexto.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'e vi: eis que'
  rationale: Mantém a vivacidade e a força dêitica de הִנֵּה; os dois-pontos tornam a sequência idiomática em português.
- source_word: שְׁתַּיִם נָשִׁים
  choice: duas mulheres
  rationale: Tradução direta que preserva o gênero explicitamente indicado no hebraico.
- source_word: יֹצְאוֹת
  choice: vinham saindo
  rationale: O particípio apresenta uma ação em andamento dentro da cena visionária; a formulação expressa movimento percebido pelo observador sem definir em excesso o ponto de origem.
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: e havia vento em suas asas
  rationale: רוּחַ pode significar “vento” ou “espírito”, mas as asas, a comparação com a cegonha e o transporte pelo ar favorecem o sentido concreto de “vento”. A construção existencial é natural em português.
- source_word: וְלָהֵנָּה כְנָפַיִם
  choice: Elas tinham asas
  rationale: A construção hebraica de posse é expressa de maneira idiomática, com o pronome retomando claramente as duas mulheres.
- source_word: כְּכַנְפֵי הַחֲסִידָה
  choice: como as da cegonha
  rationale: חֲסִידָה designa a cegonha; a elipse de “asas” evita repetição sem perder a comparação explícita.
- source_word: וַתִּשֶּׂאנָה
  choice: ergueram
  rationale: נשׂא pode significar levantar ou carregar; aqui “ergueram” combina com o movimento aéreo e com a expressão espacial seguinte.
- source_word: אֶת־הָאֵיפָה
  choice: o efa
  rationale: Mantém no texto o nome da medida hebraica que também designa o recipiente da visão, preservando a continuidade lexical; a nota esclarece o objeto.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: entre a terra e os céus
  rationale: Preserva o contraste cósmico e representa o plural morfológico שָּׁמָיִם de forma digna e compreensível em português.
theological_decisions:
- issue: Sentido de רוּחַ na cena visionária de transporte
  choice: vento
  alternative: espírito
  rationale: O contexto imediato descreve voo físico — asas, a imagem da cegonha e o levantamento do efa entre terra e céus. “Vento” preserva a imagem concreta sem introduzir um sentido teológico que o contexto não exige.
- issue: Representação de אֵיפָה na visão profética
  choice: o efa
  alternative: o cesto de medida
  rationale: O termo hebraico designa uma medida padrão de secos e, nesta visão, o recipiente associado a ela. Manter “efa” preserva a imagem-chave e a continuidade lexical; a explicação cabe melhor em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis que” foi mantido por sua força visionária e por ainda ser compreensível; “efa” recebe explicação em nota. Os marcadores foram colocados junto aos termos que efetivamente explicam.
