base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: pt
  text: 'Ele disse: “Esta é a Maldade”, e a lançou para dentro do efa[a] e lançou a pedra de chumbo[b] sobre a abertura dele[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O efa era uma medida de capacidade para produtos secos e também o recipiente correspondente; aqui designa o recipiente visto na visão.
    reason: cultural_note
  - marker: b
    text: Literalmente, “a pedra de chumbo”; também pode ser entendida como “o peso de chumbo”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre a boca dele”, isto é, sobre a abertura do efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: a Maldade
  rationale: O substantivo abstrato feminino definido significa “a maldade” e, na visão, identifica de forma personificada a mulher. A inicial maiúscula sinaliza essa personificação sem transformar o termo em “mulher má”.
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: a lançou
  rationale: שׁלך significa “lançar, atirar”. O pronome objeto feminino retoma a mulher, identificada como a Maldade; “a lançou” preserva o gênero e a ação enérgica do hebraico.
- source_word: אֶל תּוֹךְ הָאֵיפָה
  choice: para dentro do efa
  rationale: תּוֹךְ indica o interior ou meio de algo. “Para dentro” expressa naturalmente o movimento ao interior do recipiente, enquanto “efa” conserva o termo cultural do texto.
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: a pedra de chumbo
  rationale: A expressão significa literalmente “pedra de chumbo”. A tradução mantém a imagem concreta e evita decidir sem necessidade que o objeto era propriamente um peso ou uma tampa.
- source_word: אֶל פִּיהָ
  choice: sobre a abertura dele
  rationale: פֶּה significa literalmente “boca”, mas, aplicado a um recipiente, “abertura” é o equivalente natural. O pronome retoma o efa, masculino em português.
theological_decisions:
- issue: Personificação da maldade na visão
  choice: “Esta é a Maldade”, com substantivo abstrato personificado e pronome feminino
  alternative: “Esta é a maldade” ou “Esta é a mulher má”
  rationale: O hebraico identifica a figura feminina com o substantivo abstrato רִשְׁעָה. A tradução preserva essa identificação e sua personificação sem reduzi-la a mera qualidade moral nem acrescentar uma interpretação ontológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Efa” preserva o elemento cultural, explicado em nota; “Maldade” com maiúscula torna perceptível a personificação já presente na visão.
