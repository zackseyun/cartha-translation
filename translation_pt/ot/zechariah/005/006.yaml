base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: pt
  text: 'Eu disse: “O que é isso?” Ele respondeu: “Este é o cesto[a] que está saindo”. E ele disse: “Esta é a aparência deles em toda a terra[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “efa”, uma medida de capacidade para produtos secos e, por extensão, o recipiente usado para essa medida.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “Este é o olho deles em toda a terra”. Muitos entendem a expressão no sentido de “a aparência deles” ou “o que se vê deles”; outros, seguindo uma leitura ou interpretação alternativa, traduzem: “Esta é a iniquidade deles em toda a terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: cesto
  rationale: Embora אֵיפָה designe propriamente a medida seca chamada efa, nesta visão o termo se refere, por metonímia, ao recipiente de medição. “Cesto” comunica de modo claro o objeto concreto visto, enquanto a nota preserva o termo técnico.
- source_word: הַיּוֹצֵאת
  choice: que está saindo
  rationale: O particípio feminino de יצא, com artigo, qualifica o cesto como algo em movimento. A forma progressiva preserva naturalmente esse aspecto em português.
- source_word: עֵינָם
  choice: a aparência deles
  rationale: O texto massorético diz literalmente “o olho deles”. Em sentido figurado, עַיִן pode se referir ao aspecto visível ou à aparência. Essa tradução evita introduzir no texto principal a leitura alternativa “iniquidade”, mas mantém a dificuldade textual em nota.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: הָאָרֶץ pode significar “terra” no sentido regional ou mundial. A formulação portuguesa preserva essa amplitude sem impor “mundo inteiro” nem restringir explicitamente a referência à terra de Israel.
- source_word: מַה הִיא
  choice: O que é isso?
  rationale: O pronome feminino concorda gramaticalmente com אֵיפָה, identificado em seguida. Em português, “isso” é a forma idiomática para perguntar sobre um objeto ainda não identificado.
theological_decisions:
- issue: Interpretação de עֵינָם na oração final
  choice: “a aparência deles” no texto principal
  alternative: “o olho deles” literalmente; ou “a iniquidade deles”, segundo uma leitura ou interpretação alternativa
  rationale: A vocalização massorética aponta para “olho”, expressão difícil no contexto. “Aparência” representa uma extensão semântica possível sem emendar o texto. A leitura “iniquidade”, teologicamente significativa e adotada por algumas versões, é registrada em nota em vez de ser inserida silenciosamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cesto” torna visível o objeto da visão; “efa” é explicado em nota. A repetição hebraica de ויאמר foi vertida como “E disse ainda” para manter a segunda introdução de fala sem produzir uma sequência artificial em português. A referência plural de “deles” permanece sem explicitação, preservando a ambiguidade do texto-fonte.
