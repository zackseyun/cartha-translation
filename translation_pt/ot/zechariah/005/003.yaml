    issue: “será eliminado” fixa de modo excessivamente específico o sentido de נִקָּה.
    rationale: No contexto da maldição, o verbo não indica absolvição positiva, mas sua formulação é lexical e sintaticamente difícil. “Será removido” conserva a consequência judicial sem impor uma modalidade particular de eliminação.
