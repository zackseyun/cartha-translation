  to: 'Então ele me disse: “Esta é a maldição que sai por toda a terra[a], pois todo aquele que rouba será removido[b], conforme o que está escrito em um lado do rolo[c], e todo aquele que jura será removido, conforme o que está escrito no outro lado[d].”'
  rationale: A revisão retira do texto principal a qualificação interpretativa “falsamente”, preservando-a em nota com apoio em 5:4. Também troca “será eliminado” por “será removido”, opção judicialmente coerente mas menos restritiva para o difícil נִקָּה. A imagem de o rolo sair é restaurada, e a nota sobre os lados do rolo foi ajustada para distinguir a literalidade da interpretação contextual.
