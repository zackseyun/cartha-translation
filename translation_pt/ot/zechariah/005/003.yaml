  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: pt
  text: 'Então ele me disse: “Esta é a maldição que sai por toda a terra[a], pois todo aquele que rouba será removido[b], conforme o que está escrito em um lado do rolo[c], e todo aquele que jura será removido, conforme o que está escrito no outro lado[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por toda a terra” em sentido amplo, isto é, “pelo mundo inteiro”. O hebraico אֶרֶץ pode designar tanto uma terra, região ou país quanto a terra em sentido amplo.
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico é difícil neste contexto e também pode ser entendido como “ser declarado inocente”, “ficar impune” ou “ser purificado”. Como se trata de uma maldição contra transgressores, provavelmente indica remoção sob juízo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “deste, conforme ela ... deste, conforme ela”. A formulação é elíptica; no contexto do rolo voador, provavelmente se refere ao que está escrito nos dois lados do rolo.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “todo aquele que jura”. O juramento falso é explicitado no versículo 4.
    reason: contextual_clarification
lexical_decisions:
- source_word: הָאָלָה
  choice: a maldição
  rationale: No contexto da visão, o termo designa uma maldição de caráter judicial, embora também possa estar associado a um juramento solene.
- source_word: הַיּוֹצֵאת
  choice: que se espalha
  rationale: O particípio apresenta uma ação em curso. “Espalha-se” comunica em português natural que a maldição sai e alcança toda a região.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: por toda a terra
  rationale: אֶרֶץ pode designar a terra do povo ou a terra inteira. O contexto pós-exílico favorece aqui a região habitada pela comunidade, sem excluir a leitura mais ampla.
- source_word: הַגֹּנֵב
  choice: todo aquele que rouba
  rationale: O particípio substantivado tem sentido genérico e abrange qualquer pessoa que pratique o roubo.
- source_word: נִקָּה
  choice: será eliminado
  rationale: Embora o verbo possa expressar inocência ou isenção em outros contextos, a maldição judicial desta visão aponta para a remoção punitiva do transgressor. “Eliminado” preserva esse efeito sem acrescentar a imagem ritual sugerida por “purificado”.
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: conforme o que está escrito em um dos lados do rolo ... conforme o que está escrito no outro lado
  rationale: A expressão hebraica é elíptica e repete literalmente “deste” nas duas orações. O contexto imediato do rolo voador torna provável a referência às inscrições em seus dois lados; a explicitação é assinalada em nota.
- source_word: הַנִּשְׁבָּע
  choice: todo aquele que jura falsamente
  rationale: O particípio diz literalmente “aquele que jura”, mas o contexto de transgressão e Zacarias 5:4 indicam juramento falso. A nota preserva a forma não especificada do hebraico.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra, entendida provavelmente como a região habitada pela comunidade
  alternative: toda a terra ou o mundo
  rationale: A visão de juízo está dirigida à comunidade restaurada na terra, mas a amplitude lexical do termo hebraico é preservada em nota.
- issue: Sentido de נִקָּה no contexto da maldição
  choice: 'remoção punitiva: “será eliminado”'
  alternative: “ficará impune”, “será absolvido” ou “será purificado”
  rationale: Uma absolvição positiva contrariaria o movimento da maldição contra os transgressores. Ainda assim, a dificuldade lexical genuína é registrada em nota.
- issue: Natureza do juramento condenado
  choice: juramento falso
  alternative: qualquer ato de jurar
  rationale: O adjetivo “falso” não aparece neste versículo, mas Zacarias 5:4 explicita que o juramento é falso. A tradução evita sugerir que todo juramento seja condenado.
translation_notes:
  register: Português contemporâneo, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A tradução mantém a imagem judicial da visão e sinaliza em notas as principais ambiguidades do hebraico.
