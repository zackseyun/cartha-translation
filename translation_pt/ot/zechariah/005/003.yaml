  naturalness: O português é claro e contemporâneo. “Que se espalha” é compreensível, mas “que sai” mantém melhor a imagem verbal da visão e continua natural. A explicitação dos lados do rolo pode ser mantida, desde que a nota deixe clara sua base contextual e o caráter elíptico da expressão.
  terminology: “Maldição” é apropriado para הָאָלָה. “Rolo” preserva a imagem do rolo voador do contexto imediato. O termo “juramento falso” deve ficar na nota contextual, não no corpo deste versículo.
