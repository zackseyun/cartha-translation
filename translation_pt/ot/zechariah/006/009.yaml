lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: A forma narrativa introduz a sequência do relato. Em português, a construção com “E” e o verbo “veio”, ligado ao sujeito seguinte, preserva naturalmente a fórmula profética sem recorrer ao literalismo “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, “a palavra” mantém a expressão tradicional e a ligação com o vocabulário bíblico; “mensagem” seria possível, mas menos formalmente correspondente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: 'A preposição com o sufixo de primeira pessoa indica diretamente o destinatário da palavra: o profeta.'
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala divina que vem a seguir; “dizendo” reproduz de modo claro e formal a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pessoal no texto, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com preservação da fórmula profética. A vírgula antes de “dizendo” ajuda a indicar que o conteúdo da fala continua no versículo seguinte.
