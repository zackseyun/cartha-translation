base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: pt
  text: Receba dos exilados — de Heldai, de Tobias[a] e de Jedaías — e, naquele mesmo dia, vá você mesmo à casa de Josias, filho de Sofonias, para a qual eles vieram da Babilônia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tobias” é a forma portuguesa tradicional do nome; uma transliteração mais próxima do hebraico seria “Tobijá”.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico está no plural: “eles vieram”. Refere-se mais naturalmente a Heldai, Tobias e Jedaías, e não apenas a Josias.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקוֹחַ
  choice: Receba
  rationale: O infinitivo absoluto qal tem força imperativa. No contexto de contribuições trazidas pelos recém-chegados, “receba” comunica naturalmente a ação, sem acrescentar ao versículo o objeto só explicitado no seguinte.
- source_word: מֵאֵת הַגּוֹלָה
  choice: dos exilados
  rationale: הַגּוֹלָה designa a comunidade exilada ou retornada, e não a condição abstrata de cativeiro.
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Transliteração clara e próxima da forma hebraica do nome.
- source_word: טוֹבִיָּה
  choice: Tobias
  rationale: Forma consagrada e facilmente reconhecível em português para este nome hebraico teofórico.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Forma portuguesa legível que representa o nome hebraico e seu elemento final -yāh.
- source_word: וּבָאתָ אַתָּה
  choice: vá você mesmo
  rationale: בוא pode indicar vir ou ir conforme a perspectiva; em português, “vá” expressa naturalmente o deslocamento de Zacarias, enquanto “você mesmo” preserva a ênfase do pronome explícito אַתָּה.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: A expressão temporal é vertida de modo natural, e “mesmo” comunica a imediatidade contextual sem alterar o referente demonstrativo.
- source_word: וּבָאתָ בֵּית
  choice: à casa de
  rationale: A coordenação hebraica repete בוא, mas em português uma única locução de movimento com destino evita repetição artificial sem afirmar de modo indevido que Zacarias entrou na casa.
- source_word: יֹאשִׁיָּה בֶן צְפַנְיָה
  choice: Josias, filho de Sofonias
  rationale: Emprega as formas portuguesas tradicionais dos nomes e verte diretamente o patronímico.
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: para onde eles vieram da Babilônia
  rationale: 'A construção locativa oferece em português uma leitura gramatical natural: o plural “eles vieram” remete aos três homens nomeados, e “para onde” liga sua chegada à casa de Josias sem fazer de Josias o antecedente plural.'
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com formas bíblicas correntes dos nomes. A redação preserva a ênfase sobre o próprio destinatário e explicita de maneira natural o referente plural da oração final. Todos os marcadores de nota aparecem no texto.
