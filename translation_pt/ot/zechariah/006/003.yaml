base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: pt
  text: e na terceira carruagem, cavalos brancos; e na quarta carruagem, cavalos malhados, fortes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “cavalos malhados — e cavalos fortes”, entendendo “fortes” como um grupo distinto, e não como uma segunda descrição dos cavalos da quarta carruagem.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: e na ... carruagem
  rationale: A preposição ב pode significar “em” ou “sobre”; neste contexto, “na carruagem” expressa naturalmente a vinculação dos cavalos a cada carruagem e acompanha de perto a construção hebraica.
- source_word: הַשְּׁלִשִׁית
  choice: terceira
  rationale: Adjetivo ordinal que modifica “carruagem”.
- source_word: סוּסִים
  choice: cavalos
  rationale: Equivalente comum e direto do substantivo plural, mantido nas duas orações.
- source_word: לְבָנִים
  choice: brancos
  rationale: Designação comum da cor branca, em concordância natural com “cavalos”.
- source_word: הָרְבִעִית
  choice: quarta
  rationale: Adjetivo ordinal que modifica “carruagem”.
- source_word: בְּרֻדִּים
  choice: malhados
  rationale: O termo indica aparência variegada, manchada ou salpicada; “malhados” é corrente em português para a pelagem de animais.
- source_word: אֲמֻצִּים
  choice: fortes
  rationale: Deriva de אמץ e comunica força ou vigor. “Fortes” é conciso, natural e preserva a posição final do adjetivo no hebraico.
theological_decisions:
- issue: Se אֲמֻצִּים descreve os cavalos malhados ou designa outro grupo de cavalos
  choice: No texto principal, “fortes” é entendido como uma segunda descrição dos cavalos da quarta carruagem.
  alternative: Ler “cavalos malhados — e cavalos fortes”, tomando o termo final como um grupo distinto.
  rationale: A sequência hebraica traz “cavalos”, seguida de dois adjetivos, sem repetir o substantivo, favorecendo a leitura de que ambos descrevem a mesma parelha. Como a sintaxe também pode ser entendida como referência a um grupo adicional, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “cavalos malhados, fortes” acompanha a sequência hebraica e mantém distintos os dois qualificativos; a pontuação sinaliza que “fortes” retoma “cavalos” sem tornar a frase excessivamente explicativa.
