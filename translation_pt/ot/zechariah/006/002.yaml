lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: na carruagem
  rationale: מֶרְכָּבָה designa uma carruagem, e o prefixo בְּ marca aqui localização ou associação. Em português, “na carruagem” expressa naturalmente os cavalos vinculados a cada carruagem na visão.
- source_word: הָרִאשֹׁנָה
  choice: a primeira
  rationale: O adjetivo ordinal indica a primeira carruagem na sequência da visão.
- source_word: סוּסִים
  choice: cavalos
  rationale: É o sentido comum do substantivo plural, sem necessidade de especificação adicional no contexto.
- source_word: אֲדֻמִּים
  choice: vermelhos
  rationale: O adjetivo de cor significa “vermelhos” e mantém a descrição visual direta do texto hebraico.
- source_word: וּבַמֶּרְכָּבָה
  choice: e na segunda
  rationale: A conjunção e a construção preposicional introduzem a segunda cláusula paralela. Em português, omitir a repetição de “carruagem” evita rigidez sem perder o referente.
- source_word: הַשֵּׁנִית
  choice: a segunda
  rationale: O ordinal marca a carruagem seguinte na sequência.
- source_word: שְׁחֹרִים
  choice: pretos
  rationale: É o sentido básico do adjetivo de cor e preserva o contraste visual com os cavalos vermelhos.
