id: ZEC.6.13
reference: Zechariah 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: pt
  text: Sim, ele construirá o templo de Yahweh, levará sobre si a majestade[a], sentará em seu trono e governará. Ele será sacerdote em seu trono[b], e haverá entre ambos um conselho de paz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levará sobre si a honra” ou “levará sobre si o esplendor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e haverá um sacerdote em seu trono”; o hebraico permite que alguns distingam o sacerdote do governante entronizado.
    reason: alternative_reading
  - marker: c
    text: “Entre ambos” pode referir-se às funções de rei e sacerdote ou a duas figuras distintas, como o governante e o sacerdote.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵיכַל יְהוָה
  choice: o templo de Yahweh
  rationale: הֵיכָל pode designar palácio ou templo; neste contexto, refere-se claramente ao santuário de Yahweh. O nome divino é transliterado como “Yahweh”, preservando o nome pessoal.
- source_word: יִשָּׂא הוֹד
  choice: levará sobre si a majestade
  rationale: A expressão combina o verbo “levar/carregar” com הוֹד, dignidade ou esplendor régio. “Levará sobre si a majestade” mantém a imagem concreta e o sentido real.
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: sentará em seu trono e governará
  rationale: A formulação conserva as ações distintas de sentar-se no trono e exercer domínio, em português natural.
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: Ele será sacerdote em seu trono
  rationale: A leitura mais direta mantém o mesmo sujeito masculino singular. A expressão incomum “em seu trono” é preservada para não eliminar a tensão entre sacerdócio e realeza.
- source_word: וַעֲצַת שָׁלוֹם
  choice: um conselho de paz
  rationale: עֵצָה pode significar conselho, plano ou propósito. “Conselho de paz” preserva tanto o aspecto deliberativo quanto o possível sentido de propósito pacífico.
- source_word: בֵּין שְׁנֵיהֶם
  choice: entre ambos
  rationale: A expressão é deliberadamente concisa e não identifica os dois referentes. “Entre ambos” preserva essa ambiguidade.
theological_decisions:
- issue: A identidade do sacerdote e do governante entronizado
  choice: 'Manter um único sujeito no texto principal: “Ele será sacerdote em seu trono”.'
  alternative: Entender “um sacerdote” como segunda figura, distinta do governante entronizado.
  rationale: A sequência gramatical favorece a continuidade do sujeito singular, mas a expressão final “entre ambos” permite distinguir duas figuras. A tradução principal segue a sintaxe mais direta, e a nota registra a alternativa sem impor uma síntese doutrinária.
- issue: O referente de “entre ambos”
  choice: Deixar os referentes sem identificação explícita.
  alternative: 'Interpretar a expressão como referência às funções régia e sacerdotal reunidas numa pessoa, ou a duas pessoas distintas: governante e sacerdote.'
  rationale: O hebraico não esclarece se os dois são pessoas ou funções. Especificá-los no texto resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A repetição enfática dos pronomes hebraicos foi representada por “Sim” e pela retomada de “Ele”, sem tornar o período artificial. As notas foram posicionadas junto às expressões a que efetivamente se referem.
