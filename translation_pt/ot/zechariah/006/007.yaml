  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: pt
  text: 'Os fortes[a] saíram e procuraram ir, para percorrer a terra[b]. Então ele disse: “Vão, percorram a terra”; e eles percorreram a terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os malhados”. Tradicionalmente, a expressão é entendida como uma designação da cor dos cavalos ou das parelhas; o hebraico vocalizado no Texto Massorético é mais naturalmente lido como “os fortes”.
    reason: alternative_reading
  - marker: b
    text: Ou “o país”. O termo hebraico pode significar tanto “terra” quanto “país”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: os fortes
  rationale: O adjetivo derivado de אמץ normalmente expressa força ou vigor. A vocalização massorética favorece “os fortes”, embora o contexto das cores dos cavalos torne relevante registrar em nota a leitura tradicional “os malhados”.
- source_word: יָצְאוּ
  choice: saíram
  rationale: יצא é o verbo comum para sair. “Saíram” é natural em português e não impõe uma perspectiva espacial ausente do contexto imediato.
- source_word: וַיְבַקְשׁוּ לָלֶכֶת
  choice: procuraram ir
  rationale: בקש seguido do infinitivo pode indicar tentativa, empenho ou desejo. “Procuraram ir” preserva essa abertura sem especificar indevidamente a motivação.
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: percorrer / percorram / percorreram
  rationale: O hitpael de הלך indica movimento reiterado ou por uma extensão. “Percorrer” transmite isso com naturalidade, preserva a repetição lexical e evita a interpretação mais específica de “patrulhar”.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região ou país. O contexto visionário favorece “a terra”, mantendo-se “o país” como alternativa em nota.
- source_word: וַיֹּאמֶר
  choice: ele disse
  rationale: O verbo está no masculino singular e tem sujeito implícito. O contexto permite a referência ao personagem que dá a ordem, sem ser necessário identificá-lo mais precisamente.
- source_word: לְכוּ
  choice: Vão
  rationale: É o imperativo masculino plural simples de הלך; “Vão” é sua correspondência direta e natural em português.
theological_decisions:
- issue: Alcance de אֶרֶץ na visão
  choice: a terra
  alternative: o país / a terra de Israel
  rationale: A movimentação dos agentes divinos em várias direções favorece alcance mundial, mas o substantivo hebraico mantém lexicalmente a possibilidade de um território específico; a alternativa é preservada em nota.
- issue: Identidade de הָאֲמֻצִּים
  choice: os fortes
  alternative: os malhados
  rationale: A vocalização do Texto Massorético aponta para um adjetivo relacionado à força. Como os versículos próximos distinguem cavalos por cores, a leitura tradicional como designação de cor merece constar em nota, sem substituir a forma massorética no texto principal.
- issue: Natureza da movimentação expressa pelo hitpael de הלך
  choice: percorrer
  alternative: patrulhar / andar de um lado para outro
  rationale: “Percorrer” conserva a ideia de movimento por toda uma área sem acrescentar explicitamente uma função militar ou fiscalizadora.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Percorrer” foi repetido nas três ocorrências para reproduzir a coesão verbal hebraica. O texto conserva a aparente redundância de “procuraram ir, para percorrer”, em vez de simplificá-la interpretativamente.
