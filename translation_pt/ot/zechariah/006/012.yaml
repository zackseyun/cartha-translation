  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: pt
  text: 'E diga-lhe: “Assim diz Yahweh dos Exércitos: Eis um homem — seu nome é Renovo. Ele brotará de onde está[a] e construirá o templo de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “de debaixo dele brotará”.'
    reason: Registra a formulação espacial comprimida e ambígua do hebraico וּמִתַּחְתָּיו יִצְמָח.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Comunica de modo concreto e compreensível o sentido de צְבָאוֹת, mantendo a fórmula profética “Yahweh dos Exércitos”.
- source_word: הִנֵּה
  choice: Eis
  rationale: Conserva a força apresentativa e solene da interjeição hebraica em português digno e corrente.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o gênero masculino e a referência a uma figura humana específica.
- source_word: צֶמַח
  choice: Renovo
  rationale: Emprega um substantivo de imagem vegetal como nome ou título, preservando a ressonância profética sem acrescentar explicitamente “Messias”.
- source_word: שְׁמוֹ
  choice: seu nome é
  rationale: Reproduz naturalmente a fórmula hebraica de nomeação, com “Renovo” em posição predicativa.
- source_word: וּמִתַּחְתָּיו
  choice: de onde está
  rationale: Expressa em português natural a ideia contextual de crescimento a partir do próprio lugar da figura; a forma mais literal e ambígua é conservada em nota.
- source_word: יִצְמָח
  choice: brotará
  rationale: Mantém a imagem botânica e a relação lexical com o nome “Renovo”, ainda que o português não permita reproduzir plenamente o jogo de palavras hebraico sem artificialidade.
- source_word: וּבָנָה
  choice: e construirá
  rationale: Conserva a sequência futura da profecia e explicita naturalmente o sujeito já mencionado.
- source_word: הֵיכַל
  choice: o templo
  rationale: No contexto, designa claramente o templo de Yahweh; esta é a equivalência portuguesa normal e transparente.
theological_decisions:
- issue: Força messiânica de צֶמַח
  choice: Traduzir como o nome ou título “Renovo”, sem tornar explícita a identificação messiânica.
  alternative: Traduzir como substantivo comum, “broto” ou “rebento”, ou inserir “Messias”.
  rationale: A sintaxe “seu nome é Renovo” favorece o uso como designação. O contexto profético traz ressonância messiânica, mas o texto não emprega aqui o termo “Messias”; a tradução preserva essa tensão sem ampliá-la.
- issue: Referente da figura que constrói o templo
  choice: Manter apenas “um homem” e os verbos na terceira pessoa, sem identificar a figura além do que o versículo declara.
  alternative: Identificá-la explicitamente como Josué ou como o Messias.
  rationale: A interpretação da figura é debatida, e o hebraico deste versículo não resolve expressamente a identidade. A redação conserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Eis” e “Renovo” sustentam o tom profético sem tornar a frase excessivamente arcaica. O travessão destaca a fórmula de nomeação presente no hebraico.
