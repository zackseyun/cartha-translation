  naturalness: O português é atual, claro e adequado ao registro. «E vocês saberão» é igualmente natural e mais neutro do que «Então vocês saberão».
  terminology: «Yahweh», «Yahweh dos Exércitos», «templo» e «voz de Yahweh, seu Deus» são escolhas consistentes e adequadas. «Os que estão longe» conserva corretamente a indeterminação do hebraico.
