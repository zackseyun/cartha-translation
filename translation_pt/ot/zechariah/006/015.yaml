base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: pt
  text: Os que estão longe[b] virão e construirão no templo de Yahweh[a]. E vocês saberão que Yahweh dos Exércitos me enviou a vocês. Isso acontecerá se vocês obedecerem atentamente à voz de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “o SENHOR”.
    reason: lexical_alternative
  - marker: b
    text: “Os que estão longe” pode referir-se a pessoas geograficamente distantes, como exilados, e também pode ter um sentido mais amplo, sem especificar o grupo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: os que estão longe
  rationale: O adjetivo plural é substantivado e se refere a pessoas distantes, sem definir se a distância é apenas geográfica ou também possui alcance mais amplo.
- source_word: יָבֹאוּ וּבָנוּ
  choice: virão e construirão
  rationale: Expressa naturalmente em português a sequência futura das duas ações proféticas.
- source_word: בְּהֵיכַל יְהוָה
  choice: no templo de Yahweh
  rationale: Neste contexto, הֵיכָל designa o santuário; a preposição indica participação na construção relacionada ao templo.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O conectivo admite aqui uma leitura de resultado, expressa de modo natural por 'então'.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e torna צְבָאוֹת transparente ao leitor moderno, mantendo a força marcial e cósmica do título.
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: me enviou a vocês
  rationale: O perfeito apresenta o envio como ação concluída; 'a vocês' reproduz o destinatário plural.
- source_word: וְהָיָה
  choice: Isso acontecerá
  rationale: Formulação idiomática em português para introduzir a realização condicionada do que precede.
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: se vocês obedecerem atentamente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica שמע; 'obedecerem' comunica a escuta responsiva, e 'atentamente' conserva a ênfase.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: à voz de Yahweh, seu Deus
  rationale: Mantém a imagem hebraica da voz divina e a fórmula pactual, com pontuação natural em português.
theological_decisions:
- issue: Identidade e alcance de 'os que estão longe'
  choice: Formulação genérica, sem identificar explicitamente o grupo.
  alternative: Exilados judeus, israelitas da diáspora ou gentios distantes.
  rationale: O hebraico não especifica quem são essas pessoas; a tradução preserva a abertura profética.
- issue: Relação da cláusula condicional com a promessa
  choice: A condição é mantida após o conjunto da promessa, sem delimitar além da sintaxe hebraica o seu alcance exato.
  alternative: Entendê-la apenas como exortação geral ou como condição ligada somente ao reconhecimento de que Yahweh enviou o profeta.
  rationale: A sequência hebraica apresenta uma condição real, mas não esclarece de maneira inequívoca cada aspecto de sua relação com as afirmações anteriores.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'vocês' para o plural e translitera o nome divino como 'Yahweh'. A redação conserva a ambiguidade quanto aos distantes e ao alcance da condição final.
