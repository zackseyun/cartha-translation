base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/008.yaml
  text: Then he called out to me and spoke to me[a], saying, “See, those going out to the land of the north have set my Spirit at rest in the land of the north.”
translation:
  language: pt
  text: 'Então ele gritou para mim e disse: “Veja: os que saem para a terra do norte fizeram o meu Espírito repousar[a] na terra do norte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deram descanso ao meu espírito”. A expressão também pode indicar que a ira ou o desagrado judicial de Deus foi aplacado na terra do norte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: chamou em alta voz
  rationale: O verbo זעק indica um grito ou chamado forte. A expressão preserva a intensidade audível sem atribuir uma emoção específica.
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  choice: me disse
  rationale: A fórmula hebraica introduz discurso direto. Em português atual, “me disse” comunica seu sentido com naturalidade, sem reproduzir de modo rígido a construção “falou comigo, dizendo”.
- source_word: רְאֵה
  choice: Veja!
  rationale: O imperativo chama a atenção para o que segue. “Veja!” é atual, claro e digno.
- source_word: הַיּוֹצְאִים
  choice: os que saem
  rationale: O particípio hebraico apresenta a ação em curso; o presente em português preserva esse aspecto sem convertê-lo em passado simples.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: para a terra do norte
  rationale: Mantém a expressão geográfica e direcional do hebraico sem identificar de maneira interpretativa uma nação específica.
- source_word: הֵנִיחוּ
  choice: fizeram ... repousar
  rationale: A forma causativa de נוח expressa fazer descansar, assentar ou aquietar. Esta tradução conserva a causatividade e evita reduzir a expressão diretamente a “aplacaram a minha ira”.
- source_word: רוּחִי
  choice: meu Espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. Neste contexto profético, o referente mais provável é o próprio Espírito ou a disposição de Deus; a tradução preserva o termo e deixa sua nuance contextual em aberto.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: na terra do norte
  rationale: A repetição da expressão hebraica é mantida por sua ênfase retórica e pela ligação clara com o destino dos que saem.
theological_decisions:
- issue: Sentido de “meu Espírito” na expressão “fizeram o meu Espírito repousar”
  choice: Conservar “meu Espírito” e a imagem de fazê-lo repousar.
  alternative: Traduzir de forma interpretativa como “aplacaram a minha ira” ou entender רוּחִי como “meu espírito/minha disposição”.
  rationale: O hebraico permite que a expressão se refira ao Espírito de Deus ou à sua disposição, possivelmente indicando que sua ira ou ação judicial foi satisfeita no norte. O texto principal mantém a tensão teológica, enquanto a nota registra a nuance possível sem transformá-la na única leitura.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Evitou-se tanto o arcaísmo quanto a explicitação doutrinária excessiva; a repetição de “terra do norte” foi preservada deliberadamente.
