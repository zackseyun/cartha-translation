  to: 'Então ele gritou para mim e disse: “Veja: os que saem para a terra do norte fizeram o meu Espírito repousar[a] na terra do norte.”'
  rationale: A revisão limita-se a substituir “me chamou em alta voz” por “gritou para mim”, a fim de preservar com maior precisão a força de זעק e evitar a leitura de uma simples convocação. Mantêm-se a linguagem moderna, a causatividade de “fizeram ... repousar”, a capitalização adotada para “Espírito”, a ambiguidade teológica explicada em nota e a repetição de “terra do norte”.
