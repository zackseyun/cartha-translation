source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: pt
  text: Os cavalos pretos que estão nele saem para a terra do norte, os brancos saíram atrás deles, e os malhados saíram para a terra do sul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a terra de Temã”, entendendo תֵּימָן como o nome do lugar Temã, e não como o termo direcional “sul”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: que estão nele
  rationale: Retoma o carro mencionado no contexto anterior. A oração relativa preserva explicitamente tanto a referência quanto o sentido locativo do hebraico.
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: os cavalos pretos
  rationale: Tradução direta e natural do substantivo com o adjetivo de cor.
- source_word: יֹצְאִים
  choice: saem
  rationale: O particípio apresenta a ação de modo vívido ou em andamento; o presente narrativo é natural em português e mantém esse caráter.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: para a terra do norte
  rationale: Preserva de forma clara a expressão hebraica e seu paralelismo com “terra do sul”.
- source_word: וְהַלְּבָנִים
  choice: os brancos
  rationale: O hebraico omite o substantivo já expresso; o português pode conservar naturalmente essa elipse.
- source_word: יָצְאוּ
  choice: saíram
  rationale: O qatal apresenta a ação como realizada dentro da sequência da visão, em contraste aspectual com o particípio anterior.
- source_word: אֶל אַחֲרֵיהֶם
  choice: atrás deles
  rationale: Expressa de maneira concisa o movimento subsequente aos cavalos pretos, sem decidir além do texto se se trata apenas de posição ou de seguimento.
- source_word: וְהַבְּרֻדִּים
  choice: os malhados
  rationale: בְּרֻדִּים designa coloração variegada ou manchada; “malhados” é uma descrição corrente e inteligível da pelagem de cavalos.
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: para a terra do sul
  rationale: O paralelo com “terra do norte” favorece o sentido direcional “sul”; a possível leitura como topônimo é preservada em nota.
theological_decisions:
- issue: Sentido de הַתֵּימָן no contexto da visão
  choice: sul
  alternative: Temã
  rationale: A correspondência entre “terra do norte” e “terra do sul” favorece duas regiões direcionais. Como o termo também pode ser entendido como o topônimo Temã, essa ambiguidade lexical genuína é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a alternância aspectual entre o particípio (“saem”) e os verbos no qatal (“saíram”), além da elipse de “cavalos” nas duas últimas referências.
