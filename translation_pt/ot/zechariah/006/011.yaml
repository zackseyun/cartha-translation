  text: וְ/לָקַחְתָּ֥ כֶֽסֶף וְ/זָהָ֖ב וְ/עָשִׂ֣יתָ עֲטָר֑וֹת וְ/שַׂמְתָּ֗ בְּ/רֹ֛אשׁ יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֥ן הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: pt
  text: Pegue prata e ouro, faça coroas[a] e coloque-as na cabeça de Josué, filho de Jeozadaque, o sumo sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “coroas”, no plural. Alguns entendem que se trata de uma única coroa composta e, por isso, traduzem “uma coroa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pegue
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado pela conjunção, funciona aqui como instrução profética; o imperativo comunica isso naturalmente em português.
- source_word: כֶסֶף וְזָהָב
  choice: prata e ouro
  rationale: São substantivos materiais específicos; a tradução preserva os dois metais mencionados.
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: faça coroas
  rationale: עֲטָרוֹת é morfologicamente plural. A tradução mantém esse número sem excluir a possibilidade contextual de uma coroa composta.
- source_word: וְשַׂמְתָּ
  choice: coloque-as
  rationale: O verbo indica pôr algo em determinado lugar. O pronome retoma naturalmente o plural «coroas» em português.
- source_word: בְּרֹאשׁ
  choice: na cabeça de
  rationale: A preposição e o substantivo indicam a colocação física sobre a cabeça; «na cabeça de» é a formulação corrente em português.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, filho de Jeozadaque
  rationale: Empregam-se as formas portuguesas tradicionais e amplamente reconhecidas dos nomes hebraicos.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É a expressão consagrada e clara em português para o título do sacerdote principal.
theological_decisions:
- issue: Plural עֲטָרוֹת e colocação sobre a cabeça de uma única pessoa
  choice: Manter «coroas» no plural no texto principal
  alternative: Traduzir «uma coroa», entendendo o plural como referência a uma coroa composta
  rationale: O texto hebraico apresenta explicitamente o substantivo no plural. Como o número pode ter relevância para o ato simbólico profético, a tradução o preserva e registra em nota a interpretação singular possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a sequência direta de ordens e o plural potencialmente significativo do hebraico.
