base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: pt
  text: 'Então o anjo respondeu e me disse: “Estes são os quatro ventos dos céus[a], que saem depois de terem se apresentado diante do Senhor de toda a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os quatro espíritos dos céus”. A palavra hebraica pode significar tanto “ventos” como “espíritos”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן הַמַּלְאָךְ וַיֹּאמֶר אֵלַי
  choice: Então o anjo respondeu e me disse
  rationale: Mantém a fórmula narrativa hebraica de resposta e fala, em português natural e digno, sem reduzir os dois verbos a um só.
- source_word: אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  choice: os quatro ventos dos céus
  rationale: רוּחוֹת admite tanto “ventos” como “espíritos”. “Ventos” se ajusta à imagem cósmica e direcional da visão, enquanto a alternativa genuína é preservada em nota. O plural “céus” corresponde naturalmente ao plural hebraico.
- source_word: יוֹצְאוֹת
  choice: que saem
  rationale: Expressa de modo claro o particípio feminino plural, concordando semanticamente com os quatro ventos e indicando seu movimento para fora.
- source_word: מֵהִתְיַצֵּב עַל
  choice: depois de terem se apresentado diante de
  rationale: O infinitivo hitpael de יצב descreve tomar posição ou apresentar-se em audiência diante de um superior. A formulação portuguesa comunica esse sentido idiomático sem sugerir a ação pouco natural de simplesmente estar de pé.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: o Senhor de toda a terra
  rationale: “Senhor” expressa o título de soberania divina, e “toda a terra” preserva o alcance universal da expressão.
theological_decisions:
- issue: Sentido de רֻחוֹת na visão
  choice: ventos
  alternative: espíritos
  rationale: O termo hebraico é genuinamente polissêmico e pode evocar tanto ventos cósmicos como agentes espirituais. O texto principal usa “ventos”, apropriado à movimentação dos carros pela terra, sem excluir “espíritos”, registrado na nota.
- issue: Relação das quatro entidades com o Senhor
  choice: depois de terem se apresentado diante do Senhor
  alternative: saindo de onde estavam diante do Senhor
  rationale: A construção מֵהִתְיַצֵּב pode indicar a partida subsequente à apresentação ou posição de serviço. A tradução escolhida comunica essa sequência sem definir além do necessário a natureza das entidades.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva a solenidade da visão profética, evita arcaísmos desnecessários e mantém explícita em nota a ambiguidade central do hebraico.
