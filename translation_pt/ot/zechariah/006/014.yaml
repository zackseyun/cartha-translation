  text: וְ/הָ/עֲטָרֹ֗ת תִּֽהְיֶה֙ לְ/חֵ֨לֶם֙ וּ/לְ/טוֹבִיָּ֣ה וְ/לִ/ידַֽעְיָ֔ה וּ/לְ/חֵ֖ן בֶּן צְפַנְיָ֑ה לְ/זִכָּר֖וֹן בְּ/הֵיכַ֥ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: pt
  text: E as coroas ficarão para Helem[a], Tobias, Jedaías e Hen, filho de Sofonias, como memorial no templo de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Helem é chamado Heldai em Zacarias 6:10; talvez sejam formas variantes do mesmo nome.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: as coroas
  rationale: O substantivo hebraico está no plural; a tradução preserva essa forma, apesar da discussão contextual sobre uma única coroa cerimonial.
- source_word: תִּהְיֶה
  choice: ficarão
  rationale: O imperfeito de היה tem aqui sentido futuro/resultativo. Em português, “ficarão” expressa naturalmente que as coroas serão mantidas no templo.
- source_word: לְחֵלֶם
  choice: para Helem
  rationale: Mantém o nome próprio conforme a forma do Texto Massorético neste versículo, sem harmonizá-lo com Heldai em Zacarias 6:10.
- source_word: וּלְטוֹבִיָּה
  choice: Tobias
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome hebraico טוֹבִיָּה.
- source_word: וְלִידַעְיָה
  choice: Jedaías
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: וּלְחֵן
  choice: Hen
  rationale: O contexto, sobretudo “filho de Sofonias”, indica que חֵן funciona como nome próprio, não como o substantivo abstrato “graça” ou “favor”.
- source_word: בֶּן צְפַנְיָה
  choice: filho de Sofonias
  rationale: Reproduz diretamente a construção filial e usa a forma portuguesa consagrada do nome.
- source_word: לְזִכָּרוֹן
  choice: como memorial
  rationale: Expressa a finalidade comemorativa das coroas guardadas no templo.
- source_word: בְּהֵיכַל
  choice: no templo
  rationale: Neste contexto, הֵיכָל designa o templo ou santuário de Yahweh, não um palácio real.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Variação dos nomes próprios entre Zacarias 6:10 e 6:14
  choice: Preservar “Helem” e “Hen” conforme o Texto Massorético deste versículo.
  alternative: Harmonizar “Helem” com “Heldai” e/ou interpretar “Hen” como “graça” ou como outra variante textual.
  rationale: A tradução segue a leitura hebraica do próprio versículo e evita resolver silenciosamente possíveis variantes de nome ou questões de transmissão textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe foi mantida próxima do hebraico, mas “ficarão” torna natural em português a ideia de que as coroas permanecerão no templo como memorial.
