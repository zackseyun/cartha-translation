  text: וָ/אָשֻׁ֗ב וָ/אֶשָּׂ֤א עֵינַ/י֙ וָֽ/אֶרְאֶ֔ה וְ/הִנֵּ֨ה אַרְבַּ֤ע מַרְכָּבוֹת֙ יֹֽצְא֔וֹת מִ/בֵּ֖ין שְׁנֵ֣י הֶֽ/הָרִ֑ים וְ/הֶ/הָרִ֖ים הָרֵ֥י נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: pt
  text: 'Então me virei, levantei os olhos e vi: eis que quatro carros saíam dentre os dois montes, e os montes eram montes de bronze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  choice: Então me virei
  rationale: שׁוב pode significar voltar, retornar ou virar-se. No relato da visão, “me virei” expressa naturalmente a mudança ou retomada da atenção do profeta, enquanto “então” representa a progressão narrativa.
- source_word: וָאֶשָּׂא עֵינַי
  choice: levantei os olhos
  rationale: Preserva o conhecido idiomatismo hebraico de dirigir o olhar e mantém o tom profético em português natural.
- source_word: וָאֶרְאֶה
  choice: e vi
  rationale: Tradução direta do verbo de percepção, preservando a sequência das ações.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função de הִנֵּה de apresentar vividamente algo inesperado ou digno de atenção.
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: quatro carros
  rationale: מַרְכָּבָה designa um carro puxado por cavalos. “Carros” é conciso e adequado ao contexto imediato, que identifica depois os cavalos.
- source_word: יֹצְאוֹת
  choice: saíam
  rationale: O particípio retrata a ação em andamento diante do profeta; o pretérito imperfeito comunica essa progressão em português.
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: dentre os dois montes
  rationale: Preserva o artigo definido do hebraico e apresenta os montes como o par específico visto na visão.
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: e os montes eram montes de bronze
  rationale: Conserva a repetição enfática de “montes” no hebraico. “Bronze” é uma tradução tradicional e plausível de נְחֹשֶׁת, sem excluir “cobre” como alternativa lexical.
theological_decisions:
- issue: Sentido do material נְחֹשֶׁת
  choice: bronze
  alternative: cobre
  rationale: A escolha é lexical, não doutrinária. “Bronze” é a designação convencional e adequada para a imagem monumental, mas o termo hebraico também pode denotar cobre; essa possibilidade é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética. A formulação preserva a apresentação vívida de הִנֵּה, o aspecto progressivo de יֹצְאוֹת, o artigo em “os dois montes” e a repetição enfática de “montes” do texto hebraico.
