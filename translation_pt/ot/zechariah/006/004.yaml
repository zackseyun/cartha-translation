base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: pt
  text: 'Então respondi e disse ao anjo que falava comigo[a]: “O que são estes, meu senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que conversava comigo”. O particípio hebraico pode caracterizar o anjo como aquele que falava com o profeta.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וָאַעַן
  choice: Então respondi
  rationale: O wayyiqtol de ענה dá sequência à narrativa e introduz a resposta do profeta; “Então” expressa esse avanço com naturalidade.
- source_word: וָאֹמַר
  choice: e disse
  rationale: Mantém a construção hebraica “respondi e disse”, evitando reduzi-la por paráfrase a apenas “perguntei”.
- source_word: הַמַּלְאָךְ
  choice: ao anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, o contexto visionário de Zacarias indica o ser celestial que interpreta a visão.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio apresenta o anjo em sua atuação contínua ou característica de falar com o profeta; o imperfeito português transmite isso naturalmente.
- source_word: מָה אֵלֶּה
  choice: O que são estes
  rationale: A pergunta se refere aos elementos vistos na visão; “estes” preserva o demonstrativo masculino plural sem acrescentar um substantivo ausente no hebraico.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de dirigir-se ao anjo. A inicial minúscula evita transformá-la indevidamente em título divino, sem eliminar sua força honorífica.
theological_decisions:
- issue: Se אֲדֹנִי designa Deus ou funciona como tratamento respeitoso dirigido ao anjo
  choice: “meu senhor”, como tratamento respeitoso ao anjo
  alternative: “Senhor”, entendido como título divino
  rationale: O destinatário imediato é “o anjo que falava comigo”. A tradução preserva a deferência do hebraico sem identificar o anjo com Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a sequência verbal hebraica e o tratamento honorífico sem soar arcaica.
