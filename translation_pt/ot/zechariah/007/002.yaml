base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: pt
  text: Betel[a] enviou Sarezer, Regém-Meleque e seus homens para suplicar o favor de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Betel”. Alguns entendem a expressão como “a casa de Deus”, mas aqui ela provavelmente é o nome da localidade.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por “buscar o favor de Yahweh”. Literalmente, o hebraico emprega a expressão “suplicar a face de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O consecutivo narrativo com שׁלח expressa aqui uma ação passada simples; “enviou” é natural e não acrescenta um marcador temporal ausente no hebraico.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: A expressão funciona mais naturalmente como o nome da localidade/comunidade que envia os representantes. “Betel” é a forma tradicional e corrente em português.
- source_word: שַׂר אֶצֶר
  choice: Sarezer
  rationale: Trata-se de um nome pessoal; a transliteração “Sarezer” é reconhecível e natural em português.
- source_word: וְרֶגֶם מֶלֶךְ
  choice: Regém-Meleque
  rationale: O composto é tratado como nome pessoal, e não como título; o hífen preserva sua estrutura, enquanto a grafia facilita a leitura em português.
- source_word: וַאֲנָשָׁיו
  choice: e seus homens
  rationale: O sufixo masculino singular remete mais naturalmente ao nome masculino imediatamente anterior. A formulação portuguesa preserva certa abertura contextual quanto ao líder a quem pertenciam os homens.
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: para suplicar o favor de
  rationale: O idioma hebraico significa pedir insistentemente que alguém se mostre favorável. A tradução comunica tanto a súplica quanto a busca de favor sem reproduzir de modo obscuro a imagem literal da “face”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino, não um título. “Yahweh” o translitera em vez de substituí-lo por “SENHOR”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração preserva o caráter de nome próprio presente no hebraico e evita substituí-lo silenciosamente por um título.
- issue: Identificação de בֵּית אֵל como sujeito
  choice: Betel, a localidade/comunidade, enviou
  alternative: A casa de Deus enviou
  rationale: Neste contexto, בֵּית אֵל é mais provavelmente o topônimo Betel. A alternativa literal é registrada em nota para não ocultar a forma do hebraico.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas onomásticas familiares ao público lusófono. A sintaxe permanece concisa e narrativa; as notas preservam as alternativas relevantes sem sobrecarregar o texto principal.
