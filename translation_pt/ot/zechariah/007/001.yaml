base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: pt
  text: No quarto ano do rei Dario, a palavra de Yahweh veio a Zacarias no quarto dia do nono mês, o mês de quisleu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quisleu é o nome do nono mês do calendário hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: No quarto ano...
  rationale: A forma narrativa introduz uma nova situação temporal. Em português atual, a oração datadora direta transmite essa função sem recorrer ao arcaizante “e aconteceu que”.
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: No quarto ano do rei Dario
  rationale: Preserva a fórmula de datação pelo ano de reinado em ordem natural para o português.
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: a palavra de Yahweh veio a Zacarias
  rationale: A construção hebraica usa “foi/esteve”, mas tem sentido eventivo na fórmula profética; “veio a” é idiomático e mantém a ideia de revelação dirigida ao profeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: no quarto dia do nono mês
  rationale: “Dia” está implícito na fórmula calendárica hebraica e é explicitado para clareza em português.
- source_word: בְּכִסְלֵו
  choice: o mês de quisleu
  rationale: Identifica quisleu como o nome do nono mês e usa uma transliteração adaptada e legível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa direta. O nome do mês foi grafado “quisleu” para favorecer a leitura em português; a nota oferece a informação cultural necessária.
