  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: pt
  text: Não são estas as palavras que Yahweh proclamou por meio dos profetas anteriores[a], quando Jerusalém, as cidades ao seu redor, o Neguebe e a Sefelá[c] eram habitados, e Jerusalém vivia em segurança[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos profetas anteriores”. A expressão hebraica significa literalmente “pela mão dos profetas anteriores”.
    reason: lexical_alternative
  - marker: b
    text: Ou “vivia tranquila”. O termo hebraico pode transmitir a ideia de tranquilidade, segurança e prosperidade sem perturbações.
    reason: lexical_alternative
  - marker: c
    text: A Sefelá é a região de terras baixas e colinas a oeste de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא אֶת הַדְּבָרִים
  choice: Não são estas as palavras
  rationale: Reproduz a pergunta retórica que espera resposta afirmativa e expressa naturalmente em português a referência definida à mensagem já conhecida.
- source_word: קָרָא
  choice: proclamou
  rationale: No contexto da fala divina transmitida pelos profetas, indica uma declaração pública e autorizada, não apenas o ato de chamar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: por meio dos antigos profetas
  rationale: Comunica de modo natural a agência da expressão hebraica literal 'pela mão de'; 'antigos' aqui designa profetas de uma época anterior.
- source_word: בִּהְיוֹת יְרוּשָׁלִַם יֹשֶׁבֶת
  choice: quando Jerusalém era habitada
  rationale: A construção infinitiva marca a circunstância temporal, e o particípio aplicado à cidade indica que ela tinha habitantes.
- source_word: וּשְׁלֵוָה
  choice: e vivia tranquila
  rationale: Preserva a ideia de tranquilidade, segurança e bem-estar sem restringir o sentido à prosperidade material.
- source_word: וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: com as cidades ao seu redor
  rationale: Mantém a relação possessiva e a localização das cidades vizinhas em português corrente.
- source_word: וְהַנֶּגֶב
  choice: o Neguebe
  rationale: Trata o termo como a designação geográfica da região ao sul de Judá, não apenas como um ponto cardeal.
- source_word: וְהַשְּׁפֵלָה
  choice: a Sefelá
  rationale: Preserva o nome tradicional da região de planícies baixas e colinas no oeste de Judá.
- source_word: יֹשֵׁב
  choice: eram habitados
  rationale: O particípio singular tem valor coletivo para as duas regiões; o plural em português concorda naturalmente com os dois nomes coordenados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. A transliteração preserva o nome divino sem substituí-lo por um título.
- issue: Agência divina na proclamação profética
  choice: Yahweh proclamou por meio dos antigos profetas
  alternative: Yahweh proclamou pelos antigos profetas
  rationale: '''Por meio de'' torna clara a instrumentalidade da expressão hebraica sem negar que a proclamação é atribuída ao próprio Yahweh.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A pergunta retórica e a estrutura temporal do hebraico foram preservadas. Os nomes geográficos 'Neguebe' e 'Sefelá' mantêm seu valor regional, e as notas esclarecem alternativas sem resolver indevidamente a amplitude semântica.
