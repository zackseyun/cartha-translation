reference: Zechariah 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: pt
  text: Assim como ele chamou, e eles não quiseram ouvir, assim também eles chamarão, e eu não ouvirei, diz Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “o SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר ... כֵּן
  choice: Assim como ... assim também
  rationale: Reproduz de modo natural em português a construção hebraica de correspondência, sem o peso estilístico de uma formulação como “e aconteceu que, quando”.
- source_word: קָרָא / יִקְרְאוּ
  choice: chamou / chamarão
  rationale: Mantém a repetição intencional do mesmo verbo e a reciprocidade retórica entre o chamado anterior de Deus e o futuro chamado do povo.
- source_word: וְלֹא שָׁמֵעוּ
  choice: e eles não quiseram ouvir
  rationale: Neste contexto, שׁמע indica dar atenção ou atender, não mera percepção auditiva. “Não quiseram ouvir” expressa a recusa deliberada sugerida pelo contexto.
- source_word: וְלֹא אֶשְׁמָע
  choice: e eu não ouvirei
  rationale: Conserva o paralelo com a recusa do povo e comunica a ausência de resposta divina, não incapacidade auditiva.
- source_word: אָמַר
  choice: diz
  rationale: O presente é natural na fórmula profética e apresenta a declaração como palavra divina vigente e autorizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Traduz o sentido do título de forma clara para leitores modernos e evita o uso hoje pouco transparente de “hostes”.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: o SENHOR dos Exércitos; Yahweh das Hostes
  rationale: Preserva o nome pessoal יְהוָה e traduz צְבָאוֹת em linguagem moderna, sem impor uma identificação mais específica dos exércitos.
- issue: Reciprocidade entre a recusa humana e a resposta divina
  choice: eles não quiseram ouvir ... eu não ouvirei
  alternative: eles não ouviram ... eu não ouvirei
  rationale: A formulação comunica a recusa humana indicada pelo contexto e mantém a tensão do juízo correspondente, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “chamou/chamarão” e “ouvir/ouvirei” foi preservada por seu papel estrutural no versículo. O marcador da nota foi colocado após o título divino, ao qual a alternativa lexical se refere.
