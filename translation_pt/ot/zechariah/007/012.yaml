  text: וְ/לִבָּ֞/ם שָׂ֣מוּ שָׁמִ֗יר מִ֠/שְּׁמוֹעַ אֶת הַ/תּוֹרָ֤ה וְ/אֶת הַ/דְּבָרִים֙ אֲשֶׁ֨ר שָׁלַ֜ח יְהוָ֤ה צְבָאוֹת֙ בְּ/רוּח֔/וֹ בְּ/יַ֖ד הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֑ים וַֽ/יְהִי֙ קֶ֣צֶף גָּד֔וֹל מֵ/אֵ֖ת יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: pt
  text: Eles tornaram seus corações duros como pedra[a], para não ouvirem a lei[b] nem as palavras que Yahweh dos Exércitos havia enviado por seu Espírito, por meio dos profetas de outrora. Então, veio grande ira da parte de Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שָׁמִיר indica uma substância extremamente dura, tradicionalmente traduzida como “adamante” e, às vezes, como “pederneira”. Sua identificação exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a instrução”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבָּם שָׂמוּ שָׁמִיר
  choice: Eles tornaram o coração duro como uma pedra duríssima
  rationale: A construção idiomática descreve o endurecimento deliberado da disposição interior. O singular coletivo “o coração” acompanha de perto o hebraico, e “pedra duríssima” comunica a dureza extrema de שָׁמִיר sem afirmar uma identificação mineral incerta.
- source_word: מִשְּׁמוֹעַ
  choice: para não ouvirem
  rationale: A preposição com o infinitivo expressa impedimento ou propósito; em português, a negação precisa ser explicitada.
- source_word: הַתּוֹרָה
  choice: a lei
  rationale: תּוֹרָה designa aqui a revelação normativa de Deus; “instrução” continua sendo uma alternativa lexical possível e é registrada em nota.
- source_word: וְאֶת הַדְּבָרִים
  choice: nem as palavras
  rationale: Depois da construção negativa, “nem” expressa naturalmente a coordenação em português. “Palavras” conserva o sentido direto de דְּבָרִים e seu paralelismo com “lei”.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa o nome divino, e “dos Exércitos” traduz צְבָאוֹת de maneira clara, preservando a força do título.
- source_word: בְּרוּחוֹ
  choice: por seu Espírito
  rationale: O contexto apresenta o Espírito de Deus como agente pelo qual a mensagem foi enviada; a maiúscula sinaliza esse referente pessoal sem ampliar a formulação hebraica.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: por meio dos profetas de outrora
  rationale: בְּיַד é um idioma de mediação, traduzido naturalmente por “por meio de”. “De outrora” indica profetas de épocas anteriores e evita sugerir o nome técnico de uma divisão canônica.
- source_word: וַיְהִי קֶצֶף גָּדוֹל מֵאֵת
  choice: Por isso, veio grande ira da parte de
  rationale: A formulação comunica a consequência no contexto e mantém o caráter eventivo de וַיְהִי, enquanto מֵאֵת marca Yahweh como a fonte da ira.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Referente de רוּחוֹ
  choice: seu Espírito
  alternative: seu espírito; seu sopro
  rationale: No contexto profético, a expressão descreve a agência divina pela qual Yahweh enviou suas palavras através dos profetas. A tradução mantém essa leitura sem inserir uma formulação doutrinária além do texto.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Senhores dos exércitos; das Hostes
  rationale: “Dos Exércitos” é inteligível no português moderno e conserva a amplitude marcial e cósmica do título sem especificar quais exércitos o texto tem em vista.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. O texto preserva a imagem hebraica do coração endurecido, a mediação do Espírito e dos profetas e o título divino, sem tecnicismos desnecessários.
