source:
  edition: WLC
  text: לֵ/אמֹ֗ר אֶל הַ/כֹּֽהֲנִים֙ אֲשֶׁר֙ לְ/בֵית יְהוָ֣ה צְבָא֔וֹת וְ/אֶל הַ/נְּבִיאִ֖ים לֵ/אמֹ֑ר הַֽ/אֶבְכֶּה֙ בַּ/חֹ֣דֶשׁ הַ/חֲמִשִׁ֔י הִנָּזֵ֕ר כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי זֶ֖ה כַּ/מֶּ֥ה שָׁנִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: pt
  text: 'para dizer aos sacerdotes da Casa de Yahweh dos Exércitos[a] e aos profetas: “Devo chorar no quinto mês, abstendo-me[b], como tenho feito há tantos anos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “separando-me”; o termo hebraico pode indicar uma abstenção ritual mais ampla do que apenas o jejum.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: para dizer
  rationale: O infinitivo introduz a finalidade e o conteúdo da consulta, além de manter a ligação sintática com o contexto anterior.
- source_word: הַכֹּהֲנִים אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: aos sacerdotes da Casa de Yahweh dos Exércitos
  rationale: A formulação identifica os sacerdotes vinculados ao templo; “Casa” preserva a designação hebraica sem reduzir o sentido a mera localização.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo claro, mantendo a força militar e cósmica do título.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Equivalente direto e corrente para os representantes proféticos consultados junto com os sacerdotes.
- source_word: הַאֶבְכֶּה
  choice: Devo chorar
  rationale: Expressa naturalmente em português a pergunta deliberativa da primeira pessoa do singular.
- source_word: בַּחֹדֶשׁ הַחֲמִשִׁי
  choice: no quinto mês
  rationale: Mantém a designação ordinal do texto, sem introduzir um nome posterior para o mês.
- source_word: הִנָּזֵר
  choice: abstendo-me
  rationale: Conserva o sentido amplo de abstenção ou separação ritual, sem restringi-lo necessariamente ao jejum.
- source_word: כַּאֲשֶׁר עָשִׂיתִי זֶה כַּמֶּה שָׁנִים
  choice: como tenho feito há tantos anos
  rationale: O pretérito perfeito composto comunica uma prática repetida que se prolonga até o momento da consulta; “há tantos anos” reproduz com naturalidade a duração indicada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Alcance ritual de הִנָּזֵר
  choice: abstendo-me
  alternative: jejuando
  rationale: Embora o contexto de luto provavelmente inclua jejum, o verbo pode indicar separação ou abstenção ritual em sentido mais amplo; a tradução evita resolver essa amplitude indevidamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O início em minúscula e a construção “para dizer” preservam a continuidade sintática com o versículo anterior. Os dois usos de לֵאמֹר foram condensados por meio de dois-pontos para evitar repetição pouco natural em português.
