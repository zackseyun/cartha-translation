  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh dos Exércitos veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa de היה introduz o acontecimento seguinte. Esta construção mantém a sequência e soa natural em português, sem recorrer ao arcaico «e aconteceu que».
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דְּבַר designa uma comunicação divina. «A palavra» preserva o idioma profético tradicional sem explicitar interpretativamente «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino יְהוָה צְבָאוֹת, «dos Exércitos» é claro e reconhecível em português, preservando a imagem de forças organizadas sem limitar o referente apenas a exércitos humanos.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente o destinatário da palavra profética em português natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém de forma transparente a função do infinitivo hebraico que introduz o discurso direto apresentado no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal em vez de substituí-lo pelo título «Senhor»; «Jeová» reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética reconhecível. A ordem foi levemente ajustada para a sintaxe natural do português, preservando a sequência, o nome divino e a fórmula introdutória do discurso.
