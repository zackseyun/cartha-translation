  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: pt
  text: 'Diga a todo o povo da terra e aos sacerdotes: “Quando vocês jejuaram e lamentaram no quinto e no sétimo mês, durante estes setenta anos, foi realmente para mim que vocês jejuaram?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi para mim — foi realmente para mim — que vocês jejuaram?” O hebraico emprega uma construção enfática e termina com o pronome independente “eu”, dando ênfase adicional a “para mim”.'
    reason: Alternativa lexical que explicita a ênfase da construção hebraica.
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: A expressão designa aqui, de modo amplo, os habitantes da terra, sem restringi-los a uma classe social. A formulação preserva a expressão hebraica e o כָּל, “todo”.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e direto de כֹּהֵן no plural.
- source_word: צַמְתֶּם
  choice: vocês jejuaram
  rationale: Traduz diretamente o Qal perfeito na segunda pessoa masculina plural e mantém a referência à prática passada do povo.
- source_word: וְסָפוֹד
  choice: e lamentaram
  rationale: ספד indica lamentação ou manifestação de luto, muitas vezes ritual. “Lamentaram” comunica esse sentido sem especificar uma forma não indicada no texto.
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: no quinto e no sétimo mês
  rationale: “Mês” está implícito nos ordinais hebraicos. A construção portuguesa evita repetição desnecessária e deixa clara a referência ao calendário.
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: durante estes setenta anos
  rationale: A expressão aponta para um período de setenta anos que chega até a situação presente. “Durante estes setenta anos” conserva a duração e a força demonstrativa.
- source_word: הֲצוֹם צַמְתֻּנִי
  choice: foi realmente para mim que vocês jejuaram?
  rationale: A combinação enfática do infinitivo absoluto com o verbo finito é expressa naturalmente por “realmente”; o sufixo dativo é representado por “para mim”.
- source_word: אָֽנִי
  choice: para mim
  rationale: O pronome independente final reforça o destinatário alegado do jejum. A frase focalizada “foi realmente para mim” transmite essa ênfase sem repetição artificial.
- source_word: אֱמֹר ... לֵאמֹר
  choice: 'Diga ... :'
  rationale: A repetição hebraica de אמר funciona como fórmula de introdução do discurso. Em português atual, os dois-pontos comunicam naturalmente essa função sem reproduzir um “dizendo” pouco idiomático.
theological_decisions:
- issue: Natureza da pergunta retórica sobre o jejum
  choice: A pergunta contesta se o jejum era de fato dirigido a Deus, sem negar que o povo jejuava.
  alternative: Entender a pergunta como uma declaração de que os jejuns eram inteiramente inválidos.
  rationale: A construção enfática concentra-se no propósito e destinatário do jejum. A tradução mantém o desafio retórico e não acrescenta uma avaliação doutrinária mais ampla do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa de modo claro o plural do hebraico; “povo da terra” preserva a expressão original; a fala direta é introduzida por dois-pontos para maior naturalidade.
