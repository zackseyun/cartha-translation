base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: pt
  text: Eu os dispersei entre todas as nações que eles não conheciam, como se por um vendaval[a]. Após eles, a terra ficou desolada, sem ninguém que passasse por ela nem voltasse. Assim, fizeram da terra desejável[b] uma desolação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os varri como uma tempestade entre todas as nações”. O verbo hebraico contém a imagem de uma tempestade, não apenas a de uma dispersão comum.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “terra agradável” ou “terra preciosa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: Eu os dispersei como por um vendaval
  rationale: O piel de סער evoca uma dispersão violenta, impulsionada como por uma tempestade. A formulação conserva tanto a ideia de espalhar quanto a imagem meteorológica sem acrescentar um vento literal ao texto.
- source_word: עַל כָּל הַגּוֹיִם
  choice: entre todas as nações
  rationale: 'Com um verbo de dispersão, עַל tem aqui sentido distributivo: eles foram espalhados entre os povos, não lançados contra eles.'
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: que eles não conheciam
  rationale: A oração qualifica as nações como povos estrangeiros que lhes eram desconhecidos.
- source_word: וְהָאָרֶץ נָשַׁמָּה
  choice: a terra ficou desolada
  rationale: נשׁם descreve o estado resultante de devastação; “ficou desolada” é natural em português e preserva esse valor resultativo.
- source_word: אַחֲרֵיהֶם
  choice: Depois deles
  rationale: Expressa que, após a remoção do povo, a terra permaneceu desolada em seu rastro.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: sem ninguém que passasse por ela nem voltasse
  rationale: O par de formas participiais indica ausência total de trânsito humano em ambas as direções. “Ninguém” explicita naturalmente em português a força privativa da construção.
- source_word: וַיָּשִׂימוּ
  choice: Assim, fizeram
  rationale: A forma verbal faz avançar o relato e apresenta a situação final como consequência das ações do povo.
- source_word: אֶרֶץ חֶמְדָּה
  choice: terra desejável
  rationale: חֶמְדָּה expressa aquilo que é desejado, estimado ou agradável. “Desejável” mantém esse valor positivo sem transformar a expressão em título técnico.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: O substantivo designa o estado resultante de devastação; a construção nominal preserva o contraste retórico com “terra desejável”.
theological_decisions:
- issue: Agência no juízo e na desolação da terra
  choice: Deus permanece o agente explícito da dispersão na primeira pessoa, enquanto o plural final responsabiliza o povo por ter transformado a terra em desolação.
  alternative: Suavizar a agência divina mediante uma construção impessoal, ou atribuir exclusivamente a Deus a desolação final.
  rationale: O verbo hebraico inicial está na primeira pessoa e atribui a dispersão a Deus; o verbo plural final atribui ao povo a transformação da terra. A tradução conserva simultaneamente o juízo divino e a responsabilidade humana.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A imagem vívida da tempestade foi preservada sem obscurecer a ideia central de dispersão; a repetição de “desolada/desolação” mantém o efeito retórico do hebraico.
