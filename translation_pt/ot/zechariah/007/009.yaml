  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר מִשְׁפַּ֤ט אֱמֶת֙ שְׁפֹ֔טוּ וְ/חֶ֣סֶד וְ/רַֽחֲמִ֔ים עֲשׂ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Julguem com justiça e verdade[a] e demonstrem amor leal e compaixão, cada um para com seu irmão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Profiram julgamentos verdadeiros”. A expressão hebraica une “julgamento/justiça” a “verdade” e exige decisões marcadas por veracidade e integridade.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “cada homem para com seu irmão”; é uma expressão masculina representativa para o tratamento mútuo dentro da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética de mensageiro em português atual e solene; o presente comunica a autoridade vigente da declaração.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e verte o título tradicional de modo claro, sem limitar os exércitos à esfera humana.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala; em português, os dois-pontos o expressam naturalmente sem o redundante “dizendo”.
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: Julguem com justiça e verdade
  rationale: Conserva tanto a dimensão judicial de מִשְׁפַּט quanto a qualidade de veracidade e integridade expressa por אֱמֶת, em formulação portuguesa natural.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Comunica bondade constante e lealdade relacional, evitando reduzir o termo apenas a bondade ou misericórdia.
- source_word: רַחֲמִים
  choice: compaixão
  rationale: Expressa de modo corrente a misericórdia terna e profunda indicada pelo substantivo hebraico plural.
- source_word: עֲשׂוּ
  choice: demonstrem
  rationale: Com “amor leal e compaixão”, “demonstrem” transmite naturalmente a prática concreta exigida pelo verbo.
- source_word: אִישׁ אֶת אָחִיו
  choice: cada um para com seu irmão
  rationale: Preserva a força distributiva e a linguagem de parentesco masculina representativa do hebraico, sem substituí-la por “próximo”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Relação entre justiça e verdade em מִשְׁפַּט אֱמֶת
  choice: justiça e verdade
  alternative: julgamentos verdadeiros
  rationale: A formulação mantém a tensão semântica entre decisão judicial, justiça, veracidade e integridade, sem restringir a ordem apenas a veredictos formais.
- issue: Linguagem masculina representativa em אִישׁ ... אָחִיו
  choice: cada um para com seu irmão
  alternative: uns para com os outros
  rationale: Mantém a forma e a metáfora comunitária de fraternidade presentes no hebraico; a nota esclarece seu alcance representativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando os imperativos plurais, o caráter judicial da primeira ordem e a linguagem comunitária da segunda.
