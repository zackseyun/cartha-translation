  text: וַ/יְמָאֲנ֣וּ לְ/הַקְשִׁ֔יב וַ/יִּתְּנ֥וּ כָתֵ֖ף סֹרָ֑רֶת וְ/אָזְנֵי/הֶ֖ם הִכְבִּ֥ידוּ מִ/שְּׁמֽוֹעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: pt
  text: Mas eles se recusaram a prestar atenção, deram um ombro rebelde[a] e tornaram pesados os seus ouvidos[b], para não ouvir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “deram um ombro rebelde”, expressão que indica resistência obstinada.
    reason: lexical_alternative
  - marker: b
    text: Ou “deixaram os ouvidos insensíveis” ou “taparam os ouvidos”. O hebraico diz literalmente “tornaram pesados os seus ouvidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: se recusaram
  rationale: O verbo מָאֵן expressa recusa deliberada ou falta de disposição; “se recusaram” preserva com clareza essa força volitiva.
- source_word: לְהַקְשִׁיב
  choice: a prestar atenção
  rationale: No hiphil, קשׁב indica dar atenção cuidadosa, não apenas captar sons. A expressão comunica a rejeição consciente da instrução profética.
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: viraram um ombro rebelde
  rationale: A formulação conserva a imagem corporal hebraica e comunica resistência obstinada sem reduzi-la a uma abstração.
- source_word: סֹרָרֶת
  choice: rebelde
  rationale: O termo derivado de סרר descreve resistência obstinada e insubmissa. “Rebelde” preserva tanto a teimosia quanto a dimensão moral da atitude.
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: tornaram pesados os seus ouvidos
  rationale: A tradução mantém a metáfora concreta do hebraico, segundo a qual eles próprios tornaram os ouvidos insensíveis e indispostos a responder.
- source_word: מִשְּׁמוֹעַ
  choice: para não ouvir
  rationale: 'A preposição מִן com o infinitivo expressa aqui impedimento ou finalidade resultante: eles tornaram os ouvidos pesados a fim de não ouvir.'
theological_decisions:
- issue: Imagens corporais de rebeldia e surdez voluntária
  choice: Preservar as metáforas do ombro rebelde e dos ouvidos tornados pesados.
  alternative: Eles resistiram teimosamente e taparam os ouvidos.
  rationale: As imagens concretas enfatizam que a rebeldia da aliança foi deliberada. Mantê-las evita transformar a linguagem retoricamente forte do texto em uma paráfrase abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e as imagens corporais do hebraico foram preservadas, enquanto “prestar atenção” expressa de modo natural o sentido de escuta atenta.
