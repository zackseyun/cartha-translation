base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
translation:
  language: pt
  text: Não oprimam a viúva, o órfão[a], o estrangeiro residente[b] nem o pobre; e não tramem, em seus corações, o mal uns contra os outros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode ser entendido, mais literalmente, como “sem pai”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, um estrangeiro que residia entre os israelitas.
    reason: cultural_note
  - marker: c
    text: Literalmente, “o mal de cada um contra seu irmão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente direto e corrente para a mulher que perdeu o marido, integrante da lista tradicional de pessoas socialmente vulneráveis.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a forma natural e abrangente em português; no contexto social e jurídico, designa a criança privada da proteção parental, embora o hebraico possa destacar especialmente a ausência do pai.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Expressa o não israelita estabelecido entre o povo e sujeito à sua proteção, evitando tanto a ideia de mero viajante quanto categorias migratórias modernas demasiado específicas.
- source_word: עָנִי
  choice: pobre
  rationale: Nesta lista de grupos vulneráveis, o sentido socioeconômico é predominante e esta é a expressão mais clara.
- source_word: תַּעֲשֹׁקוּ
  choice: oprimam
  rationale: Abrange abuso econômico, social e jurídico contra pessoas vulneráveis.
- source_word: רָעַת
  choice: o mal
  rationale: Mantém a força moral ampla do substantivo hebraico, sem o restringir apenas a dano material.
- source_word: תַּחְשְׁבוּ
  choice: planejem
  rationale: Com 'o mal' e 'no coração', o verbo indica intenção deliberada, não simples pensamento.
- source_word: אִישׁ אָחִיו
  choice: uns contra os outros
  rationale: Reproduz naturalmente a função recíproca da expressão distributiva hebraica; a forma mais literal é registrada em nota.
- source_word: בִּלְבַבְכֶם
  choice: no coração
  rationale: O singular coletivo é idiomático em português para a intenção interior dos vários destinatários, embora o hebraico tenha sufixo plural.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ אָחִיו
  choice: uns contra os outros
  alternative: cada um contra seu irmão
  rationale: O idioma hebraico usa termos masculinos distributivos para expressar reciprocidade comunitária. A tradução comunica essa reciprocidade sem limitar indevidamente a ordem aos homens, e a nota preserva a forma literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural verbal mantém o discurso dirigido à comunidade; a coordenação foi ajustada à sintaxe natural do português sem eliminar a ênfase ética do hebraico.
