review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente as proibições, a lista de pessoas vulneráveis e o sentido recíproco de רָעַת אִישׁ אָחִיו. «Estrangeiro residente» é uma boa representação de גֵּר neste contexto. A formulação revista torna mais visível, sem excesso de literalismo, que o planejamento do mal ocorre no íntimo dos destinatários plurais.
  naturalness: «Planejem no coração o mal uns contra os outros» é compreensível, mas a ordem das palavras e o singular «coração» soam menos naturais e atenuam o plural do hebraico. «Tramem, em seus corações, o mal uns contra os outros» é mais idiomático e mantém o caráter deliberado do verbo.
  terminology: «Viúva», «órfão», «estrangeiro residente», «pobre» e «oprimam» são escolhas claras e fiéis. A nota sobre o estrangeiro deve evitar afirmar residência permanente, pois גֵּר designa um não nativo residente, sem exigir essa nuance. A nota literal da expressão recíproca deve ser ajustada para não sugerir que «o mal» pertence ao irmão.
  issues:
  - severity: low
    issue: Formulação pouco natural de «planejem no coração»
    rationale: Em português moderno, «tramar ... em seus corações» ou «planejar ... em seus corações» comunica mais naturalmente a intenção interior; o plural também corresponde ao sufixo plural hebraico.
  - severity: low
    issue: A nota b acrescenta «de modo permanente»
    rationale: O termo גֵּר se refere a um estrangeiro residente entre Israel, mas o texto não exige a ideia de permanência.
  - severity: medium
    issue: A nota c apresenta de modo impreciso a construção hebraica
    rationale: '«cada um, o mal de seu irmão» pode sugerir que o mal é do irmão. A nota deve explicitar a relação adversativa/distributiva: o mal de cada um contra seu irmão.'
