  text: 'E a palavra de Yahweh veio a Zacarias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אל, o português natural emprega “a palavra de Yahweh veio a...”, sem reproduzir de modo rígido “e aconteceu”.
- source_word: דְּבַר
  choice: a palavra
  rationale: No construto דְּבַר יְהוָה, “a palavra de Yahweh” preserva a fórmula profética recorrente e sua ligação formal com o hebraico; “mensagem” também seria possível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca de maneira natural em português o destinatário a quem a palavra divina veio.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz o discurso direto que continua no versículo seguinte, mantendo a transição formal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título; outras formas são tradições de tradução ou transliteração.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação próxima da estrutura hebraica. Mantém-se “dizendo” porque o versículo funciona como introdução à fala subsequente.
