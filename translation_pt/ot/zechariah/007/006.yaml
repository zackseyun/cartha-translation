  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: pt
  text: E, quando vocês comem e quando bebem[a], não são vocês mesmos que comem e bebem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, se vocês comem e se vocês bebem”. A conjunção hebraica pode ter sentido temporal (“quando”) ou condicional (“se”); aqui, “quando” parece se ajustar melhor ao curso do argumento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, quando
  rationale: כִּי pode introduzir uma circunstância temporal ou condicional. No contexto, a leitura temporal acompanha naturalmente a referência ao jejum no versículo anterior; a alternativa condicional é preservada em nota.
- source_word: תֹאכְלוּ
  choice: vocês comem
  rationale: O qal imperfeito na segunda pessoa masculina plural expressa aqui uma prática geral; o presente do indicativo é natural em português.
- source_word: וְכִי תִשְׁתּוּ
  choice: e quando bebem
  rationale: Mantém o paralelismo da repetição hebraica e traduz o qal imperfeito como prática geral.
- source_word: הֲלוֹא
  choice: não são
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. Em combinação com os pronomes e particípios seguintes, esta formulação é clara e idiomática em português.
- source_word: אַתֶּם ... וְאַתֶּם
  choice: vocês mesmos
  rationale: Os pronomes independentes repetidos dão ênfase aos próprios destinatários. A expressão reúne essa ênfase de modo natural, enquanto o par verbal conserva os dois membros do paralelo.
- source_word: הָאֹכְלִים ... הַשֹּׁתִים
  choice: que comem e bebem
  rationale: Os particípios com artigo têm valor substantivado. A oração relativa em português preserva o sentido geral e a estrutura retórica sem produzir uma construção artificial.
theological_decisions:
- issue: Força retórica do versículo no contexto
  choice: A pergunta ressalta que o comer e o beber dos destinatários se voltam para eles próprios, em paralelo com a crítica ao jejum do versículo anterior.
  alternative: Uma observação neutra sobre o ato comum de comer e beber.
  rationale: Os pronomes independentes e os particípios substantivados enfatizam os destinatários. A tradução conserva essa ênfase por meio de “vocês mesmos”, sem acrescentar explicitamente uma conclusão teológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” explicita o plural do hebraico. A formulação concisa preserva a pergunta retórica, o paralelismo entre comer e beber e a ênfase nos próprios destinatários.
