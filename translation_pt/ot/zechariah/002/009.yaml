id: ZEC.2.9
reference: Zechariah 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י אֶֽהְיֶה לָּ/הּ֙ נְאֻם יְהוָ֔ה ח֥וֹמַת אֵ֖שׁ סָבִ֑יב וּ/לְ/כָב֖וֹד אֶֽהְיֶ֥ה בְ/תוֹכָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: pt
  text: E eu mesmo serei para ela uma muralha de fogo ao redor — declara Yahweh — e, no meio dela, serei glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei uma glória no meio dela”. O hebraico permite entender “glória” como predicado sem artigo ou, de modo indefinido, como “uma glória”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: E eu mesmo
  rationale: O pronome independente reforça o sujeito já indicado pelo verbo; “eu mesmo” conserva essa ênfase, e “E” dá continuidade ao oráculo.
- source_word: אֶהְיֶה
  choice: serei
  rationale: O imperfeito qal na primeira pessoa do singular tem sentido futuro e predicativo no contexto; “serei” funciona naturalmente nas duas ocorrências.
- source_word: לָהּ
  choice: para ela
  rationale: 'A preposição לְ com היה expressa relação e benefício: Yahweh será proteção para a cidade. O feminino preserva a personificação de Jerusalém/Sião.'
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa o Tetragrama pelo nome divino “Yahweh”.
- source_word: חוֹמַת אֵשׁ
  choice: uma muralha de fogo
  rationale: Reproduz de modo claro a cadeia construta e preserva a metáfora de proteção divina.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa naturalmente a imagem de uma proteção que circunda toda a cidade.
- source_word: וּלְכָבוֹד
  choice: e ... serei glória
  rationale: Preserva o substantivo predicativo marcante כָבוֹד sem transformá-lo no adjetivo “glorioso”; a posição de “no meio dela” torna a frase natural em português.
- source_word: בְתוֹכָהּ
  choice: no meio dela
  rationale: Indica presença no interior ou centro da cidade e conserva a referência feminina do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Personificação feminina de Jerusalém/Sião
  choice: manter “ela/dela”
  alternative: neutralizar como “a cidade” ou explicitar “Jerusalém”
  rationale: Os sufixos hebraicos são femininos singulares. Mantê-los conserva a personificação profética sem acrescentar um nome ausente do versículo.
- issue: Valor predicativo de כָבוֹד
  choice: “serei glória”
  alternative: “serei uma glória”
  rationale: A construção permite mais de uma compreensão quanto à determinação do predicado. O texto principal conserva a formulação mais direta e intensa, enquanto a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada em “no meio dela, serei glória” para evitar rigidez, sem eliminar a ênfase nem a ambiguidade do hebraico. O marcador foi colocado junto de “glória”, expressão à qual a nota se refere.
