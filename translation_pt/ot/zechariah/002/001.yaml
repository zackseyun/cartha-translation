  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: pt
  text: 'Levantei os olhos e vi: eis quatro chifres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quatro poderes». O hebraico diz literalmente «chifres», imagem bíblica frequente de força ou poder governante; a imagem literal foi mantida no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: Levantei os olhos
  rationale: Preserva de modo natural em português a expressão hebraica que indica dirigir o olhar.
- source_word: וָאֵרֶא
  choice: e vi
  rationale: Reproduz de forma concisa a sequência narrativa do hebraico.
- source_word: וְהִנֵּה
  choice: eis
  rationale: Mantém a força vívida e apresentativa de הִנֵּה em registro profético digno e corrente.
- source_word: אַרְבַּע
  choice: quatro
  rationale: Tradução direta do numeral cardinal.
- source_word: קְרָנוֹת
  choice: chifres
  rationale: Retém a imagem concreta do hebraico, cuja função simbólica se esclarece no contexto posterior, sem substituí-la prematuramente por uma interpretação.
theological_decisions:
- issue: Imagem simbólica dos chifres na visão profética
  choice: Manter «quatro chifres» no texto principal.
  alternative: quatro poderes
  rationale: O versículo apresenta o símbolo antes de sua explicação contextual. Traduzir diretamente como «poderes» eliminaria a imagem profética e resolveria antecipadamente sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Levantei os olhos» preserva o idioma hebraico de maneira natural; «eis» conserva o tom visionário sem recorrer ao mais coloquial «olhe».
