base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/017.yaml
  text: Be silent[a], all flesh, before Yahweh[b], for he has roused himself from his holy dwelling.
translation:
  language: pt
  text: Cale-se toda carne[a] diante de Yahweh, pois ele despertou-se[b] de sua santa morada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade”. O hebraico diz literalmente “toda carne”, expressão profética que ressalta a condição criatural dos seres humanos diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “levantou-se” ou “despertou”. O verbo hebraico retrata Yahweh saindo do repouso para agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  choice: Cale-se
  rationale: A interjeição exige silêncio. “Cale-se” comunica de modo direto e solene a ordem dirigida coletivamente a “toda carne”.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Mantém a expressão profética hebraica e seu contraste entre a fragilidade das criaturas humanas e Yahweh, sem reduzi-la silenciosamente a uma paráfrase.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Expressa naturalmente a ideia de estar perante a presença de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma concisa a razão para a ordem de silêncio.
- source_word: נֵעוֹר
  choice: despertou
  rationale: Preserva a imagem do verbo hebraico, que retrata Yahweh saindo do repouso para agir, sem explicitar além do texto a natureza dessa ação.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: de sua santa morada
  rationale: “Morada” é atual e digna, e mantém a imagem espacial sagrada do hebraico.
theological_decisions:
- issue: Alcance antropológico de כָּל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade
  rationale: Embora a expressão possa designar todos os seres humanos, a formulação literal conserva a ênfase profética na condição criatural e evita estreitar sua possível abrangência.
- issue: Sentido da ação divina em נֵעוֹר
  choice: despertou
  alternative: levantou-se / pôs-se em ação
  rationale: “Despertou” mantém a metáfora hebraica de sair do repouso para agir. As alternativas tornam explícita uma interpretação contextual que o verbo apenas evoca.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção coletiva “Cale-se toda carne” preserva o tom profético. Os marcadores foram colocados junto às expressões que suas respectivas notas explicam.
