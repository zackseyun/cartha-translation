  text: ה֥וֹי צִיּ֖וֹן הִמָּלְטִ֑י יוֹשֶׁ֖בֶת בַּת בָּבֶֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/011.yaml
  text: Up[a], Zion! Escape, you who dwell with Daughter Babylon.
translation:
  language: pt
  text: Ei, Sião! Fuja, você que habita na filha da Babilônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ó Sião, escape, você que habita na Filha Babilônia.”'
    reason: Registra alternativas legítimas para a interjeição e para a representação mais literal da construção personificada «filha de Babilônia». A preposição hebraica tem sentido locativo («na/em»), não de companhia.
lexical_decisions:
- source_word: הוֹי
  choice: Ei
  rationale: A interjeição introduz um chamado urgente, não um lamento. “Ei” é atual e direto; “Ai” sugeriria pesar, e “Ó” seria mais solene, porém menos incisivo.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português; no contexto, Sião é personificada e interpelada.
- source_word: הִמָּלְטִי
  choice: Escape
  rationale: O imperativo nifal feminino singular de מלט pede que a destinatária se ponha a salvo. “Escape” preserva a urgência sem especificar indevidamente o modo da saída.
- source_word: יוֹשֶׁבֶת
  choice: você que habita
  rationale: O particípio feminino singular identifica, em valor vocativo, a destinatária. A formulação conserva o gênero e o número do hebraico e soa natural em português corrente.
- source_word: בַּת בָּבֶל
  choice: Filha Babilônia
  rationale: Mantém a personificação profética expressa literalmente pela construção “filha de Babilônia”, sem reduzi-la apenas a uma indicação geográfica.
theological_decisions:
- issue: Referente da interpelação no feminino singular
  choice: Sião é personificada como mulher e chamada a escapar, sendo descrita como aquela que habita com a Filha Babilônia.
  alternative: A fala poderia ser entendida como dirigida simbolicamente a uma habitante individual de Babilônia, ou a expressão בַּת בָּבֶל poderia ser lida como “filha de Babilônia”, isto é, a população ou o território babilônico.
  rationale: As formas femininas singulares e a estrutura vocativa favorecem a personificação profética de Sião. A tradução mantém a imagem e a possível tensão entre Sião personificada e os exilados que ela representa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” torna explícita a interpelação feminina singular; “Filha Babilônia” conserva a personificação profética. A exclamação inicial comunica urgência.
