  text: וַ/יֹּ֣אמֶר אֵלָ֔/ו רֻ֗ץ דַּבֵּ֛ר אֶל הַ/נַּ֥עַר הַלָּ֖ז לֵ/אמֹ֑ר פְּרָזוֹת֙ תֵּשֵׁ֣ב יְרוּשָׁלִַ֔ם מֵ/רֹ֥ב אָדָ֛ם וּ/בְהֵמָ֖ה בְּ/תוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: pt
  text: 'E ele lhe disse: “Corra, fale àquele jovem, dizendo: ‘Jerusalém será habitada como povoações sem muralhas[a], por causa da grande quantidade de pessoas e de animais domésticos dentro dela.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma região aberta”; o hebraico traz um termo plural que pode designar povoações ou lugares sem muralhas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻץ
  choice: Corra
  rationale: Preserva a força e a urgência do imperativo hebraico, em linguagem portuguesa direta.
- source_word: דַּבֵּר
  choice: fale
  rationale: Corresponde de perto ao ato verbal ordenado, sem restringi-lo à mera transmissão de informação.
- source_word: הַנַּעַר הַלָּז
  choice: àquele jovem
  rationale: נַעַר designa aqui um jovem do sexo masculino; o demonstrativo הַלָּז é preservado por “aquele”.
- source_word: פְּרָזוֹת
  choice: como povoações sem muralhas
  rationale: Expressa o sentido plural de assentamentos abertos ou não fortificados e soa mais natural em português do que uma reprodução abstrata como “campo aberto”.
- source_word: תֵּשֵׁב
  choice: será habitada
  rationale: No contexto de Jerusalém e de sua numerosa população, comunica naturalmente a ideia de habitação estabelecida, embora o verbo também possa ser vertido de modo mais formal como “habitará”.
- source_word: מֵרֹב
  choice: por causa da grande quantidade de
  rationale: 'A preposição com רֹב indica causa: a ausência de muralhas se relaciona à grande população e aos muitos animais.'
- source_word: אָדָם
  choice: pessoas
  rationale: O singular coletivo hebraico refere-se à população humana em contraste com os animais; “pessoas” transmite esse valor de modo natural e inclusivo em português.
- source_word: וּבְהֵמָה
  choice: e de animais domésticos
  rationale: בְּהֵמָה designa coletivamente os animais mantidos pela população; “animais domésticos” evita tanto a restrição de “gado” quanto a amplitude excessiva de “animais”.
- source_word: בְּתוֹכָהּ
  choice: dentro dela
  rationale: Mantém a referência feminina a Jerusalém e expressa com naturalidade a população existente em seu interior.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: pessoas
  alternative: seres humanos; humanidade; homem em sentido coletivo
  rationale: Neste contexto, אָדָם contrasta a população humana com os animais. “Pessoas” conserva o sentido coletivo sem sugerir apenas indivíduos do sexo masculino.
- issue: Imagem de Jerusalém como פְּרָזוֹת
  choice: será habitada como povoações sem muralhas
  alternative: habitará como região aberta; será como cidades sem muros
  rationale: A expressão hebraica é idiomática e plural. A tradução escolhida preserva a imagem de assentamentos não fortificados, sem decidir além do texto como isso se relaciona ao crescimento espacial da cidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadeia de ordens foi tornada natural (“fale... e diga”), e a imagem urbana foi preservada sem linguagem denominacional.
