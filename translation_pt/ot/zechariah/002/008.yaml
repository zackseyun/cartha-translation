revisions:
- from: 'E ele lhe disse: “Corra, fale àquele jovem e diga: ‘Jerusalém será habitada como povoações sem muralhas[a], por causa da grande quantidade de pessoas e de animais domésticos dentro dela.’”'
  to: 'E ele lhe disse: “Corra, fale àquele jovem, dizendo: ‘Jerusalém será habitada como povoações sem muralhas[a], por causa da grande quantidade de pessoas e de animais domésticos dentro dela.’”'
  rationale: A revisão limita-se a substituir “e diga” por “dizendo”, para reproduzir com maior precisão a função de לֵאמֹר como introdutor da fala citada. Mantêm-se as escolhas lexicais e a nota alternativa, que preservam a amplitude semântica de פְּרָזוֹת sem resolver indevidamente a imagem idiomática.
