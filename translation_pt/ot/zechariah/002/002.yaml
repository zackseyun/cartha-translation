base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: pt
  text: 'E eu disse ao anjo que falava comigo: “O que são estes?” E ele me disse: “Estes são os chifres[a] que dispersaram Judá, Israel e Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os poderes” ou “os reinos”; o hebraico diz literalmente “chifres”, imagem profética comum de força ou poder governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, no contexto das visões de Zacarias trata-se da figura celestial que interpreta a visão; “anjo” comunica naturalmente esse referente.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: A construção participial com בְּ é usada em Zacarias para o anjo intérprete em diálogo com o profeta. “Falava comigo” é idiomático em português e se ajusta ao contexto melhor do que o formalmente possível “falava em mim”.
- source_word: וָאֹמַר
  choice: perguntei
  rationale: O verbo significa literalmente “disse”, mas a fala introduzida é uma pergunta. “Perguntei” expressa naturalmente a função da declaração em português sem alterar seu conteúdo.
- source_word: מָה אֵלֶּה
  choice: O que são estes?
  rationale: Mantém o interrogativo e o demonstrativo masculino plural, cujo referente visual são os chifres mencionados na resposta.
- source_word: הַקְּרָנוֹת
  choice: os chifres
  rationale: קֶרֶן significa literalmente “chifre” e funciona aqui como imagem profética de força ou poder governante. A imagem do texto é preservada, sem substituí-la por sua interpretação.
- source_word: זֵרוּ
  choice: dispersaram
  rationale: O verbo זרה descreve espalhar ou dispersar, por vezes com a imagem de joeirar. “Dispersaram” comunica com clareza a ação exercida sobre Judá, Israel e Jerusalém.
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: Judá, Israel e Jerusalém
  rationale: Os nomes próprios são mantidos nas formas portuguesas consagradas, preservando também a sequência coordenada do hebraico.
theological_decisions:
- issue: Força simbólica de “chifres”
  choice: Manter a imagem literal “chifres” no texto principal.
  alternative: Traduzir interpretativamente como “poderes” ou “reinos”.
  rationale: A visão profética emprega uma imagem simbólica, mas o próprio texto chama os objetos de “chifres”. Substituir a imagem por uma interpretação eliminaria uma ambiguidade legítima e iria além da formulação da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem do diálogo foi preservada, enquanto “perguntei” traduz de modo natural a função contextual de וָאֹמַר. O marcador da nota foi colocado junto a “chifres”, termo ao qual a nota se refere.
