base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: pt
  text: 'Então perguntei: “O que estes vêm fazer?” Ele respondeu: “Estes são os chifres[a] que dispersaram Judá, de modo que ninguém levantou a cabeça[b]. Estes vieram para aterrorizá-los e derrubar[c] os chifres das nações que ergueram um chifre contra a terra de Judá, a fim de dispersá-la.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os “chifres” simbolizam poder ou força agressiva; a imagem foi mantida no texto, em vez de ser substituída por sua interpretação.
    reason: cultural_note
  - marker: b
    text: Literalmente, “conforme a boca de um homem, ele não levantou a cabeça”; a expressão retrata humilhação ou impotência.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “lançar abaixo”. O verbo hebraico é raro e seu sentido exato é incerto; no contexto, indica abater os chifres das nações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: chifres / um chifre
  rationale: Mantém a imagem simbólica de poder e agressão própria da visão, sem substituí-la pela interpretação abstrata “poderes”.
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: dispersaram / a fim de dispersá-la
  rationale: Expressa a ideia de espalhar ou dispersar Judá, preservando a associação com derrota e exílio.
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: de modo que ninguém levantava a cabeça
  rationale: Reproduz de forma natural em português a imagem hebraica de humilhação e impotência, sem explicitar além do texto uma incapacidade absoluta.
- source_word: לְהַחֲרִיד
  choice: para aterrorizá-los
  rationale: Comunica a força causativa do verbo, isto é, provocar pavor ou tremor.
- source_word: לְיַדּוֹת
  choice: derrubar
  rationale: O verbo é raro e difícil; no contexto, indica fazer cair ou abater os chifres hostis. “Derrubar” é claro e preserva a ação concreta da imagem.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Designa aqui potências nacionais estrangeiras hostis a Judá; “nações” é a opção mais natural e contextualmente adequada.
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: que ergueram um chifre
  rationale: Conserva a metáfora hebraica de afirmação agressiva de força ou orgulho contra Judá.
- source_word: אֵלֶּה בָאִים לַעֲשׂוֹת
  choice: O que estes vêm fazer?
  rationale: Representa naturalmente o particípio e mantém a vivacidade imediata da cena visionária.
- source_word: וַיָּבֹאוּ אֵלֶּה
  choice: Estes vieram
  rationale: Faz a narrativa avançar e liga a chegada dessas figuras ao propósito declarado em seguida.
theological_decisions:
- issue: Manutenção da imagem dos chifres como símbolo de poder hostil
  choice: Conservar “chifres” no texto principal.
  alternative: Traduzir interpretativamente como “poderes” ou “reinos”.
  rationale: A visão profética depende da relação literária entre os chifres e as figuras que vêm abatê-los. Interpretar o símbolo no corpo do texto reduziria sua força e resolveria indevidamente sua identificação.
- issue: Sentido da expressão sobre não levantar a cabeça
  choice: Traduzir “ninguém levantava a cabeça”.
  alternative: “Ninguém conseguia levantar a cabeça” ou uma formulação com “homem”.
  rationale: “Ninguém” comunica naturalmente o valor representativo de אִישׁ em português moderno, enquanto a forma verbal mantém a imagem de humilhação sem acrescentar explicitamente a noção interpretativa de incapacidade.
- issue: Referência pronominal em “aterrorizá-los”
  choice: Manter o pronome masculino plural, retomando os chifres.
  alternative: Explicitar “aterrorizar esses chifres” ou interpretar como as nações.
  rationale: O hebraico usa um pronome plural cuja referência imediata são os chifres personificados. Preservar o pronome conserva a imagem e a leve tensão do original.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe direta preserva o ritmo da visão. As metáforas concretas “chifres”, “levantava a cabeça” e “ergueram um chifre” foram mantidas, enquanto notas breves esclarecem o simbolismo e as dificuldades lexicais.
