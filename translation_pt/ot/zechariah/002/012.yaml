source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos: “Após a glória[a], ele me enviou às nações que saqueiam vocês, pois quem toca em vocês toca na pupila do olho dele[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa da glória, ele me enviou às nações que saqueiam vocês”. A expressão hebraica “após a glória” é difícil e pode indicar propósito, sequência ou relação com honra ou glória.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “na menina do olho dele”. A expressão hebraica indica a parte mais sensível e cuidadosamente protegida do olho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal por transliteração, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Forma tradicional e ainda compreensível do título divino, sem restringir indevidamente os exércitos a forças humanas.
- source_word: אַחַר כָּבוֹד
  choice: Após a glória
  rationale: Tradução relativamente formal que conserva a construção hebraica difícil e sua ambiguidade quanto a sequência, propósito ou relação com honra/glória.
- source_word: שְׁלָחַנִי
  choice: ele me enviou
  rationale: Expressa de modo natural o qatal hebraico; o sujeito permanece apenas pronominal, como exige a tensão do contexto.
- source_word: אֶל הַגּוֹיִם
  choice: contra as nações
  rationale: Embora אֶל normalmente indique direção, o contexto hostil das nações saqueadoras favorece o sentido de missão em oposição a elas; a alternativa mais literal é registrada em nota.
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: que saqueiam vocês
  rationale: O particípio de שׁלל descreve a tomada de despojos; “saqueiam” é atual, claro e adequado ao contexto de opressão.
- source_word: הַנֹּגֵעַ בָּכֶם
  choice: quem toca em vocês
  rationale: Reproduz naturalmente em português a força genérica do particípio singular.
- source_word: נֹגֵעַ
  choice: toca
  rationale: Mantém a repetição do verbo נגע e evita intensificá-lo com uma interpretação como “fere” ou “ataca”.
- source_word: בְּבָבַת עֵינוֹ
  choice: na pupila do olho dele
  rationale: Torna transparente a imagem hebraica da parte extremamente sensível e protegida do olho, preservando o sufixo masculino sem identificar seu referente.
theological_decisions:
- issue: Referente de “me” em “ele me enviou” e de “dele” em “olho dele”
  choice: Manter os referentes sem identificação explícita, como no hebraico.
  alternative: Identificar o falante como o profeta, o mensageiro angelical ou uma figura divina enviada por Yahweh.
  rationale: O texto apresenta uma mudança marcante entre a fala divina e a linguagem de missão na primeira pessoa. Explicitar a identidade do falante ou o referente do pronome resolveria uma tensão teológica que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural do hebraico. A formulação deliberadamente incomum “Após a glória” conserva a dificuldade do original, esclarecida em nota.
