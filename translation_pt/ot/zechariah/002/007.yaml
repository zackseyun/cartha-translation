  text: וְ/הִנֵּ֗ה הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י יֹצֵ֑א וּ/מַלְאָ֣ךְ אַחֵ֔ר יֹצֵ֖א לִ/קְרָאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
translation:
  language: pt
  text: E eis que o anjo que falava comigo saiu, e outro anjo saiu ao encontro dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função discursiva de chamar a atenção e a vivacidade da visão profética, em linguagem elevada, porém amplamente compreensível.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, o contexto visionário e celestial favorece “anjo”.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio identifica o anjo por sua atuação contínua na narrativa; “falava comigo” expressa naturalmente o valor relacional da construção hebraica.
- source_word: יֹצֵא
  choice: saiu
  rationale: No fluxo narrativo, o particípio hebraico descreve o movimento da figura; o pretérito perfeito é claro e idiomático em português.
- source_word: וּמַלְאָךְ אַחֵר
  choice: e outro anjo
  rationale: אַחֵר indica uma segunda figura distinta, sem exigir ênfase adicional em diferença.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: 'Expressa de modo natural a finalidade e a direção do movimento: o segundo anjo sai para encontrar o primeiro.'
theological_decisions:
- issue: Identidade dos dois anjos
  choice: As duas ocorrências de מַלְאָךְ são traduzidas genericamente como “anjo”, distinguindo as figuras apenas pela sequência narrativa.
  alternative: Identificar o primeiro como o anjo intérprete e atribuir ao segundo uma missão celestial específica.
  rationale: O versículo não identifica nenhuma das figuras além de seus papéis imediatos; a tradução evita inserir uma angelologia ou identificação que o próprio texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” mantém a tonalidade profética sem arcaísmo excessivo. Não se reproduziu a nota inglesa ligada a “behold”, pois seu conteúdo trata de outra expressão e não corresponde ao marcador; a tradução principal já comunica naturalmente הַדֹּבֵר בִּי.
