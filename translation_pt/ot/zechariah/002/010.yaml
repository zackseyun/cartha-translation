  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: pt
  text: “Atenção! Atenção![a] Fujam da terra do norte”, declara Yahweh, “pois eu espalhei vocês como os quatro ventos dos céus[b]”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A interjeição hebraica é uma convocação urgente. Também poderia ser traduzida por “Ei! Ei!” ou, de modo mais tradicional, “Oh! Oh!”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos quatro ventos do céu eu espalhei vocês”. O hebraico pode ser entendido como comparação (“como os quatro ventos”) ou como expressão de direção e dispersão (“aos quatro ventos”).'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: Atenção! Atenção!
  rationale: A repetição funciona aqui como convocação urgente à atenção e à ação, não como lamento. “Atenção!” é clara e natural em português moderno.
- source_word: וְנֻסוּ
  choice: Fujam
  rationale: O imperativo plural de נוּס exige fuga imediata; “fujam” preserva tanto a força quanto o número verbal.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Mantém de perto a construção hebraica e sua possível ressonância geográfica e teológica.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética com linguagem clara e solene, conservando o nome divino presente no texto hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão dada para a ordem de fugir.
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: como os quatro ventos dos céus
  rationale: O prefixo כְּ favorece formalmente a comparação “como”; “dos céus” conserva o plural hebraico. A possível leitura direcional é registrada em nota.
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: eu espalhei vocês
  rationale: “Espalhei” preserva a imagem de estender ou dispersar, enquanto “vocês” expressa de modo claro o objeto plural em português de ampla compreensão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” conserva o nome divino sem substituí-lo por um título.
- issue: Sentido de כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: 'comparação: “como os quatro ventos dos céus”'
  alternative: 'direção ou dispersão: “aos quatro ventos do céu”'
  rationale: A forma com כְּ favorece a comparação, mas a expressão admite entendimento idiomático direcional. A nota preserva essa ambiguidade sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O discurso direto foi pontuado para deixar clara a fórmula profética repetida, sem alterar sua função.
