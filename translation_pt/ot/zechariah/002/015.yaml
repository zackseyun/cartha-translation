  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: pt
  text: E, naquele dia, muitas nações se unirão a Yahweh e serão o meu povo. Habitarei em seu meio, e você saberá que Yahweh dos Exércitos me enviou a você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não identifica explicitamente quem é o “me” na frase “Yahweh dos Exércitos me enviou a você”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִלְווּ
  choice: se unirão
  rationale: O nifal de לוה admite sentido reflexivo ou passivo; “se unirão” expressa de modo natural a adesão voluntária sem perder a ideia de vínculo.
- source_word: גוֹיִם רַבִּים
  choice: muitas nações
  rationale: גּוֹיִם designa aqui povos nacionais em alcance internacional; “nações” é mais direto do que “gentios”.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição indica adesão dirigida a Yahweh; o nome divino é transliterado para tornar o referente explícito e acompanhar a camada de consulta fornecida.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão profética temporal corrente, preservada em português natural e digno.
- source_word: וְהָיוּ לִי לְעָם
  choice: e serão o meu povo
  rationale: Mantém a fórmula da aliança e o singular coletivo עָם apesar do sujeito plural “muitas nações”.
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: Habitarei no meio de você
  rationale: שׁכן significa habitar; “no meio de você” preserva o sufixo feminino singular, dirigido contextualmente a Sião/Jerusalém.
- source_word: וְיָדַעַתְּ
  choice: e você saberá
  rationale: Traduz diretamente a segunda pessoa feminina singular e a fórmula profética de reconhecimento.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Exércitos” comunica de modo transparente o sentido de צְבָאוֹת e preserva o título divino.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O qatal indica ação concluída; o pretérito perfeito é natural em português dentro da fórmula de reconhecimento.
- source_word: אֵלָיִךְ
  choice: a você
  rationale: Preserva o pronome de segunda pessoa feminina singular sem inserir no texto um referente contextual não explicitado neste versículo.
theological_decisions:
- issue: Identidade de quem diz “Yahweh dos Exércitos me enviou”
  choice: Manter “me” sem identificar o falante
  alternative: Explicitar o falante como o mensageiro angélico, o profeta ou uma figura divina/messiânica
  rationale: O hebraico deixa a identidade do falante sem explicação explícita. A tradução conserva essa tensão em vez de resolvê-la interpretativamente.
- issue: Tensão entre “muitas nações” e o singular “povo”
  choice: serão o meu povo
  alternative: serão os meus povos
  rationale: O singular עָם apresenta as muitas nações como uma identidade coletiva da aliança; “meu povo” preserva essa formulação.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível ao público brasileiro. A segunda pessoa feminina singular é vertida por “você”, pois o destinatário contextual é Sião/Jerusalém. A ordem foi levemente ajustada para fluência, sem eliminar a ambiguidade do falante.
