  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
translation:
  language: pt
  text: 'Levantei os olhos e vi: eis um homem com um cordel de medir[a] na mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma corda de medir». O termo hebraico pode designar concretamente uma corda ou cordão usado para fazer medições.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Levantei os olhos
  rationale: Preserva a expressão idiomática hebraica que introduz o ato visionário, sem substituí-la pela formulação mais interpretativa «dirigi o olhar».
- source_word: וָאֵרֶא
  choice: e vi
  rationale: Traduz diretamente a primeira pessoa de ראה e mantém a sequência narrativa marcada pela conjunção.
- source_word: וְהִנֵּה
  choice: eis
  rationale: Conserva a função enfática e apresentativa do marcador hebraico, chamando a atenção para o que surge na visão.
- source_word: אִישׁ
  choice: um homem
  rationale: Reflete o substantivo masculino singular e identifica corretamente a figura humana masculina da visão.
- source_word: וּבְיָדוֹ
  choice: na mão
  rationale: Mantém o detalhe visual da expressão preposicional hebraica; em português, sua colocação ao fim da oração produz uma frase mais natural.
- source_word: חֶבֶל מִדָּה
  choice: um cordel de medir
  rationale: Expressa um cordão ou corda usado como instrumento de medição. «Cordel de medir» é claro, concreto e próximo da construção hebraica.
theological_decisions: []
