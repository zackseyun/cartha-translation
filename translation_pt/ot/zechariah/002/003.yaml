id: ZEC.2.3
reference: Zechariah 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּרְאֵ֣/נִי יְהוָ֔ה אַרְבָּעָ֖ה חָרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/003.yaml
  text: Then Yahweh showed me four craftsmen[a].
translation:
  language: pt
  text: Então Yahweh me mostrou quatro artesãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferreiros”; o termo hebraico pode indicar mais especificamente trabalhadores habilidosos, como os que trabalham com metais, mas tem o sentido mais amplo de artesãos.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Então ... me mostrou
  rationale: O hifil narrativo de ראה com sufixo de primeira pessoa significa literalmente “fez-me ver” e, de modo natural em português, “me mostrou”. “Então” expressa a progressão da visão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אַרְבָּעָה
  choice: quatro
  rationale: É o numeral cardinal que determina o substantivo masculino plural seguinte.
- source_word: חָרָשִׁים
  choice: artesãos
  rationale: O termo designa trabalhadores habilidosos e pode abranger profissionais da madeira, da pedra ou do metal. “Artesãos” mantém essa abrangência sem especificar indevidamente o ofício.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com ordem frasal natural e vocabulário amplamente compreensível. O termo “artesãos” preserva a amplitude semântica do hebraico.
source_grounding:
  english_pob_role: consult_only
