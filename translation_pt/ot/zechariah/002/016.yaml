source:
  edition: WLC
  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: pt
  text: E Yahweh herdará Judá como sua porção na terra santa[a] e escolherá Jerusalém novamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre o solo da santidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: herdará
  rationale: O qal de נחל conserva aqui a linguagem de receber ou possuir como herança. “Herdará” mantém a imagem pactual incomum, em vez de reduzi-la à ideia geral de tomar posse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת יְהוּדָה
  choice: Judá
  rationale: O marcador de objeto direto introduz o nome próprio, vertido segundo a forma portuguesa consagrada.
- source_word: חֶלְקוֹ
  choice: como sua porção
  rationale: חלק designa porção, parte ou quinhão atribuído. A expressão preserva a imagem de pertença e evita repetir “herança” junto de “herdará”.
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: na terra santa
  rationale: Embora literalmente seja “sobre o solo da santidade”, a expressão se refere ao território em sua condição consagrada; “na terra santa” comunica isso de modo natural.
- source_word: וּבָחַר
  choice: e escolherá
  rationale: בחר significa escolher ou selecionar; o sujeito continua sendo Yahweh.
- source_word: עוֹד
  choice: novamente
  rationale: No contexto de restauração, עוֹד indica a renovação da escolha de Jerusalém.
- source_word: בִּירוּשָׁלָם
  choice: Jerusalém
  rationale: Emprega-se a forma portuguesa tradicional do nome próprio.
theological_decisions:
- issue: Linguagem de herança aplicada a Judá como herança de Yahweh
  choice: “Yahweh herdará Judá como sua porção”
  alternative: “Yahweh tomará posse de Judá como sua herança”
  rationale: 'A formulação preserva a inversão teologicamente significativa da imagem habitual: aqui é Yahweh quem herda Judá. Isso mantém a tensão de pertença pactual presente no hebraico.'
- issue: Sentido de אַדְמַת הַקֹּדֶשׁ
  choice: “na terra santa”
  alternative: “sobre o solo da santidade”
  rationale: A escolha comunica a dimensão geográfica e consagrada da expressão sem transformar uma construção idiomática hebraica em português artificial.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. Conserva-se “herdará” para representar a linguagem deliberadamente incomum do hebraico. O marcador [a] aparece imediatamente após a expressão explicada.
