  text: כִּ֠י הִנְ/נִ֨י מֵנִ֤יף אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/הָי֥וּ שָׁלָ֖ל לְ/עַבְדֵי/הֶ֑ם וִֽ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחָֽ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own slaves[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: pt
  text: Pois eis que estou prestes a agitar a minha mão sobre eles, e eles se tornarão despojo para os seus próprios escravos[a]. Então vocês saberão que Yahweh dos Exércitos[b] me enviou.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para os seus próprios servos”. O termo hebraico עבד pode significar “servo” ou “escravo”; “escravos” preserva aqui a força da inversão de poder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “SENHOR dos Exércitos”; tradicionalmente, “SENHOR dos exércitos celestiais”.'
    reason: lexical_alternative
  - marker: c
    text: O falante declara que Yahweh dos Exércitos o enviou, mas não se identifica explicitamente; sua identidade permanece aberta no contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior e mantém de modo natural a ligação discursiva.
- source_word: הִנְנִי
  choice: eis que estou prestes a
  rationale: Preserva a função enfática e chamativa da expressão e, no contexto profético com particípio, comunica a iminência da ação.
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: agitar a minha mão sobre eles
  rationale: Mantém a imagem concreta do gesto expresso por הניף e a preposição 'sobre', sem substituir a formulação por uma interpretação abstrata, embora o contexto indique ameaça.
- source_word: וְהָיוּ
  choice: e eles se tornarão
  rationale: Expressa o estado resultante indicado por היה de maneira idiomática em português.
- source_word: שָׁלָל
  choice: despojo
  rationale: Termo atual e digno para bens tomados ao inimigo, apropriado ao contexto de reversão militar.
- source_word: לְעַבְדֵיהֶם
  choice: para os seus próprios escravos
  rationale: 'עבד pode significar servo ou escravo. ''Escravos'' evidencia a forte inversão de poder: os antes subjugados receberão como despojo aquilo que pertencia aos seus dominadores.'
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O plural é tornado explícito por 'vocês', e 'então' comunica a relação de consequência entre a ação anunciada e o reconhecimento posterior.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צבאות pelo sentido militar transparente e contemporâneo de 'Exércitos'.
- source_word: שְׁלָחָנִי
  choice: me enviou
  rationale: O perfeito hebraico apresenta o envio como ato concluído; em português, o pretérito perfeito é a forma natural e não perde sua relevância presente.
theological_decisions:
- issue: 'Identidade de quem diz: “Yahweh dos Exércitos me enviou”'
  choice: Manter a primeira pessoa sem identificar o falante na tradução.
  alternative: Identificar o falante como o profeta Zacarias, o mensageiro angelical ou uma figura divina/messiânica.
  rationale: O hebraico não identifica explicitamente o referente de 'me' neste versículo. A tradução preserva essa abertura contextual e a tensão teológica, sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Pois eis que” conserva a solenidade profética e a ênfase do hebraico; “vocês” torna natural o plural de וִידַעְתֶּם. A imagem concreta de agitar a mão foi preservada, assim como a ambiguidade sobre a identidade do falante.
