base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: pt
  text: 'E eu disse: “Aonde[a] você vai?” E ele me disse: “Para medir Jerusalém, para ver qual é a sua largura e qual é o seu comprimento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Para onde você vai?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֖נָה
  choice: Aonde
  rationale: O advérbio interrogativo pergunta pelo destino. “Aonde você vai?” expressa de modo natural em português o sentido direcional do hebraico.
- source_word: הֹלֵ֑ךְ
  choice: você vai
  rationale: O particípio de הלך, acompanhado do pronome, descreve o movimento em curso; no contexto de uma pergunta sobre destino, “você vai” é a formulação portuguesa mais natural.
- source_word: לָמֹד֙
  choice: Vou medir
  rationale: O infinitivo de מדד significa “medir”. A inclusão de “vou” torna natural em português a resposta elíptica do hebraico sem alterar a ação concreta.
- source_word: אֶת יְר֣וּשָׁלִַ֔ם
  choice: Jerusalém
  rationale: O nome próprio é vertido pela forma consagrada em português; את marca o objeto direto e não recebe tradução separada.
- source_word: לִרְא֥וֹת
  choice: para ver
  rationale: ראה significa literalmente “ver”. Aqui, o infinitivo introduz a finalidade da medição, e “para ver” preserva tanto o sentido quanto a expressão hebraica.
- source_word: כַּמָּֽה רָחְבָּ֖הּ
  choice: qual é a sua largura
  rationale: A expressão hebraica significa literalmente “quanto [é] sua largura”. A formulação escolhida é clara e natural, mantendo a dimensão nominal indicada no original.
- source_word: וְכַמָּ֥ה אָרְכָּֽהּ
  choice: e qual é o seu comprimento
  rationale: A frase paralela indica a segunda dimensão da cidade. “Comprimento” traduz diretamente o substantivo e preserva o paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Aonde” preserva de forma concisa a ideia de destino, enquanto a nota registra a alternativa “para onde”. O diálogo foi formulado naturalmente, e a resposta elíptica do hebraico recebeu “vou” para evitar rigidez em português.
