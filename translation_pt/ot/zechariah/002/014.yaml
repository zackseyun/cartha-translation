id: ZEC.2.14
reference: Zechariah 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: pt
  text: Cante de alegria e alegre-se[a], ó filha de Sião[b], pois eis que venho e habitarei em seu meio — declara Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aclame de alegria e fique contente”.'
    reason: lexical_alternative
  - marker: b
    text: “Filha de Sião” é uma personificação poética de Sião/Jerusalém.
    reason: cultural_note
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: Cante de alegria
  rationale: O imperativo feminino singular de רנן exprime uma manifestação jubilosa, que pode ser canto ou aclamação. “Cante de alegria” comunica naturalmente o tom celebrativo sem perder a dignidade profética.
- source_word: וְשִׂמְחִי
  choice: e alegre-se
  rationale: O imperativo feminino singular de שמח convoca Sião à alegria. “Alegre-se” preserva a força verbal e concorda com a personificação feminina.
- source_word: בַּת צִיּוֹן
  choice: ó filha de Sião
  rationale: A expressão é um vocativo poético que personifica Sião/Jerusalém. A partícula “ó” torna o vocativo claro e natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para os imperativos anteriores; “pois” é conciso e adequado ao registro profético.
- source_word: הִנְנִי בָא
  choice: eis que venho
  rationale: הִנְנִי chama enfaticamente a atenção para o próprio falante, e o particípio בָא apresenta a vinda de modo vívido ou iminente. “Eis que venho” preserva ambos os elementos com solenidade natural.
- source_word: וְשָׁכַנְתִּי
  choice: e habitarei
  rationale: O verbo שכן indica estabelecer residência ou permanecer. O futuro “habitarei” preserva o tema da presença divina sem acrescentar uma interpretação posterior.
- source_word: בְתוֹכֵךְ
  choice: em seu meio
  rationale: A forma hebraica se dirige a Sião no feminino singular e pode denotar presença dentro dela ou entre seus habitantes. “Em seu meio” mantém essa amplitude espacial e comunitária.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם יְהוָה é uma fórmula profética solene. “Declara” transmite seu peso, e “Yahweh” representa o nome divino יהוה em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o nome próprio יהוה. “Yahweh” o conserva explicitamente; a nota informa a substituição tradicional por “SENHOR”, sem ocultar o dado do texto-fonte.
- issue: A habitação divina em Sião
  choice: habitarei em seu meio
  alternative: morarei entre vocês; habitarei dentro de você
  rationale: A formulação mantém a imagem da presença de Deus em Sião e preserva a possível dimensão tanto espacial quanto comunitária, sem especificar uma realização teológica não expressa neste versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém o paralelismo dos imperativos, o vocativo feminino e a fórmula profética, evitando linguagem excessivamente arcaica.
