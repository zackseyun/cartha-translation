base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: pt
  text: 'Ele me perguntou: “O que você está vendo?” Respondi: “Vejo, e eis um candelabro todo de ouro, com um recipiente sobre o topo dele e sete lâmpadas sobre ele, e sete e sete tubos para as lâmpadas que estão sobre o topo dele.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica diz literalmente “sete e sete tubos”. Também pode ser entendida como sete tubos para cada uma das sete lâmpadas.
    reason: A sintaxe e a configuração precisa do candelabro são ambíguas; a nota informa a principal leitura alternativa sem resolvê-la no texto.
lexical_decisions:
- source_word: מְנוֹרַת זָהָב כֻּלָּהּ
  choice: um candelabro todo de ouro
  rationale: “Candelabro” é a designação portuguesa natural para a menorá; “todo de ouro” reproduz a totalidade expressa por כֻּלָּהּ.
- source_word: גֻלָּהּ
  choice: um recipiente
  rationale: O substantivo designa aqui uma bacia ou reservatório situado no alto do candelabro. “Recipiente” preserva a função sem especificar além do que o termo e o contexto garantem.
- source_word: נֵרֹתֶיהָ
  choice: lâmpadas
  rationale: נֵר designa lâmpadas alimentadas com óleo, não velas.
- source_word: מוּצָקוֹת
  choice: tubos
  rationale: No contexto do aparato de iluminação, indica condutos ou canais que levam óleo às lâmpadas; “tubos” é claro e evita o sentido moderno mais restrito de “bicos”.
theological_decisions:
- issue: Número e distribuição dos condutos
  choice: sete e sete tubos
  alternative: sete tubos para cada lâmpada / quarenta e nove tubos
  rationale: O hebraico repete שִׁבְעָה (“sete e sete”) e sua construção é discutida. A tradução mantém a formulação do texto sem decidir se há sete condutos no total, sete para cada lâmpada ou outra disposição.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira. “Você” traduz diretamente o singular אַתָּה. A repetição rígida de וַיֹּאמֶר foi suavizada para “perguntou” e “respondi”, conforme a função discursiva, enquanto “Estou vendo” preserva o valor verbal de רָאִיתִי. O marcador [a] aparece no texto principal.
