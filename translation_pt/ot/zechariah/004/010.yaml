  text: כִּ֣י מִ֣י בַז֮ לְ/י֣וֹם קְטַנּוֹת֒ וְ/שָׂמְח֗וּ וְ/רָא֞וּ אֶת הָ/אֶ֧בֶן הַ/בְּדִ֛יל בְּ/יַ֥ד זְרֻבָּבֶ֖ל שִׁבְעָה אֵ֑לֶּה עֵינֵ֣י יְהוָ֔ה הֵ֥מָּה מְשׁוֹטְטִ֖ים בְּ/כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: pt
  text: Pois quem desprezou o dia das pequenas coisas? Esses sete se alegrarão ao ver a pedra de prumo[a] na mão de Zorobabel — eles são os olhos de Yahweh, que percorrem toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pedra de estanho”; tradicionalmente, “o prumo”. O termo hebraico pode designar estanho, mas, neste contexto de construção, provavelmente se refere a um peso de prumo ou a uma pedra de medição.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: desprezou
  rationale: Expressa tratar algo como insignificante ou indigno, preservando a força da pergunta retórica.
- source_word: לְיוֹם קְטַנּוֹת
  choice: o dia das pequenas coisas
  rationale: Mantém a expressão concreta e deliberadamente ampla do hebraico, sem restringi-la interpretativamente a “pequenos começos”.
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: se alegrarão ao ver
  rationale: Reproduz os dois verbos e torna explícita, em português natural, a relação temporal entre a alegria e a visão do sinal na mão de Zorobabel.
- source_word: הָאֶבֶן הַבְּדִיל
  choice: a pedra de prumo
  rationale: No contexto da construção, a expressão provavelmente designa um peso de prumo ou uma pedra usada para medir o alinhamento; a alternativa lexical mais literal ligada a “estanho” é preservada em nota.
- source_word: בְּיַד זְרֻבָּבֶל
  choice: na mão de Zorobabel
  rationale: Preserva diretamente a formulação hebraica e destaca a participação ativa de Zorobabel.
- source_word: שִׁבְעָה אֵלֶּה
  choice: esses sete
  rationale: Mantém o demonstrativo e liga os sete ao símbolo já apresentado na visão.
- source_word: עֵינֵי יְהוָה
  choice: os olhos de Yahweh
  rationale: Conserva a imagem teologicamente significativa e traduz o nome divino como nome próprio, não como título.
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: que percorrem toda a terra
  rationale: Comunica o movimento ativo e abrangente expresso pelo particípio hebraico em português atual e natural.
theological_decisions:
- issue: Identidade de “esses sete”
  choice: “Esses sete” é ligado por aposição aos “olhos de Yahweh” no simbolismo da visão.
  alternative: A expressão pode retomar primeiramente as sete lâmpadas e só depois identificá-las simbolicamente com os olhos de Yahweh.
  rationale: A sintaxe hebraica aproxima “esses sete” de “os olhos de Yahweh”. A tradução conserva essa identificação simbólica sem definir além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a pergunta retórica, a imagem concreta das “pequenas coisas” e a tensão simbólica dos sete olhos. O marcador da nota foi colocado junto de “pedra de prumo”, termo ao qual a nota lexical se refere.
