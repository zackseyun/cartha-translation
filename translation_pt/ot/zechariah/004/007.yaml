base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: pt
  text: 'Quem é você, ó grande monte? Diante de Zorobabel, você se tornará uma planície. E ele fará aparecer a pedra do topo[a] em meio a aclamações: “Graça, graça a ela!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a pedra de remate»; literalmente, «a pedra da cabeça».
    reason: lexical_alternative
  - marker: b
    text: Ou «Favor, favor a ela!»; חֵן também pode significar «encanto» ou «beleza», conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אַתָּה הַר הַגָּדוֹל
  choice: Quem é você, ó grande monte?
  rationale: Preserva a pergunta retórica e a personificação do grande obstáculo. O vocativo «ó» transmite com naturalidade a interpelação direta.
- source_word: לְמִישֹׁר
  choice: você se tornará uma planície
  rationale: Mantém a imagem de transformação do monte em terreno plano, em vez de reduzi-la apenas à remoção de um obstáculo.
- source_word: וְהוֹצִיא
  choice: ele fará sair
  rationale: Reproduz o valor causativo do hifil. Pelo contexto, o sujeito implícito é Zorobabel, sem precisar repeti-lo no texto.
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: a pedra principal
  rationale: Traduz literalmente a ideia de «pedra da cabeça/principal» sem decidir de modo indevido se é especificamente uma pedra de remate; essa possibilidade é registrada em nota.
- source_word: תְּשֻׁאוֹת
  choice: em meio a aclamações
  rationale: Expressa os gritos públicos e celebratórios de modo natural e digno em português.
- source_word: חֵן חֵן לָהּ
  choice: “Graça, graça sobre ela!”
  rationale: Conserva a repetição enfática e o sentido de favor ou graça dirigido à pedra, cujo gênero feminino corresponde ao pronome hebraico.
theological_decisions:
- issue: Sentido de חֵן na aclamação
  choice: graça/favor é invocado ou celebrado sobre a pedra
  alternative: beleza ou encanto é atribuído à pedra
  rationale: חֵן pode significar graça, favor, encanto ou beleza. No contexto profético da conclusão do templo, «graça» preserva a ressonância do favor divino, enquanto a nota mantém aberta a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A personificação é mantida por «você», e «ó» conserva o tom profético sem arcaísmo excessivo. «Zorobabel» segue a forma portuguesa consagrada.
