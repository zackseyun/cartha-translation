    issue: «sobre ela» traduz לָהּ de modo mais interpretativo do que direto.
    rationale: 'A preposição לְ normalmente marca a direção da aclamação: «a ela». «Sobre ela» pode sugerir uma invocação derramada sobre a pedra, sentido possível no contexto, mas não explicitado pela preposição hebraica.'
  - severity: low
    issue: «Fará sair» é pouco idiomático neste contexto.
    rationale: Embora reflita formalmente o hifil de יצא, «fará aparecer» comunica de modo mais natural a apresentação/produção da pedra sem especificar indevidamente se ela é instalada ou removida.
  - severity: low
    issue: «Pedra principal» pode sugerir uma pedra de maior importância, sem representar claramente a imagem espacial de «pedra da cabeça».
    rationale: «Pedra do topo» mantém a imagem hebraica e deixa aberta, por nota, a alternativa técnica «pedra de remate».
