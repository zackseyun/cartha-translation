revisions:
- from: 'Quem é você, ó grande monte? Diante de Zorobabel, você se tornará uma planície. E ele fará sair a pedra principal[a] em meio a aclamações: “Graça, graça sobre ela!”[b]'
  to: 'Quem é você, ó grande monte? Diante de Zorobabel, você se tornará uma planície. E ele fará aparecer a pedra do topo[a] em meio a aclamações: “Graça, graça a ela!”[b]'
  rationale: A revisão ajusta a direção da aclamação à preposição hebraica, melhora a fluência de וְהוֹצִיא em português e torna mais nítida a imagem espacial de הָאֶבֶן הָרֹאשָׁה. As notas preservam as alternativas lexicais relevantes e a ambiguidade quanto ao valor preciso de חֵן.
