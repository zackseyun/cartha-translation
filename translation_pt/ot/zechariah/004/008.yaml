  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a mim[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido como “o SENHOR”.'
    reason: Leitura tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa de היה introduz o desenvolvimento seguinte. Em português, a fórmula «a palavra ... veio» expressa naturalmente o hebraico sem recorrer ao arcaísmo «e aconteceu».
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, «a palavra» preserva a fórmula profética recorrente e indica uma comunicação divina específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Equivalente direto e natural da preposição com sufixo de primeira pessoa do singular.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português moderno, os dois-pontos cumprem essa função com maior naturalidade do que o decalque «dizendo».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto «SENHOR» o substitui por um título; «Jeová» representa uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula profética «a palavra de Yahweh veio a mim»; os dois-pontos traduzem idiomaticamente לֵאמֹר e preparam a fala do versículo seguinte.
