  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְדֵ֣י זְרֻבָּבֶ֗ל יִסְּד֛וּ הַ/בַּ֥יִת הַ/זֶּ֖ה וְ/יָדָ֣י/ו תְּבַצַּ֑עְנָה וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: pt
  text: As mãos de Zorobabel lançaram os alicerces desta casa[a], e suas mãos a concluirão. Então você saberá[b] que Yahweh dos Exércitos[c] me enviou a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “casa” se refere ao templo.
    reason: cultural_note
  - marker: b
    text: “Você” está no singular, mas “vocês”, no fim do versículo, está no plural no texto hebraico.
    reason: grammatical_note
  - marker: c
    text: 'Tradicionalmente: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: As mãos de Zorobabel
  rationale: Preserva a forma plural e a imagem repetida das mãos, que destaca a atuação pessoal de Zorobabel tanto no início quanto na conclusão da obra.
- source_word: יִסְּדוּ
  choice: lançaram os alicerces
  rationale: No contexto da construção do templo, יסד se refere especificamente ao assentamento dos alicerces; a expressão é natural e clara em português.
- source_word: הַבַּיִת הַזֶּה
  choice: desta casa
  rationale: Mantém o sentido literal de בַּיִת, “casa”, sem ocultar que, no contexto, a expressão designa o templo.
- source_word: וְיָדָיו תְּבַצַּעְנָה
  choice: e suas mãos a concluirão
  rationale: Conserva a repetição de “mãos” e expressa o sentido de levar a obra até o fim. O pronome “a” retoma “casa”.
- source_word: וְיָדַעְתָּ
  choice: Então você saberá
  rationale: O singular hebraico é preservado por “você”; “então” comunica a relação de resultado com a conclusão da casa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת pelo sentido concreto de forças ou exércitos, em linguagem atual.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito hebraico apresenta o envio como ato realizado; o pretérito perfeito é direto e natural em português.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Torna explícito que o pronome hebraico é plural, em contraste com o “você” singular da oração anterior.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio da aliança. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais; dos poderes; dos seres celestiais
  rationale: “Dos Exércitos” preserva a amplitude e a força do título hebraico sem restringir silenciosamente quais hostes estão em vista.
- issue: Identidade do falante em “me enviou”
  choice: Mantida sem explicitação
  alternative: Identificar o falante como o anjo ou como o profeta
  rationale: Este versículo não nomeia novamente o falante; acrescentar uma identificação resolveria uma questão contextual que o hebraico deixa implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “mãos” foi mantida por seu valor retórico. A alternância entre “você” e “vocês” reproduz a mudança do singular para o plural no hebraico.
