  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: pt
  text: 'Então ele me disse: “Você não sabe o que são estas coisas?” E eu disse: “Não, meu senhor[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”. O hebraico אֲדֹנִי é uma forma respeitosa de tratamento que significa “meu senhor” e, aqui, se refere ao interlocutor na visão, não ao nome divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Então ele me perguntou
  rationale: O wayyiqtol dá continuidade à narrativa. Como a fala seguinte é uma pergunta, “perguntou” expressa naturalmente em português a função de אמר neste contexto; o infinitivo quotativo לֵאמֹר não precisa ser reproduzido separadamente antes do discurso direto.
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Você não sabe
  rationale: Preserva a forma interrogativa negativa e sua expectativa retórica, em linguagem portuguesa corrente, sem transformá-la numa afirmação.
- source_word: מָה אֵלֶּה
  choice: o que são estas coisas
  rationale: Reproduz o interrogativo com o demonstrativo plural de modo claro e natural, mantendo a referência aos elementos da visão.
- source_word: וָאֹמַר
  choice: Eu respondi
  rationale: No intercâmbio de diálogo, “respondi” comunica naturalmente o valor contextual de “disse”, sem acrescentar conteúdo à resposta.
- source_word: לֹא
  choice: Não
  rationale: Mantém a resposta hebraica elíptica e concisa, sem explicitar “não sei”, embora isso esteja implícito.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém o tratamento respeitoso dirigido ao interlocutor da visão. A inicial minúscula evita confundi-lo com um título divino; a nota registra a alternativa idiomática “senhor”.
theological_decisions:
- issue: Sentido de אֲדֹנִי como forma de tratamento ao interlocutor da visão
  choice: meu senhor
  alternative: senhor
  rationale: Neste contexto, o termo é uma forma respeitosa de tratamento dirigida ao mensageiro/intérprete, não o nome divino nem necessariamente um título de divindade. A tradução conserva a dignidade e a forma possessiva do hebraico sem resolver o interlocutor como Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “você” torna explícito o sujeito masculino singular indicado pela forma verbal hebraica e mantém um diálogo natural; “meu senhor” conserva o respeito sem usar maiúscula teológica.
