  text: וַ/יַּ֜עַן וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר זֶ֚ה דְּבַר יְהוָ֔ה אֶל זְרֻבָּבֶ֖ל לֵ/אמֹ֑ר לֹ֤א בְ/חַ֨יִל֙ וְ/לֹ֣א בְ/כֹ֔חַ כִּ֣י אִם בְּ/רוּחִ֔/י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: pt
  text: 'Então ele me respondeu: “Esta é a palavra de Yahweh a Zorobabel: ‘Não por força[a] nem por poder, mas pelo meu Espírito’, diz Yahweh dos Exércitos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não por exército nem por poder”, pois a palavra hebraica traduzida como “força” também pode indicar um exército ou força militar.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Então ele me respondeu
  rationale: A sequência narrativa e a fórmula introdutória de fala são expressas de modo natural em português, sem reproduzir de maneira redundante o hebraico literal ‘respondeu e disse a mim, dizendo’.
- source_word: זֶה דְּבַר יְהוָה
  choice: Esta é a palavra de Yahweh
  rationale: ‘Palavra’ preserva a fórmula profética e suas ressonâncias intertextuais; ‘Yahweh’ translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֶל זְרֻבָּבֶל
  choice: a Zorobabel
  rationale: A preposição marca o destinatário da palavra profética; ‘Zorobabel’ é a forma portuguesa estabelecida do nome.
- source_word: לֹא בְחַיִל
  choice: Não por força
  rationale: חַיִל pode indicar força, recursos ou força militar. ‘Força’ mantém a amplitude do termo, enquanto a nota registra a leitura militar possível.
- source_word: וְלֹא בְכֹחַ
  choice: nem por poder
  rationale: כֹּחַ designa capacidade, vigor ou poder. ‘Nem por poder’ forma um paralelismo claro e natural com ‘não por força’.
- source_word: כִּי אִם בְּרוּחִי
  choice: mas pelo meu Espírito
  rationale: A construção כִּי אִם estabelece o contraste exclusivo; ‘pelo’ mantém o valor instrumental. Neste contexto, רוּחַ com o sufixo divino refere-se adequadamente ao Espírito de Deus.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: diz Yahweh dos Exércitos
  rationale: ‘Diz’ preserva a fórmula profética concisa. ‘Dos Exércitos’ traduz צְבָאוֹת de forma transparente e conserva suas associações militares e celestiais.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração ‘Yahweh’ preserva o nome pessoal, sem substituí-lo pelo título ‘SENHOR’.
- issue: Sentido de רוּחִי
  choice: meu Espírito
  alternative: meu espírito; meu sopro
  rationale: Embora רוּחַ possa significar vento, sopro ou espírito, o contexto contrasta os recursos humanos com a atuação do próprio Deus. A maiúscula identifica a referência divina sem eliminar a amplitude lexical do hebraico.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos exércitos; SENHOR dos Exércitos; SENHOR dos hosts
  rationale: ‘Exércitos’ torna o título inteligível ao leitor moderno e preserva suas possíveis referências às hostes celestiais e militares, sem restringi-las indevidamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção concisa e paralelismo audível. A fórmula hebraica redundante de introdução da fala foi vertida idiomaticamente, e as ambiguidades relevantes de חַיִל e do título צְבָאוֹת foram preservadas no texto e nas notas.
