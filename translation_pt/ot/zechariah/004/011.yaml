  yaml_path: translation/ot/zechariah/004/011.yaml
  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
translation:
  language: pt
  text: 'Então respondi e lhe disse: “O que são estas duas oliveiras à direita do candelabro e à sua esquerda?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר אֵלָיו
  choice: Então respondi e lhe disse
  rationale: Preserva a sequência narrativa e o idioma hebraico ‘respondeu e disse’, mantendo explícito o pronome de אֵלָיו sem acrescentar seu antecedente.
- source_word: מַה שְּׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: O que são estas duas oliveiras
  rationale: מַה introduz a pergunta, e זֵיתִים designa aqui oliveiras, não ramos; o plural pede ‘são’ em português.
- source_word: עַל יְמִין הַמְּנוֹרָה
  choice: à direita do candelabro
  rationale: Neste contexto espacial, עַל indica posição relativa. ‘À direita de’ é natural em português e evita sugerir que as árvores estejam fisicamente sobre o candelabro.
- source_word: וְעַל שְׂמֹאולָהּ
  choice: e à sua esquerda
  rationale: O sufixo feminino singular retoma הַמְּנוֹרָה; a formulação mantém o paralelismo espacial de modo idiomático.
- source_word: הַמְּנוֹרָה
  choice: o candelabro
  rationale: מְנוֹרָה é o suporte de lâmpadas. ‘Candelabro’ é uma designação bíblica corrente e amplamente inteligível em português, sem recorrer à transliteração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com sintaxe narrativa natural. Mantém a fórmula hebraica ‘respondi e disse’ em vez de reduzi-la a ‘perguntei’, e não explicita quem é o referente de ‘lhe’ além do que o versículo declara.
