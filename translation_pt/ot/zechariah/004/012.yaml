base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: pt
  text: 'Então respondi pela segunda vez e lhe disse: “O que são estes dois ramos de oliveira[a], que ficam ao lado dos dois tubos de ouro[b] e derramam de si o ouro[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estes dois cachos (ou brotos) das oliveiras”. O termo hebraico é incomum aqui e pode indicar brotos de oliveira carregados de frutos, e não ramos maiores.
    reason: lexical_alternative
  - marker: b
    text: Ou “os dois canos de ouro” ou “os dois canais dourados”.
    reason: lexical_alternative
  - marker: c
    text: Provavelmente se refere ao azeite dourado; em hebraico, literalmente, “o ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית
  choice: Então respondi pela segunda vez
  rationale: O wayyiqtol dá continuidade à narrativa, e שֵׁנִית indica explicitamente que esta é a segunda intervenção do profeta.
- source_word: וָאֹמַר אֵלָיו
  choice: e lhe disse
  rationale: Mantém o sentido básico de אמר, sem substituí-lo pelo mais interpretativo “perguntei”, embora a fala seja uma pergunta.
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: estes dois ramos de oliveira
  rationale: שִׁבֲּלֵי é incomum neste contexto e normalmente se relaciona a espigas ou cachos. “Ramos de oliveira” comunica com clareza a imagem botânica, enquanto a nota preserva as alternativas mais literais.
- source_word: אֲשֶׁר בְּיַד
  choice: que ficam ao lado de
  rationale: A expressão literalmente ligada a “mão” tem aqui valor espacial; “ao lado de” é natural em português para a relação entre objetos inanimados.
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: os dois tubos de ouro
  rationale: O termo raro צַנְתְּרוֹת designa condutos ou canais no mecanismo visionário. “Tubos” preserva a função de condução sem especificar em excesso o formato.
- source_word: הַמְרִיקִים מֵעֲלֵיהֶם
  choice: derramam de si
  rationale: O particípio causativo expressa esvaziar ou fazer fluir. “Derramam de si” conserva tanto a ação quanto a difícil ideia de origem contida em מֵעֲלֵיהֶם, sem explicar o mecanismo da visão.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: O hebraico diz literalmente “o ouro”. A formulação mantém a metáfora visionária; a provável referência ao azeite dourado é apresentada em nota.
theological_decisions:
- issue: Identidade de “o ouro” na visão do candelabro
  choice: Manter “o ouro” no texto principal
  alternative: Traduzir como “o azeite dourado”
  rationale: A redação literal preserva a imagem e a tensão interpretativa do texto hebraico, sem inserir no corpo do versículo uma explicação provável, mas não explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a estranheza própria da visão sem tornar obscuros os vínculos sintáticos; as alternativas lexicais e a provável identificação do “ouro” são mantidas nas notas.
