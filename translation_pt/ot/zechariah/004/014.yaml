base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: pt
  text: 'E ele disse: “Estes são os dois filhos do azeite[a], que estão de pé junto ao Senhor de toda a terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os dois ungidos”. A expressão hebraica significa literalmente “os dois filhos do azeite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que estão de pé diante do Senhor de toda a terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Reproduz a sequência narrativa simples do wayyiqtol de אמר sem acrescentar uma relação lógica não expressa.
- source_word: אֵלֶּה שְׁנֵי
  choice: Estes são os dois
  rationale: O demonstrativo plural tem função predicativa, e a cópula é naturalmente explicitada em português; o artigo retoma as duas figuras já vistas.
- source_word: בְּנֵי הַיִּצְהָר
  choice: filhos do azeite
  rationale: Preserva a metáfora hebraica incomum e traduz יִצְהָר como azeite, adequado ao contexto das oliveiras, sem resolver a expressão no sentido interpretativo de “ungidos”.
- source_word: הָעֹמְדִים
  choice: que estão de pé
  rationale: Expressa o valor durativo do particípio e conserva a imagem concreta da posição ou função contínua dessas figuras.
- source_word: עַל
  choice: junto ao
  rationale: No idioma de estar de pé na presença de um soberano, indica proximidade e serviço; “junto ao” é natural em português, enquanto “diante do” permanece como alternativa em nota.
- source_word: אֲדוֹן
  choice: Senhor
  rationale: Transmite o título soberano de אֲדוֹן de modo digno e convencional neste contexto.
- source_word: כָּל הָאָרֶץ
  choice: de toda a terra
  rationale: Comunica diretamente a extensão universal do domínio expresso pela construção hebraica.
theological_decisions:
- issue: Sentido de בְּנֵי הַיִּצְהָר
  choice: Manter a metáfora como “filhos do azeite”.
  alternative: “os dois ungidos”
  rationale: A expressão hebraica não é o termo comum e direto para “ungidos”. Manter sua imagem evita impor uma identificação teológica mais específica, enquanto a interpretação tradicional é registrada em nota.
- issue: Nuance de עַל com הָעֹמְדִים
  choice: “estão de pé junto ao”
  alternative: “estão de pé diante do”
  rationale: A formulação escolhida conserva a proximidade e a ideia de serviço na presença do soberano. A alternativa pode realçar melhor o cenário de corte e, por isso, é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão deliberadamente incomum “filhos do azeite” conserva a imagem e a ambiguidade do hebraico; as notas apresentam as principais alternativas sem substituir o texto-fonte por uma interpretação.
