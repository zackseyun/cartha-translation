  text: וַ֠/יַּעַן הַ/מַּלְאָ֞ךְ הַ/דֹּבֵ֥ר בִּ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י הֲ/ל֥וֹא יָדַ֖עְתָּ מָה הֵ֣מָּה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: pt
  text: 'Então o anjo que falava comigo[a] respondeu e me disse: “Você não sabe o que são estas coisas?” E eu disse: “Não, meu senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que conversava comigo”. A expressão hebraica descreve o anjo mantendo uma conversa com Zacarias.
    reason: lexical_alternative
  - marker: b
    text: Ou “senhor”. Em hebraico, “meu senhor” é aqui uma forma respeitosa de se dirigir ao anjo, não uma referência ao SENHOR.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa responder; a escolha mantém sua relação com o verbo seguinte, “disse”.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, no relato visionário de Zacarias trata-se do intérprete celestial.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio com בְ descreve o anjo envolvido em uma conversa contínua com Zacarias; o imperfeito “falava” expressa naturalmente esse valor descritivo em português.
- source_word: וַיֹּאמֶר אֵלַי
  choice: me disse
  rationale: Equivalência natural de אמר אל em português, sem alterar a introdução do discurso direto.
- source_word: הֲלוֹא
  choice: Você não
  rationale: Preserva a forma de pergunta retórica com negação sem intensificar nem resolver seu tom.
- source_word: יָדַעְתָּ
  choice: sabe
  rationale: ידע significa primariamente “saber/conhecer”; “sabe” é direto e natural neste contexto.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: o que são estas coisas
  rationale: A expressão pergunta pela identidade ou significado dos elementos vistos; “estas coisas” explicita naturalmente o pronome demonstrativo plural neutro em português.
- source_word: וָאֹמַר
  choice: Eu respondi
  rationale: Embora literalmente seja “eu disse”, “respondi” expressa com naturalidade a função da fala na sequência dialogal.
- source_word: לֹא
  choice: Não
  rationale: Mantém a resposta hebraica breve, deixando implícito “não sei”, recuperável da pergunta anterior.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Conserva o caráter respeitoso da forma de tratamento dirigida ao anjo, sem identificá-lo com o SENHOR.
theological_decisions:
- issue: Referente e força de אֲדֹנִי
  choice: 'tratamento respeitoso dirigido ao anjo intérprete: “meu senhor”'
  alternative: “senhor” ou “meu mestre”
  rationale: Neste contexto, o termo se dirige ao anjo que conversa com Zacarias, e não a YHWH. A grafia minúscula e a nota evitam atribuir divindade ao interlocutor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna a pergunta natural sem introduzir informalidade indevida; “meu senhor” mantém o respeito do hebraico. A repetição hebraica “respondeu e disse” foi preservada como “respondeu e me disse”, enquanto a segunda ocorrência de וָאֹמַר foi vertida funcionalmente por “respondi”.
