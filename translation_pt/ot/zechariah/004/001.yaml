  text: וַ/יָּ֕שָׁב הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י וַ/יְעִירֵ֕/נִי כְּ/אִ֖ישׁ אֲשֶׁר יֵע֥וֹר מִ/שְּׁנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/001.yaml
  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
translation:
  language: pt
  text: Então o anjo que falava comigo voltou e me despertou, como um homem que é despertado do seu sono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que desperta do seu sono». O verbo hebraico pode ser entendido em sentido passivo ou reflexivo («é despertado») ou, de modo mais intransitivo, como «desperta».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שׁוב indica voltar ou retornar; no contexto narrativo da visão, «voltou» é natural e preserva a ideia de retomada da interação.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar «mensageiro», no contexto de uma visão profética designa com naturalidade um intermediário celestial.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio caracteriza o anjo como aquele que falava com Zacarias; o imperfeito português preserva adequadamente esse valor continuativo.
- source_word: וַיְעִירֵנִי
  choice: me despertou
  rationale: O hifil de עור é causativo, «despertar alguém»; «me despertou» é claro, atual e digno.
- source_word: כְּאִישׁ
  choice: como um homem
  rationale: Mantém a comparação singular e o substantivo masculino genérico do hebraico.
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: que é despertado do seu sono
  rationale: O nifal admite sentido passivo ou reflexivo; a formulação passiva reproduz mais diretamente a forma verbal e cria paralelo com o verbo causativo anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «despertou/despertado» foi mantida para refletir a correspondência lexical e retórica do hebraico.
