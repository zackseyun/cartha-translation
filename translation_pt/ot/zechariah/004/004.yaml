base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: pt
  text: 'Então respondi e disse ao anjo que falava comigo[a]: “O que são estas, meu senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que conversava comigo”. Esta expressão hebraica se repete em Zacarias para designar o anjo intérprete que acompanha o profeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Então respondi
  rationale: A sequência hebraica diz literalmente “respondi e disse”, fórmula narrativa que, em português atual, é expressa de modo natural por “Então respondi”. Isso preserva a progressão do relato sem reproduzir uma duplicação pouco idiomática.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, o contexto visionário de Zacarias apresenta uma figura celestial que interpreta a visão.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio com בִּי integra uma fórmula recorrente em Zacarias e indica o anjo que mantém diálogo com o profeta. “Falava comigo” é natural e preserva o aspecto continuativo.
- source_word: לֵאמֹר
  choice: não representado separadamente
  rationale: O infinitivo introduz a fala direta; em português, os dois-pontos e a citação já cumprem essa função, tornando “dizendo” redundante.
- source_word: מָה אֵלֶּה
  choice: O que são estas coisas?
  rationale: O demonstrativo plural feminino retoma os elementos da visão. A inclusão de “coisas” produz uma pergunta clara e natural em português, sem especificar além do hebraico.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida ao interlocutor angelical. A inicial minúscula evita confundi-la com um título divino.
theological_decisions:
- issue: Referente de אֲדֹנִי
  choice: 'Tratamento respeitoso dirigido ao anjo: “meu senhor”'
  alternative: 'Entender ou grafar a expressão como título divino: “meu Senhor”'
  rationale: O interlocutor imediato é “o anjo que falava comigo”. A forma respeitosa não exige que o destinatário seja identificado como Deus; por isso, usa-se inicial minúscula.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção evita rigidez excessiva, mantém o caráter visionário do relato e conserva a distinção entre o anjo e Deus.
