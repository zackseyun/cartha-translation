base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/003.yaml
  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
translation:
  language: pt
  text: E duas oliveiras estavam ao lado dela[a], uma à direita da bacia[b] e outra à sua esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sobre ela» ou «por cima dela». A preposição hebraica tem um sentido espacial mais amplo do que simples proximidade, mas as referências à direita e à esquerda favorecem «ao lado dela».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o recipiente de óleo em forma de bacia na visão do candelabro.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם
  choice: E duas
  rationale: O waw dá continuidade à descrição da visão, e o numeral cardinal é preservado explicitamente.
- source_word: זֵיתִים
  choice: oliveiras
  rationale: Embora o substantivo possa referir-se a azeitonas ou oliveiras, a posição espacial à direita e à esquerda indica claramente árvores.
- source_word: עָלֶיהָ
  choice: ao lado dela
  rationale: A preposição עַל tem sentido espacial amplo; as indicações subsequentes de direita e esquerda favorecem proximidade lateral, sem sugerir que as árvores estivessem literalmente sobre o objeto.
- source_word: אֶחָד ... וְ/אֶחָד
  choice: uma ... e outra
  rationale: Em português, a construção distributiva feminina concorda naturalmente com «oliveiras» e expressa com clareza os dois membros do par.
- source_word: מִ/ימִין הַ/גֻּלָּה
  choice: à direita da bacia
  rationale: Mantém a relação espacial e entende גֻּלָּה como o recipiente de óleo em forma de bacia no conjunto do candelabro.
- source_word: עַל שְׂמֹאלָהּ
  choice: à sua esquerda
  rationale: Reproduz de modo conciso a posição correspondente no lado esquerdo.
