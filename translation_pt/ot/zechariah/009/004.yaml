base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: pt
  text: Eis que o Senhor a despojará; derrubará no mar a sua riqueza[a], e ela será consumida pelo fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua força”, “seu exército” ou “seu poder”. O termo hebraico pode indicar riqueza, recursos ou poder militar; “riqueza” se ajusta à menção das riquezas de Tiro no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força dêitica e solene do anúncio profético em português corrente de registro elevado.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino Adonai de modo idiomático, sem tratá-lo como o Tetragrama.
- source_word: יוֹרִשֶׁנָּה
  choice: a despojará
  rationale: Expressa o hifil de ירש como privação de posses e posição, adequado ao juízo contra a cidade, sem restringir o sentido a expulsão física.
- source_word: וְהִכָּה בַיָּם
  choice: derrubará no mar
  rationale: Comunica de maneira natural o golpe e a ruína associados ao verbo נכה, mantendo a ligação espacial com o mar sem tornar excessivamente explícita a imagem.
- source_word: חֵילָהּ
  choice: a sua riqueza
  rationale: חַיִל pode indicar riqueza, recursos, força ou poder militar. A referência à prata e ao ouro acumulados por Tiro no versículo anterior favorece 'riqueza', enquanto a nota preserva as demais possibilidades.
- source_word: וְהִיא
  choice: e ela
  rationale: Mantém a personificação feminina da cidade presente no hebraico.
- source_word: בָּאֵשׁ תֵּאָכֵל
  choice: será consumida pelo fogo
  rationale: Reproduz a construção passiva e a metáfora convencional de אכל para destruição pelo fogo em linguagem portuguesa natural e digna.
theological_decisions:
- issue: Referente das formas femininas
  choice: As formas femininas referem-se à cidade de Tiro, personificada como 'ela'.
  alternative: Empregar o pronome impessoal ou repetir 'Tiro'.
  rationale: O hebraico apresenta sufixos e pronome no feminino singular, conforme a personificação profética habitual das cidades. Preservar 'ela' mantém a imagem literária sem acrescentar conteúdo doutrinário.
- issue: Sentido de חֵילָהּ no juízo contra Tiro
  choice: riqueza
  alternative: força, exército ou poder
  rationale: O contexto imediato destaca as riquezas acumuladas por Tiro, mas a amplitude semântica do termo é mantida em nota para não eliminar a possível dimensão política ou militar.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível. A pontuação em duas orações preserva o ritmo do anúncio de juízo; a personificação feminina da cidade foi mantida.
