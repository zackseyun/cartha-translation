source:
  edition: WLC
  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: pt
  text: Exulte muito, filha de Sião! Grite de alegria, filha de Jerusalém! Eis que o seu rei vem até você — ele é justo e vitorioso[a], humilde[b] e montado num jumento, num jumentinho[c], cria de uma jumenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “salvo” ou “que recebeu salvação”. A forma hebraica pode descrever alguém que foi libertado por Deus e, por isso, chega vitorioso.
    reason: alternative_reading
  - marker: b
    text: Ou “pobre”, “abatido” ou “aflito”. A palavra hebraica pode indicar condição humilde ou sofrimento, além de atitude humilde.
    reason: lexical_alternative
  - marker: c
    text: A expressão “num jumento, num jumentinho, cria de uma jumenta” provavelmente emprega paralelismo poético para descrever o mesmo animal de duas maneiras.
    reason: cultural_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: Exulte muito
  rationale: O imperativo feminino singular convoca a Sião personificada a uma alegria intensa. “Exulte” preserva a força celebrativa e o tom profético em português atual.
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: filha de Sião / filha de Jerusalém
  rationale: Mantém a personificação poética das cidades e de seus habitantes, sem substituí-la por uma explicação.
- source_word: הָרִיעִי
  choice: Aclame
  rationale: O verbo designa um brado forte, frequentemente jubiloso ou ligado à aclamação. “Aclame” é conciso e se ajusta à chegada do rei.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com ênfase aquilo para o qual se chama a atenção. A expressão é digna, clara e corrente no registro bíblico moderno.
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: o seu rei vem até você
  rationale: O presente comunica a vivacidade e a iminência do anúncio profético; “até você” preserva a direção expressa no hebraico.
- source_word: צַדִּיק
  choice: justo
  rationale: Conserva tanto o sentido moral quanto as ressonâncias relacionais e pactuais do termo.
- source_word: וְנוֹשָׁע
  choice: vitorioso
  rationale: O particípio passivo pode caracterizar alguém salvo ou libertado por Deus e, por isso, triunfante. “Vitorioso” comunica naturalmente o resultado no contexto régio, enquanto a forma e as alternativas são registradas em nota.
- source_word: עָנִי
  choice: humilde
  rationale: No contraste com a pompa régia, “humilde” comunica bem a condição modesta do rei, sem excluir os sentidos possíveis de pobre, abatido ou aflito, preservados em nota.
- source_word: וְרֹכֵב עַל חֲמוֹר
  choice: e vem montado num jumento
  rationale: Torna natural em português a construção participial e mantém claramente a maneira da chegada do rei.
- source_word: וְעַל עַיִר בֶּן אֲתֹנוֹת
  choice: num jumentinho, cria de uma jumenta
  rationale: Preserva a segunda descrição poética do animal e explicita de modo natural a relação entre a cria e a mãe.
theological_decisions:
- issue: Sentido de וְנוֹשָׁע na profecia régia
  choice: vitorioso
  alternative: salvo; que recebeu salvação
  rationale: A forma hebraica é passiva e pode destacar que o rei foi salvo ou libertado por Deus; no contexto, isso também implica triunfo. A tradução principal expressa o resultado sem apagar a agência divina possível, explicitada na nota.
- issue: Sentido de עָנִי aplicado ao rei
  choice: humilde
  alternative: pobre; abatido; aflito
  rationale: “Humilde” expressa de modo claro a condição não ostensiva do rei e sua chegada sem pompa imperial. A nota conserva o campo semântico mais amplo, evitando reduzir o termo apenas a uma disposição interior.
- issue: Relação entre o jumento e o jumentinho
  choice: descrição poeticamente paralela de um animal
  alternative: referência a dois animais
  rationale: A aposição e o paralelismo hebraicos favorecem a leitura de duas descrições do mesmo animal, mas a redação principal preserva a sequência do texto e a nota reconhece a função poética sem dogmatizar além da evidência.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a personificação profética, o ritmo exclamativo e as ambiguidades lexical e teológica relevantes por meio de notas. “Você” acompanha o tratamento singular dirigido à filha de Sião e evita formas regionais menos universais.
