  text: וַ/הֲסִרֹתִ֨י דָמָ֜י/ו מִ/פִּ֗י/ו וְ/שִׁקֻּצָי/ו֙ מִ/בֵּ֣ין שִׁנָּ֔י/ו וְ/נִשְׁאַ֥ר גַּם ה֖וּא לֵֽ/אלֹהֵ֑י/נוּ וְ/הָיָה֙ כְּ/אַלֻּ֣ף בִּֽ/יהוּדָ֔ה וְ/עֶקְר֖וֹן כִּ/יבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: pt
  text: Tirarei da boca dele o sangue e, dentre os seus dentes, as coisas detestáveis[a]. Então, também ele será um remanescente para o nosso Deus[b]; será como um chefe de clã em Judá, e Ecrom será como o jebuseu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Coisas detestáveis” provavelmente se refere a coisas idólatras ou ritualmente impuras, talvez alimentos ligados ao culto pagão.
    reason: cultural_note
  - marker: b
    text: 'Ou: “também ele permanecerá para o nosso Deus” ou “também ele será deixado para o nosso Deus”. O verbo hebraico pode ter o sentido geral de permanecer ou restar, embora “remanescente” preserve sua possível ressonância profética.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “como o jebuseu” provavelmente sugere incorporação a Judá, assim como os jebuseus foram absorvidos em Jerusalém, em vez de continuarem como uma potência inimiga separada.
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Tirarei
  rationale: O hifil de סור expressa a ação causativa de remover. “Tirarei” é natural em português e rege com clareza os dois objetos seguintes.
- source_word: דָמָיו מִפִּיו
  choice: da boca dele o sangue
  rationale: Preserva a imagem concreta e a ambiguidade de דָּם, sem decidir no texto principal se se trata de sangue ingerido em prática pagã, culpa de sangue ou linguagem simbólica.
- source_word: וְשִׁקֻּצָיו מִבֵּין שִׁנָּיו
  choice: e, do meio dos seus dentes, as coisas detestáveis
  rationale: “Coisas detestáveis” mantém a forte conotação cultual de שִׁקּוּץ sem restringi-la indevidamente a um único tipo de objeto ou alimento; a imagem corporal dos dentes é conservada.
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: Então também ele ficará como remanescente
  rationale: O nifal de שׁאר pode significar permanecer, restar ou ser deixado. “Ficará como remanescente” conserva a ressonância profética, enquanto a nota registra a tradução mais geral.
- source_word: לֵאלֹהֵינוּ
  choice: para o nosso Deus
  rationale: A preposição ל indica relação ou pertencimento. A formulação sugere inclusão entre os que pertencem ao Deus de Israel sem explicitar mais do que o hebraico.
- source_word: וְהָיָה כְּאַלֻּף בִּיהוּדָה
  choice: será como um chefe de clã em Judá
  rationale: אַלּוּף designa aqui, com maior probabilidade, um chefe ou líder de grupo familiar. “Chefe de clã” comunica tanto posição quanto estrutura social.
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: e Ecrom será como o jebuseu
  rationale: Mantém a comparação concisa do hebraico e deixa que a nota esclareça sua provável alusão histórica à incorporação dos jebuseus.
theological_decisions:
- issue: A condição do filisteu transformado
  choice: Representar purificação de práticas detestáveis e inclusão em relação com o Deus de Israel, preservando o singular do hebraico.
  alternative: Entender a passagem apenas como submissão política ou tornar explícito que o singular representa coletivamente a Filístia.
  rationale: A remoção do sangue e das coisas detestáveis, seguida de “também ele” e “para o nosso Deus”, aponta para purificação e inclusão, mas o texto não deve eliminar a possibilidade de dimensão política nem explicar o referente coletivo no corpo do versículo.
- issue: Ressonância de remanescente em וְנִשְׁאַר
  choice: Usar “ficará como remanescente” no texto principal.
  alternative: Traduzir “também ele permanecerá” ou “também ele será deixado”.
  rationale: O verbo admite uma formulação mais geral, mas o contexto profético favorece a ideia de remanescente. A alternativa lexical é preservada em nota para não ocultar a ambiguidade.
- issue: Sentido da comparação com o jebuseu
  choice: Manter literalmente “como o jebuseu” e explicar apenas em nota sua provável ideia de incorporação.
  alternative: Parafrasear no texto que Ecrom será incorporada a Judá.
  rationale: A comparação histórica é alusiva, e torná-la uma declaração explícita de assimilação resolveria uma inferência que o hebraico deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens concretas de boca e dentes, o singular representativo e as ambiguidades referentes ao sangue, ao remanescente e ao jebuseu. Os marcadores foram posicionados junto às expressões que cada nota explica.
