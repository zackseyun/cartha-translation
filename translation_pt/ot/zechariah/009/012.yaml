  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: pt
  text: Voltem à fortaleza, prisioneiros da esperança[a]; ainda hoje declaro que restituirei a você em dobro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cativos da esperança”. A expressão hebraica é metafórica e pode sugerir pessoas que continuam presas, mas são sustentadas pela esperança.
    reason: lexical_alternative
  - marker: b
    text: Ou “restituirei a você uma porção dobrada” ou “devolverei a você em dobro”. O hebraico traz aqui um pronome feminino singular, provavelmente dirigido a Sião ou Jerusalém personificada.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: O imperativo plural de שוב pode indicar retorno físico e também ter ressonância de restauração da aliança; “voltem” preserva ambas as possibilidades sem as especificar em excesso.
- source_word: לְבִצָּרוֹן
  choice: à fortaleza
  rationale: בצרון designa um lugar fortificado ou reduto. “Fortaleza” mantém a imagem concreta e permite sua dimensão profética ou metafórica.
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: prisioneiros da esperança
  rationale: A cadeia construta significa literalmente “prisioneiros da esperança”. A expressão preserva a metáfora marcante de pessoas ainda presas, mas vinculadas ou sustentadas pela esperança.
- source_word: גַּם הַיּוֹם
  choice: ainda hoje
  rationale: A expressão salienta a atualidade e a força imediata do anúncio. “Ainda hoje” é natural em português e preserva essa ênfase.
- source_word: מַגִּיד
  choice: declaro
  rationale: O particípio de נגד, ligado à forma verbal de primeira pessoa que se segue, funciona como anúncio presente. “Declaro” transmite essa força com dignidade e naturalidade.
- source_word: מִשְׁנֶה
  choice: em dobro
  rationale: מִשְׁנֶה pode significar “dobro” ou “porção dobrada”. “Em dobro” é conciso e mantém implícito, como no hebraico, aquilo que será restituído.
- source_word: אָשִׁיב לָךְ
  choice: eu lhes restituirei
  rationale: O hifil de שוב tem aqui sentido restitutivo. “Restituirei” se ajusta ao contexto de reversão e restauração. Embora o sufixo hebraico seja feminino singular, o português corrente pode dirigir-se naturalmente ao grupo vocativo no plural; a nota registra a forma original e sua provável personificação.
theological_decisions:
- issue: Referente do pronome feminino singular em לָךְ
  choice: O texto principal usa “lhes”, em concordância discursiva natural com “prisioneiros”, sem identificar expressamente o referente.
  alternative: Manter “a você”, entendendo a destinatária como Sião/Jerusalém personificada ou como a comunidade da aliança em singular coletivo.
  rationale: O hebraico traz um sufixo feminino singular, provavelmente dirigido à Sião/Jerusalém personificada, mas o referente não deve ser acrescentado ao texto. A nota preserva essa particularidade e a ambiguidade entre a destinatária coletiva personificada e o grupo interpelado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo profético, a metáfora incomum “prisioneiros da esperança” e a concisão do hebraico. Os marcadores [a] e [b] aparecem no texto principal.
