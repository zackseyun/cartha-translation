revisions:
- from: Então Yahweh aparecerá sobre eles, e sua flecha sairá como um relâmpago; o Senhor Yahweh tocará a trombeta[a] e avançará entre as tempestades do sul[b].
  to: Então Yahweh aparecerá sobre eles, e sua flecha sairá como um relâmpago; o Senhor Yahweh tocará a trombeta[a] e avançará em meio às tempestades do sul[b].
  rationale: A única revisão substitui "entre as tempestades" por "em meio às tempestades", para refletir com mais precisão e naturalidade o valor de בְּ sem alterar a imagem poética nem decidir entre "sul" e o topônimo "Temã". A formulação alternativa da nota foi ajustada para corresponder ao texto revisto.
  reviewer_model: gpt-5.6-terra
