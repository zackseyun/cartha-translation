id: ZEC.9.14
reference: Zechariah 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: pt
  text: Então Yahweh aparecerá sobre eles, e sua flecha sairá como um relâmpago; o Senhor Yahweh tocará a trombeta[a] e avançará em meio às tempestades do sul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz shofar, um chifre de carneiro usado como sinal de batalha e em cerimônias.
    reason: cultural_note
  - marker: b
    text: 'Ou: “em meio às tempestades de Temã”. A palavra hebraica pode ser entendida como o nome do lugar Temã ou como “sul”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: Mantém o sentido espacial natural da preposição com o verbo de aparição e não decide à força se o grupo é o povo de Deus ou seus adversários.
- source_word: יֵרָאֶה
  choice: aparecerá
  rationale: Expressa naturalmente o nifal de ראה no contexto de uma manifestação divina.
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: e sua flecha sairá como um relâmpago
  rationale: Preserva a imagem do disparo e a comparação explícita com o relâmpago, sem transformar a flecha no próprio relâmpago.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos hebraicos, distinguindo o título Senhor do nome próprio Yahweh.
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: tocará a trombeta
  rationale: É uma formulação corrente em português para fazer soar o shofar; a nota preserva a especificidade cultural do instrumento.
- source_word: וְהָלַךְ
  choice: e avançará
  rationale: No cenário guerreiro, comunica o movimento de Yahweh sem ampliar excessivamente o verbo hebraico geral 'ir'.
- source_word: בְּסַעֲרוֹת תֵּימָן
  choice: entre as tempestades do sul
  rationale: סערות designa tempestades ou ventos tempestuosos; תימן pode indicar o sul. A formulação conserva a imagem poética, enquanto a nota registra a leitura do topônimo Temã.
theological_decisions:
- issue: Forma portuguesa dos nomes divinos יְהוָה e אֲדֹנָי יְהוִה
  choice: Yahweh ... o Senhor Yahweh
  alternative: SENHOR ... o Soberano SENHOR
  rationale: A tradução mantém o nome divino como nome próprio e conserva o título אֲדֹנָי na segunda ocorrência, sem produzir a combinação pouco natural 'Senhor SENHOR'.
- issue: Referente de עֲלֵיהֶם
  choice: sobre eles
  alternative: contra eles
  rationale: A expressão espacial preserva a ambiguidade do hebraico quanto ao grupo referido e evita impor no texto uma identificação interpretativa.
- issue: Sentido de תֵּימָן
  choice: sul
  alternative: Temã
  rationale: No paralelismo de tempestade e manifestação divina, o sentido direcional é natural, mas o possível topônimo é mantido em nota.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os marcadores foram colocados junto aos termos a que as notas realmente se referem: “trombeta” e “sul”.'
