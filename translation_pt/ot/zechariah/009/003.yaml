  text: וַ/תִּ֥בֶן צֹ֛ר מָצ֖וֹר לָ֑/הּ וַ/תִּצְבָּר כֶּ֨סֶף֙ כֶּֽ/עָפָ֔ר וְ/חָר֖וּץ כְּ/טִ֥יט חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: pt
  text: Tiro construiu para si uma fortaleza[a] e acumulou prata como pó e ouro[b] como a lama das ruas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortificação”. O hebraico מָצוֹר pode designar um lugar fortificado ou obras defensivas.
    reason: lexical_alternative
  - marker: b
    text: Ou “ouro fino”. Em alguns contextos, o hebraico חָרוּץ pode referir-se especificamente a ouro refinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: Tiro
  rationale: Nome tradicional em português da cidade fenícia.
- source_word: וַתִּבֶן
  choice: construiu
  rationale: O wayyiqtol apresenta uma ação passada; esta é a forma narrativa direta e natural em português.
- source_word: מָצוֹר
  choice: fortaleza
  rationale: No contexto, designa uma estrutura ou defesa fortificada; “fortaleza” comunica claramente a segurança militar da cidade, sem excluir “fortificação” como alternativa.
- source_word: לָהּ
  choice: para si
  rationale: Preserva o sentido reflexivo do sufixo feminino singular referente à cidade personificada.
- source_word: וַתִּצְבָּר
  choice: acumulou
  rationale: Expressa a reunião de grande quantidade de riqueza e soa natural em português, enquanto as comparações seguintes preservam a imagem concreta de abundância.
- source_word: כֶּסֶף
  choice: prata
  rationale: O metal literal é preferível, pois forma par com o ouro.
- source_word: כֶּעָפָר
  choice: como pó
  rationale: Mantém a comparação hebraica que comunica abundância.
- source_word: חָרוּץ
  choice: ouro
  rationale: Neste contexto, refere-se ao metal precioso; o possível sentido mais específico de ouro fino é registrado em nota.
- source_word: כְּטִיט חוּצוֹת
  choice: como a lama das ruas
  rationale: Preserva de modo vívido e compreensível a imagem hebraica de enorme abundância.
theological_decisions: []
