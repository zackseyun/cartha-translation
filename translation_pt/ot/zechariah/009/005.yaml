translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação foi ajustada para deixar explícito que Gaza e Ecrom sofrem angústia, conforme a sequência sintática hebraica. O texto evita resolver a imagem de esperança e vergonha sem registrar a alternativa literal em nota.
