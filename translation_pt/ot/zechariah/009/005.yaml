  text: תֵּרֶ֨א אַשְׁקְל֜וֹן וְ/תִירָ֗א וְ/עַזָּה֙ וְ/תָחִ֣יל מְאֹ֔ד וְ/עֶקְר֖וֹן כִּֽי הֹבִ֣ישׁ מֶבָּטָ֑/הּ וְ/אָ֤בַד מֶ֨לֶךְ֙ מֵֽ/עַזָּ֔ה וְ/אַשְׁקְל֖וֹן לֹ֥א תֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: pt
  text: Ascalom verá isso e temerá; Gaza se contorcerá muito de angústia, e Ecrom também, pois sua esperança será frustrada[a]. Um rei perecerá de Gaza, e Ascalom ficará desabitada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois sua esperança foi envergonhada”.'
    reason: 'Preserva a formulação mais literal: o substantivo hebraico pode designar a expectativa ou objeto de esperança, e o verbo exprime a vergonha/decepção que lhe sobrevém.'
lexical_decisions:
- source_word: תֵּרֶא
  choice: verá isso
  rationale: O qal imperfeito tem Ascalom como sujeito feminino singular. Embora o objeto não esteja expresso, “isso” retoma naturalmente o juízo anunciado no contexto e evita uma construção incompleta em português.
- source_word: וְתִירָא
  choice: e ficará com medo
  rationale: Expressa a reação de temor ao que Ascalom verá, em linguagem corrente e digna.
- source_word: וְתָחִיל מְאֹד
  choice: se contorcerá de angústia
  rationale: O verbo pode indicar tremor, agitação ou dores semelhantes às do parto. A formulação preserva sua força física e emocional; מְאֹד é representado pela intensidade inerente da expressão.
- source_word: מֶבָּטָהּ
  choice: sua esperança
  rationale: O substantivo designa aquilo para o qual se olha com expectativa, isto é, o objeto de esperança de Ecrom.
- source_word: הֹבִישׁ
  choice: será frustrada
  rationale: Neste contexto, o hifil de בוש descreve uma expectativa que acaba em vergonha ou decepção. “Será frustrada” comunica de modo natural o colapso dessa esperança.
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: Um rei desaparecerá de Gaza
  rationale: אָבַד pode significar perecer, perder-se ou deixar de existir. A construção com מִן indica que Gaza deixará de ter rei; “um rei” preserva a ausência do artigo no hebraico.
- source_word: לֹא תֵשֵׁב
  choice: ficará desabitada
  rationale: Com uma cidade como sujeito, ישב pode significar ser habitada. A tradução negativa é idiomática em português.
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: Ascalom / Gaza / Ecrom
  rationale: Usam-se as formas portuguesas tradicionais e amplamente reconhecíveis dos topônimos bíblicos.
