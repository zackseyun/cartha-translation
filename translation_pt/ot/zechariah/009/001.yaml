id: ZEC.9.1
reference: Zechariah 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: pt
  text: 'Oráculo: a palavra de Yahweh é contra a terra de Hadraque[a], e Damasco é o seu lugar de repouso[b]; pois os olhos da humanidade e de todas as tribos de Israel estão voltados para Yahweh[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito da terra de Hadraque”; literalmente, “na terra de Hadraque”. Em títulos proféticos, a preposição pode indicar o alvo do oráculo.'
    reason: alternative_reading
  - marker: b
    text: 'O possessivo hebraico é ambíguo: pode referir-se à palavra ou ao oráculo, ou a Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, “o olho do ser humano e de todas as tribos de Israel está voltado para Yahweh”. Aqui, “ser humano” provavelmente tem sentido coletivo: a humanidade.'
    reason: lexical_alternative
  - marker: d
    text: 'Alguns entendem: “pois Yahweh mantém os olhos sobre a humanidade e sobre todas as tribos de Israel”. A formulação hebraica é condensada e permite mais de uma análise.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: Oráculo
  rationale: Em títulos proféticos, o termo introduz uma declaração solene de origem divina. “Oráculo” é atual e digno, sem recorrer ao sentido literal menos provável de “peso”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e representa diretamente o nome divino יְהוָה.
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: contra a terra de Hadrac
  rationale: Embora בְּ seja literalmente “em”, em um cabeçalho profético de juízo pode indicar o alvo do oráculo. A leitura mais literal ou temática é registrada em nota.
- source_word: מְנֻחָתוֹ
  choice: é o seu lugar de repouso
  rationale: O substantivo significa “lugar de repouso”. O possessivo masculino singular tem antecedente incerto; “seu” mantém em português a ambiguidade entre a palavra/o oráculo e Yahweh.
- source_word: לַיהוָה עֵין אָדָם
  choice: os olhos da humanidade ... estão voltados para Yahweh
  rationale: A construção hebraica é condensada. Esta leitura entende לַיהוָה em sentido direcional e עֵין אָדָם como a atenção humana dirigida a Yahweh. O singular coletivo foi expresso naturalmente em português pelo plural “os olhos”.
- source_word: אָדָם
  choice: humanidade
  rationale: Aqui o substantivo singular tem sentido humano genérico. “Humanidade” comunica esse alcance de modo claro no português contemporâneo sem restringi-lo aos homens.
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: e de todas as tribos de Israel
  rationale: A repetição de “de” deixa claro que tanto a humanidade quanto as tribos de Israel dependem de “os olhos”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Direção do olhar na oração final
  choice: os olhos da humanidade e de todas as tribos de Israel estão voltados para Yahweh
  alternative: Yahweh mantém os olhos sobre a humanidade e sobre todas as tribos de Israel
  rationale: A sintaxe hebraica é comprimida e admite ambas as interpretações. A leitura direcional acompanha de perto a ordem das palavras, enquanto a alternativa é preservada em nota para não eliminar a tensão exegética.
- issue: Referente do sufixo em מְנֻחָתוֹ
  choice: o seu lugar de repouso
  alternative: o lugar de repouso dele; o lugar onde ela repousa
  rationale: O antecedente não é explícito. O possessivo “seu” conserva a possibilidade de referência ao oráculo/à palavra ou a Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Hadrac” e “Damasco” seguem formas portuguesas usuais; a sintaxe foi levemente naturalizada no plural (“os olhos ... estão voltados”) sem ocultar em nota a forma singular do hebraico.
