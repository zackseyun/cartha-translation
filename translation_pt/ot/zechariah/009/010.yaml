base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: pt
  text: Eliminarei de Efraim os carros de guerra e de Jerusalém os cavalos; o arco de guerra será eliminado. Ele anunciará paz às nações, e seu domínio se estenderá de mar a mar e desde o Rio[a] até os confins da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Rio” provavelmente se refere ao Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי / וְנִכְרְתָה
  choice: Eliminarei / será eliminado
  rationale: Preserva a repetição da raiz hebraica כרת e comunica a remoção completa dos meios de guerra sem especificar indevidamente como ela ocorrerá.
- source_word: רֶכֶב
  choice: os carros de guerra
  rationale: O singular hebraico tem sentido coletivo. O plural é mais natural em português, e “de guerra” esclarece a função militar no contexto.
- source_word: וְסוּס
  choice: os cavalos
  rationale: O singular hebraico também tem valor coletivo; o plural natural em português mantém o paralelismo com os carros de guerra.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: o arco de guerra
  rationale: Tradução direta do sintagma construto, preservando a imagem concreta da arma militar.
- source_word: וְדִבֶּר שָׁלוֹם
  choice: Ele anunciará paz
  rationale: O Piel de דבר pode expressar falar ou declarar. “Anunciará paz” soa natural em português e conserva a paz como conteúdo da proclamação, sem ampliá-la em paráfrase.
- source_word: לַגּוֹיִם
  choice: às nações
  rationale: Refere-se amplamente aos povos nacionais, sem impor o sentido técnico posterior de “gentios”.
- source_word: וּמָשְׁלוֹ
  choice: seu domínio se estenderá
  rationale: A forma hebraica é nominal, “seu domínio”. O verbo “se estenderá” torna idiomática em português a indicação dos limites geográficos sem convertê-la simplesmente no verbo “reinar”.
- source_word: מִיָּם עַד יָם
  choice: de mar a mar
  rationale: Mantém literalmente a expressão idiomática de alcance vasto.
- source_word: וּמִנָּהָר עַד אַפְסֵי אָרֶץ
  choice: e desde o Rio até os confins da terra
  rationale: Preserva “o Rio” como designação geográfica tradicional e mantém a amplitude deliberada da fórmula hebraica.
theological_decisions:
- issue: Referente da terceira pessoa em “Ele anunciará” e “seu domínio”
  choice: O pronome se refere ao rei vindouro apresentado no versículo anterior.
  alternative: Formulação impessoal, como “a paz será anunciada” ou “o domínio se estenderá”.
  rationale: A passagem muda da primeira pessoa divina (“Eliminarei”) para a terceira pessoa singular, que naturalmente retoma o rei de Zacarias 9:9. A tradução mantém essa relação sem acrescentar identificação doutrinária além do texto.
- issue: Alcance do domínio do rei
  choice: Manter as fórmulas geográficas em sua amplitude universal.
  alternative: Interpretá-las explicitamente como hipérbole referente apenas a um reino regional.
  rationale: “De mar a mar” e “até os confins da terra” apresentam intencionalmente um domínio vasto. A tradução conserva essa tensão sem definir a maneira de seu cumprimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os singulares coletivos referentes a carros e cavalos foram vertidos no plural natural do português. A ordem paralela “de Efraim... de Jerusalém...” foi preservada. Não se reproduziu a nota inglesa marcada após “Jerusalém”, pois seu conteúdo não corresponde a nenhuma variante ou ambiguidade real nesse ponto do texto hebraico.
