base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: pt
  text: Naquele dia, Yahweh, o Deus deles, os salvará como um rebanho — o seu povo; pois eles resplandecerão[a] como pedras de uma coroa[b] sobre a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão erguidos” ou “serão exibidos em destaque”. O verbo hebraico pode indicar algo levantado ou mostrado de maneira proeminente, e não apenas algo que brilha.'
    reason: lexical_alternative
  - marker: b
    text: “Pedras de uma coroa” também pode ser traduzido por “joias de uma coroa” ou, com menor probabilidade, “pedras consagradas”, pois o termo hebraico para “coroa” também pode ter associações com consagração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: os salvará
  rationale: O hifil de ישׁע expressa salvar ou livrar; “salvará” mantém tanto a ideia de resgate quanto a de vitória sem especificar além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Reproduz de modo natural a construção com sufixo possessivo e preserva a relação pactual.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal corrente e natural em português profético.
- source_word: כְּצֹאן עַמּוֹ
  choice: como o rebanho que é o seu povo
  rationale: Conserva a imagem coletiva do rebanho e torna compreensível em português a leitura mais provável, na qual o povo de Yahweh é comparado ao rebanho, sem transformar a metáfora em simples prosa.
- source_word: כִּי
  choice: pois
  rationale: Mantém a ligação explicativa com a afirmação anterior.
- source_word: אַבְנֵי נֵזֶר
  choice: pedras de uma coroa
  rationale: Preserva literalmente a imagem poética. “Joias de uma coroa” seria mais idiomático, mas também mais interpretativo; נֵזֶר pode ainda evocar consagração.
- source_word: מִתְנוֹסְסוֹת
  choice: resplandecerão
  rationale: No contexto das pedras de uma coroa, comunica sua visibilidade e esplendor. A forma também pode sugerir que são erguidas ou exibidas em destaque, possibilidade registrada em nota.
- source_word: עַל אַדְמָתוֹ
  choice: sobre a terra dele
  rationale: אֲדָמָה designa solo ou terra; “terra” é natural no contexto de restauração. A formulação conserva o pronome masculino sem explicitar indevidamente seu referente.
theological_decisions:
- issue: Relação entre as imagens do rebanho e das pedras da coroa
  choice: O povo salvo é apresentado primeiro como o rebanho de Yahweh e depois como pedras de uma coroa que resplandecem sobre a terra dele.
  alternative: A expressão do rebanho pode descrever a maneira como Yahweh os salva, e as pedras podem ser entendidas como pedras memoriais ou consagradas.
  rationale: A leitura escolhida acompanha a progressão poética mais provável e mantém as duas metáforas, sem convertê-las em uma única imagem literal.
- issue: Referente do sufixo em עַל אַדְמָתוֹ
  choice: “a terra dele”, sem substituir o pronome por um nome explícito
  alternative: “a terra de Yahweh” ou “a terra do seu povo”
  rationale: O referente mais natural no contexto imediato é Yahweh, mas a tradução pronominal preserva a forma e evita eliminar por explicitação uma possível ressonância da terra vinculada ao povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe de boa legibilidade brasileira. A colocação “o rebanho que é o seu povo” evita que “rebanho do seu povo” seja entendido em português como um rebanho pertencente ao povo. As notas preservam as ambiguidades lexicais relevantes do hebraico.
