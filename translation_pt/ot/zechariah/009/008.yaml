base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: pt
  text: E acamparei junto à minha casa como guarda[a], contra quem passa e quem volta[b]; e nenhum opressor[c] voltará a passar sobre eles, pois agora vi com os meus próprios olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como guarnição”. O termo hebraico designa um posto ou uma força estacionada para defesa.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de quem passa e de quem volta”, expressão que pode indicar movimentação hostil em ambas as direções.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “cobrador” ou “feitor”. O termo pode designar alguém que oprime, exige tributo ou impõe trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: E acamparei
  rationale: Preserva o sentido militar e protetor do verbo חנה, além da primeira pessoa singular e da conjunção.
- source_word: לְבֵיתִי
  choice: junto à minha casa
  rationale: Expressa naturalmente a localização do acampamento protetor sem ampliar interpretativamente para 'ao redor' nem restringir o referente ao templo.
- source_word: מִצָּבָה
  choice: como guarda
  rationale: Comunica de modo claro a imagem de um posto ou força estacionada; 'guarnição' permanece como alternativa lexical.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: contra quem passa e quem volta
  rationale: Mantém os dois particípios e a ideia de movimento em ambas as direções, sem identificar de modo excessivo os transeuntes como exércitos.
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד
  choice: e nenhum opressor voltará a passar sobre eles
  rationale: Preserva a repetição de עבר e a imagem de invasão ou domínio, usando 'voltará a' para o valor de עוֹד.
- source_word: נֹגֵשׂ
  choice: opressor
  rationale: É amplo e inteligível, abrangendo quem oprime, exige tributo ou impõe trabalho; evita a estreiteza de 'feitor'.
- source_word: כִּי עַתָּה
  choice: pois agora
  rationale: Apresenta naturalmente a razão da promessa e o caráter decisivo do momento presente.
- source_word: רָאִיתִי בְעֵינָי
  choice: vi com os meus próprios olhos
  rationale: Reproduz em português corrente a ênfase da observação pessoal direta.
theological_decisions:
- issue: Referente de 'minha casa'
  choice: Manter literalmente 'minha casa', permitindo que abranja a casa e o povo de YHWH sob sua proteção.
  alternative: Entender especificamente o templo, ou mais amplamente a terra e o povo de Deus.
  rationale: O contexto e o pronome plural 'eles' sugerem um alcance além do edifício, mas o texto não exige que a tradução resolva essa amplitude.
- issue: Identidade dos que passam e voltam
  choice: Não qualificá-los explicitamente como exércitos ou inimigos no texto principal.
  alternative: Interpretar a expressão como movimentação militar hostil em ambas as direções.
  rationale: O contexto favorece movimento hostil, mas os particípios hebraicos em si dizem apenas 'quem passa' e 'quem volta'; a ambiguidade é preservada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém a imagem militar do hebraico, a repetição do verbo 'passar' e as ambiguidades relativas à 'casa' e ao movimento de ida e volta.
