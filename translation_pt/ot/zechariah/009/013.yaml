  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: pt
  text: Pois curvei Judá como o meu arco e o enchi com Efraim. Despertarei os seus filhos, ó Sião, contra os seus filhos, ó Grécia[a], e farei de você como a espada de um guerreiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Javã», nome tradicional associado aos povos e ao mundo grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da promessa anterior e mantém de modo natural a ligação discursiva.
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: curvei Judá como o meu arco
  rationale: דָרַךְ com קֶשֶׁת é a expressão usada para armar ou curvar um arco. O possessivo «meu» comunica naturalmente o valor de לִי.
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: o enchi com Efraim
  rationale: O pronome retoma o arco da metáfora. Efraim é aquilo com que o arco é preenchido ou provido, provavelmente evocando a flecha ou as flechas, sem que a tradução explicite além do hebraico.
- source_word: וְעוֹרַרְתִּי
  choice: Despertarei
  rationale: O verbo expressa mobilizar ou incitar para a ação. O futuro transmite a ação divina iminente na sequência profética.
- source_word: בָנַיִךְ צִיּוֹן
  choice: os seus filhos, ó Sião
  rationale: O sufixo feminino singular dirige-se a Sião personificada como mulher e mãe. «Filhos» preserva a imagem masculina e militar do texto.
- source_word: עַל בָּנַיִךְ יָוָן
  choice: contra os seus filhos, ó Grécia
  rationale: יָוָן designa Javã/Jônia e, por extensão, o mundo grego. «Grécia» comunica claramente o referente histórico, enquanto a nota preserva o nome hebraico tradicional.
- source_word: וְשַׂמְתִּיךְ כְּחֶרֶב גִּבּוֹר
  choice: e farei de você uma espada de guerreiro
  rationale: A formulação portuguesa é natural e conserva a transformação metafórica e a força militar de גִּבּוֹר, embora expresse idiomaticamente a comparação introduzida por כְּ.
theological_decisions:
- issue: Referente e tradução de יָוָן
  choice: Grécia
  alternative: Javã
  rationale: O termo aponta para os povos ou o mundo grego. A tradução principal torna o referente transparente ao leitor moderno; a nota registra a forma tradicional do nome hebraico.
- issue: Valor temporal dos perfeitos hebraicos no discurso profético
  choice: Passado para a preparação já apresentada como realizada («curvei», «enchi») e futuro para a mobilização subsequente («despertarei», «farei»)
  alternative: Traduzir todos os verbos no futuro ou todos como perfeitos proféticos no passado
  rationale: A combinação preserva o movimento retórico entre a preparação divina retratada como concluída e a ação iminente, sem eliminar a tensão temporal do hebraico.
- issue: Identidade da figura transformada em espada
  choice: Manter a segunda pessoa dirigida a Sião («você»)
  alternative: Explicitar «Sião» novamente ou entender a referência coletivamente como os filhos de Sião
  rationale: O sufixo hebraico é feminino singular e retoma diretamente Sião personificada; a tradução conserva essa referência sem impor uma identificação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocativos explícitos para distinguir as duas figuras personificadas. A metáfora militar foi preservada sem explicar no corpo do versículo se Efraim representa uma flecha, pois o hebraico deixa esse detalhe implícito.
