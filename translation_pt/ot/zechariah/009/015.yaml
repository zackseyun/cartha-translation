revisions:
- from: O SENHOR dos Exércitos os protegerá; eles devorarão e subjugarão as pedras de funda. Beberão e farão tumulto como sob o efeito do vinho; ficarão cheios como a bacia de aspersão, como os cantos do altar.
  to: O SENHOR dos Exércitos os protegerá; eles devorarão e pisarão as pedras de funda. Beberão e farão alarde como sob o efeito do vinho; ficarão cheios como a bacia de aspersão, como os cantos do altar.
  rationale: A revisão limita-se a tornar inteligível e natural a ação dirigida às pedras de funda, conservando a linguagem bélica e a ambiguidade da imagem hebraica, e a empregar uma formulação mais idiomática para o clamor associado ao vinho. As imagens cultuais permanecem não explicitadas, como no texto-fonte.
