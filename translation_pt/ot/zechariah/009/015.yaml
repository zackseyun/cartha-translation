source:
  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: pt
  text: O SENHOR dos Exércitos os protegerá; eles devorarão e pisarão as pedras de funda. Beberão e farão alarde como sob o efeito do vinho; ficarão cheios como a bacia de aspersão, como os cantos do altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: O SENHOR dos Exércitos
  rationale: Traduz o nome divino segundo a convenção portuguesa amplamente reconhecida e preserva o título militar צְבָאוֹת.
- source_word: יָגֵן עֲלֵיהֶם
  choice: os protegerá
  rationale: Expressa de modo natural a imagem verbal de cobrir ou defender como um escudo.
- source_word: וְאָכְלוּ
  choice: eles devorarão
  rationale: Mantém a linguagem vigorosa e metafórica do verbo 'comer/devorar'.
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: e subjugarão as pedras de funda
  rationale: כָּבַשׁ significa dominar ou subjugar; a formulação conserva a imagem difícil do hebraico sem transformá-la em 'pisar', leitura apoiada por algumas versões, mas não pelo sentido lexical mais direto.
- source_word: וְשָׁתוּ הָמוּ כְּמוֹ יָיִן
  choice: Beberão e farão tumulto como sob o efeito do vinho
  rationale: המה indica ruído, agitação ou tumulto. A expansão mínima 'sob o efeito' torna clara a comparação sem afirmar que o objeto bebido seja vinho.
- source_word: כַּמִּזְרָק
  choice: como a bacia de aspersão
  rationale: מִזְרָק é uma bacia ritual usada no culto, especialmente para receber ou aspergir sangue; a especificação evita a ideia de uma tigela comum.
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: como os cantos do altar
  rationale: Reproduz a imagem cultual do texto; os cantos ficavam cobertos pelo sangue sacrificial, embora isso permaneça implícito no verso.
theological_decisions:
- issue: Referência divina do tetragrama
  choice: SENHOR em versaletes
  alternative: Javé
  rationale: Segue a convenção bíblica portuguesa mais difundida sem apagar a distinção gráfica do nome divino.
- issue: Imagem de vitória em 'pedras de funda'
  choice: Preservar o objeto literal e a ambiguidade da ação
  alternative: Interpretar como pisar ou destruir os fundeiros/inimigos
  rationale: A expressão é incomum e admite diferentes explicações; a tradução não identifica dogmaticamente as pedras com pessoas nem introduz um referente ausente.
- issue: Embriaguez e linguagem cultual
  choice: Manter as comparações com vinho, bacia e altar
  alternative: Explicitar sangue sacrificial ou êxtase de guerra
  rationale: O contexto sugere essas associações, mas o hebraico do versículo não as formula diretamente.
translation_notes:
  register: Português moderno, solene e acessível, com estrutura paralela próxima do hebraico. Evitou-se 'rugirão', pois הָמוּ descreve mais amplamente agitação ruidosa; 'farão tumulto' preserva essa amplitude. A pontuação divide as duas séries verbais para melhorar a leitura sem alterar sua sequência.
