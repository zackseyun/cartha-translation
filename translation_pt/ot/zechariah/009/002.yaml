  text: וְ/גַם חֲמָ֖ת תִּגְבָּל בָּ֑/הּ צֹ֣ר וְ/צִיד֔וֹן כִּ֥י חָֽכְמָ֖ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/002.yaml
  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: pt
  text: e também Hamate, que faz fronteira com ela; Tiro e Sidom, porque são muito sábias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também Hamate, que faz fronteira com ela; Tiro e Sidom, pois ela é muito sábia”. O hebraico passa de modo abrupto entre o singular e os nomes coordenados das cidades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: e também
  rationale: Preserva tanto a ligação com a sequência anterior quanto a força aditiva de גַּם.
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: תִּגְבָּל בָּהּ
  choice: que faz fronteira com ela
  rationale: Expressa naturalmente em português a ideia de delimitar ou ser contígua ao referente feminino do contexto anterior, sem definir além do texto qual é esse referente.
- source_word: צֹר וְ/צִידוֹן
  choice: Tiro e Sidom
  rationale: Formas consagradas dos topônimos em português, mantendo a coordenação hebraica.
- source_word: כִּי
  choice: porque
  rationale: Conserva a provável força causal ou explicativa da conjunção.
- source_word: חָכְמָה מְאֹד
  choice: são muito sábias
  rationale: O hebraico traz formalmente uma forma feminina singular, mas Tiro e Sidom aparecem coordenadas; o plural feminino em português comunica que as duas cidades estão em vista, enquanto a nota preserva a dificuldade gramatical.
theological_decisions:
- issue: Força sintática da oração sobre Tiro e Sidom
  choice: 'Manter a relação causal: “porque são muito sábias”'
  alternative: 'Entender a frase como observação parentética: “pois são muito sábias”'
  rationale: A tradução conserva a força explicativa ou causal de כִּי sem acrescentar uma explicação sobre como a sabedoria das cidades se relaciona com o oráculo.
- issue: Discordância de número entre חָכְמָה e os nomes coordenados
  choice: Empregar o plural feminino “são muito sábias”
  alternative: 'Traduzir no singular: “pois ela é muito sábia” ou “pois Sidom é muito sábia”'
  rationale: O plural é mais claro e natural em português para as duas cidades coordenadas, mas a nota registra o singular formal e a ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com topônimos bíblicos tradicionais. O pronome “ela” preserva o referente feminino implícito do contexto anterior, e a nota mantém a oscilação de número presente no hebraico.
