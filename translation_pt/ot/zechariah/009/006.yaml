  text: וְ/יָשַׁ֥ב מַמְזֵ֖ר בְּ/אַשְׁדּ֑וֹד וְ/הִכְרַתִּ֖י גְּא֥וֹן פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
translation:
  language: pt
  text: Um povo de origem mista habitará em Asdode[a], e eu acabarei com o orgulho dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa de nascimento ilegítimo habitará em Asdode”. O sentido do termo hebraico מַמְזֵר é incerto; ele pode designar alguém de origem mista ou de condição social excluída. Aqui foi entendido coletivamente, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: habitará
  rationale: O verbo significa sentar-se, habitar ou residir. Neste contexto de mudança populacional numa cidade, “habitará” expressa naturalmente a residência em Asdode.
- source_word: מַמְזֵר
  choice: um povo de origem mista
  rationale: O substantivo é difícil e está no singular, mas pode designar coletivamente uma população de condição mista ou excluída. A formulação evita o sentido moderno demasiadamente estreito de “filho ilegítimo”, sem ocultar essa alternativa lexical.
- source_word: בְּאַשְׁדּוֹד
  choice: em Asdode
  rationale: A preposição בְּ indica localização, e “em Asdode” é a forma idiomática para residência dentro da cidade.
- source_word: הִכְרַתִּי
  choice: acabarei com
  rationale: O hifil de כרת significa cortar, eliminar ou remover. “Acabarei com” comunica de modo corrente e vigoroso a eliminação anunciada, sem exigir ao leitor o reconhecimento do idiomatismo “cortar”.
- source_word: גְּאוֹן
  choice: o orgulho
  rationale: O termo pode indicar exaltação, majestade ou orgulho. Num oráculo de juízo contra a Filístia, “orgulho” exprime adequadamente a autossuficiência e o poder arrogante.
- source_word: פְּלִשְׁתִּים
  choice: dos filisteus
  rationale: A forma hebraica nomeia o povo, e não diretamente a terra da Filístia.
theological_decisions:
- issue: Referente e nuance de מַמְזֵר no oráculo de juízo
  choice: Entendido coletivamente como “um povo de origem mista” que habitará em Asdode
  alternative: “uma pessoa de nascimento ilegítimo” ou “um estrangeiro”
  rationale: O contexto anuncia a humilhação e a alteração da identidade filisteia. Embora o termo singular possa referir-se a uma pessoa de nascimento ilegítimo, a leitura coletiva se ajusta melhor à mudança populacional da cidade. A nota preserva a incerteza lexical e evita transformar uma interpretação contextual em certeza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Asdode” e “filisteus” seguem as formas bíblicas correntes. A expressão explicativa “de origem mista” mantém clareza sem recorrer a linguagem pejorativa.
