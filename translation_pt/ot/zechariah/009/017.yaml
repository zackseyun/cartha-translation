  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: pt
  text: Pois como é grande a sua bondade[a], e como é grande a sua beleza! O cereal fará florescer os jovens, e o vinho novo, as jovens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como ele é bom e como é belo!» O hebraico emprega os substantivos «sua bondade» e «sua beleza». O pronome provavelmente se refere ao SENHOR no contexto, embora também possa apontar para Israel restaurado, para sua terra ou condição restaurada, ou para o rei.'
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: 'Ou: «as virgens». O termo hebraico pode designar mais especificamente jovens solteiras e virgens, embora aqui provavelmente seja a contraparte feminina de «os jovens».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior e introduz naturalmente a exclamação.
- source_word: מַה טּוּבוֹ
  choice: como é grande a sua bondade
  rationale: Preserva tanto a construção exclamativa quanto o substantivo טוּב com o sufixo masculino singular, sem reduzir a expressão a um simples adjetivo.
- source_word: וּמַה יָפְיוֹ
  choice: e como é grande a sua beleza
  rationale: Conserva o paralelismo com a oração anterior e traduz יֹפִי como substantivo.
- source_word: דָּגָן
  choice: o cereal
  rationale: Designa de modo amplo os grãos destinados à alimentação, sem a ambiguidade regional de «milho».
- source_word: בַּחוּרִים
  choice: os jovens
  rationale: No paralelismo, refere-se aos homens jovens; em português, «os jovens» expressa naturalmente o grupo masculino em contraste com «as jovens».
- source_word: יְנוֹבֵב
  choice: fará ... florescer
  rationale: Expressa o sentido causativo do verbo raro e mantém a imagem de vigor, crescimento e prosperidade.
- source_word: וְתִירוֹשׁ
  choice: e o vinho novo
  rationale: תִּירוֹשׁ indica o produto recente da vindima, frequentemente traduzido como vinho novo.
- source_word: בְּתֻלוֹת
  choice: as jovens
  rationale: Funciona poeticamente como contraparte feminina de בַּחוּרִים; a acepção mais específica «virgens» é registrada em nota.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em «sua bondade» e «sua beleza»
  choice: Manter os pronomes sem explicitar o referente no corpo do texto; no contexto, provavelmente se referem ao SENHOR.
  alternative: Podem referir-se à condição restaurada de Israel ou da terra, ou ainda ao rei mencionado anteriormente.
  rationale: O hebraico não nomeia o antecedente. A tradução preserva essa ambiguidade legítima, e a nota apresenta as principais leituras sem impor uma solução dogmática.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. «Cereal» evita entender דגן como milho especificamente. A elipse verbal no segundo membro («e o vinho novo, as jovens») reproduz com clareza a concisão da poesia hebraica.
