id: ZEC.9.11
reference: Zechariah 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: pt
  text: Quanto a você também, por causa do sangue da sua aliança[a], libertei os seus prisioneiros da cova[b] em que não há água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo sangue da sua aliança”. A preposição hebraica pode indicar tanto a causa quanto o meio.
    reason: lexical_alternative
  - marker: b
    text: “Cova” também pode ser traduzido por “cisterna” ou “calabouço”; trata-se de um lugar de confinamento sem água.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: Quanto a você também
  rationale: Preserva tanto o pronome enfático dirigido à Sião/Jerusalém personificada quanto a força aditiva de גַּם, ligando a declaração às promessas anteriores.
- source_word: בְּדַם בְּרִיתֵךְ
  choice: por causa do sangue da sua aliança
  rationale: Expressa a leitura causal da preposição בְּ e conserva sem especificação adicional a linguagem de ratificação da aliança. A leitura instrumental igualmente possível é indicada em nota.
- source_word: שִׁלַּחְתִּי
  choice: libertei
  rationale: No contexto de prisioneiros retirados de uma cova, comunica naturalmente o sentido de soltar ou deixar sair, embora o verbo tenha como ideia básica enviar ou despedir.
- source_word: אֲסִירַיִךְ
  choice: os seus prisioneiros
  rationale: Traduz diretamente os que estão presos ou acorrentados e se ajusta à imagem de confinamento na cova.
- source_word: מִבּוֹר
  choice: da cova
  rationale: Mantém a imagem ampla de בּוֹר, que pode designar cova, cisterna ou lugar de detenção subterrâneo; a oração seguinte esclarece que não contém água.
- source_word: אֵין מַיִם בּוֹ
  choice: em que não há água
  rationale: Reproduz com clareza a construção existencial hebraica e descreve diretamente a cova.
theological_decisions:
- issue: Identidade da aliança evocada pela expressão “sangue da sua aliança”
  choice: Manter a linguagem da aliança sem identificar no texto uma aliança específica
  alternative: Entender como alusão à aliança do Sinai ou como antecipação tipológica da nova aliança
  rationale: A expressão evoca claramente a ratificação de uma aliança por sangue, mas o versículo não especifica qual acontecimento da aliança está em vista; a tradução preserva essa tensão teológica.
- issue: Valor da preposição בְּ antes de “sangue”
  choice: 'Leitura causal: “por causa do sangue”'
  alternative: 'Leitura instrumental: “pelo sangue”'
  rationale: Ambas são gramaticalmente possíveis. A leitura causal apresenta o sangue da aliança como fundamento da libertação, enquanto a alternativa instrumental é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a referência feminina contextual a Sião/Jerusalém sem acrescentar uma identificação ausente neste versículo. “Libertei” privilegia a naturalidade em português no contexto prisional, e as notas preservam as ambiguidades lexicais relevantes.
