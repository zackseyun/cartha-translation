  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: pt
  text: a família da casa de Levi à parte, e suas esposas à parte; a família dos simeítas à parte, e suas esposas à parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: a família de
  rationale: A forma construta introduz cada grupo de parentesco. “Família” é natural em português e suficientemente ampla para abranger uma linhagem ou clã.
- source_word: בֵּית לֵוִי
  choice: da casa de Levi
  rationale: Preserva a expressão genealógica hebraica e sua referência à linhagem de Levi, sem reduzi-la apenas ao nome tribal.
- source_word: לְבָד
  choice: à parte
  rationale: Expressa a separação no lamento e permite conservar com naturalidade a repetição enfática do hebraico.
- source_word: וּנְשֵׁיהֶם
  choice: e suas esposas
  rationale: Neste contexto familiar, o substantivo com sufixo masculino plural designa mais provavelmente as esposas; a escolha mantém explícita a separação entre os grupos masculinos e suas esposas.
- source_word: הַשִּׁמְעִי
  choice: dos simeítas
  rationale: A forma com artigo funciona como designação gentílica ou coletiva do grupo ligado a Simei; “simeítas” comunica de modo conciso a ideia de clã descendente.
theological_decisions:
- issue: Separação entre homens e mulheres no lamento
  choice: Manter a distinção explícita entre cada grupo familiar e “suas esposas”.
  alternative: Generalizar como “cada família separadamente, homens e mulheres à parte”.
  rationale: O hebraico repete a distinção entre o grupo familiar nomeado e suas mulheres/esposas. A tradução conserva essa estrutura sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com cadência repetitiva preservada. “À parte” reproduz o refrão do original sem soar excessivamente literal; “simeítas” segue a forma portuguesa do nome Simei.
