base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: pt
  text: 'Então os clãs de Judá dirão em seus corações[a]: “Os habitantes de Jerusalém são a minha força em Yahweh dos Exércitos[b], o Deus deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os líderes de Judá” ou “os chefes de Judá”. O termo hebraico אַלֻּפֵי pode designar tanto os clãs como seus chefes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Os habitantes de Jerusalém são força para mim por meio de Yahweh dos Exércitos, o Deus deles”. A preposição hebraica pode indicar esfera (“em”) ou meio/fundamento (“por meio de”, “graças a”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Então ... dirão
  rationale: O וְ seguido da forma verbal, no encadeamento profético, pode ser traduzido por “e”; “então” torna clara a sequência do oráculo sem ampliá-lo indevidamente.
- source_word: אַלֻּפֵי יְהוּדָה
  choice: os clãs de Judá
  rationale: אַלּוּף pode designar tanto uma unidade clânica quanto seu chefe. Neste contexto corporativo, “clãs” expressa melhor os grupos representativos de Judá, mantendo a alternativa em nota.
- source_word: בְּלִבָּם
  choice: em seu coração
  rationale: Expressão hebraica de fala ou convicção interior. O singular distributivo em português combina com a declaração subsequente na primeira pessoa do singular.
- source_word: אַמְצָה לִי
  choice: são a minha força
  rationale: A construção condensada expressa força ou apoio forte para cada clã. “Minha força” é natural em português e preserva a primeira pessoa singular distributiva de לִי.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Tradução corrente e precisa do particípio que identifica os que residem na cidade.
- source_word: בַּיהוָה צְבָאוֹת
  choice: em Yahweh dos Exércitos
  rationale: A preposição ב pode indicar esfera, fundamento ou meio. “Em” preserva essa abertura sem decidir de modo excessivo; “Yahweh” representa o nome divino, e “dos Exércitos” comunica a força marcial de צְבָאוֹת.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Mantém explicitamente o pronome plural de terceira pessoa e sua referência aos habitantes de Jerusalém.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio da designação pactual sem substituí-lo por um título.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Exércitos de Israel; dos exércitos; das Hostes
  rationale: “Exércitos” mantém a imagem marcial e a amplitude potencial do termo, sem restringir se são hostes celestiais, forças terrenas ou ambas.
- issue: Relação expressa pela preposição ב em בַּיהוָה
  choice: em Yahweh
  alternative: por meio de Yahweh; graças a Yahweh
  rationale: A preposição admite esfera e também meio ou fundamento. A tradução principal conserva a formulação aberta, enquanto a nota registra a outra compreensão plausível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a fala interior, o singular distributivo (“meu”) e a ambiguidade lexical e preposicional do hebraico por meio de notas.
