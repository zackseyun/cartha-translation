  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: pt
  text: E derramarei sobre a casa de Davi e sobre os habitantes de Jerusalém um espírito de graça e de súplicas[a]. Eles olharão para mim, aquele a quem traspassaram, e prantearão por ele[b] como se pranteia por um filho único; chorarão amargamente por ele como se chora amargamente por um primogênito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito de graça e de pedidos de misericórdia”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico muda de “mim” para “ele” nesta oração; a tradução conserva essa tensão em vez de uniformizar os pronomes.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁפַכְתִּי
  choice: derramarei
  rationale: Preserva a metáfora de uma concessão divina abundante e é natural com “espírito” em português.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: O particípio singular funciona coletivamente; o plural expressa isso com naturalidade em português.
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: um espírito de graça e de súplicas por misericórdia
  rationale: Mantém “espírito” sem maiúscula para não definir além do hebraico se o referente é especificamente o Espírito Santo. “Súplicas por misericórdia” comunica o caráter insistente e compassivo de תַחֲנוּנִים.
- source_word: וְהִבִּיטוּ אֵלַי
  choice: Eles olharão para mim
  rationale: A preposição אֶל indica atenção dirigida para o falante; a formulação também preserva a referência explícita à primeira pessoa.
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: aquele a quem traspassaram
  rationale: Explicita de modo natural o referente pessoal da oração relativa. “Traspassaram” preserva o sentido de perfurar com uma arma e o peso solene da passagem.
- source_word: וְסָפְדוּ עָלָיו
  choice: prantearão por ele
  rationale: ספד denota luto ou lamentação, frequentemente pelos mortos; “prantear” é conciso, digno e apropriado ao contexto.
- source_word: הַיָּחִיד
  choice: um filho único
  rationale: No contexto de luto, o masculino singular sugere um filho único, sem eliminar o valor básico de “único”.
- source_word: וְהָמֵר עָלָיו
  choice: chorarão amargamente por ele
  rationale: Expressa a dor intensa do verbo e mantém o paralelismo com a comparação seguinte.
- source_word: הַבְּכוֹר
  choice: um primogênito
  rationale: Mantém a designação cultural e familiar específica do hebraico sem acrescentar “filho”, já implícito no contexto.
theological_decisions:
- issue: Mudança pronominal de “mim” para “ele”
  choice: Preservar “olharão para mim ... prantearão por ele”
  alternative: Harmonizar como “olharão para mim ... prantearão por mim” ou eliminar a mudança por emenda
  rationale: O Texto Massorético contém uma mudança marcante da primeira para a terceira pessoa. A tradução mantém essa tensão textual e teológica sem resolvê-la por harmonização.
- issue: Identificação de רוּחַ com o Espírito Santo
  choice: “um espírito”, com inicial minúscula
  alternative: “o Espírito de graça e de súplicas”
  rationale: A expressão pode envolver ação espiritual divina, mas sua forma hebraica não exige que a tradução identifique explicitamente o referente como o Espírito Santo.
- issue: Leitura cristológica posterior
  choice: Traduzir diretamente o hebraico sem acrescentar identificação messiânica explícita
  alternative: Inserir linguagem que destaque uma identificação cristológica específica
  rationale: A redação permanece compatível com a recepção cristológica do versículo, mas não importa para o texto informações que o hebraico não explicita.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Prantear” conserva a dignidade do lamento fúnebre sem tornar o restante do verso arcaico. A pontuação divide o longo período hebraico para facilitar a leitura, sem alterar suas relações sintáticas.
