base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: pt
  text: Naquele dia, farei de Jerusalém uma pedra pesada para todos os povos. Todos os que a levantarem ficarão gravemente feridos[a], e todas as nações da terra[b] se reunirão contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “serão certamente cortados” ou “ficarão profundamente lacerados”; a construção hebraica intensifica o ferimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas as nações do país”, caso “terra” seja entendida em sentido mais local.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural em português o marcador temporal da sequência profética; a ligação discursiva pode ficar implícita sem perda relevante.
- source_word: אָשִׂים אֶת יְרוּשָׁלִַם אֶבֶן מַעֲמָסָה
  choice: farei de Jerusalém uma pedra pesada
  rationale: A construção apresenta Jerusalém como uma pedra difícil e perigosa de erguer. “Pedra pesada” conserva a imagem concreta em linguagem clara.
- source_word: לְכָל הָעַמִּים
  choice: para todos os povos
  rationale: “Povos” traduz עַמִּים e preserva sua distinção lexical em relação a גּוֹיִם, traduzido depois por “nações”.
- source_word: כָּל עֹמְסֶיהָ
  choice: Todos os que tentarem levantá-la
  rationale: O particípio de עמס descreve os que carregam ou erguem a pedra. “Tentarem levantá-la” torna clara a ação evocada pela metáfora sem eliminar seu caráter figurado.
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: ficarão gravemente feridos
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação. O verbo indica corte ou laceração; a formulação comunica em português corrente a gravidade do ferimento, e a nota preserva o sentido mais literal.
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: se reunirão contra ela
  rationale: No contexto profético e hostil, עַל indica reunião dirigida contra Jerusalém.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: todas as nações da terra
  rationale: No contexto internacional da passagem, “terra” no sentido amplo é a leitura mais provável, embora o sentido local “país” seja lexicalmente possível e seja registrado em nota.
theological_decisions:
- issue: Alcance da coalizão hostil contra Jerusalém
  choice: todas as nações da terra
  alternative: todas as nações do país/da região
  rationale: הָאָרֶץ pode designar a terra inteira ou um território específico. O cenário internacional favorece o alcance amplo, mas a alternativa local permanece assinalada sem harmonização doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a imagem concreta da pedra e distingue “povos” de “nações”. Os marcadores de todas as notas aparecem no texto principal.
