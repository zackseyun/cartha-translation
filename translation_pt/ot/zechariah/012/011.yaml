id: ZEC.12.11
reference: Zechariah 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: pt
  text: Naquele dia, o pranto em Jerusalém se tornará grande, como o pranto de Hadade-Rimom[a] na planície de Megido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hadade-Rimom pode ser o nome de um lugar próximo de Megido, talvez associado ao pranto por Josias (cf. 2Cr 35.22–25), ou pode aludir a outra conhecida tradição de lamentação.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética natural em português, preservando sua força dêitica.
- source_word: יִגְדַּל
  choice: se tornará grande
  rationale: Preserva o sentido verbal de crescer ou tornar-se grande, indicando o aumento da magnitude do pranto.
- source_word: הַמִּסְפֵּד
  choice: o pranto
  rationale: Expressa de modo natural e digno o lamento público associado à morte, sem restringi-lo apenas ao choro audível.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta.
- source_word: כְּמִסְפַּד
  choice: como o pranto de
  rationale: Mantém a comparação introduzida por כ e a relação construta do hebraico, sem decidir se o nome designa lugar, pessoa, divindade ou tradição.
- source_word: הֲדַד רִמּוֹן
  choice: Hadade-Rimom
  rationale: Transliteração portuguesa do nome próprio composto; evita inserir no texto uma identificação histórica ou cultual incerta.
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: na planície de Megido
  rationale: בִּקְעָה designa uma depressão ampla ou planície; esta opção comunica melhor a topografia do que um vale estreito.
theological_decisions:
- issue: Identificação de Hadade-Rimom
  choice: Manter Hadade-Rimom como nome não explicado no texto principal.
  alternative: Entender a expressão como referência ao luto pelo rei Josias em Megido, ou como alusão a uma lamentação cultual ligada a Hadade-Rimom.
  rationale: O hebraico apenas menciona o nome e não identifica explicitamente o acontecimento. A tradução conserva essa ambiguidade, enquanto a nota apresenta as principais possibilidades sem impor uma delas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo e a ambiguidade do nome próprio. O marcador foi colocado junto a “Hadade-Rimom”, termo ao qual a nota se refere diretamente.
