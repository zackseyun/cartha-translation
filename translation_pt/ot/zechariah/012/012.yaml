id: ZEC.12.12
reference: Zechariah 12:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: pt
  text: 'E a terra lamentará, família por família, cada uma à parte: a família da casa de Davi à parte, e suas mulheres à parte; a família da casa de Natã à parte, e suas mulheres à parte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas esposas”, nas duas ocorrências.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדָה
  choice: E ... lamentará
  rationale: O verbo ספד expressa luto ou lamentação, frequentemente de caráter fúnebre ou comunitário. “Lamentará” é natural, digno e adequado ao lamento nacional do contexto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. Aqui, as famílias de Judá e Jerusalém indicam a terra habitada pelo povo em foco; “a terra” preserva a amplitude e a ambiguidade lexical sem sugerir necessariamente o planeta inteiro.
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: família por família
  rationale: A repetição tem sentido distributivo. “Família por família” conserva de modo idiomático tanto a distribuição quanto a repetição enfática do hebraico.
- source_word: לְבָד
  choice: à parte
  rationale: לבד enfatiza separação. “À parte” funciona naturalmente em todas as ocorrências e mantém a insistência do texto no lamento separado de cada grupo.
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: a família da casa de Davi
  rationale: A formulação preserva a cadeia construta e sua nuance dinástica, permanecendo clara em português.
- source_word: וּנְשֵׁיהֶם
  choice: e suas mulheres
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. Embora o sufixo possessivo e o contexto familiar possam favorecer “esposas”, “suas mulheres” mantém a ambiguidade lexical e é compreensível no contexto.
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: a família da casa de Natã
  rationale: A expressão identifica uma linhagem familiar específica e corresponde formalmente à referência anterior à casa de Davi.
theological_decisions:
- issue: Alcance de הָאָרֶץ no contexto profético
  choice: a terra
  alternative: o país; toda a terra
  rationale: O contexto imediato enumera linhagens de Judá e Jerusalém, favorecendo a terra do povo em questão. A tradução “a terra” conserva, contudo, a amplitude semântica do termo e evita resolver além do necessário seu alcance geográfico.
- issue: Identidade das mulheres em וּנְשֵׁיהֶם
  choice: suas mulheres
  alternative: suas esposas
  rationale: O contexto doméstico permite entender “esposas”, mas o substantivo hebraico também significa “mulheres”. A opção no texto evita restringir silenciosamente a referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “à parte” foi mantida para reproduzir a ênfase estrutural do hebraico; “família por família” traduz o uso distributivo da repetição hebraica.
