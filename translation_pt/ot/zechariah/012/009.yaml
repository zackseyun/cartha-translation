base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
translation:
  language: pt
  text: E, naquele dia, procurarei destruir todas as nações que vierem contra Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me empenharei em destruir”. O verbo hebraico pode enfatizar uma intenção determinada, e não apenas a ideia de procurar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E
  rationale: A fórmula profética introduz um acontecimento futuro. Em português atual, sua força é transmitida naturalmente pela ligação com a expressão temporal, sem o pouco idiomático “e acontecerá”.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal profética consagrada, preservada sem definir seu calendário ou modo de cumprimento.
- source_word: אֲבַקֵּשׁ
  choice: procurarei
  rationale: O piel de בקש conserva a ideia lexical de buscar/procurar e, seguido do infinitivo, comunica propósito deliberado; a nota registra a possível ênfase em determinação.
- source_word: לְהַשְׁמִיד
  choice: destruir
  rationale: O infinitivo hiphil de שׁמד indica causar destruição. “Destruir” é forte, natural e não especifica além do que o hebraico exige.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Preserva o alcance coletivo e abrangente de כָּל e traduz גּוֹיִם pelo termo contextual comum, sem introduzir a categoria posterior “gentios”.
- source_word: הַבָּאִים
  choice: que vierem
  rationale: O particípio atributivo caracteriza as nações por seu movimento hostil. O futuro do subjuntivo é natural em português dentro da referência profética futura.
- source_word: עַל יְרוּשָׁלִָם
  choice: contra Jerusalém
  rationale: Com movimento hostil, עַל tem sentido adversativo; “contra” expressa claramente o ataque indicado pelo contexto.
theological_decisions:
- issue: O falante divino e sua agência no juízo
  choice: 'Mantida diretamente na primeira pessoa: “procurarei destruir”.'
  alternative: Converter o juízo em acontecimento impessoal ou suavizar a ação divina.
  rationale: O verbo hebraico na primeira pessoa do singular apresenta Deus como aquele que age contra as nações que atacam Jerusalém.
- issue: Fórmula profética e possível alcance escatológico
  choice: “naquele dia”, sem explicitar o referente.
  alternative: Acrescentar uma identificação cronológica ou um esquema escatológico específico.
  rationale: A expressão tem força profética, mas o versículo não define por si só o calendário nem o sistema de cumprimento.
- issue: Nuance de אֲבַקֵּשׁ
  choice: “procurarei”, com nota sobre a possível ênfase em propósito resoluto.
  alternative: “decidirei” ou “me empenharei”, incorporando a determinação diretamente ao texto.
  rationale: A tradução preserva o núcleo lexical e deixa em nota a nuance contextual, evitando resolver em excesso uma construção que pode ressaltar intenção determinada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A vírgula após “E” acompanha a expressão temporal intercalada; a formulação evita arcaísmos e preserva a concisão profética.
