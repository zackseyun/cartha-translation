base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/014.yaml
  text: all the families that remain[a], family by family by themselves, and their wives by themselves.
translation:
  language: pt
  text: todas as famílias restantes, cada família à parte, e suas esposas[a] à parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suas mulheres». O termo hebraico pode significar tanto «mulheres» quanto «esposas» neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַמִּשְׁפָּחוֹת הַנִּשְׁאָרוֹת
  choice: todas as famílias restantes
  rationale: Expressa de modo natural o conjunto completo das famílias que ficaram, sem especificar se são sobreviventes ou apenas as não mencionadas anteriormente.
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: cada família
  rationale: A repetição do substantivo tem valor distributivo; «cada família» reproduz esse sentido com clareza e naturalidade em português.
- source_word: לְבָד
  choice: à parte
  rationale: Preserva a ideia de separação e permite repetir a expressão, como no hebraico, tanto para cada família quanto para as mulheres.
- source_word: וּנְשֵׁיהֶם
  choice: e suas mulheres
  rationale: O hebraico pode designar as mulheres pertencentes aos grupos familiares ou, mais especificamente, as esposas. «Suas mulheres» mantém essa amplitude sem eliminar a distinção de sexo presente no texto.
theological_decisions:
- issue: Separação entre os grupos familiares e suas mulheres no lamento
  choice: Manter explicitamente «cada família à parte, e suas mulheres à parte».
  alternative: Generalizar como «todos à parte» ou especificar «suas esposas».
  rationale: O texto hebraico destaca a participação separada dos grupos e das mulheres e repete לְבָד. A tradução conserva essa estrutura sem neutralizar a distinção nem restringir desnecessariamente נָשִׁים a «esposas».
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção distributiva hebraica foi vertida idiomaticamente por «cada família», enquanto a repetição enfática de «à parte» foi preservada.
