  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: pt
  text: E Yahweh salvará primeiro as tendas de Judá[a], para que a glória da casa de Davi e a glória dos habitantes de Jerusalém não se engrandeçam sobre Judá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as moradas de Judá”. O hebraico diz literalmente “as tendas de Judá”, provavelmente em contraste com as comunidades de Judá fora de Jerusalém, de um lado, e Jerusalém e a casa de Davi, de outro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não sejam exaltadas acima de Judá”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הוֹשִׁיעַ
  choice: salvará
  rationale: O hifil de ישׁע expressa salvar ou livrar; “salvará” é natural em português e mantém o peso teológico do resgate realizado por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָהֳלֵי יְהוּדָה
  choice: as tendas de Judá
  rationale: Mantém a imagem concreta do hebraico, provavelmente alusiva às comunidades de Judá fora do centro urbano, em contraste com Jerusalém e a casa de Davi.
- source_word: בָּ/רִאשֹׁנָה
  choice: primeiro
  rationale: Expressa com clareza a prioridade indicada pelo advérbio hebraico.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a força de propósito da construção hebraica.
- source_word: תִגְדַּל
  choice: não se engrandeçam
  rationale: גדל significa tornar-se grande ou engrandecer-se. O plural é exigido pelo português natural devido aos dois elementos coordenados, embora o hebraico empregue verbo singular.
- source_word: תִּפְאֶרֶת
  choice: glória
  rationale: Abrange esplendor, honra e posição elevada sem reduzir o termo à ideia de mera vanglória.
- source_word: בֵּית דָּוִיד
  choice: a casa de Davi
  rationale: Conserva a expressão tradicional e sua possível referência dinástica.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: O particípio singular hebraico tem sentido coletivo; o plural oferece a formulação mais natural em português.
- source_word: עַל יְהוּדָה
  choice: sobre Judá
  rationale: Aqui עַל indica superioridade ou elevação relativa; “sobre Judá” conserva essa relação sem definir em excesso sua natureza.
theological_decisions:
- issue: Contraste sociopolítico dentro do povo de Deus
  choice: Yahweh salva primeiro as comunidades de Judá representadas por suas tendas, impedindo que a casa davídica e Jerusalém sejam engrandecidas sobre Judá.
  alternative: O versículo indicaria somente uma ordem cronológica, sem qualquer dimensão de nivelamento social.
  rationale: O contraste entre as “tendas de Judá”, a “casa de Davi” e os habitantes de Jerusalém, unido à oração de propósito, sugere que a prioridade também impede a exaltação desproporcional do centro real e urbano. A tradução mantém essa tensão sem torná-la mais explícita que o hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “salvará primeiro as tendas” evita a possível leitura de que Yahweh salvará apenas a primeira parte das tendas. O plural verbal acomoda a coordenação natural em português, sem alterar a relação semântica entre as duas ocorrências de “glória”.
