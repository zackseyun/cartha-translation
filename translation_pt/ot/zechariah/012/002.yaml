source:
  edition: WLC
  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: pt
  text: Eis que farei de Jerusalém um cálice que fará cambalear[a] todos os povos ao redor. Isso também será contra Judá, no cerco contra Jerusalém.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um cálice de vertigem». A expressão hebraica também pode ser entendida mais literalmente como «uma bacia» ou «uma soleira que faz cambalear», mas, neste contexto, é mais provável que descreva um recipiente cuja bebida provoca cambaleio.'
    reason: lexical_alternative
  - marker: b
    text: 'A construção hebraica desta última frase é difícil. Também pode significar: «Judá também será sitiado juntamente com Jerusalém» ou «isso também virá sobre Judá quando Jerusalém for sitiada».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com solenidade e vivacidade o anúncio profético, preservando a função de chamar a atenção.
- source_word: אָנֹכִי
  choice: eu, expresso na forma verbal «farei»
  rationale: O pronome independente dá ênfase ao agente divino; em português, essa ênfase é suficientemente comunicada pelo contexto e pela forma verbal, sem tornar a frase pesada com «eu mesmo».
- source_word: שָׂם
  choice: farei de
  rationale: O particípio com הִנֵּה pode expressar uma ação iminente no discurso profético. «Farei de» comunica naturalmente que Jerusalém será transformada metaforicamente em um cálice.
- source_word: סַף רַעַל
  choice: um cálice que fará cambalear
  rationale: Embora סַף possa designar uma soleira ou um recipiente, o contexto favorece um recipiente de bebida cujo conteúdo provoca instabilidade semelhante à embriaguez. A formulação verbal é clara e natural em português.
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: todos os povos ao redor
  rationale: Mantém o sentido coletivo plural de עַמִּים e a localização dos povos vizinhos, sem acrescentar uma identificação política específica.
- source_word: עַל יְהוּדָה
  choice: contra Judá
  rationale: Conserva a força potencialmente hostil de עַל no contexto militar, sem decidir de modo mais específico como Judá participa ou é afetado.
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: no cerco contra Jerusalém
  rationale: Reproduz de perto a construção militar e mantém «contra» para a ação dirigida a Jerusalém.
theological_decisions:
- issue: Sentido da cláusula difícil וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם
  choice: Isso também será contra Judá, no cerco contra Jerusalém.
  alternative: 'Judá também será sitiado juntamente com Jerusalém; ou: isso também virá sobre Judá quando Jerusalém for sitiada.'
  rationale: O hebraico é sintaticamente condensado e permite mais de uma relação entre Judá, o cerco e Jerusalém. A tradução principal conserva a repetição de עַל com valor hostil e não elimina a tensão sobre o papel exato de Judá; a nota registra as principais leituras alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eis que» preserva o tom solene do anúncio profético; «cálice que fará cambalear» torna inteligível a metáfora sem apagar a alternativa lexical; a cláusula final permanece deliberadamente próxima da ambiguidade e da tensão do hebraico.
