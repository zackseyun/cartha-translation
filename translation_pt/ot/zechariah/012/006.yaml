source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא אָשִׂים֩ אֶת אַלֻּפֵ֨י יְהוּדָ֜ה כְּֽ/כִיּ֧וֹר אֵ֣שׁ בְּ/עֵצִ֗ים וּ/כְ/לַפִּ֥יד אֵשׁ֙ בְּ/עָמִ֔יר וְ/אָ֨כְל֜וּ עַל יָמִ֧ין וְ/עַל שְׂמֹ֛אול אֶת כָּל הָ/עַמִּ֖ים סָבִ֑יב וְ/יָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּ/ירוּשָׁלִָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: pt
  text: Naquele dia, farei dos líderes de Judá[a] como um braseiro em chamas no meio da lenha e como uma tocha acesa no meio dos feixes. Eles consumirão, à direita e à esquerda, todos os povos ao redor. E Jerusalém voltará a habitar em seu próprio lugar[b], em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os chefes de Judá”; possivelmente, “os clãs de Judá”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “debaixo de si mesma”, expressão que significa “em seu próprio lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: os líderes de Judá
  rationale: אַלּוּף designa com frequência um chefe ou líder de um grupo, embora possa, por extensão, representar a própria unidade de clã. No contexto imediato, os líderes falam e atuam como representantes coletivos de Judá; “líderes” mantém o sentido pessoal mais direto sem apagar a dimensão corporativa, registrada em nota.
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: como um braseiro em chamas no meio da lenha
  rationale: כִּיּוֹר é um recipiente ou bacia; qualificado por “fogo” e colocado entre madeira, descreve um recipiente com brasas capaz de incendiar o combustível ao redor. “Braseiro” transmite a imagem de modo natural em português.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: e como uma tocha acesa no meio dos feixes
  rationale: לַפִּיד אֵשׁ é uma tocha ardente, e עָמִיר pode indicar feixes ou montes de cereal e talos. “Feixes” conserva a imagem agrícola e a facilidade com que o fogo se espalha.
- source_word: וְאָכְלוּ
  choice: Eles consumirão
  rationale: O verbo “comer” é metafórico e descreve destruição. “Consumirão” preserva tanto o sentido destrutivo quanto a continuidade das imagens de fogo.
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: à direita e à esquerda
  rationale: A tradução conserva a expressão direcional hebraica, que comunica a extensão da derrota sem substituí-la pela interpretação mais geral “por todos os lados”.
- source_word: כָּל הָעַמִּים סָבִיב
  choice: todos os povos ao redor
  rationale: עַמִּים é mais amplo que “nações” e pode designar povos ou grupos humanos. סָבִיב indica os povos que cercam Judá e Jerusalém.
- source_word: וְיָשְׁבָה יְרוּשָׁלַם
  choice: E Jerusalém voltará a habitar
  rationale: ישׁב significa habitar, morar, permanecer ou estar estabelecido. A formulação mantém a personificação profética da cidade e a força ativa do verbo.
- source_word: עוֹד תַּחְתֶּיהָ
  choice: em seu próprio lugar
  rationale: A expressão significa literalmente “debaixo de si mesma” e funciona idiomaticamente para indicar que a cidade permanece ou se estabelece no lugar que lhe pertence.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: 'A repetição do nome da cidade é preservada por sua força enfática: Jerusalém habitará no lugar que lhe pertence, isto é, em Jerusalém.'
theological_decisions:
- issue: Identidade corporativa de אַלֻּפֵי יְהוּדָה
  choice: “líderes de Judá”, entendidos como representantes do conjunto de Judá
  alternative: “clãs de Judá” ou “chefes de Judá”
  rationale: O substantivo aponta de modo direto para chefes ou líderes, mas esses representantes aparecem envolvidos na ação coletiva de Judá. A tradução evita restringir a promessa a uma doutrina sobre uma elite, enquanto a nota preserva a possibilidade do sentido corporativo “clãs”.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. As imagens concretas de fogo e a repetição enfática de “Jerusalém” foram mantidas; a sintaxe foi levemente naturalizada sem eliminar a personificação profética da cidade.
