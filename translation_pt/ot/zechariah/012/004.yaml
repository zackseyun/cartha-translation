  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: pt
  text: Naquele dia — declara Yahweh — ferirei cada cavalo com pânico e seu cavaleiro com loucura. Mas sobre a casa de Judá abrirei os olhos[a], e ferirei com cegueira cada cavalo dos povos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manterei os olhos abertos sobre a casa de Judá”. A expressão hebraica indica atenção vigilante, provavelmente favorável neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida em português atual e solene, preservando o nome divino expresso no hebraico.
- source_word: אַכֶּה
  choice: ferirei
  rationale: O hifil de נכה significa aqui 'ferir' ou 'atingir'. 'Ferirei' preserva a ação divina sem acrescentar a ideia de morte.
- source_word: כָל סוּס
  choice: cada cavalo
  rationale: O singular depois de כָל tem sentido distributivo; 'cada cavalo' o reproduz com clareza.
- source_word: בַּתִּמָּהוֹן
  choice: com pânico
  rationale: O substantivo comunica espanto desorientador ou terror; 'pânico' se ajusta ao contexto de juízo militar.
- source_word: וְרֹכְבוֹ
  choice: e seu cavaleiro
  rationale: O sufixo masculino singular retoma 'cavalo'; 'seu cavaleiro' é conciso e natural.
- source_word: בַּשִּׁגָּעוֹן
  choice: com loucura
  rationale: Mantém a força do termo hebraico, que denota desvario ou perturbação extrema, sem empregar terminologia clínica.
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: Mas manterei os olhos abertos sobre a casa de Judá
  rationale: Preserva a imagem hebraica de abrir os olhos sobre alguém e expressa, pelo contraste, atenção favorável, sem explicitar proteção além do que o texto afirma.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Conserva a expressão coletiva e pactual do hebraico, em vez de reduzi-la simplesmente a 'Judá'.
- source_word: כֹל סוּס הָעַמִּים
  choice: cada cavalo dos povos
  rationale: '''Povos'' corresponde de perto ao plural עַמִּים e deixa aberta a alternativa contextual ''nações''.'
- source_word: בַּעִוָּרוֹן
  choice: com cegueira
  rationale: Tradução direta do substantivo de juízo, em paralelo com 'pânico' e 'loucura'.
theological_decisions:
- issue: O olhar de Yahweh dirigido à casa de Judá
  choice: manterei os olhos abertos sobre a casa de Judá
  alternative: abrirei os olhos para a casa de Judá; velarei pela casa de Judá
  rationale: A formulação mantém a metáfora do original e sugere atenção favorável pelo contraste com o juízo, sem transformar a implicação contextual numa afirmação explícita de proteção.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; a transliteração 'Yahweh' o representa diretamente e coincide com a camada de consulta fornecida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura paralela do hebraico foi preservada. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
