    issue: «Sentença» para מַשָּׂא
    rationale: Embora possível em contexto de juízo, «sentença» normalmente denota decisão ou condenação judicial. O termo hebraico introduz um pronunciamento/oráculo profético e não requer essa especificação.
  - severity: low
    issue: «firma os alicerces da terra»
    rationale: A formulação acrescenta a imagem concreta e plural de «alicerces». וְיֹסֵד אָרֶץ significa diretamente fundar/estabelecer a terra.
  - severity: low
    issue: «dentro de cada pessoa» para בְּקִרְבּוֹ
    rationale: A expressão é interpretativamente distributiva e substitui o singular do texto. Uma redação com «ser humano» e pronome singular conserva melhor a forma e o alcance genérico.
