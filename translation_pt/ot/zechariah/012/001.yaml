source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: pt
  text: 'Oráculo: palavra de Yahweh acerca de Israel — declaração de Yahweh, que estende os céus, funda a terra e forma o espírito do ser humano dentro dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «o espírito do homem dentro dele»; ou: «o espírito humano dentro dele». Quanto ao início do versículo, também se pode traduzir: «Oráculo: palavra de Yahweh contra Israel», pois a preposição hebraica pode significar «acerca de» ou, em certos contextos, «contra».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: Sentença
  rationale: Em títulos proféticos, o termo introduz um pronunciamento solene e de peso. “Sentença” é corrente em português bíblico e evita a concretude potencialmente enganosa de “peso”, embora possa sugerir juízo; a nota registra uma alternativa.
- source_word: דְבַר יְהוָה
  choice: palavra de Yahweh
  rationale: Preserva a fórmula profética e a ligação formal entre palavra e revelação, sem ampliá-la para “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: עַל
  choice: acerca de
  rationale: Apresenta Israel como assunto da sentença sem antecipar que ela seja exclusivamente contra Israel; o contexto inclui juízo e salvação.
- source_word: נְאֻם יְהוָה
  choice: Declaração de Yahweh
  rationale: Mantém a construção nominal solene do hebraico, sem convertê-la em “declara Yahweh”.
- source_word: נֹטֶה שָׁמַיִם
  choice: que estende os céus
  rationale: Representa o particípio como caracterização contínua e majestosa de Yahweh, criador.
- source_word: וְיֹסֵד אָרֶץ
  choice: firma os alicerces da terra
  rationale: Expressa de modo natural e vívido a ideia de fundar ou assentar a terra.
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: e forma o espírito humano
  rationale: “Forma” preserva a imagem de modelar; “espírito humano” comunica o sentido genérico de רוּחַ אָדָם sem restringi-lo ao sexo masculino.
- source_word: בְּקִרְבּוֹ
  choice: dentro de cada pessoa
  rationale: Torna explícito em português natural o referente humano genérico do sufixo masculino singular, sem alterar o alcance universal da expressão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome, evitando sua substituição por um título.
- issue: Sentido genérico de אָדָם
  choice: espírito humano dentro de cada pessoa
  alternative: espírito do homem dentro dele
  rationale: אָדָם é singular e genérico neste contexto criacional. A redação escolhida preserva a referência a cada ser humano e evita que o português moderno a interprete como exclusivamente masculina.
- issue: Alcance de עַל em relação a Israel
  choice: acerca de Israel
  alternative: contra Israel
  rationale: A preposição admite os dois sentidos. Como o discurso subsequente envolve tanto juízo quanto livramento, “acerca de” preserva melhor a amplitude e a ambiguidade contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem solene do cabeçalho profético foi preservada. “Sentença” mantém o peso do gênero profético; as notas conservam as ambiguidades de מַשָּׂא, עַל e da construção singular genérica אָדָם...בְּקִרְבּוֹ.
