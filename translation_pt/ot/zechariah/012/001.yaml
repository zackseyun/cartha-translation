revisions:
- from: Sentença[a], palavra de Yahweh acerca de Israel. Declaração de Yahweh, que estende os céus, firma os alicerces da terra e forma o espírito humano dentro de cada pessoa.[b]
  to: 'Oráculo: palavra de Yahweh acerca de Israel — declaração de Yahweh, que estende os céus, funda a terra e forma o espírito do ser humano dentro dele.[a]'
  rationale: A revisão troca «Sentença» por «Oráculo», que reproduz o uso profético de מַשָּׂא sem antecipar um sentido judicial. «Funda a terra» evita acrescentar «alicerces» e corresponde diretamente a יסד. A última cláusula retém a referência genérica e singular do hebraico; a nota registra tanto a formulação literal quanto a alternativa inclusiva e preserva a ambiguidade de עַל.
