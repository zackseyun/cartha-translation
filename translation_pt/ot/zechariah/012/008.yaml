source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: pt
  text: Naquele dia, Yahweh protegerá os habitantes de Jerusalém. Naquele dia, quem tropeça entre eles será como Davi, e a casa de Davi será como Deus[a], como o anjo de Yahweh diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como seres divinos» ou «como deuses». O hebraico אֱלֹהִים pode ter esses sentidos em alguns contextos, embora aqui seja provável a comparação singular, «como Deus».
    reason: alternative_reading
lexical_decisions:
- source_word: יָגֵן
  choice: protegerá
  rationale: O verbo expressa defesa ou proteção. «Protegerá» é natural em português e transmite com clareza a ação de resguardar, sem acrescentar uma imagem ausente do uso contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַד
  choice: os habitantes (como complemento de «protegerá»)
  rationale: Com יָגֵן, a preposição indica aqueles em favor de quem se exerce a proteção; em português, isso é expresso naturalmente pelo objeto direto.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: O particípio singular tem sentido coletivo; o plural idiomático comunica essa referência sem perder seu alcance.
- source_word: הַנִּכְשָׁל
  choice: quem tropeça
  rationale: Preserva a metáfora concreta do verbo כשל e deixa implícitas as ideias possíveis de fraqueza ou vacilação.
- source_word: בָּהֶם
  choice: entre eles
  rationale: Entende a expressão em sentido social ou corporativo, referindo-se à pessoa que tropeça no meio dos habitantes.
- source_word: כְּדָוִיד
  choice: como Davi
  rationale: Reproduz diretamente a comparação com Davi e sua conotação contextual de força e destaque.
- source_word: בֵּית דָּוִיד
  choice: a casa de Davi
  rationale: Conserva a ressonância familiar e dinástica da expressão hebraica tradicional.
- source_word: כֵּאלֹהִים
  choice: como Deus
  rationale: Embora אֱלֹהִים possa designar deuses ou seres divinos em certos contextos, o paralelismo seguinte favorece aqui uma comparação singular e elevada. A ambiguidade lexical é registrada em nota.
- source_word: כְּמַלְאַךְ יְהוָה
  choice: como o anjo de Yahweh
  rationale: Na fórmula bíblica recorrente, «anjo» comunica melhor o provável referente sobrenatural, preservando também a ligação intertextual.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: É formalmente próximo do hebraico e mantém aberta a nuance entre posição à frente, liderança e presença que precede.
theological_decisions:
- issue: Sentido de אֱלֹהִים na comparação aplicada à casa de Davi
  choice: como Deus
  alternative: como deuses; como seres divinos
  rationale: A comparação paralela com «o anjo de Yahweh» favorece a leitura singular, sem eliminar a amplitude semântica de אֱלֹהִים. A tradução mantém a força surpreendente da afirmação, e a nota preserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «naquele dia» foi mantida, mas distribuída em duas frases para favorecer a clareza. «Casa de Davi» conserva o registro bíblico e o sentido dinástico; «diante deles» preserva a concisão e a ambiguidade espacial ou funcional do original.
