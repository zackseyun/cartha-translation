reference: Zechariah 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: pt
  text: Ele passará pelo mar da aflição[a] e ferirá as ondas do mar; todas as profundezas do Nilo[b] secarão. O orgulho da Assíria será abatido, e o cetro do Egito[c] desaparecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por um mar de aflição» ou «pelo mar revolto». A expressão hebraica é compacta e pode evocar a travessia do êxodo, sem se limitar à identificação de um corpo de água literal.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode significar simplesmente «rio», mas, em contexto egípcio, costuma referir-se ao Nilo.
    reason: lexical_alternative
  - marker: c
    text: Ou «a vara do Egito». «Cetro» ressalta o provável sentido de poder governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Ele passará
  rationale: O perfeito qal com a conjunção, no fluxo do discurso profético, tem sentido futuro. O pronome explicita em português o sujeito implícito, identificado pelo contexto como Deus.
- source_word: בַּיָּם צָרָה
  choice: pelo mar da aflição
  rationale: Mantém a formulação hebraica compacta e a imagem do mar associada à aflição, sem reduzi-la apenas a um mar literal nem convertê-la silenciosamente em adjetivo.
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: e ferirá as ondas do mar
  rationale: Preserva o sentido comum de נכה, «ferir», e apresenta em ordem natural no português a imagem de Deus golpeando as ondas.
- source_word: וְהֹבִישׁוּ כֹּל מְצוּלוֹת יְאֹר
  choice: todas as profundezas do Nilo secarão
  rationale: No contexto de águas, יבש indica secar. A construção resultativa é natural em português; מְצוּלוֹת são as profundezas, e יְאֹר, no contexto egípcio, designa normalmente o Nilo.
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  choice: O orgulho da Assíria será abatido
  rationale: גְּאוֹן pode indicar orgulho, exaltação ou majestade; no contexto de juízo, «orgulho» comunica bem a conotação negativa. A voz passiva reflete o hofal de ירד.
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: e o cetro do Egito desaparecerá
  rationale: שֵׁבֶט pode ser vara, bastão ou cetro. Em paralelo com a queda da Assíria e no contexto de poder imperial, «cetro» representa a autoridade governante; «desaparecerá» expressa a remoção desse domínio.
theological_decisions:
- issue: Continuidade do sujeito e agente implícito
  choice: Deus é o sujeito implícito de «passará» e «ferirá»; as cláusulas seguintes descrevem os resultados de sua ação.
  alternative: O povo restaurado poderia ser entendido como sujeito de parte das ações.
  rationale: O contexto precedente apresenta a libertação como obra divina, e os verbos iniciais no singular favorecem Deus como agente. A tradução conserva a evocação do êxodo sem identificar dogmaticamente cada detalhe da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a imagem profética e o paralelismo entre Assíria e Egito, enquanto as notas registram ambiguidades lexicais reais.
