  text: וְ/אֶזְרָעֵ/ם֙ בָּֽ/עַמִּ֔ים וּ/בַ/מֶּרְחַקִּ֖ים יִזְכְּר֑וּ/נִי וְ/חָי֥וּ אֶת בְּנֵי/הֶ֖ם וָ/שָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: pt
  text: Eu os semearei entre os povos[a]; em lugares distantes, eles se lembrarão de mim. Eles e seus filhos viverão[b], e eles voltarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espalharei entre as nações”. O verbo hebraico significa literalmente “semear” e pode sugerir tanto dispersão quanto plantio intencional visando crescimento futuro.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “viverão com seus filhos”. O sentido também pode ser expresso por “eles e seus filhos viverão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: Eu os semearei
  rationale: Preserva a metáfora agrícola de זרע, que neste contexto pode sugerir tanto dispersão entre os povos quanto uma ação intencional voltada para crescimento e restauração.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: Traduz o plural עַמִּים sem sugerir necessariamente Estados nacionais modernos e mantém a ideia de grupos humanos entre os quais o povo é disperso.
- source_word: וּבַמֶּרְחַקִּים
  choice: em lugares distantes
  rationale: Expressa de modo natural o sentido locativo de מֶרְחָק, isto é, regiões ou lugares longínquos.
- source_word: יִזְכְּרוּנִי
  choice: eles se lembrarão de mim
  rationale: Reproduz diretamente זכר com o sufixo de primeira pessoa, sem acrescentar elementos não expressos no hebraico.
- source_word: וְחָיוּ
  choice: viverão
  rationale: Mantém a amplitude de חיה, que pode envolver vida continuada, sobrevivência ou vida renovada, sem restringir o sentido.
- source_word: אֶת־בְּנֵיהֶם
  choice: Eles e seus filhos
  rationale: Entende אֶת em sentido comitativo e torna claro, em português corrente, que tanto eles quanto seus filhos viverão.
- source_word: וָשָׁבוּ
  choice: eles voltarão
  rationale: שוב significa voltar ou retornar; a formulação preserva tanto a dimensão concreta da volta quanto sua possível ressonância de restauração da aliança.
theological_decisions:
- issue: Sentido da metáfora de semear no contexto da restauração
  choice: Conservar a imagem de uma dispersão intencional que conduz à lembrança e à volta.
  alternative: Entender a expressão somente como dispersão punitiva ou somente como plantio para multiplicação.
  rationale: O contexto de restauração permite que a metáfora contenha simultaneamente dispersão e propósito fecundo; “semear” preserva essa tensão.
- issue: Relação entre os retornados e seus filhos na promessa de vida
  choice: 'Apresentar ambos como participantes da vida prometida: “Eles e seus filhos viverão”.'
  alternative: 'Traduzir de modo mais formal: “viverão com seus filhos”.'
  rationale: O uso comitativo de אֶת permite a leitura de participação conjunta. A formulação escolhida é clara em português sem excluir a construção mais literal, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem incomum de semear pessoas foi mantida por sua importância poética e teológica. A repetição de “eles” na última oração evita que a coordenação seja entendida automaticamente como afirmação exclusiva de que os filhos também constituem o sujeito explícito de “voltarão”.
