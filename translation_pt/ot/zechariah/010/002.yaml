source:
  edition: WLC
  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: pt
  text: Pois os ídolos domésticos[a] falam perversidade, e os adivinhos têm visões mentirosas; contam sonhos vazios e oferecem consolo inútil. Por isso, o povo vagueia como ovelhas; sofre[b] porque não há pastor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os terafins”, objetos de culto doméstico ou ídolos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é oprimido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: O termo designa objetos de culto ou divindades do âmbito doméstico; a expressão mantém o referente concreto e é compreensível em português atual.
- source_word: דִּבְּרוּ אָוֶן
  choice: falam perversidade
  rationale: אָוֶן pode indicar perversidade, falsidade ou inutilidade. No paralelismo com visões mentirosas e sonhos vazios, “perversidade” conserva tanto a dimensão moral quanto a enganosa.
- source_word: הַקֹּסְמִים
  choice: os adivinhos
  rationale: Designa praticantes de adivinhação; “adivinhos” é preciso, corrente e adequado ao contexto religioso antigo.
- source_word: חָזוּ שֶׁקֶר
  choice: têm visões mentirosas
  rationale: A formulação explicita de modo natural em português a linguagem visionária do verbo חזה e preserva o caráter falso da suposta revelação.
- source_word: חֲלֹמוֹת הַשָּׁוְא יְדַבֵּרוּ
  choice: contam sonhos vazios
  rationale: “Contam” é idiomático para relatar sonhos, e “vazios” comunica sua falta de conteúdo verdadeiro ou valor sem reduzir a expressão apenas a falsidade.
- source_word: הֶבֶל יְנַחֵמוּן
  choice: oferecem consolo inútil
  rationale: הֶבֶל caracteriza o consolo como vão, insubstancial e incapaz de ajudar; “consolo inútil” transmite esse efeito com clareza.
- source_word: עַל־כֵּן
  choice: Por isso
  rationale: Marca de maneira natural a consequência da orientação falsa descrita anteriormente.
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: o povo vagueia como ovelhas
  rationale: O verbo pode significar partir ou levantar acampamento, mas a imagem da ausência de pastor favorece a ideia de deslocamento sem direção. O sujeito implícito é tornado explícito como “o povo” para evitar em português que os ídolos e adivinhos pareçam ser as ovelhas.
- source_word: יַעֲנוּ
  choice: sofre
  rationale: A forma pode expressar aflição ou opressão. “Sofre” preserva a amplitude sem especificar indevidamente a causa ou a modalidade do padecimento.
- source_word: אֵין רֹעֶה
  choice: não há pastor
  rationale: Mantém diretamente a construção existencial hebraica e a metáfora pastoral de liderança e cuidado.
theological_decisions:
- issue: Natureza dos objetos e das práticas condenados
  choice: Apresentar terafins, adivinhos e sonhos enganosos como fontes ilegítimas de orientação.
  alternative: Tratar os terafins como objetos ancestrais neutros ou interpretar o versículo somente como crítica política.
  rationale: O texto imediato denuncia meios cultuais e divinatórios falsos; a imagem final do pastor também permite uma implicação de liderança sem restringir o sentido a ela.
- issue: Identidade do sujeito que vagueia e sofre
  choice: Explicitar o sujeito contextual como “o povo”.
  alternative: Manter apenas “eles”, preservando formalmente a mudança ambígua de referente.
  rationale: Embora o hebraico use formas plurais sem nomear novamente o sujeito, o sentido contextual passa dos falsos orientadores à coletividade desorientada. Em português, “eles” tenderia a ligar o sofrimento aos ídolos e adivinhos; “o povo” comunica a referência contextual sem definir um grupo mais estreito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a progressão poética entre fala perversa, visão mentirosa, sonhos vazios e consolo inútil. A repetição excessivamente literal de “falar” foi evitada em favor do português natural, sem apagar os distintos atos de falsa revelação.
