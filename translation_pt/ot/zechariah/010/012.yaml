base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/012.yaml
  text: I will strengthen them in Yahweh[b][a], and in his name they will walk,” declares Yahweh.
translation:
  language: pt
  text: “Eu os fortalecerei em Yahweh[a], e em seu nome eles andarão[b]”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os tornarei fortes em Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: “Em seu nome” também pode implicar “por sua autoridade” ou “em conformidade com seu caráter revelado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: Eu os fortalecerei
  rationale: O verbo גבר nesta forma causativa/intensiva, com sufixo de terceira pessoa masculina plural, indica que Yahweh os fará fortes. “Fortalecerei” é natural em português e preserva a força causativa.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב pode indicar esfera, fundamento ou meio. “Em Yahweh” preserva a formulação hebraica e sua amplitude, sem restringi-la a “por meio de Yahweh”.
- source_word: וּבִשְׁמוֹ
  choice: e em seu nome
  rationale: שֵׁם significa “nome”, podendo também evocar autoridade, reputação e caráter revelado. A expressão literal mantém essas conotações sem explicitá-las indevidamente.
- source_word: יִתְהַלָּכוּ
  choice: eles andarão
  rationale: O hitpael de הלך pode significar andar, seguir seu caminho ou conduzir-se. “Andarão” conserva a metáfora bíblica e sua possível referência à vida e à conduta.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Fórmula profética que apresenta a afirmação como pronunciamento divino. “Declara Yahweh” é clara, digna e corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome divino da aliança e segue a orientação lexical fornecida.
- issue: Sentido de “andar em seu nome”
  choice: manter a metáfora “andar”
  alternative: viver em seu nome; conduzir-se em seu nome
  rationale: A metáfora pode abranger modo de vida, conduta, lealdade e atuação sob a autoridade de Yahweh. Mantê-la evita reduzir a riqueza e a tensão da expressão hebraica.
- issue: Força da preposição em בַּיהוָה
  choice: em Yahweh
  alternative: por Yahweh; por meio de Yahweh
  rationale: O hebraico permite entender Yahweh como esfera, fundamento ou meio do fortalecimento. A tradução principal preserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantêm-se a metáfora “andar”, o nome divino “Yahweh” e a construção “em Yahweh” para preservar a amplitude do hebraico.
