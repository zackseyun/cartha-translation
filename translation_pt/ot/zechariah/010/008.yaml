  text: אֶשְׁרְקָ֥ה לָ/הֶ֛ם וַ/אֲקַבְּצֵ֖/ם כִּ֣י פְדִיתִ֑י/ם וְ/רָב֖וּ כְּמ֥וֹ רָבֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: pt
  text: Assobiarei para chamá-los[a] e os reunirei, pois eu os resgatei; e serão tão numerosos quanto antes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Darei um sinal para chamá-los”; o verbo hebraico pode indicar um assobio ou silvo usado como convocação.
    reason: lexical_alternative
  - marker: b
    text: Ou “e eles se multiplicarão como antes”. O hebraico repete o mesmo verbo, que pode significar tanto “multiplicar-se” como “ser numeroso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: Assobiarei para chamá-los
  rationale: O verbo שׁרק descreve um assobio ou silvo usado como sinal. A explicitação de que o assobio serve para chamá-los torna natural em português a função de לָהֶם sem perder a imagem concreta do hebraico.
- source_word: וַאֲקַבְּצֵם
  choice: e os reunirei
  rationale: קבץ significa juntar ou reunir, frequentemente pessoas dispersas. “Reunirei” preserva com naturalidade o sentido de restauração coletiva.
- source_word: כִּי פְדִיתִים
  choice: pois eu os resgatei
  rationale: כִּי apresenta a razão, e פדה denota libertar mediante resgate ou redenção. “Resgatei” é claro para leitores atuais e não especifica um mecanismo teológico além do texto.
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  choice: e eles se multiplicarão como se multiplicaram antes
  rationale: A repetição de רבה é preservada para manter a forma e a possível ambiguidade do hebraico entre multiplicar-se e tornar-se numeroso. “Antes” expressa a comparação com a condição anterior sugerida pelo contexto.
theological_decisions:
- issue: Restauração e reunião fundamentadas no resgate divino
  choice: Apresentar a reunião do povo disperso e seu renovado crescimento como resultado do resgate realizado por Deus.
  alternative: Interpretar a reunião exclusivamente como um evento escatológico específico ou como uma realidade apenas espiritual.
  rationale: O versículo afirma assobio convocatório, reunião, resgate e multiplicação, mas não define aqui um esquema escatológico nem elimina a dimensão histórica e coletiva.
- issue: Valor temporal de פְדִיתִים
  choice: 'Traduzir no passado: “eu os resgatei”.'
  alternative: 'Traduzir como presente ou futuro profético: “eu os resgato” ou “eu os resgatarei”.'
  rationale: A forma verbal hebraica é qatal e apresenta o resgate como realizado, mesmo que os atos de chamar e reunir apareçam na sequência profética futura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Assobiarei” conserva a imagem profética concreta; “para chamá-los” esclarece sua função sem substituir a metáfora. A repetição no final mantém uma característica significativa do hebraico, enquanto a nota registra a formulação portuguesa mais idiomática.
