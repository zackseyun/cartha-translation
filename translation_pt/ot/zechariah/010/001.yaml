  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: pt
  text: Peçam chuva a Yahweh no tempo da chuva tardia[a]. Yahweh produz relâmpagos[b] e lhes dará chuva abundante, e a cada homem, vegetação no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a chuva do fim da estação chuvosa, também chamada “chuva serôdia”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “produz as nuvens de tempestade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה
  choice: Peçam a Yahweh
  rationale: O imperativo plural dirige-se ao povo, e a preposição מִן indica de quem se deve pedir. Em português, “pedir a alguém” expressa essa relação naturalmente.
- source_word: מָטָר
  choice: chuva
  rationale: Termo comum e abrangente para precipitação, adequado ao contexto agrícola.
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: no tempo da chuva tardia
  rationale: מַלְקוֹשׁ designa a chuva do fim da estação chuvosa, importante para a maturação das plantações. “Chuva tardia” preserva a referência agrícola sem vinculá-la às estações do ano do leitor.
- source_word: עֹשֶׂה חֲזִיזִים
  choice: faz os relâmpagos
  rationale: חֲזִיזִים pode designar relâmpagos ou fenômenos de tempestade. “Relâmpagos” representa diretamente o sentido lexical bem atestado; a alternativa contextual “nuvens de tempestade” é preservada em nota.
- source_word: וּמְטַר גֶּשֶׁם
  choice: chuva abundante
  rationale: A combinação intensifica a ideia de chuva. “Chuva abundante” comunica essa força em português claro, sem exigir que se entenda necessariamente um temporal violento.
- source_word: יִתֵּן לָהֶם
  choice: ele lhes dará
  rationale: O imperfeito é entendido como promessa futura em continuidade com o pedido dirigido ao povo.
- source_word: לְאִישׁ
  choice: a cada homem
  rationale: O singular masculino אִישׁ tem força distributiva. “Cada homem” conserva tanto o gênero expresso quanto a distribuição individual.
- source_word: עֵשֶׂב בַּשָּׂדֶה
  choice: vegetação no campo
  rationale: עֵשֶׂב abrange ervas, pastagem e outras plantas. “Vegetação” evita restringir o sentido a grama, e “no campo” mantém o cenário agrícola sem acrescentar posse.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Masculino distributivo em לְאִישׁ
  choice: a cada homem
  alternative: a cada pessoa; a cada um
  rationale: A tradução conserva o substantivo masculino singular do hebraico e torna explícita sua força distributiva, sem neutralizar o gênero gramatical do texto.
- issue: Relação entre a chuva dada ao povo e a vegetação dada individualmente
  choice: repetição de “dará”
  alternative: ele lhes dará chuva abundante, a cada homem vegetação no campo
  rationale: A repetição do verbo em português esclarece os dois complementos da única forma verbal hebraica sem alterar a afirmação de que Yahweh concede tanto a chuva quanto a vegetação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Chuva tardia” é mantida no texto por precisão agrícola, com explicação em nota; “serôdia”, hoje menos comum, aparece apenas como alternativa. A repetição de “dará” evita uma construção elíptica pouco natural em português.
