  source_fidelity: 'A tradução representa com precisão a sequência verbal hebraica: o hifil de שוב é adequadamente expresso por “farei voltar”; קבץ por “reunirei”; e o hifil de בוא por “levarei”. Mantêm-se as origens Egito e Assíria, bem como os destinos Gileade e Líbano. A cláusula final preserva a coordenação de וְ e explicita de modo justificável a insuficiência de espaço implicada pela elipse hebraica, sem lhe impor valor temporal ou final.'
  naturalness: O português é moderno, claro e de leitura ampla. “Eu os farei voltar” e “Eu os levarei” soam naturais e mantêm a ênfase do sujeito divino. “Os reunirei da Assíria” é uma construção levemente mais formal, mas é compreensível, idiomática no registro bíblico e conserva de modo conciso a origem geográfica indicada no texto.
  terminology: “Egito”, “Assíria”, “Gileade” e “Líbano” são as formas portuguesas estabelecidas. “Terra” preserva o substantivo hebraico אֶרֶץ; “lugar suficiente” comunica adequadamente o objeto elíptico da última oração sem transformar a imagem territorial em uma formulação doutrinária.
