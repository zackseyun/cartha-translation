id: ZEC.10.10
reference: Zechariah 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: pt
  text: Eu os farei voltar da terra do Egito e os reunirei da Assíria. Eu os levarei à terra de Gileade e ao Líbano, e não haverá lugar suficiente para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e não se achará para eles”. O objeto — provavelmente lugar ou espaço — fica implícito no hebraico.'
    reason: A nota preserva a elipse e a ambiguidade lexical da cláusula hebraica, esclarecendo o elemento suprido no texto.
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: Eu os farei voltar
  rationale: 'O hifil de שוב é causativo: Deus fará com que retornem. A formulação preserva explicitamente essa causatividade e o sentido espacial do contexto.'
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém אֶרֶץ, preservando a referência geográfica explícita e a possível ressonância do êxodo.
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: e os reunirei da Assíria
  rationale: קבץ descreve a reunião de pessoas dispersas. Em português, a construção mantém a origem geográfica paralela à menção do Egito sem confundir a ação com o simples retorno.
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן אֲבִיאֵם
  choice: Eu os levarei à terra de Gileade e ao Líbano
  rationale: O hifil de בוא significa aqui levar ou trazer a um destino. “Levarei” é natural quando o enunciador indica os destinos; a formulação mantém “terra” com Gileade e evita sugerir em português que “terra” rege necessariamente também “Líbano”.
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: e não haverá lugar suficiente para eles
  rationale: O hebraico diz literalmente que algo “não será encontrado para eles”, sem nomear o objeto. O contexto territorial permite explicitar “lugar”; “suficiente” comunica a insuficiência implícita sem transformar o וְ em finalidade ou resultado.
theological_decisions:
- issue: Objeto implícito em וְלֹא יִמָּצֵא לָהֶם
  choice: Explicitar “lugar suficiente”, entendendo a cláusula como insuficiência de espaço para o povo reunido.
  alternative: 'Manter mais literalmente: “e não se achará lugar para eles”.'
  rationale: A ausência de objeto no hebraico gera uma elipse, mas o contexto imediato de instalação em Gileade e no Líbano indica espaço ou lugar. A tradução torna a ideia inteligível sem declarar além do texto a causa dessa insuficiência.
- issue: Relação do וְ na cláusula final
  choice: 'Traduzir como coordenação: “e não haverá”.'
  alternative: 'Traduzir com valor resultativo ou temporal: “até que não haja”.'
  rationale: A conjunção hebraica é naturalmente coordenativa. Preservá-la evita impor uma relação explícita de propósito, resultado ou limite temporal que o texto não marca de forma inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “Eu” mantém a ênfase na ação divina; a pontuação divide as duas etapas do retorno sem alterar sua coordenação.
