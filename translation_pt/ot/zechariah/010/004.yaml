  text: מִמֶּ֤/נּוּ פִנָּה֙ מִמֶּ֣/נּוּ יָתֵ֔ד מִמֶּ֖/נּוּ קֶ֣שֶׁת מִלְחָמָ֑ה מִמֶּ֛/נּוּ יֵצֵ֥א כָל נוֹגֵ֖שׂ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: pt
  text: Dele virá a pedra angular[a], dele a estaca da tenda, dele o arco de guerra; dele sairão todos os governantes[b] juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pedra angular”, “estaca da tenda” e “arco de guerra” são imagens de estabilidade, sustentação e força militar que procedem de Judá.
    reason: cultural_note
  - marker: b
    text: Ou “todo opressor” ou “todo feitor”. O termo hebraico pode designar quem compele pessoas ou exige trabalho ou tributo, embora aqui também possa referir-se, de modo mais amplo, a um governante que surge de Judá.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A forma hebraica traz uma preposição com sufixo masculino singular, repetida quatro vezes. “Dele” preserva tanto a forma singular quanto a repetição enfática, tendo Judá ou o povo restaurado de Judá como antecedente coletivo.
- source_word: פִנָּה
  choice: pedra angular
  rationale: O substantivo pode designar o canto ou a pedra angular. Neste conjunto de imagens de liderança e força, “pedra angular” comunica de modo natural a ideia de fundamento e estabilidade sem acrescentar “principal”, ausente do hebraico.
- source_word: יָתֵד
  choice: estaca da tenda
  rationale: O termo designa uma estaca ou pino, muitas vezes usado para firmar uma tenda. A formulação mantém a imagem concreta de firmeza e sustentação.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: arco de guerra
  rationale: A construção hebraica indica um arco empregado na guerra. “Arco de guerra” é claro, conciso e preserva a imagem militar.
- source_word: יֵצֵא
  choice: sairá
  rationale: O sentido básico do verbo é “sair”. O futuro “sairá” mantém a imagem verbal sem elevá-la interpretativamente para “procederá” ou “surgirá”.
- source_word: כָל נוֹגֵשׂ
  choice: todo governante
  rationale: O particípio pode indicar quem compele, cobra tributo ou oprime, mas, no contexto positivo de restauração e em paralelo com imagens de sustentação, governo e força militar, “governante” é uma leitura contextual plausível. A acepção mais severa é preservada em nota.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: O advérbio expressa ação ou presença coletiva. “Todos juntos” torna explícito em português que a coletividade se refere ao conjunto dos governantes, sem definir além disso a natureza de sua unidade.
theological_decisions:
- issue: O valor positivo, neutro ou negativo de כָל נוֹגֵשׂ
  choice: 'sentido positivo ou neutro de autoridade: “todo governante”'
  alternative: “todo opressor” ou “todo feitor”
  rationale: A sequência apresenta figuras de estabilidade, sustentação e força provenientes de Judá. “Governante” mantém a coerência desse contexto, mas o termo hebraico frequentemente possui sentido coercivo; por isso, a ambiguidade não é eliminada e aparece em nota.
- issue: A identificação pessoal das imagens da pedra angular, da estaca e do arco
  choice: manter as metáforas sem identificar explicitamente uma única personagem
  alternative: explicitar uma interpretação messiânica ou distribuir as imagens entre líderes distintos
  rationale: O versículo afirma que essas realidades procedem de Judá, mas não resolve sozinho se todas designam uma só figura, vários líderes ou, de modo mais amplo, os recursos de liderança e força do povo restaurado. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “dele” reproduz a ênfase retórica do hebraico. A construção elíptica nos dois membros centrais evita inserir verbos ausentes no texto-fonte, enquanto “virá” no primeiro membro estabelece a estrutura da enumeração. “Todo governante, todos juntos” conserva a tensão entre o singular distributivo כָל נוֹגֵשׂ e o advérbio coletivo יַחְדָּו.
