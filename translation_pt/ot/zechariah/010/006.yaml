reference: Zechariah 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: pt
  text: Fortalecerei a casa de Judá e salvarei a casa de José[a]. Eu os restaurarei[b], porque tive compaixão deles. Eles serão como se eu não os tivesse rejeitado, pois eu sou Yahweh, o Deus deles, e lhes responderei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A casa de José” designa coletivamente os descendentes de José e, muitas vezes, especialmente as tribos do norte.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eu os farei voltar”. A forma hebraica também pode ser entendida como “eu os farei habitar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: Fortalecerei
  rationale: 'O piel de גבר tem força causativa: tornar forte. “Fortalecerei” é natural em português e evita acrescentar uma conotação militar que não é explícita.'
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a expressão corporativa e tribal do hebraico, em vez de reduzi-la simplesmente a “Judá”.
- source_word: בֵּית יוֹסֵף
  choice: a casa de José
  rationale: Mantém a designação corporativa literal. No contexto profético, ela pode abranger os descendentes de José e, em especial, as tribos do norte.
- source_word: אוֹשִׁיעַ
  choice: salvarei
  rationale: Traduz diretamente o hifil de ישׁע e conserva tanto a ideia de livramento quanto sua ressonância teológica, sem restringir o sentido.
- source_word: וְהוֹשְׁבוֹתִים
  choice: Eu os restaurarei
  rationale: No contexto de reversão da rejeição e renovação do povo, “restaurarei” comunica bem o resultado abrangente. A forma hebraica admite nuances de fazê-los voltar ou fazê-los habitar, registradas em nota.
- source_word: כִּי רִחַמְתִּים
  choice: porque tive compaixão deles
  rationale: רחם expressa compaixão ou misericórdia. O perfeito fundamenta a promessa na compaixão já demonstrada ou assumida por Deus.
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: Eles serão como se eu não os tivesse rejeitado
  rationale: Preserva a comparação contrafactual e traduz זנח por “rejeitar”, termo claro que não intensifica indevidamente a ideia para abandono absoluto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְאֶעֱנֵם
  choice: e lhes responderei
  rationale: ענה significa diretamente responder. “Lhes responderei” é idiomático em português e não troca a resposta pela implicação interpretativa de apenas ouvir.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Alcance de “casa de José”
  choice: Manter a expressão corporativa no texto e explicar sua referência histórica em nota
  alternative: Substituir por “tribos do norte” ou “Efraim”
  rationale: A expressão pode representar as tribos do norte, mas o hebraico diz literalmente “casa de José”. A tradução conserva essa formulação e não resolve no texto uma identificação contextual mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se as expressões corporativas “casa de Judá” e “casa de José”; a sintaxe foi levemente segmentada para fluência, sem eliminar o paralelismo nem a tensão do original.
