id: ZEC.10.5
reference: Zechariah 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: pt
  text: Serão como homens valentes[a], pisoteando a lama das ruas na batalha; lutarão, porque Yahweh está com eles, e cobrirão de vergonha os cavaleiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como guerreiros». O hebraico usa literalmente um termo masculino para homens fortes e valorosos no combate.
    reason: alternativa lexical e esclarecimento da forma masculina do original
lexical_decisions:
- source_word: וְהָיוּ
  choice: Serão
  rationale: O perfeito qal com conjunção, no discurso profético, tem sentido futuro. A conjunção inicial não é explicitada para manter a fluidez em português sem perder a sequência.
- source_word: כְגִבֹּרִים
  choice: como homens valentes
  rationale: גִּבּוֹרִים designa homens fortes e valorosos, especialmente combatentes. A tradução conserva a forma masculina e a imagem marcial; «guerreiros» é uma alternativa legítima.
- source_word: בּוֹסִים
  choice: pisoteando
  rationale: O particípio de בוס descreve o ato vigoroso de calcar ou pisar repetidamente, adequado à imagem concreta da batalha.
- source_word: בְּטִיט חוּצוֹת
  choice: a lama das ruas
  rationale: A expressão aponta para a lama ou o lodo encontrado nas ruas. «Lama das ruas» é clara e concreta em português, sem acrescentar um objeto implícito ao verbo.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: No contexto militar imediato, «na batalha» é mais preciso e natural que o sentido mais amplo de «na guerra».
- source_word: וְנִלְחֲמוּ
  choice: lutarão
  rationale: O nifal de לחם significa aqui entrar em combate ou lutar. O futuro mantém o valor profético da forma verbal.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão da capacidade e do êxito deles no combate.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמָּם
  choice: está com eles
  rationale: A cópula, ausente no hebraico nominal, é necessária em português; a expressão preserva a afirmação da presença divina.
- source_word: וְהֹבִישׁוּ
  choice: cobrirão de vergonha
  rationale: O hifil comunica causar vergonha ou humilhação. A locução portuguesa preserva de modo natural tanto o sentido causativo quanto a imagem da vergonha.
- source_word: רֹכְבֵי סוּסִים
  choice: os cavaleiros
  rationale: Equivalente conciso para «os que montam cavalos», com sentido de tropas montadas no contexto militar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» conserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Forma masculina de גִּבֹּרִים
  choice: homens valentes
  alternative: guerreiros
  rationale: A expressão hebraica é masculina plural e retrata combatentes valorosos. A tradução retém essa forma, enquanto a nota registra uma alternativa mais funcional.
- issue: Objeto de בּוֹסִים
  choice: pisoteando a lama das ruas
  alternative: pisoteando os inimigos como lama nas ruas
  rationale: O hebraico menciona explicitamente a lama, mas não explicita «os inimigos». A tradução evita inserir esse objeto interpretativo e conserva a concisão e a possível tensão da imagem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Pisoteando» mantém a força visual do hebraico; «cobrirão de vergonha» exprime naturalmente o causativo sem reduzir a frase apenas a uma derrota militar.
