base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: pt
  text: Os de Efraim serão como um guerreiro valente, e o coração deles[a] se alegrará como quem se alegra com vinho; seus filhos[b] verão e se alegrarão; o coração deles exultará em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o coração deles”, com o substantivo no singular usado coletivamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus descendentes”. O hebraico diz literalmente “seus filhos”, termo que neste contexto pode ter sentido coletivo mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: Os de Efraim serão como um guerreiro valente
  rationale: O verbo hebraico está no plural e “Efraim” designa coletivamente seu povo. “Os de Efraim” preserva essa concordância, enquanto “guerreiro valente” mantém o sentido marcial de גִּבּוֹר.
- source_word: וְשָׂמַח לִבָּם
  choice: o coração deles se alegrará
  rationale: Mantém o singular coletivo “coração” com referência ao grupo, sem convertê-lo silenciosamente em plural.
- source_word: כְּמוֹ יָיִן
  choice: como com vinho
  rationale: Expressa a comparação elíptica com a alegria associada ao vinho, sem explicitar embriaguez nem introduzir uma relação causal mais definida que a do hebraico.
- source_word: וּבְנֵיהֶם
  choice: seus filhos
  rationale: בָּנִים significa literalmente “filhos”, podendo também abranger os filhos e descendentes do grupo; a forma direta é mantida no texto.
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: verão e se alegrarão
  rationale: Preserva a ausência de objeto expresso para “verão” e mantém a coordenação simples do hebraico.
- source_word: יָגֵל לִבָּם
  choice: o coração deles exultará
  rationale: “Exultará” comunica a alegria intensa de גיל e a distingue do verbo שמח usado anteriormente.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: Mantém o nome divino pessoal e traduz a preposição ב como a esfera ou fundamento da exultação.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Referência coletiva a Efraim
  choice: Os de Efraim
  alternative: Efraim será
  rationale: A escolha conserva o verbo hebraico no plural e deixa claro que o nome tribal representa coletivamente o povo, sem transformar Efraim em um indivíduo.
translation_notes:
  register: Português atual, digno e de leitura ampla, com preferência por correspondência ótima. A formulação conserva o paralelismo, a imagem do vinho, o singular coletivo “coração” e a ausência de objeto expresso em “verão”.
