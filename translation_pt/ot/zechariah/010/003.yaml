id: ZEC.10.3
reference: Zechariah 10:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: pt
  text: Minha ira arde contra os pastores[a], e castigarei os bodes, pois Yahweh dos Exércitos[b] cuidou do seu rebanho, a casa de Judá, e fará com que sejam como o seu cavalo majestoso na batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “líderes”. No mesmo quadro figurado, “bodes” pode referir-se a governantes ou homens proeminentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: os pastores
  rationale: Mantém a imagem profética dos pastores como dirigentes do povo, transparente em português, sem substituir a metáfora por sua interpretação.
- source_word: חָרָה אַפִּי
  choice: Minha ira arde
  rationale: Expressa de modo natural e intenso o idiomatismo hebraico de ira acesa.
- source_word: הָעַתּוּדִים
  choice: os bodes
  rationale: Preserva a imagem animal do termo hebraico, que pode designar metaforicamente homens proeminentes ou governantes.
- source_word: אֶפְקֹד
  choice: castigarei
  rationale: Neste contexto hostil, פקד indica uma intervenção punitiva ou acerto de contas.
- source_word: פָקַד
  choice: cuidou
  rationale: 'A segunda ocorrência de פקד tem sentido favorável: Yahweh voltou sua atenção ao rebanho e interveio em favor dele. A tradução reflete essa mudança contextual sem forçar em português a repetição do mesmo verbo.'
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Reproduz o nome divino e comunica de modo claro o sentido militar de צְבָאוֹת.
- source_word: עֶדְרוֹ
  choice: seu rebanho
  rationale: É o equivalente natural no contexto da imagem dos pastores.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Conserva a expressão hebraica tradicional e inteligível para o povo de Judá.
- source_word: וְשָׂם אוֹתָם
  choice: e fará com que sejam
  rationale: Apresenta a ação como consequência futura da intervenção divina e introduz naturalmente a comparação seguinte.
- source_word: כְּסוּס הוֹדוֹ
  choice: como o seu cavalo majestoso
  rationale: Preserva a comparação explícita e traduz הוֹד por uma expressão de majestade e esplendor, sem acrescentar 'de guerra', ideia já fornecida pelo contexto.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: Formulação corrente em português para a atuação militar descrita no verso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; usar 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Interpretação metafórica de הָעַתּוּדִים
  choice: Manter a imagem literal 'bodes' no texto
  alternative: líderes; governantes
  rationale: O termo pode representar dirigentes proeminentes, mas a imagem literal dá continuidade ao quadro pastoril e evita resolver no corpo do texto uma metáfora deliberada.
- issue: Relação temporal de וְשָׂם após פָקַד
  choice: 'futuro consequente: ''e fará'''
  alternative: 'passado: ''e fez'''
  rationale: No discurso profético, a ação seguinte é entendida naturalmente como resultado da atenção já voltada ao rebanho; a forma admite discussão temporal, mas o futuro produz a sequência contextual mais coerente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantêm-se as imagens pastoril e militar, o paralelismo entre a punição dos maus dirigentes e o cuidado com Judá, e a comparação explícita introduzida por כְּ.
