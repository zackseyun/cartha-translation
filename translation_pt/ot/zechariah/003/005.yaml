source:
  edition: WLC
  text: וָ/אֹמַ֕ר יָשִׂ֛ימוּ צָנִ֥יף טָה֖וֹר עַל רֹאשׁ֑/וֹ וַ/יָּשִׂימוּ֩ הַ/צָּנִ֨יף הַ/טָּה֜וֹר עַל רֹאשׁ֗/וֹ וַ/יַּלְבִּשֻׁ֨/הוּ֙ בְּגָדִ֔ים וּ/מַלְאַ֥ךְ יְהוָ֖ה עֹמֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: pt
  text: 'Então eu disse[a]: “Que ponham um turbante puro[b] na cabeça dele.” Eles puseram o turbante puro na cabeça dele e o vestiram com roupas, enquanto o anjo de Yahweh[c] estava de pé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eu disse”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “então” explicita o avanço da narrativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “limpo”. Neste contexto, a palavra também pode destacar a pureza ritual.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “o anjo de Yahweh” é traduzida conforme seu sentido direto. Há diferentes interpretações sobre se ela se refere a um mensageiro angelical criado ou a uma manifestação do próprio Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa com naturalidade a sequência, sem excluir o sentido mais simples de “e”.
- source_word: יָשִׂימוּ
  choice: Que ponham
  rationale: A forma jussiva na terceira pessoa do plural expressa pedido ou desejo; esta construção é natural em português.
- source_word: צָנִיף
  choice: turbante
  rationale: O substantivo designa uma peça de tecido enrolada na cabeça e se ajusta ao contexto sacerdotal sem acrescentar detalhes ausentes no hebraico.
- source_word: טָהוֹר
  choice: puro
  rationale: No contexto da restauração sacerdotal, o termo comunica pureza ritual. “Limpo” também é possível, mas “puro” preserva melhor essa dimensão em português.
- source_word: עַל רֹאשׁוֹ
  choice: na cabeça dele
  rationale: Tradução locativa direta, expressa de modo claro e corrente em português.
- source_word: וַיָּשִׂימוּ
  choice: Eles puseram
  rationale: A ação dá prosseguimento imediato à ordem. A sequência fica clara sem ser necessário reproduzir mecanicamente a conjunção hebraica.
- source_word: הַצָּנִיף הַטָּהוֹר
  choice: o turbante puro
  rationale: Mantém os artigos definidos e a repetição deliberada do texto hebraico.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: e o vestiram com roupas
  rationale: Reproduz o sentido causativo de vestir alguém e mantém expresso o substantivo genérico בְּגָדִים, sem especificá-lo como vestes sacerdotais.
- source_word: בְּגָדִים
  choice: roupas
  rationale: Termo amplo, claro e atual. “Vestes” seria possível, mas teria registro mais elevado; “paramentos” acrescentaria uma especificidade sacerdotal que o substantivo isolado não exige.
- source_word: וּמַלְאַךְ יְהוָה
  choice: enquanto o anjo de Yahweh
  rationale: A conjunção com o particípio é entendida circunstancialmente, indicando uma ação ou condição simultânea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: עֹמֵד
  choice: permanecia ali
  rationale: O particípio descreve uma postura contínua. A expressão comunica presença atenta no local sem tornar a frase excessivamente literal.
theological_decisions:
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: Entender a expressão especificamente como um mensageiro criado ou como uma manifestação do próprio Yahweh
  rationale: A tradução mantém a expressão hebraica de forma transparente e não decide uma questão teológica que o versículo, por si só, deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem direta favorece a compreensão; a repetição de “turbante puro” preserva a ênfase do hebraico. “Roupas” evita tanto arcaísmo quanto uma especificação sacerdotal indevida.
