base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Se você andar nos meus caminhos e cumprir o meu encargo, então também governará a minha casa e cuidará dos meus pátios; e eu lhe darei livre acesso entre estes que estão aqui de pé.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livre circulação entre estes que estão aqui de pé”. O hebraico também pode ser entendido como “os que andam entre estes que estão aqui de pé” ou “lugares para andar entre estes que estão aqui de pé”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pela expressão portuguesa consagrada, que conserva a amplitude do título.
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: andar nos meus caminhos
  rationale: Preserva a metáfora hebraica de conduta e fidelidade, natural e compreensível em português.
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: cumprir o encargo que lhe confiei
  rationale: Explicita de modo natural o sentido de dever ou responsabilidade confiada, especialmente adequado ao contexto sacerdotal.
- source_word: תָּדִין אֶת־בֵּיתִי
  choice: governará a minha casa
  rationale: דין pode indicar julgar, administrar ou governar; no contexto do templo, 'governará' comunica supervisão sem restringi-la a decisões judiciais.
- source_word: תִשְׁמֹר אֶת־חֲצֵרָי
  choice: cuidará dos meus pátios
  rationale: Expressa a responsabilidade de guardar e zelar pelos pátios do templo em linguagem portuguesa corrente.
- source_word: מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: livre acesso entre estes que estão aqui de pé
  rationale: A expressão rara provavelmente promete o privilégio de circular ou ter acesso entre os assistentes celestiais, mas sua ambiguidade é preservada em nota.
theological_decisions:
- issue: Sentido da promessa וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: Promessa de livre acesso entre os seres que estão de pé na presença divina
  alternative: “livre circulação entre estes que estão aqui de pé”, “os que andam entre estes que estão aqui de pé” ou “lugares para andar entre estes que estão aqui de pé”
  rationale: O contexto visionário favorece acesso privilegiado entre os assistentes celestiais, mas מַהְלְכִים é raro e admite análises distintas; por isso, as alternativas são registradas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura condicional e a progressão das promessas foram preservadas; o pronome singular foi vertido por “você” para clareza contemporânea.
