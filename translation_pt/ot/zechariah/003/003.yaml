  text: וִ/יהוֹשֻׁ֕עַ הָיָ֥ה לָבֻ֖שׁ בְּגָדִ֣ים צוֹאִ֑ים וְ/עֹמֵ֖ד לִ/פְנֵ֥י הַ/מַּלְאָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/003.yaml
  text: Joshua was clothed with filthy garments and was standing before the angel[a][b][c].
translation:
  language: pt
  text: Josué estava vestido com roupas imundas[b] e permanecia de pé diante do anjo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “roupas sujas”. “Imundas” expressa melhor a condição intensamente impura indicada pelo termo hebraico.
    reason: lexical_alternative
  - marker: c
    text: Ou “mensageiro”. Neste contexto de visão, “anjo” é a tradução mais natural.
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: Josué
  rationale: O waw dá continuidade à narrativa da visão; em português, a sequência flui naturalmente sem acrescentar um marcador como “Ora”. O nome recebe sua forma portuguesa tradicional.
- source_word: הָיָה לָבֻשׁ
  choice: estava vestido
  rationale: A construção descreve o estado de Josué, não uma mudança de estado. “Estava vestido” preserva de modo natural o valor estativo/passivo.
- source_word: בְּגָדִים צוֹאִים
  choice: roupas imundas
  rationale: “Roupas” traduz o termo geral sem especificar indevidamente vestes sacerdotais; “imundas” comunica a intensa condição de sujeira e impureza do adjetivo.
- source_word: וְ/עֹמֵד
  choice: e permanecia de pé
  rationale: O particípio expressa postura contínua, simultânea ao estado descrito anteriormente. “Permanecia de pé” torna esse aspecto durativo claro em português.
- source_word: לִ/פְנֵי
  choice: diante de
  rationale: Equivalente conciso e natural para presença espacial ou pessoal, apropriado ao cenário visionário.
- source_word: הַ/מַּלְאָךְ
  choice: o anjo
  rationale: Embora o substantivo também possa significar “mensageiro”, “anjo” é a leitura mais natural neste contexto de visão celestial, preservando o artigo definido.
theological_decisions:
- issue: Identidade de הַמַּלְאָךְ no contexto
  choice: o anjo
  alternative: o mensageiro; ou, à luz do contexto mais amplo, o anjo do SENHOR entendido como figura teofânica
  rationale: O versículo diz apenas “o anjo” e não identifica explicitamente a figura de maneira mais específica. A tradução evita impor uma identificação teológica mais forte, mantendo aberta a interpretação contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém leve elevação narrativa sem arcaísmos. O conectivo hebraico inicial não foi explicitado, pois em português a continuidade do discurso é natural sem “E” ou “Ora”.
