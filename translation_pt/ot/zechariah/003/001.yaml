source:
  edition: WLC
  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: pt
  text: Então ele me mostrou Josué, o sumo sacerdote, em pé diante do anjo de Yahweh, e o Acusador[a], em pé à direita dele, para acusá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Satanás ... para se opor a ele». O hebraico diz «o satan», que pode funcionar como título e significar «o acusador» ou «o adversário».'
    reason: Registra a alternativa tradicional e a amplitude semântica da expressão hebraica sem resolver indevidamente sua identificação.
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Então ele me mostrou
  rationale: O hifil de ראה com sufixo de primeira pessoa significa literalmente “fez-me ver” e, de modo natural em português, “mostrou-me”. “Então” expressa com fluidez a progressão narrativa do waw.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: É a forma portuguesa consagrada correspondente ao nome hebraico יְהוֹשֻׁעַ, sem harmonizá-lo com formas alternativas usadas em outros contextos pós-exílicos.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É o título corrente e preciso, em português, para o principal sacerdote de Israel.
- source_word: עֹמֵד
  choice: em pé / estava
  rationale: Os particípios descrevem a postura ou situação das duas figuras na visão. A segunda ocorrência é expressa por “estava” junto à indicação de posição, evitando repetição pesada sem perder o sentido.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva tanto o sentido espacial quanto a possível nuance judicial da cena, sem torná-la explicitamente um tribunal.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; numa visão profética, “anjo” é a opção mais natural. O nome divino é transliterado como “Yahweh”.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: 'O artigo definido e o contexto forense favorecem a leitura como título ou função: “o acusador”. A inicial maiúscula sinaliza a designação pessoal sem transformá-la silenciosamente no nome próprio tradicional.'
- source_word: עַל יְמִינוֹ
  choice: à direita dele
  rationale: Traduz de forma natural a posição indicada pelo hebraico e conserva o pronome, sem substituir no texto o referente por um nome explícito.
- source_word: לְשִׂטְנוֹ
  choice: para acusá-lo
  rationale: O infinitivo deriva da mesma raiz de שָׂטָן e, neste contexto de caráter judicial, “acusar” comunica com clareza a ação pretendida.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser entendido como nome próprio ou como título/função
  choice: o Acusador
  alternative: Satanás; o Adversário
  rationale: O artigo hebraico favorece “o acusador/adversário”, e o infinitivo “para acusá-lo” reforça a função forense. A tradução principal mantém essa força lexical sem negar uma possível identificação com Satanás; a alternativa tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “enquanto” distingue com clareza as duas figuras em pé e mantém o fluxo natural do período.
