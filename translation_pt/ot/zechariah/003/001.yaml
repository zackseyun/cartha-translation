    reason: Registra a alternativa tradicional e a amplitude semântica da expressão hebraica sem resolver indevidamente sua identificação.
  revision_rationale: A revisão restaura a coordenação simples do hebraico e torna explícita a postura do Acusador, preservando o paralelismo dos dois particípios. Mantêm-se as escolhas terminológicas e a nota, com pontuação ajustada para maior fluidez.
