  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תִּקְרְא֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ אֶל תַּ֥חַת גֶּ֖פֶן וְ/אֶל תַּ֥חַת תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: pt
  text: Naquele dia, declara Yahweh dos Exércitos[b], cada um de vocês convidará[a] o seu próximo para debaixo da videira e para debaixo da figueira.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamará”. O verbo hebraico significa literalmente “chamar”, mas aqui provavelmente tem o sentido de convidar.'
    reason: lexical_alternative
  - marker: b
    text: Muitas traduções trazem “SENHOR dos Exércitos” ou “SENHOR das Hostes”. O hebraico usa o nome divino Yahweh e o título צְבָאוֹת, “Exércitos”.
    reason: lexical_alternative
  - marker: c
    text: Compare 1 Reis 4:25 e Miqueias 4:4, em que sentar-se debaixo da videira e da figueira simboliza paz, segurança e prosperidade.
    reason: cross_reference
  - marker: d
    text: Algumas traduções acrescentam “sua” antes de “videira” e “figueira”, com base em expressões bíblicas semelhantes; aqui, porém, o possessivo não está explícito no hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética comum, vertida de modo natural e direto em português.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: נְאֻם introduz solenemente uma declaração divina; o nome pactual יְהוָה é preservado como “Yahweh”, e צְבָאוֹת é traduzido de forma transparente como “Exércitos”.
- source_word: תִּקְרְאוּ
  choice: cada um de vocês convidará
  rationale: Embora קרא signifique literalmente “chamar”, neste contexto o chamado dirigido ao próximo para ir a um lugar tem sentido de convite. A segunda pessoa do plural é explicitada por “vocês”.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: cada um de vocês ... o seu próximo
  rationale: אִישׁ tem valor distributivo, “cada um”, enquanto רֵעַ pode designar o próximo, companheiro ou amigo; “próximo” preserva a amplitude comunitária da expressão.
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: para debaixo da videira e para debaixo da figueira
  rationale: A repetição de אֶל תַּחַת indica direção para o lugar sob cada planta. Mantém-se a repetição e não se acrescenta possessivo ausente do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos exércitos; das hostes
  rationale: “Exércitos” comunica ao leitor moderno a imagem militar e cósmica do título sem restringi-la apenas a seres celestiais.
- issue: Imagem da videira e da figueira
  choice: Preservar a imagem sem explicá-la no corpo do versículo
  alternative: Explicitar “em paz e segurança”
  rationale: A imagem bíblica sugere paz, segurança e prosperidade, mas o texto hebraico deixa que essa associação permaneça figurada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a solenidade da fórmula profética, preserva a repetição hebraica e evita acrescentar ao texto a interpretação simbólica da imagem.
