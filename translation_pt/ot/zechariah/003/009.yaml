reference: Zechariah 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: pt
  text: Pois eis a pedra que coloquei diante de Josué — sobre uma única pedra há sete olhos. Eis que eu mesmo gravarei nela uma inscrição[a] — declara Yahweh dos Exércitos[b] — e removerei a iniquidade daquela terra num só dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “gravarei a sua gravura”. O hebraico emprega palavras da mesma raiz.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois vejam
  rationale: כִּי introduz aqui explicação ou ênfase, enquanto הִנֵּה chama a atenção. “Pois vejam” preserva ambas as funções em português atual e solene.
- source_word: הָאֶבֶן
  choice: a pedra
  rationale: Mantém o sentido concreto e definido do hebraico, sem interpretar o símbolo.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: que coloquei diante de Josué
  rationale: נתן pode significar dar, pôr ou colocar; “coloquei” é natural com “diante de” e o perfeito hebraico é bem representado pelo pretérito perfeito em português.
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: sobre uma única pedra há sete olhos
  rationale: Conserva a construção abrupta e a imagem simbólica. “Uma única pedra” explicita o valor de אַחַת sem identificar os olhos.
- source_word: הִנְנִי
  choice: Vejam, eu mesmo
  rationale: A forma é enfática e autorreferencial; “eu mesmo” preserva essa ênfase.
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  choice: gravarei nela uma inscrição
  rationale: O particípio após הִנְנִי tem força iminente ou futura. A expressão portuguesa é clara e natural, enquanto a construção cognata literal é registrada em nota.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: נְאֻם é a fórmula profética “declara”; יהוה é transliterado como Yahweh, e צְבָאוֹת é traduzido de modo transparente como “dos Exércitos”.
- source_word: וּמַשְׁתִּי אֶת עֲוֺן
  choice: e removerei a iniquidade
  rationale: O verbo indica remoção. עָוֹן abrange iniquidade, culpa e suas consequências; “iniquidade” mantém a amplitude moral sem restringir o sentido à culpa subjetiva.
- source_word: הָאָרֶץ הַהִיא
  choice: daquela terra
  rationale: Representa expressamente o demonstrativo hebraico e conserva a referência específica.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: Tradução idiomática que preserva a concentração da ação em um único dia.
theological_decisions:
- issue: Identidade da pedra e significado dos sete olhos
  choice: Manter literalmente “pedra” e “sete olhos”, sem explicá-los no texto.
  alternative: Identificar a pedra como figura messiânica ou os olhos como símbolo explícito da onisciência divina.
  rationale: O versículo apresenta imagens simbólicas sem as interpretar diretamente; a tradução deve preservar essa abertura e tensão teológica.
- issue: Tradução de יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos Exércitos celestiais
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” traduz צְבָאוֹת sem decidir no texto a composição exata desses exércitos.
- issue: Amplitude de עָוֹן
  choice: iniquidade
  alternative: culpa; pecado; castigo pela culpa
  rationale: O termo hebraico pode envolver ato perverso, culpa e consequência. “Iniquidade” preserva melhor essa densidade sem escolher apenas um aspecto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vejam” funciona como marcador discursivo profético dirigido aos ouvintes, e os travessões organizam a fórmula de declaração sem suavizar a estrutura enfática do original.
