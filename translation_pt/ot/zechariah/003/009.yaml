  naturalness: O texto é claro e de registro digno. A substituição de “vejam” por “eis” melhora a fluência profética em português e evita a alternância algo artificial entre o plural “vejam” e a fala divina em primeira pessoa.
  terminology: “Josué”, “Yahweh dos Exércitos”, “iniquidade”, “terra” e “num só dia” são escolhas adequadas. “Gravarei nela uma inscrição” é uma explicitação natural do referente feminino da pedra; a nota preserva corretamente a expressão cognata hebraica.
