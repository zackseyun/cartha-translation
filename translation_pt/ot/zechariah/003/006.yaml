  yaml_path: translation/ot/zechariah/003/006.yaml
  text: Then the angel of Yahweh solemnly charged Joshua[a], saying,
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] fez uma solene advertência a Josué, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “anjo” quanto “mensageiro”, embora “anjo” se ajuste melhor a este contexto visionário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: Então ... exortou solenemente
  rationale: O verbo introduz uma advertência ou incumbência formal e enfática; “exortou solenemente” conserva seu peso sem reduzi-lo a um simples “disse”. “Então” representa a progressão narrativa do waw consecutivo.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial; neste contexto visionário, “anjo” é a leitura mais natural, enquanto a alternativa lexical é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado pelo nome divino “Yahweh”, em vez de ser substituído por um título.
- source_word: בִּיהוֹשֻׁעַ
  choice: Josué
  rationale: Com o verbo יעד, a preposição ב marca a pessoa a quem se dirige a exortação. Em português, o objeto direto após “exortou” expressa essa relação de modo idiomático.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala direta dos versículos seguintes.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יהוה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto de visão favorece “anjo”, mas o termo hebraico não distingue lexicalmente entre “anjo” e “mensageiro”; a alternativa permanece em nota, sem definir além do texto a identidade da figura.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Exortou solenemente” comunica o caráter formal e enfático do verbo, e os dois-pontos indicam que a fala é apresentada na continuação.
