  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: pt
  text: 'E Yahweh disse ao Acusador[a]: “Que Yahweh repreenda você, ó Acusador! E que Yahweh, aquele que escolheu Jerusalém, repreenda você! Não é este um tição tirado do fogo[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, “Satanás”. O hebraico traz o título “o acusador”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “um pedaço de lenha resgatado do fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַשָּׂטָן
  choice: o Acusador / ó Acusador
  rationale: O substantivo hebraico vem com artigo e, neste contexto judicial, indica uma função ou título. “Acusador” comunica esse sentido; a forma tradicional “Satanás” é indicada em nota.
- source_word: יִגְעַר
  choice: repreenda
  rationale: Expressa uma censura autoritativa e vigorosa e preserva a força da fórmula hebraica repetida.
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: aquele que escolheu Jerusalém
  rationale: A construção identifica Yahweh por sua ação característica. O perfeito em português apresenta a escolha como estabelecida sem perder o valor descritivo do particípio hebraico.
- source_word: הֲלוֹא
  choice: Não é
  rationale: Mantém a pergunta retórica que espera uma resposta afirmativa.
- source_word: אוּד
  choice: tição
  rationale: Designa um pedaço de madeira em combustão ou parcialmente queimado e preserva de modo conciso a imagem do hebraico.
- source_word: מֻצָּל מֵאֵשׁ
  choice: tirado do fogo
  rationale: Reproduz a imagem concreta de algo retirado e salvo do fogo, sem explicitar além do texto quem efetuou o resgate.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser entendido como nome próprio ou título
  choice: O Acusador no texto principal
  alternative: Satanás; o adversário
  rationale: O artigo hebraico e a cena de acusação favorecem a leitura funcional do termo como título. A identificação tradicional com Satanás permanece disponível em nota, sem eliminar a nuance lexical.
- issue: A repetição da fórmula de repreensão pronunciada por Yahweh
  choice: Preservar as duas ocorrências de “que Yahweh repreenda você”
  alternative: Condensar as duas declarações em uma única repreensão
  rationale: A repetição pertence ao hebraico e reforça a autoridade judicial da declaração; suprimi-la reduziria a ênfase do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Conservou-se a repetição enfática do hebraico. O marcador [b] foi colocado junto à metáfora do tição, à qual a nota lexical efetivamente se refere.
