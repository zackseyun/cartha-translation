base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: pt
  text: 'Então ele tomou a palavra e disse aos que estavam diante dele[a]: “Tirem dele as vestes imundas”. Depois, disse a ele: “Veja, removi de você a sua culpa[b] e o vestirei com vestes finas[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os que estavam diante dele provavelmente eram assistentes celestiais, mas o hebraico apenas os descreve dessa forma.
    reason: alternative_reading
  - marker: b
    text: Ou “sua iniquidade”. O termo hebraico pode indicar tanto o mal cometido quanto a culpa decorrente dele.
    reason: lexical_alternative
  - marker: c
    text: Ou “vestes de gala” ou “vestes ricas”. O termo hebraico designa roupas distintas ou imponentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: tomou a palavra e disse
  rationale: Reproduz de modo natural em português a fórmula narrativa hebraica, sem exigir que tenha havido uma pergunta explícita.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: os que estavam diante dele
  rationale: Mantém a descrição do hebraico sem identificar explicitamente essas figuras como anjos ou assistentes celestiais.
- source_word: הַבְּגָדִים הַצֹּאִים
  choice: as vestes imundas
  rationale: “Vestes” conserva o tom digno da cena, enquanto “imundas” comunica a forte ideia de sujeira e impureza de צֹאִים.
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ
  choice: removi de você
  rationale: Expressa em português natural a ação concluída de fazer passar ou retirar algo que estava sobre a pessoa.
- source_word: עֲוֺנֶךָ
  choice: a sua culpa
  rationale: עָוֹן pode designar iniquidade ou culpa; no contexto da remoção simbólica, “culpa” é clara e natural, sem eliminar a alternativa lexical indicada em nota.
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: e o vestirei
  rationale: A construção dá continuidade à declaração do falante; o futuro em português apresenta naturalmente o resultado que acompanha a remoção da culpa.
- source_word: מַחֲלָצוֹת
  choice: vestes finas
  rationale: O termo indica roupas distintas, ricas ou próprias de ocasião solene; “vestes finas” comunica honra e dignidade sem especificar mais do que o hebraico.
theological_decisions:
- issue: Sentido simbólico da troca de vestes
  choice: Manter a ligação textual entre a retirada das vestes imundas e a remoção da culpa
  alternative: Explicar o ato como justificação ou como restauração sacerdotal
  rationale: O versículo associa claramente as duas ações, mas não formula por si só uma categoria doutrinária posterior.
- issue: Identidade dos que estavam diante dele
  choice: Traduzir a expressão de forma descritiva
  alternative: Identificá-los como anjos ou assistentes celestiais
  rationale: O contexto favorece a ideia de seres celestiais, mas a expressão hebraica não os nomeia dessa maneira.
- issue: Amplitude semântica de עָוֹן
  choice: Usar “culpa” no texto e registrar “iniquidade” em nota
  alternative: Usar apenas “iniquidade”
  rationale: A palavra pode referir-se tanto ao mal cometido quanto à culpa decorrente dele; a nota preserva essa amplitude sem tornar o texto principal artificial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tomou a palavra e disse” conserva o sabor da fórmula hebraica sem redundância excessiva; “vestes” sustenta o registro solene da visão.
