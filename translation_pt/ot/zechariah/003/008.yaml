source:
  edition: WLC
  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: pt
  text: Escute agora, Josué, sumo sacerdote, você e seus companheiros que estão sentados diante de você, pois eles são homens que servem de sinal[a]. Pois eis que estou trazendo o meu servo, o Renovo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens-sinal”, “homens de prodígio” ou “homens de presságio”.'
    reason: A expressão hebraica אַנְשֵׁי מוֹפֵת pode descrever homens que são ou representam um sinal, prodígio ou presságio.
  - marker: b
    text: 'Ou: “Broto” ou “Rebento”.'
    reason: O hebraico צֶמַח designa algo que brota e, aqui, parece funcionar como título profético.
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Escute agora
  rationale: O imperativo com נָא introduz um apelo direto e urgente. “Escute agora” é natural no português moderno e mantém a força da convocação.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: sumo sacerdote
  rationale: É a designação portuguesa consagrada para o principal ofício sacerdotal e traduz idiomaticamente a expressão hebraica.
- source_word: וְרֵעֶיךָ
  choice: e seus companheiros
  rationale: רֵעַ pode indicar companheiros ou associados; “companheiros” preserva essa amplitude sem pressupor amizade íntima.
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: que estão sentados diante de você
  rationale: Mantém tanto a postura expressa pelo particípio quanto a ideia de presença ou assistência perante Josué.
- source_word: אַנְשֵׁי מוֹפֵת
  choice: homens que servem de sinal
  rationale: A formulação comunica em português corrente que esses homens têm função simbólica, sem especificar de modo indevido exatamente como o sinal deve ser interpretado.
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva o caráter solene e enfático do anúncio divino em registro profético digno.
- source_word: מֵבִיא
  choice: estou trazendo
  rationale: O particípio com הִנְנִי apresenta a ação como iminente ou certa; a construção progressiva conserva sua vivacidade.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: “Servo” é adequado para alguém comissionado por Deus e evita a especificidade social que “escravo” imporia neste contexto.
- source_word: צֶמַח
  choice: o Renovo
  rationale: O substantivo significa broto ou rebento e, neste contexto profético, funciona como designação titular. “Renovo” preserva a metáfora vegetal e seu uso bíblico tradicional em português.
theological_decisions:
- issue: Se צֶמַח deve ser entendido como título profético ou apenas como substantivo comum
  choice: Traduzido como o título “o Renovo”
  alternative: “o broto”, “um rebento” ou “um ramo”
  rationale: A associação com “meu servo” e o uso profético correlato favorecem uma designação titular da figura vindoura. A tradução não identifica explicitamente essa figura além do que o versículo afirma.
- issue: Quanto explicitar o sentido de אַנְשֵׁי מוֹפֵת
  choice: “homens que servem de sinal”, com alternativa em nota
  alternative: “homens-sinal”, “homens de prodígio” ou “homens de presságio”
  rationale: A expressão hebraica é compacta e simbolicamente aberta. O texto principal comunica sua função sem definir o referente do sinal, enquanto a nota preserva outras nuances lexicais.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o tratamento por “você” coerente com o singular hebraico, o tom solene do anúncio profético e a ambiguidade simbólica mediante notas.
