  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה שַׁ֤בְתִּי לִ/ירוּשָׁלִַ֨ם֙ בְּֽ/רַחֲמִ֔ים בֵּיתִ/י֙ יִבָּ֣נֶה בָּ֔/הּ נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת ו/קוה יִנָּטֶ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: pt
  text: 'Por isso, assim diz o SENHOR: Voltei para Jerusalém com compaixão. Minha casa será construída nela, declara o SENHOR dos Exércitos, e sobre Jerusalém será estendida a linha de medir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְתִּי
  choice: Voltei
  rationale: Preserva o perfeito hebraico e o sentido de retorno do favor e da presença do SENHOR a Jerusalém.
- source_word: בְּרַחֲמִים
  choice: com compaixão
  rationale: Expressa de modo natural o plural hebraico de misericórdias, cujo sentido contextual é profunda compaixão.
- source_word: בֵּיתִי
  choice: o meu templo
  rationale: Embora literalmente seja “minha casa”, no contexto de Zacarias a referência é ao templo; “templo” comunica isso com clareza ao leitor moderno.
- source_word: קוה
  choice: a linha de medir
  rationale: O termo designa aqui o cordel ou linha usado para medição em obras, imagem ligada à reconstrução de Jerusalém.
- source_word: יְהוָה צְבָאוֹת
  choice: o SENHOR dos Exércitos
  rationale: Mantém a convenção portuguesa para o nome divino e traduz o título צְבָאוֹת de forma tradicional, clara e reconhecível.
theological_decisions:
- issue: Aspecto do verbo “voltar”
  choice: Voltei
  alternative: Voltarei
  rationale: O texto massorético apresenta um perfeito na primeira pessoa; a tradução preserva a declaração como ação realizada, sem convertê-la em promessa futura.
- issue: Referente pronominal de בָּהּ
  choice: Nela
  alternative: ali
  rationale: O sufixo feminino retoma Jerusalém; “nela” preserva a personificação e a referência gramatical sem resolver desnecessariamente a tensão entre cidade e local.
- issue: Sentido da linha estendida sobre Jerusalém
  choice: tradução literal da imagem
  alternative: explicitar “para reconstruí-la”
  rationale: A formulação mantém a imagem profética de medição e não restringe seu alcance teológico a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem perder o paralelismo profético nem a declaração solene.
