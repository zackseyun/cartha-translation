    issue: Redação inadequada da nota de rodapé
    rationale: «Das quais estás indignado» não expressa em português a relação de indignação dirigida a Jerusalém e às cidades; «indignado com» ou «contra» é necessário.
  - severity: low
    issue: Formulação temporal pouco natural
    rationale: «Há estes setenta anos» é compreensível, mas menos corrente que «há setenta anos» no português moderno. O demonstrativo hebraico não precisa ser reproduzido de forma rígida.
