  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: pt
  text: 'Então o anjo de Yahweh respondeu: “Ó Yahweh dos Exércitos, até quando não terás compaixão de Jerusalém e das cidades de Judá, contra as quais estás indignado há setenta anos?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as quais estás indignado há setenta anos”.'
    reason: A relação do objeto de זעם pode ser expressa em português por «contra» ou «com», sem alterar o sentido de indignação persistente.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; no contexto de uma visão profética, “anjo” é a opção mais natural, sem definir além do texto a identidade da figura.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: A combinação hebraica introduz uma resposta verbal. Em português, “respondeu” comunica naturalmente a expressão sem reproduzir o redundante “respondeu e disse”.
- source_word: יְהוָה צְבָאוֹת
  choice: Ó Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo semanticamente claro; “Ó” marca o vocativo da súplica.
- source_word: עַד מָתַי
  choice: até quando
  rationale: Expressão portuguesa corrente para a fórmula temporal hebraica de lamento e intercessão.
- source_word: לֹא תְרַחֵם
  choice: não terás compaixão
  rationale: Mantém a forma negativa e o sentido de רחם, com linguagem natural, digna e acessível.
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: contra as quais estás indignado
  rationale: זעם exprime indignação ou ira. A construção portuguesa explicita adequadamente a relação com Jerusalém e as cidades de Judá, sem enfraquecer a força do termo.
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: há estes setenta anos
  rationale: Expressa a duração que se estende até o presente da fala e conserva, por meio de “estes”, a nuance dêitica de זֶה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome da aliança. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução preserva a designação textual e não identifica essa figura com qualquer pessoa teológica específica além do que o versículo afirma.
- issue: Alcance do antecedente de אֲשֶׁר
  choice: Jerusalém e as cidades de Judá
  alternative: somente as cidades de Judá
  rationale: Embora o relativo concorde formalmente com o plural mais próximo, a indignação de setenta anos pode abranger naturalmente os dois elementos coordenados. A formulação conserva essa leitura contextual sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se a duplicação semítica “respondeu e disse”, pouco natural em português, mas conservaram-se o vocativo solene, a pergunta de intercessão e a força da indignação divina.
