lexical_decisions:
- source_word: קָצַף ... קָצֶף
  choice: ficou muito irado
  rationale: O verbo e o substantivo cognato formam uma construção enfática, literalmente algo como “irou-se com ira”. A expressão “ficou muito irado” transmite essa intensidade em português natural sem reproduzir uma repetição rígida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל
  choice: com
  rationale: Com um termo de ira, a preposição indica o alvo da indignação. Em português, “irado com” expressa naturalmente essa relação.
- source_word: אֲבֹתֵיכֶם
  choice: os pais de vocês
  rationale: Preserva no texto principal a forma concreta do hebraico, “seus pais”, enquanto o contexto indica as gerações anteriores; a alternativa contextual “antepassados” é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: A tradução conserva uma transliteração explícita do nome divino, sem substituí-lo por “SENHOR”. “Javé” é uma forma portuguesa possível, mas “Yahweh” mantém a política nominal indicada no material de consulta.
translation_notes:
  register: Português moderno, digno e acessível, com construção de boa legibilidade brasileira. “Pais de vocês” mantém a forma do hebraico, e a nota esclarece seu alcance ancestral.
