translation:
  language: pt
  text: Yahweh ficou muito irado com os pais de vocês[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os antepassados de vocês” (literalmente, “os pais de vocês”).
