language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: pt
  text: 'Portanto, diga-lhes: “Assim diz Yahweh dos Exércitos: ‘Voltem para mim’, declara Yahweh dos Exércitos, ‘e eu voltarei para vocês’, diz Yahweh dos Exércitos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Voltem-se para mim [...] e eu me voltarei para vocês”. O hebraico emprega o mesmo verbo nas duas orações, ressaltando a restauração recíproca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Portanto, diga-lhes
  rationale: O waw liga a ordem à declaração anterior sobre a ira divina; “portanto” explicita naturalmente essa consequência. אֲלֵהֶם indica os destinatários no plural.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem formal, corrente e reconhecível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, “Exércitos” comunica de modo claro a ideia de hostes sob o domínio de Yahweh; a inicial maiúscula marca sua função no título.
- source_word: שׁוּבוּ אֵלַי
  choice: Voltem para mim
  rationale: שׁוב abrange voltar e retornar, com implicações relacionais e de arrependimento. “Voltem” é natural em português e permite conservar a repetição verbal da oração seguinte.
- source_word: נְאֻם
  choice: declara
  rationale: Expressa de forma idiomática o pronunciamento divino autorizado e o distingue do אָמַר final.
- source_word: וְאָשׁוּב אֲלֵיכֶם
  choice: e eu voltarei para vocês
  rationale: Repete “voltar”, como o hebraico repete שׁוב, preservando a reciprocidade da restauração. “Vocês” oferece legibilidade brasileira sem perder a compreensão internacional.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: diz Yahweh dos Exércitos
  rationale: Mantém o sentido simples de אָמַר e evita apagar a distinção em relação a נְאֻם, traduzido antes por “declara”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Linguagem de arrependimento e aliança em שׁוב
  choice: Voltem para mim ... e eu voltarei para vocês
  alternative: Convertam-se a mim ... e eu me voltarei para vocês
  rationale: A escolha conserva o mesmo verbo nos dois membros e, assim, a reciprocidade deliberada do hebraico. Evita tornar explícita apenas uma dimensão teológica de um verbo semanticamente mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A cadência formal da fórmula profética foi preservada; “vocês” evita formas regionais ou arcaizantes. O marcador [a] aparece no texto e remete à alternativa lexical sem resolver indevidamente a amplitude de שׁוב.
