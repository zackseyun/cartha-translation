- from: 'No vigésimo quarto dia do décimo primeiro mês — isto é, o mês de sebate[a] —, no segundo ano de Dario, a palavra de Yahweh veio a Zacarias, filho de Berequias, filho de Ido, o profeta[b], dizendo:'
  to: 'No vigésimo quarto dia do décimo primeiro mês (isto é, o mês de Sebate), no segundo ano de Dario, a palavra de Yahweh veio a Zacarias, filho de Berequias, filho de Ido, o profeta[b], dizendo:'
