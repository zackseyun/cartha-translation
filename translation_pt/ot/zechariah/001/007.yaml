  text: בְּ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לְ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֨דֶשׁ֙ הוּא חֹ֣דֶשׁ שְׁבָ֔ט בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔הוּ בֶּן עִדּ֥וֹא הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: pt
  text: 'No vigésimo quarto dia do décimo primeiro mês (isto é, o mês de Sebate), no segundo ano de Dario, a palavra de Yahweh veio a Zacarias, filho de Berequias, filho de Ido, o profeta[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A expressão «o profeta» provavelmente se refere a Ido; também pode ser entendida como uma identificação de Zacarias.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: No vigésimo quarto dia
  rationale: A fórmula hebraica de data usa um número cardinal, mas o português emprega naturalmente o ordinal neste contexto.
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: do décimo primeiro mês
  rationale: Reproduz com clareza e naturalidade a indicação calendárica hebraica.
- source_word: הוּא חֹדֶשׁ שְׁבָט
  choice: isto é, o mês de sebate
  rationale: הוּא introduz aqui a identificação explicativa do mês numerado; os travessões preservam essa função parentética.
- source_word: שְׁבָט
  choice: sebate
  rationale: Forma tradicional e legível em português para o nome hebraico do mês; a transliteração mais estrita é informada em nota.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: no segundo ano de Dario
  rationale: Equivalente português corrente da fórmula de ano de reinado.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Na fórmula profética, הָיָה com דְבַר יְהוָה expressa a chegada de uma revelação; 'veio' é idiomático sem apagar a construção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: Zacarias, filho de Berequias, filho de Ido
  rationale: Mantém a cadeia genealógica e emprega as formas portuguesas consagradas dos nomes.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Conserva o artigo definido hebraico e, com a nota, não elimina a possível ambiguidade de ligação.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da revelação, a ser apresentado nos versículos seguintes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração preserva essa distinção em relação ao título אֲדֹנָי.
- issue: Referente do título הַנָּבִיא
  choice: 'Manter a sequência potencialmente ambígua: ''filho de Ido, o profeta'''
  alternative: Explicitar que Ido era o profeta ou que Zacarias era o profeta
  rationale: A posição de הַנָּבִיא favorece sua ligação com Ido, mas a cadeia genealógica permite discussão; a tradução e a nota preservam a tensão sintática sem impor uma identificação.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas tradicionais de ampla compreensão. Os travessões destacam a explicação calendárica sem tornar a frase excessivamente pesada. A ordem genealógica foi mantida para preservar a ambiguidade real do hebraico.
