  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: pt
  text: 'Proclame novamente, dizendo: “Assim diz Yahweh dos Exércitos: As minhas cidades voltarão a transbordar de prosperidade[a]; Yahweh voltará a consolar Sião e voltará a escolher Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltarão a se expandir por causa da prosperidade” ou “voltarão a estar repletas de coisas boas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: novamente / voltar a
  rationale: O advérbio recorrente indica renovação depois do juízo. “Novamente” funciona com a ordem de proclamar, enquanto “voltar a” expressa com naturalidade em português a repetição das bênçãos e ações divinas.
- source_word: קְרָא
  choice: Proclame
  rationale: O imperativo pede um anúncio público e audível. “Proclame” preserva a força do chamado sem soar arcaico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém de modo claro o infinitivo quotativo hebraico que introduz a mensagem.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética convencional e seu tom solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, comunica as forças sob o comando de Yahweh e corresponde ao uso bíblico consolidado em português.
- source_word: תְּפוּצֶינָה
  choice: voltarão a transbordar
  rationale: No contexto de restauração e em combinação com מִטּוֹב, expressa cidades abundantemente beneficiadas, sem excluir em nota a possibilidade de expansão.
- source_word: עָרַי
  choice: as minhas cidades
  rationale: Preserva o sufixo de primeira pessoa, que identifica as cidades como pertencentes a Yahweh.
- source_word: מִטּוֹב
  choice: de prosperidade
  rationale: Aqui טוֹב aponta para bem-estar, abundância e benefício, não apenas para bondade moral abstrata.
- source_word: וְנִחַם
  choice: voltará a consolar
  rationale: No contexto posterior ao juízo, o verbo descreve consolo e restauração de Sião.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: וּבָחַר
  choice: voltará a escolher
  rationale: Traduz diretamente a escolha renovada de Jerusalém, preservando a linguagem pactual sem impor uma formulação sistemática posterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino em transliteração.
- issue: Sentido da escolha divina de Jerusalém
  choice: voltará a escolher Jerusalém
  alternative: tornará a eleger Jerusalém
  rationale: “Escolher” mantém a afirmação de favor e escolha pactuais sem acrescentar conotações confessionais específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de עוֹד foi mantida por “novamente” e “voltar a”, e a fórmula profética conservou seu caráter solene.
