source:
  edition: WLC
  text: וָ/אֹמַ֖ר מָה אֵ֣לֶּה אֲדֹנִ֑/י וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י אֲנִ֥י אַרְאֶ֖/ךָּ מָה הֵ֥מָּה אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: pt
  text: 'Então perguntei: “O que são estes, meu senhor[a]?” E o anjo que falava comigo[b] me disse: “Eu lhe mostrarei o que são estes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”; o hebraico אֲדֹנִי é aqui uma forma respeitosa de tratamento, não o nome divino.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que falava em mim”; neste contexto visionário, a expressão hebraica significa falar com o profeta ou dirigir-se a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então perguntei
  rationale: O wayyiqtol faz a narrativa avançar, e “então” expressa naturalmente a sequência. Como a fala introduz uma pergunta direta, “perguntei” é idiomático em português e explicita sem distorção a força contextual de אמר.
- source_word: מָה אֵלֶּה
  choice: O que são estes
  rationale: מָה com אֵלֶּה pede a identificação dos seres ou elementos vistos. O demonstrativo substantivado dispensa “coisas” e mantém aberta a identidade do referente.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida aqui à figura intérprete, não o nome divino. “Meu senhor” preserva o tom elevado e a ligação lexical com אדון.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מלאך também possa significar “mensageiro”, o contexto visionário apresenta um intérprete celestial; “anjo” é claro e natural nesse contexto.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: A construção com בִּי, literalmente “em mim”, funciona neste contexto de Zacarias como expressão da comunicação do anjo com o profeta. “Comigo” transmite o sentido relacional sem sugerir indevidamente fala interior.
- source_word: אֲנִי אַרְאֶךָּ
  choice: Eu lhe mostrarei
  rationale: O hifil de ראה significa “fazer ver, mostrar”. O pronome explícito אֲנִי recebe representação natural por “Eu”, e “lhe” evita marcar gênero não exigido pelo hebraico.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: o que são estes
  rationale: A formulação retoma a pergunta do profeta; o português natural não precisa reproduzir de modo rígido o pronome enfático הֵמָּה, mas conserva o demonstrativo e a identificação ainda em aberto.
theological_decisions:
- issue: Referente e força de אֲדֹנִי
  choice: Forma respeitosa de tratamento, “meu senhor”, dirigida ao anjo intérprete.
  alternative: “senhor” ou “meu mestre”; entendimento como título divino.
  rationale: O diálogo imediato identifica como interlocutor o anjo que fala com o profeta. A tradução preserva a deferência sem identificar essa figura com YHWH além do que o texto afirma.
- issue: Sentido de בִּי em הַדֹּבֵר בִּי
  choice: 'Sentido relacional idiomático: “que falava comigo”.'
  alternative: Tradução formal “que falava em mim”.
  rationale: A tradução literal poderia sugerir inspiração ou locução interior, enquanto o contexto visionário descreve a interação comunicativa entre o anjo intérprete e o profeta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom respeitoso da visão e evita tanto literalismo enganoso quanto identificação teológica excessiva do anjo.
