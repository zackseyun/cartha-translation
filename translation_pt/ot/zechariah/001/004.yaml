language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּהְי֣וּ כַ/אֲבֹֽתֵי/כֶ֡ם אֲשֶׁ֣ר קָרְאֽוּ אֲלֵי/הֶם֩ הַ/נְּבִיאִ֨ים הָ/רִֽאשֹׁנִ֜ים לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֤וּבוּ נָא֙ מִ/דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים ו/מעלילי/כם הָֽ/רָעִ֑ים וְ/לֹ֥א שָׁמְע֛וּ וְ/לֹֽא הִקְשִׁ֥יבוּ אֵלַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: pt
  text: 'Não sejam como os seus pais[a], aos quais os profetas anteriores proclamaram: “Assim diz Yahweh dos Exércitos: Voltem-se, por favor, dos seus maus caminhos e das suas más ações.” Mas eles não ouviram nem me deram atenção — declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassados”. O hebraico diz literalmente “pais” e se refere às gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Não sejam
  rationale: A construção com אַל e o imperfeito de היה expressa proibição; “não sejam” é a forma natural em português para advertir contra a imitação das gerações anteriores.
- source_word: כַאֲבֹתֵיכֶם
  choice: como os seus pais
  rationale: אָבוֹת significa literalmente “pais” e aqui representa as gerações anteriores; a formulação preserva a expressão hebraica, com nota explicativa sobre o sentido amplo.
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: aos quais ... proclamaram
  rationale: קרא pode significar chamar, clamar ou proclamar. Como introduz uma mensagem profética em discurso direto, “proclamaram” transmite adequadamente o anúncio formal.
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: os primeiros profetas
  rationale: הָרִאשֹׁנִים indica profetas de um período anterior. “Primeiros” conserva a relação temporal sem tratar a expressão como título técnico de uma divisão canônica.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Assim diz Yahweh dos Exércitos
  rationale: Mantém a fórmula profética solene; “Yahweh” representa diretamente o nome divino, e “dos Exércitos” preserva a imagem ampla de צְבָאוֹת.
- source_word: שׁוּבוּ נָא
  choice: Por favor, voltem
  rationale: שוב expressa retorno ou mudança de rumo, inclusive moral, enquanto נָא acrescenta apelo ou súplica; “por favor” evita interpretá-lo como indicação temporal.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: dos seus maus caminhos
  rationale: דֶּרֶךְ pode representar o modo de viver ou a conduta; “caminhos” conserva a metáfora hebraica corrente.
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  choice: e das suas más ações
  rationale: מַעֲלָלִים denota atos, obras ou práticas. “Ações” é claro e atual, além de evitar repetição pouco natural com “caminhos”.
- source_word: וְלֹא שָׁמְעוּ
  choice: Mas eles não me ouviram
  rationale: שמע pode abranger ouvir, escutar e obedecer. “Ouviram” preserva essa amplitude sem resolver o termo exclusivamente como desobediência; o objeto “me” é compartilhado naturalmente com os dois verbos em português.
- source_word: וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: nem prestaram atenção em mim
  rationale: הקשיב descreve atenção cuidadosa ou disposição para dar ouvidos; a tradução diferencia o verbo de שמע e mantém o objeto pessoal אֵלַי.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula profética de confirmação; “declara Yahweh” conserva seu caráter solene e a distingue da fórmula introdutória.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de אָבוֹת
  choice: pais, com nota explicativa
  alternative: antepassados; ancestrais
  rationale: O substantivo hebraico é masculino plural e literalmente significa “pais”, mas neste contexto abrange gerações anteriores. O texto conserva a forma concreta e a nota esclarece sua extensão.
- issue: Força de שמע
  choice: ouvir
  alternative: obedecer
  rationale: Embora o verbo possa implicar obediência, sua coordenação com הקשיב favorece preservar no texto a linguagem de ouvir e prestar atenção, sem explicitar além do necessário o resultado ético.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula profética foi preservada, e a súplica de נָא aparece como “por favor” para manter sua força de apelo.
