revisions:
- from: 'Não sejam como os seus pais[a], aos quais os primeiros profetas proclamaram: “Assim diz Yahweh dos Exércitos: ‘Por favor, voltem dos seus maus caminhos e das suas más ações’”. Mas eles não me ouviram nem prestaram atenção em mim — declara Yahweh.'
  to: 'Não sejam como os seus pais[a], aos quais os profetas anteriores proclamaram: “Assim diz Yahweh dos Exércitos: Voltem-se, por favor, dos seus maus caminhos e das suas más ações.” Mas eles não ouviram nem me deram atenção — declara Yahweh.'
  rationale: A revisão substitui «primeiros profetas» por «profetas anteriores», esclarecendo o contraste temporal expresso no hebraico sem transformá-lo em título técnico. Ajusta também o escopo do complemento pessoal na oração final e a pontuação das citações. O restante da tradução e a nota lexical são mantidos.
