  text: וַ/יַּ֗עַן הָ/אִ֛ישׁ הָ/עֹמֵ֥ד בֵּין הַ/הַדַסִּ֖ים וַ/יֹּאמַ֑ר אֵ֚לֶּה אֲשֶׁ֣ר שָׁלַ֣ח יְהוָ֔ה לְ/הִתְהַלֵּ֖ךְ בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/010.yaml
  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: pt
  text: 'Então o homem que estava de pé entre as murtas respondeu: “Estes são os que Yahweh enviou para percorrer[a] a terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “patrulhar” ou “andar por”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o país” ou “a região”, conforme o alcance seja mundial ou mais localizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: A combinação hebraica literalmente diz “respondeu e disse”, fórmula narrativa que em português atual se expressa naturalmente por “respondeu”, sem perda do sentido discursivo.
- source_word: הָאִישׁ הָעֹמֵד
  choice: o homem que estava
  rationale: אִישׁ designa aqui uma figura masculina específica, e o particípio עֹמֵד indica sua posição contínua na cena da visão.
- source_word: בֵּין הַהַדַסִּים
  choice: entre as murtas
  rationale: הֲדַסִּים são murtas; “entre” reproduz de perto a preposição hebraica e é natural para alguém situado no meio desse conjunto de plantas.
- source_word: אֵלֶּה אֲשֶׁר
  choice: Estes são os que
  rationale: O demonstrativo aponta para as figuras mencionadas no contexto, e a construção portuguesa torna explícita a referência pessoal implícita.
- source_word: שָׁלַח
  choice: enviou
  rationale: O perfeito hebraico apresenta o envio como ação concluída; o pretérito perfeito é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהִתְהַלֵּךְ
  choice: para percorrer
  rationale: O hitpael de הלך comunica deslocamento de um lado para outro ou por uma extensão. “Percorrer” conserva essa ideia sem impor necessariamente a nuance militar de patrulhamento.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode indicar a terra em sentido amplo ou uma região/país. “A terra” mantém em português alguma flexibilidade sem decidir de modo absoluto a extensão geográfica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente pelo título “SENHOR”.
- issue: Extensão de בָּאָרֶץ
  choice: a terra
  alternative: o país; a região
  rationale: A visão pode ter alcance mundial, mas o substantivo hebraico também admite referência mais localizada. A tradução principal conserva a leitura ampla, enquanto a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita o pouco natural “respondeu e disse”, conserva o nome Yahweh e registra em notas as ambiguidades de movimento e extensão geográfica.
