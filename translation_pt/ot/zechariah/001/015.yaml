source:
  edition: WLC
  text: וְ/קֶ֤צֶף גָּדוֹל֙ אֲנִ֣י קֹצֵ֔ף עַל הַ/גּוֹיִ֖ם הַ/שַּֽׁאֲנַנִּ֑ים אֲשֶׁ֤ר אֲנִי֙ קָצַ֣פְתִּי מְּעָ֔ט וְ/הֵ֖מָּה עָזְר֥וּ לְ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: pt
  text: E estou muito irado contra as nações que vivem tranquilas[a], pois eu estava apenas um pouco irado[b], mas elas agravaram a calamidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “complacentes” ou “que se sentem seguras”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu estava irado por pouco tempo”; o hebraico pode indicar duração limitada, embora o contraste favoreça aqui a ideia de ira limitada em grau.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “ajudaram para o mal”, isto é, contribuíram para intensificar a calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל אֲנִי קֹצֵף
  choice: E estou tomado de grande ira
  rationale: Reproduz a construção enfática com o substantivo קֶצֶף e o particípio קֹצֵף, preservando tanto a intensidade de גָּדוֹל quanto o estado presente e contínuo expresso pelo particípio.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros envolvidos na opressão de Judá; evita a conotação posterior e mais específica de “gentios”.
- source_word: הַשַּׁאֲנַנִּים
  choice: que vivem tranquilas
  rationale: Comunica o estado de segurança e despreocupação sugerido pelo adjetivo, sem impor necessariamente o juízo psicológico mais explícito de “complacentes”.
- source_word: אֲשֶׁר
  choice: pois
  rationale: Embora seja formalmente um relativo, neste contexto introduz a explicação da ira divina; “pois” expressa com naturalidade essa força causal.
- source_word: קָצַפְתִּי מְּעָט
  choice: eu estava apenas um pouco irado
  rationale: Toma מְעָט primariamente como limitação de grau, leitura favorecida pelo contraste com a atuação excessiva das nações, sem excluir em nota a possível referência à duração.
- source_word: וְהֵמָּה
  choice: mas elas
  rationale: 'O pronome é enfático, e o contexto dá à conjunção valor adversativo: a ira divina foi limitada, mas as nações foram além.'
- source_word: עָזְרוּ לְרָעָה
  choice: agravaram a calamidade
  rationale: Traduz idiomaticamente “ajudaram para o mal”, indicando que as nações contribuíram para intensificar o dano, sem sugerir que a calamidade fosse uma pessoa auxiliada.
theological_decisions:
- issue: Relação entre a ira divina e a responsabilidade das nações
  choice: O texto contrasta a ira limitada de Deus com a intensificação da calamidade pelas nações.
  alternative: As nações apenas executaram o juízo divino sem ultrapassá-lo.
  rationale: A estrutura contrastiva entre מְעָט e וְהֵמָּה עָזְרוּ לְרָעָה atribui responsabilidade às nações por terem agravado o mal, ao mesmo tempo que mantém explícita a ira de Deus contra seu povo.
- issue: Sentido de מְעָט
  choice: 'Limitação de grau: “apenas um pouco irado”.'
  alternative: 'Limitação de duração: “irado por pouco tempo”.'
  rationale: A leitura de grau oferece o contraste mais direto com a ação agravante das nações, mas a forma hebraica permite a leitura temporal, que é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Tomado de grande ira” conserva a força da construção hebraica sem soar arcaico; “vivem tranquilas” mantém a imagem, enquanto a nota registra alternativas mais interpretativas.
