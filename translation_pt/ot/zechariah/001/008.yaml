    issue: A sequência «estava montado em um cavalo vermelho» / «Ele estava parado» sugere em português que o homem estava parado enquanto montado.
    rationale: O texto hebraico descreve um homem como cavaleiro e, em seguida, como estando de pé entre as murtas. A tradução deve conservar ambos os dados sem criar uma contradição física desnecessária.
  - severity: low
    issue: «Murteiras» é menos natural e menos amplamente usual do que «murtas» para הֲדַסִּים.
    rationale: «Murtas» é o nome comum mais direto da planta em português contemporâneo e corresponde bem ao plural hebraico.
  - severity: low
    issue: «que havia na baixada» pode deixar a concordância com «murteiras» menos nítida.
    rationale: «que estavam na baixada» é claro, natural e preserva a localização das murtas.
