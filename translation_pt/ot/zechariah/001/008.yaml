  source_fidelity: 'A tradução preserva adequadamente a estrutura e os principais termos do hebraico: visão noturna, homem, cavalo vermelho, posição entre as murtas, lugar baixo e os três grupos de cavalos. Contudo, «estava montado» seguido de «estava parado» soa contraditório em português, embora o hebraico apresente o cavaleiro e depois o homem de pé. Uma redação que mantenha as duas ações sem sugerir simultaneidade resolve isso com maior fidelidade comunicativa.'
  naturalness: O registro é geralmente claro e moderno. «Murtas» é a designação mais corrente e amplamente reconhecível para הֲדַסִּים; «murteiras» é menos usual neste sentido. «Que estavam na baixada» também concorda de modo inequívoco com o plural «murtas».
  terminology: «Um homem», «cavalo vermelho», «baixada» e as cores dos cavalos são escolhas aceitáveis. Para o raro שְׂרֻקִּים, «castanho-avermelhados» é uma opção prudente, desde que a nota mantenha a incerteza lexical. Não se deve identificar o homem teologicamente neste versículo.
  issues:
