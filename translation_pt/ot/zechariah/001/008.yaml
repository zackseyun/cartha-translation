revisions:
- from: Durante a noite, vi — e eis que um homem estava montado em um cavalo vermelho! Ele estava parado entre as murteiras que havia na baixada[a], e atrás dele havia cavalos vermelhos, castanho-avermelhados[b] e brancos.
  to: Durante a noite, vi — e eis que um homem montava um cavalo vermelho! Ele estava em pé entre as murtas que estavam na baixada[a], e atrás dele havia cavalos vermelhos, castanho-avermelhados[b] e brancos.
  rationale: A revisão substitui a formulação potencialmente contraditória por «montava» e «estava em pé», conservando a apresentação hebraica do homem como cavaleiro e depois em pé. Também emprega «murtas», termo mais natural, e explicita a concordância locativa. As notas e seus marcadores permanecem nos pontos lexicais pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:26Z'
review_pass:
