base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: pt
  text: Durante a noite, vi — e eis que um homem montava um cavalo vermelho! Ele estava em pé entre as murtas que estavam na baixada[a], e atrás dele havia cavalos vermelhos, castanho-avermelhados[b] e brancos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num lugar profundo”, “nas profundezas” ou “num vale”. O hebraico parece indicar um lugar baixo ou uma depressão do terreno.
    reason: lexical_alternative
  - marker: b
    text: Ou “malhados”, “salpicados” ou talvez outra tonalidade de pelagem avermelhada. O termo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  choice: Durante a noite, vi
  rationale: רָאִיתִי é o qal perfeito na primeira pessoa singular de ראה, “vi”, sem que seja necessário explicitar “tive uma visão”. הַלַּיְלָה estabelece o cenário noturno; a ordem foi ajustada para soar natural em português.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a função de הִנֵּה como marcador que chama a atenção e confere vivacidade à cena.
- source_word: אִישׁ
  choice: um homem
  rationale: Traduz diretamente o substantivo masculino comum, sem antecipar a identidade da figura.
- source_word: רֹכֵב עַל סוּס אָדֹם
  choice: estava montado em um cavalo vermelho
  rationale: O particípio רֹכֵב com עַל descreve alguém montado; “estava montado” apresenta com clareza a cena em andamento.
- source_word: וְהוּא עֹמֵד
  choice: Ele estava parado
  rationale: O pronome com o particípio descreve a posição contínua da figura. “Estava parado” preserva o sentido de permanecer ou estar estacionado no local.
- source_word: בֵּין הַהֲדַסִּים
  choice: entre as murteiras
  rationale: הֲדַסִּים são murtas; “murteiras” é uma designação portuguesa clara para esses arbustos ou pequenas árvores.
- source_word: בַּמְּצֻלָה
  choice: na baixada
  rationale: O termo denota profundidade ou lugar baixo. “Baixada” oferece uma expressão topográfica natural, enquanto a incerteza exata é mantida em nota.
- source_word: וְאַחֲרָיו
  choice: e atrás dele
  rationale: No contexto espacial da cena, אַחֲרָיו indica a posição dos demais cavalos atrás da figura principal.
- source_word: סוּסִים אֲדֻמִּים שְׂרֻקִּים וּלְבָנִים
  choice: cavalos vermelhos, castanho-avermelhados e brancos
  rationale: אֲדֻמִּים e לְבָנִים são respectivamente “vermelhos” e “brancos”. שְׂרֻקִּים é um termo raro e incerto para a pelagem; “castanho-avermelhados” fornece uma leitura plausível sem ocultar alternativas.
theological_decisions:
- issue: Identidade do homem montado no cavalo vermelho
  choice: Traduzir apenas como “um homem”
  alternative: Identificá-lo como o anjo do SENHOR, um cavaleiro simbólico ou uma manifestação pré-encarnada de Cristo
  rationale: Neste versículo, o hebraico apresenta a figura somente como אִישׁ, “um homem”. A tradução não deve antecipar identificações propostas com base no contexto posterior ou em sistemas interpretativos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E eis que” conserva deliberadamente a vivacidade do marcador hebraico, enquanto “baixada” e “murteiras” mantêm a cena concreta e acessível. Os marcadores [a] e [b] aparecem no texto nos pontos lexicais correspondentes.
