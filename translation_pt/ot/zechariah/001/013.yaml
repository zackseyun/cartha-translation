  text: וַ/יַּ֣עַן יְהוָ֗ה אֶת הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י דְּבָרִ֣ים טוֹבִ֑ים דְּבָרִ֖ים נִחֻמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/013.yaml
  text: And Yahweh answered the angel who was speaking with me with good words[b][a], comforting words.
translation:
  language: pt
  text: E Yahweh respondeu ao anjo que falava comigo[a] com palavras boas, palavras de consolo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o anjo intérprete que dialogava com Zacarias durante a visão.
    reason: cultural_note
  - marker: b
    text: 'Ou: «palavras boas, palavras reconfortantes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: No contexto narrativo, ענה indica uma resposta; «respondeu» conserva naturalmente o caráter dialogal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Embora מַלְאָךְ também possa significar «mensageiro», o contexto visionário aponta para um ser celestial.
- source_word: הַדֹּבֵר בִּי
  choice: que falava comigo
  rationale: O particípio sugere uma interação em curso, e a expressão identifica o anjo que dialoga com o profeta.
- source_word: דְּבָרִים טוֹבִים
  choice: palavras boas
  rationale: Mantém a formulação ampla e concreta do hebraico, sem restringi-la a «favoráveis» ou «bondosas».
- source_word: דְּבָרִים נִחֻמִים
  choice: palavras de consolo
  rationale: Expressa o valor consolador de נִחֻמִים e preserva a repetição enfática de «palavras».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a repetição do hebraico foram preservadas quando naturais; «palavras de consolo» evita uma construção pesada e mantém o paralelismo.
