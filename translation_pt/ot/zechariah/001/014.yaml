  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: pt
  text: 'Então o anjo que falava comigo me disse: “Proclame: ‘Assim diz Yahweh dos Exércitos: Tenho um ciúme muito grande de Jerusalém e de Sião[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho zelo por Jerusalém e por Sião, um zelo muito grande.” O hebraico emprega duas formas da mesma raiz para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: o anjo que falava comigo
  rationale: A expressão דֹּבֵר בִּי é idiomática e, neste contexto de Zacarias, indica que o anjo se comunicava com o profeta. O imperfeito português expressa naturalmente a ação em curso do particípio hebraico.
- source_word: קְרָא לֵאמֹר
  choice: Proclame
  rationale: Em contexto profético, קרא denota anúncio público. O verbo “proclamar” conserva a força de arauto, enquanto a fórmula auxiliar לֵאמֹר é representada naturalmente pelos dois-pontos que introduzem a mensagem.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética tradicional e seu registro solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa explicitamente o nome divino, e “dos Exércitos” preserva a imagem militar e cósmica de צְבָאוֹת sem substituí-la pela interpretação “Todo-Poderoso”.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: Tenho um ciúme muito grande
  rationale: A construção conserva a linguagem de ciúme aplicada a Deus e comunica a forte intensificação produzida no hebraico pela repetição da mesma raiz, sem soar artificial em português.
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: de Jerusalém e de Sião
  rationale: A repetição de “de” dá destaque a cada nome e corresponde ao uso repetido da preposição hebraica, enquanto a regência portuguesa natural de “ciúme” pede “de”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituir o nome por um título.
- issue: Sentido de קנא / קנאה quando aplicado a Deus
  choice: ciúme / ciúme muito grande
  alternative: zelo / grande zelo
  rationale: “Ciúme” mantém a tensão lexical e teológica da linguagem hebraica de compromisso exclusivo, em vez de suavizá-la silenciosamente para “zelo”. A nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A fórmula profética mantém dignidade tradicional; “Proclame” evita o pouco natural “clame, dizendo”, e a construção direta conserva a intensidade e a tensão do original.
