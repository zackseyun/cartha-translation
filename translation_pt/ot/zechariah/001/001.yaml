id: ZEC.1.1
reference: Zechariah 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: pt
  text: 'No oitavo mês, no segundo ano de Dario, a palavra de Yahweh[a] veio a Zacarias, filho de Berequias, filho de Ido, o profeta, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH.
    reason: Esclarece que “Yahweh” representa o Tetragrama presente no texto hebraico.
lexical_decisions:
- source_word: בַּ/חֹדֶשׁ הַ/שְּׁמִינִי
  choice: No oitavo mês
  rationale: Reproduz de modo natural em português a fórmula hebraica de datação sem acrescentar o nome do mês, que o texto não fornece.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: no segundo ano de Dario
  rationale: É a forma portuguesa corrente para indicar um ano de reinado e preserva a estrutura cronológica do hebraico.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Na fórmula profética, היה com דְבַר יְהוָה indica que a revelação divina foi dirigida ao profeta; “veio” é natural e fiel nesse contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título, em conformidade com a evidência hebraica e a política indicada.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: filho de Berequias, filho de Ido
  rationale: Mantém a repetição genealógica do hebraico e usa as formas portuguesas correntes dos nomes.
- source_word: הַ/נָּבִיא
  choice: o profeta
  rationale: Equivalente direto do substantivo definido; sua posição após a cadeia genealógica conserva a associação sintática do original sem explicação interpretativa adicional.
- source_word: לֵ/אמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz a fala divina seguinte; os dois-pontos são a pontuação natural em português para sinalizar sua continuação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e acompanha a decisão textual fornecida, sem substituí-lo pelo título “SENHOR”.
- issue: Referente de “o profeta”
  choice: Manter a aposição após “Ido”
  alternative: Explicitar “Zacarias, o profeta” ou “Ido, o profeta” por meio de reestruturação
  rationale: A ordem hebraica coloca הַנָּבִיא depois de Ido. A tradução conserva essa ordem e evita deslocar o título para Zacarias, o que resolveria silenciosamente a relação sintática.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas nominais correntes no Brasil e compreensão internacional. A sintaxe conserva o caráter solene da abertura profética sem recorrer a arcaísmos.
