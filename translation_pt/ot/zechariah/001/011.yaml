  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: pt
  text: 'Eles responderam ao anjo de Yahweh, que estava de pé entre as murtas, e disseram: “Percorremos a terra[a], e eis que toda a terra está em repouso e tranquila[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Andamos de um lado para outro pela terra”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “está sentada e tranquila”; também pode ser entendido como “permanece estabelecida e tranquila”.
    reason: hebrew_idiom
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: O verbo ענה, neste diálogo narrativo, indica responder a quem os havia enviado ou interrogado.
- source_word: מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  rationale: מַלְאָךְ pode significar mensageiro ou anjo; no contexto visionário, “anjo” é a forma mais natural, sem determinar além do texto a identidade da figura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, distinguindo-o de títulos como “Senhor”.
- source_word: הָעֹמֵד
  choice: que estava de pé
  rationale: O particípio retrata a posição contínua do anjo na cena.
- source_word: בֵּין הַהֲדַסִּים
  choice: entre as murtas
  rationale: בֵּין significa “entre”, e הֲדַסִּים designa murtas; a formulação é clara e conserva a imagem da visão.
- source_word: הִתְהַלַּכְנוּ
  choice: percorremos
  rationale: O hitpael de הלך indica deslocamento por uma área, possivelmente de um lado para outro. “Percorremos” é natural e não acrescenta explicitamente a finalidade militar sugerida pelo contexto.
- source_word: בָאָרֶץ / כָל־הָאָרֶץ
  choice: a terra / toda a terra
  rationale: A repetição de אֶרֶץ é preservada; o alcance amplo do relatório favorece “terra” em vez de “país”.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função enfática do marcador discursivo e o tom profético, embora “e vejam” seja uma alternativa mais coloquial.
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  choice: está em repouso e tranquila
  rationale: Expressa de modo natural a condição estável e sem perturbação descrita pelos dois particípios, embora יֹשֶׁבֶת retenha literalmente a imagem de estar sentada ou estabelecida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o nome divino. “Yahweh” o preserva como nome próprio sem substituí-lo por um título.
- issue: Sentido de מַלְאַךְ em מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto visionário favorece “anjo”, mas a tradução não acrescenta uma identificação teológica específica à figura.
- issue: Natureza da tranquilidade de toda a terra
  choice: descrição neutra de repouso e tranquilidade
  alternative: aprovação divina da paz vigente
  rationale: O versículo relata a condição observada, mas não declara por si só se essa tranquilidade é moralmente boa, complacente ou opressiva; a tradução preserva essa tensão contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Murtas” mantém o referente botânico sem explicitação desnecessária; “eis que” conserva o tom visionário. As notas registram a força iterativa possível de הִתְהַלַּכְנוּ e a imagem concreta de יֹשֶׁבֶת.
