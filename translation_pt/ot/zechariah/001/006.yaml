  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: pt
  text: 'Mas as minhas palavras e os meus decretos, que ordenei aos meus servos, os profetas,[a] não alcançaram os antepassados de vocês? Então eles se voltaram[b] e disseram: “Assim como Yahweh dos Exércitos[c] planejou fazer conosco, segundo os nossos caminhos e os nossos atos, assim ele fez conosco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ordenei por meio dos meus servos, os profetas”.'
    reason: A construção pode ser entendida contextualmente como referência às mensagens transmitidas por intermédio dos profetas, embora a sintaxe hebraica diga de modo mais direto que Deus lhes deu ordens.
  - marker: b
    text: 'Ou: “se arrependeram”. O verbo hebraico pode significar “voltar/retornar” ou, neste contexto, “arrepender-se”.'
    reason: Preserva a possível leitura de arrependimento sem resolver no texto principal a amplitude semântica do verbo.
  - marker: c
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: Registra a convenção tradicional para o nome divino e o título, enquanto o texto principal usa “Yahweh”.
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz o contraste com a mortalidade dos antepassados e dos profetas mencionada no versículo anterior; “Mas” expressa isso naturalmente em português.
- source_word: דְּבָרַי וְחֻקַּי
  choice: as minhas palavras e os meus decretos
  rationale: “Palavras” mantém a referência direta às declarações divinas; “decretos” distingue o segundo termo e comunica prescrições estabelecidas de forma mais corrente que “estatutos”.
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: que ordenei aos meus servos, os profetas
  rationale: Segue de perto a sintaxe hebraica, na qual os profetas são os destinatários da ordem, sem inserir no texto principal o interpretativo “por meio de”.
- source_word: הִשִּׂיגוּ
  choice: alcançaram
  rationale: Preserva a imagem de palavras e decretos que acabam chegando aos antepassados, isto é, cumprindo-se sobre eles, sem explicitar além do hebraico a ideia de castigo.
- source_word: וַיָּשׁוּבוּ
  choice: Então eles voltaram atrás
  rationale: Mantém a imagem de retorno própria de שׁוּב e permite, sem impor, o sentido contextual de arrependimento.
- source_word: זָמַם
  choice: planejou
  rationale: Expressa em linguagem atual uma intenção deliberada e resoluta.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de maneira transparente, preservando a força militar e cósmica do título.
- source_word: כִּדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: segundo os nossos caminhos e os nossos atos
  rationale: “Caminhos” conserva a metáfora moral hebraica, enquanto “atos” traduz de modo claro as ações correspondentes.
- source_word: כֵּן עָשָׂה אִתָּנוּ
  choice: assim ele fez conosco
  rationale: Preserva a repetição do verbo “fazer” presente no hebraico e a relação direta entre o propósito divino e seu cumprimento.
theological_decisions:
- issue: Se וַיָּשׁוּבוּ deve afirmar explicitamente arrependimento
  choice: Então eles voltaram atrás
  alternative: Então eles se arrependeram
  rationale: O verbo שׁוּב pode designar tanto retorno como arrependimento. A formulação principal preserva a imagem e a ambiguidade, enquanto a nota registra o sentido teológico possível sem afirmar mais do que o texto exige.
- issue: Como representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança, e a forma tradicional é informada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa do plural hebraica foi expressa por “vocês”, e “antepassados” foi preferido a “pais” para evitar ambiguidade familiar. A repetição “fazer conosco... fez conosco” foi mantida deliberadamente por refletir a forma do original.
