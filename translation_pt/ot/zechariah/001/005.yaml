base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/005.yaml
  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: pt
  text: Seus pais[a] — onde estão eles? E os profetas, vivem para sempre?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassados”. O hebraico diz literalmente “pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: seus pais
  rationale: Preserva o termo familiar masculino e a força direta do hebraico, que se refere às gerações anteriores dos ouvintes; “antepassados” é uma alternativa contextual possível.
- source_word: אַיֵּה הֵם
  choice: onde estão eles?
  rationale: Traduz o advérbio interrogativo e mantém expresso o pronome enfático plural, reproduzindo a pergunta retórica.
- source_word: וְהַנְּבִאִים
  choice: E os profetas
  rationale: Mantém a conjunção simples, o substantivo definido e o paralelismo com a primeira pergunta.
- source_word: הַלְעוֹלָם יִחְיוּ
  choice: acaso vivem para sempre?
  rationale: “Vivem para sempre” expressa naturalmente em português a força geral da pergunta retórica; “acaso” sinaliza essa força sem alterar seu conteúdo.
theological_decisions:
- issue: Referente e força retórica de “os profetas”
  choice: A pergunta ressalta que tanto as gerações anteriores quanto os profetas são mortais.
  alternative: Entender a pergunta apenas como preparação para o contraste do versículo seguinte entre mensageiros mortais e palavras divinas duradouras.
  rationale: O versículo pergunta somente se os profetas vivem para sempre. Não se deve antecipar aqui a afirmação do versículo seguinte nem sugerir que a mensagem profética tenha fracassado ou expirado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “onde estão eles?” conserva a ênfase do pronome hebraico, e “acaso” dá naturalidade à segunda pergunta retórica.
