  text: וְֽ/הָלְכ֡וּ יֹשְׁבֵי֩ אַחַ֨ת אֶל אַחַ֜ת לֵ/אמֹ֗ר נֵלְכָ֤ה הָלוֹךְ֙ לְ/חַלּוֹת֙ אֶת פְּנֵ֣י יְהוָ֔ה וּ/לְ/בַקֵּ֖שׁ אֶת יְהוָ֣ה צְבָא֑וֹת אֵלְכָ֖ה גַּם אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: pt
  text: 'E os habitantes de uma cidade irão a outra, dizendo: “Vamos mesmo suplicar o favor do SENHOR e buscar o SENHOR dos Exércitos.” “Eu também irei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: os habitantes de uma cidade irão aos de outra
  rationale: Expressa naturalmente em português o movimento dos habitantes de uma cidade em direção aos de outra, sem acrescentar um substantivo ausente além do necessário à clareza.
- source_word: נֵלְכָה הָלוֹךְ
  choice: Vamos sem demora
  rationale: O infinitivo absoluto após a forma verbal intensifica ou reforça o convite; “sem demora” comunica a insistência de modo idiomático, embora também seja possível entendê-lo como “vamos mesmo”.
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: suplicar o favor do SENHOR
  rationale: O idioma hebraico literalmente ligado a ‘abrandar/implorar a face’ indica buscar favor por meio de súplica.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Forma portuguesa tradicional e inteligível do título divino, preservando sua imagem militar e soberana.
- source_word: אֵלְכָה גַּם־אָנִי
  choice: Eu também vou
  rationale: Preserva a resposta pessoal enfática e a forma verbal volitiva, com naturalidade em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção portuguesa amplamente reconhecida em versaletes, sem introduzir uma preferência confessional específica.
- issue: Força de נֵלְכָה הָלוֹךְ
  choice: Vamos sem demora
  alternative: Vamos certamente / Vamos mesmo
  rationale: Mantém a intensidade do hebraico sem transformar a construção numa promessa doutrinária ou certeza absoluta não exigida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto foi apresentado como uma única fala contínua, solução compatível com o hebraico, no qual a resposta final pode funcionar como adesão imediata ao convite.
