base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: pt
  text: Muitos povos e nações poderosas virão buscar Yahweh dos Exércitos em Jerusalém e suplicar o favor de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscar o favor de Yahweh”. A expressão hebraica inclui literalmente “o rosto de Yahweh” e significa suplicar seu favor ou sua presença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: virão
  rationale: O perfeito qal com conjunção, no contexto profético, tem sentido futuro; “virão” expressa isso de modo natural e conciso.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: “Povos” preserva a distinção em relação a גּוֹיִם, traduzido em seguida como “nações”.
- source_word: וְגוֹיִם עֲצוּמִים
  choice: e nações poderosas
  rationale: גּוֹיִם designa nações, e עֲצוּמִים comunica força ou poder; “poderosas” é corrente e mantém o sentido político e coletivo.
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: buscar Yahweh dos Exércitos
  rationale: בקשׁ com objeto direto significa “buscar”. O nome divino é transliterado como “Yahweh”, e צְבָאוֹת é mantido como “dos Exércitos”, preservando a imagem concreta do título hebraico.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta e natural da preposição בְּ no contexto de peregrinação.
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: e suplicar o favor de Yahweh
  rationale: A expressão idiomática חלה את־פני descreve uma súplica para obter favor ou acolhimento. A formulação comunica o sentido relacional sem reproduzir de maneira obscura a expressão literal “o rosto de”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: Todo-Poderoso; das hostes
  rationale: “Dos Exércitos” conserva a imagem de hostes ou exércitos presente no hebraico, sem convertê-la na ideia mais ampla de onipotência.
- issue: Sentido de חלות את פני יהוה
  choice: suplicar o favor de Yahweh
  alternative: buscar o favor de Yahweh; suplicar diante de Yahweh; suplicar a presença de Yahweh
  rationale: O idioma envolve literalmente o “rosto” de Yahweh e pode apontar para favor ou presença. O texto principal usa a expressão portuguesa mais clara, enquanto a nota preserva a imagem e a amplitude do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém-se a distinção entre “povos” e “nações” e conserva-se o título concreto “Yahweh dos Exércitos”.
