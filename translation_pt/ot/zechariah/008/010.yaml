  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: pt
  text: Pois, antes daqueles dias, não havia salário para o ser humano nem salário para o animal; para quem saía e para quem entrava, não havia paz[a] por causa do adversário[b], e eu pus cada um contra o seu próximo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segurança” ou “bem-estar”; o hebraico shalom pode abranger paz, segurança e prosperidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “inimigo” ou “por causa do inimigo”; o termo hebraico designa alguém que age de modo hostil.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “enviei todas as pessoas, cada uma contra o seu próximo”; o sentido é que Deus os entregou à hostilidade mútua.
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do contraste com a situação posterior; preserva a força explicativa ou causal do hebraico.
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: antes daqueles dias
  rationale: Mantém a expressão temporal concreta do hebraico e soa natural em português.
- source_word: שְׂכַר הָאָדָם
  choice: salário para o ser humano
  rationale: שְׂכַר indica salário ou pagamento. 'Ser humano' comunica o sentido representativo de אָדָם e mantém o contraste com o animal sem sugerir que apenas homens do sexo masculino estejam em vista.
- source_word: וּשְׂכַר הַבְּהֵמָה אֵינֶנָּה
  choice: nem salário para o animal
  rationale: Conserva o paralelismo com o trabalho humano. 'Animal' representa de modo amplo o animal doméstico ou de carga, sem restringir o referente a uma espécie.
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: para quem saía e para quem entrava
  rationale: Reproduz os particípios substantivados e a fórmula hebraica, que abrange deslocamentos e atividades comuns.
- source_word: אֵין שָׁלוֹם
  choice: não havia paz
  rationale: '''Paz'' é o equivalente principal de שָׁלוֹם; uma nota registra os sentidos contextuais de segurança e bem-estar.'
- source_word: מִן הַצָּר
  choice: por causa do adversário
  rationale: Entende צַר como um agente hostil e traduz מִן com valor causal adequado ao contexto de insegurança.
- source_word: וַאֲשַׁלַּח
  choice: eu pus
  rationale: Embora o verbo signifique literalmente 'enviei', a construção descreve Deus colocando as pessoas umas contra as outras; 'pus' preserva a agência divina e é idiomático em português.
- source_word: אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: cada um contra o seu próximo
  rationale: Expressa a força distributiva da frase hebraica e a hostilidade mútua, sem limitar o referente a indivíduos do sexo masculino.
theological_decisions:
- issue: Sentido representativo de אָדָם
  choice: ser humano / cada um
  alternative: homem / cada homem
  rationale: O contexto contrapõe o trabalho humano ao animal e depois distribui a hostilidade entre as pessoas. A formulação escolhida preserva a abrangência do hebraico em português atual.
- issue: Agência divina na discórdia social
  choice: e eu pus cada um contra o seu próximo
  alternative: e cada um se voltou contra o seu próximo
  rationale: O hebraico atribui explicitamente a ação a Deus. A tradução mantém essa tensão teológica em vez de transformar a frase em mera ação humana espontânea.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada sem recorrer a formulações excessivamente literais ou arcaicas.
