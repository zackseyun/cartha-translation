  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: pt
  text: Mas agora não serei para o remanescente deste povo como nos dias passados[a] — declara YHWH[b] dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não tratarei o remanescente deste povo como nos dias passados». O hebraico é elíptico e deixa o sentido exato implícito no contexto.'
    reason: alternative_reading
  - marker: b
    text: 'Tradução tradicional: «o SENHOR dos Exércitos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: No contexto, a expressão contrasta a nova atuação divina com as dificuldades dos tempos anteriores.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: como nos dias passados
  rationale: A preposição כ marca comparação; «dias passados» é uma formulação natural e preserva o contraste temporal.
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: para o remanescente deste povo
  rationale: Mantém a preposição ligada à construção elíptica e conserva «remanescente», termo relevante no contexto profético.
- source_word: נְאֻם
  choice: declara
  rationale: Expressa adequadamente a fórmula profética de pronunciamento solene.
- source_word: יְהוָה צְבָאוֹת
  choice: YHWH dos Exércitos
  rationale: Representa o nome divino distinguível no texto-fonte e traduz צְבָאוֹת de modo transparente, preservando sua dimensão militar e cósmica.
theological_decisions:
- issue: Predicado implícito depois de אֲנִי («eu»)
  choice: não serei para o remanescente deste povo como nos dias passados
  alternative: não tratarei o remanescente deste povo como nos dias passados
  rationale: O hebraico é elíptico e não explicita o verbo ou a nuance da atuação divina. A redação escolhida preserva essa abertura, ainda que soe deliberadamente incomum em português.
- issue: Representação do nome divino יהוה
  choice: YHWH
  alternative: SENHOR
  rationale: YHWH torna visível o nome próprio presente no hebraico; a forma tradicional é registrada em nota para leitores familiarizados com ela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe incomum «não serei para» foi mantida de propósito para refletir a elipse do hebraico, apoiada por nota explicativa. Os marcadores aparecem junto às expressões pertinentes.
