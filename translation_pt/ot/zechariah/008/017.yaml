  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: pt
  text: Que nenhum de vocês planeje, em seu coração, o mal contra o seu próximo[a] nem ame um juramento falso, pois odeio todas essas coisas — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “E cada um: não planejem em seus corações o mal contra o seu próximo”. O hebraico combina um sujeito individual no singular com formas verbais e pronominais dirigidas à comunidade no plural.'
    reason: Preserva e explica a alternância singular-plural do hebraico sem apresentar como tradução portuguesa idiomática uma construção de concordância anômala.
lexical_decisions:
- source_word: וְאִישׁ
  choice: Que nenhum de vocês
  rationale: אִישׁ é singular, mas os verbos e o sufixo de “corações” se dirigem à comunidade no plural. A formulação distributiva preserva tanto a responsabilidade individual quanto o destinatário coletivo, em português natural.
- source_word: רָעַת רֵעֵהוּ
  choice: o mal contra o seu próximo
  rationale: רָעָה denota aqui o mal ou dano pretendido, e רֵעַ é o próximo, companheiro ou semelhante. “Mal contra o seu próximo” conserva a força ética e interpessoal da expressão.
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: planeje em seu coração
  rationale: חשב pode significar pensar, calcular ou planejar; neste contexto, “planejar” comunica uma intenção interior deliberada. O singular distributivo em português corresponde naturalmente ao plural comunitário hebraico.
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: um juramento falso
  rationale: A construção significa literalmente “juramento de falsidade”. “Juramento falso” é claro e preserva o sentido ético-jurídico sem restringi-lo ao termo técnico “perjúrio”.
- source_word: תֶּאֱהָבוּ
  choice: ame
  rationale: אהב significa diretamente “amar”. A tradução mantém a força moral do texto, que condena não só fazer um juramento falso, mas também estimá-lo ou acolhê-lo.
- source_word: כִּי אֶת כָּל אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: pois odeio todas essas coisas
  rationale: A formulação portuguesa é natural, mantém a totalidade expressa por כָּל e identifica as práticas mencionadas como objeto do ódio divino.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é a fórmula profética de declaração, e “declara” comunica seu caráter solene. O nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Ódio atribuído a Deus
  choice: odeio todas essas coisas
  alternative: detesto todas essas coisas
  rationale: שׂנא expressa ódio de modo direto. “Odeio” conserva a intensidade e a tensão teológica do original, sem suavizá-las.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “nenhum de vocês” reproduz de modo natural o sentido distributivo do hebraico; “próximo”, “juramento falso” e “declara” mantêm o registro profético e ético sem arcaísmo excessivo.
