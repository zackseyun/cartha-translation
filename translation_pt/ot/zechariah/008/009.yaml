  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ תֶּחֱזַ֣קְנָה יְדֵי/כֶ֔ם הַ/שֹּֽׁמְעִים֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה אֵ֖ת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה מִ/פִּי֙ הַ/נְּבִיאִ֔ים אֲ֠שֶׁר בְּ/י֞וֹם יֻסַּ֨ד בֵּית יְהוָ֧ה צְבָא֛וֹת הַ/הֵיכָ֖ל לְ/הִבָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos[a]: “Que as mãos de vocês sejam fortes, vocês que, nestes dias, estão ouvindo estas palavras da boca dos profetas[b] que estavam presentes no dia em que foi lançado o alicerce da casa de Yahweh dos Exércitos, para que o templo fosse construído.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da boca dos profetas”, expressão que se refere à mensagem pronunciada por eles.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dos profetas que falaram no dia em que foi lançado o alicerce da casa de Yahweh dos Exércitos, para que o templo fosse construído”. A oração relativa em hebraico é compacta e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz a fórmula profética de mensageiro em português natural e solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo transparente, preservando sua imagem militar e celestial.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: Que as mãos de vocês sejam fortes
  rationale: Preserva a imagem hebraica das mãos fortalecidas como chamado à coragem, à firmeza e ao trabalho.
- source_word: הַשֹּׁמְעִים ... אֵת הַדְּבָרִים הָאֵלֶּה
  choice: vocês que, nestes dias, estão ouvindo estas palavras
  rationale: Conserva o valor contínuo do particípio e identifica diretamente os ouvintes presentes.
- source_word: מִפִּי הַנְּבִיאִים
  choice: da boca dos profetas
  rationale: Mantém a expressão concreta do hebraico, inteligível em português, para a mensagem pronunciada pelos profetas.
- source_word: אֲשֶׁר בְּיוֹם יֻסַּד
  choice: que estavam presentes no dia em que foi lançado o alicerce
  rationale: Expressa em português a relação elíptica e compacta entre os profetas e o dia da fundação, sem ocultar em nota a possibilidade de outra construção.
- source_word: בֵּית יְהוָה צְבָאוֹת הַהֵיכָל לְהִבָּנוֹת
  choice: da casa de Yahweh dos Exércitos, para que o templo fosse construído
  rationale: Conserva 'casa' e explicita sua referência pelo termo seguinte, 'templo'; a oração final traduz a finalidade associada ao lançamento do alicerce.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome da aliança; sua forma é preservada no corpo do versículo, com a convenção tradicional indicada em nota.
- issue: Sentido de צְבָאוֹת
  choice: Exércitos
  alternative: Hostes
  rationale: '''Exércitos'' comunica com maior clareza ao leitor moderno a imagem do poder soberano de Yahweh sobre as forças terrestres e celestiais.'
- issue: Relação da oração אֲשֶׁר בְּיוֹם יֻסַּד com 'os profetas'
  choice: os profetas estavam presentes naquele dia
  alternative: os profetas falaram naquele dia
  rationale: A oração hebraica é elíptica e permite mais de uma explicitação. O texto principal adota a referência à presença dos profetas, enquanto a nota preserva a leitura que subentende sua fala.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo profético e a imagem hebraica das mãos fortes sem recorrer a vocabulário arcaico; a ambiguidade da oração relativa é mantida por meio de nota.
