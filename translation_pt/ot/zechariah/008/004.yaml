  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: Homens e mulheres de idade avançada ainda se sentarão nas ruas de Jerusalém[a], cada um com sua bengala na mão, por causa da idade avançada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas praças”.'
    reason: רחובות pode referir-se a ruas largas ou a praças e outros espaços públicos abertos.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem solene, clara e corrente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título português consagrado e semanticamente amplo.
- source_word: עֹד יֵשְׁבוּ
  choice: ainda se sentarão
  rationale: עֹד aponta para a futura restauração dessa realidade, e יֵשְׁבוּ descreve concretamente pessoas sentadas nos espaços públicos.
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: Homens e mulheres de idade avançada
  rationale: Expressa explicitamente os dois gêneros e comunica idade, não um cargo de liderança, com dignidade e naturalidade.
- source_word: בִּרְחֹבוֹת
  choice: nas ruas
  rationale: O termo pode designar ruas largas ou espaços públicos; “ruas” é natural no contexto urbano, enquanto “praças” permanece em nota como alternativa legítima.
- source_word: וְאִישׁ
  choice: cada um
  rationale: Reproduz o valor distributivo do singular hebraico e introduz naturalmente os sufixos masculinos singulares seguintes.
- source_word: מִשְׁעַנְתּוֹ בְּיָדוֹ
  choice: com seu bordão na mão
  rationale: Preserva a imagem concreta do apoio carregado na mão e os possessivos singulares do hebraico.
- source_word: מֵרֹב יָמִים
  choice: por causa da idade avançada
  rationale: Traduz o sentido idiomático de “pela abundância de dias” e mantém sua força causal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: das hostes
  rationale: “Dos Exércitos” é inteligível no português moderno e conserva a imagem do título sem limitar explicitamente os exércitos aos humanos ou aos celestiais.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil. A formulação preserva o paralelismo de gênero do hebraico, o singular distributivo e a imagem concreta do bordão.
