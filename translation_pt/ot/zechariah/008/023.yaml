  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos[a]: Naqueles dias, dez homens de todas as línguas das nações agarrarão — sim, agarrarão — a ponta da roupa[b] de um judeu[c], dizendo: “Vamos com vocês, pois ouvimos que Deus está com vocês”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a extremidade”, “a borda” ou “o canto” da roupa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de um judeano”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת pelo sentido concreto e compreensível de forças ou exércitos, mantendo a alternativa tradicional em nota.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: Naqueles dias
  rationale: Reproduz de modo natural a expressão temporal hebraica.
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: agarrarão — sim, agarrarão
  rationale: Mantém a repetição enfática do verbo חזק no Hifil; “agarrar” comunica contato firme sem sugerir necessariamente violência.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dez homens
  rationale: Conserva o número e a forma masculina explícita do hebraico.
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: de todas as línguas das nações
  rationale: Mantém לְשֹׁנוֹת no sentido de idiomas e expressa naturalmente a abrangência entre as nações.
- source_word: בִּכְנַף
  choice: a ponta da roupa
  rationale: כָּנָף designa literalmente uma extremidade, borda ou canto; “ponta da roupa” preserva a imagem concreta sem especificar uma peça não indicada no texto.
- source_word: אִישׁ יְהוּדִי
  choice: um judeu
  rationale: É a forma portuguesa direta e natural para um homem pertencente ao povo de Judá; a possibilidade geográfica “judeano” é registrada em nota.
- source_word: נֵלְכָה עִמָּכֶם
  choice: Vamos com vocês
  rationale: O coortativo expressa vontade ou resolução; “vamos” transmite essa nuance e o plural עִמָּכֶם é preservado por “vocês”.
- source_word: אֱלֹהִים עִמָּכֶם
  choice: Deus está com vocês
  rationale: Traduz diretamente a afirmação da presença de Deus junto ao grupo interpelado.
theological_decisions:
- issue: Tradução de יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos Exércitos celestiais
  rationale: O texto emprega diretamente o nome divino, que é preservado como “Yahweh”; “Exércitos” mantém o conteúdo concreto de צְבָאוֹת sem identificar de forma mais estreita quais forças estão em vista.
- issue: Sentido de יְהוּדִי
  choice: um judeu
  alternative: um judeano
  rationale: No contexto profético, o termo pode designar alguém do povo de Judá, não apenas um residente da região; a tradução principal usa a designação étnica corrente, sem eliminar a alternativa geográfica.
- issue: Plural em עִמָּכֶם
  choice: com vocês
  alternative: contigo
  rationale: Embora os homens agarrem a roupa de um indivíduo, o pronome hebraico é plural e aponta para o povo ou grupo representado por ele; a tradução conserva essa tensão gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A repetição verbal e a mudança entre o indivíduo (“um judeu”) e o destinatário plural (“vocês”) foram preservadas. As aspas e os travessões tornam a ênfase legível sem suavizar a construção hebraica.
