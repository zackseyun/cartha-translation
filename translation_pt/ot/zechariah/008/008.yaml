  text: וְ/הֵבֵאתִ֣י אֹתָ֔/ם וְ/שָׁכְנ֖וּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָיוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים בֶּ/אֱמֶ֖ת וּ/בִ/צְדָקָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: pt
  text: Eu os trarei, e eles habitarão no meio de Jerusalém[a]. Eles serão o meu povo, e eu serei o Deus deles, em verdade[b] e em justiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentro de Jerusalém”. O hebraico diz mais literalmente “no meio de Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: “Em verdade” também pode ser entendido como “com fidelidade” ou “verdadeiramente”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Eu os trarei
  rationale: O hifil de בוא significa normalmente “trazer” ou “fazer vir”. O contexto sugere restauração, mas não é necessário acrescentar “de volta”, expressão que não aparece explicitamente neste verbo.
- source_word: וְשָׁכְנוּ
  choice: eles habitarão
  rationale: שכן indica habitar ou residir. “Habitarão” mantém o sentido de residência estabelecida e o tom solene da promessa.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: no meio de Jerusalém
  rationale: בְּתוֹךְ é mais específico que um simples “em”. A tradução preserva a imagem espacial hebraica, enquanto a nota registra uma alternativa natural.
- source_word: וְהָיוּ לִי לְעָם
  choice: Eles serão o meu povo
  rationale: Esta é uma fórmula de aliança recorrente. A formulação portuguesa é idiomática e conserva suas ligações intertextuais.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: e eu serei o Deus deles
  rationale: A tradução natural preserva a fórmula de aliança e a relação expressa pelo hebraico sem recorrer a uma paráfrase explicativa.
- source_word: בֶּאֱמֶת
  choice: em verdade
  rationale: אֱמֶת pode expressar verdade, fidelidade ou confiabilidade. “Em verdade” preserva a forma nominal e deixa audível a possível nuance de fidelidade.
- source_word: וּבִצְדָקָה
  choice: e em justiça
  rationale: צְדָקָה pode indicar justiça ou retidão. “Justiça” é clara e corrente em português; a nota preserva “retidão” como alternativa relevante.
theological_decisions:
- issue: Fórmula da aliança
  choice: “Eles serão o meu povo, e eu serei o Deus deles”
  alternative: Parafrasear como “eles pertencerão a mim, e eu cuidarei deles como seu Deus”
  rationale: O hebraico emprega uma fórmula de aliança estabelecida, que deve ser preservada para manter suas ligações com outras passagens e evitar explicações não expressas no texto.
- issue: Alcance de בֶּאֱמֶת וּבִצְדָקָה
  choice: Manter “em verdade e em justiça” ao fim da declaração da aliança
  alternative: Explicitar como “eu lhes serei fiel e agirei com justiça” ou aplicar a expressão somente a Deus
  rationale: A sintaxe hebraica não define de modo inequívoco se a expressão qualifica exclusivamente o modo de Deus ser o Deus deles ou a relação de aliança em sentido mais amplo. A formulação nominal preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula da aliança foi mantida em linguagem tradicional e natural. A pontuação conserva aberta a relação sintática de “em verdade e em justiça”, sem restringi-la indevidamente.
