lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e digno a fórmula profética de declaração, usando o presente idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: É a forma consagrada e compreensível do título hebraico, sem restringir indevidamente o alcance dos exércitos celestes e terrenos.
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: Ainda virão
  rationale: Expressa com naturalidade a ideia de algo que ainda acontecerá, incorporando אֲשֶׁר à construção verbal futura.
- source_word: עַמִּים
  choice: povos
  rationale: Mantém a referência ampla a múltiplos grupos humanos; “nações” permanece uma alternativa lexical possível.
- source_word: וְיֹשְׁבֵי
  choice: e habitantes de
  rationale: Traduz diretamente o particípio em estado construto com uma expressão concisa e corrente em português.
- source_word: עָרִים רַבּוֹת
  choice: muitas cidades
  rationale: Aqui רַבּוֹת indica mais naturalmente quantidade, não grandeza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Alcance de עַמִּים
  choice: povos
  alternative: nações
  rationale: “Povos” preserva a referência a grupos humanos sem impor necessariamente o sentido geopolítico moderno de “nações”; a alternativa é registrada em nota.
translation_notes:
