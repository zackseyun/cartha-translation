  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/001.yaml
  text: And the word of Yahweh of hosts came[a], saying[b],
translation:
  language: pt
  text: 'E veio a palavra de Yahweh dos Exércitos, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E veio
  rationale: A forma narrativa de היה introduz a sequência e, nesta fórmula profética, combina-se naturalmente em português com a chegada da palavra divina, evitando o mais rígido “E aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דְּבַר designa a palavra ou mensagem divina; “a palavra” preserva a formulação tradicional e sua dignidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Representa diretamente a ideia de exércitos ou forças organizadas e preserva a imagem militar e cósmica do título divino; a inicial maiúscula marca sua função titular.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina que vem em seguida; “dizendo” conserva a fórmula hebraica de modo claro e formal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Representação do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das hostes; Yahweh Todo-Poderoso
  rationale: “Dos Exércitos” é compreensível no português atual e mantém a referência concreta de צְבָאוֹת, enquanto “Todo-Poderoso” interpreta o título em vez de traduzi-lo diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a fórmula profética são mantidas sem recorrer ao arcaísmo “E aconteceu que”. Não há notas porque nenhuma alternativa é necessária para compreender este versículo curto.
