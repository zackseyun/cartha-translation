  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos: Assim como planejei trazer calamidade sobre vocês quando seus pais[a] me provocaram à ira — diz Yahweh dos Exércitos — e não voltei atrás,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não desisti”; também pode ser traduzido por “não mudei de ideia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressa de modo transparente o sentido militar e cósmico do título hebraico, além de ser compreensível em português atual.
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Preserva a fórmula profética e a ligação explicativa de כִּי com o contexto anterior.
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Marca a comparação com a promessa que continua no versículo seguinte.
- source_word: זָמַמְתִּי
  choice: planejei
  rationale: Comunica intenção deliberada em linguagem natural e atual.
- source_word: לְהָרַע לָכֶם
  choice: fazer mal a vocês
  rationale: Reproduz de perto a expressão hebraica e conserva sua força judicial sem atribuir explicitamente maldade moral a Deus.
- source_word: בְּהַקְצִיף ... אֹתִי
  choice: quando ... me provocaram à ira
  rationale: Representa tanto a circunstância temporal indicada por בְּ quanto o sentido causativo e intenso do verbo.
- source_word: אֲבֹתֵיכֶם
  choice: seus pais
  rationale: Traduz diretamente o substantivo masculino plural hebraico; no contexto, refere-se às gerações anteriores.
- source_word: וְלֹא נִחָמְתִּי
  choice: e não voltei atrás
  rationale: Comunica que Yahweh não desistiu do juízo planejado, sem sugerir arrependimento por culpa moral.
theological_decisions:
- issue: Linguagem do juízo divino em לְהָרַע
  choice: fazer mal a vocês
  alternative: trazer desgraça sobre vocês
  rationale: A formulação mantém a tensão e a contundência do hebraico, enquanto o contexto deixa claro que se trata de ação judicial, não de maldade moral.
- issue: Linguagem antropopática em וְלֹא נִחָמְתִּי
  choice: não voltei atrás
  alternative: não mudei de ideia / não desisti
  rationale: A escolha exprime a manutenção do propósito anunciado sem resolver além do texto questões doutrinárias sobre mudança ou imutabilidade divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação com aspas evidencia a fala divina sem alterar a estrutura do hebraico; a frase permanece aberta porque a comparação se completa no versículo 15.
