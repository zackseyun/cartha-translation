  - severity: low
    issue: '"Fazer mal" pode sugerir em português uma ação moralmente má.'
    rationale: No contexto, לְהָרַע designa a calamidade do juízo. "Trazer calamidade" explicita esse valor contextual sem atenuar a força do texto.
