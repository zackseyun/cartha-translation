  text: כֵּ֣ן שַׁ֤בְתִּי זָמַ֨מְתִּי֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה לְ/הֵיטִ֥יב אֶת יְרוּשָׁלִַ֖ם וְ/אֶת בֵּ֣ית יְהוּדָ֑ה אַל תִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/015.yaml
  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: pt
  text: Assim, nestes dias, decidi novamente fazer o bem a Jerusalém e à casa de Judá. Não tenham medo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: Assim também
  rationale: Retoma, em paralelo contrastante, a decisão divina mencionada no contexto anterior, sem reduzir o termo a uma simples indicação temporal.
- source_word: שַׁבְתִּי זָמַמְתִּי
  choice: voltei a decidir
  rationale: שַׁבְתִּי funciona com o verbo seguinte no sentido de tornar a ou voltar a fazer algo; זָמַמְתִּי expressa uma decisão ou propósito deliberado.
- source_word: בַּיָּמִים הָאֵלֶּה
  choice: nestes dias
  rationale: Reprodução direta da referência ao período presente anunciado pelo profeta.
- source_word: לְהֵיטִיב
  choice: fazer o bem
  rationale: Mantém o sentido causativo amplo de agir beneficamente, sem especificar de modo indevido a forma da bênção.
- source_word: בֵּית יְהוּדָה
  choice: casa de Judá
  rationale: Preserva a expressão coletiva e dinástica do hebraico.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: O verbo está no plural e dirige a exortação à comunidade; a formulação é natural no português moderno.
theological_decisions:
- issue: A linguagem de Deus 'voltar' a decidir
  choice: voltei a decidir
  alternative: mudei de propósito e decidi
  rationale: A escolha preserva o idioma hebraico de retomada da ação sem inferir uma formulação mais forte sobre mudança na natureza ou no conhecimento de Deus.
- issue: Objeto do benefício divino
  choice: a Jerusalém e à casa de Judá
  alternative: para com Jerusalém e a casa de Judá
  rationale: Mantém ambos como destinatários explícitos da ação benéfica de Deus, sem fundi-los nem espiritualizá-los.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a ênfase temporal e o paralelismo com o contexto. O plural de 'Não tenham medo' torna explícita a concordância do hebraico.
