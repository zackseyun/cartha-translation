  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: pt
  text: E acontecerá que, assim como vocês foram uma maldição entre as nações[a], ó casa de Judá e casa de Israel, assim eu os salvarei[b], e vocês serão uma bênção. Não tenham medo; que as mãos de vocês sejam fortes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um objeto de maldição» — isto é, um povo cujo nome era usado em fórmulas de maldição entre as nações.
    reason: lexical_alternative
  - marker: b
    text: Ou «eu os livrarei». O verbo hebraico pode indicar resgate, libertação ou salvação em sentido amplo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «que as mãos de vocês sejam fortes», expressão hebraica que exorta à coragem e à ação resoluta.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz a futura mudança de condição anunciada profeticamente, em linguagem atual e sem recorrer à fórmula arcaizante «e acontecerá que há de suceder».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... assim
  rationale: Preserva a correlação explícita entre a condição anterior do povo e a reversão futura prometida.
- source_word: קְלָלָה
  choice: uma maldição
  rationale: Verte diretamente o substantivo hebraico, que pode indicar tanto uma maldição como um povo transformado em objeto ou exemplo de maldição; a nota registra essa nuance.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Expressa a posição de Judá e Israel no meio dos demais povos sem introduzir a moldura posterior de «judeus e gentios».
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: ó casa de Judá e casa de Israel
  rationale: Conserva a designação coletiva e pactual «casa de» e explicita de modo natural o valor de vocativo no contexto.
- source_word: אוֹשִׁיעַ
  choice: eu os salvarei
  rationale: O hifil de ישׁע abrange salvar, resgatar ou livrar. «Salvarei» mantém a amplitude do termo sem restringi-lo a uma libertação apenas política ou militar.
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: e vocês serão uma bênção
  rationale: Preserva a formulação bíblica segundo a qual o povo será uma bênção, isto é, sua personificação ou fonte, sem explicar em excesso.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: Formulação corrente e clara para a proibição hebraica no plural.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: que as mãos de vocês sejam fortes
  rationale: Mantém a imagem concreta do hebraico e seu valor exortativo; a nota esclarece que se trata de coragem e ação resoluta.
theological_decisions:
- issue: Alcance da salvação em אוֹשִׁיעַ
  choice: eu os salvarei
  alternative: eu os livrarei
  rationale: «Salvar» conserva a amplitude pactual e teológica do verbo sem importar detalhes soteriológicos posteriores nem reduzir a promessa a um resgate político.
- issue: Identidade coletiva de Judá e Israel
  choice: ó casa de Judá e casa de Israel
  alternative: ó Judá e Israel
  rationale: A manutenção de «casa de» preserva a identidade corporativa dos grupos a quem a promessa é dirigida.
- issue: Sentido de «ser uma bênção»
  choice: vocês serão uma bênção
  alternative: vocês se tornarão uma fonte de bênção
  rationale: A tradução conserva a tensão e a concisão da expressão hebraica, sem decidir se o destaque recai sobre ser exemplo, objeto ou meio de bênção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural e conserva as imagens hebraicas de «maldição», «bênção» e «mãos fortes». O vocativo «ó» mantém um tom profético elevado sem tornar a frase excessivamente arcaica.
