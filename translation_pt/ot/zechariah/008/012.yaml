base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: pt
  text: 'Pois haverá semente de paz[a]: a videira dará o seu fruto, a terra dará a sua produção, e os céus darão o seu orvalho; e farei com que o remanescente deste povo herde todas essas coisas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haverá uma semeadura próspera”, “a semeadura será de paz” ou “haverá uma colheita de bem-estar”. A expressão hebraica é compacta e pode resumir todo o quadro de restauração e bênção agrícola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע הַשָּׁלוֹם
  choice: a semente da paz
  rationale: Preserva a expressão hebraica compacta e sua imagem agrícola. זֶרַע pode indicar semente ou semeadura, enquanto שָׁלוֹם abrange paz, bem-estar, integridade e prosperidade; a nota registra essa amplitude sem reduzi-la no texto principal.
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa da conjunção em relação à promessa anterior.
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: a videira dará o seu fruto
  rationale: Reproduz de modo natural a promessa agrícola e conserva o verbo repetido נתן, 'dar'.
- source_word: יְבוּל
  choice: produção
  rationale: Designa de modo amplo aquilo que a terra produz, sem restringir o sentido a uma cultura específica ou ao ato da colheita.
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: os céus darão o seu orvalho
  rationale: Conserva o plural hebraico 'céus', a imagem concreta do orvalho e a repetição do verbo 'dar'.
- source_word: וְהִנְחַלְתִּי
  choice: farei com que ... herde
  rationale: Expressa a forma causativa do verbo נחל e mantém a linguagem de herança, sem substituí-la por simples posse.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: o remanescente deste povo
  rationale: '''Remanescente'' é o termo profético adequado e preserva tanto o sentido concreto quanto a ressonância teológica da expressão.'
- source_word: אֶת כָּל אֵלֶּה
  choice: todas essas coisas
  rationale: Explicita naturalmente em português o objeto, retomando as bênçãos agrícolas enumeradas.
theological_decisions:
- issue: Amplitude semântica de שָׁלוֹם no contexto de bênção agrícola
  choice: Manter 'paz' na expressão 'semente da paz'.
  alternative: Traduzir como 'semente próspera', 'semeadura pacífica' ou 'semente de bem-estar'.
  rationale: O contexto inclui prosperidade agrícola, mas שָׁלוֹם não se limita à prosperidade material. A formulação principal conserva a metáfora e sua amplitude teológica, enquanto a nota reconhece outras leituras possíveis.
- issue: Linguagem de herança em וְהִנְחַלְתִּי
  choice: Traduzir explicitamente como 'farei com que ... herde'.
  alternative: Traduzir como 'darei ... em posse' ou simplesmente 'darei ... todas essas coisas'.
  rationale: A construção escolhida preserva tanto o valor causativo quanto a ressonância de herança e dádiva pactual presente no verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a repetição de 'dará/darão' preservam o ritmo do hebraico. A formulação deliberadamente compacta 'a semente da paz' mantém a ambiguidade do original, esclarecida em nota.
