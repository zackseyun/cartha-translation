  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Se isso é extraordinário aos olhos do remanescente deste povo naqueles dias[a], será também extraordinário aos meus olhos?”, declara Yahweh dos Exércitos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “difícil demais” ou “impossível”. O verbo hebraico pode descrever algo extraordinário ou algo que está além da capacidade humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro com cadência solene e natural em português.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e verte o título de modo tradicional, inteligível e amplo.
- source_word: כִּי
  choice: Se
  rationale: Introduz aqui a condição que conduz à pergunta retórica, embora o hebraico também possa admitir matiz causal ou concessivo.
- source_word: יִפָּלֵא
  choice: é extraordinário / será extraordinário
  rationale: O nifal de פלא pode indicar algo maravilhoso, extraordinário ou difícil demais; a escolha mantém a ideia de assombro sem excluir a de impossibilidade humana, registrada em nota.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Conserva a imagem hebraica e o paralelismo entre a perspectiva do povo e a de Yahweh.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: o remanescente deste povo
  rationale: Mantém o termo profético estabelecido e o caráter coletivo da expressão hebraica.
- source_word: בַּיָּמִים הָהֵם
  choice: naqueles dias
  rationale: Reproduz a expressão temporal profética e seu plural.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: Expressa naturalmente a fórmula solene de confirmação profética.
theological_decisions:
- issue: Força da pergunta retórica em relação à capacidade divina
  choice: 'Pergunta retórica: “será também extraordinário aos meus olhos?”'
  alternative: 'Afirmação: “também será extraordinário aos meus olhos”'
  rationale: O paralelismo e o contexto favorecem uma pergunta cuja resposta implícita é negativa, sem acrescentar uma declaração doutrinária além do contraste textual entre a percepção humana e a divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Extraordinário” preserva melhor a amplitude de פלא do que “maravilhoso”, que em português atual tende a soar apenas positivo. O paralelismo “aos olhos... aos meus olhos” foi mantido.
