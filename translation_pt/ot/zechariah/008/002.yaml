  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת קִנֵּ֥אתִי לְ/צִיּ֖וֹן קִנְאָ֣ה גְדוֹלָ֑ה וְ/חֵמָ֥ה גְדוֹלָ֖ה קִנֵּ֥אתִי לָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: pt
  text: 'Assim diz Yahweh[b] dos Exércitos: “Tenho por Sião um ciúme intenso[a] e, com grande furor, tenho ciúme dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho por Sião um zelo imenso”. O hebraico emprega a mesma raiz para “tenho ciúme” e “ciúme”, enfatizando a intensidade da paixão ligada à aliança.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” translitera o nome divino YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, é uma formulação consagrada e semanticamente ampla, capaz de abranger hostes celestiais e exércitos sem restringir indevidamente o sentido.
- source_word: קִנֵּאתִי
  choice: tenho ciúme
  rationale: Mantém a linguagem forte de ciúme ou zelo ligada à aliança; a construção portuguesa é natural e não reduz a intensidade emocional do hebraico.
- source_word: לְצִיּוֹן
  choice: por Sião
  rationale: Com קנא, a preposição ל indica o objeto ao qual se dirige o ciúme ou zelo; “por Sião” é idiomático em português.
- source_word: קִנְאָה גְדוֹלָה
  choice: um ciúme intenso
  rationale: Preserva a relação lexical com o verbo, enquanto “intenso” comunica de modo natural a força do cognato intensificador hebraico.
- source_word: וְחֵמָה גְדוֹלָה
  choice: e, com grande furor
  rationale: חֵמָה designa ira ardente; “furor” preserva sua intensidade, e “grande” representa explicitamente o adjetivo.
- source_word: לָהּ
  choice: dela
  rationale: Retoma Sião no feminino e preserva sua personificação, natural também em português.
theological_decisions:
- issue: A linguagem do ciúme divino
  choice: Manter “ciúme” para Yahweh
  alternative: “zelo” ou “grande dedicação”
  rationale: A raiz קנא admite ciúme e zelo, mas sua repetição intensificadora favorece conservar a tensão da linguagem de ciúme ligada ao compromisso de aliança, sem suavizá-la como simples cuidado.
- issue: Relação entre o furor e Sião
  choice: Conservar a formulação “com grande furor, tenho ciúme dela”
  alternative: Explicitar que o furor se dirige aos inimigos de Sião
  rationale: O texto associa o furor ao ciúme por Sião, mas não declara aqui de modo explícito contra quem ele se dirige; a tradução evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Yahweh dos Exércitos” mantém o nome divino e o título tradicional. A ordem foi levemente ajustada para fluidez, sem apagar a repetição enfática do hebraico.
