base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: pt
  text: 'Estas são as coisas que vocês devem fazer: falem a verdade uns com os outros[a]; nos portões das suas cidades[b], profiram julgamentos verdadeiros e que promovam a paz[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falem a verdade, cada homem ao seu próximo”. O hebraico emprega “cada homem” como singular representativo.'
    reason: lexical_alternative
  - marker: b
    text: Os portões das cidades eram o lugar habitual onde se ouviam causas e se proferiam decisões judiciais.
    reason: cultural_note
  - marker: c
    text: 'Ou: “julguem com verdade e com julgamento de paz nos seus portões”. A relação entre “verdade”, “julgamento” e “paz” é compacta no hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Estas são as coisas
  rationale: דְּבָרִים pode significar “palavras”, “coisas” ou “assuntos”. Aqui introduz ações éticas concretas, por isso “coisas” comunica melhor o sentido.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: que vocês devem fazer
  rationale: O imperfeito tem força instrutiva neste contexto; “devem fazer” expressa obrigação de modo natural em português.
- source_word: דַּבְּרוּ אֱמֶת
  choice: falem a verdade
  rationale: A expressão preserva o imperativo direto e é mais idiomática em português do que “falem verdade”.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: uns com os outros
  rationale: O hebraico usa literalmente “cada homem com o seu próximo”, um singular masculino representativo. A formulação recíproca expressa naturalmente em português a obrigação mútua, enquanto a forma literal é preservada em nota.
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם
  choice: com verdade e profiram julgamentos que promovam a paz
  rationale: A sequência nominal hebraica é compacta e admite mais de uma relação sintática. A tradução mantém ligados verdade, julgamento e paz, tornando clara a ideia de decisões judiciais verdadeiras que produzem ou preservam a paz.
- source_word: שִׁפְטוּ
  choice: julguem
  rationale: O imperativo direto conserva tanto a simplicidade da forma hebraica quanto o contexto judicial.
- source_word: בְּשַׁעֲרֵיכֶם
  choice: nos portões das suas cidades
  rationale: Os portões eram o local público em que se ouviam causas e se proferiam decisões. A explicitação de “cidades” evita que o leitor moderno interprete a expressão como referência aos portões de casas particulares.
theological_decisions:
- issue: Singular masculino representativo na instrução ética
  choice: uns com os outros
  alternative: cada homem com o seu próximo
  rationale: A expressão hebraica tem forma masculina singular, mas função distributiva e recíproca. O texto principal comunica essa reciprocidade em português corrente, e a nota preserva a forma literal sem restringir indevidamente o alcance da ordem.
- issue: Sentido de שָׁלוֹם na expressão judicial
  choice: julgamentos que promovam a paz
  alternative: julgamentos verdadeiros e pacíficos
  rationale: שָׁלוֹם pode caracterizar o julgamento ou indicar seu resultado pacificador. “Que promovam a paz” torna inteligível esse valor contextual sem separar paz de justiça; a nota registra uma alternativa mais formal.
- issue: Relação sintática entre אֱמֶת, מִשְׁפַּט e שָׁלוֹם
  choice: julguem com verdade e profiram julgamentos que promovam a paz
  alternative: profiram julgamentos verdadeiros e pacíficos
  rationale: A sequência hebraica acumula substantivos e permite diferentes maneiras de relacioná-los. A redação principal preserva a dupla ênfase em verdade e paz, sem identificar uma com a outra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e explicita “das suas cidades” para conservar de modo inteligível a imagem cultural dos portões como foro judicial.
