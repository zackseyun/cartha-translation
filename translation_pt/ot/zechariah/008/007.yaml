  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י מוֹשִׁ֛יעַ אֶת עַמִּ֖/י מֵ/אֶ֣רֶץ מִזְרָ֑ח וּ/מֵ/אֶ֖רֶץ מְב֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Eis que vou salvar[a] o meu povo da terra do leste e da terra onde o sol se põe[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “salvarei” ou “estou salvando”. Em linguagem profética, o particípio hebraico pode apresentar uma ação futura como iminente ou certa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da terra do leste e da terra do pôr do sol”; a combinação dos dois extremos pode representar lugares distantes tanto a leste como a oeste.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz a fórmula profética de mensageiro em português atual, mantendo seu tom solene e autoritativo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino explícito e traduz צְבָאוֹת pelo título tradicional e abrangente “Exércitos”, sem restringi-lo apenas a forças humanas.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Marca a apresentação enfática do agir divino e preserva o registro profético solene.
- source_word: מוֹשִׁיעַ
  choice: vou salvar
  rationale: O particípio, após הִנְנִי, apresenta a ação divina como iminente ou firmemente determinada. “Vou salvar” expressa essa força futura e imediata em português natural.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Tradução direta da designação pactual, sem explicitação interpretativa.
- source_word: מֵאֶרֶץ מִזְרָח
  choice: da terra do leste
  rationale: Conserva o singular “terra” e a referência geográfica oriental.
- source_word: וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: e da terra onde o sol se põe
  rationale: Preserva de modo claro e poético a imagem hebraica do poente, em paralelo com o leste.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Valor temporal de מוֹשִׁיעַ na promessa divina
  choice: vou salvar
  alternative: salvarei / estou salvando
  rationale: A construção com הִנְנִי e o particípio pode apontar para ação iminente ou futura certa. “Vou salvar” preserva essa proximidade sem afirmar que a ação já está em andamento.
- issue: Alcance da expressão leste–poente
  choice: manter as duas imagens geográficas no texto
  alternative: traduzir de forma explicativa como “de lugares distantes do leste e do oeste”
  rationale: A formulação funciona como merismo, mas a tradução conserva a imagem e deixa sua abrangência indicada em nota, evitando eliminar a linguagem poética.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” mantém o tom profético elevado; “vou salvar” equilibra naturalidade e proximidade com o aspecto da construção hebraica. A imagem do sol poente foi preservada em linguagem corrente.
