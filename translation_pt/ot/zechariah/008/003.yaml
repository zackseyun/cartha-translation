- from: 'Assim diz Yahweh: “Voltei para Sião e habitarei no meio de Jerusalém. Jerusalém será chamada Cidade da Verdade[a], e o monte de Yahweh dos Exércitos[b] será chamado Monte Santo.”'
  to: 'Assim diz Yahweh: “Voltei para Sião e habitarei no meio de Jerusalém. Jerusalém será chamada a Cidade da Verdade[a], e o monte de Yahweh dos Exércitos[b], o Monte Santo.”'
