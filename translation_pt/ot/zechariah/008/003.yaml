  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁ֚בְתִּי אֶל צִיּ֔וֹן וְ/שָׁכַנְתִּ֖י בְּ/ת֣וֹךְ יְרֽוּשָׁלִָ֑ם וְ/נִקְרְאָ֤ה יְרוּשָׁלִַ֨ם֙ עִ֣יר הָֽ/אֱמֶ֔ת וְ/הַר יְהוָ֥ה צְבָא֖וֹת הַ֥ר הַ/קֹּֽדֶשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Voltei para Sião e habitarei no meio de Jerusalém. Jerusalém será chamada a Cidade da Verdade[a], e o monte de Yahweh dos Exércitos[b], o Monte Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Verdade” também pode ser traduzido por “fidelidade”, pois o termo hebraico pode indicar verdade, confiabilidade ou fidelidade.
    reason: lexical_alternative
  - marker: b
    text: O título “Yahweh dos Exércitos” também pode ser traduzido por “Yahweh das Hostes”. O termo hebraico pode referir-se a exércitos ou hostes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética convencional e representa diretamente o nome divino.
- source_word: שַׁבְתִּי
  choice: Voltei
  rationale: O perfeito qal apresenta o retorno como realizado, com relevância presente no contexto da restauração.
- source_word: אֶל צִיּוֹן
  choice: para Sião
  rationale: A preposição é direcional, e “Sião” é a forma consagrada em português.
- source_word: וְשָׁכַנְתִּי
  choice: e habitarei
  rationale: No contexto, o verbo tem força prospectiva após o retorno já declarado; “habitar” conserva a ressonância da presença permanente de Deus.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: no meio de Jerusalém
  rationale: Mantém o valor mais específico de בְּתוֹךְ, ressaltando a presença divina dentro da cidade.
- source_word: וְנִקְרְאָה יְרוּשָׁלִַם
  choice: Jerusalém será chamada
  rationale: Traduz naturalmente o nifal imperfeito feminino como passivo futuro.
- source_word: עִיר הָאֱמֶת
  choice: Cidade da Verdade
  rationale: É uma tradução direta que preserva a amplitude semântica de אֱמֶת, explicitada em nota.
- source_word: הַר יְהוָה צְבָאוֹת
  choice: o monte de Yahweh dos Exércitos
  rationale: Traduz צְבָאוֹת de forma transparente, mantendo-o como parte do título divino.
- source_word: הַר הַקֹּדֶשׁ
  choice: Monte Santo
  rationale: Expressa de modo natural a designação do monte como santo, em aposição ao sintagma anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome da aliança; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Força temporal de שַׁבְתִּי ... וְשָׁכַנְתִּי
  choice: Voltei ... e habitarei
  alternative: Volto ... e habito; voltei ... e habitei
  rationale: Distingue o retorno apresentado como realizado da habitação prometida como seu resultado contínuo, preservando a tensão temporal do enunciado profético.
- issue: Relação sintática de הַר יְהוָה צְבָאוֹת הַר הַקֹּדֶשׁ
  choice: o monte de Yahweh dos Exércitos será chamado Monte Santo
  alternative: e o monte de Yahweh dos Exércitos, o Monte Santo
  rationale: O verbo passivo “será chamada” pode reger também o segundo sujeito coordenado; repetir “será chamado” torna essa leitura clara em português sem alterar o sentido. A alternativa aposicional continua gramaticalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se “Sião”, “Yahweh”, “Cidade da Verdade” e “Monte Santo” como formas bíblicas reconhecíveis, sem linguagem arcaica. Os marcadores [a] e [b] aparecem imediatamente após as expressões a que se referem.
