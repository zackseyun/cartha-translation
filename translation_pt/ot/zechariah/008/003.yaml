    rationale: Em הַר יְהוָה צְבָאוֹת הַר הַקֹּדֶשׁ, «o Monte Santo» funciona naturalmente como aposição a «o monte de Yahweh dos Exércitos». Repetir o passivo transforma a aposição em segunda designação futura e excede o que o texto afirma explicitamente.
  - severity: low
    issue: A nota b formula de modo inadequado a alternativa de tradução do título.
    rationale: Ela repete parcialmente a própria tradução adotada e a expressão «exércitos celestiais» é uma explicitação interpretativa. A alternativa lexical pertinente para צְבָאוֹת é «hostes».
