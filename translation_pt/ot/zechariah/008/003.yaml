  source_fidelity: A primeira oração reproduz adequadamente o perfeito de retorno e a habitação prospectiva. Contudo, o hebraico apresenta «o monte de Yahweh dos Exércitos, o Monte Santo» em aposição ao final da designação de Jerusalém; não há um segundo verbo passivo explícito nem base segura para afirmar que o monte também «será chamado» Monte Santo.
  naturalness: A redação é clara e de registro bíblico moderno. A construção aposicional é igualmente natural em português e evita introduzir uma predicação não expressa no original.
  terminology: «Yahweh», «Sião», «Exércitos», «Cidade da Verdade» e «Monte Santo» são escolhas adequadas. A nota b atual é internamente imprecisa, pois diz que «Yahweh dos Exércitos» também é traduzido por uma forma que já começa com «Yahweh dos Exércitos», e introduz «celestiais», ausente do termo hebraico.
  issues:
