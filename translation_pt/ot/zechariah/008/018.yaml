  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: pt
  text: 'E a palavra de Yahweh dos Exércitos veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa; em português, seu sentido é expresso naturalmente ligando o verbo à chegada da palavra divina, sem o literalismo desnecessário de “e aconteceu”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דְּבַר יְהוָה designa uma comunicação divina específica. “A palavra” conserva a expressão profética tradicional sem explicá-la como “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva a imagem do título hebraico יְהוָה צְבָאוֹת e sua forma consagrada em português, sem reduzi-lo interpretativamente a “Todo-Poderoso”.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa de modo claro e digno o destinatário da palavra profética.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula introdutória de discurso e indica que o conteúdo vem no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: Todo-Poderoso; das hostes
  rationale: “Dos Exércitos” conserva a metáfora militar e a abertura referencial do hebraico, que pode abranger os exércitos celestes, sem transformar o título em uma interpretação abstrata.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura da fórmula profética foi preservada. Não se reproduziu a nota da camada inglesa porque ela parece estar deslocada e não documenta uma variante ou ambiguidade real deste texto hebraico.
