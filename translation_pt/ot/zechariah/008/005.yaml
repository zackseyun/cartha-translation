  text: וּ/רְחֹב֤וֹת הָ/עִיר֙ יִמָּ֣לְא֔וּ יְלָדִ֖ים וִֽ/ילָד֑וֹת מְשַׂחֲקִ֖ים בִּ/רְחֹֽבֹתֶֽי/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/005.yaml
  text: And the streets of the city will be filled with boys and girls playing in its streets[a].
translation:
  language: pt
  text: E as ruas da cidade ficarão cheias de meninos e meninas brincando nas ruas da cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as praças da cidade ficarão cheias de meninos e meninas brincando em suas praças”. O termo hebraico pode se referir a ruas largas ou a praças públicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְחֹבוֹת
  choice: E as ruas
  rationale: רְחֹבוֹת designa espaços públicos amplos, como ruas largas ou praças. “Ruas” é natural em português e permite conservar a repetição hebraica no fim do versículo.
- source_word: הָ/עִיר
  choice: da cidade
  rationale: עִיר é o termo comum para “cidade”; esta é a correspondência direta e natural no contexto.
- source_word: יִמָּלְאוּ
  choice: ficarão cheias
  rationale: O nifal imperfeito de מלא indica o estado futuro de esses espaços públicos estarem repletos. “Ficarão cheias” expressa esse resultado futuro com naturalidade em português.
- source_word: יְלָדִים
  choice: meninos
  rationale: Em contraste explícito com יְלָדוֹת, o plural masculino tem aqui sentido específico, “meninos”, e não o genérico “crianças”.
- source_word: וִֽ/ילָדוֹת
  choice: e meninas
  rationale: O plural feminino forma com יְלָדִים o par natural “meninos e meninas”.
- source_word: מְשַׂחֲקִים
  choice: brincando
  rationale: O particípio de שׂחק descreve a atividade alegre e comum das crianças na cidade restaurada; “brincando” é a equivalência mais clara no contexto.
- source_word: בִּ/רְחֹבֹתֶי/הָ
  choice: em suas ruas
  rationale: A expressão repete רְחֹבוֹת e traz um sufixo feminino singular que retoma “a cidade”. “Em suas ruas” preserva tanto a referência quanto a repetição enfática do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “ruas” foi mantida para refletir a estrutura e a ênfase do hebraico; a nota registra a ambiguidade lexical entre ruas largas e praças públicas.
