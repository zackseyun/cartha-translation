  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “O jejum do quarto mês[a], o jejum do quinto, o jejum do sétimo e o jejum do décimo se transformarão, para a casa de Judá, em júbilo, alegria e boas festas solenes[b]. Portanto, amem a verdade e a paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O quarto jejum, o quinto jejum, o sétimo jejum e o décimo jejum”. Em hebraico, os jejuns são identificados por números ordinais, provavelmente referentes aos meses.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão, para a casa de Judá, júbilo, alegria e boas festas solenes”. O verbo hebraico significa literalmente “serão”; “se transformarão” explicita a mudança indicada pelo contexto. A expressão traduzida por “festas solenes” também pode significar “tempos determinados”.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת pelo título português corrente, sem restringir a referência apenas a exércitos terrenos.
- source_word: צוֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּבִיעִי / הָעֲשִׂירִי
  choice: o jejum do quarto mês, o jejum do quinto, o jejum do sétimo e o jejum do décimo
  rationale: Os ordinais provavelmente designam os meses; explicitar “mês” na primeira ocorrência torna o idioma hebraico compreensível, enquanto a repetição de “jejum” acompanha a estrutura da fonte.
- source_word: יִהְיֶה
  choice: se transformarão
  rationale: Embora o verbo isoladamente signifique “serão”, o contexto apresenta a mudança dos jejuns em ocasiões festivas. O plural concorda naturalmente em português com a série de jejuns.
- source_word: לְבֵית יְהוּדָה
  choice: para a casa de Judá
  rationale: Mantém o sentido corporativo e pactual de “casa”, e “para” expressa adequadamente o valor benefactivo da preposição.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: em júbilo, alegria
  rationale: Conserva os dois substantivos próximos sem reduzi-los a uma única palavra; “júbilo” comunica alegria celebrativa e distingue o primeiro termo do segundo.
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: e boas festas solenes
  rationale: מוֹעֵד designa tempos determinados e frequentemente celebrações religiosas; “festas solenes” preserva a nuance calendárica e cultual em linguagem bíblica compreensível.
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: Portanto, amem a verdade e a paz
  rationale: O imperativo plural é mantido diretamente. “Portanto” explicita com moderação a passagem da promessa à resposta ética, sem alterar o conteúdo dos objetos.
theological_decisions:
- issue: Transformação dos jejuns comemorativos
  choice: Os jejuns se transformarão em ocasiões de júbilo, alegria e festas para Judá.
  alternative: Os jejuns simplesmente “serão” júbilo e alegria, ou serão abolidos e substituídos por festas.
  rationale: A formulação comunica a mudança de função indicada pelo contexto, mas não afirma a abolição das observâncias nem determina seu mecanismo histórico.
- issue: Valor discursivo da exortação final
  choice: “Portanto, amem a verdade e a paz.”
  alternative: “E amem a verdade e a paz” ou “Mas amem a verdade e a paz”.
  rationale: O imperativo é inequívoco, enquanto a ligação com a promessa anterior não é lexicalmente específica. “Portanto” representa a consequência prática sem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém “casa de Judá” e o título “Yahweh dos Exércitos”; evita arcaísmos verbais e linguagem denominacional. A pontuação apresenta a declaração divina como discurso direto.
