  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: pt
  text: 'E ele dirá: “Não sou profeta; sou um homem que trabalha a terra, pois um homem me adquiriu desde a minha juventude”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me comprou desde a minha juventude” ou “me tem como sua propriedade desde a minha juventude”. O verbo hebraico pode indicar adquirir, comprar ou possuir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: E ele dirá
  rationale: No discurso profético sobre o que acontecerá naquele dia, o perfeito com waw tem sentido futuro; a formulação mantém a continuidade do contexto.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente corrente e direto para a negação da identidade profética.
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: um homem que trabalha a terra
  rationale: Preserva אִישׁ, o valor participial de עֹבֵד e o sentido agrícola de אֲדָמָה, em português natural e claro.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a explicação apresentada pelo próprio falante.
- source_word: אָדָם
  choice: um homem
  rationale: Mantém o substantivo masculino singular e indefinido do texto massorético, sem convertê-lo em 'terra', leitura que exigiria outra relação sintática.
- source_word: הִקְנַנִי
  choice: me adquiriu
  rationale: Conserva o núcleo semântico amplo do hifil de קנה — adquirir, comprar ou tomar como propriedade — sem definir com precisão uma relação social que o hebraico deixa obscura.
- source_word: מִנְּעוּרָי
  choice: desde a minha juventude
  rationale: Expressa diretamente o valor temporal e evita acrescentar detalhes não presentes no hebraico.
theological_decisions:
- issue: Natureza da alegação do falante
  choice: Apresentar sem comentário a negação de ser profeta e a alegação de trabalho agrícola.
  alternative: Explicitar que se trata de um falso profeta disfarçando seu passado, ou de um antigo profeta que renunciou à atividade.
  rationale: O contexto envolve vergonha e repúdio da profecia, mas o versículo não determina se a declaração é sincera ou evasiva.
- issue: Relação expressa por הִקְנַנִי
  choice: Traduzir de modo amplo como 'me adquiriu'.
  alternative: Especificar 'me comprou', 'fez de mim seu servo' ou reinterpretar a terra como posse do falante.
  rationale: A forma verbal permite sentidos de aquisição, compra ou posse; manter a expressão ampla preserva a ambiguidade e a estranheza genuínas do texto massorético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “homem” reflete a repetição lexical do hebraico. A cláusula final permanece deliberadamente um pouco opaca, como no texto massorético, em vez de ser harmonizada com a ocupação agrícola.
