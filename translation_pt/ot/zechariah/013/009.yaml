  text: וְ/הֵבֵאתִ֤י אֶת הַ/שְּׁלִשִׁית֙ בָּ/אֵ֔שׁ וּ/צְרַפְתִּי/ם֙ כִּ/צְרֹ֣ף אֶת הַ/כֶּ֔סֶף וּ/בְחַנְתִּ֖י/ם כִּ/בְחֹ֣ן אֶת הַ/זָּהָ֑ב ה֣וּא יִקְרָ֣א בִ/שְׁמִ֗/י וַֽ/אֲנִי֙ אֶעֱנֶ֣ה אֹת֔/וֹ אָמַ֨רְתִּי֙ עַמִּ֣/י ה֔וּא וְ/ה֥וּא יֹאמַ֖ר יְהוָ֥ה אֱלֹהָֽ/י־־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: pt
  text: 'Farei a terça parte passar pelo fogo e os refinarei como se refina a prata; eu os testarei como se testa o ouro. Ele invocará o meu nome, e eu lhe responderei. Direi: “Ele é o meu povo”[a], e ele dirá: “Yahweh é o meu Deus”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa do plural (“os refinarei”, “os testarei”) para o singular, tratando o remanescente coletivamente. Em português mais fluente, poderia ser: “Eles são o meu povo”, e depois: “Yahweh é o nosso Deus”.'
    reason: Explica o singular representativo e registra a alternativa coletiva mais natural sem eliminar a mudança de número presente no texto.
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: a terça parte
  rationale: O ordinal feminino definido retoma a terça parte sobrevivente mencionada no versículo anterior. A expressão explicita em português o sentido partitivo.
- source_word: בָּאֵשׁ
  choice: pelo fogo
  rationale: Com o verbo de trazer ou fazer passar, descreve a entrada e a passagem por uma provação comparada ao refino de metais.
- source_word: וּצְרַפְתִּים
  choice: e os refinarei
  rationale: צרף é o verbo habitual para refinar metais. O pronome plural preserva a mudança do coletivo singular, “a terça parte”, para o plural hebraico.
- source_word: כִּצְרֹף אֶת־הַכֶּסֶף
  choice: como se refina a prata
  rationale: A construção comparativa é reproduzida por uma formulação impessoal natural em português, mantendo a imagem metalúrgica.
- source_word: וּבְחַנְתִּים
  choice: eu os testarei
  rationale: בחן indica pôr à prova ou verificar a autenticidade. “Testar” é claro e corresponde à prova do ouro no paralelismo.
- source_word: כִּבְחֹן אֶת־הַזָּהָב
  choice: como se testa o ouro
  rationale: Mantém o paralelismo com o refino da prata e a imagem da verificação da genuinidade do metal.
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: Ele invocará o meu nome
  rationale: קרא בשם frequentemente significa invocar alguém pelo nome, especialmente em oração ou culto. O singular representativo do hebraico foi preservado.
- source_word: וַאֲנִי אֶעֱנֶה אֹתוֹ
  choice: e eu lhe responderei
  rationale: A formulação conserva a referência singular coletiva e soa natural em português.
- source_word: עַמִּי הוּא
  choice: Ele é o meu povo
  rationale: A tradução mantém deliberadamente o pronome singular representativo diante do substantivo coletivo “povo”, sem transformar a declaração em plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: o meu Deus
  rationale: Reproduz diretamente a confissão pessoal da fórmula de aliança.
theological_decisions:
- issue: Pronomes da fórmula de aliança nas cláusulas finais
  choice: 'Manter o singular representativo: “Ele é o meu povo” e “Yahweh é o meu Deus”.'
  alternative: 'Regularizar para o plural: “Eles são o meu povo” e “Yahweh é o nosso Deus”.'
  rationale: O hebraico passa de sufixos plurais para pronomes singulares ao apresentar o remanescente coletivo como uma unidade representativa. A tradução conserva essa tensão significativa, esclarecendo-a em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o caráter de nome pessoal da aliança.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Farei ... passar pelo fogo” expressa naturalmente o processo de provação e refino. A construção marcada “Ele é o meu povo” é intencional e recebe nota explicativa.
