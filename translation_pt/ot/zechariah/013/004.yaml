  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: pt
  text: Naquele dia, cada profeta terá vergonha de sua visão quando profetizar; e não vestirá um manto de pelos[a] para enganar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um manto de pelo” — uma veste áspera associada à aparência profética.
    reason: lexical_alternative
  - marker: b
    text: Ou “para mentir”. O verbo hebraico pode indicar falsidade ou engano; neste contexto, a veste é usada para induzir outros ao erro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural em português a fórmula temporal profética. O valor futuro é comunicado pelos verbos seguintes, sem necessidade de uma introdução mais pesada como “acontecerá que”.
- source_word: יֵבֹשׁוּ הַנְּבִיאִים
  choice: os profetas terão vergonha
  rationale: Mantém o substantivo simples “profetas”, sem acrescentar “falsos”, e traduz o verbo como vergonha ligada às visões que alegavam ter.
- source_word: אִישׁ מֵחֶזְיֹנוֹ
  choice: cada um de sua visão
  rationale: Preserva a força distributiva de אִישׁ e entende a preposição como indicação daquilo de que cada profeta se envergonha.
- source_word: בְּהִנָּבְאֹתוֹ
  choice: quando profetizarem
  rationale: A construção com infinitivo e בְּ é tomada em sentido temporal. O plural concorda naturalmente com “os profetas”, enquanto “cada um” conserva a individualização da frase hebraica.
- source_word: וְלֹא יִלְבְּשׁוּ
  choice: e não vestirão
  rationale: Tradução direta e idiomática do ato de usar a peça distintiva.
- source_word: אַדֶּרֶת שֵׂעָר
  choice: um manto de pelos
  rationale: Conserva a imagem concreta de uma veste exterior áspera ou feita de pelos, associada à aparência profética.
- source_word: לְמַעַן כַּחֵשׁ
  choice: para enganar
  rationale: O verbo pode exprimir falsidade, mentira ou engano. Neste contexto, “enganar” comunica naturalmente a finalidade de adotar uma aparência profética para induzir outros ao erro.
theological_decisions:
- issue: Identificação explícita dos profetas como falsos
  choice: Manter “os profetas”
  alternative: “os falsos profetas”
  rationale: Embora o contexto condene a profecia enganosa, o hebraico deste versículo diz apenas “os profetas”. A tradução deixa que o contexto forneça a avaliação, sem acrescentá-la ao substantivo.
- issue: Natureza da vergonha
  choice: “terão vergonha”
  alternative: “serão envergonhados”
  rationale: A forma hebraica permite descrever vergonha ou desonra sem definir plenamente se ela é sobretudo interior ou imposta pela exposição pública. A opção escolhida preserva essa relativa abertura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi ajustada para fluidez, preservando a distribuição individual de “cada um” e a ambiguidade contextual quanto à designação dos profetas.
