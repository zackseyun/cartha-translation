source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: pt
  text: 'E acontecerá que, se um homem ainda profetizar[a], seu pai e sua mãe, que lhe deram a vida, lhe dirão: “Você não viverá, porque falou mentiras em nome de Yahweh”. Então seu pai e sua mãe, que lhe deram a vida, o traspassarão[b] quando ele profetizar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltar a profetizar”. O hebraico עוֹד pode indicar uma ação que continua ou que se repete.
    reason: lexical_alternative
  - marker: b
    text: Ou “o apunhalarão” ou “o perfurarão”. O verbo hebraico indica perfurar com uma arma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Reproduz de modo natural a fórmula hebraica que introduz uma circunstância futura.
- source_word: כִּי יִנָּבֵא אִישׁ עוֹד
  choice: se um homem ainda profetizar
  rationale: O contexto admite valor condicional para כִּי com o imperfeito; “ainda” preserva a ideia de continuação ou persistência de עוֹד sem inserir falsidade no verbo “profetizar” antes que o próprio texto a declare.
- source_word: יֹלְדָיו
  choice: que o geraram
  rationale: Mantém a descrição concreta dos pais como aqueles que lhe deram origem; no plural, “geraram” é mais natural e inclusivo para pai e mãe do que o literalismo pouco idiomático “deram-no à luz”.
- source_word: לֹא תִחְיֶה
  choice: Você não continuará vivo
  rationale: Expressa a sentença solene de que sua vida não será preservada, evitando que o futuro português seja entendido apenas como previsão neutra.
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: falou mentiras
  rationale: Forma corrente e direta de exprimir a acusação de discurso falso.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Conserva tanto a fórmula representativa “em nome de” quanto o nome divino expresso no hebraico.
- source_word: וּדְקָרֻהוּ
  choice: o atravessarão
  rationale: דקר descreve perfurar com arma; “atravessarão” preserva a violência e a provável letalidade do ato sem acrescentar um instrumento não mencionado.
- source_word: בְּהִנָּבְאוֹ
  choice: quando ele profetizar
  rationale: Traduz naturalmente o infinitivo com בְּ em sentido temporal e liga o ato dos pais à atividade profética.
theological_decisions:
- issue: A severidade da ação dos pais contra o falso profeta
  choice: Preservar a sentença de morte e o ato violento praticado pelos próprios pais.
  alternative: Abrandar a passagem como simples rejeição, expulsão ou ferimento não letal.
  rationale: O hebraico reúne explicitamente “não viverá” e o verbo דקר, que indica perfuração com arma. A tradução não deve atenuar essa tensão.
- issue: Identificação da profecia como falsa
  choice: Traduzir inicialmente o verbo de modo neutro como “profetizar” e deixar a acusação “falou mentiras” definir sua falsidade.
  alternative: Antecipar a interpretação com “profetizar falsamente”.
  rationale: O verbo נבא não contém por si só a ideia de falsidade neste ponto; ela é declarada na fala dos pais.
- issue: O nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A forma “Yahweh” representa diretamente o nome divino presente no texto e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta para naturalidade contemporânea. Os dois marcadores aparecem no texto principal; a segunda nota foi posicionada junto ao verbo violento que ela esclarece.
