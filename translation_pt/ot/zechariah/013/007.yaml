source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: pt
  text: “Ó espada, desperte contra o meu pastor, contra o homem que é meu companheiro[a] — declara Yahweh dos Exércitos[b]. Fira o pastor, e as ovelhas serão dispersas; voltarei a minha mão contra os pequenos[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu associado”, “aquele que está próximo de mim”; possivelmente, “meu igual”. O termo hebraico indica alguém estreitamente ligado a outra pessoa.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “SENHOR dos Exércitos”.
    reason: divine_name_rendering
  - marker: c
    text: Ou “voltarei a minha mão sobre os pequenos” ou “para os pequenos”. A expressão pode indicar ação contra eles ou, de modo mais geral, uma nova ação em relação a eles.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: Espada, desperte
  rationale: Preserva a apóstrofe e a personificação profética da espada, bem como o imperativo feminino singular, em português atual e solene.
- source_word: רֹעִי
  choice: meu pastor
  rationale: Tradução direta do particípio substantivado com sufixo de primeira pessoa, mantendo a relação possessiva.
- source_word: גֶּבֶר עֲמִיתִי
  choice: o homem que é meu companheiro
  rationale: “Homem” comunica aqui o sentido pessoal de גֶּבֶר sem acrescentar indevidamente a ideia de guerreiro; “companheiro” expressa associação próxima sem impor a leitura mais forte de igualdade.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: “Declara” traduz naturalmente a fórmula profética; o nome divino é representado como Yahweh, e צְבָאוֹת como “dos Exércitos”, expressão semanticamente transparente.
- source_word: הַךְ אֶת הָרֹעֶה
  choice: Fira o pastor
  rationale: O imperativo de נכה pede uma ordem direta e vigorosa; “fira” é atual, digna e mantém a força do hebraico.
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  choice: e as ovelhas serão dispersas
  rationale: Conserva a imagem concreta das ovelhas e apresenta sua dispersão como resultado do golpe contra o pastor.
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: voltarei a minha mão contra
  rationale: Mantém de perto o idioma hebraico e adota o sentido adversativo mais provável no contexto, deixando sua amplitude semântica registrada em nota.
- source_word: הַצֹּעֲרִים
  choice: os pequenos
  rationale: Preserva a abertura do termo a pessoas jovens, pequenas ou de menor condição, além de combinar com a imagem do rebanho sem restringi-lo a uma única referência.
theological_decisions:
- issue: Sentido de עֲמִיתִי na relação com o pastor
  choice: meu companheiro
  alternative: meu associado; aquele que está próximo de mim; possivelmente meu igual
  rationale: A tradução expressa proximidade e associação sem transformar uma possibilidade lexical mais forte em afirmação metafísica explícita. Assim, preserva-se o peso teológico do texto sem resolvê-lo denominacionalmente.
- issue: Sentido de voltar a mão sobre os pequenos
  choice: contra os pequenos
  alternative: sobre/para os pequenos, podendo indicar de modo mais geral uma nova ação em relação a eles
  rationale: O contexto de ferir e dispersar favorece ação adversa ou disciplinar, mas a construção não determina por si só toda a natureza dessa ação; a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A dicção é digna e profética, com paralelismo preservado. “Desperte” evita arcaísmo excessivo; “os pequenos” mantém a ambiguidade entre juventude, pequenez e condição inferior. As falas diretas foram pontuadas para deixar clara a ordem divina sem alterar a estrutura do versículo.
