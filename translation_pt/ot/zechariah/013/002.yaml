source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: pt
  text: E acontecerá, naquele dia — declara Yahweh dos Exércitos —, que eliminarei da terra[a] os nomes dos ídolos, e eles nunca mais serão lembrados. Também retirarei da terra os profetas[b] e o espírito impuro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do país”. O termo hebraico também pode referir-se a uma terra ou território específico.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “os profetas” são profetas ilegítimos associados à idolatria e à impureza; o hebraico não acrescenta o adjetivo “falsos”.
    reason: cultural_note
  - marker: c
    text: Ou “o espírito de impureza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula profética de introdução a um acontecimento futuro, com linguagem atual e solene.
- source_word: בַיּוֹם הַהוּא
  choice: naquele dia
  rationale: Mantém a fórmula temporal profética e sua ressonância, sem explicitar além do hebraico a natureza desse dia.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: “Declara” comunica naturalmente a fórmula de oráculo; “Yahweh” representa o nome divino, e “dos Exércitos” traduz צְבָאוֹת.
- source_word: אַכְרִית
  choice: eliminarei
  rationale: Expressa a remoção decisiva indicada pelo hifil de כרת, de modo natural em português, sem restringi-la à destruição física dos objetos.
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: os nomes dos ídolos
  rationale: Reproduz explicitamente “nomes” e traduz עֲצַבִּים pelo termo corrente “ídolos”, abrangendo a erradicação de seu culto e de sua memória.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: No contexto, refere-se provavelmente à terra habitada pela comunidade da aliança; “terra” preserva em português alguma amplitude sem impor “país” no texto principal.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: e eles nunca mais serão lembrados
  rationale: Mantém a construção passiva do hebraico e identifica naturalmente os nomes dos ídolos como referente.
- source_word: וְגַם
  choice: Também
  rationale: Conserva a força aditiva da expressão e produz ligação natural com a ação anterior.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Não acrescenta “falsos”, adjetivo ausente do hebraico, embora o contexto indique profetas ilegítimos.
- source_word: רוּחַ הַטֻּמְאָה
  choice: o espírito impuro
  rationale: Traduz a expressão de maneira idiomática e permite a leitura de uma realidade espiritual caracterizada pela impureza; a alternativa mais abstrata é registrada em nota.
- source_word: אַעֲבִיר
  choice: retirarei
  rationale: Comunica o sentido causativo de fazer desaparecer ou remover, em paralelo com a eliminação dos ídolos.
theological_decisions:
- issue: Se הַנְּבִיאִים deve ser explicitado como “os falsos profetas”
  choice: os profetas
  alternative: os falsos profetas
  rationale: A associação com idolatria e impureza mostra que o contexto trata de profetas ilegítimos, mas o texto hebraico não contém o adjetivo “falsos”. A tradução conserva a formulação e esclarece o contexto em nota.
- issue: Se רוּחַ הַטֻּמְאָה designa um espírito pessoal ou uma influência/condição de impureza
  choice: o espírito impuro
  alternative: o espírito de impureza
  rationale: A construção hebraica admite um espírito caracterizado pela impureza, mas não resolve completamente se a expressão deve ser entendida de modo pessoal ou mais abstrato. O texto principal usa a formulação idiomática, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem das orações conserva o caráter profético do hebraico sem recorrer a construções arcaicas. As notas preservam as ambiguidades relevantes de הָאָרֶץ, הַנְּבִיאִים e רוּחַ הַטֻּמְאָה.
