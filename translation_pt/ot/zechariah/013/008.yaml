  text: וְ/הָיָ֤ה בְ/כָל הָ/אָ֨רֶץ֙ נְאֻם יְהוָ֔ה פִּֽי שְׁנַ֣יִם בָּ֔/הּ יִכָּרְת֖וּ יִגְוָ֑עוּ וְ/הַ/שְּׁלִשִׁ֖ית יִוָּ֥תֶר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: pt
  text: E acontecerá em toda a terra — declara o SENHOR — que dois terços dela serão eliminados e morrerão, mas um terço permanecerá nela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: em toda a terra
  rationale: Mantém a formulação abrangente do hebraico e sua possível referência à terra mencionada no contexto, sem especificá-la além do texto.
- source_word: פִּי שְׁנַיִם
  choice: dois terços
  rationale: A expressão idiomática hebraica indica duas partes de um total de três; “dois terços” comunica isso naturalmente em português.
- source_word: יִכָּרְתוּ
  choice: serão eliminados
  rationale: O verbo כרת no nifal expressa ser cortado ou removido; “eliminados” preserva aqui o sentido de juízo destrutivo sem exigir uma imagem física literal.
- source_word: יִגְוָעוּ
  choice: morrerão
  rationale: גוע denota expirar ou morrer; “morrerão” é direto, natural e adequado ao paralelismo.
- source_word: יִוָּתֶר
  choice: permanecerá
  rationale: O nifal de יתר significa ser deixado ou permanecer; “permanecerá” expressa a sobrevivência do terço restante.
theological_decisions:
- issue: Identificação do referente de הָאָרֶץ
  choice: terra
  alternative: país
  rationale: “Terra” preserva a amplitude lexical e a ambiguidade contextual do hebraico, sem decidir explicitamente se o referente é o território de Israel ou uma extensão mais ampla.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por “SENHOR”, sem introduzir uma vocalização disputada.
translation_notes:
  register: Português moderno, claro e digno, com estrutura profética preservada. Os travessões destacam naturalmente a fórmula parentética “declara o SENHOR”. Não há notas de rodapé, portanto nenhum marcador é necessário.
