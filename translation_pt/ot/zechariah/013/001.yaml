source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
translation:
  language: pt
  text: Naquele dia, uma fonte[a] será aberta para a casa de Davi e para os habitantes de Jerusalém, para o pecado[b] e a impureza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nascente” ou “manancial”.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode significar “oferta pelo pecado”; neste contexto, a imagem de purificação favorece “pecado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “impureza ritual”. O termo hebraico pode referir-se especificamente à impureza menstrual ou, de modo mais amplo, à impureza cerimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética corrente; mantém a força de referência futura em português natural.
- source_word: יִהְיֶה ... נִפְתָּח
  choice: será aberta
  rationale: Reproduz de modo natural o valor futuro e a forma passiva do hebraico.
- source_word: מָקוֹר
  choice: fonte
  rationale: Designa uma nascente ou fonte de água corrente; “fonte” preserva bem a imagem de água disponibilizada para purificação.
- source_word: לְבֵית דָּוִיד
  choice: para a casa de Davi
  rationale: O לְ indica benefício ou disponibilidade; “para” comunica que a fonte é providenciada em favor da casa de Davi.
- source_word: וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: e para os habitantes de Jerusalém
  rationale: Tradução coletiva, clara e natural do particípio substantivado “os que habitam”.
- source_word: לְחַטַּאת
  choice: para a purificação do pecado
  rationale: חַטָּאת pode significar “pecado” ou “oferta pelo pecado”. A imagem da fonte e o termo paralelo favorecem aqui a finalidade purificadora; a nota preserva a alternativa lexical.
- source_word: וּלְנִדָּה
  choice: e da impureza
  rationale: נִדָּה pode indicar impureza ritual em sentido amplo e, em certos contextos, impureza menstrual; o termo geral é o mais adequado neste contexto profético.
theological_decisions:
- issue: Alcance da linguagem de purificação no contexto profético
  choice: Manter a imagem de uma fonte providenciada para purificação do pecado e da impureza, sem identificar explicitamente seu mecanismo.
  alternative: Explicar a fonte como expiação, sangue messiânico ou outro cumprimento doutrinário específico.
  rationale: O versículo anuncia um meio divinamente providenciado de purificação, mas não define aqui seu mecanismo. A tradução não deve antecipar uma interpretação teológica posterior.
- issue: Ambiguidade de חַטָּאת
  choice: “pecado” no texto principal, com a possibilidade de “oferta pelo pecado” em nota.
  alternative: “oferta pelo pecado” no texto principal.
  rationale: A associação com נִדָּה e a imagem de água favorecem o sentido de pecado como aquilo de que se é purificado, mas a polissemia legítima do substantivo hebraico deve permanecer visível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Naquele dia” conserva a fórmula profética; “será aberta” evita uma construção participial pouco natural. A explicitação discreta de “purificação” torna idiomática a relação final expressa por לְ sem definir o mecanismo teológico da fonte.
