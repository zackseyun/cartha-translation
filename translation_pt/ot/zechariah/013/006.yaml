base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: pt
  text: 'E, se alguém lhe perguntar: “Que feridas são estas entre as suas mãos?”[a], ele responderá: “Aquelas com que fui ferido na casa dos que me amam.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as suas mãos”. A expressão provavelmente se refere à região do peito ou do torso, isto é, “entre os seus braços”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na casa dos meus amantes”. O hebraico designa pessoas que amam o falante, sem definir com precisão a natureza dessa relação; também pode referir-se a companheiros íntimos.'
    reason: lexical_alternative
  - marker: c
    text: Alguns intérpretes cristãos entendem essas feridas de maneira messiânica, relacionando-as ao sofrimento do Messias; o próprio versículo não faz essa identificação de modo explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: E, se alguém lhe perguntar
  rationale: O sujeito indefinido é explicitado como “alguém”, e a condição implícita na sequência discursiva é expressa por “se”. “Perguntar” é natural em português diante da fala interrogativa que se segue.
- source_word: הַמַּכּוֹת הָאֵלֶּה
  choice: Que feridas são estas
  rationale: מַכּוֹת pode indicar golpes ou as lesões resultantes deles. “Feridas” corresponde melhor às marcas visíveis sobre as quais se pergunta.
- source_word: בֵּין יָדֶיךָ
  choice: entre as suas mãos
  rationale: Mantém a formulação concreta do hebraico e sua ambiguidade. O provável sentido idiomático referente ao peito ou torso é explicado em nota.
- source_word: וְאָמַר
  choice: ele responderá
  rationale: No diálogo, o verbo introduz a resposta do homem interrogado; “responderá” torna essa função explícita em português natural.
- source_word: אֲשֶׁר הֻכֵּיתִי
  choice: Aquelas com que fui ferido
  rationale: Preserva a voz passiva do hofal de נכה e retoma as feridas mencionadas na pergunta sem identificar quem as causou.
- source_word: בֵּית מְאַהֲבָי
  choice: na casa dos que me amam
  rationale: “Casa” traduz diretamente בֵּית, enquanto “os que me amam” conserva a força relacional do particípio מְאַהֲבָי sem restringi-lo a amigos nem impor uma conotação sexual.
theological_decisions:
- issue: Identificação do ferido com o Messias e das feridas com a crucificação
  choice: O texto principal não identifica explicitamente o homem como o Messias nem as feridas como as da crucificação.
  alternative: Uma leitura cristológica relaciona as feridas ao sofrimento e à crucificação do Messias; outra leitura entende o homem como um falso profeta que explica feridas cultuais ou disciplinares.
  rationale: O hebraico descreve um diálogo acerca de feridas visíveis, mas não nomeia o Messias nem menciona a crucificação. A tradução preserva essa tensão, e a interpretação cristológica histórica é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a imagem incomum “entre as suas mãos” para não eliminar a ambiguidade do hebraico, esclarecendo o provável sentido idiomático em nota.
