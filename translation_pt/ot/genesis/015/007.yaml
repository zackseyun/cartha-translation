  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: pt
  text: 'E ele lhe disse: “Eu sou Yahweh, que tirei você de Ur dos caldeus para lhe dar esta terra, a fim de que tome posse dela[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fim de que a herde” ou “a fim de que a possua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: E ele lhe disse
  rationale: O wayyiqtol dá continuidade à narrativa, e אֵלָיו indica que a fala é dirigida a Abrão. A formulação mantém a sequência hebraica em português natural.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A oração nominal hebraica requer a cópula em português; o nome divino é transliterado como “Yahweh”, preservando seu caráter de nome próprio.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: que tirei você
  rationale: O hifil de יצא expressa fazer alguém sair. “Tirei você” comunica diretamente essa ação e tem leitura natural no português brasileiro contemporâneo.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: de Ur dos caldeus
  rationale: Mantém o topônimo e a designação gentílica tradicional sem acrescentar informação interpretativa.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: para lhe dar esta terra
  rationale: O infinitivo com לְ expressa finalidade; “para lhe dar” reproduz essa relação de modo claro e conciso.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de que tome posse dela
  rationale: ירשׁ pode significar possuir, herdar ou tomar posse. Neste contexto, a formulação destaca a entrada na posse da terra sem reduzir o sentido à sucessão hereditária.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama como nome do falante. A transliteração “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de ירשׁ na promessa da terra
  choice: tome posse dela
  alternative: a herde; a possua
  rationale: O verbo comporta nuances de herdar e possuir. “Tomar posse” se ajusta à promessa de receber a terra, enquanto a nota conserva a alternativa lexical legítima “herdar”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição das construções de finalidade reflete a estrutura hebraica sem tornar a frase artificial; o tratamento por “você” torna explícito o objeto singular masculino indicado pelos sufixos hebraicos.
