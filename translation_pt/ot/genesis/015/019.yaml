  text: os queneus, os quenezeus e os cadmoneus[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico קַדְמֹנִי (qadmoni) está relacionado a «leste» ou «oriental»; aqui é vertido pelo etnônimo «cadmoneus», pois aparece em uma lista de povos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת / וְאֶת / וְאֵת
  choice: '[não traduzidos separadamente; as conjunções são expressas por «e»]'
  rationale: אֶת é marcador de objeto direto sem equivalente lexical próprio em português. O וְ que acompanha os dois últimos marcadores liga os elementos da enumeração e é traduzido por «e».
- source_word: הַקֵּינִי
  choice: os queneus
  rationale: O etnônimo definido no singular hebraico tem sentido coletivo. O plural português identifica naturalmente o povo e segue a forma consagrada em traduções bíblicas.
- source_word: הַקְּנִזִּי
  choice: os quenezeus
  rationale: Etnônimo coletivo em uma lista de povos; o plural é a forma natural em português.
- source_word: הַקַּדְמֹנִי
  choice: os cadmoneus
  rationale: Embora o termo se relacione etimologicamente com «leste» ou «oriental», o paralelismo com os demais nomes mostra que aqui funciona como etnônimo. A transliteração preserva essa função.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas etnônimas tradicionais e amplamente reconhecíveis. O artigo e o plural comunicam o valor coletivo dos substantivos hebraicos. O marcador [a] foi colocado junto de «cadmoneus», termo ao qual a nota efetivamente se refere.
