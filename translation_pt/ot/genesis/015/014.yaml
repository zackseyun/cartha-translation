  text: Mas também julgarei a nação à qual eles servirão[a]; depois disso, sairão com muitos bens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão escravizados por ela”. O verbo hebraico significa literalmente “servir”, mas, neste contexto, refere-se ao serviço forçado sob o domínio de uma nação estrangeira.'
