lexical_decisions:
- source_word: וְגַם
  choice: Mas também
  rationale: A combinação de וְ com גַם dá continuidade enfática ao anúncio anterior. “Mas também” expressa naturalmente em português tanto o contraste com a aflição dos descendentes quanto a ideia aditiva.
- source_word: הַגּוֹי
  choice: a nação
  rationale: גּוֹי designa aqui a potência estrangeira à qual os descendentes de Abrão servirão; “a nação” é direto e preserva a referência coletiva e política.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: à qual eles servirão
  rationale: עבד no qal significa literalmente “servir” ou “trabalhar para”. A formulação preserva o verbo explícito sem transformar no texto principal a servidão forçada implícita no contexto.
- source_word: דָּן אָנֹכִי
  choice: julgarei
  rationale: O particípio דָּן com o pronome enfático אָנֹכִי apresenta a ação divina com sentido futuro no contexto. “Julgarei” conserva o caráter judicial do verbo, sem reduzi-lo apenas a “castigarei”.
- source_word: וְאַחֲרֵי כֵן
  choice: depois disso
  rationale: A expressão marca a sequência temporal de modo claro e natural.
- source_word: יֵצְאוּ
  choice: sairão
  rationale: יצא significa “sair”. “Sairão” é conciso, idiomático e não acrescenta um ponto de vista espacial ausente do hebraico.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: com muitos bens
  rationale: רְכוּשׁ refere-se a bens, propriedades ou posses, e גָּדוֹל indica grande quantidade ou vulto. “Muitos bens” comunica de forma natural o sentido concreto da expressão.
theological_decisions:
- issue: Natureza da ação divina contra a nação opressora
  choice: julgarei
  alternative: castigarei
  rationale: דָּן pertence ao campo judicial. “Julgarei” preserva essa moldura jurídica e moral e não antecipa nem restringe o resultado do julgamento.
- issue: Natureza do serviço prestado pelos descendentes de Abrão
  choice: servirão, com nota indicando a escravização contextual
  alternative: serão escravizados por
  rationale: O hebraico emprega o verbo comum “servir”, enquanto o contexto mostra que se trata de serviço forçado. Manter “servirão” no texto e esclarecer em nota conserva tanto a forma lexical quanto a implicação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a linguagem judicial de “julgar”, conserva no texto principal o sentido lexical de “servir” e traduz a expressão concreta sobre propriedade como “muitos bens”.
