base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: pt
  text: 'Então ele o levou para fora e disse: “Por favor, olhe para os céus e conte as estrelas, se puder contá-las”. E lhe disse: “Assim será a sua descendência[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente”. O substantivo hebraico está no singular, mas tem sentido coletivo e pode referir-se ao conjunto dos descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: levou ... para fora
  rationale: O hifil de יצא tem sentido causativo, “fazer sair”. “Levou-o para fora” expressa esse movimento de modo claro e natural em português.
- source_word: הַחוּצָה
  choice: para fora
  rationale: A forma direcional indica movimento em direção ao exterior; “para fora” preserva essa nuance.
- source_word: הַבֶּט נָא
  choice: Por favor, olhe
  rationale: הבט é um imperativo, e נא suaviza o pedido ou lhe acrescenta apelo. “Por favor, olhe” comunica essa força em português atual.
- source_word: הַשָּׁמַיְמָה
  choice: para os céus
  rationale: A terminação direcional indica orientação para o alto. “Os céus” conserva o plural hebraico e um registro bíblico digno, sem deixar de ser compreensível.
- source_word: וּסְפֹר
  choice: e conte
  rationale: ספר significa aqui contar ou enumerar; “conte” é o equivalente corrente e preciso.
- source_word: הַכּוֹכָבִים
  choice: as estrelas
  rationale: Equivalente lexical direto e natural.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: se puder contá-las
  rationale: A oração condicional expressa capacidade. Esta formulação é concisa, natural e preserva o desafio implícito.
- source_word: כֹּה יִהְיֶה
  choice: Assim será
  rationale: A expressão introduz uma comparação quanto ao resultado ou à quantidade; “Assim será” conserva a formulação breve e solene do hebraico.
- source_word: זַרְעֶךָ
  choice: a sua descendência
  rationale: זֶרַע é singular na forma, mas frequentemente coletivo no sentido. “Descendência” é um substantivo singular e coletivo em português, preservando melhor essa característica do que “descendentes” e soando mais natural do que “semente” neste contexto.
theological_decisions:
- issue: Tradução de זַרְעֶךָ numa promessa com possível ressonância singular e coletiva
  choice: a sua descendência
  alternative: a sua semente; os seus descendentes
  rationale: “Descendência” mantém uma forma gramatical singular com sentido coletivo, sem tornar explícita uma pluralidade que o hebraico não marca morfologicamente nem impor de antemão uma leitura teológica singular. A nota registra a alternativa formal “semente”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação “o levou”, em vez de “levou-o”, favorece naturalidade no português do Brasil sem perder formalidade. O plural “céus” e a construção “Assim será” preservam o registro bíblico. A repetição de “disse” acompanha o texto hebraico, e a referência do sujeito permanece dependente do contexto.
