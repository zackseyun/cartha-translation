source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: pt
  text: Na quarta geração, eles voltarão para cá, pois a iniquidade dos amorreus ainda não estará completa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois a iniquidade do amorreu não está completa até aqui”. “O amorreu” é uma designação coletiva para esse povo; no contexto prospectivo, “até aqui” pode ser entendido como “até então”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: Na quarta geração
  rationale: Expressa de modo natural em português o valor temporal da expressão hebraica, mantendo o ordinal e sem exigir a reprodução isolada da conjunção inicial.
- source_word: יָשׁוּבוּ הֵנָּה
  choice: eles voltarão para cá
  rationale: שׁוּב indica retorno, e הֵנָּה aponta para o lugar mencionado no contexto; “para cá” comunica claramente direção.
- source_word: כִּי
  choice: pois
  rationale: 'Preserva a relação explicativa: a frase seguinte apresenta a razão para a demora do retorno.'
- source_word: לֹא שָׁלֵם
  choice: ainda não terá chegado à sua medida completa
  rationale: Comunica a ideia de algo que ainda não se completou ou encheu, de maneira idiomática e compatível com a perspectiva futura do contexto.
- source_word: עֲוֹן
  choice: iniquidade
  rationale: Mantém o sentido moral amplo de perversidade ou culpa sem reduzi-lo apenas ao ato de pecar ou ao sentimento subjetivo de culpa.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: Embora a forma hebraica seja singular, ela funciona coletivamente para designar o povo; o plural é natural em português.
- source_word: עַד הֵנָּה
  choice: até então
  rationale: No discurso prospectivo, a expressão aponta para o limite temporal mencionado; “até então” preserva esse sentido contextual, embora literalmente possa ser entendida como “até aqui”.
theological_decisions:
- issue: Demora do retorno e juízo sobre os amorreus
  choice: O retorno ocorre somente quando a iniquidade dos amorreus tiver chegado à sua medida completa.
  alternative: Explicitar que a demora demonstra a paciência divina ou visa principalmente à formação de Israel no Egito.
  rationale: O texto vincula expressamente o momento do retorno à iniquidade ainda incompleta dos amorreus, mas não desenvolve uma teoria mais ampla sobre a providência ou a paciência divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o vínculo causal e a imagem de uma medida moral que ainda não se completou.
