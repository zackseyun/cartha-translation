reference: Genesis 15:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: pt
  text: 'Então Abrão disse: “Eis que não me deste descendência[a], e eis que um filho da minha casa me herdará[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Descendência” traduz o hebraico zéra‘, literalmente “semente”, aqui no sentido de progenitura ou descendentes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “herdará os meus bens”; mais interpretativamente, “será o meu herdeiro”. O hebraico diz literalmente: “me herdará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: הֵן / וְהִנֵּה
  choice: Eis que / e eis que
  rationale: As duas partículas chamam atenção e dão ênfase à queixa de Abrão. A repetição preserva o paralelismo retórico do hebraico em registro digno.
- source_word: לִי לֹא נָתַתָּה
  choice: não me deste
  rationale: Reproduz de modo idiomático o objeto indireto e apresenta a falta de descendência como a situação resultante até aquele momento.
- source_word: זָרַע
  choice: descendência
  rationale: Embora o sentido literal seja “semente”, aqui o substantivo coletivo designa progenitura ou descendentes. “Descendência” preserva esse valor coletivo e o contexto da promessa.
- source_word: בֶן בֵּיתִי
  choice: um filho da minha casa
  rationale: Mantém a imagem familiar e doméstica da expressão hebraica sem especificar que se trata de um escravo, condição que este versículo não declara explicitamente.
- source_word: יוֹרֵשׁ אֹתִי
  choice: me herdará
  rationale: Preserva a construção incomum do hebraico, na qual Abrão é o objeto direto de “herdar”, deixando audível sua possível força metonímica em vez de substituí-la silenciosamente por uma interpretação.
theological_decisions:
- issue: Identidade e condição social do herdeiro doméstico
  choice: “um filho da minha casa”
  alternative: “um escravo nascido em minha casa” ou “um membro da minha casa”
  rationale: O texto diz literalmente “filho da minha casa” e não emprega aqui o termo “escravo”. A tradução evita acrescentar uma condição social que só pode ser inferida do contexto.
- issue: Sentido da expressão “me herdará”
  choice: Manter Abrão como objeto direto de “herdar” no texto
  alternative: “herdará os meus bens” ou “será o meu herdeiro”
  rationale: A formulação hebraica é deliberadamente concisa e pode usar Abrão por metonímia para seus bens, sua casa ou sua posição. A tradução conserva a tensão, enquanto a nota oferece equivalentes interpretativos naturais.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” foi mantido por sua força enfática e pelo paralelismo das duas partículas hebraicas. A expressão pouco usual “me herdará” conserva uma ambiguidade genuína do original, esclarecida sem ser eliminada pela nota.
