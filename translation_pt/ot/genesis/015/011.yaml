  text: As aves de rapina desceram sobre as carcaças[a], e Abrão as enxotou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A ave de rapina desceu sobre as carcaças”. O substantivo hebraico está no singular e pode ter sentido coletivo; aqui, provavelmente se refere a aves que se alimentam de carniça.'
