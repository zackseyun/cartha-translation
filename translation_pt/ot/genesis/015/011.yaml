lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceram
  rationale: O verbo ירד indica movimento para baixo. O plural em português concorda com a leitura coletiva de הָעַיִט e expressa naturalmente a aproximação das aves às carcaças.
- source_word: הָעַיִט
  choice: as aves de rapina
  rationale: עַיִט pode ser um singular coletivo. O contexto favorece um conjunto de aves necrófagas; “aves de rapina” preserva a abrangência do termo sem especificar indevidamente “abutres”.
- source_word: הַפְּגָרִים
  choice: as carcaças
  rationale: פֶּגֶר designa cadáver ou carcaça. Neste contexto de animais abatidos, “carcaças” é preciso e natural.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: as enxotou
  rationale: A forma causativa de שוב significa fazê-las recuar ou afastar-se. “Enxotou” comunica de modo conciso e idiomático a ação ativa de Abrão.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Emprega-se a forma portuguesa tradicional do nome nesta etapa da narrativa, antes de sua mudança para Abraão.
