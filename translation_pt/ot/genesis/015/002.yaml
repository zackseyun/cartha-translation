  rationale: A revisão substitui a conjunção condicional «se» por «pois», que transmite melhor a relação explicativa no contexto. A nota é ajustada para registrar também a possibilidade sucessória ligada à expressão hebraica difícil, sem apresentar como certa uma análise disputada.
