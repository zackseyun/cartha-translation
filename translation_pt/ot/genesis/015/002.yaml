    issue: «se sigo sem filhos» dá à oração circunstancial uma leitura condicional desnecessária.
    rationale: O hebraico וְאָנֹכִי הוֹלֵךְ עֲרִירִי significa literalmente algo como «e eu vou/continuo sem filhos» e, no contexto, explica a pergunta. «Se» em português normalmente introduz uma condição e torna a coordenação seguinte menos fluida.
