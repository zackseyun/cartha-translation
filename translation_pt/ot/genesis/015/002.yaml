base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: pt
  text: 'Mas Abrão disse: “Senhor Yahweh, que me darás, pois continuo sem filhos, e o herdeiro da minha casa[a] é Eliézer de Damasco?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o filho de mesheq da minha casa”, expressão incomum e de sentido incerto; também pode significar “o administrador da minha casa” ou “o possuidor/herdeiro da minha casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Abrão disse
  rationale: O waw consecutivo dá sequência à narrativa, enquanto “mas” expressa naturalmente a preocupação de Abrão em resposta à promessa anterior.
- source_word: אֲדֹנָי יֱהוִה
  choice: Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי, “Senhor”, quanto o nome divino יהוה, “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: מַה תִּתֶּן לִי
  choice: que me darás
  rationale: O imperfeito tem sentido futuro no contexto; a formulação é direta, natural e mantém a pergunta de Abrão.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: se sigo sem filhos
  rationale: “Sigo” conserva de modo idiomático a imagem de prosseguir no caminho da vida, enquanto “sem filhos” traduz claramente עֲרִירִי. A conjunção recebe valor circunstancial, explicando a pergunta.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: o herdeiro da minha casa
  rationale: A expressão hebraica é rara e obscura. Pelo contexto, designa a pessoa que receberia a casa ou os bens de Abrão; a tradução principal comunica esse sentido provável, e a nota preserva a dificuldade lexical e outras possibilidades.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Eliézer de Damasco
  rationale: A expressão identifica Eliézer por sua origem ou associação com Damasco; esta é a forma portuguesa mais natural.
theological_decisions:
- issue: Tradução do nome divino יהוה na fórmula אֲדֹנָי יֱהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: “Senhor Yahweh” distingue o título do nome próprio e representa explicitamente os dois elementos do hebraico.
- issue: Identidade e função de Eliézer em בֶן מֶשֶׁק בֵּיתִי
  choice: o herdeiro da minha casa
  alternative: o administrador da minha casa
  rationale: O contexto sucessório favorece “herdeiro”, mas a expressão não é lexicalmente inequívoca; a nota registra a possibilidade administrativa sem converter uma leitura incerta em afirmação dogmática.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Sigo sem filhos” preserva discretamente a metáfora hebraica do caminho da vida sem recorrer à formulação pouco idiomática “vou sem filhos”.
