id: GEN.15.15
reference: Genesis 15:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: pt
  text: Quanto a você, irá para os seus pais[a] em paz; será sepultado em boa velhice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «antepassados». O hebraico diz literalmente «pais», expressão que se refere à morte e à união com as gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: A conjunção acompanhada do pronome independente assinala uma mudança de tópico e põe Abraão em contraste com sua descendência; esta formulação comunica naturalmente essa ênfase.
- source_word: תָּבוֹא
  choice: irá
  rationale: Embora o verbo básico signifique «vir/entrar», nesta expressão ligada aos pais ele integra uma fórmula de morte; «irá» é natural em português e conserva a imagem de movimento.
- source_word: אֶל אֲבֹתֶיךָ
  choice: para os seus pais
  rationale: Mantém o sentido literal e a imagem familiar do hebraico. A nota oferece «antepassados» e esclarece que se trata de uma expressão referente à morte e à união com as gerações anteriores.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Preserva de modo conciso a amplitude de שָׁלוֹם, que inclui paz, integridade e bem-estar, sem reduzir a frase apenas à ausência de violência.
- source_word: תִּקָּבֵר
  choice: será sepultado
  rationale: Reproduz diretamente a forma passiva do verbo קבר em linguagem portuguesa atual e digna.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: em boa velhice
  rationale: Conserva tanto a idade avançada quanto a avaliação positiva expressa por טוֹבָה, usando uma formulação bíblica ainda clara em português.
theological_decisions:
- issue: Sentido de «irá para os seus pais»
  choice: Expressão referente à morte de Abraão e à sua união com as gerações anteriores, sem definir em detalhes o estado após a morte.
  alternative: Entendê-la apenas como sepultamento junto aos antepassados ou como afirmação explícita de convivência consciente com eles após a morte.
  rationale: A expressão funciona como fórmula de morte e é mais ampla que o local físico do sepultamento, pois Abraão não seria enterrado com seus pais imediatos. Ainda assim, o versículo não especifica uma doutrina completa do estado intermediário; por isso, a tradução mantém a imagem e sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe preserva o destaque dado a Abraão e o paralelismo das duas declarações, sem explicitar no corpo do texto mais do que o hebraico afirma.
