  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: pt
  text: Quando o sol se pôs e estava escuro, eis que um forno fumegante[a] e uma tocha em chamas passaram entre estes pedaços[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma fornalha fumegante». O termo hebraico designa um forno ou recipiente para fogo.
    reason: lexical_alternative
  - marker: b
    text: Os «pedaços» são as partes dos animais que Abrão havia cortado ao meio para a cerimônia da aliança (ver Gn 15:10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Quando
  rationale: Introduz naturalmente, em português, a circunstância temporal que conduz ao acontecimento seguinte, sem recorrer à fórmula arcaizante «e aconteceu que».
- source_word: הַשֶּׁמֶשׁ בָּאָה
  choice: o sol se pôs
  rationale: בוא, quando usado com «sol», é uma expressão idiomática para o pôr do sol; «se pôs» é claro, corrente e fiel.
- source_word: וַעֲלָטָה הָיָה
  choice: e já estava escuro
  rationale: עֲלָטָה indica escuridão ou trevas. «Já estava escuro» expressa com naturalidade o estado resultante, sem intensificar indevidamente o termo.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a apresentação vívida e solene da cena assinalada por הִנֵּה.
- source_word: תַנּוּר עָשָׁן
  choice: um forno fumegante
  rationale: תַנּוּר designa um forno ou recipiente de fogo. «Forno fumegante» mantém a imagem concreta e a amplitude lexical do hebraico; uma nota registra alternativas contextuais.
- source_word: לַפִּיד אֵשׁ
  choice: uma tocha em chamas
  rationale: לַפִּיד é «tocha», e אֵשׁ ressalta seu caráter ardente; «em chamas» é uma formulação portuguesa natural e imagética.
- source_word: אֲשֶׁר עָבַר
  choice: passaram
  rationale: A oração relativa hebraica apresenta a passagem dos dois elementos da cena. O plural em português evita sugerir que somente a tocha passou e assegura concordância natural com o sujeito composto.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: entre aqueles pedaços
  rationale: גְּזָרִים são as partes cortadas dos animais mencionadas anteriormente. «Aqueles pedaços» retoma esse referente de modo claro e natural.
theological_decisions:
- issue: Natureza dos objetos de fogo na cerimônia da aliança
  choice: Descrever somente o forno fumegante e a tocha em chamas, sem identificá-los explicitamente com o próprio SENHOR no texto traduzido.
  alternative: Explicitar que os objetos constituem uma manifestação da presença do SENHOR.
  rationale: O contexto mais amplo favorece a compreensão de uma manifestação divina, mas este versículo nomeia apenas os sinais visíveis. A formulação descritiva preserva a tensão teológica e evita inserir a interpretação no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Eis que» conserva a solenidade narrativa sem tornar o restante da frase arcaico. Os marcadores de nota foram colocados junto aos termos que efetivamente explicam.
