  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: pt
  text: 'Então ele disse: “Senhor Yahweh, como saberei que tomarei posse dela?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como saberei que a herdarei?”'
    reason: Alternativa lexical para אִירָשֶׁנָּה, de ירשׁ, que pode significar tanto tomar posse quanto herdar.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Então ele disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa. “Então ele disse” expressa essa progressão com naturalidade em português, sem acrescentar uma relação temporal forte.
- source_word: אֲדֹנָי יֱהוִה
  choice: Senhor Yahweh
  rationale: Reproduz o título אֲדֹנָי e representa diretamente o nome divino יהוה, evitando a combinação pouco natural “Senhor SENHOR”.
- source_word: בַּמָּה
  choice: como
  rationale: Embora a expressão signifique literalmente “por meio de quê?”, neste pedido de confirmação o português idiomático usa “como”.
- source_word: אֵדַע
  choice: saberei
  rationale: O imperfeito qal na pergunta aponta para o conhecimento ou certeza futura que Abrão procura obter.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Abrão deseja saber e corresponde naturalmente à conjunção integrante “que”.
- source_word: אִירָשֶׁנָּה
  choice: tomarei posse dela
  rationale: O verbo ירשׁ pode significar herdar, possuir ou tomar posse. No contexto da terra prometida no versículo anterior, “tomarei posse dela” comunica com clareza a aquisição efetiva, enquanto “a herdarei” permanece registrado em nota como alternativa legítima.
theological_decisions:
- issue: Representação do nome divino na expressão אֲדֹנָי יֱהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS; Senhor YHWH
  rationale: “Senhor Yahweh” preserva tanto o título quanto o nome divino presente no hebraico, sem substituir o Tetragrama por um título adicional.
- issue: Nuance de ירשׁ em relação à terra prometida
  choice: tomarei posse dela
  alternative: a herdarei
  rationale: A tradução principal ressalta a posse concreta da terra sem excluir a dimensão de herança; a alternativa é mantida em nota para preservar a amplitude lexical e a possível nuance pactual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da pergunta foi mantida natural, e o pronome “dela” retoma a terra mencionada no contexto imediato.
