  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: pt
  text: 'Naquele dia, Yahweh fez uma aliança com Abrão[a], dizendo: “À sua descendência dei esta terra, desde o rio do Egito[b] até o grande rio, o Eufrates.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “cortou uma aliança”, expressão idiomática que significa fazer uma aliança e provavelmente alude ao ritual descrito no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde o ribeiro do Egito” ou “desde o uádi do Egito”. O hebraico diz “rio do Egito”, mas a identificação geográfica exata é debatida.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural em português para uma ocasião específica, mantendo-se próxima do hebraico.
- source_word: כָּרַת ... בְּרִית
  choice: fez uma aliança
  rationale: O hebraico diz literalmente “cortou uma aliança”, mas “fez uma aliança” comunica o sentido idiomático com clareza; a imagem literal é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֶת אַבְרָם
  choice: com Abrão
  rationale: Embora Abrão esteja marcado como objeto direto no hebraico, a construção portuguesa idiomática é “fazer uma aliança com” alguém.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente de introduzir a declaração que especifica a aliança.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: “Descendência” preserva adequadamente o valor coletivo singular de זֶרַע e é natural no português contemporâneo.
- source_word: נָתַתִּי
  choice: dei
  rationale: O perfeito hebraico apresenta a concessão como efetuada e certa na declaração da aliança. O pretérito perfeito português preserva essa forma sem explicitar além do texto como se relaciona com o cumprimento histórico.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: “Terra” é a tradução natural no contexto de uma concessão territorial.
- source_word: מִנְּהַר מִצְרַיִם
  choice: desde o rio do Egito
  rationale: נָהָר significa normalmente “rio”; a possível identificação como ribeiro ou uádi é registrada em nota.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: até o grande rio
  rationale: “Até” expressa de modo conciso o limite territorial indicado por עַד.
- source_word: נְהַר פְּרָת
  choice: o Eufrates
  rationale: Designação portuguesa corrente, em aposição a “o grande rio”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Aspecto da concessão em נָתַתִּי
  choice: dei
  alternative: dou; tenho dado
  rationale: O perfeito hebraico formula a concessão divina como efetuada e certa. “Dei” mantém essa força declarativa, sem resolver a tensão entre a concessão da aliança e sua realização histórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se “Yahweh”, a formulação solene da concessão territorial e a ambiguidade geográfica por meio de nota.
