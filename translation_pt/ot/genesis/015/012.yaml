base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: pt
  text: Quando o sol estava para se pôr, um sono profundo caiu sobre Abrão. E eis que um grande terror de trevas caía sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um grande e sombrio terror» ou «um grande terror, envolto em trevas». O hebraico reúne de forma compacta as ideias de terror e escuridão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Quando o sol estava para se pôr
  rationale: A construção introduz a circunstância temporal e apresenta o pôr do sol como iminente. A formulação é natural em português e evita o arcaísmo «e aconteceu que».
- source_word: תַרְדֵּמָה
  choice: um sono profundo
  rationale: O substantivo denota sono pesado ou profundo, às vezes provocado por Deus. «Sono profundo» traduz diretamente o termo sem impor a interpretação mais específica de transe.
- source_word: נָפְלָה עַל אַבְרָם
  choice: caiu sobre Abrão
  rationale: Conserva a imagem do hebraico e o tom solene, sendo também uma expressão clara em português.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a função de chamar vividamente a atenção para o acontecimento seguinte.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: um grande terror, envolto em trevas
  rationale: A sequência hebraica associa de modo compacto terror, escuridão e grande intensidade. A formulação portuguesa preserva essa associação sem definir rigidamente a relação sintática ambígua entre «terror» e «trevas».
- source_word: נֹפֶלֶת עָלָיו
  choice: caía sobre ele
  rationale: O particípio hebraico apresenta a ação de forma vívida e em curso; o imperfeito português preserva essa nuance e distingue a expressão do perfeito anterior.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Natureza de תַרְדֵּמָה no contexto revelatório
  choice: sono profundo
  alternative: transe
  rationale: Embora o contexto seja visionário e o sono possa ser divinamente induzido, o substantivo designa mais diretamente um sono profundo. Traduzir «transe» afirmaria mais do que o termo isoladamente exige.
- issue: Relação entre terror e trevas em אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: um grande terror, envolto em trevas
  alternative: um grande terror de trevas; um grande e sombrio terror
  rationale: O hebraico comprime as duas ideias e admite mais de uma análise. A tradução mantém sua associação vívida sem transformar uma possibilidade sintática em certeza teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência brasileira. «E eis que» conserva deliberadamente a vivacidade literária do hebraico. O único marcador de nota, [a], aparece no texto principal.
