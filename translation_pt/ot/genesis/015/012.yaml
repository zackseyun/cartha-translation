    reason: lexical_alternative
  revision_rationale: A revisão substitui a formulação interpretativa «envolto em trevas» pela leitura mais próxima «terror de trevas», preservando a associação compacta e sintaticamente discutida entre terror e escuridão. A alternativa mais interpretativa é mantida na nota. O marcador foi deslocado para o fim da expressão traduzida, para ancorar de modo claro toda a expressão hebraica em questão.
