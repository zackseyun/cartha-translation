revisions:
- from: Quando o sol estava para se pôr, um sono profundo caiu sobre Abrão. E eis que um grande terror, envolto em trevas,[a] caía sobre ele.
  to: Quando o sol estava para se pôr, um sono profundo caiu sobre Abrão. E eis que um grande terror de trevas caía sobre ele.[a]
  rationale: A revisão substitui a formulação interpretativa «envolto em trevas» pela leitura mais próxima «terror de trevas», preservando a associação compacta e sintaticamente discutida entre terror e escuridão. A alternativa mais interpretativa é mantida na nota. O marcador foi deslocado para o fim da expressão traduzida, para ancorar de modo claro toda a expressão hebraica em questão.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:38:21Z'
review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz adequadamente a circunstância temporal, תַּרְדֵּמָה como «sono profundo» e a imagem de algo que cai sobre Abrão. «Caía sobre ele» representa bem o particípio נֹפֶלֶת, com aspecto vívido/progressivo. Porém, «envolto em trevas» acrescenta a noção de que o terror está cercado ou coberto por trevas; essa relação não é expressa pelo hebraico e reduz indevidamente a ambiguidade compacta de אֵימָה חֲשֵׁכָה גְדֹלָה.
  naturalness: O texto é claro, solene e natural em português moderno. «Quando o sol estava para se pôr» é idiomático; «E eis que» preserva apropriadamente o realce narrativo. «Um grande terror de trevas» é menos usual no português corrente, mas é aceitável em registro bíblico e é preferível aqui por sua proximidade e por não introduzir uma imagem adicional.
  terminology: «Abrão» é a forma portuguesa tradicional apropriada antes da mudança de nome. «Sono profundo» é uma tradução lexicalmente segura, sem impor «transe». «Terror» traduz adequadamente אֵימָה. A combinação «grande terror de trevas» preserva a tensão sintática entre terror e escuridão sem alegorizar ou explicar o enunciado.
  issues:
  - severity: medium
    issue: «envolto em trevas» introduz uma relação imagética não explicitada no hebraico.
    rationale: A expressão hebraica associa terror, trevas e grandeza de forma condensada. «Envolto» sugere que as trevas circundam o terror, uma elaboração interpretativa. «Grande terror de trevas» conserva melhor a construção e sua ambiguidade.
  revised_text: Quando o sol estava para se pôr, um sono profundo caiu sobre Abrão. E eis que um grande terror de trevas caía sobre ele.[a]
