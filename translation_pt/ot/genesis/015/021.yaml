  text: וְ/אֶת הָֽ/אֱמֹרִי֙ וְ/אֶת הַֽ/כְּנַעֲנִ֔י וְ/אֶת הַ/גִּרְגָּשִׁ֖י וְ/אֶת הַ/יְבוּסִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: pt
  text: e os amorreus, os cananeus, os girgaseus e os jebuseus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: e / coordenação da lista
  rationale: וְ dá continuidade à enumeração, enquanto אֶת marca cada objeto direto definido. Em português, a repetição do marcador de objeto não tem equivalente; uma coordenação natural preserva a função e a fluidez da lista.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O singular morfológico hebraico funciona como etnônimo coletivo. O plural é a forma idiomática em português para designar esse povo.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: O etnônimo coletivo singular é vertido naturalmente no plural, designando o povo cananeu.
- source_word: הַגִּרְגָּשִׁי
  choice: os girgaseus
  rationale: Forma portuguesa tradicional e inteligível do etnônimo, no plural para representar o coletivo hebraico.
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: O plural português expressa naturalmente o etnônimo coletivo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A coordenação evita repetir “e” diante de cada grupo, algo possível, mas pesado em português, sem alterar o caráter enumerativo do hebraico. Os nomes dos povos seguem formas bíblicas portuguesas amplamente reconhecidas.
