  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: pt
  text: 'Depois dessas coisas, a palavra de Yahweh veio a Abrão numa visão: “Não tenha medo, Abrão. Eu sou um escudo para você; sua recompensa será muito grande.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu sou o seu escudo e a sua recompensa muito grande.”'
    reason: Registra uma leitura alternativa da construção hebraica elíptica, na qual «sua recompensa muito grande» pode ser um segundo predicativo referente a Yahweh.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Mantém a amplitude de דְּבָרִים, que pode abranger as palavras e os acontecimentos narrados anteriormente, sem especificar além do hebraico.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a expressão revelatória hebraica e verte diretamente o nome divino.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: veio a Abrão
  rationale: É a forma idiomática em português para descrever a chegada de uma revelação, sem reproduzir de modo artificial a construção hebraica.
- source_word: בַּמַּחֲזֶה
  choice: numa visão
  rationale: O substantivo indica uma revelação visionária; o artigo hebraico é expresso naturalmente em português com o indefinido neste contexto.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural o discurso direto em português; o sentido introdutório de לֵאמֹר permanece claro sem o menos idiomático “dizendo”.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Proibição direta, clara e corrente em português moderno, equivalente ao hebraico.
- source_word: מָגֵן לָךְ
  choice: um escudo para você
  rationale: Conserva a construção do hebraico, que não traz sufixo possessivo em “escudo”, e permanece natural e compreensível.
- source_word: שְׂכָרְךָ
  choice: sua recompensa
  rationale: O termo pode significar pagamento, salário ou recompensa; “recompensa” se ajusta melhor ao contexto da promessa sem restringi-lo a remuneração laboral.
- source_word: הַרְבֵּה מְאֹד
  choice: será muito grande
  rationale: Supre o verbo implícito de maneira natural em português e expressa o valor promissório do contexto, sem esconder na nota a possibilidade de uma leitura nominal alternativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Relação sintática entre מָגֵן לָךְ e שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: “Eu sou um escudo para você; sua recompensa será muito grande”
  alternative: “Eu sou o seu escudo, sua recompensa imensamente grande”
  rationale: A leitura principal entende duas predicações e preserva mais diretamente לָךְ, “para você”. Como o hebraico é elíptico e admite que Deus seja identificado tanto como escudo quanto como recompensa, a alternativa é registrada sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Abrão” segue a forma tradicional portuguesa do nome nesta etapa da narrativa. A pontuação substitui naturalmente o particípio introdutório, e o marcador da nota foi colocado junto à cláusula a que a alternativa se refere.
