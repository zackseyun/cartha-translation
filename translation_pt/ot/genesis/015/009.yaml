  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: pt
  text: 'Então ele lhe disse: “Traga para mim uma novilha de três anos, uma cabra de três anos, um carneiro de três anos[a], uma rola e um pombinho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico repetido e traduzido como “de três anos” é tradicionalmente entendido aqui como indicação da idade dos três animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Então ele lhe disse
  rationale: O wayyiqtol dá continuidade à narrativa, e אֵלָיו é representado naturalmente por “lhe”; o referente contextual é Abrão.
- source_word: קְחָה לִי
  choice: Traga para mim
  rationale: Embora a expressão seja literalmente “tome para mim”, no contexto ela pede que os animais sejam obtidos e apresentados; “traga para mim” comunica esse sentido em português natural.
- source_word: עֶגְלָה
  choice: novilha
  rationale: Designa um bovino jovem do sexo feminino; “novilha” é preciso e corrente em português.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: de três anos
  rationale: Na lista de animais, a interpretação tradicional e contextual é que o termo indica idade, embora sua forma permita discussão; a nota preserva essa questão lexical.
- source_word: עֵז
  choice: cabra
  rationale: O substantivo feminino designa aqui uma cabra; a forma portuguesa já expressa naturalmente o sexo do animal.
- source_word: אַיִל
  choice: carneiro
  rationale: Equivalente português normal para o macho adulto da ovelha, inclusive em contextos rituais.
- source_word: תֹר
  choice: rola
  rationale: Nome específico da ave, mais preciso que o genérico “pomba”.
- source_word: גוֹזָל
  choice: pombinho
  rationale: No par ritual com תֹר, é tradicionalmente entendido como um pombo novo; “pombinho” é natural e conciso.
