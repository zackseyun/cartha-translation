  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: pt
  text: 'E eis que a palavra do SENHOR veio a ele, dizendo: “Este homem não será seu herdeiro; pelo contrário, aquele que sair das suas próprias entranhas será seu herdeiro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a partícula narrativa e o marcador enfático de atenção, em linguagem bíblica digna e ainda compreensível.
- source_word: דְבַר יְהוָה
  choice: a palavra do SENHOR
  rationale: Traduz דָּבָר de modo direto e representa o tetragrama pela convenção portuguesa SENHOR.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: Este homem não será seu herdeiro
  rationale: O demonstrativo masculino singular remete ao homem mencionado no contexto; a formulação explicita naturalmente esse referente sem identificá-lo além do que o texto permite.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: aquele que sair das suas próprias entranhas
  rationale: Mantém a imagem corporal concreta do hebraico, que indica descendência gerada pelo próprio Abrão, sem reduzir a expressão a uma paráfrase abstrata.
- source_word: הוּא יִירָשֶׁךָ
  choice: será seu herdeiro
  rationale: Expressa idiomaticamente o sentido jurídico e familiar do verbo ירשׁ neste contexto, preservando a ênfase do pronome hebraico por meio do contraste da frase.
theological_decisions:
- issue: Natureza da promessa de descendência
  choice: “aquele que sair das suas próprias entranhas”
  alternative: “um filho gerado por você”
  rationale: A escolha conserva a metáfora e a amplitude do texto hebraico, sem acrescentar formulação interpretativa ou resolver antecipadamente como a promessa se cumprirá.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. Mantém-se a solenidade narrativa de “e eis que” e a imagem concreta de “entranhas”; “SENHOR” em versaletes tipográficos convencionais representa o nome divino.
