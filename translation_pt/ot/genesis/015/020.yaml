base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: pt
  text: os hititas, os ferezeus e os refains[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gigantes”. Em alguns contextos, o hebraico refains pode ser entendido de modo descritivo; aqui, porém, provavelmente se refere a um povo da terra.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאֶת
  choice: e / assíndeto natural em português
  rationale: A conjunção וְ com o marcador de objeto אֵת acrescenta cada povo à lista iniciada no versículo anterior. O marcador não é traduzido; em português, a enumeração fica natural com vírgula e com “e” antes do último item.
- source_word: הַחִתִּי
  choice: os hititas
  rationale: Embora a forma hebraica seja singular, o gentílico com artigo tem sentido coletivo e designa um povo.
- source_word: הַפְּרִזִּי
  choice: os ferezeus
  rationale: O singular gentílico hebraico é coletivo. “Ferezeus” é a forma portuguesa consolidada e inteligível para o nome desse povo.
- source_word: הָרְפָאִים
  choice: os refains
  rationale: No contexto de uma lista de povos da terra, o termo funciona principalmente como nome étnico. A transliteração portuguesa “refains” preserva esse valor sem inserir no texto principal a interpretação “gigantes”.
theological_decisions:
- issue: Se רְפָאִים deve ser traduzido como nome étnico ou como descrição
  choice: 'Nome étnico: “refains”'
  alternative: “gigantes”
  rationale: Gênesis 15.19–21 enumera povos que habitavam a terra prometida a Abrão, favorecendo aqui a leitura étnica. A associação tradicional com “gigantes” é preservada em nota, sem resolver no texto principal uma ambiguidade que varia conforme o contexto.
translation_notes:
  register: Português moderno, digno e acessível, com formas gentílicas correntes na tradição bíblica lusófona. A coordenação foi ajustada ao uso natural do português. O marcador [a] foi colocado após “refains”, termo ao qual a nota efetivamente se refere.
