base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: pt
  text: Então Abrão trouxe todos esses animais para ele, cortou-os ao meio e pôs cada metade diante da outra; mas não cortou as aves ao meio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: Então Abrão trouxe ... para ele
  rationale: Embora לקח signifique normalmente “tomar/pegar”, o contexto imediato retoma a ordem de 15.9 (“traga-me”), de modo que “trouxe ... para ele” comunica naturalmente o movimento e preserva לוֹ como referência a Deus. O nome “Abrão” explicita o sujeito em português e evita uma sequência ambígua de pronomes.
- source_word: כָּל אֵלֶּה
  choice: todos esses animais
  rationale: O demonstrativo remete aos animais enumerados no versículo anterior. A explicitação de “animais” é contextual e torna o referente claro ao leitor moderno.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: cortou-os ao meio
  rationale: בתר descreve a divisão das carcaças; “cortar ao meio” reproduz de modo natural e concreto a ação ritual, enquanto בַּתָּוֶךְ indica a divisão pelo meio.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: e pôs cada metade diante da outra
  rationale: A construção distributiva אִישׁ ... רֵעֵהוּ significa “cada ... diante de seu correspondente”. “Cada metade diante da outra” expressa claramente a disposição espacial sem acrescentar uma ideia de pareamento alheia ao texto.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  choice: mas não cortou as aves ao meio
  rationale: O singular coletivo הַצִּפֹּר abrange as aves mencionadas no versículo anterior. O plural português torna essa referência inequívoca, e a repetição de “ao meio” esclarece que a ação anterior não foi aplicada a elas.
theological_decisions:
- issue: Linguagem do rito de aliança
  choice: Descrever concretamente os animais cortados e as metades dispostas uma diante da outra
  alternative: Acrescentar no corpo do versículo uma explicação de que se trata de uma cerimônia de celebração da aliança
  rationale: O contexto é de aliança, mas o versículo relata somente os preparativos concretos. A tradução preserva a força ritual da cena sem inserir uma interpretação explicativa no texto.
- issue: Referente de לוֹ
  choice: “para ele”, referindo-se a Deus
  alternative: “para si”, referindo-se a Abrão
  rationale: As duas nuances podem ser discutidas isoladamente, mas a ordem divina do versículo anterior, קָחָה לִי (“traga-me”), favorece fortemente que Abrão trouxe os animais para Deus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A coordenação narrativa foi mantida fluida; não há notas porque as alternativas não são necessárias para compreender nem para preservar uma ambiguidade substancial neste versículo.
