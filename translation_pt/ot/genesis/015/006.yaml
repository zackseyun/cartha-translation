  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: pt
  text: E ele creu no SENHOR[a], e o SENHOR lhe atribuiu isso como justiça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiou no SENHOR”.'
    reason: lexical_alternative
  - marker: b
    text: 'A sintaxe hebraica é geralmente entendida assim: o SENHOR atribuiu a Abrão o seu crer como justiça. Uma leitura menos provável entende Abrão como sujeito de “atribuiu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: E ele creu
  rationale: O hifil de אמן com בְּ expressa confiar ou crer em alguém. “Creu” é direto, natural e preserva a ligação verbal com a recepção posterior do versículo.
- source_word: בַּיהוָה
  choice: no SENHOR
  rationale: A preposição בְּ marca aquele em quem Abrão crê. O nome divino יהוה é representado pela forma tradicional “SENHOR” em versaletes.
- source_word: וַיַּחְשְׁבֶהָ
  choice: e o SENHOR lhe atribuiu isso
  rationale: חשב pode significar considerar, computar ou atribuir. A repetição explícita de “o SENHOR” esclarece em português o sujeito mais provável, enquanto “isso” mantém abstrato o referente do sufixo feminino, isto é, o ato de crer ou a resposta de Abrão.
- source_word: לּוֹ
  choice: lhe
  rationale: O pronome dativo comunica de modo idiomático que a atribuição foi feita a Abrão ou em seu favor.
- source_word: צְדָקָה
  choice: como justiça
  rationale: צְדָקָה designa aqui justiça ou condição de justo. “Como justiça” é conciso, tradicional e não acrescenta uma formulação doutrinária ausente do hebraico.
theological_decisions:
- issue: Sujeito de “atribuiu”
  choice: 'O SENHOR é o sujeito: Abrão creu no SENHOR, e o SENHOR atribuiu isso a Abrão como justiça.'
  alternative: Abrão é o sujeito e considerou o SENHOR — ou algo referido pelo sufixo — como justiça.
  rationale: O contexto e a recepção bíblica posterior favorecem fortemente o SENHOR como sujeito. Como o português não permite manter a alternância de sujeitos com a mesma naturalidade do hebraico, o sujeito é explicitado no texto, e a alternativa menos provável é registrada em nota.
- issue: Referente do sufixo feminino em וַיַּחְשְׁבֶהָ
  choice: O sufixo retoma de modo abstrato o ato de Abrão crer ou sua resposta de confiança, traduzido por “isso”.
  alternative: Explicitar “sua fé” ou “seu crer”.
  rationale: “Isso” preserva a referência abstrata sem inserir no texto um substantivo que não aparece expressamente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “SENHOR” segue a convenção para o tetragrama. A formulação evita jargão técnico como “imputou”, mas conserva a ideia de atribuição ou contabilização. Todos os marcadores de nota aparecem no texto principal.
