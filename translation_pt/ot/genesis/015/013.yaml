base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: pt
  text: 'Então ele disse a Abrão: “Saiba com toda a certeza que os seus descendentes viverão como estrangeiros[a] numa terra que não lhes pertence; serão escravizados e oprimidos[b] durante quatrocentos anos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como residentes estrangeiros”. O termo hebraico designa pessoas que vivem numa terra que não é a sua.
    reason: lexical_alternative
  - marker: b
    text: Ou “eles os escravizarão e oprimirão”. O hebraico não identifica expressamente quem pratica essas ações.
    reason: source_form_and_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Então ele disse a Abrão
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יָדֹעַ תֵּדַע
  choice: Saiba com toda a certeza
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação. A formulação preserva essa ênfase em português atual e digno.
- source_word: זַרְעֲךָ
  choice: os seus descendentes
  rationale: זֶרַע é um singular coletivo. “Descendentes” comunica de modo claro e natural a referência coletiva neste contexto.
- source_word: גֵר
  choice: viverão como estrangeiros
  rationale: גֵר designa quem reside em terra alheia sem ser natural dela. A expressão evita o sentido estritamente turístico de “peregrinos” e categorias jurídicas modernas.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: numa terra que não lhes pertence
  rationale: Expressa diretamente a falta de posse e a condição estrangeira indicada pelo hebraico.
- source_word: וַעֲבָדוּם
  choice: serão escravizados
  rationale: Embora o hebraico use uma construção ativa, o passivo em português evita a ambiguidade enganosa de dois pronomes plurais e comunica a servidão coerciva exigida pelo contexto.
- source_word: וְעִנּוּ אֹתָם
  choice: e oprimidos
  rationale: No piel, ענה denota afligir, humilhar ou oprimir. “Oprimidos” comunica naturalmente o tratamento severo neste contexto social.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: durante quatrocentos anos
  rationale: “Durante” torna explícita em português a função temporal da expressão, sem alterar a duração declarada.
theological_decisions:
- issue: Referente do sujeito plural em וַעֲבָדוּם וְעִנּוּ אֹתָם
  choice: 'Construção passiva: “serão escravizados e oprimidos”'
  alternative: “Eles os escravizarão e os oprimirão”
  rationale: O texto hebraico não nomeia os agentes, embora o contexto aponte para o povo da terra estrangeira. A voz passiva evita atribuir erroneamente as ações aos descendentes de Abrão e não acrescenta ao texto uma identificação explícita dos opressores.
- issue: Alcance temporal dos quatrocentos anos
  choice: Manter a expressão temporal ao fim da sequência, ligada gramaticalmente à escravização e opressão
  alternative: Reformular para fazer dos quatrocentos anos todo o período de residência estrangeira
  rationale: A posição hebraica permite tensão quanto ao alcance exato da duração. A tradução conserva a ordem e evita uma explicação cronológica importada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “Abrão”, forma tradicional e reconhecível do nome nesta etapa da narrativa. A voz passiva torna a relação entre vítimas e opressores clara sem nomear agentes que o hebraico deixa implícitos.
