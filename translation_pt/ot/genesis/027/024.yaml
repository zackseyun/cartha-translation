  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: pt
  text: 'Ele disse: “Você é mesmo[a] meu filho Esaú?” E ele disse: “Sou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Você é este, meu filho Esaú?” A formulação é uma pergunta enfática de identificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele perguntou
  rationale: Embora אָמַר signifique normalmente “dizer”, o contexto e a forma interrogativa tornam “perguntou” a expressão natural em português.
- source_word: אַתָּה זֶה
  choice: Você é mesmo
  rationale: A combinação do pronome independente com o demonstrativo dá ênfase à identificação; “mesmo” preserva essa força de modo idiomático.
- source_word: בְּנִי
  choice: meu filho
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo de primeira pessoa.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: O verbo é literalmente “disse”, mas aqui introduz a resposta à pergunta; “respondeu” é natural sem alterar o sentido.
- source_word: אָֽנִי
  choice: Sou
  rationale: O pronome hebraico constitui uma identificação breve. Em resposta a “Você é...?”, “Sou” é a forma portuguesa mais natural e concisa.
