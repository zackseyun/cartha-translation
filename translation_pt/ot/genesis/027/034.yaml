  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: pt
  text: 'Quando Esaú ouviu as palavras de seu pai, soltou um grito extremamente forte e amargo e disse a seu pai: “Abençoe também a mim, meu pai!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção com infinitivo introduz a circunstância temporal; esta formulação é natural e não acrescenta uma ideia indevida de imediatismo.
- source_word: דִּבְרֵי אָבִיו
  choice: as palavras de seu pai
  rationale: Preserva o sentido lexical de דָּבָר e o vínculo explícito com o pai, em registro claro e digno.
- source_word: וַיִּצְעַק צְעָקָה
  choice: soltou um grito
  rationale: O português natural evita a repetição pouco idiomática de verbo e substantivo cognatos, mas mantém a força do acontecimento por meio do substantivo e de seus intensificadores.
- source_word: גְּדֹלָה
  choice: alto
  rationale: Neste contexto, aplicado a um grito, comunica naturalmente sua grande intensidade sonora; a amplitude emocional permanece expressa por toda a frase.
- source_word: וּמָרָה
  choice: amargo
  rationale: Equivalente direto que preserva a imagem hebraica da amargura emocional e a profunda angústia de Esaú.
- source_word: עַד מְאֹד
  choice: muito
  rationale: Intensificador corrente e claro em português; modifica de modo natural a expressão coordenada “alto e amargo”.
- source_word: בָּרֲכֵנִי
  choice: Abençoe ... a mim
  rationale: Mantém o imperativo direto e urgente. A forma “abençoe” é amplamente compreensível e adequada à relação respeitosa com o pai.
- source_word: גַם אֲנִי
  choice: também a mim
  rationale: Reproduz a ênfase do pedido para que Esaú igualmente receba uma bênção, com ordem natural em português.
- source_word: אָבִי
  choice: meu pai
  rationale: Preserva o sufixo possessivo explícito e a carga afetiva e suplicante do tratamento.
