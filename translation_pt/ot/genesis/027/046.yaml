  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: pt
  text: 'Então Rebeca disse a Isaque: “Estou cansada da vida por causa das filhas de Hete.[a] Se Jacó tomar por esposa uma das filhas de Hete, como essas, uma das filhas desta terra, para que me servirá a vida?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das mulheres hititas” ou “das filhas dos hititas”.
    reason: Alternativa lexical para a designação étnica hebraica literalmente traduzida como ‘filhas de Hete’.
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Estou cansada da vida
  rationale: Reproduz em português natural o idioma hebraico de profunda aversão e enfado com a própria vida, sem intensificá-lo para ‘odeio’ ou ‘tenho nojo’.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição tem aqui valor causal, não espacial.
- source_word: בְּנוֹת חֵת
  choice: as filhas de Hete
  rationale: Preserva literalmente o enquadramento genealógico e o nome próprio חֵת; a identificação étnica mais explícita fica em nota.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Se Jacó tomar por esposa
  rationale: Expressa claramente o casamento e mantém a imagem verbal hebraica, sendo mais natural em português do que ‘tomar uma esposa’.
- source_word: כָּאֵלֶּה
  choice: como essas
  rationale: Mantém a referência demonstrativa às mulheres já em vista no contexto, provavelmente as esposas de Esaú.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: uma das filhas desta terra
  rationale: Preserva o paralelismo com ‘filhas de Hete’; ‘desta’ torna natural em português a referência à população local sem acrescentar uma identificação específica.
- source_word: לָמָּה לִּי חַיִּים
  choice: para que me servirá a vida?
  rationale: Transmite de modo idiomático a pergunta retórica sobre o valor ou propósito de continuar vivendo, sem convertê-la diretamente em ‘por que eu deveria viver?’.
theological_decisions:
- issue: Designação étnica de חֵת
  choice: Manter ‘filhas de Hete’ no texto principal
  alternative: mulheres hititas; filhas dos hititas
  rationale: A forma literal conserva tanto o nome hebraico quanto a apresentação genealógica do grupo. A equivalência étnica é informada em nota para facilitar a compreensão.
- issue: Força da pergunta final
  choice: para que me servirá a vida?
  alternative: que será da minha vida?; que valor terá a vida para mim?
  rationale: A formulação mantém a tensão emocional e o caráter retórico do hebraico sem transformar a fala em uma declaração direta de intenção suicida nem reduzir sua força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de ‘filhas’ foi mantida para refletir o paralelismo hebraico; ‘tomar por esposa’ conserva a expressão matrimonial sem soar excessivamente arcaica.
