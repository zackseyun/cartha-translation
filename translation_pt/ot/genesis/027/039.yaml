base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: pt
  text: 'Então Isaque, seu pai, respondeu e lhe disse: “Eis que a sua morada ficará longe da fertilidade da terra e longe do orvalho dos céus, do alto.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua morada estará na fertilidade da terra e sob o orvalho dos céus, do alto”. A preposição hebraica pode indicar tanto origem ou participação (“da”) quanto afastamento ou privação (“longe da”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Uso narrativo padrão de ענה para introduzir uma resposta; preserva a estrutura dialogal do hebraico.
- source_word: יִצְחָק אָבִיו
  choice: Isaque, seu pai
  rationale: Mantém tanto o nome quanto a relação familiar, com aposição natural em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe disse
  rationale: Reproduz a fórmula hebraica de introdução da fala sem tornar a frase obscura.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marcador solene de atenção, claro e digno no registro bíblico moderno.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: longe da riqueza da terra
  rationale: שְׁמַנִּים indica riqueza ou fertilidade. מִן é entendido em sentido privativo/separativo no contexto, sem ocultar a leitura alternativa.
- source_word: מוֹשָׁבֶךָ
  choice: a sua morada
  rationale: Expressa o lugar de habitação indicado pelo substantivo hebraico, em linguagem corrente e digna.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: e longe do orvalho dos céus
  rationale: Aplica coerentemente o sentido privativo de מִן à segunda expressão paralela.
- source_word: מֵעָל
  choice: lá do alto
  rationale: Preserva a ideia espacial de algo situado acima e liga-a naturalmente aos céus.
theological_decisions:
- issue: Sentido da preposição מִן nas palavras de Isaque a Esaú
  choice: 'Sentido privativo/separativo: “longe da” riqueza da terra e “longe do” orvalho dos céus'
  alternative: 'Sentido de origem ou participação: “da riqueza da terra” e “do orvalho dos céus”'
  rationale: O contexto da bênção reduzida de Esaú e o contraste com Gênesis 27:28 favorecem o sentido de afastamento ou privação. Como o hebraico admite também uma leitura positiva tradicional, ela é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. “Eis que” conserva a solenidade do pronunciamento; “morada”, “riqueza da terra” e “orvalho dos céus” mantêm a imagem hebraica com clareza. A ambiguidade decisiva da preposição é documentada em nota.
