base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: pt
  text: 'Então Jacó disse a seu pai: “Eu sou Esaú, seu primogênito. Fiz como o senhor me disse. Por favor, levante-se, sente-se e coma da minha caça, para que me abençoe[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para que sua alma me abençoe”. Aqui, a palavra hebraica traduzida literalmente como “alma” refere-se idiomaticamente à própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa a sequência naturalmente em português sem acrescentar uma relação causal.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Eu sou Esaú, seu primogênito
  rationale: Mantém a identificação direta e a aposição, preservando sem atenuação a afirmação enganosa de Jacó.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Fiz como o senhor me disse
  rationale: Tradução idiomática da referência às instruções anteriores de Isaque. “O senhor” comunica respeito filial e evita o tom excessivamente informal de “você”.
- source_word: קוּם נָא שְׁבָה
  choice: Por favor, levante-se, sente-se
  rationale: נָא dá tom de pedido cortês; os dois imperativos distintos são preservados, embora sua sequência seja incomum.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: e coma da minha caça
  rationale: צַיִד designa aqui o animal caçado ou sua carne preparada; “caça” é conciso e mantém a imagem do texto.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: para que me abençoe
  rationale: נֶפֶשׁ funciona aqui como referência idiomática à própria pessoa, não como afirmação antropológica sobre uma alma separada; a forma literal é registrada em nota.
theological_decisions:
- issue: Sentido de נַפְשֶׁךָ na expressão תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: para que me abençoe
  alternative: para que sua alma me abençoe
  rationale: A construção hebraica usa נֶפֶשׁ para a pessoa ou o próprio ser. A tradução idiomática evita sugerir que a “alma” atua separadamente, enquanto a nota preserva a forma e a nuance do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “o senhor” reflete a fala respeitosa de um filho ao pai; na oração final, o pronome é omitido naturalmente. A sequência incomum “levante-se, sente-se” foi mantida por corresponder aos dois imperativos hebraicos.
