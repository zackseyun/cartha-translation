  terminology: Os nomes, “primogênito”, “caça” e “abençoe” estão bem empregados. O tratamento “o senhor” é respeitoso e não altera o sentido. A nota explica de modo adequado o valor idiomático de “alma” sem impor uma conclusão doutrinária.
