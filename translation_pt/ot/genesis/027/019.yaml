  source_fidelity: 'A tradução transmite fielmente todos os elementos do hebraico: a progressão narrativa, a falsa identificação de Jacó como Esaú e primogênito, o cumprimento alegado das instruções de Isaque, a sequência de imperativos e a finalidade da bênção. “Para que me abençoe” reproduz corretamente o uso idiomático de נַפְשֶׁךָ para a própria pessoa, sem introduzir uma leitura antropológica indevida.'
