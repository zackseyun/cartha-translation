base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: pt
  text: 'Mas Jacó disse a Rebeca, sua mãe: “Veja, meu irmão Esaú é um homem peludo, e eu sou um homem de pele lisa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, sem os pelos corporais que caracterizavam Esaú.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Jacó disse
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “mas” expressa naturalmente que Jacó está levantando uma objeção ao plano de Rebeca.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Mantém a identificação relacional em aposição a Rebeca, conforme o hebraico.
- source_word: הֵן
  choice: Veja
  rationale: Reproduz em português atual a partícula que chama a atenção e introduz a preocupação de Jacó.
- source_word: אִישׁ שָׂעִר
  choice: um homem peludo
  rationale: Equivalente natural e direto da expressão hebraica, preservando a referência masculina e o contraste corporal.
- source_word: וְאָנֹכִי
  choice: e eu sou
  rationale: O pronome independente é enfático e estabelece contraste com Esaú; a formulação mantém a conjunção simples do hebraico.
- source_word: אִישׁ חָלָק
  choice: um homem de pele lisa
  rationale: Explicita de modo natural que חָלָק descreve a pele sem pelos, evitando que “homem liso” soe estranho ou sugira traço de caráter em português.
theological_decisions: []
