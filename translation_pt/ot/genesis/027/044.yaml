  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: pt
  text: Fique com ele por alguns dias, até que passe a fúria do seu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Fique
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar ou permanecer. Neste contexto, trata-se de permanecer temporariamente com Labão; “fique” é natural e claro em português.
- source_word: עִמּוֹ
  choice: com ele
  rationale: A preposição עִם com sufixo masculino singular significa diretamente “com ele” e remete a Labão no contexto imediato.
- source_word: יָמִים אֲחָדִים
  choice: por alguns dias
  rationale: A expressão significa literalmente “dias, alguns”. “Por alguns dias” preserva a expectativa de uma estada breve expressa por Rebeca, sem ajustá-la retrospectivamente à duração real.
- source_word: עַד אֲשֶׁר
  choice: até que
  rationale: A locução introduz o limite temporal da permanência de Jacó.
- source_word: תָּשׁוּב
  choice: passe
  rationale: שׁוּב significa literalmente “voltar” ou “retornar”; com “fúria” como sujeito, indica idiomaticamente que ela se afasta ou cessa. “Passe” comunica isso de modo natural em português.
- source_word: חֲמַת
  choice: a fúria
  rationale: חֵמָה denota ira intensa ou ardente. “Fúria” conserva essa intensidade melhor que o termo mais brando “raiva”.
- source_word: אָחִיךָ
  choice: do seu irmão
  rationale: 'A cadeia construta expressa posse: literalmente, “a fúria de seu irmão”.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. O imperativo “Fique” reproduz a instrução direta de Rebeca. A imagem literal de a fúria “voltar” foi vertida idiomaticamente por “passe”, sem alterar o sentido.
