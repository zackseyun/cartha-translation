  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: pt
  text: Então Rebeca pegou as roupas especiais de Esaú, seu filho mais velho,[a] que estavam com ela em casa,[b] e vestiu Jacó, seu filho mais novo, com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as melhores roupas de Esaú, seu filho mais velho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que ela tinha em casa”; mais literalmente, o hebraico diz “que estavam com ela em casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Então Rebeca pegou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: בִּגְדֵי
  choice: as roupas
  rationale: O plural construto designa peças de vestuário; “roupas” é claro, atual e natural para leitores de diferentes regiões.
- source_word: הַחֲמֻדֹת
  choice: especiais
  rationale: O termo indica algo estimado, desejável ou seleto. “Especiais” comunica que eram roupas valorizadas sem definir, além do hebraico, que fossem necessariamente as melhores.
- source_word: בְּנוֹ הַגָּדֹל
  choice: seu filho mais velho
  rationale: No contraste familiar com הַקָּטָן, גָּדוֹל indica o filho de maior idade.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: que estavam com ela em casa
  rationale: Mantém de perto a expressão hebraica de localização ou posse, sem acrescentar que Rebeca as guardava deliberadamente.
- source_word: וַתַּלְבֵּשׁ
  choice: vestiu ... com elas
  rationale: O verbo significa vestir alguém. A formulação portuguesa explicita naturalmente que as roupas mencionadas foram colocadas em Jacó.
- source_word: בְּנוֹ הַקָּטָן
  choice: seu filho mais novo
  rationale: קָטָן contrasta com Esaú quanto à idade, e não ao tamanho físico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Roupas” evita formalidade excessiva; “especiais” preserva a amplitude de הַחֲמֻדֹת. Todos os marcadores de nota aparecem no texto principal.
