revisions:
- from: 'Então Isaque estremeceu com um tremor muito forte e disse: “Quem foi, então, aquele que caçou a caça e a trouxe para mim? Eu comi de tudo antes que você chegasse e o abençoei. Sim, e ele será abençoado.”'
  to: 'Então Isaque estremeceu com um tremor muito forte e disse: “Quem foi, então, que caçou e me trouxe caça, e eu comi de tudo antes que você chegasse e o abençoei? Sim, ele será abençoado.”'
  rationale: A revisão restabelece a pergunta única exigida pela sintaxe hebraica e torna a expressão relativa à caça natural em português, sem restringir o sentido de צַיִד nem atenuar a intensidade da reação de Isaque ou a firmeza de sua declaração final.
