base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: pt
  text: 'Então Isaque estremeceu com um tremor muito forte e disse: “Quem foi, então, que caçou e me trouxe caça, e eu comi de tudo antes que você chegasse e o abençoei? Sim, ele será abençoado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: estremeceu com um tremor muito forte
  rationale: Preserva a construção intensiva com verbo e substantivo cognatos, bem como a reação física e emocional de Isaque, sem reduzi-la a um simples advérbio.
- source_word: מִי אֵפוֹא הוּא
  choice: Quem foi, então, aquele
  rationale: “Então” comunica a nuance inferencial e enfática de אֵפוֹא; o passado se ajusta à sequência narrativa.
- source_word: הַצָּד צַיִד
  choice: que caçou a caça
  rationale: Mantém a repetição cognata do hebraico e evita especificar indevidamente o tipo de animal; embora marcada, a expressão é compreensível em português.
- source_word: וַיָּבֵא לִי
  choice: e a trouxe para mim
  rationale: Explicita em português o objeto subentendido, retomando “a caça”.
- source_word: וָאֹכַל מִכֹּל
  choice: Eu comi de tudo
  rationale: Reproduz de modo natural a ideia partitiva de מִכֹּל no contexto dos alimentos trazidos.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: antes que você chegasse
  rationale: Expressa claramente a relação temporal e emprega uma construção corrente no português moderno.
- source_word: וָאֲבָרֲכֵהוּ
  choice: e o abençoei
  rationale: Conserva explicitamente a primeira pessoa verbal e o objeto masculino, de forma natural em português.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Sim, e ele será abençoado
  rationale: Comunica a confirmação enfática de גַּם e a força futura ou resultante de יִהְיֶה sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Força da declaração final de Isaque depois de concedida a bênção
  choice: Uma confirmação firme de que a bênção pronunciada permanecerá válida
  alternative: Um mero reconhecimento resignado, sem ênfase
  rationale: A formulação hebraica גַּם בָּרוּךְ יִהְיֶה tem força enfática. A tradução conserva o peso narrativo da declaração sem explicar como ou por que a bênção é eficaz e sem importar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção enfática hebraica foi preservada em “estremeceu com um tremor muito forte”; a fala mantém intensidade sem arcaísmos.
