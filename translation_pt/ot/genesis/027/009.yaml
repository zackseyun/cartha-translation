  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: pt
  text: Por favor, vá ao rebanho e pegue de lá, para mim, dois cabritos bons. Eu os prepararei como pratos saborosos[a] para o seu pai, do jeito que ele gosta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “iguarias”.'
    reason: Registra uma alternativa concisa para מַטְעַמִּים, termo que pode indicar pratos especialmente apetitosos ou requintados.
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Por favor, vá
  rationale: O imperativo לֶךְ recebe de נָא um tom de pedido ou insistência cortês; esta formulação é natural e preserva essa nuance.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” mantém a abrangência, enquanto a frase seguinte especifica os cabritos.
- source_word: וְקַח לִי מִשָּׁם
  choice: e pegue de lá, para mim
  rationale: לקח significa tomar ou pegar; a formulação comunica que os animais devem ser obtidos daquele rebanho em benefício da falante, sem acrescentar uma direção de movimento não expressa pelo verbo.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: dois cabritos
  rationale: A construção significa literalmente “dois filhotes de cabra”; “cabritos” expressa de modo claro e conciso tanto a espécie quanto a pouca idade.
- source_word: טֹבִים
  choice: bons
  rationale: טֹבִים indica que os cabritos devem ser de boa qualidade ou apropriados para o preparo, sem exigir a interpretação mais específica “escolhidos”.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Eu os prepararei como pratos saborosos
  rationale: מַטְעַמִּים refere-se a pratos especialmente saborosos ou iguarias; “pratos saborosos” é claro, atual e adequado ao contexto culinário.
- source_word: לְאָבִיךָ
  choice: para o seu pai
  rationale: Mantém diretamente a relação familiar e o registro digno da narrativa.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: do jeito que ele gosta
  rationale: A expressão descreve a preferência habitual de Isaque. Embora אָהֵב tenha o sentido básico de “amar”, em relação a comida o português idiomático pede “gostar”.
