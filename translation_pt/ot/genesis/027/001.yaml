    text: Ou “seu filho mais velho de todos”.
    reason: Alternativa lexical para הַגָּדֹל neste contexto; a expressão identifica Esaú como o filho de maior idade em contraste com Jacó.
  revision_rationale: A revisão substitui o ingressivo “envelheceu” pela descrição de estado “estava velho”, mais próxima de זָקֵן. Também ajusta a nota para uma alternativa que corresponde diretamente a הַגָּדֹל, sem acrescentar a noção de primogenitura. O restante preserva a estrutura, o sentido e o registro do original.
