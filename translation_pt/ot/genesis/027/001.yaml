base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: pt
  text: 'Aconteceu que, quando Isaque estava velho e seus olhos estavam fracos demais para enxergar, ele chamou Esaú, seu filho mais velho[a], e lhe disse:


    — Meu filho!


    E ele respondeu:


    — Aqui estou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu filho mais velho de todos”.
    reason: Alternativa lexical para הַגָּדֹל neste contexto; a expressão identifica Esaú como o filho de maior idade em contraste com Jacó.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Aconteceu que, quando
  rationale: Reproduz a abertura narrativa e introduz naturalmente a circunstância temporal, sem acrescentar um advérbio equivalente a “agora”, ausente do hebraico.
- source_word: זָקֵן
  choice: envelheceu
  rationale: Expressa em português corrente que Isaque havia chegado à velhice; no contexto, equivale ao predicado hebraico “era/estava velho”.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: seus olhos ficaram fracos demais para enxergar
  rationale: Comunica tanto o enfraquecimento da visão quanto a incapacidade resultante indicada pelo infinitivo מֵרְאֹת.
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Verbo simples e natural para o ato de chamar Esaú, sem a formalidade adicional de “convocou”.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Esaú, seu filho mais velho
  rationale: הַגָּדֹל distingue Esaú como o filho mais velho em relação a Jacó; esta formulação é clara e idiomática.
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o sufixo possessivo e o tom familiar da forma de tratamento.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Equivalente português tradicional e ainda corrente da fórmula de resposta que indica presença e prontidão.
