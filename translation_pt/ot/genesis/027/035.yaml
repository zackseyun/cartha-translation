base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: pt
  text: 'E ele disse: “Seu irmão veio com engano[a] e tomou a sua bênção.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de engano” ou “enganosamente”. Em hebraico, a expressão usa o substantivo “engano” com uma preposição e pode ser traduzida naturalmente de várias maneiras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: O wayyiqtol de אמר introduz a resposta de Isaque e mantém a sequência narrativa hebraica sem explicitar além do texto.
- source_word: בָּא
  choice: veio
  rationale: O qal perfeito de בוא descreve, neste contexto narrativo, uma ação passada e concluída.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Reproduz diretamente o substantivo com sufixo de segunda pessoa e preserva a força retórica do termo de parentesco.
- source_word: בְּמִרְמָה
  choice: com engano
  rationale: A construção com ב e o substantivo מִרְמָה pode indicar modo ou meio. “Com engano” preserva a forma nominal e sua carga moral, sem excluir as nuances “por meio de engano” ou “enganosamente”.
- source_word: וַיִּקַּח
  choice: e tomou
  rationale: O wayyiqtol de לקח prossegue a sequência narrativa; “tomou” é direto e evita intensificar o verbo como “arrebatou”.
- source_word: בִּרְכָתֶךָ
  choice: a sua bênção
  rationale: Tradução direta do substantivo com sufixo possessivo, mantendo a referência à bênção paterna destinada a Esaú.
