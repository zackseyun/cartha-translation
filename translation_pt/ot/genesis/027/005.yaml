  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: pt
  text: Rebeca estava ouvindo enquanto Isaque falava com Esaú, seu filho[a]. Então Esaú foi ao campo para caçar uma presa e trazê-la[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E Rebeca ouvia quando Isaque falava com Esaú, seu filho». A construção hebraica também admite esta forma mais próxima de sua estrutura, embora o texto principal destaque a ação em andamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para caçar uma presa a fim de trazê-la». A relação entre os dois infinitivos pode ser expressa como propósitos coordenados ou como um propósito subordinado ao outro.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Rebeca
  rationale: O וְ introduz a continuação da cena, mas não exige um marcador explícito como «agora»; em português, a progressão narrativa fica natural sem acrescentá-lo.
- source_word: שֹׁמַעַת
  choice: estava ouvindo
  rationale: O particípio apresenta a ação como contínua e de fundo enquanto Isaque falava. «Estava ouvindo» conserva esse aspecto sem decidir além do texto se Rebeca apenas ouvia ou escutava intencionalmente.
- source_word: בְּ/דַבֵּר
  choice: enquanto Isaque falava
  rationale: A preposição בְּ com o infinitivo construto indica simultaneidade. «Enquanto» expressa claramente a sobreposição das ações.
- source_word: אֶל עֵשָׂו בְּנוֹ
  choice: com Esaú, seu filho
  rationale: Em português, «falar com» é a forma idiomática de expressar a fala dirigida a alguém. «Seu filho» mantém a aposição possessiva do hebraico.
- source_word: וַ/יֵּלֶךְ
  choice: Então Esaú foi
  rationale: A forma narrativa faz a ação avançar. «Então» expressa essa sequência em português, sem atribuir ao termo um sentido temporal mais específico do que o contexto permite.
- source_word: הַ/שָּׂדֶה
  choice: ao campo
  rationale: «Campo» é o equivalente direto de שׂדה e, neste contexto, designa a área aberta onde Esaú iria caçar.
- source_word: לָ/צוּד צַיִד
  choice: para caçar uma presa
  rationale: צוד indica caçar, e ציד designa aquilo que se caça. «Uma presa» evita a redundância pouco natural de «caçar caça» e não restringe o animal a uma espécie específica.
- source_word: לְ/הָבִיא
  choice: e trazê-la
  rationale: O segundo infinitivo expressa o propósito de trazer o produto da caça. A coordenação é natural em português e o pronome retoma «uma presa».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se «veado/veado» ou «carne de caça», pois o hebraico não identifica a espécie nem explicita aqui a preparação da carne.
