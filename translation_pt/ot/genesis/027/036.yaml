base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: pt
  text: 'E ele disse[a]: “Não é por isso que ele se chama Jacó? Pois me passou para trás duas vezes: tomou o meu direito de primogenitura e agora, veja só, tomou a minha bênção.” E disse: “O senhor não reservou uma bênção para mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, há um jogo de palavras entre o nome “Jacó” e o verbo aqui traduzido por “me passou para trás”. O verbo também pode ser entendido como “me enganou” ou “levou vantagem sobre mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Não é com razão que ele se chama Jacó?
  rationale: Expressa naturalmente a pergunta retórica amarga de Esaú e mantém o nome Jacó em destaque para preparar o jogo de palavras.
- source_word: וַיַּעְקְבֵנִי
  choice: me passou para trás
  rationale: A expressão comunica engano e obtenção de vantagem em português corrente. Como não é possível reproduzir de modo natural a paronomásia hebraica com Jacó, ela é explicitada em nota.
- source_word: זֶה פַעֲמַיִם
  choice: já ... duas vezes
  rationale: Reproduz a contagem enfática do hebraico em formulação portuguesa natural.
- source_word: בְּכֹרָתִי
  choice: meu direito de primogenitura
  rationale: Torna claro que se trata da posição e dos direitos familiares do primogênito, evitando que “primogenitura” isolada soe excessivamente técnica.
- source_word: לָקָח
  choice: tomou
  rationale: Mantém o verbo simples do hebraico nas duas acusações paralelas.
- source_word: וְהִנֵּה עַתָּה
  choice: e agora, vejam só
  rationale: Conserva o caráter emotivo e demonstrativo de הִנֵּה em linguagem contemporânea e digna.
- source_word: בִּרְכָתִי
  choice: minha bênção
  rationale: Tradução direta, preservando o peso familiar e patriarcal da bênção no contexto.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: O senhor não reservou uma bênção para mim?
  rationale: “Reservou” expressa a ideia contextual de reter ou guardar algo para Esaú. O pronome de tratamento explicita de modo natural em português que ele se dirige respeitosamente ao pai.
