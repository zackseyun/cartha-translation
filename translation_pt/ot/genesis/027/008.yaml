translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A tradução verte o idiomatismo hebraico “escutar a minha voz” pelo português corrente “escute o que eu lhe ordeno”; a nota preserva a forma concreta do original.
