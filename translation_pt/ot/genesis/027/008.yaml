  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: pt
  text: Agora, meu filho, escute o que eu lhe ordeno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E agora, meu filho, escute a minha voz, conforme o que lhe ordeno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição imediata para a instrução seguinte; em português, “Agora” é natural, e a conjunção pode ser absorvida sem perda relevante.
- source_word: בְּנִי
  choice: meu filho
  rationale: Vocativo com sufixo de primeira pessoa; preserva de modo natural a forma de tratamento materna.
- source_word: שְׁמַע בְּקֹלִי
  choice: escute
  rationale: A expressão idiomática significa dar ouvidos ao que alguém diz, com obediência implícita. “Escute” preserva o sentido imediato sem explicitar demais como “obedeça”.
- source_word: לַאֲשֶׁר
  choice: o que
  rationale: Introduz o conteúdo específico ao qual Jacó deve dar ouvidos; a construção direta é clara e idiomática em português.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: eu lhe ordeno
  rationale: O pronome explícito é mantido para dar ênfase à pessoa que ordena; o particípio comunica uma ordem presente e imediata, expressa naturalmente pelo presente em português.
