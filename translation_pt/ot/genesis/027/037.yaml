  source_fidelity: 'A tradução representa adequadamente a estrutura e os principais termos hebraicos: Isaque estabelece Jacó como autoridade sobre Esaú, sujeita os irmãos de Jacó a ele, e o provê com cereais e vinho novo. A pergunta final conserva corretamente o imperfeito hebraico sem explicitar indevidamente a incapacidade de Isaque.'
  naturalness: O registro é claro e apropriado. Contudo, “E, para você, então, o que farei” soa um pouco calcado e menos fluente em português moderno. A ordem “E o que farei por você, então” preserva o contraste e a ênfase de לְךָ אֵפוֹא de modo mais natural.
  terminology: “Senhor”, “servos”, “cereais” e “vinho novo” são escolhas adequadas. Em “todos os seus irmãos”, o possessivo pode ser momentaneamente associado a Esaú em português; “todos os irmãos dele” esclarece que se trata dos irmãos de Jacó, como no hebraico, sem alterar o sentido.
