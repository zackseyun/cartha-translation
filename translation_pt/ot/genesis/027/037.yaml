    rationale: A construção frontal “para você, então” é possível, mas “o que farei por você, então” é mais idiomática e mantém o dativo enfático e a partícula conclusiva.
  - severity: low
    issue: Possível ambiguidade do possessivo em “todos os seus irmãos”
    rationale: Embora o antecedente gramatical pretendido seja Jacó (“ele”), a proximidade de “você” pode levar o leitor a vincular “seus” a Esaú. “Irmãos dele” torna explícita a referência sem introduzir interpretação adicional.
