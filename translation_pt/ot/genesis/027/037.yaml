base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: pt
  text: 'Isaque respondeu a Esaú: “Veja, eu o constituí senhor sobre você e entreguei a ele todos os irmãos dele como servos.[a] Eu o sustentei com cereais e vinho novo.[b] E o que farei por você, então, meu filho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como escravos”. O termo hebraico pode designar servos ou escravos, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “Eu o amparei com cereais e vinho novo”. O verbo hebraico ressalta apoio ou sustento e, neste contexto, também pode implicar provisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A fórmula narrativa introduz a resposta de Isaque. Em português atual, “respondeu” comunica naturalmente os dois verbos hebraicos sem reproduzir a redundância formular.
- source_word: הֵן
  choice: Veja
  rationale: Interjeição enfática que chama a atenção de Esaú para a realidade já estabelecida; “Veja” preserva sua força em linguagem atual.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: eu o constituí senhor sobre você
  rationale: שׂים com o predicativo גְּבִיר indica conferir uma posição de autoridade. “Constituí senhor” preserva a ideia de nomeação e domínio sem sugerir a função de professor, como poderia ocorrer com “mestre”.
- source_word: כָּל אֶחָיו
  choice: todos os seus irmãos
  rationale: Mantém o termo familiar concreto do hebraico, sem ampliá-lo desnecessariamente para “parentes” ou “descendentes”.
- source_word: לַעֲבָדִים
  choice: como servos
  rationale: עֶבֶד abrange servidão e escravidão. “Servos” expressa aqui a subordinação prevista na bênção, enquanto a nota registra a alternativa lexical mais forte.
- source_word: דָגָן
  choice: cereais
  rationale: Designa genericamente a produção de grãos, não apenas trigo; o plural coletivo é natural em português.
- source_word: תִּירֹשׁ
  choice: vinho novo
  rationale: Refere-se ao produto recente da videira, frequentemente em fórmulas de abundância agrícola; “vinho novo” conserva essa nuance.
- source_word: סְמַכְתִּיו
  choice: Eu o sustentei
  rationale: O verbo סמך tem o sentido de apoiar ou suster; com cereais e vinho novo, inclui a ideia de prover sustento sem reduzi-la apenas ao fornecimento material.
- source_word: וּלְכָה אֵפוֹא
  choice: E, para você, então
  rationale: Preserva tanto o contraste enfático com aquilo que foi dado a Jacó quanto a partícula conclusiva אֵפוֹא, mantendo o movimento retórico do hebraico.
- source_word: מָה אֶעֱשֶׂה
  choice: o que farei
  rationale: Traduz diretamente o imperfeito hebraico e deixa que o contexto comunique a limitação de Isaque, sem acrescentar explicitamente “posso” e resolver a força modal.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém o tratamento filial direto e afetuoso no fim da pergunta.
theological_decisions:
- issue: Força e irrevogabilidade da bênção pronunciada
  choice: A pergunta foi mantida como “o que farei”, sem explicitar incapacidade absoluta.
  alternative: “O que posso fazer por você?”
  rationale: O contexto sugere que Isaque tem pouco ou nada equivalente para conceder, mas a forma hebraica pergunta literalmente o que ele fará. A tradução evita transformar essa implicação narrativa em uma afirmação teológica mais categórica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A sintaxe da pergunta final conserva deliberadamente o contraste e a tensão do hebraico; “senhor” aparece em sentido humano e relacional.
