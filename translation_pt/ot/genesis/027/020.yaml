base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: pt
  text: 'Então Isaque perguntou ao filho: “Como foi que você encontrou tão depressa, meu filho?” Ele respondeu: “Porque Yahweh, o seu Deus, fez isso acontecer diante de mim[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez isso suceder diante de mim”. No contexto, também pode ser entendido como: “deu-me êxito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֶּה
  choice: Como foi que
  rationale: Expressa de modo natural em português a surpresa presente na pergunta idiomática hebraica, sem reproduzir de forma rígida o demonstrativo.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: você encontrou tão depressa
  rationale: Comunica naturalmente o resultado da ação apressada no contexto, em que Isaque estranha a rapidez com que a caça foi encontrada.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o possessivo de primeira pessoa e o tom de tratamento direto.
- source_word: כִּי
  choice: Porque
  rationale: Introduz claramente a explicação dada em resposta à pergunta de Isaque.
- source_word: הִקְרָה ... לְפָנָי
  choice: fez com que eu o encontrasse
  rationale: Verte de modo corrente a construção causativa, segundo a qual Deus fez que aquilo surgisse ou fosse encontrado diante do falante. A nota preserva uma forma mais próxima da imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: 'Mantém a importante segunda pessoa: Jacó diz ‘seu Deus’, e não ‘meu Deus’.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Causalidade providencial em הִקְרָה
  choice: fez com que eu o encontrasse
  alternative: deu-me êxito; fez que acontecesse diante de mim
  rationale: Mantém a força causativa da forma hebraica sem ampliar a declaração para uma formulação teológica mais forte; a nota registra a expressão mais literal.
- issue: Distanciamento possível em אֱלֹהֶיךָ
  choice: o seu Deus
  alternative: Deus
  rationale: Preserva a tensão narrativa potencial da fala de Jacó, sem interpretar por que ele evita dizer ‘meu Deus’.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” na fala familiar e preserva “Yahweh” e “o seu Deus” por sua relevância textual e narrativa.
