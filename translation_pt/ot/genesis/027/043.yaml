  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: pt
  text: Agora, meu filho, ouça o que eu digo; levante-se e fuja para junto de meu irmão Labão, em Harã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz uma instrução imediata; em português, o nexo conjuntivo não precisa ser expresso separadamente.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva a forma direta, familiar e masculina com que Rebeca se dirige a Jacó.
- source_word: שְׁמַע בְּקֹלִי
  choice: ouça o que eu digo
  rationale: Reproduz em português natural a expressão hebraica literalmente relacionada a ouvir a voz, sem explicitar demais a ideia implícita de obedecer.
- source_word: וְקוּם
  choice: levante-se
  rationale: Traduz o imperativo de קום em linguagem atual e digna, preservando-o como ordem distinta.
- source_word: בְּרַח לְךָ
  choice: fuja
  rationale: ברח exige a ideia de fuga; o dativo לְךָ não requer representação independente em português.
- source_word: אֶל לָבָן אָחִי
  choice: para junto de meu irmão Labão
  rationale: Expressa naturalmente o movimento em direção à pessoa, mantendo a relação familiar e evitando que Labão pareça ser o nome do destino geográfico.
- source_word: חָרָנָה
  choice: em Harã
  rationale: O ה direcional marca movimento rumo a Harã; como a direção já está expressa por 'para junto de', 'em Harã' identifica com clareza o lugar onde Labão está.
