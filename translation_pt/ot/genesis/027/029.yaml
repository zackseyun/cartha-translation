source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: pt
  text: Que povos sirvam a você, e nações se prostrem diante de você.[a] Seja senhor dos seus irmãos,[b] e que os filhos de sua mãe se prostrem diante de você. Malditos sejam os que amaldiçoarem você, e benditos sejam os que abençoarem você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe prestem homenagem”. O verbo hebraico pode indicar prostrar-se diante de um superior, humano ou divino; aqui o contexto favorece homenagem ou submissão, não necessariamente adoração.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “domine sobre os seus irmãos”. Aqui, “senhor” designa alguém que exerce autoridade e não é o título divino “Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: sirvam a você
  rationale: O qal de עבד com sufixo de objeto indica serviço ou sujeição prestados ao destinatário. “Sirvam a você” conserva a amplitude do hebraico e é natural em português.
- source_word: עַמִּים
  choice: povos
  rationale: Designa coletividades ou grupos étnicos; “povos” preserva o plural coletivo e o paralelismo com לְאֻמִּים.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: se prostrem diante de você
  rationale: O verbo descreve o ato de inclinar-se ou prostrar-se diante de um superior. A formulação preserva o gesto sem introduzir necessariamente a ideia de culto divino.
- source_word: לְאֻמִּים
  choice: nações
  rationale: Termo poético paralelo a עַמִּים; “nações” mantém a variação do paralelismo e a referência a grandes grupos humanos.
- source_word: הֱוֵה גְבִיר
  choice: Seja senhor
  rationale: A construção expressa uma bênção com força imperativa. גְבִיר designa alguém em posição de autoridade ou domínio; “senhor”, em minúscula, comunica essa posição sem tratá-lo como título divino.
- source_word: לְאַחֶיךָ
  choice: dos seus irmãos
  rationale: Com גְבִיר, a preposição לְ expressa a relação de autoridade. Em português, “senhor dos seus irmãos” comunica naturalmente o domínio familiar em vista.
- source_word: בְּנֵי אִמֶּךָ
  choice: os filhos de sua mãe
  rationale: Mantém a expressão familiar concreta do hebraico e sua possível ênfase nos irmãos ligados pela mesma mãe.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Malditos sejam os que amaldiçoarem você
  rationale: Reproduz a fórmula recíproca de maldição em português idiomático. O plural explicita o valor coletivo dos particípios hebraicos.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: e benditos sejam os que abençoarem você
  rationale: Mantém o paralelismo formal com a oração anterior. “Benditos” oferece linguagem dignificada e clara para a fórmula de bênção.
theological_decisions:
- issue: Linguagem de prostração diante de uma figura humana
  choice: se prostrem diante de você
  alternative: lhe prestem homenagem; adorem você
  rationale: O verbo hebraico pode indicar prostração diante de Deus ou de seres humanos. Neste contexto de supremacia política e familiar concedida na bênção, a tradução descreve o gesto sem decidir que se trate de adoração divina.
- issue: Título de autoridade sobre os irmãos
  choice: senhor dos seus irmãos
  alternative: amo dos seus irmãos; dominador de seus irmãos
  rationale: גְבִיר indica autoridade real sobre outras pessoas. “Senhor” em minúscula preserva a força do termo e evita identificá-lo com o título divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. “Você” mantém referência inequívoca ao destinatário; “prostrar-se diante de” conserva a imagem corporal do hebraico. O paralelismo poético e as fórmulas de maldição e bênção foram preservados.
