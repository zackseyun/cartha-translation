  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: pt
  text: “Traga-me uma peça de caça e prepare para mim pratos saborosos[a], para que eu coma e te abençoe perante Yahweh, antes que eu morra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comida saborosa”. O hebraico se refere a alimentos especialmente preparados e agradáveis ao paladar.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הָבִיאָה לִּי
  choice: Traga-me
  rationale: O hifil imperativo de בוא indica fazer algo chegar ao falante. “Traga-me” é direto, natural e conserva o destinatário expresso pelo pronome.
- source_word: צַיִד
  choice: uma caça
  rationale: O termo designa um animal capturado na caça ou o produto da caça. “Uma caça” se ajusta ao contexto sem restringir o sentido a carne de veado.
- source_word: וַעֲשֵׂה לִי
  choice: prepare para mim
  rationale: Embora עשה seja amplo, com o sentido de “fazer”, no contexto culinário “prepare” é a formulação portuguesa mais natural.
- source_word: מַטְעַמִּים
  choice: pratos saborosos
  rationale: O plural se refere a alimentos ou pratos especialmente preparados e agradáveis ao paladar. A escolha preserva o plural e é clara em português atual.
- source_word: וְאֹכֵלָה
  choice: para que eu coma
  rationale: O coortativo, depois dos imperativos, expressa propósito ou resultado pretendido.
- source_word: וַאֲבָרֶכְכָה
  choice: e te abençoe
  rationale: O piel coortativo com sufixo de segunda pessoa masculina singular expressa a ação que Isaque pretende realizar depois de comer; a coordenação mantém essa sequência.
- source_word: לִפְנֵי יְהוָה
  choice: perante Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”. “Perante” comunica o caráter solene da bênção, e “Yahweh” translitera o nome divino.
- source_word: לִפְנֵי מוֹתִי
  choice: antes que eu morra
  rationale: Esta é a expressão idiomática natural em português para a construção hebraica, sem alterar seu sentido temporal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega o nome divino. A transliteração “Yahweh” preserva o nome pessoal, enquanto “o SENHOR” representa a substituição tradicional por um título.
- issue: Sentido de לִפְנֵי יְהוָה na bênção
  choice: perante Yahweh
  alternative: na presença de Yahweh
  rationale: A formulação conserva a afirmação de que a bênção seria pronunciada diante de Deus, sem explicar além do que o hebraico declara.
translation_notes:
  register: Português atual, digno e acessível, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. A fala mantém o tom imperativo e solene do relato.
