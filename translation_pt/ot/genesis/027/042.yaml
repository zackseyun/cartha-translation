base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: pt
  text: 'Quando contaram a Rebeca o que Esaú, seu filho mais velho, havia dito, ela mandou chamar Jacó, seu filho mais novo, e lhe disse: “Veja, seu irmão Esaú está se consolando a seu respeito com a ideia de matar você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: o que ... havia dito
  rationale: Neste contexto, o plural hebraico significa as palavras ou declarações de Esaú; a formulação portuguesa é natural e preserva a referência ao que ele dissera.
- source_word: הַגָּדֹל / הַקָּטָן
  choice: mais velho / mais novo
  rationale: Os adjetivos distinguem os irmãos por idade; estas são as equivalências idiomáticas em português.
- source_word: מִתְנַחֵם
  choice: está se consolando
  rationale: 'Mantém a imagem incomum do hitpael de נחם: Esaú encontra consolo ou alívio diante do que pretende fazer, sem reduzir o verbo simplesmente a ''planejar''.'
- source_word: לְךָ
  choice: a seu respeito
  rationale: Expressa a relação de Esaú com Jacó nesse consolo hostil, preservando a amplitude da preposição sem sugerir benefício para Jacó.
- source_word: לְהָרְגֶךָ
  choice: com a ideia de matar você
  rationale: O infinitivo indica que a morte de Jacó é o conteúdo ou meio do consolo de Esaú; a expressão comunica essa relação em português natural sem afirmar mais detalhes do plano do que o texto fornece.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas a repetição relacional — filho mais velho, filho mais novo, seu irmão — foi preservada. A expressão desconcertante sobre Esaú consolar-se com a morte pretendida de Jacó permanece visível, sem harmonização psicológica.
