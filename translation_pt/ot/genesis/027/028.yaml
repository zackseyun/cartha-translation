  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: pt
  text: Que Deus lhe dê do orvalho do céu[a], da fertilidade da terra e fartura de cereais e de vinho novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “orvalho do céu [...] gordura da terra” ou “riqueza da terra”. O hebraico emprega imagens de fertilidade agrícola e abundância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Que ... dê
  rationale: O imperfeito com waw, no contexto da bênção de Isaque, expressa um desejo ou invocação; a construção portuguesa «Que Deus lhe dê» preserva essa força volitiva.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o hebraico use o artigo, אֱלֹהִים funciona aqui como o título definido «Deus»; «o Deus» seria pouco natural sem complemento em português.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: do orvalho dos céus
  rationale: A preposição מִן pode ter valor partitivo nesta fórmula de bênção. Em português, «dê do orvalho» preserva esse valor sem acrescentar o quantitativo explícito «um pouco»; o plural «céus» corresponde a שָׁמַיִם e é idiomático.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: da fertilidade da terra
  rationale: שְׁמַנֵּי significa literalmente a «gordura» ou «riqueza» da terra e, nesta imagem agrícola, refere-se à sua fertilidade. «Fertilidade» comunica o sentido com clareza sem perder a imagem de abundância produtiva.
- source_word: וְרֹב
  choice: e fartura de
  rationale: רֹב indica grande quantidade ou abundância. «Fartura» é natural, digna e adequada ao contexto de uma bênção agrícola.
- source_word: דָּגָן
  choice: cereal
  rationale: דָּגָן é um termo coletivo para a produção de grãos. «Cereal» evita que «grão» seja entendido apenas como unidade ou como uma espécie específica e funciona bem em português internacional.
- source_word: וְתִירֹשׁ
  choice: e de vinho novo
  rationale: תִּירוֹשׁ designa o vinho novo, produto recente da vindima, e deve ser distinguido do termo mais geral para vinho.
theological_decisions:
- issue: Natureza da declaração
  choice: 'Uma bênção expressa como desejo: «Que Deus lhe dê»'
  alternative: 'Uma afirmação simples no futuro: «Deus lhe dará»'
  rationale: A forma verbal e o contexto imediato favorecem uma invocação de bênção, não uma simples previsão. A tradução conserva a força performativa sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo da bênção e evita tornar explícito «um pouco de», já que a noção partitiva pode ser expressa naturalmente por «do/da».
