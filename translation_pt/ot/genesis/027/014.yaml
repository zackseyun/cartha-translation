  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: pt
  text: Então ele foi, pegou os cabritos e os levou à sua mãe; e sua mãe preparou comida saborosa, como seu pai gostava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ele foi
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: וַיִּקַּח
  choice: pegou os cabritos
  rationale: O objeto está implícito no hebraico e é recuperado do contexto imediato, no versículo anterior; explicitá-lo evita uma construção pouco natural e esclarece o referente.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: e os levou à sua mãe
  rationale: O objeto implícito continua sendo os cabritos. “Levou à sua mãe” transmite de modo natural o movimento indicado por בוא com ל.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: e sua mãe preparou
  rationale: Embora עשה seja amplo, “preparou” é a escolha idiomática e precisa quando o objeto é comida.
- source_word: מַטְעַמִּים
  choice: uma comida saborosa
  rationale: O substantivo designa alimento especialmente preparado e agradável ao paladar. “Comida saborosa” é claro e atual; o singular coletivo é natural em português.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: do jeito que o pai dele gostava
  rationale: A expressão comunica a conhecida preferência de Isaque. Em português atual, “gostava” é mais idiomático para comida do que o literal “amava”, sem eliminar o sentido contextual de אהב.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O encadeamento narrativo foi preservado, e os objetos implícitos foram explicitados a partir do contexto imediato. “O pai dele” evita a possível ambiguidade de “seu pai” sem introduzir informação nova.
