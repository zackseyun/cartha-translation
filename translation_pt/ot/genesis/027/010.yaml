base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: pt
  text: Depois, leve-a ao seu pai, e ele comerá, para que ele o abençoe antes de morrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Depois, leve-a
  rationale: O perfeito qal de segunda pessoa masculina singular, ligado pela conjunção, dá continuidade à sequência de instruções. O imperativo é natural em português; “Depois” explicita a progressão narrativa. O pronome “a” retoma a comida preparada no versículo anterior.
- source_word: לְאָבִיךָ
  choice: ao seu pai
  rationale: Tradução direta de אָב com sufixo de segunda pessoa masculina singular, em registro narrativo corrente e digno.
- source_word: וְאָכָל
  choice: para que ele coma
  rationale: Embora a forma verbal prossiga a sequência, no contexto o ato de comer integra a finalidade do plano. A construção portuguesa evita uma coordenação pesada e mantém a relação estreita com a bênção pretendida.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: para que
  rationale: A locução introduz finalidade. “Para que” é a forma natural em português e abrange conjuntamente a expressão preposicional e a partícula relativa.
- source_word: יְבָרֶכְךָ
  choice: abençoe você
  rationale: O piel imperfeito de ברך com sufixo de segunda pessoa indica que Isaque concederia a bênção a Jacó. “Abençoe você” é claro e preserva o sentido verbal direto.
- source_word: לִפְנֵי מוֹתוֹ
  choice: antes de morrer
  rationale: Equivalente idiomático da expressão nominal literal “antes da morte dele”. O sujeito continua sendo o pai, sem ambiguidade relevante em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega-se “você” para clareza da segunda pessoa no diálogo e “leve” como imperativo correspondente. A redação mantém a finalidade do plano de Rebeca sem acrescentar avaliação moral ou interpretação teológica.
