base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: pt
  text: 'Esaú disse a seu pai[a]: “Você tem apenas uma bênção, meu pai? Abençoe também a mim, meu pai!” Então Esaú levantou a voz e chorou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “A bênção é uma só para você, meu pai?” O hebraico expressa a angústia de Esaú diante da aparente existência de apenas uma bênção que Isaque pudesse conceder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Você tem apenas uma bênção
  rationale: A oração hebraica sem verbo, literalmente próxima de “A bênção é uma só para você?”, funciona no contexto como pergunta retórica angustiada. A formulação escolhida é clara e natural em português, sem acrescentar conteúdo além da cópula e da interrogação implícitas.
- source_word: אָבִי
  choice: meu pai
  rationale: O sufixo de primeira pessoa singular explicita a posse. A repetição nas duas ocorrências preserva o apelo emocionado de Esaú.
- source_word: בָּרֲכֵנִי גַּם אָֽנִי
  choice: Abençoe também a mim
  rationale: Mantém o imperativo direto de ברך, o objeto de primeira pessoa e a ênfase inclusiva de גַּם אָֽנִי, indicando que Esaú também deseja receber uma bênção.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: levantou a voz
  rationale: Equivalente português corrente do idiomatismo hebraico “ergueu sua voz”, aqui introduzindo um lamento audível.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: O verbo denota choro ou pranto; “chorou” é natural no português moderno e não se confunde, neste contexto, com apenas gritar.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Você” comunica naturalmente a segunda pessoa no português brasileiro; “a seu pai” evita ambiguidade referencial. A repetição de “meu pai” e o tom exclamativo preservam a intensidade emocional do hebraico.
