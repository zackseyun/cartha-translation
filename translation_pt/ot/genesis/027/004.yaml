base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: pt
  text: Prepare para mim uma comida saborosa[a], como eu gosto, e traga-a para mim, para que eu coma e então minha alma abençoe você[b] antes que eu morra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um prato saboroso” ou “iguarias”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “minha alma abençoe você”; expressão que se refere ao próprio Isaque em todo o seu ser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Prepare
  rationale: No contexto culinário, עשה significa preparar ou fazer; “prepare” expressa com naturalidade a ação solicitada.
- source_word: מַטְעַמִּים
  choice: uma comida saborosa
  rationale: O termo designa alimento especialmente preparado e agradável ao paladar. “Comida saborosa” é claro e corrente, sem restringir o sentido a um prato salgado.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: como eu gosto
  rationale: Expressa de modo natural em português a preferência pessoal de Isaque, preservando o sentido do hebraico.
- source_word: וְהָבִיאָה לִּי
  choice: e traga-a para mim
  rationale: Mantém a ordem direta para que a comida seja levada até o falante.
- source_word: וְאֹכֵלָה
  choice: para que eu coma
  rationale: O cohortativo indica a ação pretendida por Isaque após a comida lhe ser trazida; a construção final preserva essa relação.
- source_word: בַּעֲבוּר
  choice: a fim de que
  rationale: 'Aqui a expressão introduz a finalidade culminante da sequência: Isaque comer para então conceder a bênção.'
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: minha alma abençoe você
  rationale: Preserva נַפְשִׁי como sujeito explícito e mantém a força pessoal e integral da formulação hebraica, esclarecida em nota.
- source_word: בְּטֶרֶם אָמוּת
  choice: antes que eu morra
  rationale: Tradução direta e idiomática da oração temporal hebraica.
theological_decisions:
- issue: O sentido de נַפְשִׁי na fórmula de bênção
  choice: minha alma abençoe você
  alternative: eu abençoe você
  rationale: A tradução mantém a expressão antropológica do texto sem impor uma definição técnica de “alma”; a nota explica seu valor idiomático como referência ao próprio Isaque em sua pessoa inteira.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição das construções finais (“para que... a fim de que...”) conserva a progressão de propósito do hebraico, enquanto “como eu gosto” evita uma formulação excessivamente literal e pouco natural.
