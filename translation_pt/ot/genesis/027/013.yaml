  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: pt
  text: 'Sua mãe lhe disse: “Sobre mim caia a sua maldição, meu filho. Apenas ouça a minha voz[a] e vá buscá-los[b] para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “ouça a minha voz”, expressão que também pode significar “obedeça-me”.
    reason: lexical_alternative
  - marker: b
    text: O objeto de “busque” está implícito no hebraico e retoma os cabritos mencionados no versículo anterior; por isso, a tradução emprega “-los”.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; o pretérito perfeito simples é natural na narração portuguesa.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Reproduz diretamente o termo de parentesco com o sufixo masculino singular, em registro digno e corrente.
- source_word: עָלַי קִלְלָתְךָ
  choice: Sobre mim caia a sua maldição
  rationale: Preserva a ordem enfática que põe a mãe como portadora da consequência e expressa naturalmente em português a frase nominal hebraica.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém o vocativo afetivo com o sufixo de primeira pessoa.
- source_word: אַךְ
  choice: Apenas
  rationale: 'Expressa aqui a força restritiva da partícula: Jacó deve limitar-se a atender à instrução dela.'
- source_word: שְׁמַע בְּקֹלִי
  choice: ouça a minha voz
  rationale: Conserva a imagem verbal hebraica, que permanece compreensível em português, sem ocultar sua possível força idiomática de obedecer.
- source_word: וְלֵךְ קַח לִי
  choice: e vá buscá-los para mim
  rationale: Apresenta com naturalidade a sequência de imperativos; o pronome recupera os cabritos mencionados no versículo anterior, embora o objeto esteja elíptico no hebraico.
theological_decisions:
- issue: Responsabilidade pela eventual maldição
  choice: Sobre mim caia a sua maldição
  alternative: Eu assumo a sua maldição
  rationale: A formulação escolhida preserva a declaração enfática e sua tensão, sem explicá-la como uma transferência teológica formal nem reduzir seu sentido a uma simples assunção de responsabilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Sobre mim caia...” mantém a ênfase do hebraico sem soar excessivamente arcaica; “vá buscá-los” é idiomático e explicita apenas o objeto exigido pelo contexto.
