  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: pt
  text: Ele não o reconheceu, porque suas mãos eram peludas como as mãos de seu irmão Esaú; então ele o abençoou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele o abençoou”. A forma narrativa hebraica pode indicar simplesmente a sequência dos acontecimentos, embora aqui também possa sugerir resultado.'
    reason: alternativa de tradução da relação narrativa
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: não o reconheceu
  rationale: O hifil de נכר significa aqui reconhecer ou identificar. No contexto, Isaque não identifica Jacó pelo tato; “reconheceu” é natural e preciso em português.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão pela qual Isaque não reconheceu Jacó.
- source_word: יָדָיו
  choice: suas mãos
  rationale: Tradução direta do substantivo plural com sufixo masculino singular, referindo-se às mãos de Jacó.
- source_word: כִּידֵי
  choice: como as mãos de
  rationale: O prefixo כ־ expressa comparação; esta formulação conserva a comparação de modo natural.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Mantém diretamente o termo de parentesco com seu sufixo pronominal.
- source_word: שְׂעִרֹת
  choice: peludas
  rationale: O adjetivo descreve a característica tátil das mãos, essencial para o engano, de forma concisa e idiomática.
- source_word: וַיְבָרְכֵהוּ
  choice: por isso, ele o abençoou
  rationale: A forma narrativa faz a ação avançar e, neste contexto, permite explicitar a relação resultante entre o não reconhecimento e a bênção, sem eliminar a alternativa de simples sequência.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A repetição de “ele” na oração final evita ambiguidade quanto ao sujeito, e a nota preserva a possível leitura meramente sequencial do hebraico.
