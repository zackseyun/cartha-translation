base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: pt
  text: 'Então Jacó se aproximou de Isaque, seu pai, que o apalpou e disse: “A voz é a voz de Jacó, mas as mãos são as mãos de Esaú.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A voz é de Jacó, mas as mãos são de Esaú.”'
    reason: Alternativa mais concisa e idiomática para as construções nominais hebraicas, embora sem reproduzir integralmente a repetição do original.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: O qal de נגשׁ indica aproximar-se ou chegar perto. “Se aproximou” expressa com naturalidade o movimento narrativo.
- source_word: וַיְמֻשֵּׁהוּ
  choice: o apalpou
  rationale: מושׁ descreve aqui um exame pelo tato para confirmar a identidade. “Apalpou” comunica melhor essa ação deliberada do que o mais genérico “tocou”.
- source_word: הַקֹּל
  choice: A voz
  rationale: Embora קוֹל também possa significar “som”, o contexto trata do reconhecimento da identidade de quem fala; por isso, “voz” é a opção mais precisa.
- source_word: קוֹל יַעֲקֹב
  choice: a voz de Jacó
  rationale: A construção nominal hebraica é reproduzida naturalmente em português e preserva a repetição enfática do original.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: mas as mãos são as mãos de Esaú
  rationale: O hebraico apresenta uma oração sem verbo e repete “mãos” para dar ênfase. O verbo “são” é necessário em português, e “mas” explicita o contraste contextual expresso pelo waw.
- source_word: אָבִיו
  choice: seu pai
  rationale: Mantém a designação familiar explícita no hebraico e identifica com clareza a relação entre Jacó e Isaque.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “a voz é a voz” e “as mãos são as mãos” foi mantida por refletir a estrutura e a força retórica do hebraico; a formulação mais concisa aparece em nota.
