base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: pt
  text: 'E ele disse: “Traga isso para perto de mim, e comerei da caça de meu filho, para que minha alma te abençoe[a].” Então ele a levou para perto dele, e ele comeu; depois Jacó lhe trouxe vinho, e ele bebeu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático, “para que eu te abençoe”. Em hebraico: “para que minha alma te abençoe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: Traga isso para perto de mim
  rationale: O imperativo causativo de נגשׁ indica fazer chegar ou apresentar algo. “Para perto de mim” conserva o movimento concreto; “isso” explicita de modo natural o objeto implícito.
- source_word: וְאֹכְלָה
  choice: e comerei
  rationale: O coortativo expressa a intenção de Isaque. O futuro em português comunica essa intenção com naturalidade e preserva a sequência da ordem.
- source_word: מִצֵּיד בְּנִי
  choice: da caça de meu filho
  rationale: צַיִד designa o produto da caça. A contração “da” expressa naturalmente o sentido partitivo da preposição מִן.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva de maneira clara a relação de finalidade.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: minha alma te abençoe
  rationale: Mantém נַפְשִׁי como sujeito explícito e preserva a forma solene do idioma hebraico, sem reduzi-lo silenciosamente a “eu”.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: Então ele levou a comida para perto dele
  rationale: Retoma a ideia concreta do verbo נגשׁ. “A comida” explicita o objeto elíptico pelo contexto e evita uma referência pronominal pouco clara em português.
- source_word: יַיִן
  choice: vinho
  rationale: É o equivalente direto e comum de יַיִן.
- source_word: וַיֵּשְׁתְּ
  choice: e ele bebeu
  rationale: Traduz diretamente a forma narrativa de שׁתה.
theological_decisions:
- issue: A expressão נַפְשִׁי como sujeito da bênção
  choice: minha alma te abençoe
  alternative: eu te abençoe
  rationale: A tradução principal conserva o sujeito expresso no hebraico e sua força pessoal e solene; a nota oferece a formulação idiomática sem impor uma interpretação antropológica específica.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. Emprega “te” por ser natural e amplamente compreensível, mantendo a solenidade da fala sem recorrer a construções excessivamente arcaicas.
