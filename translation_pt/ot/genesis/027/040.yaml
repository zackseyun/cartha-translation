  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: pt
  text: Você viverá pela sua espada e servirá ao seu irmão. Mas, quando se libertar[a], quebrará o jugo do seu irmão do seu pescoço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ficar inquieto”. O verbo hebraico é difícil; o contexto de quebrar um jugo favorece o sentido de libertar-se, mas “ficar inquieto” também é possível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Você viverá pela sua espada
  rationale: A preposição עַל, com חֶרֶב e חיה, indica aqui o meio de subsistência. A formulação preserva a imagem concreta da espada e o sentido prospectivo do imperfeito.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: e servirá ao seu irmão
  rationale: O Qal de עבד significa diretamente “servir”. A tradução mantém aberta a forma política ou social exata dessa sujeição.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Mas, quando
  rationale: A expressão introduz uma circunstância futura e uma virada em relação à servidão mencionada antes; “mas, quando” comunica ambas com naturalidade.
- source_word: תָּרִיד
  choice: se libertar
  rationale: A forma verbal é difícil. No contexto imediato de retirar um jugo, “se libertar” expressa uma ruptura com a dominação sem especificar além do texto como ela ocorrerá; a alternativa lexical permanece em nota.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: quebrará o jugo dele
  rationale: פרק transmite a retirada violenta ou ruptura do jugo, enquanto עֹל deve conservar sua imagem concreta e metafórica.
- source_word: מֵעַל צַוָּארֶךָ
  choice: sobre o seu pescoço
  rationale: A construção מֵעַל indica que o jugo será removido de cima do pescoço. Em português, a relação espacial fica clara e a imagem física é preservada sem uma formulação artificial.
theological_decisions:
- issue: Natureza da futura relação de Esaú com Jacó
  choice: Apresentar a sujeição ao irmão seguida de uma futura libertação de seu domínio.
  alternative: Interpretar a servidão como permanente ou reduzi-la a mera deferência familiar.
  rationale: O hebraico menciona tanto o serviço ao irmão quanto a posterior retirada do jugo. A tradução preserva essa tensão sem importar conclusões posteriores sobre Edom.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens concretas de “espada”, “jugo” e “pescoço”, evitando linguagem denominacional ou explicações históricas não expressas no versículo.
