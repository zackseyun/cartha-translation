lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: A combinação chama a atenção do ouvinte de modo natural; “veja” preserva a função discursiva sem o tom arcaico de “eis”. O valor suavizador de נָא fica implícito no contexto.
- source_word: זָקַנְתִּי
  choice: já estou velho
  rationale: O perfeito hebraico expressa o estado resultante de ter envelhecido; esta formulação é clara e idiomática em português.
- source_word: לֹא יָדַעְתִּי
  choice: não sei
  rationale: Embora formalmente perfeito, o verbo descreve falta de conhecimento no presente; o presente é a equivalência natural em português.
- source_word: יוֹם מוֹתִי
  choice: o dia da minha morte
  rationale: Reproduz com clareza a construção hebraica e mantém a referência ao momento desconhecido da morte.
