lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אֵלָיו
  choice: lhe disse
  rationale: O pronome oblíquo “lhe” representa de modo natural o destinatário da fala.
- source_word: יִצְחָק אָבִיו
  choice: seu pai Isaque
  rationale: Mantém a aposição hebraica e a ênfase na relação familiar, com a grafia portuguesa tradicional do nome.
- source_word: גְּשָׁה־נָּא
  choice: Aproxime-se, por favor
  rationale: Expressa a aproximação física solicitada e preserva a força cortês de נָא.
- source_word: וּשְׁקָה־לִּי
  choice: e beije-me
  rationale: Reproduz de forma direta e digna a ordem de beijar o falante; לִי é expresso idiomaticamente como objeto em português.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o vocativo e o tom familiar da fala de Isaque.
