base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: pt
  text: 'Então Isaque disse a Jacó[a]: “Chegue mais perto, por favor, para eu apalpar você, meu filho, e ver se você é mesmo meu filho Esaú ou não.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Chegue mais perto, por favor, e deixe-me apalpar você, meu filho, para ver se você é mesmo meu filho Esaú ou não.”'
    reason: Alternativa sintática que preserva o possível valor coordenativo de וַאֲמֻשְׁךָ e mantém a finalidade do exame tátil.
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: Chegue mais perto, por favor
  rationale: O imperativo גְּשָׁה pede aproximação, e נָא suaviza o pedido; a formulação é natural e respeitosa em português atual.
- source_word: וַאֲמֻשְׁךָ
  choice: para eu apalpar você
  rationale: O verbo מושׁ indica tocar ou apalpar para examinar. Neste contexto, Isaque procura confirmar a identidade de Jacó pelo tato; a construção com “para” expressa naturalmente a finalidade.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o vocativo com sufixo de primeira pessoa e o tom familiar da fala de Isaque.
- source_word: הַאַתָּה זֶה
  choice: se você é mesmo
  rationale: A construção interrogativa manifesta a dúvida de Isaque. “Mesmo” transmite a ênfase identificadora sem produzir uma formulação artificial.
- source_word: בְּנִי עֵשָׂו
  choice: meu filho Esaú
  rationale: Mantém tanto a relação filial quanto a identidade específica que Isaque procura verificar.
- source_word: אִם לֹא
  choice: ou não
  rationale: Completa a pergunta alternativa hebraica de maneira direta e idiomática.
- source_word: וַיֹּאמֶר
  choice: Então Isaque disse
  rationale: “Então” comunica a progressão narrativa marcada pelo waw consecutivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apalpar” foi preferido a “tocar” porque comunica o exame deliberado pelo tato; “você” evita a rigidez de uma construção pronominal excessivamente formal.
