  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: pt
  text: 'Então ele foi até seu pai e disse[a]: “Meu pai!”


    Ele disse: “Aqui estou. Quem é você, meu filho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E ele veio a seu pai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ele entrou
  rationale: O wayyiqtol dá sequência à narrativa, e בוא, neste contexto, descreve Jacó entrando no espaço onde Isaque estava. “Entrou” expressa esse movimento de modo natural em português.
- source_word: אֶל אָבִיו
  choice: até onde seu pai estava
  rationale: אֶל marca direção. Com “entrou”, esta formulação torna explícito o destino espacial sem acrescentar o nome de Isaque, ausente do hebraico.
- source_word: וַיֹּאמֶר
  choice: e disse / ele respondeu
  rationale: A primeira ocorrência introduz a fala de Jacó. Na segunda, “respondeu” traduz naturalmente o mesmo verbo no intercâmbio verbal, sem alterar seu sentido contextual.
- source_word: אָבִי
  choice: Meu pai!
  rationale: O substantivo com sufixo de primeira pessoa singular é um vocativo, literalmente “meu pai”. A exclamação sinaliza o chamado direto sem impor emoção excessiva.
- source_word: הִנֶּנִּי
  choice: Aqui estou
  rationale: Preserva a fórmula hebraica de presença e prontidão, reconhecível e natural em português.
- source_word: מִי אַתָּה
  choice: Quem é você
  rationale: Traduz diretamente o interrogativo seguido do pronome masculino singular, mantendo a pergunta explícita sobre identidade.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém o vocativo com sufixo de primeira pessoa singular e o tom pessoal do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção principal favorece naturalidade narrativa; a nota preserva a alternativa mais formal para וַיָּבֹא אֶל אָבִיו. O diálogo mantém os possessivos e a fórmula הִנֶּנִּי.
