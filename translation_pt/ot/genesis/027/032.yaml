  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: pt
  text: 'Seu pai Isaque lhe disse[a]: “Quem é você?” Ele disse: “Sou seu filho, seu primogênito[b], Esaú.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Isaque, seu pai”; vertido de modo idiomático como “Seu pai Isaque”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “seu filho mais velho”. O hebraico diz “seu primogênito”, expressão que preserva a ênfase na ordem de nascimento, importante no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse / respondeu
  rationale: אמר é o verbo comum de fala. Na primeira ocorrência, “disse” preserva de perto o hebraico; na segunda, “respondeu” expressa naturalmente em português que a fala responde à pergunta, sem alterar seu conteúdo.
- source_word: לּוֹ
  choice: lhe
  rationale: A preposição ל com sufixo de terceira pessoa masculina singular indica o destinatário da fala; “lhe” é uma forma portuguesa natural e concisa.
- source_word: יִצְחָק אָבִיו
  choice: Seu pai Isaque
  rationale: A ordem hebraica é literalmente “Isaque, seu pai”. A formulação “Seu pai Isaque” é idiomática em português e mantém tanto a relação familiar quanto a identificação do falante.
- source_word: מִי אַתָּה
  choice: Quem é você?
  rationale: Equivalente direto e natural da pergunta hebraica formada por מִי e אַתָּה.
- source_word: אֲנִי
  choice: Sou
  rationale: A oração nominal hebraica não apresenta cópula expressa; em português, “sou” fornece a forma verbal exigida pelo idioma.
- source_word: בִּנְךָ
  choice: seu filho
  rationale: בן com sufixo de segunda pessoa masculina singular significa diretamente “seu filho”.
- source_word: בְכֹרְךָ
  choice: seu primogênito
  rationale: בכור designa o primeiro filho na ordem de nascimento e pode carregar implicações ligadas ao direito de primogenitura; “primogênito” preserva melhor essa ênfase do que apenas “filho mais velho”.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
