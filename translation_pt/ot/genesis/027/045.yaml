base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: pt
  text: até que a ira de seu irmão se afaste de você[a] e ele se esqueça do que você lhe fez. Então mandarei buscá-lo de lá[b]. Por que eu haveria de ficar privada dos dois no mesmo dia?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “até que a ira de seu irmão volte/retorne de você”. O hebraico usa o verbo “voltar/retornar” idiomaticamente com “ira”; no contexto, o sentido é que ela se afaste de você.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “enviarei e tomarei você de lá”; no contexto, trata-se de mandar alguém buscá-lo.'
    reason: lexical_alternative
  - marker: c
    text: “Ficar privada dos dois no mesmo dia” provavelmente expressa o temor de Rebeca de perder ambos os filhos em consequência do conflito, sem necessariamente indicar que os perderia da mesma maneira.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: até que a ira de seu irmão se afaste de você
  rationale: A construção estabelece um limite temporal. Embora שׁוב signifique literalmente “voltar/retornar”, com אַף (“ira”) a expressão idiomática indica que a ira deixa de estar dirigida contra Jacó.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: e ele se esqueça do que você lhe fez
  rationale: Tradução direta e natural, preservando a referência ao ato anterior de Jacó contra Esaú.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Então mandarei buscá-lo de lá
  rationale: O envio tem por finalidade fazer Jacó sair daquele lugar e retornar; “mandarei buscá-lo” expressa naturalmente em português a sequência dos dois verbos hebraicos sem acrescentar explicitamente “de volta”.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Por que eu haveria de perder os dois num só dia?
  rationale: שׁכל descreve a privação dos filhos; “perder” é mais corrente que “ficar privada/enlutada” e mantém a força materna no contexto. יוֹם אֶחָד é naturalmente “num só dia”.
theological_decisions:
- issue: Como Rebeca poderia perder ambos os filhos no mesmo dia
  choice: Manter a formulação abrangente “perder os dois”
  alternative: Explicitar que ambos morreriam no mesmo dia
  rationale: O hebraico fala de Rebeca ficar privada dos dois filhos, mas não especifica que ambos morreriam nem que seriam perdidos pelo mesmo meio. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A expressão “mandarei buscá-lo” evita uma construção pouco natural e conserva a direção contextual. Os marcadores foram posicionados junto às expressões que explicam.
