  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem hebraica “aos olhos dele” e usa “apalpe” por sua precisão contextual, embora a nota ofereça a alternativa mais ampla “toque”.
