  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: pt
  text: Talvez meu pai me apalpe[a], e eu pareça, aos olhos dele, como um enganador[b]; assim, trarei sobre mim uma maldição, e não uma bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me toque”. O verbo hebraico se refere a examinar pelo tato, de acordo com a tentativa de Isaque de confirmar fisicamente a identidade de Jacó.
    reason: lexical_alternative
  - marker: b
    text: Ou “alguém que zomba” ou “um trapaceiro”. A expressão hebraica pode descrever quem engana outra pessoa ou faz dela objeto de zombaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez
  rationale: Introduz naturalmente, em português moderno, a possibilidade que Jacó teme, preservando a incerteza do hebraico.
- source_word: יְמֻשֵּׁנִי
  choice: me apalpe
  rationale: O verbo משש indica examinar ou reconhecer pelo tato. “Apalpar” expressa com precisão a ação física que Isaque poderia realizar para verificar a identidade de Jacó.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: eu pareça aos olhos dele
  rationale: Mantém a imagem idiomática hebraica “aos olhos dele”, mas com sintaxe portuguesa natural; o sentido é como Jacó seria percebido ou considerado pelo pai.
- source_word: כִּמְתַעְתֵּעַ
  choice: um enganador
  rationale: No contexto, o particípio descreve quem induz outro ao erro ou lhe aplica um logro. “Enganador” comunica claramente essa força, sem excluir por nota as nuances de zombaria ou fraude.
- source_word: וְהֵבֵאתִי עָלַי
  choice: assim, trarei sobre mim
  rationale: 'Reproduz o sentido causativo de בוא no hifil com עַל: fazer vir algo sobre si. “Assim” explicita de modo natural a consequência já presente na sequência hebraica.'
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: uma maldição, e não uma bênção
  rationale: Preserva diretamente o contraste enfático entre a consequência temida e o resultado desejado.
