  text: וְ/אֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽ/עִזִּ֔ים הִלְבִּ֖ישָׁה עַל יָדָ֑י/ו וְ/עַ֖ל חֶלְקַ֥ת צַוָּארָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: pt
  text: E colocou as peles dos cabritinhos sobre as mãos dele e sobre a parte lisa do pescoço.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre a lisura do pescoço dele”.
    reason: Registra a construção hebraica incomum por trás da tradução natural “a parte lisa do pescoço”.
lexical_decisions:
- source_word: עֹרֹת
  choice: peles
  rationale: O plural construto designa peles de animais usadas aqui como cobertura; “peles” é a opção mais natural e precisa em português.
- source_word: גְּדָיֵי הָעִזִּים
  choice: dos cabritinhos
  rationale: A expressão se refere aos filhotes das cabras. “Cabritinhos” é corrente, claro e mantém a ideia de animais jovens.
- source_word: הִלְבִּישָׁה
  choice: colocou ... sobre
  rationale: O hifil de לבש significa vestir alguém ou pôr algo sobre alguém. Neste contexto, “colocou ... sobre” descreve naturalmente a aplicação das peles às partes do corpo.
- source_word: עַל יָדָיו
  choice: sobre as mãos dele
  rationale: Tradução direta e idiomática da expressão preposicional, com “dele” tornando inequívoco que se trata das mãos de Jacó.
- source_word: חֶלְקַת צַוָּארָיו
  choice: a parte lisa do pescoço
  rationale: חֶלְקַת indica a lisura ou a parte lisa; a formulação concreta comunica que a região sem pelos foi coberta para imitar Esaú.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cabritinhos” é mais natural do que a reprodução analítica “filhotes das cabras”; “sobre” preserva a imagem concreta de cobrir as mãos e o pescoço.
