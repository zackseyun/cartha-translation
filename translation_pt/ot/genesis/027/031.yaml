base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: pt
  text: 'Ele também preparou pratos saborosos e os levou a seu pai. Então disse a seu pai: “Que meu pai se levante e coma da caça de seu filho, para que sua alma me abençoe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ele também
  rationale: Preserva a ênfase aditiva e o paralelo com a ação anterior de Jacó em português natural.
- source_word: מַטְעַמִּים
  choice: uma comida saborosa
  rationale: Designa pratos especialmente preparados e saborosos no contexto; esta formulação é clara e corrente.
- source_word: וַיָּבֵא לְאָבִיו
  choice: a levou ao pai
  rationale: O objeto feminino retoma 'comida', explicitando naturalmente em português aquilo que está implícito no hebraico.
- source_word: יָקֻם אָבִי
  choice: Que meu pai se levante
  rationale: Reproduz o pedido respeitoso expresso pelo jussivo e mantém a referência do filho ao pai na terceira pessoa.
- source_word: מִצֵּיד בְּנוֹ
  choice: da caça de seu filho
  rationale: צַיִד se refere aqui ao produto da caçada; a formulação conserva a relação filial expressa no hebraico.
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Expressa com clareza a finalidade introduzida pela preposição hebraica.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: sua alma me abençoe
  rationale: Mantém a menção explícita à נֶפֶשׁ e a solenidade da fala, sem reduzir silenciosamente a expressão ao simples pronome 'você'.
theological_decisions:
- issue: Sentido de נַפְשֶׁךָ na fórmula da bênção
  choice: sua alma me abençoe
  alternative: o senhor me abençoe
  rationale: Embora 'sua alma' possa funcionar idiomaticamente como referência à própria pessoa, conservar a expressão explícita preserva a forma e a possível nuance afetiva ou volitiva do hebraico sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tratamento respeitoso na terceira pessoa e a expressão hebraica 'sua alma', sem arcaísmos desnecessários.
