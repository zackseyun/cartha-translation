base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: pt
  text: Agora, por favor, pegue seu equipamento — sua aljava e seu arco —, vá ao campo e cace alguma caça para mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca naturalmente a transição para a instrução imediata; em português, “Agora” comunica a progressão discursiva sem exigir a reprodução mecânica da conjunção.
- source_word: שָׂא נָא
  choice: por favor, pegue
  rationale: Neste contexto, o verbo tem o sentido idiomático de tomar consigo, enquanto נָא acrescenta cortesia ou apelo.
- source_word: כֵלֶיךָ
  choice: seu equipamento
  rationale: O termo é amplo e designa utensílios ou armas; “equipamento” funciona como categoria geral, especificada em seguida pela aljava e pelo arco.
- source_word: תֶּלְיְךָ
  choice: sua aljava
  rationale: Designa o estojo suspenso usado para carregar flechas; “aljava” é o equivalente português preciso e tradicional.
- source_word: וְקַשְׁתֶּךָ
  choice: e seu arco
  rationale: Tradução direta do termo hebraico comum para arco.
- source_word: וְצֵא הַשָּׂדֶה
  choice: vá ao campo
  rationale: Expressa em português natural o movimento para fora, em direção ao campo ou terreno aberto, preservando o cenário de caça.
- source_word: וְצוּדָה
  choice: e cace
  rationale: O verbo significa caçar ou capturar; o arco e a aljava tornam “caçar” a escolha contextual mais clara.
- source_word: לִּי
  choice: para mim
  rationale: 'Preserva o dativo de benefício: Esaú deve obter a caça para Isaque.'
- source_word: צידה
  choice: alguma caça
  rationale: Aqui o substantivo se refere ao alimento obtido pela caça. “Alguma caça” é natural em português e evita restringir indevidamente o animal, como faria “carne de veado”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a sequência enfática dos itens — equipamento, aljava e arco — e usa vocabulário corrente, exceto “aljava”, termo preciso exigido pelo objeto antigo.
