revisions:
- from: 'E Esaú passou a alimentar ódio contra Jacó por causa da bênção com que seu pai o havia abençoado. Então Esaú disse em seu coração: “Aproximam-se os dias de luto por meu pai[a]; então matarei Jacó, meu irmão.”'
  to: 'Esaú guardou rancor de Jacó por causa da bênção com que seu pai o tinha abençoado, e Esaú disse em seu coração: “Os dias de luto por meu pai se aproximam; então matarei Jacó, meu irmão.”'
  rationale: Substitui-se a expressão incoativa “passou a alimentar ódio contra” por “guardou rancor de”, que representa melhor a hostilidade persistente do verbo hebraico sem acrescentar uma ideia de começo. A estrutura narrativa é mantida com “e Esaú disse”, e a nota continua a registrar a ambiguidade de יְמֵי אֵבֶל אָבִי.
