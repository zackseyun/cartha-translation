base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: pt
  text: 'Esaú guardou rancor de Jacó por causa da bênção com que seu pai o tinha abençoado, e Esaú disse em seu coração: “Os dias de luto por meu pai se aproximam; então matarei Jacó, meu irmão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: passou a alimentar ódio contra
  rationale: O verbo שׂטם indica hostilidade persistente, não apenas uma emoção passageira. A formulação comunica ódio nutrido ao longo do tempo e conduz naturalmente à decisão homicida de Esaú.
- source_word: עַל הַבְּרָכָה
  choice: por causa da bênção
  rationale: A preposição עַל tem aqui sentido causal; esta formulação é clara e natural em português.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: com que seu pai o havia abençoado
  rationale: Preserva a repetição da raiz de 'bênção/abençoar' e o mais-que-perfeito situa a ação antes da hostilidade narrada.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Mantém o idioma hebraico para fala interior, ainda compreensível em português bíblico atual.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Aproximam-se os dias de luto por meu pai
  rationale: Representa a leitura contextual mais provável, o luto após a morte de Isaque, sem ocultar em nota a ambiguidade da construção hebraica.
- source_word: וְאַהַרְגָה
  choice: então matarei
  rationale: O cohortativo expressa intenção resoluta; 'então' explicita a sequência temporal implicada pelo contexto.
- source_word: אָחִי
  choice: meu irmão
  rationale: Conserva o possessivo explícito e ressalta a gravidade da violência intrafamiliar.
theological_decisions:
- issue: Referente do luto em יְמֵי אֵבֶל אָבִי
  choice: luto por meu pai
  alternative: dias de luto de meu pai
  rationale: O contexto favorece o luto de Esaú e da família pela morte esperada de Isaque, mas a sintaxe hebraica também permite relacionar o luto ao próprio pai; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Conserva o idioma bíblico “em seu coração” e a repetição “bênção/abençoado”, evitando linguagem denominacional.
