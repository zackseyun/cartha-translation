  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: pt
  text: Então ela entregou nas mãos de Jacó, seu filho, a comida saborosa e o pão que havia preparado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Então ela entregou
  rationale: O waw consecutivo dá continuidade à narrativa; נתן com בְּיַד expressa aqui o ato de entregar diretamente a alguém.
- source_word: הַמַּטְעַמִּים
  choice: a comida saborosa
  rationale: O termo designa a comida especialmente preparada e apetitosa deste contexto, sem especificar indevidamente carne ou iguarias.
- source_word: הַלֶּחֶם
  choice: o pão
  rationale: Equivalente direto e natural de לֶחֶם neste contexto.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: que havia preparado
  rationale: O mais-que-perfeito composto deixa clara, em português natural, a preparação anterior à entrega; 'preparado' é idiomático para comida e pão.
- source_word: בְּיַד יַעֲקֹב
  choice: entregou a Jacó
  rationale: A construção hebraica literal 'na mão de Jacó' funciona idiomaticamente como entrega direta. Em português, 'entregou a Jacó' comunica isso com naturalidade, sem exigir nota.
- source_word: יַעֲקֹב בְּנָהּ
  choice: a Jacó, seu filho
  rationale: Mantém a sequência hebraica — nome seguido da relação familiar — com pontuação natural em português.
