source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: pt
  text: 'Então ele se aproximou e o beijou. Isaque sentiu o cheiro das roupas dele, abençoou-o e disse: “Veja! O cheiro do meu filho é como o cheiro de um campo que Yahweh abençoou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Então ele se aproximou
  rationale: O wayyiqtol de נגשׁ dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: וַיִּשַּׁק לוֹ
  choice: e o beijou
  rationale: Tradução direta do verbo נשׁק com o pronome de objeto, sem acrescentar uma nuance afetiva não explicitada.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Isaque sentiu o cheiro das roupas dele
  rationale: “Sentiu o cheiro” é a forma idiomática em português e mantém o substantivo רֵיחַ, repetido no restante do versículo. O nome “Isaque” esclarece a mudança de sujeito já evidente no contexto, evitando que o pronome isolado pareça referir-se ao filho.
- source_word: בְּגָדָיו
  choice: das roupas dele
  rationale: “Roupas” é natural, atual e preserva o substantivo concreto plural. “Dele” mantém a referência ao filho sem sugerir posse por Isaque.
- source_word: וַיְבָרֲכֵהוּ
  choice: abençoou-o
  rationale: Representa diretamente ברך com o sufixo de objeto masculino singular.
- source_word: רְאֵה
  choice: Veja!
  rationale: O imperativo funciona como chamado de atenção. “Veja!” é atual e mais natural que o arcaizante “Eis” ou “Eis que”.
- source_word: רֵיחַ בְּנִי
  choice: o cheiro do meu filho
  rationale: Mantém o sentido direto de רֵיחַ e sua repetição lexical ao longo do versículo.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: é como o cheiro de um campo
  rationale: Preserva o símile marcado por כ e o sentido comum de שָׂדֶה, “campo”.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: que Yahweh abençoou
  rationale: Traduz de modo direto a oração relativa e o perfeito hebraico, cujo resultado permanece implícito no campo descrito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o tetragrama como nome próprio. “Yahweh” preserva essa função e corresponde à transliteração acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A repetição de “cheiro” foi preservada por seu efeito retórico no hebraico, enquanto a construção cognata foi vertida idiomaticamente como “sentiu o cheiro”. A divisão em duas frases ajuda a tornar clara a mudança de sujeito.
