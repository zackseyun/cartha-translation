base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: pt
  text: E aconteceu que, assim que Isaque terminou de abençoar Jacó, Jacó mal tinha saído[a] da presença de Isaque, seu pai, quando Esaú, seu irmão, chegou da caçada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete o verbo “sair” — literalmente, “sair, saiu” — para enfatizar que Jacó acabara de sair.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa hebraica e a ligação com a sequência anterior, sem recorrer a uma expressão arcaica.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: assim que ... acabou
  rationale: Expressa tanto a conclusão da bênção quanto a relação temporal imediata com os acontecimentos seguintes.
- source_word: לְבָרֵךְ
  choice: de abençoar
  rationale: Com o verbo כִּלָּה, forma naturalmente em português a construção 'acabou de abençoar'.
- source_word: אַךְ יָצֹא יָצָא
  choice: mal tinha saído
  rationale: Comunica que a saída acabara de ocorrer e que os dois irmãos quase se encontraram, refletindo a intensificação hebraica.
- source_word: מֵאֵת פְּנֵי
  choice: da presença de
  rationale: Preserva a ideia pessoal e espacial de sair de diante de Isaque.
- source_word: בָּא מִצֵּידוֹ
  choice: chegou da caçada
  rationale: ציד pode indicar a atividade de caçar ou a caça obtida; neste contexto, a expressão descreve naturalmente o retorno de Esaú da caçada sem afirmar que ele trazia caça.
