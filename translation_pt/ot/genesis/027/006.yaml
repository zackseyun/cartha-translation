  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: pt
  text: 'E Rebeca disse a seu filho Jacó: “Veja, ouvi seu pai falar com seu irmão Esaú, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה אָמְרָה
  choice: E Rebeca disse
  rationale: Preserva a conexão narrativa simples de וְ e traduz אָמְרָה pela forma corrente de introduzir fala.
- source_word: אֶל יַעֲקֹב בְּנָהּ
  choice: a seu filho Jacó
  rationale: Mantém a identificação de Jacó como filho de Rebeca, em ordem natural no português.
- source_word: לֵאמֹר
  choice: dois-pontos e abertura de aspas
  rationale: Na primeira ocorrência, a pontuação introduz a fala direta de maneira natural, sem o pouco idiomático 'dizendo'.
- source_word: הִנֵּה
  choice: Veja
  rationale: Interjeição moderna que chama a atenção para o que segue, sem o tom arcaico de 'eis'.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O perfeito relata uma percepção concluída no passado; o pretérito perfeito é natural em português.
- source_word: אֶת אָבִיךָ מְדַבֵּר
  choice: seu pai falar
  rationale: Depois de 'ouvi', o infinitivo é idiomático em português e expressa a fala percebida, embora o hebraico use particípio.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: com seu irmão Esaú
  rationale: Em português, 'falar com' é a construção natural para dirigir palavras a alguém, preservando a identificação de Esaú como irmão de Jacó.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: A segunda ocorrência introduz a citação encaixada que começa no versículo seguinte; 'dizendo:' conserva explicitamente essa função.
