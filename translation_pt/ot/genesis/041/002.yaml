  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: pt
  text: E eis que, do Nilo[a], subiam sete vacas, de bela aparência[b] e gordas, e pastavam no capim do brejo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do rio”; neste contexto egípcio, o termo hebraico normalmente se refere especificamente ao Nilo.
    reason: lexical_alternative
  - marker: b
    text: Ou “belas à vista”.
    reason: lexical_alternative
  - marker: c
    text: Ou “entre os juncos” ou “na vegetação pantanosa”. O termo hebraico designa a vegetação de brejo das margens do Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador vívido que chama a atenção para a cena do sonho, em linguagem digna e reconhecível em português.
- source_word: הַיְאֹר
  choice: o Nilo
  rationale: No contexto egípcio de Gênesis, o termo designa especificamente o Nilo, embora sua forma lexical possa significar “o rio”.
- source_word: עֹלֹת
  choice: subiam
  rationale: O particípio feminino plural apresenta a ação em andamento na cena; o pretérito imperfeito português expressa naturalmente esse aspecto.
- source_word: פָּרוֹת
  choice: vacas
  rationale: O substantivo indica bovinos do sexo feminino; “vacas” é a tradução direta e comum.
- source_word: יְפוֹת מַרְאֶה
  choice: belas de aparência
  rationale: Reproduz tanto a beleza quanto a referência explícita ao aspecto visível, sem reduzir a expressão a uma avaliação geral.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: gordas de corpo
  rationale: Preserva a ideia concreta de abundância corporal expressa pelo hebraico, importante para a imagem do sonho, com formulação natural em português.
- source_word: וַתִּרְעֶינָה
  choice: pastavam
  rationale: Traduz diretamente a ação de alimentar-se no pasto e mantém o caráter contínuo da cena.
- source_word: בָּאָחוּ
  choice: entre os juncos
  rationale: O termo indica vegetação de brejo associada às margens do Nilo; “entre os juncos” comunica esse ambiente de modo claro.
