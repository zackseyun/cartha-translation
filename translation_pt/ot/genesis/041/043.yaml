  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: pt
  text: 'Mandou que José montasse na segunda carruagem que possuía, e gritaram à frente dele: “Abreque!”[a] E assim o pôs sobre toda a terra do Egito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abreque” é um termo difícil, de significado incerto, talvez uma aclamação egípcia ou hebraica. Muitos o entendem como algo semelhante a “Ajoelhem-se!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב אֹתוֹ
  choice: Mandou que José andasse
  rationale: 'O hifil de רכב tem sentido causativo: o faraó fez José andar no carro. A formulação com “mandou” expressa isso de modo natural; o nome “José” esclarece o pronome sem alterar o referente no contexto.'
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: no segundo carro que possuía
  rationale: מִשְׁנֶה indica o segundo em ordem ou posição, provavelmente o carro imediatamente inferior ao carro principal do faraó. A oração relativa hebraica foi mantida.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: e iam gritando à frente dele
  rationale: קרא descreve o brado público dos que seguiam diante da comitiva; “iam gritando” comunica uma proclamação repetida durante o percurso.
- source_word: אַבְרֵךְ
  choice: Abreque
  rationale: O termo é obscuro e pode ser um empréstimo egípcio ou uma aclamação hebraica. A transliteração adaptada à ortografia portuguesa evita apresentar como certa uma interpretação disputada.
- source_word: וְנָתוֹן אֹתוֹ
  choice: E assim o pôs
  rationale: A construção com infinitivo absoluto tem força resultativa no contexto. “E assim” preserva a conexão com a exaltação pública precedente sem transformar explicitamente o verbo em uma nomeação técnica.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sobre toda a terra do Egito
  rationale: עַל exprime autoridade, e “terra do Egito” conserva o sentido territorial de אֶרֶץ.
