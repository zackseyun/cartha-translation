  to: 'Mandou que José montasse na segunda carruagem que possuía, e gritaram à frente dele: “Abreque!”[a] E assim o pôs sobre toda a terra do Egito.'
  rationale: A revisão substitui «andasse no ... carro» por «montasse na ... carruagem», que expressa claramente a causatividade e o cenário antigo, e troca a perífrase progressiva por um verbo narrativo simples. Conservam-se a transliteração prudente da aclamação, sua nota de incerteza e a formulação territorial da autoridade de José.
