  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: pt
  text: 'José deu ao primogênito o nome de Manassés[a], pois disse: “Deus me fez esquecer todo o meu sofrimento[b] e toda a casa de meu pai.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manassés soa de modo semelhante ao verbo hebraico que significa “fazer esquecer”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a minha aflição” ou “todo o meu trabalho penoso”.
    reason: lexical_alternative
  - marker: c
    text: “Casa de meu pai” é uma expressão hebraica que designa a família ou o grupo familiar paterno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַבְּכוֹר
  choice: deu ao primogênito o nome de
  rationale: Expressa em português natural a construção hebraica de chamar/dar nome, preservando a menção explícita ao primogênito.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Segue a forma tradicional e amplamente reconhecida em português; a nota registra o jogo sonoro com o verbo hebraico que significa fazer esquecer.
- source_word: כִּי
  choice: pois disse
  rationale: Introduz a explicação do nome; “disse” explicita de modo natural a fala implícita no contexto, sem alterar sua função causal.
- source_word: נַשַּׁנִי
  choice: me fez esquecer
  rationale: Reproduz o sentido causativo do verbo hebraico e mantém sua ligação semântica com o nome Manassés.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto e a forma verbal indicam referência singular; esta é a equivalência portuguesa convencional.
- source_word: כָּל עֲמָלִי
  choice: todo o meu sofrimento
  rationale: עָמָל abrange aflição, dificuldade e labor penoso; “sofrimento” comunica bem a experiência de José neste contexto sem restringi-la apenas ao trabalho.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: e toda a casa de meu pai
  rationale: Mantém a expressão hebraica de parentesco e sua tensão narrativa, sem reduzi-la a uma casa física nem explicar o esquecimento como mera perda da dor.
theological_decisions:
- issue: Possível implicação de José ter esquecido “a casa de meu pai”
  choice: Manter diretamente a afirmação de José de que Deus o fez esquecer seu sofrimento e toda a casa de seu pai.
  alternative: Parafrasear como Deus ter feito José esquecer apenas a dor associada à família ou considerar a frase explicitamente hiperbólica.
  rationale: O hebraico não limita de forma expressa o esquecimento à dor. A tradução preserva a ambiguidade e a tensão teológica e narrativa, sem harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe é natural, enquanto a expressão “casa de meu pai” preserva o idiomatismo hebraico, esclarecido em nota. Todos os marcadores aparecem no texto em ordem correspondente.
