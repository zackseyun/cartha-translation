  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: pt
  text: 'Então o faraó disse a José: “No meu sonho, eis que eu estava em pé à margem do Nilo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do rio”. No contexto egípcio de Gênesis, esse termo geralmente se refere ao Nilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: disse
  rationale: Embora o verbo signifique formalmente “falou”, “disse” é a forma mais natural em português para introduzir discurso direto.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: אֶל יוֹסֵף
  choice: a José
  rationale: A preposição marca o destinatário da fala; “a José” reproduz isso de modo claro e natural.
- source_word: בַּחֲלֹמִי
  choice: No meu sonho
  rationale: Reproduz diretamente a preposição e o sufixo de primeira pessoa, com formulação idiomática em português.
- source_word: הִנְנִי עֹמֵד
  choice: eu estava em pé
  rationale: O particípio descreve o faraó em posição ereta no cenário do sonho. O pretérito imperfeito se ajusta ao relato retrospectivo; a partícula apresentativa הִנְנִי confere vivacidade, mas uma tradução explícita como “eis que” soaria marcada neste contexto em português corrente.
- source_word: עַל שְׂפַת
  choice: à margem
  rationale: שָׂפָה significa literalmente “lábio” ou “borda”, mas junto a um rio designa sua margem. “À margem” é natural e preserva a relação espacial sem sugerir necessariamente que ele estivesse sobre a própria borda.
- source_word: הַיְאֹר
  choice: do Nilo
  rationale: No contexto egípcio de Gênesis, יְאֹר normalmente designa o Nilo; o nome torna o referente claro, enquanto a nota conserva o sentido lexical mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem narrativa foi preservada, e evitou-se o arcaísmo “eis que” por não ser necessário para comunicar a cena vívida do sonho.
