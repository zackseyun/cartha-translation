  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: pt
  text: O faraó deu a José o nome de Zafenate-Paneia[a] e lhe deu por esposa Azenate, filha de Potífera, sacerdote de Om[b]. E José saiu pela terra do Egito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se translitera “Zafenate-Paneá”. O significado desse nome egípcio é incerto, e as traduções propostas variam.
    reason: lexical_alternative
  - marker: b
    text: Om é a cidade egípcia que mais tarde ficou conhecida pelo nome grego Heliópolis.
    reason: cultural_note
  - marker: c
    text: Ou “saiu por toda a terra do Egito”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: deu a José o nome
  rationale: O hebraico diz literalmente que o faraó “chamou o nome de José”. Em português atual, “deu a José o nome” comunica com naturalidade o ato formal de nomeá-lo.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Zafenate-Paneia
  rationale: Nome egípcio preservado por transliteração em forma tradicionalmente reconhecível em português; seu significado e sua vocalização exata são incertos.
- source_word: וַיִּתֶּן לוֹ
  choice: lhe deu
  rationale: Reproduz de modo claro e idiomático o verbo נתן com o pronome de objeto indireto.
- source_word: אָסְנַת
  choice: Azenate
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: filha de Potífera
  rationale: Mantém diretamente a relação familiar expressa pelo hebraico e emprega uma forma portuguesa reconhecível do nome.
- source_word: כֹּהֵן אֹן
  choice: sacerdote de Om
  rationale: כֹּהֵן significa “sacerdote”; Om preserva em forma portuguesa o topônimo hebraico, em vez de substituí-lo pelo nome grego posterior Heliópolis.
- source_word: לְאִשָּׁה
  choice: por esposa
  rationale: Expressão portuguesa natural para o hebraísmo que indica a entrega de Azenate em casamento.
- source_word: וַיֵּצֵא ... עַל אֶרֶץ מִצְרָיִם
  choice: saiu por toda a terra do Egito
  rationale: Preserva o verbo “sair” e expressa o deslocamento de José pela extensão do território; a função exata de עַל admite uma formulação menos distributiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis para leitores brasileiros e compreensíveis internacionalmente. A sintaxe evita o decalque pouco natural “chamou o nome de José”, mas conserva explicitamente a concessão do novo nome. As notas preservam as incertezas relativas ao nome egípcio e ao alcance da preposição עַל.
