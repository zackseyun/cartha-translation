revisions:
- from: O faraó deu a José o nome de Zafenate-Paneia[a] e lhe deu por esposa Azenate, filha de Potífera, sacerdote de Om[b]. Então José saiu por toda a terra do Egito.[c]
  to: O faraó deu a José o nome de Zafenate-Paneia[a] e lhe deu por esposa Azenate, filha de Potífera, sacerdote de Om[b]. E José saiu pela terra do Egito.[c]
  rationale: 'A revisão conserva os nomes tradicionais e a formulação matrimonial do rascunho, mas corrige a apresentação da ambiguidade de עַל אֶרֶץ מִצְרַיִם: o texto principal usa uma expressão territorial não distributiva, e a nota registra a leitura «por toda». Também substitui «Então» por «E» para refletir com maior precisão a coordenação narrativa hebraica.'
