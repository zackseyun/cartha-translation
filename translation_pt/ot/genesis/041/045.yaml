    text: Também se translitera “Zafenate-Paneá”. O significado desse nome egípcio é incerto, e as traduções propostas variam.
    reason: lexical_alternative
  - marker: b
    text: Om é a cidade egípcia que mais tarde ficou conhecida pelo nome grego Heliópolis.
    reason: cultural_note
  - marker: c
    text: Ou “saiu por toda a terra do Egito”.
    reason: alternative_reading
  revision_rationale: 'A revisão conserva os nomes tradicionais e a formulação matrimonial do rascunho, mas corrige a apresentação da ambiguidade de עַל אֶרֶץ מִצְרַיִם: o texto principal usa uma expressão territorial não distributiva, e a nota registra a leitura «por toda». Também substitui «Então» por «E» para refletir com maior precisão a coordenação narrativa hebraica.'
