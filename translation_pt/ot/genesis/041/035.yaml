base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: pt
  text: Que eles recolham todo o alimento destes bons anos que estão por vir, armazenem o cereal sob a autoridade do faraó, como provisão nas cidades, e o guardem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Recolham
  rationale: O imperfeito hebraico tem valor diretivo no contexto da proposta de José; o imperativo em português expressa naturalmente essa orientação.
- source_word: כָּל אֹכֶל
  choice: todo o alimento
  rationale: אֹכֶל designa de modo amplo alimento ou mantimento, abrangendo a produção recolhida durante os anos de abundância.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: destes bons anos que estão por vir
  rationale: A formulação conserva tanto o demonstrativo הָאֵלֶּה quanto a ideia temporal do particípio הַבָּאֹת, em português natural.
- source_word: וְיִצְבְּרוּ
  choice: armazenem
  rationale: O verbo descreve acumular em quantidade; 'armazenem' comunica claramente a finalidade administrativa, sem exigir a imagem literal de amontoar.
- source_word: בָּר
  choice: cereal
  rationale: בָּר refere-se a grão debulhado; 'cereal' é amplo e evita restringir indevidamente a uma espécie específica.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: sob a autoridade do faraó
  rationale: A expressão idiomática, literalmente 'debaixo da mão do faraó', indica sua autoridade ou controle.
- source_word: אֹכֶל בֶּעָרִים
  choice: como provisão nas cidades
  rationale: A construção apresenta o cereal armazenado funcionalmente como alimento ou provisão mantida nas cidades.
- source_word: וְשָׁמָרוּ
  choice: e guardem-no
  rationale: שׁמר pode significar guardar, conservar ou proteger. 'Guardem-no' mantém essa amplitude e retoma explicitamente o cereal.
