  text: פַּרְעֹ֖ה קָצַ֣ף עַל עֲבָדָ֑י/ו וַ/יִּתֵּ֨ן אֹתִ֜/י בְּ/מִשְׁמַ֗ר בֵּ֚ית שַׂ֣ר הַ/טַּבָּחִ֔ים אֹתִ֕/י וְ/אֵ֖ת שַׂ֥ר הָ/אֹפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: pt
  text: O faraó ficou irado com seus servos e me pôs sob custódia[a] na casa do chefe da guarda[b], a mim e ao chefe dos padeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em confinamento vigiado”. O termo hebraico indica detenção sob guarda, sem necessariamente se referir a um edifício prisional formal.
    reason: lexical_alternative
  - marker: b
    text: “Chefe da guarda” traduz um título da corte que, mais literalmente, seria “chefe dos que abatem” ou “chefe dos executores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: ficou irado
  rationale: O verbo expressa ira; “ficou irado” é natural e digno, sem exigir a intensidade maior de “ficou furioso”.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte, refere-se a pessoas a serviço do faraó. “Servos” preserva a relação expressa pelo hebraico sem defini-los especificamente como escravos nem substituir essa relação pela função de oficiais.
- source_word: בְּמִשְׁמַר
  choice: sob custódia
  rationale: O substantivo indica confinamento vigiado. “Sob custódia” comunica a detenção sem pressupor um edifício prisional formal.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: na casa do chefe da guarda
  rationale: A expressão funciona como título de um alto oficial da corte. “Chefe da guarda” é claro e adequado ao contexto, enquanto a nota preserva o sentido mais literal de טַבָּחִים.
- source_word: שַׂר הָאֹפִים
  choice: chefe dos padeiros
  rationale: A construção designa o responsável principal pelos padeiros; esta forma é clara e idiomática em português.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: a mim e ao chefe dos padeiros
  rationale: Mantém a repetição enfática de “a mim” presente no hebraico e identifica ambos como objetos do ato de pôr sob custódia.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A formulação conserva a dignidade narrativa e a ênfase hebraica em “a mim”, sem tornar o texto artificial.
