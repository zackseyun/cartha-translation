  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: pt
  text: Então o faraó mandou chamar José, e depressa o tiraram da cisterna[a]. Ele se barbeou, trocou de roupa e foi ao faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da cova” ou “do calabouço”. A palavra hebraica significa literalmente “cisterna” ou “cova” e também pode designar um lugar de confinamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: mandou chamar José
  rationale: Os dois verbos descrevem o envio de uma ordem para que José fosse trazido. A expressão portuguesa é natural, conserva a iniciativa do faraó e evita uma redundância artificial.
- source_word: וַיְרִיצֻהוּ
  choice: depressa o tiraram
  rationale: A forma causativa comunica que agentes não nomeados fizeram José sair com urgência; esta formulação preserva tanto o sujeito plural implícito quanto a rapidez.
- source_word: מִן הַבּוֹר
  choice: da cisterna
  rationale: בּוֹר designa literalmente uma cova ou cisterna e, no contexto, o local de confinamento. 'Cisterna' mantém a imagem concreta e a ligação lexical com o relato anterior.
- source_word: וַיְגַלַּח
  choice: Ele se barbeou
  rationale: O verbo ativo indica que José se barbeou ou se fez barbear; a forma reflexiva é natural em português e não especifica além do texto quem executou o ato.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: trocou de roupa
  rationale: Expressão corrente que comunica claramente a troca das vestes antes da audiência.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: foi apresentar-se ao faraó
  rationale: No contexto de uma convocação régia, a expressão comunica naturalmente que José compareceu diante do faraó, sem acrescentar detalhes cerimoniais.
