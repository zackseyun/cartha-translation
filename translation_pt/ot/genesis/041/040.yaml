  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: pt
  text: Você ficará encarregado da minha casa, e todo o meu povo obedecerá às suas ordens.[a] Somente no que diz respeito ao trono, eu serei maior do que você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “à sua boca todo o meu povo beijará”. Aqui, a expressão é geralmente entendida como obedecer às ordens de José ou prestar-lhe homenagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: encarregado de toda a minha casa
  rationale: A preposição עַל indica autoridade ou supervisão. “Encarregado de” comunica isso naturalmente; “casa” preserva a amplitude do hebraico, que pode abranger a residência e a administração de Faraó. “Toda” explicita em português o alcance da responsabilidade sem alterar o sentido contextual.
- source_word: וְעַל־פִּיךָ יִשַּׁק כָּל־עַמִּי
  choice: e todo o meu povo obedecerá às suas ordens
  rationale: 'A expressão é literalmente difícil: “à sua boca todo o meu povo beijará”. No contexto da autoridade delegada a José, ela indica que o povo agirá segundo sua palavra, prestando-lhe obediência ou homenagem. A tradução principal comunica essa função administrativa, e a forma literal é preservada em nota.'
- source_word: רַק הַכִּסֵּא
  choice: Somente quanto ao trono
  rationale: רַק introduz a única limitação à autoridade de José, e הַכִּסֵּא representa o trono ou ofício real. A formulação mantém essa restrição sem explicar além do texto.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: eu serei maior do que você
  rationale: O verbo גדל com מִן expressa superioridade. A tradução formal preserva a comparação, enquanto a referência ao trono deixa claro que se trata de posição e autoridade.
