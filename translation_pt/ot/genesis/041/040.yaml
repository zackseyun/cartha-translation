translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Emprega “você” em consonância com o tratamento direto corrente e evita linguagem excessivamente arcaica. A nota conserva a imagem concreta e a ambiguidade lexical do hebraico.
