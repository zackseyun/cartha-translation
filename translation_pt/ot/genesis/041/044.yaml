  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: pt
  text: 'Então o faraó disse a José: “Eu sou o faraó; e, sem você[a], ninguém levantará a mão nem o pé[b] em toda a terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “independentemente de você”; no contexto, ninguém poderia agir sem a autorização de José.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “levantará a mão e o pé”, expressão que significa realizar qualquer ação ou fazer qualquer movimento.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa sequência com naturalidade em português.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título do rei do Egito, tratada aqui como substantivo comum.
- source_word: אֲנִי פַרְעֹה
  choice: Eu sou o faraó
  rationale: Mantém a identificação enfática e a declaração de autoridade soberana sem acrescentar qualificadores interpretativos.
- source_word: וּבִלְעָדֶיךָ
  choice: e, sem você
  rationale: Reproduz de modo conciso a exclusão expressa pelo hebraico, preservando a possibilidade de se referir tanto à atuação de José quanto à sua autorização.
- source_word: לֹא יָרִים
  choice: ninguém levantará
  rationale: O hifil de רום significa “levantar”; o futuro português se ajusta ao caráter declaratório do decreto.
- source_word: אִישׁ
  choice: ninguém
  rationale: No contexto de uma oração negativa, o singular genérico hebraico é expresso de forma natural e inclusiva por “ninguém”.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: a mão nem o pé
  rationale: A coordenação negativa “nem” é idiomática em português e conserva as imagens concretas da mão e do pé; a nota registra de maneira mais literal a construção hebraica.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: Expressão territorial natural em português e próxima da formulação hebraica.
theological_decisions:
- issue: Extensão da autoridade concedida a José
  choice: Preservar “sem você” no texto principal
  alternative: Explicitar “sem a sua autorização”
  rationale: O contexto sugere que ninguém poderia agir sem a autorização de José, mas o hebraico usa uma expressão mais concisa. A tradução mantém essa abertura e esclarece a implicação em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a imagem hebraica no texto e explica seu sentido idiomático em nota.
