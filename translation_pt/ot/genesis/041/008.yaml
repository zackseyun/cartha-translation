base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: pt
  text: Ao amanhecer, seu espírito ficou perturbado. Então mandou chamar todos os magos do Egito e todos os seus sábios. O faraó lhes contou o seu sonho, mas não havia ninguém que os interpretasse para o faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “interpretá-los”. Embora o substantivo anterior esteja no singular (“o seu sonho”), o pronome plural pode se referir aos elementos do sonho ou considerar separadamente as partes da experiência. Algumas traduções trazem “interpretá-lo”.'
    reason: Preserva e esclarece a discordância numérica genuína do texto hebraico.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Ao amanhecer
  rationale: Expressa com naturalidade a indicação temporal e a progressão narrativa do hebraico.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: seu espírito ficou perturbado
  rationale: Mantém רוּחַ como “espírito” e comunica a agitação interior indicada pelo verbo פעמ, sem reduzi-la interpretativamente a “mente”.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: mandou chamar
  rationale: Equivalente idiomático em português para o envio de mensageiros a fim de convocar alguém; evita uma sequência artificial como “enviou e chamou”.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: os magos do Egito
  rationale: Designa especialistas egípcios em práticas secretas e interpretação de sonhos; “magos” é claro, tradicional e adequado ao contexto.
- source_word: כָּל חֲכָמֶיהָ
  choice: todos os seus sábios
  rationale: O sufixo remete ao Egito. “Sábios” preserva a categoria distinta dos magos sem restringi-los a meros conselheiros.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: O faraó lhes contou o seu sonho
  rationale: Preserva o substantivo singular חֲלֹמוֹ do texto massorético e emprega formulação corrente em português.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: mas ninguém conseguia interpretá-los para ele
  rationale: Mantém o objeto pronominal plural אֹתָם e traduz o particípio de modo natural, sem harmonizá-lo silenciosamente com o substantivo singular anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. O título “faraó” foi usado com artigo, conforme o uso corrente em português. A aparente discordância entre “sonho” e “interpretá-los” é deliberada e explicada em nota.
