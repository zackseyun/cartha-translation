  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: pt
  text: E as vacas magras e feias comeram as sete primeiras vacas saudáveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as vacas esquálidas e de má aparência comeram as sete primeiras vacas gordas”.'
    reason: Alternativas lexicais possíveis para הָרַקּוֹת, וְהָרָעוֹת e הַבְּרִיאֹת.
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: comeram
  rationale: O verbo אכל significa “comer”. No contexto do sonho, “comeram” expressa a ação com naturalidade; a ideia de consumo completo decorre da própria cena.
- source_word: הַפָּרוֹת
  choice: as vacas
  rationale: O substantivo está no plural feminino e se refere especificamente a bovinos fêmeas; “vacas” é mais preciso que o termo geral “gado”.
- source_word: הָרַקּוֹת
  choice: magras
  rationale: O adjetivo descreve a condição física esquelética ou sem gordura. “Magras” é claro, corrente e adequado ao contraste da narrativa.
- source_word: וְהָרָעוֹת
  choice: e feias
  rationale: Neste contexto, רעות descreve a aparência ruim das vacas, não maldade moral. “Feias” comunica esse sentido visual de modo natural.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: as sete ... vacas
  rationale: O marcador de objeto direto seguido do numeral e do substantivo é vertido diretamente, com a ordem natural em português.
- source_word: הָרִאשֹׁנוֹת
  choice: primeiras
  rationale: Identifica o grupo que apareceu antes no sonho; “primeiras” preserva claramente a sequência.
- source_word: הַבְּרִיאֹת
  choice: saudáveis
  rationale: O adjetivo indica condição forte e bem nutrida. “Saudáveis” preserva essa amplitude sem limitar o sentido apenas ao tamanho ou à gordura corporal.
