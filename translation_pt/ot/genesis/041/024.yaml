  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: pt
  text: E as espigas finas engoliram as sete espigas boas[a]. Então contei isso aos magos[b], mas ninguém pôde me explicar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cabeças de cereal”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “magos” designa especialistas rituais egípcios, entre eles intérpretes de sonhos.
    reason: cultural_note
  - marker: c
    text: 'Ou: “mas ninguém conseguiu interpretá-lo para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: engoliram
  rationale: Preserva de modo vívido e natural a imagem do sonho, em que um grupo de espigas consome o outro.
- source_word: שִׁבֳּלִים
  choice: espigas
  rationale: No contexto agrícola, o termo designa as espigas ou cabeças de cereal; “espigas” é a forma corrente e concisa em português.
- source_word: הַדַּקֹּת
  choice: finas
  rationale: Traduz diretamente a ideia de pouca espessura, sem acrescentar a noção interpretativa de doença ou esterilidade.
- source_word: הַטֹּבוֹת
  choice: boas
  rationale: Mantém o sentido amplo de טוב e o contraste explícito do relato, sem especificar “cheias” ou “saudáveis”.
- source_word: וָאֹמַר אֶל
  choice: Então contei isso aos
  rationale: O hebraico diz literalmente que Faraó falou aos especialistas; no contexto, o objeto implícito é o sonho. “Contei isso” produz português natural sem alterar o referente contextual.
- source_word: הַחַרְטֻמִּים
  choice: magos
  rationale: É uma designação portuguesa tradicional e concisa para os especialistas rituais egípcios associados à interpretação de sonhos e sinais; a nota esclarece o alcance cultural.
- source_word: וְאֵין מַגִּיד לִי
  choice: mas ninguém pôde me explicar
  rationale: No contexto, מַגִּיד indica tornar conhecido o significado do sonho. “Explicar” comunica esse sentido em português natural, preservando na nota a alternativa mais específica “interpretar”.
