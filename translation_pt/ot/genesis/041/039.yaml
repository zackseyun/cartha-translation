source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: pt
  text: 'Então o faraó disse a José[a]: “Uma vez que Deus lhe deu a conhecer tudo isso, não há ninguém tão perspicaz e sábio como você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois que Deus lhe deu a conhecer tudo isso”. A preposição hebraica significa literalmente “depois”, mas aqui também pode indicar a base da conclusão do faraó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma tradicional e corrente em português para o título do rei do Egito.
- source_word: אַחֲרֵי
  choice: Uma vez que
  rationale: Embora o sentido formal seja “depois que”, neste contexto a expressão apresenta a base da conclusão do faraó; “uma vez que” preserva essa força causal sem eliminar a alternativa temporal.
- source_word: הוֹדִיעַ
  choice: deu a conhecer
  rationale: O hifil de ידע tem sentido causativo, “fazer saber, dar a conhecer”; a formulação é clara e digna em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto e a construção verbal indicam referente singular.
- source_word: אֶת כָּל זֹאת
  choice: tudo isso
  rationale: Expressão compacta e natural que retoma toda a interpretação e orientação dadas por José.
- source_word: אֵין
  choice: não há ninguém
  rationale: Equivalente idiomático moderno da negação existencial hebraica.
- source_word: נָבוֹן
  choice: inteligente
  rationale: Aqui designa alguém capaz de compreender e discernir; “inteligente” é natural para leitores comuns e se distingue de “sábio” no par coordenado.
- source_word: וְחָכָם
  choice: e sábio
  rationale: Tradução corrente de חכם, preservando o par de qualidades atribuído a José.
- source_word: כָּמוֹךָ
  choice: como você
  rationale: Forma comparativa natural no português moderno após “ninguém tão...”.
theological_decisions:
- issue: Referência de אֱלֹהִים na fala do faraó
  choice: Deus
  alternative: os deuses
  rationale: Embora אֱלֹהִים possa ter forma plural em outros contextos, aqui o verbo singular e o contexto apontam para a divindade que revelou a José o significado dos sonhos; “Deus” reflete melhor o uso hebraico neste versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação mantém tom narrativo digno, usa “você” de modo natural e conserva em nota a ambiguidade temporal/causal de אַחֲרֵי.
