  - severity: low
    issue: A nota descreve “depois” como sentido “mais formal”.
    rationale: O contraste relevante é entre o valor temporal literal (“depois que”) e o valor causal/inferencial adotado no contexto (“uma vez que”), e não entre registros de formalidade.
