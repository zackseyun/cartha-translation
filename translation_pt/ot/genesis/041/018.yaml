  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: pt
  text: E eis que do Nilo subiam sete vacas, robustas de corpo[a] e belas de aparência, e pastavam entre os juncos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem fornidas de carne” ou “gordas”; o hebraico descreve literalmente sua boa condição ou plenitude corporal.
    reason: lexical_alternative
  - marker: b
    text: Ou “no capim do brejo”; o termo hebraico se refere à vegetação das áreas alagadiças junto ao Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Conserva o marcador discursivo vívido que introduz a cena do sonho, em linguagem bíblica ainda clara no português atual.
- source_word: מִן הַיְאֹר
  choice: do Nilo
  rationale: No contexto egípcio de Gênesis, יְאֹר designa naturalmente o Nilo, não apenas um rio genérico.
- source_word: עֹלֹת
  choice: subiam
  rationale: O imperfeito português apresenta naturalmente a ação em curso expressa pelo particípio hebraico no relato do sonho.
- source_word: שֶׁבַע פָּרוֹת
  choice: sete vacas
  rationale: פָּרוֹת especifica bovinos fêmeas; 'vacas' é preciso e corrente.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: robustas de corpo
  rationale: Expressa a boa condição e plenitude corporal sem reduzir necessariamente a descrição a 'gordas' ou inferir apenas que fossem bem alimentadas.
- source_word: וִיפֹת תֹּאַר
  choice: belas de aparência
  rationale: Reproduz com naturalidade a descrição hebraica de beleza na forma ou no aspecto.
- source_word: וַתִּרְעֶינָה
  choice: e pastavam
  rationale: רעה descreve o ato de animais se alimentarem no pasto; 'pastavam' é natural em português.
- source_word: בָּאָחוּ
  choice: entre os juncos
  rationale: O termo aponta para vegetação de área alagadiça junto ao Nilo; esta formulação preserva esse cenário.
theological_decisions: []
