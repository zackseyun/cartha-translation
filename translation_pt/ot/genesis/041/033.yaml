base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: pt
  text: Agora, que o faraó procure um homem sensato e sábio[a] e o coloque à frente da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o faraó veja, encontre ou escolha um homem sensato e sábio”. O verbo hebraico pode ter, neste contexto, o sentido de ver, encontrar ou escolher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição da interpretação dos sonhos para o conselho prático de José; é natural em português e não precisa reproduzir mecanicamente a conjunção inicial.
- source_word: יֵרֶא
  choice: que o faraó procure
  rationale: O jussivo de ראה, neste contexto, vai além do ato visual e sugere identificar ou escolher alguém; “procure” preserva a nuance volitiva sem antecipar por completo a nomeação da oração seguinte.
- source_word: פַרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada do título real egípcio, com artigo definido natural no uso corrente.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do hebraico, adequado ao oficial masculino previsto no contexto.
- source_word: נָבוֹן
  choice: sensato
  rationale: Expressa entendimento prático, discernimento e bom juízo no contexto administrativo, em linguagem clara para leitores modernos.
- source_word: וְחָכָם
  choice: e sábio
  rationale: Reproduz a coordenação hebraica e o sentido comum de חכם como sabedoria e competência de julgamento.
- source_word: וִישִׁיתֵהוּ
  choice: e o ponha
  rationale: Traduz de perto שׂים, “pôr/colocar”, enquanto o complemento “sobre” comunica a investidura de autoridade; evita tornar explícito além do hebraico o conceito de nomeação.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sobre a terra do Egito
  rationale: Conserva a expressão hebraica e indica autoridade administrativa sobre o território egípcio.
theological_decisions: []
