id: GEN.41.5
reference: Genesis 41:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: pt
  text: Então ele dormiu e sonhou pela segunda vez. E eis que sete espigas[a] cresciam numa só haste, graúdas[b] e boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espigas de cereal”. O termo hebraico designa a parte da planta que contém os grãos.
    reason: lexical_alternative
  - marker: b
    text: Ou “cheias” ou “bem formadas”. O adjetivo hebraico descreve espigas bem providas de grãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Então ele dormiu
  rationale: O wayyiqtol dá sequência à narrativa; “então” expressa essa progressão sem acrescentar que ele voltou a dormir, algo não explicitado pelo verbo.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: e sonhou pela segunda vez
  rationale: Preserva diretamente o valor adverbial de שֵׁנִית e distingue este sonho do primeiro.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a apresentação vívida e repentina da cena vista no sonho, em registro narrativo digno e reconhecível.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sete espigas
  rationale: שִׁבֳּלִים designa as partes da planta que contêm os grãos; “espigas” é a forma portuguesa natural e precisa no contexto.
- source_word: עֹלֹת
  choice: cresciam
  rationale: O particípio retrata uma ação em curso na cena do sonho. “Cresciam” comunica de modo natural o movimento de surgir e subir da planta.
- source_word: בְּקָנֶה אֶחָד
  choice: numa só haste
  rationale: קָנֶה é a haste ou caule da planta; “numa só haste” expressa com clareza que as sete espigas estavam ligadas ao mesmo caule.
- source_word: בְּרִיאוֹת
  choice: graúdas
  rationale: O adjetivo indica espigas gordas, cheias ou bem formadas. “Graúdas” aplica essa ideia naturalmente aos grãos sem sugerir saúde em sentido biológico.
- source_word: וְטֹבוֹת
  choice: e boas
  rationale: Mantém o sentido amplo e avaliativo de טוֹב sem restringi-lo indevidamente a beleza ou qualidade específica.
theological_decisions: []
