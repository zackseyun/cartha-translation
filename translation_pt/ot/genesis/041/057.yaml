  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: pt
  text: E pessoas de toda a terra[a] vieram ao Egito, até José, para comprar cereal, pois a fome era severa em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a região” ou “o mundo inteiro”. O hebraico ’erets pode significar “terra”, “região” ou “país”; aqui a expressão se refere amplamente às terras atingidas pela fome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: gente de toda a terra
  rationale: Embora a expressão seja literalmente “toda a terra”, o verbo plural mostra que se refere às pessoas provenientes das regiões atingidas. A formulação natural em português preserva a amplitude retórica sem fazer do solo o agente da ação.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: vinha ao Egito
  rationale: בוא expressa movimento em direção ao lugar focalizado, e o ה direcional em מִצְרַיְמָה indica destino. O singular coletivo “gente” pede “vinha”.
- source_word: לִשְׁבֹּר
  choice: para comprar cereal
  rationale: No contexto de fome, שׁבר designa a compra ou obtenção de mantimento, especialmente cereal. Explicitar “cereal” comunica em português o objeto implícito no verbo hebraico.
- source_word: אֶל יוֹסֵף
  choice: até José
  rationale: Mantém a direção indicada por אֶל e apresenta José como a pessoa a quem os compradores se dirigiam, sem substituir a preposição pelo interpretativo “de José”.
- source_word: כִּי חָזַק הָרָעָב
  choice: porque a fome era severa
  rationale: כִּי é causal. Embora חזק signifique literalmente “ser forte”, aplicado à fome corresponde idiomaticamente a “ser severa” ou “intensa”.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: Preserva a repetição retórica de אֶרֶץ e sua amplitude deliberada. O contexto aponta para as terras atingidas pela fome, sem exigir que a expressão seja restringida apenas ao Egito.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com ordem sintática natural. “Gente de toda a terra” evita a personificação pouco natural de “toda a terra vinha”, enquanto preserva o alcance amplo e hiperbólico do hebraico. A repetição final de “toda a terra” conserva a ênfase do texto-fonte.
