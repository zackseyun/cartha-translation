  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: pt
  text: Depois deles, virão sete anos de fome, e toda a fartura[a] na terra do Egito será esquecida; a fome consumirá[b] a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a abundância”. O termo hebraico indica plenitude ou abundância, especialmente em contraste com a fome.
    reason: lexical_alternative
  - marker: b
    text: Ou “a fome arruinará a terra”. O verbo também pode ter o sentido de levar à ruína ou acabar por completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: virão
  rationale: No contexto profético, o perfeito com waw tem sentido futuro e sequencial. “Virão” expressa com naturalidade o surgimento dos anos de fome após os anos de fartura.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: sete anos de fome
  rationale: Reproduz naturalmente a cadeia construta hebraica; “fome” é o termo corrente e preciso para רָעָב neste contexto.
- source_word: אַחֲרֵיהֶן
  choice: Depois deles
  rationale: O sufixo feminino plural retoma os sete anos de fartura mencionados no versículo anterior. Em português, “deles” concorda com “anos”.
- source_word: וְנִשְׁכַּח
  choice: será esquecida
  rationale: Mantém a voz passiva do nifal e comunica que a fartura anterior deixará de ser lembrada por causa da severidade da fome.
- source_word: כָּל הַשָּׂבָע
  choice: Toda a fartura
  rationale: שָׂבָע denota saciedade, plenitude ou abundância. “Fartura” é clara, idiomática e ressalta o contraste direto com a fome.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Preserva a formulação geográfica do hebraico sem reduzi-la simplesmente a “no Egito”.
- source_word: וְכִלָּה
  choice: consumirá
  rationale: O piel de כלה pode indicar acabar com, arruinar ou consumir por completo. “Consumirá” preserva a imagem vigorosa e se ajusta naturalmente à ação devastadora da fome.
- source_word: אֶת הָאָרֶץ
  choice: a terra
  rationale: Mantém a repetição de אָרֶץ e deixa amplo o alcance da devastação sobre o território egípcio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fartura” oferece contraste natural com “fome”; a repetição de “terra” conserva a coesão do hebraico. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
