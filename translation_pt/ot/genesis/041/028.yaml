  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: pt
  text: 'É isto que eu disse ao faraó: o que Deus está para fazer, ele mostrou ao faraó.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que está fazendo”. O particípio hebraico pode indicar uma ação presente ou iminente; neste contexto de interpretação de sonhos, “está para fazer” comunica melhor os acontecimentos que virão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Foi isso
  rationale: Expressa de modo natural em português a identificação enfática hebraica, retomando a explicação já dada por José.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: que eu disse ao faraó
  rationale: Em português, “disse ao faraó” é mais idiomático neste contexto do que o literal “falei ao faraó”, sem perder o sentido do verbo דבר.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O substantivo com artigo refere-se aqui a Deus como personagem definido; “Deus” é a forma portuguesa normal e não acrescenta conteúdo doutrinário.
- source_word: עֹשֶׂה
  choice: está para fazer
  rationale: O particípio pode indicar ação presente ou iminente. Como José interpreta acontecimentos futuros anunciados pelo sonho, a iminência é adequada, enquanto a nota preserva a alternativa mais estritamente presente.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: mostrou ao faraó
  rationale: O hifil de ראה significa “mostrar, fazer ver”; a construção portuguesa pede o destinatário introduzido por “a”.
theological_decisions:
- issue: Referência a הָאֱלֹהִים na fala de José
  choice: Deus
  alternative: o Deus
  rationale: “Deus” corresponde ao uso natural do nome em português e mantém a atribuição da ação e da revelação divinas sem inserir uma formulação confessional adicional.
- issue: Valor temporal de עֹשֶׂה
  choice: está para fazer
  alternative: está fazendo
  rationale: O contexto dos sonhos proféticos favorece ação iminente, mas o particípio hebraico admite valor presente; essa tensão lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faraó” permanece em minúscula por funcionar como título; a ordem da segunda oração foi naturalizada para evitar uma construção pesada sem alterar as relações do hebraico.
