    issue: O marcador וְהִנֵּה não é expresso.
    rationale: A subordinada com «que» torna a frase fluente, mas não preserva a ênfase apresentativa do hebraico. «E eis que» a conserva sem soar excessivamente arcaico no registro bíblico.
  - severity: low
    issue: «de uma única haste» para בְּקָנֶה אֶחָד.
    rationale: A preposição hebraica descreve as espigas como estando/surgindo numa única haste. «Numa só haste» é mais próximo e evita enfatizar uma relação de procedência que o hebraico não especifica.
