  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: pt
  text: E vi em meu sonho, e eis que sete espigas subiam numa só haste, cheias e boas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא
  choice: E vi
  rationale: O wayyiqtol de ראה dá continuidade ao relato de Faraó em primeira pessoa; “E vi” preserva a sequência narrativa com naturalidade.
- source_word: בַּחֲלֹמִי
  choice: no meu sonho
  rationale: A preposição בְּ com חֲלוֹם e o sufixo de primeira pessoa significa naturalmente “no meu sonho”.
- source_word: וְהִנֵּה
  choice: que
  rationale: Neste contexto, a construção portuguesa “vi... que” apresenta vividamente a cena sem recorrer ao pouco corrente “e eis que”; parte da força de הִנֵּה é expressa pela descrição direta.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sete espigas
  rationale: שִׁבֹּלֶת designa aqui a espiga, isto é, a parte da planta que contém os grãos; “espigas” é claro e idiomático em português.
- source_word: עֹלֹת
  choice: subiam
  rationale: O particípio feminino plural retrata a ação em curso na cena do sonho; o imperfeito “subiam” conserva esse aspecto vívido.
- source_word: בְּקָנֶה אֶחָד
  choice: de uma única haste
  rationale: קָנֶה refere-se ao caule ou haste; “de uma única haste” comunica naturalmente que as sete espigas surgiam da mesma estrutura vegetal.
- source_word: מְלֵאֹת
  choice: cheias
  rationale: Mantém o sentido direto do adjetivo hebraico e descreve espigas repletas de grãos.
- source_word: וְטֹבוֹת
  choice: e boas
  rationale: Preserva a amplitude semântica de טוֹב e a coordenação simples do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o aspecto da narrativa hebraica foram preservados, enquanto וְהִנֵּה foi integrado à sintaxe natural de “vi... que”. Não há necessidade de nota lexical, pois “espigas” já designa inequivocamente as cabeças de cereal em português.
