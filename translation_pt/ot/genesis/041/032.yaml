source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: pt
  text: O fato de o sonho ter sido repetido duas vezes ao faraó indica que a questão está firmemente determinada por Deus[a], e que Deus se apressa em realizá-la.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a questão está estabelecida da parte de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Deus a realizará rapidamente” ou “Deus está prestes a realizá-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הִשָּׁנוֹת הַחֲלוֹם
  choice: E o sonho ter sido repetido
  rationale: Reproduz a construção explicativa e o sentido passivo do infinitivo הִשָּׁנוֹת em português natural.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: duas vezes ao faraó
  rationale: Mantém a direção da experiência do sonho para o faraó e traduz literalmente a forma dual פַּעֲמָיִם.
- source_word: כִּי
  choice: significa que
  rationale: Neste contexto, introduz a explicação do significado da repetição; a formulação evita uma construção portuguesa pesada com 'quanto ao fato... é porque'.
- source_word: נָכוֹן הַדָּבָר
  choice: isso está firmemente determinado
  rationale: נָכוֹן expressa firmeza e certeza estabelecida; 'isso' retoma de modo natural o acontecimento anunciado pelo sonho sem restringir דָּבָר a mera palavra.
- source_word: מֵעִם הָאֱלֹהִים
  choice: por Deus
  rationale: A expressão indica a origem e a determinação divinas; 'por Deus' combina naturalmente com 'determinado'.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: e Deus se apressa
  rationale: Preserva o valor participial e a ideia de ação iminente ou pronta, sem convertê-la obrigatoriamente em futuro simples.
- source_word: לַעֲשֹׂתוֹ
  choice: em fazê-lo
  rationale: Mantém a formulação direta do hebraico e o pronome que retoma o acontecimento determinado.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים na explicação de José
  choice: Deus
  alternative: os deuses
  rationale: Embora אֱלֹהִים tenha forma morfologicamente plural, o contexto e a concordância verbal singular identificam um único Deus como aquele que determina e realiza o acontecimento.
- issue: Relação entre a repetição do sonho e a ação divina
  choice: A repetição confirma que o acontecimento está determinado por Deus e será realizado prontamente
  alternative: A repetição apenas intensifica a probabilidade do acontecimento
  rationale: O texto atribui explicitamente a firmeza da questão e sua rápida execução a Deus, sem reduzir a repetição a mera probabilidade psicológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Usa-se 'faraó' em minúscula como título. A construção conserva a explicação causal do hebraico e deixa em nota as nuances de origem divina e iminência.
