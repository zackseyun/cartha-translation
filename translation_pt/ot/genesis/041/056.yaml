source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: pt
  text: A fome atingia toda a face da terra[a]. Então José abriu todos os depósitos[b] e vendeu cereal aos egípcios. E a fome se agravou na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a região”. A palavra hebraica pode designar tanto a terra em sentido amplo quanto uma região ou país.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “abriu tudo o que havia neles”, deixando implícitos os locais de armazenamento; o sentido é que José abriu os depósitos ou celeiros.
    reason: implicit_object
lexical_decisions:
- source_word: הָרָעָב
  choice: a fome
  rationale: Neste contexto, רָעָב designa uma escassez generalizada e grave de alimentos. Em português, “fome” é a forma narrativa mais natural; a dimensão de calamidade já está clara no contexto.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: atingia toda a face da terra
  rationale: Preserva a imagem hebraica da “face da terra” em português compreensível. הָאָרֶץ pode significar tanto “terra” em sentido amplo quanto “região”; a nota mantém essa amplitude sem restringir o texto.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: abriu todos os depósitos
  rationale: O hebraico é elíptico, literalmente “abriu tudo o que havia neles”, sem antecedente expresso para “neles”. O contexto e as versões antigas apontam para os locais onde o cereal estava armazenado. “Depósitos” comunica claramente o referente implícito, enquanto a nota registra a forma incomum do hebraico.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: vendeu cereal aos egípcios
  rationale: Neste contexto, שׁבר é o verbo idiomático para vender provisões ou cereal. “Aos egípcios” expressa naturalmente o uso coletivo de מִצְרַיִם como destinatário.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: a fome se agravou
  rationale: חזק significa literalmente “tornar-se forte”; tendo “fome” como sujeito, indica intensificação. “Se agravou” é idiomático e mantém a progressão narrativa.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Reproduz a expressão hebraica completa e conserva o estilo geográfico e narrativo de Gênesis.
theological_decisions: []
