  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: pt
  text: E a abundância na terra não será percebida por causa daquela fome que virá depois[a], pois ela será muito severa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será conhecida por causa daquela fome posterior”. O verbo hebraico pode significar ser conhecido, reconhecido ou percebido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: não será percebida
  rationale: O nifal de ידע pode expressar ser conhecido, reconhecido ou notado. No contexto, indica que a abundância anterior deixará de ser perceptível diante da fome posterior; “não será percebida” comunica isso com naturalidade.
- source_word: הַשָּׂבָע
  choice: a abundância
  rationale: O substantivo designa a fartura agrícola dos anos anteriores. “Abundância” é claro, digno e adequado ao contexto econômico e agrícola.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Refere-se à região atingida pelos acontecimentos, não necessariamente ao mundo inteiro. “Na terra” preserva a formulação hebraica sem ampliar seu alcance.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição introduz aqui a causa de a abundância deixar de ser percebida.
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: aquela fome que virá depois
  rationale: Preserva tanto a força demonstrativa de הַהוּא quanto a sequência temporal de אַחֲרֵי כֵן em português natural.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: pois ela será muito severa
  rationale: Embora כבד signifique literalmente “pesado”, aplicado à fome exprime grande severidade. O futuro é apropriado porque José interpreta acontecimentos ainda por vir.
