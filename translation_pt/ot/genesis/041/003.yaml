base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: pt
  text: E eis que outras sete vacas subiam depois delas, saindo do Nilo[a], feias de aparência e magras de corpo[b]; e puseram-se ao lado das vacas, à margem do Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o rio” (יְאֹר), referindo-se aqui especificamente ao Nilo no contexto egípcio.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “finas de carne”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função vívida de apresentação e a mudança de cena marcada por הִנֵּה, em linguagem digna e ainda compreensível.
- source_word: פָּרוֹת
  choice: vacas
  rationale: O plural feminino designa especificamente bovinos fêmeas; “vacas” é mais preciso que “gado” e não pressupõe idade.
- source_word: אֲחֵרוֹת
  choice: outras
  rationale: Distingue naturalmente este segundo grupo das sete vacas já mencionadas.
- source_word: עֹלוֹת
  choice: subiam ... saindo
  rationale: O particípio descreve as vacas emergindo do rio; a formulação portuguesa explicita esse movimento de modo natural sem perder o aspecto progressivo.
- source_word: אַחֲרֵיהֶן
  choice: atrás delas
  rationale: Conserva a possibilidade espacial de que vinham atrás das primeiras vacas, embora a expressão também possa indicar sequência temporal.
- source_word: הַיְאֹר
  choice: o Nilo
  rationale: No contexto egípcio de Gênesis, יְאֹר refere-se especificamente ao Nilo; o nome torna o referente claro ao leitor moderno.
- source_word: רָעוֹת מַרְאֶה
  choice: feias de aparência
  rationale: Expressa uma avaliação visual negativa, não maldade moral, e acompanha de perto a construção hebraica.
- source_word: דַקּוֹת בָּשָׂר
  choice: magras de corpo
  rationale: Comunica em português corrente a extrema falta de carne indicada pelo hebraico, preservando a referência corporal.
- source_word: וַתַּעֲמֹדְנָה
  choice: e ficaram
  rationale: No contexto, o verbo indica que as vacas tomaram posição junto às outras; “ficaram” soa mais natural do que a reprodução rígida “puseram-se de pé”.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: Traduz com clareza a proximidade espacial.
- source_word: שְׂפַת הַיְאֹר
  choice: à margem do Nilo
  rationale: “Margem” é a expressão idiomática em português para a borda de um rio.
