  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: pt
  text: 'Ao fim de dois anos completos[a], o faraó teve um sonho: eis que estava em pé junto ao Nilo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dois anos de dias”, expressão hebraica que indica um período completo de dois anos.
    reason: lexical_alternative
  - marker: b
    text: Ou “rio”; neste contexto egípcio, o termo se refere ao Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Ao fim de
  rationale: A abertura narrativa com וַיְהִי integra-se naturalmente à expressão temporal; מִקֵּץ assinala o término do período.
- source_word: שְׁנָתַיִם יָמִים
  choice: dois anos completos
  rationale: A expressão hebraica literalmente diz “dois anos de dias” e destaca que se cumpriu todo o período de dois anos.
- source_word: פַרְעֹה
  choice: o faraó
  rationale: Emprega-se o título régio consagrado em português, com artigo definido natural neste contexto.
- source_word: חֹלֵם
  choice: teve um sonho
  rationale: O particípio apresenta o sonho como o novo acontecimento da narrativa. Esta formulação é idiomática em português e introduz com clareza a cena vista no sonho.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a função de chamar vividamente a atenção para a cena que surge no sonho, em registro literário ainda compreensível.
- source_word: עֹמֵד
  choice: estava em pé
  rationale: O particípio retrata a postura em curso dentro da cena do sonho.
- source_word: עַל
  choice: junto a
  rationale: Neste cenário, a preposição indica proximidade à margem do rio, não posição sobre ele.
- source_word: הַיְאֹר
  choice: o Nilo
  rationale: No contexto egípcio de Gênesis, יְאֹר designa o rio Nilo; explicitar o referente evita uma generalidade enganosa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Eis que” conserva a vivacidade literária do hebraico sem tornar o restante da frase arcaico.
