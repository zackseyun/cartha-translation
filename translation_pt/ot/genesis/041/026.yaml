  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: pt
  text: As sete vacas boas são sete anos, e as sete espigas boas são sete anos. O sonho é um só.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: vacas
  rationale: O termo designa especificamente bovinos do sexo feminino, como exige a imagem do sonho.
- source_word: הַטֹּבֹת
  choice: boas
  rationale: Preserva o sentido amplo e direto do adjetivo hebraico sem restringi-lo a aparência ou saúde.
- source_word: שָׁנִים
  choice: anos
  rationale: Equivalente direto; José identifica explicitamente os símbolos como períodos de anos.
- source_word: שִׁבֳּלִים
  choice: espigas
  rationale: Em português, “espigas” designa naturalmente a parte da planta que contém os grãos e é clara no contexto.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: O sonho é um só
  rationale: 'Expressa de modo natural a ênfase hebraica na unidade: os dois conjuntos de símbolos comunicam uma única mensagem onírica.'
- source_word: הֵנָּה
  choice: são
  rationale: O pronome feminino plural exerce função copulativa e é naturalmente vertido pelo verbo “ser” em português.
