  source_fidelity: 'A tradução reproduz adequadamente as duas identificações simbólicas: as vacas correspondem a sete anos, e as espigas danificadas correspondem a sete anos de fome. «Magras» traduz bem רַקּוֹת, «espigas vazias» comunica היטב a imagem de הָרֵקוֹת, e «serão» preserva a força prospectiva de יִהְיוּ. A formulação para רָעוֹת deve, porém, referir-se mais diretamente à aparência/condição das vacas, sem a construção um tanto vaga «de aspecto ruim».'
