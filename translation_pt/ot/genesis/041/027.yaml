base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: pt
  text: As sete vacas magras e de má aparência que subiram depois delas são sete anos; e as sete espigas vazias, queimadas pelo vento leste[a], serão sete anos de fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ressequidas pelo vento leste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַקּוֹת וְהָרָעֹת
  choice: magras e de aspecto ruim
  rationale: No contexto das vacas, רַקּוֹת indica magreza, enquanto רָעוֹת descreve sua condição ou aparência ruim, não maldade moral. A expressão é clara e natural em português.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: que subiram depois delas
  rationale: Preserva tanto o movimento de subida visto no sonho quanto a sequência em que as vacas apareceram.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: são sete anos
  rationale: Expressa diretamente a identificação simbólica feita por José, sem acrescentar explicação.
- source_word: הַשִׁבֳּלִים הָרֵקוֹת
  choice: as espigas vazias
  rationale: שִׁבֳּלִים designa espigas, e רֵקוֹת indica que não estavam cheias de grãos. 'Espigas vazias' comunica a imagem agrícola com clareza.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: queimadas pelo vento leste
  rationale: O particípio descreve espigas danificadas pelo vento oriental quente e ressecante. 'Queimadas' é vívido e acessível; a nota registra uma alternativa lexical.
- source_word: יִהְיוּ שֶׁבַע שְׁנֵי רָעָב
  choice: serão sete anos de fome
  rationale: O imperfeito tem força prospectiva na interpretação do sonho, e 'anos de fome' é uma formulação natural e precisa em português.
