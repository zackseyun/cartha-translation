base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: pt
  text: 'E Faraó disse a José: “Veja, eu o coloquei sobre toda a terra do Egito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva esse fluxo sem explicitar uma relação temporal ou lógica além do texto.
- source_word: פַּרְעֹה
  choice: Faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: אֶל יוֹסֵף
  choice: a José
  rationale: A preposição אֶל introduz o destinatário da fala, e “a José” é uma formulação natural e digna em português.
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo chama a atenção de José para a declaração solene que segue. “Veja” preserva essa função discursiva em linguagem moderna.
- source_word: נָתַתִּי אֹתְךָ
  choice: eu o coloquei
  rationale: Embora נתן signifique literalmente “dar”, com objeto pessoal e עַל neste contexto administrativo expressa a instalação de José numa posição de autoridade. “Coloquei” conserva a imagem verbal sem recorrer a uma explicitação excessiva como “nomeei”.
- source_word: עַל
  choice: sobre
  rationale: Marca a autoridade exercida por José em relação ao território governado.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: toda a terra do Egito
  rationale: Reproduz tanto a abrangência de כָּל quanto o substantivo אֶרֶץ, mantendo a formulação territorial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O pronome objeto “o” retoma José de modo natural; a estrutura mantém de perto a declaração régia do hebraico sem torná-la arcaica.
