  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: pt
  text: 'Então o faraó disse aos seus servos: “Será que podemos encontrar um homem como este, em quem esteja o espírito de Deus[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de Deus”, “o espírito de Deus” ou “um espírito divino”. A expressão hebraica רוּחַ אֱלֹהִים pode ser entendida de mais de uma maneira.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma tradicional e corrente em português para o título real egípcio.
- source_word: עֲבָדָיו
  choice: aos seus servos
  rationale: Tradução lexical direta; no contexto da corte, pode abranger oficiais e cortesãos sem especificar excessivamente a função.
- source_word: הֲנִמְצָא
  choice: Será que podemos encontrar
  rationale: Reproduz como pergunta retórica e deliberativa a forma interrogativa com o imperfeito na primeira pessoa do plural.
- source_word: כָזֶה אִישׁ
  choice: alguém como este
  rationale: Mantém a referência demonstrativa específica a José e soa mais natural em português do que “um homem como este” nesta pergunta.
- source_word: אֲשֶׁר ... בּוֹ
  choice: em quem esteja
  rationale: Preserva a construção locativa “nele” por meio de uma oração relativa natural em português.
- source_word: רוּחַ אֱלֹהִים
  choice: o espírito de Deus
  rationale: Mantém a leitura forte e tradicional da expressão, mas a minúscula evita decidir pela tipografia uma questão que o hebraico deixa aberta; a ambiguidade é explicitada em nota.
theological_decisions:
- issue: Se רוּחַ אֱלֹהִים designa especificamente o Espírito de Deus ou, da perspectiva do faraó, um espírito divino
  choice: o espírito de Deus
  alternative: um espírito de Deus; um espírito divino
  rationale: A construção hebraica sem artigo admite mais de uma compreensão. O texto principal conserva a referência direta a Deus e a nota preserva as leituras indefinidas, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Será que” dá naturalidade à pergunta retórica; “este” conserva a referência imediata a José. O marcador [a] aparece no texto principal junto à expressão ambígua que explica.
