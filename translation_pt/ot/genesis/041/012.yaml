  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a slave of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: pt
  text: E ali conosco estava um jovem hebreu, escravo do chefe da guarda. Contamos a ele os nossos sonhos, e ele os interpretou para nós; interpretou para cada um conforme o seu sonho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “interpretou para cada um conforme o seu sonho”; isto é, deu a cada pessoa uma interpretação correspondente ao sonho que ela teve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: um jovem hebreu
  rationale: נַעַר designa aqui um jovem, não necessariamente um menino; עִבְרִי é a designação étnica comum “hebreu”.
- source_word: עֶבֶד
  choice: escravo
  rationale: A identificação de José como pertencente ao oficial torna saliente sua condição de escravizado; “escravo” expressa isso com mais precisão que “servo”.
- source_word: שַׂר הַטַּבָּחִים
  choice: chefe da guarda
  rationale: O título designa o oficial ligado à guarda e às execuções da corte. “Chefe da guarda” é claro e natural em português, sem reproduzir literalmente o sentido básico de טַבָּחִים.
- source_word: וַנְּסַפֶּר לוֹ
  choice: Contamos a ele
  rationale: ספר, neste contexto, significa narrar ou contar os sonhos; a formulação é direta e corrente.
- source_word: וַיִּפְתָּר לָנוּ
  choice: ele os interpretou para nós
  rationale: פתר é o verbo próprio para interpretar sonhos; o pronome retoma naturalmente “os nossos sonhos”.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: interpretou o sonho de cada um conforme o seu sonho
  rationale: A redação conserva a força distributiva de אִישׁ e a repetição semântica do hebraico, enfatizando que cada interpretação correspondia ao sonho individual.
