  to: E ali conosco estava um jovem hebreu, escravo do chefe da guarda. Contamos a ele os nossos sonhos, e ele os interpretou para nós; interpretou para cada um conforme o seu sonho.[a]
  rationale: A revisão conserva todos os dados semânticos do versículo e torna a cláusula final idiomática em português, mantendo a ênfase hebraica de que a interpretação correspondia ao sonho de cada pessoa. A nota foi ajustada para explicar com precisão a construção distributiva.
