  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: pt
  text: 'E aconteceu exatamente como ele havia interpretado para nós: assim foi. A mim restituiu ao meu cargo, mas a ele enforcou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pendurou” ou “o suspendeu”. O verbo hebraico pode indicar pendurar ou suspender o corpo, sem especificar por si só se isso foi o meio da execução ou uma exposição posterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: E aconteceu exatamente como ...
  rationale: A construção correlativa declara que o desfecho correspondeu precisamente à interpretação. A formulação evita uma repetição pouco natural de 'aconteceu' em português, sem perder a ênfase.
- source_word: פָּתַר לָנוּ
  choice: ele nos havia interpretado
  rationale: פתר, no contexto de sonhos, significa interpretar. O mais-que-perfeito composto torna clara a anterioridade da interpretação em relação ao cumprimento.
- source_word: אֹתִי הֵשִׁיב
  choice: a mim, ele restituiu
  rationale: A anteposição de 'a mim' preserva a ênfase contrastiva do objeto hebraico diante de וְאֹתוֹ, distinguindo os dois destinos.
- source_word: עַל כַּנִּי
  choice: ao meu cargo
  rationale: O idioma refere-se ao lugar ou posição oficial anterior do copeiro. 'Cargo' comunica isso de modo claro e natural.
- source_word: וְאֹתוֹ תָלָה
  choice: mas o outro, ele enforcou
  rationale: '''Mas'' explicita o forte contraste contextual permitido pela conjunção hebraica. ''O outro'' é natural em português e retoma o segundo funcionário; ''enforcou'' expressa תלה neste contexto judicial.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem marcada 'a mim ... mas o outro' conserva o contraste do hebraico sem produzir uma frase excessivamente rígida.
