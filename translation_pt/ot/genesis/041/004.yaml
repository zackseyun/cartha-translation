  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: pt
  text: Então, as vacas feias de aparência e magras de carne comeram as sete vacas belas de aparência e gordas[a]. E o faraó acordou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ruins de aparência ... e saudáveis ou robustas”. Os termos hebraicos podem ser traduzidos mais literalmente como “ruins” e “saudáveis/robustas”, mas o contexto favorece o contraste físico entre feias e magras, de um lado, e belas e gordas, do outro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Então ... comeram
  rationale: O wayyiqtol feminino plural dá continuidade à sequência do sonho. “Comeram” preserva o sentido simples de אכל, sem intensificá-lo para “devoraram”; “Então” expressa naturalmente o avanço narrativo.
- source_word: הַפָּרוֹת
  choice: as vacas
  rationale: פָּרוֹת é o plural feminino de “vaca”; a tradução específica corresponde à imagem do sonho.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: de aparência feia
  rationale: Embora רָעוֹת signifique literalmente “más/ruins”, junto de הַמַּרְאֶה descreve aspecto desagradável. A formulação mantém o vínculo explícito com a aparência e contrasta com “bela aparência”.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: e de carne magra
  rationale: דַקֹּת indica magreza, e בָּשָׂר se refere à carne corporal. A expressão conserva a imagem concreta do hebraico e soa digna e compreensível em português.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: as sete vacas
  rationale: O marcador de objeto direto seguido do numeral e do substantivo resulta diretamente em “as sete vacas”.
- source_word: יְפֹת הַמַּרְאֶה
  choice: de bela aparência
  rationale: A expressão preserva o paralelismo com “de aparência feia” e traduz יְפֹת como “bela”, sem reduzir a descrição a uma paráfrase coloquial.
- source_word: וְהַבְּרִיאֹת
  choice: e gordas
  rationale: בְּרִיאֹת pode significar “gordas, robustas, saudáveis”. No contraste físico com as vacas de carne magra, “gordas” é a opção mais concreta e contextual.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: E o faraó acordou
  rationale: A formulação traduz diretamente o verbo יקץ e mantém a progressão coordenada do hebraico em português natural.
