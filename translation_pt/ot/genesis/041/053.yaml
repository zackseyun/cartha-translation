- source_word: אֲשֶׁר הָיָה
  choice: que houve
  rationale: Forma idiomática em português para situar o período de fartura já concluído, sem sobrecarregar a frase.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém explicitamente אֶרֶץ e conserva o tom narrativo bíblico em português claro.
