base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: pt
  text: 'Toda a terra do Egito começou a passar fome, e o povo clamou ao faraó por pão. O faraó disse a todo o Egito: “Vão a José; o que ele disser a vocês, façam.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: começou a passar fome
  rationale: Expressa o início da experiência de fome indicado pela forma narrativa do verbo רעב, sem reduzir o sentido a um estado estático nem explicitar mais do que o hebraico.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: toda a terra do Egito
  rationale: Mantém o substantivo explícito אֶרֶץ e a abrangência de כָּל, em formulação clara e tradicional em português.
- source_word: וַיִּצְעַק הָעָם
  choice: o povo clamou
  rationale: “Clamou” comunica o pedido urgente e angustiado expresso por צעק, com registro digno e natural.
- source_word: לַלָּחֶם
  choice: por pão
  rationale: Preserva o sentido lexical direto de לֶחֶם. Embora “alimento” seja possível por metonímia no contexto, “pão” mantém maior transparência em relação ao texto hebraico.
- source_word: לְכָל מִצְרַיִם
  choice: a todo o Egito
  rationale: Conserva o uso coletivo do nome do território no hebraico, sem o converter interpretativamente em “a todos os egípcios”.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Vão a José
  rationale: Traduz diretamente o imperativo plural e adota a forma portuguesa convencional do nome.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: o que ele disser a vocês, façam
  rationale: Mantém a ordem enfática do hebraico, que antepõe aquilo que José disser, e continua inteligível e natural em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe final preserva a ênfase do hebraico sem soar excessivamente arcaica. Não se adotou a nota da camada inglesa porque ela descreve uma alternativa estilística em inglês e seu marcador aparece deslocado; em português, a formulação escolhida já comunica o texto com clareza.
