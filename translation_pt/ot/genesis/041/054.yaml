  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: pt
  text: Começaram então os sete anos de fome, conforme José havia dito. Houve fome em todas as terras, mas em toda a terra do Egito havia pão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimento”; o termo hebraico traduzido como “pão” também pode designar alimento ou provisões em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: Começaram então
  rationale: A construção hebraica expressa o início ou a chegada dos anos de fome. Em português, “começaram” comunica naturalmente o sentido incoativo; “então” ajuda a marcar a progressão narrativa sem acrescentar conteúdo substancial.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: os sete anos de fome
  rationale: Mantém de forma clara e idiomática a relação da cadeia construta hebraica.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: conforme José havia dito
  rationale: “Conforme” expressa a correspondência indicada por כַּאֲשֶׁר, e o mais-que-perfeito composto deixa claro que a declaração de José precedeu o acontecimento.
- source_word: וַיְהִי רָעָב
  choice: Houve fome
  rationale: Equivalente português direto e natural da construção existencial hebraica, sem intensificação indevida.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: em todas as terras
  rationale: Preserva o plural e o alcance amplo de אֲרָצוֹת, evitando a conotação política moderna de “países”.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: mas em toda a terra do Egito
  rationale: Embora וּ seja formalmente “e”, o contexto estabelece contraste entre a fome nas demais terras e a disponibilidade de pão no Egito; “mas” torna essa relação explícita em português natural.
- source_word: הָיָה לָחֶם
  choice: havia pão
  rationale: Mantém o termo concreto לֶחֶם, “pão”, no texto principal, ao mesmo tempo que a nota registra seu possível sentido mais amplo de alimento ou provisões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural em português, mantendo a progressão e o contraste do hebraico. O marcador da nota foi colocado após “pão”, termo ao qual a alternativa lexical se refere.
