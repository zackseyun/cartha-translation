  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: pt
  text: As espigas finas engoliram as sete espigas viçosas e cheias.[a] Então o faraó acordou, e eis que era um sonho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as sete espigas robustas e cheias”. O adjetivo hebraico traduzido por “viçosas” também pode indicar uma condição robusta ou bem nutrida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: engoliram
  rationale: Traduz diretamente בלע e preserva a imagem vívida e anormal do sonho, sem acrescentar a nuance predatória de “devoraram”.
- source_word: הַשִּׁבֳּלִים
  choice: espigas
  rationale: Neste contexto, שִׁבֹּלֶת designa a parte da planta que contém os grãos; “espigas” é natural, exato e amplamente compreensível em português.
- source_word: הַדַּקּוֹת
  choice: finas
  rationale: Reproduz o sentido direto do adjetivo, que descreve as espigas como delgadas, sem harmonizá-las indevidamente com as vacas magras do sonho anterior.
- source_word: שֶׁבַע
  choice: sete
  rationale: Correspondência direta do numeral cardinal.
- source_word: הַבְּרִיאוֹת
  choice: viçosas
  rationale: Em referência a espigas, “viçosas” expressa naturalmente uma condição saudável, robusta e bem desenvolvida, evitando o pouco idiomático “gordas”.
- source_word: וְהַמְּלֵאוֹת
  choice: e cheias
  rationale: Mantém de perto o sentido de מלא e indica espigas cheias de grãos sem substituir a ideia por “maduras”.
- source_word: וַיִּיקַץ
  choice: acordou
  rationale: Forma narrativa corrente e digna para o despertar do faraó.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva o marcador de atenção e a súbita constatação do texto hebraico em registro bíblico ainda compreensível.
- source_word: חֲלוֹם
  choice: era um sonho
  rationale: O hebraico traz a expressão abrupta “e eis, um sonho”; a cópula é suprida em português para dar clareza sem perder a concisão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. “Espigas” dispensa uma nota sobre “cabeças de cereal”, pois já designa naturalmente em português a parte da planta que contém os grãos. A construção “e eis que” conserva a força literária de וְהִנֵּה.
