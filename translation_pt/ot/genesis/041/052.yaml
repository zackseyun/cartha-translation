lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: E ao segundo deu o nome de
  rationale: Reproduz de modo natural em português a expressão hebraica de nomeação, mantendo também a conjunção inicial.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Adota a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי
  choice: pois disse
  rationale: Introduz a explicação dada por José; o acréscimo contextual de “disse” torna natural a passagem para a fala explicativa sem alterar seu conteúdo.
- source_word: הִפְרַנִי
  choice: me tornou frutífero
  rationale: Expressa o causativo do verbo פרה e conserva, tanto quanto possível, o jogo sonoro e semântico com Efraim.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo singular e o contexto indicam o Deus de Israel.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: na terra da minha aflição
  rationale: Mantém a imagem geográfica de אֶרֶץ e o sentido grave, porém não excessivamente especificado, de עֳנִי.
theological_decisions:
- issue: Relação entre a fecundidade concedida por Deus e a aflição de José
  choice: Preservar lado a lado a ação de Deus e a descrição do lugar como terra da aflição de José.
  alternative: Restringir a aflição apenas aos sofrimentos anteriores de José ou explicá-la especificamente como exílio familiar.
  rationale: O hebraico não delimita a referência da aflição. A tradução conserva a tensão entre bênção divina e sofrimento, sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Frutífero” preserva o vínculo lexical do hebraico melhor que alternativas mais genéricas, como “próspero”.
