  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: pt
  text: E deu ao segundo o nome de Efraim[a], pois Deus me tornou frutífero na terra da minha aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efraim soa de modo semelhante à expressão hebraica traduzida por «me tornou frutífero».
