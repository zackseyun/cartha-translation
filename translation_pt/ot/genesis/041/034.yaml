- from: 'Que o faraó faça o seguinte: nomeie supervisores sobre a terra e recolha a quinta parte da produção da terra do Egito durante os sete anos de fartura.[a]'
  to: 'Que Faraó faça o seguinte: nomeie administradores sobre o país e recolha a quinta parte da produção da terra do Egito durante os sete anos de fartura.[a]'
  rationale: A revisão substitui uma expressão potencialmente ambígua por «sobre o país», emprega um termo administrativo mais natural para os funcionários nomeados e esclarece na nota que a formulação alternativa com «terra do Egito» se refere à produção da terra. O sentido e a margem de ambiguidade lexical do hebraico são preservados.
