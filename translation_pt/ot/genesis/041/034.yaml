base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: pt
  text: 'Que Faraó faça o seguinte: nomeie administradores sobre o país e recolha a quinta parte da produção da terra do Egito durante os sete anos de fartura.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recolha um quinto da terra do Egito”, isto é, de sua produção. O verbo hebraico pode ser entendido como cobrar ou recolher uma quinta parte durante os anos de fartura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Que o faraó faça o seguinte
  rationale: O verbo עשה é amplo, com o sentido de “fazer”. No contexto de um conselho, a construção exortativa em português comunica adequadamente a força volitiva; “o seguinte” explicita de modo natural o conteúdo apresentado na sequência.
- source_word: וְיַפְקֵד
  choice: nomeie
  rationale: O hifil de פקד indica aqui a designação de pessoas para uma responsabilidade administrativa. “Nomeie” é corrente e preciso.
- source_word: פְּקִדִים
  choice: supervisores
  rationale: O substantivo designa funcionários incumbidos de supervisionar. “Supervisores” transmite claramente a autoridade administrativa delegada sem sugerir necessariamente função militar.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: ארץ se refere ao território governado pelo faraó, e על conserva a ideia de autoridade exercida sobre ele.
- source_word: וְחִמֵּשׁ
  choice: recolha a quinta parte
  rationale: O piel de חמשׁ é entendido no contexto como cobrar ou recolher uma quinta parte. A formulação preserva essa leitura provável sem recorrer ao termo mais técnico “tributar”.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: da produção da terra do Egito
  rationale: Embora o texto hebraico mencione literalmente a terra do Egito como objeto, o contexto de colheita e armazenamento indica que se trata de sua produção. A explicitação evita a impressão de que uma porção do território seria tomada.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: durante os sete anos de fartura
  rationale: שבע denota plenitude ou abundância e, nesta narrativa, caracteriza safras abundantes. “Fartura” é natural, clara e tradicionalmente inteligível em português.
