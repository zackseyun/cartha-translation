  source_fidelity: 'A tradução transmite adequadamente o conselho de José: Faraó deve nomear funcionários e recolher uma quinta parte da produção durante os sete anos de abundância. A explicitação de «produção» é contextualmente justificada, pois a coleta diz respeito aos produtos agrícolas, não ao território. A formulação «sobre a terra», porém, é menos natural e pode sugerir a terra em sentido físico ou o mundo; neste contexto administrativo, «sobre o país» expressa melhor אָרֶץ.'
  naturalness: A construção exortativa é clara e apropriada. «Faraó» com inicial maiúscula corresponde ao uso português corrente para o título empregado como designação individual nesta narrativa. «Sobre o país» soa mais idiomático que «sobre a terra» no contexto de administração estatal.
  terminology: «Administradores» comunica de modo natural o sentido de פְּקִידִים como funcionários designados para uma responsabilidade pública. «Fartura» é um equivalente moderno e adequado para שָׂבָע. A nota preserva a alternativa lexical sem apresentar «terra do Egito» como se fosse o território a ser fisicamente dividido ou tomado.
