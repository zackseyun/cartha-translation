  - severity: low
    issue: A nota alternativa «recolha um quinto da terra do Egito» pode ser entendida como coleta de uma parte do território.
    rationale: Embora reflita a expressão hebraica sem a explicitação de «produção», em português requer esclarecimento de que «terra» representa os seus produtos.
