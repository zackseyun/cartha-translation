  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: pt
  text: Então o faraó tirou da mão o seu anel de selar[a] e o colocou na mão de José. Vestiu-o com roupas de linho fino[b] e pôs em seu pescoço um colar de ouro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «anel». O termo hebraico pode designar um anel em geral, mas, neste contexto régio, provavelmente se refere ao anel de selar do faraó, símbolo da autoridade delegada.
    reason: lexical_alternative
  - marker: b
    text: «Linho fino» traduz o hebraico שֵׁשׁ, termo que designa linho de alta qualidade, associado a riqueza e honra.
    reason: cultural_note
  - marker: c
    text: Ou «corrente de ouro» ou «gargantilha de ouro». A forma exata do adorno para o pescoço designado pelo termo hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: tirou
  rationale: O verbo indica remover ou tirar; «tirou da mão» é natural em português e preserva claramente a ação cerimonial.
- source_word: טַבַּעְתּוֹ
  choice: o seu anel de selar
  rationale: Embora o substantivo possa designar um anel em geral, no contexto régio trata-se provavelmente do anel usado para autenticar atos e conferir autoridade delegada.
- source_word: מֵעַל יָדוֹ
  choice: da mão
  rationale: Equivalência idiomática da expressão espacial hebraica, evitando o artificial «de sobre a mão».
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: e o colocou na mão de José
  rationale: Com o anel como objeto e «na mão de José» como destino, נתן descreve aqui a colocação física, embora seu sentido comum seja «dar».
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: Vestiu-o
  rationale: Reproduz de modo conciso e digno o ato de investidura expresso pelo hebraico.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: com roupas de linho fino
  rationale: שֵׁשׁ designa linho de alta qualidade, associado a riqueza, honra e posição social.
- source_word: רְבִד הַזָּהָב
  choice: um colar de ouro
  rationale: O termo denota um ornamento para o pescoço cuja forma exata é incerta; «colar» é abrangente e natural em português.
- source_word: עַל צַוָּארוֹ
  choice: em seu pescoço
  rationale: Expressão portuguesa natural para a colocação de um adorno, próxima da construção hebraica «sobre/no pescoço».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A sequência de ações foi dividida em duas frases para fluidez, sem alterar a progressão narrativa. «Faraó» foi usado com artigo, conforme o uso português natural; os pronomes mantêm inequívocos tanto o agente quanto José.
