base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: pt
  text: José tinha trinta anos quando se apresentou diante do faraó, rei do Egito. E José saiu da presença do faraó e percorreu toda a terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: tinha trinta anos
  rationale: A expressão idiomática hebraica de idade é vertida de modo natural e exato em português.
- source_word: בְּעָמְדוֹ לִפְנֵי
  choice: quando se apresentou diante de
  rationale: O infinitivo com preposição indica a ocasião em que José compareceu oficialmente perante o faraó; “se apresentou diante de” comunica melhor esse contexto cortesão do que o literal “ficou de pé diante de”.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: o faraó, rei do Egito
  rationale: Mantém o título real e a aposição identificadora em português natural.
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: Depois, José saiu da presença do faraó
  rationale: “Da presença” representa naturalmente o idioma hebraico “de diante de”; “Depois” expressa a progressão narrativa do wayyiqtol sem acrescentar um marcador temporal forte.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: e percorreu toda a terra do Egito
  rationale: O verbo no contexto descreve movimento abrangente pelo território; “percorreu” é conciso e não explicita além do texto o propósito administrativo.
