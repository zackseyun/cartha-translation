translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A tradução mantém a distribuição individual dos sonhos e a correspondência de cada sonho com sua interpretação, evitando tanto um decalque pouco idiomático quanto explicações teológicas ausentes do texto.
