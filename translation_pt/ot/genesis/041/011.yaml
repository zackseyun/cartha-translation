base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: pt
  text: E, na mesma noite, nós dois tivemos sonhos, eu e ele; cada um sonhou conforme a interpretação de seu sonho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: E [...] tivemos sonhos
  rationale: A construção usa o verbo חָלַם com acusativo cognato. Em português natural, “tivemos sonhos” comunica o acontecimento sem a repetição pouco idiomática “sonhamos um sonho”; o plural é distributivo, pois cada homem teve o seu.
- source_word: בְּלַיְלָה אֶחָד
  choice: na mesma noite
  rationale: Literalmente, “em uma noite”; no contexto, אֶחָד ressalta que os dois sonhos ocorreram numa única e mesma noite. “Na mesma noite” torna clara essa coincidência temporal.
- source_word: אֲנִי וָהוּא
  choice: eu e ele
  rationale: Preserva a ordem e a ênfase explícita do hebraico, retomando os dois participantes depois do verbo no plural.
- source_word: אִישׁ
  choice: cada um
  rationale: 'אִישׁ tem sentido distributivo aqui: cada um dos dois homens separadamente. “Cada um” é claro e natural em português.'
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: com a sua própria interpretação
  rationale: A preposição כְּ indica correspondência entre o sonho de cada homem e sua interpretação; “com” expressa essa relação naturalmente, e “própria” explicita o valor distributivo do sufixo singular.
- source_word: חָלָמְנוּ
  choice: teve um sonho
  rationale: O verbo final retoma a ação de sonhar dentro da oração distributiva. A formulação no singular acompanha “cada um” e produz português corrente.
