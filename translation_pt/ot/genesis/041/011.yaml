- from: E, na mesma noite, nós dois tivemos sonhos, eu e ele; cada um teve um sonho com a sua própria interpretação.
  to: E, na mesma noite, nós dois tivemos sonhos, eu e ele; cada um sonhou conforme a interpretação de seu sonho.
  rationale: A revisão preserva a coincidência temporal e a referência explícita aos dois homens, mas corrige a relação entre sonho e interpretação e restitui o verbo «sonhou» na oração distributiva.
