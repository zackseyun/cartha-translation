base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: pt
  text: 'Então o faraó disse a José: “Tive um sonho, mas não há ninguém que o interprete. Ouvi dizer a seu respeito que, quando você ouve um sonho, consegue interpretá-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Tive um sonho
  rationale: A construção hebraica usa verbo e substantivo da mesma raiz para dar ênfase; em português atual, a expressão idiomática natural preserva o sentido sem a redundância artificial de “sonhei um sonho”.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: mas não há ninguém que o interprete
  rationale: Expressa de modo claro a inexistência de um intérprete capaz, mantendo o pronome referente ao sonho.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: Ouvi dizer a seu respeito
  rationale: Reproduz idiomaticamente a informação recebida por terceiros, sem identificar uma fonte que o hebraico não especifica.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: quando você ouve um sonho, consegue interpretá-lo
  rationale: Preserva a sequência ouvir–interpretar e comunica a capacidade atribuída a José; evita sugerir que apenas escutar, por si só, seja o ato interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” adequado à ampla legibilidade brasileira. “Faraó” aparece com artigo, conforme o uso natural em português. Não foram necessárias notas de rodapé.
