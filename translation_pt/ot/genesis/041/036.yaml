  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: pt
  text: Esse alimento servirá de reserva para o país, para os sete anos de fome que haverá na terra do Egito, para que o país não seja arruinado pela fome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não seja cortado pela fome”; isto é, não seja eliminado ou devastado por ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: Esse alimento ficará
  rationale: O perfeito com waw tem valor futuro neste contexto de planejamento. “Esse alimento” retoma o que será recolhido segundo o versículo anterior, sem restringir o termo hebraico a “cereal”.
- source_word: לְפִקָּדוֹן
  choice: como reserva
  rationale: O substantivo indica algo guardado em depósito ou para uso futuro; “reserva” é natural em português e se ajusta ao contexto administrativo.
- source_word: לָאָרֶץ לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: para o país durante os sete anos de fome
  rationale: אֶרֶץ designa aqui o país do Egito. “Durante” expressa de modo natural a relação temporal e final da segunda preposição לְ, evitando uma repetição pouco clara de “para”.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: que haverá na terra do Egito
  rationale: A oração relativa aponta para os anos de fome futuros; a formulação preserva a expressão geográfica hebraica.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: para que o país não seja arruinado pela fome
  rationale: O nifal de כרת significa literalmente “ser cortado/eliminado”; aplicado ao país sob uma fome, comunica sua ruína ou devastação. “Seja arruinado” preserva a gravidade sem produzir a expressão pouco idiomática “seja cortado” em português.
