base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: pt
  text: E eis que outras sete vacas subiam depois delas, mirradas, de aparência muito feia e com pouca carne. Nunca vi, em toda a terra do Egito, vacas tão horríveis quanto elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em estado tão miserável quanto elas”. A expressão hebraica pode abranger tanto a aparência horrível quanto a condição deplorável das vacas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador vívido que introduz a cena seguinte do sonho, em linguagem bíblica ainda compreensível.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: outras sete vacas
  rationale: Identifica corretamente os bovinos como fêmeas e preserva a referência a um segundo grupo de sete.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: subiam atrás delas
  rationale: Conserva a imagem de movimento ascendente e a simultaneidade narrativa sugerida pelo particípio.
- source_word: דַּלּוֹת
  choice: mirradas
  rationale: Expressa a condição física débil e definhada sem repetir simplesmente a ideia posterior de pouca carne.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: de aparência muito feia
  rationale: No contexto, o qualificativo se refere ao aspecto físico, não à maldade moral.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: com pouca carne
  rationale: Transmite de modo natural a magreza corporal expressa literalmente como finas de carne.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: Nunca vi ... vacas ... quanto elas
  rationale: Reproduz idiomaticamente a afirmação enfática de que não havia outras comparáveis.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: em toda a terra do Egito
  rationale: Preserva a abrangência geográfica da expressão hebraica.
- source_word: לָרֹעַ
  choice: tão horríveis
  rationale: Resume de forma natural a péssima aparência e condição das vacas, evitando uma formulação portuguesa artificial ou uma leitura moral.
