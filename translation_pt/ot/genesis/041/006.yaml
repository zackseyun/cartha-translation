  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: pt
  text: E eis que sete espigas finas, queimadas pelo vento leste, brotavam depois delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador narrativo vívido e a súbita introdução de uma nova imagem no sonho, em registro bíblico ainda compreensível.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sete espigas
  rationale: שִׁבֳּלִים designa as espigas, isto é, as partes do cereal que contêm os grãos; em português, o complemento “de cereal” é desnecessário no contexto.
- source_word: דַּקּוֹת
  choice: finas
  rationale: Reproduz diretamente a aparência delgada e mirrada das espigas, sem acrescentar uma interpretação.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: queimadas pelo vento leste
  rationale: O particípio descreve espigas crestadas ou ressequidas, e קָדִים é o vento oriental, quente e destrutivo; “queimadas” comunica naturalmente o efeito.
- source_word: צֹמְחוֹת
  choice: brotavam
  rationale: O particípio feminino plural apresenta o crescimento como ação em curso na cena do sonho.
- source_word: אַחֲרֵיהֶן
  choice: depois delas
  rationale: Mantém a referência às sete espigas do versículo anterior e permite tanto a ideia de sucessão temporal quanto a de surgirem atrás delas.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leve solenidade narrativa em “E eis que”. “Vento leste” foi preferido a “vento oriental” por ser mais imediato para leitores comuns. Não se acrescentou nota: a alternativa lexical entre “queimadas”, “crestadas” e “ressequidas” não altera substancialmente o sentido e “queimadas” expressa bem o efeito do vento quente.'
