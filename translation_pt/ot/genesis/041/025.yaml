  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: pt
  text: 'Então José disse ao faraó: “O sonho do faraó é um só[a]; o que Deus está fazendo, ele revelou ao faraó.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os dois sonhos formam uma só mensagem. O hebraico traz “sonho” no singular.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que Deus está para fazer, ele deu a conhecer ao faraó”. O particípio hebraico também pode apontar, neste contexto, para o que Deus está prestes a realizar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então José disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português moderno.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: O sonho do faraó é um só
  rationale: Preserva o singular explícito do hebraico e a afirmação de unidade, entendida no contexto como a unidade dos dois sonhos em sua mensagem.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: É a forma portuguesa natural para a referência definida ao Deus que revela os acontecimentos.
- source_word: עֹשֶׂה
  choice: está fazendo
  rationale: Traduz diretamente o particípio hebraico sem tornar explícita uma futuridade que a forma verbal, isoladamente, não exige; o contexto pode apontar para a ação iminente de Deus.
- source_word: הִגִּיד
  choice: revelou
  rationale: O hifil de נגד significa comunicar ou dar a conhecer; “revelou” transmite com naturalidade que Deus tornou conhecido a Faraó aquilo que fará.
theological_decisions:
- issue: Referência de הָאֱלֹהִים
  choice: Deus
  alternative: o Deus
  rationale: “Deus” é idiomático em português e não acrescenta uma especificação doutrinária além da referência definida do hebraico.
- issue: Aspecto e temporalidade de עֹשֶׂה
  choice: está fazendo
  alternative: está para fazer
  rationale: Mantém a força participial e a tensão entre ação em curso e ação iminente, sem resolver no texto principal uma nuance temporal não marcada de forma inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a repetição de “faraó” e a formulação compacta do hebraico, esclarecendo em nota a relação entre o singular “sonho” e os dois sonhos narrados.
