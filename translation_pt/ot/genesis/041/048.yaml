  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: pt
  text: Ele recolheu todo o alimento dos sete anos que ocorreram na terra do Egito e o colocou nas cidades. Em cada cidade, colocou o alimento dos campos ao redor dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “O alimento do campo da cidade, que ficava ao redor dela, ele o colocou dentro dela”. O hebraico repete “alimento” e emprega uma construção de retomada para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: recolheu
  rationale: קבץ indica juntar ou reunir. “Recolheu” é natural no contexto de ajuntar a produção para armazenamento.
- source_word: כָּל אֹכֶל
  choice: todo o alimento
  rationale: אֹכֶל é mais abrangente que “cereal” ou “grão”; “alimento” preserva essa amplitude lexical.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: dos sete anos que houve na terra do Egito
  rationale: Mantém de perto o hebraico, que literalmente fala dos anos “que houve” no Egito, com formulação compreensível em português.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: e o colocou nas cidades
  rationale: נתן tem o sentido básico de dar ou colocar. O pronome evita repetição excessiva sem acrescentar explicitamente a noção interpretativa de armazenar.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: o alimento dos campos ao redor dela
  rationale: Expressa naturalmente a relação entre cada cidade e os campos circundantes, sem restringir “alimento” a um produto específico.
- source_word: נָתַן בְּתוֹכָהּ
  choice: Em cada cidade, colocou
  rationale: Explicita em português o sentido distributivo e retoma a ação da construção hebraica, cujo referente feminino singular é cada cidade.
