  to: Ele recolheu todo o alimento dos sete anos que ocorreram na terra do Egito e o colocou nas cidades. Em cada cidade, colocou o alimento dos campos ao redor dela.[a]
  rationale: Ajustei “que houve” para “que ocorreram”, formulação mais natural para anos e fiel ao sentido contextual. Corrigi a nota para que os campos, e não a cidade, sejam apresentados como circundando a cidade, preservando a repetição e a retomada enfática do hebraico.
