  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: pt
  text: E eis que sete espigas mirradas, finas e queimadas pelo vento leste brotavam depois delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força vívida e apresentativa da expressão hebraica na descrição do sonho, em linguagem digna e compreensível.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sete espigas
  rationale: No contexto agrícola, שִׁבֳּלִים designa as espigas ou cabeças de cereal; “espigas” é a forma mais natural e precisa em português.
- source_word: צְנֻמוֹת דַּקּוֹת
  choice: mirradas, finas
  rationale: 'Mantém os dois qualificativos hebraicos em vez de fundi-los: צְנֻמוֹת indica aspecto mirrado ou ressequido, enquanto דַּקּוֹת descreve a pouca espessura.'
- source_word: שְׁדֻפוֹת קָדִים
  choice: queimadas pelo vento leste
  rationale: Expressa o dano causado pelo vento quente vindo do leste; “queimadas” comunica com clareza seu efeito sobre a plantação.
- source_word: צֹמְחוֹת
  choice: brotavam
  rationale: O imperfeito português apresenta a ação em curso na cena do sonho, refletindo o valor aspectual do particípio hebraico.
- source_word: אַחֲרֵיהֶם
  choice: depois delas
  rationale: Indica que essas espigas surgiam em sequência às sete espigas anteriores; o pronome feminino concorda naturalmente com “espigas” em português.
theological_decisions: []
