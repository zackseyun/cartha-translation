  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: pt
  text: Durante os sete anos de fartura, a terra produziu aos punhados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em punhados”. O hebraico usa uma palavra que significa “punhados” ou “mão-cheia” para descrever a abundância da produção da terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: produziu
  rationale: Embora עשה signifique normalmente “fazer”, tendo “a terra” como sujeito em contexto agrícola, descreve naturalmente a produção da terra.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da narrativa de José, refere-se às terras agrícolas do Egito, não ao planeta inteiro.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: durante os sete anos de fartura
  rationale: A expressão indica o período anunciado nos sonhos do faraó; “fartura” comunica de modo claro e natural o sentido de שׂבע.
- source_word: לִקְמָצִים
  choice: em grandes quantidades
  rationale: O substantivo קְמָץ significa literalmente “punhado”. Aqui, a forma adverbial descreve a extraordinária quantidade produzida; a tradução no texto principal comunica esse sentido em português natural, enquanto a nota preserva a imagem concreta.
