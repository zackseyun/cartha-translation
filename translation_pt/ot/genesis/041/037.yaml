  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: pt
  text: A proposta pareceu boa aos olhos do faraó e aos olhos de todos os seus servos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O assunto pareceu bom”.'
    reason: Alternativa mais literal para הַדָּבָר, cujo sentido é amplo.
  - marker: b
    text: 'Ou: “todos os seus oficiais”.'
    reason: No contexto da corte, “servos” pode designar os oficiais do faraó.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: pareceu boa
  rationale: No uso com בְּעֵינֵי, o verbo expressa uma avaliação favorável ou aprovação. “Pareceu boa” conserva essa nuance sem mudar o sujeito da oração.
- source_word: הַדָּבָר
  choice: a proposta
  rationale: Embora דָּבָר possa significar “coisa”, “palavra” ou “assunto”, aqui retoma o plano que José acaba de apresentar; “proposta” explicita naturalmente o referente contextual.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a imagem transparente do idioma hebraico e seu paralelismo, sendo também uma expressão compreensível em português atual.
- source_word: פַרְעֹה
  choice: faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: כָּל עֲבָדָיו
  choice: todos os seus servos
  rationale: עֲבָדִים pode designar servos, subordinados ou oficiais. “Servos” preserva a amplitude lexical, embora no contexto da corte se refira provavelmente aos oficiais do faraó.
