  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva o tom solene e enfático sem recorrer ao arcaísmo “eis”. A ordem foi levemente ajustada para soar natural em português, e a alternativa mais próxima da aposição hebraica foi preservada em nota.
