base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/029.yaml
  text: Look[b][a], seven years of great abundance are coming throughout all the land of Egypt.
translation:
  language: pt
  text: Eis que estão chegando sete anos de grande fartura em toda a terra do Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Eis que estão chegando sete anos — grande fartura em toda a terra do Egito.”'
    reason: A formulação hebraica põe “grande fartura” em aposição depois de “sete anos”, enquanto o texto principal explicita em português a relação natural entre os anos e a fartura.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força de chamar a atenção e a vivacidade dêitica do hebraico, em registro digno e ainda corrente.
- source_word: שֶׁבַע שָׁנִים
  choice: sete anos
  rationale: Tradução direta da expressão numérica temporal.
- source_word: בָּאוֹת
  choice: estão chegando
  rationale: O particípio feminino plural concorda com “anos” no hebraico e apresenta o período futuro como algo que se aproxima; a locução progressiva preserva essa vivacidade.
- source_word: שָׂבָע גָּדוֹל
  choice: grande fartura
  rationale: No contexto, שָׂבָע designa abundância de alimentos e colheitas. “Fartura” comunica isso de maneira natural e concreta, enquanto “grande” preserva a intensificação de גָּדוֹל.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: Reproduz a extensão territorial indicada pela preposição e por כָּל, sem acrescentar uma ideia distributiva além do texto.
