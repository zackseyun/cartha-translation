base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: pt
  text: 'Então o chefe dos copeiros falou ao faraó: “Hoje me lembro das minhas faltas[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos meus pecados” ou “das minhas ofensas”. O termo hebraico pode se referir de modo amplo a uma conduta errada, seja no sentido moral, seja no exercício de uma função.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa essa progressão com naturalidade, e “falou” introduz adequadamente o discurso.
- source_word: שַׂר הַמַּשְׁקִים
  choice: o chefe dos copeiros
  rationale: O título designa o oficial responsável pelo serviço de bebidas na corte. “Chefe dos copeiros” é claro, atual e apropriado ao contexto.
- source_word: אֶת־פַּרְעֹה
  choice: ao faraó
  rationale: Embora אֶת marque o objeto, em português o verbo “falar” neste sentido pede naturalmente a preposição “a”. “Faraó” é tratado como título.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: O infinitivo hebraico introduz a fala direta. Em português, os dois-pontos comunicam essa função com mais naturalidade do que a tradução explícita “dizendo”.
- source_word: אֶת חֲטָאַי
  choice: das minhas faltas
  rationale: חטא pode indicar pecados, ofensas ou faltas. “Faltas” preserva a amplitude do termo e se ajusta à transgressão cometida pelo oficial contra o faraó, sem restringi-la a uma categoria exclusivamente religiosa.
- source_word: אֲנִי מַזְכִּיר
  choice: me lembro
  rationale: O hifil de זכר pode significar fazer lembrar, mencionar ou trazer à memória. Neste contexto, “me lembro” expressa de modo idiomático que o copeiro traz suas faltas passadas à memória e ao discurso.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: “Hoje” preserva de maneira direta e corrente a ênfase temporal do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, mantendo a ênfase inicial em “Hoje” dentro da fala. O marcador [a] aparece imediatamente após o termo ao qual se refere.
