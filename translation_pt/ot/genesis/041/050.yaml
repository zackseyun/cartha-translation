base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: pt
  text: Antes que viesse o ano da fome[a], nasceram a José dois filhos, que Azenate, filha de Potífera, sacerdote de Om[b], lhe deu à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que chegasse o ano da fome”. O hebraico emprega aqui “ano” no singular, referindo-se ao início do período de fome.'
    reason: lexical_alternative
  - marker: b
    text: Om era uma cidade egípcia, mais tarde conhecida em grego como Heliópolis.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: nasceram ... dois filhos
  rationale: O passivo de ילד, com o sujeito plural “dois filhos”, é expresso naturalmente em português pelo verbo intransitivo “nasceram”, preservando a relação indicada por לְיוֹסֵף.
- source_word: וּ/לְ/יוֹסֵף
  choice: a José
  rationale: A preposição לְ marca a relação com José na expressão de nascimento; “nasceram a José” mantém o tom genealógico e é claro em português.
- source_word: בְּ/טֶרֶם
  choice: Antes que
  rationale: Introduz uma oração temporal anterior à chegada do ano da fome; em português, “antes que” pede naturalmente o subjuntivo.
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: chegasse o ano da fome
  rationale: Preserva o singular hebraico “ano” e a imagem verbal de sua chegada, entendida como o início do período de fome.
- source_word: יָלְדָה לּוֹ
  choice: lhe deu à luz
  rationale: Expressão portuguesa natural para o ato de Azenate dar à luz os filhos de José; “lhe” conserva a relação expressa por לּוֹ.
- source_word: אָסְנַת
  choice: Azenate
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: filha de Potífera
  rationale: A cadeia construta identifica Azenate por sua filiação; usa-se a forma portuguesa corrente do nome.
- source_word: כֹּהֵן אֹון
  choice: sacerdote de Om
  rationale: כֹּהֵן significa “sacerdote”, e Om é a forma tradicional portuguesa do topônimo egípcio On.
