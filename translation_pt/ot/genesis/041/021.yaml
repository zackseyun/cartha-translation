  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: pt
  text: As vacas gordas entraram no ventre das vacas magras[a], mas não se percebia que as vacas gordas haviam entrado no ventre das vacas magras, e estas continuavam com mau aspecto, como no início. Então acordei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Elas entraram no ventre delas”. Pelo contexto, as que entraram são as vacas gordas, e o ventre é o das vacas magras.'
    reason: clareza_pronominal
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: As vacas gordas entraram no ventre das vacas magras
  rationale: O verbo בוא descreve a entrada das vacas anteriormente devoradas no interior das vacas magras. קֶרֶב denota o interior; “ventre” torna concreta a imagem do sonho. Os referentes implícitos foram explicitados para evitar que o português sugira que as vacas entraram no próprio ventre.
- source_word: וְלֹא נוֹדַע
  choice: mas não se percebia
  rationale: O nifal de ידע indica que o fato não era perceptível. A construção impessoal conserva esse sentido e soa natural em português.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: que tinham entrado no ventre delas
  rationale: כִּי introduz o conteúdo do que não se percebia. O mais-que-perfeito composto expressa naturalmente em português a anterioridade da entrada, e a repetição de “ventre” acompanha a repetição hebraica.
- source_word: וּמַרְאֵיהֶן רַע
  choice: pois a aparência das vacas magras continuava ruim
  rationale: מַרְאֶה é a aparência visível, e רַע descreve seu mau aspecto. “Continuava” explicita a comparação subsequente sem definir o aspecto mais especificamente como feio ou esquelético; “pois” apresenta essa aparência inalterada como evidência de que a ingestão não era perceptível.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: como no início
  rationale: 'Reproduz de modo conciso a comparação temporal: depois de comerem, as vacas magras tinham o mesmo mau aspecto inicial.'
- source_word: וָאִיקָץ
  choice: Então acordei
  rationale: O wayyiqtol encerra a sequência do relato do sonho; “Então” comunica essa progressão narrativa em português corrente.
