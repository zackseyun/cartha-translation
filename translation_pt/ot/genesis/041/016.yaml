  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: pt
  text: 'José respondeu ao faraó: “Não sou eu; Deus dará ao faraó uma resposta de paz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: É o uso narrativo comum de ענה para introduzir uma resposta e mantém de modo natural a ligação com a fala anterior.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת־פַּרְעֹה
  choice: ao faraó
  rationale: Expressa naturalmente em português o destinatário da resposta; o título é usado com artigo definido.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: A fórmula hebraica de introdução da fala é representada idiomaticamente pela pontuação, evitando o redundante 'dizendo' depois de 'respondeu'.
- source_word: בִּלְעָדָי
  choice: Isso não depende de mim
  rationale: Nega que a capacidade ou resposta proceda de José. A formulação é atual e clara, embora o hebraico seja literalmente mais próximo de 'não eu' ou 'fora de mim'.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo no singular e o contexto indicam referência singular a Deus.
- source_word: יַעֲנֶה
  choice: dará ... uma resposta
  rationale: Desdobra o idiomatismo hebraico de modo natural em português e comunica que Deus fornecerá a resposta decisiva.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: ao faraó uma resposta para o seu bem-estar
  rationale: שָׁלוֹם aqui abrange bem-estar, prosperidade ou resultado favorável. A redação preserva essa amplitude sem limitar o termo a paz interior.
theological_decisions:
- issue: Atribuição da capacidade de interpretar
  choice: José nega que a resposta dependa dele e a atribui a Deus.
  alternative: “Não eu; Deus dará ao faraó uma resposta favorável.”
  rationale: A oposição entre בִּלְעָדָי e אֱלֹהִים apresenta Deus, não José, como fonte da resposta, sem exigir elaboração doutrinária adicional.
- issue: Sentido de שָׁלוֹם na resposta divina
  choice: bem-estar
  alternative: paz; resposta favorável
  rationale: O substantivo pode indicar integridade, segurança, prosperidade ou resultado favorável. 'Bem-estar' conserva melhor essa extensão sem prometer explicitamente que o conteúdo da interpretação será agradável.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção 'Isso não depende de mim' comunica naturalmente a renúncia de José à capacidade própria. O artigo em 'ao faraó' segue o uso corrente no português brasileiro. Não foram necessárias notas de rodapé.
