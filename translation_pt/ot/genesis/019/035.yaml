base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: pt
  text: Naquela noite, elas também deram vinho ao pai delas para que bebesse. A mais nova se levantou e se deitou com ele; e ele não soube quando ela se deitou nem quando se levantou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ele não soube do deitar-se dela nem do levantar-se dela”.'
    reason: Registra a forma nominal e mais formal da expressão hebraica, enquanto o texto principal apresenta seu sentido temporal em português natural.
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: elas deram vinho ... para beber
  rationale: O hifil de שׁקה expressa dar de beber ou fazer beber. A formulação preserva a força causativa sem acrescentar ao verbo a interpretação mais forte de que elas o embriagaram.
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: Também naquela noite
  rationale: גַּם liga o episódio à noite anterior, e a expressão temporal é natural em português como “naquela noite”.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: vinho ao pai
  rationale: A construção hebraica apresenta o pai como quem recebe a bebida e o vinho como aquilo que lhe é dado; “deram vinho ao pai para beber” comunica isso com clareza.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: Então a mais nova se levantou
  rationale: הַצְּעִירָה é um adjetivo feminino substantivado, “a mais nova”. “Então” expressa naturalmente a progressão narrativa do wayyiqtol.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: se deitou com ele
  rationale: Mantém o conhecido eufemismo hebraico para relações sexuais, de modo inteligível e digno, sem explicitação desnecessária.
- source_word: וְלֹא יָדַע
  choice: e ele não percebeu
  rationale: ידע indica aqui consciência do que acontecia. “Não percebeu” é mais natural neste contexto em português do que o literal “não soube”, preservando a falta de consciência.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: quando ela se deitou nem quando se levantou
  rationale: As construções com בְּ têm valor temporal. A repetição simétrica preserva o paralelismo do hebraico.
