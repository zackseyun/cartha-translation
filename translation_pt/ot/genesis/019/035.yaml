translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O sujeito feminino plural foi explicitado como “elas” a partir da morfologia hebraica e do contexto. A tradução mantém o eufemismo sexual do original e não intensifica o verbo de dar de beber para “embriagar”.
