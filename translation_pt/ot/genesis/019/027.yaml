  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: pt
  text: Abraão levantou-se cedo pela manhã e foi ao lugar onde estivera diante de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante da face de Yahweh”, expressão que significa “diante de Yahweh” ou “na presença de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: levantou-se de madrugada
  rationale: O hifil de שׁכם indica levantar-se cedo. Em português, “levantou-se de madrugada” expressa de modo natural a ação matutina antecipada, em combinação com בַּבֹּקֶר.
- source_word: בַּבֹּקֶר
  choice: de madrugada
  rationale: בֹּקֶר designa a manhã; junto de וַיַּשְׁכֵּם, reforça que Abraão se levantou bem cedo. “De madrugada” reproduz idiomaticamente essa ênfase sem repetir “cedo pela manhã”.
- source_word: אֶל הַמָּקוֹם
  choice: ao lugar
  rationale: מָקוֹם é o termo comum para “lugar”, e a expressão remete naturalmente ao local mencionado antes.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: onde estivera
  rationale: A oração relativa retoma uma ação anterior. “Onde” incorpora שָׁם naturalmente, e o mais-que-perfeito “estivera” comunica a anterioridade de עָמַד sem a rigidez de “onde havia ficado em pé”.
- source_word: אֶת־פְּנֵי
  choice: diante de
  rationale: Na construção עמד את־פני, a expressão significa estar diante de alguém, isto é, em sua presença. “Diante de” preserva o idioma de forma concisa e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título, reconhecendo que “Jeová” é outra forma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “e foi” torna explícito em português o deslocamento exigido por “ao lugar”, embora o verbo hebraico destaque literalmente que Abraão se levantou cedo.
