  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: pt
  text: E feriram com cegueira[a] os homens que estavam à entrada da casa, do menor ao maior, de modo que se cansaram tentando encontrar a entrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um ofuscamento” ou “com confusão visual”; o raro termo hebraico talvez indique mais do que cegueira comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: feriram
  rationale: O hifil de נכה significa com frequência “ferir” ou “golpear”; aqui, com o complemento que indica a aflição, “feriram com cegueira” preserva a construção hebraica em português digno e claro.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: אֲנָשִׁים refere-se, neste contexto, aos homens reunidos do lado de fora da casa de Ló.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: que estavam à entrada da casa
  rationale: A expressão os identifica pela localização; o verbo “estavam” é naturalmente suprido em português.
- source_word: בַּסַּנְוֵרִים
  choice: com cegueira
  rationale: O termo raro סַנְוֵרִים descreve uma incapacidade sobrenatural de enxergar adequadamente. “Cegueira” comunica o sentido principal, enquanto a nota preserva outras nuances possíveis.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: do menor ao maior
  rationale: Mantém o merismo hebraico que abrange o grupo inteiro sem restringi-lo indevidamente à idade.
- source_word: וַיִּלְאוּ
  choice: eles se cansaram inutilmente
  rationale: לָאָה expressa cansaço ou exaustão. “Inutilmente” explicita, de modo natural e contextualmente evidente, a frustração do esforço sem alterar seu resultado.
- source_word: לִמְצֹא
  choice: tentando encontrar
  rationale: O infinitivo indica o objetivo do esforço extenuante; esta formulação torna clara essa relação em português corrente.
- source_word: הַפָּתַח
  choice: a entrada
  rationale: פֶּתַח designa a abertura ou entrada. A repetição de “entrada” conserva a repetição lexical do hebraico.
theological_decisions:
- issue: Natureza da aflição indicada por סַנְוֵרִים
  choice: cegueira infligida sobrenaturalmente
  alternative: ofuscamento ou confusão visual
  rationale: A narrativa apresenta uma incapacidade sobrenatural que impede os homens de localizar a entrada, mas o termo hebraico raro pode indicar mais do que cegueira comum. A tradução principal comunica o sentido básico, e a nota preserva a incerteza lexical.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom narrativo digno, o merismo “do menor ao maior” e a repetição de “entrada” presente no hebraico.
