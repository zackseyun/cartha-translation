  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: pt
  text: 'Veja, por favor: esta cidade fica perto o bastante para que eu fuja para lá, e é pequena. Deixe-me, por favor, escapar para lá — ela não é pequena? — para que eu viva.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz um apelo urgente à atenção; “Veja” conserva a força dêitica em português atual e evita o arcaísmo de “Eis”.
- source_word: נָא
  choice: por favor
  rationale: A partícula reforça o tom suplicante e urgente do pedido; a repetição foi mantida nas duas ocorrências.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Equivalência direta e natural do substantivo com o demonstrativo.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: fica perto o bastante para que eu fuja para lá
  rationale: Expressa de modo idiomático a proximidade que torna possível a fuga, preservando שָׁמָּה, “para lá”.
- source_word: וְהִיא מִצְעָר
  choice: e é pequena
  rationale: מִצְעָר indica pequenez; “pequena” mantém clara a alegação de Ló e permite conservar a repetição posterior.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Deixe-me, por favor, escapar para lá
  rationale: O coortativo exprime súplica ou desejo, não simples previsão; “deixe-me” comunica essa força em português natural.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: ela não é pequena?
  rationale: Mantém a pergunta retórica e a repetição lexical de מִצְעָר.
- source_word: וּתְחִי נַפְשִׁי
  choice: para que eu viva
  rationale: נַפְשִׁי funciona aqui como referência à própria pessoa, e a oração coordenada exprime o resultado ou propósito esperado da fuga. A tradução comunica o idioma hebraico sem a tautologia artificial “minha vida viverá”.
theological_decisions: []
