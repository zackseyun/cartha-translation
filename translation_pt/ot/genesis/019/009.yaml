base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: pt
  text: 'Eles disseram[a]: “Saia da frente!” Então disseram: “Este aí veio morar como estrangeiro e agora se põe a julgar![b] Pois vamos fazer pior a você do que a eles.”[c] Então pressionaram com muita força o homem, Ló,[d] e avançaram para arrombar a porta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Afaste-se!”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Este veio residir como estrangeiro e agora quer ser juiz!”'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “Faremos mal a você mais do que a eles”; trata-se da ameaça de causar a Ló um mal ainda maior do que o pretendido contra os visitantes.'
    reason: lexical_alternative
  - marker: d
    text: 'Mais literalmente: “pressionaram muito contra o homem, contra Ló”.'
    reason: previous_rendering
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Saia da frente!
  rationale: A combinação funciona aqui como uma ordem hostil para que Ló se afaste ou dê passagem. “Saia da frente” é natural em português e preserva a força da ameaça.
- source_word: הָאֶחָד
  choice: Este aí
  rationale: A expressão aponta para Ló com desprezo. “Este aí” comunica o tom depreciativo sem recorrer a uma forma arcaica.
- source_word: בָּא לָגוּר
  choice: veio morar aqui como estrangeiro
  rationale: גור descreve residência na condição de não nativo. A formulação torna clara tanto a permanência local quanto a condição social de forasteiro.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: agora se põe a julgar
  rationale: O verbo finito seguido do infinitivo absoluto intensifica a acusação. A expressão portuguesa conserva a ideia de que Ló, aos olhos deles, assumia indevidamente o papel de juiz.
- source_word: נָרַע לְךָ מֵהֶם
  choice: vamos fazer pior a você do que a eles
  rationale: A forma causativa de רעע expressa fazer mal ou causar dano. A tradução preserva diretamente a comparação e o caráter ameaçador.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: investiram com muita força contra o homem, contra Ló
  rationale: No contexto físico, פצר descreve pressão insistente e intensa. “Investiram ... contra” comunica o avanço agressivo, enquanto “com muita força” representa מְאֹד e a repetição de “contra” preserva a estrutura enfática do hebraico.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: avançaram para arrombar a porta
  rationale: נגשׁ com o infinitivo indica aproximação com propósito; “arrombar” expressa naturalmente a quebra forçada da porta neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com escolhas naturais para leitores brasileiros. O discurso da multidão conserva seu desprezo e sua violência sem acrescentar explicações denominacionais. As repetições enfáticas do hebraico foram mantidas quando funcionais e esclarecidas em nota quando soariam pouco naturais no texto principal.
