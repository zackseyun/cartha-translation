base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: pt
  text: Mas a mulher dele, que estava atrás dele, olhou para trás[a] e se tornou uma coluna de sal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “olhou de detrás dele”. A expressão pode indicar que ela estava atrás dele ou estar ligada ao ato de olhar para trás.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: olhou para trás
  rationale: O verbo significa “olhar” ou “contemplar”; neste contexto, junto de מֵאַחֲרָיו, “olhou para trás” expressa de modo natural a direção do olhar sem atribuir motivo à ação.
- source_word: אִשְׁתּוֹ
  choice: a mulher dele
  rationale: O substantivo com sufixo masculino singular significa literalmente “a mulher dele”, isto é, a esposa de Ló. A formulação é clara e corrente em português.
- source_word: מֵאַחֲרָיו
  choice: que vinha atrás
  rationale: A expressão hebraica significa literalmente “de trás dele”. No contexto, pode indicar a posição da mulher em relação a Ló e também integrar a ideia de olhar para trás. A tradução principal preserva sua posição sem produzir a redundância pouco natural “olhou para trás de trás dele”; a nota registra a forma mais literal.
- source_word: וַתְּהִי
  choice: se tornou
  rationale: Na sequência narrativa, היה indica mudança ou estado resultante; “se tornou” comunica isso diretamente.
- source_word: נְצִיב
  choice: uma coluna
  rationale: O termo designa algo erguido ou colocado em pé. “Coluna” é natural em português para uma formação vertical e corresponde ao sentido tradicional sem acrescentar explicação.
- source_word: מֶלַח
  choice: de sal
  rationale: A relação nominal com נְצִיב é expressa naturalmente como “uma coluna de sal”.
theological_decisions:
- issue: Natureza da transformação da mulher de Ló
  choice: se tornou uma coluna de sal
  alternative: ficou como uma coluna de sal
  rationale: O hebraico apresenta diretamente a mudança, sem partícula comparativa. A tradução mantém a afirmação narrativa e não a enfraquece transformando-a em comparação.
- issue: Relação de מֵאַחֲרָיו com a posição e o olhar
  choice: que vinha atrás, olhou para trás
  alternative: olhou de trás dele
  rationale: A expressão pode descrever a posição da mulher atrás de Ló ou, em combinação com o verbo, a direção de seu olhar. O texto principal oferece português natural, enquanto a nota conserva a construção mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “A mulher dele” evita a possível ambiguidade referencial de “sua mulher”; “que vinha atrás” explicita apenas a posição sugerida pela expressão hebraica, sem acrescentar motivo ou avaliação à ação.
