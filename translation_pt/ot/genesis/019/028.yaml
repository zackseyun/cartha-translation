  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: pt
  text: Olhou para Sodoma e Gomorra e para toda a terra da planície; viu, e eis que da terra subia fumaça, como a fumaça de uma fornalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como a fumaça de um forno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: Olhou para
  rationale: O verbo no hifil descreve o ato de observar a partir de um ponto elevado. “Olhou para” é natural em português e, no contexto, não precisa explicitar a direção vertical.
- source_word: עַל פְּנֵי
  choice: para
  rationale: A expressão espacial indica que Abraão contempla a região diante dele. “Para” evita o literalismo pouco natural de “sobre a face de”.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: Formas tradicionais e amplamente reconhecidas dos topônimos em português.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: toda a terra da planície
  rationale: כִּכָּר designa aqui a planície ou distrito do Jordão. A formulação conserva a referência geográfica sem acrescentar uma identificação não expressa no versículo.
- source_word: וַיַּרְא
  choice: viu
  rationale: Correspondência direta e natural para ראה, preservando a sequência narrativa.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função de הִנֵּה, que introduz com vivacidade aquilo que se apresenta aos olhos de Abraão.
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: da terra subia fumaça
  rationale: Expressa de modo idiomático o movimento ascendente visível da fumaça e mantém “terra” como referência à região observada.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: como a fumaça de uma fornalha
  rationale: כִּבְשָׁן pode indicar fornalha ou forno. “Fornalha” comunica com clareza a imagem de fumaça intensa que sobe, enquanto a alternativa lexical é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa. A expressão “e eis que” conserva a vivacidade do marcador hebraico sem tornar o restante do versículo artificialmente arcaico.
