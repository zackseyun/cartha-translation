base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: pt
  text: Então Ló subiu de Zoar e passou a morar na região montanhosa, com suas duas filhas, pois tinha medo de morar em Zoar. Assim, passou a morar numa caverna[a], ele e suas duas filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na caverna”. O artigo definido pode apenas indicar a caverna específica que Ló ocupou, embora em português seja natural dizer “numa caverna” quando ela é mencionada pela primeira vez como moradia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: saiu de Zoar e subiu
  rationale: עלה expressa movimento para cima, enquanto מן indica afastamento do lugar. A formulação preserva tanto a saída de Zoar quanto o sentido topográfico da subida.
- source_word: וַיֵּשֶׁב
  choice: passou a morar
  rationale: ישב, neste contexto, indica residência. “Passou a morar” é natural em português atual e comunica o início dessa nova situação sem o tom arcaico de “habitou”.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: O singular הַר pode designar coletivamente uma zona de montanhas. “Região montanhosa” preserva o valor topográfico sem exigir uma montanha específica nem introduzir um plural lexical explícito.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: com suas duas filhas
  rationale: A expressão hebraica é uma construção nominal coordenada. A formulação portuguesa integra naturalmente a informação de que as duas filhas acompanharam Ló.
- source_word: כִּי יָרֵא
  choice: pois tinha medo
  rationale: כִּי introduz a razão da mudança, e יָרֵא descreve o estado de temor de Ló. “Pois tinha medo” é claro e idiomático.
- source_word: לָשֶׁבֶת בְּצֹעַר
  choice: de morar em Zoar
  rationale: O infinitivo de ישב refere-se a residir no lugar, e não apenas a permanecer ali por pouco tempo.
- source_word: בַּמְּעָרָה
  choice: numa caverna
  rationale: Embora o hebraico tenha artigo definido, em português é natural empregar o indefinido na primeira menção a uma caverna ainda não identificada. A forma mais literal é registrada em nota.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: ele e suas duas filhas
  rationale: A expressão final retoma e enfatiza quem ocupava a caverna; sua posição conclusiva foi preservada.
