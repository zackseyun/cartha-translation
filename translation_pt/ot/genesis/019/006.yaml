  yaml_path: translation/ot/genesis/019/006.yaml
  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: pt
  text: Ló saiu até eles na entrada e fechou a porta atrás de si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à abertura”. O hebraico distingue entre a entrada ou abertura (פֶּתַח) e a porta propriamente dita (דֶּלֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O wayyiqtol de יצא faz a narrativa avançar com uma ação passada simples; “saiu” é natural e preserva o movimento para fora.
- source_word: אֲלֵהֶם
  choice: até eles
  rationale: A preposição אֶל com o sufixo de terceira pessoa masculina plural indica movimento em direção aos homens que estavam do lado de fora.
- source_word: לוֹט
  choice: Ló
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַפֶּתְחָה
  choice: à entrada
  rationale: פֶּתַח designa a abertura ou entrada, enquanto o he direcional indica movimento em sua direção. A escolha mantém a distinção em relação a דֶּלֶת, na oração seguinte.
- source_word: וְהַדֶּלֶת
  choice: a porta
  rationale: דֶּלֶת refere-se à porta propriamente dita, distinta da entrada ou abertura (פֶּתַח).
- source_word: סָגַר
  choice: fechou
  rationale: Equivalente corrente e idiomático de סגר no contexto de fechar uma porta.
- source_word: אַחֲרָיו
  choice: atrás de si
  rationale: Aqui אַחַר tem sentido espacial; “atrás de si” deixa claro que Ló fechou a porta depois de sair, sem sugerir que ela ficou atrás de outra pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa concisa. A vírgula em “à entrada” explicita o ponto alcançado por Ló e preserva lexicalmente a distinção entre a entrada e a porta.
