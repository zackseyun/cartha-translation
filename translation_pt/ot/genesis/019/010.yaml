  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: pt
  text: Mas os homens estenderam as mãos, trouxeram Ló para dentro da casa, para junto deles, e fecharam a porta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: estenderam as mãos
  rationale: A expressão hebraica descreve o ato físico de estender a mão; esta formulação é natural em português e preserva o plural do texto.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo hebraico significa literalmente “os homens”. Embora o contexto os identifique como mensageiros angelicais, a tradução mantém a designação usada neste versículo.
- source_word: וַיָּבִיאוּ אֶת לוֹט
  choice: trouxeram Ló
  rationale: O hifil de בוא significa fazer vir ou trazer. “Trouxeram” traduz diretamente a ação sem acrescentar a ideia interpretativa de que o puxaram.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: para dentro da casa, para junto deles
  rationale: A formulação preserva tanto o movimento para o interior da casa, marcado pelo he direcional, como אֲלֵיהֶם, “para junto deles”.
- source_word: הַדֶּלֶת
  choice: a porta
  rationale: דֶּלֶת é o termo comum para “porta”; não há necessidade de explicitação adicional.
- source_word: סָגָרוּ
  choice: fecharam
  rationale: “Fecharam” é a equivalência direta e idiomática do verbo em português, adequada à rápida sequência narrativa.
- source_word: וַ
  choice: Mas
  rationale: O waw faz avançar a narrativa e, no contexto, introduz uma ação que se contrapõe ao avanço da multidão no versículo anterior.
theological_decisions:
- issue: Identificar explicitamente הָאֲנָשִׁים como anjos
  choice: Manter “os homens” no texto principal
  alternative: “os anjos” ou “os visitantes”
  rationale: O contexto narrativo deixa clara a identidade angelical dessas figuras, mas este versículo as chama de “os homens”. A tradução preserva a forma lexical do hebraico sem inserir a interpretação no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de verbos coordenados conserva o ritmo rápido da narrativa. “Para dentro da casa, para junto deles” evita o possível sentido de que Ló teria sido trazido de fora para a casa, pois ele estava à entrada, e preserva os dois elementos do hebraico.
