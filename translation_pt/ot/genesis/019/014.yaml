base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: pt
  text: 'Então Ló saiu e falou com seus genros[a], os que iam se casar com as filhas dele, e lhes disse: “Levantem-se! Saiam deste lugar, porque Yahweh está prestes a destruir a cidade!” Mas, aos olhos de seus genros, ele parecia estar brincando.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus genros, que haviam se casado com as filhas dele”. A expressão hebraica pode indicar tanto homens que já eram casados com as filhas de Ló quanto aqueles que estavam para se casar com elas.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲתָנָיו
  choice: seus genros
  rationale: חָתָן pode designar genro ou noivo. “Genros” é a forma portuguesa mais natural neste contexto, enquanto a expressão seguinte esclarece que eram os homens ligados às filhas de Ló por casamento previsto ou já realizado.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: os que iam se casar com suas filhas
  rationale: O particípio לֹקְחֵי, literalmente “os que tomavam”, é usado aqui no sentido matrimonial. A formulação escolhida se ajusta ao contexto imediato, no qual as filhas ainda estão na casa de Ló, sem ocultar em nota a possibilidade de o hebraico indicar casamento já realizado.
- source_word: קוּמוּ צְּאוּ
  choice: Levantem-se! Saiam
  rationale: Os dois imperativos são urgentes e abruptos. Frases separadas preservam essa força em português natural.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Com “saiam”, esta é a forma idiomática de preservar a referência dêitica e a urgência do hebraico.
- source_word: מַשְׁחִית
  choice: está prestes a destruir
  rationale: O particípio causativo descreve uma ação iminente; a destruição ainda não começou no momento da advertência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כִמְצַחֵק בְּעֵינֵי חֲתָנָיו
  choice: aos olhos de seus genros, ele parecia estar brincando
  rationale: Preserva tanto a imagem hebraica “aos olhos de” quanto o sentido de que os genros julgaram que Ló não falava sério, sem intensificar o verbo para “zombar”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva sua função como nome próprio sem o substituir por um título.
- issue: Situação matrimonial dos homens ligados às filhas de Ló
  choice: homens que iam se casar com elas
  alternative: homens que já haviam se casado com elas
  rationale: O contexto favorece noivos ou futuros maridos, mas a construção hebraica também admite homens já casados; essa ambiguidade é preservada por meio da nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os imperativos curtos comunicam a urgência da fala de Ló; a expressão “aos olhos de” foi mantida por ser compreensível e refletir de perto o idioma hebraico.
