  yaml_path: translation/ot/genesis/019/036.yaml
  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: pt
  text: Assim, as duas filhas de Ló ficaram grávidas de seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conceberam». Literalmente, «de seu pai».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: ficaram grávidas
  rationale: O verbo הרה, no wayyiqtol da terceira pessoa feminina plural, indica que ambas passaram a estar grávidas. A expressão é clara, natural e atual em português; «conceberam» é uma alternativa mais formal.
- source_word: שְׁתֵּי
  choice: as duas
  rationale: O numeral especifica que ambas as filhas estão em vista. «As duas» reproduz diretamente a forma hebraica e soa natural em português.
- source_word: בְנוֹת לוֹט
  choice: filhas de Ló
  rationale: Esta é a tradução natural e direta da cadeia construta hebraica.
- source_word: מֵאֲבִיהֶן
  choice: do próprio pai
  rationale: A preposição מִן marca aqui a origem ou paternidade da gravidez. «Do próprio pai» é idiomático em português e torna inequívoca a relação incestuosa expressa pelo contexto, sem acrescentar uma identificação ausente do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Assim» preserva a progressão narrativa de וַ־; «ficaram grávidas» evita formalidade desnecessária, enquanto a nota registra tanto a alternativa lexical quanto a formulação mais literal.
