base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: pt
  text: 'Quando os levaram para fora, ele disse: “Fuja para salvar a sua vida! Não olhe para trás[a] nem pare em parte alguma da planície. Fuja para os montes[b], para não ser arrastado junto[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não olhe para o que ficou atrás de você.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para a montanha” ou “para a região montanhosa”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para não ser destruído” ou “para não perecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: para fora
  rationale: O advérbio direcional indica movimento para fora da cidade ou do espaço em que estavam; “para fora” é natural e exato em português.
- source_word: הִמָּלֵט
  choice: Fuja
  rationale: O imperativo nifal comunica fuga urgente para escapar do perigo. “Fuja” preserva a força da ordem e funciona naturalmente nas duas ocorrências.
- source_word: עַל נַפְשֶׁךָ
  choice: para salvar a sua vida
  rationale: A expressão idiomática refere-se à preservação da própria vida. Esta formulação transmite o sentido com clareza sem reduzir נֶפֶשׁ a uma noção exclusivamente espiritual.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Não olhe para trás
  rationale: É a expressão portuguesa corrente para a proibição de olhar na direção do que ficou para trás, preservando o sentido espacial do hebraico.
- source_word: וְאַל תַּעֲמֹד
  choice: nem pare
  rationale: Neste contexto de fuga, עמד significa deter-se ou permanecer, e não apenas ficar fisicamente em pé.
- source_word: בְּכָל הַכִּכָּר
  choice: em parte alguma da planície
  rationale: 'A construção tem força distributiva negativa: não se deter em nenhum lugar da região plana. “Planície” expressa o contraste topográfico com os montes.'
- source_word: הָהָרָה
  choice: para os montes
  rationale: A forma direcional de הַר pode designar um monte, a montanha ou a região montanhosa. O plural português comunica naturalmente a fuga para as terras altas, enquanto a nota preserva as alternativas.
- source_word: פֶּן תִּסָּפֶה
  choice: para não ser arrastado junto
  rationale: O nifal de ספה pode significar perecer ou ser eliminado juntamente com outros. “Arrastado junto” preserva a ideia de ser alcançado pela catástrofe coletiva, sem excluir o sentido de destruição.
theological_decisions:
- issue: Identificação de quem fala
  choice: “ele disse”
  alternative: “eles disseram” ou “o anjo disse”
  rationale: O verbo hebraico está no singular, mas o referente não é explicitamente identificado neste versículo. A tradução conserva o singular sem resolver além do texto se fala um dos mensageiros ou o grupo por meio de um representante.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outras comunidades lusófonas. Os imperativos mantêm a urgência e a repetição do hebraico. Todos os marcadores de nota estão posicionados junto às expressões correspondentes.
