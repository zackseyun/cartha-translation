  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: pt
  text: O sol já havia nascido sobre a terra, e Ló havia chegado a Zoar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: o sol
  rationale: Substantivo definido com artigo; esta é a forma natural e exata em português.
- source_word: יָצָא
  choice: já havia nascido
  rationale: Embora יצא signifique literalmente “sair”, com o sol descreve idiomaticamente o nascer do sol. O mais-que-perfeito composto explicita com naturalidade que isso já ocorrera antes dos acontecimentos seguintes.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: עַל indica “sobre”, e אֶרֶץ pode designar tanto a terra local quanto a terra em sentido mais amplo. “A terra” preserva essa amplitude lexical sem exigir uma interpretação global.
- source_word: וְלוֹט
  choice: e Ló
  rationale: Reproduz a conjunção simples e usa a forma tradicional portuguesa do nome próprio.
- source_word: בָּא
  choice: havia chegado
  rationale: O Qal perfeito de בוא expressa vir, entrar ou chegar. “Chegado” é natural no contexto de alcançar o destino, e o mais-que-perfeito apresenta a chegada como concluída naquele momento.
- source_word: צֹעֲרָה
  choice: a Zoar
  rationale: O nome próprio traz o ה direcional, que indica movimento em direção ao lugar; em português, isso se expressa naturalmente por “a Zoar”.
