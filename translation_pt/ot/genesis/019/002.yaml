  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: pt
  text: 'E ele disse: “Por favor, meus senhores[a], venham para a casa deste seu servo, passem a noite e lavem os pés. Depois, poderão levantar-se cedo e seguir viagem.” Mas eles disseram: “Não, mas passaremos a noite na praça[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu senhor”, caso אֲדֹנַי seja entendido como uma forma honorífica singular; neste contexto, o plural combina melhor com Ló dirigindo-se aos dois visitantes.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico indica uma área pública aberta da cidade, como uma praça ou um largo.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Por favor
  rationale: A expressão funciona aqui como um apelo cortês para chamar a atenção; “por favor” transmite com naturalidade a urgência respeitosa.
- source_word: אֲדֹנַי
  choice: meus senhores
  rationale: O contexto imediato apresenta Ló dirigindo-se aos dois visitantes, e os verbos e pronomes no plural favorecem uma forma de tratamento humana e plural.
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: venham para a casa deste seu servo
  rationale: “Venham para” expressa naturalmente o convite para deixarem o caminho e se dirigirem à casa; “deste seu servo” preserva a fórmula de humildade usada por Ló.
- source_word: וְלִינוּ
  choice: passem a noite
  rationale: Expressa de modo claro e atual a ideia de alojar-se durante a noite.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: lavem os pés
  rationale: A tradução direta preserva a prática de hospitalidade do contexto antigo.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: Depois, poderão levantar-se cedo e seguir viagem
  rationale: A formulação apresenta a sequência pretendida do convite sem transformar indevidamente a fala cortês em uma ordem rígida; “seguir viagem” é o equivalente idiomático de prosseguir pelo próprio caminho.
- source_word: בָרְחוֹב
  choice: na praça
  rationale: O substantivo designa um espaço público aberto da cidade, mais próximo de uma praça ou largo do que de uma simples via.
- source_word: נָלִין
  choice: passaremos a noite
  rationale: Mantém a correspondência lexical com וְלִינוּ e comunica a decisão dos visitantes com clareza.
theological_decisions:
- issue: Se אֲדֹנַי deve ser entendido como título divino, tratamento humano singular ou tratamento humano plural
  choice: 'tratamento humano plural: “meus senhores”'
  alternative: “meu senhor”, como forma honorífica singular
  rationale: Ló fala com os dois visitantes, e as formas verbais e pronominais plurais ao longo do versículo apoiam o plural. A nota preserva a possibilidade formal da leitura singular sem introduzir no texto principal uma identificação divina que o contexto imediato não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala de Ló conserva o tom cortês e deferente sem reproduzir de maneira artificial as partículas hebraicas, e a resposta dos visitantes permanece direta.
