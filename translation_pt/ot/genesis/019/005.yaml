base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: pt
  text: 'Então chamaram Ló e lhe disseram: “Onde estão os homens que vieram até você esta noite? Traga-os para fora, até nós, para que os conheçamos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito neste contexto: “para termos relações sexuais com eles”. O hebraico diz “para que os conheçamos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: chamaram
  rationale: קרא, neste contexto narrativo, indica chamar alguém. “Chamaram” preserva a sequência simples sem acrescentar a intensidade de “gritaram”.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: Onde estão os homens
  rationale: אַיֵּה pergunta pela localização, e אֲנָשִׁים se refere especificamente aos visitantes do sexo masculino.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: que vieram até você esta noite
  rationale: A formulação é natural em português moderno e mantém tanto o movimento em direção a Ló quanto a referência temporal.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Traga-os para fora, até nós
  rationale: O hifil de יצא expressa fazer sair. “Traga-os para fora” comunica adequadamente a ordem, enquanto “até nós” preserva אֵלֵינוּ.
- source_word: וְנֵדְעָה אֹתָם
  choice: para que os conheçamos
  rationale: ידע significa literalmente “conhecer”. A tradução mantém a formulação hebraica e sua tensão literária, enquanto a nota esclarece o provável sentido sexual no contexto.
theological_decisions:
- issue: Se a intenção sexual de וְנֵדְעָה אֹתָם deve ser explicitada no texto principal
  choice: Manter “para que os conheçamos” no texto principal e explicar o sentido sexual em nota.
  alternative: Traduzir explicitamente como “para termos relações sexuais com eles” ou “para abusarmos sexualmente deles”.
  rationale: O contexto indica fortemente uma intenção sexual hostil, mas o hebraico usa o verbo comum “conhecer”. Preservar essa forma evita resolver no texto principal aquilo que o original expressa de maneira indireta, sem ocultar do leitor o sentido contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” comunica naturalmente o singular hebraico dirigido a Ló. A colocação do pronome em “Traga-os” conserva um registro escrito corrente sem soar arcaico.
