  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: pt
  text: Vamos fazer nosso pai beber vinho e vamos nos deitar com ele, para preservarmos descendência[a] de nosso pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: Vamos
  rationale: A forma funciona aqui como uma exortação idiomática para iniciar uma ação. “Vamos” transmite com naturalidade essa força em português e se integra aos cohortativos seguintes.
- source_word: נַשְׁקֶה
  choice: fazer nosso pai beber
  rationale: 'O hifil de שׁקה é causativo: elas propõem dar vinho ao pai ou fazê-lo beber, não beber com ele. A formulação preserva esse sentido sem acrescentar explicitamente a ideia de embriaguez.'
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente comum e direto do substantivo hebraico.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: e nos deitar com ele
  rationale: שׁכב com עִם constitui aqui um eufemismo sexual. “Deitar-se com” preserva o caráter e a gravidade da expressão hebraica sem explicitação desnecessária.
- source_word: וּנְחַיֶּה
  choice: para preservarmos
  rationale: O piel cohortativo de חיה expressa manter vivo ou preservar. Com זרע como objeto, refere-se à continuidade da descendência.
- source_word: מֵאָבִינוּ
  choice: por meio de nosso pai
  rationale: A preposição מן indica aqui a origem da descendência. “Por meio de nosso pai” comunica essa relação de procedência de maneira natural em português.
- source_word: זָרַע
  choice: descendência
  rationale: Embora o sentido básico seja “semente”, neste contexto o termo designa prole ou continuidade familiar. “Descendência” expressa claramente esse uso figurado.
