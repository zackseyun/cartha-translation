base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: pt
  text: Naquela noite, elas deram vinho ao pai para beber. Então a primogênita entrou e se deitou com o pai. Ele não soube quando ela se deitou nem quando se levantou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em seu deitar-se e em seu levantar-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: elas deram vinho ao pai para beber
  rationale: O hifil de שׁקה expressa fazer alguém beber ou dar-lhe de beber. A formulação escolhida preserva o sentido causativo de modo natural em português.
- source_word: יַיִן
  choice: vinho
  rationale: É o equivalente português comum e direto, sem razão contextual para variação.
- source_word: בַּלַּיְלָה הוּא
  choice: naquela noite
  rationale: Expressão temporal idiomática que mantém a referência definida do hebraico.
- source_word: הַבְּכִירָה
  choice: a primogênita
  rationale: Preserva a ênfase do hebraico na ordem de nascimento e o gênero feminino indicado pela forma.
- source_word: וַתָּבֹא
  choice: entrou
  rationale: No contexto, indica que ela entrou até onde estava o pai; a opção é clara e natural em português.
- source_word: וַתִּשְׁכַּב אֶת
  choice: se deitou com
  rationale: A construção funciona como eufemismo sexual. Esta tradução conserva o registro narrativo e evita a expressão mais coloquial 'dormiu com'.
- source_word: וְלֹא יָדַע
  choice: Ele não percebeu
  rationale: ידע aqui indica consciência do que ocorria. 'Não percebeu' comunica essa falta de consciência com naturalidade, sem sugerir mero desconhecimento intelectual.
- source_word: בְּשִׁכְבָהּ
  choice: quando ela se deitou
  rationale: O infinitivo construto com ב marca a circunstância temporal. A tradução não acrescenta 'com ele', ausente desta frase específica.
- source_word: וּבְקוּמָהּ
  choice: nem quando se levantou
  rationale: Mantém o paralelismo temporal com a frase anterior e emprega uma formulação corrente em português.
