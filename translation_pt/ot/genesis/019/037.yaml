  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: pt
  text: A primogênita deu à luz um filho e lhe deu o nome de Moabe. Ele é o pai de Moabe[a] até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o antepassado dos moabitas até o dia de hoje”. O hebraico diz literalmente “o pai de Moabe”, usando o nome do antepassado para se referir ao povo que descendeu dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O Qal de ילד neste contexto significa dar à luz; a expressão é natural e clara em português.
- source_word: הַבְּכִירָה
  choice: A primogênita
  rationale: O feminino singular substantivado designa a filha mais velha de Ló e preserva a caracterização formal do hebraico.
- source_word: בֵּן
  choice: um filho
  rationale: É o objeto direto do verbo de nascimento; o artigo indefinido corresponde ao uso natural do português.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Expressa com naturalidade em português o idioma hebraico literalmente equivalente a 'chamou o nome dele'.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Adota a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: הוּא
  choice: Ele
  rationale: O pronome independente retoma o filho recém-nomeado.
- source_word: אֲבִי מוֹאָב
  choice: o pai de Moabe
  rationale: Mantém de perto a formulação hebraica e sua possível referência ao ancestral do povo moabita, esclarecida em nota.
- source_word: עַד הַיּוֹם
  choice: até o dia de hoje
  rationale: Equivalente português natural da fórmula hebraica que indica continuidade até o tempo do narrador.
