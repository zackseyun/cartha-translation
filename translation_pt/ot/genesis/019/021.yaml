base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: pt
  text: 'E ele lhe disse: “Pois bem, também lhe fiz essa concessão: não destruirei a cidade de que você falou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Pois bem
  rationale: Introduz a resposta com força discursiva e chama a atenção para a concessão, de modo natural e digno em português moderno.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: atenderei
  rationale: A expressão idiomática, literalmente ‘levantei o seu rosto’, indica acolher favoravelmente alguém e conceder sua súplica. No contexto, ‘atenderei’ comunica com clareza a concessão do pedido sem reproduzir literalmente um idioma obscuro em português.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: também ... a este pedido
  rationale: דָּבָר refere-se aqui à questão específica apresentada por Ló; ‘pedido’ explicita naturalmente o referente, enquanto ‘também’ preserva a força aditiva de גַּם.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: não destruirei
  rationale: 'A construção expressa o resultado da concessão: o mensageiro se absterá de subverter a cidade. Embora הפך tenha o sentido concreto de virar ou subverter, ‘destruir’ expressa em português corrente o efeito catastrófico pretendido no contexto.'
- source_word: הָעִיר
  choice: a cidade
  rationale: Tradução direta do substantivo definido singular.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: de que você falou
  rationale: Preserva a referência à cidade mencionada por Ló em formulação clara, natural e fiel ao hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por ‘você’ evita arcaísmo, e a formulação mantém tom narrativo digno. O idioma hebraico é traduzido pelo sentido no texto principal, sem nota necessária.
