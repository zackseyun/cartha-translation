  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: pt
  text: Pois estamos prestes a destruir este lugar, porque o clamor deles[a] se tornou grande diante de Yahweh, e Yahweh nos enviou para destruí-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque o clamor contra eles se tornou grande diante de Yahweh”. A forma hebraica pode ser traduzida literalmente como “o clamor deles”, mas, neste contexto, muitos a entendem como o clamor levantado contra os habitantes deste lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: estamos prestes a destruir
  rationale: O particípio hifil plural pode indicar ação iminente; no anúncio do juízo, esta formulação comunica com naturalidade que a destruição está para acontecer.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Tradução direta e natural, preservando a força dêitica do hebraico.
- source_word: גָדְלָה
  choice: se tornou grande
  rationale: O perfeito qal indica um aumento já consumado, com resultado presente.
- source_word: צַעֲקָתָם
  choice: o clamor deles
  rationale: Preserva o sufixo masculino plural do hebraico e a ambiguidade sobre se o clamor procede deles ou foi levantado contra eles.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressão idiomática em português que comunica presença e comparecimento perante Deus sem literalismo rígido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: nos enviou
  rationale: Representa naturalmente em português o envio já realizado que fundamenta a missão presente.
- source_word: לְשַׁחֲתָהּ
  choice: para destruí-lo
  rationale: Mantém a repetição da raiz de 'destruir'; o pronome retoma 'este lugar' segundo o gênero gramatical em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de צַעֲקָתָם
  choice: o clamor deles
  alternative: o clamor contra eles
  rationale: A leitura principal reproduz formalmente o sufixo hebraico, enquanto a nota conserva a alternativa contextual relevante sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o paralelismo e a repetição de “destruir” presentes no hebraico. O marcador [a] foi colocado após a oração à qual a leitura alternativa se refere.
