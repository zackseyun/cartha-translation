  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: pt
  text: Mas ele insistiu muito com eles[a]. Então se voltaram para ele e entraram em sua casa. Ele lhes preparou um banquete, assou pães sem fermento[b], e eles comeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pressionou-os muito” ou “insistiu firmemente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pães sem fermento” ou “bolos sem fermento”; tradicionalmente, pães preparados sem fermento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: insistiu muito com eles
  rationale: Expressa a forte insistência de Ló de modo natural em português e preserva a intensidade de מְאֹד.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: se dirigiram à casa dele
  rationale: No contexto, o ato de 'desviar-se/virar-se para ele' indica que aceitaram o convite e foram para onde ele os conduzia; a formulação portuguesa mantém o movimento sem soar artificial.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: e entraram
  rationale: Com 'à casa dele' na oração anterior, 'entraram' comunica de forma concisa e idiomática a chegada ao interior da casa, sem repetição pesada.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: O termo designa uma refeição festiva, muitas vezes associada a bebida; 'banquete' mantém o sentido amplo sem introduzir álcool explicitamente.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: Pluraliza naturalmente o substantivo hebraico e explica com clareza o tipo de pão, sem recorrer a transliteração especializada.
- source_word: אָפָה
  choice: assou
  rationale: Equivalente direto e corrente do verbo hebraico para preparar pão pelo calor.
- source_word: וַיֹּאכֵלוּ
  choice: e eles comeram
  rationale: Preserva a conclusão simples e coordenada da sequência narrativa hebraica.
