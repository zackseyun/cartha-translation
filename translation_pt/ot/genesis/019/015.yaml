base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: pt
  text: 'Quando a aurora começava a despontar, os anjos apressaram Ló, dizendo: “Levante-se! Leve sua mulher e suas duas filhas que estão aqui, para que você não seja arrastado junto no castigo da cidade[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na iniquidade da cidade” ou “por causa da culpa da cidade”. A palavra hebraica pode se referir à iniquidade, à culpa ou ao castigo resultante da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Quando a aurora começava a despontar
  rationale: Expressa naturalmente a construção temporal e a imagem do amanhecer em progresso, sem reproduzir de modo rígido o verbo hebraico “subir”.
- source_word: וַיָּאִיצוּ הַמַּלְאָכִים בְּלוֹט
  choice: os anjos apressaram Ló
  rationale: O verbo indica pressão para que alguém aja sem demora. “Apressaram Ló” conserva a urgência e é claro em português; “anjos” identifica adequadamente os mensageiros celestiais neste contexto.
- source_word: קוּם קַח
  choice: Levante-se! Leve
  rationale: Mantém os dois imperativos e sua força urgente. “Leve” comunica aqui que Ló deve sair acompanhado da família, com maior naturalidade que “pegue” em português.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: sua mulher e suas duas filhas que estão aqui
  rationale: Preserva o número definido e verte o particípio “encontradas/presentes” de modo idiomático, distinguindo as filhas presentes naquele momento.
- source_word: פֶּן תִּסָּפֶה
  choice: para que você não seja arrastado junto
  rationale: A forma passiva pode indicar perecer juntamente com outros ou ser incluído na ruína coletiva. “Arrastado junto” preserva essa dimensão contextual.
- source_word: בַּעֲוֺן הָעִיר
  choice: no castigo da cidade
  rationale: Neste contexto de juízo iminente, עָוֹן pode designar a consequência punitiva da culpa. A escolha comunica o perigo imediato, enquanto a amplitude lexical é preservada em nota.
theological_decisions:
- issue: Sentido de עָוֹן em contexto de juízo
  choice: castigo da cidade
  alternative: iniquidade da cidade; culpa da cidade
  rationale: O termo hebraico pode designar a iniquidade, a culpa decorrente dela ou o castigo suportado por causa dessa culpa. O contexto imediato favorece a consequência punitiva, mas a nota conserva as outras leituras legítimas sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fala direta conserva a urgência por meio de imperativos breves. O marcador da nota foi colocado junto à expressão cuja ambiguidade explica.
