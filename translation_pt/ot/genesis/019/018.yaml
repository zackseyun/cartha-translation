  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: pt
  text: 'Mas Ló lhes disse: “Não, por favor, meus senhores[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, no final: “meu senhor”. A forma hebraica אֲדֹנָי pode ser entendida como tratamento respeitoso singular em algumas leituras; algumas tradições a vertem “meu Senhor”. Contudo, o contexto plural (“lhes”) favorece aqui “meus senhores”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo faz a narrativa avançar, enquanto o contexto mostra que Ló responde com uma objeção à instrução anterior; por isso, “Mas” expressa naturalmente a relação discursiva.
- source_word: לוֹט
  choice: Ló
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: A preposição אֶל com sufixo de terceira pessoa masculina plural significa “a eles”. O pronome átono “lhes” preserva o referente plural sem explicitação indevida.
- source_word: אַל
  choice: Não
  rationale: Embora seja uma partícula negativa normalmente ligada a proibição ou pedido negativo, nesta súplica sem verbo ela rejeita enfaticamente a proposta anterior; “Não” é a equivalência portuguesa mais natural.
- source_word: נָא
  choice: por favor
  rationale: A partícula marca súplica ou cortesia; “por favor” transmite sua força em linguagem moderna.
- source_word: אֲדֹנָי
  choice: meus senhores
  rationale: O contexto imediato, inclusive “lhes”, favorece uma interpelação plural dirigida aos dois visitantes. “Meus senhores” preserva tanto o número quanto o sentido lexical respeitoso.
theological_decisions:
- issue: Se אֲדֹנָי deve ser entendido como título divino singular (“meu Senhor”) ou como tratamento plural dirigido aos visitantes (“meus senhores”).
  choice: 'Tratamento plural: “meus senhores”.'
  alternative: “meu Senhor”.
  rationale: O antecedente plural em אֲלֵהֶם (“a eles”) e a presença dos dois visitantes favorecem a leitura plural. Como a forma hebraica também pode ser entendida, em outra leitura, como tratamento singular respeitoso ou divino, essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada naturalmente para o português, sem apagar a ambiguidade do tratamento final.
source_grounding:
  english_pob_role: consult_only
