base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: pt
  text: 'Então a primogênita disse à mais nova: “Nosso pai está velho, e não há homem na terra que venha se unir a nós[a], como é costume em toda a terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui uma expressão eufemística, literalmente “vir sobre nós”, isto é, ter relações sexuais conosco.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo o caminho de toda a terra”; a expressão se refere ao costume ou padrão humano comum, neste contexto especialmente à união sexual e à continuidade da família.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: a primogênita
  rationale: Preserva a ênfase hebraica na ordem de nascimento e forma um contraste claro com “a mais nova”.
- source_word: הַצְּעִירָה
  choice: a mais nova
  rationale: Expressa naturalmente o adjetivo comparativo hebraico e identifica a irmã mais jovem sem acrescentar “filha” ao texto.
- source_word: אָבִינוּ זָקֵן
  choice: Nosso pai está velho
  rationale: Reproduz de modo direto e natural a oração nominal hebraica, sem intensificar o sentido para “envelheceu” ou “é velho demais”.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: e não há homem nesta terra
  rationale: Mantém a referência masculina de אִישׁ, importante no contexto de união sexual e descendência. “Nesta terra” comunica naturalmente o âmbito percebido pelas personagens sem decidir se elas se referem à região ou ao mundo inteiro.
- source_word: לָבוֹא עָלֵינוּ
  choice: que venha se unir a nós
  rationale: Comunica em português corrente o eufemismo sexual do hebraico sem recorrer a linguagem crua. A nota registra a formulação mais literal e preserva o caráter eufemístico da expressão.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: como é costume em toda a terra
  rationale: Expressa de maneira compreensível o idiomatismo “segundo o caminho de toda a terra”, referente ao padrão humano comum, sem explicitar além do necessário a união sexual e a continuidade familiar.
