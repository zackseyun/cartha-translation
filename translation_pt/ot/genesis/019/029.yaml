base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: pt
  text: Quando Deus destruiu as cidades da planície, lembrou-se de Abraão[a] e mandou Ló sair do meio da destruição[b], ao destruir as cidades onde Ló tinha morado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «Deus lembrou-se de Abraão» não sugere que Deus o tivesse esquecido; é um modo hebraico de dizer que Deus agiu com fiel consideração por ele.
    reason: cultural_note
  - marker: b
    text: Também pode ser traduzido por «do meio da catástrofe». O substantivo hebraico transmite a ideia de reviramento e está ligado ao verbo traduzido por «destruir» logo depois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: Assim, quando Deus destruiu
  rationale: A construção narrativa introduz a circunstância temporal. «Assim, quando» transmite com naturalidade tanto a progressão do relato quanto o valor temporal do infinitivo.
- source_word: עָרֵי הַכִּכָּר
  choice: as cidades da planície
  rationale: כִּכָּר designa aqui a planície ou distrito do Jordão; «planície» é claro e consagrado no contexto de Gênesis.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Deus lembrou-se de Abraão
  rationale: Preserva o idioma hebraico e sua ressonância relacional, sem substituir o texto por uma explicação interpretativa.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: tirou Ló
  rationale: Neste contexto de movimento para fora e livramento, «tirou» expressa de modo idiomático em português o resultado de שׁלח, sem inserir explicitamente o verbo teológico «salvar».
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: do meio da destruição
  rationale: «Do meio» representa תּוֹךְ; «destruição» comunica naturalmente a catástrofe indicada por הֲפֵכָה. Uma nota registra a imagem lexical de reviramento e sua ligação com o verbo seguinte.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: ao destruir as cidades
  rationale: O infinitivo com בְּ marca circunstância temporal. «Ao destruir» mantém a relação simultânea e evita uma repetição pesada de «quando».
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: onde Ló tinha morado
  rationale: A relativa descreve a residência anterior de Ló; o mais-que-perfeito composto torna clara a sequência narrativa em português corrente.
theological_decisions:
- issue: Sentido de «Deus lembrou-se de Abraão»
  choice: Manter no texto o idioma «lembrou-se de Abraão».
  alternative: «Deus agiu em consideração a Abraão» ou «Deus teve Abraão em mente».
  rationale: Na narrativa hebraica, o lembrar divino frequentemente indica consideração fiel que se manifesta em ação, e não esquecimento anterior. Preservar a expressão evita resolver no corpo do texto toda a sua densidade teológica.
- issue: Relação entre Abraão e o livramento de Ló
  choice: Conservar a sequência textual, na qual a lembrança de Abraão precede a retirada de Ló.
  alternative: Explicitar «por causa de Abraão, Deus salvou Ló».
  rationale: A conexão é fortemente sugerida pela sintaxe, mas o hebraico não usa aqui uma fórmula causal explícita nem o verbo «salvar»; a tradução não deve ampliar a formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase foi simplificada em relação à moldura hebraica literal, sem perder sua progressão narrativa. Evitaram-se «sucedeu que», «habitou» e «subversão» por soarem arcaicos ou pouco naturais.
