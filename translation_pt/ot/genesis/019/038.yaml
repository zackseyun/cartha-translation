  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: pt
  text: A mais nova também deu à luz um filho e lhe deu o nome de Ben-Ami[a]. Ele é o pai dos filhos de Amom[b] até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Ami provavelmente significa «filho do meu povo» ou «filho do meu parente».
    reason: lexical_alternative
  - marker: b
    text: Ou «amonitas»; literalmente, «filhos de Amom».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: A mais nova
  rationale: O adjetivo definido é usado substantivamente e retoma, pelo contexto, a filha mais nova de Ló. A formulação é natural em português e mantém a comparação etária.
- source_word: גַם הִוא
  choice: também
  rationale: Expressa que a filha mais nova, assim como a mais velha, deu à luz; em português, «também» comunica essa correspondência com naturalidade.
- source_word: יָלְדָה בֵּן
  choice: deu à luz um filho
  rationale: É a expressão narrativa corrente e precisa em português para o hebraico ילד + בן.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Traduz de modo idiomático a fórmula hebraica «chamou o nome dele», preservando claramente o ato de nomear.
- source_word: בֶּן עַמִּי
  choice: Ben-Ami
  rationale: O nome próprio é transliterado; seu sentido relevante para a narrativa é apresentado em nota.
- source_word: הוּא אֲבִי
  choice: Ele é o pai
  rationale: Reproduz diretamente a oração nominal hebraica. No contexto genealógico, «pai» inclui a ideia de progenitor ou ancestral.
- source_word: בְנֵי עַמּוֹן
  choice: filhos de Amom
  rationale: Mantém a imagem genealógica literal do hebraico; a designação corrente «amonitas» é indicada em nota.
- source_word: עַד הַיּוֹם
  choice: até hoje
  rationale: É o equivalente idiomático consagrado da expressão temporal hebraica, referindo-se ao tempo do narrador.
