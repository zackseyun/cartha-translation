  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: pt
  text: Então Yahweh fez chover enxofre e fogo sobre Sodoma e Gomorra, da parte de Yahweh, dos céus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções tradicionais usam para גָּפְרִית um termo equivalente a «brimstone». O hebraico designa mais precisamente enxofre.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «da parte de Yahweh, dos céus». A repetição do nome divino foi mantida conforme o texto-fonte, em vez de ser simplificada.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua repetição explícita no hebraico.
- source_word: הִמְטִיר
  choice: fez chover
  rationale: Expressa naturalmente em português o valor causativo do hifil e mantém a imagem de chuva vinda do alto.
- source_word: גָּפְרִית
  choice: enxofre
  rationale: Equivalente moderno e preciso; evita o termo tradicional menos transparente «brimstone» presente em algumas línguas.
- source_word: אֵשׁ
  choice: fogo
  rationale: Equivalente direto, coordenado com «enxofre» como aquilo que foi feito chover.
- source_word: עַל
  choice: sobre
  rationale: Indica de modo natural o alvo do juízo.
- source_word: סְדֹם וְעֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: Formas portuguesas consagradas dos topônimos.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Marca a fonte ou origem e conserva o segundo nome divino sem sugerir necessariamente deslocamento espacial.
- source_word: מִן הַשָּׁמַיִם
  choice: desde os céus
  rationale: Preserva o plural hebraico e a ideia de procedência do alto, embora a expressão seja mais formal que «do céu».
- source_word: וַ
  choice: Então
  rationale: Comunica a progressão sequencial da narrativa em português corrente.
theological_decisions:
- issue: Repetição do nome divino em «Yahweh ... da parte de Yahweh»
  choice: Manter os dois usos de Yahweh no texto principal.
  alternative: «Então Yahweh fez chover ... desde os céus» ou «Yahweh fez chover ... da parte de si mesmo»
  rationale: O texto hebraico repete explicitamente o nome divino. A tradução mantém essa formulação incomum e não decide se ela tem implicações particulares quanto à agência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Fez chover» é idiomático; «desde os céus» e a repetição de Yahweh conservam traços formais e a tensão do original.
