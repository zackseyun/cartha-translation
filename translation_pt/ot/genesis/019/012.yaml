  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: pt
  text: 'Então os homens disseram a Ló: “Quem mais você tem aqui? Algum genro, seus filhos, suas filhas e todos os que lhe pertencem na cidade[b] — tire-os deste lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebraico: “tudo o que lhe pertence na cidade”. No contexto, a expressão provavelmente se refere às pessoas da família ou da casa de Ló que estavam na cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo hebraico significa normalmente “homens”. Embora o contexto os identifique como seres angelicais, o versículo mantém a designação humana comum.
- source_word: עֹד מִי לְךָ פֹה
  choice: Quem mais você tem aqui?
  rationale: Reproduz de modo natural a pergunta sobre outras pessoas ligadas a Ló que ainda estivessem naquele lugar.
- source_word: חָתָן
  choice: algum genro
  rationale: No contexto, o termo indica mais provavelmente um genro, atual ou pretendido. “Algum” torna natural em português o singular hebraico dentro da pergunta sem afirmar enfaticamente que havia apenas um.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: seus filhos, suas filhas
  rationale: Tradução direta dos plurais possessivos, preservando a ordem do hebraico.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: todos os seus na cidade
  rationale: Expressão portuguesa concisa para as pessoas ligadas à família ou à casa de Ló; o contexto trata da retirada de pessoas, embora a formulação hebraica seja mais ampla.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: tire-os deste lugar
  rationale: O imperativo masculino singular é dirigido a Ló. O pronome retoma as pessoas enumeradas; “deste lugar” expressa naturalmente a referência contextual do artigo hebraico.
theological_decisions:
- issue: Identificação de הָאֲנָשִׁים como homens ou anjos
  choice: os homens
  alternative: os anjos; os mensageiros
  rationale: A identidade angelical decorre do contexto narrativo, mas este versículo usa a palavra hebraica comum para “homens”; a tradução não antecipa essa interpretação no texto principal.
- issue: Sentido de חָתָן
  choice: genro
  alternative: noivo
  rationale: O campo semântico permite “noivo”, mas a relação familiar visada no contexto de Gênesis 19 favorece “genro”, sem decidir na tradução se o casamento já havia sido consumado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para evitar a alternância regional entre “tu” e “vós”; mantém “Ló”, forma tradicional e corrente do nome. O travessão comunica a passagem urgente da enumeração para a ordem.
