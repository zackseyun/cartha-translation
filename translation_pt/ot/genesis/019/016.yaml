base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: pt
  text: Mas ele se demorou; então os homens[a] agarraram a mão dele, a mão de sua mulher e as mãos de suas duas filhas, por causa da compaixão de Yahweh para com ele; e o fizeram sair e o puseram fora da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, esses homens são os visitantes angelicais; o hebraico deste versículo diz literalmente “os homens”.
    reason: Esclarece a identificação contextual sem substituir, no texto principal, a designação narrativa empregada pelo hebraico.
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: ele se demorou
  rationale: O verbo expressa demora ou tardança. “Se demorou” é natural em português e não reduz o sentido a uma hesitação apenas mental.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O versículo usa a designação narrativa comum “os homens”; a identificação contextual como mensageiros angelicais é mantida em nota, sem substituir a formulação hebraica no texto.
- source_word: וַיַּחֲזִקוּ
  choice: agarraram
  rationale: Nesta construção, o verbo indica segurar com firmeza. “Agarraram” comunica a urgência e a ação física do resgate.
- source_word: בְּיָדוֹ וּבְיַד אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: a mão dele, a mão de sua mulher e a mão de cada uma de suas duas filhas
  rationale: A repetição de “mão” é preservada, enquanto “de cada uma” explicita de modo idiomático o valor distributivo da referência às duas filhas.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: por causa da compaixão de Yahweh para com ele
  rationale: A formulação preserva o valor causal da preposição, o sentido de compaixão ou misericórdia de חֶמְלָה e a direção dessa compaixão para com Ló.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio, conforme o padrão do projeto.
- source_word: וַיֹּצִאֻהוּ
  choice: o tiraram dali
  rationale: O hifil de יצא indica fazer alguém sair. “Tiraram dali” é idiomático e mantém a ação enérgica de resgate; “dali” retoma a cidade no contexto imediato.
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: o deixaram fora da cidade
  rationale: O verbo pode indicar colocar ou deixar alguém em determinado lugar. A escolha é natural em português e expressa o resultado espacial sem sugerir necessariamente abandono.
theological_decisions:
- issue: Identificação narrativa dos resgatadores
  choice: os homens
  alternative: os anjos / os mensageiros
  rationale: Embora o contexto identifique essas figuras como mensageiros angelicais, o hebraico deste versículo as chama de “os homens”. O texto principal preserva essa designação e a nota esclarece o contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi dividida em três frases para conservar a urgência narrativa sem produzir um período excessivamente longo. A repetição de “mão” foi mantida em forma natural.
