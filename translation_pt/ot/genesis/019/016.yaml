    issue: “o tiraram dali”
    rationale: O hebraico diz que eles o fizeram sair, sem o advérbio “dali”. Embora o contexto seja claro, o acréscimo é desnecessário; “o fizeram sair” preserva mais diretamente o causativo.
  - severity: medium
    issue: “o deixaram fora da cidade”
    rationale: O hifil de נוח neste contexto significa pôr, colocar ou instalar em um lugar. “Deixaram” pode, em português, carregar a implicação indevida de abandono. “O puseram fora da cidade” é mais preciso.
  - severity: low
    issue: “a mão de cada uma de suas duas filhas”
    rationale: A formulação explicita corretamente que ambas as filhas foram tomadas pela mão, mas é mais pesada do que necessário. O plural “as mãos de suas duas filhas” é natural e conserva o sentido distributivo.
