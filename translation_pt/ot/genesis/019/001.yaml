  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: pt
  text: Os dois anjos chegaram a Sodoma ao entardecer, enquanto Ló estava sentado junto ao portão de Sodoma.[a] Quando Ló os viu, levantou-se para recebê-los e prostrou-se com o rosto em terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “portão de Sodoma” era a área da entrada da cidade, um espaço público associado a encontros e atividades cívicas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “inclinou-se profundamente, com o rosto em terra”. O hebraico descreve um gesto completo de prostração respeitosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: O verbo בוא, com Sodoma como destino, descreve a chegada dos visitantes; “chegaram” é natural e preciso em português narrativo.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: os dois anjos
  rationale: Embora מַלְאָךְ possa significar “mensageiro”, o contexto identifica esses visitantes como seres celestiais; “anjos” comunica adequadamente o referente.
- source_word: סְדֹמָה
  choice: a Sodoma
  rationale: O ה direcional indica movimento em direção à cidade; “chegaram a Sodoma” expressa o destino com naturalidade.
- source_word: בָּעֶרֶב
  choice: ao entardecer
  rationale: A expressão temporal situa a chegada no período da tarde para a noite; “ao entardecer” é atual e digna.
- source_word: יֹשֵׁב
  choice: estava sentado
  rationale: O particípio apresenta uma ação ou estado em andamento como pano de fundo da chegada.
- source_word: בְּשַׁעַר סְדֹם
  choice: junto ao portão de Sodoma
  rationale: A expressão designa a área do portão da cidade, não necessariamente o interior físico de uma porta. “Junto ao portão” é claro em português, acompanhado de nota cultural.
- source_word: וַיַּרְא לוֹט
  choice: Quando Ló os viu
  rationale: O objeto está implícito no hebraico e é explicitado em português; “quando” representa naturalmente a sequência narrativa.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: levantou-se para recebê-los
  rationale: A construção descreve Ló levantando-se e indo ao encontro dos visitantes. “Recebê-los” comunica nesse contexto o movimento acolhedor sem eliminar a ideia de encontro.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: prostrou-se com o rosto em terra
  rationale: A combinação idiomática descreve uma inclinação profunda até o chão. Esta formulação preserva a intensidade física do gesto em português natural.
theological_decisions:
- issue: Se וַיִּשְׁתַּחוּ deve ser entendido como adoração ou como prostração respeitosa
  choice: prostração respeitosa (“prostrou-se”)
  alternative: “adorou”
  rationale: O verbo pode indicar adoração ou reverência, conforme o contexto. Aqui, o gesto de Ló diante dos visitantes pode ser descrito fisicamente sem afirmar que ele lhes prestou culto; “prostrou-se” preserva essa abertura sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A narração mantém tom digno e claro; “Ló” segue a forma tradicional portuguesa, e as notas esclarecem o cenário urbano antigo e a força do gesto sem interpretá-lo necessariamente como culto.
