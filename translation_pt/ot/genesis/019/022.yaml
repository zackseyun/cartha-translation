  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: pt
  text: Depressa, fuja para lá, pois não posso fazer nada até que você chegue lá”. Por isso, a cidade recebeu o nome[b] de Zoar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zoar soa de modo semelhante à palavra hebraica para “pequeno” ou “insignificante”; veja Gênesis 19:20.
    reason: cross_reference
  - marker: b
    text: 'Mais literalmente: “chamou o nome da cidade de Zoar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Depressa
  rationale: O imperativo expressa urgência; “Depressa” é natural, conciso e mantém a força da ordem.
- source_word: הִמָּלֵט
  choice: fuja
  rationale: O imperativo nifal de מלט significa escapar ou pôr-se a salvo. “Fuja” comunica de modo natural a fuga urgente do juízo iminente.
- source_word: שָׁמָּה
  choice: para lá / lá
  rationale: O advérbio tem sentido direcional. “Para lá” explicita esse movimento após “fuja”, enquanto “lá” é mais natural após “chegue”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e conserva um registro narrativo digno sem deixar de ser corrente.
- source_word: לֹא אוּכַל
  choice: não posso
  rationale: Traduz diretamente a declaração de incapacidade, sem atenuá-la nem reinterpretá-la.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: fazer nada
  rationale: Embora o hebraico diga literalmente “fazer uma coisa”, a construção negativa idiomática em português é “não posso fazer nada”.
- source_word: עַד בֹּאֲךָ
  choice: até que você chegue
  rationale: Expressa o limite temporal ligado à chegada do interlocutor; a construção com subjuntivo é idiomática em português.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Fórmula inferencial natural em português, ligando o acontecimento à explicação do nome do lugar.
- source_word: קָרָא שֵׁם הָעִיר
  choice: a cidade recebeu o nome
  rationale: Reproduz naturalmente em português a fórmula hebraica de atribuição de nome, cujo sentido literal é “chamou o nome da cidade”.
- source_word: צֹעַר
  choice: Zoar
  rationale: O topônimo é transliterado segundo a forma portuguesa tradicional.
theological_decisions:
- issue: Declaração de incapacidade no contexto do juízo
  choice: “não posso fazer nada até que você chegue lá”
  alternative: “não devo fazer nada” ou “não posso fazer isso”
  rationale: לֹא אוּכַל declara literalmente incapacidade, e דָבָר permanece genérico. A tradução conserva a tensão narrativa e teológica sem explicar se o falante está sujeito a uma ordem, permissão ou limitação específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém-se apenas a aspa de fechamento porque a fala começou no versículo anterior. Os marcadores foram colocados junto à cláusula e ao nome a que as notas efetivamente se referem.
