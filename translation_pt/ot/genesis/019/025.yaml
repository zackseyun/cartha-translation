  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: pt
  text: E ele subverteu aquelas cidades[a], toda a planície[b], todos os habitantes das cidades e a vegetação do solo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «virou de cabeça para baixo». O verbo hebraico pode destacar uma subversão catastrófica.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «a planície» se refere à região da planície do Jordão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: destruiu
  rationale: O verbo הפך pode descrever virar ou subverter de modo catastrófico. Neste contexto, «destruiu» comunica naturalmente em português o resultado da ação, enquanto a nota preserva a imagem concreta de revirar.
- source_word: הֶעָרִים הָאֵל
  choice: aquelas cidades
  rationale: O demonstrativo retoma as cidades específicas já mencionadas na narrativa; «aquelas cidades» é uma referência retrospectiva natural em português.
- source_word: כָּל הַכִּכָּר
  choice: toda a planície
  rationale: כִּכָּר designa aqui a região plana do Jordão. «Toda a planície» é clara e contextualmente adequada.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: todos os habitantes das cidades
  rationale: A construção participial de ישב se refere às pessoas que moravam nas cidades; «habitantes» é conciso e preciso.
- source_word: צֶמַח הָאֲדָמָה
  choice: a vegetação do solo
  rationale: צֶמַח indica aquilo que brota ou cresce, e אֲדָמָה designa o solo ou a terra cultivável. A expressão preserva tanto o sentido vegetal quanto a ligação com o chão.
theological_decisions:
- issue: Sujeito implícito do verbo no singular
  choice: «ele», sem explicitar o nome do agente
  alternative: «Deus» ou «o SENHOR» como sujeito explícito
  rationale: O hebraico deste versículo apresenta um verbo no singular sem repetir expressamente o sujeito; o contexto anterior identifica Deus como agente. O pronome preserva a forma do versículo e a coerência narrativa sem acrescentar um nome ausente desta oração.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe coordenada próxima à do hebraico. «Destruiu» favorece clareza imediata, enquanto a nota registra a imagem lexical mais concreta; «solo» evita confundir אֲדָמָה com um território político.
