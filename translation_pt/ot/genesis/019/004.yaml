  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: pt
  text: Antes que eles se deitassem, os homens da cidade, os homens de Sodoma, cercaram a casa[a] — dos jovens aos idosos[b], todo o povo, de todos os cantos da cidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “rodearam a casa” ou “reuniram-se ao redor da casa”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desde o jovem até o idoso”; a expressão reúne os extremos para indicar pessoas de todas as idades.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “da extremidade”; no contexto, a expressão pode significar “de todos os cantos” ou “de todas as partes da cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Antes que eles se deitassem
  rationale: Expressa com naturalidade a relação temporal e conserva o sentido concreto de שׁכב, sem explicitar além do texto que se preparavam para dormir.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: os homens da cidade, os homens de Sodoma
  rationale: Mantém a referência masculina e a repetição apositiva do hebraico, que identifica a cidade como Sodoma.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: cercaram a casa
  rationale: נסב com עַל descreve o ato de ficar ao redor; no contexto, “cercaram” comunica de modo direto a formação de uma multidão envolvente, sem acrescentar uma ação hostil não declarada neste verso.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: dos jovens aos idosos
  rationale: Reproduz em português natural o merismo que abrange toda a faixa etária, mantendo os dois extremos mencionados no hebraico.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Preserva o substantivo coletivo עָם e sua formulação abrangente, sem reduzi-lo novamente a “homens”.
- source_word: מִקָּצֶה
  choice: de todos os cantos da cidade
  rationale: O singular קָצֶה significa literalmente “extremidade”; neste contexto, a expressão é entendida distributivamente como procedência de todas as partes. “Da cidade” torna explícito o referente indicado pelo contexto.
theological_decisions:
- issue: A linguagem de gênero na descrição da multidão
  choice: Manter “os homens da cidade, os homens de Sodoma”, mas traduzir כָּל הָעָם por “todo o povo”.
  alternative: Uniformizar todas as expressões como “o povo” ou interpretar כָּל הָעָם como “todos os homens”.
  rationale: O verso começa com o termo masculino אַנְשֵׁי e depois emprega o coletivo mais amplo עָם. Manter essa mudança evita tanto neutralizar a referência inicial quanto restringir indevidamente o termo posterior.
- issue: A abrangência de כָּל הָעָם
  choice: Conservar a formulação totalizante “todo o povo”.
  alternative: Atenuar como “muita gente” ou explicar como hipérbole no texto principal.
  rationale: O hebraico emprega explicitamente כָּל, “todo”. A tradução preserva a força retórica e qualquer tensão quanto ao alcance da expressão, sem decidir no texto principal se a totalidade é matemática ou enfática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “os homens da cidade, os homens de Sodoma” foi preservada por refletir a aposição enfática do hebraico. O travessão organiza a sequência abrangente sem alterar suas relações sintáticas.
