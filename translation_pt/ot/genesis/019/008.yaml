  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: pt
  text: 'Vejam, por favor: tenho duas filhas que nunca tiveram relações com homem algum.[a] Deixem-me, por favor, trazê-las para fora, até vocês, e façam com elas o que parecer bom aos seus olhos. Somente não façam nada a estes homens, pois vieram para debaixo da sombra do meu teto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que não conheceram homem”; trata-se de um modo de dizer que não haviam tido relações sexuais com homem algum. Tradicionalmente: “que são virgens”.'
    reason: lexical_alternative
  - marker: b
    text: “Debaixo da sombra do meu teto” é uma imagem de abrigo e expressa a proteção devida aos hóspedes acolhidos numa casa.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Vejam, por favor
  rationale: הִנֵּה chama urgentemente a atenção, e נָא comunica súplica. O plural concorda com o grupo a quem Ló se dirige.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: que nunca tiveram relações com homem algum
  rationale: יָדַע é aqui um eufemismo hebraico para relações sexuais. A formulação torna o sentido claro em português atual sem reduzi-lo simplesmente ao substantivo interpretativo 'virgens'.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Deixem-me, por favor, trazê-las para fora a vocês
  rationale: O coortativo expressa oferta ou intenção, enquanto נָא reforça o tom suplicante. 'Para fora' preserva o movimento explícito do verbo.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: e façam com elas o que parecer bom aos seus olhos
  rationale: Mantém a imagem hebraica dos 'olhos' e não suaviza a natureza perturbadora da proposta.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Somente não façam nada a estes homens
  rationale: רַק introduz uma limitação enfática, e a proibição com דָבָר tem alcance total. A ordem escolhida é natural em português e conserva o contraste.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: pois foi por isso que vieram
  rationale: Preserva a força causal da expressão עַל כֵּן e liga a chegada dos hóspedes à proteção representada pelo teto de Ló.
- source_word: בְּצֵל קֹרָתִי
  choice: para debaixo da sombra do meu teto
  rationale: Conserva a imagem literal de abrigo e proteção, sem reduzir o idioma simplesmente a 'em minha casa'.
theological_decisions:
- issue: Possível suavização moral da oferta de Ló
  choice: Manter explicitamente a força chocante da proposta
  alternative: Empregar uma paráfrase mais branda, como 'tratem-nas como quiserem'
  rationale: O hebraico apresenta a proposta de modo direto. A tradução não deve indicar aprovação moral nem atenuar aquilo que o texto relata.
- issue: Sentido da chegada dos visitantes sob o teto de Ló
  choice: Preservar a relação causal e a imagem de proteção hospitaleira
  alternative: Traduzir apenas 'porque estão hospedados em minha casa'
  rationale: 'A expressão comunica mais que localização: evoca a obrigação de proteger hóspedes. A imagem é mantida no texto, com explicação em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a aspereza moral do relato, a súplica repetida de Ló e a imagem hebraica da sombra do teto. Os marcadores [a] e [b] aparecem no texto principal.
