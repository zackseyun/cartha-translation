  to: 'Vejam, por favor: tenho duas filhas que nunca tiveram relações com homem algum.[a] Deixem-me, por favor, trazê-las para fora, até vocês, e façam com elas o que parecer bom aos seus olhos. Somente não façam nada a estes homens, pois vieram para debaixo da sombra do meu teto.[b]'
