base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: pt
  text: 'Vê, por favor: o teu servo encontrou favor aos teus olhos, e demonstraste grande amor leal[a] para comigo, preservando a minha vida. Mas não consigo fugir para o monte; temo que a calamidade[b] me alcance e eu morra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondade” ou “misericórdia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o mal”; aqui, refere-se à calamidade ou ao desastre que poderia atingir Ló.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja, por favor
  rationale: “Veja” chama a atenção do interlocutor, enquanto “por favor” preserva o tom urgente e cortês de נָא em português atual.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: encontrou favor aos teus olhos
  rationale: Mantém a expressão idiomática hebraica e sua imagem, permanecendo compreensível em português.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: No contexto, é uma forma respeitosa de autorreferência diante de um superior, sem destacar a condição jurídica de escravo.
- source_word: וַתַּגְדֵּל
  choice: engrandeceste
  rationale: Expressa o sentido causativo de tornar grande ou magnificar, com concisão e dignidade.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: Comunica a bondade constante e comprometida de חֶסֶד sem transformá-la em uma fórmula técnica de aliança.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: que demonstraste para comigo
  rationale: Traduz de modo idiomático a bondade praticada em favor de Ló.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: ao preservar minha vida
  rationale: Expressa a conservação da vida sem introduzir, neste contexto, um sentido soteriológico mais amplo.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Mas não consigo
  rationale: “Mas” explicita o contraste contextual, e a forma verbal comunica a incapacidade enfatizada pelo pronome hebraico.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: fugir para o monte
  rationale: Preserva o movimento em direção ao lugar elevado indicado pela terminação direcional hebraica.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: pois a desgraça poderia me alcançar
  rationale: Reproduz a consequência temida introduzida por פֶּן e o sentido contextual de דבק como alcançar ou apanhar.
- source_word: הָרָעָה
  choice: a desgraça
  rationale: Neste contexto, רָעָה designa a calamidade destrutiva iminente, não o mal moral abstrato.
theological_decisions:
- issue: Sentido de חֶסֶד na súplica dirigida ao mensageiro que age com autoridade divina
  choice: amor leal
  alternative: bondade; misericórdia
  rationale: “Amor leal” preserva a ideia de benevolência constante e comprometida, sem exigir que o termo seja entendido aqui como uma fórmula técnica de aliança.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com as formas masculinas singulares do hebraico. A construção conserva imagens hebraicas importantes sem recorrer a linguagem arcaica.
