revisions:
- from: 'Veja, por favor: o teu servo encontrou favor aos teus olhos, e engrandeceste o teu amor leal[a], que demonstraste para comigo ao preservar minha vida. Mas não consigo fugir para o monte, pois a desgraça[b] poderia me alcançar, e eu morreria.'
  to: 'Vê, por favor: o teu servo encontrou favor aos teus olhos, e demonstraste grande amor leal[a] para comigo, preservando a minha vida. Mas não consigo fugir para o monte; temo que a calamidade[b] me alcance e eu morra.'
  rationale: A revisão conserva as imagens e os termos centrais do hebraico, mas substitui uma expressão pouco idiomática por uma formulação portuguesa natural que preserva a intensificação de חֶסֶד. Também restitui a força de receio de פֶּן por “temo que” e move a âncora da nota lexical para o termo que ela efetivamente explica.
