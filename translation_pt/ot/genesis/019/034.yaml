base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: pt
  text: 'No dia seguinte, a primogênita disse à mais nova: “Veja, na noite passada eu me deitei com meu pai. Vamos fazê-lo beber vinho também esta noite. Depois, venha e deite-se com ele, para preservarmos a descendência[a] de nosso pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “semente de nosso pai”. Aqui, “semente” significa descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa de modo natural em português a progressão narrativa e a referência ao dia posterior, sem recorrer ao arcaico “e aconteceu que”.
- source_word: הַבְּכִירָה
  choice: a primogênita
  rationale: Preserva a ênfase na ordem de nascimento e, pelo gênero feminino, identifica a filha mais velha.
- source_word: הַצְּעִירָה
  choice: a mais nova
  rationale: Reproduz o adjetivo comparativo substantivado em linguagem portuguesa corrente.
- source_word: הֵן
  choice: Veja
  rationale: Mantém a função de chamar a atenção para a declaração seguinte, sem o tom arcaico de “eis”.
- source_word: שָׁכַבְתִּי אֶת אָבִי
  choice: eu me deitei com meu pai
  rationale: Conserva o eufemismo sexual grave do hebraico, sem torná-lo vago nem clinicamente explícito.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: Vamos fazê-lo beber vinho
  rationale: Comunica claramente o sentido causativo da forma verbal hebraica.
- source_word: גַּם הַלַּיְלָה
  choice: também esta noite
  rationale: Preserva tanto a referência temporal quanto a ideia aditiva de repetição.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: Depois, venha e deite-se com ele
  rationale: Apresenta naturalmente a sequência das ações e mantém o mesmo eufemismo sexual do original.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: para preservarmos a descendência de nosso pai
  rationale: “Preservarmos” representa o sentido causativo de manter viva, enquanto “descendência” comunica em português atual o uso reprodutivo de זֶרַע.
