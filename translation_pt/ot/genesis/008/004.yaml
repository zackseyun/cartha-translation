  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: pt
  text: No sétimo mês, no décimo sétimo dia do mês, a arca veio a repousar sobre os montes de Ararate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “os montes de Ararate”, referindo-se à região montanhosa de Ararate, não necessariamente a um único pico, como o chamado monte Ararate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: veio a repousar
  rationale: O verbo נוח no wayyiqtol descreve a arca chegando ao seu lugar de repouso. A formulação preserva esse caráter eventivo sem sugerir necessariamente uma aterrissagem.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: É a designação tradicional, clara e contextualmente precisa para a תֵּבָה de Noé, embora o termo hebraico também possa designar um recipiente semelhante a uma caixa.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Equivalente temporal direto e idiomático em português.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo sétimo dia do mês
  rationale: Reproduz com clareza e naturalidade a fórmula hebraica de datação.
- source_word: עַל
  choice: sobre
  rationale: Expressa naturalmente a relação locativa indicada pela preposição hebraica.
- source_word: הָרֵי אֲרָרָט
  choice: os montes de Ararate
  rationale: הָרֵי é plural construto; portanto, a tradução mantém o plural e não restringe a referência a um único pico.
theological_decisions:
- issue: Expressão geográfica הָרֵי אֲרָרָט
  choice: os montes de Ararate
  alternative: o monte Ararate
  rationale: O hebraico usa o plural “montes”. Mantê-lo evita introduzir a identificação mais específica, e tradicional, com um único pico, que o texto não afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “veio a repousar” conserva o movimento até o estado de repouso; “montes” mantém explicitamente o plural do hebraico.
