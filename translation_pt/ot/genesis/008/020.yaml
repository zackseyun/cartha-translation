  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: pt
  text: Então Noé construiu um altar para Yahweh[a], tomou alguns de cada animal puro e de cada ave pura[b] e ofereceu holocaustos sobre o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui representado como “Yahweh”. Tradicionalmente, muitas traduções usam “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “tomou de cada animal puro e de cada ave pura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: בנה significa diretamente “construir”; a forma narrativa “construiu” é natural e precisa em português.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente corrente de מזבח, o lugar destinado ao sacrifício.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica o destinatário do altar, e יהוה é representado pelo nome divino “Yahweh”.
- source_word: מִכֹּל
  choice: alguns de cada
  rationale: 'A construção com לקח tem força partitiva no contexto: Noé selecionou exemplares dentre cada categoria pura, sem que isso implique o sacrifício de todos os animais.'
- source_word: הַבְּהֵמָה הַטְּהוֹרָה
  choice: animal puro
  rationale: בהמה designa aqui os animais em contraste com as aves, e טהור indica sua condição de pureza ritual. “Animal puro” mantém a expressão concisa.
- source_word: הָעוֹף הַטָּהֹר
  choice: ave pura
  rationale: עוֹף abrange criaturas voadoras, mas “ave” é o equivalente mais natural neste contexto sacrificial.
- source_word: וַיַּעַל עֹלֹת
  choice: ofereceu holocaustos
  rationale: O hifil de עלה com עֹלֹת é uma expressão sacrificial que significa oferecer sacrifícios totalmente queimados; “holocaustos” é o termo bíblico português consagrado.
- source_word: בַּמִּזְבֵּחַ
  choice: sobre o altar
  rationale: A preposição ב tem aqui sentido locativo; “sobre o altar” expressa naturalmente o lugar da oferta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido partitivo da seleção feita por Noé
  choice: alguns de cada animal puro e de cada ave pura
  alternative: de cada animal puro e de cada ave pura
  rationale: O hebraico diz literalmente “tomou de cada”. O contexto favorece a leitura partitiva; “alguns de cada” evita sugerir que Noé sacrificou todos os animais puros, sem eliminar a forma literal, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A coordenação verbal foi mantida de modo fluente, e “puro” conserva a linguagem ritual sem explicitação excessiva no texto principal.
