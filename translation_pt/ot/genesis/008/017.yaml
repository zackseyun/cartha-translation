base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: pt
  text: 'Traga para fora com você todos os seres vivos que estão com você, de toda carne: as aves, os animais domésticos e todo animal rastejante que rasteja sobre a terra, para que pululem pela terra, sejam fecundos e se multipliquem sobre a terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: todo ser vivo
  rationale: Expressa o sentido abrangente de חַיָּה neste contexto, sem restringi-lo aos animais selvagens.
- source_word: אֲשֶׁר אִתְּךָ
  choice: que está com você
  rationale: Reproduz de modo direto e natural a oração relativa hebraica.
- source_word: מִכָּל בָּשָׂר
  choice: de toda carne
  rationale: Preserva a expressão coletiva בָּשָׂר, recorrente no relato do dilúvio para os seres animados.
- source_word: בָּעוֹף
  choice: aves
  rationale: É a designação portuguesa natural para עוֹף nesta enumeração de criaturas.
- source_word: וּבַבְּהֵמָה
  choice: animais domésticos
  rationale: Representa o uso de בְּהֵמָה para animais terrestres de maior porte, especialmente os domesticados, distinguindo-os dos rastejantes.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: e todo animal rastejante que rasteja
  rationale: Mantém a repetição lexical deliberada entre רֶמֶשׂ e רֹמֵשׂ, ainda que ela soe enfática em português.
- source_word: הוֹצֵא אִתָּךְ
  choice: Faça sair com você
  rationale: 'Conserva a força causativa do imperativo hifil de יצא: Noé deve fazer os animais saírem juntamente com ele.'
- source_word: וְשָׁרְצוּ
  choice: para que pululem
  rationale: Pulular comunica a proliferação abundante evocada por שׁרץ; a construção final explicita naturalmente em português o resultado pretendido pelo comando.
- source_word: בָאָרֶץ
  choice: pela terra / sobre a terra
  rationale: Terra corresponde ao alcance amplo de אָרֶץ após o dilúvio; as preposições foram ajustadas ao verbo de cada ocorrência para produzir português natural.
- source_word: וּפָרוּ וְרָבוּ
  choice: sejam fecundos e se multipliquem
  rationale: Preserva a fórmula da bênção criacional de Gênesis e sua ligação literária com o capítulo 1.
theological_decisions:
- issue: Eco da bênção da criação depois do dilúvio
  choice: sejam fecundos e se multipliquem, com pululem
  alternative: proliferem e aumentem em número
  rationale: A formulação escolhida conserva o vocabulário distintivo da criação retomado no texto hebraico, apresentando o recomeço posterior ao dilúvio sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “animal rastejante que rasteja” foi mantida para refletir a ligação lexical do hebraico; “pululem” conserva a imagem vigorosa do original e recebe nota explicativa.
