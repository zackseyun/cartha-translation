    rationale: Embora reflita a força causativa de הוֹצֵא, a expressão é pouco corrente. «Traga para fora com você» comunica naturalmente o imperativo causativo e o movimento de saída.
  - severity: low
    issue: Sintaxe e pontuação da enumeração.
    rationale: «Todo ser vivo ... de toda carne» fica mais claro no plural, seguido de dois-pontos para introduzir as classes. A vírgula após o travessão deve ser eliminada.
