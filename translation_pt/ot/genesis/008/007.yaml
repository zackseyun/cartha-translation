revisions:
- from: Então ele soltou o corvo, que saiu e continuou indo e voltando[a], até que as águas tivessem secado da superfície da terra.
  to: Então ele enviou o corvo, que saiu e continuou indo e voltando, até as águas secarem da superfície da terra.
  rationale: A revisão substitui “soltou” por “enviou”, mais próximo do verbo hebraico, e elimina o mais-que-perfeito do subjuntivo. Conserva-se a explicitação sóbria da saída inicial e do movimento repetido do corvo; a nota mantém a forma mais literal da construção hebraica.
