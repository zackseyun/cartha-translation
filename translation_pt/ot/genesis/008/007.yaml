  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: pt
  text: Então ele enviou o corvo, que saiu e continuou indo e voltando, até as águas secarem da superfície da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Então ele soltou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa a sequência, e “soltou” é natural em português para o ato de deixar uma ave sair, sem alterar a ação básica de enviá-la para fora.
- source_word: הָעֹרֵב
  choice: o corvo
  rationale: Tradução zoológica direta do substantivo definido עֹרֵב.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: que saiu e continuou indo e voltando
  rationale: Preserva o verbo finito “saiu” e comunica o movimento repetido ou contínuo expresso pela construção com infinitivos absolutos, em português atual e compreensível.
- source_word: עַד יְבֹשֶׁת
  choice: até que ... tivessem secado
  rationale: Expressa o limite temporal da movimentação repetida do corvo. O mais-que-perfeito do subjuntivo ajusta-se naturalmente à oração temporal no contexto passado.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Mantém a forma plural convencional do hebraico e o vocabulário próprio do relato do dilúvio.
- source_word: מֵעַל הָאָרֶץ
  choice: da superfície da terra
  rationale: Comunica com naturalidade a ideia espacial de as águas secarem ou desaparecerem de sobre a terra, evitando o pouco idiomático “de sobre a terra”.
