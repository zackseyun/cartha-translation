review_pass:
  verdict: revise
  source_fidelity: A oração sobre o corvo preserva bem o verbo finito e o valor iterativo da construção hebraica יָצוֹא וָשׁוֹב. Contudo, “soltou” pode sugerir apenas libertar a ave, enquanto וַיְשַׁלַּח descreve o ato de enviá-la para fora. Além disso, o mais-que-perfeito do subjuntivo em “tivessem secado” introduz uma anterioridade desnecessária e não reproduz com precisão o limite temporal indicado por עַד.
  naturalness: “Até que as águas tivessem secado” é pouco natural neste contexto narrativo. A construção com infinitivo pessoal, “até as águas secarem”, é moderna, clara e idiomática. “Da superfície da terra” comunica naturalmente o afastamento das águas de sobre a terra.
  terminology: “Corvo” e “águas” são adequados. “Enviou o corvo” é mais fiel ao verbo hebraico e mantém registro narrativo digno e acessível.
  issues:
  - severity: medium
    issue: “soltou” para וַיְשַׁלַּח
    rationale: Embora possa funcionar no contexto de uma ave, “soltou” tende a significar libertar; “enviou” reproduz mais diretamente o despacho deliberado expresso pelo hebraico.
  - severity: medium
    issue: “até que as águas tivessem secado”
    rationale: O mais-que-perfeito do subjuntivo sugere que o secamento já estivesse concluído antes do marco narrativo. O hebraico apresenta o secamento como o ponto-limite da ação repetida do corvo.
  revised_text: Então ele enviou o corvo, que saiu e continuou indo e voltando, até as águas secarem da superfície da terra.
  revised_footnotes:
  - marker: a
    text: 'Mais literalmente: “saiu, saindo e voltando”. A expressão hebraica indica movimento repetido ou contínuo.'
    reason: lexical_alternative
