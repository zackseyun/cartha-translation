  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: pt
  text: Então ele soltou a pomba de junto de si, para ver se as águas haviam baixado da superfície do solo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «de sobre a face do solo».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Então ele soltou
  rationale: O wayyiqtol faz a narrativa avançar. No contexto de libertar uma ave da arca, «soltou» é mais natural em português do que o genérico «enviou», enquanto «Então» expressa a sequência narrativa.
- source_word: הַיּוֹנָה
  choice: a pomba
  rationale: יוֹנָה pode designar pomba ou pombo; «pomba» é a forma tradicional e contextualmente adequada nesta narrativa.
- source_word: מֵאִתּוֹ
  choice: implícito em «soltou»
  rationale: A expressão indica afastamento da presença de Noé. Em português, «soltou a pomba de junto de si» seria pesado e pouco natural; o sentido é adequadamente comunicado pelo verbo «soltou», sem substituir a expressão por «da arca», que não está explícito no hebraico.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: O infinitivo de ראה indica finalidade, diretamente expressa por «para ver».
- source_word: הֲקַלּוּ
  choice: haviam baixado
  rationale: Neste contexto, קלל indica que as águas diminuíram. «Haviam baixado» é corrente, claro e apropriado para o nível das águas, preservando a pergunta indireta introduzida por הֲ.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Mantém o plural hebraico e o uso natural da linguagem bíblica relativa ao dilúvio.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da superfície do solo
  rationale: Comunica de modo claro o sentido espacial literal de «de sobre a face do solo». «Solo» representa אֲדָמָה melhor que «terra» neste contexto imediato.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação privilegia naturalidade sem acrescentar «da arca», ausente do texto hebraico; a noção de afastamento contida em מֵאִתּוֹ fica implícita em «soltou».
