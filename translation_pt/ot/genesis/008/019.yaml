base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: pt
  text: Todo animal, todo ser que rasteja e toda ave — tudo o que se move sobre a terra — saíram da arca de acordo com as suas famílias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “família por família”. A expressão hebraica indica que os animais saíram em seus respectivos grupos familiares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Todo animal
  rationale: חַיָּה designa aqui a categoria dos animais terrestres, distinguida dos seres rastejantes e das aves. “Todo” preserva a força distributiva de כָּל sem restringir a referência a animais selvagens.
- source_word: כָּל הָרֶמֶשׂ
  choice: todo ser que rasteja
  rationale: רֶמֶשׂ refere-se a criaturas que se deslocam junto ao chão. A formulação verbal é clara no português atual e preserva a categoria da taxonomia de Gênesis.
- source_word: וְכָל הָעוֹף
  choice: e toda ave
  rationale: עוֹף pode abranger seres voadores, mas “ave” é a tradução natural neste contexto e mantém a distinção da enumeração.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: tudo o que se move sobre a terra
  rationale: O particípio רוֹמֵשׂ retoma o campo semântico do movimento rente ao solo. “Move” evita uma repetição pesada de “rasteja” e comunica o alcance abrangente da expressão; “sobre a terra” preserva a preposição e a imagem do hebraico.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: de acordo com as suas famílias
  rationale: מִשְׁפָּחָה significa normalmente “família” ou “clã”. No contexto animal, indica grupos ou divisões de descendência; a tradução conserva essa imagem sem substituí-la pelo termo mais interpretativo “espécies”.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: saíram da arca
  rationale: יָצְאוּ é o verbo comum para sair, e תֵּבָה é adequadamente vertido por “arca” na narrativa de Noé. A formulação é direta e idiomática em português.
