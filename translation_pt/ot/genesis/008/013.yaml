revisions:
- from: E aconteceu que, no ano seiscentos e um[a], no primeiro mês, no primeiro dia do mês, as águas sobre a terra haviam secado. Então Noé removeu a cobertura da arca[b], olhou, e eis que a superfície do solo estava seca.
  to: E aconteceu que, no ano seiscentos e um[a], no primeiro mês, no primeiro dia do mês, as águas haviam secado da superfície da terra. Então Noé removeu a cobertura da arca[b], olhou e eis que a superfície do solo estava seca.
  rationale: A revisão limita-se a esclarecer que as águas haviam secado da superfície da terra, correspondendo à preposição hebraica מֵעַל e evitando uma ambiguidade sintática em português. Também ajusta a pontuação da última oração para uma leitura narrativa mais fluida. As notas mantêm tanto a referência contextual, mas não explicitada, do ano quanto a indefinição arquitetônica de מִכְסֶה.
