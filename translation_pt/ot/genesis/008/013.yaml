base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: pt
  text: E aconteceu que, no ano seiscentos e um[a], no primeiro mês, no primeiro dia do mês, as águas haviam secado da superfície da terra. Então Noé removeu a cobertura da arca[b], olhou e eis que a superfície do solo estava seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, o ano seiscentos e um da vida de Noé; neste versículo, o hebraico não explicita o referente.
    reason: contextual_clarification
  - marker: b
    text: 'Ou: «o teto da arca». O termo hebraico significa, de modo geral, «cobertura» e não exige um sentido arquitetônico mais específico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz a indicação temporal e mantém a progressão da narrativa hebraica em português atual, sem recorrer à fórmula arcaizante «e sucedeu».
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: no ano seiscentos e um
  rationale: Expressa naturalmente em português a contagem hebraica, literalmente «em um e seiscentos ano», sem explicitar no corpo do texto de quem é o ano.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro mês, no primeiro dia do mês
  rationale: Torna explícita a elipse de «mês» na primeira expressão e traduz com clareza a fórmula hebraica de data.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: as águas sobre a terra haviam secado
  rationale: Preserva o sentido de חרב, «secar», e a relação espacial de מֵעַל, em formulação natural; o mais-que-perfeito situa o processo como concluído nesse momento narrativo.
- source_word: וַיָּסַר
  choice: removeu
  rationale: Traduz de modo direto o causativo de סור, «tirar, remover».
- source_word: מִכְסֵה הַתֵּבָה
  choice: a cobertura da arca
  rationale: «Cobertura» mantém o sentido lexical amplo de מִכְסֶה, sem especificar indevidamente que se tratava de um telhado.
- source_word: וַיַּרְא
  choice: olhou
  rationale: No contexto da retirada da cobertura, comunica o ato de observar, e não apenas o resultado visual.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função de chamar a atenção para a constatação de Noé, em registro narrativo digno e compreensível.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: a superfície do solo estava seca
  rationale: «Superfície» traduz naturalmente פְּנֵי neste contexto, e «solo» distingue הָאֲדָמָה da referência anterior à terra em sentido mais amplo.
theological_decisions:
- issue: Identificação do «ano seiscentos e um»
  choice: Manter o referente implícito no texto e explicá-lo em nota.
  alternative: Traduzir «no ano seiscentos e um da vida de Noé».
  rationale: O contexto anterior favorece fortemente a idade de Noé como sistema de datação, mas este versículo não repete explicitamente «da vida de Noé»; a nota informa o leitor sem eliminar essa característica do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a cadência narrativa, a fórmula enfática «e eis que» e a ambiguidade do sistema de datação, evitando tanto arcaísmos desnecessários quanto especificações arquitetônicas não exigidas pelo hebraico.
