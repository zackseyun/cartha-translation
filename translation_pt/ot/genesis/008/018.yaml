base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: pt
  text: Então Noé saiu[a], com seus filhos, sua mulher e as mulheres de seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “E Noé saiu” ou “Assim, Noé saiu”. A forma narrativa hebraica admite diferentes conectivos simples em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então Noé saiu
  rationale: A forma narrativa hebraica faz a ação avançar e, neste contexto, apresenta a saída como cumprimento imediato da ordem anterior. “Então” é natural em português; “saiu” traduz diretamente יָצָא.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּבָנָיו
  choice: com seus filhos
  rationale: בָּנִים designa especificamente os filhos homens de Noé neste contexto. A preposição “com” organiza naturalmente em português a lista dos que saíram juntamente com ele, sem alterar a relação expressa pelo hebraico.
- source_word: וְאִשְׁתּוֹ
  choice: sua mulher
  rationale: O substantivo singular com sufixo de terceira pessoa masculina significa “sua mulher”. A escolha conserva a estrutura compacta do hebraico e é corrente em português bíblico moderno.
- source_word: וּנְשֵׁי בָנָיו
  choice: as mulheres de seus filhos
  rationale: Reproduz de perto a expressão hebraica, literalmente “as mulheres de seus filhos”, sem substituí-la pelo termo relacional “noras”.
- source_word: אִתּוֹ
  choice: com seus filhos, sua mulher e as mulheres de seus filhos
  rationale: אִתּוֹ significa “com ele”. Em português, antecipar a relação comitativa para introduzir a lista evita o fecho pesado “com ele” e transmite naturalmente o mesmo sentido.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. A ordem foi levemente ajustada ao uso idiomático do português: o hebraico encerra a enumeração com “com ele”, enquanto a tradução introduz a companhia com “com”. Mantém-se “mulher” e a formulação literal “mulheres de seus filhos”.'
