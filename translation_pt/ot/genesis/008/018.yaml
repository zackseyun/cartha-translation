  source_fidelity: 'A tradução transmite todos os elementos do hebraico: Noé saiu; seus filhos, sua mulher e as mulheres de seus filhos estavam com ele. A antecipação de «com» para introduzir a enumeração é uma reordenação idiomática legítima em português e preserva o sentido de אִתּוֹ («com ele»). «Então» representa adequadamente o avanço narrativo de וַיֵּצֵא, sem alegar exclusividade para esse conectivo.'
