  terminology: «Noé» é a forma portuguesa estabelecida. «Filhos» preserva corretamente o referente masculino de בָנָיו. «As mulheres de seus filhos» é uma formulação próxima do hebraico e suficientemente clara para «as esposas de seus filhos»; evita impor uma preferência desnecessária por «noras».
