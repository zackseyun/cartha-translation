base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: pt
  text: A pomba veio até ele ao entardecer[a], e eis que trazia no bico uma folha de oliveira recém-arrancada[b]. Então Noé soube que as águas haviam baixado da superfície da terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltou para ele”. O verbo hebraico significa propriamente “veio”, embora o contexto indique um retorno.'
    reason: lexical_alternative
  - marker: b
    text: “Recém-arrancada” traduz um termo hebraico que indica algo arrancado ou destacado, dando a entender que a folha havia sido tirada recentemente de uma oliveira viva.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “haviam diminuído”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: veio
  rationale: O qal de בוא significa normalmente “vir” ou “entrar”. O contexto pressupõe o retorno da pomba, mas essa ideia não está expressa no verbo; por isso, fica registrada em nota.
- source_word: אֵלָיו
  choice: até ele
  rationale: Expressa de modo natural em português o movimento da pomba em direção a Noé.
- source_word: הַיּוֹנָה
  choice: a pomba
  rationale: Equivalente lexical direto e referência definida à ave que Noé havia soltado.
- source_word: לְעֵת עֶרֶב
  choice: ao entardecer
  rationale: Formulação corrente e digna que indica o período da tarde em que a pomba chegou.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva o marcador discursivo que chama a atenção para a descoberta inesperada.
- source_word: עֲלֵה זַיִת
  choice: uma folha de oliveira
  rationale: Tradução portuguesa natural da construção “folha de oliveira”.
- source_word: טָרָף
  choice: recém-arrancada
  rationale: Comunica que a folha havia sido arrancada ou destacada recentemente, sugerindo vegetação viva sem reduzir o termo apenas a “fresca”.
- source_word: בְּפִיהָ
  choice: trazia no bico
  rationale: Embora o hebraico diga literalmente “em sua boca”, “no bico” é o equivalente idiomático preciso para uma ave; “trazia” torna natural a construção existencial do contexto.
- source_word: וַיֵּדַע
  choice: Então Noé soube
  rationale: Faz avançar a narrativa e comunica que Noé chegou a essa conclusão a partir da folha.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Noé soube.
- source_word: קַלּוּ הַמַּיִם
  choice: as águas ... haviam baixado
  rationale: O verbo indica que as águas diminuíram ou perderam volume; “haviam baixado” é natural para águas de inundação.
- source_word: מֵעַל הָאָרֶץ
  choice: as águas sobre a terra
  rationale: A reorganização sintática preserva a relação espacial de מֵעַל sem recorrer ao pouco natural “de sobre a terra”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se “e eis que” para reproduzir a vivacidade narrativa do hebraico; emprega-se “no bico” em vez do literal “na boca” por naturalidade referencial.
