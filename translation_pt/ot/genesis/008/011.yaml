    issue: A expressão «as águas sobre a terra haviam baixado» deixa ambígua a relação de מֵעַל הָאָרֶץ.
    rationale: O hebraico afirma que as águas haviam diminuído/baixado de sobre a terra. «Sobre a terra» pode modificar apenas «águas», sem comunicar o afastamento ou a diminuição a partir da superfície terrestre. «Da superfície da terra» explicita em português a relação espacial sem alterar o sentido.
