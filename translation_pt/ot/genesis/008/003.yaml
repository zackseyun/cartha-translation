base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: pt
  text: As águas foram recuando de sobre a terra[a] e, ao fim de cento e cinquenta dias, haviam diminuído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “indo e voltando”. Neste contexto, a construção indica que as águas recuavam de maneira contínua ou progressiva; também se pode traduzir: “recuavam cada vez mais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: foram recuando
  rationale: Embora שׁוב signifique basicamente “voltar”, no contexto das águas que se retiram de sobre a terra, “recuar” comunica com naturalidade o movimento de retração.
- source_word: מֵעַל הָאָרֶץ
  choice: de sobre a terra
  rationale: Preserva a imagem espacial de águas que cobriam a superfície da terra, sem reduzi-la simplesmente a “da terra”.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: foram recuando
  rationale: A construção com infinitivos absolutos expressa ação contínua ou progressiva. A locução portuguesa “foram recuando” integra esse valor ao verbo principal e evita sugerir indevidamente um vaivém literal.
- source_word: וַיַּחְסְרוּ
  choice: haviam diminuído
  rationale: Mantém um segundo verbo, distinto de “recuar”, e exprime a redução do volume ou nível das águas. O mais-que-perfeito composto esclarece que essa redução se verificava ao término dos cento e cinquenta dias.
- source_word: מִקְצֵה
  choice: ao fim de
  rationale: Equivalente temporal direto e idiomático para o sentido de conclusão do período.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: cento e cinquenta dias
  rationale: Forma cardinal corrente e clara em português.
theological_decisions: []
