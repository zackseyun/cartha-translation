base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: pt
  text: E no segundo mês, no vigésimo sétimo dia do mês, a terra[a] estava seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a região” ou “o solo”. A palavra hebraica pode designar a terra em sentido amplo, uma região ou o chão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: E, no ... mês
  rationale: A conjunção ו e a preposição ב ligam esta indicação cronológica à sequência narrativa. “E, no” preserva essa ligação em português natural.
- source_word: הַשֵּׁנִי
  choice: segundo
  rationale: É o adjetivo ordinal que modifica “mês”; “no segundo mês” é a formulação corrente em português.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: no vigésimo sétimo dia do mês
  rationale: A expressão é uma fórmula hebraica de data. Esta tradução conserva todos os elementos e os apresenta de modo idiomático em português moderno.
- source_word: יָבְשָׁה
  choice: estava seca
  rationale: O qal perfeito feminino singular de יבש descreve aqui o estado resultante alcançado pela terra naquele momento. “Estava seca” preserva o valor estativo sem excluir o processo anterior de secagem.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar a terra em sentido amplo, uma região ou o solo. “A terra” mantém em português boa parte dessa amplitude e se harmoniza com o quadro abrangente do relato do dilúvio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura cronológica próxima do hebraico. A vírgula após “E” destaca a expressão temporal inicial sem tornar a frase arcaica. O marcador da nota foi colocado junto de “terra”, termo ao qual a alternativa lexical se refere.
