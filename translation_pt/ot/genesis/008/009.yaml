review_pass:
  verdict: revise
  source_fidelity: A redação preserva a sequência narrativa, a causalidade e os dois destinos do ato final («para junto de si» e «para dentro da arca»). Contudo, «onde pousar a planta do pé» atribui de modo pouco natural o ato de pousar à planta do pé e enfraquece a construção concreta de מָנוֹחַ («lugar de descanso/repouso») para a sola do pé da pomba.
  naturalness: O texto é geralmente claro e de registro bíblico moderno. A substituição por «lugar de descanso para a planta de seu pé» corrige a formulação pouco idiomática, mantendo a precisão semântica. «As águas estavam sobre a superfície» representa mais diretamente o plural hebraico e a imagem espacial do original do que «havia água».
  terminology: «Arca», «pomba», «planta do pé», «estendeu a mão» e «trouxe-a» são adequados. Não há questão teológica ou de nomes próprios neste versículo.
  issues:
  - severity: medium
    issue: «não encontrou onde pousar a planta do pé»
    rationale: Em português, quem pousa é a pomba; a expressão faz a «planta do pé» parecer sujeito ou objeto direto do verbo «pousar». O hebraico diz que ela não encontrou um lugar de repouso para a sola de seu pé.
  - severity: low
    issue: «havia água»
    rationale: Embora seja compreensível como substantivo de massa, a formulação deixa de refletir o plural מַיִם e é menos direta que «as águas estavam sobre a superfície», que preserva a imagem hebraica.
