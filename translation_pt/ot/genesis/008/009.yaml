base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: pt
  text: Mas a pomba não encontrou lugar de descanso[a] para a planta de seu pé e voltou para ele, para a arca, porque as águas estavam sobre a superfície de toda a terra. Então ele estendeu a mão, pegou-a e a trouxe para junto de si, para dentro da arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lugar de repouso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ
  choice: onde pousar
  rationale: Neste contexto concreto, o substantivo indica um lugar de descanso onde a pomba pudesse pousar; a formulação verbal é natural em português e preserva esse sentido.
- source_word: לְכַף רַגְלָהּ
  choice: a planta do pé
  rationale: כַּף, com רֶגֶל, designa a planta do pé. A tradução conserva a imagem específica do hebraico.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: e voltou para ele, à arca
  rationale: Mantém tanto a referência a Noé quanto o movimento em direção à arca, sem antecipar a entrada explicitada no fim do versículo.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: havia água sobre a superfície de toda a terra
  rationale: Preserva a imagem hebraica de água sobre a face ou superfície da terra, evitando substituí-la pela interpretação mais ampla 'cobria'.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: estendeu a mão
  rationale: Equivalente idiomático português para o gesto expresso por שׁלח com 'mão'.
- source_word: וַיִּקָּחֶהָ
  choice: pegou-a
  rationale: Expressa de modo direto e natural o Qal de לקח no contexto de receber fisicamente a pomba.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: a trouxe para junto de si, para dentro da arca
  rationale: 'Representa distintamente os dois complementos hebraicos: a pomba é trazida para junto de Noé e para dentro da arca.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura corrente, com escolhas compreensíveis tanto no Brasil quanto em âmbito lusófono mais amplo. Emprega 'pomba' no feminino, conforme o gênero do substantivo hebraico e o uso natural em português; evita explicitar o nome de Noé, pois o hebraico mantém o pronome.
