  to: Mas a pomba não encontrou lugar de descanso[a] para a planta de seu pé e voltou para ele, para a arca, porque as águas estavam sobre a superfície de toda a terra. Então ele estendeu a mão, pegou-a e a trouxe para junto de si, para dentro da arca.
