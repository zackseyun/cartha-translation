  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: pt
  text: Então ele esperou mais sete dias e soltou a pomba; ela não voltou mais para ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela não tornou a voltar para ele”. A expressão hebraica negativa com יָסְפָה + שׁוּב pode ser entendida como “não voltou outra vez” ou “já não voltou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Então ele esperou
  rationale: O verbo יחל, neste contexto, expressa esperar ou aguardar; “Então” representa a progressão narrativa do waw consecutivo.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: mais sete dias
  rationale: A combinação indica outro período de sete dias. “Mais sete dias” é natural em português e preserva a repetição temporal.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: e soltou a pomba
  rationale: Embora שׁלח signifique normalmente “enviar”, no cenário da arca “soltou” comunica naturalmente que Noé fez a ave sair, sem sugerir abandono definitivo.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: ela não voltou mais
  rationale: A construção negativa com יסף seguido de שׁוּב pode indicar que a pomba não tornou a voltar ou que já não voltou. O pronome feminino concorda naturalmente com “pomba” em português.
- source_word: אֵלָיו
  choice: para ele
  rationale: A preposição indica movimento em direção a Noé; “para ele” mantém explícito o referente pessoal.
- source_word: עוֹד
  choice: mais
  rationale: No fim da oração, עוֹד integra a expressão idiomática negativa “não voltou mais”, preservando a possível nuance de “não tornou a voltar” ou “já não voltou”.
