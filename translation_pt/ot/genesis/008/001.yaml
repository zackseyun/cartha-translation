  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: pt
  text: Mas Deus se lembrou de Noé[a], de todos os animais selvagens e de todos os animais domésticos que estavam com ele na arca. Então Deus fez passar um vento sobre a terra[b], e as águas baixaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus teve Noé em mente”. No hebraico, “lembrou-se” muitas vezes implica agir fielmente em favor de alguém, e não apenas recordar-se.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica רוּחַ pode significar “vento”, “sopro” ou “espírito”. Aqui, “vento” se ajusta melhor ao contexto, embora possa haver uma alusão ao Espírito/vento sobre as águas em Gênesis 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se lembrou
  rationale: Preserva o idioma hebraico e sua força teológica; no contexto, implica atenção fiel expressa em ação, não simples recordação após esquecimento.
- source_word: כָּל הַחַיָּה
  choice: todos os animais selvagens
  rationale: Distingue חַיָּה de בְּהֵמָה, conforme o provável contraste entre animais selvagens e domésticos.
- source_word: כָּל הַבְּהֵמָה
  choice: todos os animais domésticos
  rationale: Expressa de modo claro e internacional a categoria de animais domesticados, em contraste com os selvagens.
- source_word: בַּתֵּבָה
  choice: na arca
  rationale: É a designação consagrada e inequívoca da embarcação de Noé neste contexto.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: fez passar um vento
  rationale: Reflete a forma causativa do verbo עבר e adota o sentido meteorológico de רוּחַ exigido mais diretamente pelo contexto.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Mantém a amplitude do cenário do dilúvio; embora אֶרֶץ também possa significar 'terra firme' ou 'região', 'terra' é natural e preserva a abrangência.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: as águas baixaram
  rationale: Comunica em português corrente que as águas diminuíram ou recuaram, sem recorrer ao menos comum 'amainaram'.
- source_word: וַ
  choice: Mas / Então
  rationale: O primeiro waw marca a virada narrativa do juízo para a ação misericordiosa de Deus; o segundo foi vertido por 'Então' para indicar a progressão do relato sem repetição pesada de conectivos.
theological_decisions:
- issue: Linguagem antropomórfica em 'Deus se lembrou de Noé'
  choice: Manter 'Deus se lembrou de Noé'
  alternative: Deus teve Noé em mente / voltou sua atenção para Noé
  rationale: A formulação conserva o idioma hebraico e sua tensão literária. No contexto bíblico, lembrar-se frequentemente introduz uma ação fiel em favor de alguém, sem afirmar que Deus antes o tivesse esquecido.
- issue: Sentido de רוּחַ no relato do dilúvio
  choice: vento
  alternative: espírito / Espírito
  rationale: O efeito imediato sobre as águas favorece o fenômeno meteorológico. A polissemia do termo e uma possível ressonância com Gênesis 1:2 são preservadas em nota, sem impor essa leitura ao texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. 'Animais domésticos' foi preferido a 'gado' para abranger a categoria sem sugerir apenas bovinos; 'as águas baixaram' é mais corrente do que 'as águas amainaram'.
