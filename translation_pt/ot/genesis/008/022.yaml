  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: pt
  text: Enquanto a terra durar[a], semeadura e colheita, frio e calor, verão e inverno, dia e noite não cessarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “enquanto todos os dias da terra [continuarem]”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Enquanto durarem os dias da terra
  rationale: Reproduz naturalmente a expressão temporal hebraica e preserva a imagem literal dos “dias da terra”, sem transformar a afirmação numa promessa de duração absoluta.
- source_word: זֶרַע
  choice: semeadura
  rationale: No par com קָצִיר, refere-se à atividade ou época de semear, e não apenas à semente como objeto.
- source_word: קָצִיר
  choice: colheita
  rationale: Equivalente corrente e amplamente compreensível para a atividade ou época de colher.
- source_word: קֹר וָחֹם
  choice: frio e calor
  rationale: Mantém o par climático contrastante de modo direto.
- source_word: קַיִץ וָחֹרֶף
  choice: verão e inverno
  rationale: Preserva os termos sazonais usuais; no contexto levantino, também podem corresponder aproximadamente às estações seca e chuvosa.
- source_word: יוֹם וָלַיְלָה
  choice: dia e noite
  rationale: Mantém o par fixo que expressa o ciclo contínuo do tempo.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: não cessarão
  rationale: O verbo שׁבת significa aqui cessar ou parar; aplicado aos ciclos enumerados, “não cessarão” é natural e preciso.
theological_decisions:
- issue: Alcance e duração da promessa sobre os ciclos regulares da criação
  choice: A estabilidade desses ciclos é afirmada durante todos os dias da terra.
  alternative: Os ciclos continuarão para sempre, sem qualquer limitação.
  rationale: A expressão כָּל יְמֵי הָאָרֶץ contém uma delimitação temporal. A tradução a conserva sem definir além do texto quando ou como terminam os “dias da terra”.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Semeadura” é preferível ao menos corrente “tempo de semear”; a sequência de pares e a cadência solene do hebraico foram preservadas.
