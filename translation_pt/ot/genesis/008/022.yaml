review_pass:
  verdict: revise
  source_fidelity: A formula temporal עֹד כָּל־יְמֵי הָאָרֶץ delimita a continuidade dos ciclos à duração da terra. “Enquanto a terra durar” expressa isso de modo idiomático e fiel. Os quatro pares — semeadura e colheita, frio e calor, verão e inverno, dia e noite — e o predicado plural “não cessarão” correspondem bem ao hebraico.
  naturalness: O texto corrente é compreensível, mas “Enquanto durarem os dias da terra” é menos natural em português moderno e torna a nota explicativa imprecisa. “Enquanto a terra durar” tem melhor fluidez e mantém a limitação temporal do original.
  terminology: “Semeadura e colheita”, “frio e calor”, “verão e inverno” e “dia e noite” são equivalentes claros, estabelecidos e apropriados ao registro do versículo.
  issues:
