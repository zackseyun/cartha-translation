    issue: Formulação temporal e nota literal pouco precisas
    rationale: A tradução atual, “Enquanto durarem os dias da terra”, é possível, mas soa marcada. Além disso, a nota “Literalmente, ‘ainda, todos os dias da terra’” trata עֹד como se fosse um equivalente lexical isolado de “ainda”, quando, nesta construção, ele contribui para o sentido temporal. Uma tradução principal mais idiomática, com nota para a expressão literal, resolve ambos os pontos.
  revised_text: Enquanto a terra durar[a], semeadura e colheita, frio e calor, verão e inverno, dia e noite não cessarão.
