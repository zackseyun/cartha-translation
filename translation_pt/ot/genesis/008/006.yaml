  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: pt
  text: Ao fim de quarenta dias[a][b], Noé abriu a janela da arca que havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de quarenta dias”. A expressão hebraica מִקֵּץ pode ser traduzida como “ao fim de” ou, de modo mais idiomático neste contexto temporal, “depois de”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E aconteceu que, ao fim de quarenta dias, Noé abriu a janela da arca que havia feito”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: '[omitido como fórmula explícita; expresso pela sequência narrativa]'
  rationale: A fórmula narrativa hebraica introduz o acontecimento seguinte. Em português atual, a oração temporal seguida diretamente da ação comunica essa sequência com mais naturalidade; a forma mais explícita é preservada em nota.
- source_word: מִקֵּץ
  choice: ao fim de
  rationale: A expressão marca o ponto alcançado quando se completa determinado período. “Ao fim de” mantém esse valor temporal e também deixa aberta, em nota, a alternativa idiomática “depois de”.
- source_word: אַרְבָּעִים יוֹם
  choice: quarenta dias
  rationale: Equivalente direto e idiomático da construção cardinal com o substantivo “dia”.
- source_word: וַיִּפְתַּח
  choice: abriu
  rationale: O verbo פתח indica abrir; “abriu” é a forma simples e adequada ao contexto.
- source_word: חַלּוֹן
  choice: janela
  rationale: O substantivo normalmente designa uma janela ou abertura semelhante; “janela” é o sentido convencional e provável neste contexto.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: Em Gênesis 6–9, תֵּבָה designa convencionalmente a arca de Noé; “arca” é a tradução consagrada e clara.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia feito
  rationale: A oração relativa modifica “arca”. O mais-que-perfeito composto esclarece naturalmente que sua construção antecedeu a abertura da janela.
