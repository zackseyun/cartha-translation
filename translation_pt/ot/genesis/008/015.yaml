lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência com naturalidade, e “falou” representa diretamente o verbo דבר.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o termo designa o único Deus e é naturalmente traduzido por “Deus”.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; em português, “falar a alguém” é uma construção clara e digna.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português atual, os dois-pontos desempenham essa função de modo natural, evitando o hebraísmo pouco idiomático “dizendo” antes de uma citação.
