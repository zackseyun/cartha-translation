  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: pt
  text: Saia da arca, junto com sua esposa, seus filhos e as esposas de seus filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Saia
  rationale: Imperativo masculino singular de יצא. Em português, “saia” expressa de modo direto e natural a ordem de deixar o interior da arca.
- source_word: מִן הַתֵּבָה
  choice: da arca
  rationale: A preposição מן indica movimento para fora; “sair da arca” é a construção idiomática natural em português. תֵּבָה é traduzido tradicional e adequadamente por “arca”.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente explicita e pode realçar o destinatário após o imperativo. “Você” oferece leitura ampla e natural no português moderno, preservando sua presença na enumeração.
- source_word: וְאִשְׁתְּךָ
  choice: sua mulher
  rationale: No contexto possessivo, אִשָּׁה significa a esposa de Noé. “Sua mulher” é corrente, dignificado e próximo da expressão hebraica.
- source_word: וּבָנֶיךָ
  choice: seus filhos
  rationale: בָּנִים designa especificamente os filhos homens neste contexto, como confirma a referência subsequente às mulheres deles.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: as mulheres de seus filhos
  rationale: Reproduz de perto a construção hebraica, literalmente “as mulheres de seus filhos”, sem substituí-la pelo termo relacional “noras”.
- source_word: אִתָּךְ
  choice: com você
  rationale: 'A expressão marca acompanhamento: a família deve sair juntamente com Noé.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém a enumeração e a proximidade estrutural com o hebraico sem sacrificar a naturalidade.
