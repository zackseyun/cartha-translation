  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: pt
  text: 'E o SENHOR sentiu o aroma agradável e disse consigo mesmo: “Nunca mais amaldiçoarei o solo por causa do ser humano, pois a inclinação do coração humano é má desde a juventude. E nunca mais ferirei todos os seres vivos, como fiz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino segundo a convenção portuguesa amplamente reconhecida, sem inserir uma vocalização disputada no texto principal.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: o aroma agradável
  rationale: Expressa naturalmente a ideia de um aroma aprazível ou aceitável, preservando a linguagem sensorial do hebraico.
- source_word: אֶל־לִבּוֹ
  choice: consigo mesmo
  rationale: Comunica em português corrente o sentido idiomático de falar no próprio coração, isto é, interiormente.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: a inclinação do coração humano
  rationale: יֵצֶר indica formação, impulso ou inclinação; a escolha preserva a dimensão interior sem reduzir a expressão apenas a pensamentos ou intenções conscientes.
- source_word: מִנְּעֻרָיו
  choice: desde a juventude
  rationale: Tradução direta que mantém a referência temporal sem especificar uma idade não indicada pelo texto.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: ferirei todos os seres vivos
  rationale: Mantém o verbo amplo 'ferir/golpear' e a abrangência de כָּל־חַי, sem explicitar morte onde o hebraico não o faz lexicalmente.
theological_decisions:
- issue: Relação causal expressa por כִּי
  choice: pois a inclinação do coração humano é má desde a juventude
  alternative: embora a inclinação do coração humano seja má desde a juventude
  rationale: O hebraico כִּי normalmente introduz aqui uma razão ('pois/porque'). A tensão de a condição humana fundamentar a promessa, em vez de nova punição, deve permanecer sem ser reinterpretada como concessão.
- issue: Antropomorfismo de Deus sentindo o aroma
  choice: o SENHOR sentiu o aroma agradável
  alternative: o SENHOR aceitou o sacrifício
  rationale: Preserva a imagem concreta do texto e não substitui a ação narrada por uma interpretação teológica.
- issue: Interioridade divina em אֶל־לִבּוֹ
  choice: disse consigo mesmo
  alternative: disse em seu coração
  rationale: Reproduz o sentido idiomático em linguagem natural, sem sugerir que a declaração tenha sido dirigida a Noé.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por 'ser humano/humano' para o valor coletivo de אָדָם. A repetição de 'nunca mais' e a coordenação das duas promessas foram mantidas. 'Solo' distingue אֲדָמָה de אָדָם e conserva o vínculo vocabular perceptível no hebraico apenas parcialmente, sem formulação artificial.
