  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: pt
  text: E as águas continuaram baixando até o décimo mês. No décimo mês, no primeiro dia do mês, os cumes dos montes se tornaram visíveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram vistos” ou “apareceram”. O verbo hebraico permite essas traduções mais formais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: as águas
  rationale: O plural português é natural no contexto do dilúvio e preserva o sentido coletivo do hebraico מַיִם.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: continuaram baixando
  rationale: A construção com היה e formas infinitivas expressa uma ação progressiva e contínua; “continuaram baixando” comunica com naturalidade a diminuição do nível das águas.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: até o décimo mês
  rationale: חֹדֶשׁ designa normalmente um mês na marcação narrativa do tempo.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: No décimo mês, no primeiro dia do mês
  rationale: Explicita em português corrente a data expressa de modo elíptico no hebraico, sem alterar sua estrutura temporal.
- source_word: נִרְאוּ
  choice: se tornaram visíveis
  rationale: O nifal de ראה admite valor passivo ou incoativo; esta formulação comunica que os cumes passaram a estar à vista à medida que as águas baixavam, sem indicar um observador específico.
- source_word: רָאשֵׁי הֶהָרִים
  choice: os cumes dos montes
  rationale: רֹאשׁ significa literalmente “cabeça”, mas em contexto topográfico refere-se às partes mais altas; “cumes dos montes” é natural, digno e próximo da imagem hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “décimo mês” e “mês” foi mantida por refletir a fórmula cronológica do hebraico. O marcador da nota foi colocado após a expressão a que se refere.
