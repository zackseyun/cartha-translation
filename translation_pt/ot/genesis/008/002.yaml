  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: pt
  text: As fontes do abismo e as janelas dos céus[a] foram fechadas, e a chuva dos céus foi contida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as comportas dos céus”. O hebraico se refere literalmente a aberturas ou janelas no céu.
    reason: lexical_alternative
  - marker: b
    text: Ou “a chuva dos céus cessou”. O verbo hebraico pode enfatizar que a chuva foi retida, tendo como resultado sua cessação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: foram fechadas
  rationale: O nifal indica que as fontes e as janelas foram fechadas ou obstruídas; a forma passiva preserva a construção hebraica e se aplica naturalmente aos dois sujeitos.
- source_word: מַעְיְנֹת תְּהוֹם
  choice: as fontes das profundezas
  rationale: “Fontes” comunica origens ou nascentes de água; “profundezas” preserva a imagem da grande massa aquosa profunda e mantém a ligação com Gênesis 1:2.
- source_word: אֲרֻבֹּת הַשָּׁמַיִם
  choice: as janelas dos céus
  rationale: “Janelas” traduz de perto as aberturas evocadas pelo hebraico, enquanto “dos céus” conserva a linguagem cosmológica e o plural da expressão.
- source_word: וַיִּכָּלֵא
  choice: foi contida
  rationale: A forma verbal apresenta a chuva como retida ou impedida de continuar; “foi contida” preserva essa nuance melhor do que simplesmente “cessou”.
- source_word: הַגֶּשֶׁם מִן הַשָּׁמָיִם
  choice: a chuva dos céus
  rationale: Tradução natural que mantém a repetição de “céus” presente no hebraico e evita reduzir a imagem a mera referência meteorológica.
