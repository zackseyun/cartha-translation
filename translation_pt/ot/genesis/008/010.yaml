  text: וַ/יָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יֹּ֛סֶף שַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מִן הַ/תֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: pt
  text: Então esperou mais sete dias[a] e tornou a soltar a pomba para fora da arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então começou outro período de sete dias»; o verbo hebraico pode significar mais literalmente «começou», mas neste contexto funciona de modo idiomático com o sentido de «esperou».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: esperou
  rationale: Embora o verbo possa ter o sentido mais literal de «começou», com uma expressão de duração ele é melhor entendido idiomaticamente como «esperou».
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: mais sete dias
  rationale: עוֹד e אֲחֵרִים indicam em conjunto um período adicional; «mais sete dias» é natural e evita a redundância de «outros sete dias adicionais».
- source_word: וַיֹּסֶף שַׁלַּח
  choice: tornou a soltar
  rationale: A construção expressa a repetição da ação. «Tornou a» preserva essa ideia, enquanto «soltar» descreve naturalmente o envio da ave para fora da arca.
- source_word: הַיּוֹנָה
  choice: a pomba
  rationale: O artigo definido retoma a pomba já mencionada na narrativa.
- source_word: מִן הַתֵּבָה
  choice: para fora da arca
  rationale: A preposição marca a procedência, e «para fora da arca» explicita de modo natural a direção implícita da ação de soltar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «tornou a soltar» conserva a repetição marcada no hebraico sem sobrecarregar o verso com dois advérbios equivalentes.
