  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: pt
  text: Multiplicarei a sua descendência como as estrelas dos céus e darei à sua descendência todas estas terras; e, em sua descendência, todas as nações da terra serão abençoadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de sua descendência, todas as nações da terra abençoarão a si mesmas”. A forma do verbo hebraico pode ser entendida em sentido reflexivo, embora o sentido passivo se ajuste bem ao contexto da promessa da aliança.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Multiplicarei
  rationale: O hifil de רבה expressa aumento causativo. “Multiplicarei” é direto, natural no contexto das promessas da aliança e mantém Deus como agente.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: זֶרַע é um coletivo singular que pode abranger a linhagem como um todo. “Descendência” preserva essa coletividade e soa natural em português atual.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: como as estrelas dos céus
  rationale: Mantém a comparação explícita e o plural hebraico שָׁמַיִם, com linguagem elevada sem deixar de ser compreensível.
- source_word: וְנָתַתִּי
  choice: e darei
  rationale: נתן significa normalmente “dar”; a opção conserva a simplicidade e a força direta da promessa.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: Repete de modo coerente a tradução de זֶרַע e reproduz o destinatário da concessão territorial.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: todas estas terras
  rationale: “Terras” corresponde ao plural territorial de אֶרֶץ, enquanto “estas” preserva o valor dêitico de הָאֵל.
- source_word: וְהִתְבָּרֲכוּ
  choice: serão abençoadas
  rationale: A leitura passiva é adequada ao contexto da promessa patriarcal, mas a possível leitura reflexiva é preservada em nota.
- source_word: בְזַרְעֲךָ
  choice: em sua descendência
  rationale: “Em” reproduz de perto a preposição בְּ e evita decidir silenciosamente entre nuances locativa, relacional e instrumental.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: todas as nações da terra
  rationale: “Nações” é a equivalência corrente de גּוֹיִם neste contexto coletivo, e “da terra” preserva a abrangência universal da expressão.
theological_decisions:
- issue: Sentido da fórmula וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: em sua descendência, todas as nações da terra serão abençoadas
  alternative: por meio de sua descendência, todas as nações da terra abençoarão a si mesmas
  rationale: O passivo se harmoniza bem com o contexto da promessa da aliança, no qual a bênção procede de Deus. Contudo, a forma verbal admite análise reflexiva; por isso, essa possibilidade não é eliminada, mas registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o tom solene da promessa sem arcaísmos. O pronome “sua” segue a referência dirigida a Isaque no contexto imediato.
