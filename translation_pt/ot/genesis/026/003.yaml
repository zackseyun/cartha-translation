  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: pt
  text: More nesta terra[a], e eu estarei com você e o abençoarei, pois darei a você e à sua descendência[b] todas estas terras e confirmarei[c] o juramento que fiz a Abraão, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Viva como estrangeiro nesta terra”. O verbo hebraico pode indicar residência temporária ou a condição de forasteiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “semente”; aqui, o termo tem sentido coletivo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estabelecerei” ou “cumprirei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: More
  rationale: O verbo indica residir como forasteiro ou residente temporário. “More” é natural e digno em português; a nuance de permanência temporária é preservada em nota.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” preserva o sentido geográfico ligado à promessa e a correspondência lexical com o plural posterior.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: e eu estarei com você
  rationale: Mantém diretamente a fórmula de presença divina, em linguagem moderna e amplamente compreensível.
- source_word: וַאֲבָרְכֶךָ
  choice: e o abençoarei
  rationale: Explicita naturalmente em português o sujeito e o objeto da promessa divina.
- source_word: כִּי
  choice: pois
  rationale: Expressa a força explicativa da conjunção sem tornar a relação lógica excessivamente rígida.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: a você e à sua descendência
  rationale: “Descendência” funciona como coletivo e evita que o singular literal “semente” seja entendido de modo indevidamente restrito no português corrente.
- source_word: אֶתֵּן
  choice: darei
  rationale: Tradução direta da promessa futura.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: todas estas terras
  rationale: Preserva o plural territorial e a ligação lexical com “terra” na primeira oração.
- source_word: וַהֲקִמֹתִי
  choice: confirmarei
  rationale: No contexto de um juramento já feito, o Hifil de קום comunica fazer permanecer válido, ratificar ou confirmar. A alternativa mais formal “estabelecerei” é registrada em nota.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: o juramento que fiz
  rationale: “Fazer um juramento” é a formulação idiomática em português e preserva a solenidade do ato sem a redundância pouco natural de “jurei o juramento”.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: a Abraão, seu pai
  rationale: Identifica Abraão como pai de Isaque e preserva a continuidade da promessa.
theological_decisions:
- issue: Formulação da continuidade do juramento divino
  choice: confirmarei o juramento que fiz a Abraão
  alternative: estabelecerei ou cumprirei o juramento que fiz a Abraão
  rationale: “Confirmarei” comunica que Deus fará permanecer válido o juramento anterior sem acrescentar terminologia técnica de renovação da aliança. A nota conserva a amplitude lexical do verbo.
- issue: Sentido coletivo de זֶרַע
  choice: sua descendência
  alternative: sua semente
  rationale: No contexto imediato, o referente é coletivamente a linhagem de Isaque. A nota preserva a forma literal “semente”, evitando eliminar a possível relevância canônica do singular lexical.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas amplamente compreensíveis no Brasil e internacionalmente. A redação conserva a solenidade da promessa divina sem arcaísmos desnecessários; as ambiguidades lexicais relevantes são mantidas em notas.
