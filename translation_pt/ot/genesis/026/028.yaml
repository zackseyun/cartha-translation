  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: pt
  text: 'E eles disseram: “Vimos claramente que Yahweh tem estado com você. Por isso dissemos: ‘Que haja, por favor, um juramento[a] entre nós — entre você e nós — e façamos uma aliança com você.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “um juramento de maldição”, pois o termo hebraico pode designar um juramento acompanhado de uma maldição invocada contra quem o violasse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém o avanço narrativo marcado pelo waw consecutivo sem impor uma sequência temporal mais específica.
- source_word: רָאוֹ רָאִינוּ
  choice: Vimos claramente
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação; “claramente” comunica essa ênfase em português natural.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: que Yahweh tem estado com você
  rationale: O perfeito hebraico descreve uma realidade passada com relevância presente; o pretérito perfeito composto preserva essa continuidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַנֹּאמֶר
  choice: Por isso dissemos
  rationale: Explicita de modo natural a relação inferencial entre a constatação da presença de Yahweh e a proposta que se segue.
- source_word: תְּהִי נָא
  choice: Que haja, por favor
  rationale: Preserva tanto a força volitiva do jussivo quanto o tom cortês da partícula נָא.
- source_word: אָלָה
  choice: um juramento
  rationale: É a tradução mais clara no contexto de tratado, enquanto a possível ideia de maldição invocada fica registrada em nota.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: entre nós — entre você e nós
  rationale: Conserva a repetição formal e enfática do hebraico, usando travessões para tornar a aposição clara e natural.
- source_word: וְנִכְרְתָה בְרִית
  choice: e façamos uma aliança
  rationale: Traduz naturalmente a expressão idiomática hebraica que, literalmente, significa “cortar uma aliança”.
- source_word: עִמָּךְ
  choice: com você
  rationale: Reproduz o pronome singular dirigido pessoalmente a Isaque em português amplamente compreensível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar uma vocalização tradicional posterior.
- issue: Força de אָלָה
  choice: juramento no texto, com nota sobre a possível dimensão de maldição
  alternative: juramento de maldição
  rationale: A palavra pode incluir uma maldição invocada em caso de violação, mas o contexto não exige que essa força seja explicitada no corpo do texto; a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A repetição formal do hebraico foi preservada de maneira inteligível por meio de travessões; “você” mantém a referência singular a Isaque.
