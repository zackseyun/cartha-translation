base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: pt
  text: 'Então Yahweh apareceu a ele e disse[a]: “Não desça ao Egito. Habite na terra que eu lhe disser.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Permaneça na terra que eu lhe disser.” “Que eu lhe disser” preserva mais literalmente a formulação hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação perceptível. “Apareceu” é natural em português e não especifica indevidamente a forma da manifestação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אַל תֵּרֵד
  choice: Não desça
  rationale: אַל com o imperfeito expressa proibição. “Descer ao Egito” conserva a imagem geográfica e o modo bíblico de descrever essa viagem, sem deixar de ser compreensível em português.
- source_word: מִצְרָיְמָה
  choice: ao Egito
  rationale: A terminação direcional indica movimento em direção ao Egito; “ao Egito” é a formulação idiomática em português.
- source_word: שְׁכֹן
  choice: Habite
  rationale: O imperativo de שכן pede residência ou permanência no lugar. “Habite” conserva esse sentido com linguagem digna e corrente.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ designa aqui uma terra ou território específico, não o planeta; “na terra” mantém a terminologia contextual e bíblica.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: que eu lhe indicar
  rationale: A expressão hebraica é literalmente “que eu lhe disser”. No contexto, refere-se à orientação divina sobre onde Isaque deve habitar; “indicar” comunica isso com naturalidade, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “desça ao Egito” preserva a imagem do hebraico; “habite” mantém o sentido de residência, e “lhe indicar” torna natural a orientação futura sem eliminar a alternativa literal, registrada em nota.
