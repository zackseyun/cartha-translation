  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: pt
  text: Então Isaque preparou um banquete para eles[a], e eles comeram e beberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festa”; o termo hebraico pode designar uma refeição festiva em que a bebida tem papel de destaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: preparou
  rationale: Embora עשה tenha o sentido básico de “fazer”, com מִשְׁתֶּה indica de modo idiomático a preparação ou realização de um banquete.
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição ל marca aqui os beneficiários da ação; “para eles” é natural em português.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: O substantivo designa uma refeição festiva na qual a bebida pode ter papel destacado. “Banquete” é claro e natural, e a menção seguinte a comer e beber conserva plenamente o sentido contextual.
- source_word: וַיֹּאכְלוּ
  choice: e eles comeram
  rationale: Tradução direta de אכל, mantendo a sequência narrativa e o sujeito plural explícito para clareza.
- source_word: וַיִּשְׁתּוּ
  choice: e beberam
  rationale: Tradução direta de שתה; a omissão do sujeito repetido é natural em português e preserva a coordenação das ações.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O nome “Isaque” explicita o sujeito indicado pelo contexto imediato, evitando ambiguidade pouco natural em um versículo isolado.
