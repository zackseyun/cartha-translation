base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: pt
  text: 'Ele partiu dali e cavou outro poço, e não discutiram por causa dele. Por isso, deu-lhe o nome de Reobote[a] e disse: “Agora Yahweh abriu espaço para nós, e seremos fecundos na terra”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Reobote soa como a palavra hebraica para “lugares amplos” ou “espaços abertos”; a explicação de Isaque faz um jogo com esse sentido: “Yahweh abriu espaço para nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Ele partiu dali
  rationale: O verbo עתק indica que Isaque se afastou daquele local. “Partiu dali” é natural em português e não especifica indevidamente a forma da mudança.
- source_word: בְּאֵר אַחֶרֶת
  choice: outro poço
  rationale: Equivalente direto e idiomático da expressão hebraica.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: não discutiram por causa dele
  rationale: ריב denota contenda ou disputa; a formulação mantém o poço como motivo do conflito e soa natural em português.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: deu-lhe o nome de Reobote
  rationale: Reproduz de modo claro a fórmula hebraica de nomeação, tratando Reobote como nome próprio.
- source_word: רְחֹבוֹת
  choice: Reobote
  rationale: Transliteração portuguesa reconhecível do topônimo hebraico; seu sentido e o jogo de palavras são explicados em nota.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Agora Yahweh abriu espaço para nós
  rationale: “Abriu espaço” expressa o causativo de רחב e preserva, tanto quanto possível, o jogo de palavras com Reobote.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino presente no texto hebraico, sem substituí-lo por um título.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: e seremos fecundos na terra
  rationale: “Seremos fecundos” preserva o sentido lexical de פרה e sua possível ressonância com a linguagem de bênção e multiplicação; “na terra” mantém o referente territorial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. A forma “Yahweh” preserva o nome próprio e evita convertê-lo em título.
- issue: Sentido de וּפָרִינוּ
  choice: seremos fecundos
  alternative: prosperaremos; nos multiplicaremos
  rationale: A opção conserva a imagem de fecundidade do verbo פרה e não reduz sua possível dimensão de bênção à prosperidade material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa hebraica foi mantida sem rigidez, e o jogo de palavras do topônimo foi preservado por meio de nota.
