base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: pt
  text: Então Isaque tornou a cavar[a] os poços de água que haviam sido cavados nos dias de Abraão, seu pai, e que os filisteus haviam entulhado depois da morte de Abraão. E deu-lhes os mesmos nomes que seu pai lhes havia dado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente, «voltou e cavou». O verbo hebraico pode indicar explicitamente voltar, mas aqui provavelmente marca a repetição da ação: «tornou a cavar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: tornou a cavar
  rationale: A construção com שוב seguido de outro verbo expressa naturalmente a retomada da ação. Em português, «tornou a cavar» preserva tanto a noção de repetição quanto a forma verbal do hebraico, sem sugerir necessariamente um deslocamento físico.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: os poços de água
  rationale: Mantém a expressão hebraica e sua ênfase nas fontes de água, em formulação clara e natural em português.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: que haviam sido cavados nos dias de Abraão, seu pai
  rationale: A voz passiva traduz naturalmente o sujeito plural não especificado do hebraico. «Nos dias de» preserva o idioma temporal da fonte.
- source_word: וַיְסַתְּמוּם
  choice: haviam entulhado
  rationale: No contexto de poços, «entulhar» comunica de modo preciso que os filisteus os obstruíram ou encheram, sem acrescentar material específico.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa tradicional e amplamente reconhecida para o povo mencionado.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: depois da morte de Abraão
  rationale: Tradução direta e natural da relação temporal expressa no hebraico.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: deu-lhes os mesmos nomes que seu pai lhes havia dado
  rationale: «Deu-lhes ... nomes» expressa idiomaticamente o ato de nomear, enquanto «os mesmos» torna clara a correspondência indicada por כַּ entre os nomes usados por Isaque e os anteriormente dados por seu pai.
