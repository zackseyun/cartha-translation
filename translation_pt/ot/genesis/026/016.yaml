  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: pt
  text: 'Então Abimeleque disse a Isaque: “Vá embora do nosso meio, porque você se tornou muito mais poderoso do que nós[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você se tornou muito mais forte do que nós”.'
    reason: Alternativa lexical que traduz עָצַם em termos de força, preservando a comparação intensificada.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... disse” expressa a sequência com naturalidade no português atual.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל יִצְחָק
  choice: a Isaque
  rationale: A preposição introduz o destinatário da fala; “Isaque” é a forma tradicional do nome em português.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Vá embora do nosso meio
  rationale: O imperativo e a expressão de separação significam sair de junto do grupo. A formulação preserva a referência explícita a “nós” e soa natural em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da ordem de Abimeleque; “porque” é claro e contemporâneo, sem acrescentar peso estilístico ausente no hebraico.
- source_word: עָצַמְתָּ
  choice: você se tornou ... poderoso
  rationale: O verbo indica tornar-se forte, poderoso ou influente. “Poderoso” abrange adequadamente a força econômica e social sugerida pelo contexto.
- source_word: מִמֶּנּוּ מְאֹד
  choice: muito mais ... do que nós
  rationale: A preposição מן tem sentido comparativo, e מְאֹד intensifica a comparação. A construção portuguesa explicita naturalmente essa relação.
