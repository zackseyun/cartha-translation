  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: pt
  text: E chamou aquele poço de Sibá[a]. Por isso, o nome da cidade é Berseba até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sibá soa como a palavra hebraica para “sete” e participa do jogo de palavras ligado a Berseba, nome que pode ser entendido como “Poço dos Sete” ou “Poço do Juramento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: E chamou aquele poço de
  rationale: O verbo קרא, com objeto direto em contexto de nomeação, significa “chamar” ou “dar nome”. O referente feminino é o poço mencionado no contexto; explicitar “aquele poço” evita a ambiguidade pronominal e soa natural em português.
- source_word: שִׁבְעָה
  choice: Sibá
  rationale: A forma é mantida como nome próprio transliterado, em vez de ser reduzida a “Sete” ou “Juramento”; o jogo de palavras hebraico é explicado na nota.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo claro e corrente a conclusão explicativa introduzida pela locução hebraica.
- source_word: שֵׁם הָעִיר
  choice: o nome da cidade
  rationale: Reprodução direta e natural da construção hebraica.
- source_word: בְּאֵר שֶׁבַע
  choice: Berseba
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o topônimo, preservando em nota seus sentidos possíveis no hebraico.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente idiomático corrente da expressão temporal hebraica, apropriado ao registro narrativo.
