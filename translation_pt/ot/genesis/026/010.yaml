base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: pt
  text: 'Então Abimeleque disse: “O que é isso que você fez conosco? Por pouco[a], alguém do povo teria se deitado com a sua mulher, e você teria trazido culpa sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Facilmente alguém do povo poderia ter se deitado com a sua mulher.”'
    reason: Alternativa lexical e sintática para כִּמְעַט, que pode ser entendida aqui como indicação do risco imediato, e não apenas como uma ação que quase ocorreu.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: Então Abimeleque disse
  rationale: Expressa com naturalidade a progressão narrativa do wayyiqtol, sem acrescentar uma relação temporal forte.
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: O que é isso que você fez conosco?
  rationale: Conserva a construção exclamativa hebraica e o objeto comunitário לָּנוּ, em português atual e compreensível.
- source_word: כִּמְעַט
  choice: Por pouco
  rationale: Preserva o sentido primário de uma ocorrência que quase se concretizou. A nota registra a leitura modal possível, refletida na camada inglesa consultada.
- source_word: אַחַד הָעָם
  choice: alguém do povo
  rationale: Comunica o singular indefinido dentro do coletivo sem restringir explicitamente הָעָם a “homens”; o contexto identifica naturalmente a pessoa em vista.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: teria se deitado com a sua mulher
  rationale: Mantém, de modo digno e claro, o conhecido eufemismo hebraico para relações sexuais.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: e você teria trazido culpa sobre nós
  rationale: Representa אָשָׁם como culpa ou responsabilidade moral incorrida, e não apenas censura social.
theological_decisions:
- issue: Natureza de אָשָׁם neste contexto
  choice: culpa
  alternative: censura; delito
  rationale: O contexto trata da culpabilidade coletiva que teria resultado do ato, não somente de dano à reputação. “Culpa” preserva a força moral e religiosa sem introduzir no texto principal a acepção sacrificial posterior.
- issue: Força de כִּמְעַט
  choice: por pouco, alguém teria se deitado
  alternative: alguém poderia facilmente ter se deitado
  rationale: O advérbio normalmente exprime uma ação que quase ocorreu, mas a formulação contextual também pode destacar a facilidade ou o risco de ela ocorrer. A tradução principal mantém o valor de quase ocorrência, e a nota preserva a alternativa modal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” conforme o uso brasileiro corrente, mantém o eufemismo sexual do hebraico e evita terminologia denominacional.
