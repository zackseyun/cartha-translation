- from: Isaque semeou naquela terra e, naquele ano, colheu cem vezes mais[a]. E Yahweh o abençoou.
  to: Isaque semeou naquela terra e, naquele ano, obteve cem por um[a]; e Yahweh o abençoou.
  rationale: A revisão substitui duas formulações interpretativamente mais fortes por equivalentes que preservam melhor a abertura lexical do hebraico e exprimem com precisão natural o rendimento agrícola. Não altera o sentido geral nem a atribuição explícita da bênção a Yahweh.
