  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: pt
  text: Isaque semeou naquela terra e, naquele ano, obteve cem por um[a]; e Yahweh o abençoou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “encontrou cem medidas”. A expressão hebraica indica uma produção excepcionalmente abundante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: semeou
  rationale: No contexto agrícola, זרע significa semear; a escolha preserva diretamente a imagem do plantio de sementes.
- source_word: בָּאָרֶץ הַהִוא
  choice: naquela terra
  rationale: אֶרֶץ pode designar terra ou país; aqui, “terra” corresponde naturalmente ao cenário territorial imediato sem sugerir uma entidade política.
- source_word: וַיִּמְצָא
  choice: colheu
  rationale: Embora מצא signifique basicamente “encontrar”, neste contexto agrícola indica o resultado obtido da semeadura. “Colheu” comunica de modo natural esse sentido contextual.
- source_word: בַּשָּׁנָה הַהִוא
  choice: naquele ano
  rationale: Tradução direta e natural da expressão temporal hebraica.
- source_word: מֵאָה שְׁעָרִים
  choice: cem vezes mais
  rationale: A expressão hebraica descreve uma produção excepcional, tradicionalmente entendida como rendimento de cem por um; esta formulação é clara em português sem impor uma unidade antiga específica.
- source_word: וַיְבָרֲכֵהוּ
  choice: o abençoou
  rationale: ברך é o verbo comum para “abençoar”; a escolha preserva a atribuição explícita da prosperidade à bênção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título.
- issue: Expressão do resultado agrícola de Isaque
  choice: colheu cem vezes mais
  alternative: encontrou cem medidas; obteve cem por um
  rationale: O verbo hebraico é literalmente “encontrou”, mas a construção é idiomática no contexto da produção agrícola. “Colheu” torna o sentido claro, enquanto a nota registra a forma e a ambiguidade lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação foi dividida em duas frases para evitar uma sequência pesada de conjunções, sem alterar as relações do hebraico.
