base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: pt
  text: Todos os poços que os servos[a] de seu pai haviam cavado nos dias de Abraão, seu pai, os filisteus os entupiram e encheram de terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os escravos”. O termo hebraico pode designar tanto um servo quanto um escravo; neste contexto, a condição jurídica deles não é enfatizada.
    reason: lexical_alternative
  - marker: b
    text: Ou “pó” ou “solo”. A palavra hebraica pode designar terra solta, pó, poeira ou solo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Todos os poços
  rationale: כָל mantém o sentido totalizante de “todos”, e בְּאֵרֹת designa diretamente poços. O וְ liga o versículo à narrativa anterior, mas não exige uma conjunção inicial em português quando a continuidade já está clara.
- source_word: אֲשֶׁר חָפְרוּ
  choice: que ... haviam cavado
  rationale: A oração relativa modifica “poços”; o mais-que-perfeito composto deixa clara a anterioridade da escavação em relação à ação dos filisteus.
- source_word: עַבְדֵי אָבִיו
  choice: os servos de seu pai
  rationale: עֶבֶד pode designar servo ou escravo. Como o contexto não destaca especificamente a condição jurídica, “servos” preserva o sentido sem resolver além do necessário a ambiguidade lexical.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: nos dias de Abraão, seu pai
  rationale: Conserva o idioma temporal hebraico e a identificação filial repetida no texto-fonte.
- source_word: סִתְּמוּם
  choice: os entupiram
  rationale: O verbo descreve o bloqueio ou fechamento dos poços; “entupiram” é concreto, claro e idiomático em português.
- source_word: וַיְמַלְאוּם עָפָר
  choice: e encheram de terra
  rationale: O sufixo verbal retoma os poços; em português, o objeto já expresso em “os entupiram” pode permanecer implícito no segundo verbo. עָפָר, neste contexto, refere-se a terra solta, solo, pó ou poeira.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa tradicional e amplamente reconhecida para o nome desse povo.
