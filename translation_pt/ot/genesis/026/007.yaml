translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A mudança repentina da narração em terceira pessoa para o pensamento em primeira pessoa foi explicitada por “pensando”, preservando o conteúdo e evitando uma transição confusa. Não foram necessárias notas textuais ou teológicas.
