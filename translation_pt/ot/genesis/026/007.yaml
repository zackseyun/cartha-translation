base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: pt
  text: 'Quando os homens daquele lugar perguntaram a respeito de sua mulher, ele disse: “Ela é minha irmã”, pois tinha medo de dizer: “Ela é minha mulher, para que os homens daquele lugar não me matem por causa de Rebeca, pois ela é bela de aparência.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: perguntaram
  rationale: O qal de שׁאל descreve uma pergunta direta; “perguntaram” é corrente e natural.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: os homens daquele lugar
  rationale: Preserva a referência masculina de אַנְשֵׁי e expressa de modo natural o contexto local já mencionado.
- source_word: לְאִשְׁתּוֹ
  choice: sobre sua mulher
  rationale: A preposição לְ com שׁאל indica o assunto da pergunta. “Mulher” conserva aqui o sentido conjugal de אִשָּׁה no português bíblico atual.
- source_word: אֲחֹתִי הִוא
  choice: Ela é minha irmã
  rationale: Reproduz a identificação predicativa em ordem natural no português.
- source_word: כִּי יָרֵא לֵאמֹר
  choice: Pois teve medo de dizer
  rationale: כִּי apresenta a razão da resposta, e יָרֵא com o infinitivo indica aquilo que Isaque receava dizer.
- source_word: פֶּן יַהַרְגֻנִי
  choice: poderiam me matar
  rationale: פֶּן introduz uma consequência temida. A formulação com “poderiam” transmite esse receio com clareza, sem recorrer ao mais formal “para que não”.
- source_word: עַל רִבְקָה
  choice: por causa de Rebeca
  rationale: עַל marca aqui a causa ou ocasião da possível morte.
- source_word: טוֹבַת מַרְאֶה
  choice: bonita
  rationale: A expressão significa literalmente que ela era agradável ou bela de aparência; “bonita” comunica isso naturalmente sem redundância.
