  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: pt
  text: Levantaram-se cedo pela manhã e prestaram juramento um ao outro[a]. Depois, Isaque os despediu, e eles partiram da presença dele em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cada homem a seu irmão”, expressão que aqui indica que prestaram juramento mutuamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Levantaram-se de madrugada
  rationale: A forma hifil de שׁכם indica levantar-se cedo; com בַבֹּקֶר, a expressão portuguesa “de madrugada” comunica de modo natural que se levantaram bem cedo pela manhã.
- source_word: וַיִּשָּׁבְעוּ
  choice: prestaram juramento
  rationale: O nifal de שׁבע significa jurar ou prestar juramento. A formulação mantém o caráter formal do acordo sem acrescentar conteúdo não expresso.
- source_word: אִישׁ לְאָחִיו
  choice: um ao outro
  rationale: Literalmente, “um homem ao seu irmão”; neste contexto, a expressão idiomática indica reciprocidade entre os participantes do juramento. A tradução natural é acompanhada de nota que preserva a forma hebraica.
- source_word: וַיְשַׁלְּחֵם
  choice: Isaque os despediu
  rationale: O piel de שׁלח com sufixo de objeto indica que Isaque os mandou embora ou lhes deu licença para partir; “os despediu” é conciso e adequado ao contexto pacífico.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: eles partiram da presença dele
  rationale: הלך com מֵאֵת descreve afastamento da presença de alguém. A escolha preserva a relação espacial do hebraico em português claro.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: שָׁלוֹם pode abranger tanto segurança quanto relações pacíficas. “Em paz” conserva essa amplitude no contexto da reconciliação.
