  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: pt
  text: Então, cavaram outro poço e também disputaram por causa dele. Por isso, ele lhe deu o nome de Sitna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Sitna está relacionado a uma palavra hebraica associada a hostilidade ou oposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: cavaram
  rationale: O qal narrativo plural de חפר indica o ato comum de cavar e dá continuidade natural à sequência do relato.
- source_word: בְּאֵר אַחֶרֶת
  choice: outro poço
  rationale: בְּאֵר significa “poço”, e אַחֶרֶת o distingue do anterior como mais um poço.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: também brigaram por causa dele
  rationale: ריב expressa conflito ou disputa; “brigaram” é claro e corrente. גַּם é representado por “também”, e עַל, neste contexto, indica o motivo ou objeto da disputa.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: ele lhe deu o nome
  rationale: Expressa em português natural a fórmula hebraica literal “chamou o nome dela”, preservando o ato explícito de nomear o poço.
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: O nome próprio do poço é transliterado, enquanto sua associação lexical com hostilidade ou oposição é explicada em nota.
