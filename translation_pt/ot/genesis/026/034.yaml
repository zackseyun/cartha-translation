base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: pt
  text: Quando Esaú tinha quarenta anos, tomou como esposas Judite, filha de Beeri, o hitita, e Basemate, filha de Elom, o hitita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “tomou uma mulher: Judite... e Basemate...”. O hebraico usa o singular “mulher” antes de mencionar duas mulheres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: Quando Esaú tinha quarenta anos
  rationale: A construção narrativa com וַיְהִי e a expressão hebraica de idade são vertidas de modo natural em português, preservando a função de enquadramento temporal.
- source_word: וַיִּקַּח אִשָּׁה
  choice: tomou como esposas
  rationale: Embora אִשָּׁה esteja no singular, o texto nomeia em seguida duas mulheres. A formulação mantém a ideia hebraica de 'tomar' em casamento e explicita o referente plural exigido pelo contexto.
- source_word: יְהוּדִית
  choice: Judite
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: בַּת
  choice: filha de
  rationale: Equivalente natural da relação de construto usada para identificação familiar.
- source_word: בְּאֵרִי
  choice: Beeri
  rationale: Transliteração clara do nome hebraico, preservando suas vogais principais.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: O gentílico definido funciona em aposição a Beeri e Elom; 'o hitita' reproduz essa identificação étnica.
- source_word: בָּשְׂמַת
  choice: Basemate
  rationale: Forma portuguesa tradicional e legível do nome hebraico.
- source_word: אֵילֹן
  choice: Elom
  rationale: Forma convencional do nome em traduções portuguesas, distinta do substantivo português 'élon' e adequada à leitura corrente.
