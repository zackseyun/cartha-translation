  terminology: Isaque, Abimeleque, filisteus, Rebeca e “sua mulher” estão corretos e consistentes. “Acariciava” comunica a implicação contextual de intimidade sem especificar além do que o hebraico exige; as alternativas devem permanecer na nota.
