base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: pt
  text: 'E aconteceu que, quando Isaque já estava ali havia muito tempo, Abimeleque, rei dos filisteus, olhou pela janela e viu: Isaque acariciava[a] Rebeca, sua mulher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ria com”, “brincava com” ou “trocava carícias com”. O verbo hebraico está relacionado ao nome Isaque e pode indicar riso, brincadeira ou comportamento íntimo; neste contexto, descreve uma conduta que revelou que Rebeca era sua mulher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a função narrativa da forma hebraica sem recorrer à fórmula arcaica “e sucedeu”.
- source_word: כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: depois de Isaque já estar ali havia muito tempo
  rationale: Expressa naturalmente em português a ideia idiomática de que sua permanência naquele lugar se prolongou; explicitar Isaque evita a sequência menos fluida de pronomes.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: olhou pela janela
  rationale: Comunica de modo corrente o ato de olhar através ou para fora da janela a partir de um ponto de observação.
- source_word: וַיַּרְא וְהִנֵּה
  choice: e viu que
  rationale: Em português narrativo natural, “viu que” transmite a descoberta marcada por וְהִנֵּה sem o pouco idiomático “e eis” nesta construção.
- source_word: מְצַחֵק
  choice: acariciava
  rationale: O verbo pode indicar comportamento brincalhão ou íntimo e faz jogo sonoro com o nome Isaque. No contexto, o gesto permitiu a Abimeleque reconhecer a relação conjugal; “acariciava” comunica afeto íntimo sem especificar um ato sexual.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: Rebeca, sua mulher
  rationale: Mantém o objeto e a aposição identificadora do hebraico em formulação portuguesa clara e digna.
