  source_fidelity: 'A expressão temporal deve ser introduzida por “quando”, não por “depois de”: כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים descreve a circunstância de sua longa permanência, sem afirmar uma sequência posterior. “Acariciava” é uma opção contextual defensável para מְצַחֵק, desde que a nota preserve suas alternativas e sua ambiguidade. A pontuação revista também torna mais perceptível a descoberta súbita sinalizada por וְהִנֵּה.'
