revisions:
- from: E o homem engrandeceu e continuou crescendo cada vez mais, até se tornar muito grande.[a]
  to: E o homem cresceu em grandeza e continuou a crescer cada vez mais, até ficar muito grande.[a]
  rationale: A revisão substitui «engrandeceu» por «cresceu em grandeza», uma forma mais natural e semanticamente apropriada para o crescimento de Isaque em importância e condição. Também ajusta a conclusão para uma formulação idiomática em português, preservando a repetição e a intensificação do hebraico, e alinha a nota alternativa à progressão verbal da fonte.
