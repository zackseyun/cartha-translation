  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: pt
  text: E o homem cresceu em grandeza e continuou a crescer cada vez mais, até ficar muito grande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi crescendo cada vez mais”. A expressão idiomática hebraica acumula formas verbais para indicar crescimento contínuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: engrandeceu
  rationale: Preserva o sentido amplo de גדל — crescer em grandeza, condição ou importância — e inicia a progressão reiterada no hebraico sem limitá-la apenas à riqueza.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Traduz diretamente איש e se refere a Isaque, mantendo a referência masculina singular.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: continuou crescendo cada vez mais
  rationale: Expressa em português natural a construção hebraica progressiva, formada por verbo finito, infinitivo absoluto e particípio, que indica aumento contínuo.
- source_word: עַד כִּי
  choice: até
  rationale: Marca de modo natural o ponto culminante da progressão.
- source_word: גָדַל מְאֹד
  choice: se tornar muito grande
  rationale: Conserva a repetição de גדל e a intensificação de מְאֹד, sem reduzir o sentido à prosperidade material, embora ela esteja presente no contexto.
