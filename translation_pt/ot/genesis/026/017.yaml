base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: pt
  text: Então Isaque partiu dali, acampou no vale de Gerar[a] e se estabeleceu ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no uádi de Gerar”. O termo hebraico pode se referir ao leito de um curso d’água sazonal, a uma ravina ou a um vale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: partiu dali
  rationale: A combinação expressa movimento para longe do lugar anterior. “Partiu dali” é natural, conciso e mantém a ligação com o contexto precedente.
- source_word: וַיִּחַן
  choice: acampou
  rationale: חנה indica estabelecer acampamento. “Acampou” é uma equivalência direta, atual e acessível.
- source_word: בְּנַחַל גְּרָר
  choice: no vale de Gerar
  rationale: נַחַל pode designar vale, ravina ou leito de curso d’água sazonal. “Vale de Gerar” oferece leitura clara no texto principal, enquanto a nota preserva a amplitude geográfica do termo.
- source_word: וַיֵּשֶׁב שָׁם
  choice: se estabeleceu ali
  rationale: ישב pode significar habitar, permanecer ou estabelecer-se. Após “acampou”, “se estabeleceu” comunica naturalmente a progressão narrativa sem tornar definitiva uma permanência que o hebraico não exige.
