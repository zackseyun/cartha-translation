base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: pt
  text: Ele tinha rebanhos de ovelhas e cabras, manadas de gado e muitos trabalhadores[a], e os filisteus o invejavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “muito serviço” ou “muito trabalho”; a expressão provavelmente indica uma numerosa força de trabalho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tinham ciúmes dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ele tinha
  rationale: A construção existencial היה + ל expressa posse; “ele tinha” é o equivalente natural em português.
- source_word: מִקְנֵה צֹאן
  choice: rebanhos de ovelhas e cabras
  rationale: מִקְנֶה designa animais possuídos, e צֹאן abrange o gado miúdo, especialmente ovelhas e cabras. A explicitação evita que “rebanhos” seja entendido de modo excessivamente genérico.
- source_word: וּמִקְנֵה בָקָר
  choice: manadas de gado
  rationale: בָקָר se refere ao gado bovino; “manadas de gado” distingue esse grupo dos rebanhos de animais menores.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: muitos trabalhadores
  rationale: A expressão significa literalmente serviço ou trabalho abundante e, neste contexto de grande patrimônio, provavelmente indica uma numerosa força de trabalho. A nota preserva a amplitude lexical do hebraico.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: o invejavam
  rationale: קנא, dirigido a Isaque por causa de sua prosperidade, expressa inveja ou ciúme. “Invejavam” é direto e natural neste contexto.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa consagrada para o nome desse povo.
