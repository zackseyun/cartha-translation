base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: pt
  text: Então os servos de Isaque cavaram no leito do riacho[a] e encontraram ali um poço de águas vivas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no vale» ou «no uádi»; o termo hebraico muitas vezes se refere ao leito de um curso de água sazonal.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «águas vivas», isto é, água fresca ou corrente, proveniente de uma nascente, e não água parada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: cavaram
  rationale: O qal narrativo de חפר é expresso naturalmente pelo verbo comum «cavar».
- source_word: עַבְדֵי יִצְחָק
  choice: os servos de Isaque
  rationale: A construção indica pessoas a serviço de Isaque; «servos» preserva a amplitude de עבד sem determinar aqui uma condição jurídica específica.
- source_word: בַּנָּחַל
  choice: no leito do riacho
  rationale: נחל pode indicar um curso de água sazonal ou seu leito. A formulação é clara em português e conserva o cenário geográfico, enquanto a nota registra alternativas.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: encontraram ali
  rationale: Tradução direta da sequência narrativa, mantendo o advérbio locativo שָׁם.
- source_word: בְּאֵר
  choice: um poço
  rationale: באר designa um poço; a expressão seguinte caracteriza a água nele encontrada.
- source_word: מַיִם חַיִּים
  choice: águas vivas
  rationale: Mantém a forma concreta e a ressonância bíblica do idioma hebraico, explicando em nota que se trata de água fresca ou corrente, proveniente de uma nascente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Leito do riacho» evita depender do empréstimo «uádi» no texto principal; «águas vivas» preserva o idioma e a possível ressonância canônica, com esclarecimento em nota.
