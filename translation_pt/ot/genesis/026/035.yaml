  yaml_path: translation/ot/genesis/026/035.yaml
  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: pt
  text: E elas foram motivo de amargura para Isaque e Rebeca.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E elas se tornaram motivo de amargura para Isaque e Rebeca”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “amargura de espírito”; expressão que indica profundo desgosto, aflição ou pesar.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: E elas foram
  rationale: O wayyiqtol qal na 3ª pessoa do feminino plural dá continuidade à narrativa e descreve o efeito das esposas de Esaú mencionadas no versículo anterior. “Foram” expressa naturalmente o estado resultante; “tornaram-se” também é possível.
- source_word: מֹרַת רוּחַ
  choice: motivo de profunda amargura
  rationale: A expressão hebraica é literalmente “amargura de espírito” e comunica forte desgosto, aflição ou pesar. A formulação escolhida conserva a imagem da amargura sem soar artificial em português.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: para Isaque e Rebeca
  rationale: As duas ocorrências da preposição ל assinalam as pessoas afetadas. Em português, uma única ocorrência de “para” diante dos nomes coordenados é natural e não altera o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Isaque” e “Rebeca” seguem as formas bíblicas correntes em português. A intensidade de רוּחַ foi explicitada como “profunda” para comunicar a força idiomática da expressão, enquanto a nota preserva sua forma literal.
