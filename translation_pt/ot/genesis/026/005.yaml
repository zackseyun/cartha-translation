source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: pt
  text: porque Abraão deu ouvidos à minha voz[a] e guardou o meu encargo, os meus mandamentos, os meus estatutos e as minhas leis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedeceu à minha voz”. A expressão hebraica “ouvir a voz” frequentemente indica uma escuta obediente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e as minhas instruções”. A palavra hebraica torá pode significar “lei”, “instrução” ou “ensino”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: porque
  rationale: Introduz a causa da bênção declarada no contexto e corresponde de modo natural à força causal do hebraico.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: deu ouvidos à minha voz
  rationale: Preserva a imagem auditiva da expressão hebraica e, em português, comunica escuta acompanhada de obediência.
- source_word: וַיִּשְׁמֹר
  choice: guardou
  rationale: Conserva o sentido amplo de guardar, observar e cumprir, além de manter a relação verbal com todos os termos legais que seguem.
- source_word: מִשְׁמַרְתִּי
  choice: o meu encargo
  rationale: Expressa algo confiado a alguém para ser guardado e mantém este termo distinto de mandamentos, estatutos e leis.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: É a tradução corrente, clara e precisa de מִצְוָה em contexto pactual e legal.
- source_word: חֻקּוֹתַי
  choice: os meus estatutos
  rationale: Preserva a distinção entre os termos da enumeração e comunica normas estabelecidas, sem reduzir o termo a um simples mandamento.
- source_word: וְתוֹרֹתָי
  choice: e as minhas leis
  rationale: No conjunto de termos legais deste versículo, 'leis' comunica bem o valor contextual de תּוֹרוֹת, embora 'instruções' também seja lexicalmente possível.
theological_decisions:
- issue: Enumeração de categorias legais antes do Sinai
  choice: 'Manter os quatro termos distintos: encargo, mandamentos, estatutos e leis.'
  alternative: Resumir a enumeração como 'todas as minhas ordens e leis' ou traduzir תּוֹרוֹתָי como 'instruções'.
  rationale: A acumulação de termos ressalta a abrangência da fidelidade de Abraão. A tradução conserva a tensão textual quanto à relação entre essa obediência anterior ao Sinai e as categorias posteriores da Torá, sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica. A expressão “deu ouvidos à minha voz” preserva o idioma hebraico sem soar obscura; “encargo” mantém a distinção lexical da enumeração, embora seja menos frequente na fala cotidiana.
