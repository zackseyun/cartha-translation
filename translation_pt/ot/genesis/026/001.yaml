  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: pt
  text: Houve fome na terra, além da primeira fome que houve nos dias de Abraão. Então Isaque foi até Abimeleque, rei dos filisteus, em Gerar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Gerar”. A forma hebraica Gerarah contém uma terminação direcional que pode marcar explicitamente movimento em direção a Gerar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: Houve fome na terra
  rationale: A construção narrativa introduz uma nova circunstância. Em português, “houve fome” é natural, fiel e dispensa artigo indefinido.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: além da primeira fome
  rationale: מִלְּבַד distingue esta fome daquela anterior, e רִאשׁוֹן preserva a formulação ordinal “primeira”.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: que houve nos dias de Abraão
  rationale: A oração relativa identifica a fome anterior pela época de Abraão; a repetição de “houve” é clara e digna em português.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: Por isso, Isaque foi
  rationale: O wayyiqtol faz a narrativa avançar, e o contexto apresenta a viagem como resposta à fome. “Por isso” expressa essa ligação sem acrescentar uma causa mais específica.
- source_word: אֶל אֲבִימֶּלֶךְ
  choice: até Abimeleque
  rationale: אֶל marca direção a uma pessoa. “Até” evita a possível leitura possessiva ou dativa de “foi a Abimeleque” e mantém o destino pessoal em primeiro plano.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: rei dos filisteus
  rationale: A cadeia construta designa Abimeleque como rei do povo filisteu; a forma convencional é clara e historicamente reconhecível.
- source_word: גְּרָרָה
  choice: em Gerar
  rationale: No fluxo da frase, “em Gerar” identifica naturalmente onde Abimeleque estava; a terminação direcional também permite entender “para Gerar”, preservado em nota.
theological_decisions:
- issue: Designação histórica e étnica פְּלִשְׁתִּים
  choice: filisteus
  alternative: povo filisteu
  rationale: Trata-se de uma designação étnico-política comum, não de um título teológico. A forma tradicional portuguesa é precisa e compreensível.
- issue: Relação entre a fome e a viagem de Isaque
  choice: Por isso
  alternative: Então / E
  rationale: O contexto sugere que a viagem decorreu da fome, mas não declara detalhes adicionais sobre a motivação. “Por isso” comunica a sequência contextual sem especificar mais do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O marcador de nota foi colocado depois de “em Gerar”, expressão à qual a alternativa lexical efetivamente se refere.
