- from: 'Então Abimeleque chamou Isaque e lhe disse: “Ela é mesmo sua mulher! Como, então, você pôde dizer: ‘Ela é minha irmã’?” Isaque lhe respondeu: “Porque pensei: ‘Eu poderia morrer por causa dela.’”'
  to: 'Então Abimeleque chamou Isaque e lhe disse: “Ela é mesmo sua mulher! Como, então, você pôde dizer: ‘Ela é minha irmã’?” Isaque lhe respondeu: “Porque eu disse: ‘Para que eu não morresse por causa dela.’”'
