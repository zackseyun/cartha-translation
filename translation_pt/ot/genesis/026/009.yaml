base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: pt
  text: 'Então Abimeleque chamou Isaque e lhe disse: “Ela é mesmo sua mulher! Como, então, você pôde dizer: ‘Ela é minha irmã’?” Isaque lhe respondeu: “Porque eu disse: ‘Para que eu não morresse por causa dela.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: chamou Isaque
  rationale: קרא com לְ diante da pessoa pode significar chamar ou convocar. “Chamou Isaque” preserva a simplicidade narrativa e é natural em português.
- source_word: אַךְ הִנֵּה
  choice: mesmo
  rationale: A combinação introduz uma constatação enfática. “Ela é mesmo...” comunica descoberta e certeza sem empilhar interjeições pouco naturais como “certamente, veja”.
- source_word: אִשְׁתְּךָ הִוא
  choice: ela é sua mulher
  rationale: “Mulher” é a designação comum e contextual para a esposa no português bíblico contemporâneo; a frase mantém a declaração direta do hebraico.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Como, então, você pôde dizer
  rationale: A formulação transmite a ligação com a declaração anterior e o tom de censura e incredulidade da pergunta.
- source_word: אֲחֹתִי הִוא
  choice: Ela é minha irmã
  rationale: Mantém o sentido lexical direto de אחות, sem ampliar indevidamente para “parenta”.
- source_word: כִּי אָמַרְתִּי
  choice: Porque pensei
  rationale: Embora אמרתי signifique literalmente “eu disse”, aqui introduz a razão que Isaque formulou para si; “pensei” expressa naturalmente esse uso interior em português, sem atribuir a fala a um interlocutor não mencionado.
- source_word: פֶּן אָמוּת
  choice: Eu poderia morrer
  rationale: פֶּן apresenta um resultado temido e possível. O condicional “poderia” comunica essa apreensão de modo corrente, sem transformar a frase em afirmação de morte certa.
- source_word: עָלֶיהָ
  choice: por causa dela
  rationale: 'Neste contexto, עַל indica a causa ou ocasião do perigo: Isaque temia morrer por causa de Rebeca.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O diálogo conserva o tom enfático e repreensivo de Abimeleque. “Mulher” foi preferido a “esposa” por naturalidade narrativa e continuidade com o uso bíblico corrente, sem criar ambiguidade no contexto.
