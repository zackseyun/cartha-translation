review_pass:
  verdict: revise
  source_fidelity: 'A declaração inicial e a pergunta de Abimeleque são bem representadas: “Ela é mesmo sua mulher!” comunica adequadamente a ênfase de אַךְ הִנֵּה, e “Como, então, você pôde dizer” preserva o tom repreensivo de וְאֵיךְ. Contudo, אָמַרְתִּי significa “eu disse”, não “pensei”; o contexto permite que a fala seja uma formulação interior, mas a tradução não deve substituir o verbo. פֶּן pede uma construção de receio, mais direta e fielmente expressa por “para que eu não morresse” ou “com medo de morrer”, em vez de “Eu poderia morrer”.'
  naturalness: 'O português é moderno, claro e de boa fluência. “Sua mulher” é natural neste registro narrativo e não é ambígua. A fala final pode permanecer igualmente natural com “Eu disse: ‘Para que eu não morresse por causa dela.’”'
  terminology: Abimeleque, Isaque, mulher e irmã estão adequados ao uso bíblico português contemporâneo. Não há questão teológica ou de nomes que exija alteração.
  issues:
  - severity: medium
    issue: “Porque pensei” traduz אָמַרְתִּי.
    rationale: O hebraico emprega o verbo אמר, “dizer”. Embora possa introduzir raciocínio pessoal no contexto, “pensei” elimina a formulação verbal explicitamente presente no texto.
  - severity: low
    issue: “Eu poderia morrer” torna a cláusula de receio menos explícita.
    rationale: פֶּן introduz o resultado temido (“para que não...”, “com medo de que...”). Uma construção negativa de finalidade/temor conserva melhor a sintaxe e a força da explicação.
  revised_text: 'Então Abimeleque chamou Isaque e lhe disse: “Ela é mesmo sua mulher! Como, então, você pôde dizer: ‘Ela é minha irmã’?” Isaque lhe respondeu: “Porque eu disse: ‘Para que eu não morresse por causa dela.’”'
  revised_footnotes: []
