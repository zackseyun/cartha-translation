  - marker: b
    text: Neste contexto, “tocar” também pode ter o sentido de “ferir” ou “causar dano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: de que não
  rationale: Neste contexto, אִם introduz o conteúdo do juramento solicitado no versículo anterior. A formulação contínua “jure... de que não” comunica naturalmente essa função em português, enquanto a leitura condicional literal é registrada em nota.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: nos fará mal
  rationale: Expressa de modo natural a ideia de causar dano ou agir mal contra alguém no contexto de um pacto de não agressão.
- source_word: לֹא נְגַעֲנוּךָ
  choice: não tocamos em você
  rationale: Preserva o sentido concreto de נגע e também sua possível conotação contextual de não causar dano, explicitada em nota.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: só lhe fizemos o bem
  rationale: Mantém a ênfase restritiva de רַק e apresenta a afirmação dos interlocutores em português corrente.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: e o mandamos embora em paz
  rationale: Preserva tanto a iniciativa de enviá-lo embora quanto a afirmação de que sua partida ocorreu sem hostilidade aberta.
- source_word: בְּרוּךְ יְהוָה
  choice: abençoado por Yahweh
  rationale: Entende בְּרוּךְ como particípio passivo e conserva o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Função de אִם na fórmula de juramento
  choice: 'conteúdo negativo do juramento: “de que não nos fará mal”'
  alternative: 'condição ou imprecação: “se nos fizer mal”'
  rationale: A continuidade com o pedido de aliança do versículo anterior favorece uma formulação natural de compromisso negativo, mas a forma hebraica permite uma leitura mais literal e condicional, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” mantém clareza contemporânea; “lhe” e “o” evitam repetição excessiva. A tradução conserva a alegação retórica dos falantes sem endossá-la nem suavizar o fato de que mandaram Isaque embora.
