  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: pt
  text: que você não nos fará mal[a], assim como não tocamos em você[b] e como só lhe fizemos o bem e o mandamos embora em paz. Agora você é abençoado por Yahweh”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se nos fizer mal”. O hebraico lê literalmente “se você nos fizer mal”; no contexto, pode introduzir o compromisso solicitado no versículo anterior.'
