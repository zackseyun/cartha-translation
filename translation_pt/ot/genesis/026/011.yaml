base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: pt
  text: 'Então Abimeleque ordenou a todo o povo, dizendo: “Quem[a] tocar neste homem ou em sua mulher certamente será morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Aquele que tocar neste homem ou em sua mulher”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O piel de צוה expressa uma ordem dada com autoridade; “ordenou” preserva essa força em português atual.
- source_word: כָּל הָעָם
  choice: a todo o povo
  rationale: עם designa aqui o conjunto das pessoas sob a autoridade de Abimeleque, sem exigir o sentido étnico ou político de “nação”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo natural a fórmula hebraica que introduz o conteúdo direto da ordem.
- source_word: הַנֹּגֵעַ
  choice: Quem tocar
  rationale: 'O particípio com artigo tem sentido genérico: “aquele que tocar” ou, de modo mais natural, “quem tocar”. “Tocar” preserva o sentido simples sem explicitar agressão além do que o hebraico declara.'
- source_word: בָּאִישׁ הַזֶּה
  choice: neste homem
  rationale: Com נגע, a preposição ב marca a pessoa tocada; “tocar neste homem” é idiomático e mantém o demonstrativo.
- source_word: וּבְאִשְׁתּוֹ
  choice: ou em sua mulher
  rationale: אשה com o sufixo possessivo significa “sua mulher/esposa”. “Sua mulher” é natural e amplamente compreensível, enquanto “ou” expressa adequadamente a alternativa abrangida pela proibição.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto com a forma passiva intensifica a sentença. “Certamente será morto” conserva tanto a ênfase quanto o caráter passivo de uma pena aplicada, em vez de significar apenas que a pessoa morrerá.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura da proclamação e a força judicial da pena foram preservadas sem ampliar “tocar” para uma agressão explicitamente violenta.
