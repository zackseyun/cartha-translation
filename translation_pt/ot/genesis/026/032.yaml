base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: pt
  text: 'Naquele dia[a], os servos[b] de Isaque vieram e lhe contaram sobre o poço que haviam cavado; e lhe disseram: “Encontramos água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no mesmo dia”, entendendo a expressão como referência ao dia dos acontecimentos anteriores.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “servos” também pode significar “escravos”, pois pode designar trabalhadores vinculados à casa; aqui, o contexto não destaca essa condição social.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Naquele mesmo dia
  rationale: A fórmula narrativa situa o acontecimento no dia dos eventos anteriores. Em português, a expressão temporal dispensa uma tradução mecânica de וַיְהִי; “mesmo” explicita naturalmente a ligação contextual possível.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: Equivalente direto e natural do verbo de movimento בוא no encadeamento narrativo.
- source_word: עַבְדֵי יִצְחָק
  choice: os servos de Isaque
  rationale: עבד pode designar servo ou escravo; neste contexto, refere-se aos trabalhadores da casa de Isaque sem destacar sua condição social. “Servos” preserva a amplitude do termo e o registro bíblico corrente.
- source_word: וַיַּגִּדוּ לוֹ
  choice: vieram contar-lhe
  rationale: O hifil de נגד significa contar, informar ou relatar. A construção com “vieram” produz português fluente sem perder o destinatário explícito.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: sobre o poço
  rationale: Tradução clara e corrente da locução com o sentido de “a respeito de”.
- source_word: אֲשֶׁר חָפָרוּ
  choice: que haviam cavado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da escavação em relação ao relato.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: e lhe disseram
  rationale: Mantém a introdução explícita da fala e o destinatário presentes no hebraico.
- source_word: מָצָאנוּ מָיִם
  choice: Encontramos água
  rationale: Expressa de forma direta a descoberta bem-sucedida; o pretérito perfeito é natural em português para uma descoberta recente cujo resultado continua relevante.
