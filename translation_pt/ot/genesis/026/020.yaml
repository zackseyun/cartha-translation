base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: pt
  text: 'Então os pastores de Gerar discutiram com os pastores de Isaque, dizendo: “A água é nossa.” Por isso, ele deu ao poço o nome de Eseque[a], porque disputaram com ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eseque está relacionado à palavra hebraica para “disputa” ou “contenda”.
    reason: O nome עֵשֶׂק forma um jogo de palavras com o verbo cognato usado no fim do versículo; a nota preserva essa associação, que não é evidente na transliteração.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: discutiram
  rationale: O verbo ריב expressa conflito ou contenda. “Discutiram” é natural em português moderno e comunica claramente a altercação pela água.
- source_word: רֹעֵי גְרָר
  choice: os pastores de Gerar
  rationale: רֹעִים designa pessoas que cuidam de rebanhos; “pastores” é a equivalência direta e corrente neste contexto patriarcal.
- source_word: עִם רֹעֵי יִצְחָק
  choice: com os pastores de Isaque
  rationale: Mantém o paralelismo do hebraico e identifica de modo claro os dois grupos envolvidos.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: 'dizendo: “A água é nossa”'
  rationale: A expressão hebraica é elíptica, literalmente “a nós, a água”, e formula uma reivindicação de posse. “A água é nossa” reproduz isso com clareza e concisão.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: Por isso, ele deu ao poço o nome de
  rationale: A construção hebraica “chamou o nome do poço” é vertida em português idiomático; “Por isso” explicita a relação narrativa de consequência presente no contexto.
- source_word: עֵשֶׂק
  choice: Eseque
  rationale: O nome do poço é transliterado, enquanto seu sentido e o jogo de palavras com o verbo cognato são indicados em nota.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: porque disputaram com ele
  rationale: O verbo cognato de עֵשֶׂק indica disputa ou contenda. “Disputaram” preserva a ligação semântica com o nome explicada na nota. O pronome singular se refere naturalmente a Isaque.
