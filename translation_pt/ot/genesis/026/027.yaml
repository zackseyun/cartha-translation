  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: pt
  text: 'Isaque lhes disse: “Por que vocês vieram até mim, se[a] me odiaram e me mandaram embora do meio de vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e vocês me odiaram e me mandaram embora do meio de vocês”. A conjunção hebraica pode ser traduzida mais literalmente por “e”, mas aqui pode ter sentido circunstancial ou de contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: Isaque lhes disse
  rationale: Mantém a fórmula narrativa hebraica com uma construção natural e digna em português.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo direto e corrente, que preserva a pergunta causal.
- source_word: בָּאתֶם אֵלָי
  choice: vocês vieram até mim
  rationale: Expressa a chegada recente que motiva a pergunta de Isaque; “até mim” comunica de modo natural o movimento em sua direção.
- source_word: וְאַתֶּם
  choice: se
  rationale: No contexto, a conjunção introduz a circunstância que torna surpreendente a vinda deles. A nota preserva a alternativa mais literal, “e”.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: me odiaram
  rationale: Preserva a força comum de שנא, sem suavizá-la para mera hostilidade.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: me mandaram embora
  rationale: Reproduz o sentido contextual de enviar alguém para longe sem intensificá-lo indevidamente como “expulsaram”.
- source_word: מֵאִתְּכֶם
  choice: do meio de vocês
  rationale: Conserva a ideia de separação da presença e da convivência do grupo, além do simples afastamento espacial.
