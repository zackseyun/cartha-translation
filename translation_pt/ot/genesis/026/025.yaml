base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: pt
  text: Então ele construiu ali um altar, invocou o nome de Yahweh[a] e armou ali a sua tenda. Os servos de Isaque cavaram ali um poço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “proclamou o nome de Yahweh”. A expressão hebraica pode indicar invocação ou proclamação; neste contexto, a construção do altar favorece o sentido de invocação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: Equivalente narrativo comum de בנה, natural em português e adequado à construção de um altar.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Correspondência direta e consagrada para a estrutura de culto e sacrifício.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: invocou o nome de Yahweh
  rationale: No contexto da construção de um altar, a expressão indica mais naturalmente uma invocação cultual, sem excluir completamente a possibilidade de proclamação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיֶּט ... אָהֳלוֹ
  choice: armou a sua tenda
  rationale: Expressão idiomática corrente em português para montar ou instalar uma tenda.
- source_word: עַבְדֵי יִצְחָק
  choice: os servos de Isaque
  rationale: No contexto, designa trabalhadores da casa de Isaque; 'servos' preserva a amplitude semântica sem afirmar uma condição jurídica específica.
- source_word: וַיִּכְרוּ ... בְּאֵר
  choice: cavaram um poço
  rationale: Tradução direta e natural da ação habitual associada a poços.
- source_word: שָׁם
  choice: ali
  rationale: Preserva a ênfase locativa repetida no hebraico com uma forma natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio; 'Yahweh' preserva essa função sem o substituir por um título.
- issue: Sentido de וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: invocou o nome de Yahweh
  alternative: proclamou o nome de Yahweh
  rationale: A associação imediata com a construção do altar favorece a invocação em culto, mas a ambiguidade legítima da expressão é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição locativa do hebraico foi preservada sem rigidez, e a sequência das ações foi organizada em períodos naturais. Não se incluiu a nota inglesa b, pois ela apenas registra uma redação inglesa anterior e não representa variante ou ambiguidade do texto-fonte.
