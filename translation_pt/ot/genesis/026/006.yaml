lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: O verbo ישׁב, nesta forma narrativa, pode significar sentar-se, habitar ou permanecer. No contexto, descreve Isaque permanecendo em Gerar em obediência à instrução anterior; “ficou” é natural e não sugere uma instalação necessariamente definitiva.
- source_word: יִצְחָק
  choice: Isaque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בִּגְרָר
  choice: em Gerar
  rationale: A preposição בְּ marca localização, e “em Gerar” expressa isso diretamente em português.
- source_word: וַ
  choice: Assim
  rationale: O waw consecutivo dá sequência à narrativa e, neste contexto, apresenta a ação como resposta à ordem divina dos versículos anteriores. “Assim” comunica essa ligação sem tornar a causalidade mais forte do que o contexto permite.
