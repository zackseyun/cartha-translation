base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: pt
  text: 'Naquela noite, Yahweh apareceu a ele e disse: “Eu sou o Deus de Abraão, seu pai. Não tenha medo[a], pois eu estou com você. Eu o abençoarei e multiplicarei a sua descendência[b] por causa de Abraão, meu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não tema”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a sua semente”; o termo hebraico tem aqui sentido coletivo e se refere à descendência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיֵּרָא אֵלָיו
  choice: apareceu a ele
  rationale: Expressa de modo natural e direto a manifestação indicada pelo nifal de ראה.
- source_word: בַּלַּיְלָה הַהוּא
  choice: Naquela noite
  rationale: Preserva a referência temporal e demonstrativa em português corrente.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Eu sou o Deus de Abraão, seu pai
  rationale: Mantém a identificação pactual e a relação de Abraão com o destinatário sem alterar a ordem conceitual do hebraico.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Forma corrente e clara de expressar a proibição e o encorajamento; “Não tema” também é possível.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: pois eu estou com você
  rationale: “Pois” apresenta a presença divina como fundamento para não ter medo.
- source_word: וּבֵרַכְתִּיךָ
  choice: Eu o abençoarei
  rationale: O contexto de promessa requer valor futuro em português.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: e multiplicarei a sua descendência
  rationale: Comunica tanto a ação causativa de tornar numerosa quanto o sentido coletivo de זֶרַע em linguagem natural.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: Preserva a ideia de fundamento ou motivo sem acrescentar uma explicação teológica ao texto.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto pactual, “servo” representa adequadamente a relação e a condição de Abraão, sem sugerir desnecessariamente escravidão social.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém o Tetragrama como nome pessoal; a transliteração preserva essa função em vez de substituí-la por um título.
- issue: Fundamento da promessa em בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: por causa de Abraão, meu servo
  alternative: por amor de Abraão, meu servo; em consideração a Abraão, meu servo
  rationale: A tradução mantém a ligação explícita entre a promessa feita a Isaque e Abraão, sem definir além do texto a natureza exata desse fundamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para clareza contemporânea e evita construções excessivamente arcaicas. Os marcadores foram colocados junto às expressões que explicam.
