  text: וַ/אֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖י/ו מִ/גְּרָ֑ר וַ/אֲחֻזַּת֙ מֵֽרֵעֵ֔/הוּ וּ/פִיכֹ֖ל שַׂר צְבָאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: pt
  text: Então Abimeleque foi de Gerar até ele, acompanhado de Auzate, seu amigo[a], e de Ficol, comandante do seu exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu companheiro”. O termo hebraico pode indicar um amigo ou associado pessoal e também um companheiro ou conselheiro da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: Então Abimeleque
  rationale: O nome próprio segue a forma tradicional em português. O waw narrativo é expresso por “Então”, que dá continuidade natural ao relato.
- source_word: הָלַךְ אֵלָיו מִגְּרָר
  choice: foi de Gerar até ele
  rationale: Preserva o sentido de movimento de Gerar em direção à pessoa já identificada no contexto, sem substituir o pronome hebraico pelo nome de Isaque.
- source_word: וַאֲחֻזַּת
  choice: acompanhado de Auzate
  rationale: O waw introduz uma das pessoas que acompanhavam Abimeleque. “Acompanhado de” torna essa relação sintática clara e natural em português.
- source_word: מֵרֵעֵהוּ
  choice: seu amigo
  rationale: O substantivo designa um amigo, companheiro ou associado. “Seu amigo” reproduz o sentido lexical mais direto, enquanto a possível função de companheiro ou conselheiro da corte é registrada em nota.
- source_word: וּפִיכֹל
  choice: e de Ficol
  rationale: O nome próprio segue a forma tradicional em português e integra a construção iniciada por “acompanhado de”.
- source_word: שַׂר צְבָאוֹ
  choice: comandante do seu exército
  rationale: שַׂר indica aqui um chefe ou comandante, e צָבָא designa as forças militares. A expressão é clara, atual e adequada ao contexto.
theological_decisions: []
