  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: pt
  text: A taça do faraó estava em minha mão; peguei as uvas, espremi-as dentro da taça do faraó e coloquei a taça na mão dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹס
  choice: taça
  rationale: Designa um recipiente para beber. “Taça” é natural no contexto da corte e evita a conotação especificamente litúrgica de “cálice”.
- source_word: בְּיָדִי
  choice: em minha mão
  rationale: Mantém a imagem concreta do relato do sonho e corresponde diretamente à expressão hebraica.
- source_word: וָאֶקַּח אֶת־הָעֲנָבִים
  choice: peguei as uvas
  rationale: Reproduz de modo simples e natural a sequência narrativa e o sentido comum de לקח.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: espremi-as dentro da taça do faraó
  rationale: שׂחט descreve aqui o ato de apertar as uvas para extrair seu líquido; “dentro da” comunica naturalmente a direção indicada por אֶל neste contexto.
- source_word: וָאֶתֵּן אֶת־הַכּוֹס
  choice: coloquei a taça
  rationale: Embora נתן possa significar “dar”, o complemento descreve a colocação física da taça na mão do faraó.
- source_word: עַל כַּף פַּרְעֹה
  choice: na mão dele
  rationale: כַּף significa literalmente “palma da mão”, mas a expressão descreve de modo idiomático a entrega da taça à mão do faraó. O pronome evita uma repetição pesada sem criar ambiguidade.
