  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Tivemos um sonho, e não há quem o interprete.” José lhes disse: “Não pertencem a Deus as interpretações? Contem-me, por favor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Tivemos um sonho
  rationale: O hebraico emprega um objeto cognato, literalmente, “um sonho sonhamos”. Em português corrente, “tivemos um sonho” comunica naturalmente o mesmo acontecimento sem reproduzir uma construção pouco idiomática.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: mas não há quem o interprete
  rationale: O particípio ativo פֹתֵר designa alguém que interpreta. A formulação verbal preserva a indisponibilidade de um intérprete; “mas” explicita com naturalidade o contraste contextual expresso pela conjunção.
- source_word: הֲלוֹא לֵאלֹהִים פִּתְרֹנִים
  choice: Não pertencem a Deus as interpretações?
  rationale: Mantém a pergunta retórica que espera resposta afirmativa, a forma plural de “interpretações” e a construção de posse ou competência expressa por לֵאלֹהִים.
- source_word: סַפְּרוּ נָא לִי
  choice: Por favor, contem-me os sonhos
  rationale: סַפְּרוּ é plural e נָא confere tom cortês. O objeto está implícito; “os sonhos” é recuperado do contexto e esclarece que cada homem deve relatar o seu sonho.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Referência de אֱלֹהִים na declaração de José
  choice: Deus
  alternative: um deus / deuses
  rationale: No contexto da narrativa de José, a afirmação atribui ao Deus reconhecido por José a interpretação dos sonhos. O uso sem artigo não exige aqui uma leitura indefinida ou politeísta.
- issue: Sentido de לֵאלֹהִים em relação às interpretações
  choice: pertencem a Deus
  alternative: vêm de Deus
  rationale: “Pertencem a Deus” preserva a construção hebraica e deixa aberta a relação exata entre posse, prerrogativa e fonte, sem restringi-la apenas à origem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a pergunta retórica e o plural hebraico “interpretações”. A construção cognata “um sonho sonhamos” foi vertida idiomaticamente. Não são necessárias notas, pois as alternativas formais não acrescentam ambiguidade relevante para publicação.
