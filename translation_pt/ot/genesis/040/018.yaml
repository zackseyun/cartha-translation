  text: 'José respondeu: “Esta é a interpretação: os três cestos são três dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A fórmula dupla hebraica introduz a resposta de José. Em português atual, “respondeu” expressa naturalmente ambos os verbos sem a redundância pouco idiomática de “respondeu e disse”.
- source_word: פִּתְרֹנוֹ
  choice: a interpretação
  rationale: No contexto de sonhos, פִּתְרוֹן designa sua interpretação. O possessivo hebraico é representado de modo natural pela construção “Esta é a interpretação”, cujo referente está claro no contexto.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: os três cestos
  rationale: סַל designa um cesto; “cestos” é uma forma clara e corrente, sem acrescentar ao texto uma especificação sobre o material.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: são três dias
  rationale: Preserva a identificação direta da oração nominal hebraica e a equivalência simbólica declarada por José, em vez de explicá-la com “significam”.
