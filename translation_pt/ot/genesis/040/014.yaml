  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: pt
  text: 'Mas lembre-se de mim quando tudo estiver bem com você[a]. Por favor, faça-me esta bondade: mencione-me ao faraó e tire-me desta casa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “lembre-se de mim com você”. A expressão hebraica significa manter José pessoalmente em mente.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” se refere ao lugar onde José estava preso.
    reason: contextual_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: Neste contexto, a expressão introduz um apelo enfático em contraste com o futuro favorável do copeiro. “Mas” liga o pedido de modo natural ao versículo anterior sem transformar a frase numa condição rígida.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: lembre-se de mim
  rationale: O verbo significa recordar ou manter alguém em mente. A expressão אִתְּךָ, literalmente “com você”, é idiomática aqui; seu valor é preservado em português corrente por “lembre-se de mim”, com a forma literal registrada em nota.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: quando tudo estiver bem com você
  rationale: A oração aponta para a restauração e o bem-estar futuros do copeiro. A formulação é clara, natural e conserva o sentido temporal.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: Por favor, faça-me esta bondade
  rationale: חֶסֶד designa aqui um ato concreto de bondade ou lealdade pessoal, não necessariamente uma relação formal de aliança. “Por favor” representa נָא.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: mencione-me ao faraó
  rationale: O Hifil de זכר pede que José seja trazido à atenção do faraó. “Mencione-me” transmite isso de maneira concisa e idiomática.
- source_word: וְהוֹצֵאתַנִי מִן הַבַּיִת הַזֶּה
  choice: e tire-me desta casa
  rationale: O Hifil de יצא tem sentido causativo, e “tire-me” o preserva. “Casa” traduz diretamente בַּיִת, sem substituir no texto principal a imagem hebraica por “prisão”.
