base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: pt
  text: Os dois sonharam[a], cada um o seu sonho, na mesma noite, cada qual com a interpretação correspondente ao seu sonho[b] — o copeiro e o padeiro a serviço do rei do Egito[c], que estavam detidos na prisão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «sonharam um sonho». O hebraico usa um verbo e um substantivo da mesma raiz.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «cada sonho com a sua própria interpretação». A construção hebraica destaca que a cada sonho correspondia uma interpretação distinta.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «que eram do rei do Egito»; a expressão indica que estavam vinculados ao serviço real.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, «na casa da prisão».
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: sonharam
  rationale: O hebraico emprega a construção cognata, literalmente «sonharam um sonho». Em português atual, «sonharam», seguido de «cada um o seu sonho», preserva o conteúdo e evita uma formulação artificial.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Expressa diretamente que se trata dos dois oficiais mencionados no contexto.
- source_word: אִישׁ חֲלֹמוֹ
  choice: cada um o seu sonho
  rationale: 'Mantém a distribuição individual: cada um teve um sonho distinto.'
- source_word: בְּלַיְלָה אֶחָד
  choice: na mesma noite
  rationale: Embora a forma seja literalmente «em uma noite», no contexto o numeral indica que ambos sonharam durante a mesma noite; esta formulação é natural e clara em português.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: cada qual com a interpretação correspondente ao seu sonho
  rationale: Preserva a repetição distributiva e o valor de correspondência de כְּ, indicando que cada sonho possuía uma interpretação própria e adequada a ele.
- source_word: הַמַּשְׁקֶה
  choice: o copeiro
  rationale: Designa o oficial encarregado de servir bebidas ao rei; «copeiro» é o equivalente tradicional, conciso e compreensível.
- source_word: הָאֹפֶה
  choice: o padeiro
  rationale: Tradução direta do substantivo participial, sem acrescentar «chefe», termo que não aparece neste versículo.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: a serviço do rei do Egito
  rationale: Comunica a relação ou vinculação oficial expressa por לְ sem sugerir propriedade pessoal.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: estavam detidos na prisão
  rationale: Reproduz o sentido contextual de custódia de אֲסוּרִים e verte naturalmente a expressão «casa da prisão» em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem básica e a distribuição enfática do hebraico foram preservadas, mas a construção cognata foi naturalizada. «Copeiro» mantém a designação tradicional do cargo, e «detidos na prisão» evita a redundância pouco natural de «presos na casa da prisão».
