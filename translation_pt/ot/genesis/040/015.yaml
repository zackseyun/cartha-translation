  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: pt
  text: Pois fui, de fato, sequestrado da terra dos hebreus[a]; e, mesmo aqui, não fiz coisa alguma para que me pusessem na cova[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fui realmente roubado” ou “fui levado à força”. O hebraico combina um infinitivo absoluto com o verbo finito para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “cova” pode designar um calabouço ou uma cela de prisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de José ao copeiro com valor causal e explicativo.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: fui, de fato, sequestrado
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação passiva. “Sequestrado” comunica naturalmente, em português, que uma pessoa foi levada à força; “de fato” preserva a ênfase hebraica.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: da terra dos hebreus
  rationale: Preserva a designação étnica e não transforma a expressão em referência a uma entidade política mais precisa do que o hebraico indica.
- source_word: וְגַם פֹּה
  choice: e, mesmo aqui
  rationale: 'Expressa a força aditiva e enfática: além de ter sido levado à força, José afirma sua inocência também no Egito.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: não fiz coisa alguma
  rationale: Forma corrente e enfática em português para a negação absoluta expressa pelo hebraico.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: para que me pusessem
  rationale: Em ligação com a negação anterior, comunica que José não fez nada que justificasse sua reclusão, sem acrescentar uma acusação específica.
- source_word: בַּבּוֹר
  choice: na cova
  rationale: Mantém a imagem concreta de בּוֹר, que pode designar uma cova ou cisterna e, neste contexto, o local de encarceramento.
theological_decisions: []
