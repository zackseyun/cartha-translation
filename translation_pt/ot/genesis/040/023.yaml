  text: וְ/לֹֽא זָכַ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת יוֹסֵ֖ף וַ/יִּשְׁכָּחֵֽ/הוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: pt
  text: Mas o chefe dos copeiros não se lembrou de José[a]; esqueceu-se dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o chefe dos copeiros não se lembrou de José; esqueceu-se dele.”'
    reason: A conjunção hebraica pode ser entendida de maneira simplesmente aditiva ('e') ou, pelo contexto, contrastiva ('mas').
lexical_decisions:
- source_word: וְ/לֹא
  choice: Mas ... não
  rationale: 'A conjunção ligada à negação retoma o cumprimento narrado anteriormente e introduz o contraste: apesar de ter sido restaurado, o chefe dos copeiros não se lembrou de José.'
- source_word: זָכַר
  choice: se lembrou
  rationale: Preserva o sentido lexical comum de 'lembrar-se' sem explicitar além do texto a ação que José esperava do oficial.
- source_word: שַׂר הַמַּשְׁקִים
  choice: o chefe dos copeiros
  rationale: Expressa de modo claro e digno o título do alto funcionário encarregado do serviço de bebidas na corte do faraó.
- source_word: אֶת יוֹסֵף
  choice: José
  rationale: A marca hebraica do objeto direto não precisa ser representada em português; o nome segue sua forma portuguesa consagrada.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: esqueceu-se dele
  rationale: Mantém o sentido direto de 'esquecer' e o pronome referente a José. O ponto e vírgula conserva a segunda oração como uma reafirmação enfática, sem produzir em português a construção pouco natural 'mas... mas'.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Copeiros' conserva o título cortesão tradicional e é esclarecido pelo termo 'chefe'. A repetição semântica entre 'não se lembrou' e 'esqueceu-se' foi preservada por seu efeito enfático no hebraico.
