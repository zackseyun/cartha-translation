  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: pt
  text: Daqui a três dias, o faraó levantará a sua cabeça[a] e o restituirá ao seu posto. Então você porá o copo do faraó na mão dele, como fazia antes, quando era seu copeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantará a sua cabeça”. Aqui, a expressão indica que o faraó lhe dará atenção favorável e o restituirá ao cargo; a mesma formulação prepara o uso contrastante no versículo 19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Daqui a três dias
  rationale: Expressa naturalmente em português o intervalo restante antes do acontecimento, preservando o sentido prospectivo da locução hebraica.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: levantará a sua cabeça
  rationale: Mantém a imagem literal e a ligação literária com o uso contrastante da mesma expressão no versículo 19; a oração seguinte esclarece aqui o sentido favorável.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: e o restituirá ao seu posto
  rationale: כֵּן designa aqui o lugar ou função estabelecida do copeiro na corte; “posto” é claro e adequado ao contexto.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: Então você porá o copo do faraó na mão dele
  rationale: Preserva a ação concreta e cerimonial expressa por נתן, com formulação natural e inequívoca em português.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: como fazia antes
  rationale: Comunica de modo natural o procedimento ou costume anteriormente estabelecido, sem introduzir a ideia mais técnica de uma ordenança jurídica.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: quando era seu copeiro
  rationale: מַשְׁקֶה indica a função oficial de copeiro, termo tradicional ainda compreensível e preciso no contexto da corte.
