  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: pt
  text: Depois dessas coisas[a], o copeiro do rei do Egito e o padeiro pecaram contra o seu senhor, o rei do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois desses acontecimentos”. A fórmula narrativa hebraica pode ser traduzida mais literalmente como “E aconteceu, depois dessas coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Expressa de modo natural a transição narrativa hebraica, preservando a referência ampla ao que ocorreu anteriormente; a alternativa mais explícita é registrada em nota.
- source_word: מַשְׁקֵה
  choice: o copeiro
  rationale: Designa o servidor real encarregado das bebidas. “Copeiro” é o equivalente tradicional e ainda compreensível em português, sem acrescentar a categoria de chefe, ausente neste versículo.
- source_word: הָאֹפֶה
  choice: o padeiro
  rationale: Reproduz diretamente a forma definida hebraica e evita introduzir um possessivo que o texto não expressa.
- source_word: חָטְאוּ
  choice: pecaram contra
  rationale: Preserva a força moral e relacional de חטא construído com ל, em vez de reduzi-lo a mero desagrado ou ofensa protocolar.
- source_word: לַאֲדֹנֵיהֶם
  choice: contra o seu senhor
  rationale: Aqui אדון indica o superior humano dos dois oficiais. “Senhor” é natural no contexto de serviço à corte e o singular “seu” retoma conjuntamente os dois envolvidos.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Mantém a aposição que identifica o senhor deles e conserva a repetição enfática do hebraico.
theological_decisions:
- issue: Força moral do verbo חָטְאוּ no contexto de uma falta contra o rei
  choice: pecaram contra
  alternative: ofenderam / cometeram uma falta contra
  rationale: O contexto não especifica a natureza da infração, mas o verbo permite e favorece linguagem moral forte. A tradução conserva essa força sem definir qual pecado foi cometido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Copeiro” conserva o termo de ofício da corte; “pecaram contra” mantém deliberadamente a força do hebraico. O marcador [a] aparece no texto principal.
