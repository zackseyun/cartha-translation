  text: Mas pendurou o chefe dos padeiros[a], exatamente como José lhes havia interpretado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enforcou”. O verbo hebraico significa “pendurar”; conforme o contexto, pode referir-se à execução por suspensão, a empalamento ou à exposição de um corpo após a execução.'
