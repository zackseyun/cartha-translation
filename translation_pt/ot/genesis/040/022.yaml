lexical_decisions:
- source_word: וְאֵת
  choice: Mas
  rationale: 'A conjunção introduz contraste com o versículo anterior: o chefe dos copeiros foi restituído, mas o chefe dos padeiros foi executado. O marcador de objeto direto não é traduzido separadamente.'
- source_word: שַׂר הָאֹפִים
  choice: o chefe dos padeiros
  rationale: שַׂר designa aqui o oficial que chefiava os padeiros da corte; esta formulação é clara e idiomática em português.
- source_word: תָּלָה
  choice: mandou enforcar
  rationale: O verbo significa pendurar e, neste contexto, descreve uma execução ou exposição ordenada pelo faraó. A construção causativa natural em português deixa claro que o faraó não realizou pessoalmente o ato, sem especificar além do hebraico o método exato.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Expressa a correspondência entre o acontecimento e a interpretação anterior de José.
- source_word: פָּתַר
  choice: havia interpretado
  rationale: פתר é o verbo próprio para interpretar sonhos; o mais-que-perfeito composto indica naturalmente que a interpretação precedeu o cumprimento.
- source_word: לָהֶם
  choice: para eles
  rationale: O pronome plural remete aos dois oficiais, cujos sonhos José havia interpretado.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico יוֹסֵף.
