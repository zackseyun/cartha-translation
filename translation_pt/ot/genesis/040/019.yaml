base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: pt
  text: Daqui a três dias, o faraó levantará a sua cabeça de sobre você,[a] e pendurará você numa árvore;[b] e as aves comerão a sua carne de sobre você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “levantará a sua cabeça de sobre você”. É provavelmente um sombrio jogo de palavras com a mesma expressão usada em sentido favorável na interpretação do sonho do copeiro; aqui, ela sugere a remoção da cabeça.
    reason: lexical_alternative
  - marker: b
    text: Ou “numa peça de madeira” ou “num poste”. Em hebraico, “numa árvore”. A expressão pode referir-se a ser pendurado ou empalado numa estrutura de madeira.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Daqui a três dias
  rationale: Expressa em português natural o intervalo restante indicado por בְּעוֹד, situando o acontecimento três dias adiante.
- source_word: יִשָּׂא פַרְעֹה אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: o faraó levantará a sua cabeça, tirando-a de sobre você
  rationale: Mantém a expressão 'levantar a cabeça' e seu sombrio jogo de palavras com o uso favorável no versículo 13, enquanto 'tirando-a de sobre você' deixa perceptível neste contexto a ideia de remoção da cabeça.
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: e pendurará você numa árvore
  rationale: תלה significa pendurar, e עֵץ pode designar árvore, madeira ou um objeto de madeira. A formulação conserva a imagem lexical hebraica sem decidir se o instrumento era árvore, poste ou estaca.
- source_word: וְאָכַל הָעוֹף
  choice: e as aves comerão
  rationale: O singular coletivo hebraico é vertido naturalmente pelo plural coletivo em português; 'comerão' preserva o sentido simples e direto de אכל.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: a sua carne de sobre você
  rationale: Conserva a concretude de בשר e a repetição marcante de מֵעָלֶיךָ, retratando as aves arrancando a carne do corpo exposto.
theological_decisions:
- issue: Preservação do jogo de palavras e da violência da sentença
  choice: Manter 'levantará a sua cabeça' e esclarecer a remoção por meio de 'tirando-a de sobre você'
  alternative: Traduzir diretamente como 'mandará decapitar você'
  rationale: A alternativa explicita o provável modo de morte, mas elimina a correspondência literária com a mesma expressão empregada positivamente no versículo 13. A redação escolhida preserva a ironia narrativa e a severidade do oráculo sem transformar uma inferência contextual em formulação exclusiva.
- issue: Identificação do instrumento de exposição ou execução
  choice: numa árvore
  alternative: num poste ou numa estaca
  rationale: O hebraico עֵץ permite 'árvore' ou 'madeira' e não especifica com precisão o formato do instrumento. O texto principal mantém a imagem literal, e a nota registra as possibilidades históricas sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível sobretudo ao leitor brasileiro. A redação preserva deliberadamente a repetição incomum de 'de sobre você' e explica em nota seu valor literário. Os marcadores seguem a ordem de ocorrência no texto.
