  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: pt
  text: O faraó restabeleceu o chefe dos copeiros em sua função[a], e o copeiro pôs[b] a taça na mão do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ao seu serviço de servir bebidas”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “e ele pôs”; pelo contexto, refere-se ao copeiro.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: restabeleceu
  rationale: O hifil de שׁוּב indica fazer alguém voltar à posição anterior; “restabeleceu” expressa com naturalidade a reintegração ao cargo.
- source_word: שַׂר הַמַּשְׁקִים
  choice: o chefe dos copeiros
  rationale: שַׂר designa o principal oficial, e הַמַּשְׁקִים, os servidores de bebidas; “chefe dos copeiros” é claro e adequado ao contexto da corte.
- source_word: עַל מַשְׁקֵהוּ
  choice: em sua função
  rationale: A expressão se refere literalmente ao serviço de servir bebidas; “em sua função” comunica a restituição ao exercício desse serviço sem uma formulação artificial em português.
- source_word: וַיִּתֵּן
  choice: pôs
  rationale: Embora נָתַן frequentemente signifique “dar”, com a taça e a mão do faraó o verbo idiomático em português é “pôr”.
- source_word: הַכּוֹס
  choice: a taça
  rationale: “Taça” é uma tradução concreta e natural do recipiente usado para servir a bebida ao faraó.
- source_word: עַל כַּף פַּרְעֹה
  choice: na mão do faraó
  rationale: כַּף significa literalmente “palma da mão”, mas neste contexto “na mão” é a expressão natural em português.
theological_decisions:
- issue: Sujeito de וַיִּתֵּן
  choice: o copeiro pôs
  alternative: ele pôs
  rationale: O hebraico não repete um sujeito nominal, mas o contexto do serviço restaurado indica que o copeiro entrega a taça ao faraó. O sujeito explícito evita que o português sugira, de modo incoerente, que o faraó pôs a taça na própria mão; a forma literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Chefe dos copeiros” preserva o ambiente da corte, enquanto “em sua função” evita uma tradução excessivamente literal e pouco idiomática.
