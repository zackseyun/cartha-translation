base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: pt
  text: 'Então José lhe disse: “Esta é a interpretação: os três ramos[a] são três dias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ramos da videira”, “brotos” ou “gavinhas”; o termo hebraico admite essas nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência de modo natural em português.
- source_word: לוֹ
  choice: lhe
  rationale: Mantém o objeto pronominal explícito do hebraico sem inserir “ao copeiro” no texto principal.
- source_word: פִּתְרֹנוֹ
  choice: a interpretação
  rationale: No contexto, refere-se à interpretação do sonho. O possessivo hebraico pode ser expresso naturalmente em português pelo artigo definido, sem perda do referente contextual.
- source_word: שְׁלֹשֶׁת
  choice: os três / três
  rationale: Preserva-se a repetição do numeral na correspondência explicativa entre o símbolo e os dias.
- source_word: הַשָּׂרִגִים
  choice: ramos
  rationale: Designa os ramos, brotos ou gavinhas da videira. “Ramos” é claro e natural, sem especificar demais a imagem.
- source_word: יָמִים
  choice: dias
  rationale: Tradução direta do substantivo temporal, necessária à interpretação do símbolo.
- source_word: הֵם
  choice: são
  rationale: A oração equativa hebraica é reproduzida idiomaticamente com “são”; o pronome independente não exige a forma explícita “eles são” em português.
