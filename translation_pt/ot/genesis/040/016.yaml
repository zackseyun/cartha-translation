base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: pt
  text: 'Quando o chefe dos padeiros viu que José havia interpretado bem, disse-lhe: “Eu também tive um sonho, e eis que havia três cestos de pão branco[a] sobre a minha cabeça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “três cestos de produtos assados”. O termo hebraico חֹרִי é incerto e pode descrever o conteúdo como pão ou bolos brancos, ou os próprios cestos como trançados ou perfurados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: chefe dos padeiros
  rationale: Expressa de modo natural o cargo do oficial responsável pelos padeiros, sem recorrer a uma tradução excessivamente literal de שַׂר.
- source_word: כִּי טוֹב פָּתָר
  choice: que José havia interpretado bem
  rationale: Preserva o sentido adverbial de que a interpretação foi considerada boa ou acertada, sem restringir o termo ao sentido de “favoravelmente”.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Eu também tive um sonho
  rationale: Torna natural em português a expressão hebraica elíptica e mantém a ideia de que o padeiro acrescenta seu sonho ao relato anterior.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva o marcador de vivacidade que introduz a imagem vista no sonho, em registro literário ainda compreensível.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: três cestos de pão branco
  rationale: Adota uma interpretação tradicional e contextualmente coerente de חֹרִי, mas registra em nota a incerteza lexical e as principais alternativas.
- source_word: עַל רֹאשִׁי
  choice: sobre a minha cabeça
  rationale: Reproduz claramente a relação espacial e combina com o registro narrativo digno do versículo.
- source_word: יוֹסֵף
  choice: José
  rationale: Emprega a forma portuguesa consagrada e amplamente reconhecida do nome hebraico.
