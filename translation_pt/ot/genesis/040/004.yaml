  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: pt
  text: O capitão da guarda designou José para estar com eles[a], e ele os atendia. Eles permaneceram sob custódia por algum tempo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregou José de cuidar deles” ou “pôs José sobre eles”. O verbo hebraico pode indicar uma nomeação com responsabilidade, e a relação de José com os prisioneiros pode envolver tanto assistência quanto supervisão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e eles estiveram dias sob custódia”, expressão idiomática hebraica que indica a permanência ali durante certo período.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: designou
  rationale: O verbo פקד indica aqui uma nomeação ou atribuição de responsabilidade. “Designou” preserva essa ideia sem definir em excesso se José apenas os assistia ou também os supervisionava.
- source_word: שַׂר הַטַּבָּחִים
  choice: capitão da guarda
  rationale: Embora o título tenha sentido literal ligado a executores, no contexto de Gênesis designa um alto oficial responsável pela segurança real e por assuntos da prisão. “Capitão da guarda” é claro e tradicional sem ser excessivamente literal.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: José para ficar com eles
  rationale: A expressão relaciona José aos dois prisioneiros, literalmente “José com eles”. A formulação portuguesa mantém essa relação sem impor a interpretação mais forte de que José foi colocado sobre eles.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: e José os servia
  rationale: שרת significa servir ou prestar assistência. “Os servia” traduz diretamente a ação contínua no contexto, sem acrescentar conotação religiosa.
- source_word: וַיִּהְיוּ יָמִים
  choice: por algum tempo
  rationale: A expressão literalmente relacionada a “dias” funciona como idioma para um período não especificado. “Por algum tempo” comunica naturalmente esse sentido.
- source_word: בְּמִשְׁמָר
  choice: sob custódia
  rationale: מִשְׁמָר ressalta detenção vigiada ou confinamento. “Sob custódia” preserva essa nuance melhor que o termo mais específico “na prisão”.
