  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: pt
  text: 'E o faraó ficou irado com seus dois oficiais[a]: com o chefe dos copeiros e com o chefe dos padeiros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus dois oficiais da corte”; o termo hebraico também pode significar “eunucos” em alguns contextos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: ficou irado
  rationale: קצף expressa ira. “Ficou irado” é natural, digno e representa adequadamente o avanço narrativo do wayyiqtol sem exigir a intensidade extrema de “enfureceu-se”.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada do título real egípcio, com artigo definido natural neste contexto narrativo.
- source_word: שְׁנֵי סָרִיסָיו
  choice: seus dois oficiais
  rationale: סָרִיס pode designar um oficial da corte ou, em certos contextos, um eunuco. Como os dois homens são identificados por funções palacianas, “oficiais” comunica o sentido contextual sem afirmar uma condição física que o texto não exige.
- source_word: שַׂר הַמַּשְׁקִים
  choice: o chefe dos copeiros
  rationale: שַׂר indica o responsável ou chefe, e הַמַּשְׁקִים designa os que servem bebidas. “Chefe dos copeiros” é uma formulação clara e tradicional em português.
- source_word: שַׂר הָאוֹפִים
  choice: o chefe dos padeiros
  rationale: שַׂר indica o chefe do grupo, e הָאוֹפִים significa “os padeiros”. A expressão conserva tanto a função de liderança quanto o plural coletivo do hebraico.
- source_word: עַל ... עַל ... וְעַל
  choice: com ... com ... e com
  rationale: Após um verbo de ira, עַל introduz os alvos da ira. A repetição de “com” preserva a estrutura hebraica e os dois últimos segmentos esclarecem, por aposição, quem eram os dois oficiais.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A formulação mantém a repetição enfática das preposições do hebraico, usando dois-pontos para deixar claro que o chefe dos copeiros e o chefe dos padeiros são os dois oficiais mencionados, não pessoas adicionais.
