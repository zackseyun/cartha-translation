  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: pt
  text: E ele os pôs sob custódia na casa do comandante da guarda[a], na prisão[b], o lugar onde José estava detido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “chefe dos executores” ou “chefe dos que abatiam”.
    reason: lexical_alternative
  - marker: b
    text: A construção hebraica também pode ser entendida como “na casa do comandante da guarda, isto é, na prisão” ou “na casa do comandante da guarda, para a prisão”.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם
  choice: ele os pôs
  rationale: Embora נָתַן signifique literalmente “dar”, neste contexto significa colocar ou entregar alguém à custódia. “Os pôs” é natural e mantém explícito o sujeito masculino singular.
- source_word: בְּמִשְׁמַר
  choice: sob custódia
  rationale: מִשְׁמָר pode indicar guarda, custódia ou confinamento. “Sob custódia” expressa com clareza a situação dos dois oficiais.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: na casa do comandante da guarda
  rationale: A expressão é um título ligado a Potifar. “Comandante da guarda” é idiomático no contexto da corte egípcia, enquanto uma tradução mais literal apontaria para o chefe dos executores ou dos que abatiam.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: na prisão
  rationale: בֵּית הַסֹּהַר designa a prisão ou casa de confinamento. Após “pôs”, o português emprega naturalmente “na”; a nota preserva a possível relação sintática com a casa do comandante.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: o lugar onde José estava detido
  rationale: אָסוּר pode significar amarrado, preso ou detido. “Detido” se ajusta ao contexto carcerário sem exigir que José estivesse fisicamente amarrado; “onde” incorpora naturalmente שָׁם, “ali”.
