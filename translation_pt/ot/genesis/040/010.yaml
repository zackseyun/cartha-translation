lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: e na videira
  rationale: A conjunção e a preposição com artigo são vertidas naturalmente; em português, “na videira” expressa de modo idiomático que os ramos estavam nela.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: três ramos
  rationale: “Ramos” é claro e corrente para os brotos ou ramificações da videira, sem a especificidade excessiva de “gavinhas”.
- source_word: וְהִיא כְפֹרַחַת
  choice: Enquanto ela brotava
  rationale: Preserva o referente feminino, a videira, e comunica o valor progressivo ou temporal da expressão participial.
- source_word: עָלְתָה נִצָּהּ
  choice: suas flores surgiram
  rationale: Traduz o aparecimento da floração em português natural, mantendo a rápida sequência de desenvolvimento da videira.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: seus cachos amadureceram em uvas
  rationale: “Cachos” é o termo comum para os agrupamentos da videira; “amadureceram em uvas” conserva o uso predicativo de “uvas” e a progressão da imagem.
