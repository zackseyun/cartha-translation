  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: pt
  text: José foi até eles pela manhã, viu-os e percebeu que estavam abatidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perturbados”, “desanimados” ou “com semblante sombrio”. O hebraico descreve um estado de perturbação ou abatimento que podia ser percebido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: foi até eles
  rationale: בוא com אֲלֵיהֶם expressa movimento em direção aos dois presos. Em português narrativo, “foi até eles” é mais natural que “veio a eles” sem perder a relação direcional.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Tradução temporal corrente e natural da expressão hebraica definida.
- source_word: וַיַּרְא אֹתָם וְהִנָּם
  choice: viu-os e percebeu que estavam
  rationale: A combinação do verbo de percepção com a partícula apresentativa chama atenção para o estado que José constatou. “Percebeu que estavam” transmite essa força em português natural, sem o arcaísmo de “e eis que”.
- source_word: זֹעֲפִים
  choice: abatidos
  rationale: O particípio descreve um estado emocional visivelmente sombrio ou perturbado. “Abatidos” se ajusta ao contexto e mantém a dimensão observável, enquanto a nota registra alternativas plausíveis.
