  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: pt
  text: 'Então o chefe dos copeiros contou seu sonho a José e lhe disse: “No meu sonho, eis que havia uma videira diante de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: contou
  rationale: O piel de ספר significa contar ou relatar; “contou” é natural e mantém a construção com “seu sonho”.
- source_word: שַׂר הַמַּשְׁקִים
  choice: o chefe dos copeiros
  rationale: Designa o oficial responsável pelos que serviam bebidas; “chefe dos copeiros” é claro, historicamente adequado e corrente em português bíblico.
- source_word: אֶת חֲלֹמוֹ
  choice: seu sonho
  rationale: O substantivo com sufixo masculino singular indica diretamente o sonho do chefe dos copeiros.
- source_word: לְיוֹסֵף
  choice: a José
  rationale: A preposição לְ marca o destinatário do relato.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: “Lhe” conserva de modo natural em português o complemento explícito “a ele” do hebraico.
- source_word: בַּחֲלוֹמִי
  choice: No meu sonho
  rationale: É a forma idiomática e direta de introduzir o relato do sonho.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva o marcador de atenção hebraico e a apresentação vívida da imagem vista no sonho.
- source_word: גֶפֶן
  choice: uma videira
  rationale: O termo denota uma vinha individual ou videira; “videira” identifica com precisão a planta, sem confundi-la com o terreno cultivado.
- source_word: לְפָנָי
  choice: diante de mim
  rationale: Equivale diretamente a “perante/diante de mim”; o verbo “havia” é suprido em português para formar uma oração natural.
