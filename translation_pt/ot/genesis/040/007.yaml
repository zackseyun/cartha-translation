  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: pt
  text: 'Então ele perguntou aos oficiais[a] do faraó que estavam com ele sob custódia na casa de seu senhor: “Por que vocês estão com o rosto abatido hoje?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos eunucos”; o termo hebraico pode se referir tanto a eunucos propriamente ditos quanto, de modo mais geral, a funcionários da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Então ele perguntou
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: סְרִיסֵי פַרְעֹה
  choice: aos oficiais do faraó
  rationale: סָרִיס pode designar tanto eunucos quanto altos funcionários da corte. Neste contexto, a função cortesã está em primeiro plano; a alternativa mais específica é preservada em nota.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: Mantém a forma pronominal do hebraico; no contexto, “ele” se refere a José.
- source_word: בְמִשְׁמַר בֵּית אֲדֹנָיו
  choice: sob custódia na casa de seu senhor
  rationale: בְמִשְׁמַר indica o estado ou lugar de confinamento, enquanto בֵּית אֲדֹנָיו situa essa custódia na casa do senhor de José. “Sob custódia” é claro e idiomático.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo introduz a fala direta; em português atual, os dois-pontos cumprem essa função naturalmente sem exigir o pouco fluido “dizendo”.
- source_word: פְּנֵיכֶם רָעִים
  choice: vocês estão com o rosto abatido
  rationale: A expressão literalmente associa os rostos a algo “ruim”, mas funciona como idioma visual para uma aparência triste ou perturbada. A formulação portuguesa conserva o foco na expressão facial.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente português direto e natural da expressão temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Faraó” foi usado com artigo, conforme o uso corrente em português; “seu senhor” preserva a referência contextual ao senhor de José sem inserir o nome de Potifar no texto.
