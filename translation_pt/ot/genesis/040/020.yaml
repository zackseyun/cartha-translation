base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: pt
  text: No terceiro dia, aniversário do faraó, ele ofereceu um banquete a todos os seus servos e levantou a cabeça[a] do chefe dos copeiros e a cabeça do chefe dos padeiros no meio dos seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida literalmente por «levantou a cabeça» também pode significar, de modo mais interpretativo, «destacou» ou «levou em conta». Aqui ela é preservada porque a narrativa joga com a mesma expressão e seus resultados opostos para os dois oficiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: A fórmula narrativa introduz o acontecimento seguinte; em português natural, a expressão temporal comunica a progressão sem o calque «e aconteceu».
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: aniversário do faraó
  rationale: Equivalente moderno e direto de «dia do nascimento do faraó».
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: ele ofereceu um banquete
  rationale: מִשְׁתֶּה designa um banquete ou festa, frequentemente com bebida; «ofereceu um banquete» é idiomático e adequado ao contexto régio.
- source_word: לְכָל עֲבָדָיו
  choice: a todos os seus servos
  rationale: עֲבָדִים pode abranger servos, subordinados e oficiais da corte. «Servos» preserva a amplitude do termo sem impor que todos fossem escravos.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: levantou a cabeça de
  rationale: 'A tradução literal preserva o jogo deliberado da narrativa: a mesma expressão conduz a destinos opostos para os dois oficiais.'
- source_word: שַׂר הַמַּשְׁקִים
  choice: chefe dos copeiros
  rationale: Título cortesão para o responsável pelo serviço de bebidas; é uma formulação clara e tradicional em português.
- source_word: שַׂר הָאֹפִים
  choice: chefe dos padeiros
  rationale: Título paralelo que identifica o responsável pelos padeiros da corte.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: no meio dos seus servos
  rationale: Mantém o valor locativo e sugere que o ato ocorreu publicamente entre os membros da corte.
