  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: pt
  text: e, no cesto de cima, havia todo tipo de comida para o faraó, produtos feitos por padeiro[a]; e as aves comiam os alimentos do cesto acima da minha cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “obra de padeiro”; ou “trabalho de padeiro”, isto é, produtos preparados para o faraó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: e, no cesto de cima
  rationale: עֶלְיוֹן indica o cesto superior ou mais alto; “cesto de cima” é claro e natural em português.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: havia todo tipo de comida para o faraó
  rationale: A construção com מִכֹּל e o substantivo coletivo מַאֲכַל exprime variedade. “Para o faraó” comunica naturalmente a destinação da comida.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: feita por um padeiro
  rationale: A expressão significa literalmente “obra de padeiro” e, no contexto, caracteriza a comida como produtos preparados por um padeiro. A forma literal é preservada na nota.
- source_word: וְהָעוֹף
  choice: e as aves
  rationale: עוֹף é coletivo e designa aves ou criaturas voadoras; o plural é a forma mais natural em português neste contexto.
- source_word: אֹכֵל
  choice: comiam
  rationale: O particípio apresenta uma ação em curso na cena do sonho. O pretérito imperfeito transmite adequadamente esse aspecto contínuo.
- source_word: אֹתָם
  choice: a
  rationale: O sufixo hebraico é masculino plural e retoma os itens de comida; em português, o pronome singular feminino concorda naturalmente com o coletivo “comida” sem alterar o referente.
- source_word: מִן הַסַּל
  choice: do cesto
  rationale: 'מִן marca a procedência: as aves tiravam e comiam a comida que estava no cesto.'
- source_word: מֵעַל רֹאשִׁי
  choice: acima da minha cabeça
  rationale: מֵעַל expressa posição acima de algo, sem exigir que o cesto estivesse em contato direto com a cabeça.
