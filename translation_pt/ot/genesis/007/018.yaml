  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: pt
  text: As águas ganharam força e aumentaram muito sobre a terra, e a arca se deslocou sobre a superfície das águas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “foi sobre a face das águas”; isto é, deslocou-se sobre a superfície delas. Também pode ser traduzido: “flutuou sobre as águas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: se tornaram cada vez mais fortes
  rationale: O verbo גבר comunica aumento de força ou predomínio. A formulação natural em português preserva a intensificação progressiva das águas no relato sem reduzi-la apenas à subida do nível.
- source_word: הַמַּיִם
  choice: as águas
  rationale: O plural tradicional e natural em português é apropriado ao contexto do dilúvio e acompanha a forma hebraica.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: aumentaram muito
  rationale: רבה, intensificado por מְאֹד, indica grande aumento; a expressão é clara e corrente em português.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: אָרֶץ pode significar terra ou região. Aqui, 'terra' mantém a amplitude e também a ambiguidade lexical possível do termo.
- source_word: וַתֵּלֶךְ
  choice: se movia
  rationale: הלך significa literalmente 'ir'. Com a arca como sujeito sobre as águas, 'se movia' expressa o movimento sem acrescentar uma causa ou mecanismo não explicitado.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: É a designação consagrada, clara e contextualmente adequada para תבה no relato de Noé.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: sobre a superfície das águas
  rationale: A expressão idiomática hebraica, literalmente 'sobre a face das águas', refere-se à superfície e é vertida com naturalidade.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: região
  rationale: O substantivo hebraico admite ambos os sentidos. 'Terra' é natural neste contexto e não acrescenta ao versículo uma delimitação geográfica explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'águas' acompanha a ênfase do hebraico; a construção evita termos excessivamente técnicos ou arcaicos.
