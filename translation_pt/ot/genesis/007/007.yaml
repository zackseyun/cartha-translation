  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: pt
  text: E Noé, com seus filhos, sua mulher e as mulheres de seus filhos, entrou na arca por causa das águas do dilúvio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrou
  rationale: בוא pode significar vir, ir ou entrar conforme o contexto. Com אֶל הַתֵּבָה, “entrou” comunica naturalmente o movimento para o interior da arca.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O hebraico designa especificamente os filhos homens de Noé, e não seus descendentes ou filhos em sentido genérico.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Neste contexto, אִשָּׁה com sufixo possessivo significa a esposa de Noé. “Sua mulher” é natural, atual e fiel em português.
- source_word: נְשֵׁי בָנָיו
  choice: as mulheres de seus filhos
  rationale: Reproduz de perto a construção hebraica “as mulheres de seus filhos”; “noras” seria correto no sentido, mas menos transparente quanto à forma do original.
- source_word: אִתּוֹ
  choice: com
  rationale: A ideia de acompanhamento é expressa naturalmente pela construção inicial “Noé, com...”. Não se acrescenta “com ele” ao fim da lista, pois em português isso seria redundante sem perda de conteúdo.
- source_word: אֶל הַתֵּבָה
  choice: na arca
  rationale: Com o verbo “entrou”, a contração “na” expressa idiomaticamente em português o movimento para o interior. תֵּבָה é o termo tradicionalmente vertido por “arca” neste relato.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: 'A locução tem valor causal neste contexto: a entrada ocorreu em razão das águas do dilúvio.'
- source_word: מֵי הַמַּבּוּל
  choice: as águas do dilúvio
  rationale: Mantém explícitos os dois substantivos da expressão hebraica e usa a designação bíblica tradicional e inteligível “dilúvio”.
