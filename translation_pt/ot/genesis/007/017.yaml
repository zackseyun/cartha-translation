lexical_decisions:
- source_word: וַיְהִי
  choice: durou
  rationale: Com o sujeito “o dilúvio” e a expressão temporal “quarenta dias”, o verbo indica a duração do acontecimento. “Durou” comunica naturalmente essa função em português, enquanto a nota preserva a forma mais literal.
- source_word: הַמַּבּוּל
  choice: o dilúvio
  rationale: É a designação específica e tradicional do dilúvio de Noé, clara e natural no contexto bíblico.
- source_word: אַרְבָּעִים יוֹם
  choice: quarenta dias
  rationale: Reprodução direta da expressão de duração; o valor temporal é transmitido pelo verbo “durou”.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Mantém a relação espacial do hebraico e o sentido amplo de אֶרֶץ no contexto do dilúvio.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: as águas aumentaram
  rationale: רבה indica aumento de quantidade ou extensão; “aumentaram” é preciso e corrente em português.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: levantaram a arca
  rationale: Expressa a ação física das águas, que ergueram a arca de sua posição sobre a terra.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: Termo convencional e contextualmente preciso para a embarcação de Noé.
- source_word: וַתָּרָם
  choice: ela se elevou
  rationale: A forma feminina singular retoma “a arca” e descreve sua elevação como resultado da subida das águas.
- source_word: מֵעַל הָאָרֶץ
  choice: acima da terra
  rationale: Comunica a elevação para uma posição afastada da superfície terrestre sem acrescentar uma altura não especificada.
