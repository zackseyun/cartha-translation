    issue: «se tornaram extremamente poderosas» para גָּבְרוּ מְאֹד מְאֹד
    rationale: A perífrase acrescenta a ideia de passagem a um estado («tornaram-se»), enquanto o hebraico descreve as águas como prevalecendo com grande intensidade. Uma tradução direta conserva melhor a imagem verbal.
  - severity: low
    issue: «que havia debaixo de todos os céus»
    rationale: O imperfeito «havia» é possível, mas não é necessário e introduz uma moldura temporal ausente do particípio/oração relativa implícita. «Que estão debaixo» é uma descrição mais direta.
  - severity: low
    issue: Alternativas da nota para אֶרֶץ
    rationale: «Região» e «território» podem ocorrer em contextos específicos, mas «país» é a alternativa portuguesa mais simples e lexicalmente próxima para o sentido de terra habitada ou território.
