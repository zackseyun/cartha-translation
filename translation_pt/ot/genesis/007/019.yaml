  verdict: revise
  source_fidelity: A tradução comunica adequadamente a intensidade das águas, a abrangência sobre a terra e o cobrimento dos montes. Contudo, «se tornaram extremamente poderosas» introduz uma nuance incoativa («tornaram-se») que não é exigida por גָּבְרוּ, cujo sentido aqui é mais diretamente «prevaleceram» ou «dominaram».
  naturalness: O texto é claro, mas «as águas se tornaram extremamente poderosas sobre a terra» soa um pouco explicativo e menos idiomático do que uma formulação verbal direta. «Prevaleceram enormemente sobre a terra» preserva o registro elevado e é mais conciso.
  terminology: «Terra», «montes altos» e «céus» são escolhas aceitáveis. A nota sobre אֶרֶץ deve apresentar «país» como alternativa mais lexicalmente precisa do que «região» ou «território», sem tomar posição sobre o alcance do dilúvio.
  issues:
