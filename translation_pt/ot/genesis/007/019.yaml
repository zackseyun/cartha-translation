base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: pt
  text: E as águas prevaleceram enormemente sobre a terra[a], e todos os montes altos que estão debaixo de todos os céus[b] foram cobertos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o país». O hebraico אֶרֶץ pode referir-se à terra em sentido mais amplo ou a uma terra, país ou território, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Ou «debaixo de todo o céu».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ מְאֹד מְאֹד
  choice: se tornaram extremamente poderosas
  rationale: O verbo גבר expressa força ou predomínio, e a repetição de מְאֹד intensifica-o enfaticamente. A formulação conserva a imagem das águas adquirindo poder sem recorrer ao menos preciso «aumentaram».
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: עַל significa naturalmente «sobre», enquanto אֶרֶץ pode designar «terra» ou «região/território». «Terra» corresponde melhor à linguagem abrangente do versículo, sem eliminar a alternativa lexical indicada em nota.
- source_word: וַיְכֻסּוּ
  choice: foram cobertos
  rationale: A forma passiva hebraica descreve os montes sendo cobertos. O passivo português reproduz com clareza tanto a estrutura quanto o resultado.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: todos os montes altos
  rationale: «Montes» abrange naturalmente elevações grandes e é uma correspondência corrente para הָרִים; «altos» traduz diretamente גְּבֹהִים.
- source_word: אֲשֶׁר תַּחַת כָּל הַשָּׁמָיִם
  choice: que havia debaixo de todos os céus
  rationale: O relativo אֲשֶׁר liga os montes à expressão locativa; «que havia» torna essa relação natural em português. «Todos os céus» conserva o plural morfológico e a abrangência da expressão hebraica.
theological_decisions:
- issue: Alcance de אֶרֶץ no relato do dilúvio
  choice: terra
  alternative: região ou território
  rationale: A expressão «debaixo de todos os céus» apresenta o acontecimento em termos abrangentes dentro da narrativa. «Terra» preserva essa apresentação, enquanto a nota registra a amplitude semântica de אֶרֶץ sem decidir questões científicas externas ao texto.
- issue: Forma de תַּחַת כָּל הַשָּׁמָיִם
  choice: debaixo de todos os céus
  alternative: debaixo de todo o céu
  rationale: A opção principal mantém o plural hebraico e sua formulação abrangente; a alternativa idiomática permanece semanticamente possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade à estrutura hebraica. «Extremamente poderosas» comunica a intensificação enfática sem achatar a imagem verbal de força. Os marcadores seguem imediatamente as expressões a que se referem.
