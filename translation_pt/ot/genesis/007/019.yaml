revisions:
- from: E as águas se tornaram extremamente poderosas sobre a terra[a], e todos os montes altos que havia debaixo de todos os céus[b] foram cobertos.
  to: E as águas prevaleceram enormemente sobre a terra[a], e todos os montes altos que estão debaixo de todos os céus[b] foram cobertos.
  rationale: A revisão substitui uma construção incoativa e explicativa por «prevaleceram enormemente», que traduz de modo mais direto גָּבְרוּ e a intensificação de מְאֹד מְאֹד. Também torna a oração relativa mais direta e ajusta a nota lexical de אֶרֶץ, preservando a ambiguidade semântica sem impor uma conclusão sobre o alcance do dilúvio.
