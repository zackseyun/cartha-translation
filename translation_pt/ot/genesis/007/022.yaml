  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: pt
  text: Tudo o que estava em terra seca e em cujas narinas havia o fôlego de vida[a] morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: «o fôlego do espírito de vida».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tudo o que
  rationale: Expressa de modo abrangente todos os seres que atendem à condição descrita, incluindo seres humanos e animais.
- source_word: נִשְׁמַת
  choice: sopro
  rationale: No contexto, designa o fôlego vital; “sopro” é natural e preserva a imagem concreta da respiração.
- source_word: רוּחַ
  choice: espírito
  rationale: Mantém o segundo elemento da expressão hebraica e sua possível distinção de נִשְׁמַת, sem reduzir silenciosamente a formulação a apenas “sopro de vida”.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja morfologicamente plural, o substantivo tem aqui o sentido idiomático singular de “vida”.
- source_word: בְּאַפָּיו
  choice: em cujas narinas
  rationale: Reproduz a construção relativa e o sentido distributivo do singular hebraico com uma formulação portuguesa natural.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: Tudo o que estava em terra seca
  rationale: Delimita o enunciado aos seres terrestres, em contraste implícito com a vida aquática, preservando a abrangência de מִכֹּל אֲשֶׁר.
- source_word: חָרָבָה
  choice: terra seca
  rationale: Indica a superfície não coberta pelas águas e se ajusta claramente ao contexto do dilúvio.
- source_word: מֵתוּ
  choice: morreu
  rationale: Traduz diretamente o verbo; o singular concorda naturalmente em português com “Tudo o que”.
theological_decisions:
- issue: Relação entre “sopro” e “espírito” em נִשְׁמַת רוּחַ חַיִּים
  choice: sopro do espírito de vida
  alternative: sopro de vida
  rationale: O texto principal preserva a expressão hebraica mais completa e sua ambiguidade lexical, sem impor uma leitura metafísica específica; a forma idiomática mais condensada aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo a delimitação à terra seca e a formulação hebraica mais plena no texto principal.
