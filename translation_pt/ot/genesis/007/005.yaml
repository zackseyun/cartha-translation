  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: pt
  text: E Noé fez tudo conforme Yahweh lhe havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem sentido amplo, «fazer». Neste contexto de obediência a uma ordem, «fez» é natural e preserva a formulação simples do hebraico.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico נֹחַ.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: A expressão indica conformidade completa com aquilo que foi ordenado. «Fez tudo conforme» comunica naturalmente tanto a totalidade quanto a correspondência expressa por כְּ.
- source_word: צִוָּהוּ
  choice: lhe havia ordenado
  rationale: צוה significa «ordenar, dar ordem». O mais-que-perfeito composto assinala com naturalidade que a ordem precedeu a ação de Noé; «lhe» representa o sufixo de terceira pessoa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome próprio e corresponde mais de perto à vocalização geralmente reconstruída.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem «fez tudo conforme» evita a construção pouco natural «fez conforme tudo» sem perder a ideia hebraica de conformidade integral.
