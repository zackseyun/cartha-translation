lexical_decisions:
- source_word: וַיְהִי הַגֶּשֶׁם
  choice: E a chuva caiu
  rationale: Embora a construção hebraica diga mais literalmente que a chuva 'esteve' ou 'aconteceu', 'caiu' expressa naturalmente em português a ocorrência contínua da chuva no contexto, sem alterar o sentido.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Reproduz de modo direto a preposição e o substantivo hebraicos; aqui 'terra' se refere ao mundo terrestre atingido pela chuva.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: durante quarenta dias e quarenta noites
  rationale: O acréscimo idiomático de 'durante' torna explícito em português o valor temporal da expressão hebraica, mantendo sua duração exata.
