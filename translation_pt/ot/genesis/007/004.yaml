- from: Pois, daqui a mais sete dias[a], farei chover sobre a terra durante quarenta dias e quarenta noites; e apagarei[b] da face do solo[c] todo ser vivo que fiz.
  to: Pois daqui a sete dias farei chover sobre a terra durante quarenta dias e quarenta noites, e apagarei da face do solo todo ser vivo que fiz.
  rationale: A revisão limita-se a substituir a expressão temporal menos idiomática por «daqui a sete dias» e a ajustar a pontuação. O sentido, a ordem lógica e as distinções lexicais relevantes do hebraico são preservados; as notas foram atualizadas para não reintroduzir «mais» como se fosse exigido pela tradução portuguesa.
