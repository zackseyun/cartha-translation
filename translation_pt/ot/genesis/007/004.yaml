base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: pt
  text: Pois daqui a sete dias farei chover sobre a terra durante quarenta dias e quarenta noites, e apagarei da face do solo todo ser vivo que fiz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da ordem dada no versículo anterior e mantém a ligação explicativa de modo natural.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: daqui a mais sete dias
  rationale: Expressa o intervalo restante antes do início da chuva; a formulação é idiomática em português e preserva o sentido temporal do hebraico.
- source_word: אָנֹכִי מַמְטִיר
  choice: farei chover
  rationale: O hifil de מטר indica ação causativa. A expressão preserva de forma clara e natural a agência divina.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Terra” comunica o alcance amplo sugerido pelo contexto e distingue אֶרֶץ de אֲדָמָה no fim do versículo.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: durante quarenta dias e quarenta noites
  rationale: A preposição “durante” explicita naturalmente em português a duração indicada pela expressão hebraica.
- source_word: וּמָחִיתִי
  choice: e apagarei
  rationale: מחה evoca apagar, eliminar por completo ou fazer desaparecer. “Apagarei” preserva a imagem verbal sem recorrer a uma formulação excessivamente técnica.
- source_word: כָּל הַיְקוּם
  choice: todo ser vivo
  rationale: No contexto do dilúvio, a expressão designa coletivamente aquilo que vive ou subsiste sobre o solo; evita o exagero de “toda a existência”.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que fiz
  rationale: O pretérito perfeito é natural em português e remete diretamente ao ato criador de Deus.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face do solo
  rationale: Preserva a imagem hebraica e mantém a distinção lexical entre אֶרֶץ, “terra”, e אֲדָמָה, “solo”.
theological_decisions:
- issue: Alcance do juízo do dilúvio em אֶרֶץ e כָּל הַיְקוּם
  choice: 'Empregar linguagem ampla: “terra” e “todo ser vivo”.'
  alternative: Traduzir אֶרֶץ por “região” ou “terra” em sentido local e restringir explicitamente o alcance.
  rationale: A formulação hebraica é abrangente neste contexto. A tradução preserva essa força sem transformar o versículo em uma afirmação moderna, científica ou denominacional sobre a extensão geográfica do dilúvio.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Daqui a mais sete dias” é corrente e claro; “farei chover” preserva a agência divina; “apagarei” mantém a imagem concreta do hebraico. O ponto e vírgula separa com clareza a chuva anunciada de seu resultado judicial.
