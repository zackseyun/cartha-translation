  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: pt
  text: 'E morreu toda carne que se movia sobre a terra: aves, animais domésticos, animais selvagens, todas as criaturas que fervilham sobre a terra e toda a humanidade.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todo o adam”, isto é, a humanidade coletivamente.'
    reason: Esclarece a forma hebraica e o sentido coletivo de הָאָדָם.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: morreu
  rationale: O verbo גוע denota morrer ou expirar. “Morreu” é direto, natural e mantém a concordância com o sujeito coletivo “toda carne”.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Preserva a expressão hebraica e sua repetição no relato do dilúvio, referindo-se aqui ao conjunto da vida terrestre animada enumerada em seguida.
- source_word: הָרֹמֵשׂ
  choice: que se movia
  rationale: רמש pode indicar mover-se, rastejar ou fervilhar. O termo amplo é apropriado porque a enumeração inclui aves e várias classes de animais.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: É uma formulação natural e conserva o alcance espacial do hebraico sem restringir אֶרֶץ a uma região específica.
- source_word: בָּעוֹף
  choice: aves
  rationale: עוֹף pode abranger criaturas voadoras, mas “aves” é a designação corrente e adequada nesta classificação.
- source_word: וּבַבְּהֵמָה
  choice: animais domésticos
  rationale: בְּהֵמָה, em contraste com חַיָּה, designa aqui os animais terrestres domesticados; esta opção é mais abrangente do que “gado”.
- source_word: וּבַחַיָּה
  choice: animais selvagens
  rationale: No contraste classificatório com בְּהֵמָה, חַיָּה indica os animais terrestres não domesticados.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: todo animal rastejante que se arrasta
  rationale: שֶׁרֶץ e o particípio cognato descrevem pequenos animais que rastejam ou proliferam. A repetição em português procura refletir a figura etimológica hebraica de modo inteligível.
- source_word: וְכֹל הָאָדָם
  choice: e toda a humanidade
  rationale: הָאָדָם tem sentido coletivo neste contexto e designa a raça humana, não apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Sentido coletivo de הָאָדָם
  choice: toda a humanidade
  alternative: todos os seres humanos; todo homem
  rationale: O artigo e o contexto favorecem a referência coletiva ao gênero humano. “Toda a humanidade” comunica isso sem restringir a frase aos homens nem introduzir uma interpretação individualizante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o hebraísmo “toda carne” por sua importância contextual, enquanto as categorias animais são expressas em linguagem corrente.
