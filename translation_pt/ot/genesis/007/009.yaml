  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: pt
  text: De dois em dois vieram a Noé para a arca, macho e fêmea, conforme Deus havia ordenado a Noé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: de dois em dois
  rationale: A repetição do numeral tem sentido distributivo e indica que os animais vieram em pares. A expressão portuguesa preserva tanto esse sentido quanto a ênfase inicial do hebraico.
- source_word: בָּאוּ
  choice: vieram
  rationale: O verbo בוא indica movimento de chegada ou entrada. “Vieram” mantém a perspectiva narrativa voltada para Noé, sem substituir o verbo comum por uma explicitação interpretativa.
- source_word: אֶל נֹחַ
  choice: até Noé
  rationale: אֶל marca movimento em direção a Noé. “Até Noé” comunica claramente a chegada ao destino.
- source_word: אֶל הַתֵּבָה
  choice: para dentro da arca
  rationale: Embora אֶל possa significar simplesmente “para”, o contexto de movimento e o destino indicado pela arca favorecem a ideia de entrada. A formulação preserva a sequência do hebraico sem acrescentar outro verbo.
- source_word: זָכָר וּנְקֵבָה
  choice: macho e fêmea
  rationale: É a designação biológica direta no contexto dos animais e corresponde de modo natural e conciso ao hebraico.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: A conjunção expressa correspondência com a ordem divina anterior. “Conforme” é natural e digna em português.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: Deus havia ordenado a Noé
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à chegada dos animais, e a repetição de “Noé” preserva sem ambiguidade o objeto da ordem.
theological_decisions:
- issue: Agência na chegada dos animais
  choice: O texto afirma que os animais vieram a Noé em conformidade com a ordem anterior de Deus, sem explicar o mecanismo dessa chegada.
  alternative: Explicitar que vieram por instinto ou que foram conduzidos exclusivamente por Noé.
  rationale: A tradução conserva a relação entre a chegada e a ordem divina, mas não acrescenta uma explicação causal ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem inicial “De dois em dois” conserva a ênfase do hebraico; “para dentro da arca” retém a direção do movimento sem introduzir um segundo verbo.
