  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: pt
  text: Ele apagou[a] todo ser vivo que havia sobre a face do solo, desde o ser humano[b] até os animais domésticos, os animais que rastejam e as aves do céu[c]. Todos foram apagados da terra; só Noé restou, juntamente com tudo o que estava com ele na arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “eliminou”. O verbo hebraico traz a imagem de limpar ou apagar algo.
    reason: lexical_alternative
  - marker: b
    text: Hebraico adam, aqui em sentido representativo da humanidade; também seria possível traduzir “a humanidade”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “as aves dos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: apagou / foram apagados
  rationale: O verbo מחה evoca o ato de apagar, limpar ou remover. “Apagou” preserva essa imagem melhor que o termo mais genérico “destruiu”; a segunda ocorrência reflete a forma passiva hebraica.
- source_word: כָּל הַיְקוּם
  choice: todo ser vivo
  rationale: No contexto do dilúvio, היקום designa os seres existentes sobre o solo, e não a existência em sentido abstrato. A expressão escolhida é clara e natural em português.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face do solo
  rationale: Mantém a imagem idiomática hebraica e distingue אֲדָמָה, o solo, de אֶרֶץ, a terra, na oração seguinte.
- source_word: מֵאָדָם
  choice: desde o ser humano
  rationale: אָדָם tem aqui sentido representativo da humanidade e inicia a enumeração das categorias de seres vivos. “Ser humano” comunica isso sem restringir a referência ao sexo masculino.
- source_word: בְּהֵמָה
  choice: animais domésticos
  rationale: בְּהֵמָה refere-se aqui principalmente aos animais terrestres domesticados; a expressão é corrente e menos estreita que “gado”.
- source_word: רֶמֶשׂ
  choice: animais que rastejam
  rationale: A expressão descreve pequenas criaturas que se movem junto ao chão e conserva a imagem concreta do hebraico.
- source_word: עוֹף הַשָּׁמַיִם
  choice: aves do céu
  rationale: “Céu” é a forma natural em português para שָׁמַיִם neste sintagma e preserva a linguagem da narrativa da criação.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar “terra” ou “região”. “Da terra” reproduz diretamente a formulação abrangente da narrativa sem transformar o verso em uma declaração científica explícita.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: restaram apenas Noé
  rationale: A construção comunica o sentido restritivo de אַךְ e o valor de שׁאר, “restar, permanecer”. O verbo no plural acomoda naturalmente o sujeito composto que prossegue na oração.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: e os que estavam com ele na arca
  rationale: A expressão verte naturalmente a oração relativa e mantém “arca”, tradução tradicional e clara de תֵּבָה na narrativa de Noé.
theological_decisions:
- issue: Alcance da destruição na linguagem do dilúvio
  choice: Traduzir diretamente a afirmação abrangente sobre os seres vivos terrestres enumerados e sua remoção da terra.
  alternative: Ler a linguagem como hipérbole regional ou ampliá-la para uma formulação científica explicitamente global.
  rationale: O texto deve conservar a força narrativa e a abrangência da formulação hebraica sem decidir, por meio da tradução, debates posteriores sobre a extensão geográfica do dilúvio.
- issue: Referência de אָדָם
  choice: “o ser humano”, em sentido coletivo e representativo
  alternative: “o homem”, que pode ser entendido como referência exclusivamente masculina
  rationale: Neste contexto, אָדָם representa a humanidade como uma categoria entre os seres vivos; a escolha mantém esse alcance sem impor uma distinção de sexo ausente do verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “apagou/foram apagados” conserva a ênfase e a imagem lexical do hebraico. “Sobre a face do solo” retém o tom literário sem recorrer a linguagem arcaica.
