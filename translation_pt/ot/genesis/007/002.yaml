  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: pt
  text: De todos os animais puros, tome para si sete pares[a], cada macho com sua fêmea; e dos animais que não são puros, dois[b], um macho e sua fêmea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sete sete, um macho e sua fêmea”. É provável que isso signifique sete pares, embora alguns entendam sete animais individuais.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “animais impuros”. O hebraico diz “animais que não são puros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: De todos os animais
  rationale: A combinação מִן + כֹּל indica o conjunto do qual os animais devem ser tomados. O plural é natural em português e mantém o sentido distributivo do coletivo hebraico בְּהֵמָה.
- source_word: הַטְּהוֹרָה
  choice: puros
  rationale: “Puro” é o termo bíblico corrente em português para a distinção entre animais puros e impuros; evita acrescentar “cerimonialmente”, ideia não explicitada no texto.
- source_word: תִּקַּח לְךָ
  choice: leve com você
  rationale: O imperfeito tem força instrutiva. “Com você” representa o dativo לְךָ de modo natural no contexto da entrada na arca.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: sete pares
  rationale: A repetição do numeral, seguida da fórmula de pareamento, indica mais provavelmente sete unidades formadas por macho e fêmea. A tradução clara no texto é acompanhada de nota que preserva a leitura literal e a alternativa interpretativa.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: cada macho com sua fêmea / o macho e sua fêmea
  rationale: Embora as palavras signifiquem literalmente “homem e sua mulher”, aplicadas a animais formam uma expressão idiomática de pareamento sexual. “Macho” e “fêmea” comunicam isso naturalmente sem antropomorfismo indevido.
- source_word: וּמִן הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: e dos animais que não são puros
  rationale: Mantém a formulação analítica do hebraico, “que não são puros”, em vez de substituí-la silenciosamente por “impuros”.
- source_word: שְׁנַיִם
  choice: dois
  rationale: Traduz diretamente o numeral hebraico; a expressão seguinte esclarece que se trata de macho e fêmea.
theological_decisions:
- issue: Sentido da expressão numérica referente aos animais puros
  choice: sete pares de animais puros
  alternative: sete animais puros; literalmente, “sete sete”
  rationale: שִׁבְעָה שִׁבְעָה, seguida de אִישׁ וְאִשְׁתּוֹ, sugere fortemente sete pares de macho e fêmea, em contraste com os dois animais não puros. Como a forma hebraica admite discussão e há quem entenda sete indivíduos, a alternativa é registrada em nota.
- issue: Terminologia da distinção entre animais
  choice: puros / não puros
  alternative: limpos / impuros
  rationale: “Puros” é natural no registro bíblico português, enquanto “não são puros” conserva a assimetria lexical do hebraico sem explicar a distinção como necessariamente cerimonial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Leve” expressa a ordem de modo natural; “com você” conserva לְךָ. A redação evita tanto o arcaísmo “bestas” quanto a especificação excessiva “cerimonialmente puros”.
