base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: pt
  text: Dos animais puros e dos animais que não são puros[a], das aves e de tudo o que rasteja sobre o solo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que são impuros». O hebraico diz mais literalmente «que não são puros».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: dos / das / de
  rationale: A preposição indica procedência ou pertencimento às categorias enumeradas. Sua repetição mantém a estrutura e o ritmo catalogal do hebraico, com contrações naturais em português.
- source_word: בְּהֵמָה
  choice: animais
  rationale: Neste contexto, o termo funciona como categoria ampla, em contraste com aves e criaturas rastejantes, não se limitando necessariamente a animais domésticos.
- source_word: טְּהוֹרָה
  choice: puros
  rationale: “Puros” comunica a classificação ritual e concorda naturalmente com “animais”; evita sugerir mera limpeza física.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: que não eram puros
  rationale: Preserva a negação analítica do hebraico, em vez de substituí-la diretamente pelo antônimo “impuros”.
- source_word: עוֹף
  choice: aves
  rationale: É a designação portuguesa corrente e digna para esta categoria de criaturas voadoras no contexto.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: tudo o que rasteja
  rationale: Mantém o caráter verbal da expressão hebraica e oferece uma formulação clara e natural.
- source_word: עַל הָאֲדָמָה
  choice: sobre o solo
  rationale: Representa o chão ou a superfície terrestre como habitat dessas criaturas e conserva a preposição do texto-fonte.
theological_decisions: []
