  text: Depois de sete dias[a], as águas do dilúvio vieram sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “E aconteceu que, depois de sete dias, as águas do dilúvio estavam sobre a terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terra”, no sentido de “o país” ou “a região”. O termo hebraico אֶרֶץ pode significar “terra” ou “país/região”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Depois de sete dias
  rationale: A construção introduz o acontecimento seguinte quando se completa o período indicado. Esta formulação natural em português comunica a progressão temporal sem o pouco idiomático «e aconteceu ao fim de sete dias».
- source_word: וּמֵי הַמַּבּוּל
  choice: as águas do dilúvio
  rationale: O substantivo מַיִם, em construção com o termo definido seguinte, forma a expressão definida «as águas do dilúvio». «Dilúvio» é claro, corrente na tradição bíblica em português e distingue este evento de uma inundação comum.
- source_word: הָיוּ עַל
  choice: vieram sobre
  rationale: Embora a expressão seja literalmente «estavam sobre», neste contexto narrativo ela assinala o início da presença das águas sobre a terra. «Vieram sobre» conserva esse valor eventivo e soa natural em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região ou território. No contexto do relato do dilúvio, «a terra» é a leitura principal mais adequada, mantendo-se a alternativa lexical em nota.
theological_decisions:
- issue: Alcance de אֶרֶץ no relato do dilúvio
  choice: a terra
  alternative: o território / a região
  rationale: O substantivo hebraico admite ambos os sentidos. O contexto favorece «a terra» como texto principal, mas a tradução não deve transformar essa escolha contextual numa resolução de todos os debates sobre o alcance geográfico do dilúvio; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência narrativa, enquanto a formulação hebraica mais literal e a ambiguidade de אֶרֶץ foram preservadas nas notas.
