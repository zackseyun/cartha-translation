  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: pt
  text: E os que entraram, macho e fêmea de toda carne[a], entraram como Deus lhe havia ordenado; e Yahweh o encerrou.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «toda carne» é uma forma coletiva de se referir aos seres vivos.
    reason: cultural_note
  - marker: b
    text: 'Ou: «Yahweh fechou atrás dele». O hebraico não menciona explicitamente a porta ou a entrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: E os que entraram ... entraram
  rationale: Reproduz a construção hebraica com o particípio substantivado seguido do verbo finito, embora a repetição seja marcada em português.
- source_word: זָכָר וּנְקֵבָה
  choice: macho e fêmea
  rationale: No contexto dos animais, esta é a forma portuguesa corrente e precisa para a distinção sexual expressa pelo hebraico.
- source_word: מִכָּל בָּשָׂר
  choice: dentre toda carne
  rationale: Mantém a imagem coletiva de בָּשָׂר, usada aqui para os seres vivos, e expressa a força partitiva de מִן por meio de «dentre».
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: como Deus lhe havia ordenado
  rationale: «Ordenado» preserva a força de צוה; o mais-que-perfeito composto deixa clara, de modo natural, a anterioridade da ordem.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: e Yahweh fechou atrás dele
  rationale: Preserva a ausência de objeto explícito no hebraico e a relação espacial de בַּעֲדוֹ, sem acrescentar «a porta» ou «a entrada».
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega o nome divino pessoal, não o título אֲדֹנָי; a transliteração preserva essa distinção.
- issue: Objeto implícito de וַיִּסְגֹּר
  choice: fechou atrás dele
  alternative: fechou a porta atrás dele / encerrou-o lá dentro
  rationale: O contexto sugere a porta ou entrada da arca, mas o hebraico não a nomeia. A tradução mantém essa elipse e a nota esclarece as possibilidades.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «entraram» foi mantida para refletir a estrutura enfática do hebraico; «toda carne» conserva a imagem original, esclarecida em nota.
