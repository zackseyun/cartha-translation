  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: pt
  text: As águas subiram quinze côvados mais alto, e os montes foram cobertos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ
  choice: subiram
  rationale: Neste contexto, o verbo descreve as águas aumentando e alcançando maior altura; “subiram” comunica naturalmente esse movimento em português, sem o sentido potencialmente enganoso de vitória de “prevaleceram”.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: quinze côvados
  rationale: Mantém a unidade de medida do texto hebraico sem introduzir uma conversão aproximada no corpo do versículo.
- source_word: מִלְמַעְלָה
  choice: mais
  rationale: Expressa a ideia adverbial de altura adicional (“mais acima/mais alto”) de modo natural e preserva a formulação concisa, sem acrescentar explicitamente “acima dos montes”, relação que o hebraico deixa implícita.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: e os montes ficaram cobertos
  rationale: Reproduz a construção passiva e a coordenação do hebraico em português claro e digno.
theological_decisions:
- issue: Referência dos quinze côvados
  choice: Não explicitar no texto que a medida era acima do topo dos montes
  alternative: “As águas subiram quinze côvados acima dos montes”
  rationale: Embora essa seja uma interpretação antiga e plausível, a sintaxe hebraica afirma a elevação das águas e depois que os montes foram cobertos, sem formular expressamente “acima dos montes”. A tradução preserva essa margem de ambiguidade.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com “côvados” mantido por precisão histórica. A redação evita tanto o arcaísmo “prevaleceram” quanto uma conversão métrica interpretativa.
