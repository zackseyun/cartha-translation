base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: pt
  text: Vieram a Noé para dentro da arca, de dois em dois, de toda carne em que havia o sopro de vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o espírito de vida”. A palavra hebraica רוּחַ pode significar “sopro”, “vento” ou “espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Eles vieram
  rationale: O wayyiqtol de בוא expressa movimento narrativo no passado; “vieram” preserva naturalmente o ponto de referência em Noé.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: até Noé, para dentro da arca
  rationale: A repetição de אֶל indica os destinos do movimento. “Até Noé” conserva a aproximação à pessoa, e “para dentro da arca” explicita o ingresso exigido pelo contexto sem fundir as duas expressões.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: de dois em dois
  rationale: A repetição do numeral tem valor distributivo; esta é uma expressão portuguesa clara e corrente para a formação de pares.
- source_word: מִכָּל הַבָּשָׂר
  choice: dentre toda carne
  rationale: “Carne” preserva o sentido literal e a ressonância temática de בָּשָׂר no relato do dilúvio; “dentre” comunica que vieram representantes do conjunto, sem sugerir que toda criatura entrou.
- source_word: אֲשֶׁר בּוֹ
  choice: em que havia
  rationale: Mantém de perto a construção relativa hebraica e concorda naturalmente com “carne” em português.
- source_word: רוּחַ חַיִּים
  choice: o sopro de vida
  rationale: No contexto dos seres animados, “sopro” é o sentido mais provável de רוּחַ; חַיִּים, embora formalmente plural, integra a expressão idiomática “vida”.
theological_decisions:
- issue: Sentido de רוּחַ em רוּחַ חַיִּים
  choice: sopro de vida
  alternative: espírito de vida
  rationale: O contexto zoológico e criacional favorece a respiração vital, mas רוּחַ também pode significar “espírito”; a alternativa é preservada em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva “toda carne” por sua importância temática e usa “de dois em dois” como equivalente distributivo natural.
