  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: pt
  text: 'Então Yahweh disse a Noé: “Entre na arca, você e todos os de sua casa, pois vi que você é justo diante de mim nesta geração.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: בֹּא
  choice: Entre
  rationale: O imperativo pode significar “vir” ou “entrar”; com “na arca”, “Entre” é conciso e idiomático.
- source_word: בֵּיתְךָ
  choice: toda a sua família
  rationale: Neste contexto, “casa” designa as pessoas da unidade familiar, não o edifício. “Família” é a forma mais clara e corrente em português.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: “Arca” é o termo tradicional e contextualmente preciso para a embarcação de Noé.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e mantém uma ligação causal natural em discurso direto.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico apresenta a avaliação divina como realizada; o pretérito perfeito português preserva esse aspecto sem acrescentar interpretação.
- source_word: צַדִּיק
  choice: justo
  rationale: “Justo” é a correspondência portuguesa consagrada e lexicalmente adequada para צַדִּיק.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Reproduz de modo natural o idioma hebraico de avaliação na presença ou aos olhos de Deus.
- source_word: בַּדּוֹר הַזֶּה
  choice: nesta geração
  rationale: Refere-se à geração contemporânea de Noé e mantém a formulação do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Sentido da justiça de Noé
  choice: vi que você é justo diante de mim
  alternative: considerei você justo diante de mim; vi que somente você é justo diante de mim
  rationale: A tradução conserva a avaliação declarada por Deus, sem acrescentar exclusividade nem explicar a base teológica dessa justiça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no discurso dirigido a Noé e “família” no sentido social de בַּיִת. Não são necessárias notas de rodapé neste versículo.
