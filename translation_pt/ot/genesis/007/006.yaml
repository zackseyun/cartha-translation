translation:
  language: pt
  text: Noé tinha seiscentos anos, e as águas do dilúvio estavam sobre a terra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre a região” ou “sobre o território”. O termo hebraico pode significar tanto “terra” em sentido amplo quanto uma terra ou região.'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “e o dilúvio era águas sobre a terra”. A redação do texto principal expressa em português natural a estrutura hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Noé
  rationale: O nome נֹחַ recebe sua forma portuguesa consagrada. A conjunção וְ é representada pela ligação entre as orações, sem acrescentar um marcador temporal como “então” ou “ora”.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: tinha seiscentos anos
  rationale: A expressão hebraica, literalmente “filho de seiscentos anos”, é o modo idiomático de indicar idade; em português corrente, “tinha seiscentos anos” comunica naturalmente o mesmo sentido.
- source_word: וְ/הַ/מַּבּוּל ... מַיִם
  choice: e as águas do dilúvio
  rationale: A formulação reúne o sujeito “o dilúvio” e o predicativo “águas” numa expressão portuguesa natural, sem omitir a referência explícita à água.
- source_word: הָיָה
  choice: estavam
  rationale: O verbo היה tem aqui o sentido básico de “estar/ser”. O plural concorda com “as águas” na reestruturação idiomática portuguesa e evita acrescentar a ideia de chegada ou de começo.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: עַל significa “sobre”, enquanto הָאָרֶץ pode designar a terra em sentido amplo ou uma terra/região. O contexto favorece “a terra”, mantendo-se a alternativa em nota.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a região / o território
  rationale: O substantivo hebraico admite tanto um sentido amplo (“terra”) quanto um sentido territorial (“terra, região”). O texto principal segue o alcance mais amplo sugerido pelo contexto do dilúvio, mas a nota preserva a ambiguidade lexical sem decidir uma questão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dilúvio” preserva o termo narrativo tradicional e específico, enquanto “estavam sobre” evita introduzir verbos interpretativos como “chegaram” ou “cobriam”.
