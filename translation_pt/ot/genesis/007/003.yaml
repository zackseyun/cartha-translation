  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: pt
  text: Também das aves do céu, sete e sete[a], macho e fêmea, para manter viva a descendência sobre a face de toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sete pares”. O hebraico diz literalmente “sete, sete”, expressão distributiva que pode ser entendida como sete de cada espécie ou sete pares; o texto principal preserva mais de perto a forma hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Acrescenta as aves à ordem anterior de levar os animais, preservando de modo natural a continuidade do discurso.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: das aves do céu
  rationale: עוֹף designa aqui as aves, e שָׁמַיִם tem o sentido contextual de céu; a formulação é clara e conserva a imagem hebraica.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: sete e sete
  rationale: A repetição do numeral tem valor distributivo. A tradução mantém a forma incomum do hebraico sem decidir silenciosamente entre sete exemplares e sete pares.
- source_word: זָכָר וּנְקֵבָה
  choice: macho e fêmea
  rationale: Reproduz diretamente a expressão de distinção sexual empregada no texto, mantendo o singular coletivo do hebraico.
- source_word: לְחַיּוֹת זֶרַע
  choice: para manter viva a descendência
  rationale: O infinitivo no hifil expressa preservação da vida, e זֶרַע, literalmente 'semente', refere-se aqui à continuidade reprodutiva dos animais.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sobre a face de toda a terra
  rationale: Preserva a imagem espacial da expressão hebraica e sua cadência bíblica, permanecendo compreensível em português atual.
