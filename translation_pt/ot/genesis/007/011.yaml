source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: pt
  text: No ano seiscentos da vida de Noé, no segundo mês, no décimo sétimo dia do mês, naquele mesmo dia, romperam-se todas as fontes do grande abismo[a], e abriram-se as janelas dos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mananciais do grande abismo”.
    reason: Alternativa lexical para מַעְיְנֹת.
  - marker: b
    text: Ou “comportas dos céus”.
    reason: Alternativa contextual para אֲרֻבֹּת, enfatizando as aberturas pelas quais as águas descem.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: No ano seiscentos da vida de Noé
  rationale: Reproduz com naturalidade a fórmula hebraica de datação pela duração da vida de Noé; o cardinal com valor ordinal é idiomático em português nesse tipo de expressão.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo mês
  rationale: Equivalência direta e natural da expressão temporal hebraica.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo sétimo dia do mês
  rationale: Expressa em português idiomático a data que o hebraico formula com numeral cardinal.
- source_word: בַּיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: Mantém a retomada enfática do dia exato já especificado, sem a rigidez menos natural de uma tradução estritamente demonstrativa.
- source_word: נִבְקְעוּ
  choice: romperam-se
  rationale: Comunica a ideia do nifal de בקע, isto é, fender-se ou abrir-se por ruptura, com força adequada ao contexto catastrófico.
- source_word: כָּל מַעְיְנֹת
  choice: todas as fontes
  rationale: מַעְיָן designa uma fonte ou nascente de água. “Fontes” é claro, conciso e preserva a imagem do texto.
- source_word: תְּהוֹם רַבָּה
  choice: o grande abismo
  rationale: “Abismo” representa o תְּהוֹם das águas profundas ou primordiais, enquanto “grande” conserva o adjetivo intensificador רַבָּה.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: e as janelas dos céus
  rationale: Preserva a imagem concreta de אֲרֻבּוֹת e o plural hebraico שָׁמַיִם, evitando substituir a metáfora antiga por uma explicação moderna.
- source_word: נִפְתָּחוּ
  choice: abriram-se
  rationale: Forma natural em português para o evento expresso pelo nifal, mantendo o paralelismo com “romperam-se”.
theological_decisions:
- issue: Imaginário cósmico das águas do dilúvio
  choice: Conservar “grande abismo” e “janelas dos céus” como imagens do texto hebraico.
  alternative: Explicitar como “águas subterrâneas” e “comportas do céu”.
  rationale: O versículo emprega linguagem cosmológica antiga com função narrativa e teológica própria. A tradução não deve convertê-la silenciosamente em descrição científica moderna nem eliminar sua tensão imagética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe solene acompanha a fórmula cronológica do hebraico, enquanto os verbos pronominais mantêm fluidez narrativa. Os marcadores foram posicionados junto às expressões a que suas notas realmente se referem, corrigindo o desalinhamento aparente da camada inglesa de consulta.
