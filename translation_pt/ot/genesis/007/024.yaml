  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: pt
  text: E as águas prevaleceram sobre a terra durante cento e cinquenta dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sobre a região»; o termo hebraico אֶרֶץ pode significar «terra» ou «região», conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: prevaleceram
  rationale: O Qal wayyiqtol de גבר comunica que as águas se tornaram fortes e mantiveram domínio. «Prevaleceram» preserva esse sentido e a continuidade narrativa.
- source_word: הַמַּיִם
  choice: as águas
  rationale: O plural reproduz a forma hebraica e é natural no registro bíblico português para as águas do dilúvio.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: «Sobre» traduz naturalmente עַל. «Terra» mantém o sentido favorecido pelo contexto abrangente do relato, sem excluir a alternativa lexical «região».
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: durante cento e cinquenta dias
  rationale: A expressão cardinal hebraica significa idiomaticamente «cento e cinquenta dias»; «durante» explicita de modo natural a duração implícita.
theological_decisions:
- issue: Alcance de אֶרֶץ no relato do dilúvio
  choice: terra
  alternative: região
  rationale: Os termos abrangentes do contexto imediato favorecem «terra». Como אֶרֶץ também pode designar uma terra ou região, essa possibilidade genuína é preservada em nota, sem restringir silenciosamente o alcance do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Prevaleceram» conserva a força lexical e o tom narrativo; o número é escrito por extenso no corpo do versículo.
