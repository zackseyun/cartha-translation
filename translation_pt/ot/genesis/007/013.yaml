base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: pt
  text: Naquele mesmo dia, Noé entrou na arca[a], junto com Sem, Cam e Jafé, filhos de Noé, a mulher de Noé e as três mulheres de seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veio para a arca”. O verbo hebraico significa literalmente “veio”, mas, neste contexto, indica que Noé entrou nela.
    reason: lexical_alternative
  - marker: b
    text: O hebraico termina a enumeração com “com eles”; aqui, esse sentido foi expresso por “junto com” no início da lista.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Naquele mesmo dia
  rationale: A expressão idiomática enfatiza a identidade precisa do dia. “Naquele mesmo dia” conserva essa ênfase em português natural.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: entrou na arca
  rationale: Embora בָּא signifique literalmente “veio”, a construção com a arca como destino descreve a entrada nela. “Entrou na arca” comunica naturalmente o movimento indicado pelo contexto.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְשֵׁם וְחָם וָיֶפֶת
  choice: junto com Sem, Cam e Jafé
  rationale: “Junto com” expressa de modo claro que os três acompanham Noé, sem reproduzir mecanicamente a sequência de conjunções hebraicas.
- source_word: בְּנֵי נֹחַ
  choice: filhos de Noé
  rationale: Mantém de modo claro a aposição que identifica Sem, Cam e Jafé.
- source_word: וְאֵשֶׁת נֹחַ
  choice: com a mulher de Noé
  rationale: “Mulher” é uma designação natural e corrente para a esposa no contexto familiar, preservando a construção relacional do hebraico.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: com as três mulheres de seus filhos
  rationale: Preserva o número e a relação familiar expressos no hebraico.
- source_word: אִתָּם
  choice: junto com
  rationale: O hebraico traz literalmente “com eles” no fim da relação. Em português, seu sentido é integrado no início da enumeração por “junto com”, evitando uma repetição pouco natural.
