base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: pt
  text: eles, e todo animal selvagem segundo a sua espécie, todo animal doméstico segundo a sua espécie, todo ser rastejante que rasteja sobre a terra segundo a sua espécie, e toda criatura voadora segundo a sua espécie — toda ave, todo ser alado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “toda ave, toda asa”. O hebraico usa uma expressão classificatória em aposição para abranger os seres alados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: eles
  rationale: Pronome masculino plural que retoma Noé e os que entraram com ele na arca; mantém a ligação sintática com o versículo anterior.
- source_word: הַחַיָּה
  choice: animal selvagem
  rationale: No sistema classificatório de Gênesis, contrasta normalmente com בְּהֵמָה e designa os animais terrestres não domesticados.
- source_word: הַבְּהֵמָה
  choice: animal doméstico
  rationale: Designa os quadrúpedes domesticados ou animais de criação, em contraste com os animais selvagens; evita restringir o termo aos bovinos.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: segundo a sua espécie
  rationale: Expressão classificatória recorrente em Gênesis, vertida de modo claro e próximo do hebraico.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: ser rastejante que rasteja sobre a terra
  rationale: Preserva a repetição intencional entre o substantivo e o particípio hebraicos e indica pequenas criaturas que se deslocam junto ao solo.
- source_word: הָעוֹף
  choice: criatura voadora
  rationale: עוֹף pode abranger seres que voam; a sequência especifica as aves e os seres alados, por isso a tradução conserva aqui o sentido mais amplo.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: toda ave, tudo o que tem asas
  rationale: Mantém a classificação em aposição e a progressão do hebraico, sem reduzir literalmente כָּנָף, 'asa', a uma parte anatômica isolada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “segundo a sua espécie” e o jogo entre “ser rastejante” e “rasteja” foram preservados por seu valor estrutural no hebraico.
