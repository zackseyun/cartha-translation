  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: pt
  text: Quando subimos até o seu servo, meu pai[a], contamos a ele as palavras de meu senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu pai, seu servo”. A ordem do hebraico é “o seu servo, meu pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento seguinte. Em português, “Quando” transmite naturalmente a relação temporal; explicitar “E aconteceu que” seria mais pesado sem acrescentar conteúdo necessário.
- source_word: עָלִינוּ
  choice: subimos
  rationale: עלה significa subir. Aqui descreve a viagem do Egito para Canaã e preserva a perspectiva geográfica do hebraico.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: até o seu servo, meu pai
  rationale: Mantém a ordem hebraica e o tratamento deferente usado por Judá para se referir a Jacó diante de José. A vírgula torna clara a aposição em português.
- source_word: וַנַּגֶּד לוֹ
  choice: contamos a ele
  rationale: No hifil, נגד significa tornar conhecido, contar ou relatar. “Contamos a ele” é corrente e preserva o objeto indireto expresso no hebraico.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: as palavras de meu senhor
  rationale: A tradução formal de דִּבְרֵי preserva a referência às palavras anteriormente ditas, e “meu senhor” mantém o título humano respeitoso אֲדֹנִי.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Conserva-se a deferência da fala de Judá e, no texto principal, a ordem do sintagma hebraico sem sacrificar a inteligibilidade.
