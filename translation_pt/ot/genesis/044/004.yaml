  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: pt
  text: 'Eles tinham saído da cidade e ainda não tinham ido longe, quando José disse ao administrador de sua casa:[a] “Levante-se! Persiga aqueles homens e, quando os alcançar, diga-lhes: ‘Por que vocês retribuíram o mal pelo bem?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ao que estava sobre sua casa”; também pode ser entendido como “ao administrador” ou “ao encarregado de sua casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר
  choice: Eles tinham saído da cidade
  rationale: O pronome plural foi mantido, e o mais-que-perfeito expressa naturalmente que a saída precedeu a ordem de José.
- source_word: לֹא הִרְחִיקוּ
  choice: ainda não estavam longe
  rationale: Expressa de modo natural o sentido do hifil de רחק no contexto, indicando que pouca distância havia sido percorrida.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: ao administrador de sua casa
  rationale: A expressão hebraica é literalmente 'ao que estava sobre sua casa' e designa o responsável pela administração doméstica.
- source_word: קוּם
  choice: Levante-se!
  rationale: Preserva o imperativo urgente, que introduz uma ação imediata.
- source_word: רְדֹף אַחֲרֵי
  choice: Persiga
  rationale: Reproduz de maneira concisa o sentido de perseguir ou ir atrás.
- source_word: הָאֲנָשִׁים
  choice: aqueles homens
  rationale: Mantém a referência masculina explícita e, com o demonstrativo, identifica naturalmente o grupo recém-partido.
- source_word: וְהִשַּׂגְתָּם
  choice: quando os alcançar
  rationale: O hifil de נשׂג significa alcançar; 'quando' explicita de modo idiomático a sequência pressuposta pela ordem.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: vocês retribuíram o bem com o mal
  rationale: Formulação portuguesa idiomática que preserva a acusação moral de devolver mal em resposta ao bem.
theological_decisions: []
