  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: pt
  text: Então Judá e seus irmãos entraram na casa de José. Ele ainda estava lá, e eles caíram por terra diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entraram
  rationale: O wayyiqtol faz a narrativa avançar com valor de passado simples. Em conjunto com a forma direcional בֵּיתָה, “entraram” expressa naturalmente o movimento para dentro da casa.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Judá e seus irmãos
  rationale: Mantém Judá explicitamente em primeiro plano e preserva a designação familiar dos demais.
- source_word: בֵּיתָה יוֹסֵף
  choice: na casa de José
  rationale: A terminação direcional em בֵּיתָה indica movimento para a casa; com “entraram”, a preposição “na” comunica em português o ingresso no local.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Ele ainda estava lá
  rationale: עוֹדֶנּוּ indica continuidade. A frase autônoma reproduz com clareza a circunstância de José permanecer presente.
- source_word: וַיִּפְּלוּ
  choice: se prostraram
  rationale: Embora o sentido básico seja “caíram”, o contexto de cair diante de alguém até o chão descreve uma prostração; esta escolha comunica naturalmente o gesto sem perder sua direção física, explicitada na expressão seguinte.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente português natural do idioma hebraico literalmente relacionado à presença ou face de alguém.
- source_word: אָרְצָה
  choice: com o rosto em terra
  rationale: A forma direcional indica movimento para o chão. No contexto de prostração, a expressão portuguesa descreve de modo claro e idiomático a postura resultante.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A divisão em duas frases apresenta a permanência de José como circunstância da prostração. Não há necessidade de nota textual ou teológica neste versículo.
