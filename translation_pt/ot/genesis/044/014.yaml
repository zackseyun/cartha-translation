review_pass:
  verdict: revise
  source_fidelity: A expressão «com o rosto em terra» introduz especificamente o rosto, elemento que não está expresso no hebraico. O texto diz que eles caíram diante de José «para a terra/chão», sem especificar a posição do rosto. «Caíram por terra diante dele» preserva tanto o verbo básico quanto o movimento para o chão.
  naturalness: «Então Judá e seus irmãos entraram na casa de José. Ele ainda estava lá, e eles caíram por terra diante dele.» é português moderno, claro e narrativo. A separação após «José» apresenta naturalmente a permanência dele como circunstância da reação dos irmãos.
  terminology: «Judá», «José», «diante dele» e «por terra» são escolhas estáveis, naturais e adequadas ao registro bíblico moderno. Não é necessária nota de rodapé.
  issues:
