    issue: «com o rosto em terra» especifica uma parte do corpo ausente do texto-fonte.
    rationale: אָרְצָה indica direção para a terra/o chão; não há termo hebraico para «rosto». A formulação restringe indevidamente a imagem e deve ser substituída por uma expressão que mantenha a generalidade do original.
  - severity: low
    issue: «se prostraram» é interpretativo em relação ao verbo básico «caíram».
    rationale: O contexto certamente comunica homenagem, mas «caíram por terra» conserva de modo mais direto o verbo וַיִּפְּלוּ e a direção expressa por אָרְצָה, sem perder a força narrativa.
  revised_text: Então Judá e seus irmãos entraram na casa de José. Ele ainda estava lá, e eles caíram por terra diante dele.
