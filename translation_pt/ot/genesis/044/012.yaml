base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: pt
  text: Ele começou a busca pelo mais velho e a terminou pelo mais novo; e a taça[a] foi encontrada no saco de Benjamim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cálice”. O termo hebraico pode designar uma taça ou um cálice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: fez a busca
  rationale: Expressa de modo natural a ação de procurar minuciosamente na bagagem, sem acrescentar ao texto um objeto explícito.
- source_word: בַּגָּדוֹל
  choice: pelo mais velho
  rationale: No contexto dos irmãos, o adjetivo indica idade, não tamanho, importância ou posição.
- source_word: הֵחֵל
  choice: começando
  rationale: Marca o ponto inicial da busca ordenada e combina naturalmente com “terminando”.
- source_word: וּבַקָּטֹן
  choice: pelo mais novo
  rationale: Em contraste com “o mais velho”, refere-se ao irmão de menor idade.
- source_word: כִּלָּה
  choice: terminando
  rationale: Marca o ponto final da sequência da busca, preservando o paralelismo com “começando”.
- source_word: וַיִּמָּצֵא
  choice: foi encontrada
  rationale: Mantém a construção passiva do nifal hebraico, sem substituí-la por “ele encontrou”.
- source_word: הַגָּבִיעַ
  choice: a taça
  rationale: “Taça” é uma tradução corrente e digna para o recipiente designado por גָּבִיעַ; “cálice” também é possível.
- source_word: בְּאַמְתַּחַת
  choice: no saco
  rationale: O termo designa um saco ou bolsa para transportar mantimentos e mercadorias; “saco” se ajusta bem ao contexto da viagem.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O ponto e vírgula conserva a progressão narrativa e distingue a busca de seu resultado. O marcador da nota foi colocado junto a “taça”, termo ao qual a alternativa lexical se refere.
