source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: pt
  text: 'Então ele ordenou ao encarregado de sua casa: “Encha de alimento os sacos dos homens, tanto quanto puderem carregar, e ponha a prata de cada um na boca de seu saco[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na boca de seu saco”, isto é, na abertura do saco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Então ele ordenou
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão com naturalidade, e “ordenou” preserva a força de צוה.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: ao encarregado de sua casa
  rationale: A expressão significa literalmente “aquele que estava sobre sua casa” e designa o administrador da casa de José. “Encarregado de sua casa” comunica a função sem exigir o termo mais específico “mordomo”.
- source_word: מַלֵּא
  choice: Encha
  rationale: Imperativo singular de מלא, dirigido ao encarregado da casa.
- source_word: אַמְתְּחֹת הָאֲנָשִׁים
  choice: os sacos dos homens
  rationale: “Sacos” corresponde aos recipientes usados para transportar mantimentos, e “dos homens” preserva a designação explícita do hebraico sem substituí-la contextualmente por “dos irmãos”.
- source_word: אֹכֶל
  choice: alimento
  rationale: אֹכֶל é um termo geral para comida ou alimento. Embora o contexto envolva cereais, a tradução não restringe o sentido além do que o versículo declara.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: tanto quanto puderem carregar
  rationale: Formulação portuguesa natural que conserva tanto a ideia de capacidade expressa por יכל quanto a de transportar expressa por נשׂא.
- source_word: כֶּסֶף אִישׁ
  choice: a prata de cada um
  rationale: כֶּסֶף designa aqui a prata usada como pagamento, enquanto אִישׁ tem força distributiva. “De cada um” reproduz essa distribuição sem acrescentar “dinheiro” ao texto.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: na boca de seu saco
  rationale: Mantém a imagem hebraica transparente, segundo a qual a abertura do saco é chamada de sua “boca”; a nota esclarece o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “encarregado de sua casa” evita o caráter mais histórico ou técnico de “mordomo”, e a imagem concreta “boca de seu saco” é preservada com esclarecimento em nota.
