  text: וַֽ/יִּקְרְע֖וּ שִׂמְלֹתָ֑/ם וַֽ/יַּעֲמֹס֙ אִ֣ישׁ עַל חֲמֹר֔/וֹ וַ/יָּשֻׁ֖בוּ הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: pt
  text: Então eles rasgaram as suas roupas[a], e cada um pôs uma carga sobre o seu jumento; depois voltaram para a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas vestes”. O termo hebraico pode referir-se de modo geral a roupas, especialmente à veste exterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: rasgaram
  rationale: O verbo קרע descreve concretamente o ato de rasgar, aqui no gesto convencional de aflição, choque ou angústia; “rasgaram” é natural e preserva a ação.
- source_word: שִׂמְלֹתָם
  choice: as suas roupas
  rationale: שִׂמְלָה pode designar roupa ou veste, especialmente uma peça exterior. “Roupas” é claro e atual, sem especificar uma peça que o hebraico não identifica.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: cada um carregou o seu jumento
  rationale: עמס significa pôr uma carga sobre algo. A construção com אִישׁ tem sentido distributivo, adequadamente expresso por “cada um”.
- source_word: אִישׁ
  choice: cada um
  rationale: Embora o substantivo seja literalmente “homem”, nesta construção ele distribui a ação entre os homens já mencionados; “cada um” comunica isso com naturalidade e precisão.
- source_word: חֲמֹרוֹ
  choice: o seu jumento
  rationale: חֲמוֹר é o termo comum para jumento. A forma possessiva singular acompanha o sentido distributivo de “cada um”.
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: שׁוּב significa voltar ou retornar; “voltaram” é corrente e adequado ao registro narrativo.
- source_word: הָעִירָה
  choice: para a cidade
  rationale: O hê direcional indica movimento em direção à cidade, expresso naturalmente em português por “para a cidade”.
theological_decisions: []
