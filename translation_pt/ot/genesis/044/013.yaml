  source_fidelity: A tradução preserva a sequência narrativa, o gesto de rasgar as roupas e o retorno à cidade. Contudo, em português moderno, “cada um carregou o seu jumento” pode ser entendido como se cada homem tivesse transportado o animal, em vez de pôr carga sobre ele. A revisão torna explícita a relação expressa por עַל (“sobre”).
  naturalness: “Então eles rasgaram as suas roupas” e “voltaram para a cidade” são naturais e adequados ao registro narrativo. “Cada um pôs uma carga sobre o seu jumento” é claro e evita a ambiguidade potencial de “carregou o seu jumento”.
  terminology: “Roupas” traduz adequadamente שִׂמְלֹתָם; a nota com “vestes” preserva a alternativa lexical. “Jumento” é exato para חֲמוֹר e aceitável no português internacional, embora tenha tom um pouco mais formal que “burro”.
