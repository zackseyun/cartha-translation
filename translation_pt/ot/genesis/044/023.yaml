source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: pt
  text: 'E você disse aos seus servos: “Se o irmão mais novo de vocês não descer com vocês, vocês não voltarão a ver o meu rosto[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “não voltarão a comparecer diante de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E você disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; o pretérito perfeito expressa naturalmente a ação em português, e “E” preserva a ligação com o contexto.
- source_word: עֲבָדֶיךָ
  choice: aos seus servos
  rationale: Embora עבד também possa significar “escravo”, neste contexto de linguagem cortesã designa a relação de serviço e a autodepreciação respeitosa dos irmãos diante de José.
- source_word: אִם לֹא
  choice: Se ... não
  rationale: Mantém de modo claro e direto a estrutura condicional negativa do hebraico.
- source_word: יֵרֵד
  choice: descer
  rationale: Preserva o sentido direcional de ירד, refletindo a descida geográfica até o Egito.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: o irmão mais novo de vocês
  rationale: No contexto, הַקָּטֹן identifica o caçula entre os irmãos; “mais novo” é claro e natural em português amplo.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Representa diretamente a ideia de acompanhamento e mantém a referência plural.
- source_word: לֹא תֹסִפוּן
  choice: vocês não voltarão
  rationale: A construção com יסף indica que a ação não ocorrerá novamente; “não voltarão a” é idiomático e preserva esse valor reiterativo.
- source_word: לִרְאוֹת פָּנָי
  choice: a ver o meu rosto
  rationale: Conserva a imagem concreta do hebraico, embora a expressão idiomática signifique comparecer novamente diante do falante.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com “você/vocês” para distinguir adequadamente o destinatário singular dos referentes plurais. A formulação preserva a imagem hebraica de “ver o rosto”, explicando seu sentido idiomático em nota.
