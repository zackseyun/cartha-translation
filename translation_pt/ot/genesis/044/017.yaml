  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my slave[b], but you may go up in peace to your father."
translation:
  language: pt
  text: 'Mas ele disse: “Longe de mim fazer isso! O homem em cuja mão foi encontrado o cálice[a] será meu escravo[b]. Quanto a vocês, subam em paz para junto de seu pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com quem foi encontrado o cálice”. O hebraico diz literalmente: “em cuja mão foi encontrado o cálice”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo”. O termo hebraico עָבֶד pode designar tanto um servo quanto um escravo; aqui, “escravo” foi escolhido porque o contexto é de sujeição punitiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Longe de mim
  rationale: Expressão idiomática de forte repúdio, natural em português e fiel à intensidade do hebraico.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: fazer isso
  rationale: Completa de modo idiomático a fórmula de recusa e preserva a referência direta à ação proposta.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: O homem em cuja mão foi encontrado o cálice
  rationale: Mantém a imagem concreta do hebraico, embora ela também possa indicar posse; “cálice” é adequado ao objeto específico desta narrativa.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: será meu escravo
  rationale: Neste contexto de sujeição punitiva, “escravo” comunica melhor a perda de liberdade implicada, sem eliminar em nota a amplitude lexical do termo hebraico.
- source_word: וְאַתֶּם עֲלוּ
  choice: Quanto a vocês, subam
  rationale: O pronome expresso cria contraste com o homem retido, e o imperativo plural autoriza os demais irmãos a partir.
- source_word: לְשָׁלוֹם
  choice: em paz
  rationale: Reproduz a fórmula hebraica que indica partida segura, sem conflito.
- source_word: אֶל אֲבִיכֶם
  choice: para junto de seu pai
  rationale: Indica naturalmente em português o retorno ao pai dos irmãos.
theological_decisions:
- issue: Amplitude de עָבֶד entre servo e escravo
  choice: escravo
  alternative: servo
  rationale: A pena anunciada envolve sujeição coercitiva, favorecendo “escravo”; a alternativa lexical é preservada em nota para não reduzir a amplitude semântica do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a forte recusa inicial, o contraste entre o homem culpado e os demais irmãos e a imagem concreta “em cuja mão” do texto hebraico.
