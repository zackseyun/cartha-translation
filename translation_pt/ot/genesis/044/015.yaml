  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: pt
  text: 'E José lhes disse: “Que ato é esse que vocês cometeram? Vocês não sabiam que um homem como eu certamente pratica adivinhação[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente adivinha”, “certamente descobriria isso por meio de adivinhação” ou “certamente sabe descobrir essas coisas”. O hebraico emprega de forma intensiva o verbo da raiz ligada à adivinhação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: Que ato é esse
  rationale: מַעֲשֶׂה designa ato, ação ou feito. “Ato” conserva o peso moral da repreensão e soa natural em português.
- source_word: עֲשִׂיתֶם
  choice: vocês cometeram
  rationale: Embora עשה tenha o sentido básico de “fazer”, “cometeram” é idiomático com “ato” neste contexto acusatório e mantém a relevância presente da ação concluída.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Vocês não sabiam
  rationale: A pergunta negativa espera resposta afirmativa e conserva diretamente a força retórica do hebraico.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: certamente pratica adivinhação
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente pratica adivinhação” expressa tanto a ação quanto a ênfase sem decidir se José falava literalmente ou como parte de sua persona egípcia.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: um homem como eu
  rationale: Tradução direta e natural que preserva o singular masculino e a comparação explícita.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Se a declaração de José sobre adivinhação deve ser traduzida como afirmação direta ou suavizada como mero fingimento
  choice: 'Traduzir diretamente como parte da fala de José: “um homem como eu certamente pratica adivinhação”'
  alternative: “um homem como eu certamente descobriria isso por meio de adivinhação” ou “um homem como eu certamente sabe descobrir essas coisas”
  rationale: O hebraico emprega enfaticamente a raiz נחש, ligada à adivinhação. A tradução preserva a declaração e a tensão narrativa sem afirmar nem negar que José realmente praticasse tal coisa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “vocês” torna natural a fala dirigida ao grupo. A nota conserva alternativas para a construção hebraica enfática e sua ambiguidade contextual.
