lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אָבִינוּ
  choice: nosso pai
  rationale: No contexto, refere-se especificamente a Jacó, pai imediato dos irmãos.
- source_word: שֻׁבוּ
  choice: Voltem
  rationale: O imperativo de שוב manda os irmãos retornarem ao Egito; “Voltem” é claro e idiomático no discurso direto.
- source_word: שִׁבְרוּ
  choice: comprem
  rationale: Neste relato, o verbo שבר significa comprar mantimento ou cereal; como אֹכֶל vem expresso, “comprem” evita especificação desnecessária.
- source_word: לָנוּ
  choice: para nós
  rationale: A locução preserva de modo natural o sentido benefactivo da preposição hebraica.
- source_word: מְעַט
  choice: um pouco de
  rationale: Representa diretamente a pequena quantidade indicada pelo hebraico.
- source_word: אֹכֶל
  choice: comida
  rationale: אֹכֶל é um termo geral para alimento; “comida” preserva essa amplitude, embora o contexto trate de cereal.
