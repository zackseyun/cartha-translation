  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: pt
  text: 'Pois o teu servo foi fiador do rapaz perante meu pai[a], dizendo: “Se eu não o trouxer a ti, serei culpado perante meu pai por toda a minha vida.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assumiu a responsabilidade pelo rapaz perante meu pai” ou “deu garantia pelo rapaz”. O verbo hebraico indica assumir pessoalmente a responsabilidade como fiador.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “terei pecado contra meu pai todos os dias”. Neste contexto, a expressão indica culpa ou responsabilidade duradoura perante ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Judá e liga naturalmente o versículo à súplica precedente.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: Preserva a autodesignação humilde e deferente própria do discurso dirigido a um superior.
- source_word: עָרַב אֶת הַנַּעַר
  choice: se responsabilizou pelo rapaz
  rationale: Comunica em português corrente a ideia de assumir responsabilidade como fiador, sem perder a força do compromisso pessoal.
- source_word: מֵעִם אָבִי
  choice: diante de meu pai
  rationale: No contexto de עָרַב, indica a pessoa perante quem Judá assumiu a responsabilidade; esta formulação é natural em português.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: É uma designação natural de Benjamim neste contexto familiar e não sugere necessariamente uma criança pequena.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Se eu não o trouxer de volta a ti
  rationale: Expressa claramente a condição do compromisso. “De volta” fica implícito no contexto e torna explícito o retorno prometido ao pai.
- source_word: וְחָטָאתִי לְאָבִי
  choice: serei culpado diante de meu pai
  rationale: Preserva o sentido contextual de culpa ou responsabilidade incorrida perante o pai, enquanto a nota registra a forma mais literal ligada a “pecar”.
- source_word: כָּל הַיָּמִים
  choice: por toda a minha vida
  rationale: Equivalente idiomático português da duração vitalícia expressa literalmente por “todos os dias”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a deferência de Judá diante de José. “Rapaz” evita tanto o arcaísmo de “moço” em certos contextos quanto a impressão de que Benjamim fosse uma criança pequena.
