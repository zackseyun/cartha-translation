  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: pt
  text: Se vocês também tirarem este de junto de mim, e alguma desgraça lhe acontecer, farão meus cabelos brancos descer ao Sheol[a] em aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura” ou “ao mundo dos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: Se vocês também tirarem
  rationale: O waw com a forma verbal perfeita dá continuidade à condição expressa no contexto; a construção com “se” comunica isso naturalmente em português.
- source_word: גַּם
  choice: também
  rationale: Assinala que este filho seria tirado de Jacó além dos filhos já perdidos ou ausentes.
- source_word: מֵעִם פָּנַי
  choice: de junto de mim
  rationale: Expressa a separação da presença de Jacó de modo natural, preservando mais da imagem hebraica do que apenas “de mim”.
- source_word: וְקָרָהוּ אָסוֹן
  choice: e alguma desgraça lhe acontecer
  rationale: Reproduz a ideia de uma calamidade que sobrevém a Benjamim sem especificar indevidamente sua natureza.
- source_word: וְהוֹרַדְתֶּם
  choice: farão ... descerem
  rationale: Preserva o sentido causativo do hifil e a imagem de descida ao mundo dos mortos.
- source_word: שֵׂיבָתִי
  choice: meus cabelos brancos
  rationale: Mantém a imagem concreta hebraica, usada como referência à velhice de Jacó.
- source_word: בְּרָעָה
  choice: em aflição
  rationale: Neste contexto, רָעָה indica sofrimento, desgraça ou angústia, não maldade moral; “aflição” comunica o estado doloroso de Jacó.
- source_word: שְׁאֹלָה
  choice: ao Sheol
  rationale: A transliteração conserva o conceito hebraico do domínio dos mortos sem reduzi-lo simplesmente à sepultura.
theological_decisions:
- issue: Sentido de שְׁאֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: “Sheol” preserva o termo e a concepção do texto hebraico sem importar definições doutrinárias posteriores; a nota oferece equivalentes explicativos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com plural explícito “vocês”. A formulação preserva as imagens hebraicas dos cabelos brancos e da descida ao Sheol.
