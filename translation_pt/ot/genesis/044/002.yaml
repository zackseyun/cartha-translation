  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: pt
  text: “Ponha também o meu cálice, o cálice de prata, na boca[a] do saco do mais novo, junto com a prata paga pelo cereal que ele comprou[b].” E ele fez conforme José havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na boca do saco”, expressão hebraica que se refere à abertura do saco.
    reason: cultural_note
  - marker: b
    text: 'Ou: “o dinheiro do cereal dele”. O termo hebraico para “prata” também era usado no sentido de dinheiro, e a expressão se refere ao pagamento pelo cereal ou pelos mantimentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: o meu cálice, o cálice de prata
  rationale: גְּבִיעַ designa uma taça ou cálice. “Cálice” é natural no contexto de uma peça pessoal de prata, e a repetição em aposição preserva a ênfase do hebraico.
- source_word: תָּשִׂים
  choice: ponha
  rationale: O verbo שׂים significa “pôr, colocar”. O imperativo “ponha” é direto e idiomático em português.
- source_word: בְּפִי
  choice: na boca
  rationale: A expressão preserva a imagem concreta hebraica de “boca” como a abertura de um recipiente; uma nota esclarece o uso idiomático.
- source_word: אַמְתַּחַת
  choice: saco
  rationale: Refere-se a um saco usado para transportar cereal; “saco” é mais específico e adequado ao cenário do que “bolsa”.
- source_word: הַקָּטֹן
  choice: o mais novo
  rationale: Literalmente “o pequeno/novo”; no contexto, indica o mais novo dos irmãos, sem necessidade de acrescentar “irmão” ao texto.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: a prata paga pelo cereal que ele comprou
  rationale: כֶּסֶף pode indicar prata e, por extensão, dinheiro; שִׁבְרוֹ se refere ao cereal ou mantimento comprado. A formulação mantém “prata” e explicita com naturalidade a relação comercial.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: E ele fez conforme José havia dito
  rationale: A formulação comunica naturalmente em português que o servo cumpriu a instrução verbal de José, sem interpretar דָּבָר de modo mais específico como “ordem” ou “mandamento”.
theological_decisions: []
