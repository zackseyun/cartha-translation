base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: pt
  text: Pois como poderei voltar para meu pai sem o rapaz comigo? Eu teria de ver a desgraça que atingiria meu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: voltar
  rationale: Literalmente, “subir”; no contexto, Judá fala de retornar a Canaã, onde está seu pai. “Voltar” comunica naturalmente o movimento pretendido sem exigir do leitor a convenção geográfica hebraica.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: O termo pode designar menino, jovem ou servo. Benjamim já era adulto, mas é apresentado em sua relação filial e dependente; “rapaz” preserva essa perspectiva sem chamá-lo de criança.
- source_word: בָרָע
  choice: a desgraça
  rationale: O substantivo רָעָה neste contexto denota calamidade ou desgraça que atingiria Jacó, não maldade moral.
- source_word: יִמְצָא אֶת־אָבִי
  choice: sobrevirá a meu pai
  rationale: A expressão idiomática significa literalmente o mal que “encontrará” o pai; “sobrevirá” expressa em português a calamidade que o atingirá.
theological_decisions:
- issue: Força de פֶּן na oração final
  choice: Que eu não veja a desgraça que sobrevirá a meu pai!
  alternative: Caso contrário, eu teria de ver a desgraça que sobreviria a meu pai.
  rationale: פֶּן introduz aqui o resultado temido, com força de “para que não” ou “não seja que”. A formulação optativa preserva a aversão angustiada de Judá sem transformar explicitamente a frase em obrigação inevitável.
translation_notes:
  register: Português moderno, digno e natural, com boa legibilidade brasileira. A pergunta conserva a intensidade do apelo de Judá, e a frase final mantém a tensão do hebraico em vez de explicá-la excessivamente.
