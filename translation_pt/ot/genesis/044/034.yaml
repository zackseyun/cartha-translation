- from: Pois como poderei voltar para meu pai se o rapaz não estiver comigo? Que eu não veja a desgraça que sobrevirá a meu pai!
  to: Pois como poderei voltar para meu pai sem o rapaz comigo? Eu teria de ver a desgraça que atingiria meu pai.
