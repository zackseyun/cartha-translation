review_pass:
  verdict: revise
  source_fidelity: A pergunta é fiel ao hebraico, embora "voltar" neutralize legitimamente o sentido geográfico de "subir". Na oração final, פֶּן introduz o resultado temido ("para que não seja que eu veja" / "para não ver"), não propriamente uma exclamação optativa independente. Além disso, o imperfeito יִמְצָא, sob essa perspectiva futura/condicional, é melhor expresso por "atingiria" do que pelo futuro indicativo categórico "sobrevirá".
  naturalness: O texto é claro e de registro adequado. "Sem o rapaz comigo" é mais conciso e idiomático que repetir a condição com "se", e a segunda frase proposta torna explícita em português a consequência implícita da pergunta retórica sem descaracterizar o apelo de Judá.
  terminology: '"Rapaz" preserva bem נַּעַר no contexto. "Desgraça" comunica corretamente רָעָה como calamidade, não mal moral. "Atingiria" traduz de modo natural a expressão idiomática hebraica de uma desgraça que "encontra" o pai.'
  issues:
  - severity: medium
    issue: 'A oração final foi vertida como optativo autônomo: "Que eu não veja...!"'
    rationale: פֶּן vincula o temor de ver a calamidade à hipótese de retornar sem o rapaz. A formulação optativa é possível como paráfrase emocional, mas obscurece essa relação sintática e a nuance condicional do hebraico.
  - severity: low
    issue: '"Sobrevirá" apresenta a calamidade como futuro incondicional.'
    rationale: No discurso, o receio de Judá é expresso em conexão com a eventual volta sem Benjamim; o condicional "atingiria" preserva melhor essa perspectiva.
  revised_text: Pois como poderei voltar para meu pai sem o rapaz comigo? Eu teria de ver a desgraça que atingiria meu pai.
