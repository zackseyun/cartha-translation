  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: pt
  text: 'Veja: a prata que encontramos na abertura dos nossos sacos nós a trouxemos de volta a você, da terra de Canaã. Como, então, poderíamos roubar prata ou ouro da casa do seu senhor?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: '[expresso pela ênfase da primeira oração]'
  rationale: A partícula chama atenção para a prova apresentada. Em português, a topicalização de «a prata que encontramos...» e a sequência argumentativa transmitem essa ênfase sem exigir um «Eis que» pouco natural.
- source_word: כֶּסֶף
  choice: prata
  rationale: Preserva o sentido concreto e a repetição retórica, além do contraste final com «ouro».
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: na abertura dos nossos sacos
  rationale: O hebraico diz literalmente «na boca dos nossos sacos». «Na abertura» comunica naturalmente o sentido do idioma em português sem perder a imagem espacial relevante.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: trouxemos de volta para você
  rationale: Expressa com clareza o causativo de שוב e identifica o destinatário da devolução.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: da terra de Canaã
  rationale: Forma geográfica corrente e fiel ao hebraico.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Como, então, poderíamos roubar
  rationale: A pergunta é retórica e tem força modal; «então» explicita naturalmente a inferência baseada na devolução anterior.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: da casa do seu senhor
  rationale: «Senhor» designa aqui o superior do administrador, não um título divino. «Casa» preserva a metonímia ampla do hebraico.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: prata ou ouro
  rationale: Mantém o par concreto do original e reforça a alegação dos irmãos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da primeira oração foi ajustada para dar destaque à prova apresentada, e o idioma hebraico «na boca dos sacos» foi vertido pelo equivalente natural «na abertura dos nossos sacos».
