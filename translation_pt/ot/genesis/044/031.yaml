  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: pt
  text: Então, quando ele vir que o rapaz não está, morrerá, e seus servos farão descer com tristeza ao Sheol os cabelos grisalhos de nosso pai, seu servo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “à sepultura” ou “ao mundo dos mortos”. Hebraico: “Sheol”.'
    reason: Alternativas lexicais para o termo hebraico שְׁאוֹל.
lexical_decisions:
- source_word: וְהָיָה
  choice: então
  rationale: Introduz o resultado da condição anterior de modo natural, sem reproduzir de forma rígida o idiomatismo hebraico.
- source_word: כִּרְאוֹתוֹ
  choice: quando ele vir
  rationale: O infinitivo construto com כ e sufixo de terceira pessoa masculina expressa uma circunstância temporal.
- source_word: כִּי אֵין הַנַּעַר
  choice: que o rapaz não está conosco
  rationale: אֵין indica ausência neste contexto. “Conosco” torna explícita em português a ausência do rapaz entre os irmãos que retornariam, sem sugerir que ele morreu.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נַעַר pode designar um jovem ou rapaz; esta opção é atual, digna e adequada à perspectiva familiar do discurso.
- source_word: וָמֵת
  choice: morrerá
  rationale: 'A forma verbal prossegue a sequência de resultado e tem sentido futuro no contexto: Jacó morrerá ao perceber a ausência de Benjamim.'
- source_word: וְהוֹרִידוּ
  choice: farão descer
  rationale: Preserva a forma causativa do Hifil de ירד e a imagem espacial do idiomatismo ligado ao Sheol.
- source_word: עֲבָדֶיךָ
  choice: os seus servos
  rationale: É a autodesignação deferente dos irmãos diante do governante, sem destacar indevidamente a condição de escravidão.
- source_word: שֵׂיבַת
  choice: os cabelos grisalhos
  rationale: Mantém a imagem concreta hebraica de cabelos brancos como expressão da velhice.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: de nosso pai, seu servo
  rationale: Conserva as duas relações expressas — pai dos irmãos e servo do interlocutor — em ordem natural no português.
- source_word: בְּיָגוֹן
  choice: com tristeza
  rationale: יָגוֹן denota tristeza ou pesar; esta formulação liga naturalmente a circunstância ao ato de fazer descer.
- source_word: שְׁאֹלָה
  choice: ao Sheol
  rationale: A transliteração preserva a amplitude semântica do termo hebraico e evita reduzi-lo a uma interpretação específica.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O termo pode abranger mais que o local físico de sepultamento. Mantê-lo transliterado preserva a concepção antiga e a ambiguidade do texto sem impor uma cosmologia denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a imagem hebraica de fazer descer os cabelos grisalhos ao Sheol; “conosco” explicita apenas a relação contextual da ausência de Benjamim.
