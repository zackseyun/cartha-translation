source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become slaves to my lord.
translation:
  language: pt
  text: Qualquer um dos teus servos[a] com quem ela for encontrada, que morra[b]; e nós também nos tornaremos escravos do meu senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Servos” e “escravos” traduzem aqui duas formas da mesma palavra hebraica. Na primeira ocorrência, os irmãos falam de si mesmos com deferência; na segunda, oferecem-se para uma verdadeira condição de escravidão.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “morrerá”.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Qualquer um dos teus servos com quem ela for encontrada
  rationale: 'A construção expressa uma referência indefinida e partitiva: qualquer pessoa dentre o grupo que se apresenta respeitosamente como servos. O pronome feminino retoma naturalmente a taça mencionada no contexto anterior.'
- source_word: וָמֵת
  choice: que morra
  rationale: O perfeito com waw tem aqui força de consequência proposta, próxima de uma formulação volitiva. “Que morra” conserva essa força sem transformar a declaração numa simples previsão.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: e nós também nos tornaremos
  rationale: Preserva a ideia adicional marcada por וְגַם e a entrada futura num novo estado expressa por נִהְיֶה.
- source_word: לַאדֹנִי
  choice: do meu senhor
  rationale: Trata-se de um título humano respeitoso, com sufixo de primeira pessoa singular. Em português, “escravos do meu senhor” exprime de modo natural a relação indicada pela preposição ל.
- source_word: עבד / לַעֲבָדִים
  choice: servos / escravos
  rationale: Na primeira ocorrência, “servos” comunica a autodesignação cortês dos irmãos; na segunda, “escravos” torna explícita a servidão punitiva que eles se oferecem para assumir.
theological_decisions:
- issue: Tradução distinta das duas ocorrências da raiz עבד
  choice: “servos” na autodesignação cortês e “escravos” na pena proposta
  alternative: Empregar “servos” ou “escravos” nas duas ocorrências
  rationale: 'A repetição lexical hebraica é relevante, mas o valor contextual muda: primeiro há linguagem deferente perante uma autoridade; depois, sujeição real como punição. A nota preserva a ligação lexical sem apagar essa diferença.'
- issue: Força verbal de וָמֵת
  choice: “que morra”
  alternative: “morrerá”
  rationale: O contexto é uma proposta solene de punição, não necessariamente uma previsão categórica. A formulação escolhida preserva a nuance volitiva, enquanto a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Meu senhor” conserva a linguagem respeitosa da corte sem sugerir um título divino. O pronome “ela” retoma a taça no contexto imediato.
