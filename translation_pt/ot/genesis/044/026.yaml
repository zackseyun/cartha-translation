base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: pt
  text: 'Mas dissemos: “Não podemos descer. Se o nosso irmão mais novo estiver conosco, desceremos, pois não podemos ver o rosto do homem[a] se o nosso irmão mais novo não estiver conosco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ver o rosto do homem”, expressão que aqui significa comparecer diante dele ou entrar em sua presença.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Mas nós dissemos
  rationale: O waw dá continuidade ao relato; “mas” expressa naturalmente o leve contraste com a exigência mencionada no contexto, enquanto “dissemos” traduz diretamente אמר.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Não podemos descer
  rationale: יכל indica capacidade ou possibilidade, e ירד significa literalmente “descer”, apropriado para a viagem a caminho do Egito.
- source_word: אָחִינוּ הַקָּטֹן
  choice: nosso irmão mais novo
  rationale: Neste contexto familiar, הַקָּטֹן identifica o irmão mais novo, Benjamim, e não alguém de baixa estatura.
- source_word: אִם יֵשׁ ... אִתָּנוּ וְיָרַדְנוּ
  choice: Se ... estiver conosco, desceremos
  rationale: A formulação mantém distintos o primeiro enunciado de recusa e a condição subsequente que permitiria a viagem, evitando uma construção tautológica.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: ver o rosto daquele homem
  rationale: Preserva a imagem concreta do hebraico, embora a expressão também funcione idiomaticamente no sentido de comparecer perante alguém.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: se o nosso irmão mais novo não estiver conosco
  rationale: Embora o hebraico coordene a oração com waw, ela descreve a circunstância em que eles não poderiam comparecer perante o homem; a construção condicional comunica essa relação com clareza em português.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “descer” por sua adequação geográfica e narrativa, e a expressão concreta “ver o rosto” é mantida no texto com esclarecimento em nota.
