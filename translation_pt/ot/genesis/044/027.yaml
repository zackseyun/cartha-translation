  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: pt
  text: 'Então o seu servo, meu pai, nos disse: “Vocês sabem que minha esposa me deu à luz dois filhos.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha esposa deu à luz dois para mim”. A palavra “filhos” está implícita no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez em português.
- source_word: עַבְדְּךָ אָבִי
  choice: meu pai, seu servo
  rationale: Mantém a identificação familiar e a forma deferente com que Judá fala de seu pai a José, seguindo a ordem natural em português.
- source_word: אֵלֵינוּ
  choice: nos
  rationale: Equivalente português direto e idiomático de “a nós” com o verbo dizer.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Vocês sabem
  rationale: O pronome explícito no hebraico dá ênfase, e o presente exprime um conhecimento ainda válido no momento da fala citada.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo conhecido.
- source_word: שְׁנַיִם
  choice: dois filhos
  rationale: O hebraico diz literalmente apenas “dois”; “filhos” é inferido com segurança pelo contexto e torna a frase natural em português.
- source_word: יָלְדָה לִּי
  choice: me deu
  rationale: Expressão natural em português para a construção hebraica que indica que a esposa lhe deu à luz filhos.
- source_word: אִשְׁתִּי
  choice: minha mulher
  rationale: Neste contexto, a expressão significa a esposa de Jacó; “minha mulher” é corrente e compreensível no português moderno.
