base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: pt
  text: 'E dissemos ao meu senhor: “Temos um pai idoso e um filho ainda jovem, nascido em sua velhice. O irmão dele morreu, e somente ele restou de sua mãe[a], e seu pai o ama.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, ele era o único filho de sua mãe que ainda restava vivo. Literalmente, “somente ele restou para sua mãe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Forma respeitosa de tratamento dirigida a um superior, preservando a hierarquia social e a repetição narrativa.
- source_word: זָקֵן
  choice: idoso
  rationale: Expressa de modo natural e digno a idade avançada do pai.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: um filho jovem, nascido em sua velhice
  rationale: Torna claro o idiomatismo hebraico referente a um filho nascido quando o pai já era idoso, ao mesmo tempo que preserva a indicação de que ele era jovem.
- source_word: וְאָחִיו מֵת
  choice: O irmão dele morreu
  rationale: Comunica naturalmente em português o fato da morte do irmão; o contexto apresenta essa morte como explicação para ele ser o único restante.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: somente ele restou de sua mãe
  rationale: 'Preserva a ênfase de exclusividade e a relação indicada pelo lamed: ele é o único filho daquela mãe que permanece vivo.'
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: seu pai o ama
  rationale: Tradução direta e transparente da afeição especial do pai por ele.
theological_decisions: []
