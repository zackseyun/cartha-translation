source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a slave to my lord[b], and let the boy go up with his brothers.
translation:
  language: pt
  text: Agora, pois, por favor, deixe que o seu servo fique no lugar do rapaz como escravo de meu senhor, e que o rapaz suba[a] com os irmãos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Suba” é uma maneira comum, no hebraico bíblico, de descrever a viagem do Egito em direção a Canaã.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Preserva tanto a transição discursiva quanto a força temporal, introduzindo de modo natural o ponto culminante do apelo de Judá.
- source_word: יֵשֶׁב נָא
  choice: por favor, deixe que ... fique
  rationale: Expressa o pedido cortês formado pelo jussivo com נָא; “fique” é natural no contexto de Judá permanecer para trás.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Na autodesignação deferente de Judá diante de José, “servo” comunica adequadamente a fórmula de cortesia, sem sugerir aqui, por si só, escravidão efetiva.
- source_word: תַּחַת הַנַּעַר
  choice: no lugar do rapaz
  rationale: תַּחַת tem sentido substitutivo neste contexto; a expressão portuguesa é clara e idiomática.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נַעַר pode designar um jovem, não necessariamente uma criança. “Rapaz” mantém o tom protetor de Judá sem infantilizar indevidamente Benjamim.
- source_word: עֶבֶד
  choice: como escravo
  rationale: Aqui o termo indica a condição concreta de sujeição proposta por Judá, em contraste com “servo” como forma cortês de autodesignação.
- source_word: לַאדֹנִי
  choice: de meu senhor
  rationale: אֲדֹנִי é um título humano de respeito dirigido a José. Na construção portuguesa com “escravo”, “de meu senhor” expressa naturalmente a relação pretendida.
- source_word: וְהַנַּעַר יַעַל
  choice: e que o rapaz suba
  rationale: Mantém a força volitiva do contexto e preserva o verbo “subir”, empregado convencionalmente para a viagem do Egito em direção a Canaã.
- source_word: עִם אֶחָיו
  choice: com os irmãos dele
  rationale: Tradução direta e clara do vínculo familiar; “dele” evita, no português corrente, possível ambiguidade de “seus irmãos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento que preservam a deferência de Judá diante de José. A distinção entre “servo” na autodesignação cortês e “escravo” na condição efetivamente proposta reflete os dois usos contextuais de עבד.
