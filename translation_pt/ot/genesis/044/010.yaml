  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my slave[b], and you will be innocent.”
translation:
  language: pt
  text: 'E ele disse: “Pois bem, que seja conforme as suas palavras. Aquele com quem ela for encontrada será meu escravo[a], e vocês ficarão livres de culpa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu servo”. O termo hebraico עֶבֶד pode significar “servo” ou “escravo”; aqui, “escravo” ressalta a condição coerciva imposta como punição.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Pois bem
  rationale: A expressão introduz a resposta imediata e enfática do administrador. “Pois bem” comunica em português natural a aceitação qualificada do que foi proposto, sem a rigidez pouco idiomática de “também agora”.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: que seja conforme as suas palavras
  rationale: A formulação preserva a afirmação volitiva do hebraico. O ponto final após esta oração acompanha a pausa principal marcada pelo atnah e evita apresentar a sentença seguinte como simples repetição da pena mais severa proposta pelos irmãos.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Aquele com quem ela for encontrada
  rationale: A oração identifica o culpado pela posse do objeto procurado. O pronome feminino retoma naturalmente a taça no contexto imediato de Gênesis 44.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: será meu escravo
  rationale: O verbo foi traduzido diretamente por “será”. Neste contexto punitivo, עֶבֶד designa sujeição coerciva, de modo que “escravo” expressa melhor a condição imposta do que o termo mais amplo “servo”.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: e vocês ficarão livres de culpa
  rationale: נָקִי indica isenção de culpa ou responsabilidade. A expressão deixa claro que os demais irmãos não sofrerão a penalidade e soa natural em português contemporâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” adequado à legibilidade brasileira. A pontuação mantém separadas a aceitação inicial e a pena mais branda decretada pelo administrador.
