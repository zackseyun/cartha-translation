id: GEN.44.22
reference: Genesis 44:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: pt
  text: 'E dissemos ao meu senhor: “O rapaz não pode deixar o pai; se deixar o pai, este morrerá.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e ele deixa o pai, e morre”. O hebraico não explicita quem morrerá; o contexto indica que se trata do pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: E dissemos
  rationale: O wayyiqtol na primeira pessoa do plural dá continuidade à narrativa; “E dissemos” preserva essa sequência de modo natural.
- source_word: אֶל אֲדֹנִי
  choice: ao meu senhor
  rationale: Expressa a forma respeitosa com que Judá se dirige a José, adequada ao contexto de corte.
- source_word: לֹא יוּכַל
  choice: não pode
  rationale: Traduz diretamente a ideia de incapacidade e soa natural em português atual.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נער pode designar menino, jovem ou rapaz; “rapaz” mantém a perspectiva familiar sem sugerir necessariamente uma criança pequena.
- source_word: לַעֲזֹב / וְעָזַב
  choice: deixar / se deixar
  rationale: עזב indica aqui afastar-se ou deixar alguém, sem a conotação moral mais forte de “abandonar”; a segunda ocorrência é vertida condicionalmente conforme o contexto.
- source_word: אָבִיו
  choice: o pai
  rationale: O possessivo é naturalmente recuperável em português; a repetição do substantivo, presente no hebraico, é mantida.
- source_word: וָמֵת
  choice: este morrerá
  rationale: O sujeito está implícito e é contextualmente entendido como o pai. “Este” esclarece essa referência sem alterar o sentido condicional da frase.
theological_decisions:
- issue: Sujeito implícito de וָמֵת
  choice: O pai morrerá
  alternative: O rapaz morrerá; ou, de forma estritamente literal, deixar o sujeito ambíguo
  rationale: Embora a forma verbal não nomeie o sujeito, o contexto imediato e a argumentação paralela em Gênesis 44:31 apontam para o pai. A nota preserva a forma e a ambiguidade gramatical do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Meu senhor” preserva a deferência da fala; “rapaz” evita tanto o arcaísmo de “mancebo” quanto uma especificação etária excessiva.
