base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: pt
  text: 'Então você disse aos seus servos: “Façam-no descer até mim, para que eu ponha os olhos nele[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que eu o veja”. A expressão hebraica diz literalmente “pôr meu olho sobre ele” e pode indicar vê-lo, examiná-lo ou dedicar-lhe atenção especial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então você disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade e mantém o discurso direto dirigido a José.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Embora עבד também possa significar “escravo”, neste contexto de corte designa os homens que se apresentam como subordinados de José; “servos” preserva adequadamente essa relação.
- source_word: הוֹרִדֻהוּ
  choice: Tragam-no até mim
  rationale: É um imperativo hifil plural de ירד com sufixo masculino singular. Em português, “tragam-no” comunica naturalmente o sentido causativo; “até mim” explicita o destino dado por אֵלַי. A nuance literal de descida fica menos explícita, mas evita uma formulação portuguesa potencialmente artificial neste contexto.
- source_word: אֵלַי
  choice: até mim
  rationale: A preposição indica movimento em direção ao próprio José; “até mim” é idiomático e direto em português.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: para que eu ponha os olhos nele
  rationale: Preserva a imagem hebraica, literalmente “pôr meu olho sobre ele”, sem decidir se a intenção é apenas vê-lo, examiná-lo ou dedicar-lhe atenção especial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “Tragam” corresponde ao imperativo plural hebraico dirigido aos servos. A construção idiomática final foi mantida no texto e esclarecida em nota para preservar sua ambiguidade.
