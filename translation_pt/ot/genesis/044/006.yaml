base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/006.yaml
  text: He caught up with them and spoke these words to them:[a]
translation:
  language: pt
  text: Ele os alcançou e lhes disse estas palavras:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele os alcançou e lhes falou estas palavras.”'
    reason: Alternativa mais formal que reproduz de perto o verbo hebraico “falar”.
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Ele os alcançou
  rationale: O hifil de נשׂג com sufixo de terceira pessoa masculina plural indica que o administrador chegou até os irmãos depois de segui-los. “Alcançou” é natural em português e preserva o sentido de perseguição e chegada.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: e lhes disse
  rationale: Embora דבר signifique literalmente “falar”, a construção com “estas palavras” funciona em português de modo mais natural com “disse”, sem alterar o sentido da fórmula introdutória de discurso.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: Tradução direta da expressão hebraica, que introduz a fala exata apresentada no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Alcançou” expressa naturalmente o movimento de chegar até quem seguia adiante; “lhes disse estas palavras” mantém a fórmula narrativa sem rigidez excessiva.
