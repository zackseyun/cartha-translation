  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Por que o meu senhor[b] fala palavras como essas?[a] Longe de teus servos fazerem uma coisa dessas!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras assim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu mestre”, como forma respeitosa de tratamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Eles lhe disseram
  rationale: Preserva a sequência narrativa do wayyiqtol e a referência pronominal ao interlocutor, em português natural.
- source_word: לָמָּה יְדַבֵּר
  choice: Por que ... fala
  rationale: Reproduz diretamente a pergunta e entende o imperfeito, neste contexto, com valor presente.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida a um ser humano e preserva o sufixo singular de primeira pessoa.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: palavras como essas
  rationale: Mantém a referência explícita às palavras pronunciadas e o sentido comparativo da construção hebraica.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: Longe de teus servos
  rationale: Conserva a fórmula enfática de repúdio e a autodesignação cortês dos irmãos como servos.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: fazer uma coisa dessas
  rationale: Expressa de modo claro e idiomático a rejeição do ato alegado, sem acrescentar detalhes.
