  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: pt
  text: Agora, quando eu chegar a teu servo, meu pai, e o rapaz não estiver conosco — a vida de meu pai está ligada à vida do rapaz[a] —[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “a alma dele está ligada à alma dele”. O hebraico emprega נֶפֶשׁ (néfesh, “vida, alma, ser”) para ambos; pelo contexto, o primeiro pronome se refere ao pai, e o segundo, ao rapaz, Benjamim.'
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível entender a última oração com valor explicativo: “e o rapaz não estiver conosco, pois a vida de meu pai está ligada à vida do rapaz”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a consequência seguinte na súplica de Judá; em português, “Agora” transmite naturalmente a progressão discursiva, sem necessidade de reproduzir separadamente o וְ.
- source_word: כְּבֹאִי
  choice: quando eu chegar
  rationale: A preposição כְּ com o infinitivo construto e o sufixo de primeira pessoa tem sentido temporal. “Quando eu chegar” é natural e mantém a perspectiva futura.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: a teu servo, meu pai
  rationale: Preserva a forma respeitosa com que Judá se dirige a José e identifica “meu pai” como aposto de “teu servo”.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נַעַר pode designar um jovem, não necessariamente uma criança. “Rapaz” conserva o tom familiar sem sugerir idade infantil.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: não estiver conosco
  rationale: Expressa de modo direto a ausência prevista de Benjamim e concorda naturalmente com a oração temporal em português.
- source_word: וְנַפְשׁוֹ
  choice: a vida de meu pai
  rationale: Neste contexto, נֶפֶשׁ indica a própria vida ou o ser da pessoa, não uma “alma” em sentido antropológico técnico. A explicitação do referente evita ambiguidade em português.
- source_word: קְשׁוּרָה
  choice: está ligada
  rationale: O particípio passivo descreve um vínculo forte e contínuo. “Está ligada” é corrente e mantém a imagem do hebraico.
- source_word: בְנַפְשׁוֹ
  choice: à vida do rapaz
  rationale: O segundo sufixo pronominal refere-se contextualmente a Benjamim. Tornar o referente explícito evita uma leitura reflexiva equivocada.
