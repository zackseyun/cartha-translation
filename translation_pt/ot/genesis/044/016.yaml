  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your slaves. Here we are, my lord’s slaves[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: pt
  text: 'E Judá disse: “Que diremos ao meu senhor? Que falaremos? Ou como poderemos nos justificar?[a] Deus descobriu a culpa de seus servos.[b] Aqui estamos, escravos do meu senhor:[c] tanto nós como aquele em cuja mão foi encontrado o cálice.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como poderemos provar que estamos com a razão?”. O verbo hebraico pode significar mostrar-se justo ou justificar-se.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Deus trouxe à luz a iniquidade de seus servos”.'
    reason: lexical_alternative
  - marker: c
    text: Na primeira ocorrência, “servos” é uma forma respeitosa de os irmãos se referirem a si mesmos diante de um superior; aqui, “escravos” expressa a condição de sujeição que eles se oferecem para assumir.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: ao meu senhor / do meu senhor
  rationale: Refere-se a José em sua posição de autoridade, não a Deus. “Meu senhor” conserva a deferência da fala sem recorrer ao menos natural “meu amo”.
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: Que diremos? Que falaremos?
  rationale: A distinção entre “dizer” e “falar” preserva o paralelismo e a intensificação retórica do hebraico.
- source_word: מַה נִּצְטַדָּק
  choice: como poderemos nos justificar?
  rationale: O hitpael de צדק significa mostrar-se justo ou demonstrar que se tem razão. “Poderemos” comunica a impotência implícita na pergunta retórica.
- source_word: מָצָא אֶת־עֲוֹן
  choice: descobriu a culpa
  rationale: A formulação conserva a imagem de Deus encontrando aquilo que estava oculto e expressa naturalmente a ideia de culpa revelada.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: seus servos / escravos do meu senhor
  rationale: Na primeira ocorrência, עבד é uma autodesignação respeitosa diante de um superior; na segunda, indica a condição concreta de escravidão que os irmãos se oferecem para assumir.
- source_word: הִנֶּנּוּ
  choice: Aqui estamos
  rationale: Expressão portuguesa natural que mantém a força apresentativa e a entrega implícita na partícula hebraica.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: tanto nós como aquele em cuja mão foi encontrado o cálice
  rationale: “Tanto... como” reproduz a inclusão marcada pelo duplo גַּם, e “em cuja mão” mantém a formulação hebraica e seu tom jurídico.
- source_word: הַגָּבִיעַ
  choice: o cálice
  rationale: “Cálice” designa com dignidade e clareza a taça mencionada na narrativa, sem a ornamentação adicional sugerida por termos como “taça preciosa”.
theological_decisions:
- issue: Referência de הָאֱלֹהִים na confissão de Judá
  choice: Judá atribui a Deus a descoberta da culpa dos irmãos.
  alternative: Uma divindade ou força divina teria revelado a transgressão.
  rationale: No contexto de Gênesis, a forma definida e a confissão de Judá apontam para o único Deus. A tradução preserva também a tensão de que Judá parece aludir à culpa mais ampla dos irmãos, e não necessariamente admitir o furto do cálice.
- issue: Sentido de עָוֹן
  choice: culpa
  alternative: iniquidade, pecado ou castigo pela culpa
  rationale: O termo pode abranger ato perverso, culpabilidade e consequência. “Culpa” mantém essa amplitude melhor no contexto e evita especificar que Judá esteja confessando o furto do cálice.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o paralelismo retórico, o tratamento deferente “meu senhor” e a distinção contextual entre “servos” e “escravos”. “Seus servos” retoma respeitosamente “meu senhor”; o contexto elimina a possível ambiguidade pronominal.
