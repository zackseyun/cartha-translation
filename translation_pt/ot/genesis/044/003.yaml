  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: pt
  text: Assim que clareou o dia[a], os homens foram mandados embora, eles e os seus jumentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando amanheceu” ou “Quando já havia luz pela manhã”.'
    reason: Alternativas naturais para a expressão hebraica que indica o clarear da manhã.
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: Assim que clareou o dia
  rationale: A expressão temporal descreve o surgimento da luz pela manhã. Esta formulação preserva a força verbal de אוֹר e soa natural em português.
- source_word: וְהָאֲנָשִׁים
  choice: os homens
  rationale: Tradução direta do substantivo definido; a conjunção é absorvida naturalmente pela oração temporal em português.
- source_word: שֻׁלְּחוּ
  choice: foram mandados embora
  rationale: Mantém a voz passiva do pual de שלח e expressa que receberam permissão ou ordem para partir.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: eles e os seus jumentos
  rationale: Conserva a coordenação e o pronome independente do hebraico, incluindo no grupo tanto os homens como seus animais.
