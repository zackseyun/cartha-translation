base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: pt
  text: 'Então Judá se aproximou dele e disse: “Por favor, meu senhor, permita que o seu servo diga uma palavra aos ouvidos do meu senhor[a], e não deixe que a sua ira se acenda contra o seu servo[b], pois o senhor é como Faraó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos ouvidos do meu senhor”; expressão hebraica que significa falar de modo que ele ouça.
    reason: cultural_note
  - marker: b
    text: Ou “não fique irado contra o seu servo”. O hebraico conserva a imagem da ira que se acende.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: Expressa de modo natural o movimento concreto de Judá em direção a José, preservando a solenidade narrativa.
- source_word: בִּי
  choice: Por favor
  rationale: A interjeição introduz uma súplica respeitosa; esta forma é clara e corrente em português.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém o tratamento honorífico e cortesão dirigido ao governante egípcio, sem sugerir necessariamente uma relação de propriedade.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: permita que o seu servo diga uma palavra
  rationale: Reproduz o pedido deferente e conserva tanto a autodesignação como servo quanto o singular 'uma palavra'.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: aos ouvidos do meu senhor
  rationale: Preserva a imagem idiomática hebraica, que em português é compreensível como pedido para falar diretamente e ser ouvido.
- source_word: וְאַל יִחַר אַפְּךָ
  choice: não deixe que a sua ira se acenda
  rationale: Conserva a metáfora hebraica da ira que se inflama sem recorrer à expressão anatômica literal e pouco natural.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: pois o senhor é como o faraó
  rationale: Mantém a comparação direta relacionada à posição e à autoridade de José, sem ampliá-la para uma afirmação de igualdade absoluta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento cortesão preservado. A repetição de “meu senhor” e “seu servo” foi mantida por ser essencial à deferência enfática de Judá.
