base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: pt
  text: Não é este o cálice de que meu senhor bebe e com o qual ele certamente pratica adivinhação? Vocês cometeram uma maldade ao fazer isso.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele certamente adivinha com ele”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Vocês fizeram o mal no que fizeram”.'
    reason: literal_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Não é este o cálice
  rationale: Preserva a pergunta retórica que espera concordância. Embora o hebraico diga literalmente “não é este”, explicitar “o cálice” torna claro o referente já estabelecido no contexto.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: do qual o meu senhor bebe
  rationale: O בְּ com o verbo “beber” indica a origem ou recipiente da bebida. “Meu senhor” preserva o título social usado pelo administrador a respeito de José, sem lhe dar necessariamente sentido teológico.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ
  choice: e por meio do qual certamente pratica adivinhação
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação. “Certamente pratica adivinhação” comunica tanto o sentido lexical de נחש no piel quanto a ênfase da forma hebraica.
- source_word: בּוֹ
  choice: por meio do qual
  rationale: Expressa o valor instrumental do segundo בּוֹ e associa o cálice à adivinhação sem especificar um método além do que o texto afirma.
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: Vocês fizeram o mal ao agir assim
  rationale: Mantém o peso moral de רעע e verte a oração relativa de maneira natural, evitando em português a repetição pouco fluente de “fizeram o mal no que fizeram”.
theological_decisions:
- issue: Se José é apresentado como praticante real de adivinhação ou se a fala integra apenas seu disfarce e sua prova dos irmãos
  choice: 'Traduzir diretamente a afirmação do administrador como fala narrativa: “certamente pratica adivinhação”.'
  alternative: Atenuar a declaração, por exemplo, como mera reputação, aparência ou capacidade hipotética de adivinhar.
  rationale: A fala hebraica afirma a prática de adivinhação e a intensifica. A tradução não deve resolver a questão narrativa ou teológica sobre a conduta real de José, mas preservar o que o personagem diz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” explicita que a acusação se dirige ao grupo. “Cálice” foi explicitado por contexto para evitar um demonstrativo solto, e “adivinhação” conserva sem atenuação a tensão da fala.
