base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: pt
  text: Então eles se apressaram, e cada um baixou seu saco até o chão, e cada um abriu seu saco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: eles se apressaram
  rationale: O verbo מהר expressa ação rápida e imediata; «se apressaram» é natural e preserva o sujeito plural do hebraico.
- source_word: וַיּוֹרִדוּ
  choice: baixou
  rationale: A forma hifil de ירד tem sentido causativo, «fazer descer»; no contexto, cada homem baixa seu saco, provavelmente de um animal, até o chão.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: cada um ... o seu saco
  rationale: אִישׁ tem aqui valor distributivo. «Cada um» comunica com naturalidade que todos agiram individualmente, sem tornar necessário explicitar «homem».
- source_word: אַמְתַּחַת
  choice: saco
  rationale: O substantivo designa um recipiente para mantimentos ou cereais; «saco» é claro, adequado ao contexto e coerente com a narrativa.
- source_word: אָרְצָה
  choice: até o chão
  rationale: A terminação direcional indica movimento para baixo, em direção ao solo; «até o chão» torna explícito o destino do movimento.
- source_word: וַיִּפְתְּחוּ
  choice: abriu
  rationale: פתח significa diretamente «abrir». O singular distributivo em português concorda com «cada um» e mantém a ação individual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A primeira oração mantém o plural explícito do verbo hebraico; as ações seguintes usam o singular distributivo natural em português. A repetição hebraica foi condensada no texto para evitar peso estilístico, mas registrada em nota.
