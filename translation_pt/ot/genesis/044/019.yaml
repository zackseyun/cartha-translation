  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: pt
  text: 'Meu senhor perguntou a seus servos: “Vocês têm pai ou irmão?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: Preserva a forma respeitosa com que Judá se dirige ao governante egípcio e mantém o sufixo de primeira pessoa.
- source_word: שָׁאַל
  choice: perguntou
  rationale: Equivalente direto e natural para o verbo hebraico no contexto de uma pergunta explícita.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Neste discurso de corte, os irmãos se apresentam deferentemente como servos do governante; 'escravos' imporia aqui uma especificidade social que o contexto imediato não exige.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: O infinitivo introduz o conteúdo da fala; em português atual, os dois-pontos expressam essa função com mais naturalidade do que 'dizendo'.
- source_word: הֲיֵשׁ לָכֶם
  choice: Vocês têm
  rationale: A construção existencial com ל expressa posse; esta é a formulação idiomática em português, preservando o plural dos interlocutores.
- source_word: אָב
  choice: pai
  rationale: Em português, após 'ter', o substantivo sem artigo é a maneira natural de perguntar pela existência desse familiar.
- source_word: אָח
  choice: irmão
  rationale: Mantém o singular do hebraico e o paralelismo com 'pai', sem acrescentar artigo desnecessário em português.
