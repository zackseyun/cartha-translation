  terminology: «Javé», «José», «amor leal», «favor» e «chefe da prisão» são escolhas consistentes, compreensíveis e de registro digno. A nota preserva alternativas lexicais legítimas para חֶסֶד sem apresentar uma delas como sentido exclusivo.
