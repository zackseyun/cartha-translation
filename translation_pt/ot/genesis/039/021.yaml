  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: pt
  text: Mas Javé estava com José, demonstrou-lhe amor leal[a] e fez que ele encontrasse favor aos olhos do chefe da prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «bondade constante» ou «misericórdia». O termo hebraico também pode indicar amor firme e fidelidade leal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo por um título.
- source_word: וַיְהִי ... אֶת
  choice: estava com
  rationale: Reproduz naturalmente a construção hebraica que expressa presença e companhia, além de manter a fórmula recorrente na narrativa de José.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: demonstrou-lhe amor leal
  rationale: Expressa de modo idiomático o ato de voltar ou estender חֶסֶד a alguém, sem tornar literal de forma artificial a imagem verbal de נָטָה.
- source_word: חָסֶד
  choice: amor leal
  rationale: Preserva as ideias de amor constante, lealdade e benevolência presentes no termo, sem afirmar explicitamente uma aliança que não é mencionada no versículo.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: concedeu-lhe favor aos olhos de
  rationale: Mantém a imagem do idioma hebraico e comunica que José recebeu a boa disposição da autoridade da prisão.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: chefe da prisão
  rationale: Representa de perto a cadeia construta hebraica e identifica com clareza o responsável pela prisão.
- source_word: וַ
  choice: Mas
  rationale: Explicita em português o contraste contextual entre o encarceramento de José e a presença favorável de Javé.
theological_decisions:
- issue: Sentido de חָסֶד aplicado à ação divina
  choice: amor leal
  alternative: fidelidade à aliança; bondade constante; misericórdia
  rationale: O termo descreve favor amoroso, firme e leal. Como o contexto imediato não menciona formalmente uma aliança, «amor leal» conserva o peso teológico sem resolver além do texto a base dessa lealdade.
- issue: Representação do tetragrama יְהוָה
  choice: Javé
  alternative: SENHOR; Iavé
  rationale: A escolha preserva o nome pessoal no texto e usa uma forma amplamente reconhecível em português, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o contraste narrativo, o idioma «aos olhos de» e a amplitude semântica de חָסֶד, evitando tanto uma tradução excessivamente literal quanto a explicitação de uma aliança não mencionada no versículo.
