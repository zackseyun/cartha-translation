  source_fidelity: 'O texto traduz com precisão as duas ações divinas: Javé está com José, manifesta-lhe חֶסֶד e faz com que ele tenha חֵן perante a autoridade da prisão. «Amor leal» é uma opção defensável para חֶסֶד e não introduz indevidamente uma referência explícita à aliança.'
