source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: pt
  text: E, desde o momento em que o encarregou de sua casa e de tudo o que possuía[a], Yahweh abençoou a casa do egípcio por causa de José; e a bênção de Yahweh estava sobre tudo o que ele possuía[b], na casa e no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde então, quando o pôs como responsável por sua casa e por tudo o que possuía”.'
    reason: Alternativa que preserva outra forma natural de relacionar מֵאָז à oração seguinte.
  - marker: b
    text: 'Ou: “em tudo o que ele possuía, na casa e no campo”.'
    reason: A preposição hebraica pode ser entendida como indicando a esfera em que a bênção se manifestava, e não apenas aquilo sobre o qual ela repousava.
lexical_decisions:
- source_word: מֵאָז
  choice: desde o momento em que
  rationale: Marca o ponto a partir do qual a situação descrita passou a vigorar; a formulação é natural em português e preserva o valor temporal.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ לוֹ
  choice: o encarregou de sua casa e de tudo o que possuía
  rationale: O hifil de פקד indica atribuição de responsabilidade administrativa. “Encarregou” comunica a autoridade delegada a José sem tornar explícito além do texto quem são os referentes pronominais.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: Preserva o sentido direto de ברך e a atribuição explícita da prosperidade à ação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּית הַמִּצְרִי
  choice: a casa do egípcio
  rationale: Mantém a construção possessiva e permite que “casa” abranja, conforme o contexto, tanto a residência quanto a unidade doméstica.
- source_word: בִּגְלַל יוֹסֵף
  choice: por causa de José
  rationale: Expressa de modo claro e direto a relação causal indicada por בִּגְלַל.
- source_word: בִּרְכַּת יְהוָה
  choice: a bênção de Yahweh
  rationale: Conserva a construção nominal e a atribuição explícita da bênção a Yahweh.
- source_word: בְּכָל אֲשֶׁר יֶשׁ לוֹ
  choice: sobre tudo o que ele possuía
  rationale: “Sobre” comunica que a bênção repousava sobre a totalidade dos bens e atividades do egípcio, preservando o alcance da preposição.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: na casa e no campo
  rationale: Preserva as imagens concretas e o merismo que abrange os âmbitos doméstico e agrícola.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título, evitando ao mesmo tempo impor uma tradição denominacional específica.
- issue: Natureza da ação divina expressa por ברך
  choice: abençoou
  alternative: fez prosperar
  rationale: Embora o contexto inclua prosperidade material, o verbo hebraico diz “abençoar”. A tradução mantém essa amplitude teológica sem reduzir a bênção apenas ao êxito econômico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva os referentes pronominais do hebraico sem inserir os nomes de Potifar e José onde o versículo usa pronomes. O ponto e vírgula organiza o período longo sem apagar a estreita ligação entre as duas declarações sobre a bênção.
