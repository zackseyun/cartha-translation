base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: pt
  text: José encontrou favor aos olhos de seu senhor e o serviu. Seu senhor o encarregou de sua casa e confiou a José tudo o que possuía.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pôs tudo o que possuía em sua mão”, expressão que indica confiar algo à autoridade ou aos cuidados de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: encontrou favor aos olhos dele
  rationale: Preserva o conhecido idioma hebraico e sua imagem, em formulação compreensível em português; o antecedente de “dele” está no contexto imediato.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: o servia
  rationale: Expressa o serviço pessoal e contínuo de José a seu senhor sem o tom especificamente religioso que “ministrava” poderia sugerir.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: ele o encarregou de sua casa
  rationale: O hifil de פקד indica atribuição de responsabilidade ou supervisão. “Encarregou” é natural e mantém a ideia administrativa; “casa” preserva a amplitude do hebraico, que pode abranger toda a unidade doméstica.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: tudo o que possuía
  rationale: Reproduz de modo abrangente e idiomático os bens e recursos pertencentes ao senhor de José.
- source_word: נָתַן בְּיָדוֹ
  choice: pôs nas mãos de José
  rationale: Mantém a imagem hebraica da mão como esfera de autoridade e cuidado, ao mesmo tempo que explicita José para evitar a ambiguidade pronominal criada em português.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição pronominal do hebraico foi parcialmente esclarecida no fim do versículo mediante “de José”, evitando confusão sem alterar o referente contextual. O marcador [a] aparece no texto principal.
