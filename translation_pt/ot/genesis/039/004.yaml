- from: José encontrou favor aos olhos dele e o servia. Então ele o encarregou de sua casa e pôs nas mãos de José tudo o que possuía.[a]
  to: José encontrou favor aos olhos de seu senhor e o serviu. Seu senhor o encarregou de sua casa e confiou a José tudo o que possuía.[a]
  rationale: A revisão corrige o aspecto verbal narrativo, elimina uma ambiguidade pronominal criada pela mudança de sujeito em português e traduz de modo idiomático a expressão hebraica “em sua mão”. A nota preserva a imagem literal e explica seu valor de autoridade ou responsabilidade.
