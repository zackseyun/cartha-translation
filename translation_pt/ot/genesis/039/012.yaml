  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: pt
  text: 'Então ela o agarrou pela roupa[a] e disse: “Deite-se comigo!”[b] Mas ele deixou a roupa na mão dela, fugiu e saiu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também poderia ser traduzido por “manto”, “capa” ou “túnica”; o termo hebraico designa de modo geral uma peça de roupa.
    reason: lexical_alternative
  - marker: b
    text: Ou “Durma comigo!” O hebraico usa literalmente o verbo “deitar-se” como eufemismo para uma proposta sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: ela o agarrou
  rationale: תפשׂ indica segurar alguém com firmeza. “Agarrou” comunica de modo vivo e natural a ação física repentina.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: pela roupa / a roupa
  rationale: בגד é um termo geral para uma peça de vestuário. “Roupa” mantém essa amplitude sem especificar indevidamente manto, capa ou túnica.
- source_word: לֵאמֹר
  choice: e disse
  rationale: O infinitivo introduz o discurso direto. Em português narrativo, “e disse” reproduz essa função com maior naturalidade do que o gerúndio “dizendo”.
- source_word: שִׁכְבָה עִמִּי
  choice: Deite-se comigo!
  rationale: שׁכב com עִם funciona aqui como eufemismo sexual. “Deite-se comigo” preserva a imagem verbal e a força literária do hebraico.
- source_word: וַיַּעֲזֹב
  choice: deixou
  rationale: עזב significa deixar ou abandonar. Neste contexto, “deixou” expressa naturalmente que a roupa permaneceu em poder dela.
- source_word: בְּיָדָהּ
  choice: nas mãos dela
  rationale: A expressão hebraica significa literalmente “na mão dela”. O plural idiomático em português indica com clareza que a roupa ficou em sua posse física.
- source_word: וַיָּנָס
  choice: fugiu
  rationale: נוס descreve uma fuga urgente. “Fugiu” conserva a intensidade e a concisão da narrativa.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: foi para fora
  rationale: יצא com החוצה indica movimento do interior para o exterior. Após “fugiu”, “foi para fora” preserva a segunda ação verbal sem a redundância menos natural de “saiu para fora”.
