base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew slave whom you brought to us came to me to mock me.”
translation:
  language: pt
  text: 'Então ela lhe falou nestes termos: “O escravo hebreu que você nos trouxe veio até mim para zombar de mim[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fazer de mim objeto de diversão”; a expressão hebraica pode ter sentido sexual ou abusivo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Então ela lhe falou
  rationale: O wayyiqtol dá continuidade à narrativa, e o pronome hebraico é mantido sem substituir seu referente pelo nome de Potifar.
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: nestes termos
  rationale: Expressa naturalmente a fórmula que introduz o conteúdo do relato, sem reproduzir de modo rígido o plural hebraico 'palavras' e o infinitivo quotativo.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: O escravo hebreu
  rationale: “Escravo” representa com clareza a condição social de José; “hebreu” conserva a designação étnica usada pela mulher.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: que você nos trouxe
  rationale: Mantém tanto a acusação dirigida ao marido quanto o pronome plural, provavelmente referente à casa ou ao grupo com que a mulher se identifica.
- source_word: בָּא אֵלַי
  choice: veio até mim
  rationale: Traduz o movimento em direção a ela sem introduzir por si só um eufemismo sexual mais explícito do que o hebraico.
- source_word: לְצַחֶק בִּי
  choice: para abusar de mim
  rationale: No contexto da falsa acusação de agressão sexual, צחק com בְּ indica ação hostil e degradante. “Abusar de mim” comunica a gravidade e admite conotação sexual sem definir mais precisamente o ato alegado.
