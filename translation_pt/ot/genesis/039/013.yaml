  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: pt
  text: E aconteceu que, quando ela viu que ele havia deixado sua roupa na mão dela e fugido para fora,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Conserva a transição narrativa e a noção de acontecimento expressas por וַיְהִי, em formulação natural e digna em português.
- source_word: כִּרְאוֹתָהּ
  choice: quando ela viu
  rationale: 'A preposição כְּ com o infinitivo construto de ראה e o sufixo de terceira pessoa feminina singular forma uma oração temporal: “quando ela viu”.'
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo daquilo que ela percebeu.
- source_word: עָזַב
  choice: havia deixado
  rationale: עָזַב significa “deixar” neste contexto; o mais-que-perfeito situa a ação antes do momento em que ela a percebeu.
- source_word: בִּגְדוֹ
  choice: sua roupa
  rationale: בֶּגֶד é um termo geral para roupa ou peça de vestuário. “Sua roupa” é corrente e evita especificar indevidamente um manto ou capa.
- source_word: בְּיָדָהּ
  choice: na mão dela
  rationale: Mantém a imagem concreta do hebraico e evita a possível ambiguidade de “em sua mão” quanto ao referente do possessivo.
- source_word: וַיָּנָס
  choice: fugido
  rationale: נוּס expressa fuga; o particípio ligado a “havia” integra naturalmente as duas ações anteriores à percepção dela.
- source_word: הַחוּצָה
  choice: para fora
  rationale: A terminação direcional -ה indica movimento para o exterior, bem expresso por “para fora”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva a estrutura narrativa do hebraico sem tornar a frase excessivamente literal. Não se acrescenta nota lexical, pois “roupa” já conserva no texto a generalidade de בֶּגֶד. A vírgula final foi mantida porque o versículo termina com uma oração subordinada cuja continuação vem no versículo seguinte.
