base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: pt
  text: Aconteceu que, certo dia[a], ele entrou na casa para fazer seu trabalho, e nenhum dos homens da casa estava ali, dentro da casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “num dia como este”. A expressão hebraica é idiomática e, neste contexto, provavelmente significa “em certa ocasião” ou “certo dia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Mantém a fórmula narrativa hebraica em português atual, sem recorrer ao arcaísmo “e sucedeu”.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: certo dia
  rationale: A expressão introduz uma ocasião específica no desenvolvimento dos acontecimentos. “Certo dia” comunica naturalmente essa função; a forma mais literal é preservada em nota.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: ele entrou na casa
  rationale: O verbo בוא com o ה direcional indica movimento para dentro da casa. “Entrou” expressa isso de modo direto e natural.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: para fazer seu trabalho
  rationale: מְלָאכָה designa trabalho, tarefa ou ocupação; no contexto doméstico-administrativo, “trabalho” é a opção mais ampla e direta.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: e nenhum dos homens da casa estava
  rationale: A construção existencial negativa afirma que não havia presente nenhum dos homens pertencentes à casa. A formulação preserva o referente masculino explícito do hebraico.
- source_word: שָׁם בַּבָּיִת
  choice: ali, dentro da casa
  rationale: “Ali” representa שָׁם, enquanto “dentro da casa” representa בַּבָּיִת e deixa clara a localização. A vírgula torna natural em português a ênfase locativa do hebraico.
theological_decisions: []
