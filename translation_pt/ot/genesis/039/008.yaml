  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: pt
  text: 'Mas ele recusou e disse à mulher do seu senhor: “Veja, meu senhor não se ocupa de nada na casa[a], e colocou em minhas mãos tudo o que possui[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não sabe comigo o que há na casa”. A expressão indica que o senhor deixa os assuntos da casa sob a supervisão de José e não precisa ocupar-se deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confiou aos meus cuidados”. O hebraico diz literalmente: “colocou em minha mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Mas ele recusou
  rationale: O verbo significa “recusar”. A conjunção adversativa explicita naturalmente o contraste com a proposta feita pela mulher no versículo anterior.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: e disse à mulher do seu senhor
  rationale: Reproduz com clareza a relação expressa pela construção hebraica, usando “senhor” em sentido doméstico e social.
- source_word: הֵן
  choice: Veja
  rationale: A partícula chama a atenção para a explicação seguinte; “Veja” é atual, natural e mantém essa função discursiva.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: meu senhor não se preocupa com o que há na casa sob os meus cuidados
  rationale: A expressão hebraica, literalmente difícil (“não sabe comigo”), indica que o senhor deixa os assuntos da casa sob a supervisão de José. A tradução comunica o sentido idiomático sem eliminar do registro a formulação literal, preservada em nota.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: tudo o que possui
  rationale: Expressa de modo conciso e natural a totalidade dos bens pertencentes ao senhor.
- source_word: נָתַן בְּיָדִי
  choice: colocou em minhas mãos
  rationale: Mantém a metáfora concreta hebraica de colocar algo na mão de alguém, que em português também comunica entrega, confiança e autoridade.
