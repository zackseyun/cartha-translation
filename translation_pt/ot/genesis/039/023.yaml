  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: pt
  text: O chefe da prisão não se preocupava com nada do que estava sob os cuidados de José,[a] porque Yahweh estava com ele; e Yahweh fazia prosperar tudo o que José fazia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não via coisa alguma em sua mão”, isto é, na mão de José. A expressão também pode ser entendida como “não cuidava de nada” ou “não inspecionava nada” do que havia sido confiado a José.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh fazia ter êxito tudo o que José fazia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: o chefe da prisão
  rationale: שַׂר designa o principal responsável ou oficial da prisão, não apenas um guarda; “chefe da prisão” comunica naturalmente a função administrativa.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: não se preocupava com nada
  rationale: Embora ראה signifique literalmente “ver”, neste contexto a construção indica que o chefe não precisava inspecionar nem cuidar dos assuntos confiados a José. A nota preserva as alternativas mais literais.
- source_word: בְּיָדוֹ
  choice: do que estava sob os cuidados de José
  rationale: A expressão literal “em sua mão” é uma metáfora hebraica de responsabilidade e controle. O referente é explicitado como José para evitar ambiguidade pronominal em português.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: porque Yahweh estava com ele
  rationale: בַּאֲשֶׁר tem valor causal no contexto e explica a confiança depositada em José.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: tudo o que ele fazia
  rationale: A construção relativa abrange as atividades de José; o imperfeito português combina naturalmente com a narrativa e com a ação habitual.
- source_word: מַצְלִיחַ
  choice: fazia prosperar
  rationale: 'O hifil de צלח é causativo: Yahweh fazia com que o trabalho de José prosperasse ou tivesse êxito.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Agente do sucesso de José
  choice: Yahweh fazia prosperar tudo o que José fazia
  alternative: Tudo o que José fazia prosperava
  rationale: A forma causativa מַצְלִיחַ apresenta Yahweh como aquele que concede o êxito; a tradução mantém essa causalidade explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação evita o literalismo obscuro de “em sua mão”, mas registra a imagem hebraica em nota; mantém “Yahweh” como nome divino e conserva a força causativa da ação de Deus.
