  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: pt
  text: 'Depois dessas coisas, a esposa de seu senhor pôs os olhos em José[a] e disse: “Deite-se comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levantou os olhos para José”; aqui, a expressão indica atenção concentrada e desejosa.
