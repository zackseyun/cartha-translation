lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Preserva de perto a fórmula narrativa hebraica e introduz com naturalidade um acontecimento posterior.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: pôs os olhos em
  rationale: Expressa de modo idiomático em português a atenção dirigida e desejosa indicada pelo contexto, sem explicitar mais do que o hebraico.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: a mulher de seu senhor
  rationale: Mantém clara a relação da mulher com o senhor de José; 'mulher' é natural e pode designar a esposa nesse contexto.
- source_word: יוֹסֵף
  choice: José
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: שִׁכְבָה עִמִּי
  choice: Deite-se comigo
  rationale: Reproduz de maneira direta a ordem e a proposta sexual do hebraico, sem recorrer a um eufemismo mais brando.
