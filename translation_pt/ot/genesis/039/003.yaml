  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: pt
  text: Seu senhor viu que Yahweh estava com ele e que Yahweh fazia prosperar tudo o que ele fazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “nas mãos dele”; também pode ter o sentido de “por meio dele” ou “sob sua direção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva a simplicidade narrativa de ראה, embora no contexto envolva perceber pelos resultados.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: Designa Potifar como aquele que detinha autoridade sobre José; em português bíblico corrente, «senhor» mantém a relação social sem confundi-lo com o nome divino, explicitado como Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אִתּוֹ
  choice: estava com ele
  rationale: Expressa naturalmente a presença favorável de Yahweh junto de José, mantendo o pronome do hebraico.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: tudo o que ele realizava
  rationale: O aspecto participial indica a atividade habitual ou contínua de José; «realizava» é natural no contexto do trabalho sob sua responsabilidade.
- source_word: מַצְלִיחַ
  choice: fazia prosperar
  rationale: A forma causativa de צלח atribui explicitamente a Yahweh o êxito das atividades de José.
- source_word: בְּיָדוֹ
  choice: representado no sentido da oração, com nota sobre a imagem literal «em sua mão»
  rationale: A expressão hebraica pode indicar esfera, agência ou direção. Reproduzir literalmente «em sua mão» seria pouco natural e potencialmente obscuro em português; a nota preserva a imagem e a ambiguidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Sentido de בְּיָדוֹ
  choice: não resolver no corpo do texto entre agência, esfera de atuação e direção; registrar a expressão literal em nota
  alternative: por meio dele; sob sua direção; em sua mão
  rationale: A construção hebraica admite mais de uma nuance. Uma formulação portuguesa excessivamente específica eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi naturalizada sem apagar a agência divina nem a abrangência de «tudo». O marcador [a] aparece no texto e remete à expressão final hebraica.
