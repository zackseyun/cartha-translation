  naturalness: A construção “E, quando” com vírgula depois de “E” é pouco natural na prosa portuguesa contemporânea. A omissão da conjunção inicial preserva perfeitamente a relação temporal e produz uma frase mais fluente. “Junto a mim” expressa com naturalidade a proximidade indicada por אֶצְלִי.
  terminology: “Veste” é um equivalente adequado e de registro narrativo digno para בֶּגֶד. “Gritei”, “fugiu” e “para fora” mantêm o sentido contextual e direcional do hebraico sem especificações indevidas.
