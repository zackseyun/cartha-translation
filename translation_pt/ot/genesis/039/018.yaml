  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: pt
  text: Quando levantei a voz e gritei, ele deixou sua veste[a] junto a mim e fugiu para fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manto”. O hebraico בֶּגֶד é um termo geral para uma peça de roupa e não especifica exatamente de que tipo era.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E, quando
  rationale: A forma narrativa de היה introduz aqui a oração temporal; “E, quando” preserva a continuidade do relato sem a formulação rígida “e aconteceu”.
- source_word: כַּהֲרִימִי
  choice: levantei
  rationale: O hifil de רום com a preposição כְּ expressa “quando levantei”; em português, “levantar a voz” é a expressão natural correspondente.
- source_word: קוֹלִי
  choice: a voz
  rationale: קוֹל significa “voz” neste contexto; o possessivo já está expresso pelo sujeito de “levantei” na construção idiomática portuguesa.
- source_word: וָאֶקְרָא
  choice: e gritei
  rationale: קרא pode significar chamar, clamar ou gritar. No contexto de um suposto pedido de socorro, “gritei” comunica a urgência sem acrescentar conteúdo ao grito.
- source_word: וַיַּעֲזֹב
  choice: ele deixou
  rationale: עזב descreve a veste deixada para trás; “deixou” é direto e natural.
- source_word: בִּגְדוֹ
  choice: sua veste
  rationale: בֶּגֶד é um termo geral para roupa ou veste e não identifica com certeza uma peça específica.
- source_word: אֶצְלִי
  choice: ao meu lado
  rationale: אֵצֶל indica proximidade. “Ao meu lado” preserva o sentido espacial sem sugerir necessariamente posse.
- source_word: וַיָּנָס
  choice: e fugiu
  rationale: נוס denota fuga; “fugiu” mantém a urgência e a concisão do hebraico.
- source_word: הַחוּצָה
  choice: para fora
  rationale: A forma direcional indica movimento em direção ao exterior; “para fora” torna essa direção explícita em português.
