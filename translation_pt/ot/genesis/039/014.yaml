base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: pt
  text: 'Então ela chamou os homens de sua casa e lhes disse: “Vejam! Ele nos trouxe um homem hebreu para zombar de nós.[a] Ele veio até mim para se deitar comigo, e eu gritei bem alto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fazer de nós motivo de riso” ou “para se divertir à nossa custa”. Neste contexto, o verbo hebraico pode sugerir escárnio ou diversão abusiva, com uma dimensão de humilhação sexual na acusação feita por ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Então ela chamou os homens de sua casa
  rationale: O wayyiqtol dá continuidade à narrativa, expresso naturalmente por “Então”. אַנְשֵׁי é masculino plural, e בֵיתָהּ pode designar tanto a casa quanto o grupo doméstico; “os homens de sua casa” preserva ambos os aspectos.
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: e lhes disse
  rationale: A fórmula hebraica de introdução da fala contém literalmente “disse-lhes, dizendo”; em português atual, “lhes disse” transmite a função sem redundância artificial.
- source_word: רְאוּ
  choice: Vejam!
  rationale: Imperativo plural que chama enfaticamente a atenção dos homens da casa. “Vejam!” é corrente e preserva o número plural.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Ele nos trouxe um homem hebreu
  rationale: O hifil de בוא significa “trazer”, e לָנוּ é mantido por “nos”. “Homem hebreu” representa tanto אִישׁ quanto o qualificativo étnico עִבְרִי e conserva o tom acusatório da fala.
- source_word: לְצַחֶק בָּנוּ
  choice: para zombar de nós
  rationale: צחק com ב pode indicar fazer alguém objeto de riso, escárnio ou diversão abusiva. “Zombar de nós” é natural e suficientemente amplo para manter, sem explicitar em excesso, a humilhação com conotação sexual presente na acusação.
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: Ele veio até mim para se deitar comigo
  rationale: “Veio até mim” traduz בָּא אֵלַי sem acrescentar necessariamente a ideia de entrada. “Deitar-se comigo” preserva o conhecido eufemismo hebraico para relação sexual.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: e eu gritei bem alto
  rationale: A conjunção é preservada como “e”, sem impor contraste não expresso. “Gritei bem alto” comunica de modo idiomático a ação de clamar com voz forte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A fala mantém o tom acusatório e coletivo da mulher, sem tornar explícito além do hebraico o sentido sexual de לְצַחֶק בָּנוּ.
