  terminology: «Homem hebreu» representa fielmente אִישׁ עִבְרִי. «Zombar de nós» mantém o sentido amplo de לְצַחֶק בָּנוּ, e a nota explica com prudência as alternativas e a possível conotação contextual, sem a transformar em afirmação excessivamente específica. «Deitar-se comigo» conserva o eufemismo sexual do hebraico.
