  source_fidelity: 'A tradução preserva todos os elementos essenciais do hebraico: a convocação dos homens da casa, o apelo coletivo em «nos», a identificação de José como «um homem hebreu», a acusação de zombaria/abuso, a intenção sexual expressa por «deitar-se comigo» e o grito em voz alta. «Então» comunica adequadamente a progressão narrativa do wayyiqtol.'
