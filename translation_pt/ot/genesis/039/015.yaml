  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: pt
  text: Quando ele ouviu que eu tinha levantado a voz e gritado, deixou a roupa dele ao meu lado[a], fugiu e saiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou a roupa dele comigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Quando ele ouviu
  rationale: A fórmula narrativa וַיְהִי com a construção temporal כְּ + infinitivo é expressa naturalmente em português por uma oração temporal, sem o pouco idiomático “e aconteceu que”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que ele ouviu, isto é, que ela havia levantado a voz e gritado.
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: eu tinha levantado a voz e gritado
  rationale: “Levantar a voz” conserva o idioma hebraico em português natural; o mais-que-perfeito composto marca a anterioridade em relação a “ouviu”, e “gritado” transmite o clamor de alarme sem acrescentar conteúdo não expresso.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: deixou a roupa dele
  rationale: בֶּגֶד está no singular e designa a peça de roupa mencionada na narrativa; “a roupa dele” é claro e natural.
- source_word: אֶצְלִי
  choice: ao meu lado
  rationale: A preposição indica proximidade ou presença junto à mulher. “Ao meu lado” comunica a localização física, preservando em nota a alternativa mais ampla.
- source_word: וַיָּנָס
  choice: fugiu
  rationale: נוס denota fuga rápida; “fugiu” preserva de modo conciso a força do verbo.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: e saiu para fora
  rationale: A expressão hebraica combina o verbo “sair” com o elemento direcional “para fora”; a formulação mantém essa ênfase direcional e continua compreensível em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa é direta, e a repetição direcional final acompanha a ênfase do hebraico. A única nota preserva a amplitude semântica de אֶצְלִי.
