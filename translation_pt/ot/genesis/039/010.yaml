  terminology: “José” é a forma portuguesa corrente e apropriada. “Deitar-se ao lado dela” mantém o componente espacial de אֶצֶל e a nota registra adequadamente a possível conotação sexual. “Ficar com ela” é natural, mas “estar com ela” reproduz com maior precisão a amplitude de לִהְיוֹת עִמָּהּ.
