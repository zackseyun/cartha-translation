base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: pt
  text: 'E aconteceu que, como ela falava com José dia após dia, ele não lhe dava ouvidos: não se deitava ao lado dela[a] nem estava com ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deitar-se com ela”. Em hebraico, a expressão pode ter sentido sexual; “deitar-se ao lado dela” preserva a formulação espacial e permite que a frase seguinte, “estar com ela”, mantenha sua própria força.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a função narrativa da forma hebraica sem recorrer à expressão arcaica “e sucedeu que”.
- source_word: כְּדַבְּרָהּ ... יוֹם יוֹם
  choice: embora ela falasse ... dia após dia
  rationale: 'O contexto exige uma relação concessiva natural em português: apesar da insistência contínua dela, José recusava-se a atendê-la. “Dia após dia” reproduz a repetição enfática do substantivo hebraico.'
- source_word: יוֹסֵף
  choice: José
  rationale: Emprega a forma tradicional e plenamente corrente do nome em português.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: ele não lhe dava ouvidos
  rationale: Expressa naturalmente o sentido de não escutar, atender ou ceder ao pedido dela, sem restringir o verbo à obediência formal.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: para se deitar ao lado dela
  rationale: Preserva o valor espacial de אֵצֶל e não elimina a possível conotação sexual de שׁכב, esclarecida em nota.
- source_word: לִהְיוֹת עִמָּהּ
  choice: nem para ficar com ela
  rationale: Conserva a amplitude da segunda expressão, que pode indicar permanecer na companhia dela, sem reduzi-la ao ato sexual.
