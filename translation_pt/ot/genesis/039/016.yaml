  rationale: בֶּגֶד designa de modo amplo uma peça de vestuário; “roupa” preserva essa abrangência sem especificar o tipo de peça.
- source_word: אֶצְלָהּ
  choice: ao seu lado
  rationale: Reproduz o sentido espacial de manter a peça junto dela.
- source_word: אֲדֹנָיו
  choice: o senhor dele
  rationale: Mantém a relação senhor-servo indicada pelo hebraico e evita confusão com o nome divino.
- source_word: אֶל־בֵּיתוֹ
  choice: para casa
  rationale: Em português corrente, a expressão idiomática comunica naturalmente que ele entrou ou chegou à própria casa.
