revisions:
- from: O chefe da prisão confiou aos cuidados de José todos os presos que estavam na prisão, e tudo o que se fazia ali era feito sob a responsabilidade dele.[a]
  to: O chefe da prisão confiou a José todos os presos que estavam na prisão, e tudo o que se fazia ali era ele quem fazia.[a]
  rationale: A revisão conserva o sentido idiomático de entregar os presos ao encargo de José e restaura, na oração final, a repetição verbal e a ênfase pessoal do hebraico. A leitura que salienta a responsabilidade administrativa é preservada como alternativa em nota, sem reduzir indevidamente o texto principal a uma passiva interpretativa.
