    issue: 'A cláusula final foi parafraseada como voz passiva: «era feito sob a responsabilidade dele».'
    rationale: וְאֵת כָּל־אֲשֶׁר עֹשִׂים שָׁם הוּא הָיָה עֹשֶׂה repete o verbo «fazer» e emprega o pronome enfático הוּא. Embora possa implicar responsabilidade administrativa, o texto apresenta José como aquele que fazia tudo o que se fazia ali. A responsabilidade pode ser esclarecida em nota, mas não deve substituir a formulação textual.
  - severity: low
    issue: A nota chama de «literal» uma formulação que não reproduz adequadamente o valor passado-durativo de הָיָה עֹשֶׂה («ele é que fazia»).
    rationale: A nota deve apresentar a tradução mais administrativa como alternativa interpretativa, sem qualificá-la como literal, e deve manter a ênfase e o caráter contínuo da expressão hebraica.
  revised_text: O chefe da prisão confiou a José todos os presos que estavam na prisão, e tudo o que se fazia ali era ele quem fazia.[a]
