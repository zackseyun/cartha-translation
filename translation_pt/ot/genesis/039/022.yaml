base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: pt
  text: O chefe da prisão confiou a José todos os presos que estavam na prisão, e tudo o que se fazia ali era ele quem fazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que se fazia ali estava sob a responsabilidade dele”. A expressão enfatiza que José era responsável pelas atividades realizadas na prisão, sem necessariamente indicar que executava pessoalmente cada tarefa.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: o chefe da prisão
  rationale: שַׂר designa o oficial responsável pelo estabelecimento. “Chefe da prisão” é claro, atual e próximo da forma hebraica.
- source_word: בְּיַד יוֹסֵף
  choice: confiou aos cuidados de José
  rationale: A expressão literal “na mão de José” é um idiomatismo que indica entrega à autoridade e responsabilidade de alguém; a tradução comunica naturalmente esse sentido em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome hebraico יוֹסֵף.
- source_word: כָּל הָאֲסִירִם
  choice: todos os presos
  rationale: אֲסִירִים refere-se às pessoas encarceradas; “presos” é natural e inequívoco neste contexto.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: e tudo o que se fazia ali
  rationale: O particípio plural indefinido permite uma formulação impessoal. “Tudo o que se fazia ali” preserva a abrangência das atividades sem introduzir um agente específico.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: era feito sob a responsabilidade dele
  rationale: O pronome enfático e a construção היה + particípio apresentam José como responsável contínuo por tudo o que ocorria. A formulação evita sugerir que ele executava pessoalmente cada tarefa.
