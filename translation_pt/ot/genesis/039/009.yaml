  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: pt
  text: Não há ninguém maior do que eu nesta casa[a], e ele não me negou nada, exceto você, porque você é sua esposa. Como, então, eu poderia fazer este grande mal[b] e pecar contra Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nesta casa, ninguém é maior do que eu”. O hebraico nega literalmente que exista alguém maior do que José dentro da casa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esta grande maldade”. A palavra hebraica רָעָה pode significar mal, maldade ou ato errado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Não há ninguém maior do que eu
  rationale: A construção com אֵין nega a existência de alguém superior a José na casa; esta formulação preserva esse sentido e soa natural em português.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: בַּיִת pode indicar tanto a casa quanto a unidade doméstica; «nesta casa» conserva a imagem hebraica e abrange o contexto administrativo.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: não me negou coisa alguma
  rationale: חָשַׂךְ significa reter ou negar algo; sob negação, מְאוּמָה corresponde a «coisa alguma». A expressão é clara e idiomática.
- source_word: כִּי אִם אוֹתָךְ
  choice: exceto você
  rationale: Depois de uma negação, כִּי אִם introduz a única exceção.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: porque você é a mulher dele
  rationale: A construção apresenta a razão da exceção. «Mulher» é uma forma corrente para «esposa» e reflete אִשָּׁה no contexto conjugal.
- source_word: וְאֵיךְ
  choice: Como, então, eu poderia
  rationale: O waw introduz a conclusão moral derivada do que José acabou de afirmar; «então» torna essa relação explícita sem alterar o sentido.
- source_word: אֶעֱשֶׂה הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: cometer tamanha maldade
  rationale: Embora עשה seja literalmente «fazer», «cometer» combina naturalmente com «maldade» em português. «Tamanha» transmite a intensidade de הַגְּדֹלָה e o valor demonstrativo de הַזֹּאת no contexto.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: e pecar contra Deus
  rationale: חטא com ל indica pecado contra alguém; «contra Deus» é a construção portuguesa natural.
theological_decisions:
- issue: Referente de אֱלֹהִים na fala de José
  choice: Deus
  alternative: um deus
  rationale: No contexto narrativo de Gênesis, José se refere ao Deus que adora, e sua avaliação moral vai além de uma ofensa social. A inicial maiúscula representa adequadamente esse referente.
- issue: Natureza moral do ato proposto
  choice: maldade
  alternative: mal
  rationale: רָעָה pode significar mal, maldade ou ato errado. «Maldade» destaca o caráter moral sem acrescentar uma categoria doutrinária específica; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» na fala direta e «a mulher dele» em sentido conjugal corrente. A ordem e a força argumentativa do hebraico foram preservadas com equivalência ótima.
