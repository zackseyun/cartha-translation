base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your slave did to me,” his anger burned.
translation:
  language: pt
  text: 'E aconteceu que, quando seu senhor ouviu as palavras que a mulher dele lhe disse: “Foi isso[a] que o teu escravo[b] fez comigo”, sua ira se acendeu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Segundo estas palavras, o teu escravo fez comigo”. A expressão hebraica pode significar “tais coisas” ou apontar para a acusação que acabava de ser relatada.
    reason: lexical_alternative
  - marker: b
    text: Ou “servo”. O termo hebraico עבד pode ter ambos os sentidos, mas “escravo” corresponde melhor à condição de José nesse contexto doméstico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a transição narrativa hebraica de modo natural e reconhecível em português.
- source_word: כִשְׁמֹעַ
  choice: quando ... ouviu
  rationale: Expressa com clareza a circunstância temporal marcada por כ com o infinitivo construto.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: Indica o proprietário e superior de José no contexto doméstico, sem acrescentar o nome ausente no hebraico.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: as palavras que sua mulher lhe disse
  rationale: Conserva a referência explícita às palavras da mulher, evitando uma repetição pouco natural em português.
- source_word: לֵאמֹר
  choice: dois-pontos antes da citação
  rationale: A função do infinitivo quotativo é expressa naturalmente pela pontuação portuguesa, sem o pesado ‘dizendo’.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Foi isso que
  rationale: Comunica de forma idiomática a força demonstrativa da expressão, cuja formulação literal admite mais de uma nuance; a alternativa é registrada em nota.
- source_word: עָשָׂה לִי
  choice: fez comigo
  rationale: Mantém o verbo amplo ‘fazer’ e evita explicitar ‘contra mim’, ideia possível no contexto, mas não expressa diretamente pela preposição hebraica.
- source_word: עַבְדְּךָ
  choice: teu escravo
  rationale: Embora o termo também possa significar ‘servo’, ‘escravo’ representa melhor a condição de José na casa de Potifar.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira se acendeu
  rationale: Preserva a imagem hebraica da ira que se inflama, em linguagem portuguesa corrente e digna.
