  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: pt
  text: Yahweh estava com José, e ele se tornou um homem bem-sucedido[a]; e estava na casa de seu senhor egípcio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “próspero”. O particípio hebraico pode indicar alguém que prospera ou alcança êxito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת יוֹסֵף
  choice: com José
  rationale: A construção expressa a presença favorável de Yahweh junto de José; “José” é a forma portuguesa tradicional e amplamente reconhecida.
- source_word: אִישׁ מַצְלִיחַ
  choice: um homem bem-sucedido
  rationale: Mantém אִישׁ, que se refere especificamente a José, e traduz o particípio מַצְלִיחַ de modo natural, sem restringir seu sentido à prosperidade financeira.
- source_word: בְּבֵית אֲדֹנָיו
  choice: na casa do seu senhor
  rationale: Reproduz de perto a referência à casa e usa “senhor” no sentido humano de alguém que detém autoridade sobre José.
- source_word: הַמִּצְרִי
  choice: egípcio
  rationale: Funciona naturalmente como adjetivo de “senhor” e preserva a identificação étnica do texto.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: estava ... se tornou ... ficou
  rationale: Expressa em português corrente a sequência narrativa e a mudança indicada na cláusula central, sem repetir mecanicamente uma única forma verbal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico apresenta diretamente o nome divino; “Yahweh” o conserva como nome próprio, evitando substituí-lo por um título.
- issue: Natureza do êxito de José
  choice: bem-sucedido
  alternative: próspero
  rationale: O particípio pode descrever quem prospera ou alcança êxito. “Bem-sucedido” preserva a amplitude do sentido e evita sugerir exclusivamente riqueza material.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação preserva as três cláusulas do hebraico; “senhor” é humano e contextual, enquanto “Yahweh” identifica inequivocamente o nome divino.
