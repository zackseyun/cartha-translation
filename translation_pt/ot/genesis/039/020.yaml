base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: pt
  text: Então o senhor de José o pegou e o colocou na prisão[a], o lugar onde os prisioneiros do rei eram mantidos presos[b]. E ele estava ali, na prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “casa do sohar”; sohar é um termo de possível origem egípcia para uma prisão ou casa de detenção.
    reason: cultural_note
  - marker: b
    text: 'O hebraico repete a raiz que significa “amarrar” ou “prender”: literalmente, “onde os prisioneiros do rei estavam presos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: o senhor de José
  rationale: No contexto, אֲדֹנֵי designa o senhor humano a quem José servia, não um título divino. Em português, “senhor de José” preserva a relação social do relato sem recorrer ao menos natural “mestre”.
- source_word: וַיִּקַּח
  choice: o pegou
  rationale: לקח significa normalmente “pegar” ou “tomar”. “Pegou” expressa a ação sem acrescentar a força implícita em “agarrou” ou “prendeu”.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: o colocou na
  rationale: נתן com אֶל indica aqui colocar alguém em determinado lugar. “Colocou na prisão” é claro e natural em português.
- source_word: בֵּית הַסֹּהַר
  choice: a prisão
  rationale: A expressão literalmente contém “casa” e o termo סֹהַר, provavelmente relacionado ao ambiente egípcio; no contexto, designa claramente uma prisão. A tradução funcional evita uma formulação obscura.
- source_word: מְקוֹם אֲשֶׁר
  choice: o lugar onde
  rationale: Mantém a aposição explicativa explícita no hebraico, em vez de condensá-la apenas em “onde”.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: os prisioneiros do rei eram mantidos presos
  rationale: A formulação conserva de modo natural a repetição enfática da raiz אסר, presente tanto em “prisioneiros” quanto em “presos”.
- source_word: וַיְהִי שָׁם
  choice: E ele ficou ali
  rationale: היה com שָׁם descreve a presença resultante de José naquele lugar. “Ficou ali” soa natural em português e, neste contexto narrativo, não exige a ideia adicional de permanência prolongada.
- source_word: בְּבֵית הַסֹּהַר
  choice: na prisão
  rationale: Repete o local no fim do versículo, acompanhando a repetição enfática do hebraico.
