  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: pt
  text: Assim, ele deixou tudo o que tinha nas mãos de José e não se ocupava de nada, exceto da comida que comia.[a] José era belo de porte e de aparência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Comida” traduz literalmente “pão”, termo que aqui provavelmente se refere ao alimento em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: deixou
  rationale: Mantém o sentido básico de עזב e, no contexto administrativo, comunica naturalmente que Potifar entregou seus bens aos cuidados de José.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que tinha
  rationale: Expressão ampla e idiomática que abrange os bens e assuntos de Potifar.
- source_word: בְּיַד יוֹסֵף
  choice: nas mãos de José
  rationale: Preserva a imagem hebraica da mão como esfera de responsabilidade e autoridade; o plural é a formulação idiomática natural em português.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: estando José encarregado, não se preocupava com coisa alguma
  rationale: 'A construção hebraica é literalmente difícil (''não sabia com ele coisa alguma''). A tradução expressa o sentido contextual sem identificar indevidamente אִתּוֹ com os bens: na presença e administração de José, Potifar não precisava ocupar-se de nada.'
- source_word: כִּי אִם
  choice: exceto
  rationale: Reproduz de modo conciso a construção de exceção.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: a comida que comia
  rationale: לֶחֶם significa literalmente 'pão', mas pode designar alimento ou refeição em geral; 'comida' é natural no contexto.
- source_word: וַיְהִי יוֹסֵף
  choice: José era
  rationale: Introduz com naturalidade a descrição de José que prepara o episódio seguinte, sem sugerir que ele passou a ter essa aparência naquele momento.
- source_word: יְפֵה תֹאַר
  choice: belo de porte
  rationale: תֹאַר se refere à forma ou constituição física; 'porte' preserva a distinção em relação à aparência visual da expressão seguinte.
- source_word: וִיפֵה מַרְאֶה
  choice: belo de aparência
  rationale: מַרְאֶה indica o aspecto visível. A formulação mantém o paralelismo e a distinção lexical do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conserva a metáfora de responsabilidade em “nas mãos de José”, mas torna inteligível a expressão hebraica ambígua וְלֹא יָדַע אִתּוֹ מְאוּמָה. Evita o pouco natural “não sabia nada com ele”. O marcador [a] aparece no texto após a expressão explicada.
