id: GEN.39.1
reference: Genesis 39:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: pt
  text: José havia sido levado para o Egito, e Potifar, oficial do faraó[a], comandante da guarda e egípcio[b], comprou-o dos ismaelitas que o haviam levado para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “eunuco do faraó”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um homem egípcio”.'
    reason: literal_rendering
lexical_decisions:
- source_word: הוּרַד
  choice: havia sido levado
  rationale: O hofal de ירד expressa ação passiva causativa. A forma mais-que-perfeita situa a chegada forçada de José ao Egito antes de sua compra por Potifar, sem impor ao português a repetição pouco natural de “descer”.
- source_word: מִצְרָיְמָה
  choice: para o Egito
  rationale: A terminação direcional indica movimento rumo ao Egito; “para o Egito” é a formulação corrente em português.
- source_word: וַיִּקְנֵהוּ
  choice: comprou-o
  rationale: Neste contexto de comércio de escravos, קנה significa naturalmente “comprar”; o pronome mantém José como objeto da transação.
- source_word: סְרִיס פַּרְעֹה
  choice: oficial do faraó
  rationale: סְרִיס pode designar tanto um eunuco como um funcionário da corte. “Oficial” é adequado ao cargo administrativo no texto principal, e a alternativa literal é preservada em nota.
- source_word: שַׂר הַטַּבָּחִים
  choice: comandante da guarda
  rationale: A expressão indica o chefe de um corpo real que podia exercer funções de guarda e execução. Esta tradução comunica o cargo sem definir em excesso sua função exata.
- source_word: אִישׁ מִצְרִי
  choice: egípcio
  rationale: Em português, após o nome e os títulos de Potifar, “egípcio” transmite naturalmente sua identidade nacional; a forma hebraica mais explícita é indicada em nota.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: dos ismaelitas
  rationale: A locução “da mão de” funciona aqui idiomaticamente como indicação da parte de quem Potifar comprou José; “dos” é natural em português.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: que o haviam levado para lá
  rationale: A oração relativa identifica os ismaelitas como os que anteriormente levaram José ao Egito. “Para lá” preserva שָׁמָּה e retoma o destino já mencionado.
theological_decisions:
- issue: Sentido de סְרִיס no título de Potifar
  choice: “oficial do faraó” no texto principal
  alternative: “eunuco do faraó”
  rationale: O termo hebraico admite tanto o sentido físico de “eunuco” quanto o funcional de “oficial da corte”. O contexto não resolve a ambiguidade; por isso, emprega-se o sentido administrativo mais amplo no texto e registra-se a alternativa em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. “Faraó” é tratado como título, e “comandante da guarda” evita o arcaísmo e a possível superespecificação de “chefe dos carrascos”. Os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
