base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: pt
  text: Ali ele construiu um altar e chamou o lugar de El-Betel[a], porque ali Deus havia se revelado a ele quando fugiu de seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El-Betel provavelmente significa “Deus de Betel”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O qal narrativo de בנה tem o sentido comum de construir; esta é a forma natural em português.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio de lugar. A repetição no versículo foi preservada.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Equivalente corrente e preciso para o altar sacrificial.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: chamou o lugar de
  rationale: Expressa naturalmente em português o ato de dar nome indicado por קרא com לְ.
- source_word: אֵל בֵּית אֵל
  choice: El-Betel
  rationale: A expressão funciona como o nome dado ao lugar, por isso foi transliterada; seu provável significado foi preservado em nota.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual o lugar recebeu esse nome.
- source_word: נִגְלוּ
  choice: havia se revelado
  rationale: O nifal de גלה descreve manifestação ou revelação divina. O mais-que-perfeito situa o acontecimento antes da construção do altar.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, o contexto se refere ao Deus de Israel no singular.
- source_word: אֵלָיו
  choice: a ele
  rationale: Tradução direta da locução preposicional, mantendo explícito o destinatário da revelação.
- source_word: בְּבָרְחוֹ
  choice: quando fugia
  rationale: O infinitivo construto com בְּ indica circunstância temporal; o imperfeito português apresenta a fuga como situação em curso.
- source_word: מִפְּנֵי אָחִיו
  choice: de seu irmão
  rationale: Em contexto de fuga, מִפְּנֵי significa afastar-se ou fugir de alguém; a formulação escolhida é natural em português.
theological_decisions:
- issue: A forma plural אֱלֹהִים acompanhada do verbo plural נִגְלוּ refere-se ao Deus de Israel.
  choice: Deus havia se revelado a ele
  alternative: Deus apareceu a ele; tradução morfologicamente plural
  rationale: O contexto é a experiência de Jacó com o único Deus em Betel. O singular comunica o referente pretendido sem sugerir vários deuses, enquanto a construção reflexiva preserva a ideia de automanifestação.
- issue: Traduzir ou transliterar אֵל בֵּית אֵל.
  choice: Transliterar como El-Betel no texto principal.
  alternative: Deus de Betel
  rationale: Como a expressão é apresentada como o nome dado ao lugar, a transliteração preserva sua função onomástica; o provável sentido lexical aparece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “ali” reproduz a estrutura do hebraico sem soar artificial.
