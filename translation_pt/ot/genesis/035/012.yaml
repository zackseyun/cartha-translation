base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: pt
  text: E a terra que dei[a] a Abraão e a Isaque, eu a darei a você; e à sua descendência[b], depois de você, darei a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho concedido”.'
    reason: lexical_alternative
  - marker: b
    text: “Descendência” traduz um substantivo coletivo singular que também pode ser traduzido como “semente” ou “descendentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da promessa patriarcal, refere-se à terra prometida; “a terra” é natural e mantém a especificidade do hebraico.
- source_word: נָתַתִּי
  choice: dei
  rationale: O qatal aponta para a dádiva ou concessão anterior feita a Abraão e Isaque. O pretérito preserva o contraste com os verbos futuros que seguem.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: a Abraão e a Isaque
  rationale: A formulação conserva ambos os destinatários e soa natural em português; a repetição da preposição hebraica não precisa ser reproduzida para preservar o sentido.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: eu a darei a você
  rationale: O pronome “a” retoma “a terra”, como o sufixo feminino hebraico, e o pronome explícito “eu” dá destaque natural à promessa divina.
- source_word: זַרְעֲךָ
  choice: sua descendência
  rationale: “Descendência” preserva o caráter coletivo singular de זֶרַע e é mais natural em português atual do que “semente” neste contexto.
- source_word: אַחֲרֶיךָ
  choice: depois de você
  rationale: Mantém de modo direto a ideia temporal e geracional da expressão hebraica.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: darei a terra
  rationale: Preserva a repetição intencional de “dar” e “a terra” no encerramento da promessa.
theological_decisions:
- issue: Relação entre a dádiva passada e a promessa futura da terra
  choice: Traduzir נָתַתִּי no passado (“dei”) e os verbos seguintes no futuro (“darei”).
  alternative: Traduzir נָתַתִּי como “tenho dado”, ressaltando a validade contínua da concessão.
  rationale: O hebraico justapõe uma concessão divina anterior e sua realização prometida para Jacó e sua descendência. A tradução mantém essa tensão temporal e teológica sem a harmonizar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para linguagem corrente e mantém a repetição solene da promessa hebraica.
