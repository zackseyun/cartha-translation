base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: pt
  text: 'E os filhos de Bila, serva[a] de Raquel: Dã e Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escrava de Raquel”. O termo hebraico designa uma mulher de condição social subordinada e, em certos contextos, pode indicar uma mulher escravizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: O substantivo בְנֵי é o plural construto de בֵּן e introduz mais um grupo na lista genealógica; “E” preserva a conjunção e a continuidade da enumeração.
- source_word: בִלְהָה
  choice: Bila
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: שִׁפְחַת
  choice: serva
  rationale: שִׁפְחָה designa uma mulher em condição servil. “Serva” é natural e conciso em português e mantém a referência feminina, sem determinar além do hebraico se a condição deve ser entendida estritamente como escravidão.
- source_word: רָחֵל
  choice: de Raquel
  rationale: A construção possessiva hebraica é vertida naturalmente como “serva de Raquel”; o nome segue a forma portuguesa consagrada.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional do nome próprio em português.
- source_word: וְ/נַפְתָּלִי
  choice: e Naftali
  rationale: A conjunção simples e o nome próprio são reproduzidos diretamente; “Naftali” é a forma corrente em português.
