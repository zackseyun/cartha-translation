  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: pt
  text: Então partiram, e um terror vindo de Deus[a] caiu sobre as cidades ao redor deles, de modo que elas não perseguiram os filhos de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o terror de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Então partiram
  rationale: O wayyiqtol faz a narrativa avançar; “partiram” expressa de modo natural o início da viagem indicado por נסע.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: um terror vindo de Deus caiu sobre
  rationale: A formulação portuguesa idiomática preserva o caráter eventivo de היה com עַל e apresenta Deus como a provável origem do terror, sem apagar a ambiguidade do construto.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: ao redor deles
  rationale: Identifica de forma concisa e natural as cidades vizinhas que cercavam o grupo de Jacó.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: de modo que não perseguiram
  rationale: Explicita a relação resultativa sugerida pelo contexto e traduz naturalmente a locução hebraica רדף אחרי.
- source_word: בְּנֵי יַעֲקֹב
  choice: os filhos de Jacó
  rationale: Mantém a referência masculina plural do hebraico e é a expressão familiar mais natural em português.
theological_decisions:
- issue: Sentido do construto חִתַּת אֱלֹהִים
  choice: um terror vindo de Deus
  alternative: o terror de Deus; um grande terror
  rationale: No contexto, a frase provavelmente apresenta Deus como a origem do terror que protege o grupo. A nota preserva a construção mais formal e sua ambiguidade; a leitura meramente intensiva, embora possível, tornaria a agência divina menos explícita.
- issue: Referente de בְּנֵי יַעֲקֹב
  choice: os filhos de Jacó
  alternative: os descendentes de Jacó
  rationale: O substantivo hebraico é masculino e, neste contexto narrativo, a referência aos filhos homens de Jacó deve ser mantida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita arcaísmos e conserva, em nota, a ambiguidade da expressão hebraica sobre a origem ou caracterização divina do terror.
