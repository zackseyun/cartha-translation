base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: pt
  text: Então Israel seguiu viagem e armou sua tenda além de Migdal-Éder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-Éder significa “torre do rebanho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: seguiu viagem
  rationale: O verbo נסע na sequência narrativa indica partir ou prosseguir viagem. “Seguiu viagem” expressa naturalmente tanto o deslocamento quanto a continuidade da narrativa.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O texto hebraico emprega o nome Israel; a tradução o preserva sem harmonizá-lo com Jacó.
- source_word: וַיֵּט
  choice: armou
  rationale: Com “tenda” como objeto, נטה significa idiomaticamente estender ou armar uma tenda. “Armou” é a formulação corrente em português.
- source_word: אָהֳלֹה
  choice: sua tenda
  rationale: 'אֹהֶל significa “tenda”, e o sufixo masculino singular indica posse: “sua tenda”.'
- source_word: מֵהָלְאָה
  choice: além de
  rationale: O advérbio הָלְאָה, com a preposição מִן, situa a tenda mais adiante ou para além do ponto indicado; “além de” preserva concisamente essa relação espacial.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-Éder
  rationale: A expressão funciona aqui como nome de lugar, por isso é transliterada. Seu sentido lexical é preservado em nota.
