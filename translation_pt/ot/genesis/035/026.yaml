  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: pt
  text: 'E os filhos de Zilpa[a], serva de Lia: Gade e Aser[b]. Estes são os filhos de Jacó que lhe nasceram em Padã-Arã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por “criada” ou, de modo mais explícito quanto à condição social, “mulher escravizada”.
    reason: lexical_alternative
  - marker: b
    text: Embora este versículo diga que esses filhos nasceram a Jacó em Padã-Arã, Benjamim nasceu mais tarde em Canaã (vv. 16–18). A frase parece resumir os filhos ligados ao período da família de Jacó na região arameia, sem aplicar a Benjamim esta indicação de lugar.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”; a tradução mantém a referência específica aos descendentes homens nesta lista genealógica.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: שִׁפְחַת
  choice: serva
  rationale: שִׁפְחָה designa uma mulher em condição de serviço ou escravidão. “Serva” é natural, conciso e preserva o gênero, enquanto a nota registra a possível explicitação mais forte da condição social.
- source_word: לֵאָה
  choice: de Lia
  rationale: Expressa naturalmente em português a relação construta “serva de Lia”.
- source_word: גָּד וְאָשֵׁר
  choice: Gade e Aser
  rationale: Formas portuguesas tradicionais e reconhecíveis dos nomes próprios.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Estes são os filhos de Jacó
  rationale: Reproduz de modo direto o demonstrativo e mantém “filhos”, conforme o hebraico e o contexto genealógico.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: que lhe nasceram
  rationale: O passivo com לּוֹ é expresso idiomaticamente sem introduzir uma mãe como sujeito, que não está explicitada na oração hebraica.
- source_word: בְּפַדַּן אֲרָם
  choice: em Padã-Arã
  rationale: Mantém o topônimo por transliteração, em forma corrente nas traduções portuguesas.
theological_decisions:
- issue: A afirmação de que os filhos de Jacó lhe nasceram em Padã-Arã diante do nascimento de Benjamim em Canaã
  choice: Manter sem alteração a generalização geográfica do texto hebraico e explicar a tensão em nota
  alternative: Reformular o enunciado para excluir explicitamente Benjamim
  rationale: O hebraico apresenta a frase de modo abrangente. Uma reformulação resolveria silenciosamente uma tensão interna que deve ser preservada; a nota informa o dado narrativo de 35.16–18 sem impor uma harmonização única.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas onomásticas tradicionais em português. “Serva” evita o arcaísmo de “serva de companhia”, mas a nota preserva a força social possível de שִׁפְחָה. A sintaxe permanece próxima do hebraico sem soar artificial.
