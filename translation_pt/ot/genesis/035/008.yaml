base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: pt
  text: Débora, a ama de Rebeca, morreu e foi sepultada abaixo de Betel, debaixo do carvalho[a]. E ele lhe deu o nome de Alom-Bacute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico אַלּוֹן pode designar um carvalho ou um terebinto; não é possível determinar com certeza a espécie da árvore.
    reason: lexical_alternative
  - marker: b
    text: Alom-Bacute provavelmente significa “Carvalho do Choro”; se אַלּוֹן for entendido como “terebinto”, “Terebinto do Choro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: ama
  rationale: O substantivo designa a mulher que amamentava e cuidava de uma criança. Em português bíblico corrente, “ama” expressa naturalmente essa função sem afirmar mais do que o contexto permite.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: abaixo de Betel
  rationale: A expressão indica uma localização inferior a Betel, provavelmente em termos topográficos; “abaixo de” preserva a relação espacial sem convertê-la em direção cardinal.
- source_word: תַּחַת הָאַלּוֹן
  choice: debaixo do carvalho
  rationale: תַּחַת indica posição sob a árvore. אַלּוֹן costuma ser vertido como “carvalho”, embora a identificação como “terebinto” também seja possível e seja registrada em nota.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: E ele lhe deu o nome de
  rationale: A forma verbal é ativa, na terceira pessoa masculina do singular, mas o sujeito fica implícito. A formulação portuguesa mantém esse sujeito gramatical sem identificá-lo além do hebraico; “lhe” refere-se naturalmente à árvore ou ao lugar mencionado.
- source_word: אַלּוֹן בָּכוּת
  choice: Alom-Bacute
  rationale: O topônimo é transliterado no texto principal, em forma adaptada ao português, e seu significado provável é explicado em nota.
- source_word: וַתִּקָּבֵר
  choice: foi sepultada
  rationale: O nifal pede uma tradução passiva, sem introduzir agentes não mencionados no texto.
- source_word: וַתָּמָת
  choice: morreu
  rationale: Tradução direta e digna do verbo, sem o eufemismo de “faleceu” ou “partiu”.
theological_decisions: []
