  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ama” conserva a função histórica de Débora de modo conciso; o topônimo é transliterado segundo convenções portuguesas. A coordenação narrativa hebraica foi reproduzida sem rigidez excessiva.
