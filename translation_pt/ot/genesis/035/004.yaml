base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: pt
  text: Então eles deram a Jacó todos os deuses estrangeiros que estavam em suas mãos, bem como as argolas que estavam em suas orelhas[a]; e Jacó os escondeu debaixo do terebinto[b] que ficava perto de Siquém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brincos”. O termo hebraico pode designar argolas usadas em diferentes lugares, inclusive no nariz, mas aqui a frase seguinte especifica que estavam nas orelhas.
    reason: lexical_alternative
  - marker: b
    text: Ou “carvalho”. A palavra hebraica provavelmente se refere mais especificamente a um terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Então eles deram
  rationale: O wayyiqtol de נתן dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: אֶל יַעֲקֹב
  choice: a Jacó
  rationale: A preposição marca o destinatário ou objeto indireto do verbo “dar”.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: todos os deuses estrangeiros
  rationale: A expressão designa divindades alheias ao culto da família da aliança; a formulação preserva o sentido sem acrescentar uma explicação sobre a natureza material dos objetos.
- source_word: אֲשֶׁר בְּיָדָם
  choice: que estavam em suas mãos
  rationale: Mantém a imagem concreta do hebraico, que também pode ter o sentido contextual de objetos que estavam em sua posse.
- source_word: וְאֶת הַנְּזָמִים
  choice: bem como as argolas
  rationale: נְזָמִים pode designar argolas usadas no nariz ou nas orelhas. “Argolas” conserva essa amplitude lexical, enquanto a oração seguinte especifica que aqui estavam nas orelhas.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: que estavam em suas orelhas
  rationale: A construção hebraica é locativa; esta tradução não acrescenta a ideia separativa de que as argolas foram tiradas das orelhas, embora isso esteja naturalmente implícito na entrega.
- source_word: וַיִּטְמֹן אֹתָם
  choice: e Jacó os escondeu
  rationale: טמן significa esconder ou ocultar e pode envolver enterrar. “Escondeu” mantém a amplitude do verbo sem especificar além do texto como os objetos foram postos sob a árvore.
- source_word: תַּחַת הָאֵלָה
  choice: debaixo do terebinto
  rationale: אֵלָה provavelmente designa o terebinto, identificação mais específica do que o tradicional “carvalho”.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: que ficava perto de Siquém
  rationale: Com um nome de lugar, עִם comunica proximidade; “perto de Siquém” expressa naturalmente essa localização.
theological_decisions:
- issue: Natureza das argolas entregues e escondidas
  choice: O texto menciona separadamente os deuses estrangeiros e as argolas, sem declarar que as próprias argolas fossem ídolos ou amuletos.
  alternative: Entender as argolas como simples adornos valiosos ou, ao contrário, como objetos necessariamente idolátricos ou de caráter mágico.
  rationale: Embora o contexto seja a remoção de objetos ligados ao culto estrangeiro, o versículo não explica a função das argolas. A tradução preserva essa reserva e não resolve a questão por inferência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem hebraica “em suas mãos” e emprega-se “terebinto” por precisão botânica, com esclarecimento em nota.
