  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: pt
  text: 'E, quando o parto se tornou difícil, a parteira lhe disse: “Não tenha medo, pois este também é um filho seu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: E, quando o parto se tornou difícil
  rationale: A construção introduz a circunstância temporal e descreve a dificuldade do ato de dar à luz. A formulação é natural em português e preserva a progressão do parto difícil.
- source_word: הַמְיַלֶּדֶת
  choice: a parteira
  rationale: É o equivalente corrente e preciso para a mulher que auxilia no parto.
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: Traduz diretamente a proibição e soa natural como palavra de consolo em português moderno.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dada pela parteira para que Raquel não tema.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: este também é um filho seu
  rationale: 'Preserva o demonstrativo e a força aditiva de גַּם, enquanto verte o dativo לָךְ de modo idiomático como posse ou relação: “seu”.'
