  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: pt
  text: Então Deus subiu de junto dele, no lugar onde havia falado com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Deus ascendeu de junto dele”. O hebraico preserva o movimento para cima na partida de Deus após o encontro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O qal de עלה expressa movimento ascendente. “Subiu” preserva de modo natural e direto a imagem espacial do hebraico, sem reduzi-la ao sentido interpretativo de “partiu”.
- source_word: מֵעָלָיו
  choice: afastando-se dele
  rationale: A expressão indica que Deus se retira de junto ou de sobre Jacó. A construção explicita em português a relação de afastamento e evita o pouco natural “subiu dele”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa o único Deus e rege verbo no singular.
- source_word: בַּמָּקוֹם
  choice: no lugar
  rationale: A preposição בְּ com מָקוֹם é adequadamente representada por “no”, mantendo a localização da manifestação em português natural.
- source_word: אֲשֶׁר
  choice: onde
  rationale: Como o antecedente é “lugar”, “onde” introduz naturalmente a oração relativa locativa.
- source_word: דִּבֶּר אִתּוֹ
  choice: havia falado com ele
  rationale: O piel de דבר com אֵת significa “falar com”. O mais-que-perfeito composto mostra que a fala ocorreu antes da subida de Deus e preserva a possível reciprocidade sugerida por “com”.
theological_decisions:
- issue: Descrição espacial da partida de Deus
  choice: Manter o movimento ascendente em “Deus subiu”
  alternative: “Deus partiu” ou “Deus se retirou”
  rationale: O hebraico emprega linguagem comum de subida no contexto de uma manifestação divina. A tradução conserva essa imagem teofânica sem impor uma explicação filosófica sobre a presença de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “Afastando-se dele” torna idiomática a combinação hebraica de subida e separação, enquanto “subiu” conserva sua imagem vertical.
