    issue: “afastando-se dele” explicita a relação expressa por מֵעָלָיו mediante um gerúndio.
    rationale: O hebraico diz literalmente que Deus subiu “de sobre/de junto dele”; o gerúndio comunica a ideia geral, mas introduz uma elaboração sintática e semântica desnecessária. “De junto dele” conserva melhor a concisão e a imagem espacial.
  - severity: low
    issue: A nota atual apresenta “se elevou de junto dele” como alternativa, mas a diferença principal é apenas estilística e não esclarece de modo direto a alternativa lexical relevante.
    rationale: Uma nota que ofereça “ascendeu de junto dele” identifica com mais clareza a alternativa para “subiu”, preservando a relação espacial da expressão hebraica.
  revised_text: Então Deus subiu de junto dele, no lugar onde havia falado com ele.[a]
