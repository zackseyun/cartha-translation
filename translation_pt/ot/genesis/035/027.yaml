  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: pt
  text: Jacó chegou até seu pai Isaque, em Manre, em Quiriate-Arba (isto é, Hebrom), onde Abraão e Isaque tinham vivido como estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico indica que Abraão e Isaque residiram ali como estrangeiros ou moradores temporários, não apenas que moraram naquele lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo בוא pode significar “vir”, “ir” ou “chegar”; aqui, “chegou” expressa naturalmente a chegada de Jacó ao lugar onde estava Isaque.
- source_word: אֶל יִצְחָק אָבִיו
  choice: até seu pai Isaque
  rationale: Preserva a direção indicada por אֶל e a identificação explícita de Isaque como pai de Jacó, em ordem natural no português.
- source_word: מַמְרֵא
  choice: Manre
  rationale: Nome geográfico transliterado segundo a forma tradicional e reconhecível em português.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Quiriate-Arba
  rationale: Mantém o topônimo hebraico em transliteração portuguesa, sem transformar o nome próprio em uma tradução interpretativa.
- source_word: הִוא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: A expressão identifica Quiriate-Arba com Hebrom; a forma parentética é clara e natural em português moderno.
- source_word: אֲשֶׁר...שָׁם
  choice: onde
  rationale: O relativo e o advérbio locativo formam uma referência ao lugar, expressa idiomaticamente por “onde”.
- source_word: גָּר
  choice: tinham vivido como estrangeiros
  rationale: גור descreve residência na condição de forasteiro ou residente temporário, e não apenas o ato genérico de morar. O mais-que-perfeito composto situa essa residência antes da chegada de Jacó.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraão e Isaque
  rationale: Emprega as formas tradicionais dos nomes pessoais em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. “Chegou até” comunica a direção da viagem sem depender da perspectiva dêitica de “veio”. A nota preserva a nuance social e jurídica de גור.
