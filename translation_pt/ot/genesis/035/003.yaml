  source_fidelity: 'A tradução representa fielmente os coortativos (“Vamos nos levantar e subir”), o destino Betel, a intenção de fazer um altar dedicado ao Deus identificado pela oração relativa e as duas ações retrospectivas: ele respondeu na aflição de Jacó e esteve com ele no caminho. “Ao Deus” preserva adequadamente o artigo hebraico, e “no caminho por onde andei” comunica com naturalidade a imagem de הדרך אשר הלכתי.'
