  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: pt
  text: Vamos nos levantar e subir a Betel; ali farei um altar ao Deus que me respondeu[a] no dia da minha aflição e esteve comigo no caminho por onde andei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que me responde”, preservando o particípio hebraico como descrição mais geral ou contínua de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Vamos nos levantar
  rationale: O coortativo na primeira pessoa do plural expressa uma exortação. A formulação preserva essa força volitiva em português corrente.
- source_word: וְנַעֲלֶה
  choice: e subir
  rationale: עלה indica subir ou ascender; “subir” mantém a nuance espacial do deslocamento até Betel.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Trata-se de um topônimo, por isso é transliterado na forma portuguesa consagrada, sem traduzir seu significado.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: ali farei um altar
  rationale: עשה significa de modo amplo “fazer”. Embora “construirei” seja idiomático, “farei” permanece mais próximo do verbo hebraico e é compreensível.
- source_word: לָאֵל
  choice: ao Deus
  rationale: A preposição ל indica direção ou dedicação, e o artigo com a oração participial identifica especificamente Deus por sua ação em favor de Jacó.
- source_word: הָעֹנֶה אֹתִי
  choice: que me respondeu
  rationale: O particípio tem força relativa. O passado comunica a referência contextual à resposta divina recebida anteriormente, sem ocultar em nota a possibilidade de uma descrição habitual ou contínua.
- source_word: בְּיוֹם צָרָתִי
  choice: no dia da minha aflição
  rationale: Preserva o idioma hebraico “no dia de” e traduz צָרָה como uma situação de angústia ou adversidade, sem especificação indevida.
- source_word: וַיְהִי עִמָּדִי
  choice: e esteve comigo
  rationale: O wayyiqtol narrativo de היה é vertido naturalmente no passado; “esteve comigo” expressa de modo direto a presença divina.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: no caminho por onde andei
  rationale: Mantém a imagem concreta de דרך e הלך, ao mesmo tempo que soa natural e digna em português moderno.
theological_decisions:
- issue: Referência de אֵל na fala de Jacó
  choice: ao Deus
  alternative: a Deus
  rationale: O hebraico traz אֵל com artigo e uma oração participial definidora. “Ao Deus” preserva a identificação específica daquele que agiu em favor de Jacó, sem acrescentar uma formulação doutrinária externa.
- issue: Força temporal do particípio הָעֹנֶה
  choice: que me respondeu
  alternative: que me responde
  rationale: O contexto recorda uma resposta divina concreta no passado, favorecendo o pretérito. Como o particípio também pode caracterizar uma ação geral ou contínua, essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vamos nos levantar” evita o tom arcaico de “levantemo-nos”; “Betel” segue a forma tradicional do topônimo; a sintaxe conserva a progressão e a tensão temporal do hebraico sem rigidez excessiva.
