  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: pt
  text: E aconteceu que, ao lhe sair a vida — pois estava morrendo —, ela deu ao menino o nome de Benoni[a]; mas o pai dele lhe deu o nome de Benjamim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Benoni provavelmente significa “filho da minha dor” ou “filho da minha aflição”.
    reason: lexical_alternative
  - marker: b
    text: Benjamim provavelmente significa “filho da mão direita”; alguns entendem o nome como “filho do sul”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: ao lhe sair a vida
  rationale: נֶפֶשׁ pode indicar a vida, o ser vivente ou a alma. Neste contexto de morte, “vida” comunica naturalmente o sentido sem impor uma antropologia técnica; a construção com בְּ e o infinitivo é temporal.
- source_word: כִּי מֵתָה
  choice: pois estava morrendo
  rationale: A oração explica a saída da vida e, no fluxo narrativo, apresenta a morte como simultânea ao ato de dar o nome.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: ela deu ao menino o nome de
  rationale: Expressão natural em português para o idioma hebraico de nomeação, com o objeto explicitado para evitar uma sequência pesada de pronomes.
- source_word: בֶּן־אוֹנִי
  choice: Benoni
  rationale: Mantém o nome próprio transliterado no texto principal; seu provável significado, narrativamente relevante, é indicado em nota.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: mas o pai dele lhe deu o nome de
  rationale: A conjunção recebe valor adversativo porque o nome dado pelo pai contrasta com o nome dado pela mãe.
- source_word: בִנְיָמִין
  choice: Benjamim
  rationale: Emprega a forma portuguesa tradicional do nome próprio; as possibilidades etimológicas são preservadas em nota.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ no contexto da morte
  choice: vida
  alternative: alma
  rationale: “Vida” preserva o sentido narrativo sem transformar a passagem numa afirmação técnica sobre uma alma imaterial saindo do corpo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “ao lhe sair a vida” conserva de modo natural a imagem hebraica, enquanto “deu ao menino o nome de” evita ambiguidade pronominal. Os nomes seguem formas correntes em português.
