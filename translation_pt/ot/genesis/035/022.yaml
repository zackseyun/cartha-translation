  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: pt
  text: Aconteceu que, enquanto Israel morava naquela terra, Rúben foi e se deitou com Bila, concubina de seu pai, e Israel ficou sabendo disso.[a] Os filhos de Jacó eram doze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «e Israel ouviu». O objeto não é expresso, mas se refere evidentemente ao ato de Rúben.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «E os filhos de Jacó eram doze». A frase serve de transição para a lista dos filhos nos versículos seguintes.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Reproduz a introdução de um novo acontecimento na narrativa sem recorrer à fórmula arcaica «E aconteceu que» como abertura obrigatória.
- source_word: בִּשְׁכֹּן יִשְׂרָאֵל
  choice: enquanto Israel morava
  rationale: A construção com infinitivo e בְּ expressa a circunstância temporal contínua em que ocorreu a ação seguinte.
- source_word: בָּאָרֶץ הַהִוא
  choice: naquela terra
  rationale: Aqui אֶרֶץ indica a terra ou região onde Israel estava residindo, e não o planeta inteiro.
- source_word: וַיֵּלֶךְ רְאוּבֵן
  choice: Rúben foi
  rationale: Mantém o verbo narrativo explícito do hebraico, que apresenta Rúben indo e então praticando o ato.
- source_word: וַיִּשְׁכַּב אֶת
  choice: se deitou com
  rationale: É uma expressão portuguesa clara e digna que preserva o conhecido eufemismo hebraico para relações sexuais, sem o suavizar nem o tornar desnecessariamente clínico.
- source_word: פִּילֶגֶשׁ
  choice: concubina
  rationale: É o termo português estabelecido para uma mulher reconhecida no lar, mas com posição conjugal inferior à de uma esposa principal, sem ampliar a explicação no texto.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: e Israel ficou sabendo disso
  rationale: O hebraico diz literalmente apenas que Israel «ouviu». A expressão portuguesa explicita de modo idiomático o objeto evidente — o ato de Rúben — sem acrescentar qualquer reação de Israel.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Os filhos de Jacó eram doze
  rationale: Traduz diretamente a declaração numérica e permite que ela funcione como transição para a lista dos filhos nos versículos seguintes.
theological_decisions:
- issue: Como traduzir a expressão sexual sem atenuação e sem explicitação excessiva
  choice: se deitou com
  alternative: teve relações sexuais com; dormiu com
  rationale: A formulação conserva a sobriedade e a gravidade do relato hebraico. Evita tanto uma expressão coloquial potencialmente ambígua quanto uma expansão clínica.
- issue: Não atribuir a Israel uma reação que o texto não declara
  choice: e Israel ficou sabendo disso
  alternative: e Israel ouviu; e Israel ficou sabendo disso e se indignou
  rationale: O texto massorético afirma somente que Israel soube do ato. Não se acrescenta indignação, silêncio deliberado, julgamento ou outra resposta.
- issue: Função da declaração final sobre os doze filhos
  choice: tratá-la como uma declaração de transição independente
  alternative: ligá-la diretamente ao ato de Rúben ou inferir dela uma conclusão teológica
  rationale: A cláusula introduz naturalmente a enumeração subsequente. A tradução evita atribuir-lhe uma relação moral ou judicial não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Bila» segue a forma portuguesa corrente do nome. A construção evita arcaísmos, preserva a concisão narrativa e mantém distinta a frase final de transição.
