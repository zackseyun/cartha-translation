base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: pt
  text: Então partiram de Betel. Quando ainda faltava alguma distância para chegar a Efrata[a], Raquel deu à luz e teve dificuldade no parto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Efrate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע, nesta sequência narrativa, indica levantar acampamento e seguir viagem. “Partiram” expressa isso de modo natural e conciso.
- source_word: מִבֵּית אֵל
  choice: de Betel
  rationale: Emprega-se a forma tradicional e amplamente reconhecida em português para o topônimo hebraico בֵּית אֵל.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: quando ainda faltava alguma distância
  rationale: A expressão rara indica que ainda restava certo trecho do caminho, sem permitir determinar uma medida exata. A tradução evita atribuir precisão indevida.
- source_word: לָבוֹא אֶפְרָתָה
  choice: para chegar a Efrata
  rationale: O infinitivo com ל indica a chegada ao destino ainda adiante; em português, “para chegar a” se integra naturalmente à expressão de distância restante.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: “Efrata” é a transliteração tradicional em português; a possível representação alternativa da forma do nome é preservada em nota.
- source_word: וַתֵּלֶד רָחֵל
  choice: Raquel deu à luz
  rationale: ילד no qal, com sujeito feminino, significa dar à luz. A expressão escolhida é clara, atual e digna.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: teve dificuldade no parto
  rationale: קשה descreve a grande dificuldade enfrentada por Raquel ao dar à luz. A formulação mantém o foco no parto sem acrescentar detalhes não expressos no hebraico.
