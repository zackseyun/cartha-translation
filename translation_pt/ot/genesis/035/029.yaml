  text: וַ/יִּגְוַ֨ע יִצְחָ֤ק וַ/יָּ֨מָת֙ וַ/יֵּאָ֣סֶף אֶל עַמָּ֔י/ו זָקֵ֖ן וּ/שְׂבַ֣ע יָמִ֑ים וַ/יִּקְבְּר֣וּ אֹת֔/וֹ עֵשָׂ֥ו וְ/יַעֲקֹ֖ב בָּנָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: pt
  text: Então Isaque expirou e morreu, e foi reunido ao seu povo[a], velho e cheio de dias. Esaú e Jacó, seus filhos, o sepultaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi reunido aos seus antepassados/parentes”. A expressão hebraica é uma fórmula convencional de morte e pode indicar mais do que o sepultamento físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: expirou
  rationale: O verbo גוע, em relatos de morte, indica chegar ao fim da vida. “Expirou” é uma forma concisa e digna que mantém a distinção em relação ao verbo seguinte, “morreu”.
- source_word: וַיָּמָת
  choice: morreu
  rationale: מות é o verbo comum para morrer; a tradução direta preserva a sequência enfática do hebraico.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: foi reunido ao seu povo
  rationale: Mantém de modo próximo a fórmula hebraica de morte, sem reduzi-la ao sepultamento nem defini-la explicitamente como reencontro após a morte.
- source_word: זָקֵן
  choice: velho
  rationale: Equivalente direto, claro e natural para a descrição da idade de Isaque.
- source_word: וּשְׂבַע יָמִים
  choice: e cheio de dias
  rationale: Preserva a expressão idiomática e a textura literária dos relatos patriarcais, sem achatá-la para “avançado em anos”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: “Sepultar” comunica com clareza e dignidade o sentido de קבר e se ajusta ao registro narrativo bíblico.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Esaú e Jacó, seus filhos
  rationale: Conserva a ordem dos nomes e a identificação apositiva presente no hebraico, com sintaxe natural em português.
theological_decisions:
- issue: Sentido da fórmula de morte “foi reunido ao seu povo”
  choice: A fórmula foi mantida literalmente, sem especificar a natureza da reunião.
  alternative: Interpretá-la como sepultamento no túmulo familiar ou como reencontro consciente com os antepassados após a morte.
  rationale: A expressão hebraica admite ressonâncias familiares e possivelmente pós-morte, mas não as define. A tradução preserva essa ambiguidade teológica em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Expirou e morreu” preserva a dupla formulação hebraica; “cheio de dias” mantém deliberadamente o idioma patriarcal. O marcador da nota foi colocado junto à fórmula que ela explica.
