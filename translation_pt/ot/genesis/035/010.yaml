base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: pt
  text: 'Deus lhe disse: “Seu nome é Jacó. Você não será mais chamado Jacó; seu nome será Israel.” E Deus o chamou Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E chamou o seu nome Israel.” Também se pode traduzir: “E Deus lhe deu o nome de Israel.”'
    reason: Registra a forma literal da fórmula hebraica de nomeação e oferece uma alternativa idiomática legítima, sem substituir no texto principal a formulação verbal mais próxima do original.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o contexto e os verbos no singular identificam o único Deus; “Deus” é a correspondência natural em português.
- source_word: שִׁמְךָ
  choice: seu nome
  rationale: Reproduz diretamente o substantivo com sufixo masculino singular e mantém sua repetição enfática, usando uma forma corrente tanto no português brasileiro quanto no português internacional.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: você não será mais chamado
  rationale: Mantém a voz passiva de קרא no sentido de receber um nome e expressa naturalmente a cessação indicada por לֹא ... עוֹד.
- source_word: כִּי אִם
  choice: ; seu nome será
  rationale: A construção hebraica marca substituição contrastiva, “não Jacó, mas Israel”. Em português, o ponto e vírgula seguido da declaração do novo nome comunica esse contraste com naturalidade, sem acrescentar explicação.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: seu nome será Israel
  rationale: É uma formulação natural e solene em português que preserva integralmente a declaração de renomeação.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: E Deus lhe deu o nome de Israel
  rationale: Traduz de modo idiomático a fórmula hebraica de nomeação. A repetição de “Deus” esclarece o sujeito da forma verbal hebraica sem alterar o referente estabelecido no contexto.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
theological_decisions:
- issue: A declaração de renomeação e o uso posterior do nome Jacó na narrativa
  choice: Você não será mais chamado Jacó; seu nome será Israel
  alternative: Seu nome já não será Jacó, mas Israel
  rationale: A tradução conserva toda a força da declaração divina sem afirmar ou explicar como ela se relaciona com o emprego posterior de “Jacó” no texto bíblico; assim, não elimina a tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “você” na fala direta para evitar a mistura regional de paradigmas pronominais. O ponto e vírgula transmite com clareza o contraste da renomeação, e a conjunção “E” preserva a ligação narrativa simples do hebraico.
