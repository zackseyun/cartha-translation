  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: pt
  text: E Jacó deu ao lugar onde Deus havia falado com ele o nome de Betel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel significa «casa de Deus».
