lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַמָּקוֹם
  choice: deu ao lugar ... o nome de
  rationale: O hebraico diz literalmente «chamou o nome do lugar», mas a construção portuguesa escolhida transmite naturalmente o sentido de dar nome sem alterar o conteúdo.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: onde Deus havia falado com ele
  rationale: «Onde» representa naturalmente a construção relativa locativa. O mais-que-perfeito composto indica que a fala ocorreu antes de Jacó dar nome ao lugar. «Com ele» preserva o valor de אִתּוֹ; שָׁם não é traduzido separadamente porque sua função locativa já está expressa por «onde» em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o termo designa em sentido singular o Deus que falou com Jacó.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do topônimo em português; seu significado é explicado em nota.
theological_decisions:
- issue: Sentido gramatical de אֱלֹהִים
  choice: Deus
  alternative: deuses
  rationale: O contexto narrativo apresenta um único referente divino, e o verbo דִּבֶּר está no singular; portanto, a tradução plural seria inadequada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação «deu ao lugar ... o nome de» evita o hebraísmo pouco natural «chamou o nome do lugar», preservando seu sentido.
