  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: pt
  text: Raquel morreu e foi sepultada no caminho para Efrata (isto é, Belém).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efrata também pode ser grafada como Efrate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: morreu
  rationale: O verbo מות indica diretamente a morte física; “morreu” é claro e evita eufemismo.
- source_word: רָחֵל
  choice: Raquel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתִּקָּבֵר
  choice: foi sepultada
  rationale: O nifal de קבר pede uma construção passiva. Não se acrescenta “ali”, pois isso não está explícito no hebraico.
- source_word: בְּדֶרֶךְ
  choice: no caminho
  rationale: A preposição ב com דֶּרֶךְ indica localização ao longo da rota; “no caminho” é natural no contexto de viagem.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Transliteração portuguesa corrente da forma hebraica do topônimo; conserva-se em nota a alternativa tradicional “Efrate”.
- source_word: הִוא
  choice: isto é
  rationale: O pronome tem função explicativa e identifica Efrata com Belém.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Forma tradicional e amplamente reconhecida do nome do lugar em português.
