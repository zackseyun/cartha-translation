  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: pt
  text: 'E Deus lhe disse: “Eu sou o Deus Todo-Poderoso.[a] Seja fecundo e multiplique-se. De você procederão uma nação e uma assembleia de nações,[b] e reis sairão dos seus lombos.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “El Shaddai”; tradicionalmente traduzido por “Deus Todo-Poderoso”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “uma comunidade de nações”. O termo hebraico pode indicar uma assembleia, comunidade ou grupo reunido.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “dos seus lombos”, expressão que se refere aos descendentes físicos gerados por alguém.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo no singular e o contexto narrativo mostram que a forma plural funciona aqui como título singular do Deus de Israel.
- source_word: אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  rationale: Traduz o título divino de maneira tradicional, clara e solene em português, enquanto a forma hebraica é registrada em nota.
- source_word: פְּרֵה וּרְבֵה
  choice: Seja fecundo e multiplique-se
  rationale: Reproduz os dois imperativos masculinos singulares e preserva a fórmula de bênção presente nos relatos da criação e dos patriarcas.
- source_word: גּוֹי
  choice: nação
  rationale: No contexto da promessa patriarcal, designa um povo constituído como nação.
- source_word: קְהַל גּוֹיִם
  choice: uma assembleia de nações
  rationale: Mantém o sentido de קהל como grupo reunido ou congregação, sem reduzi-lo simplesmente a uma grande quantidade.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: de você procederão
  rationale: Comunica de modo idiomático a origem genealógica expressa literalmente por 'será de você'.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente direto e suficiente do substantivo hebraico.
- source_word: מֵחֲלָצֶיךָ
  choice: dos seus lombos
  rationale: Preserva a imagem corporal concreta do hebraico para descendentes físicos, esclarecida em nota.
- source_word: יֵצֵאוּ
  choice: sairão
  rationale: Conserva o sentido concreto de proceder ou sair da linhagem de Jacó e combina naturalmente com a expressão 'dos seus lombos'.
theological_decisions:
- issue: Tradução do título divino אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  alternative: El Shaddai
  rationale: Traduzir o título torna seu valor inteligível ao leitor comum, sem acrescentar conteúdo doutrinário; a transliteração é preservada em nota por haver incerteza quanto à etimologia exata.
- issue: Concretude corporal da promessa de descendência
  choice: reis sairão dos seus lombos
  alternative: reis serão seus descendentes
  rationale: A formulação escolhida preserva a imagem genealógica e corporal do texto hebraico, enquanto a nota explica seu sentido idiomático.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação mantém a cadência da promessa patriarcal, traduz o título divino e conserva, com explicação em nota, a imagem corporal dos “lombos”.
