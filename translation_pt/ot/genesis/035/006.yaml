base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: pt
  text: Jacó chegou a Luz (isto é, Betel)[a], que fica na terra de Canaã, com todo o povo que estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico, «Luz ... isto é, Betel», preserva tanto o nome mais antigo do lugar quanto sua identificação mais conhecida.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O qal narrativo de בוא pode indicar vir, entrar ou chegar. Neste contexto, «chegou» expressa naturalmente o movimento até o destino.
- source_word: לוּזָה
  choice: a Luz
  rationale: O nome próprio לוז com hê direcional indica movimento em direção ao lugar; em português, essa direção é expressa pela preposição «a».
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: na terra de Canaã
  rationale: A expressão situa Luz geograficamente. A forma concisa «na terra de Canaã» é natural em português e preserva toda a informação do hebraico.
- source_word: הִוא בֵּית אֵל
  choice: isto é, Betel
  rationale: O pronome seguido do topônimo identifica Luz como Betel. «Isto é, Betel» conserva a função explicativa sem apagar o nome antigo.
- source_word: הוּא
  choice: ele
  rationale: O pronome retoma Jacó antes de acrescentar o grupo que o acompanhava, reproduzindo a construção apositiva e levemente enfática do hebraico.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: e todo o povo que estava com ele
  rationale: עָם designa aqui o conjunto de pessoas que acompanhava Jacó. «Todo o povo que estava com ele» é claro, digno e próximo da forma hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação mantém «Betel» como identificação explicativa de «Luz» e conserva a retomada final de Jacó junto com seus acompanhantes.
