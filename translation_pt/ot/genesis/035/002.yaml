  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: pt
  text: 'Então Jacó disse aos membros de sua casa e a todos os que estavam com ele: “Retirem do meio de vocês os deuses estrangeiros[a], purifiquem-se[b] e troquem de roupa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deuses alheios” ou “deuses dos estrangeiros”.
    reason: lexical_alternative
  - marker: b
    text: “Purifiquem-se” pode referir-se à purificação ritual em preparação para aproximar-se de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: aos de sua casa
  rationale: A expressão hebraica designa os membros da unidade doméstica de Jacó, e não o edifício. “Aos de sua casa” preserva esse sentido social e mantém proximidade com a forma hebraica.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: a todos os que estavam com ele
  rationale: A frase refere-se às pessoas que acompanhavam Jacó; esta formulação é clara, natural e fiel ao referente pessoal indicado pelo contexto.
- source_word: הָסִרוּ ... בְּתֹכְכֶם
  choice: Retirem do meio de vocês
  rationale: O imperativo exige a remoção dos objetos de culto presentes na comunidade ou em sua posse. A formulação conserva tanto a força da ordem quanto a amplitude espacial e comunitária de “no meio de vocês”.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: os deuses estrangeiros
  rationale: A construção pode indicar deuses estrangeiros, alheios ou pertencentes a estrangeiros. “Deuses estrangeiros” comunica com clareza o contraste religioso sem especificar além do hebraico.
- source_word: וְהִטַּהֲרוּ
  choice: purifiquem-se
  rationale: A forma reflexiva pede que os próprios destinatários se submetam à purificação. O verbo preserva a provável dimensão ritual sem definir um procedimento que o versículo não explicita.
- source_word: וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם
  choice: troquem de roupa
  rationale: A expressão hebraica ordena a troca das vestes. “Troquem de roupa” é corrente em português moderno e mantém o sentido concreto do comando.
theological_decisions:
- issue: Natureza da ordem de purificação
  choice: “purifiquem-se”, preservando uma possível dimensão ritual e pactual
  alternative: “limpem-se”, com sentido mais geral e menor conotação ritual
  rationale: O abandono dos ídolos e a preparação para aproximar-se de Deus favorecem uma nuance ritual, mas o texto não descreve um rito específico. A tradução conserva essa possibilidade sem acrescentar detalhes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe evita arcaísmos, enquanto “aos de sua casa” conserva o sentido coletivo da unidade doméstica. Todos os marcadores de nota aparecem junto às expressões que esclarecem.
