  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: pt
  text: Jacó ergueu uma coluna no lugar onde Deus havia falado com ele, uma coluna de pedra. Derramou sobre ela uma oferta de bebida[a] e também derramou óleo sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma libação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: ergueu
  rationale: O hifil de נצב indica fazer algo ficar em pé. “Ergueu” expressa de modo natural e concreto a colocação vertical da coluna.
- source_word: מַצֵּבָה
  choice: coluna
  rationale: Designa uma pedra erguida como monumento ou marco. “Coluna” é conciso, corrente na linguagem bíblica em português e recebe a especificação explícita “de pedra” na sequência.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: no lugar onde Deus havia falado com ele
  rationale: O mais-que-perfeito composto situa a fala antes da ação de Jacó. “Deus” torna explícito o sujeito recuperável do contexto imediato, evitando a sequência ambígua e pouco natural “ele... com ele”, sem acrescentar uma identificação estranha ao texto.
- source_word: מַצֶּבֶת אָבֶן
  choice: uma coluna de pedra
  rationale: Mantém a aposição hebraica e explicita o material da coluna sem transformá-la interpretativamente em memorial ou altar.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: derramou ... uma oferta de bebida
  rationale: A construção cognata descreve o derramamento ritual de uma libação. “Oferta de bebida” é compreensível ao leitor comum, enquanto a nota registra o termo técnico “libação”.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: derramou óleo
  rationale: Reproduz a segunda ação concreta de derramar e conserva “óleo” sem especificar “azeite”, pois o hebraico não explicita o tipo.
theological_decisions:
- issue: Sentido religioso das ações de Jacó
  choice: Descrever a ereção da coluna e o derramamento da oferta e do óleo sem explicar sua finalidade teológica.
  alternative: Dizer que Jacó consagrou a coluna ou levantou um memorial do encontro divino.
  rationale: O versículo narra os atos rituais, mas não declara expressamente que se tratava de consagração ou memorial. A tradução preserva essa abertura interpretativa.
- issue: Identidade do sujeito de דִּבֶּר
  choice: Explicitar “Deus” como sujeito da fala.
  alternative: 'Conservar dois pronomes: “onde ele havia falado com ele”.'
  rationale: O contexto identifica claramente Deus como quem falou com Jacó; a explicitação evita uma ambiguidade referencial criada em português, sem resolver uma tensão teológica real do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “coluna” e de “derramou” acompanha a estrutura enfática e concreta do hebraico; “também” liga naturalmente as duas ações sucessivas.
