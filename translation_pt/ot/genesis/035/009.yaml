source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: pt
  text: Deus apareceu[a] novamente a Jacó, quando ele veio de Padã-Arã, e o abençoou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus se revelou novamente a Jacó”. O verbo hebraico pode indicar aparecer ou fazer-se visível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação perceptível de Deus. “Apareceu” é natural em português e não especifica o modo da manifestação.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: A concordância verbal no singular e o contexto narrativo mostram que o termo se refere ao único Deus.
- source_word: עוֹד
  choice: novamente
  rationale: Neste contexto, o advérbio assinala a repetição de uma manifestação divina anterior.
- source_word: בְּבֹאוֹ
  choice: quando ele veio
  rationale: A preposição בְּ com o infinitivo construto e sufixo pronominal tem sentido temporal. A formulação conserva o movimento expresso no hebraico sem acrescentar explicitamente a ideia de retorno.
- source_word: מִפַּדַּן אֲרָם
  choice: de Padã-Arã
  rationale: O topônimo é transliterado, enquanto a preposição מִן é traduzida por “de”.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: e o abençoou
  rationale: O piel de ברך significa “abençoar”. Em português, o pronome objeto “o” identifica Jacó com clareza, e o sujeito Deus permanece naturalmente implícito.
theological_decisions:
- issue: Natureza da manifestação divina
  choice: Deus apareceu novamente a Jacó
  alternative: Deus se revelou novamente a Jacó
  rationale: A tradução apresenta uma manifestação divina real, mas não determina se foi corporal, visionária ou de outra natureza. Assim, preserva a abertura do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Padã-Arã” segue uma transliteração portuguesa reconhecível; a ordem da frase permanece próxima do hebraico sem soar artificial.
