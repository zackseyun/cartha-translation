base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: pt
  text: Jacó ergueu uma coluna sobre a sepultura dela[a]. Essa é a coluna da sepultura de Raquel até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pedra memorial sobre a sepultura dela” ou “uma coluna para marcar a sepultura dela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: ergueu
  rationale: O hifil de נצב significa estabelecer ou erguer. “Ergueu” expressa naturalmente a colocação de uma pedra em posição vertical.
- source_word: מַצֵּבָה
  choice: uma coluna
  rationale: O substantivo designa uma pedra erguida ou coluna. “Coluna” preserva a imagem concreta sem explicitar além do texto sua função memorial.
- source_word: עַל קְבֻרָתָהּ
  choice: sobre a sepultura dela
  rationale: עַל indica aqui a posição da coluna em relação ao local de sepultamento; “sepultura” traduz קבורה sem sugerir uma construção elaborada.
- source_word: הִוא
  choice: Essa é
  rationale: O pronome retoma a coluna recém-mencionada. “Essa é” faz a identificação de maneira clara e natural em português.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: a coluna da sepultura de Raquel
  rationale: A formulação mantém de modo transparente a cadeia construta hebraica e a repetição de “coluna” e “sepultura”.
- source_word: עַד הַיּוֹם
  choice: até hoje
  rationale: Equivalente idiomático corrente que indica continuidade até o tempo do narrador.
