  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: pt
  text: 'Então Deus disse a Jacó: “Levante-se, suba a Betel, habite ali e faça ali um altar ao Deus que apareceu a você quando você fugiu da presença de seu irmão Esaú.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: קוּם עֲלֵה
  choice: Levante-se, suba
  rationale: Preserva os dois imperativos e o sentido direcional de subir até Betel, em linguagem atual e digna.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Mantém a forma tradicional e reconhecível do topônimo em português, sem traduzir seu significado no texto principal.
- source_word: וְשֶׁב שָׁם
  choice: e habite ali
  rationale: ישב pode significar sentar-se, permanecer ou habitar; neste comando, “habite” comunica residência e conserva o tom solene.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Faça ali um altar
  rationale: “Faça” corresponde diretamente ao sentido amplo de עשה e permanece natural no contexto.
- source_word: לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: ao Deus que apareceu a você
  rationale: A preposição indica dedicação do altar, e o particípio nifal de ראה é expresso naturalmente por “apareceu”.
- source_word: בְּבָרְחֲךָ
  choice: quando fugia
  rationale: O infinitivo construto com בְּ indica circunstância temporal; o imperfeito português apresenta a fuga em curso no momento da aparição.
- source_word: מִפְּנֵי
  choice: da presença de
  rationale: Representa o idioma hebraico literalmente ligado à “face”, mas em português inteligível e natural, sem reduzir totalmente a expressão a simples “de”.
- source_word: עֵשָׂו אָחִיךָ
  choice: seu irmão Esaú
  rationale: A ordem portuguesa é mais natural e preserva integralmente a relação familiar indicada pelo hebraico.
theological_decisions:
- issue: Referência de אֱלֹהִים
  choice: Deus, no singular
  alternative: deuses
  rationale: O verbo singular e o contexto narrativo identificam o Deus que fala a Jacó; a morfologia plural do substantivo não exige plural semântico aqui.
- issue: Identificação em לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: ao Deus que apareceu a você
  alternative: a Deus, que apareceu a você
  rationale: A construção hebraica identifica o destinatário do altar por meio da oração relativa. A tradução mantém essa formulação sem acrescentar uma explicação teológica.
- issue: Forma do nome בֵּית אֵל
  choice: Betel
  alternative: Casa de Deus
  rationale: O termo funciona aqui como topônimo estabelecido; traduzi-lo como expressão comum poderia obscurecer a referência geográfica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Levante-se” evita o tom excessivamente arcaico de “Erga-se”; “habite ali” conserva a solenidade e o sentido residencial. A expressão “da presença de” retém algo do idioma hebraico מִפְּנֵי sem produzir o estranhamento de “da face de”.
