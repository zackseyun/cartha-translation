base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: pt
  text: Quando os rapazes cresceram, Esaú tornou-se um caçador habilidoso, um homem do campo[a]; Jacó, porém, era um homem pacato[b], que vivia em tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem do campo”. No contexto, a expressão se refere à vida ao ar livre e não necessariamente ao trabalho agrícola.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “íntegro”, “irrepreensível”, “simples” ou “inocente”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Quando os rapazes cresceram
  rationale: No contexto, o verbo descreve os filhos chegando à idade adulta. “Os rapazes cresceram” é natural em português e mantém o desenvolvimento narrativo.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: um caçador habilidoso
  rationale: A construção descreve alguém conhecedor e experiente na caça. “Caçador habilidoso” expressa essa competência de modo claro e idiomático.
- source_word: אִישׁ שָׂדֶה
  choice: um homem do campo aberto
  rationale: A expressão caracteriza Esaú por sua ligação com o espaço aberto e não como agricultor. “Campo aberto” evita que “homem do campo” seja entendido apenas como trabalhador rural, enquanto a nota preserva a forma mais literal.
- source_word: אִישׁ תָּם
  choice: um homem pacato
  rationale: תָּם pode indicar inteireza, integridade, inocência ou simplicidade. Neste contraste com a vida de caça de Esaú, “pacato” comunica uma disposição tranquila sem transformar a expressão numa avaliação moral inequívoca.
- source_word: יֹשֵׁב אֹהָלִים
  choice: que vivia em tendas
  rationale: O particípio descreve o modo de vida habitual de Jacó. A formulação é atual, natural e preserva o contraste com Esaú no campo aberto.
theological_decisions:
- issue: O sentido de תָּם na descrição de Jacó
  choice: pacato, como descrição de temperamento ou modo de vida
  alternative: íntegro, irrepreensível, simples ou inocente
  rationale: O termo hebraico admite tanto nuances morais quanto as de inteireza e simplicidade. O contexto imediato contrasta o caçador ligado ao campo aberto com quem vivia em tendas; por isso, “pacato” preserva o contraste sem afirmar de maneira definitiva uma avaliação moral que o termo, isoladamente, não exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A estrutura paralela do hebraico foi preservada sem rigidez, e as notas mantêm abertas as principais possibilidades lexicais.
