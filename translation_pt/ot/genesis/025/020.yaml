  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: pt
  text: Isaque tinha quarenta anos quando tomou Rebeca[a], filha de Betuel, o arameu de Padã-Arã, e irmã de Labão, o arameu[b], para ser sua esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “quando se casou com Rebeca”. O hebraico diz literalmente “quando tomou Rebeca [...] para ser sua esposa”.
    reason: lexical_alternative
  - marker: b
    text: “Arameu” é mais preciso do que a tradução tradicional mais antiga “sírio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Isaque tinha quarenta anos
  rationale: A expressão hebraica é o modo usual de indicar idade. Em português, “tinha quarenta anos” reproduz naturalmente a informação, sem imitar de modo artificial a construção literal “era filho de quarenta anos”.
- source_word: בְּקַחְתּוֹ
  choice: quando tomou
  rationale: O infinitivo com בְּ situa temporalmente a ação. “Tomou” conserva a formulação hebraica de casamento, cujo sentido é esclarecido por “para ser sua esposa”; a nota oferece a forma idiomática moderna.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בַּת בְּתוּאֵל
  choice: filha de Betuel
  rationale: Reproduz de maneira direta a indicação genealógica do hebraico.
- source_word: הָאֲרַמִּי
  choice: o arameu
  rationale: O gentílico hebraico designa um arameu; esta forma é histórica e linguisticamente mais precisa do que a tradução tradicional “sírio”.
- source_word: מִפַּדַּן אֲרָם
  choice: de Padã-Arã
  rationale: Trata-se de um topônimo. A transliteração “Padã-Arã” segue a acentuação natural do português e mantém o nome próprio.
- source_word: אֲחוֹת לָבָן
  choice: irmã de Labão
  rationale: Mantém o estilo genealógico e a relação de parentesco explicitamente indicada no texto.
- source_word: לוֹ לְאִשָּׁה
  choice: para ser sua esposa
  rationale: Expressa em português claro a finalidade e a relação possessiva da fórmula matrimonial hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. Preserva-se a fórmula matrimonial semítica no texto principal, acompanhada de esclarecimento idiomático em nota. Os nomes seguem formas portuguesas reconhecidas; o topônimo é transliterado como Padã-Arã.
