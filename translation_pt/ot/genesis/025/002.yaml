  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: pt
  text: Ela lhe deu à luz Zimrã, Jocsã, Medã, Midiã, Isbaque e Suá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O Qal wayyiqtol, terceira pessoa feminina singular, relata o nascimento dos filhos. A expressão é natural e atual em português, preservando explicitamente o sentido materno sem acrescentar «filhos», termo ausente no hebraico.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com sufixo indica aqui o pai. «Ela lhe deu à luz» expressa de modo conciso a relação, sem introduzir informação além do texto.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto repetido antes de cada nome; em português, é representado pela sintaxe normal e não requer equivalente lexical.
- source_word: זִמְרָן
  choice: Zinrã
  rationale: Transliteração portuguesa do nome próprio, com terminação nasal representada por «ã» e conservação aproximada das consoantes hebraicas.
- source_word: יָקְשָׁן
  choice: Jocsã
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: מְדָן
  choice: Medã
  rationale: Transliteração portuguesa que distingue este nome de Midiã e representa a terminação hebraica nasal.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma portuguesa amplamente reconhecida para o nome próprio e topônimo bíblico.
- source_word: יִשְׁבָּק
  choice: Isbaque
  rationale: Forma adaptada à ortografia e à pronúncia portuguesas, evitando uma transliteração opaca para leitores comuns.
- source_word: שׁוּחַ
  choice: Suá
  rationale: Transliteração portuguesa corrente e legível do nome próprio, representando o som final gutural sem grafia excessivamente técnica.
