  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: pt
  text: 'Jacó disse: “Venda-me hoje o seu direito de primogenitura.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venda-me, a partir de hoje, o seu direito de primogenitura” ou “Venda-me neste dia o seu direito de primogenitura”, ressaltando uma transação imediata e vinculante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol dá continuidade à narrativa; o pretérito perfeito simples é natural em português, sem necessidade de explicitar o וַ por “e”.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מִכְרָה
  choice: Venda-me
  rationale: Imperativo de מכר, “vender”. A colocação pronominal é natural no registro escrito e preserva לִי como destinatário da venda.
- source_word: כַיּוֹם
  choice: hoje
  rationale: A expressão pode significar “hoje”, “neste dia” ou “a partir de hoje”; no contexto, “hoje” comunica de modo conciso a exigência de uma transação imediata, enquanto a nuance jurídica ou vinculante é mantida em nota.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca o objeto direto definido e normalmente não recebe equivalente independente em português.
- source_word: בְּכֹרָתְךָ
  choice: o seu direito de primogenitura
  rationale: בְּכֹרָה designa a condição e os direitos ligados ao filho primogênito. “Direito de primogenitura” é claro, tradicional e semanticamente preciso.
- source_word: לִי
  choice: -me
  rationale: Indica que a venda deve ser feita a Jacó; em português, o pronome enclítico em “Venda-me” expressa naturalmente esse objeto indireto.
