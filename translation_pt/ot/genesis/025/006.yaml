base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: pt
  text: Mas aos filhos das concubinas[a] de Abraão, ele deu presentes e, enquanto ainda vivia, enviou-os para longe de seu filho Isaque, em direção ao leste, para a terra do Oriente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termo para mulheres em união reconhecida, mas de condição conjugal secundária.
    reason: historical_context
  - marker: b
    text: 'Ou: “para a região oriental”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Mas, aos filhos
  rationale: A conjunção introduz um contraste contextual com Isaque, mencionado no versículo anterior como aquele que recebeu tudo; a preposição marca os filhos como destinatários.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: das concubinas que Abraão tinha
  rationale: “Concubinas” preserva o termo social específico para mulheres reconhecidas, porém de posição conjugal secundária. A oração relativa reproduz com naturalidade a construção possessiva hebraica.
- source_word: נָתַן אַבְרָהָם מַתָּנֹת
  choice: ele deu presentes
  rationale: Traduz diretamente o par verbal e nominal. O pronome evita repetição pesada em português sem obscurecer que Abraão é o sujeito.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: mandou-os para longe de seu filho Isaque
  rationale: A formulação expressa tanto o envio quanto a separação de Isaque, sentido contextual de מֵעַל.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: enquanto ainda vivia
  rationale: Expressão temporal clara e corrente que indica que Abraão tomou essa providência antes de morrer.
- source_word: קֵדְמָה
  choice: rumo ao leste
  rationale: A forma direcional indica movimento para o leste.
- source_word: אֶל אֶרֶץ קֶדֶם
  choice: para a terra do Oriente
  rationale: Mantém a imagem e a repetição semântica do hebraico, ao mesmo tempo que usa uma expressão portuguesa digna e compreensível.
