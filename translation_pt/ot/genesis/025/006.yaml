  - severity: low
    issue: Verbo «mandou-os»
    rationale: No português brasileiro, «mandar» pode ser entendido como dar uma ordem. «Enviou-os» expressa sem ambiguidade o sentido de enviar/afastar presente no verbo hebraico.
