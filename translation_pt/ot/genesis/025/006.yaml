  verdict: revise
  source_fidelity: O texto transmite adequadamente o contraste com Isaque, os presentes dados aos outros filhos, o envio antes da morte de Abraão e o duplo movimento para o leste. A sequência «em direção ao leste, para a terra do Oriente» preserva a repetição direcional do hebraico.
  naturalness: A redação é clara e de registro apropriado. Contudo, «as concubinas que Abraão tinha» pode sugerir em português uma posse coloquial desnecessária; «as concubinas de Abraão» é mais idiomático e mantém o sentido possessivo da construção hebraica. «Enviou-os» é também mais inequívoco que «mandou-os» neste contexto.
  terminology: «Concubinas», «Isaque», «presentes» e «terra do Oriente» são escolhas adequadas. A nota sobre «concubinas» deve definir o termo sem ampliar além do necessário o quadro histórico-social.
