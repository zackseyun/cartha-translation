  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: pt
  text: O primeiro saiu avermelhado[a], todo ele como um manto de pelos[b]; e deram-lhe o nome de Esaú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ruivo” ou “vermelho”. O adjetivo hebraico descreve uma aparência avermelhada.
    reason: lexical_alternative
  - marker: b
    text: Ou “como uma capa de pelos”. O hebraico faz uma comparação com um manto ou capa e com pelos.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “chamaram o nome dele Esaú”, fórmula comum de nomeação; isto é, “deram-lhe o nome de Esaú”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo comum para “sair” descreve aqui o nascimento; “saiu” é direto, natural e preserva a imagem concreta do hebraico.
- source_word: הָרִאשׁוֹן
  choice: o primeiro
  rationale: Indica o primeiro dos gêmeos na ordem do nascimento, de maneira concisa e idiomática.
- source_word: אַדְמוֹנִי
  choice: avermelhado
  rationale: Expressa uma aparência ou coloração tendente ao vermelho sem reduzi-la ao adjetivo absoluto “vermelho”; também permite perceber a associação posterior com Edom sem explicitá-la indevidamente.
- source_word: כֻּלּוֹ
  choice: todo ele
  rationale: Mantém explícito que a descrição se aplicava ao corpo inteiro.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: como um manto de pelos
  rationale: Preserva a comparação vívida do hebraico, em que אַדֶּרֶת designa um manto ou capa e שֵׂעָר, pelos ou cabelo.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: deram-lhe o nome de
  rationale: Reproduz em português natural a fórmula hebraica de nomeação, sem alterar seu sentido.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
