  terminology: '"Abraão", "deu o último suspiro", "boa velhice" e "foi reunido ao seu povo" são escolhas consistentes e compreensíveis. A fórmula final preserva a ambiguidade cultural e teológica do hebraico, sem a reduzir a sepultamento ou a uma descrição definida da vida após a morte. As notas estão ancoradas nos termos pertinentes e são fiéis ao escopo do texto.'
