id: GEN.25.8
reference: Genesis 25:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּגְוַ֨ע וַ/יָּ֧מָת אַבְרָהָ֛ם בְּ/שֵׂיבָ֥ה טוֹבָ֖ה זָקֵ֣ן וְ/שָׂבֵ֑עַ וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: pt
  text: Abraão deu o último suspiro e morreu em boa velhice, velho e satisfeito[a]; e foi reunido ao seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pleno” ou “saciado”. O hebraico diz literalmente “velho e satisfeito”, sem a expressão “de dias”.
    reason: lexical_alternative
  - marker: b
    text: “Foi reunido ao seu povo” é uma fórmula hebraica tradicional referente à morte. Pode sugerir a reunião com os parentes falecidos, mas a expressão não especifica de que maneira isso ocorre.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: deu o último suspiro
  rationale: O verbo גוע, em relatos de morte, indica expirar. A expressão portuguesa é natural e mantém alguma distinção em relação ao verbo seguinte, “morreu”.
- source_word: וַיָּמָת
  choice: morreu
  rationale: מות é o verbo comum para morrer; a tradução direta preserva a formulação explícita do hebraico.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: em boa velhice
  rationale: Mantém tanto a ideia de idade avançada quanto sua qualificação positiva, sem acrescentar conceitos ausentes do texto.
- source_word: זָקֵן
  choice: velho
  rationale: Reproduz diretamente o adjetivo e conserva o acúmulo de descrições presente no hebraico.
- source_word: וְשָׂבֵעַ
  choice: e satisfeito
  rationale: שָׂבֵעַ significa “saciado”, “satisfeito” ou “pleno”. “Satisfeito” é compreensível em português e evita acrescentar “de dias”, expressão não explícita no hebraico.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: e foi reunido ao seu povo
  rationale: Preserva a fórmula hebraica tradicional de morte e sua ambiguidade, sem reduzi-la ao sepultamento nem defini-la como uma afirmação específica sobre a vida após a morte.
- source_word: עַמָּיו
  choice: seu povo
  rationale: É o equivalente mais direto de עַמָּיו e mantém o sentido coletivo e familiar sem restringi-lo apenas aos antepassados.
theological_decisions:
- issue: Sentido de “foi reunido ao seu povo”
  choice: Manter a fórmula idiomática sem determinar seu sentido exato.
  alternative: Interpretá-la explicitamente como sepultamento no túmulo familiar ou como reencontro consciente com parentes falecidos.
  rationale: A expressão pode evocar união com os parentes na morte, mas o versículo não especifica se trata do sepultamento, do destino após a morte ou de ambos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a repetição solene do hebraico e conserva a ambiguidade das duas expressões principais.
