  source_fidelity: 'A tradução preserva adequadamente a sequência e os elementos do hebraico: o duplo anúncio da morte ("deu o último suspiro e morreu"), a caracterização acumulativa da velhice, e a fórmula passiva "foi reunido ao seu povo". "Satisfeito" é uma opção lexical defensável para שָׂבֵעַ e, diferentemente de "cheio de dias", não introduz "dias", ausente no texto hebraico.'
