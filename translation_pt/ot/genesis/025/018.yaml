base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: pt
  text: Eles habitaram desde Havilá até Sur, que fica diante do Egito, quando se vai em direção a Assur.[a] Ele se estabeleceu diante de todos os seus irmãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Assur também pode ser traduzido como “Assíria”.
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica é difícil. Também pode significar “ele se estabeleceu em oposição a todos os seus irmãos”; mais literalmente, “ele caiu diante de todos os seus irmãos”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Eles habitaram
  rationale: O qal plural de שׁכן indica morar ou fixar residência. “Habitaram” é natural em português e preserva a descrição territorial sem acrescentar a ideia de conquista.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: desde Havilá até Sur
  rationale: Reproduz diretamente a fórmula hebraica que delimita a extensão do território habitado.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: que fica diante do Egito
  rationale: Mantém o valor espacial de עַל־פְּנֵי sem especificar uma direção cardinal que o hebraico não declara expressamente.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: quando se vai em direção a Assur
  rationale: A construção com o ה direcional expressa movimento rumo a Assur. A formulação é clara e idiomática em português.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: diante de todos os seus irmãos
  rationale: A expressão pode indicar posição geográfica ou relação de oposição. A tradução formal “diante de” preserva essa ambiguidade, explicada em nota.
- source_word: נָפָל
  choice: se estabeleceu
  rationale: Embora נפל normalmente signifique “cair”, aqui a tradição textual e o contexto territorial favorecem um sentido idiomático ligado a fixar-se ou estabelecer-se. A forma singular retoma Ismael como representante de sua descendência.
theological_decisions:
- issue: Sentido de עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Ele se estabeleceu diante de todos os seus irmãos
  alternative: Ele se estabeleceu em oposição a todos os seus irmãos; ele caiu diante de todos os seus irmãos
  rationale: O contexto de Gênesis 16:12 pode sugerir hostilidade, mas a expressão também admite sentido espacial, e נפל conserva uma dificuldade lexical real. O texto principal evita resolver a tensão em favor de uma leitura exclusivamente adversativa; a nota registra as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas correntes em português. “Diante de” foi mantido nas duas ocorrências de עַל־פְּנֵי para conservar a correspondência lexical e a ambiguidade espacial ou relacional do hebraico.
