base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: pt
  text: Isaque amava Esaú porque a caça estava em sua boca[a], mas Rebeca amava Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “porque a caça estava em sua boca”. A expressão provavelmente significa que Isaque preferia Esaú porque gostava da caça que ele lhe fornecia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amava
  rationale: O Qal wayyiqtol apresenta a ação na narrativa; em português, o pretérito imperfeito expressa naturalmente a afeição habitual e se harmoniza com o particípio da segunda oração.
- source_word: אֶת עֵשָׂו
  choice: Esaú
  rationale: A marca de objeto direto não é traduzida; usa-se a forma tradicional portuguesa do nome.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da afeição de Isaque de modo claro e natural.
- source_word: צַיִד
  choice: a caça
  rationale: צַיִד designa caça ou alimento obtido pela caça; esta opção evita restringir o sentido a carne de veado.
- source_word: בְּפִיו
  choice: estava em sua boca
  rationale: Preserva a expressão concreta e ambígua do hebraico, explicando em nota seu sentido provável.
- source_word: וְרִבְקָה
  choice: mas Rebeca
  rationale: Embora וְ normalmente signifique 'e', aqui liga duas preferências parentais contrastantes; 'mas' explicita naturalmente esse contraste.
- source_word: אֹהֶבֶת
  choice: amava
  rationale: O particípio indica afeição contínua ou característica; o pretérito imperfeito é idiomático no contexto narrativo.
- source_word: אֶת יַעֲקֹב
  choice: Jacó
  rationale: A marca de objeto direto não é traduzida; usa-se a forma tradicional portuguesa do nome.
