base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: pt
  text: Depois disso, saiu seu irmão, e sua mão segurava o calcanhar de Esaú; por isso, ele recebeu o nome de Jacó.[a] Isaque tinha sessenta anos quando eles nasceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Jacó soa, em hebraico, como uma palavra associada a “calcanhar” e, mais tarde, a “suplantar”, em correspondência com o fato de ele segurar o calcanhar de Esaú.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca com naturalidade a sequência em relação ao nascimento de Esaú, sem ampliar o texto.
- source_word: יָצָא
  choice: saiu
  rationale: Preserva a imagem concreta da saída do ventre, em vez de substituí-la diretamente por “nasceu”.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Traduz exatamente o termo hebraico, sem acrescentar “gêmeo”, embora isso seja conhecido pelo contexto.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: e sua mão segurava
  rationale: Reproduz a construção descritiva com particípio e apresenta a ação como simultânea à saída.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: o calcanhar de Esaú
  rationale: Expressa de modo claro a relação nominal e conserva “calcanhar”, importante para o jogo de palavras com o nome Jacó.
- source_word: וַיִּקְרָא שְׁמוֹ יַעֲקֹב
  choice: por isso, ele recebeu o nome de Jacó
  rationale: Emprega uma fórmula natural de nomeação em português; “por isso” explicita a conexão narrativa sugerida pelo contexto entre o gesto e o nome, sem definir quem realizou a nomeação.
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: Isaque tinha sessenta anos
  rationale: É a forma idiomática portuguesa de traduzir a expressão hebraica de idade.
- source_word: בְּלֶדֶת אֹתָם
  choice: quando eles nasceram
  rationale: Indica a ocasião do nascimento dos dois sem acrescentar um sujeito materno que não está expresso nesta oração.
