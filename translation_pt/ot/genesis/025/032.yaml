  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: pt
  text: 'Esaú disse: “Olhe, estou prestes a morrer; então, de que me serve este direito de primogenitura?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhe, eu vou morrer; então, por que preciso deste direito de primogenitura?”'
    reason: Registra uma tradução mais direta de הוֹלֵךְ לָמוּת e da pergunta hebraica com לָמָּה, preservando uma alternativa lexical legítima.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol narrativo de אמר introduz a fala; em português corrente, a conjunção inicial pode ser omitida sem perda da sequência narrativa.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הִנֵּה
  choice: Olhe
  rationale: Interjeição que chama a atenção do interlocutor. “Olhe” conserva sua força de modo natural e atual, sem recorrer ao arcaico “eis”.
- source_word: אָנֹכִי
  choice: eu
  rationale: Pronome independente de primeira pessoa, com possível ênfase. A forma verbal portuguesa já identifica o sujeito, mas “eu” está semanticamente representado na expressão idiomática completa da fala, sem necessidade de ênfase artificial.
- source_word: הוֹלֵךְ לָמוּת
  choice: estou prestes a morrer
  rationale: A construção הלך com infinitivo indica avanço ou proximidade de um resultado; no contexto, expressa morte supostamente iminente, não necessariamente deslocamento literal.
- source_word: וְלָמָּה זֶּה לִי
  choice: então, de que me serve este
  rationale: A pergunta retórica tira uma conclusão prática da afirmação anterior. A formulação portuguesa comunica naturalmente a ideia de utilidade ou vantagem pessoal, sem eliminar a possibilidade de uma tradução mais formal com “por que”.
- source_word: בְּכֹרָה
  choice: direito de primogenitura
  rationale: Designa a condição, os privilégios e os direitos ligados ao filho primogênito. A expressão é clara e tradicional em português.
theological_decisions:
- issue: Força interpretativa da afirmação de Esaú sobre morrer
  choice: A fala é traduzida como alegação de morte iminente, sem determinar se Esaú corria literalmente risco de vida.
  alternative: Entender a frase como exagero provocado por fome intensa.
  rationale: O hebraico registra a afirmação de Esaú, mas não esclarece neste versículo se ela é literal ou hiperbólica; a tradução preserva essa tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A pergunta retórica soa natural sem tornar explícito se a fala de Esaú é literal ou exagerada.
