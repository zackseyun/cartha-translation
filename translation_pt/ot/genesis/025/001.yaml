base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: pt
  text: Abraão tomou outra esposa[a], e o nome dela era Quetura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Abraão tomou uma esposa novamente”. O hebraico usa uma expressão aditiva, literalmente: “Abraão acrescentou e tomou uma esposa”.'
    reason: Registra a construção aditiva hebraica e sua possível tradução como ação repetida.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: outra
  rationale: No idioma וַיֹּסֶף ... וַיִּקַּח, o verbo יסף acrescenta uma ideia aditiva ou repetitiva. Em português, “tomou outra mulher” comunica essa nuance com naturalidade, sem reproduzir de modo rígido “acrescentou e tomou”.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: לקח com אִשָּׁה é uma expressão hebraica para tomar uma mulher como esposa. “Tomou” preserva de perto a formulação da fonte, e o contexto deixa claro o vínculo conjugal.
- source_word: אִשָּׁה
  choice: mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. Aqui tem sentido conjugal por ocorrer com לקח; “mulher” mantém o modo bíblico natural de expressar essa relação em português e evita peso desnecessário na frase.
- source_word: וּשְׁמָהּ
  choice: chamada
  rationale: A oração nominal “e o nome dela era” é vertida idiomaticamente por “chamada”, preservando a identificação explícita sem rigidez sintática.
- source_word: קְטוּרָה
  choice: Quetura
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
theological_decisions:
- issue: Como expressar a força aditiva de וַיֹּסֶף em relação à nova união de Abraão
  choice: Abraão tomou outra mulher
  alternative: Abraão tornou a tomar uma mulher
  rationale: “Outra mulher” comunica de modo claro que se trata de uma união adicional. A alternativa “tornou a tomar” preserva mais diretamente a repetição verbal, mas pode soar menos corrente; a nota registra essa ambiguidade lexical sem acrescentar uma conclusão teológica ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Quetura” segue a forma consagrada em português. A formulação principal é concisa e natural, enquanto a nota preserva a expressão hebraica incomum e sua alternativa.
