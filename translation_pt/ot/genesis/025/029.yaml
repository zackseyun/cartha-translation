review_pass:
  verdict: revise
  source_fidelity: A tradução de וַיָּבֹא como “voltou” acrescenta a noção de retorno, que o hebraico não expressa. Além disso, a ligação por “quando” torna a chegada de Esaú uma circunstância temporal subordinada, ao passo que o hebraico apresenta duas ações narrativas coordenadas. “Cozinhando” preserva melhor a ação de preparo por fervura do que o mais genérico “preparando”.
  naturalness: “Jacó estava cozinhando um ensopado, e Esaú veio do campo, exausto” é natural, claro e adequado ao português moderno de ampla compreensão. Mantém a concisão narrativa sem introduzir informação sobre o destino ou sobre um retorno de Esaú.
  terminology: “Ensopado” é uma boa equivalência moderna para נָזִיד. “Exausto” comunica apropriadamente עָיֵף; as alternativas da nota devem incluir uma opção que reflita “faint” sem afirmar uma interpretação mais forte no texto principal.
  issues:
