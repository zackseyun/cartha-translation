  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: pt
  text: Jacó estava cozinhando um ensopado[a], e Esaú veio do campo, exausto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fervendo um ensopado”. O verbo hebraico se refere especificamente ao preparo por fervura.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cansado” ou “desfalecido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: estava preparando
  rationale: O verbo זיד, neste contexto, descreve o preparo de alimento por fervura. “Estava preparando” é natural em português e, junto de “ensopado”, comunica adequadamente a ação culinária.
- source_word: נָזִיד
  choice: um ensopado
  rationale: נָזִיד designa um prato cozido, especialmente um ensopado. A escolha é moderna, clara e evita termos arcaicos.
- source_word: וַיָּבֹא
  choice: voltou
  rationale: בוא significa vir ou chegar. No contexto, Esaú chega do campo ao local onde Jacó cozinha; “voltou” expressa isso naturalmente sem acrescentar um destino específico.
- source_word: מִן הַשָּׂדֶה
  choice: do campo
  rationale: שׂדה pode indicar campo ou região aberta. “Do campo” conserva a imagem concreta e é idiomático em português.
- source_word: וְהוּא עָיֵף
  choice: exausto
  rationale: A construção predica de Esaú um estado de intenso cansaço. “Exausto” mantém a força contextual de עָיֵף em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A oração foi articulada com “quando” para reproduzir naturalmente a sequência narrativa, sem inserir um marcador temporal equivalente a “ora/agora” que não aparece explicitamente no hebraico.
