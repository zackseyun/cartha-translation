    issue: “voltou” para וַיָּבֹא
    rationale: O verbo significa “veio”, “chegou” ou “entrou”; “voltou” pressupõe que Esaú retornava a um local anterior, elemento não explicitado no hebraico.
  - severity: low
    issue: “quando” subordina as ações narrativas
    rationale: A construção hebraica coordena o preparo do ensopado e a vinda de Esaú. A coordenação em português preserva melhor a estrutura sem alterar o sentido básico.
  - severity: low
    issue: “estava preparando” é menos específico
    rationale: Embora possível no contexto, “preparando” não indica por si o cozimento/fervura expresso pelo verbo hebraico. “Cozinhando” é igualmente idiomático e mais próximo.
