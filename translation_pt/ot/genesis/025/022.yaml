base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: pt
  text: 'Os filhos lutavam um com o outro dentro dela, e ela disse: “Se é assim, por que estou desse jeito?”[a] Então foi consultar Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que sou assim?” A expressão hebraica é elíptica e também pode ser entendida, mais literalmente, como “por que existo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: lutavam um com o outro
  rationale: O hitpael expressa ação recíproca e intensa. A formulação comunica o conflito entre os filhos ainda não nascidos sem suavizá-lo nem exagerá-lo.
- source_word: הַבָּנִים
  choice: os filhos
  rationale: בנים designa os descendentes masculinos; “filhos” é natural em português e condiz com a identificação deles no versículo seguinte.
- source_word: בְּקִרְבָּהּ
  choice: dentro dela
  rationale: A expressão significa literalmente “no interior dela”. A tradução preserva a referência corporal sem explicitar “ventre”, termo não presente no substantivo hebraico.
- source_word: אִם כֵּן
  choice: Se é assim
  rationale: Expressa naturalmente em português a reação condicional de Rebeca à luta que sente dentro de si.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: por que estou desse jeito?
  rationale: A frase hebraica é elíptica. Esta versão se ajusta ao contexto da gestação difícil sem transformar a fala, de modo indevido, numa pergunta filosófica inequívoca sobre a própria existência.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: consultar Yahweh
  rationale: דרש com objeto pessoal pode indicar a busca de orientação ou resposta divina; “consultar” comunica esse sentido oracular com clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
- issue: Sentido da pergunta elíptica לָמָּה זֶּה אָנֹכִי
  choice: por que estou desse jeito?
  alternative: por que existo?; por que sou assim?
  rationale: O contexto favorece uma pergunta angustiada sobre sua condição, mas o hebraico permanece incompleto e admite uma leitura mais literal; essa ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Lutavam um com o outro” mantém a reciprocidade da ação; a nota conserva a ambiguidade genuína da pergunta de Rebeca.
