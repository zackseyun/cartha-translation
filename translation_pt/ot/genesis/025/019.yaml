source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: pt
  text: 'Estas são as gerações de Isaque[a], filho de Abraão: Abraão gerou Isaque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “relato” ou “linhagem”. O hebraico toledot é um termo recorrente que serve de cabeçalho em Gênesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: A fórmula introduz uma nova seção. Em português, “Estas são” preserva a forma do cabeçalho sem acrescentar um advérbio temporal; o ו inicial funciona aqui como elemento de ligação discursiva e não precisa ser traduzido separadamente.
- source_word: תּוֹלְדֹת
  choice: gerações
  rationale: Em Gênesis, o termo funciona como fórmula estrutural recorrente e pode abranger aquilo que procede de uma pessoa, sua linhagem ou seu relato. “Gerações” conserva essa amplitude, com alternativas esclarecidas em nota.
- source_word: יִצְחָק
  choice: Isaque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן אַבְרָהָם
  choice: filho de Abraão
  rationale: Tradução direta da relação genealógica expressa pela construção hebraica.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד indica que Abraão foi o progenitor de Isaque. “Gerou” é conciso, preciso no contexto genealógico e corrente no registro bíblico português.
- source_word: אֶת יִצְחָק
  choice: Isaque
  rationale: A partícula אֶת marca o objeto direto definido e não recebe tradução independente.
theological_decisions:
- issue: Tradução da fórmula tôledôt em Gênesis
  choice: gerações
  alternative: relato; linhagem
  rationale: A escolha mantém o termo estrutural formal e sua abrangência, sem decidir que a seção trate exclusivamente de descendentes, biografia ou história familiar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva o paralelismo genealógico e a repetição enfática de “Abraão” e “Isaque” presentes no hebraico.
