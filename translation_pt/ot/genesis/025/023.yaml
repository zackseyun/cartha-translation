  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: pt
  text: 'E Yahweh lhe disse: “Duas nações estão no seu ventre, e dois povos se separarão de dentro de você; um povo será mais forte que o outro, e o mais velho servirá ao mais novo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o maior servirá ao menor”.'
    reason: Preserva a alternativa lexical possível para רַב e צָעִיר.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁנֵי גיים
  choice: duas nações
  rationale: גוי designa uma nação ou grupo étnico; “nações” expressa bem o sentido coletivo e político aqui.
- source_word: בְּבִטְנֵךְ
  choice: no seu ventre
  rationale: No contexto da gravidez, “ventre” é natural, preciso e digno em português.
- source_word: שְׁנֵי לְאֻמִּים
  choice: dois povos
  rationale: “Povos” preserva o paralelismo com “nações” sem apagar a variação lexical do hebraico.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: se separarão de dentro de você
  rationale: Conserva tanto a ideia de procedência do interior de Rebeca quanto o sentido de separação ou divergência expresso pelo verbo.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: um povo será mais forte que o outro
  rationale: Expressa em português corrente a relação comparativa e a ideia de força do hebraico.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: e o mais velho servirá ao mais novo
  rationale: No contexto dos gêmeos, “mais velho” e “mais novo” comunicam naturalmente a referência provável, sem eliminar a alternativa lexical “maior” e “menor”, registrada em nota.
theological_decisions:
- issue: Sentido de רַב e צָעִיר na declaração final
  choice: o mais velho servirá ao mais novo
  alternative: o maior servirá ao menor
  rationale: O contexto de dois filhos no ventre favorece a leitura etária, mas os adjetivos hebraicos também podem indicar grandeza e pequenez em sentido mais amplo. A alternativa é preservada em nota para não resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém o paralelismo poético entre “nações” e “povos” e evita terminologia denominacional.
