base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: pt
  text: E Jacó deu a Esaú pão e ensopado de lentilhas. Esaú comeu, bebeu, levantou-se e foi embora. Assim, Esaú desprezou o direito de primogenitura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן
  choice: deu
  rationale: O verbo comum “dar” expressa diretamente a ação, sem acrescentar uma nuance ausente no hebraico.
- source_word: לֶחֶם
  choice: pão
  rationale: Embora o termo possa designar alimento em sentido amplo, sua combinação com o ensopado favorece aqui o sentido concreto de “pão”.
- source_word: נְזִיד עֲדָשִׁים
  choice: ensopado de lentilhas
  rationale: A construção designa um prato cozido feito de lentilhas; “ensopado de lentilhas” é claro, natural e mais preciso que “sopa”.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: comeu, bebeu, levantou-se e foi embora
  rationale: A sequência breve de verbos foi preservada com coordenação natural em português, mantendo o ritmo rápido da narrativa sem a repetição pouco idiomática de “e” antes de cada verbo.
- source_word: וַיִּבֶז
  choice: desprezou
  rationale: “Desprezou” comunica de modo conciso a ideia forte de considerar com desdém ou pouco valor.
- source_word: הַבְּכֹרָה
  choice: o direito de primogenitura
  rationale: A expressão torna explícito, em português corrente, que se trata da condição e dos direitos ligados ao primogênito.
theological_decisions:
- issue: Avaliação narrativa da atitude de Esaú diante da primogenitura
  choice: Assim, Esaú desprezou o direito de primogenitura
  alternative: E Esaú tratou com desprezo o direito de primogenitura
  rationale: “Assim” apresenta a frase final como avaliação conclusiva das ações anteriores, enquanto “desprezou” preserva a força moral do verbo hebraico sem ampliar a interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e o encadeamento rápido do hebraico.
