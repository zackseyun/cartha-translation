- source_word: יְטוּר
  choice: Jetur
  rationale: Nome próprio transliterado com J, forma tradicional e legível em português para o yod inicial neste nome bíblico.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Nome próprio transliterado conforme a fonologia e a ortografia portuguesas, usando f para פ e s final para שׁ.
- source_word: קֵדְמָה
  choice: Quedemá
  rationale: Nome próprio transliterado em ortografia portuguesa; Qu representa o som inicial de ק diante de e, e o acento assinala a tonicidade final.
- source_word: וְ / וָ
  choice: e
  rationale: A conjunção hebraica liga os nomes; em português natural, usam-se vírgulas e 'e' antes do último elemento.
