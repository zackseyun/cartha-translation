base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: pt
  text: 'E Jacó disse: “Jure-me hoje[a].” Então Esaú jurou a Jacó e lhe vendeu seu direito de primogenitura[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “neste dia” ou “a partir de hoje”.
    reason: lexical_alternative
  - marker: b
    text: O “direito de primogenitura” abrangia a posição e os direitos que pertenciam ao filho primogênito.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: Jure
  rationale: O imperativo do verbo שבע exige que Esaú confirme a transação mediante juramento; “jure” é direto, natural e mantém a ligação verbal com וַיִּשָּׁבַע.
- source_word: לִּי
  choice: a mim
  rationale: A preposição ל com o sufixo da primeira pessoa indica a pessoa perante quem o juramento é feito. “A mim” preserva essa relação de modo claro.
- source_word: כַּיּוֹם
  choice: hoje mesmo
  rationale: A expressão temporal enfatiza o momento presente. “Hoje mesmo” comunica sua força imediata, enquanto a nota registra traduções menos enfáticas possíveis.
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: Mantém a correspondência lexical com a ordem “Jure” e reproduz de forma concisa a sequência narrativa hebraica.
- source_word: וַיִּמְכֹּר
  choice: vendeu
  rationale: O verbo מכר descreve propriamente uma venda; a escolha conserva o caráter transacional do ato sem paráfrase interpretativa.
- source_word: בְּכֹרָתוֹ
  choice: seu direito de primogenitura
  rationale: בכרה designa a condição e os direitos familiares do primogênito. “Direito de primogenitura” é uma formulação portuguesa conhecida e semanticamente clara.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição ל identifica Jacó como destinatário tanto do juramento, por explicitação contextual, quanto da venda; a formulação evita ambiguidade pronominal em português.
theological_decisions:
- issue: Natureza da transferência da בכרה por Esaú
  choice: vendeu-lhe seu direito de primogenitura
  alternative: vendeu-lhe seus direitos de filho mais velho
  rationale: A redação apresenta uma transferência concreta de posição e direitos familiares por meio de venda, sem acrescentar conclusões doutrinárias sobre seu alcance posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O sujeito implícito dos verbos “jurou” e “vendeu” foi explicitado como Esaú, e o referente pronominal como Jacó, para evitar ambiguidade natural em português. A ordem narrativa e o caráter jurídico-familiar da transação foram preservados.
