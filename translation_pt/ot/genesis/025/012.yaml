base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s slave woman[b], bore to Abraham.
translation:
  language: pt
  text: Estas são as gerações de Ismael[a], filho de Abraão, que Agar, a egípcia, escrava de Sara[b], deu à luz a Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E estas são as gerações de Ismael”. A fórmula hebraica תּוֹלְדוֹת (toledot) aparece repetidamente como título de seções em Gênesis e também pode ser traduzida por “descendentes” ou “linhagem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serva de Sara”. O hebraico שִׁפְחָה refere-se a uma mulher escravizada ou serva; “escrava” explicita sua condição de sujeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Estas são
  rationale: A fórmula introduz uma nova seção genealógica. Em português, o conectivo וְ pode ficar implícito com naturalidade; a alternativa com “E” é registrada em nota.
- source_word: תֹּלְדֹת
  choice: gerações
  rationale: Preserva o termo estruturante recorrente de Gênesis e sua amplitude, que pode abranger descendência e história familiar.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן אַבְרָהָם
  choice: filho de Abraão
  rationale: Reproduz de modo direto e natural a relação expressa pela construção hebraica.
- source_word: אֲשֶׁר יָלְדָה
  choice: que ... gerou
  rationale: Mantém Agar como sujeito materno explícito do verbo ילד e evita transformar a oração em construção passiva.
- source_word: הָגָר הַמִּצְרִית
  choice: Agar, a egípcia
  rationale: Emprega a forma tradicional portuguesa do nome e preserva a identificação de origem de Agar.
- source_word: שִׁפְחַת שָׂרָה
  choice: escrava de Sara
  rationale: שִׁפְחָה designa uma mulher em condição servil; “escrava” explicita melhor o vínculo de sujeição do que o tradicional “serva”.
- source_word: לְאַבְרָהָם
  choice: para Abraão
  rationale: Preserva a preposição לְ na construção de nascimento, indicando Abraão como pai em favor de quem Agar gerou o filho.
