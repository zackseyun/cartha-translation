base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: pt
  text: Depois da morte de Abraão, Deus abençoou Isaque, seu filho, e Isaque morou perto de Beer-Laai-Roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Laai-Roi é o nome de um poço; o nome hebraico foi apresentado anteriormente em Gênesis 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: Depois da morte de Abraão
  rationale: A fórmula narrativa introduz o acontecimento seguinte. Em português atual, a oração temporal direta preserva a sequência sem recorrer ao arcaico «e aconteceu que».
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Deus abençoou
  rationale: ברך significa aqui «abençoar», e אֱלֹהִים designa Deus no contexto narrativo.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: Isaque, seu filho
  rationale: Mantém a ordem hebraica e explicita que Isaque era filho de Abraão; a pontuação torna a identificação natural em português.
- source_word: וַיֵּשֶׁב
  choice: passou a morar
  rationale: ישב descreve residência. «Passou a morar» expressa naturalmente o desenvolvimento narrativo após a bênção, sem impor a ideia mais forte de estabelecimento permanente.
- source_word: עִם
  choice: perto de
  rationale: Diante do nome de um lugar, עִם indica proximidade; a tradução literal «com» seria enganosa em português.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Laai-Roi
  rationale: O nome próprio já introduzido em Gênesis 16:14 é transliterado, não traduzido, seguindo uma forma reconhecível em português.
theological_decisions:
- issue: Sentido de אֱלֹהִים nesta narrativa
  choice: Deus
  alternative: a Divindade
  rationale: O contexto se refere diretamente ao Deus que abençoa Isaque; «Deus» é a tradução normal, clara e não acrescenta formulação doutrinária.
- issue: Natureza da bênção dada a Isaque
  choice: Manter apenas «abençoou», sem especificar o conteúdo
  alternative: Explicitar a transmissão das promessas ou da aliança
  rationale: O versículo não define aqui o conteúdo da bênção. A tradução preserva essa concisão e evita inserir uma interpretação teológica não expressa na frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evita a fórmula arcaizante «e aconteceu que» e conserva o nome próprio em transliteração tradicional reconhecível. A nota foi ligada ao topônimo que ela explica.
