  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: pt
  text: Jocsã gerou Sabá e Dedã. Os filhos de Dedã foram Assurim, Letusim e Leumim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também podem ser entendidos como nomes de clãs.
