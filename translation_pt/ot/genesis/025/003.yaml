lexical_decisions:
- source_word: יָקְשָׁן
  choice: Jocsã
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico, adequada a uma tradução bíblica de leitura ampla.
- source_word: יָלַד
  choice: gerou
  rationale: Em genealogias, expressa de modo conciso e natural a descendência paterna, sem o arcaísmo de formas como «engendrou».
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: דְּדָן
  choice: Dedã
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: בְנֵי
  choice: filhos de
  rationale: Reproduz diretamente o masculino plural hebraico; embora possa designar descendentes ou grupos derivados, a tradução conserva a forma genealógica do texto.
- source_word: הָיוּ
  choice: foram
  rationale: Uso copulativo simples que introduz os nomes dos filhos ou grupos associados a Dedã.
- source_word: אַשּׁוּרִם
  choice: assuritas
  rationale: O plural hebraico provavelmente designa um clã ou povo; a forma gentílica portuguesa comunica essa função com naturalidade.
- source_word: לְטוּשִׁים
  choice: letusitas
  rationale: Transposição como gentílico plural, coerente com a provável referência a um clã e sem atribuir ao nome uma etimologia incerta.
- source_word: לְאֻמִּים
  choice: leumitas
  rationale: Tratado como nome de grupo ou clã neste contexto, evitando traduzi-lo pelo substantivo comum relacionado a «povos».
