  source_fidelity: A redação «assuritas, letusitas e leumitas» transforma nomes próprios plurais hebraicos em gentílicos portugueses e, assim, interpreta mais do que o texto exige. Em uma genealogia, esses plurais podem referir-se a antepassados epônimos ou a clãs; a transliteração preserva melhor essa indeterminação. «Gerou», «filhos de» e os nomes Jocsã, Sabá e Dedã são fiéis ao hebraico e adequados.
