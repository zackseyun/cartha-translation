base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: pt
  text: 'Esaú disse a Jacó: “Por favor, deixe-me engolir um pouco dessa coisa vermelha, dessa coisa vermelha aí,[a] pois estou exausto.” Por isso, ele recebeu o nome de Edom.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete literalmente “o vermelho, o vermelho” sem dizer que tipo de comida era; a formulação pode refletir a fala impulsiva de Esaú. Muitas traduções acrescentam “ensopado”.
    reason: lexical_alternative
  - marker: b
    text: Edom soa como a palavra hebraica para “vermelho”, formando um jogo de palavras neste versículo.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי נָא
  choice: Por favor, deixe-me engolir
  rationale: O hifil imperativo de לעט com sufixo de primeira pessoa sugere fazer alguém engolir ou dar-lhe de comer, com conotação de voracidade. A formulação preserva a fala impulsiva de Esaú sem recorrer a uma expressão pouco natural em português; נָא é representado por “por favor”.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: um pouco dessa coisa vermelha, dessa vermelha aí
  rationale: O hebraico repete “vermelho” e não nomeia explicitamente a comida. “Coisa vermelha” conserva a elipse e o tom imediato da fala; a repetição e “aí” refletem, respectivamente, הָאָדֹם הָאָדֹם e o demonstrativo הַזֶּה.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: pois estou exausto
  rationale: עָיֵף indica cansaço intenso. “Exausto” é atual, claro e adequado à urgência da fala.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa naturalmente em português a relação explicativa ou resultativa que introduz a origem do nome.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: ele recebeu o nome de Edom
  rationale: A construção hebraica não explicita o agente de קָרָא. A forma portuguesa evita impor “eles” ou outro sujeito e comunica de modo natural a fórmula de nomeação.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mantém o nome próprio transliterado; a nota explica sua ligação sonora com o termo hebraico para “vermelho”.
