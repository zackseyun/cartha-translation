base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: pt
  text: 'E estes são os nomes dos filhos de Ismael, nome por nome, segundo suas linhagens[a]: o primogênito de Ismael foi Nebaiote; Quedar, Adbeel e Mibsão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo suas gerações”. O termo hebraico pode indicar gerações ou linhas de descendência em contexto genealógico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Mantém a conjunção hebraica e introduz a lista genealógica de modo natural e solene.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: os nomes dos filhos de Ismael
  rationale: Reproduz diretamente a cadeia construta hebraica e conserva o estilo genealógico.
- source_word: בִּשְׁמֹתָם
  choice: nome por nome
  rationale: Expressa de maneira idiomática em português a ideia distributiva de identificação pelos respectivos nomes, sem perder a repetição enfática do hebraico.
- source_word: לְתוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto genealógico, תוֹלְדוֹת designa descendência ou linhas familiares; 'linhagens' comunica esse sentido com clareza, enquanto a nota preserva a alternativa mais formal.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: o primogênito de Ismael
  rationale: Tradução direta da expressão construta, identificando Nebaiote como o filho primogênito.
- source_word: נְבָיֹת
  choice: Nebaiote
  rationale: Forma tradicional e reconhecível do nome em português bíblico.
- source_word: קֵדָר
  choice: Quedar
  rationale: Forma tradicional e reconhecível do nome em português bíblico.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Transliteração tradicional do nome em português.
- source_word: מִבְשָׂם
  choice: Mibsão
  rationale: Forma tradicional do nome em português bíblico, adequada à leitura brasileira.
