base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: pt
  text: Isaque suplicou[a] a Yahweh por sua esposa[b], pois ela era estéril. Yahweh o atendeu, e Rebeca, sua esposa, ficou grávida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega o mesmo radical verbal nas duas orações: Isaque «suplicou», e Yahweh «se deixou suplicar por ele», isto é, atendeu à sua súplica.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido literalmente como «diante de sua esposa» ou «em frente à sua esposa»; no contexto, a expressão pode indicar que Isaque orou em favor dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: suplicou / o atendeu
  rationale: O mesmo radical hebraico aparece nas duas orações, criando uma correspondência entre a súplica de Isaque e a resposta divina. Em português atual, «suplicou ... o atendeu» comunica essa reciprocidade com naturalidade; a nota registra a repetição lexical do original.
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: por sua esposa
  rationale: Embora לְנֹכַח possa designar posição diante de alguém, neste contexto a expressão indica que Isaque ora em favor da esposa. A formulação escolhida é clara e preserva esse sentido, enquanto a nota mantém a possibilidade espacial.
- source_word: עֲקָרָה
  choice: estéril
  rationale: Expressa diretamente a incapacidade de conceber indicada pelo termo hebraico, sem reduzi-la apenas ao estado de não ter filhos.
- source_word: וַתַּהַר
  choice: ficou grávida
  rationale: Equivalente atual, claro e natural para o hebraico que indica que Rebeca concebeu.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Repetição do radical עתר e a resposta divina
  choice: Isaque «suplicou», e Yahweh «o atendeu»
  alternative: Isaque «implorou», e Yahweh «se deixou atender por ele»
  rationale: A tradução evita sugerir uma causalidade mecânica ou que Deus tenha sido coagido, mas conserva a relação direta entre a oração de Isaque e o atendimento de Yahweh. A repetição do radical é explicitada em nota.
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino, e a transliteração o distingue do título אֲדֹנָי, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade no Brasil e compreensão internacional. «Suplicou» preserva a intensidade própria do verbo sem inserir um advérbio; «ficou grávida» evita uma formulação excessivamente arcaica.
