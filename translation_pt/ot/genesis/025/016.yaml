base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: pt
  text: 'Estes são os filhos de Ismael, e estes são seus nomes, conforme seus povoados e acampamentos[a]: doze chefes[b], segundo os seus povos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “em seus povoados e em seus acampamentos”. “Povoados” também pode ser entendido como “aldeias”, e “acampamentos”, como “recintos fortificados”.'
    reason: Preserva a possível nuance locativa da preposição בְּ e a amplitude semântica de חָצֵר e טִירָה.
  - marker: b
    text: Ou “príncipes” ou “líderes”.
    reason: נָשִׂיא pode designar chefe, líder ou príncipe.
  - marker: c
    text: Ou “segundo as suas tribos”.
    reason: אֻמָּה pode referir-se a um povo ou grupo tribal.
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: Estes são os filhos de Ismael
  rationale: Mantém a construção demonstrativa e o sentido concreto de בְּנֵי, pois o contexto imediato enumera os filhos de Ismael.
- source_word: בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: em seus povoados e acampamentos
  rationale: A preposição בְּ é entendida em sentido locativo. חָצֵר designa povoado ou aldeia, enquanto טִירָה pode designar acampamento ou recinto fortificado; a formulação preserva o contraste sem excessiva tecnicidade.
- source_word: נְשִׂיאִם
  choice: chefes
  rationale: No contexto tribal, indica pessoas de posição elevada que lideram grupos. “Chefes” é claro e evita que “príncipes” seja entendido necessariamente em sentido monárquico ou hereditário.
- source_word: לְאֻמֹּתָם
  choice: segundo os seus povos
  rationale: אֻמָּה indica um povo ou grupo étnico. “Povos” conserva a amplitude do termo sem restringi-lo indevidamente a clãs ou tribos.
theological_decisions:
- issue: Natureza da liderança expressa por נְשִׂיאִים
  choice: chefes
  alternative: príncipes; líderes
  rationale: A tradução não pressupõe uma monarquia nem uma doutrina específica de sucessão; expressa apenas a posição elevada desses homens entre os respectivos povos.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “Estes são... e estes são...” foi mantida por refletir a estrutura enfática do hebraico.
