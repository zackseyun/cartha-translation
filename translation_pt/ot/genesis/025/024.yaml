lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Quando se completaram os dias de ela dar à luz
  rationale: Preserva a expressão hebraica segundo a qual os dias se completam, mantendo ao mesmo tempo uma construção compreensível em português moderno.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função discursiva de chamar a atenção para a descoberta significativa que vem a seguir, em registro digno e ainda corrente.
- source_word: תוֹמִם
  choice: gêmeos
  rationale: Equivalente português direto do substantivo plural que designa duas crianças geradas na mesma gestação.
- source_word: בְּבִטְנָהּ
  choice: em seu ventre
  rationale: No contexto de gravidez e parto, 'ventre' expressa naturalmente o sentido de בטן sem a conotação mais genérica de 'barriga'.
