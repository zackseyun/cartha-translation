  text: Abraham gave all that he had to Isaac[a].
translation:
  language: pt
  text: Abraão deu a Isaque tudo o que possuía[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “tudo o que era seu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן tem o sentido básico de “dar”; na sequência narrativa, o pretérito perfeito é a forma natural em português.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marca hebraica do objeto direto, cuja função é expressa pela sintaxe portuguesa.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que possuía
  rationale: Expressa de modo natural o sentido de “tudo o que era dele” ou “tudo o que lhe pertencia”, mantendo o alcance total da frase.
- source_word: לְיִצְחָק
  choice: a Isaque
  rationale: A preposição לְ indica aqui o destinatário; “a Isaque” reproduz essa relação com clareza.
