base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: pt
  text: Seus filhos Isaque e Ismael o sepultaram na caverna de Macpela, no campo de Efrom, filho de Zoar, o hitita; esse campo fica diante de Manre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente de Manre” ou “defronte de Manre”. A expressão hebraica pode indicar um lugar diante de ou no lado oposto a um ponto de referência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: O wayyiqtol de קבר dá sequência à narrativa; em português, o pretérito perfeito expressa naturalmente o evento, sem exigir a conjunção inicial. O pronome objeto retoma Abraão.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Seus filhos Isaque e Ismael
  rationale: A anteposição de “Seus filhos” reproduz de modo natural em português a relação apositiva e deixa explícito que ambos eram filhos de Abraão.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: na caverna de Macpela
  rationale: Embora אֶל costume indicar direção, com o verbo “sepultar” o português idiomático pede localização com “em”. Macpela é mantido como nome próprio transliterado.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: no campo de Efrom
  rationale: A segunda ocorrência de אֶל especifica o lugar da caverna; “no campo” é a formulação natural em português.
- source_word: בֶּן צֹחַר
  choice: filho de Zoar
  rationale: Tradução direta da construção genealógica בן seguida de nome próprio.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: Forma gentílica convencional e inteligível em português.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: que fica diante de Manre
  rationale: A expressão geográfica עַל־פְּנֵי pode significar “diante de”, “em frente de” ou “defronte de”. A opção principal preserva a referência espacial sem impor uma direção cardinal.
