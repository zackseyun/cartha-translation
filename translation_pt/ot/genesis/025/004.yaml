  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: pt
  text: E os filhos de Midiã foram Efá, Éfer, Hanoque[a], Abida e Eldaá. Todos esses foram filhos de Quetura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Hanoque; tradicionalmente Enoque em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן designa especificamente os descendentes masculinos nesta genealogia. Em português, a ligação com o versículo anterior não exige reproduzir mecanicamente a conjunção inicial.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: עֵיפָה
  choice: Efá
  rationale: Transliteração portuguesa corrente do nome próprio hebraico, com acento gráfico para indicar a tonicidade final.
- source_word: וָעֵפֶר
  choice: Éfer
  rationale: Forma portuguesa clara e próxima da vocalização hebraica do nome próprio.
- source_word: וַחֲנֹךְ
  choice: Hanoque
  rationale: Transliteração adaptada à ortografia portuguesa que representa mais diretamente חֲנֹךְ e permite distingui-lo, na forma escrita, do tradicional Enoque.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: וְאֶלְדָּעָה
  choice: Elda
  rationale: Forma portuguesa tradicional do nome próprio, natural para leitores atuais.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Expressão portuguesa natural que conserva a força coletiva e recapituladora do hebraico.
- source_word: בְּנֵי קְטוּרָה
  choice: foram filhos de Quetura
  rationale: Mantém a fórmula genealógica e a identificação explícita dos homens enumerados como filhos de Quetura.
