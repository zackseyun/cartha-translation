lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: O substantivo definido designa o campo já mencionado, isto é, a propriedade funerária; esta é a forma direta e natural em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo introduz a oração que especifica o campo.
- source_word: קָנָה
  choice: comprou
  rationale: No contexto de uma transação de terra, expressa de modo claro e concreto o sentido comercial do verbo.
- source_word: מֵאֵת
  choice: dos
  rationale: A preposição indica de quem Abraão comprou o campo; a contração “dos” é idiomática em português.
- source_word: בְּנֵי חֵת
  choice: filhos de Hete
  rationale: Preserva a expressão familiar e étnica literal do hebraico e sua ligação com o nome pessoal Hete; “hititas” é registrado como alternativa.
- source_word: שָׁמָּה
  choice: ali
  rationale: O advérbio retoma especificamente o campo como local do sepultamento; “ali” é natural nesse contexto.
- source_word: קֻבַּר
  choice: foram sepultados
  rationale: O passivo singular hebraico precede o sujeito composto, uma concordância possível no hebraico bíblico. O plural em português deixa claro, de modo natural, que o sepultamento se aplica a Abraão e Sara.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: e Sara, sua mulher
  rationale: Mantém a ordem do hebraico e identifica naturalmente a relação de Sara com Abraão.
