translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão liga a expressão topicalizada “o campo...” à oração que a retoma com “ali”, evitando um fragmento artificial. A concordância verbal no plural é natural em português, embora o hebraico use verbo singular antes do sujeito composto.
