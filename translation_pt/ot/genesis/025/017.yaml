  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: pt
  text: 'Estes foram os anos da vida de Ismael: cento e trinta e sete anos. E ele expirou e morreu[a], e foi reunido ao seu povo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui dois verbos distintos, “expirou” e “morreu”; ambos foram mantidos na tradução.
    reason: lexical_note
  - marker: b
    text: “Foi reunido ao seu povo” é uma expressão hebraica usada em relatos de morte; pode indicar a reunião com os antepassados, o sepultamento entre os parentes, ou ambos.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes foram
  rationale: Introduz o resumo da vida de Ismael. Embora a expressão hebraica não contenha um verbo explícito, o pretérito é natural em português neste contexto narrativo.
- source_word: שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: os anos da vida de Ismael
  rationale: Reproduz com clareza a expressão hebraica que indica a duração total da vida de uma pessoa.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: cento e trinta e sete anos
  rationale: Apresenta a sequência numérica hebraica na forma corrente do português, preservando o total exato.
- source_word: וַיִּגְוַע
  choice: ele expirou
  rationale: O verbo גוע descreve o ato de expirar ou dar o último suspiro. “Expirou” mantém sua distinção em relação ao verbo seguinte, “morreu”.
- source_word: וַיָּמָת
  choice: e morreu
  rationale: Conserva o segundo verbo de morte da sequência hebraica, sem fundi-lo com גוע.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: e foi reunido ao seu povo
  rationale: Preserva a fórmula funerária hebraica e sua ambiguidade, sem restringi-la apenas ao sepultamento nem defini-la como reunião após a morte.
theological_decisions:
- issue: Sentido da fórmula “foi reunido ao seu povo”
  choice: Manter a expressão idiomática sem definir seu sentido preciso
  alternative: Traduzir explicitamente como sepultamento junto aos antepassados ou como reunião com eles após a morte
  rationale: O hebraico pode evocar sepultamento entre os parentes, reunião com os antepassados após a morte, ou ambos. A tradução conserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação iniciada por “E” acompanha a progressão narrativa hebraica, e a fórmula final foi preservada sem explicação doutrinária no corpo do versículo.
