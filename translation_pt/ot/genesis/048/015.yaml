  - severity: low
    issue: «desde que existo» é uma formulação pouco natural neste enunciado.
    rationale: A expressão representa a amplitude de מֵעוֹדִי, mas «desde o início da minha vida» é idiomática e conserva a ideia de cuidado divino desde o período mais inicial, sem especificar «nascimento» ou «juventude».
