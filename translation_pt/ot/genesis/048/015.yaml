  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: pt
  text: 'E ele abençoou José e disse: “O Deus diante de quem meus antepassados Abraão e Isaque andaram, o Deus que me tem pastoreado[a] desde o início da minha vida[b] até o dia de hoje,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que tem sido meu pastor” ou “que me tem alimentado”. O verbo hebraico evoca o cuidado e o sustento contínuos de um pastor.
    reason: lexical_alternative
  - marker: b
    text: Ou “durante toda a minha vida”. A expressão hebraica aponta para o começo da existência de Jacó e ressalta o cuidado de Deus desde o princípio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: E ele abençoou José
  rationale: Conserva o objeto explícito do hebraico, José, sem harmonizá-lo com a menção dos filhos de José no contexto imediato.
- source_word: הָאֱלֹהִים
  choice: O Deus
  rationale: O artigo definido hebraico e a estrutura invocativa favorecem a forma solene e definida “O Deus”.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: diante de quem meus pais ... andaram
  rationale: Preserva a metáfora hebraica de conduzir a vida na presença de Deus, sem reduzi-la apenas a obedecer ou seguir.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraão e Isaque
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: הָרֹעֶה אֹתִי
  choice: que me tem pastoreado
  rationale: Mantém a força verbal e contínua do particípio e conserva explicitamente a imagem pastoral de cuidado, direção e sustento.
- source_word: מֵעוֹדִי
  choice: desde que existo
  rationale: Expressa a ideia de cuidado desde o princípio da existência de Jacó sem restringir a expressão especificamente à juventude ou ao momento do nascimento.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português natural da expressão temporal hebraica, destacando a continuidade do cuidado divino até o presente.
theological_decisions:
- issue: A expressão patriarcal de andar diante de Deus
  choice: diante de quem meus pais Abraão e Isaque andaram
  alternative: em cuja presença meus pais Abraão e Isaque viveram
  rationale: A formulação escolhida preserva a metáfora relacional e pactual do hebraico, sem interpretá-la exclusivamente como obediência.
- issue: A metáfora de Deus como pastor
  choice: o Deus que me tem pastoreado
  alternative: o Deus que tem sido meu pastor
  rationale: A escolha mantém a imagem teologicamente significativa do pastor e a força ativa e durativa do particípio hebraico, em vez de convertê-lo apenas em um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem solene da invocação e as metáforas hebraicas de andar diante de Deus e ser pastoreado foram preservadas. A vírgula final foi mantida porque a bênção continua no versículo seguinte.
