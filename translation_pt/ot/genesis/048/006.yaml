  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: pt
  text: Mas os filhos que você gerar depois deles serão seus[a]; serão chamados pelo nome de seus irmãos em sua herança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sua descendência, que você gerar depois deles».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, não receberiam heranças tribais separadas, mas seriam contados sob Efraim e Manassés.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ אֲשֶׁר הוֹלַדְתָּ
  choice: os filhos que você gerar
  rationale: O substantivo designa aquilo que nasce de alguém, e o hifil de ילד, dirigido a José, expressa gerar filhos. A formulação é natural em português e mantém a perspectiva paterna.
- source_word: אַחֲרֵיהֶם
  choice: depois deles
  rationale: Retoma diretamente Efraim e Manassés e indica filhos que José viesse a gerar posteriormente.
- source_word: לְךָ יִהְיוּ
  choice: serão seus
  rationale: Preserva de modo conciso a relação familiar e jurídica, em contraste com Efraim e Manassés, que Jacó acabara de tomar como seus.
- source_word: עַל שֵׁם אֲחֵיהֶם יִקָּרְאוּ
  choice: serão chamados pelo nome de seus irmãos
  rationale: Mantém a construção de nomeação do hebraico sem substituir no texto principal o sentido contextual por uma paráfrase como 'serão incorporados'.
- source_word: בְּנַחֲלָתָם
  choice: quanto à herança
  rationale: A expressão explicita de maneira natural em português o âmbito em que os filhos posteriores seriam chamados pelo nome dos irmãos, preservando נַחֲלָה como 'herança'.
theological_decisions:
- issue: Situação tribal dos filhos posteriores de José
  choice: Manter no texto a linguagem de serem chamados pelo nome dos irmãos e explicar a implicação em nota.
  alternative: Traduzir diretamente que seriam contados entre Efraim e Manassés.
  rationale: O hebraico apresenta a questão por meio do nome e da herança. A tradução conserva essa formulação e evita resolver no texto mais do que a fonte declara explicitamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Gerar' comunica naturalmente a paternidade de José; 'quanto à herança' evita uma sequência rígida e ambígua de complementos sem apagar a relação sintática e jurídica do hebraico.
