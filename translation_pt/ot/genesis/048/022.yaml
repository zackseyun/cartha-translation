  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: pt
  text: E eu lhe dou uma porção a mais do que a seus irmãos[a], a qual tomei da mão do amorreu com a minha espada e o meu arco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico שְׁכֶם (shekhem) pode significar «ombro», «lombada de terreno» ou «porção» e também pode fazer alusão ao nome Siquém. A frase talvez sugira intencionalmente tanto uma parte adicional quanto o lugar mais tarde associado a José.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Eu, porém
  rationale: O pronome independente destaca Jacó e sugere contraste com o que cabe aos irmãos; esta formulação preserva a ênfase de modo natural em português.
- source_word: נָתַתִּי
  choice: dou
  rationale: Embora a forma hebraica seja perfectiva, no discurso testamentário ela pode funcionar como declaração performativa de concessão presente.
- source_word: שְׁכֶם אַחַד
  choice: uma porção
  rationale: No contexto da herança, שְׁכֶם pode indicar uma parte ou porção; a possível alusão ao relevo e ao nome Siquém é preservada em nota.
- source_word: עַל אַחֶיךָ
  choice: a mais que a seus irmãos
  rationale: עַל expressa aqui vantagem ou acréscimo, indicando que José recebe uma parte adicional em relação aos irmãos.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: a qual tomei
  rationale: Tradução direta da oração relativa, sem definir além do texto a natureza da tomada.
- source_word: מִיַּד הָאֱמֹרִי
  choice: da mão do amorreu
  rationale: Mantém o idioma hebraico de poder ou posse e conserva o singular coletivo ou representativo do texto-fonte.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: com a minha espada e o meu arco
  rationale: Preserva literalmente as duas armas e a imagem marcial explícita.
theological_decisions:
- issue: Sentido de שְׁכֶם e sua relação com o topônimo Siquém e com a porção adicional de José
  choice: Traduzir no texto principal pelo sentido contextual «uma porção» e registrar em nota o jogo de palavras e as alternativas.
  alternative: «uma lombada» ou «Siquém, uma porção»
  rationale: O contexto favorece uma parcela adicional de herança, mas o hebraico pode evocar tanto uma elevação ou ombro de terreno quanto o lugar chamado Siquém. A nota preserva essa ambiguidade sem transformar silenciosamente o termo em nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. «Eu, porém» conserva a ênfase contrastiva; «da mão do amorreu» mantém deliberadamente o idioma e o singular hebraicos.
