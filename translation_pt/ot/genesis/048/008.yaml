base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: pt
  text: 'Quando Israel[a] viu os filhos de José, disse: “Quem são estes?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “Israel”, não “Jacó”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando ... viu
  rationale: O wayyiqtol dá continuidade à narrativa; a construção temporal com “Quando” introduz naturalmente, em português, a fala que se segue.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome empregado no texto hebraico, em vez de substituí-lo por “Jacó”.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico de objeto direto e não possui equivalente lexical independente em português.
- source_word: בְּנֵי יוֹסֵף
  choice: os filhos de José
  rationale: Reproduz de modo natural a cadeia construta hebraica, literalmente “os filhos de José”.
- source_word: וַיֹּאמֶר
  choice: perguntou
  rationale: Embora o verbo hebraico seja literalmente “disse”, “perguntou” expressa de forma natural a função da fala interrogativa sem alterar seu conteúdo.
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que pede a identidade das pessoas indicadas.
- source_word: אֵלֶּה
  choice: estes
  rationale: Demonstrativo plural referente às pessoas presentes; “estes” preserva adequadamente sua proximidade dêitica.
theological_decisions:
- issue: Nome do patriarca
  choice: Israel
  alternative: Jacó
  rationale: O hebraico usa explicitamente “Israel”; conservar esse nome evita apagar uma possível relevância literária ou pactual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem são estes?” conserva a forma direta da pergunta e o demonstrativo do hebraico.
