  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: pt
  text: José tomou os dois — Efraim na sua mão direita, à esquerda de Israel, e Manassés na sua mão esquerda, à direita de Israel — e os aproximou de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Reproduz diretamente o verbo hebraico e introduz com naturalidade a disposição dos dois filhos.
- source_word: בִּימִינוֹ / בִשְׂמֹאלוֹ
  choice: à sua direita / à sua esquerda
  rationale: Expressa a posição de Efraim e Manassés em relação a José sem sugerir necessariamente que ele segurava cada um em uma das mãos.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: à esquerda de Israel / à direita de Israel
  rationale: O מִן tem aqui valor espacial, indicando o lado em que cada filho ficou diante de Israel; esta formulação evita o pouco natural 'desde a esquerda'.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: e os aproximou dele
  rationale: Mantém o sentido causativo de נגשׁ no hifil e o referente singular de 'dele', isto é, Israel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo espacial preservado. Os dois-pontos tornam explícita a disposição dos filhos sem acrescentar conteúdo ao hebraico; o ponto e vírgula separa essa disposição do ato de aproximá-los.
