  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: pt
  text: 'Depois dessas coisas, alguém disse a José[a]: “Veja, seu pai está doente.” Então José levou consigo seus dois filhos, Manassés e Efraim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “e ele disse a José”; o falante não é identificado.'
    reason: A nota registra a forma singular masculina do original e explica por que a tradução usa o sujeito indefinido “alguém”.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Expressa de modo natural a transição narrativa e preserva a formulação ampla de דְּבָרִים, sem acrescentar um marcador temporal inexistente.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: alguém disse a José
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o falante não é identificado. “Alguém disse” mantém essa indefinição em português sem criar um sujeito específico.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção de José para a condição do pai; “Veja” é atual, direta e digna, sem o tom arcaico de “eis” ou “eis que”.
- source_word: אָבִיךָ חֹלֶה
  choice: seu pai está doente
  rationale: Tradução direta e idiomática do estado presente de Jacó.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Então José levou consigo seus dois filhos
  rationale: “Então” indica o avanço da narrativa. A repetição de “José” evita que “ele” pareça retomar o mensageiro anônimo e torna clara a referência já indicada pelo contexto.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manassés e Efraim
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português, em aposição a “seus dois filhos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém a indefinição do mensageiro e explicita José na segunda oração apenas para evitar uma referência pronominal enganosa.
