  terminology: “Israel”, “José” e “Deus” estão corretos e consistentes com o texto-fonte. “Descendentes” é uma boa solução portuguesa para o substantivo coletivo זרע neste contexto. Não há termos teológicos disputados que exijam qualificação adicional.
