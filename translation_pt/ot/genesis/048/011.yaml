source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: pt
  text: 'Israel disse a José: “Eu não esperava ver o seu rosto[a], e eis que Deus me permitiu ver até os seus descendentes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica “ver o seu rosto” significa vê-lo pessoalmente. Também se pode traduzir: “Eu não contava voltar a vê-lo”.'
    reason: Esclarece o idioma hebraico e registra uma alternativa natural em português sem apagar a formulação concreta do texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma natural de fazer avançar a narrativa em português; a ligação com o contexto já é clara, sem necessidade de reproduzir mecanicamente o ו inicial.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o nome empregado no texto hebraico, sem harmonizá-lo com “Jacó”.
- source_word: רְאֹה פָנֶיךָ
  choice: ver o seu rosto
  rationale: Mantém a imagem concreta e afetiva do idioma hebraico, cujo sentido contextual é ver José pessoalmente.
- source_word: לֹא פִלָּלְתִּי
  choice: Eu não esperava
  rationale: Neste contexto, o verbo expressa expectativa ou suposição, não oração. O imperfeito português comunica naturalmente a expectativa que Israel não nutria.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva a mudança enfática e a expressão de surpresa do marcador hebraico, em linguagem digna e ainda compreensível.
- source_word: הֶרְאָה אֹתִי
  choice: me permitiu ver
  rationale: 'Expressa de modo natural o valor causativo do hifil de ראה: Deus fez com que Israel tivesse a oportunidade de ver.'
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Tradução direta do título divino usado no texto.
- source_word: גַּם
  choice: até
  rationale: 'Realça que a bênção ultrapassou a esperança de rever José: Israel pôde ver também a descendência dele.'
- source_word: זַרְעֶךָ
  choice: os seus descendentes
  rationale: Comunica o sentido coletivo de זרע em português corrente. No contexto imediato, refere-se aos filhos de José, mas “descendentes” evita estreitar indevidamente o termo.
theological_decisions:
- issue: Tradução de אֱלֹהִים na narrativa patriarcal
  choice: Deus
  alternative: o Deus
  rationale: O hebraico emprega o título divino comum sem artigo e atribui a Deus a concessão providencial; não é necessário acrescentar especificação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E eis que” preserva deliberadamente a surpresa enfática do hebraico; “seu” é inequívoco no contexto imediato, pois Israel fala diretamente a José.
