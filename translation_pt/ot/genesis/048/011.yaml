  source_fidelity: 'A tradução conserva adequadamente todos os elementos centrais do hebraico: o nome Israel, a expectativa frustrada de voltar a ver José, a expressão concreta “ver o seu rosto”, o marcador enfático “e eis que”, o valor causativo de “Deus me permitiu ver” e a intensificação de גַּם em “até”. “Os seus descendentes” representa de modo aceitável o coletivo זַרְעֶךָ, sem restringi-lo indevidamente apenas a filhos, embora o contexto imediato envolva os filhos de José.'
