  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: pt
  text: E agora, os seus dois filhos, que lhe nasceram na terra do Egito antes de eu chegar a você no Egito, são meus; Efraim e Manassés serão meus, como Rúben e Simeão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Efraim e Manassés serão contados como filhos do próprio Jacó, com condição comparável à de Rúben e Simeão. A expressão traduzida por “antes de eu chegar a você no Egito” também pode ser vertida mais formalmente como “até eu chegar a você no Egito”.
    reason: Nota cultural e alternativa lexical
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a ligação com o discurso anterior e introduz com ênfase a declaração de Jacó.
- source_word: שְׁנֵי בָנֶיךָ
  choice: os seus dois filhos
  rationale: Reproduz de modo natural o número e a relação possessiva expressos no hebraico.
- source_word: הַנּוֹלָדִים לְךָ
  choice: que nasceram a você
  rationale: Preserva a construção relacional do hebraico e deixa claro que se trata dos filhos gerados para José.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva o substantivo explícito אֶרֶץ, sem reduzi-lo simplesmente a 'no Egito'.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: antes de eu chegar até você no Egito
  rationale: No contexto, עַד delimita os filhos nascidos antes da chegada de Jacó; a formulação comunica com clareza essa força temporal, enquanto a nota registra a alternativa mais formal.
- source_word: לִי הֵם
  choice: são meus
  rationale: Expressa de forma concisa a reivindicação de Jacó sobre o status filial de Efraim e Manassés, sem acrescentar terminologia jurídica não presente no texto.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Efraim e Manassés
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: como Rúben e Simeão
  rationale: Traduz a comparação marcada por כ e indica que Efraim e Manassés terão condição comparável à dos filhos de Jacó.
- source_word: יִהְיוּ לִי
  choice: serão meus
  rationale: Mantém a declaração futura e solene do texto, em paralelo com a frase anterior 'são meus'.
theological_decisions:
- issue: Natureza da reivindicação de Jacó sobre Efraim e Manassés
  choice: Traduzir literalmente a reivindicação de pertencimento e explicitar em nota seu sentido de contagem entre os filhos de Jacó.
  alternative: Inserir no texto principal uma formulação técnica, como 'eu os adoto como meus filhos'.
  rationale: O hebraico comunica incorporação à linhagem e condição comparável à de Rúben e Simeão, mas não emprega um termo técnico para adoção. A tradução preserva a força da declaração sem definir além do que o texto diz.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de nomes tradicionais no português brasileiro. A repetição de “Egito” foi mantida porque ocorre explicitamente no hebraico. O pronome de tratamento “você” favorece clareza internacional com boa legibilidade brasileira.
