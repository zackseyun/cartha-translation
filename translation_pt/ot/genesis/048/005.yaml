  to: E agora, os seus dois filhos, que lhe nasceram na terra do Egito antes de eu chegar a você no Egito, são meus; Efraim e Manassés serão meus, como Rúben e Simeão.[a]
  rationale: A revisão limita-se a melhorar a idiomaticidade portuguesa e a completar a alternativa de tradução na nota, mantendo a sintaxe, a repetição de “Egito”, a ambiguidade controlada de עַד e o sentido de incorporação filial expresso pelo hebraico.
