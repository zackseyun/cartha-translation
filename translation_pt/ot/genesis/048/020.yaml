base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: pt
  text: 'Naquele dia, ele os abençoou, dizendo: “Por você[a], Israel abençoará, dizendo: ‘Que Deus faça você ser como Efraim e como Manassés!’” E colocou Efraim à frente de Manassés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em você” ou “por você”, no singular; isto é, Israel usará os nomes de Efraim e Manassés como fórmula de bênção.'
    reason: Preserva o singular hebraico e registra a amplitude lexical da preposição בְּ, sem resolver além do necessário o funcionamento proverbial da fórmula.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: ele os abençoou
  rationale: O piel de ברך significa normalmente “abençoar”; o sufixo plural se refere conjuntamente a Efraim e Manassés.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal idiomática que mantém a referência específica do hebraico.
- source_word: בְּךָ
  choice: por meio de vocês
  rationale: A preposição ב pode indicar meio ou referência. Embora o sufixo hebraico esteja no singular, a fórmula que segue nomeia Efraim e Manassés; o plural em português torna claro que os dois serviriam de modelo na bênção, sem ocultar a alternativa mais formal registrada em nota.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: Israel abençoará
  rationale: O imperfeito pode indicar ação futura ou costumeira. Mantém-se “Israel” sem explicitar se o foco recai sobre Jacó ou sobre o povo que dele descende.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Que Deus faça você ser
  rationale: No contexto de uma fórmula de bênção, a forma verbal expressa um desejo. “Faça você ser” comunica naturalmente o sentido idiomático de שׂים com o comparativo.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: como Efraim e como Manassés
  rationale: A repetição de “como” reproduz a repetição da preposição comparativa כ e preserva o ritmo da fórmula.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: E colocou Efraim à frente de Manassés
  rationale: A expressão indica tanto posição quanto precedência. A conjunção “E” reflete diretamente o ו narrativo.
theological_decisions:
- issue: Referente de “Israel” na fórmula de bênção
  choice: Israel
  alternative: Jacó; o povo de Israel
  rationale: O hebraico diz apenas “Israel”. Preservar o nome sem expansão mantém tanto a referência ancestral quanto a corporativa, sem resolver indevidamente a tensão.
- issue: Alcance de בְּךָ na fórmula
  choice: por meio de vocês
  alternative: em você; por você
  rationale: A fórmula invoca os nomes dos dois filhos como padrão de bênção. O texto principal prioriza clareza em português, enquanto a nota conserva o singular formal e a amplitude da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Manassés” segue a forma portuguesa corrente. A construção preserva a repetição solene da fórmula de bênção e a ambiguidade de “Israel”.
