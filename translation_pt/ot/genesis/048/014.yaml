base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: pt
  text: Então Israel estendeu a mão direita e a colocou sobre a cabeça de Efraim, embora este fosse o mais novo, e a mão esquerda sobre a cabeça de Manassés, cruzando as mãos[a], pois Manassés era o primogênito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: posicionando deliberadamente as mãos. A expressão hebraica pode destacar uma disposição intencional e hábil; o contexto indica que isso envolveu cruzá-las.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: estendeu
  rationale: No contexto do gesto de bênção, o verbo indica estender a mão, não enviá-la.
- source_word: וַיָּשֶׁת
  choice: colocou
  rationale: Expressa de modo natural e fiel o ato deliberado de pôr a mão sobre a cabeça.
- source_word: וְהוּא הַצָּעִיר
  choice: embora este fosse o mais novo
  rationale: 'A formulação concessiva explicita a força contextual: Efraim recebeu a mão direita apesar de ser o mais novo; “este” evita atribuir a oração a Israel.'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: cruzando as mãos
  rationale: A expressão hebraica é difícil, mas o contexto mostra que Israel posicionou intencionalmente a mão direita sobre Efraim e a esquerda sobre Manassés, o que implicava cruzá-las.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da disposição incomum das mãos.
- source_word: הַבְּכֹר
  choice: o primogênito
  rationale: Preserva a relevância cultural e narrativa da condição de primeiro filho, mais precisamente que uma simples indicação de maior idade.
theological_decisions:
- issue: Sentido de שִׂכֵּל אֶת יָדָיו
  choice: Israel cruzou intencionalmente as mãos ao abençoar os filhos.
  alternative: Israel posicionou ou dirigiu as mãos com habilidade e intenção, sem afirmar explicitamente que as cruzou.
  rationale: A posição descrita — mão direita sobre o mais novo e esquerda sobre o primogênito — favorece a ideia de mãos cruzadas. A nota preserva a amplitude lexical da expressão sem eliminar a inversão deliberada indicada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Este” esclarece que o mais novo era Efraim; “primogênito” conserva o peso cultural do hebraico.
