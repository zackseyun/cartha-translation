source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: pt
  text: Quando José viu que seu pai havia colocado a mão direita sobre a cabeça de Efraim, isso lhe desagradou[a]; então segurou a mão de seu pai para tirá-la de sobre a cabeça de Efraim e colocá-la sobre a cabeça de Manassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “isso foi mau aos seus olhos”, expressão hebraica que aqui significa “isso lhe desagradou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Quando José viu que
  rationale: A construção introduz a percepção de José e sua reação subsequente; “quando ... viu que” expressa naturalmente em português tanto a progressão narrativa quanto o conteúdo percebido.
- source_word: יָשִׁית
  choice: havia colocado
  rationale: O mais-que-perfeito composto deixa claro que a colocação da mão já havia ocorrido quando José a percebeu.
- source_word: יַד יְמִינוֹ
  choice: a mão direita
  rationale: Equivalente idiomático direto que preserva a relevância da mão usada no gesto de bênção.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: isso lhe desagradou
  rationale: Traduz de modo natural o sentido contextual da expressão hebraica, sem sugerir que José tenha considerado o gesto moralmente mau; a nota registra a imagem literal dos olhos.
- source_word: וַיִּתְמֹךְ
  choice: segurou
  rationale: Neste contexto, o verbo descreve José tomando fisicamente a mão do pai para redirecioná-la, sem exigir a ideia mais forte de agarrar com violência.
- source_word: לְהָסִיר אֹתָהּ
  choice: para tirá-la
  rationale: Expressa claramente a finalidade da ação e retoma “a mão” com o pronome feminino apropriado em português.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: de sobre a cabeça de Efraim e colocá-la sobre a cabeça de Manassés
  rationale: Explicita com naturalidade o movimento entre as duas cabeças. O segundo “colocá-la” é suprido pelo contexto para evitar a formulação pouco idiomática “tirá-la ... para a cabeça”.
