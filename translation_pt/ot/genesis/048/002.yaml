base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: pt
  text: 'E alguém informou a Jacó, dizendo: “Veja, seu filho José veio até você.” Israel se fortaleceu e sentou-se na cama.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: Então alguém informou a Jacó
  rationale: Os dois verbos introduzem um informe cujo agente não é identificado. Em português corrente, “alguém informou” preserva o sujeito indeterminado, enquanto os dois verbos hebraicos são reunidos numa fórmula natural de introdução ao discurso direto.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção do ouvinte; “Veja” conserva essa função em linguagem moderna, sem o tom arcaico de “Eis”.
- source_word: בִּנְךָ יוֹסֵף
  choice: seu filho José
  rationale: Tradução direta da expressão possessiva e do nome próprio.
- source_word: בָּא אֵלֶיךָ
  choice: veio até você
  rationale: O qatal de בוא apresenta a chegada como realizada e relevante naquele momento. “Veio até você” mantém o sentido espacial sem acrescentar uma finalidade como “veio vê-lo”.
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: O hitpael de חזק expressa que Israel reuniu ou recobrou forças. “Se fortaleceu” conserva a forma reflexiva e permanece claro no contexto da enfermidade.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a mudança deliberada de “Jacó” para “Israel” presente no hebraico.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: sentou-se na cama
  rationale: Tradução natural da ação de sentar-se sobre a cama; o contexto deixa claro que ele estava deitado ou reclinado.
theological_decisions:
- issue: Alternância entre os nomes Jacó e Israel
  choice: Preservar “Jacó” no início e “Israel” na segunda oração
  alternative: Uniformizar o nome como “Jacó” em todo o versículo
  rationale: A alternância pertence ao texto hebraico e pode ter função literária ou teológica; uniformizá-la eliminaria uma distinção genuína sem justificativa textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita arcaísmos e não explicita além do texto a identidade do mensageiro nem a finalidade da vinda de José.
