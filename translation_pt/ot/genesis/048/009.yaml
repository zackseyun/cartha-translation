  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: pt
  text: 'José disse a seu pai: “Eles são meus filhos, que Deus me deu aqui[a].” Seu pai disse: “Por favor, traga-os a mim[b], para que eu os abençoe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “neste lugar”. A expressão hebraica pode apontar mais especificamente para o lugar onde José estava.
    reason: lexical_alternative
  - marker: b
    text: Ou “Traga-os a mim, por favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: José disse a seu pai
  rationale: Emprega a forma narrativa natural em português, preservando o vínculo familiar e sem atribuir ao waw consecutivo uma nuance temporal mais específica do que o contexto exige.
- source_word: בָּנַי הֵם
  choice: Eles são meus filhos
  rationale: Mantém o masculino plural específico de בָּנַי e reproduz com naturalidade a identificação predicativa hebraica.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: que Deus me deu
  rationale: Expressa de modo direto a dádiva atribuída a Deus; o pretérito perfeito é natural em português e conserva o resultado presente indicado pelo contexto.
- source_word: בָּזֶה
  choice: aqui
  rationale: Traduz a força dêitica da expressão no contexto da localização de José, provavelmente o Egito, sem tornar a referência mais específica do que o hebraico.
- source_word: קָחֶם נָא אֵלַי
  choice: Por favor, traga-os para perto de mim
  rationale: נָא é representado pela fórmula cortês “por favor”; embora לקח costume significar “tomar”, o movimento pedido é em direção ao falante, de modo que “traga-os” é idiomático e “para perto de mim” explicita אֵלַי no contexto da bênção.
- source_word: וַאֲבָרֲכֵם
  choice: para que eu os abençoe
  rationale: Representa naturalmente em português o propósito ou resultado pretendido após o pedido, preservando a relação entre aproximar os filhos e abençoá-los.
theological_decisions:
- issue: Referência de אֱלֹהִים na fala de José
  choice: Deus, no singular, como aquele que deu os filhos a José
  alternative: um deus ou deuses
  rationale: O contexto patriarcal e a fala de José apontam claramente para o Deus de Israel; a tradução não acrescenta uma especificação doutrinária além do sentido contextual.
- issue: Força da oração וַאֲבָרֲכֵם
  choice: 'propósito: “para que eu os abençoe”'
  alternative: 'resultado ou futuro coordenado: “e eu os abençoarei”'
  rationale: A forma verbal depois do pedido admite uma expressão de propósito; a tradução conserva a intenção de Jacó sem excluir completamente a consequência futura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Filhos” preserva a referência masculina; “a seu pai” mantém o tom narrativo sem coloquialismo. Os marcadores de nota foram posicionados junto às expressões às quais efetivamente se referem.
