  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: pt
  text: Então José os tirou de junto dos joelhos de Jacó[a] e se curvou com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de entre os joelhos de Jacó”. A expressão hebraica pode descrever a posição muito próxima dos meninos junto a Jacó durante a bênção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: tirou
  rationale: 'O hifil de יצא tem sentido causativo: José fez os filhos saírem da posição que ocupavam junto a Jacó. “Tirou” expressa isso de modo natural e sem especificar além do texto.'
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto referente a Efraim e Manassés.
- source_word: מֵעִם בִּרְכָּיו
  choice: de junto dos joelhos de Jacó
  rationale: מֵעִם indica afastamento de uma posição junto ou perto de alguém ou algo. A expressão situa os meninos muito próximos dos joelhos de Jacó; explicitar “de Jacó” evita uma ambiguidade pronominal pouco natural em português, enquanto a nota preserva a alternativa espacial “entre”.
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou
  rationale: A forma de שׁחה descreve uma inclinação profunda em sinal de reverência. “Se curvou”, completado por “com o rosto em terra”, comunica a postura sem redundância.
- source_word: לְאַפָּיו אָרְצָה
  choice: com o rosto em terra
  rationale: A combinação idiomática indica que o rosto foi dirigido ao chão. Esta formulação é corrente, digna e preserva a intensidade da reverência.
theological_decisions:
- issue: Referente do sufixo em בִּרְכָּיו (“seus joelhos”)
  choice: Jacó
  alternative: José
  rationale: Pelo contexto, José afasta os filhos da posição próxima a Jacó antes de se curvar; assim, o referente mais natural é Jacó. Trata-se de uma decisão contextual, não doutrinária.
- issue: Profundidade do gesto de וַיִּשְׁתַּחוּ
  choice: se curvou com o rosto em terra
  alternative: se prostrou
  rationale: A frase hebraica descreve reverência profunda. A tradução mantém a postura explícita sem atribuir ao gesto um sentido cultual que o contexto não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Em terra” conserva uma cadência bíblica ainda corrente; o nome “Jacó” explicita o referente contextual do pronome hebraico.
