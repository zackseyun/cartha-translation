base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: pt
  text: Quanto a mim, quando eu vinha de Padã[a], Raquel morreu ao meu lado[b], na terra de Canaã, no caminho, quando ainda faltava certa distância[c] para chegar a Efrata. Eu a sepultei ali, na estrada para Efrata, isto é, Belém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz apenas “Padã”. Em passagens relacionadas aparece a forma mais longa “Padã-Arã”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “morreu sobre mim”. A expressão pode destacar tanto a proximidade de Raquel a Jacó ao morrer quanto o peso pessoal da morte dela para ele.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica indica que ainda restava um trecho de terra; a distância exata é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: O pronome independente, precedido pela conjunção, introduz uma lembrança pessoal com valor tópico e enfático.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: quando eu vinha de Padã
  rationale: A construção infinitiva tem valor temporal. “Vinha de” expressa naturalmente o percurso de retorno sem ampliar Padã para Padã-Arã, forma que não consta neste versículo.
- source_word: מֵתָה עָלַי
  choice: morreu junto a mim
  rationale: A expressão hebraica é literalmente “morreu sobre mim” e pode envolver proximidade pessoal e o peso da perda. A tradução mantém o aspecto relacional sem reduzir a expressão apenas à tristeza; a ambiguidade é registrada em nota.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: na terra de Canaã
  rationale: Preserva a formulação geográfica completa do hebraico.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Equivalente direto e natural no contexto de viagem.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: quando ainda faltava certa distância para chegar a Efrata
  rationale: כִּבְרַת אֶרֶץ designa um trecho de terra ou uma distância restante cuja medida exata é incerta; “certa distância” evita falsa precisão.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: Eu a sepultei ali
  rationale: Reproduz com clareza a sequência narrativa e mantém a referência locativa.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: no caminho de Efrata
  rationale: Mantém a construção concisa, entendida como o caminho que levava a Efrata.
- source_word: הִוא בֵּית לָחֶם
  choice: isto é, Belém
  rationale: Apresenta naturalmente a identificação explicativa de Efrata com Belém.
theological_decisions:
- issue: Sentido de מֵתָה עָלַי
  choice: morreu junto a mim, com nota explicativa
  alternative: morreu para minha tristeza
  rationale: O hebraico admite uma dimensão de proximidade e também de perda pessoal. A redação escolhida não fixa a expressão exclusivamente como emoção, preservando sua tensão sem introduzir uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A sintaxe conserva o caráter pessoal e memorial da fala de Jacó, sem harmonizar o topônimo nem eliminar a ambiguidade do idioma hebraico.
