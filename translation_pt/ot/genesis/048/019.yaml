base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: pt
  text: 'Mas seu pai recusou e disse: “Eu sei, meu filho, eu sei. Ele também se tornará um povo e também se tornará grande. Contudo, seu irmão mais novo se tornará maior do que ele, e sua descendência será a plenitude das nações[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma multidão de nações”. Mais literalmente, o hebraico diz “a plenitude das nações”.
    reason: Alternativa lexical para a expressão incomum מְלֹא הַגּוֹיִם, cuja força pode ser entendida em sentido quantitativo.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: recusou
  rationale: O verbo מאן expressa recusa deliberada, não simples hesitação; no contexto, Jacó rejeita a tentativa de José de trocar a posição das mãos.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Eu sei, meu filho, eu sei
  rationale: Preserva a repetição enfática do hebraico em português natural, sem acrescentar um objeto não expresso.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Ele também se tornará um povo
  rationale: “Povo” representa diretamente עָם e mantém seu sentido coletivo; “se tornará” comunica o desenvolvimento futuro indicado pelo contexto.
- source_word: וְגַם הוּא יִגְדָּל
  choice: e também se tornará grande
  rationale: גדל descreve aqui o alcance futuro de grandeza ou proeminência; a formulação preserva o paralelismo.
- source_word: וְאוּלָם
  choice: Contudo
  rationale: Marca com clareza o forte contraste entre a futura grandeza de Manassés e a superioridade de Efraim.
- source_word: אָחִיו הַקָּטֹן
  choice: seu irmão mais novo
  rationale: הַקָּטֹן indica aqui a posição relativa na ordem de nascimento, não tamanho físico.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: se tornará maior do que ele
  rationale: A construção comparativa com מן indica que o irmão mais novo alcançará grandeza superior.
- source_word: וְזַרְעוֹ
  choice: e sua descendência
  rationale: “Descendência” traduz de modo natural o coletivo singular זרע, sem o tom arcaico ou a possível ambiguidade de “semente”.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: será a plenitude das nações
  rationale: Mantém o substantivo מְלֹא (“plenitude”) e o artigo de הַגּוֹיִם, preservando a formulação incomum e sua possível amplitude sem reduzi-la a uma interpretação única.
theological_decisions:
- issue: Sentido de מְלֹא הַגּוֹיִם
  choice: a plenitude das nações
  alternative: uma multidão de nações
  rationale: A expressão hebraica é incomum e pode sugerir número, extensão ou plenitude. O texto principal conserva sua forma lexical e sua possível ressonância teológica; a nota oferece a leitura quantitativa sem impô-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática e o contraste do original foram preservados. O marcador da nota foi colocado junto à expressão que ele explica.
