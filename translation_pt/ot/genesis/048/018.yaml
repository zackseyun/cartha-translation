  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: pt
  text: 'José disse a seu pai: “Não é assim, meu pai, pois este é o primogênito. Ponha a sua mão direita sobre a cabeça dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol dá continuidade à narrativa; em português, o encadeamento fica natural sem a necessidade de explicitar a conjunção.
- source_word: אֶל אָבִיו
  choice: a seu pai
  rationale: Representa de modo direto a preposição אֶל e o sufixo de terceira pessoa, em registro narrativo digno e corrente.
- source_word: לֹא כֵן
  choice: Não assim
  rationale: Preserva a forma breve de correção respeitosa, sem torná-la tão brusca quanto um simples “Não” nem expandir indevidamente o sentido.
- source_word: אָבִי
  choice: meu pai
  rationale: Explicita o sufixo de primeira pessoa e mantém a deferência de José ao dirigir-se ao pai.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão apresentada por José para corrigir a posição da mão.
- source_word: זֶה
  choice: este
  rationale: Conserva a força dêitica do demonstrativo, adequada à indicação física de um dos filhos.
- source_word: הַבְּכֹר
  choice: o primogênito
  rationale: Mantém o termo familiar e de status ligado à ordem de nascimento e ao contexto da bênção.
- source_word: שִׂים
  choice: Ponha
  rationale: Verbo imperativo natural no português moderno; a forma de tratamento harmoniza com “seu pai” e com o tom respeitoso.
- source_word: יְמִינְךָ
  choice: a sua mão direita
  rationale: Explicita corretamente que יָמִין designa aqui a mão direita, relevante para o gesto de bênção.
- source_word: עַל רֹאשׁוֹ
  choice: sobre a cabeça dele
  rationale: Expressa com clareza a colocação física da mão e evita possível ambiguidade referencial de “sua cabeça”.
theological_decisions:
- issue: Termo de status no contexto da bênção
  choice: o primogênito
  alternative: o mais velho
  rationale: “Primogênito” preserva tanto a ordem de nascimento quanto a relevância familiar e jurídica ligada à bênção, sem reduzir o termo apenas à idade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala conserva a correção direta, porém respeitosa, de José. Não foram necessárias notas de rodapé.
