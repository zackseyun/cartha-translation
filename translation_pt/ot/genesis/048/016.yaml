  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: pt
  text: o anjo que me resgatou de todo mal[a] abençoe os rapazes; que o meu nome e o nome de meus pais, Abraão e Isaque, sejam invocados sobre eles[b]; e que eles se multipliquem grandemente[c] no meio da terra[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de todo dano” ou “de toda aflição”. O termo hebraico traduzido por “mal” também pode indicar calamidade ou adversidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que o meu nome e o nome de meus pais, Abraão e Isaque, sejam chamados sobre eles”. A expressão indica que os rapazes seriam identificados com a linhagem e a herança da família.
    reason: lexical_alternative
  - marker: c
    text: Ou “que cresçam até se tornarem uma multidão”. O verbo hebraico é raro e sugere aumento abundante, possivelmente evocando a multiplicação dos peixes.
    reason: lexical_alternative
  - marker: d
    text: Ou “no meio do país”. O termo hebraico pode significar “terra”, “país” ou “território”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o Anjo
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”. Neste contexto patriarcal, “Anjo” é a forma mais natural e tradicional, sem definir além do texto a identidade desse ser.
- source_word: הַגֹּאֵל אֹתִי
  choice: que me resgatou
  rationale: O particípio de גאל descreve aquele que age como resgatador ou redentor. O pretérito comunica naturalmente a retrospectiva de Jacó sobre a proteção recebida ao longo da vida.
- source_word: מִכָּל רָע
  choice: de todo mal
  rationale: רָע abrange tanto mal moral quanto desgraça, dano ou adversidade. “Todo mal” conserva essa amplitude sem restringir o sentido.
- source_word: יְבָרֵךְ
  choice: abençoe
  rationale: O yiqtol tem força volitiva no contexto da bênção; o presente do subjuntivo expressa isso de modo idiomático em português.
- source_word: הַנְּעָרִים
  choice: estes rapazes
  rationale: Refere-se concretamente a Efraim e Manassés. “Rapazes” é atual e respeitoso; o demonstrativo torna natural a referência aos dois jovens presentes.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: que o meu nome e o nome de meus pais [...] sejam perpetuados neles
  rationale: A expressão hebraica é literalmente “sejam chamados sobre/neles”. “Sejam perpetuados neles” comunica a continuidade da identidade, linhagem e herança associada aos nomes, enquanto a forma literal é preservada em nota.
- source_word: וְשֵׁם אֲבֹתַי אַבְרָהָם וְיִצְחָק
  choice: o nome de meus pais, Abraão e Isaque
  rationale: Mantém o singular coletivo שֵׁם e usa “pais” no sentido bíblico amplo de antepassados, explicitados como Abraão e Isaque.
- source_word: וְיִדְגּוּ לָרֹב
  choice: que eles se multipliquem grandemente
  rationale: O raro verbo דגה evoca aumento prolífico, possivelmente associado a peixes. A formulação escolhida transmite o sentido com clareza, e a imagem lexical fica registrada em nota.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: אֶרֶץ pode significar “terra” em sentido amplo ou “país/território”. “Terra” preserva a ambiguidade contextual melhor do que uma escolha mais restritiva.
theological_decisions:
- issue: Identidade do “Anjo” na bênção de Jacó
  choice: Manter “o Anjo” sem identificar sua natureza ou identidade.
  alternative: Entendê-lo como manifestação de Deus ou como mensageiro criado que atua em nome de Deus.
  rationale: O versículo associa estreitamente o Anjo à ação divina, mas não define explicitamente sua identidade ontológica. A tradução preserva essa tensão sem impor uma conclusão cristológica ou angelológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha o caráter solene de uma bênção sem recorrer a formas arcaicas. “Isaque” segue o uso bíblico corrente no português brasileiro; “meus pais” conserva o uso genealógico amplo do hebraico.
