base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: pt
  text: 'E ele me disse: “Eis que farei você frutificar e se multiplicar; farei de você uma assembleia de povos e darei esta terra à sua descendência depois de você, como propriedade perpétua.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva o marcador enfático e apresentativo do hebraico em registro bíblico digno, sem acrescentar conteúdo.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: farei você frutificar e se multiplicar
  rationale: Mantém os dois verbos e a imagem de fecundidade e aumento, com formulação natural em português.
- source_word: קְהַל עַמִּים
  choice: comunidade de povos
  rationale: Representa קהל como coletividade reunida e conserva o plural 'povos', sem restringi-lo a uma única nação.
- source_word: זַרְעֲךָ
  choice: sua descendência
  rationale: Expressa o sentido coletivo de 'semente' neste contexto de promessa geracional.
- source_word: אֲחֻזַּת עוֹלָם
  choice: propriedade perpétua
  rationale: Comunica uma posse duradoura e reconhecida; 'perpétua' preserva a força temporal de עוֹלָם.
theological_decisions:
- issue: Duração da posse prometida
  choice: propriedade perpétua
  alternative: propriedade para sempre
  rationale: A tradução mantém a força de עוֹלָם sem explicar antecipadamente como a promessa deve ser integrada a construções teológicas posteriores.
- issue: Identidade da coletividade prometida
  choice: comunidade de povos
  alternative: assembleia de povos
  rationale: Conserva a pluralidade do hebraico e evita identificar explicitamente a expressão com uma instituição religiosa ou política específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de 'você' preserva os referentes singulares do hebraico; a estrutura paralela da promessa foi mantida.
