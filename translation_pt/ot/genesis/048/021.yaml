id: GEN.48.21
reference: Genesis 48:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: pt
  text: 'Então Israel disse a José: “Eis que estou para morrer, mas[a] Deus estará com vocês[b] e fará com que voltem à terra de seus pais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “e”. A conjunção hebraica é simplesmente “e”, mas aqui provavelmente expressa contraste: Israel morrerá, porém Deus continuará com eles.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, tanto “com vocês” como a expressão traduzida por “fará com que voltem” estão no plural; assim, a promessa se estende além de José individualmente à sua família ou aos seus descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português moderno.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o nome usado no texto hebraico, sem harmonizá-lo com “Jacó”.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e combina clareza com um registro digno.
- source_word: אָנֹכִי מֵת
  choice: estou para morrer
  rationale: A construção participial indica morte iminente, não morte já consumada.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: mas Deus estará com vocês
  rationale: Embora וְ seja formalmente “e”, o contexto favorece valor contrastivo entre a morte de Israel e a presença contínua de Deus.
- source_word: עִמָּכֶם
  choice: com vocês
  rationale: O sufixo hebraico é plural; “vocês” torna esse número explícito em português.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: e fará com que voltem
  rationale: 'O hifil de שׁוּב tem sentido causativo: Deus fará que eles retornem. A formulação é natural e preserva o plural.'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: à terra de seus pais
  rationale: Segue de perto a expressão hebraica e aponta para a terra ancestral dos patriarcas.
theological_decisions:
- issue: Referente dos pronomes plurais na promessa
  choice: Explicitar o plural com “vocês” e mantê-lo em “voltem”
  alternative: Tratar a fala como dirigida somente a José no singular
  rationale: Os sufixos hebraicos são plurais, estendendo a promessa além de José individualmente, sem definir de modo mais estreito se o referente é sua família, seus descendentes ou o grupo representado por ele.
- issue: Valor discursivo de וְ antes de “Deus estará com vocês”
  choice: mas
  alternative: e
  rationale: 'O conectivo hebraico é literalmente “e”, mas neste contexto provavelmente introduz contraste: Israel morrerá, porém Deus continuará com eles. A nota preserva a alternativa formal.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva solenidade sem arcaísmo excessivo; “vocês” explicita naturalmente o plural do hebraico.
