  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: pt
  text: Os olhos de Israel estavam enfraquecidos pela velhice[a], e ele não conseguia enxergar. Então José aproximou os dois de Israel[b], e Israel os beijou e abraçou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Os olhos de Israel estavam pesados por causa da velhice”. A expressão indica que sua visão havia enfraquecido.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “ele os aproximou dele”. Pelo contexto, José aproximou os filhos de Israel; em seguida, Israel os beijou e abraçou.'
    reason: referent_clarification
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Os olhos de Israel
  rationale: Mantém o nome pessoal usado no texto hebraico e verte naturalmente a cadeia construta.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: estavam enfraquecidos pela velhice
  rationale: O hebraico diz literalmente que os olhos estavam “pesados por causa da velhice”; no contexto, a expressão descreve a visão debilitada. A formulação escolhida comunica o sentido sem sugerir apenas uma sensação física de peso.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: ele não conseguia enxergar
  rationale: Expressa em português corrente a incapacidade visual indicada pelo verbo e seu infinitivo.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Então José aproximou os dois de Israel
  rationale: O verbo no hifil significa “fazer chegar perto” ou “aproximar”. Os referentes são explicitados para evitar que o português atribua a Israel, que não enxergava, a ação de levar os rapazes até si. O contexto anterior identifica José como quem os aproxima, embora o hebraico deste versículo deixe o sujeito pronominal implícito.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: e Israel os beijou e abraçou
  rationale: A repetição de “Israel” esclarece a mudança de agente depois da ação de José. “Abraçou” preserva o tom afetuoso e digno da narrativa.
