base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: pt
  text: 'E Jacó disse a José: “Deus Todo-Poderoso[a] me apareceu em Luz, na terra de Canaã, e me abençoou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “El Shaddai”. Tradicionalmente traduzido como “Deus Todo-Poderoso”; o sentido exato de Shaddai é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Preserva a progressão narrativa marcada pelo waw consecutivo e soa natural em português bíblico moderno.
- source_word: אֶל
  choice: a
  rationale: 'É a preposição direcional normal com o verbo dizer: “disse a José”.'
- source_word: אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  rationale: Traduz o título divino por sua forma tradicional e amplamente compreensível em português, enquanto a nota preserva a incerteza quanto ao sentido exato de Shaddai.
- source_word: נִרְאָה
  choice: apareceu
  rationale: Expressa naturalmente a manifestação visível indicada pelo nifal de ראה, sem acrescentar uma formulação reflexiva ausente do hebraico.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com sufixo de primeira pessoa e mantém um registro digno e natural.
- source_word: בְּלוּז
  choice: em Luz
  rationale: A preposição “em” é a forma natural em português para indicar o local onde ocorreu a aparição.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Conserva o substantivo explícito “terra” e a especificidade geográfica do hebraico.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: e me abençoou
  rationale: Mantém Deus como sujeito implícito e reproduz de modo idiomático o objeto de primeira pessoa.
theological_decisions:
- issue: Tradução do título divino אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  alternative: El Shaddai; Deus Poderoso
  rationale: A forma tradicional comunica com clareza que se trata de um título divino. Como a nuance etimológica e lexical de שַׁדַּי permanece debatida, “El Shaddai” é registrado em nota, sem apresentar uma interpretação incerta como definitiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a coordenação da narrativa hebraica foram preservadas sem rigidez artificial.
