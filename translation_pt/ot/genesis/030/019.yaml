  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: pt
  text: Leia engravidou novamente e deu a Jacó um sexto filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: engravidou
  rationale: O qal narrativo de הרה indica que Leia ficou grávida; “engravidou” é direto, natural e claro em português atual.
- source_word: עוֹד
  choice: novamente
  rationale: 'Neste contexto narrativo, o advérbio assinala repetição: Leia engravidou mais uma vez.'
- source_word: וַתֵּלֶד
  choice: deu ... um ... filho
  rationale: O verbo ילד significa dar à luz. A construção “deu a Jacó um sexto filho” expressa de modo natural tanto o nascimento quanto a relação marcada por לְ.
- source_word: בֵּן
  choice: filho
  rationale: É o equivalente português direto e idiomático do substantivo hebraico.
- source_word: שִׁשִּׁי
  choice: sexto
  rationale: O ordinal modifica “filho” e indica que este foi o sexto filho que Leia deu a Jacó.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ marca aqui a relação com Jacó na expressão de dar-lhe um filho; “deu a Jacó” preserva essa relação com fluência.
