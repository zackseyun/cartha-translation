  register: Português moderno, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. “Engravidou novamente” mantém a sequência narrativa, e “deu a Jacó um sexto filho” preserva de forma idiomática a relação expressa no hebraico.
