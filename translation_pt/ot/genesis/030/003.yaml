  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: pt
  text: 'Então ela disse: “Aqui está minha serva Bila. Deite-se com ela, para que ela dê à luz sobre os meus joelhos[a], e eu também seja edificada por meio dela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dê à luz sobre os meus joelhos”. A expressão provavelmente se refere a um costume pelo qual a esposa recebia simbolicamente como seu o filho nascido de sua serva.
    reason: cultural_note
  - marker: b
    text: 'Ou: “e eu também obtenha filhos por meio dela”. O hebraico diz literalmente “seja edificada”, empregando uma metáfora de formação de família e descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: minha serva
  rationale: אמה designa uma serva ou escrava. “Minha serva” é claro e natural em português moderno, preservando sua posição social subordinada sem recorrer a uma formulação arcaica.
- source_word: בֹּא אֵלֶיהָ
  choice: Una-se a ela
  rationale: O hebraico traz um eufemismo convencional para relações sexuais. “Una-se a ela” comunica o sentido com dignidade e mantém algum caráter eufemístico, sem a estranheza do literal “entre a ela”.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: para que dê à luz sobre os meus joelhos
  rationale: A tradução conserva a expressão culturalmente marcada “sobre os meus joelhos”, provavelmente ligada ao reconhecimento simbólico da criança como filha de Raquel; a nota esclarece sem substituir a imagem do texto.
- source_word: וְאִבָּנֶה
  choice: eu seja edificada
  rationale: O nifal de בנה significa literalmente “ser edificada/construída” e, no contexto, forma uma metáfora de constituição familiar por meio de descendência. “Seja edificada” preserva essa imagem incomum.
- source_word: מִמֶּנָּה
  choice: por meio dela
  rationale: A preposição apresenta Bila como o meio pelo qual Raquel espera constituir família e obter descendência. “Por meio dela” expressa essa instrumentalidade com clareza.
- source_word: גַם אָנֹכִי
  choice: também eu
  rationale: Preserva a ênfase explícita em Raquel, que espera participar do resultado apesar de sua esterilidade.
theological_decisions:
- issue: Relação entre o parto de Bila e a maternidade social de Raquel
  choice: Preservar a imagem hebraica “sobre os meus joelhos” no texto e explicar sua provável função cultural em nota.
  alternative: Explicitar no texto que Raquel receberia a criança como sua.
  rationale: A expressão pode aludir a uma prática de reconhecimento familiar, mas o texto não descreve o rito em detalhes. A tradução evita transformar uma inferência cultural plausível em afirmação inequívoca.
- issue: Metáfora de בנה aplicada à obtenção de descendência
  choice: Traduzir literalmente “seja edificada”, com esclarecimento em nota.
  alternative: Traduzir diretamente “tenha filhos” ou “forme uma família”.
  rationale: A formulação literal conserva o jogo metafórico e a tensão do hebraico, enquanto a nota fornece o sentido contextual sem apagar a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Una-se a ela” mantém o eufemismo sexual sem reproduzir literalmente uma regência hebraica pouco natural. As imagens “sobre os meus joelhos” e “seja edificada” foram mantidas por transparência ao texto-fonte e explicadas em notas.
