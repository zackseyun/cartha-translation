  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: pt
  text: E, sempre que os animais mais fortes do rebanho estavam no cio[a], Jacó punha as varas diante dos olhos do rebanho, nos bebedouros[b], para que acasalassem junto às varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os animais mais robustos» ou «mais vigorosos»; o termo hebraico se refere aos animais mais resistentes, em contraste com os fracos no versículo seguinte.
    reason: lexical_alternative
  - marker: b
    text: Ou «nos cochos» ou «nos canais»; o termo hebraico se refere aos lugares onde os animais iam beber.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: E, sempre que
  rationale: A construção introduz uma circunstância habitual e repetida; «sempre que» expressa naturalmente esse valor iterativo.
- source_word: יַחֵם
  choice: estavam no cio
  rationale: O verbo se refere ao cio ou impulso reprodutivo dos animais. A formulação é precisa e corrente no contexto de criação animal.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: O termo coletivo pode abranger ovelhas e cabras; «rebanho» evita restringi-lo a uma única espécie.
- source_word: הַמְקֻשָּׁרוֹת
  choice: os animais mais fortes
  rationale: No contexto, o termo contrasta com os animais fracos do versículo seguinte e designa os mais robustos ou vigorosos.
- source_word: וְשָׂם
  choice: Jacó punha
  rationale: O imperfeito habitual em português comunica a ação costumeira e repetida no contexto narrativo.
- source_word: הַמַּקְלוֹת
  choice: as varas
  rationale: Designa os galhos ou bastões descascados usados por Jacó; «varas» mantém a continuidade com o contexto e é natural em português.
- source_word: לְעֵינֵי הַצֹּאן
  choice: diante dos olhos do rebanho
  rationale: Preserva a ênfase visual e a expressão concreta do hebraico sem prejudicar a compreensão.
- source_word: בָּרֳהָטִים
  choice: nos bebedouros
  rationale: Refere-se aos cochos, canais ou lugares onde os animais bebiam; «bebedouros» comunica claramente sua função.
- source_word: לְיַחְמֶנָּה
  choice: para que acasalassem
  rationale: O לְ marca finalidade, e a forma plural retoma coletivamente os animais do rebanho. A tradução expressa o propósito de Jacó sem afirmar que as varas causavam o acasalamento.
- source_word: בַּמַּקְלוֹת
  choice: junto às varas
  rationale: A preposição descreve a circunstância ou localização do acasalamento com as varas ali colocadas; «junto às» é natural e não atribui instrumentalidade indevida às varas.
