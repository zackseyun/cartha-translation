  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: pt
  text: 'Então Raquel disse: “Em lutas de Deus[a], lutei com minha irmã e também prevaleci.” E ela lhe deu o nome de Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em lutas de Deus, lutei”. A expressão também pode significar “em lutas divinas” ou, como intensificador, “em lutas poderosas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: em lutas de Deus
  rationale: Mantém a forma incomum e a ambiguidade da construção hebraica, além de preservar a ligação verbal com o nome Naftali. A possibilidade de אֱלֹהִים funcionar como intensificador é registrada em nota.
- source_word: נִפְתַּלְתִּי
  choice: lutei
  rationale: Reproduz a imagem de combate e ajuda a conservar em português o jogo de palavras entre o verbo hebraico e Naftali.
- source_word: עִם אֲחֹתִי
  choice: com minha irmã
  rationale: Traduz diretamente a preposição עִם; neste contexto competitivo, a ideia de oposição já é comunicada pelo verbo “lutei”.
- source_word: גַּם יָכֹלְתִּי
  choice: e também prevaleci
  rationale: Expressa êxito ou superação na rivalidade, sentido contextual de יכל, sem reduzi-lo ao sentido mais genérico de capacidade.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: E deu ao menino o nome de Naftali
  rationale: Emprega uma fórmula de nomeação natural em português e mantém explícito o nome relacionado à declaração de Raquel.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Segue a transliteração portuguesa corrente e conserva, tanto quanto possível, a relação sonora com o campo verbal de נפתל.
theological_decisions:
- issue: Sentido de אֱלֹהִים na expressão נַפְתּוּלֵי אֱלֹהִים
  choice: 'Conservar no texto a referência formal a Deus: “lutas de Deus”'
  alternative: Entender אֱלֹהִים como intensificador e traduzir “lutas tremendas” ou “lutas poderosas”
  rationale: A expressão hebraica é difícil e admite tanto uma leitura diretamente relacionada a Deus quanto uma leitura intensiva. O texto principal preserva a tensão, e a nota apresenta a alternativa idiomática sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “lutas... lutei” é deliberada para refletir o jogo de palavras hebraico associado ao nome Naftali; a formulação incomum “lutas de Deus” foi mantida por fidelidade à ambiguidade do original.
