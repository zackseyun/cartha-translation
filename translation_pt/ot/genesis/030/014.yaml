base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: pt
  text: 'Nos dias da colheita do trigo, Rúben foi e encontrou mandrágoras[a] no campo. Ele as levou a Lia, sua mãe. Então Raquel disse a Lia: “Por favor, dê-me algumas das mandrágoras de seu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “maçãs-do-amor”. O hebraico דּוּדָאִים refere-se a uma planta tradicionalmente identificada como mandrágora e associada à fertilidade no contexto desta narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Nos dias da colheita do trigo
  rationale: Preserva a expressão temporal hebraica e especifica naturalmente a época da colheita do trigo.
- source_word: וַיֵּלֶךְ
  choice: saiu
  rationale: Embora o verbo signifique literalmente «foi», no contexto narrativo «saiu» comunica com naturalidade o movimento de Rúben até o campo, sem acrescentar um destino não expresso.
- source_word: דּוּדָאִים
  choice: mandrágoras
  rationale: É a identificação tradicional e mais reconhecida da planta; como a identificação botânica não é totalmente segura, registra-se uma alternativa em nota.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta e contextual de שָׂדֶה.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: Ele as levou a Lia, sua mãe
  rationale: O hifil de בוא indica fazer chegar ou levar; a formulação portuguesa mantém claro que Lia é a mãe de Rúben.
- source_word: תְּנִי נָא לִי
  choice: Por favor, dê-me
  rationale: A forma imperativa traduz תְּנִי, enquanto «por favor» representa a partícula de súplica ou cortesia נָא.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: algumas das mandrágoras de seu filho
  rationale: O מִן é partitivo e se expressa naturalmente por «algumas das»; o sufixo feminino singular identifica o filho de Lia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das frases foi levemente ajustada para fluência, sem eliminar a repetição narrativa nem explicitar como fato a associação tradicional da planta com a fertilidade.
