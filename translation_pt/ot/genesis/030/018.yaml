base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: pt
  text: 'E Lia disse: “Deus me deu a minha recompensa[a], porque dei a minha serva ao meu marido.” Então ela lhe deu o nome de Issacar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o nome Issacar soa como a palavra traduzida por “recompensa” ou “pagamento”, refletindo a explicação de Lia.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Deus me deu
  rationale: O perfeito hebraico descreve uma ação concluída cujo resultado Lia reconhece no presente; o pretérito perfeito é a forma mais natural em português.
- source_word: שְׂכָרִי
  choice: a minha recompensa
  rationale: שָׂכָר pode significar salário, pagamento ou recompensa. Aqui, “recompensa” soa natural na explicação de Lia e mantém a ligação semântica com o nome Issacar, esclarecida na nota.
- source_word: אֲשֶׁר
  choice: porque
  rationale: Neste contexto, a partícula relativa introduz a razão apresentada por Lia; “porque” comunica claramente essa força causal.
- source_word: נָתַתִּי שִׁפְחָתִי
  choice: dei a minha serva
  rationale: A tradução preserva tanto a ação anterior de Lia como a condição subordinada da mulher designada por שִׁפְחָה, sem acrescentar uma idade não indicada pelo texto.
- source_word: לְאִישִׁי
  choice: ao meu marido
  rationale: Embora אִישׁ também possa significar “homem”, a relação conjugal com Jacó determina aqui o sentido “marido”.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Por isso, deu ao menino o nome de
  rationale: A expressão hebraica é uma fórmula de nomeação. “Por isso” explicita naturalmente a conexão narrativa com a declaração de Lia, e “ao menino” torna claro o referente pronominal em português.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico; sua associação sonora com שָׂכָר é explicada em nota.
theological_decisions:
- issue: A interpretação de Lia sobre a ação divina e sua recompensa
  choice: Apresentar diretamente a afirmação de Lia de que Deus lhe deu uma recompensa
  alternative: Suavizar a linguagem transacional com uma formulação mais abstrata ou avaliar teologicamente a interpretação dela
  rationale: O versículo registra a compreensão de Lia. A tradução deve conservar sua atribuição a Deus e a noção de recompensa sem endossá-la nem criticá-la além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Evita “criada”, que pode sugerir apenas trabalho doméstico moderno, e preserva a concisão narrativa. O marcador [a] aparece imediatamente após o termo que fundamenta o jogo de palavras.
