  source_fidelity: 'A fala de Lia é traduzida com fidelidade: Deus é o sujeito, a recompensa é apresentada como dela, e a razão dada é que ela entregou sua serva ao marido. A fórmula final de nomeação, porém, não contém explicitamente nem «ao menino» nem uma relação causal expressa por «Por isso»; o hebraico apenas prossegue a narrativa com «e ela lhe deu o nome».'
