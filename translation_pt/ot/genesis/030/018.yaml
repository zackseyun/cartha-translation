  terminology: «Lia», «Deus», «serva», «marido» e «Issacar» são adequados ao português bíblico contemporâneo. «Recompensa» é uma opção legítima para שָׂכָר neste enunciado e a nota preserva o jogo de palavras. A nota deve situar explicitamente a relação sonora/lexical no hebraico.
