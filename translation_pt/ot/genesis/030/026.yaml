  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: pt
  text: Dê-me minhas esposas e meus filhos[a], pelas quais trabalhei para você, para que eu possa partir; pois você sabe do serviço que lhe prestei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma feminina plural no hebraico aponta mais especificamente para as esposas, embora a oração relativa venha depois de “minhas esposas e meus filhos”.
    reason: lexical_alternative
  - marker: b
    text: “Serviço” também pode ser traduzido como “trabalho” ou “labor”. O hebraico repete a mesma raiz com o sentido de servir ou trabalhar nesta frase.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Dê-me
  rationale: O imperativo de נתן dirige a Labão a ordem de entregar a Jacó sua família; o pronome “me” é exigido naturalmente pelo contexto e pela sintaxe portuguesa.
- source_word: נָשַׁי
  choice: minhas mulheres
  rationale: O plural de אִשָּׁה com sufixo de primeira pessoa refere-se às esposas de Jacó. “Mulheres” é natural no contexto familiar e evita um tom excessivamente jurídico.
- source_word: יְלָדַי
  choice: meus filhos
  rationale: יְלָדִים designa os descendentes ou as crianças de Jacó; “filhos” é a forma familiar mais natural em português.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: pelos quais trabalhei para você
  rationale: A cláusula apresenta a família — e, mais especificamente, possivelmente as mulheres — como aquilo pelo qual Jacó trabalhou para Labão. A tradução principal mantém a possível referência ao conjunto recém-mencionado, e a nota registra a leitura mais restrita.
- source_word: וְאֵלֵכָה
  choice: para que eu possa partir
  rationale: O coortativo de הלך expressa a partida desejada por Jacó. Esta formulação transmite a nuance volitiva com clareza e naturalidade.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão que fundamenta o pedido de Jacó.
- source_word: יָדַעְתָּ
  choice: você conhece
  rationale: 'O perfeito tem relevância presente: Labão sabe por experiência qual foi o trabalho de Jacó.'
- source_word: עֲבֹדָתִי
  choice: o trabalho
  rationale: עֲבֹדָה pode indicar serviço, trabalho ou labor. “Trabalho” é corrente e adequado à relação laboral entre Jacó e Labão.
- source_word: אֲשֶׁר עֲבַדְתִּיךָ
  choice: que fiz para você
  rationale: A expressão comunica naturalmente o trabalho realizado em benefício de Labão. A repetição da raiz hebraica עבד é refletida em português por “trabalhei” e “trabalho”, embora o verbo final seja vertido idiomaticamente como “fiz”.
