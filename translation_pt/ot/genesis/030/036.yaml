  yaml_path: translation/ot/genesis/030/036.yaml
  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: pt
  text: E pôs uma distância de três dias de viagem entre si e Jacó; e Jacó apascentava o restante do rebanho de Labão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: uma distância de três dias de viagem
  rationale: A expressão hebraica indica a distância normalmente percorrida em três dias; explicitar «de viagem» evita que «três dias» seja entendido como simples intervalo de tempo.
- source_word: וַיָּשֶׂם
  choice: pôs
  rationale: Reproduz de modo direto e natural o sentido de estabelecer ou colocar uma distância.
- source_word: רֹעֶה
  choice: apascentava
  rationale: O particípio no contexto descreve a atividade contínua de Jacó como pastor; «apascentava» é corrente, digno e preciso.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: o restante do rebanho de Labão
  rationale: Expressa naturalmente os animais de pequeno porte que permaneceram com Labão depois da separação descrita no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome sujeito hebraico foi mantido implicitamente em «pôs», como é natural em português e como o contexto identifica Labão. O ponto e vírgula distingue as duas ações coordenadas sem enfraquecer sua ligação.
