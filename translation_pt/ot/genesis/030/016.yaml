revisions:
- from: 'Ao entardecer, quando Jacó voltou do campo, Lia saiu ao encontro dele e disse: “Você deve se deitar comigo, pois contratei você em troca das mandrágoras do meu filho”.[a] E naquela noite ele se deitou com ela.'
  to: 'Ao entardecer, quando Jacó voltou do campo, Lia saiu ao encontro dele e disse: “Você deve se deitar comigo, pois aluguei você em troca das mandrágoras do meu filho.”[a] E naquela noite ele se deitou com ela.'
  rationale: A revisão substitui uma expressão portuguesa que tende a evocar emprego por «aluguei você», que preserva a metáfora comercial de שׂכר no contexto do acordo pelas mandrágoras. Mantém-se a explicitação sóbria de «se deitar comigo», pois o contexto estabelece inequivocamente o sentido da convocação, e conserva-se a nota para a ênfase verbal e a função de preço/meio da preposição hebraica.
  reviewer_model: gpt-5.6-terra
