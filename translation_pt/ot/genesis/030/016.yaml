  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: pt
  text: 'Ao entardecer, quando Jacó voltou do campo, Lia saiu ao encontro dele e disse: “Você deve se deitar comigo, pois aluguei você em troca das mandrágoras do meu filho.”[a] E naquela noite ele se deitou com ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois de fato aluguei você pelas mandrágoras do meu filho”. O hebraico repete a raiz de “alugar” para dar ênfase e apresenta as mandrágoras como o preço ou meio do acordo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יַעֲקֹב מִן הַשָּׂדֶה בָּעֶרֶב
  choice: Ao entardecer, quando Jacó voltou do campo
  rationale: Expressa com naturalidade o movimento de Jacó desde o campo e a indicação temporal, sem alterar a sequência narrativa.
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: Lia saiu ao encontro dele
  rationale: Reproduz de modo corrente a construção hebraica de sair para encontrar alguém.
- source_word: אֵלַי תָּבוֹא
  choice: Você deve se deitar comigo
  rationale: No contexto, a expressão é uma convocação direta para a relação sexual. A formulação portuguesa comunica essa força com clareza e dignidade, sem crueza.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: contratei você
  rationale: Preserva a metáfora transacional da raiz hebraica שׂכר. A nota registra a ênfase produzida pelo infinitivo absoluto cognato.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: em troca das mandrágoras do meu filho
  rationale: Interpreta ב como preço ou meio do acordo, sentido indicado pelo contexto imediato, e mantém a referência específica às mandrágoras.
- source_word: וַיִּשְׁכַּב עִמָּהּ בַּלַּיְלָה הוּא
  choice: E naquela noite ele se deitou com ela
  rationale: Mantém o eufemismo sexual bíblico e traduz naturalmente a expressão temporal hebraica.
