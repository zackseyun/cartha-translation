base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: pt
  text: 'Então Raquel disse: “Deus julgou a minha causa; ele também ouviu a minha voz e me deu um filho”. Por isso, ela lhe deu o nome de Dã.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Dã está ligado ao verbo hebraico que significa “julgar” ou “ter julgado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: julgou a minha causa
  rationale: Preserva a imagem judicial do verbo e, no contexto, comunica que Deus decidiu em favor de Raquel sem intensificar o sentido para uma vindicação teológica plena.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, o verbo singular e o contexto narrativo exigem o referente singular.
- source_word: שָׁמַע בְּקֹלִי
  choice: ouviu a minha voz
  rationale: Mantém a expressão hebraica concreta e pessoal, que também é natural em português.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: me deu um filho
  rationale: Traduz diretamente o objeto indireto e preserva a referência específica a um filho do sexo masculino.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e claro a inferência que introduz a explicação do nome.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: ela lhe deu o nome de Dã
  rationale: É a forma idiomática corrente em português para o ato de nomear e conserva explicitamente o elemento “nome” importante para o jogo de palavras.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
theological_decisions:
- issue: Sentido da declaração de Raquel sobre a ação judicial de Deus
  choice: Deus julgou a minha causa
  alternative: Deus me julgou; Deus me fez justiça
  rationale: A opção retém a metáfora jurídica e permite que o contexto sugira uma decisão favorável, sem dar ao verbo o sentido doutrinariamente mais forte de justificação ou vindicação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém a metáfora judicial e explica em nota o jogo de palavras hebraico que não pode ser reproduzido plenamente em português.
