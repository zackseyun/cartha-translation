  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: pt
  text: Então ela lhe deu Bila, sua serva[a], como esposa, e Jacó teve relações com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua escrava”. O termo hebraico designa uma serva em posição social subordinada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Então ela deu
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: לּוֹ
  choice: lhe
  rationale: O pronome oblíquo representa de modo idiomático o objeto indireto hebraico, “a ele”.
- source_word: בִּלְהָה
  choice: Bila
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: שִׁפְחָתָהּ
  choice: sua serva[a]
  rationale: “Serva” é conciso, natural e indica uma mulher em posição social subordinada; a nota registra a alternativa mais explícita “escrava”.
- source_word: לְאִשָּׁה
  choice: como mulher
  rationale: A expressão preserva a relação conjugal indicada pelo hebraico sem impor uma classificação posterior mais específica, como “concubina”.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: teve relações com ela
  rationale: O hebraico emprega um eufemismo convencional para a união sexual. A tradução comunica seu sentido com clareza e sobriedade em português moderno.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma consagrada do nome em português.
theological_decisions:
- issue: Natureza da união indicada por לְאִשָּׁה
  choice: como mulher
  alternative: como esposa; por concubina
  rationale: “Como mulher” mantém a formulação relacional do hebraico e evita resolver além do texto a condição jurídica exata de Bila.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção evita arcaísmos como “entrou a ela” e mantém concisão narrativa.
