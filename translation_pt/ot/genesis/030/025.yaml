  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: pt
  text: 'E aconteceu que, depois que Raquel deu à luz José, Jacó disse a Labão: “Deixe-me partir, para que eu vá para o meu lugar e para a minha terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Deixe-me partir
  rationale: O piel imperativo de שׁלח com sufixo de primeira pessoa pede que Labão libere Jacó de sua dependência ou serviço. “Deixe-me partir” comunica isso naturalmente, sem sugerir apenas o ato físico de mandá-lo embora.
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: para o meu lugar e para a minha terra
  rationale: Mantém os dois termos hebraicos e a repetição possessiva, preservando a ênfase no destino próprio de Jacó.
- source_word: כַּאֲשֶׁר יָלְדָה
  choice: depois que ... deu à luz
  rationale: Neste contexto narrativo, a oração temporal indica que o pedido ocorreu após o nascimento de José; a formulação é clara e natural em português.
