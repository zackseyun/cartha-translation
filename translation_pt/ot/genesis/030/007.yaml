  text: Bilhah[a], Rachel’s female slave, conceived again and bore Jacob a second son.
translation:
  language: pt
  text: Bila, escrava[a] de Raquel, engravidou novamente e deu a Jacó um segundo filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «serva». O termo hebraico refere-se a uma mulher escravizada ou serva de condição social inferior; «escrava» explicita aqui sua condição de sujeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: engravidou
  rationale: O verbo הרה indica ficar grávida ou conceber; “engravidou” é natural e claro no português moderno.
- source_word: עוֹד
  choice: novamente
  rationale: Neste contexto narrativo, עוֹד indica a repetição da gravidez.
- source_word: וַתֵּלֶד
  choice: deu ... um filho
  rationale: O qal de ילד, com objeto, significa dar à luz; a formulação escolhida é corrente e preserva a relação expressa por לְיַעֲקֹב.
- source_word: שִׁפְחַת
  choice: escrava
  rationale: שִׁפְחָה designa uma mulher em condição servil; “escrava” explicita o vínculo social, sem recorrer a linguagem arcaica.
- source_word: בֵּן שֵׁנִי
  choice: um segundo filho
  rationale: Reproduz diretamente a ideia ordinal da expressão hebraica, sem substituí-la por “outro filho”.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ marca aqui a relação parental; “deu a Jacó” é uma construção portuguesa natural neste contexto.
- source_word: בִּלְהָה ... רָחֵל
  choice: Bila, escrava de Raquel
  rationale: Mantém o nome próprio em primeiro lugar e conserva a identificação de Bila por sua relação social com Raquel.
