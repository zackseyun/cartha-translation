  source_fidelity: A proposta volitiva inicial e o imperativo dirigido a Labão são bem representados. Contudo, “todo animal” na primeira ocorrência de שֶׂה deixa imprecisa a estrutura do hebraico, que distingue os ovinos (incluindo os de cor escura) das cabras na sequência. Tornar explícitas as espécies preserva melhor o contraste do versículo.
