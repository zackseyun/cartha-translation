  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção separa o pedido volitivo de Jacó da ordem seguinte dirigida a Labão, refletindo a mudança verbal do hebraico. Os termos de pelagem permanecem distintos, mas a incerteza lexical é registrada em notas.
