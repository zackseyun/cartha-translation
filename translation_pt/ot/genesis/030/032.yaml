base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: pt
  text: Hoje, deixe-me passar por todo o seu rebanho. Separe dele toda ovelha salpicada e malhada[b], toda ovelha de cor escura[a] e toda cabra malhada e salpicada; isso será o meu salário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “castanha”. O hebraico חוּם indica uma coloração escura ou castanha entre as ovelhas.
    reason: lexical_alternative
  - marker: b
    text: “Salpicado” (נָקֹד) e “malhado” (טָלוּא) são termos para padrões de pelagem cuja distinção exata pode se sobrepor; também poderiam ser traduzidos por “pintado e manchado” ou expressão semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: deixe-me passar
  rationale: O imperfeito qal na primeira pessoa pode ter força volitiva no contexto da proposta de Jacó; a formulação também é natural em português.
- source_word: בְּכָל צֹאנְךָ
  choice: por todo o seu rebanho
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” preserva esse valor coletivo.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e corrente.
- source_word: הָסֵר מִשָּׁם
  choice: separe dele
  rationale: הָסֵר é uma forma imperativa dirigida a Labão, e o contexto posterior descreve a separação dos animais; “dele” retoma naturalmente o rebanho.
- source_word: כָּל שֶׂה
  choice: todo animal
  rationale: שֶׂה pode designar genericamente um indivíduo do gado miúdo; “animal” evita restringi-lo indevidamente antes da distinção entre ovelhas e cabras.
- source_word: נָקֹד
  choice: salpicado
  rationale: Indica pelagem marcada por pontos ou pequenas manchas; “salpicado” mantém distinção razoável em relação a טָלוּא.
- source_word: טָלוּא
  choice: malhado
  rationale: Refere-se a uma coloração manchada ou em placas; “malhado” é corrente no português aplicado à pelagem de animais.
- source_word: חוּם
  choice: de cor escura
  rationale: O termo indica coloração escura ou castanha; esta opção evita precisar uma tonalidade que o hebraico talvez não especifique.
- source_word: בַּכְּשָׂבִים
  choice: entre as ovelhas
  rationale: O plural designa ovinos e contrasta aqui com as cabras; “ovelhas” funciona naturalmente como coletivo em português.
- source_word: בָּעִזִּים
  choice: entre as cabras
  rationale: Tradução coletiva natural de עִזִּים neste contexto.
- source_word: וְהָיָה שְׂכָרִי
  choice: isso será o meu salário
  rationale: שָׂכָר designa pagamento ou salário; “isso” retoma coletivamente os animais separados.
theological_decisions: []
