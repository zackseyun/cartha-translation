id: GEN.30.42
reference: Genesis 30:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: pt
  text: Mas, quando os animais do rebanho eram fracos[a], Jacó não colocava as varas diante deles[b]. Assim, os fracos ficavam para Labão, e os fortes[c], para Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eram débeis”. O termo hebraico pode indicar animais fracos; alguns o entendem mais especificamente como referência a animais que se reproduziam mais tarde ou de qualidade inferior.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Jacó não colocava diante deles as varas mencionadas nos versículos anteriores. O objeto do verbo está implícito no hebraico.
    reason: cross_reference
  - marker: c
    text: Ou “robustos” ou “vigorosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: quando os animais do rebanho eram fracos
  rationale: A construção com בְּ introduz uma circunstância temporal. Neste contexto de reprodução, עטף designa animais fracos ou menos vigorosos, embora possa haver uma nuance mais específica ligada à reprodução tardia ou inferior. A formulação explicita o sentido coletivo de צֹאן sem restringi-lo apenas a ovelhas.
- source_word: לֹא יָשִׂים
  choice: não colocava as varas diante deles
  rationale: שׂים significa colocar ou pôr. O objeto não aparece expresso no hebraico, mas o contexto anterior indica as varas que Jacó colocava diante dos animais. A repetição explícita produz português claro e natural.
- source_word: וְהָיָה
  choice: Assim, ... ficavam
  rationale: A construção apresenta o resultado habitual da prática descrita. “Assim” comunica essa relação, e “ficavam para” expressa de modo natural a atribuição dos animais.
- source_word: הָעֲטֻפִים
  choice: os fracos
  rationale: O termo retoma a raiz עטף e designa os animais menos vigorosos, em contraste com הַקְּשֻׁרִים.
- source_word: לְלָבָן ... לְיַעֲקֹב
  choice: para Labão ... para Jacó
  rationale: O לְ marca posse, destinação ou atribuição. “Ficavam para” preserva essa nuance de forma idiomática.
- source_word: וְהַקְּשֻׁרִים
  choice: e os fortes
  rationale: A forma incomum é entendida pelo contraste contextual como referência aos animais robustos ou vigorosos. “Fortes” é claro e preserva a oposição aos fracos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Animais do rebanho” esclarece o valor coletivo de צֹאן, que inclui ovelhas e cabras. A elipse final (“e os fortes, para Jacó”) conserva o paralelismo conciso do hebraico.
