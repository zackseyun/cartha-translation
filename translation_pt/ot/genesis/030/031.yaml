base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: pt
  text: 'Ele perguntou: “O que lhe darei?” Jacó respondeu: “Não me dê coisa alguma. Se fizer isto por mim, voltarei a[a] apascentar e guardar o seu rebanho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltarei, apascentarei o seu rebanho e cuidarei dele”. O verbo hebraico pode indicar tanto um retorno como a retomada do trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: O que lhe darei?
  rationale: A pergunta solicita que Jacó determine a compensação. A forma futura é direta, natural e preserva a construção hebraica.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Não me dê coisa alguma
  rationale: O imperfeito negado funciona aqui como recusa enfática da oferta, não como simples previsão. “Coisa alguma” comunica naturalmente o sentido de מְאוּמָה em contexto negativo.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Se fizer isto por mim
  rationale: Mantém a condição e o demonstrativo sem a rigidez pouco natural de “esta coisa” em português.
- source_word: אָשׁוּבָה
  choice: voltarei a
  rationale: No contexto, pode indicar a retomada do trabalho; “voltarei a” expressa essa leitura, enquanto a nota conserva a possibilidade de um retorno distinto seguido do serviço.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: apascentar ... o seu rebanho
  rationale: רעה designa cuidar do rebanho e conduzi-lo ao pasto. “Apascentar” é preciso, digno e amplamente compreensível.
- source_word: אֶשְׁמֹר
  choice: guardar
  rationale: שׁמר acrescenta a ideia de vigiar e proteger o rebanho. “Guardar” preserva essa dimensão e coordena-se naturalmente com “apascentar”.
theological_decisions: []
