base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: pt
  text: 'Então Lia disse: “Como sou feliz! Pois as mulheres me chamarão feliz”. E deu ao menino o nome de Aser.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Aser está ligado, em hebraico, às palavras traduzidas por “feliz” e “chamarão feliz” na declaração de Lia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Como sou feliz!
  rationale: A expressão contém o substantivo ligado a felicidade ou ventura com sufixo de primeira pessoa. A formulação exclamativa é natural em português e mantém a ligação verbal com a frase seguinte e com o nome Aser.
- source_word: אִשְּׁרוּנִי
  choice: me chamarão feliz
  rationale: A forma Piel de אשר significa declarar ou considerar alguém feliz. Esta escolha preserva a repetição de “feliz” e, tanto quanto possível em português, o jogo de palavras do hebraico.
- source_word: בָּנוֹת
  choice: as mulheres
  rationale: Embora o valor lexical básico seja “filhas”, o plural pode designar mulheres de modo mais amplo. “As mulheres” comunica naturalmente o sentido idiomático neste contexto.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: E deu ao menino o nome de Aser
  rationale: Expressa em português corrente a fórmula hebraica de dar nome, sem a rigidez de “chamou o nome dele”.
- source_word: אָשֵׁר
  choice: Aser
  rationale: O nome próprio é transliterado segundo a forma tradicional em português; a nota explica sua relação sonora e semântica com as palavras de Lia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção exclamativa natural. Optou-se por “mulheres” para o uso idiomático de בָּנוֹת e por uma nota única para preservar o jogo de palavras hebraico que não pode ser reproduzido integralmente em português.
