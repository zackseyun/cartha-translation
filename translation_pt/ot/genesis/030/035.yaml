  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: pt
  text: Naquele dia, ele separou os bodes listrados[a] e malhados, todas as cabras salpicadas e malhadas — todas as que tinham branco — e todos os cordeiros de cor escura[b], e os entregou aos cuidados de seus filhos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marcados por faixas”; o hebraico se refere a marcas em forma de faixas ou listras na pelagem.
    reason: lexical_alternative
  - marker: b
    text: Ou “marrons”; o termo hebraico designa uma coloração marrom ou escura.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “deu na mão de seus filhos”, expressão hebraica que indica colocar sob a autoridade ou os cuidados de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: ele separou
  rationale: No hifil, o verbo indica retirar ou apartar os animais do rebanho; “separou” expressa com naturalidade a ação no contexto.
- source_word: הַתְּיָשִׁים
  choice: os bodes
  rationale: תישׁ designa especificamente o macho da cabra; “bodes” é preciso e corrente em português.
- source_word: הָעֲקֻדִּים
  choice: listrados
  rationale: O termo descreve marcas em faixas ou listras. “Listrados” é claro, sem recorrer a linguagem técnica.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: malhados
  rationale: O adjetivo indica pelagem com manchas ou áreas de cor; “malhados” é natural no contexto de animais e mantém a correspondência entre as duas ocorrências.
- source_word: הָעִזִּים
  choice: as cabras
  rationale: Embora o plural possa designar cabras genericamente, o contraste com os bodes anteriores favorece aqui a referência às fêmeas.
- source_word: הַנְּקֻדּוֹת
  choice: salpicadas
  rationale: O termo sugere pequenos pontos ou pintas, distinguindo-se de טלאות, traduzido por “malhadas”.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: todas as que tinham alguma mancha branca
  rationale: A formulação preserva a ideia de presença de branco na pelagem e explicita naturalmente o referente animal em português.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: e todos os cordeiros de cor escura
  rationale: חוּם indica tonalidade marrom ou escura, enquanto כְּשָׂבִים pode designar ovinos jovens; a tradução mantém ambas as nuances sem especificar em excesso a tonalidade.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: e os entregou aos cuidados de seus filhos
  rationale: A expressão hebraica literal “deu na mão de” é um idioma de autoridade, guarda ou responsabilidade; a tradução comunica esse sentido em português natural.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com vocabulário comum na descrição da pelagem de animais. A ordem das categorias do hebraico foi preservada, e os três termos distintos de marcação receberam equivalentes diferenciados: “listrados”, “salpicadas” e “malhadas”.'
