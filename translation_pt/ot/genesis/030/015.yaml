  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: pt
  text: 'Mas Lia lhe disse: “Você acha pouco ter tomado o meu marido? Vai tomar também as mandrágoras do meu filho?” Raquel disse: “Então, em troca das mandrágoras do seu filho, ele dormirá com você esta noite.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Você acha pouco
  rationale: Reproduz de modo natural a pergunta retórica hebraica, mantendo o tom indignado de Lia.
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: ter tomado o meu marido
  rationale: Preserva a acusação direta e o aspecto anterior da ação sem acrescentar explicações sobre a rivalidade entre as irmãs.
- source_word: דּוּדָאֵי
  choice: mandrágoras
  rationale: É a identificação lexical tradicional e mais provável da planta; o texto não explicita suas supostas propriedades.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: ele dormirá com você
  rationale: Expressa com dignidade e clareza o eufemismo hebraico para relações sexuais, preservando sua forma indireta.
- source_word: תַּחַת
  choice: em troca de
  rationale: Neste contexto, indica a contrapartida do acordo entre Raquel e Lia.
theological_decisions:
- issue: Natureza moral e eficácia das mandrágoras
  choice: Não explicar nem atribuir eficácia à planta
  alternative: Acrescentar referência a fertilidade ou afrodisíaco
  rationale: O versículo apenas registra a negociação; não endossa crença alguma sobre as propriedades das mandrágoras.
- issue: Acusação de Lia de que Raquel tomou seu marido
  choice: Preservar a acusação sem harmonização narrativa
  alternative: Abrandar para ‘ficou com meu marido’ ou explicar as relações conjugais
  rationale: A fala caracteriza a perspectiva indignada de Lia e sua tensão com Raquel; a tradução não deve decidir quem tem razão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os nomes das interlocutoras foram explicitados no início para evitar ambiguidade pronominal em português. A ordem da última frase foi ajustada para fluidez, mantendo a relação de troca expressa no hebraico.
