  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: pt
  text: 'E ela lhe deu o nome de José[a], dizendo: “Que Yahweh me acrescente outro filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, José soa como o verbo que significa “que ele acrescente” ou “ele acrescenta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: E ela lhe deu o nome
  rationale: A fórmula hebraica significa literalmente “e ela chamou o nome dele”; em português atual, “deu-lhe o nome” comunica naturalmente o ato de nomear sem perder a referência explícita ao nome.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português; a nota preserva o jogo sonoro hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala explicativa de Raquel.
- source_word: יֹסֵף
  choice: Que ... dê mais
  rationale: O hifil de יסף significa acrescentar ou adicionar. Neste contexto, a forma expressa um desejo ou oração; “dê mais” é idiomático em português e conserva a relação com o pedido de outro filho.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לִי
  choice: me dê
  rationale: O dativo hebraico é expresso naturalmente pelo pronome “me” na construção portuguesa.
- source_word: בֵּן אַחֵר
  choice: mais um filho
  rationale: Expressa de modo corrente e preciso o pedido de um filho adicional; בֵּן especifica um filho do sexo masculino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Valor modal de יֹסֵף
  choice: 'desejo ou oração: “Que Yahweh me dê mais”'
  alternative: 'declaração futura: “Yahweh me dará mais”'
  rationale: A forma verbal, ligada à explicação do nome José, admite valor jussivo. O contexto favorece o desejo por outro filho, sem transformá-lo numa afirmação categórica sobre o futuro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “mais um filho” é natural e mantém o sentido específico do hebraico; a nota explica o jogo de palavras que não pode ser reproduzido integralmente em português.
