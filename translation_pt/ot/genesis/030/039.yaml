  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: pt
  text: Assim, os animais do rebanho acasalaram diante das varas, e as fêmeas do rebanho deram à luz filhotes listrados[a], salpicados[b] e malhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com faixas”. Traduções mais antigas às vezes empregam termos como “riscados” ou “listados”.
    reason: lexical_alternative
  - marker: b
    text: A distinção exata entre “salpicados” (נְקֻדִּים) e “malhados” (טְלֻאִים) é incerta; o último termo também pode ser traduzido como “manchados”, “mosqueados” ou “com manchas irregulares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: acasalaram
  rationale: O verbo יחם se refere literalmente a entrar no cio ou ficar sexualmente excitado; no contexto de reprodução animal, “acasalaram” comunica com naturalidade a ação reprodutiva, sem afirmar de modo indevido apenas a concepção.
- source_word: הַצֹּאן
  choice: os animais do rebanho / as fêmeas do rebanho
  rationale: צאן é um coletivo que abrange o gado miúdo, sobretudo ovelhas e cabras. “Rebanho” mantém esse sentido coletivo; a explicitação de “animais” torna natural o verbo “acasalaram”, e “fêmeas” deixa claro quem deu à luz, conforme a forma verbal feminina plural וַתֵּלַדְןָ.
- source_word: אֶל הַמַּקְלוֹת
  choice: diante das varas
  rationale: Embora אֶל possa significar “para” ou “em direção a”, no cenário visual descrito no contexto a expressão indica que o acasalamento ocorria diante das varas. “Diante de” é claro e não atribui causalidade explícita às varas.
- source_word: וַתֵּלַדְןָ
  choice: deram à luz filhotes
  rationale: ילד significa dar à luz. O hebraico passa diretamente às características das crias, sem empregar um substantivo expresso; “filhotes” é acrescentado para clareza natural em português.
- source_word: עֲקֻדִּים
  choice: listrados
  rationale: O termo descreve animais marcados por faixas ou listras. “Listrados” é corrente e inteligível; “com faixas” permanece como alternativa em nota.
- source_word: נְקֻדִּים
  choice: salpicados
  rationale: O adjetivo sugere pequenas pintas ou pontos. “Salpicados” ajuda a distingui-lo do termo seguinte, embora a diferença exata entre os dois tipos de marcação não seja segura.
- source_word: וּטְלֻאִים
  choice: malhados
  rationale: O termo parece indicar marcas maiores ou irregulares, como manchas ou placas. “Malhados” é uma designação natural em português para animais com pelagem manchada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “rebanho” reflete a repetição hebraica, enquanto “animais” e “fêmeas” evitam construções pouco naturais com o coletivo. “Diante das varas” preserva o cenário do contexto sem transformar a expressão em uma declaração explícita de causalidade.
