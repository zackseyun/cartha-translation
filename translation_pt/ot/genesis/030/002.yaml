  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: pt
  text: 'Então Jacó ficou irado com Raquel[a] e disse: “Por acaso estou eu no lugar de Deus, que lhe negou o fruto do ventre[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “a ira de Jacó se acendeu contra Raquel”.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que significa filhos ou descendência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: ficou irado
  rationale: O hebraico emprega a expressão idiomática de ira que se acende. “Ficou irado” comunica com naturalidade a intensidade e o início da reação de Jacó, enquanto a formulação mais literal é preservada em nota.
- source_word: בְּרָחֵל
  choice: com Raquel
  rationale: A preposição assinala Raquel como alvo da ira. “Irado com Raquel” é uma construção natural e clara em português.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Por acaso estou eu no lugar de Deus
  rationale: תַּחַת expressa aqui substituição ou ocupação do lugar de outro, não mera posição espacial. A pergunta retórica nega que Jacó possua a prerrogativa divina.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: que lhe negou
  rationale: A oração relativa atribui a Deus a privação da fecundidade de Raquel. “Lhe negou” é conciso e idiomático, mantendo a força do hebraico מָנַע e a agência explícita.
- source_word: פְּרִי בָטֶן
  choice: o fruto do ventre
  rationale: A tradução conserva a metáfora concreta hebraica para filhos ou descendência, que continua compreensível em português e mantém a linguagem bíblica.
theological_decisions:
- issue: Agência divina na esterilidade de Raquel
  choice: Preservar a afirmação de Jacó de que Deus lhe negou o fruto do ventre.
  alternative: Tratar a fala apenas como retórica, sem afirmar a agência divina, ou suavizá-la para uma referência impessoal à infertilidade.
  rationale: A oração אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן identifica diretamente Deus como aquele que impediu Raquel de ter filhos. A tradução mantém essa tensão teológica sem explicá-la nem atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a pergunta retórica e a metáfora hebraica, recorrendo às notas apenas para registrar a expressão mais literal da ira e esclarecer o idioma “fruto do ventre”.
