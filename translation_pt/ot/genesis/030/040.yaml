  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: pt
  text: Jacó separou os cordeiros[a] e fez o rebanho ficar voltado para os animais listrados e para todos os de cor escura[b] no rebanho de Labão.[c] Depois, pôs à parte rebanhos para si e não os juntou ao rebanho de Labão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as ovelhas jovens».
    reason: lexical_alternative
  - marker: b
    text: Ou «todos os castanhos».
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica também pode ser entendida como «provenientes do rebanho de Labão».
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: os cordeiros
  rationale: O termo designa cordeiros ou ovelhas jovens; «cordeiros» mantém a especificidade em vez do termo mais amplo «ovelhas».
- source_word: הִפְרִיד
  choice: separou
  rationale: Reproduz diretamente o sentido causativo de dividir ou pôr à parte.
- source_word: פְּנֵי הַצֹּאן
  choice: fez o rebanho ficar voltado
  rationale: Expressa em português natural a imagem hebraica literal de pôr «as faces do rebanho» em determinada direção.
- source_word: עָקֹד
  choice: animais listrados
  rationale: Refere-se a animais marcados por faixas ou listras; explicitar «animais» torna claro o referente substantivado.
- source_word: כָל חוּם
  choice: todos os de cor escura
  rationale: חוּם pode indicar coloração escura ou castanha; a formulação evita especificidade cromática indevida.
- source_word: בְּצֹאן לָבָן
  choice: no rebanho de Labão
  rationale: Mantém o valor locativo mais direto da preposição ב, enquanto uma nota registra a possível leitura de origem exigida por alguns intérpretes diante do contexto narrativo.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: pôs à parte rebanhos para si
  rationale: Conserva tanto a ação de colocar ou constituir quanto a separação dos grupos destinados a Jacó.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: não os juntou ao rebanho de Labão
  rationale: Traduz de modo idiomático a ideia de não colocar os rebanhos separados junto ou em associação com o de Labão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A imagem corporal de «as faces do rebanho» foi vertida idiomaticamente, sem eliminar a direção indicada pelo hebraico. A ambiguidade de בְּצֹאן לָבָן foi preservada por meio de nota.
