base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: pt
  text: Então Deus se lembrou de Raquel[a], ouviu-a[b] e abriu o seu ventre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dirigiu sua atenção a Raquel» ou «teve Raquel em mente». No hebraico, «lembrou-se» é um modo bíblico de dizer que Deus lhe deu atenção favorável e agiu; não sugere que a tivesse esquecido.
    reason: lexical_alternative
  - marker: b
    text: Ou «deu ouvidos a ela» ou «atendeu-a».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se lembrou
  rationale: Preserva o idiomatismo bíblico de זכר, que neste contexto indica atenção favorável que conduz à ação, sem sugerir que Deus tenha perdido Raquel da memória.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Os verbos no singular mostram que o termo se refere ao único Deus.
- source_word: אֶת רָחֵל
  choice: Raquel
  rationale: אֶת marca Raquel como objeto direto; emprega-se a forma tradicional e corrente do nome em português.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: ouviu-a
  rationale: שׁמע com אֶל pode expressar ouvir com atenção ou dar ouvidos. «Ouviu-a» mantém a concisão e deixa aberta a nuance entre ouvir e atender.
- source_word: וַיִּפְתַּח
  choice: abriu
  rationale: Mantém o verbo concreto פתח e o idiomatismo do hebraico.
- source_word: רַחְמָהּ
  choice: o seu ventre
  rationale: רֶחֶם significa «ventre» ou «útero». «Abriu o seu ventre» preserva a expressão bíblica relativa à capacidade de conceber.
- source_word: וַ
  choice: Então / e
  rationale: O primeiro waw faz a narrativa avançar e é vertido por «Então»; os seguintes conectam naturalmente as ações coordenadas em português.
theological_decisions:
- issue: Linguagem antropomórfica de Deus se lembrar de Raquel
  choice: Manter «se lembrou» no texto principal
  alternative: «voltou a sua atenção para Raquel» ou «teve Raquel em mente»
  rationale: A expressão hebraica não afirma que Deus antes a tivesse esquecido; indica sua atenção favorável que se manifesta nas ações seguintes. Preservar o idiomatismo mantém a linguagem e a tensão próprias do texto bíblico.
- issue: Sentido de Deus ouvir Raquel
  choice: «ouviu-a»
  alternative: «deu ouvidos a ela» ou «atendeu-a»
  rationale: O hebraico permite a ideia de ouvir atentamente e responder, mas «atendeu-a» explicitaria o resultado além do necessário. A nota registra as nuances legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A construção «o seu ventre» evita a possível leitura de «lhe abriu o ventre» como ato físico violento e conserva o idiomatismo bíblico. Os marcadores seguem a ordem natural de ocorrência no texto.
