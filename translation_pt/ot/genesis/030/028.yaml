  yaml_path: translation/ot/genesis/030/028.yaml
  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: pt
  text: 'Então ele disse[a]: “Diga qual será o seu salário, e eu o pagarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estipule a sua remuneração, e eu a pagarei.”'
    reason: Alternativa lexical para o imperativo hebraico de especificar ou fixar explicitamente a remuneração.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: נָקְבָה
  choice: Diga quanto
  rationale: O imperativo de נקב significa indicar ou declarar explicitamente. Com a remuneração como objeto, “Diga quanto” comunica o sentido de modo corrente e claro.
- source_word: שְׂכָרְךָ
  choice: você quer receber
  rationale: שְׂכָרְךָ é a remuneração devida pelo trabalho. A formulação verbal evita o pouco natural “nomeie seu salário” e mantém a ideia de estipular o pagamento.
- source_word: עָלַי
  choice: '[refletido na declaração dirigida ao falante]'
  rationale: A expressão literalmente “sobre mim” integra o idioma de estipular a remuneração a cargo do falante; não precisa de correspondência isolada em português.
- source_word: וְאֶתֵּנָה
  choice: e eu lhe pagarei
  rationale: Embora נתן signifique literalmente “dar”, em contexto de remuneração “pagar” é o equivalente natural; o objeto é recuperado da frase anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução prioriza naturalidade sem alterar o sentido contratual da fala de Labão.
