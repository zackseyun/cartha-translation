  yaml_path: translation/ot/genesis/030/012.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: pt
  text: E Zilpa, serva de Lia[a], deu a Jacó um segundo filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escrava de Lia”. O termo hebraico designa especificamente uma mulher em condição de servidão ligada a Lia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu ... um filho
  rationale: O wayyiqtol de ילד dá sequência à narrativa. A construção idiomática portuguesa “dar um filho a alguém” comunica naturalmente o nascimento e permite preservar o complemento לְיַעֲקֹב.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Forma tradicional e corrente em português para o nome hebraico זִלְפָּה.
- source_word: שִׁפְחַת לֵאָה
  choice: serva de Lia
  rationale: A expressão em estado construto identifica a condição social de Zilpa em relação a Lia. “Serva” é clara, digna e suficientemente ampla; uma nota registra a nuance de servidão presente no termo hebraico.
- source_word: בֵּן שֵׁנִי
  choice: um segundo filho
  rationale: Traduz diretamente a ideia de “filho, segundo” e indica que este foi o segundo filho que Zilpa deu a Jacó no contexto narrativo.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ assinala o pai ou beneficiário na fórmula de nascimento. A formulação “deu a Jacó um segundo filho” preserva essa relação em português natural.
