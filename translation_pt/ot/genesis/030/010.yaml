  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: pt
  text: E Zilpa, serva[a] de Lia, deu à luz um filho a Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escrava”. O hebraico שִׁפְחָה se refere a uma mulher que servia numa casa em condição social subordinada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: E ... deu um filho
  rationale: O wayyiqtol de ילד dá continuidade à sequência narrativa. Em português, “deu um filho a Jacó” expressa com naturalidade o nascimento e acomoda tanto לְיַעֲקֹב quanto בֵּן.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Forma tradicional e corrente do nome em português, correspondente ao hebraico זִלְפָּה.
- source_word: שִׁפְחַת
  choice: serva
  rationale: שִׁפְחָה designa uma mulher em condição subordinada de serviço doméstico e pode também implicar condição servil. “Serva” é conciso, digno e corrente, sem especificar indevidamente idade.
- source_word: לֵאָה
  choice: de Lia
  rationale: A relação de construto é expressa naturalmente em português por “serva de Lia”.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ nesta construção indica o pai ou beneficiário; “deu um filho a Jacó” preserva explicitamente essa relação.
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo singular indefinido é vertido naturalmente com o artigo indefinido em português.
