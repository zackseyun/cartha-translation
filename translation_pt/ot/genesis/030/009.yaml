base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: pt
  text: Quando Lia viu que tinha parado de ter filhos[a], tomou Zilpa, sua serva[b], e a deu a Jacó como esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tinha deixado de dar à luz».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «sua escrava». O termo hebraico indica uma mulher em condição servil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando Lia viu
  rationale: A forma narrativa com waw consecutivo faz a ação avançar; «quando» expressa naturalmente em português a relação temporal com as ações seguintes.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo do que Lia percebeu, e não uma oração causal.
- source_word: עָמְדָה מִלֶּדֶת
  choice: tinha parado de ter filhos
  rationale: A construção idiomática עמד + מן + infinitivo significa parar ou cessar uma atividade. «Ter filhos» comunica com naturalidade o sentido contextual de dar à luz.
- source_word: שִׁפְחָתָהּ
  choice: sua serva
  rationale: שִׁפְחָה designa uma mulher em condição servil. «Serva» é corrente, digna e mantém tanto o gênero quanto a posição subordinada, sem sugerir indevidamente a idade de Zilpa.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: A expressão preserva a linguagem matrimonial explícita do hebraico, sem substituí-la pela categoria técnica «concubina», ausente neste versículo.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: Representa com naturalidade o objeto indireto introduzido por ל nesta construção.
theological_decisions:
- issue: Condição de Zilpa na casa e linguagem matrimonial
  choice: Manter simultaneamente «sua serva» e «como esposa».
  alternative: Usar «escrava» ou «serva particular» para שִׁפְחָה, ou «concubina» para לְאִשָּׁה.
  rationale: O texto identifica Zilpa pela condição subordinada de שִׁפְחָה e, ao mesmo tempo, emprega linguagem matrimonial explícita, לְאִשָּׁה. A tradução conserva essa tensão sem suavizá-la nem impor uma classificação posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência natural, sem omitir elementos do hebraico. Todos os marcadores de notas aparecem no texto principal.
