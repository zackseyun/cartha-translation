    rationale: O hebraico diz literalmente que Deus removeu «minha desonra/reprovação»; o possessivo já situa a condição na falante.
  - severity: low
    issue: «vergonha» como termo principal pode enfraquecer a dimensão de desonra pública.
    rationale: חֶרְפָּה abrange vergonha, opróbrio e desonra social. «Desonra» é mais preciso como leitura principal, mantendo alternativas na nota.
