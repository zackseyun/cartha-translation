  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: pt
  text: 'Ela engravidou, deu à luz um filho e disse: “Deus removeu a minha desonra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha vergonha” ou “o meu opróbrio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Ela engravidou
  rationale: O verbo הרה indica conceber ou ficar grávida. “Engravidou” é claro, natural e preserva a sequência narrativa.
- source_word: וַתֵּלֶד בֵּן
  choice: e deu à luz um filho
  rationale: A expressão ילד בֵּן indica diretamente o nascimento de um filho; “deu à luz um filho” é corrente e digna em português moderno.
- source_word: וַתֹּאמֶר
  choice: Então disse
  rationale: O wayyiqtol dá continuidade à narrativa. “Então” expressa naturalmente essa progressão sem acrescentar uma relação causal indevida.
- source_word: אָסַף
  choice: tirou de mim
  rationale: Neste contexto, אסף tem o sentido de retirar ou remover. A formulação comunica de modo idiomático que Deus pôs fim à condição de vergonha experimentada por Raquel.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo singular e o contexto indicam referência ao único Deus.
- source_word: חֶרְפָּתִי
  choice: a minha vergonha
  rationale: חֶרְפָּה pode indicar vergonha, desonra ou opróbrio, especialmente uma desonra social. “Vergonha” é amplamente compreensível e preserva o peso emocional e público do termo.
theological_decisions:
- issue: Sentido singular de אֱלֹהִים
  choice: Deus
  alternative: deuses
  rationale: A concordância verbal no singular e o contexto exigem um referente singular, sem necessidade de expansão teológica.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e boa legibilidade brasileira. A tradução mantém a dimensão social de חֶרְפָּה e usa uma nota para registrar alternativas lexicais legítimas.
