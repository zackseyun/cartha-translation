  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: pt
  text: Bila engravidou e deu a Jacó um filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Bila ficou grávida e deu a Jacó um filho”.'
