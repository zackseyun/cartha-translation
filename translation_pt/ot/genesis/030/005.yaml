lexical_decisions:
- source_word: וַתַּהַר
  choice: engravidou
  rationale: O verbo הרה indica que alguém ficou grávida ou concebeu. “Engravidou” é claro, natural e preserva a sequência narrativa.
- source_word: בִּלְהָה
  choice: Bila
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O verbo ילד, neste contexto, significa dar à luz. A expressão é corrente e digna em português moderno.
- source_word: לְיַעֲקֹב
  choice: para Jacó
  rationale: A preposição ל marca a relação do nascimento com Jacó; “para Jacó” conserva essa construção sem transformá-la simplesmente em uma indicação de paternidade.
- source_word: בֵּן
  choice: um filho
  rationale: בֵּן significa “filho”; o artigo indefinido produz uma frase natural em português.
