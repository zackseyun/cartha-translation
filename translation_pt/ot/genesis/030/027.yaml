base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: pt
  text: 'Então Labão lhe disse: “Se encontrei favor aos seus olhos, por favor, fique.[a] Descobri por meio de adivinhação[b] que Yahweh me abençoou por sua causa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pedido “fique” não aparece expresso no hebraico, mas é subentendido pela frase e pelo contexto.
    reason: supplied_ellipsis
  - marker: b
    text: 'Ou: “Interpretei os presságios”. O verbo hebraico pode indicar adivinhação ou leitura de presságios; em alguns contextos, também tem sido entendido como “aprendi pela experiência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Se achei favor aos seus olhos, por favor, fique
  rationale: Preserva a imagem do idioma hebraico ‘achar favor aos olhos de alguém’. A partícula נָא dá tom cortês ao pedido e é expressa por ‘por favor’. Como o pedido fica elíptico no hebraico, ‘fique’ é acrescentado com base no contexto imediato.
- source_word: נִחַשְׁתִּי
  choice: Descobri por meio de adivinhação
  rationale: No piel, o verbo נחשׁ normalmente se refere à adivinhação ou interpretação de presságios. A formulação comunica tanto o resultado obtido quanto o meio empregado, sem atenuar o sentido lexical mais forte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְבָרֲכֵנִי
  choice: me abençoou
  rationale: Traduz diretamente o verbo ברך e expressa a bênção já recebida por Labão.
- source_word: בִּגְלָלֶךָ
  choice: por sua causa
  rationale: Expressa de modo natural em português a relação causal indicada pela preposição hebraica.
- source_word: לָבָן
  choice: Labão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. ‘Yahweh’ preserva o nome pessoal, sem substituí-lo por um título.
- issue: Natureza do conhecimento alegado por Labão
  choice: Descobri por meio de adivinhação
  alternative: Aprendi pela experiência
  rationale: O verbo hebraico favorece o sentido de adivinhação ou leitura de presságios. A tradução mantém esse sentido sem afirmar que a prática de Labão era legítima ou que sua interpretação tinha aprovação divina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva o idioma ‘achar favor aos olhos’ por ser compreensível e refletir a forma hebraica; explicita apenas a elipse necessária para a coerência do pedido.
