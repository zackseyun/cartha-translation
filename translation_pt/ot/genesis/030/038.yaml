translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “rebanho ... rebanho” foi mantida por corresponder à ênfase espacial do hebraico. A expressão “entravam no cio” preserva a imagem lexical sem tornar explícito além do texto o acasalamento implícito.
