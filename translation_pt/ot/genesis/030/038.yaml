base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: pt
  text: Ele colocou as varas que havia descascado nos canais, nos bebedouros de água[a], onde o rebanho vinha beber, diante do rebanho; e os animais entravam no cio[b] quando vinham beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega dois termos relacionados, que podem ser traduzidos por “canais” e “bebedouros de água”. Provavelmente ambos descrevem com mais detalhes a mesma área de dar água aos animais, não necessariamente dois lugares distintos.
    reason: lexical_alternative
  - marker: b
    text: Ou “acasalavam”. O verbo hebraico significa mais literalmente que os animais ficavam aquecidos ou entravam no cio; o acasalamento é sugerido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: colocou
  rationale: Expressa de modo natural o ato concreto de pôr algo em determinada posição.
- source_word: הַמַּקְלוֹת
  choice: as varas
  rationale: No contexto, são os galhos ou bastões que Jacó havia preparado; “varas” mantém a ligação com o versículo anterior e é corrente em português.
- source_word: אֲשֶׁר פִּצֵּל
  choice: que havia descascado
  rationale: O verbo descreve a retirada de partes da casca para deixar faixas claras; o mais-que-perfeito composto indica que isso já havia sido feito.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: nos canais dos bebedouros
  rationale: Os dois termos relacionados descrevem a área onde os animais bebiam. A formulação conserva a imagem concreta sem sugerir necessariamente dois locais distintos.
- source_word: אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת
  choice: aonde o rebanho vinha beber
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” é o equivalente coletivo natural. “Aonde” comunica o movimento até o lugar de beber.
- source_word: לְנֹכַח הַצֹּאן
  choice: diante do rebanho
  rationale: Mantém tanto a ideia espacial de algo posto à vista dos animais quanto a repetição explícita do substantivo no hebraico.
- source_word: וַיֵּחַמְנָה
  choice: os animais entravam no cio
  rationale: O verbo significa literalmente ficar aquecido ou entrar no cio. Esta tradução preserva o sentido lexical, deixando que o contexto implique o acasalamento.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: quando vinham beber
  rationale: A construção infinitiva indica a circunstância temporal e, no contexto narrativo, uma ação recorrente.
