base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: pt
  text: 'E Lia disse: “Deus me presenteou com um bom presente. Desta vez, meu marido me honrará[a], pois lhe dei seis filhos.” E deu ao menino o nome de Zebulom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morará comigo”. O verbo hebraico é raro e forma um jogo de palavras com o nome Zebulom; seu sentido pode envolver tanto a ideia de honrar Lia como a de morar ou permanecer com ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב
  choice: Deus me presenteou com um bom presente
  rationale: Preserva, em português natural, a repetição etimológica entre o verbo זבד e o substantivo זֵבֶד, expressando a ideia de conceder algo como dádiva.
- source_word: הַפַּעַם
  choice: Desta vez
  rationale: Equivalente idiomático claro no contexto da esperança de Lia após este nascimento.
- source_word: יִזְבְּלֵנִי
  choice: me honrará
  rationale: Expressa uma interpretação lexical bem atestada e adequada à esperança de Lia de receber maior consideração do marido, sem ocultar a alternativa incerta, registrada em nota.
- source_word: אִישִׁי
  choice: meu marido
  rationale: É o equivalente português natural e inequívoco no contexto conjugal.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: lhe dei seis filhos
  rationale: Formulação portuguesa corrente que comunica o parto e mantém a referência ao marido em לוֹ; neste contexto, 'filhos' designa filhos homens.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: E deu ao menino o nome de Zebulom
  rationale: Reproduz naturalmente em português a fórmula hebraica de nomeação; 'ao menino' explicita apenas o referente já evidente.
- source_word: זְבֻלוּן
  choice: Zebulom
  rationale: Adota a forma tradicional e amplamente reconhecida do nome bíblico em português.
theological_decisions:
- issue: Sentido do raro verbo יִזְבְּלֵנִי
  choice: me honrará
  alternative: morará comigo / permanecerá comigo
  rationale: O verbo raro permite mais de uma compreensão e participa de um jogo sonoro com Zebulom. O texto principal adota o sentido de honra ou consideração, apropriado ao contexto, enquanto a nota preserva a alternativa ligada à convivência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição 'presenteou com um bom presente' é deliberada para refletir o jogo de palavras hebraico. A ambiguidade do verbo raro foi preservada em nota.
