  naturalness: O português é moderno, claro e natural. «Não lhe tinha dado filhos» soa um pouco mais idiomático do que «não tinha dado filhos a Jacó», preservando a mesma relação expressa no hebraico.
  terminology: «Filhos» é apropriado para בָּנִים neste contexto, sem restringir indevidamente o sentido a crianças do sexo masculino. A nota a deve evitar apresentar «filhos homens» como se fosse a única glosa lexical. A nota b atualmente mistura uma alternativa interpretativa com uma alegação de literalidade imprecisa.
