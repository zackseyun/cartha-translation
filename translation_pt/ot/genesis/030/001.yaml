base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: pt
  text: 'Quando Raquel viu que não lhe tinha dado filhos, sentiu inveja da irmã e disse a Jacó: “Dê-me filhos[a]; senão, morro![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos”; neste contexto, o termo pode referir-se a filhos ou descendentes em geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vou morrer!”; literalmente, “morta estou eu”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: Quando Raquel viu
  rationale: A construção narrativa liga a percepção de Raquel à reação que vem em seguida; “quando” expressa essa relação temporal com naturalidade em português.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: que não tinha dado filhos a Jacó
  rationale: O verbo יָלַד, tendo uma mulher como sujeito, significa dar à luz ou ter filhos. O mais-que-perfeito composto situa a ausência de filhos antes da reação de Raquel, e “a Jacó” preserva a relação indicada por לְ.
- source_word: וַתְּקַנֵּא ... בַּאֲחֹתָהּ
  choice: sentiu inveja da irmã
  rationale: Neste contexto, קנא descreve a inveja provocada pela fecundidade da irmã. A formulação é atual e natural, sem atenuar a emoção do texto.
- source_word: הָבָה לִּי בָנִים
  choice: Dê-me filhos
  rationale: Embora בָנִים possa significar formalmente “filhos homens”, também pode designar descendentes ou filhos em geral; o contexto é o desejo de Raquel de ter descendência.
- source_word: וְאִם אַיִן
  choice: senão
  rationale: A expressão introduz diretamente a consequência extrema caso a exigência não seja atendida.
- source_word: מֵתָה אָנֹכִי
  choice: morro!
  rationale: A expressão hebraica é enfática e pode apresentar a morte como estado ou resultado iminente. “Morro!” conserva a concisão, o desespero e a força hiperbólica da fala.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição do nome “Raquel” no hebraico foi substituída por sujeito implícito na segunda oração para evitar rigidez em português, sem perda de referência.
