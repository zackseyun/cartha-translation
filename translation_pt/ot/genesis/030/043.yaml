  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female slaves and male slaves and camels and donkeys.
translation:
  language: pt
  text: E o homem prosperou muitíssimo e passou a ter muitos rebanhos, escravas e escravos[a], camelos e jumentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servas e servos”. Os termos hebraicos também podem designar criados domésticos, mas aqui essas pessoas são enumeradas entre os bens adquiridos pelo homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: prosperou muitíssimo
  rationale: O verbo פָּרַץ sugere irromper, expandir-se ou aumentar de modo extraordinário; neste contexto, descreve o grande crescimento dos bens do homem. “Prosperou muitíssimo” comunica naturalmente tanto o resultado quanto a forte intensidade da repetição מְאֹד מְאֹד.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o substantivo comum do hebraico, que no contexto se refere a Jacó, sem substituir a expressão pelo nome próprio.
- source_word: וַיְהִי לוֹ
  choice: passou a ter
  rationale: Expressa a posse resultante e o desenvolvimento narrativo, em vez do sentido mais estático de “tinha”.
- source_word: צֹאן רַבּוֹת
  choice: muitos rebanhos
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; a formulação preserva a ideia de abundância.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: escravas e escravos
  rationale: Os termos podem designar servas e servos domésticos, mas também pessoas em condição de escravidão. Como aparecem entre os bens adquiridos, a tradução explícita evita suavizar a realidade social retratada e conserva a distinção de gênero.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: camelos e jumentos
  rationale: Equivalentes modernos e correntes dos nomes hebraicos dos animais.
theological_decisions:
- issue: Tradução dos termos relativos a trabalhadores domésticos como escravos ou servos
  choice: escravas e escravos
  alternative: servas e servos
  rationale: Embora ambos os termos possam assumir sentidos domésticos mais gerais, sua inclusão numa enumeração dos bens que o homem passou a possuir torna saliente a condição de dependência e propriedade. “Escravas e escravos” preserva essa realidade sem a atenuar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Muitíssimo” preserva a intensidade enfática sem reproduzir de modo artificial “muito, muito”; a enumeração mantém um fluxo cumulativo natural.
