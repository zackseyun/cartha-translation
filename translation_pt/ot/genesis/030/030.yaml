revisions:
- from: Pois o pouco que você tinha antes de mim aumentou até se tornar uma abundância, e Yahweh abençoou você com a minha chegada.[a] E agora, quando também farei algo pela minha própria casa?[b]
  to: Pois o pouco que você tinha antes de mim aumentou até se tornar abundante, e Yahweh abençoou você com a minha chegada.[a] E agora, quando também farei algo pela minha própria casa?[b]
