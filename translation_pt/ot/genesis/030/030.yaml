base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: pt
  text: Pois o pouco que você tinha antes de mim aumentou até se tornar abundante, e Yahweh abençoou você com a minha chegada.[a] E agora, quando também farei algo pela minha própria casa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao meu pé”; a expressão pode significar “com a minha chegada” ou “por minha causa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando também proverei para a minha própria família?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: o pouco que você tinha antes de mim
  rationale: Mantém a referência à pequena quantidade de bens que Labão possuía antes da presença e do serviço de Jacó, preservando a forma temporalmente aberta de לְפָנַי.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: aumentou até se tornar uma abundância
  rationale: Expressa tanto o crescimento vigoroso sugerido por פרץ quanto o resultado abundante indicado por לָרֹב, em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְרַגְלִי
  choice: com a minha chegada
  rationale: Traduz o sentido idiomático contextual de bênção associada à chegada de Jacó, sem impor exclusivamente uma leitura causal.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: quando também farei algo pela minha própria casa?
  rationale: Preserva a generalidade do verbo עשה e o contraste enfático de גַם אָנֹכִי; 'casa' abrange o lar ou a família de Jacó.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração identifica explicitamente o nome próprio presente no hebraico e evita trocá-lo silenciosamente por um título.
- issue: Alcance de לְרַגְלִי na afirmação da bênção
  choice: com a minha chegada
  alternative: por minha causa; por onde quer que eu andasse; aos meus pés
  rationale: O contexto favorece a associação temporal entre a chegada de Jacó e a prosperidade de Labão, mas a nota registra o possível matiz causal sem fazer da bênção uma reivindicação teológica mais forte do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução principal conserva a generalidade de עשה (“fazer algo”) e esclarece em nota a alternativa econômica implícita (“prover”).
