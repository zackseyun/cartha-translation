  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: pt
  text: 'Ele lhe disse: “Você sabe como trabalhei para você e como o seu rebanho esteve comigo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e o que o seu rebanho foi comigo”. A expressão hebraica pode referir-se à condição do rebanho de Labão enquanto estava com Jacó, possivelmente incluindo como ele prosperou sob os cuidados dele, e não apenas à sua localização.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Ele lhe disse
  rationale: Expressa naturalmente a sequência narrativa e mantém o complemento indireto do hebraico.
- source_word: אַתָּה יָדַעְתָּ
  choice: Você sabe
  rationale: O perfeito do verbo de estado tem sentido presente; o pronome independente dá destaque ao interlocutor, suficientemente comunicado pela ordem direta em português.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: como trabalhei para você
  rationale: Neste contexto laboral, עבד indica trabalhar a serviço de alguém. A formulação é corrente e conserva a relação entre Jacó e Labão.
- source_word: מִקְנְךָ
  choice: o seu rebanho
  rationale: מִקְנֶה é um coletivo que abrange os animais domésticos de criação; “rebanho” é claro e natural em português, embora o referente possa incluir rebanhos e manadas.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: como o seu rebanho prosperou sob os meus cuidados
  rationale: A construção literalmente diz como o rebanho “esteve comigo”, mas, no contexto imediato, aponta para sua condição e crescimento enquanto estava entregue a Jacó. A tradução explicita o sentido provável sem ocultar a forma literal, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Trabalhei para você” evita a possível ambiguidade devocional de “servi você”, e “sob os meus cuidados” torna explícita a relação de responsabilidade sugerida pelo contexto.
