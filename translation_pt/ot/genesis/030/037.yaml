  source_fidelity: 'A tradução transmite adequadamente as espécies de madeira, a ação de retirar a casca e o resultado de expor a parte branca. Contudo, “varas verdes” faz “verdes” modificar também amendoeira e plátano, embora לַח esteja ligado diretamente apenas ao álamo. Além disso, “descascou nelas faixas brancas” é pouco preciso em português: pode sugerir que Jacó retirou faixas que já eram brancas, em vez de produzir marcas brancas ao remover a casca.'
  naturalness: O registro é claro e apropriado, mas a formulação da ação de descascar pode ser mais idiomática e visualmente inequívoca. “Recém-cortada” explica bem o valor contextual de לַח.
  terminology: “Jacó”, “vara”, “álamo”, “amendoeira”, “plátano” e “descascou” são escolhas adequadas. As notas para amendoeira e plátano preservam alternativas tradicionais relevantes do histórico de auditoria lexical, sem apresentar tais alternativas como preferíveis.
  issues:
