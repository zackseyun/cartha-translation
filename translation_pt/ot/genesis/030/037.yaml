revisions:
- from: Então Jacó pegou para si varas verdes de álamo[a], de amendoeira e de plátano e descascou nelas faixas brancas, deixando à mostra o branco das varas.
  to: 'Então Jacó pegou para si varas: uma de álamo recém-cortada[a], uma de amendoeira[b] e uma de plátano[c]. Ele as descascou, fazendo nelas faixas brancas e deixando à mostra a parte branca das varas.'
  rationale: A revisão limita “recém-cortada” ao álamo, conforme a ligação sintática de לַח, e reformula a descrição do descascamento para deixar claro que as faixas brancas são produzidas pela exposição da madeira. As notas lexicais para as duas identificações arbóreas que divergem de traduções tradicionais foram acrescentadas para manter o audit trail inglês e registrar a incerteza sem alterar o texto principal.
