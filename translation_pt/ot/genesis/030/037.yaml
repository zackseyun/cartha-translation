translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Preferiu-se “varas verdes” para indicar madeira recém-cortada, e nomes botânicos correntes no singular coletivo após a preposição. As alternativas antigas “aveleira” e “castanheiro” não foram incluídas em notas por serem menos prováveis e não essenciais à leitura.
