  - severity: medium
    issue: “Descascou nelas faixas brancas” é semanticamente ambíguo e pouco natural.
    rationale: A construção pode indicar a remoção de faixas previamente brancas. O hebraico descreve a remoção parcial da casca de modo a tornar visível a brancura da madeira; convém exprimir as faixas como resultado dessa ação.
