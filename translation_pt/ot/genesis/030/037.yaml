  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: pt
  text: 'Então Jacó pegou para si varas: uma de álamo recém-cortada[a], uma de amendoeira[b] e uma de plátano[c]. Ele as descascou, fazendo nelas faixas brancas e deixando à mostra a parte branca das varas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estoraque fresco”; a identificação exata de לִבְנֶה é incerta, embora “álamo” seja uma tradução comum.
    reason: lexical_alternative
  - marker: b
    text: Traduções mais antigas frequentemente trazem “aveleira” para לוּז, mas “amendoeira” é mais provável.
    reason: lexical_alternative
  - marker: c
    text: Traduções mais antigas frequentemente trazem “castanheiro” para עֶרְמוֹן, mas “plátano” é mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: varas
  rationale: Designa galhos ou pedaços de madeira cortados; “varas” é concreto, natural em português e adequado ao procedimento descrito.
- source_word: לִבְנֶה לַח
  choice: varas verdes de álamo
  rationale: לִבְנֶה é comumente identificado como álamo, embora a espécie exata seja incerta; לַח indica madeira fresca, ainda verde. A nota registra a incerteza botânica.
- source_word: לוּז
  choice: amendoeira
  rationale: A identificação com a amendoeira é lexicalmente mais provável do que a tradução tradicional por aveleira.
- source_word: עֶרְמוֹן
  choice: plátano
  rationale: O termo provavelmente designa o plátano oriental; a antiga identificação com o castanheiro é menos provável.
- source_word: וַיְפַצֵּל
  choice: descascou
  rationale: No contexto, Jacó remove partes da casca das varas, expondo a madeira clara por baixo.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: faixas brancas
  rationale: A expressão descreve as marcas claras produzidas pela remoção parcial da casca; “faixas brancas” comunica naturalmente o resultado visual.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: deixando à mostra o branco
  rationale: Reproduz a ideia de descobrir ou expor a parte branca da madeira.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: das varas
  rationale: Expressa de modo natural em português que a parte branca exposta pertencia às varas, sem forçar a construção hebraica com עַל.
