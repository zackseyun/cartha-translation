  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: pt
  text: 'Assim, mais tarde[b], minha honestidade dará testemunho a meu favor[a], quando você vier conferir o meu pagamento[c]: toda cabra que não for salpicada e malhada, e todo cordeiro que não for de cor escura[d], serão considerados roubados se estiverem comigo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha justiça responderá por mim” ou “minha integridade dará testemunho a meu favor”. Aqui, o termo hebraico se refere à conduta correta de Jacó, que poderá ser comprovada no acordo sobre o pagamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no dia de amanhã”; a expressão pode significar “amanhã” ou, de modo mais geral, “no futuro”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “quando você vier acerca do meu pagamento diante de você”. A ideia contextual é que Labão examinará os animais recebidos por Jacó.
    reason: translation_clarity
  - marker: d
    text: Ou “marrom”. O termo hebraico designa um animal de coloração escura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי צִדְקָתִי
  choice: minha honestidade dará testemunho a meu favor
  rationale: A expressão personifica a retidão de Jacó como testemunha que o vindicará. “Honestidade” comunica aqui a conduta correta e verificável no acordo salarial, enquanto “dará testemunho a meu favor” reproduz naturalmente a força forense de ענה ב.
- source_word: בְּיוֹם מָחָר
  choice: mais tarde
  rationale: Literalmente, “no dia de amanhã”; no contexto, a expressão aponta para uma verificação futura, não necessariamente para o dia seguinte.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: quando você vier conferir o meu pagamento
  rationale: A cláusula descreve Labão examinando posteriormente os animais que constituem o pagamento de Jacó. “Conferir” explicita de modo natural a ação contextual, e a presença de Labão já está indicada por “você vier”.
- source_word: נָקֹד וְטָלוּא
  choice: salpicada e malhada
  rationale: Os dois termos distinguem marcas pequenas de manchas ou áreas maiores; a tradução conserva ambos e mantém a conjunção hebraica.
- source_word: חוּם
  choice: de cor escura
  rationale: O termo indica coloração escura, possivelmente marrom, sem permitir determinar com segurança uma tonalidade exata.
- source_word: גָּנוּב הוּא אִתִּי
  choice: serão considerados roubados se estiverem comigo
  rationale: O hebraico é conciso e declara que qualquer animal fora das categorias acordadas, caso esteja em poder de Jacó, contará como roubado.
theological_decisions:
- issue: Sentido de צִדְקָתִי
  choice: honestidade
  alternative: justiça / retidão
  rationale: Neste acordo de remuneração, o termo se refere diretamente à integridade demonstrável de Jacó. A escolha evita impor um sentido técnico soteriológico, sem negar a amplitude ética do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita uma mistura artificial de registros. A formulação preserva a personificação da honestidade de Jacó e a distinção entre as marcas dos animais.
