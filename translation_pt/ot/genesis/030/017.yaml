  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: pt
  text: E Deus ouviu Lia[a]; ela engravidou e deu a Jacó um quinto filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus deu ouvidos a Lia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: atendeu
  rationale: Com אֶל, o verbo שׁמע pode indicar ouvir com atenção e responder favoravelmente. Em português, “atendeu” exprime de modo natural essa escuta eficaz no contexto, sem tornar explícito o meio da resposta.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No uso narrativo, refere-se claramente ao único Deus; “Deus” é a forma portuguesa natural.
- source_word: אֶל
  choice: incorporado em “atendeu Lia”
  rationale: A relação marcada por אֶל é expressa idiomaticamente pela regência direta de “atender” no sentido de dar ouvidos favoravelmente.
- source_word: לֵאָה
  choice: Lia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתַּהַר
  choice: ela engravidou
  rationale: Tradução moderna, clara e natural de הרה no relato de nascimento.
- source_word: וַתֵּלֶד
  choice: e deu
  rationale: Na construção completa “deu a Jacó um ... filho”, comunica de forma idiomática que ela deu à luz o filho, preservando a concisão narrativa.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: Preserva o valor do ל como destinatário ou referência relacional na expressão portuguesa “deu a Jacó um filho”.
- source_word: בֵּן
  choice: filho
  rationale: Equivalente comum e contextualmente apropriado para בֵּן em um relato de nascimento.
- source_word: חֲמִישִׁי
  choice: quinto
  rationale: O ordinal modifica diretamente “filho”, indicando que este foi o quinto filho dado a Jacó por Lia.
theological_decisions:
- issue: Resposta divina implícita em שׁמע אֶל
  choice: “Deus atendeu Lia”, indicando que Deus lhe deu ouvidos e respondeu favoravelmente.
  alternative: “Deus ouviu Lia.”
  rationale: O hebraico admite a tradução formal “ouviu”, mas שׁמע com אֶל frequentemente sugere atenção responsiva. “Atendeu” preserva essa nuance contextual sem acrescentar uma formulação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Atendeu” é mais natural que “escutou” para a nuance responsiva do hebraico; a alternativa formal é preservada em nota. A sequência breve mantém o ritmo narrativo do original.
