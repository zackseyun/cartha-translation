  source_fidelity: A exclamação “Que sorte!” comunica de modo plausível a leitura de בגד como expressão ligada a גד (“fortuna/boa sorte”) e preserva a relação com o nome Gade. Contudo, “Por isso” explicita uma relação causal mais forte do que a simples sequência narrativa do wayyiqtol; além disso, “ao menino” é uma explicitação desnecessária do pronome hebraico “seu/dele”.
  naturalness: O texto é claro e natural. “Então chamou-o Gade” é igualmente idiomático, mais conciso e mais próximo da sequência narrativa e da fórmula de nomeação.
  terminology: “Lia” e “Gade” são formas portuguesas estabelecidas. A nota deve apresentar a alternativa tradicional sem acrescentar “Chegou”, que não está expresso no hebraico e torna a alternativa indevidamente interpretativa.
