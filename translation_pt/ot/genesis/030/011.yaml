  text: 'E Lia disse[a]: “Que sorte!” Então chamou-o Gade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico בגד é difícil. Pode ser entendido como uma exclamação que significa “Que sorte!”; tradicionalmente, alguns traduzem “Uma tropa!” O nome Gade soa como a palavra hebraica envolvida no jogo de palavras.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol de אמר dá sequência à narrativa; “E ... disse” preserva essa progressão sem acrescentar uma nuance discursiva indevida.
- source_word: לֵאָה
  choice: Lia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בגד
  choice: Que sorte!
  rationale: A expressão hebraica é textualmente difícil, mas provavelmente constitui uma exclamação ligada a גד, “sorte/boa fortuna”, em jogo sonoro com o nome Gade. “Que sorte!” soa natural como exclamação em português.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Por isso, deu ao menino o nome de
  rationale: Em contexto de nomeação, קרא את שמו significa dar ou pôr um nome. A formulação natural em português explicita o referente e comunica a relação resultante entre a exclamação e o nome.
- source_word: גָּד
  choice: Gade
  rationale: Forma portuguesa tradicional do nome, ainda próxima o bastante do termo hebraico para que a nota explique o jogo de palavras.
