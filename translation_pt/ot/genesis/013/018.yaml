base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: pt
  text: Assim, Abrão mudou sua tenda, chegou e se estabeleceu junto aos carvalhos de Manre[a], que ficam em Hebrom. Ali construiu um altar para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terebintos de Manre”; o termo hebraico pode designar árvores grandes, como carvalhos ou terebintos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: mudou seu acampamento
  rationale: O verbo derivado de אהל descreve a ação de deslocar ou instalar a tenda. “Mudou seu acampamento” expressa em português natural o deslocamento de Abrão com sua tenda, sem antecipar o estabelecimento indicado pelo verbo seguinte.
- source_word: וַיָּבֹא
  choice: chegou
  rationale: No encadeamento narrativo, “chegou” comunica de modo claro o movimento até o local, embora o verbo hebraico também possa ser traduzido de forma mais geral como “veio”.
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: A forma verbal indica que Abrão passou a residir no lugar. “Se estabeleceu” é atual e preserva melhor essa ideia do que o mais temporário “ficou”.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: junto aos carvalhos de Manre
  rationale: אֵלֹנֵי designa árvores grandes e pode referir-se a carvalhos ou terebintos. “Carvalhos” é uma tradução tradicional e clara; a incerteza botânica é mantida em nota.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: A expressão localiza os carvalhos de Manre em Hebrom. A formulação concisa evita uma oração relativa pesada sem perder a informação geográfica.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Ali construiu um altar
  rationale: Preserva tanto o advérbio שָׁם, que destaca o lugar, quanto o sentido comum de מִזְבֵּחַ, “altar”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio e mantém a relação marcada pela preposição ל, aqui expressa naturalmente por “a”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” representa o nome próprio sem substituí-lo por um título; “SENHOR” e “Jeová” são tradições de tradução, mas não são exigidos pelo texto desta passagem.
- issue: Identificação das árvores em אֵלֹנֵי מַמְרֵא
  choice: carvalhos de Manre
  alternative: terebintos de Manre; grandes árvores de Manre
  rationale: A espécie exata não é segura. O texto principal usa a opção tradicional e inteligível “carvalhos”, enquanto a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Abrão”, “Manre” e “Hebrom” seguem formas portuguesas estabelecidas. A coordenação verbal conserva o ritmo narrativo hebraico sem recorrer a construções arcaicas.
