  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: pt
  text: ao lugar do altar que ele havia feito ali anteriormente. E ali Abrão invocou o nome de Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”. Outra forma é “Jeová”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “proclamou o nome de Yahweh” / “invocou Yahweh pelo nome”. A expressão hebraica pode transmitir tanto invocação quanto proclamação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מְקוֹם הַמִּזְבֵּחַ
  choice: ao lugar do altar
  rationale: Reproduz de modo natural a expressão locativa e mantém a referência definida ao altar mencionado anteriormente.
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: que ele havia feito ali no princípio
  rationale: O mais-que-perfeito situa a construção antes do retorno de Abrão; “feito” acompanha o sentido básico de עשה, e “no princípio” aponta para sua primeira passagem pelo local.
- source_word: וַיִּקְרָא שָׁם
  choice: E ali Abrão invocou
  rationale: “Invocou” expressa naturalmente em português o ato de dirigir-se a Deus, enquanto a nota preserva a possível nuance de proclamação. O nome explícito “Abrão” evita ambiguidade e corresponde ao sujeito hebraico.
- source_word: בְּשֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Com קרא, a expressão forma um idioma de invocação ou proclamação do nome divino; “Yahweh” translitera o nome pessoal יהוה.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto principal o caráter de nome pessoal do Tetragrama; a nota registra as formas tradicionais em português.
- issue: Sentido do idioma קרא בשם יהוה
  choice: invocou o nome de Yahweh
  alternative: proclamou o nome de Yahweh; chamou Yahweh pelo nome
  rationale: O hebraico pode abranger invocação cultual e proclamação. A tradução escolhe a formulação portuguesa mais natural sem ocultar a amplitude semântica, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a repetição de “ali” do hebraico e usa “Abrão”, forma tradicional e amplamente reconhecida do nome nesta etapa da narrativa.
