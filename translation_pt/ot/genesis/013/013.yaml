  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: pt
  text: Os homens de Sodoma eram extremamente maus e pecadores contra Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de Yahweh”.'
    reason: Alternativa lexical plausível para לַיהוָה, que pode indicar tanto o alvo da ofensa quanto aquele diante de quem o pecado é cometido.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי
  choice: Os homens de
  rationale: אַנְשֵׁי é o plural construto de אִישׁ e designa aqui os habitantes homens de Sodoma. O וְ inicial tem função de ligação no discurso e não precisa ser representado por uma conjunção explícita neste versículo explicativo.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: רָעִים
  choice: perversos
  rationale: No contexto moral, רָעִים descreve maldade ética. “Perversos” comunica essa força com naturalidade e dignidade em português.
- source_word: וְ/חַטָּאִים
  choice: e pecadores
  rationale: O termo predicativo plural caracteriza esses homens por seu pecado e mantém o paralelismo com רָעִים. “Pecadores” é mais direto e natural em português do que uma construção adjetival como “pecaminosos”.
- source_word: לַ/יהוָה
  choice: contra Yahweh
  rationale: Com linguagem de pecado, ל pode indicar aquele contra quem se comete a ofensa. “Contra Yahweh” preserva essa força relacional, enquanto a leitura locativa ou avaliativa plausível é registrada em nota.
- source_word: מְאֹד
  choice: extremamente
  rationale: מְאֹד intensifica fortemente a descrição. “Extremamente” preserva a ênfase de modo claro no português atual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de לַיהוָה junto de חַטָּאִים
  choice: contra Yahweh
  alternative: diante de Yahweh
  rationale: A preposição pode apresentar Yahweh como aquele contra quem se peca ou indicar que a conduta ocorre diante dele, sob seu olhar e juízo. A tradução principal expressa a ofensa contra Deus, e a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perversos” mantém a gravidade moral de רָעִים, e “pecadores” reproduz de forma direta a caracterização predicativa. A formulação evita acrescentar um marcador discursivo sem equivalente lexical explícito.
