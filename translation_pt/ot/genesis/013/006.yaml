- source_word: לָשֶׁבֶת יַחְדָּו
  choice: enquanto viviam juntos / continuar juntos
  rationale: ישׁב pode significar morar ou viver, e יחדו indica convivência na mesma região. A variação evita repetição pesada em português sem alterar o sentido.
- source_word: רְכוּשָׁם רָב
  choice: seus bens eram tantos
  rationale: רְכוּשׁ abrange posses e patrimônio, incluindo os rebanhos mencionados no contexto; רַב expressa grande quantidade.
