  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: pt
  text: 'E Yahweh disse a Abrão, depois que Ló se separou dele: “Por favor, levante os olhos e, do lugar onde você está, olhe para o norte, para o sul, para o leste e para o oeste.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: O waw mantém a continuidade narrativa com “E”, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio no texto-fonte.
- source_word: אָמַר אֶל אַבְרָם
  choice: disse a Abrão
  rationale: “Disse” é a forma narrativa natural de אמר; “Abrão” é a forma portuguesa tradicional e amplamente reconhecida do nome אַבְרָם.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: depois que Ló se separou dele
  rationale: A construção temporal com אַחֲרֵי e o infinitivo nifal indica que a fala ocorre após a separação de Ló; “dele” representa מֵעִמּוֹ sem explicitar além do hebraico que o referente é Abrão.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Por favor, levante os olhos
  rationale: A expressão conserva o imperativo idiomático “levantar os olhos”, enquanto “por favor” representa a partícula suavizadora נָא.
- source_word: וּרְאֵה מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: e, do lugar onde você está, olhe
  rationale: A ordem portuguesa natural antepõe o ponto de observação; “onde você está” comunica o valor locativo de שָׁם sem acrescentar que Abrão estivesse especificamente em pé.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: para o norte, para o sul, para o leste e para o oeste
  rationale: As formas direcionais em -ה são expressas de maneira clara e idiomática com “para o”; יָמָּה tem aqui o sentido direcional convencional de oeste.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” o trata como nome próprio e evita substituir o nome por um título; “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém a continuidade narrativa, o pedido suavizado por נָא e a sequência completa dos quatro pontos cardeais.
