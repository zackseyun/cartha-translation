reference: Genesis 13:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: pt
  text: E farei que a sua descendência[a] seja como o pó da terra. Se alguém[b] puder contar o pó da terra, então também se poderá contar a sua descendência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente” ou “descendentes”. O hebraico זֶרַע é um substantivo coletivo que pode designar a posteridade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um homem”; o masculino singular hebraico tem aqui sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: E farei que ... seja
  rationale: שׂוּם significa literalmente “pôr, colocar”, mas, com um objeto e uma comparação, tem aqui o sentido idiomático de fazer com que algo seja de determinada maneira.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: זֶרַע, literalmente “semente”, é um substantivo coletivo que neste contexto designa a posteridade de Abrão. “Descendência” é natural em português e mantém o valor coletivo.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: como o pó da terra
  rationale: Preserva de modo claro e direto a comparação e a imagem hebraica de uma multidão incontável.
- source_word: אֲשֶׁר אִם
  choice: Se
  rationale: A construção introduz a condição hipotética que desenvolve a comparação. Em português, iniciar uma nova frase com “Se” expressa essa relação com naturalidade, sem acrescentar uma finalidade inexistente.
- source_word: אִישׁ
  choice: alguém
  rationale: Embora אִישׁ seja formalmente masculino singular (“homem”), neste contexto tem força genérica. “Alguém” comunica essa referência indefinida com naturalidade; a forma literal é registrada em nota.
- source_word: לִמְנוֹת
  choice: contar
  rationale: O infinitivo de מנה significa enumerar ou contar; “contar” é a opção corrente e adequada à imagem.
- source_word: גַּם
  choice: também
  rationale: Marca a correspondência entre a possibilidade de contar o pó e a de contar a descendência.
- source_word: יִמָּנֶה
  choice: se poderá contar
  rationale: O nifal imperfeito, na conclusão da condição, exprime possibilidade passiva. A construção impessoal portuguesa mantém o sentido hipotético sem soar como uma previsão de que a contagem ocorrerá.
theological_decisions:
- issue: Sentido coletivo de זֶרַע na promessa a Abrão
  choice: a sua descendência
  alternative: a sua semente; os seus descendentes
  rationale: O versículo fala da posteridade de Abrão como um conjunto inumerável. “Descendência” conserva o caráter coletivo sem impor ao texto uma leitura exclusivamente singular ou especificamente messiânica.
- issue: Força genérica do substantivo masculino אִישׁ
  choice: alguém
  alternative: um homem
  rationale: A forma hebraica é masculina singular, mas funciona genericamente. A tradução principal comunica essa função em português atual, enquanto a nota preserva a forma lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada e a oração condicional foi separada em nova frase para maior naturalidade, mantendo a imagem, a hipótese e a correspondência do hebraico.
