base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: pt
  text: E seguiu viagem por etapas, desde o Neguebe até Betel, até o lugar onde sua tenda tinha estado no início, entre Betel e Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: E seguiu viagem
  rationale: No contexto de deslocamento com indicação de rota, expressa naturalmente a ideia de viajar, sem ampliar o sentido do verbo comum הלך.
- source_word: לְמַסָּעָיו
  choice: por etapas
  rationale: O plural de מַסָּע com ל descreve o deslocamento em etapas sucessivas, de acampamento em acampamento.
- source_word: מִנֶּגֶב
  choice: desde o Neguebe
  rationale: Neste contexto geográfico patriarcal, נֶגֶב designa mais provavelmente a região do Neguebe, não apenas o sul como direção.
- source_word: וְעַד בֵּית אֵל
  choice: até Betel
  rationale: עַד indica o limite ou destino alcançado; 'até Betel' é direto e natural em português.
- source_word: עַד הַמָּקוֹם
  choice: até o lugar
  rationale: Mantém a repetição de עַד, que primeiro dá o destino geral e depois especifica o local exato.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: onde sua tenda tinha estado
  rationale: '''Onde'' incorpora naturalmente שָׁם, e o mais-que-perfeito composto assinala que a tenda estivera ali antes da viagem narrada.'
- source_word: בַּתְּחִלָּה
  choice: no início
  rationale: Retoma o acampamento anterior de Abrão com uma expressão temporal clara e corrente.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: entre Betel e Ai
  rationale: Reproduz de modo idiomático a construção locativa hebraica e usa as formas portuguesas usuais dos topônimos.
