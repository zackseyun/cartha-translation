  rationale: 'A revisão elimina a intercalação parentética e sua pontuação problemática, mantendo sem alteração de sentido a sequência: a planície era bem irrigada antes da destruição, comparável ao jardim de Yahweh e à terra do Egito, na direção de Zoar. As âncoras e as notas permanecem correspondentes às expressões pertinentes.'
