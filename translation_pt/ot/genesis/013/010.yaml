  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: pt
  text: Ló ergueu os olhos e viu toda a planície do Jordão[a], que era toda bem irrigada antes de Yahweh destruir Sodoma e Gomorra, como o jardim de Yahweh[b], como a terra do Egito, na direção de Zoar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o vale do Jordão”; mais literalmente, “todo o círculo do Jordão”.
    reason: lexical_alternative
  - marker: b
    text: “O jardim de Yahweh” provavelmente evoca a fertilidade e a exuberância do Éden.
    reason: cross_reference
  - marker: c
    text: Ou “ao chegar a Zoar”. A expressão hebraica indica aproximação ou direção para Zoar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: ergueu os olhos
  rationale: Mantém a imagem do idioma hebraico para dirigir o olhar e soa natural em português narrativo.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toda a planície do Jordão
  rationale: כִּכָּר designa aqui a região plana ou distrito em torno do Jordão; “planície” comunica claramente o sentido geográfico sem impor a forma literal “círculo”.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: que era toda bem irrigada
  rationale: Reproduz a oração descritiva introduzida por כִּי e expressa a abundância de água indicada por מַשְׁקֶה. “Irrigada” também combina naturalmente com a posterior comparação com o Egito.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: isso antes de Yahweh destruir
  rationale: לִפְנֵי tem valor temporal, e שׁחת, neste contexto, indica a destruição das cidades. “Isso” esclarece em português que a observação descreve a região antes desse acontecimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּגַן יְהוָה
  choice: como o jardim de Yahweh
  rationale: Preserva a construção comparativa e sua provável evocação do jardim do Éden sem explicitar essa identificação no corpo do versículo.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: como a terra do Egito
  rationale: Mantém אֶרֶץ e o caráter geográfico e agrícola da comparação.
- source_word: בֹּאֲכָה צֹעַר
  choice: na direção de Zoar
  rationale: A expressão idiomática assinala aproximação ou direção; esta formulação é clara e evita transformar a segunda pessoa convencional do hebraico em uma interpelação direta ao leitor.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Referência do “jardim de Yahweh”
  choice: manter a expressão sem identificá-la explicitamente no texto como Éden
  alternative: como o jardim do Éden
  rationale: A alusão ao Éden é provável, mas o hebraico diz literalmente “jardim de Yahweh”; a tradução conserva a formulação e deixa a explicação para a nota.
translation_notes:
  register: Português moderno, digno e acessível, com ordem narrativa fluente. Os travessões isolam a observação temporal para que as comparações com o jardim de Yahweh e com o Egito continuem descrevendo a planície bem irrigada.
