base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: pt
  text: Assim, Ló escolheu para si toda a planície do Jordão e partiu para o leste[a]. E separaram-se um do outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do leste”. A expressão hebraica pode indicar tanto a direção do deslocamento como o ponto de partida.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: escolheu para si
  rationale: Preserva tanto o sentido de בחר, “escolher”, como o dativo reflexivo לוֹ, que destaca a escolha feita por Ló em benefício próprio.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toda a planície do Jordão
  rationale: כִּכָּר pode designar uma região circular ou distrito plano; neste contexto geográfico, “planície do Jordão” é claro, natural e suficientemente próximo da imagem hebraica.
- source_word: וַיִּסַּע
  choice: partiu
  rationale: נסע descreve levantar acampamento e seguir viagem. “Partiu” comunica naturalmente o movimento narrativo sem introduzir detalhes ausentes.
- source_word: מִקֶּדֶם
  choice: para o leste
  rationale: Adota a leitura direcional mais coerente com o contexto, mantendo em nota a possibilidade gramatical de indicar procedência.
- source_word: וַיִּפָּרְדוּ
  choice: separaram-se
  rationale: O nifal de פרד expressa separação recíproca; a forma pronominal portuguesa transmite essa reciprocidade.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: um do outro
  rationale: É a expressão portuguesa natural para o distributivo recíproco hebraico. Embora אָחִיו signifique literalmente “seu irmão”, aqui a locução inteira descreve a separação mútua entre Abrão e Ló.
theological_decisions:
- issue: Linguagem masculina de parentesco
  choice: um do outro
  alternative: cada homem de seu irmão
  rationale: A formulação hebraica é masculina, singular e distributiva, com o termo “irmão”; em português, porém, a tradução literal seria rígida e pouco idiomática. “Um do outro” preserva a reciprocidade no contexto de dois homens aparentados, sem acrescentar interpretação doutrinária.
- issue: Ambiguidade direcional de מִקֶּדֶם
  choice: para o leste
  alternative: desde o leste
  rationale: A expressão admite tanto direção como ponto de origem. O contexto favorece o deslocamento para o leste, mas a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação narrativa hebraica foi mantida sem excesso de repetições; o marcador [a] aparece imediatamente após a expressão ambígua a que se refere.
