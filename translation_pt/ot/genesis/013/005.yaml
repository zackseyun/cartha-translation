base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: pt
  text: E Ló, que acompanhava Abrão, também tinha rebanhos[a], gado e tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por «rebanhos» designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: A combinação da conjunção com o advérbio acrescenta Ló ao relato e destaca que ele igualmente possuía bens; em português, «Também Ló» preserva de modo natural esse valor aditivo.
- source_word: לְלוֹט ... הָיָה
  choice: Ló ... tinha
  rationale: O לְ marca o possuidor numa construção existencial, literalmente «havia para Ló»; «Ló tinha» é a formulação idiomática em português.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: que acompanhava Abrão
  rationale: O particípio identifica Ló como aquele que seguia em companhia de Abrão. O imperfeito «acompanhava» comunica o caráter contínuo da ação.
- source_word: צֹאן
  choice: rebanhos de ovelhas e cabras
  rationale: O termo designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. A explicitação evita que «rebanhos» seja entendido de modo vago.
- source_word: וּבָקָר
  choice: manadas de gado
  rationale: בָּקָר refere-se a bovinos; «manadas de gado» mantém o paralelismo coletivo com os rebanhos e expressa claramente a espécie de criação.
- source_word: וְאֹהָלִים
  choice: e tendas
  rationale: O plural refere-se diretamente a tendas, parte dos bens e do acampamento de Ló.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Abrão» segue a forma portuguesa tradicional para אַבְרָם e distingue este nome de «Abraão», adotado posteriormente no relato.
