  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: pt
  text: Abrão habitou na terra de Canaã, e Ló habitou nas cidades da planície e armou sua tenda até Sodoma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e moveu sua tenda até Sodoma”. O verbo hebraico pode significar armar uma tenda ou deslocar a tenda; a expressão indica que o acampamento de Ló se estendia até Sodoma, sem afirmar explicitamente que ele já residia dentro da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: habitou
  rationale: O verbo indica morar ou residir. “Habitou” preserva o aspecto durativo e é digno e compreensível em português atual.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo explícito אֶרֶץ (“terra”) e a formulação geográfica natural em português.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: nas cidades da planície
  rationale: Neste contexto, כִּכָּר designa a planície ou região circular do Jordão; “planície” é claro e preserva a relação construta no plural.
- source_word: וַיֶּאֱהַל
  choice: armou suas tendas
  rationale: A forma verbal derivada de אהל expressa armar tenda ou acampar. O plural natural em português representa o acampamento doméstico e pastoril de Ló.
- source_word: עַד סְדֹם
  choice: até Sodoma
  rationale: עַד assinala o limite ou alcance espacial. “Até Sodoma” conserva essa extensão, sem afirmar necessariamente que Ló já morava dentro da cidade.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לוֹט
  choice: Ló
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Emprega a forma tradicional do topônimo em português.
