base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: pt
  text: Abrão[a] era muito rico em rebanhos, prata e ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Abrão era muito rico em rebanhos, prata e ouro.”'
    reason: O וְ inicial pode ser traduzido explicitamente como “E” ou entendido como simples ligação narrativa.
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abrão
  rationale: O nome é apresentado na forma portuguesa tradicional. O וְ inicial liga o versículo à narrativa anterior, mas pode ficar implícito em português corrente sem perda da continuidade; a alternativa explícita é indicada em nota.
- source_word: כָּבֵד
  choice: rico
  rationale: Embora o sentido básico seja “pesado”, neste contexto, seguido das categorias de bens, o termo é idiomático e descreve grande riqueza. “Rico” comunica isso de modo claro e natural.
- source_word: מְאֹד
  choice: muito
  rationale: O advérbio intensifica a riqueza de Abrão; “muito” é o equivalente moderno e direto.
- source_word: בַּ/מִּקְנֶה
  choice: em rebanhos
  rationale: O substantivo designa bens adquiridos, especialmente animais domésticos em manadas e rebanhos. “Rebanhos” evita restringir o sentido apenas a bovinos e se ajusta ao contexto patriarcal.
- source_word: בַּ/כֶּסֶף
  choice: prata
  rationale: A preposição introduz uma categoria em que consistia a riqueza. Em português, não é necessário repetir “em” diante de cada item da enumeração.
- source_word: וּ/בַ/זָּהָב
  choice: e ouro
  rationale: Mantém a última categoria de riqueza e a coordenação do hebraico, com elipse natural da preposição em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com enumeração fluida. “Rico” preserva o sentido idiomático de כָּבֵד, e “rebanhos” representa de forma abrangente os animais que constituíam parte da riqueza patriarcal.
