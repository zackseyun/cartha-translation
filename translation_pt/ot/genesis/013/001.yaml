  text: וַ/יַּעַל֩ אַבְרָ֨ם מִ/מִּצְרַ֜יִם ה֠וּא וְ/אִשְׁתּ֧/וֹ וְ/כָל אֲשֶׁר ל֛/וֹ וְ/ל֥וֹט עִמּ֖/וֹ הַ/נֶּֽגְבָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: pt
  text: Assim, Abrão subiu do Egito, com sua mulher, tudo o que possuía e Ló, que o acompanhava, rumo ao Neguebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rumo ao sul”. A palavra hebraica négev pode designar tanto a região meridional conhecida como Neguebe quanto, de modo mais geral, o sul ou a região sul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido usual de עלה, “subir”, e o modo bíblico de descrever a viagem do Egito para a terra de Canaã.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Tradução direta da preposição מן com o nome do lugar.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: com sua mulher
  rationale: No encadeamento português, expressa naturalmente que Abrão viajou acompanhado dela, sem perder a referência explícita do hebraico.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: tudo o que possuía
  rationale: Mantém a abrangência da expressão, que pode incluir bens, animais e pessoas ligadas à casa, sem restringi-la apenas a objetos materiais.
- source_word: וְלוֹט עִמּוֹ
  choice: e Ló, que o acompanhava
  rationale: Torna natural em português a menção acrescentada de Ló como companheiro da viagem.
- source_word: הַנֶּגְבָּה
  choice: rumo ao Neguebe
  rationale: Trata נֶגֶב como nome da região meridional e representa o sufixo direcional; “rumo a” preserva a ideia de movimento sem exigir uma chegada já concluída.
