base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: pt
  text: Não está toda a terra diante de você? Por favor, separe-se de mim. Se você for para a esquerda[a], eu irei para a direita; e, se você for para a direita, eu irei para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é elíptico nas orações condicionais; literalmente: “Se a esquerda, então irei para a direita; e, se a direita, então irei para a esquerda”. A tradução acrescenta “você for para” para maior clareza em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não está...?
  rationale: Introduz uma pergunta retórica que espera concordância; esta formulação é natural em português e preserva sua força.
- source_word: כָל הָאָרֶץ
  choice: toda a terra
  rationale: Neste contexto, designa a extensão de terra disponível diante de Ló, não o planeta inteiro.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Preserva a imagem espacial hebraica e também comunica que a terra estava disponível para a escolha de Ló.
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: Por favor, separe-se de mim
  rationale: O imperativo nifal de פרד expressa separação, enquanto נָא dá ao pedido um tom cortês. A forma pronominal é natural em português.
- source_word: אִם הַשְּׂמֹאל
  choice: Se você for para a esquerda
  rationale: O hebraico é elíptico; o verbo de movimento é suprido pelo contexto para produzir português claro sem definir além do necessário a natureza da escolha.
- source_word: וְאֵימִנָה
  choice: eu irei para a direita
  rationale: A forma direcional derivada de ימין indica movimento para o lado direito.
- source_word: וְאִם הַיָּמִין
  choice: e, se você for para a direita
  rationale: Repete de modo claro e paralelo o verbo de movimento implícito no hebraico.
- source_word: וְאַשְׂמְאִילָה
  choice: eu irei para a esquerda
  rationale: A forma direcional derivada de שׂמאל exprime o movimento correspondente de Abrão e mantém o equilíbrio da proposta.
