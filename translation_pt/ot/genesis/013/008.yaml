base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: pt
  text: 'Então Abrão disse a Ló: “Por favor, não haja conflito entre mim e você, nem entre os meus pastores e os seus, pois somos parentes[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “somos homens, irmãos”. Aqui, “irmãos” também pode designar parentes, e não apenas filhos dos mesmos pais.'
    reason: Preservar a forma literal aproximada e explicar o sentido mais amplo do termo hebraico.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Abrão disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Por favor, não haja conflito
  rationale: “Por favor” comunica a cortesia de נָא, enquanto “não haja” preserva o pedido negativo; “conflito” abrange tanto a desavença pessoal quanto a contenda entre os pastores.
- source_word: בֵּינִי וּבֵינֶיךָ וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  choice: entre mim e você, nem entre os meus pastores e os seus
  rationale: Mantém os dois pares da construção hebraica sem tornar a frase pesada; “pastores” designa naturalmente os responsáveis pelo cuidado dos rebanhos.
- source_word: כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: pois somos parentes próximos
  rationale: No contexto, אַחִים indica parentesco mais amplo, pois Abrão era tio de Ló. A formulação idiomática comunica a força do apelo à solidariedade familiar, enquanto a nota preserva a expressão hebraica mais literal.
theological_decisions:
- issue: Sentido de אַחִים na relação entre Abrão e Ló
  choice: parentes próximos
  alternative: irmãos; literalmente, homens irmãos
  rationale: O hebraico pode chamar de “irmãos” parentes que não são filhos dos mesmos pais. Como Abrão e Ló eram tio e sobrinho, “parentes próximos” evita uma inferência genealógica incorreta sem apagar a metáfora familiar, registrada na nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A repetição hebraica é parcialmente preservada, mas “os seus” evita uma repetição desnecessariamente pesada de “seus pastores”.
