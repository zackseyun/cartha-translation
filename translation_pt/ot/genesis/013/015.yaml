  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: pt
  text: Pois toda a terra que você vê, eu a darei a você e à sua descendência[a] para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à sua semente”. O termo hebraico זֶרַע é um substantivo coletivo que pode significar “semente”, “descendência” ou “descendentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação e a promessa divina ligadas à ordem anterior de contemplar a terra, preservando a função conectiva sem impor causalidade excessiva.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Expressa de modo natural e abrangente a totalidade da terra que está à vista.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: que você vê
  rationale: A oração relativa e o presente simples comunicam naturalmente, em português atual, o valor contextual do particípio hebraico.
- source_word: לְךָ
  choice: a você
  rationale: Com o verbo נתן, a preposição ל marca o destinatário; esta formulação evita a mistura de formas de tratamento.
- source_word: אֶתְּנֶנָּה
  choice: eu a darei
  rationale: O imperfeito expressa aqui uma promessa futura. O pronome retoma claramente “a terra” e produz uma frase natural em português.
- source_word: וּלְזַרְעֲךָ
  choice: e à sua descendência
  rationale: זֶרַע é um substantivo coletivo que pode designar semente, prole ou descendentes. “Descendência” conserva o caráter coletivo sem determinar indevidamente singularidade ou pluralidade.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Preserva a força duradoura ou perpétua da expressão no contexto da promessa, em linguagem corrente e digna.
theological_decisions:
- issue: Duração da promessa da terra em עַד עוֹלָם
  choice: para sempre
  alternative: perpetuamente; por tempo indefinido
  rationale: “Para sempre” representa o sentido direto e solene da expressão sem resolver, dentro da tradução, como a promessa se relaciona com sistemas escatológicos ou pactuais posteriores.
- issue: Caráter coletivo de זֶרַע
  choice: descendência
  alternative: semente; descendentes
  rationale: “Descendência” mantém a amplitude coletiva do hebraico e evita decidir se o referente deve ser entendido estritamente como um indivíduo ou como uma pluralidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” de modo consistente e conserva a solenidade da promessa sem arcaísmos. O marcador foi colocado após “descendência”, termo ao qual a nota lexical corresponde.
