base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: pt
  text: Levante-se e percorra a terra em todo o seu comprimento e largura, pois eu a darei a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Levante-se
  rationale: O imperativo de קום ordena que Abrão se ponha de pé e aja; “Levante-se” é direto, natural e preserva a força do comando.
- source_word: הִתְהַלֵּ֣ךְ
  choice: percorra
  rationale: O hitpael imperativo de הלך indica andar ou deslocar-se pela área. “Percorra” comunica de modo conciso a ideia de atravessar e conhecer o território.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: Neste contexto, אֶרֶץ designa o território mostrado e prometido a Abrão, não o planeta em geral.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: em toda a sua extensão, de uma ponta à outra
  rationale: A expressão literalmente menciona o comprimento e a largura da terra, um par que comunica sua extensão completa. A formulação portuguesa evita uma construção artificial sem perder esse sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem anterior, preservando a ligação explicativa.
- source_word: לְךָ
  choice: a você
  rationale: Marca Abrão como o destinatário da dádiva; a construção é clara e amplamente compreensível em português.
- source_word: אֶתְּנֶנָּה
  choice: eu a darei
  rationale: O imperfeito qal de נתן tem sentido promissório futuro, e o pronome feminino retoma “a terra”.
theological_decisions:
- issue: Referente do sufixo feminino em אֶתְּנֶנָּה
  choice: O pronome “a” retoma “a terra”, prometida por Deus a Abrão.
  alternative: Explicitar “darei esta terra”.
  rationale: O antecedente feminino singular natural é אֶרֶץ. Manter o pronome reproduz a coesão do hebraico sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Percorra” mantém o comando solene sem soar arcaico; a expressão espacial foi vertida idiomaticamente como totalidade da extensão territorial.
