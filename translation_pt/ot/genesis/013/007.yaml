  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: pt
  text: E houve uma disputa entre os pastores dos rebanhos de Abrão e os pastores dos rebanhos de Ló. Naquele tempo, os cananeus e os ferezeus[a] habitavam a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o cananeu e o ferezeu”; os gentílicos no singular têm sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E houve
  rationale: Introduz o acontecimento narrativo e conserva o sentido existencial simples do hebraico em português natural.
- source_word: רִיב
  choice: uma disputa
  rationale: Expressa conflito ou desavença entre os dois grupos sem sugerir necessariamente violência física.
- source_word: רֹעֵי מִקְנֵה
  choice: pastores dos rebanhos
  rationale: רֹעֵי designa os responsáveis pelos animais, e מִקְנֵה abrange os animais domésticos reunidos em rebanhos; a expressão é clara e evita restringir o referente apenas a bovinos ou ovinos.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: Mantém a estrutura bilateral do conflito entre os dois grupos.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: os cananeus e os ferezeus
  rationale: Embora os gentílicos estejam no singular em hebraico, têm sentido coletivo; o plural é a forma mais natural e inequívoca em português.
- source_word: אָז
  choice: Naquele tempo
  rationale: Situa a informação em relação ao momento da narrativa de modo idiomático.
- source_word: יֹשֵׁב
  choice: habitavam
  rationale: O particípio indica presença continuada. O plural português concorda naturalmente com os dois povos entendidos coletivamente.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: A formulação tradicional e natural preserva a possível ressonância geográfica e pactual de הָאָרֶץ em Gênesis.
theological_decisions:
- issue: Possível ressonância pactual de הָאָרֶץ
  choice: a terra
  alternative: a região
  rationale: “A terra” mantém tanto o sentido geográfico imediato quanto a possível relevância pactual no contexto de Gênesis, sem acrescentar interpretação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “pastores dos rebanhos” acompanha a estrutura paralela do hebraico e evita ambiguidade quanto aos dois grupos.
