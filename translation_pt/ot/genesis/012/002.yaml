  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: pt
  text: Farei de você uma grande nação, eu o abençoarei e engrandecerei o seu nome; e seja uma bênção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e você será uma bênção”. A forma hebraica é imperativa (“seja”), mas alguns entendem que, neste contexto de promessas, ela expressa o resultado do que Deus fará.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ
  choice: Farei de você
  rationale: O verbo עשה com o sufixo de objeto e a expressão predicativa introduzida por ל indica constituir Abrão como algo; “fazer de você” expressa isso com naturalidade em português.
- source_word: לְגוֹי גָּדוֹל
  choice: uma grande nação
  rationale: גּוֹי designa uma nação ou povo, e “grande nação” preserva a formulação tradicional e se ajusta ao contexto da promessa patriarcal.
- source_word: וַאֲבָרֶכְךָ
  choice: eu o abençoarei
  rationale: O piel de ברך significa diretamente “abençoar”; o pronome mantém Abrão como objeto pessoal da promessa.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: engrandecerei o seu nome
  rationale: A expressão conserva “nome”, em vez de explicitar apenas “reputação”, e traduz de modo idiomático o causativo “tornar grande”.
- source_word: וֶהְיֵה
  choice: e seja
  rationale: A forma é um imperativo qal masculino singular de היה. “Seja” preserva a mudança da promessa divina para a exortação dirigida a Abrão, enquanto a conjunção “e” representa o וְ.
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: O substantivo singular indefinido indica que Abrão deve ser uma bênção, isto é, portador ou meio de bênção.
theological_decisions:
- issue: Força de וֶהְיֵה בְּרָכָה
  choice: 'Imperativa: “e seja uma bênção”'
  alternative: 'Resultativa ou preditiva: “e você será uma bênção”'
  rationale: A morfologia hebraica é imperativa, por isso o texto principal mantém a ordem ou vocação. Como a cláusula integra uma sequência de promessas, a leitura resultativa continua possível e é registrada em nota, sem eliminar a tensão.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A alternância entre “você” e o pronome oblíquo “o” evita formas regionais marcadas. O ponto e vírgula sinaliza a mudança retórica das promessas no futuro para o imperativo final, sem apagar a conjunção hebraica.
