  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: pt
  text: Assim, Abrão foi, exatamente como Yahweh lhe havia falado, e Ló foi com ele. Abrão tinha setenta e cinco anos quando saiu de Harã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O wayyiqtol de הלך descreve o avanço da narrativa por meio de um movimento simples. “Foi” é natural e não enfatiza o início da viagem além do que o hebraico exige.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Expressa a correspondência entre a ação de Abrão e o que Yahweh lhe havia dito, deixando clara a conformidade sem acrescentar uma explicação teológica.
- source_word: דִּבֶּר אֵלָיו
  choice: lhe havia falado
  rationale: O mais-que-perfeito situa naturalmente a fala de Yahweh antes da partida de Abrão; “falado” preserva o sentido verbal de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אִתּוֹ
  choice: com ele
  rationale: Equivalente direto, conciso e idiomático da preposição com sufixo pronominal.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: tinha setenta e cinco anos
  rationale: Reproduz em português corrente a expressão idiomática hebraica usada para indicar idade.
- source_word: בְּצֵאתוֹ
  choice: quando saiu
  rationale: O infinitivo construto com בְּ indica a ocasião da ação. “Quando saiu” é natural e mantém o sentido básico de יצא.
- source_word: מֵחָרָן
  choice: de Harã
  rationale: Emprega a forma portuguesa tradicional do topônimo e traduz diretamente a preposição מִן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A ordem narrativa e a repetição de “Abrão” foram preservadas; não há necessidade de notas de rodapé neste versículo.
