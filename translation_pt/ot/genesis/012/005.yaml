  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: pt
  text: Então Abrão levou consigo Sarai, sua mulher, Ló, filho de seu irmão, todos os bens que haviam adquirido e as pessoas que haviam reunido[a] em Harã. Partiram rumo à terra de Canaã e chegaram à terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as pessoas que haviam adquirido»; mais literalmente, «as almas que haviam feito». A expressão hebraica provavelmente se refere às pessoas que passaram a fazer parte da casa deles em Harã.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: levou consigo
  rationale: No contexto de partida, o verbo indica que Abrão levou essas pessoas e esses bens com ele; a formulação é mais natural em português do que o simples «tomou».
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Em contexto matrimonial, אִשָּׁה com sufixo possessivo significa «mulher» no sentido de esposa; esta é uma forma corrente e digna em português.
- source_word: בֶּן אָחִיו
  choice: filho de seu irmão
  rationale: Preserva de modo transparente a expressão hebraica de parentesco, em vez de substituí-la pelo termo mais compacto «sobrinho».
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: todos os bens que haviam adquirido
  rationale: רְכוּשׁ designa bens ou posses, e רכשׁ indica sua aquisição; «bens» evita uma repetição pesada e abrange a propriedade móvel sugerida pelo contexto.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: as pessoas que haviam reunido
  rationale: נֶפֶשׁ refere-se aqui a pessoas, enquanto עשה integra uma expressão difícil que pode indicar formar, reunir ou adquirir membros de uma casa. «Reunido» oferece um sentido contextual claro sem apagar em nota a forma e as alternativas do hebraico.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: partiram rumo a
  rationale: A combinação verbal expressa saída orientada a um destino. «Partiram rumo a» reproduz esse movimento de modo idiomático em português.
- source_word: אַרְצָה כְּנַעַן
  choice: à terra de Canaã
  rationale: A terminação direcional de אַרְצָה e o nome próprio indicam movimento para a terra de Canaã.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: chegaram à terra de Canaã
  rationale: Mantém a repetição deliberada do destino no hebraico e distingue a partida da chegada efetiva.
theological_decisions:
- issue: Identidade das pessoas mencionadas em הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: Não especificar se eram servos, dependentes ou convertidos; traduzir genericamente como «pessoas que haviam reunido».
  alternative: «servos que haviam adquirido», «pessoas que haviam adquirido» ou «almas que haviam feito»
  rationale: O hebraico não define a condição social nem religiosa dessas pessoas. A tradução evita introduzir escravidão, proselitismo ou criação como interpretação exclusiva e registra a dificuldade lexical em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Abrão», «Sarai», «Ló», «Harã» e «Canaã» seguem formas bíblicas portuguesas consolidadas. A repetição de «terra de Canaã» foi mantida por corresponder à estrutura enfática da narrativa hebraica.
