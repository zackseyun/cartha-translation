  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: pt
  text: Abrão seguiu viagem em direção ao Neguebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para o sul». O hebraico pode indicar tanto a região meridional chamada Neguebe quanto a direção sul; aqui, o sentido regional é provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: prosseguiu viagem
  rationale: O qal wayyiqtol de נסע indica que Abrão levantou acampamento e seguiu adiante. A formulação comunica a continuidade da viagem sem explicitar além do texto os procedimentos de desmontar o acampamento.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Forma tradicional e amplamente reconhecida do nome em português, distinta de Abraão, nome recebido posteriormente na narrativa.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: seguindo
  rationale: A construção com infinitivos absolutos qualifica o movimento como contínuo ou progressivo. «Seguindo» preserva esse valor durativo em português natural, sem acrescentar a ideia não inequívoca de etapas.
- source_word: הַנֶּגְבָּה
  choice: em direção ao Neguebe
  rationale: O substantivo נֶגֶב com artigo e hê direcional provavelmente designa aqui a região meridional do Neguebe. «Em direção ao» expressa o movimento orientado sem afirmar necessariamente que Abrão já entrou na região.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição verbal hebraica foi representada por «prosseguiu viagem, seguindo», preservando o movimento progressivo sem recorrer à formulação artificialmente literal «indo e viajando».
