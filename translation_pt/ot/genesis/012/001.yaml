  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: pt
  text: 'Yahweh disse a Abrão: “Saia da sua terra, da sua parentela e da casa de seu pai e vá para a terra que eu lhe mostrarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino pessoal expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֶךְ־לְךָ
  choice: Saia
  rationale: Expressa de modo natural em português a ordem hebraica enfática para partir; o complemento com מִן indica afastamento do lugar de origem.
- source_word: מִמּוֹלַדְתְּךָ
  choice: do meio dos seus parentes
  rationale: No contexto, o termo designa os vínculos de origem e parentesco; a formulação evita a impressão de que Abrão deveria sair novamente da mesma 'terra' já mencionada, sem ocultar a amplitude lexical do hebraico.
- source_word: מִבֵּית אָבִיךָ
  choice: da casa de seu pai
  rationale: Mantém a imagem hebraica da família ou unidade doméstica paterna sem reduzi-la apenas ao edifício.
- source_word: אַרְאֶךָּ
  choice: eu lhe mostrarei
  rationale: 'Traduz diretamente a forma causativa do verbo ''ver'': Yahweh fará Abrão ver ou conhecer a terra de destino.'
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto-fonte contém explicitamente o Tetragrama; usar o nome preserva a distinção entre o nome pessoal divino e o título 'Senhor'.
- issue: Valor de לְךָ na ordem לֶךְ־לְךָ
  choice: Não traduzir como benefício pessoal explícito
  alternative: Vá para o seu próprio bem
  rationale: A construção pode dar intensidade ou envolvimento pessoal à ordem, mas explicitar benefício resolveria de forma indevida uma expressão hebraica idiomática e discutida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Abrão” segue a forma tradicional portuguesa do nome neste estágio da narrativa. A coordenação “e vá” torna explícito em português que a ordem inclui tanto deixar as antigas relações territoriais e familiares quanto dirigir-se ao destino que Yahweh revelará.
