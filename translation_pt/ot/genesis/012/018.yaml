  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: pt
  text: 'Então o faraó chamou Abrão e disse: “O que é isso que você fez comigo? Por que não me contou que ela é sua mulher?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: קרא com לְ e uma pessoa pode significar chamar ou mandar comparecer. “Chamou” preserva a amplitude do verbo e soa natural no fluxo narrativo.
- source_word: פַרְעֹה
  choice: o faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio, com artigo natural neste contexto.
- source_word: לְאַבְרָם
  choice: Abrão
  rationale: Forma portuguesa tradicional do nome אַבְרָם, distinguindo-o de Abraão após a mudança de nome em Gênesis 17.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: אמר é o verbo narrativo comum “dizer”; embora introduza perguntas, “disse” mantém a forma do hebraico e é natural em português.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: O que é isso que você fez comigo?
  rationale: A formulação conserva a força demonstrativa de מַה זֹּאת e expressa לִּי naturalmente como “comigo”, comunicando a queixa pessoal do faraó.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Por que não me contou
  rationale: נגד no hifil significa contar, declarar ou dar a conhecer. “Não me contou” é corrente, claro e adequado à revelação de um fato omitido.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo da informação que Abrão não revelou.
- source_word: אִשְׁתְּךָ הִוא
  choice: ela era sua mulher
  rationale: A oração nominal hebraica identifica a mulher como esposa de Abrão. O pretérito imperfeito é idiomático em português após “não me contou que”, por concordância temporal, sem sugerir que ela já não fosse sua esposa.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira e tom narrativo digno. Emprega “você” na repreensão direta por ser natural e amplamente inteligível; “mulher” traduz אִשָּׁה no sentido contextual de esposa sem recorrer a vocabulário excessivamente formal.
