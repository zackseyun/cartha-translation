base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: pt
  text: Houve fome na terra, e Abrão desceu ao Egito para morar ali temporariamente[a], porque a fome era intensa na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para residir ali como estrangeiro”; o verbo também pode sugerir residência temporária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Houve
  rationale: Introduz de modo natural em português um novo acontecimento na narrativa, sem acrescentar um marcador temporal que não está explícito no hebraico.
- source_word: רָעָב
  choice: fome
  rationale: Neste contexto, o substantivo designa uma fome generalizada, e não apenas fome individual. Em português, “fome” é a expressão bíblica corrente e natural para essa calamidade.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Refere-se à região onde Abrão estava, não ao planeta inteiro. “Terra” preserva tanto o sentido geográfico quanto a ressonância narrativa do termo em Gênesis.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Conserva o sentido básico de ירד e a maneira bíblica convencional de descrever uma viagem ao Egito.
- source_word: מִצְרַיְמָה
  choice: ao Egito
  rationale: A terminação direcional indica movimento para o Egito; “ao Egito” expressa isso naturalmente em português.
- source_word: לָגוּר
  choice: para morar ali temporariamente
  rationale: גור descreve residência não permanente, frequentemente na condição de forasteiro. A formulação comunica com clareza a duração temporária, enquanto a nota preserva a nuance social.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo simples que retoma o Egito com naturalidade em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual Abrão desceu ao Egito.
- source_word: כָבֵד
  choice: intensa
  rationale: Embora o sentido básico seja “pesada”, aqui o adjetivo descreve idiomaticamente a gravidade da fome. “Intensa” é claro e natural em português.
- source_word: הָרָעָב
  choice: a fome
  rationale: O artigo definido retoma a fome já mencionada, como também ocorre em português.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém a repetição deliberada do hebraico e a coesão do versículo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “na terra” e o movimento expresso por “desceu” foram preservados; a nuance de residência temporária como forasteiro foi explicitada em nota.
