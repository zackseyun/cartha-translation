base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: pt
  text: Mas Yahweh feriu o faraó e sua casa com grandes pragas por causa de Sarai, mulher de Abrão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afligiu o faraó e sua casa com graves aflições”. O hebraico combina um verbo que significa “ferir” ou “afligir” com um substantivo que pode significar “golpes”, “aflições” ou “pragas”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: feriu
  rationale: O hifil de נגע aqui expressa a ação de atingir ou afligir, reforçada pelo substantivo cognato נְגָעִים. “Feriu” preserva essa força sem exigir que o verbo seja traduzido como “castigou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Emprega o título régio corrente em português, com artigo definido natural neste contexto.
- source_word: נְגָעִים גְּדֹלִים
  choice: grandes pragas
  rationale: נְגָעִים pode designar golpes, aflições ou pragas; “pragas” se ajusta ao contexto, enquanto “grandes” conserva diretamente o valor intensificador de גְּדֹלִים.
- source_word: וְאֶת בֵּיתוֹ
  choice: e sua casa
  rationale: “Casa” preserva a amplitude de בַּיִת, que pode abranger a família, os servos e o âmbito doméstico do faraó, sem restringi-lo explicitamente ao edifício.
- source_word: עַל דְּבַר
  choice: por causa de
  rationale: A locução introduz a causa ou ocasião das pragas de modo claro e natural em português.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, mulher de Abrão
  rationale: Mantém a aposição hebraica e identifica a relação conjugal central para a razão das pragas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico, sem o substituir por um título reverencial.
- issue: Natureza das consequências sofridas pelo faraó
  choice: feriu ... com grandes pragas
  alternative: afligiu ... com grandes aflições
  rationale: Mantém a imagem concreta e a repetição etimológica aproximada do hebraico, sem especificar a forma das pragas além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Sua casa” conserva a expressão bíblica e sua possível abrangência coletiva; a nota registra a ambiguidade lexical da construção hebraica.
