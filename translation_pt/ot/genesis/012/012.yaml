base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: pt
  text: 'E acontecerá que, quando os egípcios virem você, dirão: “Esta é a esposa dele.” Então me matarão, mas deixarão você viver.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula antecipatória hebraica e introduz naturalmente, em português, a situação que Abrão prevê.
- source_word: יִרְאוּ אֹתָךְ
  choice: virem você
  rationale: Traduz diretamente o sentido comum de ראה; a construção é clara e natural, sobretudo para leitores brasileiros.
- source_word: הַמִּצְרִים
  choice: os egípcios
  rationale: É a designação étnica padrão e mantém o artigo definido do hebraico.
- source_word: וְאָמְרוּ
  choice: dirão
  rationale: Mantém o verbo simples de fala e a orientação futura da sequência.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Esta é a esposa dele
  rationale: Expressa de modo idiomático a oração nominal hebraica, preservando tanto o demonstrativo זֹאת quanto o sentido conjugal de אִשָּׁה com sufixo possessivo.
- source_word: וְהָרְגוּ אֹתִי
  choice: Então me matarão
  rationale: הרג significa diretamente matar; “então” torna clara a consequência prevista sem acrescentar conteúdo doutrinário.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: mas deixarão você viver
  rationale: O Hifil de חיה significa manter vivo ou deixar viver. “Mas” explicita o contraste contextual com a morte de Abrão, e a formulação soa natural em português.
