  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: pt
  text: Por favor, diga que você é minha irmã, para que as coisas corram bem para mim por causa de você e eu permaneça vivo por sua causa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e minha alma viva por causa de você”. Aqui, “alma” (néfesh) é uma maneira de se referir à própria pessoa ou à vida de Abrão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Por favor, diga
  rationale: O imperativo feminino singular de אמר, acompanhado de נָא, expressa um pedido insistente, mas atenuado. A formulação é natural e atual em português.
- source_word: אֲחֹתִי אָתְּ
  choice: que você é minha irmã
  rationale: A expressão predicativa significa literalmente “você é minha irmã”; depois de “diga”, o português pede naturalmente a conjunção “que”.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade esperada por Abrão, preservando a força intencional da construção hebraica.
- source_word: יִיטַב לִי
  choice: tudo corra bem comigo
  rationale: Reproduz de modo idiomático o sentido amplo de “ser bom/ir bem para mim”, sem limitar a frase apenas a receber bom tratamento.
- source_word: בַעֲבוּרֵךְ
  choice: por causa de você
  rationale: 'Expressa a relação causal: Abrão espera que a alegada condição de Sarai como irmã resulte em benefício para ele.'
- source_word: וְחָיְתָה נַפְשִׁי
  choice: e eu continue vivo
  rationale: Literalmente, “e minha נפש viva”. Neste contexto, נֶפֶשׁ designa a pessoa ou a vida de Abrão, e a formulação portuguesa comunica com clareza sua expectativa de sobreviver.
- source_word: בִּגְלָלֵךְ
  choice: graças a você
  rationale: Mantém a segunda expressão causal sem repetir mecanicamente “por causa de você”; no contexto, indica que a sobrevivência de Abrão dependeria do papel de Sarai.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de duas expressões causais do hebraico foi preservada por meio de “por causa de você” e “graças a você”, enquanto “eu continue vivo” transmite o uso idiomático de néfesh sem sugerir uma distinção técnica entre corpo e alma.
