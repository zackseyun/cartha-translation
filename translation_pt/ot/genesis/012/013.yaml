review_pass:
  verdict: revise
  source_fidelity: A redação transmite corretamente o pedido atenuado, a finalidade, as duas relações causais e o sentido de נֶפֶשׁ como vida/pessoa. Contudo, “graças a você” pode sugerir gratidão ou um benefício já reconhecido, nuance não expressa pelo causal בִּגְלָלֵךְ. “Continue vivo” é compreensível, mas acrescenta levemente a ideia de continuação; “permaneça vivo” reproduz mais diretamente o resultado desejado.
  naturalness: “Tudo corra bem comigo” é compreensível, mas “as coisas corram bem para mim” é mais transparente e idiomático para leitores brasileiros e internacionais. A repetição causal pode ser mantida de modo natural com “por causa de você” e “por sua causa”.
  terminology: “Irmã”, “vida” e “alma” na nota estão adequados. A nota explica apropriadamente que néfesh não exige aqui o sentido de uma alma imaterial.
