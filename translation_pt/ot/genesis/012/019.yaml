  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: pt
  text: 'Por que você disse: “Ela é minha irmã”, de modo que eu a tomei para mim como esposa?[a] Agora, aqui está a sua mulher. Tome-a e vá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu a tomei para mim como esposa”. A expressão “de modo que” explicita a relação de consequência sugerida pelo contexto; o hebraico também pode ser traduzido simplesmente por “e”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: Por que você disse
  rationale: Expressa de modo direto e natural a pergunta de censura feita pelo faraó.
- source_word: אֲחֹתִי הִוא
  choice: Ela é minha irmã
  rationale: Mantém a fala citada e o presente da oração nominal hebraica.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: de modo que eu a tomei para mim como esposa
  rationale: A formulação comunica a consequência da declaração de Abrão, preserva o dativo לִי em “para mim” e traduz a expressão matrimonial sem pressupor mais do que o hebraico afirma.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca naturalmente a transição da censura para a ordem; a conjunção hebraica não precisa ser reproduzida mecanicamente.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: aqui está a sua mulher
  rationale: “Aqui está” preserva a força apresentativa de הִנֵּה em português atual; “mulher” é natural no contexto conjugal e identifica Sarai como esposa de Abrão.
- source_word: קַח וָלֵךְ
  choice: Tome-a e vá embora
  rationale: Repõe o objeto implícito do primeiro imperativo e traduz o segundo como ordem de partida, em português corrente, sem intensificá-lo indevidamente.
theological_decisions:
- issue: Natureza da ação expressa por וָאֶקַּח ... לְאִשָּׁה
  choice: eu a tomei para mim como esposa
  alternative: eu pretendia tomá-la como esposa
  rationale: O hebraico apresenta a ação como realizada; a tradução não a reduz a mera intenção nem define além do texto o grau de consumação da união.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A fala do faraó conserva o tom direto de censura e os imperativos finais.
