  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male slaves and female slaves and female donkeys and camels.
translation:
  language: pt
  text: E ele tratou bem Abrão por causa dela[a], e Abrão passou a ter ovelhas, gado, jumentos, escravos, escravas, jumentas e camelos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por consideração a ela”. A expressão hebraica admite ambas as formas de tradução.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: tratou bem
  rationale: O hifil de יטב significa aqui fazer o bem a alguém ou favorecê-lo; “tratou bem” é natural e preserva a relação pessoal com Abrão.
- source_word: בַּעֲבוּרָהּ
  choice: por causa dela
  rationale: A expressão indica causa ou ocasião. “Por causa dela” é clara e evita atribuir necessariamente uma intenção beneficente, embora “por amor a ela” ou “por consideração a ela” também sejam possíveis.
- source_word: וַיְהִי לוֹ
  choice: Abrão passou a ter
  rationale: O idioma expressa posse resultante ou adquirida. A repetição de “Abrão” evita a ambiguidade pronominal que surgiria em português depois de “ele”, referente ao faraó.
- source_word: צֹאן
  choice: ovelhas
  rationale: Termo coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “ovelhas” mantém a formulação simples da lista, embora o termo hebraico possa ser mais abrangente.
- source_word: בָקָר
  choice: gado
  rationale: Termo coletivo comum para bovinos.
- source_word: חֲמֹרִים
  choice: jumentos
  rationale: O plural masculino contrasta com אֲתֹנֹת mais adiante, por isso a distinção de sexo é preservada.
- source_word: עֲבָדִים
  choice: escravos
  rationale: No contexto de uma lista de bens, o termo indica pessoas escravizadas; “escravos” comunica esse estatuto com mais precisão que “servos”.
- source_word: שְׁפָחֹת
  choice: escravas
  rationale: O plural feminino designa mulheres escravizadas e forma contraste com עֲבָדִים.
- source_word: אֲתֹנֹת
  choice: jumentas
  rationale: O substantivo feminino designa especificamente fêmeas de jumento e preserva o contraste lexical do hebraico.
- source_word: גְמַלִּים
  choice: camelos
  rationale: Equivalente português padrão do substantivo plural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem coordenada do hebraico foi preservada, enquanto “Abrão” foi repetido na segunda oração para eliminar ambiguidade referencial. Mantiveram-se as distinções entre jumentos e jumentas e entre escravos e escravas.
