- from: Então o faraó deu ordens a alguns homens a respeito de Abrão,[a] e eles o mandaram embora com sua mulher e tudo o que ele possuía.[b]
  to: Então o faraó deu ordens a homens a respeito de Abrão,[a] e eles o mandaram embora, com sua mulher e tudo o que lhe pertencia.[b]
  rationale: A revisão remove o acréscimo «alguns» e substitui a alternativa interpretativa «que cuidassem dele» por uma nota que conserva a indefinição e o sentido de ordens dadas em referência a Abrão. Também ajusta a pontuação para deixar claro que a mulher e os bens acompanham Abrão em sua partida.
