    rationale: O hebraico diz que Faraó deu ordens a homens «a respeito dele»; não informa que lhes ordenou cuidar de Abrão.
  revised_text: Então o faraó deu ordens a homens a respeito de Abrão,[a] e eles o mandaram embora, com sua mulher e tudo o que lhe pertencia.[b]
