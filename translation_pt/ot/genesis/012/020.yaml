  naturalness: «Então o faraó deu ordens a homens a respeito de Abrão» é claro e natural em registro bíblico moderno. «Mandaram embora» transmite bem o sentido contextual de envio/dispensa.
  terminology: «Faraó», «Abrão», «sua mulher» e «tudo o que lhe pertencia» são adequados. «Tudo o que lhe pertencia» reproduz com precisão a abrangência de כָּל אֲשֶׁר לוֹ.
