  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: pt
  text: Então o faraó deu ordens a homens a respeito de Abrão,[a] e eles o mandaram embora, com sua mulher e tudo o que lhe pertencia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então o faraó ordenou a homens a respeito dele». O hebraico diz apenas «homens» e não especifica a função deles nem o teor das ordens.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «tudo o que ele tinha».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו ... עָלָיו
  choice: deu ordens ... a respeito de Abrão
  rationale: צוה significa ordenar ou dar ordens, e עַל indica aqui que as ordens diziam respeito a Abrão. A repetição do nome torna a referência clara em português.
- source_word: אֲנָשִׁים
  choice: alguns homens
  rationale: O hebraico diz literalmente «homens» e não especifica sua função. «Alguns homens» é natural em português e evita identificá-los indevidamente como servos, guardas ou acompanhantes.
- source_word: וַיְשַׁלְּחוּ אֹתוֹ
  choice: eles o mandaram embora
  rationale: שלח, neste contexto, expressa afastamento ou dispensa. «Mandaram embora» preserva esse sentido sem acrescentar que o escoltaram.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: אשה com sufixo possessivo, neste contexto matrimonial, significa a esposa de Abrão. «Sua mulher» é corrente e claro no português moderno.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que ele possuía
  rationale: A expressão hebraica abrange tudo o que pertencia a Abrão; a formulação escolhida é natural e mantém a amplitude do original.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título real egípcio; o artigo definido é idiomático neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A tradução conserva a indefinição de «homens» e evita transformar o envio em uma escolta, detalhe que o hebraico não explicita.
