  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: pt
  text: Quando os oficiais do faraó a viram, falaram bem dela[a] ao faraó, e a mulher foi levada para a casa do faraó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “elogiaram-na ao faraó” ou “recomendaram-na ao faraó”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “casa”; a expressão pode indicar a residência ou a casa real do faraó, e não apenas o edifício.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: os oficiais do faraó
  rationale: שָׂרִים pode designar governantes, altos funcionários ou príncipes. Neste contexto de corte, “oficiais” é natural e não sugere necessariamente parentesco real.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: elogiaram-na diante do faraó
  rationale: O piel de הלל significa aqui elogiar ou recomendar. A formulação preserva a ideia de falarem favoravelmente dela ao faraó, sem explicar além do texto.
- source_word: וַתֻּקַּח
  choice: foi levada
  rationale: A forma passiva mantém o agente não expresso e ressalta a passividade da mulher no acontecimento.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Traduz diretamente o substantivo hebraico, sem substituí-lo por “esposa”, embora Sara seja a esposa de Abrão no contexto.
- source_word: בֵּית פַּרְעֹה
  choice: para a casa do faraó
  rationale: בַּיִת pode significar casa, residência ou casa real. “Casa do faraó” preserva a amplitude do hebraico sem introduzir a interpretação mais específica “palácio”.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: a viram
  rationale: ראה é o verbo comum para “ver”; a tradução simples corresponde ao sentido narrativo.
