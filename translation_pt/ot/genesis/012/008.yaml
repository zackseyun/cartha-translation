base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: pt
  text: Dali, ele se mudou para a região montanhosa a leste de Betel e armou sua tenda, com Betel a oeste e Ai a leste. Ali construiu um altar a Yahweh[a] e invocou o nome de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH; tradicionalmente traduzido por “SENHOR”.
    reason: lexical_alternative
  - marker: b
    text: Ou “proclamou o nome de Yahweh”. A expressão hebraica pode indicar tanto invocar Yahweh em adoração como declarar publicamente seu nome.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: ele se mudou
  rationale: O verbo indica deslocar-se ou transferir-se de um lugar para outro. A formulação é natural em português e mantém o movimento da narrativa sem acrescentar a ideia específica de uma nova etapa de viagem.
- source_word: הָהָרָה
  choice: para a região montanhosa
  rationale: A terminação direcional indica movimento em direção à área de montes. Neste contexto geográfico, “região montanhosa” comunica melhor o relevo amplo do que o singular “monte”.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: a leste de Betel
  rationale: קֶדֶם tem sentido espacial e localiza o acampamento no lado oriental de Betel.
- source_word: וַיֵּט אָהֳלֹה
  choice: e armou sua tenda
  rationale: Equivalente idiomático corrente para estender e instalar uma tenda.
- source_word: מִיָּם
  choice: a oeste
  rationale: Embora יָם signifique literalmente “mar”, em orientações geográficas hebraicas também designa o oeste, na direção do Mediterrâneo.
- source_word: וְהָעַי מִקֶּדֶם
  choice: e Ai a leste
  rationale: Mantém o paralelismo geográfico e situa claramente o acampamento entre Betel e Ai.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Equivalente português padrão para a estrutura destinada a sacrifício ou culto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: e invocou o nome de Yahweh
  rationale: A expressão pode indicar invocação no culto e também proclamação pública. “Invocou” expressa o sentido cultual provável sem eliminar a alternativa, registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio, enquanto a nota informa a tradição de representá-lo por “SENHOR”.
- issue: Sentido de וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: invocou o nome de Yahweh
  alternative: proclamou o nome de Yahweh
  rationale: No contexto da construção do altar, a invocação em culto é o sentido imediato mais provável; contudo, a expressão hebraica também pode envolver proclamação, possibilidade mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção geográfica natural. “Ficando Betel a oeste e Ai a leste” evita rigidez excessiva e preserva a localização relativa da tenda. Os marcadores de nota foram colocados junto às expressões que explicam.
