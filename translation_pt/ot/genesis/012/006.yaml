  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: pt
  text: Abrão passou pela terra até o lugar de Siquém, até o carvalho de Moré.[a] Naquele tempo, o cananeu estava na terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terebinto de Moré”. O termo hebraico designa uma árvore grande, mas não se sabe ao certo qual era a espécie.
    reason: lexical_alternative
  - marker: b
    text: Ou “os cananeus estavam naquele tempo na terra”. O hebraico emprega um gentílico no singular que pode ter sentido coletivo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passou pela
  rationale: O verbo עבר no wayyiqtol descreve o deslocamento de Abrão através da terra. “Passou pela” expressa esse percurso sem especificar indevidamente rota ou modo de viagem.
- source_word: בָּאָרֶץ
  choice: pela terra / na terra
  rationale: Com o artigo, refere-se à terra já em vista, isto é, Canaã. A repetição de “terra” preserva a coesão e a ênfase do hebraico.
- source_word: עַד
  choice: até
  rationale: Nas duas ocorrências, marca o limite alcançado no percurso; “até” é direto e natural em português.
- source_word: מְקוֹם שְׁכֶם
  choice: o lugar de Siquém
  rationale: Mantém o substantivo comum מְקוֹם e sua relação com o nome próprio, sem pressupor que a cidade posterior já tivesse então sua forma plenamente desenvolvida.
- source_word: אֵלוֹן מוֹרֶה
  choice: o carvalho de Moré
  rationale: אֵלוֹן designa uma árvore grande, tradicionalmente entendida como carvalho ou terebinto. “Carvalho” é claro e consagrado, enquanto a incerteza quanto à espécie é registrada em nota.
- source_word: מוֹרֶה
  choice: Moré
  rationale: É melhor entendido neste contexto como nome próprio associado à árvore. A transliteração evita impor sentidos incertos como “mestre” ou “adivinho”.
- source_word: וְהַכְּנַעֲנִי
  choice: o cananeu
  rationale: O hebraico emprega o gentílico no singular com artigo, provavelmente em sentido coletivo. O singular em português preserva a forma da fonte, com a alternativa plural documentada em nota.
- source_word: אָז
  choice: naquele tempo
  rationale: Expressa com naturalidade a circunstância temporal indicada pelo advérbio hebraico אָז.
theological_decisions:
- issue: Número do gentílico em וְהַכְּנַעֲנִי
  choice: 'Singular coletivo: “o cananeu estava na terra”'
  alternative: 'Plural coletivo: “os cananeus estavam na terra”'
  rationale: O texto hebraico apresenta um gentílico singular com artigo, construção que pode designar coletivamente um povo. Conserva-se o singular no texto principal sem excluir a leitura coletiva plural.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição de “terra” e o singular coletivo do hebraico, enquanto as ambiguidades lexicais e gramaticais relevantes são apresentadas em notas.
