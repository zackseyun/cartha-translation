  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: pt
  text: Quando Abrão entrou no Egito, os egípcios viram que a mulher[a] era muito bonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a esposa”. O hebraico אִשָּׁה pode significar tanto “mulher” como “esposa”; aqui, a tradução preserva a expressão mais geral da oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: Quando ... entrou
  rationale: A construção narrativa com וַיְהִי e o infinitivo temporal כְּבֹא introduz a circunstância seguinte. Em português atual, “Quando Abrão entrou” comunica isso com naturalidade, sem a formulação mais rígida “E aconteceu que, quando”.
- source_word: מִצְרָיְמָה
  choice: no Egito
  rationale: O ה direcional indica movimento para o Egito; com o verbo português “entrar”, a construção idiomática é “entrou no Egito”.
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: ראה tem aqui o sentido direto de perceber pela visão. “Viram” permanece próximo ao hebraico e evita a interpretação adicional de “notaram”.
- source_word: הַמִּצְרִים
  choice: os egípcios
  rationale: Trata-se do gentílico plural definido, naturalmente vertido como “os egípcios”.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. “A mulher” preserva o teor mais geral desta oração, enquanto a nota registra a alternativa contextual.
- source_word: כִּי
  choice: que
  rationale: כִּי introduz o conteúdo percebido pelos egípcios; “que” é o complementizador português natural.
- source_word: יָפָה הִוא מְאֹד
  choice: era muito bonita
  rationale: יָפָה denota beleza, מְאֹד intensifica o adjetivo e הִוא explicita o sujeito. “Era muito bonita” é claro, corrente e preserva o sentido sem arcaísmo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A transição narrativa foi expressa sem um “E” inicial, desnecessário em português, e a ambiguidade lexical de אִשָּׁה foi preservada por meio de nota.
