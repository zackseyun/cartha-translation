  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: pt
  text: Abençoarei os que o abençoarem e amaldiçoarei aquele que o tratar com desprezo[a]; em você serão abençoadas todas as famílias da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que o desonrar” ou “aquele que o amaldiçoar”. O verbo hebraico קלל pode significar tratar com desprezo, desonrar ou amaldiçoar e é menos forte que o verbo seguinte, ארר, traduzido por “amaldiçoarei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio de você serão abençoadas todas as famílias da terra”; também é possível entender: “em você todas as famílias da terra se abençoarão”. A forma hebraica permite discussão entre os sentidos passivo e reflexivo/médio, e a preposição pode ter valor instrumental.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Abençoarei
  rationale: O qal na primeira pessoa do singular expressa a promessa divina; o futuro simples é natural e solene em português.
- source_word: מְבָרְכֶיךָ
  choice: os que abençoarem você
  rationale: O particípio plural com sufixo de segunda pessoa masculina singular designa uma classe de pessoas e mantém o plural do hebraico.
- source_word: וּמְקַלֶּלְךָ
  choice: aquele que o tratar com desprezo
  rationale: O particípio singular de קלל pode indicar tratar como insignificante, desonrar ou amaldiçoar. Esta formulação preserva tanto o singular quanto o contraste lexical com o verbo mais forte ארר.
- source_word: אָאֹר
  choice: amaldiçoarei
  rationale: O qal na primeira pessoa do singular de ארר é o termo forte e direto para impor maldição.
- source_word: וְנִבְרְכוּ
  choice: serão abençoadas
  rationale: O nifal na terceira pessoa do plural é apresentado no texto principal em sentido passivo, sem ocultar em nota a possível leitura reflexiva ou média.
- source_word: בְּךָ
  choice: em você
  rationale: Traduz diretamente a preposição ב; a possível nuance instrumental, 'por meio de você', é registrada em nota.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: todas as famílias da terra
  rationale: Expressão clara e tradicional que comunica grupos familiares e o alcance universal da promessa.
theological_decisions:
- issue: Sentido da fórmula abraâmica וְנִבְרְכוּ בְךָ
  choice: 'leitura passiva: “em você serão abençoadas”'
  alternative: 'leitura reflexiva/média: “por você desejarão para si a bênção”; ou nuance instrumental: “por meio de você serão abençoadas”'
  rationale: O nifal de ברך e a preposição ב permitem discussão entre os sentidos passivo, reflexivo/médio e instrumental. O texto principal mantém a leitura passiva mais direta, e a nota preserva as alternativas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O futuro simples preserva o tom de promessa. “Você” evita ambiguidade regional de conjugação, enquanto “o” retoma Abraão como objeto masculino singular. O contraste entre o plural “os que” e o singular “aquele” reproduz o hebraico.
