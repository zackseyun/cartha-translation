  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: pt
  text: 'Então Yahweh apareceu a Abrão e disse: “À sua descendência[a] darei esta terra.” E ali Abrão construiu um altar a Yahweh, que lhe havia aparecido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “semente”. A palavra hebraica está no singular, mas pode ter sentido coletivo, referindo-se ao conjunto dos descendentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação perceptível de Yahweh a Abrão; “apareceu” é natural e direto em português.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: זֶרַע está no singular formal, mas pode ter sentido coletivo. “Descendência” conserva essa referência coletiva sem restringi-la a um único indivíduo nem explicitar um plural inexistente na forma hebraica.
- source_word: אֶתֵּן
  choice: darei
  rationale: O imperfeito expressa a promessa futura de Yahweh; o futuro simples comunica com clareza sua força promissória.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: No contexto da promessa patriarcal, אֶרֶץ designa a terra prometida, não necessariamente o planeta nem um país politicamente constituído.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: E ali Abrão construiu um altar
  rationale: Mantém a progressão narrativa e explicita naturalmente em português o sujeito Abrão, evitando possível ambiguidade após a menção de Yahweh.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário ou a dedicação do altar; “a Yahweh” preserva essa relação de modo conciso.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: que lhe havia aparecido
  rationale: O particípio com artigo identifica Yahweh como aquele que apareceu a Abrão; o mais-que-perfeito composto deixa clara a anterioridade em relação à construção do altar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Amplitude referencial de זֶרַע
  choice: 'descendência, com nota “Ou: semente”'
  alternative: semente; descendentes
  rationale: O hebraico é singular na forma e pode ser coletivo. A tradução evita decidir antecipadamente se a promessa deve ser entendida apenas de maneira individual ou plural, enquanto a nota registra a forma lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, e “Abrão” foi repetido como sujeito na segunda frase para evitar ambiguidade.
