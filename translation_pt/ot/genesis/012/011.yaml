  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: pt
  text: 'Quando estava prestes a entrar no Egito, Abrão disse a Sarai, sua mulher: “Veja bem: eu sei que você é uma mulher de bela aparência.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mulher bonita de se ver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A construção narrativa introduz a circunstância temporal da fala. Em português, “Quando” comunica naturalmente essa função sem a fórmula pesada “E aconteceu que, quando”.
- source_word: הִקְרִיב לָבוֹא
  choice: estava prestes a entrar
  rationale: O hifil de קרב com o infinitivo בוא indica aproximação com entrada iminente; a expressão portuguesa preserva essa nuance de proximidade temporal.
- source_word: מִצְרָיְמָה
  choice: no Egito
  rationale: A terminação direcional indica movimento rumo ao Egito; com o verbo “entrar”, o português idiomático emprega “no Egito”.
- source_word: וַיֹּאמֶר אֶל
  choice: disse a
  rationale: Forma natural e direta de introduzir a fala, preservando a sequência narrativa.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: Sarai, sua mulher
  rationale: Mantém o nome e a identificação apositiva do hebraico. “Mulher” é corrente no registro bíblico e preserva a correspondência lexical com אִשָּׁה.
- source_word: הִנֵּה נָא
  choice: Veja bem
  rationale: Reproduz o marcador de atenção acompanhado de ênfase ou apelo, de modo conversacional e não arcaico.
- source_word: יָדַעְתִּי
  choice: eu sei
  rationale: O perfeito expressa aqui um estado presente de conhecimento; “sei” é o equivalente português mais natural.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: você é uma mulher de bela aparência
  rationale: Preserva a predicação explícita, a referência a Sarai como mulher e a ênfase na beleza visível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula narrativa hebraica foi vertida por uma oração temporal natural, sem perder a relação sequencial. O tratamento “você” evita a artificialidade regional de “tu” para muitos leitores, enquanto “sua mulher” conserva o tom bíblico sem arcaísmo excessivo.
