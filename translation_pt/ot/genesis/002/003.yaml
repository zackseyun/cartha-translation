base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: pt
  text: Então Deus abençoou o sétimo dia e o santificou[a], porque nele descansou[b] de toda a obra que Deus havia criado para fazer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez dele um dia santo” ou “separou-o como santo”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode significar “cessou”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “que Deus criou para fazer”. A frase final é difícil; também pode ser entendida como “que Deus havia criado e feito” ou “que Deus havia criado ao fazer”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: Expressa de modo direto e tradicional o piel de ברך, que aqui indica conferir bênção ao dia.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Com concordância verbal singular, refere-se ao único Deus e recebe seu equivalente natural em português.
- source_word: יּוֹם הַשְּׁבִיעִי
  choice: o sétimo dia
  rationale: Tradução formal e natural do substantivo com numeral ordinal definido.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: o santificou
  rationale: Preserva de maneira concisa e reconhecível o sentido de consagrar ou tornar santo, sem explicar além do hebraico.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da bênção e santificação do dia.
- source_word: בּוֹ
  choice: nele
  rationale: Retoma naturalmente 'o sétimo dia' em português.
- source_word: שָׁבַת
  choice: descansou
  rationale: É a formulação tradicional e natural no contexto, preservando a ligação conceitual com o sábado; a possibilidade lexical 'cessou' consta em nota.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: de toda a obra
  rationale: '''Obra'' comunica bem o conjunto da atividade criadora de Deus e se encaixa naturalmente com a preposição exigida por ''descansou''.'
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים
  choice: que Deus havia criado
  rationale: O mais-que-perfeito composto indica naturalmente que a criação precedeu o descanso, mantendo explícita a repetição de 'Deus' no hebraico.
- source_word: לַעֲשׂוֹת
  choice: para fazer
  rationale: Mantém o valor mais direto do infinitivo e preserva a construção difícil do hebraico, em vez de resolvê-la silenciosamente como uma coordenação.
theological_decisions:
- issue: Sentido de שָׁבַת e sua relação com o sábado
  choice: descansou
  alternative: cessou
  rationale: '''Descansou'' preserva a conhecida ligação canônica com o sábado sem exigir a ideia de fadiga divina; a alternativa lexical é registrada em nota.'
- issue: Sentido de וַיְקַדֵּשׁ אֹתוֹ
  choice: o santificou
  alternative: fez dele um dia santo; separou-o como santo
  rationale: '''Santificou'' conserva a linguagem de santidade e consagração do texto sem acrescentar uma explicação interpretativa ao corpo do versículo.'
- issue: Construção אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: que Deus havia criado para fazer
  alternative: que Deus havia criado e feito; que Deus havia criado ao fazer
  rationale: A formulação principal acompanha de perto a sintaxe hebraica e mantém sua dificuldade genuína; a nota apresenta interpretações plausíveis sem impor uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a repetição de “Deus” e a tensão sintática da frase final, esclarecida em nota. Todos os marcadores aparecem no texto em ordem.
