  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: pt
  text: Um rio saía do Éden para regar o jardim; dali, dividia-se e passava a formar quatro braços[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quatro cabeças”. Aqui, o termo hebraico se refere às quatro divisões principais do rio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Um rio
  rationale: נָהָר significa “rio”. O וְ conecta a frase ao contexto, mas não exige um marcador temporal como “então” ou “ora” em português.
- source_word: יֹצֵא מֵעֵדֶן
  choice: saía do Éden
  rationale: O particípio de יצא descreve a ação contínua de o rio proceder do Éden; o imperfeito “saía” é natural na narrativa portuguesa e preserva esse aspecto.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: para regar o jardim
  rationale: O infinitivo expressa finalidade. “Regar” é claro e menos técnico do que “irrigar”.
- source_word: וּמִשָּׁם
  choice: dali
  rationale: Expressa de modo conciso e natural a progressão espacial indicada por “e desde lá”.
- source_word: יִפָּרֵד
  choice: dividia-se
  rationale: O nifal de פרד pode indicar separar-se ou dividir-se. A forma pronominal mantém o rio como sujeito sem introduzir um agente.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: e passava a formar quatro braços[a]
  rationale: היה com לְ indica o estado resultante. Em contexto fluvial, “braços” comunica naturalmente as quatro divisões do rio, enquanto o sentido literal de רָאשִׁים é registrado em nota.
