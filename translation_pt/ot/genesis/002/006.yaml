  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: pt
  text: Mas uma névoa[a] subia da terra e regava toda a superfície do solo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma corrente de água” ou “um fluxo”. O termo hebraico é raro e pode indicar água que brotava da terra, em vez de névoa no ar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Mas uma névoa
  rationale: אֵד é um termo raro e de sentido discutido. “Névoa” combina naturalmente com o verbo “subia”; “mas” expressa o contraste contextual com a ausência de chuva mencionada no versículo anterior.
- source_word: יַעֲלֶה
  choice: subia
  rationale: O imperfeito qal de עלה, em uma descrição passada, pode indicar ação habitual ou característica. O pretérito imperfeito português comunica esse aspecto com naturalidade.
- source_word: מִן הָ/אָרֶץ
  choice: da terra
  rationale: אֶרֶץ tem aqui alcance amplo no contexto da criação; “terra” também preserva a distinção em relação a אֲדָמָה no fim do versículo.
- source_word: וְ/הִשְׁקָה
  choice: e regava
  rationale: O hifil de שקה significa dar de beber ou regar. “Regava” mantém a ação descritiva e habitual sem recorrer ao termo mais técnico “irrigava”.
- source_word: אֶת כָּל פְּנֵי
  choice: toda a superfície de
  rationale: A expressão hebraica designa toda a face ou extensão visível; “toda a superfície de” é clara e idiomática em português atual.
- source_word: הָ/אֲדָמָה
  choice: o solo
  rationale: אֲדָמָה se refere ao chão ou solo cultivável. “Solo” diferencia o termo de אֶרֶץ, traduzido como “terra” na mesma frase.
theological_decisions:
- issue: Interpretação de אֵד
  choice: névoa
  alternative: corrente de água ou fluxo
  rationale: O sentido exato do raro substantivo אֵד é incerto. “Névoa” se ajusta diretamente ao movimento ascendente expresso pelo verbo, enquanto a possibilidade de água brotando ou fluindo da terra é preservada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pretérito imperfeito (“subia”, “regava”) comunica a ação habitual ou característica do hebraico no contexto narrativo. A distinção lexical entre אֶרֶץ (“terra”) e אֲדָמָה (“solo”) foi mantida.
