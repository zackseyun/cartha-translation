  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: pt
  text: Então o SENHOR Deus fez cair um sono profundo sobre o homem[a], e ele dormiu; tomou uma de suas costelas e fechou a carne em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um de seus lados”. A palavra hebraica pode indicar um lado ou uma parte lateral, além de uma costela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: fez cair
  rationale: O hifil de נפל é causativo; “fez cair um sono profundo sobre” conserva a construção hebraica de modo natural em português.
- source_word: יְהוָה אֱלֹהִים
  choice: o SENHOR Deus
  rationale: Emprega a convenção portuguesa consagrada de representar o nome divino יהוה por “SENHOR”, mantendo o título composto.
- source_word: תַּרְדֵּמָה
  choice: um sono profundo
  rationale: O substantivo indica sono pesado ou torpor, aqui provocado por Deus; “sono profundo” é claro e adequado ao contexto.
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste contexto narrativo imediato, a expressão designa o indivíduo do qual a mulher será formada, não a humanidade em geral.
- source_word: וַיִּישָׁן
  choice: e ele adormeceu
  rationale: Embora a forma possa ser vertida literalmente por “e ele dormiu”, “adormeceu” evita repetição pouco natural e expressa com clareza o resultado da ação anterior.
- source_word: וַיִּקַּח
  choice: Depois, tomou
  rationale: A forma narrativa faz a sequência avançar; “depois” comunica essa progressão sem acrescentar conteúdo.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: uma de suas costelas
  rationale: צֵלָע pode significar “costela”, “lado” ou uma parte lateral. A imagem anatômica e o fechamento com carne favorecem “costela”, enquanto a alternativa relevante é preservada em nota.
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: fechou com carne o lugar dela
  rationale: A formulação comunica naturalmente que Deus fechou com carne o local de onde a costela ou parte lateral foi retirada, preservando o sentido contextual de תַּחְתֶּנָּה.
theological_decisions:
- issue: Sentido contextual de אָדָם
  choice: o homem
  alternative: o ser humano
  rationale: O referente é um indivíduo específico na narrativa, do qual a mulher será formada no versículo seguinte; por isso, o sentido masculino pessoal é primário aqui.
- issue: Sentido de צֵלָע
  choice: costela
  alternative: lado
  rationale: “Costela” se ajusta naturalmente à imagem corporal e ao fechamento do local com carne. Como “lado” é uma possibilidade lexical genuína e interpretativamente significativa, ela é mantida em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi mantida, e a ambiguidade relevante de צֵלָע foi sinalizada em nota.
