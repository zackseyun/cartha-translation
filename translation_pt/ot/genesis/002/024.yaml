  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: pt
  text: Por isso, um homem deixará seu pai e sua mãe, se apegará[a] à sua esposa, e eles se tornarão uma só carne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se unirá a” ou “ficará firmemente ligado a”. O verbo hebraico expressa forte apego ou adesão.
    reason: lexical_alternative
  - marker: b
    text: “Uma só carne” é uma expressão hebraica que inclui a união corporal e a formação de um novo vínculo de parentesco.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz a conclusão decorrente da narrativa anterior, em linguagem natural e atual.
- source_word: יַעֲזָב
  choice: deixará
  rationale: O imperfeito hebraico expressa aqui um princípio geral com projeção típica para o futuro; o futuro do português preserva esse caráter sem transformá-lo em imperativo.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o singular masculino representativo explicitamente empregado no hebraico.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: seu pai e sua mãe
  rationale: Conserva a menção distinta de ambos os pais, em vez de condensá-la em “seus pais”.
- source_word: וְדָבַק
  choice: se apegará
  rationale: Expressa vínculo firme e forte adesão de modo compreensível no português moderno, sem reduzir o verbo à mera proximidade física.
- source_word: בְּאִשְׁתּוֹ
  choice: à sua esposa
  rationale: Neste contexto matrimonial, אִשָּׁה com o sufixo possessivo designa a esposa; a escolha evita a possível ambiguidade de “mulher”.
- source_word: וְהָיוּ
  choice: e eles se tornarão
  rationale: A forma plural abrange o homem e a esposa; “se tornarão” comunica naturalmente a passagem ao estado expresso pelo predicativo.
- source_word: לְבָשָׂר אֶחָד
  choice: uma só carne
  rationale: Preserva a expressão hebraica e sua amplitude física e relacional, sem explicá-la excessivamente no corpo do texto.
theological_decisions:
- issue: Linguagem representativa de gênero na formulação do casamento
  choice: o homem
  alternative: a pessoa; alguém
  rationale: O hebraico emprega explicitamente o substantivo masculino singular אִישׁ; a tradução conserva essa forma sem a neutralizar.
- issue: Natureza da declaração
  choice: 'futuro com valor de princípio geral: “deixará... se apegará... se tornarão”'
  alternative: imperativo direto; simples descrição de um costume passado
  rationale: As formas verbais apresentam um princípio geral fundamentado na narrativa da criação, não uma ordem gramatical direta nem apenas um relato de prática antiga.
- issue: Alcance da expressão “uma só carne”
  choice: preservar a expressão no texto e esclarecer sua amplitude em nota
  alternative: substituí-la por “um só corpo” ou explicitar apenas união sexual ou apenas vínculo familiar
  rationale: A formulação hebraica comporta união corporal e formação de um novo vínculo de parentesco; uma paráfrase restritiva resolveria indevidamente essa riqueza semântica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O futuro verbal mantém o tom proverbial e normativo sem criar um imperativo ausente no hebraico. “Esposa” foi preferido a “mulher” por precisão contextual; “se apegará” retém a força relacional de דבק.
