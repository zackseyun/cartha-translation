  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: pt
  text: E da costela que havia tirado do homem, o SENHOR Deus construiu uma mulher e a levou ao homem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵלָע
  choice: costela
  rationale: Neste contexto da formação da mulher a partir do homem, “costela” é a tradução tradicional e natural; embora o termo também possa significar “lado” em outros contextos, não há necessidade de explicitar essa possibilidade no texto.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: Preserva a imagem concreta e incomum do verbo בנה, “construir/edificar”, em vez de reduzi-lo ao mais genérico “fez”.
- source_word: לְאִשָּׁה
  choice: uma mulher
  rationale: 'A preposição לְ indica o resultado da ação: a costela foi construída de modo a tornar-se uma mulher.'
- source_word: יְהוָה אֱלֹהִים
  choice: o SENHOR Deus
  rationale: Emprega a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por SENHOR, distinguindo-o do título divino comum.
- source_word: וַיְבִאֶהָ
  choice: e a levou
  rationale: O sufixo feminino retoma “mulher”; “levou” expressa naturalmente o movimento até o homem, sem acrescentar a ideia mais específica de apresentação.
theological_decisions:
- issue: Imagem divina da formação da mulher
  choice: construiu uma mulher
  alternative: fez uma mulher
  rationale: Mantém a metáfora arquitetônica do hebraico sem impor uma explicação teológica sobre a relação entre homem e mulher.
- issue: Representação do tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue uma convenção bíblica portuguesa de ampla aceitação e preserva a distinção visual em relação a outros usos de “Senhor”.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A abertura com “E” conserva a continuidade narrativa. “Havia tirado” assinala com clareza que a retirada precedeu a construção.
