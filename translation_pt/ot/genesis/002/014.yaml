  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: pt
  text: O nome do terceiro rio é Hidequel[a]; é o que corre a leste de Assur[b]. E o quarto rio é o Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hidequel é tradicionalmente identificado com o rio Tigre.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a leste da Assíria”; em hebraico, “a leste de Assur”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: nome
  rationale: Preserva o sentido comum do substantivo e a fórmula hebraica de nomeação.
- source_word: נָּהָר
  choice: rio
  rationale: É o equivalente direto e natural no contexto geográfico.
- source_word: שְּׁלִישִׁי
  choice: terceiro
  rationale: Tradução direta do ordinal hebraico.
- source_word: חִדֶּקֶל
  choice: Hidequel
  rationale: Translitera a forma hebraica do nome, deixando sua identificação tradicional com o Tigre para a nota.
- source_word: הֹלֵךְ
  choice: corre
  rationale: Em português, 'corre' descreve naturalmente o curso de um rio e mantém a imagem dinâmica do particípio hebraico.
- source_word: קִדְמַת
  choice: a leste de
  rationale: Expressa o sentido geográfico mais provável do termo neste contexto.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Mantém o nome próprio hebraico sem decidir no texto se a referência é à cidade, ao território ou à Assíria.
- source_word: רְבִיעִי
  choice: quarto
  rationale: Tradução direta do ordinal hebraico.
- source_word: פְרָת
  choice: Eufrates
  rationale: Emprega o nome português tradicional e inequivocamente reconhecido desse rio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem rigidez. 'Corre' é mais idiomático para um rio do que o literal 'vai'. Os topônimos seguem formas legíveis em português, preservando em nota a ambiguidade de Assur.
