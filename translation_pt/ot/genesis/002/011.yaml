  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: pt
  text: O nome do primeiro é Pisom; é o que contorna toda a terra de Havilá[a], onde há ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “circunda toda a terra de Havilá”. O particípio hebraico pode significar “dar a volta”, “contornar” ou “circundar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: O nome do primeiro
  rationale: No contexto da sequência de quatro rios, הָאֶחָד tem função ordinal; a formulação é clara e natural em português.
- source_word: פִּישׁוֹן
  choice: Pisom
  rationale: Transliteração tradicional e reconhecível em português do nome próprio do rio.
- source_word: הוּא הַסֹּבֵב
  choice: é o que contorna
  rationale: O particípio de סבב indica dar a volta, circundar ou contornar. “Contorna” preserva a imagem geográfica sem acrescentar explicitamente o verbo “fluir”, ausente no hebraico.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: toda a terra de Havilá
  rationale: Preserva כָּל e entende אֶרֶץ como território nomeado; “Havilá” segue a forma tradicional portuguesa.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: onde há ouro
  rationale: Expressa de modo idiomático o relativo locativo com שָׁם; em português, o artigo hebraico não precisa ser reproduzido diante do material em uma construção existencial.
