base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: pt
  text: Estas são as gerações[a] dos céus e da terra quando foram criados, no dia em que[b] Yahweh[c] Deus fez a terra e os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por “gerações” também pode significar “relato”, “história” ou “origens” e introduz seções importantes de Gênesis.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no dia em que”; aqui, a expressão hebraica significa “quando” ou “na ocasião em que”.
    reason: lexical_alternative
  - marker: c
    text: O nome divino em hebraico é YHWH, aqui representado por “Yahweh”; tradicionalmente, é traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Estas são as gerações
  rationale: Preserva o plural explícito e a ligação lexical da fórmula estruturante de Gênesis; a nota registra sentidos contextuais mais naturais em português.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: dos céus e da terra
  rationale: Mantém a ordem, os artigos e o plural formal de שָׁמַיִם, bem como a expressão abrangente da ordem criada.
- source_word: בְּהִבָּרְאָם
  choice: quando foram criados
  rationale: Expressa de modo natural o valor temporal da preposição com o infinitivo e conserva a voz passiva do nifal.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: quando ... fez
  rationale: Traduz o idiomatismo hebraico בְּיוֹם por seu sentido temporal corrente, evitando em português a impressão indevida de um dia específico de 24 horas.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Translitera o nome divino YHWH e traduz אֱלֹהִים como Deus, preservando a sequência hebraica.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: a terra e os céus
  rationale: Preserva a inversão literária da ordem anterior e representa os artigos hebraicos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio YHWH. A transliteração o distingue do título אֲדֹנָי e evita ocultá-lo; a forma tradicional é indicada em nota.
- issue: Alcance temporal de בְּיוֹם
  choice: quando
  alternative: no dia em que
  rationale: Neste padrão sintático, a expressão funciona idiomaticamente como indicação geral de tempo. A escolha não impõe uma duração específica nem resolve questões sobre a sequência da criação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a repetição e a inversão deliberada entre “os céus e a terra” e “a terra e os céus”. Todos os marcadores aparecem no texto principal junto ao elemento pertinente.
