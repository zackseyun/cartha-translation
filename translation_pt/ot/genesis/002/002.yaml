  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: pt
  text: Ao chegar o sétimo dia, Deus já havia terminado a obra que tinha feito[a]; e, no sétimo dia, descansou de toda a obra que tinha feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “No sétimo dia, Deus terminou a obra que tinha feito”. A redação hebraica é muitas vezes traduzida assim; “Ao chegar o sétimo dia” no texto principal expressa o provável sentido no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: havia terminado
  rationale: O verbo כלה significa concluir ou terminar. O mais-que-perfeito composto comunica naturalmente que a obra já estava concluída quando chegou o sétimo dia.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo está no singular e, neste contexto, a palavra designa o único Deus.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Até o sétimo dia / no sétimo dia
  rationale: Na primeira ocorrência, 'Até o sétimo dia' expressa o provável valor temporal no contexto; na segunda, 'no sétimo dia' traduz diretamente o momento em que Deus descansou. A formulação literal da primeira ocorrência é registrada em nota.
- source_word: מְלַאכְתּוֹ
  choice: a obra
  rationale: מְלָאכָה designa trabalho, tarefa ou obra. 'Obra' é natural no relato da criação e mantém a referência ao conjunto do que Deus realizou.
- source_word: אֲשֶׁר עָשָׂה
  choice: que tinha feito
  rationale: עשה é um verbo amplo, 'fazer' ou 'realizar'. 'Que tinha feito' conserva essa amplitude sem restringir o sentido à fabricação material.
- source_word: וַיִּשְׁבֹּת
  choice: descansou
  rationale: שבת significa fundamentalmente cessar. Neste contexto, 'descansou' é a expressão tradicional e natural, entendida como cessação da obra, não como recuperação por cansaço.
- source_word: מִכָּל
  choice: de toda
  rationale: A combinação מן com כָּל indica que Deus cessou a totalidade de sua obra; 'de toda' reproduz essa relação de modo idiomático em português.
theological_decisions:
- issue: Se o texto implica que Deus trabalhou durante o sétimo dia
  choice: A oração principal diz 'Até o sétimo dia, Deus havia terminado', indicando que a obra já estava concluída então.
  alternative: '''No sétimo dia, Deus terminou a obra'' é a tradução mais formalmente literal do hebraico.'
  rationale: A construção hebraica diz literalmente 'no sétimo dia', mas o contexto imediatamente afirma que Deus descansou nesse mesmo dia. A tradução principal comunica o provável sentido temporal sem apagar a forma hebraica, que é preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A repetição de 'que tinha feito' foi mantida por corresponder à repetição deliberada do hebraico. O ponto e vírgula distingue as duas ações estreitamente relacionadas.
