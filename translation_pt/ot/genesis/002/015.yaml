base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: pt
  text: Então Yahweh Deus tomou o homem e o colocou no jardim do Éden para trabalhar e guardar o jardim[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para cultivá-lo e vigiá-lo”. Os verbos hebraicos podem ter os sentidos de “trabalhar/cultivar” e “guardar, vigiar ou cuidar de”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como “o colocou” também pode significar “fez descansar” ou “estabeleceu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Na expressão יְהוָה אֱלֹהִים, mantém o título divino ao lado do nome pessoal de modo natural em português.
- source_word: הָאָדָם
  choice: o homem
  rationale: O contexto aponta para o indivíduo humano anteriormente formado, não para a humanidade em sentido coletivo.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Reproduz diretamente o sentido narrativo comum de לקח sem ampliar indevidamente a ação.
- source_word: וַיַּנִּחֵהוּ
  choice: o colocou
  rationale: Expressa naturalmente a ideia contextual de pôr ou estabelecer o homem no jardim, preservando em nota a possível nuance de descanso.
- source_word: בְּגַן עֵדֶן
  choice: no jardim do Éden
  rationale: É uma formulação natural e consagrada em português, mantendo Éden como nome próprio.
- source_word: לְעָבְדָהּ
  choice: para cultivá-lo
  rationale: Com o jardim como referente contextual, 'cultivar' comunica de modo claro o uso agrícola de עבד, enquanto a amplitude 'trabalhar/servir' é registrada em nota.
- source_word: וּלְשָׁמְרָהּ
  choice: e cuidar dele
  rationale: '''Cuidar'' transmite em português corrente a responsabilidade de manter e zelar pelo jardim sem restringir o verbo שמר a uma guarda militar; as alternativas são preservadas em nota.'
theological_decisions:
- issue: Função da tarefa humana no Éden
  choice: A tarefa é expressa em termos comuns de cultivo e cuidado do jardim, sem impor uma leitura tipológica especializada.
  alternative: Entender o par verbal principalmente como linguagem sacerdotal de servir e guardar, ou exclusivamente como trabalho agrícola.
  rationale: עבד e שמר admitem sentidos agrícolas e também podem evocar serviço e guarda; o versículo isoladamente não exige que essa tensão seja resolvida em favor de uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e a retomada por “dele” evitam ambiguidade formal e mantêm fluidez. As notas preservam a amplitude lexical dos verbos hebraicos e a possível nuance de descanso.
