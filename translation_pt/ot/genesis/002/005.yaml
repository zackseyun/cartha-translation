source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: pt
  text: Ainda não havia nenhum arbusto do campo[a] na terra, e nenhuma planta do campo ainda havia brotado, porque Yahweh Deus[b] ainda não tinha feito chover sobre a terra, e não havia ser humano para cultivar o solo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “moita do campo”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “SENHOR Deus”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “não havia homem para trabalhar a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: arbusto do campo
  rationale: שִׂיחַ designa um arbusto ou moita, em contraste com עֵשֶׂב na oração seguinte; a expressão mantém a construção hebraica sem especificar que se trata de vegetação silvestre.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: ainda existia na terra
  rationale: טֶרֶם indica que algo ainda não havia ocorrido, e היה com בָאָרֶץ expressa aqui existência ou presença. A negação é veiculada por “nenhum” no início da oração.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: planta do campo
  rationale: עֵשֶׂב abrange vegetação herbácea. “Planta” é atual e compreensível, além de preservar a distinção em relação a “arbusto”.
- source_word: טֶרֶם יִצְמָח
  choice: havia brotado
  rationale: צמח descreve brotar ou crescer. Com “nenhuma” e o contexto temporal, “havia brotado” comunica naturalmente a não ocorrência até aquele momento.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz as razões da ausência da vegetação mencionada, e “porque” explicita com clareza essa relação causal.
- source_word: הִמְטִיר
  choice: tinha feito chover
  rationale: A forma causativa de מטר indica fazer a chuva cair; “feito chover” preserva essa força sem tornar a frase pesada.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: A transliteração “Yahweh” representa o nome divino יְהוָה, enquanto אֱלֹהִים é traduzido por “Deus”.
- source_word: וְאָדָם אַיִן
  choice: não havia ser humano
  rationale: אָדָם é aqui o ser humano representativo, ainda inexistente como cultivador. “Ser humano” preserva o sentido genérico sem antecipar desnecessariamente uma referência exclusivamente masculina.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: para cultivar o solo
  rationale: Neste contexto, עבד significa trabalhar ou cultivar, e אֲדָמָה é o solo cultivável. A formulação é natural em português e mantém a distinção em relação a אֶרֶץ, “terra”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino. “Yahweh” o apresenta diretamente; a nota registra a convenção tradicional sem substituir o nome no texto principal.
- issue: Alcance de אָדָם neste contexto
  choice: ser humano
  alternative: homem
  rationale: A construção indica a ausência de um humano que cultivasse o solo. “Ser humano” mantém o valor representativo e genérico do termo; “homem” continua possível e é registrado em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Terra” traduz אֶרֶץ, enquanto “solo” traduz אֲדָמָה, preservando a distinção lexical hebraica. A repetição de “terra” foi mantida por corresponder à repetição do texto-fonte.
