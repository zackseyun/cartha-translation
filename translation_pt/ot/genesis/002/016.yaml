  naturalness: «Comer à vontade de toda árvore» é compreensível, mas soa menos idiomático em português moderno, pois «à vontade» tende a qualificar quantidade ou liberdade de servir-se. «Comer livremente de toda árvore» é mais fluido e conserva melhor a ênfase permissiva.
  terminology: «Yahweh Deus», «o homem» e «jardim» são escolhas consistentes e adequadas. «Livremente» evita introduzir uma nuance de quantidade e corresponde bem ao valor enfático-permissivo reconhecido também pela tradição tradutória.
