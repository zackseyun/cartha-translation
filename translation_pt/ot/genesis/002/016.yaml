source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: pt
  text: 'E Yahweh Deus ordenou ao homem: “Você pode comer livremente[a] de toda árvore do jardim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente pode comer”. O hebraico combina o infinitivo absoluto com o verbo conjugado para dar ênfase.'
    reason: alternativa lexical e explicação da construção hebraica
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem ou determinação com autoridade; “ordenou” transmite essa força de modo claro e natural.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém o nome divino pessoal יְהוָה por transliteração e traduz אֱלֹהִים pelo equivalente português corrente “Deus”.
- source_word: עַל־הָאָדָם
  choice: ao homem
  rationale: Com צוה, a preposição עַל introduz o destinatário da ordem. הָאָדָם designa aqui o indivíduo humano já formado e colocado no jardim.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo hebraico introduz a fala direta; em português atual, os dois-pontos cumprem essa função com maior naturalidade do que “dizendo”.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: de toda árvore do jardim
  rationale: A expressão estende a permissão a cada árvore do jardim; a construção escolhida preserva o alcance distributivo de כֹּל.
- source_word: אָכֹל תֹּאכֵל
  choice: pode comer à vontade
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação. No contexto, trata-se de ampla permissão, não de uma obrigação de comer; “à vontade” expressa naturalmente essa liberdade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz o nome pessoal divino, não apenas um título. “Yahweh” o preserva por transliteração sem substituí-lo por “Senhor”.
- issue: Referência de הָאָדָם
  choice: o homem
  alternative: o ser humano ou a humanidade
  rationale: Neste ponto da narrativa, a expressão se refere ao indivíduo colocado no jardim, e não à humanidade em sentido coletivo.
- issue: Força modal de אָכֹל תֹּאכֵל
  choice: 'permissão enfática: “pode comer à vontade”'
  alternative: 'obrigação ou previsão: “certamente comerá”'
  rationale: Embora a construção intensifique o verbo, o contraste com a proibição do versículo seguinte indica que aqui ela concede permissão ampla. A tradução mantém a ênfase sem transformar a frase em ordem para comer.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos substituem naturalmente a fórmula hebraica “dizendo”; “à vontade” comunica a permissão enfática sem sugerir uma obrigação.
