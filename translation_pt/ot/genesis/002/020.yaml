base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: pt
  text: E o homem deu nomes a todos os animais domésticos, às aves do céu e a todos os animais selvagens; mas, para o homem, não se encontrou quem o ajudasse e lhe correspondesse.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Adão deu nomes... mas, para Adão, não se encontrou quem o ajudasse e lhe correspondesse”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, de modo mais próximo da forma ativa do hebraico: “mas o homem não encontrou quem o ajudasse e lhe correspondesse”. A expressão «quem o ajudasse e lhe correspondesse» também pode ser traduzida por «uma ajuda adequada para ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: o homem / para o homem
  rationale: O artigo na primeira ocorrência favorece o sentido comum «o homem», referindo-se ao indivíduo da narrativa. A segunda ocorrência retoma o mesmo referente. «Adão» é possível, mas o sentido de substantivo comum ainda se destaca.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: deu nomes
  rationale: A expressão hebraica designa o ato de atribuir nomes. «Deu nomes» é natural em português e preserva o objeto plural שֵׁמוֹת.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: Neste contraste com as aves e os animais selvagens, בְּהֵמָה indica os animais domesticados como classe. A formulação é clara e amplamente compreensível em português.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: Mantém a imagem hebraica numa expressão bíblica ainda natural e corrente em português.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: todos os animais selvagens
  rationale: A expressão refere-se aos animais terrestres não domesticados. «Animais selvagens» comunica com clareza o contraste contextual.
- source_word: עֵזֶר
  choice: quem o ajudasse
  rationale: עֵזֶר pode designar auxílio ou aquele que auxilia. A oração relativa evita o peso potencialmente subordinador de «ajudante» e expressa naturalmente em português a pessoa que presta auxílio, sem implicar inferioridade.
- source_word: כְּנֶגְדּוֹ
  choice: e lhe correspondesse
  rationale: A expressão comunica alguém diante dele e correspondente a ele. «Lhe correspondesse» preserva a reciprocidade e a adequação relacional sem reduzir o sentido apenas a «adequado».
- source_word: לֹא מָצָא
  choice: não se encontrou
  rationale: Embora o hebraico seja formalmente ativo, «ele não encontrou», a construção impessoal portuguesa expressa naturalmente o resultado da busca e preserva o foco na inexistência de alguém correspondente. A forma ativa é registrada em nota.
theological_decisions:
- issue: Sentido de אָדָם em Gênesis 2:20
  choice: o homem
  alternative: Adão
  rationale: O contexto trata do indivíduo humano no jardim, e a primeira ocorrência tem artigo. «O homem» preserva o desenvolvimento literário e o valor comum do substantivo; «Adão» continua sendo uma leitura possível e é indicado em nota.
- issue: Relação expressa por עֵזֶר כְּנֶגְדּוֹ
  choice: quem o ajudasse e lhe correspondesse
  alternative: uma ajuda adequada para ele
  rationale: A tradução escolhida conserva tanto a função de auxílio quanto a ideia de correspondência diante dele, sem inserir hierarquia, inferioridade ou uma teoria específica de complementaridade.
- issue: Voz de לֹא מָצָא
  choice: não se encontrou
  alternative: ele não encontrou
  rationale: A forma hebraica é ativa e tem o homem como sujeito provável, mas a tradução impessoal apresenta idiomaticamente o resultado. A nota preserva a leitura formalmente ativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Animais domésticos» evita o regionalismo potencial de «gado» como termo abrangente; «aves do céu» mantém a imagem do original. A construção «quem o ajudasse e lhe correspondesse» comunica a dimensão pessoal e relacional do hebraico sem atribuir subordinação ao auxílio.
