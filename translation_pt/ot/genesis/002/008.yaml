  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: pt
  text: E Yahweh Deus plantou um jardim no Éden, no oriente[a], e ali colocou o homem que havia formado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o leste”. A expressão hebraica pode indicar tanto localização (“no oriente”) quanto orientação ou direção.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּטַּע
  choice: plantou
  rationale: O verbo נטע descreve naturalmente o ato de plantar; a escolha preserva a imagem concreta de um jardim cultivado.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém o nome divino representado pelo Tetragrama e traduz אֱלֹהִים pela forma portuguesa comum “Deus”.
- source_word: גַּן
  choice: jardim
  rationale: É o equivalente português claro e habitual para uma área cultivada ou cercada neste contexto.
- source_word: בְעֵדֶן
  choice: no Éden
  rationale: Trata עֵדֶן como nome de lugar e emprega a forma tradicional em português.
- source_word: מִקֶּדֶם
  choice: no oriente
  rationale: Expressa a leitura locativa provável sem eliminar a possível ideia de direção, registrada em nota.
- source_word: וַיָּשֶׂם שָׁם
  choice: ali colocou
  rationale: Reproduz de modo natural tanto o verbo de colocação quanto o advérbio de lugar.
- source_word: הָאָדָם
  choice: o homem
  rationale: O sintagma definido se refere aqui ao indivíduo específico já formado, e não à humanidade em geral.
- source_word: אֲשֶׁר יָצָר
  choice: que havia formado
  rationale: O mais-que-perfeito deixa clara, em português natural, a formação anterior do homem sem acrescentar conteúdo ao hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de הָאָדָם
  choice: o homem
  alternative: o ser humano; a humanidade
  rationale: Neste ponto da narrativa, a expressão definida designa o indivíduo que Deus formou; “a humanidade” tornaria coletiva uma referência singular.
- issue: Valor de מִקֶּדֶם
  choice: no oriente
  alternative: para o leste
  rationale: O hebraico admite uma leitura de localização ou de orientação/direção; a tradução adota a primeira e conserva a segunda em nota.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe narrativa fluente. “Ali colocou” evita rigidez desnecessária; “Yahweh” conserva a forma do nome divino solicitada pela evidência e pelas decisões fornecidas.
