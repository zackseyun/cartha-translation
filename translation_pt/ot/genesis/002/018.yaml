  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: pt
  text: 'Então Yahweh Deus disse: “Não é bom que o homem esteja só. Farei para ele uma auxiliadora que lhe corresponda.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma auxiliadora adequada para ele”, “uma auxiliadora à sua altura” ou “alguém que o auxilie e lhe seja correspondente”. A expressão hebraica indica alguém que está diante dele e lhe corresponde, não uma mera assistente de condição inferior.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino pessoal e o título אֱלֹהִים em uma combinação natural em português.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O verbo expressa fala, e o waw consecutivo faz a narrativa avançar; “Então” comunica naturalmente essa sequência.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Não é bom que o homem esteja só
  rationale: Reproduz a avaliação predicativa e verte de maneira idiomática a construção infinitiva com seu sujeito.
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste contexto, refere-se ao indivíduo masculino já formado e presente no jardim, sem excluir sua função representativa.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Farei para ele
  rationale: O imperfeito na primeira pessoa comunica a intenção divina, e o dativo é preservado explicitamente.
- source_word: עֵזֶר
  choice: uma auxiliadora
  rationale: O substantivo designa quem presta auxílio. O feminino torna explícito, de modo natural no contexto imediato, que se trata da mulher que será formada, sem implicar condição inferior.
- source_word: כְּנֶגְדּוֹ
  choice: que lhe corresponda
  rationale: Expressa a ideia de alguém diante dele, em correspondência com ele ou à sua altura, sem reduzir a relação à de mera assistente subordinada.
theological_decisions:
- issue: Sentido contextual de אָדָם
  choice: o homem
  alternative: o ser humano; a humanidade
  rationale: A narrativa tem em vista o indivíduo masculino que está sozinho, embora ele também possua significado representativo.
- issue: Possível leitura hierárquica de עֵזֶר כְּנֶגְדּוֹ
  choice: uma auxiliadora que lhe corresponda
  alternative: uma ajudadora adequada para ele; alguém que o auxilie e lhe seja correspondente
  rationale: O hebraico afirma auxílio e correspondência, mas não declara inferioridade nem superioridade; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Auxiliadora” conserva o valor pessoal de עֵזֶר e concorda com a referência feminina do contexto; a nota registra alternativas mais idiomáticas e esclarece a amplitude de כְּנֶגְדּוֹ.
