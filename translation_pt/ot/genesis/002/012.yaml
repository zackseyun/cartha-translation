translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao hebraico. “Ali há” oferece leitura natural e amplamente compreensível. Os termos incertos são mantidos no texto segundo suas identificações tradicionais, com alternativas registradas em notas.
