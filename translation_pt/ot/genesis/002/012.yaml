  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: pt
  text: E o ouro daquela terra é bom; ali há bdélio[a] e pedra de ônix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “resina aromática”; não se sabe ao certo que substância o termo hebraico designa.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, outra pedra preciosa, como o berilo; a identificação exata do hebraico שֹׁהַם é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: E o ouro
  rationale: O waw liga a frase à descrição anterior, e זָהָב significa diretamente “ouro”.
- source_word: הָאָרֶץ הַהִוא
  choice: daquela terra
  rationale: אֶרֶץ, neste contexto geográfico, é naturalmente “terra”, e הַהִוא retoma a terra de Havilá mencionada no versículo anterior.
- source_word: טוֹב
  choice: é bom
  rationale: Mantém a avaliação simples do hebraico e indica a boa qualidade do ouro sem explicitação excessiva.
- source_word: שָׁם
  choice: ali há
  rationale: שָׁם significa “ali/lá”; a construção existencial é natural em português antes dos dois elementos enumerados.
- source_word: הַבְּדֹלַח
  choice: bdélio
  rationale: A identificação exata da substância é incerta; o termo tradicional “bdélio” preserva essa especificidade lexical sem impor uma identificação segura.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: e pedra de ônix
  rationale: אֶבֶן é “pedra”, enquanto שֹׁהַם designa uma pedra preciosa de identificação incerta, tradicionalmente entendida como ônix.
