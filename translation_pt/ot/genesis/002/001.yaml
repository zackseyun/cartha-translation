  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: pt
  text: Assim foram concluídos[a] os céus e a terra, e tudo o que neles há[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram completados”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todo o seu exército”, isto é, o conjunto completo de tudo o que ocupa os céus e a terra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: foram concluídos
  rationale: O verbo כלה, nesta forma passiva e narrativa, apresenta os céus e a terra como levados à sua conclusão. “Foram concluídos” preserva o sentido passivo e resultativo em português natural.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Mantém a forma plural convencional e o alcance cosmológico da expressão no relato da criação, sem a restringir ao céu visível.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: No contexto da criação, אֶרֶץ designa o domínio terrestre em contraste e conjunto com os céus, não uma região ou terra localizada.
- source_word: וְכָל
  choice: com tudo
  rationale: A construção portuguesa “com tudo” expressa naturalmente que a totalidade mencionada participa da conclusão dos céus e da terra, sem alterar o alcance abrangente do hebraico.
- source_word: צְבָאָם
  choice: o que neles há
  rationale: צָבָא pode indicar exército, multidão organizada ou conjunto. Neste resumo cosmológico, a expressão se refere ao conjunto completo do que ocupa ou pertence aos céus e à terra. Esta formulação é clara em português atual, enquanto a nota preserva a imagem lexical de “exércitos”.
theological_decisions:
- issue: Alcance de צְבָאָם (“todo o seu exército/conjunto”)
  choice: Referência abrangente a tudo o que há nos céus e na terra
  alternative: Referência mais estreita aos astros ou ênfase metafórica em fileiras militares
  rationale: A frase resume a conclusão de toda a ordem criada. O termo pode evocar corpos celestes ou uma multidão organizada, mas o par “os céus e a terra” favorece aqui um sentido abrangente; a nota mantém visível a metáfora hebraica sem restringir o referente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem verbal evita possível discordância inicial e mantém o tom conclusivo do hebraico. A tradução principal privilegia clareza contemporânea; as notas registram tanto a alternativa lexical quanto a imagem coletiva de צָבָא.
