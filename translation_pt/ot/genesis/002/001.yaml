  source_fidelity: A tradução comunica corretamente a conclusão dos céus, da terra e de tudo o que os compõe. Contudo, «com tudo o que neles há» transforma a coordenação hebraica («e todo o seu exército/conjunto») numa construção comitativa. «E tudo o que neles há» preserva melhor a estrutura sem impor uma leitura militar ou limitar o referente aos astros.
  naturalness: «Assim foram concluídos os céus e a terra» é português moderno, claro e de registro apropriado. «E tudo o que neles há» é igualmente natural e melhora o paralelismo da frase.
