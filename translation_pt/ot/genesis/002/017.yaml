  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: pt
  text: mas da árvore do conhecimento do bem e do mal você não comerá[a], pois, no dia em que dela comer[b], certamente morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete literalmente a referência: “mas da árvore do conhecimento do bem e do mal você não comerá dela”.'
    reason: previous_rendering
  - marker: b
    text: A expressão hebraica “no dia em que” também pode significar “quando”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: mas da árvore
  rationale: A conjunção וְ com מִן é literalmente “e da árvore”, mas aqui estabelece contraste com a ampla permissão do versículo anterior; “mas da árvore” reproduz naturalmente essa função discursiva.
- source_word: הַדַּעַת
  choice: do conhecimento
  rationale: O substantivo דַּעַת denota conhecimento ou ato de conhecer. Na relação construta com “bem e mal”, “do conhecimento” é a formulação portuguesa mais natural e formalmente próxima.
- source_word: טוֹב וָרָע
  choice: do bem e do mal
  rationale: A expressão forma um par abrangente em hebraico. “Bem e mal” conserva tanto sua amplitude quanto seu peso moral, sem reduzir רַע a algo meramente desagradável.
- source_word: לֹא תֹאכַל
  choice: você não comerá
  rationale: O imperfeito negado expressa uma proibição. O futuro com valor imperativo conserva o tom solene e categórico do hebraico e é claro em português, embora “não coma” também fosse possível.
- source_word: מִמֶּנּוּ
  choice: dela
  rationale: A preposição מִן está expressa no hebraico. Em português, “dela” preserva essa relação e concorda naturalmente com “árvore”.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão da proibição. “Pois” é conciso, digno e natural neste contexto.
- source_word: בְּיוֹם
  choice: no dia
  rationale: A formulação mantém a expressão temporal hebraica em vez de a reduzir diretamente a “quando”, preservando sua abertura e a tensão narrativa posterior.
- source_word: אֲכָלְךָ
  choice: em que dela comer
  rationale: O infinitivo construto com sufixo, depois de בְּיוֹם, tem função temporal. “No dia em que dela comer” é idiomático em português e permanece próximo da estrutura hebraica.
- source_word: מוֹת תָּמוּת
  choice: certamente morrerá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da morte. “Certamente morrerá” comunica a ênfase sem reproduzir de modo artificial a construção “morrendo morrerá”.
theological_decisions:
- issue: Força temporal de בְּיוֹם אֲכָלְךָ em relação ao cumprimento da morte
  choice: Manter “no dia em que dela comer”, sem definir como a morte se cumpre nesse dia.
  alternative: Traduzir dinamicamente por “quando dela comer” ou interpretar a frase como morte física imediata.
  rationale: O hebraico admite o uso idiomático de “no dia” com o sentido mais geral de “quando”, mas sua forma também sustenta uma leitura temporal mais estrita. A tradução preserva essa tensão sem decidir entre morte física imediata, início da mortalidade ou sentença certa de morte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O futuro “não comerá” preserva a solenidade da proibição; “certamente morrerá” comunica claramente a intensificação hebraica. As notas mantêm visíveis tanto a estrutura tópica do original quanto a ambiguidade temporal relevante.
