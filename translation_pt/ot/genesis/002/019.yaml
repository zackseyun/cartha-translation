revisions:
- from: Javé Deus formou[a] do solo todos os animais selvagens e todas as aves do céu e os trouxe ao homem[b] para ver como ele os chamaria. Qualquer que fosse o nome que o homem desse a cada ser vivo, esse seria o seu nome.
  to: Javé Deus formou[a] do solo todos os animais selvagens e todas as aves do céu e os trouxe ao homem[b] para ver que nome ele lhes daria. Todo nome que o homem desse a cada ser vivo seria o nome desse ser vivo.
  rationale: A revisão substitui “como” por “que nome”, correspondendo ao interrogativo hebraico מַה, e simplifica a segunda oração para conservar com maior clareza a generalização (“todo nome”) e a aplicação a cada criatura. Não altera as escolhas de nome divino, tempo verbal, referente de ha’adam ou terminologia para os seres vivos.
