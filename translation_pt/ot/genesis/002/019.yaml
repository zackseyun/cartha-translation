  source_fidelity: 'A primeira oração traduz bem os elementos principais do hebraico. Contudo, “como ele os chamaria” tende a perguntar pelo modo de chamá-los, enquanto מַה pede o conteúdo da designação: “que nome ... daria” ou equivalente. A segunda frase também pode exprimir de forma mais direta a relação entre o nome dado e o nome da criatura.'
  naturalness: O texto é claro e de registro adequado. “Todo nome que o homem desse a cada ser vivo seria o nome desse ser vivo” é mais idiomático e menos circular do que “Qualquer que fosse o nome ... esse seria o seu nome”.
  terminology: “Javé Deus”, “solo”, “animais selvagens”, “aves do céu”, “o homem” e “ser vivo” são escolhas aceitáveis em português moderno e correspondem adequadamente ao hebraico. As notas preservam de modo apropriado as alternativas “havia formado” e “Adão”.
  issues:
