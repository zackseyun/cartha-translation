id: GEN.2.19
reference: Genesis 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: pt
  text: Javé Deus formou[a] do solo todos os animais selvagens e todas as aves do céu e os trouxe ao homem[b] para ver que nome ele lhes daria. Todo nome que o homem desse a cada ser vivo seria o nome desse ser vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “havia formado”. O verbo hebraico pode ser entendido como passado simples; o mais-que-perfeito explicitaria que a formação ocorreu antes de Deus levar os animais ao homem.
    reason: alternative_reading
  - marker: b
    text: Ou “Adão”. O hebraico traz ha’adam, literalmente “o homem”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: formou
  rationale: O wayyiqtol apresenta normalmente a ação na sequência narrativa. O pretérito perfeito é a correspondência portuguesa mais direta, sem excluir que a formação seja anterior no contexto.
- source_word: יְהוָה אֱלֹהִים
  choice: Javé Deus
  rationale: Emprega o nome divino como nome próprio, conforme o hebraico, na forma portuguesa amplamente reconhecida “Javé”, seguido de “Deus”.
- source_word: מִן הָאֲדָמָה
  choice: do solo
  rationale: “Solo” expressa a terra material da qual os seres foram formados e mantém, tanto quanto possível em português, a ligação conceitual com a origem do homem.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: todos os animais selvagens
  rationale: A expressão designa os animais terrestres associados ao campo ou espaço aberto; “animais selvagens” evita que “animais do campo” seja entendido apenas como animais rurais ou domésticos.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: todas as aves do céu
  rationale: Tradução natural e próxima do hebraico para as criaturas voadoras neste contexto.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: e os trouxe ao homem
  rationale: O pronome plural retoma os animais e as aves; הָאָדָם, com artigo, é mantido como substantivo comum, “o homem”.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: para ver como ele os chamaria
  rationale: Mantém o infinitivo de finalidade e verte קרא de modo idiomático, preservando a ideia de atribuição de nomes.
- source_word: וְכֹל אֲשֶׁר יִקְרָא לוֹ הָאָדָם נֶפֶשׁ חַיָּה הוּא שְׁמוֹ
  choice: Qualquer que fosse o nome que o homem desse a cada ser vivo, esse seria o seu nome
  rationale: Expressa naturalmente em português a construção distributiva e generalizante do hebraico, sem perder a relação entre a designação dada pelo homem e o nome de cada criatura.
- source_word: נֶפֶשׁ חַיָּה
  choice: ser vivo
  rationale: Neste contexto, a expressão hebraica refere-se a uma criatura animada; “ser vivo” evita associações teológicas indevidas de “alma vivente”.
theological_decisions:
- issue: Valor temporal de וַיִּצֶר em relação à ordem da criação
  choice: formou
  alternative: havia formado
  rationale: A forma verbal hebraica não marca por si só o mais-que-perfeito. “Formou” traduz diretamente a forma narrativa; “havia formado” continua possível como leitura contextual e é registrada em nota, sem harmonizar nem criar contradição de modo artificial.
- issue: הָאָדָם como substantivo comum ou nome próprio
  choice: o homem
  alternative: Adão
  rationale: A presença do artigo e a ligação imediata com אֲדָמָה favorecem o sentido comum “o homem”. A leitura tradicional como nome próprio é possível em português e consta da nota.
- issue: Representação de יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino. “Javé” o representa como nome próprio em português, enquanto “SENHOR” reflete uma tradição substitutiva de leitura.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A segunda frase foi formulada de maneira idiomática sem eliminar o caráter distributivo de “cada ser vivo”. Os marcadores [a] e [b] aparecem junto aos pontos exatos a que as notas se referem.
