    rationale: “Qualquer que fosse o nome que ... desse ..., esse seria o seu nome” é compreensível, mas a dupla estrutura condicional e demonstrativa torna a frase menos direta que o hebraico. “Todo nome que ... desse ... seria o nome desse ser vivo” conserva o valor generalizante e distributivo.
