    issue: “como ele os chamaria” para מַה יִּקְרָא לוֹ
    rationale: Em português, “como” normalmente indica maneira, ao passo que o hebraico מַה introduz aquilo que seria chamado, isto é, o nome que o homem daria aos animais. A revisão explicita esse objeto sem acrescentar interpretação.
