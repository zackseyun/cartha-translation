lexical_decisions:
- source_word: וְ/שֵׁם
  choice: E o nome
  rationale: O וְ dá continuidade à descrição dos rios, e שֵׁם significa diretamente “nome”.
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: do segundo rio
  rationale: '“Rio” é a tradução clara e usual de נָהָר neste contexto, e הַשֵּׁנִי indica a ordem: “segundo”.'
- source_word: גִּיחוֹן
  choice: Giom
  rationale: Forma tradicional e reconhecível em português para a transliteração do nome próprio hebraico.
- source_word: הוּא
  choice: é o que
  rationale: Reproduz de modo natural em português a retomada identificadora e enfática do pronome hebraico.
- source_word: הַ/סּוֹבֵב
  choice: passa ao redor de
  rationale: Preserva o sentido participial de סבב, “ir/passar ao redor”, sem impor precisão topográfica maior que a do hebraico.
- source_word: אֵת כָּל אֶרֶץ
  choice: toda a terra de
  rationale: Expressão natural que mantém a abrangência de כָּל e o sentido territorial de אֶרֶץ.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Mantém o antigo topônimo em forma portuguesa, evitando a identificação interpretativa e potencialmente anacrônica com a Etiópia moderna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. O presente “é” acompanha a forma nominal da oração hebraica; os topônimos seguem formas portuguesas reconhecíveis. Os marcadores foram colocados após “Cuxe”, ponto a que ambas as notas dizem respeito.
