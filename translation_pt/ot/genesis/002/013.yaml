  text: E o nome do segundo rio era Giom; ele é o que passa ao redor[a] de toda a terra de Cuxe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “circunda toda a terra de Cuxe”.'
