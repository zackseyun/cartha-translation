  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: pt
  text: E Yahweh Deus fez brotar do solo toda árvore agradável aos olhos[a] e boa para alimento, e a árvore da vida no meio do jardim, e a árvore do conhecimento do bem e do mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desejável à vista”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “o conhecimento do bem e do mal” foi mantida literalmente. Há diferentes interpretações sobre se ela se refere em particular ao discernimento moral, à maturidade ou a um conhecimento abrangente.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: fez brotar
  rationale: O hifil de צמח tem sentido causativo. “Fez brotar” preserva essa causalidade e soa natural em português no contexto do surgimento de árvores do solo.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém o nome divino representado pelo Tetragrama e traduz אֱלֹהִים diretamente como “Deus”.
- source_word: מִן הָאֲדָמָה
  choice: do solo
  rationale: אֲדָמָה designa aqui o chão ou a terra cultivável de onde a vegetação brota; “solo” comunica isso com clareza.
- source_word: כָּל עֵץ
  choice: toda árvore
  rationale: Preserva o valor distributivo da construção hebraica no singular.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: agradável aos olhos
  rationale: Expressa de modo natural a aparência atraente ou desejável das árvores, sem intensificar indevidamente o sentido.
- source_word: וְטוֹב לְמַאֲכָל
  choice: e boa para alimento
  rationale: Reproduz de perto a relação hebraica entre a qualidade da árvore e sua utilidade como alimento.
- source_word: וְעֵץ הַחַיִּים
  choice: a árvore da vida
  rationale: Tradução direta e consagrada da expressão em estado construto.
- source_word: בְּתוֹךְ הַגָּן
  choice: no meio do jardim
  rationale: Comunica naturalmente a localização indicada por בְּתוֹךְ, sem decidir além do texto se se trata de um centro geométrico exato.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: a árvore do conhecimento do bem e do mal
  rationale: Mantém literalmente a expressão teologicamente significativa e não resolve sua ambiguidade interpretativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido de “o conhecimento do bem e do mal”
  choice: Preservar a expressão literal
  alternative: conhecimento moral; conhecimento de tudo; conhecimento do que é benéfico e prejudicial
  rationale: A expressão hebraica admite interpretações distintas. A tradução mantém a tensão e evita impor uma explicação no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla em outras variedades. “Fez brotar” evita uma formulação excessivamente mecânica; “bem como” organiza a enumeração sem apagar a sintaxe cumulativa do hebraico. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
