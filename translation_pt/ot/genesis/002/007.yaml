  terminology: “Yahweh Deus”, “o homem”, “pó do solo” e “criatura viva” são consistentes com o texto-fonte e com as decisões lexicais apresentadas. A nota tradicional deve conservar “alma vivente” como alternativa histórica, mas não como sentido exigido pelo hebraico.
