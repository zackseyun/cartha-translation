  rationale: Remove-se a nota [a] porque ela não oferece uma alternativa portuguesa funcional nem registra uma incerteza relevante. A única nota é ancorada em “criatura viva”, onde há alternativas lexicais reais para נֶפֶשׁ חַיָּה. “Fôlego de vida” torna a formulação mais natural em português e permanece fiel ao hebraico.
