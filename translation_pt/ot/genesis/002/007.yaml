  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: pt
  text: Então Yahweh Deus formou o homem do pó do solo, soprou nas narinas dele o fôlego de vida, e o homem se tornou uma criatura viva[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um ser vivo”; tradicionalmente, “uma alma vivente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino pessoal e traduz אֱלֹהִים pelo título comum “Deus”, mantendo a aposição hebraica.
- source_word: וַיִּיצֶר
  choice: formou
  rationale: Comunica o ato concreto de dar forma, inclusive com a possível imagem do trabalho de um oleiro, sem ampliar o texto.
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste ponto da narrativa, o termo designa o indivíduo humano que está sendo formado; “o homem” é natural e corresponde ao referente contextual.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: do pó do solo
  rationale: Mantém a imagem concreta do pó como matéria de origem e traduz אֲדָמָה como “solo”, distinguindo-o do planeta ou da terra em sentido amplo.
- source_word: בְּאַפָּיו
  choice: em suas narinas
  rationale: Expressão idiomática e corporalmente concreta em português para o local em que Deus sopra.
- source_word: נִשְׁמַת חַיִּים
  choice: o sopro de vida
  rationale: Traduz a locução hebraica de modo claro e direto; o plural חַיִּים tem aqui valor idiomático relacionado à vida.
- source_word: וַיְהִי
  choice: se tornou
  rationale: Com a preposição לְ, o verbo indica entrada em um estado, adequadamente expressa por “se tornou”.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: uma criatura viva
  rationale: Descreve o ser animado inteiro e conserva a amplitude de נֶפֶשׁ, termo também aplicado aos animais, sem sugerir necessariamente uma alma imaterial separável.
theological_decisions:
- issue: Sentido de הָאָדָם neste contexto
  choice: o homem
  alternative: o ser humano; a humanidade
  rationale: A gramática e o desenvolvimento narrativo apontam para o indivíduo humano formado por Deus, embora o termo também possa ter alcance representativo em outros contextos.
- issue: Sentido antropológico de לְנֶפֶשׁ חַיָּה
  choice: uma criatura viva
  alternative: um ser vivo; uma alma vivente
  rationale: A expressão hebraica apresenta o homem como um ser animado completo, sem exigir uma distinção entre corpo e uma alma imaterial. A alternativa tradicional é registrada sem ser imposta ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “solo” evita a ambiguidade mais ampla de “terra”. A repetição “soprou… o sopro” acompanha a imagem concreta do hebraico e permanece natural em português.
