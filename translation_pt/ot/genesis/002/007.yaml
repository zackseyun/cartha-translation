  source_fidelity: 'O texto traduz com precisão os elementos centrais do hebraico: Yahweh Deus, o homem, o pó do solo, a ação de soprar nas narinas, o fôlego de vida e o resultado “uma criatura viva”. “Criatura viva” é uma opção defensável para נֶפֶשׁ חַיָּה e preserva seu emprego mais amplo para seres animados, sem introduzir uma antropologia dualista.'
