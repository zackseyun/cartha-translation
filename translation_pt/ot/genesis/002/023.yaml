base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: pt
  text: 'Então o homem disse: “Esta, finalmente,[a] é osso dos meus ossos e carne da minha carne. Ela será chamada ‘mulher’, porque do homem[b] foi tirada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Desta vez, esta é”. A expressão também pode transmitir o sentido de “Agora, sim”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, as palavras traduzidas por “mulher” (’ishshah) e “homem” (’ish) têm som semelhante, formando um jogo de palavras.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste contexto, o termo designa o ser humano masculino em contraste com אִשָּׁה e אִישׁ; “o homem” preserva essa distinção imediata.
- source_word: זֹאת הַפַּעַם
  choice: Esta, finalmente
  rationale: A expressão aponta para a mulher apresentada e comunica a descoberta ou satisfação esperada; “finalmente” transmite de modo natural a força idiomática de “desta vez/agora”.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: osso dos meus ossos e carne da minha carne
  rationale: A formulação portuguesa tradicional e idiomática conserva o paralelismo enfático e a ideia de origem e correspondência expressa por מִן.
- source_word: לְזֹאת יִקָּרֵא אִשָּׁה
  choice: Ela será chamada ‘mulher’
  rationale: O pronome feminino retoma naturalmente a mulher em português, e a construção passiva preserva a fórmula hebraica de nomeação.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: porque do homem foi tirada
  rationale: A tradução mantém a relação causal e a procedência expressas no hebraico. O sujeito feminino fica claro pelo contexto, sem uma repetição pesada do demonstrativo final.
theological_decisions:
- issue: Sentido contextual de אָדָם
  choice: o homem
  alternative: o ser humano
  rationale: Embora אָדָם possa designar a humanidade, aqui o contexto prepara o contraste lexical entre homem e mulher; a escolha não pretende definir todos os usos do termo.
- issue: Jogo de palavras entre אִשָּׁה e אִישׁ
  choice: mulher ... homem, com nota explicativa
  alternative: esposa ... marido
  rationale: “Mulher/homem” preserva a abrangência lexical do texto e evita restringi-lo à relação conjugal. Como o jogo sonoro hebraico não pode ser reproduzido plenamente em português, ele é indicado em nota.
- issue: Força de זֹאת הַפַּעַם
  choice: Esta, finalmente
  alternative: Desta vez, esta
  rationale: A redação escolhida comunica a satisfação ou reconhecimento expresso pela frase sem transformar essa nuance contextual em uma afirmação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o reconhecimento e a nomeação em duas frases para maior naturalidade, sem alterar a relação lógica do hebraico.
