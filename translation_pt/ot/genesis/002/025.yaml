  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: pt
  text: O homem e sua mulher estavam ambos nus[a] e não sentiam vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os dois... nus”; a construção enfatiza que ambos estavam sem roupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: estavam
  rationale: A forma narrativa de היה liga o versículo ao contexto e, com o predicativo, descreve um estado; “estavam” é natural em português.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Preserva explicitamente a ênfase hebraica no par, retomado em seguida como “o homem e sua mulher”.
- source_word: עֲרוּמִּים
  choice: nus
  rationale: É a equivalência direta e corrente para o estado de não estar vestido. A semelhança sonora hebraica com עָרוּם em 3:1 não pode ser reproduzida naturalmente em português.
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste contexto, refere-se ao indivíduo masculino distinguido de sua mulher, não à humanidade em geral.
- source_word: וְאִשְׁתּוֹ
  choice: e sua mulher
  rationale: O substantivo com sufixo masculino singular expressa aqui a relação conjugal; “sua mulher” é natural e amplamente compreensível.
- source_word: לֹא יִתְבֹּשָׁשׁוּ
  choice: não sentiam vergonha
  rationale: Comunica de modo idiomático a ausência da experiência de vergonha, sem reduzi-la a mero constrangimento.
theological_decisions:
- issue: Sentido contextual de הָאָדָם
  choice: o homem
  alternative: o ser humano
  rationale: A menção paralela de “sua mulher” identifica aqui o referente masculino específico; a tradução não transforma o termo em afirmação geral sobre a humanidade.
- issue: Natureza da ausência de vergonha
  choice: não sentiam vergonha
  alternative: não se envergonhavam
  rationale: A formulação preserva o estado relacional e moral descrito pelo hebraico sem explicar sua causa nem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluência brasileira. A ordem inicial “Os dois” mantém a ênfase do hebraico; a repetição explicativa “o homem e sua mulher” foi preservada.
