base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: pt
  text: Agora, devolva a mulher ao homem, pois ele é profeta e orará por você, e você viverá. Mas, se não a devolver, saiba que certamente morrerá — você e tudo o que lhe pertence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você e todos os que lhe pertencem”. A expressão hebraica é ampla e pode incluir os membros da casa de Abimeleque, bem como tudo o que lhe pertence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição urgente para a ordem divina; em português atual, “Agora” transmite de modo natural tanto a força temporal quanto a inferencial.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: devolva a mulher ao homem
  rationale: O hifil imperativo de שוב exige restituir alguém à sua situação legítima. Esta formulação é natural em português e preserva os referentes explícitos do hebraico.
- source_word: כִּי נָבִיא הוּא
  choice: pois ele é profeta
  rationale: כִּי introduz a razão da ordem; “pois” mantém a relação explicativa e um registro narrativo digno.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: e orará por você
  rationale: O yiqtol é entendido como futuro/consequência, e בַּעַד indica oração em favor de Abimeleque. “Orará por você” é transparente e preserva a força intercessória.
- source_word: וֶחְיֵה
  choice: e você viverá
  rationale: Embora a forma seja imperativa, no encadeamento da frase exprime o resultado esperado da oração; o futuro comunica isso naturalmente em português.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Mas, se não a devolver
  rationale: A construção negativa com particípio descreve a recusa ou omissão da restituição. O pronome “a” retoma explicitamente a mulher, objeto elíptico no hebraico.
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: saiba que certamente morrerá
  rationale: “Saiba” preserva o imperativo solene, e “certamente morrerá” representa a intensificação produzida pelo infinitivo absoluto seguido do verbo finito.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: você e todos os que lhe pertencem
  rationale: A expressão hebraica é abrangente. O contexto favorece a inclusão das pessoas da casa, sem eliminar em nota a possibilidade de referência mais geral a tudo o que pertence a Abimeleque.
theological_decisions:
- issue: Alcance do juízo em “você e tudo/todos que lhe pertencem”
  choice: você e todos os que lhe pertencem
  alternative: você e tudo o que lhe pertence; você e tudo o que possui
  rationale: O contexto imediato descreve consequências que atingem a casa de Abimeleque, favorecendo uma referência pessoal e coletiva. A nota preserva a amplitude genuína da expressão hebraica, que também pode abranger bens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” em coerência com a fala direta e evita construções excessivamente arcaicas; mantém a solenidade da advertência por meio de “saiba” e “certamente morrerá”.
