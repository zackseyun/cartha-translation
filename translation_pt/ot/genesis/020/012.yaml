  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: pt
  text: Além disso,[a] ela é de fato minha irmã, filha de meu pai, mas não filha de minha mãe; e tornou-se minha esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E também, de fato, ela é minha irmã, filha de meu pai, mas não filha de minha mãe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: A conjunção com a partícula aditiva introduz mais um elemento na defesa de Abraão; “Além disso” expressa naturalmente essa função discursiva.
- source_word: אָמְנָה
  choice: de fato
  rationale: O advérbio confirma a veracidade da afirmação; “de fato” é corrente, digno e preserva a ênfase.
- source_word: אֲחֹתִי
  choice: minha irmã
  rationale: Tradução direta do termo de parentesco com sufixo de primeira pessoa do singular.
- source_word: בַת אָבִי
  choice: filha de meu pai
  rationale: A expressão apositiva esclarece em que sentido Sara é irmã de Abraão e mantém o paralelismo com a oração seguinte.
- source_word: הִוא
  choice: ela é
  rationale: A oração nominal hebraica é vertida naturalmente no presente em português.
- source_word: אַךְ לֹא
  choice: mas não
  rationale: Aqui a partícula introduz uma limitação ou qualificação; “mas não” preserva com clareza o contraste sem tornar a frase artificial.
- source_word: בַת אִמִּי
  choice: filha de minha mãe
  rationale: Mantém o paralelismo formal e semântico com “filha de meu pai”.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: e tornou-se minha esposa
  rationale: A construção com היה e ל indica entrada na condição matrimonial; “tornou-se minha esposa” conserva esse sentido eventivo.
