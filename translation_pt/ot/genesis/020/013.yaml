  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: pt
  text: 'Quando Deus me fez vagar para longe da casa de meu pai[a], eu disse a ela: “Esta é a bondade[b] que você deve me demonstrar: em todo lugar a que chegarmos, diga a meu respeito: ‘Ele é meu irmão’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me fez andar errante” ou “me fez desviar”. O verbo hebraico está na forma causativa e pode indicar vagar ou desviar-se; aqui, o contexto ressalta a saída e a vida sem residência fixa, não necessariamente um erro moral.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico ḥésed também pode expressar amor leal, favor ou bondade fiel, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: me fez vagar
  rationale: Preserva a força causativa do hifil de תעה e a ideia de deslocamento sem residência fixa, sem necessariamente sugerir erro moral.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o contexto identifica o referente como o Deus de Abraão; em português, o singular comunica isso com clareza.
- source_word: מִבֵּית אָבִי
  choice: para longe da casa de meu pai
  rationale: Expressa tanto a separação indicada por מִן quanto o sentido familiar e social de 'casa do pai'.
- source_word: חַסְדֵּךְ
  choice: a bondade
  rationale: No pedido interpessoal de Abraão, 'bondade' é natural e mantém o campo semântico de favor, lealdade e amor fiel sem impor uma formulação pactual.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: que você deve demonstrar para comigo
  rationale: Torna idiomática em português a construção literal 'fazer comigo', ligada a 'bondade', e conserva a força do pedido de Abraão.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: em todo lugar a que chegarmos
  rationale: Mantém o sentido distributivo de cada lugar ao qual ambos chegariam, em formulação portuguesa natural.
- source_word: אִמְרִי לִי
  choice: diga a meu respeito
  rationale: No contexto, Sara deve falar acerca de Abraão diante de terceiros; esta formulação comunica o sentido da preposição de modo claro.
- source_word: אָחִי הוּא
  choice: Ele é meu irmão
  rationale: Preserva literalmente a afirmação central para o desenvolvimento narrativo, sem generalizar 'irmão' para 'parente'.
theological_decisions:
- issue: A agência divina no deslocamento de Abraão
  choice: Deus me fez vagar
  alternative: Deus permitiu que eu vagasse; os deuses me fizeram vagar
  rationale: O hebraico apresenta אֱלֹהִים como sujeito do verbo causativo. A tradução mantém essa agência explícita e a tensão do enunciado, sem reduzi-la a mera permissão nem atribuir necessariamente desvio moral a Abraão. A leitura plural 'deuses' é possível pela forma isolada do substantivo, mas é improvável no contexto narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos como 'para com', mas conserva a estrutura solene da fala direta e a ambiguidade legítima do verbo causativo.
