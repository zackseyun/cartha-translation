    issue: A nota a está ancorada em «você», no fim de «todos os que estão com você», mas trata da expressão «uma cobertura para os olhos».
    rationale: A âncora deve seguir imediatamente a expressão hebraica difícil que a nota explica, para não sugerir que a nota se refere ao grupo de pessoas ou à construção seguinte.
  - severity: low
    issue: A segunda ocorrência de הִנֵּה foi reduzida a «Isso é».
    rationale: Embora idiomática, essa redução enfraquece a repetição enfática do hebraico. Repetir «Veja» é natural e melhora a correspondência formal.
  - severity: low
