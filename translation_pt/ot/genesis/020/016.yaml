base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: pt
  text: 'E disse a Sara: “Veja, dei mil peças de prata ao seu irmão. Veja, isto é para você uma cobertura para os olhos[a], para todos os que estão com você; e, perante todos, você fica justificada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cobertura dos olhos”. A expressão hebraica é difícil; provavelmente indica uma reparação pública que cobre a ofensa e restaura a honra de Sara.
    reason: lexical_alternative
  - marker: b
    text: Ou “você fica isenta”, “o assunto fica resolvido diante de todos” ou, segundo outra interpretação, “você é repreendida”. A cláusula hebraica final é difícil e admite mais de uma leitura.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: mil peças de prata
  rationale: A expressão significa literalmente “mil de prata”, sem indicar explicitamente uma unidade monetária. “Peças de prata” comunica um pagamento em prata sem acrescentar “siclos” ou pressupor moedas cunhadas.
- source_word: לְאָחִיךְ
  choice: ao seu irmão
  rationale: Preserva a designação usada no hebraico, a ironia da fala de Abimeleque e a ligação com a maneira pela qual Abraão e Sara haviam apresentado seu relacionamento.
- source_word: כְּסוּת עֵינַיִם
  choice: uma cobertura para os olhos
  rationale: Mantém a metáfora difícil e ambígua do hebraico, em vez de reduzi-la no texto principal a uma única interpretação, como “indenização” ou “reparação”.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: diante de todos os que estão com você
  rationale: Embora לְ possa ser traduzido mais formalmente por “para”, aqui “diante de” expressa de modo natural o caráter público do gesto sem eliminar a relação com todos os presentes.
- source_word: וְאֵת כֹּל
  choice: e, perante todos
  rationale: A construção hebraica é comprimida e difícil. A tradução conserva a ampliação da esfera pública, dos que acompanhavam Sara para todos em geral.
- source_word: וְנֹכָחַת
  choice: você fica justificada
  rationale: O nifal de יכח pode indicar que Sara é demonstrada inocente ou publicamente isentada. “Fica justificada” se ajusta ao contexto de reparação pública, enquanto a nota registra outras leituras possíveis.
theological_decisions:
- issue: Sentido da reparação feita a Sara
  choice: Preservar no texto a metáfora “cobertura para os olhos” e apresentar a justificação pública sem desenvolver uma doutrina além do contexto narrativo.
  alternative: Explicitar no texto que o pagamento expia a ofensa, compra silêncio ou constitui uma repreensão a Sara.
  rationale: O hebraico é lexical e sintaticamente difícil. Uma formulação moderadamente formal evita atribuir ao pagamento um sentido teológico ou moral mais específico do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veja” reproduz a força discursiva de הִנֵּה sem soar arcaico. A repetição do segundo הִנֵּה foi vertida por “Isso é”, evitando uma repetição pouco natural, mas mantendo a ênfase demonstrativa. A pontuação destaca as duas partes da declaração pública.
