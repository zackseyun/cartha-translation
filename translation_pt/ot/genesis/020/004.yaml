source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: pt
  text: 'Abimeleque não havia se aproximado dela[a], por isso disse: “Senhor, matarás até mesmo uma nação[b] justa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aproximar-se dela” é uma expressão hebraica que, neste contexto, significa ter relações sexuais com Sara.
    reason: cultural_note
  - marker: b
    text: Ou “um povo justo”. A palavra hebraica designa coletivamente um povo ou uma nação.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: havia se aproximado dela
  rationale: Preserva a expressão hebraica “aproximar-se dela”, que neste contexto implica não ter mantido relações sexuais com Sara; a nota esclarece o sentido idiomático sem explicitá-lo no corpo do texto.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É a forma natural e digna de reproduzir o título com que Abimeleque se dirige a Deus, sem acrescentar “Deus” nem recorrer à formulação menos natural “meu Senhor”.
- source_word: גּוֹי
  choice: nação
  rationale: Mantém o sentido coletivo de um povo ou corpo político e não restringe a súplica de Abimeleque apenas a ele próprio.
- source_word: גַּם
  choice: até mesmo
  rationale: Expressa a força enfática da partícula na pergunta retórica.
- source_word: צַדִּיק
  choice: justa
  rationale: Preserva o vocabulário bíblico de justiça, ao mesmo tempo que, no contexto, comporta a alegação de inocência quanto ao caso de Sara.
- source_word: תַּהֲרֹג
  choice: matarás
  rationale: O futuro em pergunta direta reproduz com naturalidade a força do imperfeito hebraico e a súplica retórica.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Abimeleque ... por isso disse
  rationale: Apresenta de modo fluente a sequência e a relação contextual entre não ter se aproximado de Sara e a defesa que Abimeleque faz, sem introduzir um advérbio temporal ausente do hebraico.
theological_decisions:
- issue: Alcance coletivo de “nação” na súplica de Abimeleque
  choice: Manter “nação” e seu sentido corporativo.
  alternative: “povo” ou uma restrição interpretativa a “casa” ou ao próprio Abimeleque
  rationale: O hebraico emprega um substantivo coletivo, e o contexto envolve uma ameaça que ultrapassa o rei individualmente. “Nação” conserva essa dimensão sem definir em excesso a escala política.
- issue: Sentido de צַדִּיק
  choice: Traduzir como “justa”.
  alternative: “inocente”
  rationale: “Justa” conserva a amplitude lexical e a tensão da alegação de Abimeleque; no contexto, pode incluir inocência específica sem reduzir o termo exclusivamente a ela.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A formulação preserva o idioma hebraico no texto principal e esclarece sua implicação em nota. Os marcadores foram vinculados aos termos correspondentes: [a] à expressão idiomática e [b] a “nação”.'
