base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: pt
  text: Então Abraão orou a Deus, e Deus curou Abimeleque, sua mulher e suas servas[a], e elas deram à luz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres escravizadas”; o termo hebraico pode designar servas ou escravas.
    reason: lexical_alternative
  - marker: b
    text: Em sentido contextual, “e elas puderam dar à luz”. O hebraico diz literalmente “e elas deram à luz”; o versículo seguinte esclarece que isso ocorreu como resultado da cura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל significa normalmente “orar”. O contexto envolve intercessão, mas o verbo não exige que essa nuance seja explicitada no texto principal.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: Embora o hebraico empregue o artigo, “a Deus” é a forma natural em português quando se refere ao Deus verdadeiro.
- source_word: וַיִּרְפָּא
  choice: curou
  rationale: רפא significa “curar”. A escolha preserva o sentido direto do verbo sem especificar além do texto a natureza da aflição.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Equivalente natural e digno para a esposa de Abimeleque; o referente do possessivo permanece claro na sequência.
- source_word: אַמְהֹתָיו
  choice: suas servas
  rationale: אָמָה pode designar uma serva ou uma mulher escravizada. “Servas” é conciso e natural, e a nota conserva a nuance social mais forte.
- source_word: וַיֵּלֵדוּ
  choice: e elas deram à luz
  rationale: ילד significa “dar à luz”. A conjunção foi mantida sem transformar explicitamente a oração em finalidade ou resultado, embora o contexto mostre que o nascimento decorreu da cura.
theological_decisions:
- issue: Relação entre o verbo final e a cura
  choice: 'Manter a sequência hebraica: “e elas deram à luz”.'
  alternative: “de modo que elas puderam dar à luz”
  rationale: O contexto, especialmente o versículo seguinte, apresenta os partos como resultado da cura; contudo, a conjunção hebraica não explicita por si só uma construção de resultado. A tradução preserva essa abertura sem obscurecer a lógica narrativa.
- issue: Nuance social de אָמָה
  choice: Usar “servas” no texto principal.
  alternative: “mulheres escravizadas”
  rationale: O termo pode indicar condição servil ou escravizada. “Servas” mantém a referência feminina e é adequado ao registro narrativo, enquanto a nota registra a alternativa mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a coordenação simples e o ritmo narrativo do hebraico, evitando explicitar no texto principal uma relação de resultado apenas inferida pelo contexto.
