base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: pt
  text: Pois Yahweh havia fechado completamente[a] todos os ventres na casa de Abimeleque, por causa de Sara, mulher de Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “havia certamente fechado” ou “havia fechado por completo”; o hebraico emprega um infinitivo absoluto junto ao verbo conjugado para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi narrado no versículo anterior e mantém com naturalidade a ligação discursiva.
- source_word: עָצֹר עָצַר
  choice: havia fechado completamente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação; o mais-que-perfeito composto também exprime sua anterioridade em relação à cura mencionada no versículo precedente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: todo ventre da casa de Abimeleque
  rationale: Preserva a imagem corporal concreta de רֶחֶם e entende 'casa' como o grupo doméstico de Abimeleque, não apenas como uma construção.
- source_word: עַל דְּבַר
  choice: por causa de
  rationale: Expressa o valor causal da locução neste contexto.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: mulher de Abraão
  rationale: Reproduz de modo natural a relação identificadora da cadeia construta; aqui 'mulher' tem o sentido claro de esposa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza do impedimento imposto à casa de Abimeleque
  choice: fechado todo ventre
  alternative: tornado todas as mulheres estéreis
  rationale: A formulação concreta do hebraico é mantida sem especificar além do texto a natureza médica ou a duração da incapacidade de conceber ou dar à luz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem da frase permanece próxima do hebraico, mas soa natural em português; 'casa' designa a família ou o grupo doméstico de Abimeleque.
