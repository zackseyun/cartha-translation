  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: pt
  text: 'Então Abimeleque disse a Abraão: “O que você viu, para fazer isso?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que você tinha em mente para fazer isso?” O hebraico diz literalmente: “O que você viu...?”, empregando “ver” para indicar o que alguém percebeu ou teve em vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” preserva naturalmente a sequência em português.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Transliteração tradicional e amplamente reconhecível do nome em português.
- source_word: אֶל־אַבְרָהָם
  choice: a Abraão
  rationale: A preposição introduz o destinatário da fala; esta é uma formulação natural em português.
- source_word: מָה רָאִיתָ
  choice: O que você viu
  rationale: 'Preserva a imagem literal do hebraico e sua ambiguidade idiomática: a pergunta pode tratar do que Abraão percebeu ou teve em mente.'
- source_word: כִּי עָשִׂיתָ
  choice: para fazer
  rationale: Expressa em português natural a ligação entre aquilo que Abraão percebeu ou teve em vista e sua ação, sem transformar a pergunta diretamente em “por quê?”.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: isso
  rationale: No contexto, o demonstrativo retoma de modo claro e natural a conduta de Abraão; evita o peso moral adicional de “essa ação” ou “esse feito”.
theological_decisions: []
