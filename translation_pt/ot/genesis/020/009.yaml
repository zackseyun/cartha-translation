base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: pt
  text: 'Então Abimeleque chamou Abraão e lhe disse: “O que você fez conosco? Em que pequei contra você[a], que você trouxe sobre mim e sobre o meu reino um grande pecado? Você fez comigo coisas que não se devem fazer[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que pecado cometi contra você?”'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “atos que não se fazem”. A expressão indica coisas consideradas impróprias ou inadmissíveis.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: Abimeleque chamou Abraão
  rationale: קרא com לְ e referência a uma pessoa pode significar chamar ou convocar. “Chamou” é natural, mantém o fluxo narrativo e não acrescenta uma formalidade oficial que o contexto não exige.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: O que você fez conosco?
  rationale: Tradução direta e idiomática da pergunta acusatória; “conosco” expressa adequadamente לָּנוּ.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Em que pequei contra você
  rationale: O interrogativo מֶה com חטא é expresso naturalmente como “em que”; “pequei contra você” preserva tanto a dimensão moral quanto a ofensa dirigida a uma pessoa.
- source_word: כִּי הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: para que trouxesse ... sobre mim e sobre o meu reino
  rationale: Neste contexto, כִּי liga a suposta ofensa de Abimeleque à consequência provocada pela conduta de Abraão. “Para que” comunica a força consecutiva da pergunta retórica sem afirmar necessariamente intenção deliberada.
- source_word: חֲטָאָה גְדֹלָה
  choice: tamanho pecado
  rationale: חֲטָאָה designa pecado, culpa ou grave transgressão. “Tamanho pecado” preserva o peso moral e soa natural na acusação enfática.
- source_word: מַמְלַכְתִּי
  choice: meu reino
  rationale: Equivalente claro e corrente para a esfera de domínio real indicada por מַמְלָכָה.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: coisas que não se devem fazer
  rationale: A construção passiva expressa conduta imprópria ou inadmissível; esta formulação portuguesa conserva sua força normativa.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Você fez comigo
  rationale: A expressão עשה עם descreve o modo como alguém tratou outra pessoa. “Fez comigo” é idiomático e introduz naturalmente “coisas que não se devem fazer”.
theological_decisions:
- issue: Sentido de חטא na pergunta de Abimeleque
  choice: pequei contra você
  alternative: fiz contra você / ofendi você
  rationale: “Pequei” conserva a linguagem moral e religiosa do hebraico sem reduzir a acusação a mero dano interpessoal.
- issue: Valor de חֲטָאָה גְדֹלָה
  choice: tamanho pecado
  alternative: grande culpa / grave ofensa
  rationale: 'A escolha mantém a tensão do relato: a ação de Abraão expôs Abimeleque e seu reino a uma transgressão grave, sem especificar além do que o texto declara se o termo enfatiza o ato ou a culpa resultante.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” mantém a fala direta natural; a acusação retém sua solenidade por meio de “pequei”, “tamanho pecado” e “reino”.
