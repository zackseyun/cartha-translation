base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male slaves and female slaves, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: pt
  text: Então Abimeleque tomou ovelhas e gado, escravos e escravas, e os deu a Abraão; e devolveu-lhe Sara, sua mulher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido narrativo direto de לקח, sem acrescentar a ideia de trazer ou buscar.
- source_word: צֹאן
  choice: ovelhas
  rationale: É uma tradução concreta e natural na lista com בָקָר, embora o termo hebraico possa abranger rebanhos de pequenos animais, inclusive cabras.
- source_word: בָקָר
  choice: gado
  rationale: Designa naturalmente o gado bovino como coletivo.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: escravos e escravas
  rationale: Preserva a distinção de gênero e torna visível a condição de pessoas transferidas junto com os animais, sem suavizá-la como simples serviço voluntário.
- source_word: וַיִּתֵּן
  choice: os deu
  rationale: O pronome retoma o conjunto mencionado; o masculino plural funciona em português para o grupo misto de animais e pessoas.
- source_word: וַיָּשֶׁב
  choice: devolveu
  rationale: O hifil de שוב expressa fazer voltar ou restituir; neste contexto, 'devolveu' é claro e idiomático.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Mantém a relação conjugal indicada pelo sufixo, cujo referente é Abraão, em formulação bíblica digna e compreensível.
- source_word: לּוֹ
  choice: lhe
  rationale: O pronome refere-se naturalmente a Abraão e evita repetição desnecessária.
