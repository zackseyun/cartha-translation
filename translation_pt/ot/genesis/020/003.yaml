base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: pt
  text: 'Mas Deus veio a Abimeleque num sonho durante a noite e lhe disse: “Você vai morrer[a] por causa da mulher que tomou, pois ela é casada[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Eis que você está morto” ou “Eis que você é um homem morto”. O hebraico expressa morte certa e iminente.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ela é possuída por um marido”, isto é, ela já tem marido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O qal narrativo de בוא indica que Deus se apresentou a Abimeleque no sonho; “veio” preserva o movimento narrativo sem sugerir entrada física num lugar.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: num sonho durante a noite
  rationale: Expressão natural em português que mantém tanto o meio da revelação quanto seu caráter noturno.
- source_word: הִנְּךָ מֵת
  choice: Você vai morrer
  rationale: A construção apresenta a morte como juízo certo e iminente. O futuro idiomático comunica isso com clareza, sem afirmar que Abimeleque já estivesse literalmente morto.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: por causa da mulher que tomou
  rationale: עַל introduz o motivo da sentença, e לקח não explicita violência; “tomou” preserva a formulação sóbria e o resultado presente do ato.
- source_word: בְּעֻלַת בָּעַל
  choice: ela é casada
  rationale: A expressão hebraica indica uma mulher que já tem marido. “É casada” comunica naturalmente o vínculo matrimonial existente, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Valor temporal e judicial de הִנְּךָ מֵת
  choice: Você vai morrer
  alternative: Eis que você está morto / você é um homem morto
  rationale: O hebraico deixa em tensão a forma presente e o sentido de morte certa e iminente. A tradução principal exprime o aviso em português corrente, e a nota registra a formulação mais literal.
- issue: Sentido de בְּעֻלַת בָּעַל
  choice: ela é casada
  alternative: ela tem marido / ela pertence a um marido
  rationale: O contexto exige reconhecer o vínculo matrimonial já existente. Evita-se traduzir a expressão por linguagem de propriedade como se ela definisse exaustivamente a relação conjugal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Você” torna direta a fala divina sem arcaísmo; “durante a noite” é mais natural do que reproduzir literalmente “no sonho da noite”. Os marcadores [a] e [b] aparecem junto às expressões que explicam.
