base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: pt
  text: Abimeleque levantou-se cedo pela manhã, chamou todos os seus servos[a] e relatou-lhes todas estas coisas. E os homens ficaram com muito medo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “convocou todos os seus servos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E os homens temeram muito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: levantou-se de madrugada
  rationale: A combinação do verbo no hifil, com o sentido de levantar-se cedo, e “pela manhã” é expressa naturalmente em português por “levantou-se de madrugada”, preservando a ideia de prontidão e urgência.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: chamou todos os seus servos
  rationale: “Chamou” traduz de modo direto קרא, e “servos” é adequado ao contexto de integrantes da casa ou corte real sem enfatizar uma condição jurídica de escravidão.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: lhes contou tudo o que havia acontecido
  rationale: A expressão hebraica diz literalmente que ele falou “todas estas coisas aos ouvidos deles”. No contexto, refere-se ao conteúdo revelado no sonho; esta formulação comunica de maneira natural que ele relatou tudo aos servos.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: aqueles homens ficaram com muito medo
  rationale: “Homens” preserva o masculino explícito de אֲנָשִׁים, enquanto “ficaram com muito medo” transmite de modo corrente o temor intenso indicado por ירא e מְאֹד.
