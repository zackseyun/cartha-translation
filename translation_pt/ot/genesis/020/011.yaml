base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: pt
  text: 'Abraão respondeu: “Foi porque eu disse: ‘Certamente não há temor de Deus neste lugar[a], e eles me matarão por causa da minha mulher.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não há reverência a Deus neste lugar”.
    reason: Alternativa lexical para “temor de Deus”, esclarecendo o alcance reverencial da expressão hebraica.
lexical_decisions:
- source_word: וַיֹּאמֶר אַבְרָהָם
  choice: Abraão respondeu
  rationale: Embora a forma verbal seja literalmente “disse”, no diálogo ela introduz a resposta de Abraão e soa naturalmente como “respondeu” em português.
- source_word: כִּי אָמַרְתִּי
  choice: Foi porque pensei
  rationale: כִּי apresenta a explicação causal, enquanto “pensei” comunica naturalmente que אָמַרְתִּי descreve o raciocínio interior de Abraão no contexto.
- source_word: רַק
  choice: Certamente
  rationale: Aqui a partícula reforça a conclusão ou suposição de Abraão; “certamente” preserva essa força enfática sem a rigidez de “somente”.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: não há temor de Deus
  rationale: Mantém a expressão bíblica e seu sentido religioso e moral, sem reduzi-la apenas a respeito ou devoção.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Tradução direta e natural da expressão locativa, sem ampliar indevidamente para “região”.
- source_word: וַהֲרָגוּנִי
  choice: e eles me matarão
  rationale: Expressa a consequência que Abraão esperava; o futuro dentro da fala direta preserva adequadamente essa perspectiva.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: por causa da minha mulher
  rationale: Reproduz de modo claro e atual o valor causal da expressão hebraica.
theological_decisions:
- issue: Sentido de יִרְאַת אֱלֹהִים
  choice: temor de Deus
  alternative: reverência a Deus
  rationale: “Temor de Deus” preserva o idioma hebraico e sua abrangência de reverência, consciência moral e responsabilidade diante de Deus, sem suavizar a formulação do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Minha mulher” foi preferido a “minha esposa” por corresponder diretamente ao hebraico e permanecer natural no registro narrativo bíblico.
