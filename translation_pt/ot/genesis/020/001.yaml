  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: pt
  text: Dali, Abraão partiu em direção ao Neguebe e se estabeleceu entre Cades e Sur[a]; e residiu como estrangeiro em Gerar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o sul”. O hebraico pode indicar tanto a região meridional chamada Neguebe como, de modo geral, o movimento em direção ao sul; o texto principal conserva a provável referência geográfica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partiu
  rationale: O qal wayyiqtol de נסע indica partir ou pôr-se em viagem; “partiu” é natural em português e mantém o avanço da narrativa.
- source_word: מִשָּׁם
  choice: Dali
  rationale: Expressa de modo idiomático a referência ao lugar anterior.
- source_word: אַרְצָה הַנֶּגֶב
  choice: em direção ao Neguebe
  rationale: O ה direcional em אַרְצָה marca movimento em direção a uma região; “Neguebe” preserva a provável referência geográfica, sem eliminar a possibilidade do sentido mais geral “sul”.
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: ישב pode significar habitar ou estabelecer-se; aqui descreve a residência de Abraão na região entre os lugares mencionados.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: entre Cades e Sur
  rationale: Reproduz diretamente a localização geográfica, usando as formas portuguesas correntes dos topônimos.
- source_word: וַיָּגָר
  choice: residiu como estrangeiro
  rationale: גור descreve a permanência de alguém sem condição de natural ou proprietário local; a expressão comunica essa nuance com clareza, sem recorrer ao pouco usual “peregrinou”.
- source_word: בִּגְרָר
  choice: em Gerar
  rationale: Tradução locativa direta e natural do nome do lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário geográfico bíblico amplamente reconhecível. “Residir como estrangeiro” preserva a distinção entre ישב e גור.
