base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: pt
  text: 'Abraão disse a respeito de Sara, sua mulher[a]: “Ela é minha irmã”. Então Abimeleque, rei de Gerar, mandou buscar Sara e a tomou[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disse a Sara, sua mulher”. A preposição hebraica pode ser entendida assim de modo mais literal, mas o contexto favorece a ideia de que Abraão falou a respeito de Sara, pois a declaração citada é: “Ela é minha irmã”.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, Abimeleque mandou que trouxessem Sara até ele. O hebraico diz simplesmente: “mandou e tomou Sara”.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” é a equivalência portuguesa natural e direta.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: a respeito de Sara, sua mulher
  rationale: Embora אֶל normalmente signifique “a/para”, neste contexto a declaração “Ela é minha irmã” favorece entender Sara como a pessoa sobre quem Abraão falou. A nota preserva a leitura mais literal possível.
- source_word: אֲחֹתִי הִוא
  choice: Ela é minha irmã
  rationale: Tradução direta e idiomática da oração nominal hebraica, mantendo o pronome enfático expresso no fim da frase.
- source_word: וַיִּשְׁלַח
  choice: mandou buscar
  rationale: O hebraico diz literalmente “enviou/mandou” sem explicitar os agentes; em português, “mandou buscar” comunica naturalmente a ação implícita pelo contexto.
- source_word: מֶלֶךְ גְּרָר
  choice: rei de Gerar
  rationale: Reproduz de modo natural a cadeia construta que identifica a função e o domínio de Abimeleque.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: e a tomou
  rationale: Mantém o verbo simples לקח, sem acrescentar “como mulher” nem especificar uma incorporação ao harém, detalhes não declarados neste versículo.
theological_decisions:
- issue: Possível ampliação interpretativa da ação de Abimeleque
  choice: e a tomou
  alternative: tomou-a como mulher
  rationale: O contexto narrativo sugere a intenção de Abimeleque, mas o texto deste versículo apenas afirma que ele tomou Sara. A tradução não explicita uma finalidade que o hebraico deixa sem declarar.
- issue: Pessoa a quem ou sobre quem Abraão falou
  choice: a respeito de Sara
  alternative: a Sara
  rationale: A preposição admite a leitura mais literal “a Sara”, mas o conteúdo em terceira pessoa — “Ela é minha irmã” — favorece a ideia de que Abraão falou sobre ela. A ambiguidade lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sua mulher” preserva o sentido conjugal de אִשְׁתּוֹ em registro bíblico corrente; “esposa” também seria possível, mas é um pouco menos próximo da repetição lexical tradicional. A formulação mantém os dois verbos da sequência hebraica e evita explicitar que Abimeleque tomou Sara como mulher.
