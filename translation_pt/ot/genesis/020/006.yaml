  source_fidelity: 'O texto reproduz com fidelidade os elementos centrais do hebraico: a fala de Deus no sonho, a integridade interior de Abimeleque, a ação divina de impedi-lo de pecar contra Deus e a consequente não permissão para tocar em Sara. A nota sobre «no sonho» preserva adequadamente a alternativa indefinida, e a nota sobre «tocasse nela» mantém o eufemismo do texto-fonte.'
