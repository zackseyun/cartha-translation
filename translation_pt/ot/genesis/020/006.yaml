  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: pt
  text: 'Então Deus lhe disse no sonho[a]: “Sim, eu sei que você fez isso na integridade do seu coração. Eu também impedi que você pecasse contra mim; por isso, não permiti que você tocasse nela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num sonho”. O hebraico admite uma leitura indefinida, embora o artigo favoreça “no sonho” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: “Tocar nela” é aqui uma expressão comedida que se refere a contato sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: no sonho
  rationale: O artigo prefixado favorece a referência definida ao sonho específico já em curso na narrativa; a nota preserva a possibilidade de leitura indefinida.
- source_word: גַּם אָנֹכִי
  choice: Sim, eu / Eu também
  rationale: A primeira ocorrência recebe valor enfático e confirmatório; a segunda preserva a repetição e o sentido aditivo de modo natural em português.
- source_word: בְתָם לְבָבְךָ
  choice: com integridade de coração
  rationale: תֹּם exprime inteireza, retidão ou integridade. A formulação conserva a dimensão moral sem ampliar a afirmação para uma inocência absoluta.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: Eu também o impedi
  rationale: חָשַׂךְ, com a construção seguinte, indica deter ou impedir alguém de realizar uma ação.
- source_word: מֵחֲטוֹ לִי
  choice: de pecar contra mim
  rationale: A preposição מִן marca a ação evitada, e לִי apresenta Deus como aquele contra quem o pecado seria cometido.
- source_word: לֹא נְתַתִּיךָ
  choice: não permiti que você
  rationale: נָתַן com infinitivo funciona idiomaticamente no sentido de permitir ou deixar; “não permiti” é claro, atual e digno.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: tocasse nela
  rationale: A tradução mantém a expressão comedida do hebraico, que no contexto se refere a contato sexual, explicitado em nota sem tornar o texto principal mais gráfico que a fonte.
theological_decisions:
- issue: O sentido de “pecar contra mim” na fala divina
  choice: O ato é apresentado em última instância como pecado contra Deus.
  alternative: Entender a expressão apenas como causar ofensa a Deus ou incorrer em culpa diante dele.
  rationale: O hebraico לִי identifica explicitamente Deus como aquele contra quem o pecado seria cometido, sem negar o dano que também seria causado a Sara e Abraão.
- issue: A relação entre a integridade de Abimeleque e a intervenção divina
  choice: Preservar lado a lado o reconhecimento da integridade de coração e a afirmação de que Deus o impediu de pecar.
  alternative: Explicar a integridade como causa meritória da proteção divina ou reduzir a intervenção divina a mero aviso.
  rationale: O versículo mantém ambas as afirmações sem desenvolver como se relacionam; a tradução não deve resolver essa tensão além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se “você” por naturalidade contemporânea, mantendo concordância pronominal padrão (“lhe”, “o”). A construção “integridade de coração” conserva a concisão e o tom moral do hebraico.
