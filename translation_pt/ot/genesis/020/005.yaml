  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: pt
  text: 'Não foi ele mesmo que me disse: “Ela é minha irmã”? E ela também disse: “Ele é meu irmão.” Fiz isso com integridade de coração e com as mãos limpas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na sinceridade do meu coração e na inocência das minhas mãos, fiz isso”. O hebraico emprega expressões morais e jurídicas para indicar sinceridade e inocência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: Não foi ele mesmo que me disse
  rationale: A pergunta retórica espera resposta afirmativa; “ele mesmo” preserva a ênfase do pronome independente, e “me disse” é natural em português.
- source_word: אֲחֹתִי הִוא
  choice: Ela é minha irmã
  rationale: Reproduz diretamente a declaração de parentesco, sem acrescentar ênfase ausente no hebraico.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: E ela também disse
  rationale: “Também” comunica a força aditiva de גַם; o pronome expresso mantém o foco em Sara sem produzir uma construção pesada em português.
- source_word: אָחִי הוּא
  choice: Ele é meu irmão
  rationale: Equivalente direto e natural da declaração hebraica.
- source_word: בְּתָם לְבָבִי
  choice: com integridade de coração
  rationale: תָם denota inteireza, integridade ou irrepreensibilidade; aqui expressa a sinceridade moral alegada por Abimeleque.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: e inocência nas mãos
  rationale: Preserva a imagem hebraica das mãos como representação dos atos, enquanto “inocência” comunica a dimensão moral e jurídica de נִקְיֹן.
- source_word: עָשִׂיתִי זֹאת
  choice: fiz isso
  rationale: O pretérito perfeito traduz naturalmente a ação concluída descrita pelo perfeito hebraico.
theological_decisions:
- issue: O alcance da alegação moral de Abimeleque
  choice: Apresentar a fala como uma reivindicação de integridade e inocência quanto a este ato
  alternative: Empregar “coração irrepreensível” e “mãos limpas”, o que poderia soar como uma alegação mais ampla de impecabilidade
  rationale: No contexto, Abimeleque defende sua falta de intenção culpável neste episódio; o texto não exige uma afirmação de ausência total de pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a pergunta retórica, a ênfase no testemunho de Abraão e a metáfora hebraica das mãos.
