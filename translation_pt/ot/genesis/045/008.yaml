source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: pt
  text: Agora, portanto, não foram vocês que me enviaram para cá, mas Deus; ele me constituiu como pai para o faraó[a], senhor de toda a sua casa e governante de toda a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pai para o faraó”, isto é, seu principal protetor, conselheiro ou benfeitor.
    reason: A expressão hebraica preserva a metáfora de “pai”, mas descreve uma função de confiança e benefício, não parentesco literal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a transição discursiva quanto a conclusão que José tira de sua fala anterior, em português natural.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: não foram vocês que me enviaram para cá
  rationale: A construção clivada preserva a ênfase do pronome explícito אַתֶּם; “para cá” representa o valor dêitico de הֵנָּה.
- source_word: כִּי הָאֱלֹהִים
  choice: mas Deus
  rationale: 'Depois da negação, כִּי introduz aqui o contraste enfático: não vocês, mas Deus.'
- source_word: וַיְשִׂימֵנִי
  choice: ele me constituiu
  rationale: “Constituiu” comunica que Deus colocou José nessa posição e que a condição resultante permanece, sem restringir o verbo ao sentido mais técnico de uma nomeação oficial.
- source_word: לְאָב לְפַרְעֹה
  choice: pai do faraó
  rationale: Mantém a metáfora hebraica de pai, que pode abranger proteção, conselho e beneficência, em vez de reduzi-la a apenas uma dessas funções.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: senhor de toda a sua casa
  rationale: Preserva a ideia de autoridade de אָדוֹן e a amplitude de בַּיִת, que pode incluir a casa, a família e a administração doméstica do faraó.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: e governante de toda a terra do Egito
  rationale: “Governante” representa o particípio מֹשֵׁל sem impor um cargo administrativo mais específico; “terra do Egito” mantém explícito אֶרֶץ.
theological_decisions:
- issue: Soberania divina e ação humana na declaração de José
  choice: Manter o contraste forte “não foram vocês... mas Deus”
  alternative: Suavizar o contraste ou explicá-lo por meio de uma formulação teológica sobre providência e responsabilidade humana
  rationale: O hebraico ressalta o propósito soberano de Deus sem negar que os irmãos realmente enviaram José ao Egito. A tradução conserva essa tensão, sem impor ao versículo um sistema teológico explicativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe enfatiza “vocês” como no hebraico, mantém a metáfora de “pai” e reproduz a sequência dos três papéis de José.
