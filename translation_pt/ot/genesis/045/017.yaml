base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: pt
  text: 'Então o faraó disse a José: “Diga a seus irmãos: ‘Façam o seguinte: carreguem os seus animais e partam; voltem[a] para a terra de Canaã.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “vão; venham”. Os dois imperativos descrevem a partida e a chegada à terra de Canaã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Diga a seus irmãos
  rationale: A construção introduz a ordem que José deve transmitir; “Diga” é direta, natural e mantém o discurso citado.
- source_word: זֹאת עֲשׂוּ
  choice: Façam o seguinte
  rationale: Equivalente corrente e claro do demonstrativo seguido do imperativo plural, sem a rigidez de “façam isto” neste contexto introdutório.
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: carreguem os seus animais
  rationale: O verbo indica pôr carga em animais, e בְּעִיר designa aqui animais domésticos usados no transporte. A formulação evita o arcaísmo de “bestas” e não restringe indevidamente a espécie.
- source_word: וּלְכוּ בֹאוּ
  choice: e partam; voltem
  rationale: Mantém os dois imperativos hebraicos — partida e chegada — em português compreensível. “Voltem” explicita que o destino é a terra de onde os irmãos haviam vindo, sem reduzir a sequência a um único verbo.
- source_word: אַרְצָה כְּנָעַן
  choice: para a terra de Canaã
  rationale: Preserva tanto o sentido direcional quanto o substantivo explícito “terra” e o nome próprio Canaã.
