  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: pt
  text: E Deus me enviou adiante de vocês para preservar para vocês um remanescente na terra[a] e para mantê-los vivos por meio de uma grande libertação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para preservar para vocês sobreviventes na terra». O hebraico שְׁאֵרִית pode indicar «remanescente», «sobreviventes» ou «posteridade».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para uma grande fuga» ou «como um grande grupo de sobreviventes». A expressão hebraica לִפְלֵיטָה גְּדֹלָה pode enfatizar tanto a libertação quanto as pessoas que sobrevivem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: me enviou
  rationale: O wayyiqtol de שׁלח dá continuidade à narrativa passada; «me enviou» é natural e fiel em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o substantivo designa o único Deus na interpretação que José faz dos acontecimentos.
- source_word: לִפְנֵיכֶם
  choice: adiante de vocês
  rationale: A expressão indica que José foi enviado antes deles; «adiante de vocês» comunica tanto a precedência quanto a ideia espacial sem rigidez literal.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: para preservar para vocês um remanescente
  rationale: Embora שׂוּם signifique literalmente «pôr/estabelecer», junto de שְׁאֵרִית expressa aqui o estabelecimento ou a preservação de quem permanece vivo.
- source_word: שְׁאֵרִית
  choice: remanescente
  rationale: Preserva o sentido de algo ou alguém que resta e sua ressonância recorrente na Bíblia Hebraica; «sobreviventes» e «posteridade» continuam sendo possibilidades contextuais.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ admite «terra» ou «país»; o contexto aponta para a terra onde a família sobreviveria, e «na terra» preserva a amplitude do hebraico.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: e mantê-los vivos
  rationale: O hifil de חיה significa conservar ou manter alguém vivo, sentido claro no contexto da fome.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: para uma grande libertação
  rationale: A construção pode indicar propósito ou resultado, e פְּלֵיטָה pode designar libertação, escape ou sobreviventes. A opção principal mantém a leitura eventiva sem ocultar as alternativas.
theological_decisions:
- issue: Se שְׁאֵרִית deve ser traduzido pelo termo biblicamente ressonante «remanescente» ou pelo contextual «sobreviventes/posteridade»
  choice: remanescente
  alternative: sobreviventes; posteridade
  rationale: «Remanescente» corresponde ao campo lexical hebraico e preserva um motivo bíblico sem acrescentar uma interpretação doutrinária; a nota registra os sentidos contextuais possíveis.
- issue: Se לִפְלֵיטָה גְּדֹלָה descreve o ato ou resultado da libertação, ou as pessoas que sobrevivem
  choice: para uma grande libertação
  alternative: para um grande escape; para muitos sobreviventes
  rationale: A preposição ל pode marcar propósito ou resultado, e o substantivo pode ser eventivo ou coletivo. A tradução principal retém a leitura de propósito/resultado, enquanto a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural e mantém paralelismo natural entre os dois propósitos do envio de José. As notas aparecem junto às expressões a que se referem e preservam a ambiguidade lexical do hebraico.
