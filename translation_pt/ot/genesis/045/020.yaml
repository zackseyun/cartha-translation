lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: E não se preocupem
  rationale: A expressão hebraica diz literalmente que o olho não deve poupar ou olhar com pesar. Em português atual, “não se preocupem” comunica naturalmente a ideia contextual de não lamentar nem hesitar por causa dos bens deixados para trás.
- source_word: עַל כְּלֵיכֶם
  choice: com os seus bens
  rationale: כְּלִי pode designar utensílios, objetos, equipamentos ou bens. No contexto da mudança da família, “bens” é amplo, claro e conciso.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior, com tom explicativo adequado ao discurso.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: o melhor de toda a terra do Egito
  rationale: טוּב indica aqui aquilo que a terra oferece de melhor, e não uma qualidade abstrata. A formulação conserva a abrangência de כָּל e a expressão hebraica “terra do Egito”.
- source_word: לָכֶם הוּא
  choice: será de vocês
  rationale: O contexto é uma promessa referente à chegada deles ao Egito; o futuro soa natural em português, enquanto “de vocês” expressa a relação indicada pelo lamed pronominal.
