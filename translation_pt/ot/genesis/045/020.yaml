  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: pt
  text: E não se preocupem com os seus bens,[a] pois o melhor de toda a terra do Egito é de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “que os olhos de vocês não poupem os seus bens”; isto é, não sintam pesar por deixá-los para trás.'
