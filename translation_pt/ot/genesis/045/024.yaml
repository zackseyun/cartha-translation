  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: pt
  text: 'Então José despediu seus irmãos, e eles partiram. Ele lhes disse: “Não briguem[a] pelo caminho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não fiquem agitados”, “Não fiquem irados” ou “Não tenham medo pelo caminho”. O verbo hebraico pode indicar diferentes tipos de perturbação emocional; “briguem” se ajusta ao contexto imediato dos irmãos viajando juntos depois que José revelou sua identidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: despediu
  rationale: O piel de שׁלח indica que José os fez partir de sua presença. “Despediu” expressa naturalmente tanto a liberação quanto o envio, sem sugerir demissão de emprego neste contexto narrativo.
- source_word: אֶת־אֶחָיו
  choice: seus irmãos
  rationale: Mantém o termo familiar literal e adequado ao contexto dos irmãos de José.
- source_word: וַיֵּלֵכוּ
  choice: eles partiram
  rationale: הלך significa amplamente “ir/andar”; após “despediu”, “partiram” preserva com naturalidade a sequência narrativa.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ele lhes disse
  rationale: Forma portuguesa clara e corrente para a fórmula hebraica de fala, com o referente José explicitado na oração anterior.
- source_word: אַל
  choice: Não
  rationale: Reproduz a partícula negativa usada com valor proibitivo.
- source_word: תִּרְגְּזוּ
  choice: briguem
  rationale: רגז pode indicar agitação, tremor, ira ou medo. No contexto de irmãos viajando juntos após a revelação de José, “briguem” comunica de modo natural a provável advertência contra discussões e acusações mútuas, enquanto a amplitude lexical é preservada na nota.
- source_word: בַּדָּרֶךְ
  choice: pelo caminho
  rationale: Expressão portuguesa idiomática para o percurso da viagem de volta, próxima ao sentido concreto de דרך.
