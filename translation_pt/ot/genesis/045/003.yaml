base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: pt
  text: 'Então José disse a seus irmãos: “Eu sou José. Meu pai ainda está vivo?” Mas seus irmãos não conseguiram responder-lhe, pois ficaram apavorados diante dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram alarmados em sua presença” ou “ficaram consternados ao vê-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: אֶל אֶחָיו
  choice: a seus irmãos
  rationale: Expressa naturalmente os irmãos de José como destinatários de suas palavras.
- source_word: אֲנִי יוֹסֵף
  choice: Eu sou José
  rationale: Mantém a identificação enfática e explícita do hebraico.
- source_word: הַעוֹד אָבִי חָי
  choice: Meu pai ainda está vivo?
  rationale: “Ainda” comunica a continuidade do estado de vida perguntada pela construção interrogativa.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Mas ... não conseguiram responder-lhe
  rationale: “Mas” explicita o contraste contextual, e “não conseguiram” preserva a ideia de incapacidade de יכל.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e digna a causa de não conseguirem responder.
- source_word: נִבְהֲלוּ
  choice: ficaram apavorados
  rationale: O nifal de בהל denota perturbação súbita, alarme ou terror; “apavorados” conserva a intensidade da cena sem acrescentar uma causa moral.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: Reproduz com naturalidade a expressão hebraica ligada à face ou presença de alguém, preservando sua concisão e alguma ambiguidade.
