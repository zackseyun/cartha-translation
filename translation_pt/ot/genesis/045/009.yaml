revisions:
- from: 'Depressa, subam até meu pai e digam-lhe: ‘Assim diz seu filho José: Deus me fez senhor de todo o Egito. Desça até mim; não se demore.[a]’'
  to: 'Apressem-se e subam até meu pai, e digam-lhe: ‘Assim diz seu filho José: Deus me fez senhor sobre todo o Egito. Desça até mim; não se demore.[a]’'
  rationale: A revisão mantém integralmente o sentido e o registro do rascunho, mas representa mais diretamente os dois imperativos iniciais, torna explícita a relação de autoridade de José sobre o Egito e ajusta a nota para evitar um acréscimo espacial não presente no hebraico.
