  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: pt
  text: 'Apressem-se e subam até meu pai, e digam-lhe: ‘Assim diz seu filho José: Deus me fez senhor sobre todo o Egito. Desça até mim; não se demore.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se detenha”; mais literalmente, “não fique parado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Depressa
  rationale: O imperativo plural expressa urgência. “Depressa” é natural em português atual e, em conjunto com “subam”, mantém a força da ordem.
- source_word: וַעֲלוּ
  choice: subam
  rationale: Preserva o sentido espacial de עלה, pois a viagem do Egito para Canaã é descrita como subida.
- source_word: אֶל אָבִי
  choice: até meu pai
  rationale: Reproduz de modo natural a direção indicada pela preposição hebraica, sem acrescentar informação.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: e digam-lhe
  rationale: A sequência hebraica dá continuidade às instruções; o imperativo português comunica isso com clareza.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula formal de mensageiro, de maneira digna e compreensível.
- source_word: בִּנְךָ יוֹסֵף
  choice: seu filho José
  rationale: Conserva a ordem e a ênfase relacional do hebraico em português natural.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Deus me fez
  rationale: Neste contexto, שׂים indica colocar ou constituir alguém numa posição; “me fez” é idiomático e não especifica além do texto.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: senhor de todo o Egito
  rationale: “Senhor” preserva o termo de autoridade sem impor um cargo político específico; “de todo o Egito” expressa naturalmente o âmbito dessa autoridade.
- source_word: רְדָה אֵלַי
  choice: Desça até mim
  rationale: Mantém a descida geográfica para o Egito e usa “até mim” porque José é o destino do movimento.
- source_word: אַל תַּעֲמֹד
  choice: não se demore
  rationale: Embora עמד signifique literalmente “ficar de pé” ou “parar”, nesta proibição o sentido contextual é não permanecer onde está nem tardar.
theological_decisions:
- issue: Sentido de אֱלֹהִים na declaração de José
  choice: Deus
  alternative: um deus
  rationale: A construção tem sentido singular, e o contexto apresenta José atribuindo sua posição a Deus. A inicial maiúscula identifica naturalmente esse referente sem acrescentar uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos no plural (“subam”, “digam”) dirigem-se aos irmãos; o singular respeitoso (“Desça”) dirige-se ao pai. A linguagem espacial de subida a Canaã e descida ao Egito foi preservada.
