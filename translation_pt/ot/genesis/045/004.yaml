base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: pt
  text: 'Então José disse aos seus irmãos: “Aproximem-se de mim, por favor.” Eles se aproximaram. Então ele disse: “Eu sou José, o irmão de vocês, a quem vocês venderam para o Egito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Por favor, cheguem mais perto de mim
  rationale: נגשׁ indica aproximar-se, e נָא confere tom cortês ao pedido. “Mais perto” é natural neste convite dirigido a pessoas que já estavam presentes.
- source_word: וַיִּגָּשׁוּ
  choice: Eles se aproximaram
  rationale: Expressa diretamente a resposta ao convite, preservando o sentido do mesmo verbo hebraico sem repetição pouco natural em português.
- source_word: אֲנִי יוֹסֵף אֲחִיכֶם
  choice: Eu sou José, o irmão de vocês
  rationale: A oração nominal hebraica requer “sou” em português; “o irmão de vocês” é claro, natural e amplamente compreensível.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: aquele que vocês venderam
  rationale: Preserva a acusação pessoal e direta da oração relativa hebraica.
- source_word: מִצְרָיְמָה
  choice: para o Egito
  rationale: O he direcional marca movimento ou destino rumo ao Egito; “para o Egito” é a formulação portuguesa mais natural neste contexto.
