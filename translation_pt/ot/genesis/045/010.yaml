  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: pt
  text: Você habitará na terra de Gósen e ficará perto de mim — você, seus filhos e seus netos, seus rebanhos, seu gado e tudo o que você tem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Você habitará
  rationale: ישׁב pode significar sentar-se, morar, habitar ou estabelecer-se. “Habitará” expressa residência estável e mantém um registro digno e claro.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: אֶרֶץ designa terra ou região; a formulação preserva a construção geográfica hebraica. “Gósen” segue a forma portuguesa consagrada do topônimo.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: e ficará perto de mim
  rationale: A construção היה com קָרוֹב indica estar ou vir a ficar próximo. “Ficará perto de mim” é natural em português e preserva a proximidade pessoal prometida por José.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente é enfático. Sua repetição após o travessão introduz a enumeração e conserva essa ênfase sem tornar a frase artificial.
- source_word: וּבָנֶיךָ
  choice: seus filhos
  rationale: בָּנִים está no masculino plural e, neste contexto genealógico, refere-se aos filhos de Jacó.
- source_word: וּבְנֵי בָנֶיךָ
  choice: seus netos
  rationale: A expressão significa literalmente “os filhos de seus filhos”. “Seus netos” comunica naturalmente a relação entre gerações; no contexto patriarcal, refere-se aos descendentes masculinos mencionados pelo hebraico.
- source_word: וְצֹאנְךָ
  choice: seus rebanhos
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanhos” é a equivalência concisa e habitual.
- source_word: וּבְקָרְךָ
  choice: seu gado
  rationale: בָּקָר designa bovinos ou animais de grande porte. “Gado” distingue essa categoria dos rebanhos de ovelhas e cabras e soa natural em português.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: e tudo o que você tem
  rationale: A expressão abrange de modo geral todos os bens pertencentes a Jacó. A formulação é direta, abrangente e idiomática.
