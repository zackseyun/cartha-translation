base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: pt
  text: 'E você recebeu esta ordem: “Façam o seguinte: tomem para vocês carroças da terra do Egito[a] para suas crianças pequenas[b] e suas esposas; tragam seu pai e venham[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carros”, isto é, veículos de transporte.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico se refere especificamente às crianças pequenas.
    reason: lexical_clarification
  - marker: c
    text: Isto é, venham para o Egito. Também se pode traduzir “voltem”, embora o hebraico diga simplesmente “venham”.
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: a você foi ordenado
  rationale: 'Preserva a forma passiva e o destinatário singular: José recebeu a ordem, enquanto os imperativos seguintes se dirigem no plural aos irmãos.'
- source_word: זֹאת עֲשׂוּ
  choice: Façam o seguinte
  rationale: Expressa de modo natural e direto a fórmula hebraica de instrução, mantendo o imperativo plural.
- source_word: קְחוּ לָכֶם
  choice: peguem
  rationale: O pronome dativo indica que as carroças são para uso deles; em português, esse benefício já fica claro pela construção subsequente, evitando o pouco natural “peguem para vocês”.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: O movimento é a obtenção das carroças dentro do Egito para depois viajar; “na terra do Egito” preserva אֶרֶץ e soa natural em português.
- source_word: עֲגָלוֹת
  choice: carroças
  rationale: Designa veículos de transporte da época; “carroças” evita que “carros” seja entendido pelo leitor moderno como automóveis.
- source_word: לְטַפְּכֶם
  choice: para seus filhos pequenos
  rationale: טַף se refere especificamente às crianças pequenas do grupo familiar, não apenas aos descendentes em geral.
- source_word: וְלִנְשֵׁיכֶם
  choice: e suas mulheres
  rationale: Neste contexto familiar, נָשִׁים designa as esposas dos irmãos; “suas mulheres” é corrente e preserva a relação sem acrescentar informação.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: tragam seu pai
  rationale: Embora נשׂא possa significar levantar ou carregar, aqui descreve transportar o pai até o Egito; “tragam” comunica naturalmente essa ação e direção.
- source_word: וּבָאתֶם
  choice: e venham
  rationale: Mantém o sentido simples de בוא sem inserir explicitamente “voltem”, ideia sugerida pelo contexto, mas não expressa pelo verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A alternância entre o singular (“a você”) e o plural (“façam”, “peguem”, “tragam”, “venham”) foi mantida por refletir a mudança presente no hebraico entre José como receptor da ordem e os irmãos como executores.
