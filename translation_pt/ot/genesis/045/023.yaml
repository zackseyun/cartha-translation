  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: pt
  text: 'E a seu pai enviou o seguinte: dez jumentos carregados com algumas das melhores coisas do Egito[a], e dez jumentas carregadas de cereal, pão e provisões para a viagem de seu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com parte do melhor do Egito” ou “com parte da fartura do Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזֹאת
  choice: o seguinte
  rationale: A expressão introduz de modo idiomático a lista do que foi enviado; “o seguinte” é natural em português e mantém sua função resumitiva.
- source_word: חֲמֹרִים
  choice: jumentos
  rationale: Termo corrente e claro em português; preserva o contraste lexical com o feminino explícito na sequência.
- source_word: נֹשְׂאִים
  choice: carregados com
  rationale: Expressa naturalmente que os animais transportavam os bens, sem especificar além do hebraico a forma da carga.
- source_word: מִטּוּב מִצְרָיִם
  choice: algumas das melhores coisas do Egito
  rationale: Preserva o provável valor partitivo de מִן e deixa טוּב suficientemente amplo, sem restringi-lo a produtos específicos.
- source_word: אֲתֹנֹת
  choice: jumentas
  rationale: Reproduz de forma concisa a indicação feminina explícita no hebraico.
- source_word: בָּר
  choice: cereal
  rationale: Mantém a referência genérica a grãos, sem restringi-la indevidamente a trigo ou milho.
- source_word: לֶחֶם
  choice: pão
  rationale: Conserva o sentido comum e específico do termo no contexto da lista de alimentos.
- source_word: מָזוֹן
  choice: provisões
  rationale: No contexto de viagem, designa adequadamente os mantimentos, distinguindo-os do cereal e do pão já mencionados.
- source_word: לַדָּרֶךְ
  choice: para a viagem
  rationale: Equivalente idiomático e claro para os mantimentos destinados ao percurso.
