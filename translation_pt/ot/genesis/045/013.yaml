  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: pt
  text: Contem a meu pai toda a honra que tenho no Egito e tudo o que vocês viram.[a] Tragam depressa meu pai para cá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a minha glória no Egito”. O termo hebraico pode significar honra, glória ou esplendor; aqui se refere à posição elevada de José. O hebraico também conserva a ideia de fazer o pai “descer” até o Egito.'
    reason: lexical_and_directional_alternative
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: Contem
  rationale: O hifil de נגד significa aqui dar a conhecer ou contar; “Contem” é direto e natural na fala dirigida aos irmãos.
- source_word: כָּל כְּבוֹדִי
  choice: toda a honra que tenho
  rationale: כבוד pode indicar honra, glória ou esplendor. Neste contexto, refere-se à posição elevada e à dignidade de José no Egito; a formulação explicita naturalmente em português a relação possessiva.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Expressão locativa direta.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: tudo o que vocês viram
  rationale: Preserva a abrangência da oração e usa linguagem corrente, com “vocês” adequado ao plural dos destinatários.
- source_word: וּמִהַרְתֶּם וְהוֹרַדְתֶּם
  choice: Tragam depressa
  rationale: Comunica tanto a urgência de מהר quanto o sentido causativo de ירד. Em português, “tragam ... para cá” é mais natural do que reproduzir literalmente “façam descer”, enquanto a nota conserva a imagem direcional.
- source_word: הֵנָּה
  choice: para cá
  rationale: O advérbio indica movimento até o lugar onde está o falante; “para cá” exprime esse destino com precisão idiomática.
theological_decisions: []
