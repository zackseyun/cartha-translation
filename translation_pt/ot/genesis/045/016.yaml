base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: pt
  text: 'A notícia foi ouvida na casa do faraó: «Os irmãos de José chegaram». E isso agradou ao faraó e a seus servos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: A notícia chegou
  rationale: O hebraico diz literalmente que “a voz/o som foi ouvido”, mas, seguido pelo conteúdo da mensagem, o sentido contextual é que a notícia ou relato chegou ao conhecimento da casa do faraó. A formulação portuguesa é natural e mantém a voz passiva implícita sem sugerir mero ruído.
- source_word: בֵּית פַּרְעֹה
  choice: à casa do faraó
  rationale: Preserva a expressão hebraica “casa do faraó”, que pode abranger a residência e o ambiente da corte, sem restringi-la interpretativamente a “palácio” ou “corte”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da notícia, desempenhando a função discursiva de לֵאמֹר sem o pouco idiomático “dizendo”.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Os irmãos de José chegaram
  rationale: O perfeito indica uma chegada concluída e relevante para a situação presente. “Chegaram” é idiomático em português e comunica que eles agora estão ali.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Isso agradou
  rationale: Traduz naturalmente o idioma hebraico “foi bom aos olhos de”. “Isso agradou” conserva o sentido favorável sem impor uma avaliação moral abstrata.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: É a correspondência lexical mais direta e não especifica indevidamente se eram oficiais, cortesãos ou criados.
