  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: pt
  text: E eles lhe contaram tudo o que José lhes havia dito. Então ele viu as carroças que José tinha enviado para transportá-lo, e o ânimo de Jacó, pai deles, reviveu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito de Jacó, pai deles, voltou a viver”; expressão que indica renovação da vitalidade ou do ânimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף
  choice: E eles lhe contaram tudo o que José lhes havia dito
  rationale: “Contaram” expressa naturalmente o relato dos filhos a Jacó; “tudo o que José... havia dito” comunica o sentido de “todas as palavras de José” sem rigidez em português.
- source_word: וַיַּרְא אֶת הָעֲגָלוֹת
  choice: Então ele viu as carroças
  rationale: “Então” marca a progressão narrativa do waw consecutivo sem impor uma relação causal; “carroças” designa veículos de transporte e é amplamente compreensível.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: que José tinha enviado para transportá-lo
  rationale: “Transportá-lo” transmite com clareza a finalidade das carroças e o sentido contextual de נשׂא, evitando a possível estranheza de dizer que carroças foram enviadas para “carregá-lo”.
- source_word: וַתְּחִי רוּחַ
  choice: o ânimo ... reviveu
  rationale: A expressão hebraica descreve vitalidade ou coragem renovada. “Ânimo” preserva a dimensão interior de רוּחַ, e “reviveu” mantém a linguagem de vida do verbo חיה.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Jacó, pai deles
  rationale: Usa a forma portuguesa consagrada do nome bíblico e conserva explicitamente a relação familiar indicada pelo hebraico.
theological_decisions:
- issue: Sentido de רוּחַ em וַתְּחִי רוּחַ
  choice: ânimo
  alternative: espírito
  rationale: No contexto, a frase indica a recuperação da vitalidade e da esperança de Jacó, não exige uma afirmação técnica sobre a constituição humana. A nota conserva a tradução mais formal e a imagem hebraica.
- issue: Forma portuguesa do nome יַעֲקֹב
  choice: Jacó
  alternative: Yaakov
  rationale: Em uma Bíblia em português, “Jacó” é a forma tradicional, reconhecível e plenamente natural do nome hebraico, sem consequência doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluente. Evita literalismo rígido, mas preserva na nota a imagem concreta do hebraico em וַתְּחִי רוּחַ. O marcador [a] aparece no texto principal.
