  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: pt
  text: Ali eu sustentarei você, pois ainda haverá cinco anos de fome, para que você, sua família e tudo o que lhe pertence não fiquem na miséria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: eu sustentarei
  rationale: O verbo כִּלְכֵּל expressa prover o necessário ou manter alguém; “sustentarei” comunica isso com naturalidade e dignidade em português.
- source_word: כִּי
  choice: pois
  rationale: 'A conjunção introduz a razão da provisão prometida: ainda restam cinco anos de fome.'
- source_word: תִּוָּרֵשׁ
  choice: fiquem na miséria
  rationale: A forma verbal indica empobrecimento ou privação de recursos; a expressão evita o sentido moderno mais estreito de “destituído” e se ajusta ao sujeito composto em português.
theological_decisions:
- issue: Relação entre a provisão de José e os cinco anos restantes de fome
  choice: Manter a relação causal com “pois”
  alternative: Traduzir כִּי como simples explicação ou introdução discursiva
  rationale: Neste contexto, os anos de fome constituem claramente a razão pela qual José promete sustentar Jacó e sua casa.
- issue: Força preventiva de פֶּן
  choice: “para que ... não”
  alternative: “caso contrário” ou “para não acontecer que”
  rationale: A construção preserva a finalidade preventiva sem transformar a pobreza futura em resultado inevitável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sua família” traduz בֵיתְךָ pelo sentido de casa doméstica, e “tudo o que lhe pertence” preserva a abrangência do hebraico.
