  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: pt
  text: 'Eles lhe disseram: “José ainda está vivo e governa toda a terra do Egito.” Mas seu coração ficou entorpecido[a], pois ele não acreditou neles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu coração desfaleceu” ou “seu coração ficou paralisado”. A expressão hebraica descreve a reação interior de Jacó, atônito e enfraquecido ao ouvir a notícia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: Eles lhe disseram
  rationale: Reproduz de modo natural a fórmula hebraica que introduz a fala; em português, acrescentar “dizendo” seria redundante antes do discurso direto.
- source_word: עוֹד יוֹסֵף חַי
  choice: José ainda está vivo
  rationale: 'עוֹד indica a continuidade do estado: José permanece vivo.'
- source_word: מֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: governa toda a terra do Egito
  rationale: O particípio מֹשֵׁל expressa o exercício presente de autoridade. “Governa” preserva o sentido amplo sem atribuir a José um título egípcio específico.
- source_word: וַיָּפָג לִבּוֹ
  choice: seu coração ficou entorpecido
  rationale: Mantém a metáfora hebraica do coração e comunica a reação interior de choque, fraqueza ou insensibilidade súbita, sem decidir além do que permite o verbo raro פוג.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: pois ele não acreditou neles
  rationale: כִּי apresenta a razão da reação de Jacó; “pois” conserva claramente essa relação causal.
