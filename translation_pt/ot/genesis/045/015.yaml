  source_fidelity: A tradução acerta o beijo dirigido a todos os irmãos, a sequência temporal e a conversa posterior. Contudo, «chorou abraçado a eles» acrescenta explicitamente um abraço, gesto que não está expresso no hebraico. A preposição עַל deve ser mantida de modo que represente José chorando sobre/junto deles, sem especificar o abraço.
  naturalness: O texto é claro, moderno e de registro apropriado. «Chorou sobre eles» é uma construção literária natural no contexto narrativo e preserva melhor a imagem hebraica do que a paráfrase proposta.
  terminology: «Beijou», «irmãos» e «conversaram com ele» são escolhas adequadas. «Conversaram com ele» comunica bem o sentido de דִּבְּרוּ ... אִתּוֹ, sem impor uma fala unilateral.
  issues:
