  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: pt
  text: E beijou todos os seus irmãos e chorou sobre eles. Depois disso, seus irmãos conversaram com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: beijou
  rationale: O piel de נשׁק expressa aqui um beijo de afeto e reconciliação; “beijou” é natural e evita impor uma nuance iterativa não exigida pelo contexto.
- source_word: לְכָל אֶחָיו
  choice: todos os seus irmãos
  rationale: כָּל com o plural abrange a totalidade dos irmãos de José, e esta é a formulação portuguesa mais direta.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: chorou abraçado a eles
  rationale: בכה significa chorar, enquanto עַל, nesta cena de contato afetuoso, sugere que José chorava sobre ou junto aos irmãos; a formulação natural comunica a proximidade física sem o pouco idiomático “chorou sobre eles”.
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: A expressão temporal marca claramente a sequência dos acontecimentos.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: seus irmãos conversaram com ele
  rationale: דבר com אֵת pode indicar falar com alguém; “conversaram com ele” exprime naturalmente a interação sugerida pelo contexto reconciliado.
