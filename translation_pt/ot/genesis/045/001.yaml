revisions:
- from: 'Então José já não conseguiu se conter diante de todos os que estavam junto dele[a] e gritou: “Façam todos sair da minha presença!” E ninguém permaneceu com ele[b] quando José se deu a conhecer aos seus irmãos.'
  to: 'Então José não conseguiu mais se conter diante de todos os que estavam junto dele[a] e gritou: “Façam todos saírem da minha presença!” E ninguém permaneceu com ele[b] quando José se deu a conhecer aos seus irmãos.'
  rationale: 'A revisão ajusta apenas duas formulações: "não conseguiu mais" comunica a incapacidade continuada indicada no hebraico, e "Façam todos saírem" explicita a força causativa do imperativo plural. As notas, seus marcadores e o sentido do versículo permanecem preservados.'
