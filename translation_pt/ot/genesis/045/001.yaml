base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: pt
  text: 'Então José não conseguiu mais se conter diante de todos os que estavam junto dele[a] e gritou: “Façam todos saírem da minha presença!” E ninguém permaneceu com ele[b] quando José se deu a conhecer aos seus irmãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “na presença de todos os que estavam de pé junto dele”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “nenhum homem ficou de pé com ele”; isto é, ninguém permaneceu presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: conseguiu se conter
  rationale: A combinação da negação com o verbo de capacidade e o hitpael expressa a incapacidade de continuar exercendo autocontrole. A formulação é natural e preserva o sentido reflexivo.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: diante de todos os que estavam junto dele
  rationale: Mantém a ideia de pessoas presentes e posicionadas perto de José sem identificá-las interpretativamente como servos ou oficiais.
- source_word: וַיִּקְרָא
  choice: gritou
  rationale: O verbo indica chamar em voz alta; no contexto emocional, “gritou” é conciso, natural e textualmente justificado.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Façam todos sair da minha presença
  rationale: O imperativo plural causativo ordena aos presentes que retirem cada pessoa. “Todos” traduz idiomaticamente כָל אִישׁ, e “da minha presença” comunica com naturalidade a expressão hebraica מֵעָלָי.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: E ninguém permaneceu com ele
  rationale: Embora עמד signifique literalmente “ficar de pé”, aqui a expressão indica que ninguém continuou presente. A tradução comunica esse sentido contextual sem perder a referência em nota.
- source_word: בְּהִתְוַדַּע יוֹסֵף
  choice: quando José se deu a conhecer
  rationale: O hitpael de ידע indica que José revelou sua identidade. “Deu-se a conhecer” preserva a forma reflexiva e o tom digno do relato.
- source_word: אֶל אֶחָיו
  choice: aos seus irmãos
  rationale: Tradução direta e contextualmente precisa do termo de parentesco masculino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução evita identificar os presentes como “servos” ou “oficiais”, pois o hebraico apenas os descreve como pessoas que estavam junto de José. A ordem direta e o vocabulário atual preservam a intensidade emocional sem ampliar o texto.
