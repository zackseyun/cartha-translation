  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: pt
  text: Assim, eles subiram do Egito e chegaram à terra de Canaã, até Jacó, seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido básico de עלה, «subir», e a perspectiva geográfica tradicional da viagem do Egito para Canaã.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: A preposição מִן indica a origem do deslocamento; «do Egito» é a forma natural em português.
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: בוא pode significar «vir», «entrar» ou «chegar». Neste encadeamento narrativo, «chegaram» expressa naturalmente a conclusão da viagem sem sugerir uma perspectiva deíctica inadequada.
- source_word: אֶרֶץ כְּנַעַן
  choice: à terra de Canaã
  rationale: Mantém o substantivo אֶרֶץ, presente na construção hebraica, em vez de reduzi-la apenas a «Canaã».
- source_word: אֶל יַעֲקֹב
  choice: onde estava Jacó
  rationale: O hebraico indica movimento em direção a Jacó. Em português, a explicitação idiomática «onde estava» liga naturalmente o destino territorial ao pessoal, sem alterar o referente.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: Refere-se diretamente a Jacó como pai dos irmãos. Em português, «seu pai» concorda idiomaticamente com o sujeito coletivo «eles».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sequência narrativa foi mantida concisa; «subiram» conserva a nuance geográfica do hebraico, enquanto «chegaram» soa mais natural que uma reprodução mecânica de «vieram».
