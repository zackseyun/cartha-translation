  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד יוֹסֵ֥ף בְּנִ֖/י חָ֑י אֵֽלְכָ֥ה וְ/אֶרְאֶ֖/נּוּ בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: pt
  text: 'Então Israel disse[a]: “Basta! Meu filho José ainda está vivo. Irei vê-lo antes de morrer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É o bastante.” Aqui, o hebraico רַב é uma exclamação de suficiência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português sem acrescentar uma relação causal.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o nome empregado explicitamente no texto hebraico, sem harmonizá-lo com “Jacó”.
- source_word: רַב
  choice: Basta!
  rationale: Neste uso exclamativo, declara suficiência e comunica de modo natural a força emocional abrupta da fala.
- source_word: עוֹד ... חָי
  choice: ainda está vivo
  rationale: 'A combinação indica continuidade: José permanece vivo. Esta é a formulação corrente e clara em português.'
- source_word: בְּנִי
  choice: meu filho
  rationale: Reproduz diretamente a construção possessiva e conserva a ênfase familiar e afetiva.
- source_word: אֵלְכָה
  choice: Irei
  rationale: O cohortativo expressa resolução. O futuro em primeira pessoa transmite a intenção firme sem impor a obrigação sugerida por “tenho de ir”.
- source_word: וְאֶרְאֶנּוּ
  choice: vê-lo
  rationale: Traduz de forma direta o verbo “ver” com sufixo masculino singular, em português natural.
- source_word: בְּטֶרֶם אָמוּת
  choice: antes de morrer
  rationale: Expressa com naturalidade a relação temporal do hebraico; o infinitivo flexionado não é necessário porque o sujeito permanece inequívoco.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Basta!” preserva a concisão e a carga emocional do hebraico; “Irei vê-lo” mantém a determinação do cohortativo sem soar arcaico.
