base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: pt
  text: Levem seu pai e suas famílias, venham até mim, e eu lhes darei o melhor da terra do Egito; vocês comerão da fartura da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a gordura da terra”, expressão hebraica que se refere à sua porção mais rica e abundante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Levem
  rationale: O imperativo plural de לקח ordena aos irmãos que levem consigo o pai e os demais membros das famílias. Em português, “levem” expressa naturalmente o movimento até o locutor indicado por “venham até mim”.
- source_word: אֲבִיכֶם
  choice: seu pai
  rationale: O substantivo singular com sufixo de segunda pessoa do plural refere-se diretamente a Jacó; o português corrente usa “seu” também ao dirigir-se a várias pessoas.
- source_word: בָּתֵּיכֶם
  choice: suas famílias
  rationale: Embora בַּיִת signifique literalmente “casa”, aqui designa as pessoas pertencentes a cada unidade doméstica. “Famílias” é claro e natural para leitores atuais, sem sugerir que se transportem edifícios.
- source_word: וּבֹאוּ אֵלַי
  choice: venham até mim
  rationale: Reproduz diretamente o imperativo plural de בוא com אֶל e não acrescenta a ideia de retorno, ausente da expressão hebraica.
- source_word: וְאֶתְּנָה לָכֶם
  choice: e eu lhes darei
  rationale: A forma volitiva de נתן, após os imperativos, funciona no contexto como promessa ou garantia. O futuro em português comunica essa força com naturalidade.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: o melhor da terra do Egito
  rationale: טוּב pode indicar a bondade, os bens ou a melhor porção de algo. Aqui promete acesso privilegiado aos melhores recursos da terra do Egito.
- source_word: וְאִכְלוּ
  choice: vocês comerão
  rationale: 'Embora a forma seja imperativa, depois da promessa de dar o melhor da terra ela pode ser expressa naturalmente em português como o resultado garantido: “vocês comerão”.'
- source_word: חֵלֶב הָאָרֶץ
  choice: da fartura da terra
  rationale: Literalmente, a expressão é “a gordura da terra”, metáfora para sua porção mais rica e abundante. “Fartura” preserva o sentido idiomático e a ligação com o verbo “comer” em português compreensível.
