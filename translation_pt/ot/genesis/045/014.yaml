  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: pt
  text: Então José se lançou ao pescoço de seu irmão Benjamim e chorou[a]; e Benjamim chorou abraçado ao pescoço dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “caiu sobre os pescoços de Benjamim, seu irmão [...] e Benjamim chorou sobre o pescoço dele”. A forma plural “pescoços” faz parte de uma expressão idiomática hebraica para abraçar alguém pelo pescoço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: Então José se lançou
  rationale: O waw consecutivo faz a narrativa avançar. O verbo נפל significa literalmente “cair”, mas, com “ao pescoço”, “se lançou” expressa naturalmente em português o gesto intenso de abraço. O nome José, embora implícito no verbo hebraico, é explicitado para evitar ambiguidade pronominal.
- source_word: עַל צַוְּארֵי / עַל צַוָּארָיו
  choice: ao pescoço / ao pescoço dele
  rationale: A construção idiomática descreve um abraço ao redor do pescoço. A forma hebraica referente ao pescoço de Benjamim é morfologicamente plural, mas o singular é natural em português. “Dele” mantém a referência a José sem a possível ambiguidade de “seu”.
- source_word: בִנְיָמִן אָחִיו
  choice: seu irmão Benjamim
  rationale: Preserva tanto o nome próprio em sua forma portuguesa tradicional quanto a identificação familiar explícita no hebraico.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: chorou
  rationale: בכה denota chorar ou prantear. “Chorou” é corrente, digno e adequado à emoção da cena, sendo repetido nas duas orações como no original.
- source_word: וּבִנְיָמִן
  choice: e Benjamim
  rationale: A conjunção coordena simplesmente a reação de Benjamim, sem exigir o acréscimo interpretativo de “também”.
