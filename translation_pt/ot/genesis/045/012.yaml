revisions:
- from: 'E vejam[a]: os olhos de vocês estão vendo — como também os olhos de meu irmão Benjamim — que sou eu mesmo quem está falando com vocês.'
  to: 'Vejam: os olhos de vocês veem — e também os olhos de meu irmão Benjamim — que é a minha própria boca que está falando com vocês.'
  rationale: A revisão preserva na tradução principal a expressão hebraica «minha boca», inclusive sua ênfase pessoal mediante «minha própria boca», e melhora a fluidez de «estão vendo» para «veem». A coordenação elíptica dos olhos dos destinatários e dos olhos de Benjamim é mantida. Como a principal já verte o elemento que a nota procurava explicar, a nota lexical é removida.
