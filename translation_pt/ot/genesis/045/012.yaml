  text: וְ/הִנֵּ֤ה עֵֽינֵי/כֶם֙ רֹא֔וֹת וְ/עֵינֵ֖י אָחִ֣/י בִנְיָמִ֑ין כִּי פִ֖/י הַֽ/מְדַבֵּ֥ר אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: pt
  text: 'Vejam: os olhos de vocês veem — e também os olhos de meu irmão Benjamim — que é a minha própria boca que está falando com vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam
  rationale: Introduz um chamado enfático à atenção. «Vejam» comunica essa força de modo natural no português moderno, sem o tom arcaizante de «eis».
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: os olhos de vocês estão vendo
  rationale: Mantém a imagem concreta dos olhos como confirmação visual direta e expressa naturalmente o valor presente do particípio hebraico.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: como também os olhos de meu irmão Benjamim
  rationale: Preserva o paralelismo com «os olhos de vocês» e a identificação explícita de Benjamim como irmão de José; «como também» torna clara a coordenação elíptica em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os presentes podem constatar visualmente.
- source_word: פִי
  choice: sou eu mesmo
  rationale: O hebraico diz literalmente «minha boca», uma metonímia que destaca que José fala pessoalmente, sem intérprete. A formulação idiomática preserva essa ênfase no português corrente; a expressão literal aparece na nota.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: quem está falando com vocês
  rationale: Representa a construção participial substantivada e sua ação presente e direta em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» corresponde ao plural hebraico; «Benjamim» segue a forma portuguesa corrente. A tradução principal verte idiomaticamente a metonímia «minha boca», enquanto a nota conserva sua forma concreta e a estrutura mais formal do hebraico.
