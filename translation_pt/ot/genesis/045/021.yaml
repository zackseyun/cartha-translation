base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: pt
  text: Os filhos de Israel fizeram assim. José lhes deu carroças, conforme a ordem do faraó[a], e também provisões para a viagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “segundo a boca do faraó”, expressão que significa “conforme a ordem do faraó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: Reproduz de modo natural a expressão hebraica que indica que eles agiram conforme o que acabara de ser determinado.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém o sentido literal e específico no contexto, que se refere aos filhos homens de Jacó, chamado Israel.
- source_word: עֲגָלוֹת
  choice: carroças
  rationale: Designa veículos de rodas usados para transportar pessoas e bens; evita o sentido moderno de automóvel que “carros” poderia sugerir.
- source_word: עַל פִּי פַרְעֹה
  choice: conforme a ordem do faraó
  rationale: Expressa com clareza o sentido do idioma hebraico, literalmente “segundo a boca do faraó”.
- source_word: צֵדָה
  choice: provisões
  rationale: Abrange os mantimentos e demais suprimentos necessários para viajar, sem restringir o sentido apenas a comida.
- source_word: לַדָּרֶךְ
  choice: para a viagem
  rationale: Comunica naturalmente, em português atual, a finalidade das provisões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A coordenação hebraica foi dividida em duas frases para maior fluidez, sem alterar a sequência narrativa; “também” explicita naturalmente a adição expressa pela segunda oração coordenada.
