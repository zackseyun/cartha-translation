base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: pt
  text: Ele chorou em voz alta[a]; os egípcios ouviram[b], e a casa de Faraó[c] ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu a sua voz em choro”, expressão hebraica que significa que ele chorou alto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Egito ouviu”, se o termo for entendido coletivamente como a terra ou o povo; o verbo no plural favorece “os egípcios ouviram”.
    reason: lexical_alternative
  - marker: c
    text: “A casa de Faraó” também pode ser traduzida como “a casa real” ou “os da casa de Faraó” e, por extensão, “a corte de Faraó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: chorou em voz alta
  rationale: A expressão significa literalmente que ele “deu a sua voz em choro”, um idiomatismo que descreve choro audível e intenso. “Chorou em voz alta” comunica o sentido de modo natural em português.
- source_word: וַיִּשְׁמְעוּ / וַיִּשְׁמַע
  choice: ouviram / ouviu
  rationale: שׁמע indica aqui a percepção do som, não escuta atenta nem obediência. A repetição preserva o paralelismo do hebraico.
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: Embora a forma também possa designar “Egito”, o verbo no plural favorece a referência coletiva às pessoas, isto é, aos egípcios.
- source_word: בֵּית פַּרְעֹה
  choice: a casa de Faraó
  rationale: 'A formulação mantém a imagem hebraica e sua amplitude semântica: pode designar a família, o pessoal da casa real ou a corte, e não necessariamente o edifício do palácio.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O ponto e vírgula evita transformar a coordenação hebraica numa relação causal explícita. “Também” torna natural a segunda ocorrência de “ouviu” sem alterar o conteúdo.
