base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: pt
  text: A cada um deles deu uma muda de roupa; a Benjamim, porém, deu trezentas peças de prata[a] e cinco mudas de roupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “trezentas de prata”; a unidade monetária específica não é indicada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: A cada um deles
  rationale: Combina naturalmente em português as duas expressões distributivas hebraicas, evitando redundância pouco idiomática sem perder o sentido de que cada integrante do grupo recebeu algo.
- source_word: נָתַן
  choice: deu
  rationale: É o equivalente simples e direto no contexto narrativo de entrega de presentes.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: muda(s) de roupa
  rationale: Expressão corrente e clara para conjuntos de roupa destinados à troca; o singular na primeira ocorrência decorre da distribuição de uma muda a cada pessoa.
- source_word: וּלְבִנְיָמִן
  choice: a Benjamim, porém
  rationale: O waw introduz aqui um contraste contextual entre o presente comum aos irmãos e o presente excepcional dado a Benjamim; 'porém' torna essa relação natural em português.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: trezentas peças de prata
  rationale: O hebraico não declara uma unidade monetária específica. 'Peças de prata' comunica o valor em prata sem acrescentar 'siclos' ao texto.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: e cinco mudas de roupa
  rationale: Mantém a mesma expressão usada anteriormente e preserva diretamente a quantidade indicada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem 'a Benjamim, porém' realça o contraste sem elevar desnecessariamente o registro. O ponto e vírgula separa com clareza os presentes comuns do presente excepcional.
