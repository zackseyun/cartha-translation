  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: pt
  text: E agora, não fiquem tristes[a] nem se irritem consigo mesmos[b] por terem me vendido para cá, pois Deus me enviou adiante de vocês para preservar vidas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se aflijam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “nem arda aos olhos de vocês”, expressão idiomática que indica irritação ou desgosto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para a preservação da vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto o valor temporal do marcador hebraico.
- source_word: אַל תֵּעָצְבוּ
  choice: não fiquem tristes
  rationale: O verbo expressa dor ou tristeza emocional; esta formulação é natural, clara e adequada ao apelo consolador de José.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: nem se irritem consigo mesmos
  rationale: Traduz de modo idiomático a expressão literalmente ligada a algo 'arder aos olhos'; no contexto, refere-se à irritação ou ao desgosto dos irmãos consigo mesmos.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: por terem me vendido para cá
  rationale: כִּי fundamenta as proibições, e הֵנָּה indica movimento até o lugar onde José se encontra; 'para cá' conserva essa direção de modo natural em português.
- source_word: לְמִחְיָה
  choice: para preservar vidas
  rationale: O substantivo denota preservação da vida ou sobrevivência. O plural idiomático 'vidas' comunica que a finalidade era manter pessoas vivas, sem restringir indevidamente o alcance.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Deus me enviou
  rationale: O pretérito perfeito traduz naturalmente a ação concluída atribuída diretamente a Deus.
- source_word: לִפְנֵיכֶם
  choice: adiante de vocês
  rationale: 'Expressa a precedência temporal e espacial: José foi enviado antes da chegada dos irmãos.'
theological_decisions:
- issue: Providência divina e responsabilidade humana
  choice: Manter lado a lado 'vocês me venderam' e 'Deus me enviou'.
  alternative: Abrandar a ação dos irmãos ou apresentar a ação divina apenas como permissão.
  rationale: O hebraico afirma explicitamente tanto a ação culpável dos irmãos quanto o propósito ativo de Deus, sem explicar de que modo as duas se relacionam; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vocês' evita regionalismo excessivo; 'para cá' preserva a deixis do hebraico. A frase mantém a tensão entre a responsabilidade dos irmãos e a providência divina.
