  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: pt
  text: Todo animal que se move[a] e está vivo será alimento para vocês. Assim como lhes dei as plantas verdes, dei-lhes tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Todo animal que rasteja e está vivo”. O substantivo hebraico רֶמֶשׂ muitas vezes designa criaturas que rastejam ou se movem em enxames, mas neste contexto provavelmente tem sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Todo animal que se move
  rationale: A construção tem sentido distributivo e abrangente. “Animal que se move” comunica em português atual a amplitude contextual de רֶמֶשׂ sem restringi-lo indevidamente a répteis ou pequenos animais rastejantes.
- source_word: אֲשֶׁר הוּא חַי
  choice: e está vivo
  rationale: Reproduz com clareza a qualificação de que se trata de criatura viva, preservando a forma adjetival de חַי.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: servirá de alimento para vocês
  rationale: Expressa naturalmente a construção predicativa e o valor de permissão ou provisão, sem rigidez literal.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: assim como lhes dei as plantas verdes
  rationale: “Plantas verdes” representa de modo claro e coletivo a vegetação anteriormente concedida como alimento. A oração foi explicitada em português para tornar inteligível a comparação compacta do hebraico.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: Eu lhes dou tudo
  rationale: O perfeito hebraico descreve uma concessão realizada e vigente. O presente português destaca o efeito atual dessa concessão, enquanto “tudo” preserva a força abrangente de כֹּל.
theological_decisions:
- issue: Alcance da concessão alimentar após o dilúvio
  choice: O versículo expressa uma concessão abrangente dos animais vivos como alimento humano.
  alternative: Limitar a referência a criaturas pequenas, rastejantes ou que se movem em enxames.
  rationale: Embora רֶמֶשׂ possa designar criaturas que rastejam ou se movem em enxames, aqui “todo”, a qualificação “está vivo” e a conclusão “tudo” favorecem um sentido contextual amplo. A tradução mantém essa amplitude sem eliminar a alternativa lexical, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” evita formas regionais ou arcaizantes; “animal que se move” preserva a abrangência contextual, e a ordem da segunda frase torna natural em português a comparação compacta do hebraico.
