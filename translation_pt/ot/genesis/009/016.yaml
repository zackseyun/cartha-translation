  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: pt
  text: O arco estará na nuvem[a], e eu o verei para me lembrar da aliança perpétua entre Deus e todo ser vivo dentre toda carne que está sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o arco-íris”. A palavra hebraica significa literalmente “arco”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “dentre toda carne” também pode ser entendida como “de toda carne”; ela especifica o alcance de “todo ser vivo”.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה
  choice: estará
  rationale: O perfeito com waw dá continuidade à fala divina orientada para o futuro; o futuro do indicativo expressa isso naturalmente em português.
- source_word: הַקֶּשֶׁת
  choice: o arco
  rationale: Preserva o sentido concreto do hebraico e a imagem do arco no céu; “arco-íris” é explicitado como alternativa contextual em nota.
- source_word: בֶּעָנָן
  choice: na nuvem
  rationale: Mantém o substantivo hebraico no singular com artigo e soa natural em português.
- source_word: וּרְאִיתִיהָ
  choice: e eu o verei
  rationale: Reproduz a coordenação hebraica e o sufixo pronominal referente ao arco, sem introduzir uma oração temporal.
- source_word: לִזְכֹּר
  choice: para me lembrar
  rationale: Expressa diretamente o valor de finalidade ou resultado do infinitivo com ל; o pronome reflexivo é idiomático em português.
- source_word: בְּרִית עוֹלָם
  choice: a aliança perpétua
  rationale: “Perpétua” comunica a duração contínua de עוֹלָם em linguagem clara e digna.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: entre Deus e
  rationale: A repetição idiomática hebraica de “entre” é condensada de modo natural em português.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: todo ser vivo
  rationale: Traduz a expressão como referência ampla à vida animada, sem impor ao termo נֶפֶשׁ o sentido teológico restrito de “alma”.
- source_word: בְּכָל בָּשָׂר
  choice: entre toda criatura de carne
  rationale: Mantém a preposição ב e a noção concreta de בָּשָׂר, ao mesmo tempo que esclarece em português que se trata do conjunto das criaturas corpóreas; a construção difícil é sinalizada em nota.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: que está sobre a terra
  rationale: Conserva a oração relativa e o alcance universal indicado pelo contexto.
theological_decisions:
- issue: Lembrança divina em linguagem antropomórfica
  choice: “eu o verei para me lembrar”
  alternative: “eu o verei e agirei de acordo com a minha aliança”
  rationale: A formulação preserva a linguagem do texto sobre Deus se lembrar da aliança, sem dissolver a tensão teológica por meio de explicação interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem das orações e a imagem concreta do hebraico foram preservadas; evitou-se transformar a lembrança divina em paráfrase doutrinária.
