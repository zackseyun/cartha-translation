  source_fidelity: A tradução preserva bem a sequência futura, a imagem de «arco» na nuvem e a linguagem antropomórfica de Deus ver e lembrar. Contudo, «entre toda criatura de carne» introduz indevidamente um segundo «entre», como se correspondesse à repetição de בֵּין; o hebraico tem aqui בְּכָל־בָּשָׂר, ligado à designação da criatura viva.
  naturalness: «O arco estará na nuvem» e «eu o verei para me lembrar» são claros e naturais em português moderno. A correção para «dentre toda carne» elimina a construção sintaticamente e semanticamente enganosa, embora conserve a concisão um tanto densa do original.
  terminology: «Arco», com nota para «arco-íris», é uma boa opção; «aliança perpétua» comunica adequadamente בְּרִית עוֹלָם. «Todo ser vivo» é apropriado para כָּל נֶפֶשׁ חַיָּה. «Toda carne» mantém a expressão abrangente e concreta do hebraico.
