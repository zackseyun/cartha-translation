  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: pt
  text: Mas não comam carne com a sua vida[a], isto é, o seu sangue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somente não comam carne com a sua vida — o seu sangue.”'
    reason: Alternativa que preserva mais diretamente o valor restritivo de אַךְ e a aposição compacta do hebraico.
  - marker: b
    text: 'O hebraico traz literalmente uma sequência concisa: “com a sua vida, o seu sangue”, que também pode ser pontuada com travessão.'
    reason: Registra a construção aposicional do original e evita apresentar “isto é” como a única análise possível.
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz a restrição à permissão ampla do versículo anterior de comer animais; “mas” expressa o contraste de modo natural em português.
- source_word: בָּשָׂר
  choice: carne
  rationale: Em português atual, “carne” preserva o sentido concreto do hebraico e é mais natural que “corpo” ou “tecido carnal” neste contexto alimentar.
- source_word: בְּנַפְשׁוֹ
  choice: com a sua vida
  rationale: נֶפֶשׁ designa aqui a vida do animal, não necessariamente uma “alma” imaterial; a preposição בְּ indica que a carne ainda está associada à vida.
- source_word: דָמוֹ
  choice: com o seu sangue
  rationale: Traduz diretamente דָם e repete “com” para tornar clara, em português, a relação sintática com a proibição.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: com a sua vida, isto é, com o seu sangue
  rationale: A justaposição hebraica é concisa e pode ser entendida como explicativa ou aposicional; “isto é” comunica essa relação com clareza sem substituir “vida” por “sangue vital”.
- source_word: לֹא תֹאכֵלוּ
  choice: não comam
  rationale: A forma verbal está no plural e, neste contexto legal, expressa uma proibição. “Não comam” é atual, claro e digno em português.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em relação ao sangue
  choice: “vida”, e não “alma”
  alternative: “alma”
  rationale: Neste contexto, נֶפֶשׁ se refere à vida animada da criatura e à sua relação com o sangue; “alma” poderia introduzir uma categoria antropológica posterior que o versículo não exige.
- issue: Relação sintática entre “vida” e “sangue”
  choice: Relação explicitada por “isto é”
  alternative: 'Justaposição por travessão: “com a sua vida — o seu sangue”'
  rationale: O hebraico permite uma aposição compacta. A formulação escolhida torna a identificação explicativa legível em português, enquanto a nota conserva a estrutura mais concisa e sua ambiguidade formal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo plural “não comam” evita o tom arcaico de “não comereis”, mantendo a força normativa. “Carne” e “sangue” conservam a concretude do texto.
