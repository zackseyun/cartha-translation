base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: pt
  text: Pus o meu arco na nuvem[a], e ele será um sinal da aliança entre mim e a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu arco-íris”. O hebraico diz literalmente “o meu arco”, usando a palavra comum para um arco; neste contexto, refere-se ao arco-íris na nuvem.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: o meu arco
  rationale: קֶשֶׁת é a palavra comum para “arco”, inclusive como arma. O contexto das nuvens indica o arco-íris, mas a tradução principal preserva a imagem hebraica, enquanto a nota esclarece o referente.
- source_word: נָתַתִּי
  choice: Pus
  rationale: נתן pode significar “dar”, “pôr” ou “colocar”. Aqui, “pus” expressa naturalmente em português a colocação do arco nas nuvens; o pretérito perfeito também pode comunicar um ato concluído com validade presente.
- source_word: בֶּעָנָן
  choice: nas nuvens
  rationale: O hebraico traz o singular definido, literalmente “na nuvem”. Em português corrente, “nas nuvens” identifica com maior naturalidade o lugar em que aparece o arco-íris, sem mudar o sentido contextual.
- source_word: וְהָיְתָה
  choice: e ele será
  rationale: Neste contexto, a forma verbal apresenta o resultado ou a função futura do arco. O pronome masculino retoma naturalmente “arco” em português.
- source_word: לְאוֹת
  choice: um sinal
  rationale: אוֹת designa um sinal ou marca. “Um sinal” é claro e idiomático em português.
- source_word: בְּרִית
  choice: da aliança
  rationale: Embora o substantivo não tenha artigo no hebraico, a aliança já foi estabelecida no contexto imediato; a forma definida é natural em português.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: entre mim e a terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. O alcance universal do relato do dilúvio favorece “a terra”.
theological_decisions:
- issue: Referente de קַשְׁתִּי no contexto da aliança
  choice: Manter “o meu arco” no texto principal, entendido no contexto como o arco-íris
  alternative: o meu arco-íris
  rationale: O hebraico emprega a palavra comum para “arco”. Preservá-la mantém a imagem original e sua possível associação com uma arma, sem impor essa associação; a nota informa claramente o referente natural no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pus” é direto e natural; “nas nuvens” evita a estranheza de “na nuvem” em português corrente. A estrutura conserva a imagem do arco e a linguagem da aliança.
