base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their slave.”
translation:
  language: pt
  text: 'E disse: “Bendito seja o SENHOR, o Deus de Sem; e seja Canaã escravo deles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Expressa naturalmente a fórmula hebraica de louvor, mantendo o SENHOR, e não Sem, como aquele que é bendito.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa de representar o tetragrama por SENHOR em versaletes.
- source_word: עֶבֶד
  choice: escravo
  rationale: Preserva o sentido forte de servidão pessoal no contexto da sentença sobre Canaã, sem atenuá-lo para “servo”.
- source_word: לָמוֹ
  choice: deles
  rationale: Reproduz a forma pronominal plural do texto massorético, preservando sua referência potencialmente ambígua.
theological_decisions:
- issue: Referente do pronome plural לָמוֹ
  choice: deles
  alternative: dele
  rationale: O texto consonantal vocalizado apresenta forma plural. Embora traduções e leituras contextuais por vezes adotem o singular com referência a Sem, a tradução mantém o plural genuíno sem resolver silenciosamente a tensão referencial.
- issue: Objeto da bênção
  choice: Bendito seja o SENHOR, o Deus de Sem
  alternative: Sem seja bendito pelo SENHOR, seu Deus
  rationale: A sintaxe hebraica declara YHWH bendito e o identifica como Deus de Sem; não transfere diretamente a bênção para Sem.
translation_notes:
  register: Português moderno, claro e solene, com coordenação próxima ao paralelismo hebraico. “E disse” mantém a continuidade narrativa; “seja” conserva a força volitiva da segunda oração.
