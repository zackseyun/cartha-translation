base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a slave of servants to his brothers.”
translation:
  language: pt
  text: 'E ele disse: “Canaã é maldito[a]; escravo de escravos[b] será para seus irmãos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Maldito seja Canaã”. O hebraico é uma oração nominal e também pode ser traduzido como uma declaração de estado. O texto diz explicitamente “Canaã”, não Cam.'
    reason: ambiguidade_sintática_e_esclarecimento_textual
  - marker: b
    text: 'A expressão hebraica “escravo de escravos” intensifica a ideia: o mais baixo dos escravos, sujeito à servidão extrema.'
    reason: expressão_idiomática
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a sequência narrativa do wayyiqtol e introduz diretamente a fala, sem acrescentar uma relação discursiva não expressa.
- source_word: אָרוּר
  choice: Maldito seja
  rationale: Formulação natural e solene de uma maldição em português. A forma hebraica é uma oração nominal e também pode ser entendida de modo declarativo, “Canaã é maldito”.
- source_word: כְּנָעַן
  choice: Canaã
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português; o texto nomeia explicitamente Canaã.
- source_word: עֶבֶד עֲבָדִים
  choice: Escravo de escravos
  rationale: Mantém a repetição enfática do hebraico e a severidade da condição de sujeição, sem suavizá-la para “servo”. A expressão funciona como intensificação superlativa.
- source_word: יִהְיֶה
  choice: será
  rationale: O imperfeito de היה expressa aqui o estado futuro anunciado pela maldição.
- source_word: לְאֶחָיו
  choice: para os seus irmãos
  rationale: Traduz literalmente a preposição, o substantivo masculino plural e o sufixo de terceira pessoa masculina singular, preservando a referência familiar ou clânica sem a resolver como “parentes”.
theological_decisions:
- issue: Objeto da maldição de Noé
  choice: Canaã é explicitamente apresentado como o amaldiçoado.
  alternative: Interpretar a maldição como dirigida diretamente a Cam.
  rationale: O texto hebraico diz כְּנָעַן, “Canaã”. A tradução não transfere a maldição para Cam com base em tradições interpretativas.
- issue: Linguagem de escravidão
  choice: Empregar “escravo” e conservar a expressão “escravo de escravos”.
  alternative: “Servo de servos” ou a paráfrase “o mais baixo dos escravos”.
  rationale: Neste contexto de extrema sujeição, “escravo” comunica melhor a força de עֶבֶד. A repetição conserva a retórica hebraica, enquanto a nota esclarece seu valor intensificador.
- issue: Força de אָרוּר
  choice: 'Traduzir como pronúncia de maldição: “Maldito seja”.'
  alternative: 'Declaração de estado: “Canaã é maldito”.'
  rationale: A construção nominal hebraica admite uma tradução declarativa, mas, no contexto da fala solene de Noé, a formulação optativa é natural. A nota preserva a alternativa sem eliminar a ambiguidade.
translation_notes:
  register: Português atual, solene e de ampla compreensão, com legibilidade brasileira. A ordem marcada “Escravo de escravos será” conserva a ênfase inicial do hebraico sem recorrer a vocabulário arcaico.
