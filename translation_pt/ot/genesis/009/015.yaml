    text: 'Ou: “todo ser vivente dentre toda carne”. O hebraico também pode ser entendido como “todo ser vivo entre toda carne”.'
    reason: lexical_alternative
  revision_rationale: A revisão resolve a ambiguidade sintática, melhora a fluência em português e mantém tanto a estrutura relacional do hebraico quanto a repetição significativa de «toda carne».
