  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: pt
  text: e me lembrarei da minha aliança, que está entre mim e vocês e entre todo ser vivo, de toda carne[a]; e as águas nunca mais se tornarão um dilúvio para destruir toda carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo ser vivente dentre toda carne”. O hebraico também pode ser entendido como “todo ser vivo entre toda carne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: e me lembrarei
  rationale: Preserva a linguagem explícita de lembrança e o sentido futuro do perfeito com conjunção no discurso divino.
- source_word: בְּרִיתִי
  choice: minha aliança
  rationale: “Aliança” mantém o sentido relacional, formal e promissório de בְּרִית.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: todo ser vivo
  rationale: Neste contexto, נֶפֶשׁ חַיָּה designa seres animados em geral, não apenas pessoas; a expressão portuguesa é natural e inclusiva.
- source_word: בְּכָל בָּשָׂר
  choice: entre todos os seres de carne
  rationale: Traduz o valor inclusivo/classificatório da preposição e mantém a imagem hebraica da carne sem sugerir que a aliança abrange somente os seres humanos.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: e ... nunca mais se tornarão
  rationale: “Nunca mais” expressa claramente a negação permanente, enquanto “se tornarão” liga naturalmente as águas ao dilúvio.
- source_word: הַמַּיִם לְמַבּוּל
  choice: as águas ... se tornarão um dilúvio
  rationale: Entende o לְ como resultado ou função e produz uma formulação natural em português.
- source_word: לְשַׁחֵת
  choice: para destruir
  rationale: O infinitivo indica a finalidade ou o resultado do dilúvio; “destruir” conserva o peso do verbo.
- source_word: כָּל בָּשָׂר
  choice: todos os seres de carne
  rationale: Preserva a metáfora ampla de בָּשָׂר e inclui seres humanos e animais, evitando a leitura restrita de “todas as pessoas”.
theological_decisions:
- issue: Linguagem antropomórfica da lembrança divina
  choice: me lembrarei
  alternative: terei em mente / agirei conforme minha aliança
  rationale: O hebraico emprega explicitamente a linguagem de lembrança. Mantê-la preserva o idioma da aliança e não explica de antemão como essa lembrança divina opera.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil. “Vocês” comunica o plural hebraico sem regionalismo excessivo. A repetição de “seres de carne” preserva a amplitude e a imagem de כָּל־בָּשָׂר; a nota registra uma alternativa mais formal.
