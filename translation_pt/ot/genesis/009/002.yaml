  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: pt
  text: O medo e o pavor de vocês[a] cairão sobre todos os animais da terra, sobre todas as aves do céu, sobre tudo o que rasteja pelo solo e sobre todos os peixes do mar. Eles foram entregues nas mãos de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o medo e o pavor que vocês inspiram.
    reason: lexical_alternative
  - marker: b
    text: A expressão “entregues nas mãos de vocês” significa colocados sob o poder ou controle de vocês.
    reason: idiom_explanation
lexical_decisions:
- source_word: מוֹרַאֲכֶם
  choice: o medo de vocês
  rationale: Preserva a construção genitiva do hebraico, que neste contexto indica principalmente o medo inspirado pelos seres humanos, sem eliminar totalmente a concisão e a ambiguidade formal da expressão.
- source_word: חִתְּכֶם
  choice: o pavor de vocês
  rationale: “Pavor” distingue o segundo termo de “medo” e conserva a intensificação do par hebraico.
- source_word: יִהְיֶה עַל
  choice: cairão sobre
  rationale: Expressa em português natural a ideia hebraica de que medo e pavor estarão sobre os animais; o plural concorda com o sujeito composto em português.
- source_word: חַיַּת הָאָרֶץ
  choice: todos os animais da terra
  rationale: O substantivo coletivo refere-se aos animais terrestres; a formulação evita restringi-lo desnecessariamente apenas aos animais selvagens.
- source_word: עוֹף הַשָּׁמָיִם
  choice: todas as aves do céu
  rationale: “Aves do céu” é uma expressão portuguesa clara e digna, adequada ao sentido contextual de עוֹף e שָׁמַיִם.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: sobre tudo o que se move pelo solo
  rationale: Representa o movimento de criaturas junto ao chão sem limitar a expressão somente ao ato estrito de rastejar; “solo” diferencia אֲדָמָה da anterior אֶרֶץ.
- source_word: דְּגֵי הַיָּם
  choice: todos os peixes do mar
  rationale: Tradução direta que mantém a abrangência da enumeração.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: foram entregues nas mãos de vocês
  rationale: Preserva a voz passiva, o aspecto resultante do perfeito e a metáfora hebraica de serem colocados sob o poder ou controle de alguém.
theological_decisions:
- issue: Domínio humano sobre os animais depois do dilúvio
  choice: Preservar a imagem de os animais serem entregues nas mãos dos seres humanos.
  alternative: 'Explicitar interpretativamente: “foram submetidos ao domínio de vocês”.'
  rationale: A expressão hebraica comunica autoridade real, mas a metáfora deve permanecer no texto, sem ampliá-la para uma doutrina de domínio irrestrito nem enfraquecê-la por razões éticas posteriores.
- issue: Sentido dos genitivos “medo de vocês” e “pavor de vocês”
  choice: Manter a forma genitiva no texto e esclarecer em nota que o sentido contextual é o medo inspirado pelos seres humanos.
  alternative: 'Traduzir diretamente: “o medo e o pavor que vocês inspiram”.'
  rationale: A forma escolhida conserva mais de perto a estrutura e a tensão lexical do hebraico, enquanto a nota impede uma leitura equivocada como medo sentido pelos próprios seres humanos.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para o plural. A enumeração foi mantida em ritmo paralelo, e a metáfora final do hebraico foi preservada com uma breve explicação em nota.
