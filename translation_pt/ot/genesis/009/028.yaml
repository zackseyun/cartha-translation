  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: pt
  text: Depois do dilúvio, Noé viveu trezentos e cinquenta anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O wayyiqtol de חיה dá continuidade à narrativa e indica a duração da vida de Noé depois do dilúvio. “Viveu” é natural em português e não acrescenta a ênfase em sobrevivência que haveria em “sobreviveu”.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אַחַר
  choice: depois de
  rationale: Preposição temporal que indica o período subsequente; “depois de” é a formulação corrente e clara em português.
- source_word: הַמַּבּוּל
  choice: o dilúvio
  rationale: O substantivo definido remete ao dilúvio já narrado. “Dilúvio” é a designação consagrada, clara e natural em português bíblico contemporâneo.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: trezentos e cinquenta anos
  rationale: A soma hebraica é expressa de forma idiomática em português como um único numeral composto, sem repetir “anos”.
