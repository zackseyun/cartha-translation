base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: pt
  text: Os filhos de Noé que saíram da arca foram Sem, Cam e Jafé; e Cam era o pai de Canaã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: eram
  rationale: A forma narrativa de היה funciona aqui como cópula no passado, apresentando os nomes dos filhos; “eram” é natural e não sugere mudança de estado.
- source_word: בְנֵי נֹחַ
  choice: Os filhos de Noé
  rationale: Reproduz com clareza a cadeia construta hebraica e mantém a referência definida indicada pelo contexto.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: que saíram da arca
  rationale: O particípio com artigo tem função atributiva. Em português, a oração relativa no pretérito expressa naturalmente os que deixaram a arca.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Sem, Cam e Jafé
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: e Cam era o pai de Canaã
  rationale: Preserva a oração nominal e sua função de identificar Cam por sua relação com Canaã, preparando o episódio seguinte.
theological_decisions:
- issue: Nota genealógica sobre Cam e Canaã
  choice: Manter no texto principal a declaração explícita de que Cam era o pai de Canaã.
  alternative: Tratar a informação como simples aparte e reduzir sua ênfase estilística.
  rationale: O hebraico destaca expressamente essa relação genealógica como preparação narrativa para o que segue, sem autorizar a importação de conclusões étnicas ou teológicas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a ênfase narrativa do hebraico foram preservadas sem rigidez desnecessária.
