base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: pt
  text: 'E Deus disse a Noé: “Este é o sinal da aliança que estabeleci entre mim e toda carne[a] que está sobre a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seres vivos”. Em hebraico, “toda carne”, expressão ampla que, neste contexto, se refere à vida terrena animada.
    reason: Alternativa lexical que esclarece o alcance contextual da expressão hebraica sem substituí-la no texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva esse fluxo sem impor uma sequência mais específica.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, refere-se ao único Deus que fala com Noé; “Deus” é a forma portuguesa padrão.
- source_word: אֶל נֹחַ
  choice: a Noé
  rationale: A preposição indica o destinatário, e “Noé” é a forma tradicional e corrente do nome em português.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Este é o sinal da aliança
  rationale: A cópula está implícita no hebraico e é naturalmente expressa em português. “Sinal” e “aliança” preservam os termos centrais do contexto.
- source_word: הֲקִמֹתִי
  choice: estabeleci
  rationale: O hifil de קום com בְּרִית significa estabelecer ou confirmar uma aliança. O pretérito perfeito comunica uma ação concluída cujos efeitos permanecem no contexto.
- source_word: בֵּינִי וּבֵין
  choice: entre mim e
  rationale: Expressa diretamente a relação entre as partes da aliança e é idiomático em português.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: A tradução mantém a expressão hebraica ampla e concreta, sem restringi-la apenas à humanidade; uma nota esclarece seu alcance contextual.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: que está sobre a terra
  rationale: A oração relativa qualifica “toda carne”. “Sobre a terra” representa adequadamente עַל הָאָרֶץ no contexto universal.
theological_decisions:
- issue: Alcance de כָּל בָּשָׂר na aliança com Noé
  choice: toda carne
  alternative: todos os seres vivos; toda a humanidade
  rationale: Em Gênesis 9, a expressão abrange a vida terrena animada e não somente os seres humanos. “Toda carne” preserva essa amplitude e a tensão da formulação hebraica, enquanto a nota evita que a expressão seja entendida de modo indevidamente estreito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a concisão e a estrutura declarativa do hebraico, usando terminologia bíblica corrente sem arcaísmos desnecessários.
