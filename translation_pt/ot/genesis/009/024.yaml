base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: pt
  text: Quando Noé despertou do seu vinho, soube o que seu filho mais novo[a] lhe havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu filho mais jovem”. O adjetivo hebraico pode significar “pequeno”, “jovem”, “mais novo” ou “o mais novo”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: despertou
  rationale: O verbo יקץ significa despertar do sono. No contexto, Noé sai de um sono provocado pelo vinho; “despertou” preserva o sentido lexical sem interpretar como “ficou sóbrio”.
- source_word: מִיֵּינוֹ
  choice: do seu vinho
  rationale: Reproduz de perto a expressão hebraica, literalmente “do seu vinho”. Embora o contexto indique um torpor causado pelo vinho, evita-se substituí-la interpretativamente por “da embriaguez”.
- source_word: וַיֵּדַע
  choice: soube
  rationale: ידע pode significar “saber” ou, neste contexto narrativo, “ficar sabendo”. “Soube” expressa naturalmente em português a aquisição desse conhecimento após Noé despertar.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: o que ... lhe havia feito
  rationale: A oração mantém indeterminada a natureza do ato. O mais-que-perfeito composto esclarece que o ato ocorreu antes de Noé despertar e saber dele.
- source_word: בְּנוֹ הַקָּטָן
  choice: seu filho mais novo
  rationale: קָטָן pode significar pequeno, jovem, mais novo ou o mais novo, conforme o contexto. Na relação familiar, “filho mais novo” é natural em português e preserva melhor que “caçula” a possibilidade de leitura comparativa, explicitada na nota.
theological_decisions:
- issue: Natureza do ato praticado contra Noé
  choice: Manter a formulação genérica “o que ... lhe havia feito”.
  alternative: Especificar que se tratou de ver e relatar a nudez de Noé, ou de uma violação sexual mais grave.
  rationale: O versículo não define o ato. A tradução preserva essa ambiguidade e não introduz uma interpretação específica.
- issue: Sentido e referente de בְּנוֹ הַקָּטָן
  choice: Traduzir no texto como “seu filho mais novo”, com nota lexical.
  alternative: “seu filho mais jovem” ou “seu filho caçula”.
  rationale: A expressão hebraica identifica o filho por idade ou posição relativa, mas o adjetivo admite mais de uma nuance. A tradução não acrescenta uma identificação nominal nem resolve as questões interpretativas do contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. A expressão incomum “despertou do seu vinho” foi mantida por fidelidade à imagem hebraica; a nota foi colocada em “filho mais novo”, onde está a variação lexical real.
