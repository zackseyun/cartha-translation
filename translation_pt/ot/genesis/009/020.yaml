  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: pt
  text: Noé, homem da terra, começou[a] a plantar[b] uma vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «foi o primeiro a plantar». A construção hebraica é condensada, e alguns entendem «começou» no sentido de «foi o primeiro».'
    reason: alternative_reading
  - marker: b
    text: 'Uma tradução mais literal da sequência verbal seria: «começou e plantou uma vinha».'
    reason: source_structure
lexical_decisions:
- source_word: וַיָּחֶל
  choice: começou
  rationale: O hifil de חלל tem aqui, com maior naturalidade, o sentido de «começar». A construção é condensada, e seu sentido prossegue no verbo seguinte.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אִישׁ הָאֲדָמָה
  choice: homem da terra
  rationale: Preserva a expressão hebraica e sua ligação com o cultivo do solo, sem substituí-la diretamente pelo termo interpretativo «lavrador».
- source_word: וַיִּטַּע
  choice: a plantar
  rationale: נטע é o verbo comum para plantar. O infinitivo em português completa naturalmente «começou», embora o hebraico empregue outro verbo finito.
- source_word: כָּרֶם
  choice: uma vinha
  rationale: Equivalente corrente e preciso para uma área cultivada com videiras.
theological_decisions:
- issue: Como entender a sequência condensada וַיָּחֶל ... וַיִּטַּע
  choice: começou a plantar uma vinha
  alternative: foi o primeiro a plantar uma vinha; começou e plantou uma vinha
  rationale: A tradução escolhida comunica com naturalidade que o primeiro verbo modifica a ação seguinte, sem afirmar categoricamente que Noé foi a primeira pessoa da história a plantar uma vinha. As notas preservam as outras maneiras plausíveis de representar a construção hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Homem da terra» mantém a imagem agrícola e a formulação do hebraico; «começou a plantar» evita uma coordenação pouco natural em português.
