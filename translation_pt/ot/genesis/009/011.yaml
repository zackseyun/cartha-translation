  source_fidelity: 'A tradução reproduz com precisão a promessa dupla do hebraico: o estabelecimento da aliança, a abrangência de «toda carne», a destruição pelas águas do dilúvio e a ausência futura de dilúvio para destruir a terra. «Estabelecerei» preserva adequadamente a fórmula de aliança e sua nuance não totalmente especificada entre estabelecer e confirmar.'
