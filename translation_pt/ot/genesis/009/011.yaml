  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: pt
  text: 'Estabelecerei a minha aliança com vocês: nunca mais toda carne[a] será eliminada[b] pelas águas do dilúvio, e nunca mais haverá dilúvio para destruir a terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Toda carne” refere-se amplamente aos seres vivos, não apenas à humanidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “será cortada”; também se pode traduzir por “será exterminada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Estabelecerei
  rationale: O hifil de קום, em linguagem de aliança, pode indicar estabelecer ou confirmar. “Estabelecerei” mantém o tom solene e a ambiguidade quanto a instituição ou confirmação, além de corresponder ao contexto promissório.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: “Aliança” é o termo consagrado e coerente para בְּרִית em Gênesis, preservando sua importância literária e teológica.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Expressa naturalmente em português o destinatário plural da aliança.
- source_word: יִכָּרֵת
  choice: será eliminada
  rationale: O nifal de כרת significa literalmente “ser cortada”, mas, neste contexto de juízo pelo dilúvio, “ser eliminada” comunica de modo natural a destruição sem recorrer a uma formulação portuguesa obscura. A imagem literal é registrada em nota.
- source_word: כָּל־בָּשָׂר
  choice: toda carne
  rationale: Preserva a formulação abrangente do hebraico e evita restringi-la apenas à humanidade; uma nota esclarece que a expressão inclui os seres vivos em geral.
- source_word: עוֹד
  choice: nunca mais
  rationale: Sob a negação, o advérbio tem força idiomática de “nunca mais”, repetida nas duas promessas do versículo.
- source_word: מִמֵּי הַמַּבּוּל
  choice: pelas águas do dilúvio
  rationale: A preposição מן indica aqui o meio ou agente da destruição; “pelas águas” é claro e próximo da construção hebraica.
- source_word: מַבּוּל
  choice: dilúvio
  rationale: É a tradução tradicional e amplamente compreensível de מַבּוּל no relato de Noé.
- source_word: לְשַׁחֵת
  choice: para destruir
  rationale: Expressa diretamente a finalidade destrutiva indicada pelo infinitivo de שׁחת.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto universal do relato do dilúvio, “a terra” representa melhor o alcance da promessa do que uma referência localizada a “uma terra” ou “o território”.
theological_decisions:
- issue: Alcance de “toda carne” na promessa da aliança
  choice: Mantida a expressão abrangente “toda carne”, com esclarecimento de que inclui os seres vivos em geral.
  alternative: “toda a humanidade” ou “todos os seres vivos”
  rationale: O contexto posterior ao dilúvio inclui seres humanos e animais. A formulação escolhida preserva a amplitude e a expressão concreta do hebraico sem restringi-la nem explicá-la dentro do próprio texto.
- issue: Sentido de קום na fórmula da aliança
  choice: “Estabelecerei a minha aliança”
  alternative: “Confirmarei a minha aliança” ou “manterei a minha aliança”
  rationale: “Estabelecerei” preserva o registro da aliança e não decide de forma indevida se ela está sendo instituída pela primeira vez ou formalmente confirmada.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário acessível ao público brasileiro e compreensível internacionalmente. A estrutura paralela das duas promessas e a linguagem solene da aliança foram preservadas.
