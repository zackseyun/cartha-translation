  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: pt
  text: E quando eu trouxer nuvens sobre a terra, o arco[a] será visto na nuvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o arco-íris”. O hebraico usa a palavra comum para “arco”, referindo-se aqui ao arco-íris como sinal da aliança.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהָיָה
  choice: E, quando
  rationale: A construção introduz uma circunstância temporal futura; esta formulação é natural em português e mantém a ligação com o contexto anterior.
- source_word: בְּעַנְנִי עָנָן
  choice: eu trouxer nuvens
  rationale: O verbo denominativo no Piel expressa a ação divina de cobrir de nuvens ou fazer surgir nuvens. O plural português traduz naturalmente o substantivo singular hebraico usado em sentido coletivo.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Terra” corresponde ao alcance amplo da aliança após o dilúvio, e “sobre” expressa de modo natural a relação espacial.
- source_word: וְנִרְאֲתָה
  choice: será visto
  rationale: Preserva a forma passiva do Nifal de ראה e seu sentido futuro, sem excluir a ideia de aparecer ou tornar-se visível.
- source_word: הַקֶּשֶׁת
  choice: o arco
  rationale: O hebraico emprega a palavra comum para um arco. A tradução conserva essa imagem lexical, enquanto a nota esclarece que, neste contexto, se trata do arco-íris.
- source_word: בֶּעָנָן
  choice: na nuvem
  rationale: Mantém o substantivo singular e definido do hebraico, em contraste com o sentido coletivo de “nuvens” na oração anterior.
theological_decisions:
- issue: Sentido de קֶשֶׁת no sinal da aliança com Noé
  choice: o arco
  alternative: o arco-íris
  rationale: “O arco” preserva a imagem e a ambiguidade lexical genuína do hebraico, que usa o termo comum para a arma; a referência contextual ao arco-íris é explicitada em nota, sem substituir silenciosamente a expressão original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém o encadeamento narrativo, a voz passiva e a imagem hebraica do arco.
