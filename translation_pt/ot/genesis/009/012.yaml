  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: pt
  text: 'E Deus disse: “Este é o sinal da aliança que dou[a] entre mim, vocês e toda criatura viva que está com vocês, para todas as gerações futuras[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estou dando”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para gerações perpétuas”; também pode ser traduzido como “por todas as gerações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E Deus disse
  rationale: O waw consecutivo dá sequência à narrativa; “E ... disse” preserva essa progressão de modo natural em português.
- source_word: אוֹת הַבְּרִית
  choice: o sinal da aliança
  rationale: “Sinal” expressa uma marca perceptível, e “aliança” é o equivalente português consagrado e adequado para בְּרִית neste contexto.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que estabeleço
  rationale: O particípio נֹתֵן significa literalmente “dou” ou “estou dando”, mas, em português, “estabelecer uma aliança” comunica naturalmente a instituição aqui descrita sem alterar seu conteúdo. A nota preserva a forma mais literal.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: todo ser vivo
  rationale: A expressão abrange as criaturas vivas que estavam com Noé. “Ser vivo” evita restringir נֶפֶשׁ ao sentido teológico moderno de “alma”.
- source_word: לְדֹרֹת עוֹלָם
  choice: por todas as gerações
  rationale: A formulação portuguesa expressa a continuidade indefinida da aliança através das gerações e soa mais natural do que “por gerações perpétuas”.
theological_decisions:
- issue: Verbo נֹתֵן na fórmula da aliança
  choice: que estabeleço
  alternative: que dou / que estou dando
  rationale: A escolha segue o uso idiomático português para instituir uma aliança, enquanto a nota registra a expressão formal do hebraico. Não acrescenta uma modalidade teológica à ação divina.
- issue: Alcance de נֶפֶשׁ חַיָּה
  choice: todo ser vivo
  alternative: toda alma vivente / toda criatura viva
  rationale: No contexto da aliança após o dilúvio, a expressão inclui os animais; “ser vivo” mantém esse alcance amplo sem importar uma doutrina antropológica sobre a alma.
- issue: Duração expressa por לְדֹרֹת עוֹלָם
  choice: por todas as gerações
  alternative: por gerações perpétuas
  rationale: A tradução comunica a permanência através das sucessivas gerações sem decidir de forma mais estreita o alcance semântico contextual de עוֹלָם.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” é natural no português brasileiro e representa os destinatários plurais. A pontuação final com dois-pontos preserva a ligação com a explicação do sinal no versículo seguinte.
