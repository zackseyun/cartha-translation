id: GEN.9.21
reference: Genesis 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: pt
  text: Bebeu um pouco do vinho[a], ficou bêbado e se despiu dentro de sua tenda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bebeu do vinho”. A expressão hebraica é literalmente “do vinho” e provavelmente tem sentido partitivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficou descoberto” ou “jazeu descoberto dentro de sua tenda”. O verbo hebraico também pode ser entendido de modo mais estativo, embora a forma reflexiva favoreça “se despiu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Bebeu
  rationale: O qal wayyiqtol de שׁתה expressa a ação narrativa seguinte. Em português, o sujeito pode permanecer implícito porque o contexto identifica Noé, e não é necessário reproduzir mecanicamente o וַ inicial.
- source_word: מִן הַיַּיִן
  choice: um pouco do vinho
  rationale: A preposição מִן diante do substantivo definido tem aqui sentido partitivo. A formulação é natural em português e deixa claro que Noé bebeu parte do vinho.
- source_word: וַיִּשְׁכָּר
  choice: ficou bêbado
  rationale: O qal de שׁכר indica a entrada no estado de embriaguez. “Ficou bêbado” é corrente, claro e preserva esse valor ingressivo.
- source_word: וַיִּתְגַּל
  choice: se despiu
  rationale: 'O hitpael de גלה admite sentido reflexivo: Noé expôs a própria nudez. “Se despiu” comunica isso com naturalidade, sem acrescentar conotação sexual.'
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: dentro de sua tenda
  rationale: בְּתוֹךְ localiza a ação no interior da tenda. A expressão escolhida é moderna, clara e fiel.
theological_decisions:
- issue: Interpretação moral ou sexual da embriaguez e da exposição de Noé
  choice: Relatar de modo descritivo que Noé ficou bêbado e se despiu, sem comentário moral adicional.
  alternative: Traduzir “ficou nu”, “jazeu descoberto” ou “foi descoberto”.
  rationale: O hebraico narra a embriaguez e a exposição, mas não explicita neste versículo uma avaliação moral nem uma conotação sexual. A tradução mantém a tensão narrativa e permite que o contexto seguinte esclareça a relevância do ocorrido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal é concisa e narrativa; evita-se tanto o literalismo rígido quanto qualquer explicação moral ou sexual não expressa pelo hebraico.
