  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: pt
  text: Então Sem e Jafé pegaram a capa[a], colocaram-na sobre os ombros de ambos e caminharam de costas; assim cobriram a nudez de seu pai. Como estavam com o rosto voltado para trás, não viram a nudez de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a veste”. O termo hebraico indica uma peça exterior de roupa, usada aqui para cobrir Noé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegaram
  rationale: Embora o verbo esteja formalmente no singular, o sujeito composto e os verbos seguintes no plural indicam uma ação conjunta; o plural é natural em português.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem e Jafé
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: הַשִּׂמְלָה
  choice: a capa
  rationale: שִׂמְלָה designa uma peça exterior de roupa; “capa” comunica de modo concreto e natural o objeto usado para cobrir Noé, sem reduzi-lo a uma cobertura genérica.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: colocaram-na sobre os ombros de ambos
  rationale: Reproduz o sentido idiomático de que os dois sustentaram juntos a peça sobre os ombros, preservando a referência explícita a ambos.
- source_word: אֲחֹרַנִּית
  choice: de costas / voltado para trás
  rationale: A primeira ocorrência descreve o modo de caminhar; a segunda, a orientação do rosto. A variação em português mantém o sentido e evita uma formulação artificial.
- source_word: וַיְכַסּוּ
  choice: cobriram
  rationale: Equivalente direto e natural de כסה neste contexto.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: a nudez de seu pai
  rationale: Mantém a expressão concreta e respeitosa do hebraico, bem como sua dimensão de vergonha e exposição, sem acrescentar uma interpretação sexual específica.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: estavam com o rosto voltado para trás
  rationale: A oração hebraica não tem verbo expresso; esta formulação supre naturalmente a cópula e comunica que eles mantinham o rosto afastado do pai.
- source_word: לֹא רָאוּ
  choice: não viram
  rationale: Tradução simples do perfeito negado, sem introduzir a ideia adicional de contemplar intencionalmente.
theological_decisions:
- issue: Sentido de “a nudez de seu pai” neste versículo
  choice: A exposição corporal de Noé, que Sem e Jafé cobrem respeitosamente
  alternative: Uma referência eufemística a um ato sexual, à luz de usos posteriores da linguagem de nudez em Levítico
  rationale: 'A ação imediata é concreta: os filhos usam uma peça de roupa, caminham de costas e evitam ver o pai enquanto o cobrem. A tradução conserva literalmente “a nudez de seu pai”, sem impor no texto uma interpretação mais específica.'
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Caminharam de costas” é mais idiomático que “caminharam para trás” neste contexto, pois destaca que mantiveram o rosto afastado. A repetição de “a nudez de seu pai” foi preservada por corresponder à ênfase do hebraico.
