  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: pt
  text: 'E Deus abençoou Noé e seus filhos e lhes disse: “Sejam férteis, multipliquem-se e encham a terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra” no sentido de território ou região; aqui, porém, o contexto posterior ao dilúvio e o eco de Gênesis 1:28 favorecem o sentido global.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: O piel de ברך indica a concessão de uma bênção; “abençoou” é natural, preciso e preserva o peso do contexto pactual.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto narrativo, o termo se refere ao único Deus.
- source_word: נֹחַ
  choice: Noé
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica os filhos homens de Noé, e não usa um termo geral para descendentes ou crianças.
- source_word: וַיֹּאמֶר לָהֶם
  choice: e lhes disse
  rationale: Reproduz de modo claro e natural a fórmula narrativa hebraica, sem acrescentar força interpretativa.
- source_word: פְּרוּ
  choice: Sejam férteis
  rationale: Expressa o sentido reprodutivo do imperativo e preserva, em formulação digna e corrente, o eco de Gênesis 1:28.
- source_word: וּרְבוּ
  choice: multipliquem-se
  rationale: Traduz diretamente a ordem de aumentar em número e mantém a formulação tradicional da passagem.
- source_word: וּמִלְאוּ
  choice: encham
  rationale: O verbo significa “encher”; a escolha evita paráfrases como “povoem”, que tornariam explícita uma interpretação implícita.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “terra” no sentido de região ou território, o contexto posterior ao dilúvio e o eco de Gênesis 1:28 favorecem aqui a terra em sentido global.
theological_decisions:
- issue: Relação com o mandato da criação em Gênesis 1:28
  choice: Preservar a sequência “Sejam férteis, multipliquem-se e encham a terra”.
  alternative: Parafrasear como “Tenham muitos filhos e povoem a terra”.
  rationale: A repetição verbal hebraica estabelece continuidade deliberada entre a bênção da criação e a humanidade posterior ao dilúvio. A formulação escolhida conserva essa ligação sem explicá-la dentro do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Então” dá fluidez à sequência narrativa do wayyiqtol inicial. Mantém-se a coordenação concisa e solene do hebraico.
