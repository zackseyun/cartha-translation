id: GEN.9.27
reference: Genesis 9:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a slave to them.
translation:
  language: pt
  text: Que Deus dê espaço a Jafé, e que ele habite nas tendas de Sem[a]; e que Canaã seja escravo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que Deus habite nas tendas de Sem”; também é possível: “e que Jafé habite nas tendas de Sem”. O hebraico não expressa o sujeito de “habite”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: dê espaço
  rationale: O jussivo expressa a ideia de tornar espaçoso ou ampliar e forma um jogo sonoro com o nome Jafé. “Dê espaço” comunica essa ideia com naturalidade, embora o jogo de palavras hebraico não possa ser reproduzido plenamente em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, o contexto verbal é singular e designa o único Deus.
- source_word: לְיֶפֶת
  choice: a Jafé
  rationale: 'A preposição לְ é representada de modo natural como o beneficiário da ação: Deus dá espaço a Jafé.'
- source_word: וְיִשְׁכֹּן
  choice: e que ele habite
  rationale: O jussivo pede uma formulação volitiva. O pronome masculino singular preserva a ambiguidade do sujeito, que pode ser Deus ou Jafé.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: nas tendas de Sem
  rationale: Mantém a expressão locativa e a imagem concreta das tendas, sem generalizá-la como moradas.
- source_word: וִיהִי
  choice: e que ... seja
  rationale: A construção volitiva dá continuidade ao estilo de bênção e maldição do pronunciamento.
- source_word: כְנַעַן
  choice: Canaã
  rationale: Mantém a forma portuguesa tradicional do nome próprio, referente à pessoa e à sua descendência no pronunciamento de Noé.
- source_word: עֶבֶד
  choice: escravo
  rationale: A condição de sujeição é central neste contexto; “escravo” preserva a força social de עֶבֶד sem suavizá-la para “servo”.
- source_word: לָמוֹ
  choice: deles
  rationale: A forma pronominal é plural em seu uso aqui e é entendida naturalmente como referência conjunta a Sem e Jafé.
theological_decisions:
- issue: Identidade do sujeito de “que ele habite nas tendas de Sem”
  choice: O texto principal mantém “ele” sem identificar expressamente o sujeito.
  alternative: “Que Deus habite nas tendas de Sem” ou “que Jafé habite nas tendas de Sem”.
  rationale: O verbo hebraico masculino singular não traz sujeito expresso e, no contexto, permite que o referente seja Deus ou Jafé. A tradução preserva essa tensão genuína, e a nota registra as duas leituras principais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Dê espaço a Jafé” é mais idiomático do que “alargue Jafé” e conserva a noção de expansão. O pronome “ele” e a nota mantêm a ambiguidade sintática e teológica do hebraico.
