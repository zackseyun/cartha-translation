  verdict: revise
  source_fidelity: A tradução preserva bem a ênfase de וְאַךְ, a repetição judicial de דרשׁ, o contraste entre animal e ser humano e o sentido concreto de נֶפֶשׁ como “vida”. Contudo, “cada um, seu irmão” não representa de modo claro nem natural a construção hebraica אִישׁ אָחִיו e torna obscura a relação de responsabilidade humana expressa na cláusula.
  naturalness: O registro é moderno e adequadamente solene. “Da mão de todo animal o requererei” é aceitável, embora “exigirei isso” soe um pouco mais natural. O principal problema de fluência e inteligibilidade é “da mão de cada um, seu irmão”, uma aposição não idiomática em português.
  terminology: “Sangue”, “requererei”, “animal”, “ser humano” e “vida” são escolhas consistentes e adequadas. “Irmão” deve ser conservado, pois o hebraico usa linguagem de parentesco; a formulação deve, porém, comunicar que se trata da responsabilidade de uma pessoa pela vida de outra.
  issues:
