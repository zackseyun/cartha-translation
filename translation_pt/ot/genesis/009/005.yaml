  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: pt
  text: E certamente requererei o sangue de vocês por suas vidas.[a] Da mão de todo animal exigirei isso;[b] e da mão do ser humano — de cada pessoa por seu irmão[c] — requererei a vida do ser humano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sangue de vocês, isto é, a vida de vocês” ou “o sangue vital de vocês”. O hebraico coloca “sangue” em relação direta com “vidas” e permite mais de uma forma de expressar essa relação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedirei contas dele”. O verbo repetido tem sentido judicial: exigir prestação de contas pelo sangue derramado.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “da mão de um homem, seu irmão”. A expressão ressalta a responsabilidade de cada ser humano pela vida de outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: E certamente
  rationale: Preserva a conjunção וְ e a força enfática de אַךְ, sem recorrer a uma formulação arcaica.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: o sangue de vocês por suas vidas
  rationale: Mantém distintos os termos hebraicos para “sangue” e “vida” e conserva a relação deliberadamente compacta expressa por לְ, deixando a ambiguidade legítima indicada em nota.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: requererei / o requererei
  rationale: O verbo דרשׁ tem aqui sentido judicial de exigir algo ou pedir contas. “Requerer” conserva o tom jurídico e permite reproduzir a repetição do hebraico.
- source_word: מִיַּד
  choice: da mão de
  rationale: Conserva o idioma hebraico repetido, que expressa agência e responsabilidade.
- source_word: כָּל חַיָּה
  choice: todo animal
  rationale: No contraste com o ser humano, חַיָּה designa aqui os animais. “Animal” é atual, claro e suficientemente amplo.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Neste contexto, אָדָם é genérico e contrasta a humanidade com os animais; “ser humano” comunica isso sem sugerir exclusivamente o sexo masculino.
- source_word: אִישׁ אָחִיו
  choice: cada um, seu irmão
  rationale: Preserva tanto a força distributiva de אִישׁ como a linguagem de parentesco de אָחִיו, sem substituí-la pela interpretação mais ampla “seu semelhante”.
- source_word: נֶפֶשׁ הָאָדָם
  choice: a vida do ser humano
  rationale: נֶפֶשׁ, em paralelo com sangue e no contexto de homicídio, significa a vida concreta, não necessariamente uma alma imaterial.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de derramamento de sangue
  choice: vida
  alternative: alma
  rationale: O contexto imediato relaciona sangue e vida e trata da responsabilidade por tirar uma vida humana. “Alma” poderia introduzir uma afirmação antropológica que não está em primeiro plano.
- issue: Alcance de הָאָדָם
  choice: o ser humano
  alternative: o homem
  rationale: As duas ocorrências são representativas da humanidade e se contrapõem a “todo animal”. A formulação escolhida preserva o sentido genérico.
- issue: Responsabilidade expressa por אִישׁ אָחִיו
  choice: cada um, seu irmão
  alternative: cada pessoa, seu semelhante
  rationale: A tradução mantém a imagem de fraternidade do texto sem restringi-la a irmãos biológicos nem dissolvê-la silenciosamente em uma paráfrase.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A repetição de “requererei” e “da mão de” foi mantida para reproduzir o ritmo jurídico e a estrutura do hebraico. Empregou-se “vocês” por ser amplamente compreensível no português internacional e natural no Brasil.
