revisions:
- from: E certamente requererei o sangue de vocês por suas vidas.[a] Da mão de todo animal o requererei;[b] e da mão do ser humano — da mão de cada um, seu irmão[c] — requererei a vida do ser humano.
  to: E certamente requererei o sangue de vocês por suas vidas.[a] Da mão de todo animal exigirei isso;[b] e da mão do ser humano — de cada pessoa por seu irmão[c] — requererei a vida do ser humano.
  rationale: A revisão substitui somente a aposição obscura “cada um, seu irmão” por “de cada pessoa por seu irmão”. Isso conserva a linguagem fraterna do hebraico e torna explícita, em português corrente, a relação de responsabilização que o contexto de sangue derramado requer. “Exigirei isso” retoma naturalmente “o sangue” e preserva a repetição do verbo hebraico.
