base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: pt
  text: Quem derramar o sangue de um ser humano, por um ser humano seu sangue será derramado[a], pois Deus fez o ser humano à sua imagem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «pelo ser humano seu sangue será derramado». O hebraico repete o mesmo termo, adam, para a vítima, o agente humano e a humanidade feita à imagem de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «pois à imagem de Deus ele fez o ser humano».'
    reason: literal_rendering
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Quem derramar
  rationale: O particípio qal tem sentido genérico e proverbial. “Quem derramar” expressa com naturalidade a formulação jurídica sem restringi-la a uma pessoa específica.
- source_word: דַּם הָאָדָם
  choice: o sangue de um ser humano
  rationale: “Sangue” designa aqui a vida tirada mediante violência. “Um ser humano” comunica o sentido genérico de אָדָם em português atual.
- source_word: בָּאָדָם
  choice: por outro ser humano
  rationale: A preposição בְּ é entendida em sentido instrumental ou agentivo. “Outro” torna clara em português a distinção entre o homicida e o agente humano que executa a sentença, sem mudar o referente genérico de אָדָם.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: terá o seu sangue derramado
  rationale: Mantém a voz passiva, a correspondência entre o sangue derramado e o sangue do homicida e o tom solene da declaração. A forma futura evita impor ao imperfeito hebraico uma modalidade mais específica do que o texto exige.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a declaração anterior, em registro digno e corrente.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: à sua imagem
  rationale: Com Deus como sujeito explícito da oração, “à sua imagem” é natural em português e conserva integralmente a afirmação de que o ser humano foi feito à imagem de Deus.
- source_word: עָשָׂה אֶת־הָאָדָם
  choice: Deus fez o ser humano
  rationale: עָשָׂה significa aqui “fez”, sem substituir o verbo pelo mais específico “criou”. “O ser humano” representa a humanidade em sentido genérico.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: ser humano
  alternative: homem
  rationale: Neste contexto, אָדָם se refere a qualquer integrante da humanidade, não somente ao sexo masculino. “Ser humano” comunica essa abrangência e permite preservar a repetição retórica do termo ao longo do versículo.
- issue: Agente do derramamento do sangue do homicida
  choice: por outro ser humano
  alternative: entre os seres humanos
  rationale: A leitura instrumental ou agentiva de בָּאָדָם é a mais natural no paralelismo jurídico. A tradução não desenvolve uma doutrina completa da pena capital nem identifica a instituição responsável; limita-se a expressar a agência humana indicada pela construção.
- issue: Formulação da imagem de Deus
  choice: Deus fez o ser humano à sua imagem
  alternative: à imagem de Deus ele fez o ser humano
  rationale: A ordem adotada é mais natural em português, enquanto a nota registra a ordem mais próxima do hebraico. Ambas preservam a dignidade singular da vida humana como fundamento da declaração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “ser humano” preserva tanto quanto possível o vínculo retórico entre as três ocorrências de אָדָם, enquanto a ordem das palavras foi ajustada para soar natural.
