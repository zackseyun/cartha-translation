  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: pt
  text: Estes três eram os filhos de Noé, e a partir deles toda a terra foi povoada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e deles toda a terra foi dispersa” ou “se espalhou”; isto é, seus habitantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Estes três
  rationale: A expressão nominal, colocada em destaque no hebraico, identifica enfaticamente os três filhos mencionados. “Estes três” é natural em português e preserva o demonstrativo.
- source_word: בְּנֵי נֹחַ
  choice: eram os filhos de Noé
  rationale: O hebraico não traz verbo expresso; “eram” completa a frase de modo natural no contexto narrativo.
- source_word: וּמֵאֵלֶּה
  choice: e a partir deles
  rationale: A preposição מִן indica origem ou procedência. “A partir deles” liga claramente a população posterior da terra aos três filhos de Noé.
- source_word: נָפְצָה
  choice: foi povoada
  rationale: Embora o núcleo lexical do verbo envolva dispersar ou espalhar, neste resumo genealógico ele descreve a propagação da humanidade oriunda dos filhos de Noé. A formulação contextual fica no texto, e a expressão mais literal é preservada em nota.
- source_word: כָל הָאָרֶץ
  choice: toda a terra
  rationale: No contexto universal posterior ao dilúvio, אֶרֶץ se refere mais provavelmente à terra ou ao mundo habitado, não apenas a uma região específica.
theological_decisions:
- issue: Alcance de הָאָרֶץ no contexto posterior ao dilúvio
  choice: toda a terra
  alternative: toda a região
  rationale: O versículo resume a expansão da humanidade proveniente dos filhos de Noé; por isso, o sentido universal é contextualmente mais provável, sem transformar a opção lexical em afirmação denominacional.
- issue: Sentido contextual de נָפְצָה
  choice: foi povoada
  alternative: se espalhou / foi dispersa
  rationale: “Foi povoada” comunica o resultado genealógico no contexto, enquanto a nota conserva o sentido lexical mais formal e a ambiguidade entre dispersão e propagação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução principal privilegia clareza contextual, enquanto a nota preserva o valor lexical mais literal do verbo hebraico.
