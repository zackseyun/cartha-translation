  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: pt
  text: 'Então Deus disse a Noé e aos filhos dele, que estavam com ele:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então ... disse” expressa naturalmente em português a sequência dos acontecimentos.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o termo designa o único Deus que fala com Noé.
- source_word: אֶל נֹחַ
  choice: a Noé
  rationale: A preposição introduz o destinatário da fala; “disse a Noé” é a construção portuguesa natural.
- source_word: וְאֶל בָּנָיו
  choice: e aos filhos dele
  rationale: O hebraico coordena outro grupo de destinatários e especifica os filhos homens de Noé. “Dele” evita a possível ambiguidade de “seus” em português.
- source_word: אִתּוֹ
  choice: que estavam com ele
  rationale: A oração relativa torna claro, em português corrente, que a expressão modifica os filhos de Noé.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o discurso direto que vem a seguir; os dois-pontos cumprem essa função de modo idiomático em português, sem o artificial “dizendo”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva todos os participantes e a progressão narrativa, enquanto usa pontuação portuguesa natural para introduzir a fala subsequente.
