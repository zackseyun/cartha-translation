base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: pt
  text: 'e com todo ser vivo[a] que está com vocês: as aves, os animais domésticos e todos os animais selvagens da terra que estão com vocês — de tudo o que saiu da arca, para todos os animais selvagens da terra.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “toda criatura vivente”. Mais literalmente, a expressão hebraica é “toda alma vivente”.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é difícil em hebraico. Mais formalmente: “de tudo o que saiu da arca, para todos os animais selvagens da terra”. Também pode ser entendida como uma retomada explicativa ou enfática: “de tudo o que saiu da arca, isto é, todos os animais selvagens da terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: ser vivo
  rationale: A expressão designa aqui a vida animada, especialmente os animais. “Ser vivo” é natural em português e preserva a amplitude do hebraico sem sugerir que נֶפֶשׁ signifique apenas uma alma imaterial.
- source_word: בָּעוֹף
  choice: as aves
  rationale: עוֹף pode abranger criaturas voadoras, mas “aves” é a designação corrente e adequada nesta enumeração.
- source_word: בַּבְּהֵמָה
  choice: os animais domésticos
  rationale: Neste contraste com as aves e os animais selvagens, בְּהֵמָה indica sobretudo animais terrestres domesticados. A formulação evita restringir o termo ao gado bovino.
- source_word: חַיַּת הָאָרֶץ
  choice: animal selvagem da terra
  rationale: A expressão distingue os animais terrestres selvagens dos animais domésticos mencionados antes. “Animal selvagem” comunica essa categoria com mais clareza do que “fera”.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה לְכֹל חַיַּת הָאָרֶץ
  choice: desde todos os que saíram da arca até todo animal selvagem da terra
  rationale: A tradução conserva de maneira relativamente formal a sequência hebraica מִן...לְ (“desde/de... até/para”), sem ocultar a construção final comprimida e difícil.
theological_decisions:
- issue: Alcance e sintaxe dos animais incluídos na aliança
  choice: Manter a abrangência explícita — aves, animais domésticos e selvagens — e representar formalmente a difícil sequência final “desde... até”.
  alternative: 'Entender a frase final como retomada explicativa ou enfática: “todos os que saíram da arca, sim, todos os animais selvagens da terra”.'
  rationale: O hebraico é repetitivo e sintaticamente comprimido. A opção adotada evita decidir silenciosamente se a última expressão é appositiva, enfática ou o segundo termo de uma construção abrangente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por “vocês” e por categorias zoológicas claras. A leve estranheza de “desde... até” foi mantida deliberadamente para não resolver uma dificuldade real do texto hebraico.
