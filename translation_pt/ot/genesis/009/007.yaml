base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: pt
  text: Quanto a vocês, sejam fecundos e multipliquem-se; pululem[a] na terra e multipliquem-se nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “proliferem na terra”. O verbo hebraico descreve uma multiplicação abundante, com a imagem de seres que pululam em grande número.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Quanto a vocês
  rationale: A conjunção seguida do pronome independente marca ênfase e retomada contrastiva; “Quanto a vocês” comunica isso com naturalidade.
- source_word: פְּרוּ
  choice: sejam fecundos
  rationale: Preserva a expressão tradicional de fecundidade humana no par com רבה, sem reduzi-la à ideia genérica de aumento.
- source_word: וּרְבוּ
  choice: multipliquem-se
  rationale: Expressa diretamente o aumento numérico e mantém a conhecida linguagem da bênção e ordem da criação.
- source_word: שִׁרְצוּ
  choice: proliferem
  rationale: Comunica reprodução abundante e numerosa de modo natural em português, preservando a força do verbo hebraico sem aplicar literalmente a seres humanos uma imagem que poderia soar apenas zoológica.
- source_word: בָאָרֶץ
  choice: na terra
  rationale: Apresenta a terra como o âmbito da proliferação humana depois do dilúvio, sem restringir o sentido a uma região local.
- source_word: וּרְבוּ בָהּ
  choice: e multipliquem-se nela
  rationale: Mantém a repetição enfática de רבה e deixa claro que o sufixo feminino retoma “terra”.
theological_decisions:
- issue: Relação do versículo com o mandato da criação e a bênção posterior ao dilúvio
  choice: Traduzir como ordem e bênção divina renovada, sem explicação teológica adicional no corpo do texto.
  alternative: Apresentá-lo apenas como repetição de Gênesis 1:28 ou ampliar o texto com terminologia doutrinária sobre a aliança.
  rationale: A formulação hebraica ecoa Gênesis 1:28, mas a tradução deve conservar essa ressonância sem decidir além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para clareza contemporânea. “Proliferem” preserva a intensidade de שׁרץ, enquanto a nota registra sua imagem mais concreta.
