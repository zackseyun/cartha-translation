  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: pt
  text: Cam, pai de Canaã, viu a nudez de seu pai[a] e contou isso aos seus dois irmãos, lá fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica, literalmente “a nudez de seu pai”, pode funcionar como eufemismo sexual em alguns contextos do Antigo Testamento. Aqui, a tradução mantém a formulação literal e deixa em aberto essa questão interpretativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O verbo ראה, nesta forma narrativa, significa de modo direto “viu”; opções mais fortes, como “ficou olhando”, acrescentariam uma intenção não expressa pelo verbo.
- source_word: חָם
  choice: Cam
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲבִי כְנַעַן
  choice: pai de Canaã
  rationale: A cadeia construta identifica Cam, em aposição, como pai de Canaã; a formulação é literal e natural em português.
- source_word: עֶרְוַת אָבִיו
  choice: a nudez de seu pai
  rationale: Mantém de perto a expressão hebraica sem especificar um ato sexual além do que o versículo declara.
- source_word: וַיַּגֵּד
  choice: contou isso
  rationale: O hifil de נגד significa “contar, comunicar, relatar”. O pronome “isso” torna natural em português a referência ao que Cam acabara de ver, sem acrescentar conteúdo.
- source_word: לִשְׁנֵי אֶחָיו
  choice: aos seus dois irmãos
  rationale: Preserva explicitamente o numeral “dois” e a relação familiar.
- source_word: בַּחוּץ
  choice: lá fora
  rationale: Expressa de modo idiomático a localização exterior, em contraste provável com o interior da tenda, sem determinar além do necessário se a expressão modifica principalmente o ato de contar ou a localização dos irmãos.
theological_decisions:
- issue: Sentido de “a nudez de seu pai” nesta narrativa
  choice: Preservar literalmente “a nudez de seu pai”, sem afirmar um ato sexual além de Cam ter visto Noé exposto.
  alternative: Entender a expressão como eufemismo para uma transgressão sexual mais grave, inclusive uma possível relação incestuosa sugerida por usos legais posteriores.
  rationale: Embora a expressão possa ter conotações sexuais mais amplas em outros contextos do Antigo Testamento, este versículo afirma que Cam “viu” e depois contou aos irmãos, e o contexto imediato trata do estado descoberto de Noé. A tradução mantém aberta a questão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Lá fora” preserva a concisão narrativa e evita tornar excessivamente explícita a ligação sintática do termo final hebraico.
