  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: pt
  text: Quanto a mim, eis que estabeleço a minha aliança com vocês e com a descendência[a] de vocês, que vier depois de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente”. O termo hebraico é um substantivo coletivo que pode se referir à prole ou aos descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: O pronome independente, ligado pela conjunção, é enfático e marca uma mudança de foco. “Quanto a mim” preserva essa ênfase de modo natural em português.
- source_word: הִנְנִי
  choice: eis que
  rationale: A expressão chama solenemente a atenção para a declaração divina. “Eis que” mantém o tom elevado sem introduzir a ideia distinta de apresentação pessoal contida em “aqui estou”.
- source_word: מֵקִים
  choice: estabeleço
  rationale: O particípio hifil de קום descreve Deus pondo em vigor ou instituindo a aliança. O presente “estabeleço” expressa bem o valor performativo no português natural.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: “Aliança” é o equivalente bíblico corrente de בְּרִית neste contexto de relação formal entre Deus e seres humanos, sem a limitação secular de “pacto” ou “tratado”.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: A preposição indica diretamente aqueles com quem a aliança é estabelecida. “Vocês” comunica de forma clara o plural hebraico e tem ampla legibilidade brasileira.
- source_word: וְאֶת זַרְעֲכֶם
  choice: e com a descendência de vocês
  rationale: זֶרַע é um substantivo coletivo que pode designar semente, prole ou descendentes. “Descendência” preserva o sentido coletivo e é corrente em português; a repetição de “com” torna explícito o paralelismo.
- source_word: אַחֲרֵיכֶם
  choice: depois de vocês
  rationale: A expressão aponta para as gerações subsequentes. A tradução literal e concisa preserva essa relação temporal sem expansão interpretativa.
theological_decisions:
- issue: Terminologia da aliança no contexto da relação entre Deus e a humanidade
  choice: a minha aliança
  alternative: o meu pacto; o meu tratado
  rationale: “Aliança” conserva a categoria bíblico-teológica de בְּרִית sem acrescentar detalhes doutrinários nem reduzir o vínculo a um acordo político ou secular.
- issue: Alcance coletivo de זֶרַע
  choice: a descendência de vocês
  alternative: a semente de vocês; os descendentes de vocês
  rationale: “Descendência” mantém o caráter coletivo do termo e não determina além do hebraico se a referência deve ser entendida como um conjunto ou como seus membros individualmente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Eis que” preserva a solenidade do enunciado; “vocês” representa claramente a segunda pessoa do plural. O marcador da nota foi colocado após “descendência de vocês”, termo ao qual a alternativa lexical se refere.
