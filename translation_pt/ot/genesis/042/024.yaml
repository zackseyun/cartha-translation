base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: pt
  text: Ele se afastou deles e chorou. Depois voltou para junto deles e falou com eles. Então tirou Simeão do meio deles e o amarrou à vista deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Ele se afastou deles
  rationale: O verbo indica que ele se virou ou se retirou da presença deles. “Afastou-se deles” expressa naturalmente o movimento e evita afirmar além do texto quanto à distância.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: בכה denota chorar; esta é a forma corrente e precisa em narrativa portuguesa.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: voltou para junto deles
  rationale: שוב indica retorno, e אֲלֵהֶם marca o retorno em direção a eles. A expressão portuguesa torna explícita essa retomada da presença sem acrescentar interpretação.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: falou com eles
  rationale: Tradução direta e idiomática do ato de falar dirigido a eles.
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: tirou Simeão do meio deles
  rationale: מֵאִתָּם apresenta Simeão como retirado dentre o grupo. “Tirou ... do meio deles” comunica essa seleção com naturalidade.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: o amarrou
  rationale: אסר descreve concretamente prender ou atar. “Amarrou” preserva a ação visível sem ampliá-la para a ideia mais interpretativa de encarceramento.
- source_word: לְעֵינֵיהֶם
  choice: à vista deles
  rationale: A expressão significa literalmente “aos olhos deles” e, idiomaticamente, indica que a ação ocorreu onde eles podiam vê-la.
