  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: pt
  text: 'Mas ele disse: “Meu filho não descerá com vocês, pois o irmão dele está morto, e só ele restou. Se alguma desgraça lhe acontecer no caminho que vocês percorrerem, vocês farão meus cabelos brancos descerem com tristeza ao Sheol[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol é o termo hebraico para o mundo dos mortos; outra tradução possível é “a sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: não descerá
  rationale: Mantém o sentido literal de ירד e a linguagem geográfica recorrente em Gênesis para a viagem de Canaã ao Egito.
- source_word: בְּנִי
  choice: meu filho
  rationale: Reproduz diretamente o substantivo בן com o sufixo de primeira pessoa.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: só ele restou
  rationale: Preserva a ênfase de לְבַדּוֹ e expressa naturalmente que, na perspectiva de Jacó, Benjamim é o único filho de Raquel ainda vivo.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: se alguma desgraça lhe acontecer
  rationale: O encadeamento tem força condicional no contexto; 'desgraça' comunica uma ocorrência grave sem especificar indevidamente sua natureza.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: no caminho que vocês percorrerem
  rationale: Conserva a imagem concreta de דרך e verte de modo natural a construção relativa com o verbo 'ir'.
- source_word: וְהוֹרַדְתֶּם
  choice: vocês farão ... descerem
  rationale: Expressa o hifil causativo de ירד e mantém a ligação verbal com 'descerá' no início do versículo.
- source_word: שֵׂיבָתִי
  choice: meus cabelos brancos
  rationale: Preserva a imagem concreta do hebraico, que representa por extensão a velhice de Jacó.
- source_word: בְּיָגוֹן
  choice: com tristeza
  rationale: Comunica o estado de pesar expresso por יָגוֹן em português corrente e digno.
- source_word: שְׁאֹלָה
  choice: ao Sheol
  rationale: Mantém o termo hebraico e evita reduzi-lo exclusivamente à sepultura física ou defini-lo além do que o contexto exige.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: ao Sheol
  alternative: à sepultura; ao mundo dos mortos
  rationale: Sheol pode designar o domínio dos mortos e não coincide necessariamente, em todos os contextos, com uma sepultura física. A transliteração preserva a amplitude e a tensão do termo hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega 'vocês' para o plural e preserva a imagem reiterada de descer, os cabelos brancos e o termo Sheol. O único marcador, [a], aparece imediatamente após 'Sheol'.
