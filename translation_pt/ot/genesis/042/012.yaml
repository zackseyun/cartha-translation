  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Não, mas vocês vieram para ver[b] a nudez da terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as partes expostas ou indefesas da terra”. O hebraico diz literalmente “a nudez da terra”, metáfora para áreas vulneráveis que invasores ou espiões poderiam explorar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “espionar”. O verbo hebraico significa literalmente “ver”, mas, no contexto, José os acusa de fazer reconhecimento do território.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Mas ele lhes disse
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “Mas” expressa naturalmente o contraste com a negação dos irmãos no versículo anterior. “Lhes disse” traduz de modo claro e corrente o destinatário da fala.
- source_word: לֹא כִּי
  choice: Não! ... sim
  rationale: לֹא rejeita de forma enfática a alegação anterior, e כִּי introduz a acusação corretiva. A construção portuguesa “Não! ... sim” preserva esse contraste com naturalidade, sem impor uma relação causal que o contexto não exige.
- source_word: עֶרְוַת הָאָרֶץ
  choice: a nudez da terra
  rationale: Mantém a imagem literal e marcante do hebraico, na qual “nudez” funciona metaforicamente para as áreas expostas ou vulneráveis do território.
- source_word: בָּאתֶם
  choice: Vocês vieram
  rationale: O perfeito hebraico descreve a chegada já realizada. O pretérito perfeito é idiomático em português e mantém a acusação ligada ao propósito da vinda.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: O infinitivo de ראה significa literalmente “ver”. Embora o contexto seja de espionagem e reconhecimento, conservar o verbo básico evita substituir a formulação do texto por sua interpretação contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça junto da expressão que explica. A construção enfática “vieram, sim” reproduz a correção acusatória sem perder a naturalidade.
