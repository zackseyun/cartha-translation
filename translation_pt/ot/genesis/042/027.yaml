  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: pt
  text: Então um deles abriu o seu saco para dar ração ao seu jumento no local de pernoite. Ele viu a sua prata[a] — e eis que ela estava na abertura da sua bolsa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “prata” refere-se ao dinheiro que ele havia pago.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “na boca da sua bolsa”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: abriu
  rationale: Traduz diretamente o verbo פתח e se ajusta naturalmente à abertura de um saco.
- source_word: הָאֶחָד
  choice: um deles
  rationale: Embora a expressão seja literalmente “o um”, o contexto indica um dos irmãos; “um deles” explicita o referente sem acrescentar informação nova.
- source_word: שַׂקּוֹ
  choice: o seu saco
  rationale: שַׂק designa um saco de transporte. “Saco” também permite distingui-lo do termo אַמְתַּחַת usado no fim do versículo.
- source_word: לָתֵת מִסְפּוֹא
  choice: para dar ração
  rationale: מִסְפּוֹא é alimento para animais; “ração” é corrente, clara e adequada ao contexto.
- source_word: לַחֲמֹרוֹ
  choice: ao seu jumento
  rationale: O objeto indireto é expresso naturalmente em português com “dar ração ao seu jumento”.
- source_word: בַּמָּלוֹן
  choice: no local de pernoite
  rationale: מָלוֹן indica um lugar de alojamento ou parada noturna. A tradução evita sugerir necessariamente uma hospedaria comercial.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: Ele viu a sua prata
  rationale: כֶּסֶף significa literalmente “prata” e, neste contexto, refere-se ao dinheiro usado no pagamento. Mantém-se a imagem concreta hebraica, esclarecida em nota.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a força discursiva de surpresa e descoberta marcada por הִנֵּה.
- source_word: בְּפִי
  choice: na abertura da
  rationale: A expressão hebraica diz literalmente “na boca de”; “na abertura” comunica em português atual o sentido idiomático aplicado a um recipiente, enquanto a nota preserva a imagem original.
- source_word: אַמְתַּחְתּוֹ
  choice: sua bolsa
  rationale: Emprega-se “bolsa” para representar um termo de recipiente diferente de שַׂק e conservar a distinção lexical do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Local de pernoite” evita a implicação indevida de uma hospedaria comercial; “saco” e “bolsa” preservam os dois termos hebraicos distintos. A construção “e eis que” mantém a surpresa narrativa do original.
