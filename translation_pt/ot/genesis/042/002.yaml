base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: pt
  text: 'Ele disse: “Vejam, ouvi dizer que há cereal no Egito. Desçam até lá e comprem para nós cereal de lá, para que vivamos e não morramos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Partícula discursiva que chama a atenção para a informação seguinte; o plural concorda naturalmente com os filhos a quem Jacó se dirige.
- source_word: שָׁמַעְתִּי
  choice: ouvi dizer
  rationale: Expressa informação recebida e ainda relevante; esta locução é natural em português e explicita que se trata de uma notícia.
- source_word: שֶׁבֶר
  choice: cereal
  rationale: No contexto da fome e da compra no Egito, designa cereal disponível para aquisição, e não alimento em sentido genérico.
- source_word: רְדוּ
  choice: Desçam
  rationale: Preserva o sentido direcional de descer de Canaã ao Egito.
- source_word: שָׁמָּה
  choice: até lá
  rationale: Representa de modo idiomático o advérbio direcional hebraico.
- source_word: וְשִׁבְרוּ
  choice: comprem
  rationale: Neste contexto, o verbo tem o sentido comercial específico de comprar cereal; o objeto fica naturalmente subentendido após sua menção anterior.
- source_word: לָנוּ
  choice: para nós
  rationale: Mantém o dativo de benefício e inclui Jacó e sua família entre os beneficiários.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Preserva a preposição explícita מִן, indicando a procedência do cereal.
- source_word: וְנִחְיֶה
  choice: para que vivamos
  rationale: Traduz a força de propósito ou resultado desejado da forma verbal no contexto.
- source_word: וְלֹא נָמוּת
  choice: e não morramos
  rationale: Conserva o paralelismo urgente entre viver e não morrer.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Cereal” evita a ambiguidade regional de “grão” e a amplitude excessiva de “comida”. A repetição espacial “até lá... de lá” foi mantida porque corresponde a dois elementos distintos e explícitos do hebraico.
