  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: pt
  text: 'E eles disseram: “Nós, seus servos, somos doze irmãos, filhos de um só homem na terra de Canaã. Eis que o mais novo está hoje com nosso pai, e um deles já não está[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um não está”. É uma expressão eufemística que pode significar que ele está ausente ou sugerir que morreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém a progressão narrativa do wayyiqtol sem impor uma sequência temporal mais específica.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Expressa a autodepreciação respeitosa diante do governante egípcio, sem sugerir que os irmãos fossem literalmente escravizados.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: somos doze irmãos
  rationale: Reproduz de modo natural a identificação e o número dos irmãos.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: filhos de um só homem
  rationale: Preserva a linguagem masculina específica e enfatiza que todos têm o mesmo pai.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Conserva o substantivo explícito 'terra' do hebraico.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a força apresentativa do marcador hebraico em registro digno e reconhecível.
- source_word: הַקָּטֹן
  choice: o mais novo
  rationale: No contexto familiar, designa o irmão caçula, não simplesmente alguém pequeno.
- source_word: אֶת אָבִינוּ
  choice: está ... com nosso pai
  rationale: Aqui אֶת indica companhia; a construção portuguesa comunica isso naturalmente.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Traduz diretamente o advérbio temporal, sem reduzi-lo a um vago 'agora'.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: e um deles já não está
  rationale: Preserva a formulação eufemística e a ambiguidade entre ausência e morte, evitando explicitar mais do que o hebraico.
theological_decisions:
- issue: Linguagem de parentesco marcada por gênero
  choice: filhos de um só homem
  alternative: filhos de um mesmo pai; descendentes de um só homem
  rationale: O hebraico é especificamente masculino e, nesta narrativa, refere-se aos filhos homens de Jacó.
- issue: Ambiguidade quanto à situação de José
  choice: um deles já não está
  alternative: um deles já não existe; um deles morreu
  rationale: A fala dos irmãos é eufemística e não declara diretamente a morte; a tradução mantém a tensão entre ausência e morte presumida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega 'seus servos' como fórmula respeitosa natural e conserva 'Eis que' para representar a força discursiva de וְהִנֵּה.
