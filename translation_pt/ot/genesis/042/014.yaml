  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵ/כֶ֛ם לֵ/אמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: pt
  text: 'José lhes disse: “É como eu disse a vocês: ‘Vocês são espiões.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר; em português, o pretérito perfeito expressa naturalmente a sequência, sem necessidade de verter mecanicamente o וַ־ como “e”.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: 'Representa de modo natural a preposição com o sufixo pronominal plural: José dirige a fala a eles.'
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הוּא אֲשֶׁר
  choice: É como
  rationale: Reproduz a reafirmação enfática da declaração anterior sem a rigidez do literal “é aquilo que”.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: eu disse a vocês
  rationale: Embora דבר signifique literalmente “falar”, diante de conteúdo citado “dizer a vocês” é idiomático e mantém explícitos o falante e os destinatários.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala; em português atual, os dois-pontos cumprem essa função com clareza e evitam a redundância “disse... dizendo”.
- source_word: מְרַגְּלִים אַתֶּם
  choice: Vocês são espiões
  rationale: O particípio com o pronome independente forma a acusação nominal; esta é a equivalência direta, clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” comunica claramente o plural do hebraico; a estrutura enfática é preservada de forma idiomática, e os dois-pontos representam a função introdutória de לֵאמֹר.
