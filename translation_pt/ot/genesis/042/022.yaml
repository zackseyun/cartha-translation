  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: pt
  text: 'Então Rúben lhes respondeu: “Não fui eu que lhes disse: ‘Não pequem contra o menino’? Mas vocês não deram ouvidos. Agora, vejam: o sangue dele está sendo cobrado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶחֶטְאוּ בַיֶּלֶד
  choice: pequem contra o menino
  rationale: Reproduz diretamente a linguagem moral do hebraico e preserva o menino como alvo da ação.
- source_word: דָּמוֹ
  choice: o sangue dele
  rationale: Mantém a expressão hebraica concreta, que representa a responsabilidade pela morte de José.
- source_word: הִנֵּה
  choice: vejam
  rationale: Conserva a força discursiva que chama a atenção para a consequência agora manifesta.
- source_word: נִדְרָשׁ
  choice: está sendo cobrado
  rationale: Preserva o passivo e a ideia de que se exige prestação de contas pelo sangue derramado, sem explicitar um agente que o hebraico deixa implícito.
theological_decisions:
- issue: Agente implícito na cobrança do sangue
  choice: 'manter a construção passiva: “está sendo cobrado”'
  alternative: “Deus está cobrando de nós o sangue dele”
  rationale: O texto sugere juízo ou prestação de contas, possivelmente divinos, mas não nomeia o agente; a tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. “Vocês” e “lhes” tornam a fala natural sem perder solenidade; a repetição hebraica de לֵאמֹר foi condensada por ser formulaica.
