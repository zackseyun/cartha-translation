  text: Assim, os filhos de Israel vieram comprar cereal em meio aos que vinham, pois havia fome na terra de Canaã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram
  rationale: O wayyiqtol de בוא dá continuidade à narrativa. Em português, a perspectiva do ponto de partida em Canaã favorece naturalmente “foram”; “chegaram” destacaria a chegada, não expressa de modo independente pelo verbo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A expressão refere-se especificamente aos filhos homens de Jacó neste contexto, e a tradução preserva tanto o vínculo familiar quanto o nome narrativo Israel.
- source_word: לִשְׁבֹּר
  choice: comprar cereal
  rationale: Embora o verbo possa significar simplesmente “comprar”, no contexto da fome e do ciclo de José seu objeto implícito é alimento, particularmente cereal. A explicitação produz português claro sem alterar o sentido contextual.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: junto com os que também iam
  rationale: בְּתוֹךְ situa os irmãos no meio de um grupo maior, e o particípio הַבָּאִים descreve os demais em deslocamento. Esta formulação evita a repetição pouco natural de “foram... entre os que iam” e conserva a ideia de participação no fluxo de viajantes.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da viagem; “pois” liga naturalmente a explicação à oração anterior em registro narrativo digno.
- source_word: הָיָה הָרָעָב
  choice: havia fome
  rationale: A construção hebraica descreve a existência da fome. Em português corrente, “havia fome” é mais natural que “a fome estava”, sem perder a referência à calamidade já conhecida no contexto.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Preserva a expressão geográfica concreta do hebraico e sua importância narrativa.
