base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: pt
  text: 'No terceiro dia, José lhes disse: “Façam isto e vivam[a], pois eu temo a Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Façam isto para que vivam”; o hebraico pode expressar uma ordem seguida de sua consequência ou um resultado implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: José lhes disse
  rationale: A construção narrativa com אמר introduz fala direta; “lhes disse” expressa naturalmente em português o destinatário indicado por אֲלֵהֶם.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: Equivalente temporal idiomático e direto em português.
- source_word: זֹאת עֲשׂוּ
  choice: Façam isto
  rationale: Preserva o demonstrativo e o imperativo plural dirigido aos irmãos.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Mantém a forma imperativa e a concisão do hebraico, sem eliminar a possível nuance de resultado ou consequência.
- source_word: אֶת הָאֱלֹהִים
  choice: a Deus
  rationale: O objeto definido refere-se a Deus; a regência portuguesa de “temer” admite “a Deus” e transmite aqui reverência religiosa.
- source_word: אֲנִי יָרֵא
  choice: eu temo
  rationale: O pronome explícito e o particípio predicativo apresentam o temor de Deus como postura característica de José; a formulação é natural e preserva a ênfase no sujeito.
theological_decisions:
- issue: Sentido da declaração אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: José declara sua reverência por Deus como fundamento de sua conduta.
  alternative: José poderia estar empregando uma referência genérica à divindade no ambiente egípcio.
  rationale: O contexto narrativo de Gênesis favorece a referência a Deus, mas a tradução não acrescenta uma identificação explicativa nem desenvolve a implicação teológica além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural “façam/vivam” explicita naturalmente que José fala ao grupo. A ordem compacta do hebraico foi preservada, e a ambiguidade funcional de וִחְיוּ foi registrada em nota.
