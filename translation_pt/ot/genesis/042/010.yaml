base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: pt
  text: 'Mas eles lhe disseram: “Não, meu senhor; seus servos vieram comprar alimento.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comprar cereal”. O hebraico diz literalmente “comprar alimento”, embora, no contexto da fome, provavelmente se trate de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Mas eles lhe disseram
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “mas” expressa naturalmente o contraste com a acusação de José no versículo anterior. אֵלָיו indica que a resposta foi dirigida a ele.
- source_word: לֹא
  choice: Não
  rationale: A negação funciona como recusa enfática da acusação; “Não” é direto e natural em português atual.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Preserva a deferência dos irmãos diante da autoridade egípcia e a hierarquia social expressa pelo hebraico.
- source_word: וַעֲבָדֶיךָ
  choice: seus servos
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui é uma autodesignação cortês e submissa, não uma afirmação de condição jurídica.
- source_word: בָּאוּ
  choice: vieram
  rationale: O perfeito hebraico relata a chegada deles com a finalidade expressa pelo infinitivo seguinte; o pretérito perfeito é natural no diálogo em português.
- source_word: לִשְׁבָּר
  choice: comprar
  rationale: Neste contexto, o verbo se refere à aquisição de provisões durante a fome; com o objeto expresso, “comprar” comunica adequadamente o sentido.
- source_word: אֹכֶל
  choice: alimento
  rationale: O substantivo hebraico tem sentido amplo de comida ou alimento. O contexto aponta provavelmente para cereal, mas o texto não emprega o termo específico para grão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Meu senhor” e “seus servos” mantêm o tom deferente sem arcaísmo excessivo. O marcador [a] foi colocado imediatamente após a expressão à qual se refere.
