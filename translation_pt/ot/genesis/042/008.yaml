  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: pt
  text: José reconheceu seus irmãos[a], mas eles não o reconheceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o mesmo verbo nas duas orações: “José reconheceu seus irmãos, mas eles não o reconheceram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: reconheceu
  rationale: O hifil de נכר, neste contexto, significa reconhecer ou identificar alguém já conhecido. “Reconheceu” é natural em português e preserva o contraste narrativo.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יוֹסֵף em português.
- source_word: אֶת־אֶחָיו
  choice: seus irmãos
  rationale: O plural masculino de אָח com sufixo de terceira pessoa masculina singular refere-se, neste contexto, aos irmãos homens de José.
- source_word: וְהֵם
  choice: mas eles
  rationale: Embora ו possa significar simplesmente “e”, aqui introduz um contraste entre José reconhecer os irmãos e eles não o reconhecerem; “mas” expressa esse valor adversativo com naturalidade.
- source_word: לֹא
  choice: não
  rationale: Negação direta e idiomática em português.
- source_word: הִכִּרֻהוּ
  choice: não o reconheceram
  rationale: Repete o mesmo verbo נכר da primeira oração. A repetição de “reconhecer” conserva a ironia narrativa, e “o” representa o sufixo pronominal que se refere a José.
