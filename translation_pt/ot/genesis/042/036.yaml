  terminology: “Jacó”, “Simeão” e “Benjamim” estão corretos. “Me fizeram perder meus filhos” transmite de modo natural o efeito causativo de שִׁכַּלְתֶּם sem transformar a fala em uma afirmação técnica de que Jacó literalmente já não possui filho algum.
