base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: pt
  text: 'E Jacó, pai deles, lhes disse: “Vocês me fizeram perder meus filhos[a]: José não está mais, Simeão não está mais, e querem levar Benjamim. Tudo isso está contra mim[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês me deixaram sem filhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Tudo isso caiu sobre mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: estão me deixando sem filhos
  rationale: O piel expressa causar perda de filhos ou tornar alguém privado deles. A formulação comunica em português atual tanto a acusação de Jacó quanto sua dor, sem afirmar que ele já não tinha filho algum.
- source_word: אֵינֶנּוּ
  choice: já não está aqui
  rationale: Neste contexto, a expressão indica ausência ou perda. A mesma formulação serve para José, que Jacó julgava morto, e para Simeão, que estava retido no Egito, preservando a perspectiva limitada de Jacó.
- source_word: תִּקָּחוּ
  choice: agora querem levar
  rationale: O imperfeito descreve a ação pretendida pelos filhos. “Querem levar” torna natural a indignação de Jacó; “agora” explicita apenas a progressão discursiva sugerida pelo contexto.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Tudo isso caiu sobre mim
  rationale: A expressão reúne os acontecimentos percebidos por Jacó como adversidades que recaíram sobre ele. “Caiu sobre mim” preserva o peso cumulativo e adverso de עָלַי.
- source_word: אֹתִי
  choice: me
  rationale: O pronome é mantido explicitamente porque sua posição destacada no hebraico enfatiza Jacó como aquele que sofre a perda.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Jacó, pai deles
  rationale: Mantém a ordem informativa do hebraico em uma construção natural e digna em português.
