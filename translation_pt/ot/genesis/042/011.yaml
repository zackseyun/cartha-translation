translation:
  language: pt
  text: Todos nós somos filhos de um só homem. Somos honestos[a]; os teus servos não são espiões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «somos íntegros» ou «somos sinceros». O hebraico os apresenta como pessoas confiáveis ou sinceras, em contraste com a acusação de espionagem.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por «os teus servos não foram espiões». A construção hebraica admite mais de uma forma natural de expressar a negação.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: todos nós
  rationale: Expressa a totalidade do grupo e conserva a ênfase do hebraico de modo natural em português.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: filhos de um só homem
  rationale: Mantém o sentido literal de descendentes masculinos do mesmo pai; «um só» comunica a unidade enfatizada por אֶחָד.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: nós somos / somos
  rationale: Os pronomes independentes dão ênfase aos falantes; a formulação portuguesa preserva essa autoidentificação sem repetição artificial.
- source_word: כֵּנִים
  choice: honestos
  rationale: No contexto da defesa contra a acusação de espionagem, descreve pessoas sinceras, confiáveis ou íntegras; «honestos» é claro e corrente.
- source_word: עֲבָדֶיךָ
  choice: os teus servos
  rationale: Trata-se de uma autodesignação respeitosa diante de uma autoridade, e não de uma afirmação explícita de escravidão.
- source_word: מְרַגְּלִים
  choice: espiões
  rationale: Designa pessoas envolvidas em espionagem, que é precisamente a acusação no contexto.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: não têm sido espiões
  rationale: Representa a construção com הָיָה e particípio como uma negação de que eles tenham exercido ou assumido essa condição, preservando o valor temporal sem acrescentar «nunca» ao texto principal.
