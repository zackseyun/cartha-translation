  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: pt
  text: Então, eles carregaram seu cereal sobre seus jumentos e partiram dali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas provisões” ou “seu cereal comprado”. O termo hebraico pode designar mantimentos, mas, neste contexto, refere-se mais naturalmente ao cereal adquirido no Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: carregaram
  rationale: Embora נשׂא tenha o sentido básico de levantar ou levar, neste contexto descreve a colocação da carga nos animais; “carregaram” expressa isso de modo natural em português.
- source_word: שִׁבְרָם
  choice: o cereal que haviam comprado
  rationale: No relato de José, שֶׁבֶר designa especialmente o cereal obtido em meio à fome. A explicitação “que haviam comprado” comunica a nuance contextual do termo sem confundi-lo com cereal que já lhes pertencia antes da compra.
- source_word: עַל חֲמֹרֵיהֶם
  choice: seus jumentos com
  rationale: A construção portuguesa “carregar os jumentos com” transmite naturalmente a colocação do cereal sobre os animais, correspondente a עַל no contexto.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: partiram dali
  rationale: A expressão concisa e idiomática preserva a ideia de sair daquele lugar, sem acrescentar destino ou circunstância.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Jumentos” mantém o termo zoológico tradicional e amplamente compreensível; “cereal” evita a possível leitura restrita de “grão” no singular.
