  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: pt
  text: 'Quando Jacó viu que havia cereal no Egito, disse aos seus filhos: “Por que vocês ficam olhando uns para os outros?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que vocês se mostram?” O verbo hebraico pode ser entendido de maneiras diferentes, mas, neste contexto, provavelmente se refere aos irmãos olhando uns para os outros, hesitantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando Jacó soube
  rationale: O verbo significa literalmente “viu”, mas aqui se refere a perceber ou ficar sabendo que havia cereal disponível no Egito. “Quando... soube” expressa naturalmente em português a relação com a fala seguinte.
- source_word: כִּי יֶשׁ
  choice: que havia
  rationale: כִּי introduz o conteúdo percebido, e יֵשׁ indica existência ou disponibilidade. O imperfeito “havia” se ajusta à narrativa no passado.
- source_word: שֶׁבֶר
  choice: cereal
  rationale: Neste contexto de fome e compra, o termo designa cereal disponível para aquisição. “Cereal” é preciso e amplamente compreensível, sem restringir indevidamente a um tipo específico.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: Reproduz o sentido locativo normal da preposição בְּ com o nome do país.
- source_word: לְבָנָיו
  choice: a seus filhos
  rationale: O referente são especificamente os filhos homens de Jacó, conforme o contexto narrativo.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente direto e natural da pergunta hebraica.
- source_word: תִּתְרָאוּ
  choice: vocês ficam olhando uns para os outros
  rationale: O hitpael é provavelmente recíproco neste contexto e retrata a hesitação inativa dos irmãos. “Ficam olhando” comunica com naturalidade a nuance continuada, sem eliminar a alternativa lexical.
