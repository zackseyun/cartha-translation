  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: pt
  text: 'Nisto vocês serão postos à prova: pela vida de Faraó,[a] vocês não sairão daqui, a menos que o irmão mais novo de vocês venha para cá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “se vocês saírem daqui”; nesta fórmula de juramento, “se” expressa uma forte negação: “vocês não sairão daqui”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Assim
  rationale: O ב instrumental com o demonstrativo introduz o meio ou critério da prova; “Assim” expressa isso de modo natural e conciso em português.
- source_word: תִּבָּחֵנוּ
  choice: vocês serão postos à prova
  rationale: O nifal de בחן indica ser provado ou examinado; a formulação explicita a voz passiva e se ajusta à verificação da alegação dos irmãos.
- source_word: חֵי פַרְעֹה
  choice: pela vida de Faraó
  rationale: Preserva de perto a fórmula hebraica de juramento que invoca a vida de Faraó, mantendo seu tom solene.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: vocês não sairão daqui
  rationale: Depois da fórmula de juramento, אִם introduz uma asseveração negativa elíptica, não uma condição simples; “daqui” traduz naturalmente מִזֶּה.
- source_word: כִּי אִם
  choice: a menos que
  rationale: As partículas combinadas introduzem a única exceção à declaração negativa.
- source_word: בְּבוֹא
  choice: venha
  rationale: O infinitivo construto com ב indica a circunstância necessária; após “a menos que”, uma forma finita no subjuntivo é idiomática em português.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: o irmão mais novo de vocês
  rationale: No contexto familiar, הַקָּטֹן designa o irmão de menor idade, isto é, Benjamim; “mais novo” evita a possível ideia de tamanho físico.
- source_word: הֵנָּה
  choice: para cá
  rationale: O advérbio tem sentido direcional; “para cá” conserva melhor esse movimento do que apenas “aqui”.
