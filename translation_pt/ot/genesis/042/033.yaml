base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: pt
  text: 'Então o homem, o senhor da terra, nos disse: “Assim saberei que vocês são honestos: deixem comigo um de seus irmãos, levem mantimento para a fome de suas famílias[a] e vão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levem a fome de suas casas”. O sentido é levar mantimento para enfrentar a fome que atingia suas famílias.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: o homem, o senhor da terra
  rationale: Preserva a aposição hebraica e comunica de modo natural a elevada autoridade do homem sobre a terra.
- source_word: בְּזֹאת אֵדַע
  choice: Assim saberei
  rationale: Expressa de forma idiomática o critério pelo qual ele viria a reconhecer a honestidade deles, mantendo o valor futuro de אֵדַע.
- source_word: כֵנִים
  choice: honestos
  rationale: No contexto, descreve pessoas francas e dignas de confiança, em contraste com espiões; “honestos” é claro e natural em português moderno.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: um de seus irmãos
  rationale: Reproduz em português idiomático a referência a um único irmão dentre o grupo.
- source_word: הַנִּיחוּ אִתִּי
  choice: deixem comigo
  rationale: O hifil de נוח aqui indica deixar alguém permanecer com o falante.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: mantimento para a fome de suas famílias
  rationale: A expressão hebraica é elíptica. “Mantimento” explicita com moderação o que deve ser levado, conforme o contexto da compra de cereal, enquanto “famílias” comunica o sentido doméstico de בָּתִּים.
- source_word: קְחוּ וָלֵכוּ
  choice: levem ... e vão
  rationale: Mantém a sequência e a força direta dos dois imperativos.
