base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: pt
  text: 'Então chegaram até Jacó, seu pai, na terra de Canaã, e lhe contaram tudo o que lhes havia acontecido[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “até Jacó, seu pai, para a terra de Canaã”. A tradução apresenta a frase de forma idiomática como “até Jacó, seu pai, na terra de Canaã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: O wayyiqtol de בוא faz a narrativa avançar; “Então chegaram” expressa a sequência com naturalidade.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: até Jacó, seu pai
  rationale: אֶל marca o destino, e אֲבִיהֶם identifica Jacó como pai deles. “Seu pai” é natural em português e não cria ambiguidade no contexto.
- source_word: אַרְצָה כְּנָעַן
  choice: na terra de Canaã
  rationale: A terminação direcional de אַרְצָה indica movimento para a terra de Canaã. Depois de “chegaram até Jacó”, a formulação locativa evita dois destinos coordenados de modo pouco natural, enquanto a nota preserva a forma hebraica.
- source_word: וַיַּגִּידוּ לוֹ
  choice: e lhe contaram
  rationale: O hifil de נגד significa contar ou relatar. “Lhe contaram” é claro e idiomático neste contexto narrativo.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: tudo o que lhes havia acontecido
  rationale: A expressão abrange a totalidade dos acontecimentos que os haviam atingido; o mais-que-perfeito composto deixa clara a anterioridade em relação ao relato.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o discurso direto que começa no versículo seguinte; os dois-pontos cumprem naturalmente essa função em português.
