  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: pt
  text: José era o governante do país; era ele quem vendia cereal a todo o povo do país. Os irmãos de José chegaram e se curvaram[a] diante dele, com o rosto no chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prostraram diante dele”. O verbo hebraico pode indicar uma profunda reverência ou a prostração como gesto de homenagem.'
    reason: Alternativa lexical que preserva a amplitude do verbo hebraico e esclarece a intensidade possível do gesto.
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: o governante
  rationale: Expressa de modo natural a autoridade exercida por José sem lhe atribuir um título administrativo mais específico do que o hebraico.
- source_word: עַל הָאָרֶץ
  choice: do país
  rationale: Neste contexto, אֶרֶץ se refere ao território do Egito, não à terra inteira. A construção portuguesa natural 'governante do país' comunica o sentido de autoridade sobre esse território.
- source_word: הַמַּשְׁבִּיר
  choice: quem vendia cereal
  rationale: O particípio hifil de שׁבר, no contexto da fome, designa aquele que vende ou fornece cereal. 'Vendia cereal' explicita o objeto pressuposto pela narrativa.
- source_word: לְכָל עַם הָאָרֶץ
  choice: a todo o povo daquela terra
  rationale: Mantém o singular coletivo de עַם e deixa claro que a referência é à população do território em questão, não a todos os povos do mundo.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: se curvaram diante dele
  rationale: Descreve o gesto de submissão e homenagem sem introduzir a ideia especificamente cultual de adoração. A nota registra a possibilidade de entender o gesto como prostração completa.
- source_word: אַפַּיִם אָרְצָה
  choice: com o rosto no chão
  rationale: Reproduz em português corrente a postura física indicada pelo idioma hebraico.
- source_word: הוּא הַמַּשְׁבִּיר
  choice: era ele quem vendia cereal
  rationale: A construção enfática 'era ele quem' preserva a ênfase do pronome hebraico הוּא.
theological_decisions:
- issue: O gesto dos irmãos diante de José
  choice: se curvaram diante dele
  alternative: se prostraram diante dele; o adoraram
  rationale: A cena retrata submissão e homenagem e remete aos sonhos anteriores de José, mas não caracteriza o ato como adoração divina. A tradução evita impor essa leitura e conserva na nota a intensidade física possível do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se iniciar com um marcador discursivo como “Ora” ou “Então”, pois o hebraico não contém um advérbio temporal explícito. A repetição de אֶרֶץ foi vertida de forma contextual como “país” e “daquela terra” para evitar que “terra” seja entendida em sentido mundial.
