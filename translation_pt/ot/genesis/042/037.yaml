base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: pt
  text: 'Então Rúben disse a seu pai: “Você pode matar meus dois filhos, se eu não o trouxer de volta a você. Confie-o aos meus cuidados[a], e eu mesmo o trarei de volta a você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Ponha-o em minha mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל־אָבִיו
  choice: a seu pai
  rationale: Tradução direta e idiomática da relação indicada pelo hebraico.
- source_word: לֵאמֹר
  choice: não expresso separadamente
  rationale: Em português natural, o introdutor hebraico de discurso fica suficientemente representado pelos dois-pontos e pela citação direta.
- source_word: אֶת־שְׁנֵי בָנַי תָּמִית
  choice: Você pode matar meus dois filhos
  rationale: O hifil de מות indica causar a morte. “Pode matar” comunica que Rúben concede ao pai esse direito como garantia, sem transformar a frase numa ordem abrupta.
- source_word: אִם־לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: se eu não o trouxer de volta a você
  rationale: A construção condicional foi mantida; “de volta” explicita o retorno pretendido pelo contexto.
- source_word: תְּנָה אֹתוֹ עַל־יָדִי
  choice: Confie-o aos meus cuidados
  rationale: A expressão concreta com “mão” funciona como idioma de responsabilidade e custódia. A formulação escolhida transmite esse sentido com clareza, enquanto a imagem literal é registrada em nota.
- source_word: וַאֲנִי
  choice: e eu mesmo
  rationale: O pronome explícito é enfático; “eu mesmo” preserva essa ênfase.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: o trarei de volta a você
  rationale: O hifil de שוב significa fazer retornar; “trarei de volta” é natural e mantém a ideia de devolução segura a Jacó.
