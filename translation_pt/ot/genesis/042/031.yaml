  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: pt
  text: 'E lhe dissemos: “Somos homens honestos; não fomos espiões.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: E nós dissemos
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “E nós dissemos” preserva essa progressão de modo natural.
- source_word: אֵלָיו
  choice: lhe
  rationale: A preposição אֶל com sufixo de terceira pessoa masculina singular significa “a ele”; em português, o pronome “lhe” é uma forma clara e natural neste contexto.
- source_word: כֵּנִים
  choice: homens honestos
  rationale: כֵּנִים caracteriza os irmãos como pessoas íntegras, francas e dignas de confiança, em contraste com a acusação de espionagem. “Homens honestos” comunica naturalmente esse sentido.
- source_word: אֲנָחְנוּ
  choice: somos
  rationale: O pronome independente enfatiza o sujeito “nós”. Em português, a primeira pessoa do plural expressa o sujeito de modo suficiente e natural dentro da declaração enfática.
- source_word: לֹא הָיִינוּ
  choice: não somos
  rationale: Embora a forma hebraica seja literalmente passada (“não éramos”), o discurso reconta a alegação de identidade feita pelos irmãos. Em português, “não somos espiões” reproduz naturalmente a autodefesa direta sem sugerir que antes fossem espiões.
- source_word: מְרַגְּלִים
  choice: espiões
  rationale: O particípio de רגל designa aqui pessoas que atuam como espiões; “espiões” é a correspondência portuguesa direta e idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da fala foi mantida simples e direta. Não se acrescentou nota porque as alternativas lexicais não alteram significativamente o sentido e a tradução portuguesa já preserva o contraste central entre honestidade e espionagem.
