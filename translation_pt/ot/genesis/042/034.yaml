  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: pt
  text: Tragam-me o irmão mais novo de vocês, para que eu saiba que vocês não são espiões, mas homens honestos. Então devolverei o irmão de vocês, e vocês poderão negociar[a] na terra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “circular pela terra”. O verbo hebraico também pode ter o sentido mais amplo de percorrer ou viajar por uma região, embora o sentido comercial, “negociar”, se ajuste melhor ao contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Tragam-me
  rationale: O hifil imperativo de בוא expressa uma ordem; a colocação pronominal torna natural em português a direção indicada por אֵלַי.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: o irmão mais novo de vocês
  rationale: No contexto familiar, הַקָּטֹן designa naturalmente o irmão mais novo, referido anteriormente como Benjamim.
- source_word: וְאֵדְעָה
  choice: para que eu saiba
  rationale: O coortativo após a ordem comunica finalidade ou resultado pretendido, preservado por uma oração final.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: que vocês não são espiões
  rationale: מְרַגְּלִים funciona aqui como predicativo plural e significa 'espiões'.
- source_word: כִּי כֵנִים אַתֶּם
  choice: mas homens honestos
  rationale: כֵנִים indica pessoas honestas, verdadeiras ou dignas de confiança; 'homens honestos' mantém o contraste direto com 'espiões'.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: Então devolverei o irmão de vocês
  rationale: O irmão está detido; 'devolverei' expressa de modo natural a restituição implícita no hebraico 'darei a vocês'.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: e vocês poderão negociar nesta terra
  rationale: סחר tem sentido comercial de negociar ou comerciar, apropriado ao contexto da compra de alimentos; a forma verbal é entendida como permissão resultante.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A construção evita literalismo rígido sem eliminar a ambiguidade lexical de תִּסְחָרוּ, registrada em nota.
