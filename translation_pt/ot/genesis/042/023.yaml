base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: pt
  text: Mas eles não sabiam que José os entendia, pois o intérprete estava entre eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵם
  choice: Mas eles
  rationale: A conjunção com o pronome explícito introduz um contraste narrativo com o contexto anterior; “Mas eles” o expressa naturalmente.
- source_word: לֹא יָדְעוּ
  choice: não sabiam
  rationale: Tradução direta da forma verbal, que indica falta de conhecimento.
- source_word: כִּי
  choice: que
  rationale: A primeira ocorrência introduz o conteúdo daquilo que os irmãos não sabiam.
- source_word: שֹׁמֵעַ
  choice: os entendia
  rationale: Embora o verbo tenha o sentido básico de ouvir, neste contexto indica que José compreendia o que os irmãos diziam; o objeto “os” fica naturalmente implícito no hebraico e é explicitado em português para clareza.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי
  choice: pois
  rationale: A segunda ocorrência apresenta a razão pela qual eles não sabiam que José os entendia.
- source_word: הַמֵּלִיץ
  choice: um intérprete
  rationale: No contexto, designa o intermediário que traduzia a fala entre José e seus irmãos. O artigo hebraico é expresso de modo idiomático pelo indefinido em português, pois o personagem ainda não foi apresentado.
- source_word: בֵּינֹתָם
  choice: entre eles
  rationale: Preserva a ideia da posição mediadora do intérprete entre as partes.
