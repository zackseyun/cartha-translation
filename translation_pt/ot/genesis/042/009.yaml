  register: Português moderno, digno e acessível, com uso de “vocês” para leitura brasileira ampla. A repetição “sonhos que tinha sonhado” foi mantida para refletir a construção cognata hebraica, e a metáfora “nudez da terra” foi preservada no texto com esclarecimento em nota.
