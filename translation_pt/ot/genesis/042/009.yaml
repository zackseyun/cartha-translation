base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: pt
  text: 'Então José se lembrou dos sonhos que tinha sonhado a respeito deles e lhes disse: “Vocês são espiões; vieram para ver a nudez da terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as partes expostas ou vulneráveis da terra”. O hebraico diz literalmente “a nudez da terra”, expressão que se refere a regiões desprotegidas e abertas a um ataque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se lembrou
  rationale: Expressa de modo natural a recordação de José naquele momento da narrativa.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: os sonhos que tinha sonhado
  rationale: Conserva a repetição etimológica do hebraico sem perder a clareza em português.
- source_word: לָהֶם
  choice: a respeito deles
  rationale: No contexto, os sonhos diziam respeito aos irmãos de José; esta formulação preserva esse sentido relacional.
- source_word: מְרַגְּלִים
  choice: espiões
  rationale: Designa claramente pessoas que realizam espionagem e se ajusta à acusação feita por José.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Mantém o sentido direto do infinitivo hebraico, enquanto o contexto comunica a ideia de reconhecimento estratégico.
- source_word: עֶרְוַת הָאָרֶץ
  choice: a nudez da terra
  rationale: Preserva a metáfora concreta do hebraico; a nota esclarece seu sentido idiomático de regiões expostas ou vulneráveis.
- source_word: בָּאתֶם
  choice: vieram
  rationale: É a forma natural em português para acusar os interlocutores de terem vindo com esse propósito.
theological_decisions: []
