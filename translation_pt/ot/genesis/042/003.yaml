  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: pt
  text: Assim, os dez irmãos de José desceram para comprar cereal do Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comprar cereal no Egito”. Mais literalmente, o hebraico diz “comprar cereal do Egito”, destacando a procedência do cereal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva o sentido geográfico de ירד para a viagem ao Egito e soa natural em português no contexto narrativo.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: os dez irmãos de José
  rationale: Reproduz naturalmente em português a relação de posse e a quantidade indicada no hebraico.
- source_word: לִשְׁבֹּר
  choice: para comprar
  rationale: Neste contexto de fome, שׁבר designa a aquisição de mantimentos, especificamente cereal.
- source_word: בָּר
  choice: cereal
  rationale: O substantivo se refere a grãos destinados à alimentação; “cereal” é claro e amplamente compreensível em português.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Mantém o valor básico da preposição מן, apresentando o Egito como origem do cereal.
