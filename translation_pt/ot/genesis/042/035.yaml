  source_fidelity: 'A tradução preserva a progressão do hebraico: durante o esvaziamento dos sacos, cada homem encontra o seu embrulho de prata no próprio saco; em seguida, os irmãos e o pai veem os embrulhos e reagem com medo. «Enquanto esvaziavam» comunica adequadamente a relação temporal de ויהי ... מְרִיקִים sem calque pesado.'
