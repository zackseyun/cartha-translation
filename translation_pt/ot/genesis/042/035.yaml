  terminology: «Sacos» corresponde bem a שַׂקִּים. «Embrulho de prata» conserva a imagem de algo atado e mantém «prata», que no contexto funciona como dinheiro. A nota oferece uma alternativa compreensível sem alterar o texto principal.
