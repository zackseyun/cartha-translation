  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: pt
  text: Enquanto esvaziavam os seus sacos, eis que o embrulho de prata[a] de cada um estava no seu saco. Eles e seu pai viram os embrulhos de prata e ficaram com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a bolsa com o dinheiro». O termo hebraico indica algo atado ou envolvido; aqui, a prata era usada como dinheiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Enquanto esvaziavam
  rationale: A construção introduz o acontecimento ocorrido durante a ação de esvaziar. A formulação preserva a relação temporal do hebraico sem recorrer ao pouco natural «E aconteceu que, enquanto...».
- source_word: שַׂקֵּיהֶם
  choice: os seus sacos
  rationale: שַׂק designa sacos usados para transportar cereais ou mercadorias; «sacos» conserva esse sentido concreto e antigo.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A expressão assinala uma descoberta repentina e surpreendente. «Eis que» mantém essa força narrativa em registro digno e compreensível.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: o embrulho de prata de cada um
  rationale: אִישׁ tem valor distributivo, e צְרוֹר indica algo atado ou envolvido. «Prata» preserva a forma concreta do hebraico, embora funcione aqui como dinheiro.
- source_word: בְּשַׂקּוֹ
  choice: estava no seu saco
  rationale: A expressão locativa singular corresponde distributivamente ao saco de cada irmão.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם הֵמָּה וַאֲבִיהֶם
  choice: Eles e seu pai viram os embrulhos de prata
  rationale: A ordem foi ajustada para o português natural, preservando a identificação enfática dos irmãos e do pai como os que viram.
- source_word: וַיִּירָאוּ
  choice: e ficaram com medo
  rationale: A locução expressa de modo idiomático a reação de temor provocada pela descoberta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservou-se «eis que» para transmitir a surpresa narrativa, e a sintaxe final foi reorganizada para soar natural sem perder a ênfase do hebraico.
