base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: pt
  text: Somos doze irmãos, filhos de nosso pai. Um deles não está mais[a], e o mais novo está hoje com nosso pai na terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um não está”. A expressão hebraica pode indicar que alguém está ausente, desapareceu ou é considerado morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Somos doze irmãos
  rationale: Reproduz naturalmente em português a oração nominal hebraica e mantém o sentido literal de irmãos do sexo masculino.
- source_word: בְּנֵי אָבִינוּ
  choice: filhos do mesmo pai
  rationale: Expressa a relação familiar enfatizada pela aposição hebraica; em português, “do mesmo pai” evita a formulação pouco natural “filhos de nosso pai” neste contexto.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Um deles já não existe
  rationale: Mantém o eufemismo e a perspectiva dos irmãos sem declarar de modo explícito que ele morreu; a nota registra a forma mais literal e sua amplitude semântica.
- source_word: וְהַקָּטֹן
  choice: e o mais novo
  rationale: No contexto de uma série de irmãos, o adjetivo substantivado designa naturalmente o irmão mais jovem.
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: está hoje com nosso pai
  rationale: Entende אֶת como preposição de companhia e conserva הַיּוֹם de forma clara e idiomática.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Preserva o substantivo “terra” presente na construção hebraica.
theological_decisions:
- issue: Condição do irmão ausente
  choice: já não existe
  alternative: morreu
  rationale: O hebraico אֵינֶנּוּ afirma literalmente que ele “não está/não existe”, podendo indicar ausência, desaparecimento ou morte presumida. A tradução não deve transformar a suposição dos irmãos numa afirmação explícita de morte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Filhos do mesmo pai” comunica a aposição hebraica sem rigidez; “está hoje” conserva a presença explícita de “hoje” no texto-fonte.
