base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: pt
  text: 'Quando José viu seus irmãos, reconheceu-os, mas fingiu ser um estranho para eles[a] e falou-lhes com dureza. Ele lhes perguntou: “De onde vocês vieram?” Eles responderam: “Da terra de Canaã, para comprar alimento[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez-se irreconhecível para eles” ou “disfarçou-se diante deles”. O hebraico pode indicar que ele se apresentou como estrangeiro ou desconhecido para eles, sem especificar necessariamente um disfarce físico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “comprar cereais”. Neste contexto de fome, o verbo hebraico muitas vezes se refere especificamente à compra de cereais, embora o substantivo usado aqui tenha o sentido mais amplo de “alimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Quando José viu seus irmãos
  rationale: A construção com waw consecutivo dá continuidade à narrativa; “Quando” expressa com naturalidade a relação temporal com o reconhecimento que se segue.
- source_word: וַיַּכִּרֵם
  choice: reconheceu-os
  rationale: O hifil de נכר indica reconhecer ou identificar; esta é a equivalência direta e natural em português.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: fingiu ser um estranho para eles
  rationale: O hitpael apresenta José fazendo-se passar por alguém estranho ou desconhecido diante deles, sem exigir a ideia mais específica de um disfarce físico.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: falou com eles duramente
  rationale: קָשׁוֹת caracteriza a maneira severa de falar; a formulação conserva também a preposição recíproca אִתָּם, “com eles”.
- source_word: מֵאַיִן בָּאתֶם
  choice: De onde vocês vêm?
  rationale: Pergunta naturalmente pela procedência; “vocês” oferece ampla legibilidade brasileira e deixa claro o plural.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Da terra de Canaã
  rationale: Reproduz a expressão geográfica formal do hebraico sem omitir “terra”.
- source_word: לִשְׁבָּר אֹכֶל
  choice: para comprar alimento
  rationale: שבר designa a compra de provisões, frequentemente cereal neste contexto, enquanto אֹכֶל tem o sentido mais amplo de alimento.
