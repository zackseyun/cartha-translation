  text: And he put them in custody for three days[a].
translation:
  language: pt
  text: E ele os pôs sob custódia durante três dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele os confinou sob guarda por três dias”. O verbo hebraico significa literalmente “reuniu” ou “ajuntou”, mas aqui, com a expressão “sob guarda”, tem o sentido idiomático de pôr alguém em custódia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: pôs
  rationale: Embora אסף signifique literalmente “reunir” ou “ajuntar”, com אֶל מִשְׁמָר forma uma expressão idiomática de colocar alguém sob guarda. “Pôs” é natural e preserva o movimento para a custódia sem explicitação excessiva.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto masculino plural, referente aos irmãos de José.
- source_word: אֶל מִשְׁמָר
  choice: sob custódia
  rationale: A preposição אֶל indica o ingresso na condição ou no lugar de guarda, e מִשְׁמָר pode designar guarda, custódia ou confinamento. “Sob custódia” é idiomático em português e não especifica indevidamente uma prisão formal.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: A expressão indica a duração do confinamento; “durante três dias” comunica isso de modo claro e natural.
