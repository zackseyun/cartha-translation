id: GEN.42.4
reference: Genesis 42:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: pt
  text: 'Mas Jacó não enviou Benjamim, irmão de José, junto com seus irmãos, pois disse: “Para que não lhe aconteça alguma desgraça[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algum mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mas
  rationale: A conjunção liga o versículo ao anterior e, neste contexto, introduz o contraste entre a ida dos outros irmãos e a retenção de Benjamim; o marcador de objeto direto não é traduzido.
- source_word: בִּנְיָמִין
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲחִי יוֹסֵף
  choice: irmão de José
  rationale: Reproduz de modo claro e natural a cadeia construta que identifica Benjamim por sua relação particular com José.
- source_word: לֹא שָׁלַח
  choice: não enviou
  rationale: Verte diretamente o verbo שׁלח em seu sentido comum no relato.
- source_word: אֶת אֶחָיו
  choice: junto com seus irmãos
  rationale: Explicita de modo idiomático que Benjamim não foi enviado na companhia dos irmãos, sentido exigido pelo contexto.
- source_word: כִּי אָמַר
  choice: pois disse
  rationale: כִּי apresenta a razão, e אָמַר significa literalmente 'disse'; evita substituí-lo interpretativamente por 'pensou'.
- source_word: פֶּן
  choice: Para que não
  rationale: Expressa em português corrente a possibilidade temida introduzida por פֶּן, sem transformar o temor em certeza.
- source_word: יִקְרָאֶנּוּ
  choice: lhe aconteça
  rationale: Com אָסוֹן, o verbo forma a ideia idiomática de uma calamidade acontecer a alguém.
- source_word: אָסוֹן
  choice: alguma desgraça
  rationale: Mantém o sentido amplo de dano grave, infortúnio ou calamidade, sem especificar a natureza do perigo.
theological_decisions: []
