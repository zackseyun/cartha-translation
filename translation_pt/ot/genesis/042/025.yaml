base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: pt
  text: Então José deu ordens para que enchessem os recipientes deles de cereal[a], devolvessem a prata[b] de cada um ao respectivo saco e lhes dessem provisões para a viagem. E assim foi feito para eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os utensílios deles”. O termo hebraico é amplo e difere da palavra traduzida como “saco” mais adiante no versículo.
    reason: lexical_alternative
  - marker: b
    text: “Prata” também pode significar “dinheiro” neste contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “E ele fez assim por eles”. O sujeito do verbo hebraico não é expresso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu ordens
  rationale: O verbo צוה expressa uma ordem. “Deu ordens para que” é natural em português e introduz adequadamente a sequência de instruções.
- source_word: כְּלֵיהֶם
  choice: os recipientes deles
  rationale: כְּלִי é um termo amplo para utensílio, vaso ou recipiente. A escolha preserva a distinção em relação a שַׂק, “saco”, usado depois no mesmo versículo.
- source_word: בָּר
  choice: cereal
  rationale: Neste contexto de fome e abastecimento, בָּר designa cereal em grão; a tradução evita restringir o sentido especificamente a trigo.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם אִישׁ אֶל שַׂקּוֹ
  choice: devolvessem a prata de cada um ao respectivo saco
  rationale: כֶּסֶף significa literalmente “prata” e também pode designar dinheiro. “De cada um ao respectivo saco” comunica com clareza o valor distributivo de אִישׁ אֶל שַׂקּוֹ.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: e lhes dessem provisões para a viagem
  rationale: צֵדָה indica mantimentos ou suprimentos levados para uma jornada. “Provisões para a viagem” é claro, digno e natural.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: E assim foi feito para eles
  rationale: O verbo singular tem agente não expresso. A construção passiva em português mantém o foco no cumprimento das ordens sem identificar indevidamente quem as executou.
