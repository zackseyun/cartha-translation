base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: pt
  text: 'Então disseram uns aos outros: “De fato, temos culpa em relação ao nosso irmão, pois vimos a angústia de sua alma quando ele nos implorava, e não lhe demos ouvidos. Por isso, esta angústia veio sobre nós.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa a mesma raiz para a “angústia” de José e a “angústia” que agora veio sobre seus irmãos, ligando o sofrimento presente deles à crueldade que haviam demonstrado no passado.
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Então disseram uns aos outros
  rationale: A expressão distributiva hebraica indica que os irmãos falavam entre si. Esta formulação é natural em português e preserva a reciprocidade; “então” expressa adequadamente o waw narrativo no contexto.
- source_word: אֲבָל
  choice: De fato
  rationale: Neste contexto, o termo introduz uma admissão enfática, e não um contraste. “De fato” comunica com naturalidade o reconhecimento solene da culpa.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: somos culpados pelo que fizemos ao nosso irmão
  rationale: אֲשֵׁמִים denota culpa ou responsabilidade. A expansão moderada torna idiomático em português o sentido contextual de עַל־אָחִינוּ sem definir além do contexto qual ato específico está em vista.
- source_word: צָרַת נַפְשׁוֹ
  choice: a angústia de sua alma
  rationale: Preserva a expressão hebraica, literalmente ligada à aflição da pessoa ou vida interior, mantendo sua intensidade emocional sem reduzi-la apenas a uma emoção passageira.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: quando ele nos implorava
  rationale: O hitpael de חנן expressa súplica insistente. “Implorava” comunica essa força sem acrescentar explicitamente um objeto, como “misericórdia”, que o hebraico deixa implícito.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: mas não lhe demos ouvidos
  rationale: שׁמע aqui significa atender ou acatar, não apenas ouvir sons. A formulação portuguesa transmite a recusa em atender à súplica; “mas” explicita a oposição contextual de modo natural.
- source_word: עַל־כֵּן
  choice: Por isso
  rationale: A locução marca a consequência que os irmãos extraem de sua culpa passada.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: esta mesma angústia veio sobre nós
  rationale: “Angústia” retoma צָרַת e preserva o elo lexical entre o sofrimento de José e o sofrimento atual dos irmãos. “Mesma” torna perceptível essa correspondência retórica, embora não seja um equivalente lexical isolado de הַזֹּאת.
theological_decisions:
- issue: Interpretação do sofrimento atual como consequência da culpa
  choice: 'Manter a conclusão dos próprios irmãos: “Por isso, esta mesma angústia veio sobre nós”.'
  alternative: Apresentar a angústia como punição divina explicitamente declarada pelo narrador.
  rationale: O versículo registra a interpretação dos irmãos, mas não menciona Deus nem formula diretamente uma doutrina geral de retribuição. A tradução não deve acrescentar uma agência divina que permanece implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a imagem semítica “angústia de sua alma”, enquanto emprega formas idiomáticas como “uns aos outros” e “não lhe demos ouvidos”. O marcador [a] aparece no texto e explica a repetição lexical central do versículo.
