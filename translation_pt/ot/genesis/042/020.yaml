source:
  edition: WLC
  text: וְ/אֶת אֲחִי/כֶ֤ם הַ/קָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔/י וְ/יֵאָמְנ֥וּ דִבְרֵי/כֶ֖ם וְ/לֹ֣א תָמ֑וּתוּ וַ/יַּעֲשׂוּ כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: pt
  text: Tragam-me, então, o irmão mais novo de vocês, para que as suas palavras sejam confirmadas[a] e vocês não morram”. E eles fizeram assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam comprovadas” ou “sejam consideradas verdadeiras”. O verbo hebraico pode indicar tanto que algo foi estabelecido como verdadeiro quanto que foi aceito como digno de crédito; neste contexto, trata-se de confirmar a declaração dos irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: o irmão mais novo de vocês
  rationale: Em contexto familiar, הַקָּטֹן designa o irmão de menor idade; esta formulação é natural em português e preserva o sentido narrativo referente a Benjamim.
- source_word: תָּבִיאוּ אֵלַי
  choice: Tragam-me
  rationale: O hifil de בוא significa “trazer”; a construção com pronome enclítico expressa de modo direto e natural אֵלַי, “a mim”.
- source_word: וְיֵאָמְנוּ
  choice: para que ... sejam confirmadas
  rationale: O nifal de אמן pode indicar que algo é estabelecido como verdadeiro ou considerado digno de crédito. “Sejam confirmadas” se ajusta ao contexto em que José põe à prova a declaração dos irmãos, sem eliminar a alternativa “sejam acreditadas”.
- source_word: דִבְרֵיכֶם
  choice: as suas palavras
  rationale: Tradução direta do plural construto, mantendo o vínculo com as declarações anteriores dos irmãos.
- source_word: וְלֹא תָמֻתוּ
  choice: e vocês não morram
  rationale: Preserva a coordenação hebraica e apresenta a sobrevivência como consequência do cumprimento da exigência, sem transformar a oração em finalidade explícita.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: E eles fizeram assim
  rationale: Equivalente português claro da fórmula narrativa hebraica, indicando que agiram conforme fora determinado.
