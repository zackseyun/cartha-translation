base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: pt
  text: Se vocês são honestos[a], que um dos seus irmãos fique preso no lugar onde vocês estão detidos[b]; quanto a vocês, vão e levem cereal para suas famílias, por causa da fome[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se vocês são homens verdadeiros”. O adjetivo hebraico também pode ser traduzido por “verdadeiros” ou “íntegros”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na casa da custódia de vocês”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “levem cereal para a fome de suas casas”. Aqui, “casas” se refere às famílias ou aos que dependiam deles em casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: honestos
  rationale: No contexto do interrogatório de José, o adjetivo indica pessoas que dizem a verdade e são dignas de confiança. “Honestos” é natural em português e mantém essa dimensão moral e verídica.
- source_word: אֲחִיכֶם אֶחָד
  choice: um dos seus irmãos
  rationale: Expressa naturalmente que um único integrante do grupo deve permanecer detido.
- source_word: יֵאָסֵר
  choice: fique preso
  rationale: O nifal de אסר pode significar ser amarrado ou mantido sob custódia. Aqui, a referência ao local de detenção favorece o sentido de encarceramento sem exigir que tenha sido fisicamente amarrado.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: no lugar onde vocês estão detidos
  rationale: A expressão significa literalmente “na casa da custódia de vocês” e, no contexto, aponta para o local em que os irmãos estavam sob guarda. A formulação evita pressupor uma instituição prisional moderna.
- source_word: וְאַתֶּם לְכוּ
  choice: quanto a vocês, vão
  rationale: O pronome independente enfatiza o contraste entre o irmão que permanece preso e os demais, que recebem ordem de partir.
- source_word: הָבִיאוּ
  choice: levem
  rationale: Como os irmãos devem transportar o cereal do Egito para suas casas, “levem” é a escolha mais natural em português, embora o verbo hebraico tenha o sentido básico de “fazer vir/trazer”.
- source_word: שֶׁבֶר
  choice: cereal
  rationale: Na narrativa de José, o termo designa cereal adquirido como provisão durante a fome. “Cereal” preserva essa especificidade.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: para aliviar a fome de suas famílias
  rationale: A expressão hebraica é compacta e literalmente associa a fome às “casas” deles. Em português, “famílias” comunica o sentido doméstico de בָּתִּים, e “aliviar” explicita de modo natural a finalidade do cereal sem eliminar a nota literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento em “vocês” para ampla legibilidade brasileira. A construção “quanto a vocês” preserva a ênfase contrastiva do pronome hebraico. As notas registram as formulações mais literais nos pontos em que uma reprodução direta seria pouco natural.
