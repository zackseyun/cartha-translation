  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: pt
  text: Mandem um de vocês[a] buscar o irmão de vocês, e vocês fiquem detidos[b], para que as palavras de vocês sejam postas à prova, para ver se a verdade está com vocês[c]. Mas, se não, pela vida de Faraó[d], certamente vocês são espiões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e que ele tome o irmão de vocês”. O verbo hebraico geralmente significa “tomar” ou “pegar”, mas aqui se refere a buscar o irmão e trazê-lo de volta.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam presos” ou “fiquem sob custódia”. O verbo hebraico pode indicar ser amarrado ou mantido detido.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “se a verdade está com vocês”, isto é, se vocês estão dizendo a verdade.
    reason: lexical_alternative
  - marker: d
    text: “Pela vida de Faraó” é uma fórmula de juramento que invoca a vida de Faraó.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: Mandem
  rationale: O imperativo plural de שלח expressa uma ordem direta; “mandem” é natural e claro em português.
- source_word: מִכֶּם אֶחָד
  choice: um de vocês
  rationale: A preposição מן com o numeral indica a escolha de uma pessoa dentre o grupo.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: buscar o irmão de vocês
  rationale: Embora לקח normalmente signifique “tomar” ou “pegar”, neste contexto o enviado deve buscar o irmão e trazê-lo até José; “buscar” comunica naturalmente esse movimento em português.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: enquanto vocês ficam detidos
  rationale: O imperativo nifal de אסר pode indicar ser amarrado ou mantido sob custódia. “Ficam detidos” preserva o sentido custodial, e “enquanto” explicita a relação circunstancial natural entre as ordens.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: para que as palavras de vocês sejam postas à prova
  rationale: בחן no nifal denota ser provado ou examinado. “Palavras” conserva a expressão hebraica sem substituí-la pela interpretação mais específica “história” ou “relato”.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: se a verdade está com vocês
  rationale: Preserva a imagem literal do hebraico, “a verdade [está] com vocês”, mantendo-a inteligível em português.
- source_word: וְאִם לֹא
  choice: Mas, se não
  rationale: Introduz o resultado contrário caso a alegação não resista à prova; “mas” comunica adequadamente a oposição discursiva.
- source_word: חֵי פַרְעֹה
  choice: pela vida de Faraó
  rationale: Reproduz de modo conciso a fórmula de juramento que invoca a vida de Faraó.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: certamente vocês são espiões
  rationale: Neste contexto, כִּי tem força enfática ou asseverativa. “Certamente” preserva essa ênfase, e “espiões” traduz diretamente מְרַגְּלִים.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão internacional e boa legibilidade brasileira. Emprega “vocês” para o plural e preserva, com apoio de nota, a imagem hebraica “a verdade está com vocês” e a fórmula de juramento ligada à vida de Faraó.
