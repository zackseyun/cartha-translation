  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: pt
  text: O homem, o senhor da terra, falou conosco duramente e nos tratou como espiões da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: falou conosco duramente
  rationale: Reproduz a construção hebraica com אִתָּנוּ (“conosco”) e o sentido adverbial de קָשׁוֹת (“duramente”, “com aspereza”) em português natural.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: o senhor daquela terra
  rationale: “Senhor” comunica autoridade ou governo; “daquela terra” é natural no relato dos irmãos sobre o território onde estiveram e evita sugerir posse meramente fundiária.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: e nos tratou como espiões
  rationale: O hebraico literalmente diz que ele os “pôs/considerou como” espiões. “Tratou como” expressa adequadamente o valor contextual sem afirmar que eles de fato eram espiões.
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: espiões da terra
  rationale: Preserva a formulação compacta e a referência ao território que supostamente estariam espionando.
