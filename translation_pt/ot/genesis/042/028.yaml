revisions:
- from: 'Ele disse aos seus irmãos: “Minha prata foi devolvida e, vejam, está aqui no meu saco!” Então o coração deles desfaleceu[a], e eles tremeram. Cada um disse ao seu irmão[b]: “O que é isto que Deus fez conosco?”'
  to: 'Ele disse aos seus irmãos: “Minha prata foi devolvida! Vejam, ela está até no meu saco!” Então o coração deles desfaleceu[a], e eles tremeram, dizendo, cada um ao seu irmão[b]: “O que é isto que Deus fez conosco?”'
  rationale: A revisão preserva as escolhas lexicais principais do projeto, representa a ênfase de “e também/eis” por “Vejam, ela está até”, e restabelece a ligação do “dizendo” com o tremor dos irmãos. As notas continuam ancoradas nos termos e construções a que se referem.
