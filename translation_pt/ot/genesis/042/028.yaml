base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: pt
  text: 'Ele disse aos seus irmãos: “Minha prata foi devolvida! Vejam, ela está até no meu saco!” Então o coração deles desfaleceu[a], e eles tremeram, dizendo, cada um ao seu irmão[b]: “O que é isto que Deus fez conosco?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a coragem os abandonou”; literalmente, “o coração deles saiu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uns aos outros”. Literalmente, “cada homem ao seu irmão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: foi devolvida
  rationale: 'O hofal de שׁוב exprime ação passiva: a prata foi feita voltar, isto é, foi devolvida. O pretérito perfeito comunica naturalmente a descoberta de uma ação já realizada.'
- source_word: כַּסְפִּי
  choice: minha prata
  rationale: כֶּסֶף significa literalmente “prata” e, por extensão, dinheiro. “Prata” conserva a concretude e o contexto histórico da narrativa.
- source_word: אַמְתַּחַת
  choice: saco
  rationale: Designa um recipiente usado para transportar cereal ou provisões; “saco” é claro e adequado ao contexto.
- source_word: וְגַם הִנֵּה
  choice: e, vejam, está aqui
  rationale: A formulação preserva a surpresa e a força de chamar a atenção de הִנֵּה, enquanto גַם reforça que a prata estava de fato no saco. Em português, “vejam, está aqui” comunica isso com naturalidade.
- source_word: וַיֵּצֵא לִבָּם
  choice: o coração deles desfaleceu
  rationale: A expressão significa literalmente que o coração deles “saiu” e, no contexto, retrata perda súbita de coragem. A tradução mantém a imagem do coração sem reproduzir um hebraísmo obscuro.
- source_word: וַיֶּחֶרְדוּ
  choice: eles tremeram
  rationale: חרד descreve tremor causado por medo ou angústia. “Tremeram” mantém tanto a dimensão física quanto a emocional.
- source_word: אִישׁ אֶל אָחִיו
  choice: cada um disse ao seu irmão
  rationale: Preserva a forma distributiva e a relação masculina fraterna do hebraico. O verbo “disse” explicita em português a função do infinitivo לֵאמֹר sem alterar o sentido.
- source_word: מַה זֹּאת
  choice: O que é isto
  rationale: Mantém a pergunta exclamativa direta, sem convertê-la numa pergunta interpretativa sobre a razão do acontecimento.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, a sintaxe e o contexto narrativo indicam referência singular a Deus.
theological_decisions:
- issue: Sentido de אֱלֹהִים na pergunta temerosa dos irmãos
  choice: Deus
  alternative: um deus; deuses
  rationale: A construção verbal e o contexto apontam para um referente singular. “Deus” preserva o reconhecimento da ação divina sem acrescentar uma explicação teológica não expressa pelo versículo.
- issue: Expressão relacional masculina אִישׁ אֶל אָחִיו
  choice: cada um disse ao seu irmão
  alternative: disseram uns aos outros
  rationale: A opção principal conserva o caráter distributivo e a linguagem explícita de irmãos presente no texto hebraico; a alternativa idiomática é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem narrativa e as imagens centrais do hebraico foram preservadas, mas hebraísmos potencialmente obscuros são esclarecidos por equivalência idiomática e notas.
