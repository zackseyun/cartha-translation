base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: pt
  text: 'Então ele lavou o rosto, saiu, conteve-se e disse: “Sirvam a comida[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão”; aqui, provavelmente se refere de modo mais amplo à comida ou à refeição que seria servida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: lavou
  rationale: O verbo רחץ significa normalmente “lavar”. No contexto, José lava o rosto depois de chorar em particular.
- source_word: פָּנָיו
  choice: o rosto
  rationale: Embora פָּנִים tenha forma plural em hebraico, refere-se idiomaticamente ao rosto de uma pessoa e pede o singular natural em português.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: יצא indica que José deixou o aposento privado e voltou ao ambiente da refeição; “saiu” preserva diretamente o movimento expresso no hebraico.
- source_word: וַיִּתְאַפַּק
  choice: conteve-se
  rationale: O hitpael de אפק expressa domínio sobre a própria emoção. “Conteve-se” é conciso, natural e mantém a ideia de autocontrole após o choro.
- source_word: שִׂימוּ
  choice: Sirvam
  rationale: O imperativo plural significa literalmente “ponham”, mas, no contexto de uma refeição, ordena que a comida seja posta diante dos presentes. “Sirvam” comunica esse sentido idiomático.
- source_word: לָחֶם
  choice: a comida
  rationale: לֶחֶם significa literalmente “pão”, mas também pode designar por extensão o alimento ou a refeição. Neste banquete, “a comida” comunica com clareza o referente mais amplo, enquanto a nota preserva a expressão literal.
theological_decisions: []
