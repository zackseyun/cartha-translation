base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: pt
  text: 'E eles disseram: “Por favor, meu senhor[a], nós de fato descemos anteriormente para comprar comida.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu senhor” é aqui uma forma respeitosa de dirigir-se a um superior humano, não um título divino.
    reason: cultural_note
  - marker: b
    text: 'O hebraico reforça a afirmação por meio de um infinitivo absoluto junto ao verbo: “nós de fato descemos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Mantém o fluxo narrativo da forma hebraica com waw consecutivo, em português natural.
- source_word: בִּי
  choice: Por favor
  rationale: A interjeição introduz um pedido respeitoso; a tradução literal da preposição não caberia neste uso idiomático.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Preserva o tratamento deferente dirigido a um superior humano, sem transformá-lo em título divino.
- source_word: יָרֹד יָרַדְנוּ
  choice: nós realmente viemos aqui
  rationale: O infinitivo absoluto seguido do verbo finito dá ênfase à declaração. “Realmente” expressa essa força em português corrente; “aqui” transmite naturalmente o movimento de descida ao lugar em que o interlocutor se encontra.
- source_word: בַּתְּחִלָּה
  choice: pela primeira vez
  rationale: No contexto, refere-se à viagem anterior dos irmãos, e não a um começo abstrato.
- source_word: לִשְׁבָּר
  choice: para comprar
  rationale: O verbo denota obter provisões, normalmente mediante compra; esta formulação se ajusta ao objeto expresso.
- source_word: אֹכֶל
  choice: comida
  rationale: Conserva o sentido geral do substantivo, sem restringi-lo a “cereal”, embora esse seja o produto em vista no contexto.
theological_decisions:
- issue: Sentido de אֲדֹנִי
  choice: Tratamento respeitoso a um superior humano
  alternative: Título divino
  rationale: O contexto é o diálogo dos irmãos com o administrador da casa de José; não há referência a Deus neste tratamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Meu senhor” conserva a deferência social do original, e “realmente” explicita sem exagero a ênfase da construção hebraica.
