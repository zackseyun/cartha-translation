  source_fidelity: A tradução capta o pedido respeitoso, o tratamento deferente e a finalidade da viagem. Contudo, «aqui» não está expresso no hebraico e acrescenta uma especificação espacial desnecessária; além disso, «pela primeira vez» pode sugerir uma primeira ocorrência absoluta, ao passo que no contexto בַּתְּחִלָּה se refere à viagem anterior.
  naturalness: «Por favor, meu senhor» é natural e respeitoso. «Descemos anteriormente» é claro em português moderno e evita tanto o acréscimo de «aqui» quanto a ambiguidade potencial de «pela primeira vez».
  terminology: «Meu senhor» preserva adequadamente אֲדֹנִי como tratamento a um superior humano. «Comida» traduz de modo apropriado אֹכֶל sem restringi-lo a cereal. «De fato» comunica de forma idiomática a ênfase da construção de infinitivo absoluto com verbo finito.
