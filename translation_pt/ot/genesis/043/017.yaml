  text: וַ/יַּ֣עַשׂ הָ/אִ֔ישׁ כַּֽ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֥יתָ/ה יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: pt
  text: O homem fez como José disse e levou os homens para dentro da casa de José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה introduz aqui o cumprimento de uma instrução; «fez como» é natural e fiel em português.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O hebraico diz apenas «o homem». Embora o contexto indique um administrador da casa de José, traduzir o cargo acrescentaria uma identificação não expressa neste versículo.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: como José havia ordenado
  rationale: אמר significa literalmente «disse», mas, no contexto imediato, as palavras de José constituem uma ordem. «Havia ordenado» comunica naturalmente a relação temporal e o cumprimento da instrução.
- source_word: וַיָּבֵא
  choice: levou
  rationale: O hifil de בוא tem sentido causativo, «fazer entrar/trazer». Com o destino expresso e do ponto de vista narrativo externo, «levou ... para dentro» é idiomático em português.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Preserva o termo genérico do hebraico, sem substituí-lo por «os irmãos», embora sejam eles os referentes no contexto.
- source_word: בֵּיתָה יוֹסֵף
  choice: para dentro da casa de José
  rationale: O ה direcional em בֵּיתָה indica movimento em direção à casa; o contexto favorece entrada, bem expressa por «para dentro da casa».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de «o homem» no segundo enunciado foi evitada por elipse natural do sujeito, sem perda de referente. Não se acrescentou o título contextual «administrador» ou «mordomo».
