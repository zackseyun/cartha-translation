  text: וַ/יִּקְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת הַ/מִּנְחָ֣ה הַ/זֹּ֔את וּ/מִשְׁנֶה כֶּ֛סֶף לָקְח֥וּ בְ/יָדָ֖/ם וְ/אֶת בִּנְיָמִ֑ן וַ/יָּקֻ֨מוּ֙ וַ/יֵּרְד֣וּ מִצְרַ֔יִם וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יוֹסֵֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: pt
  text: Então os homens pegaram aquele presente e levaram consigo o dobro do dinheiro[a] e Benjamim. Partiram, desceram ao Egito[b] e se apresentaram diante de José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “prata”; aqui, no sentido de dinheiro.'
    reason: lexical_alternative
  - marker: b
    text: “Desceram ao Egito” conserva a expressão geográfica habitual para a viagem de Canaã ao Egito.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְחָה
  choice: presente
  rationale: No contexto, são bens levados a uma autoridade para obter seu favor, não uma oferta de culto.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: o dobro do dinheiro
  rationale: Expressa naturalmente a quantia duplicada em relação ao pagamento anterior.
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora o sentido básico seja 'prata', aqui o termo designa o meio de pagamento.
- source_word: בְיָדָם
  choice: consigo
  rationale: Traduz em português natural o idioma hebraico de posse e transporte, literalmente 'na mão deles'.
- source_word: וְאֶת בִּנְיָמִן
  choice: e Benjamim
  rationale: Mantém Benjamim como mais um objeto do verbo 'pegar/levar', sem acrescentar interpretação.
- source_word: וַיָּקֻמוּ
  choice: partiram
  rationale: No relato de viagem, levantar-se introduz a partida; 'partiram' comunica naturalmente essa função.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: desceram ao Egito
  rationale: Preserva o idioma geográfico hebraico usado para a viagem de Canaã ao Egito.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: se apresentaram diante de José
  rationale: Comunica o sentido convencional de comparecer à presença de uma autoridade, em português claro e digno.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Conserva a designação explícita do hebraico, em vez de substituí-la pelo contextual 'irmãos'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção 'levaram consigo' verte naturalmente o idioma hebraico 'na mão deles', enquanto 'desceram ao Egito' preserva a imagem geográfica do original.
