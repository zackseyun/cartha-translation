  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: pt
  text: 'Então Israel, o pai deles, lhes disse: “Se tem de ser assim, façam o seguinte: peguem alguns dos melhores produtos da terra[a] em seus recipientes e levem ao homem um presente: um pouco de bálsamo, um pouco de mel[b], goma aromática e ládano[c], pistaches e amêndoas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguns dos produtos mais apreciados da terra”. A expressão hebraica se refere de modo amplo a produtos selecionados da terra, não apenas a frutas.
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, “mel” pode se referir a um xarope doce, e não ao mel de abelhas.
    reason: lexical_alternative
  - marker: c
    text: A identificação exata dos termos hebraicos traduzidos como “goma aromática” e “ládano” é incerta. Eles podem designar outras resinas aromáticas; traduções tradicionais incluem “goma” e “mirra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Israel, o pai deles
  rationale: Preserva o uso narrativo de “Israel” para Jacó e a relação apositiva do hebraico, com pontuação natural em português.
- source_word: אִם כֵּן אֵפוֹא
  choice: Se tem de ser assim
  rationale: Expressa a concessão relutante de Israel às circunstâncias, com mais força do que o simples “se é assim”.
- source_word: זֹאת עֲשׂוּ
  choice: façam o seguinte
  rationale: Imperativo claro e idiomático em português moderno.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: alguns dos melhores produtos da terra
  rationale: A expressão designa produtos selecionados ou apreciados da terra, sem se limitar a frutas.
- source_word: בִּכְלֵיכֶם
  choice: em seus recipientes
  rationale: Mantém o sentido genérico de objetos usados para conter ou transportar, sem especificar indevidamente sacos ou vasilhas.
- source_word: וְהוֹרִידוּ
  choice: levem ... no Egito
  rationale: O verbo descreve levar algo para baixo, isto é, em direção ao Egito; a formulação comunica naturalmente o movimento contextual em português.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: Retoma o oficial egípcio já conhecido na narrativa sem explicitar sua identidade.
- source_word: מִנְחָה
  choice: um presente
  rationale: No contexto diplomático, “presente” é natural e evita a conotação exclusivamente cultual de “oferta”.
- source_word: מְעַט צֳרִי
  choice: um pouco de bálsamo
  rationale: “Bálsamo” é uma designação tradicional, compreensível e suficientemente ampla para a resina medicinal ou aromática.
- source_word: וּמְעַט דְּבַשׁ
  choice: um pouco de mel
  rationale: “Mel” é o sentido normal, embora o termo também possa designar xarope doce em certos contextos; a alternativa é registrada em nota.
- source_word: נְכֹאת
  choice: goma aromática
  rationale: A identificação botânica é incerta; “goma aromática” comunica a categoria provável sem alegar precisão indevida.
- source_word: לֹט
  choice: ládano
  rationale: O termo provavelmente designa uma resina aromática, muitas vezes identificada como ládano; a incerteza e alternativas tradicionais são preservadas em nota.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: pistaches e amêndoas
  rationale: Equivalentes botânicos usuais e claros em português contemporâneo.
