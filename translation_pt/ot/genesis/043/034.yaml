base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: pt
  text: Ele lhes enviou porções que estavam diante dele[a], mas a porção de Benjamim era cinco vezes maior que a de qualquer um deles[b]. Então eles beberam e se embriagaram com ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante dele”; provavelmente, as porções vinham do lugar de José no banquete.
    reason: cultural_note
  - marker: b
    text: Literalmente, “cinco mãos”, expressão hebraica que indica uma quantidade cinco vezes maior.
    reason: lexical_alternative
  - marker: c
    text: Ou, de modo mais suave, “ficaram alegres”; o verbo hebraico significa mais diretamente “embriagar-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: mandou servir ... porções
  rationale: No contexto do banquete, a expressão indica que José fez chegar aos convidados porções de comida; esta formulação é natural em português e mantém a ação causativa implícita no contexto.
- source_word: מֵאֵת פָּנָיו
  choice: tiradas da mesa diante dele
  rationale: A expressão significa literalmente 'de diante de seu rosto'. A tradução conserva a imagem espacial e explicita com moderação o contexto da refeição, sem afirmar necessariamente que se tratava da própria mesa de José.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: a porção de Benjamim
  rationale: O substantivo designa aqui a porção de comida destinada a Benjamim.
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: cinco vezes maior que a de qualquer um deles
  rationale: A expressão idiomática 'cinco mãos' indica uma medida cinco vezes superior; 'qualquer um deles' comunica naturalmente a comparação distributiva com as porções dos demais.
- source_word: וַיִּשְׁתּוּ
  choice: beberam
  rationale: Tradução direta do verbo narrativo no contexto do banquete.
- source_word: וַיִּשְׁכְּרוּ
  choice: se embriagaram
  rationale: O verbo hebraico indica diretamente intoxicação por bebida; a tradução evita suavizá-lo para mera alegria ou animação.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Mantém o pronome hebraico, cujo referente, José, é claro no contexto.
