- from: E aconteceu que, quando chegamos ao lugar de pouso e abrimos os nossos sacos, eis que a prata de cada um estava na boca do seu saco[a] — a nossa prata, com o seu peso exato[b] —, e nós a trouxemos de volta em nossas mãos.
  to: 'E aconteceu que, quando chegamos ao lugar de pouso e abrimos os nossos sacos, eis que a prata de cada um estava na boca do seu saco[a]: a nossa prata, com o seu peso exato; e nós a trouxemos de volta em nossas mãos.'
  rationale: Ajustada exclusivamente a pontuação da oração para uma sintaxe portuguesa mais natural. As notas foram preservadas; a nota b continua pertinente à expressão «com o seu peso exato», embora o seu marcador não seja necessário no texto corrido, pois a alternativa é claramente identificável pela formulação da nota.
