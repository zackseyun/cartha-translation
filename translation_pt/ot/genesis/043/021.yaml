  text: וַֽ/יְהִ֞י כִּי בָ֣אנוּ אֶל הַ/מָּל֗וֹן וַֽ/נִּפְתְּחָ/ה֙ אֶת אַמְתְּחֹתֵ֔י/נוּ וְ/הִנֵּ֤ה כֶֽסֶף אִישׁ֙ בְּ/פִ֣י אַמְתַּחְתּ֔/וֹ כַּסְפֵּ֖/נוּ בְּ/מִשְׁקָל֑/וֹ וַ/נָּ֥שֶׁב אֹת֖/וֹ בְּ/יָדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: pt
  text: 'E aconteceu que, quando chegamos ao lugar de pouso e abrimos os nossos sacos, eis que a prata de cada um estava na boca do seu saco[a]: a nossa prata, com o seu peso exato; e nós a trouxemos de volta em nossas mãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na abertura do seu saco”. O hebraico diz literalmente “na boca do seu saco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: o lugar de pouso
  rationale: Designa o lugar onde viajantes passam a noite, sem necessariamente indicar uma hospedaria comercial; a expressão é clara e não especifica além do hebraico.
- source_word: וַנִּפְתְּחָה
  choice: abrimos
  rationale: A forma com terminação paragógica funciona aqui narrativamente na primeira pessoa do plural.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: os nossos sacos / seu saco
  rationale: O termo se refere a sacos de viagem ou para cereais; “saco” se ajusta ao contexto da narrativa de José.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a força de descoberta súbita e a vivacidade narrativa da partícula hebraica.
- source_word: כֶּסֶף אִישׁ
  choice: a prata de cada um
  rationale: Expressa o valor distributivo de אִישׁ e mantém “prata”, o referente lexical explícito no hebraico.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: na boca do seu saco
  rationale: Mantém a imagem idiomática hebraica, compreensível em português, indicando a abertura do saco.
- source_word: כַּסְפֵּנוּ
  choice: a nossa prata
  rationale: Mantém a referência explícita à prata e a coerência lexical dentro do versículo.
- source_word: בְּמִשְׁקָלוֹ
  choice: com o seu peso exato
  rationale: Comunica que a quantidade devolvida correspondia integralmente ao valor pesado, sem perda.
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: nós a trouxemos de volta
  rationale: Reflete o wayyiqtol na sequência narrativa do discurso e indica o retorno da prata ao Egito.
- source_word: בְּיָדֵנוּ
  choice: em nossas mãos
  rationale: Conserva a imagem concreta do hebraico em forma idiomática natural no português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a vivacidade de “eis que” e a imagem hebraica da “boca” do saco, enquanto esclarece em nota as alternativas idiomáticas.
