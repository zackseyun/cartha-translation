base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: pt
  text: 'Ele disse: “Paz seja com vocês. Não tenham medo. O Deus de vocês e o Deus de seu pai lhes deu um tesouro[a] em seus sacos. A prata de vocês chegou até mim[b]”. Então trouxe Simeão para fora, até eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um tesouro escondido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O dinheiro de vocês chegou até mim”. Em hebraico, “prata” muitas vezes significa dinheiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Paz seja com vocês
  rationale: A expressão funciona como saudação e garantia tranquilizadora. Esta formulação preserva o núcleo lexical de שָׁלוֹם e soa natural em português atual.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: Imperativo negativo plural traduzido de modo claro e corrente, sem perder a força direta do hebraico.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: O Deus de vocês e o Deus de seu pai
  rationale: Neste contexto, אֱלֹהִים designa o Deus singular da família. O singular 'pai' reproduz אֲבִיכֶם, sem generalizá-lo como 'antepassados'.
- source_word: נָתַן לָכֶם
  choice: lhes deu
  rationale: O perfeito hebraico indica uma ação já realizada cujo resultado explica a presença do tesouro nos sacos; o pretérito perfeito é natural em português.
- source_word: מַטְמוֹן
  choice: tesouro
  rationale: O substantivo pode designar algo escondido ou armazenado. 'Tesouro' é conciso e idiomático; a nuance de ocultação é preservada em nota.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: em seus sacos
  rationale: O termo se refere aos sacos usados para transportar cereal, e 'sacos' se ajusta melhor ao contexto antigo do que o genérico 'bolsas'.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: A prata de vocês chegou até mim
  rationale: כֶּסֶף significa literalmente 'prata' e frequentemente designa dinheiro. A tradução mantém tanto a imagem concreta quanto o movimento expresso por 'chegou até mim'.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Então trouxe Simeão para fora, até eles
  rationale: O hifil de יצא significa 'fazer sair' ou 'trazer para fora'. A redação conserva essa direção, provavelmente indicando sua saída do lugar de custódia, e 'Então' dá fluidez à sequência narrativa.
theological_decisions:
- issue: A referência a Deus na fala do administrador
  choice: Reproduzir diretamente a referência ao Deus dos irmãos e ao Deus de seu pai, sem definir a fé pessoal do administrador.
  alternative: Entender a fala apenas como cortesia diplomática ou como prova de plena fé pessoal.
  rationale: O hebraico registra as palavras do administrador, mas não explica sua convicção interior. A tradução preserva essa tensão sem acrescentar um juízo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “vocês” para marcar com clareza os plurais do hebraico e “seu pai” para preservar o singular do texto-fonte. As notas foram posicionadas junto aos termos a que realmente se referem.
