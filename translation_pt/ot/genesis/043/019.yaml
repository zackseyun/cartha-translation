  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: pt
  text: Então eles se aproximaram do homem que administrava a casa de José e falaram com ele à entrada da casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto à porta da casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: se aproximaram
  rationale: Expressa de modo natural em português o movimento de chegar perto de alguém indicado por נגשׁ na sequência narrativa.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Preserva a designação genérica do hebraico sem introduzir um cargo específico, como “administrador” ou “mordomo”, no núcleo nominal.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: que administrava a casa de José
  rationale: A construção com עַל indica autoridade e responsabilidade sobre a casa entendida como unidade doméstica; “administrava” comunica essa função com clareza e naturalidade.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: e falaram com ele
  rationale: דבר com אֶל denota falar a alguém; esta formulação introduz naturalmente o conteúdo da fala no versículo seguinte.
- source_word: פֶּתַח הַבָּיִת
  choice: à entrada da casa
  rationale: פֶּתַח pode designar a entrada, abertura ou porta. “À entrada da casa” é idiomático e preserva a localização sem especificar além do texto.
