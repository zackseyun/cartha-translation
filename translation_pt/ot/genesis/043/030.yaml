base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: pt
  text: Então José se apressou, pois ficou profundamente comovido por seu irmão[a], e procurou onde chorar[b]. Entrou no quarto e chorou ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as suas compaixões por seu irmão se agitaram” ou “se aqueceram”. Trata-se de um idioma hebraico para uma emoção profunda.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “procurou chorar”; pelo contexto, procurou um lugar onde pudesse chorar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se apressou
  rationale: Traduz diretamente o verbo “apressar-se”, sem acrescentar a ideia de que José “saiu”, que não está expressa no hebraico.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: ficou profundamente comovido
  rationale: Expressa em português natural a intensidade do idioma hebraico, no qual as compaixões de José são descritas como aquecidas ou agitadas.
- source_word: אֶל אָחִיו
  choice: por seu irmão
  rationale: Indica de modo idiomático o alvo da profunda emoção de José, sem acrescentar o nome de Benjamim ao texto.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: procurou onde chorar
  rationale: O hebraico diz literalmente que ele “procurou chorar”; o contexto indica que buscava um lugar reservado para fazê-lo.
- source_word: הַחַדְרָה
  choice: no quarto
  rationale: O substantivo designa um cômodo ou aposento interior; “quarto” é claro, atual e adequado ao contexto de privacidade.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: e chorou ali
  rationale: Preserva tanto o verbo comum para chorar quanto a ênfase locativa de שָׁמָּה.
