base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: pt
  text: 'E Judá disse a Israel, seu pai: “Mande o rapaz[a] comigo. Vamos nos levantar e partir, para que vivamos e não morramos — nós, você e nossos pequeninos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o menino” ou “o jovem”. O termo hebraico pode se referir a um menino, a um jovem ou a um jovem adulto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E” preserva esse fluxo sem especificar uma relação temporal ou causal mais forte.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israel, seu pai
  rationale: Mantém o nome “Israel” presente no hebraico e explicita naturalmente a relação apositiva em português.
- source_word: שִׁלְחָה
  choice: Mande
  rationale: Traduz diretamente o imperativo de שלח; o he paragógico não exige representação distinta em português.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נער pode designar menino, jovem ou jovem adulto. “Rapaz” se ajusta à idade de Benjamim no contexto sem eliminar a perspectiva familiar e protetora de Judá.
- source_word: אִתִּי
  choice: comigo
  rationale: Expressa de modo direto que Benjamim irá acompanhado por Judá, que assume responsabilidade pessoal por ele.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Vamos nos levantar e partir
  rationale: As formas cohortativas conclamam a uma ação conjunta. A tradução conserva os dois verbos e comunica a saída imediata em português corrente.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: para que vivamos e não morramos
  rationale: A formulação apresenta a finalidade ou resultado esperado da viagem e preserva o contraste enfático entre viver e morrer.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: nós, você e nossos pequeninos
  rationale: A enumeração mantém os três grupos abrangidos pelo גם repetido. O travessão dá destaque inclusivo à lista sem recorrer a uma construção portuguesa artificial.
- source_word: טַפֵּנוּ
  choice: nossos pequeninos
  rationale: טף se refere especialmente às crianças pequenas ou aos dependentes vulneráveis da família; “pequeninos” preserva essa nuance.
