  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: pt
  text: Quando José entrou na casa, eles lhe trouxeram o presente[a] que tinham nas mãos para dentro da casa[b] e se curvaram diante dele até o chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tributo”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a expressão direcional relativa à “casa”: primeiro ao narrar a entrada de José e depois ao narrar que os irmãos levaram o presente para dentro.'
    reason: source_note
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: entrou em casa
  rationale: O verbo בוא com o ה direcional indica movimento para dentro da casa; “entrou em casa” é natural em português e exprime claramente o destino.
- source_word: וַיָּבִיאוּ לוֹ
  choice: lhe trouxeram
  rationale: O hifil de בוא significa “trazer”, e o pronome dativo “lhe” preserva José como destinatário.
- source_word: הַמִּנְחָה
  choice: o presente
  rationale: מִנְחָה pode designar presente, tributo ou oferta. Neste contexto, trata-se do presente diplomático levado pelos irmãos, não de uma oferta cultual.
- source_word: אֲשֶׁר בְּיָדָם
  choice: que tinham nas mãos
  rationale: Mantém a imagem concreta do hebraico, literalmente “que estava nas mãos deles”, em formulação corrente e clara.
- source_word: הַבָּיְתָה
  choice: para dentro da casa
  rationale: A segunda ocorrência da forma direcional é preservada, refletindo a repetição intencional do texto hebraico.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: se curvaram diante dele até o chão
  rationale: Expressa o gesto profundo de reverência indicado por שחה e conserva a direção descendente de אָרְצָה sem acrescentar que o rosto tocou o chão.
