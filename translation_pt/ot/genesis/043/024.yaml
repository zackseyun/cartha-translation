  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: pt
  text: O homem levou os homens para dentro da casa de José e lhes deu água; eles lavaram os pés, e ele deu alimento aos jumentos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o homem” e “os homens”; o contexto deixa claro que eram o encarregado da casa de José e os irmãos de José.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: levou ... para dentro
  rationale: O hifil de בוא expressa movimento causativo para o interior; esta formulação natural preserva tanto a ação de conduzir quanto a direção indicada pelo hebraico.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: O homem / os homens
  rationale: Mantém os substantivos genéricos do hebraico, sem explicitar aqui que se trata do encarregado da casa de José e dos irmãos de José.
- source_word: בֵּיתָה יוֹסֵף
  choice: para dentro da casa de José
  rationale: A terminação direcional em בֵּיתָה indica entrada na casa, e não apenas deslocamento até ela.
- source_word: וַיִּתֶּן מַיִם
  choice: lhes deu água
  rationale: O pronome indireto é recuperado naturalmente do contexto em português, embora não esteja expresso no hebraico.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: eles lavaram os pés
  rationale: O verbo está na voz ativa e no plural; a tradução evita sugerir que outra pessoa lhes lavou os pés.
- source_word: מִסְפּוֹא
  choice: alimento
  rationale: No contexto, designa alimento para animais; 'alimento' é corrente e claro, enquanto 'forragem' seria mais técnico.
- source_word: לַחֲמֹרֵיהֶם
  choice: aos jumentos deles
  rationale: Preserva o beneficiário/objeto indireto marcado pela preposição hebraica e usa uma referência possessiva inequívoca.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O ponto e vírgula separa naturalmente a ação do homem da ação dos homens, evitando paralelismo ambíguo. Mantêm-se os termos genéricos do hebraico e a sequência narrativa.
