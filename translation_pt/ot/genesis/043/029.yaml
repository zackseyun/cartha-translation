base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: pt
  text: 'Ele ergueu os olhos e viu Benjamim, seu irmão, filho de sua mãe,[a] e disse: “É este o irmão mais novo de vocês, de quem me falaram?” E disse: “Que Deus lhe seja bondoso, meu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ressalta que Benjamim era irmão de José pela mesma mãe.
    reason: Esclarece a ênfase da expressão hebraica “filho de sua mãe”, sem acrescentar dados contextuais não expressos na frase.
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ele ergueu os olhos
  rationale: Preserva a expressão hebraica vívida em uma forma natural e digna em português; “olhou para cima” seria possível, mas menos próxima da imagem do texto.
- source_word: וַיַּרְא אֶת־בִּנְיָמִין
  choice: e viu Benjamim
  rationale: Traduz diretamente o verbo de percepção e usa a forma portuguesa tradicional do nome.
- source_word: אָחִיו בֶּן־אִמּוֹ
  choice: seu irmão, filho de sua mãe
  rationale: Mantém a construção explicativa do hebraico e sua ênfase no vínculo materno entre José e Benjamim, sem comprimi-la em “irmão de pai e mãe” no texto principal.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: o irmão mais novo de vocês
  rationale: No contexto da família, הַקָּטֹן identifica o irmão mais novo, não alguém de baixa estatura. “De vocês” oferece leitura clara tanto no Brasil quanto em outras variedades do português.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: de quem me falaram
  rationale: Reproduz de modo natural e relativamente próximo a referência ao irmão sobre quem eles haviam falado a José.
- source_word: אֱלֹהִים יָחְנְךָ
  choice: Que Deus seja bondoso com você
  rationale: Expressa a força volitiva da bênção hebraica e o favor gracioso indicado por חנן em linguagem atual e amplamente compreensível.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o tratamento masculino singular e afetuoso do original.
theological_decisions:
- issue: Forma da bênção com אֱלֹהִים e o verbo חנן
  choice: Que Deus seja bondoso com você, meu filho!
  alternative: Que Deus lhe conceda graça, meu filho!
  rationale: A construção com “Que” comunica naturalmente o valor de desejo ou bênção do hebraico. “Seja bondoso” preserva a ideia de favor gracioso sem transformar “graça” em um conceito técnico nem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a repetição do vínculo familiar foram preservadas; “então perguntou” torna explícita, sem ampliar o sentido, a função interrogativa da primeira fala.
