base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: pt
  text: 'Quando acabaram de comer o cereal que haviam trazido do Egito, o pai lhes disse: “Voltem e comprem um pouco de alimento para nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal. Em português, “Quando” transmite naturalmente a sequência sem a rigidez de “E aconteceu que, quando”.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: acabaram de comer
  rationale: A construção com כלה e infinitivo indica a conclusão do ato de comer; esta formulação é corrente e clara em português.
- source_word: הַשֶּׁבֶר
  choice: o cereal
  rationale: No relato de José, o substantivo designa cereal adquirido durante a fome. “Cereal” preserva essa especificidade e tem compreensão internacional mais ampla que usos regionais de “grão”.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: haviam trazido do Egito
  rationale: O mais-que-perfeito composto esclarece que eles trouxeram o cereal antes de o consumirem por completo.
- source_word: אֲבִיהֶם
  choice: o pai lhes disse
  rationale: Preserva o termo relacional hebraico; a colocação pronominal evita a repetição menos fluida de “o pai deles disse a eles”.
- source_word: שֻׁבוּ
  choice: Voltem
  rationale: O imperativo pede que os irmãos façam outra viagem ao Egito. “Voltem” é natural, direto e mantém a ideia de retorno.
- source_word: שִׁבְרוּ
  choice: comprem
  rationale: Neste contexto, o verbo significa comprar cereal ou provisões. Como o objeto expresso é אֹכֶל, o verbo geral “comprar” evita acrescentar uma especificação ausente.
- source_word: לָנוּ
  choice: para nós
  rationale: Explicita naturalmente em português o valor benefactivo do dativo hebraico.
- source_word: מְעַט אֹכֶל
  choice: um pouco de alimento
  rationale: Mantém tanto a pequena quantidade indicada por מְעַט quanto o sentido geral de אֹכֶל, sem restringi-lo novamente a cereal.
