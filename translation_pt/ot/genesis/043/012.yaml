base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: pt
  text: Levem com vocês o dobro do dinheiro e levem de volta o dinheiro que foi recolocado na abertura dos seus sacos;[a] talvez tenha sido um engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na boca dos seus sacos”, isto é, na abertura dos sacos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: o dobro do dinheiro
  rationale: Expressa naturalmente em português um montante duplicado, preservando a força quantitativa de מִשְׁנֶה sem decidir se a referência é ao preço exato da compra anterior ou a uma quantia adicional equivalente.
- source_word: קְחוּ בְיֶדְכֶם
  choice: Levem com vocês
  rationale: A expressão hebraica usa literalmente “na mão de vocês” para indicar aquilo que se leva consigo. A tradução idiomática evita sugerir que todo o dinheiro deveria ser fisicamente carregado nas mãos.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: o dinheiro que foi posto
  rationale: O particípio passivo indica que o dinheiro foi feito voltar, isto é, recolocado nos sacos. “Foi posto” funciona naturalmente com a indicação de lugar e não sugere que os irmãos já o tivessem devolvido.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: na abertura dos seus sacos
  rationale: O hebraico diz literalmente “na boca dos seus sacos”. “Abertura” comunica com clareza o sentido da metáfora em português moderno, enquanto a imagem literal é preservada em nota.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: Levem também de volta
  rationale: O Hifil de שוב exprime fazer voltar ou trazer de volta. A formulação natural em português transmite tanto o movimento de retorno quanto o ato de carregar consigo.
- source_word: אוּלַי
  choice: talvez
  rationale: Equivalente direto e corrente que preserva a incerteza do enunciado.
- source_word: מִשְׁגֶּה
  choice: um engano
  rationale: Designa erro ou equívoco. “Engano” é claro no contexto comercial e não implica necessariamente fraude ou culpa moral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preferiu-se a expressão idiomática “com vocês” ao hebraísmo “na mão de vocês”, e “abertura” à imagem literal “boca”, registrada em nota. A repetição de “Levem” conserva parcialmente o paralelismo das duas ordens hebraicas.
