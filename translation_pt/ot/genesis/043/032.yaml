base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: pt
  text: Serviram-lhe à parte, aos irmãos à parte e aos egípcios que comiam com ele, à parte; pois os egípcios não podiam comer pão com os hebreus,[a] porque isso era uma abominação para os egípcios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “comer pão com os hebreus”, expressão que significa compartilhar uma refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Serviram
  rationale: Embora o verbo signifique literalmente “puseram” ou “colocaram”, no contexto da refeição indica que a comida foi posta diante dos diferentes grupos; “serviram” expressa isso naturalmente em português.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: à parte
  rationale: A expressão marca separação entre José, seus irmãos e os egípcios. “À parte” preserva com naturalidade a estrutura repetida e a divisão social.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: que comiam com ele
  rationale: O particípio descreve os egípcios que tomavam a refeição com José; o imperfeito narrativo em português mantém a cena em andamento.
- source_word: לֹא יוּכְלוּן
  choice: não podiam
  rationale: Conserva a ideia de impossibilidade decorrente de uma norma ou barreira social, sem especificar além do hebraico se era incapacidade ritual, cultural ou costumeira.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: comer com os hebreus
  rationale: A formulação hebraica “comer pão com” é um idiomatismo para compartilhar uma refeição. A tradução comunica diretamente o sentido em português corrente.
- source_word: תוֹעֵבָה
  choice: uma abominação
  rationale: Mantém a força do termo hebraico, que designa algo considerado profundamente repugnante ou inaceitável, inclusive em sentido cultural ou ritual.
- source_word: מִצְרִים / הָעִבְרִים
  choice: os egípcios / os hebreus
  rationale: Preserva o contraste explícito entre os dois grupos étnicos e representa naturalmente os artigos definidos do hebraico.
theological_decisions:
- issue: Natureza da impossibilidade de os egípcios comerem com os hebreus
  choice: não podiam comer com os hebreus
  alternative: recusavam-se a comer com os hebreus
  rationale: O hebraico exprime literalmente incapacidade ou impossibilidade e não declara diretamente uma recusa voluntária. A tradução preserva essa abertura, enquanto o motivo seguinte esclarece o tabu cultural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “à parte” reproduz a ênfase hebraica na separação dos três grupos. “Aos irmãos” explicita o referente contextual de “a eles” para evitar ambiguidade pouco natural em português.
