base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: pt
  text: Eles se sentaram diante dele, desde o primogênito, segundo a sua primogenitura, até o mais novo, segundo a sua idade; e os homens olharam uns para os outros, espantados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Eles se sentaram
  rationale: O wayyiqtol de ישׁב está na voz ativa e descreve a ação narrativa de tomar assento; o contexto, sem necessidade de uma forma passiva, indica que os lugares haviam sido organizados.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente espacial natural de פני com sufixo pronominal, preservando a relação dos homens com José.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: desde o primogênito, segundo a sua primogenitura
  rationale: Mantém a ligação lexical entre בכור e בכורה e expressa a posição determinada pela ordem de nascimento; 'desde... até' torna natural em português a extensão da sequência implícita entre os extremos.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: até o mais novo, segundo a sua idade
  rationale: No contraste com o primogênito e no contexto de todos os irmãos, צעיר tem sentido superlativo. 'Segundo a sua idade' comunica de modo claro a ordenação relativa indicada pelo substantivo צעירה.
- source_word: וַיִּתְמְהוּ
  choice: olharam uns para os outros, espantados
  rationale: תמה denota espanto ou admiração. Com איש אל־רעהו, a formulação explicita naturalmente em português a reação recíproca sem alterar sua causa.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Preserva a designação explícita do hebraico, em vez de substituí-la pela identificação contextual 'os irmãos'.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: uns para os outros
  rationale: Equivalente idiomático português para a construção distributiva e recíproca 'cada um para o seu companheiro'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A tradução conserva 'primogênito/primogenitura', mas usa 'segundo a sua idade' para comunicar com clareza o valor contextual de צעירה. A construção 'desde... até' apresenta naturalmente a disposição de todos por ordem de nascimento.
