  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: pt
  text: E trouxemos conosco[c] mais prata[a] para comprar comida[b]. Não sabemos quem pôs a nossa prata em nossos sacos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dinheiro”, nas duas ocorrências de “prata”; o termo hebraico pode designar tanto o metal quanto o dinheiro usado como pagamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “cereal”; a expressão pode referir-se especificamente à compra de cereal, embora o substantivo empregado aqui tenha o sentido mais amplo de “comida”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “em nossa mão”.
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: E ... mais prata
  rationale: כֶּסֶף designa literalmente a prata e, por extensão, o dinheiro; “prata” preserva a imagem concreta e a repetição do hebraico. אַחֵר indica uma quantia adicional, expressa naturalmente por “mais” em português.
- source_word: הוֹרַדְנוּ
  choice: trouxemos
  rationale: O hifil de ירד significa literalmente “fazer descer, levar para baixo”. No contexto da viagem de Canaã ao Egito, “trouxemos” comunica naturalmente o movimento até o lugar onde os irmãos agora estão, sem tornar a frase portuguesa artificial.
- source_word: בְ/יָדֵ/נוּ
  choice: conosco
  rationale: A expressão hebraica literalmente “em nossa mão” significa que levavam a prata em sua posse. “Conosco” é o equivalente idiomático mais claro em português; a forma literal é preservada em nota.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: para comprar comida
  rationale: Neste contexto, שׁבר significa comprar provisões, especialmente cereal, enquanto אֹכֶל é o termo mais amplo para alimento ou comida. A tradução conserva essa amplitude.
- source_word: לֹא יָדַעְנוּ
  choice: Não sabemos
  rationale: O perfeito hebraico pode descrever o estado presente resultante de desconhecimento anterior. Na fala direta, “Não sabemos” expressa naturalmente a alegação atual dos irmãos.
- source_word: שָׂם
  choice: pôs
  rationale: שׂים significa “pôr, colocar”. “Pôs” é direto, atual e natural neste contexto.
- source_word: כַּסְפֵּ/נוּ
  choice: a nossa prata
  rationale: A repetição de “prata” reproduz a repetição de כֶּסֶף no hebraico e mantém visível a forma concreta do pagamento.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: em nossos sacos
  rationale: אַמְתַּחַת é um saco ou bolsa de carga usado para transportar mantimentos. “Sacos” se ajusta ao contexto do cereal e é claro em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Conosco” evita reproduzir de modo artificial o singular idiomático hebraico “em nossa mão”, enquanto a nota conserva a forma do original. “Prata” mantém a concretude e a repetição lexical do hebraico.
