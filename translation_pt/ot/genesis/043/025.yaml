  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: pt
  text: E prepararam o presente até Yosef chegar ao meio-dia, pois tinham ouvido que comeriam pão ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “comer pão” pode ser uma expressão idiomática para fazer uma refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: prepararam
  rationale: O hifil de כון indica pôr algo em ordem ou deixá-lo pronto; “prepararam” é natural e mantém o presente como objeto.
- source_word: הַמִּנְחָה
  choice: o presente
  rationale: Neste contexto narrativo, מִנְחָה é o presente levado pelos irmãos a Yosef, não uma oferta cultual; “presente” evita conotação sacrificial indevida.
- source_word: עַד בּוֹא יוֹסֵף
  choice: até a chegada de Yosef
  rationale: עַד com o infinitivo construto בּוֹא marca o tempo até a chegada de Yosef. A construção nominal é clara e natural em português.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: O termo designa o meio do dia; “ao meio-dia” é a expressão portuguesa corrente.
- source_word: כִּי שָׁמְעוּ
  choice: pois tinham ouvido
  rationale: O primeiro כִּי é causal, e o mais-que-perfeito situa a informação ouvida antes da preparação.
- source_word: כִּי שָׁם
  choice: que ali
  rationale: O segundo כִּי introduz o conteúdo do que ouviram, enquanto שָׁם indica o lugar; a ordem “que ali” é idiomática em português.
- source_word: יֹאכְלוּ לָחֶם
  choice: comeriam pão
  rationale: A tradução conserva a imagem hebraica literal, embora a expressão possa significar participar de uma refeição; a nota esclarece o uso idiomático.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Mantém a transliteração do nome hebraico em conformidade com a orientação do projeto, em vez de substituí-lo pela forma tradicional portuguesa “José”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva-se o hebraísmo “comer pão” no texto e explica-se seu sentido possível em nota, sem eliminar a imagem do original.
