  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: pt
  text: Se você mandar nosso irmão conosco[a], desceremos e compraremos comida para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você estiver disposto a mandar nosso irmão conosco”. A expressão idiomática hebraica com יֵשׁ e um particípio pode indicar tanto disposição quanto a própria ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz de modo natural a condição expressa pela partícula hebraica, sem acrescentar ênfase.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: você mandar
  rationale: A construção com יֵשׁ, sufixo pronominal e particípio pode indicar tanto a disposição quanto o ato de enviar. No período condicional, 'você mandar' é natural e mantém a ação do pai, enquanto a possível nuance de disposição é registrada em nota.
- source_word: אֶת אָחִינוּ
  choice: nosso irmão
  rationale: Reproduz diretamente o substantivo com sufixo de primeira pessoa do plural e preserva a ênfase familiar.
- source_word: אִתָּנוּ
  choice: conosco
  rationale: Expressa de forma concisa e corrente o acompanhamento indicado pelo hebraico.
- source_word: נֵרְדָה
  choice: desceremos
  rationale: O coortativo de primeira pessoa do plural comunica a ação pretendida como consequência da condição; o futuro português transmite isso naturalmente.
- source_word: וְנִשְׁבְּרָה
  choice: e compraremos
  rationale: Neste contexto de obtenção de mantimentos, שׁבר significa comprar. O futuro acompanha naturalmente 'desceremos'.
- source_word: לְךָ
  choice: para você
  rationale: Conserva o sentido benefactivo da preposição com sufixo de segunda pessoa masculina singular.
- source_word: אֹכֶל
  choice: comida
  rationale: O substantivo significa alimento em sentido amplo. 'Comida' é claro e atual, sem restringir indevidamente o referente a grãos.
