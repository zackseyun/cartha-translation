  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: pt
  text: Que Deus Todo-Poderoso lhes conceda misericórdia diante daquele homem, e que ele lhes devolva o outro irmão e Benjamim. Quanto a mim, se eu ficar sem filhos, ficarei sem filhos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Ou, possivelmente: “Como fiquei sem filhos, fiquei sem filhos.” O hebraico repete o mesmo verbo para dar ênfase e expressar a resignação de Jacó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  rationale: Traduz o título divino de modo claro e tradicional em português, preservando sua função de invocação do poder de Deus.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: faça com que aquele homem tenha compaixão de vocês
  rationale: Expressa em português natural a construção hebraica, literalmente ligada a conceder compaixão diante do homem, sem perder a ideia de que Deus deve movê-lo a tratá-los com misericórdia.
- source_word: וְשִׁלַּח לָכֶם
  choice: e deixe voltar com vocês
  rationale: Continua o desejo expresso na oração e comunica, no contexto, a libertação e o retorno do irmão detido.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: o outro irmão de vocês
  rationale: Mantém a referência contextual a Simeão como o irmão que estava detido, distinguindo-o de Benjamim.
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: Preserva a ênfase do pronome hebraico e marca a passagem da oração à resignação pessoal de Jacó.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: se eu tiver de ficar sem meus filhos, ficarei
  rationale: Reproduz a repetição enfática do verbo שׁכל e a resignação de Jacó, esclarecendo em português o sentido de perda dos filhos sem afirmar que essa perda certamente ocorrerá.
theological_decisions:
- issue: Tradução do título divino אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  alternative: El Shaddai
  rationale: O título é traduzido para que seu significado não fique opaco, seguindo a distinção entre traduzir títulos e transliterar nomes; a tradução convencional preserva a invocação da suficiência e do poder divinos.
- issue: Força da declaração final de Jacó
  choice: se eu tiver de ficar sem meus filhos, ficarei
  alternative: como fiquei sem filhos, fiquei sem filhos
  rationale: A construção admite discussão, mas no contexto funciona naturalmente como uma fórmula de resignação diante da perda possível. A tradução evita transformar essa aceitação em certeza fatalista.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais para leitores brasileiros. “Vocês” evita regionalismo excessivo; “aquele homem” retoma de modo claro a autoridade egípcia mencionada no contexto. A declaração final conserva a tensão e a repetição sem recorrer ao termo menos corrente “privado de filhos”.
