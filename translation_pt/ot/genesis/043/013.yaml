  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: pt
  text: Levem também o irmão de vocês[a], levantem-se e voltem ao homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Benjamim.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם
  choice: também o irmão de vocês
  rationale: O וְ acrescenta este objeto ao que já deveria ser levado, enquanto אֲחִיכֶם significa literalmente “o irmão de vocês”. A formulação preserva a referência sem inserir o nome Benjamim no texto.
- source_word: קָחוּ
  choice: Levem
  rationale: Imperativo plural de לקח. Em português, “levem” expressa naturalmente tomar alguém consigo numa viagem; “tomem” seria menos idiomático neste contexto.
- source_word: וְ/ק֖וּמוּ
  choice: levantem-se e
  rationale: Imperativo plural de קום. “Levantem-se” preserva a imagem e a urgência do hebraico; a conjunção liga naturalmente a sequência verbal em português.
- source_word: שׁ֥וּבוּ
  choice: voltem
  rationale: Imperativo plural de שוב no sentido de retornar a um lugar ou pessoa já visitados.
- source_word: אֶל הָ/אִישׁ
  choice: ao homem
  rationale: Tradução direta da preposição אֶל e do substantivo definido הָאִישׁ, sem substituir a expressão contextual por “autoridade egípcia” ou por um nome.
