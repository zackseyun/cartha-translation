  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: pt
  text: Eu mesmo serei responsável por ele. Você poderá exigi-lo de mim. Se eu não o trouxer até você para apresentá-lo diante de você, serei responsável perante você por todos os meus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “terei pecado contra você por todos os meus dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Eu mesmo
  rationale: O pronome independente é enfático e destaca que Judá assume pessoalmente a responsabilidade.
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: serei responsável por ele
  rationale: O verbo expressa a função de fiador ou garantidor; esta formulação é natural em português moderno e conserva a ideia de responsabilidade pessoal.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Você poderá exigi-lo de minhas mãos
  rationale: Mantém a imagem concreta da mão como esfera de responsabilidade e traduz o imperfeito com força modal apropriada à promessa.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: eu não o trouxer até você
  rationale: Traduz diretamente o hifil de בוא e a direção indicada por אֵלֶיךָ, sem acrescentar explicitamente a ideia contextual de retorno.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: e não o apresentar diante de você
  rationale: O verbo no hifil significa colocar ou apresentar; 'apresentar diante de você' comunica com naturalidade a entrega pessoal de Benjamim a Jacó.
- source_word: וְחָטָאתִי לְךָ
  choice: serei culpado para com você
  rationale: Conserva a culpabilidade moral e relacional do verbo חטא, sem reduzir a expressão a mera desaprovação ou importar uma formulação doutrinária abstrata.
- source_word: כָּל הַיָּמִים
  choice: por todos os meus dias
  rationale: Expressa duração vitalícia e preserva a forma pessoal e solene da promessa.
theological_decisions:
- issue: Sentido de וְחָטָאתִי לְךָ em uma promessa interpessoal
  choice: serei culpado para com você
  alternative: terei pecado contra você
  rationale: O verbo é o termo comum para pecar, mas neste contexto descreve a culpa duradoura que Judá assumiria perante o pai. A tradução principal conserva a gravidade moral em português natural, enquanto a nota registra a formulação mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a ênfase de Judá, a imagem hebraica das mãos e a tensão entre culpa relacional e pecado.
