    text: 'Ou, mais literalmente: “terei pecado contra você por todos os meus dias”.'
    reason: lexical_alternative
  revision_rationale: A revisão melhora a naturalidade e corrige o escopo potencialmente ambíguo da condição em português. Mantém-se a responsabilidade pessoal de Judá como equivalente contextual de ערב e preserva-se, em nota, a formulação lexicalmente mais direta de חטא.
