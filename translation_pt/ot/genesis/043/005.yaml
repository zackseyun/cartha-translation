  source_fidelity: A tradução preserva com precisão a estrutura condicional adversativa, a recusa de descer, a relação causal e a condição expressa por בִּלְתִּי. Mantém adequadamente as referências não nomeadas a Benjamim e a José como “o irmão de vocês” e “o homem”. “Não desceremos” conserva o verbo geográfico do hebraico sem explicitar indevidamente o Egito.
  naturalness: O português é moderno, claro e fluente. O emprego de “você” para Jacó e de “vocês” na fala citada aos irmãos é coerente e particularmente legível para o público brasileiro, sem comprometer a compreensão internacional. “A menos que ... esteja com vocês” é uma formulação idiomática e natural.
  terminology: “Ver o meu rosto” reproduz de modo fiel a expressão hebraica e a nota explica apropriadamente seu valor idiomático de comparecer perante alguém. Os termos narrativos “o homem” e “o irmão de vocês” preservam a perspectiva interna do discurso e não antecipam identificações do contexto.
