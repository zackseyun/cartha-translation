id: GEN.43.5
reference: Genesis 43:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: pt
  text: 'Mas, se você não o mandar, não desceremos, porque o homem nos disse: “Vocês não verão o meu rosto[a], a menos que o irmão de vocês esteja com vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ver o meu rosto”, expressão que significa comparecer diante de alguém ou entrar em sua presença.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz um contraste com a condição positiva do versículo anterior; “Mas, se” expressa essa força adversativa de modo natural.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: você não o mandar
  rationale: A construção negativa com particípio indica a decisão de não enviar; o pronome “o”, implícito no hebraico, retoma Benjamim pelo contexto.
- source_word: לֹא נֵרֵד
  choice: não desceremos
  rationale: Preserva o verbo geográfico tradicional para a viagem de Canaã ao Egito e mantém a forma concisa do hebraico.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão pela qual os irmãos não desceriam.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém a perspectiva dos irmãos, que ainda não reconhecem José, sem inserir uma identificação ausente da fala.
- source_word: אָמַר אֵלֵינוּ
  choice: nos disse
  rationale: Tradução natural da fórmula que introduz o discurso direto.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Vocês não verão o meu rosto
  rationale: Preserva a expressão hebraica, compreensível em português, sem apagar seu sentido idiomático de comparecer diante de alguém.
- source_word: בִּלְתִּי
  choice: a menos que
  rationale: Expressa com precisão a condição necessária introduzida pela construção hebraica.
- source_word: אֲחִיכֶם
  choice: o irmão de vocês
  rationale: Conserva a referência não nominal do original; o contexto identifica o irmão como Benjamim.
- source_word: אִתְּכֶם
  choice: esteja com vocês
  rationale: A forma verbal acrescentada torna natural em português a oração nominal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “você” no singular para Jacó e “vocês” no plural dentro da citação dirigida aos irmãos. A expressão geográfica “descer” e o idioma “ver o meu rosto” foram preservados, com esclarecimento em nota.
