base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as slaves, along with our donkeys.”
translation:
  language: pt
  text: 'Os homens ficaram com medo porque tinham sido levados à casa de José e disseram: “É por causa do dinheiro que fora devolvido nos nossos sacos da primeira vez que estamos sendo trazidos para cá, para criar um pretexto contra nós[a], cair sobre nós e nos tomar como escravos, junto com os nossos jumentos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procurar uma ocasião contra nós”. A expressão hebraica traduzida por “criar um pretexto contra nós” é idiomática e de sentido difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: ficaram com medo
  rationale: Expressa naturalmente a reação narrativa indicada por ירא, sem rigidez arcaizante.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: tinham sido levados à casa de José
  rationale: Preserva a forma causativa passiva de בוא e usa o mais-que-perfeito para indicar a ação anterior que provocou o medo.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: por causa do dinheiro
  rationale: Neste contexto, עַל דְּבַר indica causa ou motivo, não apenas assunto.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: que voltou aos nossos sacos
  rationale: Mantém a formulação resultativa de שוב e traduz אַמְתַּחַת como saco de viagem ou de cereal, adequado ao contexto.
- source_word: בַּתְּחִלָּה
  choice: da primeira vez
  rationale: Refere-se naturalmente à viagem anterior dos irmãos ao Egito.
- source_word: מוּבָאִים
  choice: estamos sendo trazidos para cá
  rationale: Preserva o aspecto contínuo e passivo do particípio; 'para cá' torna explícita, sem alterar o sentido, a entrada na casa já mencionada.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: usar isso como pretexto contra nós
  rationale: A expressão idiomática é difícil e parece descrever uma manobra hostil ou a criação de motivo para agir contra eles.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: cair sobre nós
  rationale: Conserva a imagem hebraica e comunica uma investida hostil em português compreensível.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: nos tomar como escravos
  rationale: Indica escravização, e não simples serviço, preservando a gravidade da condição expressa por עֲבָדִים.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: junto com os nossos jumentos
  rationale: Reproduz a inclusão final dos animais entre aquilo que os irmãos temiam que lhes fosse tomado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A fala preserva a progressão do temor dos irmãos e mantém a imagem forte de uma investida hostil.
