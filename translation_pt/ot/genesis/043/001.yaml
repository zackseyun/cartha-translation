lexical_decisions:
- source_word: וְהָרָעָב
  choice: A fome
  rationale: רָעָב, neste contexto narrativo, designa uma fome generalizada. O וְ inicial marca continuidade; em português, essa ligação pode ficar implícita sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: כָּבֵד
  choice: era severa
  rationale: Embora o sentido básico seja “pesado”, aplicado à fome o termo expressa intensidade. “Severa” transmite naturalmente esse valor em português.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ refere-se aqui à terra ou região atingida, não necessariamente ao mundo inteiro. “Na terra” preserva a formulação concisa e a referência contextual.
