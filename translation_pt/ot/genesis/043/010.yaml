  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: pt
  text: Pois, se não tivéssemos demorado[a], a esta altura já teríamos voltado duas vezes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se não tivéssemos ficado esperando” ou “se não tivéssemos hesitado”. O verbo hebraico pode indicar demorar, ficar por mais tempo ou hesitar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “teríamos voltado isto duas vezes”, expressão idiomática com o sentido de “teríamos voltado duas vezes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Judá ao pai e mantém com naturalidade a ligação argumentativa com o contexto.
- source_word: לוּלֵא
  choice: se não tivéssemos
  rationale: Expressa uma condição contrária ao fato no passado, conforme a construção hebraica.
- source_word: הִתְמַהְמָהְנוּ
  choice: tivéssemos demorado
  rationale: O verbo pode indicar demora, permanência prolongada ou hesitação; “demorado” é claro e adequado ao adiamento da viagem.
- source_word: כִּי עַתָּה
  choice: a esta altura já
  rationale: No resultado contrafactual, a expressão aponta para o que já teria acontecido até o momento presente; esta formulação é idiomática em português.
- source_word: שַׁבְנוּ
  choice: teríamos voltado
  rationale: Embora seja formalmente perfeito, no período contrafactual indica o resultado que teria ocorrido.
- source_word: זֶה פַעֲמָיִם
  choice: duas vezes
  rationale: Reproduz naturalmente a expressão idiomática hebraica, que neste contexto se refere à possibilidade de já terem completado duas viagens.
