  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: pt
  text: 'Eles responderam[a]: “Seu servo, nosso pai, está bem; ainda está vivo.” Então se inclinaram e se prostraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “paz” (shalom), usada aqui com o sentido de bem-estar ou boa condição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: está bem
  rationale: Neste contexto, שָׁלוֹם expressa o bem-estar do pai em resposta à pergunta sobre sua condição. “Está bem” comunica o sentido idiomático de modo natural em português.
- source_word: לְעַבְדְּךָ
  choice: seu servo
  rationale: Trata-se de uma forma deferente de referência perante José. “Servo” preserva o registro de humildade sem sugerir indevidamente escravidão como condição jurídica.
- source_word: לְאָבִינוּ
  choice: nosso pai
  rationale: Reproduz diretamente a relação possessiva e funciona como aposto de “seu servo”.
- source_word: עוֹדֶנּוּ חָי
  choice: ainda está vivo
  rationale: Preserva a ênfase temporal de עוֹד e soa natural no português moderno.
- source_word: וַיִּקְּדוּ
  choice: se inclinaram
  rationale: קדד descreve o ato físico de baixar ou inclinar o corpo em sinal de respeito.
- source_word: וישתחו
  choice: se prostraram
  rationale: O verbo indica prostração diante de um superior. A escolha distingue o gesto mais profundo do ato anterior e evita introduzir a ideia de culto religioso.
theological_decisions:
- issue: Sentido do gesto expresso por וישתחו
  choice: se prostraram
  alternative: adoraram
  rationale: O contexto apresenta deferência social diante de José, não adoração divina. A tradução preserva o gesto corporal sem acrescentar uma afirmação teológica que o relato não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala mantém a deferência cortesã; os dois verbos finais permanecem distintos para representar a sequência de inclinação e prostração.
