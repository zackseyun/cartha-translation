lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” comunica naturalmente a sequência em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a designação escolhida pelo texto hebraico, sem harmonizá-la com “Jacó”.
- source_word: לָמָה
  choice: Por que
  rationale: Equivalente direto e natural do interrogativo causal.
- source_word: הֲרֵעֹתֶם לִי
  choice: vocês me fizeram mal
  rationale: Traduz diretamente a forma causativa de רעע e preserva a acusação de dano sem a transformar necessariamente em juízo sobre maldade moral.
- source_word: לְהַגִּיד
  choice: contando
  rationale: O gerúndio expressa de modo natural o meio pelo qual, segundo Israel, o dano foi causado.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: A expressão definida remete ao oficial egípcio já conhecido no contexto.
- source_word: הַעוֹד לָכֶם אָח
  choice: que ainda tinham um irmão
  rationale: Reproduz a ideia de que um irmão ainda existia para eles; evita inserir “outro”, que é contextual, mas não está explicitamente expresso no hebraico.
