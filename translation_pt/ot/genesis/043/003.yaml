base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: pt
  text: 'Então Judá lhe disse: “O homem nos advertiu solenemente: ‘Vocês não verão o meu rosto[a] se o irmão de vocês não estiver com vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, “vocês não poderão comparecer diante de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: Então Judá lhe disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa a sequência com naturalidade. “Lhe” se refere a Jacó no contexto.
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: nos advertiu solenemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a advertência. A formulação comunica tanto a ênfase quanto a seriedade sem recorrer ao sentido jurídico de “testemunhar”.
- source_word: הָאִישׁ
  choice: O homem
  rationale: Mantém a designação comum usada no hebraico para o oficial egípcio.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Vocês não verão o meu rosto
  rationale: Preserva a imagem vívida do hebraico e sua possível força idiomática de comparecer diante de alguém.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: se o irmão de vocês não estiver com vocês
  rationale: Expressa de modo natural a condição negativa introduzida por בִּלְתִּי. O substantivo é singular e se refere especificamente a Benjamim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e legibilidade brasileira. A repetição de “vocês” preserva com clareza o plural do hebraico; a fala citada mantém a metáfora facial original, explicada em nota.
