lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Ele lhes perguntou como estavam
  rationale: Expressa em português natural o idioma hebraico de perguntar pelo shalom de alguém, isto é, por seu bem-estar, sem restringi-lo apenas à saúde.
- source_word: הֲשָׁלוֹם
  choice: está bem
  rationale: Preserva a repetição conceitual de שָׁלוֹם e abrange a condição geral do pai, não somente sua saúde física.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: O pai idoso de vocês
  rationale: Reproduz explicitamente a referência à idade com linguagem respeitosa, atual e amplamente compreensível.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: de quem me falaram
  rationale: O hebraico diz literalmente 'de quem vocês falaram'; o pronome 'me' explicita naturalmente em português o destinatário implícito no contexto.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Ainda está vivo?
  rationale: Tradução direta e idiomática da pergunta hebraica, preservando o sentido de continuidade de עוֹד.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e natural, com construção acessível tanto no Brasil quanto em outros contextos lusófonos. A expressão idiomática hebraica com שָׁלוֹם foi vertida pelo equivalente funcional “como estavam”, enquanto a segunda ocorrência aparece como “está bem”, preservando a ligação lexical no plano semântico.
