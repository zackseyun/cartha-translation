  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: pt
  text: 'Ele lhes perguntou como estavam e disse[a]: “O pai idoso de vocês, de quem vocês falaram, está bem? Ainda está vivo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele perguntou pelo bem-estar deles”. O idioma hebraico emprega shalom no sentido de bem-estar ou condição geral.'
