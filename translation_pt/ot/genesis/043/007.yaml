base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: pt
  text: 'Eles responderam: “O homem nos interrogou minuciosamente a nosso respeito e a respeito de nossa família, perguntando: ‘O pai de vocês ainda está vivo? Vocês têm outro irmão?’ Então lhe respondemos conforme essas perguntas. Como poderíamos saber que ele diria: ‘Tragam o irmão de vocês para cá’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: interrogou minuciosamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação de perguntar; esta formulação comunica um questionamento insistente e detalhado.
- source_word: מוֹלַדְתֵּנוּ
  choice: nossa família
  rationale: Neste contexto, o termo se refere à parentela ou aos vínculos familiares, não simplesmente ao lugar de nascimento.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: conforme essas perguntas
  rationale: Literalmente, 'conforme essas palavras/coisas'; no contexto, refere-se ao teor das perguntas feitas por José, e a tradução explicita naturalmente essa ligação.
- source_word: הוֹרִידוּ
  choice: tragam ... para cá
  rationale: O hebraico significa literalmente 'façam descer'. Em português, 'tragam para cá' expressa de modo natural o movimento até o Egito a partir da perspectiva de José.
