  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: pt
  text: 'Quando José viu Benjamim com eles, disse ao encarregado de sua casa[a]: “Leve os homens para dentro de casa, abata um animal[b] e prepare-o, pois eles comerão comigo ao meio-dia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ao que estava sobre sua casa”; também se pode traduzir por “ao administrador de sua casa”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa a expressão idiomática “abate um abate”, referindo-se ao abate de um animal para a refeição.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא ... אֶת־בִּנְיָמִין אִתָּם
  choice: viu Benjamim com eles
  rationale: A construção descreve José percebendo que Benjamim estava na companhia dos irmãos; a formulação direta preserva esse sentido.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: ao encarregado de sua casa
  rationale: A expressão hebraica designa o homem responsável pela casa ou administração doméstica de José. “Encarregado” é natural em português e evita impor um título técnico.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Leve os homens para dentro de casa
  rationale: O sufixo direcional em הַבָּיְתָה indica movimento para o interior da casa; “para dentro de casa” torna isso claro.
- source_word: וּטְבֹחַ טֶבַח
  choice: mate um animal
  rationale: A combinação cognata, literalmente “abate um abate”, é uma expressão idiomática para abater um animal destinado à refeição. O objeto genérico necessário em português não especifica indevidamente a espécie.
- source_word: וְהָכֵן
  choice: prepare-o
  rationale: O imperativo significa deixar pronto ou preparar; no contexto, o pronome retoma naturalmente o animal abatido, isto é, sua preparação para a refeição.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: pois eles comerão comigo
  rationale: כִּי introduz a razão das ordens. O pronome “eles” evita uma repetição pesada sem alterar o referente, os homens mencionados anteriormente.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: É a equivalência corrente e precisa para o período central do dia indicado pelo substantivo hebraico.
theological_decisions: []
