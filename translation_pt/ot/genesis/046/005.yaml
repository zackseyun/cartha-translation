base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: pt
  text: Então Jacó partiu de Berseba, e os filhos de Israel levaram Jacó, seu pai, seus pequeninos e suas esposas nas carroças que o faraó havia enviado para transportá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: partiu
  rationale: Embora o verbo signifique literalmente “levantou-se”, com מִן seguido de um lugar, em contexto de viagem, indica idiomaticamente a partida.
- source_word: מִבְּאֵר שָׁבַע
  choice: de Berseba
  rationale: Emprega a forma portuguesa corrente do nome do lugar e traduz diretamente a preposição מִן.
- source_word: וַיִּשְׂאוּ
  choice: levaram
  rationale: נשׂא significa carregar ou levar; aqui descreve o transporte de pessoas nos carros, e “levaram” é natural em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: No contexto imediato, a expressão se refere especificamente aos filhos homens de Jacó, e não genericamente ao povo de Israel.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: Reproduz de modo natural a relação possessiva e identifica Jacó como pai dos filhos de Israel.
- source_word: טַפָּם
  choice: seus pequeninos
  rationale: טַף designa sobretudo crianças pequenas ou dependentes; “pequeninos” preserva essa nuance.
- source_word: נְשֵׁיהֶם
  choice: suas mulheres
  rationale: No contexto familiar, refere-se às esposas; “suas mulheres” é uma expressão natural e amplamente compreensível em português.
- source_word: בָּעֲגָלוֹת
  choice: nos carros
  rationale: עֲגָלוֹת designa carros ou carroças usados para transporte; “carros” corresponde ao uso narrativo tradicional sem sugerir veículos modernos no contexto bíblico.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: que o faraó havia enviado
  rationale: O mais-que-perfeito composto deixa claro, de maneira natural, que o envio dos carros precedeu a viagem.
- source_word: לָשֵׂאת אֹתוֹ
  choice: para transportá-lo
  rationale: O infinitivo expressa finalidade, e o pronome singular refere-se mais naturalmente a Jacó; “transportar” evita a repetição imediata de “levar”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem narrativa fluente. “Berseba” segue a forma portuguesa corrente. “Carros” é usado no sentido antigo de veículos puxados para transporte, determinado pelo contexto. Não foram necessárias notas textuais ou teológicas.
