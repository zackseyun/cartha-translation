    rationale: Embora נשים possa significar «mulheres», a referência é às esposas dos filhos de Israel no grupo familiar; «esposas» comunica esse sentido de modo direto.
  revised_text: Então Jacó partiu de Berseba, e os filhos de Israel levaram Jacó, seu pai, seus pequeninos e suas esposas nas carroças que o faraó havia enviado para transportá-lo.
