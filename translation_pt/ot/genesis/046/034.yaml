  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: pt
  text: 'então vocês dirão: “Nós, seus servos, trabalhamos com rebanhos desde a nossa juventude até agora, tanto nós como nossos pais”, para que possam morar na terra de Gósen, pois todo pastor de rebanhos é detestável para os egípcios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pois todo pastor de rebanhos é uma abominação para os egípcios”.
    reason: Registra a tradução mais formal de תוֹעֵבָה, termo forte que também pode ter conotações culturais ou religiosas.
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: então vocês dirão
  rationale: O waw ligado ao perfeito dá continuidade às instruções anteriores; “então” expressa naturalmente a sequência, e o futuro conserva a força diretiva.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: criamos rebanhos
  rationale: A expressão designa pessoas dedicadas à criação e ao cuidado de animais. A formulação verbal é natural em português e evita o pouco idiomático “homens de gado”, sem limitar מִקְנֶה a bovinos.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Neste contexto de fala perante o faraó, o termo funciona como autodesignação respeitosa, não como afirmação explícita de escravidão.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: desde a nossa juventude até agora
  rationale: Reproduz com clareza a duração contínua indicada pelo hebraico.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: tanto nós como nossos pais
  rationale: A correlação “tanto... como” preserva a repetição enfática de גַּם e a continuidade entre gerações; “pais” mantém o termo familiar concreto do hebraico.
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Introduz de modo natural a finalidade da instrução de José.
- source_word: תֵּשְׁבוּ
  choice: possam morar
  rationale: יָשַׁב aqui se refere a residir ou estabelecer-se numa região; “morar” é corrente e adequado ao contexto.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Conserva o substantivo אֶרֶץ explicitamente presente no texto hebraico.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: detestável para os egípcios
  rationale: Expressa em português moderno a forte repulsa do construto hebraico, sem fazer a frase soar necessariamente cultual.
- source_word: כָּל רֹעֵה צֹאן
  choice: todo pastor de rebanhos
  rationale: Mantém o complemento צֹאן e evita que “pastor”, isoladamente, seja entendido no sentido religioso comum em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. A fala mantém a deferência diante do faraó e a formulação evita tanto arcaísmos quanto uma interpretação excessivamente específica da atividade pecuária.
