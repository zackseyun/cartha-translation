translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva “Israel”, “subiu” e a imagem corporal do abraço, mas evita uma formulação que possa soar como aparição sobrenatural. O marcador [a] está presente no texto principal.
