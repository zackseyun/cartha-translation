base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: pt
  text: Então José atrelou sua carruagem e subiu ao encontro de Israel, seu pai, em Gósen. Apresentou-se a ele, lançou-se ao pescoço do pai e chorou sobre o pescoço dele por muito tempo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chorou ainda sobre o pescoço dele”. A palavra hebraica também pode significar “continuamente” ou “por mais tempo”; no contexto, indica choro prolongado durante o abraço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר יוֹסֵף מֶרְכַּבְתּוֹ
  choice: José mandou atrelar sua carruagem
  rationale: אָסַר significa literalmente “atar”; com “carruagem”, descreve o ato de atrelá-la. A forma causativa natural em português reconhece que alguém da posição de José provavelmente não fez pessoalmente o serviço, sem alterar o sentido narrativo.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido comum de עלה e a perspectiva espacial da narrativa, sem substituí-lo pelo mais genérico “foi”.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו גֹּשְׁנָה
  choice: ao encontro de Israel, seu pai, em Gósen
  rationale: Mantém o nome Israel e a aposição “seu pai”. Embora o sufixo direcional de גֹּשְׁנָה possa ser vertido por “para Gósen”, aqui “em Gósen” expressa com naturalidade o local do encontro.
- source_word: וַיֵּרָא אֵלָיו
  choice: Quando se apresentou diante dele
  rationale: O nifal de ראה indica que José se fez ver pelo pai. “Apresentou-se diante dele” comunica a ideia sem sugerir uma aparição sobrenatural.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: lançou-se ao seu pescoço
  rationale: Conserva a imagem vívida do hebraico e exprime de modo inteligível o abraço emocionado, sem reduzir a expressão simplesmente a “abraçou-o”.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: chorou assim por muito tempo
  rationale: “Assim” retoma a posição do abraço e evita a repetição pouco natural de “ao seu pescoço”; “por muito tempo” traduz o valor durativo contextual de עוֹד.
