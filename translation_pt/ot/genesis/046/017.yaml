base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: pt
  text: 'Os filhos de Aser: Imna, Isvá, Isvi e Berias; e Sera, irmã deles. Os filhos de Berias: Héber e Malquiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Os filhos de Aser
  rationale: בְּנֵי é o plural construto de “filho”; em uma genealogia, “os filhos de” é a formulação natural. O ו inicial não precisa ser expresso, pois o versículo apresenta uma nova entrada da lista. “Aser” segue a forma portuguesa tradicional e reconhecível do nome.
- source_word: יִמְנָה
  choice: Imna
  rationale: Forma portuguesa concisa do nome hebraico, sem a consoante inicial acrescentada por certas tradições de outras línguas.
- source_word: וְיִשְׁוָה
  choice: Isvá
  rationale: Transliteração adaptada ao uso bíblico português; o acento indica a tonicidade final.
- source_word: וְיִשְׁוִי
  choice: Isvi
  rationale: Forma transliterada de modo claro e compatível com a tradição bíblica em português.
- source_word: וּבְרִיעָה
  choice: e Berias
  rationale: Nome próprio na forma consagrada em português; a conjunção é mantida antes do último nome da série.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: e Sera, irmã deles
  rationale: Preserva a construção nominal e a concisão do hebraico, sem acrescentar uma cópula verbal. “Deles” retoma naturalmente os irmãos mencionados.
- source_word: וּבְנֵי בְרִיעָה
  choice: Os filhos de Berias
  rationale: A oração inicia uma sublista genealógica. Em português, a ligação é clara sem reproduzir mecanicamente o ו inicial.
- source_word: חֶבֶר
  choice: Héber
  rationale: Forma tradicional portuguesa do nome, com acento gráfico para indicar a pronúncia.
- source_word: וּמַלְכִּיאֵל
  choice: e Malquiel
  rationale: Forma portuguesa tradicional; a conjunção coordena os dois filhos de Berias.
