  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: pt
  text: 'E os filhos de Zebulom: Serede, Elom e Jaleel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jaleel também pode ser transliterado como Ialeel ou Yahleel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filho”; em uma genealogia, “os filhos de” é a formulação mais natural. O וּ inicial foi preservado como “E” para manter a continuidade da lista.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: סֶרֶד
  choice: Serede
  rationale: Transliteração aportuguesada do nome próprio hebraico, com vogal final de apoio para leitura natural.
- source_word: וְ/אֵלוֹן
  choice: Elom
  rationale: Nome próprio transliterado em forma corrente portuguesa; não foi traduzido como o substantivo comum “carvalho”, pois aqui designa uma pessoa.
- source_word: וְ/יַחְלְאֵל
  choice: Jaleel
  rationale: Transliteração legível em português do nome próprio hebraico; o yod inicial é representado por J segundo convenção bíblica portuguesa comum.
