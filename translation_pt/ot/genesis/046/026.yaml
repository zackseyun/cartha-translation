  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: pt
  text: Todas as pessoas que pertenciam a Jacó e foram para o Egito, descendentes de Jacó, sem contar as mulheres dos filhos de Jacó, eram ao todo sessenta e seis pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Todas as pessoas
  rationale: Neste contexto genealógico e de contagem, נֶפֶשׁ designa pessoas, não a alma como parte imaterial do ser humano.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: da família de Jacó que foram para o Egito
  rationale: O לְיַעֲקֹב pode indicar pertencimento ou associação com Jacó. A formulação evita restringir a frase à ideia de mero acompanhamento físico e expressa naturalmente o grupo ligado a ele.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: seus descendentes diretos
  rationale: A expressão hebraica, literalmente ligada aos que saíram de sua coxa, é um idiomatismo para descendentes biológicos. A tradução comunica o sentido com clareza em português atual.
- source_word: מִלְּבַד
  choice: sem contar
  rationale: A expressão introduz o grupo excluído do total e soa natural numa enumeração em português.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: as mulheres dos filhos de Jacó
  rationale: Reproduz claramente a relação genitiva e usa uma designação corrente para as esposas no contexto narrativo.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: eram ao todo sessenta e seis pessoas
  rationale: Mantém o total explícito e verte novamente נֶפֶשׁ como 'pessoas', com sintaxe portuguesa natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O idiomatismo anatômico hebraico foi traduzido pelo sentido para evitar uma expressão opaca ou arcaizante. Nenhuma nota é necessária, pois as duas ocorrências de נֶפֶשׁ e יֹצְאֵי יְרֵכוֹ são adequadamente comunicadas no texto.
