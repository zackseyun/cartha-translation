  source_fidelity: 'A tradução transmite integralmente a enumeração hebraica: filhos, netos, filhas, netas e toda a descendência de Jacó, bem como o movimento para o Egito. “Estavam com ele” explicita de maneira natural a ideia acompanhante de אִתּוֹ na primeira parte, e “levou consigo” reproduz adequadamente a ocorrência final. “Levou ... para o Egito” é uma solução idiomática e fiel para o hifil de בוא com o acusativo direcional.'
