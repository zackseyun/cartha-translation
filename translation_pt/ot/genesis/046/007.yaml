base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: pt
  text: Seus filhos e seus netos estavam com ele[a]; suas filhas e suas netas[b], e todos os seus descendentes, ele os levou consigo para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de seus filhos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as filhas de seus filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O termo designa aqui os descendentes do sexo masculino, em contraste explícito com as filhas na sequência.
- source_word: וּבְנֵי בָנָיו
  choice: e seus netos
  rationale: Literalmente, “e os filhos de seus filhos”; “netos” é a forma natural e exata em português.
- source_word: אִתּוֹ
  choice: estavam com ele / consigo
  rationale: Expressa acompanhamento; a primeira ocorrência integra a enumeração, e a segunda acompanha o verbo “levou”.
- source_word: בְּנֹתָיו
  choice: suas filhas
  rationale: Tradução direta do termo para descendentes do sexo feminino.
- source_word: וּבְנוֹת בָּנָיו
  choice: e suas netas
  rationale: Literalmente, “e as filhas de seus filhos”; “netas” comunica naturalmente a relação genealógica.
- source_word: וְכָל זַרְעוֹ
  choice: e todos os seus descendentes
  rationale: Neste contexto familiar, זֶרַע tem sentido coletivo de descendência; “descendentes” é claro e corrente, sem o caráter concreto ou arcaizante de “semente”.
- source_word: הֵבִיא
  choice: ele os levou
  rationale: O hifil de בוא significa “fazer vir/trazer”. Em português, com o destino expresso como “para o Egito” e a perspectiva narrativa externa ao destino, “levou” é mais idiomático.
- source_word: מִצְרָיְמָה
  choice: para o Egito
  rationale: A terminação direcional indica movimento rumo ao Egito; “para o Egito” é a formulação portuguesa natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A retomada pronominal em “ele os levou” preserva a enumeração anteposta do hebraico sem produzir uma frase truncada. Os marcadores foram colocados junto a “netos” e “netas”, precisamente os termos explicados pelas notas.
