base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: pt
  text: A José nasceram, na terra do Egito, Manassés e Efraim, que Asenate, filha de Potífera, sacerdote de Om[a], lhe deu à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Om é a cidade egípcia que mais tarde ficou conhecida em grego como Heliópolis.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: A José nasceram
  rationale: 'O nifal de ילד expressa nascimento em construção passiva. Embora a forma verbal hebraica esteja no singular, os dois nomes coordenados pedem o plural natural em português; לְיוֹסֵף é preservado como relação: “a José”.'
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém explicitamente אֶרֶץ (“terra”) e a posição inicial da indicação de lugar, sem perder naturalidade.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: que ... lhe deu à luz
  rationale: Preserva a ação materna de ילד e a relação indicada por לּוֹ. A construção relativa mantém como antecedentes Manassés e Efraim.
- source_word: אָסְנַת
  choice: Asenate
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: filha de Potífera
  rationale: Reproduz diretamente a relação de filiação da cadeia construta hebraica, usando a forma portuguesa corrente do nome.
- source_word: כֹּהֵן אֹן
  choice: sacerdote de Om
  rationale: כֹּהֵן significa “sacerdote”; o topônimo egípcio אֹן é transliterado na forma portuguesa usual “Om”, enquanto sua identificação posterior é explicada em nota.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manassés e Efraim
  rationale: As partículas de objeto direto não são vertidas; empregam-se as formas portuguesas tradicionais dos nomes.
