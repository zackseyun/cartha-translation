base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: pt
  text: 'Estes são os nomes dos filhos de Israel que vieram para o Egito: Jacó e seus filhos.[a] O primogênito de Jacó era Rúben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «E estes são os nomes dos filhos de Israel que vieram para o Egito, Jacó e seus filhos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz a seção genealógica de modo natural em português; a conjunção hebraica pode funcionar como conexão discursiva sem exigir um «e» explícito.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: Equivalente direto e natural no plural, introduzindo a lista genealógica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a referência masculina imediata e o nome pessoal e pactual de Jacó.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: que foram para o Egito
  rationale: O particípio descreve os que se deslocaram para o Egito; «foram» é retrospectivo e idiomático, e «para» expressa a direção indicada pelo hebraico.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Jacó e seus filhos
  rationale: Mantém a aposição hebraica que esclarece quem são os filhos de Israel mencionados na introdução.
- source_word: בְּכֹר יַעֲקֹב
  choice: O primogênito de Jacó
  rationale: Preserva a relação de construto e a ênfase na ordem de nascimento em linguagem natural.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma consagrada e amplamente reconhecida do nome em português.
