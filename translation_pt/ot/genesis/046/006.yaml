  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: pt
  text: Levaram os seus rebanhos e os bens que haviam adquirido na terra de Canaã e chegaram ao Egito — Jacó e toda a sua descendência[a] com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus descendentes”. A palavra hebraica pode significar “semente”, “prole” ou “descendência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Levaram
  rationale: O qal narrativo de לקח indica que tomaram consigo aquilo que possuíam. A forma sem a conjunção inicial soa natural em português e mantém a sequência da narrativa.
- source_word: מִקְנֵיהֶם
  choice: os seus rebanhos
  rationale: מִקְנֶה designa coletivamente os animais domésticos possuídos. “Rebanhos” é abrangente e adequado ao contexto da migração da família.
- source_word: רְכוּשָׁם
  choice: os bens
  rationale: רְכוּשׁ refere-se às posses ou aos bens móveis. “Bens” é claro e evita repetir a ideia específica dos animais.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: que haviam adquirido
  rationale: A oração relativa descreve bens obtidos anteriormente em Canaã; o mais-que-perfeito composto expressa com naturalidade essa anterioridade.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: na terra de Canaã
  rationale: Mantém a expressão geográfica concreta do hebraico, em vez de abreviá-la simplesmente para “em Canaã”.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: e chegaram ao Egito
  rationale: בוא com a terminação direcional em מִצְרַיִם descreve o movimento até o Egito. “Chegaram ao Egito” é natural em português e não especifica indevidamente a travessia de uma fronteira.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Jacó e toda a sua descendência com ele
  rationale: זֶרַע pode significar semente, prole ou descendência. Neste contexto, “descendência” designa coletivamente a linhagem familiar de Jacó que o acompanhava e conserva o singular coletivo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem final enfática do hebraico foi preservada por meio do travessão. O marcador da nota foi colocado junto de “descendência”, termo ao qual a alternativa lexical se refere.
