  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: pt
  text: 'Estes são os filhos de Zilpa, que Labão deu a Lia, sua filha, e ela os deu à luz a Jacó: dezesseis pessoas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dezesseis almas”. Aqui, o hebraico néfesh é uma forma idiomática de contar pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Estes são os filhos de Zilpa
  rationale: Mantém a fórmula demonstrativa da enumeração genealógica e traduz בְּנֵי diretamente por “filhos”, sem ampliar para “descendentes”.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: que Labão deu a Lia, sua filha
  rationale: A oração relativa retoma Zilpa. A disposição da frase identifica Lia, e não Zilpa, como filha de Labão.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: e ela os deu à luz para Jacó
  rationale: “Deu à luz” expressa naturalmente o Qal de ילד com sujeito feminino; “para Jacó” conserva a função do לְ na fórmula de filiação sem omiti-la.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: dezesseis pessoas
  rationale: Neste contexto de contagem genealógica, נֶפֶשׁ designa indivíduos. “Pessoas” comunica o sentido idiomático sem sugerir apenas a parte imaterial do ser humano.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a concisão e a compressão genealógica do hebraico; o marcador da nota foi colocado junto de “pessoas”, termo ao qual a alternativa lexical se refere.
