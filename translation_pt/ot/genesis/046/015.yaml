  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: pt
  text: Estes são os filhos de Lia, que ela deu à luz a Jacó em Padã-Arã, juntamente com Diná, filha de Jacó. Ao todo, os filhos e as filhas de Jacó eram trinta e três pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda pessoa”; expressão idiomática que indica o número total de pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: os filhos de Lia
  rationale: O hebraico emprega explicitamente o plural masculino “filhos” como cabeçalho genealógico; a menção posterior de Diná não exige ampliá-lo para “filhos e filhas” neste ponto.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: que ela deu à luz para Jacó
  rationale: Com sujeito feminino, ילד no qal significa dar à luz. A formulação mantém o papel materno de Lia e a relação indicada por לְיַעֲקֹב.
- source_word: בְּפַדַּן אֲרָם
  choice: em Padã-Arã
  rationale: Trata-se de um topônimo, aqui transliterado segundo uma forma portuguesa clara e corrente.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: além de Diná, filha dele
  rationale: “Além de” comunica naturalmente o acréscimo de Diná depois do cabeçalho “filhos de Lia”; “dele” conserva a referência gramatical a Jacó.
- source_word: כָּל נֶפֶשׁ
  choice: Ao todo ... pessoas
  rationale: Em contexto genealógico e censitário, נֶפֶשׁ designa pessoas, e a expressão inteira introduz o total, não uma afirmação sobre “almas” em sentido teológico.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: seus filhos e suas filhas
  rationale: Preserva a distinção explícita entre os termos hebraicos para filhos e filhas.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: trinta e três
  rationale: Equivalente cardinal direto e idiomático em português.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na contagem
  choice: pessoas
  alternative: almas
  rationale: O uso é demográfico/genealógico e conta indivíduos; traduzir por “almas” poderia introduzir aqui uma distinção antropológica que o contexto não pretende formular.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Padã-Arã” segue a acentuação portuguesa; “somavam” expressa de modo natural a fórmula hebraica de totalização sem apagar a referência a pessoas.
