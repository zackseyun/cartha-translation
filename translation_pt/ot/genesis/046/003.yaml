base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: pt
  text: 'E ele disse: “Eu sou Deus, o Deus de seu pai. Não tenha medo de descer ao Egito,[a] pois ali farei de você uma grande nação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tema descer ao Egito”. A expressão hebraica emprega o verbo “temer” com um infinitivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Deus
  rationale: No predicativo de autoidentificação, “Eu sou Deus” é natural em português e transmite a identificação enfática do hebraico com artigo, sem recorrer à transliteração “El”.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: o Deus de seu pai
  rationale: Reproduz diretamente a cadeia construta e mantém o singular “pai”, preservando a ligação ancestral e pactual imediata.
- source_word: אַל תִּירָא מֵרְדָה
  choice: Não tenha medo de descer
  rationale: A construção com ירא e o infinitivo precedido de מִן exprime temor diante da ação. Esta formulação é corrente em português e conserva o verbo espacial “descer”.
- source_word: מִצְרַיְמָה
  choice: ao Egito
  rationale: O sufixo direcional indica movimento para o Egito; “ao Egito” expressa o destino de modo idiomático.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: farei de você uma grande nação
  rationale: 'A construção שׂים com לְ tem valor resultativo: Deus constituirá Jacó como uma grande nação. A expressão portuguesa comunica esse resultado com clareza.'
- source_word: שָׁם
  choice: ali
  rationale: O advérbio retoma o Egito como o lugar em que a promessa será cumprida; “ali” é claro e natural.
theological_decisions:
- issue: Designação ancestral na autoidentificação divina
  choice: o Deus de seu pai
  alternative: o Deus de seus pais
  rationale: Mantém-se o singular explícito no hebraico, sem ampliá-lo interpretativamente para uma referência coletiva aos antepassados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação do marcador após “Egito” vincula claramente a nota à expressão alternativa, e “descer” preserva a perspectiva geográfica do texto hebraico.
