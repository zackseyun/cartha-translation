base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: pt
  text: Eu mesmo descerei com você ao Egito, e eu mesmo certamente também o farei subir; e José porá a mão sobre os seus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “José fechará os seus olhos”, isto é, José estará presente quando Jacó morrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: O pronome independente aparece expressamente e se repete para dar ênfase; “Eu mesmo” conserva essa força em português.
- source_word: אֵרֵד
  choice: descerei
  rationale: ירד indica descer. “Descerei” é natural e mantém a orientação tradicional da viagem ao Egito.
- source_word: עִמְּךָ
  choice: com você
  rationale: Traduz diretamente a preposição com sufixo masculino singular, em linguagem moderna e amplamente compreensível.
- source_word: מִצְרַיְמָה
  choice: ao Egito
  rationale: O ה direcional indica movimento em direção ao Egito; “ao Egito” expressa isso naturalmente.
- source_word: אַעַלְךָ
  choice: o farei subir de lá
  rationale: O hifil de עלה tem sentido causativo. “Farei subir” o preserva, enquanto “de lá” torna explícito em português o ponto de partida implícito no contexto.
- source_word: גַם עָלֹה
  choice: certamente
  rationale: O infinitivo absoluto עָלֹה intensifica o verbo finito, e גַם acrescenta força à segunda ação prometida; no fluxo português, “certamente” comunica a ênfase sem formulação artificial.
- source_word: וְיוֹסֵף
  choice: e José
  rationale: Emprega a forma portuguesa consagrada do nome próprio.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: porá a mão sobre os seus olhos
  rationale: Mantém a imagem concreta do hebraico sem substituir no texto principal a expressão por sua interpretação idiomática ligada à morte.
theological_decisions:
- issue: Alcance da promessa de fazer Jacó subir do Egito
  choice: Manter a promessa dirigida diretamente a Jacó sem definir o modo de seu cumprimento.
  alternative: Especificar que se trata do corpo de Jacó levado para sepultamento em Canaã, ou de seus descendentes saindo no êxodo.
  rationale: O hebraico é conciso e permite mais de uma dimensão de cumprimento. A redação preserva a ambiguidade e a tensão teológica em vez de resolvê-las.
- issue: Sentido do gesto de José sobre os olhos de Jacó
  choice: Conservar no texto a imagem literal e explicar sua provável referência em nota.
  alternative: Traduzir diretamente “José fechará os seus olhos”.
  rationale: A expressão concreta pode indicar que José estaria presente na morte de Jacó e lhe fecharia os olhos; a nota comunica esse sentido sem apagar a forma hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita solenidade arcaica; “o farei subir” mantém a referência masculina singular. A repetição de “Eu mesmo” reproduz a ênfase do original.
