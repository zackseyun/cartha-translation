  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: pt
  text: 'Quando o faraó chamar vocês e disser: “Qual é a ocupação de vocês?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Qual é o trabalho de vocês?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A construção hebraica introduz uma circunstância futura esperada. “Quando” transmite naturalmente o valor temporal em português, sem a formulação rígida “e acontecerá que”.
- source_word: יִקְרָא לָכֶם
  choice: chamar vocês
  rationale: קרא com ל pode indicar chamar ou convocar. “Chamar vocês” é claro, natural e não torna a cena mais formal do que o hebraico exige.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma consagrada em português para o título real egípcio; o artigo é natural neste contexto.
- source_word: וְאָמַר
  choice: e perguntar
  rationale: O verbo significa literalmente “e disser”, mas introduz aqui uma pergunta direta. “Perguntar” expressa com naturalidade a função contextual da fala, sem alterar seu conteúdo.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Qual é a ocupação de vocês?
  rationale: מַעֲשֵׂיכֶם refere-se ao trabalho ou atividade exercida. “Ocupação” comunica de modo claro que se pergunta pela atividade profissional; a alternativa mais literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural, de ampla compreensão e especialmente natural para leitores brasileiros. A pergunta direta mantém o contexto de audiência perante o faraó.
