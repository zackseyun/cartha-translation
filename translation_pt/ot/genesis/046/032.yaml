revisions:
- from: Os homens são pastores de rebanhos,[a] pois sempre cuidaram de animais; trouxeram seus rebanhos, seu gado e tudo o que possuem.
  to: Os homens são pastores de rebanhos,[a] pois têm se dedicado à criação de animais; trouxeram seus rebanhos, seu gado e tudo o que possuem.
  rationale: A revisão elimina o acréscimo interpretativo de “sempre” e torna mais explícito o sentido ocupacional de אַנְשֵׁי מִקְנֶה. Mantêm-se a distinção entre rebanhos e gado, o registro moderno e a alternativa temporal fundamentada nos perfeitos hebraicos.
