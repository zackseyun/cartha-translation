  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: pt
  text: Os homens são pastores de rebanhos,[a] pois têm se dedicado à criação de animais; trouxeram seus rebanhos, seu gado e tudo o que possuem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os homens são pastores de rebanhos, pois eram dedicados à criação de animais; trouxeram...”. Os perfeitos hebraicos podem ser entendidos aqui como passado simples.'
    reason: alternativa temporal
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Os homens
  rationale: O substantivo plural definido identifica os homens já mencionados; a conjunção inicial não precisa ser reproduzida no início desta fala em português.
- source_word: רֹעֵי צֹאן
  choice: pastores de rebanhos
  rationale: A expressão construta designa quem pastoreia animais de pequeno porte, sobretudo ovelhas e cabras. A formulação é natural e não restringe o sentido apenas a ovelhas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da afirmação anterior.
- source_word: אַנְשֵׁי מִקְנֶה הָיוּ
  choice: sempre cuidaram de animais
  rationale: A expressão idiomática indica ocupação habitual com a criação de animais; o perfeito descreve uma atividade estabelecida até o momento narrado.
- source_word: וְצֹאנָם
  choice: seus rebanhos
  rationale: צֹאן denota coletivamente animais de pequeno porte, especialmente ovelhas e cabras.
- source_word: וּבְקָרָם
  choice: seu gado
  rationale: בָּקָר se refere especificamente a bovinos; “gado” preserva essa distinção em relação aos rebanhos de animais menores.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: tudo o que possuem
  rationale: Expressa de modo abrangente tudo o que lhes pertence.
- source_word: הֵבִיאוּ
  choice: trouxeram
  rationale: O perfeito apresenta uma ação concluída; o pretérito perfeito é natural em português e mantém sua relevância no contexto imediato.
