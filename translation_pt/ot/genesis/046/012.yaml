base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: pt
  text: E os filhos de Judá foram Er, Onã, Selá, Perez e Zerá. Mas Er e Onã morreram[a] na terra de Canaã. E os filhos de Perez foram Hezrom e Hamul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega um verbo no singular antes do sujeito composto «Er e Onã», construção normal nessa língua; em português, o sentido é plural: «Er e Onã morreram».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: E os filhos de Judá
  rationale: Preserva a conjunção que liga o versículo à genealogia anterior e traduz diretamente a construção nominal hebraica.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Er, Onã, Selá, Perez e Zerá
  rationale: Emprega formas portuguesas reconhecíveis dos nomes próprios, mantendo a sequência do hebraico.
- source_word: וַיָּמָת
  choice: morreram
  rationale: Embora o verbo hebraico esteja morfologicamente no singular por preceder um sujeito composto, o sentido abrange Er e Onã; o plural é exigido pelo português natural.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo explícito אֶרֶץ, em vez de reduzi-lo simplesmente a «em Canaã».
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: E os filhos de Perez foram
  rationale: Neste contexto genealógico, היה identifica os filhos mencionados; «foram» expressa isso de modo claro e natural.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hezrom e Hamul
  rationale: Translitera os nomes segundo formas correntes e legíveis em português bíblico.
