  terminology: “Família de seu pai” comunica adequadamente o valor coletivo de בֵּית אָבִיו neste contexto. A nota oferece de modo útil a alternativa literal “casa de seu pai”. “Irmãos”, “terra de Canaã” e “faraó” estão adequados.
