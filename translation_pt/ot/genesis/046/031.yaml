base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: pt
  text: 'Então José disse a seus irmãos e à família de seu pai[a]: “Subirei e informarei o faraó; direi a ele: ‘Meus irmãos e a família de meu pai, que estavam na terra de Canaã, vieram até mim.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à casa de seu pai”. A expressão hebraica se refere aqui à família como unidade, não apenas à moradia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então José disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: אֶל אֶחָיו
  choice: a seus irmãos
  rationale: No contexto, אַח com sufixo masculino plural se refere especificamente aos irmãos homens de José.
- source_word: וְאֶל בֵּית אָבִיו
  choice: e à família de seu pai
  rationale: בַּיִת em construção com “pai” designa aqui a unidade familiar, não a residência física.
- source_word: אֶעֱלֶה
  choice: Subirei
  rationale: Preserva o verbo direcional עלה, empregado no hebraico para a ida de José à presença do faraó.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: para informar o faraó
  rationale: O Hifil de נגד significa tornar conhecido ou informar; a formulação é natural no contexto de uma comunicação oficial.
- source_word: וְאֹמְרָה אֵלָיו
  choice: e lhe direi
  rationale: Mantém explícita a intenção subsequente de José e traduz de modo idiomático o objeto indireto.
- source_word: אַחַי וּבֵית אָבִי
  choice: Meus irmãos e a família de meu pai
  rationale: “Irmãos” é contextualmente preciso, e “família” comunica o sentido social de בֵּית אָבִי.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: que estavam na terra de Canaã
  rationale: Embora a oração hebraica não tenha verbo finito explícito, o passado situa em Canaã a residência anterior à chegada.
- source_word: בָּאוּ אֵלַי
  choice: vieram para junto de mim
  rationale: O perfeito indica a chegada concluída; “para junto de mim” torna claro que passaram a estar com José, sem acrescentar uma distinção teológica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Faraó” recebe artigo no discurso corrente (“o faraó”), enquanto o texto evita construções excessivamente literais que obscureceriam o sentido familiar de בַּיִת.
