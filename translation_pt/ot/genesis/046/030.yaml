  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: pt
  text: 'Então Israel disse a José[a]: “Agora posso morrer, depois de ter visto o seu rosto, pois você ainda está vivo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Agora morrerei, depois de ver o seu rosto, pois você ainda está vivo.” A redação hebraica é compacta e idiomática; o texto principal expressa seu sentido em português natural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência de modo natural em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O texto hebraico emprega explicitamente “Israel”; mantém-se esse nome, sem harmonizá-lo com “Jacó”.
- source_word: אָמ֣וּתָה
  choice: posso morrer
  rationale: O coortativo expressa aqui disposição ou resolução emocional. No contexto, Israel declara que agora pode morrer satisfeito, não pede permissão para morrer.
- source_word: הַפָּעַם
  choice: Agora
  rationale: Embora possa significar literalmente “desta vez”, no contexto assinala o momento presente após a longa tristeza.
- source_word: אַחֲרֵי רְאוֹתִי
  choice: pois vi
  rationale: A construção compacta significa formalmente “depois de eu ver/ter visto”; a formulação portuguesa comunica naturalmente a circunstância temporal com valor explicativo.
- source_word: אֶת פָּנֶיךָ
  choice: o seu rosto
  rationale: Preserva a imagem pessoal e concreta do hebraico, em vez de reduzi-la simplesmente a “você”.
- source_word: כִּי
  choice: e sei que
  rationale: 'No contexto, כִּי introduz a explicação ligada ao encontro: ver o rosto de José confirma que ele continua vivo. A explicitação produz português natural, embora a redação hebraica seja mais compacta.'
- source_word: עוֹדְךָ חָי
  choice: você ainda está vivo
  rationale: 'עוֹד com sufixo e חָי exprime continuidade: José permanece vivo.'
