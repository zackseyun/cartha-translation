lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: O ו inicial é representado por “E”, preservando a continuidade da lista genealógica; בְנֵי, plural construto, é traduzido naturalmente por “os filhos de”.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: חֲנוֹךְ
  choice: Hanoque
  rationale: Transliteração portuguesa próxima da forma hebraica, distinguindo-a da forma tradicional “Enoque”, também usada em português.
- source_word: וּ/פַלּוּא
  choice: Palu
  rationale: Transliteração clara e corrente em português; a conjunção prefixada é absorvida pela estrutura da enumeração.
- source_word: וְ/חֶצְרוֹן
  choice: Hezrom
  rationale: Forma portuguesa estabelecida que representa o nome hebraico; a conjunção é expressa pela pontuação da lista.
- source_word: וְ/כַרְמִי
  choice: Carmi
  rationale: Transliteração direta e reconhecível; a conjunção prefixada é traduzida pelo “e” final da enumeração.
