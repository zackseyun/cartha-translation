  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: pt
  text: 'E os filhos de Gade: Zifiom[a], Hagi, Suni, Esbom, Eri, Arodi e Areli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz aqui צִפְיוֹן (Zifiom); muitas traduções apresentam Zefom, forma tradicional variante que também aparece em Números 26:15.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém o sentido direto do plural construto בְּנֵי e preserva com «E» a continuidade da lista genealógica.
- source_word: גָד
  choice: Gade
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: צִפְיוֹן
  choice: Zifiom
  rationale: Representa em forma portuguesa o nome conforme vocalizado no texto hebraico deste versículo; a variante «Zefom» é registrada em nota.
- source_word: וְחַגִּי
  choice: Hagi
  rationale: Adaptação portuguesa direta do nome próprio hebraico, sem repetir desnecessariamente a conjunção dentro da enumeração.
- source_word: שׁוּנִי
  choice: Suni
  rationale: Transliteração adaptada à ortografia portuguesa, na qual «s» comunica naturalmente o som de שׁ neste nome tradicional.
- source_word: וְאֶצְבֹּן
  choice: Esbom
  rationale: Forma portuguesa natural do nome hebraico, com «m» final segundo a ortografia do português.
- source_word: עֵרִי
  choice: Eri
  rationale: Transliteração direta e clara do nome próprio.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Transliteração direta do nome; a conjunção é expressa pela pontuação da lista.
- source_word: וְאַרְאֵלִי
  choice: Areli
  rationale: Transliteração direta; a conjunção hebraica é representada pelo «e» antes do último item.
