base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: pt
  text: 'E os filhos de Benjamim foram: Belá, Bequer[a], Asbel, Gera, Naamã, Eí[b], Rôs, Mupim[c], Hupim e Arde[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico בֶּכֶר também pode ser transliterado “Béquer”.
    reason: lexical_alternative
  - marker: b
    text: Em Números 26:38, uma genealogia benjamita paralela traz “Aquirã” onde este versículo traz “Eí”.
    reason: cross_reference
  - marker: c
    text: Algumas tradições genealógicas paralelas apresentam uma forma variante, como “Supim”, em lugar de “Mupim”; aqui se segue o Texto Massorético.
    reason: textual_variant
  - marker: d
    text: Em 1 Crônicas 8:3, uma genealogia benjamita apresenta a forma relacionada “Adar”; este versículo traz “Arde”.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém o waw que dá continuidade à lista genealógica e traduz naturalmente o plural construto de בֵּן.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: בֶּלַע
  choice: Belá
  rationale: Transliteração portuguesa clara do nome próprio, com acento para indicar a tonicidade.
- source_word: בֶּכֶר
  choice: Bequer
  rationale: Representa diretamente as consoantes do nome hebraico e segue uma forma já reconhecível em português.
- source_word: אַשְׁבֵּל
  choice: Asbel
  rationale: Transliteração natural do nome próprio para leitores de português.
- source_word: גֵּרָא
  choice: Gera
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Forma portuguesa consagrada, preservando as duas vogais do início e indicando a tonicidade final.
- source_word: אֵחִי
  choice: Eí
  rationale: Translitera o nome presente no Texto Massorético sem substituí-lo pelo nome diferente encontrado em uma genealogia paralela.
- source_word: רֹאשׁ
  choice: Rôs
  rationale: O termo funciona aqui como nome próprio; por isso, é transliterado, e não traduzido como “cabeça” ou “chefe”.
- source_word: מֻפִּים
  choice: Mupim
  rationale: Segue a forma do Texto Massorético neste versículo, sem harmonizá-la com variantes de genealogias paralelas.
- source_word: חֻפִּים
  choice: Hupim
  rationale: Transliteração portuguesa direta da forma massorética.
- source_word: אָרְדְּ
  choice: Arde
  rationale: Segue o nome tal como aparece no Texto Massorético deste versículo, mantendo em nota a forma relacionada de uma genealogia paralela.
