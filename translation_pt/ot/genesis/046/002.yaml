  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: pt
  text: 'E Deus falou a Israel em visões da noite e disse[a]: “Jacó, Jacó.” E ele disse: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em visões noturnas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: falou / disse / respondeu
  rationale: O verbo אמר significa amplamente “dizer”. “Falou... e disse” preserva as duas ocorrências que introduzem a manifestação e a fala direta; na resposta de Jacó, “respondeu” expressa naturalmente a função contextual sem alterar o sentido.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto, o termo se refere ao único Deus e apresenta sentido verbal singular.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: Mantém o nome Israel na narração, sem harmonizá-lo com “Jacó” na fala divina.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: em visões da noite
  rationale: Preserva o plural de מַרְאוֹת e a referência noturna da construção hebraica.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Jacó, Jacó
  rationale: Conserva a repetição enfática e pessoal do nome.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Equivalente português natural para a fórmula de presença, prontidão e disponibilidade.
theological_decisions:
- issue: Alternância entre os nomes Israel e Jacó
  choice: Manter “Israel” na narração e “Jacó” no chamado divino
  alternative: Uniformizar ambos como “Jacó” ou ambos como “Israel”
  rationale: O hebraico alterna deliberadamente os nomes; preservar a alternância mantém a textura literária e teológica sem impor uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura natural. A formulação preserva a repetição verbal do hebraico e a alternância Israel/Jacó. O pronome foi omitido antes de “respondeu” para evitar possível ambiguidade em português.
