  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: pt
  text: E os filhos de José, que lhe nasceram no Egito, eram duas pessoas.[a] Ao todo, as pessoas da casa de Jacó que foram para o Egito eram setenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “almas”; aqui, נֶפֶשׁ é uma forma de se referir a pessoas numa contagem familiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: E os filhos de José
  rationale: בֵּן no plural construto refere-se aqui especificamente aos descendentes homens de José já nomeados no contexto; a conjunção וּ é traduzida por “E”.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: que lhe nasceram
  rationale: O passivo de ילד com ל e sufixo pronominal expressa naturalmente que os filhos nasceram a José; a construção portuguesa preserva essa perspectiva.
- source_word: בְמִצְרַיִם
  choice: no Egito
  rationale: Uso locativo direto da preposição ב.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: eram duas pessoas
  rationale: נֶפֶשׁ funciona neste contexto genealógico como termo de contagem para indivíduos. “Duas pessoas” mantém explícito o substantivo presente no hebraico e é natural em português.
- source_word: כָּל הַנֶּפֶשׁ
  choice: Ao todo, as pessoas
  rationale: Embora נֶפֶשׁ esteja no singular coletivo após כָּל, o português pede uma formulação plural. “Ao todo” comunica a função sumária de כָּל sem sugerir uma afirmação antropológica sobre almas.
- source_word: לְבֵית יַעֲקֹב
  choice: da casa de Jacó
  rationale: A expressão indica pertencimento à família ou unidade doméstica de Jacó; “casa de Jacó” preserva o sentido familiar e corporativo.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: que foram para o Egito
  rationale: O particípio coletivo é vertido como oração relativa, e o ה direcional é expresso por “para”. “Foram” é idiomático em português para o deslocamento já resumido pelo narrador.
- source_word: שִׁבְעִים
  choice: eram setenta
  rationale: A oração nominal hebraica declara o total. “Eram setenta” é conciso, natural e próximo da forma do texto-fonte.
theological_decisions:
- issue: Tradução de נֶפֶשׁ em contexto de contagem genealógica
  choice: pessoas
  alternative: almas
  rationale: O termo conta membros da casa de Jacó e não formula uma doutrina sobre a constituição humana. “Pessoas” transmite o sentido contextual sem acrescentar conotações teológicas indevidas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “pessoas” acompanha a terminologia de contagem do hebraico; “Ao todo” torna natural em português a segunda oração sumária.
