  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: É o plural construto de בֵּן, “filho”. Neste registro genealógico, refere-se diretamente aos filhos de Raquel, não a descendentes em sentido amplo.
- source_word: רָחֵל
  choice: Raquel
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: אֵשֶׁת
  choice: mulher de
  rationale: No construto com Jacó, designa a mulher na relação conjugal. “Mulher de Jacó” é natural em português e preserva de perto a formulação hebraica; “esposa de Jacó” também seria possível.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Nome próprio vertido segundo a forma tradicional em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Nome próprio vertido segundo a forma tradicional em português.
- source_word: וּבִנְיָמִן
  choice: e Benjamim
  rationale: A conjunção וּ é traduzida por “e”, seguida da forma tradicional portuguesa do nome próprio.
