base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: pt
  text: Israel partiu com tudo o que lhe pertencia[a] e chegou a Berseba. Ali ofereceu sacrifícios ao Deus de seu pai Isaque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tudo o que tinha”. A expressão hebraica pode abranger todos os que faziam parte de sua casa e tudo o que possuía.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partiu
  rationale: O verbo נסע, neste contexto narrativo, indica levantar acampamento e iniciar uma viagem. “Partiu” comunica naturalmente o início do deslocamento.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome usado no texto hebraico, sem harmonizá-lo com “Jacó”.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: com tudo o que lhe pertencia
  rationale: A expressão é abrangente e pode incluir tanto o grupo doméstico quanto os bens de Israel, sem restringi-la apenas a posses materiais.
- source_word: וַיָּבֹא
  choice: chegou
  rationale: בוא indica aqui a chegada ao destino; “chegou a Berseba” é uma formulação natural em português.
- source_word: בְּאֵרָה שָּׁבַע
  choice: a Berseba
  rationale: A terminação direcional hebraica é expressa pela preposição “a”; “Berseba” é a forma tradicional e amplamente reconhecida em português.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: ofereceu sacrifícios
  rationale: A construção cognata hebraica é vertida pela expressão idiomática portuguesa “ofereceu sacrifícios”, evitando a repetição artificial “sacrificou sacrifícios”.
- source_word: לֵאלֹהֵי
  choice: ao Deus de
  rationale: A preposição ל marca o destinatário dos sacrifícios; “ao Deus de” expressa naturalmente essa relação.
- source_word: אָבִיו יִצְחָק
  choice: seu pai Isaque
  rationale: A construção identifica Isaque especificamente como pai de Israel. A forma sem vírgula é clara e natural em português.
theological_decisions:
- issue: A designação específica “o Deus de seu pai Isaque”
  choice: Manter exatamente a referência a Isaque como pai de Israel.
  alternative: “o Deus de seus pais” ou “Deus, o Deus de seu pai Isaque”
  rationale: O hebraico nomeia especificamente Isaque, preservando a continuidade patriarcal e a ligação de Berseba com sua história. Não se deve generalizar nem expandir a fórmula.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ali” explicita de modo idiomático que os sacrifícios foram oferecidos em Berseba, sem acrescentar conteúdo interpretativo. O marcador da nota foi colocado junto à expressão a que ela se refere.
