base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: pt
  text: 'E os filhos de Simeão: Jemuel, Jamim, Oade, Jaquim, Zoar e Saul, filho da cananeia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: E os filhos de Simeão
  rationale: Preserva a coordenação da lista genealógica expressa por וּ e traduz naturalmente o plural construto de בֵּן; o nome segue a forma portuguesa consagrada.
- source_word: יְמוּאֵל
  choice: Jemuel
  rationale: Adota a transliteração bíblica corrente em português.
- source_word: וְיָמִין
  choice: Jamim
  rationale: Usa a forma portuguesa tradicional do nome hebraico יָמִין.
- source_word: וְאֹהַד
  choice: Oade
  rationale: Emprega uma forma portuguesa legível e tradicional, representando o nome hebraico אֹהַד.
- source_word: וְיָכִין
  choice: Jaquim
  rationale: Segue a forma bíblica portuguesa consagrada e representa adequadamente o nome hebraico יָכִין.
- source_word: וְצֹחַר
  choice: Zoar
  rationale: Usa a forma portuguesa tradicional deste nome próprio no contexto genealógico.
- source_word: וְשָׁאוּל
  choice: e Saul
  rationale: A forma tradicional portuguesa Saul corresponde ao hebraico שָׁאוּל e é imediatamente reconhecível; não há necessidade de nota, pois a diferença entre Saul e Shaul é apenas de convenção de transliteração.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: filho da cananeia
  rationale: Preserva tanto בֶּן, 'filho de', como o gentílico feminino definido הַכְּנַעֲנִית; 'cananeia' expressa de maneira clara e natural que se trata de uma mulher.
