  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: pt
  text: Ele enviou Judá à sua frente, a José, para indicar o caminho até Gósen antes de sua chegada[a]. E eles chegaram à terra de Gósen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para encaminhá-lo a Gósen” ou “para obter orientação para Gósen”. O hebraico é conciso: o verbo pode significar indicar, dirigir ou instruir, e a relação exata entre os participantes da orientação não é inteiramente clara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente narrativo comum do qal, natural em português e sem formalidade excessiva.
- source_word: לְפָנָיו
  choice: à sua frente
  rationale: Expressa que Judá foi enviado adiante dele, preservando o valor espacial e temporal da expressão hebraica.
- source_word: לְהוֹרֹת
  choice: para indicar-lhe o caminho
  rationale: O hifil de ירה pode significar instruir, dirigir ou indicar. No contexto de uma viagem, esta formulação comunica orientação prática sem recorrer ao abstrato 'instruir'.
- source_word: גֹּשְׁנָה
  choice: até Gósen
  rationale: O he direcional indica movimento rumo a Gósen; 'até Gósen' é idiomático em português neste contexto de indicação do caminho.
- source_word: וַיָּבֹאוּ
  choice: E eles chegaram
  rationale: Reproduz com naturalidade a progressão da narrativa e torna explícito o sujeito plural presente na forma verbal hebraica.
- source_word: אַרְצָה גֹּשֶׁן
  choice: à terra de Gósen
  rationale: Preserva a ideia territorial de אֶרֶץ e o movimento em direção à região.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Judá / José / Gósen
  rationale: Usam-se as formas tradicionais e amplamente reconhecidas desses nomes em português.
