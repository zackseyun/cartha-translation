    rationale: “Receber orientações diante dele rumo a Gósen” não é construção natural em português e não explica claramente a relação entre os participantes da cláusula hebraica.
  revised_text: Ele enviou Judá à sua frente, a José, para indicar o caminho até Gósen antes de sua chegada[a]. E eles chegaram à terra de Gósen.
