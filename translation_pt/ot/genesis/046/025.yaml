  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: pt
  text: 'Estes são os filhos de Bila, que Labão deu à sua filha Raquel e que ela deu à luz para Jacó: ao todo, sete pessoas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda alma, sete” — expressão idiomática que indica um total de sete pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Estes são os filhos de Bila
  rationale: A construção identificadora introduz um resumo genealógico; “filhos” representa diretamente בְּנֵי no contexto da lista, e “Bila” segue a forma tradicional portuguesa do nome.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: que Labão deu a Raquel, sua filha
  rationale: A oração relativa tem Bila como antecedente; o objeto fica implícito de modo natural em português, e לְ marca Raquel como destinatária. A vírgula esclarece que “sua filha” se refere a Raquel.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: e que ela deu à luz a Jacó
  rationale: “Deu à luz” é uma expressão portuguesa corrente para ילד e preserva Bila como sujeito materno; o segundo “que” torna clara a coordenação das orações relativas e evita a leitura de Raquel como sujeito.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: ao todo, sete pessoas
  rationale: נֶפֶשׁ, numa enumeração genealógica, designa pessoas; a formulação comunica naturalmente o total sem introduzir a noção moderna e potencialmente enganosa de “almas”.
