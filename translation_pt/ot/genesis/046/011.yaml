  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: pt
  text: 'E os filhos de Levi: Gérson, Coate e Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: O ו mantém a continuidade da lista genealógica, e בְנֵי é a forma construta plural de «filhos», aqui referente aos descendentes masculinos nomeados.
- source_word: לֵוִי
  choice: Levi
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: גֵּרְשׁוֹן
  choice: Gérson
  rationale: A forma hebraica é גֵּרְשׁוֹן; «Gérson» é a forma bíblica tradicional em português e a distingue de «Gérsom».
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional portuguesa do nome hebraico קְהָת, preferida a uma transliteração técnica menos acessível.
- source_word: וּ/מְרָרִי
  choice: e Merari
  rationale: A conjunção prefixada é representada por «e» antes do último nome da série; «Merari» é a forma tradicional em português.
