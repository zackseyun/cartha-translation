lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: A forma demonstrativa introduz a declaração resumitiva; o presente preserva de modo natural a construção nominal hebraica.
- source_word: בְּנֵי רָחֵל
  choice: os filhos de Raquel
  rationale: Mantém o sentido formal de בֵּן no contexto genealógico e preserva o nome próprio em sua forma portuguesa consagrada.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: que nasceram a Jacó
  rationale: Expressa em português corrente a relação genealógica indicada pelo passivo de ילד com לְ, sem recorrer a formulações arcaicas como “foram gerados”.
- source_word: כָּל נֶפֶשׁ
  choice: ao todo, ... pessoas
  rationale: Neste contexto de contagem genealógica, נֶפֶשׁ designa pessoas ou vidas; a formulação escolhida comunica claramente o total sem sugerir uma distinção teológica entre corpo e alma.
- source_word: אַרְבָּעָה עָשָׂר
  choice: catorze
  rationale: Tradução direta do número cardinal hebraico.
