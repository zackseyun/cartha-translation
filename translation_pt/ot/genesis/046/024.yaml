  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: pt
  text: 'E os filhos de Naftali: Jaazeel[a], Guni, Jezer e Silém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Jaazeel» também é grafado «Jazeel», «Jaziel» ou «Jachzeel» em diferentes tradições de transliteração.
