lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filho”; em uma genealogia, “os filhos de” é a formulação mais natural. O וּ inicial é preservado como “E”, mantendo a continuidade da lista.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: יַחְצְאֵל
  choice: Jazeel
  rationale: Transliteração portuguesa inteligível do nome hebraico, representando o yod inicial por J e simplificando os grupos consonantais hebraicos conforme o uso bíblico em português.
- source_word: וְגוּנִי
  choice: Guni
  rationale: Nome próprio transliterado; a conjunção prefixada é expressa pela estrutura da enumeração em português.
- source_word: וְיֵצֶר
  choice: Jezer
  rationale: Transliteração próxima da forma hebraica e reconhecível na tradição bíblica portuguesa.
- source_word: וְשִׁלֵּם
  choice: Silém
  rationale: Forma portuguesa natural, com acento para indicar a sílaba tônica final; não se reproduz graficamente a geminação consonantal hebraica, que não é distintiva no português moderno.
