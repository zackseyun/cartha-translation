base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: pt
  text: Quando a água do odre[a] se acabou, ela atirou o menino para debaixo de um dos arbustos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bolsa de pele”. O hebraico se refere a um recipiente feito de pele de animal.
    reason: lexical_alternative
  - marker: b
    text: Ou “lançou o menino para debaixo de um dos arbustos”. O verbo hebraico é mais forte que simplesmente “colocou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם
  choice: acabou a água
  rationale: Embora מַיִם tenha forma plural, funciona aqui como nome massivo. כלה indica que a água chegou ao fim; a construção portuguesa é natural e preserva a ideia de esgotamento.
- source_word: מִן הַחֵמֶת
  choice: do odre
  rationale: A preposição indica a fonte ou recipiente do qual a água se esgotou. חֵמֶת designa um recipiente feito de pele; “odre” é o equivalente português tradicional, conciso e preciso.
- source_word: וַתַּשְׁלֵךְ
  choice: ela lançou
  rationale: שלך é mais forte que simplesmente “colocar” ou “deitar”. “Lançou” conserva a ação abrupta sem sugerir necessariamente violência intencional.
- source_word: אֶת הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar criança ou menino. O referente é masculino, e “menino” é claro e natural no português moderno.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Equivalente direto e corrente de “sob/debaixo de” no contexto espacial.
- source_word: אַחַד הַשִּׂיחִם
  choice: um dos arbustos
  rationale: A construção significa literalmente “um dos arbustos”. “Arbustos” comunica com precisão שִׂיחִים e é amplamente compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Odre” preserva a imagem cultural do recipiente de pele; a nota esclarece o termo. “Lançou” mantém a força do verbo hebraico sem exagerá-la.
