base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: pt
  text: E Sara viu o filho de Agar, a egípcia, que ela havia dado à luz a Abraão, rindo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “brincando”; em sentido hostil, “zombando”. O particípio hebraico pode indicar riso, brincadeira ou comportamento de escárnio; o contexto não elimina completamente essa ambiguidade.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: E Sara viu
  rationale: O wayyiqtol de ראה dá sequência à narrativa. A conjunção simples preserva essa progressão sem introduzir um contraste que o hebraico não explicita.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: o filho de Agar, a egípcia
  rationale: A construção identifica o filho por meio de sua mãe, e o gentílico feminino funciona como aposto de Agar. A formulação é clara e natural em português.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: que ela havia dado à luz a Abraão
  rationale: O mais-que-perfeito composto indica naturalmente que o nascimento precedeu o momento em que Sara o viu. A expressão 'dar à luz a' comunica de modo corrente a relação marcada por לְ.
- source_word: מְצַחֵק
  choice: rindo
  rationale: O particípio de צחק pode descrever riso, brincadeira ou, conforme o contexto, zombaria. 'Rindo' mantém no texto principal o sentido lexical amplo sem impor uma intenção hostil que a forma hebraica, isoladamente, não especifica.
theological_decisions:
- issue: Sentido da ação de Ismael em מְצַחֵק
  choice: rindo
  alternative: brincando; zombando
  rationale: O hebraico não apresenta objeto explícito nem determina por si só se a ação era inocente ou hostil. Embora o contexto e a interpretação canônica posterior possam favorecer 'zombando', a tradução principal preserva a ambiguidade, e a nota registra as nuances possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas emprega formas idiomáticas em português. O marcador da nota foi colocado imediatamente após o termo ambíguo.
