base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: pt
  text: Ele morou no deserto de Parã[a], e sua mãe arranjou para ele uma esposa[b] da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “habitou na região desértica de Parã”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “tomou para ele uma mulher”. O contexto indica que sua mãe providenciou um casamento para ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: morou
  rationale: ישׁב pode significar sentar-se, habitar, permanecer ou morar. Neste resumo narrativo, “morou” expressa residência de modo natural, sem sugerir necessariamente uma fixação permanente.
- source_word: בְּמִדְבַּר פָּארָן
  choice: no deserto de Parã
  rationale: מִדְבָּר designa uma região erma ou desértica. “Deserto” é claro e corrente em português; פָּארָן é transliterado pela forma tradicional “Parã”.
- source_word: וַתִּקַּח ... לוֹ
  choice: arranjou para ele
  rationale: O sentido básico de לקח é “tomar”, mas, com לוֹ e אִשָּׁה neste contexto, descreve a ação da mãe de providenciar uma esposa. “Arranjou para ele” comunica naturalmente esse casamento organizado, enquanto a nota preserva a forma mais literal.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Tradução direta do substantivo com sufixo possessivo, mantendo explícito o agente da ação.
- source_word: אִשָּׁה
  choice: uma esposa
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. O contexto de uma mulher providenciada para ele indica relação matrimonial, por isso “esposa” aparece no texto principal.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: A tradução conserva אֶרֶץ, “terra”, e expressa a origem da esposa de maneira fiel e compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita o arcaísmo pouco natural “tomou-lhe uma mulher”, mas registra a expressão literal em nota. “Parã” segue a forma portuguesa tradicional do topônimo.
