  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: pt
  text: Então Abraão levantou-se cedo pela manhã, pegou pão e um odre de água, deu-os a Hagar[a], colocando-os sobre o ombro dela, e a mandou embora com o menino. Ela partiu e ficou vagando pelo deserto de Berseba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “colocando sobre o ombro dela, e o menino”. A sintaxe é comprimida; também pode ser entendida mais de perto como “colocando-os sobre o ombro dela e [entregando-lhe] o menino”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: levantou-se cedo pela manhã
  rationale: A construção expressa o ato de levantar cedo e mantém a ênfase temporal do hebraico em português natural.
- source_word: לֶחֶם
  choice: pão
  rationale: Conserva o sentido concreto mais direto do substantivo, sem ampliá-lo desnecessariamente para 'comida'.
- source_word: חֵמַת מַיִם
  choice: um odre de água
  rationale: חֵמֶת designa um recipiente de pele para líquidos; 'odre' é preciso, digno e compreensível no registro bíblico moderno.
- source_word: וַיִּתֵּן אֶל הָגָר
  choice: os deu a Hagar
  rationale: O pronome plural explicita naturalmente em português os objetos mencionados, o pão e o odre de água.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: colocando-os sobre o ombro dela
  rationale: Entende o particípio como circunstancial e relaciona a colocação aos mantimentos, sem apagar a sintaxe comprimida, registrada em nota.
- source_word: וְאֶת הַיֶּלֶד
  choice: entregou-lhe também o menino
  rationale: Supre o verbo exigido pelo português e representa uma construção plausível da sequência hebraica, evitando sugerir que Abraão pôs fisicamente o menino sobre o ombro de Hagar.
- source_word: וַיְשַׁלְּחֶהָ
  choice: a mandou embora
  rationale: Expressa de modo corrente e solene o envio para longe indicado por שׁלח neste contexto.
- source_word: וַתֵּתַע
  choice: ficou vagando
  rationale: Preserva a ideia de andar sem direção ou desviar-se, sem determinar se Hagar deliberadamente perambulava ou se perdeu o caminho.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: pelo deserto de Berseba
  rationale: Em português, 'deserto' é a forma bíblica corrente para מִדְבָּר e pode designar uma região erma, não necessariamente arenosa; 'Berseba' é a forma tradicional amplamente reconhecida do topônimo.
theological_decisions:
- issue: Relação sintática entre 'o menino' e 'colocando-os sobre o ombro dela'
  choice: Os mantimentos foram colocados sobre o ombro de Hagar, e o menino também lhe foi entregue antes que Abraão a mandasse embora.
  alternative: Abraão colocou sobre o ombro de Hagar tanto os mantimentos quanto o menino; ou o hebraico apenas justapõe 'e o menino' sem explicitar o verbo subentendido.
  rationale: A sintaxe hebraica é comprimida e genuinamente discutida. A tradução evita a impressão provavelmente enganosa de que o menino foi posto fisicamente sobre o ombro dela, mas a nota conserva a forma e a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se 'odre' pela precisão material e 'Berseba' pela tradição toponímica. A pontuação divide a sequência longa para clareza sem alterar a progressão narrativa.
