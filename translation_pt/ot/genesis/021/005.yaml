base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: pt
  text: Abraão tinha cem anos quando seu filho Isaque lhe nasceu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “E Abraão era filho de cem anos quando lhe nasceu Isaque, seu filho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraão
  rationale: O nome segue a forma portuguesa consagrada. A conjunção וְ liga o versículo à narrativa anterior, mas não precisa ser representada por “E” numa frase portuguesa isolada, pois a continuidade permanece clara pelo contexto.
- source_word: בֶּן מְאַת שָׁנָה
  choice: tinha cem anos
  rationale: A expressão hebraica literalmente diz “filho de cem anos”, idioma de idade que em português se expressa naturalmente por “tinha cem anos”.
- source_word: בְּ/הִוָּלֶד
  choice: quando ... nasceu
  rationale: A preposição בְּ com o infinitivo construto nifal de ילד indica circunstância temporal e conserva o sentido passivo por meio da construção portuguesa natural “quando ... nasceu”.
- source_word: ל֔/וֹ
  choice: lhe
  rationale: O pronome marca Abraão como aquele a quem o filho nasceu. “Lhe nasceu” preserva de modo conciso essa relação, embora seja mais elevado que “nasceu para ele”.
- source_word: אֵת יִצְחָק
  choice: Isaque
  rationale: אֵת é marcador do objeto e não recebe tradução independente; o nome é vertido na forma portuguesa tradicional “Isaque”.
- source_word: בְּנֽ/וֹ
  choice: seu filho
  rationale: Mantém a aposição hebraica que identifica Isaque como filho de Abraão, sem acrescentar a ênfase de “seu próprio filho”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Lhe nasceu” mantém a ideia hebraica de que Isaque nasceu a Abraão e evita uma formulação excessivamente literal; a nota registra o idioma etário e a estrutura do original.
