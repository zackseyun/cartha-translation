  source_fidelity: 'O texto conserva os elementos centrais do hebraico: a fala narrativa, a transferência das sete cordeiras da mão de Abraão, a finalidade probatória e a afirmação de que ele cavou o poço. “Isso” reproduz de modo apropriado o verbo feminino singular תִּהְיֶה, permitindo que a dádiva/arranjo seja entendida coletivamente como testemunho.'
