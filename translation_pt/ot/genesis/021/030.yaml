base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: pt
  text: 'E ele disse: “Você receberá da minha mão estas sete cordeiras, para que isso me sirva de testemunho de que fui eu quem cavou este poço.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que elas me sirvam de testemunho”. O verbo hebraico está no singular, embora o referente imediato sejam as sete cordeiras; o singular pode tratá-las como um conjunto ou referir-se ao ato ou acordo como testemunho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o avanço narrativo do wayyiqtol sem impor uma sequência temporal mais específica.
- source_word: כִּי ... תִּקַּח
  choice: Você receberá
  rationale: Neste contexto, כִּי introduz o conteúdo da explicação, e o imperfeito תִּקַּח expressa a ação esperada de receber formalmente os animais.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: estas sete cordeiras
  rationale: כְּבָשֹׂת designa animais fêmeas; “cordeiras” é preciso e natural. “Estas” torna explícita a referência aos animais presentes e já mencionados.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Preserva a imagem concreta do hebraico e o sentido de transferência formal.
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Expressa com clareza a finalidade indicada pela locução hebraica.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: isso me sirva de testemunho
  rationale: O verbo hebraico está no singular, embora as sete cordeiras sejam o referente imediato. “Isso” permite entender coletivamente a entrega ou o acordo como testemunho, sem forçar concordância plural.
- source_word: כִּי חָפַרְתִּי
  choice: de que fui eu quem cavou
  rationale: כִּי introduz o conteúdo do testemunho. A construção portuguesa destaca naturalmente a reivindicação de Abraão sem acrescentar conteúdo estranho ao texto.
- source_word: הַבְּאֵר הַזֹּאת
  choice: este poço
  rationale: Tradução direta e idiomática do substantivo com o demonstrativo.
theological_decisions:
- issue: Identidade gramatical do testemunho
  choice: A entrega ou o acordo é representado pelo singular “isso”
  alternative: As sete cordeiras são apresentadas no plural como testemunhas
  rationale: תִּהְיֶה é inequivocamente singular. A tradução principal conserva esse dado, enquanto a nota reconhece a possibilidade de uma referência coletiva às cordeiras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita solenidade artificial; “cordeiras” preserva o sexo dos animais. O marcador foi colocado ao fim da frase a que a nota se refere.
