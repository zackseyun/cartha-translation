  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: pt
  text: 'E Abraão disse[a]: “Eu jurarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu juro” ou “Prestarei juramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... disse” preserva de modo natural a sequência simples do hebraico.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָנֹכִי
  choice: Eu
  rationale: O pronome independente explicita e pode enfatizar o sujeito. “Eu” mantém essa explicitação sem acrescentar a ênfase mais forte de “eu mesmo”.
- source_word: אִשָּׁבֵעַ
  choice: juro
  rationale: O nifal de שבע significa “jurar, prestar juramento”. Neste contexto, o imperfeito funciona como resposta volitiva à exigência anterior; o presente português “juro” é uma fórmula direta e idiomática de compromisso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação concisa própria de uma resposta solene. O presente “juro” soa natural em português como ato verbal de assumir um compromisso, enquanto a nota preserva as alternativas de valor futuro e a expressão nominal.
