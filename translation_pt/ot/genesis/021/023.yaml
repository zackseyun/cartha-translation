  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: pt
  text: Agora, jure-me aqui por Deus que você não agirá com falsidade comigo, nem com meus filhos, nem com meus descendentes. Assim como tratei você com bondade, faça o mesmo comigo e com a terra em que você tem vivido como estrangeiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: A expressão hebraica marca a transição para a exigência imediata de Abimeleque e contém explicitamente o elemento temporal/deíctico “agora”.
- source_word: אִם תִּשְׁקֹר
  choice: que você não agirá com falsidade
  rationale: Em uma fórmula de juramento, אִם introduz aquilo que o jurante se compromete a não fazer; שׁקר denota agir de modo falso ou desleal.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: com meus filhos, nem com meus descendentes
  rationale: Os termos designam a continuidade familiar e a posteridade. A formulação conserva a progressão entre a geração mais próxima e as posteriores sem impor precisão genealógica maior do que o contexto permite.
- source_word: כַּחֶסֶד
  choice: Assim como tratei você com bondade
  rationale: חֶסֶד aqui descreve o tratamento benevolente demonstrado por Abimeleque; “bondade” é natural no contexto e não acrescenta uma conotação pactual obrigatória.
- source_word: גַּרְתָּה
  choice: vive como estrangeiro
  rationale: O verbo גור descreve a residência de alguém que vive numa terra sem ser natural dela, condição social relevante na narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A segunda frase foi levemente reestruturada para soar natural, mantendo a reciprocidade exigida e a referência tanto ao interlocutor quanto à terra que o acolheu.
