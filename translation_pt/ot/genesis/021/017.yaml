  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: pt
  text: 'E Deus ouviu a voz do menino[a], e o anjo de Deus chamou Agar do céu e lhe disse: “O que você tem, Agar? Não tenha medo, pois Deus ouviu a voz do menino onde ele está.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o grito do menino”, nas duas ocorrências; o hebraico qol pode designar o grito audível de alguém em aflição.
    reason: Alternativa lexical contextual para קוֹל.
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: E Deus ouviu
  rationale: O qal de שׁמע significa normalmente “ouvir”. A formulação conserva a sequência narrativa sem ampliar o sentido para “respondeu”.
- source_word: אֶת קוֹל הַנַּעַר
  choice: a voz do menino
  rationale: קוֹל designa literalmente voz ou som e, neste contexto, pode indicar um grito de aflição. “Voz” preserva a repetição lexical das duas ocorrências; a alternativa contextual consta em nota.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר refere-se aqui a Ismael como jovem do sexo masculino. “Menino” é atual, claro e adequado ao contexto.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: Então o anjo de Deus chamou
  rationale: “O anjo de Deus” reproduz naturalmente a expressão construta e sua referência definida no contexto. “Então” marca com fluidez a progressão narrativa do wayyiqtol.
- source_word: מִן הַשָּׁמַיִם
  choice: desde o céu
  rationale: Embora שָׁמַיִם tenha forma plural, o singular “céu” é idiomático em português. “Desde” expressa aqui a origem da voz.
- source_word: מַה לָּךְ
  choice: O que você tem?
  rationale: A expressão idiomática pergunta o que está acontecendo ou afligindo a pessoa. Esta formulação é natural em português, mantém o tom de solicitude e evita a possível dureza de “O que há de errado com você?”.
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: Equivalente direto e corrente do imperativo negativo feminino, mais natural no português moderno do que “não temas”, sem perda de dignidade.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: pois Deus ouviu
  rationale: כִּי introduz o motivo da tranquilização. O perfeito hebraico é adequadamente expresso pelo pretérito perfeito português, cujo resultado permanece relevante no contexto.
- source_word: אֶל קוֹל הַנַּעַר
  choice: a voz do menino
  rationale: A mesma formulação é repetida para conservar a repetição enfática do hebraico.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: aí onde ele está
  rationale: A expressão é locativa. “Aí onde ele está” preserva tanto o valor de “onde” quanto a ênfase de שָׁם, sem sugerir uma interpretação adicional sobre a condição do menino.
theological_decisions:
- issue: A identidade de מַלְאַךְ אֱלֹהִים, que pode atuar como mensageiro divino estreitamente associado a Deus
  choice: o anjo de Deus
  alternative: um anjo de Deus; o anjo de Deus entendido explicitamente como o próprio Deus
  rationale: A tradução mantém a expressão hebraica e sua tensão narrativa, sem definir além do texto a identidade ontológica do mensageiro.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “você” porque o discurso é singular e dirigido a Agar; evita formas arcaizantes. A repetição “a voz do menino” reproduz deliberadamente a repetição hebraica.
