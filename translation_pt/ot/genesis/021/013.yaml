  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the slave woman into a nation[a], because he is your offspring.
translation:
  language: pt
  text: Também farei do filho da escrava uma nação, porque ele é seu descendente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Também farei
  rationale: A combinação de וְ com גַם dá continuidade e força aditiva; em português, “Também farei” preserva esse valor com naturalidade.
- source_word: אֶת בֶּן הָאָמָה
  choice: do filho da escrava
  rationale: בֶּן significa “filho”, e אָמָה designa uma mulher em condição servil. “Escrava” explicita o status social relevante no contexto sem suavizá-lo.
- source_word: לְגוֹי
  choice: uma nação
  rationale: 'Com שׂים, a preposição לְ indica o resultado: Deus fará que o filho venha a constituir uma nação. A construção portuguesa “fazer de alguém uma nação” expressa isso de modo idiomático.'
- source_word: אֲשִׂימֶנּוּ
  choice: farei dele
  rationale: שׂים pode significar “pôr”, “estabelecer” ou “fazer”. Neste contexto, “fazer de” comunica naturalmente a constituição futura de uma nação.
- source_word: כִּי
  choice: porque
  rationale: כִּי introduz a razão da promessa divina relativa ao filho de Agar.
- source_word: זַרְעֲךָ
  choice: seu descendente
  rationale: זֶרַע pode significar “semente”, “descendência” ou “descendente”. Aqui se refere individualmente ao filho de Abraão; “descendente” é claro e natural em português.
- source_word: הוּא
  choice: ele é
  rationale: O pronome explícito enfatiza que esse filho também pertence à descendência de Abraão, sem exigir uma intensificação como “ele próprio”.
theological_decisions:
- issue: Tradução de אָמָה e o status social de Agar
  choice: escrava
  alternative: serva
  rationale: O termo hebraico indica uma mulher em condição servil, e essa condição é narrativamente relevante. “Escrava” evita atenuar a realidade social do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa acompanha a estrutura causal do hebraico e preserva a referência singular de זֶרַע.
