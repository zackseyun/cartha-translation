lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: Então ... repreendeu
  rationale: O verbo יכח, no hifil, indica aqui confrontar ou repreender alguém por uma falta; “repreendeu” preserva a força da queixa no contexto.
- source_word: עַל אֹדוֹת
  choice: por causa de
  rationale: Expressa naturalmente em português o motivo da repreensão.
- source_word: בְּאֵר הַמַּיִם
  choice: poço de água
  rationale: Tradução direta da expressão hebraica, clara no contexto da disputa por acesso à água.
- source_word: גָּזְלוּ
  choice: haviam tomado à força
  rationale: O verbo גזל envolve apropriação violenta ou injusta; esta formulação conserva essa força sem exigir que o objeto tenha sido juridicamente caracterizado como roubado.
