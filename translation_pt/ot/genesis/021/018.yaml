id: GEN.21.18
reference: Genesis 21:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: pt
  text: Levante-se, erga o menino e segure-o firmemente com a mão[a], pois farei dele uma grande nação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apoie-o firmemente com a mão”. A expressão hebraica pode indicar tanto agarrar com firmeza quanto dar sustentação vigorosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמִי
  choice: Levante-se
  rationale: Imperativo feminino singular dirigido a Hagar. “Levante-se” transmite a ordem de modo natural e digno no português moderno.
- source_word: שְׂאִי אֶת־הַנַּעַר
  choice: erga o menino
  rationale: נשׂא pode significar levantar, tomar ou carregar. No contexto, “erga” preserva a imagem de tirar o menino de sua condição prostrada sem afirmar que ela deveria carregá-lo continuamente.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר abrange menino, rapaz ou jovem. “Menino” é natural no contexto narrativo e mantém a forma como ele é apresentado neste episódio.
- source_word: וְהַחֲזִיקִי אֶת־יָדֵךְ בּוֹ
  choice: e segure-o firmemente com a mão
  rationale: A construção idiomática combina o causativo de חזק com “sua mão” e בּוֹ, comunicando ação firme de agarrar ou sustentar. A tradução mantém a imagem concreta da mão e a ideia de apoio vigoroso.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para as ordens anteriores; “pois” preserva essa relação explicativa em registro claro e digno.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: farei dele uma grande nação
  rationale: Com שׂים, a preposição לְ indica aqui resultado ou condição futura. “Farei dele” expressa naturalmente em português o destino nacional prometido ao menino.
theological_decisions:
- issue: Promessa divina sobre o futuro de Ismael
  choice: Apresentar diretamente a promessa de que Deus fará do menino uma grande nação.
  alternative: Caracterizar explicitamente a promessa como bênção pactual ou distingui-la de uma aliança.
  rationale: O hebraico afirma o destino nacional do menino, mas não define neste versículo a categoria teológica da promessa. A tradução conserva a afirmação sem importar distinções doutrinárias.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento formal “Levante-se” evita regionalizar o texto com formas de tu, e “pois” mantém um tom narrativo digno sem arcaísmo.
