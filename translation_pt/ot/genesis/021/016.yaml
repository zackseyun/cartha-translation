base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: pt
  text: 'Então ela foi e se sentou sozinha, a certa distância dele, cerca de um tiro de arco, pois disse: “Que eu não veja a morte do menino[a].” Então se sentou diante dele, ergueu a voz e chorou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: “Que eu não veja o menino morrer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: diante dele
  rationale: Expressa a posição em frente ou do outro lado, com distância entre ambos. A continuação explicita essa distância; a repetição de “diante dele” preserva a repetição hebraica.
- source_word: הַרְחֵק
  choice: a certa distância
  rationale: O infinitivo absoluto funciona adverbialmente e reforça a ideia de afastamento; esta formulação é natural em português atual.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: cerca de um tiro de arco
  rationale: Conserva de modo conciso a imagem hebraica de uma distância aproximada correspondente ao alcance de uma flecha.
- source_word: הַיָּלֶד
  choice: o menino
  rationale: ילד pode designar menino ou jovem; “menino” comunica a relação materna e a vulnerabilidade da cena sem o tom arcaico de outras opções.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Que eu não veja a morte do menino
  rationale: Preserva a construção volitiva negativa na primeira pessoa e a expressão nominal hebraica “a morte do menino”, sem convertê-la silenciosamente em uma oração verbal.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: ergueu a voz
  rationale: Reproduz em português natural o conhecido idioma hebraico de elevar a voz em lamento; o verbo seguinte esclarece que ela chorou.
- source_word: וַתֵּבְךְּ
  choice: chorou
  rationale: É a equivalência corrente e digna para o verbo de chorar ou prantear no contexto.
