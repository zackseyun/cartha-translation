base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: pt
  text: 'E ela disse: “Quem teria dito a Abraão que Sara amamentaria filhos?[a][b] Pois dei à luz um filho na velhice de Abraão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos”. O plural pode ser entendido idiomaticamente como “crianças”, embora a oração seguinte especifique “um filho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Quem havia dito a Abraão que Sara amamentaria filhos?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ela disse
  rationale: O wayyiqtol dá continuidade à narrativa; a formulação conserva esse fluxo de modo natural em português.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Quem teria dito a Abraão
  rationale: A pergunta retórica expressa espanto diante de algo antes inimaginável; o futuro do pretérito composto comunica bem essa incredulidade.
- source_word: הֵינִיקָה
  choice: amamentaria
  rationale: O hifil de ינק significa dar de mamar ou amamentar; esta é a expressão corrente, clara e digna em português.
- source_word: בָנִים
  choice: filhos
  rationale: Mantém o plural masculino do hebraico e sua relação lexical com o singular בֵן na oração seguinte, sem apagar a forma peculiar da exclamação.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exclamação anterior, sem impor um contraste ausente do hebraico.
- source_word: יָלַדְתִּי בֵן
  choice: lhe dei à luz um filho
  rationale: Expressa naturalmente o parto e torna explícita em português a relação de Abraão com o filho, já indicada pelo contexto e pela frase final.
- source_word: לִזְקֻנָיו
  choice: na velhice
  rationale: A expressão portuguesa transmite de modo idiomático que o nascimento ocorreu durante a velhice de Abraão; o pronome em “lhe dei” já identifica o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e levemente solene. A tradução mantém a pergunta retórica, o plural incomum “filhos” e o valor explicativo de כִּי. A colocação pronominal em “lhe dei à luz” evita a repetição de “Abraão” sem perder o referente.
