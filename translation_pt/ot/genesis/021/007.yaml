- from: 'E ela disse: “Quem teria dito a Abraão que Sara amamentaria filhos?[a][b] Pois lhe dei à luz um filho na velhice.”'
  to: 'E ela disse: “Quem teria dito a Abraão que Sara amamentaria filhos?[a][b] Pois dei à luz um filho na velhice de Abraão.”'
  rationale: A revisão substitui o dativo inadequado em «lhe dei à luz» por uma formulação idiomática e explicita que «velhice» se refere a Abraão, conforme o sufixo masculino singular do hebraico. A nota b é ajustada para oferecer uma alternativa real de leitura sem alterar desnecessariamente a estrutura da fala.
