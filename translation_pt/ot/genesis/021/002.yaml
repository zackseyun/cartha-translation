base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: pt
  text: Assim, Sara engravidou e deu à luz a Abraão um filho, quando Abraão já era velho, no tempo determinado de que Deus lhe havia falado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: engravidou
  rationale: O verbo הָרָה indica conceber ou ficar grávida. “Engravidou” é claro, atual e natural em português.
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O verbo יָלַד, neste contexto, descreve o parto. “Deu à luz” é a formulação corrente e digna em português.
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo singular identifica a criança como filho; o artigo indefinido é exigido pelo uso natural do português.
- source_word: לְאַבְרָהָם
  choice: a Abraão
  rationale: Preserva a construção hebraica que apresenta Abraão como aquele a quem Sara deu um filho.
- source_word: לִזְקֻנָיו
  choice: na velhice dele
  rationale: A expressão indica a circunstância temporal da idade avançada de Abraão. “Dele” evita que a velhice seja atribuída a Sara.
- source_word: לַמּוֹעֵד
  choice: no tempo determinado
  rationale: מוֹעֵד designa um tempo fixado ou marcado. “Tempo determinado” comunica que esse momento já havia sido estabelecido.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: de que Deus lhe havia falado
  rationale: A oração relativa retoma “tempo determinado” e indica que Deus anteriormente falara a Abraão a respeito desse tempo, sem sugerir que Deus falou naquele exato momento.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a correspondência direta e não controversa para אֱלֹהִים neste contexto.
- source_word: וַ
  choice: Assim
  rationale: O waw narrativo dá continuidade ao cumprimento descrito no versículo anterior; “Assim” expressa com naturalidade essa progressão contextual.
theological_decisions:
- issue: A relação entre o nascimento e a palavra anterior de Deus
  choice: no tempo determinado de que Deus lhe havia falado
  alternative: no tempo determinado que Deus lhe havia anunciado
  rationale: A formulação mantém o motivo do cumprimento da palavra divina e de seu tempo estabelecido, mas não acrescenta que Deus fez uma promessa nem especifica além do hebraico o conteúdo de sua fala.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, e “na velhice dele” explicita de modo natural que o referente masculino é Abraão.
