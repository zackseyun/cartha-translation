  language: pt
  text: 'Então Abimeleque disse a Abraão: “O que são estas sete cordeiras que você pôs à parte?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... perguntou
  rationale: O waw consecutivo dá sequência à narrativa; como a fala é interrogativa, “perguntou” é natural em português e preserva sua função comunicativa.
- source_word: אֲבִימֶלֶךְ אֶל־אַבְרָהָם
  choice: Abimeleque ... a Abraão
  rationale: Translitera o nome próprio de forma corrente em português e expressa naturalmente o destinatário da fala.
- source_word: מָה הֵנָּה
  choice: O que significam
  rationale: Literalmente, “o que são”; no contexto, a pergunta busca saber a finalidade ou o significado do grupo separado. A formulação idiomática preserva essa abertura sem convertê-la diretamente em “por quê”.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: estas sete cordeiras
  rationale: כְּבָשֹׂת é feminino plural e designa cordeiras; “estas” preserva a referência demonstrativa próxima.
- source_word: אֲשֶׁר הִצַּבְתָּ לְבַדָּנָה
  choice: que você pôs separadas das outras
  rationale: O hifil de נצב significa pôr, colocar ou posicionar, e לְבַדָּנָה indica que elas ficaram à parte; “das outras” torna explícita, de modo natural, a separação contextual.
