  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: pt
  text: Abraão circuncidou seu filho Isaque quando ele tinha oito dias de vida[a], conforme Deus lhe havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho de oito dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: circuncidou
  rationale: O verbo מול designa especificamente a circuncisão; “circuncidou” é o equivalente preciso, corrente e natural em português.
- source_word: אֶת יִצְחָק
  choice: Isaque
  rationale: A partícula marca o objeto direto, seguido do nome próprio, vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Mantém a identificação familiar e a ênfase explícita do hebraico.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: quando ele tinha oito dias de vida
  rationale: Expressa em português natural o idiomatismo hebraico de idade, literalmente “filho de oito dias”.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Indica que a ação de Abraão correspondeu ao que Deus havia ordenado, sem tornar a formulação artificial.
- source_word: צִוָּה אֹתוֹ
  choice: lhe havia ordenado
  rationale: O mais-que-perfeito composto deixa claro, em português corrente, que a ordem divina precedeu a circuncisão.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o substantivo se refere ao Deus único e é adequadamente vertido por “Deus”.
theological_decisions:
- issue: Relação temporal entre a ordem divina e a ação de Abraão
  choice: lhe havia ordenado
  alternative: lhe ordenou
  rationale: Embora o hebraico permita uma forma passada simples, o mais-que-perfeito composto comunica naturalmente que a ordem já havia sido dada, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Isaque” segue a forma bíblica tradicional em português; “oito dias de vida” reproduz naturalmente a idade expressa pelo idiomatismo hebraico.
