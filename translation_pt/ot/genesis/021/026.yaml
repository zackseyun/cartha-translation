base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: pt
  text: 'E Abimeleque disse: “Eu não sabia quem tinha feito isso[a]. Você também não me contou, e eu mesmo não tinha ouvido falar disso até hoje.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta coisa”, “este assunto” ou “este ato”. O hebraico davar pode designar uma coisa, um assunto ou um acontecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva essa ligação de modo natural em português bíblico atual.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleque
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֹא יָדַעְתִּי
  choice: Eu não sabia
  rationale: O perfeito descreve a falta de conhecimento de Abimeleque até aquele momento; o pretérito imperfeito é idiomático em português para esse estado anterior.
- source_word: מִי עָשָׂה
  choice: quem tinha feito
  rationale: O mais-que-perfeito composto deixa claro que o ato ocorreu antes da declaração de Abimeleque.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: isso
  rationale: No contexto, דָּבָר se refere ao ocorrido que estava sendo discutido. “Isso” é claro e natural, enquanto a nota registra alternativas lexicais mais explícitas.
- source_word: וְגַם אַתָּה
  choice: Você também
  rationale: Preserva a força inclusiva e enfática de גַּם, destacando que Abraão igualmente não o informou.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: não me contou
  rationale: הִגִּיד significa contar, declarar ou informar; “não me contou” é a formulação mais natural no diálogo.
- source_word: וְגַם אָנֹכִי
  choice: e eu mesmo
  rationale: A forma plena do pronome אָנֹכִי admite ênfase; “eu mesmo” torna essa ênfase perceptível sem tornar a frase artificial.
- source_word: לֹא שָׁמַעְתִּי
  choice: não tinha ouvido falar disso
  rationale: Aqui “ouvir” tem o sentido contextual de receber notícia do ocorrido; “falar disso” explicita em português o referente implícito.
- source_word: בִּלְתִּי הַיּוֹם
  choice: até hoje
  rationale: A expressão indica que Abimeleque não havia tomado conhecimento antes daquele dia.
