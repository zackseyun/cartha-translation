base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: pt
  text: O menino[a] cresceu e foi desmamado. E Abraão deu um grande banquete[b] no dia em que Isaque foi desmamado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a criança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma grande festa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: cresceu
  rationale: No contexto do desenvolvimento de uma criança, גדל indica crescimento ou amadurecimento, não elevação de posição.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode designar uma criança ou um menino; como o referente é Isaque, “menino” é natural e específico sem acrescentar idade precisa.
- source_word: וַיִּגָּמַל
  choice: foi desmamado
  rationale: O nifal de גמל, neste contexto, refere-se ao fim da amamentação; a forma passiva portuguesa corresponde claramente ao hebraico.
- source_word: וַיַּעַשׂ
  choice: deu
  rationale: Embora עשה signifique literalmente “fazer”, com “banquete” o português idiomático emprega “dar um banquete”.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: um grande banquete
  rationale: מִשְׁתֶּה designa uma refeição festiva, frequentemente associada a bebida e celebração; “grande banquete” conserva tanto o caráter celebrativo quanto o adjetivo גָדוֹל.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Expressa de maneira natural a relação temporal de בְּ com יוֹם, preservando a referência ao dia específico.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: Isaque foi desmamado
  rationale: O infinitivo de גמל com o marcador de objeto אֶת apresenta Isaque como quem passa pelo desmame; a oração passiva comunica isso naturalmente em português.
