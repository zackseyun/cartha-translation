  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: pt
  text: Javé visitou Sara[a], conforme havia dito, e Javé fez por Sara conforme havia falado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltou sua atenção para Sara”. O verbo hebraico pode indicar que Deus dirige sua atenção a alguém para agir em seu favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome divino, preservando o nome próprio do texto hebraico.
- source_word: פָּקַד
  choice: voltou sua atenção para
  rationale: Neste contexto, o verbo indica que Deus dirigiu sua atenção eficaz a Sara para agir em favor dela. A expressão evita sugerir uma visita meramente espacial e deixa o resultado para o versículo seguinte.
- source_word: כַּאֲשֶׁר אָמָר
  choice: conforme havia dito
  rationale: O mais-que-perfeito remete à palavra divina anterior e ressalta seu cumprimento.
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: e fez por Sara
  rationale: Mantém a generalidade de עשה e representa ל como benefativo, sem explicitar antecipadamente o resultado narrado no versículo seguinte.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: conforme havia falado
  rationale: Preserva a distinção estilística entre אָמַר, 'dizer', e דִּבֵּר, 'falar', presente nas duas orações paralelas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Yahweh; Jeová
  rationale: O hebraico traz diretamente o nome próprio divino. 'Javé' conserva esse fato e é uma forma portuguesa tradicional e inteligível, sem substituí-lo por um título.
- issue: Natureza da ação expressa por פָּקַד
  choice: atenção divina que resulta em ação favorável
  alternative: visita meramente presencial ou tomada de conhecimento sem intervenção
  rationale: O contexto imediato é o cumprimento da promessa a Sara, mas a tradução não especifica além do que este versículo afirma.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. A repetição de “Sara” e o paralelismo entre “dito” e “falado” foram mantidos por refletirem a forma do hebraico.
