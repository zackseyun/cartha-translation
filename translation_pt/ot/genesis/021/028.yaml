base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/028.yaml
  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: pt
  text: E Abraão colocou à parte sete cordeiras do rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «colocou sete cordeiras do rebanho separadamente». O verbo hebraico pode sugerir que ele as dispôs em uma posição distinta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: colocou à parte
  rationale: A forma hifil de נצב indica fazer ficar em determinada posição. No contexto, Abraão separa visivelmente os sete animais; «colocou à parte» exprime a ação concreta e sua distinção do restante do rebanho sem explicitar ainda a finalidade.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico de objeto direto definido não possui equivalente lexical necessário em português.
- source_word: שֶׁבַע
  choice: sete
  rationale: Número cardinal que modifica o substantivo seguinte.
- source_word: כִּבְשֹׂת
  choice: cordeiras
  rationale: O substantivo feminino plural designa cordeiros do sexo feminino; «cordeiras» preserva de modo natural em português tanto o sexo quanto a noção de animais jovens.
- source_word: הַצֹּאן
  choice: do rebanho
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. «Do rebanho» é natural e evita restringir desnecessariamente o coletivo hebraico.
- source_word: לְבַדְּהֶן
  choice: à parte
  rationale: A expressão indica que as sete cordeiras foram mantidas separadas das demais; «à parte» é conciso, claro e idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa simples. «Cordeiras» é mais natural em português do que uma expressão analítica como «cordeiros fêmeas». A nota conserva a nuance concreta do verbo hebraico e a alternativa menos interpretativa.
