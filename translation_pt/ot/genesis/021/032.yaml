base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: pt
  text: Assim, fizeram uma aliança[a] em Berseba. Abimeleque levantou-se com Ficol, comandante do seu exército, e eles voltaram para a terra dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cortaram uma aliança”, expressão idiomática que significa fazer uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: fizeram uma aliança
  rationale: O hebraico emprega literalmente a expressão idiomática “cortar uma aliança”. Em português atual, “fazer uma aliança” comunica o sentido com clareza, enquanto a nota preserva a forma concreta do original.
- source_word: בִּבְאֵר שָׁבַע
  choice: em Berseba
  rationale: A preposição ב indica aqui o local onde a aliança foi feita. “Berseba” é a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: O singular hebraico tem Abimeleque como sujeito e descreve sua partida com Ficol. “Levantou-se” mantém a sequência narrativa e o registro digno sem soar arcaico.
- source_word: וּפִיכֹל
  choice: com Ficol
  rationale: Embora ו seja literalmente “e”, “com Ficol” expressa naturalmente em português que Ficol acompanhou Abimeleque; o verbo plural seguinte confirma a participação de ambos no retorno.
- source_word: שַׂר צְבָאוֹ
  choice: comandante do seu exército
  rationale: שַׂר designa um chefe ou comandante, e צָבָא, neste contexto, a força militar. A formulação é clara e contemporânea.
- source_word: וַיָּשֻׁבוּ
  choice: eles voltaram
  rationale: O plural explícito deixa claro em português que Abimeleque e Ficol realizaram juntos o retorno, preservando a mudança do singular para o plural no hebraico.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: para a terra dos filisteus
  rationale: Tradução direta da expressão etnogeográfica hebraica, sem substituí-la por um nome territorial interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais bíblicas correntes no uso brasileiro. A sintaxe conserva a alternância hebraica entre o singular “levantou-se”, referente a Abimeleque, e o plural “eles voltaram”, referente a Abimeleque e Ficol.
