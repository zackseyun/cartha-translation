lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressão causal-consecutiva natural em português, ligando o juramento à atribuição do nome.
- source_word: קָרָא
  choice: chamou ... de
  rationale: Reproduz o sentido de chamar ou dar nome, em construção idiomática portuguesa.
- source_word: לַמָּקוֹם הַהוּא
  choice: aquele lugar
  rationale: Preserva tanto a referência definida quanto a força demonstrativa do hebraico.
- source_word: בְּאֵר שָׁבַע
  choice: Berseba
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português; o jogo de palavras hebraico é esclarecido em nota.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão dada no texto para o nome do lugar.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo natural, referente ao lugar já mencionado.
- source_word: נִשְׁבְּעוּ
  choice: fizeram um juramento
  rationale: Expressa de modo claro e corrente o nifal de שבע, isto é, jurar ou prestar juramento.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Mantém a ênfase explícita nas duas partes envolvidas.
