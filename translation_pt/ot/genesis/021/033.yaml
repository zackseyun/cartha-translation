base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: pt
  text: E plantou uma tamargueira em Berseba e ali invocou o nome de Yahweh[a], o Deus eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ali proclamou o nome de Yahweh”. A expressão hebraica pode indicar tanto proclamação quanto invocação em contexto de culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: plantou
  rationale: O Qal de נטע significa normalmente “plantar”; esta é a forma natural e precisa no contexto.
- source_word: אֶשֶׁל
  choice: uma tamargueira
  rationale: O substantivo singular é tradicionalmente identificado como tamargueira; a tradução mantém a especificidade botânica sem recorrer à interpretação menos provável “bosque”.
- source_word: בִּבְאֵר שָׁבַע
  choice: em Berseba
  rationale: A preposição ב indica localização, e “Berseba” é a forma consagrada em português para o topônimo.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: ali invocou o nome de
  rationale: A fórmula קרא בשם pode abranger invocação e proclamação em contexto de culto. “Invocou o nome de” expressa bem a dimensão cultual, enquanto a nota preserva a alternativa genuína.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: אֵל עוֹלָם
  choice: o Deus eterno
  rationale: עוֹלָם qualifica אֵל com a ideia de duração sem fim; “o Deus eterno” é natural, dignificado e semanticamente fiel em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; “Yahweh” preserva essa função sem substituí-lo por um título.
- issue: Sentido da fórmula cultual קרא בשם יהוה
  choice: invocou o nome de Yahweh
  alternative: proclamou o nome de Yahweh
  rationale: A expressão pode indicar apelo cultual e também proclamação. O texto principal adota a leitura de invocação, comum neste uso em Gênesis, e a nota registra a ambiguidade.
- issue: Valor de אֵל עוֹלָם
  choice: o Deus eterno
  alternative: o Deus perpétuo
  rationale: “Eterno” comunica de modo idiomático a perpetuidade expressa por עוֹלָם sem impor uma elaboração metafísica além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém tom narrativo dignificado, o topônimo tradicional “Berseba” e o nome divino transliterado como “Yahweh”.
