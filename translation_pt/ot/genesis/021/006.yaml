  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: pt
  text: 'E Sara disse: “Deus me deu riso; todo aquele que ouvir rirá comigo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rirá de mim” ou “rirá por mim”. O hebraico permite essas nuances, mas, neste contexto, o sentido mais provável é o de alegria compartilhada com Sara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ... disse
  rationale: Mantém o avanço narrativo do waw consecutivo de modo natural em português.
- source_word: שָׂרָה
  choice: Sara
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: צְחֹק
  choice: motivo para rir
  rationale: Expressa de modo idiomático que Deus produziu riso ou alegria para Sara; a repetição de “rir” na segunda oração preserva a ligação lexical com a raiz hebraica צחק.
- source_word: עָשָׂה לִי
  choice: me deu
  rationale: Transmite em português natural a expressão hebraica literalmente equivalente a “fez para mim”, sem perder a ideia de que Deus causou essa alegria em benefício de Sara.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O termo designa aqui o único Deus e rege sentido singular.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: todo aquele que souber disso
  rationale: 'O particípio substantivado tem valor distributivo. “Souber disso” explicita naturalmente em português o objeto implícito de “ouvir”: a notícia do nascimento e da declaração de Sara.'
- source_word: יִצְחַק
  choice: rirá
  rationale: Preserva o sentido primário do verbo e o jogo verbal com צְחֹק e, no contexto, com o nome Isaque.
- source_word: לִי
  choice: comigo
  rationale: No contexto de celebração pelo nascimento, indica mais provavelmente participação na alegria de Sara, embora o hebraico também permita outras nuances, registradas em nota.
theological_decisions:
- issue: Sentido de יִצְחַק לִי na oração final
  choice: 'riso alegre compartilhado: “rirá comigo”'
  alternative: “rirá de mim” ou “rirá por mim”
  rationale: 'O contexto imediato é positivo: Deus concedeu a Sara o filho prometido e lhe trouxe riso. Assim, a participação alegre é a leitura contextual mais provável, mas a construção hebraica com לִי permanece semanticamente aberta, razão pela qual as alternativas são preservadas em nota.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação idiomática evita o pouco natural “fez riso para mim”, preservando a repetição da raiz “rir” e a ambiguidade da oração final em nota.
