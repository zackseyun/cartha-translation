base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: pt
  text: Então Abraão tomou ovelhas e gado e os deu a Abimeleque, e os dois fizeram uma aliança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortaram uma aliança”, expressão idiomática hebraica usual para formalizar uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O qal narrativo de לקח tem o sentido comum de “pegar” ou “tomar”. “Pegou” é natural em português moderno e mantém a sequência simples da ação.
- source_word: צֹאן
  choice: ovelhas
  rationale: צֹאן designa animais de pequeno porte, sobretudo ovelhas e cabras. “Ovelhas” forma um par claro e natural com בָּקָר, sem tornar o texto excessivamente técnico.
- source_word: וּבָקָר
  choice: bois
  rationale: בָּקָר refere-se a gado bovino. “Bois” é uma forma corrente e concreta em português bíblico moderno, adequada ao contraste com “ovelhas”.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: נתן é o verbo comum para “dar”; esta escolha evita acrescentar uma formalidade cerimonial que o hebraico não explicita.
- source_word: לַאֲבִימֶלֶךְ
  choice: a Abimeleque
  rationale: O prefixo ל indica o destinatário, e o nome próprio segue a forma portuguesa tradicional e amplamente reconhecida “Abimeleque”.
- source_word: וַיִּכְרְתוּ
  choice: fizeram
  rationale: Na expressão idiomática כרת ברית, o sentido é formalizar ou estabelecer uma aliança. “Fizeram” comunica naturalmente esse sentido, enquanto a imagem literal é preservada em nota.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: A expressão hebraica explicita que ambas as partes participaram; “os dois” preserva essa informação de modo conciso e natural.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” é o equivalente português consagrado para בְּרִית e preserva sua relevância como termo bíblico central, embora aqui também possua caráter de tratado.
theological_decisions:
- issue: Tradução da expressão כרת ברית
  choice: fizeram uma aliança
  alternative: cortaram uma aliança
  rationale: O hebraico emprega literalmente o verbo “cortar” numa expressão convencional para formalizar uma aliança. O texto principal usa português natural, e a nota conserva a forma literal e sua nuance pactual sem impor interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção coordenada preserva o ritmo narrativo hebraico; o ponto e vírgula distingue a entrega dos animais da celebração bilateral da aliança. O marcador foi colocado após “aliança”, termo ao qual a nota se refere.
