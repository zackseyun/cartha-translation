base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this slave woman and her son, for the son of this slave woman will not inherit with my son Isaac.”
translation:
  language: pt
  text: 'Então ela disse a Abraão: “Expulse esta escrava e o filho dela, pois o filho desta escrava não herdará com o meu filho, com Isaque.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Expulse
  rationale: O imperativo expressa afastamento forçado, não uma simples despedida. “Expulse” preserva a força do hebraico e é natural em português.
- source_word: הָאָמָה
  choice: escrava
  rationale: אָמָה designa uma mulher em condição servil. “Escrava” torna explícito o status social e jurídico relevante neste contexto.
- source_word: בְּנָהּ
  choice: o filho dela
  rationale: Reproduz de modo claro a construção possessiva e evita uma possível leitura momentânea de que se trata do filho de Abraão mencionado como tal.
- source_word: כִּי לֹא יִירַשׁ
  choice: pois ... não herdará
  rationale: כִּי introduz a razão da exigência, e יירשׁ refere-se a herdar ou receber a herança. O futuro mantém a força declarativa da fala.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: o filho desta escrava
  rationale: Mantém a repetição deliberada e o demonstrativo, preservando o tom de distanciamento enfático de Sara.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: com o meu filho, com Isaque
  rationale: Conserva a repetição de עִם e a estrutura enfática e apositiva do hebraico, ainda compreensível em português.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Então ela disse a Abraão
  rationale: “Então” transmite naturalmente a sequência narrativa indicada pelo waw consecutivo.
