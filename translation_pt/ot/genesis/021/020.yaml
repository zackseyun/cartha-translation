  text: וַ/יְהִ֧י אֱלֹהִ֛ים אֶת הַ/נַּ֖עַר וַ/יִּגְדָּ֑ל וַ/יֵּ֨שֶׁב֙ בַּ/מִּדְבָּ֔ר וַ/יְהִ֖י רֹבֶ֥ה קַשָּֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: pt
  text: Deus estava com o menino, e ele cresceu. Morou no deserto e tornou-se arqueiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se alguém que atirava com arco”. O hebraico o descreve literalmente como alguém que atira com o arco.'
    reason: Alternativa lexical que preserva mais de perto a forma da expressão hebraica.
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Deus estava com o menino
  rationale: A construção היה את expressa presença e, no contexto, cuidado ou apoio. A tradução mantém a afirmação simples da presença divina sem explicitar implicações além do texto. נַעַר é vertido pelo termo atual e natural “menino”.
- source_word: וַיִּגְדָּל
  choice: ele cresceu
  rationale: O verbo גדל indica aqui o crescimento e amadurecimento de Ismael. “Cresceu” preserva a concisão do hebraico sem acrescentar a ideia mais específica de que já se tornou adulto.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Morou no deserto
  rationale: ישב, neste contexto, descreve residência continuada, adequadamente expressa por “morou”. מִדְבָּר designa uma região árida e pouco habitada; “deserto” é claro e corrente em português.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: tornou-se arqueiro
  rationale: A expressão caracteriza Ismael como alguém que atirava com arco. “Tornou-se arqueiro” comunica esse sentido de modo conciso, natural e digno, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Fórmula da presença divina aplicada a Ismael
  choice: Deus estava com o menino
  alternative: Deus ajudava o menino
  rationale: A tradução conserva a linguagem de presença do hebraico, que pode implicar amparo, sem reduzi-la apenas a ajuda nem ampliar suas consequências teológicas.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é simples e narrativa; evitam-se formas arcaicas como “habitou” ou “mancebo”. O marcador da nota foi colocado após “arqueiro”, termo ao qual a nota lexical se refere.
