base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your slave woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: pt
  text: 'Mas Deus disse a Abraão: “Não fique aflito por causa do menino e por causa da sua escrava. Em tudo o que Sara lhe disser, escute a voz dela[a], pois é por meio de Isaque que a sua descendência será chamada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, dê ouvidos ao que Sara diz.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois em Isaque será chamada a sua descendência”; isto é, a linhagem de Abraão será identificada por meio de Isaque.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: não fique aflito
  rationale: O idioma hebraico descreve algo como penoso ou desagradável aos olhos de alguém. A formulação comunica naturalmente, em português atual, a aflição de Abraão indicada pelo contexto.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר designa aqui Ismael como menino ou jovem; “menino” é claro e corrente.
- source_word: אֲמָתֶךָ
  choice: sua escrava
  rationale: אָמָה indica uma mulher em condição servil. “Escrava” preserva a realidade social do termo sem suavizá-la.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: escute a voz dela
  rationale: Mantém a expressão hebraica e sua força idiomática de dar ouvidos ao que Sara diz, sem intensificá-la para “obedeça”.
- source_word: בְּיִצְחָק
  choice: por meio de Isaque
  rationale: A preposição בְּ indica aqui o meio ou a linha pela qual a descendência de Abraão será designada.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: a sua descendência será chamada
  rationale: Preserva a linguagem de chamar ou designar e a ambiguidade compacta da cláusula hebraica, sem reduzi-la a uma paráfrase doutrinária.
- source_word: זָרַע
  choice: descendência
  rationale: O substantivo coletivo זֶרַע refere-se à linhagem ou prole; “descendência” conserva bem esse sentido coletivo em português.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Mas Deus disse
  rationale: “Mas” expressa o contraste narrativo com a aflição de Abraão no versículo anterior.
theological_decisions:
- issue: Condição social de Agar
  choice: sua escrava
  alternative: sua serva
  rationale: A tradução conserva a condição subordinada e não livre expressa por אָמָה, em vez de amenizar essa realidade social.
- issue: Sentido da promessa relativa a Isaque
  choice: pois é por meio de Isaque que a sua descendência será chamada
  alternative: pois em Isaque será chamada para você uma descendência
  rationale: A redação portuguesa indica que a linhagem reconhecida como descendência de Abraão passa por Isaque, mas mantém o verbo “chamar” e não nega nem redefine explicitamente a relação biológica de Ismael com Abraão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “escute a voz dela” para refletir a imagem hebraica, esclarecida em nota; evita-se linguagem arcaica e paráfrase teológica excessiva.
