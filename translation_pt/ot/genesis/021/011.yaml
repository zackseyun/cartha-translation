  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: pt
  text: Isso desagradou muito a Abraão, por causa de seu filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A questão pareceu muito ruim aos olhos de Abraão, no que dizia respeito a seu filho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: desagradou
  rationale: No idioma hebraico com בְּעֵינֵי, o verbo expressa que algo pareceu ruim ou causou profundo desagrado; “desagradou” comunica esse valor de modo natural em português.
- source_word: הַדָּבָר
  choice: isso
  rationale: דבר pode significar “palavra, coisa, questão”. Aqui retoma o pedido de Sara no versículo anterior; “isso” produz uma retomada clara e natural sem explicitar além do hebraico.
- source_word: מְאֹד
  choice: muito
  rationale: Preserva de maneira direta e corrente a força do intensificador hebraico.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: a Abraão
  rationale: O hebraísmo literal “aos olhos de Abraão” indica a avaliação ou reação de Abraão. A formulação idiomática portuguesa evita rigidez sem perder o sentido; a imagem literal é registrada na nota.
- source_word: עַל אוֹדֹת
  choice: por causa de
  rationale: A locução pode introduzir causa ou assunto. Neste contexto, “por causa de” expressa naturalmente que o desagrado de Abraão se devia ao que envolvia seu filho.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Preserva a especificidade masculina e a relação familiar expressas por בן com o sufixo possessivo.
