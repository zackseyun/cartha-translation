  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: pt
  text: E Abraão viveu como estrangeiro na terra dos filisteus por muitos dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּגָר
  choice: viveu como estrangeiro
  rationale: O verbo גּוּר descreve a permanência de alguém como residente estrangeiro. A expressão é clara em português moderno e preserva uma nuance que apenas “ficou” poderia enfraquecer.
- source_word: בְּאֶרֶץ
  choice: na terra
  rationale: Neste contexto, אֶרֶץ designa o território associado aos filisteus; “terra” é natural e mantém a formulação bíblica corrente.
- source_word: פְּלִשְׁתִּים
  choice: dos filisteus
  rationale: É a forma portuguesa consagrada para o nome desse povo.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Reproduz de modo direto e natural o idioma hebraico literal “muitos dias”, sem substituí-lo pela interpretação mais geral “por muito tempo”.
- source_word: וַ
  choice: E
  rationale: O waw dá continuidade à narrativa; “E” preserva essa ligação sem acrescentar uma relação temporal mais específica.
