id: GEN.21.19
reference: Genesis 21:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: pt
  text: Então Deus abriu os olhos dela, e ela viu um poço de água. Ela foi, encheu o odre[a] de água e deu de beber ao menino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um recipiente feito de pele e usado para transportar líquidos.
    reason: esclarecimento lexical
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: abriu
  rationale: O verbo פקח significa comumente “abrir”, sobretudo em relação aos olhos. A escolha preserva a imagem concreta do hebraico sem explicar o modo da ação divina.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa o Deus singular da narrativa e rege um verbo no singular.
- source_word: עֵינֶיהָ
  choice: os olhos dela
  rationale: Reprodução clara e natural do objeto direto plural com o sufixo feminino singular.
- source_word: וַתֵּרֶא
  choice: ela viu
  rationale: Tradução direta de ראה, adequada à sequência narrativa depois de Deus abrir os olhos dela.
- source_word: בְּאֵר מָיִם
  choice: um poço de água
  rationale: Mantém os dois elementos da expressão hebraica e ressalta, como no original, a presença de água.
- source_word: וַתֵּלֶךְ
  choice: Ela foi
  rationale: Verbo simples de movimento que dá continuidade natural à sequência de ações.
- source_word: וַתְּמַלֵּא
  choice: encheu
  rationale: Equivalente corrente e preciso de מלא neste contexto.
- source_word: הַחֵמֶת
  choice: o odre
  rationale: חֵמֶת é um recipiente de pele usado para transportar líquidos. “Odre” é o termo português preciso; uma nota esclarece o objeto para leitores que não conheçam a palavra.
- source_word: מַיִם
  choice: de água
  rationale: Em português, “encher o odre de água” expressa de modo idiomático o conteúdo indicado pelo hebraico.
- source_word: וַתַּשְׁקְ
  choice: deu de beber
  rationale: O Hifil de שׁקה significa “dar de beber” ou “fazer beber”. A formulação escolhida é natural e conserva o sentido causativo.
- source_word: הַנַּעַר
  choice: ao menino
  rationale: נַעַר refere-se aqui a Ismael. “Menino” é claro, atual e adequado ao contexto.
theological_decisions:
- issue: Se “Deus abriu os olhos dela” deve ser mantido como ação divina literal ou explicado apenas como a percepção de um poço já presente
  choice: Deus abriu os olhos dela
  alternative: Deus fez com que ela percebesse o poço
  rationale: O hebraico atribui explicitamente a ação a Deus por meio da imagem de abrir os olhos. A tradução conserva essa afirmação e sua tensão teológica sem explicar o mecanismo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência breve de ações acompanha o ritmo narrativo hebraico. O marcador da nota foi colocado junto de “odre”, o termo efetivamente explicado pela nota.
