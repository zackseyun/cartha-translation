  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: pt
  text: E Abraão deu a seu filho, que lhe nasceu e que Sara lhe deu à luz, o nome de Isaque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: deu ... o nome de
  rationale: A construção hebraica significa literalmente “chamou o nome de”. Em português atual, “deu ... o nome de” preserva explicitamente שֵׁם e expressa com naturalidade o ato de nomear.
- source_word: בְּנוֹ
  choice: ao filho
  rationale: O filho já é identificado pela relação com Abraão, sujeito da oração; a construção portuguesa com “deu ao filho” comunica naturalmente essa relação possessiva sem repetir “seu”.
- source_word: הַנּוֹלַד לוֹ
  choice: que lhe nasceu
  rationale: Mantém o particípio passivo e o dativo relacional לוֹ, em formulação clara e idiomática em português.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: aquele que Sara lhe deu à luz
  rationale: Identifica Sara como mãe e conserva o segundo לוֹ por meio de “lhe”; “deu à luz” é a expressão portuguesa natural para ילד neste contexto.
- source_word: יִצְחָק
  choice: Isaque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A ordem final mantém o nome “Isaque” como complemento do ato de nomear, depois das duas qualificações do filho, acompanhando a estrutura e a ênfase do hebraico sem reproduzir literalmente o idiomatismo “chamou o nome”.
