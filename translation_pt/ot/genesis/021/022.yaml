base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: pt
  text: 'Naquele tempo, Abimeleque e Ficol, comandante do seu exército, disseram a Abraão: “Deus[a] está com você em tudo o que você faz”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente neste contexto: “Um deus está com você em tudo o que você faz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: A fórmula narrativa introduz uma nova cena situada no mesmo período. Em português, “Naquele tempo” comunica naturalmente a função temporal sem a construção pesada “E aconteceu naquele tempo”.
- source_word: וַיֹּאמֶר
  choice: disseram
  rationale: Embora o verbo hebraico esteja no singular antes do sujeito composto, o português moderno requer concordância plural com “Abimeleque e Ficol”.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Abimeleque e Ficol
  rationale: Transliteração dos nomes conforme formas portuguesas reconhecíveis e correntes.
- source_word: שַׂר צְבָאוֹ
  choice: comandante do seu exército
  rationale: שַׂר designa aqui um oficial superior, e צָבָא uma força militar; a expressão escolhida é clara e atual.
- source_word: אֶל אַבְרָהָם לֵאמֹר
  choice: 'a Abraão:'
  rationale: O infinitivo לֵאמֹר introduz o discurso direto e pode ser representado naturalmente pelos dois-pontos, sem o redundante “dizendo”.
- source_word: אֱלֹהִים עִמְּךָ
  choice: Deus está com você
  rationale: No contexto, אֱלֹהִים refere-se mais naturalmente a Deus como aquele cujo favor acompanha Abraão. “Está com você” preserva a ideia de presença e apoio.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: em tudo o que você faz
  rationale: Expressa com clareza o alcance abrangente da frase hebraica e traduz o particípio por um presente geral natural em português.
theological_decisions:
- issue: Referência de אֱלֹהִים na fala de Abimeleque
  choice: Deus
  alternative: um deus
  rationale: Embora אֱלֹהִים possa ter outros valores em certos contextos, a narrativa apresenta Abimeleque reconhecendo o favor divino que acompanha Abraão. “Deus” é a leitura contextual mais provável, sem acrescentar uma formulação doutrinária à fala.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula narrativa foi condensada de modo natural; o discurso direto permanece simples e solene. O pronome “você” evita regionalismo excessivo e torna explícito o singular do hebraico.
