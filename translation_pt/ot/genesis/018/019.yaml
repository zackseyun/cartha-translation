    issue: Construção de “ordenar” com a oração subsequente
    rationale: “Ordene a seus filhos e à sua casa depois dele que guardem” é compreensível, mas a posição de “depois dele” e de “que guardem” pode dificultar a identificação da estrutura sintática. “Ordene que seus filhos e sua casa, depois dele, guardem” é mais fluente e conserva o sentido.
  - severity: medium
    issue: Nota b amplia indevidamente “filhos” para “descendentes”
    rationale: בָּנָיו é plural masculino e designa primariamente os filhos homens de Abraão. “Descendentes” pode incluir gerações posteriores e pessoas que o termo, por si só, não especifica. A ampliação do grupo vem de “sua casa”, não do significado lexical de בָּנָיו.
  revised_text: Pois eu o conheci[a], para que ele ordene que seus filhos e sua casa, depois dele, guardem o caminho de Yahweh[c], praticando a justiça e o direito, para que Yahweh faça vir sobre Abraão o que falou a respeito dele[d].
