id: GEN.18.19
reference: Genesis 18:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: pt
  text: Pois eu o conheci[a], para que ele ordene que seus filhos e sua casa, depois dele, guardem o caminho de Yahweh[c], praticando a justiça e o direito, para que Yahweh faça vir sobre Abraão o que falou a respeito dele[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu o escolhi”. O verbo hebraico geralmente significa “conhecer”, mas neste contexto pode envolver consideração especial ou escolha.'
    reason: alternative_reading
  - marker: c
    text: Isto é, a maneira de viver requerida por Yahweh.
    reason: cultural_note
  - marker: d
    text: 'Ou: “o que lhe prometeu”. Mais literalmente, o hebraico diz: “o que falou a respeito dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior e mantém, em português natural, a força explicativa da conjunção.
- source_word: יְדַעְתִּיו
  choice: eu o conheci
  rationale: Preserva o sentido lexical básico de ידע, sem transformar no texto principal a possível conotação de escolha divina.
- source_word: לְמַעַן אֲשֶׁר
  choice: para que
  rationale: Expressa naturalmente propósito e possível resultado.
- source_word: יְצַוֶּה
  choice: ordene
  rationale: O piel de צוה tem aqui a força de ordenar ou incumbir, mais forte que apenas ensinar.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Em português, 'filhos' pode representar o plural masculino hebraico e, conforme o contexto, abranger os descendentes; a nota registra a forma masculina.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: Mantém a expressão concreta e ampla do hebraico, aqui entendida como as pessoas pertencentes ao âmbito doméstico de Abraão.
- source_word: וְשָׁמְרוּ
  choice: que guardem
  rationale: שׁמר com 'caminho' indica observar e seguir fielmente; a construção subordinada evita uma coordenação pouco natural em português.
- source_word: דֶּרֶךְ יְהוָה
  choice: o caminho de Yahweh
  rationale: Preserva a metáfora hebraica para a maneira de viver requerida por Yahweh.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: praticando a justiça e o direito
  rationale: O gerúndio explicita como se guarda o caminho; 'justiça e direito' distingue os dois termos correlatos e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: הָבִיא ... עַל
  choice: faça vir sobre
  rationale: Reproduz de perto a construção causativa hebraica sem antecipar se o conteúdo falado é promessa.
- source_word: דִּבֶּר עָלָיו
  choice: falou a respeito dele
  rationale: Mantém a formulação literal e sua referência potencialmente ambígua, em vez de explicitar 'prometeu a ele'.
theological_decisions:
- issue: Se ידע deve ser traduzido com força eletiva ('escolhi') ou relacional ('conheci')
  choice: eu o conheci
  alternative: eu o escolhi
  rationale: Embora o contexto permita a ideia de eleição ou consideração especial, o verbo significa primariamente 'conhecer'. A tradução principal conserva a forma lexical e a nota registra a interpretação plausível.
- issue: Forma de representar o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino; sua transliteração preserva essa distinção em relação a um título.
- issue: Sentido de אֲשֶׁר דִּבֶּר עָלָיו
  choice: o que falou a respeito dele
  alternative: o que lhe prometeu
  rationale: A alternativa é contextualmente possível, mas acrescenta explicitamente a noção de promessa e resolve a relação pronominal; o texto principal preserva a formulação hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém a metáfora 'caminho', o nome Yahweh e as ambiguidades de ידע e דיבר עליו; as notas esclarecem alternativas sem sobrecarregar o versículo.
