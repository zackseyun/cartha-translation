  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: pt
  text: 'E se faltarem cinco para completar os cinquenta justos? Destruirás a cidade inteira por causa desses cinco? Ele respondeu: “Não a destruirei, se eu encontrar ali quarenta e cinco.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: E se
  rationale: Introduz de modo natural a hipótese apresentada por Abraão, preservando o caráter condicional e cauteloso da pergunta.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: faltarem cinco para completar os cinquenta justos
  rationale: Expressa claramente que o número requerido de cinquenta está cinco abaixo, evitando sugerir que cinco pessoas específicas desapareceram do grupo.
- source_word: הַצַּדִּיקִם
  choice: justos
  rationale: Termo corrente que preserva o sentido moral e judicial do hebraico צַדִּיקִים.
- source_word: הֲתַשְׁחִית
  choice: Destruirás
  rationale: Traduz diretamente o hifil de שׁחת e mantém a correspondência lexical com a resposta divina.
- source_word: בַּחֲמִשָּׁה
  choice: por causa desses cinco
  rationale: A preposição בּ indica causa ou motivo; “desses” esclarece que se trata da falta de cinco para atingir cinquenta.
- source_word: אֶת כָּל הָעִיר
  choice: a cidade inteira
  rationale: Equivalente natural de “toda a cidade”, preservando a ideia de totalidade.
- source_word: לֹא אַשְׁחִית
  choice: Não a destruirei
  rationale: Repete o verbo da pergunta e explicita, por meio do pronome, que o objeto é a cidade.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: se eu encontrar ali quarenta e cinco
  rationale: Preserva a condição e verte o numeral hebraico em sua forma idiomática moderna.
theological_decisions:
- issue: Tradução de צַדִּיקִים
  choice: justos
  alternative: íntegros
  rationale: “Justos” mantém o peso moral e judicial do termo e sua conexão com a distinção entre o justo e o perverso no contexto imediato, sem restringi-lo a uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural tanto no Brasil como em outros contextos lusófonos. A formulação inicial esclarece a aritmética implícita no hebraico sem eliminar a natureza hipotética da intercessão.
