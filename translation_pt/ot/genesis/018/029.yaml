base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: pt
  text: 'Ele voltou a falar com ele e disse: “Talvez se encontrem ali quarenta.” E ele respondeu: “Não farei isso[a] em consideração aos quarenta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não destruirei [a cidade]”. O hebraico diz simplesmente “Não farei”, deixando a ação implícita pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: voltou a falar
  rationale: A combinação de יסף, עוד e o infinitivo indica repetição ou continuação. “Voltou a falar” expressa naturalmente o caráter reiterado da fala, sem reproduzir de modo rígido o sentido literal de “acrescentou”.
- source_word: אֵלָיו
  choice: com ele
  rationale: Embora אֶל indique normalmente direção, em português “falar com ele” é a construção idiomática mais natural para este diálogo e não altera a relação expressa no hebraico.
- source_word: אוּלַי
  choice: Talvez
  rationale: Introduz uma possibilidade cautelosa na intercessão de Abraão e corresponde diretamente ao valor modal do termo hebraico.
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: se encontrem ali quarenta
  rationale: O nifal de מצא tem sentido passivo, “ser encontrados”. A construção com “se encontrem” é corrente em português e preserva a hipótese sem acrescentar “justos”, palavra subentendida pelo contexto, mas ausente neste versículo.
- source_word: לֹא אֶעֱשֶׂה
  choice: Não farei isso
  rationale: O hebraico deixa implícito o objeto da ação. “Isso” torna a frase natural em português sem explicitar no texto principal que a ação seria destruir a cidade.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: por causa dos quarenta
  rationale: בַּעֲבוּר exprime motivo ou consideração em favor de alguém. A formulação escolhida é clara, corrente e mantém a referência definida a “os quarenta”.
theological_decisions:
- issue: Objeto implícito da ação divina em לֹא אֶעֱשֶׂה
  choice: Não farei isso
  alternative: Não a destruirei
  rationale: O texto hebraico não nomeia a ação nesta oração, mas remete ao juízo discutido no contexto. A tradução conserva essa elipse em vez de especificar a destruição da cidade no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição dos pronomes preserva a estrutura do hebraico e depende do contexto para identificar Abraão e o Senhor. Não se acrescentou “justos” após “quarenta”, pois o substantivo está implícito no original.
