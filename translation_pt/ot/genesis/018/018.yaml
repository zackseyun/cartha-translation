  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: pt
  text: Abraão certamente se tornará uma nação grande e poderosa, e nele serão abençoadas todas as nações da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e por meio dele todas as nações da terra abençoarão a si mesmas”. A forma hebraica pode ser entendida dessa maneira, embora o texto principal a interprete como passiva: “nele serão abençoadas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: certamente se tornará
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a afirmação futura. “Certamente se tornará” expressa com naturalidade tanto a ênfase quanto a ideia de vir a ser uma nação.
- source_word: לְגוֹי
  choice: uma nação
  rationale: גוי designa uma nação ou povo. “Nação” mantém a correspondência lexical com a referência posterior a todas as nações da terra.
- source_word: גָּדוֹל
  choice: grande
  rationale: “Grande” conserva a possível ideia tanto de dimensão quanto de importância e é natural no contexto da promessa.
- source_word: וְעָצוּם
  choice: e poderosa
  rationale: עצום pode comunicar força, poder ou grandeza numérica. “Poderosa” forma uma combinação natural com “grande” sem restringir o sentido apenas à quantidade.
- source_word: וְנִבְרְכוּ
  choice: serão abençoadas
  rationale: O nifal de ברך pode ser entendido como passivo, apresentando as nações como recebedoras da bênção. A possibilidade reflexiva é preservada em nota.
- source_word: בוֹ
  choice: nele
  rationale: A preposição ב com o sufixo indica aqui relação ou associação com Abraão. “Nele” reproduz de perto a expressão hebraica sem explicitar além do necessário um sentido instrumental como “por meio dele”.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: todas as nações da terra
  rationale: A expressão tem alcance universal neste contexto. “Nações” mantém a consistência com גוי no início do versículo, e “terra” é a opção natural para הָאָרֶץ nesta fórmula.
theological_decisions:
- issue: Sentido da fórmula da bênção abraâmica
  choice: 'As nações são apresentadas como recebedoras da bênção em relação com Abraão: “nele serão abençoadas”.'
  alternative: As nações “abençoarão a si mesmas por meio dele”, usando Abraão como fórmula ou modelo de bênção.
  rationale: A forma nifal de ברך admite discussão entre uma leitura passiva e uma reflexiva. A leitura passiva se ajusta bem ao contexto amplo da promessa, mas a alternativa lexicalmente possível é mantida em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “nele serão abençoadas todas as nações” preserva a ênfase inicial do hebraico em Abraão e mantém um tom solene sem soar arcaico.
