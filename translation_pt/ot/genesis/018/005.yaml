base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: pt
  text: 'Deixem-me trazer um pouco de pão[a], para que recuperem as forças[b]; depois poderão seguir viagem, pois foi por isso que passaram por este seu servo. Eles disseram: “Sim, faça como disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida como “um pedaço de pão”; neste contexto, é uma maneira modesta de descrever a hospitalidade oferecida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sustentem” ou “fortaleçam o coração de vocês”; o hebraísmo se refere a recuperar as forças com alimento.
    reason: hebrew_idiom
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Deixem-me trazer
  rationale: O coortativo qal na primeira pessoa expressa a oferta cortês de Abraão; a formulação preserva o tom volitivo e hospitaleiro.
- source_word: פַת לֶחֶם
  choice: um pouco de pão
  rationale: A expressão indica uma pequena porção de pão e funciona como modesta minimização hospitaleira; esta forma é clara e natural em português atual.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: para que recuperem as forças
  rationale: O hebraísmo fala literalmente em sustentar ou fortalecer o coração por meio do alimento. A tradução comunica naturalmente o sentido no contexto, enquanto a nota preserva a imagem original.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: depois poderão seguir viagem
  rationale: Aqui עבר se refere à continuação da jornada; a tradução expressa esse sentido de modo idiomático.
- source_word: כִּי עַל כֵּן
  choice: pois foi por isso que
  rationale: A locução introduz a razão apresentada por Abraão e mantém a formulação enfática, sem explicar além do texto.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: passaram por este seu servo
  rationale: A redação conserva o verbo de passagem e a autodesignação deferente de Abraão. “Este seu servo” torna claro que ele fala de si mesmo.
- source_word: וַיֹּאמְרוּ
  choice: Eles disseram
  rationale: Forma narrativa direta e natural, correspondente ao wayyiqtol hebraico.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: Faça como você disse
  rationale: A resposta breve expressa assentimento e confirma a proposta de Abraão sem acrescentar ênfase ausente do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” de modo implícito na fala aos visitantes e “você” na resposta dirigida a Abraão. A tradução prioriza naturalidade sem eliminar os hebraísmos relevantes, que são registrados em notas.
