  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: pt
  text: 'Então Yahweh disse: “Se eu encontrar cinquenta justos dentro da cidade de Sodoma, pouparei[a] o lugar inteiro por causa deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perdoarei”. O verbo hebraico pode ter o sentido de retirar a culpa ou suspender o juízo; neste contexto, “pouparei” expressa com clareza o resultado pretendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אִם אֶמְצָא
  choice: Se eu encontrar
  rationale: Reproduz de maneira direta e natural a condição apresentada na fala divina.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: dentro da cidade de Sodoma
  rationale: Combina naturalmente as duas indicações locativas do hebraico, mantendo Sodoma como a cidade em questão e preservando a ideia de presença em seu interior.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: cinquenta justos
  rationale: “Justos” é substantivado naturalmente em português e não restringe indevidamente o grupo apenas a homens.
- source_word: וְנָשָׂאתִי
  choice: pouparei
  rationale: Neste contexto de juízo, נָשָׂא indica não executar a destruição contra o lugar; “pouparei” comunica claramente essa força, enquanto a nota conserva a alternativa lexical “perdoarei”.
- source_word: לְכָל הַמָּקוֹם
  choice: o lugar inteiro
  rationale: Preserva tanto o referente espacial de מָקוֹם quanto o alcance total indicado por כָּל.
- source_word: בַּעֲבוּרָם
  choice: por causa deles
  rationale: Expressa naturalmente que a presença dos justos seria a razão para poupar o lugar, sem acrescentar uma ideia ausente do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o preserva por transliteração, sem substituí-lo pelo título “Senhor”.
- issue: Sentido de וְנָשָׂאתִי no contexto do juízo sobre Sodoma
  choice: pouparei
  alternative: perdoarei
  rationale: “Pouparei” explicita o resultado contextual — a suspensão da destruição de todo o lugar — sem negar a possível nuance de perdão do verbo, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem foi levemente ajustada para evitar repetição locativa pouco idiomática, sem perder nenhum componente semântico relevante do hebraico.
