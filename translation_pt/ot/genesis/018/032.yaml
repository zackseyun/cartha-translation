base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: pt
  text: 'Então ele disse: “Por favor, meu senhor[a], não se ire, e falarei apenas mais esta vez. Talvez se encontrem ali dez.” Então ele disse: “Não o destruirei[b] por causa dos dez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu Senhor”. O hebraico usa aqui um tratamento respeitoso que pode ser entendido de modo reverencial; não emprega o nome divino YHWH.'
    reason: theological_ambiguity
  - marker: b
    text: 'O hebraico diz literalmente: “Não destruirei por causa dos dez”, deixando o objeto subentendido pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Por favor, que ... não se ire
  rationale: Reproduz a súplica cortês marcada por נָא e o idioma de חרה, que expressa o acender da ira, em português digno e compreensível.
- source_word: לַאדֹנָי
  choice: o meu senhor
  rationale: Mantém o tratamento respeitoso direto sem identificá-lo explicitamente com o nome divino YHWH, que não aparece no versículo; a inicial minúscula preserva essa cautela interpretativa.
- source_word: וַאֲדַבְּרָה
  choice: e falarei
  rationale: O coortativo exprime a intenção ou o pedido de Abraão para continuar falando; o futuro funciona naturalmente dentro da súplica.
- source_word: אַךְ הַפַּעַם
  choice: apenas mais esta vez
  rationale: Comunica a restrição de אַךְ e, no contexto da negociação, deixa claro que esta será a última intervenção.
- source_word: אוּלַי
  choice: Talvez
  rationale: Preserva o caráter hipotético da possibilidade apresentada por Abraão.
- source_word: יִמָּצְאוּן שָׁם
  choice: se encontrem ali
  rationale: Representa o nifal passivo de מצא e usa o subjuntivo português adequado depois de “talvez”.
- source_word: עֲשָׂרָה
  choice: dez
  rationale: Tradução direta do numeral cardinal; as pessoas justas permanecem implícitas como no hebraico.
- source_word: לֹא אַשְׁחִית
  choice: Não o destruirei
  rationale: O hifil de שׁחת significa destruir. O pronome masculino retoma naturalmente o lugar em discussão, embora o objeto esteja implícito no hebraico.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: por causa dos dez
  rationale: Expressa que a preservação ocorre em consideração aos dez mencionados, sem acrescentar ao texto a qualificação “justos”.
theological_decisions:
- issue: Referente e capitalização de אֲדֹנָי no tratamento de Abraão
  choice: o meu senhor
  alternative: o Senhor
  rationale: Embora o contexto mais amplo descreva uma aparição divina, o termo deste versículo não é o nome YHWH. A forma em minúscula conserva o tratamento reverente e evita resolver além do necessário a identidade do interlocutor.
- issue: Identidade dos “dez”
  choice: dez
  alternative: dez justos
  rationale: O contexto indica pessoas justas, mas o versículo traz somente o numeral. A tradução não explicita o complemento para preservar a concisão e a elipse do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “que o meu senhor não se ire” conserva a forma respeitosa de terceira pessoa do hebraico sem soar excessivamente arcaica. A repetição de “Então ele disse” acompanha a formulação narrativa hebraica e evita identificar os falantes por nomes não presentes no versículo.
