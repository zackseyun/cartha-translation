source:
  edition: WLC
  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: pt
  text: 'E Yahweh disse[a]: “Devo esconder de Abraão o que estou fazendo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Estou escondendo de Abraão o que estou fazendo?”'
    reason: alternativa lexical que preserva a forma participial hebraica
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: E Yahweh
  rationale: O waw narrativo dá continuidade ao relato, e o nome divino יהוה é transliterado como “Yahweh”, preservando seu caráter de nome próprio.
- source_word: אָמָר
  choice: disse
  rationale: O wayyiqtol faz a narrativa avançar e corresponde naturalmente ao pretérito perfeito em português.
- source_word: הַֽ/מְכַסֶּה אֲנִי
  choice: Devo esconder
  rationale: A partícula interrogativa com o particípio formula uma pergunta deliberativa. “Devo esconder...?” comunica essa nuance em português corrente, enquanto a forma mais literal é registrada em nota.
- source_word: מֵֽ/אַבְרָהָם
  choice: de Abraão
  rationale: Depois de “esconder”, a preposição מִן é expressa naturalmente por “de” em português.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: o que estou fazendo
  rationale: A expressão relativa é vertida idiomaticamente por “o que”, e o particípio עֹשֶׂה é mantido como ação em curso, sem acrescentar explicitamente a noção interpretativa de iminência.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da pergunta divina
  choice: 'pergunta deliberativa: “Devo esconder...?”'
  alternative: 'pergunta progressiva literal: “Estou escondendo...?”'
  rationale: A construção interrogativa com particípio admite uma leitura formalmente progressiva, mas, no contexto, funciona como deliberação retórica. A alternativa literal é preservada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. Mantém-se “Yahweh” como nome próprio e evita-se explicitar “estou prestes a fazer”, nuance possível no contexto, mas não marcada diretamente no hebraico.
