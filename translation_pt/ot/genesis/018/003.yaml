  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: pt
  text: 'E disse: “Meu senhor,[a] se achei favor aos seus olhos, por favor, não passe adiante do seu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor”, entendendo que Abraão se dirige especificamente a Deus, e não apenas ao visitante com um tratamento respeitoso.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E disse
  rationale: Conserva o fluxo narrativo do wayyiqtol hebraico sem explicitar mais do que o texto.
- source_word: אֲדֹנָי
  choice: Meu senhor
  rationale: Mantém no texto principal a leitura como tratamento respeitoso dirigido ao visitante singular, sem eliminar a possível leitura como título divino.
- source_word: אִם נָא
  choice: se
  rationale: Introduz a fórmula condicional cortês; a deferência de נָא é expressa naturalmente pelo “por favor” no pedido seguinte, evitando repetição artificial.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: achei favor aos seus olhos
  rationale: Preserva a imagem do idioma hebraico em formulação clara e corrente, sem introduzir associações teológicas não exigidas por “graça”.
- source_word: אַל נָא
  choice: por favor, não
  rationale: Reproduz a proibição acompanhada da partícula de súplica em português natural e respeitoso.
- source_word: תַעֲבֹר מֵעַל
  choice: passe adiante sem parar junto a
  rationale: No contexto do convite à hospitalidade, expressa o movimento de seguir viagem passando pelo anfitrião; a formulação evita que “passar por” seja entendida como visitar.
- source_word: עַבְדֶּךָ
  choice: seu servo
  rationale: É a forma portuguesa natural de autodesignação deferente diante de um superior ou hóspede honrado; “escravo” destacaria indevidamente uma condição jurídica.
theological_decisions:
- issue: Se אֲדֹנָי deve ser traduzido como título divino (“Senhor”) ou como tratamento respeitoso (“meu senhor”)
  choice: meu senhor
  alternative: Senhor
  rationale: Embora Gênesis 18 apresente o SENHOR aparecendo a Abraão e a tradição massorética possa favorecer a leitura divina, a fala imediata dirige formas singulares a um dos visitantes. O texto principal conserva a leitura social possível, e a nota registra a leitura divina sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “achei favor aos seus olhos” preserva deliberadamente o idioma hebraico; “por favor” comunica a cortesia sem duplicar a partícula נָא.
