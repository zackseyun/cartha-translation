  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: pt
  text: Há alguma coisa difícil demais para Yahweh?[a] No tempo determinado, voltarei a você, por esta época no ano que vem,[b] e Sara terá um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há alguma coisa maravilhosa demais para Yahweh?” O verbo hebraico pode referir-se ao que é maravilhoso, extraordinário ou além da capacidade de alguém.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por esta época da vida”. A expressão hebraica é difícil e provavelmente significa a mesma época no ano seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: difícil demais
  rationale: O nifal de פלא pode indicar algo extraordinário, maravilhoso ou além da capacidade de alguém. Na pergunta retórica, “difícil demais” comunica naturalmente a ideia de algo que excederia o poder de Yahweh, sem intensificar o sentido para “impossível”.
- source_word: מֵיְהוָה
  choice: para Yahweh
  rationale: Com פלא, a preposição מן indica limitação ou comparação. Em português, “difícil demais para Yahweh” expressa de modo claro e idiomático essa relação.
- source_word: דָּבָר
  choice: alguma coisa
  rationale: Embora דָּבָר possa significar “coisa”, “questão” ou “palavra”, a construção interrogativa pede em português a expressão abrangente e natural “alguma coisa”.
- source_word: לַמּוֹעֵד
  choice: No tempo determinado
  rationale: מוֹעֵד designa um tempo marcado ou estabelecido. “Tempo determinado” preserva a ideia de uma ocasião definida.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: voltarei a você
  rationale: שׁוּב expressa retorno, e אֵלֶיךָ se dirige a Abraão no masculino singular. A formulação mantém ambos os elementos sem inserir o nome do destinatário.
- source_word: כָּעֵת חַיָּה
  choice: por esta época no ano que vem
  rationale: A expressão idiomática hebraica é difícil e, no contexto, aponta para a mesma época do ano seguinte. A tradução torna explícito esse sentido temporal provável, enquanto a nota preserva a forma literal.
- source_word: וּלְשָׂרָה בֵן
  choice: e Sara terá um filho
  rationale: A oração hebraica não contém verbo expresso, mas o contexto futuro torna natural e claro em português suprir “terá”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Força da pergunta retórica
  choice: Existe alguma coisa difícil demais para Yahweh?
  alternative: Existe alguma coisa maravilhosa demais para Yahweh?; Existe alguma coisa impossível para Yahweh?
  rationale: “Difícil demais” mantém o foco no poder de Yahweh para cumprir a promessa, preservando a amplitude lexical de פלא sem reduzi-la apenas ao maravilhoso nem fortalecê-la para uma formulação absoluta com “impossível”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da fala e a pergunta retórica foram preservadas; as duas ambiguidades lexicais relevantes são registradas em notas.
