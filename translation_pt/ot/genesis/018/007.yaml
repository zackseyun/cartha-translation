  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: pt
  text: Então Abraão correu até o gado, pegou um bezerro tenro e bom e o entregou ao jovem[a], que se apressou em prepará-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo” ou “rapaz”. O termo hebraico הַנַּעַר pode designar um jovem ou um servo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: o rebanho
  rationale: O termo se refere coletivamente ao gado bovino; “rebanho” é natural em português e comunica que Abraão foi escolher um animal.
- source_word: רָץ
  choice: correu
  rationale: Preserva o sentido direto do verbo e a vivacidade da hospitalidade urgente de Abraão.
- source_word: בֶּן־בָּקָר
  choice: um bezerro
  rationale: A expressão hebraica designa um bovino jovem; “bezerro” é a forma idiomática adequada ao contexto de preparação da refeição.
- source_word: רַךְ וָטוֹב
  choice: tenro e bom
  rationale: Mantém de perto os dois qualificativos hebraicos, indicando maciez e boa qualidade sem ampliar indevidamente o sentido.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: Preserva o sentido lexical sem decidir se ele era especificamente servo ou apenas um rapaz.
- source_word: וַיְמַהֵר
  choice: se apressou
  rationale: Expressa de maneira natural a ação rápida destacada pelo verbo hebraico.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: em prepará-lo
  rationale: Embora עשה tenha sentido amplo de fazer, neste contexto culinário significa preparar o animal para a refeição.
