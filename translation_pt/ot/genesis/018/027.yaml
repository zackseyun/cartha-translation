  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: pt
  text: 'Então Abraão respondeu e disse: “Eis que, por favor, atrevi-me a falar ao meu Senhor[a], embora eu seja pó e cinza.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu senhor”. A forma hebraica pode ser usada como tratamento respeitoso; aqui, “Senhor” aparece com inicial maiúscula porque o contexto identifica o destinatário de Abraão com o SENHOR.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu e disse
  rationale: Mantém os dois verbos da fórmula narrativa hebraica e o caráter formal do diálogo, sem dificultar a compreensão em português.
- source_word: הִנֵּה נָא
  choice: Eis que
  rationale: “Eis que” conserva a função de chamar atenção e combina com o registro solene da fala. A nuance deferente de נָא também é comunicada pelo conjunto da declaração humilde; uma reprodução mecânica como “eis que, por favor” seria pouco natural em português.
- source_word: הוֹאַלְתִּי
  choice: me atrevi
  rationale: Expressa que Abraão tomou sobre si a ousadia de falar, preservando simultaneamente sua coragem e sua atitude humilde.
- source_word: לְדַבֵּר
  choice: a falar
  rationale: Equivalente direto e natural do infinitivo hebraico.
- source_word: אֶל־אֲדֹנָי
  choice: ao meu Senhor
  rationale: Preserva o sufixo possessivo e a forma de tratamento. A inicial maiúscula reflete a identificação contextual do destinatário com o SENHOR, sem substituir o termo hebraico pelo nome divino.
- source_word: וְאָנֹכִי
  choice: embora eu seja
  rationale: Explicita em português o contraste concessivo entre a ousadia de Abraão e sua condição humilde, implícito na coordenação hebraica.
- source_word: עָפָר וָאֵפֶר
  choice: pó e cinza
  rationale: Reproduz a expressão hebraica de mortalidade e insignificância em uma formulação consagrada e natural em português.
theological_decisions:
- issue: Sentido e capitalização de אֲדֹנָי na fala de Abraão
  choice: meu Senhor
  alternative: meu senhor
  rationale: A forma hebraica pode ser um tratamento respeitoso dirigido a uma autoridade humana, mas o contexto imediato identifica o destinatário com o SENHOR. A maiúscula comunica essa identificação contextual, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade adequada ao diálogo. A fórmula “respondeu e disse” e a expressão “Eis que” preservam traços retóricos do hebraico sem recorrer a vocabulário arcaico.
