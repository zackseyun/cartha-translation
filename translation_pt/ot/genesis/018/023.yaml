  text: וַ/יִּגַּ֥שׁ אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הַ/אַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: pt
  text: 'Então Abraão se aproximou e disse: “Será que de fato varrerás o justo com o perverso?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruirás” ou “eliminarás”; o verbo hebraico transmite a ideia de remover em juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: O verbo נגשׁ indica aproximar-se ou chegar perto; a escolha preserva tanto o movimento de Abraão quanto sua iniciativa de interceder.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: Tradução natural do verbo narrativo comum אמר.
- source_word: הַאַף
  choice: Será que de fato
  rationale: A combinação da partícula interrogativa com אַף intensifica a pergunta; esta formulação comunica a surpresa e o apelo respeitoso de Abraão.
- source_word: תִּסְפֶּה
  choice: eliminarás
  rationale: O verbo ספה expressa remover ou fazer perecer em juízo. “Eliminar” é claro e natural; a nota registra alternativas que preservam sua imagem mais forte.
- source_word: צַדִּיק
  choice: o justo
  rationale: Embora singular, o termo funciona genericamente como categoria moral e judicial.
- source_word: עִם
  choice: com
  rationale: Preserva diretamente a ideia de que justo e perverso sofreriam o mesmo destino.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Mantém o singular genérico e expressa a categoria moral em contraste com “o justo”.
theological_decisions:
- issue: Categorias morais no singular genérico
  choice: “o justo” e “o perverso”
  alternative: “os justos” e “os perversos”, ou “a pessoa justa” e “a pessoa perversa”
  rationale: O hebraico emprega formas singulares com valor representativo para formular uma questão sobre a justiça divina. Manter o singular preserva a forma e a tensão do texto sem restringi-lo necessariamente a apenas dois indivíduos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Será que de fato” reproduz naturalmente a pergunta enfática, e “o justo com o perverso” conserva o contraste judicial e o singular genérico do hebraico.
