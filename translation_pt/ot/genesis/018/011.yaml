lexical_decisions:
- source_word: זְקֵנִים
  choice: idosos
  rationale: Expressa naturalmente a idade avançada de Abraão e Sara e mantém a distinção em relação à expressão idiomática seguinte.
- source_word: בָּאִים בַּיָּמִים
  choice: avançados em dias
  rationale: Preserva a imagem hebraica de ter avançado nos dias, em linguagem solene mas compreensível.
- source_word: חָדַל לִהְיוֹת
  choice: havia cessado
  rationale: Mantém o sentido de interrupção completa expresso por חָדַל e a relação temporal anterior ao episódio narrado.
- source_word: אֹרַח כַּנָּשִׁים
  choice: o costume das mulheres
  rationale: Conserva o eufemismo hebraico para a menstruação sem tornar o texto principal clinicamente explícito.
- source_word: לְשָׂרָה
  choice: para Sara
  rationale: Reproduz a relação marcada pela preposição ל e forma uma construção portuguesa clara com “havia cessado”.
