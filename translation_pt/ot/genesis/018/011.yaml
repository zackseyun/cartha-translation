  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: pt
  text: Abraão e Sara eram idosos, avançados em dias; Sara já não tinha o costume das mulheres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o costume das mulheres”, expressão discreta que significa que Sara já não menstruava.'
