base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: pt
  text: Vou descer agora e ver se o que eles fizeram corresponde plenamente ao clamor dela que chegou até mim[a]; se não, saberei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se eles fizeram tudo conforme o clamor dela que chegou até mim”. A construção hebraica é incomum e indica que se verificará se os atos correspondem plenamente ao clamor. «Dela» conserva uma relação que o hebraico não especifica mais precisamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Vou descer agora
  rationale: O coortativo expressa a resolução do falante, e נָא assinala aqui prontidão ou imediatidade. “Vou descer agora” transmite isso de modo natural em português.
- source_word: וְאֶרְאֶה
  choice: e ver
  rationale: Mantém a imagem concreta de examinar pessoalmente, sem explicá-la ou suavizá-la.
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: ao clamor que chegou até mim
  rationale: צְעָקָה é um clamor provocado por grave injustiça. A formulação conserva a oração relativa e evita decidir se o sufixo indica origem, associação ou um clamor contra a cidade.
- source_word: עָשׂוּ כָּלָה
  choice: se o que eles fizeram corresponde plenamente
  rationale: A construção hebraica é difícil e expressa a verificação de que os atos correspondem por completo ao clamor. A reestruturação é idiomática em português e conserva tanto o sujeito plural implícito quanto a ideia de totalidade.
- source_word: וְאִם לֹא אֵדָעָה
  choice: se não, saberei
  rationale: Reproduz de maneira concisa a alternativa condicional e conserva o verbo “saber”, sem substituí-lo pela interpretação “descobrirei”.
theological_decisions:
- issue: Investigação divina em linguagem antropomórfica
  choice: Conservar “Vou descer agora e ver” e “saberei”
  alternative: Explicar como “vou examinar e julgar” ou reformular para destacar a onisciência divina
  rationale: O hebraico apresenta Deus em termos narrativos humanos. A tradução preserva essa tensão teológica sem a resolver por meio de paráfrase doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente reestruturada para expressar naturalmente o difícil idioma hebraico, sem eliminar sua ambiguidade, registrada na nota.
