  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: pt
  text: 'Ele ergueu os olhos e olhou: eis que três homens estavam em pé perto dele.[a] Quando os viu, correu da entrada da tenda ao encontro deles e se curvou até o chão.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao lado dele”. A preposição hebraica pode indicar proximidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “se prostrou por terra”. O verbo descreve um gesto de profunda deferência e, por si só, não exige o sentido de “adorou”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: ergueu os olhos
  rationale: Preserva a expressão concreta do hebraico e continua clara e natural em português moderno.
- source_word: וַיַּרְא
  choice: e olhou
  rationale: No primeiro uso, acompanha “ergueu os olhos” e expressa o ato de dirigir a atenção visual sem antecipar a repetição posterior de “viu”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a força apresentativa e vívida do marcador narrativo hebraico em registro digno e compreensível.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: três homens
  rationale: Traduz diretamente o substantivo masculino do texto e preserva a forma como as figuras são apresentadas na narrativa.
- source_word: נִצָּבִים עָלָיו
  choice: estavam em pé perto dele
  rationale: Comunica postura e proximidade sem sugerir necessariamente que os homens pairavam fisicamente sobre Abraão.
- source_word: וַיַּרְא
  choice: Quando os viu
  rationale: O segundo uso introduz naturalmente a reação de Abraão e evita uma sequência portuguesa excessivamente rígida de verbos ligados por “e”.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: correu ... ao encontro deles
  rationale: Preserva tanto o movimento rápido indicado pelo verbo quanto a direção da ação.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: da entrada da tenda
  rationale: É uma tradução natural e precisa da expressão que designa a abertura ou entrada da tenda.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: se curvou até o chão
  rationale: Retrata o gesto corporal de profunda deferência sem impor, só por esse verbo, o sentido especificamente religioso de adoração.
theological_decisions:
- issue: Se o gesto de Abraão deve ser traduzido como adoração dirigida a uma figura divina
  choice: se curvou até o chão
  alternative: adorou; prostrou-se por terra
  rationale: O verbo hebraico pode indicar prostração reverente tanto diante de seres humanos quanto diante de Deus. Como o versículo apresenta inicialmente “três homens”, traduzir por “adorou” resolveria antes da hora uma questão interpretativa que o próprio contexto narrativo desenvolve.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “eis que” conserva a vivacidade literária do hebraico; “se curvou até o chão” evita linguagem denominacional e preserva a ambiguidade teológica do gesto.
