base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: pt
  text: Que se traga, por favor, um pouco de água, lavem os pés e descansem[a] debaixo da árvore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apoiem-se” ou “reclinem-se”. O verbo hebraico significa mais literalmente apoiar-se ou reclinar-se e, neste contexto, indica descansar à sombra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Tragam, por favor
  rationale: O passivo jussivo com a partícula de súplica formula um pedido cortês. Em português corrente, o imperativo plural com “por favor” expressa naturalmente essa cortesia, embora torne explícitos os agentes implícitos do passivo hebraico.
- source_word: מְעַט מַיִם
  choice: um pouco de água
  rationale: Preserva a pequena quantidade indicada pelo hebraico e a modéstia da oferta de Abraão.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: lavem os pés
  rationale: Tradução direta e idiomática do imperativo plural e de seu objeto, adequada ao costume de hospitalidade do contexto.
- source_word: וְהִשָּׁעֲנוּ
  choice: descansem
  rationale: O nifal de שען significa literalmente apoiar-se ou reclinar-se; neste contexto de hospitalidade à sombra, “descansem” comunica com naturalidade a ação pretendida.
- source_word: תַּחַת הָעֵץ
  choice: debaixo da árvore
  rationale: Mantém a preposição espacial e o artigo definido, referindo-se a uma árvore específica junto ao acampamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com forma verbal plural de ampla compreensão. “Tragam, por favor” privilegia a naturalidade do pedido cortês; “descansem” evita o pouco idiomático “descansem-se”. O marcador da nota aparece no texto imediatamente após a expressão a que se refere.
