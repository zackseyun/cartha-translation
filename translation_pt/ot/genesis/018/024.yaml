  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: pt
  text: Talvez haja cinquenta justos no meio da cidade. Será que de fato a destruirás e não pouparás o lugar por causa dos cinquenta justos que nele estão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que de fato a varrerás e não perdoarás o lugar por causa dos cinquenta justos que nele estão?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez haja
  rationale: Introduz a hipótese cautelosa de Abraão de modo natural em português, preservando a força tentativa do hebraico.
- source_word: חֲמִשִּׁים צַדִּיקִים
  choice: cinquenta justos
  rationale: Designa pessoas justas sem restringir o referente ao sexo masculino; o substantivo adjetival é corrente e digno em português bíblico moderno.
- source_word: בְּתוֹךְ הָעִיר
  choice: no meio da cidade
  rationale: Reproduz naturalmente a ideia locativa de estar dentro dos limites da cidade.
- source_word: הַאַף תִּסְפֶּה
  choice: Será que de fato a destruirás
  rationale: A pergunta retórica e sua ênfase são preservadas por 'Será que de fato'; 'destruir' comunica com clareza o juízo expresso pelo verbo, cuja imagem também pode ser traduzida como 'varrer'.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: e não pouparás o lugar
  rationale: No contraste imediato com a destruição, נשא indica deixar de executar o juízo contra o lugar; 'poupar' expressa isso sem reduzir o sentido a uma doutrina específica de perdão.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Indica que a presença dos justos é a razão apresentada para poupar o lugar.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: que nele estão
  rationale: Mantém explicitamente a oração relativa e retoma de forma natural o lugar, isto é, a cidade.
theological_decisions:
- issue: Sentido de נשא na expressão וְלֹא תִשָּׂא לַמָּקוֹם
  choice: poupar o lugar
  alternative: perdoar o lugar
  rationale: O contexto opõe destruir a cidade a suspender sua destruição por causa dos justos. 'Poupar' conserva o sentido judicial e narrativo sem impor uma compreensão mais estreita de perdão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o tom respeitoso, insistente e retórico da intercessão de Abraão.
