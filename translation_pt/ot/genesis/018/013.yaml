base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: pt
  text: 'E o SENHOR disse a Abraão: “Por que Sara riu, dizendo: ‘Será que realmente darei à luz, agora que estou velha?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, em harmonia com a camada inglesa auditada.
- source_word: הַאַף אֻמְנָם
  choice: Será que realmente
  rationale: Reproduz a pergunta marcada por surpresa ou dúvida e preserva a ênfase de אֻמְנָם sem tornar a formulação artificial.
- source_word: אֵלֵד
  choice: darei à luz
  rationale: Expressa diretamente o verbo hebraico ילד na primeira pessoa, que aqui se refere ao ato de dar à luz.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: agora que estou velha
  rationale: Comunica naturalmente em português a circunstância enfatizada por Sara; o perfeito hebraico descreve sua condição de envelhecimento já alcançada.
theological_decisions:
- issue: Representação do tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção tradicional e amplamente legível em português, sem acrescentar interpretação doutrinária.
- issue: Objeto implícito de אֵלֵד
  choice: darei à luz
  alternative: darei à luz um filho / terei um filho
  rationale: Mantém o objeto não expresso no hebraico e evita especificar além do texto deste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. As aspas distinguem a fala divina da citação das palavras de Sara.
