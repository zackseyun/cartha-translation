base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: pt
  text: 'E ele disse: “Certamente voltarei a você por esta mesma época, no ano que vem,[a] e eis que Sara, sua mulher, terá um filho.” Sara escutava à entrada da tenda, que ficava atrás dele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “por volta do tempo da vida”; no contexto, a expressão significa “por esta mesma época, no ano que vem”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “e ele/isso estava atrás dele”. Os pronomes hebraicos são concisos e permitem alguma ambiguidade; o referente provável é a tenda ou sua entrada, mas não se identifica explicitamente quem é “dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o sujeito masculino singular sem identificar explicitamente quem fala e reproduz o fluxo da narrativa hebraica.
- source_word: שׁוֹב אָשׁוּב
  choice: Certamente voltarei
  rationale: O infinitivo absoluto seguido do verbo da mesma raiz intensifica a afirmação; “certamente” transmite essa ênfase em português natural.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: Representa diretamente a segunda pessoa masculina singular, sem acrescentar o nome de Abraão.
- source_word: כָּעֵת חַיָּה
  choice: por esta mesma época, no ano que vem
  rationale: A expressão idiomática aponta, neste contexto, para a mesma época no ciclo seguinte. A formulação comunica isso com clareza sem ocultar a expressão hebraica, registrada em nota.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a função solene de chamar a atenção para o anúncio que vem a seguir.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: Sara, sua mulher, terá um filho
  rationale: Expressa em português natural a construção hebraica, literalmente próxima de “um filho para Sara, sua mulher”.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Sara estava escutando
  rationale: O particípio apresenta a ação como contínua no decorrer da cena.
- source_word: פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: Tradução clara e relativamente formal da expressão construta que indica a localização junto à abertura da tenda.
- source_word: וְהוּא אַחֲרָיו
  choice: atrás dele
  rationale: Integra naturalmente a informação espacial à oração anterior, preservando em nota a concisão e a ambiguidade pronominal do hebraico.
theological_decisions:
- issue: Identidade de quem fala
  choice: Manter apenas “ele”
  alternative: “O SENHOR disse” ou “um dos homens disse”
  rationale: Neste versículo, o verbo hebraico traz apenas um sujeito masculino singular implícito. Nomear o falante resolveria no texto uma questão que depende do contexto mais amplo.
- issue: Referente de וְהוּא אַחֲרָיו
  choice: Apresentar Sara à entrada da tenda, atrás do falante
  alternative: Traduzir formalmente “e ele/isso estava atrás dele”
  rationale: A leitura espacial é coerente com a cena, mas a nota conserva a formulação pronominal incomum do hebraico e evita tratá-la como totalmente inequívoca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a solenidade do anúncio foram preservadas, enquanto o idiomatismo temporal e a descrição espacial foram vertidos de modo natural. As ambiguidades relativas à identidade do falante e aos pronomes da última oração não foram resolvidas além do que o contexto imediato permite.
