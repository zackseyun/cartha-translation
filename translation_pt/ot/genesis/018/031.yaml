  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: pt
  text: 'Então ele disse: “Eis que me atrevi a falar com meu Senhor. Talvez sejam encontrados ali vinte.” E ele respondeu: “Não destruirei a cidade por causa dos vinte.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Eis que
  rationale: Introduz respeitosamente a nova etapa da súplica de Abraão. Em português bíblico corrente, “Eis que” é digno e compreensível, sem exigir uma tradução mecânica das duas partículas.
- source_word: הוֹאַלְתִּי
  choice: me atrevi
  rationale: Expressa que Abraão tomou a liberdade de falar, com humildade e percepção da ousadia envolvida. É mais natural neste contexto do que “empreendi” ou “comecei”.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: a falar com meu Senhor
  rationale: Mantém o sentido direto da expressão e reconhece o interlocutor divino mediante “Senhor”, sem substituir o título pelo nome divino.
- source_word: אוּלַי
  choice: Talvez
  rationale: Preserva o caráter tentativo e respeitoso da intercessão.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: sejam encontrados ali vinte
  rationale: Conserva a voz passiva do nifal e a localização indicada por שָׁם, em português natural.
- source_word: לֹא אַשְׁחִית
  choice: Não destruirei a cidade
  rationale: O objeto está implícito no hebraico; “a cidade” o explicita naturalmente a partir do contexto imediato, evitando o pronome potencialmente ambíguo “a”.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: por causa dos vinte
  rationale: Transmite que os vinte seriam a razão para poupar a cidade e mantém o grupo definido pelo artigo hebraico.
theological_decisions:
- issue: Sentido de אֲדֹנָי na fala de Abraão
  choice: meu Senhor
  alternative: meu senhor
  rationale: No contexto de Gênesis 18, Abraão dirige-se ao interlocutor divino. A inicial maiúscula sinaliza o uso titular sem introduzir o nome YHWH, que não aparece nesta forma no versículo.
- issue: Objeto implícito de לֹא אַשְׁחִית
  choice: a cidade
  alternative: 'sem objeto expresso: “Não destruirei”'
  rationale: A cidade sob juízo é o referente contextual. A explicitação favorece a clareza sem alterar a lógica teológica da promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Me atrevi” preserva a deferência de Abraão sem arcaísmo excessivo; a ordem “sejam encontrados ali vinte” mantém a passiva hebraica.
