  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: pt
  text: 'Sara, porém, negou[a], dizendo: “Eu não ri”, pois estava com medo. Mas ele[b] disse: “Não; você riu, sim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mentiu”, ou simplesmente: “negou isso”. O verbo hebraico pode indicar negação ou falsidade; aqui se refere à negação de Sara de que havia rido.'
    reason: lexical_alternative
  - marker: b
    text: O falante não é nomeado explicitamente nesta oração; o contexto o identifica com o SENHOR na narrativa ao redor.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: negou
  rationale: O piel de כחשׁ pode indicar negar ou agir com falsidade. Neste contexto, Sara nega ter rido; “negou” preserva esse sentido sem explicitar no texto principal o juízo mais forte de que ela “mentiu”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: É a fórmula hebraica usual que introduz discurso direto; “dizendo” mantém com naturalidade a estrutura narrativa.
- source_word: לֹא צָחַקְתִּי
  choice: Eu não ri
  rationale: Tradução direta da forma verbal perfeita na primeira pessoa do singular, em português atual e digno.
- source_word: כִּי יָרֵאָה
  choice: pois estava com medo
  rationale: כִּי apresenta a causa da negação de Sara. “Pois” exprime claramente essa relação sem tornar a frase pesada.
- source_word: וַיֹּאמֶר
  choice: Mas ele disse
  rationale: Embora o waw consecutivo faça avançar a narrativa, “mas” torna explícito em português o contraste entre a negação de Sara e a resposta que a corrige.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Não; você riu, sim
  rationale: O primeiro לֹא rejeita a alegação de Sara, e כִּי introduz a afirmação enfática contrária. A construção “riu, sim” transmite essa ênfase de modo natural em português.
theological_decisions:
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: Manter “ele disse”, sem nomear o sujeito no texto principal.
  alternative: “O SENHOR disse” ou “um dos homens disse”.
  rationale: A oração hebraica não repete o sujeito; embora o contexto mais amplo associe o falante ao SENHOR, especificá-lo aqui acrescentaria uma identificação não expressa nesta cláusula. O pronome preserva a forma do texto e deixa o contexto orientar a identificação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom narrativo digno, evita contrações excessivamente coloquiais e preserva a ambiguidade sintática quanto à identidade do falante.
