  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: pt
  text: 'Então Abraão disse: “Por favor, não fique irado, meu Senhor,[a] e eu falarei. Talvez se encontrem ali trinta.” Ele respondeu: “Não farei isso, se encontrar ali trinta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu senhor”. O título hebraico também pode ser entendido como uma forma respeitosa de tratamento; aqui, “Senhor” aparece com inicial maiúscula porque, pelo contexto, o destinatário é entendido como o Senhor.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Por favor, não fique irado
  rationale: Expressa de modo natural em português tanto a negação e o pedido cortês de נָא quanto o sentido idiomático de חרה, ‘arder’ de ira.
- source_word: לַאדֹנָי
  choice: meu Senhor
  rationale: Mantém o título reverente com sufixo de primeira pessoa. A inicial maiúscula indica que, no contexto, Abraão se dirige ao interlocutor divino, sem substituir o título pelo nome da aliança.
- source_word: וַאֲדַבֵּרָה
  choice: e eu falarei
  rationale: Preserva a força volitiva/coortativa da forma hebraica e o tom deferente da continuação do pedido.
- source_word: אוּלַי יִמָּצְאוּן שָׁם שְׁלֹשִׁים
  choice: Talvez se encontrem ali trinta
  rationale: ‘Talvez’ conserva a hipótese cautelosa; a construção com ‘se encontrem’ comunica naturalmente o nifal passivo de מצא sem acrescentar um substantivo ausente no hebraico.
- source_word: לֹא אֶעֱשֶׂה
  choice: Não farei isso
  rationale: O objeto permanece implícito no hebraico e é retomado em português por ‘isso’, referindo-se contextualmente ao ato de destruir.
- source_word: אִם אֶמְצָא שָׁם שְׁלֹשִׁים
  choice: se encontrar ali trinta
  rationale: Reproduz diretamente a condição hebraica e mantém o número sem explicitar ‘justos’, palavra não presente neste versículo.
theological_decisions:
- issue: Sentido de אֲדֹנָי na fala de Abraão
  choice: meu Senhor
  alternative: meu senhor
  rationale: O contexto teofânico favorece a referência ao Senhor; contudo, a forma hebraica também pode funcionar como tratamento respeitoso. A nota preserva essa possibilidade sem resolver além da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. ‘Fique irado’ mantém um tom respeitoso sem soar arcaico. O nome ‘Abraão’ foi explicitado no primeiro verbo para evitar ambiguidade referencial natural em português.
