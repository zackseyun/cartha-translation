  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: pt
  text: Então os homens se levantaram dali e olharam para baixo, em direção a Sodoma[a]. Abraão ia caminhando com eles para acompanhá-los e encaminhá-los[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “olharam em direção a Sodoma” ou “olharam sobre Sodoma”. O verbo hebraico pode sugerir um olhar lançado de um lugar elevado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para se despedir deles”. A expressão hebraica refere-se ao costume de acompanhar hóspedes que estavam partindo e encaminhá-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: se levantaram dali
  rationale: Conserva o sentido básico de קום e a transição espacial indicada por מִשָּׁם, sem transformar explicitamente o gesto em partida.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Reproduz o substantivo comum hebraico e preserva a tensão narrativa quanto à identidade dessas figuras.
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: olharam de cima na direção de Sodoma
  rationale: שׁקף sugere olhar a partir de um ponto elevado; a formulação também expressa a orientação para Sodoma sem afirmar que já estavam vendo detalhes da cidade.
- source_word: הֹלֵךְ עִמָּם
  choice: ia caminhando com eles
  rationale: O particípio apresenta a ação em andamento e retrata Abraão acompanhando os homens.
- source_word: לְשַׁלְּחָם
  choice: para acompanhá-los na partida
  rationale: No contexto da hospitalidade, a expressão denota acompanhar hóspedes que partem e encaminhá-los; esta forma é natural em português e evita a impressão de que Abraão os estava expulsando ou apenas lhes dando uma ordem.
theological_decisions:
- issue: Identidade de הָאֲנָשִׁים no contexto
  choice: os homens
  alternative: os visitantes; os anjos
  rationale: O versículo emprega o termo comum para “homens” e não os identifica aqui explicitamente como anjos. A tradução mantém a caracterização narrativa sem antecipar uma interpretação contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para leitores brasileiros. “Ia caminhando” preserva o caráter durativo do particípio; “acompanhá-los na partida” comunica a prática de hospitalidade sem recorrer a formulação excessivamente literal.
