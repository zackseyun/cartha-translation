  terminology: «Os homens» mantém adequadamente o termo hebraico comum אַנָשִׁים e não antecipa sua identidade contextual. «Encaminhá-los» é apropriado no contexto de hospitalidade e evita tanto a ideia de expulsão quanto a redução da ação a uma despedida verbal.
