  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: pt
  text: Então Abraão pegou coalhada[a], leite e o bezerro que havia preparado e os colocou diante deles. Ele ficou de pé junto deles[b], debaixo da árvore, enquanto comiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manteiga” ou “nata”. O termo hebraico indica um produto lácteo espesso cuja identificação exata depende do contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre eles”. Aqui, a expressão provavelmente indica que Abraão permanecia perto deles para servi-los como anfitrião.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: coalhada
  rationale: Designa um produto lácteo espesso; no contexto pastoril, “coalhada” é natural e evita sugerir especificamente a manteiga de mesa moderna, embora outras identificações sejam possíveis.
- source_word: חָלָב
  choice: leite
  rationale: Equivalente direto e corrente do substantivo hebraico.
- source_word: וּבֶן הַבָּקָר
  choice: o bezerro
  rationale: A expressão literal “filho do gado” é um idiomatismo para um bovino jovem e retoma o animal do versículo anterior.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia preparado
  rationale: Em contexto alimentar, עשה tem naturalmente o sentido de preparar; o mais-que-perfeito explicita em português a anterioridade da preparação.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: e os colocou diante deles
  rationale: A expressão hebraica descreve a apresentação dos alimentos aos hóspedes. O pronome plural concorda naturalmente, em português, com os itens servidos.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Ele ficou de pé junto deles
  rationale: Preserva a postura de Abraão e comunica que permanecia próximo, atendendo os hóspedes, sem a possível conotação dominadora de “sobre eles”.
- source_word: תַּחַת הָעֵץ
  choice: debaixo da árvore
  rationale: Tradução direta, natural e amplamente compreensível.
- source_word: וַיֹּאכֵלוּ
  choice: enquanto comiam
  rationale: Expressa naturalmente a relação temporal entre Abraão permanecer junto aos visitantes e a refeição deles.
theological_decisions:
- issue: Se a identidade dos visitantes deve ser realçada por uma interpretação cristológica ou trinitária posterior
  choice: Manter a linguagem narrativa comum da hospitalidade de Abraão
  alternative: Empregar linguagem mais exaltada para insinuar explicitamente a condição divina dos visitantes
  rationale: O versículo descreve o serviço de Abraão aos visitantes; a tradução não deve inserir conclusões teológicas que não estão explicitadas nesta frase.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O nome “Abraão” foi explicitado para evitar ambiguidade do pronome no início isolado do versículo. A sintaxe preserva a sequência narrativa e a função hospitaleira sem sobrecarregar o texto com interpretação teológica.
