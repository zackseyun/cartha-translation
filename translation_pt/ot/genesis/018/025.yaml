id: GEN.18.25
reference: Genesis 18:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: pt
  text: 'Longe de ti fazer uma coisa dessas: matar o justo com o perverso, de modo que o justo seja como o perverso. Longe de ti! Acaso o Juiz de toda a terra não fará justiça?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso o Juiz de toda a terra não fará o que é justo?”'
    reason: Alternativa lexical para מִשְׁפָּט, que aqui pode ser expresso como o substantivo “justiça” ou como “o que é justo”.
lexical_decisions:
- source_word: חָלִילָה
  choice: Longe de ti
  rationale: Interjeição idiomática de forte repúdio. A expressão é clara e digna em português e mantém a repetição enfática do hebraico.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: fazer uma coisa dessas
  rationale: Expressa naturalmente a construção com infinitivo e o caráter moralmente inconcebível da ação indicada.
- source_word: לְהָמִית
  choice: matar
  rationale: O hifil de מות indica causar a morte. Neste contexto, “matar” comunica de modo direto e natural essa ação, sem sugerir necessariamente uma execução judicial formal.
- source_word: צַדִּיק
  choice: o justo
  rationale: Preserva o sentido moral e forense e mantém o contraste explícito com רָשָׁע.
- source_word: עִם רָשָׁע
  choice: com o perverso
  rationale: Mantém o singular genérico do hebraico e exprime com clareza a oposição entre o justo e quem pratica o mal.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: de modo que o justo seja como o perverso
  rationale: Conserva a comparação introduzida por כ e não explicita além do texto em que sentido ambos seriam considerados iguais.
- source_word: הֲשֹׁפֵט כָּל־הָאָרֶץ
  choice: Acaso o Juiz de toda a terra
  rationale: O particípio funciona como título divino. “Acaso” sinaliza naturalmente uma pergunta retórica que espera resposta afirmativa.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto, designa a ação judicial justa, não apenas um ato de julgamento. “Fazer justiça” é idiomático e preserva a dimensão ética e forense.
theological_decisions:
- issue: A ousadia da pergunta retórica de Abraão sobre o caráter de Deus
  choice: Acaso o Juiz de toda a terra não fará justiça?
  alternative: O Juiz de toda a terra não fará o que é justo?
  rationale: A formulação mantém o apelo direto de Abraão à justiça de Deus e a expectativa de resposta afirmativa, sem suavizar a tensão do diálogo nem transformar a pergunta em declaração.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “Longe de ti” e o paralelismo entre “o justo” e “o perverso” foram preservados. O marcador [a] aparece junto à oração a que a nota se refere.
