base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: pt
  text: 'Abraão apressou-se até a tenda, onde estava Sara, e disse: “Depressa! Amasse três seás[a][b] de farinha fina e faça bolos de pão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O seá era uma antiga medida de capacidade para secos; três seás correspondiam aproximadamente a 20–22 litros.
    reason: cultural_note
  - marker: b
    text: 'Ou: “três medidas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: foi depressa
  rationale: O verbo expressa ação rápida; “foi depressa” é natural em português atual e mantém a urgência da narrativa.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: para a tenda, ao encontro de Sara
  rationale: O ה direcional indica movimento em direção à tenda. A formulação portuguesa deixa claro que Sara era a pessoa procurada sem afirmar além do texto uma localização mais específica dentro dela.
- source_word: מַהֲרִי
  choice: Depressa!
  rationale: O imperativo feminino singular é dirigido a Sara. A exclamação breve transmite a urgência de modo idiomático.
- source_word: שְׁלֹשׁ סְאִים
  choice: três seás
  rationale: Mantém a unidade antiga específica do hebraico, acompanhada de nota explicativa, em vez de substituí-la silenciosamente por uma medida moderna.
- source_word: קֶמַח סֹלֶת
  choice: farinha fina
  rationale: A expressão indica farinha de boa qualidade e moagem fina; esta tradução é clara e preserva seu valor qualitativo.
- source_word: לוּשִׁי
  choice: Amasse
  rationale: O verbo se refere especificamente ao ato de amassar para preparar a massa, e não apenas a misturar ingredientes.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: e faça pães
  rationale: עֻגוֹת designa porções arredondadas de massa assada. “Pães” evita que o leitor moderno entenda doces, embora a forma exata não seja especificada na tradução.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para a fluência, preservando a repetição da ideia de urgência no verbo narrativo e na fala. Os marcadores foram colocados junto de “seás”, termo ao qual ambas as notas se referem.
