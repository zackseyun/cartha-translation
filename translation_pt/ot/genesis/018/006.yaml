    issue: «ao encontro de Sara»
    rationale: A expressão pode sugerir uma noção de encontro planejado e é menos direta do que a sintaxe narrativa do hebraico. Uma referência à presença de Sara na tenda comunica naturalmente o sentido contextual.
  - severity: low
    issue: «pães» para עֻגוֹת
    rationale: «Pães» é uma generalização aceitável, mas não representa a nuance de bolos ou pães em forma de bolo. «Bolos de pão» evita a associação predominante de «bolos» com doces em português brasileiro.
