  terminology: “Prazer” conserva de modo apropriado a amplitude de עֶדְנָה, e “meu senhor”, em minúsculas, mantém o tratamento respeitoso dirigido a Abraão sem sugerir título divino. A nota é útil, mas sua redação pode ser levemente ajustada para maior naturalidade.
