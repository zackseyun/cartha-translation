  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: pt
  text: 'Sara riu consigo mesma, dizendo: “Depois de eu já estar desgastada, terei prazer[a], e meu senhor já é velho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deleite”; a expressão pode aludir ao prazer sexual ou ao renovado vigor juvenil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: riu
  rationale: O qal de צחק significa normalmente “rir”. O contexto indica uma reação interior de Sara, não necessariamente zombaria aberta.
- source_word: בְּקִרְבָּהּ
  choice: consigo mesma
  rationale: A expressão significa literalmente “no seu interior”; “consigo mesma” comunica de modo natural que o riso e as palavras foram interiores.
- source_word: לֵאמֹר
  choice: e disse
  rationale: O infinitivo introduz a fala citada. A interioridade dessa fala já é indicada por “consigo mesma”.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Depois de já estar desgastada
  rationale: בלה descreve aquilo que se gasta ou definha. “Desgastada” preserva essa imagem física e evita reduzi-la simplesmente à idade, mencionada separadamente a respeito de Abraão.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: terei prazer
  rationale: A construção pergunta se Sara ainda experimentará prazer ou deleite. O futuro interrogativo é natural em português e não especifica em excesso o sentido raro de עֶדְנָה.
- source_word: עֶדְנָה
  choice: prazer
  rationale: “Prazer” mantém a amplitude do termo, que pode envolver deleite sexual, renovado vigor corporal ou a experiência da fecundidade, sem escolher apenas uma dessas nuances.
- source_word: וַאדֹנִי
  choice: meu senhor
  rationale: É a forma respeitosa com que Sara se refere a Abraão, não um título divino; por isso, usa-se inicial minúscula.
- source_word: זָקֵן
  choice: sendo velho
  rationale: Expressa diretamente a velhice de Abraão. A construção com “mesmo” torna natural em português a relação contextual introduzida pelo ו.
theological_decisions:
- issue: Amplitude semântica de עֶדְנָה
  choice: prazer
  alternative: deleite; prazer sexual; renovado vigor juvenil
  rationale: O contexto sugere dimensões corporais, conjugais e reprodutivas, mas o hebraico não delimita uma só. A tradução principal mantém o termo amplo, e a nota registra as possibilidades mais específicas.
- issue: Relação sintática de וַאדֹנִי זָקֵן
  choice: mesmo sendo velho o meu senhor
  alternative: e meu senhor é velho; enquanto meu senhor é velho
  rationale: O ו hebraico é amplo. No contexto, a idade de Abraão reforça a perplexidade de Sara; “mesmo sendo” expressa essa relação de modo natural, sem transformar a conjunção em uma oposição absoluta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para a reação interior de Sara. “Desgastada” conserva a força física de בלה, enquanto “prazer” mantém deliberadamente aberta a rara expressão עֶדְנָה.
