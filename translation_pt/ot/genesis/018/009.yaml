  language: pt
  text: 'Então eles lhe disseram: “Onde está Sara, sua mulher?” Ele respondeu: “Ali, na tenda.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então eles lhe disseram
  rationale: O wayyiqtol dá continuidade à sequência narrativa. “Então” expressa essa progressão com naturalidade, e “lhe disseram” traduz אֵלָיו de modo idiomático.
- source_word: אַיֵּה
  choice: Onde está
  rationale: O advérbio interrogativo pergunta pela localização; em português, a cópula é naturalmente expressa.
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: Sara, sua mulher
  rationale: Preserva o nome próprio e o sentido relacional direto de אִשָּׁה com o sufixo de segunda pessoa masculina singular. “Mulher” é natural e dignificado neste contexto conjugal.
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: Embora o verbo seja literalmente “disse”, a fala constitui uma resposta direta à pergunta; “respondeu” comunica naturalmente essa função discursiva sem alterar o conteúdo.
- source_word: הִנֵּה בָאֹהֶל
  choice: Ali, na tenda
  rationale: הִנֵּה tem aqui força dêitica e introduz uma resposta locativa breve. “Ali, na tenda” preserva a concisão e evita acrescentar sujeito e verbo não expressos no hebraico.
