base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: pt
  text: Então Yahweh[a] partiu, quando terminou de falar com Abraão, e Abraão voltou para o seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. Outras formas usadas em português incluem “Javé” e “Jeová”; muitas traduções empregam “SENHOR”.'
    reason: Registra a forma hebraica do nome divino e as principais alternativas de tradução ou transliteração em português.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partiu
  rationale: No contexto narrativo, הלך indica que Yahweh se retirou ao concluir o encontro. “Partiu” é natural e conciso em português, sem acrescentar destino ou modo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: depois de
  rationale: A conjunção marca aqui a relação temporal entre o término da fala e a partida. “Depois de” expressa com clareza a sequência contextual, embora “quando” também seja possível.
- source_word: כִּלָּה לְדַבֵּר
  choice: terminar de falar
  rationale: A construção com כלה e infinitivo expressa a conclusão da ação de falar; esta formulação é corrente e fiel em português.
- source_word: אֶל אַבְרָהָם
  choice: com Abraão
  rationale: Embora אֶל seja literalmente “a/para”, em português “falar com alguém” é a construção idiomática adequada neste contexto de diálogo.
- source_word: שָׁב
  choice: voltou
  rationale: שוב indica retorno; “voltou” é a forma narrativa simples e natural.
- source_word: לִמְקֹמוֹ
  choice: para o seu lugar
  rationale: Preserva o sentido não especificado de מָקוֹם, sem interpretar o local como casa ou acampamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título; a nota registra formas portuguesas alternativas.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A coordenação simples do hebraico foi preservada, e “seu lugar” mantém a falta de especificação do original.
