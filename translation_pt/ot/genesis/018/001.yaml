id: GEN.18.1
reference: Genesis 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: pt
  text: Yahweh apareceu a ele junto aos carvalhos de Manre[a], enquanto ele estava sentado à entrada da tenda, no calor do dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto aos terebintos de Manre”. O termo hebraico pode se referir a árvores grandes, como carvalhos ou terebintos.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação visível; “apareceu” é natural em português e preserva o sentido concreto sem explicá-lo em excesso.
- source_word: אֵלָיו
  choice: a ele
  rationale: Reproduz a preposição com o sufixo masculino singular, cujo referente é Abraão no contexto anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאֵלֹנֵי
  choice: junto aos carvalhos
  rationale: O termo pode designar árvores grandes, especialmente carvalhos ou terebintos. “Carvalhos” é claro e natural, enquanto a incerteza botânica é preservada em nota.
- source_word: מַמְרֵא
  choice: Manre
  rationale: Forma tradicional e natural em português para o nome próprio hebraico מַמְרֵא.
- source_word: וְהוּא יֹשֵׁב
  choice: enquanto ele estava sentado
  rationale: Expressa naturalmente a circunstância de fundo indicada pelo particípio hebraico.
- source_word: פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: פֶּתַח designa a abertura ou entrada; esta formulação é concreta, idiomática e digna em português.
- source_word: כְּחֹם הַיּוֹם
  choice: no calor do dia
  rationale: Mantém o idioma hebraico sem especificar indevidamente uma hora exata, como o meio-dia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada à sintaxe natural do português, sem eliminar a ambientação circunstancial nem a incerteza quanto à espécie das árvores.
