base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: pt
  text: 'Então Yahweh disse: “O clamor contra Sodoma e Gomorra[a] é grande, e o pecado deles é muito grave[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o clamor de Sodoma e Gomorra”. Esta é uma tradução mais literal do hebraico; o texto principal explicita que o clamor diz respeito às cidades.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “é muito pesado”; no hebraico, trata-se de uma expressão que indica extrema gravidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: זַעֲקַת
  choice: o clamor contra
  rationale: זַעֲקָה designa um clamor que surge diante de grave injustiça; “contra” explicita, de modo idiomático, que a denúncia diz respeito às cidades, sem ocultar a construção hebraica alternativa registrada em nota.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes geográficos em português.
- source_word: כִּי רָבָּה
  choice: é grande
  rationale: O predicado feminino singular concorda com “clamor” e indica sua grande magnitude.
- source_word: וְחַטָּאתָם
  choice: e o pecado deles
  rationale: O substantivo singular com sufixo plural tem sentido coletivo, referindo-se à conduta pecaminosa dos habitantes.
- source_word: כִּי כָבְדָה מְאֹד
  choice: é muito grave
  rationale: כבד significa literalmente “ser pesado”, mas aqui funciona como expressão moral e judicial da extrema gravidade do pecado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Relação do clamor com Sodoma e Gomorra
  choice: clamor contra Sodoma e Gomorra
  alternative: clamor de Sodoma e Gomorra
  rationale: O contexto favorece um clamor de denúncia a respeito das cidades, mas a forma hebraica permite uma tradução mais literal com “de”; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas reconhecidas no Brasil e compreensíveis internacionalmente. A ordem foi ajustada para soar natural, sem perder o paralelismo entre a grandeza do clamor e a gravidade do pecado.
