  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: pt
  text: Então os homens partiram dali e foram em direção a Sodoma[a], mas Abraão ainda estava de pé diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos antigos trazem: “e Yahweh ainda estava de pé diante de Abraão”. O Texto Massorético hebraico traz: “e Abraão ainda estava de pé diante de Yahweh”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: partiram dali
  rationale: O verbo פנה, neste contexto narrativo, indica mudança de direção e saída do lugar. “Partiram dali” expressa naturalmente o movimento sem acrescentar uma interpretação sobre a identidade dos homens.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Reproduz o substantivo hebraico na superfície narrativa, sem explicitar no texto principal a natureza sobrenatural das personagens.
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: foram em direção a Sodoma
  rationale: A formulação representa o verbo comum de movimento הלך e a terminação direcional em סְדֹמָה, que indica movimento rumo a Sodoma.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: ainda permanecia
  rationale: O advérbio com sufixo e o particípio exprimem continuidade. “Ainda permanecia” comunica o estado contínuo de Abraão com naturalidade, sem exigir que o português enfatize literalmente sua postura física.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva tanto o sentido espacial de estar à frente de alguém quanto o sentido relacional de estar em sua presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo pelo título “Senhor”.
- issue: Sujeito da oração final na variante textual
  choice: Abraão ainda permanecia diante de Yahweh
  alternative: Yahweh ainda permanecia diante de Abraão
  rationale: O Texto Massorético fornecido faz de Abraão o sujeito e de Yahweh o complemento de לִפְנֵי. Uma tradição antiga registra a ordem inversa; ela é preservada em nota, sem substituir a leitura da fonte principal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Partiram dali” evita a construção menos idiomática “voltaram-se dali”; “permanecia diante de” conserva a continuidade e a relação espacial da oração hebraica.
