  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: pt
  text: E sejam luzeiros no firmamento dos céus para iluminar a terra. E assim foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: E sirvam
  rationale: No contexto do decreto criador, a forma dá continuidade à força volitiva do versículo anterior. “Sirvam” expressa naturalmente em português a função designada aos luzeiros.
- source_word: לִמְאוֹרֹת
  choice: de luzeiros
  rationale: מָאוֹר designa corpos ou fontes que dão luz, não a luz abstrata. “Luzeiros” preserva essa distinção e é inteligível no registro bíblico digno.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: no firmamento dos céus
  rationale: “Firmamento” traduz רָקִיעַ como a extensão celeste descrita no relato, enquanto “dos céus” preserva a forma plural de שָׁמַיִם e a coesão lexical do capítulo.
- source_word: לְהָאִיר
  choice: para iluminar
  rationale: O infinitivo hifil de אור tem sentido causativo. “Iluminar” comunica de modo claro e natural a ação de dar luz.
- source_word: עַל הָאָרֶץ
  choice: a terra
  rationale: Com “iluminar”, o objeto direto sem preposição é a construção idiomática em português e transmite adequadamente que a luz incide sobre a terra.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Expressa com naturalidade a fórmula recorrente de cumprimento em Gênesis 1, mantendo a sequência entre decreto e realização.
theological_decisions:
- issue: Força volitiva de וְהָיוּ no discurso da criação
  choice: 'Traduzir como continuação da ordem: “E sirvam”'
  alternative: 'Traduzir como futuro declarativo: “E servirão”'
  rationale: A sintaxe e o contexto imediato situam a oração dentro da determinação divina iniciada no versículo anterior. O presente do subjuntivo preserva a força volitiva sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Luzeiros” evita confundir os corpos luminosos com a luz abstrata; “firmamento” mantém um termo bíblico reconhecível sem explicar além do hebraico.
