  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: pt
  text: Deus chamou a parte seca de Terra[a] e chamou de Mares o ajuntamento das águas. E Deus viu que isso era bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra”, com inicial minúscula. O hebraico אֶרֶץ pode funcionar tanto como substantivo comum quanto, neste contexto de nomeação, como o nome dado à parte seca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: chamou
  rationale: No contexto, o verbo expressa o ato de dar nome. “Chamou ... de” é natural em português e preserva a repetição da estrutura hebraica.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo apresenta concordância verbal singular neste contexto e designa o único Criador.
- source_word: לַיַּבָּשָׁה
  choice: a parte seca
  rationale: Designa o que ficou seco em contraste com as águas reunidas. “A parte seca” é clara, natural e evita confusão com a expressão “terra seca” seguida imediatamente do nome “Terra”.
- source_word: אֶרֶץ
  choice: Terra
  rationale: Na fórmula de nomeação, o termo funciona como o nome dado à parte seca. A inicial maiúscula sinaliza essa função literária sem impor o sentido moderno de planeta.
- source_word: מִקְוֵה
  choice: ajuntamento
  rationale: O substantivo indica uma massa reunida ou coleção. “Ajuntamento” preserva a ligação com o ato de reunir as águas no contexto imediato.
- source_word: הַמַּיִם
  choice: das águas
  rationale: Mantém a forma plural hebraica e o registro elevado, mas acessível, do relato da criação.
- source_word: יַמִּים
  choice: Mares
  rationale: O plural designa as extensões de águas reunidas. A inicial maiúscula acompanha a função de nome na estrutura paralela.
- source_word: וַיַּרְא
  choice: viu
  rationale: É a tradução direta e tradicional do verbo na fórmula avaliativa repetida em Gênesis 1.
- source_word: כִּי טוֹב
  choice: que isso era bom
  rationale: “Bom” conserva a amplitude de טוֹב sem restringi-lo à beleza ou à utilidade. “Isso” retoma naturalmente o estado de coisas que Deus acaba de estabelecer.
theological_decisions:
- issue: Se אֶרֶץ deve ser traduzido como substantivo comum ou como nome na fórmula de nomeação
  choice: Traduzir como o nome “Terra”
  alternative: Traduzir como “terra” ou “solo”, com inicial minúscula
  rationale: A declaração apresenta explicitamente Deus dando nome à parte seca; a maiúscula indica essa função. Uma nota preserva a possibilidade lexical de entender o termo como substantivo comum.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação e a repetição de “chamou” preservam o ritmo do hebraico; “parte seca” e “ajuntamento” mantêm as distinções concretas do texto sem excessiva literalidade.
