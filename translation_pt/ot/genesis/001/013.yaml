base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: pt
  text: 'E houve tarde, e houve manhã: o terceiro dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: houve
  rationale: O verbo היה nesta fórmula narrativa indica a ocorrência de cada período. “Houve” é natural em português e preserva a repetição e a cadência do hebraico.
- source_word: עֶרֶב
  choice: tarde
  rationale: O substantivo designa a tarde ou o anoitecer. “Tarde” é a forma tradicional, transparente e adequada ao refrão da criação.
- source_word: בֹּקֶר
  choice: manhã
  rationale: O substantivo significa “manhã” e forma o paralelo direto com “tarde”.
- source_word: יוֹם
  choice: dia
  rationale: No refrão, יוֹם identifica o dia numerado na sequência da narrativa da criação.
- source_word: שְׁלִישִׁי
  choice: terceiro
  rationale: O ordinal significa diretamente “terceiro” e qualifica “dia”.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Houve tarde e houve manhã
  rationale: A repetição de “houve” reproduz a estrutura formulaica e o ritmo hebraico sem tornar a frase pouco natural em português.
theological_decisions:
- issue: Traduzir o refrão dos dias da criação sem impor uma interpretação cronológica específica
  choice: 'Houve tarde e houve manhã: o terceiro dia.'
  alternative: Houve tarde e houve manhã, dia terceiro.
  rationale: A tradução apresenta de modo simples a sequência numerada do relato. Não determina a duração nem a função literária dos dias e, assim, não resolve no texto debates interpretativos posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O dois-pontos liga naturalmente o refrão à identificação do dia, enquanto a repetição de “houve” conserva a cadência do original.
