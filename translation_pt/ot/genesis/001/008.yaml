  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: pt
  text: E Deus chamou a expansão[a] de Céus[b]. E houve entardecer e houve manhã — o segundo dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “firmamento” (forma tradicional) ou “cúpula”. A palavra hebraica רָקִיעַ se refere a algo estendido ou expandido.
    reason: lexical_alternative
  - marker: b
    text: Ou “Céu”. A palavra hebraica שָׁמַיִם pode designar o céu ou os céus; aqui, é o nome que Deus dá à expansão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou ... de
  rationale: O verbo קרא com ל indica aqui nomeação. A construção portuguesa “chamar X de Y” comunica esse sentido de modo natural.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo está no singular e, neste contexto, o termo designa o único Criador.
- source_word: לָרָקִיעַ
  choice: a expansão
  rationale: רָקִיעַ designa algo estendido ou expandido. “Expansão” preserva essa ideia sem o caráter arcaico de “firmamento” nem a interpretação cosmológica mais específica sugerida por “cúpula”.
- source_word: שָׁמָיִם
  choice: Céus
  rationale: O termo é o nome dado por Deus à expansão. “Céus” conserva a forma tradicional e elevada, embora “céu” também seja possível em português.
- source_word: וַיְהִי
  choice: houve
  rationale: Na fórmula recorrente dos dias da criação, “houve” reproduz com concisão e naturalidade a sequência narrativa.
- source_word: עֶרֶב
  choice: tarde
  rationale: É a tradução corrente do termo na fórmula repetida da narrativa da criação.
- source_word: בֹקֶר
  choice: manhã
  rationale: É a tradução corrente do termo na fórmula repetida da narrativa da criação.
- source_word: יוֹם שֵׁנִי
  choice: o segundo dia
  rationale: Embora שֵׁנִי não tenha artigo no hebraico, a expressão funciona como identificação ordinal na sequência dos dias; o artigo é natural em português.
theological_decisions:
- issue: Sentido cosmológico de רָקִיעַ
  choice: expansão
  alternative: firmamento; cúpula
  rationale: “Expansão” mantém a imagem básica de algo estendido sem impor uma reconstrução cosmológica específica. As alternativas são registradas porque cada uma destaca um aspecto possível da palavra hebraica.
- issue: שָׁמָיִם como nome dado à expansão
  choice: Céus
  alternative: céu
  rationale: “Céus” preserva o tom literário e tradicional da narrativa sem definir se a referência é apenas ao céu visível ou também a uma realidade celestial mais ampla.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A repetição de “E houve” conserva o ritmo formular do hebraico; o travessão destaca a conclusão do segundo dia.
