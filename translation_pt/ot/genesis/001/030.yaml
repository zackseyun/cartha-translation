  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: pt
  text: E, a todos os animais da terra, a todas as aves do céu e a tudo o que rasteja sobre a terra e tem vida[a], todo vegetal verde servirá de alimento[b]. E assim foi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em que há uma criatura vivente” ou “em que há um ser vivente”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz uma construção elíptica: “e a todo... todo vegetal verde para alimento”; a ideia de dar pode ser retomada do versículo 29.'
    reason: source_ellipsis
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: animais da terra
  rationale: A expressão designa os animais terrestres. O plural distributivo é natural em português e evita restringir indevidamente o sentido a animais selvagens.
- source_word: עוֹף הַשָּׁמַיִם
  choice: aves do céu
  rationale: עוֹף abrange criaturas voadoras, mas no contexto a formulação corrente e clara é “aves”; “do céu” é a expressão idiomática portuguesa para o hebraico שָּׁמַיִם.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: tudo o que rasteja sobre a terra
  rationale: Preserva a imagem concreta de רמשׂ e a forma abrangente de כֹל, sem diluí-la no sentido mais genérico de “mover-se”.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: e tem vida
  rationale: Expressa naturalmente em português que os seres mencionados são animados, sem confundir נֶפֶשׁ חַיָּה com a expressão distinta “fôlego de vida” de Gênesis 2:7. A construção mais literal é registrada em nota.
- source_word: אֶת כָּל יֶרֶק עֵשֶׂב
  choice: todo vegetal verde
  rationale: Reproduz conjuntamente a ideia de verdor e vegetação com linguagem moderna e abrangente.
- source_word: לְאָכְלָה
  choice: de alimento
  rationale: A preposição לְ indica finalidade; “servirá de alimento” é uma formulação portuguesa clara e idiomática.
- source_word: וַיְהִי כֵן
  choice: E assim foi
  rationale: Fórmula concisa e tradicional que comunica o cumprimento imediato da declaração divina.
theological_decisions:
- issue: Sentido de נֶפֶשׁ חַיָּה aplicado aos animais
  choice: “tem vida”, com alternativa literal em nota
  alternative: “em que há uma criatura vivente” ou “em que há um ser vivente”
  rationale: A expressão hebraica identifica os animais como seres vivos. Não significa “fôlego de vida”, tradução correspondente a outra expressão hebraica, nem exige aqui uma definição técnica de “alma”.
- issue: Verbo elíptico na concessão do alimento
  choice: “servirá de alimento”
  alternative: suprir “dei”, retomando explicitamente o verbo de Gênesis 1:29
  rationale: O hebraico deste versículo não repete o verbo “dar”, embora a construção dependa do contexto anterior. A formulação escolhida produz uma oração completa em português sem inserir na voz de Deus um verbo ausente no versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “aves do céu” à reprodução mecânica do plural hebraico e “animais” a “feras”, evitando conotações desnecessárias.
