id: GEN.1.27
reference: Genesis 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: pt
  text: Assim, Deus criou o ser humano[a] à sua imagem; à imagem de Deus o criou; homem e mulher os criou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem” ou “a humanidade”. O hebraico adam está no singular e representa aqui a humanidade como um todo. A expressão “homem e mulher” também pode ser traduzida mais literalmente por “macho e fêmea”.
    reason: Preservar a forma singular representativa de אָדָם e registrar a força lexical de זָכָר וּנְקֵבָה.
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: criou
  rationale: O verbo ברא é o termo característico da criação divina em Gênesis 1. A repetição de “criou” nas três ocorrências preserva o paralelismo solene do hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Apesar da forma morfologicamente plural, a concordância verbal no singular indica aqui o Deus único; “Deus” é a tradução natural em português.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Aqui, o substantivo singular funciona de modo representativo para a humanidade, como mostra a passagem posterior para o plural em “os criou”. “O ser humano” conserva o singular gramatical sem restringir a referência a um indivíduo masculino.
- source_word: בְּצַלְמוֹ
  choice: à sua imagem
  rationale: A expressão com בְּ e o sufixo masculino singular indica correspondência com a imagem de Deus. “À sua imagem” é idiomático em português e mantém a referência do pronome a Deus.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: à imagem de Deus
  rationale: A repetição esclarece e enfatiza a frase anterior; repetir “imagem” preserva o paralelismo e a ênfase teológica do original.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome objeto masculino singular retoma הָאָדָם. O clítico “o” preserva o movimento deliberado do singular representativo para o plural posterior.
- source_word: זָכָר וּנְקֵבָה
  choice: homem e mulher
  rationale: Neste contexto humano, “homem e mulher” comunica naturalmente em português a distinção sexual expressa por זָכָר e נְקֵבָה. A nota registra a tradução mais formal “macho e fêmea”.
- source_word: אֹתָם
  choice: os
  rationale: O pronome plural marca a passagem da humanidade representada no singular para os seres humanos em sua pluralidade; “os” conserva essa mudança.
theological_decisions:
- issue: Tradução de אָדָם como humanidade representada no singular
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O hebraico emprega הָאָדָם no singular e o retoma com pronome singular, mas conclui com o plural “os”, após “homem e mulher”. “O ser humano” mantém o singular representativo e a inclusão de ambos, sem resolver a tensão por meio de um plural ou de um coletivo abstrato.
- issue: Sentido de זָכָר וּנְקֵבָה
  choice: homem e mulher
  alternative: macho e fêmea
  rationale: Os termos hebraicos designam os sexos, não o par relacional אִישׁ/אִשָּׁה. Contudo, aplicados aos seres humanos, “homem e mulher” é mais digno e natural em português; a alternativa formal fica documentada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “criou” e “imagem” mantém o ritmo enfático do hebraico. O singular “o ser humano/o criou” seguido do plural “os criou” preserva a mudança gramatical intencional do versículo.
