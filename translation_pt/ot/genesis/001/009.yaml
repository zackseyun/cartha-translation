  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: pt
  text: 'E Deus disse: “Que as águas debaixo dos céus[a] se reúnam num só lugar, e que apareça a terra seca”. E assim aconteceu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do céu”. O termo hebraico שָׁמַיִם pode referir-se ao céu visível ou aos céus, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E ... disse” preserva o fluxo do hebraico sem explicitar uma sequência temporal além do texto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o substantivo rege verbo no singular e designa o único Deus Criador.
- source_word: יִקָּווּ
  choice: se reúnam
  rationale: O jussivo expressa ordem ou vontade divina. A construção pronominal comunica de modo natural em português o ajuntamento das águas, sem acrescentar um agente humano.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Mantém a forma plural hebraica e o registro solene do relato da criação.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: debaixo dos céus
  rationale: Expressa a localização e preserva a dicção cosmológica de שָׁמַיִם; a alternativa “céu” permanece indicada em nota devido à amplitude semântica do termo.
- source_word: אֶל מָקוֹם אֶחָד
  choice: num só lugar
  rationale: Comunica o movimento de concentração e mantém explicitamente a ideia de unidade presente em אֶחָד.
- source_word: וְתֵרָאֶה
  choice: e que apareça
  rationale: O jussivo nifal prossegue a ordem divina; “apareça” traduz naturalmente a emergência visível do que estava coberto.
- source_word: הַיַּבָּשָׁה
  choice: a terra seca
  rationale: Designa o terreno seco exposto em contraste com as águas reunidas e antecipa sua denominação no versículo seguinte.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Reproduz de maneira natural e digna a fórmula recorrente que assinala o cumprimento da ordem divina.
theological_decisions:
- issue: Sentido cosmológico de שָׁמַיִם no relato da criação
  choice: céus
  alternative: céu
  rationale: O plural “céus” preserva a forma e o registro tradicional do termo hebraico sem definir uma cosmologia específica; a nota registra o sentido contextual possível de “céu” como espaço visível.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação e as fórmulas narrativas refletem o ritmo de Gênesis 1 sem rigidez excessiva.
