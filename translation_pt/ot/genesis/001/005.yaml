base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: pt
  text: E Deus chamou a luz de Dia e às trevas de Noite. Houve tarde e houve manhã — dia um.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o primeiro dia”. Hebraico: “dia um”.'
    reason: A nota apresenta a formulação ordinal mais idiomática em português, ao mesmo tempo que esclarece a construção cardinal do hebraico.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O verbo קרא, seguido do nome atribuído, expressa o ato de chamar ou dar nome. “Chamou” preserva de perto a formulação hebraica e é natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma morfológica plural, o substantivo rege aqui verbo no singular e designa o único Criador; “Deus” é a correspondência portuguesa padrão.
- source_word: לָאוֹר
  choice: à luz
  rationale: A preposição ל integra a construção hebraica de nomeação. “Chamou à luz Dia” mantém essa estrutura de maneira compreensível e digna em português.
- source_word: יוֹם
  choice: Dia
  rationale: Neste ponto, יוֹם é o nome dado à luz. A inicial maiúscula sinaliza o ato de nomeação.
- source_word: וְלַחֹשֶׁךְ
  choice: e às trevas
  rationale: A forma portuguesa conserva a preposição da construção de nomeação. O plural lexical “trevas” é a expressão corrente para חֹשֶׁךְ neste contexto.
- source_word: קָרָא
  choice: chamou
  rationale: A repetição do verbo reproduz o paralelismo e a cadência do hebraico, sem necessidade de explicitar novamente o sujeito.
- source_word: לָיְלָה
  choice: Noite
  rationale: É o nome atribuído às trevas; a inicial maiúscula marca essa função.
- source_word: וַיְהִי
  choice: houve
  rationale: “Houve” expressa naturalmente a construção existencial e permite conservar a repetição hebraica na sequência temporal.
- source_word: עֶרֶב
  choice: tarde
  rationale: עֶרֶב designa o período da tarde ou entardecer. “Tarde” é a correspondência bíblica corrente e não restringe indevidamente o sentido a “pôr do sol”.
- source_word: בֹקֶר
  choice: manhã
  rationale: “Manhã” representa o sentido básico de בֹקֶר sem o limitar especificamente ao amanhecer.
- source_word: יוֹם אֶחָד
  choice: dia um
  rationale: O hebraico usa o numeral cardinal אֶחָד, literalmente “um”, e não o ordinal “primeiro”. “Dia um” preserva essa forma marcada e a possível relevância interpretativa do original.
theological_decisions:
- issue: Tradução de יוֹם אֶחָד no encerramento da fórmula do primeiro dia da criação
  choice: dia um
  alternative: o primeiro dia; um dia
  rationale: O texto hebraico traz o cardinal “um”, não o ordinal “primeiro”. A tradução principal conserva essa particularidade e evita resolver antecipadamente sua possível importância literária ou teológica. A forma idiomática “o primeiro dia” é registrada em nota.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com cadência solene sem arcaísmo excessivo. A repetição de “chamou” e “houve” acompanha o paralelismo hebraico. “Dia” e “Noite” recebem maiúsculas por funcionarem como nomes atribuídos.
