  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: pt
  text: 'E Deus disse: “Haja luzeiros[a] na expansão[b] dos céus para separar o dia da noite; e que eles sirvam de sinais, de tempos determinados[c], de dias e de anos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “luzes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “firmamento” ou “abóbada”.
    reason: lexical_alternative
  - marker: c
    text: Ou “estações”. O termo hebraico pode indicar tempos fixados e, em outros contextos, datas festivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: luzeiros
  rationale: O substantivo designa corpos ou fontes que dão luz. “Luzeiros” expressa isso com clareza e dignidade, evitando que “luzes” seja entendido apenas como luminosidade abstrata.
- source_word: רָקִיעַ
  choice: expansão
  rationale: Mantém a ideia de algo estendido, sem recorrer ao arcaico “firmamento” nem especificar em excesso uma abóbada sólida.
- source_word: הַשָּׁמַיִם
  choice: dos céus
  rationale: Preserva a forma tradicional e literária, bem como a referência ao domínio celeste, sem reduzi-la simplesmente a “céu” no sentido meteorológico.
- source_word: לְהַבְדִּיל
  choice: para separar
  rationale: Traduz de modo natural o infinitivo de propósito e mantém o tema recorrente das separações na narrativa da criação.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: o dia da noite
  rationale: Com o verbo “separar”, esta é a construção idiomática em português e comunica plenamente a relação hebraica “entre... e entre...”.
- source_word: לְאֹתֹת
  choice: de sinais
  rationale: Na construção “sirvam de”, apresenta os corpos celestes como marcadores ou indicadores, sem restringir a natureza desses sinais.
- source_word: לְמוֹעֲדִים
  choice: de tempos determinados
  rationale: Preserva o sentido amplo de tempos fixados ou assinalados e não limita a referência às estações climáticas ou às festas religiosas.
- source_word: לְיָמִים וְשָׁנִים
  choice: de dias e de anos
  rationale: Representa diretamente as unidades temporais do hebraico e mantém a repetição preposicional de forma natural.
- source_word: יְהִי ... וְהָיוּ
  choice: Haja ... e que eles sirvam
  rationale: “Haja” conserva a força volitiva da ordem criadora; “que eles sirvam” comunica a função atribuída aos luzeiros de modo idiomático, em vez de sugerir mera existência.
theological_decisions:
- issue: Sentido de מוֹעֲדִים no contexto da criação
  choice: tempos determinados
  alternative: estações; festas; épocas determinadas
  rationale: O contexto trata da ordenação cósmica do tempo. A escolha mantém o sentido amplo e a possível ressonância posterior de datas festivas, sem impor aqui uma leitura exclusivamente climática ou litúrgica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Luzeiros” mantém o caráter concreto dos corpos luminosos; “expansão” evita tanto um arcaísmo quanto uma cosmologia excessivamente especificada. A pontuação organiza as funções sem apagar a coordenação do hebraico.
