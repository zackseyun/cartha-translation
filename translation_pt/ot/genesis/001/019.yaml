base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: pt
  text: Houve entardecer e houve manhã — o quarto dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Houve entardecer e houve manhã, um quarto dia”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: וַיְהִי
  choice: houve
  rationale: O wayyiqtol de היה integra a fórmula narrativa recorrente que encerra cada dia. “Houve” preserva de modo natural em português o sentido existencial, sem interpretá-lo como “tornou-se”.
- source_word: עֶרֶב
  choice: tarde
  rationale: O substantivo designa a tarde ou o entardecer. “Tarde” é a equivalência tradicional, direta e adequada ao paralelismo da fórmula.
- source_word: וַיְהִי
  choice: houve
  rationale: A repetição é mantida para conservar a estrutura e a cadência do hebraico.
- source_word: בֹקֶר
  choice: manhã
  rationale: Equivalente direto e natural do substantivo hebraico neste refrão.
- source_word: יוֹם רְבִיעִי
  choice: o quarto dia
  rationale: A expressão identifica o dia pelo ordinal. O artigo, embora não esteja expresso separadamente no hebraico, produz em português a formulação idiomática mais natural.
theological_decisions:
- issue: Traduzir o refrão dos dias da criação sem impor uma cronologia ou uma interpretação sobre a duração dos dias
  choice: Houve tarde e houve manhã — o quarto dia.
  alternative: Houve tarde e houve manhã, um quarto dia.
  rationale: A tradução conserva os termos e a fórmula do hebraico sem decidir debates mais amplos sobre a natureza ou a duração dos dias da criação. “O quarto dia” é natural em português, enquanto a nota registra uma correspondência mais formal possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “houve” preserva deliberadamente a cadência solene da fórmula hebraica.
