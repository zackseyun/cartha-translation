  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: pt
  text: 'E Deus os abençoou, dizendo: “Sejam fecundos, multipliquem-se e encham as águas dos mares; e que as aves[a] se multipliquem na terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seres voadores”; o termo hebraico עוֹף pode designar, de modo mais amplo, criaturas que voam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: O piel de ברך expressa a concessão de uma bênção. “Abençoou” é natural, preciso e preserva a força teológica do ato divino.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto que retoma as criaturas marinhas e as aves do versículo anterior.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em Gênesis 1, o substantivo rege verbo no singular e designa o único Criador.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente e digna de introduzir o discurso direto, correspondendo à construção infinitiva hebraica.
- source_word: פְּרוּ
  choice: Sejam fecundos
  rationale: Preserva o sentido reprodutivo de פרה e a conhecida formulação da bênção, em português atual e inclusivo quanto aos seres mencionados.
- source_word: וּרְבוּ
  choice: multipliquem-se
  rationale: רבה indica aumento numérico; a forma pronominal é idiomática em português nesse contexto.
- source_word: וּמִלְאוּ
  choice: encham
  rationale: Equivale diretamente ao imperativo de מלא, sem acrescentar uma ênfase ausente do hebraico.
- source_word: אֶת הַמַּיִם בַּיַּמִּים
  choice: as águas dos mares
  rationale: Expressa naturalmente em português a relação entre as águas e os mares, preservando os plurais hebraicos sem a construção menos fluida “as águas nos mares”.
- source_word: וְהָעוֹף
  choice: as aves
  rationale: עוֹף pode ser mais amplo que “aves”, mas esta é a opção mais natural no contexto; a amplitude lexical é preservada em nota.
- source_word: יִרֶב
  choice: multipliquem-se
  rationale: O jussivo de רבה tem força volitiva. Em português, o presente do subjuntivo preserva a bênção em forma semelhante a uma ordem, em vez de convertê-la em simples previsão.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: Indica o âmbito terrestre em que as aves aumentariam; “sobre” é especialmente natural para criaturas voadoras e permanece próximo do hebraico.
theological_decisions:
- issue: Natureza do ato de fala na bênção
  choice: 'Manter os imperativos e o jussivo como uma bênção divina expressa em formas volitivas: “Sejam fecundos, multipliquem-se...; e multipliquem-se as aves”.'
  alternative: 'Traduzir a oração final como futuro simples: “e as aves se multiplicarão”, ou uniformizar tudo como ordens diretas.'
  rationale: O hebraico une bênção e comissão mediante imperativos e um jussivo. A tradução conserva essa tensão, sem reduzir a fala a mera ordem nem a mera previsão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o ritmo solene do relato da criação sem recorrer a formas arcaicas. O marcador [a] aparece imediatamente após “aves”, termo ao qual a nota se refere.
