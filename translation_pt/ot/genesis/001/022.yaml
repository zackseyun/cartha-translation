    issue: “sobre a terra” é espacialmente ambíguo
    rationale: No contexto, בָּאָרֶץ se refere ao domínio terrestre, não à posição das aves no ar. “Na terra” é a opção portuguesa mais direta e evita que “sobre” seja entendido como “acima de”.
  - severity: low
    issue: Jussivo final expresso por inversão pouco fluida
    rationale: “Multipliquem-se as aves” é gramatical, mas “que as aves se multipliquem” explicita de modo mais idiomático a força volitiva do jussivo, sem convertê-lo em mera previsão.
