base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: pt
  text: 'E Deus fez os dois grandes luzeiros: o maior para governar o dia, o menor para governar a noite, e as estrelas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה significa normalmente “fazer”. “Fez” é direto e natural; “designou” acrescentaria ao verbo uma ideia funcional proveniente do contexto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em Gênesis 1, אֱלֹהִים rege verbo no singular e se refere ao único Deus; “Deus” é a correspondência portuguesa padrão.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: os dois grandes luzeiros
  rationale: מָאוֹר designa aquilo que produz ou porta luz, um luzeiro. “Luzeiros” é claro, digno e preserva melhor esse sentido concreto do que simplesmente “luzes”.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: o maior
  rationale: No contraste entre os dois luzeiros, o hebraico “o grande” é expresso naturalmente em português pelo comparativo “o maior”; a elipse de “luzeiro” evita repetição sem perda de sentido.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: para governar o dia
  rationale: מֶמְשֶׁלֶת comunica governo ou domínio. A construção “para governar” reproduz de modo natural a função indicada por לְ.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: o menor
  rationale: Em paralelo com “o maior”, “o menor” transmite naturalmente o contraste de tamanho ou posição expresso por קָטֹן, mantendo elíptico o substantivo já mencionado.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: para governar a noite
  rationale: Mantém a mesma construção e o mesmo sentido da expressão paralela referente ao dia.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: e também as estrelas
  rationale: A conjunção e o marcador de objeto introduzem as estrelas como objeto adicional de “fez”. “Também” explicita em português essa adição e reduz o risco de ligar as estrelas apenas à função de governar a noite.
theological_decisions:
- issue: Designação dos corpos celestes sem nomear o sol e a lua
  choice: Manter “luzeiro maior” e “luzeiro menor”, aqui abreviados após a primeira menção como “o maior” e “o menor”.
  alternative: Traduzir como “o sol” e “a lua”.
  rationale: O hebraico emprega מָאוֹר (“luzeiro”), não os nomes comuns do sol e da lua. Preservar essa escolha lexical respeita a formulação deliberada do texto e evita introduzir termos ausentes do original.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. “Luzeiros” preserva a imagem do hebraico sem soar excessivamente técnico; o paralelismo conciso mantém o ritmo solene do versículo.
