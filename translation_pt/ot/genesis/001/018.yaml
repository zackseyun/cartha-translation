id: GEN.1.18
reference: Genesis 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: pt
  text: para governarem o dia e a noite e para separarem[a] a luz das trevas. E Deus viu que era bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “distinguirem entre a luz e as trevas”.'
    reason: Alternativa lexical para להבדיל e para a construção hebraica literal “entre... e entre...”.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: para governarem
  rationale: O infinitivo com לְ expressa a função ou finalidade dos luzeiros mencionados no contexto. “Governarem” comunica naturalmente a ideia de exercer domínio funcional, sem sugerir divindade ou autonomia.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: o dia e a noite
  rationale: Os complementos definidos e paralelos são vertidos de modo idiomático em português sob a regência de “governar”, sem precisar repetir uma preposição.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: e para separarem
  rationale: בדל indica a separação ou distinção estabelecida na ordem criada. “Separarem” mantém a formulação concreta e recorrente de Gênesis 1; a repetição de “para” esclarece a coordenação das duas funções.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: a luz das trevas
  rationale: Com “separar”, a construção portuguesa idiomática é “separar X de Y”. Os artigos definidos do hebraico são preservados.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: E Deus viu
  rationale: Preserva o avanço e o ritmo narrativo da conjunção hebraica, recorrente no capítulo.
- source_word: כִּי טוֹב
  choice: que era bom
  rationale: Mantém a concisão do hebraico, que não explicita um pronome, e conserva o sentido amplo de bondade, adequação e ordem da criação.
theological_decisions:
- issue: Função dos luzeiros na criação
  choice: Os luzeiros são apresentados como encarregados de governar o dia e a noite e de manter a separação entre luz e trevas.
  alternative: Uma formulação mais personificadora poderia sugerir que os luzeiros exercem domínio como seres divinos independentes.
  rationale: A linguagem funcional de משל é preservada, mas o contexto mantém os luzeiros como elementos da criação ordenada e avaliada por Deus, sem introduzir agência divina autônoma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural dos infinitivos retoma naturalmente os luzeiros do versículo anterior. A frase final evita acrescentar “isso”, preservando a concisão e a abertura referencial do hebraico.
