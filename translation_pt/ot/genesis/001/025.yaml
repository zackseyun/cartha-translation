source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: pt
  text: Deus fez os animais selvagens da terra conforme as suas espécies, os animais domésticos conforme as suas espécies e todos os animais que rastejam pelo solo conforme as suas espécies[a][b]. E Deus viu que isso era bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme os seus tipos”. O termo hebraico indica categorias de criaturas e não deve ser entendido necessariamente como uma referência às espécies da taxonomia científica moderna.
    reason: cultural_note
  - marker: b
    text: Ou “todos os pequenos animais que se movem rente ao solo”. O hebraico usa antes “terra” e, aqui, um termo distinto traduzido como “solo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה significa normalmente “fazer”. “Fez” é direto, natural e adequado ao contexto da criação, sem acrescentar a ideia mais específica de modelar ou formar.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui ela rege verbos no singular e designa o único Criador; “Deus” é a tradução portuguesa normal.
- source_word: חַיַּת הָאָרֶץ
  choice: os animais selvagens da terra
  rationale: A expressão designa os animais terrestres não domesticados e os distingue de הַבְּהֵמָה. “Animais selvagens” comunica essa distinção com clareza no português atual.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: conforme as suas espécies
  rationale: מין indica tipos ou categorias de criaturas. “Espécies” é idiomático neste contexto bíblico, enquanto a nota impede que o termo seja indevidamente equiparado à taxonomia biológica moderna. O plural concorda naturalmente com os grupos coletivos em português.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: Neste contraste, בהמה se refere sobretudo aos animais terrestres domesticados. “Animais domésticos” é mais abrangente que “gado” e preserva a oposição aos animais selvagens.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: todos os animais que rastejam pelo solo
  rationale: רמש abrange pequenas criaturas que se deslocam junto ao chão. A formulação verbal é clara no português moderno, e “solo” preserva a distinção lexical entre הָאָרֶץ, “terra”, e הָאֲדָמָה, “solo”.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: E Deus viu que isso era bom
  rationale: A frase reproduz naturalmente o refrão avaliativo de Gênesis 1. “Isso” retoma o que Deus havia feito sem especificar mais do que o hebraico.
theological_decisions:
- issue: Categorias da criação e taxonomia científica moderna
  choice: espécies
  alternative: tipos
  rationale: O hebraico מין indica categorias de criaturas, mas não define categorias da taxonomia científica moderna. A tradução mantém a expressão portuguesa consagrada e explicita seu alcance na nota, sem impor ao texto uma classificação posterior.
- issue: Distinção entre הָאָרֶץ e הָאֲדָמָה no mesmo versículo
  choice: terra ... solo
  alternative: terra ... terra
  rationale: Empregar “terra” para הָאָרֶץ e “solo” para הָאֲדָמָה preserva a distinção vocabular do hebraico sem exagerar a diferença semântica entre os termos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação conserva a cadência enumerativa do hebraico; “animais selvagens”, “animais domésticos” e “animais que rastejam” tornam explícitas as três categorias sem recorrer a vocabulário arcaico.
