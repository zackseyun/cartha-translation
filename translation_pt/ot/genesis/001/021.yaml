  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: pt
  text: Assim, Deus criou as grandes criaturas marinhas[a], e todos os seres vivos que se movem, com os quais as águas fervilharam, segundo as suas espécies, e toda ave alada segundo a sua espécie. E Deus viu que isso era bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os grandes monstros marinhos” ou “os grandes dragões”. O hebraico tanninim pode designar criaturas grandes, serpentiformes ou monstruosas; aqui, o contexto aquático favorece “criaturas marinhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: criou
  rationale: Preserva o verbo distintivo da narrativa da criação e seu registro elevado, em português natural.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O substantivo plural tem concordância verbal singular neste contexto e se refere ao único Deus.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: as grandes criaturas marinhas
  rationale: O contexto aquático favorece uma designação ampla e natural, sem eliminar em nota os sentidos possíveis de criaturas monstruosas ou serpentiformes.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: todo ser vivo
  rationale: Aqui נֶפֶשׁ חַיָּה designa vida animada, não 'alma' no sentido teológico posterior.
- source_word: הָרֹמֶשֶׂת
  choice: que se move
  rationale: Expressa o sentido amplo do particípio sem restringi-lo a animais que rastejam.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: dos quais as águas ficaram repletas
  rationale: Comunica a abundância implicada por שׁרץ e mantém a relação entre os seres vivos e as águas.
- source_word: לְמִינֵהֶם
  choice: segundo as suas espécies
  rationale: Reproduz a categorização da criação e concorda com o referente plural.
- source_word: כָּל עוֹף כָּנָף
  choice: toda ave alada
  rationale: Formulação concisa e dignificada que representa tanto a categoria voadora quanto a menção às asas.
- source_word: לְמִינֵהוּ
  choice: segundo a sua espécie
  rationale: Mantém o sufixo singular, correspondente ao coletivo 'toda ave alada'.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: E Deus viu que isso era bom
  rationale: Tradução natural da fórmula avaliativa recorrente em Gênesis 1.
theological_decisions:
- issue: Tradução de תַּנִּינִם no contexto da criação e suas possíveis associações míticas
  choice: as grandes criaturas marinhas
  alternative: os grandes monstros marinhos; os grandes dragões
  rationale: O contexto imediato apresenta seres aquáticos como criaturas de Deus. A tradução principal evita impor conotações mitológicas, enquanto a nota preserva a amplitude lexical e a tensão possível do termo hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom claro e dignificado, com estrutura próxima do hebraico sem rigidez artificial.
