  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: pt
  text: 'E Deus disse: “Que a terra faça brotar[a] vegetação: plantas que produzam semente e árvores frutíferas que deem fruto segundo a sua espécie[b], com sua semente nele[c], sobre a terra.” E assim foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a terra produza vegetação”.'
    reason: lexical_alternative
  - marker: b
    text: O singular hebraico, “segundo a sua espécie”, tem sentido distributivo para as diversas espécies.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cuja semente está nele”. O pronome pode referir-se à árvore ou ao fruto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: faça brotar
  rationale: O hifil jussivo de דשא atribui à terra a produção do broto. “Que a terra faça brotar” comunica de modo natural tanto a força causativa quanto a ordem permissiva do hebraico.
- source_word: דֶּשֶׁא
  choice: vegetação
  rationale: O termo coletivo abrange o crescimento vegetal tenro; “vegetação” evita restringi-lo a “grama” ou “erva”.
- source_word: עֵשֶׂב
  choice: plantas
  rationale: Designa plantas herbáceas. “Plantas” é claro e atual, sem a possível conotação culinária de “ervas”.
- source_word: מַזְרִיעַ זֶרַע
  choice: que produzam semente
  rationale: A construção participial descreve a capacidade característica de produzir semente. O singular coletivo “semente” conserva a formulação hebraica e soa natural em português.
- source_word: עֵץ פְּרִי
  choice: árvores frutíferas
  rationale: A expressão construta caracteriza árvores que dão fruto; o plural coletivo é idiomático em português.
- source_word: עֹשֶׂה פְּרִי
  choice: que deem fruto
  rationale: Expressa a atividade característica da árvore frutífera em linguagem agrícola natural.
- source_word: לְמִינוֹ
  choice: segundo a sua espécie
  rationale: Mantém o singular morfológico do hebraico, empregado distributivamente, sem impor uma taxonomia científica moderna.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: com sua semente dentro dele
  rationale: Conserva o singular e a ambiguidade possível do pronome hebraico, que pode remeter ao fruto ou à árvore, em vez de decidir silenciosamente o referente.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Equivalente locativo direto que preserva a repetição de “terra” e a cadência do enunciado.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Fórmula natural de cumprimento em português, comunicando que a ordem divina se realizou.
theological_decisions:
- issue: Alcance das categorias de vida vegetal criada
  choice: Manter as categorias amplas de vegetação, plantas que produzem semente e árvores frutíferas.
  alternative: Generalizar tudo como “todo tipo de plantas” ou empregar categorias botânicas modernas mais específicas.
  rationale: O texto descreve a criação em categorias observáveis e ordenadas, sem apresentar uma taxonomia científica. A tradução conserva suas distinções sem estreitá-las nem modernizá-las artificialmente.
- issue: Referente de בּוֹ em “sua semente dentro dele”
  choice: Preservar no texto a possível referência ao fruto ou à árvore.
  alternative: Explicitar “semente dentro do fruto” ou “semente na árvore”.
  rationale: Como tanto “árvore” quanto “fruto” são masculinos singulares no hebraico e podem servir de referente, escolher um deles eliminaria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência solene da narrativa, evita vocabulário botânico técnico e preserva o singular distributivo e a ambiguidade pronominal do hebraico.
