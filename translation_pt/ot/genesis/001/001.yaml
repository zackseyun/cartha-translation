  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: pt
  text: No princípio, quando Deus criou os céus e a terra[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente, traduz-se como uma frase completa: “No princípio, Deus criou os céus e a terra.” O hebraico — בְּרֵאשִׁית sem artigo, seguido do verbo finito בָּרָא — pode ser lido mais naturalmente como uma oração temporal dependente, em paralelo com Gênesis 2:4b. Nesse caso, a oração principal aparece no versículo 3: “Deus disse: ‘Haja luz’”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: No princípio, quando … criou
  rationale: A forma sem artigo, seguida do verbo finito בָּרָא, pode introduzir naturalmente uma oração temporal dependente. A formulação conserva o valor lexical de רֵאשִׁית e deixa a frase aberta para sua continuação.
- source_word: בָּרָא
  choice: criou
  rationale: É o equivalente português direto e consagrado para o verbo hebraico de criação divina, sem especificar indevidamente o processo.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo singular בָּרָא indica aqui um referente singular.
- source_word: אֵת
  choice: '[não traduzido; marcador de objeto direto]'
  rationale: A partícula marca objetos diretos definidos em hebraico e não requer equivalente lexical em português.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Reproduz o plural hebraico e, em conjunto com “a terra”, expressa a totalidade da ordem criada.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No par cósmico “os céus e a terra”, אָרֶץ designa a terra, não apenas uma região ou território.
theological_decisions:
- issue: Sintaxe da oração inicial
  choice: 'Oração temporal dependente: “No princípio, quando Deus criou os céus e a terra—”'
  alternative: 'Oração principal completa: “No princípio, Deus criou os céus e a terra.”'
  rationale: A ausência de artigo em בְּרֵאשִׁית e sua sequência com o verbo finito בָּרָא favorecem uma leitura temporal dependente, comparável a Gênesis 2:4b e Oseias 1:2. A leitura tradicional como frase completa continua possível e é preservada em nota, sem fazer uma doutrina depender desta decisão sintática.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “No princípio” preserva a expressão bíblica consagrada; o travessão sinaliza que a oração continua nos versículos seguintes.
