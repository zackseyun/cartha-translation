  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: pt
  text: 'Então Deus disse: “Que as águas fervilhem de seres vivos em abundância[a], e que as aves[b] voem acima da terra, ao longo da face da expansão dos céus[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fervilhem as águas de um fervilhar de seres vivos”. O hebraico emprega um verbo e um substantivo da mesma raiz para enfatizar a vida abundante e numerosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “criaturas voadoras”. O termo hebraico pode ter sentido mais amplo do que apenas aves.
    reason: lexical_alternative
  - marker: c
    text: “Expansão” também pode ser traduzido por “firmamento” ou “abóbada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá sequência à narrativa. “Então” comunica essa progressão com naturalidade em português, sem acrescentar uma relação causal.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em Gênesis 1, o substantivo ocorre com verbo no singular e designa o único Deus Criador.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: Que as águas fervilhem de ... em abundância
  rationale: O verbo e o substantivo cognato enfatizam grande quantidade de vida em movimento. A formulação portuguesa comunica a intensidade sem recorrer à expressão pouco natural “enxameiem de enxames”.
- source_word: נֶפֶשׁ חַיָּה
  choice: seres vivos
  rationale: Neste contexto, a expressão designa criaturas dotadas de vida, sem formular uma afirmação técnica sobre a alma.
- source_word: וְעוֹף
  choice: e que as aves
  rationale: “Aves” é a equivalência comum e clara no contexto, embora o termo hebraico possa abranger criaturas voadoras de modo mais amplo.
- source_word: יְעוֹפֵף
  choice: voem
  rationale: O subjuntivo depois de “que” expressa adequadamente o valor volitivo do hebraico.
- source_word: עַל הָאָרֶץ
  choice: acima da terra
  rationale: Com o verbo de voo, a preposição indica posição ou movimento sobre a terra, sem contato com o solo.
- source_word: עַל פְּנֵי
  choice: diante da
  rationale: A expressão espacial significa literalmente “sobre a face de” e pode indicar movimento diante da extensão visível; “diante da” preserva essa relação sem sugerir que as aves voam dentro da expansão.
- source_word: רְקִיעַ
  choice: expansão
  rationale: “Expansão” conserva a imagem de algo estendido e evita tanto o caráter arcaico de “firmamento” quanto uma descrição cosmológica mais específica como “abóbada”.
- source_word: הַשָּׁמָיִם
  choice: dos céus
  rationale: Mantém o plural hebraico e o registro elevado e compreensível do relato da criação.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto da criação animal
  choice: seres vivos
  alternative: almas viventes
  rationale: A expressão descreve vida animada, sem exigir aqui uma doutrina técnica sobre a natureza ou a imortalidade da alma.
- issue: Representação cosmológica de רְקִיעַ
  choice: expansão
  alternative: firmamento ou abóbada
  rationale: O termo hebraico possui implicações cosmológicas debatidas. “Expansão” mantém a imagem básica e a ambiguidade do texto, sem impor um modelo cosmológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção volitiva “Que...” reproduz o comando criador; “fervilhem ... em abundância” conserva a intensidade do hebraico em linguagem natural. Os marcadores foram colocados exatamente junto aos termos explicados.
