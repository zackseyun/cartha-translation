base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: pt
  text: 'E Deus viu tudo o que havia feito, e eis que era muito bom. Houve tarde e houve manhã: o sexto dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O verbo ראה, nesta forma narrativa, é traduzido diretamente por “viu”. No contexto, inclui percepção avaliativa, sem que seja necessário explicitá-la na tradução.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em Gênesis 1, o substantivo de forma plural tem concordância verbal singular e se refere ao único Criador; “Deus” é a tradução portuguesa natural.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: tudo o que havia feito
  rationale: A expressão abrange a totalidade do que Deus criou. “Havia feito” apresenta naturalmente em português a ação já concluída antes da avaliação divina.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama a atenção para o que segue e lhe dá vivacidade. “E eis que” preserva essa força retórica e o tom solene, embora seja menos frequente na fala cotidiana.
- source_word: טוֹב מְאֹד
  choice: muito bom
  rationale: טוֹב significa “bom”, e מְאֹד o intensifica. “Muito bom” é uma tradução direta e natural, sem restringir a bondade a uma categoria moral, estética ou funcional.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Houve tarde e houve manhã
  rationale: A repetição de היה com os substantivos temporais forma a fórmula de encerramento dos dias em Gênesis 1. A repetição de “houve” conserva a estrutura e a cadência do hebraico.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: o sexto dia
  rationale: O substantivo seguido do ordinal definido corresponde naturalmente a “o sexto dia”, preservando o artigo do hebraico.
theological_decisions:
- issue: Natureza da bondade da criação em טוֹב מְאֹד
  choice: muito bom
  alternative: extremamente bom
  rationale: A formulação preserva a afirmação ampla da bondade da criação sem defini-la exclusivamente como moral, estética ou funcional.
- issue: Fórmula do dia e debates sobre os dias da criação
  choice: 'Houve tarde e houve manhã: o sexto dia'
  alternative: 'Foi tarde e foi manhã: dia sexto'
  rationale: A tradução acompanha de perto a fórmula hebraica sem acrescentar explicações sobre a duração ou a função literária dos dias. Os dois-pontos apenas apresentam “o sexto dia” como a identificação conclusiva da fórmula.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva deliberadamente a solenidade e a função enfática do hebraico; a repetição “houve... houve...” mantém a cadência formular do relato.
