lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa. “E ... disse” preserva a sequência hebraica com naturalidade e sem especificar uma relação temporal ou lógica além do texto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo apresenta concordância verbal singular neste contexto e designa o único Criador; “Deus” é a equivalência portuguesa normal.
- source_word: יְהִי
  choice: Haja
  rationale: O jussivo de היה expressa vontade ou ordem. “Haja” é uma formulação portuguesa concisa, solene e idiomática para o decreto criador, preservando também a possibilidade volitiva indicada em nota.
- source_word: אוֹר
  choice: luz
  rationale: O sentido lexical básico é “luz”, sem razão contextual para restringi-lo a uma fonte específica ou entendê-lo metaforicamente.
- source_word: וַיְהִי
  choice: E houve
  rationale: O wayyiqtol de היה relata o resultado imediato da fala divina. “E houve” é conciso, natural e mantém a correspondência lexical com “Haja”.
- source_word: אוֹר
  choice: luz
  rationale: A repetição de “luz” reproduz a repetição hebraica e destaca o cumprimento exato da ordem.
theological_decisions:
- issue: Forma do decreto criador divino
  choice: Haja luz
  alternative: Que haja luz
  rationale: O jussivo hebraico pode exprimir vontade ou ordem. “Haja luz” conserva a força eficaz e solene do decreto sem acrescentar uma explicação teológica ao enunciado; a alternativa volitiva é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação tradicional “Haja luz” continua natural no registro bíblico contemporâneo; a coordenação com “E” preserva o ritmo e a progressão do hebraico.
