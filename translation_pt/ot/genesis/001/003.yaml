  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: pt
  text: 'E Deus disse[a]: “Haja luz.” E houve luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que haja luz.” O hebraico emprega uma forma jussiva que expressa vontade ou ordem.'
