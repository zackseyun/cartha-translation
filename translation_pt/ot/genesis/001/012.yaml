  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: pt
  text: E a terra produziu vegetação, plantas que dão semente segundo as suas espécies[a], e árvores que dão frutos, nos quais está a sua semente, segundo as suas espécies. E Deus viu que isso era bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo os seus tipos”. A expressão hebraica se refere a categorias de seres criados, sem necessariamente empregar “espécie” no sentido técnico da biologia moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: produziu
  rationale: O hifil de יצא descreve a terra fazendo a vegetação surgir. “Produziu” é natural e mantém a ideia causativa sem sugerir fabricação artificial.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto cósmico de Gênesis 1 favorece “terra”, e não “solo” ou “país”.
- source_word: דֶּשֶׁא
  choice: vegetação
  rationale: O termo abrange o crescimento vegetal verde de modo coletivo e não se limita a “erva” ou “grama”.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: plantas que dão sementes
  rationale: Expressa em português corrente a vegetação herbácea com capacidade de produzir semente.
- source_word: לְמִינֵהוּ
  choice: segundo as suas espécies
  rationale: “Espécies” é aqui empregado no sentido comum de tipos ou categorias, não como termo técnico da taxonomia biológica moderna; a nota explicita essa limitação.
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: e árvores que dão frutos
  rationale: O singular hebraico tem valor coletivo. A forma plural é idiomática em português e preserva a descrição funcional.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: nos quais estão as suas sementes
  rationale: Mantém a construção relativa e relaciona naturalmente as sementes aos frutos em português, sem apagar a formulação compacta do hebraico.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: E Deus viu que isso era bom
  rationale: Reproduz com clareza o refrão avaliativo da narrativa da criação.
theological_decisions:
- issue: Categorias criadas e taxonomia biológica moderna
  choice: segundo as suas espécies
  alternative: segundo os seus tipos
  rationale: A tradução conserva a linguagem classificatória do texto, mas a nota impede que “espécies” seja entendida obrigatoriamente como uma categoria científica moderna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O sinal de dois-pontos torna explícita a relação entre a vegetação geral e as duas classes mencionadas em seguida. A repetição de “segundo as suas espécies” preserva a estrutura enfática do hebraico.
