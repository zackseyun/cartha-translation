  terminology: “Plantas”, “árvores”, “semente” e “alimento” são escolhas terminológicas exatas e naturais. “Cujo fruto contém semente” comunica de forma idiomática a qualificação hebraica do fruto, sem introduzir uma interpretação teológica adicional.
