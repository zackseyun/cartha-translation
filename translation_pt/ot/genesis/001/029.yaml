  source_fidelity: 'O texto português transmite com precisão a concessão divina já efetuada: toda planta que produz semente e toda árvore com fruto que contém semente são dadas como alimento. O coletivo singular em “Isso lhes servirá de alimento” é compatível com o hebraico יִהְיֶה e retoma naturalmente os dois conjuntos mencionados.'
