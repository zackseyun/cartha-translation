  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: pt
  text: 'E Deus disse: “Vejam, eu lhes dei todas as plantas que produzem semente sobre a face de toda a terra e todas as árvores cujo fruto contém semente. Isso lhes servirá de alimento.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Preserva a função de chamar a atenção, em linguagem portuguesa atual e natural, sem recorrer ao mais arcaizante “Eis”.
- source_word: נָתַתִּי
  choice: eu lhes dei
  rationale: O perfeito hebraico apresenta a dádiva como realizada e vigente; o pretérito perfeito comunica isso naturalmente em português.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: todas as plantas que produzem semente
  rationale: עֵשֶׂב designa vegetação ou plantas em sentido amplo; “plantas” evita restringir o termo a ervas culinárias, e “produzem semente” expressa claramente o particípio hebraico.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: sobre a face de toda a terra
  rationale: Mantém a imagem espacial do hebraico e a abrangência de כָּל sem substituir “terra” por “mundo”.
- source_word: כָּל הָעֵץ
  choice: todas as árvores
  rationale: כָּל com o singular coletivo tem sentido distributivo; o plural é a forma idiomática em português.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: cujo fruto contém semente
  rationale: Expressa de modo natural a relação entre árvore, fruto e semente, preservando o ponto central da construção hebraica sem reproduzir sua ordem de palavras de maneira artificial.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Isso lhes servirá de alimento
  rationale: “Isso” retoma coletivamente as plantas e árvores concedidas e corresponde ao verbo hebraico singular; “servirá de alimento” expressa com naturalidade a função indicada por לְאָכְלָה.
theological_decisions:
- issue: Extensão da concessão alimentar
  choice: Traduzir a concessão universal das plantas e árvores portadoras de semente sem acrescentar exclusividade alimentar.
  alternative: Explicitar que somente vegetais foram autorizados como alimento.
  rationale: O versículo concede esses vegetais como alimento, mas não contém por si só uma partícula equivalente a “somente”; a tradução não deve resolver além do texto a questão teológica da dieta humana original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” funciona como marcador de atenção dirigido ao plural “vocês”, implícito em “lhes”. A formulação evita tanto o arcaísmo excessivo quanto a coloquialidade.
