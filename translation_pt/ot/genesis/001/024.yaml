base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: pt
  text: 'E Deus disse: “Que a terra produza seres vivos conforme as suas espécies: animais domésticos, animais que rastejam e animais selvagens da terra, conforme as suas espécies.” E assim aconteceu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצֵא
  choice: Que ... produza
  rationale: O hifil jussivo expressa a ordem divina para que a terra faça surgir os seres vivos. “Que a terra produza” é natural em português e conserva o valor causativo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da criação, o termo designa amplamente o domínio terrestre; “a terra” preserva esse alcance.
- source_word: נֶפֶשׁ חַיָּה
  choice: seres vivos
  rationale: A expressão indica vida animada e funciona coletivamente, como mostram as categorias seguintes. “Seres vivos” evita a carga metafísica moderna de “almas viventes” sem restringir o sentido.
- source_word: לְמִינָהּ
  choice: conforme as suas espécies
  rationale: Embora a forma hebraica seja singular e coletiva, o sentido é distributivo entre os grupos de animais. A formulação portuguesa comunica essa relação naturalmente.
- source_word: בְּהֵמָה
  choice: animais domésticos
  rationale: Neste contraste, o termo abrange sobretudo animais terrestres maiores domesticados ou mansos. “Animais domésticos” é claro e não o restringe apenas ao gado bovino.
- source_word: רֶמֶשׂ
  choice: animais que rastejam
  rationale: O termo abrange criaturas pequenas que se deslocam junto ao chão. A expressão mantém a amplitude sem identificar espécies específicas.
- source_word: חַיְתוֹ אֶרֶץ
  choice: animais selvagens da terra
  rationale: A expressão distingue os animais terrestres não domesticados de בְּהֵמָה, preservando também a referência explícita à terra.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Reproduz de modo natural e solene a fórmula de cumprimento recorrente em Gênesis 1.
theological_decisions:
- issue: Se נֶפֶשׁ deve ser traduzido com linguagem teologicamente carregada
  choice: seres vivos
  alternative: almas viventes; criaturas vivas
  rationale: Neste contexto, a expressão se refere genericamente a criaturas animadas, sem formular uma doutrina sobre a constituição metafísica dos animais. “Seres vivos” preserva o sentido contextual sem importar debates posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A cadência da ordem divina e da fórmula de cumprimento foi preservada sem arcaísmos.
