source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: pt
  text: E a terra estava sem forma e vazia, e havia escuridão sobre a superfície do abismo, e o Espírito de Deus[a] pairava sobre a superfície das águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um vento vindo de Deus” ou “o vento de Deus”.'
    reason: Leitura alternativa de רוּחַ אֱלֹהִים, que pode designar tanto o Espírito de Deus quanto um vento associado a Deus.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: E a terra
  rationale: הָאָרֶץ significa “a terra”; o וְ inicial liga esta frase à anterior. “E a terra” mantém essa conexão sem introduzir um marcador discursivo ausente.
- source_word: הָיְתָה
  choice: estava
  rationale: Aqui, o perfeito Qal de היה funciona mais naturalmente como cópula estativa. “Estava” descreve a condição da terra sem sugerir que ela “se tornou” assim.
- source_word: תֹהוּ וָבֹהוּ
  choice: sem forma e vazia
  rationale: A expressão descreve um estado de desolação, falta de forma e vazio. A formulação escolhida é clara, corrente e preserva o paralelismo dos dois termos.
- source_word: וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם
  choice: e havia escuridão sobre a superfície das profundezas
  rationale: “Escuridão” corresponde diretamente a חֹשֶׁךְ; “sobre a superfície de” comunica o sentido espacial de עַל־פְּנֵי. “Profundezas” representa o abismo aquático de תְהוֹם sem acrescentar conotações mitológicas.
- source_word: וְרוּחַ אֱלֹהִים
  choice: e o Espírito de Deus
  rationale: רוּחַ pode significar “espírito”, “vento” ou “sopro”. “O Espírito de Deus” é uma leitura forte e tradicional, enquanto a leitura meteorológica é preservada em nota para manter a ambiguidade do hebraico.
- source_word: מְרַחֶפֶת
  choice: pairava
  rationale: O particípio indica ação contínua. “Pairava” expressa movimento sustentado sobre as águas e é natural em português.
- source_word: עַל־פְּנֵי הַמָּיִם
  choice: sobre a superfície das águas
  rationale: A expressão conserva a imagem espacial de עַל־פְּנֵי, e “águas” mantém a forma plural e a imagem das águas cósmicas no texto hebraico.
theological_decisions:
- issue: Se הָיְתָה deve ser entendido como estado (“estava”) ou mudança de estado (“tornou-se”)
  choice: estava
  alternative: tornou-se
  rationale: O contexto descreve a condição da terra nesta etapa da narrativa. O hebraico não exige uma mudança de estado; portanto, “estava” evita introduzir uma reconstrução teológica que o texto não afirma.
- issue: Se וְרוּחַ אֱלֹהִים se refere ao Espírito de Deus ou a um vento vindo de Deus
  choice: o Espírito de Deus
  alternative: um vento vindo de Deus; o vento de Deus
  rationale: A expressão hebraica é genuinamente ambígua. O texto principal adota a leitura pessoal tradicional, mas a leitura meteorológica aparece na nota para não eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o encadeamento por “E”, evita o arcaísmo “sem forma e vã” e preserva a ambiguidade de רוּחַ אֱלֹהִים em nota.
