  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: pt
  text: E houve tarde, e houve manhã — o quinto dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E foi tarde, e foi manhã — o quinto dia”.'
    reason: Alternativa lexical para וַיְהִי, reproduzindo de modo mais literal o verbo “ser”.
lexical_decisions:
- source_word: וַיְהִי
  choice: e houve
  rationale: A forma narrativa de היה introduz a fórmula recorrente. “E houve” é natural em português, conserva a cadência solene e corresponde ao valor existencial da expressão.
- source_word: עֶרֶב
  choice: tarde
  rationale: O substantivo designa a tarde ou o anoitecer. “Tarde” é o equivalente tradicional e direto, adequado ao paralelismo da fórmula.
- source_word: בֹּקֶר
  choice: manhã
  rationale: O substantivo designa a manhã. “Manhã” é o equivalente direto e preserva o paralelismo com “tarde”.
- source_word: יוֹם
  choice: dia
  rationale: Aqui, יוֹם identifica o dia numerado da criação. “Dia” é o equivalente lexical direto, sem impor uma interpretação sobre sua duração.
- source_word: חֲמִישִׁי
  choice: quinto
  rationale: O ordinal qualifica “dia”; “quinto” reproduz com exatidão o hebraico.
theological_decisions:
- issue: Natureza da fórmula dos dias da criação
  choice: Manter a fórmula temporal “E houve tarde, e houve manhã — o quinto dia” sem interpretar a duração ou a natureza do dia.
  alternative: Traduzir de maneira interpretativa para sugerir um dia de 24 horas ou, ao contrário, uma era ou época.
  rationale: O hebraico apresenta a fórmula recorrente de tarde e manhã e a designação ordinal do dia, mas a tradução não deve resolver debates posteriores sobre a duração ou a estrutura literária dos dias da criação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “e houve” preserva a cadência hebraica da narrativa; o travessão destaca a identificação conclusiva do quinto dia.
