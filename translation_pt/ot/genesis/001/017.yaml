  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: pt
  text: E Deus os colocou na expansão dos céus, para iluminarem a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no firmamento dos céus”.'
    reason: Alternativa lexical tradicional para רָקִיעַ.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: colocou
  rationale: Neste contexto, נתן indica que Deus pôs deliberadamente os luminares em seu lugar; “colocou” é natural e claro em português.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto que retoma os luminares mencionados no contexto anterior.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo rege aqui um verbo no singular e designa o único Criador.
- source_word: בִּרְקִיעַ
  choice: na expansão
  rationale: רָקִיעַ designa aquilo que se estende ou se encontra estendido; “expansão” preserva o sentido espacial amplo sem impor uma cosmologia específica.
- source_word: הַשָּׁמַיִם
  choice: dos céus
  rationale: Mantém a forma plural hebraica e o registro elevado da narrativa da criação.
- source_word: לְהָאִיר
  choice: para iluminarem
  rationale: O infinitivo no hifil tem sentido causativo, “dar luz” ou “iluminar”; o plural retoma naturalmente os luminares representados por “os”.
- source_word: עַל הָאָרֶץ
  choice: a terra
  rationale: Com “iluminar”, o objeto direto é a formulação mais natural em português e comunica que a luz alcança a terra; o artigo definido preserva a referência do hebraico.
theological_decisions:
- issue: O termo cosmológico רָקִיעַ no relato da criação
  choice: expansão
  alternative: firmamento; abóbada celeste
  rationale: “Expansão” conserva o sentido espacial geral do termo e evita tanto uma expressão arcaica pouco transparente quanto uma reconstrução cosmológica mais específica do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A ordem da frase acompanha de perto o hebraico sem resultar artificial.
