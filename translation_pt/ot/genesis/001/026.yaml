  naturalness: A redação é em geral clara e moderna. Contudo, «aves dos céus» é uma reprodução excessivamente literal do plural hebraico; em português contemporâneo, «aves do céu» é a expressão idiomática normal e ainda comunica plenamente o referente. «E que dominem» oferece uma formulação volitiva mais direta e natural do que «e que eles governem sobre», sem alterar o sentido.
  terminology: «Deus», «ser humano», «imagem», «semelhança», «animais domésticos» e «animal rastejante» são escolhas adequadas. A nota sobre o plural divino preserva as leituras sem impor uma interpretação. A alternativa da nota d deve ser invertida após a adequação idiomática do texto principal.
