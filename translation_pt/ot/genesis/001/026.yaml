  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: pt
  text: 'Então Deus disse: “Façamos o ser humano[a] à nossa imagem, conforme a nossa semelhança[b], e que dominem[c] os peixes do mar, as aves do céu[d], os animais domésticos, toda a terra e todo animal rastejante que se move sobre a terra”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “o homem”, “a humanidade” ou “os seres humanos”. O hebraico adam é aqui um singular coletivo: o ser humano considerado como espécie; por isso, o versículo passa depois ao plural “eles”.'
    reason: lexical_alternative
  - marker: b
    text: 'As expressões plurais “Façamos” e “nossa” são mantidas conforme o hebraico. Elas têm sido entendidas de diferentes maneiras: como deliberação divina, como uma fala dirigida à corte celestial ou, na leitura canônica cristã, como uma linguagem compatível com a revelação posterior da Trindade.'
    reason: alternative_reading
  - marker: c
    text: Ou “exerçam domínio sobre”.
    reason: lexical_alternative
  - marker: d
    text: Ou “aves dos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português moderno.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo está no singular neste contexto, indicando o único Deus.
- source_word: נַעֲשֶׂה
  choice: Façamos
  rationale: A forma cohortativa na primeira pessoa do plural é preservada sem explicar ou resolver sua significação teológica.
- source_word: אָדָם
  choice: o ser humano
  rationale: Aqui, adam é um singular coletivo que designa a humanidade como espécie. “O ser humano” conserva o singular representativo e permite que o plural subsequente explicite o sentido coletivo.
- source_word: בְּצַלְמֵנוּ
  choice: à nossa imagem
  rationale: Reproduz de modo claro e tradicional a ideia de imagem ou representação expressa por צלם.
- source_word: כִּדְמוּתֵנוּ
  choice: conforme a nossa semelhança
  rationale: Preserva a noção de correspondência e mantém distinta a expressão anterior, “imagem”.
- source_word: וְיִרְדּוּ
  choice: e que eles governem sobre
  rationale: A construção expressa valor volitivo ou de finalidade após “Façamos”; o pronome plural preserva a passagem do coletivo singular para sua referência plural.
- source_word: בִדְגַת הַיָּם
  choice: sobre os peixes do mar
  rationale: Equivalência natural e direta da construção hebraica.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: sobre as aves dos céus
  rationale: “Aves” é natural em português, e “céus” reflete de perto o plural hebraico שמים.
- source_word: וּבַבְּהֵמָה
  choice: sobre os animais domésticos
  rationale: בהמה designa aqui os animais terrestres domesticados como classe, de modo mais amplo que apenas gado bovino.
- source_word: וּבְכָל הָאָרֶץ
  choice: sobre toda a terra
  rationale: No contexto cósmico de Gênesis 1, ארץ se refere à terra inteira, não a uma região local.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: sobre todo animal rastejante que se move
  rationale: A formulação mantém a repetição de raiz do hebraico de maneira parcialmente natural, esclarecendo que se trata de criaturas que se deslocam junto ao solo.
theological_decisions:
- issue: 'Discurso divino no plural: “Façamos ... nossa imagem ... nossa semelhança”'
  choice: Preservar todas as formas plurais, sem identificar no texto principal o interlocutor de Deus.
  alternative: Entender como deliberação divina, discurso à corte celestial ou, na leitura canônica cristã, linguagem compatível com a revelação posterior da Trindade.
  rationale: O hebraico é inequivocamente plural na forma, mas o versículo isolado não determina qual explicação interpretativa deve ser incorporada à tradução.
- issue: אָדָם como singular coletivo
  choice: Traduzir por “o ser humano” e manter depois o pronome plural “eles”.
  alternative: “o homem”, “a humanidade” ou “os seres humanos”.
  rationale: “O ser humano” preserva o singular representativo sem obscurecer que a referência inclui a humanidade coletivamente; a mudança para o plural reproduz a tensão gramatical do hebraico.
- issue: Natureza do governo humano sobre as criaturas
  choice: Usar “governem sobre”, sem qualificar moral ou teologicamente esse governo.
  alternative: “dominem” ou “exerçam domínio sobre”.
  rationale: רדה denota governar ou exercer domínio. A tradução não acrescenta ao verbo ideias de exploração nem de mordomia que, embora possam surgir de uma leitura teológica mais ampla, não estão lexicalmente explicitadas aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Façamos” conserva o tom elevado sem soar arcaico. A repetição de “sobre” acompanha a estrutura enfática do hebraico. A pontuação das notas foi organizada segundo a sequência de ocorrência no texto principal.
