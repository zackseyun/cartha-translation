- from: 'Então Deus disse: “Façamos o ser humano[a] à nossa imagem, conforme a nossa semelhança[b], e que eles governem[c] sobre os peixes do mar, sobre as aves dos céus[d], sobre os animais domésticos, sobre toda a terra e sobre todo animal rastejante que se move sobre a terra”.'
  to: 'Então Deus disse: “Façamos o ser humano[a] à nossa imagem, conforme a nossa semelhança[b], e que dominem[c] os peixes do mar, as aves do céu[d], os animais domésticos, toda a terra e todo animal rastejante que se move sobre a terra”.'
  rationale: A revisão limita-se a ajustes idiomáticos seguros. «Aves do céu» traduz naturalmente a expressão hebraica sem exigir a reprodução do plural morfológico de שָׁמַיִם; a alternativa literal é mantida em nota. «E que dominem» torna mais fluente a construção portuguesa e mantém o jussivo plural de וְיִרְדּוּ. As âncoras e o conteúdo das notas permanecem completos e em ordem.
