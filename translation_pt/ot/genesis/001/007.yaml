  naturalness: “Deus fez a extensão e separou as águas...” é claro, fluente e adequado ao português moderno internacional. “E assim foi” é igualmente natural, mais conciso e preserva melhor o ritmo formular do texto.
  terminology: “Deus”, “fez”, “separou”, “águas” e “extensão” são escolhas adequadas. A nota lexical apresenta de modo apropriado “firmamento” como alternativa tradicional e “abóbada” como alternativa possível, sem impor uma reconstrução cosmológica.
