  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: pt
  text: Deus fez a extensão e separou as águas que estavam debaixo da extensão das águas que estavam acima da extensão[a]. E assim foi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “firmamento” (tradicional); também é possível: “abóbada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem o sentido comum de “fazer”. “Fez” é direto e natural no contexto da criação, sem acrescentar a nuance mais específica de “formou” ou “moldou”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em Gênesis 1, אֱלֹהִים, acompanhado de verbo no singular, refere-se ao único Deus Criador; “Deus” é a tradução portuguesa padrão e adequada ao contexto.
- source_word: הָרָקִיעַ
  choice: a extensão
  rationale: רָקִיעַ designa algo estendido ou expandido. “Extensão” conserva essa imagem espacial em português atual, sem impor uma forma cosmológica específica.
- source_word: וַיַּבְדֵּל
  choice: separou
  rationale: בדל significa separar ou distinguir. “Separou” é natural em português e preserva o tema estruturante repetido no relato.
- source_word: בֵּין ... וּבֵין
  choice: '... das ...'
  rationale: A construção hebraica distingue dois grupos. Com o verbo português “separar”, a formulação idiomática é “separou X de Y”.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Embora מים possa funcionar como substantivo de massa, o plural “as águas” reflete a forma hebraica e mantém o estilo solene e literário da passagem.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: que estavam debaixo da extensão
  rationale: מִתַּחַת expressa posição inferior. “Debaixo da extensão” reproduz com clareza o contraste vertical com “acima”.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: que estavam acima da extensão
  rationale: מֵעַל expressa posição superior. “Acima da extensão” forma o contraponto claro e natural a “debaixo da extensão”.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: A expressão recorrente indica que a ordem divina se cumpriu. “E assim aconteceu” é clara e idiomática, preservando a função do refrão.
theological_decisions:
- issue: Tradução de רָקִיעַ no contexto da criação e suas possíveis implicações cosmológicas
  choice: a extensão
  alternative: o firmamento; a abóbada
  rationale: “Extensão” preserva a noção de algo estendido, evita o caráter tradicional e potencialmente opaco de “firmamento” e não especifica uma forma arquitetônica como “abóbada”. Assim, a tradução não resolve além do texto as questões relativas à cosmologia antiga.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto a progressão do hebraico, mas usa a regência idiomática portuguesa de “separar X de Y”. O marcador [a] aparece imediatamente após a segunda ocorrência de “extensão”, onde a alternativa lexical permanece relevante.
