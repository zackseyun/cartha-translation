base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: pt
  text: 'Deus os abençoou e lhes disse: “Sejam fecundos, multipliquem-se, encham a terra e sujeitem-na. Dominem[a] os peixes do mar, as aves do céu e todo ser vivo que se move[b] sobre a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “que rasteja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: O piel de ברך expressa a concessão efetiva de uma bênção; “abençoou” é direto, natural e preserva o caráter performativo do ato divino.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, a concordância verbal singular e o contexto de Gênesis 1 indicam o único Deus.
- source_word: פְּרוּ
  choice: Sejam fecundos
  rationale: O imperativo se refere à fecundidade e à geração de descendência. “Sejam fecundos” preserva o sentido sem reduzi-lo a uma paráfrase.
- source_word: וּרְבוּ
  choice: multipliquem-se
  rationale: רבה, neste contexto, ordena o aumento em número; a forma pronominal é idiomática em português e combina naturalmente com “sejam fecundos”.
- source_word: וּמִלְאוּ
  choice: encham
  rationale: מלא significa encher; “encham a terra” comunica de modo simples e exato o alcance da ordem.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto universal da criação em Gênesis 1, אֶרֶץ designa a terra como mundo, não uma região territorial específica.
- source_word: וְכִבְשֻׁהָ
  choice: sujeitem-na
  rationale: כבש tem o sentido forte de pôr sob sujeição ou controle. “Sujeitem-na” conserva essa força sem acrescentar uma interpretação sobre como a autoridade deve ser exercida.
- source_word: וּרְדוּ
  choice: Dominem
  rationale: רדה descreve o exercício de governo ou domínio. “Dominem” é conciso, atual e mantém a força de autoridade presente no hebraico.
- source_word: בִּדְגַת הַיָּם
  choice: os peixes do mar
  rationale: A expressão construta menciona especificamente os peixes, e não genericamente toda forma de vida marinha.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: עוֹף pode abranger criaturas voadoras, mas “aves” é o equivalente contextual mais natural; “céu” é a forma corrente em português para הַשָּׁמַיִם neste quadro criado.
- source_word: בְכָל חַיָּה
  choice: todo ser vivo
  rationale: חַיָּה é um termo amplo para criatura ou animal vivo. “Todo ser vivo” mantém a abrangência e evita restringi-lo a feras selvagens.
- source_word: הָרֹמֶשֶׂת
  choice: que se move
  rationale: O particípio de רמש descreve movimento junto ao solo, frequentemente de animais pequenos. “Que se move” preserva a amplitude, enquanto a nota registra a alternativa mais específica.
theological_decisions:
- issue: Força do mandato humano em כבש e רדה
  choice: 'Manter a linguagem forte de sujeição e domínio: “sujeitem-na” e “dominem”.'
  alternative: “cuidem dela”, “sejam seus administradores” ou outra formulação centrada apenas em cuidado.
  rationale: Os verbos hebraicos exprimem mais que cuidado ou administração. A tradução conserva sua força sem transformar o mandato em licença para exploração nem inserir uma teologia de mordomia que não está lexicalmente expressa no versículo.
- issue: Alcance de הָאָרֶץ
  choice: Traduzir como “a terra”, com alcance universal.
  alternative: “a região” ou “o território”.
  rationale: O relato cósmico de Gênesis 1 aponta para o mundo criado, não para uma terra localizada; assim se preserva o caráter universal da incumbência humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação dos imperativos conserva o ritmo solene do hebraico. O segundo uso explícito de אֱלֹהִים foi representado por sujeito elíptico em “lhes disse”, recurso natural em português que não altera o referente. Os marcadores foram posicionados junto às palavras às quais suas alternativas se referem.
