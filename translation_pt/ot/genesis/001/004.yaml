id: GEN.1.4
reference: Genesis 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: pt
  text: E Deus viu que a luz era boa, e Deus separou[a] a luz das trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dividiu” ou “distinguiu”; o verbo hebraico pode expressar tanto a separação como a distinção entre duas coisas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O verbo ראה, na forma narrativa wayyiqtol, significa naturalmente “viu”; no contexto, inclui percepção avaliativa sem exigir uma explicitação adicional.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo apresenta concordância verbal singular neste contexto e designa o único Criador.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: É uma partícula que marca o objeto direto definido e não possui equivalente lexical necessário em português.
- source_word: הָאוֹר
  choice: a luz
  rationale: O artigo definido hebraico aponta para a luz mencionada no versículo anterior.
- source_word: כִּי
  choice: que
  rationale: 'Aqui introduz o conteúdo da percepção divina: Deus viu que a luz era boa.'
- source_word: טוֹב
  choice: boa
  rationale: Preserva o sentido avaliativo amplo de טוֹב e concorda naturalmente com “luz” em português.
- source_word: וַיַּבְדֵּל
  choice: separou
  rationale: בדל pode significar separar, dividir ou distinguir. “Separou” é claro, natural e mantém em aberto a natureza exata dessa separação.
- source_word: בֵּין ... וּבֵין
  choice: '... das ...'
  rationale: Após “separou”, a construção idiomática portuguesa “separou a luz das trevas” comunica naturalmente a relação expressa pela fórmula hebraica “entre... e entre...”.
- source_word: הַחֹשֶׁךְ
  choice: as trevas
  rationale: “As trevas” é a expressão portuguesa tradicional e corrente para a escuridão definida já mencionada no relato.
theological_decisions:
- issue: Repetição do sujeito אֱלֹהִים nas duas orações
  choice: 'Repetir “Deus”: “Deus viu... e Deus separou...”'
  alternative: 'Empregar pronome ou sujeito oculto na segunda oração: “e separou...”'
  rationale: O hebraico repete explicitamente o sujeito divino; conservar a repetição reproduz a cadência e a ênfase do texto sem acrescentar interpretação doutrinária.
- issue: Natureza da separação entre luz e trevas
  choice: Traduzir por “separou”, sem definir o mecanismo
  alternative: “dividiu” ou “fez distinção entre”
  rationale: O texto não esclarece se a separação é espacial, temporal ou conceitual. “Separou” preserva essa abertura cosmológica e teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Conserva-se a abertura com “E” e a repetição de “Deus” para refletir o ritmo narrativo hebraico. “Trevas” é corrente no registro bíblico e continua compreensível ao leitor comum.
