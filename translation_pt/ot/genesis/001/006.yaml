base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: pt
  text: 'E Deus disse: “Haja uma extensão[a] no meio das águas, e que ela separe umas águas das outras[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “firmamento”, “abóbada” ou “cúpula”. O hebraico רָקִיעַ refere-se a algo estendido; as traduções variam conforme o grau em que explicitam a concepção cosmológica antiga.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “separando entre águas e águas”, isto é, distinguindo um conjunto de águas de outro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E Deus disse
  rationale: O waw consecutivo dá continuidade à narrativa. “E Deus disse” conserva esse fluxo sem tornar a sequência temporal mais explícita do que o hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma plural, o substantivo rege aqui um verbo no singular e designa o único Criador.
- source_word: יְהִי
  choice: Haja
  rationale: O jussivo de היה expressa a ordem criadora divina; “Haja” reproduz de modo natural e solene essa força performativa.
- source_word: רָקִיעַ
  choice: expansão
  rationale: O termo designa algo estendido ou expandido. “Expansão” preserva essa imagem sem definir no texto principal uma reconstrução cosmológica específica.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Expressa a posição da expansão em meio às águas, em linguagem corrente e fiel ao sentido espacial.
- source_word: הַמָּיִם
  choice: as águas
  rationale: Mantém a forma plural e a imagem das águas primordiais tomadas coletivamente.
- source_word: וִיהִי מַבְדִּיל
  choice: e que ela separe
  rationale: Dá continuidade ao sentido jussivo e explicita, de maneira natural em português, que a expansão é o agente da separação.
- source_word: בֵּין מַיִם לָמָיִם
  choice: umas águas das outras
  rationale: É a forma idiomática em português de expressar a distinção entre dois conjuntos de águas; a construção hebraica mais literal é registrada em nota.
theological_decisions:
- issue: Sentido de רָקִיעַ em relação à cosmologia antiga
  choice: expansão
  alternative: firmamento, abóbada ou cúpula
  rationale: “Expansão” retém a noção de algo estendido sem impor no texto principal uma forma cosmológica específica. As alternativas mais concretas permanecem na nota porque o alcance exato do termo é discutido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação “Haja” conserva a solenidade tradicional sem soar arcaica; “umas águas das outras” evita uma construção literal pouco natural, documentada em nota.
