  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: pt
  text: 'E ele disse: “Não estenda a mão contra o rapaz nem lhe faça coisa alguma, pois agora sei que você teme a Deus, porque não reteve[a] de mim o seu filho, seu único filho[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não poupou”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu filho, seu único”; isto é, seu único filho neste contexto da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: estenda a mão contra
  rationale: Preserva de modo natural a imagem do idioma hebraico e deixa claro que se proíbe uma ação de violência contra o rapaz.
- source_word: הַנַּעַר
  choice: o rapaz
  rationale: נַעַר pode indicar menino, jovem ou rapaz. “Rapaz” mantém essa relativa amplitude etária e soa natural no contexto.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: lhe faça coisa alguma
  rationale: Expressa a proibição absoluta do hebraico em português claro e digno.
- source_word: עַתָּה יָדַעְתִּי
  choice: agora sei
  rationale: Reproduz diretamente a afirmação hebraica, sem explicar ou suavizar sua tensão teológica.
- source_word: יְרֵא אֱלֹהִים
  choice: você teme a Deus
  rationale: Mantém a formulação direta do hebraico; “temer” preserva a linguagem bíblica sem restringi-la apenas a reverência.
- source_word: חָשַׂכְתָּ
  choice: não reteve
  rationale: O verbo significa reter, não entregar ou poupar. “Não reteve” conserva a construção com “de mim” e evita interpretar além do texto.
- source_word: בִּנְךָ אֶת יְחִידְךָ
  choice: o seu filho, seu único filho
  rationale: A repetição de “filho” torna explícita e natural em português a aposição hebraica “seu filho, seu único”, preservando sua ênfase.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Representa diretamente a preposição hebraica e a ideia de não reter o filho de Deus.
theological_decisions:
- issue: Conhecimento divino antropomórfico em “agora sei”
  choice: Manter literalmente “agora sei”
  alternative: “agora vejo” ou “agora ficou demonstrado”
  rationale: O hebraico afirma diretamente “agora sei”. A tradução preserva a tensão teológica e não a resolve por paráfrase.
- issue: Sentido de “temer a Deus”
  choice: Preservar “teme a Deus”
  alternative: “reverencia a Deus” ou “é temente a Deus”
  rationale: “Teme” conserva a expressão do texto e sua amplitude sem impor uma explicação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea, sem coloquialismo excessivo. A construção “estenda a mão contra” mantém a imagem hebraica, enquanto “rapaz” preserva a amplitude possível de נַעַר.
