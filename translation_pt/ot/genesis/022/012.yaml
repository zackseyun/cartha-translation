  source_fidelity: 'A tradução reproduz com fidelidade os elementos centrais do hebraico: a proibição de agir violentamente contra o rapaz, a proibição abrangente de lhe fazer qualquer coisa, «agora sei», «teme a Deus» e a afirmação de que Abraão não reteve o filho de Deus. «Estenda a mão contra» preserva adequadamente o idiomatismo hebraico sem explicá-lo em excesso.'
