  terminology: «Teme a Deus» preserva a expressão bíblica sem reduzi-la a uma interpretação específica. «Seu filho, seu único filho» torna natural em português a aposição enfática hebraica e é apropriado no contexto narrativo. A nota sobre «não poupou» oferece uma alternativa lexical válida; a nota sobre «seu único» explica corretamente a forma hebraica.
