  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: pt
  text: que certamente o abençoarei e multiplicarei grandemente a sua descendência[a], como as estrelas dos céus e como a areia que está à beira do mar; e a sua descendência tomará posse da porta dos seus inimigos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua semente”. O termo é um coletivo singular que pode designar a descendência como um todo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “herdará a porta dos seus inimigos”. O hebraico mantém “descendência/semente” no singular e emprega, em “seus inimigos”, um sufixo singular referente a ela. A “porta” também representa o controle da cidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: que
  rationale: No contexto do juramento iniciado no versículo anterior, introduz o conteúdo da declaração divina; a ênfase recai também nas construções intensivas seguintes.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: certamente o abençoarei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente” comunica essa força em português natural.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: e multiplicarei grandemente
  rationale: A segunda construção com infinitivo absoluto também expressa intensidade. A formulação evita uma repetição pouco natural e conserva a ideia de enorme multiplicação.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: זֶרַע é um substantivo coletivo singular. “Descendência” mantém tanto o sentido coletivo quanto o número gramatical, ao contrário de uma pluralização explícita como “descendentes”.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: como as estrelas dos céus
  rationale: Conserva a comparação e o plural morfológico de שָׁמַיִם em linguagem elevada e compreensível.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: e como a areia que há à beira do mar
  rationale: Mantém a oração relativa אֲשֶׁר e traduz idiomaticamente שְׂפַת הַיָּם, literalmente a borda ou margem do mar.
- source_word: וְיִרַשׁ
  choice: tomará posse
  rationale: יָרַשׁ pode significar herdar, possuir ou tomar posse. Neste contexto de vitória sobre inimigos, “tomará posse” expressa melhor o domínio ativo.
- source_word: שַׁעַר
  choice: a porta
  rationale: Preserva a imagem concreta da porta da cidade, que por metonímia representa acesso, poder e controle sobre ela.
- source_word: אֹיְבָיו
  choice: dos seus inimigos
  rationale: O sufixo hebraico é singular e corresponde ao coletivo singular “descendência”. Em português, “seus” permite conservar a construção coletiva sem impor uma referência exclusivamente individual ou plural.
theological_decisions:
- issue: O singular coletivo de זֶרַע e o sufixo pronominal singular em אֹיְבָיו
  choice: “a sua descendência ... dos seus inimigos”
  alternative: “os seus descendentes ... dos inimigos deles”
  rationale: A tradução mantém “descendência” como coletivo singular e não resolve à força a tensão do hebraico entre uma posteridade coletiva e uma possível referência singular. Assim, evita restringir o texto a uma leitura exclusivamente plural ou exclusivamente individual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “o abençoarei” para Abraão e mantém a cadência solene da promessa. A formulação “que há à beira do mar” preserva a oração relativa hebraica sem soar excessivamente literal.
