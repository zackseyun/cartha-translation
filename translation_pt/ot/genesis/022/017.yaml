  terminology: '«Descendência» é uma boa solução para o coletivo singular. A nota b deve ser ajustada: em português, «seus» não marca inequivocamente um possuidor singular, de modo que não se deve afirmar que o sufixo singular hebraico esteja preservado formalmente nessa palavra portuguesa.'
