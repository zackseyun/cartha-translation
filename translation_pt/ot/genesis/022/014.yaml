base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: pt
  text: 'Abraão deu àquele lugar o nome de “O SENHOR proverá”[a], como se diz até hoje: “No monte do SENHOR se proverá”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, YHWH Yir’eh. Literalmente: “O SENHOR verá”. Neste contexto, o verbo “ver” pode também evocar o cuidado e a provisão divina.'
    reason: Preserva o sentido literal e o jogo de palavras hebraico que a tradução idiomática não reproduz diretamente.
  - marker: b
    text: 'Ou: “No monte do SENHOR será visto” ou “aparecerá”. O hebraico retoma o verbo “ver” da frase anterior, em forma passiva, e não explicita o referente daquele que será visto.'
    reason: Registra a passiva e a ambiguidade genuína da expressão, sem introduzir um pronome de referente indefinido nem impor uma interpretação.
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: O SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título SENHOR em versaletes, sem introduzir uma vocalização discutida no texto principal.
- source_word: יִרְאֶה (yirʾeh)
  choice: proverá
  rationale: A forma significa literalmente “verá”, mas, no contexto do carneiro que Deus torna disponível, comunica o sentido idiomático de cuidar/prover. A nota preserva o jogo lexical hebraico.
- source_word: יֵרָאֶה (yērāʾeh)
  choice: se proverá
  rationale: A forma passiva de ראה significa literalmente “será visto” ou “aparecerá”. A formulação tradicional e concisa “se proverá” mantém a ligação contextual com a provisão divina, enquanto a nota registra a leitura literal e a ambiguidade de sujeito.
- source_word: שֵׁם הַמָּקוֹם הַהוּא
  choice: àquele lugar o nome
  rationale: Expressa naturalmente em português a construção hebraica “chamou o nome daquele lugar”, sem perder seu sentido de atribuição de nome.
theological_decisions:
- issue: Relação entre o ato divino de ver e o de prover
  choice: Traduzir no texto principal como “proverá / se proverá”, com esclarecimento literal em notas
  alternative: “O SENHOR verá / no monte do SENHOR será visto”
  rationale: O contexto favorece a ideia de provisão, mas o hebraico cria deliberadamente um jogo com o verbo “ver”. As notas evitam apagar essa tensão lexical e permitem também a possibilidade de que o SENHOR seja visto ou apareça no monte.
- issue: Identificação do sujeito implícito na segunda frase
  choice: Manter a construção impessoal “se proverá”
  alternative: “Ele proverá” ou “o SENHOR será visto”
  rationale: O hebraico não explicita o sujeito de יֵרָאֶה. A construção portuguesa evita definir indevidamente se aquilo que se manifesta é a provisão ou se o próprio SENHOR é visto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Deu àquele lugar o nome” soa mais natural do que o calque “chamou o nome”. A repetição de “proverá / se proverá” reproduz, na medida do possível, o vínculo verbal do hebraico, enquanto as notas conservam seu jogo com “ver”.
