- from: 'Abraão deu àquele lugar o nome de “O SENHOR proverá”[a]. Por isso, até hoje se diz: “No monte do SENHOR se proverá”[b].'
  to: 'Abraão deu àquele lugar o nome de “O SENHOR proverá”[a], como se diz até hoje: “No monte do SENHOR se proverá”[b].'
  rationale: A revisão substitui um conector causal por uma formulação que corresponde mais de perto à expressão proverbial introduzida pelo hebraico. Também esclarece a nota sobre a forma passiva, mantendo a tradução tradicional ligada à provisão e preservando a ambiguidade textual quanto ao que ou quem será visto.
