review_pass:
  verdict: revise
  source_fidelity: A tradução principal preserva adequadamente a leitura contextual tradicional de יִרְאֶה como «proverá» e mantém, por meio das notas, o jogo verbal com «ver». Contudo, «Por isso» torna a ligação de אֲשֶׁר um pouco mais causal do que a formulação hebraica («como/que se diz até hoje»). A nota b também deve evitar o pronome «ele», cujo referente não está expresso no hebraico nem é claro em português.
  naturalness: «Abraão deu àquele lugar o nome» e «No monte do SENHOR se proverá» são naturais, claros e de registro apropriado. «Como se diz até hoje» é mais idiomático e mais próximo da relação entre as duas cláusulas do que «Por isso, até hoje se diz».
  terminology: «O SENHOR» é uma convenção portuguesa adequada para YHWH. «Proverá / se proverá» conserva a associação contextual, desde que as notas apresentem «ver» e a passiva de modo não dogmático. A explicação da nota a é ajustada para dizer que o contexto pode evocar provisão, sem afirmar que «ver» seja simplesmente um sinônimo lexical de «prover».
  issues:
  - severity: low
    issue: Conector «Por isso»
    rationale: אֲשֶׁר introduz a expressão corrente associada ao nome; «como se diz até hoje» representa melhor essa relação do que uma inferência causal explícita.
  - severity: medium
    issue: Pronome sem referente na nota b
    rationale: Em «ele será visto», «ele» não possui antecedente definido. A forma niphal יֵרָאֶה não identifica explicitamente o referente; a nota deve conservar essa indeterminação ou explicitar que «o SENHOR será visto» é apenas uma possibilidade interpretativa.
