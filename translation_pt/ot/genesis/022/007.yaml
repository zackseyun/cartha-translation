  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: pt
  text: 'Isaque disse a Abraão, seu pai: “Meu pai!” Abraão respondeu: “Aqui estou, meu filho.” Então Isaque disse: “Aqui estão o fogo e a lenha, mas onde está o animal do rebanho[a] para o holocausto?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar uma ovelha ou uma cabra, geralmente um animal pequeno do rebanho; não indica necessariamente um cordeiro.
    reason: Preservar a amplitude lexical de שֶׂה.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse / respondeu
  rationale: O verbo אמר significa “dizer”. Na segunda ocorrência, “respondeu” expressa naturalmente em português a função contextual da fala sem alterar seu conteúdo.
- source_word: אָבִיו
  choice: seu pai
  rationale: Preserva a relação de parentesco explicitada no hebraico e o registro solene da narrativa.
- source_word: אָבִי
  choice: Meu pai!
  rationale: O sufixo de primeira pessoa é mantido, e a pontuação comunica a força do chamado direto.
- source_word: הִנֶּנִי
  choice: Aqui estou
  rationale: Equivalente tradicional e natural da fórmula hebraica de prontidão e presença.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém o sufixo possessivo e o tom afetuoso da resposta.
- source_word: הִנֵּה
  choice: Aqui estão
  rationale: Chama a atenção para os elementos presentes e visíveis, de modo idiomático em português.
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: o fogo e a lenha
  rationale: “Lenha” traduz naturalmente o plural hebraico עֵצִים no contexto de uma oferta queimada.
- source_word: אַיֵּה
  choice: onde está
  rationale: Reproduz diretamente a pergunta de localização.
- source_word: הַשֶּׂה
  choice: o animal do rebanho
  rationale: שֶׂה designa um animal pequeno do rebanho e pode referir-se tanto a uma ovelha quanto a uma cabra; a formulação evita restringir indevidamente o referente a um cordeiro.
- source_word: לְעֹלָה
  choice: para o holocausto
  rationale: “Holocausto” é o termo bíblico português corrente para a oferta inteiramente queimada, e a preposição “para” corresponde naturalmente à função indicada por לְ.
theological_decisions:
- issue: Identidade do animal sacrificial em הַשֶּׂה
  choice: o animal do rebanho
  alternative: o cordeiro / a ovelha
  rationale: O hebraico não especifica idade e pode abranger ovino ou caprino. A tradução conserva essa amplitude lexical e evita antecipar uma identificação teológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Os nomes dos falantes foram repetidos onde isso evita uma sequência pouco natural de pronomes em português. “Então” marca a retomada da fala de Isaque sem acrescentar conteúdo interpretativo relevante.
