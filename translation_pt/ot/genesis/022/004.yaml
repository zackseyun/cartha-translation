lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: Reproduz diretamente a expressão temporal hebraica, sem acrescentar «da viagem», que não está explícito no texto.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: ergueu os olhos
  rationale: Preserva o idioma hebraico e seu estilo narrativo em uma formulação natural e digna em português.
- source_word: וַיַּרְא
  choice: e viu
  rationale: Expressa a sequência narrativa do verbo hebraico; não é necessário repetir o pronome porque Abraão já é o sujeito explícito.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Mantém o substantivo comum e definido do hebraico, sem explicitar além do texto que se trata do destino indicado por Deus.
- source_word: מֵרָחֹק
  choice: de longe
  rationale: Equivalente português conciso e natural para a expressão adverbial de distância; «a distância» também é possível.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
