base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: pt
  text: Então Abraão ergueu os olhos e viu; e eis que, atrás dele[a], havia um carneiro preso pelos chifres no meio do matagal. Abraão foi, pegou o carneiro e o ofereceu como holocausto em vez de seu filho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou apenas “atrás”; o hebraico não traz aqui um pronome explícito equivalente a “dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lugar de seu filho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו וַיַּרְא
  choice: ergueu os olhos e viu
  rationale: Preserva o gesto expresso pelo idioma hebraico e mantém a sequência narrativa, em português natural, sem reduzir os dois verbos a uma única ação.
- source_word: וְהִנֵּה
  choice: viu que ... havia
  rationale: A construção chama a atenção para a descoberta inesperada. Em português corrente, a estrutura com “viu que ... havia” comunica essa função sem exigir o arcaísmo “eis”.
- source_word: אַיִל
  choice: carneiro
  rationale: É o equivalente português preciso e usual para um ovino macho adulto, apropriado ao contexto sacrificial.
- source_word: אַחַר
  choice: atrás dele
  rationale: Neste contexto, o termo é entendido como advérbio de lugar. O pronome torna a relação espacial clara em português, embora não esteja expresso separadamente no texto hebraico.
- source_word: נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו
  choice: preso pelos chifres no meio do matagal
  rationale: Comunica o estado resultante do animal enredado na vegetação e indica com clareza que os chifres eram o ponto pelo qual estava preso.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: o ofereceu como holocausto
  rationale: No contexto sacrificial, a combinação verbal designa a apresentação do animal como oferta inteiramente queimada; “holocausto” é a forma bíblica consagrada e ainda inteligível em português.
- source_word: תַּחַת בְּנוֹ
  choice: em vez de seu filho
  rationale: Expressa diretamente o valor substitutivo da preposição neste contexto, sem acrescentar uma elaboração doutrinária posterior.
theological_decisions:
- issue: Valor substitutivo de תַּחַת בְּנוֹ
  choice: em vez de seu filho
  alternative: no lugar de seu filho
  rationale: As duas formulações preservam a substituição narrativa. “Em vez de” é clara e natural, sem extrapolar o que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para evitar ambiguidade sobre o ponto em que o carneiro estava preso. “Holocausto” conserva o termo sacrificial tradicional, enquanto o restante da frase evita sintaxe excessivamente arcaica.
