lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Quésede
  rationale: Nome próprio transliterado segundo convenções portuguesas, com acento gráfico para indicar a sílaba tônica e vogal final de apoio para facilitar a leitura.
- source_word: חֲזוֹ
  choice: Hazo
  rationale: Nome próprio transliterado de modo claro e próximo da forma hebraica; preserva-se o h inicial tradicional.
- source_word: פִּלְדָּשׁ
  choice: Pildás
  rationale: Transliteração portuguesa do nome próprio, usando s final para o som de שׁ e acento para assinalar a tonicidade.
- source_word: יִדְלָף
  choice: Jidlafe
  rationale: Forma adaptada à tradição bíblica portuguesa, com J para o yod inicial e vogal de apoio após a consoante final.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Forma consagrada e amplamente reconhecida em português.
- source_word: וְאֶת / וְאֵת
  choice: e
  rationale: O marcador de objeto direto אֵת não é traduzido; a coordenação repetida por וְ é apresentada naturalmente com vírgulas e um e antes do último nome.
