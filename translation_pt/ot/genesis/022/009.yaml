  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: pt
  text: Então chegaram ao lugar que Deus lhe havia indicado[a]. Ali Abraão construiu o altar[b] e pôs a lenha em ordem. Amarrou Isaque, seu filho, e o colocou sobre o altar, em cima da lenha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao lugar de que Deus lhe havia falado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um altar”. O hebraico traz “o altar”, possivelmente apresentando a estrutura como o altar específico preparado para esse sacrifício.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “acima da lenha”, isto é, em cima da lenha que havia sido disposta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: A forma narrativa faz a ação avançar em sequência; “Então” expressa essa progressão com naturalidade, e o verbo no plural preserva a referência a Abraão e Isaque.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: que Deus lhe havia indicado
  rationale: No contexto, אמר com objeto indireto remete à instrução anterior de Deus acerca do lugar. “Havia indicado” comunica essa referência de modo idiomático, sem especificar além do necessário como a indicação foi dada.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: Ali Abraão construiu o altar
  rationale: Preserva o artigo definido do hebraico e apresenta a estrutura como o altar específico preparado para o sacrifício.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: e pôs a lenha em ordem
  rationale: ערך indica dispor ou ordenar, especialmente em contexto sacrificial. A expressão é clara e mantém a ideia de preparação deliberada.
- source_word: וַיַּעֲקֹד
  choice: Amarrou
  rationale: עקד designa o ato de atar. “Amarrou” é direto e natural em português, preservando a gravidade da ação sem acrescentar detalhes.
- source_word: יִצְחָק בְּנוֹ
  choice: seu filho Isaque
  rationale: A ordem escolhida é mais natural em português e conserva explicitamente a relação filial destacada no hebraico.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: e o colocou sobre o altar
  rationale: שׂים é um verbo amplo de colocação; “colocou” evita interpretar indevidamente a maneira do movimento.
- source_word: מִמַּעַל לָעֵצִים
  choice: em cima da lenha
  rationale: Expressa com clareza a posição de Isaque acima da lenha já disposta.
theological_decisions:
- issue: Especificidade da estrutura sacrificial
  choice: o altar
  alternative: um altar
  rationale: O substantivo hebraico tem artigo definido. A tradução conserva essa marca sem acrescentar simbolismo teológico posterior.
- issue: Descrição do ato de atar Isaque
  choice: Amarrou seu filho Isaque
  alternative: Atou seu filho Isaque
  rationale: “Amarrou” preserva o sentido lexical de עקד em português corrente e não suaviza nem amplia a ação narrada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o ritmo narrativo do hebraico sem reproduzir mecanicamente sua cadeia de conjunções. Todos os marcadores de nota aparecem no texto principal.
