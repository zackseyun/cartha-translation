base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: pt
  text: 'E Abraão respondeu: “Deus proverá para si o cordeiro para o holocausto, meu filho.”[a] E os dois seguiram juntos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Deus verá para si o cordeiro para o holocausto”. O verbo hebraico pode significar “ver” ou, como expressão idiomática neste contexto, “prover”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E Abraão respondeu
  rationale: A forma narrativa introduz a fala de Abraão em resposta à pergunta de Isaque; “respondeu” é natural em português e explicita apenas a relação discursiva imediata.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente corrente e adequado para o termo hebraico neste contexto.
- source_word: יִרְאֶה לּוֹ
  choice: proverá para si
  rationale: Embora ראה signifique literalmente “ver”, aqui a expressão tem o sentido idiomático de cuidar da provisão. “Para si” preserva o pronome dativo לּוֹ e a ideia de que Deus providenciará o que requer.
- source_word: הַשֶּׂה
  choice: o cordeiro
  rationale: שֶׂה designa um animal de pequeno rebanho, ovelha ou cabra, muitas vezes jovem. “Cordeiro” é natural no contexto sacrificial e retoma a pergunta anterior de Isaque.
- source_word: לְעֹלָה
  choice: para o holocausto
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e ainda inteligível em português.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o vocativo familiar e afetuoso de Abraão.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: E os dois seguiram juntos
  rationale: Mantém a repetição enfática dos dois caminhando em união e soa natural na progressão narrativa em português.
theological_decisions:
- issue: Sentido da declaração de Abraão sobre a ação de Deus
  choice: Deus proverá para si o cordeiro
  alternative: Deus verá para si o cordeiro; Deus cuidará de providenciar o cordeiro
  rationale: A tradução comunica o sentido idiomático provável sem decidir se Abraão fala de modo evasivo, profético ou de ambas as maneiras. A nota preserva o sentido literal e a ambiguidade lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o fluxo narrativo e a tensão do episódio; o marcador da nota aparece após toda a fala para não interromper o vocativo.
