source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: pt
  text: 'Mas o anjo[a] de Yahweh o chamou do céu[b] e disse: “Abraão, Abraão!” E ele disse: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro de Yahweh”. A palavra hebraica מַלְאָךְ pode significar tanto “mensageiro” quanto “anjo”; aqui, a procedência celestial favorece “anjo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dos céus”. “Do céu” expressa a mesma ideia de modo natural neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: o chamou
  rationale: קרא com אֶל indica dirigir um chamado vocal a alguém. “O chamou” é direto e natural em português, sem acrescentar uma intensidade que o hebraico não explicita.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode designar um mensageiro humano ou celestial; neste contexto, em que a voz vem do céu, “anjo” é a opção mais natural. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִן הַשָּׁמַיִם
  choice: do céu
  rationale: Embora שָׁמַיִם tenha forma plural, “do céu” expressa de modo idiomático em português a procedência celestial da voz.
- source_word: וַיֹּאמֶר
  choice: disse / respondeu
  rationale: Na primeira ocorrência, “disse” traduz diretamente אָמַר. Na segunda, “respondeu” torna explícita em português a função da fala de Abraão no diálogo, sem alterar seu conteúdo.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abraão, Abraão!
  rationale: A repetição do nome é preservada; o ponto de exclamação comunica a urgência do chamado.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: É a fórmula hebraica convencional pela qual alguém declara presença, atenção e prontidão; “Aqui estou” é sua correspondência portuguesa natural.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh; uma manifestação do próprio Yahweh
  rationale: A tradução mantém a designação textual sem identificar interpretativamente o personagem com o próprio Yahweh. A alternativa lexical “mensageiro” é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa e a repetição enfática do nome foram preservadas; “Mas” comunica a interrupção contrastiva no momento culminante da cena.
