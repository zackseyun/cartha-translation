base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: pt
  text: 'E ele disse: “Por favor, tome seu filho, seu único[a], a quem você ama — Isaque —, vá para a terra de Moriá e ofereça-o ali como holocausto, sobre um dos montes que eu lhe disser.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu único filho”. O hebraico יְחִידְךָ pode destacar alguém único ou singular; aqui ressalta a condição especial de Isaque na ordem dada a Abraão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: Por favor
  rationale: A partícula suaviza o imperativo com tom de pedido ou insistência; “por favor” comunica essa força em português atual sem sugerir valor temporal.
- source_word: בִּנְךָ
  choice: seu filho
  rationale: Equivalente direto e natural de בֵּן com sufixo de segunda pessoa masculina singular.
- source_word: יְחִידְךָ
  choice: seu único
  rationale: Preserva a ideia de singularidade e o vínculo enfático de Isaque sem afirmar de modo simplista que Abraão não tinha outro filho; a identificação posterior por “Isaque” torna o referente claro.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: a quem você ama
  rationale: O perfeito hebraico descreve aqui um amor conhecido e contínuo; o presente é a forma mais natural em português.
- source_word: וְלֶךְ לְךָ
  choice: vá
  rationale: O imperativo simples expressa naturalmente o idioma hebraico; expansões como “vá você mesmo” poderiam acrescentar uma ênfase indevida.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: a terra de Moriá
  rationale: Tradução direta e tradicional, mantendo אֶרֶץ como “terra” e o topônimo Moriá.
- source_word: וְהַעֲלֵהוּ
  choice: ofereça-o
  rationale: No contexto sacrificial, o hifil de עלה significa apresentar ou oferecer em sacrifício.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: עֹלָה é o termo sacrificial para a oferta inteiramente queimada; “holocausto” é a designação bíblica consagrada e concisa em português.
- source_word: עַל אַחַד הֶהָרִים
  choice: sobre um dos montes
  rationale: Mantém a referência a um monte ainda não especificado dentre vários; “monte” é natural no registro bíblico português.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: que eu lhe indicar
  rationale: Embora אמר seja literalmente “dizer”, neste contexto “indicar” expressa em português natural que Deus posteriormente identificará verbalmente o monte, sem adotar o verbo distinto “mostrar”.
theological_decisions:
- issue: Sentido de יְחִידְךָ aplicado a Isaque apesar da existência de Ismael
  choice: seu único
  alternative: seu único filho; seu filho singular
  rationale: A formulação destaca a condição singular de Isaque no relacionamento e na promessa, sem resolver se a ênfase é biológica, pactual ou afetiva. A alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e legibilidade brasileira. Mantém “Moriá”, “Isaque” e o termo sacrificial tradicional “holocausto”. O marcador [a] aparece imediatamente após a expressão anotada.
