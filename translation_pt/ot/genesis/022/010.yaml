  naturalness: “Então Abraão estendeu a mão, pegou a faca para degolar seu filho” é português moderno, claro e de registro narrativo sóbrio. “Degolar” é forte, mas corresponde à gravidade concreta do verbo no contexto e evita a paráfrase interpretativa.
  terminology: “Faca” é apropriado para הַמַּאֲכֶלֶת. “Degolar” preserva melhor a especificidade de שָׁחַט do que “sacrificar”, que exprime sobretudo o enquadramento ritual e não o ato verbalmente indicado. A nota deve evitar afirmar que o verbo necessariamente descreve o corte da garganta como definição técnica em todos os usos.
