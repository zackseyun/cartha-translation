  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: pt
  text: Então Abraão estendeu a mão, pegou a faca para degolar seu filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico aqui traduzido “degolar” é mais específico que um verbo geral para “matar” e é usado com frequência para o abate de animais, inclusive em contextos sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: estendeu
  rationale: No contexto, o verbo descreve o ato concreto de estender a mão; esta é uma expressão natural em português e não sugere o sentido de enviar.
- source_word: יָדוֹ
  choice: a mão
  rationale: Tradução direta do substantivo singular com sufixo possessivo; o possuidor já está claro em português pelo sujeito Abraão.
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Expressa naturalmente a ação narrativa de tomar a faca, sem acrescentar a ideia mais intensa de agarrá-la.
- source_word: הַמַּאֲכֶלֶת
  choice: a faca
  rationale: Designa um instrumento cortante associado ao abate; 'faca' é o equivalente mais claro e idiomático no fluxo narrativo.
- source_word: לִשְׁחֹט
  choice: se preparou para sacrificar
  rationale: Em português corrente, a tradução mecanicamente literal 'para degolar' pode concentrar-se no método, enquanto 'sacrificar' comunica o propósito ritual salientado pelo contexto. A nota registra o sentido lexical mais específico do verbo.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Tradução direta e natural do substantivo com sufixo possessivo.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; 'Então' comunica com clareza a sequência dos acontecimentos.
theological_decisions:
- issue: Como traduzir שָׁחַט sem perder sua especificidade nem impor uma conclusão teológica posterior
  choice: se preparou para sacrificar
  alternative: para degolar / para abater
  rationale: O contexto é explicitamente sacrificial, e a formulação escolhida preserva essa carga em português natural. Ao mesmo tempo, a nota explica que o verbo hebraico descreve mais especificamente o abate pela garganta, evitando ocultar sua força concreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sequência curta de ações mantém a tensão narrativa. Evitou-se linguagem arcaica como 'imolar', mas uma nota preserva a precisão concreta do verbo hebraico.
