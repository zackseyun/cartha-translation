  - severity: medium
    issue: “sacrificar” torna explícita como tradução principal uma dimensão contextual que o verbo שָׁחַט não codifica por si só.
    rationale: O contexto é sacrificial, mas o verbo designa o abate/degola. A tradução principal deve manter a ação concreta; a associação sacrificial pode ser explicada em nota.
  - severity: medium
    issue: A nota afirma que o verbo descreve especificamente o abate pela garganta.
    rationale: Embora “degolar” seja uma boa equivalência contextual, essa formulação lexical é excessivamente restritiva como explicação geral do verbo. A nota deve descrever seu contraste com um verbo genérico para “matar” e seu uso frequente para abate.
