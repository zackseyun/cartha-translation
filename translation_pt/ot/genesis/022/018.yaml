  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: pt
  text: E em sua descendência serão abençoadas[a] todas as nações da terra, porque você obedeceu à minha voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abençoarão a si mesmas”. O verbo hebraico também pode ser entendido em sentido reflexivo aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: serão abençoadas
  rationale: O hitpael de ברך na fórmula da promessa patriarcal admite sentido passivo ou reflexivo. A formulação passiva é natural em português e se ajusta ao contexto promissório; a leitura reflexiva é preservada em nota.
- source_word: בְזַרְעֲךָ
  choice: em sua descendência
  rationale: זֶרַע é um substantivo coletivo que pode abranger descendência ou descendentes. “Descendência” conserva esse valor coletivo, enquanto “em” reproduz a preposição ב sem impor um sentido estritamente instrumental.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: todas as nações da terra
  rationale: Tradução direta e idiomática que preserva tanto o sentido usual de גּוֹיִם quanto o alcance universal da expressão.
- source_word: עֵקֶב אֲשֶׁר
  choice: porque
  rationale: A expressão introduz a razão para a reafirmação da promessa; “porque” comunica essa relação causal de forma clara e concisa.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: você obedeceu à minha voz
  rationale: O idioma hebraico שׁמע בקול denota ouvir com resposta obediente. A tradução mantém “minha voz”, preservando a imagem do original, e explicita a força de obediência.
theological_decisions:
- issue: Sentido do hitpael de ברך na promessa abraâmica
  choice: 'As nações recebem bênção na descendência de Abraão: “serão abençoadas”.'
  alternative: 'As nações usarão a descendência de Abraão em uma fórmula de bênção para si mesmas: “abençoarão a si mesmas”.'
  rationale: O contexto da aliança favorece o sentido passivo ou resultativo, sem especificar como a promessa se cumpre. Como a forma hebraica também pode ser entendida reflexivamente, essa possibilidade é mantida em nota para preservar a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” corresponde ao singular do hebraico e evita formas regionais ou excessivamente solenes; “descendência” preserva o caráter coletivo do termo original.
