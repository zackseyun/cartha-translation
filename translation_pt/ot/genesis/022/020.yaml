  source_fidelity: A estrutura temporal e a relação familiar estão corretas, mas “Abraão recebeu esta notícia” reformula de modo mais livre o passivo “foi comunicado a Abraão” e acrescenta “esta”. Além disso, o marcador הִנֵּה fica sem expressão explícita. A revisão conserva a construção de comunicação e traduz o destaque informativo.
