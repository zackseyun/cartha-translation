  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: pt
  text: 'Depois dessas coisas, foi comunicado a Abraão: “Eis que Milca também deu à luz filhos a Naor, seu irmão:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Reproduz a transição temporal hebraica sem acrescentar um equivalente artificial para וַיְהִי como marcador discursivo.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: Abraão recebeu esta notícia
  rationale: Expressa em português natural a construção passiva seguida de לֵאמֹר, preparando adequadamente a fala direta.
- source_word: הִנֵּה
  choice: '[incorporado em “esta notícia” e nos dois-pontos]'
  rationale: Neste contexto, introduz a informação notável comunicada a Abraão; traduzi-lo separadamente por “eis que” ou “olhe” seria menos natural em português.
- source_word: יָלְדָה ... בָּנִים
  choice: deu filhos
  rationale: Preserva a formulação relacional do hebraico — Milca deu à luz filhos para Naor — sem sugerir apenas o ato físico do parto.
- source_word: לְנָחוֹר אָחִיךָ
  choice: a Naor, seu irmão
  rationale: Mantém a relação expressa por לְ e a referência de segunda pessoa dirigida a Abraão.
