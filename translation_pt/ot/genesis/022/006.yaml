  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: pt
  text: Então Abraão pegou a lenha para o holocausto e a colocou sobre Isaque, seu filho. Tomou em sua mão o fogo e a faca, e os dois seguiram juntos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: a lenha para o holocausto
  rationale: O construto hebraico é literalmente “a lenha do holocausto”, mas “para o holocausto” expressa em português natural a finalidade da lenha; “holocausto” conserva a categoria sacrificial da oferta inteiramente queimada.
- source_word: וַיָּשֶׂם עַל
  choice: a colocou sobre
  rationale: שׂים com עַל indica pôr ou colocar algo sobre alguém; a formulação mantém a imagem física da carga sem soar artificial.
- source_word: יִצְחָק בְּנוֹ
  choice: seu filho Isaque
  rationale: A ordem é ajustada ao português corrente, preservando tanto o nome quanto a identificação explícita de Isaque como filho de Abraão.
- source_word: בְּיָדוֹ
  choice: nas mãos
  rationale: Embora o hebraico use o singular, “tomou nas mãos” é uma expressão idiomática natural em português para aquilo que a pessoa passa a carregar consigo.
- source_word: הָאֵשׁ
  choice: o fogo
  rationale: O texto especifica apenas “o fogo”; não se acrescenta recipiente, braseiro ou outro meio não declarado.
- source_word: הַמַּאֲכֶלֶת
  choice: a faca
  rationale: O substantivo pode designar uma faca de abate, mas “a faca” é claro e natural, enquanto o contexto fornece a associação sacrificial.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: os dois seguiram juntos
  rationale: A formulação preserva a referência enfática ao par e o movimento continuado da narrativa; “seguiram” traduz naturalmente הלך neste contexto.
theological_decisions:
- issue: Terminologia sacrificial de עֹלָה
  choice: holocausto
  alternative: oferta queimada; oferta de ascensão
  rationale: Neste contexto, עֹלָה é o termo estabelecido para a oferta inteiramente consumida pelo fogo. “Holocausto” é a designação bíblica tradicional e reconhecível em português, sem desenvolver implicações além da categoria ritual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A divisão em duas frases evita uma coordenação excessivamente longa. Não foram incluídas notas porque as alternativas não são necessárias para representar uma ambiguidade relevante do hebraico neste versículo.
