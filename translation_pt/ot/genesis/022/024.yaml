base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: pt
  text: E sua concubina, que se chamava Reumá, também deu à luz Tebá, Gaã, Taás e Maacá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: E sua concubina
  rationale: פִּילֶגֶשׁ designa uma concubina ou esposa secundária. “Concubina” é a equivalência tradicional, concisa e inteligível em português, preservando a distinção social indicada pelo hebraico; o וּ inicial é traduzido por “E”.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: que se chamava Reumá
  rationale: A forma hebraica é literalmente coordenada, “e o nome dela [era] Reumá”. Em português, “que se chamava Reumá” relaciona naturalmente o nome à mulher mencionada sem alterar o sentido.
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: Neste contexto genealógico, ילד significa dar à luz ou gerar como mãe. “Deu à luz” é natural, claro e evita o possível estranhamento de “deu à luz a” diante de uma lista de nomes.
- source_word: גַּם הִוא
  choice: também
  rationale: A expressão enfatiza que Reumá, além de Milca, teve filhos. “Também” comunica essa relação de modo idiomático; o sujeito feminino permanece claro pelo contexto.
- source_word: טֶבַח וְגַחַם וְתַחַשׁ וְמַעֲכָה
  choice: Tebá, Gaã, Taás e Maacá
  rationale: Os nomes próprios são transliterados em formas adequadas à fonologia e à ortografia portuguesa, e a sequência é apresentada com pontuação natural.
