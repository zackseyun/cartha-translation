  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: pt
  text: E Betuel gerou Rebeca. Estes oito foram os que Milca deu à luz a Naor, irmão de Abraão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: E Betuel
  rationale: O וּ dá continuidade à genealogia e é traduzido naturalmente por “E”; o nome segue a forma portuguesa consagrada “Betuel”.
- source_word: יָלַד
  choice: gerou
  rationale: Com sujeito masculino em contexto genealógico, “gerou” é conciso, corrente no registro bíblico e corresponde ao sentido de tornar-se pai.
- source_word: אֶת רִבְקָה
  choice: Rebeca
  rationale: A marca de objeto direto אֶת não recebe tradução; “Rebeca” é a forma portuguesa consagrada do nome.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Esses foram os oito filhos
  rationale: A construção hebraica enfatiza o total de oito pessoas mencionadas. “Filhos” é explicitado pelo contexto para produzir português claro e natural.
- source_word: יָלְדָה
  choice: deu
  rationale: Na expressão “filhos que Milca deu a Naor”, traduz idiomaticamente o parto materno sem recorrer ao pouco natural “deu à luz ... a Naor”.
- source_word: מִלְכָּה
  choice: Milca
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: לְנָחוֹר
  choice: a Naor
  rationale: A preposição לְ na fórmula genealógica indica a relação com o pai; “deu a Naor” conserva essa relação em português natural.
- source_word: אֲחִי אַבְרָהָם
  choice: irmão de Abraão
  rationale: Reproduz com clareza a relação expressa pela cadeia construta hebraica e identifica Naor por aposição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas consagradas no uso bíblico lusófono. A segunda frase foi levemente explicitada com “foram” e “filhos” para evitar uma construção truncada, preservando a ênfase hebraica no total de oito.
