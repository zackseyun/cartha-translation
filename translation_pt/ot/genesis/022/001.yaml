base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: pt
  text: 'Depois dessas coisas, Deus pôs Abraão à prova e lhe disse: “Abraão!” Ele respondeu: “Aqui estou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: A expressão introduz uma nova etapa da narrativa e mantém a ligação temporal ampla com o contexto anterior. Em português atual, a fórmula dispensa a tradução explícita de וַיְהִי.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: No contexto, o termo designa o Deus de Israel; o artigo hebraico não precisa ser reproduzido em português.
- source_word: נִסָּה
  choice: pôs ... à prova
  rationale: O piel de נסה indica testar ou provar. A locução é natural em português e não sugere indução ao mal, como poderia ocorrer com 'tentou'.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe disse
  rationale: Equivalente idiomático e fiel de אמר seguido do objeto indireto.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: A expressão comunica presença atenta e disponibilidade para responder, em linguagem portuguesa natural e consagrada.
theological_decisions:
- issue: Sentido de נסה tendo Deus como sujeito
  choice: Deus pôs Abraão à prova
  alternative: Deus tentou Abraão
  rationale: Neste contexto, o verbo apresenta uma prova de Abraão, não uma incitação ao mal. A tradução preserva a tensão da narrativa sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi preservada sem recorrer a fórmulas arcaicas como 'aconteceu que' ou 'e sucedeu'.
