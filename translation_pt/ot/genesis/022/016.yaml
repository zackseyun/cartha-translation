  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: pt
  text: 'e disse: “Jurei por mim mesmo — declaração de Yahweh —, porque você fez isso e não reteve[a] seu filho, seu único filho[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não poupou” ou “não recusou entregar”. O verbo hebraico pode significar reter, poupar ou recusar entregar.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu filho único”. O termo hebraico pode indicar alguém único ou singular, não necessariamente o único filho em sentido biológico absoluto.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: O verbo com waw consecutivo dá continuidade à narrativa; o sujeito pode permanecer implícito em português, pois é claro no contexto.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Jurei por mim mesmo
  rationale: A fórmula de juramento indica que Yahweh jura por sua própria pessoa. O perfeito hebraico apresenta o juramento como realizado e vigente.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: נְאֻם introduz um pronunciamento divino solene; a construção nominal preserva seu caráter formular, e o nome divino é transliterado como Yahweh.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: porque
  rationale: A sequência hebraica expressa causa enfática. Em português, “porque” comunica essa relação sem redundância artificial.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: você fez isso
  rationale: Neste contexto, הַדָּבָר הַזֶּה se refere ao ato que Abraão acaba de realizar. “Fez isso” é claro e natural em português atual.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: e não reteve
  rationale: חָשַׂךְ significa reter ou não entregar. “Não reteve” conserva a imagem lexical sem impor a nuance mais interpretativa de “não poupou”.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: seu filho, seu único filho
  rationale: A repetição de “filho” torna a aposição clara e natural em português. יָחִיד descreve Isaque como filho único ou singular no contexto, sem acrescentar explicitamente a ideia secundária de “amado”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva sua função como nome pessoal e evita substituí-lo por “SENHOR”.
- issue: Sentido de יְחִידְךָ aplicado a Isaque
  choice: seu único filho
  alternative: seu filho único; seu filho singular; seu único
  rationale: 'A tradução mantém a tensão do relato: Isaque não é o único filho biológico de Abraão, mas é apresentado como único em sentido particular no contexto da promessa. Não se acrescenta “amado”, embora essa nuance possa estar associada ao termo em outros contextos.'
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe narrativa direta. “Você” oferece ampla legibilidade brasileira sem recorrer a linguagem coloquial. Os travessões destacam a fórmula solene “declaração de Yahweh”. O trecho permanece aberto porque o versículo continua no seguinte.
