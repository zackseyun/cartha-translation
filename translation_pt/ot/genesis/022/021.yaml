  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: pt
  text: Uz, seu primogênito; Buz, irmão de Uz; e Quemuel, pai de Arã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ancestral de Arã”. Em genealogias, “pai” às vezes pode designar um antepassado ou fundador, e não necessariamente o genitor imediato.
    reason: alternativa lexical
lexical_decisions:
- source_word: ע֥וּץ
  choice: Uz
  rationale: Nome próprio transliterado conforme a forma tradicional e amplamente reconhecida em português.
- source_word: בְּכֹר֖וֹ
  choice: seu primogênito
  rationale: Preserva o sentido de primeiro filho na ordem de nascimento e a possível conotação de posição familiar.
- source_word: בּ֣וּז
  choice: Buz
  rationale: Nome próprio transliterado conforme a forma tradicional em português.
- source_word: אָחִ֑יו
  choice: irmão dele
  rationale: O sufixo masculino singular remete a Naor no contexto genealógico; “dele” evita que “seu” pareça referir-se a Uz.
- source_word: קְמוּאֵ֖ל
  choice: Quemuel
  rationale: Forma convencional em português para o nome próprio hebraico.
- source_word: אֲבִ֥י
  choice: pai de
  rationale: É a correspondência mais direta; em genealogias, o termo também pode indicar um ancestral ou progenitor, possibilidade registrada em nota.
- source_word: אֲרָֽם
  choice: Arã
  rationale: Forma tradicional portuguesa do nome próprio, sem acrescentar uma identificação étnica ou territorial que o texto não explicita.
theological_decisions:
- issue: Sentido genealógico de אֲבִי אֲרָם
  choice: Quemuel, pai de Arã
  alternative: Quemuel, ancestral de Arã
  rationale: A expressão hebraica significa diretamente “pai de Arã”, mas o uso genealógico pode ser mais amplo. O texto principal conserva a leitura formal, e a nota mantém aberta a possibilidade de ancestralidade ou fundação sem impor essa interpretação.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas usuais no Brasil e compreensíveis internacionalmente. Empregou-se “irmão dele” para eliminar a ambiguidade referencial que “seu irmão” criaria em português. O marcador da nota foi colocado após “Arã”, expressão à qual a alternativa lexical efetivamente se refere.
