base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: pt
  text: Então Abraão voltou para junto dos seus jovens[a]. Eles se levantaram e foram juntos para Berseba, e Abraão morou em Berseba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Abraão voltou para junto dos seus jovens”. Isaque não é mencionado nesta oração, embora esteja presente na narrativa anterior.'
    reason: Preserva a omissão explícita de Isaque e a consequente tensão narrativa sem resolvê-la no texto principal.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O qal de שׁוב nesta sequência narrativa significa naturalmente “voltar”; a forma simples e direta preserva o movimento de retorno.
- source_word: נְעָרָיו
  choice: seus jovens
  rationale: נַעַר pode designar jovem, servo ou ajudante. “Seus jovens” conserva a expressão hebraica sem especificar além do texto, embora o contexto mostre que eram os acompanhantes de Abraão.
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: קום marca aqui o início da ação seguinte. “Se levantaram” é atual, digno e mais natural em português do que uma reprodução rígida da construção hebraica.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: foram juntos
  rationale: A combinação de הלך com יַחְדָּו exprime deslocamento conjunto; “foram juntos” preserva isso sem acrescentar o modo de locomoção.
- source_word: בְּאֵר שָׁבַע
  choice: Berseba
  rationale: Emprega-se a forma tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: וַיֵּשֶׁב
  choice: ficou morando
  rationale: ישׁב pode significar sentar-se, permanecer ou habitar. Neste contexto geográfico, “ficou morando” comunica permanência residencial sem o tom arcaico de “habitou” nem a possível implicação de fundação presente em “se estabeleceu”.
theological_decisions:
- issue: Somente Abraão é explicitamente mencionado como tendo voltado do monte, embora Isaque apareça na narrativa anterior.
  choice: Manter apenas Abraão como sujeito expresso, sem acrescentar Isaque ao texto principal.
  alternative: Explicitar que Isaque também voltou com Abraão, entendendo que o narrador apenas focaliza Abraão.
  rationale: O hebraico declara que Abraão voltou para junto dos jovens e não menciona Isaque nesta oração. A tradução preserva essa tensão narrativa sem harmonizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação divide a longa cadeia hebraica em duas frases para fluidez, preservando a sequência narrativa. “Berseba” segue a forma bíblica portuguesa tradicional.
