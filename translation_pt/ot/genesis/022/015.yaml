  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: pt
  text: E o anjo de Yahweh chamou Abraão pela segunda vez, do céu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O wayyiqtol dá continuidade à narrativa, e קרא, neste contexto de fala dirigida a alguém, é expresso naturalmente por “chamou”.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; nesta fórmula de Gênesis, referente a um ser celestial, “anjo” é a opção mais natural, sem determinar sua identidade teológica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל אַבְרָהָם
  choice: Abraão
  rationale: 'Com o verbo “chamar”, o português expressa naturalmente o destinatário sem preposição: “chamou Abraão”.'
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Preserva explicitamente o valor ordinal do hebraico, em vez do menos preciso “novamente”.
- source_word: מִן הַשָּׁמַיִם
  choice: do céu
  rationale: Embora שָׁמַיִם tenha forma plural em hebraico, “do céu” é a expressão idiomática e natural em português neste contexto de voz divina.
theological_decisions:
- issue: Tradução de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução mantém a formulação narrativa e não decide se o personagem é um ser criado ou uma manifestação especial de Deus; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem foi ajustada à sintaxe portuguesa sem perder nenhum elemento do hebraico.
