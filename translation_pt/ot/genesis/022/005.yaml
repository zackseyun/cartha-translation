base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: pt
  text: 'Então Abraão disse aos seus rapazes: “Fiquem aqui com o jumento. Eu e o rapaz iremos até ali; adoraremos[a] e voltaremos para junto de vocês[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos prostraremos”; o verbo hebraico pode se referir mais literalmente ao ato de curvar-se ou prostrar-se em adoração.
    reason: lexical_alternative
  - marker: b
    text: 'Abraão usa literalmente o plural: “voltaremos para junto de vocês”. O texto não explica se isso expressa ocultação, expectativa ou confiança na provisão de Deus.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: seus jovens
  rationale: נַעַר pode designar um jovem, servo ou acompanhante. “Seus jovens” conserva a ligação lexical com הַנַּעַר (“o rapaz”) mais adiante, sem impor a relação institucional expressa por “servos”.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Fiquem aqui
  rationale: Embora יָשַׁב possa significar literalmente “sentar-se”, neste contexto a ordem é que eles permaneçam no lugar; “Fiquem aqui” expressa isso de modo natural.
- source_word: עִם הַחֲמוֹר
  choice: com o jumento
  rationale: חֲמוֹר é o termo comum para o animal; “jumento” é claro e corrente em português.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Eu e o rapaz
  rationale: Aqui נַעַר se refere a Isaque. “Rapaz” é natural e preserva a amplitude do termo sem apresentá-lo necessariamente como criança pequena.
- source_word: נֵלְכָה עַד כֹּה
  choice: iremos até ali
  rationale: A construção indica a intenção de ir até um lugar distinto apontado ou perceptível no contexto. “Até ali” reproduz de forma concisa o valor espacial de עַד כֹּה.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: adoraremos
  rationale: שָׁחָה significa inclinar-se ou prostrar-se, frequentemente como ato de culto. No contexto do sacrifício, “adoraremos” comunica o sentido religioso, enquanto a dimensão física é registrada em nota.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: e voltaremos para junto de vocês
  rationale: A forma verbal está na primeira pessoa do plural e deve permanecer plural. “Voltaremos para junto de vocês” expressa naturalmente tanto o retorno quanto o destino indicado por אֲלֵיכֶם, sem acrescentar uma sequência temporal não explícita.
theological_decisions:
- issue: O plural na afirmação de Abraão sobre o retorno
  choice: 'Manter o plural explícito: “voltaremos para junto de vocês”.'
  alternative: Interpretar a fala como ocultação deliberada ou como declaração explícita de fé de que Abraão e Isaque retornariam juntos.
  rationale: O hebraico emprega a primeira pessoa do plural tanto para adorar como para voltar. A tradução preserva essa formulação sem decidir se Abraão está ocultando sua intenção, manifestando confiança na provisão de Deus ou falando de maneira deliberadamente aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Seus jovens” é menos institucional que “seus servos” e preserva a repetição lexical do hebraico com “o rapaz”. A pontuação mantém a fala fluida e evita acrescentar “então” antes do retorno, elemento ausente do texto-fonte.
