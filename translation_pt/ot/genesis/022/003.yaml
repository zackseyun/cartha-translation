base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: pt
  text: Abraão levantou-se cedo pela manhã, selou seu jumento, levou consigo dois dos seus jovens servos[a] e Isaque, seu filho, rachou a lenha para uma oferta queimada, levantou-se e foi ao lugar que Deus lhe havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dois dos seus jovens» ou «dois dos seus acompanhantes»; o hebraico נְעָרִים pode referir-se a jovens ou a servidores, conforme o contexto.
    reason: Alternativa lexical para נְעָרִים; a tradução principal adota o sentido contextual de jovens servidores, sem excluir os demais sentidos possíveis.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: levantou-se cedo pela manhã
  rationale: Expressa o ato de levantar-se cedo e preserva a ênfase narrativa na prontidão de Abraão.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: selou seu jumento
  rationale: Neste contexto, חבש descreve preparar o animal para a viagem, naturalmente expresso em português por 'selar'.
- source_word: שְׁנֵי נְעָרָיו
  choice: dois de seus jovens
  rationale: נַעַר pode designar um jovem ou um servidor/ajudante. A redação preserva o sentido lexical básico sem definir de modo indevido a condição social deles; a nota registra as alternativas contextuais.
- source_word: יִצְחָק בְּנוֹ
  choice: Isaque, seu filho
  rationale: Mantém a ordem apositiva do hebraico e ressalta a relação filial.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: rachou a lenha para um holocausto
  rationale: בקע indica rachar ou fender; 'lenha' é a forma natural de designar madeira preparada para queima. עֹלָה é vertido pelo termo sacrificial tradicional 'holocausto'.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: levantou-se e foi
  rationale: Conserva os dois verbos sequenciais e o ritmo deliberado da narrativa hebraica.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: que Deus lhe havia indicado
  rationale: No contexto de uma instrução anterior sobre o destino, 'indicado' comunica naturalmente o valor de אמר com objeto indireto, sem sugerir que Deus já tivesse revelado todos os pormenores.
theological_decisions:
- issue: Tradução do termo sacrificial עֹלָה
  choice: holocausto
  alternative: oferta queimada por inteiro
  rationale: '''Holocausto'' é o equivalente bíblico português tradicional e reconhecível para a oferta inteiramente consumida no altar. A alternativa é mais explicativa, mas menos concisa como termo técnico.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A coordenação de ações preserva o ritmo cumulativo do hebraico.
