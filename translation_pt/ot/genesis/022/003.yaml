revisions:
- from: Abraão levantou-se cedo pela manhã, selou seu jumento, levou consigo dois de seus jovens[a] e Isaque, seu filho, rachou a lenha para um holocausto, levantou-se e foi ao lugar que Deus lhe havia indicado.
  to: Abraão levantou-se cedo pela manhã, selou seu jumento, levou consigo dois dos seus jovens servos[a] e Isaque, seu filho, rachou a lenha para uma oferta queimada, levantou-se e foi ao lugar que Deus lhe havia dito.
  rationale: A revisão conserva o paralelismo e a progressão verbal do hebraico, mas torna a designação dos acompanhantes mais idiomática em português, traduz אמר por «havia dito» e substitui «holocausto» por «oferta queimada», equivalente moderno e transparente de עֹלָה.
