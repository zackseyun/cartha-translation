    issue: «que Deus lhe havia indicado» para אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
    rationale: O hebraico usa אמר, «disse», e não um verbo de mera indicação. «Que Deus lhe havia dito» mantém a comunicação verbal e a anterioridade narrativa.
  - severity: medium
    issue: «holocausto» para עֹלָה
    rationale: É um termo bíblico tradicional, mas no português contemporâneo sua referência histórica moderna é muito saliente. «Oferta queimada» traduz diretamente a categoria sacrificial sem criar essa distração.
  - severity: low
    issue: «dois de seus jovens»
    rationale: A expressão é gramatical, mas pouco natural e não deixa claro que se trata de acompanhantes masculinos ligados à casa de Abraão. A revisão explicita o sentido contextual sem eliminar a alternativa lexical na nota.
