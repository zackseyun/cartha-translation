lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O wayyiqtol de חיה informa, nesta fórmula genealógica, quanto tempo Sete viveu depois do nascimento de Enos; “viveu” é natural e preciso em português.
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: Depois de gerar Enos
  rationale: A construção temporal é expressa de modo corrente em português, mantendo Sete como sujeito implícito e preservando o sentido genealógico do hifil de ילד.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos e sete anos
  rationale: A ordem numérica é ajustada ao uso idiomático do português, sem alterar o total indicado pelo hebraico.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: “Gerou” conserva o sentido genealógico e a ligação coordenada do hebraico, em registro digno e compreensível.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a especificação explícita de descendentes masculinos e femininos, em vez de generalizá-la como “filhos” ou “crianças”.
