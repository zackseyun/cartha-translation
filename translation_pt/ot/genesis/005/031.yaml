lexical_decisions:
- source_word: וַיְהִי
  choice: Assim, ... foram
  rationale: O waw consecutivo introduz o resumo da duração da vida de Lameque. “Assim” transmite naturalmente a progressão narrativa, enquanto “foram” completa em português a fórmula de totalização.
- source_word: כָּל יְמֵי
  choice: todos os dias de
  rationale: Preserva a expressão hebraica convencional para a duração total da vida e continua clara em português.
- source_word: לֶמֶךְ
  choice: Lameque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: setecentos e setenta e sete
  rationale: O hebraico enumera unidades, dezenas e centenas em ordem própria; a formulação escolhida expressa idiomaticamente o total de 777 em português.
- source_word: שָׁנָה
  choice: anos
  rationale: Embora o hebraico use a forma singular nesta construção numérica, o plural é exigido pelo português corrente.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém a fórmula conclusiva repetida em Gênesis 5, preservando sua cadência e seu peso, sem acrescentar interpretação.
theological_decisions:
- issue: Fórmula genealógica da duração da vida em Gênesis 5
  choice: Apresentar a idade como um resumo direto da duração da vida, seguido da notícia da morte.
  alternative: Tratar o número simbolicamente na própria tradução.
  rationale: O texto hebraico apresenta diretamente uma duração numérica e a morte de Lameque. A tradução deve conservar esse sentido textual sem inserir qualificação simbólica, histórica ou cética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva de modo natural a cadência genealógica e a expressão hebraica “todos os dias”.
