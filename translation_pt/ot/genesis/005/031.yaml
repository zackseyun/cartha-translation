  text: Assim, todos os dias de Lameque foram setecentos e setenta e sete anos[a], e ele morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o número aparece literalmente na ordem “sete e setenta anos, e setecentos anos”, isto é, 777 anos.
