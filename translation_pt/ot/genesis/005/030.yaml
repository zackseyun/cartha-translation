base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Noé, Lameque viveu quinhentos e noventa e cinco anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: No contexto da fórmula genealógica de Gênesis 5, o verbo חיה indica o período de vida transcorrido depois do nascimento mencionado; “viveu” é claro e natural em português.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: depois de gerar Noé
  rationale: A expressão marca o período posterior ao nascimento de Noé. “Gerar” preserva o sentido paterno do Hifil de ילד e é mais corrente, neste registro genealógico, do que “engendrar”.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: quinhentos e noventa e cinco anos
  rationale: O hebraico apresenta o total na ordem 95 + 500; a ordem portuguesa convencional comunica com exatidão o mesmo total.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Mantém a correspondência com הוֹלִידוֹ e conserva a nuance especificamente paterna do verbo na genealogia.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: O hebraico nomeia explicitamente descendentes dos dois sexos; a tradução preserva essa distinção em vez de generalizá-la como “filhos” ou “crianças”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A oração temporal foi colocada no início para evitar separar “viveu” de sua duração e para manter inequívoca a relação entre os 595 anos e o período posterior ao nascimento de Noé.
