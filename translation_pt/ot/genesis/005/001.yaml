base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: pt
  text: Este é o livro das gerações de Adão[a]. No dia em que Deus criou o ser humano[b], ele o fez à semelhança de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico aqui traduzido como “Adão” também pode significar “homem” ou “humanidade”; neste cabeçalho genealógico, o nome próprio é o sentido mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Quando Deus criou o homem” ou “Quando Deus criou a humanidade”. A expressão hebraica “no dia em que” pode ter simplesmente o sentido temporal de “quando”, e o termo traduzido como “ser humano” também pode ser vertido como “homem” ou “humanidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Este é o livro
  rationale: A frase nominal hebraica funciona como cabeçalho; em português, a cópula expressa naturalmente essa função. “Livro” mantém o sentido concreto de registro escrito e o tom formal.
- source_word: תּוֹלְדֹת
  choice: gerações
  rationale: O termo pode designar gerações, descendência ou o relato ligado a elas. “Gerações” preserva o termo estrutural recorrente de Gênesis sem restringi-lo a uma simples lista genealógica.
- source_word: אָדָם (primeira ocorrência)
  choice: Adão
  rationale: No cabeçalho da genealogia, o termo identifica o ancestral nomeado apresentado nos versículos seguintes.
- source_word: בְּיוֹם בְּרֹא
  choice: No dia em que ... criou
  rationale: Reproduz de modo idiomático a construção temporal hebraica e conserva a ressonância formal de “no dia”, embora a expressão também possa significar simplesmente “quando”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O substantivo tem sentido singular neste contexto e recebe sua tradução portuguesa convencional.
- source_word: אָדָם (segunda ocorrência)
  choice: o ser humano
  rationale: Aqui o termo retoma a criação da humanidade de modo genérico. “Ser humano” comunica essa abrangência com clareza atual, enquanto a nota registra as possibilidades “homem” e “humanidade”.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: à semelhança de Deus
  rationale: “Semelhança” corresponde a דְּמוּת e evita harmonizá-lo com “imagem”, tradução de outro vocábulo hebraico. A preposição “à” expressa naturalmente a relação de conformidade em português.
- source_word: עָשָׂה אֹתוֹ
  choice: ele o fez
  rationale: Mantém a diferença lexical entre ברא, “criar”, e עשה, “fazer”, bem como o objeto pronominal singular do hebraico.
theological_decisions:
- issue: Os dois sentidos de אָדָם no mesmo versículo
  choice: “Adão” no cabeçalho e “o ser humano” na cláusula da criação
  alternative: Traduzir a segunda ocorrência como “o homem”, “a humanidade” ou também “Adão”
  rationale: A primeira ocorrência introduz a genealogia do ancestral Adão; a segunda ecoa a criação da humanidade. A tradução distingue esses usos sem ocultar na nota a amplitude do termo hebraico.
- issue: Relação entre “semelhança” e a linguagem da criação em Gênesis
  choice: Manter “semelhança”
  alternative: Harmonizar como “imagem de Deus”
  rationale: O texto usa דְּמוּת, não צֶלֶם. Conservar “semelhança” respeita a escolha lexical do original e evita fundir termos relacionados, mas distintos.
- issue: Valor temporal de בְּיוֹם
  choice: “No dia em que” no texto
  alternative: “Quando”
  rationale: A formulação escolhida mantém o eco literário de Gênesis 1–2. A nota reconhece que a expressão hebraica pode funcionar de modo mais geral, sem exigir referência a um dia específico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formulação natural sem perder o caráter de cabeçalho genealógico. “Ser humano” evita que o uso genérico de אָדָם seja entendido apenas como referência ao sexo masculino; a nota preserva a alternativa formal “homem”. Todos os marcadores de nota aparecem no texto.
