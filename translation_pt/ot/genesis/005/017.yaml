lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O wayyiqtol de היה introduz aqui o resumo da duração total da vida; “foram” preserva a fórmula genealógica de modo natural em português.
- source_word: כָּל יְמֵי
  choice: todos os dias de
  rationale: Mantém a força abrangente de כָּל e a expressão hebraica recorrente, sem substituí-la pela interpretação mais fluida “tempo de vida”.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Transliteração tradicional e amplamente reconhecível em português para o nome hebraico.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos e noventa e cinco anos
  rationale: Reordena os componentes do numeral hebraico segundo o uso natural do português e expressa o total com exatidão, sem repetir “anos”.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Preserva a fórmula conclusiva solene e repetitiva de Gênesis 5, sem acrescentar nuance causal ou temporal.
