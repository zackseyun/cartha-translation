id: GEN.5.3
reference: Genesis 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: pt
  text: Adão viveu cento e trinta anos e gerou um filho[a] à sua semelhança, conforme a sua imagem[b], e lhe deu o nome de Sete.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega um verbo que significa gerar como pai; as palavras “um filho” estão implícitas no contexto.
    reason: source_transparency
  - marker: b
    text: A expressão “à sua semelhança, conforme a sua imagem” evoca Gênesis 1:26–27.
    reason: cross_reference
  - marker: c
    text: Literalmente, “chamou o nome dele de Sete”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica a idade alcançada até o acontecimento mencionado e é expresso naturalmente por “viveu”.
- source_word: אָדָם
  choice: Adão
  rationale: Neste contexto genealógico, o termo funciona como nome próprio, não como designação genérica da humanidade.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cento e trinta anos
  rationale: Forma corrente e clara de expressar em português o número hebraico, mantendo explicitamente “anos”.
- source_word: וַיּוֹלֶד
  choice: gerou um filho
  rationale: O hifil de ילד com sujeito masculino significa gerar como pai. “Gerou” preserva esse sentido de modo natural; “um filho” explicita em português o descendente indicado pelo contexto e posteriormente nomeado Sete.
- source_word: בִּדְמוּתוֹ
  choice: à sua semelhança
  rationale: דְּמוּת denota semelhança ou correspondência. A formulação mantém o eco de Gênesis 1 sem explicar suas implicações teológicas.
- source_word: כְּצַלְמוֹ
  choice: conforme a sua imagem
  rationale: צֶלֶם é vertido por “imagem”, e a preposição כ é representada por “conforme”, preservando a distinção em relação a “semelhança”.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: e lhe deu o nome de Sete
  rationale: Tradução idiomática e atual da expressão hebraica literalmente equivalente a “chamou o nome dele de Sete”.
- source_word: שֵׁת
  choice: Sete
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico שֵׁת em português.
theological_decisions:
- issue: Relação do filho de Adão com a semelhança e a imagem de Adão
  choice: Preservar a declaração direta de que o filho foi gerado à semelhança e conforme a imagem de Adão.
  alternative: Interpretar a frase como prova de perda ou diminuição da imagem de Deus após a queda, ou tratá-la como mera repetição sem ressonância teológica.
  rationale: A redação evoca Gênesis 1:26–27, mas o versículo não explica as implicações dessa relação. A tradução conserva o eco e a tensão sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. “Gerou” conserva a precisão do termo de paternidade; “lhe deu o nome” evita um hebraísmo pouco natural. Mantêm-se distintos “semelhança” e “imagem” para preservar a formulação e o eco literário do hebraico.
