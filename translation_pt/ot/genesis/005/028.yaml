  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o wayyiqtol de חיה indica o período vivido antes do acontecimento seguinte; “viveu” é natural e fiel em português.
- source_word: לֶמֶךְ
  choice: Lameque
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: cento e oitenta e dois anos
  rationale: A ordem numérica idiomática do hebraico é vertida na ordem corrente do português, com o plural natural “anos”.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hiphil, ילד com sujeito masculino significa gerar um descendente; “gerou” é conciso, atual e apropriado ao contexto genealógico.
- source_word: בֵּן
  choice: um filho
  rationale: O artigo indefinido é natural porque o filho ainda não é nomeado neste versículo.
