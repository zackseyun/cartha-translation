  yaml_path: translation/ot/genesis/005/012.yaml
  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: pt
  text: Cainã viveu setenta anos e gerou Maalalel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em linguagem mais explícita: “Cainã viveu setenta anos e tornou-se pai de Maalalel”.'
    reason: alternativa lexical para explicitar o sentido genealógico de וַיּוֹלֶד
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה expressa naturalmente o tempo de vida transcorrido antes do nascimento do descendente; “viveu” preserva de modo claro e conciso a forma hebraica.
- source_word: קֵינָן
  choice: Quenã
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico קֵינָן, adequada à leitura corrente em português.
- source_word: שִׁבְעִים שָׁנָה
  choice: setenta anos
  rationale: A expressão indica a idade de Quenã quando gerou o descendente; a construção é natural em português e mantém a concisão do hebraico.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Em contexto genealógico, ילד na forma causativa denota gerar um descendente. “Gerou” mantém o sentido paterno e a formulação bíblica sem ser obscuro ou excessivamente arcaico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico do objeto direto definido e não requer equivalente lexical em português.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Forma portuguesa tradicional do nome hebraico, próxima de sua estrutura consonantal e amplamente inteligível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão repetitiva própria da genealogia. “Gerou” preserva a precisão genealógica e permanece corrente no registro bíblico; a nota oferece uma formulação mais explícita.
