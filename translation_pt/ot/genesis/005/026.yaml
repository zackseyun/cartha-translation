  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Lameque, Matusalém viveu 782 anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: No contexto genealógico, o verbo חיה introduz naturalmente o período de vida posterior ao nascimento do filho mencionado.
- source_word: מְתוּשֶׁלַח
  choice: Matusalém
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: Depois de gerar Lameque
  rationale: Expressa com clareza a relação temporal e preserva o sentido causativo e masculino de ילד no hifil; o sujeito de 'gerar' é recuperado naturalmente como Matusalém.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 anos
  rationale: Converte a ordem numérica hebraica, literalmente 'dois e oitenta... e setecentos', para a notação usual em português, sem perda de conteúdo.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Mantém a repetição lexical de ילד e a fórmula genealógica de modo conciso e natural em português.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a especificação explícita de descendentes masculinos e femininos, em vez de generalizá-la como 'filhos' ou 'crianças'.
