lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O wayyiqtol de היה, nesta fórmula genealógica, declara de modo idiomático a duração total da vida; “foram” preserva a forma hebraica e é natural em português.
- source_word: כָּל יְמֵי
  choice: todos os dias de
  rationale: A expressão construta designa a totalidade dos dias vividos. A tradução mantém a formulação característica da genealogia sem perder clareza.
- source_word: אֱנוֹשׁ
  choice: Enosh
  rationale: A transliteração acompanha diretamente a forma hebraica do nome e distingue a tradução da forma tradicional “Enos”.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: novecentos e cinco anos
  rationale: A expressão numérica hebraica apresenta cinco e novecentos anos; a ordem foi ajustada ao uso natural do português, comunicando corretamente o total de 905 anos.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: A tradução reproduz de maneira direta a fórmula conclusiva recorrente em Gênesis 5; o pronome explícito torna a frase natural e clara em português.
