translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação temporal é mais natural do que reproduzir literalmente 'viveu cento e sessenta e dois anos e gerou', e conserva o sentido da fórmula genealógica.
