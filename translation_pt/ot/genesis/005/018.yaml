  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: pt
  text: Jarede viveu cento e sessenta e dois anos e gerou Enoque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Quando Jerede tinha
  rationale: Na fórmula genealógica, o hebraico diz literalmente que Jerede 'viveu' 162 anos antes de gerar Enoque. Em português, a construção temporal com 'tinha' comunica naturalmente a idade no momento do nascimento, sem alterar a relação cronológica.
- source_word: יֶרֶד
  choice: Jerede
  rationale: Forma tradicional e reconhecível do nome em português, adequada à legibilidade brasileira e à tradição bíblica lusófona.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: cento e sessenta e dois anos
  rationale: Reordena a sequência numérica hebraica segundo o uso idiomático do português, preservando exatamente o valor de 162 anos.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que o homem gerou ou se tornou pai do descendente. 'Gerou' é conciso, atual e tradicional sem ser arcaico.
- source_word: אֶת חֲנוֹךְ
  choice: Enoque
  rationale: O marcador de objeto direto אֶת não recebe tradução; 'Enoque' é a forma portuguesa estabelecida do nome.
