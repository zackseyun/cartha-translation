  text: וַֽ/יְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Quenã[a], Enosh viveu oitocentos e quinze anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Quenã”; formas tradicionais influenciadas pelo grego trazem “Cainã”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O verbo חיה, nesta fórmula genealógica, indica a duração da vida após o nascimento mencionado; “viveu” é direto e natural em português.
- source_word: אֱנוֹשׁ
  choice: Enosh
  rationale: A forma “Enosh” representa mais diretamente o nome hebraico do que a forma tradicional “Enos”, influenciada pela transmissão grega e latina.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: depois de gerar
  rationale: A construção temporal e o Hifil de ילד indicam o período posterior a Enosh ter-se tornado pai de Quenã. “Gerar” é a expressão genealógica corrente e concisa em português.
- source_word: אֶת קֵינָן
  choice: Quenã
  rationale: “Quenã” translitera de modo acessível a forma hebraica קֵינָן; o marcador de objeto direto אֶת não recebe tradução própria.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos e quinze anos
  rationale: O hebraico apresenta quinze mais oitocentos; a ordem foi ajustada ao uso natural do português, sem alterar o total.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Mantém o verbo genealógico ילד e a perspectiva paterna explícita no contexto, sem recorrer a uma formulação excessivamente longa.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a especificação hebraica de descendentes dos dois sexos, em vez de generalizá-la como “filhos” ou “crianças”.
theological_decisions:
- issue: Alcance genealógico do verbo ילד
  choice: gerou
  alternative: tornou-se pai de
  rationale: O texto apresenta Enosh como progenitor de Quenã, mas o verbo genealógico não exige aqui uma decisão sobre se a relação é necessariamente imediata em todos os usos bíblicos; a tradução mantém a fórmula sem acrescentar uma conclusão genealógica.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. Os números foram escritos por extenso para conservar o estilo narrativo. Mantiveram-se formas dos nomes próximas ao hebraico, com nota para a forma tradicional de Quenã.
