base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Matusalém, Enoque andou com Deus[a] durante trezentos anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «viveu em comunhão com Deus». A expressão hebraica diz literalmente «andou com Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: andou com
  rationale: Preserva a metáfora relacional do hitpael de הלך, expressão que descreve a maneira de viver de Enoque em relação a Deus.
- source_word: אֶת הָאֱלֹהִים
  choice: com Deus
  rationale: Neste idioma, אֶת tem sentido relacional. Em português, o título divino é expresso naturalmente sem artigo.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Depois de gerar
  rationale: Expressa com clareza a relação temporal e o sentido causativo de ילד referente ao pai, sem recorrer ao arcaísmo «gerar a» ou «engendrar».
- source_word: מְתוּשֶׁלַח
  choice: Matusalém
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: durante trezentos anos
  rationale: O acréscimo idiomático de «durante» deixa claro em português que os trezentos anos são a duração do andar de Enoque com Deus.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Mantém o sentido paterno do hifil de ילד em linguagem portuguesa corrente e digna.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Reproduz a especificação explícita do hebraico, em vez de reduzi-la ao termo genérico «filhos» ou «crianças».
theological_decisions:
- issue: Natureza da relação de Enoque com Deus na expressão «andou com Deus»
  choice: Manter no texto principal a metáfora relacional «andou com Deus»
  alternative: viveu em comunhão com Deus
  rationale: A formulação hebraica tem força teológica própria e permanece evocativa; explicá-la no texto principal restringiria indevidamente seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem inicial «Depois de gerar Matusalém» e o uso de «durante» evitam qualquer ambiguidade quanto ao período de trezentos anos.
