lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica o período vivido antes do acontecimento seguinte; “viveu” é a correspondência natural e direta em português.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: O nome próprio é transliterado segundo a forma tradicional e amplamente reconhecível nas Bíblias em português.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: sessenta e cinco anos
  rationale: A ordem numérica hebraica é reorganizada conforme o uso natural do português, sem alterar o valor exato.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto de genealogia masculina, ילד designa a geração de um descendente; “gerou” preserva o sentido e o estilo bíblico com clareza atual.
- source_word: אֶת יָרֶד
  choice: Jarede
  rationale: A partícula de objeto direto אֶת não recebe tradução; o nome é apresentado na forma tradicional portuguesa “Jarede”.
