base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Maalalel, Cainã viveu oitocentos e quarenta anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: No padrão genealógico de Gênesis, חיה introduz a duração da vida; “viveu” é natural e fiel.
- source_word: קֵינָן
  choice: Cainã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico קֵינָן.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Depois de gerar
  rationale: Expressa claramente a relação temporal e o sentido causativo de ילד no hifil com sujeito masculino.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Transliteração portuguesa reconhecível do nome hebraico, sem a vogal longa duplicada de formas tradicionais alternativas.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos e quarenta anos
  rationale: Reordena idiomaticamente os componentes numéricos hebraicos sem alterar o total.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: “Gerou” mantém o sentido masculino específico do hifil de ילד e é corrente no registro genealógico bíblico em português.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a especificação explícita de descendentes masculinos e femininos.
