  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: pt
  text: Depois que gerou Sete, Adão viveu oitocentos anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Adão viveu
  rationale: A expressão hebraica diz literalmente que “os dias de Adão foram”; em português corrente, a duração da vida é expressa naturalmente com “viveu”.
- source_word: אָדָם
  choice: Adão
  rationale: No contexto genealógico, trata-se do nome pessoal, não de uma referência genérica ao ser humano.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֵׁת
  choice: Depois que gerou Sete
  rationale: Expressa com naturalidade a relação temporal e conserva o sentido causativo/genealógico do Hifil de ילד.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: oitocentos anos
  rationale: Equivalência direta da expressão numérica de duração.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: e gerou filhos e filhas
  rationale: Mantém a repetição do verbo ילד e preserva a menção explícita a descendentes masculinos e femininos.
theological_decisions:
- issue: Sentido de אָדָם
  choice: Adão, como nome pessoal
  alternative: ser humano ou homem
  rationale: A estrutura da genealogia identifica aqui o indivíduo chamado Adão; traduzir genericamente enfraqueceria essa referência pessoal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Gerou” preserva a linguagem genealógica sem recorrer ao arcaísmo “gerou filhos” no sentido excessivamente técnico; a construção permanece natural no contexto.
