lexical_decisions:
- source_word: וַיְהִי
  choice: Assim, ... foram
  rationale: O wayyiqtol de היה introduz o resumo da vida de Enoque dentro da sequência genealógica. “Assim” preserva o valor conclusivo-sequencial, e “foram” produz uma formulação natural em português.
- source_word: כָּל יְמֵי
  choice: todos os dias de
  rationale: Mantém a expressão hebraica de totalidade aplicada aos “dias”, que neste contexto genealógico designa a duração completa da vida.
- source_word: חֲנוֹךְ
  choice: Enoque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: trezentos e sessenta e cinco
  rationale: Reordena os componentes numéricos hebraicos segundo o uso natural do português, sem alterar o total de 365.
- source_word: שָׁנָה ... שָׁנָה
  choice: anos
  rationale: Embora o hebraico repita o substantivo no singular em sua construção numeral, o português idiomático reúne a expressão e exige o plural “anos”.
