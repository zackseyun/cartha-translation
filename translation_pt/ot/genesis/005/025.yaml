lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה introduz a idade do patriarca antes do nascimento do descendente; “viveu” é natural e fiel em português.
- source_word: מְתוּשֶׁלַח
  choice: Matusalém
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: cento e oitenta e sete anos
  rationale: Reordena a sequência numérica hebraica segundo o uso idiomático do português, preservando exatamente o valor de 187 anos.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: O hifil de ילד em genealogias indica a paternidade; “gerou” é conciso, corrente no registro bíblico português e mantém o sentido genealógico masculino.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico do objeto direto, representado pela sintaxe normal do português.
- source_word: לָמֶךְ
  choice: Lameque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
