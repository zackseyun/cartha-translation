  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: pt
  text: 'E deu-lhe o nome de Noé[a], dizendo: “Este nos consolará do nosso trabalho e do penoso esforço de nossas mãos, por causa da terra que Yahweh amaldiçoou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por “consolará” faz um jogo de palavras com o nome Noé, que soa semelhante a uma palavra ligada a “descanso” ou “alívio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: E deu-lhe o nome
  rationale: A construção hebraica é uma fórmula de nomeação. Em português atual, “deu-lhe o nome” preserva seu sentido com mais naturalidade do que o decalque “chamou o seu nome”.
- source_word: נֹחַ
  choice: Noé
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: זֶה
  choice: Este
  rationale: Preserva a força demonstrativa com que o pai apresenta a criança.
- source_word: יְנַחֲמֵנוּ
  choice: nos consolará
  rationale: Traduz diretamente o verbo נחם, “consolar”, mantendo a associação sonora, embora não etimologicamente exata, com o nome Noé.
- source_word: מִמַּעֲשֵׂנוּ
  choice: do nosso trabalho
  rationale: Neste contexto, מַעֲשֶׂה indica trabalho ou atividade humana, não feitos de caráter moral.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: e do penoso esforço de nossas mãos
  rationale: Expressa tanto a dor quanto a labuta contidas em עִצָּבוֹן e conserva a imagem hebraica das mãos.
- source_word: מִן־הָאֲדָמָה
  choice: causado pela terra
  rationale: O segundo מִן pode indicar a fonte ou causa da penosa labuta; esta formulação explicita em português a ligação contextual com a terra amaldiçoada sem transformar a terra em objeto direto do consolo.
- source_word: אֲשֶׁר אֵרְרָהּ יְהוָה
  choice: que Yahweh amaldiçoou
  rationale: Mantém a oração relativa e verte o tetragrama como o nome pessoal Yahweh.
theological_decisions:
- issue: Jogo de palavras entre נֹחַ e יְנַחֲמֵנוּ
  choice: O texto principal usa “nos consolará”, com nota explicando a associação com descanso ou alívio.
  alternative: nos dará alívio; nos dará descanso
  rationale: O verbo significa propriamente “consolar”, enquanto o nome Noé soa mais diretamente relacionado a “descanso”. A nota preserva a associação popular feita pelo texto sem alegar uma derivação lexical estrita.
- issue: Relação de מִן־הָאֲדָמָה com a labuta
  choice: “causado pela terra”
  alternative: “da terra”; “por causa da terra”
  rationale: A sintaxe admite uma relação de origem ou causa. No contexto de Gênesis 3:17, a terra amaldiçoada é a fonte da labuta penosa; a tradução comunica essa relação sem eliminar a ambiguidade por completo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Evita o decalque pouco natural “chamou o seu nome”, conserva a imagem do trabalho manual e usa “Yahweh” para o tetragrama.
