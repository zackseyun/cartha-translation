base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: pt
  text: Homem e mulher ele os criou; abençoou-os e deu-lhes o nome de “ser humano”[a], no dia em que foram criados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: adam. A palavra pode referir-se coletivamente ao ser humano ou à humanidade e também é o nome próprio Adão.'
    reason: Preserva a ambiguidade lexical entre o sentido coletivo e o nome próprio.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: Homem e mulher
  rationale: No contexto da criação humana, expressa em português corrente a distinção sexual indicada pelo par hebraico, evitando o tom zoológico que “macho e fêmea” costuma ter quando aplicado a pessoas.
- source_word: בְּרָאָם
  choice: ele os criou
  rationale: O perfeito qal de ברא, com sufixo plural, refere-se à criação dos dois por Deus; o pronome explícito torna a frase natural em português.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: abençoou-os
  rationale: Tradução direta e idiomática da ação divina de abençoar ambos.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: deu a ambos o nome de
  rationale: Conserva a ideia hebraica de um único nome atribuído ao par, mas evita a construção pouco natural “chamou o nome deles”.
- source_word: אָדָם
  choice: ser humano
  rationale: Aqui o termo designa coletivamente o homem e a mulher. O singular “ser humano” preserva a força de um nome comum dado a ambos, enquanto a nota registra a identidade formal com o nome próprio Adão.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: no dia em que foram criados
  rationale: Mantém a expressão temporal e a voz passiva do infinitivo nifal hebraico em português claro.
theological_decisions:
- issue: Sentido coletivo de אָדָם na identidade do par humano
  choice: ser humano
  alternative: Adão
  rationale: O antecedente inclui homem e mulher, e ambos recebem um só nome; por isso, o sentido coletivo é primário. Como a mesma forma hebraica também é o nome próprio Adão e assim funciona na genealogia próxima, essa possibilidade é preservada em nota.
- issue: Tradução de זָכָר וּנְקֵבָה aplicada aos seres humanos
  choice: Homem e mulher
  alternative: Macho e fêmea
  rationale: A alternativa é lexicalmente mais formal, mas em português moderno pode soar zoológica ou desumanizante. A escolha mantém a distinção sexual no contexto especificamente humano sem introduzir uma tese além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “Homem e mulher ele os criou” conserva a ênfase inicial do hebraico; o ponto e vírgula organiza a sequência sem tornar o período pesado.
