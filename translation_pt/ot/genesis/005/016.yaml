base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: pt
  text: Depois que gerou Jarede, Maalalel viveu oitocentos e trinta anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O verbo חיה, nesta fórmula genealógica, indica o período de vida que continuou após o nascimento do descendente mencionado; “viveu” é natural e preciso em português.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: Depois que gerou Jarede
  rationale: Expressa com clareza a relação temporal e preserva o sentido causativo masculino do Hifil de ילד sem recorrer ao arcaico “gerou a”.
- source_word: יֶרֶד
  choice: Jarede
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos e trinta anos
  rationale: Reordena os componentes do numeral segundo o uso natural do português, preservando o total exato.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Mantém a correspondência lexical com הוֹלִידוֹ e comunica de modo conciso que Maalalel foi pai de outros descendentes.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a menção explícita a descendentes masculinos e femininos, em vez de generalizar como “filhos” ou “crianças”.
