id: GEN.5.32
reference: Genesis 5:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: pt
  text: Quando Noé tinha quinhentos anos, ele gerou[b] Sem, Cam e Jafé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A ordem “Sem, Cam e Jafé” segue o texto hebraico; essa sequência não indica necessariamente a ordem de nascimento nem que os três tenham nascido no mesmo ano.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Noé gerou”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Quando ... tinha
  rationale: A forma narrativa de היה introduz aqui a circunstância temporal. Em português, “Quando Noé tinha” comunica essa função com naturalidade, sem reproduzir mecanicamente “E aconteceu que”.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: tinha quinhentos anos
  rationale: A expressão hebraica בן + numeral + שנה indica idade; esta é a formulação idiomática corrente em português.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hifil, ילד com sujeito masculino significa “gerar, tornar-se pai de”. “Gerou” é preciso, conciso e adequado ao registro genealógico, sem o arcaísmo de “procriou” nem a menor precisão de “teve”.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cam e Jafé
  rationale: Os marcadores de objeto direto não recebem tradução; os nomes seguem suas formas portuguesas tradicionais, e a enumeração usa coordenação natural.
theological_decisions:
- issue: Possível implicação de ordem de nascimento na sequência “Sem, Cam e Jafé”
  choice: Manter a ordem do texto hebraico sem afirmar que ela representa a ordem de nascimento nem que os três nasceram no mesmo ano.
  alternative: Reordenar os nomes segundo uma reconstrução da ordem de nascimento ou explicitar que os três nasceram quando Noé tinha quinhentos anos.
  rationale: O versículo apresenta os três filhos após informar a idade de Noé, mas a construção não exige que todos tenham nascido no mesmo ano, e a sequência dos nomes não precisa indicar rigorosamente a ordem de nascimento. A tradução preserva a formulação e a tensão do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O pronome “ele” evita a repetição estilística do nome sem alterar o referente; a nota registra a forma mais literal.
