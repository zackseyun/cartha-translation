  text: וַֽ/יְחִי שֵׁ֕ת חָמֵ֥שׁ שָׁנִ֖ים וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת אֱנֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/006.yaml
  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: pt
  text: Sete viveu 105 anos e gerou Enos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “tornou-se pai de Enos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica a idade alcançada antes do acontecimento seguinte; “viveu” é a forma natural e direta em português.
- source_word: שֵׁת
  choice: Sete
  rationale: Emprega-se a forma tradicional portuguesa do nome hebraico שֵׁת, amplamente reconhecida pelos leitores.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 anos
  rationale: A expressão hebraica, literalmente “cinco anos e cem anos”, significa 105 anos; os algarismos oferecem clareza moderna sem alterar o sentido.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, ילד na forma causativa denota gerar ou tornar-se pai. “Gerou” é conciso, corrente em genealogias bíblicas e mantém em aberto apenas o que o hebraico afirma sobre a relação de descendência.
- source_word: אֶת אֱנוֹשׁ
  choice: Enos
  rationale: A partícula de objeto direto אֶת não é traduzida. “Enos” é a forma portuguesa tradicional e reconhecível do nome hebraico אֱנוֹשׁ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de uma fórmula genealógica. Mantêm-se as formas onomásticas tradicionais em português e evita-se o arcaísmo “engendrou”.
