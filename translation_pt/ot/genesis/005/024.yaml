  text: וַ/יִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת הָֽ/אֱלֹהִ֑ים וְ/אֵינֶ֕/נּוּ כִּֽי לָקַ֥ח אֹת֖/וֹ אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: pt
  text: Enoque andava com Deus; e ele já não estava[a], porque Deus o levou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “e ele não estava”. A expressão hebraica indica que Enoque já não se encontrava presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: andava
  rationale: O hitpael de הלך descreve uma conduta contínua ou modo de vida. O imperfeito português transmite essa continuidade, e a expressão “andava com Deus” preserva a imagem hebraica.
- source_word: אֶת הָאֱלֹהִים
  choice: com Deus
  rationale: Com o verbo הלך, אֶת indica companhia. “Com Deus” conserva de modo natural a força relacional da expressão.
- source_word: וְאֵינֶנּוּ
  choice: depois, já não estava mais ali
  rationale: A formulação comunica que Enoque deixou de estar presente, sem determinar de que maneira isso aconteceu. “Ali” torna a expressão inteligível em português e fica esclarecido na nota que não possui equivalente explícito no hebraico.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão da ausência de Enoque; “porque” expressa claramente essa relação causal em português atual.
- source_word: לָקַח אֹתוֹ
  choice: Deus o levou
  rationale: לקח significa tomar ou levar. Neste contexto, “o levou” é natural em português e preserva a ideia de remoção divina sem acrescentar destino ou modo.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto narrativo, o substantivo designa o único Deus.
theological_decisions:
- issue: Se deve ser declarado que Enoque não morreu ou que foi levado ao céu
  choice: 'Manter a formulação contida: “já não estava mais ali, porque Deus o levou”'
  alternative: “não morreu”, “Deus o levou para o céu” ou “Deus o trasladou”
  rationale: O versículo sugere uma remoção divina extraordinária, mas o hebraico não menciona explicitamente o céu nem afirma diretamente, neste ponto, que Enoque não morreu. A tradução preserva essa tensão e não incorpora ao texto principal interpretações bíblicas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Andava com Deus” preserva a conhecida metáfora bíblica sem soar excessivamente arcaica; “Deus o levou” é mais natural que “Deus o tomou” e não especifica para onde ele foi.
