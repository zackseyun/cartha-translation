  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: pt
  text: Assim, todos os dias da vida de Adão foram novecentos e trinta anos, e ele morreu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico adam pode significar “homem” ou “humanidade” em alguns contextos, mas aqui se refere ao indivíduo Adão na genealogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Na fórmula de resumo genealógico, o verbo היה declara de modo idiomático o total da vida; “foram” preserva a estrutura hebraica e soa natural em português.
- source_word: כָּל יְמֵי
  choice: todos os dias
  rationale: Mantém a expressão hebraica que apresenta a vida como uma soma de dias e preserva a fórmula recorrente da genealogia.
- source_word: אָדָם
  choice: Adão
  rationale: Neste contexto genealógico, o termo designa o indivíduo chamado Adão, e não a humanidade em sentido genérico.
- source_word: אֲשֶׁר חַי
  choice: que Adão viveu
  rationale: A oração relativa modifica “dias”. A repetição do nome evita a possível leitura momentânea de que os próprios dias seriam o sujeito de “viveu” e produz português claro.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: novecentos e trinta anos
  rationale: O número por extenso corresponde ao registro literário da genealogia e representa diretamente a construção cardinal hebraica.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Preserva a fórmula conclusiva breve e repetida de Gênesis 5, sem acrescentar uma nuance temporal nem suavizar sua ênfase na mortalidade.
theological_decisions:
- issue: Sentido de אָדָם
  choice: Adão como nome pessoal
  alternative: homem ou humanidade
  rationale: O contexto é uma genealogia e se refere ao indivíduo nomeado. Traduzir aqui por “homem” ou “humanidade” obscureceria essa referência, embora esses sentidos sejam possíveis em outros contextos.
- issue: Preservação da fórmula de mortalidade
  choice: e ele morreu
  alternative: e então morreu
  rationale: A formulação mantém o refrão genealógico e seu peso teológico, sem inserir uma ênfase temporal ausente do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a fórmula genealógica hebraica e sua repetição solene, usando pontuação natural em português.
