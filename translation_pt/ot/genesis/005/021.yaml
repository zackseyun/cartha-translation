lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica o período de vida transcorrido até o nascimento do descendente; “viveu” é a forma natural e fiel em português.
- source_word: חֲנוֹךְ
  choice: Enoque
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: sessenta e cinco anos
  rationale: A expressão numérica é apresentada na ordem idiomática do português, preservando exatamente a idade declarada.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Com sujeito masculino em contexto genealógico, ילד significa gerar um descendente. “Gerou” é conciso, corrente em genealogias bíblicas e mantém a relação paterna direta sem acrescentar informação.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É a partícula hebraica que marca o objeto direto definido e não possui equivalente lexical necessário em português.
- source_word: מְתוּשָׁלַח
  choice: Matusalém
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
