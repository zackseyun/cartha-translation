  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: pt
  text: Enos viveu noventa anos e gerou[a] Cainã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “foi pai de”; “gerou” expressa de modo conciso seu sentido genealógico.
    reason: lexical_alternative
  - marker: b
    text: O hebraico lê Qenã (Kenan). “Cainã” é a forma tradicional em português, influenciada pela forma grega.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica acompanhada de uma idade, חיה significa naturalmente “viver”; “viveu noventa anos” reproduz com clareza a construção hebraica.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: “Enos” é a forma portuguesa tradicional e amplamente reconhecida do nome hebraico אֱנוֹשׁ, sem alterar sua identificação.
- source_word: תִּשְׁעִים שָׁנָה
  choice: noventa anos
  rationale: É a forma idiomática portuguesa para a expressão de idade, embora o hebraico empregue o substantivo no singular.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hifil e em genealogias, ילד indica que o sujeito masculino gerou um descendente. “Gerou” é conciso, atual e preserva o sentido genealógico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É a partícula que marca o objeto direto definido e não possui equivalente lexical independente em português.
- source_word: קֵינָן
  choice: Cainã
  rationale: “Cainã” é a forma tradicional e reconhecível em português para este nome; corresponde à personagem designada pelo hebraico קֵינָן.
