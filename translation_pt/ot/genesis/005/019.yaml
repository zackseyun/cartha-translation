  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Enoque[a], Jarede viveu oitocentos anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico é transliterado como Hanokh; a forma tradicional portuguesa é Enoque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, חיה indica a duração da vida no período especificado; «viveu» é natural e fiel em português.
- source_word: יֶרֶד
  choice: Jarede
  rationale: Emprega-se a forma tradicional portuguesa do nome hebraico יֶרֶד, amplamente reconhecível e adequada à leitura bíblica em português.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: Depois de gerar Enoque
  rationale: A construção temporal é expressa naturalmente por «depois de»; o hifil de ילד é traduzido por «gerar», termo corrente nas genealogias e que preserva o papel paterno do sujeito.
- source_word: חֲנוֹךְ
  choice: Enoque
  rationale: Emprega-se a forma tradicional portuguesa, reconhecível e estabelecida, correspondente ao hebraico חֲנוֹךְ.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: oitocentos anos
  rationale: A expressão numeral designa duração, e o plural «anos» é o uso natural em português.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: A repetição de ילד é preservada com «gerou», formulação concisa e tradicional, sem recorrer ao arcaísmo «engendrou».
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a menção explícita aos descendentes de ambos os sexos, em vez de generalizá-la como «filhos» ou «crianças».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais portuguesas dos nomes próprios para ampla legibilidade. A ordem temporal foi antecipada («Depois de gerar Enoque») para produzir sintaxe natural sem alterar o sentido do hebraico.
