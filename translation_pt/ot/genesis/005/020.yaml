lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Assim, ... foram
  rationale: O wayyiqtol de היה introduz o resumo da vida na sequência genealógica. “Assim” expressa essa progressão narrativa de modo natural em português.
- source_word: כָּל יְמֵי
  choice: todos os dias de
  rationale: Mantém de perto a expressão genealógica hebraica para a duração total da vida, sem perder a clareza em português.
- source_word: יֶרֶד
  choice: Yéred
  rationale: Translitera diretamente a forma hebraica e assinala a sílaba tônica para leitores de português; a forma tradicional “Jarede” é indicada em nota.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: novecentos e sessenta e dois anos
  rationale: Reorganiza os componentes do numeral hebraico segundo a ordem corrente em português e representa uma única vez “anos”, evitando repetição artificial.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Preserva de maneira simples e direta a fórmula conclusiva recorrente de Gênesis 5.
