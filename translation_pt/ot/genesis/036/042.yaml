  text: chief Kenaz[a], chief Teman, chief Mibzar.
translation:
  language: pt
  text: o chefe Quenaz[a], o chefe Temã, o chefe Mibzar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe de clã”, em cada ocorrência de “chefe”. Traduções antigas também usam “duque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: Em Gênesis 36, o termo designa um líder tribal ou de clã edomita. “Chefe” é conciso, atual e preserva a repetição da lista sem acrescentar uma especificação ausente no hebraico.
- source_word: קְנַז
  choice: Quenaz
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecível em português.
- source_word: תֵּימָן
  choice: Temã
  rationale: Aqui funciona como nome próprio na lista de chefes edomitas; por isso, é transliterado, não traduzido por seu possível sentido lexical relacionado ao sul.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Nome próprio transliterado diretamente, preservando o valor consonantal de zain por “z”.
