lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Oolibama
  rationale: Transliteração portuguesa corrente do nome hebraico, sem traduzir seu possível significado.
- source_word: יָלְדָה
  choice: deu à luz
  rationale: Expressa naturalmente em português o verbo hebraico com sujeito materno e preserva o sentido genealógico.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: marcadores de objeto direto não expressos
  rationale: A partícula hebraica de objeto direto definido não possui equivalente lexical natural em português.
- source_word: יעיש
  choice: Jeús
  rationale: Forma aportuguesada tradicional do nome próprio hebraico.
- source_word: יַעְלָם
  choice: Jalão
  rationale: Forma aportuguesada tradicional do nome próprio, adequada à leitura corrente.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma aportuguesada tradicional do nome próprio hebraico.
- source_word: אֵלֶּה
  choice: Esses
  rationale: Demonstrativo natural em português para retomar os três filhos mencionados imediatamente antes.
- source_word: בְּנֵי
  choice: filhos
  rationale: O termo designa aqui filhos do sexo masculino, confirmados pelos nomes enumerados.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: que lhe nasceram
  rationale: Preserva a construção passiva e a referência a Esaú como aquele a quem os filhos nasceram, sem acrescentar nesta oração um sujeito materno explícito.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo explícito 'terra' e o registro genealógico do hebraico.
