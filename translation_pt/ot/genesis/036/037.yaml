  source_fidelity: 'A tradução preserva com precisão a sequência narrativa e a fórmula de sucessão: Samlá morre, e Saul, identificado como sendo de Reobote junto ao Rio, reina em seu lugar. “Então”, “reinou” e “em seu lugar” refletem adequadamente os valores de וַיָּמָת, וַיִּמְלֹךְ e תַּחְתָּיו. A expressão geográfica não identifica indevidamente o rio.'
