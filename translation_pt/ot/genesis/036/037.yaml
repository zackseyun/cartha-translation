base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: pt
  text: Então Samlá morreu, e Saul, de Reobote junto ao Rio[a], reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Reobote do Rio”; provavelmente se refere a uma localidade situada junto a um rio conhecido.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol de מות faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: שַׂמְלָה
  choice: Samlá
  rationale: Transliteração portuguesa do nome hebraico, com acento gráfico para indicar a pronúncia oxítona.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: מלך, nesta fórmula de sucessão real, indica o exercício do reinado; “reinou” preserva a formulação concisa do hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Em contextos de sucessão, o idioma hebraico indica que um governante ocupa o lugar do anterior.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico שָׁאוּל.
- source_word: מֵרְחֹבוֹת
  choice: de Reobote
  rationale: A preposição מִן marca procedência, e רְחֹבוֹת é tratado aqui como nome de lugar.
- source_word: הַנָּהָר
  choice: junto ao Rio
  rationale: A expressão qualifica geograficamente Reobote. “Junto ao Rio” é natural em português e mantém o artigo definido do hebraico sem identificar um rio que o texto não nomeia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem frasal natural. Mantém a concisão da fórmula hebraica de sucessão e não identifica “o Rio” como o Eufrates, pois o texto hebraico deste versículo não o nomeia.
