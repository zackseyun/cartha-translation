  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: pt
  text: 'E estes foram os filhos de Disã: Hemdã, Esbã, Itrã e Querã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes foram
  rationale: A conjunção e o demonstrativo introduzem a lista genealógica. Embora o hebraico não tenha verbo expresso, “foram” torna a frase natural em português e se ajusta ao relato de uma genealogia passada.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O construto hebraico significa literalmente “filhos de”; a lista imediata de homens nomeados favorece essa acepção específica, em vez do sentido mais amplo de “descendentes”.
- source_word: דִישָׁן
  choice: Disã
  rationale: Transliteração portuguesa do nome próprio, com “ã” representando de modo natural a terminação hebraica -ān.
- source_word: חֶמְדָּן
  choice: Hendã
  rationale: Forma portuguesa tradicional e legível do nome hebraico Ḥemdān, preservando a distinção em relação a “Handã” (חַמְדָּן) no versículo 38.
- source_word: וְ/אֶשְׁבָּן
  choice: Esbã
  rationale: Transliteração adaptada à ortografia portuguesa; a conjunção prefixada é representada pela coordenação da lista.
- source_word: וְ/יִתְרָן
  choice: Itrã
  rationale: Transliteração direta adaptada ao português, sem inserir a forma inglesa “Ithran” nem uma consoante ausente no hebraico.
- source_word: וּ/כְרָן
  choice: e Querã
  rationale: A conjunção é expressa antes do último item. “Qu” reproduz naturalmente em português o som /k/ diante de “e”, e “ã” representa a terminação -ān.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe genealógica natural. Os nomes próprios foram transliterados segundo padrões gráficos portugueses, buscando legibilidade brasileira e fidelidade às formas hebraicas.
