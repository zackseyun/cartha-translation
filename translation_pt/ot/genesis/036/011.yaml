base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: pt
  text: Os filhos de Elifaz foram Temã, Omar, Zefô[a], Gaetã e Quenaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas versões trazem “Zepo”; o texto hebraico massorético aqui vocaliza o nome como “Zefô”.
    reason: Registra uma variante de transliteração sem substituir a leitura indicada pela vocalização massorética.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Em uma lista genealógica, a forma de היה com waw funciona naturalmente como verbo copulativo que apresenta os descendentes; “foram” expressa isso de modo claro em português.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O hebraico emprega explicitamente o plural masculino construto “filhos de”; o contexto genealógico não exige sua neutralização como “descendentes”.
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Forma tradicional e reconhecível do nome pessoal em português.
- source_word: תֵּימָן
  choice: Temã
  rationale: Transliteração portuguesa tradicional do nome pessoal neste contexto genealógico.
- source_word: אוֹמָר
  choice: Omar
  rationale: Transliteração corrente e natural do nome pessoal em português.
- source_word: צְפוֹ
  choice: Zefô
  rationale: A forma representa em português a vocalização massorética do nome e segue o uso bíblico tradicional.
- source_word: גַעְתָּם
  choice: Gaetã
  rationale: Forma tradicional portuguesa do nome pessoal, preservando de maneira legível sua identificação genealógica.
- source_word: קְנַז
  choice: Quenaz
  rationale: Forma convencional em português, na qual “qu” representa o som consonantal inicial antes de “e”.
