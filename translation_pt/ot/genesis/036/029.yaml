  text: אֵ֖לֶּה אַלּוּפֵ֣י הַ/חֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: pt
  text: 'Estes são os chefes dos horeus: o chefe Lotã[a], o chefe Sobal, o chefe Zibeão e o chefe Aná.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes de clãs” ou “chefes tribais”; o termo hebraico pode designar o chefe de um clã ou de uma tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz a lista; em português, a cópula precisa ser expressa.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefes / chefe
  rationale: Em Gênesis 36, o termo designa líderes de clã ou de tribo. “Chefe” é claro e atual, e sua repetição antes de cada nome acompanha a estrutura hebraica.
- source_word: הַחֹרִי
  choice: dos horeus
  rationale: Embora a forma hebraica seja um gentílico singular com artigo, funciona coletivamente neste contexto e é vertida naturalmente no plural em português.
- source_word: לוֹטָן
  choice: Lotã
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: שׁוֹבָל
  choice: Sobal
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: צִבְעוֹן
  choice: Zibeão
  rationale: Forma portuguesa bíblica corrente do nome próprio hebraico.
- source_word: עֲנָה
  choice: Aná
  rationale: Transliteração portuguesa corrente, com acento para indicar a tonicidade final.
