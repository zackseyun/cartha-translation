  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: pt
  text: E estas são as gerações de Esaú, pai de Edom, na região montanhosa de Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no monte Seir” ou “nas montanhas de Seir”.
    reason: Registra as alternativas geográficas legítimas para בְּהַר, que pode indicar um monte específico ou uma área montanhosa.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estas são
  rationale: Mantém a conjunção que liga esta seção ao contexto anterior e reproduz a fórmula introdutória de Gênesis.
- source_word: תֹּלְדוֹת
  choice: as gerações
  rationale: Preserva o termo estrutural recorrente em Gênesis e sua amplitude, que pode abranger descendência e história familiar.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲבִי אֱדוֹם
  choice: pai de Edom
  rationale: Traduz diretamente a relação de progenitor expressa pelo construto hebraico, sem excluir a dimensão ancestral.
- source_word: בְּהַר שֵׂעִיר
  choice: na região montanhosa de Seir
  rationale: No contexto geográfico, הַר pode designar uma região serrana, e não necessariamente um único monte; a formulação é natural e mantém essa leitura contextual.
