  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: pt
  text: O chefe Corá, o chefe Gaetã, o chefe Amaleque — estes são os chefes de Elifaz na terra de Edom; estes são os filhos de Ada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף (ʾallûf)
  choice: chefe
  rationale: No contexto das genealogias de Edom, designa um líder de clã ou grupo tribal; “chefe” preserva a função sem impor um título político mais específico.
- source_word: גַּעְתָּם (Gaʿtām)
  choice: Gaetã
  rationale: Transliteração portuguesa do nome hebraico, distinguindo as consoantes e usando terminação nasal natural em português.
- source_word: בְּנֵי (benê)
  choice: filhos
  rationale: Mantém o sentido genealógico direto do hebraico, embora em listas desse tipo possa abranger descendentes.
theological_decisions:
- issue: Relação genealógica expressa por “filhos de Ada”
  choice: filhos de Ada
  alternative: descendentes de Ada
  rationale: A tradução formal preserva a formulação hebraica e sua possível abrangência genealógica, sem resolver além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno. A repetição de “o chefe” reproduz a estrutura enfática da lista hebraica; os nomes seguem formas portuguesas usuais ou transliterações adaptadas.
