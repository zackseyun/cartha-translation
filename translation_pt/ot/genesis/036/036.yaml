  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: pt
  text: Hadade morreu, e Samlá, de Masreca[a], reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proveniente de Masreca”. A preposição hebraica pode indicar origem ou associação com um lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות apresenta o acontecimento seguinte na sequência narrativa; “morreu” é a forma natural e concisa nesta fórmula de sucessão real.
- source_word: הֲדָד
  choice: Hadade
  rationale: O nome pessoal é transliterado conforme a forma tradicional e legível em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: מלך é o verbo usual para exercer o governo real; “reinou” preserva a concisão da fórmula hebraica.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: תחת com sufixo pronominal indica substituição ou sucessão; “em seu lugar” conserva esse sentido melhor do que a expressão meramente temporal “depois dele”.
- source_word: שַׂמְלָה
  choice: Samlá
  rationale: O nome pessoal é transliterado em forma natural para leitores de português, com acento que orienta a pronúncia.
- source_word: מִמַּשְׂרֵקָה
  choice: de Masreca
  rationale: A preposição מִן pode indicar origem ou associação com um lugar; “de Masreca” é natural em português e mantém abertas essas duas nuances.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a estrutura concisa própria de uma lista de sucessão real. O marcador da nota foi colocado junto a “Masreca”, termo ao qual a alternativa lexical efetivamente se refere.
