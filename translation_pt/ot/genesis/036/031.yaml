  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: pt
  text: Estes são os reis que reinaram na terra de Edom, antes que um rei reinasse sobre os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que um rei reinasse para os filhos de Israel”; também se pode traduzir “sobre os israelitas”. O hebraico diz literalmente “antes que um rei reinasse para/sobre os filhos de Israel”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A expressão apresenta uma nova lista. A conjunção hebraica pode ficar implícita em português, sem perder a função introdutória.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: os reis que reinaram
  rationale: Preserva o artigo definido e traduz o verbo מלך pelo equivalente natural e preciso “reinar”.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Mantém explicitamente o substantivo אֶרֶץ e seu sentido territorial.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: antes que um rei reinasse
  rationale: Expressa naturalmente a relação temporal e conserva o singular indefinido do hebraico, sem ampliá-lo para “qualquer rei”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sobre os filhos de Israel
  rationale: “Filhos de Israel” preserva a forma da expressão hebraica; “sobre” explicita a relação de governo naturalmente associada ao verbo “reinar”, enquanto a nota registra a amplitude da preposição לְ.
theological_decisions:
- issue: Sentido de לְ em לִבְנֵי יִשְׂרָאֵל
  choice: sobre os filhos de Israel
  alternative: para os filhos de Israel
  rationale: No contexto de realeza, “sobre” comunica de modo natural a autoridade régia, mas o hebraico também admite formalmente “para”; a nota preserva essa ambiguidade.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma literal é clara e digna em português e mantém a expressão genealógica do texto, embora ela funcione também como designação coletiva do povo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A vírgula antes da oração temporal ajuda a leitura sem alterar a estrutura do versículo.
