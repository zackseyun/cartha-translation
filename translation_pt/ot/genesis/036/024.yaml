  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: pt
  text: 'Estes são os filhos de Zibeão: Aiá e Aná. Este é o Aná que encontrou os yemim[a] no deserto, quando apascentava os jumentos para seu pai, Zibeão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O significado do hebraico yemim é incerto. O termo tem sido entendido como “fontes termais” ou, em algumas interpretações antigas e posteriores, “mulas”. O texto principal conserva o termo hebraico porque as evidências lexicais não são conclusivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: filhos de
  rationale: No contexto genealógico, designa diretamente os filhos homens e corresponde de modo natural à construção hebraica.
- source_word: צִבְעוֹן
  choice: Zibeão
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: אַיָּה
  choice: Aiá
  rationale: Transliteração portuguesa clara do nome próprio, com acento para indicar a tonicidade.
- source_word: עֲנָה
  choice: Aná
  rationale: Transliteração portuguesa consistente do nome próprio, com indicação natural da tonicidade.
- source_word: הוּא עֲנָה
  choice: Este é o Aná
  rationale: Reproduz a função identificadora da expressão, distinguindo este Aná no contexto genealógico.
- source_word: מָצָא
  choice: encontrou
  rationale: Equivalente comum e direto do verbo hebraico, sem acrescentar a ideia mais específica de descoberta deliberada.
- source_word: הַיֵּמִם
  choice: yemim
  rationale: O termo hebraico é raro e de significado incerto; sua transliteração evita impor no texto uma interpretação lexical disputada.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, 'deserto' expressa naturalmente a região erma ou pouco habitada indicada por מִדְבָּר, sem exigir que seja totalmente árida.
- source_word: בִּרְעֹתוֹ
  choice: quando apascentava
  rationale: Expressa a ação simultânea indicada pela construção hebraica e se aplica adequadamente ao cuidado dos jumentos.
- source_word: הַחֲמֹרִים
  choice: os jumentos
  rationale: Termo moderno, comum e inequívoco em português para os animais mencionados.
- source_word: לְצִבְעוֹן אָבִיו
  choice: de seu pai Zibeão
  rationale: Com 'jumentos', a construção portuguesa comunica naturalmente que os animais pertenciam ao pai, preservando a relação expressa pelo hebraico.
