  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: pt
  text: Assim, Esaú se estabeleceu na região montanhosa de Seir[a]; Esaú é Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morou nas montanhas de Seir” ou “habitou no monte Seir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: O verbo ישׁב, nesta forma narrativa, expressa habitar ou fixar residência. No contexto da mudança de Esaú para essa região, “se estabeleceu” comunica naturalmente a ideia sem excluir o sentido básico de morar.
- source_word: בְּהַר
  choice: na região montanhosa de
  rationale: הַר pode designar tanto um monte quanto uma região de montanhas. Como Seir é aqui um território, “região montanhosa” evita sugerir necessariamente um único pico e preserva a amplitude geográfica do hebraico.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Nome geográfico transliterado segundo a forma tradicional em português.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Nome próprio vertido segundo a forma tradicional em português.
- source_word: הוּא אֱדוֹם
  choice: Esaú é Edom
  rationale: A frase nominal hebraica identifica diretamente Esaú com Edom. A formulação concisa preserva a nota genealógica e a estrutura enfática do original.
