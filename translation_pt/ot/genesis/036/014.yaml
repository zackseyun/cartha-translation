  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: pt
  text: 'E estes foram os filhos de Oolibama, filha de Aná, filha de Zibeão, mulher de Esaú: ela deu à luz, para Esaú, Jeús, Jalão e Corá.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes
  rationale: Preserva tanto o conectivo ו como a força demonstrativa de אֵלֶּה na introdução da nota genealógica.
- source_word: הָיוּ
  choice: foram
  rationale: Neste contexto genealógico, היה funciona como cópula no passado; “foram” é direto e natural em português.
- source_word: בְּנֵי
  choice: filhos
  rationale: Os referentes imediatos são homens nomeados, por isso “filhos” é mais preciso do que “filhos e filhas” ou “descendentes”.
- source_word: אָהֳלִיבָמָה
  choice: Oolibama
  rationale: Transliteração tradicional e reconhecível em português do nome próprio hebraico.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: filha de Aná, filha de Zibeão
  rationale: Mantém a repetição hebraica de בַת e preserva a forma genealógica sem interpretá-la explicitamente como “neta”.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mulher de Esaú
  rationale: Expressão portuguesa clara e digna para a relação conjugal indicada pelo construto hebraico.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: ela deu a Esaú
  rationale: Em contexto de maternidade e após a identificação dos filhos, traduz naturalmente ילד com לְ, conservando a ideia relacional de que ela os deu à luz para Esaú sem repetir de modo pesado “deu à luz”.
- source_word: יעיש
  choice: Jeús
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: יַעְלָם
  choice: Jalão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma portuguesa tradicional do nome próprio.
