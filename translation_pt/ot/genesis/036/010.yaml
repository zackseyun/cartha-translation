base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: pt
  text: 'Estes são os nomes dos filhos de Esaú: Elifaz, filho de Ada, esposa de Esaú; Reuel, filho de Basemate, esposa de Esaú.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Estes são os nomes
  rationale: A fórmula apresentativa hebraica é reproduzida em português natural, com a cópula exigida pela sintaxe corrente.
- source_word: בְּנֵי עֵשָׂו
  choice: filhos de Esaú
  rationale: בְּנֵי é masculino plural e, neste contexto genealógico, designa especificamente os filhos homens nomeados a seguir.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Forma tradicional e reconhecível em português para o nome hebraico.
- source_word: בֶּן עָדָה
  choice: filho de Ada
  rationale: בֶּן expressa filiação direta; a construção sem artigo é natural em aposição genealógica portuguesa.
- source_word: אֵשֶׁת עֵשָׂו
  choice: esposa de Esaú
  rationale: A expressão construta significa literalmente 'mulher de Esaú'; 'esposa' comunica de modo claro e atual a relação conjugal pretendida e preserva-se sua repetição nas duas ocorrências.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Transliteração portuguesa direta e tradicional do nome hebraico.
- source_word: בֶּן בָּשְׂמַת
  choice: filho de Basemate
  rationale: Mantém em paralelo a mesma construção de filiação usada anteriormente.
- source_word: בָּשְׂמַת
  choice: Basemate
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
