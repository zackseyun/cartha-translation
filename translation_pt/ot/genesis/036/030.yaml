base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: pt
  text: Chefe Disom, chefe Eser, chefe Disã — esses foram os chefes dos horeus, segundo seus clãs[a], na terra de Seir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo seus chefes”. O hebraico pode indicar uma classificação pelos líderes tribais ou pelas divisões que eles chefiavam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: Em Gênesis 36, o termo designa um líder tribal ou de clã. “Chefe” é claro, atual e preserva a repetição da lista hebraica.
- source_word: דִּשֹׁן
  choice: Disom
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português, mantendo-o distinto de דִּישָׁן.
- source_word: אֵצֶר
  choice: Eser
  rationale: Nome próprio transliterado de modo natural em português.
- source_word: דִּישָׁן
  choice: Disã
  rationale: Nome próprio transliterado de modo a distingui-lo de Disom, como faz o hebraico.
- source_word: אֵלֶּה
  choice: esses foram
  rationale: A oração hebraica não tem verbo expresso; o passado é natural neste resumo genealógico.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: os chefes dos horeus
  rationale: הַחֹרִי designa o povo horeu; o plural gentílico é a forma natural em português.
- source_word: לְאַלֻּפֵיהֶם
  choice: segundo seus clãs
  rationale: Neste resumo classificatório, אַלּוּף pode estender-se da pessoa do chefe à unidade tribal por ele liderada. “Segundo seus clãs” evita uma repetição opaca, enquanto a nota preserva a leitura mais literal.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: na terra de Seir
  rationale: Expressão geográfica formal e natural que preserva o substantivo אֶרֶץ.
