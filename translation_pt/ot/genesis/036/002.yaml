  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: pt
  text: 'Esaú tomou suas esposas dentre as filhas de Canaã: Ada, filha de Elom, o hitita, e Oolibama, filha de Aná, filha de Zibeão, o heveu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “o heveu”. Alguns intérpretes harmonizam esta informação com genealogias relacionadas e entendem a linhagem de outra maneira, incluindo “o horeu”.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: tomou
  rationale: Preserva o sentido básico do verbo hebraico sem explicitar além do texto a ideia de casamento, já indicada por “suas mulheres”.
- source_word: נָשָׁיו
  choice: suas mulheres
  rationale: No contexto, o termo designa as mulheres de Esaú, isto é, suas esposas; “suas mulheres” mantém a formulação simples e corrente da narrativa bíblica.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: dentre as filhas de Canaã
  rationale: Conserva o idiomatismo hebraico “filhas de Canaã” e expressa com naturalidade a origem das mulheres.
- source_word: בַּת עֲנָה בַּת צִבְעוֹן
  choice: filha de Aná e neta de Zibeão
  rationale: A repetição hebraica de “filha de” indica aqui dois níveis genealógicos; “neta” torna a relação clara em português sem alterar a linhagem apresentada.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: “Hitita” é a designação étnica consagrada e corresponde diretamente ao hebraico.
- source_word: אָהֳלִיבָמָה
  choice: Oolibama
  rationale: Forma tradicional e reconhecível do nome em português, compatível com a vocalização hebraica.
- source_word: הַחִוִּי
  choice: o heveu
  rationale: Segue o texto massorético, que traz a designação “heveu”, sem harmonizá-la silenciosamente com referências genealógicas relacionadas.
theological_decisions:
- issue: Designação étnica na oração final
  choice: 'Seguir o texto massorético: “o heveu”.'
  alternative: “O horeu”, conforme uma harmonização com genealogias relacionadas, especialmente Gênesis 36:20.
  rationale: Embora não seja uma questão doutrinária, há uma tensão genealógica relevante. O texto principal deve refletir o hebraico recebido, enquanto a nota registra a alternativa sem resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em traduções bíblicas lusófonas. A construção “dentre as filhas de Canaã” preserva o sabor genealógico do hebraico sem soar excessivamente arcaica.
