  naturalness: A redação é clara e de registro bíblico moderno. A repetição "filha de" é aceitável em uma genealogia e é necessária aqui para preservar a forma e a ambiguidade do texto-fonte. "Tomou suas esposas dentre as filhas de Canaã" permanece natural em português bíblico contemporâneo.
  terminology: '"Esaú", "Canaã", "Ada", "Elom", "Oolibama", "Aná", "Zibeão", "hitita" e "heveu" são formas adequadas. O texto principal conserva corretamente "o heveu", conforme o texto massorético; a nota registra a questão genealógica/étnica sem a resolver.'
