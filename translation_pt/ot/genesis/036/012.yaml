  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: pt
  text: Timna era concubina de Elifaz, filho de Esaú, e deu a Elifaz um filho, Amaleque. Estes são os descendentes de Ada[a], mulher de Esaú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Ada”. Em genealogias, a palavra hebraica traduzida por “filhos” também pode designar descendentes de gerações posteriores; neste contexto, trata-se dos filhos de Elifaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִמְנַע
  choice: Timna
  rationale: Nome próprio transliterado segundo o uso português; a conjunção inicial fica naturalmente implícita no começo da frase.
- source_word: הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז
  choice: era concubina de Elifaz
  rationale: היה funciona aqui como cópula, e פִילֶגֶשׁ designa uma mulher numa união reconhecida, porém de condição subordinada; “concubina” preserva essa distinção social.
- source_word: בֶּן עֵשָׂו
  choice: filho de Esaú
  rationale: Tradução direta e natural da cadeia construta.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: e deu a Elifaz um filho, Amaleque
  rationale: Expressa em português corrente a construção genealógica com ל, que identifica Elifaz como pai, sem o pouco natural “deu à luz Amaleque a Elifaz”.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Estes são os descendentes de Ada
  rationale: בָּנִים pode abranger descendentes, não apenas filhos imediatos. O contexto identifica os homens mencionados como filhos de Elifaz e, portanto, descendentes de Ada; a nota conserva a forma literal.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mulher de Esaú
  rationale: Forma idiomática e digna para identificar a relação conjugal de Ada.
theological_decisions:
- issue: Alcance genealógico de בְּנֵי em relação a Ada
  choice: descendentes de Ada
  alternative: filhos de Ada
  rationale: A escolha evita restringir semanticamente o hebraico a filhos imediatos, pois os nomes do contexto pertencem à geração seguinte por meio de Elifaz. A alternativa literal é registrada em nota para preservar a forma e a ambiguidade do original.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A construção do nascimento foi naturalizada sem omitir a identificação do pai; a fórmula genealógica mantém o presente do hebraico.
