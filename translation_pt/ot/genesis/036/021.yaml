  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: pt
  text: e Disom, Éser e Disã. Esses são os chefes[a] dos horeus, filhos de Seir, na terra de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes de clãs”.
    reason: Alternativa lexical que explicita que אַלּוּפִים se refere aos líderes sociopolíticos de grupos, e não apenas a pessoas de destaque.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Disom
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português, distinguindo-o de דִישָׁן.
- source_word: אֵצֶר
  choice: Eser
  rationale: Nome próprio transliterado de modo natural em português.
- source_word: דִישָׁן
  choice: Disã
  rationale: Nome próprio transliterado segundo a forma tradicional em português, preservando a distinção em relação a Disom.
- source_word: אֵלֶּה
  choice: Esses são
  rationale: O demonstrativo plural introduz uma fórmula de identificação; em português, explicita-se naturalmente a cópula.
- source_word: אַלּוּפֵי
  choice: chefes
  rationale: No contexto de Gênesis 36, designa líderes sociopolíticos de clãs ou grupos; “chefes” é atual, claro e não tão específico quanto “chefes tribais”.
- source_word: הַחֹרִי
  choice: dos horeus
  rationale: Embora a forma hebraica seja morfologicamente singular, funciona coletivamente como designação étnica; o plural é natural em português.
- source_word: בְּנֵי שֵׂעִיר
  choice: filhos de Seir
  rationale: Mantém a expressão genealógica formal e sua ênfase na linhagem, sem a interpretar explicitamente como “descendentes”.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Preserva a formulação geográfica completa do hebraico, incluindo “terra”.
