  text: 'Estes são os filhos de Disã: Uz e Arã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz a lista genealógica. Como a oração hebraica não traz verbo expresso, “Estes são” reproduz a fórmula de modo natural em português.
- source_word: בְנֵי
  choice: os filhos de
  rationale: No contexto genealógico, o termo designa os descendentes masculinos nomeados imediatamente a seguir; “os filhos de” é a formulação mais direta e específica.
- source_word: דִישָׁן
  choice: Disã
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: עוּץ
  choice: Uz
  rationale: Nome próprio transliterado pela forma bíblica tradicional em português.
- source_word: וַאֲרָן
  choice: e Arã
  rationale: A conjunção ו coordena o segundo nome da lista; אֲרָן é transliterado pela forma tradicional portuguesa “Arã”.
