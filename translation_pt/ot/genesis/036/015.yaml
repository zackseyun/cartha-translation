source:
  edition: WLC
  text: אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: pt
  text: 'Estes são os chefes[a] dos filhos de Esaú: filhos de Elifaz, o primogênito de Esaú: o chefe Temã, o chefe Omar, o chefe Zefô e o chefe Quenaz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de clã”. O título hebraico também já foi traduzido por “duques”, termo hoje arcaico e com conotações anacrônicas neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefes / chefe
  rationale: No contexto das genealogias edomitas, o termo designa líderes de clãs ou grupos tribais. “Chefe” conserva a função de título, é claro em português moderno e evita o anacrônico “duque”.
- source_word: בְנֵי
  choice: filhos de
  rationale: A tradução formal preserva a expressão genealógica hebraica; embora possa abranger descendentes, neste contexto os nomes apresentados são os filhos de Elifaz já enumerados anteriormente.
- source_word: בְּכוֹר
  choice: primogênito
  rationale: Equivalente português preciso, que preserva tanto a ordem de nascimento quanto as possíveis implicações de posição familiar.
- source_word: אֵלֶּה
  choice: Estes são
  rationale: Expressa naturalmente em português a fórmula nominal introdutória hebraica.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Transliteração tradicional do nome em português.
- source_word: תֵּימָן
  choice: Temã
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: אוֹמָר
  choice: Omar
  rationale: Transliteração direta e reconhecível do nome.
- source_word: צְפוֹ
  choice: Zefô
  rationale: Forma portuguesa que representa o nome hebraico צְפוֹ e o distingue com a tonicidade final indicada.
- source_word: קְנַז
  choice: Quenaz
  rationale: Forma tradicional do nome em traduções portuguesas, ajustada à ortografia do idioma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas tradicionais dos nomes bíblicos. O ponto após “Esaú” respeita a pausa principal do hebraico e permite que a primeira oração funcione como cabeçalho da seção; a segunda frase mantém a estrutura concisa de lista do original. A repetição de “o chefe” reproduz o caráter formular de אַלּוּף diante de cada nome.
