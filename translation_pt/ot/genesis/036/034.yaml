base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: pt
  text: Jobabe morreu, e Husão, da terra dos temanitas[a], reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “da terra de Temã” ou “da terra do temanita”. A forma gentílica hebraica pode se referir tanto à região associada a Temã quanto ao seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות apresenta o acontecimento seguinte na sequência narrativa; “morreu” é a forma simples e natural em português.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Transliteração tradicional e reconhecível do nome próprio hebraico em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Neste formulário de sucessão régia, מלך indica que alguém passou a exercer a realeza; “reinou” mantém a concisão e o padrão do capítulo.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica substituição ou sucessão no cargo, sentido transmitido naturalmente por “em seu lugar”.
- source_word: חֻשָׁם
  choice: Husão
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: A preposição מן com אֶרֶץ indica procedência geográfica; “da terra” é natural e conserva essa relação.
- source_word: הַתֵּימָנִי
  choice: dos temanitas
  rationale: A forma gentílica relaciona Husão a Temã ou ao seu povo. Depois de “terra”, o plural coletivo “dos temanitas” produz uma leitura clara sem eliminar as demais possibilidades, registradas em nota.
