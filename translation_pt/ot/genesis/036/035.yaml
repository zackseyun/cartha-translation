base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: pt
  text: Husã morreu, e Hadade, filho de Bedade, que feriu Midiã no campo de Moabe[a], reinou em seu lugar; e o nome de sua cidade era Avite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Campo de Moabe” também pode ser entendido como “região” ou “território de Moabe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות denota diretamente a morte; “morreu” é claro, natural e evita eufemismo.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Preserva tanto o sentido régio de מלך quanto a relação de sucessão expressa por תחתיו.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadade, filho de Bedade
  rationale: Translitera os nomes conforme formas portuguesas usuais e traduz בן pela fórmula genealógica natural “filho de”.
- source_word: הַמַּכֶּה
  choice: Foi ele quem derrotou
  rationale: O particípio hifil de נכה caracteriza Hadade por uma ação militar. “Derrotou” comunica naturalmente o sentido contextual; a tradução mais literal “feriu” é registrada em nota.
- source_word: אֶת מִדְיָן
  choice: Midiã
  rationale: Mantém o nome próprio coletivo do texto hebraico sem explicitar interpretativamente “os midianitas”.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: no território de Moabe
  rationale: Neste uso geográfico, שׂדה pode designar campo, região ou território. “Território” é claro em português e evita sugerir um único campo agrícola.
- source_word: וְשֵׁם עִירוֹ
  choice: e o nome da sua cidade era
  rationale: Reproduz de modo natural e digno a fórmula hebraica de identificação de cidade.
- source_word: עֲוִית
  choice: Avite
  rationale: Transliteração adaptada à ortografia e pronúncia portuguesas, coerente com formas bíblicas correntes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A divisão em duas frases reduz a ambiguidade do relativo sem alterar a identificação de Hadade; a nota preserva a forma mais literal e a amplitude lexical de נכה e שׂדה.
