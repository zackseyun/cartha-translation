  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: pt
  text: Bela, filho de Beor, reinou em Edom[a], e o nome de sua cidade era Dinhabá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reinou sobre Edom”. O hebraico diz literalmente “reinou em Edom”, com a preposição indicando o âmbito ou local; em português, o domínio real também pode ser expresso por “sobre Edom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Neste contexto de lista de reis, a forma verbal de מלך descreve o exercício da realeza e possivelmente inclui a ideia de ascensão ao trono. “Reinou” é a formulação natural e digna em português para esse tipo de notícia régia.
- source_word: בֶּאֱדוֹם
  choice: em Edom
  rationale: A preposição ב marca diretamente o âmbito ou local do reinado. “Em Edom” preserva a forma hebraica, enquanto “sobre Edom” explicita de modo legítimo o domínio régio e é registrado em nota.
- source_word: בֶּלַע
  choice: Bela
  rationale: Nome próprio pessoal transliterado segundo a forma tradicional e corrente em português bíblico.
- source_word: בֶּן בְּעוֹר
  choice: filho de Beor
  rationale: Reproduz diretamente a construção genealógica hebraica sem acrescentar informação.
- source_word: וְשֵׁם
  choice: e o nome de
  rationale: Mantém de maneira natural a estrutura da frase hebraica que introduz a identificação da cidade.
- source_word: עִירוֹ
  choice: sua cidade
  rationale: Representa o sufixo masculino singular explícito no hebraico, indicando a cidade associada a Bela, provavelmente como sede ou residência de seu governo.
- source_word: דִּנְהָבָה
  choice: Dinhabá
  rationale: Nome próprio de lugar transliterado com acento gráfico para indicar em português a tonicidade final refletida pela forma hebraica.
