base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: pt
  text: 'E estes foram os filhos de Aolibama, mulher de Esaú: o chefe Jeús, o chefe Jalão e o chefe Corá. Esses foram os chefes de Aolibama, filha de Aná e mulher de Esaú.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: O masculino plural construto refere-se aqui aos filhos homens nomeados, não genericamente a descendentes.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mulher de Esaú
  rationale: Expressão natural e tradicional em português para a relação conjugal; é mantida nas duas ocorrências.
- source_word: אַלּוּף
  choice: chefe
  rationale: Em Gênesis 36, designa o líder de um agrupamento ou clã edomita. “Chefe” é claro e não amplia indevidamente o hebraico.
- source_word: יְעוּשׁ
  choice: Jeús
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: יַעְלָם
  choice: Jalão
  rationale: Forma portuguesa corrente do nome hebraico.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma portuguesa corrente do nome hebraico.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Esses foram os chefes de
  rationale: Mantém a relação ampla e não explicitada do construto hebraico, sem acrescentar “descendentes de”.
- source_word: בַּת עֲנָה
  choice: filha de Aná
  rationale: Tradução direta da construção nominal hebraica.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: E estes foram... Esses foram
  rationale: Reproduz o enquadramento genealógico repetido; o passado se ajusta naturalmente ao contexto narrativo português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe genealógica clara. O artigo antes de cada título evita que “chefe” pareça parte do nome próprio. Não se acrescentou uma nota lexical porque “chefe” comunica adequadamente o sentido no contexto; a possibilidade mais específica de “chefe de clã” permanece registrada nas decisões lexicais.
