  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: pt
  text: O chefe Magdiel, o chefe Irã. Estes são os chefes de Edom, segundo os seus lugares de moradia, na terra que possuíam.[a] Este é Esaú, o pai de Edom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na terra de sua propriedade».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, Esaú foi o antepassado dos edomitas.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: No contexto de Gênesis 36, designa líderes tribais ou de clãs edomitas. “Chefe” é atual, conciso e mantém o título de liderança sem recorrer ao arcaico “duque”.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nome próprio transliterado segundo o uso corrente em português.
- source_word: עִירָם
  choice: Irã
  rationale: Nome próprio transliterado em forma tradicional e legível em português bíblico; não deve ser confundido com o nome moderno do país, embora a grafia coincida.
- source_word: אֵלֶּה אַלּוּפֵי אֱדֹם
  choice: Esses são os chefes de Edom
  rationale: A expressão resume a lista anterior. O presente preserva o estilo identificador do hebraico, e a repetição de “chefes” mantém a coerência lexical.
- source_word: לְמֹשְׁבֹתָם
  choice: segundo os seus assentamentos
  rationale: O לְ indica aqui classificação ou distribuição. “Assentamentos” expressa lugares estabelecidos de habitação e é mais natural que “habitações” neste contexto territorial.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: na terra que possuíam
  rationale: Expressa naturalmente em português a ideia de אֲחֻזָּה como propriedade ou posse territorial, evitando a formulação pouco idiomática “terra de sua possessão”.
- source_word: הוּא עֵשָׂו
  choice: Esse é Esaú
  rationale: O pronome funciona como identificação conclusiva do conjunto precedente. “Esse” evita que a frase seja entendida como referência exclusiva ao último nome da lista.
- source_word: אֲבִי אֱדֹם
  choice: o pai de Edom
  rationale: Preserva o idioma genealógico hebraico, no qual “pai” pode significar progenitor ou antepassado de um povo.
theological_decisions:
- issue: Título genealógico de Esaú como progenitor de Edom
  choice: o pai de Edom
  alternative: o antepassado dos edomitas
  rationale: A formulação literal conserva a relação genealógica e étnica do texto sem acrescentar interpretação doutrinária; uma nota esclarece que “pai” tem sentido ancestral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o estilo conciso de lista e resumo do hebraico. Os artigos antes dos títulos tornam a sequência natural em português.
