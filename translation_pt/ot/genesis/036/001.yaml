  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: pt
  text: Estas são as gerações de Esaú (isto é, Edom).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E estas são as gerações de Esaú; ele é Edom”.'
    reason: Alternativa lexical e sintática que conserva explicitamente a conjunção וְ e traduz הוּא de modo mais literal.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: A fórmula introduz uma nova seção. Em português, “Estas são” conserva o demonstrativo e soa natural; a força conectiva de וְ pode ficar implícita neste cabeçalho.
- source_word: תֹּלְדוֹת
  choice: as gerações de
  rationale: Mantém a ligação formal com a fórmula estrutural recorrente em Gênesis e preserva a amplitude do termo, sem restringi-lo apenas a descendentes ou a um relato.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הוּא
  choice: isto é
  rationale: Expressa naturalmente em português a identificação apositiva de Esaú com Edom, sem ocultar em nota a possibilidade da construção mais literal “ele é”.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mantém o nome próprio tradicional, que aqui identifica Esaú com Edom.
theological_decisions:
- issue: Sentido da fórmula תֹּלְדוֹת em Gênesis
  choice: as gerações de
  alternative: a história de; os descendentes de
  rationale: A escolha preserva o termo estrutural recorrente e evita decidir se o cabeçalho aponta exclusivamente para a narrativa ou para a descendência.
- issue: Relação expressa por הוּא entre Esaú e Edom
  choice: isto é, Edom
  alternative: ele é Edom
  rationale: A leitura principal apresenta a identificação de modo idiomático, enquanto a nota conserva a sintaxe mais literal e sua possível força declarativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Gerações” foi mantido por sua função literária em Gênesis, embora seja menos coloquial que “descendentes”.
