translation:
  language: pt
  text: Ada deu à luz Elifaz, filho de Esaú, e Basemate deu à luz Reuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: deu ... um filho / deu à luz
  rationale: As duas formas vêm de ילד, “dar à luz, gerar”. A formulação varia naturalmente em português sem alterar o sentido; na primeira oração, “um filho chamado” evita a construção pouco idiomática “deu Elifaz a Esaú”.
- source_word: לְעֵשָׂו
  choice: a Esaú
  rationale: A preposição ל, com ילד em contexto genealógico, indica aqui o pai. A construção “deu a Esaú um filho” expressa essa relação com clareza e naturalidade.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Transliteração tradicional e reconhecível do nome hebraico em português.
- source_word: בָשְׂמַת
  choice: Basemate
  rationale: Forma tradicional portuguesa que representa o nome hebraico e mantém boa legibilidade.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Transliteração direta e tradicional do nome conforme a forma do texto massorético.
- source_word: וּ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois relatos de nascimento.
