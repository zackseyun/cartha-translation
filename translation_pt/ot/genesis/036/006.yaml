  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: pt
  text: E Esaú levou consigo suas esposas, seus filhos, suas filhas e todas as pessoas de sua casa, bem como seu gado, todos os seus animais e todos os bens que havia adquirido na terra de Canaã. Então foi para uma terra[a] por causa de seu irmão Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para uma terra”. Alguns manuscritos e versões antigas apoiam “para a terra de Seir”; muitas traduções vertem a expressão pelo contexto como “para outra terra”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: levou consigo
  rationale: Embora לָקַח signifique literalmente “tomou”, no contexto de uma migração “levou consigo” expressa com naturalidade que Esaú fez pessoas e bens partirem com ele.
- source_word: נָשָׁיו
  choice: suas mulheres
  rationale: O termo designa as mulheres de Esaú, isto é, suas esposas. “Suas mulheres” é corrente na narrativa bíblica e evita uma formulação excessivamente técnica.
- source_word: בָּנָיו וְאֶת־בְּנֹתָיו
  choice: seus filhos, suas filhas
  rationale: Mantém a distinção explícita do hebraico entre descendentes masculinos e femininos.
- source_word: כָּל־נַפְשׁוֹת בֵּיתוֹ
  choice: todas as pessoas de sua casa
  rationale: נֶפֶשׁ, nesta expressão, refere-se a pessoas do grupo doméstico; “pessoas” evita introduzir a noção teológica posterior de almas separadas do corpo.
- source_word: מִקְנֵהוּ
  choice: seu gado
  rationale: מִקְנֶה designa coletivamente os animais mantidos como propriedade. “Gado” é uma expressão natural e ampla no contexto.
- source_word: כָּל־בְּהֶמְתּוֹ
  choice: todos os seus animais
  rationale: בְּהֵמָה é um termo amplo para animais, especialmente domésticos; a escolha preserva alguma distinção em relação a מִקְנֶה.
- source_word: כָּל־קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: todos os bens que havia adquirido
  rationale: A expressão abrange as propriedades adquiridas por Esaú; o mais-que-perfeito composto apresenta com clareza a aquisição anterior à partida.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Conserva a designação geográfica formal presente no hebraico.
- source_word: אֶל־אֶרֶץ
  choice: para uma terra
  rationale: Traduz sem especificação adicional a leitura do texto massorético, preservando sua indeterminação em vez de inserir “outra” ou “Seir” no texto principal.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: por causa de seu irmão Jacó
  rationale: מִפְּנֵי pode ter sentido espacial ou causal. O versículo seguinte explica a separação pela impossibilidade de ambos permanecerem juntos, favorecendo aqui a nuance causal sem negar que houve afastamento.
theological_decisions:
- issue: Nuance de מִפְּנֵי na separação entre Esaú e Jacó
  choice: por causa de seu irmão Jacó
  alternative: afastando-se de seu irmão Jacó
  rationale: 'A formulação causal mantém a tensão narrativa: Jacó foi a razão da partida, enquanto o contexto imediato esclarece que o problema era a quantidade de bens de ambos, não necessariamente hostilidade pessoal.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A longa coordenação hebraica foi dividida em duas frases para maior clareza, sem alterar a sequência narrativa.
