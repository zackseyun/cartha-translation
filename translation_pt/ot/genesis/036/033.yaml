  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: pt
  text: Belá morreu, e Jobabe, filho de Zerá, de Bozra, reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת בָּלַע
  choice: Bela morreu
  rationale: O wayyiqtol de מוּת dá continuidade à sequência narrativa; em português, a ordem sujeito-verbo é natural nesta fórmula de sucessão.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: מלך, nesta fórmula régia de sucessão, indica que Jobabe assumiu e exerceu o reinado; “reinou” é a forma concisa e tradicional em português.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: תחת com sufixo pronominal expressa a substituição do governante anterior e a sucessão ao cargo.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Forma portuguesa consagrada do nome próprio hebraico יוֹבָב.
- source_word: בֶּן זֶרַח
  choice: filho de Zerá
  rationale: A cadeia construta identifica Jobabe por seu patronímico; “Zerá” representa a acentuação final do hebraico זֶרַח.
- source_word: מִבָּצְרָה
  choice: de Bozra
  rationale: A preposição מִן pode indicar procedência ou vínculo com a cidade. Em português, “de Bozra” preserva naturalmente ambas as possibilidades sem forçar uma distinção.
