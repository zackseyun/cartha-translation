    text: Algumas tradições textuais e 1 Crônicas 1:50 trazem “Hadade”.
    reason: textual_variant
  - marker: b
    text: Em 1 Crônicas 1:50, o nome aparece como “Pai”.
    reason: textual_variant
  - marker: c
    text: 'Ou, explicitando a relação genealógica: “filha de Matrede, que era filha de Me-Zaabe”.'
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות denota diretamente a morte; “morreu” é claro, natural e evita eufemismo.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanã
  rationale: Transliteração tradicional e reconhecível do nome próprio hebraico, com hífen para representar o composto.
- source_word: בֶּן עַכְבּוֹר
  choice: filho de Acbor
  rationale: Reproduz de modo natural a relação genealógica expressa pela construção hebraica.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Expressa tanto o ato de reinar quanto a sucessão indicada por תַּחְתָּיו.
- source_word: הֲדַר
  choice: Hadar
  rationale: Segue a leitura do Texto Massorético fornecido; a variante “Hadade” é registrada em nota.
- source_word: וְשֵׁם עִירוֹ
  choice: O nome da sua cidade era
  rationale: Mantém a fórmula hebraica em português claro; a nova frase melhora a fluidez.
- source_word: פָּעוּ
  choice: Paú
  rationale: Translitera a forma massorética do topônimo, com acento para orientar a pronúncia em português.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: e o nome da sua mulher era
  rationale: Tradução próxima da fórmula hebraica e natural no registro narrativo bíblico.
- source_word: מְהֵיטַבְאֵל
  choice: Meetabel
  rationale: Transliteração portuguesa clara do nome próprio.
- source_word: בַּת מַטְרֵד
  choice: filha de Matrede
  rationale: Traduz diretamente a relação de descendência indicada por בַּת.
- source_word: בַּת מֵי זָהָב
  choice: filha de Me-Zaabe
  rationale: Preserva a repetição e a forma compacta do hebraico sem resolver silenciosamente a possível relação genealógica; a leitura explicitada é apresentada em nota.
