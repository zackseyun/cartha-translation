  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: pt
  text: Baal-Hanã, filho de Acbor, morreu, e Hadar[a] reinou em seu lugar. O nome da sua cidade era Paú[b], e o nome da sua mulher era Meetabel, filha de Matrede, filha de Me-Zaabe.[c]
  philosophy: optimal-equivalence
  footnotes:
