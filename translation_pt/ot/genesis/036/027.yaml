lexical_decisions:
- source_word: אֵצֶר
  choice: Eser
  rationale: Transliteração portuguesa do nome hebraico ʾĒṣer, usando s para צ neste contexto e evitando a grafia inglesa.
- source_word: בִּלְהָן
  choice: Bilã
  rationale: Forma aportuguesada do nome hebraico Bilhān, com terminação nasal natural em português.
- source_word: זַעֲוָן
  choice: Zaavã
  rationale: Transliteração próxima do hebraico Zaʿăwān, preservando as duas vogais em sequência e aportuguesando a terminação nasal.
- source_word: עֲקָן
  choice: Acã
  rationale: Forma aportuguesada de ʿĂqān; o c representa naturalmente o som /k/ antes de a, e a terminação nasal segue o uso português.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Equivalente direto da forma construta hebraica; no contexto genealógico, indica os descendentes imediatos enumerados.
