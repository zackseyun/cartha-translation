  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: pt
  text: 'E estes são os filhos de Reuel, filho de Esaú: o chefe Naate, o chefe Zerá, o chefe Samá e o chefe Mizá. Esses são os chefes[a] de Reuel na terra de Edom. Esses são os filhos de Basemate, mulher de Esaú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chefes de clã»; o termo hebraico repetido אַלּוּף designa um líder tribal edomita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Preserva a ligação narrativa marcada pela conjunção e a fórmula genealógica do hebraico.
- source_word: בְּנֵי
  choice: filhos de
  rationale: A lista apresenta descendentes masculinos nomeados, por isso a tradução direta é adequada.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Reuel, filho de Esaú
  rationale: Reproduz com clareza a identificação genealógica em aposição.
- source_word: אַלּוּף
  choice: chefe
  rationale: No contexto edomita, designa um líder tribal ou de clã; «chefe» é atual, claro e menos interpretativo que «chefe de clã» no texto principal.
- source_word: נַחַת
  choice: Naate
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: זֶרַח
  choice: Zerá
  rationale: Transliteração portuguesa clara do nome hebraico, com acento para orientar a pronúncia.
- source_word: שַׁמָּה
  choice: Samá
  rationale: Transliteração natural em português, com acento para indicar a tonicidade final.
- source_word: מִזָּה
  choice: Mizá
  rationale: Transliteração natural em português, com acento para indicar a tonicidade final.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Esses são os chefes de Reuel
  rationale: Mantém a frase resumitiva e a relação de construção do hebraico em português natural.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Conserva o substantivo explícito «terra» em vez de abreviar para «em Edom».
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basemate, mulher de Esaú
  rationale: Mantém a identificação da linhagem materna em forma aposicional clara e próxima do hebraico.
theological_decisions: []
