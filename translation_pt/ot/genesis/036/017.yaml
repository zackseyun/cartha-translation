  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém a repetição formular da genealogia e evita o arcaísmo «duque». O marcador [a] está ligado à ocorrência resumitiva de «chefes», mas a nota se aplica ao termo hebraico repetido ao longo do versículo.
