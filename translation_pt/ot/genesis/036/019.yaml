  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: pt
  text: Estes são os filhos de Esaú, e estes são os seus chefes[a]. Ele é Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes de seus clãs”. O termo hebraico se refere aos chefes de clãs ou grupos tribais em Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz um resumo genealógico; o presente reproduz naturalmente a oração nominal hebraica.
- source_word: בְנֵי
  choice: filhos de
  rationale: No contexto genealógico, o termo designa especificamente a descendência masculina imediata de Esaú.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאֵלֶּה
  choice: e estes são
  rationale: Mantém a ligação e o paralelismo explícito entre as duas orações hebraicas.
- source_word: אַלּוּפֵיהֶם
  choice: seus chefes
  rationale: Em Gênesis 36, o termo designa líderes de grupos tribais ou clãs edomitas; “chefes” é conciso, digno e compreensível.
- source_word: הוּא
  choice: Ele é
  rationale: Retoma pessoalmente Esaú e preserva a identificação direta expressa pelo pronome hebraico.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional do nome, que aqui identifica Esaú com Edom, ancestral epônimo dos edomitas.
