  text: כִּֽי הָיָ֧ה רְכוּשָׁ֛/ם רָ֖ב מִ/שֶּׁ֣בֶת יַחְדָּ֑ו וְ/לֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ לָ/שֵׂ֣את אֹתָ֔/ם מִ/פְּנֵ֖י מִקְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: pt
  text: Pois os bens deles eram numerosos demais para morarem juntos, e a terra em que residiam como estrangeiros[a] não podia sustentá-los[b] por causa dos seus rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra onde estavam morando”. O hebraico ressalta que ali residiam como estrangeiros, sem posse permanente da terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não podia carregá-los” ou “suportá-los”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da separação narrada no versículo anterior, preservando a função explicativa do hebraico.
- source_word: רְכוּשָׁם
  choice: os bens deles
  rationale: רְכוּשׁ designa posses ou propriedade, sobretudo bens móveis; esta formulação é ampla, clara e natural.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: eram numerosos demais para morarem juntos
  rationale: O adjetivo com מִן e o infinitivo expressa quantidade excessiva em relação à possibilidade de habitação conjunta. O plural 'numerosos' concorda naturalmente com 'bens'.
- source_word: אֶרֶץ מְגוּרֵיהֶם
  choice: a terra em que residiam como estrangeiros
  rationale: מְגוּרִים indica residência temporária ou condição de estrangeiro residente; a tradução preserva esse motivo sem recorrer ao pouco corrente 'peregrinação'.
- source_word: לָשֵׂאת אֹתָם
  choice: não podia sustentá-los
  rationale: נשא significa literalmente 'carregar' ou 'suportar'; tendo a terra como sujeito, 'sustentar' comunica naturalmente sua capacidade de manter pessoas e animais.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A expressão indica aqui a causa da incapacidade da terra.
- source_word: מִקְנֵיהֶם
  choice: seus rebanhos
  rationale: מִקְנֶה abrange animais domésticos mantidos como propriedade. 'Rebanhos' é corrente e adequado ao contexto, embora 'gado' também seja possível.
