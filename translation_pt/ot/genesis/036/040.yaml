base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: pt
  text: 'E estes são os nomes dos chefes de Esaú, segundo os seus clãs, segundo os seus lugares, por seus nomes: o chefe Timna[a], o chefe Alvá[b], o chefe Jetete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Timna também pode ser transliterado “Timná”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Alvá”; compare a forma relacionada “Aliá” em 1 Crônicas 1:51.'
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Preserva tanto a ligação narrativa expressa por וְ quanto a fórmula hebraica que introduz a lista.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefes / o chefe
  rationale: No contexto de Gênesis 36, designa líderes tribais ou de clãs edomitas. “Chefes” é claro e atual, sem sugerir um título nobiliárquico europeu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה indica aqui uma unidade de parentesco mais ampla do que a família doméstica; “clãs” se ajusta ao contexto tribal.
- source_word: לִמְקֹמֹתָם
  choice: segundo os seus lugares
  rationale: Mantém o sentido amplo de מָקוֹם e evita especificar “povoações” ou “territórios” além do que o hebraico afirma.
- source_word: בִּשְׁמֹתָם
  choice: pelos seus nomes
  rationale: Reproduz a mudança de preposição no hebraico e indica que os chefes são enumerados nominalmente.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Forma portuguesa simples e tradicional do nome hebraico, sem acrescentar uma consoante que não se pronuncia em português.
- source_word: עַלְוָה
  choice: Alvá
  rationale: Segue a forma do Texto Massorético neste versículo e usa acento para indicar com clareza a tonicidade em português.
- source_word: יְתֵת
  choice: Jetete
  rationale: Transliteração portuguesa corrente da forma hebraica, sem harmonizá-la com nomes semelhantes.
