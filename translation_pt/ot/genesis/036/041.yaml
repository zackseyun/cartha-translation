base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: pt
  text: O chefe Aolibama[a], o chefe Elá e o chefe Pinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chefe de clã»; o termo hebraico designa aqui um líder tribal ou de clã edomita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: Em Gênesis 36, o termo designa um líder tribal ou de clã edomita. «Chefe» é conciso, natural em português e preserva o ritmo da lista; a nota explicita a alternativa mais específica.
- source_word: אָהֳלִיבָמָה
  choice: Oolibama
  rationale: Transliteração portuguesa corrente do nome próprio hebraico, com forma facilmente reconhecível por leitores de língua portuguesa.
- source_word: אֵלָה
  choice: Elá
  rationale: O termo funciona aqui como nome próprio. O acento gráfico orienta a pronúncia portuguesa e evita a leitura como a forma verbal «ela».
- source_word: פִּינֹן
  choice: Pinom
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas, representando o nun final hebraico por «m», como é usual em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição de «o chefe» para reproduzir a estrutura enfática da lista hebraica. A conjunção antes do último nome torna a enumeração natural em português sem alterar seu conteúdo.
