base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: pt
  text: 'E estes foram os filhos de Reuel: Naate, Zerá, Samá e Mizá. Esses foram os filhos de Basemate, mulher de Esaú.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes foram
  rationale: Introduz o próximo grupo da genealogia. Em português, a forma verbal suprida pelo contexto produz uma abertura natural; a sequência narrativa torna dispensável traduzir mecanicamente a conjunção inicial.
- source_word: בְּנֵי רְעוּאֵל
  choice: os filhos de Reuel
  rationale: Os homens nomeados são apresentados como filhos imediatos de Reuel; «filhos» traduz com precisão o termo genealógico neste primeiro uso.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Naate, Zerá, Samá e Mizá
  rationale: Os nomes próprios são transliterados segundo formas portuguesas claras e correntes, preservando os acentos necessários à pronúncia.
- source_word: אֵלֶּה הָיוּ
  choice: Esses foram
  rationale: Representa naturalmente a fórmula genealógica no passado e distingue de modo fluido a retomada do grupo recém-enumerado.
- source_word: בְּנֵי בָשְׂמַת
  choice: os filhos de Basemate
  rationale: Mantém a repetição deliberada de בְּנֵי e a amplitude genealógica do hebraico, que pode designar descendentes sem explicitar o grau de parentesco.
- source_word: אֵשֶׁת עֵשָׂו
  choice: mulher de Esaú
  rationale: Forma idiomática e digna para identificar Basemate por sua relação conjugal com Esaú.
theological_decisions:
- issue: O segundo uso de בְּנֵי descreve os filhos de Reuel em relação a Basemate, sua avó.
  choice: filhos de Basemate
  alternative: netos de Basemate; descendentes de Basemate
  rationale: Embora «netos» esclareça a genealogia com base no contexto, o texto hebraico repete literalmente «filhos de». A tradução preserva essa elasticidade antiga da linguagem de parentesco, sem resolver silenciosamente a formulação do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação conserva a concisão e a repetição da fórmula genealógica hebraica; os nomes seguem transliterações portuguesas usuais.
