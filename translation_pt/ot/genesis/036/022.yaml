  text: וַ/יִּהְי֥וּ בְנֵי לוֹטָ֖ן חֹרִ֣י וְ/הֵימָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: pt
  text: Os filhos de Lotã foram Hori e Hemã[a]; e a irmã de Lotã foi Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Hemã”; a lista paralela em 1 Crônicas 1:39 traz “Homã”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Neste contexto genealógico, a forma de היה funciona como cópula simples; “foram” é natural e fiel em português.
- source_word: בְנֵי
  choice: filhos de
  rationale: A lista apresenta dois descendentes masculinos, por isso “filhos de” é mais preciso que “descendentes de”.
- source_word: לוֹטָן
  choice: Lotã
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico, com terminação nasal indicada por til.
- source_word: חֹרִי
  choice: Hori
  rationale: O nome pessoal é transliterado, não traduzido.
- source_word: הֵימָם
  choice: Hemã
  rationale: Representa a forma vocalizada do texto hebraico deste versículo; a lista paralela em 1 Crônicas 1:39 traz uma forma diferente.
- source_word: וַאֲחוֹת לוֹטָן תִּמְנָע
  choice: e a irmã de Lotã foi Timna
  rationale: A cópula é suprida em português a partir da estrutura da frase, produzindo uma formulação genealógica clara sem alterar o sentido.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliteração direta do nome pessoal hebraico, em forma natural para leitores de português.
theological_decisions: []
