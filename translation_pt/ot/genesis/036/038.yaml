base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: pt
  text: Shaul[a] morreu, e Baal-Hanã, filho de Acbor, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Versões portuguesas tradicionais geralmente grafam este nome como «Saul». Aqui, «Shaul» reproduz mais de perto a forma hebraica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O qal wayyiqtol de מות é o verbo narrativo comum para a morte; «morreu» é direto e evita eufemismo.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Transliteração próxima da forma hebraica, distinguindo-a da forma portuguesa tradicional «Saul».
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O qal wayyiqtol de מלך, nesta fórmula de sucessão régia, é expresso de modo conciso e natural por «reinou».
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Neste contexto de sucessão, תחת com sufixo indica que alguém assume o lugar do antecessor.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanã
  rationale: Forma portuguesa legível que preserva os dois elementos do nome hebraico; «Hanã» representa חָנָן sem impor a grafia inglesa.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente normal do constructo hebraico que indica filiação.
- source_word: עַכְבּוֹר
  choice: Acbor
  rationale: Transliteração portuguesa legível e próxima do hebraico; evita a grafia inglesa «Akbor» e a forma tradicional «Acbor» já é reconhecível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de uma notícia de sucessão régia. Mantém-se «e» para refletir a sequência narrativa hebraica; os nomes recebem formas adequadas à leitura em português.
