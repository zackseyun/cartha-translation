  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: pt
  text: 'Estes são os filhos de Sobal: Alvã[a], Manaate, Ebal, Sefô[b] e Onã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz Alvã; na genealogia paralela de 1 Crônicas 1:40, o nome aparece como Aliã.
    reason: alternative_reading
  - marker: b
    text: O hebraico traz Sefô; na genealogia paralela de 1 Crônicas 1:40, o nome aparece como Sefi.
