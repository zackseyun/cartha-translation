lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Estes são
  rationale: A conjunção com o demonstrativo introduz o item genealógico seguinte. Em português atual, a fórmula sem um «e» inicial é natural e preserva plenamente a função do hebraico.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Aqui o termo introduz uma lista direta de descendentes masculinos, por isso «filhos de» é mais preciso do que «descendentes de».
- source_word: שׁוֹבָל
  choice: Sobal
  rationale: Nome pessoal transliterado em forma corrente e legível em português.
- source_word: עַלְוָן
  choice: Alvã
  rationale: Translitera a forma do texto hebraico de Gênesis, עַלְוָן; a forma variante da genealogia paralela é registrada em nota.
- source_word: וּ/מָנַחַת
  choice: Manaate
  rationale: Nome pessoal transliterado segundo convenções portuguesas; a conjunção prefixada é expressa pela pontuação da enumeração.
- source_word: וְ/עֵיבָל
  choice: Ebal
  rationale: Transliteração direta e tradicionalmente reconhecível do nome hebraico.
- source_word: שְׁפוֹ
  choice: Sefo
  rationale: Translitera a forma massorética deste versículo; a variante «Sefi» de 1 Crônicas 1:40 é preservada em nota.
- source_word: וְ/אוֹנָם
  choice: e Onã
  rationale: O nome é transliterado em forma portuguesa, e a conjunção hebraica é mantida antes do último elemento da lista.
