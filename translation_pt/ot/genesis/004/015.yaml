base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: pt
  text: 'Então Yahweh lhe disse: “Por isso, quem matar Caim sofrerá vingança sete vezes.” E Yahweh pôs em Caim um sinal[a], para que ninguém que o encontrasse o ferisse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma marca”. O termo hebraico pode indicar, de modo amplo, um sinal ou uma marca distintiva; o texto não informa que forma isso assumiu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino do texto hebraico mediante uma transliteração amplamente reconhecível, em vez de substituí-lo por um título.
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural e atual a inferência introduzida pela resposta divina.
- source_word: כָּל הֹרֵג קַיִן
  choice: quem matar Caim
  rationale: Reproduz o sentido genérico e indefinido da construção hebraica em português idiomático.
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: sofrerá vingança sete vezes maior
  rationale: Torna claro, conforme o contexto, que a vingança recairá sobre quem matar Caim, sem explicitar o agente que o passivo hebraico deixa implícito.
- source_word: אוֹת
  choice: sinal
  rationale: É o sentido amplo e direto do termo hebraico e evita afirmar que se tratava necessariamente de uma marca física.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: para que ninguém que o encontrasse o ferisse
  rationale: Integra naturalmente a finalidade negativa e a expressão participial; “ferisse” conserva o sentido de golpear sem restringi-lo explicitamente a matar.
theological_decisions:
- issue: Natureza do sinal dado a Caim
  choice: sinal
  alternative: marca
  rationale: O hebraico não informa a forma física ou simbólica do אות; “sinal” preserva essa indeterminação.
- issue: Pessoa sobre quem recai a vingança sete vezes maior
  choice: quem matar Caim sofrerá vingança
  alternative: Caim será vingado sete vezes
  rationale: O passivo hebraico é compacto, mas o contexto apresenta uma advertência contra matar Caim. A formulação escolhida identifica o alvo da retribuição sem nomear o agente implícito.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa compreensão no Brasil e sem regionalismos marcados. A ordem e as relações lógicas do hebraico foram preservadas sem produzir uma formulação artificial.
