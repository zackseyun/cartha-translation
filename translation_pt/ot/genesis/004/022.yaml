  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: pt
  text: Zilá também deu à luz Tubal-Caim[a], que forjava todo instrumento cortante de bronze e de ferro[b]. A irmã de Tubal-Caim era Naamá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um afiador ou forjador de todo artífice em bronze e ferro”. A expressão hebraica depois de “Tubal-Caim” é difícil; alguns a entendem como descrição dele como trabalhador de metais, e não como fabricante de instrumentos metálicos.'
    reason: alternative_reading
  - marker: b
    text: “Bronze” também pode ser traduzido por “cobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: também
  rationale: Expressa naturalmente a força aditiva da construção hebraica, incluindo Zilá entre as mulheres que tiveram filhos.
- source_word: יָלְדָה
  choice: deu à luz
  rationale: Forma corrente, clara e digna em português para o verbo ילד neste contexto genealógico.
- source_word: תּוּבַל קַיִן
  choice: Tubal-Caim
  rationale: Transliteração tradicional e reconhecível do nome composto em português.
- source_word: לֹטֵשׁ
  choice: que forjava
  rationale: O particípio pode indicar quem afia, martela ou trabalha metais; 'forjava' comunica de modo natural a atividade metalúrgica provável.
- source_word: כָּל חֹרֵשׁ
  choice: toda espécie de instrumento cortante
  rationale: A construção hebraica é difícil; esta opção entende חֹרֵשׁ como objeto trabalhado e explicita o provável sentido de instrumentos produzidos por afiação ou martelamento, sem ocultar a alternativa na nota.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a tradução convencional no contexto dos metais antigos, embora o termo também possa designar cobre.
- source_word: בַרְזֶל
  choice: ferro
  rationale: Equivalente português direto e padrão do termo hebraico.
- source_word: אֲחוֹת
  choice: irmã
  rationale: Correspondência direta do termo de parentesco.
- source_word: נַעֲמָה
  choice: Naamá
  rationale: Transliteração portuguesa do nome próprio, com acento para indicar a tonicidade.
