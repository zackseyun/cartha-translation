  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: pt
  text: Lameque tomou para si duas esposas[a]. O nome de uma era Ada, e o nome da outra era Zilá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais idiomaticamente: “Lameque casou-se com duas mulheres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Preserva o sentido básico de לקח; neste contexto, a expressão seguinte deixa claro que se trata de tomar mulheres por esposas.
- source_word: לוֹ
  choice: para si
  rationale: Expressa de modo natural em português o interesse pessoal indicado pela preposição com sufixo.
- source_word: שְׁתֵּי נָשִׁים
  choice: duas mulheres
  rationale: נָשִׁים pode significar tanto “mulheres” como “esposas”. Com “tomou para si”, o contexto matrimonial permanece claro, enquanto a formulação conserva a possibilidade lexical do hebraico.
- source_word: שֵׁם הָאַחַת
  choice: O nome de uma
  rationale: Reproduz a fórmula hebraica de nomeação de maneira clara e natural.
- source_word: עָדָה
  choice: Ada
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: e o nome da outra
  rationale: Embora הַשֵּׁנִית signifique literalmente “a segunda”, “a outra” é a forma portuguesa mais natural para o segundo membro de um par e mantém o paralelismo.
- source_word: צִלָּה
  choice: Zilá
  rationale: Transliteração portuguesa que representa o nome hebraico e marca naturalmente a tonicidade final.
theological_decisions:
- issue: Se deve explicitar que se trata de um casamento poligínico
  choice: Manter “tomou para si duas mulheres”, com nota esclarecendo o sentido matrimonial
  alternative: “casou-se com duas mulheres” ou “tomou para si duas esposas”
  rationale: O versículo relata que Lameque passou a ter duas esposas, mas não faz avaliação moral explícita. A tradução comunica o fato sem acrescentar comentário doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “tomou para si” conserva a forma hebraica, e a nota oferece a expressão matrimonial mais idiomática. “Da outra” evita a rigidez de “da segunda” ao falar das duas mulheres.
