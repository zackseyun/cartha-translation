base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: pt
  text: A Enoque nasceu Irade, e Irade gerou Meujael[a], e Meujael gerou Metusael, e Metusael gerou Lameque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neste versículo, o hebraico apresenta duas grafias do mesmo nome: Meujael e Meijael.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: A Enoque nasceu
  rationale: O nifal de ילד é passivo, e a construção com ל indica o pai a quem o filho nasceu. Esta formulação preserva essa voz e soa natural em português.
- source_word: עִירָד
  choice: Irade
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico, o qal de ילד expressa a geração paterna; “gerou” é conciso, digno e corrente na linguagem bíblica portuguesa.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Meujael
  rationale: Adota-se uma única forma legível no texto principal; a variação ortográfica interna do hebraico é preservada em nota.
- source_word: מְתוּשָׁאֵל
  choice: Metusael
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais em português.
- source_word: לָמֶךְ
  choice: Lameque
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
