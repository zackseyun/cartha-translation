  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: pt
  text: Ela deu à luz novamente[a] o irmão de Caim, Abel. Abel tornou-se pastor de rebanhos[b], mas Caim cultivava o solo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuou a dar à luz” ou “tornou a dar à luz”. O idioma hebraico usa literalmente “acrescentou” com um infinitivo para indicar repetição ou continuação.'
    reason: lexical_alternative
  - marker: b
    text: “Rebanhos” refere-se aqui a animais de pequeno porte, especialmente ovelhas e cabras.
    reason: cultural_note
  - marker: c
    text: 'Ou: “era cultivador do solo” ou “trabalhava o solo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: deu à luz novamente
  rationale: A construção com יסף e infinitivo indica repetição ou continuação. “Deu à luz novamente” expressa naturalmente a sequência de um segundo parto, sem reproduzir de modo rígido o sentido literal de “acrescentou dar à luz”.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: o irmão de Caim, Abel
  rationale: O segundo marcador de objeto introduz “Abel” em aposição a “seu irmão”. Explicitar Caim evita a ambiguidade que “seu irmão” poderia criar em português e conserva a ênfase na relação entre os dois.
- source_word: הֶבֶל
  choice: Abel
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיְהִי
  choice: tornou-se
  rationale: Aqui היה introduz a ocupação de Abel no desenvolvimento da narrativa. “Tornou-se” cabe no alcance semântico, embora “era” também seja possível.
- source_word: רֹעֵה צֹאן
  choice: pastor de rebanhos
  rationale: רעה descreve o pastoreio, e צאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Pastor de rebanhos” preserva esse sentido sem restringi-lo apenas a ovelhas.
- source_word: קַיִן
  choice: Caim
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: cultivava o solo
  rationale: A expressão significa trabalhar ou cultivar a terra. “Cultivava o solo” é natural em português e mantém explícita a ligação com אֲדָמָה, sem recorrer ao termo mais interpretativo “agricultor”.
- source_word: אֲדָמָה
  choice: solo
  rationale: “Solo” comunica com clareza a terra cultivável e permite manter a recorrência temática de אֲדָמָה no contexto de Gênesis.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção possa ser traduzida literalmente por “e”, “mas” apresenta com naturalidade o contraste entre as ocupações, sem atribuir superioridade moral a nenhuma delas.
theological_decisions:
- issue: Caracterização das ocupações dos irmãos
  choice: Apresentar as duas ocupações como descrições neutras e contrastantes.
  alternative: Usar linguagem que sugira superioridade moral ou espiritual de uma ocupação sobre a outra.
  rationale: O hebraico apenas informa as diferentes ocupações de Abel e Caim; neste versículo, não há avaliação moral explícita de nenhuma delas.
- issue: Valor aspectual de וַיְהִי na ocupação de Abel
  choice: Traduzir por “tornou-se”, preservando a possibilidade de desenvolvimento narrativo.
  alternative: Traduzir por “era”, entendendo a forma apenas como descrição de estado.
  rationale: Ambas as leituras são linguisticamente possíveis. “Tornou-se” acompanha o avanço narrativo sem transformar a ocupação em afirmação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A redação conserva “solo” como termo concreto ligado ao vocabulário temático de Gênesis e evita linguagem que avalie moralmente as ocupações.
