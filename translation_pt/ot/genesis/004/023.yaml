  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: pt
  text: 'Lameque disse às suas esposas: “Ada e Zilá, ouçam a minha voz;


    esposas de Lameque, escutem a minha palavra.


    Pois matei[a] um homem por me ferir,


    e um jovem por me golpear.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns entendem as palavras de Lameque como uma ameaça ou vanglória geral — “eu mataria um homem...” — e não como o relato de uma morte já ocorrida.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “Matei um homem por minha ferida, e um jovem por minha contusão”. O hebraico emprega os substantivos “ferida” e “contusão”, cuja relação com o ato de matar pode indicar causa ou retaliação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: às suas esposas
  rationale: O substantivo אִשָּׁה, no plural com sufixo de terceira pessoa masculina singular, refere-se aqui às esposas de Lameque. “Esposas” é natural, preciso e mantém a repetição poética do verso.
- source_word: שְׁמַעַן קוֹלִי
  choice: ouçam a minha voz
  rationale: O imperativo feminino plural dirige-se a Ada e Zilá; “ouçam” conserva a força direta da ordem, e “minha voz” mantém a expressão concreta do hebraico.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: escutem a minha palavra
  rationale: O segundo imperativo intensifica e forma paralelo com “ouçam”. “Minha palavra” preserva o substantivo singular e o caráter poético da fala.
- source_word: כִּי
  choice: pois
  rationale: Introduz o conteúdo ou fundamento da declaração de Lameque sem definir além do necessário a relação lógica.
- source_word: הָרַגְתִּי
  choice: matei
  rationale: O qatal é traduzido de modo mais direto como uma ação passada. A possibilidade de leitura modal ou proverbial é preservada em nota.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o sentido comum de אִישׁ e o paralelismo contrastivo com יֶלֶד.
- source_word: לְפִצְעִי
  choice: por me ferir
  rationale: Expressa de modo idiomático a provável relação de causa ou retaliação indicada por לְ, sem acrescentar uma justificativa de legítima defesa.
- source_word: יֶלֶד
  choice: um jovem
  rationale: No paralelismo com “homem”, designa alguém mais novo; “jovem” evita sugerir necessariamente uma criança pequena.
- source_word: לְחַבֻּרָתִי
  choice: por me golpear
  rationale: Comunica naturalmente a causa ou ocasião da retaliação e mantém alguma distinção em relação a “ferir” no primeiro membro.
theological_decisions:
- issue: A fala de Lameque relata um homicídio ou formula uma ameaça/ostentação geral?
  choice: 'O texto principal apresenta a forma verbal como relato passado: “matei”.'
  alternative: “Eu mataria um homem...” ou uma ameaça geral equivalente.
  rationale: O qatal hebraico é lido mais diretamente como ação consumada, mas a nota conserva a possível leitura modal ou proverbial sem resolver silenciosamente a ambiguidade.
- issue: A morte é apresentada como retaliação ou legítima defesa?
  choice: As expressões “por me ferir” e “por me golpear” indicam causa ou ocasião, sem qualificar moralmente o ato.
  alternative: Explicitar que Lameque matou em legítima defesa.
  rationale: O hebraico não declara de forma inequívoca legítima defesa; acrescentá-la resolveria uma tensão moral que o texto deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas conserva o paralelismo poético; “ouçam/escutem” diferencia os imperativos paralelos sem recorrer ao arcaísmo “dai ouvidos”.
