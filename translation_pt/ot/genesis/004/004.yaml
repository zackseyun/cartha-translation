id: GEN.4.4
reference: Genesis 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: pt
  text: E Abel também trouxe alguns dos primogênitos do seu rebanho e algumas das porções de gordura deles.[a] Yahweh olhou com favor para Abel e para a sua oferta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da gordura deles”; provavelmente se refere às porções gordurosas mais valiosas dos animais oferecidos.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “voltou o olhar para Abel e para a sua oferta”. O texto não explica como esse favor foi manifestado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: E Abel
  rationale: A conjunção narrativa וְ é preservada de modo natural, mantendo a sequência com a oferta de Caim no versículo anterior.
- source_word: הֵבִיא גַם הוּא
  choice: também trouxe
  rationale: Expressa com fluidez que Abel, assim como Caim, apresentou uma oferta, preservando a ênfase de גַם הוּא.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: algumas das primeiras crias do seu rebanho
  rationale: A construção com מִן é partitiva. “Algumas das primeiras crias” evita sugerir que Abel ofereceu todas elas; “crias” é natural em português e abrange o coletivo צֹאן sem restringi-lo indevidamente a uma só espécie.
- source_word: וּמֵחֶלְבֵהֶן
  choice: e algumas das porções de gordura delas
  rationale: חֵלֶב designa aqui a gordura ou as partes gordurosas selecionadas dos animais. A formulação mantém o sentido concreto e sacrificial, sem substituí-lo interpretativamente por “melhores partes”.
- source_word: וַיִּשַׁע
  choice: olhou com favor para
  rationale: O verbo indica que Yahweh voltou sua atenção para Abel de maneira favorável. A expressão é atual e clara, mas não especifica como essa aprovação se manifestou.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: para Abel e para a sua oferta
  rationale: A repetição de אֶל distingue Abel de sua oferta como alvos do olhar favorável de Yahweh; a repetição de “para” preserva essa estrutura com naturalidade.
- source_word: מִנְחָתוֹ
  choice: a sua oferta
  rationale: מִנְחָה é um presente ou tributo oferecido a Deus; “oferta” corresponde bem ao contexto de culto sem definir além do texto a modalidade ritual.
theological_decisions:
- issue: Natureza da resposta divina em וַיִּשַׁע
  choice: Yahweh olhou com favor para Abel e para a sua oferta
  alternative: Yahweh voltou o olhar para Abel e para a sua oferta
  rationale: O contexto indica atenção favorável, mas o versículo não informa por qual sinal ou mecanismo essa aprovação foi demonstrada. A tradução comunica a resposta positiva sem importar explicações posteriores.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Primeiras crias” evita o masculino genérico potencialmente restritivo de “primogênitos” e preserva a referência aos animais do rebanho. Os marcadores de nota aparecem imediatamente após as expressões que esclarecem.
