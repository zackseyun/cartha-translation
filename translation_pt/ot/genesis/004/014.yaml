source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: pt
  text: Eis que, hoje, me expulsaste da face do solo, e ficarei escondido da tua face[a]. Serei errante e fugitivo pela terra[b], e quem me encontrar me matará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu me esconderei da tua presença” ou “ficarei escondido da tua presença”. O hebraico diz literalmente “da tua face”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no país”. A palavra hebraica אֶרֶץ pode significar “terra” ou “país”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Veja
  rationale: Partícula discursiva enfática que chama a atenção. “Veja” é natural no português moderno e preserva a vivacidade do hebraico.
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: me expulsaste
  rationale: גרשׁ expressa expulsar ou afastar à força. “Me expulsaste” é conciso, claro e mantém a força do ato.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face do solo
  rationale: Conserva a imagem concreta do hebraico e a ligação contextual entre אֲדָמָה, o solo cultivado, e a condição de Caim.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: e da tua face ficarei escondido
  rationale: O nifal permite sentido passivo ou reflexivo. A formulação preserva a imagem hebraica da “face” divina e não elimina a ambiguidade quanto a esconder-se ou ficar oculto.
- source_word: נָע וָנָד
  choice: errante e fugitivo
  rationale: Mantém os dois termos coordenados, que descrevem uma existência instável, deslocada e sem repouso.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. “Pela terra” combina naturalmente com a ideia de vagar e se ajusta ao horizonte amplo do relato; a alternativa é registrada em nota.
- source_word: כָל מֹצְאִי
  choice: quem me encontrar
  rationale: Expressa de maneira idiomática a referência indefinida e abrangente da construção hebraica.
- source_word: יַהַרְגֵנִי
  choice: me matará
  rationale: Equivalente moderno e direto do verbo comum הרג, sem elevar desnecessariamente o registro.
theological_decisions:
- issue: Expressão da presença divina em וּמִפָּנֶיךָ אֶסָּתֵר
  choice: da tua face ficarei escondido
  alternative: eu me esconderei da tua presença / ficarei escondido da tua presença
  rationale: A tradução principal conserva a expressão concreta “tua face”, com seu peso relacional, e mantém a tensão do nifal entre leitura passiva e reflexiva. A nota apresenta as possibilidades naturais sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação pronominal e as formas verbais preservam solenidade moderada sem arcaísmo excessivo; as imagens hebraicas “face do solo” e “tua face” foram mantidas deliberadamente.
