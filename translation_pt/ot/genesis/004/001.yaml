  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: pt
  text: 'O homem conheceu Eva, sua mulher, e ela engravidou e deu à luz Caim[b]. E disse: “Adquiri um homem com Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a expressão é literalmente “com Yahweh”. Ela também pode ser entendida como “da parte de Yahweh” ou “com a ajuda de Yahweh”; menos provavelmente, como “Adquiri um homem — Yahweh”.
    reason: alternative_reading
  - marker: b
    text: O nome Caim soa de modo semelhante ao verbo hebraico traduzido por “adquiri” (qaníti).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: O homem
  rationale: Neste contexto, אָדָם designa especificamente o homem já apresentado, não a humanidade em geral. A conjunção hebraica não exige a introdução de um marcador temporal como “então” ou “ora”.
- source_word: יָדַע
  choice: conheceu
  rationale: O verbo significa literalmente “conheceu” e funciona aqui como eufemismo para relações sexuais. A tradução conserva a expressão literária hebraica, cujo sentido é esclarecido pelo contexto da concepção.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Eva, sua mulher
  rationale: Reproduz o nome seguido da indicação da relação, em português natural e próximo da ordem hebraica.
- source_word: וַתַּהַר
  choice: ela engravidou
  rationale: Expressão corrente e clara para o verbo הרה no relato de concepção.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: deu à luz Caim
  rationale: Forma idiomática e digna em português para o nascimento, preservando a concisão narrativa.
- source_word: קַיִן
  choice: Caim
  rationale: Transliteração portuguesa tradicional do nome. O jogo sonoro com קָנִיתִי é informado em nota.
- source_word: קָנִיתִי
  choice: Adquiri
  rationale: קנה significa normalmente “adquirir, obter”. “Adquiri” mantém a relação lexical e sonora parcial com o nome Caim melhor que paráfrases como “recebi” ou “tive”.
- source_word: אִישׁ
  choice: um homem
  rationale: Embora se trate de um recém-nascido, o hebraico emprega אִישׁ, “homem”, e não “filho” ou “menino”; a tradução conserva essa formulação marcante.
- source_word: אֶת יְהוָה
  choice: com Yahweh
  rationale: A construção é incomum e ambígua. “Com Yahweh” reproduz sua concisão e permite a leitura de associação ou auxílio sem incorporar “a ajuda de” ao texto principal; outras interpretações plausíveis são registradas em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo pelo título “SENHOR”.
theological_decisions:
- issue: Sentido de אֶת יְהוָה na declaração de Eva
  choice: com Yahweh
  alternative: da parte de Yahweh; com a ajuda de Yahweh; um homem — Yahweh
  rationale: O hebraico admite mais de uma análise. A tradução principal mantém a formulação compacta e sua tensão, enquanto a nota apresenta as principais possibilidades sem transformar uma interpretação específica em afirmação inequívoca do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se o eufemismo “conheceu”, a expressão inesperada “um homem” e a ambiguidade de “com Yahweh”. Os marcadores foram colocados junto aos trechos a que suas notas efetivamente se referem.
