base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: pt
  text: 'Adão tornou a ter relações com sua mulher, e ela deu à luz um filho e lhe deu o nome de Sete[a], pois disse: “Deus me concedeu outro descendente no lugar de Abel, porque Caim o matou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por “concedeu” significa literalmente “pôs” ou “colocou” e soa de modo semelhante ao nome Sete, formando um jogo de palavras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: tornou a ter relações com
  rationale: O verbo יָדַע, usado em relação à esposa, é um eufemismo hebraico convencional para relações sexuais. A formulação comunica o sentido com clareza em português moderno, sem vulgaridade.
- source_word: אָדָם
  choice: Adão
  rationale: Neste contexto, אָדָם funciona como nome próprio; emprega-se a forma portuguesa tradicional.
- source_word: עוֹד
  choice: tornou a
  rationale: Marca a repetição da união conjugal; a construção portuguesa “tornou a” expressa naturalmente “novamente”.
- source_word: וַתֵּלֶד בֵּן
  choice: ela deu à luz um filho
  rationale: Equivalente direto e corrente de ילד + בן em português.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Reproduz naturalmente em português a fórmula hebraica de nomeação, sem o artificialismo de “chamou o nome dele”.
- source_word: שֵׁת
  choice: Sete
  rationale: Forma tradicional do nome hebraico שֵׁת nas Bíblias em português.
- source_word: שָׁת
  choice: concedeu
  rationale: שִׁית significa literalmente “pôr” ou “colocar”. “Concedeu” comunica naturalmente que Deus proveu o novo descendente; a nota preserva o sentido literal e o jogo sonoro com Sete.
- source_word: זֶרַע
  choice: descendente
  rationale: זֶרַע pode significar “semente” ou “descendência”. No contexto do nascimento de um indivíduo, “descendente” preserva o sentido procriativo sem a estranheza de “semente”.
- source_word: תַּחַת
  choice: no lugar de
  rationale: Aqui תַּחַת indica substituição, não posição espacial.
- source_word: הֲרָגוֹ
  choice: o matou
  rationale: הרג é o verbo geral “matar”; não se introduz a especificidade lexical de “assassinar”, embora o ato narrado seja homicídio.
theological_decisions:
- issue: Explicação do nome de Sete
  choice: Deus me concedeu outro descendente
  alternative: Deus pôs para mim outra descendência
  rationale: A tradução principal expressa com naturalidade a compreensão de que Deus proveu um descendente após a morte de Abel. Como “concedeu” não reproduz o jogo sonoro entre שֵׁת e שָׁת, a nota registra o sentido literal e o recurso literário.
- issue: Explicitação do eufemismo sexual
  choice: Adão tornou a ter relações com sua mulher
  alternative: Adão conheceu novamente sua mulher
  rationale: O original usa um eufemismo convencional. Em português contemporâneo, “ter relações” mantém discrição e dignidade, ao mesmo tempo que evita a possível incompreensão do calque “conheceu”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa permanece concisa; o eufemismo sexual é comunicado de modo discreto, e o jogo de palavras hebraico é preservado em nota.
