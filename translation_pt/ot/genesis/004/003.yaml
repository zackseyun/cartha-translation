id: GEN.4.3
reference: Genesis 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: pt
  text: Depois de algum tempo[a], Caim trouxe a Yahweh uma oferta do produto da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «ao fim de dias»; isto é, depois de um período de tempo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «do fruto do solo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: Depois de algum tempo
  rationale: O hebraico introduz o acontecimento seguinte e emprega uma expressão temporal que, neste contexto, indica o transcurso de um período. A formulação é natural em português e evita sugerir um sentido escatológico.
- source_word: וַיָּבֵא
  choice: trouxe
  rationale: O hifil de בוא significa aqui levar ou trazer algo para apresentação; «trouxe» preserva de modo direto a ação narrativa.
- source_word: קַיִן
  choice: Caim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: do produto da terra
  rationale: פְּרִי pode designar fruto ou produto, e אֲדָמָה, a terra cultivável ou solo. «Produto da terra» comunica naturalmente a produção agrícola sem limitar a referência a frutas.
- source_word: מִנְחָה
  choice: uma oferta
  rationale: O termo pode indicar dádiva, tributo ou oferta. No contexto de apresentação a Deus, «oferta» é claro sem especificar uma modalidade não expressa no texto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa o nome divino יהוה como nome próprio e mantém a preposição direcional da apresentação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. A transliteração «Yahweh» preserva sua função de nome próprio, sem substituí-lo por um título.
- issue: Sentido de מִקֵּץ יָמִים
  choice: 'expressão temporal não escatológica: «Depois de algum tempo»'
  alternative: «ao fim de dias»
  rationale: Embora a construção literal mencione o fim de dias, o contexto indica apenas que transcorreu certo período antes da oferta de Caim; não há aqui indicação explícita de um fim escatológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mantendo o encadeamento narrativo e sem acrescentar informações ausentes do hebraico.
