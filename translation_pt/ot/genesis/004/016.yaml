id: GEN.4.16
reference: Genesis 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: pt
  text: Então Caim saiu de diante de Yahweh e se estabeleceu na terra de Node[a], a leste do Éden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Node soa como a palavra hebraica relacionada a “andar errante”, retomando a sentença pronunciada contra Caim anteriormente neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Preserva o sentido concreto de movimento para fora expresso por יצא, sem acrescentar uma interpretação sobre a maneira da partida.
- source_word: מִלִּפְנֵי
  choice: de diante de
  rationale: Reproduz de modo natural em português a expressão hebraica literalmente ligada à face ou ao que está diante de alguém, conservando sua força espacial e relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: Neste contexto narrativo, ישב indica que Caim passou a habitar naquele lugar; a forma escolhida é atual e sugere fixação de residência.
- source_word: בְּאֶרֶץ נוֹד
  choice: na terra de Node
  rationale: Node funciona como nome geográfico e, por isso, é transliterado. O possível jogo sonoro com a ideia de andar errante é preservado em nota.
- source_word: קִדְמַת עֵדֶן
  choice: a leste do Éden
  rationale: Expressa de forma concisa e idiomática a localização oriental em relação ao Éden.
- source_word: עֵדֶן
  choice: Éden
  rationale: Emprega a forma portuguesa consagrada do nome próprio do lugar.
theological_decisions:
- issue: Como expressar a partida de Caim em relação a Deus
  choice: Caim saiu de diante de Yahweh
  alternative: Caim saiu da presença de Yahweh
  rationale: A formulação escolhida acompanha mais de perto o idioma hebraico e mantém a tensão narrativa e teológica da alienação, sem explicar em que sentido alguém poderia sair da presença de Deus.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem narrativa é fluente, enquanto “de diante de” conserva deliberadamente a concretude e a tensão do hebraico.
