  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: pt
  text: Caim teve relações com sua mulher[a], e ela engravidou e deu à luz Enoque. Caim estava construindo uma cidade[b] e deu à cidade o nome de seu filho, Enoque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “conheceu sua mulher”, expressão usada para relações sexuais.
    reason: cultural_note
  - marker: b
    text: 'A construção hebraica pode indicar uma ação em andamento, como traduzido aqui. Também é possível traduzir: “construiu uma cidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: teve relações com
  rationale: O verbo significa literalmente “conheceu”, mas aqui integra um conhecido eufemismo hebraico para relações sexuais. A formulação escolhida comunica o sentido com clareza no português atual sem tornar o texto desnecessariamente explícito.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; com o sufixo possessivo e neste contexto conjugal, “sua mulher” é natural e amplamente compreensível em português.
- source_word: וַתַּהַר
  choice: engravidou
  rationale: Expressa de modo corrente e exato que ela ficou grávida, preservando a sequência narrativa.
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: Equivalente português natural do verbo hebraico יָלַד neste contexto.
- source_word: חֲנוֹךְ
  choice: Enoque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Caim estava construindo uma cidade
  rationale: A combinação de הָיָה com o particípio בֹּנֶה pode indicar ação em andamento. A repetição explícita de “Caim” elimina uma possível confusão pronominal em português sem alterar o referente gramatical masculino da oração.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: deu à cidade o nome de seu filho
  rationale: Reproduz naturalmente em português o sentido do idioma hebraico, literalmente “chamou o nome da cidade conforme o nome de seu filho”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. A tradução verte o eufemismo hebraico pelo seu sentido corrente no texto principal, preservando a forma literal em nota, e mantém a possível nuance progressiva de וַיְהִי בֹּנֶה.
