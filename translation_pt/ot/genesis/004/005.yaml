  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: pt
  text: Mas não olhou com favor para Caim nem para a sua oferta.[a] Caim ficou muito irado, e seu semblante ficou abatido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não mostrou favor a Caim nem à sua oferta».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «seu rosto caiu», expressão que indica um semblante abatido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתו
  choice: para Caim nem para a sua oferta
  rationale: A repetição de אֶל marca Caim e sua oferta como objetos do olhar ou consideração divina. Em português, a coordenação negativa com «nem» é natural após «não» e mantém ambos em destaque. «Oferta» comunica adequadamente o contexto cultual de מִנְחָה.
- source_word: לֹא שָׁעָה
  choice: não olhou com favor
  rationale: שָׁעָה denota olhar, atentar ou considerar favoravelmente. «Não olhou com favor» preserva a imagem verbal e comunica a recusa sem explicar sua causa nem reduzi-la ao conceito mais interpretativo de aceitação.
- source_word: וַיִּחַר לְקַיִן מְאֹד
  choice: Caim ficou muito irado
  rationale: O verbo contém a imagem idiomática de ira que se acende. «Ficou muito irado» expressa com clareza tanto o início do estado emocional quanto a intensidade indicada por מְאֹד, em registro digno e atual.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: seu rosto se abateu
  rationale: A expressão diz literalmente que o rosto de Caim caiu e descreve sua alteração visível para um semblante abatido. «Seu rosto se abateu» conserva em parte a imagem hebraica e soa mais compreensível em português do que uma reprodução inteiramente literal.
theological_decisions:
- issue: Natureza da resposta divina a Caim e à sua oferta
  choice: Descrever a resposta como não olhar com favor, sem indicar o motivo.
  alternative: «não aceitou Caim nem a sua oferta»
  rationale: O hebraico afirma a ausência de consideração favorável, mas este versículo não explica a razão. A formulação escolhida preserva essa reserva e evita introduzir uma explicação doutrinária.
- issue: Relação entre Caim e sua oferta na resposta divina
  choice: Manter tanto Caim quanto a oferta como objetos explícitos da resposta.
  alternative: Mencionar apenas que a oferta não foi aceita.
  rationale: O texto repete a preposição antes de «Caim» e de «sua oferta», dando relevo a ambos; omitir Caim estreitaria indevidamente a afirmação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Irado» mantém um tom bíblico digno sem ser arcaico; «se abateu» torna inteligível o idioma hebraico, enquanto a nota preserva sua forma literal.
