revisions:
- from: Mas não olhou com favor para Caim nem para a sua oferta.[a] Por isso, Caim ficou muito irado, e seu rosto se abateu.[b]
  to: Mas não olhou com favor para Caim nem para a sua oferta.[a] Caim ficou muito irado, e seu semblante ficou abatido.[b]
  rationale: A revisão remove a causalidade explicitada por «Por isso», mantendo a sequência narrativa do hebraico sem acrescentar uma relação lógica mais forte. Também ajusta a alternativa lexical da nota a para conservar o sentido contextual de consideração favorável e torna a expressão final mais idiomática em português, preservando na nota a imagem literal hebraica.
