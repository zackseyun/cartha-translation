source:
  edition: WLC
  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: pt
  text: Pois Caim será vingado sete vezes[a], e Lameque, setenta e sete vezes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é vingado”; o verbo hebraico também pode expressar uma verdade proverbial ou uma vingança futura apresentada como certa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “setenta e sete”. Não “setenta vezes sete”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração de Lameque no versículo anterior, preservando naturalmente a força conectiva.
- source_word: שִׁבְעָתַיִם
  choice: sete vezes
  rationale: A forma expressa uma medida sétupla de vingança; em português corrente, “sete vezes” é mais natural e claro do que “sete vezes mais” ou “sétuplamente”.
- source_word: יֻקַּם
  choice: será vingado
  rationale: O Hofal de נקם é passivo. O imperfeito pode indicar ação futura tida como certa; o futuro em português comunica esse valor sem eliminar a possibilidade proverbial.
- source_word: קָיִן
  choice: Caim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְלֶמֶךְ
  choice: e Lameque
  rationale: A conjunção estabelece o paralelo crescente entre Caim e Lameque; emprega-se a forma tradicional do nome em português.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: setenta e sete vezes
  rationale: A expressão significa literalmente “setenta e sete”; “vezes” completa em português o paralelismo elíptico com “sete vezes” e comunica com clareza a intensificação.
theological_decisions:
- issue: Valor temporal ou proverbial de יֻקַּם
  choice: será vingado
  alternative: é vingado
  rationale: O imperfeito hebraico pode apresentar uma vingança futura como certa, enquanto o contexto poético também admite uma formulação proverbial. O texto principal usa o futuro natural em português, e a nota preserva a alternativa.
- issue: Interpretação numérica da fórmula de vingança de Lameque
  choice: setenta e sete vezes
  alternative: setenta vezes sete
  rationale: שִׁבְעִים וְשִׁבְעָה significa mais naturalmente “setenta e sete”. Essa tradução preserva o paralelismo poético e evita importar para Gênesis uma leitura influenciada pela formulação posterior de Mateus 18:22.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação argumentativa; “sete vezes” e “setenta e sete vezes” soam naturais e conservam o paralelismo e a escalada poética.
