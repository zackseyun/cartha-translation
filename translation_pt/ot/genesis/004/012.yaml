source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: pt
  text: Quando você cultivar o solo[a], ele não voltará a lhe dar a sua força[b]. Você será errante e fugitivo pela terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pois, quando você cultivar o solo” ou “Se você cultivar o solo”. A conjunção hebraica pode ser entendida em sentido causal, temporal ou condicional.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não continuará a lhe dar a sua força”. A “força” do solo é sua capacidade produtiva.
    reason: lexical_alternative
  - marker: c
    text: Ou “um andarilho inquieto pela terra”. Os dois termos hebraicos têm sentidos parcialmente sobrepostos e intensificam a condição instável de Caim. “Terra” também pode ser traduzido por “país”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz naturalmente a circunstância futura em que a sentença se manifestará. A nota preserva as leituras causal e condicional possíveis.
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  choice: você cultivar o solo
  rationale: עבד, com אֲדָמָה como objeto, refere-se ao trabalho de cultivo. “Cultivar o solo” é corrente, claro e mantém o sentido agrícola.
- source_word: לֹא תֹסֵף תֵּת
  choice: não voltará a dar
  rationale: Reproduz a construção יסף + infinitivo, que indica que a ação não se repetirá ou continuará, sem torná-la uma proibição.
- source_word: כֹּחָהּ
  choice: a sua força
  rationale: Mantém a metáfora hebraica da força do solo, isto é, sua capacidade produtiva, em vez de substituí-la interpretativamente por “colheita” ou “produção”.
- source_word: נָע וָנָד
  choice: errante e fugitivo
  rationale: Conserva os dois termos hebraicos sobrepostos, bem como a intensificação da condição instável de Caim, sem reduzi-los a uma única ideia.
- source_word: בָאָרֶץ
  choice: pela terra
  rationale: “Pela” combina naturalmente com a condição itinerante, enquanto “terra” preserva a possível abrangência de אָרֶץ; a alternativa local “país” é registrada em nota.
theological_decisions:
- issue: Alcance do juízo contra Caim
  choice: Uma sentença concreta que inclui tanto a frustração agrícola quanto uma existência social e geograficamente instável.
  alternative: Entender a sentença apenas como inquietação psicológica ou somente como exílio geográfico limitado.
  rationale: O texto une a perda da produtividade do solo à condição de נָע וָנָד. A tradução conserva ambas as dimensões sem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Solo” mantém o contexto agrícola; “errante e fugitivo” preserva a dupla expressão hebraica e seu tom solene. Todas as ambiguidades relevantes são mantidas no texto ou explicitadas nas notas.
