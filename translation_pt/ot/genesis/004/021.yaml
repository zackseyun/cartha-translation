base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: pt
  text: E o nome de seu irmão era Jubal; ele foi o pai[a] de todos os que tocam lira e flauta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “pai” pode significar precursor ou fundador de uma tradição, e não necessariamente o pai biológico imediato de todos esses músicos.
    reason: cultural_note
  - marker: b
    text: O instrumento hebraico traduzido como “flauta” não pode ser identificado com precisão; pode ter sido um instrumento de cana ou de tubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: O nome de seu irmão
  rationale: Reproduz com naturalidade a estrutura hebraica e identifica a relação de Jubal com Jabal, mencionado no versículo anterior.
- source_word: יוּבָל
  choice: Jubal
  rationale: Transliteração convencional do nome próprio hebraico.
- source_word: הוּא הָיָה
  choice: Ele foi
  rationale: Expressa a predicação enfática do hebraico; neste contexto, descreve o papel atribuído a Jubal na origem de uma tradição cultural.
- source_word: אֲבִי כָּל
  choice: o pai de todos
  rationale: Mantém a metáfora hebraica de origem ou pioneirismo, cujo alcance é esclarecido em nota.
- source_word: תֹּפֵשׂ
  choice: tocam
  rationale: Embora o sentido literal seja 'segurar' ou 'manejar', com instrumentos musicais o equivalente idiomático em português é 'tocar'.
- source_word: כִּנּוֹר
  choice: lira
  rationale: É uma designação moderna mais precisa do antigo instrumento de cordas do que a tradução tradicional 'harpa'.
- source_word: עוּגָב
  choice: flauta
  rationale: Designa de modo compreensível um instrumento de sopro, sem pretender identificar com certeza o instrumento antigo.
