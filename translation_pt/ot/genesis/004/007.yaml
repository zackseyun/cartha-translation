  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: pt
  text: Se você fizer o bem, não será aceito?[a] Mas, se não fizer o bem, o pecado está agachado à porta[b]; o desejo dele é por você[c], mas você deve dominá-lo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não haverá levantamento?”. Pode referir-se ao rosto de Caim sendo levantado ou à sua aceitação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma oferta pelo pecado está deitada à porta”. Contudo, a imagem imediata sugere mais naturalmente o pecado personificado como uma fera agachada.'
    reason: alternative_reading
  - marker: c
    text: Também se pode traduzir “seu anseio” ou “seu impulso”. Compare a formulação semelhante em Gênesis 3:16.
    reason: cross_reference
  - marker: d
    text: 'Ou: “você o dominará” ou “você pode dominá-lo”. O hebraico pode expressar exortação, previsão ou possibilidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: fizer o bem
  rationale: O hifil de יטב indica aqui agir bem ou corretamente; a formulação é natural em português e preserva a dimensão moral da condição.
- source_word: שְׂאֵת
  choice: será aceito
  rationale: Embora o termo denote literalmente um levantamento, no contexto pode indicar que o rosto ou a condição de Caim seria levantado, isto é, que ele receberia aceitação. A nota preserva a ambiguidade.
- source_word: לַפֶּתַח
  choice: à porta
  rationale: Reproduz de modo conciso a expressão locativa e mantém a imagem vívida de uma ameaça junto ao limiar.
- source_word: חַטָּאת
  choice: o pecado
  rationale: Ainda que חַטָּאת também possa significar oferta pelo pecado, o particípio 'agachado' favorece no contexto a personificação do pecado como fera à espreita.
- source_word: רֹבֵץ
  choice: está agachado
  rationale: O particípio retrata um animal abaixado, pronto para atacar. 'Está agachado' preserva tanto a postura quanto a ameaça iminente.
- source_word: תְּשׁוּקָתוֹ
  choice: o desejo dele é dominar você
  rationale: תְּשׁוּקָה significa desejo ou anseio. A explicitação 'dominar' comunica a força adversativa e a relação com a ordem seguinte, mas a nota registra a forma mais literal e a possível comparação com Gênesis 3:16.
- source_word: תִּמְשָׁל בּוֹ
  choice: você deve dominá-lo
  rationale: No contexto de advertência, o imperfeito hebraico é bem entendido como exortação. A formulação não o transforma em promessa nem em afirmação inequívoca de capacidade; outras nuances ficam registradas em nota.
theological_decisions:
- issue: Se a cláusula final ordena que Caim domine o pecado, promete que o dominará ou declara que pode fazê-lo
  choice: você deve dominá-lo
  alternative: você o dominará; você pode dominá-lo
  rationale: O imperfeito hebraico admite valor exortativo, preditivo ou potencial. O contexto favorece a exortação, mas a nota preserva as demais leituras sem impor uma doutrina específica sobre a capacidade humana.
- issue: Se תְּשׁוּקָתוֹ descreve apenas o desejo do pecado por Caim ou, por implicação contextual, seu impulso de dominá-lo
  choice: o desejo dele é dominar você
  alternative: o desejo dele é por você; seu anseio se volta para você
  rationale: A cláusula contrastante sobre o domínio favorece um desejo hostil de controle. Como o substantivo em si significa apenas desejo ou anseio, a nota conserva a expressão mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” torna direta a advertência divina. “Está agachado” mantém a metáfora animal, enquanto as notas preservam as ambiguidades lexicais e modais do hebraico.
