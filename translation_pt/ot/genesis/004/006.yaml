  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: pt
  text: 'Então Yahweh disse a Caim: “Por que você está irado, e por que seu rosto está abatido[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “E por que seu rosto caiu?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל קָיִן
  choice: a Caim
  rationale: A preposição אֶל introduz o destinatário da fala; “a Caim” é a formulação portuguesa direta e natural.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente interrogativo comum para uma pergunta sobre causa ou motivo.
- source_word: חָרָה לָךְ
  choice: você está irado
  rationale: A expressão hebraica, literalmente associada a arder, é um idiomatismo para ira. “Irado” preserva a intensidade e mantém um registro digno e claro.
- source_word: וְלָמָּה
  choice: E por que
  rationale: Mantém a coordenação explícita da segunda pergunta no hebraico.
- source_word: נָפְלוּ פָנֶיךָ
  choice: o seu rosto está abatido
  rationale: Traduz naturalmente o sentido do idiomatismo hebraico “seu rosto caiu”, indicando semblante desanimado ou perturbado, sem inserir uma causa específica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino por transliteração, sem substituí-lo por um título.
- issue: Sentido do rosto caído de Caim
  choice: rosto abatido
  alternative: seu rosto caiu
  rationale: A formulação comunica o idiomatismo em português corrente sem definir se o estado expressa tristeza, vergonha, ressentimento ou outra emoção, preservando a abertura contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “você” por naturalidade ampla no Brasil; conserva “Yahweh” como nome próprio e apresenta em nota a imagem literal do hebraico.
