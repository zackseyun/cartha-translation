base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: pt
  text: Sete também teve um filho e lhe deu o nome de Enos. Foi nessa época que as pessoas começaram a invocar o nome de Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Então se começou a invocar o nome de Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Uma interpretação minoritária entende o verbo no sentido de “foi profanado”, resultando em algo como: “Então as pessoas começaram a profanar o nome de Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: Sete também teve um filho
  rationale: Expressa em português natural o anúncio hebraico, literalmente “também a Sete nasceu um filho”, preservando a ideia de acréscimo indicada por גַּם.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: e lhe deu o nome de Enos
  rationale: Equivalente português corrente do idioma hebraico “chamou o nome dele”, com Sete como sujeito implícito.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico; embora o nome evoque o substantivo “ser humano/mortal”, aqui funciona como nome pessoal.
- source_word: אָז
  choice: Foi nessa época que
  rationale: Torna clara a relação temporal marcada por אָז e introduz naturalmente a declaração seguinte.
- source_word: הוּחַל
  choice: começaram
  rationale: Interpreta a forma passiva causativa como inceptiva e a verte idiomaticamente com sujeito humano genérico; a construção mais literal e a leitura minoritária “profanar” são mantidas nas notas.
- source_word: לִקְרֹא בְּשֵׁם
  choice: invocar o nome
  rationale: Neste contexto, o idioma normalmente indica apelo cultual ou adoração; “invocar” preserva essa força sem especificar além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: as pessoas começaram a invocar o nome de Yahweh
  alternative: começou-se a invocar o nome de Yahweh; ou, segundo uma leitura minoritária, as pessoas começaram a profanar o nome de Yahweh
  rationale: A leitura inceptiva e cultual é a interpretação contextual mais comum, mas a forma verbal admite discussão. As notas preservam tanto a construção impessoal mais próxima da forma hebraica quanto a leitura minoritária baseada no sentido “profanar” da raiz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação idiomática evita a rigidez de “a Sete nasceu um filho”, enquanto as notas conservam a forma impessoal do hebraico e sua ambiguidade lexical genuína.
