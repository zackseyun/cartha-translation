  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: pt
  text: 'Então Caim disse a Yahweh: “Minha iniquidade é grande demais para eu suportar.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha culpa é grande demais para eu suportar”; também pode ser entendido como: “Minha punição é grande demais para eu suportar” ou “Minha iniquidade é grande demais para ser perdoada”. Os termos hebraicos podem se referir à iniquidade ou culpa, bem como à sua punição; e o verbo pode significar “suportar” ou, em certos contextos, “perdoar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: קַיִן
  choice: Caim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל
  choice: a
  rationale: Preposição natural em português para introduzir o destinatário de “disse”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: גָּדוֹל
  choice: grande demais
  rationale: No contexto da construção com מִן, comunica idiomaticamente uma grandeza que excede a capacidade de suportar.
- source_word: עֲוֺנִי
  choice: minha iniquidade
  rationale: Preserva o sentido moral primário de עָוֹן, sem ocultar que o termo também pode indicar culpa ou punição, possibilidades registradas na nota.
- source_word: מִנְּשֹׂא
  choice: para eu suportar
  rationale: Expressa naturalmente a construção comparativa e o infinitivo de נָשָׂא; o verbo também pode significar “perdoar” em certos contextos, por isso a alternativa aparece na nota.
theological_decisions:
- issue: Ambiguidade de עֲוֺנִי מִנְּשֹׂא
  choice: “Minha iniquidade é grande demais para eu suportar.”
  alternative: “Minha culpa é grande demais para eu suportar”; “Minha punição é grande demais para eu suportar”; ou “Minha iniquidade é grande demais para ser perdoada.”
  rationale: עָוֹן pode indicar iniquidade, culpa ou a punição decorrente dela, enquanto נָשָׂא pode significar suportar e, em certos contextos, perdoar. O texto principal mantém o sentido moral mais direto, e a nota preserva as demais leituras genuínas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. Mantém “Yahweh” como nome próprio e explicita na nota a importante ambiguidade lexical do hebraico.
