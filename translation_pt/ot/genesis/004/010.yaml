  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: pt
  text: 'E ele disse: “O que você fez? A voz do sangue[a] do seu irmão clama a mim do solo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “sangues”, forma plural usada com frequência em contextos de derramamento de sangue; em português, normalmente se diz “sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o avanço narrativo do wayyiqtol hebraico sem impor uma sequência temporal mais explícita.
- source_word: מֶה עָשִׂיתָ
  choice: O que você fez?
  rationale: Reproduz de modo direto e natural a pergunta acusatória, conservando o peso presente do ato consumado.
- source_word: קוֹל
  choice: A voz
  rationale: Preserva a personificação vívida do sangue que apela a Deus; “som” seria mais impessoal.
- source_word: דְּמֵי
  choice: sangue
  rationale: Embora o hebraico use o plural idiomático, o português normalmente emprega o substantivo massivo singular neste contexto.
- source_word: אָחִיךָ
  choice: do seu irmão
  rationale: Expressa naturalmente em português a relação construta hebraica.
- source_word: צֹעֲקִים
  choice: clama
  rationale: O particípio plural concorda em hebraico com דְּמֵי; como “sangue” é singular em português, a concordância singular é natural. O presente comunica o clamor em curso.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente o destino do clamor, sem acrescentar uma interpretação.
- source_word: מִן הָאֲדָמָה
  choice: desde o solo
  rationale: “Solo” conserva a imagem concreta de אֲדָמָה e a recorrência temática da terra cultivável na narrativa de Caim; “desde” expressa com clareza o ponto de origem do clamor.
theological_decisions:
- issue: Personificação do sangue derramado de Abel
  choice: Manter a imagem figurada segundo a qual o próprio sangue clama a Deus.
  alternative: Explicitar abstratamente que a culpa de sangue exige justiça.
  rationale: O hebraico apresenta uma personificação vívida. Preservá-la mantém a força moral e teológica do texto sem reduzir a imagem a uma única explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A formulação preserva o fluxo narrativo, a pergunta direta e a personificação poética do original.
