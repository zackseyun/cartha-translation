source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: pt
  text: E agora você é amaldiçoado, afastado do solo[a], que abriu a boca para receber da sua mão o sangue[b] do seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «amaldiçoado pelo solo». O hebraico também pode sugerir que Caim é amaldiçoado para longe do solo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «sangues», expressão idiomática que pode indicar sangue derramado ou derramamento de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção como o advérbio temporal, introduzindo a consequência imediata do ato de Caim.
- source_word: אָרוּר אָתָּה
  choice: você é amaldiçoado
  rationale: Expressa em português atual o estado de Caim sob maldição, sem perder a força da construção hebraica.
- source_word: מִן הָאֲדָמָה
  choice: em relação ao solo
  rationale: A preposição מִן pode indicar origem, agente ou afastamento. Esta formulação mantém aberta a relação exata entre a maldição e o solo, esclarecida em nota.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: que abriu a boca
  rationale: Mantém a personificação vívida do solo. O pretérito perfeito é natural no contexto narrativo português.
- source_word: לָקַחַת
  choice: para receber
  rationale: Embora o verbo possa significar literalmente «tomar», «receber» descreve de modo natural o solo absorvendo o sangue.
- source_word: דְּמֵי אָחִיךָ
  choice: o sangue do seu irmão
  rationale: O plural hebraico «sangues» é idiomático e, neste contexto, denota o sangue derramado ou o derramamento de sangue; o singular é a forma natural em português.
- source_word: מִיָּדֶךָ
  choice: da sua mão
  rationale: Conserva a imagem concreta do hebraico e atribui diretamente a Caim a responsabilidade pelo sangue do irmão.
theological_decisions:
- issue: Relação da maldição com o solo
  choice: Caim é amaldiçoado em relação ao solo, sem definir se o solo é a origem ou o agente da maldição, ou se Caim é afastado dele.
  alternative: «amaldiçoado pelo solo» ou «amaldiçoado, afastado do solo»
  rationale: O hebraico מִן admite mais de uma nuance neste contexto. A tradução evita decidir silenciosamente entre agência, origem e separação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Solo» mantém a referência concreta à terra cultivável; «em relação ao solo» é deliberadamente menos idiomático que uma interpretação exclusiva, mas preserva a ambiguidade real do hebraico.
