base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: pt
  text: Ada deu à luz Jabal[a]; ele foi o pai dos que vivem em tendas e possuem rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pai dos que moram em tendas e cuidam de rebanhos”. Em hebraico, “pai de” pode significar ancestral, fundador ou protótipo de um modo de vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O qal wayyiqtol de ילד, nesta fórmula genealógica, descreve o nascimento de Jabal; “deu à luz” é natural e preciso em português.
- source_word: עָדָה
  choice: Ada
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca יבל como objeto direto e não possui equivalente lexical independente neste contexto.
- source_word: יָבָל
  choice: Jabal
  rationale: Transliteração convencional do nome próprio hebraico em português.
- source_word: הוּא הָיָה
  choice: ele foi
  rationale: A construção identifica Jabal e declara seu papel histórico; “foi” expressa isso de modo direto, sem introduzir a ideia adicional de que ele “se tornou” algo.
- source_word: אֲבִי
  choice: o pai dos
  rationale: Preserva a metáfora hebraica, que neste tipo de nota cultural pode indicar ancestral, fundador ou precursor de um modo de vida.
- source_word: יֹשֵׁב אֹהֶל
  choice: os que vivem em tendas
  rationale: O particípio singular tem sentido coletivo e descreve uma classe caracterizada pela vida em tendas.
- source_word: וּמִקְנֶה
  choice: e possuem rebanhos
  rationale: מִקְנֶה designa animais domésticos ou rebanhos. A formulação explicita em português a relação elíptica do hebraico sem restringir o termo apenas a gado bovino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais tradicionais. A redação mantém a metáfora “pai dos” e torna explícito o sentido coletivo de יֹשֵׁב. “Possuem rebanhos” conserva a amplitude de מִקְנֶה e evita limitá-lo a bovinos.
