base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: pt
  text: Caim disse a Abel, seu irmão.[a] Enquanto estavam no campo, Caim se levantou contra Abel, seu irmão, e o matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O Texto Massorético hebraico traz apenas: “Caim disse a Abel, seu irmão”, sem registrar o que ele disse. Testemunhos antigos, entre eles a Septuaginta, o Pentateuco Samaritano e a Vulgata, acrescentam: “Vamos ao campo”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Caim disse
  rationale: O verbo אָמַר significa normalmente “dizer”. A tradução mantém a frase abrupta do Texto Massorético, no qual não aparece o conteúdo da fala.
- source_word: אֶל הֶבֶל אָחִיו
  choice: a Abel, seu irmão
  rationale: A preposição אֶל indica aqui o destinatário da fala. A expressão “seu irmão” é mantida nas duas ocorrências para preservar a ênfase narrativa no vínculo entre Caim e Abel.
- source_word: וַיְהִי בִּהְיוֹתָם בַּשָּׂדֶה
  choice: Enquanto estavam no campo
  rationale: A construção introduz a circunstância temporal da ação seguinte. Esta formulação comunica o sentido com naturalidade, sem reproduzir de modo rígido o idiomatismo hebraico “e aconteceu, estando eles”.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שָׂדֶה pode designar campo ou região aberta; “campo” é direto, tradicional e adequado ao contexto.
- source_word: וַיָּקָם ... אֶל
  choice: se levantou contra
  rationale: A formulação conserva a imagem e a hostilidade do idioma hebraico, sem substituí-lo pelo mais interpretativo “atacou”.
- source_word: וַיַּהַרְגֵהוּ
  choice: e o matou
  rationale: הרג significa matar. “Matou” é lexicalmente direto; “assassinou” acrescentaria uma classificação jurídica ou moral que não está expressa pelo verbo isoladamente.
theological_decisions:
- issue: Conteúdo da fala de Caim ausente no Texto Massorético
  choice: 'Manter no texto principal a leitura mais curta e abrupta do Texto Massorético: “Caim disse a Abel, seu irmão.”'
  alternative: Inserir “Vamos ao campo”, leitura preservada por testemunhos antigos como a Septuaginta, o Pentateuco Samaritano e a Vulgata.
  rationale: A fonte hebraica fornecida não contém as palavras da fala. Como os testemunhos antigos preservam uma leitura que pode refletir texto original omitido na tradição massorética, a variante é registrada em nota, sem ser incorporada silenciosamente ao texto principal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade no Brasil. A repetição de “seu irmão” foi preservada por seu peso narrativo. A formulação “e o matou” é natural no português brasileiro e permanece clara em outras variedades.
