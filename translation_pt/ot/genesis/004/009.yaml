  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: pt
  text: 'Então Yahweh disse a Caim: “Onde está Abel, seu irmão?” Ele respondeu: “Não sei.[a] Sou eu o guardião do meu irmão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu não sabia.” A forma verbal perfeita do hebraico pode ser entendida como uma negação referente ao passado, embora, neste contexto, funcione naturalmente como uma alegação presente de desconhecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva, por transliteração, o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... perguntou / Ele respondeu
  rationale: O verbo básico significa “dizer”, e a construção narrativa faz a ação avançar. Como as falas são, respectivamente, uma pergunta e uma resposta, estes verbos comunicam naturalmente sua função no diálogo sem alterar o conteúdo.
- source_word: אֵי
  choice: Onde está
  rationale: A partícula interroga sobre localização; em português, a frase pede naturalmente o verbo “estar”.
- source_word: הֶבֶל אָחִיךָ
  choice: Abel, seu irmão
  rationale: Mantém o nome próprio e o substantivo masculino singular com o sufixo de segunda pessoa; a vírgula produz uma aposição natural em português.
- source_word: לֹא יָדַעְתִּי
  choice: Não sei
  rationale: Embora a forma verbal hebraica seja perfeita e possa admitir uma negação situada no passado, no diálogo ela funciona naturalmente como uma alegação presente de desconhecimento.
- source_word: הֲשֹׁמֵר
  choice: guardião
  rationale: O particípio de שמר designa quem guarda, vigia ou cuida. “Guardião” preserva a ideia de responsabilidade e a concisão da pergunta retórica.
- source_word: אָחִי
  choice: meu irmão
  rationale: Reproduz o substantivo masculino singular e o sufixo de primeira pessoa do texto hebraico.
- source_word: אָנֹכִי
  choice: Acaso sou eu
  rationale: A construção interrogativa com o pronome independente enfático é representada de modo natural por “Acaso sou eu”, preservando a força retórica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título.
- issue: Natureza da responsabilidade sugerida por הֲשֹׁמֵר
  choice: guardião
  alternative: responsável por cuidar
  rationale: “Guardião” conserva a metáfora aberta e a tensão da pergunta de Caim, sem explicitar ou definir além do texto o alcance de sua responsabilidade fraterna.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acaso” conserva a força retórica sem tornar a frase excessivamente coloquial; “guardião” mantém a concisão e a imagem do hebraico.
