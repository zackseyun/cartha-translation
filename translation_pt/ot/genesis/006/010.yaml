lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: A forma hifil narrativa de ילד expressa a paternidade de Noé. “Gerou” preserva o sentido especificamente paterno, é conciso e adequado ao registro bíblico sem ser obscuro.
- source_word: שְׁלֹשָׁה בָנִים
  choice: três filhos
  rationale: בָנִים designa aqui filhos do sexo masculino, conforme também indicam os três nomes apresentados em seguida.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cam e Jafé
  rationale: As ocorrências de אֶת marcam os objetos definidos e não precisam ser reproduzidas em português. Os nomes seguem suas formas tradicionais e amplamente reconhecidas em português.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional, corrente e amplamente reconhecida do nome hebraico נֹחַ em português.
