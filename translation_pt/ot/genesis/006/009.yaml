id: GEN.6.9
reference: Genesis 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: pt
  text: Estas são as gerações de Noé. Noé era um homem justo e íntegro em suas gerações.[a] Noé andava com Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os seus contemporâneos”; ou: “em seu tempo”.'
    reason: Leituras alternativas de בְּדֹרֹתָיו, expressão que pode situar Noé entre as pessoas de sua época ou no período em que viveu.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: Preserva o demonstrativo plural que introduz uma nova seção e combina naturalmente com “gerações” em português.
- source_word: תּוֹלְדֹת
  choice: as gerações de
  rationale: Mantém o termo estrutural recorrente de Gênesis e sua abertura semântica para descendência, história familiar ou relato.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אִישׁ
  choice: um homem
  rationale: Representa o substantivo masculino singular que identifica Noé e produz uma frase natural em português.
- source_word: צַדִּיק
  choice: justo
  rationale: Equivalente português tradicional e semanticamente adequado para a retidão moral de Noé.
- source_word: תָּמִים
  choice: íntegro
  rationale: Expressa inteireza e integridade de caráter sem sugerir necessariamente perfeição absoluta ou ausência de pecado.
- source_word: הָיָה
  choice: era
  rationale: O pretérito imperfeito funciona naturalmente numa descrição de caráter e condição duradoura no relato.
- source_word: בְּדֹרֹתָיו
  choice: em suas gerações
  rationale: Retém o plural e a formulação relativamente literal do hebraico, preservando a ambiguidade entre as gerações vividas por Noé e seus contemporâneos.
- source_word: אֶת הָאֱלֹהִים
  choice: com Deus
  rationale: No idioma formado com o verbo “andar”, transmite a relação com Deus indicada pelo hebraico.
- source_word: הִתְהַלֶּךְ
  choice: andava
  rationale: Preserva a metáfora bíblica do modo de viver e, com o aspecto verbal português, apresenta essa conduta como habitual.
theological_decisions:
- issue: Sentido de תָּמִים na descrição de Noé
  choice: “íntegro” como descrição de inteireza moral
  alternative: “irrepreensível”, “perfeito” ou “sem defeito”
  rationale: “Íntegro” conserva a forte aprovação do texto sem introduzir a afirmação de impecabilidade absoluta que o hebraico não exige.
- issue: Sentido de בְּדֹרֹתָיו
  choice: manter no texto “em suas gerações”
  alternative: “entre os seus contemporâneos” ou “em seu tempo”
  rationale: A formulação principal conserva o plural e a abertura interpretativa do hebraico; a nota oferece as leituras idiomáticas mais comuns sem decidir silenciosamente entre elas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação “as gerações de” conserva o elo estrutural de Gênesis; “andava com Deus” mantém a metáfora bíblica. O marcador da nota foi colocado após a expressão ambígua a que se refere.
