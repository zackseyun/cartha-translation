  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: pt
  text: 'Então Yahweh disse: “Meu Espírito não contenderá para sempre com o ser humano[a], pois ele é carne[b]. Seus dias serão cento e vinte anos[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu Espírito não permanecerá para sempre no ser humano”. O sentido do verbo hebraico é incerto e pode indicar permanência, em vez de contenda.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “porque ele também é carne”.'
    reason: lexical_alternative
  - marker: c
    text: Os cento e vinte anos podem ser entendidos como o prazo restante até o dilúvio ou como uma limitação da vida humana; o hebraico não torna inequívoca a referência.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: יָדוֹן
  choice: contenderá
  rationale: O verbo é difícil e discutido. Esta opção preserva a ideia possível de oposição ou contenção divina, enquanto a alternativa ‘permanecerá’ é registrada em nota.
- source_word: רוּחִי
  choice: Meu Espírito
  rationale: O possessivo na fala divina favorece uma referência ao Espírito de Deus; a formulação não impõe ao texto desenvolvimentos doutrinários posteriores.
- source_word: בָאָדָם
  choice: com o ser humano
  rationale: Com ‘contender’, a preposição ב é expressa naturalmente por ‘com’. ‘Ser humano’ comunica o uso genérico do singular אָדָם sem confundi-lo com o indivíduo Adão.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração indefinida indicada neste contexto.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: pois ele é carne
  rationale: A rara forma conjuntiva é entendida causalmente. ‘Carne’ conserva a textura antropológica do hebraico; a possível força de ‘também’ é preservada em nota.
- source_word: וְהָיוּ יָמָיו
  choice: Seus dias serão
  rationale: Mantém a coordenação simples do hebraico e evita explicitar como conclusão uma relação inferencial que o texto não marca inequivocamente.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: cento e vinte anos
  rationale: Forma literária clara e natural em português.
theological_decisions:
- issue: Sentido de יָדוֹן e relação do Espírito de Deus com a humanidade
  choice: “Meu Espírito não contenderá... com”
  alternative: “Meu Espírito não permanecerá... no”
  rationale: A forma verbal admite análises concorrentes. O texto principal segue a leitura de contenda ou contenção, mas a nota conserva a leitura de permanência sem resolver artificialmente a ambiguidade.
- issue: Referência de רוּחִי
  choice: “Meu Espírito”
  alternative: “meu sopro” ou “meu fôlego”
  rationale: A fala divina e o sufixo possessivo favorecem ‘Meu Espírito’, sem especificar além do que o texto veterotestamentário afirma.
- issue: Alcance de אָדָם
  choice: “o ser humano”, singular genérico
  alternative: “a humanidade”
  rationale: O português mantém o valor representativo e genérico do termo, enquanto evita que ‘homem’ seja entendido apenas como masculino adulto ou que ‘Adão’ seja tomado como nome próprio.
- issue: Referência dos cento e vinte anos
  choice: Manter a formulação sem explicar se designa prazo até o dilúvio ou limite de longevidade
  alternative: Explicitar uma das duas interpretações
  rationale: O versículo admite ambas as leituras no contexto e a tradução não deve decidir uma questão interpretativa que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘ser humano’ para o singular genérico אָדָם, conserva ‘carne’ e o nome Yahweh, e registra em notas as ambiguidades lexicais e interpretativas genuínas.
