  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I am grieved over having made them[b].”
translation:
  language: pt
  text: 'Então Yahweh disse: “Apagarei da face do solo o homem que criei[a] — desde o homem até os animais domésticos, os seres rastejantes e as aves dos céus[b] —, pois estou entristecido por tê-los feito[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade que criei”. O hebraico adam pode designar coletivamente a humanidade; “o homem” preserva aqui a repetição do mesmo termo na expressão seguinte.
    reason: lexical_alternative
  - marker: b
    text: “Aves dos céus” reproduz literalmente a expressão hebraica; também pode ser traduzida por “aves do céu”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pois lamento tê-los feito” ou “pois me arrependo de tê-los feito”. O verbo hebraico expressa profunda tristeza diante de uma ação anterior; o contexto não afirma que Deus desconhecesse o que aconteceria nem que tivesse cometido um erro moral.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino YHWH em forma portuguesa amplamente reconhecível, em vez de substituí-lo por um título.
- source_word: אֶמְחֶה
  choice: Apagarei
  rationale: Mantém a imagem concreta de apagar ou eliminar de uma superfície, reforçada pela expressão seguinte, “da face do solo”.
- source_word: הָאָדָם
  choice: o homem
  rationale: O termo é coletivo neste contexto, mas “o homem” conserva a linguagem representativa do hebraico e a repetição de אָדָם na enumeração seguinte.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face do solo
  rationale: Reproduz de modo claro a imagem hebraica e distingue אֲדָמָה, solo ou chão, de uma referência mais geral à terra ou ao mundo.
- source_word: בְּהֵמָה
  choice: animais
  rationale: É uma formulação natural e abrangente em português para esta classe de seres vivos na enumeração, sem o tom arcaico de “bestas”.
- source_word: רֶמֶשׂ
  choice: seres rastejantes
  rationale: Expressa a categoria hebraica de criaturas que se movem junto ao chão sem restringi-la indevidamente a répteis.
- source_word: עוֹף הַשָּׁמָיִם
  choice: aves dos céus
  rationale: Conserva a expressão genitiva hebraica e o estilo característico de Gênesis; “aves do céu” também seria possível.
- source_word: נִחַמְתִּי
  choice: estou entristecido
  rationale: Comunica a profunda dor atribuída a Yahweh e mantém o vínculo com Gênesis 6:6, sem excluir a possibilidade lexical de “lamento” ou “arrependo-me”.
- source_word: כִּי עֲשִׂיתִם
  choice: por tê-los feito
  rationale: Representa naturalmente em português a ação anterior que é causa da tristeza e preserva o sufixo plural referente aos seres mencionados.
theological_decisions:
- issue: A tristeza divina expressa por נִחַמְתִּי
  choice: pois estou entristecido por tê-los feito
  alternative: pois lamento tê-los feito; pois me arrependo de tê-los feito
  rationale: A tradução afirma a tristeza real atribuída a Deus e preserva a tensão do texto, sem acrescentar que Deus não tivesse conhecimento prévio ou tivesse cometido um erro moral. As alternativas lexicalmente possíveis são registradas em nota.
- issue: O sentido coletivo de הָאָדָם
  choice: o homem
  alternative: a humanidade; os seres humanos
  rationale: Embora o referente seja a humanidade coletivamente, “o homem” preserva a forma representativa e a repetição deliberada do mesmo termo hebraico na frase seguinte.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário acessível. A ordem “Apagarei da face do solo” conserva a imagem hebraica sem soar excessivamente rígida. Os travessões delimitam a enumeração e tornam a longa fala clara. “Yahweh” preserva o nome próprio divino.
