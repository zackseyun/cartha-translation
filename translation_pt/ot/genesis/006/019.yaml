  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição abrangente “todo ser vivo, de toda carne” foi preservada por refletir a formulação hebraica, enquanto “dois de cada espécie” explicita naturalmente o valor distributivo no contexto.
