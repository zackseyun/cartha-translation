base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: pt
  text: E, de todo ser vivo[b], de toda carne[a], você levará para dentro da arca dois de cada espécie, para conservá-los vivos com você; serão um macho e uma fêmea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Toda carne” é uma expressão hebraica que aqui se refere aos seres vivos corpóreos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “toda criatura viva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכָּל
  choice: E, de todo
  rationale: Preserva tanto a ligação com o contexto anterior quanto o valor distributivo da preposição e de כֹּל, em português natural.
- source_word: הַחַי
  choice: ser vivo
  rationale: O substantivo adjetival designa amplamente aquilo que vive; “ser vivo” mantém essa abrangência sem restringir antecipadamente a referência.
- source_word: מִכָּל בָּשָׂר
  choice: de toda carne
  rationale: Mantém a expressão hebraica abrangente “toda carne”, que neste contexto se refere aos seres vivos corpóreos.
- source_word: שְׁנַיִם מִכֹּל
  choice: dois de cada espécie
  rationale: Comunica com clareza o sentido distributivo — dois de cada categoria em vista — sem sugerir apenas dois indivíduos dentre o conjunto inteiro.
- source_word: תָּבִיא
  choice: você levará
  rationale: O imperfeito hifil em contexto instrutivo tem força de ordem; o futuro em português conserva o tom solene da determinação divina.
- source_word: אֶל הַתֵּבָה
  choice: para a arca
  rationale: Com “levar”, a preposição “para” expressa naturalmente o movimento em direção ao interior da embarcação; “arca” é a designação tradicional e adequada de תֵּבָה neste relato.
- source_word: לְהַחֲיֹת
  choice: para conservá-los vivos
  rationale: 'Reproduz o sentido causativo do hifil: fazer viver ou preservar com vida.'
- source_word: אִתָּךְ
  choice: com você
  rationale: Tradução direta e natural da ideia de companhia.
- source_word: זָכָר וּנְקֵבָה
  choice: macho e fêmea
  rationale: No contexto dos animais levados à arca, estes são os termos correntes e precisos para a distinção sexual expressa pelo hebraico.
- source_word: יִהְיוּ
  choice: serão
  rationale: Conserva a forma verbal e a força normativa da composição exigida para cada par.
theological_decisions: []
