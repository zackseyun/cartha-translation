  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: pt
  text: Mas estabelecerei a minha aliança com você[a], e você entrará na arca — você, seus filhos, sua mulher e as mulheres de seus filhos com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confirmarei a minha aliança com você”. Em contextos de aliança, o verbo hebraico pode ter ambos os sentidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Mas estabelecerei
  rationale: O hifil de קום com בְּרִית pode significar estabelecer ou confirmar uma aliança. “Estabelecerei” expressa naturalmente a promessa futura; “mas” explicita o contraste discursivo com o anúncio anterior de destruição.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: “Aliança” é o equivalente português consagrado e preciso para בְּרִית, preservando sua relevância teológica e canônica.
- source_word: אִתָּךְ
  choice: com você
  rationale: A preposição indica tanto a relação de aliança quanto, no fim do versículo, o acompanhamento. “Com você” é claro e natural em português internacional com legibilidade brasileira.
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: e você entrará na arca
  rationale: בוא pode significar vir, ir ou entrar; com a arca como destino, “entrará na arca” é a formulação portuguesa mais direta e idiomática.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: “Arca” é o termo tradicional e contextualmente exato para תֵּבָה no relato de Noé.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente é enfático. Sua posição após o travessão preserva a ênfase e introduz naturalmente a enumeração.
- source_word: וּבָנֶיךָ
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino; “filhos” conserva essa informação.
- source_word: וְאִשְׁתְּךָ
  choice: sua mulher
  rationale: No contexto familiar, “sua mulher” traduz com naturalidade a esposa de Noé e corresponde diretamente à expressão hebraica.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: as mulheres de seus filhos
  rationale: A formulação acompanha de perto a construção hebraica, literalmente “as mulheres de seus filhos”, sem recorrer ao termo um pouco mais interpretativo “noras”.
theological_decisions:
- issue: Sentido da expressão de aliança
  choice: 'promessa futura: “estabelecerei a minha aliança com você”'
  alternative: “confirmarei a minha aliança com você”
  rationale: O hebraico admite tanto o estabelecimento quanto a confirmação de uma aliança. O texto não esclarece por si só se a referência é à instituição de uma nova aliança ou à ratificação de um compromisso divino anterior; por isso, a leitura principal usa a formulação tradicional, e a alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” para clareza ampla e legibilidade brasileira. O travessão preserva a ênfase do pronome hebraico antes da enumeração. Mantém-se a repetição final “com você”, presente no original.
