  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: pt
  text: Mas Noé achou favor aos olhos de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Noé achou graça aos olhos de Yahweh.”'
    reason: Registra tanto a tradução alternativa da conjunção וְ como “E” quanto a alternativa lexical “graça” para חֵן.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Mas Noé
  rationale: A conjunção וְ pode significar “e”, mas aqui introduz um contraste com a corrupção humana e o juízo descritos no contexto imediato. “Mas Noé” expressa naturalmente esse contraste em português.
- source_word: מָצָא
  choice: achou
  rationale: O verbo מָצָא significa normalmente “achar/encontrar”. Na expressão “achar favor”, “achou” conserva de perto o idioma hebraico e soa natural em português bíblico contemporâneo.
- source_word: חֵן
  choice: favor
  rationale: חֵן pode indicar favor, graça ou aceitação. “Favor” preserva a amplitude do termo no contexto e evita impor associações teológicas posteriores, sem excluir a bondade graciosa de Deus.
- source_word: בְּ/עֵינֵי
  choice: aos olhos de
  rationale: A expressão hebraica significa literalmente “aos olhos de” e, por extensão, “na avaliação de”. A formulação portuguesa mantém a metáfora original e é clara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חֵן em relação à disposição divina para com Noé
  choice: favor
  alternative: graça
  rationale: “Favor” mantém o idioma hebraico e a abertura semântica do termo, comunicando a disposição positiva de Yahweh para com Noé sem restringi-la a uma formulação doutrinária posterior.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” representa diretamente o Tetragrama e preserva seu caráter de nome próprio.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A expressão tradicional “aos olhos de” conserva a imagem hebraica sem perder clareza.
