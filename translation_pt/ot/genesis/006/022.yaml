  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: pt
  text: E Noé fez[a] conforme tudo o que Deus lhe havia ordenado; assim fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o verbo «fez» para dar ênfase: «E Noé fez ... assim fez».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: E Noé fez
  rationale: O verbo עשה tem o sentido amplo de “fazer”. Aqui resume a ação obediente de Noé diante das instruções anteriores; a conjunção וַ é preservada por “E”.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: A expressão indica plena correspondência entre a ação de Noé e a totalidade da ordem divina.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: צוה denota uma ordem dotada de autoridade. O mais-que-perfeito composto expressa naturalmente em português que a ordem precedeu seu cumprimento.
- source_word: אֹתוֹ
  choice: lhe
  rationale: O sufixo masculino singular remete a Noé como destinatário da ordem; “lhe” é a construção portuguesa natural com “ordenar”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים rege verbo no singular e designa o único Deus.
- source_word: כֵּן עָשָׂה
  choice: assim ele fez
  rationale: “Assim” retoma o padrão expresso pela ordem divina, e a repetição de “fez” conserva a ênfase deliberada do hebraico na obediência de Noé.
theological_decisions:
- issue: Repetição da fórmula de obediência
  choice: 'Manter as duas ocorrências de “fez”: “E Noé fez ... assim ele fez”.'
  alternative: Noé fez tudo o que Deus lhe havia ordenado.
  rationale: O hebraico repete עשה para realçar a correspondência completa entre a ordem de Deus e a ação de Noé. A tradução mantém essa ênfase sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com construção levemente solene para preservar a repetição enfática do hebraico. “Havia ordenado” é natural ao leitor brasileiro e também compreensível no português internacional.
