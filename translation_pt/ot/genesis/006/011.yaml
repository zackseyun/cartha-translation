  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: pt
  text: A terra estava corrompida diante de Deus[a], e a terra estava cheia de violência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra estava corrompida aos olhos de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: estava corrompida
  rationale: O nifal de שׁחת descreve aqui a terra em estado de corrupção ou degradação. “Estava corrompida” preserva o sentido resultativo e se ajusta ao contexto moral, sem excluir totalmente a ideia mais ampla de deterioração.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar “terra” ou “país/região”. No contexto do dilúvio, “a terra” comunica melhor o alcance narrativo; a repetição hebraica foi mantida para conservar a ênfase.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: לִפְנֵי expressa estar diante de alguém ou em sua presença. “Diante de Deus” é natural, conciso e formalmente próximo do hebraico, preservando a possibilidade contextual de avaliação divina.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O contexto e a sintaxe apontam claramente para o Deus único, exigindo a forma singular.
- source_word: וַתִּמָּלֵא
  choice: estava cheia
  rationale: O nifal de מלא indica que a terra veio a ficar cheia. Em português, “estava cheia” expressa com naturalidade o estado resultante sem tornar a construção artificialmente passiva.
- source_word: חָמָס
  choice: violência
  rationale: חָמָס denota violência, brutalidade ou injustiça violenta. “Violência” é a equivalência direta e mantém a gravidade do termo sem explicitação excessiva.
- source_word: וַ
  choice: e
  rationale: O waw coordena e faz avançar a narrativa. Na segunda oração, “e” traduz naturalmente essa ligação; no início do versículo, não foi acrescentado um marcador como “ora” ou “então”, pois o hebraico não contém um advérbio temporal explícito.
theological_decisions:
- issue: Natureza da corrupção descrita
  choice: Corrupção moral da terra ou da sociedade humana diante de Deus
  alternative: Ruína física da terra
  rationale: O contexto imediato destaca a maldade humana e a violência. “Corrompida” comunica primariamente a dimensão moral sem acrescentar uma formulação doutrinária mais específica do que o texto.
- issue: Sentido de לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  alternative: aos olhos de Deus
  rationale: A opção principal conserva a expressão relacional e espacial do hebraico. A alternativa explicita a noção de avaliação divina, possível no contexto, e por isso é registrada em nota sem substituir a formulação mais próxima do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “a terra” reproduz a ênfase do hebraico. “Diante de Deus” foi preferido a “perante Deus” por ser corrente sem perder solenidade.
