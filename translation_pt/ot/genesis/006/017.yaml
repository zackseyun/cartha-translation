  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: pt
  text: Quanto a mim, eis que vou trazer as águas do dilúvio sobre a terra, para destruir toda carne em que há o sopro[a] de vida debaixo dos céus. Tudo o que há na terra morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito de vida”. A palavra hebraica רוּחַ pode significar “sopro”, “vento” ou “espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: O pronome independente, acompanhado da conjunção, dá ênfase e contraste ao sujeito. “Quanto a mim” reproduz esse destaque de modo natural em português.
- source_word: הִנְנִי מֵבִיא
  choice: eis que vou trazer
  rationale: הִנְנִי confere solenidade e imediatismo, enquanto o particípio מֵבִיא apresenta a ação como iminente. “Eis que vou trazer” conserva ambas as nuances sem sugerir que o dilúvio já começou.
- source_word: הַמַּבּוּל מַיִם
  choice: as águas do dilúvio
  rationale: A expressão hebraica associa o termo técnico para o dilúvio a “águas”. Esta formulação é clara e natural, mantendo a água como agente da destruição.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Terra” corresponde ao alcance abrangente do contexto, e “sobre” expressa diretamente a relação espacial.
- source_word: לְשַׁחֵת
  choice: para destruir
  rationale: O infinitivo introduz a finalidade da vinda das águas; “destruir” comunica diretamente a força do verbo.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Preserva uma expressão bíblica central e compreensível, sem restringi-la apenas a seres humanos ou apenas a animais.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: em que há o sopro de vida
  rationale: “Sopro de vida” representa naturalmente o princípio vital dos seres animados neste contexto. A construção “em que” mantém a referência coletiva a “toda carne”.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: debaixo dos céus
  rationale: A expressão designa de maneira abrangente o domínio terrestre sob o céu. O plural “céus” reflete a forma hebraica e é corrente em português bíblico.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Tudo o que há na terra
  rationale: Formulação idiomática que conserva a abrangência totalizante da declaração hebraica.
- source_word: יִגְוָע
  choice: morrerá
  rationale: O verbo denota morrer ou expirar. “Morrerá” é direto, solene e compreensível, sem atenuar o sentido.
theological_decisions:
- issue: Sentido de רוּחַ em רוּחַ חַיִּים
  choice: sopro de vida
  alternative: espírito de vida
  rationale: No contexto do dilúvio, a expressão aponta mais naturalmente para o sopro vital dos seres vivos e se relaciona à linguagem da criação. Como רוּחַ também pode significar “espírito”, a alternativa genuína é preservada em nota, evitando impor uma antropologia mais específica do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade em “eis que”. A tradução preserva expressões bíblicas relevantes, como “toda carne”, mas emprega sintaxe natural e amplamente compreensível, com boa legibilidade brasileira.
