  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: pt
  text: 'Então Deus disse a Noé: “O fim de toda carne chegou diante de mim,[a] pois a terra está cheia de violência por causa deles. Eis que vou destruí-los juntamente com a terra.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um fim de toda carne chegou diante de mim”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “eu os estou destruindo com a terra”. A construção também pode ser entendida como “vou destruí-los e destruir a terra”.
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: o fim de toda carne
  rationale: Mantém a expressão abrangente e solene do hebraico, sem restringi-la apenas à humanidade; no contexto do dilúvio, ela inclui os seres vivos sujeitos ao juízo.
- source_word: בָּא לְפָנַי
  choice: chegou diante de mim
  rationale: 'Preserva a imagem hebraica e sua possível nuance judicial: o fim decretado chegou à presença de Deus para execução.'
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: a terra está cheia de violência
  rationale: “Violência” traduz diretamente חָמָס neste contexto de corrupção e brutalidade; “terra” corresponde ao alcance amplo da narrativa.
- source_word: מִפְּנֵיהֶם
  choice: por causa deles
  rationale: 'Expressa naturalmente o valor causal da construção: eles são responsáveis pela violência que enche a terra.'
- source_word: וְהִנְנִי מַשְׁחִיתָם
  choice: Eis que vou destruí-los
  rationale: “Eis que” conserva a apresentação enfática, enquanto “vou destruir” comunica de modo natural a ação iminente indicada pelo particípio.
- source_word: אֶת־הָאָרֶץ
  choice: juntamente com a terra
  rationale: Evita que “com a terra” seja entendido como instrumento e expressa a leitura comitativa provável, sem ocultar a dificuldade sintática do hebraico.
theological_decisions:
- issue: Alcance de “toda carne”
  choice: Manter a categoria ampla “toda carne”
  alternative: Restringir a “toda a humanidade”
  rationale: O uso no relato do dilúvio abrange mais do que os seres humanos, e a formulação literal preserva essa amplitude.
- issue: Sentido de הָאָרֶץ
  choice: terra
  alternative: país ou região
  rationale: A moldura universal do relato favorece “terra”, embora o substantivo hebraico possa ter sentido regional em outros contextos.
- issue: Relação sintática de אֶת־הָאָרֶץ
  choice: destruí-los juntamente com a terra
  alternative: destruí-los e destruir a terra; destruí-los com a terra
  rationale: A construção hebraica é difícil. A opção escolhida comunica que eles e a terra estão incluídos na destruição, evitando a sugestão involuntária de que a terra seja o instrumento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém expressões bíblicas relevantes (“toda carne”, “diante de mim”, “eis que”), mas usa “juntamente com” para esclarecer a relação sintática final sem eliminar a ambiguidade, registrada em nota.
