  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: pt
  text: Quanto a você, pegue para si um pouco de todo tipo de alimento que pode ser comido[a] e reúna-o para si; isso servirá de alimento para você e para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que se come”. O hebraico também pode ser entendido como uma descrição do alimento próprio para consumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: pegue para si
  rationale: O imperativo de לקח significa diretamente “pegar” ou “tomar”, e לְךָ tem aqui valor benefactivo/reflexivo. “Pegue para si” é claro, atual e mantém a responsabilidade pessoal de Noé.
- source_word: מִכָּל מַאֲכָל
  choice: um pouco de todo tipo de alimento
  rationale: A construção מן + כל indica que Noé deve retirar provisões de toda a variedade pertinente, sem sugerir que leve consigo a totalidade de todo alimento existente.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: que pode ser comido
  rationale: O Nifal imperfeito de אכל pode descrever aquilo que se come ou que é próprio para consumo. A formulação escolhida expressa adequadamente a aptidão para ser consumido sem apagar a alternativa mais literal.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: e ajunte-o consigo
  rationale: אסף significa reunir ou ajuntar; אֵלֶיךָ indica que as provisões devem ser recolhidas para ficar com Noé. A tradução conserva ambos os elementos de modo natural.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: isso servirá de alimento para você e para eles
  rationale: A sequência verbal aponta para o resultado futuro da ordem. “Servirá de alimento” comunica de modo idiomático לְאָכְלָה e mantém a distinção explícita entre Noé e os animais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pegue” evita solenidade artificial, enquanto “ajunte-o consigo” preserva a estrutura e o sentido do hebraico. O pronome “eles” retoma os seres vivos mencionados no contexto imediato.
