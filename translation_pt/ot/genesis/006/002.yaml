source:
  edition: WLC
  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: pt
  text: Os filhos de Deus[a] viram que as filhas dos seres humanos eram bonitas[b] e tomaram para si esposas dentre todas as que escolheram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seres divinos”. A identidade dos “filhos de Deus” é debatida; as principais interpretações incluem seres celestiais, governantes humanos ou a linhagem de Sete.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “eram de boa aparência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: os filhos de Deus
  rationale: Tradução formalmente próxima que conserva a expressão hebraica e não decide a identidade controversa de seus referentes.
- source_word: בְּנוֹת הָאָדָם
  choice: as filhas dos seres humanos
  rationale: Expressa o uso coletivo de אָדָם em português atual e preserva o contraste literário com “os filhos de Deus”.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: eram bonitas
  rationale: Neste contexto, טוֹב descreve a aparência atraente das mulheres; “bonitas” comunica esse sentido de modo natural sem sugerir bondade moral.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: tomaram para si esposas
  rationale: Preserva tanto o sentido matrimonial de נָשִׁים neste contexto quanto a expressão reflexiva לָהֶם, sem transformar explicitamente a ação em uma cerimônia de casamento.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: dentre todas as que escolheram
  rationale: Mantém a ideia de seleção ampla expressa por מִכֹּל e segue de modo claro e idiomático o verbo “escolheram”.
theological_decisions:
- issue: Identidade dos “filhos de Deus”
  choice: Conservar literalmente “os filhos de Deus”, sem identificar seus referentes.
  alternative: Seres celestiais; governantes humanos; ou a linhagem de Sete.
  rationale: A expressão hebraica é objeto de interpretações divergentes, e o próprio versículo não resolve a questão; a tradução deve preservar essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a ordem narrativa e a ambiguidade interpretativa do hebraico sem recorrer a terminologia denominacional.
