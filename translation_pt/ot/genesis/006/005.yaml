reference: Genesis 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: pt
  text: E Yahweh viu que a maldade do ser humano era grande na terra[a] e que cada inclinação dos pensamentos de seu coração era somente má, o tempo todo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a maldade da humanidade era grande na terra”. O hebraico אָדָם refere-se aqui coletivamente à humanidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “somente má todo o dia”; ou: “continuamente má”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: E ... viu
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... viu” conserva essa sequência sem acrescentar uma nuance temporal não expressa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: a maldade do ser humano era grande
  rationale: רָעָה denota aqui maldade moral, e רַבָּה indica sua grande extensão ou intensidade. “Ser humano” comunica o valor coletivo de אָדָם em português atual.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto primevo, אֶרֶץ se refere amplamente à terra, não a um território particular.
- source_word: יֵצֶר
  choice: inclinação
  rationale: Neste contexto, designa o impulso, a disposição ou o propósito formado no interior da pessoa; “inclinação” mantém essa amplitude.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: os pensamentos do seu coração
  rationale: Preserva a expressão antropológica hebraica, na qual o coração abrange pensamento, vontade e desejo, sem reduzi-lo apenas à mente.
- source_word: רַק רַע
  choice: somente má
  rationale: רַק restringe de modo enfático, e רַע tem sentido moral. A concordância no feminino retoma “inclinação”.
- source_word: כָּל הַיּוֹם
  choice: o tempo todo
  rationale: Equivalente português natural para a ideia idiomática de continuidade expressa literalmente por “todo o dia”.
theological_decisions:
- issue: Representação de יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém no texto o nome divino pessoal e evita resolver a forma em um título, embora “SENHOR” seja tradicional em muitas traduções.
- issue: Sentido coletivo de הָאָדָם
  choice: ser humano
  alternative: humanidade; homem
  rationale: O substantivo singular tem referência coletiva à raça humana. “Ser humano” conserva o singular, permite a retomada por “seu coração” e é claro no português contemporâneo.
- issue: Alcance de יֵצֶר מַחְשְׁבֹת לִבּוֹ
  choice: toda inclinação dos pensamentos do seu coração
  alternative: todo propósito dos pensamentos do seu coração
  rationale: “Inclinação” preserva a possível referência tanto à disposição interior quanto ao propósito formado, sem limitar o texto a uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o paralelismo das duas constatações introduzidas por “que”, e a expressão “pensamentos do seu coração” mantém a antropologia figurada do hebraico.
