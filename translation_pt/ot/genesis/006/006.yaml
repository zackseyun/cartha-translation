source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh grieved over having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: pt
  text: E Yahweh lamentou[b] ter feito a humanidade[a] na terra e sentiu profunda dor em seu coração.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ser humano”. O hebraico ’adam refere-se aqui coletivamente à raça humana.
    reason: lexical_alternative
  - marker: b
    text: Ou “arrependeu-se de ter feito” ou “teve pesar de ter feito”. O verbo hebraico, no nifal, expressa profunda tristeza por uma ação anterior; neste contexto, não indica arrependimento por pecado nem exige a ideia de surpresa ou erro.
    reason: lexical_alternative
  - marker: c
    text: Ou “e entristeceu-se em seu coração”. A expressão hebraica descreve dor interior profunda; literalmente, “para o seu coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: lamentou ter feito
  rationale: O nifal de נחם expressa aqui profunda tristeza diante de uma ação anterior. “Lamentou” preserva essa dor sem sugerir arrependimento moral; a nota registra a alternativa mais literal e teologicamente tensa, “arrependeu-se de ter feito”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o do título “Senhor”.
- source_word: כִּי עָשָׂה
  choice: ter feito
  rationale: A construção infinitiva portuguesa exprime com naturalidade o conteúdo e a causa do lamento em relação ao ato anterior de criar.
- source_word: הָאָדָם
  choice: a humanidade
  rationale: Neste contexto, אדם tem sentido coletivo e designa a raça humana, não apenas o indivíduo Adão nem somente os homens do sexo masculino.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto de Gênesis, refere-se à terra como o mundo habitado, não a uma região específica.
- source_word: וַיִּתְעַצֵּב
  choice: isso lhe causou profunda dor
  rationale: O hitpael de עצב comunica dor interior intensa. A formulação portuguesa mantém a força afetiva e evita repetir “lamentou” ou “entristeceu-se”.
- source_word: אֶל־לִבּוֹ
  choice: no coração
  rationale: Embora אֶל seja literalmente “para”, a expressão idiomática indica o íntimo; “no coração” é natural em português e preserva a imagem hebraica.
theological_decisions:
- issue: Linguagem antropopática a respeito de Deus
  choice: Afirmar diretamente que Yahweh lamentou e sentiu profunda dor, sem explicar a linguagem como mera aparência nem atribuir erro moral a Deus.
  alternative: “Yahweh arrependeu-se de ter feito” ou “pareceu entristecer-se”.
  rationale: O hebraico atribui a Yahweh tristeza real e dor íntima em linguagem relacional. A tradução preserva essa tensão; a nota inclui “arrependeu-se” como alternativa lexical possível, mas esclarece que o verbo não implica necessariamente pecado, falha moral ou surpresa cognitiva.
- issue: Sentido coletivo de הָאָדָם
  choice: “a humanidade”
  alternative: “o ser humano” ou “o homem”
  rationale: O contexto abrange coletivamente a raça humana. “A humanidade” comunica esse referente com precisão e naturalidade em português contemporâneo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a progressão narrativa do waw consecutivo. A ordem das notas segue a posição dos marcadores no texto, e a linguagem preserva tanto a intensidade emocional quanto a tensão teológica do hebraico.
