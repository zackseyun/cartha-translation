  terminology: “Yahweh” está consistente com o nome divino no texto-base. “Humanidade” comunica o sentido coletivo de הָאָדָם com legibilidade internacional. As notas distinguem a alternativa “arrependeu-se” do sentido de arrependimento moral e registram a alternativa mais próxima para a segunda oração.
