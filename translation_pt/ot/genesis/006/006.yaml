revisions:
- from: Então Yahweh lamentou ter feito a humanidade na terra[a], e isso lhe causou profunda dor no coração.[b]
  to: E Yahweh lamentou[b] ter feito a humanidade[a] na terra e sentiu profunda dor em seu coração.[c]
  rationale: A revisão elimina a construção causal que enfraquecia a predicação direta do segundo verbo hebraico, substitui “Então” pela conexão narrativa não marcada “E” e redistribui as notas para que cada alternativa esteja ancorada na expressão a que corresponde. Não resolve a tensão antropopática nem introduz explicações doutrinárias no texto.
