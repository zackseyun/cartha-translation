reference: Genesis 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: pt
  text: Os nefilins[a] estavam na terra naqueles dias — e também depois —, quando os filhos de Deus[b] se uniam às filhas dos seres humanos[c], e elas lhes davam filhos. Esses eram os poderosos da antiguidade, homens de renome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “os gigantes”. O termo hebraico “nefilins” é raro, e seu sentido exato é incerto.
    reason: alternative_reading
  - marker: b
    text: “Filhos de Deus” também pode ser entendido como “seres divinos”; algumas interpretações os identificam como governantes humanos ou como a linhagem piedosa de Sete.
    reason: alternative_reading
  - marker: c
    text: O hebraico diz literalmente “filhas do homem”, empregando “homem” em sentido coletivo, isto é, mulheres da humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: os nefilins
  rationale: O termo hebraico é raro e seu sentido exato é discutido. A transliteração evita impor as interpretações “gigantes” ou “caídos” ao texto principal.
- source_word: בָאָרֶץ
  choice: na terra
  rationale: No contexto da história primeva, “terra” é o sentido mais amplo e natural, embora “país” ou “região” sejam lexicalmente possíveis em outros contextos.
- source_word: בַּיָּמִים הָהֵם וְגַם אַחֲרֵי כֵן
  choice: naqueles dias — e também depois —
  rationale: Preserva tanto a expressão temporal quanto a força aditiva de וְגַם, com pontuação natural em português.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: quando ... se uniam a
  rationale: A oração descreve a circunstância temporal, e a expressão hebraica possui sentido sexual neste contexto. “Se uniam a” comunica isso de modo digno e corrente sem explicitação excessiva.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: os filhos de Deus
  rationale: Tradução formalmente próxima que conserva a abertura interpretativa da expressão hebraica, sem decidir se os referentes são seres celestiais, governantes ou seres humanos de uma linhagem piedosa.
- source_word: בְּנוֹת הָאָדָם
  choice: as filhas dos seres humanos
  rationale: 'Expressa em português corrente o valor coletivo de אָדָם: mulheres pertencentes à humanidade. Uma nota registra essa característica do hebraico.'
- source_word: וְיָלְדוּ לָהֶם
  choice: e elas lhes davam filhos
  rationale: Torna explícito o objeto implícito “filhos” e conserva o sentido do imperfeito hebraico no contexto da ação reiterada ou habitual.
- source_word: הֵמָּה הַגִּבֹּרִים
  choice: Esses eram os poderosos
  rationale: Mantém o pronome resumitivo e a amplitude de גִּבּוֹרִים, sem restringir o termo a “guerreiros” nem idealizá-lo como “heróis”.
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: da antiguidade
  rationale: Equivalente português natural para a referência a tempos remotos.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: homens de renome
  rationale: Reproduz de modo idiomático e digno a expressão hebraica que indica fama ou reputação.
theological_decisions:
- issue: Identidade dos “filhos de Deus”
  choice: Manter literalmente “os filhos de Deus” no texto principal.
  alternative: “Seres divinos”, seres angelicais, governantes humanos ou a linhagem piedosa de Sete.
  rationale: O referente da expressão é debatido, e o hebraico não resolve inequivocamente a questão neste versículo. A tradução conserva essa tensão interpretativa.
- issue: Sentido de הַנְּפִלִים
  choice: Transliterar como “nefilins”.
  alternative: “Gigantes” ou “caídos”.
  rationale: A etimologia e o sentido preciso do termo são incertos. A transliteração evita elevar uma tradição interpretativa à condição de tradução indiscutível.
- issue: Sentido coletivo de אָדָם em בְּנוֹת הָאָדָם
  choice: Traduzir como “filhas dos seres humanos”.
  alternative: “Filhas do homem” ou “filhas da humanidade”.
  rationale: A escolha comunica com clareza moderna que אָדָם designa coletivamente a humanidade, sem sugerir que se trate das filhas de um indivíduo específico.
- issue: Referente de “Esses eram os poderosos”
  choice: Conservar o pronome demonstrativo sem explicitar além do hebraico a relação exata entre os nefilins, os filhos nascidos e os poderosos.
  alternative: Identificar explicitamente os poderosos como os filhos dessa união ou como os próprios nefilins.
  rationale: A construção hebraica permite discussão sobre o referente preciso; explicitá-lo resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos desnecessários, preserva os termos teologicamente disputados e usa notas apenas onde a ambiguidade do hebraico ou uma alternativa tradicional relevante precisa ser registrada.
