  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: pt
  text: E aconteceu que, quando a humanidade[a] começou a se multiplicar sobre a face do solo e lhes nasceram filhas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «o ser humano» ou «o homem»; o substantivo está no singular, mas tem aqui sentido coletivo e se refere à humanidade em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz um novo desenvolvimento na narrativa e preserva a ligação com o contexto sem recorrer ao arcaico «E sucedeu».
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, introduz a oração temporal ligada a וַיְהִי.
- source_word: הֵחֵל
  choice: começou
  rationale: O hifil nesta construção indica o início de uma ação.
- source_word: הָאָדָם
  choice: a humanidade
  rationale: Embora singular na forma, o termo tem sentido coletivo aqui e se refere ao conjunto dos seres humanos, não ao indivíduo Adão.
- source_word: לָרֹב
  choice: a se multiplicar
  rationale: Expressa aumento numérico e mantém a formulação tradicional e natural em português.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face do solo
  rationale: Preserva a imagem hebraica de «face/superfície» e distingue אֲדָמָה, «solo», do termo mais amplo para «terra».
- source_word: וּבָנוֹת
  choice: e ... filhas
  rationale: Equivalente direto e natural, importante para a progressão ao versículo seguinte.
- source_word: יֻלְּדוּ לָהֶם
  choice: lhes nasceram
  rationale: Reproduz de modo idiomático o passivo hebraico com ל, indicando que filhas nasceram à população humana.
theological_decisions:
- issue: Sentido de הָאָדָם em contexto coletivo
  choice: a humanidade
  alternative: o ser humano; o homem
  rationale: O referente é coletivo e geral. «A humanidade» comunica esse valor sem sugerir que somente homens do sexo masculino se multiplicaram. A alternativa mais formal é registrada em nota, preservando a forma singular do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a imagem do hebraico foram mantidas sempre que não prejudicavam a fluência.
