  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: pt
  text: Deus viu a terra, e eis que ela estava arruinada[a], pois toda carne havia arruinado o seu caminho sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “corrompida”; a mesma raiz hebraica aparece depois em “havia arruinado” e pode expressar tanto corrupção moral quanto ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O verbo ראה, na sequência narrativa, significa diretamente “viu”; a forma simples preserva o ritmo do relato sem acrescentar avaliação.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa o único Deus e é traduzido naturalmente por “Deus”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto do dilúvio, “a terra” preserva o alcance amplo do hebraico; “a região” seria lexicalmente possível, mas estreitaria o sentido.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão chama vividamente a atenção para o estado constatado. “E eis que” mantém essa força discursiva e o tom solene.
- source_word: נִשְׁחָתָה
  choice: estava arruinada
  rationale: O Nifal de שׁחת descreve o estado resultante da terra, abrangendo tanto corrupção quanto ruína. “Estava arruinada” evita limitar o termo a uma dimensão exclusivamente moral.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a causa da condição observada. “Pois” expressa essa relação com naturalidade em português.
- source_word: הִשְׁחִית
  choice: havia arruinado
  rationale: A repetição de “arruinar” mantém visível a mesma raiz שׁחת nas duas orações, enquanto o mais-que-perfeito composto apresenta a ação como anterior à constatação divina.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: A tradução conserva o idioma hebraico e sua amplitude, sem decidir se a referência deve ser restringida à humanidade ou estendida a todos os seres vivos.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: “Caminho” preserva a metáfora de דֶּרֶךְ, aqui referente ao modo de viver ou à conduta. O singular mantém a formulação coletiva do hebraico.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Sobre a terra” reproduz de modo natural a expressão espacial עַל הָאָרֶץ e se harmoniza com o contexto amplo do relato.
theological_decisions:
- issue: Amplitude semântica de שׁחת nas duas orações
  choice: “estava arruinada” e “havia arruinado”
  alternative: “estava corrompida” e “havia corrompido”
  rationale: “Arruinar” preserva a ligação lexical entre a ação de toda carne e o estado da terra, mantendo juntas a corrupção moral e a ruína resultante sem reduzir o termo a apenas uma delas.
- issue: Alcance de כָּל בָּשָׂר
  choice: Manter “toda carne”
  alternative: “toda a humanidade” ou “todos os seres vivos”
  rationale: A expressão hebraica admite discussão quanto ao alcance contextual. Manter o idioma no texto evita resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência narrativa solene. “E eis que” conserva a vivacidade do hebraico; “toda carne” e “o seu caminho” mantêm imagens e ambiguidades significativas do texto-fonte.
