base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: pt
  text: 'E é assim que você a fará: o comprimento da arca será de trezentos côvados[a], a largura, de cinquenta côvados, e a altura, de trinta côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O côvado era uma antiga unidade de comprimento, aproximadamente a distância do cotovelo até a ponta dos dedos.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: E é assim que você a fará
  rationale: O demonstrativo introduz as especificações da construção; “assim” comunica naturalmente essa função. O pronome feminino “a” retoma “arca”, e o futuro preserva a força diretiva do imperfeito hebraico.
- source_word: הַתֵּבָה
  choice: a arca
  rationale: “Arca” é o equivalente tradicional e contextualmente claro para תֵּבָה no relato de Noé.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: trezentos côvados
  rationale: Mantém a unidade antiga do texto-fonte, explicada em nota, sem impor uma conversão moderna inexata.
- source_word: אֹרֶךְ
  choice: o comprimento
  rationale: Equivalente natural no contexto das dimensões de uma construção.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: a largura, de cinquenta côvados
  rationale: “Largura” é o termo arquitetônico corrente; a elipse de “será” evita repetição sem perder clareza.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: e a altura, de trinta côvados
  rationale: No contexto arquitetônico, “altura” expressa adequadamente קוֹמָה.
