  text: מֵ/הָ/ע֣וֹף לְ/מִינֵ֗/הוּ וּ/מִן הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ מִ/כֹּ֛ל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ שְׁנַ֧יִם מִ/כֹּ֛ל יָבֹ֥אוּ אֵלֶ֖י/ךָ לְ/הַֽחֲיֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: pt
  text: Das aves, segundo as suas espécies[a], dos animais domésticos, segundo as suas espécies, e de todos os animais que rastejam pelo chão, segundo as suas espécies, dois de cada virão até você para mantê-los vivos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «conforme as suas espécies».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: as aves
  rationale: עוֹף pode abranger criaturas voadoras, mas neste contexto «aves» é a expressão natural e suficientemente abrangente em português.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: segundo as suas espécies
  rationale: Mantém o valor classificatório de מִין sem pressupor a taxonomia biológica moderna; a repetição acompanha a estrutura hebraica.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: No contraste entre aves e animais rastejantes, בְּהֵמָה designa aqui a categoria dos grandes animais terrestres associados ao ser humano; «animais domésticos» é mais claro que «bestas» e mais abrangente que «gado».
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: todos os animais que rastejam pelo chão
  rationale: Expressa o movimento indicado por רֶמֶשׂ e traduz הָאֲדָמָה como «chão», adequado ao contraste com as aves.
- source_word: שְׁנַיִם מִכֹּל
  choice: dois de cada
  rationale: 'Reproduz de modo natural o sentido distributivo: dois de cada categoria anteriormente mencionada.'
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: virão até você
  rationale: Traduz diretamente o movimento em direção a Noé sem acrescentar que entrarão na arca, detalhe implícito no contexto, mas não expresso nesta oração.
- source_word: לְהַחֲיוֹת
  choice: para que sejam mantidos vivos
  rationale: O infinitivo hifil de חיה indica a finalidade de conservar a vida. A forma passiva evita inserir um objeto pronominal ausente e comunica claramente o propósito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enumerativa e a repetição de «segundo as suas espécies» preservam o ritmo classificatório do hebraico.
