  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: pt
  text: Faça para você uma arca de madeira de gofer[a]; faça compartimentos[b] na arca e revista-a, por dentro e por fora, com betume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira de cipreste”. O termo hebraico gofer ocorre somente aqui, e não se sabe ao certo que tipo de madeira designa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ninhos”; também pode ser traduzido por “divisões” ou “cômodos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “piche” ou “alcatrão”. O hebraico emprega palavras relacionadas para a ação de revestir e para o material do revestimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Faça para você
  rationale: Reproduz o imperativo com לְךָ ('para você/para si') sem restringir o verbo amplo עשה ao sentido mais específico de 'construir'.
- source_word: תֵּבַת
  choice: arca
  rationale: É o termo português consagrado para a grande embarcação de Noé e mantém a continuidade com Gênesis 6–9, embora o substantivo hebraico também possa designar uma caixa ou um cesto.
- source_word: עֲצֵי גֹפֶר
  choice: madeira de gofer
  rationale: Como גֹפֶר ocorre somente aqui e a espécie não pode ser identificada com segurança, a transliteração preserva a incerteza do original em vez de adotar uma identificação conjectural.
- source_word: קִנִּים
  choice: compartimentos
  rationale: O sentido literal é 'ninhos', mas aqui a palavra indica divisões internas da arca. 'Compartimentos' é claro e adequado à estrutura descrita.
- source_word: וְכָפַרְתָּ
  choice: revista-a
  rationale: Neste contexto não cultual, o verbo significa cobrir ou aplicar uma camada. 'Revestir' expressa naturalmente a aplicação do material nas superfícies internas e externas.
- source_word: מִבַּיִת וּמִחוּץ
  choice: por dentro e por fora
  rationale: Formulação portuguesa corrente que comunica com precisão a aplicação nas duas faces da arca.
- source_word: בַּכֹּפֶר
  choice: com betume
  rationale: כֹּפֶר designa aqui uma substância impermeabilizante. 'Betume' é uma tradução corrente e evita a possível especificidade indevida de 'alcatrão'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a espécie de madeira incerta por transliteração e apresenta alternativas em notas. 'Compartimentos' esclarece o uso figurado de 'ninhos', enquanto 'revista-a' mantém a relação semântica entre a ação e o material impermeabilizante.
