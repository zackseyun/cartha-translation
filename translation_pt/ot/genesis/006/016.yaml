revisions:
- from: Faça uma cobertura para a arca[a] e termine-a até um côvado na parte de cima.[b] Coloque a porta da arca em um dos lados. Faça nela um nível inferior, um segundo e um terceiro.[c]
  to: Faça uma cobertura para a arca[a] e complete-a até um côvado no alto.[b] Coloque a porta da arca em sua lateral. Faça-a com um nível inferior, um segundo e um terceiro.[c]
  rationale: A revisão elimina o acréscimo interpretativo de “um dos”, melhora a idiomaticidade da nota sobre צֹהַר e torna a última instrução mais natural. A cláusula arquitetonicamente obscura continua deliberadamente não especificada, preservando os elementos textuais “completar”, “um côvado” e “no alto”.
