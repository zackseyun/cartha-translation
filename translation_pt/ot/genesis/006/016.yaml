  source_fidelity: A tradução preserva adequadamente a sequência de instruções e a incerteza de צֹהַר e da difícil cláusula relativa ao côvado. Contudo, “em um dos lados” acrescenta a noção de uma escolha entre vários lados, enquanto o hebraico diz simplesmente “em sua lateral/no seu lado”.
  naturalness: O texto é claro e de registro apropriado. “Termine-a até um côvado na parte de cima” é compreensível, mas “complete-a até um côvado no alto” reproduz com mais transparência a construção difícil sem introduzir uma interpretação arquitetônica definida. A formulação dos níveis pode ficar mais fluente com “com um nível inferior, um segundo e um terceiro”.
  terminology: “Arca”, “côvado”, “porta” e “cobertura” são escolhas adequadas. “Cobertura” mantém prudentemente a ambiguidade de צֹהַר, com as alternativas em nota. “Nível” é uma designação neutra e apropriada para as três divisões.
  issues:
