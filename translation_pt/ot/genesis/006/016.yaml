base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: pt
  text: Faça uma cobertura para a arca[a] e complete-a até um côvado no alto.[b] Coloque a porta da arca em sua lateral. Faça-a com um nível inferior, um segundo e um terceiro.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “janela” ou “claraboia”. O termo hebraico é raro e pode indicar uma abertura para a entrada de luz, em vez de uma cobertura completa.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta frase é difícil. Ela provavelmente descreve como a parte superior da arca deveria ser concluída, talvez estreitando-se até chegar a um côvado no alto.
    reason: cultural_note
  - marker: c
    text: Ou “andares” ou “conveses”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: cobertura
  rationale: O termo hebraico é raro e seu referente exato é incerto. No contexto da construção da parte superior da arca, “cobertura” expressa uma estrutura no alto sem excluir em nota as possibilidades de uma abertura para luz.
- source_word: תַּעֲשֶׂה לַתֵּבָה
  choice: faça ... para a arca
  rationale: O qal de עשה com ל indica aquilo que deve ser construído para a arca; a formulação é natural em português.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: e termine-a até um côvado na parte de cima
  rationale: A tradução conserva os elementos do hebraico — conclusão, um côvado e a parte superior — sem definir uma configuração arquitetônica que o texto não esclarece.
- source_word: פֶּתַח
  choice: porta
  rationale: No contexto de acesso à arca, “porta” é a opção portuguesa mais natural, embora o substantivo também possa designar uma abertura ou entrada.
- source_word: בְּצִדָּהּ
  choice: em um dos lados
  rationale: Expressa de modo idiomático a localização da porta na lateral da arca, sem sugerir que ela deva ser apenas colocada sobre a superfície externa.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: um nível inferior, um segundo e um terceiro
  rationale: A expressão descreve três divisões verticais. “Nível” é neutro e inteligível, enquanto “convés” poderia especificar em excesso a forma da embarcação.
- source_word: תַּעֲשֶׂהָ
  choice: faça nela
  rationale: O sufixo feminino retoma a arca; “faça nela” introduz naturalmente em português os três níveis que devem compô-la.
