    rationale: A expressão sugere que se pode escolher qualquer um dentre vários lados. בְּצִדָּהּ refere-se à lateral da própria arca; “em sua lateral” é mais fiel e natural.
  - severity: low
    issue: 'Redação da nota a: “em vez de toda a cobertura”'
    rationale: A expressão é pouco idiomática e pode sugerir contraste com uma cobertura já pressuposta. “em vez de uma cobertura completa” comunica claramente a alternativa interpretativa.
  - severity: low
    issue: Formulação dos níveis
    rationale: “Faça nela um nível inferior...” é possível, mas “Faça-a com...” vincula mais naturalmente as três divisões à construção da arca e corresponde ao objeto pronominal do hebraico.
