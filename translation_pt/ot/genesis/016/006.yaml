  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female slave is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: pt
  text: 'Então Abrão disse a Sarai: “Veja, sua escrava está em suas mãos; faça com ela o que parecer bom aos seus olhos.” Sarai a maltratou[a], e ela fugiu de sua presença.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a afligiu”, “a humilhou” ou “a tratou duramente”. O verbo hebraico pode indicar aflição, humilhação ou tratamento opressivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Marcador discursivo atual que preserva a força dêitica do hebraico sem recorrer ao arcaísmo «eis».
- source_word: שִׁפְחָתֵךְ
  choice: sua escrava
  rationale: Explicita a condição social servil e feminina de Hagar, sem suavizá-la como simples serviço doméstico.
- source_word: בְּיָדֵךְ
  choice: está em suas mãos
  rationale: Preserva a imagem hebraica e comunica naturalmente que Sarai detém poder e autoridade sobre Hagar.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: faça com ela o que parecer bom aos seus olhos
  rationale: Mantém o direcionamento da ação contra ou para Hagar e conserva, de modo inteligível, a expressão hebraica «bom aos seus olhos».
- source_word: וַתְּעַנֶּהָ
  choice: a maltratou
  rationale: No piel, ענה pode indicar afligir, humilhar ou tratar duramente. «Maltratou» expressa com naturalidade a gravidade da ação sem especificar uma forma de abuso que o texto não informa.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: ela fugiu de sua presença
  rationale: «Fugiu» preserva o tom sério da narrativa; «de sua presença» retém a expressão hebraica sem se tornar ininteligível.
theological_decisions:
- issue: Condição social de Hagar
  choice: escrava
  alternative: serva; criada
  rationale: A hierarquia de poder doméstica é relevante para a cena. «Escrava» preserva o caráter de sujeição social expresso por שִׁפְחָה, sem atenuá-lo.
- issue: Severidade do tratamento dado por Sarai
  choice: maltratou
  alternative: afligiu; humilhou; tratou duramente
  rationale: O verbo indica sofrimento, humilhação ou tratamento opressivo real, mas não identifica sua forma exata. A tradução mantém a gravidade sem acrescentar detalhes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se os nomes Abrão e Sarai e, quando naturais, os idiomas concretos do hebraico. O pronome em «ela fugiu» retoma a escrava mencionada anteriormente.
