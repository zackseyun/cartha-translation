base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female slave into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: pt
  text: 'Então Sarai disse a Abrão: “A injustiça que sofro recai sobre você.[a] Eu mesma entreguei minha escrava a você,[b] e, quando ela viu que havia concebido, tornei-me desprezível aos olhos dela. Que Yahweh julgue entre mim e você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Minha injustiça esteja sobre você”. A expressão pode ser entendida como uma acusação de que Abrão é responsável pela injustiça sofrida por Sarai.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em seu seio” ou “em seu colo”; a expressão funciona aqui como um modo discreto de referir-se ao acolhimento íntimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: A injustiça que sofro recaia sobre você
  rationale: חָמָס pode indicar violência, injustiça ou agravo. O sufixo de primeira pessoa permite a formulação literal ambígua “minha injustiça”, mas o contexto favorece o sentido de injustiça sofrida por Sarai; עָלֶיךָ atribui a Abrão responsabilidade por ela. O subjuntivo “recaia” preserva a possibilidade de entender a frase como uma acusação ou imprecação.
- source_word: שִׁפְחָתִי
  choice: minha escrava
  rationale: שִׁפְחָה designa uma mulher em condição de escravidão ou servidão. “Escrava” explicita de modo direto a condição social, sem suavizá-la.
- source_word: בְּחֵיקֶךָ
  choice: em seus braços
  rationale: חֵיק significa literalmente “colo” ou “seio” e, neste contexto, funciona como imagem discreta de acolhimento íntimo. “Em seus braços” conserva a metáfora e soa natural em português.
- source_word: הָרָתָה
  choice: estava grávida
  rationale: 'Embora a forma verbal indique que a concepção já havia ocorrido, o complemento de “viu” descreve naturalmente em português a percepção do estado resultante: ela estava grávida.'
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: passei a ser desprezada aos olhos dela
  rationale: A forma verbal expressa que Sarai se tornou de pouca consideração ou foi tratada com desprezo na avaliação de Hagar. “Aos olhos dela” preserva o idioma hebraico.
- source_word: יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ
  choice: Que Yahweh julgue entre mim e você
  rationale: O jussivo apresenta um apelo à arbitragem divina. A formulação mantém a referência direta às duas partes e translitera o nome divino.
theological_decisions:
- issue: Sentido de חֲמָסִי e responsabilidade moral
  choice: A injustiça que sofro recaia sobre você
  alternative: Minha injustiça esteja sobre você
  rationale: A tradução principal comunica a acusação de Sarai contra Abrão, sem declarar que ela esteja confessando uma injustiça própria. A nota preserva a forma mais literal e sua ambiguidade.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Força modal de יִשְׁפֹּט
  choice: Que Yahweh julgue
  alternative: Yahweh julgará
  rationale: 'A forma verbal é melhor entendida como jussiva: Sarai apela para que Deus julgue, em vez de simplesmente predizer um julgamento.'
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. “Você” mantém a acusação direta sem arcaísmo; “Eu mesma” ressalta o pronome enfático אָנֹכִי. A metáfora de בְּחֵיקֶךָ foi mantida de modo discreto em “em seus braços”.
