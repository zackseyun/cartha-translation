id: GEN.16.12
reference: Genesis 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: pt
  text: Ele será um homem semelhante a um jumento selvagem[a]; sua mão estará contra todos, e a mão de todos contra ele; e habitará diante de todos os seus irmãos[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, a expressão hebraica aproxima “homem” de “jumento selvagem”; a imagem sugere uma vida indomada e livre, e não apenas que ele seria “selvagem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em frente de” ou “em oposição a”. A expressão hebraica pode indicar posição diante de alguém, convivência em sua presença ou confronto.
    reason: lexical_alternative
  - marker: c
    text: “Irmãos” também pode abranger parentes próximos ou povos aparentados.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: um homem semelhante a um jumento selvagem
  rationale: פֶּרֶא designa o jumento selvagem, e não apenas alguém indomável em sentido abstrato. A formulação explicita a comparação vívida do hebraico sem produzir em português uma construção obscura ou artificial.
- source_word: אָדָם
  choice: homem
  rationale: Neste contexto, o termo se refere especificamente a Ismael, indivíduo masculino, e não à humanidade em geral.
- source_word: יָדוֹ בַכֹּל
  choice: sua mão estará contra todos
  rationale: A mão representa ação ou oposição hostil. A tradução conserva a imagem hebraica e torna explícita a relação adversativa exigida pelo contexto.
- source_word: וְיַד כֹּל בּוֹ
  choice: e a mão de todos contra ele
  rationale: Mantém o paralelismo conciso da oração anterior e expressa a hostilidade recíproca sem eliminar a imagem da mão.
- source_word: וְעַל־פְּנֵי
  choice: diante de
  rationale: A expressão pode indicar posição em frente, presença próxima ou postura de confronto. “Diante de” conserva melhor essa amplitude do que uma interpretação exclusivamente geográfica ou hostil.
- source_word: כָּל־אֶחָיו
  choice: todos os seus irmãos
  rationale: אָח significa primariamente “irmão”, embora possa abranger parentes ou povos aparentados. O sentido básico permanece no texto, e a extensão possível é indicada em nota.
- source_word: יִשְׁכֹּן
  choice: habitará
  rationale: שׁכן significa habitar, residir ou estabelecer-se. “Habitará” é natural, digno e adequado ao tom preditivo.
theological_decisions:
- issue: Caracterização de Ismael na expressão פֶּרֶא אָדָם
  choice: Conservar explicitamente a comparação com um jumento selvagem
  alternative: um homem selvagem
  rationale: A alternativa reduz a metáfora animal a um adjetivo e pode acrescentar conotações morais não necessariamente presentes no hebraico. A imagem original sugere sobretudo vida indomada e livre, no contexto de relações conflituosas.
- issue: Sentido relacional de וְעַל־פְּנֵי כָל־אֶחָיו
  choice: habitará diante de todos os seus irmãos
  alternative: habitará em oposição a todos os seus irmãos
  rationale: O hebraico admite uma relação espacial ou presencial e, no contexto, talvez também confrontadora. O texto principal evita transformar essa possível implicação em sentido exclusivo; a nota preserva as alternativas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o paralelismo poético e a imagem da mão, enquanto “semelhante a” torna inteligível a justaposição nominal hebraica sem enfraquecer a metáfora.
