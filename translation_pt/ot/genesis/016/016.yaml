base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: pt
  text: Abrão tinha oitenta e seis anos quando Agar deu à luz Ismael a Abrão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Abrão”. Neste contexto, a preposição hebraica admite ambas as formas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abrão
  rationale: Nome próprio na forma tradicional e amplamente reconhecida em português.
- source_word: בֶּן
  choice: tinha ... anos
  rationale: Na fórmula hebraica de idade, בֶּן indica quantos anos alguém tinha; a formulação portuguesa comunica o sentido com naturalidade.
- source_word: שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים
  choice: oitenta e seis anos
  rationale: A expressão numérica hebraica corresponde à forma idiomática portuguesa para indicar a idade.
- source_word: בְּ/לֶדֶת
  choice: quando ... deu à luz
  rationale: A preposição בְּ com o infinitivo construto de ילד introduz aqui uma circunstância temporal; “quando ... deu à luz” é natural e exato em português.
- source_word: הָגָר
  choice: Agar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Ismael
  rationale: אֶת marca o objeto direto e não recebe tradução própria; o nome segue a forma portuguesa tradicional.
- source_word: לְ/אַבְרָם
  choice: para Abrão
  rationale: A preposição לְ indica a relação do nascimento com Abrão. “Para Abrão” preserva a construção hebraica e mantém aberta a nuance relacional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos e sintaxe natural. A repetição de “Abrão” foi preservada por corresponder ao texto hebraico e destacar a relação de Ismael com ele.
