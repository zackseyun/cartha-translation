  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: pt
  text: 'Então o anjo de Yahweh lhe disse[a]: “Multiplicarei muito a sua descendência, e ela não poderá ser contada, por ser tão numerosa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica a sequência com naturalidade em português moderno.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro ou anjo. Nesta fórmula recorrente de Gênesis, “anjo de Yahweh” é natural e tradicional, enquanto a alternativa lexical é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Multiplicarei grandemente
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a magnitude da multiplicação; esta formulação conserva a ênfase sem convertê-la em certeza ou juramento.
- source_word: זַרְעֵךְ
  choice: a sua descendência
  rationale: זֶרַע é um coletivo singular. “Descendência” mantém o sentido coletivo e é corrente e digno em português.
- source_word: וְלֹא יִסָּפֵר
  choice: de modo que não poderá ser contada
  rationale: O nifal de ספר expressa ser contado. A formulação comunica o resultado e concorda com o coletivo singular “descendência”.
- source_word: מֵרֹב
  choice: de tão numerosa
  rationale: 'Expressa idiomaticamente a causa indicada por מִן com רֹב: a descendência não poderá ser contada por causa de seu grande número.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance da identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: “Anjo” se ajusta à fórmula narrativa recorrente, mas a amplitude lexical de מַלְאַךְ é mantida em nota, sem resolver além do texto a identidade da figura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o coletivo singular “descendência” e a intensificação verbal do hebraico.
