  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: pt
  text: O anjo[a] de Yahweh[b] encontrou-a junto a uma fonte de água no deserto, junto à fonte no caminho de Sur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. A palavra hebraica pode significar “anjo” ou “mensageiro”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino YHWH, transliterado aqui como “Yahweh”; tradicionalmente, “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: encontrou-a
  rationale: O verbo מצא, nesta forma narrativa, significa naturalmente “encontrou”; o sufixo feminino singular retoma Agar. A colocação pronominal mantém um registro digno e claro.
- source_word: מַלְאַךְ
  choice: anjo
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”. Neste contexto de um enviado divino, “anjo” é a tradução tradicional e natural, enquanto a alternativa lexical é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino representado pelo tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: עַל עֵין הַמַּיִם
  choice: junto a uma fonte
  rationale: Neste contexto, עַיִן designa uma fonte ou nascente de água. “Junto a” expressa naturalmente a localização indicada por עַל; “de água” fica implícito em “fonte” e não precisa ser repetido em português.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região desabitada ou árida. “Deserto” é a forma corrente e compreensível em português bíblico, sem exigir que o terreno seja apenas arenoso.
- source_word: עַל הָעַיִן
  choice: a fonte
  rationale: A repetição de עַיִן retoma e identifica a mesma fonte mencionada anteriormente.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: no caminho de Sur
  rationale: דֶּרֶךְ pode designar caminho ou estrada; a construção localiza a fonte na rota associada a Sur, sem acrescentar detalhes topográficos.
theological_decisions:
- issue: Sentido de מַלְאַךְ na expressão מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: “Anjo” é adequado para um enviado divino neste relato, mas o termo hebraico também pode significar simplesmente “mensageiro”; a nota conserva essa amplitude lexical sem decidir além do texto.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino. “Yahweh” o representa como nome próprio, enquanto a convenção tradicional “SENHOR” é informada em nota para transparência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a repetição de “fonte” e a ambiguidade lexical de מַלְאַךְ por meio de nota, sem importar uma identificação teológica do anjo.
