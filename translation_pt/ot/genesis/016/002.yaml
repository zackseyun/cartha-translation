  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female slave; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: pt
  text: 'Então Sarai disse a Abrão: “Veja, por favor: Yahweh me impediu de ter filhos. Por favor, tenha relações com minha escrava; talvez eu seja edificada por meio dela.”[a] E Abrão deu ouvidos à voz de Sarai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático, “talvez eu consiga ter filhos por meio dela” ou “talvez eu seja estabelecida por meio dela”. O hebraico diz literalmente: “talvez eu seja edificada por meio dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: הִנֵּה נָא
  choice: Veja, por favor
  rationale: Preserva tanto a força de chamar a atenção de הִנֵּה quanto a nuance cortês ou apelativa de נָא, sem recorrer ao arcaico “eis”.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: Yahweh me impediu de ter filhos
  rationale: Expressa de modo claro a prevenção atribuída a Yahweh e o sentido contextual de ילד, sem acrescentar explicação teológica.
- source_word: בֹּא נָא אֶל
  choice: Por favor, tenha relações com
  rationale: Traduz o eufemismo hebraico pelo sentido convencional em português moderno; uma reprodução literal como “entre à minha escrava” seria pouco natural e potencialmente obscura.
- source_word: שִׁפְחָתִי
  choice: minha escrava
  rationale: Mantém explicitamente a condição servil indicada por שִׁפְחָה, sem suavizá-la como “serva” ou “criada”.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: talvez eu seja edificada por meio dela
  rationale: Conserva a metáfora passiva de בנה e traduz מִמֶּנָּה de modo natural como meio, deixando em nota o sentido idiomático ligado à obtenção de filhos e à formação da família.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: deu ouvidos à voz de
  rationale: Preserva “voz”, presente no hebraico e relevante para ecos intertextuais, usando uma construção portuguesa compreensível.
theological_decisions:
- issue: Atribuição da falta de filhos de Sarai à ação divina
  choice: Yahweh me impediu de ter filhos
  alternative: Yahweh não me permitiu dar à luz
  rationale: Mantém a afirmação explícita de Sarai sobre a ação de Yahweh, sem atenuá-la nem transformá-la numa explicação doutrinária mais ampla.
- issue: Grau de explicitação do eufemismo sexual
  choice: tenha relações com minha escrava
  alternative: vá para junto da minha escrava
  rationale: Em português atual, a tradução literal do movimento para “entrar a/junto de” não comunica com segurança o eufemismo hebraico. A formulação escolhida explicita o referente sem vulgaridade.
- issue: Metáfora de ser edificada por meio da escrava
  choice: talvez eu seja edificada por meio dela
  alternative: talvez eu consiga ter filhos por meio dela
  rationale: A escolha preserva a imagem e a ambiguidade entre obter descendência e ser estabelecida como família; a nota oferece os sentidos idiomáticos sem fixar apenas um.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Yahweh” translitera o nome divino conforme a política do projeto. A repetição de “por favor” reflete as duas ocorrências de נָא. A metáfora “seja edificada” foi mantida no texto para preservar a imagem hebraica, com esclarecimento em nota.
