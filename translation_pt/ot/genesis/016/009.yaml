base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] lhe disse: — Volte para a sua senhora e sujeite-se à autoridade dela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “humilhe-se debaixo da mão dela”. O verbo também pode ter o sentido de “deixe-se afligir”, e “debaixo da mão dela” significa sob a autoridade dela.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro ou um anjo. Neste relato de encontro divino, “anjo” comunica naturalmente o provável referente, enquanto a nota preserva a alternativa lexical. O nome יהוה é transliterado como “Yahweh”.
- source_word: שׁוּבִי
  choice: Volte
  rationale: O imperativo feminino singular de שוב ordena a Hagar que retorne. “Volte” é direto, corrente e natural no português moderno.
- source_word: גְּבִרְתֵּךְ
  choice: a sua senhora
  rationale: O substantivo indica a mulher que ocupa posição de autoridade sobre Hagar. “Senhora” preserva a hierarquia social sem as conotações modernas potencialmente inadequadas de “dona” ou “amante”.
- source_word: וְהִתְעַנִּי
  choice: sujeite-se
  rationale: O imperativo hitpael de ענה pode expressar humilhação, submissão ou aceitação de aflição. “Sujeite-se” transmite aqui a postura subordinada exigida, sem eliminar na nota a dimensão mais dura e ambígua do verbo.
- source_word: תַּחַת יָדֶיהָ
  choice: à autoridade dela
  rationale: A expressão significa literalmente “debaixo das mãos dela” e funciona como idioma de sujeição ao poder ou à autoridade de alguém. A tradução explicita o sentido em português natural, e a nota conserva a imagem hebraica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva o caráter de nome próprio sem substituir o Tetragrama por “SENHOR”.
- issue: Sentido de מַלְאַךְ neste encontro
  choice: anjo
  alternative: mensageiro
  rationale: O contexto favorece um mensageiro celestial, mas a tradução não acrescenta qualquer identificação teológica específica do anjo; a alternativa lexical permanece em nota.
- issue: Força de וְהִתְעַנִּי na ordem dada a Hagar
  choice: sujeite-se
  alternative: humilhe-se; deixe-se afligir
  rationale: O verbo admite uma formulação de submissão e também uma nuance de humilhação ou aflição. O texto principal comunica a relação de autoridade indicada pela frase seguinte, enquanto a nota preserva a tensão sem suavizar totalmente a dureza possível da ordem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “sua” em concordância com o tratamento por “você” implícito nas formas imperativas “volte” e “sujeite-se”. A fala direta recebe travessão segundo uso editorial corrente.
