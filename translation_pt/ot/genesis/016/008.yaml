  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s slave woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: pt
  text: 'E ele disse: “Agar, escrava[a] de Sarai, de onde você veio e para onde vai?” Ela respondeu: “Estou fugindo da presença de Sarai, minha senhora”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “serva” ou “criada”; o termo hebraico indica uma mulher em condição servil sob a autoridade de Sarai.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da presença de Sarai, minha senhora”; no contexto, isto é, “de Sarai” ou “para longe de Sarai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: escrava
  rationale: O substantivo שִׁפְחָה designa uma mulher em condição servil. “Escrava” comunica com clareza tanto o sexo quanto a condição social de Agar, sem suavizá-la como poderiam fazer “serva” ou “criada”.
- source_word: אֵי מִזֶּה בָאת
  choice: de onde você veio
  rationale: A expressão pergunta pela procedência. Esta formulação é natural no português moderno e preserva o valor do perfeito בָאת.
- source_word: וְאָנָה תֵלֵכִי
  choice: e para onde vai
  rationale: אָנָה com הלך pergunta pelo destino. O presente “vai” expressa naturalmente o movimento em curso ou pretendido.
- source_word: מִפְּנֵי
  choice: da presença de
  rationale: A tradução conserva de modo transparente a imagem hebraica de afastar-se da face ou presença de alguém, embora no contexto signifique simplesmente fugir de Sarai.
- source_word: גְּבִרְתִּי
  choice: minha senhora
  rationale: A forma feminina designa a mulher que exerce autoridade sobre Agar. “Minha senhora” é natural e preserva a relação hierárquica sem recorrer ao sentido moderno indesejado de “minha amante”, possível em “minha senhora” não, mas associado a “mistress” em inglês.
- source_word: בֹּרַחַת
  choice: estou fugindo
  rationale: O particípio feminino descreve uma ação em andamento; “estou fugindo” preserva esse aspecto durativo.
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: O hebraico usa apenas o verbo masculino, cujo sujeito vem do versículo anterior. A tradução não repete aqui a identificação do mensageiro do SENHOR.
- source_word: הָגָר
  choice: Agar
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação da condição social de Agar
  choice: escrava
  alternative: serva ou criada
  rationale: O texto identifica Agar por sua condição servil subordinada a Sarai. “Escrava” evita eufemizar essa realidade social.
- issue: Explicitação da identidade de quem fala
  choice: E ele disse
  alternative: E o anjo do SENHOR disse
  rationale: Embora o sujeito seja identificável pelo versículo anterior, o hebraico deste versículo não repete o título. Mantém-se a formulação própria do versículo sem acrescentá-lo.
- issue: Sentido de מִפְּנֵי
  choice: da presença de
  alternative: de ou para longe de
  rationale: A opção conserva a expressão figurada hebraica e sua tensão lexical; a nota esclarece o sentido contextual de afastamento, sem lhe atribuir uma causa teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” torna a pergunta direta natural, enquanto “minha senhora” preserva a hierarquia social. A ordem e a progressão das duas perguntas seguem de perto o hebraico.
