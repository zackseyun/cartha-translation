  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: pt
  text: Agar deu à luz um filho de Abrão, e Abrão deu a seu filho, que Agar dera à luz, o nome de Ismael.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: No qal, com sujeito feminino, ילד significa dar à luz ou gerar. “Deu à luz” é natural e claro em português contemporâneo.
- source_word: לְאַבְרָם
  choice: de Abrão
  rationale: 'Neste contexto, לְ assinala a relação paterna ou o beneficiário: o menino nasceu como filho de Abrão. “Um filho de Abrão” comunica essa relação com naturalidade, sem sugerir direção física.'
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo está sem artigo; “um filho” reproduz adequadamente a indefinição e soa natural após “deu à luz”.
- source_word: וַיִּקְרָא ... שֶׁם
  choice: deu ... o nome de
  rationale: A expressão hebraica significa literalmente “chamou o nome de”. A formulação portuguesa “deu ... o nome de” preserva o ato explícito de nomear sem o artificialismo de “chamou o nome”.
- source_word: בְּנוֹ
  choice: ao filho
  rationale: O sufixo indica que o menino é filho de Abrão. O possessivo fica semanticamente claro pela construção anterior e pela oração relativa.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: que Agar lhe dera
  rationale: A oração relativa conserva a menção explícita de Agar. O pronome “lhe” torna clara, em português, a relação indicada por לְאַבְרָם, e o mais-que-perfeito situa o parto antes da nomeação.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e fluente, com legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para evitar a construção pouco idiomática “dar à luz um filho a Abrão”, preservando a repetição narrativa de Agar, Abrão e filho.
