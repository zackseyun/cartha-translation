- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Laai-Roi
  rationale: Mantém o topônimo hebraico transliterado; seu significado já é explicado pelo contexto anterior, e uma tradução inserida aqui substituiria o nome próprio.
- source_word: הִנֵּה
  choice: Ele fica
  rationale: Neste enunciado geográfico, הִנֵּה introduz ou destaca a localização do poço. A formulação idiomática evita o pouco natural 'Eis que' e torna explícito o referente já mencionado.
- source_word: קָדֵשׁ וּבֵין בָּרֶד
  choice: entre Cades e Berede
  rationale: Usa formas portuguesas reconhecíveis dos topônimos e reproduz com clareza a localização entre os dois lugares.
