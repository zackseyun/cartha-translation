  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: pt
  text: 'Assim, ela deu a Yahweh, que falava com ela, este nome: “Tu és um Deus que me vê”[a], pois disse: “Será que também aqui vi depois daquele que me vê?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu és o Deus que vê” ou “Tu és um Deus da visão”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico da pergunta final é difícil. Também pode ser entendido como: “Será que também aqui vi aquele que me viu e continuei viva?” A tradução mais literal preserva a expressão “depois daquele que me vê”, cujo sentido exato é incerto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: ela chamou Yahweh ... de
  rationale: A construção hebraica literalmente envolve “chamar o nome”, mas, em português atual, “chamou ... de” comunica com clareza que Agar atribuiu a Yahweh um nome ou título, sem sugerir apenas que pronunciou o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: que falava com ela
  rationale: O particípio hebraico apresenta Yahweh como aquele que estava falando com Agar; o imperfeito português preserva esse aspecto no contexto narrativo.
- source_word: אַתָּה אֵל רֳאִי
  choice: Deus que me vê
  rationale: Expressão natural em português que representa a provável referência ao Deus que vê Agar, sem eliminar as alternativas lexicais de “Deus que vê” ou “Deus da visão”, registradas em nota.
- source_word: כִּי אָֽמְרָה
  choice: pois disse
  rationale: Introduz a explicação do nome atribuído por Agar.
- source_word: הֲגַם הֲלֹם
  choice: Será que aqui eu realmente
  rationale: Reproduz a interrogação, a localização e a surpresa enfática das partículas hebraicas em ordem natural no português.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: vi aquele que me vê
  rationale: Mantém o jogo com o verbo “ver” e a reciprocidade entre Agar e Deus. A preposição אַחֲרֵי torna a frase difícil; uma tradução rigidamente literal com “depois de” seria obscura em português, por isso a incerteza interpretativa é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio; sua transliteração preserva essa função.
- issue: Sentido do título אֵל רֳאִי
  choice: Deus que me vê
  alternative: Deus que vê; Deus da visão
  rationale: O contexto favorece a atenção de Deus a Agar, mas a forma hebraica admite outras nuances, apresentadas em nota.
- issue: Interpretação de רָאִיתִי אַחֲרֵי רֹאִי
  choice: vi aquele que me vê
  alternative: vi aquele que me viu e continuei viva; vi as costas daquele que me vê
  rationale: A oração hebraica é comprimida e incerta. O texto principal preserva o motivo de ver e ser vista, enquanto a nota informa interpretações que explicitam sobrevivência ou visão posterior sem incorporá-las como certeza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita um hebraísmo opaco em “chamou o nome de” e conserva, por meio de nota, a ambiguidade genuína da oração final.
