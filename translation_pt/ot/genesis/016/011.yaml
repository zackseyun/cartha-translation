  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] lhe disse: “Eis que você está grávida e dará à luz um filho. Você lhe dará o nome de Ismael, porque Yahweh ouviu a sua aflição.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mensageiro de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial; neste contexto, “anjo” é a expressão convencional e adequada, sem definir além do texto a identidade desse ser. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: הִנָּךְ הָרָה
  choice: Eis que você está grávida
  rationale: “Eis que” conserva a função de chamar a atenção e o tom solene de הִנָּךְ, enquanto “está grávida” expressa הָרָה em português moderno e claro.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: e dará à luz um filho
  rationale: A formulação comunica naturalmente em português o anúncio do nascimento futuro e mantém explícito que a criança será um filho.
- source_word: וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל
  choice: Você lhe dará o nome de Ismael
  rationale: A expressão portuguesa natural preserva a fórmula de nomeação e a responsabilidade atribuída a Agar, sem traduzir o nome próprio no corpo do versículo.
- source_word: כִּי שָׁמַע יְהוָה
  choice: porque Yahweh ouviu
  rationale: כִּי introduz a razão do nome, e o perfeito שָׁמַע é apresentado como ação concluída com relevância imediata.
- source_word: עָנְיֵךְ
  choice: a sua aflição
  rationale: “Aflição” mantém a amplitude do termo, que pode abranger sofrimento, opressão e condição humilhante, sem reduzi-lo apenas a uma emoção ou a um clamor verbal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução conserva a expressão hebraica e sua possível amplitude lexical, registrada em nota, sem impor uma identificação cristológica ou outra conclusão teológica não explicitada neste versículo.
- issue: Relação entre o nome Ismael e a ação de Yahweh
  choice: manter o nome próprio e a explicação causal no texto
  alternative: traduzir ou explicar o significado do nome dentro do versículo
  rationale: O hebraico mantém יִשְׁמָעֵאל como nome próprio e explica sua motivação pela oração “porque Yahweh ouviu”; a tradução reproduz essa relação sem paráfrase doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” evita regionalismo excessivo; “Eis que” conserva a solenidade da proclamação, e “dará à luz” e “dará o nome” mantêm naturalidade contemporânea.
