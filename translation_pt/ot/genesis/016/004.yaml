  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: pt
  text: Ele se uniu a Agar, e ela engravidou. Quando viu que estava grávida, sua senhora tornou-se desprezível aos olhos dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela passou a desprezar sua senhora”. O hebraico pode descrever tanto a senhora como desprezível na avaliação de Agar quanto o fato de ela ser tratada com desprezo por Agar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל
  choice: se uniu a
  rationale: O hebraico emprega um eufemismo convencional para a união sexual. “Se uniu a” comunica o sentido com naturalidade e preserva o decoro narrativo, sem a estranheza de uma reprodução literal em português.
- source_word: הָגָר
  choice: Agar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתַּהַר / הָרָתָה
  choice: engravidou / estava grávida
  rationale: O verbo הרה pode indicar tanto o início quanto o estado da gravidez. A variação idiomática em português expressa com clareza a sequência narrativa, embora não reproduza literalmente a repetição lexical hebraica.
- source_word: וַתֵּרֶא כִּי
  choice: Quando viu que
  rationale: Mantém o verbo de percepção do hebraico e apresenta de modo natural a relação temporal entre a constatação da gravidez e a mudança de atitude.
- source_word: וַתֵּקַל
  choice: tornou-se desprezível
  rationale: O verbo קלל aqui indica que a senhora perdeu valor ou estima na avaliação de Agar. A formulação preserva a construção resultativa e evita explicitar no texto principal uma ação que a sintaxe hebraica deixa implícita.
- source_word: גְּבִרְתָּהּ
  choice: sua senhora
  rationale: גברת designa a mulher que ocupa posição de autoridade sobre outra. “Senhora” é claro no contexto e menos sujeito a sentidos modernos indesejados do que “ama”.
- source_word: בְּעֵינֶיהָ
  choice: aos olhos dela
  rationale: Preserva o conhecido idiomatismo hebraico de avaliação pessoal e mantém explícito que o desprezo corresponde à perspectiva de Agar.
