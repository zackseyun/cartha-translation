  to: Sarai, esposa de Abrão, tomou Agar, a egípcia, sua escrava, depois de Abrão ter morado dez anos na terra de Canaã,[a] e deu Agar a Abrão, seu marido, como esposa.[b]
  rationale: A revisão torna explícito o valor conjugal de אִשָּׁה neste contexto por meio de “esposa”, tanto para Sarai quanto para Agar, sem apagar a designação simultânea de Agar como escrava. Também substitui uma colocação pronominal pouco natural na variante-alvo por uma formulação corrente e inequívoca.
