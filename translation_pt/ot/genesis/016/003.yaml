  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female slave, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: pt
  text: Sarai, esposa de Abrão, tomou Agar, a egípcia, sua escrava, depois de Abrão ter morado dez anos na terra de Canaã,[a] e deu Agar a Abrão, seu marido, como esposa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao fim de dez anos da permanência de Abrão na terra de Canaã”.'
    reason: Alternativa mais formal para a expressão temporal hebraica מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם.
  - marker: b
    text: O hebraico diz “como esposa”; o mesmo texto continua identificando Agar como escrava de Sarai.
    reason: Esclarece que o versículo mantém lado a lado o estatuto servil de Agar e sua relação como esposa de Abrão.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: tomou
  rationale: Mantém o verbo narrativo comum לקח e a iniciativa de Sarai sem acrescentar coerção não explicitada pelo verbo.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, mulher de Abrão,
  rationale: A construção apositiva identifica Sarai por sua relação com Abrão; a pontuação a reproduz naturalmente em português.
- source_word: הָגָר הַמִּצְרִית
  choice: Agar, a egípcia
  rationale: Emprega a forma tradicional portuguesa do nome e conserva a indicação explícita da origem de Agar.
- source_word: שִׁפְחָתָהּ
  choice: sua escrava
  rationale: שִׁפְחָה designa uma mulher em condição servil. “Escrava” comunica com clareza o estatuto social expresso pelo hebraico, sem o suavizar como “serva” ou “criada” poderia fazer.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: depois de Abrão morar dez anos na terra de Canaã
  rationale: Expressa em português corrente a conclusão do período de dez anos vinculada à permanência de Abrão em Canaã.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: e a deu a Abrão, seu marido
  rationale: Preserva a sequência narrativa e explicita naturalmente a aposição relacional אִישָׁהּ, “seu marido”.
- source_word: לוֹ לְאִשָּׁה
  choice: como mulher
  rationale: Reproduz de modo conciso o termo אִשָּׁה e a função resultante indicada pela construção com ל, sem substituir o termo por “concubina”, que não aparece no texto.
theological_decisions:
- issue: O estatuto de Agar em relação a Abrão
  choice: Manter simultaneamente “sua escrava” e “como mulher”.
  alternative: Traduzir “como concubina” ou suavizar “escrava” para “serva”.
  rationale: O hebraico identifica Agar como escrava de Sarai e também diz que ela foi dada a Abrão לְאִשָּׁה, “como mulher”. A tradução conserva essa tensão social e conjugal sem a resolver por uma categoria jurídica não usada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal “a deu” evita um tom excessivamente literário, enquanto “mulher” conserva a amplitude lexical de אִשָּׁה no contexto conjugal.
