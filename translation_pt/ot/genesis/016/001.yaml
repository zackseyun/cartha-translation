base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian slave woman whose name was Hagar.
translation:
  language: pt
  text: Sarai, esposa de Abrão, não lhe dera filhos. Ela tinha uma escrava[a] egípcia chamada Agar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais tradicional, “serva” ou “criada”. O hebraico שִׁפְחָה designa uma mulher escravizada ou serva doméstica; “escrava” preserva aqui sua condição social de não livre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Sarai
  rationale: O וְ introduz a nova unidade narrativa; em português, a ligação pode ficar implícita sem acrescentar um marcador temporal ausente do hebraico. O nome é transliterado na forma tradicional portuguesa.
- source_word: אֵשֶׁת אַבְרָם
  choice: mulher de Abrão
  rationale: Reproduz naturalmente a cadeia construta e explicita a relação conjugal; neste contexto, “mulher” é português corrente para “esposa”.
- source_word: לֹא יָלְדָה לוֹ
  choice: não lhe tinha dado filhos
  rationale: O verbo יָלַד com o objeto indireto לוֹ descreve ter filhos para o marido. “Filhos” torna explícito em português o complemento implícito, e o mais-que-perfeito composto apresenta a situação anterior ao desenvolvimento narrativo.
- source_word: וְלָהּ
  choice: Ela tinha
  rationale: A construção possessiva hebraica, literalmente “e para ela [havia]”, é expressa idiomaticamente em português com “ter”.
- source_word: שִׁפְחָה
  choice: escrava
  rationale: O termo designa uma mulher em condição doméstica servil e juridicamente não livre; “escrava” preserva essa realidade social melhor que alternativas suavizadas como “serva”.
- source_word: מִצְרִית
  choice: egípcia
  rationale: Adjetivo de origem que modifica diretamente “escrava”.
- source_word: וּשְׁמָהּ הָגָר
  choice: chamada Agar
  rationale: Forma portuguesa natural que conserva a identificação nominal explícita do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes nas formas tradicionais portuguesas “Abrão” e “Agar”. A divisão em duas frases evita uma coordenação pesada sem alterar as relações do texto hebraico.
