  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: pt
  text: 'Então Jacó chamou seus filhos e disse: “Reúnam-se, e eu lhes contarei o que lhes acontecerá nos dias futuros[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos últimos dias”. Em alguns contextos, a expressão hebraica também pode ter sentido escatológico.'
    reason: Registra uma tradução mais literal e tradicional de בְּאַחֲרִית הַיָּמִים e preserva sua possível conotação escatológica.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא significa chamar ou convocar. “Chamou” é natural e mantém a relação direta com “seus filhos”.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Aqui בנים se refere especificamente aos filhos homens de Jacó, nomeados no contexto seguinte e associados às tribos.
- source_word: הֵאָסְפוּ
  choice: Reúnam-se
  rationale: O imperativo nifal de אסף convoca os filhos a se reunirem; a forma pronominal portuguesa preserva naturalmente essa ideia.
- source_word: וְאַגִּידָה לָכֶם
  choice: e eu lhes contarei
  rationale: A forma coortativa expressa a intenção de Jacó após a convocação. A construção escolhida comunica com clareza tanto a sequência quanto o propósito.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: o que lhes acontecerá
  rationale: A expressão idiomática com קרה significa aquilo que acontecerá ou sobrevirá a alguém. Esta formulação é clara e corrente em português.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos dias futuros
  rationale: A expressão aponta para um período por vir e pode, conforme o contexto, adquirir sentido escatológico. “Nos dias futuros” preserva a referência aberta ao futuro sem impor essa leitura mais específica.
theological_decisions:
- issue: Se בְּאַחֲרִית הַיָּמִים deve receber uma tradução explicitamente escatológica
  choice: nos dias futuros
  alternative: nos últimos dias
  rationale: O contexto imediato trata do futuro dos filhos de Jacó e das tribos. A tradução principal conserva esse alcance futuro amplo, enquanto a nota registra a leitura tradicional e potencialmente escatológica, sem eliminar a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Reúnam-se” evita arcaísmo sem perder a solenidade; “lhes contarei” preserva o destinatário plural de modo conciso.
