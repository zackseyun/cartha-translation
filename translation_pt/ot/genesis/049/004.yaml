base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: pt
  text: Inconstante como a água, você não terá a primazia, pois subiu à cama de seu pai; então profanou meu leito — ele subiu![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais fluida: “então você profanou meu leito — você subiu ao meu leito”. No hebraico, a oração final muda abruptamente para a terceira pessoa, “ele subiu”, talvez como repetição exclamativa referente a Rúben.'
    reason: Leitura alternativa para a mudança abrupta de pessoa na oração final.
lexical_decisions:
- source_word: פַּחַז
  choice: Inconstante
  rationale: O termo descreve instabilidade, precipitação ou ímpeto sem controle. “Inconstante” combina naturalmente com a comparação às águas e preserva a censura ao caráter de Rúben sem tornar a imagem excessivamente explícita.
- source_word: כַּמַּיִם
  choice: como as águas
  rationale: Mantém a comparação direta e o plural hebraico, com formulação natural e solene em português.
- source_word: אַל תּוֹתַר
  choice: você não terá a primazia
  rationale: Neste contexto, יתר se refere à superioridade ou preeminência associada à posição do primogênito. “Não terá a primazia” comunica melhor essa perda do que uma referência genérica a prosperar ou sobressair.
- source_word: כִּי עָלִיתָ
  choice: pois subiu
  rationale: Preserva tanto a relação causal introduzida por כִּי quanto o eufemismo transparente do verbo “subir”, sem explicitar além do que diz o hebraico.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: à cama de seu pai
  rationale: Embora o substantivo hebraico tenha forma plural, o singular é idiomático em português e comunica claramente a referência ao leito conjugal do pai.
- source_word: אָז
  choice: então
  rationale: Expressa de modo conciso a consequência do ato anterior.
- source_word: חִלַּלְתָּ
  choice: você a profanou
  rationale: “Profanou” conserva a gravidade moral e a ideia de violar aquilo que deveria ser respeitado. O pronome feminino retoma naturalmente “cama”.
- source_word: יְצוּעִי
  choice: meu leito
  rationale: “Leito” é uma tradução digna e corrente para o lugar de repouso ou cama, preservando a mudança para a primeira pessoa sem repetir mecanicamente “cama”.
- source_word: עָלָה
  choice: ele subiu
  rationale: A forma hebraica está na terceira pessoa masculina singular e produz uma mudança abrupta. A tradução a conserva no texto principal, enquanto a nota registra a leitura mais fluida que a entende como referência a Rúben.
theological_decisions:
- issue: Eufemismo sexual e avaliação moral no oráculo de Jacó sobre Rúben
  choice: Manter o eufemismo “subiu à cama de seu pai” e traduzir a violação como “profanou”, sem explicar o ato dentro do versículo.
  alternative: Explicitar “teve relações com a concubina de seu pai” ou empregar uma formulação mais branda.
  rationale: O hebraico é eufemístico, mas inteligível, e condena o ato sem inserir diretamente no versículo os pormenores narrados em Gênesis 35:22.
- issue: Mudança abrupta de pessoa na oração final (עָלָה)
  choice: 'Conservar no texto principal a terceira pessoa: “ele subiu”.'
  alternative: Regularizar como “você subiu ao meu leito” ou “você subiu a ele”.
  rationale: A forma massorética é sintaticamente abrupta e admite diferentes explicações. Preservar a terceira pessoa evita resolver silenciosamente uma ambiguidade textual e retórica genuína; a nota oferece a leitura suavizada.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. O tratamento por “você” favorece clareza contemporânea; “primazia”, “profanou” e “leito” mantêm a dignidade poética e a gravidade do oráculo. A construção abrupta no fim é deliberada e reflete o texto hebraico.
