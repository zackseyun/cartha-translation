  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: pt
  text: na caverna que fica no campo de Macpela, em frente de Manre[a], na terra de Canaã — campo que Abraão comprou de Efrom, o hitita, como propriedade para sepultamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante de Manre” ou “defronte a Manre”; a expressão hebraica indica a localização em relação a Manre.
    reason: lexical_alternative
  - marker: b
    text: Ou “como propriedade funerária”. O hebraico ressalta uma propriedade legalmente possuída e destinada a sepultamentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: na caverna
  rationale: A preposição בְּ e o substantivo definido indicam localização. “Caverna” é uma equivalência natural e digna em português.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: que fica no campo de Macpela
  rationale: A oração relativa localiza a caverna. “Fica” torna explícita a relação locativa implícita no hebraico, sem acrescentar conteúdo.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: em frente de Manre
  rationale: A expressão עַל־פְּנֵי indica posição relativa diante de ou defronte a Manre. A nota preserva alternativas legítimas.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Tradução geográfica direta e consagrada em português.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: campo que Abraão comprou
  rationale: אֶת marca הַשָּׂדֶה, “o campo”, como objeto direto de “comprou”. A retomada por “campo que” preserva claramente essa relação e evita traduzir o objeto como se fosse uma expressão preposicional.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: de Efrom, o hitita
  rationale: מֵאֵת identifica o vendedor ou a fonte da aquisição; o gentílico é traduzido e o nome próprio, transliterado segundo o uso português.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: como propriedade para sepultamento
  rationale: אֲחֻזָּה denota posse ou propriedade legalmente detida, enquanto קֶבֶר especifica sua finalidade funerária. A formulação mantém os dois aspectos em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com formas onomásticas de ampla legibilidade brasileira. O travessão esclarece que “campo” é o objeto da compra e retoma “campo de Macpela”, evitando alterar a sintaxe para “com o campo”. O texto permanece como fragmento sintático, em continuidade com a ordem iniciada no versículo anterior.
