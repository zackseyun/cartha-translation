source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: pt
  text: Que a minha alma não entre no conselho deles[a]; que a minha honra não se una à assembleia deles[b]. Pois, em sua ira, mataram um homem e, por vontade própria, cortaram os tendões de um boi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no conselho secreto deles”. O termo hebraico também pode designar um conselho confidencial ou um círculo íntimo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que a minha glória não se una à assembleia deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'O texto hebraico vocalizado tradicionalmente diz “boi”. Alguns interpretam as consoantes de outra maneira e traduzem: “derrubaram um muro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: no conselho deles
  rationale: סוֹד pode indicar um conselho reservado, um círculo íntimo ou uma deliberação confidencial. “Conselho” mantém o paralelismo com “assembleia” sem tornar obrigatória a ideia de segredo, preservada em nota.
- source_word: תָּבֹא נַפְשִׁי
  choice: que a minha alma não entre
  rationale: A construção volitiva com אַל expressa desejo ou proibição. A menção explícita à “alma” conserva o idioma e a força poética do hebraico.
- source_word: בִּקְהָלָם
  choice: à assembleia deles
  rationale: קָהָל designa uma reunião ou comunidade congregada. “Assembleia” é claro, atual e adequado ao paralelismo poético.
- source_word: תֵּחַד כְּבֹדִי
  choice: que a minha honra não se una
  rationale: יחד é entendido aqui como unir-se ou associar-se, e כָּבוֹד pode significar honra ou glória. “Minha honra” comunica a dignidade pessoal que Jacó deseja manter separada da violência.
- source_word: בְאַפָּם
  choice: em sua ira
  rationale: אַף, neste uso idiomático, designa ira. A formulação conserva a imagem emocional e o tom poético.
- source_word: הָרְגוּ אִישׁ
  choice: mataram um homem
  rationale: Mantém o singular אִישׁ e não generaliza a provável alusão ao episódio de Siquém.
- source_word: וּבִרְצֹנָם
  choice: por vontade própria
  rationale: רָצוֹן pode indicar vontade, prazer ou desejo. No contexto negativo, a expressão retrata uma ação deliberada e voluntariosa sem impor a paráfrase mais forte “por capricho”.
- source_word: עִקְּרוּ
  choice: cortaram os tendões
  rationale: עקר, quando aplicado a um animal, descreve o ato de jarretar ou incapacitar mediante o corte dos tendões. A locução é mais imediatamente compreensível em português moderno do que o verbo técnico “jarretar”.
- source_word: שׁוֹר
  choice: um boi
  rationale: A vocalização massorética lê שׁוֹר, “boi” ou “touro”. “Boi” é uma designação ampla e se ajusta à ação descrita pelo verbo.
theological_decisions:
- issue: Sentido de כְּבֹדִי na fórmula poética de dissociação
  choice: minha honra
  alternative: minha glória
  rationale: “Minha honra” expressa a dignidade ou reputação pessoal de Jacó no contexto de seu repúdio à violência, sem acrescentar conotações teológicas posteriores. A alternativa lexical permanece indicada em nota.
- issue: Leitura de שׁוֹר no último membro do verso
  choice: um boi
  alternative: um muro
  rationale: A vocalização massorética lê “boi”, e a combinação com עקר favorece a descrição de incapacitar um animal. Uma interpretação alternativa das consoantes produz “muro”; por ser relevante, é registrada em nota sem substituir o texto massorético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi preservado pela repetição de “que” e pelas correspondências “conselho/assembleia” e “alma/honra”. A expressão concreta “cortaram os tendões” evita um tecnicismo raro sem diluir a violência do verbo.
