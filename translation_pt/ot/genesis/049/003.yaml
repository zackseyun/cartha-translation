base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: pt
  text: Rúben, você é o meu primogênito, a minha força e as primícias do meu vigor[a], superior em honra e superior em poder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o princípio da minha força”; a expressão hebraica se refere à primeira manifestação do vigor gerador de um pai.
    reason: lexical_alternative
  - marker: b
    text: Ou “preeminente em dignidade e preeminente em poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: o meu primogênito
  rationale: Preserva tanto a ordem de nascimento quanto as implicações familiares e de posição associadas ao primogênito.
- source_word: כֹּחִי
  choice: a minha força
  rationale: Reproduz o sentido comum de força ou poder e mantém o paralelismo poético sem tornar a expressão excessivamente técnica.
- source_word: רֵאשִׁית אוֹנִי
  choice: o primeiro fruto do meu vigor
  rationale: Expressa de modo natural a primeira manifestação da força geradora do pai. “Vigor” preserva a possível conotação de virilidade sem explicitá-la além do hebraico.
- source_word: יֶתֶר שְׂאֵת
  choice: superior em honra
  rationale: “Superior” comunica excelência ou preeminência; “honra” representa a elevação, posição ou dignidade indicada por שׂאת em linguagem corrente.
- source_word: יֶתֶר עָז
  choice: superior em poder
  rationale: Mantém o paralelismo da cláusula anterior e traduz עָז como força eficaz ou poder, evitando repetir “força”.
- source_word: אַתָּה
  choice: você é
  rationale: Torna explícita a construção predicativa e preserva a ênfase do pronome independente em português moderno de ampla legibilidade brasileira.
