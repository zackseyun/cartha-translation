- source_word: חַכְלִילִי
  choice: avermelhados
  rationale: O adjetivo é raro e seu sentido exato é discutido. A associação lexical com a vermelhidão dos olhos causada pelo vinho e o contexto de abundância no versículo anterior favorecem “avermelhados”, sem intensificar indevidamente a imagem.
- source_word: עֵינַיִם
  choice: olhos
  rationale: Tradução direta do substantivo dual hebraico.
- source_word: מִיָּיִן
  choice: pelo vinho
  rationale: מִן pode indicar causa ou comparação. Aqui, o contexto de vinho abundante e a coloração dos olhos favorecem o sentido causal, expresso naturalmente em português por “pelo vinho”.
- source_word: וּלְבֶן
  choice: e ... brancos
  rationale: O adjetivo predicativo é vertido de modo direto; a elipse do verbo na segunda oração é preservada naturalmente em português.
- source_word: שִׁנַּיִם
  choice: dentes
  rationale: Tradução direta do substantivo dual hebraico.
- source_word: מֵחָלָב
  choice: pelo leite
  rationale: Em paralelo com מִיָּיִן, a preposição é entendida como causal, retratando a abundância de leite; a leitura comparativa continua possível e é registrada em nota.
