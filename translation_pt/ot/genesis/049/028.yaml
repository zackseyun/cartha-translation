revisions:
- from: 'Todos estes são as doze tribos de Israel. Foi isso que o pai delas lhes disse ao abençoá-las: abençoou cada uma com a bênção que lhe correspondia.[a]'
  to: Todos estes são as doze tribos de Israel. Isto é o que o pai deles lhes disse e os abençoou; abençoou cada um segundo a sua bênção.
  rationale: A revisão conserva a designação coletiva «as doze tribos de Israel», mas alinha os pronomes e o distributivo ao masculino do hebraico, cujo referente são os filhos de Jacó. Também substitui a paráfrase interpretativa final por «segundo a sua bênção», preservando a repetição verbal e a ambiguidade da expressão hebraica. Como a redação principal agora representa diretamente a estrutura relevante, não é necessária nota.
