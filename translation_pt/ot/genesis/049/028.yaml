base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: pt
  text: Todos estes são as doze tribos de Israel. Isto é o que o pai deles lhes disse e os abençoou; abençoou cada um segundo a sua bênção.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Todos estes
  rationale: Mantém o demonstrativo coletivo hebraico e retoma naturalmente os filhos mencionados no contexto.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: as doze tribos de Israel
  rationale: Reproduz de modo claro a cadeia construta e a aposição numérica; o artigo é natural em português.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Foi isso que o pai delas lhes disse
  rationale: “Disse” é a equivalência corrente de דִּבֶּר neste contexto de discurso dirigido a alguém; “delas” concorda com o antecedente imediato “tribos”.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: ao abençoá-las
  rationale: Expressa a relação explicativa entre as palavras do pai e o ato de abençoar, em sintaxe portuguesa natural.
- source_word: אִישׁ אֲשֶׁר כְּבִרְכָתוֹ
  choice: cada uma com a bênção que lhe correspondia
  rationale: אִישׁ tem força distributiva, e כְּבִרְכָתוֹ indica a bênção própria ou ajustada a cada filho/tribo. A formulação preserva o sentido sem rigidez pouco natural.
- source_word: בֵּרַךְ אֹתָם
  choice: abençoou
  rationale: Conserva a repetição da raiz ברך presente no texto hebraico, embora a primeira ocorrência seja vertida pelo infinitivo “abençoar”.
