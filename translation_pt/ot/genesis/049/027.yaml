lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: זְאֵב יִטְרָף
  choice: lobo voraz
  rationale: Expressa de modo natural e conciso a imagem do lobo que dilacera a presa; a força predatória vem do verbo hebraico, não do substantivo isoladamente.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Equivalente temporal corrente em português e paralelo natural de “ao entardecer”.
- source_word: יֹאכַל
  choice: devora
  rationale: Embora o verbo básico signifique “comer”, “devora” preserva a intensidade da metáfora animal neste contexto.
- source_word: עַד
  choice: a presa
  rationale: No primeiro hemistíquio, “presa” mantém a imagem do lobo, embora o termo também possa designar despojo ou saque.
- source_word: וְלָעֶרֶב
  choice: e ao entardecer
  rationale: Preserva a coordenação e o paralelismo temporal do texto hebraico em linguagem natural.
- source_word: יְחַלֵּק
  choice: reparte
  rationale: O piel de חלק indica dividir ou distribuir; “reparte” combina naturalmente com “despojo”.
- source_word: שָׁלָל
  choice: o despojo
  rationale: Termo consagrado para os bens tomados em conflito e adequado à passagem da imagem animal à militar.
theological_decisions:
- issue: Força metafórica da bênção de Jacó sobre Benjamim
  choice: Manter a imagem de força predatória e da distribuição do que foi conquistado, sem identificar um cumprimento histórico específico.
  alternative: Explicitar uma referência à história guerreira posterior da tribo de Benjamim.
  rationale: O hebraico apresenta uma caracterização poética, não nomeia um acontecimento futuro nem formula uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A concisão e o paralelismo da poesia hebraica foram preservados; “lobo voraz” evita a formulação menos natural “lobo que dilacera” no texto principal.
