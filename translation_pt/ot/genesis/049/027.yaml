  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: pt
  text: Benjamim é um lobo voraz[a]; pela manhã devora a presa[b], e ao entardecer reparte o despojo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um lobo que dilacera”. O verbo hebraico descreve o ato de rasgar ou despedaçar a presa.'
