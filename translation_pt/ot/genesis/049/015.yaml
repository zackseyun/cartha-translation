base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: pt
  text: Viu que o lugar de descanso era bom[a] e que a terra era agradável; então inclinou o ombro para carregar e ficou sujeito a trabalhos forçados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o descanso era bom”. A palavra hebraica pode significar “descanso” ou “lugar de descanso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tornou-se servo tributário” ou “tornou-se servo em trabalho forçado”. A expressão hebraica se refere, com mais frequência, a trabalho compulsório ou corveia, mas sua nuance exata é discutida.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: lugar de descanso
  rationale: O substantivo pode indicar tanto “descanso” quanto “lugar de descanso”. O sentido concreto se ajusta bem ao paralelismo com “a terra”, sem eliminar a alternativa lexical, registrada em nota.
- source_word: טוֹב
  choice: bom
  rationale: Preserva a simplicidade e a amplitude do adjetivo hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da bênção tribal, designa naturalmente o território habitado por Issacar.
- source_word: נָעֵמָה
  choice: agradável
  rationale: Expressa de modo natural e sóbrio que a terra era aprazível ou desejável.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: inclinou o ombro
  rationale: Mantém a imagem corporal da disposição ou submissão para receber uma carga.
- source_word: לִסְבֹּל
  choice: para carregar
  rationale: Traduz o infinitivo de maneira corrente e conserva a imagem de suportar uma carga, sugerida pelo ombro.
- source_word: לְמַס עֹבֵד
  choice: ficou sujeito a trabalhos forçados
  rationale: מַס frequentemente designa corveia ou serviço compulsório. A formulação é idiomática em português, comunica a sujeição implicada por עֹבֵד e evita sugerir de forma indevida escravidão como propriedade pessoal.
theological_decisions:
- issue: Natureza da sujeição de Issacar na oração final
  choice: ficou sujeito a trabalhos forçados
  alternative: tornou-se servo tributário; tornou-se trabalhador escravizado
  rationale: O hebraico aponta mais provavelmente para serviço compulsório ou corveia, mas a nuance social exata é discutida. A tradução principal não resolve além da evidência, e a nota preserva as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura poética e a imagem do ombro foram preservadas; a oração final foi vertida idiomaticamente, mantendo em nota a ambiguidade histórico-social.
