  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: pt
  text: Judá, seus irmãos o louvarão[a]; sua mão estará sobre a nuca dos seus inimigos; os filhos de seu pai se curvarão diante de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe darão graças” ou “o reconhecerão”. O verbo hebraico pode indicar agradecimento, reconhecimento ou louvor; aqui, “louvarão” combina melhor com a bênção e com o jogo de palavras envolvendo o nome Judá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional do nome próprio hebraico; mantém no contexto a associação sonora com o verbo seguinte.
- source_word: יוֹדוּךָ
  choice: o louvarão
  rationale: O hifil de ידה pode expressar louvor, reconhecimento ou agradecimento. Aqui, “louvarão” se ajusta à bênção e preserva melhor o jogo de palavras com o nome Judá.
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: O substantivo masculino plural com sufixo de segunda pessoa masculina singular se refere, no contexto imediato, aos demais filhos de Jacó.
- source_word: יָדְךָ
  choice: sua mão
  rationale: Mantém a imagem concreta hebraica de poder e domínio, sem substituí-la por uma explicação abstrata.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: sobre a nuca dos seus inimigos
  rationale: עֹרֶף designa a nuca ou parte posterior do pescoço; a formulação preserva a imagem de vitória e sujeição.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: se curvarão diante de você
  rationale: Expressa gesto de submissão e homenagem sem sugerir necessariamente culto divino.
- source_word: בְּנֵי אָבִיךָ
  choice: os filhos de seu pai
  rationale: Reproduz de perto a expressão hebraica e sua referência aos irmãos de Judá.
theological_decisions:
- issue: Sentido da homenagem em יִשְׁתַּחֲווּ לְךָ
  choice: gesto humano de submissão e honra
  alternative: adoração em sentido cultual
  rationale: No contexto da bênção dirigida a Judá, o verbo descreve a submissão de seus irmãos. “Se curvarão diante de você” conserva a possível nuance régia sem atribuir culto divino ao personagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para tornar inequívoco o destinatário singular e evita “adorar” por ser teologicamente mais específico que o hebraico neste contexto.
