  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: pt
  text: Judá é um filhote de leão[b]; da presa, meu filho, você subiu. Ele se agachou e se deitou como um leão, como uma leoa[a] — quem o fará erguer-se?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um leão adulto” ou “como um leão poderoso”. O termo hebraico difere da palavra traduzida anteriormente por “leão” e pode designar uma leoa ou um leão maduro e vigoroso.
    reason: lexical_alternative
  - marker: b
    text: A imagem de Judá como leão é frequentemente relacionada, em uma leitura tipológica, à esperança régia e messiânica posterior; neste versículo, porém, ela se refere diretamente a Judá na bênção de Jacó.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: filhote de leão
  rationale: A construção hebraica designa um leão jovem. “Filhote de leão” é clara, atual e preserva a imagem.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal e tribal em português.
- source_word: מִטֶּרֶף
  choice: da presa
  rationale: טֶרֶף indica a presa capturada ou dilacerada por um predador; a formulação concisa mantém a imagem leonina.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém a interpelação direta de Jacó a Judá sem acrescentar uma interjeição ausente do hebraico.
- source_word: עָלִיתָ
  choice: você subiu
  rationale: Preserva o movimento ascendente expresso pelo verbo e a mudança poética para a segunda pessoa, sem explicar de onde ou para onde Judá sobe.
- source_word: כָּרַע רָבַץ
  choice: se agachou e se deitou
  rationale: No contexto animal, os verbos retratam o leão abaixando-se e repousando; a tradução conserva as duas ações.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: Correspondência direta da comparação hebraica.
- source_word: וּכְלָבִיא
  choice: como uma leoa
  rationale: לָבִיא pode ser entendido como leoa ou como leão adulto e vigoroso. “Leoa” preserva no texto principal a distinção lexical em relação a אַרְיֵה, enquanto a alternativa é registrada em nota.
- source_word: מִי יְקִימֶנּוּ
  choice: quem o fará levantar?
  rationale: Reproduz o sentido causativo de קום, ‘fazer levantar’, sem acrescentar a ideia interpretativa de que ninguém ‘ousaria’ perturbá-lo.
theological_decisions:
- issue: Referência tribal ou messiânica da imagem do leão de Judá
  choice: O texto principal apresenta diretamente Judá na bênção de Jacó, sem explicitar uma identificação messiânica.
  alternative: Ler a imagem tipologicamente à luz da esperança régia e messiânica desenvolvida em textos bíblicos posteriores.
  rationale: O versículo atribui poeticamente força e segurança leoninas a Judá. Uma leitura messiânica posterior pode ser teologicamente relevante, mas não deve ser inserida como afirmação explícita na tradução deste versículo.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com vocabulário amplamente compreensível. Mantiveram-se a alternância poética da segunda para a terceira pessoa e a concisão da imagem hebraica. As notas foram posicionadas junto aos elementos a que efetivamente se referem.
