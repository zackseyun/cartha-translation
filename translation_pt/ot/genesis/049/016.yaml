  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: pt
  text: Dã julgará o seu povo como uma das tribos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dã defenderá o seu povo” ou “fará justiça ao seu povo”; o verbo hebraico pode envolver defender uma causa ou assegurar justiça, e não apenas pronunciar julgamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dã
  rationale: Nome próprio do filho de Jacó e da tribo; usa-se a forma portuguesa tradicional. O hebraico cria um jogo de palavras com o verbo seguinte, que significa “julgar”; essa associação ainda é parcialmente perceptível em português.
- source_word: יָדִין
  choice: julgará
  rationale: O imperfeito qal de דין tem aqui valor naturalmente futuro ou preditivo no contexto da bênção de Jacó. “Julgará” preserva o sentido comum de exercer juízo ou governo e também a relação verbal com o nome Dã.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: עם com sufixo de terceira pessoa masculina singular significa literalmente “seu povo”. No contexto, refere-se provavelmente ao povo ligado a Dã, mas a tradução mantém a expressão aberta do hebraico.
- source_word: כְּאַחַד
  choice: como uma
  rationale: A preposição comparativa כְּ com אֶחָד introduz a comparação. Como “tribo” é feminino em português, “como uma” expressa de modo natural que Dã terá posição entre as tribos de Israel.
- source_word: שִׁבְטֵי
  choice: das tribos de
  rationale: Plural construto de שֵׁבֶט. Neste contexto, a referência é claramente às tribos de Israel, e não ao sentido concreto alternativo de “cetros”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada do nome próprio do povo e da nação.
theological_decisions:
- issue: Sentido da atuação de Dã na bênção
  choice: Dã exercerá julgamento ou governo como membro pleno entre as tribos de Israel.
  alternative: Dã defenderá ou fará justiça ao seu povo.
  rationale: O verbo דין pode abranger julgar, governar, defender uma causa ou fazer justiça. A comparação com uma das tribos de Israel favorece “julgará” no texto principal, sem excluir os matizes de defesa e vindicação, preservados na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa acompanha o paralelismo poético do hebraico. O artigo em “o seu povo” soa natural em português e não acrescenta conteúdo interpretativo.
