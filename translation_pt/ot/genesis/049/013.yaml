  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: pt
  text: Zebulom habitará junto à costa dos mares[a]; ele ficará junto à costa dos navios[b], e seu flanco[c] estará voltado para Sidom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega o plural «mares»; também pode ser traduzido de modo idiomático como «mar».
    reason: lexical_alternative
  - marker: b
    text: Ou «junto a um porto para navios». Mais literalmente, «junto à costa dos navios».
    reason: lexical_alternative
  - marker: c
    text: Ou «seu lado», «seu limite» ou «sua extremidade». O termo hebraico pode designar um lado, flanco ou extremo em sentido geográfico.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְחֹוף
  choice: junto à costa de
  rationale: Expressa de modo natural a localização ou orientação indicada pela preposição לְ e pelo substantivo חוֹף, preservando a imagem costeira.
- source_word: יַמִּים
  choice: dos mares
  rationale: Mantém o plural do hebraico, sem reduzi-lo silenciosamente ao singular idiomático.
- source_word: יִשְׁכֹּן
  choice: habitará
  rationale: Reproduz o sentido de residir ou estabelecer-se e conserva o tom poético e solene da bênção.
- source_word: וְהוּא
  choice: ele
  rationale: Mantém o pronome enfático e o paralelismo do verso; o verbo «ficará» é suprido em português para formar uma oração natural.
- source_word: לְחֹוף אֳנִיּוֹת
  choice: junto à costa dos navios
  rationale: Preserva a formulação concreta do hebraico sem incorporar ao texto principal a interpretação mais específica de um porto ou ancoradouro.
- source_word: וְיַרְכָתוֹ
  choice: seu flanco
  rationale: Conserva a metáfora espacial do termo hebraico, que pode indicar lado, parte extrema ou limite de um território.
- source_word: עַל
  choice: estará voltado para
  rationale: Comunica com cautela a orientação ou extensão geográfica sugerida pela preposição neste contexto, em vez de uma posição literal sobre algo.
- source_word: צִידֹן
  choice: Sidom
  rationale: Usa a forma tradicional do topônimo em português brasileiro.
