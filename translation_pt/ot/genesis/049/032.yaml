  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: pt
  text: O campo e a caverna que nele fica foram comprados dos filhos de Hete[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos heteus”. O hebraico diz literalmente “dos filhos de Hete”.'
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “A compra do campo e da caverna que nele fica foi feita aos filhos de Hete”.'
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  choice: foram comprados
  rationale: O substantivo מִקְנֵה designa aqui a aquisição por compra. A forma verbal explicita em português a relação predicativa da oração nominal hebraica e produz uma frase natural, sem alterar o sentido.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: Equivalente comum e preciso de שׂדה neste contexto de propriedade de terra.
- source_word: וְהַמְּעָרָה
  choice: e a caverna
  rationale: Tradução direta que conserva a coordenação dos dois elementos adquiridos.
- source_word: אֲשֶׁר בּוֹ
  choice: que nele fica
  rationale: A oração relativa localiza a caverna dentro do campo. “Fica” expressa essa relação de modo natural em português, e “nele” mantém explícita a referência ao campo.
- source_word: מֵאֵת
  choice: dos
  rationale: Indica a origem da aquisição; em português, “comprados dos” comunica naturalmente que os filhos de Hete eram os vendedores.
- source_word: בְּנֵי חֵת
  choice: filhos de Hete
  rationale: Preserva de modo transparente a expressão familiar e o nome próprio do hebraico; “heteus” é oferecido em nota como equivalente étnico contextual.
