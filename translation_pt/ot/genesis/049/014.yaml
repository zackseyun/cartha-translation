  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: pt
  text: Issacar é um jumento de ossos fortes, deitado entre os apriscos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os alforjes”. O termo hebraico é raro, e seu significado é discutido; “apriscos” é o sentido tradicional e provavelmente adequado ao contexto pastoril desta bênção.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: חֲמֹר
  choice: jumento
  rationale: Equivalente corrente e digno para o animal, adequado ao contexto poético e pastoril.
- source_word: גָּרֶם
  choice: de ossos fortes
  rationale: Preserva a imagem concreta de “osso” e comunica uma constituição robusta, sem sugerir magreza como poderia fazer “ossudo”.
- source_word: רֹבֵץ
  choice: deitado
  rationale: Expressa naturalmente a postura de um animal repousando ou agachado; a forma participial mantém a descrição em curso.
- source_word: בֵּין
  choice: entre
  rationale: Correspondência direta e natural da preposição hebraica.
- source_word: הַמִּשְׁפְּתָיִם
  choice: os apriscos
  rationale: Adota o sentido pastoril tradicional e contextualmente plausível de recintos para rebanhos, mantendo em nota a alternativa lexical debatida.
