base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: pt
  text: Eles o trataram com amargura[a], dispararam contra ele e o odiaram — os arqueiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles o amarguraram, contenderam com ele e o odiaram — os arqueiros”. O verbo hebraico traduzido por “dispararam” é difícil; também pode ser entendido, de modo mais geral, como “contenderam com ele” ou “o assediaram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: Eles o trataram com amargura
  rationale: O piel de מרר com sufixo de objeto pode significar “tornar amargo”, “amargurar” ou “tratar com amargura”. A formulação preserva a imagem hebraica e, no contexto dos verbos hostis seguintes, comunica ação hostil sem reduzir o sentido apenas a um estado emocional.
- source_word: וָרֹבּוּ
  choice: dispararam contra ele
  rationale: A forma é lexicalmente difícil. No paralelismo poético e junto de “os arqueiros”, o sentido tradicional de ataque por meio de disparos é contextualmente forte. A nota conserva as alternativas mais gerais, como contender ou assediar.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: e o odiaram
  rationale: שטם expressa ódio, inimizade ou hostilidade. “Odiaram” é uma equivalência direta, concisa e natural.
- source_word: בַּעֲלֵי חִצִּים
  choice: os arqueiros
  rationale: Literalmente, “possuidores/senhores de flechas”; a expressão designa idiomaticamente arqueiros. A tradução direta do referente evita uma formulação artificial em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética concisa. O travessão mantém “os arqueiros” como identificação enfática dos agentes. A nota preserva a incerteza lexical do segundo verbo e a alternativa mais literal do primeiro.
