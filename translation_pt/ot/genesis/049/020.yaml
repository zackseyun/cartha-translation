  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: pt
  text: De Aser virá alimento farto[a], e ele fornecerá iguarias dignas de um rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O pão de Aser será rico, e ele dará iguarias de rei».'
    reason: Alternativa lexical que conserva mais de perto «pão» para לֶחֶם, «rico» para a ideia de gordura/abundância em שְׁמֵנָה, e «dará» para נָתַן.
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: De Aser virá
  rationale: A preposição מִן indica origem ou procedência. O verbo «virá» é suprido naturalmente em português porque a primeira oração hebraica não tem verbo expresso.
- source_word: שְׁמֵנָה
  choice: farto
  rationale: O adjetivo denota literalmente gordura e, por extensão, riqueza ou abundância. «Farto» comunica de modo natural a abundância e a qualidade do alimento.
- source_word: לַחְמוֹ
  choice: alimento
  rationale: Embora לֶחֶם possa significar especificamente «pão», também designa alimento ou sustento em sentido amplo; o contexto de iguarias favorece o termo abrangente.
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém o pronome independente enfático e retoma Aser como sujeito.
- source_word: יִתֵּן
  choice: fornecerá
  rationale: נָתַן significa literalmente «dar»; neste contexto produtivo, «fornecerá» expressa com naturalidade a ideia de suprir iguarias.
- source_word: מַעֲדַנֵּי
  choice: iguarias
  rationale: O substantivo indica delícias ou alimentos finos; «iguarias» é claro, atual e apropriado ao contexto régio.
- source_word: מֶלֶךְ
  choice: dignas de um rei
  rationale: A construção hebraica é literalmente «iguarias de um rei». A formulação escolhida preserva o sentido de alimentos de qualidade régia sem sugerir necessariamente que pertençam a um rei específico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «De Aser virá» preserva a indicação hebraica de procedência; «alimento farto» evita o pouco natural «pão gordo» no texto principal.
