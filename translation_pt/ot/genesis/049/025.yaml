base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: pt
  text: pelo Deus de seu pai[a], que o ajudará, e pelo Todo-Poderoso, que o abençoará com bênçãos do céu acima, bênçãos do abismo que repousa abaixo[b], bênçãos dos seios e do útero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Deus de seu pai... e com o Todo-Poderoso”. As preposições hebraicas e a partícula diante de “Todo-Poderoso” formam uma construção sintaticamente condensada, que pode indicar fonte, agência ou estreita aposição.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “do abismo agachado abaixo”. O verbo hebraico pode significar “estar deitado”, “repousar” ou “agachar-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל
  choice: pelo Deus de
  rationale: A preposição מִן é sintaticamente difícil neste contexto. “Pelo Deus de” expressa de modo natural agência ou fonte, sem excluir a leitura formal “do Deus de”, registrada em nota.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: O singular com sufixo de segunda pessoa refere-se naturalmente ao pai de José no contexto da bênção de Jacó.
- source_word: יַעְזְרֶךָ
  choice: que o ajudará
  rationale: A oração relativa torna claro que Deus é o sujeito, preservando o valor futuro do imperfeito no contexto da bênção.
- source_word: אֵת שַׁדַּי
  choice: e pelo Todo-Poderoso
  rationale: O אֵת é incomum e pode coordenar ou colocar em aposição o título divino. Esta formulação preserva o paralelismo e a compressão poética, enquanto a alternativa é indicada em nota.
- source_word: וִיבָרְכֶךָ
  choice: que o abençoará
  rationale: A oração relativa oferece clareza em português e mantém Deus como sujeito do verbo.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: bênçãos dos céus lá do alto
  rationale: Mantém a imagem vertical e o paralelismo entre o alto e o que está embaixo, em linguagem natural.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: as águas profundas que repousam embaixo
  rationale: תְּהוֹם designa a profundeza aquática; “águas profundas” comunica esse sentido com clareza. רֹבֶצֶת pode indicar estar deitado ou agachado; “repousam” é natural, e a alternativa mais concreta fica em nota.
- source_word: שָׁדַיִם וָרָחַם
  choice: os seios e o ventre
  rationale: Preserva as imagens corporais explícitas de nutrição, fecundidade e geração, sem paráfrase interpretativa.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: Traduzir o título comunica sua força em português corrente e segue o princípio de traduzir títulos, sem acrescentar afirmações doutrinárias.
- issue: Relação sintática entre “Deus de seu pai” e “Todo-Poderoso”
  choice: 'agência paralela: “pelo ... e pelo ...”'
  alternative: 'fonte ou companhia: “do Deus ... e com o Todo-Poderoso”'
  rationale: O hebraico é comprimido e admite mais de uma análise. O texto principal oferece uma construção portuguesa coerente, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura em minúscula pressupõe a continuidade sintática e poética do versículo anterior. As imagens concretas de céu, águas profundas, seios e ventre foram mantidas.
