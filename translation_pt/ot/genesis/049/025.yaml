  naturalness: O texto é geralmente claro e de registro apropriado. «Dos céus lá do alto» é um pouco redundante e coloquial para o paralelismo poético; «do céu acima» é mais direto. «O abismo que repousa abaixo» mantém uma dicção poética natural.
  terminology: «Todo-Poderoso» é uma tradução estabelecida e adequada de שַׁדַּי. «Útero» traduz com precisão רָחַם; embora mais anatômico que «ventre», é claro em português moderno e preserva a concretude do hebraico.
