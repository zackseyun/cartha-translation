  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: pt
  text: Mas seu arco permaneceu firme, e seus braços foram tornados ágeis pelas mãos do Poderoso de Jacó; dali vem o Pastor, a Pedra de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta última frase é conciso e de sintaxe incerta; também pode ser entendido como uma referência à ação do Pastor, a Pedra de Israel, ou como uma identificação ligada à expressão anterior.
    reason: Preserva a ambiguidade sintática de מִשָּׁם e da oração nominal final, sem apresentar a tradução principal como a única interpretação possível.
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: firme
  rationale: O termo indica permanência, solidez ou vigor; “permaneceu firme” expressa naturalmente a resistência do arco sem exagerar a precisão do hebraico.
- source_word: וַיָּפֹזּוּ
  choice: se tornaram ágeis
  rationale: A forma verbal rara pode transmitir agilidade, flexibilidade ou vigor. “Tornaram-se ágeis” acompanha a evidência lexical e o paralelismo da imagem guerreira.
- source_word: אֲבִיר יַעֲקֹב
  choice: Poderoso de Jacó
  rationale: Mantém o título divino tradicional e seu vínculo explícito com Jacó.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: o Pastor, a Pedra de Israel
  rationale: Preserva os dois títulos em aposição, sem substituir “Pedra” por uma interpretação explicativa.
theological_decisions:
- issue: Relação sintática de מִשָּׁם com “Pastor, Pedra de Israel”
  choice: dali — o Pastor, a Pedra de Israel
  alternative: dali vem o Pastor, a Pedra de Israel / pelo Pastor, a Pedra de Israel
  rationale: O hebraico é conciso e não traz verbo expresso nessa oração. O travessão preserva a tensão sintática e evita decidir silenciosamente entre procedência, identificação e agência.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Os seus braços” evita o hebraísmo pouco natural “os braços de suas mãos”, enquanto conserva a imagem corporal. O travessão reproduz deliberadamente a concisão da oração final.
