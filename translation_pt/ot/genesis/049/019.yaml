  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: pt
  text: Gade — um bando de saqueadores o atacará,[a] mas ele os atacará pela retaguarda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, há um jogo de palavras entre Gade, “bando de saqueadores” e o verbo “atacar/fazer incursões” (gad / gedud / yagud).
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “ele atacará [no] calcanhar”. “Calcanhar” pode indicar a retaguarda: um ataque por trás ou a perseguição dos invasores.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Gade
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio do filho de Jacó e da tribo.
- source_word: גְּדוּד
  choice: um bando de saqueadores
  rationale: O substantivo designa uma tropa ou bando que realiza incursões. A expressão é clara em português moderno e permite conservar parcialmente o jogo sonoro com o verbo 'saquear'.
- source_word: יְגוּדֶנּוּ
  choice: o saqueará
  rationale: O imperfeito qal de גדד, com sufixo de terceira pessoa masculina singular, descreve uma incursão hostil contra Gade. 'Saquear' mantém a ligação lexical com 'saqueadores'.
- source_word: וְהוּא
  choice: mas ele
  rationale: Embora a conjunção possa significar simplesmente 'e', o contraste entre sofrer a incursão e revidar favorece o valor adversativo 'mas'.
- source_word: יָגֻד
  choice: atacará
  rationale: O mesmo verbo hebraico reaparece, mas repetir 'saquear' com 'pela retaguarda' seria pouco natural em português. 'Atacará' comunica o contra-ataque, enquanto a nota registra o jogo de palavras original.
- source_word: עָקֵב
  choice: pela retaguarda
  rationale: Literalmente 'calcanhar'; neste contexto, pode indicar atacar por trás ou perseguir os invasores. 'Pela retaguarda' expressa com naturalidade essa imagem militar sem eliminar a alternativa.
