  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: pt
  text: 'O cetro não se afastará de Judá,

    nem o bastão de governante de entre seus pés,

    até que venha Siló[a];

    e a ele pertencerá a obediência dos povos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até que venha aquele a quem pertence [o cetro]”. O hebraico שילה é difícil e também tem sido entendido como título, nome de lugar ou referência a tributo.
    reason: alternative_reading
  - marker: b
    text: Ou “e a ele se reunirão os povos”, ou “e a ele se submeterão os povos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: cetro
  rationale: No paralelismo régio com מְחֹקֵק, designa melhor o emblema da autoridade do que uma simples vara ou a tribo.
- source_word: מִיהוּדָה
  choice: de Judá
  rationale: 'A preposição expressa afastamento ou separação: o cetro não se afastará de Judá.'
- source_word: מְחֹקֵק
  choice: bastão de governante
  rationale: O termo pode designar quem decreta ou o símbolo de sua autoridade. O paralelismo com “cetro” e a expressão concreta seguinte favorecem aqui o objeto ligado ao governo, sem eliminar totalmente a nuance de decretar.
- source_word: מִבֵּין רַגְלָיו
  choice: dentre os seus pés
  rationale: Conserva a imagem concreta e ambígua do hebraico, que pode evocar tanto um governante sentado como sua posteridade, sem substituir a imagem por uma interpretação.
- source_word: עַד כִּי
  choice: até que
  rationale: Introduz de modo natural o limite temporal da declaração anterior.
- source_word: שילה
  choice: Siló
  rationale: A forma hebraica é notoriamente difícil. A tradução principal conserva a leitura massorética tradicional como nome próprio, usando sua forma portuguesa, e registra alternativas em nota.
- source_word: וְלוֹ
  choice: a ele pertencerá
  rationale: Com “Siló” entendido na linha principal como referente pessoal, o pronome é traduzido pessoalmente; “pertencerá” torna natural em português a construção nominal hebraica.
- source_word: יִקְּהַת
  choice: obediência
  rationale: O vocábulo raro e discutido, no contexto de imagens régias, pode indicar a obediência ou submissão dos povos. A alternativa “reunião” é preservada em nota.
- source_word: עַמִּים
  choice: os povos
  rationale: Equivale diretamente ao plural hebraico e mantém o alcance multiétnico sem substituí-lo pelo termo ligeiramente mais interpretativo “nações”.
theological_decisions:
- issue: Identidade e tradução de שילה em uma passagem tradicionalmente interpretada de modo messiânico
  choice: Manter “Siló” no texto principal como nome transliterado, sem identificar explicitamente quem ele é.
  alternative: “aquele a quem pertence [o cetro]”; “até que lhe tragam tributo”; “até que ele venha a Siló”
  rationale: A opção respeita a leitura massorética tradicional e preserva uma dificuldade real do hebraico, sem transformar no texto principal uma interpretação messiânica específica ou outra reconstrução disputada.
- issue: Força régia e messiânica do versículo
  choice: Preservar as imagens de realeza — “cetro”, “bastão de governante” e “obediência dos povos” — sem acrescentar uma identificação doutrinária explícita.
  alternative: Uma paráfrase puramente político-dinástica ou uma formulação explicitamente messiânica
  rationale: O hebraico associa inequivocamente Judá ao governo e ao reconhecimento dos povos, mas não explicita neste versículo a identidade do personagem; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com disposição poética. “Siló” segue a forma tradicional portuguesa do nome. A sintaxe conserva as imagens concretas e a ambiguidade do hebraico, enquanto “a ele pertencerá” oferece fluidez suficiente em português.
