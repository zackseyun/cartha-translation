  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: pt
  text: Amarrando seu jumentinho à videira[a] e o filhote de sua jumenta à videira escolhida[b], ele lava suas roupas no vinho e seu manto no sangue das uvas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu jovem jumento”; o hebraico עַיִר pode designar um jumento jovem ou um filhote de jumenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “à videira nobre”; o hebraico שֹׂרֵקָה refere-se a uma videira selecionada, de qualidade superior.
    reason: lexical_alternative
  - marker: c
    text: “Sangue das uvas” é uma expressão poética hebraica para o suco de uva ou o vinho, preservada aqui por sua força de imagem.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Amarrando
  rationale: O particípio qal masculino singular apresenta uma cena vívida e descritiva; o gerúndio preserva essa força poética em português.
- source_word: לַגֶּפֶן
  choice: à videira
  rationale: Mantém o substantivo singular com o artigo, que aqui também pode ter sentido genérico.
- source_word: עיר/ה
  choice: seu jumentinho
  rationale: עַיִר designa um jumento jovem ou filhote de jumenta. “Jumentinho” é natural, preserva a juventude do animal e recebe nota por haver alternativas possíveis.
- source_word: וְלַשֹּׂרֵקָה
  choice: e ... à videira escolhida
  rationale: שֹׂרֵקָה indica uma videira selecionada ou de qualidade superior; “videira escolhida” comunica essa nuance sem excesso técnico.
- source_word: בְּנִי אֲתֹנוֹ
  choice: o filhote de sua jumenta
  rationale: Representa de maneira idiomática o literal “filho de sua jumenta”, conservando tanto a relação filial quanto o sexo do animal adulto.
- source_word: כִּבֵּס
  choice: ele lava
  rationale: O perfeito em poesia profética pode retratar vividamente uma ação característica ou futura. O presente mantém a cena poética sem decidir em excesso sua referência temporal.
- source_word: בַּיַּיִן
  choice: no vinho
  rationale: A preposição ב é vertida concretamente como “em”, preservando a imagem extraordinária de lavar roupas no vinho.
- source_word: לְבֻשׁוֹ
  choice: suas roupas
  rationale: Embora formalmente singular, o termo pode ter sentido coletivo de vestuário; o plural é idiomático em português.
- source_word: וּבְדַם עֲנָבִים
  choice: e ... no sangue das uvas
  rationale: Preserva a metáfora hebraica concreta em vez de reduzi-la a “suco” ou “vinho”.
- source_word: סות/ה
  choice: seu manto
  rationale: Termo de vestuário paralelo a לְבֻשׁוֹ; “manto” é digno, claro e não especifica excessivamente o tipo de peça.
theological_decisions:
- issue: Imagem messiânica ou tribal na bênção de Jacó sobre Judá
  choice: Conservar a imagem poética de abundância extraordinária e prosperidade régia sem explicitar uma interpretação messiânica no texto traduzido.
  alternative: Entender como profecia messiânica direta ou apenas como descrição histórica da prosperidade tribal de Judá.
  rationale: O contexto mais amplo da declaração sobre Judá recebeu leitura messiânica na tradição cristã, mas este versículo, em si, apresenta imagens poéticas de abundância vinícola. A tradução deve preservar essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. O gerúndio inicial conserva o caráter de quadro descritivo; “jumentinho” e “filhote de sua jumenta” evitam repetição rígida, e “sangue das uvas” mantém a metáfora do original.
