  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: pt
  text: Quando Jacó terminou de dar instruções a seus filhos, recolheu os pés para dentro da cama, deu o último suspiro e foi reunido ao seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Foi reunido ao seu povo” é uma expressão hebraica ligada à morte e à reunião com o próprio povo ou com os antepassados; não é apenas uma referência ao sepultamento.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: terminou
  rationale: Expressa naturalmente a conclusão das instruções de Jacó e preserva a sequência narrativa.
- source_word: לְצַוֹּת
  choice: de dar instruções
  rationale: Neste contexto de palavras e determinações finais, a expressão comunica a autoridade de צוה sem sugerir que todo o discurso anterior consistiu apenas em ordens.
- source_word: בָּנָיו
  choice: a seus filhos
  rationale: O hebraico se refere especificamente aos filhos homens de Jacó, conforme o contexto imediato.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: recolheu os pés para a cama
  rationale: Mantém a imagem concreta e o verbo de reunir/recolher, em formulação compreensível em português.
- source_word: וַיִּגְוַע
  choice: deu o último suspiro
  rationale: Preserva a nuance de expirar, sem fundi-la com a expressão seguinte.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: foi reunido ao seu povo
  rationale: Conserva a expressão idiomática hebraica e sua ressonância literária, sem reduzi-la a uma declaração de sepultamento.
theological_decisions:
- issue: Sentido de “foi reunido ao seu povo”
  choice: Manter a expressão idiomática sem defini-la como simples sepultamento.
  alternative: “foi sepultado com seus antepassados” ou “juntou-se aos seus antepassados”
  rationale: O sepultamento de Jacó só ocorre no capítulo seguinte. A formulação preserva a tensão do texto quanto à morte e à reunião com o próprio povo, sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Dar instruções” evita a rigidez de “ordenar” no contexto das palavras finais de Jacó; a expressão hebraica final foi mantida para preservar sua ambiguidade e força teológica.
