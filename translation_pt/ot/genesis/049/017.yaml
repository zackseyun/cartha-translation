source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: pt
  text: 'Seja Dã uma serpente à beira da estrada,

    uma víbora[a] junto ao caminho,

    que morde os calcanhares do cavalo,

    fazendo seu cavaleiro cair para trás.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serpente com chifres”. O termo hebraico שְׁפִיפֹן é raro; a espécie exata é incerta, mas o sentido é o de uma serpente perigosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Seja
  rationale: O jussivo de היה exprime aqui uma declaração em forma volitiva no contexto da bênção de Jacó. “Seja” preserva essa nuance e mantém o tom poético.
- source_word: דָן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do filho de Jacó e da tribo.
- source_word: נָחָשׁ
  choice: serpente
  rationale: Termo geral para cobra ou serpente; “serpente” combina com o registro elevado da bênção e contrasta adequadamente com o termo mais específico do verso seguinte.
- source_word: עֲלֵי דֶרֶךְ
  choice: à beira da estrada
  rationale: Expressa de modo natural a localização da serpente junto à estrada e torna clara a imagem de emboscada sem alterar o sentido.
- source_word: שְׁפִיפֹן
  choice: víbora
  rationale: O termo hebraico raro designa algum tipo de serpente perigosa, mas a espécie exata é incerta. “Víbora” comunica esse perigo sem pretender uma identificação zoológica precisa.
- source_word: עֲלֵי אֹרַח
  choice: junto ao caminho
  rationale: Mantém o paralelismo com “à beira da estrada” e preserva a variação poética entre דֶרֶךְ e אֹרַח.
- source_word: הַנֹּשֵׁךְ
  choice: que morde
  rationale: Reproduz naturalmente o particípio que caracteriza a serpente por sua ação.
- source_word: עִקְּבֵי סוּס
  choice: os calcanhares do cavalo
  rationale: Conserva a imagem concreta do hebraico, que se refere à parte traseira ou aos calcanhares do cavalo; o singular tem valor genérico.
- source_word: וַיִּפֹּל
  choice: fazendo ... cair
  rationale: Explicita de modo natural em português a relação de resultado entre a mordida e a queda, inerente à progressão da oração hebraica.
- source_word: רֹכְבוֹ
  choice: seu cavaleiro
  rationale: O sufixo remete mais naturalmente ao cavalo. A formulação é concisa e idiomática em português.
- source_word: אָחוֹר
  choice: para trás
  rationale: Indica claramente a direção da queda e corresponde ao uso adverbial do hebraico.
theological_decisions: []
