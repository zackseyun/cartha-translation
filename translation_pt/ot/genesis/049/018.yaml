base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: pt
  text: Esperei pela tua salvação[a], ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho esperado pelo teu livramento”. O hebraico também pode ser traduzido por “livramento” em vez de “salvação”; o nome divino é literalmente YHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: pela tua salvação
  rationale: יְשׁוּעָה pode indicar salvação, livramento ou vitória. “Salvação” mantém o sentido amplo, enquanto a preposição לִ é representada naturalmente por “por”, regida por “esperar”.
- source_word: קִוִּיתִי
  choice: espero
  rationale: O perfeito קִוִּיתִי expressa espera confiante; no breve contexto poético, o presente português comunica uma atitude vigente. “Tenho esperado” continua sendo uma possibilidade gramatical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR; ó Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e não o substitui pelo título tradicional.
translation_notes:
  register: Formulação poética, concisa e digna. A ordem “Pela tua salvação espero” conserva a ênfase inicial do hebraico no objeto da esperança; “ó” explicita naturalmente o vocativo em português.
