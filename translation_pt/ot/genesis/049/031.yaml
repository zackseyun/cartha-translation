  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: pt
  text: Ali sepultaram Abraão e Sara, sua mulher; ali sepultaram Isaque e Rebeca, sua mulher; e ali eu sepultei Lia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: ali
  rationale: O advérbio retoma o lugar de sepultamento anteriormente mencionado. “Ali” é natural em português e preserva a repetição enfática do hebraico.
- source_word: קָבְרוּ
  choice: sepultaram
  rationale: O qal perfeito na terceira pessoa do plural tem sujeito humano não especificado; a forma ativa preserva a estrutura hebraica melhor que uma passiva.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: O substantivo com sufixo masculino singular significa literalmente “sua mulher/esposa”. A repetição após Sara e Rebeca acompanha a estrutura do original.
- source_word: קָבַרְתִּי
  choice: eu sepultei
  rationale: O qal perfeito na primeira pessoa do singular indica a ação passada do próprio Jacó. O pronome “eu” torna explícita a mudança de sujeito marcada pela forma verbal hebraica.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: sepultaram ... sepultaram ... sepultei
  rationale: A repetição da mesma raiz verbal é mantida para reproduzir a cadência e a coesão lexical do hebraico.
- source_word: לֵאָה
  choice: Lia
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
