base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: pt
  text: 'Então ele lhes deu esta ordem: “Estou para ser reunido ao meu povo.[a] Sepultem-me junto aos meus pais na caverna que fica no campo de Efrom, o hitita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estou sendo reunido ao meu povo”. A expressão hebraica se refere à morte iminente e à reunião com o próprio povo ou com os antepassados na morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו אֹתָם וַיֹּאמֶר אֲלֵהֶם
  choice: Então ele lhes deu esta ordem
  rationale: Expressa a força de צוה e evita em português a redundância pouco natural de “ordenou-lhes e disse-lhes”, sem perder o caráter solene da instrução.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Estou para ser reunido ao meu povo
  rationale: Preserva a metáfora hebraica e comunica a iminência da morte indicada pelo contexto, sem reduzi-la simplesmente a “vou morrer”.
- source_word: עַמִּי
  choice: meu povo
  rationale: Mantém a formulação hebraica e sua ressonância familiar e ancestral, sem definir além do texto a natureza dessa reunião.
- source_word: קִבְרוּ אֹתִי
  choice: Sepultem-me
  rationale: Reproduz naturalmente em português o imperativo plural dirigido aos filhos, com registro digno adequado ao contexto funerário.
- source_word: אֶל־אֲבֹתָי
  choice: junto aos meus pais
  rationale: No contexto de sepultamento, comunica a colocação ao lado dos antepassados; “pais” preserva a imagem patriarcal tradicional do hebraico.
- source_word: הַמְּעָרָה אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: a caverna que fica no campo de Efrom
  rationale: Mantém a referência concreta à caverna e ao campo, com sintaxe natural em português.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: É a designação étnica convencional em português para identificar Efrom.
theological_decisions:
- issue: Sentido de “ser reunido ao meu povo”
  choice: Conservar a expressão metafórica e acrescentar em nota sua referência contextual à morte iminente
  alternative: Estou para morrer
  rationale: A expressão sugere mais que o simples término biológico e evoca a união com o povo ou os antepassados na morte, mas não fornece detalhes suficientes para formular uma doutrina específica da vida após a morte.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com legibilidade brasileira. “Deu esta ordem” oferece cadência natural; “sepultem-me” mantém o tom solene. O marcador [a] aparece imediatamente após a expressão explicada.
