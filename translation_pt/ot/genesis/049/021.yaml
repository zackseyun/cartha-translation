  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: pt
  text: Naftali é uma corça solta[a], que profere belas palavras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma cerva posta em liberdade». A imagem hebraica é a de uma fêmea de cervídeo solta para correr livremente.'
    reason: lexical_alternative
  - marker: b
    text: A oração final também tem sido entendida de outras maneiras, entre elas «que pronuncia belos ditos» ou, atribuindo outro sentido às últimas palavras, «que dá à luz belas crias».
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: אַיָּלָה
  choice: gazela
  rationale: Designa uma fêmea de cervídeo; «gazela» é a forma poética consagrada e natural em português, embora «corça» seja lexicalmente possível.
- source_word: שְׁלֻחָה
  choice: solta
  rationale: O particípio passivo de שלח retrata o animal solto ou posto em liberdade; «solta» preserva a concisão poética.
- source_word: הַנֹּתֵן
  choice: que profere
  rationale: O particípio masculino singular pode retomar Naftali, não necessariamente a imagem feminina da gazela; «que profere» explicita naturalmente a produção de palavras sem definir além disso a sintaxe ambígua.
- source_word: אִמְרֵי
  choice: palavras
  rationale: Plural construto de אֵמֶר, com o sentido de palavras, ditos ou expressões.
- source_word: שָׁפֶר
  choice: belas
  rationale: Expressa beleza ou agradabilidade; «belas» é claro, digno e adequado à poesia.
theological_decisions:
- issue: Referente sintático da oração participial final
  choice: 'A oração é apresentada como continuação da descrição de Naftali: «que profere belas palavras».'
  alternative: A oração pode ser associada à imagem da gazela; também há interpretações que entendem as palavras finais como referência a belas crias.
  rationale: O hebraico é conciso e ambíguo. A vocalização massorética favorece «palavras belas», enquanto o particípio masculino permite que a descrição retome Naftali por trás da metáfora feminina. A nota preserva as demais leituras sem incorporá-las ao texto.
translation_notes:
  register: Português moderno, poético e acessível. «Naftali» segue a forma bíblica corrente; «gazela solta» mantém a imagem e a brevidade do hebraico. Os marcadores aparecem junto aos elementos a que se referem.
