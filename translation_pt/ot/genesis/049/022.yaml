  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: pt
  text: José é um filho fecundo[a], um filho fecundo junto a uma fonte; as filhas[b] avançam por cima do muro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “José é um ramo frutífero, um ramo frutífero junto a uma fonte”. O hebraico é poético e condensado; a tradução tradicional “ramo” torna a imagem mais explícita.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filhas”. A palavra pode ser entendida metaforicamente como ramos ou brotos que se estendem por cima de um muro.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: filho fecundo
  rationale: Preserva o sentido comum de בֵּן, «filho», e a ideia de fecundidade de פֹּרָת, sem explicitar demais a metáfora poética e condensada.
- source_word: עֲלֵי עָיִן
  choice: junto a uma fonte
  rationale: עַיִן pode significar «olho» ou «fonte». Neste contexto de fecundidade, «fonte» é o sentido contextual mais natural, e עֲלֵי indica localização junto dela.
- source_word: בָּנוֹת
  choice: as filhas
  rationale: Traduz o valor lexical direto de בָּנוֹת e conserva a imagem incomum do hebraico, em vez de substituí-la no texto principal por «ramos» ou «brotos».
- source_word: צָעֲדָה
  choice: avançam
  rationale: O verbo expressa a ideia de dar passos ou avançar. O plural em português acompanha «as filhas» e produz uma frase natural, embora a forma verbal hebraica seja singular feminina em uma construção poética comprimida.
- source_word: עֲלֵי שׁוּר
  choice: por cima do muro
  rationale: שׁוּר significa «muro» neste contexto; a expressão retrata algo que se estende ou avança para além dele.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição do hebraico foi mantida, assim como sua metáfora deliberadamente condensada; «fecundo» foi preferido a «frutífero» por soar mais natural quando aplicado a «filho».
