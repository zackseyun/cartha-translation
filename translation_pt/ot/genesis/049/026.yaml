base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: pt
  text: As bênçãos de teu pai superaram as bênçãos de meus pais[a], até os confins das colinas antigas[b]. Que elas repousem sobre a cabeça de José e sobre o alto da cabeça daquele que foi separado de seus irmãos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus antepassados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “colinas eternas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o príncipe entre seus irmãos”; o hebraico também pode significar “aquele que foi consagrado/separado de seus irmãos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת
  choice: bênçãos
  rationale: O plural construto se repete no verso e descreve o conjunto de benefícios pronunciados sobre José.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Mantém a segunda pessoa do texto massorético e a fala direta de Jacó a José.
- source_word: גָּבְרוּ עַל
  choice: superaram
  rationale: Expressa de modo natural o sentido comparativo de prevalecer em força ou exceder.
- source_word: הוֹרַי
  choice: meus pais
  rationale: O termo designa os que geraram Jacó; “meus pais” é claro e corrente, embora também possa ser entendido de modo mais amplo como “meus antepassados”.
- source_word: עַד תַּאֲוַת
  choice: alcançando os confins
  rationale: A difícil expressão poética é entendida aqui como indicação da extensão máxima das bênçãos; a formulação evita o pouco claro literalismo “até o desejo”.
- source_word: גִּבְעֹת עוֹלָם
  choice: colinas antigas
  rationale: עוֹלָם pode caracterizar as colinas como antiquíssimas, existentes desde tempos remotos; “eternas” permanece uma alternativa possível.
- source_word: תִּהְיֶיןָ לְרֹאשׁ
  choice: Que elas repousem sobre a cabeça
  rationale: O imperfeito tem força de desejo ou pronunciamento de bênção; “repousem sobre” torna explícita a imagem de bênçãos colocadas sobre alguém.
- source_word: קָדְקֹד
  choice: alto da cabeça
  rationale: Designa o topo ou a parte superior da cabeça e preserva o paralelismo com רֹאשׁ em português natural.
- source_word: נְזִיר אֶחָיו
  choice: aquele que foi separado de seus irmãos
  rationale: Preserva o sentido fundamental de alguém separado ou distinguido, sem importar indevidamente a instituição posterior do nazireado nem reduzir o termo a um título político.
theological_decisions:
- issue: Sentido do epíteto נְזִיר אֶחָיו aplicado a José
  choice: aquele que foi separado de seus irmãos
  alternative: o príncipe entre seus irmãos; o consagrado entre seus irmãos; o nazireu entre seus irmãos
  rationale: “Separado” conserva tanto a experiência concreta de José, afastado dos irmãos, quanto a ideia de distinção ou consagração, sem resolver de modo excessivamente estreito a tensão lexical.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética moderada. Emprega “seu” conforme a legibilidade brasileira e conserva em nota as principais ambiguidades do paralelismo e do epíteto de José.
