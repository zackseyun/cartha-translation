source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: pt
  text: Maldita seja a ira deles, pois é feroz, e o seu furor, pois é cruel. Eu os dividirei em Jacó e os espalharei em Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maldita seja
  rationale: O particípio passivo funciona predicativamente numa declaração de maldição; a forma optativa preserva a força do pronunciamento.
- source_word: אַפָּם
  choice: a ira deles
  rationale: Embora ligado literalmente a nariz ou narinas, o termo tem aqui o sentido idiomático de ira.
- source_word: כִּי
  choice: pois
  rationale: Introduz em ambos os casos a razão da maldição e mantém o paralelismo poético.
- source_word: עָז
  choice: feroz
  rationale: No contexto da ira violenta, expressa intensidade destrutiva, não apenas força.
- source_word: וְעֶבְרָתָם
  choice: e o seu furor
  rationale: O termo denota cólera transbordante; “furor” é natural em português e conserva a intensidade poética.
- source_word: קָשָׁתָה
  choice: pois é cruel
  rationale: A ideia básica é dureza ou severidade; aplicada ao furor violento, “cruel” comunica de modo claro sua qualidade desumana, sem eliminar a possibilidade lexical de “dura”.
- source_word: אֲחַלְּקֵם
  choice: Eu os dividirei
  rationale: Preserva o sentido causativo/distributivo e distingue este verbo do verbo paralelo “espalharei”.
- source_word: בְּיַעֲקֹב
  choice: em Jacó
  rationale: Mantém a referência corporativa ao povo descendente de Jacó e o paralelismo hebraico.
- source_word: וַאֲפִיצֵם
  choice: e os espalharei
  rationale: Expressa naturalmente a ação causativa de dispersar.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Conserva o segundo nome do povo e o paralelismo poético com “em Jacó”.
theological_decisions:
- issue: Objeto da maldição
  choice: A maldição recai explicitamente sobre a ira e o furor de Simeão e Levi, não diretamente sobre as pessoas deles.
  alternative: Entender que os próprios irmãos são diretamente amaldiçoados.
  rationale: A sintaxe hebraica nomeia “a ira deles” e “o seu furor” como objetos da declaração, distinção preservada na tradução.
translation_notes:
  register: Português atual, digno e acessível, com cadência poética. O paralelismo entre ira/furor e Jacó/Israel foi preservado. “Cruel” segue o valor contextual de קָשָׁתָה, embora “dura” seja uma alternativa mais formal e literal.
