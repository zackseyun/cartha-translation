  text: הִקָּבְצ֥וּ וְ/שִׁמְע֖וּ בְּנֵ֣י יַעֲקֹ֑ב וְ/שִׁמְע֖וּ אֶל יִשְׂרָאֵ֥ל אֲבִי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: pt
  text: Reúnam-se e escutem, filhos de Jacó; escutem Israel, o pai de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Reúnam-se e ouçam, filhos de Jacó; ouçam Israel, o pai de vocês”. O hebraico repete a ordem para dar ênfase; “ouçam” é uma alternativa mais formal a “escutem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Reúnam-se
  rationale: O imperativo nifal plural de קבץ convoca os filhos a se reunirem. A forma pronominal portuguesa expressa naturalmente a ideia reflexiva sem perder concisão.
- source_word: שִׁמְעוּ
  choice: escutem
  rationale: Neste contexto, o imperativo pede atenção deliberada, não apenas percepção auditiva. “Escutem” é atual, claro e preserva a repetição enfática do hebraico.
- source_word: בְּנֵי יַעֲקֹב
  choice: filhos de Jacó
  rationale: O hebraico emprega o plural masculino e se refere especificamente aos filhos homens de Jacó reunidos para as palavras que seguem.
- source_word: שִׁמְעוּ אֶל
  choice: escutem Israel
  rationale: A construção com אֶל indica que Israel é aquele a quem devem dar ouvidos. Em português, “escutem Israel” reproduz isso de modo direto e natural.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio, usado aqui em paralelo poético com Jacó e portador de sua ressonância pactual.
- source_word: אֲבִיכֶם
  choice: o pai de vocês
  rationale: A expressão explicita a relação de Israel com os destinatários. “De vocês” tem leitura ampla e natural no português brasileiro, evitando a ambiguidade regional de “vosso”.
theological_decisions:
- issue: Paralelismo entre os nomes Jacó e Israel
  choice: Preservar distintamente “filhos de Jacó” e “Israel, o pai de vocês”
  alternative: Uniformizar ambos como Jacó ou ambos como Israel
  rationale: O texto hebraico alterna deliberadamente os dois nomes em estrutura paralela. Mantê-los conserva a ênfase poética e a possível ressonância pactual sem impor uma interpretação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “escutem” e os dois nomes, Jacó e Israel, foram mantidos por seu valor retórico. A vírgula antes do aposto esclarece que Israel é o pai dos destinatários.
