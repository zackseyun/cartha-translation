  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: pt
  text: 'Unam-se a nós por casamento: deem-nos suas filhas em casamento e tomem para vocês as nossas filhas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Façam alianças de casamento conosco
  rationale: O hitpael de חתן expressa o estabelecimento recíproco de vínculos matrimoniais entre os grupos. A formulação é clara em português e conserva a ideia coletiva e mútua melhor que uma referência a um único casamento.
- source_word: בְּנֹתֵיכֶם
  choice: suas filhas
  rationale: Tradução direta do substantivo plural com sufixo de segunda pessoa masculina plural.
- source_word: תִּתְּנוּ לָנוּ
  choice: deem-nos suas filhas em casamento
  rationale: Embora o hebraico diga literalmente 'deem-nos', o contexto matrimonial determina o sentido. A explicitação 'em casamento' evita que a expressão soe como entrega ou posse sem finalidade definida no português atual.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: e tomem para vocês as nossas filhas
  rationale: Preserva o verbo 'tomar', a estrutura recíproca e o dativo reflexivo do hebraico. O sentido matrimonial já foi estabelecido pelas orações anteriores.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com equivalência ótima. A abertura explicita o caráter recíproco e coletivo das alianças matrimoniais; a segunda oração explicita uma vez o sentido de casamento, sem acrescentar 'como esposas' à última oração.
