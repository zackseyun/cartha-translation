  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: pt
  text: 'Hamor falou com eles, dizendo: “Meu filho Siquém está profundamente apegado à filha de vocês.[a] Por favor, deem-na a ele como esposa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a alma dele se apegou à filha de vocês”; ou: “deseja muito a filha de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם
  choice: falou com eles
  rationale: Conserva o sentido normal de דבר e o valor de אִתָּם, apresentando Hamor em diálogo com a família de Diná.
- source_word: שְׁכֶם בְּנִי
  choice: Meu filho Siquém
  rationale: Ordem natural em português que mantém a relação apositiva do hebraico.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: está profundamente apegado
  rationale: Expressa a forte inclinação ou ligação indicada pelo verbo חשׁק com נֶפֶשׁ, sem reduzir necessariamente a ideia a mero desejo físico.
- source_word: בְּבִתְּכֶם
  choice: à filha de vocês
  rationale: O substantivo singular se refere a Diná, enquanto o sufixo plural dirige a fala ao grupo familiar; 'de vocês' reproduz essa distinção.
- source_word: תְּנוּ נָא
  choice: Por favor, deem
  rationale: O imperativo plural e a partícula נא formam um pedido cortês dirigido aos familiares.
- source_word: אֹתָהּ לוֹ לְאִשָּׁה
  choice: deem-na a ele como esposa
  rationale: Mantém o objeto feminino, o beneficiário e a finalidade matrimonial da construção hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal em “deem-na” mantém um tom narrativo formal sem arcaísmo excessivo.
