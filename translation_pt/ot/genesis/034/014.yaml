base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: pt
  text: 'E eles lhes disseram: “Não podemos fazer tal coisa: dar nossa irmã a um homem que tem prepúcio[a], pois isso é uma desonra para nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a um homem incircunciso”. Literalmente: “a um homem que tem prepúcio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: E eles lhes disseram
  rationale: Mantém a sequência narrativa introduzida pelo waw consecutivo e preserva o objeto indireto plural.
- source_word: לֹא נוּכַל
  choice: Não podemos
  rationale: Expressa de modo direto e natural a ideia de incapacidade indicada por יכל no qal.
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: fazer tal coisa
  rationale: Reproduz o sentido concreto da expressão hebraica sem o peso pouco natural de “fazer esta coisa” em português.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: dar nossa irmã
  rationale: Conserva o verbo simples נתן; o contexto já deixa claro que se trata de entregá-la em casamento.
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: a um homem que tem prepúcio
  rationale: Preserva a formulação concreta e incomum do hebraico, em vez de substituí-la silenciosamente pelo adjetivo interpretativo “incircunciso”.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: pois isso é uma desonra para nós
  rationale: “Desonra” comunica a dimensão social de vergonha e afronta de חֶרְפָּה, mantendo também o valor presente da oração hebraica.
theological_decisions: []
