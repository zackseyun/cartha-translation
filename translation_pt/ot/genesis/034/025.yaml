base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: pt
  text: No terceiro dia[a], enquanto eles sentiam dor, dois dos filhos de Jacó — Simeão e Levi, irmãos de Diná — pegaram cada um a sua espada, avançaram contra a cidade enquanto ela se julgava segura[b] e mataram todos os do sexo masculino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aconteceu no terceiro dia, quando eles sentiam dor, que...”'
    reason: previous_rendering
  - marker: b
    text: 'Ou: “avançaram com segurança/confiança contra a cidade”. O hebraico בֶּטַח pode descrever tanto a maneira de agir dos atacantes quanto a condição segura e desprevenida da cidade. O texto principal adota esta última leitura, que se ajusta bem ao contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: A expressão temporal é colocada no início para reproduzir com naturalidade, em português, a progressão narrativa introduzida por וַיְהִי, sem recorrer a uma fórmula solene ou arcaizante.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: enquanto eles sentiam dor
  rationale: Expressa a circunstância simultânea indicada pelo infinitivo construto e preserva a referência pronominal sem explicitar além do texto que a dor decorria da circuncisão.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: dois dos filhos de Jacó
  rationale: 'Mantém o sentido partitivo: eram dois dentre os filhos de Jacó.'
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Simeão e Levi
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: אֲחֵי דִינָה
  choice: irmãos de Diná
  rationale: Reproduz a identificação apositiva e a relação familiar destacada pelo hebraico.
- source_word: אִישׁ חַרְבּוֹ
  choice: pegaram cada um a sua espada
  rationale: אִישׁ tem força distributiva neste contexto; a formulação deixa claro que cada irmão tomou a própria espada.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: avançaram contra a cidade
  rationale: בוא על descreve aqui movimento hostil contra a cidade. “Avançaram contra” é natural em português e preserva essa direção hostil sem antecipar o verbo “matar”.
- source_word: בֶּטַח
  choice: enquanto ela se sentia segura
  rationale: A leitura principal relaciona o advérbio à condição desprevenida da cidade. A nota preserva a possibilidade gramatical de ele descrever a maneira confiante ou segura pela qual os atacantes entraram.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: e mataram todos os do sexo masculino
  rationale: Mantém o sentido abrangente de זָכָר, que designa o sexo masculino e não somente homens adultos, evitando o arcaísmo “varões”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os travessões delimitam a identificação apositiva sem tornar a frase pesada. Evitou-se “varões”, por ser arcaico, e também “indivíduos”, por soar excessivamente técnico.
