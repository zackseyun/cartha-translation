base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: pt
  text: 'Somente sob esta condição os homens concordarão conosco em viver conosco e em se tornar um só povo: que todo indivíduo do sexo masculino entre nós seja circuncidado, assim como eles são circuncidados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Somente com esta condição
  rationale: A combinação restringe o consentimento à condição apresentada; a formulação é clara e natural em português.
- source_word: יֵאֹתוּ לָנוּ
  choice: concordarão conosco
  rationale: O nifal de אוה expressa disposição ou consentimento no contexto de uma negociação; “concordarão conosco” conserva esse sentido sem impor uma nuance adicional.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Mantém a referência masculina plural específica do hebraico.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: em morar conosco
  rationale: ישב aqui indica residência conjunta; “morar” é corrente e amplamente compreensível.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: e tornar-se um só povo
  rationale: Expressa a entrada numa identidade social unificada; “povo” convém melhor que “nação” ao contexto de grupos familiares.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: que todo homem entre nós seja circuncidado
  rationale: O infinitivo com בְּ introduz a condição exigida. Neste contexto narrativo, “todo homem” é idiomático em português, embora o hebraico זָכָר signifique literalmente “todo indivíduo do sexo masculino”.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: assim como eles são circuncidados
  rationale: Preserva a comparação e a forma passiva do hebraico sem determinar se o estado resulta de uma ação passada.
