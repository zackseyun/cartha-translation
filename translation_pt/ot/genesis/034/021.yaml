  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: pt
  text: Estes homens estão em paz conosco[a]. Deixemos que habitem na terra e façam comércio nela[b], pois, vejam, a terra é ampla para eles[c]. Tomaremos as filhas deles como esposas para nós, e daremos nossas filhas a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são amistosos conosco” ou “estão em boas relações conosco”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “façam comércio através dela”; o hebraico pode indicar atividade comercial dentro da terra ou através de seu território.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “a terra — vejam — é larga de mãos diante deles”, expressão que indica uma terra espaçosa ou com amplo espaço disponível para eles.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: estão em paz
  rationale: Expressa o estado de relações pacíficas indicado pelo adjetivo, sem acrescentar a ideia mais forte de amizade.
- source_word: וְיֵשְׁבוּ
  choice: Deixemos que habitem
  rationale: O imperfeito tem força exortativa no discurso; a formulação apresenta a proposta de permitir que os homens se estabeleçam na terra.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: negociem nela
  rationale: סחר designa atividade comercial, e o pronome feminino retoma a terra como esfera dessa atividade, embora também seja possível entender comércio através do território.
- source_word: הִנֵּה
  choice: como vocês veem
  rationale: Reproduz de modo natural e atual a função de chamar a atenção dos ouvintes para a justificativa seguinte.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: há espaço de sobra na terra para eles
  rationale: Traduz o sentido do idioma hebraico, literalmente ligado à largura ou amplitude, como disponibilidade de espaço suficiente.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: Tomaremos as filhas deles como esposas para nós
  rationale: Preserva tanto a intenção/proposta expressa pelo imperfeito quanto לָנוּ, 'para nós', e o idioma matrimonial 'tomar como esposas'.
- source_word: נִתֵּן לָהֶם
  choice: daremos nossas filhas a eles
  rationale: Mantém o paralelismo da proposta de casamentos recíprocos e o modo de expressão do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência por formas amplamente compreensíveis no Brasil. “Habitem” conserva certa solenidade bíblica sem soar arcaico; “como vocês veem” comunica de modo corrente a força discursiva de הִנֵּה. As ambiguidades de שְׁלֵמִים e da construção comercial foram preservadas em notas.
