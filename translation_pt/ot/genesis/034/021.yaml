revisions:
- from: Estes homens estão em paz conosco[a]. Deixemos que habitem na terra e negociem nela[b], pois, como vocês veem, há espaço de sobra na terra para eles[c]. Tomaremos as filhas deles como esposas para nós, e daremos nossas filhas a eles.
  to: Estes homens estão em paz conosco[a]. Deixemos que habitem na terra e façam comércio nela[b], pois, vejam, a terra é ampla para eles[c]. Tomaremos as filhas deles como esposas para nós, e daremos nossas filhas a eles.
  rationale: A revisão substitui duas formulações levemente coloquiais ou menos idiomáticas por equivalentes modernos e claros, e evita intensificar a afirmação sobre a disponibilidade da terra. Mantêm-se o sentido exortativo, a ambiguidade comercial e as três âncoras de nota.
