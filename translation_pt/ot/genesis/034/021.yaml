  timestamp: '2026-07-13T21:38:59Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente as relações pacíficas, a autorização proposta para residirem e comerciarem, a amplitude da terra e o plano de casamentos recíprocos. Contudo, “há espaço de sobra” pode sugerir mais do que a simples amplitude/suficiência expressa pelo idiomático רַחֲבַת יָדַיִם.
  naturalness: “Deixemos que habitem” é natural em registro bíblico moderno. “Pois, como vocês veem” soa um pouco explicativo e menos direto que a chamada de atenção de הִנֵּה; “vejam” preserva melhor o apelo aos ouvintes. “Façam comércio nela” é mais idiomático e internacionalmente claro que “negociem nela”.
  terminology: “Em paz conosco”, “habitem”, “como esposas” e “daremos nossas filhas a eles” são escolhas adequadas e não introduzem interpretação doutrinária.
  issues:
