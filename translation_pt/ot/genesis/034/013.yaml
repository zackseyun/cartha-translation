base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: pt
  text: Os filhos de Jacó responderam com engano[a] a Siquém e a seu pai, Hamor, e falaram, porque Siquém havia desonrado[b] Diná, irmã deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enganosamente”. O hebraico emprega um substantivo, literalmente “com/em engano”, com função adverbial.
    reason: lexical_alternative
  - marker: b
    text: Ou “havia violado Diná”. Literalmente, “havia tornado impura” ou “havia defilado”; o verbo preserva a forte linguagem moral e ritual do texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: Neste contexto narrativo, o verbo introduz a resposta dos filhos de Jacó à proposta anterior.
- source_word: בְנֵי יַעֲקֹב
  choice: os filhos de Jacó
  rationale: Reproduz com naturalidade a construção de posse e mantém a identificação familiar.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: a Siquém e a Hamor, pai dele
  rationale: Mantém os dois destinatários como objetos da resposta e deixa claro que Hamor era o pai de Siquém.
- source_word: בְּמִרְמָה
  choice: enganosamente
  rationale: O substantivo hebraico significa engano ou fraude e, com a preposição, exerce aqui função adverbial.
- source_word: וַיְדַבֵּרוּ
  choice: e falaram assim
  rationale: Preserva o segundo verbo hebraico e usa “assim” para introduzir naturalmente, em português, as palavras que aparecem no versículo seguinte.
- source_word: אֲשֶׁר
  choice: porque
  rationale: A partícula introduz neste contexto a razão da resposta enganosa.
- source_word: טִמֵּא
  choice: havia profanado
  rationale: Conserva o campo semântico de tornar impuro ou profanar e a forte avaliação moral do texto, sem substituir o termo por uma explicitação interpretativa.
- source_word: אֲחֹתָם
  choice: irmã deles
  rationale: Mantém de forma clara a relação familiar que motiva a reação dos irmãos.
theological_decisions:
- issue: Sentido moral e ritual de טִמֵּא no contexto da violência sexual
  choice: havia profanado
  alternative: havia violado
  rationale: “Profanado” preserva a linguagem de impureza e desonra do verbo hebraico; “violado” explicita melhor a natureza da agressão, mas estreita o campo semântico original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos dois verbos narrativos foi mantida, mas “assim” foi acrescentado para tornar natural a ligação com a fala iniciada no versículo seguinte. O nome דִּינָה foi grafado “Diná”, forma corrente em português.
