base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: pt
  text: Os filhos de Jacó chegaram junto aos mortos e saquearam a cidade, pois ali haviam desonrado a irmã deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a cidade que haviam desonrado a irmã deles”. A construção é condensada; o contexto indica que o sujeito implícito são os habitantes da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Os filhos de Jacó
  rationale: Preserva a construção hebraica e o destaque narrativo dado aos filhos de Jacó como grupo.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: chegaram até os mortos
  rationale: בוא על indica movimento até ou sobre algo; חֲלָלִים designa pessoas mortas violentamente. A formulação é natural em português e evita sugerir um novo ataque contra quem já estava morto.
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: e saquearam a cidade
  rationale: בזז significa tomar despojos; “saquearam” é atual, claro e adequado ao contexto posterior à matança.
- source_word: אֲשֶׁר
  choice: porque ali
  rationale: A partícula relativa introduz uma oração comprimida ligada à cidade. Em português, “porque ali” comunica a relação explicativa e associa o ato aos habitantes da cidade sem atribuí-lo por engano aos filhos de Jacó.
- source_word: טִמְּאוּ אֲחוֹתָם
  choice: haviam desonrado a irmã deles
  rationale: O piel de טמא expressa profanação ou aviltamento. Neste contexto sexual e social, “desonrado” preserva a gravidade sem reduzir o sentido à impureza ritual; “deles” evita que “sua irmã” tenha referente incerto.
theological_decisions:
- issue: Identidade do sujeito de טִמְּאוּ
  choice: A redação associa o sujeito implícito aos habitantes da cidade por meio de “ali”.
  alternative: “porque eles haviam desonrado a irmã deles”
  rationale: O hebraico deixa o sujeito verbal implícito, mas o contexto aponta para os habitantes da cidade. Em português, “eles” retomaria naturalmente “os filhos de Jacó” e produziria um sentido narrativamente falso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a sequência narrativa concisa e esclarece apenas a referência pronominal que seria enganosa em português.
