  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: pt
  text: 'Mas eles disseram[a]: “Deveria ele tratar nossa irmã como uma prostituta?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deveria ele fazer nossa irmã como uma prostituta?” O verbo hebraico significa literalmente “fazer”, mas aqui provavelmente tem o sentido de “tratar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mas eles disseram
  rationale: O waw consecutivo introduz a resposta dos irmãos. “Mas” expressa naturalmente o contraste com a repreensão de Jacó no versículo anterior.
- source_word: הַכְזוֹנָה
  choice: como uma prostituta
  rationale: A combinação do interrogativo ה, da preposição כ e de זֹנָה forma a comparação “como uma prostituta?”. “Prostituta” é claro, atual e não arcaico.
- source_word: יַעֲשֶׂה
  choice: devia tratar
  rationale: Embora עשה signifique literalmente “fazer”, com uma pessoa como objeto o contexto favorece o sentido idiomático de “tratar”. O imperfeito integra uma pergunta retórica que contesta a conduta de Siquém.
- source_word: אֲחוֹתֵנוּ
  choice: nossa irmã
  rationale: Tradução direta que preserva a ênfase familiar e a indignação dos irmãos.
