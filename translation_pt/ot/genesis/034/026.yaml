base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: pt
  text: Também mataram Hamor e seu filho Siquém à espada[a], tiraram Diná da casa de Siquém e saíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pela boca da espada”, expressão idiomática que significa matar à espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Também mataram Hamor e seu filho Siquém
  rationale: O וְ liga a ação ao versículo anterior e acrescenta Hamor e Siquém às vítimas. A relação filial explícita em בְּנוֹ é preservada em português natural.
- source_word: הָרְגוּ
  choice: mataram
  rationale: Tradução direta e corrente de הרג na prosa narrativa, sem suavizar nem intensificar a ação.
- source_word: לְפִי חָרֶב
  choice: à espada
  rationale: Expressa naturalmente em português o sentido instrumental do idiomatismo hebraico, literalmente 'pela boca da espada'; a imagem literal é registrada em nota.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: tiraram Diná
  rationale: Neste contexto, לקח descreve a retirada de Diná da casa. 'Tiraram' liga naturalmente o verbo à origem introduzida por מִן, sem acrescentar a força interpretativa de 'resgataram' ou 'arrebataram'.
- source_word: מִבֵּית שְׁכֶם
  choice: da casa de Siquém
  rationale: בית designa mais naturalmente a residência física no cenário imediato; a construção possessiva é clara e idiomática.
- source_word: וַיֵּצֵאוּ
  choice: e saíram
  rationale: Preserva o movimento para fora expresso por יצא e a sequência narrativa hebraica.
