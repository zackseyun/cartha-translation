  yaml_path: translation/ot/genesis/034/006.yaml
  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: pt
  text: Então Hamor, pai de Siquém, saiu para falar com Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então ... saiu
  rationale: O wayyiqtol dá sequência à narrativa, e o verbo יצא conserva a ideia concreta de sair. “Então” expressa com naturalidade o avanço narrativo do וַ־.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: O nome próprio é transliterado segundo a forma tradicional e reconhecível em português.
- source_word: אֲבִי שְׁכֶם
  choice: pai de Siquém
  rationale: Reproduz diretamente a relação expressa pela cadeia construta hebraica, de modo claro e natural em português.
- source_word: אֶל יַעֲקֹב
  choice: para ... Jacó
  rationale: A preposição אֶל marca movimento em direção a uma pessoa; em português, a construção “saiu para falar com Jacó” comunica naturalmente que Jacó era o destinatário do deslocamento e da conversa.
- source_word: לְדַבֵּר אִתּוֹ
  choice: para falar com Jacó
  rationale: O infinitivo com לְ expressa finalidade, e אִתּוֹ indica interlocução. A repetição de “Jacó” evita a ambiguidade que “com ele” poderia criar em português após a menção de Siquém.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar a sequência menos natural “saiu até Jacó para falar com ele”, sem perder o movimento nem a finalidade presentes no hebraico.
