  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: pt
  text: Vocês poderão morar conosco, e a terra estará à disposição de vocês.[a] Estabeleçam-se nela, façam comércio nela e adquiram propriedades nela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a terra estará diante de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tomem posse nela” ou “obtenham uma propriedade nela”. O hebraico provavelmente se refere à obtenção de terras ou de direitos de propriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Vocês poderão morar conosco
  rationale: O verbo יָשַׁב pode significar morar, habitar ou estabelecer-se. Neste convite, o futuro tem força permissiva; “poderão morar” comunica isso com naturalidade.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: e a terra estará à disposição de vocês
  rationale: A expressão literal “estará diante de vocês” indica aqui que a terra lhes estará disponível. A tradução explicita o sentido idiomático sem acrescentar a ideia espacial de uma terra “aberta”.
- source_word: שְׁבוּ
  choice: Estabeleçam-se nela
  rationale: O imperativo de יָשַׁב convida à residência permanente. “Estabeleçam-se” distingue naturalmente esta ordem do primeiro uso do mesmo verbo.
- source_word: וּסְחָרוּהָ
  choice: façam comércio nela
  rationale: O verbo סחר denota atividade comercial. “Façam comércio” é claro, atual e mais específico que “façam negócios”.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: e adquiram propriedades nela
  rationale: O nifal de אָחַז provavelmente se refere à obtenção de uma posse fundiária ou de direitos de propriedade, e não apenas ao ato físico de tomar algo.
