  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: pt
  text: Exijam de mim um preço pela noiva e um presente muito altos[a], e eu darei tudo o que me disserem; apenas me deem a jovem por esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dote”; o hebraico מֹהַר se refere especificamente ao pagamento feito pelo noivo ou por sua família à família da noiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Exijam de mim ... muito altos
  rationale: O imperativo plural de רבה, com עָלַי e o intensificador מְאֹד, convida os ouvintes a impor ao falante uma quantia muito elevada. A formulação comunica naturalmente em português a força transacional da expressão.
- source_word: מֹהַר
  choice: preço pela noiva
  rationale: Designa o pagamento feito pelo noivo ou por sua família à família da noiva. A expressão evita o sentido técnico geralmente associado a “dote”, isto é, bens trazidos pela noiva.
- source_word: וּמַתָּן
  choice: e um presente
  rationale: O substantivo indica um presente adicional associado ao acordo matrimonial; o singular do hebraico foi preservado.
- source_word: וְאֶתְּנָה
  choice: e eu darei
  rationale: A forma cohortativa expressa a disposição ou determinação do falante, comunicada de modo natural pelo futuro em português.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: tudo o que me disserem
  rationale: A expressão indica aceitação irrestrita da quantia ou das condições que os interlocutores estipularem.
- source_word: וּתְנוּ לִי
  choice: apenas me deem
  rationale: Embora a conjunção seja formalmente aditiva, aqui ela introduz o pedido culminante de Siquém. “Apenas” torna explícita essa força discursiva sem alterar o conteúdo do pedido.
- source_word: הַנַּעֲרָ
  choice: a jovem
  rationale: O termo designa uma jovem em idade de casar. “Jovem” é atual e evita tanto a possível conotação infantil de “menina” quanto o tom arcaico de “donzela”.
- source_word: לְאִשָּׁה
  choice: por esposa
  rationale: Equivalente português conciso e idiomático da expressão matrimonial hebraica.
