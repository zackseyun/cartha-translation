base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: pt
  text: 'Então Jacó disse a Simeão e Levi: “Vocês me trouxeram desgraça, fazendo-me cheirar mal[a] entre os habitantes da terra, entre os cananeus e os ferezeus. Como meu grupo é pequeno, eles se reunirão contra mim e me atacarão; e serei destruído, eu e os de minha casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em linguagem mais idiomática, “tornando-me detestável” ou “fazendo com que me odeiem”. O hebraico diz literalmente “fazendo-me cheirar mal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: vocês me trouxeram desgraça
  rationale: O verbo expressa causar grave perturbação ou calamidade a alguém. A formulação mantém a força da acusação de Jacó sem especificar além do contexto.
- source_word: לְהַבְאִישֵׁנִי
  choice: fazendo-me cheirar mal
  rationale: O hifil de באש significa literalmente fazer cheirar mal e, aqui, descreve figuradamente a reputação odiosa que Jacó passou a ter. A imagem concreta do hebraico foi preservada no texto, com o sentido idiomático indicado em nota.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: entre os habitantes da terra
  rationale: O particípio singular tem sentido coletivo e designa a população estabelecida na região.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: entre os cananeus e os ferezeus
  rationale: A preposição dá continuidade ao âmbito social em que a reputação de Jacó foi prejudicada.
- source_word: מְתֵי מִסְפָּר
  choice: tenho pouca gente
  rationale: O idioma hebraico indica um grupo numericamente pequeno. Como Jacó fala como chefe de sua casa, esta formulação comunica naturalmente que dispõe de poucos homens ou integrantes.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: eles se reunirão contra mim
  rationale: A forma verbal retrata grupos que se ajuntam com intenção hostil; o reflexivo natural em português preserva essa nuance.
- source_word: וְהִכּוּנִי
  choice: me atacarão
  rationale: נכה pode significar ferir, golpear ou derrotar. No contexto de uma ameaça coletiva, 'atacarão' é claro e não antecipa indevidamente o resultado expresso pelo verbo seguinte.
- source_word: וְנִשְׁמַדְתִּי
  choice: serei destruído
  rationale: A expressão mantém a força de extermínio ou eliminação presente em שׁמד, sem recorrer a linguagem coloquial.
- source_word: בֵּיתִי
  choice: todos os da minha casa
  rationale: בית designa aqui a unidade familiar e doméstica de Jacó, não apenas uma construção. A expansão mínima torna esse sentido claro em português.
theological_decisions: []
