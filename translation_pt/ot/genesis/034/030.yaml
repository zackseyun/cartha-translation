  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se no texto a metáfora vívida do hebraico, enquanto a nota esclarece seu sentido social. A fala direta usa “vocês”, natural no português brasileiro e inteligível internacionalmente.
