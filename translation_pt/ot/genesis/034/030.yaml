  terminology: «Jacó», «Simeão», «Levi», «cananeus» e «ferezeus» estão adequados. Conserva-se «fazendo-me cheirar mal» para refletir a metáfora concreta hebraica; a nota oferece equivalentes idiomáticos sem apagar a imagem do texto.
