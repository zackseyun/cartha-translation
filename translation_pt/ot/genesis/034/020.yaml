  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: pt
  text: 'Então Hamor e seu filho Siquém foram até a porta de sua cidade[a] e falaram aos homens de sua cidade[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à porta da cidade”. Em hebraico, literalmente, “à porta de sua cidade”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “os homens de sua cidade”; provavelmente se refere aos moradores do sexo masculino reunidos à porta para deliberar sobre assuntos públicos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foram até
  rationale: O qal narrativo de בוא pode ser traduzido como “vieram” ou “foram”, conforme o ponto de vista. Em português, “foram até” expressa naturalmente o deslocamento de Hamor e Siquém ao local indicado.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Nome próprio transliterado, sem traduzir seu possível significado lexical.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: e seu filho Siquém
  rationale: Mantém explicitamente a relação filial em ordem natural no português.
- source_word: אֶל שַׁעַר עִירָם
  choice: até a porta de sua cidade
  rationale: שַׁעַר designa literalmente a porta da cidade, que também funcionava como lugar de reunião e deliberação pública. A formulação conserva o possessivo do hebraico.
- source_word: וַיְדַבְּרוּ
  choice: falaram
  rationale: דבר com אֶל significa falar a ou dirigir-se a alguém; “falaram aos” é claro e adequado ao cenário público.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: aos homens de sua cidade
  rationale: אַנְשֵׁי significa literalmente “homens de”. O contexto provavelmente se refere aos homens da cidade reunidos para deliberar, por isso não se adotou um coletivo neutro.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz o introdutor hebraico de discurso de maneira convencional e compreensível, preparando a fala do versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Porta da cidade” preserva o sentido histórico de שַׁעַר sem recorrer ao menos natural “portão urbano”; “homens” mantém a especificidade do texto hebraico e recebe esclarecimento cultural em nota.
