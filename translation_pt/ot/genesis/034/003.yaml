  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: pt
  text: Sua alma se apegou a Diná[a], filha de Jacó, e ele amou a jovem e falou ao coração dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todo o seu ser se apegou a Diná”. Em hebraico, literalmente: “Sua alma se apegou a Diná”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “falar ao coração” significa falar com ternura, bondade ou de modo tranquilizador.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Sua alma se apegou
  rationale: Preserva a imagem hebraica de נפשׁ, aqui ligada ao íntimo ou à própria pessoa, e a força relacional de דבק, sem reduzir a expressão a um simples estado emocional.
- source_word: בְּדִינָה
  choice: a Diná
  rationale: Com דבק mais ב, a construção portuguesa natural é “apegar-se a”.
- source_word: בַּת יַעֲקֹב
  choice: filha de Jacó
  rationale: Reproduz a aposição hebraica de modo conciso e natural em português.
- source_word: וַיֶּאֱהַב
  choice: ele amou
  rationale: אהב é o verbo comum para amar; a tradução mantém a afirmação do texto sem intensificá-la como paixão romântica nem substituí-la por desejo.
- source_word: הַנַּעֲרָ
  choice: a jovem / dela
  rationale: “A jovem” é uma forma atual e digna de traduzir נַעֲרָה. Na segunda ocorrência, o pronome “dela” evita uma repetição pouco natural em português sem perder o referente.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: falou ao coração dela
  rationale: Mantém a imagem do idioma hebraico e sua ambiguidade expressiva; a nota esclarece o sentido usual de falar com ternura, bondade ou intuito de tranquilizar.
theological_decisions:
- issue: Linguagem afetiva depois da violência narrada no contexto
  choice: Manter a descrição textual do apego e do amor de Siquém sem acrescentar aprovação ou condenação nesta frase.
  alternative: Introduzir linguagem negativa para destacar a culpa de Siquém, ou linguagem mais romântica para harmonizar a sequência.
  rationale: O hebraico relata diretamente seu apego, amor e fala. A tradução não deve desculpar a violência anterior nem inserir no versículo uma avaliação moral que ele não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva duas imagens marcantes do hebraico — “sua alma se apegou” e “falou ao coração” — e esclarece ambas em notas. Os marcadores [a] e [b] aparecem no texto principal.
