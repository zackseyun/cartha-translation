base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: pt
  text: Jacó soube que ele havia desonrado[a] Diná, sua filha. Seus filhos, porém, estavam no campo com os rebanhos dele; por isso, Jacó ficou calado até que eles chegassem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “havia violado Diná, sua filha”. O verbo hebraico significa literalmente “tornar impura” ou “contaminar”; neste contexto, refere-se à desonra sexual sofrida por Diná.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: soube
  rationale: Neste contexto narrativo, o verbo indica que Jacó recebeu a notícia. “Soube” é mais natural em português do que “ouviu” sem objeto expresso.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da notícia recebida por Jacó.
- source_word: טִמֵּא
  choice: havia desonrado
  rationale: O piel de טמא significa literalmente tornar impuro ou contaminar. No contexto de violência sexual, “desonrado” comunica de modo natural a grave afronta sofrida por Diná sem substituir o verbo hebraico por um termo técnico mais específico.
- source_word: בִתּוֹ
  choice: sua filha
  rationale: Tradução direta e idiomática do substantivo com sufixo possessivo.
- source_word: וּבָנָיו
  choice: Seus filhos, porém
  rationale: 'O waw liga a circunstância seguinte e, no contexto, introduz leve contraste: os filhos estavam ausentes, o que explica a espera de Jacó.'
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: estavam no campo com os rebanhos dele
  rationale: Mantém a afirmação de localização do hebraico, sem acrescentar explicitamente que cuidavam dos animais. “Dele” evita que o possessivo seja entendido como referente aos filhos.
- source_word: מִקְנֵהוּ
  choice: os rebanhos dele
  rationale: מִקְנֶה abrange o conjunto de animais domésticos. “Rebanhos” é corrente e evita restringir o sentido apenas a gado bovino.
- source_word: וְהֶחֱרִשׁ
  choice: ficou calado
  rationale: Expressa o ato deliberado de não falar nem reagir naquele momento.
- source_word: עַד בֹּאָם
  choice: até que eles chegassem
  rationale: Reproduz de modo idiomático “até a chegada deles”, sem acrescentar a ideia não explícita de retorno.
