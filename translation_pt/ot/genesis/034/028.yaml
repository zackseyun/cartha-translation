  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: pt
  text: Levaram seus rebanhos, seu gado, seus jumentos, tudo o que havia na cidade e tudo o que havia no campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: seus rebanhos
  rationale: צֹאן é um coletivo que designa animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanhos” é natural em português e preserva o sentido coletivo sem especificar demais.
- source_word: בְּקָרָם
  choice: seu gado
  rationale: בָּקָר designa coletivamente bovinos. “Gado” é a forma corrente e clara em português, além de distinguir este grupo dos rebanhos de ovelhas e cabras.
- source_word: חֲמֹרֵיהֶם
  choice: seus jumentos
  rationale: O substantivo refere-se a jumentos. A escolha é direta, moderna e amplamente compreensível.
- source_word: אֲשֶׁר בָּעִיר
  choice: tudo o que havia na cidade
  rationale: A construção relativa, marcada como objeto de לָקָחוּ, indica de modo abrangente aquilo que estava na cidade. “Tudo o que havia” comunica naturalmente esse alcance no contexto do saque.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: tudo o que havia no campo
  rationale: שָׂדֶה pode indicar campo, terreno agrícola ou região aberta. “No campo” é direto, idiomático e preserva a formulação abrangente do hebraico.
- source_word: לָקָחוּ
  choice: Levaram
  rationale: לָקַח significa basicamente “tomar/pegar”. No contexto de bens e animais saqueados, “levaram” é natural em português e expressa o ato sem acrescentar a intensidade interpretativa de “saquearam” ou “apoderaram-se”.
