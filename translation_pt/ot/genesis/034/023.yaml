  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: pt
  text: Por acaso o gado deles, os seus bens e todos os seus animais não serão nossos? Basta concordarmos com eles[a], e eles habitarão conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consentirmos com eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: o gado deles
  rationale: מִקְנֶה designa coletivamente animais de criação; “gado” é natural em português e mantém o sentido econômico do contexto.
- source_word: קִנְיָנָם
  choice: os seus bens
  rationale: קִנְיָן refere-se ao que foi adquirido, isto é, bens ou propriedade. “Bens” expressa de modo amplo e corrente o patrimônio material.
- source_word: כָל בְּהֶמְתָּם
  choice: todos os seus animais
  rationale: בְּהֵמָה é um termo amplo para animais, muitas vezes domésticos. “Animais” preserva essa abrangência e evita repetir “gado”.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Por acaso ... não serão nossos?
  rationale: הֲלוֹא introduz uma pergunta retórica que espera resposta afirmativa; esta formulação comunica em português sua força persuasiva.
- source_word: אַךְ
  choice: Basta
  rationale: אַךְ restringe a proposta à condição seguinte. “Basta” torna clara e natural a ideia de que somente precisam aceitar o acordo.
- source_word: נֵאֹותָה לָהֶם
  choice: concordarmos com eles
  rationale: A forma de אוה no nifal expressa disposição, consentimento ou concordância. “Concordarmos com eles” é idiomático e adequado à negociação.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: e eles habitarão conosco
  rationale: יָשַׁב pode significar morar, habitar ou estabelecer-se. “Habitarão conosco” conserva tanto a residência quanto a integração comunitária sugerida pelo contexto.
