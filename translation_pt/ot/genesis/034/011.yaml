base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: pt
  text: 'Então Siquém disse ao pai dela e aos irmãos dela: “Que eu encontre favor aos olhos de vocês[a], e tudo o que vocês me disserem, eu darei[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que eu alcance a aprovação de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e darei tudo o que vocês me pedirem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: ao pai e aos irmãos dela
  rationale: Mantém os dois complementos introduzidos por אֶל e torna inequívoco que se trata do pai e dos irmãos da mulher.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Que eu encontre favor aos olhos de vocês
  rationale: Preserva o pedido de aceitação e a metáfora hebraica dos “olhos”, em formulação digna e compreensível.
- source_word: וַאֲשֶׁר
  choice: e ... o que
  rationale: Introduz a oração relativa de sentido aberto; em conjunto com a construção portuguesa, transmite “aquilo que/qualquer coisa que” sem tornar a frase pesada.
- source_word: תֹּאמְרוּ אֵלַי
  choice: vocês me disserem
  rationale: Traduz diretamente אָמַר com אֶל como “dizer a”; “pedirem de mim” é contextual, mas mais interpretativo.
- source_word: אֶתֵּן
  choice: darei
  rationale: Conserva o sentido amplo de נָתַן, “dar”, sem restringi-lo ao pagamento do preço da noiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala mantém a deferência própria de uma negociação, sem explicitar além do hebraico que o pedido se refere ao preço da noiva e aos presentes.
