  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: pt
  text: 'Somente concordaremos com vocês sob esta condição: se vocês se tornarem como nós, isto é, se todo homem entre vocês for circuncidado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Somente nisto consentiremos com vocês».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Somente nesta condição
  rationale: אַךְ restringe o consentimento, e בְּזֹאת introduz a condição específica. A formulação é natural em português e conserva a exclusividade da exigência.
- source_word: נֵאוֹת לָכֶם
  choice: concordaremos com vocês
  rationale: O nifal de אוה expressa disposição ou consentimento. Com o verbo português «concordar», a regência idiomática é «com vocês».
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: se vocês se tornarem como nós
  rationale: A oração condicional descreve a entrada num novo estado ou prática, não apenas uma semelhança já existente.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: circuncidando todo homem entre vocês
  rationale: A formulação expressa de modo corrente o meio pelo qual eles se tornariam semelhantes aos filhos de Jacó. «Todo homem» preserva a força distributiva de כָּל זָכָר, e «entre vocês» identifica o grupo indicado por לָכֶם.
