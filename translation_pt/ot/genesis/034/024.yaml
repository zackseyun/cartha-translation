  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: pt
  text: Todos os que saíam pelo portão de sua cidade[a] deram ouvidos[b] a Hamor e a Siquém, seu filho; e todos os homens, todos os que saíam pelo portão de sua cidade, foram circuncidados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “todos os que saíam pelo portão de sua cidade” e se refere aos homens da cidade que participavam da vida pública.
    reason: cultural_note
  - marker: b
    text: Ou “atenderam a”. O hebraico pode indicar não apenas que ouviram, mas que acolheram favoravelmente a proposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: deram ouvidos a
  rationale: A construção significa escutar alguém com resposta favorável. “Deram ouvidos a” preserva tanto o ato de ouvir quanto a aceitação da proposta, sem impor a ideia mais forte de obediência.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: todos os que saíam pelo portão da cidade de Hamor
  rationale: Mantém a imagem concreta e sua repetição no versículo. Na primeira ocorrência, explicita-se Hamor como referente provável do pronome hebraico, evitando em português a ambiguidade artificial de “sua cidade” depois da menção de pai e filho.
- source_word: בְּנוֹ
  choice: seu filho Siquém
  rationale: Reproduz de modo natural em português a relação filial expressa no hebraico, literalmente “Siquém, seu filho”.
- source_word: וַיִּמֹּלוּ
  choice: foram circuncidados
  rationale: O nifal plural admite sentido passivo ou reflexivo. A forma passiva portuguesa é natural no contexto e corresponde ao verbo plural hebraico, sem especificar quem realizou o rito.
- source_word: כָּל זָכָר
  choice: todos os homens
  rationale: No contexto, זָכָר designa os habitantes do sexo masculino. “Todos os homens” é natural e dignificado em português, enquanto “todos os indivíduos do sexo masculino” seria excessivamente técnico.
- source_word: שַׁעַר עִירוֹ
  choice: o portão da cidade
  rationale: Preserva o referente concreto, o portão urbano, associado à vida pública da cidade, sem substituí-lo diretamente por uma interpretação como “cidadãos”.
