base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: pt
  text: Quando Siquém, filho de Hamor, o heveu, príncipe da terra, viu-a, tomou-a, deitou-se com ela e a violentou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico pode significar “afligir”, “humilhar” ou “violar”. Neste contexto, refere-se a uma violação sexual; por isso, também se pode traduzir: “a estuprou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Reproduz o sentido narrativo básico de ראה de modo direto e natural.
- source_word: שְׁכֶם בֶּן־חֲמוֹר
  choice: Siquém, filho de Hamor
  rationale: Emprega as formas portuguesas tradicionais dos nomes e expressa naturalmente a relação de filiação.
- source_word: הַחִוִּי
  choice: o heveu
  rationale: Usa a designação étnica consagrada em português.
- source_word: נְשִׂיא הָאָרֶץ
  choice: líder daquela terra
  rationale: נָשִׂיא designa um chefe, líder ou príncipe. “Líder” preserva a função sociopolítica sem sugerir necessariamente realeza; “daquela terra” soa natural e evita a possível leitura de que ele governava toda a terra.
- source_word: וַיִּקַּח אֹתָהּ
  choice: tomou-a
  rationale: Mantém o sentido básico de לקח e a progressão verbal hebraica, sem transferir para este verbo sozinho toda a força coerciva explicitada pelo conjunto da frase.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: deitou-se com ela
  rationale: Equivalente português corrente e digno para o idiomatismo hebraico referente à relação sexual.
- source_word: וַיְעַנֶּהָ
  choice: a violentou
  rationale: No piel, ענה pode indicar afligir, humilhar ou violar. Neste contexto sexual coercivo, “violentou” comunica com clareza a violação sexual sem restringir o verbo à ideia abstrata de humilhação.
theological_decisions:
- issue: Expressar a violência sexual com fidelidade, sem eufemismo nem especificação excessiva
  choice: “tomou-a, deitou-se com ela e a violentou”
  alternative: “agarrou-a e a estuprou” ou “tomou-a, deitou-se com ela e a humilhou”
  rationale: A sequência hebraica apresenta um ato sexual coercivo. A redação conserva a progressão dos três verbos e deixa a avaliação culminante em ענה, tornando clara a violência sem fazer de לקח um verbo mais específico do que é.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A colocação pronominal “tomou-a” mantém dignidade narrativa sem arcaísmo excessivo. Uma única nota preserva a amplitude lexical do hebraico e explicita a força coerciva do contexto.
