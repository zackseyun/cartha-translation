translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos elementos foi mantida próxima do hebraico, inclusive sua coordenação compacta e semanticamente tensa, sem redistribuir silenciosamente os objetos entre os verbos. “Mulheres” preserva melhor a ambiguidade de אִשָּׁה do que “esposas”.
