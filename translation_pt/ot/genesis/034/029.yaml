  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: pt
  text: Levaram todos os seus bens e levaram cativas todas as suas crianças[a] e suas mulheres, e saquearam tudo o que havia na casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas crianças pequenas” ou “todos os seus dependentes”; o hebraico טַף costuma designar crianças pequenas e também pode abranger os dependentes da casa.
    reason: lexical_alternative
  - marker: b
    text: Ou “tudo o que havia na unidade doméstica”; em hebraico, “casa” também pode designar a unidade doméstica e seus bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: todos os bens deles
  rationale: חַיִל pode designar riqueza, recursos ou propriedades. “Bens” abrange as posses sem restringir o sentido a rebanhos ou força militar; a construção hebraica inclui esses bens entre os objetos da ação verbal conjunta.
- source_word: טַפָּם
  choice: todas as suas crianças
  rationale: טַף designa crianças pequenas e, por extensão, os dependentes vulneráveis de uma casa. “Crianças” é natural e claro em português, enquanto a nota preserva a nuance etária e doméstica.
- source_word: נְשֵׁיהֶם
  choice: suas mulheres
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. No contexto, “suas mulheres” preserva a ambiguidade lexical e evita afirmar que todas eram necessariamente esposas.
- source_word: שָׁבוּ
  choice: levaram como cativos
  rationale: שָׁבָה significa capturar ou levar cativo. A expressão mantém explícito o caráter de cativeiro e permite conservar a ordem e a coordenação compacta do hebraico.
- source_word: וַיָּבֹזּוּ
  choice: saquearam
  rationale: בזז denota tomar despojos ou pilhar. “Saquearam” é atual, claro e preserva a violência da ação.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: tudo o que havia na casa
  rationale: A tradução acompanha de perto o singular בַּבַּיִת, mas a nota registra que “casa” também pode ter sentido coletivo de unidade doméstica.
