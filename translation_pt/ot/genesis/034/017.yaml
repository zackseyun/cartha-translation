base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: pt
  text: Mas, se vocês não nos atenderem quanto a serem circuncidados[a], levaremos nossa filha e iremos embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não nos ouvirem, para serem circuncidados”. O infinitivo hebraico pode indicar o conteúdo ou a ação concreta de atender ao pedido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mas, se
  rationale: A conjunção introduz a alternativa contrária à proposta anterior; “Mas, se” expressa com naturalidade tanto a ligação quanto o contraste.
- source_word: לֹא תִשְׁמְעוּ אֵלֵינוּ
  choice: vocês não nos atenderem
  rationale: שׁמע com אֶל pode significar ouvir, dar atenção ou atender. Neste contexto de exigência, “atender” comunica que se trata de acatar a proposta sem intensificar o sentido para “obedecer”.
- source_word: לְ/הִמּוֹל
  choice: e não se deixarem circuncidar
  rationale: O infinitivo de מול especifica a ação mediante a qual eles atenderiam ao pedido. A coordenação torna a relação natural em português, enquanto “se deixarem circuncidar” preserva o sentido passivo do hebraico.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: pegaremos nossa filha
  rationale: A construção verbal tem valor futuro na consequência da condição. “Nossa filha” traduz diretamente o substantivo com sufixo da primeira pessoa do plural; no contexto, refere-se a Diná.
- source_word: וְ/הָלָכְנוּ
  choice: e iremos embora
  rationale: Embora הלך signifique literalmente “ir”, neste contexto indica partir do lugar; “iremos embora” transmite esse sentido em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A formulação coordenada evita uma construção rígida em português, preserva a relação entre atender ao pedido e aceitar a circuncisão e mantém em nota a estrutura mais literal do hebraico.
