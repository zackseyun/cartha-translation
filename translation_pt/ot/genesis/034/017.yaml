    rationale: No hebraico, o infinitivo “ser circuncidado” especifica o conteúdo/ato requerido em “dar ouvidos”, e não introduz de modo independente uma segunda cláusula negativa. Uma formulação que marque essa relação é mais fiel.
  - severity: low
    issue: “Pegaremos nossa filha” é menos preciso em registro e nuance.
    rationale: Embora possível, “pegar” pode soar coloquial ou sugerir agarrar. “Levaremos nossa filha” expressa naturalmente a retirada seguida de partida, sem acrescentar nuance.
