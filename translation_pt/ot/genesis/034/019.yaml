  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: pt
  text: E o jovem não demorou a fazer aquilo[a], porque desejava a filha de Jacó[b], e ele era o mais respeitado entre todos os da casa de seu pai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não hesitou em fazer isso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tinha grande prazer na filha de Jacó” ou “estava encantado com a filha de Jacó”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “era mais honrado do que todos os da casa de seu pai”.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: não demorou
  rationale: O verbo expressa demora ou tardança; no contexto, destaca que o jovem agiu prontamente, não necessariamente que venceu uma hesitação emocional.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: Refere-se a Siquém e é uma forma natural e digna em português contemporâneo, sem sugerir que fosse uma criança.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: a fazer aquilo
  rationale: Retoma a exigência mencionada no contexto anterior. 'Aquilo' comunica com naturalidade o valor referencial do hebraico הַדָּבָר.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa da prontidão do jovem de modo claro e direto.
- source_word: חָפֵץ
  choice: desejava
  rationale: O verbo abrange prazer, agrado e desejo. Neste contexto matrimonial, 'desejava' transmite bem a forte inclinação por Diná, sem especificar indevidamente sua natureza.
- source_word: בְּבַת יַעֲקֹב
  choice: a filha de Jacó
  rationale: Com חָפֵץ, o objeto da inclinação é expresso naturalmente em português sem reproduzir mecanicamente a preposição hebraica.
- source_word: נִכְבָּד
  choice: o mais respeitado
  rationale: O particípio de כבד indica alguém honrado, estimado ou de posição elevada. 'Respeitado' é corrente e preserva o sentido social no contexto.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: de toda a casa de seu pai
  rationale: 'Com o adjetivo e מִכֹּל, a frase funciona naturalmente como superlativo: ele se destacava entre todos os integrantes da casa paterna.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção superlativa no texto principal evita a ambiguidade de comparar Siquém com o edifício ou a instituição familiar, enquanto a nota preserva a forma comparativa possível do hebraico.
