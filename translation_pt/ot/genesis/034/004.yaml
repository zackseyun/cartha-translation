- source_word: קַח־לִי
  choice: Consiga para mim
  rationale: No contexto de um pedido dirigido ao pai para providenciar o casamento, comunica de modo natural o imperativo hebraico “toma para mim”, sem sugerir que Hamor deva literalmente agarrar a moça.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: esta moça
  rationale: יַּלְדָּה designa aqui uma jovem; “moça” é corrente, respeitoso e adequado ao contexto, enquanto “menina” poderia indicar idade infantil.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: Expressa a finalidade matrimonial da fórmula hebraica de tomar alguém por mulher, em português moderno e claro.
