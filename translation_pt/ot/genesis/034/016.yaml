id: GEN.34.16
reference: Genesis 34:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: pt
  text: então daremos nossas filhas a vocês, tomaremos para nós as filhas de vocês, viveremos com vocês e nos tornaremos um só povo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e seremos um só povo”. O hebraico diz literalmente “e seremos para um só povo”, construção que pode indicar o estado resultante (“nos tornaremos um só povo”) ou ser traduzida de maneira mais formal (“seremos um só povo”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: então daremos
  rationale: O perfeito qal com waw, na sequência da condição apresentada no versículo anterior, expressa a consequência futura do acordo; “então daremos” torna essa relação explícita e natural em português.
- source_word: בְּנֹתֵינוּ
  choice: nossas filhas
  rationale: Mantém o termo familiar concreto do hebraico, sem generalização.
- source_word: לָכֶם
  choice: a vocês
  rationale: A preposição לְ marca aqui o objeto indireto do verbo “dar”; “a vocês” é a correspondência natural em português.
- source_word: בְּנֹתֵיכֶם
  choice: as filhas de vocês
  rationale: Reproduz o termo familiar e deixa clara a reciprocidade da proposta; esta forma tem ampla legibilidade internacional e brasileira.
- source_word: נִקַּח
  choice: tomaremos
  rationale: לקח significa literalmente “tomar”. O contexto esclarece que se trata de casamento, por isso não é necessário explicitar “como esposas” no texto.
- source_word: לָנוּ
  choice: para nós
  rationale: Expressa naturalmente o valor dativo da construção hebraica, no contexto do acordo matrimonial recíproco.
- source_word: וְיָשַׁבְנוּ
  choice: viveremos
  rationale: ישׁב pode significar habitar, viver ou estabelecer-se; “viveremos com vocês” é claro e corrente neste contexto.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Correspondência direta e natural da preposição comitativa.
- source_word: וְהָיִינוּ
  choice: e nos tornaremos
  rationale: Embora a forma signifique literalmente “e seremos”, o contexto descreve o estado resultante da convivência e dos casamentos; “nos tornaremos” comunica esse valor sem eliminar a alternativa formal, registrada em nota.
- source_word: לְעַם אֶחָד
  choice: um só povo
  rationale: עַם designa um povo ou grupo humano, não necessariamente um Estado político moderno; “um só povo” preserva o sentido de união coletiva.
