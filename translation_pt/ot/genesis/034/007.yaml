  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: pt
  text: Os filhos de Jacó vieram do campo quando ouviram isso. Ficaram aflitos e muito irados, porque Siquém havia cometido uma infâmia em Israel ao se deitar com a filha de Jacó; isso não se deve fazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: ficaram profundamente indignados
  rationale: O verbo expressa dor, aflição ou pesar; no contexto, a indignação comunica naturalmente em português a combinação de sofrimento e ofensa, sem se confundir com a ira explicitada na oração seguinte.
- source_word: נְבָלָה
  choice: uma infâmia
  rationale: Designa um ato vergonhoso, ultrajante e moralmente perverso. “Infâmia” preserva a forte censura do hebraico em linguagem digna e corrente.
- source_word: לִשְׁכַּב אֶת
  choice: ao se deitar com
  rationale: Mantém o eufemismo sexual do hebraico sem acrescentar uma qualificação jurídica não expressa diretamente neste versículo.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: algo que não se deve fazer
  rationale: Reproduz a formulação impessoal e normativa do hebraico, preservando sua condenação enfática.
- source_word: בְיִשְׂרָאֵל
  choice: em Israel
  rationale: Conserva literalmente a expressão coletiva e teológica do narrador, inclusive seu caráter possivelmente proléptico dentro de Gênesis.
theological_decisions:
- issue: Natureza exata do ato de Siquém
  choice: Não explicitar aqui “estupro” ou “violação”
  alternative: “por ter violentado a filha de Jacó”
  rationale: O contexto mais amplo deve informar a leitura, mas a expressão deste versículo diz literalmente “deitar-se com”. A tradução preserva a formulação textual e não resolve neste ponto a tensão interpretativa.
- issue: Força normativa da frase final
  choice: “algo que não se deve fazer”
  alternative: “algo que jamais poderia ser feito”
  rationale: A escolha mantém a proibição moral impessoal sem ampliar o hebraico com um advérbio absoluto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de “os homens” foi substituída pelo pronome “eles”, pois o referente — os filhos de Jacó — permanece inequívoco. “Quando ouviram o que havia acontecido” torna explícito apenas o complemento contextual implícito de “ouviram”, sem acrescentar conteúdo interpretativo substantivo.
