review_pass:
  verdict: revise
  source_fidelity: A redação inverte a sequência narrativa ao dizer que os filhos de Jacó, depois de ouvirem, «voltaram do campo». O hebraico diz que eles vieram do campo quando ouviram a notícia. Além disso, «profundamente indignados» não traduz de modo suficiente וַיִּתְעַצְּבוּ, que expressa aflição/pesar; a ira intensa é expressa separadamente em seguida.
  naturalness: A formulação proposta é moderna e clara. «Vieram do campo» e «ficaram aflitos e muito irados» são naturais em português internacional e preservam melhor a progressão do texto.
  terminology: «Infâmia», «se deitar com a filha de Jacó» e «em Israel» são escolhas adequadas. A frase final deve manter a referência a tal ato, sem amplificação interpretativa.
  issues:
  - severity: medium
    issue: «voltaram do campo»
    rationale: «Voltaram» implica retorno e altera o verbo בָּאוּ («vieram»). O texto apenas informa que os filhos de Jacó vieram do campo.
  - severity: medium
    issue: «ficaram profundamente indignados» para וַיִּתְעַצְּבוּ
    rationale: O verbo hebraico indica aflição, tristeza ou pesar. A indignação/ira é então expressa distintamente por וַיִּחַר לָהֶם מְאֹד; verter ambos como indignação e ira enfraquece a primeira nuance.
  revised_text: Os filhos de Jacó vieram do campo quando ouviram isso. Ficaram aflitos e muito irados, porque Siquém havia cometido uma infâmia em Israel ao se deitar com a filha de Jacó; isso não se deve fazer.
  revised_footnotes: []
  revision_rationale: A revisão restabelece o movimento indicado pelo hebraico («vieram do campo») e distingue a aflição expressa pelo primeiro verbo da ira intensa expressa pelo segundo. Mantêm-se o sujeito contextual «Siquém», o eufemismo «se deitar com», a expressão «em Israel» e a condenação impessoal final, sem definir além do texto a natureza jurídica do ato.
