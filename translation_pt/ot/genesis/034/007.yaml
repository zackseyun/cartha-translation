revisions:
- from: Quando os filhos de Jacó ouviram o que havia acontecido, voltaram do campo. Eles ficaram profundamente indignados e muito irados, porque Siquém havia cometido uma infâmia em Israel ao se deitar com a filha de Jacó — algo que não se deve fazer.
  to: Os filhos de Jacó vieram do campo quando ouviram isso. Ficaram aflitos e muito irados, porque Siquém havia cometido uma infâmia em Israel ao se deitar com a filha de Jacó; isso não se deve fazer.
  rationale: A revisão restabelece o movimento indicado pelo hebraico («vieram do campo») e distingue a aflição expressa pelo primeiro verbo da ira intensa expressa pelo segundo. Mantêm-se o sujeito contextual «Siquém», o eufemismo «se deitar com», a expressão «em Israel» e a condenação impessoal final, sem definir além do texto a natureza jurídica do ato.
