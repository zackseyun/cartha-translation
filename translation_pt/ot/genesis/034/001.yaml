    issue: “para Jacó” em “dado à luz para Jacó”
    rationale: Embora tente refletir a preposição לְ, “para Jacó” pode sugerir finalidade ou benefício. Em português, “dar à luz a Jacó” expressa naturalmente a filiação sem acrescentar essa nuance.
  - severity: low
    issue: “daquela terra”
    rationale: O demonstrativo “daquela” não está expresso no hebraico. “Da terra” preserva a referência local sem introduzir distância deíctica.
  - severity: low
    issue: Âncora da nota no fim do versículo
    rationale: A nota trata especificamente de “filhas da terra”; a chamada deve ser ancorada nessa expressão para maior precisão editorial.
  revised_text: Diná, filha de Lia, que ela havia dado à luz a Jacó, saiu para ver as filhas da terra[a].
