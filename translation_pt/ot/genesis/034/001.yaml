  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: pt
  text: Diná, filha de Lia, que ela havia dado à luz a Jacó, saiu para ver as filhas da terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visitar as mulheres da terra”. O hebraico diz literalmente: “ver as filhas da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: saiu
  rationale: O qal consecutivo de יצא indica que Diná saiu. “Saiu” é natural em português e não acrescenta um ponto de partida ausente do hebraico.
- source_word: דִינָה
  choice: Diná
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בַּת לֵאָה
  choice: filha de Lia
  rationale: Reproduz com clareza a identificação de Diná por sua linhagem materna, sem exigir o artigo antes do aposto em português.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: que a havia dado à luz para Jacó
  rationale: A oração relativa retoma Lia; “a” explicita que Diná é o objeto de “dar à luz”. O mais-que-perfeito composto apresenta o nascimento como informação anterior ao evento narrado, e “para Jacó” preserva a relação expressa por ל.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Mantém o sentido direto de ראה e a finalidade da saída, sem impor a interpretação contextual mais específica de fazer uma visita.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: as filhas daquela terra
  rationale: Preserva a expressão hebraica “filhas da terra”. “Daquela” soa natural em português para a população local já situada no cenário, sem identificar uma região além do texto.
