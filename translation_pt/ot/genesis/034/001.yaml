- from: Diná, filha de Lia, que a havia dado à luz para Jacó, saiu para ver as filhas daquela terra.[a]
  to: Diná, filha de Lia, que ela havia dado à luz a Jacó, saiu para ver as filhas da terra[a].
  rationale: A revisão substitui a construção menos idiomática e semanticamente imprecisa “para Jacó” por “a Jacó”, remove o demonstrativo não expresso no texto hebraico e desloca a chamada da nota para a expressão lexical que ela esclarece. O sentido e a ambiguidade do hebraico são preservados.
