base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: pt
  text: As palavras deles pareceram boas a Hamor e a Siquém, filho de Hamor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As palavras deles agradaram a Hamor e a Siquém, filho de Hamor”.'
    reason: Alternativa lexical que traduz mais diretamente o valor de agrado ou aceitação do idioma hebraico.
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: pareceram boas
  rationale: No idioma hebraico com בְּעֵינֵי, expressa uma avaliação favorável. “Pareceram boas a” preserva de modo natural a ideia de que as palavras foram consideradas boas ou aceitáveis.
- source_word: דִבְרֵיהֶם
  choice: as palavras deles
  rationale: Mantém o plural concreto de דָּבָר e evita restringir o sentido a “proposta”, embora o contexto envolva uma proposta.
- source_word: בְּעֵינֵי
  choice: a
  rationale: O hebraísmo literal “aos olhos de” indica avaliação ou agrado. Com “pareceram boas”, a preposição “a” comunica isso naturalmente em português.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Transliteração tradicional e reconhecível do nome próprio hebraico.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
- source_word: בֶּן חֲמוֹר
  choice: filho de Hamor
  rationale: Reproduz diretamente a expressão hebraica de filiação e mantém a identificação narrativa.
