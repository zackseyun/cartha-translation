base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: pt
  text: 'Então Abraão caiu com o rosto em terra e riu. E disse consigo mesmo: “Será que nascerá um filho a um homem de cem anos? E Sara, aos noventa anos, dará à luz?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Abraão caiu com o rosto em terra
  rationale: Preserva o movimento de cair e expressa de modo natural em português a postura indicada pelo idioma hebraico ‘sobre o rosto’.
- source_word: וַיִּצְחָק
  choice: riu
  rationale: Equivale diretamente ao verbo צחק e mantém, sem explicação interpretativa, a ligação narrativa com o nome Isaque.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: disse consigo mesmo
  rationale: Comunica com clareza que as palavras não foram pronunciadas em voz alta. Evita o pouco natural ‘disse em seu coração’, preservando o sentido do idioma hebraico.
- source_word: הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד
  choice: Será que nascerá um filho a um homem de cem anos?
  rationale: A construção בן מאה שנה descreve alguém com cem anos de idade; יִוָּלֵד é traduzido naturalmente por ‘nascerá’. ‘Um filho’ explicita o descendente pressuposto pelo contexto e pela promessa anterior.
- source_word: וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה תֵּלֵד
  choice: E Sara, aos noventa anos, dará à luz?
  rationale: A expressão hebraica de idade, literalmente ‘filha de noventa anos’, corresponde naturalmente a ‘aos noventa anos’; תֵּלֵד significa ‘dará à luz’ com Sara como sujeito.
theological_decisions:
- issue: Sentido do riso de Abraão
  choice: Traduzir apenas como ‘riu’, sem qualificar sua motivação.
  alternative: ‘riu de incredulidade’ ou ‘riu de alegria’
  rationale: O texto relata o riso e as perguntas interiores, mas não define explicitamente se o riso expressa incredulidade, espanto ou alegria. A tradução preserva essa tensão narrativa.
- issue: Força das perguntas de Abraão
  choice: Manter perguntas retóricas sobre a possibilidade do nascimento.
  alternative: Transformá-las em afirmações de dúvida ou impossibilidade.
  rationale: As partículas interrogativas hebraicas apresentam perguntas; convertê-las em negação explícita resolveria indevidamente a atitude interior de Abraão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Com o rosto em terra’, ‘disse consigo mesmo’ e ‘aos noventa anos’ reproduzem os sentidos dos idiomas hebraicos sem literalismo artificial.
