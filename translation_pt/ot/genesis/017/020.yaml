  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: pt
  text: Quanto a Ismael, eu ouvi você. Saiba que eu o abençoei, o tornarei fértil e o multiplicarei muitíssimo. Ele gerará doze príncipes, e farei dele uma grande nação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: Quanto a Ismael
  rationale: Reproduz naturalmente a construção hebraica que introduz Ismael como tópico.
- source_word: הִנֵּה
  choice: Saiba que
  rationale: Comunica a função enfática e de chamada à atenção de הִנֵּה em português corrente e digno, sem exigir o arcaizante «eis».
- source_word: שְׁמַעְתִּיךָ
  choice: eu ouvi você
  rationale: 'Mantém o objeto pessoal explícito: Deus ouviu Abraão no que diz respeito ao pedido anterior por Ismael.'
- source_word: וְהִפְרֵיתִי אֹתוֹ
  choice: o tornarei fértil
  rationale: Expressa o causativo de פרה, isto é, fazer que tenha numerosa descendência.
- source_word: בִּמְאֹד מְאֹד
  choice: muitíssimo
  rationale: Transmite de modo idiomático a intensa repetição hebraica «muito, muito».
- source_word: נְשִׂיאִם
  choice: príncipes
  rationale: Preserva o título de líderes tribais ou governantes, tradicional e adequado ao contexto.
- source_word: יוֹלִיד
  choice: gerará
  rationale: Traduz diretamente o causativo com sentido de tornar-se pai ou gerar descendentes.
theological_decisions:
- issue: Relação temporal entre a bênção declarada e as promessas seguintes
  choice: «eu o abençoei» no perfeito, seguido de «o tornarei... o multiplicarei» no futuro
  alternative: 'Uniformizar tudo no futuro: «eu o abençoarei...»'
  rationale: Preserva a distinção formal do hebraico entre בֵּרַכְתִּי, perfeito, e os verbos subsequentes, também formalmente perfeitos mas coordenados em sequência profética/promissória. A tradução evita apagar a força de uma bênção já concedida.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A formulação mantém dignidade narrativa sem arcaísmos; «você» é usado para o singular explícito e «Saiba que» traduz a ênfase de הִנֵּה com naturalidade.
