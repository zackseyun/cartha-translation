  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: pt
  text: Mas estabelecerei a minha aliança com Isaque[a], que Sara lhe dará à luz nesta mesma época, no próximo ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E estabelecerei a minha aliança com Isaque”. A conjunção hebraica pode ser traduzida simplesmente por “e”, mas o contexto favorece o contraste com a promessa feita a respeito de Ismael no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mas
  rationale: O waw liga a declaração ao versículo anterior e, no contexto, marca contraste entre a bênção prometida a Ismael e o estabelecimento da aliança com Isaque.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Tradução corrente de בְּרִית com o sufixo de primeira pessoa; preserva a linguagem pactual do contexto.
- source_word: אָקִים
  choice: estabelecerei
  rationale: O hifil de קום, aplicado à aliança, expressa fazê-la vigorar ou firmá-la; “estabelecerei” conserva o sentido formal e é natural em português.
- source_word: אֶת יִצְחָק
  choice: com Isaque
  rationale: Embora אֶת seja formalmente o marcador de objeto direto, em português uma aliança é estabelecida “com” a parte envolvida.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: que Sara dará à luz para você
  rationale: A oração relativa identifica Isaque como o filho prometido e conserva o valor de לְךָ, referente a Abraão, em linguagem clara.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: nesta mesma época, no ano que vem
  rationale: מוֹעֵד indica um tempo determinado; em conjunto com “no ano seguinte”, a formulação portuguesa comunica naturalmente a mesma época do próximo ano.
theological_decisions:
- issue: A linha da aliança por meio de Isaque, em contraste com Ismael
  choice: O texto afirma que Deus estabelecerá sua aliança com Isaque.
  alternative: Entender a bênção de Ismael no versículo anterior como equivalente ao estabelecimento da aliança.
  rationale: A tradução mantém a distinção explícita no contexto, sem acrescentar conclusões teológicas posteriores ao que o versículo declara.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Isaque” segue a forma bíblica consagrada em português; “nesta mesma época, no ano que vem” reproduz de modo natural a referência temporal determinada.
