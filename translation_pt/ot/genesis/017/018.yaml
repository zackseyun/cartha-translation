  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: pt
  text: 'E Abraão disse a Deus: “Quem dera que Ismael vivesse diante de ti[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tomara que Ismael viva na tua presença” ou “sob o teu favor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “E ... disse” preserva a ligação narrativa e soa natural em português bíblico atual.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: Com o verbo “dizer”, a preposição אֶל indica o destinatário; o artigo hebraico identifica o Deus específico do contexto, enquanto o português idiomático usa simplesmente “Deus”.
- source_word: לוּ
  choice: Quem dera que
  rationale: A partícula introduz aqui um desejo, não uma condição. “Quem dera que” comunica com clareza a força optativa e a emoção de Abraão.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יִחְיֶה
  choice: vivesse
  rationale: O imperfeito sob a partícula optativa expressa o conteúdo desejado; o imperfeito do subjuntivo é idiomático após “quem dera que” e preserva a ideia de vida continuada.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Reproduz de perto a expressão hebraica “diante da tua face/presença”, mantendo aberta sua possível dimensão relacional, favorável e pactual sem explicitá-la indevidamente.
theological_decisions:
- issue: Sentido do desejo de Abraão acerca da vida de Ismael perante Deus
  choice: diante de ti
  alternative: na tua presença; sob o teu favor
  rationale: A expressão pode sugerir vida na presença e sob o favor de Deus, mas não especifica aqui todo o conteúdo teológico dessa vida. A formulação concisa preserva a tensão narrativa e evita inserir no texto principal uma interpretação pactual mais desenvolvida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Quem dera” conserva o tom emotivo sem arcaísmo excessivo; “diante de ti” mantém a concisão e a ambiguidade genuína do hebraico.
