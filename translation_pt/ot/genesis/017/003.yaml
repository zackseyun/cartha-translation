base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: pt
  text: 'Então Abrão caiu com o rosto em terra, e Deus falou com ele, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: caiu
  rationale: O qal wayyiqtol de נפל relata uma ação passada. Com o complemento «com o rosto em terra», «caiu» comunica naturalmente a prostração sem explicitá-la além do hebraico.
- source_word: עַל פָּנָיו
  choice: com o rosto em terra
  rationale: A expressão hebraica descreve a postura de prostração. Esta formulação preserva a imagem e soa natural e digna em português atual.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Forma tradicional e amplamente reconhecida em português; neste ponto da narrativa, o nome ainda não foi mudado para Abraão.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel wayyiqtol de דבר significa normalmente «falar». A construção «falou ... dizendo» conserva a fórmula narrativa hebraica.
- source_word: אִתּוֹ
  choice: com ele
  rationale: Traduz diretamente a preposição אֵת com sufixo, preservando a nuance relacional do hebraico sem deixar de ser compreensível em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo no singular e o contexto indicam o Deus único como referente.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto de אמר introduz a fala direta que vem a seguir e é adequadamente representado pela fórmula «dizendo».
- source_word: וַ
  choice: Então
  rationale: O waw narrativo assinala sequência; «Então» produz uma ligação natural em português moderno.
theological_decisions:
- issue: Referente e número de אֱלֹהִים
  choice: Deus, no singular
  alternative: deuses, com base apenas na forma morfológica plural
  rationale: O verbo está no singular, e o contexto identifica o Deus da aliança que fala com Abrão. O plural seria gramatical e contextualmente inadequado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Com o rosto em terra» mantém a imagem concreta e reverente da expressão hebraica. A pontuação final com dois-pontos prepara a fala direta do versículo seguinte.
