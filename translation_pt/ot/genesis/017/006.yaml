id: GEN.17.6
reference: Genesis 17:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: pt
  text: Eu farei você extremamente fecundo[a]; farei de você nações, e de você sairão reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “muito, muito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Eu farei você ... fecundo
  rationale: 'O hifil de פרה exprime causação: Deus fará Abraão frutificar. “Farei você fecundo” preserva esse sentido e soa natural em português.'
- source_word: בִּמְאֹד מְאֹד
  choice: extremamente
  rationale: A repetição de מְאֹד intensifica fortemente a promessa. “Extremamente” transmite a ênfase de modo idiomático; a forma mais literal é registrada em nota.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: farei de você nações
  rationale: 'נתן com לְ tem aqui valor resultativo no contexto da descendência: Abraão será feito origem de nações. A formulação mantém a concisão e a tensão da imagem hebraica, sem reduzi-la apenas a uma explicação interpretativa.'
- source_word: לְגוֹיִם
  choice: nações
  rationale: גּוֹיִם designa nações ou povos. “Nações” é preciso neste contexto e não introduz o sentido posterior e mais restrito de “gentios”.
- source_word: וּמְלָכִים
  choice: e ... reis
  rationale: מְלָכִים significa especificamente “reis”; uma opção como “governantes” seria indevidamente ampla.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: de você sairão
  rationale: A tradução preserva a imagem concreta de יצא, “sair”, e em português continua inteligível como indicação de origem genealógica.
theological_decisions:
- issue: Alcance da promessa feita a Abraão
  choice: A promessa apresenta Abraão como origem de várias nações e de reis.
  alternative: A expressão poderia ser entendida mais abstratamente como a concessão de uma posição entre as nações.
  rationale: O contexto imediato da aliança enfatiza fecundidade, descendência e linhagem. A redação conserva esse sentido progenitivo sem importar sistemas teológicos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e o paralelismo do hebraico foram preservados. Emprega-se “você” para o singular, evitando a forma regional “tu” e a formalidade mais marcada de “o senhor”.
