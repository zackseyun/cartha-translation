base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: pt
  text: Tanto o nascido em sua casa como o comprado com seu dinheiro deverão ser circuncidados[a][b][c]. E a minha aliança estará na carne de vocês como aliança perpétua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente serão circuncidados”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o nascido de sua casa” e “o adquirido por seu dinheiro”; as expressões se referem a membros da casa de Abraão, tanto aos nascidos nela como aos adquiridos por compra.
    reason: cultural_note
  - marker: c
    text: 'Outra tradução possível: “Aquele que nasceu em sua casa e aquele que foi comprado com seu dinheiro”.'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: deverá ser circuncidado
  rationale: A construção hebraica com infinitivo absoluto e verbo finito dá ênfase e, neste contexto, reforça a obrigação. A formulação portuguesa é natural e categórica; a nota preserva a força enfática explícita.
- source_word: יְלִיד בֵּיתְךָ
  choice: o nascido em sua casa
  rationale: Reproduz de modo conciso a expressão 'nascido da casa', sem acrescentar ao sintagma uma condição social que o contexto pode sugerir, mas que as palavras não explicitam isoladamente.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: o comprado com seu dinheiro
  rationale: Indica uma pessoa adquirida por compra. 'Dinheiro' comunica naturalmente o sentido contextual de כֶּסֶף, literalmente 'prata'.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: Mantém o termo central da linguagem pactual e o sufixo de primeira pessoa.
- source_word: בִּבְשַׂרְכֶם
  choice: na carne de vocês
  rationale: Reflete a preposição hebraica ב e preserva a ligação corporal direta entre a circuncisão e a aliança. O plural 'vocês' corresponde à mudança para a segunda pessoa plural no hebraico.
- source_word: לִבְרִית עוֹלָם
  choice: como aliança perpétua
  rationale: O ל pode indicar função ou resultado. 'Como' expressa que a aliança na carne permanece na qualidade de aliança duradoura; 'perpétua' é uma tradução tradicional e clara de עוֹלָם neste contexto.
theological_decisions:
- issue: Relação entre o sinal corporal e a aliança
  choice: A tradução declara diretamente que a aliança estará na carne, sem explicar se o sinal apenas simboliza ou de algum modo constitui a pertença à aliança.
  alternative: Interpretar explicitamente a circuncisão como mero símbolo, ou identificar sacramentalmente o sinal com a própria aliança.
  rationale: A frase hebraica mantém uma associação forte entre aliança e carne, mas não desenvolve aqui uma teoria sobre essa relação. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “tanto... como” deixa claro que a obrigação abrange as duas categorias. “Vocês” traduz o plural de בְשַׂרְכֶם sem recorrer ao regional “vós”. Os marcadores seguem a ordem natural de leitura em português.
