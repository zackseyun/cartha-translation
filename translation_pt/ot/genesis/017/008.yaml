  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: pt
  text: Darei a você e à sua descendência depois de você a terra em que você vive como estrangeiro[a] — toda a terra de Canaã — como propriedade perpétua[b]; e serei o Deus deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra de suas peregrinações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para ser propriedade perpétua”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Darei
  rationale: O perfeito qal na fala da aliança tem força de promessa futura; “Darei” a expressa de modo natural e direto em português.
- source_word: לְךָ
  choice: a você
  rationale: Representa o dativo simples, tendo Abraão pessoalmente como destinatário.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: e à sua descendência depois de você
  rationale: “Descendência” preserva o caráter coletivo de זֶרַע, enquanto “depois de você” mantém a ideia de sucessão.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: a terra em que você vive como estrangeiro
  rationale: Comunica com clareza moderna que Abraão residia ali sem possuir a terra nem ser natural dela; a alternativa mais formal consta em nota.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: toda a terra de Canaã
  rationale: Mantém a aposição explicativa e a abrangência de כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: como propriedade perpétua
  rationale: “Propriedade” expressa a posse fundiária de אֲחֻזָּה, e “perpétua” conserva a força duradoura de עוֹלָם sem acrescentar uma interpretação cronológica além do termo.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: e serei o Deus deles
  rationale: É a formulação idiomática da relação de aliança e não sugere qualquer mudança ontológica em Deus.
theological_decisions:
- issue: Tradução da fórmula da aliança sem importar nuances doutrinárias posteriores
  choice: e serei o Deus deles
  alternative: e serei Deus para eles
  rationale: A opção escolhida preserva a fórmula relacional da aliança e sua ressonância bíblica, sem indicar que Deus passa por uma mudança de natureza.
- issue: Alcance temporal de עוֹלָם
  choice: perpétua
  alternative: duradoura
  rationale: “Perpétua” conserva a força mais intensa e tradicional do termo no contexto da promessa, sem explicar no texto como essa duração deve ser teologicamente entendida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o pouco corrente “terra das suas peregrinações” no texto principal, mas o preserva como alternativa formal em nota. Os marcadores aparecem junto às expressões a que se referem.
