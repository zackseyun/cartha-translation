  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: pt
  text: 'E Deus disse: “Não, mas Sara, sua mulher, dará à luz um filho para você, e você lhe dará o nome de Isaque.[a] Estabelecerei a minha aliança com ele como aliança perpétua para a sua descendência depois dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Isaque soa como o verbo hebraico que significa “ele ri” ou “ele rirá”.
    reason: Explica o jogo sonoro presente no nome hebraico יִצְחָק, que não é perceptível em português.
lexical_decisions:
- source_word: אֲבָל
  choice: Não.
  rationale: No contexto, a palavra corrige diretamente o pedido anterior de Abraão a respeito de Ismael. A forma breve preserva a força corretiva sem tornar a frase artificial em português.
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: dará à luz um filho para você
  rationale: O particípio tem sentido futuro neste anúncio. “Dará à luz” é natural e mantém explícito o beneficiário indicado por לְךָ.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: você lhe dará o nome
  rationale: Expressa naturalmente em português a fórmula hebraica de nomeação, sem perder seu caráter prescritivo.
- source_word: יִצְחָק
  choice: Isaque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַהֲקִמֹתִי
  choice: Estabelecerei
  rationale: Preserva o sentido de fazer a aliança permanecer válida e é adequado à linguagem de aliança.
- source_word: בְּרִיתִי אִתּוֹ
  choice: a minha aliança com ele
  rationale: Mantém Isaac como participante explícito da relação de aliança.
- source_word: לִבְרִית עוֹלָם
  choice: como aliança perpétua
  rationale: A construção indica condição ou designação. “Perpétua” comunica duração continuada sem acrescentar categorias filosóficas à expressão hebraica.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: para a sua descendência depois dele
  rationale: “Descendência” preserva o valor coletivo de זֶרַע e é claro em português moderno.
theological_decisions:
- issue: Alcance e continuidade da promessa da aliança
  choice: Apresentar a aliança como estabelecida com Isaque e estendida à sua descendência depois dele.
  alternative: Restringir a promessa a uma leitura exclusivamente étnico-nacional ou fazê-la definir diretamente sistemas posteriores de teologia da aliança.
  rationale: O versículo afirma a relação de aliança com Isaque e sua descendência, mas não especifica aqui todas as implicações teológicas posteriores; a tradução preserva esse alcance sem estreitá-lo nem ampliá-lo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formas naturais no Brasil. A correção enfática de אֲבָל foi apresentada como uma frase breve (“Não.”), evitando o pouco idiomático “Não, mas”. O marcador da nota foi colocado imediatamente após o nome ao qual se refere.
