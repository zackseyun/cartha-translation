  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: pt
  text: Quanto a mim[a], eis que a minha aliança é com você, e você se tornará pai de uma multidão de nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eu — eis que a minha aliança é com você». O pronome inicial e a partícula são enfáticos em hebraico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e você será pai de uma multidão de nações».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Quanto a mim
  rationale: O pronome independente é enfático e abre a declaração divina com destaque discursivo; «Quanto a mim» expressa isso de modo natural em português.
- source_word: הִנֵּה
  choice: eis que
  rationale: A partícula chama solenemente a atenção para a declaração que segue; «eis que» preserva essa força dêitica sem reduzi-la a mero reforço.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: «Aliança» é o termo consagrado e preciso para בְּרִית no contexto abraâmico, mantendo seu peso narrativo e teológico.
- source_word: אִתָּךְ
  choice: com você
  rationale: Traduz diretamente a preposição com sufixo, sem ampliar o texto para «entre mim e você».
- source_word: וְהָיִיתָ
  choice: e você se tornará
  rationale: No contexto da declaração pactual, a forma tem valor futuro e resultativo; «se tornará» evidencia a passagem à função prometida.
- source_word: לְאָב
  choice: pai de
  rationale: A construção hebraica indica a função ou condição que Abraão passará a exercer. Em português, «pai de» é natural e não exige artigo antes do predicativo.
- source_word: הֲמוֹן
  choice: uma multidão de
  rationale: Preserva a ideia de grande número e a conexão lexical com a explicação do novo nome no versículo seguinte.
- source_word: גּוֹיִם
  choice: nações
  rationale: Refere-se amplamente a nações ou povos, sem o sentido técnico posterior de «gentios».
theological_decisions:
- issue: Formulação da aliança e papel de Abraão
  choice: «a minha aliança está com você, e você se tornará pai de uma multidão de nações»
  alternative: «estabeleço a minha aliança com você» ou «você será ancestral de muitas nações»
  rationale: A formulação mantém a declaração divina e seu resultado prometido sem acrescentar um verbo de instituição não expresso aqui nem substituir a imagem explícita de «pai» por uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Eis que» mantém a solenidade do hebraico; «você» oferece clareza contemporânea. A ordem e a tensão da declaração pactual foram preservadas sem expansão interpretativa.
