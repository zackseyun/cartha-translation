source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: pt
  text: Assim, Abraão tomou seu filho Ismael, todos os nascidos em sua casa e todos os que haviam sido comprados com seu dinheiro — todos os homens da casa de Abraão — e circuncidou a carne do prepúcio deles naquele mesmo dia[a], conforme Deus lhe havia falado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “neste mesmo dia”, expressão que enfatiza que Abraão obedeceu imediatamente, naquele exato dia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conforme Deus havia falado com ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido narrativo comum de לקח e introduz a ação imediata de Abraão.
- source_word: יְלִידֵי בֵיתוֹ
  choice: os nascidos em sua casa
  rationale: Preserva a imagem concreta do hebraico sem explicitar no texto principal uma condição social além do que a expressão afirma.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: os que haviam sido comprados com seu dinheiro
  rationale: Expressa com clareza a aquisição por compra; o mais-que-perfeito situa a compra antes da ação narrada.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: todos os homens da casa de Abraão
  rationale: Comunica a abrangência de כָּל זָכָר e preserva a referência masculina explícita, evitando a redundância pouco natural de 'todo homem entre os homens'.
- source_word: וַיָּמָל
  choice: circuncidou
  rationale: É o verbo corrente e preciso em português para a realização da circuncisão.
- source_word: בְּשַׂר עָרְלָתָם
  choice: a carne do prepúcio deles
  rationale: Conserva a formulação corporal concreta e a terminologia pactual do hebraico.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: Reproduz naturalmente a ênfase idiomática na execução imediata naquele exato dia.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: conforme Deus lhe havia falado
  rationale: Representa a sequência narrativa e deixa a nota registrar a possível nuance dialogal da preposição.
theological_decisions:
- issue: Tradução de אֱלֹהִים no contexto da aliança
  choice: Deus
  alternative: um deus/deuses
  rationale: O contexto identifica inequivocamente o referente como o Deus que fala com Abraão e estabelece a aliança.
- issue: Linguagem masculina na descrição da casa
  choice: todos os homens da casa de Abraão
  alternative: todos os membros da casa de Abraão do sexo masculino
  rationale: Preserva a referência masculina explícita de זָכָר e אַנְשֵׁי em português natural, sem neutralizá-la nem acrescentar formulação técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão delimita a expressão recapitulativa “todos os homens da casa de Abraão” e evita uma coordenação ambígua. As notas preservam a ênfase idiomática temporal e a possível nuance entre Deus falar a Abraão e falar com ele.
