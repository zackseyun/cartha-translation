  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: pt
  text: Circuncidem a carne do prepúcio de vocês; isso será um sinal[a] da aliança entre mim e vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: uma marca da aliança.'
    reason: Alternativa lexical para אוֹת, que pode designar um sinal ou uma marca identificadora.
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Circuncidem
  rationale: A forma verbal, ligada à instrução da aliança, tem força diretiva. O imperativo em português comunica isso com naturalidade, sem transformar a ordem em mera previsão.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: a carne do prepúcio de vocês
  rationale: Mantém a expressão anatômica concreta e a referência coletiva aos homens do grupo, preservando de perto os termos hebraicos.
- source_word: וְהָיָה
  choice: isso será
  rationale: O pronome retoma o ato de circuncisão acabado de ordenar, enquanto o futuro preserva o sentido da forma hebraica.
- source_word: לְאוֹת בְּרִית
  choice: um sinal da aliança
  rationale: אוֹת significa aqui “sinal” ou “marca”, e בְּרִית se refere à aliança específica estabelecida no contexto.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: entre mim e vocês
  rationale: Reproduz diretamente as duas partes relacionais expressas no hebraico, sem acrescentar ao versículo referências implícitas aos descendentes.
theological_decisions:
- issue: Natureza da circuncisão como sinal da aliança
  choice: um sinal da aliança
  alternative: uma marca da aliança
  rationale: A tradução conserva a função pactual atribuída à circuncisão, sem definir além do texto se o sinal deve ser entendido em termos sacramentais ou apenas simbólicos.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para a segunda pessoa do plural. O imperativo “Circuncidem” preserva a força da instrução pactual; a formulação anatômica permanece deliberadamente próxima do hebraico.
