  yaml_path: translation/ot/genesis/017/024.yaml
  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: pt
  text: Abraão tinha noventa e nove anos quando a carne do seu prepúcio foi circuncidada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraão
  rationale: O nome é vertido na forma portuguesa tradicional. A conjunção ו funciona aqui como ligação narrativa e pode ficar implícita em português sem perda de sentido.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: tinha noventa e nove anos
  rationale: Traduz de modo idiomático a expressão hebraica literalmente equivalente a «filho de noventa e nove anos».
- source_word: בְּ/הִמֹּלוֹ
  choice: quando ... foi circuncidada
  rationale: A preposição ב com o infinitivo construto e sufixo pronominal indica a circunstância temporal. A construção passiva preserva a forma do hebraico, cujo sujeito gramatical é «a carne do seu prepúcio».
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: a carne do seu prepúcio
  rationale: Mantém a referência corporal concreta e a formulação explícita da cadeia construta hebraica, em vez de simplificá-la para «quando foi circuncidado».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação preserva deliberadamente a concretude anatômica e a voz passiva do hebraico.
