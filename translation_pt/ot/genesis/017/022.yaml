base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: pt
  text: Quando acabou de falar com ele, Deus subiu de junto de Abraão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus ascendeu de junto de Abraão”. O hebraico usa o verbo “subir/ascender”, descrevendo o fim da manifestação divina em termos espaciais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Quando acabou
  rationale: O wayyiqtol de כלה indica a conclusão da ação e, em português natural, introduz aqui a circunstância temporal da oração principal.
- source_word: לְדַבֵּר
  choice: de falar
  rationale: O infinitivo de דבר após כלה forma a expressão idiomática “acabar de falar”.
- source_word: אִתּוֹ
  choice: com ele
  rationale: A preposição את com sufixo expressa interação; “com ele” preserva a reciprocidade implícita, sem substituir o pronome por Abraão.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה denota subir ou ascender. “Subiu” mantém de modo claro e corrente a imagem espacial concreta do hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma nominal seja morfologicamente plural, o verbo singular e o contexto exigem a referência singular a Deus.
- source_word: מֵעַל
  choice: afastando-se de
  rationale: מֵעַל significa literalmente “de sobre/de junto de”. A construção explicita em português que a subida encerra a presença manifestada junto a Abraão, sem eliminar o movimento vertical.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
theological_decisions:
- issue: Descrição espacial da partida divina
  choice: Deus subiu, afastando-se de Abraão
  alternative: Deus retirou-se de Abraão
  rationale: A tradução conserva o verbo concreto de subida usado na narrativa, sem reduzir a cena a uma partida abstrata nem inferir que Deus esteja espacialmente limitado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva a imagem vertical do hebraico e evita o pouco natural “subiu de Abraão”.
