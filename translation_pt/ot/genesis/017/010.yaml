  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: pt
  text: 'Esta é a minha aliança, que vocês devem guardar, entre mim e vocês e a descendência de vocês[a] depois de vocês: todo aquele que for do sexo masculino entre vocês deverá ser circuncidado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de vocês”. O termo hebraico זֶרַע é coletivo e pode indicar a descendência ou os descendentes.
    reason: Alternativa lexical que explicita o valor coletivo de זֶרַע.
lexical_decisions:
- source_word: זֹאת
  choice: Esta é
  rationale: O demonstrativo feminino singular apresenta a estipulação da aliança; o verbo “é”, implícito no hebraico, é necessário em português.
- source_word: בְּרִיתִי
  choice: minha aliança
  rationale: “Aliança” é a tradução consagrada e semanticamente adequada para בְּרִית no contexto da relação vinculante estabelecida por Deus.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: que vocês devem guardar
  rationale: A construção expressa obrigação. “Devem guardar” comunica esse valor de modo claro e atual, sem o tom ambíguo de uma simples previsão futura.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: entre mim e vocês e a descendência de vocês depois de vocês
  rationale: Mantém a estrutura relacional e a sucessão temporal do hebraico. “Descendência” preserva o caráter coletivo de זֶרַע.
- source_word: הִמּוֹל
  choice: deverá ser circuncidado
  rationale: O infinitivo absoluto funciona aqui como exigência da aliança. A formulação passiva liga naturalmente a ordem a “todo aquele que for do sexo masculino”.
- source_word: לָכֶם
  choice: entre vocês
  rationale: No contexto, a expressão delimita o grupo dentro do qual a exigência se aplica; “entre vocês” é idiomático em português.
- source_word: כָּל זָכָר
  choice: todo aquele que for do sexo masculino
  rationale: Preserva explicitamente a abrangência masculina, incluindo adultos e crianças, sem usar “todo homem”, que poderia sugerir apenas adultos, nem “todo macho”, que soa inadequado para pessoas no português atual.
theological_decisions:
- issue: Especificidade masculina da exigência do sinal da aliança
  choice: todo aquele que for do sexo masculino entre vocês deverá ser circuncidado
  alternative: todos vocês deverão ser circuncidados
  rationale: O hebraico especifica כָּל זָכָר; portanto, a tradução mantém o escopo masculino e não generaliza a ordem.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “entre” e “vocês” acompanha a estrutura solene da formulação da aliança, embora se evite rigidez excessiva.
