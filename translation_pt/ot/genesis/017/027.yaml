base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: pt
  text: E todos os homens da sua casa, tanto os nascidos em casa como os comprados de um estrangeiro por dinheiro[a], foram circuncidados com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “filho de estrangeiro”, expressão que significa “estrangeiro” ou “alguém de fora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: E todos
  rationale: A conjunção liga o versículo à narrativa anterior, e כָּל expressa totalidade; “E todos” preserva ambas as funções com naturalidade.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: os homens da sua casa
  rationale: A expressão designa os homens pertencentes à casa de Abraão, entendida como unidade doméstica. “Da sua casa” é corrente e mantém a imagem hebraica.
- source_word: יְלִיד בָּיִת
  choice: os nascidos em casa
  rationale: A expressão se refere aos que nasceram dentro da unidade doméstica; a formulação é clara e evita linguagem arcaica.
- source_word: וּמִקְנַת כֶּסֶף
  choice: como os comprados por dinheiro
  rationale: O sintagma indica pessoas adquiridas mediante pagamento. “Comprados por dinheiro” conserva de modo direto o caráter transacional do hebraico.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: de um estrangeiro
  rationale: בֶּן נֵכָר é uma expressão idiomática para alguém estrangeiro ou de fora; a tradução evita um literalismo pouco natural.
- source_word: נִמֹּלוּ
  choice: foram circuncidados
  rationale: O nifal é adequadamente expresso como passivo no contexto narrativo, sem sugerir que eles próprios realizaram o ato.
- source_word: אִתּוֹ
  choice: com ele
  rationale: A expressão indica associação com Abraão no acontecimento, e “com ele” a reproduz de forma concisa.
