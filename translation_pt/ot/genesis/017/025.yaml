  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: pt
  text: E Ismael, seu filho, tinha treze anos quando foi circuncidado na carne do seu prepúcio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: E Ismael
  rationale: Mantém a conjunção narrativa hebraica de modo simples e translitera o nome na forma portuguesa consagrada.
- source_word: בְּנ֔/וֹ
  choice: seu filho
  rationale: Traduz diretamente o substantivo com sufixo de terceira pessoa masculina singular, identificando Ismael como filho de Abraão.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: tinha treze anos
  rationale: Expressa em português natural a fórmula hebraica idiomática de idade.
- source_word: בְּ/הִמֹּל/וֹ
  choice: quando foi circuncidado
  rationale: A preposição com o infinitivo construto e o sufixo tem valor temporal; a forma verbal passiva é preservada com Ismael como referente.
- source_word: אֵת
  choice: '[não traduzido separadamente]'
  rationale: A partícula que marca o objeto direto não possui equivalente lexical independente em português.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: na carne do seu prepúcio
  rationale: Preserva a expressão concreta do hebraico e funciona em português como especificação da parte do corpo em que se realizou a circuncisão.
