  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: pt
  text: 'E Deus disse a Abraão: “Quanto a você, guardará a minha aliança, você e a sua descendência depois de você, ao longo das suas gerações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva essa ligação de modo natural e digno em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a correspondência direta e habitual para o Deus que fala com Abraão no contexto da aliança.
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: A expressão reproduz a ênfase do pronome anteposto e a mudança das promessas divinas para a obrigação de Abraão.
- source_word: אֶת־בְּרִיתִי
  choice: a minha aliança
  rationale: Traduz diretamente o substantivo com sufixo de primeira pessoa e conserva a terminologia central da passagem.
- source_word: תִשְׁמֹר
  choice: guardará
  rationale: שׁמר pode significar guardar, manter ou observar. “Guardará” preserva a formulação pactual e o valor diretivo do imperfeito sem ampliar o sentido.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: você e a sua descendência
  rationale: “Descendência” é uma forma coletiva natural em português para זֶרַע e mantém melhor sua unidade coletiva do que uma pluralização distributiva.
- source_word: אַחֲרֶיךָ
  choice: depois de você
  rationale: Expressa de forma direta a sucessão da linhagem.
- source_word: לְדֹרֹתָם
  choice: por todas as gerações deles
  rationale: Comunica a continuidade da obrigação ao longo das sucessivas gerações e mantém explícito o sufixo plural hebraico.
theological_decisions:
- issue: Expressão da obrigação de guardar a aliança sem acrescentar nuances jurídicas ou sacramentais
  choice: guardará a minha aliança
  alternative: deverá guardar a minha aliança; observará a minha aliança
  rationale: “Guardará” conserva a força da determinação pactual e a amplitude semântica de שׁמר, sem introduzir uma interpretação denominacional específica.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil. Emprega “você” para clareza contemporânea, com sintaxe digna e próxima do hebraico. “Descendência” preserva o caráter coletivo do singular hebraico זֶרַע; não se acrescentou nota porque a alternativa literal “semente” seria pouco natural neste contexto em português.
