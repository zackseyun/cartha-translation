  naturalness: «Por todas as gerações deles» soa calcado e menos natural no português contemporâneo. «Ao longo das suas gerações» preserva o sentido durativo e torna a referência à descendência mais fluente no contexto.
  terminology: «Aliança», «guardar» e «descendência» são escolhas adequadas, fiéis ao hebraico e livres de acréscimos doutrinários. «Descendência» reproduz bem o valor coletivo de זַרְעֲךָ.
