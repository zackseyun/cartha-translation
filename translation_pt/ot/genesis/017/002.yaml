  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: pt
  text: E estabelecerei a minha aliança entre mim e você[a] e farei você se multiplicar muitíssimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Darei ou porei a minha aliança entre mim e você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: Estabelecerei
  rationale: Embora נתן signifique literalmente “dar”, “pôr” ou “colocar”, com בְּרִית a expressão indica o ato de estabelecer a aliança. “Estabelecerei” comunica esse sentido de modo natural, enquanto a nota preserva a forma mais literal.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: “Aliança” conserva o sentido relacional, formal e teológico de בְּרִית; o sufixo de primeira pessoa é expresso por “minha”.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Tradução direta e corrente da expressão relacional hebraica, com o destinatário masculino singular mantido sem explicitação adicional.
- source_word: וְאַרְבֶּה אֹתְךָ
  choice: e farei você se multiplicar
  rationale: A forma causativa de רבה indica que Deus fará Abrão aumentar ou multiplicar-se. Esta construção soa natural em português e mantém “você” como objeto da promessa, sem substituí-lo explicitamente por “seus descendentes”.
- source_word: בִּמְאֹד מְאֹד
  choice: muitíssimo
  rationale: O superlativo adverbial reproduz de maneira concisa e enfática a repetição intensificadora de מְאֹד.
theological_decisions:
- issue: Expressão de aliança com נתן + בְּרִית
  choice: Estabelecerei a minha aliança
  alternative: Darei/Porei a minha aliança
  rationale: No contexto, o verbo descreve a instituição ou confirmação da aliança, não a simples transferência de um objeto. A tradução principal comunica o valor idiomático sem determinar além do texto a relação exata entre instituição e confirmação; a nota registra a formulação lexicalmente mais literal.
- issue: Alcance da promessa de multiplicação
  choice: farei você se multiplicar
  alternative: multiplicarei os seus descendentes
  rationale: O hebraico dirige a promessa ao próprio Abrão no singular. Embora a descendência esteja implicada, ela não é introduzida explicitamente na tradução principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” mantém a referência singular explícita e combina naturalmente com “entre mim”; “muitíssimo” preserva a forte ênfase do hebraico sem uma repetição pouco idiomática.
