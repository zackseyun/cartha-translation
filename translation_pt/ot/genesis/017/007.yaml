source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: pt
  text: Estabelecerei minha aliança entre mim e você, e entre a sua descendência depois de você, ao longo de suas gerações, como aliança eterna, para ser Deus para você[a] e para a sua descendência depois de você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “para ser o seu Deus”.'
    reason: lexical_alternative
  - marker: b
    text: “Descendência” traduz um termo hebraico coletivo singular que também pode ser vertido como “semente” ou “descendentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Estabelecerei
  rationale: O hifil de קום com בְּרִית exprime estabelecer ou confirmar uma aliança. “Estabelecerei” é natural, solene e adequado ao contexto.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Preserva diretamente o substantivo בְּרִית e o sufixo possessivo de primeira pessoa.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: entre mim e você e
  rationale: Mantém as partes da aliança e boa parte da repetição relacional do hebraico, sem tornar a frase artificial em português.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: זֶרַע é um singular coletivo. “Descendência” preserva naturalmente em português tanto a forma coletiva quanto a referência aos descendentes, sem a estranheza de “semente” neste contexto.
- source_word: אַחֲרֶיךָ
  choice: depois de você
  rationale: Reproduz a relação temporal e genealógica do original.
- source_word: לְדֹרֹתָם
  choice: por todas as gerações deles
  rationale: Expressa a continuidade ao longo das sucessivas gerações e preserva o referente pronominal masculino plural do hebraico.
- source_word: לִבְרִית עוֹלָם
  choice: como aliança eterna
  rationale: A preposição לְ tem valor predicativo, e עוֹלָם indica duração permanente no contexto da aliança.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: para ser Deus para você
  rationale: Conserva de perto a fórmula relacional hebraica, em vez de substituí-la silenciosamente pela formulação idiomática “ser o seu Deus”.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: e para a sua descendência depois de você
  rationale: Repete de maneira consistente os termos da primeira menção à descendência e mantém o alcance geracional da promessa.
theological_decisions:
- issue: A natureza coletiva e potencialmente representativa de זֶרַע
  choice: a sua descendência
  alternative: a sua semente; os seus descendentes
  rationale: “Descendência” funciona como coletivo singular em português e evita resolver o termo como apenas plural ou como um indivíduo específico, preservando sua amplitude lexical e a tensão canônica.
- issue: A fórmula da relação de aliança
  choice: para ser Deus para você
  alternative: para ser o seu Deus
  rationale: A tradução principal segue mais de perto לִהְיוֹת לְךָ לֵאלֹהִים e mantém sua formulação relacional solene. A alternativa idiomática é registrada em nota, sem acrescentar conteúdo doutrinário.
- issue: A duração da aliança
  choice: aliança eterna
  alternative: aliança perpétua
  rationale: “Eterna” representa naturalmente עוֹלָם neste contexto sem explicar além do que o texto afirma sobre a duração da aliança.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O uso de “você” torna explícita a segunda pessoa singular masculina do hebraico sem recorrer a formas regionais ou arcaizantes. A ordem e a cadência seguem de perto o original, com ajustes mínimos para naturalidade.
