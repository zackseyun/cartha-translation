revisions:
- from: Estabelecerei a minha aliança entre mim e você e a sua descendência depois de você, por todas as gerações deles, como aliança eterna, para ser Deus para você[a] e para a sua descendência depois de você.[b]
  to: Estabelecerei minha aliança entre mim e você, e entre a sua descendência depois de você, ao longo de suas gerações, como aliança eterna, para ser Deus para você[a] e para a sua descendência depois de você.[b]
  rationale: A revisão explicita a segunda ocorrência de “entre”, refletindo mais plenamente a estrutura relacional do hebraico, e substitui uma formulação geracional menos natural por “ao longo de suas gerações”. Não altera o sentido, a ambiguidade coletiva de זֶרַע nem o registro solene do versículo.
