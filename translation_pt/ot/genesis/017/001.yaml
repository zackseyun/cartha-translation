  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: pt
  text: 'Quando Abrão tinha noventa e nove anos, Yahweh apareceu a ele e disse: “Eu sou Deus Todo-Poderoso[a]. Ande diante de mim e seja íntegro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: El Shaddai. O sentido exato de Shaddai é discutido; por isso, o título também é tradicionalmente transliterado em vez de traduzido.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Quando Abrão tinha noventa e nove anos
  rationale: A construção narrativa com וַיְהִי e a expressão idiomática hebraica de idade são vertidas em português natural, preservando a função temporal do início do versículo.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: No nifal, com Yahweh como sujeito e Abrão como destinatário, o verbo indica que Deus se tornou visível ou se manifestou; “apareceu” é a forma direta e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  rationale: Traduz o título divino de modo claro e tradicional, enquanto a nota conserva a forma hebraica e reconhece que o sentido exato de שַׁדַּי é discutido.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Ande diante de mim
  rationale: Preserva a metáfora hebraica de caminhar como modo de viver e a ideia de conduzir a vida na presença de Deus.
- source_word: וֶהְיֵה תָמִים
  choice: e seja íntegro
  rationale: “Íntegro” comunica inteireza moral e lealdade sem sugerir necessariamente perfeição absoluta ou impecabilidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal de Deus. A transliteração “Yahweh” o preserva e evita substituí-lo por um título.
- issue: Sentido do título אֵל שַׁדַּי
  choice: Deus Todo-Poderoso
  alternative: El Shaddai; Deus Shaddai
  rationale: A tradução tradicional comunica uma leitura plausível do título, mas a etimologia e a nuance exata de שַׁדַּי permanecem discutidas; por isso, a forma hebraica é registrada em nota.
- issue: Alcance ético de תָמִים
  choice: íntegro
  alternative: irrepreensível; perfeito; completo
  rationale: Neste contexto de relação e aliança, o termo pode indicar inteireza, integridade ou conduta irrepreensível. “Íntegro” preserva essa força sem resolver o termo como exigência explícita de perfeição absoluta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ande diante de mim” conserva a imagem hebraica sem soar excessivamente arcaico; “seja íntegro” expressa a exigência moral de maneira natural e evita uma interpretação excessiva de perfeição sem pecado.
