  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: pt
  text: Naquele mesmo dia, Abraão e seu filho Ismael foram circuncidados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Naquele mesmo dia
  rationale: A expressão idiomática enfatiza que a ação ocorreu precisamente naquele dia. “Naquele mesmo dia” preserva essa ênfase temporal em português natural.
- source_word: נִמּוֹל
  choice: foram circuncidados
  rationale: Embora a forma hebraica seja morfologicamente singular e passiva, ela precede o sujeito composto “Abraão e Ismael”. O plural em português comunica naturalmente o sentido da construção.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְיִשְׁמָעֵאל
  choice: e Ismael
  rationale: A conjunção e o nome próprio são vertidos segundo o uso corrente em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo de terceira pessoa masculina singular identifica Ismael como filho de Abraão; “seu filho” preserva a relação de modo natural.
