  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: pt
  text: Eu a abençoarei e também darei a você um filho por meio dela. Eu a abençoarei, e ela se tornará nações[a]; reis de povos virão dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela será mãe de nações”. Mais literalmente, o hebraico diz: “ela será/se tornará nações”.'
    reason: Esclarece a construção hebraica incomum e registra uma tradução idiomática possível sem apagar a formulação literal do texto principal.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Eu a abençoarei / Eu a abençoarei
  rationale: Mantém o sentido pactual e teológico de ברך e conserva a repetição enfática do hebraico.
- source_word: וְגַם
  choice: e também
  rationale: Expressa de modo natural em português a força aditiva e enfática da partícula.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: darei a você um filho por meio dela
  rationale: O qatal tem valor futuro no contexto da promessa. “Por meio dela” comunica que Sara dará à luz o filho sem reduzir a expressão a mera procedência espacial.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: ela se tornará nações
  rationale: Preserva a formulação incomum e corporativa do hebraico, sem acrescentar explicitamente “mãe”, embora essa ideia esteja implícita.
- source_word: מַלְכֵי עַמִּים
  choice: reis de povos
  rationale: Reproduz a distinção lexical entre גוֹיִם, “nações”, e עַמִּים, “povos”.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: virão dela
  rationale: Verte naturalmente a expressão de origem e descendência, cujo sentido mais literal é “serão dela”.
theological_decisions:
- issue: A promessa relativa aos descendentes de Sara
  choice: ela se tornará nações; reis de povos virão dela
  alternative: ela será mãe de nações; reis de povos virão dela
  rationale: A redação escolhida conserva a imagem corporativa e a amplitude pactual do texto, sem inserir “mãe”, termo interpretativamente adequado, mas não expresso no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção marcada “se tornará nações” foi mantida deliberadamente por refletir a expressão hebraica e é esclarecida em nota.
