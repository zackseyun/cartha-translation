id: GEN.17.5
reference: Genesis 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: pt
  text: Seu nome não será mais Abrão, mas Abraão, pois eu fiz de você pai de uma multidão de nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pois eu dei você como pai de uma multidão de nações”.'
    reason: alternativa lexical para נְתַתִּיךָ
lexical_decisions:
- source_word: יִקָּרֵא
  choice: será
  rationale: No contexto da atribuição de nome, o nifal de קרא pode ser expresso naturalmente em português pela fórmula nominal “seu nome será”, sem perder o sentido passivo de como ele será chamado.
- source_word: לֹא ... עוֹד
  choice: não ... mais
  rationale: A combinação indica a cessação do nome anterior a partir deste momento; “não será mais” é corrente e clara.
- source_word: שִׁמְךָ
  choice: seu nome
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa masculina singular.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְהָיָה
  choice: mas
  rationale: Embora a conjunção seja formalmente aditiva, o contraste entre o nome anterior e o novo é expresso naturalmente em português por “mas”.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão explicativa para a mudança de nome em registro natural e digno.
- source_word: אַב
  choice: pai
  rationale: Preserva o sentido comum do termo e sua função na explicação do novo nome.
- source_word: הֲמוֹן
  choice: uma multidão
  rationale: Mantém a força nominal de abundância e a associação sonora e conceitual com o nome Abraão.
- source_word: גּוֹיִם
  choice: nações
  rationale: Designa coletividades nacionais ou povos no contexto da aliança; “nações” é a opção mais usual e evita o anacronismo de “gentios”.
- source_word: נְתַתִּיךָ
  choice: eu fiz de você
  rationale: A construção com נתן tem aqui sentido predicativo de constituir ou tornar alguém pai; “fiz de você” é idiomático e preserva o perfeito hebraico como ato divino declarado realizado.
theological_decisions:
- issue: Aspecto concluído da declaração divina
  choice: pois eu fiz de você pai de uma multidão de nações
  alternative: pois farei de você pai de uma multidão de nações
  rationale: O perfeito hebraico נְתַתִּיךָ apresenta a promessa como realidade declarada e estabelecida. A tradução conserva essa tensão, em vez de convertê-la silenciosamente em futuro.
- issue: Sentido predicativo de נְתַתִּיךָ
  choice: fiz de você pai
  alternative: dei você como pai
  rationale: A alternativa mais literal é possível, mas soa pouco natural em português. A formulação escolhida comunica a função constitutiva do verbo sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “seu nome não será mais” é mais natural que uma reprodução rígida de “não será mais chamado o seu nome”. O marcador [a] aparece no texto principal e esclarece a expressão hebraica mais literal.
