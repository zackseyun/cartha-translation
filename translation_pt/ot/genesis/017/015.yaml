  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: pt
  text: 'Então Deus disse a Abraão: “Quanto a Sarai, sua mulher, não chamará sua mulher pelo nome de Sarai, pois Sara é o nome dela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Tradução padrão no contexto, em que o substantivo designa no singular o Deus que fala a Abraão.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: Quanto a Sarai, sua mulher
  rationale: A construção identifica Sarai por sua relação com Abraão; a topicalização portuguesa preserva o foco dado pelo hebraico ao nome.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ שָׂרָי
  choice: você não chamará mais o nome dela de Sarai
  rationale: O imperfeito negativo funciona como determinação divina. “Não chamará mais” torna explícita em português a cessação do nome anterior, implícita no ato de renomear, mantendo a fórmula com “nome”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a proibição e mantém um tom digno e corrente.
- source_word: שָׂרָה שְׁמָהּ
  choice: o nome dela é Sara
  rationale: A oração nominal hebraica declara o novo nome sem verbo futuro explícito; a tradução preserva esse valor declarativo.
theological_decisions:
- issue: Forma da declaração de mudança de nome
  choice: “você não chamará mais o nome dela de Sarai, pois o nome dela é Sara”
  alternative: “não chame o nome dela de Sarai, porque Sara será o nome dela”
  rationale: A opção adotada mantém a proibição solene e traduz a oração nominal final como declaração presente, sem acrescentar um futuro que não está expresso no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sua mulher” preserva o sentido de esposa no registro bíblico sem soar excessivamente técnico. Os nomes distintos Sarai e Sara são mantidos para destacar a renomeação.
