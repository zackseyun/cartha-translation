base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: pt
  text: 'Todo menino de oito dias entre vocês será circuncidado, de geração em geração: tanto o nascido em sua casa como o comprado por prata[a] de qualquer estrangeiro que não seja da tua descendência[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comprado por dinheiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de todo filho de estrangeiro que não é da tua semente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: Aos oito dias de idade
  rationale: Expressa em português natural o idiomatismo hebraico literalmente formulado como “filho de oito dias”, preservando a exigência temporal precisa.
- source_word: יִמּוֹל
  choice: será circuncidado
  rationale: Mantém o sentido passivo do nifal e o tom prescritivo da declaração, sem explicitar um agente que o hebraico não nomeia.
- source_word: לָכֶם כָּל זָכָר
  choice: todo indivíduo do sexo masculino entre vocês
  rationale: “Indivíduo do sexo masculino” abrange com precisão tanto crianças como outros membros masculinos da casa; “entre vocês” representa idiomaticamente לָכֶם.
- source_word: לְדֹרֹתֵיכֶם
  choice: de geração em geração
  rationale: Comunica a continuidade da ordem através das gerações em português claro e corrente.
- source_word: יְלִיד בָּיִת
  choice: o nascido em casa
  rationale: Conserva de perto a imagem hebraica e indica alguém nascido dentro da casa ou unidade doméstica.
- source_word: וּמִקְנַת כֶּסֶף
  choice: o comprado por prata
  rationale: Preserva tanto a ideia de aquisição mediante compra como o termo concreto “prata”, em vez de substituí-lo silenciosamente por “dinheiro”.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: de qualquer estrangeiro
  rationale: Verte em português natural o idiomatismo hebraico literalmente expresso como “de todo filho de estrangeiro”, sem perder a referência à origem estrangeira.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: que não seja da sua descendência
  rationale: “Descendência” transmite o sentido genealógico de זֶרַע sem recorrer ao literalismo potencialmente obscuro “semente”; a formulação não acrescenta conclusões teológicas.
theological_decisions:
- issue: Alcance da ordem de circuncisão dentro da casa da aliança
  choice: A ordem inclui todo indivíduo do sexo masculino entre os destinatários, inclusive o nascido em casa e o adquirido por compra, ainda que não pertença à descendência de Abraão.
  alternative: Restringir a ordem principalmente ou exclusivamente aos descendentes biológicos de Abraão.
  rationale: O hebraico estende expressamente a ordem aos nascidos na casa e aos adquiridos por prata que não são da descendência de Abraão. A tradução conserva essa amplitude sem deduzir implicações doutrinárias posteriores.
- issue: Referente da oração אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: Manter em português a ligação sintática próxima com “estrangeiro”, como na construção fornecida, sem explicação interpretativa no corpo do versículo.
  alternative: Reformular explicitamente a oração para fazê-la qualificar a pessoa comprada, eliminando toda possível ambiguidade de referente.
  rationale: A sequência hebraica admite tensão sintática na identificação do referente imediato. A redação escolhida permanece próxima da ordem da fonte, enquanto a nota registra sua forma literal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A expressão “indivíduo do sexo masculino” evita que “homem” pareça limitar a ordem a adultos. Conservou-se “prata” no texto principal por sua correspondência concreta com כֶּסֶף, oferecendo “dinheiro” em nota. Os marcadores [a], [b] e [c] aparecem junto aos trechos correspondentes.
