revisions:
- from: Aos oito dias de idade[a], todo indivíduo do sexo masculino entre vocês será circuncidado, de geração em geração, tanto o nascido em casa como o comprado por prata[b] de qualquer estrangeiro que não seja da sua descendência[c].
  to: 'Todo menino de oito dias entre vocês será circuncidado, de geração em geração: tanto o nascido em sua casa como o comprado por prata[a] de qualquer estrangeiro que não seja da tua descendência[b].'
  rationale: A revisão substitui uma expressão clínica por português mais natural e adequado ao contexto do oitavo dia, explicita «em sua casa» para יליד בית e restaura «tua descendência», preservando a mudança para o singular no hebraico. As notas mantêm as alternativas e a formulação literal pertinentes; a nota sobre «filho de oito dias» é dispensável, pois «menino de oito dias» já reflete de perto o idiomatismo hebraico sem perda relevante.
