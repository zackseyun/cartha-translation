base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: pt
  text: E o homem incircunciso que não for circuncidado na carne de seu prepúcio — essa pessoa será cortada do seu povo[a][b]; ele quebrou a minha aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «essa alma será cortada do seu povo». O hebraico usa um termo que pode significar «alma», «vida» ou «pessoa», juntamente com a expressão de sanção da aliança «ser cortada».'
    reason: lexical_alternative
  - marker: b
    text: «Cortada» pode indicar um severo juízo da aliança, incluindo exclusão da comunidade ou morte, conforme o contexto; este versículo não especifica mais.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: o homem incircunciso
  rationale: עָרֵל designa quem não foi circuncidado, e זָכָר especifica uma pessoa do sexo masculino. «Homem incircunciso» é claro e natural em português no contexto desta norma da aliança.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: que não for circuncidado
  rationale: O nifal de מול tem sentido passivo ou reflexivo. O futuro do subjuntivo português expressa naturalmente a condição geral de uma formulação legal.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: na carne do seu prepúcio
  rationale: Mantém a formulação concreta e anatomicamente específica do hebraico, sem reduzi-la à mera repetição de «incircunciso».
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa será eliminada
  rationale: נפש refere-se aqui à pessoa submetida à sanção, não necessariamente a uma parte imaterial do ser humano. «Será eliminada» conserva a gravidade do idiomatismo כרת sem determinar por si só o modo exato da sanção.
- source_word: מֵעַמֶּיהָ
  choice: do seu povo
  rationale: Embora o sufixo hebraico concorde gramaticalmente com נפש, o referente é o homem incircunciso. «Seu povo» preserva עם como termo comunitário da aliança.
- source_word: אֶת בְּרִיתִי
  choice: a minha aliança
  rationale: «Aliança» é o equivalente consagrado e contextualmente central para ברית em Gênesis 17.
- source_word: הֵפַר
  choice: ele quebrou
  rationale: O verbo הפר pode significar quebrar, violar ou invalidar uma aliança. «Quebrou» é corrente, claro e mantém a força da infração.
theological_decisions:
- issue: Sentido da sanção da aliança expressa por כרת
  choice: será eliminada do seu povo
  alternative: será excluída da comunidade; será morta
  rationale: O versículo apresenta uma sanção grave, mas não esclarece se ela consiste especificamente em exclusão comunitária, morte ou outro juízo. A tradução e a nota preservam essa tensão.
- issue: Tradução de נפש
  choice: pessoa
  alternative: alma
  rationale: Neste contexto jurídico, נפש designa o indivíduo sujeito à sanção. «Pessoa» evita impor ao texto uma antropologia dicotômica que o termo não exige aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação legal foi mantida clara; os termos concretos «carne» e «prepúcio» e o vocabulário teológico «aliança» foram preservados. Os marcadores seguem ordem sequencial no texto.
