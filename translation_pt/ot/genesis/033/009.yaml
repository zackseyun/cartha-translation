  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: pt
  text: 'Mas Esaú disse[a]: “Eu tenho muito, meu irmão; fique para você o que é seu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Esaú disse: ‘Eu tenho o bastante, meu irmão; fique para você o que lhe pertence.’”'
    reason: Alternativas lexicais possíveis para וַיֹּאמֶר, יֶשׁ לִי רָב e אֲשֶׁר לָךְ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “mas” expressa o contraste leve da recusa de Esaú diante da oferta de Jacó.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יֶשׁ לִי רָב
  choice: Eu tenho muito
  rationale: A construção idiomática expressa posse, e רָב denota quantidade ou abundância. “Tenho muito” preserva esse sentido sem reduzi-lo apenas à ideia de suficiência.
- source_word: אָחִי
  choice: meu irmão
  rationale: Mantém o vocativo com o sufixo de primeira pessoa e o tom relacional da fala de Esaú.
- source_word: יְהִי לְךָ
  choice: fique para você
  rationale: 'O jussivo de היה tem aqui força permissiva e cortês: Esaú diz a Jacó que conserve seus bens. A formulação é natural em português e não acrescenta a noção lexicalmente explícita de “permanecer”.'
- source_word: אֲשֶׁר לָךְ
  choice: o que é seu
  rationale: Reproduz de maneira concisa e natural a expressão relativa que identifica aquilo que pertence a Jacó.
