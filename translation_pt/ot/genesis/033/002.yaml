  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: pt
  text: Ele colocou as servas e seus filhos à frente[a], Lia e seus filhos atrás deles, e Raquel e José por último.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as escravas”; o termo hebraico pode designar mulheres escravizadas ou servas domésticas de condição social inferior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ele pôs
  rationale: O verbo שׂוּם significa pôr, colocar ou posicionar; “pôs” é natural e descreve com clareza a organização dos grupos.
- source_word: הַשְּׁפָחוֹת
  choice: as servas
  rationale: שִׁפְחָה designa mulheres em condição servil. “Servas” é conciso e corrente, sem interpretar o termo especificamente como “concubinas”; a possível nuance de escravidão é preservada em nota.
- source_word: יַלְדֵיהֶן
  choice: os filhos delas
  rationale: יֶלֶד é um termo amplo para filhos ou crianças. Em português, “filhos” é natural para indicar a descendência de cada mulher e não restringe necessariamente o referente a homens.
- source_word: רִאשֹׁנָה
  choice: na frente
  rationale: A forma adverbial indica a primeira posição na disposição espacial. “Na frente” torna explícita a organização dos grupos no contexto.
- source_word: לֵאָה
  choice: Lia
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico לֵאָה em português.
- source_word: וִילָדֶיהָ
  choice: e seus filhos
  rationale: Mantém o sentido amplo de יֶלֶד e reproduz naturalmente a coordenação hebraica.
- source_word: אַחֲרֹנִים
  choice: depois
  rationale: Na posição intermediária da sequência, o termo indica que Lia e seus filhos vinham atrás do primeiro grupo, mas antes do último. “Depois” evita a impressão incorreta de que eram os últimos.
- source_word: רָחֵל
  choice: Raquel
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico רָחֵל em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יוֹסֵף em português.
- source_word: אַחֲרֹנִים
  choice: por último
  rationale: Na terceira e última posição, o termo indica claramente que Raquel e José ficaram atrás dos demais grupos.
