  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi expressa por “na frente”, “depois” e “por último” para comunicar naturalmente a disposição espacial em três grupos. Os nomes seguem as formas bíblicas portuguesas consagradas.
