base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: pt
  text: 'Jacó disse: “Não, por favor. Se encontrei favor aos seus olhos, aceite da minha mão o meu presente[a], pois, ao ver o seu rosto, foi como se eu tivesse visto o rosto de Deus[b], e você me acolheu favoravelmente[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «minha dádiva». O termo hebraico pode indicar presente, tributo ou oferta; aqui se refere ao presente conciliatório de Jacó a Esaú.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, «o rosto de um deus»; contudo, neste contexto, «Deus» corresponde melhor ao recente encontro de Jacó em Peniel (Gn 32:30).
    reason: alternative_reading
  - marker: c
    text: Ou «você me aceitou»; também pode ser entendido como «você se agradou de mim». O verbo hebraico expressa acolhimento ou aceitação favorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן
  choice: favor
  rationale: Preserva a expressão relacional de aceitação no idioma hebraico sem introduzir a carga teológica que «graça» poderia sugerir.
- source_word: בְּעֵינֶיךָ
  choice: aos seus olhos
  rationale: Mantém a imagem concreta do hebraico e constitui uma expressão natural e compreensível em português.
- source_word: מִנְחָתִי
  choice: o meu presente
  rationale: No contexto, designa o presente conciliatório que Jacó pede a Esaú que aceite; «oferta» poderia sugerir indevidamente um ato de culto.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Conserva a expressão concreta da entrega pessoal, que é inteligível e digna em português.
- source_word: כִּי עַל־כֵּן
  choice: pois
  rationale: Introduz com naturalidade a razão apresentada por Jacó, sem reproduzir de modo artificial a construção hebraica.
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת
  choice: ver o seu rosto foi como ver
  rationale: Expressa o acontecimento já ocorrido e preserva o paralelismo da comparação hebraica em português corrente.
- source_word: פְּנֵי אֱלֹהִים
  choice: o rosto de Deus
  rationale: Mantém a expressão teologicamente marcante e corresponde melhor ao contexto imediato do encontro de Jacó em Peniel.
- source_word: וַתִּרְצֵנִי
  choice: você me recebeu favoravelmente
  rationale: Comunica a acolhida benevolente de Esaú e conserva a ligação semântica com o «favor» mencionado antes.
- source_word: אַל נָא אִם נָא
  choice: Não, por favor. Se
  rationale: Reproduz a recusa cortês, porém insistente, seguida do apelo de Jacó, com pontuação natural em português.
theological_decisions:
- issue: Referente de אֱלֹהִים na comparação
  choice: Deus
  alternative: um deus
  rationale: Embora אֱלֹהִים possa ter sentido mais amplo em outros contextos, a narrativa imediatamente anterior sobre Peniel, onde Jacó afirma ter visto Deus face a face, favorece fortemente o referente singular «Deus». A comparação permanece intacta, sem atenuar sua tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. A colocação «aceite da minha mão» preserva a imagem hebraica sem soar arcaica; «você» oferece clareza internacional suficiente no discurso direto e evita ambiguidades verbais.
