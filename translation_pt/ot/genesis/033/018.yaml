  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: pt
  text: Jacó chegou em segurança à cidade de Siquém[a], que fica na terra de Canaã, quando veio de Padã-Arã, e acampou diante da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jacó chegou a Salém, cidade de Siquém”. O hebraico שָׁלֵם (shalém) pode ser entendido como “em segurança”, “em paz”, ou como o nome do lugar “Salém”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O wayyiqtol de בוא descreve a chegada de Jacó; “chegou” é a forma narrativa mais natural em português.
- source_word: שָׁלֵם
  choice: em segurança
  rationale: Lido adverbialmente, indica que Jacó chegou são e salvo, em paz. A possível leitura como topônimo é preservada em nota.
- source_word: עִיר שְׁכֶם
  choice: à cidade de Siquém
  rationale: A cadeia construta designa a cidade chamada Siquém; a preposição “a”, exigida por “chegou”, recebe crase diante do artigo.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: que fica na terra de Canaã
  rationale: Expressa naturalmente em português a oração relativa de localização geográfica.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: quando veio de Padã-Arã
  rationale: A preposição ב com infinitivo construto e sufixo tem valor temporal; esta formulação preserva o sentido e a repetição do verbo בוא no hebraico sem soar excessivamente pesada.
- source_word: פַּדַּן אֲרָם
  choice: Padã-Arã
  rationale: Transliteração portuguesa tradicional e inteligível do nome geográfico.
- source_word: וַיִּחַן
  choice: acampou
  rationale: O Qal de חנה neste contexto significa estabelecer acampamento.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: diante da cidade
  rationale: A expressão idiomática indica a área em frente à cidade; “diante da cidade” mantém de modo conciso a relação espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva a ambiguidade genuína de שָׁלֵם em nota e mantém a sequência temporal do hebraico. Não foi incluída uma nota separada para בְּבֹאוֹ, pois “quando veio” já traduz diretamente sua função temporal e não há aqui uma variante substantiva.
