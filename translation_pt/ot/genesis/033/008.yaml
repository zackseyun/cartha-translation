base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: pt
  text: 'E ele perguntou: “Para que serve todo esse grupo que encontrei?” Jacó respondeu: “Para alcançar o favor do meu senhor.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para encontrar favor aos olhos do meu senhor”, expressão que significa obter sua consideração favorável.'
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: Para que serve
  rationale: A expressão idiomática pergunta pela finalidade ou intenção do grupo enviado por Jacó, não pela identidade de alguém.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: todo esse grupo
  rationale: Embora מַחֲנֶה possa significar literalmente “acampamento”, aqui designa coletivamente os rebanhos e servos que Jacó enviou adiante; “grupo” comunica isso com naturalidade sem especificar além do texto.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: que encontrei
  rationale: Reproduz de modo direto o sentido de פָּגַשׁ no contexto do encontro de Esaú com o grupo enviado à frente.
- source_word: לִמְצֹא חֵן
  choice: Para alcançar o favor
  rationale: O infinitivo expressa finalidade. “Alcançar o favor” transmite em português corrente o propósito de obter acolhimento favorável.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: do meu senhor
  rationale: Traduz naturalmente a expressão hebraica de consideração favorável e preserva o tratamento deferente de Jacó a Esaú; “senhor” aqui não é título divino.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com nomes explícitos nos turnos de fala para evitar ambiguidade narrativa. A pergunta foi vertida idiomaticamente como uma indagação de finalidade; “grupo” mantém a referência coletiva sem sugerir um acampamento físico.
