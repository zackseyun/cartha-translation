  source_fidelity: O rascunho transmite corretamente a compra, os vendedores (os filhos de Hamor), a identificação de Hamor como pai de Siquém, o local em que Jacó havia armado a tenda e o preço em quesitas. A transliteração e a nota preservam adequadamente a incerteza lexical de קְשִׂיטָה. A revisão apenas reposiciona os complementos para refletir com mais clareza que a parcela do campo é o objeto comprado e conserva o advérbio locativo "ali" (שָׁם).
  naturalness: A ordem do rascunho — "comprou dos filhos ... por cem quesitas ... a parte do campo" — posterga excessivamente o objeto direto e soa menos fluida em português. Colocar a parcela comprada logo após o verbo produz uma frase moderna, clara e natural.
  terminology: '"Parcela do campo" comunica bem o sentido de חֶלְקַת הַשָּׂדֶה como uma extensão delimitada de terra. "Quesitas" e a nota correspondente evitam atribuir à unidade de pagamento uma equivalência indevidamente precisa. Os nomes Hamor e Siquém estão consistentes.'
