base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: pt
  text: E comprou dos filhos de Hamor, pai de Siquém, a parcela do campo onde havia armado a sua tenda, ali, por cem quesitas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico quesita; antiga unidade ou meio de pagamento cujo valor exato é desconhecido, tradicionalmente traduzido de diversas maneiras, como “peças de dinheiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: comprou
  rationale: Neste contexto de transação de terra, קנה indica naturalmente a compra, não apenas uma aquisição genérica.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: a parte do campo
  rationale: חֶלְקָה designa uma parte ou parcela delimitada; esta formulação preserva a imagem do campo sem acrescentar precisão ausente no hebraico.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: onde havia armado a sua tenda
  rationale: נטה com אֹהֶל é a expressão habitual para armar uma tenda; o mais-que-perfeito indica com naturalidade que isso ocorreu antes da compra.
- source_word: מִיַּד בְּנֵי חֲמוֹר
  choice: dos filhos de Hamor
  rationale: Embora מִיַּד signifique literalmente “da mão de”, em português a preposição “de” comunica com naturalidade a procedência da propriedade na transação, sem um hebraísmo desnecessário.
- source_word: אֲבִי שְׁכֶם
  choice: pai de Siquém
  rationale: A aposição identifica Hamor como pai do homem chamado Siquém, conforme o contexto narrativo.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: por cem quesitas
  rationale: A expressão indica o preço da compra. Como o valor e a natureza exata de קְשִׂיטָה são incertos, a transliteração adaptada à ortografia portuguesa evita falsa precisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A construção literal “da mão dos filhos de Hamor” foi evitada por soar artificial em português; o sentido de procedência na compra permanece explícito. A forma “quesitas” conserva o termo antigo e sua incerteza, esclarecida em nota.
