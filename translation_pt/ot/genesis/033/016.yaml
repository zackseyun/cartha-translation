lexical_decisions:
- source_word: וַיָּשָׁב
  choice: tomou o caminho de volta
  rationale: O verbo שׁוב descreve o retorno de Esaú. Em combinação com לְדַרְכּוֹ, a expressão portuguesa comunica com naturalidade que ele iniciou ou retomou a viagem de volta.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Tradução direta e natural da expressão temporal hebraica, sem acrescentar a ideia enfática de 'mesmo dia'.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְדַרְכּוֹ
  choice: o caminho
  rationale: Integrado à expressão 'tomou o caminho de volta', preserva a referência à viagem ou rota de Esaú em português corrente.
- source_word: שֵׂעִירָה
  choice: para Seir
  rationale: O ה direcional indica movimento em direção a Seir, expresso naturalmente pela preposição 'para'.
