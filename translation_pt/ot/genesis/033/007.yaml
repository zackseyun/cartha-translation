  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: pt
  text: Lia também se aproximou, acompanhada de seus filhos, e eles se curvaram. Depois, José se aproximou com Raquel, e eles se curvaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou «se prostraram»; o verbo hebraico pode indicar um gesto profundo de reverência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: se aproximaram
  rationale: O verbo נגשׁ indica aproximar-se ou chegar perto. «Se aproximaram» é natural em português e preserva o movimento em direção a Esaú sem especificar indevidamente a maneira.
- source_word: גַּם
  choice: também
  rationale: גַּם acrescenta Lia e seus filhos à sequência dos grupos que se apresentam diante de Esaú; «também» expressa claramente essa progressão.
- source_word: וִילָדֶיהָ
  choice: e seus filhos
  rationale: יְלָדִים pode designar crianças ou descendentes de ambos os sexos. Neste contexto imediato, porém, refere-se aos filhos de Lia que acompanham a mãe; «filhos» é a formulação portuguesa natural e pode funcionar coletivamente.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: se curvaram
  rationale: A forma verbal de שׁחה descreve um gesto de reverência. «Se curvaram» é corrente, digno e não determina além do necessário se houve prostração completa.
- source_word: וְאַחַר
  choice: Depois
  rationale: O termo marca a etapa seguinte da apresentação. «Depois» transmite a sequência temporal de modo simples e natural.
- source_word: יוֹסֵף וְרָחֵל
  choice: José e Raquel
  rationale: Mantém-se a ordem dos nomes no hebraico, sem reorganizá-los segundo expectativas culturais ou familiares.
