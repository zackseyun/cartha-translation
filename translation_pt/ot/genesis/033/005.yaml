base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: pt
  text: 'Ele ergueu os olhos e viu as mulheres e os filhos. Então Esaú perguntou: “Quem são estes que estão com você?”[a] Jacó respondeu: “São os filhos que Deus bondosamente concedeu ao seu servo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Quem são estes para você?”. A expressão hebraica pergunta pela identidade ou relação das pessoas que acompanhavam Jacó.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “os filhos que Deus deu ao seu servo”. O verbo hebraico inclui a ideia de demonstrar favor ou agir bondosamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: ergueu os olhos
  rationale: Preserva a expressão narrativa hebraica, cujo sentido é levantar o olhar, sem deixar de ser clara em português atual.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: Mantém o termo geral do hebraico, sem especificá-las como esposas ou concubinas.
- source_word: הַיְלָדִים
  choice: os filhos
  rationale: No contexto, refere-se aos descendentes de Jacó. “Filhos” é natural em português e pode ser mantido nas duas ocorrências.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Quem são estes que estão com você?
  rationale: Expressa naturalmente a pergunta pela identidade das pessoas que acompanhavam Jacó, enquanto a nota registra a construção hebraica mais literal.
- source_word: חָנַן
  choice: bondosamente concedeu
  rationale: Conserva tanto a ideia de dar quanto a nuance de favor e benevolência presente no verbo hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a tradução normal neste contexto, em que o referente é singular.
- source_word: עַבְדֶּךָ
  choice: seu servo
  rationale: Retrata a forma respeitosa e deferente com que Jacó se refere a si mesmo diante de Esaú, sem sugerir indevidamente escravidão como condição jurídica.
theological_decisions:
- issue: A nuance do favor divino na resposta de Jacó
  choice: Deus “bondosamente concedeu” os filhos
  alternative: Deus “deu” os filhos
  rationale: O verbo חנן comunica favor ou benevolência, de modo que a tradução preserva essa nuance sem acrescentar uma formulação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a textura narrativa de “ergueu os olhos”, evita especificar “mulheres” além do hebraico e usa “bondosamente concedeu” para comunicar de modo natural a nuance de favor divino.
