  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: pt
  text: 'Então Esaú disse: “Por favor, permita-me deixar com você alguns dos homens que estão comigo.” Mas Jacó respondeu: “Para que isso? Que eu encontre favor aos olhos do meu senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: Por favor, deixe-me deixar
  rationale: Expressa o cohortativo com נָא como pedido cortês e preserva a ideia de fazer alguns homens permanecerem com Jacó.
- source_word: מִן הָעָם
  choice: alguns dos homens
  rationale: Neste contexto, הָעָם designa os integrantes do séquito de Esaú, não um povo ou nação; “homens” é natural e contextual.
- source_word: לָמָּה זֶּה
  choice: Para que isso?
  rationale: Mantém a pergunta breve e idiomática, com o sentido contextual de recusar a necessidade da oferta.
- source_word: אֶמְצָא חֵן בְּעֵינֵי
  choice: Basta que eu encontre favor aos olhos de
  rationale: Preserva a expressão hebraica tradicional e entende a forma volitiva como desejo suficiente em contraste com a escolta oferecida.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém a forma respeitosa com que Jacó se dirige a Esaú, sem lhe atribuir sentido divino.
theological_decisions:
- issue: Identidade do segundo falante
  choice: Mas Jacó respondeu
  alternative: Mas ele respondeu
  rationale: O hebraico usa apenas “ele disse”, mas o contexto identifica inequivocamente Jacó; explicitar o nome evita ambiguidade em português sem alterar o sentido.
- issue: Sentido da resposta final de Jacó
  choice: Basta que eu encontre favor aos olhos do meu senhor
  alternative: Que eu encontre favor aos olhos do meu senhor
  rationale: “Basta” torna explícita a relação pragmática entre a recusa da oferta e o desejo de conservar a boa vontade de Esaú, sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição “deixe-me deixar” reflete o verbo hebraico, embora soe levemente marcada; foi mantida para comunicar com precisão que Esaú propõe deixar parte de seu séquito com Jacó.
