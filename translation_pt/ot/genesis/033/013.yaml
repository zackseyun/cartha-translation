  - severity: low
    issue: “Ovelhas e vacas que amamentam” pode ser levemente mais fluente.
    rationale: Acrescentar “as suas crias” torna inequívoco o objeto da amamentação e melhora a naturalidade, sem interpretar além do hebraico.
