  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: pt
  text: 'Mas Jacó lhe disse: “Meu senhor sabe que as crianças são frágeis e que as ovelhas e as vacas que amamentam as suas crias estão sob os meus cuidados.[a] Se forem forçadas a avançar depressa mesmo por um só dia, todo o rebanho morrerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ovelhas e as vacas com crias que mamam são responsabilidade minha”. A expressão hebraica é idiomática e reúne a ideia de que os animais estão amamentando e a de que seu cuidado recai sobre Jacó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É um título humano de deferência dirigido a Esaú, não um nome divino; preserva a cortesia e a hierarquia social da cena.
- source_word: הַיְלָדִים רַכִּים
  choice: as crianças são frágeis
  rationale: רַכִּים expressa ternura, delicadeza e vulnerabilidade; “frágeis” comunica de modo natural a limitação física das crianças durante a viagem.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: as ovelhas e as vacas
  rationale: Os substantivos coletivos designam o gado miúdo, sobretudo ovelhas e cabras, e o gado bovino. A formulação concreta é clara em português, embora “ovelhas” represente de modo simplificado o primeiro coletivo.
- source_word: עָלוֹת עָלָי
  choice: que amamentam estão sob os meus cuidados
  rationale: A expressão difícil combina provavelmente a condição de fêmeas que amamentam com a responsabilidade que recai sobre Jacó; a tradução preserva os dois aspectos sem literalismo obscuro.
- source_word: וּדְפָקוּם
  choice: Se forem forçadas a avançar depressa
  rationale: דפק indica conduzir ou impelir os animais com dureza. A forma passiva mantém indefinido o agente e explicita a velocidade excessiva no contexto da jornada.
- source_word: יוֹם אֶחָד
  choice: mesmo por um só dia
  rationale: A expressão indica duração; “mesmo por um só dia” ressalta naturalmente que tamanha exigência seria fatal em pouco tempo.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: todo o rebanho morrerá
  rationale: O coletivo singular é retomado de maneira abrangente. “Todo o rebanho” soa natural e mantém a gravidade da consequência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome “Jacó” explicita o sujeito da fala, expresso apenas pelo contexto em hebraico, e evita a ambiguidade pronominal. A nota preserva a dificuldade lexical de עָלוֹת עָלָי.
