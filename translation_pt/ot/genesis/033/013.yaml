  source_fidelity: A tradução transmite corretamente a fala deferente de Jacó, a vulnerabilidade das crianças, a condição das fêmeas com crias e a consequência de forçar a marcha. A expressão hebraica עָלוֹת עָלָי é difícil; a solução deve conservar tanto a amamentação quanto a responsabilidade de Jacó.
