base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: pt
  text: “Por favor, aceite o meu presente, que foi trazido para você, pois Deus me tratou com bondade, e eu tenho tudo.” Jacó insistiu, e Esaú aceitou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: meu presente
  rationale: Embora o sentido básico seja “minha bênção”, no contexto designa o presente oferecido por Jacó a Esaú; “presente” comunica naturalmente a função contextual sem sugerir que Jacó esteja transferindo a bênção patriarcal.
- source_word: חַנַּנִי
  choice: me tratou com bondade
  rationale: Expressa a ação graciosa e favorável de Deus para com Jacó em português corrente, preservando a referência explícita a Deus.
- source_word: יֶשׁ לִי כֹל
  choice: eu tenho tudo de que preciso
  rationale: O hebraico diz literalmente “tenho tudo”; a formulação deixa claro o sentido contextual de suficiência, sem alegar posse universal.
- source_word: וַיִּפְצַר בּוֹ
  choice: Jacó insistiu
  rationale: O verbo indica insistência ou pressão persistente; os nomes explicitam os referentes pronominais para evitar ambiguidade pouco natural em português.
- source_word: וַיִּקָּח
  choice: Esaú aceitou
  rationale: Neste contexto, “tomou” significa aceitar o presente; o nome torna o referente inequívoco.
theological_decisions:
- issue: Relação entre בִּרְכָתִי e a bênção patriarcal anteriormente disputada
  choice: meu presente
  alternative: minha bênção
  rationale: O contexto imediato é a aceitação dos bens enviados a Esaú. A tradução evita impor a ideia teológica de transferência ou devolução da bênção patriarcal, embora reconheça que o termo hebraico também pode significar literalmente “bênção”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” conforme o destinatário singular e explicita Jacó e Esaú na última oração para clareza narrativa.
