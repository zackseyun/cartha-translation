  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: pt
  text: 'Então Esaú disse: “Vamos partir e seguir viagem; eu irei à sua frente[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao seu lado” ou “com você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Esaú disse
  rationale: O waw consecutivo faz a narrativa avançar. O sujeito explícito “Esaú”, recuperado do contexto imediato, evita ambiguidade em português sem alterar o sentido.
- source_word: נִסְעָה
  choice: Vamos partir
  rationale: O coortativo na primeira pessoa do plural expressa uma proposta ou exortação conjunta; “vamos partir” é natural e adequado ao contexto de viagem.
- source_word: וְנֵלֵכָה
  choice: e seguir viagem
  rationale: O verbo הלך aqui descreve o prosseguimento da jornada. A expressão evita a redundância pouco natural de “partir e ir”, preservando os dois verbos coordenados.
- source_word: וְאֵלְכָה
  choice: eu irei
  rationale: A forma na primeira pessoa do singular, após a proposta conjunta, apresenta a disposição de Esaú de acompanhar ou conduzir Jacó.
- source_word: לְנֶגְדֶּךָ
  choice: ao seu lado
  rationale: נגד pode indicar posição diante de alguém, à sua frente ou em correspondência com ele. No contexto da viagem, “ao seu lado” comunica naturalmente a oferta de acompanhamento, enquanto a alternativa espacial “à sua frente” é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Seguir viagem” reproduz de modo idiomático a sequência de verbos de deslocamento, e a nota conserva a ambiguidade espacial de לְנֶגְדֶּךָ.
