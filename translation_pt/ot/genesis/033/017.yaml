    rationale: O termo hebraico designa coletivamente os animais de criação/posse de Jacó, não necessariamente um único rebanho. «Seus animais» é mais inclusivo e idiomático.
  - severity: low
    issue: A nota diz apenas que Sucote «soa como» a palavra hebraica.
    rationale: O jogo de palavras é uma correspondência lexical entre o nome e o plural hebraico para abrigos/cabanas; a nota pode expressá-la com maior precisão.
