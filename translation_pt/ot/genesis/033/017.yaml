  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: pt
  text: Jacó seguiu viagem até Sucote[a]. Ali construiu uma casa para si e fez abrigos para seus animais. Por isso, deu ao lugar o nome de Sucote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Sucote corresponde à palavra hebraica para “abrigos” ou “cabanas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע סֻכֹּתָה
  choice: seguiu viagem para Sucote
  rationale: O verbo נָסַע indica partir ou deslocar-se, e o he direcional em סֻכֹּתָה marca o destino. “Seguiu viagem para” é natural no fluxo narrativo e não afirma mais do que o hebraico.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: construiu uma casa para si
  rationale: Reproduz claramente tanto a construção da moradia quanto o dativo לוֹ, que indica o próprio Jacó como beneficiário.
- source_word: מִקְנֵהוּ
  choice: o seu rebanho
  rationale: מִקְנֶה designa coletivamente os animais possuídos. “Rebanho” é corrente e abrangente em português neste contexto, sem restringir a referência apenas a gado bovino.
- source_word: עָשָׂה סֻכֹּת
  choice: fez abrigos
  rationale: סֻכּוֹת são estruturas cobertas ou abrigos, aqui destinados aos animais. “Abrigos” comunica sua função com clareza e permite explicar em nota o jogo de palavras com o topônimo.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo direto e contemporâneo a relação causal introduzida pela fórmula hebraica.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: deu ao lugar o nome de
  rationale: Verte naturalmente em português a fórmula hebraica literal “chamou o nome do lugar”, preservando seu sentido de nomeação.
- source_word: סֻכּוֹת
  choice: Sucote
  rationale: O nome geográfico é transliterado segundo a forma tradicional em português; sua ligação sonora e etimológica com o substantivo “abrigos” é preservada por nota.
