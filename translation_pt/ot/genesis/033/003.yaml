  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: pt
  text: Ele mesmo passou à frente deles e se curvou até o chão sete vezes[a], até chegar perto de seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prostrou”; o verbo hebraico pode indicar um gesto completo de reverência, com o corpo estendido ou profundamente inclinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ele mesmo
  rationale: O pronome independente dá ênfase ao sujeito e destaca que o próprio Jacó tomou a dianteira.
- source_word: עָבַר לִפְנֵיהֶם
  choice: passou à frente deles
  rationale: No contexto, a expressão indica que Jacó avançou para ocupar a posição diante de sua família; a formulação é natural e preserva a imagem do movimento.
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou
  rationale: O verbo pode indicar inclinação profunda ou prostração em sinal de deferência. A escolha comunica o gesto sem o definir como adoração.
- source_word: אַרְצָה
  choice: até o chão
  rationale: A forma direcional descreve o movimento em direção ao chão e esclarece a profundidade do gesto.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Tradução direta da expressão numérica.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: até chegar perto de seu irmão
  rationale: A construção marca o limite do movimento e dos gestos repetidos enquanto Jacó se aproximava do irmão, sem reproduzir de modo artificial o segundo עַד.
theological_decisions:
- issue: Natureza do gesto de Jacó diante de Esaú
  choice: se curvou até o chão
  alternative: se prostrou; prestou homenagem
  rationale: O hebraico descreve um gesto corporal de deferência que pode ter diferentes usos. A tradução evita classificá-lo especificamente como adoração ou atribuir-lhe uma intenção teológica não explicitada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ele mesmo” conserva a ênfase do hebraico; “passou à frente” mantém o movimento narrativo, e “se curvou até o chão” preserva a concretude do gesto sem impor uma interpretação religiosa.
