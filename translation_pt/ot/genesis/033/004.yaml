base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: pt
  text: Esaú correu ao encontro dele, abraçou-o, lançou-se ao seu pescoço, beijou-o[a], e os dois choraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No Texto Massorético, a palavra traduzida como “beijou-o” traz pontos incomuns sobre suas letras. Alguns intérpretes entendem essa marca como indicação de dúvida ou de ênfase, mas o sentido simples do hebraico aqui é “beijou-o”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: correu
  rationale: O verbo רוץ expressa correr e preserva o movimento rápido e repentino da narrativa.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: A expressão לקראת indica ir ao encontro de alguém; esta formulação é natural e relacional em português.
- source_word: וַיְחַבְּקֵהוּ
  choice: abraçou-o
  rationale: חבק significa abraçar; a escolha é clara, digna e natural no português moderno.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: lançou-se ao seu pescoço
  rationale: Mantém a imagem vívida da expressão hebraica sem a estranheza que uma versão estritamente literal, como 'caiu sobre o pescoço dele', teria em português.
- source_word: וַיִּשָּׁקֵהוּ
  choice: beijou-o
  rationale: Neste contexto, נשק significa beijar. A tradução direta preserva o sentido simples, enquanto a marca massorética incomum é registrada em nota.
- source_word: וַיִּבְכּוּ
  choice: os dois choraram
  rationale: O verbo está no plural e se refere a Esaú e Jacó; 'os dois' explicita naturalmente os participantes sem alterar o sentido.
theological_decisions:
- issue: Interpretação das ações de Esaú para com Jacó
  choice: Apresentar a sequência em seu sentido direto, como gestos de reconciliação e afeto, sem acrescentar suspeita.
  alternative: Interpretar o beijo de modo suspeito ou irônico com base em tradições interpretativas posteriores.
  rationale: A narrativa hebraica reúne rapidamente vários verbos de afeição. A tradução deve conservar esse sentido manifesto e deixar qualquer questão suscitada pela pontuação massorética para a nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência ágil de ações foi preservada; empregou-se colocação pronominal compatível com o registro narrativo bíblico contemporâneo.
