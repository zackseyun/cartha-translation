    rationale: O vav narrativo de וַיַּחַץ simplesmente avança a narrativa; embora a divisão ocorra em resposta à chegada de Esaú, o texto não formula a relação como «por isso».
  - severity: low
    issue: O valor apresentativo de וְהִנֵּה fica pouco visível em «viu que».
    rationale: A construção é possível em português, mas não conserva tão bem a atenção vívida dirigida à aproximação de Esaú. Os dois-pontos após «viu» permitem expressar essa função de modo natural.
  revised_text: 'Então Jacó levantou os olhos e viu: Esaú vinha, acompanhado de quatrocentos homens. Então distribuiu os filhos entre Lia, Raquel e as duas servas.'
