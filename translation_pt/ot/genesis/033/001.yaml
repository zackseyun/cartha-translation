  source_fidelity: A primeira oração preserva o gesto de Jacó e a aproximação em curso de Esaú, mas «viu que» absorve o marcador apresentativo וְהִנֵּה, e «Por isso» introduz uma relação causal que o hebraico não explicita. A revisão restitui a sequência narrativa e a força apresentativa sem arcaísmo excessivo.
  naturalness: '«Levantou os olhos e viu: Esaú vinha» é natural em português narrativo e a pontuação com dois-pontos transmite de modo claro a apresentação vívida do hebraico. «Então» na segunda oração mantém uma progressão temporal simples.'
  terminology: «Jacó», «Esaú», «Lia» e «Raquel» estão corretos. «Filhos» é apropriado no contexto, e «servas» é uma tradução concisa e aceitável de שְׁפָחוֹת.
