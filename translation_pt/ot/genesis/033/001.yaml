base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: pt
  text: 'Então Jacó levantou os olhos e viu: Esaú vinha, acompanhado de quatrocentos homens. Então distribuiu os filhos entre Lia, Raquel e as duas servas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Jacó levantou os olhos e viu
  rationale: Conserva a imagem do idioma hebraico sem produzir uma sequência artificial em português; וַיַּרְא é traduzido diretamente por «viu».
- source_word: וְהִנֵּה
  choice: viu que
  rationale: Integra no fluxo narrativo a função apresentativa de הִנֵּה, chamando a atenção para o que Jacó avistou, sem recorrer ao hoje pouco natural «eis».
- source_word: בָּא
  choice: se aproximava
  rationale: O particípio apresenta Esaú em movimento na direção de Jacó; esta formulação comunica claramente a ação em curso.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: acompanhado de quatrocentos homens
  rationale: Expressa de modo natural que os quatrocentos homens vinham com Esaú.
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: distribuiu os filhos
  rationale: O verbo indica a repartição das crianças em grupos; «filhos» é adequado aqui porque se trata dos filhos de Jacó, embora «crianças» também seja lexicalmente possível.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: entre Lia, Raquel e as duas servas
  rationale: O עַל repetido assinala aqui a distribuição dos filhos em grupos associados a cada mulher. «Servas» traduz שְׁפָחוֹת de forma concisa e historicamente apropriada.
