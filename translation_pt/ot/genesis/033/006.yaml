  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: pt
  text: Então as servas e seus filhos se aproximaram e se prostraram.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres escravizadas”; o termo hebraico designa mulheres em condição servil.
    reason: lexical_alternative
  - marker: b
    text: Ou “se inclinaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: se aproximaram
  rationale: O wayyiqtol feminino plural de נגשׁ descreve a ação seguinte na narrativa e o movimento em direção a Esaú; “se aproximaram” é natural e preciso.
- source_word: הַשְּׁפָחוֹת
  choice: as servas
  rationale: שִׁפְחָה designa mulheres em condição servil. “Servas” mantém a referência feminina e é conciso, embora “mulheres escravizadas” explicite mais fortemente sua condição social.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: e seus filhos
  rationale: O pronome independente הֵנָּה retoma enfaticamente as servas na construção “elas e seus filhos”. Em português corrente, a coordenação direta “as servas e seus filhos” comunica com clareza o grupo que age em conjunto.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: se prostraram
  rationale: A forma de השתחוה descreve um gesto corporal de reverência. “Se prostraram” expressa melhor a intensidade possível do ato do que o mais genérico “se inclinaram”.
