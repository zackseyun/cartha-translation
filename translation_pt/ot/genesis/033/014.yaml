base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: pt
  text: Por favor, que meu senhor siga adiante de seu servo, e eu avançarei devagar[a], ao passo do gado[b] que vai à minha frente e das crianças, até chegar a meu senhor em Seir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu avançarei com cuidado”. O verbo hebraico pode descrever um deslocamento cuidadoso, sem indicar necessariamente que Jacó conduziria os demais.'
    reason: lexical_alternative
  - marker: b
    text: “O gado” traduz um termo hebraico que frequentemente significa “trabalho”, “bens” ou “propriedade”, mas que aqui provavelmente se refere aos animais conduzidos pelo grupo.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “até chegar a meu senhor, a Seir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Por favor, que ... siga adiante
  rationale: O jussivo qal com נָא expressa um pedido cortês; a formulação preserva tanto a deferência quanto o sentido de ir à frente.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém a forma respeitosa com que Jacó se dirige a Esaú, sem lhe atribuir sentido divino.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: adiante de seu servo
  rationale: Expressa naturalmente o sentido espacial de ir à frente e conserva a autodesignação deferente de Jacó na terceira pessoa.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: eu avançarei devagar
  rationale: O hitpael de נהל pode indicar deslocar-se de maneira cuidadosa; esta tradução evita afirmar de modo indevido que o verbo significa explicitamente conduzir outros, enquanto לְאִטִּי indica progressão lenta.
- source_word: לְרֶגֶל
  choice: acompanhando o passo de
  rationale: Traduz o idioma literalmente ligado ao 'pé' como movimento regulado pelo ritmo dos animais e das crianças.
- source_word: הַמְּלָאכָה
  choice: o gado
  rationale: Embora o substantivo possa significar trabalho, bens ou propriedade, neste contexto pastoril designa mais provavelmente os animais que seguem com Jacó.
- source_word: אֲשֶׁר לְפָנַי
  choice: que vai à minha frente
  rationale: Preserva a referência espacial do hebraico em português natural.
- source_word: הַיְלָדִים
  choice: as crianças
  rationale: É a designação direta e natural dos filhos que acompanham o grupo.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: até chegar a meu senhor em Seir
  rationale: Comunica o destino de forma natural, mantendo a possibilidade sintática de relacionar 'em Seir' à chegada junto de Esaú.
