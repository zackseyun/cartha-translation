  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: pt
  text: Ali ele ergueu um altar e lhe deu o nome de El-Elohe-Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ali ele ergueu um altar e invocou Deus: ‘Deus, o Deus de Israel’”; ou: “proclamou sobre ele: ‘Deus, o Deus de Israel’”. O hebraico pode ser entendido como a atribuição de um nome ao altar ou como uma invocação ou declaração referente a Deus.'
    reason: alternative_reading
  - marker: b
    text: El-Elohe-Israel significa “Deus, o Deus de Israel” ou “El, Deus de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: ergueu
  rationale: O hifil de נצב significa estabelecer ou erigir. “Ergueu” é natural em português para a construção de um altar.
- source_word: שָׁם
  choice: ali
  rationale: Reproduz diretamente o advérbio locativo e se liga com naturalidade ao contexto precedente.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: É o equivalente corrente e preciso para a estrutura sacrificial indicada pelo termo hebraico.
- source_word: וַיִּקְרָא לוֹ
  choice: lhe deu o nome de
  rationale: No contexto imediato, a construção é entendida mais naturalmente como a atribuição de um nome ao altar. A formulação portuguesa evita a possível impressão de que “chamou-o” significa convocá-lo. As leituras de invocação ou proclamação são preservadas em nota.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Eloê-Israel
  rationale: A expressão inteira funciona, na leitura principal, como nome do altar; por isso é transliterada. “Eloê” representa a forma construta אֱלֹהֵי e permite distinguir o nome transliterado de sua tradução, fornecida em nota.
theological_decisions:
- issue: Se a frase final nomeia o altar ou constitui uma invocação ou proclamação acerca de Deus
  choice: Entendê-la no texto principal como o nome dado ao altar
  alternative: '“Ali ele ergueu um altar e invocou: ‘Deus, o Deus de Israel’” ou “proclamou sobre ele: ‘Deus, o Deus de Israel’”'
  rationale: A sequência sintática após a construção do altar e fórmulas semelhantes em Gênesis favorecem a nomeação. Contudo, קרא + ל e a compactação do hebraico permitem também uma leitura de invocação ou declaração; a nota conserva essa ambiguidade sem a resolver dogmaticamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Ali ele ergueu” mantém a narrativa fluida; “lhe deu o nome de” torna inequívoca a leitura principal sem apagar em nota a ambiguidade genuína do hebraico.
