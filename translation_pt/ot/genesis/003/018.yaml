  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: pt
  text: Ela produzirá espinhos e cardos para você[a], e você comerá as plantas do campo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela fará crescer espinhos e cardos para você”. O verbo hebraico é causativo, e seu sujeito é “a terra”, mencionada no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: “Plantas do campo” também pode ser traduzido por “vegetação do campo” ou, de modo mais tradicional, “erva do campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹץ וְדַרְדַּר
  choice: espinhos e ervas daninhas
  rationale: A expressão designa dois tipos de vegetação nociva ou espinhosa. “Espinhos” preserva o primeiro termo; “ervas daninhas” comunica com naturalidade a vegetação indesejada do segundo sem alegar uma espécie botânica exata.
- source_word: תַּצְמִיחַ לָךְ
  choice: ela produzirá ... para você
  rationale: O verbo no hifil tem sentido causativo e está no feminino singular, retomando “terra” no versículo anterior. “Produzirá” expressa de modo natural a ação da terra, e “para você” mantém explícito לָךְ.
- source_word: וְאָכַלְתָּ
  choice: e você comerá
  rationale: A forma verbal dá continuidade às consequências futuras anunciadas ao homem; o futuro simples é claro e natural em português.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: as plantas do campo
  rationale: עֵשֶׂב é um termo amplo para vegetação, inclusive a própria para alimento. “Plantas do campo” é atual, compreensível e preserva a relação com הַשָּׂדֶה.
theological_decisions:
- issue: Referente do verbo feminino singular תַּצְמִיחַ
  choice: O sujeito é explicitado pelo pronome “Ela”, que retoma “a terra” do versículo anterior.
  alternative: Construção impessoal ou repetição de “a terra”.
  rationale: A concordância feminina singular aponta naturalmente para הָאֲדָמָה, “a terra”, em Gênesis 3:17. O pronome preserva a coesão entre os versículos sem inserir uma nova interpretação.
- issue: Identificação botânica de דַּרְדַּר
  choice: ervas daninhas
  alternative: cardos; abrolhos
  rationale: A identificação botânica precisa é incerta. A escolha evita especificidade indevida e conserva o sentido contextual de vegetação nociva, embora não reproduza necessariamente toda a ideia de uma planta espinhosa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O pronome “Ela” mantém a referência à terra do versículo anterior. Evitou-se “cardos” no texto principal por sua especificidade botânica; a formulação escolhida prioriza clareza sem eliminar a noção geral de vegetação hostil.
