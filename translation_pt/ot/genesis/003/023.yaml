  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: pt
  text: Então Yahweh Deus o enviou para fora do jardim do Éden, para trabalhar o solo do qual havia sido tirado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cultivar o solo”. O verbo hebraico pode significar “trabalhar”, “servir” ou, neste contexto, “cultivar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: o mandou para fora
  rationale: O piel de שׁלח expressa aqui envio para fora ou afastamento. “Mandou para fora” preserva esse sentido sem antecipar a força de גרשׁ, “expulsar”, empregado no versículo seguinte.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Translitera o nome divino יְהוָה como “Yahweh” e mantém a designação composta do hebraico.
- source_word: מִגַּן עֵדֶן
  choice: para fora do jardim do Éden
  rationale: A preposição מִן marca separação do lugar; em combinação com o verbo, “para fora do” comunica naturalmente o movimento de saída.
- source_word: לַעֲבֹד
  choice: a fim de trabalhar
  rationale: עבד pode significar trabalhar, servir ou cultivar. Com “solo” como objeto, “trabalhar” mantém a amplitude lexical e a continuidade com a vocação humana anterior.
- source_word: אֶת הָאֲדָמָה
  choice: o solo
  rationale: אֲדָמָה designa a terra ou matéria do chão da qual o ser humano foi formado. “Solo” é corrente em português e preserva o vínculo narrativo.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: do qual havia sido tirado
  rationale: A oração relativa refere-se ao solo, e o mais-que-perfeito composto expressa com naturalidade a ação anterior indicada pelo passivo לֻקַּח.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Relação entre a tarefa do homem e sua vocação original
  choice: trabalhar o solo
  alternative: cultivar o solo; servir o solo
  rationale: A formulação conserva a continuidade lexical de עבד sem acrescentar uma interpretação teológica não explicitada neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A fim de” explicita de modo natural a finalidade do infinitivo hebraico; “mandou para fora” evita confundir este verbo com o mais forte “expulsou” do versículo seguinte.
