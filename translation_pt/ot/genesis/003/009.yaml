base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: pt
  text: 'Então Yahweh Deus chamou o homem e lhe disse: “Onde você está?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O qal wayyiqtol de קרא dá sequência à narrativa. “Chamou” é natural e preserva o sentido sem acrescentar a ideia mais específica de convocação.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: O texto traz o nome divino יְהוָה seguido de אֱלֹהִים. “Yahweh Deus” preserva o nome próprio e a designação composta.
- source_word: אֶל הָאָדָם
  choice: o homem
  rationale: Com “chamar”, o português permite objeto direto para a pessoa chamada. Neste contexto, הָאָדָם designa o indivíduo masculino da narrativa, não a humanidade em geral.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: “Lhe” representa explicitamente o pronome hebraico לוֹ e produz uma construção corrente e digna em português.
- source_word: אַיֶּכָּה
  choice: Onde você está?
  rationale: O interrogativo com sufixo masculino singular dirige uma pergunta pessoal ao homem. “Você” oferece ampla legibilidade brasileira sem acrescentar nuance interpretativa.
- source_word: וַ
  choice: Então
  rationale: O waw narrativo introduz o acontecimento seguinte; “Então” comunica com naturalidade essa progressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; “SENHOR” e “Jeová” são tradições possíveis, mas não foram adotadas no texto principal.
- issue: Referente de הָאָדָם
  choice: o homem
  alternative: o ser humano; a humanidade
  rationale: Embora אָדָם possa ter sentido coletivo, aqui Deus se dirige ao indivíduo masculino específico presente na cena.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a sequência narrativa e o pronome explícito do destinatário.
