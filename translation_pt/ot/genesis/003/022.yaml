source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: pt
  text: 'Então Yahweh Deus disse: “Eis que o homem se tornou como um de nós[a], conhecendo o bem e o mal. E agora, para que não estenda a mão, tome também da árvore da vida, coma e viva para sempre—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “como um de nós”. O plural “nós” é preservado; ele tem sido entendido de diferentes maneiras, entre elas linguagem do conselho divino, plural de deliberação ou alusão a uma pluralidade intradivina.
    reason: Preservar a ambiguidade interpretativa do pronome plural sem adotar uma explicação teológica específica.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino pessoal, Yahweh, e traduz אֱלֹהִים naturalmente como “Deus” na expressão em aposição.
- source_word: הֵן
  choice: Eis que
  rationale: Conserva a força apresentativa e solene da interjeição hebraica em português digno e corrente.
- source_word: הָאָדָם
  choice: o homem
  rationale: O contexto aponta para o indivíduo humano já mencionado, e não para a humanidade em sentido abstrato.
- source_word: הָיָה
  choice: se tornou
  rationale: Expressa a mudança ocorrida e o estado resultante após a transgressão.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: como um de nós
  rationale: É a correspondência direta e natural em português, preservando sem explicação o pronome plural do hebraico.
- source_word: לָדַעַת טוֹב וָרָע
  choice: conhecendo o bem e o mal
  rationale: Mantém a relação explicativa com “se tornou como um de nós” e a amplitude cognitiva e moral da expressão.
- source_word: וְעַתָּה פֶּן
  choice: E agora, para que não
  rationale: “Para que não” introduz naturalmente a oração preventiva, enquanto a construção permanece suspensa, como no hebraico.
- source_word: יִשְׁלַח יָדוֹ
  choice: estenda a mão
  rationale: Reproduz de modo idiomático a imagem concreta da expressão hebraica.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: tome também da árvore da vida
  rationale: Preserva a força aditiva de גַּם e a formulação tradicional e transparente de “árvore da vida”.
- source_word: וְאָכַל וָחַי לְעֹלָם
  choice: coma e viva para sempre
  rationale: Traduz de maneira direta a sequência verbal e o sentido temporal de לְעֹלָם.
theological_decisions:
- issue: O plural em “como um de nós”
  choice: Manter o plural “nós” sem expansão interpretativa.
  alternative: Resolver a expressão como plural de deliberação, linguagem do conselho divino ou alusão à pluralidade intradivina.
  rationale: O texto hebraico usa inequivocamente a primeira pessoa do plural, mas não explicita aqui o seu referente; a tradução preserva essa tensão.
- issue: Final abrupto da fala divina
  choice: Manter a oração incompleta com travessão após “para sempre”.
  alternative: Completar sintaticamente a consequência implícita ou encerrar a frase sem indicar suspensão.
  rationale: A oração preventiva iniciada por פֶּן fica suspensa no hebraico, e a ação narrativa do versículo seguinte funciona como resposta; acrescentar uma conclusão resolveria o texto indevidamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” mantém a solenidade narrativa sem arcaísmo excessivo. O travessão final conserva deliberadamente a fala interrompida.
