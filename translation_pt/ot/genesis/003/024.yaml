  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: pt
  text: Assim, ele expulsou o homem e colocou, a leste do jardim do Éden, os querubins e a chama da espada que gira em todas as direções[a], para guardar o caminho até a árvore da vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “a espada flamejante que girava em todas as direções”. Mais literalmente, o hebraico diz “a chama da espada que se revolve” ou “que gira em todas as direções”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: expulsou
  rationale: O verbo גרשׁ expressa a ação enérgica de fazer sair ou expulsar; “expulsou” é natural e mantém essa força.
- source_word: הָאָדָם
  choice: o homem
  rationale: Neste contexto narrativo, a expressão retoma o indivíduo que havia sido formado e colocado no jardim, e não a humanidade em sentido abstrato.
- source_word: וַיַּשְׁכֵּן
  choice: colocou
  rationale: O hifil de שכן indica fazer permanecer ou instalar em determinado lugar. “Colocou” comunica isso com clareza, enquanto o contexto explicita a função de guarda.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: a leste do jardim do Éden
  rationale: A expressão espacial indica a região ou o lado oriental do jardim; “a leste de” é idiomático e preserva a localização sem especificá-la além do hebraico.
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: “Querubins” é o termo bíblico tradicional e reconhecível em português para esses seres celestiais.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: a chama da espada que girava em todas as direções
  rationale: Mantém a construção incomum “chama da espada” e traduz o particípio como movimento contínuo e multidirecional, sem reduzi-lo simplesmente a “espada flamejante”.
- source_word: לִשְׁמֹר
  choice: para guardar
  rationale: Neste contexto de acesso impedido, “guardar” transmite tanto vigilância quanto restrição.
- source_word: דֶּרֶךְ
  choice: o caminho da
  rationale: Preserva a relação construta formal do hebraico, cuja referência contextual é o caminho que conduz à árvore.
- source_word: עֵץ הַחַיִּים
  choice: árvore da vida
  rationale: É a tradução direta, consagrada e semanticamente adequada da expressão hebraica.
theological_decisions:
- issue: Sentido de אָדָם no contexto narrativo
  choice: o homem
  alternative: o ser humano; a humanidade
  rationale: O referente imediato é o indivíduo expulso do Éden. A tradução singular pessoal preserva esse referente sem converter o termo em uma abstração coletiva.
- issue: Natureza da expressão לַהַט הַחֶרֶב
  choice: a chama da espada
  alternative: a espada flamejante
  rationale: A formulação escolhida conserva a tensão e a imagem concreta da construção hebraica, evitando resolver a relação entre “chama” e “espada” por meio da paráfrase tradicional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português, e a imagem incomum do hebraico foi preservada. O marcador [a] aparece no texto principal.
