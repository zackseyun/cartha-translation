revisions:
- from: Assim, ele expulsou o homem e colocou, a leste do jardim do Éden, os querubins e a chama da espada que girava em todas as direções[a], para guardar o caminho da árvore da vida.
  to: Assim, ele expulsou o homem e colocou, a leste do jardim do Éden, os querubins e a chama da espada que gira em todas as direções[a], para guardar o caminho até a árvore da vida.
  rationale: A revisão limita-se a substituir o passado «girava» por «gira», refletindo o particípio hebraico, e a ajustar a nota para não tornar «sobre si mesma» uma explicitação excessivamente definida. «Até a árvore» torna explícito, em português natural, que o caminho é o de acesso à árvore.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:37:44Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a expulsão do homem, a localização oriental em relação ao jardim, os querubins, a imagem incomum de «a chama da espada» e a finalidade de guardar o acesso à árvore da vida. Contudo, o particípio hebraico הַמִּתְהַפֶּכֶת descreve ação em curso; «girava» introduz indevidamente um aspecto passado.
  naturalness: O português é claro, moderno e apropriado ao registro narrativo solene. «A leste do jardim do Éden» e «os querubins» são naturais. «O caminho até a árvore da vida» expressa idiomaticamente o sentido contextual de acesso sem eliminar a imagem do original.
  terminology: «Homem», «Éden», «querubins» e «árvore da vida» são consistentes com o uso bíblico português. A construção «chama da espada» conserva, de modo útil, a formulação marcada do hebraico.
  issues:
  - severity: medium
    issue: Tempo/aspecto de «que girava»
    rationale: O hebraico usa o particípio הַמִּתְהַפֶּכֶת, ligado à ação presente ou contínua na cena. «Que gira» preserva essa nuance melhor que o imperfeito passado «girava».
  - severity: low
    issue: Nota explicativa usa «gira sobre si mesma» como se fosse o único sentido literal
    rationale: O hitpael pode sugerir voltar-se/revolver-se, mas a extensão «sobre si mesma» é uma explicitação interpretativa. A nota deve apresentar essa possibilidade de modo menos restritivo e manter a alternativa de movimento em todas as direções.
  revised_text: Assim, ele expulsou o homem e colocou, a leste do jardim do Éden, os querubins e a chama da espada que gira em todas as direções[a], para guardar o caminho até a árvore da vida.
