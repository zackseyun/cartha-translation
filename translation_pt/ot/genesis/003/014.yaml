  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: pt
  text: 'Então Yahweh Deus disse à serpente[a]: “Porque você fez isso, maldita é você mais do que todos os animais domésticos e mais do que todos os animais do campo. Sobre o seu ventre você andará[b] e pó comerá todos os dias da sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobra”.
    reason: lexical_alternative
  - marker: b
    text: A expressão ligada a andar sobre o ventre e comer pó também pode evocar humilhação e derrota, não apenas descrever literalmente o movimento ou a alimentação.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém a forma do nome divino adotada na camada inglesa fornecida e reproduz a associação hebraica entre o nome pessoal e אֱלֹהִים.
- source_word: הַנָּחָשׁ
  choice: a serpente
  rationale: “Serpente” conserva o registro literário e elevado do relato; “cobra” continua possível como alternativa lexical.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Porque você fez isso
  rationale: Expressa de modo claro e natural a relação causal que introduz a sentença.
- source_word: אָרוּר אַתָּה
  choice: maldita é você
  rationale: A anteposição de “maldita” preserva a ênfase e o tom judicial do hebraico; o feminino concorda naturalmente com “serpente” em português.
- source_word: מִכָּל הַבְּהֵמָה
  choice: mais do que todos os animais domésticos
  rationale: Entende מִן em sentido comparativo e distingue בְּהֵמָה, o conjunto dos animais domésticos, dos animais do campo.
- source_word: וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: e mais do que todos os animais do campo
  rationale: Preserva a expressão concreta “do campo” sem restringi-la além do que o texto exige; o paralelismo pede “todos” em português natural.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Sobre o ventre você andará
  rationale: Mantém o verbo amplo “andar/ir”, pois o hebraico não diz explicitamente “rastejar”, e conserva em destaque a maneira do movimento.
- source_word: וְעָפָר תֹּאכַל
  choice: e pó comerá
  rationale: Preserva a imagem vívida e a ordem marcada do hebraico sem decidir no texto principal se a linguagem é literal, figurada ou ambas.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: todos os dias da sua vida
  rationale: Reproduz plenamente a duração enfática da fórmula hebraica.
theological_decisions:
- issue: Identidade da serpente
  choice: Traduzir o referente imediato simplesmente como “a serpente”.
  alternative: Identificá-la explicitamente com Satanás no texto principal.
  rationale: O versículo dirige a sentença à serpente e não faz aqui uma identificação explícita com Satanás; a tradução não deve importar uma interpretação teológica posterior.
- issue: Sentido de “comer pó”
  choice: Conservar a imagem sem explicá-la no texto principal.
  alternative: Parafrasear exclusivamente como humilhação e derrota ou como dieta literal.
  rationale: A expressão admite uma cena concreta e também ressonâncias figuradas de humilhação; manter “pó comerá” preserva essa tensão.
- issue: Alcance do comparativo מִן
  choice: “mais do que” os demais animais.
  alternative: “separada dentre” ou “amaldiçoada por todos”.
  rationale: O uso comparativo se ajusta melhor à sintaxe e ao paralelismo, embora o português não deva sugerir além do necessário que os outros animais também receberam uma maldição idêntica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” porque Deus se dirige diretamente à serpente e evita o regionalismo de “tu”. A formulação conserva algum paralelismo e solenidade sem recorrer a construções arcaicas.
