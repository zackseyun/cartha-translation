  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: pt
  text: 'Então Yahweh Deus disse à mulher: “O que é isso que você fez?” A mulher respondeu: “A serpente me enganou[a], e eu comi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me iludiu” ou “me induziu ao erro”. O verbo hebraico indica enganar ou levar alguém ao erro.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando a forma pessoal presente no hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Na combinação יְהוָה אֱלֹהִים, “Yahweh Deus” preserva tanto o nome divino quanto a designação אֱלֹהִים de modo claro em português.
- source_word: לָאִשָּׁה
  choice: à mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; aqui, “a mulher” corresponde à designação narrativa imediata sem tornar primário o sentido conjugal.
- source_word: מַה זֹּאת עָשִׂית
  choice: O que é isso que você fez?
  rationale: Preserva o interrogativo מַה e o demonstrativo זֹאת, reproduzindo a força da pergunta sem convertê-la em uma pergunta causal (“Por que...?”).
- source_word: הַנָּחָשׁ
  choice: a serpente
  rationale: “Serpente” é natural, inteligível e mantém a ressonância literária da figura em Gênesis 3 melhor do que o termo mais cotidiano “cobra”.
- source_word: הִשִּׁיאַנִי
  choice: me enganou
  rationale: O verbo expressa enganar, iludir ou induzir ao erro. “Me enganou” é claro e corrente, sem a tonalidade arcaica de alternativas como “me seduziu” ou “me iludiu” em certos contextos.
- source_word: וָאֹכֵל
  choice: e eu comi
  rationale: Preserva diretamente a sequência expressa pelo hebraico, sem acrescentar de modo explícito a relação causal que “por isso comi” poderia sugerir.
theological_decisions:
- issue: Descrição da ação da serpente
  choice: A serpente me enganou
  alternative: A serpente me iludiu / me induziu ao erro
  rationale: “Enganou” mantém a atribuição de fraude ou desorientação à serpente sem acrescentar uma explicação doutrinária sobre responsabilidade, intenção ou sedução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea; mantém “Yahweh” como nome divino e “serpente” como termo literariamente adequado.
