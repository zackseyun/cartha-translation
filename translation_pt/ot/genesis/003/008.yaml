base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: pt
  text: E ouviram o som de Yahweh Deus, que caminhava pelo jardim na brisa do dia[a][b]; então o homem[c] e sua mulher se esconderam da presença de Yahweh Deus entre as árvores do jardim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a voz de Yahweh Deus”. A palavra hebraica pode significar tanto “som” quanto “voz”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no frescor do dia”. Literalmente, “na brisa/no vento do dia”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “o homem”; alternativamente, “Adão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: som
  rationale: O termo pode designar tanto “som” quanto “voz”. Como o texto não afirma que Deus falou e associa o termo ao ato de caminhar, “som” evita especificar além do hebraico; a alternativa “voz” é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Em aposição a יְהוָה, forma a designação “Yahweh Deus”.
- source_word: מִתְהַלֵּךְ
  choice: caminhava
  rationale: Preserva a representação antropomórfica concreta e expressa naturalmente o movimento de andar pelo jardim.
- source_word: בַּגָּן
  choice: pelo jardim
  rationale: Embora ב possa ser traduzido por “em”, o português idiomático usa “caminhar pelo jardim” para movimento dentro desse espaço.
- source_word: לְרוּחַ הַיּוֹם
  choice: na brisa do dia
  rationale: רוּחַ significa vento, sopro ou espírito. “Brisa do dia” mantém a imagem do vento sem converter diretamente seu efeito em “frescor”.
- source_word: הָאָדָם
  choice: o homem
  rationale: No contexto imediato, a referência ao indivíduo junto de “sua mulher” favorece “o homem”, sem eliminar a possível identificação como Adão.
- source_word: וְאִשְׁתּוֹ
  choice: e sua mulher
  rationale: Tradução direta e natural do substantivo com sufixo possessivo; “mulher” também mantém a terminologia do contexto de Gênesis 2.
- source_word: מִפְּנֵי
  choice: da presença de
  rationale: Preserva a dimensão espacial e relacional da expressão hebraica, literalmente ligada à face ou presença.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: entre as árvores do jardim
  rationale: עֵץ está no singular morfológico, mas pode ter sentido coletivo; o contexto de esconder-se favorece naturalmente “árvores”.
theological_decisions:
- issue: Representação antropomórfica de Deus caminhando no jardim
  choice: Manter “caminhava” sem atenuação ou explicação alegórica.
  alternative: “movia-se pelo jardim” ou “a presença de Yahweh Deus no jardim”
  rationale: O hebraico apresenta Deus em linguagem narrativa concreta. A tradução preserva essa tensão teológica em vez de reinterpretá-la.
- issue: Sentido de הָאָדָם
  choice: “o homem”
  alternative: “Adão” ou “o ser humano”
  rationale: A menção de “sua mulher” favorece a referência ao indivíduo masculino, mas a nota preserva a leitura nominal possível.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem dos marcadores foi ajustada para colocá-los junto às expressões a que se referem.
