base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: pt
  text: 'Mas a serpente disse à mulher: “Vocês certamente não morrerão.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma construção enfática, literalmente próxima de “não — morrer, vocês morrerão”; no contexto, ela expressa uma negação categórica: “certamente não morrerão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo dá continuidade à narrativa, mas, neste contexto, introduz uma resposta que contradiz diretamente a advertência divina; “mas” comunica naturalmente esse valor adversativo.
- source_word: הַנָּחָשׁ
  choice: a serpente
  rationale: נָחָשׁ designa serpente ou cobra. “Serpente” é natural, preserva o padrão literário tradicional do relato e evita reduzir sua carga narrativa.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”, mas o relato neste ponto a identifica repetidamente como “a mulher”; a escolha preserva esse padrão sem estreitar o sentido.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: vocês certamente não morrerão
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação verbal, e לֹא nega a expressão inteira. A ordem portuguesa põe a certeza sobre a negação, transmitindo a contradição categórica da serpente. “Vocês” torna explícito o plural da segunda pessoa hebraica.
theological_decisions:
- issue: Força da negação da serpente
  choice: “Vocês certamente não morrerão” como negação categórica
  alternative: “Vocês não morrerão” ou “Vocês não morrerão necessariamente”
  rationale: A construção hebraica é enfática e contradiz diretamente a advertência anterior. A tradução mantém essa força sem decidir questões interpretativas sobre a natureza ou o momento da morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “vocês” para representar claramente a segunda pessoa do plural do hebraico; a colocação de “certamente” evita que a frase soe como mera dúvida sobre a morte.
