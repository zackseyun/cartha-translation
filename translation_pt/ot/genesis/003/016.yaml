    rationale: Embora formalmente próxima do hebraico, a construção não é idiomática no português moderno e pode soar opaca. «Será pelo seu marido» comunica naturalmente a relação indicada por אֶל sem definir a natureza do desejo.
  - severity: low
    issue: Construção «governará sobre você»
    rationale: Em português, «governar sobre» é menos natural nesta relação. «Terá domínio sobre você» expressa de modo claro e sóbrio o valor de משל, sem fortalecer o texto para «dominar».
