  verdict: revise
  source_fidelity: O texto reproduz adequadamente a intensificação de הַרְבָּה אַרְבֶּה, a dupla referência a dor e concepção/gravidez, o parto, e a afirmação descritiva de que o marido exercerá governo. «Filhos» é literal, com nota apropriada para o possível sentido abrangente. «Desejo» preserva corretamente a ambiguidade de תְּשׁוּקָה.
  naturalness: «Seu desejo será para o seu marido» é um decalque pouco natural em português moderno. «Será pelo seu marido» conserva a abertura semântica de «para/em direção a» e é idiomático. «Governará sobre você» é compreensível, mas «terá domínio sobre você» soa mais natural e mantém o sentido de ימשל sem a conotação política mais específica de «governar».
  terminology: «Mulher», «marido», «dor», «concepção» e «desejo» são escolhas adequadas. A nota sobre «anseio» e sobre a interpretação de controle apresenta as alternativas como interpretações, não como sentido imposto.
