  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: pt
  text: 'À mulher ele disse: “Multiplicarei grandemente a sua dor e a sua concepção[a]; com dor você dará à luz filhos[b]. Seu desejo[c] será pelo seu marido, e ele terá domínio sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua gravidez”. O termo hebraico pode indicar concepção ou gravidez.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos”; aqui, provavelmente no sentido geral de crianças ou descendentes.'
    reason: lexical_alternative
  - marker: c
    text: Ou “anseio”. A rara palavra hebraica pode indicar desejo em sentido amplo. Alguns a entendem como desejo de controlar (compare Gênesis 4:7); outros, como anseio relacional ou sexual.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: O substantivo pode significar “mulher” ou “esposa”. Neste ponto da cena, ela é tratada como “a mulher”; mais adiante, אִישֵׁךְ explicita a relação conjugal.
- source_word: הַרְבָּה אַרְבֶּה
  choice: multiplicarei grandemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. A formulação conserva essa ênfase sem acrescentar certeza modal.
- source_word: עִצְּבוֹנֵךְ
  choice: a sua dor
  rationale: O termo abrange dor, sofrimento ou trabalho penoso. A referência imediata ao parto favorece “dor”, sem excluir a ideia mais ampla de sofrimento.
- source_word: וְהֵרֹנֵךְ
  choice: a sua concepção
  rationale: O substantivo pode indicar concepção ou gravidez. “Concepção” mantém proximidade formal com o hebraico e a distingue do ato posterior de dar à luz; a alternativa consta em nota.
- source_word: בְּעֶצֶב
  choice: com dor
  rationale: A expressão indica a circunstância ou maneira em que ocorrerá o parto; “com dor” é direta e natural em português.
- source_word: תֵּלְדִי בָנִים
  choice: você dará à luz filhos
  rationale: “Dar à luz” comunica naturalmente o verbo hebraico. בָנִים significa literalmente “filhos”, mas pode abranger a descendência em geral, o que é esclarecido em nota.
- source_word: אִישֵׁךְ
  choice: o seu marido
  rationale: No vínculo expresso com a mulher, אִישׁ designa naturalmente o marido, e não apenas um homem.
- source_word: תְּשׁוּקָתֵךְ
  choice: seu desejo será para
  rationale: O substantivo é raro e semanticamente discutido. “Desejo” preserva a ambiguidade entre anseio relacional, sexual ou possível impulso de controle, sem decidir a questão no texto principal.
- source_word: יִמְשָׁל בָּךְ
  choice: ele governará sobre você
  rationale: O verbo denota governar ou exercer domínio. A tradução expressa a afirmação descritiva do hebraico sem intensificá-la para “dominar” nem convertê-la em prescrição.
theological_decisions:
- issue: O sentido do “desejo” da mulher em relação ao marido
  choice: Manter o termo amplo “desejo” no texto principal.
  alternative: Anseio sexual; anseio ou dependência relacional; desejo de controlar, em possível paralelo com Gênesis 4:7.
  rationale: A raridade de תְּשׁוּקָה e o contexto não permitem fixar com segurança uma única nuance. A tradução preserva a tensão interpretativa e registra as possibilidades em nota.
- issue: Se o governo do marido é prescrito ou descrito
  choice: 'Traduzir como descrição do que acontecerá: “ele governará sobre você”.'
  alternative: Entender a declaração como prescrição implícita de autoridade masculina.
  rationale: A forma verbal hebraica declara o que ocorrerá, não formula explicitamente o que deve ocorrer. A tradução evita importar uma conclusão normativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas compreensíveis tanto no Brasil quanto internacionalmente. Emprega “você” por clareza corrente e mantém a coordenação incomum entre “dor” e “concepção” para não apagar a forma nem a ambiguidade do hebraico.
