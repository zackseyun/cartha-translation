base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: pt
  text: 'E a mulher disse à serpente: “Podemos comer do fruto das árvores do jardim[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “do fruto da árvore do jardim podemos comer”; aqui, “árvore” é entendida em sentido coletivo, isto é, “árvores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E ... disse” preserva o encadeamento hebraico de modo natural e digno em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Neste contexto, אִשָּׁה designa a personagem humana feminina, não especificamente seu papel conjugal.
- source_word: אֶל הַנָּחָשׁ
  choice: à serpente
  rationale: A contração “à” expressa naturalmente a direção de אֶל, e “serpente” mantém o referente e o registro narrativo elevado de נָחָשׁ.
- source_word: מִפְּרִי
  choice: do fruto
  rationale: Em português, “comer do fruto” representa de modo idiomático a ideia partitiva ou de fonte expressa por מִן com פְּרִי.
- source_word: עֵץ הַגָּן
  choice: das árvores do jardim
  rationale: Embora עֵץ esteja morfologicamente no singular, o contexto favorece sentido coletivo ou distributivo; o plural em português evita sugerir que a permissão se limita a uma só árvore.
- source_word: נֹאכֵל
  choice: podemos comer
  rationale: No contexto, o imperfeito na primeira pessoa do plural comunica permissão, ecoando Gênesis 2:16; “podemos comer” é a formulação corrente em português.
theological_decisions:
- issue: Alcance das árvores ou do fruto permitidos na resposta da mulher
  choice: Entender עֵץ coletivamente e traduzir “do fruto das árvores do jardim”
  alternative: “do fruto da árvore do jardim”
  rationale: O singular hebraico pode ter valor coletivo nesta construção, e o contexto de Gênesis 2:16 indica uma permissão geral antes de a exceção ser apresentada no versículo seguinte. O plural esclarece esse alcance sem acrescentar uma restrição teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura mantém o fluxo narrativo hebraico; “serpente” preserva o tom tradicional sem alterar o referente. A vírgula final foi mantida porque a fala continua no versículo seguinte.
