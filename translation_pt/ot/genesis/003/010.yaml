source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: pt
  text: 'E ele disse: “Ouvi a tua voz[a] no jardim e fiquei com medo, porque eu estava nu; por isso, me escondi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu som”. A palavra hebraica pode significar tanto “voz” como “som”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a forma narrativa hebraica sem acrescentar uma relação temporal ou lógica além da sequência do relato.
- source_word: אֶת קֹלְךָ
  choice: a tua voz
  rationale: קוֹל pode significar “voz” ou “som”. Neste contexto, “a tua voz” é a expressão mais natural em português, enquanto a alternativa mais ampla é registrada em nota.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: Tradução direta e idiomática do qal perfeito na primeira pessoa do singular.
- source_word: בַּגָּן
  choice: no jardim
  rationale: Mantém a definitude e o cenário já estabelecido no contexto.
- source_word: וָאִירָא
  choice: fiquei com medo
  rationale: Expressa de modo natural em português a experiência de temor indicada pelo verbo ירא.
- source_word: כִּי
  choice: porque
  rationale: 'Comunica claramente a relação causal: a nudez é apresentada como razão do medo.'
- source_word: עֵירֹם אָנֹכִי
  choice: eu estava nu
  rationale: A oração nominal hebraica não marca tempo; o imperfeito português se ajusta ao relato passado. O pronome “eu” reflete a presença enfática de אָנֹכִי.
- source_word: וָאֵחָבֵא
  choice: por isso, me escondi
  rationale: O verbo tem sentido reflexivo. “Por isso” torna natural em português a relação consequencial sugerida pelo encadeamento do discurso.
theological_decisions:
- issue: Sentido de קוֹל em relação à presença de Deus
  choice: a tua voz
  alternative: o teu som
  rationale: O substantivo hebraico admite tanto “voz” quanto “som”. “Voz” é natural e tradicional no contexto, mas a nota preserva a possibilidade de uma referência mais ampla ao som da presença ou movimentação de Deus, sem decidir além do texto.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. Emprega “tua” para evitar a ambiguidade possessiva de “sua” e “me escondi” como forma natural no português brasileiro. A pontuação com ponto e vírgula separa com clareza a causa do medo e sua consequência.
