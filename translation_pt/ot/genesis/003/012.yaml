  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: pt
  text: 'E o homem disse: “A mulher que me deste para estar comigo — ela me deu da árvore, e eu comi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: o homem
  rationale: O contexto se refere ao homem individual, em contraste com a mulher, e não à humanidade em geral.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Preserva a designação direta do hebraico; embora o termo também possa significar “esposa” em certos contextos, aqui “mulher” é a opção menos interpretativa.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: que me deste para estar comigo
  rationale: Expressa em português natural a relação de companhia indicada por עִמָּדִי, sem reduzir a frase a mera posse.
- source_word: הִוא
  choice: ela
  rationale: Mantém o pronome independente e sua ênfase, reforçada naturalmente pela pausa marcada pelo travessão.
- source_word: נָתְנָה לִי
  choice: me deu
  rationale: O pretérito perfeito corresponde à ação concluída na sequência narrativa.
- source_word: מִן הָעֵץ
  choice: da árvore
  rationale: Segue de perto o hebraico, que não traz a palavra “fruto”. Em português, a elipse é compreensível pelo contexto, ainda que deliberadamente concisa.
- source_word: וָאֹכֵל
  choice: e eu comi
  rationale: Mantém a coordenação e a sequência simples do hebraico, sem introduzir uma relação causal explícita como “por isso”.
theological_decisions:
- issue: Possível transferência de culpa para Deus e para a mulher
  choice: Manter “A mulher que me deste para estar comigo” sem atenuar nem intensificar a formulação.
  alternative: “A mulher que puseste aqui comigo” ou “A mulher que me deste”
  rationale: A resposta do homem sugere transferência de responsabilidade tanto para a mulher quanto, implicitamente, para Deus. A tradução conserva essa tensão sem explicá-la ou ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão destaca a retomada enfática por “ela”. A construção “me deu da árvore” conserva a concisão e a elipse do hebraico; o contexto imediato fornece o objeto implícito.
