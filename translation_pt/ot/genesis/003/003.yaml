id: GEN.3.3
reference: Genesis 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: pt
  text: 'Mas, do fruto da árvore que está no meio do jardim[a], Deus disse: “Não comam dele, nem toquem nele, para que não morram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no interior do jardim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Mas, do fruto
  rationale: A conjunção assume valor adversativo no contraste com o versículo anterior, enquanto “do fruto” preserva de modo natural em português a força da preposição מִן.
- source_word: הָעֵץ
  choice: da árvore
  rationale: Tradução direta do substantivo definido.
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: que está no meio do jardim
  rationale: בְּתוֹךְ indica a parte interior ou central; “no meio do jardim” é natural, claro e mantém a referência espacial.
- source_word: אָמַר אֱלֹהִים
  choice: Deus disse
  rationale: O qatal relata aqui uma fala anterior; o pretérito perfeito é a forma corrente em português.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Não comam dele
  rationale: A proibição dirigida ao plural é expressa naturalmente pelo imperativo negativo; “dele” preserva a relação introduzida por מִן sem produzir a formulação pouco idiomática “não comam a partir dele”.
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: nem toquem nele
  rationale: “Tocar” corresponde diretamente a נגע; “nem” liga com naturalidade a segunda proibição negativa, e “nele” reflete a preposição בְּ.
- source_word: פֶּן תְּמֻתוּן
  choice: para que não morram
  rationale: Após uma proibição, פֶּן introduz a consequência que se pretende evitar. “Para que não morram” conserva essa nuance preventiva e é mais corrente no português moderno que “para que não venham a morrer” ou “sob pena de morrer”.
theological_decisions:
- issue: A fala da mulher acrescenta “nem toquem nele” à proibição registrada em Gênesis 2:17.
  choice: Manter integralmente a fala conforme aparece neste versículo.
  alternative: Omitir ou atenuar a proibição de tocar para harmonizá-la com Gênesis 2:17.
  rationale: O texto hebraico apresenta essa formulação na fala da mulher. A tradução preserva a diferença narrativa e sua tensão teológica, sem harmonização.
- issue: A construção פֶּן תְּמֻתוּן pode destacar uma consequência temida ou evitada, sem formular necessariamente uma certeza categórica independente.
  choice: para que não morram
  alternative: senão vocês morrerão
  rationale: A opção escolhida mantém a nuance preventiva de פֶּן e evita tornar a fala mais categórica do que a construção hebraica exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se o plural verbal sem pronome explícito (“não comam”), evitando tanto arcaísmo quanto coloquialismo excessivo. A pontuação mantém “Mas” como contraste com o versículo anterior.
