base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: pt
  text: E Yahweh Deus fez roupas de pele[a] para o homem[b] e para sua mulher e os vestiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “túnicas de pele”.'
    reason: Alternativa lexical para כָּתְנוֹת עוֹר.
  - marker: b
    text: 'Ou: “para Adão e para sua mulher”. O hebraico אָדָם pode funcionar como nome próprio, “Adão”, ou como substantivo comum, “homem”, conforme o contexto.'
    reason: Registra a ambiguidade entre a leitura de אָדָם como nome próprio e como substantivo comum.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino representado pelo Tetragrama e traduz אֱלֹהִים de modo direto, mantendo a designação composta da narrativa.
- source_word: לְאָדָם
  choice: para o homem
  rationale: Neste contexto, אָדָם designa o ser humano masculino em contraste com sua mulher. A expressão também preserva melhor a possível oscilação entre substantivo comum e nome próprio.
- source_word: וּלְאִשְׁתּוֹ
  choice: e para sua mulher
  rationale: אִשָּׁה com o sufixo de terceira pessoa masculina singular indica a mulher do homem, isto é, sua esposa; 'sua mulher' é natural e fiel ao vínculo expresso.
- source_word: כָּתְנוֹת עוֹר
  choice: roupas de pele
  rationale: כָּתְנוֹת indica peças de vestir que cobrem o corpo, frequentemente túnicas; 'roupas' é claro e natural, enquanto עוֹר é mantido diretamente como 'pele' sem especificar couro processado.
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Traduz de modo simples e direto o verbo comum עשה.
- source_word: וַיַּלְבִּשֵׁם
  choice: e os vestiu
  rationale: O hifil de לבש significa fazer alguém vestir ou colocar roupa em alguém; 'os vestiu' expressa isso com naturalidade em português.
theological_decisions:
- issue: Se אָדָם deve ser traduzido como nome próprio ou substantivo comum
  choice: o homem
  alternative: Adão
  rationale: A justaposição com 'sua mulher' favorece aqui o substantivo comum, mas o hebraico permite que o termo seja entendido como nome próprio. A nota conserva essa ambiguidade sem decidir além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Yahweh' preserva o nome divino; 'roupas' evita o caráter menos corrente de 'túnicas' no texto principal, e 'os vestiu' reproduz naturalmente a ação causativa.
