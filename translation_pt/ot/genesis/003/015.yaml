base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put hostility between you and the woman[a], and between your offspring and her offspring; he will bruise your head[d][c][b], and you will bruise his heel.
translation:
  language: pt
  text: Porei inimizade entre você e a mulher[a], e entre a sua descendência e a descendência dela[b]. Ele[c] ferirá[d] a sua cabeça, e você ferirá o calcanhar dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hostilidade”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “semente” nos dois casos; o termo pode referir-se coletivamente à prole ou aos descendentes, ou ainda a um indivíduo que os represente.
    reason: lexical_alternative
  - marker: c
    text: 'O pronome hebraico é masculino singular e vem depois de um substantivo coletivo. Também pode ser entendido coletivamente: “isso”, isto é, a descendência.'
    reason: alternative_reading
  - marker: d
    text: O mesmo verbo hebraico aparece nas duas orações, e seu sentido exato é discutido. Tradicionalmente, “ferirá”; na primeira oração, alguns traduzem mais fortemente por “esmagará”, por se tratar da cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: inimizade
  rationale: Expressa oposição ativa e duradoura. “Inimizade” é corrente, digna e tradicional em português; “hostilidade” é uma alternativa possível.
- source_word: אָשִׁית
  choice: Porei
  rationale: O qal de שׂים significa “pôr, colocar, estabelecer”. “Porei” reproduz de modo natural a ação deliberada do sujeito.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: entre você e a mulher
  rationale: Mantém a relação expressa pela preposição e, com a repetição de “entre”, preserva o paralelismo hebraico.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: a sua descendência ... a descendência dela
  rationale: זֶרַע é um substantivo coletivo que pode designar semente, prole ou descendentes. “Descendência” preserva naturalmente o valor coletivo sem excluir a possibilidade de um representante individual.
- source_word: הוּא
  choice: Ele
  rationale: O hebraico emprega um pronome masculino singular depois do substantivo coletivo זֶרַע. “Ele” torna visível essa forma singular, enquanto a nota preserva a possibilidade de referência coletiva.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: ferirá ... ferirá
  rationale: שׁוּף é raro e seu sentido exato é discutido. “Ferir” funciona com cabeça e calcanhar, mantém o mesmo verbo nas duas orações e evita determinar indevidamente se a primeira lesão é necessariamente um esmagamento.
- source_word: רֹאשׁ
  choice: cabeça
  rationale: Correspondência direta e natural ao termo anatômico hebraico.
- source_word: עָקֵב
  choice: calcanhar
  rationale: Correspondência direta e natural ao termo anatômico hebraico.
theological_decisions:
- issue: Preservar as dimensões coletiva e individual da descendência da mulher
  choice: Usar “descendência” para o substantivo coletivo e “Ele” para o pronome masculino singular
  alternative: Empregar apenas uma formulação coletiva, como “ela”, ou tornar o referente exclusivamente individual, como “um descendente”
  rationale: 'A combinação mantém a tensão do hebraico: זֶרַע tem alcance coletivo, mas é retomado por הוּא, pronome masculino singular. A tradução não impõe uma interpretação messiânica nem elimina a possibilidade de um representante individual.'
- issue: Determinar a intensidade de שׁוּף nas duas orações
  choice: Traduzir o mesmo verbo por “ferirá” nas duas ocorrências
  alternative: “Esmagará” na primeira e “ferirá” na segunda; ou “atingirá” em ambas
  rationale: O texto hebraico repete o mesmo verbo. A diferença entre cabeça e calcanhar já cria uma assimetria, sem que a tradução precise inserir lexicalmente graus distintos de dano.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” comunica naturalmente o singular hebraico dirigido à serpente. A repetição de “entre” e de “ferirá” conserva o paralelismo do original. A aparente mudança de “descendência” para “Ele” é intencional e explicada em nota, para preservar a tensão gramatical e interpretativa do hebraico.
