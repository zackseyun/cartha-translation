  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: pt
  text: E o homem deu à sua mulher o nome de Eva[a], porque ela era a mãe de todos os viventes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Adão deu à sua mulher o nome de Eva”. O hebraico traz “o homem” (ha’adam), com o artigo definido.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “de todos os seres vivos” ou “de todo aquele que vive”. O hebraico diz literalmente “mãe de todo vivente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם
  choice: deu ... o nome
  rationale: A fórmula hebraica de nomeação é expressa em português corrente e natural por “dar o nome”, preservando claramente o ato de nomear.
- source_word: הָאָדָם
  choice: o homem
  rationale: O substantivo hebraico vem com artigo definido, favorecendo a leitura descritiva “o homem”, não o nome próprio “Adão”.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: No contexto, אִשָּׁה designa a esposa do homem; “sua mulher” é natural e amplamente compreensível em português, sem acrescentar informação.
- source_word: חַוָּה
  choice: Eva
  rationale: Usa-se a forma tradicional e estabelecida do nome em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a razão dada para o nome.
- source_word: הָיְתָה
  choice: foi
  rationale: O perfeito de היה descreve o papel atribuído a Eva na explicação do nome; “foi” mantém o valor verbal sem introduzir a ideia mais específica de que ela “se tornou” mãe.
- source_word: אֵם כָּל חָי
  choice: mãe de todos os viventes
  rationale: Mantém a formulação compacta e abrangente do hebraico, no qual חָי funciona substantivamente, sem restringir silenciosamente seu alcance.
theological_decisions:
- issue: Se הָאָדָם deve ser entendido como nome próprio ou expressão descritiva
  choice: o homem
  alternative: Adão
  rationale: A presença do artigo em הָאָדָם favorece “o homem”. Uma nota registra a alternativa tradicional sem apagar a forma do texto hebraico.
- issue: Alcance de “mãe de todos os viventes”
  choice: Preservar a expressão ampla
  alternative: mãe de todos os seres vivos / mãe de todo aquele que vive
  rationale: O hebraico não explicita aqui se o alcance deve ser limitado aos seres humanos ou entendido mais amplamente; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Deu ... o nome” evita o decalque pouco natural “chamou o nome”. “Viventes” conserva a concisão e a abertura semântica do hebraico, com alternativas esclarecidas em nota.
