id: GEN.3.17
reference: Genesis 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: pt
  text: 'E a Adão disse[a]: “Porque você deu ouvidos à voz de sua mulher e comeu da árvore a respeito da qual eu lhe ordenei: ‘Não coma dela’, maldito é o solo por sua causa; com penoso trabalho[b] você comerá dele todos os dias da sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao homem”.'
    reason: A forma hebraica אָדָם pode ser entendida aqui como nome próprio ou como a designação “o homem”.
  - marker: b
    text: O termo hebraico também pode ser traduzido por “com sofrimento”, “com dor” ou “com fadiga”.
    reason: בְּעִצָּבוֹן abrange sofrimento, dor e labuta penosa; neste contexto, a dificuldade do trabalho para obter alimento está em primeiro plano.
lexical_decisions:
- source_word: לְאָדָם
  choice: a Adão
  rationale: O contexto apresenta um indivíduo específico; a ausência do artigo permite entender אָדָם como nome próprio. A alternativa “ao homem” permanece possível e é registrada em nota.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: deu ouvidos à voz de sua mulher
  rationale: A expressão portuguesa comunica que ele acolheu e seguiu o que ela disse, preservando também o elemento explícito קוֹל, “voz”, sem recorrer ao interpretativamente mais forte “obedeceu”.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: e comeu da árvore
  rationale: Reproduz de modo natural a preposição מִן e, no contexto, refere-se ao que procedia da árvore.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: a respeito da qual eu lhe ordenei
  rationale: Mantém a relação da ordem com a árvore; os dois-pontos introduzem naturalmente em português o conteúdo expresso pelo hebraico לֵאמֹר, “dizendo”.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Não coma dela
  rationale: Imperativo negativo natural em português, com força de proibição, e pronome que retoma “árvore”.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: maldito é o solo
  rationale: A ordem marcada preserva a solenidade do predicado hebraico. “Solo” delimita o sentido agrícola de אֲדָמָה melhor que uma possível referência ao planeta ou ao território.
- source_word: בַּעֲבוּרֶךָ
  choice: por sua causa
  rationale: Expressa claramente que a maldição do solo ocorre em consequência do ato do homem, sem sugerir o possível sentido benéfico de “para o seu bem”.
- source_word: בְּעִצָּבוֹן
  choice: com penoso trabalho
  rationale: No contexto da obtenção de alimento do solo, comunica simultaneamente labuta e sofrimento, sem restringir o termo apenas à dor física ou à tristeza.
- source_word: תֹּאכֲלֶנָּה
  choice: você comerá dele
  rationale: O sufixo feminino hebraico retoma אֲדָמָה. Em português, “dele” concorda com “solo” e expressa idiomaticamente que o alimento será obtido do solo, não que o solo em si será comido.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: todos os dias da sua vida
  rationale: Preserva a extensão temporal e a cadência solene da expressão hebraica.
theological_decisions:
- issue: Sentido de אָדָם no destinatário da sentença
  choice: Adão
  alternative: o homem
  rationale: A forma sem artigo pode funcionar como nome próprio e o contexto identifica o indivíduo da narrativa. Como a transição entre designação comum e nome próprio permanece discutível, a alternativa é preservada em nota.
- issue: Natureza da resposta do homem à fala da mulher
  choice: deu ouvidos à voz de sua mulher
  alternative: obedeceu à sua mulher
  rationale: O hebraico implica atenção acolhida e seguida, mas “obedeceu” explicitaria uma relação de autoridade mais definida do que a formulação fonte exige.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para evitar formas verbais arcaizantes, mas conserva cadência solene em “maldito é o solo” e “todos os dias da sua vida”. A formulação mantém a ambiguidade de אָדָם em nota e não transforma o idioma “dar ouvidos à voz” numa afirmação teológica mais específica sobre obediência conjugal.
