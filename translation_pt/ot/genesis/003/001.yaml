  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: pt
  text: 'A serpente era mais astuta do que qualquer animal do campo que Yahweh Deus havia feito[a]. E ela disse à mulher: “Foi isso mesmo que Deus disse[b]: ‘Vocês não devem comer de nenhuma árvore do jardim[c]?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais sagaz” ou “mais sutil”. O termo hebraico pode indicar prudência em outros contextos, mas aqui assume uma nuance de astúcia enganosa.
    reason: lexical_alternative
  - marker: b
    text: O narrador diz “Yahweh Deus”, mas a serpente diz apenas “Deus”, preservando a mudança de expressão no hebraico.
    reason: alternative_reading
  - marker: c
    text: Também se pode traduzir a expressão hebraica mais literalmente como “de toda árvore do jardim”. Dentro da pergunta negativa, “de nenhuma árvore” comunica melhor o exagero da ordem divina feito pela serpente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: A serpente
  rationale: O substantivo definido é diretamente traduzido por “a serpente”. O וְ inicial funciona como conexão narrativa e não exige “e” em português no início da cena.
- source_word: עָרוּם
  choice: mais astuta
  rationale: עָרוּם pode indicar prudência, sagacidade ou astúcia. Neste contexto, a fala insinuante favorece “astuta”, sem eliminar a amplitude lexical; a construção comparativa é preservada por “mais... do que”.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: do que qualquer animal do campo
  rationale: A expressão forma uma comparação. “Animal do campo” preserva a designação hebraica, e “qualquer” comunica naturalmente o alcance de כֹּל nessa construção.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ... havia feito
  rationale: A oração relativa modifica “animal do campo”; o mais-que-perfeito composto situa naturalmente a criação antes da cena narrada.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino יהוה e sua combinação com אֱלֹהִים, conforme a evidência explícita do texto hebraico.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Ela perguntou à mulher
  rationale: Embora וַיֹּאמֶר signifique literalmente “e disse”, em português a forma “perguntou” expressa naturalmente o ato de fala interrogativo que se segue. O pronome feminino concorda com “serpente” em português, sem fazer afirmação sobre o sexo do referente hebraico.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Foi isso mesmo que Deus disse
  rationale: A formulação reproduz a força cética e insinuante de אַף כִּי em português corrente, mantendo “Deus” sem acrescentar “Yahweh”, em contraste com a designação usada pelo narrador.
- source_word: לֹא תֹאכְלוּ
  choice: Vocês não devem comer
  rationale: A segunda pessoa é plural no hebraico. “Não devem comer” comunica a proibição citada com clareza e dignidade em português internacional de leitura brasileira.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: de nenhuma árvore do jardim
  rationale: Sob a negação, מִכֹּל é naturalmente expresso por “de nenhuma”. A formulação comunica a exageração da proibição atribuída a Deus, enquanto “do jardim” preserva a relação genitiva.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e distingue “Yahweh Deus”, usado pelo narrador, de “Deus”, usado pela serpente.
- issue: Nuance moral de עָרוּם
  choice: astuta
  alternative: sagaz; prudente; ardilosa
  rationale: O termo admite uma gama que vai de prudência a astúcia. O contexto imediato sugere intenção enganosa, mas a tradução evita termos mais fortes que resolveriam completamente a ambiguidade lexical.
- issue: Identidade da serpente
  choice: não explicitar identificação teológica posterior
  alternative: identificá-la no texto como Satanás ou o diabo
  rationale: Gênesis 3:1 chama a personagem de “serpente”. A tradução não deve inserir no versículo uma identificação proveniente de textos ou interpretações posteriores.
- issue: Mudança de designação divina no discurso
  choice: Yahweh Deus na narração; Deus na fala da serpente
  alternative: harmonizar ambas as ocorrências
  rationale: Essa mudança corresponde ao hebraico e pode ter relevância literária ou teológica; por isso, deve ser preservada sem explicação dogmática.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para tornar visível a segunda pessoa plural do hebraico. A ordem dos marcadores segue sua posição natural no texto: [a] após a opção lexical, [b] junto à mudança da designação divina e [c] após a expressão de alcance discutida.'
