  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: pt
  text: Com o suor do seu rosto, você comerá pão até voltar ao solo[a], pois dele você foi tirado; porque você é pó e ao pó voltará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Com o suor da sua testa”. O hebraico diz literalmente “com o suor do seu rosto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: Com o suor do seu rosto
  rationale: Reproduz diretamente a imagem hebraica, em que אַפֶּיךָ significa literalmente “seu rosto”; a expressão portuguesa mais idiomática fica registrada em nota.
- source_word: תֹּאכַל לֶחֶם
  choice: você comerá pão
  rationale: Mantém o sentido lexical específico de לֶחֶם, “pão”, embora no contexto ele também possa representar o alimento em geral.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: até voltar ao solo
  rationale: “Solo” traduz naturalmente אֲדָמָה e conserva a ligação com a matéria da qual o ser humano foi formado.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: pois dele você foi tirado
  rationale: O pronome retoma אֲדָמָה, aqui traduzido por “solo”; a voz passiva preserva o Pual hebraico.
- source_word: כִּי ... כִּי
  choice: pois ... porque
  rationale: As duas ocorrências introduzem explicações causais. A variação evita rigidez em português sem apagar sua função discursiva.
- source_word: עָפָר
  choice: pó
  rationale: É o equivalente tradicional e preciso neste contexto, preservando a fórmula de mortalidade e fragilidade humana.
- source_word: תָּשׁוּב
  choice: voltará
  rationale: O futuro expressa de modo moderno e solene a certeza da consequência anunciada.
theological_decisions:
- issue: Mortalidade humana e origem material
  choice: O homem voltará fisicamente ao solo e ao pó de onde foi tirado.
  alternative: Entender o retorno ao pó principalmente como metáfora de humilhação.
  rationale: O contexto imediato e a associação entre אֲדָמָה (“solo”) e עָפָר (“pó”) apontam para a morte e o retorno corporal à terra, sem acrescentar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícita a segunda pessoa singular sem arcaísmo; “solo” mantém o referente concreto e permite que “dele” retome o substantivo com naturalidade.
