base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: pt
  text: 'E ele disse: “Quem lhe contou que você está nu? Você comeu da árvore da qual eu lhe ordenei que não comesse?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o avanço narrativo do wayyiqtol e mantém o sujeito pronominal do hebraico, sem repetir um nome divino que não aparece neste versículo.
- source_word: מִי הִגִּיד לְךָ
  choice: Quem lhe contou
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer; “lhe contou” é natural e mantém a ideia de que alguém comunicou a informação.
- source_word: כִּי עֵירֹם אָתָּה
  choice: que você estava nu
  rationale: “Nu” traduz diretamente o adjetivo; “estava” produz uma sequência verbal natural em português depois de “contou”, sem negar que a condição ainda pudesse persistir.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: Você comeu da árvore
  rationale: A pergunta hebraica indaga sobre uma ação concluída. O pretérito perfeito é a forma idiomática em português e “comer da árvore” expressa naturalmente a relação marcada por מן.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: da qual eu lhe ordenei que não comesse
  rationale: A construção conserva tanto a ordem dirigida ao homem quanto a referência pronominal “dela”, incorporada naturalmente em “da qual”, evitando uma repetição pesada.
theological_decisions:
- issue: Identificação do sujeito masculino singular
  choice: ele
  alternative: o SENHOR Deus
  rationale: O hebraico deste versículo traz apenas o verbo na terceira pessoa masculina singular; embora o contexto identifique o referente como Deus, a tradução não acrescenta aqui o nome divino.
- issue: Valor temporal de אָתָּה na primeira pergunta
  choice: estava nu
  alternative: está nu
  rationale: O hebraico não contém cópula expressa e permite que o português ajuste o tempo ao discurso indireto. “Estava” é natural após “contou”, mas não pretende resolver se a nudez continuava no momento da pergunta.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. O tratamento por “você” explicita naturalmente a segunda pessoa masculina singular sem recorrer a formas regionais ou arcaizantes.
