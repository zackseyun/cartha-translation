  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: pt
  text: Então a mulher viu que a árvore era boa para alimento, agradável aos olhos[a] e desejável para tornar alguém sábio[b]. Tomou do seu fruto e comeu. Também deu do fruto ao seu marido, que estava com ela, e ele comeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um desejo para os olhos” ou “desejável aos olhos”. A expressão hebraica ressalta a atração visual da árvore.
    reason: lexical_alternative
  - marker: b
    text: Ou “para dar entendimento” ou “para adquirir sabedoria”. O hebraico pode indicar tornar sábio, conferir entendimento ou alcançar sabedoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: viu
  rationale: Mantém o sentido narrativo direto de perceber pela visão, sem acrescentar interpretação.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Reproduz a designação narrativa hebraica sem antecipar o nome Eva nem reduzir a personagem apenas ao papel conjugal.
- source_word: טוֹב ... לְמַאֲכָל
  choice: boa para alimento
  rationale: Preserva a avaliação positiva e a ideia de adequação para consumo, em linguagem clara e próxima do hebraico.
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: agradável aos olhos
  rationale: Expressa de modo natural a atração visual da árvore, sem impor ao substantivo uma conotação moral negativa como 'cobiça' ou 'luxúria'.
- source_word: וְנֶחְמָד
  choice: desejável
  rationale: Conserva a força de algo atraente ou digno de desejo, sem intensificar indevidamente o juízo moral.
- source_word: לְהַשְׂכִּיל
  choice: para dar entendimento
  rationale: O infinitivo hifil pode indicar causar prudência ou entendimento; esta formulação mantém essa força causativa e permite registrar em nota a alternativa ligada a tornar alguém sábio.
- source_word: מִפִּרְיוֹ
  choice: do seu fruto
  rationale: Mantém a preposição hebraica e o uso coletivo natural de 'fruto' em português.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ עִמָּהּ
  choice: Também deu do fruto ao seu marido, que estava com ela
  rationale: Torna explícito o objeto elíptico pelo contexto e liga naturalmente 'com ela' ao marido, preservando esse detalhe narrativo.
theological_decisions:
- issue: Coloração moral da percepção da mulher
  choice: 'Usar termos avaliativos relativamente neutros: ''boa'', ''agradável'' e ''desejável''.'
  alternative: Empregar termos explicitamente negativos, como 'cobiçada', 'tentadora' ou 'objeto de luxúria'.
  rationale: O hebraico descreve como a mulher avaliou a árvore antes de narrar o ato de comer. A tradução não deve inserir condenação lexical além da que o contexto narrativo fornece.
- issue: Sentido de לְהַשְׂכִּיל
  choice: Traduzir como 'para dar entendimento' e registrar a alternativa em nota.
  alternative: Traduzir como 'para tornar alguém sábio' ou 'para adquirir sabedoria'.
  rationale: A forma hebraica admite uma nuance causativa ligada a conferir entendimento, mas também pode ser entendida em termos de alcançar sabedoria. A nota preserva essa abertura sem resolver silenciosamente a tensão.
- issue: Presença do marido
  choice: Explicitar 'que estava com ela'.
  alternative: 'Traduzir de forma mais compacta e ambígua: ''ao marido com ela''.'
  rationale: עִמָּהּ declara que ele estava com ela. A oração relativa oferece português natural sem retirar esse dado importante do relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial foi simplificada para evitar repetição pesada sem perder a progressão das três avaliações. 'Alimento' mantém tom bíblico corrente sem soar arcaico; 'marido' comunica naturalmente אִישָׁהּ no contexto conjugal.
