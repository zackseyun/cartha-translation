- from: Então a mulher viu que a árvore era boa para alimento, agradável aos olhos[a] e desejável para dar entendimento[b]. Pegou do seu fruto e comeu. Também deu do fruto ao seu marido, que estava com ela, e ele comeu.
  to: Então a mulher viu que a árvore era boa para alimento, agradável aos olhos[a] e desejável para tornar alguém sábio[b]. Tomou do seu fruto e comeu. Também deu do fruto ao seu marido, que estava com ela, e ele comeu.
