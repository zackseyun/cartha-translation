  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: pt
  text: Pois Deus sabe que, no dia em que comerem dele, os olhos de vocês se abrirão, e vocês serão como Deus,[a] conhecendo o bem e o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como deuses” ou “como seres divinos”. O hebraico אֱלֹהִים pode ter esses sentidos em certos contextos.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação apresentada pela serpente para justificar a afirmação anterior, preservando a ligação discursiva.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Deus sabe
  rationale: O presente idiomático em português representa naturalmente o particípio hebraico seguido de seu sujeito.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Deus sabe.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Preserva o idioma temporal hebraico em português natural, sem exigir que se trate de um período literal de 24 horas.
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: comerem dele
  rationale: Expressa de modo corrente o ato de comer do fruto mencionado, mantendo o pronome masculino exigido por 'fruto' no contexto português.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: os olhos de vocês se abrirão
  rationale: A construção pronominal é natural em português e preserva o sentido passivo do nifal e a metáfora de percepção.
- source_word: וִהְיִיתֶם
  choice: vocês serão
  rationale: Representa diretamente o estado resultante indicado pelo verbo hebraico.
- source_word: כֵּאלֹהִים
  choice: como Deus
  rationale: O contexto imediato favorece o referente singular, mas a polissemia real de אֱלֹהִים é mantida em nota.
- source_word: יֹדְעֵי
  choice: conhecendo
  rationale: O gerúndio preserva de forma compacta a construção participial que caracteriza o estado dos interlocutores.
- source_word: טוֹב וָרָע
  choice: o bem e o mal
  rationale: É a expressão portuguesa estabelecida e conserva o peso moral e discernente da fórmula hebraica.
theological_decisions:
- issue: Referente de אֱלֹהִים em כֵּאלֹהִים
  choice: como Deus
  alternative: como deuses; como seres divinos
  rationale: O contexto narrativo imediato se refere repetidamente ao único Deus, e o conhecimento do bem e do mal aponta para uma prerrogativa divina. Como a expressão hebraica admite outras leituras reais, elas são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para representar o plural hebraico e mantém a concisão e a tensão interpretativa do original.
