- from: Então os olhos dos dois se abriram, e eles perceberam que estavam nus. Por isso, costuraram folhas de figueira e fizeram para si coberturas para a cintura.[a]
  to: Então os olhos dos dois se abriram, e eles perceberam que estavam nus. Então costuraram folhas de figueira e fizeram para si cintas.[a]
  rationale: A revisão remove a causalidade explicitada por «Por isso» e substitui a paráfrase «coberturas para a cintura» por «cintas», mantendo em nota uma alternativa tradicional e mais concreta. O restante conserva o sentido e o registro do rascunho.
