base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: pt
  text: Então os olhos dos dois se abriram, e eles perceberam que estavam nus. Então costuraram folhas de figueira e fizeram para si cintas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aventais”.
    reason: Alternativa lexical para חֲגֹרֹת, cujo formato exato não é especificado.
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: se abriram
  rationale: Reproduz de modo natural a forma intransitiva/passiva do hebraico e conserva a expressão narrativa sem explicar em que consistiu a nova percepção.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: os olhos dos dois
  rationale: Mantém a ênfase do hebraico em ambos os participantes, com formulação corrente em português.
- source_word: וַיֵּדְעוּ
  choice: perceberam
  rationale: Neste contexto, ידע indica que eles tomaram consciência de sua nudez. 'Perceberam' comunica esse sentido naturalmente, sem acrescentar vergonha ou uma explicação teológica ausente do texto.
- source_word: עֵירֻמִּם
  choice: nus
  rationale: Equivalente direto e natural do adjetivo hebraico, preservando a ligação narrativa com Gênesis 2:25.
- source_word: וַיִּתְפְּרוּ
  choice: costuraram
  rationale: É o equivalente português direto para a ação de unir as folhas por costura.
- source_word: עֲלֵה תְאֵנָה
  choice: folhas de figueira
  rationale: Expressão idiomática em português para o construto hebraico.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: fizeram para si
  rationale: Preserva explicitamente a ideia reflexiva de que produziram algo para uso próprio.
- source_word: חֲגֹרֹת
  choice: coberturas para a cintura
  rationale: O substantivo designa algo cingido ao corpo. A tradução comunica a função e a localização provável sem especificar indevidamente o formato exato da peça.
theological_decisions:
- issue: Relação entre a abertura dos olhos, a nudez e a vergonha
  choice: Descrever apenas que seus olhos se abriram e que perceberam estar nus
  alternative: Explicitar que ficaram envergonhados ou que sua consciência moral despertou
  rationale: Embora o contexto sugira vergonha e uma mudança de autopercepção, o versículo não emprega essas formulações. A tradução conserva a tensão narrativa sem impor uma conclusão teológica.
- issue: Forma exata de חֲגֹרֹת
  choice: coberturas para a cintura
  alternative: cintas; aventais; tangas
  rationale: O termo indica algo posto ou cingido ao redor do corpo, mas não define com precisão um tipo moderno de vestimenta. A opção escolhida evita tanto a vagueza de 'coberturas' isoladamente quanto uma imagem excessivamente específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A coordenação narrativa hebraica foi preservada sem rigidez; 'Por isso' explicita apenas a consequência imediata indicada pela sequência dos atos.
