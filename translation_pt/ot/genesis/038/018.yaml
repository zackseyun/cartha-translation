base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: pt
  text: 'Ele perguntou: “Que penhor devo dar a você?” Ela respondeu: “O seu selo, o seu cordão e o cajado que está em sua mão”. Então ele os deu a ela, teve relações com ela[a], e ela ficou grávida dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entrou a ela”, eufemismo para relações sexuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: penhor
  rationale: Designa um bem entregue como garantia até o pagamento posterior; “penhor” é preciso e natural neste contexto.
- source_word: חֹתָמְךָ
  choice: o seu selo
  rationale: Refere-se a um selo pessoal usado para identificação, sem especificar que fosse um anel-sinete.
- source_word: פְתִילֶךָ
  choice: o seu cordão
  rationale: Traduz diretamente o objeto, provavelmente associado ao selo, sem acrescentar uma relação que o hebraico não explicita.
- source_word: מַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: o cajado que está em sua mão
  rationale: Preserva a imagem concreta e a relação sintática do hebraico; “cajado” é corrente e adequado a um objeto pessoal carregado na mão.
- source_word: וַיִּתֶּן לָּהּ
  choice: ele os deu a ela
  rationale: O pronome plural recupera naturalmente, em português, os três objetos pedidos, embora o hebraico deixe o complemento implícito.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: teve relações com ela
  rationale: Comunica em português moderno o sentido do eufemismo hebraico sem reproduzir literalmente uma expressão pouco natural.
- source_word: וַתַּהַר לוֹ
  choice: ela engravidou dele
  rationale: Expressa de modo claro tanto a gravidez quanto a relação indicada por לוֹ.
