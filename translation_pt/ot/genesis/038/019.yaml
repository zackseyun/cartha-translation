  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: pt
  text: Então ela se levantou, foi embora, tirou o véu e vestiu suas roupas de viúva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: ela se levantou
  rationale: O qal wayyiqtol de קום introduz a ação seguinte na sequência narrativa; “levantou-se” é natural e mantém o movimento do hebraico.
- source_word: וַתֵּלֶךְ
  choice: foi embora
  rationale: הלך, depois de “levantou-se”, indica que ela deixou o lugar; “foi embora” expressa isso com clareza em português corrente.
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: tirou o véu
  rationale: O hifil de סור com מֵעָלֶיהָ descreve a retirada do véu que estava sobre ela. Em português, “tirou o véu” comunica naturalmente toda a ação, sem a redundância de “de cima de si”.
- source_word: וַתִּלְבַּשׁ
  choice: voltou a vestir
  rationale: לבש significa vestir ou pôr uma roupa. O contexto mostra que Tamar retomou as roupas de viúva que usava antes (38:14), justificando a explicitação contextual “voltou a”.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: suas roupas de viúva
  rationale: A construção indica as roupas associadas à condição de viúva. “Roupas de viúva” é clara, digna e mais natural que “vestes de sua viuvez” em português moderno.
