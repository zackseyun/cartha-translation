  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: pt
  text: Depois, saiu seu irmão, com o fio escarlate na mão, e ele lhe deu o nome de Zerá.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o escarlate” na mão dele; “fio” é retomado do contexto imediato, no versículo 28.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e ele chamou o nome dele Zerá”. O sujeito de “deu” não é expresso no hebraico.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: Depois
  rationale: Marca a ação subsequente de modo natural e claro em português.
- source_word: יָצָא
  choice: saiu
  rationale: No contexto do parto, “saiu” comunica de forma simples e idiomática o nascimento da criança.
- source_word: אָחִיו
  choice: o irmão dele
  rationale: Reproduz o termo de parentesco com o sufixo masculino singular, referindo-se ao outro gêmeo.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: que tinha na mão o fio escarlate
  rationale: A oração relativa identifica o irmão pelo marcador colocado em sua mão no versículo 28. “Fio” é retomado do contexto imediato, pois aqui o hebraico emprega “o escarlate” de forma elíptica.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: e recebeu o nome de
  rationale: Formulação portuguesa natural que evita atribuir indevidamente a uma personagem específica o sujeito masculino singular não expresso. A forma literal é registrada em nota.
- source_word: זָרַח
  choice: Zerá
  rationale: Transliteração tradicional e amplamente reconhecível do nome hebraico em português.
theological_decisions:
- issue: Identidade do sujeito de וַיִּקְרָא
  choice: 'Construção passiva: “recebeu o nome de”'
  alternative: “ele lhe deu o nome de” ou, literalmente, “ele chamou o nome dele”
  rationale: O verbo hebraico tem sujeito masculino singular não expresso, cuja identidade não é explicitada no versículo. A construção passiva preserva essa indeterminação sem introduzir um agente específico nem criar uma referência pronominal enganosa em português.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. “Escarlate” mantém o valor tradicional e preciso da cor, enquanto a passiva evita resolver silenciosamente a identidade do agente da nomeação.
