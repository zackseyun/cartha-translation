  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: pt
  text: Depois de muitos dias[a], morreu a filha de Sua[b], mulher de Judá. Depois que Judá foi consolado[c], ele subiu a Timna para junto dos tosquiadores de suas ovelhas, ele e seu amigo Hira, o adulamita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “os dias se tornaram muitos”. Ou: “Depois de muito tempo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a filha de Sua”; alguns entendem a expressão como o nome próprio “Bate-Sua”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “E Judá foi consolado”. O verbo hebraico indica que ele recebeu consolo depois do luto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Passado muito tempo
  rationale: Expressa naturalmente em português a ideia idiomática de que “os dias se tornaram muitos”, preservando o sentido temporal.
- source_word: וַתָּמָת
  choice: morreu
  rationale: Equivalente direto e corrente do verbo מות neste contexto narrativo.
- source_word: בַּת שׁוּעַ
  choice: a filha de Sua
  rationale: Mantém a expressão hebraica de parentesco, sem transformá-la necessariamente no nome próprio Bate-Sua.
- source_word: אֵשֶׁת יְהוּדָה
  choice: mulher de Judá
  rationale: Forma natural e digna de indicar a esposa de Judá; a aposição identifica a filha de Sua.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Depois que Judá foi consolado
  rationale: O nifal de נחם indica que Judá recebeu consolo após o luto, não que se arrependeu. A locução temporal esclarece a sequência narrativa sem alterar o sentido.
- source_word: וַיַּעַל
  choice: ele subiu
  rationale: Preserva a nuance direcional de עלה, que indica subir ou dirigir-se para um lugar mais elevado.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: ao encontro dos tosquiadores de suas ovelhas
  rationale: Representa a construção com particípio como referência às pessoas que tosquiavam o rebanho de Judá, evitando sugerir que o próprio Judá foi realizar a tosquia.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: acompanhado de seu amigo Hira
  rationale: Transmite em português natural que Hira viajou com Judá, preservando a identificação dele como amigo.
- source_word: הָעֲדֻלָּמִי
  choice: o adulamita
  rationale: Gentílico que identifica Hira como natural ou habitante de Adulão.
- source_word: תִּמְנָתָה
  choice: a Timna
  rationale: O he direcional ligado ao topônimo indica movimento em direção a Timna; em português isso é expresso pela preposição “a”.
theological_decisions:
- issue: Sentido de וַיִּנָּחֶם após a morte da esposa
  choice: foi consolado
  alternative: arrependeu-se / mudou de ideia
  rationale: Neste contexto de falecimento e luto, o verbo descreve consolo após a perda. Traduzir como arrependimento importaria um sentido inadequado ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Passado muito tempo” comunica o idiomatismo temporal; “ao encontro dos tosquiadores” preserva as pessoas como destino da viagem. Os marcadores [a], [b] e [c] aparecem no texto principal.
