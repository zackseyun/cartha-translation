base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: pt
  text: 'E Judá disse: “Que ela fique com elas, para não nos tornarmos objeto de desprezo.[a] Veja, eu mandei este cabrito, mas você não a encontrou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que não sejamos motivo de zombaria” ou “para que não caiamos em desonra”. A expressão hebraica indica tornar-se objeto de desprezo ou escárnio.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Que ela fique com essas coisas
  rationale: 'A forma verbal com לָהּ tem força permissiva: Judá consente que a mulher conserve para si os objetos dados como garantia. “Essas coisas” explicita com naturalidade o objeto implícito e plural no contexto.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: para que não sejamos motivo de desprezo
  rationale: בּוּז expressa desprezo, escárnio ou desonra pública. A formulação preserva a ideia de se tornar objeto do desprezo alheio sem restringi-la apenas ao riso.
- source_word: הִנֵּה
  choice: Eu mandei
  rationale: Neste contexto, הִנֵּה destaca a prova apresentada por Judá. Em português corrente, a ênfase é transmitida naturalmente pela declaração direta; inserir “Veja” seria possível, mas menos fluido aqui.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: Eu mandei este cabrito
  rationale: גְּדִי designa um cabrito, isto é, um bode jovem. O demonstrativo “este” reproduz הַזֶּה.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: mas você não a encontrou
  rationale: O וְ introduz aqui contraste com o envio do cabrito, por isso “mas” comunica melhor a relação discursiva. O sufixo feminino se refere à mulher procurada.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
