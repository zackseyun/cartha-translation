review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a estrutura e o sentido do hebraico. Contudo, «Para que ele também não morra» normalmente exprime finalidade em português, ao passo que פֶּן introduz o receio de Judá («para que não aconteça que...» / «com medo de que...»). A construção deve explicitar essa apreensão. «Dizia consigo» é uma explicitação interpretativa possível, mas o hebraico diz literalmente «disse» e a nota já permite assinalar o uso como raciocínio interior.
  naturalness: O texto é claro e de registro adequado. «Fique viúva» é compreensível, mas «Permaneça viúva» representa melhor o valor continuativo de שְׁבִי e soa mais natural neste contexto. «Foi e ficou morando» é aceitável, embora «foi e morou» seja mais direto.
  terminology: «Judá», «Tamar», «nora», «Selá» e «casa de seu pai» estão adequados. A nota deve corresponder à formulação traduzida e preservar que «disse» pode introduzir fala ou deliberação interior.
  issues:
  - severity: medium
    issue: «Para que ele também não morra» enfraquece ou desloca o valor apreensivo de פֶּן.
    rationale: פֶּן introduz o desfecho temido por Judá, não uma finalidade que ele pretenda produzir. «Com medo de que ele também morresse» transmite naturalmente a apreensão no passado narrativo.
  - severity: low
    issue: «Fique viúva» pode ser lido como ingresso no estado de viuvez, e não como permanência nele.
    rationale: O imperativo שְׁבִי ordena que Tamar continue/resida como viúva; «Permaneça viúva» torna esse aspecto explícito sem acrescentar sentido.
  - severity: low
    issue: «Pois dizia consigo» explicita mais do que a forma verbal hebraica, e a nota atual se torna menos alinhada à tradução.
    rationale: Manter «pois disse» preserva a redação de אָמַר; a nota pode informar que o verbo também pode introduzir um raciocínio interior.
  revised_text: 'Então Judá disse a Tamar, sua nora: “Permaneça viúva na casa de seu pai até que meu filho Selá cresça”, pois disse: “Com medo de que ele também morresse como seus irmãos.” Então Tamar foi e morou na casa de seu pai.'
  revised_footnotes:
