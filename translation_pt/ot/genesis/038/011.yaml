revisions:
- from: 'Então Judá disse a Tamar, sua nora: “Fique viúva na casa de seu pai até que meu filho Selá cresça”, pois dizia consigo[a]: “Para que ele também não morra como os irmãos.” Tamar foi e ficou morando na casa de seu pai.'
