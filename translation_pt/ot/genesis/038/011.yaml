base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: pt
  text: 'Então Judá disse a Tamar, sua nora: “Permaneça viúva na casa de seu pai até que meu filho Selá cresça”, pois disse: “Com medo de que ele também morresse como seus irmãos.” Então Tamar foi e morou na casa de seu pai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּלָּתוֹ
  choice: sua nora
  rationale: Equivalente corrente e inequívoco do termo hebraico de parentesco neste contexto.
- source_word: שְׁבִי אַלְמָנָה
  choice: Fique viúva
  rationale: O imperativo de ישׁב, acompanhado do substantivo אַלְמָנָה, ordena que Tamar permaneça na condição de viúva. A formulação é natural em português e não acrescenta a ideia de viuvez permanente.
- source_word: בֵית אָבִיךְ
  choice: na casa de seu pai
  rationale: Expressa tanto o lugar de residência quanto o vínculo com a casa paterna, preservando o idioma hebraico em português natural.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: até que meu filho Selá cresça
  rationale: Mantém o sentido básico de גדל, deixando o contexto indicar que se trata de alcançar idade suficiente, sem explicitar além do texto a finalidade matrimonial.
- source_word: כִּי אָמַר
  choice: pois dizia consigo
  rationale: אמר significa literalmente 'disse', mas aqui introduz a deliberação interior de Judá. 'Dizia consigo' comunica isso sem transformar a razão em fala dirigida a Tamar.
- source_word: פֶּן
  choice: Para que ... não
  rationale: Nesta construção de apreensão, a expressão portuguesa transmite o receio de que o resultado temido aconteça, com clareza moderna.
- source_word: כְּאֶחָיו
  choice: como os irmãos
  rationale: Preserva a comparação concisa com a morte de Er e Onã; o possessivo é naturalmente recuperado do antecedente em português.
- source_word: וַתֵּשֶׁב
  choice: ficou morando
  rationale: O verbo ישׁב aqui indica residência continuada. A formulação distingue naturalmente a execução narrativa da ordem anterior e evita o tom arcaico de 'habitou'.
- source_word: בֵּית אָבִיהָ
  choice: na casa de seu pai
  rationale: Repete a formulação da ordem de Judá e conserva a correspondência estrutural do hebraico.
theological_decisions:
- issue: Natureza da motivação de Judá em כִּי אָמַר
  choice: 'Apresentá-la como fala interior: “pois dizia consigo”'
  alternative: “pois disse” ou “pois pensou”
  rationale: O hebraico usa o verbo comum 'dizer', que também pode introduzir raciocínio interior. A tradução explicita apenas o necessário para evitar que o leitor suponha que Judá revelou essa razão a Tamar, sem substituir diretamente 'dizer' por 'pensar'.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “nora”, “fique viúva” e “ficou morando” como formas correntes; mantém “Selá”, grafia portuguesa tradicional do nome. A fala tem pontuação natural, e a nota preserva a forma literal e a ambiguidade pragmática de כִּי אָמַר.
