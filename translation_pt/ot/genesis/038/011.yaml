  rationale: A revisão preserva o imperativo de permanência, expressa o sentido de receio de פֶּן sem sugerir finalidade e retém a formulação literal de אָמַר, registrando em nota a possibilidade de fala interior. A nota foi ancorada em «disse»; o marcador deve ser inserido após essa palavra no texto final.
