  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: pt
  text: Quando Judá a viu, pensou que ela fosse uma prostituta,[a] pois ela havia coberto o rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “considerou que ela era uma prostituta”.'
