lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Quando Judá a viu
  rationale: A forma narrativa de ראה indica que Judá a viu; “Quando” expressa em português natural a relação temporal com a avaliação que vem em seguida.
- source_word: וַיַּחְשְׁבֶהָ
  choice: pensou que ela fosse
  rationale: חשב, neste contexto, descreve o juízo mental equivocado de Judá sobre a identidade dela. A construção com “fosse” é idiomática e preserva esse caráter de suposição.
- source_word: לְזוֹנָה
  choice: uma prostituta
  rationale: זֹנָה designa aqui uma prostituta. O termo é claro e atual, sem o tom arcaico de alternativas como “meretriz”.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão da conclusão de Judá. “Pois” mantém de modo natural a relação causal.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: ela havia coberto o rosto
  rationale: כסה significa “cobrir”, e a forma perfeita apresenta uma circunstância anterior que explica a inferência de Judá; o mais-que-perfeito composto comunica essa anterioridade com clareza.
