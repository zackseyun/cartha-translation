lexical_decisions:
- source_word: וַתַּהַר
  choice: Ela engravidou
  rationale: O verbo הרה indica que ela concebeu ou ficou grávida. «Engravidou» é claro, natural e corrente em português.
- source_word: עוֹד
  choice: novamente
  rationale: Neste contexto de uma sequência de nascimentos, o termo marca repetição.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: A expressão comunica de modo idiomático e digno o sentido do hebraico ילד seguido de «filho».
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Equivalente natural em português do idioma hebraico «chamou o nome dele»; o pronome feminino do verbo identifica a mãe como quem dá o nome.
- source_word: אוֹנָן
  choice: Onã
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português, com terminação nasal assinalada por til.
