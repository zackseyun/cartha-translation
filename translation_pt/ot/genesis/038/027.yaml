  text: Quando chegou o tempo de ela dar à luz, eis que havia gêmeos em seu ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Quando chegou o tempo
  rationale: A construção introduz a circunstância temporal do acontecimento seguinte. Esta formulação é natural em português e preserva a progressão narrativa sem recorrer ao arcaísmo «e aconteceu que».
- source_word: לִדְתָּהּ
  choice: de ela dar à luz
  rationale: O infinitivo de ילד com sufixo feminino singular indica o ato de ela dar à luz. «Dar à luz» é claro, corrente e adequado ao registro narrativo.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a função de הִנֵּה de chamar a atenção para uma descoberta notável ou inesperada.
- source_word: תְאוֹמִים
  choice: gêmeos
  rationale: O substantivo plural designa diretamente filhos gêmeos; «gêmeos» é a equivalência precisa e natural.
- source_word: בְּבִטְנָהּ
  choice: em seu ventre
  rationale: Embora בֶּטֶן possa indicar barriga ou ventre, o contexto de parto favorece «ventre», termo natural e digno em português.
