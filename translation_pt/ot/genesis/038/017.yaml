base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: pt
  text: 'Ele disse: “Eu enviarei um cabrito do rebanho.” Ela respondeu: “Se você me der um penhor[a] até que o envie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma garantia” ou “uma caução”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: um cabrito
  rationale: A expressão designa um filhote de cabra. “Cabrito” é a forma natural, precisa e corrente em português.
- source_word: מִן הַצֹּאן
  choice: do rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. Como o animal já foi identificado como cabrito, “do rebanho” evita redundância.
- source_word: עֵרָבוֹן
  choice: um penhor
  rationale: O termo indica um objeto entregue como garantia temporária do cumprimento de uma promessa. “Penhor” preserva essa função concreta no contexto narrativo.
- source_word: עַד שָׁלְחֶךָ
  choice: até que o envie
  rationale: A construção se refere ao ato futuro de Judá enviar o cabrito prometido. O pronome “o” explicita em português o referente já expresso.
- source_word: אִם תִּתֵּן
  choice: Se você me der
  rationale: Mantém a condição formulada por Tamar. O objeto indireto “me” é exigido pela naturalidade do português e está implícito na situação.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Eu enviarei
  rationale: O pronome independente אָנֹכִי recebe representação explícita por “Eu”, preservando sua possível ênfase, enquanto o futuro expressa a promessa.
