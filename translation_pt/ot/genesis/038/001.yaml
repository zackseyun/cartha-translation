translation:
  language: pt
  text: Naquele tempo, Judá desceu de junto de seus irmãos e dirigiu-se a um adulamita chamado Hira.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E aconteceu, naquele tempo, que Judá desceu de junto de seus irmãos e desviou-se para junto de um adulamita chamado Hira.”'
    reason: lexical_alternative
  - marker: b
    text: Ou “um homem de Adulão”; o hebraico pode simplesmente identificá-lo por sua origem, embora a expressão também possa apresentá-lo como um indivíduo específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: A fórmula narrativa introduz um novo episódio e situa os acontecimentos no tempo; a forma concisa é natural em português, enquanto a formulação mais explícita é preservada em nota.
- source_word: וַיֵּרֶד
  choice: afastou-se
  rationale: Embora ירד tenha normalmente o sentido direcional de “descer”, em combinação com מֵאֵת אֶחָיו o contexto destaca a saída de Judá do convívio dos irmãos. A nota preserva a tradução formal “desceu de junto de”.
- source_word: מֵאֵת אֶחָיו
  choice: de seus irmãos
  rationale: Expressa separação em relação aos irmãos de Judá, mantendo o termo familiar masculino do hebraico.
- source_word: וַיֵּט עַד
  choice: foi até
  rationale: Neste contexto, נטה com עַד descreve o movimento de Judá em direção a uma pessoa. “Foi até” comunica isso com naturalidade; “desviou-se para junto de” seria mais formal, porém menos corrente.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: um adulamita
  rationale: אִישׁ seguido do gentílico identifica um homem originário de Adulão. Em português, o substantivo gentílico já implica a pessoa, sem necessidade de acrescentar “homem”; a possível nuance de indivíduo particular é indicada em nota.
- source_word: וּשְׁמוֹ חִירָה
  choice: chamado Hira
  rationale: Integra a identificação nominal à frase anterior de modo natural, conservando integralmente sua função.
- source_word: חִירָה
  choice: Hira
  rationale: Transliteração portuguesa clara do nome hebraico, com tonicidade natural na penúltima sílaba.
