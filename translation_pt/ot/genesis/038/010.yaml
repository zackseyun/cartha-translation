source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: pt
  text: O que ele fez foi mau aos olhos de Yahweh, e Yahweh também o matou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: era mau
  rationale: Expressa diretamente a avaliação moral do ato, sem suavizá-la como mero desagrado.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação divina e é uma expressão natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר עָשָׂה
  choice: O que ele fez
  rationale: Retoma de maneira clara e idiomática a ação de Onã narrada no contexto anterior.
- source_word: וַיָּמֶת
  choice: Yahweh ... o matou
  rationale: O hifil de מות é causativo e atribui diretamente a morte de Onã a Yahweh; repetir o sujeito evita a possível ambiguidade do pronome em português.
- source_word: גַּם אֹתוֹ
  choice: também o
  rationale: 'Mantém a ligação com o juízo anterior sobre Er: Onã também foi morto.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração preserva essa identificação sem substituir o nome por um título.
- issue: Agência divina em וַיָּמֶת
  choice: Yahweh também o matou
  alternative: Yahweh também o fez morrer; e ele também morreu
  rationale: A forma causativa atribui a morte diretamente a Yahweh. A tradução não atenua essa agência, embora 'o matou' seja mais direta em português do que 'o fez morrer'.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo causal do hebraico e sua avaliação moral direta. A repetição de 'Yahweh' esclarece que o agente de 'matou' é Deus, não o antecedente masculino Onã.
