base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: pt
  text: 'Enquanto ela estava sendo levada para fora, mandou dizer ao sogro: “Estou grávida do homem a quem pertencem estas coisas”. E disse: “Reconheça, por favor,[a] de quem são este sinete, estes cordões e este cajado”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Identifique, por favor”. O verbo hebraico pode significar reconhecer ou identificar; aqui, o pedido tem uma força incisiva, semelhante à apresentação de uma prova.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: estava sendo levada para fora
  rationale: O particípio passivo descreve a ação em andamento. A formulação preserva o sentido de retirada para a punição sem explicitar além do hebraico para onde ela era levada.
- source_word: שָׁלְחָה אֶל חָמִיהָ לֵאמֹר
  choice: mandou dizer ao sogro
  rationale: Expressa de modo idiomático o envio de uma mensagem ao sogro, sem sugerir que Tamar foi pessoalmente até ele.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Estou grávida do homem a quem pertencem estas coisas
  rationale: Torna natural em português a construção possessiva e conserva a afirmação explícita de que o dono dos objetos é o pai da criança.
- source_word: הַכֶּר נָא
  choice: Reconheça, por favor
  rationale: Preserva o sentido básico de נכר e o pedido marcado por נָא, além da provável ressonância narrativa de Gênesis 37:32. A alternativa forense ‘identifique’ é registrada em nota.
- source_word: חֹתֶמֶת
  choice: sinete
  rationale: Designa um selo pessoal usado para autenticação e identificação. Evita especificar que fosse necessariamente um anel, detalhe não expresso pelo substantivo hebraico.
- source_word: פְּתִילִים
  choice: cordões
  rationale: Mantém o plural hebraico e se ajusta aos cordões associados ao sinete.
- source_word: מַטֶּה
  choice: cajado
  rationale: Equivalente corrente e adequado ao objeto pessoal no contexto patriarcal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. ‘Sogro’, ‘grávida’, ‘sinete’, ‘cordões’ e ‘cajado’ mantêm precisão sem arcaísmo excessivo. A repetição demonstrativa foi vertida de forma idiomática, e a ambiguidade lexical de הַכֶּר foi preservada em nota.
