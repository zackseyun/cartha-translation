  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: pt
  text: Ali Judá viu a filha de um homem cananeu, cujo nome era Sua[a]. Ele a tomou e teve relações sexuais com ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “e o nome dele era Sua”; o nome se refere ao homem cananeu, não à filha.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “entrou a ela”, expressão idiomática para relações sexuais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o sentido direto de ראה na sequência narrativa; “conheceu” ou “encontrou” acrescentaria uma ideia não expressa pelo verbo.
- source_word: שָׁם
  choice: ali
  rationale: Equivalente natural do advérbio de lugar no contexto narrativo.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: a filha de um homem cananeu
  rationale: Preserva explicitamente a relação de filiação e a identificação do pai como cananeu.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: cujo nome era Sua
  rationale: Reproduz de perto a construção hebraica e deixa claro que Sua é o nome do homem cananeu, não o da filha.
- source_word: וַיִּקָּחֶהָ
  choice: ele a tomou
  rationale: Conserva a formulação ampla de לקח, que neste contexto pode sugerir tomá-la por mulher, sem transformar essa implicação em afirmação explícita.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: teve relações com ela
  rationale: Expressa em português atual o sentido reconhecido do eufemismo hebraico, evitando o pouco natural “entrou a ela”.
theological_decisions:
- issue: Se o ato de Judá deve ser explicitamente descrito como casamento
  choice: Manter “ele a tomou” sem acrescentar “por esposa”
  alternative: “casou-se com ela” ou “tomou-a por esposa”
  rationale: O contexto pode apontar para casamento, mas o verbo do versículo diz literalmente que ele a tomou; a redação preserva essa margem sem impor uma especificação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “cujo nome era Sua” evita a ambiguidade sobre quem recebe o nome; “teve relações com ela” comunica naturalmente o idioma hebraico, enquanto a nota registra sua forma literal.
