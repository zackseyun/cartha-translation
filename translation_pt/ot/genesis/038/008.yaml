  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: pt
  text: 'Então Judá disse a Onã: “Una-se à mulher de seu irmão, cumpra para com ela o dever de cunhado[a] e dê descendência a seu irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em termos mais técnicos, “cumpra para com ela o dever do levirato”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בֹּא אֶל
  choice: Una-se a
  rationale: O idiomatismo hebraico indica relações sexuais no contexto conjugal. “Una-se a” comunica isso com dignidade e clareza, sem explicitação excessivamente clínica.
- source_word: אֵשֶׁת אָחִיךָ
  choice: a mulher de seu irmão
  rationale: Tradução direta e natural da construção hebraica; “mulher” preserva aqui o sentido de esposa conforme o contexto.
- source_word: וְיַבֵּם אֹתָהּ
  choice: cumpra para com ela o dever de cunhado
  rationale: O verbo técnico יִבֵּם designa o cumprimento da obrigação familiar do cunhado. A formulação é compreensível e mantém o caráter jurídico-familiar sem depender do termo acadêmico “levirato”.
- source_word: וְהָקֵם זֶרַע
  choice: dê descendência
  rationale: No idiomatismo, קום com זֶרַע se refere a suscitar ou assegurar descendência ao irmão falecido. “Dê descendência” soa natural em português e preserva a finalidade da ordem.
- source_word: לְאָחִיךָ
  choice: a seu irmão
  rationale: A preposição ל indica que a descendência seria atribuída ao irmão falecido; a formulação portuguesa é concisa e fiel.
theological_decisions:
- issue: Tradução da terminologia do casamento levirato sem acrescentar elaboração jurídica ou doutrinária posterior
  choice: cumpra para com ela o dever de cunhado
  alternative: cumpra para com ela o dever do levirato; tome-a como mulher segundo o dever de cunhado
  rationale: O verbo hebraico é técnico e engloba a obrigação familiar de gerar descendência para o irmão falecido. A escolha mantém essa dimensão sem reduzir a ordem apenas ao casamento ou ao ato sexual e sem exigir que o leitor conheça o termo “levirato”.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação evita arcaísmos e conserva o caráter técnico-familiar do mandamento.
