  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: pt
  text: Er, o primogênito de Judá, era mau aos olhos de Yahweh, e Yahweh o matou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Yahweh fez com que ele morresse”.'
    reason: Alternativa lexical que explicita a forma causativa do verbo hebraico.
lexical_decisions:
- source_word: וַיְהִי
  choice: era
  rationale: O waw consecutivo dá continuidade à narrativa; em português, o verbo copulativo no imperfeito comunica naturalmente a condição de Er sem acrescentar um marcador temporal ausente no hebraico.
- source_word: עֵר
  choice: Er
  rationale: O nome pessoal é transliterado.
- source_word: בְּכוֹר יְהוּדָה
  choice: o primogênito de Judá
  rationale: A cadeia construta expressa filiação e ordem de nascimento; esta formulação é clara e natural em português.
- source_word: רַע
  choice: mau
  rationale: Neste contexto de avaliação divina, o termo designa mal moral, não simples infortúnio ou baixa qualidade.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem idiomática hebraica e comunica que a avaliação é feita por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְמִתֵהוּ
  choice: o matou
  rationale: O hifil de מות atribui diretamente a Yahweh a causação da morte de Er. “O matou” é claro e idiomático; a forma causativa mais literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem trocá-lo por um título.
- issue: Agência divina na morte de Er
  choice: Yahweh o matou
  alternative: Yahweh fez com que ele morresse
  rationale: A construção causativa hebraica atribui explicitamente a morte de Er à ação de Yahweh. A tradução mantém essa agência sem explicar o meio nem acrescentar uma justificativa não declarada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Aos olhos de” conserva a imagem hebraica; “o matou” evita eufemismo e mantém a agência direta do texto.
