base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: pt
  text: Então ela tirou de si as roupas de viúva, cobriu-se com um véu, envolveu-se nele e sentou-se à entrada de Enaim[a], que fica no caminho de Timna. Pois viu que Selá já havia crescido, mas ela não lhe tinha sido dada como esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enaim é provavelmente o nome de um lugar. O hebraico pode também ser relacionado a «olhos» ou «fontes»; a identificação exata do local é incerta.
    reason: Registra a incerteza lexical e toponímica de עֵינַיִם sem deslocar a provável leitura toponímica do texto principal.
lexical_decisions:
- source_word: וַתָּסַר בִּגְדֵי אַלְמְנוּתָהּ מֵעָלֶיהָ
  choice: tirou de si as roupas de viúva
  rationale: Reproduz tanto a retirada das vestes quanto o elemento reflexivo de מֵעָלֶיהָ, em português natural.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: cobriu-se com um véu, envolveu-se
  rationale: 'Mantém os dois verbos distintos do hebraico: primeiro cobrir-se com o véu e depois envolver ou disfarçar a própria aparência, sem reduzir ambos a uma única ação.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: à entrada de Enaim
  rationale: Lê עֵינַיִם como nome de lugar, de acordo com o contexto e com a construção 'entrada de'; a incerteza toponímica é registrada em nota.
- source_word: אֲשֶׁר עַל דֶּרֶךְ תִּמְנָתָה
  choice: que fica no caminho de Timna
  rationale: Expressa de modo idiomático a localização junto à rota que conduzia a Timna.
- source_word: וְהִוא לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: mas ela não lhe tinha sido dada como esposa
  rationale: Preserva a forma passiva e o contraste do hebraico, sem explicitar um agente que o texto não nomeia.
theological_decisions:
- issue: Motivo e caracterização moral da ação de Tamar
  choice: 'Traduzir apenas a sequência narrativa e a razão declarada: Selá crescera, mas Tamar não lhe fora dada.'
  alternative: Acrescentar que Tamar se disfarçou de prostituta ou qualificar moralmente sua conduta.
  rationale: Este versículo não usa o termo 'prostituta' nem apresenta um juízo moral explícito; antecipar a interpretação dos versículos seguintes resolveria indevidamente a tensão narrativa.
- issue: Agente de 'não lhe tinha sido dada'
  choice: Manter a construção passiva sem identificar quem deixou de dá-la a Selá.
  alternative: Explicitar que Judá não a deu a Selá.
  rationale: Embora o contexto aponte para Judá, a oração hebraica deste versículo não declara o agente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se a repetição deliberada das ações, a passiva final e a sobriedade narrativa do hebraico.
