base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: pt
  text: 'Ele perguntou aos homens daquele lugar: “Onde está a prostituta cultual[a] que estava em Enaim[b], junto ao caminho?” Eles responderam: “Não houve prostituta cultual aqui.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostituta sagrada” ou “prostituta do templo”. O termo hebraico designa uma prostituta associada a uma prática de culto; “cultual” não pressupõe que houvesse ali um edifício de templo.
    reason: lexical_alternative
  - marker: b
    text: Enaim é um nome de lugar. A forma hebraica está relacionada à palavra que significa “olhos” e talvez também possa se referir a “fontes”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Ele perguntou
  rationale: Forma narrativa natural em português para o verbo שׁאל, introduzindo a busca de informações.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: aos homens daquele lugar
  rationale: Expressa de modo natural o sentido local da construção hebraica literalmente equivalente a “os homens do lugar dela”, sem criar em português uma associação possessiva pouco clara.
- source_word: לֵאמֹר
  choice: (não expresso separadamente)
  rationale: O infinitivo hebraico que introduz a fala direta é representado de modo idiomático pelos dois-pontos; acrescentar “dizendo” seria desnecessário em português atual.
- source_word: הַקְּדֵשָׁה
  choice: a prostituta cultual
  rationale: Preserva a associação da mulher com uma prática de culto e distingue קְדֵשָׁה de זֹנָה, termo usado em outros pontos do capítulo. “Cultual” não pressupõe a existência de um templo específico.
- source_word: בָעֵינַיִם
  choice: em Enaim
  rationale: O contexto favorece a leitura como topônimo, conforme Gênesis 38:14; por isso, o nome é transliterado em vez de traduzido literalmente.
- source_word: עַל הַדָּרֶךְ
  choice: junto ao caminho
  rationale: Comunica a localização ao lado da via de maneira clara e natural.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Nunca houve prostituta cultual aqui
  rationale: Reproduz a negação enfática dos moradores quanto à presença de tal mulher naquele lugar, em diálogo português natural.
theological_decisions:
- issue: Natureza da designação קְדֵשָׁה
  choice: prostituta cultual
  alternative: prostituta do templo; prostituta sagrada; prostituta
  rationale: A escolha mantém a possível vinculação ao culto sem afirmar uma estrutura de templo não mencionada no texto nem apagar a diferença lexical em relação ao termo comum para prostituta.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Os marcadores foram posicionados junto aos termos que explicam.
