base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: pt
  text: 'Cerca de três meses depois, Judá foi informado: “Tamar, sua nora, prostituiu-se[a] e, além disso, está grávida em consequência de prostituição[b]”. Então Judá disse: “Tragam-na para fora, e que seja queimada!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiu como prostituta”; em sentido mais amplo, “cometeu imoralidade sexual”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está grávida por causa de atos de prostituição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Cerca de três meses depois
  rationale: Expressa de modo natural a progressão narrativa e preserva a aproximação indicada por כְּ.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: disseram a Judá
  rationale: Converte a construção passiva hebraica em uma formulação portuguesa corrente, sem identificar quem apresentou a denúncia.
- source_word: זָנְתָה
  choice: prostituiu-se
  rationale: Preserva a imagem específica de prostituição do verbo זנה, em vez de generalizá-la como mera imoralidade sexual.
- source_word: כַּלָּתֶךָ
  choice: sua nora
  rationale: Equivalente direto e natural do termo de parentesco.
- source_word: וְגַם הִנֵּה
  choice: e, além disso
  rationale: Comunica a ênfase e o caráter adicional da segunda acusação sem recorrer ao pouco natural 'e eis que' neste contexto.
- source_word: הָרָה לִזְנוּנִים
  choice: está grávida em consequência de prostituição
  rationale: Mantém a relação causal e a repetição do campo lexical de זנה/זנונים, embora a expressão hebraica admita mais de uma formulação em português.
- source_word: הוֹצִיאוּהָ
  choice: Tragam-na para fora
  rationale: Preserva o imperativo plural e o movimento para fora expresso pelo verbo.
- source_word: וְתִשָּׂרֵף
  choice: e que seja queimada
  rationale: Reproduz a forma passiva e a força de ordem ou sentença, sem especificar os agentes da execução.
theological_decisions:
- issue: Terminologia da acusação sexual
  choice: prostituiu-se / em consequência de prostituição
  alternative: cometeu imoralidade sexual / engravidou em consequência disso
  rationale: As formas cognatas זָנְתָה e זְנוּנִים evocam especificamente prostituição, seja como descrição literal, seja como linguagem acusatória. A tradução mantém essa tensão e a ligação lexical.
- issue: Natureza da ordem de Judá
  choice: Tragam-na para fora, e que seja queimada!
  alternative: Levem-na para fora para ser queimada!
  rationale: A formulação escolhida conserva duas ordens coordenadas e a voz passiva da segunda, apresentando com clareza a severidade da sentença sem acrescentar detalhes de procedimento ou agência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação dos marcadores junto às expressões que explicam corrige a associação aparente dos marcadores na camada inglesa de consulta.
