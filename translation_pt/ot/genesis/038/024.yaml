    text: 'Ou: “agiu como prostituta”; em sentido mais amplo, “cometeu imoralidade sexual”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está grávida por causa de atos de prostituição”.'
    reason: lexical_alternative
  revision_rationale: A revisão limita-se a substituir a formulação ativa “disseram a Judá” por “Judá foi informado”, preservando o caráter passivo e os informantes não identificados no hebraico. Mantêm-se as demais escolhas, inclusive os marcadores e as notas, pois refletem adequadamente as alternativas lexicais relevantes.
