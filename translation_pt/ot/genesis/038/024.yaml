revisions:
- from: 'Cerca de três meses depois, disseram a Judá: “Tamar, sua nora, prostituiu-se[a] e, além disso, está grávida em consequência de prostituição[b]”. Então Judá disse: “Tragam-na para fora, e que seja queimada!”'
  to: 'Cerca de três meses depois, Judá foi informado: “Tamar, sua nora, prostituiu-se[a] e, além disso, está grávida em consequência de prostituição[b]”. Então Judá disse: “Tragam-na para fora, e que seja queimada!”'
  rationale: A revisão limita-se a substituir a formulação ativa “disseram a Judá” por “Judá foi informado”, preservando o caráter passivo e os informantes não identificados no hebraico. Mantêm-se as demais escolhas, inclusive os marcadores e as notas, pois refletem adequadamente as alternativas lexicais relevantes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:00Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a acusação formulada com os cognatos de זנה, a gravidez atribuída a essa acusação e a ordem passiva de que Tamar seja queimada. Contudo, “disseram a Judá” transforma desnecessariamente o relato passivo e indefinido (וַיֻּגַּד לִיהוּדָה) numa construção ativa; “Judá foi informado” representa mais diretamente o hebraico sem sugerir agentes específicos.
  naturalness: O texto é claro e de registro adequado. “Está grávida em consequência de prostituição” é compreensível, embora um tanto formal; pode ser mantido por sua precisão causal e pela ligação lexical com “prostituiu-se”.
  terminology: “Prostituiu-se” e “prostituição” mantêm a força e a repetição lexical da acusação hebraica, sem a reduzir à expressão mais ampla “imoralidade sexual”. “Nora” e “que seja queimada” são adequados; a última conserva a voz passiva da ordem.
  issues:
  - severity: low
    issue: A forma “disseram a Judá” substitui a construção passiva e impessoal do hebraico.
    rationale: וַיֻּגַּד לִיהוּדָה significa que uma informação foi comunicada a Judá, sem identificar os informantes. “Judá foi informado” é igualmente natural em português e mais próximo da forma e da indefinição do texto-fonte.
  revised_text: 'Cerca de três meses depois, Judá foi informado: “Tamar, sua nora, prostituiu-se[a] e, além disso, está grávida em consequência de prostituição[b]”. Então Judá disse: “Tragam-na para fora, e que seja queimada!”'
  revised_footnotes:
