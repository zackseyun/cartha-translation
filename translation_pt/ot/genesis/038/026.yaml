  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: pt
  text: 'Então Judá os reconheceu e disse: “Ela é mais justa do que eu[a], pois não a dei a meu filho Selá.” E não voltou a ter relações com ela[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela tem mais razão do que eu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “conhecê-la”, eufemismo para ter relações sexuais.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: os reconheceu
  rationale: O verbo נכר indica que Judá reconheceu os objetos dados como garantia, mencionados no versículo anterior. O pronome “os” explicita esse objeto subentendido no hebraico.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Ela é mais justa do que eu
  rationale: A construção comparativa com מִן apresenta Tamar como mais justa, ou mais no direito, do que Judá nessa situação. A formulação preserva a ligação lexical com a ideia de justiça sem transformar a declaração em um juízo absoluto sobre o caráter dela.
- source_word: כִּי עַל כֵּן
  choice: pois
  rationale: Neste contexto, a expressão introduz a razão da confissão de Judá. “Pois” transmite com naturalidade sua força explicativa e causal.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: não a dei a meu filho Selá
  rationale: Mantém de perto a expressão hebraica; o contexto narrativo deixa claro que se trata de dá-la em casamento.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: E não voltou a ter relações com ela
  rationale: ידע, “conhecer”, funciona aqui como eufemismo hebraico para relações sexuais. A formulação portuguesa comunica claramente o sentido, enquanto “não voltou” representa a ideia de não tornar a fazê-lo.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: שֵׁלָה
  choice: Selá
  rationale: Transliteração portuguesa corrente do nome hebraico.
theological_decisions:
- issue: Avaliação moral na confissão de Judá
  choice: Judá reconhece que Tamar foi mais justa do que ele nessa situação.
  alternative: “Ela tem mais razão do que eu.”
  rationale: A comparação é situacional e preserva a força moral de צדק, sem declarar Tamar absolutamente inocente ou sem pecado.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez natural para leitores brasileiros e compreensão internacional. A ordem narrativa e a concisão do hebraico foram preservadas, esclarecendo apenas objetos e eufemismos exigidos pelo português.
