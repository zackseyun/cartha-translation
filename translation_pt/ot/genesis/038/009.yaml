base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: pt
  text: Mas Onã sabia que a descendência não seria dele[a]. Por isso, sempre que se unia à mulher de seu irmão, deixava o sêmen se perder no chão[b], para não dar descendência ao irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “semente”. Aqui, o termo se refere à descendência ou a um herdeiro que seria considerado filho do irmão falecido.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente que ele “arruinava” ou “destruía” [algo] no chão; o objeto não é expresso, mas o contexto indica o sêmen e o propósito de impedir a concepção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: sabia
  rationale: Tradução direta e natural de ידע no contexto narrativo.
- source_word: הַזָּרַע / זֶרַע
  choice: a descendência / descendência
  rationale: Embora o termo hebraico signifique literalmente «semente», nas duas cláusulas ele designa a descendência atribuída ao irmão falecido no contexto do casamento levirato.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: a descendência não seria dele
  rationale: Preserva a formulação hebraica e comunica que o descendente seria juridicamente considerado do irmão falecido, não de Onã.
- source_word: וְהָיָה אִם־בָּא
  choice: sempre que se unia
  rationale: Expressa o caráter habitual ou repetido da ação passada, sem reproduzir de modo artificial a construção hebraica.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: se unia à mulher de seu irmão
  rationale: Eufemismo português claro e digno para a relação sexual indicada pela expressão hebraica «entrar a».
- source_word: וְשִׁחֵת אַרְצָה
  choice: deixava o sêmen se perder no chão
  rationale: שחת tem o sentido de arruinar ou desperdiçar. O objeto está implícito; «sêmen» torna compreensível o ato físico no contexto, enquanto «se perder» conserva a nuance verbal sem sugerir mero derramamento acidental.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: para não dar descendência ao irmão
  rationale: Reproduz claramente a finalidade da ação e mantém o sentido familiar e jurídico de זרע.
theological_decisions:
- issue: A natureza do ato de Onã e o sentido de זרע
  choice: Traduzir זרע nas cláusulas familiares como «descendência» e explicitar «sêmen» apenas como objeto implícito do ato físico.
  alternative: Empregar «semente» em todas as ocorrências ou dizer apenas «derramava isso no chão».
  rationale: O versículo distingue a descendência juridicamente atribuída ao irmão falecido do meio físico usado por Onã para impedir a concepção. A tradução deixa essa relação clara sem acrescentar uma avaliação doutrinária sobre o ato.
- issue: Valor iterativo de וְהָיָה אִם־בָּא
  choice: «sempre que se unia»
  alternative: «quando se uniu» ou «se entrasse».
  rationale: A construção no relato descreve conduta habitual, aspecto relevante para o sentido do episódio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Se unia» preserva o caráter eufemístico do hebraico; «sêmen» evita um pronome de referência obscura. O nome «Onã» segue a acentuação portuguesa usual.
