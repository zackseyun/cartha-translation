translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O eufemismo hebraico foi vertido pelo sentido para evitar em português uma formulação artificial ou potencialmente ambígua; a nota registra a expressão literal. Todos os marcadores de nota aparecem no texto principal.
