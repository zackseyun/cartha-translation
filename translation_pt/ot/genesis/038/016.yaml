base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: pt
  text: 'Então ele se dirigiu a ela, à beira do caminho, e disse: “Por favor, deixe-me deitar-me com você”[a], pois não sabia que ela era sua nora. Ela disse: “O que você me dará[b] para se deitar comigo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entrar a você”; expressão eufemística para relações sexuais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O que você me pagará...?” Mais literalmente, o hebraico diz: “O que você me dará...?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: ele se desviou do caminho e foi até ela
  rationale: נטה descreve Judá desviando-se de seu trajeto em direção a Tamar; a formulação natural em português preserva tanto o movimento quanto o cenário junto à estrada.
- source_word: הָבָה־נָּא
  choice: Por favor, deixe-me
  rationale: A combinação expressa solicitação ou insistência; esta forma é atual e mantém o tom direto.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלָי
  choice: ter relações com você / comigo
  rationale: No contexto, בוא אל é um eufemismo inequívoco para relações sexuais. Uma tradução funcional comunica o sentido com clareza e dignidade em português moderno.
- source_word: כִּי לֹא יָדַע
  choice: pois não sabia
  rationale: כִּי introduz a explicação narrativa da conduta de Judá.
- source_word: כַלָּתוֹ
  choice: sua nora
  rationale: É o termo de parentesco preciso neste contexto.
- source_word: מַה תִּתֶּן לִּי
  choice: O que você me dará
  rationale: Preserva o verbo amplo נתן, 'dar', sem explicitar no texto principal a ideia contextual de pagamento.
- source_word: כִּי תָבוֹא אֵלָי
  choice: para ter relações comigo
  rationale: O כִּי desta pergunta introduz o propósito ou condição daquilo que será dado; 'para' resulta natural em português.
