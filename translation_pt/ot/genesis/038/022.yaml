base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: pt
  text: 'Então ele voltou a Judá e disse: “Não a encontrei. Além disso, os homens do lugar disseram: ‘Aqui não havia nenhuma prostituta cultual[a]’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico qedeshá, termo relacionado a “consagrada” ou “santa”. Seu sentido preciso é debatido; tradicionalmente é traduzido por “prostituta cultual” e, por vezes, por “prostituta do templo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Então ele voltou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אֶל־יְהוּדָה
  choice: a Judá
  rationale: אֶל indica direção, e “Judá” é a forma portuguesa tradicional do nome pessoal.
- source_word: לֹא מְצָאתִיהָ
  choice: Não a encontrei
  rationale: O perfeito negado relata uma ação passada concluída, sem acrescentar a ideia modal de incapacidade.
- source_word: וְגַם
  choice: Além disso
  rationale: Preserva a força aditiva do hebraico em português natural, introduzindo o segundo elemento do relato.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: os homens do lugar
  rationale: Mantém o masculino plural específico do hebraico e a referência aos moradores locais consultados.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Aqui não havia nenhuma
  rationale: A construção existencial nega a presença de tal mulher naquele lugar; “aqui” traduz idiomaticamente בָזֶה.
- source_word: קְדֵשָׁה
  choice: prostituta cultual
  rationale: Distingue o termo de זֹנָה no contexto e conserva sua associação cultual, sem restringi-la necessariamente a uma instituição templária formal.
theological_decisions:
- issue: Natureza exata da קְדֵשָׁה
  choice: prostituta cultual, com nota explicativa
  alternative: mulher consagrada; prostituta do templo
  rationale: A tradução principal comunica a distinção contextual e a provável associação entre sexo e culto, enquanto a nota preserva a forma mais literal e evita apresentar “templo” como elemento explícito do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Além disso” evita o pouco natural “e também” neste relato; “prostituta cultual” conserva a distinção lexical do contexto, esclarecida em nota.
