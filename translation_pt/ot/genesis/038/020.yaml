base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: pt
  text: Então Judá enviou o cabrito por meio de seu amigo adulamita[a], para recuperar o penhor[b] da mão da mulher, mas ele não a encontrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de seu amigo adulamita”, expressão que significa “por meio de seu amigo adulamita”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a garantia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: גְּדִי הָעִזִּים
  choice: o cabrito
  rationale: A expressão designa um filhote de cabra; “cabrito” é a forma corrente e precisa em português.
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: por meio de seu amigo adulamita
  rationale: בְּיַד é uma expressão de agência, literalmente “pela mão de”. “Por meio de” comunica o sentido idiomático, enquanto “amigo” traduz naturalmente רֵעַ neste contexto.
- source_word: לָקַחַת
  choice: para recuperar
  rationale: O infinitivo indica propósito; no contexto, Judá pretende reaver o objeto deixado como garantia.
- source_word: הָעֵרָבוֹן
  choice: o penhor
  rationale: O termo denota um objeto entregue como garantia. “Penhor” conserva esse sentido jurídico e concreto de modo conciso.
- source_word: מִיַּד הָאִשָּׁה
  choice: da mão da mulher
  rationale: Mantém a imagem concreta do hebraico e indica que o penhor estava em posse da mulher.
- source_word: וְלֹא מְצָאָהּ
  choice: mas ele não a encontrou
  rationale: “Mas” torna explícito o contraste entre a finalidade da missão e seu resultado frustrado; o sufixo feminino refere-se à mulher.
theological_decisions: []
