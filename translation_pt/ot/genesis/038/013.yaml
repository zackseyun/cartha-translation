  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: pt
  text: 'E disseram a Tamar: “Veja,[a] seu sogro está subindo para Timna a fim de tosquiar suas ovelhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que”.'
    reason: Alternativa lexical para הִנֵּה, que pode ser representado por uma fórmula apresentativa mais solene.
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: Então disseram a Tamar
  rationale: O hofal de נגד apresenta a informação de modo passivo e impessoal. Em português corrente, a construção com sujeito indeterminado preserva o caráter reportivo com mais naturalidade do que “foi dito a Tamar”.
- source_word: לֵאמֹר
  choice: introdução do discurso direto com dois-pontos
  rationale: A fórmula hebraica introduz as palavras comunicadas; em português natural, essa função é expressa pelos dois-pontos, sem o pesado “dizendo”.
- source_word: הִנֵּה
  choice: Veja
  rationale: Interjeição que chama a atenção da destinatária para a notícia; “Veja” mantém essa força discursiva em linguagem moderna.
- source_word: חָמִיךְ
  choice: seu sogro
  rationale: O substantivo e o sufixo feminino singular identificam explicitamente a relação de parentesco com Tamar.
- source_word: עֹלֶה
  choice: está subindo
  rationale: O particípio qal indica movimento em curso ou iminente, e “subindo” conserva a nuance direcional do verbo עלה.
- source_word: תִמְנָתָה
  choice: para Timna
  rationale: O nome do lugar com ה direcional indica movimento para Timna.
- source_word: לָגֹז
  choice: a fim de tosquiar
  rationale: O infinitivo construto com ל expressa a finalidade da viagem.
- source_word: צֹאנוֹ
  choice: as ovelhas dele
  rationale: צאן pode designar o rebanho de pequenos animais, mas o contexto de tosquia favorece especificamente “ovelhas”; “dele” deixa claro que pertencem ao sogro mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção impessoal “disseram a Tamar” comunica naturalmente o passivo reportivo hebraico; “a fim de” explicita sem exagero a relação de finalidade.
