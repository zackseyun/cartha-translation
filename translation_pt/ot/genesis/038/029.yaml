base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: pt
  text: 'Quando ele recolheu a mão, eis que seu irmão saiu. Então ela exclamou: “Que brecha você abriu para si!”[a] E foi-lhe dado o nome de Perez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, a exclamação repete a raiz פרץ: “Que brecha você abriu para si!” O nome Perez deriva da mesma raiz.'
    reason: wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: quando ele recolheu a mão
  rationale: O particípio hifil de שוב com יָד descreve a retirada da mão. “Recolheu a mão” é concreto, natural e apropriado ao contexto do parto.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A expressão assinala surpresa e torna a cena vívida; “eis que” conserva essa função narrativa em português digno e compreensível.
- source_word: יָצָא אָחִיו
  choice: seu irmão saiu
  rationale: No contexto do nascimento, יָצָא indica a saída física da criança. A formulação simples evita linguagem arcaica.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Que brecha você abriu para si!
  rationale: A tradução preserva a exclamação, a construção incomum com עָלֶיךָ e a repetição semântica da raiz פרץ, da qual também deriva o nome Perez.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português. A nota explicita o jogo de palavras hebraico que a transliteração não consegue reproduzir.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: E foi-lhe dado o nome de Perez
  rationale: A forma passiva natural em português preserva a fórmula de nomeação sem introduzir uma identidade específica para o sujeito não expresso no contexto imediato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Conserva-se “eis que” para a surpresa narrativa e mantém-se, tanto quanto possível, o jogo lexical que prepara o nome Perez.
