  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: pt
  text: Ela engravidou e deu à luz um filho, e ele lhe deu o nome de Er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o verbo traduzido por «ele lhe deu o nome» está no masculino singular; o sujeito mais natural é Judá.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Ela engravidou
  rationale: O verbo הרה indica conceber ou ficar grávida. «Engravidou» é natural, claro e corrente em português moderno.
- source_word: וַתֵּלֶד
  choice: e deu à luz
  rationale: O Qal de ילד significa dar à luz. Esta é a formulação narrativa mais natural em português.
- source_word: בֵּן
  choice: um filho
  rationale: בן designa aqui um descendente masculino; «um filho» preserva diretamente a relação familiar.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: e ele lhe deu o nome de
  rationale: A expressão hebraica é literalmente «e ele chamou o nome dele». A formulação escolhida é idiomática em português e mantém explícito o sujeito masculino singular.
- source_word: עֵר
  choice: Er
  rationale: Transliteração portuguesa convencional do nome hebraico עֵר.
theological_decisions:
- issue: Sujeito de וַיִּקְרָא («e chamou»).
  choice: 'Mantém-se o sujeito masculino: «ele lhe deu o nome de Er», entendido mais naturalmente como Judá.'
  alternative: Algumas traduções empregam o feminino («ela lhe deu o nome») ou evitam indicar o sujeito («recebeu o nome»).
  rationale: O verbo hebraico está no masculino singular, em contraste com os verbos femininos anteriores. A tradução preserva essa mudança gramatical sem resolver além do necessário a referência do pronome.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Deu à luz» e «deu o nome de» oferecem naturalidade sem perder a distinção gramatical do hebraico.
