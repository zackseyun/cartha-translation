base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: pt
  text: 'E aconteceu que, enquanto ela dava à luz, um deles estendeu a mão[a]. A parteira pegou um fio escarlate e o amarrou na mão dele, dizendo: “Este saiu primeiro.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mão saiu”. O hebraico diz literalmente “deu uma mão”, expressão que descreve a mão do bebê aparecendo durante o parto.'
    reason: lexical_alternative
  - marker: b
    text: O fio escarlate servia como marca visível para identificar qual dos gêmeos havia aparecido primeiro.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: enquanto ela dava à luz
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de terceira pessoa feminina singular expressa uma circunstância temporal durante o parto. A formulação é natural em português e mantém o aspecto em curso.
- source_word: וַיִּתֶּן יָד
  choice: um deles estendeu a mão
  rationale: A expressão idiomática descreve a mão de um dos gêmeos emergindo durante o parto. “Um deles” evita identificar antecipadamente qual criança era e “estendeu a mão” reproduz de modo natural a forma verbal masculina singular.
- source_word: הַמְיַלֶּדֶת
  choice: a parteira
  rationale: É o equivalente português corrente e preciso para a mulher que assiste ao parto.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: pegou um fio escarlate e o amarrou na mão dele
  rationale: שָׁנִי designa material de cor escarlate; “fio” explicita naturalmente o objeto implícito no contexto. A retomada pronominal evita uma construção pesada.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Este saiu primeiro
  rationale: Mantém o demonstrativo e o sentido ordinal/adverbial sem introduzir o conceito técnico de primogenitura, que não está expresso nesta frase.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva a indefinição sobre qual dos gêmeos estendeu a mão e evita usar “primogênito”, termo mais carregado do que o hebraico neste versículo.
