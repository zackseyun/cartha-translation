  text: Judá tomou uma esposa para Er, seu primogênito, e o nome dela era Tamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: escolheu
  rationale: No contexto, Judá toma a iniciativa de obter uma esposa para o filho. “Escolheu uma esposa para” expressa naturalmente em português o sentido contextual sem tornar Judá o marido.
- source_word: אִשָּׁה
  choice: uma esposa
  rationale: O contexto matrimonial exige o sentido específico de “esposa”, não o sentido geral de “mulher”.
- source_word: לְעֵר
  choice: para Er
  rationale: A preposição לְ indica aqui aquele em favor de quem Judá age; “para Er” reproduz esse valor de modo natural.
- source_word: בְּכוֹרוֹ
  choice: seu filho primogênito
  rationale: Explicita que Er era o filho primogênito de Judá, mantendo a nuance familiar e sucessória de בְּכוֹר.
- source_word: וּשְׁמָהּ
  choice: O nome dela era
  rationale: É uma forma corrente e clara de verter a fórmula hebraica de identificação nominal.
- source_word: תָּמָר
  choice: Tamar
  rationale: Mantém a forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi dividida em duas frases para fluidez, sem perda de conteúdo. “Escolheu” comunica o arranjo matrimonial implícito no hebraico, embora o verbo básico tenha o sentido de “tomar”.
