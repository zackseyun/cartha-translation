base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: pt
  text: Ela deu à luz mais um filho e lhe deu o nome de Selá. Ele[a] estava em Quezibe[b] quando ela lhe deu à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme alguns testemunhos antigos e intérpretes: “Ela estava em Quezibe quando lhe deu à luz”. O texto hebraico diz literalmente “ele estava”, mas a identidade do sujeito é discutida.'
    reason: alternative_reading
  - marker: b
    text: Quezibe também pode ser transliterado como Kezib; as duas formas se referem ao mesmo lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Ela deu à luz mais um filho
  rationale: A construção com יסף + עוד indica repetição ou acréscimo da ação. Em português, “deu à luz mais um filho” expressa com naturalidade a sequência de novos nascimentos sem introduzir explicitamente uma concepção que o hebraico não menciona.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: e lhe deu o nome de Selá
  rationale: Equivalente português natural da fórmula hebraica “chamou o nome dele”, preservando o ato de nomear e transliterando o nome pessoal.
- source_word: וְהָיָה
  choice: Ele estava
  rationale: A forma hebraica é masculina singular. A tradução mantém esse dado do texto massorético sem identificar explicitamente o referente, cuja interpretação é discutida.
- source_word: בִכְזִיב
  choice: em Quezibe
  rationale: O topônimo é transliterado numa forma natural em português; “em” é a preposição idiomática para localização.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: quando ela deu à luz o menino
  rationale: O infinitivo construto com בְּ tem valor temporal. “O menino” retoma de modo claro o filho recém-mencionado e evita a sequência menos fluida “quando ela o deu à luz”.
theological_decisions:
- issue: Referente do sujeito masculino em וְהָיָה
  choice: Manter “Ele”, conforme a forma masculina do texto hebraico, sem explicitar que se trata de Judá
  alternative: “Ela estava”, conforme alguns testemunhos antigos e intérpretes
  rationale: A tradução principal segue o texto massorético, mas a nota preserva a antiga leitura ou interpretação feminina e a ambiguidade histórica, sem resolver além da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A formulação narrativa é natural, enquanto as notas preservam a variante do topônimo e a tensão textual sobre o sujeito de “estava”.
