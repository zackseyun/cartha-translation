  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: pt
  text: 'Então Isaque chamou Jacó, abençoou-o, ordenou-lhe e lhe disse: “Não tome por esposa nenhuma das filhas de Canaã[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, das mulheres cananeias. Em hebraico, literalmente, “das filhas de Canaã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: קרא com אֶל e uma pessoa significa chamar ou convocar. “Chamou” é natural no contexto narrativo e não acrescenta uma formalidade ausente do texto.
- source_word: וַיְבָרֶךְ
  choice: abençoou-o
  rationale: ברך é o verbo comum para “abençoar”; a forma pronominal preserva o objeto explícito hebraico.
- source_word: וַיְצַוֵּהוּ
  choice: lhe ordenou
  rationale: צוה expressa uma ordem ou determinação com autoridade; “lhe ordenou” preserva essa força paterna.
- source_word: וַיֹּאמֶר לוֹ
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente a fala direta em português. O conteúdo de “e disse-lhe” já fica funcionalmente expresso após “lhe ordenou”, evitando repetição pesada sem perder informação discursiva.
- source_word: לֹא תִקַּח
  choice: Não tome
  rationale: O imperfeito com לֹא tem aqui força proibitiva. “Não tome” comunica uma ordem direta em português moderno e mantém o verbo empregado pelo hebraico.
- source_word: אִשָּׁה
  choice: por esposa
  rationale: Neste contexto matrimonial, אִשָּׁה significa “esposa”. A construção “tomar por esposa” é clara, digna e semanticamente próxima do hebraico.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: nenhuma das filhas de Canaã
  rationale: A expressão significa literalmente “das filhas de Canaã” e designa mulheres cananeias. “Nenhuma” explicita naturalmente em português o alcance da proibição sem alterar seu sentido.
- source_word: וַ
  choice: Então
  rationale: O waw inicial dá continuidade à sequência narrativa; “Então” expressa de modo natural essa progressão em português.
