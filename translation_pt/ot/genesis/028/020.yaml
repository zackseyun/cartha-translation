base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: pt
  text: 'Então Jacó fez um voto, dizendo: “Se Deus estiver comigo, me guardar[a] nesta jornada que estou fazendo[b], me der pão[c] para comer e roupa para vestir,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “velar por mim” ou “me proteger”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “neste caminho em que estou andando”; aqui, refere-se à jornada de Jacó.
    reason: lexical_alternative
  - marker: c
    text: “Pão” também pode representar alimento em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Jacó fez um voto
  rationale: O verbo נדר acompanhado do substantivo cognato נֶדֶר exprime idiomaticamente a realização de um voto solene. “Fez um voto” é natural em português e mantém explícito o ato formal.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente e digna de introduzir o conteúdo do voto.
- source_word: אִם
  choice: Se
  rationale: Preserva diretamente a forma condicional hebraica sem transformar a fala de Jacó em certeza nem acentuar uma suposta dúvida.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Deus estiver comigo
  rationale: O referente é o Deus que apareceu a Jacó no contexto anterior; a construção portuguesa com futuro do subjuntivo é natural depois de “se”.
- source_word: וּשְׁמָרַנִי
  choice: me guardar
  rationale: שׁמר abrange guardar, proteger ou velar por alguém. “Guardar” conserva a amplitude lexical e se encaixa na sequência condicional.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: nesta jornada que estou fazendo
  rationale: דֶּרֶךְ significa literalmente “caminho”, mas neste contexto designa a viagem de Jacó. A formulação mantém a oração relativa e soa natural em português.
- source_word: וְנָתַן לִי
  choice: me der
  rationale: O futuro do subjuntivo continua naturalmente a condição iniciada por “se” e preserva a relação sintática do hebraico.
- source_word: לֶחֶם לֶאֱכֹל
  choice: pão para comer
  rationale: Mantém o termo concreto לֶחֶם e o infinitivo de finalidade, sem excluir a possibilidade de “pão” representar alimento em sentido amplo.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: e roupa para vestir
  rationale: “Roupa” comunica naturalmente o substantivo coletivo בֶגֶד, e “para vestir” reproduz o complemento infinitivo.
theological_decisions:
- issue: Natureza condicional do voto de Jacó
  choice: Traduzir אִם diretamente por “Se”
  alternative: “Quando” ou “visto que”
  rationale: A forma condicional do hebraico deve permanecer perceptível. A tradução não decide se Jacó fala com incerteza, confiança ou negociação, preservando a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência “estiver comigo, me guardar... me der...” usa o futuro do subjuntivo próprio de uma condição real ou aberta. A vírgula e as aspas finais permanecem abertas porque o voto continua no versículo seguinte.
