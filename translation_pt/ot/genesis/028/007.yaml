base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: pt
  text: e que Jacó deu ouvidos ao seu pai e à sua mãe[a] e foi para Padã-Arã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obedeceu ao seu pai e à sua mãe”. Neste contexto, o verbo hebraico pode indicar tanto ouvir como atender ao que foi dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: deu ouvidos
  rationale: Com אֶל, שׁמע indica escutar com atenção e, neste contexto, atender à orientação recebida. “Deu ouvidos” preserva a ligação entre ouvir e acatar sem reduzir o sentido exclusivamente a “obedeceu”.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: a seu pai e a sua mãe
  rationale: A formulação mantém explícitos os dois pais e representa naturalmente em português a preposição repetida e os sufixos possessivos hebraicos.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: É a tradução direta e natural de הלך no contexto narrativo, sem acrescentar a ideia mais específica de partir ou viajar.
- source_word: פַּדֶּנָה אֲרָם
  choice: para Padã-Arã
  rationale: O topônimo é transliterado, e o sufixo direcional hebraico é expresso por “para”. A grafia adapta o nome à leitura portuguesa.
- source_word: וַ
  choice: e
  rationale: O waw dá continuidade à sequência e à estrutura sintaticamente dependente do contexto anterior; “e” preserva essa ligação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação adequada à continuidade sintática do versículo anterior. “Deu ouvidos” conserva a nuance auditiva e responsiva do hebraico; “Padã-Arã” usa transliteração adaptada ao português.
