  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: pt
  text: Sua descendência será como o pó da terra, e você se espalhará para o oeste, para o leste, para o norte e para o sul; e em você e em sua descendência todas as famílias da terra serão abençoadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as famílias da terra abençoarão a si mesmas em você e em sua descendência”. O verbo hebraico também pode ser entendido em sentido reflexivo ou médio.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: será
  rationale: O perfeito Qal com conjunção, neste contexto de promessa, tem valor futuro; “será” expressa isso de modo natural.
- source_word: זַרְעֲךָ / וּבְזַרְעֶךָ
  choice: sua descendência / em sua descendência
  rationale: זֶרַע é um substantivo coletivo que pode designar a prole ou os descendentes. “Descendência” preserva esse caráter coletivo sem recorrer ao arcaísmo “semente” nem explicitar um plural ausente no hebraico.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: como o pó da terra
  rationale: Mantém a imagem hebraica de quantidade incontável e corresponde à formulação natural em português.
- source_word: וּפָרַצְתָּ
  choice: você se espalhará
  rationale: פרץ sugere irromper ou expandir-se. No contexto da expansão em todas as direções, “se espalhará” comunica a imagem com clareza sem torná-la excessivamente literal.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: para o oeste, para o leste, para o norte e para o sul
  rationale: As terminações direcionais indicam movimento. A sequência dos quatro pontos cardeais é mantida na ordem do hebraico.
- source_word: וְנִבְרֲכוּ
  choice: serão abençoadas
  rationale: O nifal de ברך é entendido no texto principal em sentido passivo, leitura natural na fórmula patriarcal de promessa; a possibilidade reflexiva ou média é preservada em nota.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: em você e em sua descendência
  rationale: A tradução conserva a preposição ב como “em”, evitando impor a interpretação mais explícita “por meio de”.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: todas as famílias da terra
  rationale: “Famílias” comunica naturalmente os grupos de parentesco, e “terra” expressa o alcance universal da fórmula neste contexto.
theological_decisions:
- issue: Sentido da fórmula patriarcal de bênção com ברך no nifal
  choice: 'Leitura passiva: “todas as famílias da terra serão abençoadas”'
  alternative: 'Leitura reflexiva ou média: “todas as famílias da terra abençoarão a si mesmas”'
  rationale: O sentido passivo é plausível e direto no contexto da promessa da aliança. Como a forma hebraica também admite discussão quanto a um sentido reflexivo ou médio, a alternativa é registrada em nota, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “você” evita solenidade artificial; a estrutura coordenada e a ordem das direções preservam o ritmo da promessa hebraica.
