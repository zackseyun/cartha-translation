  source_fidelity: 'O texto traduz fielmente os elementos centrais do hebraico: a descendência coletiva comparada ao pó da terra, a expansão nas quatro direções na ordem hebraica e a fórmula de bênção que inclui Jacó e sua descendência. «Será como», «você se espalhará» e «em você e em sua descendência» preservam adequadamente o valor promissório e as relações sintáticas do original.'
