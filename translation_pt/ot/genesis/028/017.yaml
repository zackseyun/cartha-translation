base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: pt
  text: 'E ele ficou com medo e disse[a]: “Como este lugar inspira temor! Isto não é outra coisa senão a casa de Deus, e esta é a porta dos céus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teve temor e disse”. O verbo hebraico pode expressar medo, temor ou reverência.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “a porta do céu”, referindo-se ao âmbito celestial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: ficou com medo
  rationale: Expressa de modo natural a reação de Jacó e preserva o sentido narrativo de temor, sem reduzi-lo apenas à reverência.
- source_word: מַה נּוֹרָא
  choice: Como este lugar inspira temor
  rationale: נוֹרָא pode indicar algo temível, assombroso ou digno de reverência. A formulação preserva a tensão entre medo e assombro reverente, evitando o uso coloquial de “incrível”.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Tradução direta e idiomática do sintagma demonstrativo.
- source_word: אֵין זֶה כִּי אִם
  choice: Isto não é outra coisa senão
  rationale: Reproduz a identificação restritiva e enfática do idioma hebraico em português natural e solene.
- source_word: בֵּית אֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém de forma transparente a construção hebraica e sua ressonância sagrada, sem sugerir que já houvesse ali um santuário construído.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: a porta dos céus
  rationale: Preserva o plural formal do hebraico שָׁמַיִם e mantém a imagem de acesso ao âmbito celestial.
theological_decisions:
- issue: Sentido de אֱלֹהִים neste contexto
  choice: Deus
  alternative: deuses
  rationale: Embora אֱלֹהִים tenha forma plural, o contexto da visão e da aliança de Jacó indica claramente o Deus singular.
- issue: Nuance de נוֹרָא em contexto sagrado
  choice: inspira temor
  alternative: é terrível; é assombroso; é impressionante
  rationale: A escolha mantém juntas as ideias de medo, assombro e reverência diante da presença divina, sem resolver a expressão em terror puramente negativo nem em admiração casual.
- issue: Número em שַׁעַר הַשָּׁמָיִם
  choice: porta dos céus
  alternative: porta do céu
  rationale: O plural conserva mais visivelmente a forma hebraica, enquanto a nota esclarece a alternativa idiomática em português para o âmbito celestial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Inspira temor” evita tanto o coloquialismo de “incrível” quanto o sentido exclusivamente negativo de “terrível”. Todos os marcadores de nota aparecem no texto.
