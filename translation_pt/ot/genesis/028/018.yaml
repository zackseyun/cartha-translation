  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: pt
  text: Jacó levantou-se bem cedo pela manhã, pegou a pedra que havia colocado junto à cabeça, ergueu-a como coluna[a] e derramou óleo sobre o topo dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedra erguida”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sobre a cabeça dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: levantou-se bem cedo pela manhã
  rationale: O verbo indica levantar-se ou começar cedo, e a expressão temporal especifica a manhã. A formulação conserva ambas as ideias em português claro.
- source_word: הָאֶבֶן
  choice: a pedra
  rationale: Trata-se de um substantivo definido no singular, retomando a pedra mencionada no contexto anterior.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: que havia colocado junto à cabeça
  rationale: A expressão hebraica situa a pedra na região da cabeça, mas não exige que se especifique que estava diretamente debaixo dela.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: ergueu-a como coluna
  rationale: מַצֵּבָה designa uma pedra colocada em posição vertical. A tradução expressa tanto a ação quanto o uso resultante, sem acrescentar uma função não declarada.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: derramou óleo
  rationale: Reproduz diretamente a ação descrita. Traduzir por 'ungiu' acrescentaria uma interpretação ritual que o verbo empregado não explicita.
- source_word: עַל רֹאשָׁהּ
  choice: sobre o topo dela
  rationale: O hebraico diz literalmente 'sobre a cabeça dela'; em referência a uma pedra ou coluna, 'topo' é a expressão natural em português.
theological_decisions:
- issue: Possível significado cultual de מַצֵּבָה e do derramamento de óleo
  choice: Descrever a ação sem avaliá-la nem explicitar uma consagração ritual
  alternative: Traduzir como 'pedra memorial' ou dizer que Jacó 'a ungiu'
  rationale: O versículo relata que Jacó ergueu a pedra e derramou óleo sobre ela. A tradução não deve antecipar uma avaliação positiva ou negativa nem impor uma função teológica além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A sequência verbal foi condensada sob um único sujeito, preservando o ritmo rápido do hebraico. Emprega-se “junto à cabeça” para evitar especificar indevidamente que a pedra estava debaixo da cabeça.
