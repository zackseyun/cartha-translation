base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: pt
  text: 'Então Jacó despertou do sono e disse: “De fato,[a] Yahweh está neste lugar, e eu não sabia!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente”. A expressão introduz a constatação repentina e enfática de Jacó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: despertou
  rationale: O verbo indica acordar do sono; “despertou” é natural, conciso e adequado ao registro narrativo.
- source_word: מִשְּׁנָתוֹ
  choice: do sono
  rationale: Traduz diretamente a origem ou estado do qual Jacó despertou, em português idiomático.
- source_word: אָכֵן
  choice: De fato
  rationale: A partícula introduz uma constatação enfática e repentina. “De fato” comunica bem a percepção de Jacó sem exagerar a certeza para além do hebraico.
- source_word: יֵשׁ
  choice: está
  rationale: A partícula existencial, nesta construção, afirma a presença de Yahweh no lugar; “está” é a forma mais natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Expressa de modo direto e natural o local específico onde Jacó dormiu e recebeu o sonho.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: Mantém a coordenação hebraica e a ênfase do pronome independente, contrastando a presença de Yahweh com a ignorância anterior de Jacó.
- source_word: לֹא יָדָעְתִּי
  choice: eu não sabia
  rationale: Expressa naturalmente a falta de conhecimento anterior de Jacó. Em português, não é necessário acrescentar um objeto pronominal, pois o contexto o torna claro.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal, sem substituí-lo pelo título tradicional.
- issue: Natureza da afirmação sobre a presença divina
  choice: “Yahweh está neste lugar”
  alternative: “Yahweh se manifestou neste lugar”
  rationale: A tradução mantém a afirmação existencial do hebraico e não a reduz a uma manifestação temporária nem define de que modo Yahweh está presente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A exclamação final comunica a surpresa da descoberta sem acrescentar conteúdo conceitual ao hebraico.
