  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: pt
  text: Que ele dê a você e à sua descendência, com você, a bênção de Abraão, para que você tome posse[a] da terra em que vive como estrangeiro, a qual Deus deu a Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “herdar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Que ele dê
  rationale: O valor volitivo da forma verbal, no contexto de uma bênção, expressa desejo ou oração. Em português, “Que ele dê” comunica isso com naturalidade; a conjunção inicial fica absorvida pela continuidade do discurso.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: a bênção de Abraão
  rationale: Reproduz de modo transparente a cadeia construta hebraica e preserva sua ressonância pactual.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: a você e à sua descendência com você
  rationale: “Descendência” expressa o sentido coletivo de זֶרַע, enquanto “com você” é mantido por estar explicitamente presente no hebraico.
- source_word: לְרִשְׁתְּךָ
  choice: para que você tome posse
  rationale: O infinitivo com לְ indica finalidade ou resultado. No contexto da terra, “tomar posse” comunica diretamente a aquisição de posse, sem excluir a nuance de herança.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: a terra em que vive como estrangeiro
  rationale: מָגוּר designa residência temporária ou condição de estrangeiro residente. Esta formulação é mais clara no português atual do que uma reprodução nominal como “terra de suas peregrinações” e preserva o motivo patriarcal.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: a qual Deus deu a Abraão
  rationale: Tradução direta da oração relativa, com “Deus” para אֱלֹהִים.
theological_decisions:
- issue: Ressonância pactual da promessa abraâmica
  choice: Manter “a bênção de Abraão” e a linguagem concreta de tomar posse da terra.
  alternative: Explicitar como “a bênção prometida a Abraão” ou traduzir o verbo por “herdar”.
  rationale: A formulação conserva a ligação explícita com Abraão sem acrescentar ao texto uma explicação interpretativa. “Tomar posse” representa o sentido verbal imediato, enquanto a possível nuance de herança é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “vive como estrangeiro” evita o sentido moderno potencialmente impreciso de simples viagem associado a “peregrinação” e conserva a condição de residente temporário indicada pelo hebraico.
