  terminology: “Bênção de Abraão”, “descendência”, “tomar posse” e “Deus” são escolhas apropriadas. “Terra em que você vive como estrangeiro” comunica com clareza a condição de residência estrangeira expressa por מְגוּרִים, sem importar conotações doutrinárias.
