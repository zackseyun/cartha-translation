  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: pt
  text: E eis que estou com você. Eu o protegerei por onde quer que você vá e o trarei de volta a esta terra. Pois não o deixarei[a] até que eu tenha feito o que lhe disse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o abandonarei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o que falei a você”; como a fala contém promessas, algumas traduções trazem “o que lhe prometi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função discursiva e a vivacidade da partícula hebraica. Embora ligeiramente solene, a expressão é clara e apropriada à fala divina.
- source_word: אָנֹכִי עִמָּךְ
  choice: estou com você
  rationale: Expressa naturalmente a presença pessoal enfatizada pelo pronome independente, sem tornar a frase artificial com 'eu mesmo'.
- source_word: וּשְׁמַרְתִּיךָ
  choice: Eu o protegerei
  rationale: שׁמר abrange guardar, vigiar e proteger. 'Protegerei' comunica de modo atual e natural a ação protetora, sem restringi-la à mera observação.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: por onde quer que você vá
  rationale: Formulação idiomática em português que transmite a abrangência espacial da expressão hebraica.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: o trarei de volta
  rationale: Preserva a força causativa do hifil de שוב em português natural.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: a esta terra
  rationale: Neste contexto patriarcal, אֲדָמָה designa o território ao qual Jacó retornará, não apenas o solo físico.
- source_word: כִּי
  choice: Pois
  rationale: Mantém a relação explicativa entre a garantia de presença e o compromisso que se segue.
- source_word: לֹא אֶעֱזָבְךָ
  choice: não o deixarei
  rationale: É a tradução mais ampla e natural de עזב neste contexto; 'abandonarei' permanece como alternativa possível.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: até que eu tenha feito
  rationale: Reproduz naturalmente em português o limite temporal e a conclusão futura da ação.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: o que lhe disse
  rationale: Mantém o sentido básico de 'falar/dizer' sem explicitar interpretativamente 'prometer', embora o conteúdo da fala seja uma promessa.
theological_decisions:
- issue: Linguagem de presença, proteção e fidelidade pactual
  choice: Expressar diretamente a presença, a proteção, o retorno e o cumprimento da palavra divina, sem ampliar nem estreitar seu alcance teológico.
  alternative: Empregar linguagem mais tradicional, como 'não o desampararei', ou explicitar 'o que lhe prometi'.
  rationale: A redação conserva os elementos teológicos presentes no hebraico, mas evita importar ecos posteriores ou formular uma doutrina além do que o versículo afirma.
- issue: Possível implicação temporal de עַד, 'até que'
  choice: Manter literalmente 'até que', como limite relativo ao cumprimento da palavra.
  alternative: Parafrasear para impedir que o leitor suponha que Deus deixaria Jacó depois do cumprimento.
  rationale: O hebraico não afirma que a presença divina cessará depois desse ponto; porém, a tradução deve preservar a construção temporal genuína em vez de resolver silenciosamente uma possível inferência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa 'você' para o singular e conserva 'eis que' como traço moderadamente solene do discurso bíblico. Os marcadores [a] e [b] aparecem no texto principal.
