  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: pt
  text: 'Esaú viu que Isaque tinha abençoado Jacó e o enviado a Padã-Arã para tomar para si uma esposa de lá e que, ao abençoá-lo, lhe ordenara: “Não tome mulher dentre as filhas de Canaã[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre as mulheres cananeias”. O hebraico diz literalmente “dentre as filhas de Canaã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Esaú viu
  rationale: O wayyiqtol de ראה dá continuidade à narrativa; o português não exige um marcador discursivo adicional.
- source_word: בֵרַךְ
  choice: tinha abençoado
  rationale: O mais-que-perfeito composto deixa claro que a bênção ocorreu antes de Esaú tomar conhecimento dela.
- source_word: וְשִׁלַּח אֹתוֹ
  choice: e o enviado
  rationale: Coordena-se com “tinha abençoado”; a elipse do auxiliar é natural em português e mantém a anterioridade.
- source_word: פַּדֶּנָה אֲרָם
  choice: a Padã-Arã
  rationale: Transliteração corrente e legível do topônimo, com a terminação direcional expressa pela preposição “a”.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: para tomar de lá uma mulher para si
  rationale: Preserva a oração de finalidade, a origem indicada por מִשָּׁם e a nuance reflexiva de לוֹ.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: ao abençoá-lo
  rationale: Expressa de modo natural a circunstância temporal indicada por בְּ.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: lhe havia ordenado
  rationale: צוה tem força de ordem; o mais-que-perfeito situa a ordem no ato anterior da bênção. Os dois-pontos vertem naturalmente o introdutor hebraico לֵאמֹר.
- source_word: לֹא תִקַּח
  choice: Não tome
  rationale: O presente do subjuntivo com “não” é a forma idiomática de uma proibição direta em português.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: entre as filhas de Canaã
  rationale: Mantém a imagem literal e a identificação coletiva do hebraico, usando “entre” para comunicar que não deveria escolher esposa dentre esse grupo.
