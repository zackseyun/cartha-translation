  source_fidelity: A tradução reproduz adequadamente a progressão narrativa, a dupla apresentação vívida por «eis que», a estrutura de ascensão, o contraste terra–céu, os anjos de Deus e o movimento contínuo de subida e descida. Contudo, «estava apoiada na terra» pode sugerir uma escada encostada ou sustentada contra algo, nuance que o particípio hebraico מֻצָּב («posta/colocada/assentada») não expressa. «Estava assentada na terra» conserva melhor a posição estabelecida da estrutura sem acrescentar essa imagem.
  naturalness: «Então ele sonhou», «eis que», «seu topo chegava ao céu» e «subiam e desciam por ela» são claros e naturais em português moderno de registro bíblico moderadamente solene. «Assentada na terra» é fluente e mais preciso neste contexto do que «apoiada na terra».
  terminology: «Escada» é uma escolha legítima para סֻלָּם, enquanto a nota preserva apropriadamente a maior amplitude do termo. «Anjos de Deus» é correto no contexto visionário. A nota sobre «sobre ele» registra a possibilidade gramatical do pronome hebraico sem privilegiar uma interpretação teológica posterior.
