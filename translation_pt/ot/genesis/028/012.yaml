  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: pt
  text: 'Então ele sonhou: eis que uma escada[a] estava assentada na terra, e seu topo chegava ao céu; e eis que os anjos de Deus subiam e desciam por ela[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escadaria”. O termo hebraico pode designar, de modo mais geral, uma estrutura usada para subir e descer.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “sobre ele”; no contexto, porém, o antecedente mais natural é a escada.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Então ele sonhou
  rationale: A forma narrativa faz a história avançar; “Então” expressa essa sequência com naturalidade em português.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a apresentação vívida e repentina dos elementos vistos no sonho, em registro digno e ainda corrente.
- source_word: סֻלָּם
  choice: escada
  rationale: O termo indica uma estrutura de subida e descida sem definir precisamente sua forma. “Escada” mantém a imagem tradicional e, em português, pode designar mais de um tipo de estrutura de acesso; a alternativa mais ampla é registrada em nota.
- source_word: מֻצָּב אַרְצָה
  choice: estava apoiada na terra
  rationale: A construção retrata a escada colocada firmemente com sua base na terra. “Apoiada na terra” comunica essa disposição de modo natural, sem sugerir necessariamente o ato de montá-la.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: e seu topo chegava ao céu
  rationale: “Topo” é o equivalente idiomático de “cabeça” para um objeto, e o imperfeito descritivo em português reproduz a extensão vista no sonho.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: os anjos de Deus
  rationale: Neste contexto visionário, מַלְאָךְ designa seres celestiais, por isso “anjos” é mais preciso que o sentido genérico “mensageiros”.
- source_word: עֹלִים וְיֹרְדִים
  choice: subiam e desciam
  rationale: Os particípios hebraicos apresentam movimento contínuo dentro da visão; o imperfeito português expressa naturalmente essa cena em andamento.
- source_word: בּוֹ
  choice: por ela
  rationale: O sufixo masculino singular retoma mais naturalmente סֻלָּם, masculino em hebraico. Em português, “por ela” descreve com clareza o movimento ao longo da escada; a possível referência pessoal é preservada em nota.
theological_decisions:
- issue: Imagem de סֻלָּם
  choice: escada
  alternative: escadaria; estrutura de subida
  rationale: O hebraico não especifica uma escada estreita com degraus ou travessas. O texto principal conserva a imagem tradicional sem impor detalhes estruturais, e a nota explicita a amplitude lexical.
- issue: Referente de בּוֹ
  choice: por ela
  alternative: sobre ele
  rationale: A escada é o antecedente contextual mais próximo e natural. Como a forma hebraica também pode, gramaticalmente, significar “sobre ele”, a tradução não elimina essa possibilidade, mas a registra em nota sem introduzir no texto principal uma associação teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Eis que” conserva a vivacidade solene da visão; o restante da frase evita arcaísmos e mantém a cadência narrativa.
