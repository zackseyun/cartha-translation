base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: pt
  text: E chamou aquele lugar de Betel[a], mas antes o nome da cidade era Luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel significa “casa de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: chamou ... de
  rationale: O hebraico emprega literalmente “chamou o nome de”, uma construção de nomeação. Em português atual, “chamou ... de” comunica o mesmo sentido com naturalidade, sem precisar reproduzir o objeto interno “o nome”.
- source_word: הַמָּקוֹם הַהוּא
  choice: aquele lugar
  rationale: Preserva tanto o substantivo מָקוֹם, “lugar”, quanto o demonstrativo הַהוּא, em formulação natural.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Adota a forma tradicional e amplamente reconhecida do topônimo em português; seu significado é esclarecido em nota.
- source_word: וְאוּלָם
  choice: mas
  rationale: Expressa de modo conciso o contraste introduzido pela partícula hebraica.
- source_word: לוּז
  choice: Luz
  rationale: Mantém a forma tradicional portuguesa do nome próprio.
- source_word: שֵׁם הָעִיר
  choice: o nome da cidade
  rationale: Representa diretamente a relação genitiva do hebraico.
- source_word: לָרִאשֹׁנָה
  choice: antes
  rationale: No contexto, indica o nome anterior da cidade. “Antes” é claro e corrente em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção idiomática “chamou ... de” evita o decalque pouco natural “chamou o nome daquele lugar”, mantendo plenamente a ação de nomear.
