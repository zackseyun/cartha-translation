- source_word: בְּנוֹת כְּנָעַן
  choice: as filhas de Canaã
  rationale: Preserva a expressão familiar e étnico-geográfica do hebraico, em linguagem compreensível em português.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém o idioma hebraico de avaliação ou apreciação, também natural em português.
- source_word: יִצְחָק אָבִיו
  choice: Isaque, seu pai
  rationale: Conserva a ordem do hebraico, com pontuação que torna a aposição natural e inequívoca em português.
