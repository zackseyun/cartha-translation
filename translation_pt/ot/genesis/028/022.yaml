  - severity: high
    issue: A nota b usa «dizimarei», termo sem o sentido pretendido no português moderno.
    rationale: Em português corrente, «dizimar» significa aniquilar ou reduzir drasticamente, não dar um décimo. A alternativa deve empregar «dar o dízimo» ou formulação equivalente.
