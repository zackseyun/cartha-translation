  verdict: revise
  source_fidelity: 'O texto traduz com precisão os elementos principais: a pedra erguida como maṣṣēbâ, a designação «casa de Deus», o que Deus der a Jacó e a promessa enfática de separar um décimo para Deus. Convém explicitar no texto português que a décima parte é tirada de «tudo», refletindo o sufixo objeto em עַשֵּׂר אֲעַשְּׂרֶנּוּ.'
  naturalness: 'A redação é clara e de registro apropriado. Porém, «certamente te darei a décima parte» pode soar incompleta em português, pois não explicita de que a décima parte é dada. A nota «certamente o dizimarei para ti» não é natural: «dizimar» normalmente significa destruir uma grande parte e não é a forma adequada para esta promessa.'
  terminology: «Coluna» é uma opção aceitável para מַצֵּבָה neste contexto, e «casa de Deus» preserva a formulação sem impor uma interpretação posterior. «Décima parte» é uma boa escolha não institucional; «dízimo» pode constar apenas como alternativa lexical clara na nota.
