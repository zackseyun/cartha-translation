  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: pt
  text: E esta pedra, que ergui como coluna, será casa de Deus[a]; e, de tudo o que me deres, certamente te darei a décima parte de tudo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «será uma casa de Deus».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «certamente te darei o dízimo de tudo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצֵּבָה
  choice: coluna
  rationale: Designa uma pedra erguida como monumento ou marco. “Coluna” é conciso, concreto e compreensível no contexto, sem acrescentar a ideia interpretativa de memorial.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: será casa de Deus
  rationale: Mantém de perto a construção hebraica e soa natural em português. A ausência de artigo preserva alguma abertura entre a designação definida “casa de Deus” e a possível leitura “uma casa de Deus”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto do voto de Jacó, refere-se ao Deus que lhe apareceu, e não a uma divindade genérica.
- source_word: תִּתֶּן לִי
  choice: me deres
  rationale: O futuro do subjuntivo é idiomático em português depois de “tudo o que” com referência futura e conserva o sentido do voto condicionado pelo contexto anterior.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: certamente te darei a décima parte
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a promessa. “Certamente” expressa essa ênfase, enquanto “a décima parte” é transparente para leitores atuais.
- source_word: לָךְ
  choice: te darei
  rationale: O pronome indica Deus como destinatário da décima parte; a colocação com o verbo “dar” é natural em português.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: esta pedra, que ergui
  rationale: “Ergui” comunica que Jacó pôs a pedra em posição vertical, em vez de apenas colocá-la em algum lugar.
theological_decisions:
- issue: Natureza do voto de Jacó a respeito da pedra
  choice: A pedra “será casa de Deus”, sem explicar de que modo ela ou o local recebe essa função sagrada.
  alternative: A própria pedra se tornará um santuário; ou o texto prediz diretamente um templo posterior.
  rationale: A formulação preserva a afirmação hebraica e sua tensão, sem introduzir uma teologia posterior do templo nem definir além do texto a relação entre a pedra, o lugar e a casa de Deus.
- issue: Sentido da promessa da décima parte
  choice: Jacó promete dar a Deus a décima parte de tudo o que receber, com ênfase explícita na certeza da promessa.
  alternative: Empregar terminologia institucional, como “dizimar”, que pode sugerir sistemas legais ou eclesiásticos posteriores.
  rationale: A tradução expressa a dedicação de um décimo sem projetar sobre Gênesis práticas mosaicas ou eclesiásticas posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Me deres” e “te darei” são formas naturais sem perder solenidade. A ordem e a repetição estrutural do hebraico foram preservadas quando compatíveis com a fluidez em português.
