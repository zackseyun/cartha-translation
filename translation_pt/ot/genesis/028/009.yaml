  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: pt
  text: Então Esaú foi até Ismael e tomou Maalate, filha de Ismael, filho de Abraão, e irmã de Nebaiote, para ser sua mulher, além das mulheres que já tinha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além de suas mulheres”. A expressão hebraica indica que Maalate foi tomada como mais uma mulher, não como substituta das que Esaú já tinha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: Então Esaú foi até Ismael
  rationale: O wayyiqtol dá sequência à narrativa; “foi até” expressa naturalmente o movimento em direção a uma pessoa, sem acrescentar ênfase.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido básico de לקח e o idioma hebraico, enquanto a expressão posterior esclarece que se trata de casamento.
- source_word: מָחֲלַת
  choice: Maalate
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: filha de Ismael, filho de Abraão
  rationale: Reproduz claramente a cadeia genealógica do hebraico em português natural.
- source_word: אֲחוֹת נְבָיוֹת
  choice: irmã de Nebaiote
  rationale: Traduz diretamente a identificação adicional de Maalate.
- source_word: עַל נָשָׁיו
  choice: além das mulheres que já tinha
  rationale: 'Neste contexto, עַל indica acréscimo: Maalate passou a integrar o grupo de mulheres de Esaú, sem substituir as anteriores.'
- source_word: לוֹ לְאִשָּׁה
  choice: para ser sua mulher
  rationale: Expressa com naturalidade tanto a finalidade matrimonial quanto a referência reflexiva de לוֹ.
