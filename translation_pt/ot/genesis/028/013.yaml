source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: pt
  text: 'E eis que Yahweh estava de pé acima dela[a] e disse: “Eu sou Yahweh, o Deus de Abraão, seu pai, e o Deus de Isaque. A terra sobre a qual você está deitado, eu a darei a você e à sua descendência[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto dele” ou “acima dele”, caso o pronome se refira a Jacó, e não à escada ou rampa.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “semente”; aqui, o termo tem sentido coletivo e se refere à descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função discursiva e a vivacidade da partícula hebraica, mantendo um tom digno e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִצָּב
  choice: estava de pé
  rationale: O particípio hebraico descreve um estado ou ação em curso na visão; a locução verbal portuguesa expressa esse aspecto naturalmente.
- source_word: עָלָיו
  choice: acima dela
  rationale: O sufixo masculino singular remete mais naturalmente ao substantivo hebraico da escada/rampa no contexto anterior; em português, a retomada exige o feminino “dela”. A possível referência a Jacó é preservada em nota.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: o Deus de Abraão, seu pai
  rationale: Mantém Abraão como antepassado de Jacó sem reordenar a expressão para eliminar a relação apositiva presente no hebraico.
- source_word: הָאָרֶץ
  choice: A terra
  rationale: No contexto da promessa patriarcal, “terra” comunica tanto o espaço físico quanto a terra prometida.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: sobre a qual você está deitado
  rationale: Preserva a relação espacial de עַל e o aspecto contínuo do particípio.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: eu a darei a você
  rationale: O imperfeito expressa promessa futura; o pronome “a” retoma explicitamente “a terra” de modo natural em português.
- source_word: וּלְזַרְעֶךָ
  choice: e à sua descendência
  rationale: “Descendência” é um coletivo singular natural em português e conserva melhor essa característica de זֶרַע do que o plural “descendentes”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: A forma escolhida translitera diretamente o nome divino e evita substituí-lo pelo título “SENHOR”; “Javé” é uma adaptação tradicional possível em português.
- issue: Referente de עָלָיו na visão
  choice: acima dela, referindo-se à escada/rampa
  alternative: junto dele ou acima dele, referindo-se a Jacó
  rationale: O antecedente imediato no contexto é a escada/rampa, mas a forma hebraica admite que o pronome se refira a Jacó. A ambiguidade é explicitada em nota, sem resolver silenciosamente a questão.
- issue: Sentido de אָבִיךָ aplicado a Abraão
  choice: Abraão, seu pai
  alternative: seu antepassado Abraão
  rationale: “Pai” preserva a formulação hebraica e seu uso amplo para ancestral, enquanto “antepassado” tornaria explícito um sentido que o original deixa na expressão tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se “e eis que” para reproduzir a vivacidade narrativa do hebraico. Emprega-se “você” como forma corrente de segunda pessoa, sem perder a solenidade da fala divina. Os marcadores de nota foram posicionados junto às expressões efetivamente comentadas.
