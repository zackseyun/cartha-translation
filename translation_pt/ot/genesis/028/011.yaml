base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: pt
  text: Ele chegou a certo lugar e passou ali a noite[a], porque o sol já havia se posto. Pegou uma das pedras do lugar[b], colocou-a sob a cabeça[c] e deitou-se naquele lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “no lugar” na primeira menção; “a certo lugar” mantém em português natural a sugestão de que o local terá importância na narrativa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pegou algumas das pedras do lugar”. A construção hebraica pode ser entendida como partitiva de um substantivo plural, embora seja comumente interpretada como referência a uma única pedra.'
    reason: alternative_reading
  - marker: c
    text: “Sob a cabeça” traduz um termo hebraico que indica a região da cabeça ou um apoio para ela; também pode ser traduzido por “junto à cabeça” ou “como apoio para a cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: chegou a certo lugar
  rationale: פגע com ב e um lugar, neste contexto de viagem, indica chegar ou alcançar o local. “Certo lugar” expressa de modo natural a primeira menção, sem perder a forma marcada do hebraico com artigo nem antecipar a importância narrativa do lugar.
- source_word: וַיָּלֶן שָׁם
  choice: passou ali a noite
  rationale: לון designa permanecer durante a noite. A expressão é atual e idiomática em português.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: porque o sol já havia se posto
  rationale: בוא, tendo “o sol” como sujeito, é uma expressão de pôr do sol. O mais-que-perfeito composto explicita naturalmente que o anoitecer motivou a parada.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: pegou uma das pedras do lugar
  rationale: A construção partitiva מן com o plural “pedras” admite naturalmente “uma das pedras”; uma nota preserva a possível leitura não singular.
- source_word: וַיָּשֶׂם מְרַאֲשֹׁתָיו
  choice: colocou-a sob a cabeça
  rationale: מְרַאֲשׁוֹתָיו se refere à região da cabeça ou a um apoio para ela. “Sob a cabeça” comunica naturalmente a função no contexto, sem transformar o substantivo em um objeto específico chamado travesseiro.
- source_word: וַיִּשְׁכַּב
  choice: deitou-se
  rationale: O verbo descreve o ato de se reclinar; “deitou-se” evita traduzir além do texto como “dormiu”.
- source_word: בַּמָּקוֹם הַהוּא
  choice: naquele lugar
  rationale: Preserva a repetição de “lugar”, relevante para a narrativa, em vez de reduzi-la a “ali”.
