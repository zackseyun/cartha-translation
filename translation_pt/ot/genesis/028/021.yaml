  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: pt
  text: e eu voltar em paz para a casa de meu pai[a], e Yahweh será o meu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu voltar em segurança para a casa de meu pai”. A expressão hebraica “em paz” também pode destacar um retorno seguro ou em pleno bem-estar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: e eu voltar
  rationale: O verbo שׁוב significa “voltar”. No contexto da condição iniciada no versículo anterior, o futuro do subjuntivo “voltar” é natural em português e mantém a frase ligada à sequência do voto, sem acrescentar aqui um “se” ausente deste segmento hebraico.
- source_word: בְשָׁלוֹם
  choice: em paz
  rationale: שָׁלוֹם abrange paz, bem-estar, integridade e segurança. “Em paz” reproduz diretamente a expressão hebraica e conserva sua amplitude sem reduzi-la apenas à ideia de segurança física.
- source_word: אֶל בֵּית אָבִי
  choice: para a casa de meu pai
  rationale: Tradução natural da construção hebraica, preservando tanto a referência à residência quanto o sentido familiar do grupo doméstico paterno.
- source_word: וְהָיָה
  choice: e ... será
  rationale: A forma de היה, ligada pela conjunção וְ, aponta para o resultado futuro dentro da sequência do voto. “E ... será” segue de perto a forma hebraica sem inserir explicitamente “então”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי
  choice: meu
  rationale: Embora a construção seja literalmente “para mim”, em português a expressão predicativa idiomática é “será o meu Deus”, que preserva a força relacional.
- source_word: לֵאלֹהִים
  choice: Deus
  rationale: אֱלֹהִים funciona como predicativo na fórmula que expressa a relação e a lealdade de Jacó para com Yahweh.
theological_decisions:
- issue: Se a declaração de Jacó expressa aceitação condicional de Yahweh ou apenas um voto de reconhecimento
  choice: Manter a declaração dentro da sequência condicional do voto, usando “voltar” e conservando a conjunção “e”.
  alternative: Transformar a última oração numa afirmação incondicional independente ou explicitar “então Yahweh será o meu Deus”.
  rationale: O contexto dos versículos anteriores dá à sequência força condicional e de resultado, mas este segmento usa apenas a conjunção hebraica. A tradução preserva essa tensão sem enfraquecê-la nem torná-la mais explícita do que o original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação permanece ligada sintaticamente ao voto iniciado no contexto anterior; “em paz” conserva a riqueza semântica do hebraico.
