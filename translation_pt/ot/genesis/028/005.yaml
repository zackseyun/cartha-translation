base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: pt
  text: Assim, Isaque enviou Jacó, e ele foi para Padã-Arã, para junto de Labão, filho de Betuel, o arameu, irmão de Rebeca, mãe de Jacó e Esaú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo שׁלח indica que Isaque mandou Jacó partir. Em português, «enviou» expressa naturalmente a ação sem exigir o complemento «embora», que poderia sugerir rejeição.
- source_word: וַיֵּלֶךְ
  choice: e ele foi
  rationale: הלך é o verbo comum para «ir»; a conjunção e o pronome preservam com clareza a sequência narrativa e a mudança de sujeito.
- source_word: פַּדֶּנָה אֲרָם
  choice: para Padã-Arã
  rationale: O topônimo é transliterado, e a terminação direcional hebraica é representada por «para».
- source_word: אֶל לָבָן
  choice: até Labão
  rationale: A preposição אֶל marca o destino pessoal de Jacó; «até» distingue naturalmente Labão do destino geográfico anterior.
- source_word: בֶּן בְּתוּאֵל
  choice: filho de Betuel
  rationale: Reprodução natural e direta da construção filial hebraica.
- source_word: הָאֲרַמִּי
  choice: o arameu
  rationale: אֲרַמִּי designa com precisão um arameu; «sírio», comum em tradições antigas, seria historicamente menos específico.
- source_word: אֲחִי רִבְקָה
  choice: irmão de Rebeca
  rationale: Mantém a relação familiar e a estrutura apositiva do hebraico em português corrente.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: mãe de Jacó e Esaú
  rationale: Preserva a identificação explícita de Rebeca no texto hebraico.
