lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא expressa sair ou partir de um lugar. “Saiu” é direto, natural em português e se combina claramente com a indicação de origem.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יעקב em português.
- source_word: מִבְּאֵר שָׁבַע
  choice: de Berseba
  rationale: A preposição מִן indica origem, e “Berseba” é a forma portuguesa tradicional e corrente do topônimo.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: הלך é o verbo comum para ir ou andar. “Foi” preserva o sentido básico sem acrescentar a ideia mais específica de viajar.
- source_word: חָרָנָה
  choice: para Harã
  rationale: O ה direcional indica movimento em direção ao lugar. Em português, “para Harã” expressa naturalmente essa direção, sem exigir que a forma gramatical seja entendida como afirmação explícita da chegada.
