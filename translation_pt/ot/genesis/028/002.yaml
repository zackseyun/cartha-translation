base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: pt
  text: Levante-se, vá a Padã-Arã, à casa de Betuel, pai de sua mãe, e tome para você, de lá, uma esposa dentre as filhas de Labão, irmão de sua mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'De modo mais idiomático: “seu avô materno” e “seu tio”. O texto principal mantém mais explicitamente as expressões hebraicas de parentesco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Levante-se
  rationale: O imperativo de קום significa levantar-se. “Levante-se” é natural no português moderno e preserva a sequência enfática de ordens.
- source_word: לֵךְ֙
  choice: vá
  rationale: O imperativo de הלך tem o sentido comum de ir; “vá” é a forma direta e corrente em português.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: a Padã-Arã
  rationale: O nome geográfico é transliterado segundo a forma portuguesa corrente; a terminação direcional hebraica é expressa pela preposição “a”.
- source_word: בֵּ֥יתָ/ה בְתוּאֵ֖ל
  choice: à casa de Betuel
  rationale: בַּיִת com terminação direcional indica movimento em direção à casa ou família de Betuel. A tradução conserva a forma concreta do hebraico sem excluir a ideia de unidade familiar.
- source_word: אֲבִ֣י אִמֶּ֑/ךָ
  choice: pai de sua mãe
  rationale: Reproduz de modo claro a expressão hebraica literal, sem substituí-la no texto principal pelo termo relacional mais idiomático “avô materno”.
- source_word: וְ/קַח לְ/ךָ֤
  choice: e tome para você
  rationale: לקח significa “tomar”, e לְךָ assinala interesse pessoal. “Para você” conserva essa nuance no contexto da escolha de esposa.
- source_word: מִ/שָּׁם֙
  choice: de lá
  rationale: A preposição מִן está expressa no hebraico e indica procedência; “de lá” preserva esse elemento.
- source_word: אִשָּׁ֔ה
  choice: uma esposa
  rationale: Embora אִשָּׁה também possa significar “mulher”, o contexto de busca matrimonial requer “esposa”.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: dentre as filhas de Labão
  rationale: 'A preposição tem valor partitivo: a esposa deve ser escolhida entre as filhas de Labão. “Dentre” comunica isso com clareza e naturalidade.'
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: irmão de sua mãe
  rationale: Mantém explicitamente a formulação de parentesco do hebraico, em vez de a substituir no texto principal por “tio”.
theological_decisions: []
