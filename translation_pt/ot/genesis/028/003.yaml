  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: pt
  text: Que o Deus Todo-Poderoso[a] abençoe você, o torne fecundo e o multiplique, e que você se torne uma assembleia de povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “El Shaddai”. Tradicionalmente traduzido por “Deus Todo-Poderoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  rationale: Traduz o título divino em linguagem portuguesa consagrada e inteligível; a forma hebraica é preservada em nota.
- source_word: יְבָרֵךְ
  choice: abençoe você
  rationale: O imperfeito tem força jussiva no contexto da bênção; o subjuntivo português expressa naturalmente o desejo ou a invocação.
- source_word: וְיַפְרְךָ
  choice: o torne fecundo
  rationale: Preserva o valor causativo do hifil de פרה e, no contexto patriarcal, aponta naturalmente para descendência numerosa.
- source_word: וְיַרְבֶּךָ
  choice: o multiplique
  rationale: Mantém o sentido causativo de רבה e a formulação característica das promessas patriarcais, sem explicitar além do hebraico o objeto desse aumento.
- source_word: וְהָיִיתָ
  choice: para que você se torne
  rationale: Expressa de modo idiomático a relação de resultado ou propósito dentro da sequência de bênção, sem tratá-la como mera previsão futura.
- source_word: לִקְהַל עַמִּים
  choice: uma comunidade de povos
  rationale: Comunidade comunica um grupo reunido ou constituído, enquanto povos preserva o plural עַמִּים e sua dimensão coletiva.
theological_decisions:
- issue: Tradução do título divino אֵל שַׁדַּי
  choice: o Deus Todo-Poderoso
  alternative: El Shaddai
  rationale: O texto principal traduz o título para torná-lo imediatamente compreensível, enquanto a nota conserva a forma hebraica e evita ocultar a questão lexical.
- issue: Relação sintática de וְהָיִיתָ com as bênçãos anteriores
  choice: para que você se torne
  alternative: e você será
  rationale: A formulação escolhida representa a leitura contextual de resultado ou propósito, sem acrescentar uma conclusão doutrinária que não esteja no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para o singular e evita tanto arcaísmos quanto explicações interpretativas inseridas no corpo do versículo.
