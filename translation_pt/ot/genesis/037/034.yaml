base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: pt
  text: Então Jacó rasgou suas roupas, pôs pano de saco em volta da cintura e ficou de luto por seu filho durante muitos dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: rasgou
  rationale: No contexto de luto, קרע descreve o ato concreto e ritual de rasgar a roupa; “rasgou” é natural e preciso em português.
- source_word: שִׂמְלֹתָיו
  choice: suas roupas
  rationale: שִׂמְלָה designa vestimentas de modo amplo. “Suas roupas” é claro e atual, sem especificar indevidamente mantos ou túnicas.
- source_word: שַׂק
  choice: pano de saco
  rationale: O termo designa tecido grosseiro usado como sinal de luto. “Pano de saco” conserva a imagem cultural bíblica e é mais imediatamente compreensível que apenas “saco”.
- source_word: בְּמָתְנָיו
  choice: em volta da cintura
  rationale: מָתְנַיִם pode indicar a cintura ou os lombos. A expressão escolhida comunica naturalmente a localização e o modo de vestir o pano.
- source_word: וַיִּתְאַבֵּל
  choice: ficou de luto
  rationale: A forma verbal indica entrar ou permanecer em estado de luto, incluindo suas manifestações costumeiras; “ficou de luto” preserva melhor esse sentido do que uma referência apenas à tristeza interior.
- source_word: עַל־בְּנוֹ
  choice: por seu filho
  rationale: Com o verbo de luto, עַל é naturalmente traduzido por “por” em português.
- source_word: יָמִים רַבִּים
  choice: durante muitos dias
  rationale: A expressão indica duração; a inclusão de “durante” torna essa função temporal explícita e idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. A sequência dos três atos de Jacó foi preservada. Não se acrescentou nota para מָתְנָיו, pois “cintura” representa adequadamente o sentido contextual; “lombos” seria possível, mas menos natural para o público geral.
