base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: pt
  text: 'Seus irmãos lhe disseram: “Você vai mesmo reinar sobre nós? Vai mesmo nos governar?” E o odiaram ainda mais por causa de seus sonhos e de suas palavras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Você vai mesmo reinar
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a pergunta; “vai mesmo” comunica naturalmente essa ênfase em português.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: Vai mesmo nos governar
  rationale: Mantém o paralelismo enfático com a primeira pergunta e distingue מָשַׁל (“governar, dominar”) de מָלַךְ (“reinar”).
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא
  choice: passaram a odiá-lo ainda mais
  rationale: Expressa o aumento do ódio já existente, conforme a combinação de יסף, עוד e שׂנא.
- source_word: דְּבָרָיו
  choice: suas palavras
  rationale: Tradução direta e abrangente, sem restringir o termo a uma interpretação específica dos sonhos.
