base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: pt
  text: Estas são as gerações de Jacó:[a] José, aos dezessete anos, pastoreava o rebanho com seus irmãos. Ele era jovem e estava com os filhos de Bila e de Zilpa, mulheres de seu pai, e José levou ao pai deles[b] um relato desfavorável a respeito deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a história da família de Jacó”. O termo hebraico frequentemente introduz uma nova seção de Gênesis e pode indicar aquilo que procede de uma pessoa, não apenas seus descendentes biológicos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ao pai deles”; o possessivo plural se refere a Jacó como pai tanto de José quanto dos irmãos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: gerações
  rationale: Preserva o termo estrutural recorrente de Gênesis e sua ideia de história ou descendência que procede de alguém, enquanto a nota registra alternativas naturais.
- source_word: הָיָה רֹעֶה
  choice: pastoreava
  rationale: Expressa a atividade contínua indicada pela construção participial e mantém a imagem pastoril.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: pastoreava o rebanho com seus irmãos
  rationale: Comunica de modo natural que José trabalhava com o rebanho na companhia dos irmãos, sem sugerir que ele pastoreava os próprios irmãos.
- source_word: נַעַר
  choice: jovem
  rationale: É adequado à idade explicitamente informada, dezessete anos, sem impor a ideia de criança pequena ou de servo.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: que estava com os filhos de Bila e os filhos de Zilpa
  rationale: Representa de maneira minimamente interpretativa a sintaxe hebraica difícil e a associação de José com esses irmãos.
- source_word: נְשֵׁי אָבִיו
  choice: mulheres de seu pai
  rationale: Mantém a identificação de Bila e Zilpa como mulheres de Jacó; em português bíblico, a expressão é natural e evita decidir além do necessário entre estatutos conjugais específicos.
- source_word: דִּבָּתָם רָעָה
  choice: um mau relato a respeito deles
  rationale: Transmite um informe desfavorável sem concluir se era falso, calunioso ou apenas negativo.
- source_word: אֶל אֲבִיהֶם
  choice: ao pai deles
  rationale: Preserva o sufixo plural hebraico, que apresenta Jacó como pai compartilhado por José e seus irmãos.
