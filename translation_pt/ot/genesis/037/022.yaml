  terminology: «Rúben» é a forma portuguesa estabelecida. «Poço» é uma opção lexical viável e ampla para בּוֹר neste contexto; a nota preserva «cisterna» como alternativa relevante. «Deserto» é aceitável para מִדְבָּר no uso amplo de região erma, e «das mãos deles» mantém a imagem hebraica de poder ou controle.
