  source_fidelity: O texto representa com precisão os imperativos hebraicos, a oração relativa («que fica no deserto»), a proibição idiomática de violência e a explicação narrativa do propósito de Rúben. «Para livrá-lo das mãos deles e devolvê-lo a seu pai» conserva tanto a finalidade quanto a sequência dos dois infinitivos hebraicos, sem transformar a motivação narrativa em fala direta.
