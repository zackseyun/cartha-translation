base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: pt
  text: 'Rúben lhes disse: “Não derramem sangue. Joguem-no neste poço[a] que fica no deserto, mas não levantem a mão contra ele” — para livrá-lo das mãos deles[b] e devolvê-lo a seu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cisterna”. O termo hebraico pode designar uma cova escavada para armazenar água.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da mão deles”, expressão que indica poder ou domínio.
    reason: idiom_clarification
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Não derramem sangue
  rationale: Preserva a expressão hebraica de derramar sangue, que aqui implica matar e incorrer em culpa de sangue, sem reduzir o texto à explicitação interpretativa “não o matem”.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Joguem-no
  rationale: Verte diretamente o imperativo causativo de שׁלך em português atual e natural.
- source_word: הַבּוֹר
  choice: poço
  rationale: בּוֹר pode indicar uma cova, um poço ou uma cisterna. “Poço” mantém no texto principal a amplitude lexical, enquanto “cisterna” é registrada em nota como alternativa contextual provável.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: que fica no deserto
  rationale: Representa explicitamente a oração relativa אֲשֶׁר e usa “deserto” no sentido amplo de região erma, natural ao leitor lusófono.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: mas não levantem a mão contra ele
  rationale: Expressão idiomática portuguesa que conserva a imagem da mão e comunica a proibição de violência pessoal.
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: para livrá-lo das mãos deles
  rationale: Mantém a finalidade do plano oculto de Rúben e preserva a metáfora hebraica de estar sob a mão, isto é, sob o poder de alguém.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: e devolvê-lo a seu pai
  rationale: 'Expressa com naturalidade o causativo de שׁוב: fazer José voltar ao pai.'
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
