base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: pt
  text: 'Ele contou o sonho a seu pai e a seus irmãos, e seu pai o repreendeu e lhe disse: “Que sonho é esse que você teve? Será que eu, sua mãe e seus irmãos realmente viremos nos curvar diante de você até o chão[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos prostrar diante de você”. O verbo hebraico pode indicar uma profunda reverência; aqui se refere a curvar-se em sinal de submissão, não necessariamente a adorar.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: contou o sonho
  rationale: O piel de ספר significa contar ou relatar. O objeto está implícito no hebraico e é explicitado como “o sonho” em português para assegurar clareza natural.
- source_word: וַיִּגְעַר בּוֹ
  choice: o repreendeu
  rationale: גער denota repreensão verbal enérgica; “repreendeu” preserva essa força em registro digno e corrente.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Que sonho é esse que você teve?
  rationale: A formulação conserva a pergunta retórica e soa natural em português moderno; repetir literalmente “sonho... sonhou” seria possível, mas menos idiomático.
- source_word: הֲבוֹא נָבוֹא
  choice: Será que ... realmente viremos
  rationale: “Realmente” comunica a ênfase da construção com infinitivo absoluto e verbo finito, enquanto “será que” expressa a pergunta incrédula.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: eu, sua mãe e seus irmãos
  rationale: Mantém diretamente a enumeração dos sujeitos e os termos de parentesco do hebraico.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: nos curvar diante de você
  rationale: Neste contexto familiar, השתחוה indica profunda reverência ou submissão, sem exigir o sentido cultual de adoração.
- source_word: אָרְצָה
  choice: até o chão
  rationale: A forma direcional indica movimento em direção ao chão e intensifica a profundidade da inclinação.
theological_decisions:
- issue: Sentido de השתחוה em contexto não cultual
  choice: nos curvar diante de você
  alternative: nos prostrar diante de você; adorar você
  rationale: O contexto trata da submissão da família a José. “Curvar-se” preserva o sentido social sem introduzir uma afirmação de adoração cultual; a nota registra a intensidade física possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e preserva a intensidade e a incredulidade da fala de Jacó.
