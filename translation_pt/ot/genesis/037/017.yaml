  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: pt
  text: 'O homem respondeu: “Eles partiram daqui, pois eu os ouvi dizer[a]: ‘Vamos para Dotã[b].’” Então José foi atrás de seus irmãos e os encontrou em Dotã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os ouvi dizendo”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, o nome do lugar recebe uma terminação que indica direção, literalmente “em direção a Dotã”.
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: partiram daqui
  rationale: נסע pode indicar levantar acampamento e seguir viagem; “partiram daqui” comunica com naturalidade a saída do lugar sem acrescentar explicitamente a imagem de desmontar o acampamento.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão pela qual o homem sabe que os irmãos já não estão ali; “pois” mantém clara essa relação causal em português corrente e digno.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: eu os ouvi dizer
  rationale: A construção combina “ouvi” com o particípio plural “dizendo”. O pronome “os”, suprido pelo contexto, refere-se aos irmãos de José; a formulação escolhida é natural em português e preserva o discurso ouvido.
- source_word: נֵלְכָה
  choice: Vamos
  rationale: O coortativo na primeira pessoa do plural expressa proposta ou autoexortação. “Vamos” reproduz essa força de maneira direta e idiomática.
- source_word: דֹּתָיְנָה
  choice: para Dotã
  rationale: A terminação direcional indica movimento rumo ao lugar. “Para Dotã” expressa esse valor naturalmente; “Dotã” é a forma portuguesa tradicional do topônimo.
- source_word: אַחַר אֶחָיו
  choice: atrás de seus irmãos
  rationale: אַחַר indica que José seguiu os irmãos. “Foi atrás de seus irmãos” é claro e idiomático, sem necessariamente sugerir perseguição hostil.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: os encontrou em Dotã
  rationale: מצא tem aqui o sentido narrativo comum de encontrar, e a preposição ב localiza os irmãos em Dotã.
theological_decisions: []
