base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: pt
  text: Eles o viram de longe e, antes que ele se aproximasse deles, tramaram[a] contra ele para matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiram traiçoeiramente contra ele”. O verbo hebraico pode indicar tanto tramar como agir com astúcia ou engano; aqui, a intenção de matá-lo torna explícito o caráter assassino da trama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ
  choice: Eles o viram
  rationale: O Qal narrativo de ראה indica que o viram; o pronome átono “o” representa naturalmente o objeto masculino singular em português.
- source_word: מֵרָחֹק
  choice: de longe
  rationale: Expressão portuguesa corrente e natural para a ideia espacial de avistar alguém a certa distância.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: e, antes que ele se aproximasse deles
  rationale: בְּטֶרֶם introduz uma oração temporal; “antes que” pede o subjuntivo em português, e “se aproximasse deles” preserva o sentido espacial de קרב אֶל.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: tramaram contra ele
  rationale: O Hitpael de נכל denota maquinar ou agir com astúcia hostil. “Tramaram contra ele” comunica de modo claro a ação deliberada e maliciosa neste contexto.
- source_word: לַהֲמִיתוֹ
  choice: para matá-lo
  rationale: 'O infinitivo Hiphil de מות com sufixo masculino singular expressa o propósito da trama: causar a morte dele.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O marcador foi colocado junto de “tramaram”, termo ao qual a nota lexical se refere.
