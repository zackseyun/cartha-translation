id: GEN.37.28
reference: Genesis 37:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: pt
  text: Então passaram por ali alguns mercadores midianitas. Eles puxaram José e o tiraram da cisterna, e venderam José aos ismaelitas por vinte peças de prata.[a][b] Depois, levaram José para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “por vinte de prata”; a unidade não é especificada.'
    reason: lexical_alternative
  - marker: b
    text: Os verbos hebraicos estão no plural (“puxaram”, “tiraram”, “venderam”, “levaram”). Como o versículo menciona mercadores midianitas e ismaelitas, permanece certa ambiguidade sobre qual grupo realiza cada ação.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: passaram por ali
  rationale: Expressa naturalmente o movimento pelo local, sem acrescentar a ideia de chegada.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: alguns mercadores midianitas
  rationale: Reproduz com clareza os homens identificados como midianitas e comerciantes; em português, 'mercadores midianitas' é natural e inclui o referente humano.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: puxaram José e o tiraram
  rationale: Mantém os dois verbos sucessivos e o movimento para fora da cisterna, evitando uma repetição pouco natural em português.
- source_word: מִן הַבּוֹר
  choice: da cisterna
  rationale: No contexto narrativo, בור designa uma cavidade usada como cisterna; esta escolha também se harmoniza com a descrição contextual do local, sem excluir a noção de poço ou cova.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: aos ismaelitas
  rationale: Preserva explicitamente o grupo indicado como destinatário da venda.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: por vinte peças de prata
  rationale: O hebraico diz literalmente 'por vinte prata' e não explicita a unidade; 'peças' fornece em português o complemento necessário sem impor 'siclos' ao texto.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: levaram José para o Egito
  rationale: Em português, 'levaram ... para' expressa de modo idiomático o transporte ao destino indicado pela forma direcional.
theological_decisions:
- issue: Referente dos verbos no plural após a menção dos midianitas e dos ismaelitas
  choice: Manter o sujeito apenas como 'eles', sem identificar explicitamente o grupo
  alternative: Atribuir todas as ações aos mercadores midianitas, ou atribuir a venda e o transporte aos ismaelitas
  rationale: A sequência hebraica emprega verbos no plural e permite tensão quanto ao grupo referido em cada ação. A tradução não impõe uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar a sequência verbal nem resolver a ambiguidade dos agentes.
