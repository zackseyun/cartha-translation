base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: pt
  text: Então eles o pegaram e o lançaram na cisterna[a]. A cisterna estava vazia; não havia água nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cova”. O hebraico bor pode designar uma cova ou uma cisterna, como sugere a observação de que não havia água nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Então eles o pegaram
  rationale: O waw consecutivo faz a narrativa avançar. “Pegaram” expressa o sentido simples de לקח sem acrescentar a intensidade interpretativa de “agarraram” ou “capturaram”.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: e o lançaram
  rationale: השליך significa lançar ou jogar. “Lançaram” comunica com clareza a ação violenta e mantém um registro digno e natural.
- source_word: הַבֹּרָה
  choice: na cisterna
  rationale: בּוֹר pode designar uma cova, poço ou cisterna. A observação explícita de que não havia água favorece “cisterna” neste contexto, sem excluir a forma de uma cova escavada.
- source_word: וְהַבּוֹר רֵק
  choice: A cisterna estava vazia
  rationale: A oração fornece informação explicativa de fundo. Em português, iniciar uma nova frase sem traduzir mecanicamente o waw produz uma narrativa mais natural.
- source_word: אֵין בּוֹ מָיִם
  choice: não havia água nela
  rationale: A formulação é idiomática em português e preserva a menção explícita à ausência de água.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Cisterna” foi adotado no texto por causa da referência à água; “cova” preserva em nota a amplitude lexical do hebraico.
