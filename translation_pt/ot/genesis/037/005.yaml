  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: pt
  text: José teve um sonho[a] e o contou a seus irmãos, e eles o odiaram ainda mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “José sonhou um sonho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: José teve um sonho
  rationale: A construção cognata hebraica diz literalmente que José “sonhou um sonho”. Em português atual, “teve um sonho” comunica naturalmente o mesmo acontecimento; a forma do original é registrada em nota.
- source_word: וַיַּגֵּד
  choice: o contou
  rationale: O verbo נגד, nesta forma, significa contar, relatar ou dar a conhecer. O pronome “o” retoma naturalmente “sonho”.
- source_word: לְאֶחָיו
  choice: a seus irmãos
  rationale: Preserva de modo direto o substantivo masculino plural com o sufixo possessivo de terceira pessoa.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: eles o odiaram ainda mais
  rationale: A combinação de יסף com עוד expressa aumento ou intensificação; “ainda mais” reproduz de modo idiomático a escalada do ódio.
- source_word: וַ
  choice: e / por isso
  rationale: Os waw consecutivos fazem a narrativa avançar. O primeiro é vertido por “e”; no segundo, “por isso” explicita a relação contextual entre ele contar o sonho e o aumento do ódio, sem inserir um marcador temporal inexistente.
