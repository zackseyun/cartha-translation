  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: pt
  text: 'E vejam: estávamos amarrando feixes no meio do campo; e vejam: o meu feixe se levantou e também ficou de pé; e vejam: os feixes de vocês se ajuntaram ao redor do meu feixe e se curvaram diante dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rodearam o meu feixe e se prostraram diante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam / Então / e
  rationale: O marcador repetido introduz vividamente as cenas sucessivas do sonho. A primeira ocorrência é explicitada como “E vejam”; nas seguintes, a progressão é expressa de modo natural em português, sem a forma arcaizante “eis que” repetida três vezes.
- source_word: מְאַלְּמִים אֲלֻּמִים
  choice: amarrando feixes
  rationale: O verbo e o substantivo cognato descrevem a ação agrícola de juntar e atar cereal em feixes; “amarrando feixes” conserva claramente a imagem.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: no meio do campo
  rationale: Preserva a nuance espacial de בְּתוֹךְ, mais específica do que simplesmente “no campo”.
- source_word: קָמָה וְגַם נִצָּבָה
  choice: se levantou e ficou de pé
  rationale: 'Mantém a sequência: primeiro o feixe se ergue, depois permanece em posição vertical. O valor aditivo de גַם fica naturalmente representado pela coordenação em português.'
- source_word: תְסֻבֶּינָה
  choice: se juntaram ao redor dele
  rationale: O verbo expressa movimento em volta ou circundante; esta formulação conserva a imagem sem decidir rigidamente entre aproximar-se ao redor e cercar completamente.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: se curvaram diante do meu feixe
  rationale: Expressa o gesto de inclinar-se em reverência ou submissão, sem acrescentar explicitamente uma interpretação política ou cultual.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: meu feixe / feixes de vocês
  rationale: “Feixe” é natural no contexto agrícola e mantém clara a correspondência simbólica; “de vocês” oferece ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente vívido, com legibilidade brasileira. Evita a repetição arcaizante de “eis que”, mas preserva a apresentação enfática das cenas do sonho. A pontuação divide as três etapas para facilitar a leitura.
