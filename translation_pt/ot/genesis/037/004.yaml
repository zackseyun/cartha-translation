  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: pt
  text: Quando os irmãos de José viram que o pai deles o amava mais do que todos os seus irmãos, odiavam-no e não podiam falar com ele em paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não podiam falar com ele de modo amigável ou cordial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Quando ... viram
  rationale: A forma narrativa dá continuidade ao relato, e a construção com “quando” expressa naturalmente a relação temporal e causal com a reação dos irmãos.
- source_word: אֶחָיו
  choice: os irmãos de José / seus irmãos
  rationale: O sufixo masculino singular refere-se a José. O nome é explicitado na primeira ocorrência para evitar ambiguidade entre os vários pronomes do versículo.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo percebido pelos irmãos: eles viram que o pai amava José mais.'
- source_word: אָהַב
  choice: amava
  rationale: Preserva o sentido comum de אהב, “amar”; o favoritismo é comunicado pela comparação, sem substituir o verbo por “preferir” ou “favorecer”.
- source_word: אֲבִיהֶם
  choice: o pai deles
  rationale: O sufixo plural refere-se ao conjunto dos irmãos. “O pai deles” preserva essa referência e soa natural em português.
- source_word: מִכָּל אֶחָיו
  choice: mais do que a todos os seus irmãos
  rationale: Mantém de perto a comparação hebraica com מן e כל, sem acrescentar “outros”, embora isso esteja implícito no contexto.
- source_word: וַיִּשְׂנְאוּ
  choice: passaram a odiá-lo
  rationale: Comunica o desenvolvimento narrativo da reação resultante sem enfraquecer o sentido forte de שׂנא, “odiar”.
- source_word: וְלֹא יָכְלוּ
  choice: e não conseguiam
  rationale: Expressa incapacidade em linguagem portuguesa corrente e, com o imperfeito, descreve a atitude persistente dos irmãos.
- source_word: דַּבְּרוֹ
  choice: falar com ele
  rationale: O infinitivo com sufixo refere-se à fala dirigida a José. “Falar com ele” é idiomático em português e admite a ideia de relacionamento.
- source_word: לְשָׁלֹם
  choice: em paz
  rationale: Preserva de modo transparente o termo שָׁלוֹם e a abertura idiomática da expressão, que pode indicar fala pacífica, amigável ou cordial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome “José” foi explicitado no início para desfazer a possível ambiguidade pronominal. A formulação “em paz” conserva o idioma hebraico no texto, enquanto a nota esclarece seu provável sentido relacional.
