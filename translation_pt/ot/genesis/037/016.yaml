  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: pt
  text: 'Ele disse: “Estou procurando meus irmãos. Por favor, diga-me onde eles estão pastoreando.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: O wayyiqtol de אמר introduz a resposta de José ao homem no contexto imediato. Em português, “respondeu” expressa naturalmente a função discursiva sem precisar reproduzir o וַ inicial.
- source_word: אֶת אַחַי
  choice: meus irmãos
  rationale: אֶת marca o objeto direto definido, e אַחַי significa “meus irmãos”, referindo-se aos irmãos homens de José.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Estou procurando
  rationale: O pronome independente seguido do particípio comunica uma ação em curso; a construção progressiva é natural em português moderno.
- source_word: הַגִּידָה נָּא לִי
  choice: Por favor, diga-me
  rationale: O imperativo hifil de נגד, com נָא, formula um pedido cortês. “Por favor, diga-me” preserva tanto a ordem quanto a polidez.
- source_word: אֵיפֹה הֵם
  choice: onde eles estão
  rationale: Mantém o advérbio interrogativo de lugar e o pronome explícito do hebraico em uma construção portuguesa natural.
- source_word: רֹעִים
  choice: apascentando os rebanhos
  rationale: O particípio qal de רעה, neste contexto pastoril, designa o cuidado dos animais no pasto. “Apascentando os rebanhos” é idiomático e explicita o objeto subentendido pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Apascentando” preserva o cenário pastoril e é amplamente compreensível; “os rebanhos” explicita apenas o objeto já estabelecido pelo contexto.
