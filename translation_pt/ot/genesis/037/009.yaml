base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: pt
  text: 'Depois, José teve outro sonho e o contou a seus irmãos. Ele disse: “Vejam! Tive outro sonho: o sol, a lua e onze estrelas se curvavam diante de mim[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prostravam diante de mim”. O verbo hebraico pode indicar uma profunda inclinação em sinal de reverência; aqui, refere-se a homenagem ou submissão, não necessariamente a adoração divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Depois, José teve outro sonho
  rationale: O wayyiqtol dá continuidade à narrativa, e עוֹד...אַחֵר assinala repetição. O nome José, implícito no hebraico, torna a referência clara em português sem alterar o sentido.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: e o contou a seus irmãos
  rationale: סִפֵּר significa contar ou relatar; a construção escolhida é natural e mantém explícitos o conteúdo contado e os destinatários.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: A interjeição chama a atenção dos irmãos para o relato. O plural concorda naturalmente com os destinatários e evita o arcaísmo de 'eis'.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: Tive outro sonho
  rationale: Embora o hebraico use a construção cognata 'sonhei um sonho', em português corrente 'tive um sonho' comunica o mesmo conteúdo com naturalidade; עוֹד preserva a ideia de repetição.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: A segunda ocorrência introduz a cena vista no sonho. Os dois-pontos cumprem essa função de modo natural, sem repetir desnecessariamente a interjeição.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: o sol, a lua e onze estrelas
  rationale: Tradução direta dos corpos celestes e do numeral, em ordem e forma idiomáticas no português moderno.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: se curvavam diante de mim
  rationale: O particípio retrata uma ação em curso na cena do sonho. 'Curvar-se diante de' comunica reverência ou submissão sem sugerir necessariamente adoração religiosa.
theological_decisions:
- issue: Sentido de מִשְׁתַּחֲוִים no sonho de José
  choice: reverência ou submissão não cultual ('se curvavam diante de mim')
  alternative: me adoravam; prostravam-se diante de mim
  rationale: O contexto imediato é de submissão familiar e antecipa atos posteriores de homenagem. A formulação evita atribuir ao gesto um sentido de adoração divina que o contexto não exige, enquanto a nota preserva a força física possível do verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala direta é viva sem ser coloquial demais; evita-se tanto o arcaísmo de “eis” quanto uma interpretação religiosa excessivamente específica do gesto.
