base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: pt
  text: 'Ele voltou para junto de seus irmãos e disse[a]: “O rapaz não está lá! E eu — para onde irei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O rapaz não está [lá]! E eu — para onde vou?” A expressão hebraica pode comunicar “para onde poderei ir?” ou “o que farei agora?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Ele voltou
  rationale: O verbo שׁוב no wayyiqtol indica retorno e dá continuidade à sequência narrativa.
- source_word: אֶל אֶחָיו
  choice: para junto de seus irmãos
  rationale: אֶל indica direção; a formulação portuguesa expressa naturalmente o retorno ao grupo dos irmãos.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Tradução direta da forma narrativa, preservando a sequência dos acontecimentos.
- source_word: הַיֶּלֶד
  choice: o rapaz
  rationale: יֶלֶד pode designar menino, jovem ou rapaz. No contexto, José tem cerca de dezessete anos, e “rapaz” é natural sem introduzir tom arcaico.
- source_word: אֵינֶנּוּ
  choice: não está lá
  rationale: A expressão indica ausência. Esta tradução preserva o sentido imediato sem afirmar que José morreu.
- source_word: וַאֲנִי
  choice: E eu
  rationale: O pronome explícito é enfático e assinala abruptamente a aflição pessoal de Rúben.
- source_word: אָנָה אֲנִי בָא
  choice: para onde irei?
  rationale: Literalmente, a construção contém “para onde” e “eu venho”, mas funciona idiomaticamente como uma pergunta angustiada sobre para onde ir ou o que fazer.
