base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: pt
  text: 'Mas Rúben ouviu isso, livrou José das mãos deles e disse: “Não lhe tiremos a vida.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu isso
  rationale: Mantém o sentido básico de שׁמע e explicita naturalmente, em português, que Rúben ouviu o plano expresso no versículo anterior.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיַּצִּלֵהוּ
  choice: livrou José
  rationale: O hifil de נצל significa livrar ou resgatar. O nome José explicita com naturalidade o referente do pronome e evita uma sequência ambígua de pronomes masculinos.
- source_word: מִיָּדָם
  choice: das mãos deles
  rationale: Preserva a imagem hebraica da mão como poder ou domínio, usando a expressão idiomática corrente em português.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Introdução narrativa direta e natural da fala.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Não lhe tiremos a vida
  rationale: Expressa em português natural o sentido letal do idioma hebraico, literalmente relacionado a golpeá-lo quanto à vida, sem sugerir que Rúben apenas se opunha a um golpe não fatal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A conjunção adversativa “Mas” liga a intervenção de Rúben à intenção homicida do versículo anterior. A formulação preserva a força narrativa sem introduzir interpretação denominacional.
