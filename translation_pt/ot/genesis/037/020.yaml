base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: pt
  text: 'Agora, venham! Vamos matá-lo e jogá-lo numa das cisternas[a]. Depois diremos: “Um animal feroz o devorou. Então veremos o que será dos sonhos dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num dos poços” ou “numa das covas”. O termo hebraico pode designar uma cisterna, um poço ou uma cova, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a passagem imediata à proposta dos irmãos; o valor conjuntivo é transmitido naturalmente pelo fluxo do discurso em português.
- source_word: לְכוּ
  choice: venham!
  rationale: O imperativo plural funciona aqui como exortação idiomática, não como ordem literal para partir.
- source_word: וְנַהַרְגֵהוּ
  choice: Vamos matá-lo
  rationale: Reproduz de modo natural a força volitiva e coletiva do coortativo hebraico.
- source_word: וְנַשְׁלִכֵהוּ
  choice: e jogá-lo
  rationale: Expressa diretamente a ação de lançar José no reservatório, em linguagem moderna.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: numa das cisternas
  rationale: No contexto narrativo, בּוֹר designa provavelmente uma cisterna escavada para armazenar água; a alternativa mais geral é registrada em nota.
- source_word: וְאָמַרְנוּ
  choice: Depois diremos
  rationale: Comunica a sequência planejada das ações e o valor futuro da forma verbal no discurso direto.
- source_word: חַיָּה רָעָה
  choice: Um animal feroz
  rationale: Preserva tanto a referência a um animal não domesticado/perigoso quanto a qualidade ameaçadora expressa por רָעָה, sem restringir a espécie.
- source_word: אֲכָלָתְהוּ
  choice: o devorou
  rationale: Embora o verbo básico seja 'comer', 'devorar' é idiomático em português para a morte causada por um animal feroz e mantém o aspecto consumptivo da alegação.
- source_word: וְנִרְאֶה
  choice: Então veremos
  rationale: Mantém a consequência irônica e desafiadora da fala dos irmãos, sem eliminar a possível nuance volitiva.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: o que será dos sonhos dele
  rationale: Equivalência idiomática que preserva o desafio quanto ao destino ou cumprimento futuro dos sonhos.
theological_decisions:
- issue: O destino ou cumprimento dos sonhos de José
  choice: o que será dos sonhos dele
  alternative: em que darão os sonhos dele
  rationale: A formulação conserva a ironia e a abertura do hebraico, sem explicar antecipadamente o cumprimento providencial dos sonhos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento naturais para o plural. A fala mantém a urgência, a violência e a ironia do original sem arcaísmo desnecessário.
