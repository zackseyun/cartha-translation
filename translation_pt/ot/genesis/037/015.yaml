base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: pt
  text: 'Um homem o encontrou vagando pelo campo e lhe perguntou: “O que você está procurando?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: o encontrou
  rationale: O Qal de מצא significa normalmente “encontrar”; a formulação é direta e natural na narrativa.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva a referência concreta a uma pessoa do sexo masculino no singular.
- source_word: וְהִנֵּה תֹעֶה
  choice: andando sem rumo
  rationale: הִנֵּה apresenta vividamente a situação observada, enquanto o particípio תֹעֶה indica que José vagueava ou estava desorientado. A construção portuguesa integra naturalmente ambos sem afirmar categoricamente que ele estava perdido.
- source_word: בַּשָּׂדֶה
  choice: pelo campo
  rationale: שדה designa campo ou terreno aberto; com “andando”, a preposição “pelo” expressa de modo idiomático o espaço em que ele vagava.
- source_word: וַיִּשְׁאָלֵהוּ הָאִישׁ
  choice: e lhe perguntou
  rationale: שאל significa perguntar. O sujeito continua claro em português, permitindo evitar a repetição pouco natural de “o homem”.
- source_word: לֵאמֹר
  choice: — introdução direta da fala
  rationale: A fórmula hebraica introduz discurso direto; em português atual, sua função é representada naturalmente pela pontuação, sem o redundante “dizendo”.
- source_word: מַה תְּבַקֵּשׁ
  choice: O que você está procurando?
  rationale: בקש significa buscar ou procurar. A perífrase progressiva transmite a ação em curso e é natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a distinção entre encontrar José e vê-lo vagando, mas integra a partícula narrativa הִנֵּה numa formulação idiomática. Não há necessidade de nota textual ou teológica neste versículo.
