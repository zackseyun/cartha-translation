  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: pt
  text: 'E ele lhes disse: “Escutem, por favor, este sonho que sonhei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele lhes disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ele lhes disse” preserva esse fluxo de modo natural em português.
- source_word: אֲלֵיהֶם
  choice: lhes
  rationale: Representa a preposição com o sufixo pronominal e indica que José se dirige aos irmãos.
- source_word: שִׁמְעוּ נָא
  choice: Por favor, escutem
  rationale: O imperativo plural pede atenção, enquanto נָא torna o pedido mais cortês; a formulação é clara e corrente.
- source_word: הַחֲלוֹם הַזֶּה
  choice: este sonho
  rationale: Traduz naturalmente o substantivo definido acompanhado do demonstrativo.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: que tive
  rationale: Em português corrente, “ter um sonho” expressa naturalmente o verbo hebraico חָלַם; evita a formulação pouco idiomática “sonho que sonhei” sem perda relevante de sentido.
