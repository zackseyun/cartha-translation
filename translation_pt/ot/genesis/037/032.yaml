base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: pt
  text: 'Então eles mandaram a túnica de mangas compridas[a] e a levaram ao pai deles. Disseram: “Encontramos isto. Por favor, verifique[b] se é ou não a túnica do seu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a túnica ornamentada”, “a túnica ricamente enfeitada”; tradicionalmente, “a túnica de muitas cores”. A expressão hebraica é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “reconheça”. A escolha dessa palavra é significativa no conjunto da narrativa, em que reconhecer e não reconhecer são temas recorrentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Então eles mandaram
  rationale: O piel de שׁלח significa aqui “mandar/enviar”. “Então” expressa naturalmente a sequência narrativa do waw consecutivo.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: a túnica de mangas compridas
  rationale: כְּתֹנֶת designa uma túnica ou veste semelhante. O sentido de פַּסִּים é incerto, mas provavelmente indica uma peça que chegava às palmas das mãos ou às plantas dos pés; esta opção evita introduzir a tradição incerta de “muitas cores”.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: e a levaram ao pai
  rationale: O pronome feminino retoma naturalmente “túnica”. “Ao pai” conserva o referente explícito sem acrescentar o nome Jacó.
- source_word: זֹאת מָצָאנוּ
  choice: Encontramos isto
  rationale: Formulação simples e natural que mantém a brevidade calculada e enganosa da declaração dos irmãos.
- source_word: הַכֶּר נָא
  choice: Por favor, verifique
  rationale: O hiphil de נכר significa reconhecer ou identificar. “Verifique” introduz com naturalidade a pergunta indireta em português, enquanto a nota preserva o sentido mais literal e sua relevância narrativa.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: se é ou não a túnica do seu filho
  rationale: Reproduz a pergunta indireta marcada por אִם לֹא, “se... ou não”, e preserva o distanciamento dos irmãos ao dizerem “seu filho”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe mantém a sequência narrativa e o distanciamento intencional de “seu filho”, sem resolver a incerteza lexical de כְּתֹנֶת הַפַּסִּים.
