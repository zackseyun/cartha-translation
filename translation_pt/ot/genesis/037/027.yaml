base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: pt
  text: “Venham, vamos vendê-lo aos ismaelitas e não ponhamos a mão nele,[a] pois ele é nosso irmão, nossa própria carne.[b]” E seus irmãos lhe deram ouvidos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “e que a nossa mão não esteja sobre ele”; expressão que, no contexto, significa não lhe fazer mal diretamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nosso próprio sangue” ou “nosso parente”.'
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “escutaram”; no contexto, a expressão pode indicar que concordaram com ele ou atenderam ao que disse.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo plural de הלך funciona como convocação à ação. “Venham” preserva essa exortação antes da proposta “vamos vendê-lo”.
- source_word: וְנִמְכְּרֶנּוּ
  choice: vamos vendê-lo
  rationale: A forma volitiva na primeira pessoa do plural expressa uma proposta. “Vamos vendê-lo” é natural em português atual e mantém a força exortativa.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: aos ismaelitas
  rationale: Tradução consagrada e direta do etnônimo com preposição e artigo.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: e não ponhamos a mão nele
  rationale: Mantém a imagem hebraica da mão sobre alguém, em formulação portuguesa compreensível, com o sentido contextual de não lhe causar violência diretamente.
- source_word: כִּי אָחִינוּ בְשָׂרֵנוּ הוּא
  choice: pois ele é nosso irmão, nossa própria carne
  rationale: Preserva tanto o vínculo explícito de fraternidade quanto a expressão concreta בְשָׂרֵנוּ, que indica parentesco de sangue.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: E seus irmãos lhe deram ouvidos
  rationale: “Deram ouvidos” comunica que os irmãos não apenas ouviram, mas acolheram a proposta, sem tornar explícito demais se concordaram plenamente ou simplesmente atenderam naquele momento.
