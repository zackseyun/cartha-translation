base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: pt
  text: 'Então todos os seus filhos e todas as suas filhas se levantaram para consolá-lo, mas ele se recusou a ser consolado e disse: “Pois descerei de luto ao Sheol[a], para junto de meu filho.” E seu pai chorou por ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sheol: termo hebraico para o mundo dos mortos; conforme o contexto, também pode ser traduzido por “sepultura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O qal narrativo de קום indica levantar-se ou pôr-se em ação; a formulação preserva o movimento narrativo sem acrescentar intenção.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: todos os seus filhos e todas as suas filhas
  rationale: Mantém a distinção explícita do hebraico entre filhos e filhas, em vez de reduzi-la ao genérico 'filhos' ou 'descendentes'.
- source_word: לְנַחֲמוֹ ... לְהִתְנַחֵם
  choice: para consolá-lo ... a ser consolado
  rationale: A repetição de formas da mesma raiz נחם é preservada em português; 'consolar' é natural no contexto de luto.
- source_word: וַיְמָאֵן
  choice: ele se recusou
  rationale: Expressa a recusa ativa indicada por מאן, mais precisamente do que uma simples falta de disposição.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação dada por Jacó para rejeitar o consolo, sem intensificar indevidamente a partícula.
- source_word: אֵרֵד
  choice: descerei
  rationale: Preserva o movimento descendente de ירד e sua associação espacial com o Sheol.
- source_word: אֶל־בְּנִי
  choice: para junto de meu filho
  rationale: Traduz o sentido direcional e relacional de אֶל de maneira natural em português, sem substituir a expressão por 'por causa de meu filho'.
- source_word: אָבֵל
  choice: de luto
  rationale: Expressa o estado de quem lamenta uma morte e mantém a concisão do hebraico.
- source_word: שְׁאֹלָה
  choice: ao Sheol
  rationale: A forma com ה direcional significa 'ao Sheol'. A transliteração conserva o conceito hebraico sem reduzi-lo automaticamente à sepultura física nem identificá-lo com uma doutrina posterior do inferno.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: E seu pai chorou por ele
  rationale: Reproduz diretamente o sujeito ('seu pai') e o referente pronominal ('por ele'), mantendo a progressão narrativa do waw.
theological_decisions:
- issue: Sentido de שְׁאוֹל (Sheol)
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: O termo pode abranger a esfera dos mortos e não deve ser limitado silenciosamente a uma cova nem equiparado ao conceito posterior de inferno. A transliteração preserva essa amplitude, com explicação em nota.
- issue: Relação entre Jacó, seu filho e o Sheol
  choice: “para junto de meu filho, ao Sheol”
  alternative: “ao Sheol, para junto de meu filho”
  rationale: A redação mantém a afirmação de Jacó de que desceria ao lugar dos mortos para junto do filho que julgava morto, sem definir com maior precisão a condição dos mortos ou uma geografia do além.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção acessível ao público brasileiro. Conservou-se 'Sheol' por precisão conceitual, acompanhado de nota breve. A repetição 'consolá-lo ... ser consolado' reproduz deliberadamente a repetição lexical do hebraico.
