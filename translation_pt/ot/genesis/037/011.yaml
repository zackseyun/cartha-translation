  naturalness: A redação revista é moderna, clara e natural em português de ampla compreensão. “Tinham inveja dele” evita a possível leitura predominantemente possessiva de “ciúmes dele” e não acrescenta aspecto incoativo.
  terminology: “Assunto” comunica adequadamente הַדָּבָר neste contexto. A nota conserva as alternativas mais literais “declaração” e “palavra”, explicando o sentido idiomático de guardar atentamente na memória.
