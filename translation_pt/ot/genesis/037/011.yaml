  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: pt
  text: Seus irmãos tinham inveja dele, mas seu pai guardou o assunto na memória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guardou a declaração” ou “guardou a palavra”; isto é, reteve na memória o relato de José e continuou a refletir sobre ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: ficaram com ciúmes
  rationale: O verbo קנא indica ciúme ou inveja despertados pela posição favorecida de José e por seus sonhos. A expressão é natural no português atual e preserva a reação emocional narrada.
- source_word: בּוֹ
  choice: dele
  rationale: Com קנא, a preposição ב marca aqui o objeto do ciúme; em português, “com ciúmes dele” é uma construção idiomática.
- source_word: אֶחָיו
  choice: os irmãos de José
  rationale: O substantivo masculino plural refere-se especificamente aos irmãos de José. A explicitação do nome evita uma sequência pronominal pesada e mantém a referência clara no versículo isolado.
- source_word: וְאָבִיו
  choice: mas seu pai
  rationale: 'Embora וְ seja normalmente “e”, neste contexto liga reações contrastantes: o ciúme dos irmãos e a atenção reflexiva do pai. “Mas” expressa naturalmente esse contraste.'
- source_word: שָׁמַר
  choice: guardou ... na memória
  rationale: שׁמר significa literalmente guardar ou conservar e, neste uso, indica reter algo com atenção e continuar a considerá-lo.
- source_word: אֶת־הַדָּבָר
  choice: o assunto
  rationale: דבר pode significar palavra, declaração, coisa ou assunto. Aqui abrange tanto o relato do sonho quanto sua possível importância.
