  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: pt
  text: Quando José chegou aos seus irmãos, eles o despiram de sua túnica, a túnica ornamentada[a] que estava sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a túnica de mangas compridas” ou “a túnica ricamente ornamentada”. O sentido da expressão hebraica é incerto; a tradução tradicional “túnica de muitas cores” também é possível, mas provavelmente menos provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz naturalmente a circunstância temporal no fluxo narrativo, sem reproduzir de modo rígido a fórmula hebraica.
- source_word: בָּא ... אֶל אֶחָיו
  choice: chegou até seus irmãos
  rationale: Expressa em português corrente o movimento de José até seus irmãos; o masculino plural corresponde ao contexto.
- source_word: וַיַּפְשִׁיטוּ אֶת יוֹסֵף
  choice: eles o despiram
  rationale: Preserva a ação transitiva e coerciva de retirar de José a roupa, evitando uma formulação que pudesse parecer voluntária.
- source_word: כֻּתָּנְתּוֹ
  choice: sua túnica
  rationale: “Túnica” é uma designação precisa e reconhecível para a peça de roupa indicada pelo hebraico.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: a túnica especial
  rationale: O sentido exato de פַּסִּים é incerto. “Especial” comunica que era uma peça distintiva sem decidir indevidamente entre cores, ornamentação ou mangas/comprimento.
- source_word: אֲשֶׁר עָלָיו
  choice: que ele vestia
  rationale: Equivalente idiomático em português para a expressão hebraica literalmente referente à túnica que estava sobre ele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição hebraica de “José” foi vertida pelo pronome “o” para evitar peso desnecessário, enquanto a aposição que identifica a túnica foi preservada.
