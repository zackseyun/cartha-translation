  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: pt
  text: Os irmãos de José foram pastorear o rebanho de seu pai em Siquém[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto a Siquém”. A preposição hebraica pode indicar localização na cidade ou junto a ela, em suas proximidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: O wayyiqtol de הלך dá sequência à narrativa. “Foram” é a forma simples e natural em português, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: אֶחָיו
  choice: os irmãos de José
  rationale: O hebraico diz literalmente “seus irmãos”. O nome “José” torna o referente claro em português e evita uma abertura pronominal ambígua, sem alterar o sentido contextual.
- source_word: לִרְעוֹת
  choice: apascentar
  rationale: O infinitivo de רעה expressa a finalidade de cuidar do rebanho e levá-lo a pastar. “Apascentar” é corrente no contexto pastoril e preserva tanto o cuidado quanto o pastoreio.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: אֵת marca o objeto direto definido e normalmente não recebe equivalente lexical em português.
- source_word: צֹאן
  choice: rebanho
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” evita especificar uma espécie que o texto não especifica.
- source_word: אֲבִיהֶם
  choice: do pai
  rationale: A construção hebraica indica posse, literalmente “de seu pai/deles”. Em português, “do pai” é natural, e a relação com os irmãos já está clara.
- source_word: בִּשְׁכֶם
  choice: em Siquém
  rationale: A preposição בְּ pode indicar localização dentro da cidade ou nela/em suas proximidades. “Em Siquém” é a formulação portuguesa mais natural, mantendo a alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Apascentar” mantém o cenário pastoril sem restringir צֹאן apenas a ovelhas. O referente “José” foi explicitado por clareza discursiva.
