  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: pt
  text: 'Ele lhe disse: “Vá agora ver como estão seus irmãos e como está o rebanho, e traga-me notícias”. Assim, ele o enviou do vale de Hebrom, e ele chegou a Siquém.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Vá agora
  rationale: O imperativo לֶךְ significa “vá”, e נָא suaviza ou reforça o pedido. “Vá agora” é natural no fluxo narrativo e conserva a nuance contextual.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: ver como estão / como está
  rationale: ראה significa literalmente “ver”, enquanto שׁלום aqui se refere ao estado, bem-estar ou segurança. A formulação idiomática em português conserva o verbo “ver” e comunica com clareza a consulta sobre a condição deles.
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: O substantivo masculino plural refere-se, no contexto, aos irmãos homens de José.
- source_word: הַצֹּאן
  choice: o rebanho
  rationale: צאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” é natural e evita especificar uma só espécie.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: traga-me notícias
  rationale: A expressão idiomática pede que José volte com informação. “Traga-me notícias” transmite naturalmente esse sentido em português.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: do vale de Hebrom
  rationale: Preserva o substantivo עֵמֶק, “vale”, e sua relação com Hebrom.
- source_word: שְׁכֶמָה
  choice: a Siquém
  rationale: O hê direcional indica movimento em direção a Siquém, expresso naturalmente pela preposição “a”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição hebraica de שְׁלוֹם é refletida pela estrutura paralela “como estão... e como está...”, sem impor ao termo o sentido restrito de ausência de conflito.
