review_pass:
  verdict: revise
  source_fidelity: A draft transmite corretamente a cena, a caravana, a procedência em Gileade e as três mercadorias. Contudo, «para comer» deixa de explicitar «pão» (לֶחֶם), e «que iam levar» tem antecedente sintaticamente ambíguo, podendo referir-se às mercadorias, aos camelos ou aos ismaelitas. A revisão conserva a direção para o Egito e torna a relação entre a caravana e seus camelos mais clara.
  naturalness: O português é geralmente natural e de registro narrativo adequado. «E eis que» reproduz de modo fluente a função discursiva de וְהִנֵּה. A construção revista evita a oração relativa ambígua e mantém uma cadência moderna.
  terminology: «Ismaelitas», «Gileade», «bálsamo» e «Egito» estão adequados. «Goma aromática» é uma solução prudente para נְכֹאת. «Ládano» é uma identificação possível para לֹט; a nota preserva corretamente a incerteza lexical e a alternativa «mirra», sem a apresentar como certeza.
  issues:
  - severity: low
    issue: Omissão de «pão»
    rationale: Embora «comer» possa resumir idiomaticamente a expressão hebraica, o texto-fonte traz literalmente «comer pão». Em uma tradução de equivalência ótima, «comer pão» é natural e preserva esse detalhe sem custo de legibilidade.
  - severity: medium
    issue: Antecedente ambíguo em «que iam levar para o Egito»
    rationale: A oração relativa não determina com clareza quem iria ao Egito. O hebraico apresenta os camelos carregando as mercadorias e seguindo em direção ao Egito; a revisão explicita a caravana com seus camelos, sem decidir além do necessário.
  revised_text: Então, eles se sentaram para comer pão. Ergueram os olhos e viram, e eis que uma caravana de ismaelitas vinha de Gileade, com seus camelos carregados de goma aromática, bálsamo e ládano[a], seguindo para o Egito.
  revised_footnotes:
  - marker: a
    text: A identificação exata do termo hebraico é incerta; também pode ser traduzido como “mirra”.
    reason: Preserva a incerteza botânica e lexical de לֹט sem sobrecarregar o texto principal.
