base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: pt
  text: Então, eles se sentaram para comer pão. Ergueram os olhos e viram, e eis que uma caravana de ismaelitas vinha de Gileade, com seus camelos carregados de goma aromática, bálsamo e ládano[a], seguindo para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata do termo hebraico é incerta; também pode ser traduzido como “mirra”.
    reason: Preserva a incerteza botânica e lexical de לֹט sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם (le’ekhol lechem)
  choice: para comer
  rationale: Embora לֶחֶם signifique literalmente “pão”, a expressão hebraica pode designar uma refeição em geral. “Para comer” comunica naturalmente o sentido no contexto sem especificar além do necessário.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים (orchat yishme‘elim)
  choice: uma caravana de ismaelitas
  rationale: אֹרְחָה designa uma companhia de viajantes, especialmente mercadores; “caravana” é a equivalência portuguesa direta e corrente.
- source_word: נְכֹאת (nekhot)
  choice: goma aromática
  rationale: O termo designa uma substância aromática transportada como mercadoria, mas sua identificação botânica exata é incerta. “Goma aromática” preserva a categoria provável sem alegar precisão indevida.
- source_word: צְרִי (tseri)
  choice: bálsamo
  rationale: Refere-se a uma resina ou substância medicinal aromática; “bálsamo” é claro, tradicional e lexicalmente adequado.
- source_word: לֹט (lot)
  choice: ládano
  rationale: Provavelmente indica ládano, uma resina aromática, embora a identificação não seja totalmente segura e muitas traduções usem “mirra”. A nota preserva essa incerteza.
- source_word: לְהוֹרִיד מִצְרָיְמָה (lehorid mitsraymah)
  choice: levar para o Egito
  rationale: O verbo expressa fazer descer, e o sufixo direcional indica movimento rumo ao Egito. Em português corrente, “levar para o Egito” transmite o sentido geográfico sem uma expressão artificial.
