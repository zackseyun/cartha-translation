revisions:
- from: Então eles se sentaram para comer. Ao erguerem os olhos, viram uma caravana de ismaelitas que vinha de Gileade. Os camelos deles carregavam goma aromática, bálsamo e ládano[a], que iam levar para o Egito.
  to: Então, eles se sentaram para comer pão. Ergueram os olhos e viram, e eis que uma caravana de ismaelitas vinha de Gileade, com seus camelos carregados de goma aromática, bálsamo e ládano[a], seguindo para o Egito.
  rationale: A revisão restitui «pão», melhora a representação de וְהִנֵּה e substitui a relativa ambígua por uma construção que liga claramente os camelos e sua carga à caravana que segue para o Egito. Mantém-se «ládano» com nota, pois a identificação de לֹט é disputada.
