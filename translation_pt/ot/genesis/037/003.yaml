  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: pt
  text: Israel amava José mais do que todos os seus filhos, porque ele era o filho da sua velhice; e fez para ele uma túnica ricamente ornamentada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “uma túnica de muitas cores”. A expressão hebraica é incerta; pode indicar uma túnica ricamente ornamentada ou uma veste que chegava aos pulsos e aos tornozelos, e não necessariamente às suas cores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome pessoal empregado no hebraico. O וְ narrativo não exige uma conjunção explícita em português neste ponto.
- source_word: אָהַב
  choice: amava
  rationale: Preserva o sentido comum de 'amar', sem substituí-lo por uma interpretação como 'favorecia', embora o contexto revele favoritismo.
- source_word: מִכָּל בָּנָיו
  choice: mais do que a todos os seus outros filhos
  rationale: Expressa a comparação marcada por מִן e mantém a referência específica aos filhos homens; 'outros' torna explícito em português que José também era filho de Israel.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão apresentada no texto.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: ele era o filho da sua velhice
  rationale: Conserva a expressão idiomática hebraica e sua relação com a idade avançada de Israel, sem especificar além do texto se José nasceu nessa fase ou lhe servia de companhia nela.
- source_word: וְעָשָׂה לוֹ
  choice: e mandou fazer para ele
  rationale: Em português, a construção pode indicar naturalmente que Israel providenciou a peça para José, sem exigir que ele próprio a tenha confeccionado.
- source_word: כְּתֹנֶת
  choice: túnica
  rationale: Designa de modo claro e historicamente apropriado a veste mencionada, evitando o sentido moderno de um casaco.
- source_word: פַּסִּים
  choice: ricamente ornamentada
  rationale: Oferece uma formulação legível sem afirmar como certa a interpretação tradicional das muitas cores nem a interpretação de uma veste que chegava aos pulsos e tornozelos; a incerteza é registrada em nota.
