base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: pt
  text: Enquanto isso, os medanitas[a] venderam José para o Egito, a Potifar, um oficial do faraó[b], comandante da guarda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “medanitas”. Em vista do contexto próximo (ver 37:28) e de versões antigas, muitos entendem aqui “midianitas”.'
    reason: alternative_reading
  - marker: b
    text: Ou “eunuco do faraó” ou “oficial da corte do faraó”. O termo hebraico pode indicar um eunuco literal ou um oficial do rei.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “chefe dos que abatem” ou “chefe dos executores”; no contexto real, provavelmente se refere ao comandante da guarda ou da guarda pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Enquanto isso, os medanitas
  rationale: O וְ introduz a retomada da linha narrativa e é expresso naturalmente por “Enquanto isso”. O texto massorético traz o etnônimo “medanitas”; a possível identificação contextual com os midianitas é preservada em nota.
- source_word: מָכְרוּ אֹתוֹ
  choice: venderam José
  rationale: O perfeito qal é traduzido pelo pretérito perfeito narrativo. A repetição de “José” em vez de “o” evita ambiguidade em português sem alterar o referente.
- source_word: אֶל מִצְרָיִם
  choice: no Egito
  rationale: Embora אֶל seja normalmente direcional, a construção completa apresenta Potifar como o comprador situado no Egito. Em português, “venderam José no Egito a Potifar” comunica com naturalidade o destino e o local da venda; “para o Egito” permanece possível.
- source_word: לְפוֹטִיפַר
  choice: a Potifar
  rationale: A preposição לְ marca o comprador; “a Potifar” é uma formulação portuguesa clara e concisa.
- source_word: סְרִיס פַּרְעֹה
  choice: oficial do faraó
  rationale: סָרִיס pode designar tanto um eunuco literal quanto, em sentido funcional, um oficial da corte. “Oficial” preserva a função sem decidir indevidamente a condição física.
- source_word: שַׂר הַטַּבָּחִים
  choice: comandante da guarda
  rationale: Literalmente, a expressão significa “chefe dos que abatem/executam”. No contexto da corte, designa provavelmente o responsável pela guarda real ou pelos executores; “comandante da guarda” é claro e tradicionalmente inteligível.
