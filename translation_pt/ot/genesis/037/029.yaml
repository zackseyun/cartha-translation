  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: pt
  text: Quando Rúben voltou à cisterna[a], viu que José não estava lá. Então rasgou suas roupas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cova». O termo hebraico bor pode designar uma cova ou uma cisterna.
    reason: lexical_alternative
  - marker: b
    text: Rasgar as próprias roupas era uma expressão costumeira de choque, tristeza ou aflição.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב, na sequência narrativa, indica que Rúben retornou ao lugar anterior; «voltou» é natural e não especifica além do texto.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: a cisterna / lá
  rationale: בּוֹר pode designar uma cova ou cisterna. O contexto imediato de Gênesis 37:24 menciona que o local estava sem água, favorecendo «cisterna»; na segunda ocorrência, «lá» evita repetição pesada sem alterar o referente.
- source_word: וְהִנֵּה
  choice: viu que
  rationale: הִנֵּה chama a atenção para uma descoberta súbita. Em português narrativo atual, «viu que» comunica naturalmente essa percepção, embora torne explícita a perspectiva implícita de Rúben.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: José não estava lá
  rationale: אֵין expressa ausência. A formulação preserva o fato de que José não se encontrava na cisterna, sem acrescentar a causa de sua ausência.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: Então rasgou suas roupas
  rationale: A expressão descreve o ato convencional de rasgar as próprias roupas diante de choque, aflição ou luto. «Roupas» é claro e corrente; «então» transmite a progressão narrativa do wayyiqtol.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «viu que» representa de modo idiomático a força de וְהִנֵּה; «cisterna» aproveita o contexto da narrativa, enquanto a alternativa lexical genuína é preservada em nota.
