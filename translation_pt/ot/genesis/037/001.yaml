  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: pt
  text: Jacó habitou na terra em que seu pai havia vivido como estrangeiro[a], na terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “na terra das peregrinações de seu pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Jacó habitou
  rationale: O verbo יָשַׁב indica morar, residir ou estabelecer-se. “Habitou” é claro e digno, sem sugerir uma permanência maior do que o hebraico exige. O וַ narrativo não precisa ser traduzido por um marcador temporal explícito.
- source_word: בְּאֶרֶץ
  choice: na terra
  rationale: אֶרֶץ tem aqui sentido geográfico e territorial; “terra” preserva a formulação bíblica e a repetição do original.
- source_word: מְגוּרֵי אָבִיו
  choice: em que seu pai havia vivido como estrangeiro
  rationale: מְגוּרִים designa residência ou permanência como forasteiro. A oração relativa comunica esse sentido em português natural, preservando a condição de estrangeiro de seu pai.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém a repetição de בְּאֶרֶץ e a identificação territorial explícita do texto hebraico.
