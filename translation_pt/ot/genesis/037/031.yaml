  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: pt
  text: Então eles pegaram a túnica de José[a], abateram um bode e mergulharam a túnica no sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veste”; o termo hebraico designa uma roupa semelhante a uma túnica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Então eles pegaram
  rationale: O wayyiqtol dá continuidade à sequência narrativa. “Então” expressa essa progressão de modo natural em português moderno.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: a túnica de José
  rationale: כְּתֹנֶת designa uma veste semelhante a uma túnica. “Túnica” é claro, próximo do sentido da palavra hebraica e evita a ideia de um casaco moderno.
- source_word: וַיִּשְׁחֲטוּ
  choice: mataram
  rationale: O verbo se refere ao abate de um animal. Neste contexto não sacrificial, “mataram” comunica o ato com naturalidade e sem acrescentar conotações indevidas.
- source_word: שְׂעִיר עִזִּים
  choice: um bode
  rationale: A expressão especifica um caprino macho; “bode” preserva essa distinção de modo conciso e idiomático.
- source_word: וַיִּטְבְּלוּ
  choice: mergulharam
  rationale: O verbo significa mergulhar ou imergir. “Mergulharam” expressa naturalmente que a túnica foi colocada no sangue.
- source_word: הַכֻּתֹּנֶת
  choice: a túnica
  rationale: Repete-se a mesma tradução da primeira ocorrência para preservar a coesão lexical do versículo.
- source_word: בַּדָּם
  choice: no sangue
  rationale: A preposição com artigo aponta para o sangue do bode recém-morto; “no sangue” preserva essa referência definida.
theological_decisions: []
