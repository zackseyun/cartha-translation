  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: pt
  text: 'Ele a reconheceu e disse: “É a túnica do meu filho! Um animal feroz o devorou. José foi certamente despedaçado[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa um infinitivo absoluto seguido de uma forma verbal passiva da mesma raiz: literalmente, “despedaçar, foi despedaçado”, para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Ele a reconheceu
  rationale: O hifil de נכר significa reconhecer ou identificar; o pronome feminino retoma כְּתֹנֶת, “túnica”, também feminino em português.
- source_word: כְּתֹנֶת בְּנִי
  choice: a túnica do meu filho
  rationale: כְּתֹנֶת designa uma túnica ou veste longa; a construção com “do meu filho” é natural e mantém a relação possessiva do hebraico.
- source_word: חַיָּה רָעָה
  choice: um animal feroz
  rationale: חַיָּה se refere aqui a um animal selvagem, e רָעָה caracteriza seu caráter nocivo ou feroz, não uma maldade moral. “Animal feroz” é idiomático e adequado ao contexto predatório.
- source_word: אֲכָלָתְהוּ
  choice: o devorou
  rationale: No contexto de ataque animal, “devorou” comunica melhor que o sentido mais literal e genérico “comeu”.
- source_word: טָרֹף טֹרַף
  choice: Sem dúvida, José foi despedaçado
  rationale: O infinitivo absoluto seguido da forma verbal passiva intensifica a afirmação. “Sem dúvida” expressa a ênfase, e “foi despedaçado” transmite naturalmente a violência do ataque.
- source_word: יוֹסֵף
  choice: José
  rationale: “José” é a forma portuguesa estabelecida e amplamente inteligível do nome hebraico יוֹסֵף.
