  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: pt
  text: 'Então Judá disse aos seus irmãos: “Que vantagem teremos se matarmos nosso irmão e encobrirmos o sangue dele?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que lucro haverá se matarmos nosso irmão e ocultarmos o sangue dele?” A expressão hebraica “encobrir o sangue” literalmente preserva a imagem de cobrir o sangue e provavelmente se refere a ocultar o derramamento de sangue ou a responsabilidade por ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל אֶחָיו
  choice: aos seus irmãos
  rationale: O masculino plural refere-se, no contexto, aos irmãos homens de José presentes na cena.
- source_word: מַה בֶּצַע
  choice: Que vantagem teremos
  rationale: בֶּצַע denota ganho, proveito ou vantagem, com possível nuance de interesse próprio. A formulação transmite com clareza o cálculo pragmático de Judá.
- source_word: כִּי נַהֲרֹג
  choice: se matarmos
  rationale: כִּי introduz aqui a situação contemplada pela pergunta retórica, e o subjuntivo futuro é idiomático em português após “se”.
- source_word: אָחִינוּ
  choice: nosso irmão
  rationale: Tradução direta que preserva a força moral do vínculo familiar.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: e encobrirmos o sangue dele
  rationale: Mantém a imagem hebraica de cobrir o sangue, ao mesmo tempo que “encobrir” comunica naturalmente a ideia de ocultar o derramamento de sangue ou a culpa.
