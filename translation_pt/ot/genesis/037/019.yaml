  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: pt
  text: 'E disseram uns aos outros: “Vejam! Lá vem aquele sonhador[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o senhor” ou “dono dos sonhos”; expressão usada aqui em tom de zombaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol de אמר dá sequência à narrativa; “E disseram” preserva essa ligação de modo natural.
- source_word: אִישׁ אֶל־אָחִיו
  choice: uns aos outros
  rationale: A expressão literalmente diz “um ao seu irmão”, mas funciona aqui de modo recíproco.
- source_word: הִנֵּה
  choice: Olhem!
  rationale: A interjeição chama a atenção para José, que se aproxima; o plural concorda naturalmente com o grupo interpelado.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: dono dos sonhos
  rationale: A tradução relativamente literal preserva a formulação sarcástica e marcante dos irmãos; בעל pode indicar dono, senhor ou alguém caracterizado por algo.
- source_word: הַלָּזֶה
  choice: aquele
  rationale: O demonstrativo aponta José com distanciamento e possível desprezo; “aquele” transmite bem essa nuance em português.
- source_word: בָּא
  choice: Lá vem
  rationale: O particípio indica a aproximação em curso; a expressão portuguesa é natural e combina com a chamada de atenção de הִנֵּה.
