  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: pt
  text: 'Então Israel disse a José: “Seus irmãos não estão cuidando dos rebanhos em Siquém? Venha, e eu vou enviar você até eles.” E ele lhe disse: “Aqui estou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome empregado no texto hebraico, sem substituí-lo por Jacó.
- source_word: הֲלוֹא
  choice: não estão...?
  rationale: Preserva a pergunta retórica que espera uma resposta afirmativa, em formulação natural em português.
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: Representa diretamente o substantivo plural com sufixo de segunda pessoa masculina singular.
- source_word: רֹעִים
  choice: cuidando dos rebanhos
  rationale: Expressa de modo claro e natural a atividade pastoral de רעה; o objeto implícito é recuperado pelo contexto narrativo.
- source_word: בִּשְׁכֶם
  choice: em Siquém
  rationale: Traduz a preposição locativa ב e emprega a forma portuguesa tradicional do topônimo.
- source_word: לְכָה
  choice: Venha
  rationale: Conserva o imperativo hebraico como convocação dirigida por Israel a José.
- source_word: וְאֶשְׁלָחֲךָ
  choice: vou enviar você
  rationale: Reproduz naturalmente em português a intenção subsequente à convocação, sem acrescentar finalidade ausente.
- source_word: אֲלֵיהֶם
  choice: até eles
  rationale: Mantém a referência pronominal aos irmãos e explicita naturalmente o destino do envio.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Preserva a fórmula hebraica de prontidão e disponibilidade em forma corrente e digna.
