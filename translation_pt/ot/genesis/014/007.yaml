  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: pt
  text: Depois voltaram e chegaram a En-Mispate (isto é, Cades)[a]. Atacaram toda a região dos amalequitas[b] e também os amorreus que habitavam em Hazazom-Tamar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Mispate significa “fonte do julgamento”.
    reason: cultural_note
  - marker: b
    text: Ou “todo o campo dos amalequitas”. O hebraico diz literalmente “todo o campo do amalequita”, provavelmente referindo-se à região ocupada pelos amalequitas.
    reason: lexical_alternative
  - marker: c
    text: Hazazom-Tamar é identificada com En-Gedi em 2 Crônicas 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Depois voltaram
  rationale: O wayyiqtol dá continuidade à narrativa, e שוב indica o retorno ou mudança de direção; “Depois voltaram” é natural e preserva a sequência.
- source_word: וַיָּבֹאוּ אֶל
  choice: e chegaram a
  rationale: בוא com אֶל descreve a chegada ao destino; “chegaram a” é idiomático em português e claro no contexto do retorno.
- source_word: עֵין מִשְׁפָּט
  choice: En-Mispate
  rationale: O topônimo é transliterado, em vez de traduzido no corpo do versículo; seu sentido é informado em nota.
- source_word: הִוא קָדֵשׁ
  choice: (isto é, Cades)
  rationale: A expressão identifica En-Mispate com Cades; a formulação parentética reproduz claramente a função explicativa.
- source_word: וַיַּכּוּ
  choice: Atacaram
  rationale: נכה pode significar golpear, atacar ou derrotar. “Atacaram” preserva a ação militar sem afirmar de modo inequívoco uma derrota total.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: toda a região dos amalequitas
  rationale: שׂדה significa literalmente “campo”, mas aqui provavelmente designa a área ocupada pelo grupo; “região” é natural e mantém a referência geográfica.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: e também os amorreus
  rationale: “E também” conserva a força aditiva de וְגַם; o gentílico singular hebraico tem sentido coletivo e é vertido pelo plural português.
- source_word: הַיֹּשֵׁב
  choice: que habitavam
  rationale: O particípio apresenta os amorreus como residentes do lugar; “habitavam” é conciso, corrente e digno.
- source_word: בְּחַצְצֹן תָּמָר
  choice: em Hazazom-Tamar
  rationale: A preposição בְּ indica localização, e o nome próprio é transliterado segundo forma legível em português.
theological_decisions: []
