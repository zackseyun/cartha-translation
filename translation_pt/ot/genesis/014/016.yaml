  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: pt
  text: Ele trouxe de volta todos os bens[a]; trouxe de volta também Ló, seu parente[b], e os bens dele, e também as mulheres[c] e o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as posses” ou “toda a propriedade”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu irmão”. Aqui, “irmão” tem o sentido mais amplo de parente; na narrativa, Ló é sobrinho de Abrão.'
    reason: lexical_alternative
  - marker: c
    text: “As mulheres” pode incluir esposas neste contexto, mas o termo hebraico é mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: trouxe de volta
  rationale: As duas formas são do hifil de שׁוב e indicam fazer retornar pessoas e bens recuperados. “Trouxe de volta” é natural em português e preserva a repetição verbal do hebraico.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: todos os bens / os bens dele
  rationale: רְכוּשׁ designa posses, propriedade ou bens, especialmente bens materiais. “Bens” é amplo, claro e idiomático; “dele” evita a possível ambiguidade de “seus”.
- source_word: וְגַם
  choice: também / e também
  rationale: A tradução mantém as duas ocorrências e sua força aditiva, com pequena variação de posição para soar natural em português.
- source_word: לוֹט אָחִיו
  choice: Ló, seu parente
  rationale: Embora אָח signifique literalmente “irmão”, também pode designar um familiar em sentido mais amplo. No contexto narrativo, Ló é sobrinho de Abrão; “parente” comunica a relação sem impor o sentido estrito de irmão.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: O termo é mais amplo que “esposas”; o contexto não exige restringi-lo a mulheres casadas.
- source_word: הָעָם
  choice: o povo
  rationale: עָם abrange as pessoas recuperadas e não deve ser restringido apenas aos homens.
