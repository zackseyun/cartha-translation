  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: pt
  text: No décimo quarto ano, Quedorlaomer veio com os reis que o acompanhavam, e eles derrotaram os refains[a] em Asterote-Carnaim, os zuzins em Ham e os emins em Savé-Quiriataim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções vertem “refains” como “gigantes”; aqui, o termo hebraico é preservado como nome de um povo.
    reason: lexical_alternative
  - marker: b
    text: “Savé-Quiriataim” também pode ser entendido como “a planície de Quiriataim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: No décimo quarto ano
  rationale: A expressão funciona como indicação temporal. A conjunção inicial fica implícita no fluxo narrativo, como é natural em português.
- source_word: בָּא
  choice: veio
  rationale: O verbo בוא significa normalmente “vir” ou “chegar”. “Veio” preserva sua amplitude sem acrescentar a ideia específica de marcha militar.
- source_word: כְדָרְלָעֹמֶר
  choice: Quedorlaomer
  rationale: Transliteração adaptada às convenções gráficas e à pronúncia natural do português.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: com os reis que o acompanhavam
  rationale: Expressa de modo natural que os demais reis estavam aliados a Quedorlaomer e vieram com ele.
- source_word: וַיַּכּוּ
  choice: eles derrotaram
  rationale: Embora נכה possa significar literalmente “ferir” ou “golpear”, neste contexto militar descreve povos vencidos; “derrotaram” comunica esse sentido com clareza.
- source_word: רְפָאִים
  choice: os refains
  rationale: Preserva o termo como nome de um povo, sem adotar a interpretação tradicional “gigantes” como tradução no texto.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: em Asterote-Carnaim
  rationale: A preposição indica o local da batalha; o topônimo é transliterado em forma adequada ao português.
- source_word: הַזּוּזִים
  choice: os zuzins
  rationale: O nome do povo é transliterado, e o artigo hebraico é naturalmente representado em português.
- source_word: בְּהָם
  choice: em Ham
  rationale: O termo é entendido como topônimo e, por isso, transliterado.
- source_word: הָאֵימִים
  choice: os emins
  rationale: O etnônimo é transliterado e recebe a forma plural natural em português.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: em Savé-Quiriataim
  rationale: A expressão é tratada no texto como topônimo composto, de acordo com o padrão geográfico do versículo, sem eliminar a possível leitura lexical de שָׁוֵה.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas adaptadas à leitura lusófona. A estrutura conserva a mudança do verbo singular (“veio”, referente a Quedorlaomer) para o plural (“derrotaram”, referente a ele e aos reis aliados).
