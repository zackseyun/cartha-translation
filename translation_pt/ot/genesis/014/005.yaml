  terminology: “Refains”, “zuzins” e “emins” funcionam adequadamente como nomes de povos em português; “Asterote-Carnaim” e “Savé-Quiriataim” são formas transliteradas legíveis. As notas evitam transformar “refains” em uma interpretação fixa e registram apropriadamente a alternativa para Savé-Quiriataim.
