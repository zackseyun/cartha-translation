source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: pt
  text: 'que não tomarei nem um fio nem uma correia de sandália[a], nem coisa alguma que seja sua, para que você não diga: “Eu enriqueci Abrão”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma fórmula elíptica de juramento; literalmente: “se, desde um fio até uma correia de sandália, e se eu tomar algo de tudo o que é seu...”. O sentido é uma recusa feita sob juramento.'
    reason: Explicar a fórmula hebraica de juramento e a tradução não literal da construção אִם ... וְאִם.
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: que não... nem
  rationale: No contexto do juramento iniciado no versículo anterior, אִם introduz uma fórmula elíptica de recusa. A negação implícita é expressa em português para tornar claro o sentido, enquanto a nota preserva a forma hebraica.
- source_word: מִחוּט
  choice: um fio
  rationale: חוּט designa um fio ou cordão; a tradução mantém a imagem concreta de algo insignificante.
- source_word: וְעַד שְׂרוֹךְ נַעַל
  choice: nem uma correia de sandália
  rationale: שְׂרוֹךְ נַעַל é a tira ou correia que prende uma sandália. A coordenação com “nem” comunica naturalmente em português a recusa abrangente expressa pela construção hebraica “desde... até...”.
- source_word: אֶקַּח
  choice: pegarei
  rationale: O verbo לקח significa tomar ou pegar. O futuro em português se ajusta à declaração solene de que Abrão não aceitará nenhum bem.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: coisa alguma que seja sua
  rationale: A formulação transmite de modo natural tanto a abrangência de כָּל quanto a relação de posse.
- source_word: וְלֹא תֹאמַר
  choice: para que você não diga
  rationale: A oração apresenta o propósito da recusa de Abrão. Esta forma é clara, atual e preserva a relação lógica do hebraico.
- source_word: הֶעֱשַׁרְתִּי
  choice: enriqueci
  rationale: O hifil de עשר significa tornar rico ou enriquecer. “Enriqueci” preserva de modo conciso a alegação que o rei poderia fazer.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português antes de sua mudança para Abraão.
theological_decisions:
- issue: Fórmula elíptica de juramento
  choice: Explicitar a recusa juramentada com “que não pegarei”, em continuidade sintática com o juramento do versículo 22.
  alternative: 'Reproduzir literalmente a construção condicional: “se desde um fio... e se eu pegar...”'
  rationale: No hebraico, אִם funciona aqui como fórmula elíptica de juramento, na qual a consequência da violação fica sem ser declarada. Uma tradução condicional literal seria obscura em português; a nota registra a forma e a tensão do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. O início “que não pegarei” mantém a ligação do versículo com o juramento de Abrão em Gênesis 14:22. A imagem concreta do fio e da correia de sandália foi preservada, e a nota esclarece a sintaxe elíptica do hebraico.
