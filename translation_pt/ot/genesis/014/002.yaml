source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: pt
  text: travaram guerra[a] contra Bera, rei de Sodoma, Birsa, rei de Gomorra, Sinabe, rei de Admá, Semeber, rei de Zeboim, e o rei de Bela (isto é, Zoar).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fizeram guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: travaram guerra
  rationale: O hebraico diz literalmente “fizeram guerra”. “Travaram guerra” reproduz o sentido idiomático com naturalidade e dignidade em português atual.
- source_word: אֶת ... וְאֶת
  choice: contra
  rationale: Neste contexto, a partícula introduz os reis contra os quais a guerra foi travada. Um único “contra” rege naturalmente toda a lista em português.
- source_word: בֶּרַע
  choice: Bera
  rationale: Nome pessoal transliterado em forma compatível com o uso bíblico em português.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: בִּרְשַׁע
  choice: Birsa
  rationale: Nome pessoal transliterado em forma corrente nas Bíblias em português.
- source_word: עֲמֹרָה
  choice: Gomorra
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: שִׁנְאָב
  choice: Sinabe
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas.
- source_word: אַדְמָה
  choice: Admá
  rationale: A acentuação explicita em português a tonicidade final refletida pela forma hebraica.
- source_word: שֶׁמְאֵבֶר
  choice: Semeber
  rationale: Transliteração legível em português, sem traduzir o nome próprio.
- source_word: צביים
  choice: Zeboim
  rationale: Forma bíblica estabelecida em português e próxima da tradição de transliteração do topônimo hebraico.
- source_word: מֶלֶךְ בֶּלַע
  choice: o rei de Bela
  rationale: O último integrante da lista não é nomeado pessoalmente; o hebraico o identifica apenas como rei da cidade de Bela.
- source_word: הִיא צֹעַר
  choice: isto é, Zoar
  rationale: A expressão identifica Bela com Zoar; a formulação parentética conserva claramente sua função explicativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis para leitores brasileiros e internacionais. A enumeração foi tratada como uma única lista de adversários regida por “contra”, evitando a ambiguidade que surgiria se a preposição fosse ligada apenas aos dois primeiros reis.
