  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: pt
  text: Então o rei de Sodoma saiu ao encontro dele, depois que ele voltou de derrotar Quedorlaomer e os reis que estavam com ele, ao vale de Savé, isto é, o vale do Rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então ... saiu
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: מֶלֶךְ סְדֹם
  choice: o rei de Sodoma
  rationale: A cadeia construta é traduzida diretamente, usando a forma portuguesa estabelecida do topônimo.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: Expressão portuguesa natural que preserva o movimento intencional para encontrar a pessoa mencionada.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: depois que ele voltou
  rationale: Representa com clareza a construção hebraica com infinitivo e sufixo, sem explicitar no texto um referente que o hebraico deixa pronominal.
- source_word: מֵהַכּוֹת
  choice: de derrotar
  rationale: Neste contexto militar, o hifil de נכה indica vencer ou derrotar, mais do que apenas golpear.
- source_word: כְּדָרלָעֹמֶר
  choice: Quedorlaomer
  rationale: Transliteração adaptada à ortografia e à leitura correntes em português, preservando de modo reconhecível o nome hebraico.
- source_word: וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: e os reis que estavam com ele
  rationale: Reproduz naturalmente a oração relativa hebraica; o pronome permanece como no original.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: até o vale de Savé
  rationale: “Até” preserva a força direcional de אֶל e se encaixa naturalmente com o verbo de movimento; Savé translitera o topônimo para leitores de português.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: isto é, o vale do Rei
  rationale: A expressão explicativa identifica o vale de Savé por seu outro nome, sem necessidade de parênteses.
theological_decisions: []
