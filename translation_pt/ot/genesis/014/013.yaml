  text: וַ/יָּבֹא֙ הַ/פָּלִ֔יט וַ/יַּגֵּ֖ד לְ/אַבְרָ֣ם הָ/עִבְרִ֑י וְ/הוּא֩ שֹׁכֵ֨ן בְּ/אֵֽלֹנֵ֜י מַמְרֵ֣א הָ/אֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַ/אֲחִ֣י עָנֵ֔ר וְ/הֵ֖ם בַּעֲלֵ֥י בְרִית אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: pt
  text: Então veio um fugitivo e contou a Abrão, o hebreu. Abrão morava junto aos carvalhos de Manre[a], o amorreu, irmão de Escol e irmão de Aner[b]. Eles eram aliados de Abrão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «junto aos terebintos de Manre». O termo hebraico pode designar árvores grandes, muitas vezes identificadas como carvalhos ou terebintos.
    reason: lexical_alternative
  - marker: b
    text: Ou «parente de Escol e parente de Aner». A palavra hebraica traduzida por «irmão» também pode indicar uma relação familiar mais ampla.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «senhores/detentores de uma aliança com Abrão», isto é, homens ligados a ele por um tratado.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: um fugitivo
  rationale: Designa alguém que escapou de perigo ou de uma batalha. «Fugitivo» é conciso e mantém em primeiro plano a ideia da fuga, embora «sobrevivente» também seja possível.
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O verbo significa contar, comunicar ou relatar. «Contou» preserva o estilo narrativo direto e soa natural em português.
- source_word: הָעִבְרִי
  choice: o hebreu
  rationale: Mantém a designação étnica ou social atribuída a Abrão no texto hebraico.
- source_word: שֹׁכֵן
  choice: morava
  rationale: O particípio expressa residência continuada naquele período. «Morava» transmite esse aspecto durativo em português corrente.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: junto aos carvalhos de Manre
  rationale: אֵלֹנֵי designa árvores grandes e pode referir-se a carvalhos ou terebintos. «Carvalhos» é uma opção tradicional e compreensível; a alternativa é registrada em nota.
- source_word: הָאֱמֹרִי
  choice: o amorreu
  rationale: Reproduz diretamente a designação étnica que está em aposição a Manre.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: irmão de Escol e irmão de Aner
  rationale: Preserva a repetição e o sentido mais imediato de אָח. Como o termo também pode indicar parentesco mais amplo, essa possibilidade é mantida em nota.
- source_word: בַּעֲלֵי בְרִית
  choice: aliados
  rationale: A expressão significa literalmente «senhores/detentores de uma aliança» e descreve homens ligados a Abrão por pacto ou tratado. «Aliados» comunica naturalmente essa relação político-pactual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O nome «Abrão» segue a forma portuguesa tradicional anterior à mudança para Abraão. A segunda ocorrência de «Abrão» explicita o referente do pronome hebraico para evitar uma ambiguidade artificial em português, sem alterar o sentido contextual.
