id: GEN.14.18
reference: Genesis 14:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: pt
  text: E Melquisedeque, rei de Salém, trouxe pão e vinho[a]. Ele era sacerdote do Deus Altíssimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trouxe para fora pão e vinho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: El Elyon, isto é, “Deus Altíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melquisedeque
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida do nome próprio; seu possível significado não é inserido no texto.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente comum e direto para o governante real, em aposição a Melquisedeque.
- source_word: שָׁלֵם
  choice: Salém
  rationale: Forma portuguesa tradicional do topônimo, com acento para indicar a pronúncia natural em português.
- source_word: הוֹצִיא
  choice: trouxe
  rationale: O hifil de יצא pode expressar fazer sair ou trazer para fora. Neste contexto, “trouxe” comunica de modo natural a ação de apresentar os alimentos, sem acrescentar quem os transportou fisicamente.
- source_word: לֶחֶם
  choice: pão
  rationale: Equivalente concreto e usual; o contexto não exige o sentido mais amplo de alimento.
- source_word: יָיִן
  choice: vinho
  rationale: Equivalente direto, sem suavização nem paráfrase.
- source_word: כֹהֵן
  choice: sacerdote
  rationale: Preserva o ofício religioso sem projetar sobre Melquisedeque estruturas sacerdotais israelitas posteriores.
- source_word: אֵל עֶלְיוֹן
  choice: Deus Altíssimo
  rationale: Traduz a designação divina de forma clara e tradicional; “Altíssimo” mantém a força titular de עֶלְיוֹן.
- source_word: וְהוּא
  choice: Ele era
  rationale: A nova frase destaca a identidade de Melquisedeque e fornece em português a cópula subentendida no hebraico.
theological_decisions:
- issue: Possíveis associações sacramentais posteriores do pão e do vinho
  choice: 'Manter a declaração histórica simples: “trouxe pão e vinho”'
  alternative: Empregar linguagem que sugira explicitamente uma antecipação eucarística
  rationale: Gênesis 14:18 relata apenas a ação de Melquisedeque e seu sacerdócio. A tradução não deve inserir no versículo uma interpretação teológica posterior.
- issue: Tratar אֵל עֶלְיוֹן como nome próprio ou como título traduzido
  choice: Traduzir como “Deus Altíssimo”
  alternative: Transliterar como “El Elyon”
  rationale: A tradução torna inteligível a designação divina, enquanto a nota conserva a forma hebraica e a ambiguidade entre nome e título.
- issue: Uso do artigo em “do Deus Altíssimo”
  choice: Empregar “do Deus Altíssimo”
  alternative: Empregar “de Deus Altíssimo”
  rationale: O artigo produz português natural e trata “Deus Altíssimo” como designação definida, sem afirmar além do texto uma identificação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas reconhecíveis sem arcaísmo. A ordem das notas foi ajustada para que cada marcador acompanhe a expressão a que se refere.
