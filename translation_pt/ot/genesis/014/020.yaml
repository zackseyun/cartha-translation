  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: pt
  text: E bendito seja o Deus Altíssimo, que entregou seus inimigos em sua mão. E ele lhe deu a décima parte de tudo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “o dízimo de tudo”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não repete expressamente o sujeito de “deu”. Pelo contexto, o sentido mais natural é que Abrão deu a Melquisedeque a décima parte de tudo; também é possível, embora menos provável, entender Melquisedeque como sujeito.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: E bendito seja
  rationale: Preserva a conjunção e expressa naturalmente em português a fórmula hebraica de bênção.
- source_word: אֵל עֶלְיוֹן
  choice: Deus Altíssimo
  rationale: Traduz o título divino de modo claro e tradicional, sem transliterar אֵל como nome próprio.
- source_word: מִגֵּן
  choice: entregou
  rationale: Neste contexto militar, o verbo significa entregar ou colocar os adversários sob o poder de alguém, não servir de escudo.
- source_word: צָרֶיךָ
  choice: os seus inimigos
  rationale: Representa o plural com sufixo de segunda pessoa masculina singular em linguagem portuguesa corrente.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Mantém a imagem concreta do idioma hebraico de entregar alguém ao poder de outra pessoa, usando a forma idiomática natural em português.
- source_word: וַיִּתֶּן לוֹ
  choice: E ele lhe deu
  rationale: Mantém a sequência narrativa e os referentes pronominais sem inserir nominalmente um sujeito que o hebraico não repete.
- source_word: מַעֲשֵׂר
  choice: a décima parte
  rationale: Expressa diretamente o sentido lexical e evita impor associações institucionais posteriores; “dízimo” continua sendo alternativa legítima.
- source_word: מִכֹּל
  choice: de tudo
  rationale: Comunica de modo natural que a décima parte foi tomada da totalidade dos bens ou despojos.
theological_decisions:
- issue: Sujeito implícito de וַיִּתֶּן
  choice: Manter “ele” sem substituir o pronome por “Abrão”
  alternative: 'Explicitar: “Abrão lhe deu” ou entender Melquisedeque como sujeito'
  rationale: O contexto indica mais naturalmente que Abrão deu a Melquisedeque a décima parte, mas a oração hebraica não nomeia novamente o sujeito. A tradução preserva essa forma, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Deus Altíssimo” preserva o título bíblico; “a décima parte” prioriza transparência lexical. Os dois marcadores aparecem ao fim da oração à qual se referem.
