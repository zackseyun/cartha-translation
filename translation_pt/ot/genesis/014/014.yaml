  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: pt
  text: Quando Abrão soube que seu irmão[a] tinha sido levado cativo, mobilizou[b] seus homens treinados, nascidos em sua casa, trezentos e dezoito, e os perseguiu até Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “seu irmão”; aqui, o termo pode designar um parente próximo, como um sobrinho.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser entendido como “fez sair”, “reuniu” ou, possivelmente, “armou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: tinha sido levado cativo
  rationale: O nifal de שׁבה indica ser levado cativo, especialmente em contexto de guerra; a formulação preserva esse sentido militar.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Preserva a forma explícita do hebraico, embora אָח também possa designar um parente próximo do sexo masculino, como um sobrinho.
- source_word: וַיָּרֶק
  choice: mobilizou
  rationale: O verbo é de interpretação discutida e, no contexto, descreve a preparação ou o emprego dos homens de Abrão para a perseguição. “Mobilizou” mantém o sentido militar sem decidir entre “fez sair” e “armou”.
- source_word: חֲנִיכָיו
  choice: seus homens treinados
  rationale: Expressa pessoas treinadas sob a autoridade de Abrão e soa natural no contexto militar.
- source_word: יְלִידֵי בֵיתוֹ
  choice: nascidos em sua casa
  rationale: Preserva a identificação desses homens como dependentes nascidos no âmbito da casa de Abrão.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: trezentos e dezoito
  rationale: Reproduz por extenso o número cardinal do hebraico em estilo narrativo digno e corrente.
- source_word: וַיִּרְדֹּף
  choice: perseguiu os inimigos
  rationale: רדף denota perseguição militar; “os inimigos” explicita em português o objeto subentendido pelo contexto.
- source_word: עַד דָּן
  choice: até Dã
  rationale: עַד marca o limite alcançado pela perseguição; “até Dã” é claro e idiomático.
theological_decisions:
- issue: Termo de parentesco aplicado a Ló
  choice: Manter “seu irmão” no texto principal
  alternative: seu parente
  rationale: O hebraico traz אָחִיו, literalmente “seu irmão”, mas o termo pode abranger um parente próximo. A tradução conserva a forma do texto e registra a amplitude semântica em nota, sem apagar a tensão entre a designação e o parentesco conhecido de Ló.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi preservada, e as ambiguidades lexicais relevantes foram mantidas por meio do texto principal e das notas.
