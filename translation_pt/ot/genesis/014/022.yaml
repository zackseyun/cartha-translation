id: GEN.14.22
reference: Genesis 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: pt
  text: 'Mas Abrão disse ao rei de Sodoma: “Levantei minha mão[a] a Yahweh, o Deus Altíssimo, possuidor do céu e da terra.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Levantei minha mão: gesto hebraico usado ao prestar juramento; isto é, Abrão está jurando.'
    reason: cultural_note
  - marker: b
    text: Ou “criador do céu e da terra”. O particípio hebraico pode ser entendido como “possuidor”, “dono” ou, neste contexto, “criador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Mas” expressa naturalmente o contraste entre a proposta do rei de Sodoma e a resposta de Abrão no contexto imediato.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ סְדֹם
  choice: rei de Sodoma
  rationale: Tradução direta da cadeia construta, definida pelo contexto.
- source_word: הֲרִימֹתִי יָדִי
  choice: Levantei minha mão
  rationale: Mantém a imagem concreta do hebraico, que descreve um gesto de juramento, sem substituí-la silenciosamente por uma interpretação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֵל עֶלְיוֹן
  choice: o Deus Altíssimo
  rationale: Traduz o título hebraico de maneira estabelecida, clara e natural em português.
- source_word: קֹנֵה
  choice: possuidor
  rationale: Preserva o sentido lexical de posse sem eliminar a possibilidade contextual de que o particípio também designe o Criador.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: do céu e da terra
  rationale: Expressão portuguesa natural para o merismo hebraico que abrange a totalidade da criação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio em vez de substituí-lo por um título.
- issue: Sentido de קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: possuidor do céu e da terra
  alternative: criador do céu e da terra; dono do céu e da terra
  rationale: O particípio admite sentidos relacionados a adquirir, possuir e, neste contexto, criar. A tradução principal retém “possuidor”, enquanto a nota registra a alternativa significativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a expressão concreta do juramento e a ambiguidade lexical de קֹנֵה; “céu e terra” mantém a formulação idiomática do merismo.
