  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: pt
  text: Durante doze anos, eles serviram a Quedorlaomer, mas no décimo terceiro ano se rebelaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Durante doze anos
  rationale: A expressão hebraica indica duração; esta formulação é clara e natural em português.
- source_word: עָבְדוּ
  choice: serviram
  rationale: עבד significa “servir” e, neste contexto político, descreve a sujeição dos reis vassalos a um soberano. “Serviram” conserva essa ideia sem explicitação excessiva.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Quedorlaomer
  rationale: O nome próprio é transliterado segundo a forma tradicional e amplamente reconhecível em português, compatível com a pronúncia aproximada do hebraico.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: mas no décimo terceiro ano
  rationale: Embora a construção seja literalmente “e treze anos”, o contexto apresenta o décimo terceiro ano como o momento da rebelião após doze anos de serviço; “mas” expressa naturalmente o contraste narrativo.
- source_word: מָרָדוּ
  choice: se rebelaram
  rationale: מרד denota rebelião ou revolta contra a autoridade; a forma pronominal é idiomática no português moderno.
