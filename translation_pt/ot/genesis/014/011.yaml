    issue: Explicitação locativa em «o alimento que havia nelas»
    rationale: O hebraico diz literalmente «todo o alimento deles/delas», com sufixo plural, mas não diz «que havia nelas». A redação atual restringe e interpreta a relação possessiva como localização nas duas cidades.
  - severity: low
    issue: Nota de rodapé usa «delas»
    rationale: «Delas» reforça a interpretação de que o referente são especificamente as cidades. «Suas provisões» conserva melhor a concisão e a ambiguidade contextual do sufixo hebraico.
  revised_text: Então, eles tomaram todos os bens de Sodoma e Gomorra e todo o seu alimento[a] e foram embora.
