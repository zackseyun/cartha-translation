  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: pt
  text: Então, eles tomaram todos os bens de Sodoma e Gomorra e todo o seu alimento[a] e foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas provisões”. O termo hebraico pode designar alimento em geral ou provisões para uma viagem ou campanha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: tomaram
  rationale: O qal wayyiqtol de לקח tem o sentido narrativo comum de “tomaram”. No contexto, “saquearam” ou “levaram” seriam possíveis, mas acrescentariam interpretação.
- source_word: כָּל
  choice: todos / todo
  rationale: O quantificador aparece duas vezes e expressa a totalidade tanto dos bens quanto do alimento; a repetição foi preservada.
- source_word: רְכֻשׁ
  choice: bens
  rationale: Designa posses ou propriedade, especialmente bens que podem ser levados. “Bens” é natural, abrangente e adequado ao contexto de despojo.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: São as formas tradicionais e amplamente reconhecidas desses topônimos em português.
- source_word: אָכְלָם
  choice: o alimento que havia nelas
  rationale: O substantivo derivado de אכל significa “alimento” ou “mantimento” e traz um sufixo masculino plural. Como os antecedentes imediatos são duas cidades, a formulação explicita em português que se trata do alimento pertencente ou disponível nelas, sem atribuir gênero pessoal às cidades.
- source_word: וַיֵּלֵכוּ
  choice: foram embora
  rationale: O qal wayyiqtol de הלך indica que partiram depois de tomar o despojo. “Foram embora” é corrente e mantém o movimento narrativo.
