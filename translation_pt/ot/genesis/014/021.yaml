base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: pt
  text: 'Então o rei de Sodoma disse a Abrão: “Dê-me as pessoas[a] e tome os bens para si[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “a pessoa” ou “a vida”, no singular, usado aqui coletivamente para as pessoas recuperadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “as posses” ou “a propriedade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência de modo natural em português.
- source_word: מֶלֶךְ סְדֹם
  choice: o rei de Sodoma
  rationale: A cadeia construta é vertida diretamente, com a forma tradicional portuguesa do topônimo.
- source_word: אֶל אַבְרָם
  choice: a Abrão
  rationale: A preposição indica o destinatário da fala, e “Abrão” é a forma tradicional e reconhecível do nome em português.
- source_word: תֶּן לִי
  choice: Dê-me
  rationale: O imperativo com pronome sufixado é expresso de maneira concisa e idiomática.
- source_word: הַנֶּפֶשׁ
  choice: as pessoas
  rationale: Embora o substantivo esteja no singular, נֶפֶשׁ tem aqui sentido coletivo e designa as pessoas recuperadas, em contraste com os bens.
- source_word: וְהָרְכֻשׁ
  choice: e ... os bens
  rationale: רְכוּשׁ designa bens, posses ou propriedade, especialmente bens materiais; “os bens” é claro e natural no contraste com as pessoas.
- source_word: קַח לָךְ
  choice: fique com
  rationale: A expressão comunica idiomaticamente que Abrão poderia tomar os bens para si, preservando a ideia de benefício ou posse pessoal.
theological_decisions: []
