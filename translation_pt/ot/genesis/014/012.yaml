base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: pt
  text: Levaram Ló[a], sobrinho de Abrão, e os bens dele, e foram embora. Ló morava em Sodoma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filho do irmão de Abrão”, isto é, sobrinho de Abrão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Levaram
  rationale: O qal narrativo de לקח significa normalmente “tomar” ou “levar”. No contexto de pessoas e bens capturados, “levaram” expressa com naturalidade o deslocamento resultante sem intensificar o verbo para “sequestraram” ou “saquearam”.
- source_word: רְכֻשׁוֹ
  choice: os bens dele
  rationale: רְכוּשׁ designa bens ou posses, especialmente propriedade transportável. “Os bens dele” é claro, corrente e evita a possível leitura jurídica de “propriedade”.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: sobrinho de Abrão
  rationale: A expressão hebraica diz literalmente “filho do irmão de Abrão”. “Sobrinho de Abrão” comunica de modo natural a relação de parentesco; a forma explícita do hebraico é preservada em nota.
- source_word: וַיֵּלֵכוּ
  choice: e foram embora
  rationale: הלך significa “ir”; neste contexto, depois de levarem Ló e seus bens, “foram embora” comunica naturalmente a partida sem acrescentar a força de “fugiram”.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Ló morava em Sodoma
  rationale: O particípio יֹשֵׁב descreve a situação de Ló como residente em Sodoma. Repetir “Ló” em vez de usar apenas “ele” evita ambiguidade em português e mantém a função explicativa da oração.
theological_decisions: []
