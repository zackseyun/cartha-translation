  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: pt
  text: 'E ele o abençoou e disse: “Bendito seja Abrão pelo Deus Altíssimo, possuidor[a] dos céus e da terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criador”. O particípio hebraico pode significar “possuidor”, “dono” ou, neste contexto, “criador”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do céu e da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: E ele o abençoou
  rationale: Preserva a sequência narrativa do wayyiqtol e o sufixo de objeto masculino singular, em português natural.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Mantém a coordenação explícita do hebraico e introduz naturalmente as palavras da bênção.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Reproduz a fórmula solene de bênção expressa pelo particípio passivo predicativo, sem reduzi-la a uma simples descrição.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Emprega a forma portuguesa tradicional do nome neste ponto da narrativa, antes de sua mudança para Abraão.
- source_word: לְאֵל
  choice: pelo Deus
  rationale: Na fórmula de bênção, a preposição לְ pode indicar aquele de quem procede a bênção; “pelo Deus” comunica essa relação de modo claro em português.
- source_word: אֵל עֶלְיוֹן
  choice: Deus Altíssimo
  rationale: Preserva o título divino formado por substantivo e adjetivo, em formulação consagrada e natural em português.
- source_word: קֹנֵה
  choice: possuidor
  rationale: O particípio de קנה pode denotar possuir, adquirir ou, neste contexto, criar. “Possuidor” conserva a amplitude lexical sem decidir silenciosamente pela leitura “Criador”; essa alternativa aparece em nota.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: dos céus e da terra
  rationale: Traduz o merismo que abrange a totalidade do mundo criado, preservando o plural morfológico de שָׁמַיִם em português corrente.
theological_decisions:
- issue: Sentido de קֹנֵה no título divino
  choice: possuidor dos céus e da terra
  alternative: criador dos céus e da terra
  rationale: קנה admite os sentidos de possuir/adquirir e, em certos contextos, criar. A tradução principal mantém o sentido lexical de posse, enquanto a nota registra a leitura criacional legítima, preservando a tensão sem impor uma conclusão mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação narrativa foi preservada, e a fórmula “Bendito seja” mantém o tom solene da bênção. As notas estão posicionadas junto aos termos a que se referem.
