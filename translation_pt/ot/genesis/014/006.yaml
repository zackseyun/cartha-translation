base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: pt
  text: e os horeus nos seus montes de Seir, até El-Parã[a], que fica junto ao deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “El Parã”; possivelmente “a árvore de Parã”, se o nome for entendido etimologicamente, e não como um topônimo fixo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: e os
  rationale: A conjunção e o marcador de objeto dão continuidade à série dos povos derrotados; o verbo é recuperado do contexto anterior.
- source_word: הַחֹרִי
  choice: os horeus
  rationale: Gentílico coletivo referente ao povo conhecido como horeus; esta é a forma tradicional e inteligível em português.
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: nos montes de Seir, onde habitavam
  rationale: O texto diz literalmente 'nos seus montes, Seir'. A formulação portuguesa preserva a referência possessiva aos montes dos horeus sem sugerir que 'Seir' seja uma pessoa.
- source_word: עַד
  choice: até
  rationale: Expressa naturalmente o limite geográfico da campanha.
- source_word: אֵיל פָּארָן
  choice: El-Parã
  rationale: Tratado no texto principal como topônimo, sem impor a possível interpretação etimológica de אֵיל como árvore.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: que fica junto ao deserto
  rationale: Localiza El-Parã em relação ao deserto e conserva o sentido espacial amplo de עַל de modo natural em português.
