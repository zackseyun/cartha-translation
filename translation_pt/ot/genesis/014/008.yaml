  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: pt
  text: Então saíram o rei de Sodoma, o rei de Gomorra, o rei de Admá, o rei de Zeboim e o rei de Belá (isto é, Zoar), e tomaram posição para a batalha com eles[a] no vale de Sidim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra eles”. A expressão hebraica diz literalmente “com eles, batalha”; no contexto, indica que entraram em combate contra eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então saíram
  rationale: O waw consecutivo faz a narrativa avançar. Embora o verbo hebraico esteja no singular, ele antecede um sujeito composto; o plural é natural e claro em português.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente corrente do título, repetido para conservar a cadência e a estrutura do hebraico.
- source_word: סְדֹם
  choice: Sodoma
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: עֲמֹרָה
  choice: Gomorra
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: אַדְמָה
  choice: Admá
  rationale: Transliteração portuguesa que representa a tonicidade indicada pela vocalização hebraica.
- source_word: צביים
  choice: Zeboim
  rationale: Forma consagrada em traduções bíblicas portuguesas e adequada à vocalização do nome hebraico.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Belá (isto é, Zoar)
  rationale: A expressão identifica Belá com Zoar; os parênteses apresentam naturalmente a informação explicativa.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: tomaram posição para a batalha
  rationale: No contexto militar, ערך denota dispor ou organizar forças em ordem de combate. A formulação é atual, clara e preserva essa nuance.
- source_word: אִתָּם
  choice: com eles
  rationale: Conserva o valor formal da preposição hebraica sem explicitar além do texto a relação adversativa, que já é sugerida pelo contexto de batalha.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: no vale de Sidim
  rationale: ‘Vale’ é o equivalente português corrente de עֵמֶק, e ‘Sidim’ translitera o topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos topônimos bíblicos. A repetição de “o rei de” acompanha a cadência do hebraico, enquanto a concordância no plural torna natural em português o verbo hebraico singular que antecede o sujeito composto.
