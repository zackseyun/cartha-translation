base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: pt
  text: 'E aconteceu nos dias de Anrafel, rei de Sinar, Arioque, rei de Elasar, Quedorlaomer, rei de Elão, e Tidal, rei de Goim[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rei das nações”. A palavra hebraica goyim geralmente significa “nações”, mas aqui pode funcionar como nome de lugar, em paralelo com os outros títulos reais do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: A forma narrativa introduz o cenário do relato. A tradução conserva a conjunção e evita uma formulação arcaica.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Reproduz de modo natural a fórmula temporal hebraica e mantém seu tom narrativo solene.
- source_word: אַמְרָפֶל
  choice: Anrafel
  rationale: Transliteração consagrada e adaptada à ortografia portuguesa do nome próprio.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: rei de Sinar
  rationale: Traduz diretamente a relação de construção entre o título real e o topônimo.
- source_word: אַרְיוֹךְ
  choice: Arioque
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: rei de Elasar
  rationale: Tradução direta do título seguida da transliteração do topônimo.
- source_word: כְּדָרְלָעֹמֶר
  choice: Quedorlaomer
  rationale: Forma tradicional em português, reconhecível e compatível com a pronúncia portuguesa.
- source_word: מֶלֶךְ עֵילָם
  choice: rei de Elão
  rationale: Emprega a forma portuguesa estabelecida do topônimo bíblico עֵילָם.
- source_word: וְתִדְעָל
  choice: e Tidal
  rationale: Traduz a conjunção e translitera diretamente o nome próprio.
- source_word: מֶלֶךְ גּוֹיִם
  choice: rei de Goim[a]
  rationale: No paralelismo da lista de reis, גּוֹיִם pode funcionar como designação territorial. A transliteração preserva essa leitura provável, enquanto a nota registra o sentido lexical comum, sem eliminar a ambiguidade.
