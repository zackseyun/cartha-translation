source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: pt
  text: Não tomarei nada, a não ser o que os jovens comeram[a] e a parte dos homens que foram comigo — Aner, Escol e Manre. Que eles recebam a parte que lhes cabe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os servos” ou “os auxiliares”. A palavra hebraica pode designar jovens ou pessoas que servem e acompanham alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “Eles receberão a parte que lhes cabe”. A forma hebraica também pode ser entendida como futuro simples, embora o contexto favoreça uma permissão.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Não tomarei nada, a não ser
  rationale: A expressão exceptiva depende da recusa formulada no versículo anterior; a tradução explicita o verbo subentendido. “A não ser” transmite naturalmente a restrição reforçada por רַק sem criar uma redundância artificial em português.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: o que os jovens comeram
  rationale: נְעָרִים pode designar jovens ou servidores/auxiliares. “Jovens” preserva o sentido lexical mais transparente, enquanto a nota registra a alternativa contextual.
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: e a parte dos homens
  rationale: חֵלֶק indica a parte ou porção devida na divisão dos despojos; “parte” é claro e corrente em português.
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: que foram comigo
  rationale: Mantém de modo natural a imagem verbal de הלך e identifica os aliados que acompanharam Abrão.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aner, Escol e Manre
  rationale: Transliteração portuguesa clara dos nomes próprios hebraicos.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Que eles recebam a parte que lhes cabe
  rationale: O imperfeito é entendido contextualmente como permissão ou concessão, não como simples previsão. “Recebam” soa mais idiomático na distribuição de despojos, e “que lhes cabe” explicita sem excesso o sufixo possessivo de חֶלְקָם.
theological_decisions:
- issue: Continuação implícita da recusa do versículo anterior
  choice: Explicitar “Não tomarei nada”
  alternative: 'Conservar um fragmento dependente: “A não ser o que...”'
  rationale: O hebraico inicia com uma expressão exceptiva ligada à declaração anterior. A explicitação torna o período completo em português sem alterar a postura de Abrão diante dos despojos.
- issue: Valor modal de יִקְחוּ
  choice: 'Permissão: “Que eles recebam”'
  alternative: 'Futuro simples: “Eles receberão”'
  rationale: No contexto, Abrão distingue sua própria renúncia do direito de seus aliados, favorecendo uma concessão permissiva, embora a forma verbal também possa ser lida como futuro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A tradução preserva a estrutura exceptiva, evita o pleonasmo pouco natural “exceto somente” e mantém em nota as ambiguidades lexicais e modais genuínas.
