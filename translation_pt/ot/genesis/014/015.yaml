base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: pt
  text: Durante a noite, ele e seus servos se dividiram para atacá-los, golpearam-nos e os perseguiram até Hobá, que fica ao norte de Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: se dividiram para atacá-los
  rationale: O verbo expressa a divisão do grupo em destacamentos, enquanto עֲלֵיהֶם indica ação hostil contra o inimigo; a formulação torna explícita essa relação sem acrescentar uma tática não declarada.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido amplo de עבד e evita restringi-lo a 'homens' ou 'soldados', embora neste contexto participem do combate.
- source_word: וַיַּכֵּם
  choice: derrotaram-nos
  rationale: No contexto militar, נכה pode significar golpear, abater ou derrotar. 'Derrotaram-nos' comunica o resultado sem afirmar que todos foram mortos.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: ao norte de Damasco
  rationale: Literalmente 'à esquerda de Damasco'; na orientação antiga voltada para o leste, a esquerda corresponde ao norte. A direção geográfica é mais clara em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem temporal natural. Mantém 'servos' e o topônimo 'Hobá', evitando interpretações confessionais ou detalhes militares não presentes no hebraico.
