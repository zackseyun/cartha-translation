  text: כָּל אֵ֨לֶּה֙ חָֽבְר֔וּ אֶל עֵ֖מֶק הַ/שִּׂדִּ֑ים ה֖וּא יָ֥ם הַ/מֶּֽלַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: pt
  text: Todos estes se uniram no vale de Sidim, isto é, o Mar Salgado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, pelo nome posterior, o Mar Morto.
    reason: Registra a designação posterior e amplamente conhecida sem substituí-la à expressão hebraica no texto principal.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Todos estes
  rationale: Mantém a expressão coletiva do hebraico sem acrescentar “reis”, substantivo apenas inferido do contexto.
- source_word: חָבְרוּ
  choice: se uniram
  rationale: Expressa naturalmente o sentido Qal de juntar-se ou associar-se, sem tornar explícita uma aliança político-militar além do que o verbo exige.
- source_word: אֶל
  choice: 'no'
  rationale: Embora a preposição costume indicar movimento em direção a, com o verbo de reunião ela apresenta aqui o local em que se uniram; “no” é idiomático em português.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: vale de Sidim
  rationale: Traduz עֵמֶק por “vale” e translitera o topônimo שִׂדִּים de modo corrente em português.
- source_word: הוּא
  choice: isto é
  rationale: Comunica a função explicativa e identificadora do pronome nesta construção.
- source_word: יָם הַמֶּלַח
  choice: o mar de Sal
  rationale: Reproduz o nome hebraico com naturalidade em português e preserva a prioridade do texto-fonte, deixando o nome posterior mais conhecido para a nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção direta. “Todos estes” preserva a referência contextual sem explicitação indevida; “mar de Sal” mantém o nome bíblico e a nota oferece a identificação posterior.
