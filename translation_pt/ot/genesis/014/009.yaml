  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: pt
  text: Quedorlaomer, rei de Elão; Tidal, rei de Goim[a]; Anrafel, rei de Sinar; e Arioque, rei de Elasar — quatro reis contra os cinco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tidal, rei das nações”. O hebraico גּוֹיִם pode ser entendido como o substantivo comum “nações”, mas aqui também pode ser um nome de lugar, “Goim”.'
    reason: Leitura alternativa do hebraico, que pode ser substantivo comum ou topônimo.
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: contra
  rationale: Na construção resumitiva do relato de batalha, a segunda ocorrência introduz o grupo adversário; “contra” explicita naturalmente essa relação em português.
- source_word: כְּדָרְלָעֹמֶר
  choice: Quedorlaomer
  rationale: Transliteração aportuguesada e tradicional do nome pessoal hebraico.
- source_word: מֶלֶךְ עֵילָם
  choice: rei de Elão
  rationale: Reprodução direta da cadeia construta, com a forma portuguesa tradicional do topônimo.
- source_word: תִדְעָל
  choice: Tidal
  rationale: Transliteração do nome pessoal, sem tentar identificá-lo historicamente.
- source_word: גּוֹיִם
  choice: Goim
  rationale: No título régio, o termo pode funcionar como topônimo. A transliteração preserva essa leitura no texto principal, enquanto a possível leitura como substantivo comum é registrada em nota.
- source_word: אַמְרָפֶל
  choice: Anrafel
  rationale: Forma aportuguesada tradicional do nome pessoal.
- source_word: שִׁנְעָר
  choice: Sinar
  rationale: Mantém o topônimo hebraico em forma portuguesa, sem substituí-lo por uma identificação histórica como Babilônia.
- source_word: אַרְיֹוךְ
  choice: Arioque
  rationale: Forma aportuguesada tradicional do nome pessoal.
- source_word: אֶלָּסָר
  choice: Elasar
  rationale: Translitera o topônimo sem impor uma identificação geográfica conjectural.
- source_word: אַרְבָּעָה מְלָכִים
  choice: quatro reis
  rationale: Tradução direta da expressão numeral.
- source_word: הַחֲמִשָּׁה
  choice: os cinco
  rationale: Preserva a formulação concisa do hebraico, em que “reis” fica subentendido pelo contexto imediato.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas aportuguesadas correntes dos nomes. Os pontos e vírgulas distinguem os quatro títulos régios, e o travessão introduz o resumo enfático do confronto. O marcador da nota foi colocado após “Goim”, termo ao qual a ambiguidade pertence.
