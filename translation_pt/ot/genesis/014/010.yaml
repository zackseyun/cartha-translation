  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: pt
  text: O vale de Sidim estava cheio de poços de betume[a]. Os reis de Sodoma e Gomorra fugiram e caíram ali[b], enquanto os demais fugiram para a região montanhosa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poços de asfalto”; o termo hebraico se refere a poços de betume.
    reason: lexical_alternative
  - marker: b
    text: Isto é, caíram ali no vale de Sidim, provavelmente nos poços de betume. O hebraico, porém, não explicita em que caíram.
    reason: ambiguity_preservation
  - marker: c
    text: Ou “para as montanhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: o vale de Sidim
  rationale: Traduz עֵמֶק por “vale” e mantém Sidim como nome próprio do lugar, em formulação natural em português.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: estava cheio de poços de betume
  rationale: A repetição de בֶּאֱרֹת indica grande quantidade de poços; “cheio de” comunica isso de modo idiomático. “Betume” é preciso e compreensível para חֵמָר.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: Equivalente corrente e conciso de נוס neste contexto narrativo.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: os reis de Sodoma e Gomorra
  rationale: Embora מֶלֶךְ esteja formalmente no singular, os verbos no plural e o contexto indicam os dois reis, um de cada cidade.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: caíram ali
  rationale: Preserva o sentido normal de נפל e a falta de objeto explícito no hebraico, sem afirmar no texto que caíram dentro dos poços.
- source_word: וְהַנִּשְׁאָרִים
  choice: os demais
  rationale: Expressa naturalmente em português aqueles que restaram em contraste com os reis mencionados.
- source_word: הֶרָה
  choice: para a região montanhosa
  rationale: O substantivo הַר com terminação direcional aponta para terreno elevado; “região montanhosa” é geograficamente natural, embora “montanhas” também seja possível.
- source_word: נָסוּ
  choice: fugiram
  rationale: Mantém coerência com a ocorrência anterior do mesmo verbo e é adequado ao contexto de derrota militar.
theological_decisions: []
