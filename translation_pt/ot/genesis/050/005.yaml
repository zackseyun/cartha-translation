base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: pt
  text: 'Meu pai me fez jurar, dizendo: ‘Eis que estou morrendo. No túmulo que cavei para mim na terra de Canaã, ali você me sepultará.’ Agora, pois, peço que me deixe subir para sepultar meu pai; depois voltarei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: me fez jurar
  rationale: 'Reproduz naturalmente a construção causativa hebraica: o pai exigiu de José um juramento.'
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém o marcador enfático e solene que introduz a declaração de Jacó.
- source_word: כָּרִיתִי
  choice: cavei
  rationale: Preserva o sentido direto do verbo no texto massorético, embora o contexto também possa permitir a ideia de preparar ou adquirir um túmulo.
- source_word: אֶעֱלֶה נָּא
  choice: peço que me deixe subir
  rationale: Expressa o pedido cortês indicado por נָא e conserva o uso geográfico convencional de “subir” para ir de volta a Canaã.
- source_word: וְאָשׁוּבָה
  choice: depois voltarei
  rationale: Comunica claramente a promessa de José de retornar ao Egito após o sepultamento.
