base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: pt
  text: Seus filhos o levaram para a terra de Canaã e o sepultaram na caverna do campo de Macpela, campo que Abraão havia comprado de Efrom, o hitita, como propriedade para sepultura, em frente a Manre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de Manre” ou “defronte de Manre”. A expressão hebraica indica a posição do campo em relação a Manre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: o levaram
  rationale: No contexto, נשׂא descreve o transporte do corpo de Jacó. “Levaram” é natural em português e comunica o movimento até Canaã sem sugerir que apenas o ergueram.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O hebraico emprega o plural masculino “filhos”, adequado ao contexto imediato dos filhos de Jacó.
- source_word: אַרְצָה כְּנַעַן
  choice: para a terra de Canaã
  rationale: Reproduz tanto o substantivo “terra” quanto a direção indicada pela terminação hebraica.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: “Sepultaram” é claro, digno e apropriado à narrativa funerária.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: na caverna do campo de Macpela
  rationale: 'Mantém de modo legível a cadeia construta hebraica: caverna, campo e Macpela.'
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: campo que Abraão havia comprado
  rationale: O objeto explícito de קנה é “o campo”. A repetição de “campo” em aposição verte naturalmente a construção resumptiva hebraica e evita a ideia equivocada de que o campo teria sido meio de pagamento.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: como propriedade para sepultura
  rationale: אֲחֻזָּה indica propriedade ou posse estabelecida, enquanto קֶבֶר define sua finalidade funerária.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: de Efrom, o hitita
  rationale: A preposição marca o vendedor, e “hitita” é a designação moderna corrente de חִתִּי.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: em frente a Manre
  rationale: Expressa a relação espacial de estar diante ou defronte de Manre sem reduzi-la à mera proximidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A aposição “campo que Abraão havia comprado” preserva o objeto explícito do verbo hebraico e evita a ambiguidade artificial de dizer que a caverna foi comprada “com o campo”.
